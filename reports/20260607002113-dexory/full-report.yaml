      - number: '6.4'
        title: Retention visibility, concentration, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Dexory's public customer story is strong enough to prove real adoption, but not strong enough to fully
              underwrite durability or concentration risk. There is repeat-usage evidence at the operational level:
              Maersk moved from biweekly to daily full checks, ODW describes continuous visibility and multiple weekly
              scans, and both EMG Maersk and Linfox describe daily discrepancy-resolution workflows rather than one-off
              pilots. But the classic SaaS or logistics-retention metrics that matter most for investment diligence are
              missing. No reviewed source disclosed NRR, GRR, gross churn, renewal term, cohort retention, or revenue
              concentration by customer. Independent satisfaction proof is also thinner than the marketing footprint
              implies. FeaturedCustomers surfaces only 15 visible testimonials, 18 case studies, and 5 videos, most of
              them locked or summarized rather than independently inspectable in full. The deepest named proof is
              concentrated in a small set of logistics accounts, and official pages still rely heavily on logos whose
              production status or measured outcomes are not public. That means the chapter clears the adoption gate,
              but concentration, renewal quality, and breadth of production use remain material diligence gaps.
