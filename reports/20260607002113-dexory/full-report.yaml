  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module stack
        blocks:
          - type: paragraph
            body: >-
              Dexory's product should be understood as a warehouse-intelligence stack delivered into live customer
              operations, not as a standalone autonomous mobile robot. The commercial promise is a continuous digital
              twin of the warehouse that replaces periodic manual counts, floor walks, and exception chasing with a
              daily or near-real-time system of record. The robot is the data-collection edge: it scans racks, block
              stacks, and pick faces, captures barcodes and images, and feeds DexoryView, the software layer where
              operators inspect discrepancies, act on risks, and measure utilisation. That product definition is
              consistent across Dexory's official home, solutions, and architecture materials, and is reinforced by
              independent interviews that describe Dexory as a full-stack company building both robots and software
              in-house.


              The module map is now broad enough to matter strategically. DexoryView Integrity is the core accuracy
              layer, covering pick counts, block counts, double-deep scanning, rental pallet tracking, item search,
              client segmentation, and task management. Storage Health adds AI-based condition monitoring for damaged
              racking, unstable pallets, shrink wrap, and hygiene issues. Optimise adds layout, congestion,
              replenishment, and slotting workflows. Adapt, announced in 2026, adds a reasoning layer that turns the
              digital twin from a visibility surface into a system that can explain root causes and recommend next
              actions. Publicly, differentiation therefore rests less on a single feature than on a tightly coupled
              hardware-software stack that can scan, reconcile, prioritise, and increasingly recommend action from the
              same operating data.
            claimRefs:
