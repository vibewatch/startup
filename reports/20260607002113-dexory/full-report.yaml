      - number: '7.4'
        title: Financing, valuation reset, and monitoring triggers
        blocks:
          - type: paragraph
            body: >-
              The public capital structure makes valuation-reset risk hard to ignore. Dexory raised $80 million in 2024,
              added £8.5 million from the British Business Bank into an ongoing Series C in 2026, and kept filing new
              share allotments and governance changes through spring 2026. Meanwhile the 2025 accounts disclose venture
              debt, all-asset security, negative pledges, and warrants whose value depends on future financing or exit
              pricing. That combination is not unusual for a fast-scaling hardware company, but it narrows downside
              room: if pilot conversions slow, deployment costs stay high, or the logistics cycle softens, the next
              round may price off operational milestones rather than category narrative.


              Execution risk rises with organizational complexity. The company says it quadrupled in size since 2022,
              now spans roughly 200 people across seven countries, opened a 50,000-square-foot Nashville base, and hired
              a CFO to build global reporting and investor-relations capacity. Those are sensible moves, but they also
              show Dexory is transitioning from founder-led product expansion to operational discipline. The right kill
              criteria are therefore monitorable: rollout pace beyond first sites, customer expansion beyond marquee
              logos, financing terms versus burn, and any safety or data incident that weakens trust. Investors do not
              need proof that warehouses have blind spots. They need proof that Dexory can close them repeatedly,
              profitably, and without creating new ones in capital structure or compliance.
