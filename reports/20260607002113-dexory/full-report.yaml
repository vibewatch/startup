      - number: '3.2'
        title: Capability and Packaging Comparison
        blocks:
          - type: paragraph
            body: >-
              Dexory's public differentiation is less about being the only autonomous warehouse-intelligence product and
              more about where it places the commercial and operational burden. Dexory says it can be live in about two
              weeks on a subscription basis with no capex and no infrastructure changes, which is a materially lighter
              wedge than Exotec or AutoStore-style installed systems. That said, Gather and Corvus publicly pitch
              similarly low-friction overlays, while Verity pitches a more enterprise-polished warehouse-intelligence
              stack with 150-plus facilities and explicit ROI targets. Locus competes from a different angle: it sells
              labor-productivity and fulfillment automation, not digital-twin inventory intelligence, but those
              workflows can dominate the same buyer conversation when fulfillment throughput matters more than
              continuous stock accuracy. Public pricing disclosure is weak almost everywhere. Dexory gives the clearest
              packaging signal, while most peers stay sales-led, leaving buyers to compare outcomes and integration
              effort rather than list prices. That opacity makes capability mapping and deployment posture more
              important than headline pricing in early competitive screening.
