  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical deployment and capital-intensity risk
        blocks:
          - type: paragraph
            body: >-
              Dexory should be underwritten as a full-stack robotics deployment company, not a pure SaaS analytics
              layer. Its own materials say value comes from daily autonomous scans, 14-metre / 10,000-location coverage,
              and a next-generation 60-foot robot that feeds DexoryView and newer modules like Storage Health. That
              architecture creates real technical differentiation, but it also creates familiar hardware risks:
              visibility can still break at double-deep or blocked locations, warehouse networking is heterogeneous, and
              field uptime depends on calibration, spares, support, and safe operation around people and machinery.
              TechCrunch’s early coverage explicitly noted the system cannot perfectly identify items when goods sit
              behind each other, and Dexory’s later product pages effectively confirm the edge-case burden by adding
              Double Deep, Block Count, and Layer Count features to patch blind spots.


              The financing data reinforces that this is a capital-intensive execution story. FY2025 turnover rose to
              about £3.6 million, but the same accounts show a £22.6 million pre-tax loss, nearly £4.0 million of R&D,
              roughly £7.7 million of tangible-asset additions, and inventory explicitly tied to robots and related
              equipment built for deployment. Venture debt, warrants, and charges over all group assets mean Dexory
              still needs scale to outrun its hardware and service cost base. The investment question is not whether the
              product can create ROI in a friendly site; public case studies show it can. The harder question is whether
              Dexory can industrialize deployment, uptime, and support economics across many heterogeneous sites before
              financing terms or customer patience tighten.
            claimRefs:
