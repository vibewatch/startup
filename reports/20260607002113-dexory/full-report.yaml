      - number: '2.2'
        title: Sizing lenses and constrained market estimate
        blocks:
          - type: paragraph
            body: >-
              Public data supports a large and growing macro market but not a clean Dexory-sized category. Mordor sizes
              global warehouse automation at $34.17 billion in 2026 and $65.74 billion by 2031, while Fortune and
              Coherent place the narrower warehouse robotics market at $7.35-10.01 billion in 2026. Those are not
              contradictory so much as differently bounded: automation includes software, conveyors, and broader
              systems; robotics is the mechanized subset. Demand remains supported by end-market throughput. The U.S.
              Census says retail e-commerce reached $326.7 billion in Q1 2026 and 16.9% of retail sales, while the BLS
              shows more than 1.84 million people employed in U.S. warehousing and storage. Mordor also says 3PLs
              represented 38.96% of automation spend in 2025, implying roughly $11.7 billion of spend from
              outsourced-warehouse owners and operators. The hard gap is that no public dataset isolates warehouse
              intelligence or autonomous inventory scanning as its own line item, so SAM and SOM must stay
              low-confidence and evidence-constrained.
