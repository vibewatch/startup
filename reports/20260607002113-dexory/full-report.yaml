companyProfile:
  summary: >-
    Dexory is a UK warehouse-intelligence company founded in 2015 as BotsAndUs and rebranded in 2022, now selling
    autonomous scanning robots plus the DexoryView software platform for real-time warehouse visibility, digital-twin
    analytics, and operational optimization. Public evidence shows a founder-led business with a Wallingford
    headquarters, a Nashville expansion base, blue-chip logistics and industrial references, and more than $280 million
    of disclosed financing across pre-seed through Series C plus a 2026 British Business Bank extension. The main public
    diligence limitation is not product relevance but economic opacity: the company does not publicly disclose current
    ARR, gross margin, retention, concentration, or a post-money valuation for the 2025-2026 financing cycle.
