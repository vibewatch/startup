      - number: '1.3'
        title: Capital, stakeholders, and commercial proof
        blocks:
          - type: paragraph
            body: >-
              Dexory’s financing record is now broad enough to anchor later chapters without much guesswork on round
              sequence, even if exact valuation step-ups remain under-disclosed. Company-owned history pages show a
              progression from a $2.6 million pre-seed in 2020 to a $13 million seed in 2022, a $19 million Series A in
              2023, an $80 million Series B in 2024, and a $165 million Series C in October 2025. Independent coverage
              adds syndicate detail: Lakestar and Maersk Growth were early conviction backers, Atomico led the Series A,
              DTCP led the Series B, and Eurazeo plus the British Business Bank supported the expanded Series C. A
              conservative disclosed tally is already above $280 million before translating the 2026 £8.5 million
              add-on, which is enough to classify Dexory as heavily financed for this category.


              Commercial proof is stronger than the governance disclosure. Dexory publicly names blue-chip customers and
              partner channels, and the proof points are not limited to logo walls. Maersk expanded a successful pilot
              into broader U.K. rollout, ODW cites 20,000-plus locations per mission, DCL reported materially higher
              accuracy and labor savings, and Romark framed its 2026 deployment as expandable across facilities. Partner
              pages and announcements also show a channel ecosystem through Körber, C5MI, Raymond Storage Concepts, and
              Peak Technologies. That mix implies Dexory is selling both direct operational outcomes and a platform
              others can resell or integrate, which is consistent with its RaaS-plus-SaaS positioning.
