      - number: '7.3'
        title: Safety, regulatory, and data-governance risk
        blocks:
          - type: paragraph
            body: >-
              Safety and compliance risk is central because Dexory’s robots move through active warehouses, scan at
              height, and feed cloud-based analytics across customer sites. OSHA says robot accidents frequently happen
              during non-routine conditions and notes there is still no robotics-specific OSHA standard, while HSE
              guidance emphasizes segregation of people and vehicles, operator training, and safe traffic routes. The EU
              Machinery Regulation was updated to address autonomy, sensor systems, learning, and cyber interference.
              Dexory’s own product marketing around Storage Health is useful here: it highlights rack damage, unstable
              items, hanging shrink wrap, and pallet defects as real warehouse hazards and positions continuous scanning
              as a mitigation layer. That helps the thesis, but it also confirms that Dexory is exposed to a failure
              mode where a missed hazard or robot interaction incident could become both a customer-trust and liability
              event.


              Data governance adds another layer. Dexory’s privacy policy references UK/EU GDPR and multiple
              non-European privacy regimes, names both AWS and Google Cloud Platform among external providers, and
              acknowledges sharing data with legal, audit, and marketing counterparties. The security disclosure page
              shows basic vulnerability handling and safe harbour, but public evidence still stops short of
              independently disclosed security certifications or regulator correspondence. For a company operating
              inside customer warehouses and integrating with WMS data, legal exposure can arrive through product
              safety, workplace operations, or data handling rather than through a single obvious regulator.
            claimRefs:
