      - number: '7.2'
        title: Competition, customer concentration, and cycle risk
        blocks:
          - type: paragraph
            body: >-
              Dexory’s public customer proof is credible but concentrated. Named references span Maersk, DCL, Romark,
              ODW, and other large logistics or industrial operators, yet much of the proof is site-specific,
              trial-based, or rollout-stage rather than clearly disclosed enterprise-wide standardization. Maersk
              started with a UK trial, DCL publicly referenced one robot in one of six facilities, and Romark framed the
              2026 deployment as a first site with expansion potential. That does not negate product value, but it means
              public proof is better at demonstrating pilot ROI than revenue durability or low concentration. The
              absence of disclosed revenue mix, renewal data, top-customer share, or standard enterprise SLA terms is
              therefore a real underwriting gap.


              Competition and the cycle both matter. TechCrunch described warehouse inventory automation as a crowded
              field, Interact says competition between shuttle and mobile systems is intensifying, and rival models from
              Exotec and Locus underline that customers can choose between denser fixed automation, flexible AMRs, and
              alternative inventory modalities. At the same time, CBRE says the logistics sector has shifted from
              expansion to consolidation because labor, transport, and energy costs have surged, while automation
              projects increasingly make economic sense only at larger sites. Interact adds that tariffs and steel costs
              have inflated automation pricing. For Dexory, that means customer urgency around efficiency is real, but
              so is the risk that mid-market or cautious operators delay buying, narrow pilots, or pressure price
              exactly when Dexory needs higher utilization to justify hardware-heavy growth.
