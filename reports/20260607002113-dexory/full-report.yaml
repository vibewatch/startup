      - number: '8.5'
        title: Diligence gates and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The path from research-more to proceed is straightforward but evidence-heavy. A prospective investor must
              see current ARR, software-versus-hardware mix, gross margin, burn, debt covenants, and customer
              concentration. Without those, capital-structure risk is impossible to price and any round participation is
              really a bet on narrative rather than underwritten economics. The most important diligence ask is not
              another customer logo but cohort quality: renewals, NRR, and concentration among the largest accounts. The
              second is financing terms, because growth debt and undisclosed preferences can convert a good operating
              story into a weak equity outcome. The third is ROI generalization across the installed base. If Dexory can
              prove that its best case studies are typical rather than exceptional, the valuation case improves
              materially. If not, the likely exit path is a strategic sale or another private financing cycle rather
              than a near-term IPO, and entry price must reflect that narrower outcome set.
