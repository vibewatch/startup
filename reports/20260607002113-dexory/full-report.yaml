  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed top line
        blocks:
          - type: paragraph
            body: >-
              Dexory’s financial record is still extremely thin, but the March 2025 group accounts at least reveal that
              the company is no longer a pure pre-revenue robotics story. The verified top line is £3.55 million, and
              the composition matters more than the absolute amount: £2.86 million came from subscription fees and £0.69
              million from implementation fees. That means roughly 80.4% of disclosed revenue was recurring subscription
              revenue and roughly 19.6% was implementation work. For a warehouse-robotics vendor, that mix is
              directionally healthier than a model dominated by one-off deployment projects, because it implies
              customers are paying for an ongoing visibility layer rather than only for installation work.


              Even so, the product and customer evidence still point to a blended hardware-software offer, not a pure
              SaaS company. Dexory’s own materials describe autonomous robots as the data-capture layer and DexoryView
              as the operational intelligence layer, while the Why Dexory page says customers can access the full-stack
              solution without upfront investment and on a fixed subscription that bundles software updates, monitoring,
              and hardware replacement. Diginomica’s interview reinforces that positioning by describing the product as
              a subscription model that installs quickly and sells information rather than goods movement. That
              combination is commercially attractive because it lowers customer capex friction, but it also makes
              realized revenue recognition and gross-profit quality much harder to assess from public sources.


              The GTM story is therefore only partially visible. Customer logos, official case studies, and press
              releases suggest Dexory is winning multi-site logistics and manufacturing deployments, and City A.M. says
              directors tied FY2025 revenue growth to new deployments and expansion of existing contracts. What remains
              missing is the exact contract architecture: list pricing is not public, contract length is not public,
              module attach rates are not public, and the share of subscription revenue that is truly recurring versus
              bundled deployment support is not public. The top line is real; the underwriting-grade revenue model is
              still mostly private.
