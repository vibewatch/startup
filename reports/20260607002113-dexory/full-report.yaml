      - number: '1.4'
        title: Milestones, disclosure limits, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The reusable chronology is coherent. Dexory was founded in 2015 as BotsAndUs, entered logistics in 2021,
              launched a real-time warehouse robot in 2022, introduced DexoryView in 2023, closed successive Series A,
              B, and C rounds through 2025, then opened a 50,000 sq ft Nashville headquarters and launched both Storage
              Health and DexoryView Adapt in 2026. That sequence matters because it shows a business extending from raw
              data capture into a broader operating-system ambition for warehouses rather than remaining a single-use
              automation tool.


              The main adverse signals are not failed deployments or obvious legal crises in the reviewed source set.
              Instead, they sit in the public records and disclosure gaps. Companies House shows two MR01 charges in
              late 2025, director exits and an appointment effective around the same period, and repeated share-right
              changes in early 2026. Public materials still do not identify the charge lender terms, current board
              rights, exact ownership percentages, or current revenue and margin metrics. That leaves Dexory looking
              operationally credible but financially less transparent than its customer and product marketing would
              suggest. The right diligence stance is therefore not skepticism on whether a company exists or sells, but
              focused follow-up on capital structure, lender obligations, and whether public traction maps cleanly to
              economic quality.
