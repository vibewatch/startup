  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Status
      - Current revenue basis
      - Value / funding marker
      - Revenue multiple or signal
      - Relevance to Dexory
      - Limitation
    rows:
      - - Symbotic
        - Public
        - $2.51B TTM
        - $26.57B market cap
        - ~10.6x
        - Best public warehouse-robotics platform benchmark for premium automation exposure.
