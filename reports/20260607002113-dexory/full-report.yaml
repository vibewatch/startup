        title: Customer mix, verticals, and geographic spread
        blocks:
          - type: paragraph
            body: >-
              Dexory's clearest public customer fit is the warehouse operator rather than the end-consumer brand. The
              deepest references come from third-party logistics providers and logistics operators that need higher
              inventory accuracy, faster cycle counting, and less disruption to live warehouse throughput. ODW
              Logistics, Romark Logistics, Maersk, and Linfox BevChain all fit that pattern: the buyer is usually a
              warehouse or automation leader, the daily user is operations or inventory staff, and the economic payer is
              the site or network owner trying to protect OTIF, reduce labor drag, and avoid claim disputes. Public
              sector spread is broader than the named deep cases alone suggest. Independent coverage and Dexory's own
              segment pages place the company across logistics, retail and ecommerce, manufacturing, pharmaceuticals,
              and air cargo, with logo-level references to DB Schenker, Yusen Logistics, GE Appliances, Vente-Unique,
              and other operators. The geographic footprint is also wide in public materials, spanning the UK,
              continental Europe, North America, Australia, and APAC. That said, the evidence depth is uneven: only a
              handful of accounts have measurable outcomes, while many other names appear only as logos or in broad
              customer lists.
