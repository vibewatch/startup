  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 试点到网络化部署的转化失败
        - 客户扩张公告和管理层尽调
        - 12 个月内少于两个标杆试点转为多站点部署，或新的中标案例不再出现公开 ROI 说法
        - 下调增长假设，并把验证视为狭窄的试点经济性，而不是可复制的企业级标准化。
      - - 硬件 / 服务负担压过软件杠杆
        - 对在线率、服务工时和备件成本的私下尽调
        - 部署扩张后，车队在线率、MTBF 或单台机器人支持工时恶化
        - 将 Dexory 视为服务属性更重的工业企业，并压缩估值倍数。
      - - 安全或合规事件
        - 监管方、保险方或客户事故披露
        - 任何与 Dexory 部署相关的重伤、货架倒塌、召回或监管通知
        - 暂停承销，直到根因、补救措施和责任敞口清晰。
      - - 资本结构收紧
        - 融资文件和未来 Companies House 备案
        - 追加全资产担保债务、契约收紧，或定价明显弱于 2024 / 2026 年融资标记
        - 按估值重置承销，并降低下行情景信心。
      - - 客户集中度高于预期
        - 收入队列披露或管理层尽调
        - 前五大客户贡献超过 40% 收入，或单一客户支撑大多数公开验证和管线
        - 先打集中度折扣，并在投入前要求更强的流失 / 扩张证据。
      - - 物流周期再次走弱
        - 部署时间、客户预算节奏和仓库自动化订单数据
        - 3PL / 制造业客户群连续两个季度出现部署延期或预算冻结
        - 拉长现金需求时间、下调部署预测，并假设下一轮融资更慢。
    notes: 这些触发项把宽泛担忧转成真正能改变承销判断的尽调检查点，而不只是描述风险。
    claimRefs:
