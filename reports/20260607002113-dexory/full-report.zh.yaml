  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户组合、垂直行业与地域分布
        blocks:
          - type: paragraph
            body: >-
              Dexory 最清晰的公开客户契合点是仓库运营商，而不是终端消费品牌。最深的背书来自第三方物流服务商和物流运营商；这些客户需要更高库存准确性、更快循环盘点，并减少对实时仓库吞吐的扰动。ODW
              Logistics、Romark Logistics、Maersk 和 Linfox BevChain 都符合这一模式：买方通常是仓库或自动化负责人，日常用户是运营或库存员工，经济付款方是试图守住
              OTIF、降低人工拖累并避免索赔争议的站点或网络所有者。公开行业分布比少数具名深度案例更宽。独立报道和 Dexory 自有分行业页面显示，公司覆盖物流、零售与电商、制造、医药和航空货运；标识层面还提到 DB
              Schenker、Yusen Logistics、GE Appliances、Vente-Unique 和其他运营商。公开材料中的地域布局也很广，横跨英国、欧洲大陆、北美、澳大利亚和
              APAC。话虽如此，证据深度并不均衡：只有少数账户有可衡量结果，许多其他名字只出现在标识或宽泛客户列表中。
