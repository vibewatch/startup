          description: 客户推迟自动化 CapEx，或收窄铺开范围。
        - id: m2
          label: 试点扩张放慢
          description: 首站获胜未能转成网络级铺开。
        - id: m3
          label: 机器人利用率降低
          description: 相对于固定成本，硬件和现场团队使用不足。
        - id: m4
          label: 支持负担加重
          description: 复杂部署需要更多服务和集成投入。
        - id: m5
          label: 利润率 / 现金消耗压力
          description: 亏损持续，债务经济性更重要。
        - id: m6
          label: 有担保融资依赖
          description: 可能需要更多杠杆或更紧条款。
        - id: m7
          label: 估值重置风险
          description: 下一轮会按运营证明而不是叙事定价。
        - id: m8
          label: 安全或数据事故
          description: 产品、工作场所或数据事件会削弱客户信任。
        - id: m9
