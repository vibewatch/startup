        - $1B+ 系统销售额；100+ 客户站点；2024 年 3 月 850+ 名员工，2025 年 1 月团队 1,300+ 人
        - 优先考虑存储密度、拣选速度和吞吐量的大型仓库
        - 规模化装机基础和高密度存储自动化
        - 项目摩擦更高；解决存储 / 拣选多于叠加式智能
      - - Locus Robotics
        - AMR 履约编排
        - RaaS 式产品环境；客户案例称生产率提升 230% 到 300%
        - 聚焦拣选、上架、补货和劳动力灵活性的配送中心
        - 工作流覆盖强，WMS 集成灵活
        - 不是仓库数字孪生或全货架库存准确性产品
      - - Gather AI
        - 仓库智能叠加层 / 无人机和摄像头
        - 2026 年 $40M Series B 轮；累计融资 $74M；约 60 名员工
        - 希望在不替换现有系统情况下获得库存智能的仓库
        - 零基础设施改造叠加层；现成硬件；支持冷库
        - 公开定价仍不透明，运营人员仍需发起无人机任务
      - - Verity
        - 仓库智能平台
        - 全球部署 150+ 设施；声称近零流失
        - 寻求自主仓库数据和编排洞察的全球企业
        - 企业级仓库智能叙事和明确 ROI 主张
        - 公开定价和合同结构未披露
      - - Corvus Robotics
        - 库存无人机自主化
        - 具名客户名单包括 Southern Glazer's、Dermalogica、GNC、MSI、LAPP 和 Staci
        - 3PL、零售配送和制造业仓库
        - 无需新增基础设施的每日循环盘点自动化
        - 公开规模、定价和留存数据仍稀疏
      - - Simbe
        - 零售门店智能（相邻）
        - 2024 年 $50M Series C 轮；累计融资 >$100M；2023 年订阅基数增长 3 倍
        - 优化货架有货率和定价的食品杂货、会员店和零售品牌
        - 横跨库存、定价、促销和供应商的多模态门店智能
        - 聚焦零售货架，属于相邻市场而非直接面向仓库货架
      - - SAP EWM
        - 既有企业级 WMS
        - 大型企业装机基础；信任中心和合规界面公开
        - 在仓库和供应链控制上标准化采用 SAP 的企业
        - 套件内提供自动化控制、库位优化、库存透明度和信任姿态
        - 可视性只是更大平台中的一个模块，不是专用扫描原生产品
      - - Manhattan Active WMS
        - 既有云原生 WMS / WES
        - 引用数百个品牌；WMS 页面声称 17 次 Gartner 领导者
        - 优先考虑跨劳动力、机器人和运输的云原生编排企业
        - 可扩展 WMS/WES 编排，频繁更新
        - 套件优先经济性可能压过独立可视性 ROI 讨论
      - - Blue Yonder WMS
        - 既有 AI 驱动 WMS
        - 领导者主张，以及 Robotics Hub 和覆盖仓库运营的 AI 任务分配
        - 已处在 Blue Yonder 工作流中的零售、CPG 和物流运营商
        - 可捆绑执行、库位优化、劳动力和供应商中立机器人接入
        - 在自主扫描原生库存智能上不如 Dexory 专精
