  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局分层
        blocks:
          - type: paragraph
            body: >-
              Dexory 位于宽泛的仓库现代化版图中间，而不是一个干净的单一机器人类别。最接近的直接同行是 Gather AI、Verity、Corvus 等仓库智能覆盖层；这些公司都销售自主库存采集加分析，并与既有 WMS
              技术栈共存。相邻竞争来自 Exotec、Locus、AutoStore、GreyOrange、Geek+
              等自动化供应商；它们解决的是相邻买方问题——存储密度、拣选效率或编排——但仍可能吃掉同一笔资本或运营预算。既有软件压力来自 SAP EWM、Manhattan Active WMS 和 Blue
              Yonder；这些厂商已经掌握系统记录工作流，可以把可视化、AI 任务派发或机器人编排纳入更大的套件合同。Simbe
              并不是仓库货架竞争对手，但它展示了计算机视觉库存平台如何从计数准确性扩展到定价、陈列和供应商工作流。人工循环盘点和条码驱动的异常处理仍是真正的现状替代方案，也是所有这些供应商都声称能压缩的流程。
