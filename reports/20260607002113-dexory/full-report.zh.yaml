      - number: '7.2'
        title: 竞争、客户集中度与周期风险
        blocks:
          - type: paragraph
            body: >-
              Dexory 的公开客户证据可信，但集中度高。具名案例覆盖 Maersk、DCL、Romark、ODW 以及其他大型物流或工业运营商，但很多证据是单站点、试点或铺开阶段，而不是清楚披露的企业级标准化。Maersk
              从英国试点开始，DCL 公开提到六个设施中的一个设施部署了一台机器人，Romark 则把 2026 年部署描述为第一个站点且有扩张潜力。这并不否定产品价值，但意味着公开证据更擅长证明试点
              ROI，而不是收入耐久性或低集中度。未披露收入结构、续约数据、最大客户占比或标准企业级 SLA 条款，因此构成真实的投资判断缺口。


              竞争和周期都重要。TechCrunch 将仓库库存自动化描述为拥挤赛道，Interact 称穿梭车系统与移动系统之间竞争正在加剧，Exotec 和 Locus 的竞品模式也说明，客户可以在更密集的固定自动化、灵活
              AMR 和替代库存方案之间选择。与此同时，CBRE 表示，由于劳动力、运输和能源成本飙升，物流行业已经从扩张转向整合；自动化项目越来越只有在更大站点才具备经济性。Interact
              还补充说，关税和钢材成本推高了自动化定价。对 Dexory 而言，客户围绕效率的紧迫感确实存在，但风险也同样真实：正当 Dexory
              需要更高利用率来支撑硬件密集型增长时，中端市场或谨慎运营商可能推迟采购、缩小试点，或压低价格。
