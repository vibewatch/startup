        - id: tasks
          label: 异常解决
          detail: 团队纠正差异、调查风险，并改进布局或流程
        - id: outcomes
          label: 运营结果
          detail: 库存完整性更好、盘点更快、查找时间更少，客户服务执行更清晰
      edges:
        - from: manual
          to: wms
          label: 只有周期性更新
        - from: wms
          to: scan
          label: 加入连续物理验证
        - from: scan
