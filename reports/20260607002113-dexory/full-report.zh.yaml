  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从融资证据和商业证明走向继续研究建议的决策路径。
    claimRefs:
      - CV031
      - CV032
      - CV038
      - CV040
      - CV041
    data:
      nodes:
        - label: Dexory 投资决策
          detail: 仅从公开证据出发：融资结构、商业证明、可比公司组合，以及缺失的经济性。
          tone: neutral
        - label: 步骤 1：是否有真实商业证明？
          detail: 具名全球客户、ROI 轶事和 2026 年现场部署给出的答案是肯定的。
          tone: positive
        - label: 步骤 2：估值是否可观察？
          detail: 否。Series C 规模公开，但投后估值未公开。
          tone: risk
        - label: 步骤 3：资本结构是否重要？
          detail: 重要。Series B 和 Series C 都包含债务或扩大的债务额度。
          tone: risk
        - label: 步骤 4：可比公司能否支撑溢价定价？
          detail: 只有 Dexory 证明其经济性更接近 Descartes、Manhattan 或 Symbotic，而不是 Zebra 或 GXO，溢价才站得住。
          tone: neutral
        - label: 结果：继续研究
          detail: 只有完成 ARR、利润率、债务和集中度尽调后才推进；面对任何未披露轮次标记，要求价格保护。
          tone: risk
      edges:
        - from: Dexory investment decision
          to: 'Step 1: Is there real commercial proof?'
          label: 筛选业务质量
        - from: 'Step 1: Is there real commercial proof?'
          to: 'Step 2: Is valuation observable?'
          label: 是，但不完整
        - from: 'Step 2: Is valuation observable?'
          to: 'Step 3: Does capital stack matter?'
          label: 价格不透明，需要更深尽调
        - from: 'Step 3: Does capital stack matter?'
          to: 'Step 4: Can comps support premium pricing?'
          label: 只有完成结构审查后
        - from: 'Step 4: Can comps support premium pricing?'
          to: 'Outcome: RESEARCH-MORE'
          label: 没有经审计经济性，不要支持溢价条款
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 不同收入和倍数组合下的示意性估值结果。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV039
    data:
      items:
        - label: $25M × 6x
          value: 150
          detail: 若 Dexory 更接近低增长物流科技画像，这是悲观情景。
          tone: risk
        - label: $28.6M × 8x
          value: 229
          detail: 公开收入估计，并相对高端软件可比公司打私人市场折扣。
          tone: neutral
        - label: $30M × 9x
          value: 270
          detail: 如果收入略高于公开估计，这是基准入场点。
          tone: neutral
        - label: $35M × 10x
          value: 350
          detail: 上沿基准情景，需要可信的软件溢价。
          tone: positive
        - label: $35M × 12x
          value: 420
          detail: 乐观情景，需要软件式经济性和强留存。
          tone: positive
        - label: $40M × 14x
          value: 560
          detail: 只有当前公开收入估计明显过低时，才有激进上行空间。
          tone: positive
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据框架下的悲观、基准和乐观估值区间。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV039
    data:
      items:
        - label: 悲观情景
          low: 150
          mid: 185
          high: 220
          displayValue: $150M-$220M
          detail: 收入接近 $25M-$30M，软件溢价较弱。
          tone: risk
        - label: 基准情景
          low: 255
          mid: 300
          high: 350
          displayValue: $255M-$350M
          detail: 收入接近 $30M-$35M，软件溢价适中。
          tone: neutral
        - label: 乐观情景
          low: 420
          mid: 490
          high: 560
          displayValue: $420M-$560M
          detail: 收入接近 $35M-$40M，并具备高溢价的软件式经济性。
          tone: positive
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 以投委会视角看当前最影响 Dexory 估值的因素。
    claimRefs:
      - CV010
      - CV019
      - CV031
      - CV032
      - CV038
      - CV041
      - CV042
    data:
      items:
        - label: 商业验证
          value: 7/10
          detail: 具名客户、案例研究和正在推进的美国扩张项目，都是实打实的加分项。
          tone: positive
        - label: 收入可见度
          value: 2/10
          detail: 公开信息里只有一项低置信度的第三方收入估计。
          tone: risk
        - label: 数据 / 产品护城河
          value: 7/10
          detail: 扫描密度主张和 2026 年产品扩张，支撑起真实但仍由公司口径披露的护城河。
          tone: positive
        - label: 资本强度
          value: 3/10
          detail: 靠债务助推增长、条款未披露，会加重股权风险。
          tone: risk
        - label: 可比公司支撑
          value: 5/10
          detail: 可比公司组合能证明市场有兴趣，但撑不起明显溢价的融资轮定价。
          tone: neutral
        - label: 价格透明度
          value: 1/10
          detail: Series C 估值和 2026 年延展融资条款均未披露。
          tone: risk
        - label: 当前整体可投性
          value: 3/10
          detail: 业务值得看，但条款未知时，公开证据还不够支撑干净的投资承销。
          tone: risk
