  - id: TO005
    title: 公开披露和尽调缺口表
    columns:
      - 缺失事项
      - 当前公开证据
      - 重要性
      - 具体尽调路径
    rows:
      - - 当前估值和估值跃升历史
        - 轮次规模公开，但公司自有页面未说明当前估值，2026 年延伸轮为混合币种
        - 估值纪律是投资判断和稀释分析的核心
        - 要求提供每一轮定价轮的投前 / 投后估值、期权池设立情况，以及 2026 年延伸轮后使用的任何内部估值标记政策
      - - 收入、ARR、毛利率和烧钱速度
        - 已审阅来源中未发现权威公开运营经济性披露
        - 没有这些，仅凭营销无法判断资本效率和耐久性
        - 要求提供月度 ARR / 收入桥、毛利率、烧钱速度、现金跑道和队列留存历史
      - - 董事会构成和控制权
        - Companies House 显示部分董事和变更，但不显示完整董事席位、投票权或观察员权利
        - 控制权和下行保护分析取决于谁能阻止、强制或稀释
        - 要求提供当前董事会名单、投资者权利协议、保护性条款和任何董事会委员会
      - - 2025 年抵押背后的贷款方身份和债务条款
        - Companies House 记录了 MR01 抵押，但已审阅公开材料没有解释对手方或契约
        - 即便是风投支持公司，有担保债务也会改变下行、现金可得性和资本重组风险
        - 拉取抵押 PDF 和债务文件，再映射贷款方、抵押品包、到期日和契约
      - - 按地区和职能划分的干净当前员工数
        - 招聘页显示 200 人，但一条员工推荐语提到约 160 人，且没有备案对数字进行调节
        - 员工数是后续客户和财务章节的核心效率输入
        - 要求提供按地域、职能和完全负担成本划分的当前员工 / 承包商人数
    notes: 本表刻意记录仍不可得或仅部分公开的信息，避免后续章节把软信号误写成虚假精确度。
