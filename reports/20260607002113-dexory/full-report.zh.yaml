chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与布局
        blocks:
          - type: paragraph
            body: >-
              私有物流软件和机器人公司通常很难在公开信息中自证身份，Dexory 的锚点却异常扎实。Companies House 显示 Dexory Limited 于 2015 年 2 月 19 日注册成立并处于
              active 状态；Dexory 当前的关于页面也保留了同样的 2015 年创立时间，以及从 BotsAndUs 更名为 Dexory
              的路径。公司自有历史页面还解释了战略转向：技术最初服务于零售和出行场景的库存用例，后来客户要求把同样的实时数据采集带进物流现场，公司随之转入仓库运营。这个转向很关键，因为 Dexory
              现在更像一个围绕自主数据采集、AI 和数字孪生软件搭建的仓库智能平台，而不是单一用途机器人供应商。


              当前布局也比一家狭义英国机器人初创公司更大、更国际化。Dexory 招聘页面称公司在七个国家拥有 200 人、两个办公室和 33 种国籍；隐私声明和 2026 年 3 月 Nashville
              公告确认，公司法律主体在英国 Wallingford，并已在 Nashville 建立北美运营存在。产品叙事在 2026 年也推进很快：下一代机器人把扫描范围延伸到 60 feet，Storage Health
              在每次扫描中加入状态监测，DexoryView Adapt 则把故事从可视化推进到有证据支撑的运营决策。唯一需要打折的是，这些规模和能力说法大多仍来自公司自有渠道，并非审计结果。
