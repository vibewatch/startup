        - 索取按职能拆分的流失率、关键人才流失历史和开放岗位空置时间。
      - - 渠道赋能和客户成功
        - 公开证据仍主要依赖早期站点胜利和伙伴辅助部署
        - 中
        - 高
        - 标杆客户和伙伴生态给扩张提供了一定杠杆
        - 索取试点到规模部署的转化率、实施 NPS 和上线后续约指标。
    notes: 执行风险不在于缺少雄心，而在于 Dexory 扩张复杂硬件-软件业务时，能否让部署质量、财务控制和支持深度同步跟上。
