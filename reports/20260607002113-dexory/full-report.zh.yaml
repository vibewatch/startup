  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术部署与资本强度风险
        blocks:
          - type: paragraph
            body: >-
              评估 Dexory 时，应把它看成一家全栈机器人部署公司，而不是纯 SaaS 分析层。其自有材料称，价值来自每日自主扫描、14-metre / 10,000-location 覆盖，以及向 DexoryView
              和 Storage Health 等新模块供数的下一代 60-foot
              机器人。这套架构确实拉开技术差异，但也带来熟悉的硬件风险：双深位或遮挡库位仍可能看不清，仓库网络环境千差万别，现场正常运行时间取决于校准、备件、支持，以及在人和机器周边安全运行。TechCrunch
              早期报道明确指出，货物彼此遮挡时，系统无法完美识别物品；Dexory 后续产品页增加 Double Deep、Block Count 和 Layer Count 功能来补盲，也等于确认边界场景的负担。


              融资数据进一步说明，这是一个资本密集型执行故事。FY2025 营业额增至约 £3.6 million，但同一份账目显示税前亏损 £22.6 million、近 £4.0 million 研发支出、约 £7.7
              million 有形资产新增，以及明确与部署用机器人和配套设备绑定的库存。风险债、认股权证以及覆盖集团全部资产的抵押意味着 Dexory 仍需要靠规模跑赢硬件和服务成本底座。投资问题不在于产品能否在友好场地创造
              ROI；公开案例已经显示可以。更难的问题是，在融资条款或客户耐心收紧之前，Dexory 能否在大量异质场地把部署、正常运行时间和支持经济性工业化。
