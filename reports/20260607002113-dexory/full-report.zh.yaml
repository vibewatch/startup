      - number: '8.3'
        title: 软件、机器人与物流之间的可比基准
        blocks:
          - type: paragraph
            body: >-
              Dexory 的倍数应落在服务成分重的物流运营商与高端自动化或仓库软件平台之间。公开市场参照清楚说明了这一点。GXO 和 Zebra
              的收入倍数低得多，因为它们承担更多运营或硬件暴露；Descartes、Manhattan Associates 和 Symbotic 则拿到明显更高的比率，因为它们拥有软件、自动化 IP
              或稀缺平台位置。私募市场参照也显示分化：Mytra 在商业进展可见后，2026 年仍融到 $120 million；Nomagic 只是增加了一轮规模更小的延伸融资，而不是大幅跃升；Berkshire Grey
              公开市场之旅不理想，最后只以约 $375 million 出售。因此，Dexory 既不是干净的纯软件可比公司，也不是普通 3PL
              可比公司。正确视角是混合型：相对服务公司有溢价，相对最好的软件平台要打折，而且高度取决于公司能否证明软件式经济性，而不只是靠硬件实现可视化胜利。
