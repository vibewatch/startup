      - number: '1.4'
        title: 里程碑、披露限制与反向信号
        blocks:
          - type: paragraph
            body: >-
              可复用的时间线是连贯的。Dexory 于 2015 年以 BotsAndUs 创立，2021 年进入物流，2022 年推出实时仓库机器人，2023 年推出 DexoryView，截至 2025 年连续完成
              Series A、B、C 融资，随后在 2026 年开设 50,000 sq ft Nashville 总部，并发布 Storage Health 和 DexoryView
              Adapt。这个序列很重要，因为它显示公司正在从原始数据采集延展到更广泛的仓库操作系统野心，而不是停留在单一用途自动化工具。


              主要反向信号并不是失败部署，也不是已审阅资料中出现明显法律危机。风险更多藏在公开记录和披露缺口里。Companies House 显示，2025 年末有两项 MR01 押记，同期前后有董事离任和任命，2026
              年初还反复变更股份权利。公开材料仍未说明押记贷款方条款、当前董事会权利、准确持股比例，也未披露当前收入和利润率指标。Dexory
              因此看起来运营可信，但财务透明度低于客户和产品营销所暗示的水平。正确尽调姿态不是怀疑公司是否存在或是否能卖出产品，而是聚焦资本结构、贷款义务，以及公开牵引力能否干净映射到经济质量。
