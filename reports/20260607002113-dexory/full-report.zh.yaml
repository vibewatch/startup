      - number: '5.4'
        title: 信任、安全、隐私与技术风险
        blocks:
          - type: paragraph
            body: >-
              公开信任控制是真实的，但披露不均。正面来看，Dexory
              发布了相当详细的仓库机器人安全解释器、隐私政策和安全披露政策；隐私政策点名全球隐私制度、云服务商和数据泄露通知预期，安全披露政策包含安全港语言和负责披露渠道。产品材料还把 Storage Health
              定位为二阶安全层，可发现货架损坏、托盘不稳，以及人工检查薄弱的更高或更深库位中的障碍风险。结合案例研究中部署无需停运的证据，产品设计似乎在减少叉车、无人机和人工高位货架审计的经典风险。


              技术风险更多在于仍未披露的内容。Dexory 没有公开具名 API 连接器、ERP 或 WMS 兼容矩阵、可用性承诺或公开状态页；已审阅来源也没有出现 SOC 2 或 ISO 27001
              这类外部安全认证。安全披露流程是建设性的，但不能替代可独立审计的控制。所有仓库机器人还共享一个更广泛的人因风险：独立工人安全研究显示，如果岗位设计、节奏和变革管理处理不好，自动化可能降低重伤，却增加重复性、非重度劳损。Dexory
              自有材料把系统描述为让工作更聚焦异常处理，但 Dexory 特定的人体工学或员工结果披露仍有限。因此，公开差异化在执行和工作流匹配上很强，但在可外部验证的保证和已披露知识产权上较弱。
