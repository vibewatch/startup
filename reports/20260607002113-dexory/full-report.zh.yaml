        - 销售主导的库存无人机系统
        - 称无需新增基础设施
        - 无公开标价
        - 提供每日自主检查和 ROI 简报；未给出量化标价
        - 竞争点在循环盘点自动化，而不是价格透明度
      - - Locus Robotics
        - 经常性服务 / RaaS 式 AMR 部署
        - 接入现有 WMS 和工作流
        - 无公开标价
        - 客户案例称生产率大幅提升
        - 买方更看重劳动力生产率而非扫描智能时更有竞争力
