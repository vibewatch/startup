      - number: '3.2'
        title: 能力与包装对比
        blocks:
          - type: paragraph
            body: >-
              Dexory 的公开差异化不在于它是唯一的自主仓库智能产品，而在于它把商业和运营负担放在何处。Dexory 称自己可在约两周内上线，采用订阅制，无需 CapEx，也无需基础设施改造；与 Exotec 或
              AutoStore 这类安装式系统相比，这是明显更轻的楔子。话虽如此，Gather 和 Corvus 也公开主打类似低摩擦覆盖层；Verity 则销售更偏企业级打磨的仓库智能技术栈，已覆盖 150
              多个设施，并明确给出 ROI 目标。Locus
              从不同角度竞争：它销售劳动力效率和履约自动化，而非数字孪生库存智能；但当履约吞吐量比连续库存准确性更重要时，这些工作流会主导同一场买方对话。公开定价披露几乎都很弱。Dexory
              给出了最清晰的包装信号，多数同行仍以销售主导，买方只能比较结果和集成工作量，而不是标价。这种不透明让能力映射和部署姿态在早期竞争筛选中比名义价格更重要。
