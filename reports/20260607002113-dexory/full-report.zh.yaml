      - number: '2.2'
        title: 规模测算视角与受约束的市场估计
        blocks:
          - type: paragraph
            body: >-
              公开数据支持一个庞大且增长的宏观市场，但无法干净切出一个 Dexory 口径的类别。Mordor 估计全球仓库自动化市场在 2026 年为 $34.17 billion，到 2031 年为 $65.74
              billion；Fortune 和 Coherent 则把更窄的仓库机器人市场放在 2026 年 $7.35-10.01
              billion。两者并不矛盾，只是边界不同：自动化包括软件、输送线和更广泛系统；机器人是机械化子集。终端市场吞吐量仍在支撑需求。U.S. Census 称，美国零售电商在 2026 年 Q1 达到 $326.7
              billion，占零售销售 16.9%；BLS 显示，美国仓储和存储就业人数超过 1.84 million。Mordor 还称 3PL 在 2025 年占自动化支出的
              38.96%，意味着外包仓库所有者和运营商大约贡献 $11.7 billion 支出。硬缺口在于，没有公开数据集把仓库智能或自主库存扫描单列为支出项，因此 SAM 和 SOM 必须保持低置信度，并受证据约束。
