  - id: TV005
    title: 投资逻辑破裂和否决触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 远低预期
        - 经审计 ARR 低于 $25M
        - 估值倍数压向物流科技低端，几乎无法支撑溢价 Series C 标记。
        - 没有大幅估值重置就不要推进。
      - - 软件经济性偏弱
        - 毛利率低于 50%，或软件收入微不足道
        - Dexory 看起来更像资本密集型硬件 / 服务公司，而不是高溢价数据平台。
        - 将可比公司重估到 Zebra / GXO 一侧，并大幅下调估值区间。
      - - 债务或优先权惩罚性强
        - 契约、清算优先权栈或棘轮条款让新股权明显处于劣后位置
        - 即便经营表现不错，股权回报也可能很差。
        - 放弃交易，或要求高级保护并重置价格。
      - - 客户基础集中
        - 头部客户主导收入和续约敞口
        - 知名客户不再证明可复制性，反而变成集中度风险。
        - 要求集中度折价，并做客户访谈尽调。
      - - ROI 主张无法推广
        - 只有少数旗舰站点给出强指标
        - 商业故事太窄，撑不起软件式倍数扩张。
        - 将 Dexory 视为选择性工具供应商，而不是可扩展平台。
    notes: 这些触发项刻意写成可写进投资假设的尽调事件，让本章把证据缺口转成决策规则，而不是泛泛提醒风险。
    claimRefs:
      - CV016
      - CV018
      - CV031
      - CV032
      - CV040
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR 和收入结构
        - FY2025 和 LTM 2026 经审计 ARR、确认收入，以及软件与硬件拆分。
        - 这是估值区间里最大的单一变量。
        - 要求提供经审计财务包和董事会材料。
      - - 毛利率和贡献结构
        - 按模块、部署队列和服务线拆分的毛利率。
        - 只有软件式经济性真实存在，高倍数逻辑才站得住。
        - 要求提供管理账和队列毛利桥。
      - - 债务、优先权和棘轮条款
        - 条款清单、债务明细、契约、清算优先权栈和反稀释条款。
        - 即便业务增长，资本结构压力也可能主导股权结果。
        - 与律师一起审阅已签署融资文件。
      - - 客户质量
        - Top-10 客户集中度、GRR、NRR 和即将到来的续约。
        - 只有客户簿足够黏、足够分散，知名客户标识才有用。
        - 做队列分析和客户访谈。
      - - 全组合 ROI 可推广性
        - 所有已上线客户的部署名册，以及上线前 / 后 KPI。
        - 几个强案例不足以支撑软件式估值。
        - 要求导出客户 KPI，并访谈样本站点。
      - - 2025-2026 年实际股价
        - 投后估值、期权池变化和任何二级交易。
        - 如果没有清晰价格标记，轮次规模标题无法告诉投资人到底在买什么。
        - 要求提供股权结构表快照和已签署的 Series C 交割备忘录。
    notes: 这些问题刻意与估值挂钩；任何一项得到回答，都会实质改变区间或建议，所以不是泛泛的尽调愿望清单。
    claimRefs:
      - CV031
      - CV032
      - CV037
      - CV038
      - CV040
      - CV042
  - id: TV007
    title: 资本和稀释背景表
    columns:
      - 轮次 / 工具
      - 公开披露金额
      - 公开来源揭示与未揭示的信息
      - 估值含义
    rows:
      - - 2024 年 Series B
        - ' $80M 混合股权和增长债 '
        - 官方来源确认规模和债务成分，但没有披露股价或清算优先权栈。
        - 说明 Dexory 在 Series C 之前已经使用结构化资本。
      - - 2025 年 Series C 股权
