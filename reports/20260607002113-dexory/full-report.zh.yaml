  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Dexory 位于仓库智能层，而不是完整仓库自动化技术栈。它的核心承诺不是机器人拣选，也不是货到人存储，而是持续的库存真相。DexoryView 把自主扫描机器人、数字孪生和 AI 分析结合起来，校准 WMS
              记录与货架实物之间的差异。因此，纳入的支出包括自动循环盘点、库存完整性监测、差异检测、空间利用率分析和仓库健康检查。相邻支出包括仍作为记录和执行系统的 WMS、OMS 和运输系统，也包括
              AS/RS、分拣、拣选机器人等更广泛仓库自动化类别。最接近的现状替代品仍是人工循环盘点、现场巡检和周期性审计。这个边界很重要，因为 Dexory
              往往可以作为既有仓库上的轻量覆盖层销售，尤其适合那些希望获得更好数据、但不想重新设计设施或打断现场运营的运营商。
