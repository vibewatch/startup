companyProfile:
  summary: >-
    Dexory 是一家英国仓库智能公司，2015 年以 BotsAndUs 创立，2022 年更名。公司现在销售自主扫描机器人和 DexoryView
    软件平台，用于实时仓库可视化、数字孪生分析和运营优化。公开证据显示，公司仍由创始人带队，总部在 Wallingford，在 Nashville 设有扩张基地，拥有一线物流和工业客户背书；从种子前轮到 Series C，再加上
    2026 年 British Business Bank 追加资金，已披露融资超过 $280 million。公开尽调的主要限制不在产品相关性，而在经济性不透明：公司未公开当前 ARR、毛利率、留存、集中度，也未披露
    2025-2026 融资周期的投后估值。
