  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 状态
      - 当前收入基础
      - 价值 / 融资标记
      - 收入倍数或信号
      - 与 Dexory 的相关性
      - 局限性
    rows:
      - - Symbotic
        - 上市公司
        - $2.51B TTM
        - $26.57B 市值
        - ~10.6x
        - 最适合作为公开仓库机器人平台基准，反映高溢价自动化敞口。
        - 规模大得多且战略客户集中，直接作为可比公司会过于乐观。
      - - Descartes
        - 上市公司
        - $0.72B TTM
        - $6.46B 市值
        - ~9.0x
        - 可作为物流软件和网络智能结果的上限参照。
        - 纯软件经济性很可能优于 Dexory 当前混合模型。
      - - Manhattan Associates
        - 上市公司
        - $1.10B TTM
        - $8.73B 市值
        - ~7.9x
        - 成熟编排层的仓库软件基准。
        - 硬件敞口低于 Dexory，公开运营历史也更长。
      - - Zebra
        - 上市公司
        - $5.39B TTM
        - $11.05B 市值
        - ~2.1x
        - 显示硬件和设备属性较重的工业科技可以落在哪个交易区间。
        - 企业产品组合更广，只能部分可比。
      - - GXO Logistics
        - 上市公司
        - $13.49B TTM
        - $5.60B 市值
        - ~0.4x
        - 可作为服务属性较重的物流经济性的地板参照。
        - 服务模式低估了真实软件层能赚取的价值。
      - - Mytra
        - 私营公司
        - 披露 $120M Series C；估值未披露
        - 2026 年 1 月新增资本 $120M
        - 资金兴趣，而非倍数
        - 表明仓库自动化一旦部署规模拐点出现，投资者仍愿意出资。
        - 未披露估值，因此它只是情绪可比，而不是硬倍数可比。
      - - Berkshire Grey
        - 并购 / 私有化
        - 公开市场机器人平台
        - 2023 年 SoftBank 以 $375M 私有化
        - 下行先例
        - 可作为机器人估值压缩的警示性可比。
        - 交易较早，且公开市场路径不同于 Dexory 的私营路径。
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable set intentionally spans warehouse robotics, warehouse software, industrial tech, and services-heavy
        logistics because Dexory sits between those models; valuation fields are market-cap or transaction markers
        available from public evidence, not enterprise-value-normalized comps.
    notes: 倍数在有数据时用市值或披露交易价值除以过去十二个月收入；这是务实的公开证据视角，而不是干净的 EV / 收入分析。
