      - number: '2.5'
        title: 缺口、矛盾与尚未证明的部分
        blocks:
          - type: paragraph
            body: >-
              主要分析风险是假精确。公开来源很容易给仓库自动化和仓库机器人定规模，却无法干净隔离自主库存扫描、数字孪生或仓库智能覆盖层的支出。这个问题很关键：使用完整自动化 TAM 会夸大 Dexory 的可服务池；使用机器人
              TAM 仍会包含许多 Dexory 不服务的工作流。最稳妥的视角，是把 Dexory
              放在既有仓库自动化预算中的受约束切片里：买方为可视化、循环盘点和差异管理付费，而不是为物料移动本身付费。公开案例也显示了清晰运营价值，但还缺少预算归属、合同规模、模块附加率、胜率或扩展节奏等细节，无法把买方兴趣转成稳健
              SOM。因此，本章保留一个低置信度 SAM 代理，把定价、单站点经济性和从试点到网络铺开的转化率作为尽调问题，而不是已被证明的事实。
