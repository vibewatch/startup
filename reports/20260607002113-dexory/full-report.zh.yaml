      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强顺风来自结构性因素，而非周期性因素。电商增长持续压缩交付窗口；仓储劳动体量大且成本高；运营商在有效使用 AI 之前，越来越需要实时数据。McKinsey 认为，AI 赋能的仓库工具可释放 7-15%
              额外产能，数字孪生在不新增不动产的情况下可带来接近 10% 的产能提升。独立市场报告也把采用动力归因于劳动力短缺、工资通胀和更快履约要求。但同样的来源也说明，市场并非无摩擦。McKinsey 发现，71%
              受访者把资本成本列为主要障碍，61% 提到缺乏内部经验。Interact Analysis 称预算是移动机器人最大障碍，完整部署平均可达约 $1 million，ROI
              仍可能需要两到三年。AutomationWorld 还补充，机器人会放大破损的 WMS 逻辑，只有在重复、高量任务中才最容易获得最佳回报。Dexory 比完整设施改造更轻，但仍要跨过数据集成、预算和商业案例门槛。
