      - number: '4.3'
        title: 资本结构、烧钱速度与硬件强度
        blocks:
          - type: paragraph
            body: >-
              完整的逐轮融资时间线应放在公司概况里；财务问题在于，这条时间线意味着怎样的资本充足性。Dexory 从 2023 年 $19 million Series A，推进到 2024 年 $80 million
              Series B，再到 2025 年 $165 million 融资组合，其中包括 $100 million Series C 和扩大的成长债务，随后又在 2026 年 3 月获得 British
              Business Bank 追加 £8.5 million。这些融资重要，是因为已提交账目显示，FY2025 公司仍在大量消耗现金：税前亏损 £22.59 million，经营活动吸收现金 £20.06
              million，营业额只有 £3.55 million。这是硬件赋能增长公司很典型的形态：商业牵引力仍小于成本基数。


              资产负债表细节强化了同一信息。Dexory 在 2025 年 3 月末持有现金 £20.48 million、存货 £1.65 million、应收项 £4.14 million 和流动债权人 £6.17
              million。账目明确说明，存货用于建造机器人及相关设备，并资本化后部署给客户；这意味着公司不仅在资助软件，也在资助实物资产。自有有形固定资产折旧升至 £1.50
              million，现金流量表还显示，存货和应收项增加在当年消耗了流动性。这不是纯许可软件供应商的画像。


              债务进入资本栈的时间也早于新闻标题可能暗示的程度。Dexory 于 2024 年 8 月签署 Bootstrap 高级有担保风险债工具，额度 £10 million，预计后续还有 £15 million
              承诺；公司提取首笔 £3 million 分期，授予认股权证，并以集团全部资产设立第一顺位担保。因此，即使没有披露契约细节，2025 年末备案历史中的押记登记也是重要尽调信号。把 FY2025
              经营现金吸收和税前亏损作为粗略公开烧钱速度代理，意味着月烧钱约 £1.67 million 至 £1.88 million；仅以 2025 年 3 月现金计算，现金跑道只有约 10.9 至 12.3
              个月。后续融资很可能显著重置了现金跑道，但当前流动性仍不公开。
