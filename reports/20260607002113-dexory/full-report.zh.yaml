          label: 经济赞助人
          detail: 运营、库存或自动化负责人拥有这个问题
        - id: pilot
          label: 试点 / 首个站点
          detail: 单个设施试用或初始部署，证明无扰扫描的价值
        - id: users
          label: 日常用户
          detail: 库存控制和站点团队使用差异与位置洞察
        - id: integration
          label: 集成层
          detail: WMS 和集成商伙伴把新数据接入既有工作流
        - id: expansion
