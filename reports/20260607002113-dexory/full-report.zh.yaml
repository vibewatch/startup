      - 示意收入区间
      - 示意倍数区间
      - 隐含价值区间
      - 必须成立的条件
      - 概率信号
    rows:
      - - 悲观
        - $25M-$30M
        - 6x-7x
        - $150M-$220M
        - ROI 仍局限于个案研究，债务压力重要，买方把 Dexory 视作只带适度软件溢价的物流科技公司。
        - 如果 ARR 接近公开估计且留存较弱，概率就高
      - - 基准
