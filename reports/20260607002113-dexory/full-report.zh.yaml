      - number: '5.2'
        title: 自主、传感与数据管线
        blocks:
          - type: paragraph
            body: >-
              私有机器人公司通常不会公开到这个颗粒度，Dexory 的架构却异常具体。Dexory 称当前机器人每小时最多扫描 10,000 个托盘库位，当前高度达到 14 metres；官方和独立 2026
              年发布报道称，下一代把扫描范围延伸到 60 feet，之后还展示了 18-metre 塔架。安全文档比普通营销文案更深入：机器人使用 2D 和 3D LiDAR、3D
              相机、传感器冗余、功能性制动逻辑，以及提高人周围安全边界的高阶路径重规划。Dexory 还披露，垂直安全是一项差异化要求，因为塔架会在扫描时伸缩，感知范围必须随高度扩展，而不是只处理地面运动。


              Dexory 的数据管线也相对清晰。机器人捕获标识符、数量、体积、尺寸和状态信号；将其与仓库系统记录比对；再送入基于云的 DexoryView 平台。该平台可集中管理超过 1,000
              台设备，并通过安全、加密、实时通道交换信息。官方工作流页面反复称，系统可接入 WMS
              流程，对照客户记录闭合数据环，并可在约两周内部署，无需重大基础设施改造或仓库布局重设计。缺失的是技术买方在承销实施风险前想看到的集成细节：已审阅公开来源没有出现具名连接器、已发布 API
              schema、认证模式，也没有具体 SSO / ERP 集成参考架构。
