  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景、不透明度与资本结构
        blocks:
          - type: paragraph
            body: >-
              Dexory 进入 2026 年时势头很强，但公开价格发现很弱。公司 2025 年 10 月披露 $165 million Series C，又在 2026 年 3 月加入 British Business
              Bank 提供的 £8.5 million 资金，却从未披露投后估值。这里的问题比普通成长轮更重要，因为 Dexory 已经在 2024 年 Series B 和 2025 年 Series C
              结构中叠加增长债务。公开投资者能看到资本流入、客户标识、扫描次数增长和新的北美总部，但仍看不到当前 ARR、利润率结构、留存或债务条款。City A.M. 还报道，截至 2024 年 3 月的年度亏损为 £12
              million，这进一步说明 Dexory 仍处于规模化阶段，而不是自我供血的软件模式。实操上，公开证据足以支撑对业务产生兴趣，但不足以让投资者盲目接受未披露的轮次定价或稀释条款。
