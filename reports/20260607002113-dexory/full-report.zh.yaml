      - number: '8.2'
        title: 商业证明与行业摩擦
        blocks:
          - type: paragraph
            body: >-
              相比许多仓库机器人初创公司，Dexory 有更多商业有效性证据。官方和客户背书材料展示了具体客户结果、具名全球运营商、更大的扫描数据集，以及 2026 年覆盖更多存储格式的产品改进。Nashville 扩张和
              Romark 部署尤其有用，因为它们把故事从原型展示推向可重复的运营使用。即便如此，下行情景仍然真实：仓库自动化采用仍受 资本开支、集成负担和回本周期长的约束。Supply Chain Dive 强调 $1
              million 部署成本和多年回本周期，Automation World 则强调，编排薄弱时，机器人会放大破损流程。这个张力是 Dexory
              估值的核心：公司也许说得对，买方想要即时智能，而不是大动干戈的改造；但公开证据仍显示，这个行业很难把 ROI 一般化，选择性部署看起来可能好过全车队经济性。
