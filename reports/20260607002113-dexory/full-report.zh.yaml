      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Dexory 仍明显由创始人带队。公司页面列出 Andrei Danescu、Oana Jinga 和 Adrian Negoita 三位联合创始人；他们的履历也不是泛泛的创业者包装：Danescu 的
              Formula 1 和 Jaguar 研发背景、Jinga 的 Google 与电信商业经验、Negoita 在 IBM 和 Just Eat
              积累的软件与自动化背景，都直接对应公司在机器人、数据和商业化上的组合能力。创始人与市场的匹配度，有助于解释 Dexory 为什么能从货架扫描概念推进到完整仓库数据层，而不必外包核心产品愿景。


              但治理动态比营销页面展示的更快。Dexory 在 Series C 后引入 Bas Lustenhouwer 担任 CFO，这是合理的规模化动作；但 Companies House 也显示，2025
              年末前后出现一组董事会层面的变化：Raluca Ragab 自 2025 年 9 月 11 日起获任董事，Ida Christine Brun 和 Christoph Schuh
              在同一生效日期离任。同一套备案历史还显示，融资周期后不久，公司反复调整股份类别、更新章程并登记有担保押记。这本身不代表困境，但说明治理图谱变化速度快于公开高管页面。Dexory
              自身招聘文案还给出一个更软的风险信号：公司文化明确强调高绩效，并且“并不适合所有人”；这能支撑速度，但如果系统建设跟不上增长，也可能带来留才或管理压力。
