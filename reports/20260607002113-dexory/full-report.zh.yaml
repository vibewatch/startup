        - 官方和新闻来源确认轮次规模和投资方，但没有披露投后估值。
        - 大额股权融资标题如果没有价格发现，会提高投资测算不确定性。
      - - 2025 年扩大的债务额度
        - ' 包含在总额 $165M 的融资中 '
        - 公开来源提到扩大的增长债额度，但没有披露贷款方经济条款。
        - 可能只是温和的增长杠杆，也可能是在普通股之前的实质性索偿权。
      - - 2026 年 British Business Bank 追加资金
        - ' £8.5M / €9.8M '
        - 公开来源显示追加资本，但没有说明条款是否沿用此前股权、是否与债务并列，或是否改变优先权。
        - 增加了资金续航期，但仍未解决定价或稀释不透明问题。
    notes: 金额已经披露，但股价、契约和优先权数据缺失，意味着这张表既是在看已知现金流入，也是在看投资测算未知项。
