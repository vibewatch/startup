            body: >-
              最强的具名证明来自 Maersk、ODW Logistics、Romark Logistics、DCL Logistics 和 Linfox BevChain。Maersk
              是最广泛的品牌名，但公开证据分成两个不同成熟度层级：一篇 Dexory 撰写的初始试验故事，覆盖英国 Kettering 和 Tamworth；以及后来一篇 EMG Maersk
              关于手持设备差异解决的工作流案例。这提供了真实运营内容，但尚未形成横跨 Maersk 网络的干净生产叙事。ODW 是本章最丰富的部署证明集合：Dexory 和 ODW 都描述了 24
              小时内完成全量审计、频繁自主扫描、在拣选前解决高达 90% 问题，以及从初始部署扩展到另外四个单元。Romark 增加了一个 2026 年新证据点：在 Pennsylvania
              糖果站点实现不打断班次的部署。DCL 则贡献最清晰的第三方 ROI 指标：托盘准确性提升 14%、盘点速度快 10x、每天节省 16 个工时。Linfox BevChain 强化了 APAC
              覆盖，并增加安全角度，但它仍是供应商撰写的案例研究，而不是独立客户发布。
