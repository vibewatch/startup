      - number: '8.4'
        title: 情景区间、建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开收入数据很弱，因此情景逻辑必须把谨慎收入区间与基于可比公司的倍数区间结合，而不是假装精确。我们找到的唯一公开收入估计是 GetLatka 的 $28.6 million，但同一页面还错误称 Dexory
              是自筹资金、没有融过风险资本，所以只能作为方向性锚点。基于这一点，约 $150 million 至 $220 million 的悲观估值反映较低增长的物流科技结果。约 $250 million 至 $350
              million 的基准区间假设有适度软件溢价，且收入略强于第三方估计。只有当当前 ARR 明显高于公开估计，且毛利率、留存和续约行为更接近高端仓库软件而非资本密集型集成商时，超过 $400 million
              的上行情景才成立。因此目前建议是继续研究：业务有意思，但公开记录不足以支撑支付一个未披露的溢价估值。
