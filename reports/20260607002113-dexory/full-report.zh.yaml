      - number: '2.3'
        title: 买方地图、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方证据指向大型、托盘密集型运营商，而不是小型人工仓库。案例研究集中在 ODW、Romark、DCL、Maersk 等 3PL
              和合同物流集团；买方通常是运营、库存或自动化负责人，日常用户是现场库存或控制团队。付款方似乎落在运营或自动化预算里，往往与 WMS 或系统集成伙伴并列，而不是单独的 IT 采购。Dexory
              的定位适合那些吞吐量已经很高、但仍依赖高人工循环盘点、WMS
              对账和异常管理的仓库。采用通常从单一站点或有限试验开始；当运营方看到库存验证更快、差异更少、比人工审计更少扰动时，再扩展。公司还推动订阅模式和合作伙伴渠道；这很关键，因为买方希望在既有 WMS
              和内部物流技术栈上叠加可视化，而不是替换它们。换句话说，Dexory 更像一层运营智能覆盖，而不是从零新建自动化；它帮助现有仓库变成数据更丰富的资产。
