      - number: '1.3'
        title: 资本、股东与商业证明
        blocks:
          - type: paragraph
            body: >-
              Dexory 的融资记录已经足够完整，可以支撑后续章节梳理轮次顺序；只是具体估值上行仍披露不足。公司自有历史页面显示，融资从 2020 年 $2.6 million 种子前轮，推进到 2022 年 $13
              million 种子轮、2023 年 $19 million Series A、2024 年 $80 million Series B，以及 2025 年 10 月 $165 million Series
              C。独立报道补充了财团细节：Lakestar 和 Maersk Growth 是早期高信念支持者，Atomico 领投 Series A，DTCP 领投 Series B，Eurazeo 与 British
              Business Bank 支持了扩大的 Series C。即使不折算 2026 年 £8.5 million 追加资金，保守披露融资合计也已超过 $280 million，足以把 Dexory
              归为该类别里资金充足的公司。


              商业证明强于治理披露。Dexory 公开点名一线客户和合作渠道，证据也不只是标志墙。Maersk 将一次成功试点扩展为更广泛的英国铺开；ODW 提到每次任务覆盖 20,000 多个库位；DCL
              报告准确性和人工节省明显改善；Romark 将 2026 年部署描述为可在多设施扩展。合作伙伴页面和公告还展示了通过 Körber、C5MI、Raymond Storage Concepts 和 Peak
              Technologies 建立的渠道生态。这一组合意味着 Dexory 既在销售直接运营结果，也在销售一个可被他人转售或集成的平台，和它的 RaaS + SaaS 定位一致。
