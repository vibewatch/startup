  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 信号
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 公开证据不足以接受本轮价格
        - 只有拿到完整资料库，并保持有意义的价格纪律，才推进
      - - 信心
        - 低-中
        - 业务质量比经济性更可见
        - 只有披露 ARR、利润率和留存后，信心才会上调
      - - 风险评级
        - 高
        - 资本强度、估值不透明以及债务 / 优先权不确定
        - 将新资金视为结构性风险资本，而不是干净的成长股权
      - - 估值立场
        - 在未披露轮次条款下偏高
        - 公开证据支持的估值区间低于典型 $100M+ 股权轮所隐含的水平
        - 谈判应锚定折扣，或与经审计 KPI 绑定的棘轮条款
      - - 公开证据价值区间
        - $250M-$350M 基准；$150M-$220M 下行；只有拿到证据才看 $400M+
        - 区间由不透明收入和可比公司离散度驱动
        - 未经审计的软件经济性支持，不要承销上行情景
      - - 最可能的下一步
        - 先尽调，后谈价格
        - 具名客户和产品验证值得投入工作；未披露价格不支持立即承诺
        - 进入投资意向书前先索取完整轮次文件
    notes: 这只是基于公开证据的评估；估值区间把低信心水平的收入估计与公开可比公司的市值 / 收入区间合并使用，不应被误认为公平性意见。
    claimRefs:
      - CV031
      - CV038
      - CV039
      - CV040
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 主题
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 仓库数据护城河
        - 扫描次数增长、具名客户和更广存储覆盖表明，Dexory 正在搭建一个难以复制的数据层。
        - 扫描次数说法来自公司披露，不能证明商业化或留存质量。
        - 按模块审计的 ARR，以及数据层推动定价或续约提升的证据。
      - - 客户验证
        - Romark 和官方案例研究显示，产品能以低扰动带来真实运营价值。
        - 少数案例研究未必能推广到整个装机基数，也不能证明组合层面的回报。
        - 覆盖客户基数的部署名单，并给出 KPI 改善前后的分布。
      - - 资本效率
        - 股权加债务的混合轮次，让 Dexory 比纯股权路径扩张更快。
        - 增长债和未披露优先权会在平轮或下轮中大幅压缩股权上行。
        - Series B 和 Series C 文件中的债务计划、契约和清算瀑布条款。
      - - 可比定位
        - Dexory 拥有更多软件和数据，交易倍数应高于 GXO 和 Zebra。
        - 按公开证据看，Dexory 还没有赚到 Descartes、Manhattan 或 Symbotic 式倍数。
        - 能支撑溢价区间的毛利率结构、留存和软件附加率。
      - - 叙事质量
        - 公司围绕仓库可视化的叙事，显然能打动客户和投资者。
        - 未披露估值和收入质量指标，让叙事跑在证据前面。
        - 干净的 2026 年估值标记，以及经审计的 2025-2026 年运营指标。
    notes: 本表有意把最强多头叙事与最强、有证据支撑的反方观点放在一起；未解决事项是尽调门槛，不是措辞上的保留。
