  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 电商吞吐量和更紧服务窗口
        - 利好
        - 当前
        - 货量更多、配送承诺更快，会抬高准确且持续更新的仓库数据价值
        - 把 Dexory 赢单映射到客户服务水平目标和旺季痛点
      - - 庞大的仓储劳动力基数和工资压力
        - 利好
        - 当前
        - 工资上涨后，劳动密集的循环盘点和找货更适合自动化
        - 量化每个已部署站点减少或重新调配的劳动力
      - - 数字孪生和 AI 作为产能工具
        - 利好
        - 当前至中期
        - Dexory 可把自己定位成释放产能和 AI 驱动运营的数据基础，而不只是降本工具
        - 测试客户购买 Dexory 首先看准确性、其次看产能，还是看 AI 路线图可信度
      - - 订阅和快速部署经济性
        - 利好
        - 当前
        - 更轻的商业模式可能比全仓重构项目更容易采购 Dexory
        - 按队列验证实际定价、回本周期和流失
      - - 3PL 在仓库自动化支出中的份额
        - 利好
        - 当前
        - 外包运营商是重要买方，因为它们需要可跨客户组合复用的多站点工具
        - 衡量 Dexory 收入在 3PL 与货主之间的集中度
      - - 资本成本和预算稀缺
        - 约束
        - 当前
        - 即便更轻的自动化项目，也会与其他站点 capex 竞争，并可能卡在 ROI 审查
        - 确认平均 ACV、价值验证门槛和审批链
      - - 集成和内部能力缺口
        - 约束
        - 当前
        - WMS 集成差或内部自动化技能有限，会阻止部署从试点扩展
        - 审查实施周期、数据要求和合作伙伴依赖
      - - 机器人适用性有限
        - 约束
        - 持续
        - 仓库自动化在重复性任务上回本最快；工作流越多变，硬件重方案的商业论证越弱
        - 找出 Dexory 胜出的精确工作流，以及人工流程仍占主导的场景
    notes: 驱动因素和约束与采用节奏、买方逻辑挂钩，不只是宽泛市场情绪。若干条目是趋势观察， 并非经审计的公司专属结果。
