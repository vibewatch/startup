  - id: FM003
    title: 买方和采用流程——Dexory 类部署的采购路径
    type: flow
    layout: wide
    summary: 采用通常从库存可视化痛点开始，经过运营团队主导的试点；如果很快出现可衡量价值，再借助集成商和 WMS 对齐扩大部署。
