      - number: '7.4'
        title: 融资、估值重置与监测触发点
        blocks:
          - type: paragraph
            body: >-
              公开资本结构让估值重置风险难以忽视。Dexory 2024 年融资 $80 million，2026 年从 British Business Bank 获得 £8.5 million 并加入仍在进行的
              Series C，还在 2026 年春季持续提交新股配发和治理变更备案。与此同时，2025
              年账目披露了风险债、全资产担保、负面承诺，以及价值取决于未来融资或退出定价的认股权证。这种组合对快速扩张的硬件公司并不罕见，但会压窄下行空间：如果试点转化放慢、部署成本居高不下，或物流周期走弱，下一轮可能按运营里程碑定价，而不是按品类叙事定价。


              组织复杂度上升，执行风险也随之上升。公司称 2022 年以来规模扩大了四倍，目前约 200 人、覆盖七个国家，开设了 50,000-square-foot Nashville 基地，并聘请 CFO
              来搭建全球报告和投资者关系能力。这些动作合理，但也说明 Dexory 正从创始人主导的产品扩张转向运营纪律。正确的止损标准可以监测：首批站点之外的铺开
              节奏、明星客户之外的客户扩张、融资条款相对烧钱速度的变化，以及任何削弱信任的安全或数据事件。投资者不需要证明仓库存在盲点；他们需要证明 Dexory
              能反复、盈利地关闭这些盲点，同时不在资本结构或合规上制造新的盲点。
