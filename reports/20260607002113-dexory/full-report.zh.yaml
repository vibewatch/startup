      - number: '4.4'
        title: 披露限制与财务结论
        blocks:
          - type: paragraph
            body: >-
              财务结论很直接：Dexory 的公开证据足以证明客户获得运营价值，也足以证明投资人继续为公司提供资金，但不足以让人有信心承销其经常性经济性。最强的已验证正面信号是，订阅费主导 FY2025
              收入，客户部署似乎在扩展，公司也多次从声誉良好的投资人和 British Business Bank
              获得新资本。最清晰的负面信号是，审计对存货数量出具保留、收入与亏损之间差距巨大、有担保风险债和认股权证进入资本栈，以及 2026 年追加资金后仍没有当前现金披露。


              Dexory 是直接建造并部署机器人的私有公司，一定程度的不透明可以预期。但这里缺失的字段并不边缘。公开资料没有 ARR、当前收入运行率、分收入流毛利率、CAC、回本周期、NRR、客户集中度、合同期限，也没有
              Series C 后流动性披露。这些恰恰是判断 Dexory
              正在变成防御性经常性智能平台，还是仍是一家资金充足但亏损沉重的部署型业务所需要的输入。公开证据显示产品商业上可信、客户价值可信；它没有证明这些经济性可以高效扩张。


              实际投资含义是，Dexory
              迄今靠融资能力弥补了自筹增长不足。如果收入质量、续约行为和利润率结构在私域里改善，这可以接受；但公开来源尚未证明它们已经改善。因此，公司筛选结果是商业上有前景，但财务披露不足。尽调门槛问题已经不再是客户是否喜欢产品，而是经常性毛利最终能否跑赢机器人折旧、营运资本堆积和支持强度，而不必反复依赖股权和债务注入。
