      - number: '8.5'
        title: 尽调关口与投资逻辑破坏点
        blocks:
          - type: paragraph
            body: >-
              从继续研究转向推进的路径很直接，但证据负担很重。潜在投资者必须看到当前
              ARR、软件与硬件收入结构、毛利率、烧钱速度、债务契约和客户集中度。没有这些，资本结构风险无法定价，参与任何轮次本质上都是押注叙事，而不是基于经济性的投资判断。最重要的尽调要求不是另一个客户标识，而是队列质量：续约、NRR
              以及最大客户中的集中度。第二是融资条款，因为增长债务和未披露优先权可能把一个不错的运营故事转化为弱股权结果。第三是已安装基础上的 ROI 一般化。如果 Dexory
              能证明最好的案例研究是典型而非例外，估值理由会明显改善。否则，更可能的退出路径是战略出售或又一轮私募融资周期，而不是近期 IPO；入场价格必须反映更窄的结果集合。
