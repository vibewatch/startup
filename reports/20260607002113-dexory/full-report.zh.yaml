  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块技术栈
        blocks:
          - type: paragraph
            body: >-
              Dexory
              的产品应理解为交付到客户实时运营中的仓库智能技术栈，而不是一台独立自主移动机器人。商业承诺是持续生成仓库数字孪生，用日常或近实时记录系统取代周期性人工盘点、现场巡检和异常追踪。机器人是数据采集边缘：它扫描货架、块状堆垛和拣选面，捕获条码和图像，并把数据送入
              DexoryView；运营人员在这个软件层检查差异、处理风险、衡量利用率。Dexory 官方主页、解决方案和架构材料中的产品定义一致，独立访谈也强化了这一点：Dexory
              是一家全栈公司，机器人和软件都在内部构建。


              模块版图已经宽到具备战略意义。DexoryView Integrity 是核心准确性层，覆盖拣选计数、块堆计数、双深位扫描、租赁托盘追踪、物品搜索、客户分段和任务管理。Storage Health 增加 AI
              状态监测，用于发现货架损坏、托盘不稳、缠绕膜和卫生问题。Optimise 增加布局、拥堵、补货和货位优化工作流。2026 年公布的 Adapt
              增加推理层，把数字孪生从可视化界面变成可以解释根因并推荐下一步动作的系统。因此，公开差异化不取决于单一功能，而取决于紧耦合的硬件软件技术栈：同一套运营数据可以扫描、对账、排序优先级，并越来越多地推荐行动。
