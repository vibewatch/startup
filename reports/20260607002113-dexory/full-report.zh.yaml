      - number: '3.3'
        title: 既有厂商与替代压力
        blocks:
          - type: paragraph
            body: >-
              Dexory 最严肃的竞争压力很可能来自套件拥有者和相邻自动化厂商，而不是纯粹一对一的无人机同场比拼。SAP、Manhattan 和 Blue Yonder 都在更广泛的 WMS
              或供应链平台内销售仓库可视化、AI 驱动执行和机器人编排。它们因此可以进入那些可视化只是大型现代化项目中一个单项预算的交易。Blue Yonder 的 Robotics Hub 以及 Gather
              明确强调共存，也说明多供应商并存是可能的：一个仓库可以保留记录系统，叠加智能覆盖层，之后仍加入第三方自动化。与此同时，现状并不是“没有竞争”，而是人工盘点、条码驱动异常处理和 WMS
              对账；许多运营商已经知道如何为这些流程编预算、配人员。因此，Dexory 必须同时赢过三类替代方案：既有软件套件、更广泛自动化项目，以及在库存错误、停机和人工成本被认真计量前看似便宜的人工流程。
