      - number: '5.3'
        title: 部署证明、差异化与路线图
        blocks:
          - type: paragraph
            body: >-
              Dexory 的真实部署证明比许多仍主要销售试点的仓库机器人初创公司更多。官方客户案例显示：DB Schenker 每天在 VNA 巷道扫描 40,000 个托盘库位，并在三个月内报告库存准确性提升
              6%；Yusen 将月度全库检查从 100 多小时缩短到每天两小时，同时又消除每年 205 小时的检查；Yusen 的块状堆垛部署使用 3D 模型和 WMS 匹配，达到 97-98% 日准确率；Romark
              在不停止 AGV 的情况下于班次之间验证库存；Menzies Aviation 使用夜间审计和异常报告，减少人工检查，并从停留时间和库位问题中追回收入。这些例子说明，Dexory
              最强技术护城河不只是感知硬件，而是能在混乱仓库中重复部署，并且不让运营停摆。


              路线图方向也可见。Dexory 自 2023 年起在真实仓库运行，把块堆扫描、租赁托盘追踪等客户特定模块叠加进核心平台；2026 年 2 月在 Manifest 发布下一代机器人和 Storage
              Health；2026 年 4 月公布 Adapt，计划随后全球上市；2026 年 5 月展示 18-metre 机器人，以及 Nashville
              演示和研发站点。公开工程招聘信号也说明，这是一家工程组织较宽的公司，而不是薄薄的集成层：Dexory 正在招聘软件、现场服务、装配 / 制造和毕业生轮岗岗位，轮岗横跨自主、AI / 感知和平台工程，并明确提到
              Python、Linux、ROS、PyTorch、TensorFlow、Docker、Kubernetes、AWS、Golang、TypeScript 和
              React。主要公开缺口在于，路线图对功能发布披露更充分，对正式上市时间、模块附加率和客户按模块采用情况披露较少。
