figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Dexory 从 BotsAndUs 时期的机器人实验，转向融资充足的仓库智能平台，并在 2026 年扩张北美和产品；Series C 之后，治理复杂度也随之上升。
    data:
      items:
        - date: '2015-02-19'
          label: BotsAndUs 成立
          detail: 公司围绕自主机器人雄心设立法律实体。
          tone: positive
        - date: '2021-01-01'
          label: 转向仓库
          detail: 客户需求推动业务从零售 / 旅行用例转入物流。
          tone: neutral
        - date: '2022-06-23'
          label: $13M 种子轮
          detail: Lakestar 领投的轮次为仓库数据假设的全球扩张提供资金。
          tone: positive
        - date: '2022-11-01'
          label: 更名为 Dexory
          detail: 品牌从 BotsAndUs 转向更宽的仓库智能平台。
          tone: neutral
        - date: '2023-01-01'
          label: DexoryView 发布
          detail: 平台叙事从硬件延伸到数字孪生软件。
          tone: positive
        - date: '2023-06-27'
          label: Series A
          detail: Atomico 领投的 $19M 轮次带来顶级风投背书。
          tone: positive
        - date: '2024-10-01'
          label: Series B
          detail: DTCP 领投的 $80M 轮次为国际扩张提供资金。
          tone: positive
