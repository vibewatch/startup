      - number: '7.3'
        title: 安全、监管与数据治理风险
        blocks:
          - type: paragraph
            body: >-
              安全和合规风险居于核心，因为 Dexory 的机器人穿行于运营中的仓库，在高处扫描，并把跨客户站点的数据输送到云端分析。OSHA 称机器人事故经常发生在非常规条件下，并指出仍没有机器人专门 OSHA 标准；HSE
              指引强调人车隔离、操作员培训和安全交通路线。EU Machinery Regulation 已更新，以覆盖自主性、传感器系统、学习和网络干扰。Dexory 围绕 Storage Health
              的产品营销在这里有用：它把货架损坏、不稳定物品、悬挂收缩膜和托盘缺陷列为真实仓库危险，并把连续扫描定位为缓释层。这支撑投资逻辑，但也确认了 Dexory
              暴露于一种失效模式：漏掉危险或发生机器人交互事故，可能同时演变成客户信任事件和责任事件。


              数据治理又叠加一层风险。Dexory 的隐私政策提到 UK/EU GDPR 和多个非欧洲隐私制度，在外部供应商中列出 AWS 和 Google Cloud
              Platform，并承认会与法律、审计和营销对手方共享数据。安全披露页面展示了基础漏洞处理和安全港，但公开证据仍没有独立披露的安全认证或监管往来函件。Dexory 在客户仓库内部运营并接入 WMS
              数据，法律暴露可能来自产品安全、工作场所运营或数据处理，而不是某一个明显监管者。
