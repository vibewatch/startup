  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与已披露收入
        blocks:
          - type: paragraph
            body: >-
              Dexory 的财务记录仍极薄，但 2025 年 3 月集团账目至少说明，公司已经不再是纯未创收机器人故事。经验证收入为 £3.55 million，构成比绝对数更重要：£2.86 million
              来自订阅费，£0.69 million 来自实施费。也就是说，已披露收入中约 80.4% 是经常性订阅收入，约 19.6%
              是实施工作。仓库机器人供应商若不被一次性部署项目主导，这个收入组合方向上更健康，因为客户是在为持续可视化层付费，而不只是为安装工作付费。


              即便如此，产品和客户证据仍指向硬件软件混合供给，而不是纯 SaaS 公司。Dexory 自有材料把自主机器人描述为数据采集层，把 DexoryView 描述为运营智能层；Why Dexory
              页面称，客户无需前期投资即可使用全栈方案，并以固定订阅获得软件更新、监控和硬件替换。Diginomica
              访谈进一步强化了这一定位，称产品以订阅模式快速安装，销售的是信息而不是货物流转。这个组合商业上有吸引力，因为它降低客户 CapEx 摩擦；但也让实际收入确认和毛利质量更难从公开资料中评估。


              因此，获客故事只部分可见。客户标识、官方案例研究和新闻稿显示，Dexory 正在赢得多站点物流和制造部署；City A.M. 称，董事将 FY2025
              收入增长归因于新部署和既有合同扩展。缺失的是具体合同架构：公开资料没有标价、没有合同期限、没有模块附加率，也没有说明订阅收入中有多少是真正经常性，多少是打包的部署支持。收入是真实的；达到承销级别的收入模型仍大多在私域。
