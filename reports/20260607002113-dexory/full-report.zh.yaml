      - number: '4.2'
        title: 单位经济性与获客代理指标
        blocks:
          - type: paragraph
            body: >-
              Dexory 的公开 ROI 证据强于公开财务证据。公司自有案例研究列出非常具体的运营结果：审计时间从 280 小时降至 90 分钟，人工调查减少 41%，问题解决时间下降 45%，某一引用环境中每年节省
              £29,000。委托 Forrester 完成的研究更进一步，称一个合成 3PL 客户实现 219% 三年 ROI、$4.3 million 现值收益，并在六个月内回本。Romark 2026 年 5
              月部署公告和 Dexory 客户页面也支持这样的判断：产品可在班次之间运行，只要首次部署有效，就有机会扩展到单一站点之外。


              这些信号有助于判断付费意愿、销售叙事质量和实施摩擦，但它们不是风险投资承销意义上的单位经济性。所引来源没有披露
              CAC、按客户分部的回本周期、NRR、毛利率、支持成本、部署人工强度或流失。公开记录最多只能推断，客户获得了可衡量的劳动力和吞吐量收益；如果产品集成顺畅，这应能支持续约和交叉销售。Automated
              Warehouse 还显示，客户实现了 80% 更低审计时间和 20% 更高吞吐量；Dexory 2025 年产品更新引用的 Maersk 和 Yusen 例子，也指向有意义的工作流价值。


              更深层问题在于，Dexory 的商业模式很可能把经常性软件经济性与现场部署、维护和硬件刷新义务混在一起。这并非天然糟糕，但意味着即使客户 ROI
              很好，如果机器人机队、服务或支持扩张效率低于订阅收入，公司毛利率仍可能偏弱。因此，投资人应把公开 ROI 证明视为商业相关性的证据，而不是 Dexory 已经拥有 SaaS
              式回本或成熟毛利率的证明。获客故事看起来合理；闭环单位经济性在没有私有数据前仍未达到尽调门槛。
