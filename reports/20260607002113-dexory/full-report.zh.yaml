            body: >-
              Dexory 的公开客户故事足以证明真实采用，但还不足以完整支撑耐久性或集中度风险判断。运营层面有重复使用证据：Maersk 从每两周全量检查改为每日全量检查，ODW 描述持续可视化和每周多次扫描，EMG
              Maersk 与 Linfox 都描述每日处理差异的工作流，而不是一次性试点。但投资尽调最看重的经典 SaaS 或物流留存指标缺失。已审阅来源均未披露
              NRR、GRR、总流失率、续约期限、队列留存或按客户划分的收入集中度。独立满意度证据也比营销声量更薄。FeaturedCustomers 只露出 15 条可见推荐语、18 个案例研究和 5
              个视频，其中多数被锁定或仅有摘要，无法完整独立核查。最深的具名证据集中在少数物流客户上，官方页面仍大量依赖客户标识，而这些客户的生产状态或量化结果并不公开。因此，本章通过了采用门槛，但集中度、续约质量和生产使用广度仍是实质性尽调缺口。
