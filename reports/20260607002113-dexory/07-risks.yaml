    - label: Customer / channel concentration
      values:
      - label: medium
        tone: warning
        detail: Named proof is strong but still concentrated in marquee operators and partner-led rollouts.
      - label: high
        tone: negative
        detail: A lost anchor customer would hit both revenue and proof.
      - label: low-medium
        tone: warning
        detail: Sector spread helps, but revenue mix is undisclosed.
      - label: high
