- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Pilot-to-network conversion fails
    - Customer expansion announcements and management diligence
    - Fewer than two marquee pilots convert into multi-site rollouts inside 12 months, or public ROI claims stop appearing in new wins
    - Lower growth assumptions and treat proof as narrow pilot economics rather than repeatable enterprise standardization.
  - - Hardware / service burden overwhelms software leverage
    - Private diligence on uptime, service hours, and spare-parts costs
    - Fleet uptime, MTBF, or support hours per robot deteriorate as deployments scale
    - Model Dexory as a services-heavy industrial business and compress the valuation multiple.
  - - Safety or compliance incident
    - Regulator, insurer, or customer incident disclosure
    - Any serious injury, rack-collapse event, recall, or regulator notice tied to a Dexory deployment
    - Pause underwriting until root cause, remediation, and liability exposure are clear.
  - - Capital structure tightens
    - Financing documents and future Companies House filings
    - Additional all-asset secured debt, tighter covenants, or materially weaker pricing than the 2024 / 2026 financing marks
    - Underwrite a valuation reset and reduce downside confidence.
  - - Customer concentration is higher than expected
    - Revenue cohort disclosure or management diligence
    - Top five customers exceed 40% of revenue or one logo anchors a majority of public proof and pipeline
    - Apply a concentration discount and require stronger churn / expansion evidence before committing.
  - - Logistics cycle weakens again
    - Rollout timing, customer budget cadence, and warehouse automation order data
    - Two consecutive quarters of delayed rollouts or budget freezes across the 3PL / manufacturing cohort
    - Extend cash-need timing, lower deployment forecasts, and assume a slower next-round timeline.
  notes: These triggers are designed to convert broad concerns into diligence checkpoints that can actually change underwriting rather than merely describe risk.
