  - diligence path
  rows:
  - - EU Machinery Regulation 2023/1230 and CE-conformity obligations for autonomous warehouse machinery
    - EU / EEA
    - Current framework with autonomy and cyber-safety expectations for machinery placed on market
    - medium
    - high
    - Dexory positions robots as operating safely in live sites and keeps extending condition-monitoring features
    - medium-high
    - Request CE declarations, technical file excerpts, conformity assessment scope, and any customer non-conformance notices.
  - - Workplace transport and mixed-traffic safety controls for live warehouse deployments
    - UK / US customer sites
    - Ongoing site-level obligation around traffic routes, trained operators, and person/vehicle separation
    - medium-high
    - high
    - Dexory says robots can operate alongside people and some deployments run between shifts to reduce disruption
    - medium-high
    - Request site risk assessments, incident logs, insurance history, and any customer EHS approvals before rollout.
  - - Multi-jurisdiction privacy and cross-border data handling for warehouse scan and account data
    - UK / EU / US and other operating geographies
    - Privacy notice references UK/EU GDPR plus multiple extra-territorial privacy regimes and third-party processors
    - medium
    - high
    - Published privacy notice, vulnerability disclosure path, and named cloud-provider governance
    - medium
    - Review DPA, subprocessor list, retention settings, and any customer data-localization exceptions.
  - - Secured venture debt, warrant package, and negative-pledge documentation
    - UK corporate law
    - 2025 filings show secured financing with all-asset collateral and warrant-linked economics
    - medium
    - high
    - Equity follow-on capital and finance-team build-out provide some cushion
    - high
    - Obtain the full facility agreement, covenant package, draw conditions, and cure rights.
  - - Product-safety and performance representations tied to ROI, accuracy, and hazard detection
    - Customer contracts / product liability
    - Public marketing makes strong efficiency and risk-detection claims across live sites
    - medium
    - moderate-high
    - Exception-based workflows and Storage Health tooling reduce some detection risk
    - medium
    - Review standard MSA, SLA, warranties, indemnities, and exclusions for mis-detection or missed-hazard scenarios.
  notes: Rows are ordered by residual severity and cover the most decision-relevant public legal and regulatory exposures rather than every possible warehouse rule in every market.
