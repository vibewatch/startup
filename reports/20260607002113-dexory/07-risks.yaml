  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Revenue by customer, pilot-to-rollout conversion rates, renewal / expansion metrics, and standard enterprise SLA or indemnity terms.
    whyItMatters: Public proof is strong but concentrated in marquee sites. Without revenue concentration and rollout-conversion data, investors cannot tell whether Dexory has a broad land-and-expand engine or a narrow set of reference deployments.
    diligencePath: Request cohort-level revenue concentration, pipeline conversion by account, renewal history, and the standard enterprise MSA / SLA package from finance and customer-success leadership.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Robot-level gross margin, installation cost, field-service hours, MTBF, spare-parts consumption, and payback by customer archetype.
    whyItMatters: Dexory is clearly capital intensive. Without unit-economics disclosure, investors cannot test whether hardware utilization and support costs improve with scale or simply grow linearly with deployments.
    diligencePath: Request installed-base economics by fleet generation, service tickets per robot, spare-parts budget, and gross-margin bridge from pilot to scaled rollout.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: valuation-risk
    missingEvidence: Current post-money valuation, liquidation preferences, warrant overhang, covenant package, and the pricing or terms of the latest share allotments.
    whyItMatters: The public record shows debt, warrants, and ongoing share issuances, but not the current valuation stack. Investors cannot cleanly price downside or estimate dilution risk without the actual terms.
    diligencePath: Request cap table, latest financing documents, warrant schedule, and secured-debt covenant package for legal and financial review.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: safety
    missingEvidence: Customer safety audits, insurance claims history, incident logs, regulator notices, and site-level risk assessments tied to Dexory deployments.
    whyItMatters: Public materials discuss live-warehouse operation and hazard detection but do not disclose whether incidents, near misses, or regulator interactions have already occurred. That information is critical for sizing liability and trust risk.
    diligencePath: Request insurer loss runs, incident history by site, any OSHA / HSE / customer EHS findings, and formal product-safety validation reports.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
    - TR002
