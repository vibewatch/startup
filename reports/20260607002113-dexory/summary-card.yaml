  topStrengths:
    - >-
      Dexory combines autonomous data-capture robots with a software visibility layer that addresses a real warehouse
      pain point without requiring full fixed-automation redesign.
    - >-
      Public customer proof includes named operators such as Maersk, ODW Logistics, DCL Logistics, Romark, GXO, DHL,
      Stellantis, and GE Appliances, with several deployments showing measurable labor and accuracy gains.
    - >-
      The company has raised substantial capital from credible investors and expanded its footprint into North America,
      reducing near-term financing risk while it scales.
  topRisks:
    - >-
      Public disclosure still lacks current ARR, gross margin, retention, customer concentration, and current
      cash/runway, limiting confidence in software-like unit economics.
    - >-
      Dexory remains a capital-intensive robotics deployment business with venture debt, inventory build,
      working-capital needs, and large reported losses relative to disclosed revenue.
    - >-
      Much of the strongest public traction remains concentrated in site-level or phased deployments, leaving
      network-wide standardization and renewal durability under-proven.
    - >-
      Safety, compliance, and data-governance obligations rise as autonomous robots operate in live warehouses and
      ingest customer operational data across jurisdictions.
  unresolvedGaps:
    - Current ARR, revenue run rate, gross margin split, burn, and post-2026 cash balance.
    - Full Series C valuation, dilution terms, investor rights, warrant overhang, and debt covenant details.
    - Net retention, renewal history, top-customer concentration, and installed-base expansion by named account.
    - Safety incident history, deployment uptime metrics, and evidence that best-case ROI generalizes across the fleet.
