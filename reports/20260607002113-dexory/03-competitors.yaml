  columns:
  - Vendor / class
  - Commercial model
  - Infrastructure change
  - Public pricing signal
  - Public payback or deployment evidence
  - Implication
  rows:
  - - Dexory
    - Subscription; no capex stated
    - No infrastructure changes stated
    - Minimal starting-price friction; no list price
    - Operational in ~2 weeks; 219% ROI and <6 month payback claimed
    - Best public wedge on low-friction warehouse-intelligence deployment
  - - Gather AI
    - Sales-led overlay software + off-the-shelf hardware
    - Zero infrastructure changes stated
    - No public list price
    - ROI in under 6 months claimed; one operator can run up to 3 drones
    - Very similar low-friction message to Dexory
  - - Verity
    - Sales-led enterprise platform
    - Integration-first posture
    - No public list price
    - 10-15x ROI target within 18 months; 150+ facilities claimed
    - Closer to enterprise warehouse-intelligence benchmarking than to manual counts
  - - Corvus
    - Sales-led inventory-drone system
    - Without added infrastructure stated
    - No public list price
    - Daily autonomous checks and ROI briefing offered; no quantified list pricing
    - Competes on cycle-count automation rather than price transparency
