- id: moat-durability-and-open-gaps
  title: Moat Durability and Open Gaps
  body: 'Dexory''s moat looks strongest where full-height autonomous scanning, digital-twin analytics, and low-friction deployment intersect. That is a better public wedge than hardware-heavy AS/RS vendors can offer, and it is more warehouse-specific than retail-first platforms such as Simbe. The vulnerability is that the same narrative is being attacked from both sides. Direct peers such as Gather, Verity, and Corvus can argue they deliver similar inventory-accuracy outcomes without adopting Dexory''s exact robot architecture, while larger adjacent vendors such as Exotec, AutoStore, and GreyOrange increasingly market intelligence and orchestration on top of bigger installed bases. Public diligence is also constrained by missing data: realized ACVs, contract length, churn, net retention, and true competitive win-loss rates remain private for most scan-native vendors. That means the public case for Dexory is strong on wedge and category fit, but still incomplete on pricing power and long-term
    stickiness versus bundled suites or broader automation programs.'
  claimRefs:
