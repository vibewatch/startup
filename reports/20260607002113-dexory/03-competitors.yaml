- id: incumbent-and-substitute-pressure
  title: Incumbent and Substitute Pressure
  body: 'The most serious competitive pressure on Dexory is likely to come from suite owners and adjacent automation vendors rather than from a pure one-for-one drone bake-off. SAP, Manhattan, and Blue Yonder all market warehouse visibility, AI-driven execution, and robotics orchestration inside broader WMS or supply-chain platforms. That lets them enter deals where visibility is only one line item inside a bigger modernization program. Blue Yonder''s Robotics Hub and Gather''s explicit coexistence language also suggest multi-homing is plausible: a warehouse can keep its system of record, add an overlay intelligence layer, and still add third-party automation later. Meanwhile, the status quo is not "no competition" but manual counting, barcode-led exception handling, and WMS reconciliation, which many operators already know how to budget and staff. Dexory therefore has to win against three alternatives at once: the incumbent software suite, the broader automation project, and the manual
    process that looks cheap until inventory errors, downtime, and labor costs are measured honestly.'
  claimRefs:
