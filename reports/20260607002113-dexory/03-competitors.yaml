- id: TP001
  title: Competitor Profile Table
  notes: Rows compare vendors using retained public product pages and media coverage as of 2026-06-07. Funding, site-count, and headcount figures are company-disclosed or media-reported and remain incomplete for many private vendors.
  claimRefs:
