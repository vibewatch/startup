  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Dexory
    - Warehouse intelligence / autonomous scanning
    - $165M Series C in 2025 after $80M Series B in 2024; ~50 warehouses disclosed in 2024
    - 3PLs, manufacturers, logistics operators needing stock accuracy and digital-twin visibility
    - Subscription, no capex, ~2-week deployment; full-height scans and digital twin
    - Realized pricing, retention, and current site count remain private
  - - Exotec
    - AS/RS / goods-to-person automation
    - $1B+ systems sold; 100+ customer sites; 850+ employees in Mar 2024 and 1,300+ team in Jan 2025
    - Large warehouses prioritizing storage density, picking speed, and throughput
    - Scaled installed base and high-density storage automation
    - Higher project friction; solves storage/picking more than overlay intelligence
  - - Locus Robotics
    - AMR fulfillment orchestration
    - RaaS-style product environment; customer stories cite 230% to 300% productivity gains
    - Distribution centers focused on picking, putaway, replenishment, and labor flexibility
    - Strong workflow breadth and flexible WMS integration
    - Not a warehouse-digital-twin or full-racking inventory-accuracy product
  - - Gather AI
    - Warehouse intelligence overlay / drones and cameras
    - $40M Series B in 2026; $74M total raised; ~60 employees
    - Warehouses wanting inventory intelligence without replacing existing systems
    - Zero-infrastructure-change overlay; off-the-shelf hardware; cold-storage support
    - Public pricing remains opaque and operators still launch drone missions
  - - Verity
    - Warehouse intelligence platform
    - 150+ facilities deployed globally; near-zero churn claimed
    - Global enterprises seeking autonomous warehouse data and orchestration insights
    - Enterprise-scale warehouse-intelligence messaging and explicit ROI claims
    - Public pricing and contract structure not disclosed
  - - Corvus Robotics
    - Inventory-drone autonomy
    - Named customer roster includes Southern Glazer's, Dermalogica, GNC, MSI, LAPP, and Staci
    - 3PL, retail-distribution, and manufacturing warehouses
    - Daily cycle-count automation without added infrastructure
    - Public scale, pricing, and retention data remain sparse
  - - Simbe
    - Retail store intelligence (adjacent)
    - $50M Series C in 2024; total funding >$100M; subscription base tripled in 2023
    - Grocery, club, and retail banners optimizing shelf availability and pricing
    - Multimodal store intelligence across inventory, pricing, promotions, and suppliers
    - Retail shelf focus makes it adjacent rather than direct to warehouse racking
  - - SAP EWM
    - Incumbent enterprise WMS
    - Large enterprise installed base; trust center and compliance surface are public
    - Enterprises standardizing on SAP for warehouse and supply-chain control
    - Automation control, slotting, stock transparency, and trust posture inside suite
    - Visibility is one module inside a broader platform rather than a dedicated scan-native product
  - - Manhattan Active WMS
    - Incumbent cloud-native WMS / WES
    - Hundreds of brands cited; 17x Gartner leader claims on WMS page
    - Enterprises prioritizing cloud-native orchestration across labor, robotics, and transport
    - Extensible WMS/WES orchestration with frequent updates
    - Suite-first economics can overshadow stand-alone visibility ROI discussions
  - - Blue Yonder WMS
    - Incumbent AI-enabled WMS
    - Leader claims plus Robotics Hub and AI tasking across warehouse operations
    - Retail, CPG, and logistics operators already inside Blue Yonder workflows
    - Can bundle execution, slotting, labor, and vendor-agnostic robotics onboarding
    - Less specialized than Dexory on autonomous scan-native inventory intelligence
