    - Bundling can make Dexory look incremental rather than essential
- id: TP004
  title: Incumbents and Status-Quo Substitutes
  notes: Rows enumerate the main alternative ways a buyer can solve Dexory's job. Manual substitutes reflect workflows vendors explicitly say they are replacing, not a comprehensive market census.
  claimRefs:
  - CP029
  - CP031
  - CP032
  - CP037
  - CP038
  - CP039
  columns:
  - Solution class
  - Example vendors / workflows
  - Where it is strong
  - Where it falls short vs Dexory
  - Budget owner / trigger
  rows:
  - - Manual audits and barcode-led checks
    - Cycle counts, handheld scans, WMS reconciliation
    - Looks cheap, familiar, and easy to schedule
    - Slow feedback loop, high labor drag, delayed discrepancy discovery
    - Ops manager trying to defer new spend
  - - Warehouse-intelligence overlay
    - Dexory, Gather AI, Verity, Corvus
    - Fast path to inventory accuracy and exception visibility without replacing system of record
    - Usually narrower than a full execution or storage-automation program
    - Ops / continuous-improvement leader with inventory-accuracy pain
  - - AMR fulfillment automation
    - Locus Robotics, Geek+
    - Travel-time reduction, replenishment, picking, labor flexibility
    - Does not inherently create a full digital twin or location-by-location audit layer
    - Fulfillment leader chasing throughput and labor savings
  - - AS/RS and goods-to-person systems
    - Exotec, AutoStore
    - Storage density, throughput, reliability, high-volume order fulfillment
    - Higher project friction and weaker fit for overlay intelligence use cases
    - Capital program led by supply-chain engineering
  - - Suite WMS and warehouse execution
    - SAP EWM, Manhattan Active, Blue Yonder
    - System-of-record control, robotics orchestration, AI tasking, compliance posture
    - May not solve autonomous physical-data capture as directly as scan-native vendors
    - IT + supply-chain transformation budget
  - - Retail shelf intelligence
    - Simbe
    - Excellent for pricing, promotions, shelf availability, supplier collaboration
    - Store-first rather than warehouse-racking-first
    - Retail operations or merchandising budget
