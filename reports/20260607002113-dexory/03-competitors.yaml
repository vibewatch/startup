  rows:
  - - Dexory
    - Overlay intelligence layer on top of warehouse ops
    - Works independently of existing systems; compares captured data to WMS
    - Historical scan data, process change, and digital-twin workflows
    - Retained public pages emphasize ROI more than certifications
    - Contract duration, churn, and security artifacts are not public in retained sources
  - - Gather AI
    - Overlay intelligence layer
    - Explicitly says it is not replacing WMS or automation
    - Image history, exception workflows, operator routines
    - Public trust documentation not surfaced in retained sources
    - Pricing and long-term retention are private
  - - Verity
    - Enterprise warehouse-intelligence platform
    - Enterprise integration and cross-site coordination messaging
    - Warehouse IQ analytics and client workflow integration
    - Public trust/compliance details were not clear in retained sources
    - Commercial model and migration friction remain private
  - - Corvus
    - Inventory-drone overlay
    - No added infrastructure stated; software can run on edge or cloud
    - Drone data, discrepancy routines, customer-specific reporting
    - Public trust surface is limited in retained sources
    - Pricing, churn, and current site count remain private
  - - Locus Robotics
    - AMR service platform
    - Customer stories emphasize flexible WMS integration
    - Embedded AMR workflows and RaaS operating model
    - Formal patch-management and RaaS environment language are public
    - Economics and termination rights are private
  - - SAP / Manhattan / Blue Yonder
    - System-of-record suites
    - Native or tightly coupled orchestration across warehouse workflows
    - ERP/WMS data model, workflow ownership, vendor bundling
    - Public trust, privacy, or update posture is clearly marketed
    - Standalone module economics versus full-suite bundling stay contract-specific
- id: TP006
  title: Moat Durability / Competitive Risk Register
  notes: Severity is qualitative and reflects likely underwriting relevance rather than a numerical forecast. Diligence asks focus on the evidence still missing from the public domain.
  claimRefs:
  - CP036
  - CP038
  - CP040
  - CP041
  - CP042
  - CP044
  - CP045
  - CP046
  - CP047
  - CP048
  - CP050
  columns:
  - Moat or risk
  - Main challenger
  - Why it matters
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Low-friction deployment wedge
    - Gather AI, Corvus, Locus
    - Dexory's sales wedge weakens if buyers conclude multiple overlay or RaaS models deliver similar outcomes
    - High
    - Get contract-level proof that Dexory really deploys faster or with lower services burden than peers
  - - Full-height scan + digital-twin differentiation
    - Gather AI, Verity, Corvus
    - Direct peers can narrow the message if customers care more about outcomes than about Dexory's specific robot architecture
    - Medium
    - Request feature-level win-loss data on digital twin, height coverage, and discrepancy workflows
  - - Suite bundling displacement
    - SAP, Manhattan, Blue Yonder
    - Incumbents can bury visibility inside broader transformation budgets and existing workflow ownership
    - High
    - Quantify how often Dexory wins greenfield versus incumbent-account expansion deals
  - - Budget diversion to throughput automation
    - Exotec, AutoStore, Locus, GreyOrange, Geek+
    - Boards may fund storage-density or picking-output projects before a stand-alone intelligence layer
    - High
    - Test whether Dexory expands average contract value after inventory-accuracy wedge or stalls at pilot scope
  - - Trust / compliance disclosure gap
    - Suite incumbents and Locus
    - Enterprise buyers may expect a clearer public security posture than Dexory's retained pages currently provide
    - Medium
    - Request ISO/SOC-style artifacts, customer security questionnaires, and incident history in diligence
  - - Opaque pricing and retention data
    - Entire private-peer set
    - Without ACV, churn, or net-retention data the moat cannot be underwritten confidently
    - High
    - Obtain cohort retention, ACV by vertical, and displacement examples from management and customer references
