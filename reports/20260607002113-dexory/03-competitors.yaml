  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Public list pricing, realized ACV, and module-level discounting are not disclosed for Dexory, Gather AI, Verity, Corvus, Locus, Exotec, or the major suite incumbents in the retained source set.
    whyItMatters: Without contract-level pricing it is not possible to size Dexory's pricing power, compare it credibly to overlay peers, or quantify the true economic advantage of incumbent bundle pricing.
    diligencePath: Request sample MSAs, order forms, and realized ACV ranges by warehouse size and vertical. Validate any pricing narrative with customer references and procurement-level win/loss data.
    relatedQuestionRefs:
    - QP014
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: deployment-scale-opacity
    missingEvidence: Current live-site counts, active-robot counts, and annual deployment velocity are still private for many scan-native vendors, including Dexory, Gather AI, and Corvus.
    whyItMatters: Public scale matters because installed-base density affects referenceability, services burden, and the durability of any data flywheel or customer-trust moat.
    diligencePath: Ask management for live sites, annual gross adds, gross churn, and cohort expansion by vertical. Cross-check with case-study references and named-customer deployment maps.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: contract-stickiness
    missingEvidence: Contract duration, renewal rates, net retention, and migration pain are not public for Dexory or most direct peers. Verity's near-zero churn claim is unusual rather than representative.
    whyItMatters: Switching-cost quality is central to underwriting competitive durability. A low-friction initial deployment only becomes a moat if customers expand and renew rather than multi-home or churn.
    diligencePath: Request cohort retention, renewal terms, professional-services burden, and examples of customers expanding from pilot to network-wide rollout. Speak directly with former customers if available.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP005
  - type: missing-source
    severity: material
    topic: competitive-win-loss
    missingEvidence: Public win-loss evidence showing Dexory displacing Gather AI, Verity, Corvus, or suite incumbents is sparse, and the retained sources are mostly vendor marketing plus funding or profile coverage.
    whyItMatters: Without hard displacement evidence it is difficult to separate real competitive advantage from category-level marketing convergence, especially when bundle economics or adjacent automation projects may decide the deal.
    diligencePath: Request named competitive bake-offs, renewal decisions, and displacement examples from management and customers. Supplement with third-party channel checks across 3PL and manufacturing buyers.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP006
