chapter:
  number: 3
  title: Competitors
  summary: Dexory's closest direct competitors are warehouse-intelligence overlays such as Gather AI, Verity, and Corvus, while the biggest budget pressure comes from adjacent automation vendors like Exotec, Locus, AutoStore, GreyOrange, and from incumbent WMS suites such as SAP, Manhattan, and Blue Yonder. Dexory's best public differentiators are fast subscription deployment, no capex, full-height scanning, and digital-twin analytics; its biggest exposed areas are pricing opacity, limited public trust disclosure, and bundle risk from platforms that already control the warehouse system of record.
sections:
- id: landscape-segmentation
  title: Landscape Segmentation
  body: Dexory sits in the middle of a broad warehouse-modernization landscape rather than a single clean robot category. Its closest direct peers are warehouse-intelligence overlays such as Gather AI, Verity, and Corvus, all of which market autonomous inventory capture plus analytics while coexisting with incumbent WMS stacks. Adjacent competition comes from automation vendors such as Exotec, Locus, AutoStore, GreyOrange, and Geek+, which solve neighboring buyer problems—storage density, picking productivity, or orchestration—and can still take the same capital or operating budget. Incumbent software pressure comes from SAP EWM, Manhattan Active WMS, and Blue Yonder, which already own system-of-record workflows and can layer visibility, AI tasking, or robotics orchestration into larger suite contracts. Simbe is not a warehouse-racking competitor, but it shows how computer-vision inventory platforms can broaden from count accuracy into pricing, merchandising, and supplier workflows. Manual
    cycle counts and barcode-led exception handling remain the real status-quo substitute that all of these vendors claim to compress.
  claimRefs:
