- id: founders-leadership-and-governance
  title: Founders, leadership, and governance
  body: 'Dexory remains visibly founder-led. Company pages identify Andrei Danescu, Oana Jinga, and Adrian Negoita as the co-founders, and the founders’ biographies are not generic startup résumé filler: Danescu’s Formula 1 and Jaguar R&D background, Jinga’s Google and telecom commercial experience, and Negoita’s software and automation background from IBM and Just Eat all map directly to the company’s mix of robotics, data, and commercialisation. That founder-market fit helps explain why Dexory could move from shelf-scanning concepts to a full warehouse data layer without outsourcing the core product vision.


    Governance, however, is more dynamic than the marketing pages alone would suggest. Dexory added Bas Lustenhouwer as CFO after the Series C, which is a sensible scale-up move, but Companies House also shows a cluster of board-level changes around late 2025: Raluca Ragab was appointed director effective 11 September 2025, while Ida Christine Brun and Christoph Schuh left on the same effective date. The same filing history shows repeated share-class changes, new articles, and secured charges shortly after the financing cycle. That does not imply distress on its own, but it does mean the governance picture is evolving faster than the public executive-team page reveals. Dexory’s own careers language adds a softer risk signal: the culture is explicitly high-performance and “isn’t for everyone,” which can support speed but may create retention or management strain if systems lag growth.'
