  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-board-rights
    missingEvidence: Current cap table, board seat allocation, observer rights, protective provisions, and priced-round valuation step-ups after the public Series C disclosures.
    whyItMatters: These control terms determine who actually governs the company and how downside or dilution risk is shared.
    diligencePath: Request the latest cap table, investor-rights agreement, voting agreements, and any board-consent schedule from management or counsel.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
    - TO005
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, gross margin, burn, runway, customer concentration, and cash-collection metrics.
    whyItMatters: The company looks commercially credible, but valuation, efficiency, and downside underwriting cannot be completed from product and funding headlines alone.
    diligencePath: Request monthly financials, KPI pack, cohort retention, gross-margin bridge, and management’s current budget versus actuals.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO001
    - TO005
  - type: missing-source
    severity: material
    topic: debt-terms
    missingEvidence: The lender identity, collateral package, maturity, and covenants behind the 2025 MR01 charges.
    whyItMatters: Secured debt can constrain optionality, increase default sensitivity, and alter the effective seniority stack despite strong equity funding headlines.
    diligencePath: Pull the underlying charge PDFs and debt agreements, then reconcile them against board approvals and current cash balances.
    relatedQuestionRefs:
    - QO023
    - QO025
    relatedTableRefs:
    - TO004
    - TO005
  - type: access-blocked
    severity: minor
    topic: independent-employee-and-legal-adverse-checks
    missingEvidence: A clean independent read on employee sentiment and any non-obvious litigation or layoff history from review sites or court-linked records.
    whyItMatters: The reviewed public record does not show a major controversy, but absence of evidence is not evidence of absence for cultural or employment-related risk.
    diligencePath: Re-run adverse checks with accessible court and labor databases, then supplement with direct employee-reference calls rather than blocked review sites.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO005
