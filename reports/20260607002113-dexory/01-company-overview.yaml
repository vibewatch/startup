- id: TO005
  title: Public disclosure and diligence gaps table
  columns:
  - missing item
  - current public evidence
  - why it matters
  - exact diligence path
  rows:
  - - Current valuation and step-up history
    - Round sizes are public, but company-owned pages do not state a current valuation and the 2026 extension is mixed-currency
    - Valuation discipline is core to underwriting and dilution analysis
    - Request every priced-round pre/post-money, option-pool creation, and any internal-mark policy used after the 2026 extension
  - - Revenue, ARR, gross margin, and burn
    - No canonical public operating-economics disclosure found in the reviewed source set
    - Without this, capital efficiency and durability cannot be underwritten from marketing alone
    - Request monthly ARR/revenue bridge, gross margin, burn, runway, and cohort retention history
  - - Board composition and control rights
    - Companies House shows some directors and changes, but not full board seats, voting rights, or observer rights
    - Control and downside-protection analysis depends on who can block, force, or dilute
    - Request current board list, investor-rights agreement, protective provisions, and any board committees
  - - Lender identity and debt terms behind 2025 charges
    - Companies House records MR01 charges but the reviewed public materials do not explain the counterparty or covenants
    - Secured debt can change downside, cash availability, and recap risk even in a venture-backed company
    - Pull the charge PDFs and debt documents, then map lender, collateral package, maturity, and covenants
  - - Clean current headcount by region and function
    - Careers page shows 200 people, but an employee testimonial references about 160, and no filing reconciles the number
    - Headcount is a core efficiency input for later customer and financial chapters
    - Request current employee/contractor count by geography, function, and fully loaded cost base
  notes: This table intentionally records what remains unavailable or only partially public so later chapters do not accidentally turn soft signals into fake precision.
