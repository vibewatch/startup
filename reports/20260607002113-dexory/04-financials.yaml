- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism / unit
  - Public evidence
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - DexoryView subscription fees
    - Recurring platform subscription
    - FY2025 accounts explicitly separate subscription fee revenue
    - £2.856m in FY2025
    - Higher quality than project revenue because it is recurring in form, but realized contract terms are private
    - Request cohort renewals, ARR bridge, contract duration, and gross margin by customer type
  - - Implementation fees
    - Deployment / onboarding / integration fees
    - FY2025 accounts explicitly separate implementation fee revenue
    - £0.695m in FY2025
    - Lower quality than recurring subscriptions because revenue likely tracks deployment cadence
    - Request implementation revenue-recognition policy and attach rate to multi-year contracts
  - - Bundled hardware + service access
    - Full-stack subscription with hardware replacement and monitoring included
    - Why Dexory says there is no upfront investment and the subscription covers hardware replacement and site visits
    - Public structure visible; no public price point
    - Could improve adoption by shifting customer capex to Dexory, but pushes asset burden onto Dexory balance sheet
    - Request per-site contract economics and replacement/maintenance assumptions
  - - Site-expansion revenue
    - Expansion from first deployment to additional facilities
    - Romark announcement and City A.M. note expansion of existing contracts
    - Directionally positive but not quantified
    - Potentially attractive if deployment success leads to multi-site rollouts
    - Request logo-to-site expansion cohorts and share of ARR from expansions
  - - Insight / Integrity / Storage Health modules
    - Module upsell into existing installed base
    - Automated Warehouse describes module additions, but no revenue split is disclosed
    - Commercially plausible; no numeric disclosure
    - Upsell could lift software mix if modules price separately
    - Request module attach rates and ARR contribution by module
  - - Customer ROI-led renewals
    - Economic value supports retention and pricing power
    - Forrester and customer case studies claim fast payback and labor savings
    - Evidence of value exists, but contract economics remain private
    - Helpful demand proof, not a substitute for NRR or gross margin
    - Request renewal rates, churn, and payback by cohort
  notes: Only subscription and implementation fees are directly verified in the FY2025 accounts; the other rows describe inferred monetization pathways from product packaging and customer case studies.
