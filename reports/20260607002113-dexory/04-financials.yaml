- id: unit-economics-and-gtm-proxies
  title: Unit economics and GTM proxies
  body: |-
    Dexory’s public ROI evidence is stronger than its public financial evidence. The company’s own case studies cite very specific operational outcomes: audit time dropping from 280 hours to 90 minutes, manual investigations down 41 percent, issue-resolution time down 45 percent, and annual savings of £29,000 in one cited environment. The commissioned Forrester study goes further, claiming a 219 percent three-year ROI, $4.3 million of present-value benefits, and payback in under six months for a composite 3PL customer. Romark’s May 2026 deployment announcement and Dexory’s customer pages also support the idea that the product can run between shifts and expand beyond a single site if the first deployment works.

    These are useful signals for willingness to pay, sales narrative quality, and implementation friction, but they are not unit economics in the venture underwriting sense. None of the cited sources disclose CAC, payback by customer segment, NRR, gross margin, support cost, deployment labor intensity, or churn. The best the public record can do is infer that customers receive measurable labor and throughput benefits, which should support renewal and cross-sell if the product integrates well. Automated Warehouse also suggests customers have achieved 80 percent lower audit time and 20 percent higher throughput, while Dexory’s 2025 product update cites Maersk and Yusen examples that point to meaningful workflow value.

    The deeper issue is that Dexory’s business model probably mixes recurring software economics with field deployment, maintenance, and hardware refresh obligations. That is not inherently bad, but it means customer ROI can coexist with weak corporate margin if robot fleets, servicing, or support scale less efficiently than subscription revenue. Investors should therefore treat public ROI proof as evidence of commercial relevance, not as proof that Dexory already has SaaS-like payback or mature gross margin. The GTM story looks plausible; the closed-loop unit economics still do not clear the diligence bar without private data.
