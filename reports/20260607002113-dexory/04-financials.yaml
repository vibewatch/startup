- id: TI006
  title: Public financial signals and disclosure gaps table
  columns:
  - Data point
  - What is public
  - Status
  - Why underwriting still breaks
  - Exact diligence path
  rows:
  - - Current ARR / run-rate revenue
    - No public current ARR or run-rate revenue figure
    - Undisclosed
    - Funding headlines do not show whether commercial scale is catching up to cost base
    - Request monthly revenue bridge and trailing-12-month ARR by segment
  - - Gross margin by stream
    - No disclosed split between subscription, implementation, support, and hardware-service margin
    - Undisclosed
    - Cannot tell whether the business is approaching software-like economics or still mostly hardware burdened
    - Request revenue-to-gross-profit bridge by stream and customer type
  - - CAC / payback by segment
    - Only customer outcome anecdotes and commissioned ROI claims are public
    - Undisclosed
    - Public ROI claims do not reveal selling cost, sales-cycle length, or channel efficiency
    - Request booked CAC, payback, and quota-attainment data by region
  - - NRR / churn / expansion rate
    - No public NRR or churn statistic
    - Undisclosed
    - Renewal and upsell behavior are central to recurring-revenue quality
    - Request cohort NRR, gross retention, and expansion ARR waterfall
  - - Customer concentration / contract duration
    - Only logos and case studies are public
    - Undisclosed
    - A few large 3PL or manufacturing customers could dominate revenue and bargaining power
    - Request top-customer schedule, contract terms, and renewal calendar
  - - Current cash and debt headroom
    - Historical March 2025 cash plus later funding announcements
    - Partial
    - Investors cannot see present liquidity or covenant room after the 2026 top-up
    - Request current cash waterfall, debt draws, undrawn commitments, and covenants
  - - Robot fleet capex / maintenance burden
    - Accounts confirm robot-linked inventory and depreciation, but no unit fleet economics
    - Partial
    - Hardware refresh and servicing could absorb much of the subscription gross profit
    - Request fleet utilization, service cost per robot, and replacement schedule
  - - Revenue recognition policy
    - Accounts show subscription and implementation lines, but not timing detail by contract
    - Partial
    - Implementation-heavy recognition can flatter near-term growth if recurring value is weaker than headline revenue suggests
    - Request accounting memo on revenue timing, acceptance criteria, and deferred-revenue movement
  notes: This gap table distinguishes between facts that are completely undisclosed and topics where a few directional signals exist but are still insufficient for underwriting.
