- id: capital-structure-burn-and-hardware-intensity
  title: Capital structure, burn, and hardware intensity
  body: |-
    Company Overview should carry the full round-by-round chronology; the financial question is what that chronology implies for capital adequacy. Dexory moved from a $19 million Series A in 2023 to an $80 million Series B in 2024 and then to a $165 million 2025 financing package that included a $100 million Series C and expanded growth debt, followed by an additional £8.5 million from the British Business Bank in March 2026. Those raises matter because the filed accounts show a business that was still deeply cash consumptive in FY2025: £22.59 million of pre-tax loss, £20.06 million of cash absorbed by operations, and only £3.55 million of turnover. That is a classic pattern for a hardware-enabled growth company whose commercial traction is still small relative to the cost base.

    The balance-sheet details reinforce the same message. Dexory finished March 2025 with £20.48 million of cash, £1.65 million of inventories, £4.14 million of debtors, and £6.17 million of current creditors. The accounts explicitly say inventories are used in the construction of robots and related equipment capitalized for deployment to customers, which means the company is funding physical assets as well as software. Depreciation of owned tangible fixed assets jumped to £1.50 million, while the cash-flow statement shows higher stocks and higher debtors consumed liquidity during the year. This is not the profile of a pure-license software vendor.

    Debt also entered the stack earlier than the press headlines alone might suggest. Dexory signed a senior secured Bootstrap venture debt facility in August 2024 for £10 million with a further £15 million commitment expected later, drew an initial £3 million tranche, granted warrants, and pledged first-ranking security over all group assets. Filing-history charge registrations in late 2025 are therefore important diligence signals even without disclosed covenant detail. Using FY2025 operating cash absorption and pre-tax loss as rough public burn proxies implies approximately £1.67 million to £1.88 million of monthly burn and only about 10.9 to 12.3 months of runway on March 2025 cash alone. Later fundraising likely reset that runway materially, but current liquidity is still not public.
