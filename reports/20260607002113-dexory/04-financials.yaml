    - Cross-check on burn and cost base
    - Confirms spending still far outran revenue
    - FY2025 accounts; City A.M.
  - - Inventories / raw materials
    - £1.65m at 31 March 2025
    - Shows working capital tied to physical build and deployment
    - Hardware intensity is real, not purely narrative
    - FY2025 accounts
  - - Debtors
    - £4.14m at 31 March 2025
    - Revenue is being recognized ahead of cash collection to some degree
    - Working capital is stretched by receivables as well as stock
    - FY2025 accounts
  - - Current creditors
    - £6.17m at 31 March 2025
    - Suppliers and accruals are helping fund operations
    - Growth likely leans on supplier financing and deferred obligations as well as equity
