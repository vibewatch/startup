- id: disclosure-limits-and-financial-verdict
  title: Disclosure limits and financial verdict
  body: |-
    The financial verdict is straightforward: Dexory has enough public evidence to prove that customers derive operational value and that investors continue to fund the company, but not enough public evidence to underwrite recurring economics with confidence. The best verified positives are that subscription fees dominated FY2025 revenue, customer deployments appear to be expanding, and the company has repeatedly accessed new capital from reputable investors and the British Business Bank. The clearest negatives are the audit qualification on stock quantities, the very large gap between revenue and loss, the introduction of secured venture debt and warrants, and the absence of current cash disclosure after the 2026 top-up.

    For a private company building and deploying robots directly, some opacity is expected. But the missing fields here are not peripheral. There is no public ARR, current revenue run rate, gross margin by stream, CAC, payback, NRR, customer concentration, contract duration, or post-Series-C liquidity disclosure. Those omissions are precisely the inputs needed to decide whether Dexory is becoming a defensible recurring-intelligence platform or merely a well-funded but still loss-heavy deployment business. Public evidence shows a credible commercial product and credible customer value; it does not show whether those economics scale efficiently.

    The practical investment implication is that Dexory’s capital-raising ability has so far compensated for limited self-funded growth. That can be acceptable if revenue quality, renewal behavior, and margin structure improve behind the scenes, but public sources do not yet prove that they have. The company therefore screens as commercially promising but financially under-disclosed. For diligence, the threshold question is no longer whether customers like the product; it is whether recurring gross profit can eventually outrun robot depreciation, working-capital build, and support intensity without repeated equity and debt injections.
