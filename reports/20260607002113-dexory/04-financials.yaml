  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Segmented gross margin by subscription, implementation, support, and hardware servicing.
    whyItMatters: Without gross margin by stream, it is impossible to tell whether recurring software economics are strong enough to absorb robot depreciation and support costs.
    diligencePath: Request cohort P&L, robot servicing cost schedules, and a stream-level gross margin bridge for the last four quarters.
    relatedQuestionRefs:
    - QI027
    relatedTableRefs:
    - TI003
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: current-trading
    missingEvidence: Current 2026 ARR, revenue run rate, net revenue retention, and renewal/cohort data.
    whyItMatters: Funding announcements can mask weak underlying commercial efficiency, so underwriting needs current recurring revenue and retention rather than only case studies.
    diligencePath: Request board deck KPIs, monthly recurring revenue bridge, and trailing-12-month cohort retention tables.
    relatedQuestionRefs:
    - QI028
    relatedTableRefs:
    - TI003
    - TI006
  - type: private-evidence-only
    severity: material
    topic: current-liquidity
    missingEvidence: Current cash balance, undrawn Bootstrap debt capacity, and covenant package after the March 2026 top-up.
    whyItMatters: Historical cash and later fundraising headlines do not reveal present liquidity, leverage headroom, or next-round timing.
    diligencePath: Request current cash waterfall, debt agreement, cap table, and board-approved financing plan.
    relatedQuestionRefs:
    - QI029
    relatedTableRefs:
    - TI004
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue split by customer, site, contract duration, discounting, and implementation versus subscription recognition timing.
    whyItMatters: A few large logistics customers could dominate revenue and materially change renewal or pricing risk, but public sources only provide logos and anecdotes.
    diligencePath: Request top-20 customer schedule, contract terms, revenue-recognition policy memo, and deployment-by-site revenue bridge.
    relatedQuestionRefs:
    - QI030
    relatedTableRefs:
    - TI001
    - TI002
    - TI006
  - type: access-blocked
    severity: minor
    topic: pricing-transparency
    missingEvidence: Independent current price benchmarks for DexoryView contracts and hardware-service bundles.
    whyItMatters: Official pages describe the commercial structure but do not publish list prices, leaving benchmarking to management claims and customer anecdotes.
    diligencePath: Request anonymized customer contracts or procure public buyer references that disclose monthly, annual, or per-site pricing.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI002
