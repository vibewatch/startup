chapter:
  number: 3
  title: Competitors
  summary: Eudia's competitive proposition is a hybrid of legal AI software and human legal-service delivery, with reported customer traction but little public evidence on pricing, comparative performance, or durable switching costs. The available pool identifies adjacent legal-tech vendors and status-quo alternatives more clearly than it establishes a like-for-like feature or price comparison.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Eudia presents itself as a legal-operations platform that combines AI with legal
      expertise, and Fortune describes a further move toward service delivery through
      Eudia Counsel and the acquisition of Johnson Hana. The practical competitor set is
      therefore broader than legal-AI software: it includes contract-workflow products,
      specialist legal workflow tools, outside counsel and internal legal teams. An
      Eudia-hosted article names SpotDraft, StructureFlow, BigHand and ClausePilot, but
      it supplies uneven detail and is not independent comparative proof. Fortune's
      reporting adds a more consequential substitute: corporate legal teams can retain
      outside firms, despite dissatisfaction with billable-hour economics, or keep
      routine work in-house. The listing of Eudia for Word demonstrates a product
      surface for contract review and drafting, while an Eudia recruiting page describes
      customer-specific solutions as part of its delivery model. This mix could broaden
      the addressable use cases, but it also makes the competitive boundary and unit
      economics harder to compare with a software-only vendor. (CP001, CP003, CP004,
      CP005, CP007, CP014)
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP005
      - CP007
      - CP014
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capability-and-packaging
    title: Capabilities, pricing, and buying criteria
    body: >-
      Public materials are not enough to support a feature-by-feature winner claim.
      Microsoft's listing describes Eudia for Word functions such as risk analysis,
      redlining, playbook checks, precedent search and drafting assistance, and says a
      platform subscription is required; no price or commercial unit is shown. The
      available source material names several alternatives but does not establish their
      current feature depth, packaging, or comparable prices. One Eudia-hosted item
      attributes contract-process statistics to a SpotDraft survey, and describes
      StructureFlow's visual mapping as claiming faster deal execution; these are
      directional context, not an independent benchmark of Eudia against either
      vendor. Buyers should compare accuracy on their own documents, admin burden,
      integration and security terms, implementation effort, and total cost against
      outside counsel and internal workflows. Until comparable trials and contracts are
      available, unsupported cells and prices remain unknown rather than inferred.
      (CP005, CP006, CP008, CP009, CP011, CP015)
    claimRefs:
      - CP005
      - CP006
      - CP008
      - CP009
      - CP011
      - CP015
    tableRefs:
      - TP002
      - TP003
  - id: durability-and-risk
    title: Switching costs, moat durability, and evidence gaps
    body: >-
      Eudia's plausible differentiation is contextualized legal knowledge coupled with
      human expertise and tailored deployments, not a publicly demonstrated model
      advantage. Fortune reports that a customer described savings but declined to
      quantify them, and notes that Eudia's leadership views human input as important
      for reliable outcomes. Those signals are consistent with customer-specific
      workflow integration, which could create switching friction through playbooks,
      precedent libraries and trained processes; the public sources do not measure
      implementation cost, renewal behavior, data portability, or multi-homing, so
      lock-in should not be assumed. Fortune also reports that conventional billable
      work remains established even as alternative billing grows, leaving Eudia exposed
      to incumbent response and buyer reluctance to change risk-sensitive workflows.
      The most material diligence is customer-level before/after ROI, renewal and
      expansion data, implementation staffing, security and privilege controls, and
      head-to-head outcomes against both specialist tools and outside counsel.
      (CP001, CP002, CP012, CP014, CP016)
    claimRefs:
      - CP001
      - CP002
      - CP012
      - CP014
      - CP016
