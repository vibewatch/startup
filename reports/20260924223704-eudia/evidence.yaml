evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      Current board roster, independent director status, executive responsibilities, succession planning, and material
      leadership-change history.
    whyItMatters: >-
      Governance and key-person concentration affect execution risk in a company combining regulated legal services with
      AI product delivery.
    diligencePath: >-
      Request the current board and executive roster, governance documents, and a dated leadership-change schedule from
      management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent adverse-event checks for litigation, regulatory findings, customer disputes, layoffs, and leadership
      departures.
    whyItMatters: >-
      The assigned pool is predominantly company-originated or routine coverage and does not support a balanced adverse
      record.
    diligencePath: >-
      Obtain an independent legal, regulatory, workforce, and customer-reference review using sources outside this
      worker's assigned pool.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: company-scale
    missingEvidence: A dated, reconciled valuation, revenue/ARR, active-customer count, and headcount.
    whyItMatters: >-
      Without operating and capitalization metrics, investors cannot assess efficiency, dilution, or scale from the
      financing ceiling and named customer examples.
    diligencePath: Request management financials, latest cap table and valuation, customer schedule, and employee/contractor roster.
    relatedQuestionRefs:
      - QO010
  - type: enumeration-incomplete
    severity: minor
    topic: investor-map
    missingEvidence: Complete investor and ownership schedule, including amounts, security type, and current ownership.
    whyItMatters: Selected financing names do not establish the full syndicate, concentration, or control rights.
    diligencePath: Reconcile the investor table against the latest capitalization table and financing documents.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-timeline
    missingEvidence: >-
      At least eight independently dated milestones covering product, financing, scale, regulatory, partnership, and
      adverse events.
    whyItMatters: The assigned pool supports fewer dated milestones and leaves company development chronology incomplete.
    diligencePath: Request a dated company milestone schedule and validate key entries against independent or primary records.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Representative customer counts and segment-level legal workflow spend, contract volumes, prices, conversion,
      deployment capacity, and retention.
    whyItMatters: >-
      Without addressable workflow denominators and realized economics, market-size claims cannot distinguish eligible
      spend from broad legal budgets or estimate an obtainable share.
    diligencePath: >-
      Request an anonymized customer and pipeline cohort by segment, workflow volumes, realized ACV, deployment time,
      renewal, and buyer budget source; triangulate with representative independent legal-department survey data.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing and unit economics
    missingEvidence: Eudia and peer pricing, contract structures, service fees, discounts, renewals, and implementation costs.
    whyItMatters: Without comparable commercial terms, software-versus-services economics and buyer ROI cannot be underwritten.
    diligencePath: >-
      Request anonymized order forms and renewal cohorts from Eudia customers, then benchmark them against vendor
      proposals and outside-counsel matter costs.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitor capability comparison
    missingEvidence: >-
      Current official product documentation, security and integration materials, and customer references for SpotDraft,
      StructureFlow, BigHand, ClausePilot, and relevant incumbents.
    whyItMatters: The assigned pool names alternatives but does not establish equivalent product scope, quality, or differentiation.
    diligencePath: >-
      Review each vendor's official documentation and conduct workflow-specific customer reference calls and a
      controlled document trial.
    relatedQuestionRefs:
      - QP002
      - QP003
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer-level data on implementation time, migration burden, renewals, expansion, data portability, and
      simultaneous use of competing tools.
    whyItMatters: Claims of contextual-data lock-in or durable workflow adoption are not supported by public evidence in the pool.
    diligencePath: >-
      Interview current and former customers and request cohort retention, deployment effort, and multi-vendor usage
      metrics.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: conflicting-data
    severity: minor
    topic: competitor performance claims
    missingEvidence: Independent methodology and underlying data for the StructureFlow speed claim and the SpotDraft survey figures.
    whyItMatters: Vendor-associated survey and performance claims should not be treated as independent comparative proof.
    diligencePath: Obtain the original reports and validate definitions, sample composition, and results with customers.
    relatedQuestionRefs:
      - QP003
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Current price book, executed customer contracts, discount history, and contract-unit definitions.
    whyItMatters: >-
      Without realized pricing and packaging, reported ARR cannot be connected to customer value, retention, or scalable
      monetization.
    diligencePath: Request the current price book and a redacted contract sample by product, segment, term, and billing metric.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Sales-cycle, pipeline conversion, acquisition cost, payback, channel economics, and customer-level retention data.
    whyItMatters: >-
      These inputs determine whether Eudia can acquire enterprise customers efficiently and sustain growth without
      repeated external capital.
    diligencePath: >-
      Review CRM cohort data and fully loaded sales and marketing expense by segment, including channel-sourced
      business.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: >-
      Revenue and cost of delivery separated between platform software and lawyer-delivered services, including
      implementation and AI costs.
    whyItMatters: >-
      The acquired legal-services capacity may add revenue while limiting or diluting software-like gross margins and
      operating leverage.
    diligencePath: >-
      Obtain monthly gross-margin bridges by product and service line, utilization and realization data, inference
      costs, and integration expenses.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: >-
      Current cash balance, monthly burn, working-capital needs, capex, debt schedule, remaining conditional funding,
      and runway.
    whyItMatters: >-
      The announced Series A includes a material acquisition-contingent portion and does not establish current liquidity
      or capital adequacy.
    diligencePath: >-
      Obtain current balance sheet, cash-flow statements, debt documents, investor funding conditions, and a downside
      runway forecast.
    relatedQuestionRefs:
      - QI006
      - QI009
    relatedTableRefs:
      - TI003
