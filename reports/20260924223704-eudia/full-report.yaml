        title: Operating model and product maturity
        blocks:
          - type: paragraph
            body: >-
              The public picture is a combination of software and legal expertise rather than a fully documented
              self-serve software stack. Eudia's own description frames the platform as AI paired with human expertise;
              Fortune reports that the company expanded into legal services through an Arizona structure, while noting
              it is technically a provider of a law firm rather than itself set up as a law firm. Fortune also describes
              contract and due-diligence use cases at customers, but supplies no instrumented outcome data. A Bengaluru
              engineering hub and recruiting for AI and software engineers indicate investment in development capacity,
              not proof of a particular model, infrastructure, or release process. A partner announcement and a
              product-documentation role add evidence of enterprise delivery and support intent, but their public
              descriptions leave scope, integration depth, and production maturity unclear.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
