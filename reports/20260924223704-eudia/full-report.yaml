              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU013
              - CU014
      - number: '6.3'
        title: Named customer proof and limits
        blocks:
          - type: paragraph
            body: >-
              The strongest named-account evidence is a company press release, supplemented by a company recruiting page
              that repeats several of the same accounts. Both identify Cargill, DHL, Duracell, and Coherent, but neither
              gives customer counts, deployment dates, paid-contract status by account, or an independently measured
              result for every customer. Coherent's CLO is quoted describing trust and significant ROI over an 18-month
              relationship, but no baseline or quantified savings is provided. A competitor-authored alternatives
              article reports that Duracell cut contracting costs by 50% and Graybar completed due diligence 98% faster;
              treat these as unverified reported outcomes because the article supplies no measurement method or
              customer-side corroboration.
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
              - CU011
      - number: '6.4'
        title: Retention, expansion, and concentration remain unproven
        blocks:
          - type: paragraph
            body: >-
              The reviewed customer material contains no NRR, GRR, churn, renewal, contract duration, cohort,
              active-seat, usage-frequency, or account-revenue data. Company references and an outcome-focused
              testimonial cannot establish whether customers renew, expand, or use the product in production at scale.
              Nor does the named account set establish concentration: no denominator or revenue contribution by customer
              is disclosed. Eudia's ServiceNow announcement describes possible reach into sales, marketing, procurement,
              and employees through governed self-service, but it is a partnership announcement rather than evidence of
              cross-functional deployment or realized channel distribution. Customer diligence should obtain
              account-level contract and usage cohorts, renewal history, references, and implementation-stage
              definitions before underwriting durability or expansion.
            claimRefs:
              - CU003
              - CU012
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption quality is not yet measurable from public disclosures
            body: >-
              Named customers and selected outcome claims are not substitutes for account-level production status,
              active usage, renewal, and revenue data; request customer references and cohort evidence before treating
              adoption as durable.
            calloutType: risk
            claimRefs:
              - CU005
              - CU007
              - CU015
          - type: callout
            title: ServiceNow is a distribution option, not proof of channel traction
            body: >-
              The partnership could place Eudia's legal intelligence in enterprise workflows, but the announcement
              leaves joint availability and customer usage unconfirmed.
            calloutType: insight
            claimRefs:
              - CU008
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Eudia's model sits at the intersection of legal practice and software. Fortune reported in September 2025
              that Eudia was operating in Arizona through an Alternative Business Structure as a provider of a law firm,
              rather than being technically set up as a law firm; the same account described the ownership rule as
              distinctive to Arizona. This is a jurisdiction-specific operating structure, not evidence that the model
              has approval to provide legal services everywhere it sells. The company has also announced an acquisition
              bringing more than 300 legal professionals into its workforce, increasing the importance of professional
              responsibility, supervision, conflicts, privilege, and client-consent controls across jurisdictions.
              Current licenses, entity structure, and oversight arrangements are not established by the assigned public
              evidence. Before expansion, counsel should map each service and jurisdiction to the responsible licensed
              entity and document escalation, conflicts, and privilege safeguards. The legal register is necessarily
              partial, not a complete inventory of laws or proceedings.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.2'
        title: Operational, quality, and data-control exposure
        blocks:
          - type: paragraph
            body: >-
              Eudia combines AI workflows with human legal services, making output quality and integration execution
              central operational risks rather than optional product features. Its acquisition announcement describes a
              300-plus-person legal workforce and an ambition to embed human expertise in its AI systems, but neither
              that announcement nor the other allocated material supplies post-integration service levels, error rates,
              escalation outcomes, or audited quality results. Fortune reports that Eudia's CTO stressed the importance
              of citations and that clients must incorporate AI tools patiently; that supports a need for traceability
              and human review, not proof of a specific Eudia defect. Microsoft's Marketplace listing says the Word
              add-in can read and modify documents and transmit data over the internet. Because those documents may
              contain confidential legal material, diligence should establish tenant isolation, retention,
              model-training exclusions, subprocessors, incident response, and contractual allocation of liability. No
              security certification or incident status can be confirmed from this pool.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Dependencies, financial opacity, and thesis-break indicators
        blocks:
          - type: paragraph
            body: >-
              Eudia's route to scale depends on both enterprise adoption and its ability to integrate people and
              technology. The assigned sources identify named large-company relationships but do not disclose active
              customer counts, renewal rates, revenue shares, or the proportion of work delivered by acquired
              professionals. Fortune reports that a customer described savings as considerable while declining to
              quantify them, and that Eudia's CEO declined to discuss specific cost structures; these are disclosure
              limitations, not evidence of poor outcomes. The company announced a Series A of up to $105 million, but
              the announcement does not establish current cash, burn, or the capital required to support a
              services-heavy model. A Microsoft Word add-in also makes part of the product experience dependent on a
              third-party platform. Monitor verified renewal and concentration data, matter-level quality and rework,
              security attestations, and acquired-team retention. Thesis-break triggers include a material
              confidentiality event, inability to maintain jurisdictional authorization, persistent unreviewed AI
              errors, or integration-driven service deterioration.
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR005
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR015
      - number: '7.4'
        title: Diligence priorities and residual uncertainty
        blocks:
          - type: paragraph
            body: >-
              The current record supports a risk framework, not a conclusion that Eudia has breached a rule, suffered a
              security incident, or failed to integrate an acquisition. The allocated sources are predominantly company
              announcements, product listings, and a small number of independent articles; they do not provide regulator
              decisions, litigation outcomes, technical audit reports, quantified customer cohorts, or independently
              verified AI-performance data. Investors should request the legal-entity and jurisdiction matrix,
              professional-indemnity coverage, customer data processing terms, security audit and incident history,
              model and human-review controls, and integration scorecards for acquired teams. These requests should be
              tied to named owners and dated evidence rather than broad assurances. Until that information is available,
              the high-impact exposures remain monitorable but cannot be assigned reliable probability or
              mitigation-maturity scores. The heatmap therefore separates known operating dependencies from unresolved
              likelihoods and does not imply that a listed failure has occurred.
            claimRefs:
              - CR004
              - CR006
              - CR008
              - CR010
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Legal authorization is a scale constraint
            body: >-
              A reported Arizona ABS structure does not establish authority to deliver legal services in other
              jurisdictions; verify entity, licensing, supervision, and professional-liability arrangements before
              underwriting geographic expansion.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: Confidentiality controls remain unverified
            body: >-
              The Word add-in can modify documents and send data over the internet, while the assigned evidence does not
              establish retention, training, subprocessor, or incident controls for sensitive legal content.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing is visible; the price is not
        blocks:
          - type: paragraph
            body: >-
              Eudia announced a Series A of up to $105 million led by General Catalyst in February 2025, a headline
              amount corroborated by the financing counsel, investor, and company-issued announcement (CV001). The
              amount should not be mistaken for a disclosed equity valuation: the reviewed sources provide no usable
              post-money mark, share price, fully diluted capitalization, or comparable investor return terms (CV011,
              CV015). Tracxn's visible page masks the amount and renders valuation fields as uninterpretable numeric
              tokens, so those fields cannot support a valuation estimate (CV004). It does identify the Series A date
              and total reported funding, which is useful round context rather than a price observation (CV003). Yahoo
              Finance's republished Verdict report separates the financing into $30 million upfront and a further $75
              million conditional on additional acquisitions and General Catalyst approval (CV002, CV012). The condition
              is economically important: the headline commitment is not equivalent to unrestricted cash available at
              close, and acquisition-dependent proceeds may carry execution and approval risk. The available sources do
              not disclose whether the conditional tranche was subsequently drawn, its detailed covenants, or its effect
              on ownership and preferences. Investors should therefore underwrite only verified funded proceeds until
              the documents and cash status are confirmed.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.2'
        title: Strategic upside is plausible, but unit economics remain unproven
        blocks:
          - type: paragraph
            body: >-
              The positive case is that Eudia applies AI to expensive, knowledge-intensive legal workflows and combines
              software with human expertise; General Catalyst frames the opportunity as reaching beyond legal-software
              spend into a much broader legal-services market (CV005, CV006). The funding announcement names Cargill,
              DHL, Duracell, and Coherent as users, while Coherent's legal executive describes significant ROI; these
              are meaningful adoption signals but remain selected, largely company- or investor-published evidence
              rather than audited cohort economics (CV008, CV009). Eudia's acquisitions of Johnson Hana and Out-House
              are consistent with a roll-up strategy that could add delivery capacity and customer relationships, while
              also increasing integration and capital needs (CV007, CV014). The countercase is that the assigned pool
              does not show ARR, recognized revenue, gross margin, retention, customer concentration, burn, or cash
              runway (CV010). The company's own financing material acknowledges that legal AI must address trust,
              accuracy, privacy, intellectual-property, and security concerns; these raise implementation and liability
              hurdles rather than proving they are unresolved at Eudia (CV013). No comparable-company or transaction
              evidence in this pool provides a defensible multiple, and neither an investor thesis about a large market
              nor customer testimonials can substitute for realized revenue or margin data. Until diligence establishes
              recurring software economics separately from services and acquired operations, a pure-play software
              multiple would risk overstating value.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Defer price approval pending valuation-critical diligence
        blocks:
          - type: paragraph
            body: >-
              Recommendation: research more before making an investment at any stated price; confidence in that
              recommendation is medium, while confidence in any numerical valuation is low. The decisive missing inputs
              are the latest fully diluted capitalization and financing documents, verified funded cash and
              conditional-tranche status, recurring revenue and gross-margin cohorts, customer retention and
              concentration, and the acquired businesses' purchase consideration and integration economics (CV010,
              CV012, CV015). These determine whether value accrues to software, labor-intensive services, or acquisition
              goodwill and whether new capital is needed before an exit. No target return, hold period, exit value, or
              entry price can be responsibly calculated from the assigned evidence. The bull case requires repeatable
              high-retention software revenue, expanding margins, successful integration, and a material share of the
              stated market opportunity; the base case assumes slower mixed software-and-services growth and continued
              integration costs; the bear case assumes conditional funding is unavailable, acquisitions dilute returns,
              or customer adoption fails to offset delivery and compliance costs. All three cases remain unpriced until
              actual financial and capitalization data are obtained. A disciplined next step is to request the cap table
              and preference stack, audited or board-approved financials, customer-level recurring revenue and renewal
              schedules, acquisition agreements, and the Series A documents; reconsider entry only after translating
              those data into a fully diluted per-share return model.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
