  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included work
        blocks:
          - type: paragraph
            body: >-
              The defensible market boundary is enterprise legal-department work that can be augmented through
              organization-specific contract intelligence and supervised workflow automation: review, redlining,
              drafting, playbook checks, precedent search, and selected due-diligence tasks. Eudia's Microsoft
              Marketplace listing describes contract work inside Word, while Fortune reports that customers use the
              service for contracts and M&A diligence. These are workflow boundaries, not proof of a particular
              addressable-spend total. The adjacent human-services layer is relevant where legal professionals execute
              or review work alongside software; it should not be conflated with pure legal software revenue. General
              outside counsel, litigation strategy, and all corporate legal spend are excluded unless a workflow is
              demonstrably automatable and within Eudia's delivery model. Fortune specifically notes that litigation
              continues to require human lawyers, supporting a narrower boundary than the broad legal-services market.
              The market-definition table separates these included, adjacent, and excluded categories to avoid treating
              the full legal budget as TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Three lenses indicate demand but do not produce an investable market estimate. First, spend-based sizing
              would require the addressable share of corporate legal budgets that maps to eligible workflows; Fortune
              reports management's statement that some clients spend hundreds of millions of dollars on outside counsel,
              but that anecdote is neither an average nor a market denominator. Second, a bottom-up model needs the
              number of eligible legal departments, per-customer workflow volume, deployable use cases, and realized
              annual contract value; none is disclosed in the assigned evidence. Third, workflow penetration evidence is
              suggestive: a company page recounts a SpotDraft survey of 115 in-house departments, reporting that 49%
              still use email, Word, and shared folders for contract management, 56% take at least a week to close
              standard contracts, and 12% report full automation. Those figures describe that survey sample, not the
              whole market, and do not establish Eudia's share or pricing. Consequently, TAM, SAM, and SOM remain
              unquantified; diligence should obtain a representative segmentation, addressable spend, and Eudia
              conversion and retention data before assigning numeric values.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.3'
        title: Buyers, users, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is most plausibly the chief legal officer or general counsel accountable for legal
              risk, outside-counsel budgets, and department capacity; day-to-day users include in-house counsel,
              contract managers, and procurement or sales operations staff who handle agreements. Eudia's product
              listing names those user groups and requires a platform subscription, while its job listing describes
              high-volume contracting for a growing commercial client base. Budget ownership and procurement thresholds
              are not disclosed, so the buyer map distinguishes supported users from inferred budget holders. Adoption
              is most compelling where repeatable contracts, playbooks, and searchable precedent make a workflow bounded
              and measurable. Trust, accuracy, privacy, security, and the need for human review remain constraints:
              Eudia's own funding announcement acknowledges these concerns, and Fortune describes human inputs as
              essential to reliable use. Eudia's engineering-hub expansion is evidence of investment in delivery
              capacity, not evidence that enterprise adoption is frictionless. A deployment case therefore needs
              workflow-level baseline time and cost, measured quality, data-governance approval, and a named budget
              owner.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not capitalize the whole legal budget as TAM
            body: >-
              The evidence identifies specific contract and diligence workflows but does not show what share of legal
              spend Eudia can serve; broad external-counsel or total legal spend is not an addressable-market estimate.
            calloutType: assumption
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM008
          - type: callout
            title: Adoption depends on evidence of trusted workflow outcomes
            body: >-
              Legal teams must preserve accuracy, privacy, security, and human review; buyer enthusiasm or broad
              automation survey data alone does not establish production adoption or repeatable ROI.
            calloutType: risk
            claimRefs:
              - CM006
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Eudia presents itself as a legal-operations platform that combines AI with legal expertise, and Fortune
              describes a further move toward service delivery through Eudia Counsel and the acquisition of Johnson
              Hana. The practical competitor set is therefore broader than legal-AI software: it includes
              contract-workflow products, specialist legal workflow tools, outside counsel and internal legal teams. An
              Eudia-hosted article names SpotDraft, StructureFlow, BigHand and ClausePilot, but it supplies uneven
              detail and is not independent comparative proof. Fortune's reporting adds a more consequential substitute:
              corporate legal teams can retain outside firms, despite dissatisfaction with billable-hour economics, or
              keep routine work in-house. The listing of Eudia for Word demonstrates a product surface for contract
              review and drafting, while an Eudia recruiting page describes customer-specific solutions as part of its
              delivery model. This mix could broaden the addressable use cases, but it also makes the competitive
              boundary and unit economics harder to compare with a software-only vendor. (CP001, CP003, CP004, CP005,
              CP007, CP014)
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP008
              - CP011
              - CP012
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP012
              - CP013
      - number: '3.2'
        title: Capabilities, pricing, and buying criteria
        blocks:
          - type: paragraph
            body: >-
              Public materials are not enough to support a feature-by-feature winner claim. Microsoft's listing
              describes Eudia for Word functions such as risk analysis, redlining, playbook checks, precedent search and
              drafting assistance, and says a platform subscription is required; no price or commercial unit is shown.
              The available source material names several alternatives but does not establish their current feature
              depth, packaging, or comparable prices. One Eudia-hosted item attributes contract-process statistics to a
              SpotDraft survey, and describes StructureFlow's visual mapping as claiming faster deal execution; these
              are directional context, not an independent benchmark of Eudia against either vendor. Buyers should
              compare accuracy on their own documents, admin burden, integration and security terms, implementation
              effort, and total cost against outside counsel and internal workflows. Until comparable trials and
              contracts are available, unsupported cells and prices remain unknown rather than inferred. (CP005, CP006,
              CP008, CP009, CP011, CP015)
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
              - CP011
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP015
      - number: '3.3'
        title: Switching costs, moat durability, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Eudia's plausible differentiation is contextualized legal knowledge coupled with human expertise and
              tailored deployments, not a publicly demonstrated model advantage. Fortune reports that a customer
              described savings but declined to quantify them, and notes that Eudia's leadership views human input as
              important for reliable outcomes. Those signals are consistent with customer-specific workflow integration,
              which could create switching friction through playbooks, precedent libraries and trained processes; the
              public sources do not measure implementation cost, renewal behavior, data portability, or multi-homing, so
              lock-in should not be assumed. Fortune also reports that conventional billable work remains established
              even as alternative billing grows, leaving Eudia exposed to incumbent response and buyer reluctance to
              change risk-sensitive workflows. The most material diligence is customer-level before/after ROI, renewal
              and expansion data, implementation staffing, security and privilege controls, and head-to-head outcomes
              against both specialist tools and outside counsel. (CP001, CP002, CP012, CP014, CP016)
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP014
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Service breadth creates an evidence and execution burden
            body: >-
              Eudia's move from software into human legal-service delivery may strengthen its offer but makes margin,
              implementation capacity, and regulatory structure central competitive questions; the assigned evidence
              does not resolve these economics.
            calloutType: risk
            claimRefs:
              - CP003
              - CP004
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Eudia describes an AI platform for corporate legal teams, while its reported acquisition of Johnson Hana
              adds a substantial legal-services delivery capability. The evidence therefore points to a potential blend
              of enterprise software and people-intensive legal work, not a clean, proven pure-software revenue profile
              (CI009, CI010). Eudia has also been associated with a $1.25 million Air Force contract-handling
              engagement, but the available coverage does not say whether that amount is recurring, recognized over
              multiple periods, or representative of other customer contracts (CI008, CI016). Neither list pricing nor
              realized pricing, revenue mix, contract terms, or discounting is established in this source set (CI012).
              Investors should diligence the revenue stream and underlying contract economics separately rather than
              applying a software multiple to the reported customer work by default.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI012
              - CI016
