        blocks:
          - type: paragraph
            body: >-
              Eudia positions its product for enterprise in-house legal departments, with chief legal officers and
              general counsel as the evident economic sponsors and lawyers as the primary professional users. Its 2025
              launch release describes Fortune 500 legal teams as its market and says named companies' CLOs were using
              its solutions; a current product-role listing likewise describes contract review, diligence, compliance
              analysis, and advisory research for corporate legal teams. These are company-controlled descriptions, not
              a measured segmentation by customer count, contract value, or seat usage. The public material suggests
              high-stakes, document- intensive legal operations rather than a self-serve small-team product.
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: table
            tableRef: TU001
