              - CU012
      - number: '6.2'
        title: Adoption trajectory and routes to market
        blocks:
          - type: paragraph
            body: >-
              Public adoption signals are discrete rather than a time series. Eudia's 2025 release says its solutions
              were being used by CLOs at named Fortune 500 companies, while Coherent's CLO offered a favorable but
              qualitative testimonial. An industry newsletter excerpt on Eudia's site reports a $1.25 million U.S. Air
              Force contract-handling deal; the captured text does not establish contract duration, delivery status, or
              realized outcomes. In March 2026 Eudia announced a ServiceNow partnership to embed legal capabilities in
              ServiceNow products, but the same announcement says joint-solution availability details would follow. The
              evidence therefore supports named customer and channel signals, not a verified adoption curve or proof
              that the partnership workflows are in production.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
