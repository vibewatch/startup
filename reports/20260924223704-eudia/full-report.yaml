  - id: FI001
    title: Capital-to-capacity model and financial proof points
    type: flow
    summary: >-
      The reported financing structure links acquisition execution to capital release and expanded legal-delivery
      capacity; disclosed sources do not quantify the resulting unit economics.
    data:
      nodes:
        - id: committed-capital
          label: Series A
          detail: Up to $105 million announced; $30 million upfront and $75 million conditional, as reported.
        - id: acquisition-execution
          label: Acquisition targets
          detail: The remaining capital was reported contingent on acquisitions and investor approval.
        - id: expanded-capacity
          label: Software plus legal talent
          detail: Johnson Hana added more than 300 legal professionals, alongside Eudia's AI platform.
        - id: customer-delivery
          label: Enterprise work
          detail: >-
            Reported ARR across dozens of clients and a separate $1.25 million Air Force contract are historical public
            signals, not a current revenue bridge.
        - id: current-liquidity
          label: Current liquidity
          detail: >-
            Cash, burn, debt, runway, and capital released since the reported financing structure are not disclosed in
            the allocated evidence.
        - id: gross-profit-proof
          label: Unproven economics
          detail: Current revenue mix, delivery cost, gross margin, cash use, and recognition timing remain undisclosed.
      edges:
        - from: committed-capital
          to: acquisition-execution
          label: conditional funding release
        - from: acquisition-execution
          to: expanded-capacity
          label: acquired delivery capability
        - from: expanded-capacity
          to: customer-delivery
          label: software and human services
        - from: customer-delivery
          to: gross-profit-proof
          label: requires contract and cost data
    approximationNotes: >-
      Conceptual, unscaled flow based on reported financing and acquisition facts; it does not imply amounts deployed,
      revenue recognition, or profitability.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI015
