      - number: '5.3'
        title: Trust controls and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Trust is central to the product's legal use case, but the evidence is stronger on stated intent and user
              permissions than on independently verified controls. Eudia's launch material emphasizes trust, accuracy,
              privacy, intellectual property, and security; the Microsoft listing separately discloses that the Word
              add-in can read and modify documents and transmit data over the internet. Fortune quotes Eudia's CTO
              emphasizing citations and human input as important to reliable AI outputs. None of the reviewed prefetched
              materials establishes data-retention settings, tenant isolation, model-training policy, audit logs,
              independent security attestations, or service-level reliability. Nor does the available source set expose
              public repositories, release artifacts, or practitioner-community activity. Buyers should validate these
              controls and request production references and benchmark methodology before relying on legal outputs.
            claimRefs:
