      - number: '1.4'
        title: Products, services, and named customers
        blocks:
          - type: paragraph
            body: >-
              Eudia describes an integrated offer spanning AI-augmented contracting and M&A, configurable Sigma agents,
              analytics through Insights, and Eudia Counsel, a legal-services operation the company says runs under
              Arizona's Alternative Business Structure framework (CO009, CO010). These are company descriptions, not
              independently measured outcomes. Company materials name enterprise organizations including Cargill, DHL,
              Duracell, Coherent, Intuit, Citibank, Stripe, and the U.S. Government (CO011), but do not provide a dated
              customer roster, active-customer count, contract values, or customer-side validation in this pool. A
              newsletter republished on Eudia's site reported a $1.25 million U.S. Air Force contract-handling deal; the
              underlying award and its timing are not independently verified by the assigned sources (CO012).
