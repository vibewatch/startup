      - number: '4.2'
        title: Traction, efficiency, and cost structure
        blocks:
          - type: paragraph
            body: >-
              Business Insider reported in July 2025 that CEO Omar Haroun said Eudia had surpassed $10 million in ARR
              across dozens of clients and was targeting $20 million by year-end 2025 (CI004, CI005). These are
              attributed company statements reported at that time, not independently audited results or current 2026
              metrics; the target is historical and must not be treated as achieved. No allocated source supplies
              customer-level revenue, sales cycle, CAC, payback, retention, utilization, gross margin, or AI and
              delivery costs (CI013, CI014). Acquiring more than 300 legal professionals may broaden the service offer
              while increasing labor and integration demands; the sources provide no cost or margin bridge with which to
              test that trade-off (CI007). These gaps prevent a credible assessment of operating leverage or revenue
              quality.
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI013
              - CI014
          - type: table
