  - id: FV001
    title: Recommendation logic from public evidence to entry decision
    type: flow
    summary: >-
      Strong strategic signals cannot support an entry price until financing, operating performance, and ownership
      economics are verified.
    data:
      nodes:
        - id: disclosed-round
          label: Up-to $105M Series A; part may be conditional
        - id: missing-price
          label: No usable post-money valuation or preference stack
        - id: strategic-signal
          label: Enterprise users and AI-plus-human legal model
        - id: missing-economics
          label: Revenue, margins, retention, burn, and acquisition returns unavailable
        - id: diligence
          label: Verify funded cash, financials, cap table, and acquisition economics
        - id: decision
          label: Research more; defer price approval
      edges:
        - from: disclosed-round
          to: missing-price
          label: funding amount is not valuation
        - from: strategic-signal
          to: missing-economics
          label: adoption claims do not establish unit economics
        - from: missing-price
          to: diligence
        - from: missing-economics
          to: diligence
        - from: diligence
          to: decision
          label: reprice only with verified inputs
