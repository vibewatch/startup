chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Eudia is described as a legal-technology company founded in 2023 and based in Palo Alto, California; the
              available profile and independent news report converge on those basics, although the assigned pool
              includes no corporate filing to establish the legal entity or incorporation date (CO001). Its stated model
              combines an AI platform for in-house legal work with embedded legal expertise rather than selling only
              standalone software (CO009, CO010). The company identifies contracting, M&A, Sigma agents, and Insights as
              platform solutions. This positioning makes both software execution and service delivery central to the
              company identity; it should not be read as evidence of product performance or scale.
            claimRefs:
              - CO001
              - CO009
              - CO010
      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The sources identify Omar Haroun as CEO and co-founder, David Van Reyk as COO and co-founder, and Ashish
              Agrawal as CTO and co-founder (CO002, CO003, CO004). The leadership table is limited to these explicitly
              named founders; the source pool does not establish a complete executive roster, board composition,
              decision rights, succession arrangements, or material leadership changes. This is a meaningful diligence
              limitation for a business whose model combines legal judgment, AI systems, and client delivery. The
              company reports Haroun's 2025 Goldman Sachs recognition (CO015), but that award is not a substitute for
              independent governance disclosure or evidence about the team's operating depth.
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO004
      - number: '1.3'
        title: Financing and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Eudia announced a Series A of up to $105 million on February 13, 2025, led by General Catalyst (CO005).
              The contemporaneous report distinguishes $30 million of committed equity from $75 million reserved for
              M&A, so the headline ceiling should not be treated as cash already raised or deployed (CO006). Eudia later
              described funding as over $100 million, while an independent fundraising profile shows two rounds and a
              latest raise date of April 28, 2025 without enough detail to reconcile the activity to an amount (CO007,
              CO008). The reviewed sources do not establish a valuation, revenue/ARR, headcount, or total customer count
              (CO013). These gaps prevent reliable estimates of capital efficiency or operating scale.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO013
