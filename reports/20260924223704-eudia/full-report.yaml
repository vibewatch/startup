              - CI005
              - CI013
              - CI014
              - CI015
      - number: '4.3'
        title: Capital needs and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Eudia announced a Series A of up to $105 million led by General Catalyst (CI001). Independent coverage
              described a nonstandard release structure: $30 million upfront, with the remaining $75 million contingent
              on acquisition targets and General Catalyst approval (CI002). The company said the partnership would
              support product and customer expansion, while reporting also linked the initial capital to product and
              engineering hiring (CI003). That structure can fund inorganic expansion, but makes access to the full
              headline amount dependent on deal execution and investor approval; it is not evidence that the entire
              amount is available cash. Public information reviewed here does not establish cash balance, burn, runway,
              debt, working capital, capex, or the amount of committed capital still undrawn (CI015). With acquisition
              terms, integration costs, and current financials undisclosed, capital adequacy and the next-round trigger
              remain material diligence blockers.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Headline funding is not equivalent to available cash
            body: >-
              The reported $75 million balance was conditional on acquisitions and General Catalyst approval; verify
              what has been released, what remains committed, and the conditions still outstanding.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI015
          - type: callout
            title: Underwrite the software and services economics separately
            body: >-
              Require current cohort ARR, contract-level revenue recognition, software gross margin, lawyer utilization
              and delivery cost, and acquisition integration costs before accepting the reported ARR as evidence of
              scalable software economics.
            calloutType: recommendation
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI013
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and legal workflows
        blocks:
          - type: paragraph
            body: >-
              Eudia describes an augmented-intelligence platform for corporate legal teams, and its Microsoft
              Marketplace listing makes one product surface concrete: an add-in for Microsoft Word that supports
              contract review and drafting. The listed tasks include risk analysis, proposed redlines, checking terms
              against company playbooks, precedent search, drafting assistance, and conversational questions about a
              document. The listing says a platform subscription is required, so the add-in is not evidenced as a
              standalone product. This is a reasonably specific workflow proposition, but the available sources provide
              no measured review accuracy, cycle-time improvement, or feature-level adoption data. The module matrix
              therefore separates described product capabilities from outcomes that still need customer validation.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
