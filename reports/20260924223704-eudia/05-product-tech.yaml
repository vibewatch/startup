  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: developer-signal
      missingEvidence: The assigned public evidence contains no public code repository, release history, package or API usage signal, or practitioner-community proxy.
      whyItMatters: Without an observable developer or practitioner signal, product iteration, technical adoption, and external feedback loops cannot be independently assessed.
      diligencePath: Request the customer-facing documentation, product changelog, integration inventory, and any public or shareable engineering artifacts; if none exist, interview implementation partners and engineering users.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: product-validation
      missingEvidence: Independent production benchmarks for legal-task accuracy, citation quality, latency, uptime, and measurable customer outcomes were not present in the assigned source set.
      whyItMatters: Legal workflows are high consequence, and product claims cannot be underwritten from capability descriptions or selected customer anecdotes alone.
      diligencePath: Request benchmark protocols and results by task, error and escalation rates, production service-level history, and references able to validate baselines and measured outcomes.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: trust-and-security
      missingEvidence: Public evidence reviewed does not substantiate data retention, model-training use, tenant isolation, auditability, independent security certifications, or recovery controls.
      whyItMatters: The Word add-in can handle sensitive contract documents and transmit data externally, so buyers need a verifiable security and governance model.
      diligencePath: Obtain the security architecture, data-processing terms, retention controls, model-provider and training policy, SOC 2 or equivalent reports, penetration-test summary, and incident-response commitments.
      relatedQuestionRefs: [QE006]
