chapter:
  number: 5
  title: Product & Technology
  summary: Eudia publicly presents a legal-work platform that combines AI assistance with human expertise, including contract workflows in Microsoft Word and a broader legal-services model. The available evidence describes product surfaces and intended controls but does not establish underlying architecture, independently measured performance, or security certifications.
sections:
  - id: product-surface
    title: Product surface and legal workflows
    body: >-
      Eudia describes an augmented-intelligence platform for corporate legal teams, and its Microsoft
      Marketplace listing makes one product surface concrete: an add-in for Microsoft Word that
      supports contract review and drafting. The listed tasks include risk analysis, proposed redlines,
      checking terms against company playbooks, precedent search, drafting assistance, and conversational
      questions about a document. The listing says a platform subscription is required, so the add-in is
      not evidenced as a standalone product. This is a reasonably specific workflow proposition, but the
      available sources provide no measured review accuracy, cycle-time improvement, or feature-level
      adoption data. The module matrix therefore separates described product capabilities from outcomes
      that still need customer validation.
    claimRefs: [CE001, CE002, CE003, CE004, CE006]
    tableRefs: [TE001, TE002]
  - id: operating-model
    title: Operating model and product maturity
    body: >-
      The public picture is a combination of software and legal expertise rather than a fully documented
      self-serve software stack. Eudia's own description frames the platform as AI paired with human
      expertise; Fortune reports that the company expanded into legal services through an Arizona
      structure, while noting it is technically a provider of a law firm rather than itself set up as a
      law firm. Fortune also describes contract and due-diligence use cases at customers, but supplies
      no instrumented outcome data. A Bengaluru engineering hub and recruiting for AI and software
      engineers indicate investment in development capacity, not proof of a particular model,
      infrastructure, or release process. A partner announcement and a product-documentation role add
      evidence of enterprise delivery and support intent, but their public descriptions leave scope,
      integration depth, and production maturity unclear.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-and-validation
    title: Trust controls and diligence priorities
    body: >-
      Trust is central to the product's legal use case, but the evidence is stronger on stated intent and
      user permissions than on independently verified controls. Eudia's launch material emphasizes
      trust, accuracy, privacy, intellectual property, and security; the Microsoft listing separately
      discloses that the Word add-in can read and modify documents and transmit data over the internet.
      Fortune quotes Eudia's CTO emphasizing citations and human input as important to reliable AI
      outputs. None of the reviewed prefetched materials establishes data-retention settings, tenant
      isolation, model-training policy, audit logs, independent security attestations, or service-level
      reliability. Nor does the available source set expose public repositories, release artifacts, or
      practitioner-community activity. Buyers should validate these controls and request production
      references and benchmark methodology before relying on legal outputs.
    claimRefs: [CE013, CE014, CE015]
    tableRefs: []
