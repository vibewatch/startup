chapter:
  number: 8
  title: Valuation
  summary: Public evidence documents an up-to-$105 million Series A, but does not establish a usable post-money valuation, operating metrics, or investor economics. Because the reported financing includes a substantial acquisition-contingent tranche and the company combines software with human-enabled legal services and acquisitions, the evidence supports further diligence rather than a price-led investment decision.
sections:
  - id: financing-and-price-discovery
    title: Financing is visible; the price is not
    body: >-
      Eudia announced a Series A of up to $105 million led by General Catalyst in February 2025, a headline amount corroborated by the financing counsel, investor, and company-issued announcement (CV001). The amount should not be mistaken for a disclosed equity valuation: the reviewed sources provide no usable post-money mark, share price, fully diluted capitalization, or comparable investor return terms (CV011, CV015). Tracxn's visible page masks the amount and renders valuation fields as uninterpretable numeric tokens, so those fields cannot support a valuation estimate (CV004). It does identify the Series A date and total reported funding, which is useful round context rather than a price observation (CV003).
      Yahoo Finance's republished Verdict report separates the financing into $30 million upfront and a further $75 million conditional on additional acquisitions and General Catalyst approval (CV002, CV012). The condition is economically important: the headline commitment is not equivalent to unrestricted cash available at close, and acquisition-dependent proceeds may carry execution and approval risk. The available sources do not disclose whether the conditional tranche was subsequently drawn, its detailed covenants, or its effect on ownership and preferences. Investors should therefore underwrite only verified funded proceeds until the documents and cash status are confirmed.
    claimRefs: [CV001, CV002, CV003, CV004, CV011, CV012, CV015]
    tableRefs: [TV001]
  - id: underwriting-thesis-and-countercase
    title: Strategic upside is plausible, but unit economics remain unproven
    body: >-
      The positive case is that Eudia applies AI to expensive, knowledge-intensive legal workflows and combines software with human expertise; General Catalyst frames the opportunity as reaching beyond legal-software spend into a much broader legal-services market (CV005, CV006). The funding announcement names Cargill, DHL, Duracell, and Coherent as users, while Coherent's legal executive describes significant ROI; these are meaningful adoption signals but remain selected, largely company- or investor-published evidence rather than audited cohort economics (CV008, CV009). Eudia's acquisitions of Johnson Hana and Out-House are consistent with a roll-up strategy that could add delivery capacity and customer relationships, while also increasing integration and capital needs (CV007, CV014).
      The countercase is that the assigned pool does not show ARR, recognized revenue, gross margin, retention, customer concentration, burn, or cash runway (CV010). The company's own financing material acknowledges that legal AI must address trust, accuracy, privacy, intellectual-property, and security concerns; these raise implementation and liability hurdles rather than proving they are unresolved at Eudia (CV013). No comparable-company or transaction evidence in this pool provides a defensible multiple, and neither an investor thesis about a large market nor customer testimonials can substitute for realized revenue or margin data. Until diligence establishes recurring software economics separately from services and acquired operations, a pure-play software multiple would risk overstating value.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV013, CV014]
    tableRefs: [TV002]
  - id: price-sensitive-decision
    title: Defer price approval pending valuation-critical diligence
    body: >-
      Recommendation: research more before making an investment at any stated price; confidence in that recommendation is medium, while confidence in any numerical valuation is low. The decisive missing inputs are the latest fully diluted capitalization and financing documents, verified funded cash and conditional-tranche status, recurring revenue and gross-margin cohorts, customer retention and concentration, and the acquired businesses' purchase consideration and integration economics (CV010, CV012, CV015). These determine whether value accrues to software, labor-intensive services, or acquisition goodwill and whether new capital is needed before an exit.
      No target return, hold period, exit value, or entry price can be responsibly calculated from the assigned evidence. The bull case requires repeatable high-retention software revenue, expanding margins, successful integration, and a material share of the stated market opportunity; the base case assumes slower mixed software-and-services growth and continued integration costs; the bear case assumes conditional funding is unavailable, acquisitions dilute returns, or customer adoption fails to offset delivery and compliance costs. All three cases remain unpriced until actual financial and capitalization data are obtained. A disciplined next step is to request the cap table and preference stack, audited or board-approved financials, customer-level recurring revenue and renewal schedules, acquisition agreements, and the Series A documents; reconsider entry only after translating those data into a fully diluted per-share return model.
    claimRefs: [CV010, CV011, CV012, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
