  - id: TV002
    title: Investment thesis and anti-thesis
    columns: [Argument, Evidence and limitation, What would change the view]
    rows:
      - ["Legal-workflow automation may unlock value", "Investor and company sources describe an AI-plus-human platform and a large legal-services opportunity; the market-size framing is not Eudia revenue", "Verified recurring software revenue, repeatable deployment, and customer ROI cohorts"]
      - ["Enterprise adoption offers a starting signal", "Named Fortune 500 users and one customer executive's ROI testimony are positive but selected and unaudited", "Renewal rates, expansion, concentration, and independently validated customer outcomes"]
      - ["Acquisitions can extend delivery and reach", "Company reporting describes acquisitions, but purchase prices, integration costs, and acquired margins are absent", "Deal terms, acquired revenue quality, integration milestones, and post-deal contribution margins"]
      - ["Capital and execution risk may offset upside", "A reported $75 million tranche depends on further acquisitions and investor approval; draw status and full terms are unknown", "Executed financing documents, cash confirmation, and a funded operating plan"]
    notes: "Evidence is limited to the assigned prefetched pool; company and investor claims are identified as such and are not treated as audited performance."
    claimRefs: [CV002, CV005, CV006, CV007, CV008, CV009, CV012, CV013, CV014]
  - id: TV003
    title: Conditional bull, base, and bear scenarios
    columns: [Case and probability signal, Explicit assumptions, Valuation / return range, Downside trigger and evidence needed]
    rows:
      - ["Bull — possible, unquantified", "Software revenue proves recurring and high-retention; margins expand; acquisitions integrate without materially diluting economics", "Not publicly estimable; no entry valuation, revenue base, or defensible multiple is disclosed", "Validate customer cohorts, software/services split, acquisition contribution, and fully diluted cap table"]
      - ["Base — planning case, unquantified", "Growth continues across a mixed software-and-services model, with ordinary enterprise sales cycles and ongoing integration expense", "Not publicly estimable; use a scenario model only after financial and capitalization data are supplied", "Track renewal and expansion, gross margin by offering, cash runway, and funded Series A proceeds"]
      - ["Bear — material downside, unquantified", "The conditional tranche is not released, integration absorbs capital, or trust/compliance hurdles slow adoption and expansion", "Not publicly estimable; downside may include additional dilution or impaired equity value", "Confirm tranche conditions, liquidity, preference stack, concentration, and acquisition liabilities"]
    notes: "Probability signals are qualitative, not fabricated percentages. Public evidence does not support numerical valuation ranges or target returns; the scenario outputs remain explicitly unpriced."
    claimRefs: [CV002, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
