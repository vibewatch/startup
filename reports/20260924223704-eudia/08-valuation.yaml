  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation-disclosure
      missingEvidence: Latest fully diluted capitalization, priced round value, share class terms, liquidation preferences, and any secondary marks.
      whyItMatters: Without price and ownership rights, a headline funding amount cannot be converted into enterprise value, dilution, or an investor return.
      diligencePath: Request the executed Series A financing documents, current cap table, preference waterfall, and board-approved valuation materials from the company.
      relatedQuestionRefs: [QV001, QV006]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: operating-economics
      missingEvidence: Revenue and ARR by software versus services, gross margin, customer cohorts, retention, burn, runway, and customer concentration.
      whyItMatters: These metrics determine the appropriate valuation method, ability to scale, and need for further dilution.
      diligencePath: Obtain audited or board-approved financial statements, cohort schedules, customer concentration, and a cash forecast reconciled to bank balances.
      relatedQuestionRefs: [QV003, QV004, QV007]
      relatedTableRefs: [TV002, TV003]
    - type: missing-source
      severity: material
      topic: comparable-transactions
      missingEvidence: Verified public-company peers, private financing marks, and acquisition transactions with comparable business mix and disclosed financial denominators.
      whyItMatters: The assigned pool has no robust benchmark for selecting an earnings, revenue, or software multiple.
      diligencePath: Build a dated comparable set from primary filings and transaction documents after the company's revenue mix and scale are confirmed.
      relatedQuestionRefs: [QV005]
      relatedTableRefs: [TV003]
    - type: private-evidence-only
      severity: material
      topic: conditional-tranche
      missingEvidence: Executed conditions, approval rights, cash draw status, acquisition consideration, and the dilution and liabilities attached to acquired operations.
      whyItMatters: A conditional commitment may not be available when required, and acquisition-led growth can consume capital without improving equity returns.
      diligencePath: Verify funding notices and bank receipt, review the Series A conditions and acquisition agreements, and reconcile post-close operating results.
      relatedQuestionRefs: [QV002, QV007, QV008]
      relatedTableRefs: [TV002, TV003]
