  topStrengths:
    - Distinctive combination of enterprise legal AI, institutional-knowledge workflows, and human legal expertise.
    - Named enterprise relationships and a company-attributed July 2025 ARR signal above $10 million indicate early commercial traction.
    - Institutional backing, product breadth, and acquired legal-service capacity create multiple paths to expansion.
  topRisks:
    - Current revenue quality, margins, burn, runway, capitalization, and valuation are not publicly verifiable.
    - Jurisdiction-specific legal-service authority and confidential-data, security, and AI-quality controls remain insufficiently evidenced.
    - The acquisition-led, human-enabled model creates integration, labor-intensity, and software-versus-services margin risk.
    - Retention, expansion, active usage, and customer concentration are undisclosed.
  unresolvedGaps:
    - Obtain current audited or board-approved financials, cash and burn data, and a software-versus-services revenue and gross-margin bridge.
    - Verify the fully diluted cap table, preference stack, funded Series A proceeds, and status of the conditional M&A tranche.
    - Review customer-level ARR, renewals, expansion, concentration, usage, and independently validated workflow outcomes.
    - Validate security architecture, data retention and training terms, incident history, AI error controls, and independent attestations.
    - Map legal entities, professional supervision, conflicts, privilege safeguards, and service authorization by jurisdiction.
