  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-retention
      missingEvidence: Customer-level NRR, GRR, churn, renewal rates, contract terms, cohorts, active users, and usage frequency.
      whyItMatters: Without retention and usage evidence, named logos and testimonials cannot establish recurring value or product durability.
      diligencePath: Request 8-quarter customer cohorts, renewal and expansion schedules, active-seat and workflow usage exports, and reference calls with customers at different tenure stages.
      relatedQuestionRefs: [QU004, QU005]
    - type: missing-source
      severity: material
      topic: independent-customer-proof
      missingEvidence: Customer-side confirmation and public procurement or implementation records for named deployments, the Air Force deal, and reported outcome metrics.
      whyItMatters: The available named references are primarily company-controlled, while the numerical savings and speed claims lack methods and independent corroboration.
      diligencePath: Obtain named customer references, contract award and performance records, implementation-stage definitions, and the underlying before/after measurement methodology.
      relatedQuestionRefs: [QU006, QU007, QU008, QU009, QU010]
      relatedTableRefs: [TU002, TU003]
    - type: enumeration-incomplete
      severity: material
      topic: customer-concentration
      missingEvidence: Complete active-account roster with customer revenue, contract value, product scope, and channel attribution.
      whyItMatters: The public named-customer list is partial and cannot reveal account concentration, sales dependence, or customer-level expansion.
      diligencePath: Request a reconciled customer schedule showing active and churned accounts, ARR or contract value bands, renewal dates, and direct versus partner-sourced status.
      relatedQuestionRefs: [QU005, QU010]
      relatedTableRefs: [TU003]
    - type: access-blocked
      severity: minor
      topic: inaccessible-independent-candidates
      missingEvidence: Readable, substantive independent source text for the assigned Democrata and Techmeme candidates.
      whyItMatters: The prefetched captures did not yield usable evidence to corroborate partnership or market-entry context.
      diligencePath: Obtain accessible copies or independent customer-side records before using either candidate to support a factual adoption claim.
      relatedQuestionRefs: [QU010]
