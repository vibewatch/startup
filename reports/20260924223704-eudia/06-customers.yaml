company:
  name: Eudia
chapter:
  number: 6
  title: Customers
  summary: >-
    Eudia's materials identify Fortune 500 in-house legal departments and name Cargill,
    DHL, Duracell, and Coherent as customers, while a low-confidence independent blog
    reports outcomes for Duracell and Graybar. A reported U.S. Air Force contract and
    a ServiceNow partnership indicate public-sector and platform-channel potential, but
    public evidence does not establish active account counts, recurring usage, retention,
    or customer concentration.
sections:
  - id: buyer-and-user-segments
    title: Buyer, payer, and use-case segments
    body: >-
      Eudia positions its product for enterprise in-house legal departments, with chief
      legal officers and general counsel as the evident economic sponsors and lawyers
      as the primary professional users. Its 2025 launch release describes Fortune 500
      legal teams as its market and says named companies' CLOs were using its solutions;
      a current product-role listing likewise describes contract review, diligence,
      compliance analysis, and advisory research for corporate legal teams. These are
      company-controlled descriptions, not a measured segmentation by customer count,
      contract value, or seat usage. The public material suggests high-stakes, document-
      intensive legal operations rather than a self-serve small-team product.
    claimRefs: [CU001, CU002, CU004]
    tableRefs: [TU001]
  - id: adoption-and-route-to-market
    title: Adoption trajectory and routes to market
    body: >-
      Public adoption signals are discrete rather than a time series. Eudia's 2025
      release says its solutions were being used by CLOs at named Fortune 500 companies,
      while Coherent's CLO offered a favorable but qualitative testimonial. An industry
      newsletter excerpt on Eudia's site reports a $1.25 million U.S. Air Force
      contract-handling deal; the captured text does not establish contract duration,
      delivery status, or realized outcomes. In March 2026 Eudia announced a ServiceNow
      partnership to embed legal capabilities in ServiceNow products, but the same
      announcement says joint-solution availability details would follow. The evidence
      therefore supports named customer and channel signals, not a verified adoption
      curve or proof that the partnership workflows are in production.
    claimRefs: [CU007, CU008, CU009, CU013]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named customer proof and limits
    body: >-
      The strongest named-account evidence is a company press release, supplemented by
      a company recruiting page that repeats several of the same accounts. Both identify
      Cargill, DHL, Duracell, and Coherent, but neither gives customer counts, deployment
      dates, paid-contract status by account, or an independently measured result for
      every customer. Coherent's CLO is quoted describing trust and significant ROI
      over an 18-month relationship, but no baseline or quantified savings is provided.
      A competitor-authored alternatives article reports that Duracell cut contracting
      costs by 50% and Graybar completed due diligence 98% faster; treat these as
      unverified reported outcomes because the article supplies no measurement method
      or customer-side corroboration.
    claimRefs: [CU005, CU006, CU010, CU011]
    tableRefs: [TU003]
  - id: durability-and-concentration-gaps
    title: Retention, expansion, and concentration remain unproven
    body: >-
      The reviewed customer material contains no NRR, GRR, churn, renewal, contract
      duration, cohort, active-seat, usage-frequency, or account-revenue data. Company
      references and an outcome-focused testimonial cannot establish whether customers
      renew, expand, or use the product in production at scale. Nor does the named
      account set establish concentration: no denominator or revenue contribution by
      customer is disclosed. Eudia's ServiceNow announcement describes possible reach
      into sales, marketing, procurement, and employees through governed self-service,
      but it is a partnership announcement rather than evidence of cross-functional
      deployment or realized channel distribution. Customer diligence should obtain
      account-level contract and usage cohorts, renewal history, references, and
      implementation-stage definitions before underwriting durability or expansion.
    claimRefs: [CU003, CU012, CU014, CU015]
