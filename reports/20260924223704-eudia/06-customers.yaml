    columns: [Signal / metric, Value or status, Date, Source quality, Implication, Missing denominator or proof]
    rows:
      - ["Named enterprise organizations", "Cargill; DHL; Duracell; Coherent", "2025 release and 2026 recruiting page", "Company-reported", "Named-account evidence but not an adoption time series", "Active users and account status by date"]
      - ["Coherent relationship", "18 months described by its CLO", "2025-02-13", "Company press release quoting customer", "Positive qualitative reference", "ROI baseline and independently verified savings"]
      - ["U.S. Air Force contract-handling deal", "$1.25 million reported", "2025 newsletter excerpt", "Secondary reporting", "Public-sector commercial signal", "Contract term, status, scope, and payment schedule"]
      - ["Duracell contracting costs", "50% reduction reported", "2026-08-11", "Competitor-authored article; low confidence", "Potential efficiency outcome if verified", "Baseline, sample, time window, and customer confirmation"]
      - ["Graybar due-diligence speed", "98% faster reported", "2026-08-11", "Competitor-authored article; low confidence", "Potential workflow acceleration if verified", "Baseline, task definition, sample, and customer confirmation"]
      - ["ServiceNow joint-solution availability", "Announced; further details forthcoming", "2026-03-26", "Company partnership announcement", "Channel access option rather than demonstrated adoption", "Launch date, live accounts, usage, and outcomes"]
    notes: >-
      The rows are a partial inventory of disclosed signals, not comparable KPIs. Dates
      reflect publication or announcement timing; reported percentages, deal value, and
      testimonial duration lack disclosed denominators, measurement methods, or contract
      terms. Competitor-published outcome figures are unverified.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU011]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment / use case, Deployment evidence, Reported outcome, Limitation]
    rows:
      - ["Cargill", "Fortune 500 in-house legal", "Named in company release and recruiting page", "No customer-specific metric published", "Deployment scope, date, and active usage not disclosed"]
      - ["DHL", "Fortune 500 in-house legal", "Named in company release and recruiting page", "No customer-specific metric published", "Deployment scope, date, and active usage not disclosed"]
      - ["Coherent", "Corporate legal department", "Named in release; CLO testimonial describes an 18-month relationship", "Qualitative trust and significant ROI claimed", "No quantified ROI or customer reference details"]
      - ["Duracell", "Corporate legal / contracting", "Named in company materials", "50% lower contracting costs reported by General Legal", "Customer confirmation and measurement method absent"]
      - ["Graybar", "Corporate legal / due diligence", "Named only in General Legal article", "98% faster due diligence reported by General Legal", "No company confirmation, baseline, or deployment details"]
    enumerationScope:
      coverage: partial
      basis: Publicly named customer references in the assigned prefetched sources, as captured for the 2025-2026 period; this is not a complete account census.
    notes: >-
      Partial enumeration of named accounts only; production status and outcomes are
      distinguished from logo or company-reported relationship evidence. Rows that rely
      on General Legal are competitor-authored reports without a disclosed measurement
      method.
    claimRefs: [CU005, CU006, CU007, CU010, CU011]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Company materials describe a governed legal workflow and an expansion path, but do not establish that the announced cross-functional steps are live.
    data:
      nodes:
        - id: buyer
          label: CLO / general counsel
          detail: Enterprise legal sponsor and buyer described in Eudia's materials.
        - id: intake
          label: Legal request or contract
          detail: Legal requests and contract work are the stated workflow entry points.
        - id: institutional judgment
          label: Company playbooks
          detail: Eudia says it applies internal standards and legal judgment to workflows.
        - id: governed action
          label: Self-service with controls
          detail: ServiceNow announcement describes routing, governance, and audit trails.
        - id: human expertise
          label: Lawyer oversight
          detail: Eudia describes AI as augmenting legal expertise rather than replacing it.
        - id: value
          label: Faster work and risk management
          detail: Faster deal cycles and reduced outside counsel spend are stated aims, not measured outcomes.
        - id: expansion
          label: Business-wide reach
          detail: Sales, marketing, procurement, and employees are proposed users; production expansion is unverified.
    claimRefs: [CU003, CU013, CU014]
callouts:
  - calloutType: risk
    title: Adoption quality is not yet measurable from public disclosures
    body: >-
      Named customers and selected outcome claims are not substitutes for account-level
      production status, active usage, renewal, and revenue data; request customer
      references and cohort evidence before treating adoption as durable.
    claimRefs: [CU005, CU007, CU015]
  - calloutType: insight
    title: ServiceNow is a distribution option, not proof of channel traction
    body: >-
      The partnership could place Eudia's legal intelligence in enterprise workflows,
      but the announcement leaves joint availability and customer usage unconfirmed.
    claimRefs: [CU008, CU013, CU014]
