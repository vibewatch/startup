      - ["Broad corporate legal spend and litigation", "None absent a workflow-level link to the product", "Litigation strategy, general outside counsel, and total legal department budgets", "Business and legal leadership", "Excluded from the measurable core market"]
    notes: "Qualitative boundary based on the cited product and reported workflows; categories are not additive market-size estimates."
    claimRefs: [CM001, CM002, CM003, CM004, CM015]
  - id: TM002
    title: Sizing lenses and what can be concluded
    columns: [Lens, Publisher and year, Geography, Value or status, Methodology needed, Confidence and limitation]
    rows:
      - ["Top-down eligible legal spend", "Fortune, 2025", "Not specified for the anecdotal spend claim", "Not quantifiable; Fortune attributes a 'hundreds of millions' outside-counsel spend statement to Eudia's CEO for some clients", "Isolate workflow-eligible spend from total external legal spend and avoid software/services double counting", "Low for market sizing; single management-reported anecdote"]
      - ["Bottom-up eligible departments", "Assigned sources, 2025-2026", "Enterprise; customer count not established", "Not quantifiable", "Count target departments by size, workflow fit, geography, and procurement readiness; multiply by evidenced annual contract value", "Low; denominators, pricing, and conversion data are absent"]
      - ["Contract-workflow adoption signal", "Eudia page recounting SpotDraft survey, 2025", "Survey of 115 in-house departments; sampling geography not stated", "49% reportedly rely on email, Word, or shared folders; 56% take a week or longer for standard contracts; 12% report full automation", "Use as directional evidence only; validate with representative sampling and Eudia-specific workflow baselines", "Low-to-medium for sample findings; not a market-wide penetration estimate"]
      - ["SAM and obtainable SOM", "No assigned source provides a validated estimate", "Not isolated", "Unquantified", "Obtain serviceable segment, deployment capacity, win-rate, retention, and price data", "Unavailable; no numeric estimate is supportable"]
    notes: "Survey figures are attributed to the cited page's account of SpotDraft research and must not be extrapolated as market-wide rates; missing dollar values are intentionally unquantified."
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Buyer, user, payer, and adoption map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow and adoption trigger]
    rows:
      - ["Fortune 500 corporate legal departments", "CLO or general counsel", "In-house counsel and legal operations", "Likely legal-department budget; not disclosed", "Contract review, playbook consistency, and knowledge access; trigger is capacity, risk, or outside-counsel pressure"]
      - ["Contract-heavy business functions", "Legal leadership with procurement or sales-operations stakeholders", "Contract managers, procurement, and sales operations", "Legal or shared operating budget; not disclosed", "Review and redline in Word; trigger is repeatable volume and shorter cycle-time targets"]
      - ["Legal teams handling M&A diligence", "General counsel or transaction lead", "In-house counsel and legal analysts", "Legal or transaction budget; not disclosed", "Document review and diligence; trigger is a bounded matter with measurable review load"]
      - ["Human-plus-AI legal service engagements", "CLO or enterprise legal buyer", "Lawyers and legal operations personnel", "Service and/or software budget; allocation not disclosed", "Human-reviewed delivery for work requiring judgment; trigger is service capacity and quality assurance"]
    notes: "Buyer and user roles are supported by product and media descriptions; budget ownership and adoption triggers are analytical inferences pending customer procurement evidence."
    claimRefs: [CM002, CM003, CM010, CM011, CM012, CM013, CM014, CM016]
figures:
  - id: FM001
    title: Evidence-constrained serviceable-market funnel
    type: pyramid
    summary: "Addressability narrows from enterprise legal work to workflows and buyers that can clear product-fit, trust, and implementation constraints."
    data:
      items:
        - label: "Total corporate legal spend"
          value: "Not a valid proxy; broad spend is outside the defined market"
        - label: "Workflow-eligible legal spend"
          value: "Contract and diligence work that can be bounded and supervised"
        - label: "Departments with fit and readiness"
          value: "Enterprise legal teams with repeatable workflows and platform budgets"
        - label: "Contract and diligence workflows"
          value: "Word-based review, drafting, playbook, precedent, and diligence use cases"
        - label: "Serviceable customers"
          value: "Buyers that can meet trust, security, data, and implementation requirements"
        - label: "Obtainable share"
          value: "Unknown; pricing, win-rate, and retention not disclosed"
    approximationNotes: "Qualitative evidence map only; no numeric TAM/SAM/SOM or proportional geometry is implied."
    claimRefs: [CM001, CM002, CM003, CM011, CM012, CM013, CM016]
callouts:
  - calloutType: assumption
    title: Do not capitalize the whole legal budget as TAM
    body: "The evidence identifies specific contract and diligence workflows but does not show what share of legal spend Eudia can serve; broad external-counsel or total legal spend is not an addressable-market estimate."
    claimRefs: [CM001, CM004, CM007, CM008]
  - calloutType: risk
    title: Adoption depends on evidence of trusted workflow outcomes
    body: "Legal teams must preserve accuracy, privacy, security, and human review; buyer enthusiasm or broad automation survey data alone does not establish production adoption or repeatable ROI."
    claimRefs: [CM006, CM012, CM013, CM014]
