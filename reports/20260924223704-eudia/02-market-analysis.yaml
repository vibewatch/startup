artifact: market-analysis
slug: eudia
runDate: 2026-09-24
company:
  name: Eudia
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Eudia addresses enterprise legal workflows where contract volume, fragmented
    institutional knowledge, and outside-counsel costs create demand for AI
    augmentation. Available evidence establishes use cases and buyer signals but
    does not support a defensible dollar TAM, SAM, or SOM; any market-size number
    would require private budget, workload, and conversion data.
sections:
  - id: market-boundary
    title: Market boundary and included work
    body: >-
      The defensible market boundary is enterprise legal-department work that can
      be augmented through organization-specific contract intelligence and
      supervised workflow automation: review, redlining, drafting, playbook
      checks, precedent search, and selected due-diligence tasks. Eudia's
      Microsoft Marketplace listing describes contract work inside Word, while
      Fortune reports that customers use the service for contracts and M&A
      diligence. These are workflow boundaries, not proof of a particular
      addressable-spend total. The adjacent human-services layer is relevant
      where legal professionals execute or review work alongside software; it
      should not be conflated with pure legal software revenue. General outside
      counsel, litigation strategy, and all corporate legal spend are excluded
      unless a workflow is demonstrably automatable and within Eudia's delivery
      model. Fortune specifically notes that litigation continues to require
      human lawyers, supporting a narrower boundary than the broad legal-services
      market. The market-definition table separates these included, adjacent,
      and excluded categories to avoid treating the full legal budget as TAM.
    claimRefs: [CM001, CM002, CM003, CM004, CM015]
    tableRefs: [TM001]
  - id: sizing-evidence
    title: Sizing lenses and evidence limits
    body: >-
      Three lenses indicate demand but do not produce an investable market
      estimate. First, spend-based sizing would require the addressable share of
      corporate legal budgets that maps to eligible workflows; Fortune reports
      management's statement that some clients spend hundreds of millions of
      dollars on outside counsel, but that anecdote is neither an average nor a
      market denominator. Second, a bottom-up model needs the number of eligible
      legal departments, per-customer workflow volume, deployable use cases, and
      realized annual contract value; none is disclosed in the assigned
      evidence. Third, workflow penetration evidence is suggestive: a company
      page recounts a SpotDraft survey of 115 in-house departments, reporting
      that 49% still use email, Word, and shared folders for contract
      management, 56% take at least a week to close standard contracts, and 12%
      report full automation. Those figures describe that survey sample, not the
      whole market, and do not establish Eudia's share or pricing. Consequently,
      TAM, SAM, and SOM remain unquantified; diligence should obtain a
      representative segmentation, addressable spend, and Eudia conversion and
      retention data before assigning numeric values.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and adoption constraints
    body: >-
      The economic buyer is most plausibly the chief legal officer or general
      counsel accountable for legal risk, outside-counsel budgets, and department
      capacity; day-to-day users include in-house counsel, contract managers,
      and procurement or sales operations staff who handle agreements. Eudia's
      product listing names those user groups and requires a platform
      subscription, while its job listing describes high-volume contracting for
      a growing commercial client base. Budget ownership and procurement
      thresholds are not disclosed, so the buyer map distinguishes supported
      users from inferred budget holders. Adoption is most compelling where
      repeatable contracts, playbooks, and searchable precedent make a workflow
      bounded and measurable. Trust, accuracy, privacy, security, and the need
      for human review remain constraints: Eudia's own funding announcement
      acknowledges these concerns, and Fortune describes human inputs as
      essential to reliable use. Eudia's engineering-hub expansion is evidence
      of investment in delivery capacity, not evidence that enterprise adoption
      is frictionless. A deployment case therefore needs workflow-level
      baseline time and cost, measured quality, data-governance approval, and a
      named budget owner.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM016]
    tableRefs: [TM003]
