  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与涵盖业务范围
        blocks:
          - type: paragraph
            body: >-
              该市场合理的防御性边界，是企业法务部门中可借助组织专有合同智能与有人监督的工作流自动化提升效率的工作：审查、修改标记、起草、规则手册核对、先例检索以及特定尽调任务。Eudia 在 Microsoft
              Marketplace 的产品说明介绍了 Word 内部的合同工作流，Fortune
              则报道客户将该服务用于合同与收并购尽职调查。这些材料只界定了工作流范围，并未证明可触达支出规模。法律专业人员与软件协同执行或复核时，相关人工服务也应纳入视野；但不能与纯法律软件收入混为一谈。常规外聘法律顾问、诉讼策略以及所有企业法律支出均予排除，除非某项工作流经证明可自动化且处于
              Eudia 的交付模式之内。Fortune 特别指出诉讼工作仍需人类律师参与，这支持了比宽泛法律服务市场更窄的市场边界。市场定义表将涵盖、相邻及排除类别进行了区分，以避免将整体法律预算误计为 TAM。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
      - number: '2.2'
        title: 测算视角与证据局限
        blocks:
          - type: paragraph
            body: >-
              三种测算视角反映出实际需求，但均无法得出具备可投资性的市场测算。首先，基于支出的测算需要明确企业法律预算中与适用工作流相对应的可触达份额；Fortune
              援引管理层表述称部分客户在外部顾问上的支出达数亿美元，但这既非平均水平，亦不能作为市场基数。其次，自下而上模型需要合格法务部门数量、单客工作流业务量、可部署场景以及已实现的年度合同价值
              (ACV)；本次审阅的资料均未披露这些数据。第三，工作流渗透率证据具备参考价值：某公司页面转述了 SpotDraft 对 115 家企业法务部门的调研，显示 49% 仍使用电子邮件、Word
              和共享文件夹管理合同，56% 需至少一周才能完成标准合同审结，12% 报告实现了全面自动化。这些数据仅描述该调研样本，不代表整个市场，且无法确立 Eudia 的市场份额或定价水平。因此，TAM、SAM 和 SOM
              仍未量化；尽调应在赋予具体数值前获取具备代表性的分客群数据、可触达支出规模，以及 Eudia 自身的转化与留存数据。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
