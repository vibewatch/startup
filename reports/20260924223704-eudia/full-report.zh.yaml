        title: 融资历程与披露规模
        blocks:
          - type: paragraph
            body: >-
              Eudia 于 2025-02-13 宣布完成由 General Catalyst 领投、总额最高达 $105 million 的 A 轮融资 (CO005)。同期报道明确将 $30 million
              的确定股权投资与预留用于收并购的 $75 million 区分开，因此不应将宣传上限视为已募集或已部署的到账现金 (CO006)。Eudia 后续将融资总额表述为超过 $100
              million，而某独立融资数据库显示其完成两轮融资且最新融资日期为 2025-04-28，但缺乏足够细节以将融资活动与具体金额核对 (CO007,
              CO008)。所审阅资料均未载明估值、收入/ARR、员工人数或客户数 (CO013)。这些信息缺失导致无法可靠评估资本效率或运营规模。
