  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 融资规模已公开，估值定价未披露
        blocks:
          - type: paragraph
            body: >-
              Eudia 于 2025 年 2 月宣布完成由 General Catalyst 领投、总额最高达 $105 million 的 A 轮融资，该宣传金额得到了融资法律顾问、投资机构及公司官方公告的一致印证
              (CV001)。然而，切勿将该金额误认为公开股权估值：所审阅材料均未提供可用的投后估值、每股价格、完全摊薄股本结构或可比投资回报条款 (CV011, CV015)。Tracxn
              公开页面遮蔽了具体金额，并将估值字段显示为无法解读的数字串，因此相关字段无法作为估值测算的依据 (CV004)。其确实指明了 A 轮融资日期及报道的融资总额，这提供了有价值的轮次背景而非实际定价观察
              (CV003)。Yahoo Finance 转载的 Verdict 报道将该笔融资拆分为首期 $30 million 以及达成后续并购目标并经 General Catalyst 批准为前提的额外 $75
              million (CV002,
              CV012)。该前置条件具备重大经济意义：对外宣传的承诺投资额不等同于交割时可自由支配现金，且与收购进展挂钩的资金可能伴随交易执行与审批风险。现有资料未披露该条件性资金后续是否已提支、详细限制性条款或其对股权比例与优先清算权的影响。因此，在相关法律文件与实际现金状态得到证实前，投资者应仅将经核实到账的资金纳入投资判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.2'
        title: 上行空间有其合理性，单位经济效益尚待证实
        blocks:
          - type: paragraph
            body: >-
              积极的投资逻辑在于 Eudia 将 AI 应用于成本高昂、知识密集型的法律工作流，并将软件与人工专业知识深度结合；General Catalyst 将该机遇定义为超越法律软件支出、深入更广阔的法律服务大市场
              (CV005, CV006)。融资公告将 Cargill、DHL、Duracell 和 Coherent 列为使用者，Coherent 法务高管亦提及显著的
              ROI；这些是有价值的采纳信号，但仍是经筛选、主要由公司或投资机构发布的材料，并非经审计的客户群组经济指标 (CV008, CV009)。Eudia 收购 Johnson Hana 和 Out-House
              与其并购整合战略相吻合，或能为其补充交付能力与客户关系，但同时也会增加整合难度与资本需求 (CV007, CV014)。反面情形是，本次审阅资料未显示
              ARR、已确认收入、毛利率、客户留存率、客户集中度、烧钱率或现金跑道期 (CV010)。公司自身的融资材料承认法律 AI
              必须解决信任、准确性、数据隐私、知识产权及安全顾虑；这些顾虑会增加实施难度与法律责任风险，但不足以据此认定 Eudia 尚未解决这些问题
              (CV013)。现有资料中没有可支持合理估值倍数的可比公司或交易证据；投资者看好大市场的判断及客户推荐证言，都不能替代实际收入或利润率数据。在尽调明确区分经常性软件收入与人力服务及并购业务前，套用纯软件估值倍数可能高估价值。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 核心估值要素厘清前暂缓价格审批
        blocks:
          - type: paragraph
            body: >-
              建议结论：在以任何明确价格进行投资前展开进一步调查；该建议的置信度为中，对任何具体估值数值的置信度为低。决定性的缺失要素包括最新完全摊薄资本结构与融资协议、经核实实际到账现金与条件性资金状态、经常性收入与毛利率群组、客户留存率与集中度，以及被收购业务的收购对价与整合经济效益
              (CV010, CV012,
              CV015)。这些要素决定价值来自软件、人力密集型服务还是并购商誉，也决定退出变现前是否需要外部注资。依据现有资料，无法审慎测算目标回报率、持有期限、退出估值或入场价格。乐观情景需要可复现的高留存软件收入、利润率持续扩张、成功的并购整合以及在目标市场中取得可观份额；基准情景假设软件与服务混合业务增速放缓且整合成本持续发生；悲观情景假设条件性资金无法提支、收购摊薄整体回报，或客户采纳无法覆盖交付与合规成本。在获取实际财务与股本数据前，三种情景均无法给出具体定价。
              下一步应审阅股权结构表与优先股堆叠、经审计或董事会批准的财务报表、客户维度的经常性收入与续约明细、收购协议以及 A 轮融资法律文件；只有据此建立完全摊薄口径的每股回报模型后，才应重新评估入场机会。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
