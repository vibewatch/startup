chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              Eudia 被描述为一家成立于 2023 年、总部位于加利福尼亚州帕洛阿尔托的法律科技公司；公司简介与独立新闻报道对这些基本信息的描述一致，但本次审阅资料中没有可确认法律实体或成立日期的公司注册文件
              (CO001)。其自述模式将面向企业法务的 AI 平台与嵌入式法律专业知识相结合，而非仅销售独立软件 (CO009, CO010)。公司将合同管理、收并购、Sigma 智能体及 Insights
              列为平台解决方案。这一定位使软件执行与服务交付同时构成公司定位的核心；不应将其视为产品性能或业务规模的证据。
            claimRefs:
              - CO001
              - CO009
              - CO010
      - number: '1.2'
        title: 创始人、管理层与公司治理
        blocks:
          - type: paragraph
            body: >-
              资料显示 Omar Haroun 为联合创始人兼 CEO，David Van Reyk 为联合创始人兼 COO，Ashish Agrawal 为联合创始人兼 CTO (CO002, CO003,
              CO004)。管理层表仅限于上述明确提及的创始人；资料库未明确完整的管理团队名册、董事会构成、决策权划分、接班安排或重大管理层变动。这类将法律判断、AI
              系统与客户交付相融合的业务模式，缺少治理结构便构成重大的尽调局限。公司披露了 Haroun 在 2025 年入选 Goldman Sachs 榜单
              (CO015)，但该奖项不能替代独立的治理披露或团队运营深度的证明。
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO015
