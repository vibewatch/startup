              - CM016
      - number: '2.3'
        title: 采购决策者、使用者与采纳阻碍
        blocks:
          - type: paragraph
            body: >-
              经济决策买家最可能为负责法律风险、外部顾问预算及部门业务能力的首席法务官或总法律顾问；日常使用者包括企业内部法律顾问、合同经理，以及处理协议的采购或销售运营人员。Eudia
              的产品页面列出了上述用户群体并要求平台订阅，其招聘启事则提及为不断增长的商业客户群处理大批量合同。由于预算归属与采购审批权限未见披露，买家画像将有资料支持的用户与推断的预算持有者区分开来。合同标准化、规则手册明确且先例可检索时，工作流边界清晰、成效可衡量，也最容易推动采纳。信任、准确性、数据隐私、安全规范以及人工复核需求仍是关键制约：Eudia
              自身的融资声明承认了这些顾虑，Fortune 亦报道人工介入对确保可靠输出至关重要。Eudia
              扩建班加罗尔工程中心证明其持续投资交付能力，但不能证明企业落地过程毫无摩擦。因此，实际部署仍需按具体工作流厘清基线用时与成本、实测质量指标、数据合规审批并明确具体预算归属人。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
