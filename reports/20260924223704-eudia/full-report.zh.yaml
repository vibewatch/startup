          - type: paragraph
            body: >-
              现有记录支持建立风险评估框架，并不代表 Eudia
              发生过违规行为、遭受过安全事件或未能成功整合收购业务。现有资料主要是公司公告、产品页面及少数独立报道；未提供监管机构裁决、诉讼判决、技术审计报告、量化客户留存群组或经独立验证的 AI
              性能数据。投资者应索取法律实体与司法管辖区明细表、职业责任险保单、客户数据处理条款、安全审计与事件记录、模型与人工复核控制机制，以及收购团队整合考核表。上述诉求应明确对应责任人及带日期的证据，而非依赖宽泛口头保证。在获取此类信息前，高影响敞口仍属可监测范畴，但无法赋予可靠的发生概率或应对成熟度评分。因此，风险热力图将已知的运营依赖与未决的发生概率区分开，绝不暗示所列风险事件已经发生。
            claimRefs:
              - CR004
              - CR006
              - CR008
              - CR010
              - CR013
              - CR014
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 法律执业合规许可构成规模化扩张瓶颈
            body: 报道提及的亚利桑那州 ABS 架构不能确立在其他司法管辖区交付法律服务的合规资质；在评估跨区域扩张前，应核实实体设立、牌照申请、业务监督与专业责任安排。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: 保密控制措施仍未经验证
            body: Word 加载项能够修改文档并通过互联网传输数据，而现有资料未能证明其针对敏感法律内容设置了数据留存、模型训练、子处理方管理或安全事件控制机制。
            calloutType: risk
            claimRefs:
