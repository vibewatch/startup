          detail: 据报道，已公布融资金额最高达 $105 million；首期 $30 million，其余 $75 million 附带条件。
        - id: acquisition-execution
          label: 收购标的
          detail: 据报道，剩余资金的发放取决于收购项目及投资者批准。
        - id: expanded-capacity
          label: 软件平台与法律专业人才
          detail: Johnson Hana 补充了 300 多名法律专业人员，配合 Eudia 的 AI 平台开展业务。
        - id: customer-delivery
          label: 企业级业务
          detail: 据报道，数十家客户的 ARR 及另一笔 $1.25 million 空军合同都是历史公开信号，不能据此推算当前收入。
        - id: current-liquidity
          label: 当前流动性
          detail: 指定资料未披露自据报道的融资安排公布以来已拨付的资金，也未披露现金、烧钱速度、债务或现金跑道。
        - id: gross-profit-proof
          label: 未经验证的商业效益
          detail: 当前收入构成、交付成本、毛利率、现金消耗及收入确认时点均未披露。
      edges:
        - from: committed-capital
          to: acquisition-execution
          label: 附带条件的资金拨付
        - from: acquisition-execution
          to: expanded-capacity
          label: 收购取得交付能力
        - from: expanded-capacity
          to: customer-delivery
          label: 软件与人工服务协同
        - from: customer-delivery
          to: gross-profit-proof
          label: 依赖合同与成本数据
    approximationNotes: 本图系基于据报道的融资与收购事实梳理的概念性定性流程，未按比例缩放；不代表实际投入金额、收入确认或盈利能力。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI015
  - id: FE001
    title: 产品体验与人工治理架构
    type: stack
    summary: 公开证据仅勾勒出面向用户的合同工作流及人工控制边界，内部技术架构层仍未披露。
    data:
      layers:
        - label: 法务用户
          detail: 企业内部法务或合同专家在 Microsoft Word 中处理业务。
        - label: 文档交互
          detail: 公开信息显示 Eudia for Word 具备读取和修改文档的能力。
        - label: 合同上下文
          detail: 官方描述称审查指引和历史协议是审查输入。
        - label: AI 辅助
          detail: 产品介绍载明其支持风险分析、红线标记、合同起草与文档问答。
        - label: 专业人工经验
          detail: Eudia 称其在 AI 赋能的法务流程中辅以专业人员经验。
        - label: 法律裁量决策
          detail: 必须由具备相应资格的用户或法律专业人士评估系统建议；最终结果的控制机制未见公开说明。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公司宣传材料阐述了受控法务工作流与扩张路径，但无法证实已宣布的跨部门协作环节已正式上线运行。
    data:
      nodes:
        - id: buyer
          label: 首席法务官 / 总法律顾问
          detail: Eudia 材料中界定的企业法务发起人与采购决策者。
        - id: intake
          label: 法务需求或合同
          detail: 法务需求与合同处理为官方设定的工作流切入点。
        - id: institutional judgment
          label: 企业审查指引
          detail: Eudia 称其把内部标准和法律判断用于工作流。
        - id: governed action
          label: 受控自助服务
          detail: ServiceNow 合作公告载明了流程路由、治理规则与审计追踪机制。
        - id: human expertise
          label: 律师监督把关
          detail: Eudia 称 AI 旨在增强而非取代专业法律经验。
        - id: value
          label: 提效与风险管控
          detail: 缩短交易周期与削减外部律师支出属于既定目标，并非实测成效。
        - id: expansion
          label: 全业务场景覆盖
          detail: 销售、市场、采购团队及员工均被列为潜在用户，但尚未证实已在生产环境扩展部署。
    claimRefs:
      - CU003
      - CU013
      - CU014
