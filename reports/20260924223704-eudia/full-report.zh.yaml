  - id: FV001
    title: 从公开证据到入场决策的建议逻辑
    type: flow
    summary: 在融资细节、经营业绩与股权经济效益得到核实之前，强烈的战略信号尚不足以支撑入场定价。
    data:
      nodes:
        - id: disclosed-round
          label: 最高达 $105M 的 A 轮融资；部分资金可能附带条件
        - id: missing-price
          label: 未取得可用的投后估值或优先股堆叠
        - id: strategic-signal
          label: 企业级用户与「AI + 人工」法务服务模式
        - id: missing-economics
          label: 收入、利润率、留存、现金消耗及并购回报均无可用数据
        - id: diligence
          label: 核实到账现金、财务数据、股权结构表及收购商业效益
        - id: decision
          label: 继续研究；暂缓定价审批
      edges:
        - from: disclosed-round
          to: missing-price
          label: 融资金额不等于企业估值
        - from: strategic-signal
          to: missing-economics
          label: 关于客户采纳的说法不足以证明单位经济效益
        - from: missing-price
          to: diligence
        - from: missing-economics
          to: diligence
        - from: diligence
          to: decision
          label: 仅在输入数据得到核实后重新定价
    claimRefs:
      - CV001
      - CV002
      - CV008
      - CV010
      - CV011
      - CV012
      - CV015
