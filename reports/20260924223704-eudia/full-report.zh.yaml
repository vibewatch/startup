      - number: '3.3'
        title: 迁移成本、护城河持久性与证据断层
        blocks:
          - type: paragraph
            body: >-
              Eudia 具备合理性的差异化优势在于结合了人工专业知识与定制交付的情境化法律认知，而非公开验证过的模型优势。Fortune 报道某客户称其实现了成本节省但拒绝透露具体数额，并指出 Eudia
              管理层认为人工介入对于可靠输出至关重要。这些迹象与深度融入客户特定工作流的特征相符，后者或能借助规则手册、先例库及经过训练的业务流程形成迁移摩擦；然而公开来源并未测算实施成本、续约行为、数据可迁移性或多供应商并用情况，因此不应推定存在客户锁定效应。Fortune
              还报道，即便替代计费模式有所增长，传统的按小时计费工作依然根深蒂固，使 Eudia 面临现存利益格局的反弹以及买家对改变风险敏感型工作流的顾虑。最核心的尽调重点在于客户维度的前后 ROI
              对比、续约与增购数据、实施人员配比、安全与保密权限控制，以及对比专业工具与外部律所的直接成效对决。(CP001, CP002, CP012, CP014, CP016)
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP014
              - CP016
