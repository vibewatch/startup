      - number: '1.4'
        title: 产品、服务与已披露客户
        blocks:
          - type: paragraph
            body: >-
              Eudia 描述了一套综合解决方案，涵盖 AI 增强型合同管理与收并购、可配置 Sigma 智能体、基于 Insights 的分析能力，以及公司自述依据亚利桑那州替代商业结构 (ABS) 框架运营的法律服务业务
              Eudia Counsel (CO009, CO010)。这些仅属公司口径陈述，非经独立测量的业务成果。公司资料提及了
              Cargill、DHL、Duracell、Coherent、Intuit、Citibank、Stripe 及美国政府等企业客户
              (CO011)，但本资料库未提供带日期的客户名册、活跃客户数、合同金额或客户方验证。Eudia 网站转载的行业通讯曾报道其获得一份处理美国空军合同的 $1.25 million
              订单；现有资料无法独立证实底层订单的授予情况及签署时间 (CO012)。
            claimRefs:
              - CO009
              - CO010
