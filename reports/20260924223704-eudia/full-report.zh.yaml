  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买家替代方案
        blocks:
          - type: paragraph
            body: >-
              Eudia 将自身定位为将 AI 与法律专业知识相结合的法律运营平台，Fortune 则报道其通过 Eudia Counsel 及收购 Johnson Hana 进一步发力服务交付。因此，实际竞争对手范围超出法律
              AI 软件：它包括合同工作流产品、专业法律工作流工具、外部律师事务所及企业内部法务团队。Eudia 刊登的一篇文章提到了 SpotDraft、StructureFlow、BigHand 和
              ClausePilot，但所给细节详略不一，不能构成独立的对比证明。Fortune 的报道补充了更重要的替代方案：尽管对按小时计费模式有所不满，企业法务团队仍可聘请外部律所，或将常规工作保留在内部处理。Eudia
              for Word 的上线展示了面向合同审查与起草的产品形态，而 Eudia
              招聘页面将客户定制解决方案描述为其交付模式的组成部分。这种结合或能拓宽可适用的业务场景，但也使竞争边界和单位经济效益相比纯软件厂商更难直接对比。(CP001, CP003, CP004, CP005,
              CP007, CP014)
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
