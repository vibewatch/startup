      - number: '3.2'
        title: 产品功能、定价机制与采购考量
        blocks:
          - type: paragraph
            body: >-
              公开资料不足以支撑逐项功能层面的优胜定论。Microsoft 上的产品说明介绍了 Eudia for Word
              的各项功能，例如风险分析、修改标记、规则手册核对、先例检索和起草辅助，并注明需要平台订阅；但未显示价格或商业计费单位。现有资料虽列出了若干替代方案，但未明确其最新功能深度、产品包装或可比价格。Eudia
              刊登的一份资料将合同流程统计数据归引自 SpotDraft 的调研，并指出 StructureFlow 的可视化流程图声称能加快交易执行；这些仅属参考背景，而非 Eudia
              对比任一厂商的独立评测基准。买家应在自身真实合同上对比准确性、管理负担、集成与安全条款、实施工作量，以及相比外部律所和内部流程的总体拥有成本。在获得具备可比性的试用结果和合同前，缺乏证据支持的功能项和价格应保持未知状态而非主观推断。(CP005,
              CP006, CP008, CP009, CP011, CP015)
            claimRefs:
              - CP005
              - CP006
