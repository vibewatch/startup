artifact: company-overview
slug: eudia
runDate: 2026-09-24
company:
  name: Eudia
chapter:
  number: 1
  title: Company Overview
  summary: Eudia is a Palo Alto legal-technology company founded in 2023 that combines AI software with human legal expertise. Its February 2025 Series A announcement described up to $105 million, but the committed-versus-reserved structure and lack of public valuation or operating metrics limit conclusions about scale.
sections:
  - id: identity-and-offering
    title: Identity and operating model
    body: >-
      Eudia is described as a legal-technology company founded in 2023 and based
      in Palo Alto, California; the available profile and independent news report
      converge on those basics, although the assigned pool includes no corporate
      filing to establish the legal entity or incorporation date (CO001). Its
      stated model combines an AI platform for in-house legal work with embedded
      legal expertise rather than selling only standalone software (CO009,
      CO010). The company identifies contracting, M&A, Sigma agents, and Insights
      as platform solutions. This positioning makes both software execution and
      service delivery central to the company identity; it should not be read as
      evidence of product performance or scale.
    claimRefs: [CO001, CO009, CO010]
  - id: founders-and-governance
    title: Founders, leadership, and governance
    body: >-
      The sources identify Omar Haroun as CEO and co-founder, David Van Reyk as
      COO and co-founder, and Ashish Agrawal as CTO and co-founder (CO002,
      CO003, CO004). The leadership table is limited to these explicitly named
      founders; the source pool does not establish a complete executive roster,
      board composition, decision rights, succession arrangements, or material
      leadership changes. This is a meaningful diligence limitation for a
      business whose model combines legal judgment, AI systems, and client
      delivery. The company reports Haroun's 2025 Goldman Sachs recognition
      (CO015), but that award is not a substitute for independent governance
      disclosure or evidence about the team's operating depth.
    claimRefs: [CO002, CO003, CO004, CO015]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing and disclosed scale
    body: >-
      Eudia announced a Series A of up to $105 million on February 13, 2025,
      led by General Catalyst (CO005). The contemporaneous report distinguishes
      $30 million of committed equity from $75 million reserved for M&A, so the
      headline ceiling should not be treated as cash already raised or deployed
      (CO006). Eudia later described funding as over $100 million, while an
      independent fundraising profile shows two rounds and a latest raise date
      of April 28, 2025 without enough detail to reconcile the activity to an
      amount (CO007, CO008). The reviewed sources do not establish a valuation,
      revenue/ARR, headcount, or total customer count (CO013). These gaps prevent
      reliable estimates of capital efficiency or operating scale.
    claimRefs: [CO005, CO006, CO007, CO008, CO013]
    tableRefs: [TO001, TO003]
  - id: products-and-customers
    title: Products, services, and named customers
    body: >-
      Eudia describes an integrated offer spanning AI-augmented contracting and
      M&A, configurable Sigma agents, analytics through Insights, and Eudia
      Counsel, a legal-services operation the company says runs under Arizona's
      Alternative Business Structure framework (CO009, CO010). These are
      company descriptions, not independently measured outcomes. Company
      materials name enterprise organizations including Cargill, DHL, Duracell,
      Coherent, Intuit, Citibank, Stripe, and the U.S. Government (CO011), but do
      not provide a dated customer roster, active-customer count, contract
      values, or customer-side validation in this pool. A newsletter republished
      on Eudia's site reported a $1.25 million U.S. Air Force contract-handling
      deal; the underlying award and its timing are not independently verified
      by the assigned sources (CO012).
    claimRefs: [CO009, CO010, CO011, CO012]
  - id: milestones-and-gaps
    title: Milestones and unresolved diligence
    body: >-
      Available dated material supports eight reported milestone points:
      founding in 2023; the February 2025 financing announcement and separate
      public unveiling; an April 2025 fundraising-database entry; the 2025 launch
      of Eudia Counsel; the August 2025 Johnson Hana acquisition and Air Force
      deal report; and Haroun's October 2025 Goldman Sachs recognition (CO001,
      CO005, CO008, CO010, CO012, CO014, CO015, CO016). Several entries share an
      announcement date, and the timeline distinguishes a report date from a
      transaction date where the source does not establish the latter. Board
      records, customer confirmation, financial disclosures, and a complete
      adverse-event history remain diligence priorities.
    claimRefs: [CO001, CO005, CO008, CO010, CO012, CO014, CO015, CO016]
    figureRefs: [FO001]
