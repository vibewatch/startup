artifact: financials
slug: eudia
runDate: 2026-09-24
company:
  name: Eudia
chapter:
  number: 4
  title: Financials
  summary: Eudia has reported more than $10 million in ARR, but the figure is a CEO-attributed 2025 snapshot rather than current audited disclosure. Its financing is unusually acquisition-contingent, and a combination of AI software and lawyer-delivered services makes margin, integration cost, and revenue quality impossible to underwrite from the available public evidence alone.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Eudia describes an AI platform for corporate legal teams, while its reported
      acquisition of Johnson Hana adds a substantial legal-services delivery
      capability. The evidence therefore points to a potential blend of enterprise
      software and people-intensive legal work, not a clean, proven pure-software
      revenue profile (CI009, CI010). Eudia has also been associated with a
      $1.25 million Air Force contract-handling engagement, but the available
      coverage does not say whether that amount is recurring, recognized over
      multiple periods, or representative of other customer contracts (CI008,
      CI016). Neither list pricing nor realized pricing, revenue mix, contract
      terms, or discounting is established in this source set (CI012). Investors
      should diligence the revenue stream and underlying contract economics
      separately rather than applying a software multiple to the reported
      customer work by default.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI012
      - CI016
    tableRefs:
      - TI001
      - TI002
  - id: traction-and-unit-economics
    title: Traction, efficiency, and cost structure
    body: >-
      Business Insider reported in July 2025 that CEO Omar Haroun said Eudia had
      surpassed $10 million in ARR across dozens of clients and was targeting
      $20 million by year-end 2025 (CI004, CI005). These are attributed company
      statements reported at that time, not independently audited results or
      current 2026 metrics; the target is historical and must not be treated as
      achieved. No allocated source supplies customer-level revenue, sales
      cycle, CAC, payback, retention, utilization, gross margin, or AI and
      delivery costs (CI013, CI014). Acquiring more than 300 legal professionals
      may broaden the service offer while increasing labor and integration
      demands; the sources provide no cost or margin bridge with which to test
      that trade-off (CI007). These gaps prevent a credible assessment of
      operating leverage or revenue quality.
    claimRefs:
      - CI004
      - CI005
      - CI007
      - CI013
      - CI014
    tableRefs:
      - TI003
  - id: capital-adequacy
    title: Capital needs and underwriting verdict
    body: >-
      Eudia announced a Series A of up to $105 million led by General Catalyst
      (CI001). Independent coverage described a nonstandard release structure:
      $30 million upfront, with the remaining $75 million contingent on
      acquisition targets and General Catalyst approval (CI002). The company
      said the partnership would support product and customer expansion, while
      reporting also linked the initial capital to product and engineering
      hiring (CI003). That structure can fund inorganic expansion, but makes
      access to the full headline amount dependent on deal execution and
      investor approval; it is not evidence that the entire amount is available
      cash. Public information reviewed here does not establish cash balance,
      burn, runway, debt, working capital, capex, or the amount of committed
      capital still undrawn (CI015). With acquisition terms, integration costs,
      and current financials undisclosed, capital adequacy and the next-round
      trigger remain material diligence blockers.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI015
    figureRefs:
      - FI001
callouts:
  - calloutType: risk
    title: Headline funding is not equivalent to available cash
    body: The reported $75 million balance was conditional on acquisitions and General Catalyst approval; verify what has been released, what remains committed, and the conditions still outstanding.
    claimRefs:
      - CI001
      - CI002
      - CI015
  - calloutType: recommendation
    title: Underwrite the software and services economics separately
    body: Require current cohort ARR, contract-level revenue recognition, software gross margin, lawyer utilization and delivery cost, and acquisition integration costs before accepting the reported ARR as evidence of scalable software economics.
    claimRefs:
      - CI004
      - CI007
      - CI008
      - CI013
      - CI014
      - CI016
tables:
  - id: TI001
    title: Revenue streams and quality
    columns:
      - Stream
      - Mechanism and public status
      - Value / quality
      - Diligence ask
    rows:
      - - AI legal platform
        - Company describes an AI platform for in-house legal workflows; charging unit and realized revenue are not disclosed.
        - Commercial model plausible, but price and recurring mix unverified.
        - Obtain SKU-level contracts, bookings, recognized revenue, renewals, and discounts.
      - - Lawyer-delivered legal services
        - Johnson Hana acquisition and Eudia Counsel materials indicate a human legal-services component.
        - Service revenue and contribution margin not disclosed.
        - Separate software and services revenue, cost of delivery, utilization, and integration costs.
      - - Air Force contract handling
        - An Eudia-hosted item reported a $1.25 million U.S. Department of the Air Force contract.
        - One reported contract value; recurrence and recognition period unknown.
        - Review award, statement of work, performance period, invoicing, and revenue-recognition treatment.
    notes: >-
      Partial public-source view, not a complete revenue enumeration. The reported
      $1.25 million contract is not assumed to be recognized revenue or ARR.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI012
      - CI016
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Offering
      - Price / unit / contract model
      - List versus realized price
      - Diligence ask
    rows:
      - - AI legal platform
        - Not publicly disclosed in the allocated sources.
        - No public list or realized price.
        - Obtain price book, contract examples, seat or usage metric, and discount history.
      - - Lawyer-delivered services
        - Not publicly disclosed in the allocated sources.
        - No public rate card or realized fee data.
        - Obtain matter-level pricing, staffing mix, write-offs, and service gross margin.
      - - Air Force contract handling
        - One $1.25 million contract value reported; pricing basis and term not specified.
        - A single contract is not evidence of list pricing or a repeatable price point.
        - Inspect contract scope, payment milestones, options, and any subcontractor costs.
    notes: >-
      Public contract coverage does not establish a price list, realized customer
      rates, discounts, or the contract's recognition period.
    claimRefs:
      - CI008
      - CI012
      - CI016
  - id: TI003
    title: Unit economics and underwriting gaps
    columns:
      - Metric
      - Publicly supported value
      - Confidence / limitation
      - Why it matters
      - Specific diligence request
    rows:
      - - ARR
        - More than $10 million across dozens of clients, as CEO-attributed reporting in July 2025.
        - Medium; dated, company-attributed, not audited, and not a current figure.
        - Establishes a historical scale indicator but not present growth or recurring quality.
        - Obtain current monthly ARR bridge by cohort, churn, expansion, and recognized revenue.
      - - ARR target
        - $20 million by year-end 2025 was reported as management's target.
        - Medium; historical forecast, achievement not established.
        - Tests execution only if compared with actual results and definition.
        - Request year-end 2025 actuals and current 2026 monthly financial statements.
      - - CAC, sales cycle, and payback
        - Not disclosed in the allocated sources.
        - Unavailable; no estimate made.
        - Needed to assess enterprise GTM efficiency and capital needs.
        - Obtain sales-cycle distribution, fully loaded acquisition cost, conversion, and payback by segment.
      - - Gross margin and delivery cost
        - Not disclosed in the allocated sources.
        - Unavailable; software and lawyer-delivered work are not separated.
        - Determines whether services scale with software or dilute margins.
        - Request gross margin by product and service line, including labor, inference, implementation, and support.
      - - Cash, burn, runway, debt, and capex
        - Not disclosed in the allocated sources.
        - Unavailable; headline round size does not establish current liquidity.
        - Needed to test capital adequacy and the next financing trigger.
        - Obtain current balance sheet, monthly cash flow, debt schedule, committed funding, and operating plan.
    notes: >-
      Publicly reported ARR and target are historical, attributed statements; all
      undisclosed metrics remain unknown rather than modeled estimates.
    claimRefs:
      - CI004
      - CI005
      - CI013
      - CI014
      - CI015
figures:
  - id: FI001
    title: Capital-to-capacity model and financial proof points
    type: flow
    summary: The reported financing structure links acquisition execution to capital release and expanded legal-delivery capacity; disclosed sources do not quantify the resulting unit economics.
    data:
      nodes:
        - id: committed-capital
          label: Series A
          detail: Up to $105 million announced; $30 million upfront and $75 million conditional, as reported.
        - id: acquisition-execution
          label: Acquisition targets
          detail: The remaining capital was reported contingent on acquisitions and investor approval.
        - id: expanded-capacity
          label: Software plus legal talent
          detail: Johnson Hana added more than 300 legal professionals, alongside Eudia's AI platform.
        - id: customer-delivery
          label: Enterprise work
          detail: Reported ARR across dozens of clients and a separate $1.25 million Air Force contract are historical public signals, not a current revenue bridge.
        - id: current-liquidity
          label: Current liquidity
          detail: Cash, burn, debt, runway, and capital released since the reported financing structure are not disclosed in the allocated evidence.
        - id: gross-profit-proof
          label: Unproven economics
          detail: Current revenue mix, delivery cost, gross margin, cash use, and recognition timing remain undisclosed.
      edges:
        - from: committed-capital
          to: acquisition-execution
          label: conditional funding release
        - from: acquisition-execution
          to: expanded-capacity
          label: acquired delivery capability
        - from: expanded-capacity
          to: customer-delivery
          label: software and human services
        - from: customer-delivery
          to: gross-profit-proof
          label: requires contract and cost data
    approximationNotes: >-
      Conceptual, unscaled flow based on reported financing and acquisition facts;
      it does not imply amounts deployed, revenue recognition, or profitability.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI015
