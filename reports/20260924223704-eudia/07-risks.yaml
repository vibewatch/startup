    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Monitor or diligence action]
    rows:
      - ["Acquired-team integration weakens delivery consistency", "Medium", "High", "Public evidence describes intent but no outcome measures", "Service quality and retention remain unverified", "Request integration milestones, team retention, service levels, and client escalation data"]
      - ["AI output error or insufficient traceability in legal workflows", "Medium", "High", "Human-AI approach is described but no independent error metrics are supplied", "Potential legal and commercial harm if review fails", "Test representative matters for citations, error rates, overrides, and accountable human sign-off"]
      - ["Confidential contract data exposure through product workflow", "Unknown", "High", "Marketplace listing confirms data transfer but not security controls", "Material client confidentiality and liability exposure", "Obtain security audit, data-flow map, retention terms, and incident history"]
      - ["Documentation and release coordination do not keep pace with product changes", "Medium", "Moderate", "A product role explicitly owns user guides and backlog coordination", "Operational control effectiveness is not measured", "Audit release-to-documentation lag, support tickets, and controlled release approvals"]
    notes: "Likelihoods are qualitative hypotheses based on disclosed operating complexity; the source pool contains no incident, error-rate, service-level, or audit dataset."
    claimRefs: [CR002, CR008, CR009, CR010, CR011]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Role, Concentration evidence, Failure scenario, Severity, Mitigation and residual exposure]
    rows:
      - ["Johnson Hana / acquired legal professionals", "Human delivery capacity and legal expertise", "Acquisition announcement says 300-plus professionals; revenue or workload concentration is not disclosed", "Integration or attrition disrupts service delivery", "High", "Verify transition plans, retention, supervision, and service continuity; residual exposure is unquantified"]
      - ["Microsoft Word platform", "Product access point for contract review and drafting", "Marketplace listing documents a Word add-in; platform usage share is unknown", "Platform/API or marketplace changes impair a core workflow", "Moderate", "Review platform terms and fallback workflows; no dependency concentration metric is published"]
      - ["Large enterprise customers", "Adoption, referenceability, and potential revenue base", "Named Fortune 500 users are cited but account shares and active-use data are absent", "One or a few customers delay renewal or constrain expansion", "High", "Obtain customer-level ARR, renewals, deployment stage, and references; exposure remains unquantified"]
    notes: "This is a partial dependency register; source mentions and product availability do not establish contract terms, active usage, or revenue concentration."
    claimRefs: [CR002, CR005, CR012, CR013, CR014]
