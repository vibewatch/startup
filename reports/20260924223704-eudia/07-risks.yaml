callouts:
  - calloutType: risk
    title: Legal authorization is a scale constraint
    body: "A reported Arizona ABS structure does not establish authority to deliver legal services in other jurisdictions; verify entity, licensing, supervision, and professional-liability arrangements before underwriting geographic expansion."
    claimRefs: [CR003, CR004, CR005]
  - calloutType: risk
    title: Confidentiality controls remain unverified
    body: "The Word add-in can modify documents and send data over the internet, while the assigned evidence does not establish retention, training, subprocessor, or incident controls for sensitive legal content."
    claimRefs: [CR009, CR010]
