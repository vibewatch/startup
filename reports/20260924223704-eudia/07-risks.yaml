chapter:
  number: 7
  title: Risks
  summary: Eudia's public materials point to material legal-structure, confidential-data, AI-quality, and post-acquisition execution exposures, while offering little independent disclosure of control maturity or customer economics. The most actionable diligence is to verify jurisdiction-specific practice authority, audited data protections, integration outcomes, and customer-level concentration before underwriting scale.
sections:
  - id: regulatory-legal-exposure
    title: Regulatory and legal exposure
    body: >-
      Eudia's model sits at the intersection of legal practice and software. Fortune reported in September 2025 that
      Eudia was operating in Arizona through an Alternative Business Structure as a provider of a law firm, rather than
      being technically set up as a law firm; the same account described the ownership rule as distinctive to Arizona.
      This is a jurisdiction-specific operating structure, not evidence that the model has approval to provide legal
      services everywhere it sells. The company has also announced an acquisition bringing more than 300 legal
      professionals into its workforce, increasing the importance of professional responsibility, supervision, conflicts,
      privilege, and client-consent controls across jurisdictions. Current licenses, entity structure, and oversight
      arrangements are not established by the assigned public evidence. Before expansion, counsel should map each
      service and jurisdiction to the responsible licensed entity and document escalation, conflicts, and privilege
      safeguards. The legal register is necessarily partial, not a complete inventory of laws or proceedings.
    claimRefs: [CR003, CR004, CR005, CR006]
    tableRefs: [TR001]
  - id: operational-technical-execution
    title: Operational, quality, and data-control exposure
    body: >-
      Eudia combines AI workflows with human legal services, making output quality and integration execution central
      operational risks rather than optional product features. Its acquisition announcement describes a 300-plus-person
      legal workforce and an ambition to embed human expertise in its AI systems, but neither that announcement nor the
      other allocated material supplies post-integration service levels, error rates, escalation outcomes, or audited
      quality results. Fortune reports that Eudia's CTO stressed the importance of citations and that clients must
      incorporate AI tools patiently; that supports a need for traceability and human review, not proof of a specific
      Eudia defect. Microsoft's Marketplace listing says the Word add-in can read and modify documents and transmit data
      over the internet. Because those documents may contain confidential legal material, diligence should establish
      tenant isolation, retention, model-training exclusions, subprocessors, incident response, and contractual
      allocation of liability. No security certification or incident status can be confirmed from this pool.
    claimRefs: [CR007, CR008, CR009, CR010, CR011]
    tableRefs: [TR002]
  - id: dependency-economics-and-triggers
    title: Dependencies, financial opacity, and thesis-break indicators
    body: >-
      Eudia's route to scale depends on both enterprise adoption and its ability to integrate people and technology.
      The assigned sources identify named large-company relationships but do not disclose active customer counts,
      renewal rates, revenue shares, or the proportion of work delivered by acquired professionals. Fortune reports
      that a customer described savings as considerable while declining to quantify them, and that Eudia's CEO declined
      to discuss specific cost structures; these are disclosure limitations, not evidence of poor outcomes. The company
      announced a Series A of up to $105 million, but the announcement does not establish current cash, burn, or the
      capital required to support a services-heavy model. A Microsoft Word add-in also makes part of the product
      experience dependent on a third-party platform. Monitor verified renewal and concentration data, matter-level
      quality and rework, security attestations, and acquired-team retention. Thesis-break triggers include a material
      confidentiality event, inability to maintain jurisdictional authorization, persistent unreviewed AI errors, or
      integration-driven service deterioration.
    claimRefs: [CR001, CR002, CR012, CR013, CR014]
    tableRefs: [TR003]
    figureRefs: [FR001]
  - id: diligence-priorities
    title: Diligence priorities and residual uncertainty
    body: >-
      The current record supports a risk framework, not a conclusion that Eudia has breached a rule, suffered a security
      incident, or failed to integrate an acquisition. The allocated sources are predominantly company announcements,
      product listings, and a small number of independent articles; they do not provide regulator decisions, litigation
      outcomes, technical audit reports, quantified customer cohorts, or independently verified AI-performance data.
      Investors should request the legal-entity and jurisdiction matrix, professional-indemnity coverage, customer data
      processing terms, security audit and incident history, model and human-review controls, and integration scorecards
      for acquired teams. These requests should be tied to named owners and dated evidence rather than broad assurances.
      Until that information is available, the high-impact exposures remain monitorable but cannot be assigned reliable
      probability or mitigation-maturity scores. The heatmap therefore separates known operating dependencies from
      unresolved likelihoods and does not imply that a listed failure has occurred.
    claimRefs: [CR004, CR006, CR008, CR010, CR013, CR014]
