  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: No public NRR, GRR, churn, renewal, or cohort data was identified.
    whyItMatters: Durability cannot be underwritten from anecdotal deployment proof alone.
    diligencePath: Request renewal cohorts, logo churn, and NRR/GRR by segment.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU024
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Public sources do not disclose a current customer count or installed-base progression.
    whyItMatters: Without a denominator, named proof cannot be translated into penetration or concentration.
    diligencePath: Request current customer count by segment, net adds by quarter, and active-production deployment counts.
    relatedQuestionRefs:
    - QU002
    - QU023
  - type: private-evidence-only
    severity: medium
    topic: named-proof
    missingEvidence: Many of the richest deployment stories are anonymous by vertical rather than referenceable by company name.
    whyItMatters: Anonymous case studies are useful but weaker for procurement-grade proof.
    diligencePath: Request referenceable customers and production/pilot flags for each public case study.
    relatedQuestionRefs:
    - QU003
    - QU020
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: medium
    topic: concentration
    missingEvidence: Top-customer, federal, and partner-led concentration are not publicly quantified.
    whyItMatters: A small number of large enterprise accounts could materially affect durability and bargaining power.
    diligencePath: Request top-10 customers by ARR, segment mix, and partner-attributed revenue share.
    relatedQuestionRefs:
    - QU016
    - QU018
  - type: private-evidence-only
    severity: medium
    topic: review-depth
