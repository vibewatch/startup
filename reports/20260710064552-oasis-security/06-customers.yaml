- id: named-customer-proofs-and-case-study-depth
  title: Named Customer Proofs and Case-Study Depth
  body: 'The richest public customer evidence is mostly company-authored, but it is not empty marketing fluff. Oasis

    has surfaced detailed deployment narratives in multiple sectors. A private-credit firm in financial services

    is described using Oasis in Azure AD for visibility, tailored security policies, stale-account cleanup, and

    automated identity rotation. A healthcare-provider case study is more data-rich still: the environment

    reportedly had 8,500 human identities, more than 100,000 NHIs, over 50,000 certificates, and around 10,000

    service accounts, all being managed by an 18-person security team and roughly 50-person IT-operations team. An

    industrial-company webinar adds an Azure remediation and compliance narrative. Two named public references

    stand out. Mars appears in a dedicated April 2026 case-study resource focused on hyper-fragmented cloud

    identity visibility. Antares appears in the financial-services whitepaper as a user that streamlined lifecycle

    management and reduced manual work. These named references are stronger procurement-grade proof than anonymous

    vertical cases, though they still lack contract details, deployment length, or expansion history. By contrast,

    the Bank of America account page should be treated as account-based marketing, not as evidence of a live

    deployment. The core diligence takeaway is that Oasis has real use-case depth and at least some named public

    proof, but the public evidence remains unevenly distributed. Named customer proof exists, yet many of the most

    operationally informative case studies still remain anonymous.'
  claimRefs:
  - CU002
  - CU011
  - CU012
  - CU013
  - CU014
