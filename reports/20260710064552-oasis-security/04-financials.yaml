- id: capital-adequacy-and-financing
  title: Capital Adequacy, Funding Context, and Missing Runway Inputs
  body: 'Oasis clearly has capital to keep investing, but public sources do not reveal enough to convert that fact into

    a runway model. The March 2026 Series B brought in $120 million, and contemporaneous reporting from Newswire,

    Globes, and SiliconANGLE framed the round around the security problem created by enterprise AI agents and non-

    human identities. Globes additionally reported total capital raised of $195 million, a roughly $700 million

    valuation according to market sources, a fivefold ARR increase, and a customer base composed mostly of Fortune

    500 companies. Even if those traction figures are company-supplied rather than audited, they are directionally

    important: Oasis is not financing itself from a position of obscurity. What remains hidden is the balance-

    sheet side of the story. Public materials reviewed here do not disclose cash on hand after the Series B,

    monthly burn, gross margin, or net revenue retention, and no debt facility or credit line surfaced in the

    chapter evidence. GuidePoint’s OASIS+ positioning shows federal go-to-market intent, and the channel program

    plus marketplace listings show an expanding partner motion, but none of that translates into a quantified

    revenue split between direct, federal, or partner-led business. The right conclusion is therefore asymmetric.

    Oasis looks well funded for near-term product and go-to-market expansion, especially relative to the early age

    of the company, but the evidence is still too incomplete to estimate remaining runway or the next-round

    trigger with confidence. A diligence team would need monthly financial statements, ARR history, and

    concentration data before taking a hard view on capital adequacy.'
  claimRefs:
  - CI016
  - CI017
