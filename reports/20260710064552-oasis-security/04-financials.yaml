- id: peer-benchmarks-and-public-comps
  title: Peer Benchmarks for Revenue Quality and Capital Intensity
  body: 'Because Oasis is private, public identity and security vendors provide the only clean recurring-revenue

    benchmarks. Okta, SailPoint, Rubrik, and CyberArk all reported billion-dollar subscription or ARR scale in

    2026-period disclosures, and both Okta and SailPoint also have current SEC filing trails that confirm the

    market treats identity security as a recurring software category. These companies are not direct product

    matches for Oasis, but they do establish the economic language that investors and acquirers use for identity

    businesses: subscription revenue, ARR, SaaS ARR, RPO, and large-customer recurring cohorts. Those peers also

    show why Oasis’s missing disclosures matter. If management can substantiate strong ARR growth, healthy

    retention, and software-like gross margin, then the company can plausibly be framed against a premium

    identity-security revenue model rather than against services or infrastructure resellers. If not, the same

    lack of transparency can become a discount factor. In that sense, the comparable set is helpful not because it

    yields a precise multiple for Oasis today, but because it defines the proof burden Oasis would need to satisfy

    in a financing or acquisition process. Analyst valuation research sharpens the point. Windsor Drake’s Q2 2026

    IAM report places mainstream public IAM near 6.0x NTM revenue while non-human and AI-agent identity platforms

    can clear a 15x-30x range. Finro’s warning that mature public cyber comps can mislead on AI-native private

    companies is directionally fair, but it also cuts both ways: without hard ARR and margin evidence from Oasis,

    the premium part of that range is aspirational rather than underwritten.'
  claimRefs:
  - CI028
  - CI029
  - CI030
  - CI031
  - CI032
  - CI033
  - CI034
