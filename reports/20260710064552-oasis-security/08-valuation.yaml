- id: TV004
  title: Comparable Valuation Table
  enumerationScope:
    coverage: partial
    basis: The comp set is designed to frame the recurring-revenue economics and strategic context of identity security, not to claim like-for-like product comparability. It combines public leaders, adjacent strategic deals, and private NHI peers.
  columns:
  - Comparable
  - Metric
  - Multiple / Valuation / Status
  - Relevance
  - Limitation
  rows:
  - - Okta
    - FY2026 subscription revenue $2.855B
    - Public recurring-revenue identity leader
    - Shows how the market values identity at scale
    - Much broader workforce-identity scope than Oasis
  - - SailPoint
    - FY2026 ARR $1.125B; SaaS ARR $746M
    - Public / recently re-listed identity-security peer
    - Useful ARR-centric identity comp
    - Larger and more mature than Oasis
  - - Rubrik
    - FY2026 subscription ARR $1.46B
    - High-growth security SaaS comp
    - Useful recurring-revenue and growth benchmark
    - Not an identity-native vendor
  - - CyberArk
    - 2025 total ARR $1.44B; subscription ARR $1.267B
    - Identity / machine-identity incumbent
    - Strong strategic comp for machine identity
    - Broader PAM and incumbent scale
  - - Astrix / Cisco
    - Strategic deal, 2026
    - Signals M&A appetite for NHI / agentic identity controls
    - Strategic validation for the category
    - Deal terms not fully public in this file
  - - GitGuardian
    - 2026 $50M Series C
    - Private adjacent NHI / AI-agent security funding signal
    - Validates investor appetite for the segment
    - Funding round is not a direct valuation multiple
  notes: The table is a valuation lens, not a claim that Oasis should trade exactly like any one comparable.
