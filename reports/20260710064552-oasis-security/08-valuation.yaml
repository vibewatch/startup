- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - What Would Change the View
  rows:
  - - Oasis sits in a strategically important category as AI agents and NHIs proliferate
    - Show weak ARR quality or stalled enterprise conversion and the thesis softens
  - - Enterprise traction and multi-year-agreement language imply serious buyer interest
    - Provide customer-count and cohort data to strengthen the case
  - - Strategic M&A and peer funding suggest exit optionality
    - If M&A rumors fade and public comps compress, upside shrinks
  - - Missing ARR, margin, and retention data make the current mark hard to underwrite
    - Disclose ARR, NRR, gross margin, and burn to unlock a firmer valuation call
  - - Distribution optionality through partners could accelerate adoption
    - Show partner concentration or weak conversion and the benefit turns into a risk
  notes: Thesis and anti-thesis both depend on evidence quality, not only on category narrative.
