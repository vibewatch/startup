- id: comparable-framework-and-market-sentiment
  title: Comparable Framework and Market Sentiment
  body: 'The right comparable framework is recurring-revenue identity security, not generic services or infrastructure

    software. Okta, SailPoint, Rubrik, and CyberArk all discuss their businesses through subscription revenue or

    ARR. Their filings and official results reinforce that investors value identity platforms on recurring-revenue

    quality, retention, and expansion. Those companies are much larger and not directly comparable to Oasis on

    product scope, but they do establish the language of the category. Analyst valuation work adds the second

    layer. Windsor Drake’s Q2 2026 IAM report pegs mainstream public IAM around 6.0x NTM revenue while stating

    that non-human and AI-agent identity platforms can clear roughly 15x to 30x in private rounds. Finro argues

    that using mature public cyber comps against private AI-native companies can badly mislead. Multiples.vc shows

    that the broader cyber tape has also improved meaningfully in 2026. Strategic consolidation reinforces the

    point: Astrix’s sale to Cisco and CyberArk’s machine-identity consolidation around Venafi show that large

    platforms are still buying into this control layer. The catch is that Oasis has not disclosed ARR. So while

    the comparable set says what kind of company Oasis might become, it cannot yet say what multiple Oasis truly

    deserves today.'
