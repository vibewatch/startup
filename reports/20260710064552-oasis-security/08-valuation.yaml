- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Core Assumptions
  - Valuation / Return Logic
  - Key Risks
  - Probability Signal
  rows:
  - - Bull
    - Oasis substantiates strong ARR quality, keeps premium category positioning, and strategic buyer interest proves real
    - $900M-$1.0B+ range becomes credible through strategic scarcity or premium revenue multiple support
    - Disclosure gap closes too slowly; rumors do not convert to reality
    - Possible but requires new evidence
  - - Base
    - Last public mark remains best anchor and category momentum continues without major negative surprise
    - ~$700M remains fair reference point until fresher metrics arrive
    - Underwriting remains incomplete
    - Most defensible current case
  - - Bear
    - Public-comp discipline tightens and Oasis cannot prove premium ARR, retention, or concentration quality
    - $450M-$550M downside if premium narrative weakens
    - Valuation compression and partner / buyer friction
    - Plausible if disclosure stays thin
  - - Status-quo hold
    - Investor stays engaged without pricing conviction
    - No action until ARR, NRR, and margin are disclosed
    - Opportunity cost if momentum accelerates
    - Rational near-term posture
  - - Strategic takeout
    - M&A process or strategic scarcity drives premium beyond last round
    - Depends more on buyer synergies than on public comps
    - Unconfirmed process; integration and retention risk
    - Low visibility but real optionality
  notes: Valuation ranges are estimated scenario anchors derived from public financing and comp context, not from disclosed Oasis ARR.
