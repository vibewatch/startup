  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The fastest way to misunderstand Oasis's market is to treat it as a rebranded secrets manager. Public
              sources

              instead define a broader problem set: NHIs now include application and service identities, API and OAuth

              tokens, machine and device identities, cryptographic identities, bots, workloads, and increasingly AI
              agents.

              That means the relevant spend boundary includes discovery, posture, ownership assignment, lifecycle

              governance, and runtime authorization for automated actors. It also means the status quo is fragmented.
              Some

              buyers try to solve parts of the problem with vaults or identity stores such as HashiCorp Vault; others
              lean

              on cloud-native IAM, SPIFFE-style workload identity, or manual CMDB ownership processes. Those substitutes
              can

              address credential issuance or low-level workload identity, but they do not by themselves create
              enterprise-

              wide governance over every machine identity and delegated AI action. The NHI market is therefore best
              viewed

              as a convergence layer sitting between traditional IAM/PAM, secrets management, platform engineering, and
              AI-

              governance workflows.
            claimRefs:
