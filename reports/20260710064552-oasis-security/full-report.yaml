      - number: '8.2'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The most reliable public price anchor is the March 2026 financing. Newswire, Globes, SiliconANGLE, Access

              Newswire, and TechCompanyNews all support the $120 million Series B. Globes adds the most useful valuation

              detail by reporting that market sources believed Oasis was worth about $700 million and that total capital

              raised reached $195 million. That is the public financing mark of record. July 2026 introduced a second
              but

              weaker valuation signal: Globes reported advanced talks to sell Oasis to Cyera for up to $1 billion,
              mostly

              cash with a small amount of stock. Investors should not treat that as a closed-market mark. It is better

              interpreted as evidence that larger security players or private platforms could view Oasis as
              strategically

              relevant. The rumor increases upside optionality, but it also raises the risk of over-reading an
              unconfirmed

              process. Entry discipline should therefore remain tight. The last funded mark around $700 million is
              credible.

              The rumored strategic ceiling near $1 billion is interesting. But without cap-table detail, preferences,
              or

              unit-economics disclosure, a disciplined investor should not underwrite to the high case by default.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV026
              - CV027
              - CV031
              - CV037
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV027
              - CV028
      - number: '8.3'
        title: Comparable Framework and Market Sentiment
        blocks:
          - type: paragraph
            body: >-
              The right comparable framework is recurring-revenue identity security, not generic services or
              infrastructure

              software. Okta, SailPoint, Rubrik, and CyberArk all discuss their businesses through subscription revenue
              or

              ARR. Their filings and official results reinforce that investors value identity platforms on
              recurring-revenue

              quality, retention, and expansion. Those companies are much larger and not directly comparable to Oasis on

              product scope, but they do establish the language of the category. Analyst valuation work adds the second

              layer. Windsor Drake’s Q2 2026 IAM report pegs mainstream public IAM around 6.0x NTM revenue while stating

              that non-human and AI-agent identity platforms can clear roughly 15x to 30x in private rounds. Finro
              argues

              that using mature public cyber comps against private AI-native companies can badly mislead. Multiples.vc
              shows

              that the broader cyber tape has also improved meaningfully in 2026. Strategic consolidation reinforces the

              point: Astrix’s sale to Cisco and CyberArk’s machine-identity consolidation around Venafi show that large

              platforms are still buying into this control layer. The catch is that Oasis has not disclosed ARR. So
              while

              the comparable set says what kind of company Oasis might become, it cannot yet say what multiple Oasis
              truly

              deserves today.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
