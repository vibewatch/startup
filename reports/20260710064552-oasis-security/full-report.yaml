      - number: '6.4'
        title: Retention, Expansion, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              The public record provides only one direct durability signal: Newswire said most new ARR is driven by
              multi-

              year enterprise agreements. That is a useful clue because multi-year contracts generally indicate some

              stickiness and customer commitment. The case studies also describe ongoing governance work rather than
              one-

              time assessments, which supports a recurring-usage interpretation. But the public evidence stops there. No

              NRR, GRR, churn, cohort, renewal-rate, or contract-length distribution is available, and no public
              customer

              count makes it possible to turn named proof into a credible penetration or concentration model.
              Concentration

              risk is the largest unresolved customer question. If Oasis truly serves dozens of Fortune 500 companies
              yet

              remains early in total count, then a small number of very large accounts could influence revenue heavily.
              The

              public record also does not reveal how much business arrives through GuidePoint, CrowdStrike Marketplace,
              Wiz-

              driven workflows, or the broader partner channel. Those routes are clearly important for acquisition and

              procurement access, but they could also concentrate bargaining power or distort deployment ownership if

              overused. The right diligence posture is cautious optimism. Oasis’s public customer evidence is strong on

              workflow relevance and deployment anecdotes, but weak on retention math and concentration visibility. That

              means customer quality cannot be fully underwritten without internal cohort and segment data.
            claimRefs:
              - CU024
              - CU025
              - CU026
