  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Oasis no longer presents itself as only a non-human identity inventory vendor. The public product story
              now

              has two connected layers. First is the legacy NHI management platform covering governance, posture, and
              secret

              rotation across service accounts, applications, roles, keys, and other machine identities. Second is
              Agentic

              Access Management, which extends those controls to AI agents that reason and act across enterprise
              systems.

              The core product promise is not merely “discover the identities” but “convert every machine or agent
              action

              into a governed identity workflow” through provisioning, ownership, approval, policy enforcement,
              rotation,

              and decommissioning. That module map is unusually coherent for a young category. Oasis’s governance page

              concentrates on secure provisioning, ownership assignment, privilege control, rotation, attestation, and

              decommissioning. The posture-management page adds analytics for compromise attempts, toxic combinations,

              policy violations, and anomalies. The secret-rotation page then translates those insights into operational

              action by structuring discovery, observation, policy management, safe rotation, and lifecycle cleanup. For
              AI

              agents, AAM adds intent analysis, short-lived session identities, and chain-of-custody logs tying prompts
              to

              actions. Taken together, Oasis is building a control plane for who or what can act, why they can act, how
              long

              that access lasts, and how the action is audited after the fact.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
