  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Vertical Mix
        blocks:
          - type: paragraph
            body: >-
              Oasis’s public customer story is clearly enterprise-first and heavily skewed toward regulated or
              operationally

              complex environments. The broadest signal comes from its own about page, which says leading organizations

              across many industries use the product. More specific signals come from Newswire and Globes, which say
              Oasis

              serves dozens of Fortune 500 companies and that a majority of the client base comes from the Fortune 500.
              The

              vertical pages and case-study surfaces point most strongly to healthcare, financial services, logistics,

              insurance, manufacturing, and large consumer brands. Those are precisely the environments where machine

              identities proliferate fastest, operational downtime is expensive, and audit pressure is real. The
              interesting

              nuance is that Oasis sells into both end-user enterprises and partner-facing ecosystems. The AI Access

              Partnership page pitches enterprise AI vendors who want governance out of the box, not only the final

              enterprise buyer. GuidePoint, CrowdStrike Marketplace, and Wiz extend the route to market further, showing

              that customer access may come through procurement vehicles and partner workflows as much as through direct

              sales. This broadens acquisition paths but makes it harder to see the exact composition of the installed
              base

              from public evidence alone. The end result is a customer map with strong top-end enterprise bias, decent

              vertical richness, and weak denominator transparency. Public materials make it plausible that Oasis is
              landing

              with large complex buyers, but they do not disclose how many customers exist in each segment or which
              segments

              dominate recurring revenue.
            claimRefs:
