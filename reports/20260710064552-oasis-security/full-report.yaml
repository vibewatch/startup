      - number: '4.4'
        title: Peer Benchmarks for Revenue Quality and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Because Oasis is private, public identity and security vendors provide the only clean recurring-revenue

              benchmarks. Okta, SailPoint, Rubrik, and CyberArk all reported billion-dollar subscription or ARR scale in

              2026-period disclosures, and both Okta and SailPoint also have current SEC filing trails that confirm the

              market treats identity security as a recurring software category. These companies are not direct product

              matches for Oasis, but they do establish the economic language that investors and acquirers use for
              identity

              businesses: subscription revenue, ARR, SaaS ARR, RPO, and large-customer recurring cohorts. Those peers
              also

              show why Oasis’s missing disclosures matter. If management can substantiate strong ARR growth, healthy

              retention, and software-like gross margin, then the company can plausibly be framed against a premium

              identity-security revenue model rather than against services or infrastructure resellers. If not, the same

              lack of transparency can become a discount factor. In that sense, the comparable set is helpful not
              because it

              yields a precise multiple for Oasis today, but because it defines the proof burden Oasis would need to
              satisfy

              in a financing or acquisition process. Analyst valuation research sharpens the point. Windsor Drake’s Q2
              2026

              IAM report places mainstream public IAM near 6.0x NTM revenue while non-human and AI-agent identity
              platforms

              can clear a 15x-30x range. Finro’s warning that mature public cyber comps can mislead on AI-native private

              companies is directionally fair, but it also cuts both ways: without hard ARR and margin evidence from
              Oasis,

              the premium part of that range is aspirational rather than underwritten.
            claimRefs:
              - CI028
              - CI029
              - CI030
              - CI031
              - CI032
              - CI033
              - CI034
      - number: '4.5'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The financially attractive interpretation of Oasis is straightforward. It appears to be a contract-backed,

              custom-priced enterprise SaaS company selling into a painful and expanding identity problem, with enough

              product depth to support expansion and enough fresh capital to keep pressing the market. The public peer
              set

              shows that identity-security winners can become very large recurring-revenue businesses, and Oasis’s
              partner

              footprint suggests it is trying to scale through both direct enterprise relationships and distribution

              channels. The problem is that the public evidence stops at narrative quality and fundraising quality.
              There is

              no auditable public view of ARR, revenue mix, gross margin, burn, NRR, CAC, or concentration. Even pricing
              is

              opaque beyond the fact that it is quote-based. As a result, Oasis’s financial chapter should be read as

              structurally favorable but not yet underwritable from public information alone. For diligence, that means
              the

              gating items are specific and unavoidable: a quarterly ARR bridge, segment and channel mix, gross margin
              by

              component, burn and runway materials, and concentration data for top customers and partners. If management
              can

              produce those quickly and the numbers are consistent with the growth narrative, the financial posture

              strengthens materially. If not, the absence of disclosure itself becomes a risk factor because valuation

              expectations are already being influenced by premium-category narratives around non-human identity and
              agentic

              access.
