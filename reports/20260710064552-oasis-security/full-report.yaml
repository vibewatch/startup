  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and founding context
        blocks:
          - type: paragraph
            body: >-
              Oasis Security is best understood as a post-stealth infrastructure-security company selling governance for

              non-human identities rather than a narrow secrets utility. Across its homepage, about page, product page,
              and

              founding blog, the company describes a platform that discovers machine identities, maps ownership and
              usage

              context, and orchestrates lifecycle controls such as monitoring, certification, remediation, and

              decommissioning. The product language is deliberately broad: Oasis says it spans IaaS, SaaS, PaaS, and
              on-prem

              environments and names endpoints as diverse as AWS, Azure, BigQuery, GitHub, ChatGPT, Salesforce, Office
              365,

              and Copilot. That breadth matters because it implies the company wants to sit above fragmented vaults and

              point tools as an identity-governance layer. The official origin story also gives Oasis a distinct
              narrative:

              Danny Brickman says the company began in a modest room in Tel Aviv with teammates from Israeli cyber

              operations, while independent reporting identifies Brickman and Amit Zimerman as the founding pair. The
              result

              is a company with visibly Israeli technical roots but a commercial narrative now anchored in U.S.
              enterprise

              identity security.
