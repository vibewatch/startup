  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, suite incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The competitive map around Oasis is crowded, but not flat. One cluster is the direct NHI and
              agentic-identity

              pure plays: Oasis itself, Entro, Aembit, and until its June 2026 Cisco absorption, Astrix. A second
              cluster is

              the suite incumbents: CyberArk, Saviynt, and Delinea, all of which approach the problem from broader
              identity-

              security or machine-identity platforms. A third cluster is runtime and infrastructure control: HashiCorp

              Vault, SPIFFE/SPIRE, and newer developer-first identity entrants such as WorkOS. These are not always
              direct

              displacement threats, but they are legitimate substitutes for specific buyer use cases. The key
              implication is

              that Oasis is rarely fighting a single category. In some deals it will be compared with
              lifecycle-governance

              peers; in others it will be asked why a buyer cannot extend an incumbent vault, PAM, or workload identity

              framework instead. That multi-category competition increases both buyer education burden and the
              importance of

              clear category ownership.
