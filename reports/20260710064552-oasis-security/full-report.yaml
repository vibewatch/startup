              - CR034
      - number: '7.3'
        title: Operational, Technical, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence in the file is that the underlying problem space is dangerous. Oasis’s own research
              and

              incident analyses document a string of agentic and NHI failures: OpenClaw takeover from a visited website,

              Claude prompt-injection data exfiltration, shared agent-identity ambiguity in Claude Tag, localhost hijack
              in

              Cline, silent folder-open execution in Cursor, one-click VS Code MCP compromise, malicious MCP package

              exfiltration, weak-default-credential failure in McHire, and older but still highly relevant breaches at

              Change Healthcare, Cloudflare, and Cisco. Taken together, these are not edge cases. They show a pattern of

              repeated access-boundary failure across AI and machine-identity systems. That pattern is a commercial

              opportunity for Oasis but also a product risk. If buyers conclude that agentic systems are too unsafe to

              deploy broadly, demand can pause. If buyers do deploy aggressively, the burden shifts to vendors like
              Oasis to

              prove their controls actually reduce the risk. External threat summaries from OWASP, CyberArk, Palo Alto,

              Delinea, and related sources reinforce that governance gaps, over-privilege, weak offboarding, secret
              leakage,

              and immature AI controls are all common. Public evidence does not yet show Oasis publishing the kind of
              third-

              party efficacy benchmarks that would decisively answer that challenge. Operationally, the deployment model
              is

              safer than pure central custody because customer-side execution and local control boundaries matter. But
              that

              also means implementation quality, connector resilience, and customer-operational maturity become part of
              the

              product-risk equation, not something Oasis can abstract away entirely.
            claimRefs:
              - CR008
              - CR009
