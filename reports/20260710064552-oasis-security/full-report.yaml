      - number: '3.3'
        title: Distribution power, proof points, and switching dynamics
        blocks:
          - type: paragraph
            body: >-
              Distribution power is emerging as a decisive differentiator. Oasis has visible partner surfaces with

              CrowdStrike and Wiz, and both integrations tell a helpful story: the platform is not only finding
              identities,

              but also pulling in endpoint or cloud context and tying that to governed remediation. That is a more
              mature

              commercial signal than a standalone homepage claim. At the same time, Oasis's public proof remains thinner

              than its partner story. Gartner shows only one visible review, while SourceForge and Slashdot provide
              product-

              directory summaries rather than enterprise-grade reference depth. That asymmetry matters in head-to-head
              sales

              cycles. Switching costs also appear additive rather than fully replacement-oriented. Buyers can keep
              Vault,

              SPIFFE, cloud IAM, or other workload primitives and still add a governance layer on top. This makes the
              market

              structurally multi-home, which lowers outright rip-and-replace friction but raises the bar for proving why

              Oasis should become the unifying control plane rather than just another dashboard.
