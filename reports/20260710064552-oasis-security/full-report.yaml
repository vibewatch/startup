      - number: '3.2'
        title: 'Profiles: who owns lifecycle breadth versus runtime depth'
        blocks:
          - type: paragraph
            body: >-
              The strongest profile contrast is between lifecycle-breadth vendors and runtime-depth vendors. Oasis,
              Entro,

              and Saviynt all emphasize discovery, contextual ownership, posture, and remediation. CyberArk competes
              with

              scale and lifecycle breadth for machine identities, but from a broader enterprise identity base and with

              certificate and secrets heritage. Delinea also pushes continuous discovery and privileged-access hygiene.
              By

              contrast, Aembit and HashiCorp are more explicit about short-lived or dynamic access patterns: Aembit
              sells

              secretless, policy-based runtime access for agentic AI and workloads, while HashiCorp validates
              OAuth-based

              AI-agent authentication and dynamic secrets. SPIFFE is even more infrastructure-native, offering a

              cryptographic workload identity control plane without the business-governance wrapper. These differences

              matter because buyers do not all value the same layer. A security leader worried about overprivileged
              orphaned

              identities may favor lifecycle governance; a platform team focused on eliminating static secrets may
              prefer

              runtime plumbing first.
