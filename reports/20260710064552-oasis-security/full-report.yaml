              The milestone record from public sources is coherent enough to support an overview chapter, but it still

              leaves obvious gaps. The company moved from a stealth exit in January 2024 to a Series A extension in May

              2024, formal channel-program launch in April 2025, Series B in March 2026, and executive expansion in
