      - number: '2.2'
        title: Sizing lenses, identity segmentation, and regional shape
        blocks:
          - type: paragraph
            body: >-
              Public market sizing for NHI governance is directionally strong but not numerically clean. Mordor
              Intelligence

              sizes the narrower NHI security segment at $8.22 billion in 2026 and $22.94 billion by 2031, while
              Research

              and Markets and its Yahoo Finance distribution partner place the broader NHI access-management category at

              $12.2 billion in 2026 and $38.8 billion by 2036. The spread is not noise; it reflects different
              boundaries.

              The broader estimate includes solution and services layers across identity types, deployment modes,

              organization sizes, and verticals, while the narrower estimate is closer to the security-control subset.

              Regional shape is clearer than precise SAM: North America currently leads, Asia-Pacific is forecast to
              grow

              fastest, and large enterprises dominate present demand. Identity-type segmentation is also explicit in the

              broader forecast: application and service identities, API and OAuth token identities, machine and device

              identities, cryptographic identities, and AI-agent identities are already first-class subsegments. The
              correct

              takeaway is that the market is real, large, and expanding quickly, but a clean Oasis-specific SOM is not

              public.
