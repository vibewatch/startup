              a manufacturing customer enforcing M&A compliance on newly acquired environments. The product page adds a

              Fortune 1000 quote about discovering 17,000-plus non-human identities in a cloud environment. Those
              signals

              are meaningful because they imply the product has been used inside live operational settings. The
              independent-

              customer-voice layer is much thinner. Gartner Peer Insights shows a 4.6 out of 5 rating from 20 ratings on
              the

              captured page, which is directionally positive. But that is still a relatively small sample for a company

              claiming dozens or more large-enterprise deployments. SourceForge and Slashdot provide product listings,
              yet

              the captured SourceForge page shows an overall 0.0/5 and both long-tail review sites offer very limited
              review

              substance. That does not prove customer dissatisfaction, but it does mean the public review surface is
              shallow

              outside Gartner. Investors should therefore separate two truths. First, Oasis likely has real enterprise

              adoption. Second, independent public voice remains too sparse to say much about broad satisfaction, ease
              of

              deployment, or renewal behavior at scale.
