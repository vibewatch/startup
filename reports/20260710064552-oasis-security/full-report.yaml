      - number: '7.5'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of the Oasis risk stack is that most of it can be tested early. Several of the top
              risks

              are not binary unknowables. Management can show evidence that enterprise security reviews are speeding up,

              that customer retention is healthy, that partner concentration is moderate, that public proof is
              expanding,

              and that vulnerability-response discipline is rigorous. If Oasis can move those needles, the risk case
              weakens

              materially because the company’s market relevance is already credible. The kill criteria are equally
              concrete.

              If public incidents keep showing the ecosystem is fragile while Oasis cannot provide benchmark evidence of

              control efficacy, buyer trust may stall. If partner dependence rises without fallback options,
              distribution

              resilience weakens. If strategic noise around potential M&A begins to distract teams or customers,
              execution

              risk rises. And if financial disclosure stays thin even as valuation expectations rise, investors should

              assume model risk is being carried forward rather than solved. In short, Oasis’s risk profile is best

              understood as manageable but front-loaded. The company must prove discipline, trust, and resilience faster

              than the agentic-access threat surface expands around it.
            claimRefs:
              - CR029
              - CR032
              - CR037
              - CR038
              - CR039
              - CR042
