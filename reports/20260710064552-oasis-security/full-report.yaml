      - number: '4.2'
        title: Delivery Model, Cost Structure, and Unit-Economics Signals
        blocks:
          - type: paragraph
            body: >-
              Oasis has not published unit economics, but its public architecture points to where the cost base likely
              sits.

              The Outpost pattern keeps sensitive identity operations inside the customer perimeter while the central

              platform handles control logic, metadata, lifecycle automation, and analysis. That setup suggests a
              software-

              heavy model whose marginal delivery burden should be dominated by engineering, cloud analytics, customer

              support, and partner enablement rather than by hardware, inventory, or large working-capital swings. The

              secret-rotation and governance pages reinforce that reading because they frame risk remediation as an

              automated recurring control, not as a manually staffed professional service. The strongest public
              production

              proof in this chapter is the financial-services case study. Oasis describes fast Azure AD deployment,
              auto-

              discovery, risk posture analysis, stale-account cleanup, and automated identity rotation for a
              private-credit

              customer. Even though the case study is company-authored and does not disclose contract value, it is still

              useful because it shows the platform can enter regulated customer workflows where compliance and
              credential

              hygiene are economically important. The finance-solution page further links the buyer case to PCI DSS 4.0,
              SOC

              2, and GDPR-sensitive environments, which implies that the company is targeting use cases where budget
              owners

              often care about risk reduction, auditability, and operational resilience rather than only developer

              convenience. Still, the public record stops short of underwriting metrics. There is no disclosed ACV,
              gross

              margin, CAC, NRR, or services mix. The only defensible conclusion is qualitative: Oasis appears
              structurally

              capable of software-like margins, but no outsider can yet measure how much support, services, or channel

              discounting compresses those margins in practice.
