  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The public bull case for Oasis is compelling. The company sits in a category whose importance is rising

              quickly as AI agents and non-human identities proliferate across enterprise systems. Oasis has a visible

              Series B, recognizable investors, enterprise-oriented customer references, and a product story that
              positions

              it as the access-governance layer for the agentic enterprise. Strategic scarcity is real: category peers
              are

              being funded, large security vendors are consolidating adjacent machine-identity assets, and industry
              research

              now treats non-human and AI-agent identity as a first-order security control problem. The anti-thesis is

              equally important. Oasis has not publicly disclosed the operating metrics needed to justify a premium

              valuation. ARR, gross margin, retention, burn, and concentration are missing. Public category excitement

              therefore does not translate directly into underwriting confidence. Investors can believe the problem is
              real

              and still conclude that the price cannot be judged with enough precision yet. That tension matters because

              valuation here is narrative-sensitive. Oasis may in fact deserve a premium mark if growth quality is as
              strong

              as the company and reporters imply. But until the denominator is disclosed, the public file is best read
              as

              strategically promising rather than valuation-complete.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV024
              - CV025
              - CV040
              - CV042
