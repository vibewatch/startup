  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Stack Overview and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Oasis is addressing a real problem, but it is doing so in a threat environment moving faster than
              standards,

              buyer education, and public proof. The external context is unusually harsh. NIST’s AI Agent Standards

              Initiative is still at the stage of industry-led protocols and gap analysis rather than enforceable
              controls,

              while the Cloud Security Alliance says enterprises already need practical governance now. At the same
              time,

              machine identities vastly outnumber humans, AI agents are proliferating, and multiple recent incidents
              show

              how fragile the surrounding toolchain can be when trust boundaries are weak. That creates a distinctive
              risk

              profile. Oasis is not primarily exposed to a single catastrophic regulatory ban or a single hardware

              dependency. Instead, its biggest risks stack on top of each other: selling ahead of settled standards,
              relying

              on multiple partner ecosystems, proving control quality without much public benchmark evidence, and
              serving

              demanding regulated buyers whose procurement cycles are long and security-review burden is high. The
              product

              thesis may be right while the execution bar keeps rising. The implication for investors is that the most

              important risks are not abstract. They are monitorable: whether enterprise security reviews shorten,
              whether

              integrations remain stable, whether public proof matures beyond research and narrative, and whether
              management

              can turn category urgency into trusted large-scale deployment without strategic distraction.
            claimRefs:
              - CR001
              - CR002
              - CR022
              - CR024
              - CR037
              - CR039
              - CR042
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR007
              - CR026
              - CR028
              - CR029
              - CR042
      - number: '7.2'
        title: Regulatory, Legal, and Trust Risk
        blocks:
          - type: paragraph
            body: >-
              Oasis is selling into environments where compliance and trust burden are high, but the external standards

              layer is not yet mature. NIST is building agentic-AI standards around secure interoperability and open

              protocols, while CSA explicitly argues that enterprises are operating before agent-specific controls are

              settled. This mismatch is risky: Oasis can benefit from urgency, but it can also find itself repeatedly

              educating buyers and defending category assumptions that standards bodies have not fully codified. The

              company’s own public contract stack partly mitigates this and partly shifts risk back to customers. The
              DPA

              references GDPR, UK GDPR, and Israeli privacy law, while the SaaS agreement makes customers responsible
              for

              legal bases and permissions around their data. The SLA gives a 99.9 percent uptime commitment, but
              remedies

              are constrained to service credits capped at 20 percent of subscription value. In other words, Oasis has

              baseline enterprise paperwork, yet customers still shoulder meaningful compliance and outage risk in
              practice.

              This means legal and regulatory risk is less about immediate enforcement against Oasis and more about
              trust

              conversion. Buyers in healthcare, finance, and AI governance will expect a rapidly improving proof stack:

              clearer standards alignment, better external validation, and evidence that public legal language maps to

              reliable operational control.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR033
              - CR034
          - type: table
            tableRef: TR001
            claimRefs:
