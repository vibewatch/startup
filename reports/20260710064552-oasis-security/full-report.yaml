            body: >-
              Public adoption signals are strongest when Oasis speaks about enterprise outcomes and weakest when outside

              review platforms are examined. On the positive side, the home page lists multiple enterprise results: a

              Fortune-50 healthcare provider avoiding an estimated HIPAA fine, a Fortune-500 logistics buyer cutting
