      - number: '3.4'
        title: Moat durability, consolidation, and commoditization risk
        blocks:
          - type: paragraph
            body: >-
              Oasis's moat is credible but not yet unassailable. The best version of the case is that it unifies
              inventory,

              contextual ownership, lifecycle action, and an agentic-access narrative in one market-facing platform. The

              weaker version is that many of those pieces are being added across the ecosystem: Saviynt and Delinea are

              deepening discovery and posture; CyberArk already owns a large machine-identity budget anchor; HashiCorp
              and

              Aembit attack static credentials through runtime patterns; and Astrix's absorption into Cisco shows that

              larger platforms want this capability set. The category may therefore commoditize from both ends —
              discovery

              and posture from suites, runtime access from infrastructure vendors. Public pricing opacity makes it
              harder to

              see who is cheapest, but that probably increases, rather than decreases, the role of distribution,
              deployment

              model, and reference depth in buying decisions. The result is a market where Oasis can still win, but only
              if

