      - number: '5.4'
        title: Trust, Standards, and Technical Maturity
        blocks:
          - type: paragraph
            body: >-
              Oasis’s trust story has three pillars: auditability, standards alignment, and technical credibility.

              Auditability comes from the AAM claim that each agent action is logged from prompt to action through a
              chain-

              of-custody record. Standards alignment comes from the AAM Framework launch and the broader NIST AI Agent

              Standards Initiative, which together show that the company is trying to anchor its narrative in a maturing

              external governance conversation rather than in product marketing alone. Technical credibility is
              reinforced

              by the OpenClaw disclosure, where Oasis researchers publicly detailed an agent-takeover chain and said the

              upstream team shipped a fix within 24 hours. At the same time, the standards environment is still early.

              NIST’s initiative is oriented around secure interoperability and open protocols, not a mature checklist
              buyers

              can simply adopt today. That creates an opening for Oasis to shape best practices, but it also means many
              of

              its governance claims are ahead of stable third-party certification norms. Public materials further
              highlight

              developer-signal through recruiting and engineering culture, yet they do not surface the kind of deep
              public

              API or package ecosystem that would make technical adoption easy to independently inspect. So the current

              technical-maturity signal is strong on narrative coherence and growing ecosystem relevance, but lighter on

              public benchmarks and open implementation proof.
            claimRefs:
              - CE022
              - CE023
              - CE024
              - CE025
              - CE026
              - CE027
              - CE028
              - CE032
