  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Procurement, and Contract Stack
        blocks:
          - type: paragraph
            body: >-
              The best public evidence says Oasis sells recurring enterprise software, not project-based consulting. Its

              July 2025 SaaS subscription agreement is tied to an order and then layered with a public DPA and SLA,
              while

              AWS Marketplace routes buyers to custom private offers instead of fixed catalog pricing. That combination
              is

              the classic posture of an enterprise SaaS vendor that negotiates terms per customer and expects ongoing

              service delivery. The contract stack also shows that Oasis is already operating in procurement
              environments

              where privacy, uptime, and support commitments matter, which tends to correlate with annual or multi-year

              subscription selling rather than discretionary tooling purchases. The product surface behind that revenue

              model is broad enough to support expansion. Oasis does not only inventory non-human identities; it
              packages

              provisioning, ownership assignment, attestation, rotation, posture management, and decommissioning as

              lifecycle capabilities. The provisioning launch is especially relevant financially because it extends the

              product into workflow triggers such as Terraform, ServiceNow, and generic APIs, and into cloud and vault

              ecosystems including AWS, Azure, GCP, HashiCorp, CyberArk, and Azure Key Vault. That makes revenue quality

              more likely to come from platform embedment than from isolated point-feature adoption. Pricing
              transparency,

              however, remains weak. AWS Marketplace confirms buyers can request a private offer, but there is no public

              list price, seat metric, or asset-based tiering schedule that would let an outsider infer ACV. The result
              is

              that Oasis can be described as a custom-priced, enterprise-subscription software business with partner-

              assisted procurement, but not yet as a business whose realized price architecture is publicly visible.
