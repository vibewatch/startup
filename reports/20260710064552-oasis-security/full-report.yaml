  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR quality disappoints
        - Management cannot substantiate strong ARR growth, retention, or gross margin
        - Premium-category valuation logic weakens immediately
        - Re-cut valuation downward or walk away
      - - Strategic interest evaporates
        - Cyera-style interest proves illusory and no buyer appetite remains
        - Bull-case ceiling compresses
        - Anchor to base/bear only
      - - Partner concentration rises
        - One route or partner dominates pipeline / ARR
        - Distribution optionality turns into dependency risk
        - Apply concentration discount
      - - Public proof lags
        - No meaningful improvement in external validation or customer metrics
        - Trust and diligence burden stay too high
        - Keep recommendation at research-more
      - - Comp compression returns
        - Public IAM and cyber multiples roll over materially
        - Narrative premium narrows
        - Tighten entry discipline and downside range
    notes: These are price-sensitive kill criteria tied to valuation, not generic product issues.
    claimRefs:
      - CV025
      - CV029
      - CV030
      - CV037
      - CV042
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR and revenue quality
        - Current ARR, segment mix, NRR / GRR, quarterly bridge
        - Core denominator for valuation and confidence
        - Management / data room
      - - Gross margin and burn
        - Gross margin bridge, COGS split, monthly burn, runway
        - Needed to assess capital adequacy and downside
        - Finance diligence
      - - Customer concentration
        - Top-10 customers, partner attribution, federal/commercial split
        - Determines durability and bargaining risk
        - Revenue operations / CFO
      - - Cap table and preferences
        - Preferences, debt, secondaries, option pool
        - Entry price depends on more than headline valuation
        - Legal / financing diligence
      - - M&A process status
        - Reality of strategic interest and impact on team/customers
        - Avoid overpricing on rumor alone
        - Board / management discussion
      - - Referenceable proof
        - Named customers, expansion cases, deployment maturity
        - Converts narrative premium into trustable proof
        - Customer diligence / calls
    notes: Without these asks, the valuation call cannot move beyond research-more.
    claimRefs:
      - CV009
      - CV031
      - CV032
      - CV036
      - CV042
