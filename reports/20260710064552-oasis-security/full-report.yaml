      - number: '5.5'
        title: Roadmap Direction and Product Risks
        blocks:
          - type: paragraph
            body: >-
              The public roadmap is visible in the release chronology even without a formal product roadmap file. Oasis

              began with NHI lifecycle management, then added more explicit provisioning and governance workflows, and
              by

              late 2025 to mid-2026 had clearly pivoted into agentic access management, ecosystem partnerships, and a

              practitioner-built governance framework. That is a credible expansion path because AI agents inherit the
              same

              underlying identity problems as service accounts and workload identities, only with higher autonomy and
              faster

              decision loops. The main technical risks are equally clear. First, the company is making high-value claims

              about intent analysis, policy enforcement, and lifecycle automation without publicly released benchmark
              data,

              throughput metrics, or efficacy comparisons. Second, the architecture depends on continued cooperation
              from

              cloud, vault, IDE, and security-platform partners. Third, developer-signal is present mostly through

              recruiting and thought leadership rather than a visible open-source or SDK footprint. None of these risks

              breaks the product thesis, but they do mean that buyer diligence should move quickly from “the story
              sounds

              right” to “show the implementation detail, deployment evidence, and performance data.”
