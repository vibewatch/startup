      - number: '8.4'
        title: Scenario Analysis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              The base-case decision is to anchor near the last defensible public financing mark and refuse to
              extrapolate

              too far beyond it. That means treating roughly $700 million as the current public benchmark, not because
              it is

              certainly correct but because it is the best-supported mark. The bull case can credibly approach $1.0
              billion

              if the Cyera interest proves directionally right or if management can validate premium ARR growth and

              retention quality. The bear case falls to the mid-hundreds of millions if the market reverts to public-IAM

              discipline before Oasis supplies the metrics needed to justify premium private-category framing. Given
              that

              setup, the most defensible recommendation is research-more. Oasis looks like a company worth staying close
              to,

              not a company that can be bought confidently on public evidence alone. Confidence is medium because the

              category tailwinds and financing mark are real, but the operating evidence is incomplete. Risk rating
              remains

              high because disclosure, dependence, and proof questions are still material. This is a company that may be

              good and may even be strategically scarce. The issue is that the public file still does not show enough to

              know whether the current implied price is attractive, merely fair, or already stretched.
            claimRefs:
              - CV026
              - CV027
              - CV028
