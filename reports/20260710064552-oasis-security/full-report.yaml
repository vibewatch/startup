            body: >-
              The richest public customer evidence is mostly company-authored, but it is not empty marketing fluff.
              Oasis

              has surfaced detailed deployment narratives in multiple sectors. A private-credit firm in financial
              services

              is described using Oasis in Azure AD for visibility, tailored security policies, stale-account cleanup,
