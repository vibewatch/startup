      - number: '1.3'
        title: Traction signals, partner validation, and category timing
        blocks:
          - type: paragraph
            body: >-
              Traction evidence is real but still selective. The strongest company claim is that a majority of Oasis's

              client base comes from the Fortune 500 and that new ARR grew fivefold year over year heading into the
              Series

              B. That is directionally impressive, especially when paired with management's claim that most new ARR is

              driven by multi-year enterprise agreements. Independent public customer proof is shallower: TechCrunch
              named

              Chipotle, JLL, and Mercury Financial as early users, while Gartner Peer Insights showed a 5.0 rating from
              a

              single banking review in early 2026. Partner surfaces strengthen the adoption story. CrowdStrike's
              marketplace

              listing and Wiz's integration page both describe Oasis as an active ecosystem participant rather than a

              conceptual integration. Just as important, third-party category signals show that the market window is
              real.

              NIST launched an AI Agent Standards Initiative in 2026, Palo Alto Networks said machine identities hit

              109-to-1 versus humans, and CyberArk framed the machine-identity problem as a breach and outage vector.
              Oasis

              is therefore not selling into a synthetic category; it is selling into a problem that large security
              vendors

              and standards bodies also describe as urgent.
