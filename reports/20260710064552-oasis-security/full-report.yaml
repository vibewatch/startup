companyProfile:
  summary: |
    Oasis Security is a New York- and Israel-linked cybersecurity company focused on one of the most
    important identity shifts in modern enterprise infrastructure: the rise of non-human identities and
    AI agents. Its platform combines discovery, ownership mapping, posture management, secret rotation,
    provisioning, and agentic-access controls to help enterprises govern machine identities and AI
    agents across cloud, SaaS, on-prem, and developer-tool environments. Founded in 2022 by Danny
    Brickman and Amit Zimerman, Oasis has moved quickly from stealth to a $120M Series B, built a
    Fortune-500-heavy customer narrative, and expanded its positioning from NHI lifecycle management to
    broader agentic-access governance. The strategic story is strong, but the company remains private
    and materially under-disclosed on financial metrics that would let investors validate the implied
    valuation with confidence.
