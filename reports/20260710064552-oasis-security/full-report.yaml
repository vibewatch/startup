      - number: '2.4'
        title: Growth drivers, adoption constraints, and the standards gap
        blocks:
          - type: paragraph
            body: >-
              The strongest growth driver is simple arithmetic: machine identities and AI agents are proliferating
              faster

              than human IAM systems were built to handle. Palo Alto says the machine-to-human ratio reached 109-to-1 in

              2026 and continues to rise, while Axis Intelligence highlights both secrets sprawl and long-lived
              credential

              exposure. On top of that, NIST has now launched an AI Agent Standards Initiative, and vendors across the

              market are translating that into product narratives around open protocols, least privilege, and
              governance.

              But the same sources also reveal why market conversion will not be frictionless. OWASP-style maturity work

              shows a large adoption-to-protection gap; Cloud Security Alliance says enforceable controls do not yet
              exist;

              ITECS argues shadow AI is already outpacing visibility; and Delinea warns that AI agents often carry

              persistent, broadly privileged access. In practice, buyers are pulled forward by urgency and compliance,
              but

              held back by fragmented tooling, unclear ownership, and the operational burden of replacing entrenched
              vault

              or cloud-IAM patterns. That combination supports a fast-growing market with real friction rather than a

              straight-line land grab.
