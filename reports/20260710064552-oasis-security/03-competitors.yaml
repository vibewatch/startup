  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-pricing
    missingEvidence: Comparable public pricing, package boundaries, and discount behavior were not visible across the reviewed enterprise pages.
    whyItMatters: Without pricing transparency, competitive displacement risk and budget fit have to be inferred from features and GTM posture rather than direct price benchmarks.
    diligencePath: Collect RFPs, trial quotes, or partner channel pricing sheets across Oasis, CyberArk, Saviynt, Delinea, Aembit, and Entro.
    relatedQuestionRefs:
    - QP011
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: No public source surfaced win/loss rates, average deployment duration, or reliable replacement patterns versus each major competitor.
    whyItMatters: Feature comparisons do not reveal whether Oasis actually beats suite incumbents or only complements them.
    diligencePath: Request internal win/loss analysis and interview customers that evaluated multiple vendors.
    relatedQuestionRefs:
    - QP017
    - QP026
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: customer-proof-depth
    missingEvidence: Public customer proof for Oasis is thinner than its partner and product narrative, limiting direct comparison with category incumbents.
    whyItMatters: Sparse social proof can elongate enterprise sales cycles when buyers ask for production references.
    diligencePath: Request customer references by vertical, named logos, and deployment-stage evidence.
    relatedQuestionRefs:
    - QP015
    - QP023
  - type: conflicting-data
    severity: minor
    topic: consolidation-risk
    missingEvidence: Astrix's Cisco absorption implies less standalone choice, but there is not yet enough public data to know whether platform integration strengthens or dilutes its capabilities.
    whyItMatters: Consolidation can either improve distribution or erase product focus, affecting competitive threat levels.
    diligencePath: Track Cisco roadmap statements and partner/customer reactions over the next refresh cycle.
    relatedQuestionRefs:
    - QP008
    - QP022
