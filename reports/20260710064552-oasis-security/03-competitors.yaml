- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Risk or moat factor
  - Who pressures it
  - Evidence
  - Implication for Oasis
  - Diligence ask
  rows:
  - - Unified lifecycle governance story
    - Suite incumbents
    - Saviynt, Delinea, and CyberArk all market discovery plus lifecycle breadth
    - Oasis must show integration depth, not just category vocabulary
    - Request proof that customers consolidate tools rather than add dashboards
  - - Runtime access differentiation
    - Aembit / HashiCorp / WorkOS adjacents
    - Short-lived, secretless, or session-scoped access is a strong adjacent wedge
    - Oasis cannot let runtime access become someone else's durable control plane
    - Clarify how often Oasis wins when runtime controls dominate
  - - Distribution and platform pull
    - Cisco, CrowdStrike, Wiz, incumbent suites
    - Astrix joined Cisco; Oasis shows partner surfaces; suites have installed bases
    - Channel and ecosystem leverage may matter as much as features
    - Quantify sourced pipeline, attach rates, and reseller influence
  - - Public proof depth
    - Gartner / directories reveal thin visible review volume
    - One Gartner review plus directory descriptions are weaker than many enterprise buyers prefer
    - Reference scarcity could slow later-stage procurement
    - Request customer references by vertical and deployment stage
  - - Multi-homing / additive adoption
    - Vaults, SPIFFE, cloud IAM
    - Buyers can keep primitives while adding governance layers
    - Category may be additive, lowering rip-and-replace friction but also lock-in
    - Ask whether Oasis displaces budgets or merely layers onto them
  - - Consolidation and commoditization
    - Cisco / suites / inventory expansion
    - Astrix consolidation and broader suite feature expansion compress independent surface area
    - Discovery-only narratives may commoditize faster than integrated control planes
    - Track whether Oasis can defend against bundling on breadth and execution
  notes: Rows focus on strategic durability rather than raw product checklists, because the real question is whether Oasis can remain control-plane-relevant as adjacent layers consolidate.
