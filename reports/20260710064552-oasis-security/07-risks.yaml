  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: certifications-and-proof
    missingEvidence: Public sources do not expose downloadable audit reports, benchmark studies, or third-party efficacy validation for AAM and posture analytics.
    whyItMatters: Enterprise buyers need proof that controls work, not just that the threat is real.
    diligencePath: Request SOC 2 / ISO reports, red-team summaries, benchmark data, and customer deployment metrics.
    relatedQuestionRefs:
    - QR008
    - QR024
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: runway-and-concentration
    missingEvidence: Public sources do not disclose burn, runway, customer concentration, or partner-attributed ARR.
    whyItMatters: Model risk and dependency risk cannot be quantified without financial and customer concentration data.
    diligencePath: Request monthly burn, runway, top-10 customers, and partner revenue share.
    relatedQuestionRefs:
    - QR017
    - QR021
  - type: private-evidence-only
    severity: medium
    topic: partner-resilience
    missingEvidence: Public materials show ecosystem breadth but not SLA, fallback, or contingency plans if key partners or connectors fail.
    whyItMatters: Platform dependency risk is central to the product’s operating model.
    diligencePath: Request dependency map, top connector usage, and partner-failure playbooks.
    relatedQuestionRefs:
    - QR016
    - QR020
  - type: private-evidence-only
    severity: medium
    topic: roadmap-discipline
    missingEvidence: Public incident research is rich, but there is little public evidence on secure SDLC metrics, release quality, or internal control maturity.
    whyItMatters: Fast-moving AI security vendors can win market attention before process maturity catches up.
    diligencePath: Request release governance, vuln-response SLAs, secure-SDLC controls, and postmortem summaries.
    relatedQuestionRefs:
    - QR023
    - QR024
  - type: private-evidence-only
    severity: medium
    topic: strategic-process-noise
    missingEvidence: The Cyera acquisition rumor is public, but there is no validated information on process status, distraction level, or employee-retention impact.
    whyItMatters: Strategic noise can affect execution, hiring, and customer confidence even if a deal never closes.
    diligencePath: Ask management directly about strategic process, retention plan, and customer communication posture.
