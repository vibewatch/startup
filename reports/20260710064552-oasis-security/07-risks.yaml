- id: partner-customer-and-model-risk
  title: Partner, Customer, and Model Risk
  body: 'Oasis’s route to market is part of its moat and part of its risk stack. The AI Access Partnership Program

    openly pitches buyers and partners on bypassing lengthy security reviews. The public ecosystem also spans

    GuidePoint’s OASIS+ route, the channel program, Wiz, Zscaler, and other surrounding platforms. These

    dependencies help Oasis reach customers and integrate into enterprise security workflows, but they also mean

    platform stability, distribution leverage, and even some buyer trust are partially borrowed from partners.

    Customer risk is similarly double-edged. Large regulated enterprises can be sticky once won, yet they are slow

    to procure, expensive to support, and often concentrated. Public materials suggest Fortune-500-oriented

    traction and meaningful customer outcomes, but they still do not quantify retention, concentration, or

    partner-attributed ARR. That missing visibility matters because it becomes much harder to tell whether large

    logos represent a durable base or a small set of demanding accounts with outsized leverage. Financial-model

    risk is therefore mostly an information risk today. The March 2026 Series B reduced immediate funding anxiety,

    and multi-year-agreement language is helpful, but burn, runway, and concentration remain undisclosed. Finro’s

    warning about valuation-compression risk under weak public comps is a useful reminder that great category

    narratives do not eliminate financing discipline.'
  claimRefs:
  - CR026
  - CR027
  - CR028
  - CR030
  - CR031
  - CR038
  - CR040
