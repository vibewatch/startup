- id: integration-ecosystem-and-operator-workflow
  title: Integration Ecosystem and Operator Workflow
  body: 'Oasis’s operator workflow depends heavily on integrations rather than on a closed-stack assumption. The Wiz

    integration enriches Oasis with issues and data-security posture findings so identity actions can be

    prioritized by blast radius. The Zscaler partnership pairs identity governance with inline enforcement for

    machine-to-machine and agentic traffic. The Cursor partnership shows how the model extends up-stack into the

    agentic IDE, where agents run commands, call MCP tools, and interact with internal systems. Finally, the

    CrowdStrike marketplace motion and AI Access Partnership Program show that Oasis wants to be embedded inside

    broader enterprise AI and security buying journeys, not merely sold as a standalone dashboard. This ecosystem

    posture is strategically important. It allows Oasis to capture context from cloud exposure platforms,

    influence execution in zero-trust enforcement layers, and plug directly into developer and AI-agent workflows.

    That breadth may expand distribution and stickiness, but it also means the product’s value is partly dependent

    on maintaining interoperability across third-party systems whose own APIs and product strategies will evolve.

    In technical terms, Oasis appears to be building the identity-governance layer that normalizes signals from

    many systems and turns them into bounded, auditable access decisions.'
  claimRefs:
  - CE009
  - CE010
  - CE019
  - CE020
  - CE021
  - CE033
  - CE034
