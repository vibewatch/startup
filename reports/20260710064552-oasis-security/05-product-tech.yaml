  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: benchmarks
    missingEvidence: Public materials do not disclose benchmarked accuracy, efficacy, throughput, or false-positive rates for AAM, posture analytics, or secret-rotation automation.
    whyItMatters: Buyers cannot objectively compare technical performance against adjacent identity and secrets products without benchmark evidence.
    diligencePath: Request internal benchmarks, customer deployment metrics, and third-party evaluations for detection quality and automation success.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: medium
    topic: certifications
    missingEvidence: Public product pages describe compliance outcomes but do not expose downloadable audit artifacts or formal certifications for scope verification.
    whyItMatters: Enterprise diligence needs proof of control scope, especially when product claims are tied to regulated workloads.
    diligencePath: Request SOC 2 / ISO reports, penetration-test summaries, and control-scope documentation.
    relatedQuestionRefs:
    - QE013
    - QE023
  - type: private-evidence-only
    severity: medium
    topic: architecture
    missingEvidence: The public record explains the control-plane pattern and Outpost concept but does not document deep architecture, scale limits, or multi-tenant boundary design in detail.
    whyItMatters: Architecture depth matters for scalability, isolation, and competitive differentiation.
    diligencePath: Request architecture review materials, data-flow diagrams, tenancy model, and scaling SLOs.
    relatedQuestionRefs:
    - QE005
    - QE016
  - type: private-evidence-only
    severity: medium
    topic: developer-signal
    missingEvidence: Oasis has recruiting and engineering-writing signals but no obvious public code, SDK, or package ecosystem surfaced in this chapter.
    whyItMatters: Developer adoption and implementation ergonomics can materially influence platform stickiness.
    diligencePath: Request API docs, SDK roadmap, public package metrics, and implementation references.
    relatedQuestionRefs:
    - QE021
    - QE022
  - type: private-evidence-only
    severity: medium
    topic: roadmap
    missingEvidence: Public releases show product direction but not precise GA dates, deprecations, or module-by-module maturity commitments.
    whyItMatters: Roadmap certainty affects enterprise rollout planning and competitive timing.
    diligencePath: Request product roadmap with launch stages, dependencies, and customer adoption status by module.
    relatedQuestionRefs:
    - QE018
    - QE025
