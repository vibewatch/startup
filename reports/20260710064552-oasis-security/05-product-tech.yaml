  figureRefs:
  - FE004
- id: trust-standards-and-technical-maturity
  title: Trust, Standards, and Technical Maturity
  body: 'Oasis’s trust story has three pillars: auditability, standards alignment, and technical credibility.

    Auditability comes from the AAM claim that each agent action is logged from prompt to action through a chain-

    of-custody record. Standards alignment comes from the AAM Framework launch and the broader NIST AI Agent

    Standards Initiative, which together show that the company is trying to anchor its narrative in a maturing

    external governance conversation rather than in product marketing alone. Technical credibility is reinforced

    by the OpenClaw disclosure, where Oasis researchers publicly detailed an agent-takeover chain and said the

    upstream team shipped a fix within 24 hours. At the same time, the standards environment is still early.

    NIST’s initiative is oriented around secure interoperability and open protocols, not a mature checklist buyers

    can simply adopt today. That creates an opening for Oasis to shape best practices, but it also means many of

    its governance claims are ahead of stable third-party certification norms. Public materials further highlight

    developer-signal through recruiting and engineering culture, yet they do not surface the kind of deep public

    API or package ecosystem that would make technical adoption easy to independently inspect. So the current

    technical-maturity signal is strong on narrative coherence and growing ecosystem relevance, but lighter on

    public benchmarks and open implementation proof.'
  claimRefs:
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE032
  tableRefs:
  - TE004
  figureRefs: []
- id: roadmap-and-product-risks
  title: Roadmap Direction and Product Risks
  body: 'The public roadmap is visible in the release chronology even without a formal product roadmap file. Oasis

    began with NHI lifecycle management, then added more explicit provisioning and governance workflows, and by

    late 2025 to mid-2026 had clearly pivoted into agentic access management, ecosystem partnerships, and a

    practitioner-built governance framework. That is a credible expansion path because AI agents inherit the same

    underlying identity problems as service accounts and workload identities, only with higher autonomy and faster

    decision loops. The main technical risks are equally clear. First, the company is making high-value claims

    about intent analysis, policy enforcement, and lifecycle automation without publicly released benchmark data,

    throughput metrics, or efficacy comparisons. Second, the architecture depends on continued cooperation from

    cloud, vault, IDE, and security-platform partners. Third, developer-signal is present mostly through

    recruiting and thought leadership rather than a visible open-source or SDK footprint. None of these risks

    breaks the product thesis, but they do mean that buyer diligence should move quickly from “the story sounds

    right” to “show the implementation detail, deployment evidence, and performance data.”'
  claimRefs:
  - CE029
  - CE030
  - CE031
  - CE032
  - CE033
  - CE034
  - CE035
