- id: architecture-and-deployment-model
  title: Architecture and Deployment Model
  body: 'The public architecture pattern is that of a governance control plane layered across heterogeneous identity

    environments. Oasis documents provisioning workflows that can start in Terraform, ServiceNow, a generic API

    trigger, or the Oasis UI. It also supports both credential-based and federated identities, which matters

    because it allows buyers to choose between directly managed secrets and trust-based access patterns such as

    managed identities, IAM roles, and OIDC. This is not the footprint of a narrow secrets vault; it is a product

    trying to sit above multiple identity primitives and orchestrate lifecycle controls around them. Oasis Outpost

    is the most important architectural clue. Outpost is described as a collector container that lives inside the

    customer’s cloud perimeter so that privileged identity operations, secret generation, and secret storage stay

    local. Oasis itself exchanges control messages and metadata rather than becoming a backdoor into the customer

    environment. That design supports enterprise acceptance because it reduces the trust leap customers must take

    when automating sensitive machine credentials. It also suggests Oasis is optimizing for governance and

    orchestration rather than for owning every enforcement point directly. The case study in financial services

    adds practical deployment evidence. Oasis describes rapid Azure AD integration, auto-discovery, posture

    analysis, stale-account cleanup, and automated identity rotation. Even though the case study is company-

    authored, it demonstrates that the product is meant to be installed into live enterprise identity estates

    rather than offered as a conceptual roadmap-only platform.'
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE011
  - CE012
  - CE013
  - CE014
  - CE018
  - CE035
