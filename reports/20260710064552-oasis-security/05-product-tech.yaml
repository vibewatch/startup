    - Brings in Wiz, Zscaler, Cursor, marketplaces, and other ecosystems
    - Partner products and commercial relationships
    - Strategic dependence on partner roadmaps
  notes: This table reflects the operating pattern publicly described across Oasis pages and ecosystem announcements.
