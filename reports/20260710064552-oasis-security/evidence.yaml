evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: >-
      A current board roster, committee structure, and formal governance map beyond founder roles and the president
      hire.
    whyItMatters: Governance maturity matters for a company selling critical infrastructure controls into Fortune 500 buyers.
    diligencePath: Request the current board list, observer rights, and governance package in management diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Exact ARR dollars, revenue mix, gross margin, and audited financial statements remain undisclosed.
    whyItMatters: >-
      Valuation discipline and sales-efficiency analysis both require real financial outputs, not only growth
      percentages.
    diligencePath: Request board materials or audited management accounts covering FY2024, FY2025, and current run-rate.
    relatedQuestionRefs:
      - QO012
      - QO014
  - type: missing-source
    severity: minor
    topic: customer-count
    missingEvidence: >-
      A precise customer count or sector breakdown is not public; only named logos, one Gartner review, and Fortune 500
      mix statements are available.
    whyItMatters: Concentration and deployment-breadth risk cannot be assessed from a vague “dozens” descriptor.
    diligencePath: Ask management for live customer count, top-10 concentration, and deployment status by vertical.
    relatedQuestionRefs:
      - QO009
      - QO013
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      The July 2026 Cyera-talks article implies a potential strategic value near $1 billion while the March 2026 funding
      press and market reports cluster near $700 million post money.
    whyItMatters: Whether Oasis can sustain a premium strategic valuation materially changes downside and exit math.
    diligencePath: >-
      Request the latest 409A, board-approved fair value, and any signed exclusivity or term-sheet status tied to
      strategic options.
    relatedQuestionRefs:
      - QO007
      - QO020
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-som-isolation
    missingEvidence: >-
      Public sources do not isolate a bottom-up SAM or SOM specifically for agentic access governance or AI-agent
      runtime control.
    whyItMatters: >-
      Without a clean subsegment boundary, valuation arguments can overstate Oasis's directly serviceable market by
      borrowing broad IAM or NHI numbers.
    diligencePath: Ask management for internal TAM/SAM/SOM logic, attach-rate assumptions, and top-down/bottom-up reconciliation.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      No reviewed source quantifies what share of spend comes from IAM, cloud security, platform engineering, or
      compliance budgets.
    whyItMatters: Split budget ownership can slow deals and depress win rates even in a fast-growing market.
    diligencePath: Interview buyers or partners on who signs the budget, what line item is displaced, and average procurement cycle.
    relatedQuestionRefs:
      - QM022
      - QM026
  - type: conflicting-data
    severity: minor
    topic: market-estimates
    missingEvidence: >-
      Published market numbers mix a narrow NHI-security lens with a broader NHI-access-management lens and do not use
      common forecast horizons.
    whyItMatters: A single headline TAM would hide boundary differences and create false precision.
    diligencePath: Preserve multiple lenses and ask management to specify the segment they actually target first.
    relatedQuestionRefs:
      - QM004
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: switching-cost
    missingEvidence: >-
      Public sources describe substitutes and integration challenges but do not quantify switching costs or average
      time-to-value.
    whyItMatters: Adoption friction is critical to forecast sales efficiency and market penetration.
    diligencePath: Request win/loss analysis, deployment timelines, and quantified ROI cases from reference customers or partners.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: public-pricing
    missingEvidence: >-
      Comparable public pricing, package boundaries, and discount behavior were not visible across the reviewed
      enterprise pages.
    whyItMatters: >-
      Without pricing transparency, competitive displacement risk and budget fit have to be inferred from features and
      GTM posture rather than direct price benchmarks.
    diligencePath: >-
      Collect RFPs, trial quotes, or partner channel pricing sheets across Oasis, CyberArk, Saviynt, Delinea, Aembit,
      and Entro.
    relatedQuestionRefs:
      - QP011
      - QP025
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      No public source surfaced win/loss rates, average deployment duration, or reliable replacement patterns versus
      each major competitor.
    whyItMatters: Feature comparisons do not reveal whether Oasis actually beats suite incumbents or only complements them.
    diligencePath: Request internal win/loss analysis and interview customers that evaluated multiple vendors.
    relatedQuestionRefs:
      - QP017
      - QP026
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: customer-proof-depth
    missingEvidence: >-
      Public customer proof for Oasis is thinner than its partner and product narrative, limiting direct comparison with
      category incumbents.
