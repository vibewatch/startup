  foundingLocation: "Tel Aviv, Israel"
  headquarters: "Tel Aviv, Israel & New York, USA"
  productSummary: |
    Oasis sells a software platform for discovering, governing, and securing non-human identities and
    AI agents. Core functions include identity inventory, context and ownership mapping, posture and
    anomaly analysis, lifecycle governance, secret rotation, provisioning, and just-in-time / policy-
    driven controls for agentic access.
  customerFocus: |
    Large enterprises—especially regulated or operationally complex organizations in financial
    services, healthcare, manufacturing, logistics, insurance, and AI-platform ecosystems—served
    through direct enterprise sales and partner-assisted procurement routes.
  businessModel: |
    Custom-priced enterprise SaaS sold through negotiated subscription agreements, multi-year
    enterprise contracts, and partner / marketplace routes.
  stage: "Series B"
