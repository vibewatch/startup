- id: funding-history-investors-and-governance
  title: Funding history, investor map, and governance signals
  body: 'Oasis has moved unusually fast through private financing milestones. It emerged publicly in January 2024 with

    a previously closed $35 million Series A and $40 million total funding, then returned in May 2024 with a $35

    million extension that management and press sources said doubled the prior valuation and lifted cumulative

    funding to $75 million. The most important financing event is the March 2026 Series B: Oasis announced $120

    million led by Craft Ventures with existing backers Cyberstarts, Sequoia Capital, and Accel, bringing total

    funding to $195 million. Independent reporting from Globes and Tech Company News places the post-money

    valuation around $700 million, which is materially below the $1.2 billion figure in the user-supplied

    background and therefore the better-supported current value anchor. Governance disclosure remains thinner than

    funding disclosure. Public sources clearly identify the founders and the April 2026 addition of Michael

    DeCesare as president, but they do not surface a full board roster, committee structure, or cap-table detail.

    That makes investor pedigree a strength, but governance transparency an unresolved diligence item.'
