company:
  name: Oasis Security
chapter:
  number: 1
  title: Company Overview
  summary: Oasis Security is a 2022-founded New York / Israel-origin identity-security startup focused on governing non-human identities and AI-agent access, not a generic secrets manager. Public evidence strongly supports its $120 million March 2026 Series B, $195 million total funding, and rapid enterprise adoption narrative, but the best-supported valuation is about $700 million rather than the $1.2 billion figure in the prompt, and key operating metrics remain undisclosed.
sections:
- id: identity-product-and-origin
  title: Identity, product scope, and founding context
  body: 'Oasis Security is best understood as a post-stealth infrastructure-security company selling governance for

    non-human identities rather than a narrow secrets utility. Across its homepage, about page, product page, and

    founding blog, the company describes a platform that discovers machine identities, maps ownership and usage

    context, and orchestrates lifecycle controls such as monitoring, certification, remediation, and

    decommissioning. The product language is deliberately broad: Oasis says it spans IaaS, SaaS, PaaS, and on-prem

    environments and names endpoints as diverse as AWS, Azure, BigQuery, GitHub, ChatGPT, Salesforce, Office 365,

    and Copilot. That breadth matters because it implies the company wants to sit above fragmented vaults and

    point tools as an identity-governance layer. The official origin story also gives Oasis a distinct narrative:

    Danny Brickman says the company began in a modest room in Tel Aviv with teammates from Israeli cyber

    operations, while independent reporting identifies Brickman and Amit Zimerman as the founding pair. The result

    is a company with visibly Israeli technical roots but a commercial narrative now anchored in U.S. enterprise

    identity security.'
