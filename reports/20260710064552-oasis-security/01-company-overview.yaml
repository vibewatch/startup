- id: milestones-disclosure-gaps-and-adverse-context
  title: Milestones, disclosure gaps, and adverse context
  body: 'The milestone record from public sources is coherent enough to support an overview chapter, but it still

    leaves obvious gaps. The company moved from a stealth exit in January 2024 to a Series A extension in May

    2024, formal channel-program launch in April 2025, Series B in March 2026, and executive expansion in April

    2026. Those are the milestones of a company trying to turn an early product wedge into a scaled enterprise

    platform. The missing pieces are just as important. No reviewed source published a precise customer count,

    exact ARR dollars, board roster, or audited financials. Even the most discussed valuation figure is only a

    market estimate, not a disclosed board-sanctioned number. The clearest adverse-context item is a July 2026

    Globes report that Cyera was in advanced talks to acquire Oasis for up to $1 billion, but without a formal

    announcement. That does not disprove the $700 million financing benchmark; it does indicate that strategic-

    option narratives around Oasis were already shifting by the run date. Investors should therefore treat the

    company as well-funded and clearly relevant, but still materially under-disclosed on the metrics that would

    let later chapters underwrite a price-sensitive view.'
