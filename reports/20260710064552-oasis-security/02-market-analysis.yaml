  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-som-isolation
    missingEvidence: Public sources do not isolate a bottom-up SAM or SOM specifically for agentic access governance or AI-agent runtime control.
    whyItMatters: Without a clean subsegment boundary, valuation arguments can overstate Oasis's directly serviceable market by borrowing broad IAM or NHI numbers.
    diligencePath: Ask management for internal TAM/SAM/SOM logic, attach-rate assumptions, and top-down/bottom-up reconciliation.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: No reviewed source quantifies what share of spend comes from IAM, cloud security, platform engineering, or compliance budgets.
    whyItMatters: Split budget ownership can slow deals and depress win rates even in a fast-growing market.
    diligencePath: Interview buyers or partners on who signs the budget, what line item is displaced, and average procurement cycle.
    relatedQuestionRefs:
    - QM022
    - QM026
  - type: conflicting-data
    severity: minor
    topic: market-estimates
    missingEvidence: Published market numbers mix a narrow NHI-security lens with a broader NHI-access-management lens and do not use common forecast horizons.
    whyItMatters: A single headline TAM would hide boundary differences and create false precision.
    diligencePath: Preserve multiple lenses and ask management to specify the segment they actually target first.
    relatedQuestionRefs:
    - QM004
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
