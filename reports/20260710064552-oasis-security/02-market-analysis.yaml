  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Machine identities rising from 82:1 to 109:1
    - Driver
    - Current
    - Problem volume is compounding faster than human IAM headcount can respond
    - Ask buyers how many service identities they inventory today and how fast the count is growing
  - - 99% AI-agent adoption with 40% already touching organizational data
    - Driver
