    - Validate whether access governance is now part of AI rollout checkpoints
  - - Zero trust, open protocols, and emerging standards work
    - Driver
    - Near-term
    - Standards activity legitimizes the category and expands budget conversations
    - Check whether standards help or delay enterprise buying criteria
  - - Secrets sprawl and long-lived valid credentials
    - Driver
