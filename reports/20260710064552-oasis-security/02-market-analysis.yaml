chapter:
  number: 2
  title: Market Analysis
  summary: Oasis is selling into a genuinely fast-growing but still boundary-fluid market where NHI security and broader NHI access management overlap. Public sources support a 2026 category size somewhere between roughly $8.2 billion and $12.2 billion, machine-identity growth that has already reached 109-to-1 versus humans, and buyer urgency driven by AI agents, secrets sprawl, and compliance—but they do not support a precise public SAM or SOM for agentic access governance.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and status-quo substitutes
  body: 'The fastest way to misunderstand Oasis''s market is to treat it as a rebranded secrets manager. Public sources

    instead define a broader problem set: NHIs now include application and service identities, API and OAuth

    tokens, machine and device identities, cryptographic identities, bots, workloads, and increasingly AI agents.

    That means the relevant spend boundary includes discovery, posture, ownership assignment, lifecycle

    governance, and runtime authorization for automated actors. It also means the status quo is fragmented. Some

    buyers try to solve parts of the problem with vaults or identity stores such as HashiCorp Vault; others lean

    on cloud-native IAM, SPIFFE-style workload identity, or manual CMDB ownership processes. Those substitutes can

    address credential issuance or low-level workload identity, but they do not by themselves create enterprise-

    wide governance over every machine identity and delegated AI action. The NHI market is therefore best viewed

    as a convergence layer sitting between traditional IAM/PAM, secrets management, platform engineering, and AI-

    governance workflows.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM021
  - CM023
  - CM027
  - CM028
  tableRefs:
  - TM001
- id: sizing-lenses-and-regional-shape
  title: Sizing lenses, identity segmentation, and regional shape
  body: 'Public market sizing for NHI governance is directionally strong but not numerically clean. Mordor Intelligence

    sizes the narrower NHI security segment at $8.22 billion in 2026 and $22.94 billion by 2031, while Research

    and Markets and its Yahoo Finance distribution partner place the broader NHI access-management category at

    $12.2 billion in 2026 and $38.8 billion by 2036. The spread is not noise; it reflects different boundaries.

    The broader estimate includes solution and services layers across identity types, deployment modes,

    organization sizes, and verticals, while the narrower estimate is closer to the security-control subset.

    Regional shape is clearer than precise SAM: North America currently leads, Asia-Pacific is forecast to grow

    fastest, and large enterprises dominate present demand. Identity-type segmentation is also explicit in the

    broader forecast: application and service identities, API and OAuth token identities, machine and device

    identities, cryptographic identities, and AI-agent identities are already first-class subsegments. The correct

    takeaway is that the market is real, large, and expanding quickly, but a clean Oasis-specific SOM is not

    public.'
