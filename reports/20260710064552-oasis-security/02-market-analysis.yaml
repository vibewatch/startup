callouts:
- calloutType: insight
  title: The market is real, but its numeric boundaries are still fluid
  body: The public evidence strongly supports a fast-growing NHI governance category, yet the published dollar figures come from overlapping but non-identical boundaries. The right interpretation is not “pick one TAM,” but “use multiple bounded lenses and ask management which slice it actually plans to win first.”
  claimRefs:
  - CM004
  - CM006
  - CM007
  - CM037
- calloutType: risk
  title: Adoption urgency is high, but controls and ownership are immature
  body: 'NIST, CSA, OWASP-style maturity work, and shadow-AI commentary all point in the same direction: enterprises are deploying AI agents and machine identities faster than they can govern them. That creates demand, but it also means vendor ROI often depends on fixing ownership, tooling fragmentation, and procurement complexity inside the buyer.'
  claimRefs:
  - CM017
  - CM018
  - CM019
  - CM020
  - CM036
