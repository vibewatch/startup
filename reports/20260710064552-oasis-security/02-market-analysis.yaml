  - - Fragmented tooling and substitute incumbents
    - Constraint
    - Current
    - Vaults, cloud IAM, and workload identity tools can delay a dedicated platform purchase
    - Identify what incumbent budget or tool Oasis-like products actually displace
  notes: Rows intentionally mix positive demand drivers and negative adoption frictions because the market is expanding quickly but not frictionlessly.
