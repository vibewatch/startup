      - number: '6.2'
        title: 具名客户证据与案例研究深度
        blocks:
          - type: paragraph
            body: >-
              最丰富的公开客户证据大多由公司撰写，但并非空洞营销话术。Oasis 在多个行业展示了详细部署叙事。金融服务中的一家私人信贷公司被描述为在 Azure AD 中使用 Oasis
              做可见性、定制安全策略、陈旧账户清理和自动身份轮换。医疗服务提供商案例研究的数据更丰富：据称该环境有 8,500 个人类身份、超过 100,000 个 NHI、超过 50,000 张证书、约 10,000
              个服务账户，由 18 人安全团队和约 50 人 IT 运营团队管理。一场工业公司网络研讨会又补充了 Azure 修复和合规叙事。两个具名公开参考尤其突出。Mars 出现在 2026 年 4
              月一份专门案例研究资源中，主题是高度碎片化云身份可见性。Antares 出现在金融服务白皮书中，被描述为借助 Oasis
              简化生命周期管理并减少手工工作。这些具名参考比匿名垂直案例更接近采购级证据，尽管仍缺少合同细节、部署时长或扩张历史。相比之下，Bank of America
              账户页面应被视为基于账户的营销，而不是真实部署证据。核心尽调结论是：Oasis 有真实用例深度，也至少有一些具名公开证据，但公开证据分布仍不均衡。具名客户证据存在，可许多最能说明运营细节的案例研究仍然匿名。
