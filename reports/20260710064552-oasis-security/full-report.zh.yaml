      - number: '6.4'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开记录只有一个直接的持续性信号：Newswire 称，大多数新增 ARR
              来自多年期企业协议。这是有用线索，因为多年合同通常意味着一定黏性和客户承诺。案例研究也描述了持续治理工作，而不是一次性评估，支持了经常性使用的理解。但公开证据到此为止。没有
              NRR、GRR、流失、队列、续约率或合同期限分布，也没有公开客户数，无法把具名证据转成可信的渗透率或集中度模型。集中度风险是尚未解决的最大客户问题。如果 Oasis 确实服务几十家 Fortune 500
              公司，但总客户数仍处早期，少数超大账户就可能重度左右收入。公开记录也没有披露有多少业务来自 GuidePoint、CrowdStrike Marketplace、Wiz
              驱动的工作流或更广泛的伙伴渠道。这些路径显然对获客和采购入口很重要，但若使用过度，也可能集中议价权，或扭曲部署归属。正确尽调姿态是谨慎乐观。Oasis
              的公开客户证据在工作流相关性和部署轶事上很强，但留存数学和集中度可见度偏弱。这意味着没有内部队列和分层数据，客户质量还无法充分承销。
