      - number: '2.4'
        title: 增长驱动、采用约束与标准缺口
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动很简单：机器身份和 AI 智能体的扩散速度，已经超过人类 IAM 系统原本能承载的范围。Palo Alto 称机器与人类身份比例在 2026 年达到 109:1，并且仍在上升；Axis
              Intelligence 同时强调密钥蔓延和长期凭据暴露。在此之上，NIST 已启动 AI Agent Standards
              Initiative，市场供应商也把它转译成围绕开放协议、最小权限和治理的产品叙事。但同一批来源也说明，市场转化不会一路顺滑。OWASP 式成熟度工作显示采用与保护之间缺口很大；Cloud Security
              Alliance 称可执行控制尚不存在；ITECS 认为影子 AI 已经跑在可见性前面；Delinea 警告 AI
              智能体往往带有持久且权限很宽的访问。实际采购中，紧迫性和合规把买家向前拉，碎片化工具、不清晰的归属和替换既有密钥库或云 IAM
              模式的运营负担又把他们拖住。这个组合支撑的是一个高速增长但摩擦真实的市场，而不是直线式抢地盘。
