      - number: '5.5'
        title: 路线图方向与产品风险
        blocks:
          - type: paragraph
            body: >-
              即便没有正式产品路线图文件，公开发布节奏也能看出路线图。Oasis 从 NHI 生命周期管理起步，随后加入更明确的配置开通和治理工作流；到 2025 年末至 2026
              年中，它已经明显转向智能体访问管理、生态合作伙伴关系，以及由从业者构建的治理框架。这是一条可信的扩张路径，因为 AI
              智能体继承了服务账户和工作负载身份的底层身份问题，只是自主性更高、决策回路更快。主要技术风险也同样清晰。第一，公司围绕意图分析、策略执行和生命周期自动化提出高价值主张，但没有公开发布基准数据、吞吐指标或效果对比。第二，架构依赖云、密钥库、IDE
              和安全平台合作伙伴持续配合。第三，开发者信号主要来自招聘和观点输出，而不是可见的开源或 SDK 足迹。这些风险都不会打破产品逻辑，但意味着买家尽调应迅速从“故事听起来对”转向“拿出实现细节、部署证据和性能数据”。
