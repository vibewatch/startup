  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Oasis 不再把自己只呈现为非人类身份盘点供应商。公开产品故事现在有两个相连层。第一层是传统 NHI 管理平台，覆盖服务账户、应用、角色、密钥和其他机器身份的治理、态势与密钥轮换。第二层是 Agentic
              Access Management，把这些控制扩展到能够在企业系统中推理和行动的 AI
              智能体。核心产品承诺不只是“发现身份”，而是通过配置开通、归属、审批、策略执行、轮换和下线，把每一个机器或智能体动作转化为受治理的身份工作流。这个模块图谱在年轻品类中罕见地连贯。Oasis
              的治理页面集中在安全配置开通、归属分配、权限控制、轮换、认证和下线。态势管理页面增加了针对攻陷尝试、有毒组合、策略违规和异常的分析。密钥轮换页面再把这些洞察转成运营动作：发现、观察、策略管理、安全轮换和生命周期清理。面向
              AI 智能体，AAM 增加了意图分析、短期会话身份，以及把提示词连接到动作的责任链日志。合在一起看，Oasis 正在搭一套控制平面，回答谁或什么可以行动、为什么可以行动、访问能持续多久，以及事后如何审计动作。
