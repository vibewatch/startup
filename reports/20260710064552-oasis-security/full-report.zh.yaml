  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 质量不及预期
        - 管理层无法证明 ARR 增长、留存或毛利率足够强
        - 高溢价品类估值逻辑立即削弱
        - 下调估值或退出
      - - 战略兴趣消失
        - Cyera 式兴趣最后只是幻象，买方胃口不再
        - 乐观情景天花板下移
        - 只锚定基准 / 悲观情景
      - - 伙伴集中度上升
        - 单一路径或伙伴主导管线 / ARR
        - 分销可选性变成依赖风险
        - 施加集中度折价
      - - 公开证明滞后
        - 外部验证或客户指标没有实质改善
        - 信任和尽调负担仍然过高
        - 将建议维持在继续研究
      - - 可比公司倍数再次压缩
        - 公开 IAM 和网络安全倍数明显回落
        - 叙事溢价收窄
        - 收紧入场纪律和下行区间
    notes: 这些是否决标准，和估值绑定、对价格敏感，不是通用产品问题。
