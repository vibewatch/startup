  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              误读 Oasis 市场最快的方式，就是把它当作换了包装的密钥管理器。公开来源定义的其实是更宽的问题集：如今的 NHI 包括应用和服务身份、API 与 OAuth
              令牌、机器和设备身份、加密身份、机器人、工作负载，以及越来越多的 AI 智能体。这意味着相关支出边界包括发现、态势、归属分配、生命周期治理，以及自动化行动主体的运行时授权。现状也因此高度碎片化。一些买家尝试用
              HashiCorp Vault 等密钥库或身份存储解决部分问题；另一些买家依赖云原生 IAM、SPIFFE 式工作负载身份，或手工 CMDB
              归属流程。这些替代方案能处理凭据签发或底层工作负载身份，却无法单独在企业范围内覆盖每一个机器身份和被委托的 AI 动作。NHI 市场因此更像一层汇聚层，夹在传统 IAM/PAM、密钥管理、平台工程和 AI
              治理工作流之间。
