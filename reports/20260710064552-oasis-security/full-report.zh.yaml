  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Oasis 的公开乐观逻辑很有说服力。随着 AI 智能体和非人身份在企业系统中扩散，公司所在品类的重要性快速上升。Oasis 有可见的 Series
              B、知名投资人、面向企业的客户引用，以及一个产品叙事：成为智能体企业的访问治理层。战略稀缺性真实存在：同品类公司正在获得融资，大型安全厂商正在整合相邻机器身份资产，行业研究也已把非人身份和 AI
              智能体身份视为一阶安全控制问题。反向逻辑同样重要。Oasis
              尚未公开披露支撑溢价估值所需的运营指标。ARR、毛利率、留存、烧钱速度和集中度都缺失。因此，公开品类热度不能直接转化为承销信心。投资人可以相信问题真实存在，同时仍得出结论：价格还无法足够精确地判断。这种张力很重要，因为这里的估值对叙事很敏感。如果增长质量确如公司和记者暗示那样强，Oasis
              也许确实配得上溢价标记。但在分母披露之前，公开文件最好被解读为战略上有前景，而不是估值上已经完整。
            claimRefs:
