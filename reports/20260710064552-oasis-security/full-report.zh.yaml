  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Oasis 证明 ARR 质量强，守住高溢价品类定位，战略买方兴趣也落成事实
        - $900M-$1.0B+ 区间因战略稀缺性或高溢价收入倍数支撑而变得可信
        - 披露缺口闭合太慢；传闻没有落成现实
        - 可能成立，但需要新证据
      - - 基准
        - 最新公开标记估值仍是最佳锚点，品类动能延续且没有重大负面意外
        - ~$700M 仍是公允参考，直到更新指标出现
        - 投资判断仍不完整
        - 当前最站得住脚的情景
      - - 悲观
        - 公开可比公司纪律收紧，Oasis 无法证明 ARR、留存或集中度质量值得溢价
        - 若溢价叙事削弱，下行区间为 $450M-$550M
        - 估值压缩以及伙伴 / 买方摩擦
        - 若披露继续偏薄，则有可能
      - - 观望持有
        - 投资人保持跟进但没有定价确信度
        - 披露 ARR、NRR 和利润率前不行动
        - 若动能加速，会有机会成本
        - 近期合理姿态
      - - 战略收购
        - M&A 进程或战略稀缺性推高溢价，高于最近一轮
        - 更多取决于买方协同，而非公开可比公司
        - 流程未确认；存在整合和留任风险
        - 可见度低，但可选性真实存在
    notes: 估值区间是基于公开融资和可比公司语境估算的情景锚点，不来自 Oasis 披露的 ARR。
