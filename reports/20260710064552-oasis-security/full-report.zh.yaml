  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险栈概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              Oasis 正在解决真实问题，但所处威胁环境比标准、买方教育和公开证据都跑得更快。外部背景异常严苛。NIST 的 AI Agent Standards Initiative
              仍停留在行业主导协议和差距分析阶段，还不是可执行控制；Cloud Security Alliance 则表示，企业现在已经需要可落地的治理。与此同时，机器身份远多于人类身份，AI
              智能体在快速扩散，多个近期事件也显示，一旦信任边界薄弱，周边工具链会有多脆弱。由此形成了独特风险画像。Oasis
              暴露的主要不是单一灾难性监管禁令，也不是单一硬件依赖。它最大的风险是层层叠加：在标准尚未敲定前先销售，依赖多个合作伙伴生态，在缺少公开基准证据的情况下证明控制质量，并服务要求严苛的受监管买方，他们采购周期长、安全审查负担高。产品逻辑可能是对的，但执行门槛还在上升。对投资人来说，最重要的风险并不抽象，而是可监测：企业安全审查是否缩短，集成是否保持稳定，公开证据是否从研究和叙事走向成熟，管理层能否把品类紧迫感转成可信的大规模部署，同时不被战略噪音分心。
