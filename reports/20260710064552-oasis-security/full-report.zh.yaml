  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 风险或护城河因素
      - 施压方
      - 证据
      - 对 Oasis 的影响
      - 尽调问题
    rows:
      - - 统一生命周期治理叙事
        - 套件型既有厂商
        - Saviynt、Delinea 和 CyberArk 都营销发现加生命周期广度
        - Oasis 必须证明集成深度，而不只是会用品类词汇
        - 要求证明客户是在整合工具，而不是再加一个仪表盘
      - - 运行时访问差异化
        - Aembit / HashiCorp / WorkOS 相邻玩家
        - 短期、无密钥或会话范围访问，是很强的相邻切入点
        - Oasis 不能让运行时访问变成别人的长期控制平面
        - 厘清运行时控制占主导时，Oasis 多常能赢
      - - 分销与平台拉力
        - Cisco、CrowdStrike、Wiz、既有套件厂商
        - Astrix 并入 Cisco；Oasis 展示伙伴入口；套件厂商有存量客户
        - 渠道和生态杠杆可能和功能一样重要
        - 量化来源管道、附加率和经销商影响
      - - 公开证明深度
        - Gartner / 目录显示可见评价量偏薄
        - 一条 Gartner 评价加目录描述，弱于许多企业买方偏好的证明强度
        - 客户背书稀缺可能拖慢后期采购
        - 按垂直行业和部署阶段索取客户背书
      - - 多栖部署 / 叠加式采用
        - Vault、SPIFFE、云 IAM
        - 买方可以保留原语，同时叠加治理层
        - 该品类可能是叠加式，降低替换摩擦，也降低锁定
        - 询问 Oasis 是替代预算，还是只是叠加到预算之上
      - - 整合与商品化
        - Cisco / 套件 / 清单扩展
        - Astrix 整合以及更广的套件功能扩展，压缩独立玩家空间
        - 单靠发现的叙事可能比集成控制平面更快商品化
        - 跟踪 Oasis 能否靠广度和执行挡住捆绑打法
    notes: 这些行聚焦战略耐久性，而非原始产品清单，因为真正的问题是：相邻层整合后，Oasis 能否继续守住控制平面相关性。
