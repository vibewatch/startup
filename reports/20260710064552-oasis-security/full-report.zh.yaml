chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与创立背景
        blocks:
          - type: paragraph
            body: >-
              理解 Oasis
              Security，最好不要把它看成一个狭义的密钥工具，而是一家走出隐身状态后的基础设施安全公司，卖的是非人类身份治理。公司在官网首页、关于页面、产品页和创立博客中，都把平台描述成一套系统：发现机器身份，映射归属和使用上下文，并编排监控、认证、修复、下线等生命周期控制。它的产品语言刻意拉得很宽：Oasis
              称覆盖 IaaS、SaaS、PaaS 和本地部署环境，端点包括 AWS、Azure、BigQuery、GitHub、ChatGPT、Salesforce、Office 365、Copilot
              等。这个宽度很关键，因为它暗示公司想站在碎片化 vault 和点状工具之上，成为身份治理层。官方起源故事也给 Oasis 加了一层独特叙事：Danny Brickman
              称公司起步于特拉维夫一间简陋房间，团队成员来自以色列网络行动；独立报道则将 Brickman 和 Amit Zimerman
              确认为创始组合。结果是一家公司技术根基明显带有以色列色彩，但商业叙事如今锚定美国企业身份安全。
