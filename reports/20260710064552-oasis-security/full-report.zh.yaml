      - number: '8.3'
        title: 可比框架与市场情绪
        blocks:
          - type: paragraph
            body: >-
              正确的可比框架是经常性收入型身份安全，而不是泛服务或基础设施软件。Okta、SailPoint、Rubrik 和 CyberArk 都用订阅收入或 ARR
              讲自己的业务。它们的文件和官方业绩也强化了投资人看重身份平台的经常性收入质量、留存和扩张。这些公司规模大得多，产品范围也不能与 Oasis
              直接相比，但它们确立了这个品类的语言。分析师估值工作提供了第二层。Windsor Drake 的 2026 年 Q2 IAM 报告将主流公开 IAM 定在约 6.0x NTM 收入，同时称非人身份和 AI
              智能体身份平台在私募轮中大致可达到 15x 至 30x。Finro 认为，用成熟公开网络安全可比公司去衡量私人 AI 原生公司，可能严重误导。Multiples.vc 显示，2026
              年更广泛网络安全行情也已明显改善。战略整合强化了这一点：Astrix 出售给 Cisco，以及 CyberArk 围绕 Venafi 的机器身份整合，说明大型平台仍在买入这一控制层。问题在于 Oasis 尚未披露
              ARR。因此，可比集能说明 Oasis 可能成为什么样的公司，却还不能说明 Oasis 今天真正应得什么倍数。
