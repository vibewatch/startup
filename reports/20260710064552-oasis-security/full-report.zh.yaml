      - number: '7.2'
        title: 监管、法律与信任风险
        blocks:
          - type: paragraph
            body: >-
              Oasis 卖进的是合规和信任负担很高的环境，但外部标准层还不成熟。NIST 正围绕安全互操作和开放协议建设智能体 AI 标准，CSA
              则明确认为，企业是在智能体专用控制尚未敲定前就已投入运营。这个错位有风险：Oasis
              可以受益于紧迫感，也可能不得不反复教育买方，并捍卫尚未被标准机构完全成文化的品类假设。公司自己的公开合同栈部分缓解了这一点，也把部分风险推回客户。DPA 引用 GDPR、UK GDPR 和以色列隐私法；SaaS
              协议则要求客户为自身数据的法律依据和权限负责。SLA 承诺 99.9% 可用性，但补救限制为服务积分，且上限为订阅价值的 20%。换句话说，Oasis
              具备基础企业合同文件，但实践中客户仍承担相当合规和宕机风险。法律和监管风险因此不太像 Oasis 眼前会遭执法，更多是信任转化问题。医疗、金融和 AI
              治理买方会期待一套快速升级的证据栈：更清晰的标准对齐、更好的外部验证，以及证明公开法律语言能落到可靠运营控制上的证据。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR033
              - CR034
