      - number: '5.3'
        title: 集成生态与运营者工作流
        blocks:
          - type: paragraph
            body: >-
              Oasis 的运营者工作流高度依赖集成，而不是封闭栈假设。Wiz 集成用问题和数据安全态势发现增强 Oasis，让身份动作可以按爆炸半径排序。Zscaler
              合作把身份治理与机器到机器、智能体流量的内联执行配对。Cursor 合作展示了这个模型如何向上延伸到智能体 IDE：智能体在 IDE 中运行命令、调用 MCP 工具，并与内部系统交互。最后，CrowdStrike
              Marketplace 动作和 AI Access Partnership Program 说明，Oasis 想嵌入更宽的企业 AI 和安全采购旅程，而不是只作为独立仪表盘销售。这种生态姿态在战略上很重要。它让
              Oasis 可以从云暴露平台抓取上下文，在零信任执行层影响执行，并直接插入开发者和 AI 智能体工作流。这个宽度可能扩大分发和粘性，但也意味着产品价值部分依赖于持续维护与第三方系统的互操作性，而这些系统自身的
              API 和产品策略会演进。从技术角度看，Oasis 似乎正在建设身份治理层，把许多系统的信号标准化，并转成有边界、可审计的访问决策。
