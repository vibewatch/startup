      - number: '4.3'
        title: 资本充足性、融资背景与缺失的现金跑道输入
        blocks:
          - type: paragraph
            body: >-
              Oasis 显然有资本继续投入，但公开来源不足以把这个事实转成现金跑道模型。2026 年 3 月 Series B 带来 $120 million；Newswire、Globes 和 SiliconANGLE
              的同期报道都把该轮融资放在企业 AI 智能体和非人类身份造成的安全问题背景下。Globes 还报道了 $195 million 累计融资、市场来源称大约 $700 million 的估值、ARR 增长 5
              倍，以及客户群主要由 Fortune 500 公司组成。即便这些牵引数字来自公司口径而非审计，它们在方向上仍重要：Oasis 不是在无人关注的位置融资。隐藏的部分是资产负债表一侧。本文审阅的公开材料没有披露
              Series B 后账上现金、月度烧钱速度、毛利率或净收入留存率，也没有发现债务工具或授信额度。GuidePoint 的 OASIS+ 定位显示联邦市场进入意图，渠道计划和 Marketplace
              上架页显示合作伙伴动作扩张，但这些都无法转成直销、联邦或合作伙伴主导业务之间的量化收入拆分。正确结论因此是不对称的。相对于公司早期年龄，Oasis
              看起来足以支撑近期产品和市场进入扩张；但证据仍过于不完整，无法有把握地估计剩余现金跑道或下一轮触发点。尽调团队需要月度财务报表、ARR 历史和集中度数据，才能对资本充足性形成强判断。
