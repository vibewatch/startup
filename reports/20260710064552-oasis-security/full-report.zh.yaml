      - number: '4.2'
        title: 交付模型、成本结构与单位经济信号
        blocks:
          - type: paragraph
            body: >-
              Oasis 没有公布单位经济，但公开架构指向了成本基础大致落点。Outpost
              模式把敏感身份操作留在客户边界内，中央平台处理控制逻辑、元数据、生命周期自动化和分析。这个设置说明公司更像软件重模型，边际交付负担应主要来自工程、云分析、客户支持和合作伙伴赋能，而不是硬件、库存或大额营运资本波动。密钥轮换和治理页面进一步支持这个判断，因为它们把风险修复描述为自动化经常性控制，而不是靠人工堆出来的专业服务。本章最强的公开生产证据是金融服务案例研究。Oasis
              描述了一家私人信贷客户中的快速 Azure AD
              部署、自动发现、风险态势分析、陈旧账户清理和自动身份轮换。尽管案例由公司撰写，且没有披露合同价值，它仍然有用，因为它显示平台可以进入合规和凭据卫生有经济价值的受监管客户工作流。金融解决方案页面还把买家场景连接到
              PCI DSS 4.0、SOC 2 和 GDPR 敏感环境，意味着公司瞄准的用例里，预算负责人往往不只关心开发者便利性，也在意风险降低、可审计性和运营韧性。不过，公开记录不足以支撑硬指标判断。没有披露
              ACV、毛利率、获客成本（CAC）、NRR 或服务收入占比。唯一稳妥的结论是定性的：Oasis 的结构看起来有能力取得软件式利润率，但外部还无法衡量支持、服务或渠道折扣在实践中压缩了多少利润率。
