  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、采购路径与合同栈
        blocks:
          - type: paragraph
            body: >-
              最好的公开证据显示，Oasis 卖的是经常性企业软件，不是项目制咨询。它 2025 年 7 月的 SaaS 订阅协议绑定订单，再叠加公开 DPA 和 SLA；AWS Marketplace
              则把买家导向定制私有报价，而不是固定目录价。这个组合是典型企业 SaaS 供应商姿态：逐客户谈判条款，并预期持续服务交付。合同栈还显示，Oasis
              已经进入隐私、正常运行时间和支持承诺很重要的采购环境，这通常与年度或多年期订阅销售相关，而不是一次性工具采购。支撑这个收入模式的产品面足够宽，能支持扩张。Oasis
              不只是盘点非人类身份；它把配置开通、归属分配、认证、轮换、态势管理和下线包装成生命周期能力。配置开通发布在财务上尤其重要，因为它把产品延伸到 Terraform、ServiceNow、通用 API
              等工作流触发器，也延伸到 AWS、Azure、GCP、HashiCorp、CyberArk 和 Azure Key Vault
              等云与密钥库生态。这样一来，收入质量更可能来自平台嵌入，而非孤立点功能采用。不过，定价透明度仍弱。AWS Marketplace
              证实买家可请求私有报价，但没有公开目录价、席位指标或基于资产的分层价目表，外部无法据此推断 ACV。结论是，Oasis
              可以被描述为一家定制报价、企业订阅型软件公司，并由合作伙伴辅助采购；但它实际落地的价格架构尚未公开可见。
