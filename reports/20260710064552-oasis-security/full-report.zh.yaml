      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 和收入质量
        - 当前 ARR、细分结构、NRR / GRR、季度桥接
        - 估值和确信度的核心分母
        - 管理层 / 数据室
      - - 毛利率和烧钱速度
        - 毛利率桥接、COGS 拆分、月度烧钱、现金跑道
        - 用于评估资本充足性和下行风险
        - 财务尽调
      - - 客户集中度
        - 前 10 大客户、伙伴归因、联邦 / 商业拆分
        - 决定耐久性和议价风险
        - 收入运营 / CFO
      - - 股权结构表和优先权
        - 优先权、债务、老股交易、期权池
        - 入场价格不只看表面估值
        - 法务 / 融资尽调
      - - M&A 进程状态
        - 战略兴趣真实性及其对团队 / 客户的影响
        - 避免只凭传闻出价过高
        - 董事会 / 管理层讨论
      - - 可背书证明
        - 具名客户、扩张案例、部署成熟度
        - 将叙事溢价转成可信证明
        - 客户尽调 / 访谈
    notes: 缺少这些索取项，估值判断就无法越过继续研究。
