      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最可靠的公开价格锚是 2026 年 3 月融资。Newswire、Globes、SiliconANGLE、Access Newswire 和 TechCompanyNews 都支持 $120 million
              Series B。Globes 补充了最有用的估值细节：据报道，市场消息人士认为 Oasis 价值约 $700 million，累计融资达到 $195 million。这就是公开融资记录中的价格标记。2026 年
              7 月出现了第二个但更弱的估值信号：Globes 报道称，Oasis 正就以最高 $1 billion 出售给 Cyera
              进行深入谈判，主要为现金，另有少量股票。投资人不应把这当成已成交的市场标记。更好的解读是，大型安全玩家或私人平台可能认为 Oasis
              有战略相关性。传闻提高了上行可选性，但也带来过度解读未确认流程的风险。因此入场纪律仍应收紧。上一轮约 $700 million 的融资标记可信。接近 $1 billion
              的传闻战略上限值得关注。但没有股权结构、优先权或单位经济披露时，有纪律的投资人不应默认按高情景承销。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV026
              - CV027
              - CV031
              - CV037
