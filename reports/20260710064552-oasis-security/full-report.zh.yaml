      - number: '7.5'
        title: 缓释措施、监测项与否决条件
        blocks:
          - type: paragraph
            body: >-
              Oasis 风险栈令人鼓舞的一点是，大部分风险可以较早验证。几个最高风险并非二元不可知。管理层可以拿出证据，证明企业安全审查在提速、客户留存健康、伙伴集中度适中、公开证据在扩展、漏洞响应纪律严格。如果 Oasis
              能推动这些指标，风险论证会实质性削弱，因为公司的市场相关性已经可信。否决条件同样具体。如果公开事件持续显示生态脆弱，而 Oasis
              拿不出控制有效性的基准证据，买方信任可能停滞。如果伙伴依赖上升却没有备选方案，分销韧性会变弱。如果潜在 M&A
              的战略噪音开始分散团队或客户注意力，执行风险会上升。如果估值预期上行时财务披露仍然很薄，投资人应假设模型风险只是被带到下一轮，而不是已经解决。简言之，Oasis
              的风险画像最好理解为可管理但前置。公司必须在周围智能体访问威胁面扩张之前，更快证明纪律、信任和韧性。
            claimRefs:
              - CR029
              - CR032
              - CR037
              - CR038
              - CR039
              - CR042
