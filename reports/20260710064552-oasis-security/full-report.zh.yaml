      - number: '7.3'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >-
              文件里最强的证据是，底层问题空间确实危险。Oasis 自己的研究和事件分析记录了一连串智能体和 NHI 失败案例：OpenClaw 可被访问过的网站接管、Claude 提示注入导致数据外泄、Claude Tag
              中共享智能体身份边界模糊、Cline 的 localhost 劫持、Cursor 静默打开文件夹即执行、VS Code MCP 一键妥协、恶意 MCP 包外泄、McHire 弱默认凭证失败，以及 Change
              Healthcare、Cloudflare 和 Cisco 这些较早但仍高度相关的入侵事件。合在一起看，这些不是边缘个案。它们显示，AI 和机器身份系统的访问边界反复失守。这种模式既是 Oasis
              的商业机会，也是产品风险。如果买方认定智能体系统太不安全，无法大范围部署，需求可能暂停。如果买方激进部署，负担又会转向 Oasis 这样的供应商：必须证明其控制确实能降风险。来自
              OWASP、CyberArk、Palo Alto、Delinea 等来源的外部威胁摘要也强化了同一点：治理缺口、过度授权、下线流程薄弱、密钥泄露和不成熟的 AI 控制都很常见。公开证据尚未显示 Oasis
              发布足以一锤定音回应这一挑战的第三方效能基准。运营上，由于客户侧执行和本地控制边界很重要，这种部署模型比纯中心化托管更安全。但这也意味着，实施质量、连接器韧性和客户自身运营成熟度都会进入产品风险方程，不是
              Oasis 可以完全抽象掉的东西。
