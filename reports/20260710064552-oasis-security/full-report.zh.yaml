      - number: '7.4'
        title: 合作伙伴、客户与模型风险
        blocks:
          - type: paragraph
            body: >-
              Oasis 的 GTM 路径既是护城河的一部分，也是风险栈的一部分。AI Access Partnership Program 公开向买方和伙伴推介：可绕过漫长安全审查。公开生态还覆盖 GuidePoint 的
              OASIS+ 路径、渠道计划、Wiz、Zscaler 及其他周边平台。这些依赖帮助 Oasis
              接触客户、嵌入企业安全工作流，但也意味着平台稳定性、分销杠杆，甚至部分买方信任，都是从伙伴那里借来的。客户风险也有两面。大型受监管企业一旦拿下就可能黏性强，但采购慢、支持成本高，且常常集中。公开材料显示其牵引力面向
              Fortune 500，客户成果有分量，但仍未量化留存、集中度或伙伴归因
              ARR。缺少这些可见度很重要，因为此时很难判断大型标识代表的是耐久客户基础，还是少数要求很高且杠杆过大的账户。财务模型风险今天主要是信息风险。2026 年 3 月 Series B
              降低了眼前融资焦虑，多年协议措辞也有帮助，但烧钱速度、现金跑道和集中度仍未披露。Finro 关于公开可比对象薄弱会带来估值压缩风险的提醒很有用：再好的品类叙事也不能替代融资纪律。
