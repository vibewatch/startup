companyProfile:
  summary: >
    Oasis Security 是一家与纽约和以色列均有连接的网络安全公司，切入现代企业基础设施里最重要的身份变化之一：非人类身份和 AI
    智能体的上升。它的平台把发现、归属映射、态势管理、密钥轮换、配置开通和智能体访问控制放在一起，帮助企业在云、SaaS、本地部署和开发者工具环境中治理机器身份与 AI 智能体。Danny Brickman 和 Amit
    Zimerman 于 2022 年创立 Oasis，公司很快从隐身状态走到 $120M Series B，讲出了以 Fortune 500 为主的客户故事，并把定位从 NHI
    生命周期管理扩展到更宽的智能体访问治理。战略叙事很强，但公司仍是私人公司，财务指标披露明显不足，投资人还无法有把握地验证隐含估值。
