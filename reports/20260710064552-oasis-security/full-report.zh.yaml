      - number: '5.2'
        title: 架构与部署模型
        blocks:
          - type: paragraph
            body: >-
              公开架构模式是一套治理控制平面，覆盖异构身份环境。Oasis 记录的配置开通工作流可以从 Terraform、ServiceNow、通用 API 触发器或 Oasis UI
              启动。它同时支持基于凭据和联合身份，这一点很重要，因为买家可以在直接管理密钥与基于信任的访问模式之间选择，例如 managed identities、IAM roles 和
              OIDC。这不是狭义密钥库的足迹；它是一个试图站在多个身份原语之上、围绕它们编排生命周期控制的产品。Oasis Outpost 是最重要的架构线索。Outpost
              被描述为一个采集器容器，部署在客户云边界内，因此特权身份操作、密钥生成和密钥存储都留在本地。Oasis
              自身交换控制消息和元数据，而不是成为进入客户环境的后门。这种设计有助于企业接受，因为它降低了客户在自动化敏感机器凭据时必须跨出的信任跳跃。它也说明 Oasis
              更偏向优化治理和编排，而不是直接拥有每一个执行点。金融服务案例研究增加了实际部署证据。Oasis 描述了快速 Azure AD
              集成、自动发现、态势分析、陈旧账户清理和自动身份轮换。尽管案例由公司撰写，它仍说明产品目标是安装进真实企业身份资产，而不是只提供概念路线图平台。
