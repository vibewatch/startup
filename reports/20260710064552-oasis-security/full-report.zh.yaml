        - 展示市场如何给规模化身份公司定价
        - 覆盖员工身份，范围比 Oasis 宽得多
      - - SailPoint
        - FY2026 ARR $1.125B；其中 SaaS ARR $746M
        - 公开 / 近期重新上市的身份安全同业
        - 以 ARR 为核心的身份可比对象
        - 规模更大，也比 Oasis 更成熟
      - - Rubrik
        - FY2026 订阅 ARR $1.46B
        - 高增长安全 SaaS 可比对象
        - 可作为经常性收入和增长基准
        - 不是身份原生厂商
      - - CyberArk
        - 2025 总 ARR $1.44B；订阅 ARR $1.267B
        - 身份 / 机器身份老牌厂商
        - 机器身份方向的强战略可比对象
        - PAM 范围更宽，且具备老牌厂商规模
      - - Astrix / Cisco
        - 2026 年战略交易
        - 显示市场对 NHI / 智能体身份控制有 M&A 意愿
        - 为该品类提供战略验证
        - 本文件中交易条款未完全公开
      - - GitGuardian
        - 2026 年 $50M Series C
        - 私有市场相邻 NHI / AI 智能体安全融资信号
        - 验证投资人对该细分的兴趣
        - 融资轮不是直接估值倍数
    notes: 这张表提供估值镜头，不等于主张 Oasis 应完全按任一可比对象交易。
