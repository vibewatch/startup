      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              对 Oasis 最有吸引力的财务解读很直接。它看起来是一家有合同支撑、定制报价的企业 SaaS
              公司，切入痛点强且扩张中的身份问题，产品深度足以支持扩张，新融资也足以继续压市场。公开同行组显示，身份安全赢家可以成长为规模很大的经常性收入业务；Oasis
              的合作伙伴足迹说明它正试图同时靠直接企业关系和分发渠道扩张。问题在于，公开证据只停留在叙事质量和融资质量。外部无法审计 ARR、收入结构、毛利率、烧钱速度、NRR、CAC
              或客户集中度。即便定价，也只是能看出基于报价，除此之外并不透明。因此，Oasis 的财务章节应被解读为结构有利，但仅凭公开信息还不能承销。尽调中的门槛事项具体且无法绕开：季度 ARR
              桥接表、细分市场和渠道结构、按组件拆分的毛利率、烧钱和现金跑道材料，以及头部客户和合作伙伴集中度数据。如果管理层能快速拿出这些材料，且数字与增长叙事一致，财务姿态会明显增强。否则，披露缺失本身会成为风险因素，因为估值预期已经受到非人类身份和智能体访问的高溢价品类叙事影响。
