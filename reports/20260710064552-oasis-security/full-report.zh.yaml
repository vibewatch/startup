      - number: '5.4'
        title: 信任、标准与技术成熟度
        blocks:
          - type: paragraph
            body: >-
              Oasis 的信任故事有三根支柱：可审计性、标准对齐和技术可信度。可审计性来自 AAM 的说法：每个智能体动作都会从提示词到动作记录进责任链记录。标准对齐来自 AAM Framework 发布和更宽的 NIST
              AI Agent Standards Initiative；两者合在一起显示，公司试图把叙事锚定在正在成熟的外部治理讨论中，而不只是产品营销。技术可信度则由 OpenClaw 披露强化：Oasis
              研究员公开详述了一条智能体接管链，并称上游团队在 24 小时内发布修复。同时，标准环境仍处早期。NIST 的倡议围绕安全互操作性和开放协议，不是买家今天就能直接采用的成熟清单。这给 Oasis
              塑造最佳实践留下空间，但也意味着它的许多治理主张走在稳定第三方认证规范之前。公开材料还通过招聘和工程文化展示开发者信号，但没有呈现那种深度公开 API
              或软件包生态，外部难以独立检查技术采用。因此，当前技术成熟度信号在叙事连贯性和生态相关性上很强，但在公开基准和开放实现证据上更轻。
