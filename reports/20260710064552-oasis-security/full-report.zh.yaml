  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 图谱：直接同行、套件型巨头、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Oasis 周围的竞争图谱拥挤，但并不平坦。第一簇是直接的 NHI 和智能体身份纯玩家：Oasis 自身、Entro、Aembit，以及在 2026 年 6 月被 Cisco 吸收前的
              Astrix。第二簇是套件型巨头：CyberArk、Saviynt 和 Delinea，它们都从更宽的身份安全或机器身份平台切入。第三簇是运行时和基础设施控制：HashiCorp
              Vault、SPIFFE/SPIRE，以及 WorkOS 等更新的开发者优先身份进入者。它们并不总是直接替代威胁，但在具体买家用例中是合法替代方案。关键含义是，Oasis
              很少只打一条单一赛道。有些交易会把它与生命周期治理同行比较；另一些交易会追问，买家为什么不能扩展既有密钥库、PAM 或工作负载身份框架。多品类竞争提高了买家教育负担，也放大了清晰占住品类心智的重要性。
