      - number: '2.2'
        title: 规模测算口径、身份分层与区域形态
        blocks:
          - type: paragraph
            body: >-
              NHI 治理的公开市场规模信号方向很强，但数字并不干净。Mordor Intelligence 将较窄的 NHI 安全细分市场估为 2026 年 $8.22 billion、2031 年 $22.94
              billion；Research and Markets 及其 Yahoo Finance 分发伙伴则把更宽的 NHI 访问管理类别估为 2026 年 $12.2 billion、2036 年 $38.8
              billion。这个差距不是噪音，而是边界不同。较宽估算覆盖不同身份类型、部署模式、组织规模和垂直行业上的解决方案与服务层；较窄估算更接近安全控制子集。区域形态比精确 SAM
              更清楚：北美当前领先，亚太预计增长最快，大型企业主导现有需求。较宽预测还明确列出身份类型分层：应用和服务身份、API 与 OAuth 令牌身份、机器和设备身份、加密身份、AI
              智能体身份都已经是一线子分段。正确结论是：市场真实、庞大且快速扩张，但公开信息无法给出干净的 Oasis 专属 SOM。
