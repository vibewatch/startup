      basis: >-
        The comp set is designed to frame the recurring-revenue economics and strategic context of identity security,
        not to claim like-for-like product comparability. It combines public leaders, adjacent strategic deals, and
        private NHI peers.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
