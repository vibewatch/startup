        title: 采用信号、评价界面与独立客户声音
        blocks:
          - type: paragraph
            body: >-
              公开采用信号在 Oasis 讲企业结果时最强，落到外部评论平台时最弱。正面看，官网列出多项企业成果：一家 Fortune-50 医疗机构避免了一笔估计的 HIPAA 罚款，一家 Fortune-500
              物流买家将密钥轮换工作量削减 35%，一家保险客户遏制了一次影响半数生产负载的宕机，一家制造业客户把 M&A 合规要求落到新收购环境上。产品页又给出一条 Fortune 1000 客户引语，称在一个云环境里发现
              17,000 多个非人身份。这些信号有分量，因为它们意味着产品已经在真实运营场景里用起来。独立客户声音要薄得多。Gartner Peer Insights 在抓取页面上显示 20
              条评分、4.6/5，方向上是正面。但相较一家声称有几十家或更多大型企业部署的公司，样本仍然较小。SourceForge 和 Slashdot 提供产品条目，但抓取到的 SourceForge 页面整体评分为
              0.0/5，两个长尾评论站点的实质评论都很有限。这不能证明客户不满意，但说明除 Gartner 外，公开评论面很浅。投资人因此应同时拆开两件事：第一，Oasis
              很可能有真实企业采用；第二，独立公开声音仍太稀疏，还不足以判断大规模满意度、部署难易度或续约行为。
