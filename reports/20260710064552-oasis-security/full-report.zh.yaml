      - number: '8.4'
        title: 情景分析与建议
        blocks:
          - type: paragraph
            body: >-
              基准情景的决策是锚定最后一个站得住脚的公开融资标记，不向外推演太远。也就是把约 $700 million 视为当前公开基准，不是因为它一定正确，而是因为它证据最足。如果 Cyera
              兴趣在方向上成立，或管理层能验证溢价 ARR 增长和留存质量，乐观情景可以可信地接近 $1.0 billion。如果市场在 Oasis 给出支撑溢价私募品类框架的指标之前，先回到公开 IAM
              的估值纪律，悲观情景会落到数亿美元中段。基于这个格局，最站得住脚的建议是继续研究。Oasis
              看起来值得持续跟踪，但仅凭公开证据还不能自信买入。信心为中等，因为品类顺风和融资标记真实存在，但运营证据不完整。风险评级仍高，因为披露、依赖和证明问题仍具实质性。这家公司可能很好，甚至可能具备战略稀缺性。问题在于，公开文件仍不足以判断当前隐含价格是有吸引力、只是合理，还是已经偏紧。
