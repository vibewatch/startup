      - number: '4.4'
        title: 收入质量与资本强度的同行基准
        blocks:
          - type: paragraph
            body: >-
              Oasis 是私人公司，公开身份和安全供应商因此提供了唯一干净的经常性收入基准。Okta、SailPoint、Rubrik 和 CyberArk 都在 2026 年期间披露了十亿美元级订阅或 ARR
              规模，Okta 和 SailPoint 也有当前 SEC 文件轨迹，确认市场把身份安全视为经常性软件品类。这些公司不是 Oasis
              的直接产品匹配，但它们确立了投资人和收购方评估身份业务时使用的经济语言：订阅收入、ARR、SaaS ARR、RPO，以及大型客户经常性群组。这些同行也说明了为什么 Oasis
              的缺失披露很重要。如果管理层能证明强劲 ARR
              增长、健康留存和软件式毛利率，公司就有可能被放进高溢价的身份安全收入模型，而不是服务或基础设施转售商模型。否则，同样的透明度缺失会变成折价因素。从这个意义上说，可比公司有用，不是因为它们今天能给 Oasis
              一个精确倍数，而是因为它们定义了 Oasis 在融资或并购过程中必须满足的证明门槛。分析师估值研究进一步强化了这一点。Windsor Drake 的 2026 年 Q2 IAM 报告显示，主流公开 IAM 约为
              6.0x NTM 收入，而非人类和 AI 智能体身份平台可以达到 15x-30x 区间。Finro 警告成熟上市网络安全可比公司可能误导对 AI 原生私人公司的判断，这个方向上是公平的；但它也两面成立：如果没有
              Oasis 的硬 ARR 和利润率证据，区间里的高溢价部分更多是愿景，而不是已经被数据承销。
            claimRefs:
              - CI028
              - CI029
