      - number: '1.2'
        title: 融资历史、投资人图谱与治理信号
        blocks:
          - type: paragraph
            body: >-
              Oasis 通过私募融资里程碑的速度异常快。公司于 2024 年 1 月公开亮相，当时已经完成 $35 million Series A，累计融资 $40 million；2024 年 5 月又完成 $35
              million 延伸轮，管理层和媒体称估值较上一轮翻倍，累计融资升至 $75 million。最重要的融资事件是 2026 年 3 月 Series B：Oasis 宣布由 Craft Ventures 领投
              $120 million，老股东 Cyberstarts、Sequoia Capital 和 Accel 继续跟投，累计融资达到 $195 million。Globes 和 Tech Company News
              的独立报道将投后估值放在约 $700 million，明显低于用户提供背景中的 $1.2 billion，因此它是当前更有公开依据的价值锚点。治理披露比融资披露更薄。公开来源清楚识别了创始人，以及 2026 年
              4 月 Michael DeCesare 出任总裁，但没有披露完整董事会名单、委员会结构或股权结构细节。因此，投资人阵容是优势，治理透明度仍是未解决的尽调项。
