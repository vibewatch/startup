  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - AI 智能体和 NHI 快速扩散，Oasis 所在品类具备战略重要性
        - 若 ARR 质量偏弱或企业转化停滞，投资逻辑会软化
      - - 企业牵引力和多年协议表述显示买方兴趣严肃
        - 披露客户数和队列数据可强化论证
      - - 战略 M&A 和同业融资显示退出可选性
        - 若 M&A 传闻消退且公开可比公司倍数压缩，上行空间会收窄
      - - ARR、利润率和留存数据缺失，当前估值标记难以形成投资判断
        - 披露 ARR、NRR、毛利率和烧钱速度，才能给出更稳的估值判断
      - - 伙伴渠道带来的分销可选性可能加速采用
        - 若出现伙伴集中或转化偏弱，好处会变成风险
    notes: 投资逻辑和反向逻辑都取决于证据质量，不只取决于品类叙事。
