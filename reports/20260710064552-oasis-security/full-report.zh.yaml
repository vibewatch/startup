      - number: '2.3'
        title: 买家、垂直用例与采用如何真正起步
        blocks:
          - type: paragraph
            body: >-
              买家结构很重要，因为这个品类很少只归一个团队所有。Oasis、Saviynt、Delinea、GitGuardian、Aembit 和 HashiCorp 的产品叙事都指向一个共同控制模型：IAM/PAM
              负责人关心身份治理，云和平台团队关心工作负载访问模式，受监管业务负责人关心可审计性和韧性。Oasis 自己的解决方案页面把这一点讲得更具体。AI 页面强调把 AI
              智能体限制在获批模型供应商内，并执行最小权限；金融页面把痛点连接到 PCI DSS 4.0、SOC 2 和数字运营连续性；医疗页面则连接到患者隐私、HIPAA/GDPR
              式义务和不间断护理。整个市场里，采用通常从发现和盘点开始，再进入归属认定和风险标记，然后推进到生命周期策略，最后才走向运行时授权或无密钥执行。这个顺序提醒我们：很多买家会先落在可见性和态势上，等信任建立后才把内联访问控制交给供应商。
