  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与垂直行业结构
        blocks:
          - type: paragraph
            body: >-
              Oasis 的公开客户故事明显是企业优先，并高度偏向受监管或运营复杂的环境。最宽的信号来自它自己的关于页面，称许多行业的领先组织都在使用产品。更具体的信号来自 Newswire 和 Globes：Oasis
              服务数十家 Fortune 500 公司，客户群多数来自 Fortune
              500。垂直行业页面和案例研究界面最强地指向医疗、金融服务、物流、保险、制造和大型消费品牌。这些环境正是机器身份扩散最快、运营停机代价高、审计压力真实的场景。一个有意思的细节是，Oasis
              同时卖给最终企业用户和面向合作伙伴的生态。AI Access Partnership 页面面向想要开箱即带治理能力的企业 AI 供应商，而不只是最终企业买家。GuidePoint、CrowdStrike
              Marketplace 和 Wiz
              进一步延展市场进入路径，说明客户获取可能同样来自采购工具和合作伙伴工作流，而不只是直销。这拓宽了获客路径，但也让外部更难只凭公开证据看清安装基数的精确构成。最终结果是：客户图谱具有强烈的头部企业偏向，垂直丰富度不错，但分母透明度弱。公开材料让
              Oasis 已经进入大型复杂买家显得可信，却没有披露每个细分里有多少客户，或哪些细分主导经常性收入。
