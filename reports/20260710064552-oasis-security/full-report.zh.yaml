  - id: TR005
    title: 风险缓释与否决标准表
    columns:
      - 风险
      - 可监控触发信号
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 信任证明滞后
        - 没有新的外部验证
        - 未来 2 个季度基准测试 / 审计材料没有进展
        - 下调确信度；形成投资判断前要求直接证据
      - - 合作伙伴依赖
        - 单一合作伙伴主导新增管线
        - '>35% 的新增 ARR 归因于单一合作伙伴路径'
        - 按集中度风险处理，重新切估值
      - - 安全审查摩擦
        - 企业审查持续缓慢
        - 赢单 / 输单数据显示，安全审查是延期首因
        - 假设品类采用曲线慢于计划
      - - 运营可靠性
        - 出现重大宕机且响应不透明
        - 客户可见事故叠加薄弱的复盘纪律
        - 重新评估产品运营成熟度
      - - 战略分心
        - M&A 噪音干扰执行
        - 员工流失升高、客户犹豫或路线图滑坡
        - 提高执行风险折价
      - - 经营模型不透明
        - 财务 / 留存指标仍未披露
        - 尽调中没有队列、烧钱或集中度披露
        - 转向继续研究 / 避免被动接受价格
    notes: 这些是投资否决标准，不是通用安全最佳实践。
