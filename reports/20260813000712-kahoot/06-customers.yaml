    {
      "id": "adverse-feedback-and-concentration-blind-spots",
      "title": "Adverse feedback and concentration blind spots",
      "body": "The adverse record is not catastrophic, but it is real and directly relevant to customer quality. Independent review surfaces praise Kahoot’s engagement and ease of use, yet they also surface recurring objections around pricing, limited free functionality, occasional lag, accessibility or integration shortcomings, and the fact that Kahoot is strongest as a live engagement layer rather than a full standards-based LMS or e-learning system. Those critiques matter because they can cap willingness to pay, slow enterprise standardization, or encourage multi-homing with other tools. The bigger diligence gap, however, is concentration opacity. Public case studies show recognizable names, but they do not reveal how much revenue any single customer represents, how long contracts run, or whether enterprise seats renew at high rates. Kahoot therefore has strong anecdotal customer proof and decent breadth signals, but still weak public disclosure on the exact durability and concentration metrics that matter most for underwriting private-company revenue quality. That gap should stay front-and-center in investor calls.",
      "claimRefs": [
