    {
      "id": "retention-repeat-usage-and-expansion-proxies",
      "title": "Retention, repeat usage, and expansion proxies",
      "body": "Kahoot does not publicly disclose the metrics that would let an investor cleanly underwrite customer durability. There is no retained NRR, GRR, logo churn, renewal-rate, average contract length, or top-customer revenue concentration in the open-web record for this run. That said, the case studies provide repeat-usage proxies. Lely describes beginning with a 2019 pilot and later using Kahoot in most academy training while also extending it to customer education. Aviva describes adoption spreading from a central L&D team into compliance, QA, IT, and underwriting and into town halls with hundreds of participants. Fran García’s case shows schoolwide license expansion after successful teacher-led usage, while Hills Grammar describes educator pull rather than only top-down push. These are not substitutes for cohort retention data, but they do support the view that Kahoot often expands through champion-led reuse rather than one-off novelty sessions. The durability question is therefore open quantitatively but directionally positive qualitatively.",
      "claimRefs": [
        "CU007",
