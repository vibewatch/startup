    {
      "id": "architecture-integrations-and-delivery-model",
      "title": "Architecture, integrations, and delivery model",
      "body": "The public documentation supports a layered SaaS architecture even though Kahoot does not publicly expose its core cloud stack. User-facing clients span web, iOS, Android, and embedded experiences inside partner environments such as Microsoft Teams. Content can be authored manually or generated from topics, PDFs, URLs, Wikipedia articles, and synced slides. Distribution then branches into live games, lecture or presentation formats, assignments, self-study, and enterprise training sessions. Integration evidence is strong around the edges: Microsoft Teams, Zoom, Google Slides, PowerPoint, Google Classroom, RingCentral, and a range of LMS platforms are all named in current integration surfaces. On the data side, Kahoot exposes a reporting API that is explicitly REST/OpenAPI-based, authenticated with JWT bearer tokens, and intended for customers with data teams or developers. That means Kahoot has a meaningful admin/reporting surface, but not a broad publicly open platform in the way a developer-first company would.",
