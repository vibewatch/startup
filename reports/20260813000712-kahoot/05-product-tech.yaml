    {
      "id": "maturity-roadmap-and-product-risks",
      "title": "Maturity, roadmap, and product risks",
      "body": "The product portfolio appears mature in core creation, hosting, and reporting flows, but less transparent in platform internals and future roadmap economics. The support center shows active 2026 updates across AI generation, PowerPoint workflows, integrations, and Google Classroom-related surfaces, which is a good signal that Kahoot is still iterating the creator stack rather than freezing it post-buyout. The enterprise and Actimo pages likewise show current emphasis on analytics, onboarding, communication, and identity-driven rollout. The largest open technical questions are not whether Kahoot can run live quiz sessions — that is well proven — but whether newer surfaces produce durable differentiation without adding hidden operating cost or integrity risk. AI generation increases convenience but introduces hallucination and rights-review burden. Marketplace and identity dependencies increase reach but also platform risk. The unofficial developer ecosystem, including wrappers and cheating/bot projects, is a dual signal: it shows strong engagement around Kahoot’s protocols, but it also implies ongoing anti-abuse and game-integrity work that is invisible from the public product pages.",
