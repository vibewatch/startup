  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Kahoot is no longer just a live quiz app: the retained product surface spans K-12, higher education, enterprise training, Actimo for non-desk workers, DragonBox math apps, mobile creation/play, and a gated reports API. Public evidence supports mature engagement workflows, broad distribution, and unusually explicit privacy messaging, but it does not disclose the core infrastructure stack, detailed AI guardrails beyond vendor mentions, or a broad programmable platform beyond reporting and marketplace integrations."
  },
  "sections": [
    {
      "id": "product-surface-and-customer-workflow",
      "title": "Product surface and customer workflow",
      "body": "Kahoot now operates as a multi-surface engagement platform rather than a single classroom quiz utility. The official web estate splits the offering across K-12 classroom workflows, self-serve higher-ed plans, enterprise workforce engagement, and adjacent products such as Actimo and DragonBox. For educators, the product promise centers on faster lesson creation, live and self-paced delivery, broad question-type coverage, and reporting. For workplace users, the pitch shifts toward onboarding, training, communication, presentations, and events. The mobile app store surfaces reinforce that breadth: the same app is positioned for school, home, and work, and supports both playing and creating kahoots. The practical workflow is consistent across cohorts: a creator starts from a topic or source material, generates or edits content, hosts or assigns a session, collects participation data, and reviews reports. What changes by segment is mostly packaging, player limits, admin controls, and integration depth rather than a fully separate product core.",
