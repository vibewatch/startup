  - id: GE001
    topic: core-infrastructure
    description: No retained public source disclosed Kahoot’s core cloud provider, backend languages, or data-plane architecture.
    impact: Limits engineering diligence on reliability, scalability, and infra concentration risk.
    recommendedAction: Request architecture diagrams, vendor map, core service inventory, and SRE ownership model.
  - id: GE002
    topic: security-assurance-detail
    description: >-
      Public trust pages cite certifications and privacy principles, but the underlying audit reports, scope boundaries,
      encryption design, and penetration-testing cadence were not retained in this run.
    impact: Prevents security diligence from moving past procurement-level assurances.
    recommendedAction: Request SOC 2 report, ISO scope statement, incident-response policy, and latest external pen-test summary.
  - id: GE003
    topic: ai-governance-and-cost
    description: >-
      Public docs mention GPT-4 and Perplexity integration and provide user-facing warnings, but do not disclose model
      mix, moderation pipeline, cost controls, rights review, or evaluation metrics.
    impact: Leaves unresolved margin, safety, and hallucination risk for AI-heavy workflows.
    recommendedAction: Request AI vendor architecture, moderation/grounding design, evaluation rubric, and unit-cost telemetry.
  - id: GE004
    topic: module-usage-and-retention
    description: >-
      No public source in this run disclosed active usage, retention, or revenue contribution by module such as Actimo,
      DragonBox, Teams integration, or reports API adoption.
    impact: Makes it hard to distinguish flagship moat features from long-tail portfolio assets.
    recommendedAction: Request module-level MAU, DAU, paid attach, retention, and cross-sell data.
  - id: GE005
    topic: anti-abuse-controls
    description: >-
      Open developer signals show wrappers and cheat clients, but public materials do not explain current anti-bot,
      session-integrity, or abuse-detection controls.
    impact: Gameplay trust and classroom reliability risk cannot be fully assessed.
    recommendedAction: Request anti-abuse architecture, rate limiting, anomaly detection, and recent abuse metrics.
  - id: GU001
    topic: retention-metrics
    description: No retained public source disclosed Kahoot NRR, GRR, logo churn, or renewal rate.
    impact: Prevents rigorous underwriting of customer durability.
    recommendedAction: Request retention cohorts by segment and year.
  - id: GU002
    topic: customer-concentration
    description: No retained public source disclosed top-customer revenue share or contract concentration.
    impact: Large logos cannot be translated into concentration risk without internal data.
    recommendedAction: Request top-10 customer ARR, seat share, and renewal history.
  - id: GU003
    topic: higher-ed-proof
    description: The retained public proof set for higher-ed is thinner than for K-12 and enterprise training.
    impact: Limits confidence in higher-ed monetization and expansion.
    recommendedAction: Request named higher-ed case studies, campus contracts, and renewal data.
  - id: GU004
    topic: consumer-monetization
    description: App-store ratings show broad reach but not paying conversion, retention, or ARPU.
    impact: Consumer familiarity may be strategically useful but its financial quality remains unclear.
    recommendedAction: Request consumer paid-subscriber counts, churn, and cross-sell into other segments.
  - id: GU005
    topic: independent-proof-balance
    description: Most quantified named proofs are vendor-hosted rather than independently audited or customer-hosted.
    impact: Raises the usual diligence concern about positive-selection bias in case studies.
    recommendedAction: Seek customer calls, renewal documents, and independent procurement or review evidence for top accounts.
  - id: GU006
    topic: TU003 named-customer-proof coverage
    description: >-
      The named customer proof table is intentionally a sample of the strongest retained public references and does not
      enumerate every public Kahoot customer story or directory mention.
    impact: Readers should not treat TU003 as an exhaustive customer list or as a full concentration map.
    recommendedAction: >-
      Expand the table with a complete ledger of customer stories and independently verified procurement references if
      exhaustive coverage is required.
    relatedTableRefs:
      - TU003
  - id: GR001
    topic: TR001 coverage
    description: >-
      The regulatory/legal risk register is a prioritized sample of public issues, not a complete legal memo across
      every jurisdiction in which Kahoot operates.
    impact: Legal diligence still requires counsel review of DPAs, terms, claims history, and enforcement exposure.
    recommendedAction: Commission jurisdiction-by-jurisdiction privacy and education-law review.
    relatedTableRefs:
      - TR001
  - id: GR002
    topic: security-detail
    description: >-
      Public evidence does not disclose incident frequency, bug bounty results, penetration-test findings, or full
      control architecture.
    impact: Residual security risk cannot be fully underwritten from open sources.
    recommendedAction: Request SOC report, pentest summaries, vulnerability management metrics, and incident history.
  - id: GR003
    topic: capital-structure-opacity
    description: No retained public source disclosed post-close debt, covenants, or refinancing terms.
    impact: Financial downside and owner-driven risk remain difficult to bound.
    recommendedAction: Request debt package, covenant dashboard, and sponsor capital-allocation framework.
  - id: GR004
    topic: retention-and-concentration
    description: No retained public source disclosed NRR, GRR, logo churn, renewal rates, or top-account revenue concentration.
    impact: Customer/model risk cannot be quantified cleanly.
    recommendedAction: Request retention cohorts and concentration schedule.
  - id: GR005
    topic: anti-abuse-and-integrity
    description: >-
      Public materials do not disclose anti-cheat, anti-bot, or content-abuse metrics or architecture in sufficient
      detail.
    impact: Classroom trust and brand risk are hard to gauge.
    recommendedAction: Request abuse telemetry, moderation queue stats, and enforcement playbook.
  - id: GV001
    topic: current-private-financials
    description: >-
      No retained public source provides 2024-2026 revenue, ARR, billings, gross margin, or segment growth after
      delisting.
    impact: The recommendation cannot responsibly move from track to buy without current performance data.
    recommendedAction: Request full private-period operating model and monthly KPI bridge.
  - id: GV002
    topic: retention-and-cohorts
    description: No retained public source provides NRR, GRR, logo churn, cohort retention, or top-account concentration.
    impact: Valuation multiple selection remains highly judgmental.
    recommendedAction: Request cohort, renewal, and concentration schedules.
  - id: GV003
    topic: debt-and-covenants
    description: >-
      Post-close debt, covenants, refinancing timeline, and sponsor capital-allocation guardrails are not public in
