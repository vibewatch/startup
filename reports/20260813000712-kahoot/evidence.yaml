    impact: Equity downside cannot be bounded cleanly.
    recommendedAction: Request debt package, covenant dashboard, and treasury scenarios.
  - id: GV004
    topic: segment-mix
    description: >-
      Public evidence is weaker on current revenue split across school, higher-ed, enterprise, and consumer than on
      anecdotal use cases.
    impact: The appropriate comparable set and multiple may be mis-specified.
    recommendedAction: Request segment P&L and cohort quality by segment.
  - id: GV005
    topic: enterprise-proof-depth
    description: Case studies show real usage but not broad seat counts, contract values, or multi-year renewal behavior.
    impact: Case-study quality may overstate generalized enterprise durability.
    recommendedAction: Run customer reference calls plus account-level expansion review.
  - id: GV006
    topic: exit-window
