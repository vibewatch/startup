evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-cap-table
    missingEvidence: >-
      Current post-close ownership percentages, governance rights, and holdco debt terms for the Goldman-led private
      structure.
    whyItMatters: >-
      Control, dilution, and financial-risk analysis cannot be completed from open sources without knowing who owns what
      and what leverage was layered onto the company at close.
    diligencePath: >-
      Request the post-close cap table, shareholder agreement summary, debt facilities, and board consent thresholds
      from management or deal counsel.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: fy2023-audited-results
    missingEvidence: >-
      A directly retained audited 2023 annual report or equivalent year-end filing that reconciles full-year revenue,
      cash flow, and segment mix after the July 2023 offer announcement.
    whyItMatters: >-
      Later chapters need a clean final public-year base, and depending on third-party aggregators for full-year 2023
      numbers weakens financial comparability and valuation work.
    diligencePath: >-
      Obtain the FY2023 annual report or audited year-end statement from management, archived investor relations
      materials, or a licensed filing database.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: current-headcount
    missingEvidence: A current audited or management-confirmed employee count and office-by-office breakdown.
    whyItMatters: >-
      Open-web sources disagree on footprint depth, and current private-company scale signals influence operating
      leverage and go-to-market capacity assessments.
    diligencePath: Ask management for current FTE count, office roster, and function-by-function headcount split.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO002
  - type: stale
    severity: material
    topic: TO004 current-arr-and-subscriber-count
    missingEvidence: Current 2024-2026 ARR, revenue, paid-subscriber, and churn data after delisting.
    whyItMatters: >-
      The last public quarter is useful but stale; investors need current private-period performance to judge whether
      growth re-accelerated or kept slowing.
    diligencePath: >-
      Request monthly KPI packs for ARR, paid subscriptions, active accounts, NRR, gross churn, and enterprise mix since
      January 2024.
