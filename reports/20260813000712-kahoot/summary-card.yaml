  topStrengths:
    - >-
      Kahoot has real cross-segment reach across schools, higher education, and enterprise training rather than a single
      narrow quiz niche.
    - >-
      Historical public financials showed unusually healthy software economics for an EdTech asset: 95% gross margin,
      positive operating cash flow, and no operating-company debt through Q2 2023.
    - >-
      Named enterprise deployments such as Virgin Atlantic, Aviva Canada, El Jannah, and Lely show real production use
      beyond casual classroom or event novelty.
    - >-
      The brand remains globally recognizable and sponsor-backed, which preserves multiple exit routes if enterprise
      durability continues improving.
  topRisks:
    - >-
      Current private-period revenue, retention, segment mix, and leverage are opaque, making the most important
      underwriting variables unavailable from public evidence.
    - >-
      Kahoot may still be valued more like an engagement layer than a system of record, which can compress multiples and
      increase multi-homing risk.
    - >-
      Privacy, security, and children/student data obligations remain material because the platform sits across school
      and workplace environments.
    - >-
      The 2024 take-private valuation already looked premium versus the 2026 public comp set unless Kahoot has
      compounded materially since delisting.
  unresolvedGaps:
    - Current revenue / ARR / billings and segment growth since delisting
    - NRR, GRR, logo churn, renewal terms, and top-account concentration
    - Post-close debt stack, covenants, refinancing timeline, and sponsor capital-allocation guardrails
    - 'Enterprise cohort depth: seat counts, contract values, and multi-year expansion behavior beyond case studies'
    - Sponsor exit planning, secondary marks, and relisting readiness
