      - number: '2.4'
        title: Growth drivers, constraints, and diligence readout
        blocks:
          - type: paragraph
            body: >-
              The strongest current tailwinds are still flexible delivery, AI-related upskilling, and the institutional
              need to measure participation and understanding rather than just publish static content. LinkedIn’s 2024
              workplace survey shows both retention pressure and strong demand for AI skills, while CHLOE and EDUCAUSE
              show higher education still facing sustained online demand, more competition, and rapid assessment changes
              as AI spreads. EU digital-education policy pages and NCES public-finance materials suggest that digital
              learning remains a live policy and infrastructure theme rather than a pandemic-only anomaly. But the
              headwinds are equally real. PowerSchool describes budget constraints, teacher shortages, and compliance
              complexity in K-12; CHLOE shows only partial institutional preparedness in higher ed; Mordor and other
              market reports flag privacy, cybersecurity, digital fatigue, and implementation cost; and Coursera’s
              filing explicitly warns that generative AI could either expand demand for reskilling or displace parts of
              online learning altogether. The diligence implication is that Kahoot operates in a durable market, but not
              a frictionless one. Growth is most likely where the product can prove workflow fit, engagement lift, and
              low administrative burden inside already crowded institutional and enterprise stacks.
