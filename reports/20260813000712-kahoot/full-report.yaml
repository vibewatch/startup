  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization structure
        blocks:
          - type: paragraph
            body: >-
              Kahoot’s public filings make clear that the business was monetizing a broad subscription surface rather
              than a single classroom product. By late 2022 and into 2023, management disclosed three revenue
              categories—Commercial, Education, and Consumer & Experience—each with its own paid-subscription base. That
              structure matches the current product packaging: low-friction self-serve higher-ed plans, teacher
              workflows, and quote-based enterprise or institution-wide motions. The filings also show that the primary
              reported revenue-quality indicators were billings, recognized revenue, ARR, paid subscriptions, and cash
              flow rather than GMV or advertising metrics. That matters because it frames Kahoot more like a high-margin
              subscription software business than like a content marketplace or media property. Pricing transparency is
              mixed. The current higher-ed page exposes monthly list pricing from low-cost entry tiers upward, but the
              more economically important EDU and enterprise contracts lean sales-led and likely carry negotiated
              discounts, customer-success costs, and implementation nuance that the public web does not show. The
              financial implication is that list pricing is useful for understanding acquisition funnels and packaging
              logic, but not for inferring realized ARPU or contract margins. Public evidence supports a multi-tier
              monetization model with product-led entry and institution-led expansion, not a simple flat-price SaaS
              motion.
