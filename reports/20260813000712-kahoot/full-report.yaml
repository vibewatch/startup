        title: Customer segments and paying surfaces
        blocks:
          - type: paragraph
            body: >-
              Kahoot’s customer base is broad but economically heterogeneous. The official surfaces divide buyers and
              users into at least five meaningful groups: K-12 educators and school leaders, higher-ed instructors and
              departments, enterprise learning and development teams, frontline/non-desk workforce operators using
              Kahoot! 360 or Actimo-style workflows, and mission-driven content or outreach partners such as WHO.
              Consumer and freemium users remain important because app-store presence and school familiarity appear to
              seed later workplace adoption. The key diligence nuance is that “customer” does not mean the same thing
              across those segments. In many education contexts, the user is a teacher while the payer may be an
              individual, school, or district. In enterprise, the buyer is usually L&D, HR, compliance, or
              communications, while end users are employees, managers, or event participants. This segmentation matters
              because Kahoot’s land-and-expand motion depends on moving from individual adoption or a single champion
              use case into broader organizational deployment.
