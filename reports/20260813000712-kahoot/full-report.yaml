            body: >-
              Kahoot’s trust posture is more explicit than its core infrastructure disclosure. The Trust Center
              emphasizes PIN-based participation without accounts, minimal-data design, no sale of personal data, no
              third-party ads, and no use of end-user data to train AI. The same surfaces also market enterprise
              controls such as SSO, roster sync, retention, deletion, SCIM, domain claim, and export/reporting
              capabilities. For school buyers, that matters as much as raw feature count because procurement
              increasingly requires evidence of FERPA, COPPA, GDPR, and audit-oriented controls. Public documentation
              further cites SOC 2, ISO 27001, 1EdTech certification, and the Common Sense Privacy verified seal.
              However, the public record still stops short of full technical diligence: no public architecture diagram,
              uptime SLA, cloud-provider disclosure, encryption design paper, or detailed incident postmortem library is
              retained in this run. The status page is useful because it proves Kahoot runs an external reliability
