      - number: '8.3'
        title: Scenario and return logic
        blocks:
          - type: paragraph
            body: >-
              Because private-period financials are absent, the scenario frame should be simple and explicit. A bull
              case requires evidence that Kahoot has compounded meaningfully since the final public baseline, pushed
              more revenue into higher-quality enterprise or institutional cohorts, and managed sponsor leverage without
              starving product, compliance, or go-to-market investment. Under that world, a high-single-digit revenue
              multiple can still work and can justify enterprise values at or above sponsor entry. A base case is less
              generous: it assumes some growth, but not enough to remove the engagement-layer discount or the opacity
              discount attached to private leverage and limited retention disclosure. In that world, Kahoot screens like
              a good company but not obviously like an underpriced one. The bear case is straightforward: growth slows,
              feature parity intensifies, buyers multi-home, and the company cannot prove durable enterprise cohorts or
              comfortable leverage. Public comps show that the downside in education software can be severe when the
              market stops granting strategic scarcity. That is why even a favorable strategic opinion of Kahoot should
              not automatically translate into a favorable underwriting decision at any price.
