      - number: '7.4'
        title: Capital structure and thesis-break risk
        blocks:
          - type: paragraph
            body: >-
              The most important financial-model risk after privatization is opacity. Pre-close Kahoot did not look like
              a distressed operating company: public filings showed cash, high gross margins, and no interest-bearing
              debt at the operating-company level. The risk migrated into the sponsor structure when the buyout closed
              with secured equity and debt commitments. That means investors now face a classic
              private-equity-information problem: if growth slows, customer acquisition gets pricier, or schools become
              more budget sensitive, outside observers have no public line of sight into leverage, covenants, or
              refinancing pressure. Combined with the customer-side unknowns—NRR, GRR, top-account concentration,
              renewal rates—this makes Kahoot’s residual downside hard to bound from public information alone. The
              practical approach is to define thesis-break triggers around measurable events: privacy incidents, failure
              to maintain compliance posture, repeat reliability issues, visible review deterioration, or evidence that
              leverage rather than product quality is driving strategic decisions.
            claimRefs:
