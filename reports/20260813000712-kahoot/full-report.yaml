      - number: '8.2'
        title: Valuation context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The cleanest public anchor remains the sponsor transaction. The July 2023 offer materials valued Kahoot at
              NOK 17.2 billion, about $1.72 billion, or roughly 10x last-twelve-month revenue and about 40x
              last-twelve-month adjusted EBITDA. That is an aggressive multiple compared with the 2026 public education
              and learning software set. Duolingo still commands a premium market value because the market sees strong
              growth and a differentiated engagement moat. Coursera trades materially lower on revenue, Udemy lower
              still, and challenged models such as Chegg and 2U show how brutally the market discounts slower growth,
              weaker moat, or strategic uncertainty. The comparable lesson is not that Kahoot belongs at the distressed
              end of the range; Kahoot’s cash generation, broad brand, and enterprise proof are better than that. The
              lesson is that a premium price needs premium evidence. Publicly retained evidence does not yet prove
              Kahoot deserves a Duolingo-like premium, and it certainly does not eliminate the risk of slipping toward
              the much lower valuation bands that frame generalized, optional, or structurally pressured learning
              assets. As a result, the sponsor mark looks defendable only in a stronger current-revenue and
              stronger-retention world than the public record can currently verify.
            claimRefs:
              - CV002
              - CV004
