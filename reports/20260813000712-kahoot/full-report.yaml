      - number: '2.2'
        title: Sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              Public market-sizing evidence is abundant but not cleanly comparable. At the broadest level, IMARC puts
              global e-learning at $369.7 billion in 2025, which is helpful only as outer context because it mixes
              academic, corporate, and platform layers far beyond Kahoot’s direct scope. Inside workplace learning,
              published corporate e-learning estimates already diverge sharply: Grand View starts from $104.3 billion in
              2024, Mordor from $115.7 billion in 2026, Fact.MR from $132.6 billion in 2026, and Fortune Business
              Insights from $157.4 billion in 2026. Game-based learning estimates also vary materially, from Market.us
              at $14.0 billion in 2023 to Global Market Insights at $23.45 billion in 2023 and Credence at $21.29
              billion in 2024. The contradiction is meaningful because each publisher appears to draw the category
              boundary differently across education, enterprise training, content, and enabling software. The defensible
              conclusion is not to pick a single “true” TAM, but to preserve a set of adjacent lenses: broad digital
              learning as outer context, corporate e-learning as the biggest monetizable workplace pool, and game-based
              learning as the closest thematic analogue to Kahoot’s historical brand. No retained public source isolates
              a precise Kahoot-only SAM or SOM.
