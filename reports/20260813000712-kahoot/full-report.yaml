      - number: '2.3'
        title: Buyers, budget owners, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Kahoot’s buying center changes materially by segment. In K-12, the day-to-day user is the teacher, but
              official EDU packaging and PowerSchool’s market framing both point to schools, districts, and systems as
              the economic buyer when purchases move beyond free or individual plans. In higher education, the immediate
              champion is usually an instructor or teaching-and-learning team, but institutional deployment depends on
              departmental, campus, or central digital-learning budgets and on compatibility with existing LMS
              workflows. In enterprise, the user may be a trainer, team lead, or presenter, while the payer may sit in
              L&D, HR, internal communications, compliance, or a functional enablement budget. This explains why
              integrations matter so much: Instructure’s filing shows how deeply modern learning stacks depend on
              LTI/API ecosystems, while Kahoot’s own enterprise pages emphasize LMS connections, collaboration-tool
              hosting, automated reporting, and centralized user management. The adoption path therefore tends to move
              from bottom-up usage or a narrow team trial into a more formal security, procurement, identity, and
              analytics review before a district, campus, or enterprise-wide rollout can happen. The consumer/home tail
              remains relevant for brand reach, but it is not the clearest institutional revenue pool.
