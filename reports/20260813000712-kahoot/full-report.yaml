      - number: '4.2'
        title: Public traction and unit economics proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest part of Kahoot’s public financial record is the combination of scale and margin. The Q4 2022
              report showed $146.0 million of revenue, $169.0 million of billings, 95% gross margin, $30.3 million of
              adjusted EBITDA, $42.7 million of adjusted operating cash flow, $104.8 million of cash, and no
              interest-bearing debt. Q1 2023 and Q2 2023 extended that pattern: revenue rose to $40.5 million and then
              $41.3 million; ARR moved from $159.0 million to $163.5 million; adjusted EBITDA from $10.0 million to
              $11.0 million; and paid subscriptions from 1.345 million to 1.365 million. The filings also preserved
              hints about customer-acquisition efficiency. Management explicitly tied Q4 subscription growth to minimal
              CAC from viral and organic channels, and by Q2 the company highlighted a 15th consecutive quarter of
              positive operating cash flow. Together these indicators suggest better revenue quality than the eventual
              take-private headline alone might imply: recurring subscription economics, limited cost of sales, positive
              cash generation, and meaningful deferred-revenue balances. The tradeoff is that public visibility stops
              where real underwriting gets harder. There is no retained public CAC, NRR, gross churn, segment margin, or
              realized pricing bridge, so the unit-economics story is directionally good but still incomplete.
