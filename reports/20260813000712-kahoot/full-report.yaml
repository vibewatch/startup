  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Privacy, regulatory, and legal risk
        blocks:
          - type: paragraph
            body: >-
              Kahoot’s most obvious risk surface is privacy and regulatory compliance. The product is widely used by
              children, schools, and workplaces; it therefore sits at the intersection of COPPA, FERPA, GDPR,
              children’s-data design expectations, and ordinary consumer/privacy obligations. Kahoot’s own transparency
              and trust materials acknowledge that the group is exposed to GDPR and privacy issues and must keep
              improving controls as products and laws evolve. This is not a hypothetical compliance area: the FTC’s
              COPPA guidance, the FERPA framework, and the UK children’s-information guidance all illustrate how strict
              the rules can become when minors or student records are involved. Kahoot does have meaningful
              mitigants—SOC 2, ISO 27001, privacy programs, acceptable-use/editorial policies, and explicit statements
              around not selling personal data and not using end-user data to train AI—but the legal exposure remains
              high because a single material failure involving children or school data could trigger regulatory
              scrutiny, customer distrust, and contract friction simultaneously.
