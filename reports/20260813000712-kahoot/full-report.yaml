  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category structure
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to frame Kahoot!’s market is not “all edtech” or even “all e-learning,” but the narrower
              intersection of interactive learning delivery, assessment, and engagement across schools, higher
              education, and workplaces. Kahoot’s own surfaces reinforce that point. The schools workflow page centers
              teachers creating quizzes, assigning self-paced challenges, and using reports for formative assessment.
              Kahoot! EDU then expands that into district and school-system buying motions with SSO, LMS integration,
              professional learning, and institution-wide deployment. Higher education is positioned slightly
              differently: the higher-ed page emphasizes lecture engagement, self-study, Q&A, reporting, and
              institutional licenses. The enterprise offer is different again, spanning compliance training, onboarding,
              communication, meetings, and events, with SSO/SCIM, analytics, and reporting API hooks. That means Kahoot
              competes for slices of instruction, assessment, and workforce-engagement budgets rather than for all
              software dollars spent on SIS, LMS, full online-degree delivery, or HR suites. The main status-quo
              substitutes are also segment-specific: free classroom tools and slides in K-12, LMS-native quizzes and
              discussion tools in higher ed, and instructor-led training plus collaboration software in enterprise
              settings.
