        - Virgin Atlantic, Aviva, El Jannah, and Lely stories show production use cases
        - Cohort-level seat, renewal, and expansion data proving stories generalize beyond references
      - - Moat may be shallower than headline brand suggests
        - Reviews, partner data, and competitor context imply optional-tool and feature-commoditization risk
        - Proof that analytics, provisioning, and workflow depth materially reduce multi-homing
      - - Sponsor price may already bake in much of the upside
        - Offer multiple was premium versus today’s public comp set
        - >-
          Private metrics showing much higher revenue scale, retention, or leverage-adjusted quality than public
          baselines
      - - Private-company opacity is now the central diligence blocker
        - No retained public source shows current revenue, NRR, debt, or covenants
        - Full private data room access resolving current performance and capital-structure uncertainty
    notes: Rows are ordered to show why a quality business can still yield a cautious investment recommendation.
    claimRefs:
      - CV001
      - CV002
      - CV007
