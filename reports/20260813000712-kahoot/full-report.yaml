  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: sample
      basis: >-
        This table is a curated comparable set spanning premium gamified learning, broad online learning, distressed
        education software, and Kahoot’s own transaction anchor.
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Kahoot take-private
        - ~$1.72B EV on ~10x LTM revenue / ~40x adj. EBITDA per offer materials
        - Premium sponsor transaction anchor
        - Direct valuation reference for this company
        - Pre-close price, not current marked value
      - - Duolingo
        - ~$6.29B market cap on ~$1.09B TTM revenue (~5.8x)
        - Best public premium gamified-learning comp
        - Shows what a stronger moat/growth profile can earn
        - Consumer language/app habit loop is not the same as Kahoot
      - - Coursera
        - ~$1.47B market cap on ~$0.77B TTM revenue (~1.9x)
        - Scaled online learning/credential comp
        - Useful mid-range market reference
        - Different model mix and credential depth
      - - Udemy
        - ~$0.67B market cap on ~$0.78B TTM revenue (~0.9x)
        - Broad marketplace/L&D comp with slower-growth profile
        - Illustrates compression for broader learning platforms
        - Marketplace model differs from Kahoot’s interactive format
      - - Chegg
        - ~$88.85M market cap on ~$0.31B TTM revenue (~0.3x)
        - Adverse education-software outcome
        - Shows how quickly sentiment can collapse when model pressure grows
        - Business model and AI shock differ from Kahoot
      - - 2U
        - Last known ~$4.43M market cap on ~$0.86B TTM revenue plus ~-95.5% 2024 stock performance
        - Extreme distressed reference
        - Frames downside if leverage/model strain dominates
        - Distress comp, not a central-base comp
    notes: 'The spread between Duolingo and 2U/Chegg is the key message: public markets reward proof and punish ambiguity.'
