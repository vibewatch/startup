companyProfile:
  summary: >-
    Kahoot! is an Oslo-headquartered Norwegian learning platform founded in 2012 by Morten Versvik, Johan Brand, and
    Jamie Brooker, with academic roots at NTNU and later leadership continuity from Åsmund Furuseth and current CEO
    Eilert Giertsen Hanoa. The company built a broad engagement software surface spanning K-12, higher education,
    consumer learning, and enterprise training, then went private in January 2024 after a Goldman Sachs Asset
    Management-led consortium acquired it at NOK 35 per share. Retained public evidence shows a real scaled software
    asset: 600+ employees, 10M+ teachers hosting kahoots in the last 12 months, 95%+ Fortune 500 reach claims, 95% gross
    margins, positive operating cash flow, and named enterprise deployments such as Virgin Atlantic, Aviva Canada, El
    Jannah, and Lely. The underwriting problem is not whether Kahoot is real; it is that the most decision-critical
    post-delisting metrics are now private.
