  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Private revenue / retention miss
        - Current revenue and renewal data fail to clear the public baseline by a convincing margin
        - Destroys premium-multiple defense
        - Do not pay near sponsor mark
      - - Leverage stress
        - Debt, covenants, or refinancing needs constrain product, security, or go-to-market spend
        - Turns a good product into an over-levered asset
        - Re-underwrite from downside first
      - - Privacy / safety / compliance event
        - Material student/children data issue, enforcement, or assurance failure
        - Damages trust in the segments that matter most
        - Pause or stop the process until remediated
      - - Review / product-fit deterioration
        - Independent complaints worsen on pricing, lag, or workflow fit while enterprise proof stalls
        - Strengthens optional-tool discount and churn risk
        - Lower valuation band and tighten terms
      - - Exit window weakens
        - No plausible strategic or relisting path at acceptable multiples
        - Reduces sponsor-to-sponsor or IPO optionality
        - Treat hold period and return math more conservatively
    notes: These are monitorable triggers designed for a private investment committee, not just descriptive risks.
    claimRefs:
      - CV033
      - CV038
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current revenue / ARR
        - 2024-2026 revenue, ARR, billings, gross margin, and segment growth
        - Decides whether sponsor entry is still supportable
        - CFO data room / QA with finance
      - - Retention quality
        - NRR, GRR, logo churn, cohort retention, renewal terms
        - Separates durable platform economics from optional-tool usage
        - RevOps + customer success diligence
      - - Debt and covenants
        - Post-close debt stack, pricing, maturity ladder, covenant headroom
        - Determines whether leverage compresses equity value or flexibility
        - Sponsor / treasury diligence
      - - Segment mix
        - Revenue split across school, higher-ed, enterprise, and consumer
        - Changes multiple and cyclicality assumptions
        - Management operating review
      - - Enterprise proof beyond logos
        - Seat counts, deployment depth, expansion paths, and churn on named references
        - Shows whether case studies generalize to broad enterprise value
        - Reference calls + customer cohort review
      - - Risk/control posture
        - Security incidents, privacy complaints, assurance coverage, AI governance, and abuse moderation metrics
        - Affects both downside risk and enterprise sales quality
        - Security / legal / trust diligence
    notes: The asks are prioritized in the order most likely to move valuation and recommendation.
    claimRefs:
      - CV009
      - CV037
      - CV038
