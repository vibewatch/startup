  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Revenue roughly $240M-$280M, enterprise mix improves, retention is strong, leverage manageable, privacy/risk
          profile stable
        - ~8x-9x revenue implies about $1.9B-$2.4B EV; sponsor entry can still work and upside exists
        - Requires premium evidence not visible publicly
        - Possible but unproven
      - - Base
        - >-
          Revenue roughly $190M-$230M, growth moderates, leverage exists but is manageable, optional-tool discount
          persists
        - >-
          ~5x-6x revenue implies about $1.0B-$1.4B EV; below sponsor entry and only modestly attractive if bought
          cheaper
        - Opaque retention and private leverage keep the discount in place
        - Most consistent with public uncertainty
      - - Bear
        - Revenue roughly $150M-$190M, growth weakens, reviews worsen, buyers multi-home, leverage becomes binding
        - ~3.5x-4.5x revenue implies about $0.5B-$0.9B EV; sponsor entry materially underwater
        - Optionality shrinks fast if enterprise durability is overstated
        - Adverse but plausible if private data disappoint
    notes: >-
