              The operational/security picture is mixed: Kahoot has clear evidence of control investment, but only
              partial public evidence of runtime quality. The Trust Center and transparency report describe security
              training, recertification work, supplier due diligence, and content-safety policies. Independent
              external-risk tools nevertheless frame Kahoot as a monitored, non-trivial attack surface rather than a
              risk-free domain. Site24x7 assigns a B / 71 external security score and UpGuard emphasizes 330+ continuous
              checks across website, email, phishing, brand, and network categories. The public status page also matters
              because it proves Kahoot expects and discloses maintenance windows. None of that means the company is
              weak; it means the company is exposed in exactly the ways one would expect for a cloud learning platform
              used in schools and enterprises. The main risk is not that Kahoot lacks any mitigation, but that outsiders
              still cannot verify incident frequency, SRE maturity, abuse rates, or the real security posture of the
              private-period stack beyond vendor- and company-controlled surfaces.
