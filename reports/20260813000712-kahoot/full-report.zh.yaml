  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 这条建议从高质量历史资产出发，叠加当前信息不透明和可比公司倍数压缩，最后落在仅凭公开资料给出的观察 / 继续研究判断。
    data:
      nodes:
        - id: a
          label: 规模化品牌 + 广产品覆盖
        - id: b
          label: 交割前软件经济性健康
        - id: c
          label: 真实企业 / 客户验证
        - id: d
          label: 可选工具 / 多平台并用风险
        - id: e
          label: 私有化期间收入、留存、债务不透明
        - id: f
          label: 公开可比公司倍数分散很大
        - id: g
          label: 收购方溢价估值需要强证据
        - id: h
          label: 观察 / 继续研究建议
      edges:
        - from: a
          to: g
          label: 支撑质量
        - from: b
          to: g
          label: 支撑质量
        - from: c
          to: g
          label: 支撑质量
        - from: d
          to: g
          label: 降低确定性
        - from: e
          to: g
          label: 卡住确信度
        - from: f
          to: g
          label: 约束定价纪律
        - from: g
          to: h
          label: 公开证据不足以买入
    approximationNotes: 该图呈现的是逻辑链，不是量化投资测算模型。
    claimRefs:
