  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与付费入口
        blocks:
          - type: paragraph
            body: >-
              Kahoot 的客户基础很宽，但经济属性差异很大。官方页面把买方和用户至少分成五个有意义的群体：K-12 教育者和学校领导、高等教育讲师和院系、企业学习与发展团队、使用 Kahoot! 360 或 Actimo
              式工作流的一线/非桌面员工运营方，以及 WHO
              等使命驱动的内容或外展合作伙伴。消费者和免费增值用户仍然重要，因为应用商店存在感和学校熟悉度似乎会播下后续职场采用的种子。关键尽调细节是，“客户”在这些分层中并不是同一件事。许多教育场景里，用户是教师，付款方可能是个人、学校或学区。企业里，买方通常是
              L&D、HR、合规或沟通，终端用户则是员工、经理或活动参与者。这种分层很重要，因为 Kahoot 的先落地再扩张动作，依赖于从个人采用或单一倡导者用例，进入更宽的组织部署。
