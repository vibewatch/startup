  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Kahoot 把广泛用户活动转化为多个细分市场的付费订阅、账单额、确认收入和高毛利。
    data:
      nodes:
        - label: 免费 / 病毒式使用
          note: 教师、学生、消费者和专业人士先从广泛平台使用与低摩擦方案进入。
        - label: 按细分市场的付费订阅
          note: 商业、教育、消费者与体验客群转化为付费账户。
        - label: 账单额 / 已开票收入
          note: 公开文件把账单额作为收入确认前的领先需求信号。
        - label: 确认收入
          note: 账单额转成收入时，会受递延收入确认节奏影响。
        - label: 高毛利
          note: 95% 毛利率说明，新增收入大多能沉淀下来，直接销售成本有限。
      edges:
        - from: Free / viral usage
          to: Paid subscriptions by segment
          label: 产品和品牌拉动采用，推动用户转向付费方案
        - from: Paid subscriptions by segment
          to: Billings / invoiced revenue
          label: 经常性计费把账户转为合同现金流入
        - from: Billings / invoiced revenue
          to: Recognized revenue
          label: 确认时点差异形成递延收入 / 合同负债
        - from: Recognized revenue
          to: High gross profit
          label: 低销售成本守住软件式利润率
    approximationNotes: 这是定性桥接；留存来源没有披露按细分市场拆开的完整收入确认瀑布。
    claimRefs:
