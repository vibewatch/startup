        - 教师套餐、学校套餐、测验 / 课程创建、形成性评估、报告、无障碍功能
        - 学生信息系统、完整学区 ERP、广义课程出版、通用设备采购
        - 教师使用；规模化后由学校或学区付款
        - Kahoot 历史核心切入点，也是最强品牌联想
      - - 学校 / 学区站点授权学习栈
        - 机构级互动、协作、SSO、LMS 连接、专业学习、文化建设活动
        - 核心 SIS、薪酬 / HR、州级报告系统；除非集成工作流会影响采购
        - 学校领导、学区管理员、课程或技术预算负责人
        - 从免费教师主导使用走向变现的重要一步
      - - 高等教育课堂互动与自学工具
        - 互动讲座、投票、Q&A、抽认卡、自学测验、报告、校园授权
        - 完整在线学位支持、注册系统、校园 ERP、纯监考软件
        - 授课教师推动；院系、教学中心或校园付款
        - 更贴近 LMS 和课堂录播生态，而不是独立学位平台
      - - 企业 L&D 与员工互动
        - 合规培训、入职培训、沟通、销售 / 产品赋能、全员会、分析、LMS / API 连接
        - 完整 HCM 套件、广义 HRIS、专业合规内容库；除非打包销售
        - L&D、HR、合规或职能赋能预算负责人
        - 可变现扩张空间很大，Kahoot 在这里争夺培训和互动预算
      - - 消费者 / 自助学习与家庭学习
        - 个人高级套餐、自学、家庭或学习者付费使用、长尾创作者活动
        - 机构合同和大多数正式 B2B/B2G 采购
        - 自助学习者或家长
        - 支撑漏斗和品牌分发，但作为合同预算池较不透明
      - - 相邻基础设施与替代品
