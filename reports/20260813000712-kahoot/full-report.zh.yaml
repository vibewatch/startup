      - number: '8.4'
        title: 建议、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，实际建议应是继续研究 /
              观察，而不是买入。这不是否定公司业务，而是承认一项私有化投资最关键的变量——当前收入、留存、债务、契约条款、分部结构以及企业扩张的真实质量——恰恰都是退市后变得不透明的变量。换句话说，上行空间可能存在，但仅凭公开材料还无法负责任地确认。退出准备度也参差。Kahoot
              有财务赞助方支持、全球知名度高、业务足够宽，能吸引战略买家或下一轮财务赞助方；但若未来重新上市，可能需要比现有公开记录更强的证据，证明企业端耐久性、AI
              变现、治理透明度和风险控制。投资人读本章，最该拿走的是入场纪律和尽调闸门。如果新增尽调证明私有化期间复合增长强劲、杠杆可控，投资逻辑可以迅速上调。若不能，产品看起来质量很高，反而可能成为陷阱：在价格已满的情况下掩盖有限的回报潜力。
