      - number: '3.4'
        title: 护城河耐久度与替代风险
        blocks:
          - type: paragraph
            body: >-
              Kahoot 最强的正面论据，是它没有困在一个狭窄利基里。不同于 Gimkit 或 Blooket，它有可信的学校、校园和企业打包。不同于 Slido 或 Mentimeter，它有更深的教育身份。不同于
              Coursera 或 2U，它不依赖自建或授权一个巨大的证书目录。这样的宽度有价值。但反向证据也不少。AI 创作已经不新鲜：Kahoot、Nearpod、Pear Deck、Mentimeter、Coursera
              和 2U 都宣传某种 AI 辅助内容创作或学习支持。SSO、分析和集成等企业管理功能也在标准化。与此同时，PowerSchool 和 Instructure
              可以利用基础设施控制和数据重力，把相邻功能打包进已经获批的栈；Duolingo 等专业品牌则能在日常习惯养成或有效性证据比现场活力更重要的狭窄领域，比 Kahoot 执行得更好。净尽调判断是：Kahoot
              的护城河中等，而不深。品牌、易用性和跨分层触达是真优势，但可见功能可复制，教师层切换成本低，机构买方已经有工作流所有权更强的替代方案。因此，Kahoot 必须持续把参与度转化成行政 ROI，而不只是乐趣。
