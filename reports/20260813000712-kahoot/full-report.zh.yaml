      - number: '6.4'
        title: 反向反馈与集中度盲区
        blocks:
          - type: paragraph
            body: >-
              反向记录并非灾难性，但是真实存在，并且直接关系客户质量。独立评论页面称赞 Kahoot 的参与度和易用性，同时也反复提出定价、免费功能有限、偶发延迟、无障碍或集成短板，以及 Kahoot
              最强之处是现场参与层，而不是完整的基于标准的 LMS
              或电子学习系统。这些批评重要，因为它们可能压住支付意愿、拖慢企业标准化，或鼓励与其他工具多栖使用。不过，更大的尽调缺口是集中度不透明。公开案例研究展示了可识别名称，但没有披露任何单一客户代表多少收入、合同跑多久，或企业席位是否高比例续约。因此，Kahoot
              有强轶事客户证明和不错的宽度信号，但在承销私人公司收入质量最关键的精确耐久度和集中度指标上，公开披露仍弱。这个缺口应该始终放在投资人通话的中心。
