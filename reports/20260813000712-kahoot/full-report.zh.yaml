      - CV007
      - CV009
      - CV019
      - CV020
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 收入规模和所用倍数主导估值结果；信息不透明和可选工具风险会很快压低倍数。
    data:
      items:
        - label: 乐观情景收入 @ 9x
          value: 2.16
        - label: 乐观情景收入 @ 8x
          value: 1.92
        - label: 基准情景收入 @ 6x
          value: 1.26
        - label: 基准情景收入 @ 5x
          value: 1.05
        - label: 悲观情景收入 @ 4.5x
          value: 0.77
        - label: 悲观情景收入 @ 3.5x
          value: 0.6
    approximationNotes: 使用代表性情景中点（乐观 $240M、基准 $210M、悲观 $170M），而非管理层指引。
