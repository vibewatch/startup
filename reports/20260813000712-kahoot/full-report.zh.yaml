        - 独立评论在定价、延迟或 LMS 适配上恶化，同时扩张证据转弱
        - 负面评论趋势持续，且具名客户成果停滞
        - 假设 Kahoot 正变成可选互动层，而非核心平台
      - - 资本结构压力
        - 出现再融资压力、契约收紧，或与杠杆相关的成本削减证据
        - 任何为保债务偿付而削减产品 / 安全投资的收购方动作
        - 重新测算下行情景，并把杠杆作为主驱动
