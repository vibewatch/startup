figures:
  - id: FO001
    title: 公司快照逻辑
    type: flow
    layout: wide
    summary: Kahoot! 把一个源自学术研究的测验产品，接到更宽的学校、职场和应用组合上；规模已经足以吸引私募股权买方出手。
    data:
      nodes:
        - id: n1
          label: NTNU 研究起点
          description: 公司起步于游戏技术研究和一个 2012 年与 NTNU 相关的创业项目。
        - id: n2
          label: 游戏化核心平台
          description: 旗舰产品把实时测验做成可规模化的参与工具，覆盖课堂、家庭和组织。
        - id: n3
