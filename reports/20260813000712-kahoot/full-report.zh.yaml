      - number: '2.4'
        title: 增长驱动、约束与尽调判断
        blocks:
          - type: paragraph
            body: >-
              当前最强顺风仍是灵活交付、AI 技能升级，以及机构需要衡量参与度和理解程度，而不只是发布静态内容。LinkedIn 2024 年职场调查同时显示留存压力和强劲 AI 技能需求；CHLOE 和 EDUCAUSE
              则显示，高等教育仍面临持续在线需求、更激烈竞争，以及 AI 扩散带来的快速测评变化。EU 数字教育政策页面和 NCES
              公共财政材料说明，数字学习仍是活跃的政策和基础设施主题，而不只是疫情异常值。但逆风同样真实。PowerSchool 描述了 K-12 的预算约束、教师短缺和合规复杂度；CHLOE
              显示高等教育机构准备度只是不完全；Mordor 和其他市场报告提示隐私、网络安全、数字疲劳和实施成本；Coursera 文件则明确警告，生成式 AI
              既可能扩大再培训需求，也可能整体替代部分在线学习。尽调含义是：Kahoot 所在市场持久，但并不无摩擦。最可能增长的地方，是产品能在已经拥挤的机构和企业栈里证明工作流契合、参与度提升和低行政负担。
