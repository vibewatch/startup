  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入约 $240M-$280M，企业收入占比提升，留存强，杠杆可管理，隐私 / 风险画像稳定
        - ~8x-9x 收入对应约 $1.9B-$2.4B EV；收购方入场价仍可能跑通，并存在上行空间
        - 需要公开看不到的优质证据
        - 可能成立，但未证实
      - - 基准
        - 收入约 $190M-$230M，增长放缓，存在杠杆但可管理，可选工具折价延续
        - ~5x-6x 收入对应约 $1.0B-$1.4B EV；低于收购方入场价，只有买得更便宜时才有温和吸引力
        - 留存不透明、私有化杠杆不清，让折价继续存在
        - 最符合公开信息的不确定性
      - - 悲观
        - 收入约 $150M-$190M，增长转弱，评论恶化，买家多栖，杠杆变成硬约束
        - ~3.5x-4.5x 收入对应约 $0.5B-$0.9B EV；收购方入场价明显亏损
        - 如果企业耐久性被高估，可选价值会迅速收缩
        - 若私有数据不及预期，反向情景仍属合理
    notes: 这些区间是以公开可比公司和已知 Kahoot 公开基线为锚的情景启发式判断，不是基于管理层指引的 DCF。
