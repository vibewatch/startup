      - number: '3.2'
        title: 能力、打包与定价重叠
        blocks:
          - type: paragraph
            body: >-
              买方的实际比较从打包开始，而不是品牌。Kahoot 覆盖课堂、高等教育和企业；其高等教育打包暴露透明自助定价，而更大的 EDU 和企业动作走向报价制或销售主导合同。Mentimeter 和 Slido
              在观众互动上走类似的免费增值到企业路径，但两者比 Kahoot 更偏演示中心，而不是学校工作流中心。Nearpod 和 Pear Deck 则更深进入日常教学运营：它们强调 AI
              生成课程、测评、教学规划、学区资源库、报告和 LMS/LTI 集成，因此常被作为更宽教学工作流的一部分来评估，而不是课堂某一刻的参与工具。相比之下，ClassDojo 主要是沟通和社区层。Duolingo
              更专门：它是一个形成习惯的消费者学习产品，在特定学科里靠游戏设计和有效性竞争，而不是靠课堂编排。结果是，许多买方完全可以多栖使用。一个学区可以用 Canvas 加 Pear Deck；一个教师同一周可以用
              Kahoot 和 Blooket；一家企业可以会议用 Slido、培训用 Kahoot。这让能力重叠度很高，单一功能差异化很脆弱，除非 Kahoot 能把参与度接到更大的行政或报告工作流上。
