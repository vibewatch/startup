      - number: '2.2'
        title: 市场规模视角与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据很多，但很难干净对比。最宽口径下，IMARC 估计 2025 年全球电子学习为 $369.7 billion；它只适合作为外围背景，因为其中混合了远超 Kahoot
              直接范围的学术、企业和平台层。在职场学习内部，已发布的企业电子学习估算已经明显分化：Grand View 从 2024 年 $104.3 billion 起算，Mordor 从 2026 年 $115.7
              billion 起算，Fact.MR 从 2026 年 $132.6 billion 起算，Fortune Business Insights 从 2026 年 $157.4 billion
              起算。游戏化学习估算也差异很大，从 Market.us 2023 年 $14.0 billion，到 Global Market Insights 2023 年 $23.45 billion，再到
              Credence 2024 年 $21.29 billion。矛盾有意义，因为各发布方似乎在教育、企业培训、内容和使能软件之间划出了不同品类边界。可辩护的结论不是挑一个“真实”
              TAM，而是保留一组相邻视角：广义数字学习作为外围背景，企业电子学习作为最大可变现职场池，游戏化学习作为最接近 Kahoot 历史品牌的主题类比。本次保留的公开来源没有隔离出精确的仅针对 Kahoot 的 SAM
              或 SOM。
