        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营/安全图景是混合的：Kahoot 有清晰的控制投入证据，但运行质量的公开证据只是一部分。Trust Center 和透明度报告描述了安全培训、再认证工作、供应商尽调和内容安全政策。独立外部风险工具仍把
              Kahoot 描述成一个被监测、非平凡的攻击面，而不是无风险域名。Site24x7 给出 B / 71 外部安全分，UpGuard 强调其对网站、邮件、钓鱼、品牌和网络类别做 330+
              项连续检查。公开状态页也重要，因为它证明 Kahoot 预期并披露维护窗口。这些都不意味着公司弱；它们意味着一家被学校和企业使用的云学习平台，正暴露在符合预期的风险中。主要风险不是 Kahoot
              没有任何缓释措施，而是外部人仍无法在供应商和公司可控页面之外，验证事故频率、SRE 成熟度、滥用率，或私有化期间技术栈的真实安全姿态。
