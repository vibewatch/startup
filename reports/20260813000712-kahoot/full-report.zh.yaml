      - number: '6.3'
        title: 留存、重复使用与扩张代理信号
        blocks:
          - type: paragraph
            body: >-
              Kahoot 没有公开披露那些能让投资者干净承销客户耐久度的指标。本次开放网络记录里，没有保留
              NRR、GRR、客户标识流失、续约率、平均合同期限或头部客户收入集中度。不过，案例研究提供了重复使用代理信号。Lely 描述 2019 年从试点开始，后来在大部分学院培训中使用
              Kahoot，并延伸到客户教育。Aviva 描述采用从中央 L&D 团队扩散到合规、QA、IT 和承保，也进入数百人参与的全员会议。Fran García 案例显示，教师主导使用成功后扩张成全校许可证；Hills
              Grammar 则描述教育者拉动，而不只是自上而下推动。这些不能替代队列留存数据，但支持一种判断：Kahoot 常通过倡导者主导的重复使用扩张，而不是一次性新奇场次。耐久度问题在定量上仍开放，定性上偏正面。
