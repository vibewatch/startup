  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - AI 技能提升与 AI 辅助内容创作
        - 顺风
        - 当前至中期
        - 拉动企业和高教对互动培训的需求，也改进 Kahoot 式内容创作工作流
        - 最近 Kahoot 采用中，有多少比例与 AI 相关培训或 AI 辅助创作有关？
      - - 灵活、混合与远程学习 / 工作流
        - 顺风
        - 持续
        - 支撑学校、高校和分布式团队的数字化交付
        - Kahoot 使用中，有多少是异步使用或嵌入混合工作流，而不是纯直播课程 / 会议？
      - - 数字教育政策与基础设施支持
        - 顺风
        - 当前至 2027 年
        - EU 和学校体系的数字化优先事项，让互动学习支出仍在规划中
        - 哪些地区有明确公共资金项目，能对应到 Kahoot EDU 采购？
      - - 报告、分析与集成需求
        - 顺风
        - 当前
        - 利好能接入 LMS、SSO 和企业身份工作流的供应商
        - 集成在多大频率上决定胜率或扩张 ACV？
      - - K-12 预算约束与人员压力
        - 逆风
        - 当前
        - 学区可能认可互动工具价值，但预算承压时会推迟或缩小付费推广
        - EDU 交易中有多少比例卡在学区预算周期或人员限制？
      - - 高等教育竞争与 AI 准备度不均
        - 逆风
        - 当前至中期
        - 高校想要灵活学习，但预算吃紧，评估方式被 AI 冲击，工具栈也拥挤
        - 哪些高教客户队列续约最好？需要什么价值证据？
      - - 隐私、安全与采购摩擦
        - 逆风
        - 当前
        - 企业和机构买方在扩张前越来越常要求合规审查
        - 各细分市场和地区的平均安全 / 采购周期多长？
      - - 落地成本、内容维护与数字疲劳
        - 逆风
        - 持续
        - 低质量或嵌入不深的游戏化，即便在增长市场中也可能拉低完成率和续约
        - 哪些使用率和完成率基准能区分高表现 Kahoot 账户和浅层采用者？
    notes: 关键市场问题不是数字化学习是否增长，而是在采购审查和 AI 驱动的平台变化之后，品类中哪些部分还能拿到预算。
