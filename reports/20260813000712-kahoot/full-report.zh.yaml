  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 从直接同业到既有巨头的格局
        blocks:
          - type: paragraph
            body: >-
              Kahoot 的竞争集比简单的“测验应用”列表更宽。在直接功能层，Mentimeter、Gimkit 和 Blooket 都争夺现场观众参与、快速理解检查和游戏化激励。Nearpod 和 Pear Deck
              是更接近的课堂对手，因为它们把互动与课程交付、测评和正在增长的 AI 内容生成工作流结合起来。在企业和混合会议里，Slido 和 Mentimeter 与 Kahoot 的演示、投票、Q&A
              和培训用例高度重叠；Miro 则是更宽的协作替代品，可以吸收一部分工作坊式互动。不过，更危险的长期竞争者是既有控制点。Instructure 和 PowerSchool 已经更深地嵌在机构工作流里，拥有
              LMS、SIS、分析、合规，以及 Kahoot 不控制的学区或校园采购关系。与这些工作流既有玩家分开的，是 Coursera、2U 和 Duolingo
              等专业学习品牌；它们不太争夺现场场次的活力，更争夺内容目录深度、证书、习惯养成和可衡量学习结果。结果是，Kahoot
              很少只面对一类对手：几乎每个采购动作里，它都会同时被拿来同更轻的参与工具、更重的机构套件，以及既有内部自建方案比较。
