  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Kahoot 最明显的风险面是隐私和监管合规。产品被儿童、学校和职场广泛使用，因此处在 COPPA、FERPA、GDPR、儿童数据设计预期，以及普通消费者/隐私义务的交叉点。Kahoot
              自己的透明度和信任材料承认，集团暴露于 GDPR 和隐私问题，必须随着产品和法律演变持续改进控制。这不是假设性的合规领域：FTC 的 COPPA 指引、FERPA
              框架和英国儿童信息指引，都说明一旦涉及未成年人或学生记录，规则会有多严格。Kahoot 的确有有意义的缓释项——SOC 2、ISO
              27001、隐私项目、可接受使用/编辑政策，以及不出售个人数据、不用终端用户数据训练 AI 的明确表述——但法律暴露仍然高，因为一次涉及儿童或学校数据的重大失误，就可能同时触发监管审查、客户不信任和合同摩擦。
