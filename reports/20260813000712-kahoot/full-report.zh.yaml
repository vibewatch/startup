      - number: '5.3'
        title: 信任、隐私与控制平面
        blocks:
          - type: paragraph
            body: >-
              Kahoot 的信任姿态比核心基础设施披露更明确。Trust Center 强调基于 PIN 的无账号参与、最小化数据设计、不出售个人数据、无第三方广告，也不使用终端用户数据训练 AI。同一批页面还营销
              SSO、名册同步、留存、删除、SCIM、域名声明和导出/报告能力等企业控制。对学校买方来说，这与原始功能数量一样重要，因为采购越来越要求 FERPA、COPPA、GDPR 和审计导向控制的证据。公开文档还引用
              SOC 2、ISO 27001、1EdTech certification 和 Common Sense Privacy verified
              seal。不过，公开记录仍达不到完整技术尽调：本次没有保留公开架构图、uptime SLA、云服务商披露、加密设计文件，或详细事故复盘库。状态页有用，因为它证明 Kahoot
              运行外部可靠性界面，但不能替代正式安全尽调。
