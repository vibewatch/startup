companyProfile:
  summary: >-
    Kahoot! 是一家总部位于 Oslo 的挪威学习平台，2012 年由 Morten Versvik、Johan Brand 和 Jamie Brooker 创办，学术根基来自 NTNU；随后 Åsmund Furuseth
    延续管理层参与，现任 CEO 为 Eilert Giertsen Hanoa。公司把互动软件铺到 K-12、高等教育、消费者学习和企业培训，之后在 2024 年 1 月由 Goldman Sachs Asset Management
    牵头的财团以 NOK 35/股收购并私有化。本次保留的公开证据显示，这是一项真正有规模的软件资产：600+ 员工、过去 12 个月 10M+ 教师主持 kahoots、声称触达 95%+ Fortune 500、95%
    毛利率、经营现金流为正，并有 Virgin Atlantic、Aviva Canada、El Jannah、Lely 等具名企业部署。投资判断难点不在于 Kahoot 是否真实，而在于退市后最影响决策的指标已经不再公开。
