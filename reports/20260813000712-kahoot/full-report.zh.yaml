  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类结构
        blocks:
          - type: paragraph
            body: >-
              给 Kahoot! 划市场边界，最干净的方式不是“全部教育科技”，甚至不是“全部电子学习”，而是学校、高等教育和职场里互动学习交付、测评和参与的较窄交集。Kahoot
              自己的产品页面也强化这一点。学校工作流页面围绕教师创建测验、布置自定节奏挑战、用报告做形成性评价。Kahoot! EDU 再把它扩展到学区和学校系统采购动作，包含 SSO、LMS
              集成、教师专业学习和全机构部署。高等教育定位略有不同：高等教育页面强调课堂参与、自学、Q&A、报告和机构许可证。企业产品又不同，覆盖合规培训、入职、沟通、会议和活动，并带有 SSO/SCIM、分析和报告 API
              钩子。这意味着 Kahoot 争夺的是教学、测评和员工参与预算的一部分，而不是 SIS、LMS、完整在线学位交付或 HR 套件里的所有软件支出。主要既有替代方案也因分层而异：K-12
              里的免费课堂工具和幻灯片，高等教育里的 LMS 原生测验和讨论工具，企业场景里的讲师主导培训加协作软件。
