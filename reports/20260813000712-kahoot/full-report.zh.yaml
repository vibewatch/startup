      - number: '2.3'
        title: 买方、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Kahoot 的采购中心因分层而大幅变化。K-12 里，日常用户是教师；但官方 EDU 打包和 PowerSchool
              的市场表述都指向学校、学区和系统，一旦采购超出免费或个人计划，经济买方就是它们。高等教育里，直接倡导者通常是讲师或教与学团队，但机构部署取决于院系、校园或中央数字学习预算，也取决于能否兼容现有 LMS
              工作流。企业里，用户可能是培训师、团队负责人或演示者，付款方则可能坐在 L&D、HR、内部沟通、合规或职能赋能预算里。这解释了为什么集成如此重要：Instructure 文件显示，现代学习栈对 LTI/API
              生态依赖很深；Kahoot 自己的企业页面强调 LMS
              连接、协作工具承载、自动化报告和集中用户管理。因此，采用路径往往从自下而上的使用或小团队试用，走向更正式的安全、采购、身份和分析审查，之后才可能做学区、校园或全企业推广。消费者/家庭长尾仍对品牌触达有价值，但不是最清晰的机构收入池。
