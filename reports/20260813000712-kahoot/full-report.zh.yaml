  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位、起源与运营版图
        blocks:
          - type: paragraph
            body: >-
              今天看
              Kahoot!，最准确的定位是全球学习与参与平台，而不只是课堂测验工具。公司官方材料称其服务学校、工作和家庭场景；当前主页把个人和教育者方案、面向专业人士的员工参与平台，以及高级应用和内容组合分开呈现。创始故事锚点很扎实。Kahoot!
              称，Morten Versvik、Johan Brand 和 Jamie Brooker 在与 Norwegian University of Science and
              Technology（NTNU）的联合项目中于 2012 年创办公司，Åsmund Furuseth 后来加入；NTNU 自有材料也确认，产品来自 Versvik 在 Alf Inge Wang
              教授指导下的硕士研究。公司 2013 年公开上线，随后从游戏化测验扩展成更宽的多应用套件，现在包括 Clever、DragonBox、Poio、Drops、Actimo 和
              Motimate。规模信号强，但分母口径敏感。当前公司页面称，Kahoot! 自 2013 年以来累计承载超过 14 billion 名参与者，过去 12 个月有超过 10 million 名教师使用，并触达
              95%+ Fortune 500 公司和顶尖大学。足迹数据也混杂，但方向清楚：Kahoot! 称总部在 Oslo，目前在美国、英国、法国、新加坡、澳大利亚、日本、芬兰、爱沙尼亚、丹麦、西班牙和波兰等办公室拥有
              600+ 名同事；最后几份公开季报列出的办公室版图略窄。尽调判断是：这是一家以挪威为锚点的全球平台，退市后公开营销足迹仍在演进。
