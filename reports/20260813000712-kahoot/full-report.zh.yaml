      - number: '7.3'
        title: 合作伙伴、客户与模式风险
        blocks:
          - type: paragraph
            body: >-
              Kahoot 战略上很宽，但这种宽度带来依赖和模式风险。产品依托应用商店、协作套件、身份系统、名册/隐私生态，以及教师或 L&D 团队在 LMS、视频和文档工具之外再使用一个参与层的意愿。Partnerbase
              和当前产品页面显示，公司依赖 Google、Microsoft、Zoom 等生态；客户案例研究则显示，价值常通过分析、作业或集成浮现，而不是通过独立锁定产生。这带来两个问题。第一，Kahoot
              暴露于它无法控制的大平台政策或 API 变化。第二，即便采用成功，也可能与多栖使用并存，意味着 Kahoot 可能仍是补充层，而不是核心记录系统。评论来源通过批评定价、基于标准的 LMS
              适配有限，以及偶发延迟或打磨问题，进一步强化这个风险。如果预算压力上升，这正是一类买方可能先削减或限制、再考虑移除主 LMS 或协作栈的工具画像。
