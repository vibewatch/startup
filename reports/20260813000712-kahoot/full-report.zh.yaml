      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              私有化前的资本充足性看起来合理。FY2022 到 Q2 2023 期间，Kahoot 报告集团层面现金余额在 $88.7 million 到 $104.8 million
              之间，经营现金流为正，且无计息债务。这不是一家面临立即紧急融资的公司的画像。不过，这也是一家不再按高速增长估值的公司画像。因此，2023 年 7 月要约文件很关键。文件将 Kahoot 估值为 NOK 17.2
              billion（每股 NOK 35），约 $1.72 billion，并描述其隐含估值倍数约为过去 12 个月收入的 10x、过去 12 个月调整后 EBITDA 的
              40x。要约材料还称，交易融资所需的股权和债务资本承诺已经到位，这意味着融资依赖从公开运营公司迁移到了收购结构。悬而未决的问题是成交后的不透明。本次保留的公开记录没有披露收购主体债务结构、成交时任何再融资、赞助方杠杆目标，或私人所有权如何改变资本配置优先级。实际看，最后一个公开季度的流动性足够；但由于债务包和当前收入基数都已私有化，无法用公开来源承销今天的资本充足性。
