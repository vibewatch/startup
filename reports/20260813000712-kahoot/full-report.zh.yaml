  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 竞品
      - 价格 / 单位 / 合同模式
      - 包含能力
      - 折扣 / 未知项
      - 含义
    rows:
      - - Kahoot!+ Higher Ed
        - 自助版起价 $3/month（按年计费）或 $9（按月计费）；更高层级也公开展示
        - 直播测验、AI 内容创作、报告、语言支持；更丰富层级提高玩家上限
        - 全机构 EDU 定价按报价
        - 透明自助入口利于采用，但规模化合同仍走销售主导
      - - Mentimeter
        - 免费层；Basic 和 Pro 按演讲者 / 月付费；Custom 企业层
        - 投票、Q&A、幻灯片导入、协作；Custom 层提供企业 SSO/SCIM
        - 此摘录未完整保留付费席位价格
        - 以演示为入口的免费增值打法，在直播互动用例中正面竞争
      - - Nearpod
        - 个人 Silver/Gold/Platinum 许可，加上学校 / 学区按报价许可
        - 参与人数上限、报告、LMS/LTI、AI Create、学区协作；较大方案配 CSM
        - 企业 / 学区定价需询价
        - 机构打包更深，也比轻量听众反馈工具更偏工作流
      - - Pear Deck Learning
        - 教师免费工具；购买 Pear Deck、Pear Practice 和 / 或 Pear Assessment 的客户包含学区功能
        - AI 课程生成、评估、进度报告、学区资源库和政策控制
        - 保留证据中，公开按席位定价不透明
        - 学区打包方案即便没有简单公开标价，也可能很黏
      - - Slido
        - 永久免费的 Basic 计划；付费版每月 €15 起；可提供企业打包方案
        - 投票、问答、测验、分析、导出、企业级安全功能
        - 大型组织价格定制
        - 在会议、培训和讲座式听众互动中，是很直接的替代品
      - - ClassDojo
        - 面向教师的产品定位为免费
        - 消息、简报、全校沟通、翻译、校领导可见性
        - 本次留存材料没有明确保留变现模式
        - 学校沟通层有强免费替代性，但不替代测评
      - - Gimkit / Blooket
        - 公开产品入口可见，但本次未留存可靠定价细节
