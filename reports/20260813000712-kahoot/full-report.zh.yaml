    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据只能支撑较宽的价值区间，基准情景仍低于 2024 年收购方交易价值。
    data:
      items:
        - label: 悲观情景 EV
          low: 0.5
          base: 0.7
          high: 0.9
        - label: 基准情景 EV
          low: 1
          base: 1.2
          high: 1.4
        - label: 乐观情景 EV
          low: 1.9
          base: 2.15
          high: 2.4
        - label: 收购方交易锚点
          low: 1.72
          base: 1.72
          high: 1.72
    approximationNotes: 这些数值只是以十亿美元计的粗略情景区间，不构成正式公平性意见。
    claimRefs:
      - CV002
      - CV026
      - CV028
      - CV030
