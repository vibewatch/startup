      - number: '1.2'
        title: 管理层、治理与资本所有者
        blocks:
          - type: paragraph
            body: >-
              管理层可见度是公开记录里较干净的一块。Kahoot! 当前领导团队页面列明 Eilert Giertsen Hanoa 为 CEO，并说明他 2014 年首次投资、曾任董事长、2019 年出任 CEO；联合创始人
              Åsmund Furuseth
              仍以首席产品官身份承担可见运营角色。更宽的高管层现在覆盖技术、解决方案、客户体验、收入、运营、公司发展和法律，说明公司按已具规模的软件平台组织，而不是只靠创始人驱动。治理也比许多私人软件公司更清晰，因为
              Kahoot! 仍发布当前董事会名单。Gavin Patterson 现任董事长，董事来自 Microsoft、Cambium、Schibsted、Goldman Sachs Asset Management 和
              General Atlantic，另有员工代表。这给 Kahoot! 带来有意义的治理深度，但也凸显收购后的现实：控制权现在位于投资人占比较重的结构里，而不是纯粹由创始人领导的上市公司框架。资本所有权在
              2023-2024 年私有化交易中大幅变化。要约文件显示，Goldman Sachs Asset Management 与 General
              Atlantic、KIRKBI、Glitrafjord、其他投资者和管理层股东共同组建 Kangaroo BidCo；要约发起时，约 34.2%
              股本已通过再投资协议和承诺锁定。董事会在排除有利益冲突成员后，一致建议接受每股 NOK 35
              的现金要约。因此，公开证据支持这是一家有资深运营者和真实财务赞助方背书的公司；但成交后精确持股比例、治理权利和债务包，并不能从公开来源完全看清。
