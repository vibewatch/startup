      - number: '8.3'
        title: 情景与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              私有化后的财务数据缺席，情景框架应当简单且明确。乐观情景需要看到几项证据：Kahoot
              相比最后一个公开基准有明显复合增长，把更多收入推向质量更高的企业或机构客户群，并在不挤压产品、合规和市场投入的情况下管住财务赞助方杠杆。在这种情景下，高个位数收入倍数仍能成立，也能支撑不低于财务赞助方入场价的企业价值。基准情景没那么宽松：它假设公司有一定增长，但不足以消除互动层折价，也不足以消除私有化杠杆和留存披露有限带来的不透明折价。按这个情景看，Kahoot
              像是一家好公司，但不明显是一笔低估资产。悲观情景很直接：增长放慢，功能同质化加剧，买方多平台并用，公司又无法证明企业客户群足够耐久或杠杆压力可控。公开可比公司显示，一旦市场不再给教育软件战略稀缺性溢价，下行可以很重。因此，即便从战略上看好
              Kahoot，也不应自动推导出任何价格都能通过投资测算的结论。
