      - number: '8.2'
        title: 估值背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              最干净的公开锚点仍是赞助方交易。2023 年 7 月要约材料将 Kahoot 估值为 NOK 17.2 billion，约 $1.72 billion，或大约过去 12 个月收入的 10x、过去 12 个月调整后
              EBITDA 的 40x。相较 2026 年公开教育和学习软件公司组，这是一个激进倍数。Duolingo 仍享有溢价市值，因为市场看见强增长和差异化参与护城河。Coursera 按收入交易明显更低，Udemy
              更低；Chegg 和 2U 等承压模式则显示，当增长变慢、护城河变弱或战略不确定时，市场折价会非常残酷。可比公司给出的教训不是 Kahoot 应该落在困境区间；Kahoot
              的现金生成、宽品牌和企业证明都好于那一端。教训是，溢价价格需要溢价证据。当前保留的公开证据还不能证明 Kahoot 值得 Duolingo
              式溢价，也当然不能消除滑向更低估值带的风险；那些估值带对应的是泛化、可选或结构承压的学习资产。因此，只有在当前收入和留存强于公开记录目前可验证水平的世界里，赞助方价格才看起来守得住。
