  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: sample
      basis: >-
        This table is a curated comparable set spanning premium gamified learning, broad online learning, distressed
        education software, and Kahoot’s own transaction anchor.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Kahoot 私有化交易
        - 按要约材料，约 $1.72B EV，对应约 10x LTM 收入 / 约 40x 调整后 EBITDA
        - 高溢价私募买方交易锚点
        - 本公司的直接估值参照
        - 交割前价格，不是当前标记价值
      - - Duolingo
        - 约 $6.29B 市值，对应约 $1.09B TTM 收入（约 5.8x）
        - 最佳公开高溢价游戏化学习可比公司
        - 显示更强护城河 / 增长画像可拿到的估值
        - 消费者语言学习 / 应用习惯循环不同于 Kahoot
      - - Coursera
        - 约 $1.47B 市值，对应约 $0.77B TTM 收入（约 1.9x）
        - 规模化在线学习 / 证书可比公司
        - 有用的中位市场参照
        - 业务模式组合和证书深度不同
      - - Udemy
        - 约 $0.67B 市值，对应约 $0.78B TTM 收入（约 0.9x）
        - 增长较慢的广义市场平台 / L&D 可比公司
        - 说明广义学习平台会遭遇估值压缩
        - 市场平台模式不同于 Kahoot 的互动形式
      - - Chegg
        - 约 $88.85M 市值，对应约 $0.31B TTM 收入（约 0.3x）
        - 教育软件的反向结果
        - 显示模式压力加大时，市场情绪会多快坍塌
        - 商业模式和 AI 冲击不同于 Kahoot
      - - 2U
        - 最后已知约 $4.43M 市值，对应约 $0.86B TTM 收入，且 2024 年股价表现约 -95.5%
        - 极端困境参照
        - 界定杠杆 / 模式压力主导时的下行情景
        - 困境可比公司，不是核心基准可比公司
    notes: Duolingo 与 2U / Chegg 之间的差距才是关键：公开市场奖励证据，惩罚模糊。
