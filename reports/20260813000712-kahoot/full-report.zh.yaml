        title: 资本结构与投资逻辑破裂风险
        blocks:
          - type: paragraph
            body: >-
              私有化后最重要的财务模型风险是不透明。成交前 Kahoot
              不像陷入困境的运营公司：公开文件显示现金、高毛利率，且运营公司层面无计息债务。收购带着已锁定的股权和债务承诺完成后，风险迁移进赞助方结构。这意味着投资者现在面对一个典型的私募股权信息问题：如果增长放缓、获客变贵，或学校对预算更敏感，外部观察者无法公开看见杠杆、契约条款或再融资压力。再叠加客户侧未知项——NRR、GRR、头部账户集中度、续约率——仅靠公开信息很难界定
              Kahoot 的剩余下行。实际做法是围绕可衡量事件定义投资逻辑破裂触发器：隐私事故、无法维持合规姿态、重复可靠性问题、可见评论恶化，或证据显示杠杆而非产品质量正在驱动战略决策。
