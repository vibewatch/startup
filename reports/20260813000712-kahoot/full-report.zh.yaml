      - CI008
      - CI023
      - CI028
  - id: FI002
    title: 单位经济模型桥
    type: flow
    layout: wide
    summary: 公开口径下，单位经济模型最能站住的是利润率和现金转化；CAC 和留存仍是短板。
    data:
      nodes:
        - label: 付费订阅
          note: 1.3M+ 个付费订阅构成漏斗顶部的经济基础。
        - label: ARR 增长
          note: ARR 从 FY2022 的 $156M 升至 Q2 2023 的 $163.5M。
        - label: 95% 毛利率
          note: 作为教育平台，Kahoot 的毛利转化异常高。
        - label: 调整后 EBITDA 和现金流
          note: 盈利能力和现金转化在最后一个公开季度仍为正。
        - label: 缺失的留存 / CAC 层
          note: NRR、流失率、CAC 和回本周期是主要未解堵点。
      edges:
        - from: Paid subscriptions
          to: ARR growth
          label: 经常性账户支撑收入可见度
