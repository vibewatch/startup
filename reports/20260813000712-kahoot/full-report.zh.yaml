      - number: '1.3'
        title: 规模、财务里程碑与反向读数
        blocks:
          - type: paragraph
            body: >-
              Kahoot! 最后一批公开文件显示，私有化前公司已跨过有意义的规模门槛，但市场不再给它疫情期倍数。2022 年四季度报告给出最清楚的全年基准：确认收入 $146
              million、账单额（billings）$169 million、调整后 EBITDA $30.3 million、现金 $104.8 million、无计息债务，付费订阅超过 1.3 million。Q1
              2023 和 Q2 2023 延续了这个画像：收入分别升至 $40.5 million 和 $41.3 million；ARR 先到 $159 million、再到 $163.5 million；付费订阅从
              1.345 million 增至 1.365 million；现金维持在约 $90-97 million。这些数字支持一个毛利率好、具备经常性收入特征、经营现金流为正的业务，但不是 2020-2021 年公开
              SaaS 投资者追捧的爆发式增长。反向信号更多指向轨迹，而不是崩盘。2022 年报告中，管理层坦率表示，宏观环境、销售周期拉长和年末商业执行偏弱，导致收入增长低于预期。TechCrunch 将 2023
              年要约描述为较 Kahoot! 疫情峰值大幅下调，也是后 COVID 估值重置波及数字学习和其他软件公司的症状。CNBC 2020 年报道显示情绪摆动有多大：SoftBank 投资曾隐含约 $2.2
              billion 市值，而 2023 年最终要约给股权的估值约为 $1.7 billion。核心尽调结论是：Kahoot!
              规模和盈利能力仍足以吸引赞助方，但发生在公开市场热情、也很可能是公开增长预期，已经大幅压缩之后。
