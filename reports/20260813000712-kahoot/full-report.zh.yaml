      - number: '5.2'
        title: 架构、集成与交付模式
        blocks:
          - type: paragraph
            body: >-
              尽管 Kahoot 没有公开核心云栈，公开文档仍支持一个分层 SaaS 架构。面向用户的客户端覆盖 Web、iOS、Android，以及 Microsoft Teams
              等合作伙伴环境里的嵌入式体验。内容可以手工创作，也可以从主题、PDFs、URLs、Wikipedia
              文章和同步幻灯片生成。分发随后分叉到现场游戏、讲座或演示形式、作业、自学和企业培训场次。边缘集成证据很强：Microsoft Teams、Zoom、Google Slides、PowerPoint、Google
              Classroom、RingCentral 和一系列 LMS 平台都出现在当前集成页面。数据侧，Kahoot 暴露了报告 API，明确基于 REST/OpenAPI，用 JWT bearer tokens
              认证，面向有数据团队或开发者的客户。这意味着 Kahoot 有有意义的管理/报告面，但不像开发者优先公司那样拥有宽泛的公开开放平台。
