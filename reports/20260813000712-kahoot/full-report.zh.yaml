      - number: '4.2'
        title: 公开牵引力与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Kahoot 公开财务记录里最强的一点，是规模和利润率同时存在。Q4 2022 报告显示，收入 $146.0 million、账单额（billings）$169.0 million、95% 毛利率、调整后
              EBITDA $30.3 million、调整后经营现金流 $42.7 million、现金 $104.8 million，且无计息债务。Q1 2023 和 Q2 2023 延续这个模式：收入先升至 $40.5
              million、再到 $41.3 million；ARR 从 $159.0 million 增至 $163.5 million；调整后 EBITDA 从 $10.0 million 增至 $11.0
              million；付费订阅从 1.345 million 增至 1.365 million。文件也保留了获客效率线索。管理层明确把 Q4 订阅增长与病毒式和自然渠道带来的极低 CAC 联系起来；到
              Q2，公司强调已连续 15
              个季度经营现金流为正。合在一起，这些指标指向的收入质量，比最终私有化标题本身暗示的更好：经常性订阅经济、有限销售成本、正现金生成和有意义的递延收入余额。代价是，公开可见度在真正承销变难的地方停止。本次没有保留公开
              CAC、NRR、总流失率、分部利润率或实际定价桥，因此单位经济故事方向不错，但仍不完整。
