      - number: '3.3'
        title: 分发、锁定与多栖使用
        blocks:
          - type: paragraph
            body: >-
              这个品类的竞争耐久度，不太取决于谁有最好的测验机制，更取决于谁控制买方已经信任的工作流。PowerSchool 和 Instructure
              的文件把这个逻辑说得很明确：两家公司都把自己定位成集成式、云端学习基础设施，带有数据、分析和行政重力，学区和校园每天都要依赖。Nearpod 和 Pear Deck
              也在朝这个方向移动，把课程创建、测评、报告和学区功能嵌入日常教学。Kahoot 自己也有有意义的分发优势，尤其是可识别的消费者教育品牌，以及现在跨学校、高等教育和职场的产品面。但这些优势弱于拥有记录系统或
              LMS。因此，切换成本分成两层。教师、培训师或演示者层面切换成本低，多栖使用常见，同一用户能在 Kahoot、Mentimeter、Slido、Gimkit 或 Blooket
              之间几乎无摩擦切换。机构层面的成本更高，因为 SSO、名册、LMS/LTI、分析、合规和客户成功动作都重要。因此，Kahoot
              的护城河在出售工作流契合和行政简化时增强；当采购被定义成又一个互动场次工具时，护城河就会变弱。
