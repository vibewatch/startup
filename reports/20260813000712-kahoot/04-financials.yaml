    "title": "Financials",
    "summary": "Kahoot’s last public filings showed a scaled, high-gross-margin subscription software business with positive operating cash flow, 1.3M+ paid subscriptions, and no interest-bearing debt at the operating-company level through Q2 2023. The open-web record supports solid revenue quality and decent pre-close liquidity, but it is much weaker on realized pricing, CAC, NRR, segment-level margins, and post-privatization leverage. The practical underwriting conclusion is that Kahoot looked financially healthier than the eventual valuation reset implied, but current private-period performance and capital structure remain the main blockers."
