    {
      "id": "financial-verdict-and-diligence-blockers",
      "title": "Financial verdict and diligence blockers",
      "body": "The last public evidence supports a favorable quality-of-revenue read relative to many consumer-adjacent education businesses. Kahoot had recurring subscription economics, high gross margins, positive operating cash flow, and an expanding paid base across commercial, education, and consumer cohorts. Those traits help explain why sponsors were willing to finance a take-private even after public multiples compressed. At the same time, the adverse evidence matters. Growth had slowed into the mid-to-low teens by Q1 and Q2 2023, management openly acknowledged longer sales cycles and weaker year-end commercial execution in Q4 2022, and the final transaction price sat below the pandemic-era peak implied by SoftBank’s 2020 investment. The financial verdict is therefore nuanced: Kahoot looked like a scaled, healthy software asset, but one with decelerating momentum and less public-market upside than investors once expected. The biggest blockers for present-day underwriting are not historical revenue or cash balances; they are the missing current-period metrics—FY2023 audited final public-year detail, post-close debt terms, realized pricing, CAC/payback, NRR, gross churn, and current segment mix. Without those, later valuation work can be triangulated but not closed with confidence.",
