    {
      "id": "capital-adequacy-and-financing-dependency",
      "title": "Capital adequacy and financing dependency",
      "body": "Pre-privatization capital adequacy looked reasonable. Across FY2022 through Q2 2023, Kahoot reported cash balances between $88.7 million and $104.8 million, positive operating cash flow, and no interest-bearing debt at the group level. That is not the profile of a business facing an immediate emergency raise. It is, however, the profile of a company that was no longer being valued for hypergrowth. The July 2023 offer documents are therefore critical. They valued Kahoot at NOK 17.2 billion (NOK 35 per share), or roughly $1.72 billion, and described implied valuation multiples of about 10x last-twelve-month revenue and 40x last-twelve-month adjusted EBITDA. Offer materials also said equity and debt capital commitments were secured to finance the transaction, which means financing dependency migrated from the public operating company to the buyout structure. The open problem is opacity after closing. The public record retained in this run does not disclose the bidco debt stack, any refinancing at close, sponsor leverage targets, or how private ownership changed capital-allocation priorities. In practical terms, the last public-quarter liquidity looked adequate, but present-day capital adequacy cannot be underwritten from open sources because the debt package and current revenue base are private.",
