    {
      "id": "partner-customer-and-model-risk",
      "title": "Partner, customer, and model risk",
      "body": "Kahoot is strategically broad, but that breadth brings dependency and model risk. The product sits on app stores, collaboration suites, identity systems, rostering/privacy ecosystems, and the willingness of teachers or L&D teams to use yet another engagement layer alongside LMS, video, and documentation tools. Partnerbase and current product pages show dependence on Google, Microsoft, Zoom, and related ecosystems, while customer case studies show value often emerges through analytics, assignments, or integrations rather than through standalone lock-in. That creates two problems. First, Kahoot is exposed to policy or API changes from large platforms it does not control. Second, even successful adoption can coexist with multi-homing, meaning Kahoot may remain a complement rather than the core system of record. Review sources reinforce this risk by criticizing pricing, limited standards-based LMS fit, and occasional lag or polish issues. If budget pressure rises, that is exactly the profile of a tool buyers may trim or constrain before they remove their primary LMS or collaboration stack.",
