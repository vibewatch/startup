  topStrengths:
    - Kahoot 在中小学、高等教育和企业培训都有真实覆盖，不是单一狭窄的测验工具。
    - 历史公开财务显示，作为 EdTech 资产，它的软件经济性异常健康：95% 毛利率、经营现金流为正，截至 2023 年 Q2 运营公司无债务。
    - Virgin Atlantic、Aviva Canada、El Jannah、Lely 等具名企业部署，证明其使用场景已经进入生产环境，不只是课堂或活动里的新奇玩法。
    - 品牌仍具全球认知度且有赞助方支持；只要企业端耐久性继续提升，退出路径仍有多个。
  topRisks:
    - 私有化后收入、留存、细分结构和杠杆不透明，最关键的承保变量无法从公开证据获得。
    - Kahoot 可能仍被按互动层而非记录系统定价，估值倍数会被压缩，多栖使用风险也会上升。
    - 平台横跨学校和工作场景，隐私、安全以及儿童 / 学生数据义务仍然重要。
    - 除非退市后 Kahoot 已经显著复合增长，否则 2024 年私有化估值相对 2026 年公开可比公司仍显偏高。
  unresolvedGaps:
    - 退市以来的当前收入 / ARR / 账单额以及分部增长
    - NRR、GRR、Logo 流失、续约条款和头部账户集中度
    - 交割后债务结构、契约、再融资时间线和赞助方资本配置约束
    - 企业队列深度：案例研究之外的席位数、合同金额和多年扩张行为
    - 赞助方退出规划、老股交易标记和重新上市准备度
