  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Kahoot screens as a real, scaled, strategically broad learning software asset, but the public-only valuation call is constrained by a sharp mismatch between high historical quality and low current private visibility. The best public anchor—the ~$1.72B 2023/2024 take-private at ~10x LTM revenue—looks premium versus the 2026 public comp range unless Kahoot has compounded materially since delisting. Public comps suggest a wide EV range from roughly $0.5B bear to $2.4B bull, with a base case still below sponsor entry. The right public-only recommendation is therefore research-more / track, with attractiveness dependent on either a lower entry price or private-period metrics that are materially stronger than the last visible public baseline."
  },
  "sections": [
    {
      "id": "investment-thesis-and-anti-thesis",
      "title": "Investment thesis and anti-thesis",
      "body": "Kahoot is easy to like as a product company and hard to price as a private investment. The positive case is real: before going private, Kahoot showed recurring subscription economics, very high gross margins, positive operating cash flow, and no operating-company debt, and unusual brand reach across schools, higher education, and workplace learning. Customer evidence also shows that Kahoot is not just a classroom novelty; it is used in compliance training, onboarding, customer education, and employee engagement. Those traits matter because they distinguish Kahoot from narrower quiz apps and help explain why sophisticated sponsors were willing to finance a take-private. The anti-thesis is equally important. Kahoot’s most visible features are increasingly commoditized, teacher- and presenter-level switching costs are low, and the best public evidence still suggests the product is often an engagement layer that complements an LMS, collaboration suite, or broader learning stack rather than replacing it. Duolingo has a clearer narrow-domain efficacy moat; Instructure and PowerSchool have deeper workflow control; Coursera, Udemy, and 2U show how quickly market sentiment can compress when learning platforms lack clear premium economics. Add the private-period blind spots—current revenue, retention, segment mix, and debt—and the right conclusion is not that Kahoot is weak, but that the valuation call must be disciplined and conditional.",
