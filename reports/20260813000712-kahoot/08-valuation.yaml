    {
      "id": "recommendation-exit-readiness-and-diligence",
      "title": "Recommendation, exit readiness, and diligence",
      "body": "The practical recommendation is research-more / track, not buy, on public evidence alone. That call is not a rejection of the business. It is a recognition that the critical variables for a private investment—current revenue, retention, debt, covenants, segment mix, and the true quality of enterprise expansion—are exactly the variables that became opaque after delisting. In other words, the upside case may exist, but it cannot be responsibly claimed from public materials alone. Exit-readiness is also mixed. Kahoot is sponsor-backed, globally recognized, and broad enough to interest strategics or future sponsors, but an eventual relisting would likely require stronger proof on enterprise durability, AI monetization, governance transparency, and risk controls than the public record presently offers. For an investor, that means the best use of this chapter is to define entry discipline and diligence gates. If new diligence proves strong private-period compounding and manageable leverage, the investment case can move up sharply. If it does not, the apparent quality of the product can become a trap that hides limited return potential at an already full price.",
