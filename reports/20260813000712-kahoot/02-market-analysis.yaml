    "number": 2,
    "title": "Market Analysis",
    "summary": "Kahoot! participates in a real but messy market cluster: classroom engagement and assessment tools, higher-ed lecture and study-engagement software, and corporate digital learning and workforce-engagement platforms. Broad digital-learning markets are very large, but the directly comparable game-based and corporate-learning slices are far smaller and estimated inconsistently across publishers. The most important market conclusion is therefore structural rather than cosmetic: Kahoot! benefits from durable demand for flexible, interactive, AI-assisted learning, but must win budgets inside institutions and enterprises that already own LMS, collaboration, and compliance infrastructure and are increasingly demanding proof of ROI."
  },
