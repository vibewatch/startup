      "id": "capability-packaging-and-pricing-overlap",
      "title": "Capability, packaging, and pricing overlap",
      "body": "The practical buyer comparison starts with packaging, not branding. Kahoot spans classrooms, higher education, and enterprise, and its higher-ed packaging exposes transparent self-serve pricing while its larger EDU and enterprise motions move toward quote-based or sales-led contracts. Mentimeter and Slido follow a similar freemium-to-enterprise path for audience interaction, though both are more presentation-centric than school-workflow-centric. Nearpod and Pear Deck go deeper into daily teaching operations: they emphasize AI-generated lesson creation, assessments, instructional planning, district libraries, reporting, and LMS/LTI integrations, which means they are often evaluated as part of a broader instructional workflow rather than as a moment-in-class engagement tool. ClassDojo, by contrast, is primarily a communication and community layer. Duolingo is even more specialized: it is a habit-forming consumer learning product that competes on game design and efficacy inside specific subjects rather than on classroom orchestration. The consequence is that many buyers can legitimately multi-home. A district can use Canvas plus Pear Deck, a teacher can use Kahoot and Blooket in the same week, and an enterprise can use Slido for meetings while using Kahoot for training. That makes capability overlap high and single-feature differentiation fragile unless Kahoot can tie engagement to a larger administrative or reporting workflow.",
