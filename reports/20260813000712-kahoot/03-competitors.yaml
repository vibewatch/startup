      "id": "distribution-lock-in-and-multi-homing",
      "title": "Distribution, lock-in, and multi-homing",
      "body": "Competitive durability in this category depends less on who has the best quiz mechanic and more on who controls the workflow the buyer already trusts. PowerSchool’s and Instructure’s filings make that logic explicit: both companies position themselves as integrated, cloud-based learning infrastructure with data, analytics, and administrative gravity that districts and campuses rely on every day. Nearpod and Pear Deck also move in that direction by embedding lesson creation, assessment, reporting, and district features into everyday teaching. Kahoot does have meaningful distribution advantages of its own, especially a recognizable consumer-education brand and a product surface that now spans school, higher-ed, and workplace uses. But those advantages are weaker than owning the system of record or the LMS. As a result, switching costs are bifurcated. They are low at the teacher, trainer, or presenter layer, where multi-homing is common and the same user can swap among Kahoot, Mentimeter, Slido, Gimkit, or Blooket with little friction. They are higher at the institutional layer, where SSO, rosters, LMS/LTI, analytics, compliance, and customer-success motions matter. Kahoot’s moat therefore improves when it sells workflow fit and administrative simplicity, and deteriorates when the purchase is framed as just another interactive session tool.",
