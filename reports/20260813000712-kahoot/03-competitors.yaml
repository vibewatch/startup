    "number": 3,
    "title": "Competitors",
    "summary": "Kahoot! competes in three overlapping arenas at once: live classroom engagement, higher-ed instructional tooling, and enterprise meeting/training engagement. That gives it more breadth than single-segment specialists like Gimkit, Blooket, Slido, or ClassDojo, but it also leaves it exposed to better-embedded incumbents such as Instructure and PowerSchool and to deeper content or credential players like Coursera, 2U, and Duolingo. The competitive read is therefore mixed: Kahoot’s brand and cross-segment reach are real, but visible quiz mechanics, AI authoring, and lightweight engagement features are increasingly commoditized."
