      "id": "landscape-from-direct-peers-to-incumbents",
      "title": "Landscape from direct peers to incumbents",
      "body": "Kahoot’s competitor set is wider than a simple “quiz app” list. At the direct-feature level, Mentimeter, Gimkit, and Blooket all compete for live audience participation, fast checks for understanding, and game-like motivation. Nearpod and Pear Deck are closer classroom rivals because they combine interactivity with lesson delivery, assessment, and growing AI content-generation workflows. In enterprise and hybrid meetings, Slido and Mentimeter overlap heavily with Kahoot’s presentation, polling, Q&A, and training use cases, while Miro is a broader collaboration substitute that can absorb some workshop-style interaction. The more dangerous long-term competitors, however, are the incumbent control points. Instructure and PowerSchool already sit deeper in institutional workflows, with LMS, SIS, analytics, compliance, and district or campus procurement relationships that Kahoot does not control. Separate from those workflow incumbents are specialist learning brands such as Coursera, 2U, and Duolingo, which compete less on live session energy and more on catalog depth, credentialing, habit formation, and measurable learning outcomes. The result is a landscape where Kahoot rarely faces just one class of rival: in almost every buying motion, it is compared simultaneously against lighter engagement tools, heavier institutional suites, and status-quo internal build options.",
