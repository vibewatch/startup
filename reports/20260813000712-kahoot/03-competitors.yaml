      "id": "moat-durability-and-displacement-risk",
      "title": "Moat durability and displacement risk",
      "body": "The strongest case for Kahoot is that it is not trapped in one narrow niche. Unlike Gimkit or Blooket, it has credible school, campus, and enterprise packaging. Unlike Slido or Mentimeter, it has a deeper education identity. Unlike Coursera or 2U, it does not depend on building or licensing a huge credentials catalog. That breadth is valuable. But the adverse evidence is substantial. AI authoring is no longer novel: Kahoot, Nearpod, Pear Deck, Mentimeter, Coursera, and 2U all advertise some version of AI-assisted content creation or learning support. Enterprise admin features such as SSO, analytics, and integrations are also becoming standard. Meanwhile, PowerSchool and Instructure can use infrastructure control and data gravity to bundle adjacent features into already-approved stacks, and specialist brands like Duolingo can out-execute Kahoot in narrow domains where daily habit formation or efficacy evidence matters more than session energy. The net diligence view is that Kahoot’s moat is moderate rather than deep. Its brand, ease of use, and cross-segment reach are real advantages, but visible features are clonable, teacher-level switching costs are low, and institutional buyers already have alternatives with stronger workflow ownership. Kahoot must therefore keep turning engagement into administrative ROI, not just into fun.",
