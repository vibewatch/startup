  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Kahoot! is a Norway-founded game-based learning platform with roots at NTNU, a broad school/work/home product surface, and a still-scaled subscription base that remained profitable and cash-generative through its last public quarters. The business moved from pandemic-era public-market enthusiasm to a 2023-2024 take-private at NOK 35 per share (NOK 17.2 billion equity value), which preserved its unicorn status but at a clear discount to earlier peak expectations. Public evidence supports strong reach and product breadth, but exact post-privatization 2024-2026 revenue, headcount, and cap-table details remain private."
  },
  "sections": [
    {
      "id": "identity-origin-and-footprint",
      "title": "Identity, origin, and operating footprint",
      "body": "Kahoot! is most clearly described today as a global learning and engagement platform rather than just a classroom quiz tool. Official company materials say it serves school, work, and home use cases; the current homepage highlights separate solutions for individuals and educators, a workforce engagement platform for professionals, and a bundle of premium apps and content. The founding story is unusually well anchored. Kahoot! says it was founded in 2012 by Morten Versvik, Johan Brand, and Jamie Brooker in a joint project with the Norwegian University of Science and Technology (NTNU), later joined by Åsmund Furuseth, while NTNU’s own materials confirm the product came out of Versvik’s master’s research with Professor Alf Inge Wang. The company launched publicly in 2013 and then expanded from game-based quizzes into a broader multi-app suite that now includes Clever, DragonBox, Poio, Drops, Actimo, and Motimate. Scale signals are strong but denominator-sensitive. The current company page says Kahoot! has hosted more than 14 billion cumulative participants since 2013, is used by over 10 million teachers in the last 12 months, and reaches 95%+ of Fortune 500 companies and top universities. Footprint data is also mixed but directionally clear: Kahoot! says its head office is in Oslo and currently employs 600+ colleagues across offices in the U.S., U.K., France, Singapore, Australia, Japan, Finland, Estonia, Denmark, Spain, and Poland, while the last public quarterly reports still listed a slightly narrower office map. The diligence read is therefore a Norway-anchored global platform whose public marketing footprint has continued to evolve after delisting.",
