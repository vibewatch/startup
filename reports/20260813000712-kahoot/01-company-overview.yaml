    {
      "id": "scale-financial-milestones-and-adverse-readout",
      "title": "Scale, financial milestones, and adverse readout",
      "body": "Kahoot!’s final public filings show a business that had already crossed into meaningful scale before privatization, but also one that was no longer being rewarded with pandemic-era multiples. The 2022 fourth-quarter report gave the clearest full-year base: recognized revenue of $146 million, billings of $169 million, adjusted EBITDA of $30.3 million, cash of $104.8 million, no interest-bearing debt, and more than 1.3 million paid subscriptions. Q1 2023 and Q2 2023 then extended that profile, with revenue rising to $40.5 million and $41.3 million respectively, ARR reaching $159 million then $163.5 million, paid subscriptions climbing from 1.345 million to 1.365 million, and cash staying near $90-97 million. Those numbers support a business with good gross margins, recurring-revenue characteristics, and positive operating cash flow, but not the sort of explosive growth that public SaaS investors were rewarding in 2020-2021. The adverse signals are therefore more about trajectory than collapse. In the 2022 report, management openly said macro conditions, longer sales cycles, and weaker year-end commercial execution produced lower-than-expected revenue growth. TechCrunch framed the 2023 bid as a major step down from Kahoot!’s pandemic peak and a symptom of the post-COVID valuation reset affecting digital learning and other software names. CNBC’s 2020 reporting shows how far sentiment had swung: SoftBank’s investment once implied a roughly $2.2 billion market value, while the final 2023 offer valued the equity at about $1.7 billion. The core diligence conclusion is that Kahoot! remained scaled and profitable enough to attract sponsors, but did so after public-market enthusiasm, and likely public growth expectations, had already compressed materially.",
