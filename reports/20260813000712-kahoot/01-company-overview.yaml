    {
      "id": "leadership-governance-and-capital-owners",
      "title": "Leadership, governance, and capital owners",
      "body": "Leadership visibility is one of the cleaner parts of the public record. Kahoot!’s current leadership page identifies Eilert Giertsen Hanoa as CEO, notes that he first invested in 2014, chaired the board, and became CEO in 2019, and keeps co-founder Åsmund Furuseth in a visible operating role as chief product officer. The broader executive bench now spans technology, solutions, customer experience, revenue, operations, corporate development, and legal, which suggests the company is organized as a scaled software platform rather than a founder-only shop. Governance is also more legible than at many private software companies because Kahoot! still publishes a current board roster. Gavin Patterson now chairs the board, with directors from Microsoft, Cambium, Schibsted, Goldman Sachs Asset Management, and General Atlantic plus an employee representative. That gives Kahoot! meaningful governance depth, but it also underlines the post-buyout reality that control now sits in an investor-heavy structure rather than in a purely founder-led public-company framework. Capital ownership changed materially in the 2023-2024 take-private. Offer documents show Goldman Sachs Asset Management formed Kangaroo BidCo with General Atlantic, KIRKBI, Glitrafjord, other investors, and management shareholders; c.34.2% of the share capital was already committed through reinvestment agreements and undertakings when the offer launched. The board recommended the NOK 35 per share cash bid unanimously, excluding conflicted members. Public evidence therefore supports a business with experienced operators and real sponsor backing, but not one whose exact post-close ownership percentages, governance rights, or debt package are fully visible from open sources.",
