      - number: '1.4'
        title: 增长指标与市场地位
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的增长速度位居英国能源史前列。公司 2016 年从零起步，到 2025 年 10 月已覆盖 7.8M 英国家庭客户，并在 2025 年 1 月超过 British
              Gas，成为英国最大居民能源供应商，拿下约四分之一家庭。全球范围内，公司 2025 年 10 月跨八个直营零售市场突破 10M 零售客户；仅 FY24，非英国客户基数就翻了三倍。FY24 收入达到
              £12.4B（主要为英国零售大宗商品收入），毛利 £1B，EBITDA £95M，净利润 £83M（利润率 0.7%）。Kraken FY24 经常性 SaaS 收入为 £90M，同比增长 68%；利润
              £35M，增长 483%，显示技术板块经济性改善。员工数在 FY24 从 4,800 人增至 8,500 人，此后已超过 11,000 人。德国业务客户超过 1M，法国约 600,000，意大利
              500,000，日本 500,000，西班牙 400,000，体现出有意义的国际多元化。多数市场 Trustpilot 评分为 4.8/5，且连续八年获 Which? Recommended
              Provider，说明客户满意度长期领先，传统供应商未能追上。TIME Magazine 将 Octopus Energy 评为 100 Most Influential Companies
              之一，进一步强化英国以外的品牌可信度。
