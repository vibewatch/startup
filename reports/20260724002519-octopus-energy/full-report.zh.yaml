      - number: '7.2'
        title: 技术和运营风险
        blocks:
          - type: paragraph
            body: >-
              Kraken 独家部署在 Amazon Web Services 上， 让所有 70 million+ 个已签约账户承担结构性集中风险： 如果 Kraken 主要 AWS 部署区域长时间宕机，E.ON
              Next、Tokyo Gas、National Grid US 等多家独立公用事业公司， 以及 Octopus 自身 7.5 million 名英国客户，账单、直接扣款收取和客户管理都会同时受损。
              多云故障切换或灾难恢复架构均未公开披露。2025 年 7 月 Ofgem 罚款， 是 Kraken 账单自动化失败造成监管制裁的已验证案例： 如果自动化直接扣款管理能对 34,000+ 名预付费客户多收费，
              就存在进一步 AI 驱动账单错误影响更大客户群的风险。 Kraken 的 AI 和 ML 表现主张——效率提升 40%、NPS 提升 3x、节省 27 million tonnes CO2——
              都是管理层陈述，未经过独立审计，潜在许可客户和监管者都无法验证其准确性。 AI 需求预测一旦出现重大不准，可能在批发交易集成模块中造成套保损失， 直接影响能源采购成本和零售利润率。Kraken
              Technologies 未公开确认 SOC 2 Type II 或 ISO 27001 认证， 对受监管公用事业客户构成重大信息安全保证缺口。 单一平台承载 27 个国家 70 million+
              客户账户的个人和财务数据， 同时受 GDPR、日本 APPI、加州 CCPA 及其他数据保护制度约束，数据泄露风险因此更高。
