      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求三个条件同时成立：Kraken 完成分拆， 并在 2027 年前基于经验证的 $600M+ ARR 获得 8–12x 的独立 SaaS 或混合 SaaS 倍数； 国际客户增长继续每年增加 3–5M
              个新账户；英国监管条件保持稳定， 不再出现重大 Ofgem 执法。基于上述假设，仅 Kraken 实体就值 $5–7B； 英国零售业务服务 8M+ 客户且利润率改善，可再贡献 $1.5–2B， 即在应用 IPO
              或 M&A 执行溢价前，集团权益价值为 $6.5–9B。 对当前投资者而言，乐观情景总回报有限，因为 $9B 进入价格已经计入大量 Kraken 可选性； 上行取决于超过当前 ARR 预期。基准情景假设
              Kraken 分拆时获得 5–7x ARR 混合倍数， 英国客户数稳定在 7.5–8M，Ofgem 执法轨迹不升级。 由此得到 Kraken 独立价值 $2.5–3.5B，零售公用事业价值 $1.5–2B（约为
              £6.9B 收入的 0.25x）， 对应集团权益价值 $4–5.5B——较进入估值折价 35–55%。 悲观情景假设 Kraken 无法完成干净分拆，遭遇一次或多次牵涉账单自动化的额外 Ofgem 执法，
              失去一个或多个主要许可客户；Centrica 的 Hive 和 Kaluza 达到功能平价后，英国市场份额见顶。 集团随后回归纯公用事业倍数，即 £6.9B 收入的 0.15–0.25x， 对应约
              £1–1.7B（$1.3–2.2B）集团权益价值—— 较 $9B 进入价格下跌 75–85%。考虑到 Ofgem 执法先例和能源软件倍数压缩已在发生， 悲观情景概率低但并非可以忽略。
