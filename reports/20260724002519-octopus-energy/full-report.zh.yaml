  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入结构
        blocks:
          - type: paragraph
            body: >
              Octopus Energy Group 横跨四个主要收入板块：英国能源零售供应、国际能源零售、Kraken SaaS 授权，以及 OEG 可再生能源发电。英国能源零售供应——以参照 Ofgem
              价格上限的电价，向约 7.8M 居民和 SME 客户供应电力和天然气——占集团收入主导份额，估计超过 FY24 £12.4B 总收入的
              90%。收入确认遵循消费模型：客户按用电千瓦时或用气立方米付费，再加每日固定费用；价格随 Ofgem 价格上限审查周期按季度调整。这创造出一条主要由用量驱动、受大宗商品影响的收入流，相对流水毛利薄，但受到
              Ofgem 允许回报方法的部分保护。


              Kraken Technologies——Octopus 自有公用事业操作系统——通过向第三方公用事业公司（E.ON Next、Origin Energy、Tokyo Gas
              等）按每账户每月收费，提供计费、客户管理和灵活性技术栈访问权，产生 SaaS 授权收入。Kraken FY24 SaaS 收入达到 £90M，同比增长 68%，授权账户 70M。Kraken 利润增至
              £35M，增幅 483%。这些数字披露于 Octopus Energy Group FY24 业绩新闻稿，代表质量最高、毛利最高的收入板块。2025 年 9 月部分分拆预计将单独变现 Kraken，已签约 ARR
              为 $500M。Octopus Energy Generation (OEG) 通过其约 4.9 GW 可再生能源组合（£7B AUM）在 9 个市场售电贡献收入，并通过为零售业务提供优惠 PPA
              定价，进一步带来垂直整合收益。
