  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 在三个相互独立但彼此增强的战场竞争。英国居民零售方面，公司目前以约 7.8M 户家庭（约 24% 份额）领先市场，超过 Centrica 旗下 British Gas（约
              6.5–7M）、OVO Energy（约 4–4.5M）、E.ON Next（约 4.5M）和 EDF Energy（约 2.7–3M）。这一位置来自更高客户满意度、两笔大型收购（2022 年 Bulb、2023
              年 Shell Energy UK），以及由 Kraken 平台驱动的技术型成本结构。2021–22 年英国能源危机淘汰 25+ 家小供应商，成为结构性加速器：Octopus
              吸收数个政府分配组合，并把品牌巩固为可靠、数字优先的传统供应商替代方案，NPS 更高，Ofgem 投诉率更低。

              公用事业软件方面，Kraken Technologies（2025 年 9 月分拆）把云原生计费、调度和 CRM 平台授权给 27+ 个国家的公用事业公司，覆盖 70M 已签约账户和 $500M 已签约
              ARR。主要竞争对手是 Oracle Utilities（全球 430M+ 传统客户，重服务的本地部署模式）、OVO 的 Kaluza（云原生 EV 和需求灵活性平台，约 2 个外部英国授权客户），以及
              Ensek（英国中端计费和 CRM，服务低于 500K 账户的供应商）。没有竞争对手同时具备 Kraken 的授权规模、按账户 SaaS 经济性和 ML 调度能力。

              可再生能源发电方面，Octopus Energy Generation 在 9 个市场管理 4.9 GW 和 £7B AUM，与 Ørsted（全球海上风电装机 10.2 GW，世界领导者）和
              Vattenfall（瑞典国有支持的公用事业公司，拥有英国海上风电和区域供热资产）竞争。OEG 的优势是来自零售锚定需求的较低市场化售电风险，以及相较 Ørsted
              海上优先组合更广的资产结构（太阳能、电池、陆上风电）。所有战场的潜在新进入者包括超大规模云厂商支持的公用事业平台和国际能源巨头，但截至 2026 年，尚无一家在英国形成实质规模。
