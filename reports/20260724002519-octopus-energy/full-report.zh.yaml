      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              英国能源零售的主要买方是居民家庭，选择供应商时看价格、客服口碑、电价结构和环境资质。预算掌握在家庭手里；价格差、套餐到期和比价网站媒体报道会触发换供应商决策。中小企业是次级客群，采购复杂度略高，留存期也更长。Ofgem
              价格上限适用于居民客户，但不适用于 SME 或大型工业客户，因此不同客群的毛利动态不同。Kraken 公用事业软件业务的买方，是公用事业公司的高管团队（CTO、COO 或 CEO），IT
              和客户运营部门支持采购。采用路径包括长期供应商评估、概念验证迁移，然后签署多年平台合同。Kraken 客户包括大型国际公用事业公司（EDF、E.ON Next、National Grid
              US）和较小独立运营商，说明企业级和中端市场都可服务。迁移承诺周期长，客户切换成本高；一旦上平台，留存能力强。清洁能源发电投资方面，Octopus Energy Generation
              的买方最终是其上市和非上市基金（ORIT、海上风电基金）的机构 LP，Tokyo Gas 是基石
              LP。付款方是基金投资者；底层能源使用者是电网，最终是零售消费者。采用触发因素包括企业或机构投资者的净零承诺，以及政府可再生能源目标。
            claimRefs:
