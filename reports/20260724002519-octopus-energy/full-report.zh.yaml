      - number: '7.3'
        title: 市场和大宗商品风险
        blocks:
          - type: paragraph
            body: >-
              英国零售能源本质上暴露于批发天然气和电力大宗商品价格波动。 Ofgem 价格上限保护消费者，但也限制供应商可赚取的单位利润率—— 当大宗商品价格跌破上限底部时，收入下降快于成本；当价格飙升至上限之上时，
              供应商必须吸收套保损失，形成非对称风险。2021-2022 年欧洲天然气价格危机期间， 多家英国能源供应商破产；Octopus 借助 Supplier of Last Resort 任命吸收 Avro
              Energy（580,000 名客户） 和 Bulb（1.5 million 名客户），并承担整合成本。Octopus 披露 FY24 EBITDA 利润率仅 0.76%——
              如此薄的利润率下，即便大宗商品价格持续波动 1-2%，也可能把集团推向经营亏损。 Q2 2026 Ofgem 价格上限下调 6.6%，会压低所有英国零售客户的单位收入，
              固定成本基础设施却不会同步下降。Octopus 使用大宗商品信贷额度， 在客户付款前为批发能源采购提供资金，因此价格波动期间会形成按市值计价的资产负债表敞口。
              信贷额度的规模和交易对手未披露。天气风险具有季节性和结构性： 异常温暖的冬季会降低能源消费和收入，极寒事件则会同时推高需求和采购成本。 热泵渗透率提高后，气候变化还会给天然气消费带来长期需求不确定性。
