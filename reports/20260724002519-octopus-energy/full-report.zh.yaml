      - number: '7.4'
        title: 竞争和商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的竞争地位依赖 Kraken 的服务成本优势—— 每账户约 £15-20，行业平均为 £40-60。传统巨头继续投资竞争性云原生平台后， 可能侵蚀 Kraken
              的服务成本优势。Ovo Energy 分拆出的 Kaluza 是最接近 Kraken 的直接竞争者； 它未披露同等规模，但已积极向公用事业公司销售。British
              Gas（Centrica）已投入数字化转型和数据分析能力。 E.ON 已授权使用 Kraken——给 Octopus 带来收入—— 但也意味着 E.ON 同时获得 Kraken 能力，从而降低自身服务成本劣势。
              Oracle Utilities 在全球传统公用事业公司中拥有庞大装机基础， 并一直投资其 IS-U 平台的云迁移。如果 Oracle 云公用事业产品成熟到与 Kraken 功能平价， 大型公用事业公司采用
              Kraken 许可的门槛可能降低。Octopus 的零售市场份额（英国家庭 23.7%）带来监管审视风险： 作为市场最大供应商，Octopus 面临更高 Ofgem 监控，
              不能再依赖从零增长时的挑战者品牌定位。Octopus 以 SoLR 方式吸收 Avro 和 Bulb 客户， 形成了非有机客户客群；他们的流失特征、满意度和参与模式，可能不同于原生获取的 Octopus 客户。
              Kraken 分拆还制造结构性冲突：Kraken 的商业激励是最大化所有公用事业客户的许可收入， 包括 Octopus 竞争对手；而 Octopus 零售希望阻止竞争对手缩小平台差距。
              分拆后如何管理这种张力，尚未公开披露。
            claimRefs:
