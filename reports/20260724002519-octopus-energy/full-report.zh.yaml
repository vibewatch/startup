      - number: '1.3'
        title: 资本基础与投资者
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 已从多元化的战略和财务投资者处融资超过 $2B。最近一轮重要融资于 2023 年 12 月按 $8B 估值完成（募资 $800M），随后 2024 年 5 月 GIM 和
              CPP Investments 增持，估值升至 $9B。澳大利亚上市能源公司 Origin Energy 持股约 23%，是最大单一股东，因此既享有经济上行，也对 Kraken
              澳大利亚部署拥有战略杠杆。Generation Investment Management（Al Gore 的基金）持股 13%，CPP Investments（加拿大养老金）持股 12%，提供机构背书。日本
              Tokyo Gas 2020 年投资约 $200M，换取约 9.7% 股权，并参与经营 Octopus Energy 日本零售业务的合资公司。澳大利亚养老金 Aware Super 在 2024 年 5 月与
              GIM 共同投资。FY24 结束时，公司净资产达到 £1.7B，来自 £722M 的股权投资和留存收益合计。集团控股公司层面未披露公开债务或信贷额度，但 Octopus Energy Generation
              内部很可能存在项目融资结构。公司仍为私有；管理层公开讨论过上市，但尚未宣布明确时间表。
