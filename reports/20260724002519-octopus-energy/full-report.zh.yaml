    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group Ltd 于 2015 年注册成立，2016 年进入英国居民能源市场，以挑战者供应商身份、以 DTC
              数字模式提供简单、价格有竞争力的绿色能源电价。此后，公司演变为垂直整合的清洁能源集团，横跨三块相互扣合的业务：能源零售供应、Kraken 云技术平台，以及借 Octopus Energy Generation
              布局可再生能源发电。零售业务服务英国、德国、法国、意大利、西班牙、日本、美国和新西兰客户；英国仍是主市场，截至 2025 年初覆盖 7.8M 户家庭，居民市场份额约 24%。Kraken
              是为公用事业定制的操作系统，覆盖计费、客户管理、智能电表集成和灵活调度，全球已签约 70M 账户；2025 年 9 月分拆为独立实体。Octopus Energy Generation 管理约 £7B
              AUM，资产包括陆上风电、海上风电和太阳能，是欧洲较大的专注可再生能源投资者之一。集团收入既来自能源零售的大宗商品毛利，也来自 Kraken 客户的经常性 SaaS 授权费，客户包括 EDF、E.ON
              Next、Origin Energy 和 Tokyo Gas，这让它在能源行业拥有少见的双收入结构。Octopus Electric Vehicles 负责 EV 租赁和智能充电，Electroverse
              负责公共充电网络，把集团触角延伸到邻近的电气化市场。
