        - 集团约 ~0.5x（EV ~€70B）
        - 为核电 / 零售混合型综合公用事业提供欧洲参考倍数
        - 法国国有属性扭曲市场定价；相对 EDF 集团，英国零售业务规模偏小
      - - Orsted
