  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品矩阵与客户工作流集成
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 用三条主产品线覆盖完整能源客户生命周期：带智能电价的能源零售供应、Kraken B2B 平台，以及 Octopus Energy Generation
              投资部门。从客户工作流看，零售主张始于获客——以数字渠道为主、免退出费换供应商——随后引导客户上智能电价，再用半小时级数据、自动直接借记和 app 控制持续互动。智能电价是主要产品差异化点：Agile
              Octopus 提供与批发市场价格挂钩的半小时动态定价，奖励把用电转移到低碳、低成本时段的客户。Intelligent Octopus Go 面向 EV 车主，在批发价格最低时自动给车辆充电，提供 8p/kWh
              夜间电价，相比公共充电最高节省 85%。Cosy Octopus 面向热泵用户，在热泵效率最高的早晨和下午提供补贴电价。Flux 面向太阳能 + 电池家庭，按动态费率支付上网和用电。Fan Club
              给风电场附近客户奖励，当这些风电场发电时提供折扣。Zero Bills 提供由 Octopus 安装太阳能和电池的住宅，持续能源账单为零，完全消除客户能源成本。企业端，Shape Shifters 电价套件包括
              Trio 和 Agile 变体、Electric Match 和 Wind Works，面向商业和工业客户。Electroverse 把欧洲 EV
              公共充电聚合到一个漫游账户，将产品足迹延伸到公共出行基础设施。整体看，这些产品把 Octopus 定位为全屋能源管理者，而不是大宗商品供应商；Kraken
              平台支撑所有客户侧编排，从智能电表数据摄取到调度指令和计费结算。Octopus Electric Vehicles 子公司提供工资抵扣式 EV 租赁，把客户更深地锁进生态，也为 Kraken
              需求调度引擎产生额外数据。Octopus 收购 Heatmiser，是为了控制热泵日程并把热泵接入 Kraken 的 VPP 调度层，把公司的垂直整合技术栈从软件经硬件延伸进家庭。OEG
              拥有并管理发电资产，增加供给侧维度，使 Octopus 越来越能用自有可再生输出匹配客户负荷。
