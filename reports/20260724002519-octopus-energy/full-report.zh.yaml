  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 的客户基础横跨三个主要分层。最大的是英国国内零售能源供应： 截至 2025 年 1 月，约有 7.5 million 个家庭账户，占英国国内能源市场 23.7%；
              该份额是英国市场现代竞争时代里单一供应商拿到的最高水平。国际上，Octopus 还服务至少 2.5 million 名客户， 覆盖德国（超过 1 million）、法国（约 600,000）、日本（约
              500,000）、 意大利（约 500,000）、西班牙（约 400,000）和新西兰（约 100,000）。 按 Octopus 新闻稿，全球客户数在 2024 年末已超过 10 million。
              第二个清晰分层是企业能源客户：Octopus 通过 Shape Shifters 费率套件、Electric Match 和 Wind Works 服务英国 SME 和商业客户， 但精确 SME
              账户数未公开披露。第三个分层是 Kraken B2B 许可客户—— 美国、澳大利亚、日本、意大利和欧洲的公用事业公司，为自己的客户基础授权使用 Kraken 平台。
              按渠道看，绝大多数零售客户来自数字化获客；无退出费切换让客户进出 Octopus 都很容易。 按使用场景看，Agile、Intelligent Octopus Go、Cosy 和 Flux
              等智能费率客户是价值最高、参与度最高的客群， 他们使用 Kraken 的需求调度能力，并产生支撑 Octopus 平台差异化的数据优势。 按地域看，英国仍是主导收入市场，但非英国客户基础在 FY2024
              增至三倍—— 非英国增长构成关键战略里程碑，说明国际扩张论点已在推进。英国零售收入集中仍是剩余风险： 英国价格上限监管压缩利润率，天气、批发价和监管政策又会同时影响英国盈利能力。
            claimRefs:
