    type: timeline
    layout: standard
    summary: 时间线展示 2021 至 2026 年影响 Octopus Energy Group 的重大监管事件、执法行动和合规里程碑，呈现随着 Octopus 成为英国最大供应商，监管风险轨迹以及 Ofgem 审查强度如何上升。
    approximationNotes: 日期来自 Ofgem 公开执法记录、议会记录和新闻稿。预付费电表调查状态以运行日期（2026-05-08）公开信息为准。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR015
    data:
      items:
        - label: Avro Energy SoLR 任命
          date: Sep 2021
          detail: Octopus 首个重大 SoLR；580K 客户转入；监管合规义务开始规模化
        - label: 能源市场危机见顶；多家供应商破产
          date: Oct 2021
          detail: 燃气价格危机触发 28+ 家英国供应商倒闭；行业 SoLR 义务升级
        - label: Bulb Energy 特别托管
          date: Nov 2021
          detail: Bulb 的 1.5M 客户被纳入政府特别托管；Octopus 后续获选为收购方
        - label: Ofgem 预付费电表调查启动（全行业）
          date: 2023
          detail: 议会和 Ofgem 审查弱势家庭强制安装预付费电表
        - label: Energy Act 2023 颁布
          date: Dec 2023
          detail: 新增智能电表铺设、弱势客户识别和热泵安装合规义务
        - label: Ofgem 因直接借记超收罚款 £1.5M
          date: Jul 2025
          detail: Kraken 账单自动化被认定对 34K+ 客户超收；要求退款 £2.64M
        - label: Ofgem 价格上限 Q2 2026 下调（6.6%）
          date: Apr 2026
          detail: 季度上限调整降低单位收入；利润率压缩风险落地
  - id: FR004
    title: 竞争和结构性风险依赖图
    type: dag
    layout: standard
    summary: 有向无环图展示竞争和结构性风险，说明市场地位、技术平台和战略决策如何为 Octopus Energy Group 形成相互连接的风险依赖。
    approximationNotes: 依赖关系为分析师推断。该图基于公开可得信息呈现逻辑因果关系，不代表 Octopus 管理层自身风险模型。
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR024
      - CR027
      - CR034
    data:
      nodes:
        - id: kraken-advantage
          label: Kraken 服务成本优势
          detail: £15-20/账户 vs 行业 £40-60；竞争和授权护城河的主要来源
        - id: competitor-investment
          label: 在位企业平台投资
          detail: Kaluza（Ovo）、Oracle 云、Centrica 数字化；3-5 年维度差距收窄
        - id: client-migration-risk
          label: Kraken 授权客户迁移风险
          detail: E.ON、Origin 或其他客户可能在合约到期后自建或切换平台
        - id: key-person-risk
          label: Greg Jackson 关键人物风险
          detail: CEO 离任或健康事件扰乱监管关系和投资者信心
        - id: spinoff-conflict
          label: Kraken 分拆利益冲突
          detail: Kraken 的外部授权目标可能偏离 Octopus 零售的平台访问利益
        - id: margin-erosion
          label: 零售利润率侵蚀
          detail: 竞争对手服务成本改善，削弱 Octopus 在零售端的定价优势
      edges:
        - from: competitor-investment
          to: kraken-advantage
          label: 随时间收窄优势
        - from: kraken-advantage
          to: client-migration-risk
          label: 差异化下降抬高流失风险
        - from: spinoff-conflict
          to: kraken-advantage
          label: 分拆后定价可能侵蚀 Octopus 零售的成本优势
        - from: key-person-risk
          to: spinoff-conflict
          label: 领导层缺口放大治理复杂性
        - from: client-migration-risk
          to: margin-erosion
          label: Kraken ARR 增速放缓，削弱 SaaS 对零售的交叉补贴
        - from: competitor-investment
          to: margin-erosion
          label: 成本差距收窄，侵蚀 Octopus 零售竞争性定价能力
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 逻辑链从五个证据支柱——市场地位、产品证明、客户牵引、财务结构和风险画像——推导出有条件正面推荐；两个条件（Kraken 分拆、无进一步 Ofgem 执法）会把推荐转为明确买入，或触发下调。
    approximationNotes: 节点描述为定性分析师摘要。量化触发阈值见 TV005（论点失效和止损触发表）。
    claimRefs:
      - CV004
      - CV005
      - CV027
      - CV036
    data:
      nodes:
        - id: n1
          label: 英国市场领导地位（7.5M 客户，NPS 第一）
        - id: n2
          label: Kraken 平台（70M 账户，声称 $500M+ ARR）
        - id: n3
          label: 国际扩张（27 个国家，8+ 授权客户）
        - id: n4
          label: 薄利润率（0.76% EBITDA）叠加 Ofgem 执法风险
        - id: n5
          label: $9B 估值由 CPP Investments 锚定（2024 年 Q1）
        - id: n6
          label: Kraken 分拆落地——关键价值催化剂
        - id: n7
          label: 有条件正面——暂持，等待 Kraken 分拆结构披露和 ARR 审计
        - id: n8
          label: 牛市上调触发点——Kraken 以 $2B+ 分拆，且 Ofgem 执法不再复发
        - id: n9
          label: 熊市下调触发点——第二次 Ofgem 执法或主要授权客户流失
      edges:
        - from: n1
          to: n5
          label: 支撑
        - from: n2
          to: n5
          label: 首要驱动
        - from: n3
          to: n5
          label: 增长可选项
        - from: n4
          to: n5
          label: 折价因素
        - from: n5
          to: n6
          label: 价值由此释放
        - from: n6
          to: n7
          label: 未确认——有条件
        - from: n6
          to: n8
          label: 正面情境
        - from: n4
          to: n9
          label: 升级情境
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: >-
      Octopus Energy Group 隐含企业价值对三项关键驱动因素的敏感性：Kraken ARR 倍数（0x 至 12x）、Kraken ARR 绝对值（$300M 至 $800M），以及基于 £6.9B
      收入的零售公用事业倍数。每条序列展示单一驱动因素在低、基准和高假设下对集团估值的隐含贡献，其他变量保持基准值。
    approximationNotes: 所有数字均为分析师估算。Kraken ARR 为管理层口径，未经审计。零售收入采用 FY2024 披露值。EV/Revenue 倍数来自 TV004 可比公司组。
    claimRefs:
      - CV013
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
    data:
      items:
        - label: Kraken ARR 倍数——低：0x（纯公用事业）
          value: 0
          unit: USD millions
          detail: 不给 Kraken SaaS 任何价值；全集团按零售公用事业估值
          tone: negative
        - label: Kraken ARR 倍数——基准：6x ARR（$500M）
          value: 3000
          unit: USD millions
          detail: 基准 ARR 下 Kraken 软件贡献的基准假设
          tone: neutral
        - label: Kraken ARR 倍数——高：10x ARR（$500M）
          value: 5000
          unit: USD millions
          detail: 牛市情境下，Kraken 以当前 ARR 水平获得 SaaS 重估
          tone: positive
        - label: Kraken ARR 水平——低：$300M，6x
          value: 1800
          unit: USD millions
          detail: 分拆后 ARR 进入平台期；倍数保持不变
          tone: negative
        - label: Kraken ARR 水平——基准：$500M，6x
          value: 3000
          unit: USD millions
          detail: 管理层口径 ARR，使用基准倍数
          tone: neutral
        - label: Kraken ARR 水平——高：$800M，6x
          value: 4800
          unit: USD millions
          detail: ARR 到 FY2027 增至 $800M，使用基准倍数
          tone: positive
        - label: 英国零售倍数——低：£6.9B 收入的 0.15x
          value: 1315
          unit: USD millions
          detail: 纯公用事业底部倍数；不给技术溢价
          tone: negative
        - label: 英国零售倍数——基准：£6.9B 收入的 0.25x
          value: 2191
          unit: USD millions
          detail: 介于 Centrica 和 SSE 之间的同业混合倍数
          tone: neutral
        - label: 英国零售倍数——高：£6.9B 收入的 0.50x
          value: 4382
          unit: USD millions
          detail: 若监管资产获得计入，则给出类似 SSE 的溢价
          tone: positive
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: >-
      Octopus Energy Group 在牛市、基准和熊市情境下的隐含企业价值区间，单位为十亿美元；$9B 的 CPP Investments 入场价作为参考点。牛市情境要求 Kraken SaaS
      在分拆时获得重估；熊市情境假设估值回到纯公用事业倍数。
    approximationNotes: 所有区间均为分析师估算，使用 TV004 的可比倍数。汇率假设为 $1.27/GBP（2024 年平均）。这些估算没有经审计财务数据支撑。
    claimRefs:
      - CV001
      - CV017
      - CV018
      - CV019
      - CV024
    data:
      items:
        - label: 熊市情境隐含 EV（十亿美元）
          low: 1.3
          mid: 1.8
          high: 2.2
          unit: $B
          detail: 对 £6.9B 收入使用 0.15–0.25x 纯公用事业倍数；Kraken 分拆被放弃或失败；基于 TV003 熊市假设
        - label: 基准情境隐含 EV（十亿美元）
          low: 4
          mid: 4.8
          high: 5.5
          unit: $B
          detail: Kraken 按 $500M ARR 给 5–7x，零售按收入 0.25x；采用 TV003 基准假设
        - label: 牛市情境隐含 EV（十亿美元）
          low: 6.5
          mid: 7.5
          high: 9
          unit: $B
          detail: Kraken 按 $600M+ ARR 给 8–12x，零售按收入 0.3x；Kraken 分拆顺利落地
        - label: 入场估值参考（CPP Investments，2024 年 Q1，十亿美元）
          low: 9
          mid: 9
          high: 9
          unit: $B
          detail: 最近已知的一级市场交易；投资者回报计算的参考价格
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向投委会的 Octopus Energy Group 七维投资评分卡。每项 KPI 都是方向性分析师评级，并给出基于本尽调报告证据的支撑理由；截至 2026-05-08，仅使用公开来源。
    approximationNotes: 评级是基于公开证据的定性分析师判断，不是正式评分模型，也不意味着特定回报概率。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV033
      - CV035
      - CV042
    data:
      items:
        - label: 市场机会
          value: Positive
          detail: 英国能源转型叠加全球公用事业软件可触达市场；政策和技术共同确认了跨数十年的结构性顺风
        - label: 产品差异化
          value: Neutral
          detail: Kraken 账单自动化故障（Ofgem 2025 年 7 月）削弱了原本强劲的产品差异化主张；ARR 未审计
        - label: 客户验证
          value: Positive
          detail: 英国 7.5M 客户、全球 70M 账户；E.ON Next、Tokyo Gas、National Grid US 是 Kraken 授权客户
        - label: 财务健康
          value: Negative
          detail: EBITDA 利润率 0.76%，现金头寸未披露，暴露于大宗商品；公开信息未确认现金续航缓冲
        - label: 风险画像
          value: Negative
          detail: 高风险——Ofgem 执法先例、大宗商品价格敞口、Kraken 分拆复杂度和薄利润率，让下行情境分布很宽
        - label: 估值支撑
          value: Neutral
          detail: 只有在 Kraken SaaS 获得重估的假设下，$9B 才站得住；基准情境意味着较入场价减记 40–55%
        - label: 证据质量
          value: Neutral
          detail: 市场和客户的公开证据较强；Kraken ARR、资本结构、分拆条款和现金头寸证据薄弱
