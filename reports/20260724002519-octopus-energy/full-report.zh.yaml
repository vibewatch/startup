      - number: '4.4'
        title: 财务结论与尽调议程
        blocks:
          - type: paragraph
            body: >
              Octopus Energy Group 的财务画像最好拆成两门生意：一门是大规模、薄利的零售和大宗商品业务（£12.4B 收入，约 0.76% EBITDA 利润率），另一门是高增长、高毛利的 SaaS
              平台（Kraken：£90M SaaS 收入、£35M 利润、68% 增长）。收入质量混合——零售收入体量大，但暴露于大宗商品价格波动、监管价格上限和营运资金波动；Kraken SaaS
              收入则经常性、已签约且高毛利。Kraken 部分分拆模糊了持续财务可比性，也引入估值拐点风险。


              主要财务尽调阻塞点是：（1）现金、未提取信贷额度或月度消耗没有公开披露；（2）没有独立审计的分业务毛利视图；（3）国际零售亏损头寸未量化；（4）Kraken 分拆估值和所有权经济性尚未披露。鉴于 FY24
              集团层面已盈利，且公司能以不断上升估值持续融资，资本风险看起来可控，但没有数据室访问就无法确认。潜在投资或合作的核心问题是：英国能源市场危机后回归常态、零售毛利被压缩时，Kraken 的 SaaS
              毛利画像能否在结构上抵消这一下行。
