      - number: '1.5'
        title: 里程碑与监管记录
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的里程碑记录是一个常规增长故事，中间被两次政府支持的大型收购打断，监管合规负担也同步加重。2022 年 12 月收购 Bulb Energy 的 1.5M
              客户，由英国政府支持促成，标志着公司首次使用大型非有机增长事件。到 2023 年中，Bulb 客户已全部迁移至 Kraken 平台，验证了 Kraken 吸收大规模转移的能力。2023 年末，公司收购 Shell
              Energy Retail UK，增加约 1.3M 能源客户，并在不到三个月内完成迁移，再次证明平台能力。伴随有机增长和收购扩张，Octopus Energy 面临与其规模相称的监管审查。2025 年 7
              月，Ofgem 因公司未及时向约 34,000 名预付费电表客户开具最终账单，对其罚款 £1.5M。2025 年 5 月，Ofgem 要求 Octopus 和另外九家供应商就固定费用超收合计退款
              £7M；Octopus 份额为 £2.64M，另加 £546,000 善意补偿，覆盖 2019 年 1 月至 2024 年 9 月期间的错误。Greg Jackson 2024
              年公开警告称，受非大宗商品网络和政策成本影响，英国家庭能源账单到 2029 年可能上涨 20%；这番表态提升声誉可信度，但也提示零售业务面临成本压力。2025 年 9 月 Kraken
              分拆，是公司创立以来最重要的结构性事件：技术平台被拆分为独立实体，估值最高可达 £10B，管理层可独立于零售集团推进自身资本计划。
