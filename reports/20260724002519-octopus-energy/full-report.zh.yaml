      - number: '5.2'
        title: Kraken 平台架构与能力
        blocks:
          - type: paragraph
            body: >-
              Kraken 是 Octopus Energy Group 的核心技术资产。它是一个云原生公用事业操作系统，基于 Amazon Web Services，使用 Python 和 Django
              从零搭建，覆盖公用事业运营全栈：客户管理和 CRM、实时计费、智能电表数据处理、DER 聚合，以及现场劳动力管理。平台围绕三个主要组件构建。Kraken Customer
              处理计费、直接借记管理、数字沟通和客服工作流。Kraken Asset（原 KrakenFlex）是 DER 聚合和虚拟电厂调度引擎，与智能 EV
              充电器、热泵和电池系统通信，根据批发价格信号或电网稳定需求转移负荷。Kraken Field 管理现场服务运营，包括热泵安装排期和智能电表铺设。这些模块共同构成端到端平台，运行传统 SAP 或 Oracle
              公用事业软件的竞争对手难以复制。AWS 基础设施支撑全球扩展：Octopus 曾表示 AWS 支持快速国际扩张，Kraken 目前管理 17M 个授权能源账户。Kraken 内部的 Skyrocket
              机器学习系统可自动处理多达 40% 的数字客户沟通，缩短客服处理时间并提升 NPS。Kraken 的 API-first 架构支持无缝授权给第三方：EDF、E.ON Next、Origin
              Energy、Plenitude、Tokyo Gas、Cuckoo Broadband、Severn Trent Water 和 National Grid US 都是客户。截至 FY2024，该平台实现
              $500M 已承诺年度经常性收入，Octopus 目标到 2027 年达到 100M 总账户。2025 年 3 月宣布、2025 年 9 月完成的 Kraken 分拆，让 Kraken
              获得独立治理，企业销售周期可更快推进，也为未来 IPO 留出空间，避免与 Octopus 零售发生战略冲突。公司声称拥有 ISO/IEC 27001 信息安全管理认证，但精确范围仍需独立核验。
