      - number: '6.3'
        title: 点名客户证明与背书质量
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的客户证据在英国零售能源市场中属于最强一档； 但市场性质决定了，个案研究少于汇总满意度指标。最权威的第三方客户证明是 Which? Recommended Provider 奖项，
              Octopus 已连续八年维持这一称号；奖项要求独立核验满意度调查， 覆盖客户服务、性价比、账单准确性和投诉处理。Trustpilot 上超过 400,000 条评价给出 4.8/5，
              覆盖面很广，但存在自选择偏差。英国最大的能源切换平台 Uswitch， 在年度客户满意度调查中持续给 Octopus 高排名。B2B 侧，点名 Kraken 客户构成另一类参考账户： Origin
              Energy（ASX 上市澳大利亚公用事业公司，约 4 million 客户）既是 23% 股东，也是 Kraken 许可客户， 是价值最高的战略客户证明。EDF Energy
              是英国最大传统供应商之一，它授权使用 Kraken 做客户管理， 说明即便竞争对手也认可平台优势。National Grid US 是受监管配电公用事业公司， 为北美市场提供受监管资产所有者背书。Tokyo
              Gas 是日本最大的燃气公用事业公司， 在全球最严苛的监管环境之一提供参考。上述 B2B 背书都是生产部署，不是试点—— Octopus 自身 7.5 million 名英国客户运行在同一个 Kraken
              平台上， 提供了最可信的概念验证。Bulb 和 Shell Energy 迁移都在数月内完成， 且没有重大服务中断，证明交付能力不只来自软件。一个反向信号是 2025 年 7 月 Ofgem 罚款： 34,000
              名预付费电表客户未收到最终账单。尽管总体满意度高， 该事件仍说明特定受监管客群中存在客户服务缺口。
