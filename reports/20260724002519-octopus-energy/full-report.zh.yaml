      - number: '6.4'
        title: 留存韧性与流失
        blocks:
          - type: paragraph
            body: >-
              客户留存是 Octopus Energy 最重要、也最难精确量化的指标之一， 因为英国零售能源市场不要求公开披露流失率。现有证据指向其留存优于行业同业。 行业分析师和消费者调查数据表明，Octopus
              月流失率约为 2-3%， 典型英国能源传统供应商为 4-5%。较低流失来自几项结构性因素。 第一，智能费率制造粘性：Agile、Intelligent Octopus Go 或 Cosy
              客户一旦配置设备做自动调度， 切换成本会上升，因为其他地方很难找到可比费率。第二，Which? Recommended Provider 身份和 Trustpilot 评分， 向客户传递了离开 Octopus
              可能承担服务质量风险。第三，一些产品天然捆绑， 尤其是热泵和 EV 客户可能同时拥有 Octopus 安装的硬件和费率，切换壁垒更深。 第四，App 和数字账户管理工具的用户体验评分高，降低摩擦和惰性。
              消费业务没有公开披露 Net Revenue Retention 或 Gross Revenue Retention； 在受监管能源市场，单客收入主要由 Ofgem 价格上限和实际用量决定， 因而 NRR 不如
              SaaS 业务里有意义。家庭客户合同通常是 12 个月或标准浮动合同，无退出费。 Kraken B2B 分部的合同长度未公开披露， 但集成深度（替换账单系统）意味着合同期限可能为多年。 2025 年 5 月
              Ofgem 强制退款令和 2025 年 7 月罚款都涉及历史账单失败， 不是当前系统性服务失败；根据可得满意度数据，目前看还没有造成重大客户流失。
            claimRefs:
              - CU016
              - CU017
              - CU018
              - CU019
