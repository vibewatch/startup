      - number: '3.4'
        title: 竞争护城河与耐久性分析
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 的竞争护城河在三个相互增强的层面运转。第一是 Kraken 平台切换成本：公用事业公司一旦把计费、CRM 和调度迁到 Kraken，重新上平台需要 3–5 年和
              £10M–£50M，形成长期结构性留存。Oracle 的装机基础也受益于同样机制，但 Kraken 是唯一把云原生规模与 ML
              调度结合并商业化部署的平台。中期主要风险不是具名传统巨头，而是由超大规模云厂商支持的新进入者（AWS Energy、Google Cloud）把计费基础设施层商品化。

              第二是 Octopus 的智能电价基础设施（Agile、Intelligent Octopus Go）：复制这些产品需要把 ML 调度与批发结算集成，需要足够大的客户基数来平滑波动，还需要竞争对手无法授权的
              Kraken 引擎。E.ON Next 2024 年的 TOU 电价是衍生产品，技术深度落后 2–3 年。第三，发电、零售和软件的垂直整合叠加出复合成本优势。OEG 可再生资产锚定 Agile
              的批发底价；Kraken 成本效率为零售毛利提供资金。OVO 缺少发电资产，Oracle 缺少零售。

              最可信的负面情景，是账户快速增长（Bulb + Shell 迁移）后服务质量下滑；Ofgem 2025 年 7 月 £1.5M 罚款和 2025 年 5 月退款已经释放信号。一旦 NPS
              领先优势被侵蚀，Octopus 主要零售护城河就会变弱。国际壁垒真实存在：Octopus 的 27 个目标国家各有本地传统企业，享有监管本土市场优势，必须逐市场进入，没有一个全球竞争对手可以在所有市场同时被替代。
