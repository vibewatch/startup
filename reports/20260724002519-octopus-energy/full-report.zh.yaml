      - number: '8.6'
        title: 最终尽调问题和破坏论点触发器
        blocks:
          - type: paragraph
            body: >-
              确认或扩大任何 Octopus Energy Group 仓位前，有四类最终尽调问题至关重要。 第一，Kraken ARR 经审计数字：当前管理层声称的 $500M+ ARR，
              无法从公开来源独立验证。必须拿到按合同类型（许可、托管服务、绩效制）、客户和地域拆分的经审计 Kraken 收入， 才能验证支撑 $9B 估值的软件倍数假设。第二，Kraken 分拆结构和时间表：
              必须披露准确股权分配、优先权瀑布、持续 Octopus 零售关系的许可费结构， 以及分拆后 Kraken 实体的治理安排，才能评估当前 Octopus Group 投资者是否获得价值转移。 第三，Ofgem
              执法轨迹：必须先解决 2025 年 7 月账单自动化罚款和进行中的预付费电表调查， 才能评估监管风险画像。任何进一步牵涉 Kraken 账单的执法行动，
              尤其如果导致许可条件或重大整改成本，都会成为破坏论点触发器。 第四，大宗商品采购信贷额度：应披露所有大宗商品采购融资的规模、期限和抵押条款， 以评估批发能源价格飙升时的下行风险。破坏论点触发器包括：
              （1）2025 年 7 月罚款后 18 个月内，出现第二起牵涉 Kraken 账单自动化的重大 Ofgem 执法； （2）失去一个或多个主要 Kraken 许可客户（E.ON Next、Tokyo
              Gas、National Grid US）， 且对应超过 Kraken ARR 的 15%；（3）Kraken 分拆结构没有给予现有 Octopus Group 投资者按比例持有 Kraken 实体股权；
              （4）被迫降估融资或困境二级交易，隐含估值低于 $7B， 发出机构投资者对软件论点失去信心的信号。
