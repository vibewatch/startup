  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 横跨三个边界、买方结构和竞争动态各不相同但彼此依赖的市场。第一块是英国居民能源零售，消费者通过持牌供应商购买电力和天然气，电价包括标准浮动、固定或动态电价。该市场由英国约
              28.5M 个电表点和约 22M 个燃气表点定义，按当前价格水平，每年产生约 £40B 或更多零售收入。Ofgem 管理的价格上限为使用标准浮动电价的家庭设置单位费率和固定费用上限，直接约束包括 Octopus
              在内所有零售供应商的单位毛利。第二块是全球公用事业技术软件，具体包括公用事业运营中的计费、客户信息系统、需求响应和智能电网集成层。过去，该市场主要由 Oracle Utilities、SAP
              和大型系统集成商服务；Kraken 在这里以云原生 SaaS 替代方案竞争。第三块是清洁能源发电投资，Octopus Energy Generation
              与大型基础设施基金、养老金支持资本和专业可再生能源开发商竞争欧洲陆上风电、海上风电和太阳能资产。现状替代品包括既有 ERP / 计费系统（Oracle、SAP）、既有能源供应商（British
              Gas、E.ON），以及由受监管回报支撑的传统化石燃料发电。这些市场相邻而非独立：Octopus 的零售规模为 Kraken 提供可信度，Kraken 的运营优势支撑零售毛利防守。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM031
              - CM039
      - number: '2.2'
        title: 零售、公用事业软件和清洁能源的市场规模
        blocks:
          - type: paragraph
            body: >-
              按收入计，英国居民能源零售市场是欧洲最大市场之一，约 28.5M 个电表点和 22M 个燃气表点共同驱动，年消费者能源支出随价格水平约在 £40B 至 £50B
              区间。支出既包括批发大宗商品成本转嫁，也包括网络费用、政策附加费和供应商毛利。Octopus FY24 收入 £12.4B，约占估算英国居民能源总支出的 25–30%，与其 24%
              市场份额大体一致。按客户量看，这基本是一个平盘市场，但收入会随批发价格波动而摆动。全球公用事业软件和 SaaS 市场更难从公开来源测算。Kraken 已签约年收入 $500M，只占全球公用事业 IT
              支出的一小部分。行业观察者估计，全球公用事业每年在运营上合计花费数千亿美元；其中覆盖计费、CRM 和智能电表集成软件的子集，估计每年至少 $10B。Kraken 已签约收入三年翻了四倍，说明它在切走既有 IT
              预算，而非创造新增支出。全球清洁能源投资市场庞大且仍在增长；多个估算显示 2023 年清洁能源年投资超过 $1T，IEA 的 World Energy Investment 2024 报告称，2023
              年清洁能源投资为 $1.7T，化石燃料约 $1T，这是一个历史性拐点。Octopus Energy Generation 的 £7B AUM 让它成为该市场的中等规模参与者，体量小于大型基础设施基金。
