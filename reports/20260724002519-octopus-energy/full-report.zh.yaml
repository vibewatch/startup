      - number: '4.3'
        title: 资本充足性与财务状况
        blocks:
          - type: paragraph
            body: >
              Octopus Energy Group 已在多轮融资中募集超过 $2B 股权（详见第 1 章，claimRefs 指向公司概览）。最近披露估值是 2024 年 5 月完成 $370M 融资后的 $9B。FY24
              净资产为 £1.7B。现金余额、月度经营消耗和未提取债务额度没有在任何公开申报中披露；Octopus Energy Group Ltd（公司编号 09263047）在 Companies House
              的年度申报滞后 12–18 个月，也不提供详细流动性分析。Centrica 发布的年报提供了传统企业成本和资本结构的对比点：Centrica（British Gas
              母公司）报告由上游和交易业务支撑的净现金为正，这是一项结构性优势；Octopus 靠 Kraken IP 所有权部分抵消。


              可再生能源发电板块资本强度高：以 £7B 组合 AUM 收购和开发约 4.9 GW 风电和太阳能资产，意味着大量使用项目融资。OEG 发电资产通常使用无追索项目债务融资，把大部分债务隔离在 Octopus
              Energy Group 零售资产负债表之外。Kraken 分拆预计在 2025 年 9 月按 $500M 已签约 ARR 推进，预期为 OEG 股东带来部分变现事件，无需完整贸易出售。Ofgem 2025 年
              7 月因客户直接借记超收对 Octopus 罚款 £1.5M，带来财务和声誉风险，尽管相对集团收入规模并不重大。缺少披露现金头寸，无法分析资金续航，但 FY24 盈利（£83M 净利润）说明 Octopus
              在集团层面已越过盈亏平衡。
