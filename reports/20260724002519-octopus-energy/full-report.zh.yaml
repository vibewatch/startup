      - number: '7.6'
        title: 财务和资产负债表风险
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group FY24 EBITDA 利润率只有 0.76%， 对大宗商品成本上升、监管处罚或执行失败几乎没有缓冲。 £1.7 billion 净资产提供了有意义的权益基础，
              但现金头寸、月度烧钱速度和可用信贷额度余量未公开披露，外部无法评估资本充足性。 Kraken Technologies 分拆（2025 年 12 月）按 $8.65 billion 估值， 可能通过 OEG
              保留股权给其带来部分流动性，但具体持股比例和预期现金收益未披露。 OEG 继续持有一组可再生能源资产（£7 billion AUM）， 资金来自权益和项目层债务组合；项目债务总量和契约未公开披露。
              集团营运资本周期在冬季高峰期结构性为负： 批发采购必须在客户账单回款前融资，因此需要短期大宗商品信贷额度。 英国零售业务存在坏账风险，预付费客户分部尤其明显，因为 Ofgem 已经发现账单合规失败。
              Octopus 报告 FY24 净利润 £83 million（£12.4 billion 收入上的 0.67% 净利率）， 是集团历史上第一个实质盈利年度；集团尚无穿越完整大宗商品周期的持续盈利记录。
              集团未披露杠杆率、利息覆盖率或债务到期结构，信用风险评估依赖数据室访问。
