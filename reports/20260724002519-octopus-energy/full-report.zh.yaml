      - number: '8.4'
        title: 建议和风险调整回报
        blocks:
          - type: paragraph
            body: >-
              在当前 $9B 估值下，总体建议是有条件正面；条件是 Kraken 分拆能以可防守的软件倍数成功执行。 置信度为中等：英国零售业务质量和 Kraken 全球足迹很强， 但零售利润薄、Ofgem
              执法先例、外部投资者拿不到经审计 Kraken ARR 数字，形成抵消。 估值立场是，$9B 价格既非明显高估，也非明显低估—— 本质是在押注一个具体结果（Kraken 软件重估），该结果合理但不确定。 任何以
              $9B 进入的投资者，都必须接受一种情景： Kraken 分拆催化剂兑现前，估值可能先下调 40–60%。风险评级为高。 大宗商品价格敞口、薄零售利润率、Ofgem 执法风险和 Kraken 分拆执行风险叠加，
              使结果分布很宽。下行保护有限，因为业务没有有意义的资产支撑 （不同于 SSE 的受监管网络资产或 Ørsted 的已签约海上风电容量）—— 账面价值之上的全部溢价都压在 Kraken 软件估值上。
              当前投资者的目标退出窗口是 2028–2032 年，假设 Kraken 在 2024 CPP 轮后 3–5 年内 IPO 或完成二级交易。 如果 2028 年 Kraken IPO 按基准情景（$3B）定价， 则
              $9B 进入价格中对应 Kraken 部分的回报约为 0.3–0.4x； 利润率改善后，零售业务可能恢复至 0.25–0.3x 收入。 基准情景下，进入投资者总回报估计为 0.5–0.7x—— 除非 Kraken
              明显超预期，否则会毁损价值。
