  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和合规风险
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 持有 Ofgem 零售能源供应许可， 受完整的英国能源消费者保护监管约束，包括行为标准、智能电表义务、 脆弱客户保护和直接扣款管理规则。2025 年 7 月，Ofgem
              因直接扣款多收客户费用开出 £1.5M 罚款—— Kraken CRM / 账单自动化模块直接失灵—— 并要求 Octopus 向受影响客户退还 £2.64M、支付 £546,000 消费者补偿。 该罚单是
              Octopus 第一次重大 Ofgem 执法，也格外值得注意， 因为账单自动化正是 Kraken 平台声称的核心差异化。 另一起关于预付费电表实践的 Ofgem 调查仍在进行； 背景是 2022-2023
              年强制安装预付费电表影响脆弱家庭，引发更广泛行业担忧。 议会对能源供应商实践的审视也已加剧，2023-2024 年特别委员会听证会审查了预付费电表滥用和家庭能源债务。 Energy Act 2023
              对供应商提出新义务，涉及脆弱性识别、智能电表铺设和净零家庭技术安装， 带来持续合规成本。Octopus 在 27+ 个国家运营，各地监管框架不同，合规风险叠加。
              德国、法国、意大利、西班牙和日本适用不同消费者保护法、数据隐私要求和智能电表标准； 任何单一市场的监管失败，都可能在当地客户因 Kraken 托管运营承受合规后果时影响 Kraken 许可收入。
