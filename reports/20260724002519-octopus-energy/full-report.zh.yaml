      - number: '8.2'
        title: 估值背景和可比公司
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 是私营公司，没有公开上市股票。最新独立价格信号是 Q1 2024 CPP Investments 轮， 该轮隐含集团估值 $9 billion（按 2024 年平均汇率约
              £7.1 billion）。 此前 Generation Investment Management 在 2021 年以据报 £2.2B 估值投资 £630M； 三年约 3x 升值，主要由客户增长和 Kraken
              许可势头驱动。 2025 或 2026 年没有公开确认任何新股融资轮。可比公司分三类。 纯英国能源供应商（Centrica、EDF UK）交易在 0.15–0.5x EV/Revenue，
              反映零售利润薄、大宗商品敞口和监管风险。偏基础设施的能源企业（SSE）可获得溢价—— 通常 1.0–1.5x——因为受监管网络资产可以获得高于商品零售的收益率估值。 Ørsted 等海上风电开发商 2021
              年在转型可选性驱动下达到 4–5x 收入， 但到 2024 年，海上风电成本上升、利率提高后，压缩至约 2.5x； 该先例为 Octopus 自身科技溢价估值提供了警示。Kraken 最相关的 SaaS 可比是
              Salesforce、ServiceNow 及类似企业垂直 SaaS，交易在 8–12x 收入。如果 Kraken 的 $500M+ ARR 得到验证， 且分拆以 8x ARR 倍数成功执行，仅 Kraken
              实体估值就约为 $4B； 在按 0.3x 收入倍数计入零售公用事业业务后，当前 $9B 集团价格仍有上行空间。 基准情景不假设完整重估；它假设 Kraken ARR 混合倍数为 5–7x，
              零售收入基础适用纯公用事业倍数，得到 $4–5.5B 集团权益价值。
