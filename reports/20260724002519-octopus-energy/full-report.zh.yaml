      - number: '6.2'
        title: 采用轨迹与增长
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的增长轨迹，是英国零售能源史上最突出的案例之一。 公司 2015 年成立、2016 年以零客户起步，到 2020 年英国家庭账户约 1.5 million， 2021 年突破 2
              million，并借助 Supplier of Last Resort 任命加速非有机增长。 2021 年，接手 Avro Energy 客户的任命带来约 580,000 个账户。 Bulb Energy
              2021 年 11 月进入管理程序，随后启动特别管理；英国政府 2022 年 10 月选择 Octopus 收购 Bulb， 2023 年 1 月至 6 月期间，1.5 million 名客户迁移到
              Octopus 和 Kraken 平台。 2023 年末收购 Shell Energy Retail UK 又增加 1.3 million 个账户。 上述非有机新增，合力推动了 2025 年 1 月超过
              British Gas、成为英国最大家庭能源供应商的里程碑。 有机增长由高 NPS 带来的口碑推荐、面向 EV 车主和太阳能家庭的有竞争力智能费率、 以及相对传统巨头更低获客成本的强数字营销驱动。FY2024
              非英国客户基础约 3x 增长， 确认国际扩张已形成实质牵引，尤其德国通过有机切换和本地营销活动增长至超过 1 million 客户。 到 2024 年 10 月，英国纳入管理的电表增至 12.9
              million，其中包括燃气表和电表， 说明双燃料客户关系较深。智能费率采用率没有精确披露， 但 Ofgem 数据显示，英国 502,000 名智能 TOU EV 费率客户中，Octopus 拥有超过
              250,000 名， 足以说明其客户基础内智能产品渗透率可观。
