      - number: '3.3'
        title: 能源技术平台竞争对手
        blocks:
          - type: paragraph
            body: >-
              Oracle Utilities 是全球占主导地位的传统公用事业客户管理和计费平台，依靠授权部署（CC&B、MDM、Opower）服务超过 430M 公用事业客户。其竞争地位建立在 Oracle ERP
              集成、成熟专业服务生态和多年积累的 C-suite 买方关系上。Oracle 部署模式主要是本地部署或 Oracle Cloud Infrastructure，实施周期 3–5 年，大型公用事业重新上平台成本为
              £10M–£50M。这为既有客户创造高切换成本，但也让 Oracle 不适合需要数月内完成上线的挑战者零售商。Kraken 的云原生、单代码库 SaaS 可以在数月而非数年内让新公用事业客户上线。

              Kaluza 是 OVO Energy 自有智能能源平台，是英国最接近 Kraken 的功能等价产品。它处理 EV 智能充电调度、需求灵活性和客户互动。截至 2024 年，OVO 已将 Kaluza
              授权给约两家外部英国公用事业公司，但未披露 SaaS 收入或已签约账户数，因此无法直接对标。Kaluza 的战略范围似乎比 Kraken 窄，对完整计费到调度技术栈的强调较少，也没有确认国际授权计划。

              Ensek（Ignition 平台）面向英国中端能源供应商（低于 500K 账户），提供云原生计费、CRM 和市场结算。其路线图整合 AI 自动化和行为洞察层（Flex 模块），会让它更接近 Kraken 的
              ML 调度功能。Ensek 缺少 Kraken 的国际授权网络和批发价格优化基础设施，竞争局限在英国居民中端市场。没有其他公用事业软件平台宣布与 Kraken 同等规模的国际云原生授权战略。
