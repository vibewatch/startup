      - number: '5.4'
        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              Kraken 部署模式是 AWS 上的云原生架构，Octopus 进入新地理市场时可启动区域实例，不需要大量本地基础设施。2023 年，1.5M Bulb Energy 客户在六个月内快速迁移到 Kraken
              基础设施；随后 2023 年末 1.3M Shell Energy 客户也完成迁移，证明了这一点。两次迁移均未出现重大服务中断，Octopus 在企业客户沟通中把这些案例作为参考基准。集成架构采用
              API-first：授权公用事业公司以 RESTful API 接入 Kraken，处理计费、计量数据交换和客户管理；Kraken Field 与外部劳动力管理和地图平台集成。智能电表数据经由英国 Data
              Communications Company 网络摄取，各国际市场使用等效集成。可靠性由 AWS 多区域架构和自动扩缩容支撑，但集中依赖单一云服务商会形成潜在单点故障，投资者应评估。面向客户的可靠性证据包括：超过
              400,000 条评论下 Trustpilot 评分 4.8/5，以及连续八年获得 Which? Recommended Provider。已知可靠性事件包括两起 Ofgem 计费执法：2025 年因未向
              34,000 名预付费客户开具最终账单而罚款 £1.5M，以及 2025 年 5 月因固定费用超收错误，被要求退款 £2.64M 并支付 £546K
              善意补偿。这些事件说明，即便平台总体复杂度高，特定受监管客户细分中的计费边缘案例仍需要更强质量控制工具。Kraken 路线图目标是到 2027 年靠美国、日本和欧洲国际扩张达到 100M 账户。热泵集成、V2G
              调度、AI 驱动联络中心自动化，以及水务等邻近垂直行业，将进一步扩大可服务市场。
            claimRefs:
              - CE023
              - CE024
              - CE025
              - CE026
              - CE027
      - number: '5.5'
        title: 差异化 — 技术、IP、数据与品牌
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的竞争差异化靠四根支柱撑住。第一是自有技术： Kraken 平台从零开始面向现代云环境和智能电表数据规模搭建， 避开了传统 Oracle 和 SAP 公用事业平台内生的技术债。
              Skyrocket ML 系统和 Kraken Asset 调度引擎，在自动化需求响应和客户沟通自动化上构成真实 IP， 竞争对手需要数年才能复刻。第二是数据优势：仅英国就有 12.9 million
              块电表纳入管理， 全球有 70 million 个账户，Octopus 因而积累了消费模式、设备行为和批发价响应的专有数据集； 数据又反过来支撑费率设计、ML 模型训练和发电资产调度。
              没有大规模智能电表部署的竞争对手，拼不出可比数据集。第三是品牌资产： Octopus 已经形成口碑驱动的品牌认知，降低获客成本；持续较高的 Trustpilot 评分和 Which? 认可，
              在传统广告投入极少的情况下验证了口碑强度。英国 1/4 家庭由其服务，以及 2025 年 1 月超过 British Gas 的里程碑， 进一步强化了品牌存在感。第四是监管关系：Octopus 多次获得
              Supplier of Last Resort 指定， 既证明监管信任，也以低于市场的成本获得客户基础。参与英国 Smart Data 计划、较早采用 TOU 费率， 让 Octopus 成为 Ofgem 和
              DESNZ 的政策伙伴。关键 IP 包括：收购 Heatmiser 后获得的热泵 VPP 控制能力、 提供漫游数据和网络效应的 Electroverse EV 充电网络，以及 Skyrocket ML 系统。
              复刻门槛很高：从零重建一个相当于 Kraken 的平台，估计需要五到七年和数亿英镑； 也解释了为什么大型公用事业公司宁愿持续支付许可费，也不选择内部自建。
