      - number: '8.5'
        title: 融资背景和资本结构
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 自 2019 年以来，已在新股融资轮中累计筹集约 £1B+。 已知投资者包括 Generation Investment Management（£630M，2021
              年）、 CPP Investments（金额未披露，隐含集团估值 $9B，Q1 2024）、 Tokyo Gas（战略伙伴和投资者，金额未披露），以及 Origin Energy Australia （JV
              组建，澳大利亚业务隐含 $500M+）。任何一轮的优先权结构—— 清算优先级、反稀释权和参与机制——都未公开披露，构成重大缺口：
              在悲观清算或被迫退出情景下，普通股（包括管理层和员工股权）可能较标题估值遭遇大幅稀释。 集团层面债务融资未公开确认。零售能源业务需要大宗商品采购信贷额度——
              通常由银行以套保头寸为基础提供——但额度规模、期限和交易对手均未披露。 考虑到 Octopus 利润率很薄，批发价飙升情景下大宗商品信贷敞口可能很大。 Kraken Technologies
              分拆增加了复杂性：如果 Kraken 作为独立实体分拆， Octopus Group 股东是否按比例获得 Kraken 股权，取决于分拆结构 （完整分配、部分 IPO 或融资式剥离）。管理层已表示会任命
              Kraken CEO （Amir Orad，Q4 2025），但尚未披露分拆后持续 Kraken-Octopus 商业关系的股权结构、 优先权瀑布或许可费用安排。Octopus Energy Group
              Ltd（注册号 09263047） 的 UK Companies House 备案确认了备案历史和注册账户， 但公开来源拿不到包含完整分部披露的集团层面合并账目， 限制了对资本充足性和现金头寸的量化评估。
            claimRefs:
