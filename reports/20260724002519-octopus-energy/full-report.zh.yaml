      - number: '4.2'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >
              能源零售天然是低毛利业务：Ofgem 价格上限方法允许供应商在大宗商品和网络成本转嫁之上获得受限单位毛利。行业分析师普遍估计，英国能源零售毛利率为收入的 3%–5%，按 FY24 收入水平对应约 £370M 至
              £620M 毛利；Octopus 隐含毛利约 £1B（约 8% 毛利率），说明垂直整合带来运营效率，拥有 Kraken 而不是从 Oracle 或 SAP 采购计费基础设施，也减少了成本。Octopus 在
              £12.4B 收入上实现 £95M EBITDA，对应 0.76% EBITDA 利润率，符合轻资产零售模式，但被大宗商品成本转嫁显著摊薄。


              客户获取成本（CAC）未披露。Octopus 称其增长由高于平均水平的转介绍驱动，相比传统供应商减少付费 CAC，但没有独立核验数字。单位经济桥接只能依赖代理指标：英国能源零售行业 CAC
              通过数字渠道估计为每客户 £50–£150；考虑到低流失率以及客户对智能电价产品（Agile Octopus、Intelligent Octopus
              Go）的高参与度，回本期以月计。营运资金需求具有季节性，冬季能源消费和计费量最高时达到峰值，因此除了股权外，还需要信贷额度。和所有英国能源零售商一样，Octopus
              使用大宗商品采购信贷额度，管理在批发市场买入能源与通过客户计费收回成本之间的现金时点差；这让资产负债表暴露于远期头寸的盯市波动。
