  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点和反论点
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 的投资论点分两层：第一，公司已经建立了结构性更优的英国零售能源业务， 增速快于任何可比同业，并维持高于市场的获客经济性；第二，也是支撑 $9B 估值更重要的一点，
              Kraken Technologies 平台是真正的垂直 SaaS 资产——它把操作系统按许可卖给第三方公用事业公司， 已经规模化运行，当前声称产生 $500M+ 经常性 ARR；
              一旦从零售能源业务中分离，它应获得科技公司倍数而非公用事业倍数。 五个正向支柱是：（1）英国市场领导地位，7.5M 国内客户带来可防守零售现金流； （2）Kraken 在 27 个国家覆盖 70M
              个账户，形成抵御新进入者的许可护城河； （3）进入德国、日本、澳大利亚、Texas 等市场，提供纯英国公用事业公司没有的增长可选性； （4）能源转型提供跨数十年的结构性顺风；（5）CPP Investments
              和 Generation Investment Management 在 $9B 估值下作为机构锚定投资者，给出来自成熟投资人的可信价格信号。 反论点建立在四个结构性反对理由上：（1）Kraken
              账单自动化失败—— 2025 年 7 月 Ofgem 执法已经验证 Kraken 账单自动化失败——直接冲击关于「Kraken 软件优势已获证实且可扩展」的核心主张； （2）$9B 估值相当于集团收入
              1.3x，要求市场相信 Kraken 分拆时会获得 SaaS 重估， 但该结果尚未确认；能源软件倍数压缩后，不确定性进一步上升； （3）Octopus 0.76% EBITDA 利润率几乎没有缓冲，
              一旦大宗商品价格或 Ofgem 上限不利变化，就可能出现亏损年度； （4）Kraken 分拆引入结构复杂性，也可能在独立软件供应商 Kraken 与其最大客户 Octopus 之间制造利益冲突。
