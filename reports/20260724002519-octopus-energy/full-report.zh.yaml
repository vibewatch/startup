      - number: '3.2'
        title: 英国能源零售竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Centrica 旗下 British Gas 是英国历史性零售能源巨头，目前以约 6.5–7M 户家庭位列第二大居民供应商。它的竞争资产包括品牌认知、约 7,000 名现场工程师组成的队伍，可支撑 Home
              Services（锅炉维修、热泵、电气工程），以及拥有 2M+ 连接设备的 Hive 智能家居平台——英国最大的居民能源 IoT 生态。British Gas 在 Citizens Advice
              投诉指标上一直低于 Octopus，也没有开发出可匹配 Agile 或 Intelligent Octopus Go 的动态电价产品。Centrica 战略优先级是用 Hive
              和服务变现留住客户生命周期价值，而不是靠价格竞争夺回零售市场份额。

              E.ON Next 是 €35B+ E.ON SE 集团的英国零售部门，吸收 Npower 后拥有约 4.5M 账户。它使用自有 CRM / 计费技术栈，并在 2024
              年推出分时电价，释放传统巨头投资智能能源的信号。E.ON 的结构性优势包括母公司的欧洲配电网资产，以及未来搭建外部授权业务的潜力——但尚未宣布。OVO Energy（2020 年收购 SSE 后在英国拥有约
              4–4.5M 客户）是 Octopus 最接近的技术战略同行：其 Kaluza 平台处理 EV 智能充电和需求灵活性，并已授权给约两家外部英国公用事业公司。

              EDF Energy 专注于由核电支撑的固定费率电价（约 2.7–3M 英国客户），靠核电发电（约占英国电力 15%）带来的供给成本确定性竞争，而非靠智能产品差异化。EDF 战略方向是 Great British
              Nuclear 下的核电机组整合，而不是扩大零售份额。四家传统供应商加上 Octopus 合计控制英国居民能源供应约 80%+。
