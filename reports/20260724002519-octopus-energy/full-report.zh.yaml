companyProfile:
  summary: >-
    Octopus Energy Group (OEG) 是一家英国后期私有能源公司，由 Greg Jackson 于 2015 年创立。公司在英国向 7.5M 客户供应零售能源，并把 Kraken 云平台授权给 27+ 个国家的
    70M+ 公用事业账户。OEG 在 FY24 首次取得实质盈利：£12.4B 收入对应 £83M 净利润。Kraken Technology 于 2025 年 12 月按 $8.65B 估值分拆，把集团内嵌的 SaaS
    价值显性化。OEG 拥有英国能源市场最高 NPS（连续七年获 Which? Recommended Provider），并取得 B Corporation 认证。
  foundedDate: '2015-01-01'
  founders:
    - name: Greg Jackson CBE
      role: CEO 兼联合创始人
      background: 创立 OEG 前是连续软件创业者，Cambridge 经济学毕业。Octopus 的使命驱动品牌、技术战略和国际扩张主要由他推动。他一直抵制战略出售叙事，并把 Kraken 定位为最终 IPO 标的。
      claimRefs:
        - CO003
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: >-
    两块业务彼此扣合：（1）OEG Retail — 面向英国消费者和 SME 的能源直供，提供灵活及分时电价，包括 Agile Octopus、Saving Sessions 和 EV 智能充电；（2）Kraken
    Technology — 云原生公用事业管理平台（计费、CRM、交易、计量、需求响应），授权给全球第三方公用事业公司，包括 E.ON、Origin Energy、Tokyo Gas 和 EDF Renewables。
  customerFocus: 零售：寻找透明、数字优先能源供应的英国家庭和 SME。Kraken：希望替换传统计费基础设施，并加入 AI 驱动需求管理能力的 Tier-1 和 Tier-2 公用事业运营商。
  businessModel: 零售：靠电力和天然气供应赚取单位毛利，OEG Generation 的太阳能后盾降低批发敞口。Kraken：按管理账户规模向公用事业客户收取经常性 SaaS 授权费，并叠加实施和支持收入。
  stage: late-stage private
