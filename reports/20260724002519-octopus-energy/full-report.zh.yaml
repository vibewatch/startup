  - id: TV005
    title: 投资论点破裂与否决触发器表
    columns:
      - 触发器
      - 触发阈值
      - 论点破裂机制
      - 行动含义
    rows:
      - - Ofgem 进一步执法并牵涉 Kraken 计费
        - 2025 年 7 月罚款后 18 个月内，任何引用计费自动化失效的新执法行动或临时决定
        - 直接推翻 Kraken 核心差异化主张；授权客户可能重新评估或退出；ARR 增长停滞；SaaS 倍数坍塌
        - 全面审查 Kraken 授权客户合同和 ARR；重估基准和乐观情景；若 SaaS 倍数假设站不住，考虑退出
      - - 大型 Kraken 授权客户离开
        - 失去任何贡献 Kraken ARR 超过 15% 的授权客户（例如 E.ON Next UK、Tokyo Gas、National Grid US）
        - 暴露授权客户流失风险；释放产品或服务质量失效信号；ARR 增长可能无法抵消离开；乐观情景坍塌
        - 立即要求 ARR 审计；建模测试 ARR 下降 20–30% 的敏感性；将投资列入观察名单
      - - Kraken 分拆结构不利于集团投资者
        - 分拆披露不含按比例股权分配；分拆后向 Kraken 支付的授权费高于市场；或集团投资者拿不到 Kraken 股权
        - 抹掉 $9B 估值中嵌入的主要上行；剩余集团价值跌回纯公用事业倍数，对应 $1.3–2.2B
        - 聘请法律顾问评估少数股东权利；判断剥离条款是否允许按当前账面价退出
      - - 下轮融资或困境二级交易
        - 2026 年 5 月后 24 个月内，任何隐含估值低于 $7B 的一级融资或二级交易
        - 释放机构投资者对软件论点失去信心的信号；触发 LP 按市值减记；给 Kraken 分拆制造负面动能
        - 立即复核估值；重估仓位规模；要求 GP 提高股权结构和优先权机制透明度
      - - 大宗商品价格冲击或 Ofgem 上限下调超预期
        - Ofgem 价格上限环比下调超过 10%，且批发远期价格显示两个或更多季度的利润率亏损已锁定
        - 零售业务转为经营亏损；集团动用大宗商品授信额度；分红能力消失；重心从增长转向生存
        - 对流动性头寸做压力测试；确认大宗商品授信额度余量；推迟任何新增资本承诺
    claimRefs:
      - CV021
      - CV033
      - CV034
      - CV036
      - CV037
      - CV039
      - CV040
    notes: 触发阈值是分析师基于相对投资论点假设的重要性作出的判断。它们不是投资管理指令，也不构成投资建议。
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - Kraken ARR（经审计）
        - 按客户、合同类型、地域和增长率拆分的经审计 Kraken Technologies ARR；流失率；净收入留存
        - $9B 估值取决于 Kraken 拿到 SaaS 倍数；管理层声称 $500M+ ARR，但未经审计，若无独立验证无法支撑该倍数
        - 要求 data room；审阅英国公司注册处的 Kraken Technologies Ltd 经审计账目；要求四大会计师事务所出具 ARR 审计意见
      - - Kraken 分拆结构
        - 股权分配计划、优先清偿顺序、分拆后 Octopus 零售向 Kraken 支付的授权费、治理结构、时间表，以及 IPO 或二级交易路线图
        - 没有分拆结构，$9B 估值上行的主要来源无法量化；存在价值流向 Kraken 实体、损害集团投资者的风险
        - 管理层披露；法律顾问审阅分拆文件草案；在董事会层面沟通少数股东保护
      - - Ofgem 执法轨迹
        - 2025 年 7 月计费罚款结果和整改状态；预付费电表调查状态；Ofgem 对 Kraken 自动化计费的未来监管姿态
        - 第二次执法会触发投资论点破裂；持续调查带来或有负债，公开信息无法量化
        - 直接询问 Ofgem；审阅 data room 披露的监管往来函件；就最高责任敞口取得法律意见
      - - 大宗商品采购授信额度
        - 大宗商品采购授信额度的规模、期限、交易对手、抵押条款和使用情况；截至 2026 年的对冲比例和按市值计价敞口
        - 0.76% EBITDA 利润率几乎没有缓冲；价外对冲头寸或授信额度撤回会立刻变成流动性风险
        - 要求财资资料包；独立审查大宗商品对冲政策和交易对手信用额度
      - - 集团合并账目
        - 完整集团合并 P&L、资产负债表和现金流量表，并按分部披露（英国零售、Kraken 软件、发电、国际）
        - 英国公司注册处文件披露有限；仅凭公开来源无法验证分部利润率和现金头寸
        - 要求 data room 提供经审计集团账目；若没有，则要求管理账，并由审计师签署关键指标
    claimRefs:
      - CV003
      - CV007
      - CV026
      - CV027
      - CV029
      - CV033
      - CV039
    notes: 尽调路径假设公司配合正式 data room 流程。部分事项（Ofgem 调查状态）可能受监管保密限制。
