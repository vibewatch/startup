      - number: '7.5'
        title: 战略和执行风险
        blocks:
          - type: paragraph
            body: >-
              Greg Jackson CBE 是 Octopus Energy Group 的 CEO 和联合创始人， 也是集团最主要的公众面孔，深度影响监管关系、融资和战略方向。 Octopus
              治理披露明确点出了这种关键人集中度， 且未通过继任规划披露显示出实质缓释。Greg Jackson 一旦离任或无法履职， 零售业务和 Kraken 许可业务都会面临重大执行和声誉风险。
              同时在德国、法国、日本、意大利、西班牙、新西兰、美国及更多市场国际扩张， 会成倍增加执行复杂度：每个市场都需要监管批准、本地人才、套保能力和产品本地化。 按当前规模，非英国业务估计仍在亏损（FY24
              国际贡献未单独披露）。 Kraken Technologies 分拆（2025 年 12 月）带来管理带宽风险： 领导层注意力要在完成分拆、加速 Kraken 独立增长、维持 Octopus
              零售竞争地位之间分配。 借助 SoLR 任命快速增长客户——尤其六个月迁移 Bulb 的 1.5 million 个账户—— 可能在非主动选择迁移的客群中埋下潜在满意度或流失风险。 Octopus
              的气候和净零战略贡献了品牌资产， 但热泵、太阳能和 EV 所需的客户主张、安全制度和安装能力， 都不同于燃气和电力账单，长期产品转型风险因此上升。
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
