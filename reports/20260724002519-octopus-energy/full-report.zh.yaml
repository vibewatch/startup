      - number: '6.5'
        title: 扩张、集中度与先落地再扩张机制
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的扩张经济性由两套不同的先落地再扩张逻辑驱动。 零售分部的核心扩张机制是产品交叉销售：一个标准浮动费率客户， 可以升级到 Agile，再到 Intelligent Octopus
              Go，再到绑定 EV 租赁或 Cosy Octopus 热泵安装。 每一步都会提高客户生命周期价值、降低流失，并为 Kraken 平台生成更丰富的需求调度数据。 Electroverse
              产品把客户关系延伸到公共充电。Octopus Electric Vehicles 增加薪酬牺牲租赁。 Zero Bills 产品在费率关系之外带来硬件安装收入。
              能源生态内因此形成多产品漏斗，明显不同于商品化零售能源供应。 Kraken B2B 的扩张逻辑则是地域和垂直：客户通常从一个市场或一个模块开始， 再逐步扩至更多市场或模块。National Grid US
              从初期讨论推进到完整 Kraken 部署， 代表大规模地域先落地再扩张。Severn Trent Water 采用 Kraken 管理水务公用事业， 代表能源之外的垂直扩张。英国国内分部的客户集中度风险中等：
              单个住宅客户都不构成有意义收入占比，商品化零售市场里前 10 大客户风险实际为零。 更重要的是分部层面的集中度风险——英国国内零售贡献了集团大部分收入和利润，
              因此英国监管或批发市场出现不利条件时，集团影响会被放大。 消费者采购摩擦低（数字优先、无退出费切换），但 B2B Kraken 客户采购摩擦高： 替换账单系统是多年迁移，需要董事会层面批准和大量实施资源。
              因此赢下客户很难，失去客户也少见。
            claimRefs:
              - CU020
              - CU021
              - CU022
              - CU023
              - CU024
