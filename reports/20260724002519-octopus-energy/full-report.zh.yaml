      - number: '5.3'
        title: 虚拟电厂与需求灵活性
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的虚拟电厂是英国能源系统中运营最成熟的消费者侧灵活性资产之一。Kraken Asset 聚合加入智能电价的 EV、热泵和家庭电池负荷，调度约 2GW 灵活需求；Octopus
              称这是全球最大的面向消费者 VPP。这项能力在多个维度具备商业价值。第一，Octopus 可以参与 Balancing Mechanism 和辅助服务市场，为 National Grid ESO
              提供需求上调和下调并赚取收入。第二，Octopus 可向授权公用事业客户证明 Kraken Asset 是生产级 DER
              调度系统，从而加速企业销售。第三，智能电价客户能从参与中获得可量化经济收益，锁定更深。Intelligent Octopus Go 只要求客户连接一辆 EV 并设置出发时间；Kraken 的 ML
              系统自动处理全部充电排程。Ofgem 2024 年 1 月数据显示，在 502,000 名英国居民智能 TOU EV 电价客户中，超过一半使用 Octopus 电价，说明在车队大规模电气化之前，Octopus
              已在 EV 灵活性市场占据主导。Fan Club 电价通过在特定风电场发电时给附近客户折扣，创造超本地需求响应，降低平衡成本和输电损耗。Octopus Energy Generation 在 8 个国家拥有
              300 个可再生项目，把市场情报反馈进 Kraken 的批发价格预测，完成从发电、调度到客户计费的垂直整合数据闭环。Heatmiser 温控器集成把 VPP
              可纳入资产扩展到热泵，而热泵的可控时点对电网稳定至关重要。公开讨论的路线图包括：EV 电池技术成熟后集成 V2G，并进一步扩大电池储能参与电网平衡市场。
