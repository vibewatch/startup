      - number: '5.6'
        title: 信任、安全、隐私和合规
        blocks:
          - type: paragraph
            body: >-
              运营一家服务英国 1/4 家庭、为全球 70 million 个账户处理账单的公用事业公司， 需要严密的安全、隐私和合规控制。Octopus 声称 Kraken 平台的信息安全管理已获得 ISO/IEC
              27001 认证， 但认证范围和当前状态还需要独立核验。集团参与英国 Smart Data 计划， 表明它已介入不断演进的开放能源数据监管。Kraken 在德国、法国、意大利和西班牙的 EU 部署内置 GDPR
              合规， 并借助 AWS 区域基础设施满足数据驻留要求。智能电表数据处理受 DCC 数据访问控制和 Ofgem 许可条件约束。 消费者安全义务包括预付费电表保护（与 2025 年 7 月 Ofgem
              执法直接相关）、 通过 Priority Services Register 识别脆弱客户，以及监管规定的债务管理规则。 2025 年 Ofgem 开出 £1.5M 账单罚款，并要求退还 £2.64M、另支付
              £546K 善意补偿， 暴露出合规监控缺口，尤其在预付费和固定费用计费的边缘场景上。 相比 £12.4B 收入，上述事件财务影响不大，但声誉影响显著，
              也说明受监管客群的账单周期异常处理存在质量控制缺口。Octopus 大力投入客户运营团队， 英国员工从 50 人扩至 4,000 多人，并在 Trustpilot 和 Which? 上得分良好；
              即便后端账单自动化出现过孤立故障，前台服务质量仍然较强。Kraken B2B 平台对安全要求更高： 获许可的公用事业公司把客户数据和账单基础设施交给 Kraken，
              一旦持牌客户发生重大数据泄露或账单中断，Kraken 的企业销售管线会承受严重声誉后果。 渗透测试、SOC 监控、第三方集成的供应链安全，都需要在当前公开披露之外继续尽调确认。
