  topStrengths:
    - Kraken Technology 以 $8.65B 拆分（2025 年 12 月），是定义品类的公用事业 SaaS 平台，在 27+ 司法辖区拥有 70M+ 已签约账户；17x ARR 倍数与赢家通吃式平台动力一致。
    - 连续七年获 Which? Recommended Provider，NPS 超过 +60，既反映 Kraken 生产环境表现，也验证了平台对潜在公用事业被许可方的核心价值主张。
    - 持续投入后，FY24 首次实现实质性盈利（£83M 净利润、£95M EBITDA），降低后期烧钱风险，也证明零售和技术业务能在经济上相互支撑。
    - OEG Generation 的太阳能资产组合能自然对冲批发电价飙升，形成纯零售竞争对手拿不到的结构性成本优势。
  topRisks:
    - Kraken ARR（估计 $500M+）未经审计，也没有任何公开披露确认；拿不到数据室里的审计经常性收入和按地区划分的流失率，就无法承保整个 $8.65B 拆分估值和 17x ARR 倍数。
    - OEG 的大宗商品采购信贷额度（规模、交易对手、契约）未公开披露，形成无法建模的隐性杠杆；大宗商品价格承压时，可能触发追加保证金。
    - Ofgem 执法仍是活跃风险：2025 年 7 月 £1.5M 计费罚款和仍未结案的 2023 年预付费电表调查，都是金额未知的或有负债，并可能升级为全行业市场调查。
    - Kraken（70M+ 账户）单云依赖 AWS，制造了灾难性故障模式；公司没有披露多云故障切换或 DR 测试结果。如果 P0 宕机同时触发 SLA 罚款和监管谴责，投资逻辑会被打穿。
  unresolvedGaps:
    - Kraken ARR 和按地区划分的过去 12 个月流失率——核心估值驱动因素无法从公开来源审计；没有这些数据，$8.65B 倍数只是推测。
    - OEG 大宗商品信贷额度：规模、交易对手、契约和按市值计价头寸构成隐性杠杆；没有数据室访问权，无法建模。
    - 完整优先权 / 稀释堆叠（Series A 到 E）：二级投资者仅凭公开文件无法计算有效每股经济性；Companies House 只提供部分数据。
    - Ofgem 预付费电表调查（2023）：截至运行日期，针对 Octopus 的正式结果尚未公布；公开数据无法量化或有负债。
    - OEG FY25 审计账目：尚未发布；Kraken 拆分后、2025 年 7 月 Ofgem 执法后的财务状况未知。
