      - ["8090 Enterprise", "Managed design, build, hosting, and maintenance", "Starting around $1M/year list price", "Bundled software and services; recurring versus project revenue is unclear", "Obtain contract schedule, implementation fees, renewal terms, ownership, and delivery margin"]
      - ["Custom modernization", "Enterprise delivery engagements using the platform", "Named projects and case-study outcomes; revenue not disclosed", "May validate demand while increasing labor and working-capital intensity", "Obtain project-level bookings, recognized revenue, staffing, utilization, and contribution profit"]
      - ["Token / infrastructure usage", "Variable model-inference and compute consumption", "Separate token usage is disclosed; unit rates and pass-through policy are unavailable", "Could pressure gross margin as usage scales", "Obtain token price sheet, cloud commitments, customer allocation, and usage caps"]
      - ["EY-enabled distribution", "Partner-led enterprise rollout", "Rollout plans are public; active paid seats and channel economics are not", "May lower direct acquisition friction while creating partner concentration and revenue-sharing risk", "Obtain sourced pipeline, active paid seats, partner fees, sales-cycle data, and direct-versus-channel bookings"]
    notes: "Public list prices and company-reported case studies are not recognized revenue, ARR, or margin; null economics require contract and cohort data."
    claimRefs: [CI001, CI002, CI005, CI013, CI014]
  - id: TI002
    title: "Pricing and monetization terms"
    columns: ["Offering", "List / stated pricing", "Included scope", "Unknown or caveat", "Underwriting implication"]
    rows:
      - ["Software Factory", "$200 per user per month", "Platform access, with token usage separate", "Discounts, paid-seat conversion, token rates, and support costs are not disclosed", "Model as subscription plus variable usage, not as reported ARR"]
      - ["8090 Enterprise", "Starting around $1M per year", "Managed build-and-host engagement", "Contract-specific scope, renewal, SLA, IP, and pass-through terms are unavailable", "Assess as hybrid software/services revenue until contract evidence separates components"]
      - ["Free / limited participation", "Not established in assigned evidence", "No reliable public scope for free seats", "Do not assume free-tier conversion or seat eligibility", "Leave contribution assumptions open"]
      - ["Discounts and realized price", "Not disclosed", "No customer invoices or contracts retained", "List price cannot establish average selling price", "Require signed order forms and cohort-level realized pricing"]
    notes: "Prices are public list or starting prices where stated; they do not establish realized revenue, gross margin, or customer willingness to pay."
    claimRefs: [CI001, CI002, CI003]
  - id: TI003
    title: "Unit economics and capital adequacy checklist"
    columns: ["Metric", "Public value", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Series A financing", "$135M announced June 2026", "Medium; company announcement corroborated by independent coverage", "Provides disclosed financing capacity but not operating runway", "Verify closing, cash balance, liquidation preferences, and restricted proceeds"]
      - ["Revenue / ARR", null, "Unavailable", "Determines whether platform economics are recurring and scalable", "Obtain monthly recurring revenue bridge, recognized revenue, bookings, and mix"]
      - ["Gross margin", null, "Unavailable", "Separates software leverage from delivery and compute intensity", "Obtain COGS by platform, inference, hosting, implementation, and support"]
      - ["Burn / runway", null, "Unavailable", "Determines next-round dependency and financing risk", "Obtain 24-month cash forecast, monthly burn, hiring plan, debt, and runway cases"]
      - ["CAC / payback / retention", null, "Unavailable", "Tests whether enterprise distribution converts efficiently", "Obtain pipeline conversion, sales cycle, CAC, payback, logo retention, and NRR"]
    notes: "Nulls denote unavailable public evidence, not zero; the Series A amount is funding raised, not cash available or runway."
    claimRefs: [CI009, CI010, CI011, CI012]

