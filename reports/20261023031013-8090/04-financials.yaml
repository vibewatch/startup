callouts:
  - calloutType: risk
    title: "Services intensity is the central financial unknown"
    body: "The $1M-plus managed offering and disclosed delivery work can prove enterprise willingness to pay, but without project margin, utilization, and recurring-revenue disclosure the public record cannot establish software-like operating leverage."
    claimRefs: [CI002, CI005, CI007, CI012]
  - calloutType: insight
    title: "Financing is evidence of capacity, not evidence of profitability"
    body: "The $135M Series A improves near-term capitalization visibility, yet the retained sources do not disclose cash balance, burn, runway, debt, or the amount of financing still available for operations."
    claimRefs: [CI009, CI010, CI011]

