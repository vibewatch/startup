company:
  name: "8090"
chapter:
  number: 4
  title: "Financials"
  summary: "8090 has disclosed a $135M Series A and a two-tier monetization model, but public evidence does not disclose revenue, burn, margin, retention, or realized pricing. The underwriting case therefore rests on validating whether managed delivery can convert into repeatable software economics without excessive services intensity."
sections:
  - id: revenue-model
    title: "Revenue model and monetization"
    body: >-
      Public materials describe two distinct commercial motions. Software Factory is
      self-serve access priced around $200 per user per month plus token usage, while
      8090 Enterprise is a managed design, build, host, and maintain engagement
      starting around $1M per year. These are not interchangeable revenue streams:
      the first resembles platform subscription revenue with variable inference cost,
      while the second bundles software, implementation, and ongoing service delivery.
      The published prices are list prices, not realized revenue, contracted ARR, gross
      margin, or customer-level contribution profit. Public reporting also describes
      the platform as connecting requirements, architecture, work orders, code,
      testing, and production maintenance, which supports the product mechanism but
      does not establish adoption or renewal economics. A diligence-grade model
      should separate seat revenue, token pass-through, implementation fees, managed
      hosting, and support before applying SaaS multiples.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: traction-and-costs
    title: "Traction, delivery economics, and cost structure"
    body: >-
      The strongest public traction evidence is commercial activity rather than a
      reported income statement. The company says its platform also powers an
      enterprise delivery business and cites a healthcare modernization project that
      reverse-engineered more than 18 million lines of COBOL and Assembly into more
      than 300,000 rules in 40 days. Those figures are company-reported case-study
      claims; they indicate the type of labor and infrastructure burden the model may
      carry, but they do not disclose project revenue, gross profit, utilization,
      cloud spend, or repeatability. Independent coverage characterizes the business
      as an AI-enabled software factory serving regulated enterprise customers, while
      critical commentary argues that the model may be closer to AI-enabled services
      than pure software. That disagreement is financially material: services-heavy
      delivery can accelerate bookings while constraining margins and creating
      working-capital needs. No public source in the assigned pool provides CAC,
      payback, churn, NRR, gross margin, or a verified customer count.
    claimRefs: [CI005, CI006, CI007, CI008, CI013, CI014]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: "Capital adequacy and underwriting verdict"
    body: >-
      The June 2026 financing announcement reports a $135M Series A led by Salesforce,
      with additional institutional and angel participation. The round provides
      disclosed financing capacity, but it is not cash-on-hand, cash available for
      operations, or proof of runway. The company has not publicly disclosed burn,
      debt, cash balance, financing covenants, or the next-round trigger in the
      retained evidence. A contemporaneous independent account says the capital is
      intended to expand the commercial footprint, scale the platform globally, and
      invest in infrastructure for enterprise adoption; an independent funding
      summary says the company intends to accelerate hiring and high-performance
      compute and infrastructure. Those uses imply potentially significant
      operating and compute commitments, but no precise spend rate should be inferred.
      The financial verdict is therefore conditional: the financing reduces near-term
      funding uncertainty, while revenue quality, margin path, and capital intensity
      remain underwriting blockers.
    claimRefs: [CI009, CI010, CI011, CI012]

