chapter:
  number: 6
  title: "Customers"
  summary: "8090 publicly targets regulated and complex enterprises with a governed software-delivery platform and a managed delivery service. The evidence includes named customer references and an EY rollout plan, but does not establish active seats, retention, revenue concentration, or independently verified customer outcomes."
sections:
  - id: buyer-segments
    title: "Buyer segments and buying motions"
    body: "8090 addresses two related but distinct customer jobs. Software Factory is a self-serve development workspace for teams that want to coordinate requirements, architecture, work orders, code, testing, and feedback with auditability. 8090 Enterprise is a managed delivery motion in which the company builds, hosts, and manages an application for the customer. The distinction matters because a seat-based platform sale has different adoption and retention economics from a services-led application engagement. Public descriptions consistently place the target buyer in regulated or otherwise complex environments, including healthcare, life sciences, insurance, aerospace, energy, manufacturing, financial services, and government. The product page's customer testimonials identify named executives at EY, Mach33 Financial Group, ShadowTech Solutions, and Tie, but these testimonials are company-hosted and do not disclose contract size, deployment scope, active users, or renewal status. The public record therefore supports segment fit and named reference evidence more strongly than broad customer-count or recurring-revenue claims."
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-proof
    title: "Adoption trajectory and named proof"
    body: "The clearest public adoption signal is EY.ai PDLC: the available reporting says EY launched a product-development framework powered by 8090 and planned deployment across tens of thousands of EY US consultants and client engagements. That is a rollout plan, not a verified active-seat count. The same public account attributes 70% efficiency or cost improvement, up to 80-times faster delivery, and more than 95% automated test coverage to EY internal use cases; those figures are not presented here as independently audited customer outcomes. A third-party company profile names CMS, EY, Bissell, Dompe, AdaptHealth, and Palmetto as customers or partners, while a competitor-affiliated review describes CMS ClaimsCore as a modernization engagement involving extraction from 18 million lines of Assembly and COBOL. The CMS account is explicitly limited by the source: 8090 is one of several contractors, CMS endorsement is disclaimed, and illustrative material is not proof of extraction accuracy. These references show commercial activity and use cases, but they do not establish production breadth across the named organizations."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: "Retention, expansion, and concentration risks"
    body: "Public materials do not disclose net revenue retention, gross retention, churn, renewal rates, cohort behavior, contract length, active customer count, or revenue by customer. The absence of those disclosures prevents a quantitative conclusion about durability or concentration. EY is strategically important because it is both a named customer or partner and a distribution channel into consultants and client engagements; the available independent commentary characterizes EY as a channel relationship rather than evidence that all downstream client deployments are 8090 contracts. Customer-hosted testimonials also provide qualitative support but no denominator or time series. Procurement diligence should separate Software Factory seats from managed Enterprise projects, test a representative workload, obtain named production references, and request contract terms for support, portability, usage-based token costs, data handling, and renewal. Until that work is done, the strongest customer conclusion is that 8090 has credible reference signals and an enterprise-oriented go-to-market, while expansion and concentration remain unresolved."
    claimRefs: [CU010, CU011, CU012, CU013]
  - id: diligence-implications
    title: "Customer diligence implications"
    body: "The customer case is investable only if references convert into repeatable, measurable deployments. For self-serve adoption, request paid-seat counts, active-seat utilization, token consumption, time-to-first-value, support tickets, and renewal cohorts by customer segment. For managed Enterprise work, request signed scope, implementation milestones, gross margin by engagement, production go-live status, uptime or service-level history, and customer-owned deliverables. For named proof, interview at least one end-user or accountable buyer at each materially different segment rather than accepting a logo or vendor testimonial as evidence of production use. For the EY route, distinguish internal EY usage from downstream client work and identify who contracts with 8090. These asks are particularly important because the public material mixes platform adoption, managed delivery, partner rollout, and customer logos without a common denominator."
    claimRefs: [CU010, CU011, CU012, CU013]
