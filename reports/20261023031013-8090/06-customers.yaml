      - ["CMS", "Government / regulated modernization", "CMS ClaimsCore account described as business-rule extraction from 18 million lines of Assembly and COBOL", "Specific engagement; production scope not established", "Rules traced to source and reviewed in a dedicated application", "8090 is one of several contractors; CMS endorsement and extraction accuracy are not established"]
      - ["Mach33 Financial Group", "Financial services", "CIO testimonial says an internal effort was stopped and two programmers were reassigned after using Software Factory", "Company-hosted testimonial; deployment scope not disclosed", "Qualitative productivity and workflow signal", "No contract, duration, baseline, or independent corroboration"]
    notes: "Enumeration is limited to public named proof with a distinct use or outcome statement; logos without a deployment description are excluded."
    enumerationScope:
      coverage: sample
      basis: "Publicly named customer or partner references available in the assigned pool as of the 2026-10-23 report run date"
    claimRefs: [CU005, CU006, CU009]
