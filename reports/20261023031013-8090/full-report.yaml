  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product workflow and buyer job
        blocks:
          - type: paragraph
            body: >-
              8090's customer-facing product is not positioned as an editor autocomplete. The company describes Software
              Factory as a workflow that starts with a business problem, turns intent into requirements and
              architecture, gives agents bounded work, and checks the resulting change. Its public homepage says each
              change is traced to intent and tested, while the funding announcement describes the chain from business
              intent through production maintenance. This makes the buyer job coordination and accountability around
              enterprise software, especially where a wrong change is costly. The independent descriptions converge on
              that control plane framing, but they do not prove that the workflow produces correct output without
              customer-specific review.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE005
              - CE006
              - CE007
      - number: '5.2'
        title: Modules, maturity, and operating model
        blocks:
          - type: paragraph
            body: >-
              Public descriptions agree on a five-part workflow but show that the product vocabulary has changed. One
              description uses Refinery, Foundry, Planner, Assembler, and Validator; a September review reports the
              current names as Requirements, Blueprints, Work Orders, Tests, and Feedback. The requirements guide
              supplies the document model behind the first layer—product overviews, feature requirements, personas,
              success metrics, and technical requirements. The September review also reports repository indexing, GitHub
              or GitLab connections, MCP-based agent access, release activity, and custom work-order statuses. This is
              evidence of a shipped workflow surface, not a verified service-level maturity assessment: the retained
              sources do not disclose deployment topology, failure rates, or a reproducible benchmark.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE006
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE005
              - CE009
      - number: '5.3'
        title: Integration, governance, and trust boundary
        blocks:
          - type: paragraph
            body: >-
              Software Factory's integration model leaves the customer's existing coding environment in place while
              agents receive structured work through MCP. MCP is an open standard for connecting AI applications to data
              sources, tools, and workflows, and its documentation lists support across several assistants and
              development tools. That is a credible interoperability surface, but it is not evidence that 8090's
              implementation is secure or portable in every customer environment. NIST describes the AI Risk Management
              Framework as a voluntary way to incorporate trustworthiness into design, development, use, and evaluation.
              Against that bar, the product's audit-trail promise is relevant, while certification, tenant isolation,
              data retention, access control, uptime, and incident history remain unverified.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE009
              - CE011
              - CE012
      - number: '5.4'
        title: Differentiation and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              The defensible product thesis is process continuity rather than a proprietary foundation model:
              requirements, architecture decisions, work orders, execution, and validation remain linked while the
              underlying models can change. That distinction matters for regulated or complex buyers, and 8090 also
              sells a managed enterprise service in which it designs, builds, hosts, and maintains applications.
              However, the same positioning creates execution dependencies. Customers must test whether the captured
              context stays synchronized with code, whether model changes alter results, and whether the managed service
              can meet contractual security and availability requirements. Public evidence does not establish
              customer-independent productivity, quality, or safety outcomes, nor does it provide 8090-specific
              developer adoption metrics.
            claimRefs:
              - CE013
              - CE014
              - CE015
