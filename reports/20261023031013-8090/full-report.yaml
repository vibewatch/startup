      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The June 2026 financing announcement reports a $135M Series A led by Salesforce, with additional
              institutional and angel participation. The round provides disclosed financing capacity, but it is not
              cash-on-hand, cash available for operations, or proof of runway. The company has not publicly disclosed
              burn, debt, cash balance, financing covenants, or the next-round trigger in the retained evidence. A
              contemporaneous independent account says the capital is intended to expand the commercial footprint, scale
              the platform globally, and invest in infrastructure for enterprise adoption; an independent funding
              summary says the company intends to accelerate hiring and high-performance compute and infrastructure.
              Those uses imply potentially significant operating and compute commitments, but no precise spend rate
              should be inferred. The financial verdict is therefore conditional: the financing reduces near-term
              funding uncertainty, while revenue quality, margin path, and capital intensity remain underwriting
              blockers.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Services intensity is the central financial unknown
            body: >-
              The $1M-plus managed offering and disclosed delivery work can prove enterprise willingness to pay, but
              without project margin, utilization, and recurring-revenue disclosure the public record cannot establish
              software-like operating leverage.
            calloutType: risk
            claimRefs:
              - CI002
              - CI005
              - CI007
              - CI012
          - type: callout
            title: Financing is evidence of capacity, not evidence of profitability
            body: >-
              The $135M Series A improves near-term capitalization visibility, yet the retained sources do not disclose
              cash balance, burn, runway, debt, or the amount of financing still available for operations.
            calloutType: insight
            claimRefs:
