  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer choice
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set spans several buying decisions rather than a single feature checklist.
              General coding assistants such as Cursor and Replit Agent optimize for individual or small-team app
              creation, while Salesforce Agentforce and Appian position governed agents inside enterprise context and
              workflows. 8090 describes Software Factory as a control plane that links business intent, requirements,
              architecture, work orders, code, testing, and maintenance; it also sells 8090 Enterprise as a managed
              service. Independent commentary characterizes the product more narrowly as process and verification
              wrapped around interchangeable models, and says its overhead is justified when a wrong change is costly or
              must be defensible. The status quo therefore includes disciplined internal engineering, existing system
              integrators, and internal build: each can preserve control without buying a new platform, but each leaves
              the buyer to assemble more of the workflow.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: Capability, trust, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              8090's defensible wedge is the combination of shared product and architecture context, structured work
              orders, validation, and an audit trail aimed at regulated production systems. That wedge is not unique at
              the level of individual capabilities. Salesforce says Agentforce grounds agents in enterprise context,
              business rules, observability, and security controls; Appian emphasizes long-running workflows, shared
              state, permissions, execution logging, and explicit human escalation; Replit emphasizes chat-based
              construction, integrations, and self-testing. These are competitor-issued descriptions, not independent
              performance benchmarks. NIST's framework makes trustworthy AI risk management a recognized buyer concern,
              but it does not certify 8090 or any competitor. A buyer should therefore test traceability, exception
              handling, data controls, and output portability on a representative workflow rather than infer superiority
              from feature language.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Pricing, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public pricing exposes a meaningful packaging contrast. A third-party research profile reports 8090
              Software Factory at about $200 per user per month plus token usage and 8090 Enterprise at about $1 million
              per year starting price, while the company-facing directory says pricing is not published and arranged
              through sales. Cursor publishes individual, team, and enterprise tiers, with third-party model usage
              billed separately; Replit Agent promotes a conversational build-and-refine workflow but does not establish
              an equivalent enterprise contract price in the fetched page. The comparison is therefore directional, not
              a total-cost model. Switching costs could arise from requirements, blueprints, work orders, knowledge
              graph context, integrations, and accumulated audit history, but public sources do not quantify retention,
              migration friction, or customer concentration. 8090's managed service and EY relationship may improve
              distribution, while Salesforce, Appian, and system integrators bring installed-base access that can
              compress the differentiation gap.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: Durability assessment and unresolved risks
        blocks:
          - type: paragraph
            body: >-
              The moat is plausible but not yet proven as durable. Requirements-to-code traceability and institutional
              context can become embedded in customer workflows, yet model generation itself is increasingly
              interchangeable and competitors are adding governed agent execution. Independent reporting also frames
              8090 as an AI-enabled delivery business, which raises a services-versus-software margin and scalability
              question rather than resolving it. The company names a $135 million Series A and enterprise relationships,
              but public evidence here does not disclose ARR, renewal rates, realized pricing, implementation margins,
              or benchmarked productivity by customer. The key diligence test is a paid, representative deployment with
              explicit acceptance criteria for traceability, exception rates, cost per delivered change, integration
              effort, and portability. Until those results exist, 8090 is differentiated by workflow ambition and buyer
              focus, not by a demonstrated performance moat.
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits consolidate the source-backed competitor profiles, capability distinctions, and public
              pricing signals used in this chapter. They separate issuer descriptions from independent observations and
              keep unlike units apart: per-user subscriptions, managed annual contracts, conversation pricing, and
              unpriced enterprise offerings are not interchangeable. The matrix leaves non-comparable cells qualified
              rather than treating a missing disclosure as a negative capability. The positioning map is an ordinal
              analytical aid based on stated workflow and governance scope, not a market-share estimate or an
              independently measured performance ranking. Buyers should validate the assumptions in a representative
              deployment.
            claimRefs:
              - CP001
              - CP005
              - CP009
      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is workflow-level, not model-level
            body: >-
              The strongest independent framing is that 8090 sells the process around AI models—requirements, work
              orders, validation, and audit trails—while generation is increasingly interchangeable.
            calloutType: insight
            claimRefs:
              - CP003
              - CP013
          - type: callout
            title: Installed-base competitors can narrow the gap
            body: >-
              Salesforce and Appian already describe governed context, workflow controls, permissions, and auditability,
              while system integrators can supply distribution and implementation capacity.
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP015
          - type: callout
            title: Require a measured deployment comparison
            body: >-
              Before underwriting moat durability, compare 8090 with the incumbent workflow and a lighter coding-agent
              substitute on one representative regulated workflow using traceability, exception, cost, and portability
              metrics.
            calloutType: recommendation
            claimRefs:
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public materials describe two distinct commercial motions. Software Factory is self-serve access priced
              around $200 per user per month plus token usage, while 8090 Enterprise is a managed design, build, host,
              and maintain engagement starting around $1M per year. These are not interchangeable revenue streams: the
              first resembles platform subscription revenue with variable inference cost, while the second bundles
              software, implementation, and ongoing service delivery. The published prices are list prices, not realized
              revenue, contracted ARR, gross margin, or customer-level contribution profit. Public reporting also
              describes the platform as connecting requirements, architecture, work orders, code, testing, and
              production maintenance, which supports the product mechanism but does not establish adoption or renewal
              economics. A diligence-grade model should separate seat revenue, token pass-through, implementation fees,
              managed hosting, and support before applying SaaS multiples.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
