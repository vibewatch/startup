              - CU006
              - CU010
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The clearest public adoption signal is EY.ai PDLC: the available reporting says EY launched a
              product-development framework powered by 8090 and planned deployment across tens of thousands of EY US
              consultants and client engagements. That is a rollout plan, not a verified active-seat count. The same
              public account attributes 70% efficiency or cost improvement, up to 80-times faster delivery, and more
              than 95% automated test coverage to EY internal use cases; those figures are not presented here as
              independently audited customer outcomes. A third-party company profile names CMS, EY, Bissell, Dompe,
              AdaptHealth, and Palmetto as customers or partners, while a competitor-affiliated review describes CMS
              ClaimsCore as a modernization engagement involving extraction from 18 million lines of Assembly and COBOL.
              The CMS account is explicitly limited by the source: 8090 is one of several contractors, CMS endorsement
              is disclaimed, and illustrative material is not proof of extraction accuracy. These references show
              commercial activity and use cases, but they do not establish production breadth across the named
              organizations.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU009
      - number: '6.3'
        title: Retention, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Public materials do not disclose net revenue retention, gross retention, churn, renewal rates, cohort
              behavior, contract length, active customer count, or revenue by customer. The absence of those disclosures
              prevents a quantitative conclusion about durability or concentration. EY is strategically important
              because it is both a named customer or partner and a distribution channel into consultants and client
              engagements; the available independent commentary characterizes EY as a channel relationship rather than
              evidence that all downstream client deployments are 8090 contracts. Customer-hosted testimonials also
              provide qualitative support but no denominator or time series. Procurement diligence should separate
              Software Factory seats from managed Enterprise projects, test a representative workload, obtain named
              production references, and request contract terms for support, portability, usage-based token costs, data
              handling, and renewal. Until that work is done, the strongest customer conclusion is that 8090 has
              credible reference signals and an enterprise-oriented go-to-market, while expansion and concentration
              remain unresolved.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Customer diligence implications
        blocks:
          - type: paragraph
            body: >-
              The customer case is investable only if references convert into repeatable, measurable deployments. For
              self-serve adoption, request paid-seat counts, active-seat utilization, token consumption,
              time-to-first-value, support tickets, and renewal cohorts by customer segment. For managed Enterprise
              work, request signed scope, implementation milestones, gross margin by engagement, production go-live
              status, uptime or service-level history, and customer-owned deliverables. For named proof, interview at
              least one end-user or accountable buyer at each materially different segment rather than accepting a logo
              or vendor testimonial as evidence of production use. For the EY route, distinguish internal EY usage from
              downstream client work and identify who contracts with 8090. These asks are particularly important because
              the public material mixes platform adoption, managed delivery, partner rollout, and customer logos without
              a common denominator.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Named proof is more substantive than logos alone
            body: >-
              EY rollout evidence and the CMS modernization description connect named organizations to concrete
              workflows, although neither establishes active-seat scale or independently verified outcomes.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU009
          - type: callout
            title: Retention and concentration are not measurable from public evidence
            body: >-
              No public source in the assigned pool discloses NRR, churn, renewal cohorts, customer revenue
              concentration, or a denominator for the named customer set.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
          - type: callout
            title: Separate platform adoption from managed-services diligence
            body: >-
              Underwrite Software Factory seats and 8090 Enterprise engagements separately, then validate one
              representative workload with named buyer references and contract-level economics.
            calloutType: recommendation
            claimRefs:
              - CU002
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              8090 positions Software Factory for regulated and mission-critical enterprise environments, making
              substantiation and responsibility allocation central risks rather than peripheral compliance tasks.
              National Law Review reported that the FTC's Operation AI Comply applied existing
              unfair-or-deceptive-practice authority to AI-related conduct; the source does not concern 8090, but it
              demonstrates that AI marketing receives no exemption from general law. The company's own financing
              announcement emphasizes governance, orchestration, accountability, and auditability, yet the assigned
              evidence does not establish deployment-specific regulatory classifications, certifications, privacy terms,
              indemnities, or responsibility for a customer's regulated outcome. Residual exposure is therefore high
              until management supplies control mappings and negotiated contract evidence. No assigned source reports an
              enforcement action against 8090, but that limited record cannot establish that no incident, inquiry, or
              dispute exists.
            claimRefs:
              - CR008
              - CR012
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR012
              - CR015
      - number: '7.2'
        title: Operational, security, and quality failure modes
        blocks:
          - type: paragraph
            body: >-
              The managed offering broadens 8090's accountability: the company says it hosts, maintains, and keeps
              customer systems current as businesses and models change. That promise creates continuity,
              change-management, confidentiality, and generated-output risk alongside ordinary software delivery risk.
              Independent commentary describes the product as a documented workflow rather than a guarantee that
              generated code is correct, and argues that a factory process earns its overhead when errors can cause
              outages or regulatory scrutiny. Public positioning around requirements, testing, validation, and audit
              trails is directionally relevant, but the assigned evidence does not verify penetration tests, incident
              response, recovery objectives, uptime, escaped defects, or human-approval effectiveness. These are risk
              mechanisms, not claims that 8090 has suffered a breach or outage. A representative deployment should be
              tested against measurable acceptance, rollback, access-control, and recovery criteria before the
              governance premium is credited.
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR007
              - CR008
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: Partner, financial, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              The June 2026 financing provides resources but not proof of a durable operating model. 8090 announced a
              $135M Series A led by Salesforce, while independent coverage said the proceeds were intended for hiring,
              technical expansion, compute, and infrastructure. Toflow reported that revenue figures were not publicly
              disclosed, and Ry Walker's assessment cautioned that financing and delivery relationships do not establish
              profitability, retention, or support durability. The business also spans a per-seat platform and a managed
              enterprise service, exposing investors to both software adoption risk and labor-intensive delivery risk.
              EY can be a powerful implementation and distribution channel, but the assigned evidence describes rollout
              plans rather than verified active seats, recurring production revenue, or independently measured outcomes.
              Without revenue mix, utilization, backlog, renewal, gross-margin, burn, runway, and account-concentration
              data, neither funding raised nor named relationships should be treated as cash availability or commercial
              durability.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Monitoring and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              The investment thesis depends on evidence that governance reduces failure risk without making delivery
              uneconomic. A material customer incident, regulatory challenge to an AI claim, repeated escaped defect, or
              inability to meet a contracted recovery objective would directly weaken 8090's differentiation.
              Commercially, an EY rollout that does not convert into contracted production work, persistent dependence
              on a few lighthouse customers, or managed-service gross margins that fail to improve with scale would
              signal a fragile channel or services-heavy model. Financially, hiring and infrastructure spend that
              materially outruns contracted backlog, or a financing event on worse terms before durable renewal evidence
              appears, would raise capital-risk concerns. Public sources do not provide the baselines needed to set
              numeric triggers, so management should supply board-approved thresholds for incidents, service levels,
              customer concentration, contribution margin, cash runway, and partner-sourced conversion before these
              mitigations are treated as mature.
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break risk
            body: >-
              A material customer incident or regulatory control failure would directly undermine the governance premium
              used to distinguish 8090 from lower-control coding tools.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR012
              - CR015
          - type: callout
            title: Evidence boundary
            body: >-
              The assigned evidence supports risk mechanisms and announced financing or relationships, but it does not
              verify revenue, retention, cash runway, security certifications, incident history, or customer
              concentration.
            calloutType: assumption
            claimRefs:
              - CR002
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is that 8090 is positioned around a real enterprise pain point: coordinating
              requirements, architecture, work orders, code, testing, and production maintenance in one auditable
              workflow. Its June 2026 announcement says the company raised $135M led by Salesforce, while independent
              coverage describes a control-plane product aimed at regulated and complex industries rather than a generic
              coding assistant. That combination can support high willingness to pay when the cost of an incorrect
              change is material. The countercase is that the public evidence still mixes a platform with a
              labor-intensive delivery model. A contemporaneous operator analysis calls the company “a services
              business,” and the public materials disclose no revenue, gross margin, recurring-revenue mix, renewal,
              utilization, or customer concentration figures. Funding is capital raised, not cash available for return,
              and reported customer or partner rollout plans are not verified active-seat or revenue evidence. The
              thesis is attractive only if repeatable software economics emerge alongside delivery credibility;
              otherwise a large financing headline may be underwriting a consultancy with software leverage that remains
              unproven.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV011
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The latest disclosed financing is a $135M Series A announced in June 2026, led by Salesforce with other
              named investors. The company’s own announcement says the capital will fund hiring and
              compute/infrastructure, which is a use-of-proceeds statement rather than a runway or burn disclosure.
              FundedIQ records one disclosed round and an 11–50 employee band, but that is a database snapshot and not a
              substitute for a current cap table. The assigned public evidence does not disclose the post-money
              valuation, preferred liquidation preferences, participation rights, option-pool treatment, debt, secondary
              liquidity, or current cash balance. Consequently, no defensible price-to-revenue, ARR multiple, or
              dilution-adjusted return can be calculated from the retained evidence. Entry discipline should require the
              round price and preference stack, audited or management revenue by product line, gross margin by
              self-serve versus managed work, cash burn and runway, and a referenceable cohort of paying customers.
              Until those data are available, the correct stance is to track the company and negotiate an evidence-based
              price rather than extrapolate a valuation from the size of the round.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, comparables, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be framed as decision thresholds, not false precision. The bull case requires
              repeatable software adoption, evidence that governed workflows create measurable customer value, and a
              growing share of high-margin recurring software revenue. The base case assumes demand for
              regulated-enterprise modernization exists but that implementation labor and partner dependence keep
              margins and velocity mixed. The bear case is that agent capabilities commoditize the workflow, large
              system integrators and platform vendors capture distribution, and 8090 remains a bespoke services provider
              without disclosed recurring economics. Sapphire’s historical vertical-software comparison reports a
              roughly 9x median NTM multiple for its tracked public vertical set versus roughly 5x for broader
              application software, but that benchmark is from July 2023 and is not a direct 8090 valuation. Sequoia’s
              market analysis similarly warns that many generative-AI companies lacked product-market fit or sustainable
              advantage. The underwriting decision should therefore turn on current revenue quality, retention,
              contribution margin, customer concentration, contract rights, and evidence that the platform—not only the
              implementation team—captures durable value.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              The evidence supports a differentiated enterprise thesis and meaningful financing, but not a defensible
              valuation or return case. Require current operating metrics and transaction terms before assigning a
              price-sensitive recommendation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV016
          - type: callout
            title: The services-versus-software mix is decisive
            body: >-
              A managed delivery business can create customer proof while also producing lower, less recurring margins
              than a software platform. Product-line revenue, gross margin, utilization, and renewal data are the key
              underwriting gap.
            calloutType: risk
            claimRefs:
              - CV004
              - CV011
              - CV014
