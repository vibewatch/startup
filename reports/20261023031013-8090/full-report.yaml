      - number: '4.2'
        title: Traction, delivery economics, and cost structure
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction evidence is commercial activity rather than a reported income statement. The
              company says its platform also powers an enterprise delivery business and cites a healthcare modernization
              project that reverse-engineered more than 18 million lines of COBOL and Assembly into more than 300,000
              rules in 40 days. Those figures are company-reported case-study claims; they indicate the type of labor
              and infrastructure burden the model may carry, but they do not disclose project revenue, gross profit,
              utilization, cloud spend, or repeatability. Independent coverage characterizes the business as an
              AI-enabled software factory serving regulated enterprise customers, while critical commentary argues that
              the model may be closer to AI-enabled services than pure software. That disagreement is financially
              material: services-heavy delivery can accelerate bookings while constraining margins and creating
              working-capital needs. No public source in the assigned pool provides CAC, payback, churn, NRR, gross
              margin, or a verified customer count.
            claimRefs:
              - CI005
