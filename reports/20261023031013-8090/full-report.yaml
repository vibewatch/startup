            body: >-
              TechCrunch reports that Chamath Palihapitiya founded 8090 in January 2024 for corporate programming teams,
              while EY and independent coverage locate the company in Menlo Park. Public descriptions position Software
              Factory as more than an in-editor coding assistant: EY describes a delivery model spanning requirements,
              architecture, code, testing, infrastructure, and operations, and 8090 calls it an AI-native SDLC control
