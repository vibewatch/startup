  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and buying motions
        blocks:
          - type: paragraph
            body: >-
              8090 addresses two related but distinct customer jobs. Software Factory is a self-serve development
              workspace for teams that want to coordinate requirements, architecture, work orders, code, testing, and
              feedback with auditability. 8090 Enterprise is a managed delivery motion in which the company builds,
              hosts, and manages an application for the customer. The distinction matters because a seat-based platform
              sale has different adoption and retention economics from a services-led application engagement. Public
              descriptions consistently place the target buyer in regulated or otherwise complex environments, including
              healthcare, life sciences, insurance, aerospace, energy, manufacturing, financial services, and
              government. The product page's customer testimonials identify named executives at EY, Mach33 Financial
              Group, ShadowTech Solutions, and Tie, but these testimonials are company-hosted and do not disclose
              contract size, deployment scope, active users, or renewal status. The public record therefore supports
              segment fit and named reference evidence more strongly than broad customer-count or recurring-revenue
              claims.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
