  - id: FE001
    title: Software Factory product architecture map
    type: stack
    summary: The public workflow is layered from business intent through requirements, design, execution, and validation.
    data:
      layers:
        - label: Intent
          detail: Business problem and desired outcome define what should be built and why.
        - label: Requirements
          detail: Product Overview Documents and Feature Requirements Documents make behavior explicit and testable.
        - label: Architecture
          detail: Blueprints record technical decisions and keep design context linked to requirements.
        - label: Planning
          detail: Work Orders package scoped implementation context for bounded execution.
        - label: Agent execution
          detail: Assembler hands work to AI agents in existing environments through MCP.
        - label: Validation and feedback
          detail: Validator connects tests, review, and incoming feedback back to structured development work.
