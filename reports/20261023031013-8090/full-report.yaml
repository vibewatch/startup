  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'A bounded market: governed enterprise software delivery'
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all software development and not all generative-AI tooling. It is the spend by
              enterprises that need new or modernized applications delivered with requirements, architecture,
              implementation, testing, and an auditable record of decisions. The included spend therefore covers
              governed SDLC control-plane software, implementation services, and managed application delivery for
              complex or regulated workflows. It excludes individual-developer autocomplete, general-purpose foundation
              models, and ordinary software-integrator work that does not use an AI-native control plane. This boundary
              matters because 8090 presents a software platform and a managed delivery offering, which address adjacent
              budgets but require different sales motions and operating economics.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM012
              - CM013
      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              The evidence supports several broad sizing lenses, not a defensible 8090-specific TAM. McKinsey reports
              about $15 billion of global-enterprise spending on generative-AI solutions in 2023 and projects $175
              billion to $250 billion of spending on the technology by 2027. Its analysis also places IT at close to 40%
              of current functional usage and expects customer care to represent 15% of total spending by 2027. These
              figures describe enterprise generative AI broadly, not governed software delivery or 8090's serviceable
              market. A narrower model must start with regulated-enterprise application budgets, modernization projects,
              qualified accounts, adoption rates, and the split between software and managed delivery; those
              denominators are not publicly disclosed.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: Buyer segmentation, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption case is where a wrong change is costly, difficult to reverse, or must be explained
              to an auditor. Assigned sources identify regulated industries as the target and frame the value around
              specification, governance, validation, and a persistent audit trail. The counterweight is that buyers
              still need workload-specific proof, measurable outcomes, and acceptable data, ownership, and integration
              terms. One independent commentator characterizes 8090 as a bespoke services business, highlighting
              delivery intensity and channel dependence rather than pure-software economics. Deloitte's scaling
              discussion and GitHub's warning against single-metric productivity judgments support a pragmatic
              evaluation approach, while the U.S. Copyright Office's continuing AI work shows that policy questions
              around generated outputs and training remain active.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The opportunity is governance around delivery
            body: >-
              The evidence points to a market wedge where auditability, requirements traceability, and managed execution
              carry more buying weight than raw code generation speed.
            calloutType: insight
            claimRefs:
              - CM001
              - CM012
          - type: callout
            title: Sizing remains an evidence gap
            body: >-
