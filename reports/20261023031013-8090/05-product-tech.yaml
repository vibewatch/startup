chapter:
  number: 5
  title: "Product & Technology"
  summary: "8090 presents Software Factory as a governed software-delivery control plane that connects requirements, architecture, work orders, code, testing, and production maintenance. Public evidence supports a specific workflow and a managed delivery model, but does not yet establish internal architecture, reliability, security certification, or independently measured performance."
sections:
  - id: product-workflow
    title: "Product workflow and buyer job"
    body: >-
      8090's customer-facing product is not positioned as an editor autocomplete. The
      company describes Software Factory as a workflow that starts with a business
      problem, turns intent into requirements and architecture, gives agents bounded
      work, and checks the resulting change. Its public homepage says each change is
      traced to intent and tested, while the funding announcement describes the chain
      from business intent through production maintenance. This makes the buyer job
      coordination and accountability around enterprise software, especially where a
      wrong change is costly. The independent descriptions converge on that control
      plane framing, but they do not prove that the workflow produces correct output
      without customer-specific review.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: module-map
    title: "Modules, maturity, and operating model"
    body: >-
      Public descriptions agree on a five-part workflow but show that the product
      vocabulary has changed. One description uses Refinery, Foundry, Planner,
      Assembler, and Validator; a September review reports the current names as
      Requirements, Blueprints, Work Orders, Tests, and Feedback. The requirements
      guide supplies the document model behind the first layer—product overviews,
      feature requirements, personas, success metrics, and technical requirements.
      The September review also reports repository indexing, GitHub or GitLab
      connections, MCP-based agent access, release activity, and custom work-order
      statuses. This is evidence of a shipped workflow surface, not a verified
      service-level maturity assessment: the retained sources do not disclose
      deployment topology, failure rates, or a reproducible benchmark.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: integration-and-trust
    title: "Integration, governance, and trust boundary"
    body: >-
      Software Factory's integration model leaves the customer's existing coding
      environment in place while agents receive structured work through MCP. MCP is
      an open standard for connecting AI applications to data sources, tools, and
      workflows, and its documentation lists support across several assistants and
      development tools. That is a credible interoperability surface, but it is not
      evidence that 8090's implementation is secure or portable in every customer
      environment. NIST describes the AI Risk Management Framework as a voluntary
      way to incorporate trustworthiness into design, development, use, and
      evaluation. Against that bar, the product's audit-trail promise is relevant,
      while certification, tenant isolation, data retention, access control, uptime,
      and incident history remain unverified.
    claimRefs: [CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
  - id: differentiation-and-gaps
    title: "Differentiation and diligence verdict"
    body: >-
      The defensible product thesis is process continuity rather than a proprietary
      foundation model: requirements, architecture decisions, work orders,
      execution, and validation remain linked while the underlying models can change.
      That distinction matters for regulated or complex buyers, and 8090 also sells a
      managed enterprise service in which it designs, builds, hosts, and maintains
      applications. However, the same positioning creates execution dependencies.
      Customers must test whether the captured context stays synchronized with code,
      whether model changes alter results, and whether the managed service can meet
      contractual security and availability requirements. Public evidence does not
      establish customer-independent productivity, quality, or safety outcomes, nor
      does it provide 8090-specific developer adoption metrics.
    claimRefs: [CE013, CE014, CE015, CE016]
tables:
  - id: TE001
    title: "Product module and asset matrix"
    columns: ["Module or asset", "Primary user", "Publicly evidenced status", "Differentiation", "Diligence gap"]
    rows:
      - ["Refinery / Requirements", "Product and business teams", "Publicly documented; September review uses the Requirements name", "Makes intent explicit before implementation", "Test requirement quality and change traceability in a live project"]
      - ["Foundry / Blueprints", "Architects and engineering leads", "Publicly documented; September review uses the Blueprints name", "Keeps design context linked to requirements", "Verify architecture drift detection and exportability"]
      - ["Planner / Work Orders", "Engineering managers and agents", "Publicly documented; September review uses the Work Orders name", "Bounds agent work around a requirement", "Measure task completeness and rework rate"]
      - ["Assembler / Tests and MCP execution", "Developers using existing tools", "Execution and testing are documented, but naming differs across reviews", "Preserves existing coding surfaces while adding orchestration", "Validate permissions, secrets handling, and rollback behavior"]
      - ["Validator / Feedback", "Operators and product owners", "Publicly documented; September review uses the Feedback name", "Closes the loop from use to maintenance", "Test feedback classification, alerting, and false-positive rate"]
    notes: "Module aliases reconcile June and September 2026 descriptions; public documentation establishes workflow roles, not production maturity or independent performance."
    claimRefs: [CE005, CE006, CE007]
  - id: TE002
    title: "Workflow and use-case table"
    columns: ["User job", "Current workflow", "8090 solution", "Measurable benefit", "Limitation"]
    rows:
      - ["Define a product", "Business intent is often informal", "Product Overview and requirements documents", null, "No public benchmark for requirement completeness"]
      - ["Specify a feature", "Teams translate goals into implementation detail", "Feature Requirements Documents with testable acceptance criteria", null, "Quality depends on the authoring and review process"]
      - ["Coordinate architecture", "Decisions can fragment across tools", "Blueprints connect architecture to requirements", null, "Public materials do not disclose the underlying graph or sync guarantees"]
      - ["Delegate implementation", "Agents receive broad prompts or isolated tasks", "Work Orders carry requirement and blueprint context", null, "Need pilot evidence on rework and defect escape"]
      - ["Execute in existing tooling", "Developers work in repositories and coding assistants", "MCP connects agents to external tools and workflows", null, "Permission, isolation, and portability need technical review"]
      - ["Maintain production software", "Feedback becomes manual backlog work", "Validator turns incoming feedback into structured tasks", null, "No public uptime, support, or incident evidence"]
    notes: "Benefits are left null where the assigned sources describe the mechanism but do not provide an independently measured denominator or baseline."
    claimRefs: [CE001, CE006, CE009, CE010]
  - id: TE003
    title: "Technology and operating architecture"
    columns: ["Layer or process", "Role", "Dependency", "Risk"]
    rows:
      - ["Intent", "Capture business problem and expected outcome", "Customer subject-matter experts", "Ambiguous requirements can propagate downstream"]
      - ["Requirements", "Define testable product and feature behavior", "Product and engineering review", "Incomplete acceptance criteria weaken validation"]
      - ["Architecture", "Record technical decisions and blueprints", "Current system and integration context", "Undisclosed implementation may drift from documented design"]
      - ["Work orders", "Package bounded implementation tasks", "Requirement and blueprint context", "Context loss can create incorrect agent changes"]
      - ["Agent execution", "Apply changes inside customer tools", "MCP and model/tool permissions", "Model errors, prompt injection, or excessive permissions"]
      - ["Validation and feedback", "Check output and convert feedback into work", "Tests, reviewers, and operational telemetry", "No public evidence of defect escape or SLA performance"]
    notes: "This is an evidence-bounded operating model synthesized from the documented workflow; it is not a claim about 8090's undisclosed infrastructure."
    claimRefs: [CE002, CE003, CE009, CE011, CE012]
figures:
  - id: FE001
    title: "Software Factory product architecture map"
    type: stack
    summary: "The public workflow is layered from business intent through requirements, design, execution, and validation."
    data:
      layers:
        - label: "Intent"
          detail: "Business problem and desired outcome define what should be built and why."
        - label: "Requirements"
          detail: "Product Overview Documents and Feature Requirements Documents make behavior explicit and testable."
        - label: "Architecture"
          detail: "Blueprints record technical decisions and keep design context linked to requirements."
        - label: "Planning"
          detail: "Work Orders package scoped implementation context for bounded execution."
        - label: "Agent execution"
          detail: "Assembler hands work to AI agents in existing environments through MCP."
        - label: "Validation and feedback"
          detail: "Validator connects tests, review, and incoming feedback back to structured development work."
    approximationNotes: "Layer order represents the documented workflow sequence, not a measured system topology or a claim that all deployments use identical components."
    claimRefs: [CE003, CE005, CE009]
callouts:
  - calloutType: insight
    title: "The product wedge is governed delivery"
    body: "8090's public evidence supports a control-plane thesis: the differentiator is linking intent, architecture, implementation, and validation for high-consequence software, rather than claiming a unique model."
    claimRefs: [CE001, CE004, CE013]
  - calloutType: risk
    title: "Trust claims require operational proof"
    body: "Auditability is a useful design objective, but buyers still need evidence for security controls, reliability, data handling, portability, and independently measured outcomes."
    claimRefs: [CE011, CE012, CE015, CE016]
