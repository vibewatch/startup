callouts:
  - calloutType: recommendation
    title: "Research-more, not buy"
    body: "The evidence supports a differentiated enterprise thesis and meaningful financing, but not a defensible valuation or return case. Require current operating metrics and transaction terms before assigning a price-sensitive recommendation."
    claimRefs: [CV001, CV008, CV010, CV016]
  - calloutType: risk
    title: "The services-versus-software mix is decisive"
    body: "A managed delivery business can create customer proof while also producing lower, less recurring margins than a software platform. Product-line revenue, gross margin, utilization, and renewal data are the key underwriting gap."
    claimRefs: [CV004, CV011, CV014]
