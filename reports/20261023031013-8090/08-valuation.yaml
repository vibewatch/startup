company:
  name: "8090"
chapter:
  number: 8
  title: "Valuation"
  summary: "8090 has disclosed substantial financing and a differentiated governed-software thesis, but the public record does not disclose valuation, revenue, retention, margins, or cash-generation metrics. The evidence therefore supports research-more rather than a price-insensitive buy: underwriting should separate the self-serve software product from the managed delivery business and require contract-level proof."
sections:
  - id: investment-case
    title: "Investment case and anti-thesis"
    body: >-
      The positive case is that 8090 is positioned around a real enterprise pain point: coordinating
      requirements, architecture, work orders, code, testing, and production maintenance in one
      auditable workflow. Its June 2026 announcement says the company raised $135M led by Salesforce,
      while independent coverage describes a control-plane product aimed at regulated and complex
      industries rather than a generic coding assistant. That combination can support high willingness
      to pay when the cost of an incorrect change is material. The countercase is that the public
      evidence still mixes a platform with a labor-intensive delivery model. A contemporaneous
      operator analysis calls the company “a services business,” and the public materials disclose
      no revenue, gross margin, recurring-revenue mix, renewal, utilization, or customer concentration
      figures. Funding is capital raised, not cash available for return, and reported customer or
      partner rollout plans are not verified active-seat or revenue evidence. The thesis is attractive
      only if repeatable software economics emerge alongside delivery credibility; otherwise a large
      financing headline may be underwriting a consultancy with software leverage that remains
      unproven.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: financing-and-entry-discipline
    title: "Financing context and entry discipline"
    body: >-
      The latest disclosed financing is a $135M Series A announced in June 2026, led by Salesforce
      with other named investors. The company’s own announcement says the capital will fund hiring
      and compute/infrastructure, which is a use-of-proceeds statement rather than a runway or burn
      disclosure. FundedIQ records one disclosed round and an 11–50 employee band, but that is a
      database snapshot and not a substitute for a current cap table. The assigned public evidence
      does not disclose the post-money valuation, preferred liquidation preferences, participation
      rights, option-pool treatment, debt, secondary liquidity, or current cash balance. Consequently,
      no defensible price-to-revenue, ARR multiple, or dilution-adjusted return can be calculated from
      the retained evidence. Entry discipline should require the round price and preference stack,
      audited or management revenue by product line, gross margin by self-serve versus managed work,
      cash burn and runway, and a referenceable cohort of paying customers. Until those data are
      available, the correct stance is to track the company and negotiate an evidence-based price
      rather than extrapolate a valuation from the size of the round.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
  - id: scenarios-and-diligence
    title: "Scenarios, comparables, and thesis-break triggers"
    body: >-
      Scenario analysis should be framed as decision thresholds, not false precision. The bull case
      requires repeatable software adoption, evidence that governed workflows create measurable
      customer value, and a growing share of high-margin recurring software revenue. The base case
      assumes demand for regulated-enterprise modernization exists but that implementation labor and
      partner dependence keep margins and velocity mixed. The bear case is that agent capabilities
      commoditize the workflow, large system integrators and platform vendors capture distribution,
      and 8090 remains a bespoke services provider without disclosed recurring economics. Sapphire’s
      historical vertical-software comparison reports a roughly 9x median NTM multiple for its tracked
      public vertical set versus roughly 5x for broader application software, but that benchmark is
      from July 2023 and is not a direct 8090 valuation. Sequoia’s market analysis similarly warns
      that many generative-AI companies lacked product-market fit or sustainable advantage. The
      underwriting decision should therefore turn on current revenue quality, retention, contribution
      margin, customer concentration, contract rights, and evidence that the platform—not only the
      implementation team—captures durable value.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
