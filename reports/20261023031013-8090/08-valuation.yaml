      - ["Platform may have software leverage", "Self-serve workflow and managed Enterprise offering are both described", "Recurring software gross margin separated from services margin"]
      - ["Services intensity can cap valuation", "Independent analysis describes a bespoke delivery business", "Evidence of repeatable deployment, utilization, and product-led expansion"]
    notes: "Rows distinguish company-issued financing/product claims from independent interpretation; they are not a substitute for a cap-table or financial review."
    claimRefs: [CV001, CV003, CV004, CV006, CV011]
  - id: TV003
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "Recurring software adoption compounds and customer outcomes are independently verified", "Potential premium to vertical-software benchmarks if growth and margins are evidenced", "Execution and model-cost volatility", "Low until cohort and margin data are supplied"]
      - ["Base", "Managed delivery remains important while software adoption grows selectively", "Track or negotiate only at a price supported by product-line revenue and gross margin", "Services mix, partner dependence, concentration", "Most supportable pending diligence"]
      - ["Bear", "Workflow value is commoditized or captured by incumbents and SIs", "Down-round or impaired exit value; avoid without downside protection", "Multiple compression, weak retention, cash burn", "Material because public economics are absent"]
      - ["Trigger case", "Preference overhang or adverse customer economics emerge", "Reprice for dilution, liquidation preference, and cash needs", "Governance and liquidity risk", "Must be tested in diligence"]
    notes: "These are qualitative underwriting scenarios, not forecast probabilities or numeric valuation estimates; the public record lacks the inputs needed for precision."
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
