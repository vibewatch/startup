    columns: [vendor, price_or_model, included_or_positioned_capability, unknown_or_qualification, implication]
    rows:
      - ["8090 Software Factory", "About $200/user/month plus token usage", "Self-serve governed software-delivery platform", "Token rates, realized discounts, seat mix, and workload bill not published in fetched text", "Cost must be tested against delivery volume and governance value"]
      - ["8090 Enterprise", "About $1M/year starting price; custom", "Managed design, build, hosting, and maintenance", "Contract scope, margin, portability, and service levels require diligence", "Competes with internal build and system-integrator budgets"]
      - ["Cursor", "$8-$200/month public individual tiers; Teams $30+/user/month; Enterprise custom", "Coding assistant, agents, reviews, and team controls by tier", "Third-party model usage is billed separately; not a comparable managed-service price", "Lower entry price can win where governance overhead is low"]
      - ["Replit Agent", "No comparable enterprise price in fetched product text", "Chat-based app creation, integrations, testing, and automations", "Enterprise terms and regulated-workload economics not established", "Useful substitute for lighter-weight app-building use cases"]
    notes: "Prices are list or starting signals from public pages, not realized revenue, total cost of ownership, or margin evidence; currency is USD where a currency is stated."
    claimRefs: [CP009, CP010, CP011]
figures:
  - id: FP001
    title: "Competitive positioning: governance depth versus execution breadth"
    type: quadrant
    summary: "An evidence-backed ordinal map separates governed enterprise workflow platforms from lighter-weight coding and app-building substitutes; positions are analytical aids, not market-share rankings."
    data:
      points:
        - {label: "8090", x: 4, y: 4, detail: "High stated governance and broad requirements-to-production workflow; performance durability remains unproven"}
        - {label: "Salesforce Agentforce", x: 4, y: 3, detail: "High stated governance and enterprise context; not positioned in fetched text as a software-development control plane"}
        - {label: "Appian AI Agents", x: 4, y: 3, detail: "High stated governance and workflow breadth; code-generation parity with 8090 is not established"}
        - {label: "Cursor", x: 2, y: 3, detail: "Developer execution breadth with enterprise controls, but less evidence of full lifecycle governance in cited pricing surface"}
        - {label: "Replit Agent", x: 3, y: 2, detail: "Broad app-building execution and testing; regulated-enterprise governance is not established in fetched page"}
        - {label: "Internal build / status quo", x: 2, y: 2, detail: "Potentially broad and controllable, but requires the buyer to assemble and maintain the process"}
    claimRefs: [CP002, CP005, CP006, CP007, CP008]
callouts:
  - calloutType: insight
    title: "Differentiation is workflow-level, not model-level"
    body: "The strongest independent framing is that 8090 sells the process around AI models—requirements, work orders, validation, and audit trails—while generation is increasingly interchangeable."
    claimRefs: [CP003, CP013]
  - calloutType: risk
    title: "Installed-base competitors can narrow the gap"
    body: "Salesforce and Appian already describe governed context, workflow controls, permissions, and auditability, while system integrators can supply distribution and implementation capacity."
    claimRefs: [CP005, CP006, CP015]
  - calloutType: recommendation
    title: "Require a measured deployment comparison"
    body: "Before underwriting moat durability, compare 8090 with the incumbent workflow and a lighter coding-agent substitute on one representative regulated workflow using traceability, exception, cost, and portability metrics."
    claimRefs: [CP014, CP015]
