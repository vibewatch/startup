company:
  name: "8090"
chapter:
  number: 3
  title: "Competitors"
  summary: "8090 competes as a governed software-delivery control plane and managed enterprise service, not simply as an autocomplete tool. The strongest public differentiation is its requirements-to-production audit trail and regulated-enterprise orientation, while competitors already offer overlapping context, governance, workflow, and agent execution capabilities."
sections:
  - id: landscape
    title: "Competitive landscape and buyer choice"
    body: >-
      The relevant competitive set spans several buying decisions rather than a single
      feature checklist. General coding assistants such as Cursor and Replit Agent optimize
      for individual or small-team app creation, while Salesforce Agentforce and Appian
      position governed agents inside enterprise context and workflows. 8090 describes
      Software Factory as a control plane that links business intent, requirements,
      architecture, work orders, code, testing, and maintenance; it also sells 8090
      Enterprise as a managed service. Independent commentary characterizes the product
      more narrowly as process and verification wrapped around interchangeable models,
      and says its overhead is justified when a wrong change is costly or must be
      defensible. The status quo therefore includes disciplined internal engineering,
      existing system integrators, and internal build: each can preserve control without
      buying a new platform, but each leaves the buyer to assemble more of the workflow.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability-comparison
    title: "Capability, trust, and distribution comparison"
    body: >-
      8090's defensible wedge is the combination of shared product and architecture
      context, structured work orders, validation, and an audit trail aimed at regulated
      production systems. That wedge is not unique at the level of individual
      capabilities. Salesforce says Agentforce grounds agents in enterprise context,
      business rules, observability, and security controls; Appian emphasizes long-running
      workflows, shared state, permissions, execution logging, and explicit human
      escalation; Replit emphasizes chat-based construction, integrations, and self-testing.
      These are competitor-issued descriptions, not independent performance benchmarks.
      NIST's framework makes trustworthy AI risk management a recognized buyer concern,
      but it does not certify 8090 or any competitor. A buyer should therefore test
      traceability, exception handling, data controls, and output portability on a
      representative workflow rather than infer superiority from feature language.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: economics-and-moat
    title: "Pricing, switching costs, and moat durability"
    body: >-
      Public pricing exposes a meaningful packaging contrast. A third-party research
      profile reports 8090 Software Factory at about $200 per user per month plus token
      usage and 8090 Enterprise at about $1 million per year starting price, while the
      company-facing directory says pricing is not published and arranged through sales.
      Cursor publishes individual, team, and enterprise tiers, with third-party model
      usage billed separately; Replit Agent promotes a conversational build-and-refine
      workflow but does not establish an equivalent enterprise contract price in the
      fetched page. The comparison is therefore directional, not a total-cost model.
      Switching costs could arise from requirements, blueprints, work orders, knowledge
      graph context, integrations, and accumulated audit history, but public sources do
      not quantify retention, migration friction, or customer concentration. 8090's
      managed service and EY relationship may improve distribution, while Salesforce,
      Appian, and system integrators bring installed-base access that can compress the
      differentiation gap.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
  - id: durability-and-gaps
    title: "Durability assessment and unresolved risks"
    body: >-
      The moat is plausible but not yet proven as durable. Requirements-to-code traceability
      and institutional context can become embedded in customer workflows, yet model
      generation itself is increasingly interchangeable and competitors are adding
      governed agent execution. Independent reporting also frames 8090 as an AI-enabled
      delivery business, which raises a services-versus-software margin and scalability
      question rather than resolving it. The company names a $135 million Series A and
      enterprise relationships, but public evidence here does not disclose ARR, renewal
      rates, realized pricing, implementation margins, or benchmarked productivity by
      customer. The key diligence test is a paid, representative deployment with explicit
      acceptance criteria for traceability, exception rates, cost per delivered change,
      integration effort, and portability. Until those results exist, 8090 is
      differentiated by workflow ambition and buyer focus, not by a demonstrated
      performance moat.
    claimRefs: [CP013, CP014, CP015]
  - id: exhibits
    title: "Exhibits"
    body: >-
      The exhibits consolidate the source-backed competitor profiles, capability
      distinctions, and public pricing signals used in this chapter. They separate
      issuer descriptions from independent observations and keep unlike units apart:
      per-user subscriptions, managed annual contracts, conversation pricing, and
      unpriced enterprise offerings are not interchangeable. The matrix leaves
      non-comparable cells qualified rather than treating a missing disclosure as a
      negative capability. The positioning map is an ordinal analytical aid based on
      stated workflow and governance scope, not a market-share estimate or an
      independently measured performance ranking. Buyers should validate the
      assumptions in a representative deployment.
    claimRefs: [CP001, CP005, CP009]
