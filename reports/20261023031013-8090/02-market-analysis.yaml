    columns: ["Publisher / year", "Geography", "Value or anchor", "Methodology / lens", "Confidence", "Limitation"]
    rows:
      - ["McKinsey / 2023 actual", "Global enterprises", "$15B; about 2% of enterprise software market", "Software-leader and IT-executive survey plus firm experience", "Medium", "Broad gen-AI solutions, not governed SDLC spend"]
      - ["McKinsey / 2027 forecast", "Global enterprises", "$175B-$250B spending on the technology", "Sector outlook and value-pool analysis", "Medium", "Forecast range, not 8090 serviceable market"]
      - ["McKinsey / current at publication", "Global enterprises", "IT close to 40% of functional usage", "Functional-use allocation in survey analysis", "Medium", "Usage share is not an IT-spend denominator"]
      - ["McKinsey / 2027 forecast", "Global enterprises", "Customer care 15% of total spending", "Functional spending outlook", "Medium", "Not specific to software delivery or regulated buyers"]
      - ["8090 public evidence / 2026 access", "Not disclosed", "TAM, SAM, SOM unavailable", "Evidence-gap lens", "Low", "Needs qualified-account, adoption, ACV, and retention data"]
    notes: "Rows preserve the publishers' metric names and periods. Broad market values are not additive and do not establish 8090's TAM, SAM, or SOM."
    claimRefs: [CM004, CM005, CM006, CM007, CM016]
  - id: TM003
    title: "Buyer and adoption map"
    columns: ["Segment", "Buyer", "User", "Payer / budget owner", "Adoption trigger", "Primary constraint"]
    rows:
      - ["Regulated enterprise IT", "CIO / CTO", "Engineering and architecture teams", "Technology transformation budget", "Need for traceability and controlled change", "Security, procurement, and integration review"]
      - ["Business-critical modernization", "Transformation executive", "8090 delivery team plus client SMEs", "Program or modernization budget", "Legacy cost or inability to buy an exact-fit system", "Data migration and acceptance proof"]
      - ["Professional-services channel", "SI or consulting partner", "Consultants and client delivery teams", "Partner program and client engagement", "Repeatable governed delivery method", "Channel economics and partner dependence"]
      - ["Enterprise internal build", "Application owner / CIO", "Internal product and engineering teams", "Application or transformation budget", "Company-specific workflow unmet by packaged software", "Governance capacity and proof of maintainability"]
      - ["Small or low-stakes software team", "Engineering manager", "Individual developers", "Team tooling budget", "Faster scoped implementation", "Platform overhead versus existing documentation and assistants"]
    notes: "Segmentation synthesizes assigned sources; public evidence does not identify budget ownership, conversion rates, or active-seat penetration by segment."
    claimRefs: [CM002, CM003, CM011, CM012, CM013, CM014, CM015]

