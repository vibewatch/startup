chapter:
  number: 2
  title: "Market Analysis"
  summary: "8090 is positioned in a bounded market for governed, AI-assisted enterprise software delivery and modernization, rather than the entire software-development market. External market research supports rapid enterprise generative-AI spending and lower switching costs, while the assigned company and commentary sources indicate a regulated-enterprise wedge whose adoption depends on governance, workflow fit, and proof of economic outcomes."
sections:
  - id: market-boundary
    title: "A bounded market: governed enterprise software delivery"
    body: "The relevant market is not all software development and not all generative-AI tooling. It is the spend by enterprises that need new or modernized applications delivered with requirements, architecture, implementation, testing, and an auditable record of decisions. The included spend therefore covers governed SDLC control-plane software, implementation services, and managed application delivery for complex or regulated workflows. It excludes individual-developer autocomplete, general-purpose foundation models, and ordinary software-integrator work that does not use an AI-native control plane. This boundary matters because 8090 presents a software platform and a managed delivery offering, which address adjacent budgets but require different sales motions and operating economics."
    claimRefs: [CM001, CM002, CM003, CM011, CM012]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: "Sizing through multiple lenses"
    body: "The evidence supports several broad sizing lenses, not a defensible 8090-specific TAM. McKinsey reports about $15 billion of global-enterprise spending on generative-AI solutions in 2023 and projects $175 billion to $250 billion of spending on the technology by 2027. Its analysis also places IT at close to 40% of current functional usage and expects customer care to represent 15% of total spending by 2027. These figures describe enterprise generative AI broadly, not governed software delivery or 8090's serviceable market. A narrower model must start with regulated-enterprise application budgets, modernization projects, qualified accounts, adoption rates, and the split between software and managed delivery; those denominators are not publicly disclosed."
    claimRefs: [CM004, CM005, CM006, CM007, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-drivers-constraints
    title: "Buyer segmentation, drivers, and constraints"
    body: "The strongest adoption case is where a wrong change is costly, difficult to reverse, or must be explained to an auditor. Assigned sources identify regulated industries as the target and frame the value around specification, governance, validation, and a persistent audit trail. The counterweight is that buyers still need workload-specific proof, measurable outcomes, and acceptable data, ownership, and integration terms. One independent commentator characterizes 8090 as a bespoke services business, highlighting delivery intensity and channel dependence rather than pure-software economics. Deloitte's scaling discussion and GitHub's warning against single-metric productivity judgments support a pragmatic evaluation approach, while the U.S. Copyright Office's continuing AI work shows that policy questions around generated outputs and training remain active."
    claimRefs: [CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]

