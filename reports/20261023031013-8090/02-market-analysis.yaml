      - ["Managed enterprise delivery", "Design, build, host, and maintain a customer application", "Unmanaged developer tooling", "Business-unit sponsor, CIO, procurement", "Core 8090 Enterprise motion"]
      - ["Legacy modernization", "Reverse engineering, migration, replacement application delivery", "Generic consulting without an AI control plane", "CIO, transformation office", "High-fit regulated workflow"]
      - ["Enterprise internal build", "Company-specific workflows and applications", "Packaged software licenses", "CIO, application owner, finance", "Adjacent build-versus-buy value pool"]
      - ["AI coding assistants", "In-editor completion and delegated coding tasks", "Full requirements-to-production governance", "Engineering team budget", "Status-quo or substitute"]
    notes: "Boundary is analyst-defined from assigned product and market evidence; public sources do not disclose a complete category taxonomy or spend denominator."
    claimRefs: [CM001, CM002, CM003, CM011, CM012, CM013]
  - id: TM002
