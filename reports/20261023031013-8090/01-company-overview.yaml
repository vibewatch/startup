company:
  name: "8090"
chapter:
  number: 1
  title: "Company Overview"
  summary: "8090 is a Menlo Park AI software company founded by Chamath Palihapitiya that combines an AI-native Software Factory platform with managed enterprise delivery for regulated environments. Its June 2026 $135 million Series A headline and EY.ai PDLC launch establish capital and distribution milestones, but the retained evidence does not establish current valuation, revenue, customer concentration, or governance rights."
sections:
  - id: identity-and-product
    title: "Identity, product, and operating model"
    body: "TechCrunch reports that Chamath Palihapitiya founded 8090 in January 2024 for corporate programming teams, while EY and independent coverage locate the company in Menlo Park. Public descriptions position Software Factory as more than an in-editor coding assistant: EY describes a delivery model spanning requirements, architecture, code, testing, infrastructure, and operations, and 8090 calls it an AI-native SDLC control plane that centralizes context and coordinates work. Independent reviews describe a second motion in which 8090 designs, builds, hosts, and operates custom systems. The investable identity is therefore a hybrid platform-and-delivery company aimed at regulated environments, not a pure self-serve coding-tool vendor."
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-capital-and-governance
    title: "Leadership, capital, and stakeholder structure"
    body: "Palihapitiya is the only 8090 executive identified consistently across the retained company, partner, and independent sources: TechCrunch says he founded the company and moved from the board into the full-time CEO role, while EY identifies him as cofounder and CEO. The June 2026 financing was announced as a $135 million Series A led by Salesforce Ventures, with WndrCo, Craft Ventures, The Production Board, LAUNCH, and angels participating. Dealroom and SiliconANGLE describe intended uses as hiring plus compute and infrastructure, not as cash currently available. A skeptical specialist newsletter characterizes 8090 as a services-heavy development shop and sees consultants as a necessary channel, sharpening the diligence issue around delivery labor, partner dependence, and software-like margins."
    claimRefs: [CO007, CO008, CO009, CO010, CO015]
    tableRefs: [TO002, TO003]
  - id: milestones-and-evidence-gaps
    title: "Milestones and unresolved scale evidence"
    body: "The evidenced sequence runs from the January 2024 founding and September 2025 public product launch to the March 2026 EY.ai PDLC announcement, June financing and CEO transition, and documented July-September product releases. EY says its PDLC is intended for tens of thousands of EY US consultants and reports one EY use case with a 70% productivity and cost-efficiency increase, 80-times faster delivery, and 95%+ automated test coverage. Those figures are partner-reported use-case metrics, not audited 8090 revenue, active-seat, or customer-outcome data. The assigned pool supplies no reliable current valuation, revenue or ARR, active-customer count, dated headcount, board roster, or cap-table rights; these remain explicit diligence gaps rather than estimated values."
    claimRefs: [CO007, CO010, CO011, CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
