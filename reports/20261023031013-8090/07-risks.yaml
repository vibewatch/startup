      - ["Privacy, IP, indemnity, and service terms", "8090 says it hosts and maintains managed systems; representative negotiated terms and control evidence are unavailable.", "Medium", "High", "Not established by assigned public evidence", "High", "Review MSA, SOW, DPA, subprocessors, data-use terms, IP rights, indemnities, SLA, and regulatory-cooperation clauses."]
    notes: "Partial public-evidence register as of 2026-10-23; qualitative likelihood and severity are diligence judgments, and no row asserts that 8090 has experienced an incident or enforcement action."
