    title: "Operational / quality / security risk register"
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Incorrect generated output reaches production", "Medium", "High", "Requirements, testing, and validation are described; effectiveness is unverified", "High", "Acceptance coverage, human approvals, escaped-defect rates, rollback evidence, and customer references."]
      - ["Sensitive customer code or data is mishandled", "Medium", "Critical", "Auditability is positioned as a benefit; technical controls are not established", "High", "Data-flow diagram, access controls, tenant isolation, retention, deletion, model-use restrictions, and test results."]
      - ["Hosted managed system suffers an outage or unrecoverable change", "Medium", "High", "Hosting and maintenance are promised; service history is unavailable", "High", "Uptime history, SLA credits, recovery objectives, disaster-recovery tests, incident register, and notification timing."]
      - ["Delivery capacity scales more slowly than commitments", "Medium", "High", "Financing supports hiring and infrastructure; unit delivery evidence is unavailable", "High", "Utilization, implementation cycle time, backlog aging, services gross margin, support load, and quality trends."]
    notes: "Failure modes are inferred from 8090's managed-delivery scope and independent workflow commentary; they are not recorded incidents, and likelihood must be recalibrated against private control and operating data."
    claimRefs: [CR003, CR005, CR006, CR007, CR012, CR013, CR014, CR015]
  - id: TR003
    title: "Partner / dependency risk register"
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring indicator]
    rows:
      - ["Enterprise implementation channel", "EY and similar delivery partners", "Announced rollout activity fails to convert into contracted, recurring production work.", "High", "Track partner-sourced pipeline, conversion, production deployments, renewals, and reference quality.", "High", "Partner-sourced bookings and production conversion by quarter."]
      - ["Strategic capital and infrastructure expansion", "Salesforce-led investor group and infrastructure suppliers", "Hiring and compute spending outpace contracted demand or require another raise before operating proof.", "High", "Stage capacity against signed backlog, delivery milestones, and cash thresholds.", "High", "Cash, burn, contracted backlog, compute spend, and gross margin by offering."]
      - ["Customer and use-case concentration", "Regulated-enterprise lighthouse accounts", "A small set of accounts drives revenue, references, product direction, or support demand.", "High", "Diversify by account and use case; require cohort and account-band reporting.", "High", "Top-five revenue share, GRR, NRR, renewal dates, expansion, and support concentration."]
    notes: "The assigned sources identify financing, named relationships, rollout plans, and regulated-sector focus but do not disclose partner-sourced revenue, retention, customer concentration, burn, or runway."
    claimRefs: [CR001, CR002, CR009, CR010, CR011, CR013, CR014, CR016]

