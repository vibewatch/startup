chapter:
  number: 7
  title: "Risks"
  summary: "8090's largest residual risks arise from promising governed, production-grade delivery in regulated settings while public evidence leaves control effectiveness, contract allocation, delivery economics, and customer concentration unverified. The $135M financing and EY relationship increase execution capacity, but neither establishes revenue durability, margin, runway, or security readiness."
sections:
  - id: regulatory-and-legal-exposure
    title: "Regulatory and legal exposure"
    body: >-
      8090 positions Software Factory for regulated and mission-critical enterprise
      environments, making substantiation and responsibility allocation central risks rather
      than peripheral compliance tasks. National Law Review reported that the FTC's Operation
      AI Comply applied existing unfair-or-deceptive-practice authority to AI-related conduct;
      the source does not concern 8090, but it demonstrates that AI marketing receives no
      exemption from general law. The company's own financing announcement emphasizes
      governance, orchestration, accountability, and auditability, yet the assigned evidence
      does not establish deployment-specific regulatory classifications, certifications,
      privacy terms, indemnities, or responsibility for a customer's regulated outcome.
      Residual exposure is therefore high until management supplies control mappings and
      negotiated contract evidence. No assigned source reports an enforcement action against
      8090, but that limited record cannot establish that no incident, inquiry, or dispute
      exists.
    claimRefs: [CR008, CR012, CR015]
    tableRefs: [TR001]
  - id: operational-security-and-quality
    title: "Operational, security, and quality failure modes"
    body: >-
      The managed offering broadens 8090's accountability: the company says it hosts,
      maintains, and keeps customer systems current as businesses and models change. That
      promise creates continuity, change-management, confidentiality, and generated-output
      risk alongside ordinary software delivery risk. Independent commentary describes the
      product as a documented workflow rather than a guarantee that generated code is
      correct, and argues that a factory process earns its overhead when errors can cause
      outages or regulatory scrutiny. Public positioning around requirements, testing,
      validation, and audit trails is directionally relevant, but the assigned evidence does
      not verify penetration tests, incident response, recovery objectives, uptime, escaped
      defects, or human-approval effectiveness. These are risk mechanisms, not claims that
      8090 has suffered a breach or outage. A representative deployment should be tested
      against measurable acceptance, rollback, access-control, and recovery criteria before
      the governance premium is credited.
    claimRefs: [CR003, CR005, CR006, CR007, CR012, CR015]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: partner-financial-and-execution-dependencies
    title: "Partner, financial, and execution dependencies"
    body: >-
      The June 2026 financing provides resources but not proof of a durable operating model.
      8090 announced a $135M Series A led by Salesforce, while independent coverage said the
      proceeds were intended for hiring, technical expansion, compute, and infrastructure.
      Toflow reported that revenue figures were not publicly disclosed, and Ry Walker's
      assessment cautioned that financing and delivery relationships do not establish
      profitability, retention, or support durability. The business also spans a per-seat
      platform and a managed enterprise service, exposing investors to both software adoption
      risk and labor-intensive delivery risk. EY can be a powerful implementation and
      distribution channel, but the assigned evidence describes rollout plans rather than
      verified active seats, recurring production revenue, or independently measured
      outcomes. Without revenue mix, utilization, backlog, renewal, gross-margin, burn,
      runway, and account-concentration data, neither funding raised nor named relationships
      should be treated as cash availability or commercial durability.
    claimRefs: [CR001, CR002, CR004, CR009, CR010, CR011, CR013, CR014, CR016]
    tableRefs: [TR003]
  - id: monitoring-and-thesis-breaks
    title: "Monitoring and thesis-break criteria"
    body: >-
      The investment thesis depends on evidence that governance reduces failure risk without
      making delivery uneconomic. A material customer incident, regulatory challenge to an
      AI claim, repeated escaped defect, or inability to meet a contracted recovery objective
      would directly weaken 8090's differentiation. Commercially, an EY rollout that does not
      convert into contracted production work, persistent dependence on a few lighthouse
      customers, or managed-service gross margins that fail to improve with scale would signal
      a fragile channel or services-heavy model. Financially, hiring and infrastructure spend
      that materially outruns contracted backlog, or a financing event on worse terms before
      durable renewal evidence appears, would raise capital-risk concerns. Public sources do
      not provide the baselines needed to set numeric triggers, so management should supply
      board-approved thresholds for incidents, service levels, customer concentration,
      contribution margin, cash runway, and partner-sourced conversion before these mitigations
      are treated as mature.
    claimRefs: [CR005, CR007, CR008, CR014, CR015, CR016]

