companyProfile:
  summary: "Genki Forest is a Beijing-founded private beverage company that built its brand around zero-sugar sparkling water before expanding into tea, milk tea, electrolyte, and adjacent healthier drink categories. The company’s public story combines strong domestic brand recognition, self-owned manufacturing, and growing overseas channel proof across Costco-linked retail, Asian grocery platforms, and marketplaces, but leaves the deepest financial and customer-quality questions undisclosed."
  foundedDate: "2016-04-08"
  founders:
    - name: "Tang Binsen"
      role: "Founder"
      background: "Former gaming entrepreneur who previously built and exited ELEX before launching Genki Forest." 
      claimRefs: [CO004, CO005]
  foundingLocation: "Beijing, China"
  headquarters: "Beijing, China"
  productSummary: "Genki Forest sells zero-sugar sparkling water, tea beverages, milk tea, electrolyte drinks, and related healthier packaged beverages, with sparkling water still the clearest public hero category."
  customerFocus: "Mass-market beverage consumers in China and overseas retail channels seeking lower-sugar, flavor-led refreshment."
  businessModel: "Packaged-beverage wholesale and sell-through across domestic retail, e-commerce, club, marketplace, and overseas grocery channels."
  stage: "Late-stage private beverage company with significant historical financing and owned manufacturing footprint."
  fundingStatus: "Public reports document a $500M strategic financing in April 2021 and a later roughly $200M Temasek-led round reported in late 2021, but current valuation and financing terms are not publicly verified."
