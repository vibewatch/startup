  evidenceGaps:
  - type: missing-source
    severity: material
    topic: qa-and-recall-history
    missingEvidence: Detailed QA scorecards, batch reject rates, recall history, and shelf-life validation data.
    whyItMatters: Operational beverage technology is only as defensible as its repeatable quality outcomes.
    diligencePath: Request plant-level QA dashboards, recall logs, and shelf-life validation reports.
    relatedQuestionRefs:
    - QE019
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: ip-scope-and-freedom-to-operate
    missingEvidence: A clean list of granted patents, applications, jurisdictions, and freedom-to-operate analysis.
    whyItMatters: Public WIPO search surfaces are not enough to judge moat durability or infringement risk.
    diligencePath: Request IP schedule, patent counsel memo, and trademark / trade-secret map.
    relatedQuestionRefs:
    - QE015
    - QE016
    relatedTableRefs:
    - TE003
  - type: conflicting-data
    severity: minor
    topic: sweetener-risk-interpretation
