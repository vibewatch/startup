  title: From online challenger to scaled beverage platform
  body: The most important company-overview insight is not just that sparkling water worked; it is that Genki Forest appears to have converted a one-product breakthrough into a broader operating system of factories, channels, and adjacent low-sugar categories. The 2025 growth evidence matters because it suggests the company is still growing even after the original sparkling-water novelty faded.
  claimRefs:
  - CO020
