- calloutType: risk
  title: Public visibility still exceeds hard disclosure
  body: Genki Forest is highly visible in Chinese consumer media, but its public record still leaves open basic diligence questions on audited revenue, cash, debt, governance rights, and exact current valuation. The 2021 zero-sucrose controversy and contradictory later valuation reporting show why a famous consumer brand can still remain a hard underwriting case.
