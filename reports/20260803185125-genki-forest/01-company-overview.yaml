company:
  name: Genki Forest
chapter:
  number: 1
  title: Company Overview
  summary: 'Genki Forest (元气森林), marketed internationally as Chi Forest, is a Beijing-based private beverage company founded in 2016 by former gaming entrepreneur Tang Binsen. Public sources consistently confirm strong category creation in sugar-free sparkling water and broader low-sugar functional beverages, plus wide domestic and overseas distribution, but the latest funding and valuation picture is contradictory: the last well-corroborated anchor is the April 2021 $500 million round at a reported $6 billion valuation, while later media reports cite materially higher or simply inconsistent figures without full term disclosure. The company entered 2026 with renewed growth momentum, a broadening product matrix, and fresh overseas traction, but still with meaningful disclosure gaps and a live reputation overhang from the 2021 zero-sucrose controversy.'
sections:
- id: identity-and-business-model
  title: Identity and Business Model
  body: |-
    Genki Forest is best understood as a modern Chinese beverage platform rather than a single-SKU sparkling-water brand. The core legal entity is Genki Forest (Beijing) Food Technology Group Co., Ltd., founded on 2016-04-08 in Beijing, while the international-facing consumer brand is now presented as Chi Forest. Across official, encyclopedia-style, and company-registry sources, the business is consistently described as focused on sugar-free or lower-sugar beverages spanning sparkling water, tea beverages, milk tea, electrolyte drinks, vitamin water, and adjacent functional lines. The international site emphasizes the same proposition in consumer-friendly language: fruit-forward sparkling drinks positioned around zero sugar, zero calories, and zero caffeine.

    What made Genki Forest distinctive was not just product formulation but go-to-market sequencing. CKGSB’s case study describes a tech-led founding team with little beverage-industry legacy experience that first built consumer traction online, listened obsessively to feedback, and then expanded into offline channels once product-market fit strengthened. Burning Tea provided the first real proof point, but the 2018 launch of sugar-free sparkling water became the catalytic product that turned the company into a credible challenger to incumbent beverage giants. Later coverage suggests the company preserved that core consumer promise while widening the product set into electrolyte, vitamin, herbal, and reduced-sugar tea formats.

    The company’s public snapshot is therefore clear at the category level but fuzzy at the financial one: market identity, product families, and brand positioning are well documented; audited revenue, cash, and balance-sheet detail are not. That mismatch matters for diligence because Genki Forest is widely covered as a scaled beverage innovator, yet still discloses less hard operating data than a public incumbent or even some listed Chinese peers.
