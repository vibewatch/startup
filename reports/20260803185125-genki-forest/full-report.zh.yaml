      - number: '5.3'
        title: IP、质量与原料信任是最大的技术未知数
        blocks:
          - type: paragraph
            body: >-
              对 Genki 的产品技术故事保持谨慎，主要不是因为它缺少创新，而是公开证据留下了太多硬验证问题。WIPO 搜索页面足以暗示一定 IP
              活动，但不足以绘制已授权权利要求、覆盖宽度或自由实施风险。官方页面几乎没有说明 QA 拒收率、批次失败、召回历史、供应商集中度或产线级合规流程。


              原料信任又增加了一层不确定性。FAQ 中使用 erythritol 和 sucralose，与 Genki 的无糖定位完全一致，FDA 历史也支持其合法商业使用。但 Nature Medicine 关于
              erythritol 的论文意味着，这个配方选择在声誉上并非中性。即便监管机构不要求立即改变，消费者情绪或零售商谨慎也可能影响产品路线图。


              净结论是，Genki 看起来像一家真正拥有产品开发和制造组织、具备快速迭代能力的公司，但还不像一个完全透明的技术平台。投资者应把尽调时间花在 IP
              范围、质量体系、供应商依赖和配方备选方案上。这些尽调问题都很具体，且能在管理层数据室中直接测试。
