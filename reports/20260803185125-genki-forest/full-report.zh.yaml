      - number: '1.3'
        title: 融资、规模与国际化
        blocks:
          - type: paragraph
            body: >-
              支撑最充分的公开融资锚点仍是 2021 年 4 月。EqualOcean 报道称，公司完成 $500 million 战略轮，领投方包括 Sequoia China、Warburg Pincus 和 L
              Catterton，Temasek、Gaorong、Longfor 也参与，资金将用于研发、工厂建设和全球化。AVCJ 的付费报道方向上相符。基于这些资料，最强的、完全可交叉印证的公开估值锚点约为 $6
              billion。此后证据不是更干净，而是更嘈杂：Pandaily 报道 2021 年末由 Temasek 领投、接近 $200 million 的轮次，报道估值为 $15 billion；2025 年 7 月
              Sohu / Cailianshe 摘要又提到新融资估值超过 RMB 60 billion，但未披露完整轮次条款。因此，尽调应把公开估值历史视为相互矛盾，而不是精确序列。


              经营规模比资本结构更容易被记录。FoodTalks 和 Yilantop 都报道公司 2025 年业绩同比增长 26%，并连续第三年实现两位数增长；KrASIA 则强调，公司进入 2026
              年时在费用控制、价格纪律和 SKU 精简上更严格。Aiqicha 与 CKGSB 合起来显示，公司已经深度投入制造和知识产权；CKGSB 特别提到 Genki Forest 建成五座自有工厂，并以年产能超过 5
              billion 瓶为目标。


              国际化也从愿景变成了具体事实。FoodTalks 和 Newswire 显示，公司早在 2021 年就在美国电商和专业零售获得早期牵引；Qianqiance 和 GoPyd 描述了之后进入 Costco
              的跃迁，覆盖 591 家美国门店和 109 家加拿大门店；Asia Food Beverages 与 CCPIT 记录了公司靠清真认证和 30,000 多个零售点在印尼本地化。Trademo
              的出货数据再给出一个交叉验证：Genki Forest North America 不只是海外营销，而是在有意义的规模上真实搬运产品。
