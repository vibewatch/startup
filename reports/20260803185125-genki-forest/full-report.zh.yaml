            title: 真正的危险在于风险相互叠加，而不是某个孤立标题
            body: Genki 的脆弱点会相互放大：标签问题会演变成信任问题；信任问题会拖累复购；复购可见度不足， 又会因为现金和利润率不公开，转成估值折价。
            calloutType: risk
            claimRefs:
              - CR001
              - CR023
              - CR024
              - CR037
              - CR040
          - type: callout
            title: 运营纵深能降低风险，也会带来脆弱性
            body: 自有工厂和中试线体系让 Genki 比纯营销外壳更可信，但同一套系统也抬高了犯错成本。 投资人不应把运营野心误读成低风险。
            calloutType: insight
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR035
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 历史私募估值证明需求存在，但不能证明当下价格纪律
        blocks:
          - type: paragraph
            body: >-
              Genki Forest 的估值故事很诱人，因为私募市场叙事本身已经像成功案例：2021 年 4 月的 $6 billion 估值、后来 $15 billion 的报道、2025 年仍在出现的增长报道，以及
              Costco 铺货和本地化报道中可见的海外扩张。问题不是缺少估值标题，而是公开记录仍没有给出严谨检验这些标题所需的财务分母。 投资人知道大量资本曾对 Genki
              感兴趣；但公开信息不足以判断这些资本现在应该支撑多少倍数。


              2026 年 1 月公司否认 IPO 的报道很关键，因为它改变了退出视角。没有近期上市计划，买方就不能沿着清晰 IPO 路径定价，而要考虑私募轮价格、二级流动性或战略选择权。因此，当下的投资定价纪律更重要。
              私营公司仍可以享有溢价倍数，但前提是收入质量、利润率路径和渠道耐久性的证据足够强，能补上披露缺口。


              正因这个缺口，历史私募估值只能当参照点，不能当决策规则。Genki 最终也许能支撑很高估值； 但今天的公开证据并不足以让投资人不经调整就假设任何过去高估值仍然有效。
            claimRefs:
