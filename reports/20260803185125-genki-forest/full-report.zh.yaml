  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品系统比一个气泡水明星单品更宽
        blocks:
          - type: paragraph
            body: >-
              Genki Forest 最容易被理解为一个拥有旗舰品类的饮料平台，而不是单品公司。国际 CHI
              页面围绕无糖气泡清爽饮品和少数果味口味做了高度筛选；中国公司页面和独立报道则描述了更广的产品组合，覆盖茶饮、奶茶、电解质饮料和其他相邻品类。这个差异本身很有信息量：海外，品牌用简单、货架稳定、口味优先的气泡主张开路；国内，它更像一家扩品类的饮料公司。


              配方故事公开但不完整。美国 FAQ 称饮品使用 erythritol 和
              sucralose，适合纯素和无麸质人群，并且可常温储存；这些足以理解消费者主张和部分原料依赖。但同一页面也说那里没有列出官方认证。这意味着可见的信任表面对消费者零售足够，但对机构尽调仍偏薄。


              因此，产品差异化似乎主要来自口味、品牌和迭代节奏。Daxue 关于 Genki 气泡水 2.0
              迭代和后续可乐味推进的报道，暗示这个组织把饮料设计视为持续优化循环，而不是一次性发布。这在战略上有意义，因为饮料挑战者常常靠更快地做出许多小的配方和包装改进赢，而不是靠发现一个不可改变的秘密配方。
