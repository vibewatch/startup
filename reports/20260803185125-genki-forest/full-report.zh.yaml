          value: 4
          note: Costco、Weee、Yami、Instacart / H Mart、Amazon 生态
        - label: 在售 SKU 组合
          value: 3
          note: 观察到多个气泡水口味
        - label: 评论 / 评分信号
          value: 2
          note: Cherry Picks 显示评分和评论密度代理指标
        - label: 已验证复购 / 留存
          value: 1
          note: 没有公开队列或再订购数据
    approximationNotes: 取值是有序的证据强度评分，不是客户数量。
    claimRefs:
      - CU007
      - CU009
      - CU013
      - CU014
      - CU023
      - CU024
      - CU030
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: Genki 可见海外渠道中，客户证明质量的定性评级。
    data:
      columns:
        - 具名证明
        - 当前上架可见度
        - 结果具体度
        - 留存可见度
      rows:
        - label: Costco
          values:
            - 是
            - 中
            - 低
            - 低
        - label: Weee / Yami
          values:
            - 是
            - 高
            - 低
            - 低
        - label: Instacart / H Mart
          values:
            - 是
            - 中
            - 低
            - 低
        - label: Amazon / Cherry Picks
          values:
            - 是
            - 中
            - 中
            - 低
    approximationNotes: 矩阵条目概括证据质量，不代表实测销售表现。
    claimRefs:
      - CU005
      - CU009
      - CU010
      - CU011
      - CU013
      - CU014
      - CU016
      - CU017
  - id: FU004
    title: 留存与集中度传导
    type: flow
    layout: standard
    summary: 客户质量缺口如何传导为更广泛的投资判断风险。
    data:
      nodes:
        - id: n1
          label: 复购未知
        - id: n2
          label: 头部客户占比未知
        - id: n3
          label: 动销可见度弱
        - id: n4
          label: 利润率与现金流不确定
        - id: n5
          label: 估值信心下降
      edges:
        - from: n1
          to: n3
          label: 消费黏性缺口
        - from: n2
          to: n4
          label: 买方议价风险
        - from: n3
          to: n4
          label: 经济性不清
        - from: n4
          to: n5
          label: 投资折价
    approximationNotes: 传导链是基于公开客户指标缺失的分析综合。
    claimRefs:
      - CU023
      - CU024
      - CU026
      - CU030
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: Genki 最关键残余风险的定性热力图。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余严重度
      rows:
        - label: 标签 / 宣称风险
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 工厂 / 质量风险
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 客户集中度风险
          values:
            - 中
            - 高
            - 低-中
            - 高
        - label: 财务不透明风险
          values:
            - 高
            - 高
            - 低
            - 高
    approximationNotes: 单元格是从公开记录综合出的定性分析判断，不是实测分数。
    claimRefs:
      - CR001
      - CR004
      - CR016
      - CR019
      - CR021
      - CR024
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 主要风险如何传导到消费者需求、利润率、融资和退出选择。
    data:
      nodes:
        - id: n1
          label: 宣称 / 合规问题
        - id: n2
          label: 消费者信任冲击
        - id: n3
          label: 动销 / 复购压力
        - id: n4
          label: 利润率与现金压力
        - id: n5
          label: 估值下降 / 退出放慢
      edges:
        - from: n1
          to: n2
          label: 公众反弹
        - from: n2
          to: n3
          label: 转向 / 谨慎
        - from: n3
          to: n4
          label: 促销和库存负担
        - from: n4
          to: n5
          label: 投资折价
    approximationNotes: 传导链属于分析判断，但锚定已观察到的零蔗糖争议和披露缺口。
    claimRefs:
      - CR001
      - CR002
      - CR023
      - CR024
      - CR033
      - CR040
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: 会放大运营或商业风险的关键外部依赖。
    data:
      nodes:
        - id: d1
          label: 专业设备伙伴
        - id: d2
          label: 自有工厂
        - id: d3
          label: 进口 / 分销链
        - id: d4
          label: Costco / 锚定零售商
        - id: d5
          label: 消费者复购与信任
      edges:
        - from: d1
          to: d2
          label: 工艺能力
        - from: d2
          to: d3
          label: 供应执行
        - from: d3
          to: d4
          label: 货架准入
        - from: d4
          to: d5
          label: 可得性和定价
    approximationNotes: 图强调实际依赖，而不是法律所有权结构。
    claimRefs:
      - CR017
      - CR018
      - CR020
      - CR021
      - CR034
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从业务质量和估值不确定性到当前推荐的逻辑链。
    data:
      nodes:
        - id: r1
          label: 真实品牌和渠道证明
        - id: r2
          label: 历史私募估值热度
        - id: r3
          label: 缺少经审计的当前经济性
        - id: r4
          label: 需要披露折价
        - id: r5
          label: 跟踪 / 继续研究
      edges:
        - from: r1
          to: r2
          label: 支撑关注
        - from: r2
          to: r3
          label: 检验假设
        - from: r3
          to: r4
          label: 不确定性仍在
        - from: r4
          to: r5
          label: 入场纪律
    approximationNotes: 逻辑链综合证据质量和价格支撑，不是正式打分模型。
    claimRefs:
      - CV008
      - CV020
      - CV021
      - CV027
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 哪些因素最影响 Genki 的估值信心。
    data:
      items:
        - label: 经审计收入披露
          value: 10
        - label: 毛利率 / 现金可见度
          value: 9
        - label: 客户集中度清晰度
          value: 8
        - label: 标签 / 监管压力
          value: 7
        - label: 海外扩张质量
          value: 6
    approximationNotes: 取值是在 1–10 敏感性尺度上的相对重要性评分，不是实测弹性。
    claimRefs:
      - CV020
      - CV025
      - CV037
      - CV038
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以十亿美元为单位的情景估值区间。
    data:
      items:
        - label: 悲观情景
          low: 4
          mid: 5
          high: 6
          unit: $B
          note: 不透明度和风险会重置估值溢价假设
        - label: 基准情景
          low: 7
          mid: 8.5
          high: 10
          unit: $B
          note: 业务不错，但仍需要有意义的披露折价
        - label: 乐观情景
          low: 12
          mid: 13.5
          high: 15
          unit: $B
          note: 需要证明规模、利润率和多元渠道的可持续性
        - label: 2021 年历史低位锚点
          low: 6
          high: 6
          unit: $B
          note: EqualOcean 报道的 2021 年 4 月估值标记
    approximationNotes: 情景区间是用公开可比公司加披露折价搭出的分析估值视角，不是当前市场出清价格。
    claimRefs:
      - CV001
      - CV002
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 截至 2026 年 8 月，Genki Forest 在关键估值维度上的投委会可用打分。
    data:
      items:
        - label: 市场机会
          value: 8
        - label: 品牌 / 产品证明
          value: 7
        - label: 竞争护城河
          value: 6
        - label: 单位经济透明度
          value: 3
        - label: 执行 / 运营
          value: 6
        - label: 当下估值吸引力
          value: 4
        - label: 证据质量
          value: 4
    approximationNotes: 评分是 0–10 的定性分析师判断，反映公开证据质量，不是机械投资模型。
    claimRefs:
      - CV008
      - CV019
      - CV020
      - CV025
      - CV040
