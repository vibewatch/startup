      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动很简单：健康已经成为主流，不再只是愿望。USDA、Eastroc 和 36Kr 都描述了一个低糖、低热量负担、增加功能和更清晰成分叙事正在影响消费者选择的市场。Genki Forest 自身
              2025 年增长被报道为 26%，约为更广泛 FMCG 增速的四倍，说明公司仍在受益于这轮迁移。跨国公司的反应进一步强化了这一点。Coca-Cola 在 2025 年推出 Simply Pop，含 6
              克益生元纤维且无添加糖；PepsiCo 则花费 $1.95 billion 收购 poppi。如果功能化解渴饮品只是短期潮流，大饮料公司的资本不会这么果断地移动。


              约束同样清楚。第一，气泡水本身已经拥挤。36Kr 称，2019 至 2023 年间中国有 30 多个品牌推出气泡水产品，到 2025
              年，消费者转向无糖茶、运动饮料和瓶装水后，该品类已经变慢。第二，价值导向正在上升：USDA 注意到消费者对大包装兴趣增加，Eastroc 强调理性、场景驱动的购买。第三，公开数据只能部分测量 Genki
              Forest 的相关 SAM。外部观察者可以描述品类动能和竞争者反应，但无法干净建模公司的份额、复购率或分品类收入拆分。因此，市场吸引力是真实的，但承销时必须承认公开证据仍未揭示的部分。
