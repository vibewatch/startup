      - number: '8.3'
        title: 情景区间支持耐心，而不是激进新进场
        blocks:
          - type: paragraph
            body: >-
              Genki Forest 更适合用情景框架判断，而不是给一个头条数字。牛市情景里，管理层证明当前收入规模已大幅超过旧有公开锚点，
              利润率质量健康，海外渠道增长在不形成危险集中度的情况下扩宽。那种情况下，百亿美元级估值说得通。 基准情景里，业务仍然不错，但披露不完整、渠道和宣称风险尚未完全化解，市场会给出大幅折价。
              熊市情景里，在集中度、监管或财务不透明的压力下，高增长溢价叙事被重估。


              决策真正要看的是偏斜度。如果进场价格已经接近最乐观的历史私募估值，公开证据能支撑的上行空间就有限， 因为价格已预设太多成功。如果价格明显更低，且尽调能补上收入、利润率、现金和集中度缺口，
              投资案例会很快变得更有意思。所以建议不是“永远避开”，而是“不要为不确定性付高价”。


              最终结论是跟踪 / 继续研究。Genki 的业务也许足够好，值得认真关注；但当前公开记录仍要求投资人用太多信念去填补空白。 以较高私募估值做高确信买入，这不是好入场条件。
