chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              更准确地看，Genki Forest 不是单一 SKU 的气泡水品牌，而是一个现代中国饮料平台。核心法律实体是 Genki Forest (Beijing) Food Technology Group Co.,
              Ltd.，2016-04-08 创立于北京；面向国际消费者的品牌现在以 Chi Forest
              亮相。官方信息、百科式资料和公司登记来源都把业务描述为聚焦无糖或低糖饮料，覆盖气泡水、茶饮、奶茶、电解质饮料、维生素水以及相邻功能线。国际官网也用更面向消费者的语言强化同一主张：果味气泡饮品，主打零糖、零卡、零咖啡因。


              Genki Forest 与众不同的地方，不只是配方，而是进入市场的顺序。CKGSB
              的案例研究写到，创始团队带着科技公司背景进入饮料业，几乎没有传统饮料行业包袱；公司先在线上跑出消费者牵引，密集听取反馈，等产品市场匹配增强后再扩到线下渠道。燃茶给出了第一个真正验证点，但 2018
              年推出的无糖气泡水才是催化产品，让公司从新消费品牌变成饮料巨头面前可信的挑战者。后续报道显示，公司一边守住这个核心消费者承诺，一边把产品组合扩到电解质、维生素、草本和减糖茶饮形态。


              因此，公司公开画像在品类层面清晰，在财务层面模糊：市场身份、产品家族和品牌定位都有充分记录；经审计收入、现金和资产负债表细节没有披露。这个错位会影响尽调，因为 Genki Forest
              已被广泛报道为规模化饮料创新者，但公开经营硬数据仍少于上市龙头，甚至少于部分已上市中国同业。
