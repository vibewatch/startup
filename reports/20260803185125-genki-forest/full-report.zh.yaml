  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 可见客户基础是渠道驱动的消费者零售，不是具名企业账户
        blocks:
          - type: paragraph
            body: >-
              Genki Forest 的客户证据，符合一家规模化饮料挑战者会公开呈现的样子：上线的零售页面、可发现页面、进口痕迹和渠道伙伴故事，而不是已签约企业账户。CHI
              网站把购物者引向购买地点，而不是直营订阅结账或机构销售询盘。这强烈说明，公司眼前的付款方是零售商、经销商和进口商，真正终端用户则是消费者家庭，在多种零售场景购买风味无糖饮料。


              细分主要通过进入市场路径可见。公开证据指向 Costco 这类会员制零售、与 Amazon 相关的消费者电商市场、Weee 和 Yami 这类美国亚洲杂货平台、通过 H Mart 接入 Instacart
              的即时杂货页面，以及通过 Shopee 可发现的东南亚电商。这个证据有用，因为它证明品牌不是只活在一个出口货架上。同时，这些仍是渠道信号，不是按收入加权的客户披露。


              净判断是，Genki 的客户地图宽到足以可信，但投资者真正需要的指标仍很薄。一个饮料品牌可以出现在很多地方，同时仍依赖少数零售买方或单一明星
              SKU。公开证据跨过了第一道门槛——真实采用存在——但还没有跨过第二道门槛，即持久、分散的经济性。
