  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和牵引可见，但只来自零散公开切片
        blocks:
          - type: paragraph
            body: >-
              Genki Forest 赚钱的方式是老派
              FMCG：把包装饮料卖进零售渠道，而不是把软件层或经常性服务外壳变现。公开证据在方向上很强。国际官网、零售商发现页面和渠道报道都显示，品牌通过会员制零售、亚洲杂货、Amazon
              式电商市场和中国电商分销，而不是只做直营销售。更不清楚的是这些渠道的精确占比、折扣和通路费用后的实际净价，以及国内与出口毛利的拆分。


              最强的有日期收入锚点仍是历史数据。Yicai 2021 年 3 月文章援引 36Kr 称，Genki Forest 2020 年销售额为 CNY2.9 billion，其中约 70%
              来自零卡气泡水。这一点重要，因为它同时确认规模和集中度：公司已经大到值得关注，但仍高度依赖明星品类。较新的 2025
              年报道暗示产品组合更宽，茶饮和其他品牌线权重上升；但这些来源仍没有给出投资者衡量真实多元化所需的经审计收入基数。


              实际结论是，增长证据存在，但会计视角缺位。FoodTalks 和 Yilantop 报道 2025 年同比增长
              26%，并连续第三年两位数增长，这是有意义的运营信号。可是如果没有基数、利润率和营运资本背景，这些数字对收入质量说明有限。
