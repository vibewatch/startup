      - number: '3.3'
        title: 真正的护城河问题是系统强度，不是概念新鲜度
        blocks:
          - type: paragraph
            body: >-
              到这个阶段，评价 Genki Forest
              应该少一点像看概念股，多一点像看执行型业务。投资者应问：公司能否持续足够快地创新，足够有效地谈下货架，并把海外验证转化为可重复的经济模型。如果答案是肯定的，碎片化会帮它；如果不是，更大的产品组合可以吸收趋势，让
              Genki 退到促销竞争。


              实际结果是，竞争尽调必须越过轶事。投资者应要求经销商经济模型、复购曲线、分渠道促销强度，以及新类别是在改善业务而不只是延长 SKU
              清单的证据。一个健康饮料品牌从外部看可以很令人兴奋；但如果复购、利润率或零售商杠杆落后于它试图跑赢的大系统，结构上仍会很弱。


              换句话说，护城河问题不是「Genki 酷不酷」，而是「Genki
              能不能复利」。有真实消费者相关性的公司仍可能令人失望，如果零售商把业务视为狭窄、依赖促销或容易替换。最高价值的尽调问题因此都是运营问题：分品类份额、分 SKU
              复购、分渠道利润率，以及创新正在形成系统而不只是一串新品发布的证据。
