  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险集中在标签、声称和公众信任
        blocks:
          - type: paragraph
            body: >-
              Genki Forest 历史上记录最清楚的风险，不是工厂火灾或融资崩盘，而是健康相邻营销制造的可信度问题。2021 年「0
              蔗糖」争议显示，一个饮料品牌可以很快从听起来合规的文案滑向消费者反弹、道歉、退款和包装修改。重要教训是，这不只是一次性 PR 尴尬，而是暴露了公司进入市场模型的一个结构特征：Genki
              所在品类里，细小措辞会同时影响健康感知、试用、复购和监管关注。


              监管环境正在收紧，这一点现在更重要。CIRS 对更新后中国标签规则和 GB 28050-2025 的总结显示，2027 年生效日前，「不添加」或「零」这类声称的灰色地带正在明显收窄。Kenfox 关于 CNIPA
              拒绝或宣告模糊商标无效的报道又提供了另一个角度：风险现在不只触及包装文案，也触及商标层里的类声称语言。这意味着，如果声称治理不够严格，Genki 的历史定位强项可能变成未来合规绊线。


              公开法律记录也只露出一部分。Aiqicha 清楚显示公司有有意义的备案和诉讼足迹，Wenshu 也确认存在法院记录表面，但外部人仍无法可靠地把这些信号转化为按严重程度排序的诉讼地图。因此，法律结论不是 Genki
              格外麻烦，而是它公开的法律和监管状态太不完整，不能草率承销。
