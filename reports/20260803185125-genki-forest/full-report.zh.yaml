  summary: >-
    Genki Forest 是一家创立于北京的非上市饮料公司，先靠无糖气泡水打出品牌，再扩到茶饮、奶茶、电解质饮料以及相邻的更健康饮品品类。公开材料显示，公司在国内有较强品牌认知，自有制造能力成型，海外渠道也有 Costco
    相关零售、亚洲杂货平台和电商市场的验证；但最关键的财务和客户质量问题仍未披露。
