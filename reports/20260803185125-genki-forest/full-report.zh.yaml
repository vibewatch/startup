      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配，要从 Tang Binsen 看起。CKGSB 和 Wikipedia 都把他的背景追溯到 ELEX Technology：他曾创办这家游戏公司并在 2014 年退出，随后转向消费品并设立
              Challenger Ventures。这一点重要，因为 Genki Forest 的运营方式仍更像产品与增长型创业公司，而不是传统 FMCG
              公司：科技式实验、容忍失败发布、快速迭代、重用年轻产品经理，这些特征反复出现在公司自身叙事和独立评论中。


              公开治理证据有限，但仍有信息价值。Aiqicha 显示，Wang Pu 是核心集团实体的法定代表人和经理，Tang
              仍任董事长。同一登记来源还列出其他董事、财务负责人和监事，至少确认公司已经远远超出创始人单人治理阶段。不过，后续融资轮次之后的实际控制权、董事会委员会或股东治理条款，公开证据仍很薄。这是反复出现的尽调缺口：Genki
              Forest 的运营已经规模化，但公开透明度不足，外部投资者还无法清楚画出谁控制什么。


              Aiqicha 记录的 643 名参保员工也应谨慎解读。这是有用的法律实体信号，不是合并口径企业人数。CKGSB 过去称团队在 2020 年中已经超过 3,000
              人，正好说明任何单一公开运营指标都可能很片面。最稳妥的判断是，Genki Forest 确有组织深度和可见的领导基础设施；但在把公开画像视为完整事实前，投资者仍需要管理层支持的股权表、治理和真实员工数披露。
