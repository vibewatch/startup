      - number: '6.2'
        title: 具名客户验证真实存在，但主要证明可发现性和货架组合
        blocks:
          - type: paragraph
            body: >-
              公开记录中最强的具名客户验证，是零售渠道验证。Costco 在本地化和海外扩张报道中反复出现；Weee、Yami 和 Instacart / H Mart 则显示产品确实陈列在面向客户的零售页面上。Cherry
              Picks 又加了一层：它汇总了与 Amazon 电商市场活动相关的卖家评分和产品评论密度。这明显强于裸标识页，因为它显示了真实产品、规格和面向消费者的购买路径。


              不过，证据质量并不一致。上线的 Weee 或 Instacart 商品页强于泛泛品牌提及，因为它确认产品当前可被发现。评论聚合器可以提示产品获得消费者注意，但不能替代 POS
              扫描数据、复购率或经验证的门店数量。同样，历史 Amazon 排名成功有助于证明早期试用，但对证明 2026 年留存持久性较弱。


              这意味着 Genki
              通过了真实采用门槛，但没有通过耐久性门槛。公开证据支持这样一个判断：今天消费者可以在多个海外渠道买到产品。它不支持这些渠道很深、很黏或高利润的结论。因此，投资者应把具名渠道验证视为必要但不充分。
