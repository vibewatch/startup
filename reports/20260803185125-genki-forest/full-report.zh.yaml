      - number: '2.2'
        title: 买方、用户与细分
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，买方群体既年轻，也受具体消费场景驱动。CKGSB 和 Daxue 都把 Genki Forest 早期国内吸引力放在更年轻、重视健康的消费者身上，尤其是愿意从传统含糖饮料升级到低负担替代品的 Z
              世代和千禧一代。Daxue
              记录的历史渠道组合强化了这个判断：便利店、超市、餐厅、自动售货机和电商都很重要，说明业务服务的是高频日常购买场景，而不是狭窄专用品类。在中国，买方、用户和付款人通常是同一个人或同一户家庭；购买往往客单价低但频次高，受口味、便携性和感知健康价值影响。


              海外细分则不同。FoodTalks 和 Qianqiance 描述了一条分阶段路径：先从海外华人消费者开始，再到更广的亚洲消费者，最后进入 Costco
              这类主流渠道。这与中国国内便利店和电商的节奏不同。美国市场证据还显示口味优先级会变化：Qianqiance
              报道，美国消费者在深入关心「零糖」主张前，更强调气泡更强、果香更浓。印尼则不同，本地化取决于清真合规和对碎片化零售网络的理解。因此，同一个品牌在不同地区服务不同用户动机：国内是健康和清爽，海外是口味驱动的新鲜感加文化熟悉感。
