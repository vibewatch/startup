      - number: '8.2'
        title: 上市可比公司支持区间判断，而不是一个干净单点答案
        blocks:
          - type: paragraph
            body: >-
              可比公司分析有帮助，但必须谨慎使用。上市饮料公司的倍数跨度很大。Pepsi 的销售倍数远低于 Monster， Nongfu、Eastroc、Coke 和 Celsius
              又各自体现不同的增长、利润率质量、披露水平和投资人叙事。 这种宽区间恰恰说明，不能把 Genki 硬塞进一个简单篮子。它不是成熟可乐巨头，也不是一家完全透明、 享受高增长溢价的上市品牌。


              多头逻辑很直接：Genki 看起来拥有真实的国内平台、可信的海外渠道扩张、仍未过时的健康导向品牌， 运营改善也说明公司在走向成熟而不是衰退。反向逻辑同样清楚：标签信任风险、私营公司不透明、
              客户集中度不确定，以及缺少经审计的最新经营经济性，意味着投资人可能买到的是高增长溢价形象， 而不是已经验证的高增长溢价现金引擎。


              因此，可比结论应当落在区间上。Genki 值得和强势饮料资产比较，但也应承受披露折价——最佳上市可比公司不需要付这个折价。 任何忽略这一折价的估值，都可能高估当前支撑。
