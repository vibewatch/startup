  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模
        blocks:
          - type: paragraph
            body: >-
              Genki Forest 的相关市场不是「所有饮料」，而是消费者在包装解渴、补水和轻负担享受之间做选择的那些场景。USDA 2025 年 6 月行业报告是最好的宽口径锚点：它把 2024 年中国饮料市场规模放在
              $170 billion 以上，并明确纳入瓶装水、果汁、碳酸饮料、茶饮和功能饮料。这个宽口径 TAM 很重要，因为 Genki Forest
              同时面对多种既有替代品：消费者想补水时可选普通水，想要味道和气泡时可选碳酸软饮，想要负担更轻的日常饮品时可选茶饮，想要维生素、电解质或「健康加风味」时可选功能品类。


              在这个大市场里，包装饮用水仍是最大细分市场，RTD 茶饮已经超过碳酸饮料成为第二大品类。这意味着 Genki Forest
              最初的气泡水切入点，处在一个结构变化中的市场，而不是仍由可乐单独主导的市场。Eastroc 2025 年年报评论从另一个角度支持同一结论：中国饮料零售销售额在 2025 年达到 RMB 329.5
              billion，但真正的增长向量是健康、低糖、增加功能和品类专业化。对尽调来说，实际含义是 TAM 很大，但最相关的 SAM 是健康驱动的包装饮料集群，而不是整个大宗饮料宇宙。
