  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 国内龙头仍掌握饮料竞争中最难的部分
        blocks:
          - type: paragraph
            body: >-
              Genki Forest 改变了无糖风味解渴饮品的讨论方式，但没有消除更大中国饮料系统的结构优势。Nongfu Spring、Tingyi、Eastroc 和 Wahaha
              各自展示了不同形态的规模优势：水源和水品类可信度、RTD 茶饮分销、功能饮料执行，或家庭级认知。尽调的关键问题不是 Genki 有没有独特品牌——它有——而是当健康定位变得普遍后，这个品牌是否足够强，能够继续赢。


              公开可比公司还揭示了一个让挑战者不舒服的事实：消费者看起来觉得新的品类，对零售商和经销商来说仍可能是老式运营问题。货架空间、补货频率、工厂利用率和组合议价能力仍然重要。这意味着 Genki
              的国内风险不只是山寨品牌，而是被迫在一些早于 Genki 崛起就已建成的系统里竞争；这些系统能靠规模、熟悉度和采购杠杆守住货架位置。


              Nongfu 的产品宽度、Tingyi 的茶饮规模、Eastroc 的功能饮料聚焦和 Wahaha 的长期家庭认知，都指向同一个战略教训：Genki
              必须持续把品牌热度转化成运营强度。如果它无法证明更强的复购和零售商产出效率，即便一个有文化共鸣的健康品牌，也可能被拥有更大渠道关系的供应商逼进促销战。
