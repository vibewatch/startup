      - number: '7.2'
        title: 自有制造和专业依赖放大运营风险
        blocks:
          - type: paragraph
            body: >-
              Genki 的制造策略在战略上有吸引力，同时也有运营风险。自有工厂如果运营良好，可以改善质量控制、速度和成本位置；但也带来固定成本杠杆、利用率敏感性和批次质量暴露。CKGSB 和 KrASIA
              合起来显示，Genki 是有意选择这条路，因此投资者不能把运营视为商品化后台。工厂就是投资论点的一部分。


              产品开发基础设施也是如此。Zhongya
              关于咸宁创新研究院的叙述，从创新角度看令人兴奋，因为它指向快速试产能力，以及围绕含果肉饮料的困难工艺诀窍。但它也提醒投资者，新形态可能依赖专业设备、工艺转移和伙伴执行，这些从品牌表面并不明显。公开来源没有披露不良率、召回历史或质量仪表盘，因此外部无法知道运营野心是否匹配运营控制。


              跨境增长会把这些问题叠加放大。Trademo、本地化报道和零售扩张叙事都暗示真实的进口和分销复杂度。每进入一个新市场，海关、包装、口味和经销商管理风险都会倍增。因此，运营图景不是「红色警报」，但绝不是低维护。
