        blocks:
          - type: paragraph
            body: >-
              Genki Forest 最重要的财务细节，是它不只是一家轻营销饮料公司。CKGSB 称公司建成五座自有工厂，并以年产能超过 5 billion 瓶为目标；KrASIA 2026
              年报道天津工厂二期已经投产，且规划了新的河南工厂。这一组合显示，公司试图用更高资本开支换取更强制造控制、更快迭代和更好的单箱经济性。


              有一些证据显示这套策略在运营上正在见效。KrASIA 称单箱成本已经达到有竞争力水平，并描述了供应链效率、SKU
              纪律和渠道执行的改善。但这仍不等同于已公布毛利率。投资者还看不到各工厂利用率、库存减记、资本开支回收期，或贡献毛利与费用吸收之间的拆分。在饮料业务里，这些数字才区分一个规模化消费品牌和一个财务上有韧性的公司。


              上市同业让这种反差很明显。Eastroc 和 Tingyi 披露收入背景、品类优先级以及足以做基准的经营细节，而这些正是 Genki 保留不披露的内容。因此，公开证据支持一种观点：相比轻资产挑战者，Genki
              可能正在搭建更强系统；但还不能干净证明投入资本回报已经有吸引力。
