      - number: '1.4'
        title: 里程碑与负面事件
        blocks:
          - type: paragraph
            body: >-
              对一家中国饮料挑战者来说，Genki Forest 的里程碑推进异常紧凑。公司从早期失败批次和众筹阶段实验出发，跑出 2018 年气泡水爆款，2021 年 4 月完成大额战略融资，随后又拿到从 Amazon
              U.S. 牵引、Costco 铺货到印尼本地化的一系列海外验证。2025–2026
              年的近期报道还加入了第二次经营转型：品牌不再被包装成一个单品爆款故事，而是被描述为一个多品类组合，靠更严格的渠道纪律、更深的制造投入和更广的产品开发系统管理。


              负面记录同样重要。2021 年 0 蔗糖争议说明，饮料中的健康定位信任非常脆弱。China Daily、The China Project 和 ChemLinked 都描述了这场反弹：消费者把奶茶标签上的「0
              蔗糖」理解为「零糖」，随后公司道歉，并把包装表述改向「低糖」。这不是生死存亡事件，但它重要，因为 Genki Forest
              的溢价主张很依赖营养信任，也依赖对「better-for-you」到底意味着什么的谨慎表述。


              2026 年 1 月 IPO 周期凸显出第二个模式：信息不对称。The Standard 报道公司初步探索香港 IPO，但公司否认有任何 IPO
              计划。再叠加相互矛盾的公开估值报道，外部投资者看到的是一家战略选项可能很宽的公司，但正式披露的融资、治理和退出意图远窄于品牌能见度。
