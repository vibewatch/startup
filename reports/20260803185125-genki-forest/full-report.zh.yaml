      - number: '6.3'
        title: 留存、扩张与集中度仍是主要客户尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Genki Forest 客户证据最大的弱点，不是渠道触达证明，而是耐久性证明。本文审阅的公开来源都没有提供
              NRR、GRR、零售商续约曲线、正式复购队列，甚至没有基础的头部客户集中度表。对饮料公司来说，这些缺口重要，因为消费者端看起来很宽的客户覆盖，可能与少数零售采购关系的高度依赖并存。


              Costco 是最明显的例子。海外叙事反复强调
              Costco，这是正面信号，因为它暗示严格零售准入和潜在大销量。但这也是警示：如果出口动销的有意义份额集中在一个会员制零售关系里，谈判杠杆和动销波动可能变得重要。类似不确定性也适用于电商市场、族裔杂货和更广大众零售之间的平衡。


              信任又增加一层。0 蔗糖争议说明，面向消费者的食品饮料品牌可以承受声誉伤害，而不会立刻从货架上消失。在低转换成本品类里，标签清晰度和复购信心可能比一次性试用更重要。因此，客户结论是混合的：Genki
              有可信渠道验证和合理扩张动能，但仍缺少高确信度客户质量承销所需的留存和集中度披露。
