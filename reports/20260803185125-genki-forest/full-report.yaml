  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    Genki Forest sells zero-sugar sparkling water, tea beverages, milk tea, electrolyte drinks, and related healthier
    packaged beverages, with sparkling water still the clearest public hero category.
  customerFocus: Mass-market beverage consumers in China and overseas retail channels seeking lower-sugar, flavor-led refreshment.
  businessModel: >-
