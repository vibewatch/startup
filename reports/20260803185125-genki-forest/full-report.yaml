          - type: callout
            title: Operational sophistication is a mitigation, but also a source of fragility
            body: >-
              The same self-owned-factory and pilot-line system that makes Genki more credible than a pure marketing
              shell also raises the cost of mistakes. Investors should not confuse operating ambition with low risk.
            calloutType: insight
