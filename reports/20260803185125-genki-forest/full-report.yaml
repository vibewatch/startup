        title: Exhibits
        blocks:
          - type: callout
            title: Genki may be good enough to merit attention, but not good enough to suspend price discipline
            body: >-
              The business-quality story is real enough to keep on the watchlist. The missing piece is not excitement;
              it is evidence strong enough to justify a rich private mark without relying on hope.
            calloutType: insight
            claimRefs:
              - CV008
