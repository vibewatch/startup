      - number: '2.3'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest growth driver is simple: health has become mainstream, not aspirational. USDA, Eastroc, and
              36Kr all describe a market where low sugar, lower calorie load, added function, and clearer ingredient
              stories now shape consumer choice. Genki Forest’s own 2025 growth—reported at 26%, roughly four times the
              broader FMCG rate—shows that the company is still benefitting from that shift. Multinational responses
              strengthen the point. Coca-Cola launched Simply Pop in 2025 with six grams of prebiotic fiber and no added
              sugar, while PepsiCo spent $1.95 billion to buy poppi. Big-beverage capital would not move this decisively
              if functional refreshment were a short-lived fad.


              The constraints are equally clear. First, sparkling water itself is crowded. 36Kr says more than 30 brands
              launched sparkling-water products in China between 2019 and 2023, and the category had turned sluggish by
              2025 as consumers rotated toward sugar-free tea, sports drinks, and bottled water. Second, value
              orientation is rising: USDA notes growing interest in larger packs, while Eastroc emphasizes rational,
              scenario-driven buying. Third, Genki Forest’s relevant SAM is only partially measurable from public data.
              Outside observers can describe category momentum and competitor response, but not cleanly model the
              company’s share, repeat rates, or category-level revenue split. Market attractiveness is therefore real,
              but it must be underwritten with humility about what the public evidence still does not reveal.
            claimRefs:
