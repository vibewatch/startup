          - type: callout
            title: Category validation and category crowding are happening simultaneously
            body: >-
              Coca-Cola and PepsiCo validate the long-run consumer demand for functional refreshment, but their moves
              also mean the category is more strategic and more crowded. That dual reality is why market quality is high
              while Genki Forest’s margin for execution error is lower than when sparkling water first broke out.
            calloutType: risk
