      - number: '1.3'
        title: Funding, Scale, and Internationalization
        blocks:
          - type: paragraph
            body: >-
              The best-supported public financing anchor remains April 2021. EqualOcean reported a $500 million
              strategic round led by Sequoia China, Warburg Pincus, and L Catterton, with Temasek, Gaorong, and Longfor
              also participating, and said the money would support R&D, factory construction, and globalization. AVCJ’s
              paywalled coverage is directionally consistent. On that basis, the strongest fully corroborated public
              valuation anchor is roughly $6 billion. After that point the evidence becomes noisier rather than cleaner:
              Pandaily reported a late-2021 Temasek-led round of nearly $200 million at a reported $15 billion
              valuation, while a July 2025 Sohu/Cailianshe summary mentioned a fresh financing at above RMB 60 billion
              without publishing full round terms. Diligence should therefore treat public valuation history as
              contradictory rather than precise.


              Operational scale is better documented than capital structure. FoodTalks and Yilantop both reported 26%
              year-on-year performance growth in 2025 and double-digit growth for a third consecutive year, while KrASIA
              emphasized tighter discipline around expense control, price discipline, and SKU rationalization entering
              2026. Aiqicha and CKGSB together show a company that has invested deeply in manufacturing and IP; CKGSB
              specifically says Genki Forest built five self-owned factories and targeted annual capacity above 5
              billion bottles.


              Internationalization has also become concrete rather than aspirational. FoodTalks and Newswire show early
              U.S. e-commerce and specialty-retail traction in 2021; Qianqiance and GoPyd describe the later jump to
              Costco distribution across 591 U.S. and 109 Canadian stores; Asia Food Beverages and CCPIT document
              localization in Indonesia enabled by halal certification and 30,000-plus retail points. Trademo’s shipment
              data adds one more cross-check: Genki Forest North America is not just marketing abroad, it is physically
              moving product at meaningful scale.
