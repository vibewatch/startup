      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The real danger is interacting risks, not one isolated headline
            body: >-
              Genki’s vulnerabilities compound: a labeling issue can become a trust problem; a trust problem can become
              a repeat problem; and weak repeat visibility can turn into a valuation discount because cash and margin
              are not public.
            calloutType: risk
            claimRefs:
              - CR001
