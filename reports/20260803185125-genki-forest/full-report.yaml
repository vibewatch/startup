chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Genki Forest is best understood as a modern Chinese beverage platform rather than a single-SKU
              sparkling-water brand. The core legal entity is Genki Forest (Beijing) Food Technology Group Co., Ltd.,
              founded on 2016-04-08 in Beijing, while the international-facing consumer brand is now presented as Chi
              Forest. Across official, encyclopedia-style, and company-registry sources, the business is consistently
              described as focused on sugar-free or lower-sugar beverages spanning sparkling water, tea beverages, milk
              tea, electrolyte drinks, vitamin water, and adjacent functional lines. The international site emphasizes
              the same proposition in consumer-friendly language: fruit-forward sparkling drinks positioned around zero
              sugar, zero calories, and zero caffeine.


              What made Genki Forest distinctive was not just product formulation but go-to-market sequencing. CKGSB’s
              case study describes a tech-led founding team with little beverage-industry legacy experience that first
              built consumer traction online, listened obsessively to feedback, and then expanded into offline channels
              once product-market fit strengthened. Burning Tea provided the first real proof point, but the 2018 launch
              of sugar-free sparkling water became the catalytic product that turned the company into a credible
              challenger to incumbent beverage giants. Later coverage suggests the company preserved that core consumer
              promise while widening the product set into electrolyte, vitamin, herbal, and reduced-sugar tea formats.


              The company’s public snapshot is therefore clear at the category level but fuzzy at the financial one:
              market identity, product families, and brand positioning are well documented; audited revenue, cash, and
              balance-sheet detail are not. That mismatch matters for diligence because Genki Forest is widely covered
              as a scaled beverage innovator, yet still discloses less hard operating data than a public incumbent or
              even some listed Chinese peers.
