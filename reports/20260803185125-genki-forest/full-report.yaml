              Genki Forest’s customer evidence looks like what a scaled beverage challenger should show publicly: live
              retail surfaces, discoverability pages, import traces, and channel-partner stories rather than signed
              enterprise accounts. The CHI site pushes shoppers toward where to buy, not toward direct subscription
              checkout or institutional sales inquiry. That strongly suggests the company’s immediate payers are
              retailers, distributors, and importers, while the real end users are consumer households buying flavored
              zero-sugar beverages across multiple retail contexts.


              The segmentation is visible mainly by route to market. Public evidence points to club retail such as
              Costco, consumer marketplaces linked to Amazon, U.S. Asian grocery platforms such as Weee and Yami,
              same-day grocery surfaces like Instacart via H Mart, and Southeast Asia e-commerce discovery via Shopee.
              This is useful because it proves the brand is not living on one export shelf alone. At the same time,
              these are still channel signals, not revenue-weighted customer disclosures.


              The net read is that Genki’s customer map is broad enough to be credible but still thin on the metrics
              investors actually need. A beverage brand can be present in many places and still be dependent on a narrow
              set of retailer buyers or a single hero SKU. Public evidence clears the first hurdle—real adoption
              exists—but not the second one of durable, diversified economics.
