              Costco is the most obvious example. It is repeatedly highlighted in overseas narratives, which is positive
              because it implies stringent retail acceptance and potentially strong volume. But it is also a warning
              sign: if a meaningful share of export velocity sits in one club-retail relationship, negotiating leverage
