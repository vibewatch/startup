      - number: '1.4'
        title: Milestones and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Genki Forest’s milestone path is unusually compressed for a Chinese beverage challenger. The company moved
              from early failed batches and crowdfunding-era experimentation to a breakout 2018 sparkling-water launch,
              a large April 2021 strategic financing, and then rapid overseas proof points ranging from Amazon U.S.
              traction to Costco rollout and Indonesia localization. More recent 2025-2026 coverage adds a second
              operating transition: the brand is no longer presented as a one-hit product story but as a multi-category
              portfolio managed through stricter channel discipline, deeper manufacturing investment, and a broader
              product-development system.


              The adverse side of the record is just as important. The 2021 zero-sucrose controversy showed how fragile
              health-positioning trust can be in beverages. China Daily, The China Project, and ChemLinked all describe
              a backlash after consumers interpreted “zero sucrose” labeling on milk tea as meaning “zero sugar,”
              prompting an apology and a packaging shift toward “low sugar.” This was not an existential event, but it
              is material because Genki Forest’s premium proposition depends heavily on nutritional trust and careful
              language around what “better-for-you” actually means.


              The January 2026 IPO cycle highlights a second pattern: information asymmetry. The Standard reported
              preliminary Hong Kong IPO exploration, but the company denied it had any IPO plan. Combined with
              contradictory public valuation reports, that leaves outside investors with a company whose strategic
              options may be broad, but whose formally disclosed financing, governance, and exit intentions remain
              significantly narrower than its brand visibility would suggest.
