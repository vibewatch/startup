  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Historical private marks prove demand, but not today’s price discipline
        blocks:
          - type: paragraph
            body: >-
              Genki Forest’s valuation story is tempting because the private-market narrative already sounds like
              success: a $6 billion mark in April 2021, a later $15 billion report, continued growth coverage in 2025,
              and overseas expansion visible in Costco-linked and localization reporting. The problem is not the absence
              of valuation headlines. The problem is that the public record still does not provide the financial
              denominator needed to test those headlines rigorously. Investors know that a lot of capital was interested
              in Genki; they do not know enough publicly to say what current multiple that capital should support.


              The January 2026 IPO-denial reporting matters because it shifts the exit lens. Without a near-term public
              listing plan, buyers must think in terms of private-round pricing, secondary liquidity, or strategic
              optionality rather than a clean IPO path. That increases the importance of present-day underwriting
              discipline. A private company can still deserve a premium multiple, but only if the evidence around
              revenue quality, margin path, and channel durability is strong enough to close the disclosure gap.


              That gap is exactly why historical private marks should be treated as reference points, not decision
              rules. Genki may ultimately justify a large valuation. Public evidence today simply does not justify
              assuming that any past high mark remains valid without adjustment.
            claimRefs:
              - CV001
              - CV002
              - CV003
