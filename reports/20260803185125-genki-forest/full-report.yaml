      - number: '8.2'
        title: Public comps support a range, not a single clean answer
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is helpful here, but only if used carefully. Public beverage comps span a huge range.
              Pepsi trades on a far lower sales multiple than Monster, while Nongfu, Eastroc, Coke, and Celsius each
              reflect different mixes of growth, margin quality, disclosure, and investor narrative. That wide spread is
              exactly why Genki cannot be forced into one simplistic bucket. It is not a mature cola incumbent, yet it
              is also not a fully transparent premium-growth public brand.


              The bull thesis is straightforward: Genki appears to have a real domestic platform, credible overseas
              channel expansion, a still-relevant health-led brand, and operational improvements that suggest the
              company is maturing rather than fading. The anti-thesis is just as clear: label-trust risk,
              private-company opacity, customer-concentration uncertainty, and the absence of audited current economics
              mean investors may be paying for an image of premium growth rather than a proven premium-growth cash
              engine.


              The comp conclusion is therefore a range-based one. Genki deserves comparison to strong beverage assets,
              but it also deserves a disclosure discount that the very best public comps do not. Any valuation exercise
              that ignores that discount is likely to overstate present support.
