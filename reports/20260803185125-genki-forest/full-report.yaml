companyProfile:
  summary: >-
    Genki Forest is a Beijing-founded private beverage company that built its brand around zero-sugar sparkling water
    before expanding into tea, milk tea, electrolyte, and adjacent healthier drink categories. The company’s public
    story combines strong domestic brand recognition, self-owned manufacturing, and growing overseas channel proof
    across Costco-linked retail, Asian grocery platforms, and marketplaces, but leaves the deepest financial and
    customer-quality questions undisclosed.
  foundedDate: '2016-04-08'
  founders:
    - name: Tang Binsen
      role: Founder
      background: Former gaming entrepreneur who previously built and exited ELEX before launching Genki Forest.
