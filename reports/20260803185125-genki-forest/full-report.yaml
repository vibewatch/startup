        title: Capital access looks real; capital adequacy is still unverified
        blocks:
          - type: paragraph
            body: >-
              Public financing coverage strongly suggests that Genki Forest has been able to attract large pools of
              growth capital. EqualOcean tied the April 2021 strategic round directly to R&D, factory construction, and
              globalization; Pandaily reported a later round at a much higher valuation; and later 2025 media summaries
              again hinted at fresh financing. These datapoints support a narrative of continued access to capital
              markets and investor interest in the category.


              But access is not adequacy. The current public record does not tell investors how much cash is on the
              balance sheet, how quickly it is being consumed, whether working capital has tightened with overseas
              expansion, or how much factory expansion still needs to be funded. That is why the company can look
              simultaneously de-risked and opaque: the fundraising history lowers the probability of immediate distress,
              yet the missing cash-flow and balance-sheet data prevent a clean runway assessment.


              The financial verdict is therefore mixed. Genki Forest appears to have a scaled and still-growing revenue
              engine, improving operational discipline, and enough financing history to support expansion. At the same
              time, margin path, cash runway, and return on capex remain genuine diligence blockers. A responsible
              underwriting case should treat the business as promising but still financially under-disclosed.
