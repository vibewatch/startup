  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Size
        blocks:
          - type: paragraph
            body: >-
              Genki Forest’s relevant market is not “all beverages,” but the broader set of occasions where consumers
              choose among packaged refreshment, hydration, and lighter indulgence options. USDA’s June 2025 sector
              report is the best broad anchor: it places China’s beverage market above $170 billion in 2024 and
              explicitly includes bottled water, juices, carbonates, tea, and functional beverages. That broad TAM is
              important because Genki Forest competes against several status-quo substitutes at once—plain water when
              the consumer wants hydration, carbonated soft drinks when the consumer wants taste and fizz, tea beverages
              when the consumer wants a less burdensome everyday drink, and functional categories when the consumer
              wants vitamins, electrolytes, or “health plus flavor.”


              Within that broad market, packaged drinking water is still the largest segment, and RTD tea has already
              overtaken carbonates for second place. That means Genki Forest’s original sparkling-water wedge sits
              inside a structurally changing market rather than one still dominated by cola alone. Eastroc’s 2025
              annual-report commentary supports the same conclusion from another angle: China beverage retail sales
              reached RMB 329.5 billion in 2025, but the real growth vectors were health, low sugar, added function, and
              category specialization. For diligence, the practical implication is that a huge TAM exists, yet the most
              relevant SAM is the health-led packaged-beverage cluster rather than the commodity beverage universe as a
              whole.
            claimRefs:
