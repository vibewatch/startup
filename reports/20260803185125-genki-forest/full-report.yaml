  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk centers on labels, claims, and public trust
        blocks:
          - type: paragraph
            body: >-
              The clearest documented risk in Genki Forest’s history is not a factory fire or a financing collapse; it
              is a credibility problem created by health-adjacent marketing. The 2021 “0 sucrose” controversy showed how
              quickly a beverage brand can move from compliant-sounding copy to consumer backlash, apology, refunds, and
              packaging revision. The important lesson is that this was not merely a one-off PR embarrassment. It
              exposed a structural feature of the company’s go-to-market model: Genki sells into a category where small
              wording choices can affect health perception, trial, repeat, and regulator attention simultaneously.


              That matters even more now because the regulatory environment is tightening. CIRS’ summary of the updated
              Chinese labeling rules and GB 28050-2025 suggests that the gray zone for “not added” or “zero” style
              claims is narrowing meaningfully ahead of the 2027 effective date. Kenfox’s report on CNIPA refusing or
              invalidating ambiguous trademarks adds another angle: risk now reaches not only packaging copy but also
              claim-like language in the trademark layer. This means Genki’s historical positioning strengths can become
              future compliance tripwires if governance over claims is not rigorous.


              The public legal record is also only partly visible. Aiqicha clearly indicates a meaningful filing and
              litigation footprint, and Wenshu confirms that a court-record surface exists, but outsiders still cannot
              reliably convert those signals into a severity-ranked litigation map. The legal verdict is therefore not
              that Genki is uniquely troubled, but that its public legal and regulatory posture is too incomplete to
              underwrite casually.
            claimRefs:
