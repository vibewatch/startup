        title: Exhibits
        blocks:
          - type: callout
            title: The SAM is real, but it is broader than sparkling water
            body: >-
              The key market mistake would be to treat Genki Forest as a pure sparkling-water company. Public evidence
              shows sparkling water opened the door, but the more resilient addressable market is the broader low-sugar
              functional refreshment pool that includes tea, electrolytes, health water, and adjacent portability-driven
              occasions.
            calloutType: insight
            claimRefs:
