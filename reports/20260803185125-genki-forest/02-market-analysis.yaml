- id: buyers-users-and-segments
  title: Buyers, Users, and Segments
  body: |-
    Public evidence points to a buyer base that is both demographically young and occasion-specific. CKGSB and Daxue both frame Genki Forest’s early domestic appeal around younger health-conscious consumers, especially Gen Z and millennials who were willing to trade up from sugary legacy drinks for lower-burden alternatives. Daxue’s historical channel mix reinforces that interpretation: convenience stores, supermarkets, restaurants, vending machines, and e-commerce all mattered, which implies a business serving frequent everyday purchase occasions rather than a narrow specialty niche. In China, the buyer, user, and payer are usually the same person or household; the purchase is often a small-ticket but high-frequency decision influenced by taste, portability, and perceived health value.

    Overseas, the segmentation looks different. FoodTalks and Qianqiance describe a staged path from Chinese diaspora consumers to broader Asian shoppers and finally to mainstream channels such as Costco. This is a different adoption path from China’s domestic convenience-store and e-commerce rhythm. The U.S. market evidence also suggests taste hierarchy changes: Qianqiance reports that American consumers emphasized stronger bubbles and richer fruit aroma before caring deeply about the “zero sugar” proposition. In Indonesia, by contrast, localization depended on halal compliance and understanding fragmented retail networks. The same brand therefore serves different user motivations across geographies—health and freshness domestically, taste-led novelty plus cultural familiarity in overseas markets.
