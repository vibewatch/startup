  - type: conflicting-data
    severity: material
    topic: tam-sam-precision
    missingEvidence: A management-grade market model that reconciles broad beverage TAM, packaged retail SAM, and category-specific opportunity for Genki Forest.
    whyItMatters: Public sources support direction and scale but not a clean same-unit market-share framework.
    diligencePath: Request internal category sizing, sell-out studies, and share reports by sparkling, tea, electrolyte, and functional subcategories.
    relatedQuestionRefs:
    - QM011
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
