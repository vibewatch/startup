callouts:
- calloutType: insight
  title: The SAM is real, but it is broader than sparkling water
  body: The key market mistake would be to treat Genki Forest as a pure sparkling-water company. Public evidence shows sparkling water opened the door, but the more resilient addressable market is the broader low-sugar functional refreshment pool that includes tea, electrolytes, health water, and adjacent portability-driven occasions.
  claimRefs:
  - CM004
  - CM010
  - CM011
  - CM020
  - CM021
  - CM024
  - CM034
- calloutType: risk
  title: Category validation and category crowding are happening simultaneously
  body: Coca-Cola and PepsiCo validate the long-run consumer demand for functional refreshment, but their moves also mean the category is more strategic and more crowded. That dual reality is why market quality is high while Genki Forest’s margin for execution error is lower than when sparkling water first broke out.
  claimRefs:
  - CM023
  - CM024
  - CM029
  - CM030
  - CM031
