    severity: minor
    topic: current-channel-mix
    missingEvidence: Updated post-2021 channel-mix disclosure for Genki Forest across convenience, modern trade, e-commerce, and exports.
    whyItMatters: Historical channel mix exists, but the business appears to have changed materially with Costco and multi-category expansion.
    diligencePath: Ask management for the latest sell-in and sell-through breakdown by channel and geography.
    relatedQuestionRefs:
    - QM009
    - QM010
    relatedTableRefs:
