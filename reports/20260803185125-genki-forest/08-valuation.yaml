- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue base
    - Audited 2024–2025 revenue by category and geography
    - Without it, any implied multiple is guess-heavy
    - Finance data room / auditor pack
  - - Margin and cash generation
    - Gross margin, EBITDA bridge, operating cash flow, and runway
    - Determines whether premium growth is actually durable
    - Finance team and board materials
  - - Customer concentration
    - Top-customer mix, channel margin, and reorder cadence
    - Tests fragility of overseas expansion
    - Sales ops / retailer reporting
  - - Factory economics
    - Utilization by plant, capex payback, and QA metrics
    - Connects manufacturing thesis to return on capital
    - Operations diligence
  - - Legal and claim-substantiation map
    - Open disputes, current warnings, and marketing substantiation files
    - Required to price regulatory overhang accurately
    - Legal diligence
  notes: These asks are the minimum set needed to convert Genki from an interesting story into a priceable investment case.
