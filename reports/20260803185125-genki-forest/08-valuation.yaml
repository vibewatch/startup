- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Current revenue and margin quality prove premium-growth status; channel mix broadens; no major regulatory reset
    - $12B–$15B supportable; upside exists mainly if entry is well below historical high mark
    - Execution miss, concentration, or trust shock breaks premium thesis
    - Low-medium
  - - Base
    - Business remains strong but disclosure discount persists; investors apply mid-to-high single-digit sales framework
    - $7B–$10B fair-value zone; modest upside only if price is disciplined
    - Opacity and exit timing keep returns capped
    - Medium
  - - Bear
    - Concentration, margin pressure, or label/regulatory issues reset confidence; no fast exit path
    - $4B–$6B outcome; material downside if investors buy near rich rumor marks
    - Down round, recall, or adverse claim event accelerate reset
    - Medium-high
