  claims:
  - id: CV001
    statement: EqualOcean reported that Genki Forest’s April 2021 strategic financing implied a $6 billion valuation.
    type: third-party-reported
    topic: historical-valuation-anchor
    sourceRefs:
    - SV006
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV001
  - id: CV002
    statement: Pandaily later reported a nearly $200 million Temasek-led round at a $15 billion valuation, creating a much higher later-stage private mark than the April 2021 anchor.
    type: third-party-reported
    topic: historical-valuation-spread
    sourceRefs:
    - SV007
    - SV006
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV002
  - id: CV003
    statement: Those historical marks are useful signals of investor enthusiasm, but they are stale without a current audited revenue or cash-flow denominator.
    type: third-party-reported
    topic: staleness-discount
    sourceRefs:
    - SV007
    - SV003
    - SV008
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV002
  - id: CV004
    statement: The January 2026 IPO-denial reporting means investors cannot underwrite an imminent public-market exit as the base case.
    type: third-party-reported
    topic: ipo-timing-risk
    sourceRefs:
    - SV005
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV003
  - id: CV005
    statement: PepsiCo formally announced and then completed the acquisition of Poppi in 2025, confirming strategic interest in healthier soda-adjacent beverage assets.
    type: third-party-reported
    topic: m-and-a-proof
    sourceRefs:
    - SV015
    - SV016
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QV013
  - id: CV006
    statement: Coca-Cola’s 2025 launch of Simply Pop shows a major incumbent choosing to build a competing product line rather than buy the category leader by default.
    type: third-party-reported
    topic: build-vs-buy
    sourceRefs:
    - SV017
    - SV018
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV014
  - id: CV007
    statement: Together, Pepsi’s Poppi acquisition and Coca-Cola’s Simply Pop launch suggest the category is strategically important but not guaranteed to generate a broad buyer auction for Genki.
    type: third-party-reported
    topic: buyer-universe
    sourceRefs:
    - SV016
    - SV017
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV014
  - id: CV008
    statement: KrASIA, 36Kr, and FoodTalks all describe stronger 2025 operating momentum and tighter execution, which supports business quality even if it does not resolve valuation precision.
    type: third-party-reported
    topic: business-quality
    sourceRefs:
    - SV001
    - SV002
    - SV003
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV005
  - id: CV009
    statement: CCPIT, FoodTalks, and Qianqiance all point to overseas localization and Costco-linked expansion, which helps the growth narrative but not the disclosure problem.
    type: third-party-reported
    topic: growth-narrative
    sourceRefs:
    - SV011
    - SV012
    - SV010
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV007
  - id: CV010
    statement: UpMarket’s generic private-market surfaces show there is secondary-style market interest in Genki stock, but they do not provide an auditable fundamental basis for price.
    type: third-party-reported
    topic: secondary-signal
    sourceRefs:
    - SV008
    - SV009
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV025
  - id: CV011
    statement: 'Eastroc’s public data imply a roughly mid-single-digit sales multiple: about $14.11 billion market cap against about $2.92 billion TTM revenue, plus a formal 2025 annual-report disclosure trail.'
    type: third-party-reported
    topic: eastroc-multiple
    sourceRefs:
    - SV022
    - SV020
    - SV030
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV010
  - id: CV012
    statement: Nongfu Spring’s public data imply a meaningfully richer multiple at roughly $62.53 billion market cap against about $7.51 billion 2025 revenue.
    type: third-party-reported
    topic: nongfu-multiple
    sourceRefs:
    - SV021
    - SV019
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV010
  - id: CV013
    statement: Coca-Cola’s public data imply a high-single-digit sales multiple at about $373.74 billion market cap versus about $49.28 billion TTM revenue.
    type: third-party-reported
    topic: coke-multiple
    sourceRefs:
    - SV023
    - SV026
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV011
  - id: CV014
    statement: PepsiCo’s public data imply a much lower sales multiple at about $190.42 billion market cap versus about $95.449 billion TTM revenue.
    type: third-party-reported
    topic: pepsi-multiple
    sourceRefs:
    - SV024
    - SV032
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV011
  - id: CV015
    statement: Monster Beverage’s public data imply a double-digit sales multiple at about $91.09 billion market cap versus about $8.79 billion TTM revenue.
    type: third-party-reported
    topic: monster-multiple
    sourceRefs:
    - SV025
    - SV027
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV012
  - id: CV016
    statement: Celsius’ public data imply a lower but still growth-oriented multiple at about $7.17 billion market cap versus about $2.96 billion TTM revenue.
    type: third-party-reported
    topic: celsius-multiple
    sourceRefs:
    - SV028
    - SV029
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV012
  - id: CV017
    statement: This comp spread is wide because growth, margin quality, brand durability, and disclosure all matter at least as much as simple beverage-category labels.
    type: third-party-reported
    topic: comp-dispersion
    sourceRefs:
    - SV025
    - SV024
    - SV030
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV009
  - id: CV018
    statement: Genki therefore cannot be valued responsibly as a pure mature cola comp or as an unquestioned premium-growth icon; it sits between those extremes.
    type: third-party-reported
    topic: positioning-between-comps
    sourceRefs:
    - SV001
    - SV021
    - SV022
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV024
  - id: CV019
    statement: The strongest case for a premium multiple is that Genki appears to be a scaled health-led beverage platform with real domestic traction and growing overseas optionality.
    type: third-party-reported
    topic: bull-thesis
    sourceRefs:
    - SV003
    - SV011
    - SV013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV005
  - id: CV020
    statement: The strongest case for a discount is that current public revenue, margin, cash, and customer-concentration data are still missing.
    type: third-party-reported
    topic: discount-thesis
    sourceRefs:
    - SV003
    - SV008
    - SV014
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
  - id: CV021
    statement: Any investor asked to pay close to the highest historical private marks without current audited disclosures is taking valuation risk that public evidence does not neutralize.
    type: third-party-reported
    topic: price-risk
    sourceRefs:
    - SV007
    - SV009
    - SV003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV004
  - id: CV022
    statement: The relevant lesson from Eastroc and Nongfu is not that Genki deserves their exact multiple, but that even strong beverage assets trade within ranges shaped by disclosure and category quality.
    type: third-party-reported
    topic: china-comp-lesson
    sourceRefs:
    - SV030
    - SV022
    - SV021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV026
  - id: CV023
    statement: The relevant lesson from Coke and Pepsi is that scale alone does not guarantee a premium multiple if growth is slower or portfolio maturity is higher.
    type: third-party-reported
    topic: mature-comp-lesson
    sourceRefs:
    - SV023
    - SV024
    - SV032
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV027
  - id: CV024
    statement: The relevant lesson from Monster and Celsius is that investors will pay materially more for perceived growth and category heat, but only when market transparency is adequate.
    type: third-party-reported
    topic: growth-comp-lesson
    sourceRefs:
    - SV025
    - SV028
    - SV029
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV027
  - id: CV025
    statement: 'Genki’s risk chapter directly matters to valuation: labels, ingredient perception, and customer concentration all deserve a multiple discount until managed evidence is disclosed.'
    type: third-party-reported
    topic: risk-to-multiple
    sourceRefs:
    - SV014
    - SV010
    - SV003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV018
  - id: CV026
    statement: The lack of an IPO plan lowers near-term exit certainty and increases the importance of secondary liquidity or patient private capital.
    type: third-party-reported
    topic: exit-optionality
    sourceRefs:
    - SV005
    - SV008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV019
  - id: CV027
    statement: A reasonable investment stance must therefore be price-sensitive rather than company-quality-sensitive alone.
    type: third-party-reported
    topic: price-sensitive
    sourceRefs:
    - SV003
    - SV009
    - SV022
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV016
  - id: CV028
    statement: If Genki were offered at a valuation implying a premium above high-transparency public comps without supporting disclosure, the public evidence would argue against aggressive entry.
    type: third-party-reported
    topic: overpay-risk
    sourceRefs:
    - SV021
    - SV025
    - SV003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV016
  - id: CV029
    statement: If Genki were offered materially below the most optimistic historical private marks and paired with real financial disclosure, the business-quality evidence would become more actionable.
    type: third-party-reported
    topic: conditional-upside
    sourceRefs:
    - SV006
    - SV007
    - SV003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV017
  - id: CV030
    statement: UpMarket-style secondary references are best treated as weak sentiment markers rather than decisive intrinsic-value evidence.
    type: third-party-reported
    topic: secondary-limit
    sourceRefs:
    - SV008
    - SV009
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV025
  - id: CV031
    statement: Bull-case support for a roughly $12–15 billion valuation would require proof that current revenue is materially above old anchors, growth remains strong, and margin quality is real.
    type: third-party-reported
    topic: bull-case
    sourceRefs:
    - SV007
    - SV003
    - SV001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV021
  - id: CV032
    statement: A more grounded base-case range of roughly $7–10 billion assumes real scale and channel optionality, but still applies a meaningful discount for opacity and risk.
    type: third-party-reported
    topic: base-case
    sourceRefs:
    - SV006
    - SV022
    - SV021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV022
  - id: CV033
    statement: A bear-case range of roughly $4–6 billion becomes plausible if customer concentration, margin pressure, or regulatory trust shocks erode the premium-growth narrative.
    type: third-party-reported
    topic: bear-case
    sourceRefs:
    - SV014
    - SV022
    - SV005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV023
  - id: CV034
    statement: Relative to a $15 billion historical private mark, the public-evidence upside looks limited while the downside from disclosure disappointment is substantial.
    type: third-party-reported
    topic: return-skew
    sourceRefs:
    - SV007
    - SV003
    - SV022
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV020
  - id: CV035
    statement: Relative to the older $6 billion mark, current public operating signals can still support some uplift, but not a blank-check multiple expansion.
    type: third-party-reported
    topic: return-skew
    sourceRefs:
    - SV006
    - SV001
