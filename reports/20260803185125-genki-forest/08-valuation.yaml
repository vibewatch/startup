- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Down-round or soft private financing signal
    - Pricing meaningfully below already-disclosed historical anchors
    - Breaks premium-growth confidence and suggests weaker economics or buyer appetite
    - Avoid or reprice aggressively
  - - Claim / label enforcement or new apology cycle
    - Fresh regulatory or public trust event
    - Raises discount rate and hurts repeat-confidence narrative
    - Pause entry and re-underwrite compliance risk
  - - Channel concentration revealed
    - One buyer / retailer dominates overseas volume
    - Increases negotiating leverage risk and fragility of expansion thesis
    - Demand concentration discount
  - - Quality or recall incident
    - Material product-quality event
    - Directly damages brand trust and margin confidence
    - Escalate to bear-case weighting
  - - No audited cash / margin evidence in diligence
    - Financial package remains incomplete
    - Means public-case opacity remains unresolved
    - Stay in track / research-more mode
  notes: Kill triggers are framed as IC monitoring rules rather than precise public metrics.
