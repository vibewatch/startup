  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: repeat-and-reorder
    missingEvidence: Retailer reorder curves, scanner-data repeat purchase, cohort retention, and region-level sell-through by SKU.
    whyItMatters: Customer proof without durability proof is not enough to underwrite sustainable consumer economics.
    diligencePath: Request Circana / Nielsen scans, marketplace cohort repeat, and retailer reorder cadence by channel.
