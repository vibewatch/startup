- id: retention-expansion-and-concentration-risks
  title: Retention, expansion, and concentration remain the major customer diligence gaps
  body: |-
    The biggest weakness in Genki Forest’s customer evidence is not proof of access; it is proof of durability. None of the public sources reviewed here provide NRR, GRR, retailer renewal curves, formal repeat-purchase cohorts, or even a basic top-customer concentration table. For a beverage company, those gaps matter because customer breadth at the consumer surface can coexist with heavy dependence on a few retailer buying relationships.

    Costco is the most obvious example. It is repeatedly highlighted in overseas narratives, which is positive because it implies stringent retail acceptance and potentially strong volume. But it is also a warning sign: if a meaningful share of export velocity sits in one club-retail relationship, negotiating leverage and sell-through volatility could become material. Similar uncertainty applies to the balance between marketplaces, ethnic grocery, and broader mass retail.

    Trust adds another layer. The zero-sucrose controversy illustrates how consumer-facing food and beverage brands can absorb reputational damage without immediately disappearing from shelves. In a low-switching-cost category, label clarity and repeat-purchase confidence can matter more than one-time trial. The customer verdict is therefore mixed: Genki has credible channel proof and plausible expansion momentum, but still lacks the retention and concentration disclosure needed for a high-conviction customer-quality underwriting case.
