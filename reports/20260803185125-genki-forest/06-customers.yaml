- id: named-customer-proof-and-adoption-quality
  title: Named customer proof is real, but mostly proves discoverability and assortment
  body: |-
    The strongest named customer proof in the public record is retail-channel proof. Costco appears repeatedly in localization and overseas-expansion reporting, while Weee, Yami, and Instacart / H Mart show that the products are actually merchandised on customer-facing retail pages. Cherry Picks adds a second layer by summarizing seller ratings and product-review density tied to Amazon marketplace activity. That is materially better than a bare logo slide because it shows real products, formats, and customer-facing purchase paths.

    Still, the quality of proof varies. A live Weee or Instacart listing is stronger than a generic brand mention, because it confirms a product is currently discoverable. A review aggregator can signal that products are receiving consumer attention, but it cannot replace scanner data, reorder rates, or verified door counts. Likewise, historical Amazon ranking success is useful for demonstrating early trial, yet weak for proving durable 2026 retention.

    This means Genki passes a real-adoption threshold but not a durability threshold. Public evidence supports the claim that consumers can buy the product in multiple overseas channels today. It does not support a conclusion that those channels are deep, sticky, or highly profitable. Investors should therefore treat named channel proof as necessary but insufficient.
  claimRefs:
