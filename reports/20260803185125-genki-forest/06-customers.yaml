callouts:
- calloutType: insight
  title: Genki has credible customer proof, but mostly at the shelf edge
  body: Public evidence is good enough to show real overseas adoption paths, especially through Costco, Asian grocery platforms, and Amazon-linked surfaces. It is not good enough to show who reorders, who matters most, or which channels are truly durable.
  claimRefs:
  - CU005
  - CU009
  - CU010
  - CU017
  - CU024
  - CU030
- calloutType: risk
  title: Customer concentration could be hiding behind broad discoverability
  body: A beverage brand can look widely distributed while still leaning on a small number of retail buyers or one hero SKU. The repeated Costco emphasis is bullish channel proof, but also a reminder to test concentration explicitly.
  claimRefs:
  - CU005
  - CU021
  - CU026
  - CU027
