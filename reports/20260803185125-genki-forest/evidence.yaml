evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited consolidated revenue, cash, debt, and margin disclosure for 2024-2026.
    whyItMatters: Public growth percentages do not let an investor underwrite unit economics, capital efficiency, or solvency.
    diligencePath: Request management financial statements, board materials, and lender summaries for the last three fiscal years.
    relatedQuestionRefs:
      - QO009
      - QO025
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: latest-valuation
    missingEvidence: Primary documentation for the latest priced round, valuation, investor allocation, and liquidation preferences.
    whyItMatters: Public valuation anchors conflict materially between April 2021, late 2021, and July 2025 media reports.
    diligencePath: Obtain signed term sheets, cap-table snapshots, and counsel-confirmed financing chronology from management.
    relatedQuestionRefs:
      - QO007
      - QO008
      - QO025
  - type: private-evidence-only
    severity: minor
    topic: governance-rights
    missingEvidence: Board composition, observer rights, veto matters, and founder ownership after later financings.
    whyItMatters: Visible legal titles do not show real control, succession resilience, or investor protections.
    diligencePath: Request charter documents, shareholder agreements, and board materials from the latest financing.
