- id: capital-intensity-and-unit-economics
  title: Manufacturing ownership strengthens control but raises capital intensity
  body: |-
    The most important financial nuance in Genki Forest is that it is not simply a light-marketing beverage company. CKGSB said the company built five self-owned factories and targeted more than 5 billion bottles of annual capacity, while KrASIA reported in 2026 that the second phase of the Tianjin factory had begun operations and that a new Henan facility was planned. That combination suggests a business trying to trade higher capex for better manufacturing control, faster iteration, and improved economics per case.

    There is some evidence this strategy is paying off operationally. KrASIA said cost per case had reached a competitive level and described improvements in supply-chain efficiency, SKU discipline, and channel execution. But that is still not the same thing as published gross margin. Investors cannot yet see utilization by plant, inventory write-offs, capex payback, or the split between contribution margin and overhead absorption. In a beverage business, those are the numbers that separate a scaled consumer brand from a financially resilient one.

    Listed peers make the contrast obvious. Eastroc and Tingyi disclose revenue context, category priorities, and enough operating detail to benchmark what Genki withholds. Public evidence therefore supports a view that Genki may be building a stronger system than an asset-light challenger, but not a clean proof that returns on invested capital are already attractive.
