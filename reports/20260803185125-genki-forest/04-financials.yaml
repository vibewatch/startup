  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: Audited income statement, balance sheet, and cash-flow statement for the latest fiscal year.
    whyItMatters: Without audited statements, revenue quality and runway remain inferred rather than underwritten.
    diligencePath: Request management financials plus auditor notes and monthly operating dashboard.
