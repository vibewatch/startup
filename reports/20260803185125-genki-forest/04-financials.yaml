company:
  name: Genki Forest
chapter:
  number: 4
  title: Financials
  summary: Public evidence suggests Genki Forest has a real and growing beverage revenue engine, but not a fully underwritable one. The company appears to monetize through large-scale packaged-beverage sell-through across domestic offline retail, e-commerce, and expanding overseas channels, with sparkling water still the clearest historical revenue anchor and newer tea, electrolyte, and adjacency lines contributing to 2025 growth. Yet the decisive financial questions—a current revenue base, gross margin, cash balance, burn, working-capital profile, and return on factory capex—remain undisclosed.
sections:
- id: revenue-model-and-traction
  title: Revenue model and traction are visible, but only in partial public slices
  body: |-
    Genki Forest makes money the old-fashioned FMCG way: by selling packaged beverages into retail channels, not by monetizing a software layer or a recurring service wrapper. Public evidence is directionally strong on this point. The international site, retailer discovery surfaces, and channel coverage all show a brand distributed through club retail, Asian grocery, Amazon-style marketplaces, and China e-commerce rather than a direct-only sales motion. What is less clear is the precise mix across those channels, the realized net pricing after discounts and trade spend, and the split between domestic and export gross profit.

    The strongest dated revenue anchor is still historical. Yicai’s March 2021 article, citing 36Kr, said Genki Forest generated CNY2.9 billion of sales in 2020 and that roughly 70% of the business came from zero-calorie sparkling water. That matters because it confirms both scale and concentration: the company was already large enough to matter, but it was still heavily dependent on its hero category. More recent 2025 reporting implies a broader portfolio, with tea and other branded lines adding more weight, yet those sources still do not provide the audited revenue base investors would need to measure true diversification.

    The practical conclusion is that growth evidence exists, but the accounting view does not. FoodTalks and Yilantop reported 26% year-over-year growth for 2025 and double-digit growth for a third straight year, which is a meaningful operating signal. Still, those numbers say little about revenue quality without denominator, margin, and working-capital context.
