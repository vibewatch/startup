- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale / strategic value
  - Public evidence
  - Key gap
  rows:
  - - Hyperscaler custom-JDM accounts
    - Buyer = network/platform leadership; users = network architecture, SRE, AI cluster teams; payer = central infra capex
    - Custom Ethernet fabrics for scale-out, scale-across, and front-end AI clusters while preserving buyer-selected NOS
    - Few accounts, very high ACV, strategic design-win potential
    - Official launch and launch-from-stealth materials repeatedly describe custom solutions for hyperscalers
    - No public named hyperscaler list, geography mix, or top-account revenue share
  - - NeoCloud turnkey operators
    - Buyer = cloud platform / infra leadership; users = operations teams; payer = AI cloud buildout budget
    - Turnkey switching plus hardened Nexthop NOS for operators that want faster deployment and support
    - Smaller than hyperscalers individually but fast-growing target cohort
    - March 2026 product launch and Series B release explicitly separate NeoCloud offer from hyperscaler custom motion
    - No named NeoCloud customer reference or production case study was fetched
  - - Dedicated AI IaaS / guaranteed-capacity NeoClouds
    - Buyer = cloud infrastructure owner; users = GPU-fleet and service-delivery teams; payer = contracted AI cloud capex/opex budget
    - Fixed-term or dedicated AI infrastructure with guaranteed capacity
    - Potential for multi-rack or campus-scale networking demand if design win lands
    - Cisco’s NeoCloud segmentation highlights dedicated AI IaaS as a distinct service model
    - No public evidence shows Nexthop has converted this segment into disclosed customers
  - - Public AI cloud / burst-capacity providers
    - Buyer = product/operations leadership; users = tenant-facing platform teams; payer = usage-driven platform budget
    - Shared GPU pools and elastic AI cloud services where deployment speed and supply matter
    - Can produce repeat hardware demand as GPU pools expand
    - Cisco and AFL both describe fast-turn, high-utilization AI cloud operators as a growing buyer class
    - Demand exists, but Nexthop-specific win rate and expansion data are private
  - - Power-advantaged or converted-infrastructure AI operators
    - Buyer = campus or infra developer; users = data-center and network operations teams; payer = project finance plus infrastructure budget
    - Power-led AI campuses needing resilient DCI, fiber, and modular scale-out designs
    - Useful adjacency for scale-across/DCI products but operationally riskier
    - AFL and Flexential highlight power, fiber, and site constraints as major decision drivers
    - No evidence ties Nexthop publicly to any specific operator, campus, or geography
  notes: Rows separate the public target-account archetypes from disclosed customer proof; strategic value refers to likely contract importance, not verified revenue.
