- id: concentration-procurement-and-adverse-signals
  title: Concentration, procurement, and adverse signals
  body: 'The biggest customer risk is not that Nexthop lacks an obvious target segment; it is that the target segment is tiny, demanding, and cyclical. Comparable public filings show how extreme concentration can become in this buyer set: Arista disclosed that Microsoft and Meta represented 20% and 15% of 2024 revenue, and it warned that order timing depends on lengthy evaluation, qualification, acceptance, and spending cycles while large-account discounts pressure margins. That matters because Nexthop is pursuing the same kind of account structure with less diversification. External adverse sources reinforce procurement friction. Flexential’s 2026 survey says network issues, fiber scarcity, tariff pressure, and policy uncertainty are delaying AI infrastructure decisions, while AFL notes that NeoCloud operators often buy in smaller volumes with tighter economic buffers and greater supplier dependence. Sequoia’s AI-capex critique adds a second-order customer risk: if AI infrastructure buildout
    overshoots realized end-user demand, some buyers may push out network purchases or demand tougher economics. In other words, a handful of big wins could transform Nexthop’s trajectory, but the same concentration would also make revenue timing, discounting, and customer-quality diligence central to the investment case.'
