- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Why it matters
  - Current public signal
  - Diligence path
  rows:
  - - Custom JDM wins at hyperscalers
    - A few accounts could dominate revenue and roadmap priorities
    - Huge ACV can accelerate scale but creates budget-cycle dependence
    - Company materials emphasize largest operators and custom motion; comparable vendors show extreme concentration
    - Request top-5 customer revenue share, pipeline by stage, and design-win concentration by account
  - - Turnkey NeoCloud offer
    - Segment is growing but financially less durable than hyperscalers
    - Can broaden logo base, but utilization shocks or financing stress can hit purchasing
    - Cisco and AFL describe NeoCloud growth alongside tighter economics and vendor dependence
    - Break down pipeline by NeoCloud subtype, financing status, and committed capacity
  - - Open NOS / preferred-NOS support
    - Customization load can slow qualification and squeeze margins
    - Technical flexibility helps win accounts but may raise services burden
    - Launch materials and investors stress buyer-selected SONiC / FBOSS compatibility
    - Show gross margin and engineering-effort split between custom vs turnkey programs
  - - Platform breadth across front-end, scale-out, and scale-across
    - Cross-sell thesis may be real but is not publicly evidenced
    - If proven, wallet share per account could rise materially after first qualification
    - Product breadth is visible; repeat-order evidence is not
    - Provide cohort showing first SKU, second SKU, and optics/support attach by account
  - - Direct high-touch selling motion
    - Long procurement cycles and discounting can delay revenue recognition
    - A few delayed programs can distort growth and cash needs
    - Lightspeed and Arista both describe long, complex qualification and acceptance cycles
    - Provide design-win conversion rates, average cycle length, and discount ranges by segment
  notes: 'Focuses on the strategic tradeoff in Nexthop’s customer model: very large potential accounts, but few of them and with long qualification cycles.'
