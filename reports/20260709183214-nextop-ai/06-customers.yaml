- id: adoption-trajectory-and-proof-quality
  title: Adoption trajectory and proof quality
  body: The public adoption story improved materially between Nexthop’s March 2025 launch and its March 2026 product-and-funding announcements, but it still falls short of a conventional named-customer roster. The strongest production-like statement is explicit company language that the newly announced platforms and software are already shipping to leading hyperscalers. The strongest collaboration signal is the disclosed fact that Disaggregated Spine was developed with a large hyperscaler. The strongest named reference is Dave Maltz of Azure Networking praising Nexthop’s open-networking work and customer success in a launch quote, while Microsoft’s own profile confirms Maltz runs Azure Networking engineering and SONiC firmware development. Those are meaningful signals because they imply real engagement with serious operators, but they are not the same as a public declaration that Microsoft or any other hyperscaler is a paying production customer. The chapter’s core judgment is therefore
    that Nexthop has crossed the threshold from pure concept to credible customer engagement and at least some shipment activity, yet public proof remains concentrated in one named technical reference, one unnamed large-hyperscaler collaboration, and one generalized shipping claim. No fetched source provided a customer-authored deployment writeup, procurement record, public contract, or outcome-rich case study for a named production account.
