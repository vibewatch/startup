- id: TU006
  title: Procurement and deployment friction signals table
  columns:
  - Signal
  - Public value
  - Customer impact
  - Why it matters for Nexthop
  - Source lens
  rows:
  - - Network-related AI performance issues
    - 96% of respondents experienced at least one issue in past 12 months
    - Buyers care about congestion, latency, and reliability, not just port speeds
    - Helps explain why power, telemetry, and deployment-speed messaging resonates
    - Flexential 2026 survey
  - - Fiber / low-latency site constraints
    - 91% said fiber availability and connectivity limited site selection; 54% said fiber delays affected deployments
    - Procurement depends on site readiness, not only switch choice
    - Nexthop’s DCI / scale-across narrative fits a real buyer pain point
    - Flexential 2026 survey
  - - Tariff / policy pressure
    - 40% delayed or scaled back AI infrastructure purchases; 94% say policy uncertainty affects planning
    - Orders can slip even when long-term AI demand is strong
    - Creates timing risk for any startup selling into AI infrastructure waves
    - Flexential 2026 survey
  - - NeoCloud vendor dependence
    - Many NeoClouds rely on limited vendors or a few key specialists
    - Customer stability can be weaker than at hyperscalers
    - Concentration risk is amplified if Nexthop leans too heavily on fragile operators
    - AFL Hyperscale analysis
  - - Comparable-vendor qualification cycle
    - Large customers evaluate, test, qualify, and accept products over long cycles
    - Revenue can be lumpy and deployment counts can lag design wins
    - A useful proxy for the likely sales motion Nexthop faces
    - Arista 10-K risk factor
  notes: These are buyer-side friction indicators and comparable-cycle proxies, not Nexthop-specific operational metrics; they help explain where the customer funnel can stall.
  claimRefs:
