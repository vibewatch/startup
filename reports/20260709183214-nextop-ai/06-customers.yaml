  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-gap
    missingEvidence: A publicly referenceable list of named Nexthop customers with production-versus-pilot status and at least one customer-authored or contract-linked deployment proof item.
    whyItMatters: Without named production proof, the chapter can establish buyer fit and engagement quality but cannot fully validate adoption breadth or referenceability.
    diligencePath: Request reference calls, deployment letters, procurement records, or customer-authored case studies for the top shipped accounts.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-count-gap
    missingEvidence: Current shipped-account count, installed-base count, and production account count segmented by hyperscalers versus NeoClouds.
    whyItMatters: The company claims shipments and deep partnerships, but without a denominator the public adoption trajectory cannot be translated into breadth, momentum, or dependency.
    diligencePath: Request a dated shipped-account ledger and design-win funnel with counts by stage, region, and account type.
    relatedQuestionRefs:
    - QU010
    relatedTableRefs:
    - TU002
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics-gap
    missingEvidence: NRR, GRR, renewal rate, churn, contract length, support attach, and customer-satisfaction metrics for the current customer base.
    whyItMatters: Durability is one of the main chapter missions, and today it can only be treated as an unverified hypothesis based on relationship depth and product breadth.
    diligencePath: Request customer cohort reporting, support-renewal data, and at least a top-account expansion timeline showing repeat orders and added product families.
    relatedQuestionRefs:
    - QU015
    - QU016
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: top-account-concentration-gap
    missingEvidence: Top-customer revenue share, backlog share, and gross-margin profile by hyperscaler versus NeoCloud cohort.
    whyItMatters: Comparable vendors show concentration can become extreme in this buyer set, so without private concentration data it is impossible to separate strategic focus from fragility.
    diligencePath: Request the current top-10 customer list with revenue contribution, stage of deployment, discounting profile, and cancellation or pushout history.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: channel-and-geography-gap
    missingEvidence: Public disclosure of customer geography mix, regional site exposure, and whether any material portion of sales is indirect or partner-mediated.
    whyItMatters: This would improve underwriting of deployment concentration, service burden, and geopolitical exposure, especially if a few campuses or countries dominate shipped systems.
    diligencePath: Ask management for a regional customer heat map and a breakdown of direct versus partner-assisted selling for active accounts.
    relatedQuestionRefs:
    - QU005
    - QU017
acknowledgedWarnings:
- dimension: figureType
  reason: No public cohort or renewal time series exists for Nexthop customers, so forcing a retention-cohort figure would require invented percentages; the gap is handled in TU004 and evidenceGaps instead.
