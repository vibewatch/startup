company:
  name: Nexthop AI
chapter:
  number: 6
  title: Customers
  summary: 'Nexthop’s public customer record is directionally credible but still thin: the company clearly targets hyperscalers and NeoClouds buying Ethernet AI-networking infrastructure, publicly says products are already shipping to leading hyperscalers, and has a named validation quote from Microsoft Azure Networking, yet it does not disclose a broad customer list, customer count, or retention metrics. The strongest public proof is therefore a blend of named technical reference, unnamed hyperscaler co-development, and generalized shipment language rather than fresh customer-authored production case studies. That leaves buyer fit and demand timing looking real, but durability, expansion quality, and top-account concentration still need direct diligence.'
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: 'Nexthop’s public segmentation is narrow by design. The company does not market to generic enterprise switching buyers; its own homepage, launch materials, and investor posts repeatedly frame the addressable customer base as hyperscalers and NeoClouds running large AI and cloud data-center fabrics. Within that segment, the paying account is usually an infrastructure or platform budget owner, the operational buyer is a network architecture or cloud engineering team, and the daily users are network SRE, cluster-operations, and AI-infrastructure teams that care about deployment speed, power efficiency, open NOS support, and lifecycle manageability. The public split between customer types is also meaningful. Hyperscaler accounts are described as custom, co-developed JDM engagements that let buyers specify hardware and retain their preferred SONiC or FBOSS-derived software path, while NeoClouds are described as more turnkey buyers that can take a hardened Nexthop NOS. External market
    context supports that segmentation: Cisco and AFL both describe NeoClouds as a distinct buyer class with different economic and operational constraints from hyperscalers. What is still missing is basic disclosure by geography, account count, and revenue band, so the public segmentation is strong on buyer workflow but weak on portfolio breadth.'
