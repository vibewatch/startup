      - - 客户广度
        - 客户数量、头部账户结构、生产部署 / 试点拆分，以及中标转化
        - 区分可规模化业务和少数集中项目
        - 收入分析 + 客户访谈
        - 证明客户广度正在超出很小的旗舰客户集合
      - - 留存与扩张
        - 续约分群、扩张 ARR 和支持服务续约行为
        - 用来证明价值可重复，并支撑后续估值
        - 客户成功和财务审阅
        - 提供分群证据，说明客户首次部署后会扩张而不是流失
      - - 股权结构与条款
        - 清算优先权、参与权、棘轮条款，以及任何老股或赎回权
        - 融资轮名义价格未必等于可转让的入场价值
        - 由律师主导的股权结构审阅
        - 确认下行结构没有明显差于名义估值所暗示的水平
      - - 退出准备度
        - 审计级 KPI 报告、董事会指标和披露材料包
        - 用来判断未来融资或退出能否扩大价格发现范围
        - 董事会材料和 IPO 准备度审阅
        - 提供能让跨界或公开市场投资者信服的运营数据集
    notes: 问题按最能改变投资判断质量排序，而不是按管理层最容易提供的材料排序。
    claimRefs:
      - CV004
      - CV033
      - CV038
      - CV042
      - CV043
      - CV050
