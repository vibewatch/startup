        - 没有公开收入、利润率或留存数据能验证当前估值
        - 缺少运营 KPI 时，本轮可能只是叙事溢价，不是能靠数据支撑的估值
        - 一份财务 KPI 材料包可迅速补上大部分缺口
      - - 反方论点
        - 即便需求真实，客户集中度也可能很高
        - 一两个账户就可能决定 AI 网络公司的结果，并造成节奏剧烈摆动
