      - number: '4.5'
        title: 财务判断与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              可承销的结论很窄但清楚。公开证据支持一个面向超大规模云厂商和 NeoCloud 买方的硬件、软件加支持收入引擎确实存在，也支持 Nexthop
              作为年轻私营厂商资金异常充足。但它无法支持对当前收入质量、当前销售效率、当前毛利率或实际现金消耗速度的判断。负面背景不是推翻机会，而是加深谨慎。Sequoia 对 $600 billion AI
              基础设施的质疑，以及 Flexential 的 2026 年调查，都认为 AI 基础设施需求真实但经济性噪声很大，ROI 审查、网络瓶颈和采购延迟仍在发生。与此同时，既有厂商正快速扩大开放 Ethernet
              产品，足以让定价压力继续存在。因此，正确判断不是“资金不足”，而是“尚未可承销”。若要从策略论点推进到投资级财务视图，尽调需要当前收入、按 SKU
              或项目类型拆分的实际定价、支持附着率、按产品系列拆分的毛利率、库存和应收水平、按职能拆分的当前员工数，以及当前现金和现金消耗桥。
