      - number: '6.3'
        title: 耐久性、重复使用与扩张
        blocks:
          - type: paragraph
            body: >-
              公开耐久性证据远弱于公开定位证据。Nexthop
              不披露客户数、NRR、GRR、客户留存、续约率、合同期限、流失、支持满意度，或任何重复订单的同期群视图。抓取集合里唯一正面的重复使用代理指标是定性的：管理层和投资人都强调深度客户伙伴关系、长期客户工程投入，以及一套覆盖定制硬件、偏好
              NOS 支持、光模块认证和成套 NeoCloud 软件的产品集。这种组合让落地后扩张故事说得通，因为一旦客户认证一个平台，前端、scale-out 和 scale-across
              网络等相邻角色可能扩大钱包份额。但可信不等于证明。没有公开续约或装机基础数据时，正确尽调姿态是保持耐久性字段为
              null，把扩张视为建立在产品广度和参与深度上的假设，而不是已验证同期群。公开来源能给出的最好结论是：Nexthop
              的动作关系很重，一旦拿到设计位置，可能具备粘性；但证据今天仍太稀疏，无法承销重复使用质量或满意度。
