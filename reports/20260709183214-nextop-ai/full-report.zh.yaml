      - number: '8.4'
        title: 退出准备度、击穿触发条件与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度结论很直接：Nexthop 可能正走向大结果，但公开证据还撑不起 IPO 式承销。战略逻辑存在，因为规模化网络资产对既有厂商有价值，HPE 的 Juniper 交易说明了这一点；AI
              网络栈也仍是上市供应商和私募投资者的重点市场。即便如此，最终退出倍数将取决于今天仍缺失的证据。最可执行的做法，是现在就定义命题击穿触发条件和尽调问题，而不是等下一次融资之后再说。如果下一轮融资低于 2026
              年标价且没有补偿性 KPI
              跃升，如果客户集中度仍极端，如果扣除支持和库存成本后毛利质量平庸，或者管理层拿不出退出级指标，投资命题就应从“强公司、价格偏紧”切换为“故事跑在证据前面”。这也是最终尽调问题表聚焦收入、毛利、客户组合、留存、支持负担和融资条款的原因。这些不是可有可无的细节；它们决定当前估值只是暂时证明缺口，还是结构性高估风险。
