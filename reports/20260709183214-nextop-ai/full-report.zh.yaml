      - number: '3.2'
        title: 能力、打包与市场打法对比
        blocks:
          - type: paragraph
            body: >-
              从能力看，仅凭公开证据，Nexthop 可信但并非功能独一份。它的公开组合覆盖 51.2T、102.4T 和深缓冲 scale-across 角色，并通过 SONiC、FBOSS 及自有的 SONiC
              发行版强力押注开放 NOS 支持。开放性有价值，因为部分竞争对手仍更偏垂直整合。NVIDIA 的价值主张整合度最高，把 Ethernet、InfiniBand、DPU 和 scale-up
              互连放进一个栈；Cisco 和 Arista 则围绕交换机销售更宽的 fabric 软件、遥测和验证设计包装。Juniper 值得注意，因为 Apstra 明确支持 Juniper、Cisco、Arista 和
              SONiC 环境；但最强的多厂商功能放在高级许可背后，而不是完全开放的软件姿态。打包和定价方面，整个品类的公开透明度都很薄。Juniper
              对软件层级最清楚；多数其他厂商展示的是方案包、联系销售流程，或基于报价的企业销售，而不是公开的每端口经济性。因此，GTM 和支持信任几乎与硬件同样重要。Cisco 可以打包 AI POD 和融资关系，Arista
              带来长期云网络信誉，HPE 则能把 Juniper 推入更大的全球销售体系。
