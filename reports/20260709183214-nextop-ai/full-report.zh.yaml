      - number: '8.2'
        title: 当前融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Nexthop 的融资背景是支撑项，但不能自证。从 2025 年 $110M 启动轮到 2026 年 $500M Series B，说明公司已吸引强烈投资者信心；官方叙事把这份信心和面向超大规模云厂商的产品、开放
              NOS 灵活性、深度客户共创绑定在一起。但同一组融资事实也抬高了门槛。一家年轻硬件供应商不披露收入，却打到 $4.2B
              标价，证明负担就从“市场是否真实？”转为“公司商业化规模是否已经配得上这个溢价？”公开证据回答不了。最接近的公开 Ethernet 可比公司 Arista，给出了好状态的样子：规模、64.1%
              毛利率，以及披露的递延收入和集中度动态。更广的可比集合显示，当网络故事更像多元化基础设施，而不是稀缺 AI
              杠杆时，低倍数结局很常见。因此入场纪律必须明确。在当前标价下，新投资者应要求三者至少有其一：更低价格、优先股栈里强下行保护，或一份私下尽调包，能足够快地补上收入、毛利率和集中度缺口，避免本轮沦为纯叙事估值。
