        - 即使预算已批，也可能拖慢集群部署
        - 将管线假设绑定到电力就绪站点和客户并网状态
      - - 光模块和组件瓶颈
        - 约束
        - 2026-2029
        - 可能拖慢 800G 和 1.6T 部署，并拉长拓扑计划
        - 检查供应商配额、光模块策略和备用设计假设
      - - AI ROI 质疑和客户集中
        - 约束
        - 当前
