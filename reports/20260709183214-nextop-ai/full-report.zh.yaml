      - number: '5.2'
        title: 架构、开放网络与外部依赖
        blocks:
          - type: paragraph
            body: >-
              公开架构可信，但明显是解耦的。硬件层是来自 Broadcom Tomahawk 5、Tomahawk 6 和 Qumran3D 系列的商用芯片系统；软件层是客户自选的 SONiC 或 FBOSS 变体、由
              SONiC 驱动的 Nexthop NOS 发行版，以及面向 BYoNOS 和 BYoSAI 集成的包装；启动或配置层是 ONIE，而不是封闭的专有安装路径。外部技术来源有助于解释 Nexthop
              为何持续押注这套栈。Microsoft 的 SONiC 架构文章描述了容器化交换软件、SWSS，以及跨厂商硬件的 SAI 抽象；Meta 的 FBOSS 材料则描述了一种基于 agent
              的解耦交换控制方式。这些引用不能验证 Nexthop
              自身实现质量，但能让其宣称的运营模式在技术上说得通。上行空间是灵活性：超大规模云厂商可以保留内部软件和自动化，同时购买硬件和集成帮助。下行也很清楚：Nexthop 的护城河位于芯片之上、开放 NOS
              基底之上，因此供应、发布质量和集成执行，比任何秘密 ASIC 都更重要。Disaggregated Spine 概念符合这套逻辑，但其成本和功耗差异仍是公司声明，而不是独立基准验证。
