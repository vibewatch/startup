      - number: '2.2'
        title: 规模口径与受限的 TAM / SAM / SOM
        blocks:
          - type: paragraph
            body: >-
              公开规模证据只有在先说明边界时才有用。650 Group 最宽的口径指向 2025 年 AI 网络约 $20B，覆盖 Ethernet、InfiniBand 和光模块。同一家公司还拆出 AI 子层，称 2025
              年 scale-out 网络不含光模块应超过 $8B，AI 前端网络应超过 $5B。Dell’Oro 给出了不同但高度相关的口径：仅 Ethernet AI 后端交换机，五年累计销售额就可能接近
              $80B。这些数字在增长方向上相互一致，但不能直接对比，因为层级、时间跨度和纳入规则不同。Nexthop 真正可服务市场还应更窄：它的产品集聚焦 Ethernet 交换系统，不是纯光模块收入，不是只用
              InfiniBand 的集群，也不是超大规模云厂商可以自己搭的每一种内部平台。由此得到的是一个可用的尽调框架，而不是一个精确的 TAM 故事：宽口径 AI 网络很大且在增长，但 Nexthop
              可投资的切口，应建模为受限的、每年数十亿美元级别的一段，近期 SOM 则小得多。
