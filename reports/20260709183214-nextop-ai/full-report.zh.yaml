        - 驱动
        - 当前至 2030 年
        - 推动交换机换代、radix 提升和更高要求的拓扑选择
        - 核验 Nexthop 在 800G 和 1.6T 上的产品就绪度、软件成熟度和部署案例
      - - Ethernet 在 AI 后端网络中的份额提升
