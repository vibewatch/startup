companyProfile:
  summary: >-
    Nexthop AI 是一家位于 Santa Clara、由创始人主导的私营 B 轮公司，面向超大规模云厂商和 NeoCloud 的 AI 数据中心打造开放以太网交换系统。它的公开产品把客户定制硬件、客户自选 NOS
    支持、已验证互连，以及基于 SONiC 且有支持的 Nexthop NOS 组合在一起，因此更像共同开发型网络供应商，而不是封闭设备厂商。公开披露确认，公司从 2025 年 3 月 $110 million 的启动融资，快速走到
    2026 年 3 月估值 $4.2 billion 的 $500 million B 轮；但当前经营指标仍大多不透明。
