      - number: '2.3'
        title: 买方、用户与预算所有者
        blocks:
          - type: paragraph
            body: >-
              买方地图高度集中且多层。超大规模云项目里，技术评估者通常是网络架构、NOS 和 AI 基础设施团队，他们关心拓扑、缓冲、拥塞控制、NOS 兼容性、光链路验证和部署速度。日常操作者是实际运行 fabric 的网络
              SRE、平台或 AI 集群团队。经济付款方通常是中央基础设施资本开支负责人，而不是某个应用团队。NeoCloud 买方略有不同：创始人 CEO、CTO
              和基础设施负责人往往直接发起决策，项目融资或锚定客户合同会影响时间表。Alphabet、Meta、CoreWeave、Lambda 和 Crusoe 的公开文件与官方发布说明了这一点为何重要：AI
              基础设施预算巨大，合同跨多年，客户集中度很高。因此，Nexthop 不需要成千上万个小客户才有意义；但每个设计定点也都带来沉重的集中风险和漫长认证后果。
