      - number: '6.4'
        title: 集中度、采购与负面信号
        blocks:
          - type: paragraph
            body: >-
              最大客户风险不是 Nexthop 缺少明确目标细分，而是目标细分很小、要求很高且有周期性。可比公开文件显示，这类买方集合的集中度可以极端到什么程度：Arista 披露 Microsoft 和 Meta 分别占
              2024 年收入的 20% 和 15%，并警告订单时间取决于漫长评估、认证、验收和支出周期，大客户折扣会压迫毛利。这很重要，因为 Nexthop
              正追逐同样的账户结构，却更缺少多元化。外部负面来源也强化了采购摩擦。Flexential 的 2026 年调查称，网络问题、光纤稀缺、关税压力和政策不确定性正在延迟 AI 基础设施决策；AFL
              则指出，NeoCloud 运营商通常采购量更小、经济缓冲更薄、对供应商依赖更高。Sequoia 对 AI 资本开支的质疑又增加了二阶客户风险：如果 AI
              基础设施建设超过终端用户实际需求，一些买方可能推迟网络采购，或要求更苛刻的经济条件。换言之，少数大赢单可以改变 Nexthop 的轨迹，但同样的集中度也会让收入时间点、折扣和客户质量尽调成为投资案例的核心。
