      - number: '7.4'
        title: 执行缓释因素与否决标准
        blocks:
          - type: paragraph
            body: >-
              公开缓释因素存在，但多数只能部分缓释，不能扫清投资命题。Nexthop 融到的资金足以搭建关键职能，也发布支持和合规材料，并在 SONiC
              治理中有可见参与。这些都是实打实的正项。问题是，它们更多缓释运营可信度，而不是解决披露风险。投资案仍取决于管理层能否证明：出口和制裁控制已经落到运营流程里，开源合规有纪律，发布和安全流程成熟到足以服务风险敏感买方，狭窄的超大规模云厂商或
              NeoCloud 客户群能变成可重复收入且不被单一账户主导。实际应对方式是预先定义否决标准。如果出口规则收紧而公司拿不出稳健筛查流程；如果 Broadcom
              或光模块问题让某代平台延后；如果公开或私下客户证据不能拓宽；如果支持和发布证据仍然稀薄；或者下一轮融资在没有对应证明跃升的情况下，从 2026
              年估值重设条款，投资命题就应视为受损。这些条件可监测，不是含糊担忧，因此既能用于初始尽调，也能用于后续更新。
