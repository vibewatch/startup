      - number: '3.3'
        title: 切换成本、供应权力与替代路径
        blocks:
          - type: paragraph
            body: >-
              这个市场的切换成本，不只是把物理端口换掉，更在交换机周围的运营栈。已经用 Juniper 加 Apstra、Cisco 加 NX-OS 或 Nexus Dashboard、NVIDIA 加 InfiniBand
              的买方，都有工作流、遥测和支持模式带来的惯性。开放侧也一样：超大规模云厂商在 SONiC、FBOSS 或基于 OCP-SAI
              的内部工具上投入越多，封闭运营模式就越不吸引人。这也是内部自建路径为何是真实替代方案。Meta 的 DSF 披露显示，一个基于 FBOSS 和 OCP-SAI 的解耦开放 fabric；SONiC
              则把自己定位为可跨多个厂商和 ASIC 生产运行。供应商杠杆是另一项结构性成本驱动。Broadcom 的交换芯片组合，以及 Celestica 和 Edgecore 基于 Broadcom
              的设计说明，商用芯片是一大块开放 Ethernet 市场底下真正的基底。这会削弱任何单一新进入者的硬件独特性，把尽调重心从裸交换吞吐量转向供应分配、光链路验证、软件打磨和按客户定制的支持。
