      - number: '3.4'
        title: 差异化耐久性与负面证据
        blocks:
          - type: paragraph
            body: >-
              负面证据并不说明 Nexthop 没有切口；它说明这个切口比简单的带宽图更窄，也更依赖执行。Arista、Cisco、Juniper-HPE 和 NVIDIA 都已加速公开 AI
              网络项目，买方因此越来越能从装机基础大得多的既有厂商那里，买到相似拓扑、拥塞功能，以及 800G 或 1.6T 过渡能力。商用芯片 ODM 让商品化问题更尖锐，因为可比的原始硬件会先进入渠道，而 Nexthop
              还来不及靠规模或分销守住自己。Fierce Network 的报道补上一条有用约束：Ethernet 可能在增份额，但 InfiniBand
              仍保留训练负载优势，因此替代集合并没有坍缩成一个标准。结果是，Nexthop 的护城河论点应建立在账户级定制、开放 NOS
              可信度、光模块和验证工作，以及异常快速的客户共同开发上，而不是专有锁定或标题级端口数。公开证据在实际定价、具名生产客户转化和迁移经济性上仍有重大缺口，因此护城河耐久性可信但尚未证明。
