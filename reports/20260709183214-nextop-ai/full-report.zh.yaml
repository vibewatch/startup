        - 公开市场溢价可能被上游芯片和平台拿走
        - Broadcom 和 NVIDIA 显示稀缺性经济会在哪儿沉淀，系统厂商可能只剩更低的结构性利润率
        - 需要证明 Nexthop 不只是商用芯片组装，还能赚到溢价
