      - number: '8.3'
        title: 场景视角与可比范围
        blocks:
          - type: paragraph
            body: >-
              场景框架应保持方向性，因为收入和毛利率数据缺失时，假精确比有用更危险。牛市情形下，Nexthop 证明今天的产品和客户信号只是更大业务的前沿：披露收入足以支撑溢价倍数，客户广度超出极少数旗舰账户，AI 网络需求如
              650 Group、IDC 和 Dell’Oro 预期继续扩宽。在那个世界里，当前标价可能显得早。基准情形没那么戏剧化，但仅凭公开证据更可信：需求保持健康，但 Nexthop
              仍需要时间证明广度、利润率和可重复性，估值留在上一轮附近或略低。熊市情形则是经典压缩故事。如果 AI
              资本开支建设跑在变现前面，一两个大型部署延误，或下一轮附带更硬的投资者保护，当前标价可能迅速重设。可比表也应带着同样的谦逊阅读。Arista 是最干净的网络可比；Cisco 和 HPE
              给出低倍数的多元化下限；Broadcom 和 NVIDIA 显示上游能吃到多少溢价；Groq 则说明，当落地商业证据更强时，私营 AI 基础设施资本仍能以高价成交。
