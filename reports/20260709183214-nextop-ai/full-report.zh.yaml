            body: >-
              关键法律风险，不是 Nexthop
              今天已经背着公开执法污点；而是公司正在进入监管制度密集的市场，却没有展示多少公开控制体系。官网已经更新隐私和条款页面，比没有任何法律界面更好，但这些页面讲的是网站使用和个人数据处理，不是出口合规、产品安全治理、保修安排或买方级合同承诺。外部规则也真实存在，并且还在变化。2025
              年 1 月 BIS AI 扩散框架，以及 2025 年 5 月撤销并转向指导的变化，说明 AI 相关硬件出口商即便在规则文本演进时，也要承担现实合规负担。OFAC
              自身工具强化了制裁筛查责任；贸易法评论也显示，即使硬件没有直接运往明显受限市场，客户住所地和控制权问题也可能重要。Nexthop 对 SONiC 的依赖又加了一层法律问题。基金会治理、Apache 许可和
              Linux 衍生组件，让开源尽调成为硬要求；如果公司分发修改后的软件镜像，尤其如此。已审阅来源没有发现针对公司的 SEC、CFTC
              或公开联邦案卷行动，但这一空白反映的是私营公司信息不透明和经营历史短，不是合规暴露面低风险的证明。
