    summary: 主要下行路径从出口、依赖和部署摩擦传导到收入确认节奏、利润率、融资，最终影响估值支撑。
    approximationNotes: 该 DAG 反映公开材料证明的因果路径；它只表示方向，不量化概率或时间滞后。
    data:
      nodes:
        - id: export
          label: 出口与制裁合规
        - id: supply
          label: Broadcom 与光模块供应
        - id: security
          label: 安全与发布透明度
        - id: customers
          label: 客户集中度与验证
        - id: sites
          label: 电力 / 光纤 / 场地就绪
        - id: revenue
          label: 收入确认节奏
        - id: margin
          label: 毛利率
        - id: support
          label: 支持工作量
        - id: financing
          label: 融资需求
        - id: valuation
          label: 估值支撑
      edges:
        - from: export
          to: revenue
          label: 出货审批推迟订单
        - from: supply
          to: revenue
          label: 产品就绪或分配延误
        - from: supply
          to: margin
          label: 成本或组合压力
        - from: security
          to: customers
          label: 买方信任与尽调放慢
        - from: customers
          to: revenue
          label: 少数账户主导签单节奏
        - from: sites
          to: revenue
          label: 客户部署后移
        - from: customers
          to: support
          label: 高接触账户增加服务负荷
        - from: support
          to: margin
          label: 服务强度抬高服务成本
        - from: revenue
          to: financing
          label: 现金转化放慢
        - from: margin
          to: financing
          label: 烧钱加剧
        - from: financing
          to: valuation
          label: 下一轮条款重置预期
    claimRefs:
      - CR010
      - CR021
      - CR030
      - CR031
      - CR035
      - CR039
      - CR041
      - CR045
      - CR046
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Nexthop 的公开技术栈依赖商用芯片、SONiC 治理、ONIE、第三方互连，以及公司无法直接控制的客户现场就绪程度。
    approximationNotes: 该图只纳入公开证据可见的依赖；未披露的制造、分销和私有云伙伴关系未展示。
    data:
      nodes:
        - id: nexthop
          label: Nexthop 集成核心
        - id: broadcom
          label: Broadcom 芯片路线图
        - id: sonic
          label: SONiC Foundation 与 Linux 栈
        - id: onie
          label: ONIE / OCP 预置
        - id: optics
          label: 光模块与线缆供应商
        - id: regulators
          label: BIS 与 OFAC 规则体系
        - id: sites
          label: 客户电力与光纤可用性
        - id: buyers
          label: 超大规模云厂商与 NeoCloud 客户
      edges:
        - from: nexthop
          to: broadcom
          label: 平台能力和节奏取决于 ASIC 路线图
        - from: nexthop
          to: sonic
          label: NOS 兼容性与安全节奏
        - from: nexthop
          to: onie
          label: 启动调试与预置流程
        - from: nexthop
          to: optics
          label: Layer-1 验证与供应
        - from: regulators
          to: buyers
          label: 筛查可能缩小合格交易对手范围
        - from: buyers
          to: sites
          label: 场地就绪决定部署节奏
        - from: sites
          to: nexthop
          label: 客户延误会回流到收入确认节奏
        - from: buyers
          to: nexthop
          label: 少数大客户塑造路线图和支持需求
    claimRefs:
      - CR018
      - CR019
      - CR026
      - CR027
      - CR028
      - CR029
      - CR031
      - CR042
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议维持「跟踪」，因为真实的市场和产品信号被估值溢价、KPI 不透明以及宏观压缩风险抵消。
    approximationNotes: 该流程是定性判断，并非概率模型；它映射截至 2026-07-09 保留的公开证据所指向的决策链。
    data:
      nodes:
        - id: market
          label: 需求：AI 网络仍在扩张
          detail: 650 Group、IDC、Dell’Oro、Cisco 和 HPE 都指向 AI 网络投资仍在继续
          type: input
        - id: proof
          label: 验证：产品露出 + 强势投资团
          detail: Nexthop 有真实发布、面向超大规模云厂商的定位，以及蓝筹 Series B
          type: input
        - id: gaps
          label: 缺口：无公开收入、利润率、客户广度或留存数据
          detail: 从公开记录看，当前估值无法按常规方法承销
          type: process
        - id: comps
          label: 可比现实：最接近的可比公司要么大得多，要么结构不同
          detail: Arista 最接近；Cisco/HPE 是较低倍数下限；Broadcom/NVIDIA 在上游拿走更丰厚的经济性
          type: process
        - id: macro
          label: 宏观风险：资本开支和倍数压缩可能重置私募估值
          detail: Sequoia、Futurum 和 arXiv 都强调，节奏和变现仍然关键
          type: process
        - id: rec
          label: 建议：跟踪；缺少新 KPI 证据时，$4.2B 偏贵
          detail: 只有在价格纪律更严、下行保护到位或证据显著改善时才推进
          type: output
      edges:
        - from: market
          to: proof
          label: 支撑机会
        - from: proof
          to: gaps
          label: 无法填上 KPI 缺口
        - from: gaps
          to: comps
          label: 迫使按可比公司约束
        - from: comps
          to: rec
          label: 溢价需要证据支撑
        - from: macro
          to: rec
          label: 增加下行偏斜
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV033
      - CV037
      - CV044
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 示意性公允价值敏感性显示，收入证据和客户广度可以增值，但倍数压缩和强约束融资条款也能很快抹掉增量。
    approximationNotes: 柱形展示相对于粗略 $3.5B 当前证据锚点的方向性估值变化（$M）；这些变化不可相加，只用于说明少数关键承销变量的杠杆。
    data:
      items:
        - label: 收入披露支撑溢价情景
          value: 900
        - label: 客户广度超出旗舰客户
          value: 600
        - label: 利润率证据显示硬件经济性有溢价
          value: 700
        - label: AI 基础设施倍数压缩
          value: -900
        - label: 单一账户集中度显现
          value: -700
        - label: 下一轮带有强下行保护
          value: -800
    claimRefs:
      - CV033
      - CV037
      - CV038
      - CV041
      - CV043
      - CV047
      - CV048
      - CV049
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 熊市、基准和牛市区间显示，只有 Nexthop 填上 KPI 缺口的速度快过市场压缩板块叙事，上一轮估值才守得住。
    approximationNotes: 区间为分析师基于公开证据、情景假设和可比倍数逻辑给出的 $M 估计，并非完整 DCF 或股权结构瀑布。
    data:
      items:
        - label: 熊市情景——压缩或融资重置
          low: 1500
          high: 2500
          unit: $M
        - label: 基准情景——需求健康，证据缺口仍在
          low: 3000
          high: 4500
          unit: $M
        - label: 牛市情景——规模证据填上缺口
          low: 6000
          high: 8500
          unit: $M
    claimRefs:
      - CV037
      - CV040
      - CV041
      - CV047
      - CV048
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 式评分显示，市场和产品叙事很强，但经济性和客户广度披露不足，估值支撑偏弱。
    approximationNotes: 评分采用 1-5 的编辑部尺度，基于截至 2026-07-09 保留的公开证据；并非管理层提供的 KPI。
    data:
      items:
        - label: 市场需求
          value: 4
          unit: /5
          note: 市场数据和既有厂商更新都显示，AI 网络需求信号仍然强劲。
        - label: 产品可信度
          value: 4
          unit: /5
          note: 公开发布和客户定位证据表明，产品供给真实存在。
        - label: 客户验证
          value: 2
          unit: /5
          note: 已有出货表述，但缺少分母数据和广泛客户背书。
        - label: 经济性透明度
          value: 1
          unit: /5
          note: 目前没有公开收入、毛利率或留存数据集。
        - label: 估值支撑
          value: 2
          unit: /5
          note: 最接近的可比公司能框定溢价，却不能直接验证本轮估值。
        - label: 风险控制
          value: 2
          unit: /5
          note: 资本开支周期、集中度和融资条款风险仍然很高。
        - label: 退出清晰度
          value: 1
          unit: /5
          note: 公司公开披露还不够，尚不足以支撑 IPO 式价格发现。
    claimRefs:
      - CV004
      - CV009
      - CV010
      - CV037
      - CV042
      - CV045
      - CV046
