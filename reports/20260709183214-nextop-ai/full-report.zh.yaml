  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Nexthop 的公开分层有意做得很窄。公司不面向通用企业交换买方营销；它自己的首页、发布材料和投资人文章反复把可服务客户群定义为运行大型 AI 和云数据中心 fabric 的超大规模云厂商和
              NeoCloud。在这个细分里，付款账户通常是基础设施或平台预算所有者，运营买方是网络架构或云工程团队，日常用户则是网络 SRE、集群运营和 AI 基础设施团队，他们关心部署速度、能效、开放 NOS
              支持和生命周期可管理性。客户类型的公开拆分也有意义。超大规模云账户被描述为定制、共同开发的 JDM 项目，让买方指定硬件并保留自己偏好的 SONiC 或 FBOSS 衍生软件路径；NeoCloud
              则被描述为更成套的买方，可以采用加固版 Nexthop NOS。外部市场背景支持这套分层：Cisco 和 AFL 都把 NeoCloud
              描述为一个独立买方类别，其经济和运营约束不同于超大规模云厂商。仍缺失的是按地域、账户数和收入区间的基础披露，因此公开分层在买方工作流上很强，在组合广度上较弱。
