        - 压力测试收入集中度，并要求证明生产利用率和续约行为
    notes: 同一个因素既可能是驱动，也可能是刹车：AI 紧迫性拉动更好 fabric 的需求，但电力、光模块和 ROI 约束决定需求何时转成已出货系统。
