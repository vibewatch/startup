      - number: '4.4'
        title: 公开进展缺口与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Nexthop 的公开财务叙事主要由融资事实和仍缺失的信息主导。公司披露了启动时 $110 million，以及估值 $4.2 billion 的 $500 million B 轮，因此已披露股权资本合计
              $610 million。B
              轮发布还称，这笔资金将围绕产品组合扩展研发和基础设施能力。除此之外，可见度急剧下降。审阅过的官方披露没有给出当前收入、ARR、客户数、员工数、订单额、积压订单、现金余额、现金消耗、毛利率、CAC、回本期或
              NRR，也没有识别出公开债务或项目融资层。这意味着，资本充足性只能方向性讨论。对创业公司而言，$610 million 是很大的资金池；但当模式包含硬件认证、NBD
              备件池、漫长账户周期，以及很可能进入供应受限的光模块和商用芯片市场的库存承诺时，它并不自动等于资本过剩。一个简单情景带显示，如果月度现金消耗最终大致跑到 $10 million 到 $25
              million，仅已披露股权就意味着约两到五年的资金续航，前提是不发生营运资本冲击。由于实际现金消耗仍是私有信息，这个区间只是分析镜头，不是结论。
