      - number: '5.4'
        title: 信任控制、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              审阅过的信任表面，在硬件层最强，在企业软件层最弱。公开规格表显示三款可见交换平台都有 TPM 2.0，NH-5010 明确记录其高速端口支持线速 802.1AE MACsec，安全或合规指南加规格表也发布了
              Class A 和区域监管通知。支持中心还列出安全公告和生命周期通知，这比没有任何公开质量信号更好。但这些正面点并不能拼成全面的安全姿态。2026 年 4
              月隐私政策是网站数据处理通知，不是产品安全认证。审阅来源没有提供公开 SOC 2 或 ISO 27001 范围声明、安全启动或证明链叙事、SBOM、CVE
              或事件台账，也没有具名制造和供应链披露。最有意思的基准和发布资料甚至也被登录门控。因此，正确尽调姿态是：接受那些被直接记录的具体硬件和工作流主张，但在管理层提供私下证据之前，对未经支持的功耗、部署和架构经济性说法打折。Nexthop
              最大的产品风险并不是交换机是否存在，而是公司能否在产品组合扩张时，持续守住发布质量、供应商韧性和企业信任。
