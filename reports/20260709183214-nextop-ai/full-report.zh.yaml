      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              现有 GTM 证据指向经典的高接触基础设施销售动作，而不是可规模化自助服务或广泛渠道模式。Nexthop 的语言瞄准超大规模云厂商、NeoCloud
              和大型运营商，这通常意味着账户少、评估周期长、合同金额大、售前工程很重。本次审阅的官方表面没有公开定价、在线配置和下单路径，或公开的合作伙伴融资名单。相反，它展示的是支持门户、联系驱动的互动和硬件文档，更符合企业采购而不是网页转化。销售效率因此很关键：CAC、回本期和新客户获取速度取决于账户级设计定点和认证成功，而不是需求生成量。公开可比公司也强化了这份负担。Cisco
              与 NVIDIA 和全球合作伙伴生态一起营销 AI 参考架构；HPE 和 Juniper 现在则带来数十亿美元级网络收入和成熟销售覆盖。Nexthop 仍可能靠定制和开放 NOS
              灵活性赢单，但公开证据指向一种劳动密集型销售动作，其效率指标是私有且未披露的。
