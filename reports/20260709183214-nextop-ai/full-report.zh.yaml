        title: 收入模式、定价与确认
        blocks:
          - type: paragraph
            body: >-
              Nexthop 的公开商业图景足以识别收入模式，但不足以衡量收入质量。官方材料显示，公司把硬件、软件和支持组成一个栈，卖给数量很少的大型 AI 基础设施账户。公司称自己打造客户定制系统，提供加固 NOS
              支持和预先测试的互连；2026 年 3 月发布还补充说，产品组合覆盖现货产品和高度定制的 JDM 项目。这一组合指向至少四条变现路径：标准交换平台、定制硬件设计定点、软件和 NOS
              使能，以及付费支持或替换服务。缺失的恰好是投资人真正承销的部分：公开标价、实际 ASP、支持附着率、折扣政策、收入组合和具体会计政策。Arista
              的文件是有用参照，因为它显示类似硬件厂商如何把已确认产品收入与按期确认的支持收入分开，并在验收期或试用存在时递延收入。Nexthop 的支持 SKU
              和定制部署意味着类似确认复杂性也很可能存在，尽管公司尚未公布政策。
