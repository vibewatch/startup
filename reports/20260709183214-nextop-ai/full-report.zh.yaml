      - number: '1.2'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              公开领导层叙事几乎都围绕创始人兼 CEO Anshul Sadana 展开；公司、投资人和媒体都会提到他曾任 Arista Networks
              COO。这个创始人与市场的匹配是真实的：公司的产品定位、超大规模云厂商共同开发模式，以及投资人热情，都倚重 Sadana 在云网络领域的声誉。但公开组织图也说明，Nexthop
              不只是一个人的故事。领导层页面列出了硬件、软件、产品、客户工程、财务和供应链高管；董事和顾问层又通过 Ita Brennan、Sureel Choksi、Guru Chahal 和 Dave Maltz
              增加外部可信度。Ryan Torres 代表 Nexthop 进入 SONiC Governing
              Board，也进一步强化治理可信度。尽调保留意见在于，私营公司披露有选择性：本次审阅的公开来源没有披露持股比例、完整董事会构成细节，或有日期的内部领导层变动记录。因此，外部画像支持公司具备职能深度，但仍指向
              Sadana 周围明显的关键人集中。
