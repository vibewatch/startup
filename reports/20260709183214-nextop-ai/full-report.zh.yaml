      - number: '4.3'
        title: 成本结构、毛利驱动与营运资本
        blocks:
          - type: paragraph
            body: >-
              公开证据对成本驱动的支持，远强于对实际经济性的支持。三份 Nexthop
              规格表和支持中心显示，公司承担了明显的硬件和服务复杂度：多千瓦功耗包络、替换物流、软件生命周期支持和企业级工单管理。成熟可比公司解释了这为何重要。Arista 的 10-K
              称，产品成本流经合同制造商、商用芯片供应商、货运、库存管理和供应链运营；它还显示，客户试用、验收期和支持合同会同时推高库存和递延收入。对 Nexthop 这样的创业公司而言，这些不是抽象会计问题。McKinsey
              的光模块供应研究显示，800G 和 1.6T 组件会多年维持供应紧张，从而增加提前采购、安全库存和认证库存的概率。供应商权力是另一项毛利约束。Broadcom 和 NVIDIA 说明，AI
              时代的价值捕获可能位于半导体层很高的位置；HPE 和 Arista 的公开业绩则显示，系统厂商经济性更健康，但明显更低。净结论是，Nexthop
              未来毛利率不仅取决于技术差异化，也至少同样取决于议价能力、支持附着率和库存纪律。
