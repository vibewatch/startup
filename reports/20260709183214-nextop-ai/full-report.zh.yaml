      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              驱动因素是真实的。AI 集群正快速走向 800G 和 1.6T fabric；Ethernet 在 AI 后端网络里拿到更多份额；超大规模云厂商和 NeoCloud 继续投入大额预算；SONiC、UEC 等开放
              NOS 标准降低了采用解耦多厂商交换的概念门槛。这些条件能为 Nexthop 这样的公司打开真实设计定点窗口，尤其是在客户需要定制系统、开放软件灵活性或成套 NeoCloud 路径时。但约束对估值同样重要。在以
              NVIDIA 为中心的集群里，InfiniBand 仍有分量；最大型运营商的自研路径仍强；电力系统可能比数据中心建设滞后多年。Uptime 和 IEA 都把电力指向硬性的时间约束；McKinsey 则强调
              800G 和 1.6T 光模块短缺，即使预算获批，也可能拖慢建设。Sequoia 对 AI
              资本开支的怀疑补上最后一层提醒：市场可能仍然很大，但如果利用率和终端用户变现不及预期，买方会突然放慢订单。可投资结论是，Nexthop
              受益于强结构性市场，但实际收入路径会被认证、供应就绪度，以及买方是否偏好它的切口而非内部或现有厂商替代方案所卡住。
