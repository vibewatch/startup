  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与直接对手类型
        blocks:
          - type: paragraph
            body: >-
              Nexthop 并不是在空白市场竞争。公开视野里的直接具名对手已经包括 Arista、Cisco、Juniper-HPE 和 NVIDIA，它们都围绕同一个买方问题，推出了 AI 专用网络 fabric
              或软件。Arista 的 Etherlink 系列、Cisco 的 Nexus 和 AI POD 栈、Juniper 的 QFX 加 Apstra 自动化，以及 NVIDIA 的 Spectrum-X
              Ethernet，都在解决同一个核心需求：在 800G 和 1.6T 时代的集群里，借助高端口扇出、拥塞控制和部署工具搬运 AI 流量。替代范围还要更宽。Broadcom 的商用芯片层支撑了品牌 OEM
              之下许多开放交换替代方案；Celestica 和 Edgecore 已经公开 51.2T 和 102.4T 系统，规格范围与 Nexthop
              的公开参数重叠。内部自建也不是理论选项。SONiC、FBOSS、OCP-SAI 和 ESUN 说明，大型运营商可以组合多个硬件厂商和开放 NOS 栈，而不必标准化到一个专有 fabric
              上。因此，本章的竞争视角必须同时纳入直接公开对手、既有厂商、商用芯片生态、ODM 和 JDM 替代方案，以及客户自建的现状路径。
