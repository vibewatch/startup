        - 最接近的上市以太网交换网络可比标的，且有真实 AI 网络敞口
        - 规模大得多、已盈利且披露充分；不是初创硬件公司的风险画像
      - - Cisco
        - 上市多元化网络平台
        - 市值约 $463.0B；最新公开 P/S 快照约 5.11x
        - 一旦故事变成多元化基础设施，低倍数结果可参照 Cisco
        - 软件、安全和服务收入组合让它与年轻硬件厂商可比性更弱
      - - HPE
        - 上市混合云和网络厂商
        - 市值约 $59.7B；最新公开 P/S 快照约 0.86x
        - 显示传统基础设施公司可能以低收入倍数交易
        - 网络只是更广企业产品组合的一部分
      - - Broadcom
        - 上市 AI 和网络芯片平台
        - 市值约 $1.797T；最新公开 P/S 快照约 22.92x
        - 当稀缺性落在芯片上，高端 AI 倍数会沉淀在那里
        - 不是系统厂商可比公司，经济性结构上更丰厚
      - - NVIDIA
        - 上市计算和 AI 网络平台
        - 市值约 $4.84T；最新公开 P/S 快照约 20.77x
        - 显示全栈 AI 平台如何支撑极高市值
        - 远不止网络业务，不是干净的硬件交换机参照
      - - Groq
        - 私有 AI 基础设施融资轮
        - 2025 年融资轮，投后估值 $6.9B
        - 当使用证据更强时，可作为基础设施叙事如何定价的私募市场参照
        - 推理计算公司，不是直接的网络硬件同行
    notes: 使用市值和最新可得公开 P/S 快照，而不是统一口径 EV/NTM 倍数；本表是方向锚点，不是精确估值模型。
