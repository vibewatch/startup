      - number: '7.3'
        title: 商业、财务与客户风险
        blocks:
          - type: paragraph
            body: >-
              商业下行异常集中，因为 Nexthop 仍是一家年轻私营公司，向极少数巨型账户销售，却已经背着 $4.2B 估值。公开需求信号是支撑项：超大规模云厂商的 AI 资本开支仍然巨大，Nexthop
              的产品发布也明确瞄准确实会大规模采购的买方。但这不能抵消集中度风险，反而会放大它。Arista 的 10-K 说明，即便规模大得多、业务更分散的网络公司，也可能从两个超大规模云厂商客户拿到 35%
              收入，并承受漫长的认证和验收周期。Nexthop 公开的基数数据比 Arista
              更少。公司不披露客户数、头部账户占比、留存指标或收入；最强证据仍来自发货表述、技术引用和目标账户叙事，而不是广泛具名的量产客户名单。这个证明缺口很重要，因为当前私募估值已经假设公司会取得可观执行成功。Sequoia
              对 AI 支出的批评，以及更广泛的电力或部署瓶颈，都说明如果终端需求落后于资本开支建设，行业热情可能很快转成更艰难的采购节奏和融资账。简言之，品类仍有吸引力，但 Nexthop
              的具体回报曲线仍可能被一个账户推进失速、一个站点延误，或一轮更苛刻的融资击中。
