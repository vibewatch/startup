    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Nexthop AI 把自己定位为一家 Santa Clara 的网络硬件和系统公司，专为 AI 数据中心建设周期而生。从启动材料、产品页面到投资人文章，公司反复强调的模式是：为全球最大云厂商定制
              Ethernet 交换，并配合买方本来就想运行的网络操作系统。这个定位很关键，因为 Nexthop 不是先卖通用企业交换机组合、再事后改给 AI
              用；它想拿下的是硬件设计、光链路验证、拥塞控制和操作系统集成都要贴合超大规模云厂商要求的项目。到 2026 年 3 月，公开栈已经包括三个交换机系列、对 SONiC 和 FBOSS 的支持，以及面向
              NeoCloud 买家的 Nexthop NOS 支持版。官网也从基础启动页扩展到支持、文档和软件发布界面；即便当前收入、当前客户数和当前员工数仍未披露，这仍是一个有用的运营信号。
