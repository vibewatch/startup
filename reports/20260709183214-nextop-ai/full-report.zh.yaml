            body: >-
              在 Nexthop 的公开记录里，融资是最清晰、也最容易外部验证的规模信号。公司 2025 年 3 月走出隐身期，完成 Lightspeed 领投的 $110 million 融资；一年后又以 $4.2
              billion 估值完成超额认购的 $500 million B 轮，仍由 Lightspeed 领投，Andreessen Horowitz 成为主要新投资人，Altimeter
              与既有股东一同参投。这意味着约一年内，公开披露的融资至少达到 $610 million；即便收入还不可见，这也足以支撑大规模工程和供应链搭建。产品发布材料还称，截至 2026 年 3
              月，公司已经向领先超大规模云厂商出货；这个方向性信号很重要，因为它暗示项目已不只是设计阶段。缺口在经营透明度：本次审阅的公开来源没有披露当前收入、ARR、毛利率、客户数、当前员工数、债务安排或任何二级股份交易。因此，更合适的判断是：Nexthop
              当前资金充足，商业化在推进，但披露仍很轻。
