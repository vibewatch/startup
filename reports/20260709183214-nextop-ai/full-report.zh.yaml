  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资判断框架
        blocks:
          - type: paragraph
            body: >-
              估值问题不在 Nexthop 所处品类是否有吸引力，而在 2026 年 3 月价格是否已经折现过多成功。公开证据让机会看得懂：公司有真实产品界面，瞄准仍在重金投入 AI 网络的超大规模云厂商和
              NeoCloud，并以公开口径 $4.2B 估值吸引了顶级 Series B
              投资财团。这些都是有分量的正项。但它们没有解决核心投资判断问题。公司仍不披露当前收入、毛利率、客户数或留存指标，所以公开记录无法判断本轮定价买的是快速扩张的业务，还是仍高度集中的硬件项目。公开可比公司有助于框住纪律。Arista
              拿到溢价倍数，但前提是有公开规模和可见毛利率。Cisco 和 HPE 显示，多元化基础设施很快会以更低收入倍数交易；Broadcom 和 NVIDIA 则显示，最丰厚的 AI
              基础设施溢价常常流向上游。实际结论是跟踪，而不是买入：保持接触，但没有更好的 KPI 证明或更好的下行结构前，不要按上一轮标价投资。
