  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Nexthop 并不是把单个交换机 SKU 当成产品。审阅过的公开表面描述的是一套与客户共同开发、面向超大规模云厂商和 NeoCloud 的 AI 数据中心网络系统：按 fabric 角色划分的硬件平台、多条
              NOS 路径、预认证光模块和线缆，以及用于发布和支持的运营界面。放到客户工作流里，它要完成的任务是：让云买方选择合适的 scale-out、前端或 scale-across
              形态，保留自己偏好的网络软件栈，更快认证光模块，然后把结果接入运营商既有部署流水线，而不是采纳封闭设备模式。这个框架很重要，因为它解释了 Nexthop 为何几乎像强调原始吞吐量一样强调 SONiC、FBOSS
              兼容性、BYoNOS 和 BYoSAI。最强的产品证明来自可见模块包装：面向 AI fabric 的 4000 和 4200 系列系统，面向深缓冲 scale-across 或 DCI 角色的 5000
              系列，从社区 SONiC 到 Nexthop NOS 的软件选项，以及聚焦 Layer-1
              验证的光模块和线缆层。工作流故事最弱的一环是，公司仍不披露具名超大规模云客户、详细支持矩阵，以及可独立审计的证据来证明其部署速度和功耗收益能在自家材料之外成立。
