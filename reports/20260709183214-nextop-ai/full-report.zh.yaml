      - number: '7.2'
        title: 运营、安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Nexthop 已经足够真实，值得认真对待；但透明度还不够，不能排除执行风险。支持中心、硬件文档页、安全指南和 2026 年站点地图活动，都说明公司已不只是概念
              PPT。同时，最有价值的尽调材料仍然稀薄，或需要权限才能看到。公开发布页没有呈现丰富的安全或变更历史；已审阅公司页面也没有暴露漏洞披露计划、SBOM 或第三方审验范围；公开文档集明显更完整地覆盖 4000 和
              5000 系统，新推出的 4200 产品线资料更少。依赖栈同样关键。Broadcom 的 Tomahawk 5 和 6 路线图支撑了可见性能边界，而 SONiC、ONIE 和外部光模块认证都不在 Nexthop
              单方控制之内。这套架构对超大规模云厂商买方有商业逻辑：它保留开放 NOS 可移植性；但也意味着 Nexthop 的差异化要靠执行、验证和支持质量，而不是自有 ASIC
              或封闭操作系统。最后，客户现场准备度也是运营依赖：电力、光纤和关税摩擦，即使产品和设计定点在技术上已经就绪，也可能拖慢部署。
