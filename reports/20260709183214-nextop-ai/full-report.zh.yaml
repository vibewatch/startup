      - 买方 / 用户 / 付款方
      - 主要使用场景
      - 规模 / 战略价值
      - 公开证据
      - 关键缺口
    rows:
      - - 超大规模云厂商定制 JDM 账户
        - 买方 = 网络 / 平台负责人；用户 = 网络架构、SRE、AI 集群团队；付款方 = 中央基础设施资本开支
        - 面向横向扩展、跨集群和前端 AI 集群的定制以太网 fabric，同时保留买方自选 NOS
        - 账户少、ACV 很高，具备战略设计导入潜力
        - 官方发布和隐身亮相材料反复描述面向超大规模云厂商的定制解决方案
        - 没有公开具名超大规模云厂商清单、地域组合或头部客户收入占比
      - - NeoCloud 交钥匙运营方
        - 买方 = 云平台 / 基础设施负责人；用户 = 运营团队；付款方 = AI 云建设预算
        - 交换机交钥匙方案 + 加固的 Nexthop NOS，服务想更快部署并获得支持的运营方
        - 单个客户小于超大规模云厂商，但目标群体增长快
        - 2026 年 3 月产品发布和 Series B 新闻稿明确把 NeoCloud 方案与超大规模云厂商定制打法分开
        - 未获取到具名 NeoCloud 客户引用或生产案例
      - - 专用 AI IaaS / 保证容量型 NeoCloud
        - 买方 = 云基础设施业主；用户 = GPU 机群和服务交付团队；付款方 = 签约 AI 云的资本 / 运营开支预算
        - 固定期限或专用 AI 基础设施，提供保证容量
        - 若设计导入落地，可能带来多机架或园区级网络需求
        - Cisco 的 NeoCloud 分层把专用 AI IaaS 列为独立服务模式
        - 没有公开证据显示 Nexthop 已将该分层转化为披露客户
      - - 公有 AI 云 / 突发容量提供商
        - 买方 = 产品 / 运营负责人；用户 = 面向租户的平台团队；付款方 = 使用量驱动的平台预算
        - 共享 GPU 池和弹性 AI 云服务，部署速度和供应能力是关键
        - GPU 池扩张时，可产生重复硬件需求
        - Cisco 和 AFL 都把快周转、高利用率的 AI 云运营方描述为增长中的买方类别
        - 需求存在，但 Nexthop 自身胜率和扩张数据仍是私有
      - - 电力优势或改造基础设施型 AI 运营方
        - 买方 = 园区或基础设施开发商；用户 = 数据中心和网络运营团队；付款方 = 项目融资 + 基础设施预算
        - 以电力为牵引的 AI 园区，需要韧性的 DCI、光纤和模块化横向扩展设计
        - 是跨集群 / DCI 产品的有用邻接，但运营风险更高
        - AFL 和 Flexential 强调电力、光纤和场址限制是主要决策因素
        - 没有证据把 Nexthop 公开连接到任何具体运营方、园区或地域
    notes: 各行把公开目标账户原型与已披露客户证据分开；战略价值指可能的合同重要性，不是已验证收入。
