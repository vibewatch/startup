      - - 开放 NOS 和供应商多元化需求
        - 驱动
        - 当前
        - 给兼容 SONiC 或 FBOSS 的解耦系统留出空间
        - 追问目标账户是否坚持开放 NOS、内部控制或软件可选性
      - - NeoCloud 扩张和融资型 AI 工厂
        - 驱动
        - 当前至 2028 年
        - 在最大 hyperscaler 之外增加买方，并可能加速交钥匙需求
        - 梳理哪些 NeoCloud 直接购买交换机，哪些购买打包平台
      - - 既有厂商和内部自建替代
        - 约束
        - 当前
        - 即便市场增长，也会压缩厂商可争取的切入空间
        - 对标 Arista、Cisco、NVIDIA 生态，以及内部 OCP 或 FBOSS 路径
      - - 准入周期和支持负担
        - 约束
        - 当前
        - 把庞大的理论市场压成小得多的可服务市场
        - 要求提供试点到量产时间线、支持人员配比和故障修复义务
      - - 电力可用性和电网交付周期
        - 约束
