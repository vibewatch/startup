              从 Nexthop 2025 年 3 月发布到 2026 年 3
              月产品和融资公告，公开采用故事明显改善，但仍达不到传统的具名客户名单。最强的类生产表述，是公司明确称新发布的平台和软件已经向领先超大规模云厂商出货。最强的协作信号，是披露 Disaggregated Spine
              与一家大型超大规模云厂商共同开发。最强的具名参考，是 Azure Networking 的 Dave Maltz 在发布引语中称赞 Nexthop 的开放网络工作和客户成功；Microsoft 自己的资料页也确认
              Maltz 负责 Azure Networking 工程和 SONiC 固件开发。这些是有意义的信号，因为它们暗示与严肃运营商存在真实接触；但它们不等同于公开声明 Microsoft
              或任何其他超大规模云厂商是付费生产客户。因此，本章核心判断是：Nexthop
              已经跨过从纯概念到可信客户互动和至少部分出货活动的门槛，但公开证明仍集中在一个具名技术参考、一次未具名大型超大规模云厂商协作，以及一条泛化出货声明上。没有任何抓取来源提供客户撰写的部署文章、采购记录、公开合同，或对具名生产账户有结果细节的案例研究。
