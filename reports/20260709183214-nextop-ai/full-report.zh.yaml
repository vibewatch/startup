            body: >-
              时间线很短，但信息密度高。公司可追溯到 2024 年创立，2025 年 3 月出现公开网页，2025 年 3 月 25 日正式发布，确立了首个融资财团，也披露了第一组多地点布局。下一次主要公开爆发出现在 2026
