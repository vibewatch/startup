  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              定义 Nexthop AI 的市场，最清晰的方式不是把它放进所有交换机，也不是所有 AI 基础设施。Nexthop 的公开产品和发布材料，把公司放在 AI 数据中心网络的一段：买方需要用于
              scale-out、scale-across 和前端 fabric 的 Ethernet 交换系统，通常还要开放 NOS 灵活性和一定程度的定制。这个边界很关键，因为市面上流通的宽口径 AI 网络数字，常把
              Ethernet 交换机、InfiniBand fabric 和光模块打包；一些乐观叙事还会进一步模糊到更大的 AI 云基础设施故事里。现状替代方案也很强。买方可以继续采购 Arista、Cisco、NVIDIA
              生态厂商和基于 Broadcom 的平台提供的现有 Ethernet 系统，也可以通过 OCP 风格硬件、FBOSS、SONiC、白盒或 JDM 流程推进自研。换句话说，Nexthop 的真实市场，是 AI 集群
              Ethernet 需求、开放或解耦运营偏好，以及买方愿意认证新供应商而不是默认选择现有厂商或内部路径的交集。
