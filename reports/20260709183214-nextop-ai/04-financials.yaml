- id: cost-structure-margin-and-working-capital
  title: Cost structure, margin drivers, and working capital
  body: 'Public evidence is much stronger on cost drivers than on realized economics. The three Nexthop datasheets and support hub show that the company is carrying meaningful hardware and service complexity: multi-kilowatt power envelopes, replacement logistics, software lifecycle support, and enterprise-grade case management. Mature comps explain why that matters. Arista’s 10-K says product cost runs through contract manufacturers, merchant silicon vendors, freight, inventory management, and supply-chain operations; it also shows how customer trials, acceptance periods, and support contracts can inflate both inventory and deferred revenue. Those are not abstract accounting issues for a startup like Nexthop. McKinsey’s optics-supply work suggests 800G and 1.6T components will remain supply constrained for years, which increases the probability of pre-buys, safety stock, and qualification inventory. Supplier power is the other margin constraint. Broadcom and NVIDIA show that AI-era value
    capture can sit very high upstream at the semiconductor layer, while HPE’s and Arista’s public results show that system vendors earn healthier but materially lower economics. The net implication is that Nexthop’s eventual gross margin will depend on negotiation power, support attach, and inventory discipline at least as much as on technical differentiation.'
