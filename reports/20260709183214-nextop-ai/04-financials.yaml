  rows:
  - - Standard switch platforms
    - Sale of NH-4010, NH-4220, and NH-5010 systems into AI data-center roles
    - Per system / configured platform
    - Public products exist; realized revenue undisclosed
    - Company product pages and datasheets confirm offer, not sell-through
    - Provide trailing 12-month shipments, ASPs, and installed-base split by family
  - - Customized JDM systems
    - Account-specific hardware design and supply for hyperscalers or large operators
    - Per program / design win
    - Company says this exists; no program economics public
    - Official release confirms custom-motion only at narrative level
    - Provide signed program roster, NRE terms, and acceptance milestones
  - - NOS and software enablement
    - Nexthop NOS, BYoNOS, BYoSAI, or SONiC hardening layered onto hardware
    - Per subscription, image, or support entitlement
    - Software surfaces are public; monetization terms undisclosed
    - Product docs confirm capability but not pricing or attach
    - Disclose software attach rate, license terms, and standalone software revenue
  - - Support and replacement services
    - 24x7 TAC, NBD RMA, lifecycle support, and warranty-related services
    - Per support contract / renewal term
    - Support SKUs and support workflows are public; contract revenue undisclosed
    - Datasheets and support hub confirm service surface
    - Provide support attach, renewal rate, and warranty vs paid-support split
  - - Documentation, quick-start, and release operations
    - Post-sale enablement that supports deployment and renewals rather than direct list revenue
    - Bundled enablement / retention driver
    - Publicly visible lifecycle surface, but commercial role is undisclosed
    - Observed support surface only
    - Clarify which lifecycle services are bundled, billed separately, or required for renewal
