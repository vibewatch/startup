- id: TI004
  title: Capital adequacy table
  columns:
  - Field
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Disclosed equity raised
    - 610 USDm from two announced rounds
    - high
    - This is the only hard public funding floor available for runway framing
    - Confirm whether any secondary sales, warrants, or additional unannounced equity exist
  - - Latest disclosed round
    - 500 USDm Series B at 4.2 USDbn valuation in March 2026
    - high
    - Sets the current valuation anchor and dilution context
    - Provide post-money cap table and any investor side-letter economics
  - - Public use of funds
    - Expand R&D and infrastructure capabilities to broaden the product portfolio
    - medium
    - Signals spending direction but not amount by bucket
    - Provide a 24-month sources-and-uses plan by R&D, inventory, support, and go-to-market
  - - Cash on hand
    - 'null'
    - medium
    - Capital adequacy cannot be measured without current cash balance
    - Provide current unrestricted cash, restricted cash, and short-term investments
  - - Monthly burn
    - null; illustrative scenario band in FI003 is 10 to 25 USDm per month
    - low
    - Runway and next-round timing depend on actual burn, not disclosed funding totals
    - Provide actual monthly net cash burn for the last six months and budget for the next four quarters
  - - Runway months
    - null; illustrative scenario band in FI003 is about 24 to 61 months
    - low
    - Board timing and financing dependency depend on runway after working-capital needs
    - Provide management runway view under base, upside, and downside cases
  - - Debt / project finance / vendor finance
    - No public disclosure identified as of 2026-07-09
    - medium
    - Debt and vendor commitments can materially change risk even when equity capital looks strong
    - Provide all debt agreements, payable schedules, and vendor-finance or inventory-finance programs
  - - Next-round trigger
    - Undisclosed
    - medium
    - Underwriting needs the operational milestone that would force or avoid another round
    - Specify whether the next round is triggered by shipments, revenue, gross margin, customer count, or strategic capacity
  notes: Separates disclosed funding facts from estimated scenario lenses; null cells are intentional disclosures gaps and each carries a concrete diligence request.
