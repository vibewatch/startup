- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Current revenue / ARR
    - 'null'
    - medium
    - Without current revenue, no efficiency, growth, or valuation-multiple analysis is investable
    - Provide monthly recurring revenue, trailing 12-month revenue, and booked ARR bridge
  - - Current customer count
    - 'null'
    - medium
    - Account concentration and expansion math cannot be measured without active-customer count
    - Provide active customer count, top-10 revenue mix, and logos by segment
  - - Current headcount
    - 'null'
    - medium
    - Support burden, burn, and sales capacity all depend on functional headcount
    - Provide current headcount by engineering, GTM, support, and operations
  - - Mature gross-margin context
    - 64.1% gross margin at Arista in 2024
    - medium
    - Provides an upper-bound comparator for a scaled networking vendor, not Nexthop’s current margin
    - Map Nexthop product-family gross margin against Arista-like product and service mix
  - - Mature networking operating-margin context
    - 20.8% to 21.6% operating margin at HPE networking in FY25-Q3 to FY26-Q2
    - medium
    - Shows mature networking profitability after SG&A and support costs, not startup economics
    - Provide Nexthop departmental opex split and expected steady-state operating model
  - - Silicon-layer value capture context
    - 67% non-GAAP operating margin guidance at Broadcom and 71.1% FY26 GAAP gross margin at NVIDIA
    - medium
    - Indicates how much value may remain upstream with silicon providers rather than system vendors
    - Provide major BOM categories, silicon sourcing terms, and target gross-margin corridor
  - - Working-capital proxy
    - Arista held about $1.83B inventory including $422.1M of evaluation inventory
    - medium
    - Shows trials and acceptance can trap cash before revenue is recognized
    - Provide inventory by family, finished-goods days, and any consigned or evaluation inventory
  - - Deferred-revenue proxy
    - Arista ended 2024 with $2.79B deferred revenue and $3.4B RPO
    - medium
    - Shows support attach and acceptance clauses can improve cash timing but delay GAAP revenue
    - Provide support-contract duration, deferred-revenue balance, and remaining performance obligations
  - - Published switch power envelope
    - 0.584kW to 2.170kW published typical-to-max range on reviewed NH-4010 and NH-5010 test conditions, with NH-4220 using a 5.2kW PSU
    - medium
    - Power, cooling, and spares shape both buyer TCO and vendor support burden
    - Provide system-level field-power data, optics assumptions, and warranty-incident rates
  - - Current burn / CAC / payback / NRR
    - 'null'
    - medium
    - These are the core unit-economics fields needed to assess sustainability and growth quality
    - Provide monthly burn, fully loaded CAC by motion, logo-to-ramp time, payback, and net retention
  notes: Null means not publicly disclosed, not zero; proxy rows are labeled as public comparators so the chapter does not confuse Nexthop values with peer benchmarks.
