figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  layout: wide
  summary: How customer activity converts into recognized product and service revenue in the hardware-plus-software model visible from public sources.
  data:
    nodes:
    - id: target-account
      label: Target account
      detail: Hyperscaler, NeoCloud, or other large operator with AI data-center networking needs and long procurement cycles.
    - id: solution-design
      label: Solution design / qualification
      detail: Standard platform selection or custom JDM design work plus NOS choice and interconnect qualification.
    - id: product-revenue
      label: Product revenue
      detail: Hardware revenue from accepted NH-4010, NH-4220, NH-5010, or custom systems; realized ASPs are undisclosed.
    - id: software-attach
      label: Software and NOS attach
      detail: Community SONiC, Nexthop NOS, or BYoNOS/BYoSAI support path; standalone monetization is undisclosed.
    - id: support-contract
      label: Support contract
      detail: 24x7 TAC, NBD replacement, lifecycle support, and warranty-related services create recurring or deferred obligations.
    - id: recognized-revenue
      label: Recognized revenue
      detail: Comparable hardware vendors can defer product revenue for acceptance periods and recognize support ratably over contract life.
    - id: gross-profit
      label: Gross profit
      detail: Gross profit depends on hardware BOM, supplier terms, support attach, warranty burden, and discounting; Nexthop has not disclosed the result.
    edges:
    - from: target-account
      to: solution-design
    - from: solution-design
      to: product-revenue
    - from: solution-design
      to: software-attach
    - from: product-revenue
      to: recognized-revenue
    - from: software-attach
      to: support-contract
    - from: support-contract
      to: recognized-revenue
    - from: recognized-revenue
      to: gross-profit
  approximationNotes: The bridge shows monetization logic visible from public materials and uses Arista only as a recognition analogue; it does not estimate Nexthop revenue.
