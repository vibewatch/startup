callouts:
- calloutType: risk
  title: Public metrics are too thin for conventional underwriting
  body: Nexthop has enough public evidence to describe how it should make money, but not enough to validate realized pricing, support attach, current revenue, gross margin, or burn. That means the chapter can explain the business model and capital needs, but cannot score revenue quality or margin path with confidence.
  claimRefs:
  - CI031
  - CI032
  - CI033
  - CI034
  - CI043
  - CI044
- calloutType: insight
  title: Support is economically important, not just operationally convenient
  body: The separate support SKUs, global case-management surface, NBD replacement promise, and software lifecycle pages all indicate that Nexthop’s future economics will depend on service execution as well as box shipments. This is a hardware-plus-support model, not a one-time parts sale.
  claimRefs:
  - CI005
  - CI006
  - CI030
  - CI042
