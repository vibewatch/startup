  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue
    missingEvidence: Current revenue, ARR, and product-family revenue mix.
    whyItMatters: Revenue quality and valuation support cannot be assessed without actual conversion data.
    diligencePath: Request a monthly revenue bridge, ARR walk, and top-customer revenue split.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: pricing-and-attach
    missingEvidence: Realized pricing, discount bands, support attach, and software attach by offer.
    whyItMatters: Without realized pricing and attach rates, ASP, gross profit, and payback remain unknowable.
    diligencePath: Request SKU pricing waterfalls, support renewal data, and top-20 quote summaries.
    relatedQuestionRefs:
    - QI003
    - QI004
    - QI024
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: headcount-and-capacity
    missingEvidence: Current headcount by function plus support and field coverage by region.
    whyItMatters: Burn, execution capacity, and service obligations all depend on functional staffing levels.
    diligencePath: Request HRIS export by function and geography plus open requisition list.
    relatedQuestionRefs:
    - QI012
    - QI018
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-working-capital
    missingEvidence: Gross margin by family, inventory rollforward, receivables aging, deferred revenue, and warranty reserves.
    whyItMatters: These metrics determine whether growth is efficient or simply inventory financed.
    diligencePath: Request product-family margin bridge, inventory policy, AR aging, deferred-revenue schedule, and warranty history.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI011
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-burn
    missingEvidence: Current cash on hand, monthly burn, board runway view, and financing plan.
    whyItMatters: Capital adequacy cannot be underwritten from disclosed rounds alone.
    diligencePath: Request latest balance sheet, six-month cash burn history, and 13-week cash forecast.
    relatedQuestionRefs:
    - QI019
    - QI022
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: debt-and-vendor-commitments
    missingEvidence: Signed debt, project-finance, vendor-finance, and non-cancellable procurement commitments.
    whyItMatters: A large hidden payables or vendor-finance stack can materially change solvency and dilution risk.
    diligencePath: Request all debt schedules, lien packages, purchase commitments, and supplier concentration report.
    relatedQuestionRefs:
    - QI021
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
