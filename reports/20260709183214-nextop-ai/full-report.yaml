            title: Open-NOS credibility is real, but only valuable if it wins support-heavy accounts
            body: >-
              Public evidence gives Nexthop a real claim to open-networking credibility: it says customers can run SONiC
              or FBOSS, it references three products already in the community SONiC repository, and it claims top-10
              contributor plus governing-board status. That is more concrete than a generic “open” slogan. The
              constraint is that openness is already becoming table stakes for hyperscaler-style buyers, so Nexthop
              still has to prove that customers pay for its validation, deployment speed, and support—not just for
              access to the same open stack.
            calloutType: strength
            claimRefs:
