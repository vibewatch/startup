  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              Nexthop’s public segmentation is narrow by design. The company does not market to generic enterprise
              switching buyers; its own homepage, launch materials, and investor posts repeatedly frame the addressable
              customer base as hyperscalers and NeoClouds running large AI and cloud data-center fabrics. Within that
              segment, the paying account is usually an infrastructure or platform budget owner, the operational buyer
              is a network architecture or cloud engineering team, and the daily users are network SRE,
              cluster-operations, and AI-infrastructure teams that care about deployment speed, power efficiency, open
              NOS support, and lifecycle manageability. The public split between customer types is also meaningful.
              Hyperscaler accounts are described as custom, co-developed JDM engagements that let buyers specify
              hardware and retain their preferred SONiC or FBOSS-derived software path, while NeoClouds are described as
              more turnkey buyers that can take a hardened Nexthop NOS. External market context supports that
              segmentation: Cisco and AFL both describe NeoClouds as a distinct buyer class with different economic and
              operational constraints from hyperscalers. What is still missing is basic disclosure by geography, account
              count, and revenue band, so the public segmentation is strong on buyer workflow but weak on portfolio
              breadth.
