  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define Nexthop AI’s market is not as all switching and not even as all AI
              infrastructure. Nexthop’s public product and launch materials put it in the slice of AI data-center
              networking where buyers want Ethernet switching systems for scale-out, scale-across, and front-end
              fabrics, often with open NOS flexibility and some degree of customization. That boundary matters because
              the broad AI networking numbers in circulation often bundle Ethernet switches, InfiniBand fabrics, and
              optics, while some bullish narratives blur further into a wider AI-cloud infrastructure story. Status-quo
              substitutes are also strong. Buyers can keep buying incumbent Ethernet systems from Arista, Cisco,
              NVIDIA-ecosystem vendors, and Broadcom-based platforms, or they can pursue internal builds through
              OCP-style hardware, FBOSS, SONiC, and white-box or JDM flows. In other words, Nexthop’s real market is the
              intersection of AI-cluster Ethernet demand, open or disaggregated operations preferences, and a buyer
              willingness to qualify a new vendor rather than default to incumbent or internal paths.
