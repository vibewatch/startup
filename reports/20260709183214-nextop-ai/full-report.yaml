      - number: '7.3'
        title: Commercial, financial, and customer risk
        blocks:
          - type: paragraph
            body: >-
              The commercial downside is unusually concentrated because Nexthop is still a young private company selling
              into a tiny set of giant accounts while already carrying a $4.2 billion valuation. Public demand signals
              are supportive: hyperscaler AI capex remains enormous and Nexthop’s launches clearly target buyers that do
              spend at scale. But that does not neutralize concentration risk; it amplifies it. Arista’s 10-K shows how
              even a much larger and more diversified networking company can still derive 35% of revenue from two
              hyperscaler customers and suffer from long qualification and acceptance cycles. Nexthop provides even less
              public denominator data than Arista. It does not disclose customer count, top-account share, retention
              metrics, or revenue, and its strongest proof still comes from shipment language, technical references, and
              target-account framing rather than a broad named production roster. That proof gap matters because the
              current private valuation already assumes meaningful execution success. Sequoia’s AI spending critique and
              broader power or deployment bottlenecks show how quickly sector enthusiasm can turn into tougher
              procurement timing or financing math if end demand lags the capex buildout. In short, the category can
              remain attractive while Nexthop’s specific return profile still gets hit by one slipped account, one
              delayed site, or one harsher financing round.
