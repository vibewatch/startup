      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not chase
            body: >-
              The current mark deserves active monitoring, not default buying, until management can show revenue,
              margin, and customer-breadth proof that transfers beyond the headline round valuation.
            calloutType: recommendation
            claimRefs:
              - CV037
              - CV038
              - CV044
          - type: callout
            title: Concentration can overpower category tailwinds
            body: >-
              Even if AI-networking demand stays strong, one delayed flagship account or one weak financing event can
              reset an opaque hardware valuation faster than the market thesis can rescue it.
            calloutType: risk
            claimRefs:
