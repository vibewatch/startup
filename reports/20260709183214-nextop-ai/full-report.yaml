          - type: callout
            title: Merchant silicon is compressing hardware uniqueness fast
            body: >-
              The strongest adverse evidence in this chapter is how quickly comparable hardware is becoming available.
              Arista, Juniper, Celestica, and Edgecore all publish 800G or 1.6T-era systems, and the Broadcom layer sits
              underneath much of that field. That does not make Nexthop irrelevant; it does mean that switch speed alone
              is not a moat. The investment question shifts toward software polish, co-design depth, optics
              qualification, and customer support execution.
