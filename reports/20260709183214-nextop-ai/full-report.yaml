      - number: '4.4'
        title: Public traction gaps and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Nexthop’s public financial narrative is dominated by financing facts and by what is still missing. The
              company has disclosed $110 million at launch and a $500 million Series B at a $4.2 billion valuation, so
              disclosed equity capital totals $610 million. The Series B release further says the money will expand R&D
              and infrastructure capabilities around the product portfolio. Beyond that, visibility drops sharply.
              Reviewed official disclosures do not provide current revenue, ARR, customer count, headcount, bookings,
              backlog, cash on hand, burn, gross margin, CAC, payback, or NRR, and no public debt or project-finance
              layer was identified. That means capital adequacy can only be discussed directionally. $610 million is a
              large pool for a startup, but it is not automatically excess capital when the model includes hardware
              qualification, NBD spare pools, long account cycles, and likely inventory commitments into constrained
              optics and merchant-silicon markets. A simple scenario band shows that if monthly burn eventually ran at
              roughly $10 million to $25 million, disclosed equity alone would imply about two to five years of runway
              before any working-capital shock. Because actual burn is private, that range is a lens, not a conclusion.
