  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation stays at track because real market and product signals are offset by valuation premium, KPI
      opacity, and macro compression risk.
    approximationNotes: >-
      This flow is qualitative rather than probabilistic and maps the decision chain implied by retained public evidence
      as of 2026-07-09.
    data:
      nodes:
        - id: market
          label: 'Demand: AI networking still expanding'
          detail: 650 Group, IDC, Dell’Oro, Cisco, and HPE all support ongoing AI-network investment
          type: input
        - id: proof
          label: 'Proof: product surface + strong syndicate'
          detail: Nexthop has real launches, hyperscaler-focused positioning, and a blue-chip Series B
          type: input
        - id: gaps
          label: 'Gap: no public revenue, margin, breadth, or retention data'
          detail: The current mark cannot be conventionally underwritten from the public record
          type: process
        - id: comps
          label: 'Comp reality: closest comps are either much larger or structurally different'
          detail: Arista is closest; Cisco/HPE are lower-multiple floors; Broadcom/NVIDIA capture richer upstream economics
          type: process
        - id: macro
          label: 'Macro risk: capex and multiple compression can reset private marks'
          detail: Sequoia, Futurum, and arXiv all argue that timing and monetization still matter
          type: process
        - id: rec
          label: 'Recommendation: track; stretched at $4.2B without fresh KPI proof'
          detail: Engage only with tighter price discipline, downside protections, or materially better evidence
          type: output
      edges:
        - from: market
          to: proof
          label: supports opportunity
        - from: proof
          to: gaps
          label: does not close KPI gap
        - from: gaps
          to: comps
          label: forces comp-based discipline
        - from: comps
          to: rec
          label: premium requires proof
        - from: macro
          to: rec
          label: adds downside skew
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV033
      - CV037
      - CV044
      - CV046
