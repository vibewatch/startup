      - number: '8.3'
        title: Scenario lens and comparable range
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should stay directional because the missing revenue and margin data make false
              precision more dangerous than useful. In the bull case, Nexthop proves that today’s product and customer
              signals are the front edge of a broader franchise: disclosed revenue is large enough to support a premium
              multiple, customer breadth expands beyond a tiny set of flagship accounts, and AI-networking demand
              continues to widen as 650 Group, IDC, and Dell’Oro expect. In that world, the current mark can look early.
              The base case is less dramatic and more plausible from public evidence alone: demand remains healthy, but
              Nexthop still needs time to prove breadth, margins, and repeatability, leaving the valuation near or
              modestly below the last round. The bear case is a classic compression story. If the AI CapEx buildout
              outruns monetization, one or two large deployments slip, or the next round carries harder investor
              protections, the current mark can reset quickly. The comparable table should be read with the same
              humility. Arista is the cleanest networking comp, Cisco and HPE show the lower-multiple diversified floor,
              Broadcom and NVIDIA show how much premium can sit upstream, and Groq shows private AI-infrastructure
              capital can still clear rich prices when live commercial proof is stronger.
