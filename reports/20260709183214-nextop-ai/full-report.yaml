  summary: >-
    Nexthop AI is a Santa Clara-based, founder-led private Series B company building open-Ethernet switching systems for
    hyperscaler and NeoCloud AI data centers. Its public offer combines customer-specific hardware, customer-choice NOS
    support, validated interconnects, and a supported SONiC-based Nexthop NOS, positioning the company as a
    co-development networking supplier rather than a closed appliance vendor. Public disclosures confirm rapid capital
    formation from a $110 million launch round in March 2025 to a $500 million Series B at a $4.2 billion valuation in
    March 2026, while leaving current operating metrics largely opaque.
