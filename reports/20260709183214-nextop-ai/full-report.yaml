      - number: '2.4'
        title: Growth Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The driver set is real. AI clusters are moving rapidly toward 800G and 1.6T fabrics; Ethernet is gaining
              share in AI back-end networks; hyperscalers and NeoClouds continue to commit large budgets; and open NOS
              standards such as SONiC and UEC reduce the conceptual barrier to disaggregated multi-vendor switching.
              Those conditions can create a real design-win window for a company like Nexthop, especially where
              customers want custom systems, open software flexibility, or a turnkey NeoCloud path. But the constraints
              are equally important to valuation. InfiniBand is still meaningful in NVIDIA-centric clusters,
              internal-build paths remain strong at the largest operators, and the energy system can lag data-center
              construction by years. Uptime and IEA both point to power as a hard timing constraint, while McKinsey
              highlights 800G and 1.6T optical shortages that can delay buildouts even when budgets are approved.
              Sequoia’s AI capex skepticism adds a final caution: the market may remain large, but if utilization and
              end-user monetization disappoint, buyers can slow orders abruptly. The investable conclusion is that
              Nexthop benefits from a strong structural market, but its realized revenue path will be bottlenecked by
              qualification, supply readiness, and proof that buyers prefer its wedge over internal or incumbent
              alternatives.
