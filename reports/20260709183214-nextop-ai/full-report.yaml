        title: Milestones and adverse screen
        blocks:
          - type: paragraph
            body: >-
              The chronology is compact but dense. Founding dates back to 2024, public web surfaces appeared in March
              2025, and the company’s formal launch on March 25, 2025 established both the initial funding syndicate and
              the first disclosed multi-location footprint. The next major public burst came on March 10, 2026, when
              Nexthop announced the $500 million Series B, launched its first public switch portfolio, highlighted SONiC
              ecosystem status, and published multiple thought-leadership posts that framed the company’s design
              philosophy around hyperscaler co-development, open NOS support, and integrated optics. The main negative
              signal found in reviewed sources was not a lawsuit or layoff but a low-reliability AI-generated market
              article that cast Nexthop as a high-execution-risk pre-revenue valuation bet and introduced financing
              details not corroborated by the company’s own launch disclosure. That is useful as a reminder that the
              market narrative is getting ahead of audited operating data. Separately, the reviewed public sources did
              not disclose lawsuits, sanctions, or regulatory actions through runDate, but that absence should be
              treated as a light screen rather than definitive legal clearance.
