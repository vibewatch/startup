            body: >-
              Cisco’s AI-order momentum, HPE’s expanded Juniper go-to-market, and NVIDIA’s networking revenue scale all
              show that the field is not standing still. Even if Ethernet keeps gaining, buyers still have strong
              incumbent choices and a live InfiniBand alternative for top-end training workloads. Nexthop therefore
              needs to win on account-specific customization and time-to-deploy before incumbents can bundle similar
              capabilities into broader trusted relationships.
