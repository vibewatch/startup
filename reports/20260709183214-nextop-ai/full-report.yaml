      - number: '2.2'
        title: Sizing Lenses and Constrained TAM / SAM / SOM
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence is useful only when its boundary is stated upfront. 650 Group’s broadest lens
              points to roughly $20B of AI networking in 2025 across Ethernet, InfiniBand, and optics. The same firm
              also breaks out AI sublayers, saying 2025 scale-out networking should exceed $8B ex-optics and AI
              front-end networking should exceed $5B. Dell’Oro gives a different but highly relevant lens by arguing
              Ethernet AI back-end switches alone could drive nearly $80B of cumulative sales over five years. Those
              figures are directionally consistent on growth but not directly comparable because they use different
              layers, time horizons, and inclusion rules. Nexthop’s actual serviceable market should be narrower still:
              its product set is focused on Ethernet switching systems, not optics-only revenue, not InfiniBand-only
              clusters, and not every internal platform that hyperscalers can build themselves. The result is a usable
              diligence framework rather than a single precise TAM story: broad AI networking is large and growing, but
              the investable wedge for Nexthop should be modeled as a constrained multi-billion-dollar annual slice with
              a much smaller near-term SOM.
