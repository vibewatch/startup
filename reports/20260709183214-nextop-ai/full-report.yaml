      - number: '3.3'
        title: Switching Costs, Supply Power, and Substitute Paths
        blocks:
          - type: paragraph
            body: >-
              Switching cost in this market is less about physical port swaps alone and more about the operational stack
              around the switch. Buyers who already run Juniper with Apstra, Cisco with NX-OS or Nexus Dashboard, or
              NVIDIA with InfiniBand have workflow, telemetry, and support patterns that create inertia. The same is
              true on the open side: the more a hyperscaler has invested in SONiC, FBOSS, or OCP-SAI-based internal
              tooling, the less attractive a closed operating model becomes. This is why the internal-build path is such
              a real substitute. Meta’s DSF disclosures show a disaggregated, open fabric using FBOSS and OCP-SAI, while
              SONiC positions itself as production-ready across multiple vendors and ASICs. Supplier leverage is the
              other structural cost driver. Broadcom’s switching portfolio and the Broadcom-based designs from Celestica
              and Edgecore show that merchant silicon is the real substrate beneath a large slice of the open Ethernet
              field. That lowers hardware uniqueness for any one entrant and shifts diligence toward supply allocation,
              optics validation, software hardening, and account-specific support rather than bare switch throughput.
            claimRefs:
