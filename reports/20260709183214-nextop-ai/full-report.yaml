  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and recognition
        blocks:
          - type: paragraph
            body: >-
              Nexthop’s public commercial picture is broad enough to identify the revenue model, but not specific enough
              to measure revenue quality. Official materials show a hardware-software-support stack sold into a very
              small number of large AI-infrastructure accounts. The company says it builds customer-specific systems
              with hardened NOS support and pre-tested interconnects, and the March 2026 release adds that the mix spans
              both off-the-shelf products and highly customized JDM programs. That combination points to at least four
              monetization paths: standard switch platforms, custom hardware design wins, software and NOS enablement,
              and paid support or replacement services. What is missing is the part an investor actually underwrites:
              public list prices, realized ASPs, support attach, discount policy, revenue mix, and the exact accounting
              policy. Arista’s filing is a useful comparator because it shows how similar hardware vendors separate
              recognized product revenue from ratable support revenue and can defer revenue when acceptance periods or
              trials are involved. Nexthop’s support SKUs and customized deployments make that recognition complexity
              likely here too, even though the company has not published the policy.
