      - number: '2.3'
        title: Buyers, Users, and Budget Owners
        blocks:
          - type: paragraph
            body: >-
              The buyer map is concentrated and multi-layered. On hyperscaler programs, the technical evaluators are
              typically network architecture, NOS, and AI infrastructure teams that care about topology, buffers,
              congestion control, NOS compatibility, optical validation, and deployment speed. The day-to-day operators
              are the network SRE, platform, or AI cluster teams that will actually run the fabric. The economic payer
              is usually a central infrastructure capex owner rather than an individual application team. NeoCloud
              buyers are somewhat different: founder-CEOs, CTOs, and infrastructure leads often sponsor the decision
              directly, while project finance or anchor-customer contracts can shape timing. Public filings and official
              releases from Alphabet, Meta, CoreWeave, Lambda, and Crusoe show why this matters: AI infrastructure
              budgets are enormous, contracts are multi-year, and customer concentration is high. That means Nexthop
              does not need thousands of small customers to matter, but it also means each design win carries heavy
              concentration risk and long qualification consequences.
