  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and underwriting frame
        blocks:
          - type: paragraph
            body: >-
              The valuation question is less whether Nexthop is operating in an attractive category and more whether the
              March 2026 price is already discounting too much success. Public evidence makes the opportunity
              intelligible: the company has a real product surface, it targets hyperscalers and NeoClouds that are still
              spending heavily on AI networking, and it attracted a blue-chip Series B syndicate at a headline $4.2
              billion valuation. Those are meaningful positives. They do not, however, solve the core underwriting
              problem. The company still does not disclose current revenue, gross margin, customer count, or retention
              metrics, so the public record cannot show whether the round priced a fast-scaling franchise or a
              still-concentrated hardware program. Public comparables help frame the discipline. Arista earns a premium
              multiple, but only with public scale and visible gross margin. Cisco and HPE show how quickly diversified
              infrastructure trades at lower revenue multiples, while Broadcom and NVIDIA show that the richest
              AI-infrastructure premiums often accrue upstream. The practical conclusion is track, not buy: keep
              engagement active, but do not underwrite the last round mark without better KPI proof or better downside
              structure.
            claimRefs:
