  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Direct Rival Classes
        blocks:
          - type: paragraph
            body: >-
              Nexthop is not competing in an empty whitespace. The direct named peers already in public view are Arista,
              Cisco, Juniper-HPE, and NVIDIA, each of which now markets AI-specific network fabrics or software around
              the same buyer problem. Arista’s Etherlink family, Cisco’s Nexus and AI POD stack, Juniper’s QFX plus
              Apstra automation, and NVIDIA’s Spectrum-X Ethernet all address the same core requirement: moving AI
              traffic across 800G and 1.6T-era clusters with high radix, congestion control, and deployment tooling. The
              substitute field is broader still. Broadcom’s merchant-silicon layer powers many of the open-switch
              alternatives below the branded OEM tier, while Celestica and Edgecore already publish 51.2T and 102.4T
              systems that overlap Nexthop’s public spec envelope. Internal build is also not theoretical. SONiC, FBOSS,
              OCP-SAI, and ESUN show that large operators can combine multiple hardware vendors and open NOS stacks
              rather than standardize on one proprietary fabric. As a result, the chapter’s competitive lens must
              include direct public peers, incumbents, merchant-silicon ecosystems, ODM and JDM alternatives, and
              customer-built status-quo paths at the same time.
