      - number: '7.4'
        title: Execution mitigations and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Public mitigations exist, but most are partial rather than thesis-clearing. Nexthop has raised enough
              capital to staff important functions, publishes support and compliance artifacts, and participates visibly
              in SONiC governance. Those are real positives. The problem is that they mitigate operational credibility
              more than they solve disclosure risk. The investment case still depends on management proving that export
              and sanctions controls are operationalized, that open-source compliance is disciplined, that release and
              security processes are mature enough for risk-sensitive buyers, and that a narrow hyperscaler or NeoCloud
              customer set can turn into repeatable revenue without one account dominating outcomes. The practical
              response is to define kill criteria up front. If export rules tighten and the company cannot produce a
              robust screening workflow, if Broadcom or optics issues push a platform generation off schedule, if public
              or private customer proof fails to broaden, if support and release evidence stays thin, or if a next
              financing round resets terms from the 2026 valuation without a matching proof step-up, the thesis should
              be treated as impaired. These are monitorable conditions rather than vague worries, which makes them
              usable both in initial diligence and in future refresh work.
