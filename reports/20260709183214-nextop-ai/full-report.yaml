      - number: '4.2'
        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The available GTM evidence implies a classic high-touch infrastructure selling motion rather than a
              scalable self-serve or broad-channel model. Nexthop’s language is aimed at hyperscalers, NeoClouds, and
              large operators, which usually means few accounts, long evaluation cycles, large contract values, and
              heavy pre-sales engineering. The reviewed official surfaces do not show public pricing, an online
              configuration-and-order path, or a public partner-financing roster. Instead, they show support portals,
              contact-led engagement, and hardware documentation that fits enterprise procurement rather than web
              conversion. This matters for sales efficiency because CAC, payback, and logo velocity are then driven by
              account-level design wins and qualification success, not demand generation volume. Public comparators
              reinforce the burden. Cisco markets AI reference architectures together with NVIDIA and a global partner
              ecosystem, while HPE and Juniper now bring multibillion-dollar networking revenue and established field
              coverage. Nexthop may still win on customization and open-NOS flexibility, but the public evidence points
              to a labor-intensive selling motion with private, not disclosed, efficiency metrics.
