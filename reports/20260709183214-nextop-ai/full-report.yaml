            body: >-
              Public durability evidence is much weaker than public positioning evidence. Nexthop does not disclose
              customer count, NRR, GRR, logo retention, renewal rates, contract duration, churn, support satisfaction,
              or any cohort view of repeat orders. The only positive repeat-usage proxy in the fetched set is
              qualitative: management and investors both emphasize deep customer partnerships, long customer-engineering
              engagement, and a product set that spans custom hardware, preferred NOS support, optics qualification, and
              turnkey NeoCloud software. That combination makes a land-and-expand story plausible because once a
              customer qualifies a platform, adjacent roles such as front-end, scale-out, and scale-across networking
              could expand wallet share. But plausibility is not proof. Without public renewal or installed-base data,
              the right diligence stance is to keep durability fields null and treat expansion as a hypothesis resting
              on product breadth and engagement depth rather than verified cohorts. The best conclusion available from
              public sources is that Nexthop’s motion is relationship-heavy and potentially sticky if it wins a design
              slot, yet the evidence remains too sparse to underwrite repeat usage quality or satisfaction today.
            claimRefs:
              - CU013
              - CU014
