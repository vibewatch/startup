      - number: '1.3'
        title: Funding, stage, and scale signals
        blocks:
          - type: paragraph
            body: >-
              Capital formation is the clearest externally verifiable scale signal in Nexthop’s public record. The
              company launched from stealth in March 2025 with $110 million led by Lightspeed, then returned one year
              later with an oversubscribed $500 million Series B at a $4.2 billion valuation, again led by Lightspeed
              with Andreessen Horowitz as a major new investor and Altimeter participating alongside existing backers.
              That implies at least $610 million of publicly disclosed capital raised in roughly one year, enough to
              fund a large engineering and supply-chain build even before revenue visibility is available.
              Product-launch materials also claim the company was already shipping to leading hyperscalers by March
              2026, which is directionally important because it suggests programs had moved beyond design-only mode. The
              missing piece is operating transparency: reviewed public sources did not disclose current revenue, ARR,
              gross margin, customer count, current headcount, debt facilities, or any secondary share sales, so the
              right interpretation is that Nexthop’s current stage is well funded and commercially progressing, but
              still disclosure-light.
