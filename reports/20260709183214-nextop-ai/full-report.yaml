    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring shows a strong market and product story but weak valuation support because economics and customer
      breadth remain under-disclosed.
    approximationNotes: >-
      Scores use a 1-5 editorial scale based on retained public evidence as of 2026-07-09; they are not
      management-provided KPIs.
    data:
      items:
        - label: Market demand
          value: 4
          unit: /5
          note: AI-networking demand signals remain strong across market-data and incumbent updates.
        - label: Product credibility
          value: 4
          unit: /5
          note: Public launches and customer-positioning evidence support a real offer.
        - label: Customer proof
