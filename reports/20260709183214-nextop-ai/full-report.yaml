  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The key legal risk is not that Nexthop has a public enforcement scarlet letter today; it is that the
              company is entering a regime-heavy market without showing much public control infrastructure. Its website
              now has refreshed privacy and terms pages, which is better than no legal surface, but those pages describe
              website usage and personal-data handling rather than export compliance, product-security governance,
              warranty structure, or buyer-grade contractual commitments. The external regime is also real and moving.
              The January 2025 BIS AI diffusion framework and the May 2025 rescission-and-guidance shift show that
              AI-adjacent hardware exporters face a live compliance burden even while rule text evolves. OFAC’s own
              tooling reinforces the sanctions-screening burden, and trade-law commentary indicates that customer
              domicile and control questions can matter even when hardware does not ship directly into an obvious
              restricted market. Nexthop’s SONiC dependence adds a second legal layer. Foundation governance, Apache
              licensing, and Linux-derived components make open-source diligence a real obligation, especially if the
              company distributes modified software images. No company-specific SEC, CFTC, or public federal docket
              action was found in the reviewed sources, but that absence reflects private-company opacity and short
              operating history, not proof that the compliance surface is low-risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
