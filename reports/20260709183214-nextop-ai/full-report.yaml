    type: bar
    layout: wide
    summary: >-
      Illustrative fair-value sensitivity shows that revenue proof and breadth can add value, but multiple compression
      and hard financing terms can erase it quickly.
    approximationNotes: >-
      Bars show directional value deltas in $M versus a rough $3.5B current-proof anchor; they are not additive and are
      meant to illustrate leverage to a few key underwriting variables.
