- id: leadership-governance-and-key-person-risk
  title: Leadership, governance, and key-person risk
  body: 'The public leadership story is anchored overwhelmingly on founder and CEO Anshul Sadana, whose prior role as Arista Networks COO is referenced by company, investor, and press sources alike. That founder-market fit is real: the company’s product positioning, hyperscaler co-development model, and investor enthusiasm all lean on Sadana’s reputation in cloud networking. At the same time, the public org chart shows that Nexthop is not just a one-person story. The leadership page names executives across hardware, software, product, customer engineering, finance, and supply chain, while the board-and-advisor layer adds external credibility through Ita Brennan, Sureel Choksi, Guru Chahal, and Dave Maltz. Governance credibility is further reinforced by Ryan Torres representing Nexthop on the SONiC Governing Board. The diligence caveat is that private-company disclosure is selective: the reviewed public sources did not disclose ownership percentages, complete board composition detail, or
    any dated record of internal leadership transitions, so the external picture supports functional depth but still points to meaningful key-person concentration around Sadana.'
