  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current revenue, ARR, run-rate, gross margin, and any board-reported KPI pack.
    whyItMatters: Without operating metrics, stage and valuation must be judged primarily from funding, product, and ecosystem signals.
    diligencePath: Request the latest board deck, monthly KPI package, or audited management accounts.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-disclosure
    missingEvidence: Named customer roster, number of active hyperscaler and NeoCloud accounts, and concentration by top account.
    whyItMatters: The business model appears concentrated in a small number of very large programs, so customer proof is critical to diligence.
    diligencePath: Request customer list, pipeline by stage, and revenue concentration by top five accounts.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
    - TO003
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: Current employee count plus functional split across engineering, sales, support, and operations.
    whyItMatters: The only public headcount datapoint found was around 100 employees in March 2025, which is too stale for current scale or burn analysis.
    diligencePath: Request current org chart, HRIS export, or latest internal headcount dashboard.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: capitalization
    missingEvidence: Fully diluted cap table, board rights, liquidation preferences, debt facilities, and any secondary transactions.
    whyItMatters: Public financing headlines identify names and round sizes but not ownership, control, or hidden leverage.
    diligencePath: Request financing docs, cap table, investor rights agreements, and any lender or secondary-sale schedule.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: Complete board composition, dated executive-hire and departure chronology, and committee structure.
    whyItMatters: Public materials show a functional bench but do not fully resolve key-person dependence or organizational stability.
    diligencePath: Request board roster, executive-change log, and latest leadership org chart.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
