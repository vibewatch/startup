company:
  name: Nexthop AI
chapter:
  number: 1
  title: Company Overview
  summary: Nexthop AI is a Santa Clara, founder-led private Series B networking vendor focused on custom Ethernet switching systems for hyperscaler and NeoCloud AI data centers. Public disclosures show a sharp capital step-up from a $110 million launch round in March 2025 to a $500 million Series B at a $4.2 billion valuation in March 2026, but they do not disclose current revenue, customer count, current headcount, debt, or secondary activity.
sections:
- id: identity-and-operating-model
  title: Identity and operating model
  body: Nexthop AI presents itself as a Santa Clara networking hardware and systems company built specifically for the AI data-center buildout cycle. Across its launch materials, product pages, and investor posts, the company consistently describes a model centered on custom Ethernet switching for the world’s largest cloud operators, paired with the network operating system those buyers already prefer to run. That positioning matters because Nexthop is not trying to sell a generic enterprise switch portfolio first and then adapt it to AI later; it is trying to win programs where hardware design, optical validation, congestion control, and operating-system integration are all tailored to hyperscaler requirements. By March 2026, the public stack included three switch families, support for SONiC and FBOSS, and a supported Nexthop NOS for NeoCloud buyers. The public website also expanded from basic launch pages into support, documentation, and software-release surfaces, which is a useful operating
    signal even though current revenue, current customer count, and current headcount remain undisclosed.
