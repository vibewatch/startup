evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Audited post-closing Form 20-F or 424B3 disclosure stating final shareholder redemption percentages and exact
      warrant forfeiture.
    whyItMatters: >-
      Without final redemption tallies, net cash retained from the trust account and residual sponsor warrant dilution
      cannot be calculated precisely.
    diligencePath: >-
      Review IQM's upcoming SEC Form 20-F filing and Helsinki stock exchange regulatory releases for audited share
      counts.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Disaggregated revenue by customer account and exact delivery acceptance dates for contracted 150-qubit systems.
    whyItMatters: >-
      Meeting the EUR 42-47 million FY2026 guidance depends heavily on Q4 acceptance of sovereign systems, leaving
      revenue vulnerable to slippage.
    diligencePath: Audit quarterly revenue recognition schedules and customer delivery acceptance milestones in H2 2026 releases.
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: >-
      Full operational biographical histories and independent director committee assignments for the newly expanded
      board.
    whyItMatters: >-
      Independent board oversight is critical as IQM transitions from founder-led private governance to US and European
      public reporting.
    diligencePath: Review annual corporate governance statements and charter documentation on IQM's investor relations portal.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: revenue-segmentation
    missingEvidence: >-
      Disaggregated disclosure of recurring maintenance, software license, and service revenues versus one-time
      on-premises system sales.
    whyItMatters: >-
      Without clean separation of recurring software/maintenance revenue from capital hardware deliveries, calculating
      net revenue retention and lifetime customer value for valuation modeling remains impossible.
    diligencePath: >-
      Request customer-level revenue schedules and contract line-item breakdowns from IQM's investor relations and
      interim statutory filings.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Standardized market sizing methodology reconciling broad multi-hundred-billion-dollar economic value projections
      with near-term NISQ hardware procurement budgets.
    whyItMatters: >-
      Top-down consultancy estimates vastly outpace actual transacted deal volume ($2.6B across 121 deals over 5 years),
      creating valuation vulnerability if investor expectations rely on ungrounded TAM numbers.
    diligencePath: >-
      Benchmark bottom-up procurement records from EuroHPC, national supercomputing facilities, and US DOE centers
      against vendor contract announcements.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: material
    topic: competitor-benchmarks
    missingEvidence: >-
      Standardized independent quantum volume or CLOPS benchmark comparisons between IQM Radiance processors and
      competing systems from IBM or Quantinuum.
    whyItMatters: >-
      Without uniform third-party application benchmarks, buyers must rely on vendor-reported two-qubit gate fidelities
      rather than end-to-end algorithmic performance.
    diligencePath: >-
      Request audited cross-platform benchmark logs across standard QED-C or algorithmic circuits from Euro-Q-Exa or
      ORNL evaluations.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: minor
    topic: pricing-transparency
    missingEvidence: >-
      Discount schedules, maintenance fee structures, and multi-year system support pricing for on-premise deployments
      versus cloud reservation commitments.
    whyItMatters: >-
      Total cost of ownership comparisons between owning an on-premise cryogenic system and renting cloud access cannot
      be verified without bespoke procurement quotes.
    diligencePath: >-
      Review redacted EuroHPC or national procurement tenders for hardware capex and ongoing operational service
      agreements.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Disaggregated unit-level cost of goods sold, dilution refrigerator vendor procurement pricing, and per-product
      gross margins for Spark versus Radiance systems.
    whyItMatters: >-
      Without unit-level component costs, underwriting cannot verify whether the reported 40.6% gross margin is
