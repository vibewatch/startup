sections:
  - id: "landscape-and-competitor-profiles"
    title: "Quantum Hardware Landscape and Competitor Profiles"
    body: "The global quantum computing landscape features intense competition across distinct physical qubit modalities, primarily superconducting circuits, trapped ions, and neutral atoms. Superconducting transmons represent the most mature and crowded category, led by well-capitalized US technology giants IBM and Google alongside specialized pure-play vendor Rigetti Computing. In this competitive arena, Finland-headquartered IQM Quantum Computers has carved out a distinct market position by emphasizing verified physical machine deliveries rather than exclusive cloud access. By August 2026, IQM reported 26 total systems sold and 17 delivered globally, highlighted by its milestone delivery to the US Department of Energy's Oak Ridge National Laboratory. IQM maintains a vertically integrated operational model encompassing proprietary chip design, in-house cleanroom fabrication facilities in Finland, dilution refrigeration packaging, and software control stacks. This contrasts with fabless quantum startups and positions IQM to serve sovereign research institutions and supercomputing centers seeking direct infrastructure ownership."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP005"
      - "CP006"
      - "CP009"
      - "CP014"
    tableRefs:
      - "TP001"
  - id: "technical-and-architectural-differentiation"
    title: "Architectural Differentiation and Error-Correction Strategies"
    body: "Differentiation among quantum hardware manufacturers increasingly centers on quantum error correction (QEC) efficiency and processor connectivity rather than raw physical qubit counts. Traditional superconducting architectures, such as IBM's heavy-hexagonal lattice, limit physical qubit interactions to two or three nearest neighbors, requiring substantial physical-to-logical qubit overhead when implementing standard surface codes. In contrast, IQM has introduced its Constellation processor topology featuring enhanced planar connectivity where individual qubits natively interact with up to 12 neighboring qubits. To exploit this hardware design, IQM developed proprietary 'barbell codes' belonging to the quantum low-density parity-check (QLDPC) family. By connecting planar clusters through long couplers without requiring complex crossing wiring, IQM projects achieving logical error rates up to three orders of magnitude lower than conventional surface codes while requiring up to eight times fewer physical qubits. Concurrently, trapped-ion competitors like Quantinuum offer all-to-all connectivity and superior raw gate fidelities but suffer from millisecond-scale gate latencies compared to transmon nanosecond speeds."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP006"
      - "CP007"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "packaging-pricing-and-switching-dynamics"
    title: "Deployment Models, Pricing Structures, and Customer Switching Costs"
    body: "Commercial go-to-market execution diverges sharply between public cloud providers and on-premise hardware vendors. While IBM, Google, and Rigetti prioritize multi-tenant cloud platforms accessible through web APIs and hyperscaler marketplaces, IQM focuses primarily on on-premises system sales. Its tiered product portfolio includes the educational 5-qubit IQM Spark, the enterprise and HPC-oriented IQM Radiance offering 20 to 150 qubits, and the dedicated QEC exploration system IQM Halocene. Capital equipment purchases require multi-million-euro upfront commitments alongside recurring maintenance agreements, creating substantial budgetary and procedural friction. However, once installed in high-performance computing facilities such as Germany's Leibniz Supercomputing Centre or Finland's CSC, on-premises machines establish high switching barriers. Early enterprise and scientific adopters invest heavily in pulse-level calibration, hybrid classical-quantum scheduling pipelines, and proprietary algorithmic workflows, making displacement by remote cloud queues contractually and operationally unattractive."
    claimRefs:
      - "CP005"
      - "CP007"
      - "CP008"
      - "CP010"
      - "CP014"
    tableRefs:
      - "TP003"
  - id: "moat-durability-and-scaling-risks"
    title: "Moat Durability, Scaling Bottlenecks, and Adverse Displacement Risks"
    body: "Despite early sovereign procurement momentum, IQM faces significant long-term moat durability risks stemming from both physical constraints and incumbent scale. Superconducting transmon qubits are fundamentally constrained by finite coherence times spanning 50 to 200 microseconds, demanding continuous error correction cycles before accumulated noise corrupts computation. Furthermore, operating at dilution refrigerator temperatures near 10 millikelvin imposes severe thermal management and cabling bottlenecks as physical input-output lines multiply. As IQM progresses from 20-qubit prototypes toward 150-qubit monolithic processors and 300-qubit modular dual-chip configurations, fabrication uniformity represents an acute risk: a single microscopic junction defect can disable critical coupling paths and impair QLDPC syndrome extraction. Additionally, if US incumbents with superior balance sheets achieve modular multi-thousand-qubit fault-tolerant systems ahead of schedule, IQM's geographic defensibility in European sovereign computing centers may prove insufficient to preserve commercial premium pricing."
    claimRefs:
      - "CP011"
      - "CP012"
      - "CP013"
      - "CP015"
