chapter:
  number: 6
  title: "Customers"
  summary: "IQM leads European on-premises quantum hardware with 26 systems sold, 17 delivered, and an order backlog exceeding EUR 102 million across tier-one supercomputing centers like LRZ, CINECA, and CSC LUMI. However, customer adoption is heavily concentrated in publicly funded EuroHPC institutions with 1.5-to-2-year installation recognition cycles, leaving private enterprise adoption and recurring cloud software retention largely unproven."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Buyer Economics"
    body: "IQM Quantum Computers has organized its commercial go-to-market around on-premises physical hardware delivery rather than metered quantum cloud access. In audited fiscal year 2025 results, on-premises system sales accounted for EUR 30.6 million out of EUR 31.3 million in total revenue (over 97 percent), with cloud access contributing only EUR 0.3 million. This scientific-instrument economic profile dictates a customer base structured primarily into three institutional tiers: sovereign supercomputing centers, academic research institutes, and early commercial enterprise experimenters. Sovereign high-performance computing (HPC) facilities, funded through EuroHPC Joint Undertaking consortia and national science ministries, represent IQM's highest-value buyer segment, purchasing multi-qubit systems such as the 54-qubit Radiance and 150-qubit Halocene. Academic institutions, exemplified by the VTT Technical Research Centre in Finland, utilize smaller 5-qubit Spark and 20-qubit systems for basic quantum physics education and algorithms exploration. Commercial enterprise adoption remains in its infancy: while transportation leader Deutsche Bahn has explored hybrid quantum-classical train scheduling algorithms on IQM hardware, and Poland's Galaxy Systemy Informatyczne placed an enterprise hardware order, commercial buyers represent a small minority of commitments. Market interest in on-premises systems remains supported by broader trends, as an Atos-IQM study showed 76 percent of global HPC centers planning quantum adoption, yet conversion outside subsidized sovereign budgets remains unvalidated."
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
    tableRefs:
      - TU001
  - id: "adoption-trajectory-backlog"
    title: "System Deliveries, Order Backlog, and Commercial Trajectory"
    body: "Commercial traction for IQM centers on physical system delivery velocity and confirmed order commitments rather than software recurring revenue. By mid-2026, IQM reported 26 full-stack quantum computers sold and 17 delivered globally since founding, expanding from 21 sold and 15 delivered across 13 customer accounts at the time of its initial public combination announcement. This hardware shipment cadence represents the largest deployed on-premises superconducting installed base globally among direct peers. Commercial momentum is reinforced by a confirmed order backlog that expanded from EUR 67.3 million at year-end 2025 to EUR 69.1 million as of June 30, 2026, and surged to over EUR 102.1 million by August 2026 following major EuroHPC contract wins. The company has guided full-year 2026 revenue to EUR 42 million to EUR 47 million, supported by an order intake target of EUR 65 million to EUR 75 million. Nevertheless, because on-premises systems are recognized against rigorous site delivery, cryogenic cooldown, and acceptance-testing milestones that span 18 to 24 months, financial conversion is heavily back-weighted toward the fourth quarter of each fiscal year. Slipped commissioning or delayed customer facility readiness on even a single machine creates material quarterly revenue volatility."
    claimRefs:
      - CU001
      - CU002
      - CU011
    tableRefs:
      - TU002
  - id: "named-customer-deployments"
    title: "Named Deployments, HPC Integration, and Institutional Validation"
    body: "IQM's verified customer footprint is anchored by premier European high-performance computing centers and national scientific laboratories. In Germany, the Leibniz Supercomputing Centre (LRZ) operates four on-premises IQM systems, including a 20-qubit Q-Exa system integrated with the SuperMUC-NG supercomputer. LRZ serves as the premier production testbed for IQM's turnkey HPC Integration Service, which enables quantum processors to operate as native Slurm compute nodes managed alongside classical CPU and GPU clusters via the open-source Quantum Device Management Interface. In Finland, CSC selected IQM to deploy a 150-qubit Halocene H4 system connected directly to the LUMI AI Factory under a EUR 33 million EuroHPC contract. Founding partner VTT has completed multi-stage deployments from 5 to 50 qubits and holds orders for 150- and 300-qubit systems. In Italy, CINECA hosts a 54-qubit Radiance system named NOX alongside the Leonardo supercomputer. Beyond Europe, IQM executed its first United States delivery to the Department of Energy's Oak Ridge National Laboratory in June 2026, and partnered with TOYO Corporation under an exclusive distribution agreement to market Spark and Radiance systems across Japan. Poland's Galaxy Systemy Informatyczne represents IQM's first private-sector enterprise hardware sale, with delivery targeted for late 2026."
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU003
    figureRefs:
      - FU001
  - id: "retention-durability-concentration"
    title: "Customer Concentration, Procurement Friction, and Retention Risks"
    body: "Despite leading physical delivery counts, IQM's customer franchise faces acute concentration and durability vulnerabilities. Because over 97 percent of revenues stem from one-off on-premises hardware sales, the business is exposed to policy-driven public procurement cycles rather than organic commercial expansion. EuroHPC Joint Undertaking consortia, national research ministries, and European state-backed labs constitute the vast majority of IQM's backlog. These public institutional buyers operate on multi-year political budget appropriations that do not guarantee recurring follow-on purchases once an initial system is installed. Commercial durability is further clouded by the absence of published net revenue retention (NRR), gross revenue retention (GRR), or software license renewal metrics across deployed sites. The Resonance cloud platform generated just EUR 0.3 million in FY2025, demonstrating that ongoing usage-based consumption has not yet emerged as a meaningful revenue pillar. Furthermore, expanding hardware deliveries across international borders introduces severe regulatory friction: multilateral export controls enacted in late 2024 and 2025 on quantum processors, cryogenic refrigeration, and parametric amplifiers restrict IQM's ability to sell freely into Asian and other non-allied markets without sovereign licensing approvals."
    claimRefs:
      - CU012
      - CU013
