callouts:
  - calloutType: "risk"
    title: "Sovereign Customer Concentration and Long Recognition Cycles"
    body: "IQM's commercial foundation is differentiated by 17 delivered physical systems, but over 97% of revenue remains tied to on-premises capital instrument sales primarily funded by European government and supercomputing budgets. With typical installation and milestone-based revenue recognition cycles spanning 1.5 to 2 years, quarterly financial performance is vulnerable to single-site commissioning delays, while recurring software and cloud revenue (EUR 0.3 million in FY2025) has yet to demonstrate self-sustaining commercial adoption outside subsidized policy environments."
    claimRefs:
      - CU012
      - CU013
