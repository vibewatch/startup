sections:
  - id: "legal-tax-and-transaction-risks"
    title: "Legal, Tax, and Transaction Structure Risks"
    body: "IQM's transition to a publicly traded entity via its merger with Real Asset Acquisition Corp. (RAAQ) at a $1.8 billion pre-money equity valuation introduces acute regulatory, tax, and structural transaction risks. Foremost among public market concerns is the company's potential classification as a Passive Foreign Investment Company (PFIC) under United States tax law. Independent equity research from Seeking Alpha highlighted that because IQM holds substantial liquid cash reserves relative to near-term active operating revenues, US taxable investors could face onerous excess distribution regimes, triggering a public Sell recommendation. Furthermore, the de-SPAC transaction structure remains vulnerable to public trust account shareholder redemptions ahead of closing. While the transaction model anticipated over $450 million in gross cash proceeds supported by PIPE investments and trust funds, elevated redemption rates would materially compress net delivered capital, forcing the company to rely prematurely on secondary offerings or European sovereign credit lines."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
    tableRefs:
      - "TR001"
  - id: "operational-fabrication-and-reliability-risks"
    title: "Operational Execution, Fabrication, and Hardware Reliability"
    body: "Operating full-stack superconducting quantum infrastructure entails complex fabrication precision, cryogenic maintenance, and ongoing hardware reliability challenges across distributed customer environments. Field deployments have encountered tangible operational disruptions, such as reported hardware issues with an on-premises IQM installation at the Leibniz Supercomputing Centre in Munich. Although IQM mitigated immediate downtime by routing university researchers to its cloud service without interrupting computational workflows, on-site hardware failures highlight maintenance liabilities as installations scale. Operationally, IQM is committing over EUR 40 million to double cleanroom capacity at its proprietary fab in Espoo, Finland, targeting annual production of up to 30 full-stack quantum computers. However, relying on a single specialized fabrication cleanroom creates an unmitigated operational single point of failure. Concurrently, technical execution toward the company's 2030 fault-tolerant roadmap hinges on scaling novel directional tile codes that demonstrated a thousandfold error reduction at 30 physical qubits per logical qubit on Crystal processors."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR002"
  - id: "financial-burn-and-partner-dependencies"
    title: "Financial Burn Runway and Partner Dependencies"
    body: "IQM's financial profile is characterized by steep commercialization expenditures and ongoing operating cash drain. For the first half of 2026, the company generated revenues of EUR 8.9 million while incurring an operating loss of EUR 60.5 million, reflecting substantial R&D investments, manufacturing buildout, and public listing overhead. Although cash reserves of EUR 309.4 million as of July 2, 2026 provide liquidity through the second quarter of 2028, sustaining this runway requires converting its record EUR 102.1 million order backlog into recognized milestone payments. Severe partner and customer concentration compounds these financial dynamics. Commercial traction remains overwhelmingly anchored to sovereign entities, national laboratories, and academic high-performance computing centers such as Oak Ridge National Laboratory, LRZ, and CSC. Furthermore, assembly operations depend heavily on single-source suppliers for dilution cryostats, sub-Kelvin microwave electronics, and semiconductor consumables, exposing delivery schedules to external supply chain disruptions."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR010"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
  - id: "risk-matrix-and-thesis-break-monitoring"
    title: "Risk Heatmap, Thesis-Break Triggers, and Kill Criteria"
    body: "To govern investment risk, institutional allocators must track explicit monitoring indicators and thesis-break kill criteria. The structured risk matrix maps IQM's top vulnerabilities across likelihood and severity dimensions. Primary thesis-break triggers include: first, net SPAC redemption rates exceeding 70% without compensatory equity backstops, which would deplete closing cash; second, annualized operating cash burn exceeding EUR 130 million without an inflection in half-year commercial deliveries; third, adverse IRS determination confirming PFIC status without qualified electing fund reporting, triggering institutional equity liquidations; and fourth, extended cleanroom downtime at the Espoo fabrication facility that halts physical system completions. If sovereign customer procurement cycles stall or delivery acceptance delays push backlog conversion past 2028, IQM's capital runway would compress rapidly, necessitating dilutive emergency recapitalizations. Continuous due diligence on customer acceptance schedules, export licenses, and QEF tax filings is essential to evaluate risk-adjusted holding viability."
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR007"
      - "CR008"
      - "CR015"
    figureRefs:
      - "FR001"
