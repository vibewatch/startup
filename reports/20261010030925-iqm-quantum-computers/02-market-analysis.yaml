  evidenceGaps:
    - type: missing-source
      severity: material
      topic: revenue-segmentation
      missingEvidence: Disaggregated disclosure of recurring maintenance, software license, and service revenues versus one-time on-premises system sales.
      whyItMatters: Without clean separation of recurring software/maintenance revenue from capital hardware deliveries, calculating net revenue retention and lifetime customer value for valuation modeling remains impossible.
      diligencePath: Request customer-level revenue schedules and contract line-item breakdowns from IQM's investor relations and interim statutory filings.
      relatedQuestionRefs:
        - QM009
    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: Standardized market sizing methodology reconciling broad multi-hundred-billion-dollar economic value projections with near-term NISQ hardware procurement budgets.
      whyItMatters: Top-down consultancy estimates vastly outpace actual transacted deal volume ($2.6B across 121 deals over 5 years), creating valuation vulnerability if investor expectations rely on ungrounded TAM numbers.
      diligencePath: Benchmark bottom-up procurement records from EuroHPC, national supercomputing facilities, and US DOE centers against vendor contract announcements.
      relatedQuestionRefs:
        - QM005
