      - Relevance to IQM Architecture
    rows:
      - - On-Premises Quantum Accelerators
        - Full-stack cryogenic dilution refrigerators, superconducting QPU processors, microwave control electronics, and site installation.
        - Third-party civil facility construction, ambient power distribution, and general data center real estate.
        - National supercomputing centers, government laboratories, and sovereign HPC facilities.
        - Core revenue engine representing over 97% of FY2025 recognized sales and current contracted backlog.
      - - Quantum Cloud & QPU-as-a-Service
        - Time-shared API access to remote superconducting QPUs, cloud execution credits, and managed runtime support.
        - Enterprise public cloud compute (AWS, Azure, GCP classical instances) and network egress fees.
        - Corporate R&D teams, academic researchers, and exploratory algorithm developers.
        - Secondary exploration channel (IQM Resonance) providing user funnel and algorithm prototyping with minimal FY2025 revenue.
      - - Co-Design & Application Systems
        - Tailored QPU processor topologies, application-specific chip designs, and joint quantum-classical algorithm optimization.
        - General-purpose enterprise IT consulting and unintegrated third-party software licenses.
        - Specialized industrial clients (automotive, aerospace, rail) and targeted research consortia.
        - High-margin strategic co-development contracts (e.g. Q-Exa, VTT partnership) driving IP generation.
      - - Quantum Software & Algorithm Tooling
        - Low-level quantum compilation libraries, pulse-level calibration software, and hybrid classical HPC orchestration.
        - Standalone commercial software applications without hardware co-optimization.
        - Computational scientists, software developers, and multidisciplinary modeling teams.
        - Enabling integration layer required for hybrid CPU-GPU-QPU operation, though rarely monetized as a standalone SKU.
    notes: Market boundaries delineate hardware capital expenditure from cloud utility services and classical HPC infrastructure based on FY2025 revenue reporting.
