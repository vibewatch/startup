callouts:
  - calloutType: insight
    title: On-Premises Supercomputing Focus Shields IQM from Hyperscaler Cloud Dominance
    body: By prioritizing on-premises installations for sovereign and supercomputing centers, IQM targets customers for whom public cloud access is unacceptable due to security, control, and national sovereignty mandates. This positioning provides high contract values and capital efficiency per booking, although it introduces quarterly revenue lumpiness and long sales cycles.
    claimRefs:
      - CM006
      - CM007
      - CM009
  - calloutType: risk
    title: Downside Revisions to NISQ Economic Potential Highlight Valuation Sensitivity
    body: Consultancy models such as BCG have acknowledged that near-term NISQ value realization assumptions were overly optimistic due to classical algorithmic competition and hardware noise. For vendors whose recognized revenue currently derives entirely from NISQ systems, long-term valuation depends heavily on transitioning to fault-tolerant systems by 2030.
    claimRefs:
      - CM001
      - CM002
      - CM015
