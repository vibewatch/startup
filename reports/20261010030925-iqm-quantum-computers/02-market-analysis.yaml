chapter:
  number: 2
  title: Market Analysis
  summary: IQM competes primarily within the capital-intensive on-premises quantum hardware market, delivering full-stack superconducting processors to European supercomputing centers and sovereign research institutions. While long-term consultancy projections model quantum economic value creation between $450 billion and $850 billion by 2040, commercial deployment remains anchored in public-sector procurement, where IQM has converted sovereign infrastructure funding into over EUR 102 million in qualified contract backlog.
sections:
  - id: market-boundary-and-scope
    title: Market Boundary and Scope of Spend
    body: Defining the addressable market for quantum computing requires distinguishing between physical hardware procurement, cloud-hosted quantum processing, and adjacent classical computing spend. IQM focuses almost exclusively on on-premises full-stack superconducting quantum computer installations [CM006]. This model bundles the physical quantum processing unit (QPU), cryogenic dilution refrigeration, high-density microwave control cabling, and low-level pulse control electronics into an integrated appliance installed directly inside supercomputing and enterprise data centers [CM006, CM009]. In fiscal year 2025, on-premises system deliveries represented EUR 30.6 million of IQM's EUR 31.3 million recognized revenue, with cloud time-sharing and co-development services contributing just EUR 0.3 million each [CM007]. Excluded from this boundary are peripheral data center facility build-outs, general-purpose classical server clusters, and standalone algorithmic consulting [CM001]. While public hyperscalers market remote cloud access, institutions with strict data sovereignty mandates require physical on-premises ownership [CM009].
    claimRefs:
      - CM001
      - CM006
      - CM007
      - CM009
    tableRefs:
      - TM001
  - id: market-sizing-across-analytical-lenses
    title: Market Sizing Across Multiple Analytical Lenses
    body: 'Market sizing estimates for quantum computing vary by orders of magnitude depending on whether an analysis measures theoretical end-user value creation, total supplier addressable market, or empirical hardware procurement transactions [CM001]. Macroeconomic consultancy models project vast long-term markets: Boston Consulting Group estimates that quantum computing will unlock $450 billion to $850 billion in end-user economic value by 2040, supporting a $90 billion to $170 billion supplier market for hardware and software providers [CM001]. McKinsey & Company similarly forecasts quantum computing revenues of $28 billion to $72 billion by 2035 across commercial industry verticals [CM003]. However, near-term commercial realities are far more constrained. BCG explicitly revised its near-term NISQ-era expectations downward, acknowledging that hardware fidelity bottlenecks and rapid performance gains in classical GPU-based algorithms have pushed back payback timelines [CM002]. A joint study by Omdia and IQM projected a global quantum market of $22 billion by 2032 as commercial enterprise deployments accelerate [CM004]. Empirical contract tracking underscores this gradual ramp: the State of Quantum report documented 121 public quantum contracts executed globally between 2021 and 2026, totaling $2.6 billion in deal value across more than 50 systems co-deployed with supercomputers in 14 countries [CM005]. IQM''s commercial traction reflects this hardware-centric reality, demonstrated by its qualified contract backlog expanding beyond EUR 102 million in August 2026, anchored by a EUR 33 million contract to deliver a 150-qubit system to the CSC LUMI supercomputer [CM008].'
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM008
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-segmentation-and-workflows
    title: Buyer Segmentation, Workflow, and Budget Ownership
    body: Institutional buyers for on-premises quantum hardware divide into four distinct segments characterized by disparate procurement authorities, budget cycles, and operational workflows [CM006]. Tier-one supercomputing centers represent IQM's primary commercial base, where capital expenditure is approved through national scientific ministries and joint intergovernmental programs such as EuroHPC [CM014]. In these environments, system administrators and computational physicists operate the QPU as a specialized quantum accelerator integrated directly into high-performance computing clusters [CM006, CM008]. Sovereign and national defense laboratories constitute a second core segment, driven by urgent data security priorities, post-quantum cryptographic resilience, and statutory prohibitions against routing sensitive research through commercial public clouds [CM009]. A third developing segment includes industrial enterprise research organizations in pharmaceuticals, chemicals, and automotive engineering, where computational chemistry and molecular simulation represent primary use cases [CM012]. Industry survey data indicates that 57 percent of prospective quantum adopters rank drug discovery and molecular modeling as their highest-priority application [CM012]. Finally, university consortia acquire smaller-scale educational QPUs to develop quantum engineering talent [CM006]. Across all segments, IQM has demonstrated institutional penetration, having sold systems to 13 customers, including four of the world's top ten supercomputing facilities [CM013].
    claimRefs:
      - CM006
      - CM008
      - CM009
      - CM012
      - CM013
      - CM014
    tableRefs:
      - TM003
  - id: adoption-drivers-and-systemic-constraints
    title: Growth Drivers and Adoption Constraints
    body: The expansion of the on-premises quantum computing market is propelled by structural demand for computational acceleration and national sovereignty initiatives, yet it remains hindered by severe technical and organizational bottlenecks [CM009, CM010]. On the demand side, European governments have recognized technological sovereignty as an existential security imperative, funneling capital toward domestic hardware champions to mitigate dependence on foreign computing platforms [CM014]. Furthermore, the convergence of quantum processors with classical GPU-accelerated computing creates a hybrid computational pipeline, allowing complex mathematical subroutines to be offloaded to quantum hardware [CM006]. Conversely, commercial adoption faces three critical headwinds documented by industry practitioners [CM010]. First, 75 percent of enterprise respondents identify defining clear commercial business applications as the single greatest barrier to adoption [CM011]. Second, severe global talent shortages and fragmented software development kits prevent enterprise IT organizations from establishing portable, production-grade quantum workflows [CM010]. Third, the capital intensity of cryogenic hardware and prolonged 12 to 24 month procurement cycles create revenue lumpiness and execution risks for system vendors [CM015].
    claimRefs:
      - CM006
      - CM009
      - CM010
      - CM011
      - CM014
      - CM015
  - id: market-sizing-diligence-gaps
    title: Diligence Gaps and Commercial Verification Path
    body: Independent diligence into quantum computing market dynamics reveals substantial analytical gaps between reported contractual backlog and long-term economic sustainability [CM008, CM015]. Primary among these is the lack of public disclosure regarding recurring software licensing and hardware maintenance renewals versus non-recurring system buildouts [CM007]. Because IQM's recognized revenue historically consists almost entirely of one-time hardware deliveries, estimating post-warranty recurring cash flows and customer lifetime value requires private access to customer maintenance contracts [CM007]. Furthermore, because headline market sizes in equity research rely heavily on long-range consultancy scenarios that have already undergone downward revisions, investors must carefully scrutinize the timing of fault-tolerant hardware transitions [CM002]. Upcoming disclosures, including IQM's scheduled interim financial reporting on November 5, 2026, provide the nearest empirical checkpoint to audit gross margin progression, cash consumption, and delivery conversion rates against contracted backlog targets [CM008, CM015].
    claimRefs:
      - CM002
      - CM007
      - CM008
      - CM015
tables:
