      - - Cryogenic Dilution Subsystem
        - Cools QPUs to 4 K and maintains internal base temperature below 10 mK
        - Bluefors dilution refrigerators, helium compressors, and gas-handling systems
        - Supply chain concentration, helium availability, vibration coupling, and compressor failure
