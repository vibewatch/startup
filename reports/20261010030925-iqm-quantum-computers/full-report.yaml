      - number: '8.4'
        title: Diligence Priorities, Audit Gaps, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              A disciplined investment stance requires resolving several critical evidence gaps before considering any
              rating upgrade from research-more to buy. Primary diligence priorities include obtaining audited FY2025
              and interim FY2026 IFRS financial statements to confirm gross profit margins by revenue stream, hardware
              depreciation schedules, and true operating cash flow dynamics. Additionally, investors must evaluate
              customer concentration within the €102.1 million order backlog, assessing the proportion of revenue tied
              to single sovereign grants and verifying contractual acceptance milestones. Definitive thesis-break
              triggers that would prompt a downgrade to avoid include any downward revision of FY2026 revenue guidance
              below €38 million, quarterly order intake falling below €15 million, unmitigated hardware installation
              delays exceeding six months at marquee accounts, or quarterly cash burn accelerating beyond €35 million.
              Conversely, an upgrade to buy would require two consecutive quarters of revenue conversion meeting guided
              targets alongside audited gross margins stabilizing above 50%.
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV012
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Disciplined Stance: Research-More Maintained Ahead of FY2026 Financial Audits'
            body: >-
              While IQM demonstrates significant technological differentiation through on-premises HPC integration and
              proprietary error mitigation, the $1.8B listing valuation represents a steep 51x multiple on unaudited
              2025 revenue. Investors should maintain a research-more stance until full FY2026 audited financials
              confirm gross margin sustainability and backlog conversion velocity.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV011
