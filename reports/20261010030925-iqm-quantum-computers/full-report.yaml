  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Delivery Models
        blocks:
          - type: paragraph
            body: >-
              IQM Quantum Computers commercializes full-stack superconducting quantum hardware and software, targeting
              high-performance computing centers, national scientific laboratories, and academic institutions. Rather
              than relying exclusively on cloud-hosted multi-tenant infrastructure, IQM emphasizes an on-premises
              deployment framework termed Production Quantum, enabling institutional customers to directly own, operate,
              and integrate quantum processing hardware into their sovereign computing centers. The company's hardware
              portfolio is segmented across distinct deployment tiers: IQM Spark provides a compact 5-qubit
              superconducting system designed for university education and algorithmic research; IQM Radiance serves
              high-performance computing installations with scalable configurations spanning 20, 54, and 150 qubits; and
              IQM Halocene is engineered as an open hardware platform dedicated to quantum error-correction
              experimentation. Complementing its physical hardware sales, IQM operates Resonance, a quantum cloud
              service that provides remote access to physical QPUs on a metered QPU-second billing model. Commercial
              delivery traction reached 17 completed system installations and 26 cumulative systems sold globally as of
              August 2026, anchoring IQM's positioning as Europe's leading commercial builder of superconducting quantum
              systems.
