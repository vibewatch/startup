        - IQM is established as Europe's premier on-premises quantum hardware supplier for supercomputing centers.
        - 26 systems sold and 17 delivered globally, including LUMI AI Factory and Oak Ridge National Lab.
        - Loss of European sovereign procurement priority or failure to deliver next-generation systems.
      - - 'Thesis: Backlog and Revenue Trajectory'
        - Order backlog expansion to €102.1M provides multi-year revenue visibility for system deliveries.
        - Backlog expanded by €33.0M between June 30 and August 3, 2026; FY2026 revenue guided at €42M-€47M.
        - Cancellations or delivery deferrals of contracted systems reducing recognized revenue conversion.
      - - 'Anti-Thesis: Valuation Multiple Premium'
        - $1.8B equity valuation represents an extreme premium relative to early commercial quantum revenue.
        - Implies ~51x trailing 2025 revenue ($35M) and ~34x-38x FY2026 guided revenue range.
        - Sustained revenue acceleration exceeding €100M ARR with gross margins above 60%.
      - - 'Anti-Thesis: Heavy Operating Loss Burn'
        - Current cost structure generates substantial losses relative to realized hardware revenue.
        - H1 2026 operating loss of €60.5M on €8.9M revenue implies annualized burn above €120M.
        - Demonstrated operating leverage with manufacturing scale halving operating losses within 24 months.
