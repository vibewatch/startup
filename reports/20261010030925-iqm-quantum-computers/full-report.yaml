        title: Exhibits
        blocks:
          - type: callout
            title: Defensible On-Premises HPC Integration Model
            body: >-
              IQM's verified track record of delivering 17 customer-owned quantum systems into sovereign supercomputing
              facilities provides sticky, long-term hardware integrations that differentiate it from pure cloud-access
              quantum peers.
            calloutType: strength
            claimRefs:
