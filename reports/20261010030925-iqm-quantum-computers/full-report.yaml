        blocks:
          - type: paragraph
            body: >-
              IQM Quantum Computers has organized its commercial go-to-market around on-premises physical hardware
              delivery rather than metered quantum cloud access. In audited fiscal year 2025 results, on-premises system
              sales accounted for EUR 30.6 million out of EUR 31.3 million in total revenue (over 97 percent), with
              cloud access contributing only EUR 0.3 million. This scientific-instrument economic profile dictates a
              customer base structured primarily into three institutional tiers: sovereign supercomputing centers,
              academic research institutes, and early commercial enterprise experimenters. Sovereign high-performance
              computing (HPC) facilities, funded through EuroHPC Joint Undertaking consortia and national science
              ministries, represent IQM's highest-value buyer segment, purchasing multi-qubit systems such as the
              54-qubit Radiance and 150-qubit Halocene. Academic institutions, exemplified by the VTT Technical Research
              Centre in Finland, utilize smaller 5-qubit Spark and 20-qubit systems for basic quantum physics education
              and algorithms exploration. Commercial enterprise adoption remains in its infancy: while transportation
              leader Deutsche Bahn has explored hybrid quantum-classical train scheduling algorithms on IQM hardware,
              and Poland's Galaxy Systemy Informatyczne placed an enterprise hardware order, commercial buyers represent
              a small minority of commitments. Market interest in on-premises systems remains supported by broader
              trends, as an Atos-IQM study showed 76 percent of global HPC centers planning quantum adoption, yet
              conversion outside subsidized sovereign budgets remains unvalidated.
