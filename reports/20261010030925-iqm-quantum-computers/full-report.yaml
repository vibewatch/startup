      - number: '8.2'
        title: Evaluation of Core Thesis and Downside Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The affirmative investment thesis for IQM rests on its differentiated position as Europe's leading
              provider of full-stack superconducting quantum systems for sovereign high-performance computing centers.
              With 26 quantum computers sold and 17 delivered globally, including integrations at the LUMI AI Factory
              and Oak Ridge National Laboratory, IQM has demonstrated verified on-premises delivery capability where
              customers retain operational sovereignty. The expansion of IQM's order backlog to over €102.1 million in
              August 2026 reinforces near-term demand visibility across research institutions. Conversely, the
              structural anti-thesis emphasizes that IQM's revenue base remains highly concentrated in public-sector and
              academic environments with elongated procurement cycles. More critically, the company reported an
              operating loss of €60.5 million on just €8.9 million in revenue for the first half of 2026. This stark
              asymmetry between top-line recognition and structural operating expenses underscores that IQM is burning
              capital at an annualized rate exceeding €120 million. Without a demonstrated inflection in manufacturing
              gross margins and accelerated commercial delivery sign-offs, the valuation multiple remains vulnerable to
              downward repricing.
