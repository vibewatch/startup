  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope of Spend
        blocks:
          - type: paragraph
            body: >-
              Defining the addressable market for quantum computing requires distinguishing between physical hardware
              procurement, cloud-hosted quantum processing, and adjacent classical computing spend. IQM focuses almost
              exclusively on on-premises full-stack superconducting quantum computer installations [CM006]. This model
              bundles the physical quantum processing unit (QPU), cryogenic dilution refrigeration, high-density
              microwave control cabling, and low-level pulse control electronics into an integrated appliance installed
              directly inside supercomputing and enterprise data centers [CM006, CM009]. In fiscal year 2025,
              on-premises system deliveries represented EUR 30.6 million of IQM's EUR 31.3 million recognized revenue,
              with cloud time-sharing and co-development services contributing just EUR 0.3 million each [CM007].
              Excluded from this boundary are peripheral data center facility build-outs, general-purpose classical
              server clusters, and standalone algorithmic consulting [CM001]. While public hyperscalers market remote
              cloud access, institutions with strict data sovereignty mandates require physical on-premises ownership
              [CM009].
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM009
      - number: '2.2'
        title: Market Sizing Across Multiple Analytical Lenses
        blocks:
          - type: paragraph
            body: >-
              Market sizing estimates for quantum computing vary by orders of magnitude depending on whether an analysis
              measures theoretical end-user value creation, total supplier addressable market, or empirical hardware
              procurement transactions [CM001]. Macroeconomic consultancy models project vast long-term markets: Boston
              Consulting Group estimates that quantum computing will unlock $450 billion to $850 billion in end-user
              economic value by 2040, supporting a $90 billion to $170 billion supplier market for hardware and software
              providers [CM001]. McKinsey & Company similarly forecasts quantum computing revenues of $28 billion to $72
              billion by 2035 across commercial industry verticals [CM003]. However, near-term commercial realities are
              far more constrained. BCG explicitly revised its near-term NISQ-era expectations downward, acknowledging
              that hardware fidelity bottlenecks and rapid performance gains in classical GPU-based algorithms have
              pushed back payback timelines [CM002]. A joint study by Omdia and IQM projected a global quantum market of
              $22 billion by 2032 as commercial enterprise deployments accelerate [CM004]. Empirical contract tracking
              underscores this gradual ramp: the State of Quantum report documented 121 public quantum contracts
              executed globally between 2021 and 2026, totaling $2.6 billion in deal value across more than 50 systems
              co-deployed with supercomputers in 14 countries [CM005]. IQM's commercial traction reflects this
              hardware-centric reality, demonstrated by its qualified contract backlog expanding beyond EUR 102 million
              in August 2026, anchored by a EUR 33 million contract to deliver a 150-qubit system to the CSC LUMI
              supercomputer [CM008].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM007
              - CM008
      - number: '2.3'
        title: Buyer Segmentation, Workflow, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Institutional buyers for on-premises quantum hardware divide into four distinct segments characterized by
              disparate procurement authorities, budget cycles, and operational workflows [CM006]. Tier-one
              supercomputing centers represent IQM's primary commercial base, where capital expenditure is approved
              through national scientific ministries and joint intergovernmental programs such as EuroHPC [CM014]. In
              these environments, system administrators and computational physicists operate the QPU as a specialized
              quantum accelerator integrated directly into high-performance computing clusters [CM006, CM008]. Sovereign
              and national defense laboratories constitute a second core segment, driven by urgent data security
              priorities, post-quantum cryptographic resilience, and statutory prohibitions against routing sensitive
              research through commercial public clouds [CM009]. A third developing segment includes industrial
              enterprise research organizations in pharmaceuticals, chemicals, and automotive engineering, where
              computational chemistry and molecular simulation represent primary use cases [CM012]. Industry survey data
              indicates that 57 percent of prospective quantum adopters rank drug discovery and molecular modeling as
              their highest-priority application [CM012]. Finally, university consortia acquire smaller-scale
              educational QPUs to develop quantum engineering talent [CM006]. Across all segments, IQM has demonstrated
              institutional penetration, having sold systems to 13 customers, including four of the world's top ten
              supercomputing facilities [CM013].
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The expansion of the on-premises quantum computing market is propelled by structural demand for
              computational acceleration and national sovereignty initiatives, yet it remains hindered by severe
              technical and organizational bottlenecks [CM009, CM010]. On the demand side, European governments have
              recognized technological sovereignty as an existential security imperative, funneling capital toward
              domestic hardware champions to mitigate dependence on foreign computing platforms [CM014]. Furthermore,
              the convergence of quantum processors with classical GPU-accelerated computing creates a hybrid
              computational pipeline, allowing complex mathematical subroutines to be offloaded to quantum hardware
              [CM006]. Conversely, commercial adoption faces three critical headwinds documented by industry
              practitioners [CM010]. First, 75 percent of enterprise respondents identify defining clear commercial
              business applications as the single greatest barrier to adoption [CM011]. Second, severe global talent
              shortages and fragmented software development kits prevent enterprise IT organizations from establishing
              portable, production-grade quantum workflows [CM010]. Third, the capital intensity of cryogenic hardware
              and prolonged 12 to 24 month procurement cycles create revenue lumpiness and execution risks for system
              vendors [CM015].
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
      - number: '2.5'
        title: Diligence Gaps and Commercial Verification Path
        blocks:
          - type: paragraph
            body: >-
              Independent diligence into quantum computing market dynamics reveals substantial analytical gaps between
              reported contractual backlog and long-term economic sustainability [CM008, CM015]. Primary among these is
              the lack of public disclosure regarding recurring software licensing and hardware maintenance renewals
              versus non-recurring system buildouts [CM007]. Because IQM's recognized revenue historically consists
              almost entirely of one-time hardware deliveries, estimating post-warranty recurring cash flows and
              customer lifetime value requires private access to customer maintenance contracts [CM007]. Furthermore,
              because headline market sizes in equity research rely heavily on long-range consultancy scenarios that
              have already undergone downward revisions, investors must carefully scrutinize the timing of
              fault-tolerant hardware transitions [CM002]. Upcoming disclosures, including IQM's scheduled interim
              financial reporting on November 5, 2026, provide the nearest empirical checkpoint to audit gross margin
              progression, cash consumption, and delivery conversion rates against contracted backlog targets [CM008,
              CM015].
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM015
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: On-Premises Supercomputing Focus Shields IQM from Hyperscaler Cloud Dominance
            body: >-
              By prioritizing on-premises installations for sovereign and supercomputing centers, IQM targets customers
              for whom public cloud access is unacceptable due to security, control, and national sovereignty mandates.
              This positioning provides high contract values and capital efficiency per booking, although it introduces
              quarterly revenue lumpiness and long sales cycles.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM009
          - type: callout
            title: Downside Revisions to NISQ Economic Potential Highlight Valuation Sensitivity
            body: >-
              Consultancy models such as BCG have acknowledged that near-term NISQ value realization assumptions were
              overly optimistic due to classical algorithmic competition and hardware noise. For vendors whose
              recognized revenue currently derives entirely from NISQ systems, long-term valuation depends heavily on
              transitioning to fault-tolerant systems by 2030.
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Quantum Hardware Landscape and Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              The global quantum computing landscape features intense competition across distinct physical qubit
              modalities, primarily superconducting circuits, trapped ions, and neutral atoms. Superconducting transmons
              represent the most mature and crowded category, led by well-capitalized US technology giants IBM and
              Google alongside specialized pure-play vendor Rigetti Computing. In this competitive arena,
              Finland-headquartered IQM Quantum Computers has carved out a distinct market position by emphasizing
              verified physical machine deliveries rather than exclusive cloud access. By August 2026, IQM reported 26
              total systems sold and 17 delivered globally, highlighted by its milestone delivery to the US Department
              of Energy's Oak Ridge National Laboratory. IQM maintains a vertically integrated operational model
              encompassing proprietary chip design, in-house cleanroom fabrication facilities in Finland, dilution
              refrigeration packaging, and software control stacks. This contrasts with fabless quantum startups and
              positions IQM to serve sovereign research institutions and supercomputing centers seeking direct
              infrastructure ownership.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP009
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
      - number: '3.2'
        title: Architectural Differentiation and Error-Correction Strategies
        blocks:
          - type: paragraph
            body: >-
              Differentiation among quantum hardware manufacturers increasingly centers on quantum error correction
              (QEC) efficiency and processor connectivity rather than raw physical qubit counts. Traditional
              superconducting architectures, such as IBM's heavy-hexagonal lattice, limit physical qubit interactions to
              two or three nearest neighbors, requiring substantial physical-to-logical qubit overhead when implementing
              standard surface codes. In contrast, IQM has introduced its Constellation processor topology featuring
              enhanced planar connectivity where individual qubits natively interact with up to 12 neighboring qubits.
              To exploit this hardware design, IQM developed proprietary 'barbell codes' belonging to the quantum
              low-density parity-check (QLDPC) family. By connecting planar clusters through long couplers without
              requiring complex crossing wiring, IQM projects achieving logical error rates up to three orders of
              magnitude lower than conventional surface codes while requiring up to eight times fewer physical qubits.
              Concurrently, trapped-ion competitors like Quantinuum offer all-to-all connectivity and superior raw gate
              fidelities but suffer from millisecond-scale gate latencies compared to transmon nanosecond speeds.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
      - number: '3.3'
        title: Deployment Models, Pricing Structures, and Customer Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Commercial go-to-market execution diverges sharply between public cloud providers and on-premise hardware
              vendors. While IBM, Google, and Rigetti prioritize multi-tenant cloud platforms accessible through web
              APIs and hyperscaler marketplaces, IQM focuses primarily on on-premises system sales. Its tiered product
              portfolio includes the educational 5-qubit IQM Spark, the enterprise and HPC-oriented IQM Radiance
              offering 20 to 150 qubits, and the dedicated QEC exploration system IQM Halocene. Capital equipment
              purchases require multi-million-euro upfront commitments alongside recurring maintenance agreements,
              creating substantial budgetary and procedural friction. However, once installed in high-performance
              computing facilities such as Germany's Leibniz Supercomputing Centre or Finland's CSC, on-premises
              machines establish high switching barriers. Early enterprise and scientific adopters invest heavily in
              pulse-level calibration, hybrid classical-quantum scheduling pipelines, and proprietary algorithmic
              workflows, making displacement by remote cloud queues contractually and operationally unattractive.
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP010
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP014
      - number: '3.4'
        title: Moat Durability, Scaling Bottlenecks, and Adverse Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Despite early sovereign procurement momentum, IQM faces significant long-term moat durability risks
              stemming from both physical constraints and incumbent scale. Superconducting transmon qubits are
              fundamentally constrained by finite coherence times spanning 50 to 200 microseconds, demanding continuous
              error correction cycles before accumulated noise corrupts computation. Furthermore, operating at dilution
              refrigerator temperatures near 10 millikelvin imposes severe thermal management and cabling bottlenecks as
              physical input-output lines multiply. As IQM progresses from 20-qubit prototypes toward 150-qubit
              monolithic processors and 300-qubit modular dual-chip configurations, fabrication uniformity represents an
              acute risk: a single microscopic junction defect can disable critical coupling paths and impair QLDPC
              syndrome extraction. Additionally, if US incumbents with superior balance sheets achieve modular
              multi-thousand-qubit fault-tolerant systems ahead of schedule, IQM's geographic defensibility in European
              sovereign computing centers may prove insufficient to preserve commercial premium pricing.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sovereign Co-Location Defensibility
            body: >-
              IQM's verified track record of delivering 17 on-premise systems directly into supercomputing centers
              (including LRZ, CSC, and ORNL) establishes a durable procurement barrier against US cloud-only
              hyperscalers, particularly for European government entities demanding physical data sovereignty.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP014
          - type: callout
            title: Cryogenic and Fabrication Yield Hurdles
            body: >-
              Advancing from 20-qubit prototypes to 150-qubit monolithic processors and 300-qubit modular systems
              introduces severe execution risk around cryogenic wiring thermal loads, transmon coherence decay, and
              fabrication defect rates where a single bad coupler can impair code performance.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Product Monetization, and Recognition Mechanisms
        blocks:
          - type: paragraph
            body: >-
              IQM operates a hybrid commercial model primarily driven by outright capital equipment deliveries of
              full-stack superconducting quantum computers, supplemented by cloud access and systems integration
              services. For the first half of 2026, total recognized revenue reached €8.87 million, up 47.0%
              year-over-year from €6.03 million in H1 2025. In the second quarter of 2026, revenue totaled €6.68
              million, demonstrating accelerated sequential delivery of on-premises hardware systems. Unlike pure-play
              cloud quantum providers, IQM's primary revenue recognition mechanism relies on milestone-based customer
              acceptance upon on-site physical commissioning, which creates significant quarter-to-quarter revenue
              lumpiness. The company monetizes hardware across distinct product lines including the entry-level 5-qubit
              Spark system for universities and the modular Radiance family spanning 20, 54, and 150 qubits for
              supercomputing facilities. Cloud compute monetization through IQM Resonance provides exploratory
              algorithmic access but currently represents a fractional share of total receipts.
            claimRefs:
              - CI001
              - CI003
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
      - number: '4.2'
        title: Cost Structure, Gross Margin Dynamics, and Manufacturing Capex
        blocks:
          - type: paragraph
            body: >-
              The economics of full-stack quantum manufacturing require capital-intensive cryogenic, fabrication, and
              cleanroom infrastructure. In H1 2026, IQM generated €3.60 million in gross profit, yielding an IFRS gross
              margin of 40.6%, slightly ahead of the 40.0% margin recorded in H1 2025. Operating expenses for the
              six-month period expanded substantially by 92.4% year-over-year to €67.30 million, generating an operating
