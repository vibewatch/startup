      - number: '5.3'
        title: Software Stack and Developer Interface
        blocks:
          - type: paragraph
            body: >-
              IQM's software department maintains an open, modular software architecture spanning low-level QPU station
              control, automated system calibration, circuit compilation, and developer-facing cloud application
              programming interfaces. Implemented primarily in Python, C++, and Rust within containerized Linux
              environments, the software stack orchestrates hardware pulse sequencing, gate synthesis, and real-time
              error mitigation. Cloud access to remote systems via IQM Resonance is authenticated through bearer API
              tokens, accepting circuit definitions and returning measurement results metered by QPU execution duration.
              Rather than offering a standard public OpenAPI specification, IQM distributes an open-source Apache-2.0
              Python client library (iqm-client) equipped with adapters for leading quantum development frameworks
              including Qiskit, Cirq, and Qrisp. Furthermore, to enable quantum-centric supercomputing (QHPC), IQM
              collaborates with high-performance computing centers to integrate quantum job dispatchers directly
              alongside classical workload managers like Slurm, facilitating hybrid variational algorithms and materials
              science simulations.
            claimRefs:
              - CE001
