      - number: '5.2'
        title: Hardware Architecture and Cryogenic Infrastructure
        blocks:
          - type: paragraph
            body: >-
              At the physical processing layer, IQM designs quantum processing units based on superconducting transmon
              qubits arranged in square lattice topologies. To overcome inter-qubit crosstalk—a primary source of
              coherent noise and error in multi-qubit systems—IQM incorporates transmon-based tunable coupler
              technology. In deployed systems such as the 20-qubit IQM Garnet processor available via Amazon Braket, 20
              computational transmon qubits are interconnected by 30 tunable coupler elements, enabling full idling of
              interactions, rapid two-qubit gate operations between 20 and 40 nanoseconds, and median gate fidelities of
              99.92% for single-qubit gates and 99.51% for two-qubit gates. Operating superconducting circuits requires
              extreme thermal isolation near absolute zero: physical QPUs are housed inside high-performance dilution
              refrigeration systems supplied by Bluefors. Multi-stage helium compressors cool the assembly to 4 kelvin,
              while continuous closed-loop helium-3/helium-4 gas-handling systems maintain internal base temperatures
              below 10 millikelvin. Physical installation environments, such as the Department of Energy's Oak Ridge
              National Laboratory Translational Research Capability building, require specialized low-vibration
              foundations engineered below 250 microinches to shield fragile quantum superposition states from
              mechanical acoustic disturbances.
            claimRefs:
              - CE004
              - CE005
