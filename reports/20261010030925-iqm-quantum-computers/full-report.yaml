        title: Customer Concentration, Procurement Friction, and Retention Risks
        blocks:
          - type: paragraph
            body: >-
              Despite leading physical delivery counts, IQM's customer franchise faces acute concentration and
              durability vulnerabilities. Because over 97 percent of revenues stem from one-off on-premises hardware
              sales, the business is exposed to policy-driven public procurement cycles rather than organic commercial
              expansion. EuroHPC Joint Undertaking consortia, national research ministries, and European state-backed
              labs constitute the vast majority of IQM's backlog. These public institutional buyers operate on
              multi-year political budget appropriations that do not guarantee recurring follow-on purchases once an
              initial system is installed. Commercial durability is further clouded by the absence of published net
              revenue retention (NRR), gross revenue retention (GRR), or software license renewal metrics across
              deployed sites. The Resonance cloud platform generated just EUR 0.3 million in FY2025, demonstrating that
              ongoing usage-based consumption has not yet emerged as a meaningful revenue pillar. Furthermore, expanding
              hardware deliveries across international borders introduces severe regulatory friction: multilateral
              export controls enacted in late 2024 and 2025 on quantum processors, cryogenic refrigeration, and
              parametric amplifiers restrict IQM's ability to sell freely into Asian and other non-allied markets
