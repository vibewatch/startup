      - number: '8.3'
        title: Scenario Modeling, Multiple Sensitivity, and Downside Triggers
        blocks:
          - type: paragraph
            body: >-
              To evaluate the risk-adjusted return profile, we analyze three distinct operating scenarios across the
              FY2026 to FY2028 investment horizon. In the bull case, IQM meets the high end of FY2026 guidance at €47
              million, converts more than 90% of its €102.1 million backlog into recognized revenue, and successfully
              expands cleanroom manufacturing capacity to support up to 30 systems annually, yielding an equity
              valuation between $2.8 billion and $3.5 billion. In the base case, revenue tracks guidance between €42
              million and €45 million, but delivery schedules and complex site integrations stretch recognition cycles,
              resulting in a fair valuation band of $1.6 billion to $1.9 billion. In the bear case, installation delays
              or sovereign budgetary shifts depress recognized revenue below €35 million, while ongoing research and
              administrative expenses maintain annualized burn above €120 million. Under this downside trajectory, cash
              reserves would deplete prematurely ahead of 2028, precipitating severe multiple compression toward an
              equity valuation of $600 million to $900 million. Given that the current $1.8 billion listing valuation
              aligns closely with base-case expectations, current pricing offers negligible margin of safety.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
