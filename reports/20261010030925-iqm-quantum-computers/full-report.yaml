  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Tax, and Transaction Structure Risks
        blocks:
          - type: paragraph
            body: >-
              IQM's transition to a publicly traded entity via its merger with Real Asset Acquisition Corp. (RAAQ) at a
              $1.8 billion pre-money equity valuation introduces acute regulatory, tax, and structural transaction
              risks. Foremost among public market concerns is the company's potential classification as a Passive
              Foreign Investment Company (PFIC) under United States tax law. Independent equity research from Seeking
              Alpha highlighted that because IQM holds substantial liquid cash reserves relative to near-term active
              operating revenues, US taxable investors could face onerous excess distribution regimes, triggering a
              public Sell recommendation. Furthermore, the de-SPAC transaction structure remains vulnerable to public
              trust account shareholder redemptions ahead of closing. While the transaction model anticipated over $450
              million in gross cash proceeds supported by PIPE investments and trust funds, elevated redemption rates
              would materially compress net delivered capital, forcing the company to rely prematurely on secondary
              offerings or European sovereign credit lines.
