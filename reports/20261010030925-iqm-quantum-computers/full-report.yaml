      - number: '5.4'
        title: Fabrication, Roadmap, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              IQM's technical differentiation rests on its vertically integrated operating model: the company develops
              in-house chip design tooling, operates a proprietary semiconductor cleanroom fabrication facility in
              Espoo, and conducts system packaging, microwave engineering, and final assembly internally. To support
              rising commercial deliveries and advance toward fault-tolerant architectures, IQM committed over EUR 40
              million to expand its cleanroom facility, doubling production capacity to support up to 30 full-stack
              quantum computers annually. For long-term error correction, IQM is pioneering quantum low-density
              parity-check (qLDPC) schemes, introducing tile codes and proprietary barbell codes tailored to its Star
              and Constellation chip topologies. These qLDPC codes are engineered to reduce physical-to-logical qubit
              hardware overhead by up to tenfold compared to conventional surface codes. Nevertheless, significant
              diligence risks persist: volume manufacturing remains heavily reliant on single-source dilution
              refrigerator vendors like Bluefors, while IQM has yet to publish third-party SOC 2 Type II compliance
              audits, formal service-level agreements, or experimental demonstrations of fault-tolerant logical qubits
              operating below fault thresholds on physical hardware.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
