callouts:
  - calloutType: "risk"
    title: "Heavy Revenue Concentration and Lumpy Capital Equipment Cycles"
    body: "IQM's financial profile is dominated by lumpy, long-cycle capital equipment sales to sovereign HPC centers. The €33.0M CSC LUMI AI Factory contract accounts for nearly a third of total order backlog, creating substantial revenue volatility if milestone delivery or site acceptance dates slip into subsequent calendar years."
    claimRefs:
      - "CI001"
      - "CI004"
      - "CI011"
  - calloutType: "insight"
    title: "Transformative Balance Sheet Capitalization Through Nasdaq Listing"
    body: "The successful dual listing on Nasdaq and Nasdaq Helsinki injected €198.7M in net proceeds, lifting pro-forma liquid assets to €309.4M and retiring outstanding debt. This liquidity buffer provides financial runway into Q2 2028, insulating the core hardware development pipeline from near-term public market volatility."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
