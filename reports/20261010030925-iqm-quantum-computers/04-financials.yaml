company:
  name: "IQM Quantum Computers"
chapter:
  number: 4
  title: "Financials"
  summary: "IQM generated €8.87 million in H1 2026 revenue with an IFRS gross margin of 40.6% and expanded its total order backlog to €102.1 million following public listing on Nasdaq as IQMX. With pro-forma cash reserves of €309.4 million and no debt obligations, the company maintains runway into Q2 2028, though capital intensity and long sovereign sales cycles represent key underwriting hurdles."
sections:
  - id: "revenue-streams-and-pricing-model"
    title: "Revenue Streams, Product Monetization, and Recognition Mechanisms"
    body: "IQM operates a hybrid commercial model primarily driven by outright capital equipment deliveries of full-stack superconducting quantum computers, supplemented by cloud access and systems integration services. For the first half of 2026, total recognized revenue reached €8.87 million, up 47.0% year-over-year from €6.03 million in H1 2025. In the second quarter of 2026, revenue totaled €6.68 million, demonstrating accelerated sequential delivery of on-premises hardware systems. Unlike pure-play cloud quantum providers, IQM's primary revenue recognition mechanism relies on milestone-based customer acceptance upon on-site physical commissioning, which creates significant quarter-to-quarter revenue lumpiness. The company monetizes hardware across distinct product lines including the entry-level 5-qubit Spark system for universities and the modular Radiance family spanning 20, 54, and 150 qubits for supercomputing facilities. Cloud compute monetization through IQM Resonance provides exploratory algorithmic access but currently represents a fractional share of total receipts."
    claimRefs:
      - "CI001"
      - "CI003"
    tableRefs:
      - "TI001"
  - id: "cost-structure-and-margin-dynamics"
    title: "Cost Structure, Gross Margin Dynamics, and Manufacturing Capex"
    body: "The economics of full-stack quantum manufacturing require capital-intensive cryogenic, fabrication, and cleanroom infrastructure. In H1 2026, IQM generated €3.60 million in gross profit, yielding an IFRS gross margin of 40.6%, slightly ahead of the 40.0% margin recorded in H1 2025. Operating expenses for the six-month period expanded substantially by 92.4% year-over-year to €67.30 million, generating an operating loss of €60.54 million compared to €31.64 million in the prior-year period. This widening loss was primarily driven by €9.9 million in one-off transaction expenses associated with the Nasdaq business combination, an increase in research and development expenditure to €34.05 million, and global workforce expansion to 460 personnel. To support hardware scaling, IQM is investing over €40 million into expanding its proprietary semiconductor fabrication facility in Espoo, Finland, doubling cleanroom capacity to produce up to 30 full-stack quantum computers annually."
    claimRefs:
      - "CI002"
      - "CI005"
      - "CI014"
    tableRefs:
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "commercial-traction-and-backlog-conversion"
    title: "Commercial Traction, Order Backlog, and Public Growth Targets"
    body: "Commercial traction has accelerated following IQM's public market debut, with cumulative system sales reaching 26 machines and 17 global deliveries completed to date, including its initial United States delivery to the Oak Ridge National Laboratory in June 2026. The company's confirmed order backlog stood at €69.1 million as of June 30, 2026, and expanded past €102.1 million by August 3, 2026, propelled by a landmark €33.0 million agreement with CSC to deploy a quantum processor into the LUMI AI Factory. Supported by this backlog visibility, management initiated full-year 2026 financial guidance targeting revenue of €42 million to €47 million and annual new order intake between €65 million and €75 million. Meeting this revenue target depends heavily on successful customer site acceptance of scheduled system deployments, notably the initial 150-qubit Radiance installations, during the second half of the year."
    claimRefs:
      - "CI004"
      - "CI013"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-underwriting-verdict"
    title: "Capital Adequacy, Cash Runway, and Diligence Underwriting Verdict"
    body: "IQM's balance sheet underwent structural recapitalization through its business combination with Real Asset Acquisition Corp., which closed in July 2026 with the company trading on Nasdaq as IQMX. The transaction delivered €198.7 million in net proceeds, lifting pro-forma liquid reserves to €309.4 million as of July 2, 2026, and enabling the complete prepayment and extinguishment of its €5.0 million Kreos Capital debt facility. Management estimates this capital base provides operational runway into the second quarter of 2028, insulating operations from short-term public market volatility despite a net loss of €74.90 million in H1 2026. However, diligence underwriting faces critical disclosure barriers: unit-level hardware margins, dilution refrigeration component costs, customer acquisition cycles, and cloud revenue retention remain unobservable private metrics. Furthermore, recent insider share sales and post-listing equity volatility underscore investor skepticism regarding the commercial timeline for broad quantum advantage."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
