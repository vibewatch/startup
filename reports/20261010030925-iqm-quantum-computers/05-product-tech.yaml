chapter:
  number: 5
  title: "Product & Technology"
  summary: "IQM delivers full-stack superconducting quantum computing systems under an on-premises ownership model as well as cloud access through its Resonance platform. Its hardware portfolio spans the 5-qubit Spark, the modular 20-to-150-qubit Radiance, and error-mitigation research architectures, demonstrated through a 20-qubit Radiance deployment at Oak Ridge National Laboratory. The company differentiates through vertical integration with a proprietary cleanroom fabrication facility and transmon-based tunable coupler architectures, though it remains exposed to single-source cryogenic hardware dependencies and uncertified enterprise security standards."
sections:
  - id: "product-portfolio-and-delivery-models"
    title: "Product Portfolio and Delivery Models"
    body: "IQM Quantum Computers commercializes full-stack superconducting quantum hardware and software, targeting high-performance computing centers, national scientific laboratories, and academic institutions. Rather than relying exclusively on cloud-hosted multi-tenant infrastructure, IQM emphasizes an on-premises deployment framework termed Production Quantum, enabling institutional customers to directly own, operate, and integrate quantum processing hardware into their sovereign computing centers. The company's hardware portfolio is segmented across distinct deployment tiers: IQM Spark provides a compact 5-qubit superconducting system designed for university education and algorithmic research; IQM Radiance serves high-performance computing installations with scalable configurations spanning 20, 54, and 150 qubits; and IQM Halocene is engineered as an open hardware platform dedicated to quantum error-correction experimentation. Complementing its physical hardware sales, IQM operates Resonance, a quantum cloud service that provides remote access to physical QPUs on a metered QPU-second billing model. Commercial delivery traction reached 17 completed system installations and 26 cumulative systems sold globally as of August 2026, anchoring IQM's positioning as Europe's leading commercial builder of superconducting quantum systems."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE008"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "hardware-architecture-and-cryogenics"
    title: "Hardware Architecture and Cryogenic Infrastructure"
    body: "At the physical processing layer, IQM designs quantum processing units based on superconducting transmon qubits arranged in square lattice topologies. To overcome inter-qubit crosstalk—a primary source of coherent noise and error in multi-qubit systems—IQM incorporates transmon-based tunable coupler technology. In deployed systems such as the 20-qubit IQM Garnet processor available via Amazon Braket, 20 computational transmon qubits are interconnected by 30 tunable coupler elements, enabling full idling of interactions, rapid two-qubit gate operations between 20 and 40 nanoseconds, and median gate fidelities of 99.92% for single-qubit gates and 99.51% for two-qubit gates. Operating superconducting circuits requires extreme thermal isolation near absolute zero: physical QPUs are housed inside high-performance dilution refrigeration systems supplied by Bluefors. Multi-stage helium compressors cool the assembly to 4 kelvin, while continuous closed-loop helium-3/helium-4 gas-handling systems maintain internal base temperatures below 10 millikelvin. Physical installation environments, such as the Department of Energy's Oak Ridge National Laboratory Translational Research Capability building, require specialized low-vibration foundations engineered below 250 microinches to shield fragile quantum superposition states from mechanical acoustic disturbances."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE010"
      - "CE014"
    tableRefs:
      - "TE003"
  - id: "software-stack-and-developer-interface"
    title: "Software Stack and Developer Interface"
    body: "IQM's software department maintains an open, modular software architecture spanning low-level QPU station control, automated system calibration, circuit compilation, and developer-facing cloud application programming interfaces. Implemented primarily in Python, C++, and Rust within containerized Linux environments, the software stack orchestrates hardware pulse sequencing, gate synthesis, and real-time error mitigation. Cloud access to remote systems via IQM Resonance is authenticated through bearer API tokens, accepting circuit definitions and returning measurement results metered by QPU execution duration. Rather than offering a standard public OpenAPI specification, IQM distributes an open-source Apache-2.0 Python client library (iqm-client) equipped with adapters for leading quantum development frameworks including Qiskit, Cirq, and Qrisp. Furthermore, to enable quantum-centric supercomputing (QHPC), IQM collaborates with high-performance computing centers to integrate quantum job dispatchers directly alongside classical workload managers like Slurm, facilitating hybrid variational algorithms and materials science simulations."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE002"
  - id: "fabrication-roadmap-and-technical-risks"
    title: "Fabrication, Roadmap, and Technical Risks"
    body: "IQM's technical differentiation rests on its vertically integrated operating model: the company develops in-house chip design tooling, operates a proprietary semiconductor cleanroom fabrication facility in Espoo, and conducts system packaging, microwave engineering, and final assembly internally. To support rising commercial deliveries and advance toward fault-tolerant architectures, IQM committed over EUR 40 million to expand its cleanroom facility, doubling production capacity to support up to 30 full-stack quantum computers annually. For long-term error correction, IQM is pioneering quantum low-density parity-check (qLDPC) schemes, introducing tile codes and proprietary barbell codes tailored to its Star and Constellation chip topologies. These qLDPC codes are engineered to reduce physical-to-logical qubit hardware overhead by up to tenfold compared to conventional surface codes. Nevertheless, significant diligence risks persist: volume manufacturing remains heavily reliant on single-source dilution refrigerator vendors like Bluefors, while IQM has yet to publish third-party SOC 2 Type II compliance audits, formal service-level agreements, or experimental demonstrations of fault-tolerant logical qubits operating below fault thresholds on physical hardware."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE013"
      - "CE014"
