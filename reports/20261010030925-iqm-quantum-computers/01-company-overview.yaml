company:
  name: "IQM Quantum Computers"
chapter:
  number: 1
  title: "Company Overview"
  summary: "IQM Quantum Computers is an Espoo, Finland-headquartered full-stack superconducting quantum computing company that completed a dual public listing on Nasdaq and Nasdaq Helsinki in July 2026. The firm specializes in delivering customer-owned on-premises systems and cloud platform access to supercomputing centers, research laboratories, and universities worldwide, supported by EUR 309.4 million in cash, audited FY2025 revenue of EUR 31.33 million, and an order backlog exceeding EUR 102.1 million."
sections:
  - id: "corporate-identity-and-foundational-mission"
    title: "Corporate Identity and Foundational Mission"
    body: "Founded in 2018 in Espoo, Finland, as an academic spinout from Aalto University and the VTT Technical Research Centre of Finland, IQM Quantum Computers has emerged as Europe's premier manufacturer of full-stack superconducting quantum computing systems. The company develops on-premises quantum computers as well as cloud-accessible infrastructure designed for high-performance computing centers, national research laboratories, and academic institutions. Unlike competitors that emphasize metered public cloud access, IQM differentiates its commercial offering through customer-owned, physically deployed hardware that integrates directly alongside existing supercomputer installations. In July 2026, IQM completed a definitive business combination with Real Asset Acquisition Corp. (RAAQ) to become the first European quantum hardware company listed on a major United States exchange, trading under the ticker symbol IQMX on the Nasdaq Global Market with a secondary listing on Nasdaq Helsinki. Audited financial statements confirm FY2025 consolidated revenue of EUR 31.33 million ($35.43 million), representing 90.7% year-over-year top-line expansion, anchored by a delivered base of 17 operational systems and 26 cumulative commercial sales."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO008"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-board-governance"
    title: "Executive Leadership and Board Governance"
    body: "IQM's leadership team pairs deep academic domain knowledge in superconducting physics with seasoned technology scaling and operational governance. The company was founded by Jan Goetz, Mikko Möttönen, Kuan Yen Tan, and Juha Vartiainen, originating from Möttönen's Quantum Computing and Devices research laboratory at Aalto University. Effective January 1, 2026, Jan Goetz became the sole Chief Executive Officer following the conclusion of a transitional co-CEO arrangement with Mikko Välimäki, while Mikko Möttönen continues to serve as Chief Scientist and Aalto professor. Kuan Yen Tan directs technical architecture as Chief Technology Officer, and Juha Vartiainen manages ongoing operational initiatives. Corporate governance is overseen by a board chaired by Sierk Poetting, with executive management further supported by Chief Financial Officer Jan Kürschner and Deputy CEO Søren Hein. The board expanded ahead of the dual public listing to include independent international technology executives, alongside institutional representation such as Alex Doll of Ten Eleven Ventures. This governance structure reflects a deliberate shift from an early-stage research enterprise toward public company compliance and execution discipline."
    claimRefs:
      - "CO001"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capital-structure-and-shareholder-register"
    title: "Capital Structure and Shareholder Register"
    body: "Prior to its public debut, IQM raised more than $600 million in private equity and non-dilutive grant capital across multiple financing rounds. Early institutional backing included a EUR 39 million Series A1 in 2020 and a EUR 128 million Series A2 in 2022 led by World Fund, accompanied by a EUR 35 million European Investment Bank venture loan facility. In September 2025, IQM secured a Series B financing exceeding $300 million led by Ten Eleven Ventures at a $1.0 billion valuation, with broad participation from the Finnish sovereign fund Tesi. The July 2026 merger with Real Asset Acquisition Corp. established an initial pre-money equity valuation of approximately $1.8 billion, delivering EUR 309.4 million in gross available liquidity as of July 2, 2026. Pre-combination shareholders, including Finnish institutional pension funds Varma and Elo, European climate-tech fund World Fund, and strategic corporate partners, did not liquidate their equity stakes at closing and retained more than 81% collective ownership of the combined parent company under agreed lock-up provisions."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO007"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "operational-trajectory-and-deployment-history"
    title: "Operational Trajectory and Deployment History"
    body: "IQM's operational milestone progression demonstrates steady technical scaling from initial university testbenches to multi-qubit commercial supercomputing deployments. The company's hardware roadmap is anchored by its Spark educational systems, modular Radiance processors (spanning 20-qubit Garnet and 54-qubit Emerald systems), and the fault-tolerant Halocene architecture. In June 2026, IQM marked its entry into the North American research market with the delivery of its first system to the United States Department of Energy's Oak Ridge National Laboratory. European sovereign wins include multi-stage hardware integrations with VTT, Leibniz Supercomputing Centre (LRZ) in Munich, CINECA in Italy, and the LUMI AI Factory managed by CSC in Finland under a EUR 33 million EuroHPC Joint Undertaking contract. In August 2026, IQM reported that its cumulative order backlog expanded past EUR 102.1 million, driven by EUR 33.0 million in new post-quarter commitments, reinforcing management guidance of EUR 42 million to EUR 47 million in full-year 2026 revenues."
    claimRefs:
      - "CO003"
      - "CO006"
      - "CO008"
      - "CO013"
      - "CO015"
    figureRefs:
      - "FO001"
  - id: "commercial-concentration-and-post-spac-risk-profile"
    title: "Commercial Concentration and Post-SPAC Risk Profile"
    body: "Despite robust commercial momentum, IQM's business model exhibits pronounced concentration risks and structural de-SPAC vulnerabilities. Dedicated on-premises physical hardware deliveries represented over 97% of FY2025 contract revenue (EUR 30.59 million), whereas recurring cloud revenue via IQM Resonance remained minimal at EUR 0.28 million. Furthermore, 87.3% of FY2025 revenue originated from European public institutions, with 74.6% ($26.44 million) concentrated across just four sovereign entities. Because high-performance quantum installations require 1.5 to 2 years for manufacturing, on-site commissioning, and final acceptance testing, revenue recognition is inherently lumpy and back-half weighted. Additionally, public filings leave post-merger shareholder redemption percentages undisclosed, while the capital structure carries a 12.5-million-share warrant overhang exercisable at $11.50 per share, ESOP option dilution, and eventual lock-up expirations that could create equity volatility as IQM pursues its fault-tolerant development targets."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
