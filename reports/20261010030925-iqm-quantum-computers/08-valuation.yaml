  title: "Valuation"
  summary: "IQM's $1.8 billion listing valuation reflects strong market positioning in European sovereign quantum hardware and an expanding EUR 102M backlog, but an unproven multiple on historical revenue and heavy operating losses support maintaining a disciplined research-more stance."
sections:
  - id: "investment-thesis-and-valuation-context"
    title: "Investment Thesis and Public Listing Valuation Context"
    body: "IQM Quantum Computers achieved a landmark milestone in European deep tech by announcing its public debut via a merger with Real Asset Acquisition Corp. (RAAQ) at a pre-money equity valuation of $1.8 billion. This transaction follows a September 2025 Series B financing round that raised $320 million at a $1.0 billion post-money valuation, followed by a €50 million debt facility provided by BlackRock in March 2026. The listing structure was engineered to deliver over $450 million in gross proceeds, transforming IQM's balance sheet and leaving the company with €309.4 million in cash reserves as of early July 2026. Management projects that this capital position provides a comfortable operational runway into the second quarter of 2028. However, from an investment perspective, entering at a $1.8 billion valuation implies an aggressive forward multiple, pricing the company at approximately 51 times its reported 2025 unaudited revenue of $35 million, and roughly 34 to 38 times the midpoint of full-year 2026 revenue guidance. While IQM represents a premier European quantum asset, investors must weigh this capital security against substantial multiple contraction risk if deployment milestones face operational friction."
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV010
      - CV011
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: "thesis-and-antithesis-evaluation"
    title: "Evaluation of Core Thesis and Downside Anti-Thesis"
    body: "The affirmative investment thesis for IQM rests on its differentiated position as Europe's leading provider of full-stack superconducting quantum systems for sovereign high-performance computing centers. With 26 quantum computers sold and 17 delivered globally, including integrations at the LUMI AI Factory and Oak Ridge National Laboratory, IQM has demonstrated verified on-premises delivery capability where customers retain operational sovereignty. The expansion of IQM's order backlog to over €102.1 million in August 2026 reinforces near-term demand visibility across research institutions. Conversely, the structural anti-thesis emphasizes that IQM's revenue base remains highly concentrated in public-sector and academic environments with elongated procurement cycles. More critically, the company reported an operating loss of €60.5 million on just €8.9 million in revenue for the first half of 2026. This stark asymmetry between top-line recognition and structural operating expenses underscores that IQM is burning capital at an annualized rate exceeding €120 million. Without a demonstrated inflection in manufacturing gross margins and accelerated commercial delivery sign-offs, the valuation multiple remains vulnerable to downward repricing."
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV012
      - CV013
      - CV014
    tableRefs:
      - TV002
  - id: "scenario-modeling-and-return-logic"
    title: "Scenario Modeling, Multiple Sensitivity, and Downside Triggers"
    body: "To evaluate the risk-adjusted return profile, we analyze three distinct operating scenarios across the FY2026 to FY2028 investment horizon. In the bull case, IQM meets the high end of FY2026 guidance at €47 million, converts more than 90% of its €102.1 million backlog into recognized revenue, and successfully expands cleanroom manufacturing capacity to support up to 30 systems annually, yielding an equity valuation between $2.8 billion and $3.5 billion. In the base case, revenue tracks guidance between €42 million and €45 million, but delivery schedules and complex site integrations stretch recognition cycles, resulting in a fair valuation band of $1.6 billion to $1.9 billion. In the bear case, installation delays or sovereign budgetary shifts depress recognized revenue below €35 million, while ongoing research and administrative expenses maintain annualized burn above €120 million. Under this downside trajectory, cash reserves would deplete prematurely ahead of 2028, precipitating severe multiple compression toward an equity valuation of $600 million to $900 million. Given that the current $1.8 billion listing valuation aligns closely with base-case expectations, current pricing offers negligible margin of safety."
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV011
      - CV012
      - CV016
    tableRefs:
      - TV003
  - id: "diligence-path-and-thesis-break-triggers"
    title: "Diligence Priorities, Audit Gaps, and Thesis-Break Triggers"
    body: "A disciplined investment stance requires resolving several critical evidence gaps before considering any rating upgrade from research-more to buy. Primary diligence priorities include obtaining audited FY2025 and interim FY2026 IFRS financial statements to confirm gross profit margins by revenue stream, hardware depreciation schedules, and true operating cash flow dynamics. Additionally, investors must evaluate customer concentration within the €102.1 million order backlog, assessing the proportion of revenue tied to single sovereign grants and verifying contractual acceptance milestones. Definitive thesis-break triggers that would prompt a downgrade to avoid include any downward revision of FY2026 revenue guidance below €38 million, quarterly order intake falling below €15 million, unmitigated hardware installation delays exceeding six months at marquee accounts, or quarterly cash burn accelerating beyond €35 million. Conversely, an upgrade to buy would require two consecutive quarters of revenue conversion meeting guided targets alongside audited gross margins stabilizing above 50%."
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV012
      - CV015
callouts:
  - calloutType: recommendation
    title: "Disciplined Stance: Research-More Maintained Ahead of FY2026 Financial Audits"
    body: "While IQM demonstrates significant technological differentiation through on-premises HPC integration and proprietary error mitigation, the $1.8B listing valuation represents a steep 51x multiple on unaudited 2025 revenue. Investors should maintain a research-more stance until full FY2026 audited financials confirm gross margin sustainability and backlog conversion velocity."
    claimRefs:
      - CV001
      - CV004
      - CV011
