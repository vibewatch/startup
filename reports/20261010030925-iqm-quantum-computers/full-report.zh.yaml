      - number: '6.4'
        title: 客户集中、采购摩擦与留存风险
        blocks:
          - type: paragraph
            body: >-
              尽管实体交付数量领先，IQM 的客户基础仍面临严重集中度和持久性脆弱点。超过 97% 的收入来自一次性本地部署硬件销售，因此公司暴露于政策驱动的公共采购周期，而非有机商业扩张。EuroHPC Joint
              Undertaking 联盟、国家研究部委和欧洲国家支持的实验室构成 IQM
              订单积压的绝大部分。这些公共机构买方依赖多年期政治预算拨款，初始系统安装后并不保证持续追加采购。由于公司没有公开披露部署地点的净收入留存（NRR）、毛收入留存（GRR）或软件许可续约指标，商业持久性更加不明。Resonance
              云平台 FY2025 仅产生 EUR 0.3 million，说明按使用量计费的持续消费尚未成为有意义的收入支柱。此外，跨境扩大硬件交付还带来严重监管摩擦：2024 年末和 2025
              年出台的多边出口管制限制量子处理器、低温制冷和参数放大器出口，使 IQM 若无主权许可批准，难以自由销售到亚洲及其他非盟友市场。
            claimRefs:
              - CU012
              - CU013
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 主权客户集中与漫长确认周期
            body: >-
              IQM 的商业基础由 17 套已交付实体系统形成差异化，但超过 97% 的收入仍来自主要由欧洲政府和超级计算预算资助的本地部署资本设备销售。典型安装和里程碑式收入确认周期为 1.5 至 2
              年，单个站点调试延迟就可能冲击季度业绩；FY2025 为 EUR 0.3 million 的经常性软件和云收入，在补贴型政策环境之外仍未证明能够自我维持的商业采用。
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、税务与交易结构风险
        blocks:
          - type: paragraph
            body: >-
              IQM 通过与 Real Asset Acquisition Corp.（RAAQ）合并、以 $1.8 billion
              的交易前股权估值转为上市公司，带来了尖锐的监管、税务和交易结构风险。公开市场最担心的是，公司可能按美国税法被归类为被动外国投资公司（PFIC）。Seeking Alpha 的独立股票研究指出，IQM
              持有的高额流动现金相对近期主动经营收入过高，美国应税投资者可能面临严苛的超额分配税制，从而触发公开的 Sell 评级。此外，de-SPAC
              交易结构在交割前仍容易受到公众股东赎回信托账户股份的影响。尽管交易模型预计 PIPE 投资和信托资金将带来超过 $450 million
              的总现金收益，但较高赎回率会大幅压缩实际到账资本，迫使公司过早依赖二次发行或欧洲主权信用额度。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营执行、制造与硬件可靠性
        blocks:
          - type: paragraph
            body: >-
              运营全栈超导量子基础设施，需要极高的制造精度、低温维护能力，以及在分散客户环境中持续保证硬件可靠性的能力。现场部署已出现实际运营中断，例如据报道，慕尼黑 Leibniz Supercomputing Centre
              的 IQM 本地部署出现硬件问题。IQM 将大学研究人员切换到云服务，避免计算流程中断，从而缓解了即时停机；但随着安装规模扩大，现场硬件故障凸显了维护责任。运营层面，IQM 正投入超过 EUR 40
              million，将其芬兰 Espoo 自有工厂的洁净室产能翻倍，目标是年产最多 30 台全栈量子计算机。然而，依赖单一专用制造洁净室，形成了尚未缓解的运营单点故障。同时，公司到 2030
              年实现容错的路线图，取决于扩展新型定向 tile codes；这类代码在 Crystal 处理器上已展示出每个逻辑量子比特使用 30 个物理量子比特时将错误降低千倍的效果。
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
