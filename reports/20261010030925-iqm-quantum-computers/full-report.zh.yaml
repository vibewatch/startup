      - number: '7.4'
        title: 风险热力图、thesis-break 触发条件与清算标准
        blocks:
          - type: paragraph
            body: >-
              为管控投资风险，机构配置者必须跟踪明确的监测指标和 thesis-break 清算标准。结构化风险矩阵按可能性和严重性维度梳理 IQM 的主要脆弱点。主要 thesis-break 触发条件包括：第一，SPAC
              净赎回率超过 70% 且没有补偿性股权后盾，导致交割现金耗尽；第二，年化经营现金消耗超过 EUR 130 million，而半年度商业交付没有出现拐点；第三，IRS 作出不利裁定确认 PFIC
              身份，且没有合格选举基金申报，触发机构抛售股票；第四，Espoo 制造设施洁净室长期停机，导致实体系统无法完成。如果主权客户的采购周期停滞，或交付验收延迟使积压订单转化拖过 2028 年，IQM
              的资本跑道将迅速收缩，迫使公司进行稀释性紧急再资本化。持续核查客户验收排期、出口许可和 QEF 税务申报，是评估风险调整后持有可行性的关键。
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR008
              - CR015
