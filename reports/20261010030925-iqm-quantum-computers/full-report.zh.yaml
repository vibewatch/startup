      - number: '3.4'
        title: 护城河持久性、规模化瓶颈与不利替代风险
        blocks:
          - type: paragraph
            body: >-
              尽管主权采购早期势头强劲，IQM 的长期护城河仍面临物理限制和在位者规模带来的重大风险。超导 transmon 量子比特受 50 至 200 microseconds
              的有限相干时间约束，因此在累积噪声破坏计算前必须持续执行纠错循环。此外，在接近 10 millikelvin 的稀释制冷温度下运行，会随着物理输入输出线增加而遭遇严重的热管理和布线瓶颈。IQM 从
              20-qubit 原型迈向 150-qubit 单片处理器和 300-qubit 模块化双芯片配置时，制造一致性构成突出风险：单个微小结点缺陷就可能禁用关键耦合路径，削弱 QLDPC
              综合征提取。如果美国在位者凭借更强资产负债表提前实现模块化数千量子比特容错系统，IQM 在欧洲主权计算中心的地域防御力可能不足以维持商业溢价定价。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP015
