      - number: '1.5'
        title: 商业集中度与 SPAC 后风险画像
        blocks:
          - type: paragraph
            body: >-
              尽管商业势头强劲，IQM 的业务模式仍有明显的集中度风险和 SPAC 后结构性脆弱点。本地部署实体硬件交付占 FY2025 合同收入超过 97%（EUR 30.59 million），而 IQM
              Resonance 的经常性云收入仅 EUR 0.28 million。FY2025 收入的 87.3% 来自欧洲公共机构，其中 74.6%（$26.44
              million）集中在四个主权实体。由于高性能量子安装需要 1.5 至 2 年完成制造、现场调试和最终验收，收入确认天然波动大且偏向后半年度。此外，公开文件没有披露合并后股东赎回比例；资本结构还存在
              12.5-million-share、行权价 $11.50 per share 的认股权证悬垂、ESOP 期权稀释以及未来锁定期到期，这些因素都可能在 IQM 推进容错开发目标时加剧股权波动。
