      - number: '8.2'
        title: 核心逻辑与下行反面逻辑评估
        blocks:
          - type: paragraph
            body: >-
              看多 IQM 的投资逻辑建立在其差异化定位上：它是欧洲领先的全栈超导量子系统供应商，服务主权高性能计算中心。IQM 已在全球售出 26 台、交付 17 台量子计算机，其中包括接入 LUMI AI Factory
              和 Oak Ridge National Laboratory 的系统；客户保有运营主权，IQM 因此证明了本地部署交付能力。2026 年 8 月，订单积压增至超过 €102.1
              million，进一步增强了研究机构近期需求的可见度。反面逻辑则指出，IQM 的收入高度集中于公共部门和学术环境，而采购周期漫长。更关键的是，公司 2026 年上半年仅实现 €8.9 million 收入，却录得
              €60.5 million 经营亏损。收入确认与结构性运营费用之间的巨大不对称，意味着 IQM 的年化资本消耗超过 €120
              million。若制造毛利率没有出现明确拐点、商业交付签收也未加速，估值倍数仍容易向下重估。
            claimRefs:
              - CV004
