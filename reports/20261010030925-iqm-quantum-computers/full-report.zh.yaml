      - number: '3.3'
        title: 部署模式、定价结构与客户转换成本
        blocks:
          - type: paragraph
            body: >-
              公共云供应商和本地部署硬件厂商的商业化执行路径明显不同。IBM、Google 和 Rigetti 主要提供通过 Web API 和超大规模云市场访问的多租户云平台，而 IQM
              主要专注本地部署系统销售。其分层产品组合包括教育型 5-qubit IQM Spark、面向企业和 HPC、覆盖 20 至 150 qubits 的 IQM Radiance，以及专用于 QEC 探索的 IQM
              Halocene。资本设备采购需要数百万欧元的前期投入和持续维护协议，造成明显的预算及流程摩擦。但一旦安装在德国 Leibniz Supercomputing Centre 或芬兰 CSC
              等高性能计算设施中，本地机器就会形成较高转换壁垒。早期企业和科研采用者会大量投入脉冲级校准、经典—量子混合调度管线和专有算法工作流，因此用远程云队列替代在合同和运营上都缺乏吸引力。
            claimRefs:
              - CP005
