  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与上市估值背景
        blocks:
          - type: paragraph
            body: >-
              IQM Quantum Computers 宣布通过与 Real Asset Acquisition Corp.（RAAQ）合并上市，以 $1.8 billion
              交易前股权估值实现了欧洲深科技领域的里程碑。该交易承接 2025 年 9 月的 Series B 融资：融资额为 $320 million，投后估值 $1.0 billion；随后 BlackRock 于
              2026 年 3 月提供 €50 million 债务额度。上市结构旨在带来超过 $450 million 总收益，重塑 IQM 的资产负债表；截至 2026 年 7 月初，公司现金储备为 €309.4
              million。管理层预计，这一资本状况可提供充裕的运营跑道至 2028 年第二季度。然而，从投资角度看，以 $1.8 billion 估值入场意味着激进的远期倍数：按公司披露的 2025 年未经审计收入 $35
              million 计算，约为 51 的收入倍数；按 2026 全年收入指引中值计算，约为 34 至 38 的收入倍数。IQM
              是欧洲顶尖量子资产，但若部署里程碑遭遇运营阻力，投资者必须权衡资本安全与倍数大幅收缩风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV010
