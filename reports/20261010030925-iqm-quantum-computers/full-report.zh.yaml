              的本地部署框架，让机构客户直接拥有、运营并把量子处理硬件接入主权计算中心。硬件组合分为不同部署层级：IQM Spark 是面向大学教育和算法研究的紧凑型 5-qubit 超导系统；IQM Radiance
              服务高性能计算安装，配置覆盖 20、54 和 150 qubits；IQM Halocene 则是专为量子纠错实验打造的开放硬件平台。除实体硬件销售外，IQM 还运营 Resonance 量子云服务，以按
