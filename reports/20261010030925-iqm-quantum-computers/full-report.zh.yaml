      - number: '2.3'
        title: 买方细分、工作流与预算归属
        blocks:
          - type: paragraph
            body: >-
              本地部署量子硬件的机构买方可分为四个细分市场，其采购权限、预算周期和运营流程各不相同 [CM006]。一级超级计算中心是 IQM 的主要商业基础，资本支出由国家科学部委和 EuroHPC 等政府间联合项目批准
              [CM014]。在这些环境中，系统管理员和计算物理学家把 QPU 作为专用量子加速器，直接接入高性能计算集群 [CM006,
              CM008]。主权及国家防务实验室构成第二个核心市场，需求由数据安全、后量子密码韧性以及禁止把敏感研究路由至商业公共云的法规推动
              [CM009]。第三个成长中市场是制药、化学和汽车工程领域的工业企业研究机构，其主要用例是计算化学和分子模拟 [CM012]。行业调查显示，57 percent
              的潜在量子计算采用者把药物发现和分子建模列为最高优先级应用 [CM012]。最后，大学联盟采购较小的教育型 QPU，用于培养量子工程人才 [CM006]。IQM 已在所有细分市场建立机构渗透，向 13
              个客户销售系统，其中包括全球排名前十的四家超级计算设施 [CM013]。
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              本地部署量子计算市场受计算加速和国家主权的结构性需求推动，但也受严重技术及组织瓶颈拖累 [CM009,
              CM010]。需求端，欧洲政府已把技术主权视为关乎生存的安全要务，向本土硬件龙头投入资金，以降低对外国计算平台的依赖 [CM014]。此外，量子处理器与经典 GPU
              加速计算的融合形成混合计算管线，可把复杂数学子程序卸载到量子硬件 [CM006]。反过来，行业从业者记录的三项关键阻力压制商业采用 [CM010]。第一，75 percent
              的企业受访者认为，明确商业应用是采用量子计算的最大障碍 [CM011]。第二，严重的人才短缺和割裂的软件开发套件，让企业 IT 组织难以建立可移植、可用于生产的量子工作流
              [CM010]。第三，低温硬件的资本密集度以及持续 12 至 24 个月的采购周期，使系统供应商面临收入波动和执行风险 [CM015]。
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
      - number: '2.5'
        title: 尽调缺口与商业验证路径
        blocks:
          - type: paragraph
            body: >-
              对量子计算市场动态的独立尽调显示，已报告合同积压与长期经济可持续性之间存在较大分析缺口 [CM008, CM015]。最主要的缺口是没有公开披露经常性软件许可和硬件维护续约与非经常性系统建设之间的区别
              [CM007]。由于 IQM 历史确认收入几乎全部来自一次性硬件交付，要估算保修后的经常性现金流和客户终身价值，需要私下取得客户维护合同 [CM007]。此外，股票研究中的 headline
              市场规模严重依赖长期咨询情景，而这些情景已经下调，投资者必须仔细审视向容错硬件过渡的时点 [CM002]。包括 IQM 计划于 2026 年 11 月 5
              日发布的中期财务报告在内，后续披露将是最近的实证检查点，可用来核验毛利率进展、现金消耗和交付转化率是否符合合同积压目标 [CM008, CM015]。
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM015
      - number: '2.6'
        title: 展示项
        blocks:
          - type: callout
            title: 本地部署超级计算重点，避开超大规模云主导
            body: IQM 优先向主权和超级计算中心提供本地部署，瞄准因安全、控制和国家主权要求而无法接受公共云访问的客户。这一定位带来较高合同金额和每笔订单的资本效率，但也引入季度收入波动和较长销售周期。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM009
          - type: callout
            title: NISQ 经济潜力下修，凸显估值敏感性
            body: BCG 等咨询模型承认，受经典算法竞争和硬件噪声影响，近期 NISQ 价值实现假设过于乐观。对当前确认收入完全来自 NISQ 系统的供应商而言，长期估值高度取决于 2030 年前能否转向容错系统。
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 量子硬件格局与竞争者画像
        blocks:
          - type: paragraph
            body: >-
              不同物理量子比特路线之间竞争激烈，全球量子计算市场主要分为超导电路、囚禁离子和中性原子。超导 transmon 是最成熟、最拥挤的类别，由资金充足的美国科技巨头 IBM、Google 以及专业厂商 Rigetti
              Computing 领跑。在这一竞争环境中，总部位于芬兰的 IQM Quantum Computers 通过强调经过验证的实体机器交付而非单纯云端访问，形成了独特市场位置。截至 2026 年 8 月，IQM
              报告累计售出 26 套系统、全球交付 17 套，其中包括向 US Department of Energy 的 Oak Ridge National Laboratory 交付首套系统。IQM
              采用纵向一体化运营模式，覆盖自有芯片设计、芬兰内部洁净室制造、稀释制冷封装和软件控制栈。这与无晶圆厂量子初创公司不同，也使 IQM 能服务希望直接拥有基础设施的主权研究机构和超级计算中心。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP009
              - CP014
