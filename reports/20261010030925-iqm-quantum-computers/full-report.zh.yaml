      - number: '6.3'
        title: 具名部署、HPC 集成与机构验证
        blocks:
          - type: paragraph
            body: >-
              IQM 已验证的客户版图由欧洲顶级高性能计算中心和国家科学实验室支撑。在德国，Leibniz Supercomputing Centre (LRZ) 运行四套本地部署 IQM 系统，包括与 SuperMUC-NG
              超级计算机集成的 20-qubit Q-Exa 系统。LRZ 是 IQM turnkey HPC Integration Service 的主要生产测试场地，该服务让量子处理器作为原生 Slurm
              计算节点运行，并通过开源 Quantum Device Management Interface 与经典 CPU、GPU 集群共同管理。在芬兰，CSC 选定 IQM 部署 150-qubit Halocene
              H4 系统，依据 EUR 33 million EuroHPC 合同直接连接 LUMI AI Factory。创始合作伙伴 VTT 已完成从 5 至 50 qubits 的多阶段部署，并持有 150- 和
              300-qubit 系统订单。在意大利，CINECA 与 Leonardo 超级计算机共同部署一套名为 NOX 的 54-qubit Radiance 系统。在欧洲以外，IQM 于 2026 年 6 月向
              Department of Energy 的 Oak Ridge National Laboratory 完成首次美国交付，并与 TOYO Corporation 签署独家分销协议，在日本销售 Spark 和
              Radiance 系统。波兰 Galaxy Systemy Informatyczne 是 IQM 首个私营企业硬件销售客户，计划于 2026 年末交付。
