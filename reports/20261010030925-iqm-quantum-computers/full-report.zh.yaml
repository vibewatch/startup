chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与创立使命
        blocks:
          - type: paragraph
            body: >-
              IQM Quantum Computers 于 2018 年在芬兰 Espoo 创立，源自 Aalto University 和 VTT Technical Research Centre of Finland
              的学术孵化项目，如今已成为欧洲领先的全栈超导量子计算系统制造商。公司开发本地部署量子计算机及云端可访问基础设施，面向高性能计算中心、国家研究实验室和学术机构。不同于强调按量计费公共云访问的竞争者，IQM
              以客户自有、实体部署并可直接接入现有超级计算机的硬件作为商业差异化。2026 年 7 月，IQM 与 Real Asset Acquisition Corp. (RAAQ)
              完成最终业务合并，成为首家在美国主要交易所上市的欧洲量子硬件公司；股票在 Nasdaq Global Market 以 IQMX 交易，并在 Nasdaq Helsinki 二次上市。经审计财报确认，FY2025
              合并收入为 EUR 31.33 million（$35.43 million），同比增长 90.7%，收入基础是已交付的 17 套运营系统和累计 26 套商业销售。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO008
