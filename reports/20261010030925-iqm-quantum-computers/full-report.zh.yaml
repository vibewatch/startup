  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与支出范围
        blocks:
          - type: paragraph
            body: >-
              评估量子计算的可服务市场，必须区分实体硬件采购、云端量子处理和相邻的经典计算支出。IQM 几乎专注于本地部署的全栈超导量子计算机安装
              [CM006]。这一模式把实体量子处理单元（QPU）、稀释制冷、密集微波控制布线和底层脉冲控制电子设备打包成一体化设备，直接安装在超级计算和企业数据中心内 [CM006,
              CM009]。FY2025，本地部署系统交付带来 IQM EUR 31.3 million 已确认收入中的 EUR 30.6 million，云端分时和联合开发服务各贡献仅 EUR 0.3 million
              [CM007]。外围数据中心设施建设、通用经典服务器集群和独立算法咨询不在该边界内 [CM001]。公共超大规模云厂商主推远程云访问，但有严格数据主权要求的机构需要实体本地所有权 [CM009]。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM009
      - number: '2.2'
        title: 多种分析口径下的市场规模
        blocks:
          - type: paragraph
            body: >-
              量子计算市场规模会因衡量理论终端用户价值、供应商总可服务市场还是实际硬件采购交易而相差多个数量级 [CM001]。宏观咨询模型给出很大的长期市场：Boston Consulting Group 估计，到 2040
              年量子计算将释放 $450 billion 至 $850 billion 的终端用户经济价值，对应硬件和软件供应商 $90 billion 至 $170 billion 的市场 [CM001]。McKinsey
              & Company 类似预测，2035 年商业行业量子计算收入将达到 $28 billion 至 $72 billion [CM003]。但近期商业现实要受限得多。BCG 已下调近期 NISQ
              时代预期，承认硬件保真度瓶颈和经典 GPU 算法的快速性能提升推迟了回本时间 [CM002]。Omdia 与 IQM 的联合研究预计，随着企业商业部署加速，2032 年全球量子市场将达到 $22 billion
              [CM004]。实际合同追踪也显示爬坡过程缓慢：State of Quantum 报告记录，2021 至 2026 年全球执行了 121 份公共量子合同，交易总额 $2.6 billion，覆盖 14
              个国家、50 多套与超级计算机共同部署的系统 [CM005]。IQM 的商业进展与这一硬件主导现实一致：2026 年 8 月其合格订单积压超过 EUR 102 million，其中包括向 CSC LUMI
              超级计算机交付 150-qubit 系统的 EUR 33 million 合同 [CM008]。
