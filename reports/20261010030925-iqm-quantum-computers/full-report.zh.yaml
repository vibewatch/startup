      - number: '6.2'
        title: 系统交付、订单积压与商业轨迹
        blocks:
          - type: paragraph
            body: >-
              IQM 的商业进展取决于实体系统交付速度和已确认订单承诺，而非软件经常性收入。到 2026 年中，IQM 报告累计售出 26 台全栈量子计算机、全球交付 17 台；在首次公开合并公告时，这一数字为 21
              台售出、15 台交付，覆盖 13 个客户账户。按这一硬件发货节奏，IQM 已形成直接竞争者中全球规模最大的本地部署超导装机基础。商业势头还得到订单积压支撑：积压从 2025 年末的 EUR 67.3
              million 增至 2026 年 6 月 30 日的 EUR 69.1 million，并在 2026 年 8 月重大 EuroHPC 合同落地后跃升至超过 EUR 102.1 million。公司指引
              2026 全年收入 EUR 42 million 至 EUR 47 million，订单新增目标 EUR 65 million 至 EUR 75
              million。然而，本地部署系统要经过现场交付、低温降温和验收测试等严格里程碑，周期为 18 至 24
              个月，因此财务转化高度偏向每个财年的第四季度。哪怕一台机器调试延期或客户设施准备延后，也会造成重大季度收入波动。
            claimRefs:
              - CU001
              - CU002
              - CU011
