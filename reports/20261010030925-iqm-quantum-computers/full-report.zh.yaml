        - IQM 已成为欧洲超算中心首要的本地部署量子硬件供应商。
        - 全球已售出 26 套、交付 17 套系统，包括 LUMI AI Factory 和 Oak Ridge National Lab。
        - 失去欧洲主权采购优先地位，或无法交付下一代系统。
      - - 论点：积压订单与收入轨迹
        - 订单积压扩大至 €102.1M，为系统交付带来多年收入可见性。
        - 2026 年 6 月 30 日至 8 月 3 日期间，积压订单增加 €33.0M；FY2026 收入指引为 €42M–€47M。
        - 已签约系统取消或延期交付，导致收入确认兑现减少。
      - - 反论点：估值倍数溢价
        - 相比早期商业量子收入，$1.8B 股权估值代表极高溢价。
        - 对应 2025 年追踪收入（$35M）约 51 倍，以及 FY2026 指引收入区间约 34–38 倍。
        - 收入持续加速至 ARR 超过 €100M，且毛利率高于 60%。
      - - 反论点：经营亏损消耗高
        - 当前成本结构相对已实现的硬件收入产生巨额亏损。
        - 2026 年上半年收入 €8.9M、经营亏损 €60.5M，意味着年化消耗超过 €120M。
        - 制造规模扩大后，经营杠杆已得到证明，经营亏损在 24 个月内减半。
