      - number: '5.2'
        title: 硬件架构与低温基础设施
        blocks:
          - type: paragraph
            body: >-
              在实体处理层，IQM 设计基于超导 transmon 量子比特的量子处理单元，量子比特按方形晶格拓扑排列。为克服量子比特间串扰（多量子比特系统相干噪声和错误的主要来源），IQM 采用基于 transmon
              的可调耦合器技术。在可通过 Amazon Braket 使用的 20-qubit IQM Garnet 处理器等已部署系统中，20 个计算 transmon 量子比特由 30
              个可调耦合器相互连接，可让交互完全闲置，并实现 20 至 40 nanoseconds 的快速双量子比特门操作；单量子比特门和双量子比特门的中位门保真度分别为 99.92% 和
              99.51%。超导电路运行需要接近绝对零度的极端隔热：实体 QPU 置于 Bluefors 提供的高性能稀释制冷系统内。多级氦压缩机把组件冷却至 4 kelvin，持续闭环的 helium-3/helium-4
              气体处理系统则把内部基准温度维持在 10 millikelvin 以下。实体安装环境（如 Department of Energy 的 Oak Ridge National Laboratory
              Translational Research Capability building）需要专门的低振动地基，工程指标低于 250 microinches，以隔绝机械声学扰动对脆弱量子叠加态的影响。
