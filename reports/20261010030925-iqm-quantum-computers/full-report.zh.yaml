      - number: '8.3'
        title: 情景建模、倍数敏感性与下行触发条件
        blocks:
          - type: paragraph
            body: >-
              为评估风险调整后回报，我们围绕 FY2026 至 FY2028 投资期分析三种运营情景。乐观情景下，IQM 达到 FY2026 指引上限 €47 million，将超过 €102.1 million 订单积压的
              90% 转为确认收入，并成功扩建洁净室产能，支持年产最多 30 套系统，对应股权估值 $2.8 billion 至 $3.5 billion。基准情景下，收入按 €42 million 至 €45 million
              的指引运行，但交付排期和复杂的现场集成拉长确认周期，合理估值区间为 $1.6 billion 至 $1.9 billion。悲观情景下，安装延误或主权预算变化使确认收入低于 €35
              million，而持续的研发和行政费用令年化消耗超过 €120 million。沿着这一下行轨迹，现金储备会在 2028 年前过早耗尽，估值倍数严重压缩至 $600 million 至 $900 million
              的股权估值。鉴于当前 $1.8 billion 上市估值与基准情景预期高度接近，当前价格几乎没有安全边际。
            claimRefs:
              - CV004
