      - number: '7.3'
        title: 财务消耗跑道与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              IQM 的财务画像是商业化支出高企、经营现金持续流出。2026 年上半年，公司实现 EUR 8.9 million 收入，同时录得 EUR 60.5 million
              经营亏损，反映出大额研发投入、制造扩建和上市开支。尽管截至 2026 年 7 月 2 日，公司持有 EUR 309.4 million 现金，可提供流动性至 2028
              年第二季度，但要维持这条现金跑道，就必须把创纪录的 EUR 102.1 million 订单积压转化为确认的里程碑付款。合作伙伴和客户高度集中进一步放大了这些财务压力。商业进展几乎完全依赖主权机构、国家实验室和
              Oak Ridge National Laboratory、LRZ、CSC
              等学术高性能计算中心。此外，组装运营高度依赖稀释制冷机、亚开尔文微波电子设备和半导体耗材的单一来源供应商，交付进度因此暴露于外部供应链中断风险。
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR013
              - CR014
              - CR015
