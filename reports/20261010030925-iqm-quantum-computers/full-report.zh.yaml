      - number: '1.2'
        title: 管理层与董事会治理
        blocks:
          - type: paragraph
            body: >-
              IQM 的管理团队把超导物理的深厚学术积累与技术规模化及运营治理经验结合起来。公司由 Jan Goetz、Mikko Möttönen、Kuan Yen Tan 和 Juha Vartiainen
              创立，四人均来自 Möttönen 在 Aalto University 的 Quantum Computing and Devices 研究实验室。自 2026 年 1 月 1 日起，Jan Goetz 在与
              Mikko Välimäki 的过渡性联合 CEO 安排结束后出任唯一 CEO；Mikko Möttönen 继续担任首席科学家和 Aalto 教授。Kuan Yen Tan 以 CTO
              身份负责技术架构，Juha Vartiainen 管理持续运营。公司治理由 Sierk Poetting 主持的董事会监督，管理层还包括 CFO Jan Kürschner 和副 CEO Søren
              Hein。双重上市前，董事会吸纳了独立的国际科技高管，并有 Alex Doll（Ten Eleven Ventures）等机构代表加入。这套治理结构说明，公司正从早期研究项目转向上市公司合规与执行纪律。
            claimRefs:
              - CO001
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO009
      - number: '1.3'
        title: 资本结构与股东登记册
        blocks:
          - type: paragraph
            body: >-
              上市前，IQM 通过多轮融资累计筹得超过 $600 million 私募股权和非稀释性补助资金。早期机构支持包括 2020 年由 World Fund 主导的 EUR 39 million Series
              A1、2022 年由 World Fund 主导的 EUR 128 million Series A2，以及 EUR 35 million 的 European Investment Bank
              风险贷款额度。2025 年 9 月，IQM 获得 Ten Eleven Ventures 主导、超过 $300 million 的 Series B 融资，估值达到 $1.0 billion，芬兰主权基金
              Tesi 广泛参与。2026 年 7 月与 Real Asset Acquisition Corp. 合并，初始投前股权估值约为 $1.8 billion；截至 2026 年 7 月 2 日，获得 EUR
              309.4 million 可用流动性总额。包括芬兰机构养老金 Varma 和 Elo、欧洲气候科技基金 World Fund
              及战略企业伙伴在内的合并前股东，在交割时没有清算股权，并按约定锁定条款保留合并后母公司超过 81% 的集体持股。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO002
              - CO014
      - number: '1.4'
        title: 运营轨迹与部署历史
        blocks:
          - type: paragraph
            body: >-
              IQM 的运营里程碑显示，公司已从最初的大学测试台稳步扩展到多量子比特商业超级计算部署。硬件路线围绕 Spark 教育系统、模块化 Radiance 处理器（20-qubit Garnet 和 54-qubit
              Emerald 系统）以及容错 Halocene 架构展开。2026 年 6 月，IQM 向 United States Department of Energy 的 Oak Ridge National
              Laboratory 交付首套系统，进入北美研究市场。欧洲主权客户包括 VTT、慕尼黑的 Leibniz Supercomputing Centre (LRZ)、意大利 CINECA，以及由芬兰 CSC 管理的
              LUMI AI Factory；后者属于 EUR 33 million EuroHPC Joint Undertaking 合同。2026 年 8 月，IQM 披露累计订单积压已超过 EUR 102.1
              million，其中 EUR 33.0 million 来自季度后新增承诺，进一步支撑管理层对 2026 全年 EUR 42 million 至 EUR 47 million 收入的指引。
