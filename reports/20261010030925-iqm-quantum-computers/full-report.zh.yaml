      - number: '8.4'
        title: 尽调重点、审计缺口与 thesis-break 触发条件
        blocks:
          - type: paragraph
            body: >-
              严谨的投资立场要求先补齐几项关键证据缺口，才能考虑把评级从 research-more 上调至 buy。首要尽调包括取得经审计的 FY2025 及 FY2026 中期 IFRS
              财务报表，确认各收入流的毛利率、硬件折旧排期和真实经营现金流动态。此外，投资者必须评估 €102.1 million 订单积压中的客户集中度，判断有多少收入依赖单一主权拨款，并核实合同验收里程碑。会触发降至
              avoid 的明确 thesis-break 条件包括：FY2026 收入指引下调至 €38 million 以下；季度订单流入低于 €15
              million；旗舰客户硬件安装延误超过六个月且未获缓解；或季度现金消耗加速至超过 €35 million。反过来，要上调至 buy，必须连续两个季度实现符合指引目标的收入转化，同时经审计毛利率稳定在 50%
              以上。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV012
              - CV015
      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 严谨立场：FY2026 财务审计前维持 research-more
            body: >-
              IQM 通过本地 HPC 集成和专有错误缓解展现出显著技术差异化，但 $1.8B 上市估值对应未经审计 2025 年收入的高达 51x 倍数。在完整的 FY2026
              经审计财务报表确认毛利率可持续、订单积压转化速度可接受前，投资者应维持 research-more 立场。
            calloutType: recommendation
