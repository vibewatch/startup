  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础细分与买方经济性
        blocks:
          - type: paragraph
            body: >-
              IQM Quantum Computers 围绕实体本地部署硬件交付而非按量计费的量子云访问组织商业化。在 FY2025 经审计结果中，本地部署系统销售贡献 EUR 31.3 million 总收入中的 EUR
              30.6 million（超过 97 percent），云访问仅贡献 EUR 0.3 million。这种科学仪器式经济性决定了客户主要分成三个机构层级：主权超级计算中心、学术研究机构和早期商业企业试用者。由
              EuroHPC Joint Undertaking 联盟和国家科学部委资助的主权高性能计算（HPC）设施是 IQM 价值最高的买方，采购 54-qubit Radiance 和 150-qubit
              Halocene 等多量子比特系统。以芬兰 VTT Technical Research Centre 为代表的学术机构，使用较小的 5-qubit Spark 和 20-qubit
              系统开展基础量子物理教育和算法探索。商业企业采用仍处于早期：运输业龙头 Deutsche Bahn 曾在 IQM 硬件上探索量子—经典混合列车调度算法，波兰 Galaxy Systemy
              Informatyczne 也下达了企业硬件订单，但商业买方只占承诺的一小部分。Atos-IQM 研究显示全球 76 percent 的 HPC
              中心计划采用量子计算，支持了本地部署系统的市场兴趣，但补贴型主权预算之外的转化仍未经验证。
            claimRefs:
              - CU012
