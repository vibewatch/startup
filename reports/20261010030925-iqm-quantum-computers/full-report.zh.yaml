      - number: '3.2'
        title: 架构差异化与纠错策略
        blocks:
          - type: paragraph
            body: >-
              量子硬件制造商的差异化越来越取决于量子纠错（QEC）效率和处理器连接性，而非物理量子比特数量。传统超导架构（如 IBM 的 heavy-hexagonal
              lattice）把物理量子比特的交互限制在两三个最近邻，因此实施标准表面码时需要大量物理到逻辑量子比特开销。相比之下，IQM 推出了 Constellation
              处理器拓扑，增强平面连接性，使单个量子比特原生支持最多 12 个相邻量子比特。为利用这一硬件设计，IQM 开发了属于量子低密度奇偶校验（QLDPC）家族的专有 barbell
              codes。通过无需复杂交叉布线的长耦合器连接平面簇，IQM 预计逻辑错误率可比传统表面码低最多三个数量级，同时所需物理量子比特减少最多八倍。与此同时，Quantinuum
              等囚禁离子竞争者提供全连接性和更高原始门保真度，但门延迟达到毫秒级，而 transmon 的速度为纳秒级。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
