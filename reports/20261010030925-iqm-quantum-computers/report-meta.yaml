companyProfile:
  summary: >-
    IQM Quantum Computers is a Finland-based full-stack superconducting quantum computing company that has moved from
    academic spinout to publicly listed hardware vendor serving sovereign supercomputing centers, national laboratories,
    and universities. It differentiates through customer-owned on-prem deployments, a complementary cloud platform, and
    integrated hardware-software delivery, but its economics remain dominated by milestone-based system sales,
    public-sector procurement cycles, and a still-limited recurring revenue base.
