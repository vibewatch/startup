  topStrengths:
    - Verified on-prem deployment capability across sovereign supercomputing and research customers.
    - Public listing materially improved liquidity and runway.
    - Differentiated superconducting architecture and European sovereign positioning.
  topRisks:
    - Hardware revenue is lumpy and heavily exposed to public-sector procurement cycles.
    - Valuation remains rich relative to current revenue scale and operating losses.
    - Fab scaling, acceptance timing, and customer concentration could delay conversion of backlog to cash.
  unresolvedGaps:
    - Recurring revenue durability, customer concentration by revenue, and service attach rates remain under-disclosed.
    - Unit economics by product tier and long-term maintenance economics remain opaque.
    - Post-listing regulatory, redemption, and export-license details still need more disclosure.
