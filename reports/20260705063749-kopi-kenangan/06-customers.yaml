  title: Require channel-mix and cohort data before treating public acquisition metrics as durable retention proof
  body: The diligence pack should include own-app versus aggregator mix, repeat order curves by VIP tier, refund-resolution KPIs, and country-level active-user cohorts for Malaysia and other new markets.
