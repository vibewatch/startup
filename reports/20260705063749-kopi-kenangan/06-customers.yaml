  evidenceGaps:
  - type: missing-source
    severity: material
    topic: channel-mix
    missingEvidence: Owned-app, walk-in, and aggregator order mix with gross margin and refund rates by channel.
    whyItMatters: Channel economics determine whether headline customer growth is compounding into profitable loyalty or leaking through lower-quality third-party demand.
    diligencePath: Request monthly orders, GMV, AOV, refund rate, and repeat rate split across owned app, walk-in/QR, GrabFood, GoFood, and ShopeeFood.
    relatedQuestionRefs:
    - QU015
    - QU017
    - QU025
    relatedTableRefs:
    - TU007
  - type: missing-source
    severity: material
    topic: retention-cohorts
    missingEvidence: Customer cohorts by VIP tier, repeat order frequency, churn, and redemption behavior.
    whyItMatters: Public app ratings and active-user counts do not prove whether acquired users become high-LTV repeat buyers or simply respond to promotions.
    diligencePath: Ask for monthly cohort tables showing first-to-second order conversion, 30/90/180-day repeat rates, VIP distribution, and points earn/burn by tier.
    relatedQuestionRefs:
    - QU010
    - QU016
    - QU024
    - QU025
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: material
    topic: international-active-users
    missingEvidence: Country-level active users, ratings density, repeat behavior, and customer-support KPIs for Malaysia, Singapore, and other overseas markets.
    whyItMatters: Store counts and EBITDA milestones show rollout success, but they do not show whether overseas customer fit is durable at the cohort level.
    diligencePath: Request monthly active users, repeat rates, NPS/ratings, and support metrics by country, with Malaysia broken out separately from the rest of international.
    relatedQuestionRefs:
    - QU020
    - QU021
    - QU025
    relatedTableRefs:
    - TU007
  - type: missing-source
    severity: material
    topic: support-sla
    missingEvidence: Refund-resolution SLA, out-of-stock refund policy compliance, crash rates, and complaint incidence over time.
    whyItMatters: Public complaints repeatedly touch the exact moments where trust can break—checkout, delivery, refund, and promotion redemption.
    diligencePath: Request customer-support dashboards covering first-response time, median resolution time, refund turnaround, app crash incidence, and complaint rate per 10,000 orders.
    relatedQuestionRefs:
    - QU014
    - QU023
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: TU004 named customer proof coverage is still anecdotal
    missingEvidence: Named customer proof beyond app reviews and complaint letters, especially merchant, corporate, or overseas repeat-reference accounts.
    whyItMatters: The chapter can prove real consumer usage, but it cannot yet prove that the strongest public voices are representative of the broader customer base or of higher-value cohorts.
    diligencePath: Request three to five named repeat customers or merchant/event buyers, plus anonymized order-frequency snapshots, to supplement the current anecdotal public proof.
    relatedQuestionRefs:
    - QU012
    - QU024
    - QU025
    relatedTableRefs:
    - TU004
