- id: TU001
  title: Customer segment map
  columns:
  - Segment
  - Buyer / user / payer
  - Primary job-to-be-done
  - Public scale / proof
  - Strategic value
  - Gap
  rows:
  - - Young affordable-premium drinkers
    - Buyer=user=payer
    - Upgrade from street or instant coffee without paying global-chain prices
    - Forbes says the original target was young consumers; GoodStats shows 97% brand awareness
    - Core acquisition engine and mass-market relevance
    - No disclosed spend per cohort or loyalty split by age
  - - App-first commuters and office workers
    - Buyer=user=payer
    - Pre-order, skip queues, grab drinks near work or commute routes
    - App, outlet map, airports, stations, office towers, fuel stations, campuses
    - High-frequency convenience loop
    - No public order-frequency curve by venue
  - - Owned-channel loyalty members
    - Buyer=user=payer
    - Earn points, redeem vouchers, and climb VIP tiers through repeat purchases
    - Points, QR-linked transactions, Gold and Black thresholds
    - Best shot at owned retention and CRM
    - No disclosure of member counts or tier-level retention
  - - Delivery and aggregator users
    - Buyer=user=payer
    - Get drinks without visiting stores directly
    - GrabFood chain page, driver-related complaints, aggregator exclusion from VIP progress
    - Extends reach beyond foot traffic
    - No channel mix, margin, or repeat data by aggregator
  - - Office / event / voucher buyers
    - Organizer or admin pays; attendees consume
    - Serve meetings, gatherings, birthdays, weddings, and bulk occasions
    - Big Order page advertises discounts, free delivery, barista, booth, and e-vouchers
    - Higher-ticket cohort outside single-cup consumption
    - No disclosed revenue share or repeat cadence
  - - RTD / off-store consumers
    - Buyer=user=payer
    - Consume bottled coffee during daily routines away from cafés
    - Official RTD page positions bottled line as an everyday companion
    - Broadens reach beyond store network
    - No sell-through or repeat data by channel
  - - International consumers in Malaysia / Singapore
    - Buyer=user=payer
    - Access contemporary Indonesian coffee with localized taste and pricing
    - SG site, Malaysia menu page, and Malaysia outlet expansion disclosures
    - Most credible overseas growth wedge so far
    - Country-level actives and repeat data remain undisclosed
  notes: Rows blend public narrative, official surfaces, and third-party reporting; they are segmentation hypotheses, not disclosed cohort economics.
