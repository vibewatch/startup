- id: TU007
  title: Channel, international-fit, and concentration risk table
  columns:
  - Driver / dependency
  - Evidence
  - Upside
  - Risk
  - Diligence path
  rows:
  - - Owned app and QR-linked loyalty
    - Points, VIP tiers, order-ahead, exclusive promos
    - Better data capture and potential margin
    - No disclosed churn, cohort, or tier mix
    - Request cohort retention, order frequency, and member-tier distribution
  - - Aggregator delivery platforms
    - GrabFood branch density, driver-related complaint, VIP exclusion for aggregator orders
    - Extends convenience beyond walk-in traffic
    - Repeat demand can leak outside the owned loyalty loop and suffer third-party service issues
    - Request GMV, order count, and refund rate by channel
  - - Dense grab-and-go footprint
    - 1,324 outlets across six countries; 85% grab-and-go kiosk model
    - High convenience and habit formation near daily routes
    - Fixed network complexity if traffic or promotions soften
    - Request payback and same-store repeat by venue type
  - - RTD / off-store extension
    - Bottled coffee positioned for daily moments; business tripled from a low base in 2025 per Forbes
    - Reaches towns and use cases stores cannot serve directly
    - Low-base growth may overstate long-term durability
    - Request sell-through and repeat purchase by retail channel
  - - Malaysia / Singapore international fit
    - 158 Malaysia outlets at end-2025, live SG and MY customer surfaces, localized menu and pricing
    - Most credible overseas growth wedge
    - Customer metrics abroad are still network-led rather than cohort-led
    - Request country-level active users, ratings, and repeat by market
  notes: This table focuses on what can expand the customer base and what can undermine its durability. Most risks stem from missing disclosure rather than evidence of collapse.
