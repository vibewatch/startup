company:
  name: Kopi Kenangan
chapter:
  number: 6
  title: Customers
  summary: 'Kopi Kenangan''s customer story is strongest on reach and acquisition: the chain now combines a dense grab-and-go footprint, 1.5 million monthly transacting digital users, 4.47 million new customers added in 2025, and very high public app-store ratings. The customer base is broad—young price-sensitive drinkers, app-first commuters, delivery users, office/event buyers, RTD shoppers, and growing Malaysia/Singapore audiences—but repeat quality is still inferred rather than proven because public sources do not disclose churn, cohort retention, or channel mix. Public customer friction is also real: app reviews and consumer complaints point to crashes, refund handling issues, promo mismatches, and delivery dependence that can leak demand away from the owned loyalty loop.'
sections:
- id: segments-and-jobs-to-be-done
  title: Customer segments and jobs to be done
  body: 'Kopi Kenangan is not selling a single café experience to a single buyer profile. Public sources show a layered consumer base: young mass-market drinkers looking for affordable premium coffee; app-first commuters who want to skip queues; delivery users who trade price and loyalty capture for convenience; office and event buyers ordering in bulk; and RTD shoppers who encounter the brand outside its stores. The international surfaces add another layer, with Malaysia and Singapore positioned as customer-facing extensions of the same Indonesian-coffee identity. What ties these cohorts together is convenience plus a deliberate price lane between street coffee and global chains. The strongest public fit is therefore not luxury coffee culture; it is repeatable daily use, especially where customers value speed, mobile ordering, and a recognizable but still affordable brand. The main gap is that public segmentation is rich in narrative but thin in cohort economics, so the chapter has to rely
    on footprints, app behavior, and publicly visible use cases rather than disclosed customer lifetime data.'
