figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: How Kopi Kenangan turns awareness into an owned-channel order, then tries to convert that order into repeat behavior across stores, delivery, and adjacent products.
  data:
    items:
    - label: Awareness and trial
      detail: Young consumers notice the brand through dense store presence, social familiarity, and an affordable-premium price lane.
      touchpoints:
      - 97% brand awareness
      - Rp22k flagship drink
      - Malls, transit, campuses, fuel stations
    - label: Channel selection
      detail: Customers can walk in, pre-order through the app, or use delivery channels when convenience matters more than loyalty capture.
      touchpoints:
      - Walk-in / QR
      - Pre-order pickup
      - Delivery / aggregators
    - label: Owned digital order
      detail: The app emphasizes queue-skipping, maps, real-time status, and broad payment options to reduce friction at checkout.
      touchpoints:
      - Order ahead
      - Real-time notifications
      - Cashless payment
    - label: Repeat loop
      detail: Points, cashback, vouchers, birthday treats, and spend-based VIP tiers try to turn frequency into habit.
      touchpoints:
      - 1 point = 1 rupiah
      - Gold at Rp700k
      - Black at Rp10m
    - label: Adjacent expansion
      detail: The same customer can move into bulk orders, RTD consumption, or international Kenangan Coffee surfaces.
      touchpoints:
      - Big Order
      - RTD bottled line
      - Malaysia / Singapore
    - label: Friction leak
      detail: Crashes, refunds, promo mismatch, and aggregator exclusion can interrupt repeat behavior even when demand is real.
      touchpoints:
      - Store crash review
      - Refund complaint
      - Promo mismatch
  approximationNotes: The journey map is structural, not a quantified conversion funnel. It combines official product surfaces with public customer-friction evidence.
  claimRefs:
