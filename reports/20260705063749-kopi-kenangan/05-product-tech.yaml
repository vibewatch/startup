    {
      "id": "store-operations-and-delivery-integration",
      "title": "Store operations and delivery integration",
      "body": "Operating design still looks optimized for fast-turn beverages rather than long dwell-time cafés. Independent reporting says about 85% of the network functions as grab-and-go kiosks, while the company itself describes a pandemic-era expansion pivot from CBD-heavy siting toward residential catchments. That is consistent with the app workflow and with the visibility Kopi Kenangan maintains on third-party delivery platforms. GrabFood carries a dedicated Kopi Kenangan chain page listing many outlets, and Foodpanda surfaces beverage, bakery, and hot-food menus that effectively turn the store into a remote-order storefront. International launches reinforce the same playbook with local twists: Malaysia was chosen partly because grab-and-go culture and digitalization fit the model, Singapore copied the app-linked loyalty loop, and Taiwan paired a local operating partner with localized menu adaptation. The important limitation is that public sources show distribution breadth, but not the exact split between first-party app orders and aggregator-led orders, so delivery dependence is visible qualitatively without a clean economics or control breakdown.",
