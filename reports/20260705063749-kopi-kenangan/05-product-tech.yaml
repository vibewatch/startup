    {
      "id": "app-ordering-loyalty-and-digital-surface",
      "title": "App ordering, loyalty, and digital surface",
      "body": "The consumer app is a real operating surface, not just a marketing wrapper. Public app-store copy shows order-ahead pickup, delivery, outlet discovery, cashless payment, item-level customization, real-time status notifications, and a pickup-area workflow that compresses queue time in store. Loyalty is deeply embedded: Hearts or Kenangan Points accrue through in-app orders or QR scans at the cashier, unlock multiple membership tiers, and are paired with vouchers, birthday offers, and early access to new products. AppBrain and Apple metadata indicate the app is still actively maintained in late June 2026, and the Android telemetry suggests large installed-base reach. The product-quality caveat is that edge-case complaints remain visible in public review surfaces. Independent reviews mention crashes in store selection, refund-to-points handling after stockouts, and irritation with membership-policy changes. That does not negate the strength of the digital surface, but it does show that payment, refund, and exception handling remain important diligence items if the app is underwriting repeat behavior and promotional efficiency.",
