  topStrengths:
    - 已在六个国家开出 1,324 家门店，2025 年集团利润转正，规模得到验证。
    - 可负担高端定位叠加高密度小店模型，价值感和便利性都强。
    - App 点单和会员体系贡献接近一半销售，并带来 1.5M 月交易用户。
    - 投资人阵容强，且已有融资跨过独角兽门槛的历史。
    - 马来西亚和其他海外市场已有早期证据，证明模型不只适用于印尼。
  topRisks:
    - 据报道的 $1.2B-$1.4B 估值区间已假设溢价倍数，但经审计披露仍很薄。
    - 咖啡、乳制品、包装和汇率波动可能在价格敏感品类里压缩利润率。
    - App 崩溃、退款摩擦、促销争议和对聚合平台的依赖，都会削弱留存质量。
    - 印尼现代咖啡市场仍拥挤、重促销，容易陷入价格战。
    - 治理、董事会和优先股堆叠不透明，抬高退出承销和普通股价值判断难度。
  unresolvedGaps:
    - 经审计的 2025 年合并财报、现金余额、资本开支和门店回本周期尚未公开。
    - 任何 2025-2026 年二级交易都没有已确认成交价或披露条款。
    - 队列留存、自有渠道与聚合平台渠道占比、VIP 层级经济性仍未披露。
    - 完整董事会构成、保留事项权利和优先股堆叠条款仍不透明。
