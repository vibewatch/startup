- id: TV007
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Secondary process clears well below sale talk
    - Any verified transaction below ~US$1.0b
    - Would prove that current buyer appetite is below headline seller expectations.
    - Re-rate fair value lower and revisit comp premium assumptions.
  - - Growth slips below the current run-rate narrative
    - Revenue fails to move beyond ~US$200m run rate in 2026
    - Breaks the bridge required to defend a premium multiple.
    - Shift toward public median multiples only.
  - - Overseas proof stalls
    - Malaysia or new markets revert to losses without scale offsets
    - Reduces the case that the platform can export Indonesian economics.
    - Cap the upside case and cut the international premium.
  - - Value-sensitive demand cracks
    - Visible price discounting or margin erosion in Indonesia
    - Shows affordable-premium positioning is less durable than assumed.
    - Increase downside weight and require a lower entry price.
  - - Cap-table overhang emerges
    - Preferences or secondary mechanics materially subordinate new common holders
    - Turns the headline valuation into a poor proxy for economic value.
    - Pause until full legal and cap-table diligence clears.
  notes: These are valuation-moving triggers rather than generic operational risks.
