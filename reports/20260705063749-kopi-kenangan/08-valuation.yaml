  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cap-table-overhang
    missingEvidence: Detailed 2025-2026 cap table, liquidation preferences, ratchets, MFN clauses, and any company-supported secondary mechanics.
    whyItMatters: The headline valuation is not economically equivalent to common equity value if preference stacks or downside protections are material.
    diligencePath: Request the latest cap table, financing documents, and any tender/secondary term sheets from counsel and the CFO.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV008
  - type: missing-source
    severity: material
    topic: cleared-secondary-price
    missingEvidence: Confirmed outcome of the reported 2025-2026 stake-sale process, including clearing price, stake size, and buyer quality.
    whyItMatters: A rumored range is not the same as a completed market-clearing transaction and should not be treated as final fair value.
    diligencePath: Verify with management, lead financial adviser, or updated secondary market documentation before underwriting the reported range.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV003
    - TV008
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited 2025 consolidated statements with cash flow, regional segment mix, working capital, and bridge from EBITDA to net income.
    whyItMatters: The current public evidence proves profitability directionally but is still too thin to translate reported earnings into durable cash generation.
    diligencePath: Obtain audited FY2025 statements, management accounts for 1H2026, and auditor commentary on revenue recognition and cash conversion.
    relatedTableRefs:
    - TV008
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable coverage
    missingEvidence: Live public valuation marks for nearby private Southeast Asian coffee chains and a clean public-market cap source for Jollibee.
    whyItMatters: The comparable table is intentionally partial, so missing adjacent private and ASEAN public marks can slightly bias the benchmark set toward the names with the best public disclosure.
    diligencePath: Add any later public/private coffee or ASEAN F&B marks when they become fetchable from reliable direct sources.
    relatedQuestionRefs:
    - QV009
    - QV015
    relatedTableRefs:
    - TV004
