company:
  name: Kopi Kenangan
chapter:
  number: 8
  title: Valuation
  summary: Kopi Kenangan has built real scale and reached profitability, but the reported US$1.2 billion-US$1.4 billion secondary-sale range already assumes a premium multiple close to the richest public coffee comps while disclosure and exit conditions remain incomplete. Public evidence supports a track recommendation, medium confidence, high risk, and a stretched valuation stance with a more defendable fair-value band around US$0.8 billion-US$1.1 billion.
sections:
- id: section-1
  title: 'Recommendation: real operating proof, but the reported private mark already prices in a premium'
  body: 'Kopi Kenangan has crossed the line from concept to operating business. Public reporting now points to a first full year of group-level profit in 2025, roughly US$184 million of revenue, and a 1,324-outlet network spanning six countries. That matters because the company no longer has to be valued purely on aspirational store rollouts or smartphone-download momentum; it has real sales, a meaningful digital channel, and evidence that overseas operations can move from launch losses toward EBITDA positivity.


    The valuation question is harder. The most visible current price signal is not a priced primary round but an early-stage 2025 secondary-sale exploration that could value the company at US$1.2 billion to US$1.4 billion. That range is directionally encouraging because it sits above the 2021 unicorn mark, but it is not the same as a completed clearing price, and it arrives before investors can inspect audited 2025 statements, the preference stack, or the exact terms of any tender. The right chapter-level call is therefore track: strong enough to keep working, not yet cheap enough or transparent enough to underwrite as a buy at the reported secondary range.'
