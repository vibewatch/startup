- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - The company has moved from growth-only to profitable scale.
    - thesis
    - A reversal in 2026 profitability or digital engagement would weaken the premium case.
  - - Malaysia EBITDA progress suggests overseas unit economics can mature, not just domestic ones.
    - thesis
    - If new markets remain loss-making beyond year two, international white-space value should be discounted.
  - - Affordable-premium positioning and the app create a real customer franchise.
    - thesis
    - If repeat usage or app-led orders slip materially, the moat looks shallower than management suggests.
  - - The reported secondary range already prices a Dutch Bros-like growth premium.
    - anti-thesis
    - A lower-clearing secondary or materially faster audited growth would re-set the comp discussion.
  - - Exit markets in Southeast Asia still reward EBITDA execution more than multiple expansion.
    - anti-thesis
    - A reopening IPO window or strategic buyer interest could soften the discount.
  - - The cap table and exact secondary terms remain opaque.
    - anti-thesis
    - Preference-light terms or clean common-equity proceeds would reduce the overhang.
  notes: Arguments are intentionally price-sensitive; the anti-thesis focuses on what the current secondary chatter already assumes.
