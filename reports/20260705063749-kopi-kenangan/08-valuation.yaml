- id: TV006
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Revenue reaches roughly US$250m in 2026, Malaysia and new markets keep improving, and buyers still grant a premium coffee-growth multiple.
    - At ~6x revenue, value can approach US$1.5b and justify the upper end of current secondary chatter.
    - Requires sustained expansion without margin dilution and better exit-market sentiment.
    - low-medium
  - - Base
    - Revenue lands around US$220m with profitability intact, but the market pays only a modest premium to public medians.
    - At ~5x revenue, value is about US$1.1b, below the reported US$1.2b-US$1.4b range.
    - Good execution may still not outrun multiple normalization and disclosure discounts.
    - medium
  - - Bear
    - Revenue holds near a US$200m run rate, but investors anchor on public-style disciplined multiples amid constrained exits.
    - At ~4x revenue, value falls toward US$0.8b.
    - No demand collapse required; a lower multiple alone can drive the downside.
    - medium-high
