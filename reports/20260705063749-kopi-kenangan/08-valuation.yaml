- id: section-2
  title: 'Public comp framework: the sale-talk range already leans toward a Dutch Bros-style premium'
  body: 'The reported US$1.2 billion to US$1.4 billion range equates to roughly 6.5x to 7.6x 2025 revenue, or about 6.0x to 7.0x on management’s stated US$200 million annualized run rate. That is well above Starbucks, Grab, and Luckin, and only modestly below Dutch Bros, the premium public coffee-growth name in this set. Put differently, the reported private mark is not asking investors to pay a modest Southeast Asian consumer multiple. It is asking them to assume that Kopi Kenangan deserves a growth premium close to the highest-quality public coffee comp, even though public disclosure is far thinner.


    There are reasons the premium is not absurd. Kopi Kenangan is growing faster than Starbucks, has already returned to profitability, and still has a large white space in Southeast Asia. But public evidence also shows why investors should resist treating the reported range as self-validating. Luckin proves that a massive Asian coffee network can trade near 1x revenue when the market sees it more as a scaled mass-market operator than a scarcity growth story. DoorDash and Grab show that repeat consumer demand platforms can still settle in the mid-single-digit revenue-multiple band. On a public-comp basis, Kopi Kenangan looks more stretched than cheap.'
