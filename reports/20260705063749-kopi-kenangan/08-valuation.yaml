  - read-through
  rows:
  - - 2020 Series B
    - Growth financing led by major regional investors
    - US$109m raised
    - Still pre-profit and roll-out heavy
    - Built the capital base but did not create a disclosed fair-value anchor.
  - - 2021 Series C
    - Company announced unicorn status
    - '>US$1.0b valuation on US$96m new capital'
    - 600+ stores, 45 cities, sales more than doubled
    - First hard valuation mark investors still reference.
  - - 2024 operating year
    - Losses narrowed after overseas investment
    - No new priced mark disclosed
    - Revenue about US$119m; loss narrowed to about US$2.3m
    - Showed the business could approach break-even before 2025 profit.
  - - 2025 operating year
    - First full year of group profit
    - No new priced primary round disclosed
    - US$184m revenue, US$17m profit, 1,324 outlets
    - Created the revenue base used in current public valuation bridges.
  - - 2025 secondary exploration
    - GIC and Peak XV reportedly explored partial stake sales
    - US$1.2b-US$1.4b indicated range
    - Process remained early stage and uncertain
    - Useful sentiment marker, not a completed clearing price.
  - - 2026 public-evidence underwrite
    - Current chapter estimate
    - US$0.8b-US$1.1b defensible band
    - Assumes US$200m-US$220m revenue base and 4x-5x public-style multiple
    - Below sale-talk range until disclosure and market evidence improve.
  notes: Rows mix reported marks with explicitly labeled author estimates to show how valuation expectations evolved.
