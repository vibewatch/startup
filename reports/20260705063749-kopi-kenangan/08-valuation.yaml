- id: TV008
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Cap table and preferences
    - Latest common-equity waterfall, liquidation preferences, ratchets, MFN rights, and any secondary mechanics
    - Determines whether the headline valuation is economically real for new common investors.
    - Counsel + CFO data room review
  - - Audited FY2025 financials
    - Audited income statement, cash flow, balance sheet, and regional segment bridge
    - Needed to convert reported profitability into durable cash-generation evidence.
    - Audit package + management accounts
  - - Cleared secondary evidence
    - Final price, buyer identity, stake size, and transaction status of the reported 2025-2026 process
    - Separates rumor from a true market-clearing price.
    - Lead adviser / board materials
  - - International unit economics
    - Store-level payback and cohort economics for Malaysia, India, Australia, and the Philippines
    - Tells investors whether the 2030 store plan deserves a premium multiple.
    - Regional operating review
  - - Cash funding for expansion
    - How the proposed US$200m expansion plan is financed without eroding returns
    - Avoids assuming that growth automatically compounds equity value.
    - Treasury model + board-approved capex plan
  notes: These are the specific diligence items most likely to move the recommendation or the acceptable entry price.
