companyProfile:
  summary: >-
    Kopi Kenangan is a Jakarta-based, tech-enabled grab-and-go coffee chain founded in 2017 by Edward
    Tirtanata, James Prananto, and Cynthia Chaerunnisa. The company built a middle-tier coffee concept
    between low-cost street coffee and premium global chains, then scaled it through app ordering,
    pickup, delivery, loyalty, RTD extensions, and a dense kiosk-led footprint. Public 2025 reporting
    points to 1,324 outlets across six countries, roughly $184 million of revenue, and the first full
    year of group profitability, making Kopi Kenangan one of Southeast Asia's most scaled new-retail
    F&B platforms.
  founders:
    - name: Edward Tirtanata
      role: Co-founder & CEO
      background: Previously built Lewis & Carroll Tea and studied finance and accounting at Northeastern.
      claimRefs: [CO013, CO017]
    - name: James Prananto
      role: Co-founder / board director
      background: Brought finance and marketing experience before co-founding Kopi Kenangan.
      claimRefs: [CO014, CO018]
    - name: Cynthia Chaerunnisa
      role: Co-founder
      background: Held consumer-marketing roles at foodpanda, Sephora, Uber, and Shopee before joining the founding team.
      claimRefs: [CO015, CO019]
  foundingLocation: Jakarta, Indonesia
  headquarters: Jakarta, Indonesia
  productSummary: >-
    Affordable-premium coffee, non-coffee beverages, RTD products, and complementary food sold through
    kiosk-heavy stores, app ordering, pickup, delivery, event ordering, and regional Kenangan Coffee
    storefronts.
  customerFocus: >-
