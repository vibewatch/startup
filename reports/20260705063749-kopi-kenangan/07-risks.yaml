- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Privacy or consumer-protection breakdown
    - Formal regulator inquiry, repeated promo-mismatch complaints, or material complaint spike
    - Any sanction, data incident, or repeated unresolved promo/refund issues across markets
    - Pause expansion in the affected channel or market until controls and disclosures improve.
  - - Commodity and FX squeeze
    - Coffee benchmark, rupiah path, gross-margin trend
    - Coffee above ~350 USd/lb or two quarters of margin compression without pricing recovery
    - Reset store-opening tempo and require market-by-market margin bridges.
  - - Platform / app dependency stress
    - Cancellation rate, app conversion, delivery-fee load, refund days outstanding
    - Sustained conversion decline or refund backlog beyond one billing cycle
    - Rebalance acquisition away from paid platform dependence and tighten service recovery.
  - - Quality-control deterioration
    - Audit failures, complaint recurrence, or outlet-level product inconsistency
    - Clustered hygiene or consistency failures in one market or format
    - Freeze new outlets in the affected cluster until audit pass rates recover.
  - - Exit / liquidity miss
    - IPO milestones, audited statements, exchange decision, and board readiness
    - No clear filing path after governance prep or visible deterioration in market economics
    - Underwrite a longer hold and lower multiple until disclosure catches up.
  notes: Thresholds are monitorable heuristics intended to convert broad risk discussion into investable kill criteria.
