- id: commodity-fx-and-dependency-risk
  title: Commodity, FX, and dependency risk
  body: 'Kopi Kenangan’s scale does not remove raw-input risk; it amplifies it. Forbes reported that benchmark arabica futures almost doubled in the two years to January 2026 and were still more than 50% above January 2024 levels in late March, while Trading Economics still showed coffee above 300 US cents per pound in early July 2026 after a 22% one-month rise. The company’s own positioning keeps that exposure close to the core proposition: overseas marketing emphasizes Indonesian coffee sourcing and Indonesian palm sugar, while the Singapore site says coffee is sourced from multiple Indonesian regions. At the same time, macro conditions add a second squeeze. Bank Indonesia and Tempo both show a rupiah environment that still requires intervention and assumes a weak 2026 average exchange rate, while Forbes says Malaysia already contributes about 15% of sales as overseas mix grows. The dependency issue therefore runs through both cost and translation: coffee, palm sugar, packaging, imported
    equipment, and multi-currency earnings can all move against the company before any consumer price increase fully sticks.'
  claimRefs:
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
