company:
  name: Kopi Kenangan
chapter:
  number: 7
  title: Risks
  summary: Kopi Kenangan’s main downside is no longer whether affordable-premium coffee has demand, but whether a fast-scaling, app-heavy, multi-country format can preserve margin, service consistency, and governance discipline at the same time. The heaviest public risk signals are coffee and FX volatility, intense store-level competition, delivery and app dependency, consumer-complaint evidence on promos and refunds, and an IPO story that is governance-aware but still short of prospectus-grade disclosure.
sections:
- id: regulatory-privacy-and-licensing-risk
  title: Regulatory, privacy, and licensing risk
  body: 'Kopi Kenangan already discloses more legal surface area than a tiny startup: its Indonesian legal page publishes a Ministry of Trade consumer-complaint contact, its app privacy policy is long and explicit, and its Singapore franchise privacy notice is detailed enough to show how overseas franchise expansion is being operationalized. That is a mitigation, but it also reveals the risk map. The Indonesian policy says the app and related brand sites collect identity, payment, device, installed-app, location, transaction, and loyalty data; the same policy allows sharing across group companies, service providers, commercial partners, and authorities, while acknowledging that no transmission or storage method is perfectly secure. Public regulatory pressure is also rising around the physical product layer. Indonesia’s 2026 compliance stack now converges halal, BPOM labeling, and traceability requirements, and the official OSS portal confirms that overseas franchisor expansion still sits
    inside a registration regime rather than a pure commercial rollout. For investors, the issue is not a known enforcement case today, but whether the legal, data-governance, and franchise-compliance burden scales as quickly as the store network and app usage do.'
