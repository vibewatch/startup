- id: TR007
  title: Operating-risk timeline
  columns:
  - date / period
  - event
  - risk signal
  - implication
  rows:
  - - '2022-02-18'
    - Current Indonesian privacy policy took effect
    - App and loyalty data practices became formally documented
    - Data-governance obligations are not a future issue; they already exist.
  - - 2022 result later cited in 2026 coverage
    - Net loss rose 70% year on year after diversification and overexpansion
    - Capital abundance previously translated into strategy drift
    - Management discipline should be underwritten, not assumed.
  - - '2024-10-15'
    - Consumer complaint reported cancelled order and no refund after seven days
    - Recovery operations can fail even without a public outage
    - Refund and complaint handling should be tested directly in diligence.
  - - End-2025
    - Company reported 1,324 outlets, first net profit, and 1.5 million monthly digital users
    - Scale and digital reliance both jumped together
    - Control systems must now scale with network size.
  - - '2026-02-04'
    - Management said it wanted to be IPO-ready within 12 months but had no timetable
    - Governance narrative is ahead of listing execution
    - Liquidity timing remains uncertain.
  - - '2026-04-01'
    - Consumer complaint alleged unusable BOGO promo on an outlet menu with no posted response
    - Trust erosion can start from small in-store information failures
    - Promo-governance and complaint closure are operating-risk indicators.
  notes: The timeline highlights public milestones that changed the company’s risk profile rather than trying to catalogue every corporate event.
