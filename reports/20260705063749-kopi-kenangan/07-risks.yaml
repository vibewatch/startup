- id: service-quality-labor-and-food-safety-risk
  title: Service quality, labor, and food-safety execution risk
  body: 'The most concrete adverse evidence in the retained set is not a regulator action or a recall; it is repeated consumer-friction evidence alongside a large, distributed operating footprint. Media Konsumen complaints capture recurring themes across the app and stores: promo transparency disputes, cancelled orders, delayed refunds, dissatisfaction with customer-service handling, and concern about having to send bank-mutation records to process a refund. Those are not necessarily existential by themselves, but they matter more because the operating base is large. The career page says the company has dedicated operations and quality-assurance teams, frequent vendor audits, and internal audits on hygiene, safety, and consistency, while the About and outlet pages indicate a multi-thousand-employee footprint spread across hundreds of locations in dozens of Indonesian cities. Public process disclosure therefore exists, but public control metrics do not. There is still no retained public evidence of BPOM
    permit IDs, recall history, app uptime targets, refund SLA attainment, complaint close rates, or audit pass rates. That leaves investors judging service and food-safety resilience mainly from complaints, scale, and management claims rather than from a quantified control dashboard.'
