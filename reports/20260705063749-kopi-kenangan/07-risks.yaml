- id: governance-expansion-and-exit-risk
  title: Governance, international expansion, and exit/liquidity risk
  body: 'The public record now shows a company that understands governance language, but is still asking investors to bridge a private-company disclosure gap. IDNFinancials is useful here because it records management’s own postmortem: too much early funding encouraged too many side initiatives, and 2022 losses widened before the 2025 profit turn. Later 2026 coverage from Kontan, Forbes, and IDN Times says the company wants to be IPO-ready, is tightening controls, using Big Four audit support, accelerating reporting cycles, and improving legal and tax discipline. Yet management still does not commit to a listing date, exchange, or filing timeline, and no retained 2026 source disclosed a prospectus, board composition, market-by-market profitability, or secondary-liquidity structure. Internationally, the growth plan also becomes more execution-heavy. Forbes says Singapore, Malaysia, and India are mainly company-owned while the Philippines and Australia are franchise markets, and the Singapore
    franchise pages show active lead capture for new franchisees. That mix widens reach, but it also raises residual risk around franchisee quality drift, cross-border compliance, and an exit thesis that may arrive later or at a lower multiple than headline growth suggests.'
