  evidenceGaps:
  - type: missing-source
    severity: material
    topic: food-safety-compliance
    missingEvidence: Public BPOM permit IDs, recall history, incident logs, and hygiene audit pass rates for Kopi Kenangan products and outlets.
    whyItMatters: Food-safety and regulatory-compliance risk cannot be fully underwritten from process descriptions alone.
    diligencePath: Request BPOM registration numbers, internal audit summaries, recall or incident logs, and any regulator correspondence by market.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: delivery-and-refund-metrics
    missingEvidence: Owned-app versus delivery-platform GMV split, cancellation rates, refund-resolution SLA attainment, and complaint close-rate by channel.
    whyItMatters: Channel concentration and trust erosion are central risks, but public sources do not quantify them.
    diligencePath: Request weekly channel mix, cancellation and refund metrics, customer-service SLA dashboards, and complaint aging by platform and market.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: governance-and-liquidity-disclosure
    missingEvidence: Board composition, committee structure, market-level profitability, cap-table liquidity, filing timetable, and any draft-prospectus materials.
    whyItMatters: The public record supports an IPO-readiness narrative but not a fully underwritable exit or governance case.
    diligencePath: Request board pack, audited 2025 statements, country P&Ls, cap-table summary, and the latest IPO workplan with owners and dates.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR005
    - TR006
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-register-coverage
    missingEvidence: Complete market-by-market inventory of halal, BPOM, franchise, privacy, and consumer-protection obligations across all operating jurisdictions.
    whyItMatters: The regulatory register is intentionally partial and could miss lower-visibility but still costly obligations outside the public source set.
    diligencePath: Build a jurisdictional compliance matrix with legal counsel covering Indonesia, Malaysia, Singapore, India, the Philippines, and Australia.
    relatedQuestionRefs:
    - QR005
    - QR006
    relatedTableRefs:
    - TR001
