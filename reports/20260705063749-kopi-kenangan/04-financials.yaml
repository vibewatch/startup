  title: Scenario waterfall — indicative realized store-day sales bridge
  type: waterfall
  layout: wide
  summary: Illustrative bridge from public list-price math to a more conservative realized daily sales view once loyalty and channel leakage are considered.
  data:
    items:
    - label: List-price store-day sales at ~260 tickets x IDR21k midpoint (IDR M)
      value: 5.46
      type: increase
    - label: Less direct-channel cashback / vouchers assumption
      value: 0.16
      type: decrease
    - label: Less B2B / promo discount assumption
      value: 0.11
      type: decrease
    - label: Less refund / failed-order friction assumption
      value: 0.04
