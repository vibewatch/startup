  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-runway
    missingEvidence: Cash balance, monthly burn, runway, and operating cash flow by legal entity and by country.
    whyItMatters: Management is framing expansion as self-funded, so liquidity quality matters more than another private-round headline.
    diligencePath: Request monthly treasury and cash-flow reporting for FY2025 through current month, plus board-approved base / bear / bull liquidity cases.
    relatedQuestionRefs:
    - QI022
    - QI025
    relatedTableRefs:
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: delivery-and-channel-mix
    missingEvidence: Owned-app share, aggregator share, commission schedules, refund rates, and realized discounting by channel.
    whyItMatters: List prices and loyalty rules are visible, but channel economics determine whether scale converts into margin or leakage.
    diligencePath: Request gross-to-net revenue bridge by channel, including vouchers, cashback, failed orders, refunds, and delivery commissions.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: material
    topic: format-capex-and-payback
    missingEvidence: Build capex, cash payback, and mature-store margin by kiosk, signature cafe, heritage format, and franchise market.
    whyItMatters: The 4,000-store plan is only attractive if capital intensity and payback remain disciplined across formats and geographies.
    diligencePath: Request investment committee memos or store economics packs for each format, including rent, labor, fit-out, and pre-opening spend.
    relatedQuestionRefs:
    - QI015
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
    - TI006
  - type: missing-source
    severity: material
    topic: secondary-valuation-clearing-price
    missingEvidence: Confirmation of whether any 2025 secondary share sale actually closed and at what clearing price or discount.
    whyItMatters: The latest valuation band is rumored secondary price discovery, not a closed financing round, so mark-to-market confidence is weak.
    diligencePath: Request cap-table update, board approvals, and executed secondary-transfer documents or adviser materials.
    relatedQuestionRefs:
    - QI009
    - QI020
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: country-profit-split
    missingEvidence: Country-by-country revenue, EBITDA, and capex for Singapore, Malaysia, India, the Philippines, and Australia.
    whyItMatters: Malaysia is the only overseas market with disclosed EBITDA. The rest of the international rollout could still be diluting group cash generation.
    diligencePath: Request market P&Ls and expansion cohort reviews separating company-owned and franchised markets.
    relatedQuestionRefs:
    - QI012
    - QI024
    relatedTableRefs:
    - TI005
    - TI006
