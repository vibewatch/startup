- id: TI002
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Public price / status
  - Current scale signal
  - Revenue quality
  - Diligence ask
  rows:
  - - Core kiosk beverages
    - Grab-and-go coffee and non-coffee drinks from 85% kiosk-heavy network
    - IDR20k-IDR22k flagship beverage anchors in Indonesia
    - 1,324 outlets across six countries; 75% of sales still from Indonesia
    - Large and frequent but mix between full-price, loyalty-discounted, and delivery orders is undisclosed
    - Provide basket mix, orders/store/day, and realized net sales after promo leakage
  - - Signature / Heritage cafes
    - Larger-format dine-in and premium menu stores
    - Priced at double or more versus core kiosks
    - Only about a dozen formats cited in Forbes, but each format is much larger
    - Higher-ticket but likely higher rent and labor burden
    - Share store count, capex, and margin by format
  - - Direct app ordering
    - Pre-order, pickup, and delivery through owned app
    - Cashback points, vouchers, and VIP tiers
    - App is close to half of sales and reached 1.5M active users in Dec 2025
    - Strategically valuable because it reduces channel dependence, but realized CAC and take rate are undisclosed
    - Disclose app share of GMV, repeat frequency, promo spend, and refund rates
  - - Food and brand cross-sell
    - Cerita Roti, Chigo, cookies, and customized add-ons ordered through the app
    - Menu exists but realized attach rates are undisclosed
    - Official app pages show these brands live inside the ordering surface
    - Improves ticket size if attach is high, but attach rate is unknown
    - Provide category mix and attach rates by outlet cohort
  - - RTD bottled coffee
    - Off-store bottled products sold for convenient everyday consumption
    - Official RTD line is live and BPOM certified
    - Forbes says RTD unit sales tripled in 2025 from a low base
    - Potentially broadens reach beyond kiosk network, but scale is undisclosed
    - Disclose RTD net sales, gross margin, and working-capital requirements
  - - Big Order / enterprise events
    - Office meetings, gatherings, e-vouchers, and staffed events
    - Discounts up to 20% plus free delivery/barista/booth
    - Official channel exists, but no revenue disclosure
    - Useful demand smoothing channel, but discounting could dilute margin if used heavily
    - Provide B2B order volume, realized discount rate, and repeat-customer economics
  notes: Rows separate publicly visible channels from their undisclosed contribution margins. List pricing and program descriptions do not prove realized revenue mix.
