- id: TI006
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Public workaround today
  - Exact diligence path
  rows:
  - - Audited FY2025 standalone financial statements
    - Cannot verify quality of earnings or normalize one-offs
    - Rely on interviews and press summaries only
    - Request audited FY2024-FY2025 income statement, balance sheet, and cash flow by legal entity
  - - Cash balance, burn, and runway
    - Cannot test self-funded expansion claim
    - Infer only from first profit and financing stance
    - Request monthly cash bridge and board reporting pack
  - - Outlet build capex and payback by format
    - Cannot underwrite 4,000-store target economics
    - Use 2021 company language about “healthy” margins/payback only
    - Request kiosk, signature cafe, and franchise investment memo plus realized payback
  - - Direct app mix versus aggregator mix and commissions
    - Cannot quantify delivery drag or net realization
    - Use loyalty rules and comp filings as proxies only
    - Request owned-channel vs aggregator GMV, commission schedules, and refund rates
  - - Gross margin / COGS stack
    - Cannot tell whether high-teens Indonesia margins are sustainable through bean inflation
    - Only external coffee-price and menu-price anchors are public
    - Request ingredient, packaging, labor, rent, and delivery-cost waterfall
  - - Country-level profit split outside Indonesia
    - Cannot assess whether overseas growth is cash accretive or dilutive
    - Malaysia is the only market with explicit EBITDA signal
    - Request market P&L by country and franchise/company-owned split
  notes: Every gap listed here directly affects valuation confidence, capital planning, or unit-economics underwriting. Public sources are now better on growth and scale than on balance-sheet quality.
