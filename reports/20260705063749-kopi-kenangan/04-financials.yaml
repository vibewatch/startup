- id: TI005
  title: Capital adequacy table
  columns:
  - Metric
  - Public value / status
  - What the evidence does show
  - Implication
  - Diligence ask
  rows:
  - - Cash on hand
    - Undisclosed
    - Management says the 2030 store plan can be funded from cash flow
    - Liquidity claim is positive but not auditable
    - Provide cash balance and restricted cash by entity
  - - Monthly burn
    - Undisclosed after profitability swing
    - 2025 group is profitable, but overseas expansion still absorbs capital
    - Cannot tell whether group profit fully converts to cash
    - Provide monthly operating cash flow and expansion capex bridge
  - - Runway months
    - Undisclosed
    - No public runway calculation exists because cash and burn are private
    - Runway cannot be underwritten from public sources
    - Provide 24-month base / bear / bull runway model
  - - Historical capital raised
    - ~US$233M-US$234M disclosed
    - Rounds are well documented through 2021; later liquidity talk is secondary
    - Adequate historical capital does not equal current liquidity
    - Provide residual proceeds and current debt obligations
  - - Next-round trigger
    - IPO considered premature; self-funding preferred; secondary exits explored
    - No new primary round has been publicly announced in 2026
    - Expansion depends on internal cash conversion and disciplined rollout
    - Provide board-approved financing triggers and covenant thresholds
  - - Capital-light levers
    - Franchises in the Philippines and Australia; company-owned concentration in Indonesia/Malaysia/Singapore/India
    - Management is already mixing ownership models by market
    - Franchise use can lower capex but may cap economics and control
    - Provide unit-level capex, royalty, and partner economics by market
  notes: This table focuses on forward capital adequacy rather than repeating the full funding chronology. Most liquidity fields remain unavailable in public sources and therefore require management disclosure.
