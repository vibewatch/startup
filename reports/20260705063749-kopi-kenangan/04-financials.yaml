callouts:
- calloutType: strength
  title: Core-market economics now look real, not purely venture-subsidized
  body: The company has moved from a 2022 loss position to a disclosed US$17 million group profit in 2025, while Indonesia appears to run at roughly mid-teens net margin on public numbers. That does not prove strong free cash flow, but it does show the home market is likely capable of funding at least part of the next expansion leg.
  claimRefs:
  - CI009
  - CI011
  - CI012
  - CI037
- calloutType: risk
  title: Valuation is now being tested by secondary liquidity, not fresh primary demand
  body: The latest public valuation signal is not a new growth round but investors reportedly exploring partial stake sales at US$1.2 billion-US$1.4 billion. That is only a modest step-up from the 2021 unicorn floor and raises the bar on proving that 2025 profitability converts into durable cash generation rather than just optical scale.
  claimRefs:
  - CI004
  - CI006
  - CI045
  - CI050
  - CI051
- calloutType: recommendation
  title: Require audited cash conversion and format-level payback before backing the 4,000-store plan
  body: Before underwriting 2026-2030 expansion, investors should insist on audited FY2025 statements, entity cash and runway, kiosk versus signature-cafe capex/payback, owned-channel versus aggregator economics, and country-level profit splits. Without those items, the story is investable to watch but still too inference-heavy for conviction sizing.
  claimRefs:
  - CI038
  - CI044
  - CI045
