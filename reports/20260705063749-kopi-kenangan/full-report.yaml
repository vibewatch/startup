  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Scale and Channel Structure
        blocks:
          - type: paragraph
            body: >-
              Public reporting is now strong enough to establish that Kopi Kenangan is commercially material rather than
              purely aspirational. Multiple 2026 sources point to roughly US$184 million of 2025 revenue, a first
              full-year group profit of US$17 million, and 1,324 outlets across six countries. Indonesia remains the
              anchor market, with 1,136 outlets, roughly 15% same-store sales growth, and IDR2.3 trillion of 2025
              revenue. Management also told Forbes that about 75% of sales still come from Indonesia and about 15% from
              Malaysia, so group scale still rests on the home market rather than on unproven offshore geographies.


              The revenue model is broader than a single kiosk beverage line. Public company surfaces show owned-app
              ordering for pickup or delivery, food cross-sell through other Kenangan brands, bottled RTD coffee, and an
              enterprise/event-order channel. The app matters economically because it is not just a loyalty wrapper:
              Forbes says it is close to half of sales and IDNFinancials says monthly transacting digital users reached
              about 1.5 million by December 2025. That makes the key financial question less “is there demand?” and more
              “how much of gross demand survives promo, channel, and cost leakage into durable cash generation?”
