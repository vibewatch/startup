              The public record now shows a company that understands governance language, but is still asking investors
              to bridge a private-company disclosure gap. IDNFinancials is useful here because it records management’s
              own postmortem: too much early funding encouraged too many side initiatives, and 2022 losses widened
              before the 2025 profit turn. Later 2026 coverage from Kontan, Forbes, and IDN Times says the company wants
