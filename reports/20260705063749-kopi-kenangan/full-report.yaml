      - number: '1.4'
        title: Scale, international expansion, milestones, and caution flags
        blocks:
          - type: paragraph
            body: >-
              By 2025-2026, the company's scale claims move beyond simple store count to operating-system breadth.
              IDNFinancials reported that Kopi Kenangan ended 2025 with 1,324 outlets across six countries, 4.47 million
              new digital customers added during the year, 1.5 million monthly transacting digital users, $184 million
              of revenue, and $17 million of net profit—its first full-year profit at group level. Forbes' 2026 cover
              story broadly supports the same inflection, describing 1,136 Indonesian outlets plus 188 overseas and a
              plan to reach 4,000 stores by 2030. International expansion is no longer just Malaysia and Singapore:
              official consumer sites are live in Singapore, Malaysia, and India, RLI says the first Indian store opened
              in Delhi with a 50-store short-term ambition, and management has discussed further 2026 market entries.
              The main caution is that rapid diversification previously hurt profitability. World Coffee Portal and
              IDNFinancials both say management acknowledged overexpansion into too many side initiatives before
              refocusing on the core chain. That combination—large footprint, improving profits, and recent
              self-correction—is the right framing for later diligence chapters.
