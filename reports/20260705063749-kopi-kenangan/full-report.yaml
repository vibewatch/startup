  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: Kopi Kenangan sits between street coffee, premium cafés, and multi-channel convenience'
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan should not be underwritten against all Indonesian foodservice spend or even against all
              coffee sold in the country. Its own positioning is more specific. Company pages describe a grab-and-go
              coffee chain built on high-quality local ingredients, while the unicorn-fundraise announcement says the
              company was created to fill the gap between expensive international chains and instant or street coffee.
              That definition points to modern prepared-coffee occasions bought for convenience, consistency, and
              branded experience. Official channel pages widen the spend pool somewhat: the company runs a loyalty
              program, promotes corporate and event orders, sells ready-to-drink bottled coffee, and keeps an active
              delivery presence on GrabFood. Those adjacencies matter because they broaden the same consumer
              relationship across app, outlet, delivery, office, and at-home moments. But the same logic excludes most
              of total restaurant spend, commodity export value, and unbranded roadside coffee, because those pools do
              not convert cleanly into branded-cup economics or chain valuation multiples.
            claimRefs:
              - CM001
              - CM002
              - CM003
