      - number: '8.3'
        title: 'Scenario ranges and exit paths: upside exists, but the downside requires less imagination than the bull case'
        blocks:
          - type: paragraph
            body: >-
              The bull case is easy to narrate: management keeps expanding at speed, Malaysia stays on a profit track,
              digital engagement sustains high repeat usage, and Kopi Kenangan compounds into a US$250 million-plus
              revenue base while preserving attractive unit economics. In that world, a 6x multiple can still work and
              the reported secondary range begins to look like a staging post rather than a ceiling.


              The base and downside cases are easier to defend from public evidence. Bain says Southeast Asian exits
              remain constrained, TNB Aura says valuation compression has widened the bid-ask gap, and NielsenIQ says
              consumers remain value sensitive. That combination matters because Kopi Kenangan is still selling an
              affordable-premium product into a discretionary category while also relying on future liquidity events to
              validate today’s price. The business does not need a demand collapse to disappoint. It only needs later
              buyers to anchor the asset closer to Starbucks-, Grab-, or Luckin-like public multiples than to Dutch
              Bros. That makes secondary liquidity or a patient wait-and-grow path more plausible near term than an
              immediate premium IPO outcome.
