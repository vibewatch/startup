  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Demand proof is strong, but valuation support and disclosure quality trail the operating story.
    data:
      items:
        - label: Market demand
          score: 8
          detail: US$184m revenue and continued outlet growth prove category pull.
          tone: positive
        - label: Unit economics evidence
          score: 7
          detail: 2025 profit and Malaysia EBITDA progress are real, though still lightly disclosed.
          tone: positive
        - label: International proof
          score: 6
          detail: Six-country footprint helps, but most revenue still sits in Indonesia.
          tone: neutral
        - label: Disclosure quality
          score: 4
          detail: No public audited FY2025 package or cap-table detail.
          tone: warning
        - label: Exit liquidity
          score: 4
          detail: Regional exits remain constrained and secondaries matter more.
          tone: warning
        - label: Valuation support
          score: 4
          detail: Reported sale talk is above the most defensible public-comp band.
          tone: warning
        - label: Overall IC readiness
          score: 5
          detail: Worth tracking now; not yet ready for a price-insensitive buy.
          tone: neutral
    approximationNotes: Scores are 0-10 ordinal judgments synthesized from the public evidence set for investment-committee discussion.
