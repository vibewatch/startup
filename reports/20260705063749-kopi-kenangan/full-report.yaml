      - number: '3.2'
        title: Price architecture, formats, and consumer anchoring
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan’s competitive pitch still depends on sitting in the middle of the Indonesian beverage
              ladder: clearly more premium than instant coffee or warung-led consumption, but still well below
              Starbucks. Forbes’ retained pricing snapshot puts Kopi Kenangan Mantan at Rp22,000 and an Americano at
              Rp20,000, while Fore’s public menu lists an iced Americano at Rp23,000 and a Manuka Americano at Rp29,000,
              showing how tightly local challengers cluster on entry pricing. Janji Jiwa’s own brand language points in
              the same direction by emphasizing accessible grab-and-go coffee rooted in local tastes rather than a
              sit-down café ritual. Tomoro’s public messaging stresses quality and 100% Arabica without disclosing
              enough public list pricing in the retained pack to prove a differentiated economic lane. Starbucks remains
              the premium anchor, and Mixue’s low-price tea and ice-cream logic widens the lower umbrella further. The
              result is a market where format and convenience often matter more than a unique beverage recipe because
              multiple brands already crowd the same affordable-premium band.
