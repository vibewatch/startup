chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan is a Jakarta-born, tech-enabled grab-and-go coffee chain founded in 2017 by Edward
              Tirtanata, James Prananto, and Cynthia Chaerunnisa. Multiple official and media sources describe the
              founding thesis the same way: Indonesia had cheap instant coffee and expensive global cafe chains, but not
              a scaled middle tier that paired local flavors with accessible pricing. That positioning still anchors the
              brand. The company's own site frames its mission as taking Indonesian coffee from Indonesia to the rest of
              Asia, while its consumer surfaces emphasize app ordering, pickup, delivery, and modern Indonesian flavors
              rather than long-stay cafe ambience. Public office information places the main office at Plaza Blok M in
              South Jakarta, and the same official pages list Singapore and Malaysia offices, reinforcing that the
              business has been organized for regional operations rather than only domestic retail. Official operating
              claims remain conservative relative to later media coverage—more than 800 Indonesian stores across 45
              cities and more than 5,000 employees—but they still establish a large-format national brand with a clear
              affordable-premium identity.
