    rows:
      - - '2017'
        - Kopi Kenangan launch
        - Kenangan entered with a grab-and-go local-flavor proposition between street coffee and Starbucks
        - The middle-price lane that now defines the category was set early
      - - '2018'
        - Janji Jiwa launch and grab-and-go positioning
        - Janji Jiwa framed itself around accessible local coffee and community identity
        - Kenangan quickly lost any monopoly on the local affordable-premium story
      - - 2020-2021
        - Fore pandemic reset
        - Fore cut underperforming locations to 66 outlets before rebuilding
        - Operational discipline became a competitive skill, not just a finance footnote
      - - '2025'
        - Flash Coffee new funding and profitability push
        - Flash raised US$3 million, said stores were profitable, and targeted 70+ locations
        - Smaller app-led players can remain relevant after retrenchment
      - - '2025'
        - Tomoro growth downgrade
        - Tomoro paused international expansion and refocused on domestic outlet growth
        - Outlet speed alone stopped looking like a sufficient moat
      - - '2025'
        - Kopi Kenangan reaches first group profit and adds 347 net outlets
        - Kenangan coupled expansion with improving profitability and digital user growth
        - The leader showed it can still scale, but the proof burden rises with each new market
      - - '2026'
        - Fore enters listed-company phase with strong FY25 and 1Q26 results
        - Fore disclosed 316 stores, 90+ annual openings, and strong profit growth
        - Public-market transparency could become a competitive funding and trust advantage
    notes: >-
