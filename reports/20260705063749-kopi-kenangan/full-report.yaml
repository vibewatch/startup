  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and jobs to be done
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan is not selling a single café experience to a single buyer profile. Public sources show a
              layered consumer base: young mass-market drinkers looking for affordable premium coffee; app-first
              commuters who want to skip queues; delivery users who trade price and loyalty capture for convenience;
              office and event buyers ordering in bulk; and RTD shoppers who encounter the brand outside its stores. The
              international surfaces add another layer, with Malaysia and Singapore positioned as customer-facing
              extensions of the same Indonesian-coffee identity. What ties these cohorts together is convenience plus a
              deliberate price lane between street coffee and global chains. The strongest public fit is therefore not
              luxury coffee culture; it is repeatable daily use, especially where customers value speed, mobile
              ordering, and a recognizable but still affordable brand. The main gap is that public segmentation is rich
              in narrative but thin in cohort economics, so the chapter has to rely on footprints, app behavior, and
              publicly visible use cases rather than disclosed customer lifetime data.
