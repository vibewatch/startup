  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, privacy, and licensing risk
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan already discloses more legal surface area than a tiny startup: its Indonesian legal page
              publishes a Ministry of Trade consumer-complaint contact, its app privacy policy is long and explicit, and
              its Singapore franchise privacy notice is detailed enough to show how overseas franchise expansion is
              being operationalized. That is a mitigation, but it also reveals the risk map. The Indonesian policy says
              the app and related brand sites collect identity, payment, device, installed-app, location, transaction,
              and loyalty data; the same policy allows sharing across group companies, service providers, commercial
              partners, and authorities, while acknowledging that no transmission or storage method is perfectly secure.
              Public regulatory pressure is also rising around the physical product layer. Indonesia’s 2026 compliance
              stack now converges halal, BPOM labeling, and traceability requirements, and the official OSS portal
              confirms that overseas franchisor expansion still sits inside a registration regime rather than a pure
              commercial rollout. For investors, the issue is not a known enforcement case today, but whether the legal,
              data-governance, and franchise-compliance burden scales as quickly as the store network and app usage do.
