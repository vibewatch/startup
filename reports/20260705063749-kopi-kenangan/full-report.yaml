      - number: '4.3'
        title: Funding, Valuation, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan’s historical funding record is clear enough through 2021: an US$8 million seed round in
              2018, US$20 million Series A capital in 2019, a US$109 million Series B in 2020, and a US$96 million first
              Series C close in 2021 that pushed the business above a US$1 billion valuation. Recent coverage places
              total disclosed capital at roughly US$233 million-US$234 million. The important change is not the amount
              already raised but the form of the latest valuation signal. In 2025, reported price discovery came from
              investors exploring partial stake sales at US$1.2 billion-US$1.4 billion, i.e. secondary liquidity, not
              announced new primary capital for operating needs.


              Management’s 2026 financing stance is therefore a central diligence issue. Forbes reports a US$200 million
              expansion plan to reach 4,000 stores by 2030, but also quotes the CEO saying he does not expect to tap
              investors for that build-out and that IPO talk is still premature. If true, capital adequacy has shifted
              from “can the company raise?” to “how much cash does the home market actually throw off after capex and
              offshore drag?” The ownership model helps somewhat: Indonesia, Malaysia, Singapore, and India are mostly
              company-owned, while the Philippines and Australia use franchise partners. That reduces capex at the edge,
              but does not answer the core missing question of entity cash, runway, and format-level payback.
