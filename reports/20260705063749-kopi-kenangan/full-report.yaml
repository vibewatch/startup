        title: Product portfolio and menu architecture
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan is not a single drink brand anymore; the public product surface now spans fresh-brew coffee,
              non-coffee beverages, food accompaniments, bottled ready-to-drink coffee, and whole-bean products for home
              brewing. The Indonesian menu still follows a layered architecture that starts with classic coffee and
              signature gula-aren drinks, expands into lower-acid Light Coffee variants, and then branches into tea,
              chocolate, fruit, and frozen formats with paid toppings. That structure matters because it shows how the
              company protects its hero SKU while creating adjacent baskets for different caffeine tolerance, daypart,
              and occasion needs. Product innovation also appears cadence-driven rather than one-off: the company
              highlights Matcha Series and O.G. Aren volumes, Light Coffee created a gentler Arabica sub-line, RTD took
              the brand into nationwide retail shelves, and Kenangan Beans moved the brand into kitchen-counter
              consumption. The result is a menu system designed to widen repeat purchase without abandoning the
              affordable-premium promise that made the chain scale.
