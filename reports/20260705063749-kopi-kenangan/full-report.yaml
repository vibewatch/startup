  - id: TP005
    title: Moat durability and competitive risk register
    columns:
      - moat or pressure point
      - why it matters
      - current evidence
      - severity
      - diligence ask
    rows:
      - - Scale plus awareness lead
        - Scale can lower procurement and app-marketing cost per store only if utilization stays high
        - Kopi Kenangan leads awareness at 97% and disclosed outlet count at 1,324 total outlets
        - Medium
        - Request mature-store productivity and same-store sales by country
      - - App-led retention parity
        - If Janji Jiwa, Fore, and Starbucks all run competent rewards loops, loyalty depth becomes a promo contest
        - Kenangan, JIWA+, Fore, and Starbucks each show visible app or rewards mechanics
        - High
        - Request cohort retention, repeat frequency, and CAC by channel
      - - Direct-management quality control
        - Fore argues integrated control protects standards and brand trust, but this can slow capital-light rollout
        - Fore publicly rejects franchising while Janji Jiwa and Mixue expose partnership routes
        - Medium
        - Test whether direct management yields better unit economics or customer satisfaction
      - - Macro-sensitive outlet sprint
        - Fast rollout creates risk when discretionary demand weakens
        - Tomoro cut back international expansion after weaker confidence dented sales
        - High
        - Request break-even sales threshold by format and city cohort
      - - Turnaround fragility
        - App-first challengers can recover, but they can also overstate the stability of a rebuild
        - Flash needed retrenchment before raising fresh money and targeting 70+ locations
        - Medium
        - Review reopened-store performance versus original expansion cohorts
      - - Price-floor compression from adjacent beverage chains
        - Very low-ticket tea and dessert chains can pull beverage expectations down even if they are not coffee-first
        - Mixue pairs supply-chain control with very low consumer prices and global scale
        - High
        - Model contribution margin under scenario where promo intensity deepens across the category
      - - Commodity and surplus pressure
        - If input oversupply narrows category price gaps, discounting becomes easier for every rival
        - Qahwa reports back-to-back global coffee surpluses in 2024/25 and 2025/26
        - Medium
        - Stress test gross margin under lower price umbrellas and heavier promotions
    notes: >-
      This risk register is intentionally cross-competitor rather than company-only because the relevant moat question
      is what kinds of rival behavior can erase Kopi Kenangan’s current advantages.
