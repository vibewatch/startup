      - number: '4.4'
        title: Profitability, Cost Structure, and Scenario Framing
        blocks:
          - type: paragraph
            body: >-
              The profitability arc is encouraging but still thinly disclosed. World Coffee Portal says 2024 revenue
              reached about US$119 million and losses narrowed to roughly US$2.3 million from US$18.4 million in 2023,
              while 2025 reporting shows the swing to US$17 million of net profit. In Indonesia, the implied 2025 net
              margin from published revenue and profit is about 16.4%, close to but still a little below the 18%-20%
              home-market net-income margin reported in conference coverage. Malaysia appears to be on a similar
              trajectory, with RM111 million of 2025 revenue and RM17 million of EBITDA. Those are real positives for a
              private F&B chain attempting international scale.


              The cost stack, however, is still mostly invisible. Forbes notes that arabica futures almost doubled in
              the two years to January 2026 and were still more than 50% above January 2024 by late March, forcing
              hedging and procurement responses. The company also tested both premium large-format cafés and a low-price
              Satu Kenangan concept, then halted further expansion of that cheaper format after deciding that a lower
              price point did not guarantee success. Those details imply that margin durability depends on keeping a
              premium-enough ticket while controlling commodity, packaging, promo, and delivery leakage. The scenario
              waterfall below is therefore only illustrative: it shows how little room there is between public
              list-price math and realized store-day net sales once cashback, event discounting, and order friction are
              considered.
