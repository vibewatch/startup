      - number: '2.2'
        title: 'Sizing lenses: national coffee demand is large, but a clean chain-specific TAM still does not exist publicly'
        blocks:
          - type: paragraph
            body: >-
              The strongest market-sizing approach is layered, not singular. At the broadest level, USDA still sees
              Indonesia as a very large coffee country, forecasting 4.83 million 60-kilogram bags of domestic
              consumption in 2026/27 against 11.38 million bags of total production. That shows the habit is large, but
              it is not the same as branded chain revenue. A different adjacency comes from at-home coffee: Knowledge
              Sourcing estimates Indonesia’s instant-coffee market at roughly US$3.817 billion in 2025 and US$5.734
              billion by 2030. That is a meaningful coffee wallet, but much of it sits outside café chains. A third lens
              is digital access: Southeast Asia food-delivery GMV reached US$22.7 billion in 2025, reinforcing that
              app-based ordering is a relevant route to demand even if the number is not coffee-specific. Finally, Kopi
              Kenangan’s own 868-outlet footprint shows that execution density is already real. The practical lesson is
              that Kopi Kenangan’s SAM is narrower than national coffee consumption and broader than walk-in café spend
              alone, while a precise SOM remains unverified without city-level share and productivity data.
