      - number: '6.3'
        title: Customer proof, friction, and channel dependence
        blocks:
          - type: paragraph
            body: >-
              The most concrete public customer proof is not a glossy enterprise logo wall; it is the direct voice of
              users in app reviews and complaint forums. AppBrain review snippets show real product use and some genuine
              affection for the clean UI, discounts, and usability, but they also surface cracks in the experience:
              manual store selection crashes, refund-to-points handling after out-of-stock orders, and frustration with
              delivery fees. Media Konsumen broadens the adverse picture by documenting multi-year complaints about
              promo terms, wrong items, pickup and payment issues, and refund delays. These frictions matter because
              they intersect with channel structure. Kopi Kenangan is clearly present on GrabFood and frequently uses
              drivers and aggregators to serve demand, yet aggregator transactions do not count toward VIP progression.
              That means some of the convenience channel that helps acquire orders does not necessarily reinforce the
              owned loyalty loop. The public proof therefore supports real customer usage, but it also shows that
              service consistency and channel leakage remain central retention risks.
