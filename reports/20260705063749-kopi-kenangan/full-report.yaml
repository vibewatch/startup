      - number: '4.2'
        title: Pricing, Direct Channel, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan’s public price anchors support a credible mass-premium positioning. Forbes reported flagship
              Indonesia prices of IDR22,000 for Kopi Kenangan Mantan and IDR20,000 for an Americano, while Kenangan
              Coffee Malaysia currently lists a Kenangan Latte at RM11.90 and an Americano at RM9.90. Those are
              meaningful enough to distance the brand from ultra-cheap street-coffee competition, yet still below
              global-chain pricing in Indonesia. The pricing system is also not purely sticker-based. Kenangan VIP and
              Kenangan Points effectively convert direct-channel frequency into realized discounting, because points
              behave like cashback and high-spend tiers unlock more benefits. Big Order introduces still more price
              dispersion with discounts up to 20% for event packages.


              The best public unit-economics view therefore comes from translation, not direct disclosure. Using
              reported 2025 revenue and outlet counts, group revenue implies roughly US$139,000 per outlet per year, or
              about US$381 per outlet per day. Using Indonesia-only revenue and stores, the implied local store-day
              sales proxy is about IDR5.55 million. When that is divided by public beverage anchors, Indonesia
              throughput lands around 252 to 277 beverage-equivalent tickets per store day before food mix, RTD, or B2B
              orders. That looks plausible for a kiosk-heavy chain, but the underwriting gap is wide: public sources
              still do not reveal actual gross margin, basket mix, app-versus-aggregator split, or commission drag.
              Comparable filings from Luckin and Dutch Bros show exactly why those omissions matter.
