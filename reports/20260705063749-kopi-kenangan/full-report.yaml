  - id: FV005
    title: Exit path map
    type: dag
    layout: wide
    summary: >-
      The cleanest near-term route is secondary liquidity; IPO or strategic outcomes require materially better evidence
      and market conditions.
    data:
      nodes:
        - id: ops
          label: Profitable growth base
          detail: Revenue and EBITDA proof create optionality.
          tone: positive
        - id: secondary
          label: Secondary / sponsor sell-down
          detail: Most plausible near-term path because it matches current market evidence.
          tone: neutral
        - id: strategic
          label: Strategic minority or trade buyer
          detail: Needs buyer willing to pay for regional consumer-platform scale.
          tone: neutral
        - id: ipo
          label: Regional IPO
          detail: Requires audited statements, governance proof, and a better exit window.
          tone: warning
        - id: audits
          label: Audited disclosure package
          detail: Needed before public-market valuation can fully clear.
          tone: warning
        - id: market
          label: SEA exit-market recovery
          detail: Needed to reduce the discount from liquidity pressure.
          tone: warning
        - id: wait
          label: Wait and grow
          detail: Default if price and disclosure do not clear together.
          tone: warning
      edges:
        - to: secondary
          from: ops
        - to: strategic
          from: ops
        - to: wait
          from: ops
        - to: ipo
          from: audits
        - to: ipo
          from: market
        - to: strategic
          from: market
        - to: wait
          from: secondary
    approximationNotes: Path map is a qualitative decision framework, not a probability tree.
    claimRefs:
      - CV019
      - CV020
      - CV038
      - CV039
      - CV043
      - CV046
      - CV047
