      - number: '7.3'
        title: Competition saturation, platform dependence, and brand fatigue risk
        blocks:
          - type: paragraph
            body: >-
              Public growth proof is real, but the operating model is unusually exposed to channel and format
              concentration. Forbes says Kopi Kenangan ended 2025 with 1,136 Indonesian outlets and 188 overseas, that
              85% of outlets are grab-and-go kiosks, and that the app had become the biggest source of growth while
              accounting for close to half of sales. The company’s own download page reinforces the design choice: the
              app is built around pickup or delivery, membership, and queue-skipping. That scale can be a strength, but
              it also makes discovery, ranking, and fulfillment friction matter more. The outlet locator fetched in this
              run showed multiple Grab Kitchen locations, indicating some traffic is already mediated through
              third-party nodes rather than entirely through self-controlled frontage. At the same time, the competitive
              field is crowded. Forbes names Janji Jiwa, Fore, Tomoro, Lain Hati, Zus, Cafe Amazon, Highlands, Compose,
              and eventual Luckin pressure, while the same profile admits that several brand extensions and lower-price
              experiments were halted after they did not pan out. That combination is what makes brand fatigue and
              declining new-store productivity plausible rather than theoretical.
