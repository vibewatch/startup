        title: App-led acquisition and repeat proxies
        blocks:
          - type: paragraph
            body: >-
              The customer engine is increasingly app-led. External reporting says the app is now the company's biggest
              source of growth and close to half of sales, while 2025 disclosures point to 4.47 million new customers
              and 1.5 million monthly transacting digital users by year-end. That scale is corroborated by
              app-marketplace data: the iPhone listing shows a 4.9 rating from 35,000 ratings, and AppBrain shows
              roughly 200,000 ratings, 6.3 million lifetime downloads, and strong recent download velocity. Official
              loyalty pages then explain how Kopi Kenangan tries to convert that top-of-funnel reach into habit. Points
              can be redeemed like cash, higher spend unlocks richer tiers, and app-only promotions keep the owned
              channel active. Still, these are repeat proxies, not proof of durability. None of the public materials
              reviewed here disclose churn, cohort retention, member-tier mix, or frequency curves, so the data show a
              large and active installed base without proving how sticky or profitable each cohort is over time.
