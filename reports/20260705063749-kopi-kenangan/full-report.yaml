  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Scale and profitability support a premium, but sale-process uncertainty, thin disclosure, and weak exit markets
      keep the chapter at track rather than buy.
    data:
      nodes:
        - id: proof
          label: 2025 profit + 1,324 outlets
          detail: The business has moved beyond concept risk.
          tone: positive
        - id: growth
          label: Premium growth narrative
          detail: US$200m run-rate and 4,000-store ambition support upside.
          tone: positive
        - id: price
          label: US$1.2b-US$1.4b sale talk
          detail: Current headline mark already assumes a strong premium.
          tone: warning
        - id: market
          label: Exit market still constrained
          detail: SEA exits favor EBITDA proof over multiple expansion.
          tone: warning
        - id: disclosure
          label: Cap-table + audited-data gap
          detail: Headline price is not yet underwritten like a public security.
          tone: warning
        - id: decision
          label: Recommendation = track
          detail: Continue diligence, but require better evidence or a better price.
          tone: neutral
      edges:
        - to: price
          from: proof
        - to: price
          from: growth
        - to: decision
          from: price
        - to: decision
          from: market
        - to: decision
          from: disclosure
    approximationNotes: null
    claimRefs:
