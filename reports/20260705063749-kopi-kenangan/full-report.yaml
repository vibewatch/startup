  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, scale, and player classes
        blocks:
          - type: paragraph
            body: >-
              The rivalry set around Kopi Kenangan is no longer just one local coffee chain versus another. The most
              direct peer class is Janji Jiwa, Fore Coffee, and Tomoro, because all four compete on Indonesian flavor
              familiarity, mass-premium pricing, and dense grab-and-go distribution. Starbucks Indonesia matters less as
              a like-for-like kiosk rival and more as the premium reference brand whose higher prices create the
              umbrella local chains can undercut. Mixue sits in the adjacent low-ticket beverage lane rather than in
              direct coffee specialty, but its scale and value positioning still pressure what consumers will pay for
              impulse drinks. The status quo substitute remains surprisingly strong as well: street vendors, instant
              coffee, and other low-effort beverage options continue to anchor the cheapest end of the consumer’s choice
              set. That means Kopi Kenangan competes across at least five classes at once: direct local chains, premium
              international cafés, low-price tea and dessert chains, delivery-aggregator-fed merchants, and offline
              status-quo alternatives.
