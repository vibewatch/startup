companyProfile:
  summary: >-
    Kopi Kenangan is a Jakarta-based, tech-enabled grab-and-go coffee chain founded in 2017 by Edward Tirtanata, James
    Prananto, and Cynthia Chaerunnisa. The company built a middle-tier coffee concept between low-cost street coffee and
    premium global chains, then scaled it through app ordering, pickup, delivery, loyalty, RTD extensions, and a dense
    kiosk-led footprint. Public 2025 reporting points to 1,324 outlets across six countries, roughly $184 million of
    revenue, and the first full year of group profitability, making Kopi Kenangan one of Southeast Asia's most scaled
    new-retail F&B platforms.
