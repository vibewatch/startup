  - id: TR006
    title: Downside scenario tree
    columns:
      - scenario
      - trigger path
      - likely operating outcome
      - financial implication
      - risk signal
      - investment implication
    rows:
      - - Base discipline
        - Coffee stays manageable, app growth holds, and governance prep continues
        - Store rollout continues with manageable service load
        - Profitability improves with expansion
        - Stable complaint cadence and audited reporting progress
        - Hold or advance diligence.
      - - Margin squeeze branch
        - Coffee inflation and rupiah weakness arrive before price or mix offsets
        - Store payback slows and discounting discipline weakens
        - Gross margin and EBITDA compress
        - Commodity spikes plus weaker FX and slower app monetization
        - Tighten valuation and slow planned deployment.
      - - Trust erosion branch
        - Promo mismatch, cancellations, and refunds become recurring rather than episodic
        - Repeat purchase softens and customer acquisition becomes costlier
        - Sales productivity falls before headline store count does
        - Complaint volume rises while service metrics stay private
        - Treat brand durability as unproven.
      - - Governance / exit branch
        - IPO readiness does not convert into filing-quality disclosure while overseas franchising expands
        - Management attention shifts to controls and partner remediation
        - Exit window elongates and multiple support weakens
        - No exchange choice, no prospectus path, and opaque market-level economics
        - Assume longer hold and higher governance discount.
    notes: >-
      The tree compresses public evidence into the four downside branches most likely to impair underwriting before any
      liquidity event.
