      - number: '8.4'
        title: 'What would change the call: disclosure quality and actual market-clearing evidence'
        blocks:
          - type: paragraph
            body: >-
              What is missing is not narrative but underwriteability. The public market already offers filing-grade
              templates for how scaled consumer businesses talk about store economics, segment mix, working capital, and
              cash generation. Jollibee’s annual report is one example. Kopi Kenangan has not yet supplied an equivalent
              package to public investors, and the reported sale process has not yielded a confirmed clearing price that
              would settle the debate.


              That means the committee should focus on a short list of valuation-moving diligence asks rather than broad
              curiosity. First, confirm the exact preference stack and any secondary mechanics so the headline valuation
              can be translated into common-equity value. Second, get audited 2025 and current 2026 financials that
              bridge revenue, EBITDA, and net income into cash conversion. Third, verify whether the reported 2025-2026
              secondary process actually clears and on what terms. If those three items come back clean, the valuation
              could migrate toward the top of the current range. If they do not, the reported range should be treated as
              a stretched seller aspiration rather than a fair price.
