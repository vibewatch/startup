  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Public customer-proof surfaces differ sharply in proof depth: scale metrics are strong, while retention visibility
      is still weak.
    data:
      columns:
        - Outcome specificity
        - Retention visibility
        - Proof quality
      rows:
        - label: App-store ratings
          values:
            - High on public sentiment
            - Low on repeat economics
            - Medium-High — large rating bases but little cohort detail
        - label: AppBrain user comments
          values:
            - Medium on lived experience
            - Low on long-term repeat
            - Medium — named recency, anecdotal depth
        - label: Media Konsumen complaints
          values:
            - High on friction examples
            - Low on incidence rate
            - Medium — adverse but self-selected
        - label: Official loyalty / VIP pages
          values:
            - High on mechanism
            - Low on actual retention disclosure
            - High on rules, low on outcomes
        - label: Malaysia / Singapore surfaces
          values:
            - Medium on live market presence
            - Low on country-level repeat
            - Medium — good existence proof, weak cohort proof
    approximationNotes: >-
