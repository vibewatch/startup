- id: buyers-pricing-and-channel-mix
  title: 'Buyer and price architecture: affordable premium is the category’s center of gravity'
  body: 'Buyer segmentation in Indonesian modern coffee is occasion-driven. USDA distinguishes low- and middle-income buyers who still favor cheap street coffee from higher-end outlet users, including Gen Z, while GoodStats shows how mainstream coffee has become by reporting 72% daily consumption and 97% brand awareness for Kopi Kenangan. That is why price architecture matters. Open-web menu trackers place Kopi Kenangan and Tomoro around Rp20,000 for Americano and Rp24,000-Rp26,000 for core latte-like drinks, with Fore clustered in a similar affordable-premium band and Starbucks materially higher at roughly Rp42,000-Rp65,000 for equivalent coffee categories. The category therefore behaves less like luxury coffee and more like frequent, defensible indulgence. Channel pages reinforce that pattern: Kopi Kenangan pushes repeat usage through VIP tiers, captures delivery through GrabFood, and uses big-order discounts to reach office and event budgets. This buyer map implies that adoption is led
    by convenience and habit frequency, not just by pure beverage aspiration.'
