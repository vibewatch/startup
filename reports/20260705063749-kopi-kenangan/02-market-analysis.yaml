- id: TM005
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for market adoption
  - Diligence ask
  rows:
  - - Daily coffee habit and strong brand awareness
    - Positive
    - Current
    - High-frequency demand supports repeat modern-chain visits when price points remain accessible
    - Break out same-store frequency by city and daypart
  - - Youth-led café culture and changing consumption patterns
    - Positive
    - Current to medium term
    - Supports premiumization within an affordable range rather than pure commoditization
    - Measure cohort retention for Gen Z and young office workers
  - - Delivery-platform reach and merchant growth
    - Positive
    - Current
    - App channels expand access, reorder behavior, and urban convenience
    - Request delivery mix, CAC, and net contribution after promo spend
  - - RTD and take-home adjacency
    - Positive
    - Current to medium term
    - Lets chains capture pantry and at-home occasions that would otherwise escape café networks
    - Quantify RTD share, margin, and cannibalization vs cup sales
  - - Crop volatility and expensive robusta
    - Negative
    - Current
    - Raises bean-input risk and compresses roaster or café gross margin if price increases cannot be passed through
    - Review hedging, sourcing contracts, and recipe mix flexibility
  - - Consumer trade-down and lower delivery baskets
    - Negative
    - Current
    - Traffic can grow while AOV and margin deteriorate under affordability campaigns
    - Request AOV, promo rate, and post-promo retention by channel
  - - VAT and broader operating-cost pass-through
    - Negative / mixed
    - Current
    - Taxes are manageable but still matter for menu engineering in a price-sensitive market
    - Test gross-margin sensitivity at different effective VAT and labor-cost scenarios
  - - Capital intensity and rollout crowding
    - Negative
    - Current to medium term
    - Modern-chain expansion still consumes meaningful capex and increases local saturation risk
    - Compare new-store payback, closure rates, and cannibalization across peers
  notes: The same forces that enlarge the market also determine whether chains can hold margin and pay back store openings. Demand growth alone is not the same as attractive value capture.
