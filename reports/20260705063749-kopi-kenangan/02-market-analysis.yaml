company:
  name: Kopi Kenangan
chapter:
  number: 2
  title: Market Analysis
  summary: 'Kopi Kenangan operates in a large but definition-sensitive Indonesian coffee market where the practical revenue pool sits between low-cost street coffee and international premium cafés, then expands through delivery, loyalty, RTD, and corporate ordering rather than through all coffee spend. Public evidence supports strong demand—72% daily coffee consumption in a 2026 survey, youth-led café culture, and resilient delivery growth—but it also shows clear constraints: 2026/27 crop pressure, expensive robusta, lower delivery basket values, and capital-intensive rollout by rivals. The investable conclusion is that Kopi Kenangan''s SAM is multi-channel modern coffee consumption in urban Indonesia, not total national coffee spend, and public sources still cannot prove a precise SOM or unit-economics ceiling.'
sections:
- id: market-boundary-and-substitutes
  title: 'Market boundary: Kopi Kenangan sits between street coffee, premium cafés, and multi-channel convenience'
  body: 'Kopi Kenangan should not be underwritten against all Indonesian foodservice spend or even against all coffee sold in the country. Its own positioning is more specific. Company pages describe a grab-and-go coffee chain built on high-quality local ingredients, while the unicorn-fundraise announcement says the company was created to fill the gap between expensive international chains and instant or street coffee. That definition points to modern prepared-coffee occasions bought for convenience, consistency, and branded experience. Official channel pages widen the spend pool somewhat: the company runs a loyalty program, promotes corporate and event orders, sells ready-to-drink bottled coffee, and keeps an active delivery presence on GrabFood. Those adjacencies matter because they broaden the same consumer relationship across app, outlet, delivery, office, and at-home moments. But the same logic excludes most of total restaurant spend, commodity export value, and unbranded roadside coffee,
    because those pools do not convert cleanly into branded-cup economics or chain valuation multiples.'
