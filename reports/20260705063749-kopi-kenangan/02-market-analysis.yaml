  evidenceGaps:
  - type: missing-source
    severity: material
    topic: precise-modern-chain-tam
    missingEvidence: A city-level estimate of modern branded coffee spend, order frequency, and average ticket by channel that isolates chain-addressable demand from total coffee consumption.
    whyItMatters: Without a channel-specific spend pool, any TAM or SAM model for Kopi Kenangan overstates precision and can hide whether growth is coming from new users, trade-up, or channel shifting.
    diligencePath: Request management’s city-by-city spend model, delivery mix, and order-frequency assumptions, then reconcile them with outlet density and basket data.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: network-scope-and-som
    missingEvidence: A reconciled live network count that explains Indonesia-only outlets, overseas stores, format differences, and the timing gap between official store locators and third-party coverage.
    whyItMatters: Network size is the closest public SOM proxy, and inconsistent scope makes it easy to overstate saturation, market share, or execution density.
    diligencePath: Obtain a dated network reconciliation from management showing active stores by country, format, and closure/opening status, then map it against current locator output.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-and-channel-mix
    missingEvidence: Store-level productivity, same-store sales growth, gross margin by channel, promo burn, and delivery-vs-walk-in contribution margins.
    whyItMatters: The category can show strong top-line demand while still destroying value if promotional intensity, commodity costs, or new-store cannibalization overwhelm repeat-visit economics.
    diligencePath: Request cohort retention, four-wall contribution margins, delivery share, and new-store payback curves for Indonesia core cities before underwriting a precise SOM or margin path.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM003
    - TM005
