- id: constraints-and-underwriting-gaps
  title: 'Headwinds and diligence gaps: market growth is visible, but margin capture is not automatic'
  body: 'The main underwriting risk is not whether Indonesians drink coffee—it is whether modern chains keep enough margin and differentiation as the category densifies. USDA says roaster margins have been squeezed since green-bean prices rose in 2024 and that softer purchasing power pushed some demand toward lower-grade coffee. Coffee Geography and Indonesia Specialty Coffee both point to the same cost-side problem: 2026/27 output is down while robusta prices remain elevated. Delivery adds another friction. Retail Asia says platform growth is being driven by more users rather than larger baskets, and average order value has dipped because of affordability campaigns. Regulation is not catastrophic, but taxes still matter; PwC notes an effective 11% VAT on most goods and services. Competition also remains capital intensive: Antara says Fore planned 140 additional outlets through 2026 and needs roughly Rp1.3 billion to Rp2 billion per store. Public materials still do not reveal Kopi Kenangan’s
    same-store sales, delivery mix, city-level share, or channel margins, so exact TAM-to-SOM conversion and long-run store economics remain the biggest unresolved diligence items.'
