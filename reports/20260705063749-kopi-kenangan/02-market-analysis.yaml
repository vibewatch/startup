- id: growth-drivers-and-supply-stack
  title: 'Growth drivers: café culture, digital ordering, RTD adjacency, and national density all matter'
  body: The market still has real expansion drivers. Statista says coffee popularity in Indonesia has increased with café culture and changing consumption among younger generations, while Knowledge Sourcing says espresso-based drinks attract urban youth and ready-to-drink offerings simplify on-the-go consumption. Kopi Kenangan’s own RTD page and official store locator show how a leading chain can meet that demand across multiple formats and geographies rather than through a single flagship model. Delivery also remains a genuine growth rail. Retail Asia says Southeast Asia food delivery rebounded 18% in 2025, and Grab reported 24% year-on-year On-Demand GMV growth in Q1 2026. Those figures do not prove coffee-chain margins, but they do show digital habit resilience. At the same time, supply-side facts shape growth quality. Indonesia remains a smallholder-dominated coffee system concentrated in southern Sumatra, so chains scale on top of an agricultural base that is fragmented, weather-sensitive,
    and exposed to freight and currency swings.
