company:
  name: Kopi Kenangan
chapter:
  number: 1
  title: Company Overview
  summary: Kopi Kenangan is a Jakarta-based, tech-enabled grab-and-go coffee chain founded in 2017 that became Southeast Asia's first new-retail F&B unicorn after a $96 million Series C in 2021. Official, investor, and 2025-2026 reporting indicates it has scaled from an 800+ store Indonesian base to 1,324 outlets across six countries while recently inflecting to profitability, though exact cap-table, board-rights, and IPO-timing details remain private.
sections:
- id: identity-business-model
  title: Identity, headquarters, and business model
  body: 'Kopi Kenangan is a Jakarta-born, tech-enabled grab-and-go coffee chain founded in 2017 by Edward Tirtanata, James Prananto, and Cynthia Chaerunnisa. Multiple official and media sources describe the founding thesis the same way: Indonesia had cheap instant coffee and expensive global cafe chains, but not a scaled middle tier that paired local flavors with accessible pricing. That positioning still anchors the brand. The company''s own site frames its mission as taking Indonesian coffee from Indonesia to the rest of Asia, while its consumer surfaces emphasize app ordering, pickup, delivery, and modern Indonesian flavors rather than long-stay cafe ambience. Public office information places the main office at Plaza Blok M in South Jakarta, and the same official pages list Singapore and Malaysia offices, reinforcing that the business has been organized for regional operations rather than only domestic retail. Official operating claims remain conservative relative to later media coverage—more
    than 800 Indonesian stores across 45 cities and more than 5,000 employees—but they still establish a large-format national brand with a clear affordable-premium identity.'
