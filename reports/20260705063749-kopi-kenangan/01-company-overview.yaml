- id: funding-investors-valuation
  title: Funding history, investors, and valuation signals
  body: 'Capital formation is one of the clearest parts of Kopi Kenangan''s public story. Alpha JWC''s 2020 announcement says the chain raised $109 million in Series B led by Sequoia Capital India, with Alpha JWC, B Capital, Horizons Ventures, Verlinvest, Kunlun, and Sofina participating; the same release also said Eduardo Saverin would join the board. In late 2021, Alpha JWC and multiple Indonesian outlets reported a $96 million first close of Series C led by Tybourne Capital Management, with Horizons Ventures, Kunlun, B Capital, and Falcon Edge participating. That round took Kopi Kenangan above the $1 billion valuation threshold and made it Southeast Asia''s first new-retail F&B unicorn. Later reporting adds color rather than a clean cap table: CNBC said the company had raised over $230 million by April 2024, while Forbes'' 2026 profile put total capital at $234 million over at least five rounds and highlighted a marquee backer set spanning Peak XV, GIC, Arrive, Serena Ventures, and B
    Capital. The main adverse capital-markets development surfaced in September 2025, when Business Times and CoffeeTalk reported that GIC and Peak XV were exploring partial stake sales at an indicative $1.2 billion to $1.4 billion valuation. Because neither investors nor the company commented, that should be treated as a liquidity signal, not a completed repricing.'
