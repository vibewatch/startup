- id: founders-leadership-governance
  title: Founders, leadership, and governance
  body: Leadership is still founder-centric even after venture scaling. Edward Tirtanata is consistently presented as co-founder and chief executive, and both CNBC and Northeastern profile him as the strategic driver behind the chain's grab-and-go economics, tech adoption, and long-term international ambitions. His prior experience at Lewis & Carroll Tea and his finance-accounting training help explain why Kopi Kenangan pursued a brand-led consumer model with tighter capital discipline than many regional startups. James Prananto remains publicly tied to the founding group and, in Forbes' 2026 profile, is described as a board director; Indonesian profile coverage also links him to finance and marketing roles before Kopi Kenangan. Cynthia Chaerunnisa remains part of the founding trio, but public sources describe her responsibilities differently across time—marketing leadership, director, and chair-type governance references—so diligence should treat the precise current remit as partially opaque
    rather than assume one settled title. Official leadership pages also name CTO Zeng Fengping and Group Chief People & Culture Officer Gemini Aryanto, but a full board roster and committee structure are not publicly disclosed.
