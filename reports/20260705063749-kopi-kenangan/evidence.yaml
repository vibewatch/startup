evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-and-bench-disclosure
    missingEvidence: A full current board roster, committee structure, and clearly dated role descriptions for non-founder executives.
    whyItMatters: >-
      Leadership concentration and board independence are core diligence issues for any future IPO or major secondary
      sale.
    diligencePath: Request the latest board deck, org chart, and biographies directly from management or lead investors.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-secondary-status
    missingEvidence: >-
      The exact current cap table, liquidation preferences, and documentation showing whether any 2025 stake sale
      actually closed.
    whyItMatters: Without it, valuation interpretation and governance leverage by specific backers remain speculative.
    diligencePath: Obtain the latest cap table, shareholder agreement summary, and adviser mandate / transaction status memo.
    relatedQuestionRefs:
      - QO014
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financial-pack
    missingEvidence: Audited 2025 consolidated statements, market-level profitability, same-store sales, and 2026 year-to-date results.
    whyItMatters: >-
      Public reporting points to a profit inflection, but later diligence chapters need auditable numbers rather than
      management-shared documents.
    diligencePath: Request the 2025 audit package, management accounts, and market-level P&L bridge used in investor reporting.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
  - type: stale
    severity: minor
    topic: 2026-market-debuts
    missingEvidence: Official confirmation of which two additional markets actually opened in 2026 and their initial outlet counts.
    whyItMatters: The difference between planned and executed market entries affects credibility of the 2030 footprint plan.
    diligencePath: >-
      Re-check company consumer sites, local corporate registrations, and press releases after the next international
      launch cycle.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: precise-modern-chain-tam
    missingEvidence: >-
      A city-level estimate of modern branded coffee spend, order frequency, and average ticket by channel that isolates
      chain-addressable demand from total coffee consumption.
    whyItMatters: >-
      Without a channel-specific spend pool, any TAM or SAM model for Kopi Kenangan overstates precision and can hide
      whether growth is coming from new users, trade-up, or channel shifting.
    diligencePath: >-
      Request management’s city-by-city spend model, delivery mix, and order-frequency assumptions, then reconcile them
      with outlet density and basket data.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: network-scope-and-som
    missingEvidence: >-
      A reconciled live network count that explains Indonesia-only outlets, overseas stores, format differences, and the
      timing gap between official store locators and third-party coverage.
    whyItMatters: >-
      Network size is the closest public SOM proxy, and inconsistent scope makes it easy to overstate saturation, market
      share, or execution density.
    diligencePath: >-
      Obtain a dated network reconciliation from management showing active stores by country, format, and
      closure/opening status, then map it against current locator output.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-and-channel-mix
    missingEvidence: >-
      Store-level productivity, same-store sales growth, gross margin by channel, promo burn, and delivery-vs-walk-in
      contribution margins.
    whyItMatters: >-
      The category can show strong top-line demand while still destroying value if promotional intensity, commodity
      costs, or new-store cannibalization overwhelm repeat-visit economics.
    diligencePath: >-
      Request cohort retention, four-wall contribution margins, delivery share, and new-store payback curves for
      Indonesia core cities before underwriting a precise SOM or margin path.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM003
      - TM005
  - type: private-evidence-only
    severity: material
    topic: peer-unit-economics
    missingEvidence: >-
      Realized post-promo selling prices, contribution margin per cup or order, and cohort retention for Kopi Kenangan,
      Janji Jiwa, Fore, and Tomoro.
    whyItMatters: >-
      Without apples-to-apples unit economics and retention, the chapter can compare formats and scale but cannot prove
      who truly has the strongest economic moat.
    diligencePath: >-
      Request chain-level management accounts or investor materials that break out AOV, promo burn, contribution margin,
      and repeat frequency by channel.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP003
      - TP005
  - type: missing-source
    severity: material
    topic: official-indonesia-outlet-counts
    missingEvidence: Company-authored current Indonesia outlet totals for Starbucks Indonesia and Mixue Indonesia at the run date.
    whyItMatters: >-
      The current chapter can only use independent or regional proxies for two large competitors, which weakens exact
      outlet-scale comparisons in the most crowded consumer rivalry map.
    diligencePath: >-
      Obtain current company presentations, store-locator exports, or local statutory disclosures that state
      Indonesia-specific outlet counts for Starbucks and Mixue.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP001
