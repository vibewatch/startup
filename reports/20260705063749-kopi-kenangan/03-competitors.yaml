tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - class
  - latest scale signal
  - primary position
  - main strategic edge
  - main limitation
  rows:
  - - Kopi Kenangan
    - Direct local leader
    - 1,136 Indonesia outlets; 1,324 outlets across six countries by end-2025
    - Affordable-premium local coffee at grab-and-go scale
    - Largest disclosed local footprint plus strong app-led repeat loop
    - Moat still relies on execution, not unique product IP
  - - Janji Jiwa
    - Direct local peer
    - About 900 stores in Indonesia
    - Accessible grab-and-go coffee rooted in local tastes
    - High awareness and partner-enabled scaling rails
    - Public app and loyalty features are visible, but exact current economics are opaque
  - - Fore Coffee
    - Direct local peer
    - 316 active stores at end-2025 after 90+ new stores
    - Premium-affordable coffee with stronger hangout and listed-company profile
    - Operational transparency, direct management, and fast recent profit growth
    - Scale still trails Kenangan and expansion is less capital-light than franchise models
  - - Starbucks Indonesia
    - Premium incumbent
    - Just over 500 Indonesia outlets on KR-Asia
    - Premium café and formal rewards ecosystem
    - Deep rewards mechanics and premium brand status
    - Higher prices narrow its mass-market reach
  - - Tomoro Coffee
    - Fast-rising like-for-like challenger
    - 600 stores with overseas presence in Singapore, China, and the Philippines
    - Affordable quality coffee with speed-of-service emphasis
    - Rapid rollout and adjacent taste profile to local chains
    - 2025 growth downgrade shows macro sensitivity
  - - Flash Coffee
    - Rebuild-stage challenger
    - 2025 goal to surpass 70 Indonesia stores
    - Lifestyle-led app coffee brand
    - Demonstrated ability to rebuild toward profitable stores
    - Far smaller scale than the top four coffee rivals
  - - Mixue
    - Low-price adjacent substitute
    - 59,823 global outlets; Indonesia and Vietnam are the two largest overseas markets
    - Tea, ice cream, and impulse beverages at very low price points
    - Supply-chain-led low prices and franchise-scale rollout
    - Not a direct coffee-for-coffee peer and Indonesia outlet totals are not clearly disclosed in retained official sources
  notes: Scale signals mix official company disclosures and current third-party reporting; where official Indonesia-only outlet totals are missing, the table uses the best retained public proxy and says so.
