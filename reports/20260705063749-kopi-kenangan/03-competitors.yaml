  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: peer-unit-economics
    missingEvidence: Realized post-promo selling prices, contribution margin per cup or order, and cohort retention for Kopi Kenangan, Janji Jiwa, Fore, and Tomoro.
    whyItMatters: Without apples-to-apples unit economics and retention, the chapter can compare formats and scale but cannot prove who truly has the strongest economic moat.
    diligencePath: Request chain-level management accounts or investor materials that break out AOV, promo burn, contribution margin, and repeat frequency by channel.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP003
    - TP005
  - type: missing-source
    severity: material
    topic: official-indonesia-outlet-counts
    missingEvidence: Company-authored current Indonesia outlet totals for Starbucks Indonesia and Mixue Indonesia at the run date.
    whyItMatters: The current chapter can only use independent or regional proxies for two large competitors, which weakens exact outlet-scale comparisons in the most crowded consumer rivalry map.
    diligencePath: Obtain current company presentations, store-locator exports, or local statutory disclosures that state Indonesia-specific outlet counts for Starbucks and Mixue.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
    - TP002
