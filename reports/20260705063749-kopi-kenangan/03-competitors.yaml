- id: TP003
  title: Pricing and store-format comparison
  columns:
  - competitor
  - public price anchor
  - format bias
  - loyalty or app evidence
  - what it implies for rivalry
  rows:
  - - Kopi Kenangan
    - Kopi Kenangan Mantan Rp22,000; Americano Rp20,000
    - 85% of outlets are grab-and-go kiosks
    - Kenangan app offers pickup, delivery, points cashback, vouchers, and new-product priority
    - Kenangan defends the center of the market by pairing convenience with a still-affordable ticket
  - - Janji Jiwa
    - Exact public 2026 menu pricing not retained
    - Grab-and-go and local-taste accessibility are explicit brand claims
    - JIWA+ offers points, order ahead, pickup, e-wallet payment, and vouchers
    - Janji Jiwa competes on the same daily-habit logic as Kenangan even without a retained public price list
  - - Fore Coffee
    - Iced Americano Rp23,000; Iced Manuka Americano Rp29,000
    - Mix of grab-and-go and modern hangout positioning
    - Direct app download plus aggregator and partner rails are public
    - Fore sits in nearly the same entry-price band while leaning slightly more lifestyle and hangout
  - - Starbucks Indonesia
    - 'Retained pack shows price umbrella only: Kopi Kenangan buyers wanted an alternative to paying more than double the local chain price'
    - Sit-down premium café and rewards-first brand
    - Starbucks Indonesia app and card rewards are public
    - Starbucks remains the premium benchmark local chains price under rather than match
  - - Tomoro Coffee
    - Exact public retained price anchor is not clear
    - Fast-service chain with quality messaging around 100% Arabica
    - Official site points users to its app
    - Tomoro overlaps more on format and occasion than on disclosed public pricing
  - - Flash Coffee
    - Retained official menu pages do not surface stable comparable prices in the excerpted pack
    - Design-forward stores plus app convenience
    - Brand explicitly says it lives in users’ pockets through the app
    - Flash competes more on design, speed, and campaigns than on scale
  - - Mixue
    - Retail News Asia cites VND10,000-30,000 in Vietnam as an affordable benchmark for the model
    - Impulse beverage and dessert format rather than coffee-first sit-down retail
    - Franchise and outlet navigation are more visible than loyalty depth in retained sources
    - Mixue keeps the mass beverage floor low even where it is not the consumer’s coffee brand of choice
  notes: Not every chain publishes a comparable Indonesia menu at run date; unknown cells are left explicit, and Mixue’s retained low-price example comes from Vietnam reporting because equivalent Indonesia menu pricing was not cleanly retained.
