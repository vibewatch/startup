- id: apps-loyalty-and-distribution-power
  title: Apps, loyalty, and distribution power
  body: The sharper competitive fight is now happening in the repeat-order layer rather than in coffee origin storytelling alone. Kopi Kenangan’s app combines pickup, delivery, cashback points, vouchers, birthday drinks, and priority access to launches, which turns the brand from a kiosk network into a habit loop. Janji Jiwa’s JIWA+ page shows a very similar toolkit of points, order-ahead, pickup, multiple e-wallets, and daily vouchers, meaning the direct local rivalry is already converging around owned-app retention. Starbucks Indonesia still looks strongest on formal loyalty mechanics, with an explicit star ladder and Gold threshold, but that strength serves a narrower premium user base. Fore adds a different source of leverage by being deeply embedded with GrabFood, GoFood, ShopeeFood, Citilink, and BCA Digital while still keeping direct operational control. Mixue and Flash are more visible as channel or franchise machines than as deep loyalty ecosystems. For Kopi Kenangan, this means
    the moat question is less about who can brew milk coffee and more about who can capture the next ten orders at acceptable customer-acquisition cost.
