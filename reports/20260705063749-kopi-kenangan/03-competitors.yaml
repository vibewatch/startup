- id: TP004
  title: Partnership and channel map
  columns:
  - competitor
  - owned or proprietary channel
  - partner or aggregator evidence
  - rollout model signal
  - competitive implication
  rows:
  - - Kopi Kenangan
    - Kenangan app with QR-linked cashback and direct ordering
    - Pickup and delivery are built into the brand app
    - Mostly operator-controlled kiosk network in retained pack
    - Kenangan is fighting to own repeat behavior rather than rent every order from aggregators
  - - Janji Jiwa
    - JIWA+ handles order-ahead, pickup, points, and vouchers
    - Jiwa Group runs partner and big-order contact routes plus a partner portal
    - Licensing and partnership rails are visible on the corporate site
    - Janji Jiwa can scale access through partners, but that can also dilute control versus fully integrated peers
  - - Fore Coffee
    - Direct app plus direct-management operating model
    - GrabFood, GoFood, ShopeeFood, Citilink, and BCA Digital all appear in official pages
    - No-franchise stance; direct management prioritized
    - Fore is using partners for demand and payment while refusing to outsource core unit control
  - - Starbucks Indonesia
    - Starbucks Indonesia app and Starbucks Rewards
    - Rewards ecosystem is explicit; retained pack is thinner on local delivery partners
    - Incumbent loyalty stack rather than capital-light partner rollout is the visible lever
    - Starbucks competes for premium repeat users more than for every low-ticket daily cup
  - - Tomoro Coffee
    - Official site pushes app download
    - No retained official partner map in current pack
    - Operating model not clearly disclosed in retained sources
    - Tomoro may have app depth, but public evidence is thinner than for Kenangan, Janji Jiwa, and Fore
  - - Flash Coffee
    - Brand says the app keeps the experience in users’ pockets
    - Official pages emphasize community, lifestyle, and location network more than named delivery partners
    - Management model is not fully disclosed in retained pack
    - Flash still needs app convenience because it lacks the scale cushion of the largest chains
  - - Mixue
    - Official Indonesian site foregrounds partnership hotline and store network
    - Outlet directory and franchise-network logic are more visible than app-led loyalty
    - Franchisee network enhancement is the visible growth engine
    - Mixue wins reach and cost, not deep owned-app retention
  notes: The table separates owned-demand tools from third-party demand rails because the competitive issue is not just reach but who controls the repeat order, the promo, and the quality standard.
