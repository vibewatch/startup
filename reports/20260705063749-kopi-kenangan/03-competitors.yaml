- id: TP002
  title: Outlet scale and expansion pace table
  columns:
  - competitor
  - latest outlet signal
  - 2025-2026 expansion signal
  - international reach
  - public economics signal
  - rivalry implication
  rows:
  - - Kopi Kenangan
    - 1,324 total outlets; 1,136 in Indonesia
    - Net 347 new outlets in 2025
    - Six countries; 188 overseas outlets cited by Forbes/CoffeeTalk
    - First full-year group profit in 2025; 1.5m monthly digital users
    - Scale lead is real, but it raises the discipline burden as the network globalizes
  - - Janji Jiwa
    - ~900 stores in Indonesia
    - No retained official 2026 pace disclosure
    - Primarily domestic in retained pack
    - No retained public profitability pack
    - Big enough to stay in the same consumer consideration set as Kenangan
  - - Fore Coffee
    - 316 active stores at end-2025
    - 90+ new stores in 2025 and 20+ more in 1Q26
    - Fore is already in Singapore
    - FY25 net profit +55% YoY; 1Q26 net profit +60.5% YoY
    - Fore is the clearest transparency-backed local challenger
  - - Starbucks Indonesia
    - Just over 500 Indonesia outlets on KR-Asia
    - Steadier incumbent pace in retained pack
    - Regional and global incumbent system
    - No retained Indonesia-specific profit disclosure
    - Starbucks is less dense than local leaders but still a premium reference point
  - - Tomoro Coffee
    - 600 stores on KR-Asia
    - Paused international expansion until 2026 and refocused on domestic growth
    - Singapore, China, and the Philippines
    - Weaker consumer confidence dented sales per WCP
    - Tomoro looks dangerous when demand is strong, but macro softness already slowed it
  - - Flash Coffee
    - 70+ store goal for 2025
    - New capital earmarked for expansion and two new cities
    - No retained overseas Indonesia-led push
    - Revenue per store doubled and stores were said to be profitable
    - Flash is a live reminder that app-led chains can shrink, reset, and re-accelerate
  - - Mixue
    - Global network at 59,823 outlets
    - Closed 428 overseas outlets while optimizing Indonesia and Vietnam operations
    - Massive global chain with SEA franchise focus
    - Revenue +35% and net profit +33% in retained report summary
    - Mixue shows that scale alone does not remove the need to prune underperforming markets
  notes: Expansion pace signals mix official disclosures, quoted company statements, and industry reporting; international reach is included only where the retained source pack states it directly.
