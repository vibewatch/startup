  topStrengths:
    - Proven scale with 1,324 outlets across six countries and positive 2025 group profit.
    - Affordable-premium positioning and dense kiosk format create a strong value-convenience proposition.
    - App-led ordering and loyalty drive close to half of sales and 1.5 million monthly transacting users.
    - Strong investor base and history of raising capital through the unicorn threshold.
    - Malaysia and other overseas markets show early evidence that the format can travel beyond Indonesia.
  topRisks:
    - The reported $1.2B-$1.4B valuation range already assumes a premium multiple despite thin audited disclosure.
    - Coffee, dairy, packaging, and FX volatility can compress margins in a price-sensitive category.
    - App crashes, refund friction, promo disputes, and aggregator dependence can weaken retention quality.
    - Indonesia's modern coffee market remains crowded, promotion-heavy, and vulnerable to price wars.
    - Governance, board, and preference-stack opacity complicate exit underwriting and common-equity value.
  unresolvedGaps:
    - Audited 2025 consolidated financial statements, cash balance, capex, and store payback are not public.
    - No confirmed clearing price or disclosed terms exist for any 2025-2026 secondary transaction.
    - Cohort retention, owned-vs-aggregator channel mix, and VIP-tier economics remain undisclosed.
    - Full board composition, reserved-matter rights, and preference-stack terms remain opaque.
