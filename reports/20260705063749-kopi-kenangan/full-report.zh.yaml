    rows:
      - - 核心 kiosk 饮品
        - 85% 以 kiosk 为主的网络出售外带咖啡和非咖啡饮品
        - 印尼旗舰饮品价格锚定在 IDR20k-IDR22k
        - 六国 1,324 家门店；75% 销售仍来自印尼
