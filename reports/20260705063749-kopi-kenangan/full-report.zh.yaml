      - number: '2.4'
        title: 增长驱动：咖啡馆文化、数字点单、即饮邻近品类和全国密度都重要
        blocks:
          - type: paragraph
            body: >-
              市场仍有真实扩张驱动。Statista 称，咖啡馆文化兴起和年轻一代消费变化提升了咖啡在印尼的流行度；Knowledge Sourcing 称，意式浓缩基底饮品吸引城市年轻人，即饮产品简化了路上消费。Kopi
              Kenangan 自己的即饮页面和官方门店定位器显示，领先连锁可以跨多个形态和地域满足需求，而不是只靠单一旗舰店模型。外卖同样仍是一条真正的增长轨道。Retail Asia 称东南亚外卖 2025 年反弹
              18%；Grab 报告 2026 年 Q1 On-Demand GMV 同比增长
              24%。这些数字不能证明咖啡连锁利润率，但能说明数字习惯有韧性。与此同时，供给侧事实决定增长质量。印尼咖啡体系仍以小农为主，并集中在苏门答腊南部，因此连锁扩张建立在一个分散、受天气影响且暴露于运费和汇率波动的农业基础之上。
