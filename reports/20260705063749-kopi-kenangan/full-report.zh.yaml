      - number: '4.3'
        title: 融资、估值与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan 的历史融资记录到 2021 年已足够清楚：2018 年 US$8 million 种子轮、2019 年 US$20 million Series A、2020 年 US$109
              million Series B，以及 2021 年 US$96 million Series C 首次交割，把公司估值推过 US$1 billion。近期报道把已披露总资本放在约 US$233
              million-US$234 million。关键变化不在于已经融到多少钱，而在于最新估值信号的形式。2025 年，报道中的价格发现来自投资者探索按 US$1.2 billion-US$1.4 billion
              部分出售持股，也就是老股流动性，而非为运营需求宣布的新股资本。


              因此，管理层 2026 年的融资立场是核心尽调议题。Forbes 报道，公司计划投入 US$200 million，到 2030 年达到 4,000 家门店；但也引用 CEO
              的话称，他不预计为这一扩张向投资者融资，IPO
              讨论仍为时尚早。如果属实，资本充足性问题已经从“公司能不能融资？”变成“扣除资本开支和海外拖累后，本土市场实际能吐出多少现金？”所有权模型在边缘上有所帮助：印尼、马来西亚、新加坡和印度以自营为主，菲律宾和澳大利亚则使用加盟伙伴。这降低了边缘市场的资本开支，但无法回答实体现金、现金跑道和业态级回本周期这些核心缺口。
