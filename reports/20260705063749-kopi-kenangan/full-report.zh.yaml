      - number: '1.3'
        title: 融资历史、投资者与估值信号
        blocks:
          - type: paragraph
            body: >-
              资本形成是 Kopi Kenangan 公开故事中最清晰的一部分。Alpha JWC 2020 年公告称，公司完成由 Sequoia Capital India 领投的 $109 million Series
              B，Alpha JWC、B Capital、Horizons Ventures、Verlinvest、Kunlun 和 Sofina 参与；同一公告还称 Eduardo Saverin 将加入董事会。2021
              年底，Alpha JWC 和多家印尼媒体报道，公司完成由 Tybourne Capital Management 领投的 $96 million Series C 首次交割，Horizons
              Ventures、Kunlun、B Capital 和 Falcon Edge 参与。该轮把 Kopi Kenangan 推过 $1 billion
              估值门槛，也使其成为东南亚首个新零售餐饮独角兽。后续报道提供的是补充细节，而不是干净的股权结构表：CNBC 称截至 2024 年 4 月公司累计融资超过 $230 million；Forbes 2026
              年人物报道把累计资本写为至少五轮 $234 million，并强调投资方阵容横跨 Peak XV、GIC、Arrive、Serena Ventures 和 B Capital。主要反向资本市场信号出现在 2025
              年 9 月，Business Times 和 CoffeeTalk 报道 GIC 与 Peak XV 正探索按 $1.2 billion 至 $1.4 billion
              指示性估值部分出售持股。由于投资方和公司均未置评，这应被视为流动性信号，而不是已经完成的重定价。
