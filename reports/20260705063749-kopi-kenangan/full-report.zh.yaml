      - number: '5.3'
        title: 门店运营与外卖整合
        blocks:
          - type: paragraph
            body: >-
              运营设计仍明显为快速出杯饮品优化，而不是长停留咖啡馆。独立报道称，约 85% 网络以即买即走小店运行；公司自己也描述过疫情期间从 CBD 重心选址转向住宅区客群的扩张调整。这与 App 流程一致，也与 Kopi
              Kenangan 在第三方外卖平台上的可见度一致。GrabFood 有专门的 Kopi Kenangan 连锁页面，列出许多门店；Foodpanda
              则展示饮品、烘焙和热食菜单，实际把门店变成远程下单前台。国际开店强化了同一套打法，同时加入本地变化：马来西亚被选中部分因为即买即走文化和数字化契合模型，新加坡复制了 App
              连接的会员回路，台湾则将本地运营伙伴与本地化菜单调整结合。关键限制是，公开来源显示了分销广度，却没有给出第一方 App 订单与聚合器订单之间的精确拆分，因此外卖依赖在定性上可见，但缺少干净的经济性或控制权拆解。
