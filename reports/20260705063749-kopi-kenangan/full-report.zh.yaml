      - number: '2.5'
        title: 逆风与尽调缺口：市场增长可见，但利润捕捉不会自动发生
        blocks:
          - type: paragraph
            body: >-
              主要承销风险不在于印尼人是否喝咖啡，而在于品类加密之后，现代连锁能否守住足够利润和差异化。USDA 称，2024 年生豆价格上涨后，烘焙商利润率受到挤压；购买力走弱也把部分需求推向低等级咖啡。Coffee
              Geography 和 Indonesia Specialty Coffee 指向同一个成本端问题：2026/27 年产量下降，而罗布斯塔价格仍处高位。外卖又增加一层摩擦。Retail Asia
              称，平台增长由更多用户而非更大客单推动，平均订单金额因平价促销而下降。监管并不灾难性，但税仍重要；PwC 指出多数商品和服务适用有效 11% VAT。竞争也依然资本密集：Antara 称 Fore 计划到
              2026 年新增 140 家门店，每家需要约 Rp1.3 billion 至 Rp2 billion。公开材料仍未披露 Kopi Kenangan 的同店销售、外卖占比、城市级份额或渠道利润率，因此从 TAM 到
              SOM 的精确转换和长期门店经济性，仍是最大未解尽调项。
