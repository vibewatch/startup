        title: 上市可比框架：出售传闻区间已经接近 Dutch Bros 式溢价
        blocks:
          - type: paragraph
            body: >-
              传闻中的 US$1.2 billion 至 US$1.4 billion 区间，约等于 2025 年收入的 6.5x 至 7.6x；按管理层所称 US$200 million 年化收入节奏计算，约为 6.0x 至
              7.0x。这远高于 Starbucks、Grab 和 Luckin，只比本组里享受溢价的上市咖啡成长股 Dutch Bros
              略低。换句话说，传闻私募估值不是让投资人支付一个温和的东南亚消费倍数；它要求投资人相信，尽管公开披露薄得多，Kopi Kenangan 仍配得上接近最高质量上市咖啡可比公司的成长溢价。


              这份溢价并非荒唐。Kopi Kenangan 增速快于 Starbucks，已经恢复盈利，在东南亚仍有大片空白。但公开证据也说明，投资人不该把传闻区间当成自证合理。Luckin
              证明，当市场把一个亚洲大型咖啡网络看作规模化大众市场运营商，而不是稀缺成长故事时，它可以在接近 1x 收入处交易。DoorDash 和 Grab
              说明，复购型消费者需求平台也可能落在中个位数收入倍数区间。按上市可比公司看，Kopi Kenangan 更像偏贵，而不是便宜。
