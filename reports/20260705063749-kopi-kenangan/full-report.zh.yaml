  - id: TP005
    title: 护城河耐久性与竞争风险清单
    columns:
      - 护城河或压力点
      - 为何重要
      - 当前证据
      - 严重性
      - 尽调问题
    rows:
      - - 规模叠加认知领先
        - 只有利用率保持高位，规模才会摊低每店采购和 App 营销成本
        - Kopi Kenangan 认知度 97%，披露门店数领先，总计 1,324 家
        - 中
        - 索取成熟门店产出和按国家拆分的同店销售
      - - App 驱动留存趋同
        - 如果 Janji Jiwa、Fore 和 Starbucks 都跑出有效奖励闭环，忠诚度深度就会变成促销战
        - Kenangan、JIWA+、Fore 和 Starbucks 都有可见 App 或奖励机制
        - 高
        - 索取按渠道拆分的队列留存、复购频次和 CAC
      - - 直营管理质量控制
        - Fore 称一体化控制能守住标准和品牌信任，但也可能拖慢轻资本扩张
        - Fore 公开拒绝加盟，而 Janji Jiwa 和 Mixue 展示合作路径
        - 中
        - 测试直营是否带来更好的单店经济模型或客户满意度
      - - 受宏观拖累的门店冲刺
        - 可选需求走弱时，快速扩张会放大风险
        - 信心走弱拖累销售后，Tomoro 收缩国际扩张
        - 高
        - 按业态和城市队列索取盈亏平衡销售门槛
      - - 转身修复脆弱性
        - App 优先型挑战者可以恢复，也可能高估重建后的稳定性
        - Flash 在筹集新资金并瞄准 70+ 门店前先经历收缩
        - 中
        - 对比重开门店表现与原始扩张队列
      - - 相邻饮品连锁压低价格地板
        - 超低客单价茶饮和甜品连锁即便不以咖啡为主，也能拉低消费者的饮品价格预期
        - Mixue 把供应链控制、极低消费价格和全球规模组合在一起
        - 高
        - 建模全品类促销强度加深时的贡献毛利率
      - - 原料和过剩压力
        - 如果投入品过剩缩窄品类价差，每个对手都更容易打折
        - Qahwa 报告 2024/25 和 2025/26 连续两个年度全球咖啡过剩
        - 中
        - 在更低价格伞和更重促销下压力测试毛利率
    notes: 本风险清单刻意跨竞争对手，而不只看公司自身，因为真正的护城河问题是：哪些对手行为会抹掉 Kopi Kenangan 的当前优势。
