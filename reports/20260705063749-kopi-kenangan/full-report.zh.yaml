        - 正向
        - 当前
        - App 渠道扩大触达、复购和城市便利性
        - 索取外卖占比、CAC，以及扣除补贴后的净贡献
      - - RTD 和带回家相邻场景
        - 正向
        - 当前至中期
        - 连锁可以吃到茶水间和居家场景，否则这些需求会流出咖啡馆网络
        - 量化 RTD 占比、利润率，以及对杯装销售的蚕食
      - - 作物波动和昂贵 robusta
        - 负向
        - 当前
        - 推高咖啡豆投入风险；若涨价无法传导，会挤压烘焙商或咖啡馆毛利
        - 审查套保、采购合同和配方组合灵活性
      - - 消费者降级和外卖客单下降
