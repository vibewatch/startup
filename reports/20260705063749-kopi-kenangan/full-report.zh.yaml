        - 正向
        - 若 2026 年盈利能力或数字参与度反转，溢价逻辑会削弱。
      - - 马来西亚 EBITDA 进展说明，海外单店经济性也可能成熟，不只是国内市场。
        - 正向
        - 如果新市场两年后仍亏损，国际空白市场价值应打折。
      - - 平价高端定位和 App 打出了真实客户基本盘。
        - 正向
        - 若复购或 App 带动订单明显下滑，护城河会比管理层所称更浅。
      - - 报道中的二级市场区间已经计入类似 Dutch Bros 的增长溢价。
        - 反向
        - 更低成交的二级市场价格，或明显更快的经审计增长，会重置可比公司讨论。
      - - 东南亚退出市场仍更奖励 EBITDA 执行，而不是倍数扩张。
        - 反向
