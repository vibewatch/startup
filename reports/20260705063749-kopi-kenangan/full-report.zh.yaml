  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 规模和盈利能力支撑溢价，但出售流程不确定、披露薄、退出市场弱，让本章停在跟踪而非买入。
    data:
      nodes:
        - id: proof
          label: 2025 年盈利 + 1,324 家门店
          detail: 业务已越过概念风险阶段。
          tone: positive
        - id: growth
          label: 溢价增长叙事
          detail: US$200m 年化收入和 4,000 家门店目标支撑上行空间。
          tone: positive
        - id: price
          label: US$1.2b-US$1.4b 出售传闻
          detail: 当前公开估值已经假设强溢价。
          tone: warning
        - id: market
          label: 退出市场仍受限
          detail: 东南亚退出更看重 EBITDA 证明，而不是倍数扩张。
          tone: warning
        - id: disclosure
          label: 股权结构 + 审计数据缺口
          detail: 传闻价格还没有达到公开证券级别的验证强度。
          tone: warning
        - id: decision
          label: 建议 = 跟踪
          detail: 继续尽调，但需要更好证据或更好价格。
          tone: neutral
      edges:
        - to: price
          from: proof
        - to: price
          from: growth
        - to: decision
          from: price
        - to: decision
          from: market
        - to: decision
          from: disclosure
    approximationNotes: null
    claimRefs:
      - CV006
      - CV008
      - CV018
      - CV020
      - CV021
      - CV038
      - CV043
      - CV046
      - CV047
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 假设收入基数或倍数的小变化，都会显著移动可支持的估值区间。
    data:
      items:
        - label: 门店咖啡中位倍数，基于 FY2025 收入
          value: 570
          detail: US$ 百万，按 US$184m 的 3.1x
          tone: negative
        - label: 全同业中位倍数，基于 FY2025 收入
          value: 830
          detail: US$ 百万，按 US$184m 的 4.5x
          tone: warning
        - label: 基准测算
          value: 1100
          detail: US$ 百万，按 US$220m 的 5.0x
          tone: neutral
        - label: 传闻出售估值中点
          value: 1300
          detail: US$ 百万，隐含于 2025-2026 年出售传闻
          tone: warning
        - label: 牛市测算
          value: 1500
          detail: US$ 百万，按 US$250m 的 6.0x
          tone: positive
    approximationNotes: 所有柱形都是作者估算，来自公开收入参考和可观察同业倍数。
    claimRefs:
