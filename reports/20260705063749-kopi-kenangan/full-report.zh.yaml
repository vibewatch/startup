      - number: '6.4'
        title: 国际契合与整体客户判断
        blocks:
          - type: paragraph
            body: >-
              国际市场上，客户逻辑可信，但证据深度不如印尼。公司如今在六个国家拥有 1,324 家门店，马来西亚是最大海外市场，新加坡有活跃品牌界面；管理层和行业媒体反复强调本地化配方、定价和风味画像。这令人鼓舞，因为它说明
              Kopi Kenangan
              在调整客户契合，而不是输出僵硬的印尼单一公式。与此同时，大多数海外证明仍由网络驱动：门店数、菜单页面、奖项和盈利里程碑。海外公开客户级证据——国家级活跃用户、复购行为、支持质量或本地评论密度——仍很薄。结果是一个平衡判断：Kopi
              Kenangan
              似乎拥有区域咖啡连锁中少见的强获客力和可信的可负担性护城河，但达到投资级的问题仍是按渠道、等级和市场拆分的留存质量。在管理层披露这些队列之前，客户故事强在获客与便利性，会员证明中等，并且明显暴露于服务摩擦漏损。
