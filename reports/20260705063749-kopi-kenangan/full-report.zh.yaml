        - label: 以可持续为导向的门店运营
          values:
            - 从试点到选择性推广
            - 官方案例证据具体，但网络覆盖有限
            - 中
        - label: 可靠性 / 服务指标透明度
          values:
            - 公开披露尚不成熟
            - 公开证据少
            - 低
    approximationNotes: 信心反映证据质量，而不是管理层抱负；低信心通常意味着披露缺口，而非产品薄弱。
    claimRefs:
