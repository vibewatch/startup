      - number: '3.4'
        title: 护城河耐久性、铺店纪律与反向信号
        blocks:
          - type: paragraph
            body: >-
              证据支持 Kopi Kenangan 确实领先，但还不是结构上牢不可破。公司拥有规模、高知晓度、由 App 驱动的快速获客，以及介于街头咖啡和 Starbucks 之间的清晰品牌位置；但 Janji
              Jiwa、Fore 和 Tomoro 也都用相似的本地风味菜单和现代运营系统追逐相邻需求。Fore 的不加盟模型和上市公司披露，提示了一条通过更紧质量控制和资本纪律提高耐久性的路径。Tomoro 2025
              年暂停国际扩张、Flash Coffee 重建的故事，则展示了权衡的另一面：一旦信心走弱或模型需要修复，门店增长会很快撞上宏观现实。Mixue
              的庞大网络和低价供应链机器也说明，相邻连锁重置消费者价格预期后，饮品利润率很难保护。Qahwa 关于供给过剩的报道进一步警示：咖啡投入供给充足、精品与商用咖啡价差收窄，可能加剧折扣压力。在这个背景下，Kopi
              Kenangan 的护城河更像运营和执行优势，还不是仿制业态无法模仿的自我强化结构壁垒。
