      - number: '4.5'
        title: 披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              财务结论好于中位数私营消费初创，但没有管理层访问仍不足以承销。Kopi Kenangan 现在有公开证据证明其规模可观、首次全年盈利、需求由 App 驱动，且至少一个海外市场已经跨入正
              EBITDA。它还拥有历史上较深的股权资本基础，并因新市场加盟而具备一定灵活性。这些都是真实优势。但验证自筹扩张所需的核心数据仍缺失：没有公开经审计的 FY2025
              单体报表，没有实体层面现金或现金跑道数字，没有按业态拆分的建店资本开支或回本周期，没有直接渠道与聚合器之间的总额到净额桥，也没有马来西亚以外的国家级利润拆分。


              因此，正确财务立场是建设性但有纪律。本土市场可能能够资助持续增长的相当一部分，但公开记录尚未证明它可以在不侵蚀回报、也不再次依赖外部资本的情况下，支撑 US$200 million 的多国扩张。2025
              年持股出售探索带来的不是缓解，而是压力，因为它提出了一个问题：在最新新股估值仍停留在 2021 年独角兽轮的情况下，成熟卖方如何给这家公司标价。投资者在支持 2026-2030
              故事前，应要求经审计的现金转化、业态级回本周期和渠道级经济性，而不是只从门店数和管理层访谈外推。
