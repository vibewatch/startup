  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、规模与玩家类别
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan 周围的竞争已经不再是一个本地咖啡连锁对另一个本地咖啡连锁。最直接的同业是 Janji Jiwa、Fore Coffee 和
              Tomoro，因为四家公司都围绕印尼风味熟悉度、大众精品定价和高密度即买即走分销竞争。Starbucks Indonesia
              与其说是同形态小店对手，不如说是高端参考品牌；它的更高价格给本地连锁留出了可下探的伞面。Mixue
              位于相邻的低客单饮品赛道，而不是直接的精品咖啡赛道，但其规模和性价比定位仍会压低消费者愿为冲动饮品支付的价格。现状替代品也意外强：街头摊贩、速溶咖啡和其他低门槛饮品选项，继续锚定消费者选择集合的最低价端。也就是说，Kopi
              Kenangan 至少同时面对五类竞争：直接本地连锁、高端国际咖啡馆、低价茶饮和甜品连锁、由外卖聚合器喂单的商户，以及线下现状替代方案。
