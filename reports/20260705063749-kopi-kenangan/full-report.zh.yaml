      - number: '8.4'
        title: 改变判断的变量：披露质量和真实市场出清证据
        blocks:
          - type: paragraph
            body: >-
              缺的不是叙事，而是可投性。公开市场已经给出了申报级模板，展示规模化消费企业如何披露门店经济性、分部结构、营运资本和现金生成；Jollibee 年报就是一个例子。Kopi Kenangan
              还没有向公开投资人提供同等材料，传闻出售流程也没有给出一个能终结争论的确认出清价格。


              因此，委员会应聚焦一小组能移动估值的尽调问题，而不是泛泛好奇。第一，确认确切优先权结构和任何二级交易机制，把标题估值翻译成普通股价值。第二，拿到 2025 年经审计财务和最新 2026
              年财务，把收入、EBITDA 和净利润桥接到现金转化。第三，核实传闻中的 2025-2026
              年二级流程是否真正出清，以及以什么条款出清。如果这三项都干净，估值可以向当前区间顶部迁移；如果不能，传闻区间就应被视为卖方偏高愿望，而不是公允价格。
