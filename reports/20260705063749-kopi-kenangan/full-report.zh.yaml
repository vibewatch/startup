  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 需求证明强，但估值支撑和披露质量落后于经营故事。
    data:
      items:
        - label: 市场需求
          score: 8
          detail: US$184m 收入和门店持续增长证明品类拉力。
          tone: positive
        - label: 单店经济性证据
          score: 7
          detail: 2025 年盈利和马来西亚 EBITDA 进展真实存在，但披露仍偏轻。
          tone: positive
        - label: 国际化证据
          score: 6
          detail: 六国足迹有帮助，但大部分收入仍在印度尼西亚。
          tone: neutral
        - label: 披露质量
          score: 4
          detail: 没有公开的 FY2025 审计包或股权结构细节。
          tone: warning
        - label: 退出流动性
          score: 4
          detail: 区域退出仍受限，二级交易更重要。
          tone: warning
        - label: 估值支撑
          score: 4
          detail: 传闻出售价格高于最站得住脚的公开同业区间。
          tone: warning
        - label: 整体 IC 准备度
          score: 5
          detail: 现在值得跟踪；还没到可以无视价格买入的阶段。
          tone: neutral
    approximationNotes: 分数是 0-10 的顺序判断，基于公开证据集综合而成，用于投资委员会讨论。
    claimRefs:
      - CV006
      - CV013
      - CV019
      - CV022
      - CV038
      - CV043
      - CV046
      - CV047
  - id: FV005
    title: 退出路径图
    type: dag
    layout: wide
    summary: 短期最顺的路径是二级流动性；IPO 或战略交易需要明显更好的证据和市场条件。
    data:
      nodes:
        - id: ops
          label: 盈利增长基础
          detail: 收入和 EBITDA 证明创造可选性。
          tone: positive
        - id: secondary
          label: 二级交易 / 财务投资人减持
          detail: 最可能的短期路径，因为它匹配当前市场证据。
          tone: neutral
        - id: strategic
          label: 战略少数股权或行业买家
          detail: 需要买家愿意为区域消费者平台规模付费。
          tone: neutral
        - id: ipo
          label: 区域 IPO
          detail: 需要审计报表、治理证明和更好的退出窗口。
          tone: warning
        - id: audits
          label: 审计披露包
          detail: 公开市场估值要完全过关，必须先有它。
          tone: warning
        - id: market
          label: 东南亚退出市场复苏
          detail: 需要它来降低流动性压力带来的折价。
          tone: warning
        - id: wait
          label: 等待并增长
          detail: 价格和披露不能同时过关时，这是默认路径。
          tone: warning
      edges:
        - to: secondary
          from: ops
        - to: strategic
          from: ops
        - to: wait
          from: ops
        - to: ipo
          from: audits
        - to: ipo
          from: market
        - to: strategic
          from: market
        - to: wait
          from: secondary
    approximationNotes: 路径图是定性决策框架，不是概率树。
    claimRefs:
      - CV019
      - CV020
      - CV038
      - CV039
      - CV043
      - CV046
      - CV047
