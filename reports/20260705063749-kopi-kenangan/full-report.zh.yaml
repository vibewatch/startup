        - GrabFood、GoFood、ShopeeFood、Citilink 和 BCA Digital 都出现在官方页面
        - 不加盟立场；优先直营管理
        - Fore 借合作伙伴拉需求和支付，同时拒绝外包核心单元控制
      - - Starbucks Indonesia
        - Starbucks Indonesia App 和 Starbucks Rewards
        - 会员生态明确；保留材料对本地外卖伙伴着墨较少
        - 可见杠杆是既有玩家会员栈，而不是轻资产合作伙伴铺店
        - Starbucks 争夺的是高端复购用户，而不是每一杯低客单日常咖啡
      - - Tomoro Coffee
        - 官网推动 App 下载
        - 当前材料包未留存官方合作伙伴地图
        - 留存来源未清楚披露经营模式
        - Tomoro 的 App 可能更深，但公开证据比 Kenangan、Janji Jiwa 和 Fore 更薄
      - - Flash Coffee
        - 品牌称 App 把体验装进用户口袋
        - 官方页面更强调社区、生活方式和门店网络，而不是具名配送伙伴
        - 留存材料包未充分披露管理模式
        - Flash 仍需要 App 便利性，因为它没有最大连锁的规模缓冲
      - - Mixue
        - 印尼官网突出合作热线和门店网络
        - 门店目录和加盟网络逻辑比 App 驱动忠诚度更清晰
        - 强化加盟商网络是看得见的增长引擎
        - Mixue 赢在触达和成本，而不是深度自有 App 留存
    notes: 本表把自有需求工具和第三方需求通道拆开，因为竞争问题不只是触达，更是谁控制复购订单、促销和质量标准。
