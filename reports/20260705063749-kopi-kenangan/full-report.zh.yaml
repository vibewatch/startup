            title: 平价精品叠加 App 便利性，是核心扩张引擎
            body: Kopi Kenangan 不是靠模仿堂食咖啡馆连锁取胜。证据指向一个更紧凑的模型：印尼风味定位、移动点单、以小店为主的部署，以及在自营和伙伴主导扩张之间有选择地取舍，让增长保持速度，同时守住品牌控制。
