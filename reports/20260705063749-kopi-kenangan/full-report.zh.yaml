  - id: TV007
    title: 推翻投资论点与叫停触发表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 二级交易清算价显著低于出售传闻
        - 任何经验证低于约 US$1.0b 的交易
        - 将证明当前买方意愿低于卖方对外喊出的预期。
        - 下调公允价值，并重审可比公司溢价假设。
      - - 增长跌破当前年化收入叙事
        - 2026 年收入未能突破约 US$200m 年化收入节奏
        - 支撑溢价倍数的桥就断了。
        - 只转向公开市场中位数倍数。
      - - 海外验证停滞
        - 马来西亚或新市场在没有规模抵消的情况下重新转亏
        - 削弱平台能输出印尼经济模型的论据。
        - 封顶上行情景，并削减国际化溢价。
      - - 价格敏感需求开裂
        - 印尼出现可见价格折扣或利润率侵蚀
        - 表明平价高端定位没有假设中耐久。
        - 提高下行权重，并要求更低入场价。
      - - 股权结构包袱浮现
        - 优先权或二级交易机制实质性压低新普通股持有人权利
        - 让名义估值无法很好代表经济价值。
        - 暂停，直到法律和股权结构尽调完全通过。
    notes: 这些是会推动估值变化的触发项，而非泛泛的运营风险。
    claimRefs:
      - CV017
      - CV020
      - CV022
      - CV038
      - CV039
      - CV040
      - CV043
      - CV045
      - CV046
      - CV047
  - id: TV008
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构和优先权
        - 最新普通股权益分配瀑布、清算优先权、反稀释棘轮、MFN 权利，以及任何二级交易机制
        - 决定新普通股投资者拿到的名义估值是否有真实经济含义。
        - 法律顾问 + CFO 数据室审阅
      - - 经审计 FY2025 财务
        - 经审计损益表、现金流量表、资产负债表和区域分部桥
        - 把已报道盈利能力转化为可持续现金生成证据需要它。
        - 审计包 + 管理账
      - - 明确的二级交易证据
        - 已报道 2025-2026 流程的最终价格、买方身份、持股比例和交易状态
        - 把传闻和真正出清的市场价格分开。
        - 牵头顾问 / 董事会材料
      - - 国际单元经济
        - 马来西亚、印度、澳大利亚和菲律宾的门店级回本周期与队列经济
        - 告诉投资者 2030 门店计划是否值得溢价倍数。
        - 区域运营审阅
      - - 扩张现金资金来源
        - 拟议 US$200m 扩张计划如何融资且不侵蚀回报
        - 避免假设增长会自动复利股权价值。
        - 资金模型 + 董事会批准资本开支计划
    notes: 这些是最可能改变推荐结论或可接受入场价的具体尽调项。
    claimRefs:
      - CV018
      - CV019
      - CV037
      - CV043
      - CV046
      - CV047
