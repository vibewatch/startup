        - 无法测算 4,000 店目标的经济性
        - 只能参考公司 2021 年关于利润率 / 回本「健康」的表述
        - 要求提供小亭店、招牌咖啡馆和加盟投资备忘录，以及实际回本周期
      - - 自有 App 与聚合平台占比及佣金
        - 无法量化外卖拖累或净实收
        - 只能用会员规则和可比公司申报文件作为代理指标
        - 要求提供自有渠道与聚合平台 GMV、佣金表和退款率
      - - 毛利率 / COGS 结构
        - 无法判断印度尼西亚高十几位数利润率能否扛住咖啡豆涨价
