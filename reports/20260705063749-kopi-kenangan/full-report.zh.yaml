        title: 国际适配、创新节奏与限制
        blocks:
          - type: paragraph
            body: >-
              国际品牌架构刻意转写为 Kenangan Coffee，但产品系统并非原封不动出口。马来西亚把英雄款印尼奶咖改名为 Kenangan Latte，并增加 Avocado Coffee
              和配餐；新加坡为更广泛的亚洲和全球口味筛选意式浓缩与非咖啡产品，同时保持入门价格可及；台湾则携本地伙伴开业，并推出 Pistachio Macchiato
              和市场特定风味调整。零售报道还称，配方和定价会按市场调整；这很重要，因为它把公司重新定义为本地化引擎的运营者，而不只是复制门店的机器。在印尼内部，创新同样可见，包括季节性爆品、即饮产品、整豆，以及由可持续性牵引的环保门店和太阳能门店试点。约束在于，公开证据最充分的护城河是运营纪律：App
