      - number: '7.4'
        title: 服务质量、劳动力和食品安全执行风险
        blocks:
          - type: paragraph
            body: >-
              留存证据中最具体的不利信息，不是监管行动或召回，而是大规模、分散经营版图旁边反复出现的消费者摩擦。Media Konsumen 投诉呈现出 App
              和门店里的重复主题：促销透明度争议、订单取消、退款延迟、客服处理不满，以及退款流程要求提交银行流水变动记录带来的顾虑。这些问题本身未必致命，但经营基数大，就会更重要。招聘页称，公司有专门的运营和质量保证团队、频繁的供应商审核，以及针对卫生、安全和一致性的内部审计；About
              和门店页面则显示，数千名员工分布在印尼数十个城市的数百个点位。因此，公开流程披露已经存在，但公开控制指标并不存在。留存公开证据里仍没有 BPOM 许可 ID、召回历史、App 可用性目标、退款 SLA
              达成率、投诉结案率或审计通过率。投资人只能主要靠投诉、规模和管理层说法来判断服务与食品安全韧性，而不是靠量化控制面板。
