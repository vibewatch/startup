  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与待完成任务
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan 不是把单一咖啡馆体验卖给单一买方画像。公开来源显示，其消费者基础分层明显：寻找平价精品咖啡的年轻大众市场饮用者；想跳过排队的 App
              优先通勤者；用价格和会员捕捉换便利的外卖用户；批量订购的办公室和活动买家；以及在门店之外接触品牌的即饮产品消费者。国际界面又增加一层，马来西亚和新加坡被定位为同一印尼咖啡身份的面向客户延伸。这些人群的共同点是便利性，加上一条刻意设在街头咖啡与全球连锁之间的价格带。因此，最强公开契合点不是奢侈咖啡文化，而是可重复的日常使用，尤其是客户重视速度、移动点单和一个可识别但仍可负担的品牌时。主要缺口在于，公开分层叙事丰富，但队列经济性很薄，所以本章必须依靠版图、App
              行为和公开可见使用场景，而不是已披露的客户终身数据。
