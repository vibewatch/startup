      - number: '2.2'
        title: 规模测算视角：全国咖啡需求很大，但公开市场仍没有干净的连锁专属 TAM
        blocks:
          - type: paragraph
            body: >-
              最强的市场规模测算应分层，而不是押注单一数字。在最宽口径上，USDA 仍把印尼视为咖啡大国，预测 2026/27 年国内消费 4.83 million 袋（每袋 60 kilograms），总产量 11.38
              million 袋。这说明消费习惯很大，但并不等同于品牌连锁收入。另一个邻近视角来自居家咖啡：Knowledge Sourcing 估计，印尼速溶咖啡市场 2025 年约 US$3.817
              billion，2030 年将达 US$5.734 billion。这是一块有意义的咖啡钱包，但很大一部分不在咖啡馆连锁内。第三个视角是数字触达：2025 年东南亚外卖 GMV 达 US$22.7
              billion，说明基于 App 的点单是通向需求的相关路径，哪怕这个数字并非咖啡专属。最后，Kopi Kenangan 自身 868 家门店的版图说明执行密度已经真实存在。实际结论是，Kopi Kenangan
              的 SAM 窄于全国咖啡消费，却宽于单纯到店咖啡馆支出；如果没有城市级份额和产出效率数据，精确 SOM 仍无法验证。
