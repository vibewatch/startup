      - CV035
      - CV036
      - CV042
      - CV047
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支撑的区间很宽，因为倍数选择几乎和收入基数一样关键。
    data:
      items:
        - label: 熊市情形
          low: 650
          mid: 800
          high: 900
          displayValue: US$0.65b-US$0.90b
          detail: 公开市场式倍数纪律，以及 2026 年仅温和增长。
          tone: negative
        - label: 基准情形
          low: 950
          mid: 1100
          high: 1250
          displayValue: US$0.95b-US$1.25b
          detail: 盈利增长守住，但市场仍给披露折价。
          tone: warning
        - label: 牛市情形
          low: 1200
          mid: 1350
          high: 1500
          displayValue: US$1.20b-US$1.50b
          detail: 增长、利润率和退出窗口全部配合。
          tone: positive
