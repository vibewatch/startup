  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与菜单架构
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan 已不再是单一饮品品牌；公开产品界面如今覆盖现制咖啡、非咖啡饮品、配餐、瓶装即饮咖啡，以及居家冲煮用整豆产品。印尼菜单仍采用分层架构：从经典咖啡和招牌椰糖饮品出发，扩展到低酸 Light
              Coffee 变体，再分叉到茶、巧克力、水果和冰沙形态，并配有付费小料。这个结构重要，因为它显示公司如何保护英雄
              SKU，同时为不同咖啡因耐受度、时段和场景需求创造相邻客篮。产品创新也更像按节奏推进，而不是一次性动作：公司强调 Matcha Series 和 O.G. Aren 销量，Light Coffee 创建了更温和的
              Arabica 子线，即饮产品把品牌带入全国零售货架，Kenangan Beans 则把品牌推进厨房台面消费。结果是，这套菜单系统在不放弃平价精品承诺的前提下扩大复购。
