          - type: paragraph
            body: >-
              乐观情景很容易讲：管理层继续高速扩张，马来西亚保持盈利轨道，数字互动维持高复购，Kopi Kenangan 在守住有吸引力门店经济性的同时，把收入滚到 US$250 million 以上。在那个世界里，6x
              倍数仍然能成立，传闻二级区间也开始像一个中途站，而不是天花板。


              基准和下行情景反而更容易从公开证据中站住脚。Bain 称东南亚退出仍受约束，TNB Aura 称估值压缩拉大了买卖价差，NielsenIQ 称消费者仍看重性价比。这一组合重要，因为 Kopi Kenangan
              仍在可选消费品类里卖一款可负担的高端产品，同时还要靠未来流动性事件验证今天的价格。业务不需要需求崩塌也能让人失望；只要后来的买家把资产锚定在更接近 Starbucks、Grab 或 Luckin
              的上市倍数，而不是 Dutch Bros，就足够制造下行。因此，短期内二级流动性，或耐心等待、继续增长的路径，比立刻以溢价 IPO 退出更可信。
