      - number: '4.4'
        title: 盈利能力、成本结构与情景框架
        blocks:
          - type: paragraph
            body: >-
              盈利曲线令人鼓舞，但披露仍很薄。World Coffee Portal 称，2024 年收入约 US$119 million，亏损从 2023 年的 US$18.4 million 收窄至约 US$2.3
              million；2025 年报道则显示净利润转正至 US$17 million。在印尼，用公开收入和利润推算的 2025 年净利率约 16.4%，接近但仍略低于会议报道中的本土市场 18%-20%
              净利润率。马来西亚似乎也走在类似轨道上，2025 年收入 RM111 million，EBITDA 为 RM17 million。对一家试图国际化扩张的私营餐饮连锁来说，这些都是真正的正面信号。


              不过，成本栈仍大多不可见。Forbes 指出，到 2026 年 1 月的两年里，阿拉比卡期货几乎翻倍；到 3 月下旬仍比 2024 年 1 月高出 50%
              以上，迫使公司采取套保和采购应对。公司还测试过高端大店和低价 Satu Kenangan
              概念，之后认为较低价格点并不保证成功，因而停止该低价业态继续扩张。这些细节意味着，利润率耐久性取决于在控制大宗商品、包装、促销和外卖漏损的同时，守住足够高的客单。下方情景瀑布因此只是示意：它显示，在考虑返现、活动折扣和下单摩擦后，公开标价数学与实现单店日净销售之间空间很小。
