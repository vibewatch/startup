  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Kopi Kenangan 如何把认知转化为自有渠道订单，再试图让订单在门店、外卖和相邻产品之间沉淀为复购。
    data:
      items:
        - label: 认知与尝试
          detail: 门店密、社交场景熟、价格走可负担高端路线，年轻消费者因此注意到这个品牌。
          touchpoints:
            - 97% 品牌认知度
            - Rp22k 旗舰饮品
            - 商场、交通枢纽、校园、加油站
        - label: 渠道选择
          detail: 便利性比忠诚度沉淀更重要时，顾客可以到店、通过 App 预订，或使用外卖渠道。
          touchpoints:
            - 到店 / QR
            - 预订自取
            - 外卖 / 聚合平台
        - label: 自有数字订单
          detail: App 主打免排队、地图、实时状态和多种支付方式，压低结账摩擦。
          touchpoints:
            - 提前下单
            - 实时通知
            - 无现金支付
        - label: 复购循环
          detail: 积分、返现、优惠券、生日礼遇和按消费分层的 VIP 级别，试图把消费频次变成习惯。
          touchpoints:
            - 1 积分 = 1 印尼盾
            - Gold 门槛 Rp700k
            - Black 门槛 Rp10m
        - label: 相邻扩张
          detail: 同一位顾客可以延伸到大额订单、RTD 消费，或国际 Kenangan Coffee 触点。
          touchpoints:
            - 大额订单
            - RTD 瓶装产品线
            - 马来西亚 / 新加坡
        - label: 摩擦流失点
          detail: 即使真实需求存在，崩溃、退款、促销不匹配和聚合平台排除也会打断复购。
          touchpoints:
            - 应用商店崩溃评价
            - 退款投诉
            - 促销不匹配
    approximationNotes: 旅程图刻画结构，不是量化转化漏斗；它把官方产品触点与公开客户摩擦证据放在一起。
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU010
      - CU011
      - CU025
      - CU026
      - CU027
      - CU039
      - CU040
      - CU044
  - id: FU002
    title: 采用 / 渠道流向
    type: flow
    layout: standard
    summary: 漏斗顶部认知和门店密度如何连接 App 订单、聚合平台订单与自有忠诚度循环。
    data:
      nodes:
        - id: n1
          label: 高认知度 + 高密度门店网络
        - id: n2
          label: 安装 App / 创建账户
        - id: n3
          label: 到店或自取订单
        - id: n4
          label: 外卖 / 聚合平台订单
        - id: n5
          label: 积分 / VIP 自有忠诚度循环
        - id: n6
          label: 相邻使用场景：RTD、大额订单、海外
      edges:
        - from: n1
          to: n2
          label: 发现后下载 App
        - from: n1
          to: n3
          label: 日常路线附近到店
        - from: n2
          to: n3
          label: 预订自取
        - from: n2
          to: n4
          label: 外卖需求
        - from: n3
          to: n5
          label: QR / App 内积分累积
        - from: n4
          to: n5
          label: 忠诚度沉淀弱或缺失
        - from: n3
          to: n6
          label: RTD / 活动 / 国际延伸
    approximationNotes: 这是结构性流向，不是真正的漏斗，因为公开来源没有披露各阶段或各渠道转化。
    claimRefs:
      - CU006
      - CU016
