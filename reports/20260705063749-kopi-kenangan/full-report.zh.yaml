  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 公开客户证据的深度差异很大：规模指标强，留存可见度仍弱。
    data:
      columns:
        - 结果具体度
        - 留存可见度
        - 证据质量
      rows:
        - label: 应用商店评分
          values:
            - 公开情绪强
            - 复购经济性弱
            - 中高 — 评分基数大，但用户队列细节少
        - label: AppBrain 用户评论
          values:
            - 实际体验中等
            - 长期复购弱
            - 中 — 时间近且具名，轶事深度足
        - label: Media Konsumen 投诉
          values:
            - 摩擦案例强
            - 发生率弱
            - 中 — 反向样本，但自选择
        - label: 官方忠诚度 / VIP 页面
          values:
            - 机制强
            - 实际留存披露弱
            - 规则证据强，结果证据弱
        - label: 马来西亚 / 新加坡触点
          values:
            - 实际市场存在感中等
            - 国家层面复购弱
            - 中 — 存在证据不错，队列证据弱
    approximationNotes: 矩阵把存在性证据和耐久性证据拆开。公开触点强力证明客户触达和产品使用，但不能证明持续的队列经济性。
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU021
      - CU022
      - CU027
      - CU035
      - CU041
      - CU046
      - CU048
      - CU052
  - id: FU004
    title: 类 NPS 公开情绪视角
