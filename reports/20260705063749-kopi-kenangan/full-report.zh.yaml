      - number: '7.5'
        title: 治理、国际扩张和退出 / 流动性风险
        blocks:
          - type: paragraph
            body: >-
              公开记录现在显示，这家公司懂治理话语，但仍要求投资人自己补上私营公司披露缺口。IDNFinancials 在这里有价值，因为它记录了管理层自己的复盘：早期融资过多，催生了太多副线项目；2025 年扭亏前，2022
              年亏损扩大。Kontan、Forbes 和 IDN Times 在 2026 年后续报道中称，公司希望达到 IPO
              就绪状态，正在收紧控制、借助四大审计支持、加快报告周期，并改善法务和税务纪律。但管理层仍未承诺上市日期、交易所或申报时间表；留存的 2026
              年来源也没有披露招股书、董事会构成、分市场盈利能力或二级流动性结构。国际上，增长计划也更依赖执行。Forbes
              称，新加坡、马来西亚和印度主要是自营，菲律宾和澳大利亚是加盟市场；新加坡加盟页面也在主动获取新加盟商线索。这种组合扩大了触达，但也提高了加盟商质量漂移、跨境合规，以及退出论证晚于标题增长或以更低倍数落地的剩余风险。
