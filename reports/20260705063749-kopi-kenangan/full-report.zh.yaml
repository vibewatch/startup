      - number: '7.3'
        title: 竞争饱和、平台依赖和品牌疲劳风险
        blocks:
          - type: paragraph
            body: >-
              公开增长证据确实存在，但经营模型对渠道和形态集中度的暴露异常高。Forbes 称，Kopi Kenangan 到 2025 年底在印尼有 1,136 家门店、海外 188 家门店，85%
              门店是即取即走小店；App 已成为最大增长来源，并贡献接近一半销售。公司的下载页也强化了这种设计选择：App
              围绕自提或配送、会员和免排队构建。规模可以是优势，但也让发现、排序和履约摩擦更重要。本轮抓取的门店定位器显示多个 Grab Kitchen
              点位，说明部分流量已经由第三方节点中介，而不是完全来自自有门店入口。与此同时，竞争场也很拥挤。Forbes 点名 Janji Jiwa、Fore、Tomoro、Lain Hati、Zus、Cafe
              Amazon、Highlands、Compose，以及未来 Luckin 压力；同一篇报道也承认，若干品牌延展和低价实验没跑通后已经停止。正是这种组合，让品牌疲劳和新店产出下降不再只是理论风险。
