      - number: '1.4'
        title: 规模、国际扩张、里程碑与警示信号
        blocks:
          - type: paragraph
            body: >-
              到 2025-2026 年，公司的规模叙事已经从单纯门店数转向运营系统广度。IDNFinancials 报道称，Kopi Kenangan 2025 年底在六个国家拥有 1,324 家门店，全年新增 4.47
              million 名数字客户，月交易数字用户 1.5 million，收入 $184 million，净利润 $17 million——这是集团层面首个全年盈利。Forbes 2026
              年封面故事大体支持同一拐点，描述印尼 1,136 家门店、海外 188 家，并计划到 2030 年达到 4,000
              家门店。国际扩张已不再只是马来西亚和新加坡：新加坡、马来西亚和印度的官方消费者网站已经上线，RLI 称首家印度门店在德里开业且短期目标为 50 家，管理层也讨论过 2026
              年进一步进入新市场。主要警示在于，快速多元化曾经伤害盈利能力。World Coffee Portal 和 IDNFinancials
              都称，管理层承认此前向过多副线业务过度扩张，之后重新聚焦核心连锁。大型版图、利润改善和近期自我纠偏放在一起，才是后续尽调章节应采用的正确框架。
