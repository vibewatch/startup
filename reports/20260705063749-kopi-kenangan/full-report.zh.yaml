        - 菜单存在，但实际连带率未披露
        - 官方 App 页面显示这些品牌已嵌入下单界面
        - 如果连带率高，可拉高客单价，但连带率未知
        - 按门店队列提供品类结构和连带率
      - - RTD 瓶装咖啡
        - 门店外销售的瓶装产品，满足日常便利消费
        - 官方 RTD 产品线已上线并获 BPOM 认证
