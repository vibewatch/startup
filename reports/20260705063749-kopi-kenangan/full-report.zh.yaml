      - number: '4.2'
        title: 定价、直接渠道与单店经济
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan 的公开价格锚点支撑了可信的大众精品定位。Forbes 报道，印尼旗舰产品 Kopi Kenangan Mantan 售价 IDR22,000，美式为
              IDR20,000；Kenangan Coffee Malaysia 目前列出 Kenangan Latte 为 RM11.90，美式为
              RM9.90。这些价格足以让品牌远离超低价街头咖啡竞争，同时仍低于印尼的全球连锁定价。定价系统也并非纯粹依靠标价。Kenangan VIP 和 Kenangan Points
              实际上把直接渠道频次转化为实现折扣，因为积分像返现一样使用，高消费等级解锁更多权益。Big Order 又通过最高 20% 的活动套餐折扣引入更多价格分散。


              因此，最佳公开单店经济视角来自反推，而不是直接披露。用报道的 2025 年收入和门店数计算，集团收入意味着每店每年约 US$139,000，或每店每天约
              US$381。用印尼收入和门店数计算，隐含本地单店日销售代理值约 IDR5.55 million。再除以公开饮品价格锚点，印尼吞吐量落在每店每日约 252 至 277 张饮品等价小票，不含食品组合、即饮或 B2B
              订单。对以小店为主的连锁来说，这看起来合理，但承销缺口很大：公开来源仍未披露实际毛利率、客篮组合、App 与聚合器拆分，或佣金拖累。Luckin 和 Dutch Bros 的可比披露正说明这些缺口为什么重要。
