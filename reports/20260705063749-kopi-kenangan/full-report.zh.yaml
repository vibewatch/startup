      - number: '5.2'
        title: App 点单、会员与数字界面
        blocks:
          - type: paragraph
            body: >-
              消费者 App 是真实运营界面，不只是营销外壳。公开应用商店文案显示，App
              支持提前下单自提、外卖、门店发现、无现金支付、单品级定制、实时状态通知，以及压缩店内排队时间的取餐区流程。会员体系深度嵌入：Hearts 或 Kenangan Points 通过 App 内订单或收银台 QR
              扫码累积，解锁多个会员等级，并与优惠券、生日权益和新品抢先体验捆绑。AppBrain 和 Apple 元数据表明，App 到 2026 年 6 月底仍在活跃维护；Android
              遥测则暗示已安装用户基数很大。产品质量层面的警示是，公开评论界面仍能看到边缘场景投诉。独立评论提到门店选择崩溃、缺货订单退款转积分处理，以及对会员政策变化的不满。这并不否定数字界面的强度，但说明如果 App
