chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan 是诞生于雅加达、靠技术驱动的即买即走咖啡连锁，2017 年由 Edward Tirtanata、James Prananto 和 Cynthia Chaerunnisa
              创立。多份官方与媒体信息对创立命题的说法一致：印尼有便宜的速溶咖啡，也有昂贵的全球咖啡馆连锁，但缺少一个把本地风味与可负担价格结合起来、又能规模化的中间层。这个定位至今仍是品牌锚点。公司官网将使命表述为把印尼咖啡从印尼带向亚洲其他地区，而消费者端界面强调
              App 点单、自提、外卖和现代印尼风味，不主打长时间停留的咖啡馆氛围。公开办公信息显示，主办公室位于南雅加达 Plaza Blok
              M；同一批官方页面还列出新加坡和马来西亚办公室，说明业务组织从一开始就面向区域运营，而不只是国内零售。相较后续媒体报道，官方运营口径仍偏保守——印尼 45 个城市超过 800 家门店、超过 5,000
              名员工——但这些信息已经足以证明，这是一家规模可观、定位清晰的全国性平价精品品牌。
