    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 隐私或消费者保护失效
        - 监管机构正式调查、促销不匹配投诉反复出现，或重大投诉激增
        - 任何处罚、数据事件，或跨市场反复出现且未解决的促销 / 退款问题
        - 在受影响渠道或市场暂停扩张，直到控制和披露改善。
      - - 大宗商品与汇率挤压
        - 咖啡基准价、印尼盾走势、毛利率趋势
        - 咖啡价格高于 ~350 USd/lb，或毛利率连续两个季度压缩且没有靠提价修复
        - 重设开店节奏，并要求逐市场提供利润率桥接。
      - - 平台 / App 依赖承压
        - 取消率、App 转化、配送费负担、退款未结天数
        - 转化持续下滑，或退款积压超过一个账期
        - 把获客重心从付费平台依赖中拉回来，并收紧服务补救。
      - - 质量控制恶化
        - 审计未通过、投诉复发或门店级产品不一致
        - 某一市场或业态集中出现卫生或一致性问题
        - 冻结受影响集群的新开店，直到审计通过率恢复。
      - - 退出 / 流动性未达预期
        - IPO 里程碑、经审计报表、交易所选择和董事会准备度
        - 治理准备之后仍无清晰申报路径，或市场经济性明显恶化
        - 在披露追上前，按更长持有期和更低倍数承销。
    notes: 阈值是可监测启发式标准，用来把宽泛风险讨论转化为可投资的否决标准。
