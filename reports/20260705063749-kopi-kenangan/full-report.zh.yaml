companyProfile:
  summary: >-
    Kopi Kenangan 是一家总部位于雅加达、靠技术驱动的即买即走咖啡连锁，2017 年由 Edward Tirtanata、James Prananto 和 Cynthia Chaerunnisa
    创立。公司切出低价街头咖啡与高端全球连锁之间的中间层咖啡定位，再靠 App 点单、自提、外卖、会员体系、即饮延伸，以及高密度小店网络放大。2025 年公开报道显示，公司在六个国家拥有 1,324 家门店，收入约 $184
    million，并首次实现集团全年盈利，使 Kopi Kenangan 成为东南亚最具规模的新零售餐饮平台之一。
