      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              即使经历了风投驱动的规模化，领导层仍以创始人为核心。Edward Tirtanata 在公开资料中始终是联合创始人兼 CEO；CNBC 和 Northeastern
              都把他写成这条连锁在即买即走经济模型、技术采用和长期国际化野心背后的战略推动者。他此前在 Lewis & Carroll Tea 的经历，以及金融与会计训练，解释了为什么 Kopi Kenangan
              选择品牌驱动的消费模型，同时比许多区域初创更强调资本纪律。James Prananto 仍公开绑定创始团队，Forbes 2026 年人物报道称其为董事；印尼人物报道也把他与 Kopi Kenangan
              之前的金融和营销经历联系起来。Cynthia Chaerunnisa
              仍是三位创始人之一，但公开来源在不同时间对其职责描述不一——营销负责人、董事，以及类似董事长的治理表述——因此尽调应把她当前的具体职责视为部分不透明，而不是假设已有一个稳定头衔。官方领导层页面还列出 CTO
              Zeng Fengping 与集团首席人力和文化官 Gemini Aryanto，但完整董事会名单和委员会结构并未公开披露。
