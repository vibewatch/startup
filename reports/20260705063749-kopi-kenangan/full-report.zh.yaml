  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入规模与渠道结构
        blocks:
          - type: paragraph
            body: >-
              公开报道已经足以证明，Kopi Kenangan 具有商业分量，不只是愿景叙事。多家 2026 年来源指向 2025 年收入约 US$184 million、集团首个全年利润 US$17
              million，以及六个国家 1,324 家门店。印尼仍是锚定市场，拥有 1,136 家门店、约 15% 同店销售增长和 2025 年 IDR2.3 trillion 收入。管理层还告诉 Forbes，约 75%
              销售仍来自印尼，约 15% 来自马来西亚，因此集团规模仍建立在本土市场上，而不是未经验证的海外地区。


              收入模型已经不只是单一小店饮品线。公开公司界面显示，公司通过自有 App 支持自提或外卖点单，通过其他 Kenangan 品牌做食品交叉销售，销售瓶装即饮咖啡，并提供企业 / 活动订购渠道。App
              在经济性上重要，因为它不只是会员外壳：Forbes 称 App 接近销售额一半，IDNFinancials 称月交易数字用户到 2025 年 12 月约达 1.5
              million。因此关键财务问题不再是“有没有需求？”，而是“促销、渠道和成本漏损之后，有多少总需求能转化为持久现金生成？”
