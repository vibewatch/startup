      - number: '7.2'
        title: 大宗原料、外汇和依赖风险
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan 的规模不能消除原料风险，反而会放大。Forbes 报道，截至 2026 年 1 月的两年里，基准阿拉比卡期货几乎翻倍，3 月下旬仍比 2024 年 1 月高出 50%
              以上；Trading Economics 也显示，2026 年 7 月初，咖啡价格在一个月上涨 22% 后仍高于每磅 300
              美分。公司的定位让这种暴露贴着核心卖点：海外营销强调印尼咖啡产地和印尼棕榈糖，新加坡网站也称咖啡来自印尼多个地区。与此同时，宏观环境又加了一道挤压。Bank Indonesia 和 Tempo
              都显示，印尼盾环境仍需要干预，且 2026 年平均汇率假设偏弱；Forbes 称，随着海外占比上升，马来西亚已贡献约 15%
              销售。因此，依赖风险贯穿成本和折算两端：咖啡、棕榈糖、包装、进口设备和多币种收入，都可能在任何消费端涨价完全传导之前先反向移动。
