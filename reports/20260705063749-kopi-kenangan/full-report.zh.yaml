  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Kopi Kenangan 介于街头咖啡、高端咖啡馆和多渠道便利之间
        blocks:
          - type: paragraph
            body: >-
              不应把 Kopi Kenangan
              放在整个印尼餐饮支出、甚至全国所有咖啡销售额里承销。它自己的定位更具体。公司页面称其为一家使用高品质本地原料的即买即走咖啡连锁，独角兽融资公告则说公司诞生是为填补昂贵国际连锁与速溶或街头咖啡之间的空白。这个定义指向现代现制咖啡场景：消费者为便利、稳定性和品牌体验买单。官方渠道页面把支出池稍微拉宽：公司运营会员计划，推广企业和活动订单，销售即饮瓶装咖啡，并在
              GrabFood 上保持活跃的外卖入口。这些邻近场景重要，因为它们把同一消费者关系延展到
              App、门店、外卖、办公室和居家场景。但同一逻辑也排除了大部分餐厅总支出、大宗商品出口价值和无品牌路边咖啡，因为这些池子无法干净转化为品牌杯装经济模型或连锁估值倍数。
