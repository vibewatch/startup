            body: >-
              Kopi Kenangan 的竞争主张仍取决于站在印尼饮品阶梯中间：明显比速溶咖啡或 warung 消费更高端，但仍远低于 Starbucks。Forbes 留存的价格快照显示，Kopi Kenangan
              Mantan 为 Rp22,000，美式为 Rp20,000；Fore 公开菜单列出冰美式 Rp23,000、Manuka Americano Rp29,000，说明本地挑战者在入门定价上贴得很近。Janji
              Jiwa 自身品牌语言也指向同一方向，强调植根本地口味、价格可及的即买即走咖啡，而不是堂食咖啡馆仪式。Tomoro 公开信息强调品质和 100%
              Arabica，但留存材料中的公开标价不足以证明其拥有差异化经济带。Starbucks 仍是高端锚点，Mixue
              的低价茶饮和冰淇淋逻辑又进一步拉宽下方伞面。结果是，市场里业态和便利性往往比独特饮品配方更重要，因为多个品牌已经挤在同一平价精品价格带。
