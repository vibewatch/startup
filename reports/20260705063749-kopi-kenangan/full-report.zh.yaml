  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私和许可风险
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan 披露的法律暴露面已经不像小型初创公司：印尼法律页面公开了贸易部消费者投诉联系方式，App
              隐私政策很长且写得具体，新加坡加盟隐私通知也足够细，能看出海外加盟扩张已经落到执行层。这能缓释风险，但也摊开了风险地图。印尼政策称，App
              和相关品牌网站会收集身份、支付、设备、已安装应用、位置、交易和会员数据；同一政策允许在集团公司、服务商、商业伙伴和主管机关之间共享，同时承认没有任何传输或存储方式绝对安全。实体产品层面的监管压力也在上升。印尼
              2026 年合规栈正把清真、BPOM 标签和可追溯要求压到一起；官方 OSS
              门户确认，海外特许人扩张仍处在登记制度内，并非纯商业铺店。投资人今天面对的不是已知执法案件，而是法律、数据治理和加盟合规负担能否跟上门店网络和 App 使用量的扩张速度。
