            body: >-
              最具体的公开客户证明不是精美企业标识墙，而是 App 评论和投诉论坛里的用户原声。AppBrain 评论片段显示真实产品使用，也能看到用户确实喜欢简洁
              UI、折扣和易用性；但这些评论也暴露体验裂缝：手动选择门店时崩溃、缺货订单退款转积分处理，以及对外卖费的不满。Media Konsumen
              通过多年投诉记录扩大了反向图景，内容涉及促销条款、错品、自提和支付问题、退款延迟。这些摩擦重要，因为它们与渠道结构交叉。Kopi Kenangan 明显入驻
