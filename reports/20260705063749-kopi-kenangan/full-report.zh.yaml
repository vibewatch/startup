  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：业务已跑通，但传闻中的私募估值已经计入溢价
        blocks:
          - type: paragraph
            body: >-
              Kopi Kenangan 已经越过概念阶段，成为真正的经营型公司。公开报道现在指向 2025 年集团层面首个全年盈利、约 US$184 million 收入，以及横跨六国的 1,324
              家门店网络。这很重要，因为公司不再只能靠愿景式铺店或手机下载动能来估值；它已经有真实销售、重要数字渠道，也有证据显示海外业务能从启动期亏损走向 EBITDA 转正。


              估值问题更难。当前最显眼的价格信号不是已定价的一级融资，而是 2025 年早期二级出售探索，可能把公司估在 US$1.2 billion 至 US$1.4 billion。这个区间高于 2021
              年独角兽标记，方向上令人鼓舞，但它不等于已完成的出清价格；而且在投资人看到 2025
              年经审计报表、优先权结构或任何要约的确切条款之前就已出现。因此，本章判断应是跟踪：业务强到值得继续推进，但在传闻二级区间上，还不够便宜，也不够透明，不能写成买入案。
