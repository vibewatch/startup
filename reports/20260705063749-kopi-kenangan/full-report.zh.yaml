        - 按渠道索取 AOV、优惠率和优惠后留存
      - - VAT 和更广泛运营成本传导
        - 负向 / 混合
        - 当前
        - 税负可管理，但在价格敏感市场，菜单工程仍会受影响
        - 用不同有效 VAT 和人工成本情景测试毛利敏感性
      - - 资本强度和开店拥挤
        - 负向
        - 当前至中期
        - 现代连锁扩张仍会消耗可观 capex，并提高局部饱和风险
        - 对比同业新店回本期、关店率和自我蚕食
    notes: 扩大市场的同一组力量，也决定连锁能否守住利润率并收回开店投入。需求增长本身不等于有吸引力的价值捕获。
