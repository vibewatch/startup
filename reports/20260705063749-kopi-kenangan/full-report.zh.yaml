      - number: '3.3'
        title: App、会员与分销权力
        blocks:
          - type: paragraph
            body: >-
              更尖锐的竞争战场如今发生在复购层，而不只是咖啡产地叙事。Kopi Kenangan 的 App 集成自提、外卖、返现积分、优惠券、生日饮品和新品优先购买权，把品牌从一个小店网络变成习惯回路。Janji Jiwa
              的 JIWA+ 页面显示了非常相似的工具箱：积分、提前下单、自提、多种电子钱包和每日优惠券，意味着直接本地竞争已经围绕自有 App 留存趋同。Starbucks Indonesia
              在正式会员机制上仍最强，有清晰的星级阶梯和 Gold 门槛，但这种强项服务的是更窄的高端用户群。Fore 的杠杆来源不同：它深度接入 GrabFood、GoFood、ShopeeFood、Citilink 和
              BCA Digital，同时仍保持直接运营控制。Mixue 和 Flash 更像渠道或加盟机器，而不是深度会员生态。对 Kopi Kenangan
              来说，护城河问题不再是谁能冲奶咖，而是谁能以可接受的获客成本拿下未来十单。
