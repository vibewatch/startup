      - - 全部公开可比公司中位数
        - US$184m FY2025 收入
        - 4.5x
        - US$0.83b
        - 在咖啡和配送需求可比公司中，最站得住脚的公开市场锚。
      - - 基础承销桥
        - US$220m 2026 收入
        - 5.0x
        - US$1.10b
        - 需要持续增长，并较公开市场中位数有小幅溢价。
      - - 已报道二级交易中点
        - US$200m 年化收入
        - 6.5x
        - US$1.30b
        - 尽管披露有限，已经假设类似 Dutch Bros 的稀缺性溢价。
      - - 牛市执行桥
        - US$250m 2026 收入
        - 6.0x
        - US$1.50b
        - 需要持续扩张、利润率稳定，以及更友好的退出市场。
    notes: 每行都是作者估算，基于公开报道收入基数和观察到的公开市场倍数。
    claimRefs:
      - CV016
      - CV022
      - CV035
      - CV036
      - CV042
      - CV047
  - id: TV006
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 2026 年收入约达 US$250m，马来西亚和新市场持续改善，买家仍给予咖啡增长资产溢价倍数。
        - 按约 6x 收入，估值可接近 US$1.5b，并支撑当前二级市场传闻区间上沿。
        - 需要持续扩张且不稀释利润率，退出市场情绪也要改善。
        - 低-中
      - - 基准
        - 收入落在 US$220m 左右且盈利能力守住，但市场只较公开市场中位数支付小幅溢价。
        - 按约 5x 收入，估值约 US$1.1b，低于已报道的 US$1.2b-US$1.4b 区间。
        - 即便执行不错，仍可能跑不赢倍数正常化和披露折价。
        - 中
      - - 熊市
        - 收入维持在接近 US$200m 年化收入节奏，但退出受限下，投资者用公开市场式的克制倍数定价。
        - 按约 4x 收入，估值下探至 US$0.8b 附近。
        - 不需要需求崩盘；单是倍数下调就能压出下行情景。
        - 中-高
    notes: 这些是情景输出，不是管理层指引或正式公允价值意见。
