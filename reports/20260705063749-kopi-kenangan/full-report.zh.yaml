      - number: '2.3'
        title: 买方与价格架构：平价精品是品类重心
        blocks:
          - type: paragraph
            body: >-
              印尼现代咖啡的买方分层由场景驱动。USDA 区分了仍偏好廉价街头咖啡的低收入和中等收入买家，以及包括 Gen Z 在内的更高端门店用户；GoodStats 则显示咖啡已经进入主流，报告每日饮用比例
              72%，Kopi Kenangan 品牌知晓率 97%。因此价格架构很关键。公开菜单追踪器显示，Kopi Kenangan 和 Tomoro 的美式约 Rp20,000，核心拿铁类饮品约
              Rp24,000-Rp26,000；Fore 聚集在类似的平价精品价格带，Starbucks 同类咖啡则明显更高，约
              Rp42,000-Rp65,000。因此，这个品类更像高频、可防守的小确幸消费，而不是奢侈咖啡。渠道页面强化了这一模式：Kopi Kenangan 通过 VIP 等级推动复购，通过 GrabFood
              捕捉外卖，并用大订单折扣触达办公室和活动预算。这张买方图谱意味着，采用率由便利性和习惯频次主导，不只是纯粹的饮品向往。
