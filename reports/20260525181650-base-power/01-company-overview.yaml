  - id: funding-and-investors
    title: Funding History and Investors
    body: >
      Base Power has raised approximately $1.3 billion across three disclosed rounds since its founding in 2023.
      A seed / Series A phase provided initial working capital; specifics were not publicly disclosed. The
      company's first large disclosed round, a $200 million Series B, closed in April 2025, with Thrive Capital,
      Valor Equity Partners, Andreessen Horowitz (a16z), Lightspeed Venture Partners, Altimeter Capital, and
      Trust Ventures among the lead participants. Lennar, the homebuilder, also invested during this period.

      Six months later, in October 2025, Base Power announced a $1 billion Series C led by New York firm
      Addition. Returning investors included Andreessen Horowitz, Lightspeed, Thrive Capital, Valor Equity
      Partners, and Altimeter. New investors included CapitalG (Google's independent growth fund), Ribbit
      Capital, Lowercarbon Capital, Elad Gil, Spark Capital, BOND, StepStone Group, 137 Ventures, and
      Salesforce Ventures. The round was reported by The New York Times as valuing the company at $3 billion
      pre-money; post-money valuation is approximately $4 billion. The Series C was described by Dallas
      Innovates as "one of the largest Series C rounds of the year."

      Total raised stands at approximately $1.3 billion. The capital is being deployed toward domestic battery
      manufacturing at the Austin factory, team scaling, and state-by-state expansion beyond Texas. No secondary
      transactions or convertible debt arrangements have been publicly disclosed; these remain diligence gaps.
