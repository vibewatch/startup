company:
  name: Base Power

chapter:
  number: 1
  title: Company Overview
  summary: >
    Base Power is an Austin-based "gentailer" founded in August 2023 by Zach Dell and Justin Lopas that installs
    company-owned residential batteries, operates them as a virtual power plant (VPP) within ERCOT's deregulated
    market, and participates in the state's Aggregated Distributed Energy Resource (ADER) pilot to generate grid-
    services revenue. In under three years the company deployed more than 100 MWh of residential storage, raised
    $1.3 B across three rounds (Series B $200 M in April 2025; Series C $1 B in October 2025 at a ~$4 B post-money
    valuation), and secured partnerships with Lennar, GVEC, Farmers Electric, and CoServ. A manufacturing factory
    at the former Austin American-Statesman site began commissioning in late 2025.

sections:
  - id: identity-and-model
    title: Identity and Business Model
    body: >
      Base Power Company was incorporated in 2023 and is headquartered at 305 S. Congress Avenue, Austin, Texas.
      The company operates as a licensed Retail Electricity Provider (REP) in Texas's deregulated ERCOT market
      and self-describes as the first vertically integrated distributed energy platform of its kind in the United
      States. Its commercial website is basepowercompany.com.

      The business model—sometimes called a "gentailer" structure—combines hardware ownership, retail electricity
      supply, software operations, and wholesale grid trading under a single roof. Base installs either a 25 kWh
      (Gen 1: 11.4 kW continuous power) or 50 kWh battery system at a homeowner's residence for a one-time
      installation fee of $595–$995, retains ownership of the battery, charges a monthly membership of $19–$29,
      and becomes the homeowner's electricity supplier at a fixed rate of approximately 8.0–8.5 ¢/kWh (plus
      pass-through delivery). The company keeps battery backup power available for outages while simultaneously
      cycling the battery to exploit ERCOT wholesale price spreads—buying cheap overnight power, discharging to
      homes and the grid during morning or evening peaks. Customers commit to a three-year electricity contract.
      Approximately half of Base customers have rooftop solar; Base compensates them at real-time wholesale
      prices plus 3 ¢/kWh for any power sold back.

      The company targets Texas first because roughly 85% of Texans live in deregulated electricity territories
      where a retailer can sign up customers directly. Texas's wholesale prices are among the most volatile in
      North America, providing wide arbitrage windows. In regulated markets (other states), Base plans to expand
      through utility partnership deals rather than direct-to-consumer REP relationships. As of May 2026 the
      company serves more than 10,000 homes across the Dallas-Fort Worth, Houston, and Austin metro areas plus
      Williamson and Bell Counties.
