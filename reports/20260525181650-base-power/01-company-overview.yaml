  - id: risks-and-adverse
    title: Adverse Considerations and Key Risks
    body: >
      Independent reviews and analyst commentary surface several material risks. Most prominently, Base Power's
      customer contracts give the company the legal right to discharge batteries to as low as 20% state of charge
      in order to sell power back to the grid during high-demand periods. In practice, this means a homeowner
      who relies on the battery for outage protection may find only a partial charge available at the moment
      the grid fails—precisely the high-demand scenario most likely to produce outages. Epic Electrical, a DFW
      contractor that reviewed Base's terms in detail, described this as the "one thing most people miss" and
      advised homeowners seeking true whole-home protection to pair the Base battery with a supplemental
      generator and interlock kit ($300–$700).

      Unit-economics sustainability is a second concern. An independent analysis in Green Car Future modeled
      per-unit revenue at roughly $2,075 annually for a 25 kWh system, implying an eight-to-nine-year simple
      payback at current pricing—acceptable only if battery cycling assumptions hold, ERCOT market volatility
      persists, and capital costs do not rise. The analyst noted that >100 employees at ~$150,000 loaded cost
      implies $15 M+ per year in labor overhead not captured in unit-level math. Revenue projections depend
      heavily on volatile ERCOT ancillary-services and energy-arbitrage revenues that may compress as more
      distributed storage enters the market.

      Tariff and supply-chain exposure is a third risk: CNBC reported in April 2025 that Base Power's batteries
      were manufactured in China and that the company anticipated material impact from U.S. tariffs. The
      domestic factory is explicitly intended to address this, but manufacturing ramp timelines remain unverified
      by independent sources.

      Finally, Base operates under an ERCOT ADER pilot that is subject to PUCT regulatory review; the program's
      market caps (160 MW energy, 80 MW non-spin/ECRS) and eligibility rules could be tightened, amended, or
      ended by commission order. No lawsuits, sanctions, or consumer protection enforcement actions against
      Base Power were identified in this research cycle.
    claimRefs:
