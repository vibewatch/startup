  - id: milestones-and-traction
    title: Milestones, Traction, and Scale
    body: >
      Base Power achieved notable scale remarkably quickly. From founding in August 2023 the company moved to
      first deployments within the same year, secured a Hill Country utility partnership (Bandera Electric
      Cooperative) as its first utility deal in early 2024, and announced the landmark Lennar homebuilder
      partnership in December 2024, piloting in communities Firefly Pointe (Hutto), Rancho del Cielo (Jarrell),
      and Rancho Canyon (Haslet). By April 2025 it had closed the $200 M Series B and was deploying batteries
      at a pace described as "up to 20 batteries per day." Expansion into Dallas-Fort Worth proper was completed
      in August 2025; the company opened a warehouse and office in Grapevine covering Fort Worth, Arlington,
      Plano, and Irving.

      During the summer of 2025 Base qualified for ERCOT's Aggregated Distributed Energy Resource (ADER) pilot
      program—which formally allows distributed batteries to be pooled and bid into the wholesale market as a
      single dispatchable resource. The company expected to become the ADER program's largest contributor by
      fall 2025. The Series C and factory announcement came in October 2025; the factory at the former Austin
      American-Statesman press building began conversion to an energy storage and power electronics manufacturing
      line, with full commissioning targeted for early 2026.

      Subsequent utility partnership announcements arrived in rapid succession: GVEC (Guadalupe Valley Electric
      Cooperative) launched a utility-managed fleet in June 2025; Farmers Electric Cooperative signed in
      December 2025 targeting 20 MW of residential deployment; El Paso Electric Company (EPE) pilot announced
      in February 2026 for up to 10 MW ahead of summer peak; and CoServ (Denton County Electric Cooperative)
      signed a 100 MW agreement announced in March 2026—Base's largest deal to date and described as one of
      the largest distributed storage programs in Texas. Customer count surpassed 10,000 homes and total
      deployed capacity exceeded 100 MWh by mid-2025. Projected revenue for 2026 is approximately $70 million.
