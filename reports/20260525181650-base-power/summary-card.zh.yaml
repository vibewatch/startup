summary:
  headline: Base Power 的住宅电池 + 零售电力模式有差异化，在 Texas 也已跑出真实早期进展；但最新 $4B 估值已经计入 ERCOT 经济性长期稳定和多州复制成功，公开证据还没有证明这两点。
