      - number: '5.2'
        title: 安装流程与部署运营
        blocks:
          - type: paragraph
            body: >
              Base Power 的部署运营被组织成一座“Deployment Factory”——一套可重复的内部流程，面向各个 AHJ（authority having jurisdiction）辖区协调许可、
              物流、排期和电气安装。流程从虚拟现场勘查开始，评估配电箱配置、可用户外空间和 HVAC 负荷；拥有多个主配电箱或配置异常的物业可能被拒绝。 合格住宅由 Base 自有电工团队安排安装；截至 2025 年 10
              月，这些团队每天完成约 20 套系统，是 2025 年 3 月速度的两倍。公司宣称， 在已开通都市区每年可部署 1–2% 的独栋住宅；按每次部署平均 20 kW 计算，Base 理论上可在拥有 500,000+
              独栋住宅的市场 （规模接近 Denver、Charlotte 或 San Diego）一年内达到 100 MW 容量。这比传统公用事业级并网时间线快 10x。

              对 Lennar 等住宅开发商渠道伙伴，Base 把电池安装直接嵌入建房流程，让电池从第一天起就成为住宅电气系统的一部分——避开标准渠道中的改造许可摩擦。 截至 2025 年 4 月，Base 服务约 20 个
              Lennar 社区，覆盖易停电的 Texas 市场。协议期内，服务和维护均由 Base Power 负责； 业主不能控制电池，也不能把第三方电池或储能系统（例如 Tesla Powerwall、Enphase
              IQ Battery）接入托管机群。

              2026 年 3 月签署的 CoServ 100 MW 项目，是 Base 迄今最大项目，代表约 5,000 次部署，平均每户两台电池（50 kWh）。El Paso Electric DESPP 试点
              （2026 年 2 月）采用“表前（front-of-meter）”拓扑，Base 电池接在电表的公用事业侧，而不是表后；这让 EPE 可在峰值需求期间直接同时服务住宅和电网， 结构上不同于 Base
              标准的表后模式。
