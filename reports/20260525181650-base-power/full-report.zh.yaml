      - number: '2.3'
        title: 买方与细分市场图谱
        blocks:
          - type: paragraph
            body: >-
              Base Power 的市场存在三类清晰的买方—用户—付款方关系，每类都有不同采用触发点和预算归属。

              第一类也是主要细分，是 Texas 放松管制 ERCOT 市场中的住宅房主。该客户同时是用户（获得停电保护和账单平滑）和付款方（在 PowerToChoose.org
              上选择不同零售电力供应商）。采用触发点是停电焦虑——Winter Storm Uri（2021）和反复出现的夏季高峰加重了这种焦虑——叠加电费波动。2026 年初，Texas 平均住宅账单达到 $174/月，电价
              15.41 cents/kWh，同比上涨 6.4%。面向这一群体，Base Power 的 $19–$29/月订阅加一次性安装费（$695–$995）被定位成同时对冲停电和夏季高账单的保险产品。

              第二类是与 Base Power 合作部署公用事业控制住宅 BESS
              的电力公用事业或合作社。在这里，付款方是公用事业（获得延后容量投资价值），用户是房主（获得备用电），买方决策者是负责资源规划的公用事业高管。采用由负荷增长、基础设施约束和 ERCOT
              夏季可靠性要求触发。CoServ（330,000+ 电表，North Texas）和 El Paso Electric（465,000 客户）代表这一细分；El Paso Electric 10 MW 试点和
              CoServ 100 MW 项目是目前运行中的两个最大案例。该细分的预算所有者是公用事业资本规划团队，经济逻辑是用容量延后替代新建发电或输电投资。

              第三类仍处早期，是 Lennar
              等房屋建造商，他们希望在新房中提供具备电网韧性的住宅，作为差异化卖点。在这里，建造商充当分销渠道伙伴，房主是最终用户和长期付款方，采用触发点是住宅销售市场中的竞争差异化。该渠道降低 Base Power
              获客成本，并扩大地理覆盖。
