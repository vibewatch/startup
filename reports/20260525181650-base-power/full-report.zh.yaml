        - 增长驱动
        - 当前（至 2032 年）
        - 有效硬件成本降低约 30%；改善电池部署单位经济模型
        - 确认 IRA 抵免适用于 Base Power 所有权 / 订阅模式还是仅适用于房主持有模式
      - - ERCOT ADER 试点扩容（第 3 阶段，160/80/80 MW 上限）
        - 增长驱动
        - 当前（第 3 阶段于 2025 年中启动）
        - 为 Base Power 聚合电池群打开更大的 ERCOT 批发收入池
        - 跟踪 PUCT 关于永久 ADER 规则取代试点的规则制定进展；存在时间风险
      - - 德州人口和负荷增长（数据中心、电气化）
        - 增长驱动
        - 当前且在加速
        - 提高公用事业公司对 DER 容量替代方案的需求；强化 Base Power 公用事业合作管线
        - 核验 Base Power 在当前五家德州合作社之外的公用事业合作管线
      - - 电池成本下降（2025 年约 $117/kWh，较 2023 年低约 67%）
        - 增长驱动
        - 当前且仍在持续
        - 降低单次安装硬件资本开支；扩大可覆盖的房主收入带
        - 评估 Base Power 电池采购协议和成本曲线；进口电芯关税风险
      - - ERCOT 电网级 BESS 收入压缩（辅助服务收入 2023–2025 年下降约 90%）
        - 采用约束（反向）
        - 当前；部分为结构性
        - 可用于抵消客户订阅价格的电网服务收入减少；利润率承压
        - 建模 2026 年夏季 ERCOT 未出现重大稀缺事件的下行情景
      - - 2021 年 Uri 之后的停电风险和德州电网可靠性焦虑
        - 增长驱动
        - 持续存在；每次夏季峰值或冬季事件都会放大
        - 房主细分市场的主要需求拉力；自然口碑渠道强
        - 跟踪市场成熟后的获客成本，以及自然与付费获客占比
      - - IRA 政策不确定性（电芯关税、ITC 可能回撤）
        - 采用约束
        - 近期风险（2025–2026 年联邦政策行动）
        - SEIA 指出，新联邦政策给德州计划中的太阳能 / 储能容量带来“严重风险”
        - 评估 Base Power 本土制造（Austin 工厂）作为关税对冲的效果；时间表和规模
      - - 房主切换成本与注册摩擦
        - 采用约束
        - 持续存在
        - 降低自然流失风险，但也拖慢首次注册转化
        - 查看取消率和合约期限；多年锁定为客户终身价值（LTV）提供下限
      - - ERCOT ADER 遥测和互操作要求（2 秒遥测要求）
        - 采用约束
        - 当前
