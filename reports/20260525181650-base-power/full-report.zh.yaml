      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景分析
        blocks:
          - type: paragraph
            body: >
              情景框架以 2027 年收入作为主要估值驱动，并用上市和私营可比公司校准退出倍数。概率权重为：乐观 20%、基准 45%、悲观 35%——考虑到执行依赖的数量和 ERCOT
              电网服务经济性的结构性逆风，权重偏向基准 / 悲观。

              乐观情景下，Base Power 通过扩张到另外三个放松管制市场（例如 PJM/Pennsylvania、Illinois、New York），以 $5,000 净成本部署 Gen 3 电池（较 Gen 1 降低
              40%），并在 2025 年 12 月 RTC+B 计划带来新优化机会后，将 ERCOT 电网服务收入维持在 $50/kW/year 以上，从而在 2027 年实现 $250M 收入。按 20–25×
              远期收入倍数，隐含退出估值为 $5–6.25B。对 Series C 投资人而言，这只是温和正回报（相对 $4B 投后为
              1.25–1.56×），凸显即使乐观情景，也无法让后期投资人在当前入场价格获得风险投资级回报。

              基准情景下，Base Power 2027 年收入达到 $100–130M，主要来自德州扩张加一个新市场；Gen 3 电池以 $7,000–8,000 净成本部署，制造改善逐步体现；ERCOT 电网服务收入稳定在
              $35–45/kW/year（与 Modo Energy 和 GreenCarFuture 预测一致）。按 15–20× 远期收入倍数，隐含退出估值为 $1.5–2.6B——低于当前 $4B Series C
              标记，说明若没有由规模或战略收购方溢价带来的显著倍数重估，当前价格在基准情景下无法自洽。

              悲观情景下，RTC+B 计划未能有效抵消持续容量饱和，ERCOT 电池收入进一步降至 $15–20/kW/year；Gen 3 工厂延迟，全国扩张又受非 ERCOT 市场监管复杂性限制。2027 年收入停在
              $30–50M，Base 要么降价融资，要么面临运营压力。按 $40M 基数的 10× 远期收入计算，隐含估值为 $400M——相对当前入场价格亏损 90%。

              各情景概率加权后的期望价值约为 $2.2–2.5B，明显低于当前 $4B 入场价。这确认了根本投资张力：Base Power 确实是创新平台，但 $4B
              入场价已经把五到七年的执行成果打包计入，而这些成果尚未在全国规模上得到证明。
