      - number: '3.5'
        title: 现状与替代方案
        blocks:
          - type: paragraph
            body: >
              最大竞争集并不是其他 VPP 公司，而是 Texas 房主在接触 Base 之前选择的现状选项：没有备用电（接受停电风险）、丙烷 / 天然气备用发电机、与电网互动的智能温控器，以及完全没有储能的零售电力计划。


              **无备用电现状：** 大多数 Texas 住宅客户经历过一次或多次重大停电事件（Winter Storm Uri 2021、2023 年夏季高温事件、Winter Storm Fern
              2024），但尚未安装备用电。硬件购买的经济门槛是主要阻力——Base 用 $695 入门价直接对冲这一点，而可比发电机或电池替代方案需要 $15,000+。


              **丙烷 / 天然气备用发电机（Generac、Kohler）：** Generac 在美国家用备用发电机市场持有约 75% 份额。安装成本为
              $10,000–$20,000+，停电时还有持续燃料成本和维护要求。发电机有燃料就能无限期运行，但会排放 CO 且需要户外安装。Base 面向 GVEC 会员将其方案宣传为相比发电机等“类似备用方案便宜
              95%”。长期多日停电时，发电机在续航上胜过电池；但典型 Texas 停电（按 Base 电池群数据，97%+ 不超过 3 小时）中，Base 25 kWh 电池几乎覆盖所有事件。


              **需求响应项目（Renew Home/OhmConnect、Voltus、Leap）：** Renew Home——由 Google 的 Nest Renew 和 OhmConnect
              合并而成——现在按注册家庭数计是北美最大住宅 VPP，使用智能温控器和可控负荷，而不是电池。这些项目无需安装硬件负担，也能提供电网价值（削峰、移峰），但无法在电网停电期间提供全屋备用电，而这是 Base
              最强的消费者价值主张。截至 2026 年 5 月，OhmConnect 已将 Texas 客户迁移至 Direct Energy，并在 Renew Home 平台下运营。


              **分时电价零售电力计划：** Texas 放松管制市场（130+
              REP）提供分时电价、免费夜间用电和光伏回购计划，让房主不装电池也能部分套利电网价格波动。随着光伏回购价值下降（“光伏孤儿”），这些计划吸引力降低，给 Sonnen/Solrite 的 VPP
              创造了切入点。Base 作为 REP，直接与其他 Texas REP 争夺电力账单关系，其有竞争力的电价取决于电网条件和电池调度收入分享。


              **既有公用事业扩张电池项目：** 目前作为 Base 合作伙伴的合作社和 IOU，理论上可以用公用事业级电池采购加 AutoGrid 等 DERMS 供应商，把分布式电池项目内化。GVEC CEO
              提到，该合作社评估过“公用事业级、配电侧接入电池”，并认定表后资产提供更优输电成本降低价值——这暂时验证了 Base 模型，但也说明公用事业在积极评估所有选项。
            claimRefs:
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
      - number: '3.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: ERCOT 收入压缩对单位经济构成重大威胁
            body: |
              2023 到 2025 年，ERCOT 电池辅助服务和套利收入下降 89%
              （Enverus 数据）。按 Base 估算，25 kWh 电池的单台年收入约 $2,075，
              在基准情景下意味着 8–9 年回本周期——对一家资本密集型公司而言偏勉强，
              尤其是其每年员工开支超过 $15M。若 ERCOT 长期维持低波动环境，
              Base 将更依赖固定的公用事业容量托管合同，而不是现货市场收入；
              这会加速公司转向受监管公用事业模式，但合同期限也必须长于当前 3 年最低期限。
            calloutType: risk
            claimRefs:
              - CP025
              - CP026
              - CP028
              - CP029
          - type: callout
            title: 公用事业合作社模式筑起持久分发护城河
            body: |
              Base 在 Texas 拿下五个公用事业合作社伙伴关系（CoServ 100 MW、GVEC 50 MW、
              Bandera、Farmers Electric 等），形成了硬件 OEM 难以复制的 B2B 获客通道。
              GVEC CEO 称，表后资产相较公用事业级电池，能带来更高的输电成本削减价值——
              这是监管和运营层面对 Base 模式的验证，也说明它在技术上不同于纯硬件打法。
              目前没有竞争对手在 ERCOT 拥有同等规模的合作社合同。
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
              - CP024
          - type: callout
            title: 价格战情景下，Tesla 和 Sunrun 构成规模威胁
            body: |
              Tesla 和 Sunrun 早已有业主触达渠道，自有或签约的电池供应，以及监管准入
              （ERCOT REP 牌照、ADER 资格）。如果 VPP 经济性足以支撑激进定价，
              它们就有能力压低价格、挤压 Base。一位行业分析师指出，
              “Tesla 或 Sunrun 不需要做太多就能复制他们的成功”，而且这些公司
              “会在任何价格战中击败 Base”。Base 的 $1 B Series C 和 Austin 制造策略，
              本质上就是对冲这一情景，但对一家 2023 年成立的公司来说，制造执行风险是真实的。
            calloutType: risk
            claimRefs:
              - CP013
              - CP016
              - CP027
          - type: callout
            title: Sonnen/Solrite VPP 是最接近的结构性对标，也是近期最直接对手
            body: |
              Sonnen 于 2026 年 2 月推出的 SOLRITE VPP，是结构上最接近 Base 的竞争者：
              电池归平台所有，消费者零前期成本，并通过 ERCOT VPP 调度，同时保留封顶的备用电储备。
              主要差异在于规模（10,000 户 vs. Base 更大的覆盖面）、Sonnen 的资金支撑
              （Shell 资产负债表 vs. Base 风投资本），以及容量（60 kWh vs. 25 kWh）。
              两个项目都瞄准同一个 200 MW ADER 上限，Sonnen 明确计划拿下其中 144 MW。
              这是 Base 在 ERCOT 扩张 ADER 时最直接的竞争约束。
