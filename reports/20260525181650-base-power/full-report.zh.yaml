          - type: callout
            title: 公用事业伙伴渠道扩大可触达市场，但稀释经济性
            body: >
              六项公用事业合作（Bandera、GVEC、Farmers、CoServ、EPE、Austin Energy）触达的是无法切换电力供应商的合作社和市政公用事业成员——
              扩大了可触达客户群，但也剥离了零售电力价差和批发套利收入流，而它们正是发售电一体化模式的核心。这些伙伴关系对容量部署和品牌验证有战略价值， 但单客户经济性可能显著低于直接零售渠道。
