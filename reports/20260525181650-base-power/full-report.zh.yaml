      - number: '3.3'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >
              相比硬件 OEM 阵营，Base Power 的竞争定位建立在三项结构性优势上：资产所有权（Base 承担资本开支，而不是消费者）、电池超配（25 kWh，高于 Tesla 13.5 kWh 或 Enphase
              5 kWh 模块单元），以及直接嵌入公用事业合作。


              **价格差：** Base 收取 $695（单电池）或 $995（双电池）安装费，另收 $19/月（双电池 $29）持续费用。GVEC 会员支付更低——$295 或 $445——且 Base
              完全免除月度会员费。竞争性硬件购买模式要求 Tesla Powerwall 3 前期投入 $7,500–$13,500，FranklinWH aPower 2 为 $6,500–$8,500，Sonnen
              零售购买路径为 $8,000–$11,000。即使扣除 Oncor $4,500 返利（限 Oncor 区域），硬件购买竞争品仍要求消费者投入 Base 入门价的 5–10×。联邦住宅 ITC 25D 税收抵免在
              2025 年底到期，使 2026 年这一差距进一步扩大。


              **容量与电网价值：** Base 25 kWh / 11.4 kW 电池的储能量约为 Tesla Powerwall 3（13.5 kWh）的两倍、Enphase IQ Battery 5P
              模块的五倍。更大电池容量允许单台做更多能源套利、在 ERCOT 中每个节点产生更多收入，并提供更长备用时长。一套双电池 Base 安装（50 kWh）可为平均 GVEC 客户提供最长约 12 小时备用电，而单个
              Powerwall 3 约 3–4 小时。


              **公用事业集成 vs. 消费者控制模型：** Base 模型默认预留 80% 电池容量给公用事业调度，20% 给房主备用。竞争性硬件购买模型把完整控制权交给房主，公用事业会认为这种电网资产可靠性较低。GVEC
              明确指出，表后资产（Base 模型）能带来输电成本降低价值，而登记为发电机的公用事业级电池无法提供。Sonnen/Solrite 也提供类似 Base 的 10–20% 备用保留，反映同样取舍。Tesla VPP
              允许房主在停电期间选择退出，这会降低电网运营商可依赖的调度可靠性。


              **软件与控制栈：** Base 声称其自有自营资产群具备亚秒级遥测和三个 9 的正常运行时间。依赖房主覆盖控制的竞争者（智能温控器、Sunrun 客户控制系统）会面对 Base CEO Zach Dell
              在投资人评论中明确提到的“DR 1.0”可靠性质疑：“资产归我们所有，也由我们控制。我们有三个 9 的正常运行时间。” AutoGrid 和 Fluence
              向公用事业提供可比的软件复杂度，但自身不持有硬件资产，在房主注册层存在执行风险。
