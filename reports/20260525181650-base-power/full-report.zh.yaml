      - number: '8.5'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              Base Power 最可能的退出路径是在 2027–2029 年公开上市（IPO），前提是公司证明年收入达到 $150–300M，并在多个市场持续实现正向单位经济性。Forge Global
              的二级市场挂牌显示“Confidential Filing”状态，符合 IPO 准备工作，但截至 2026 年 5 月并不等于已确认提交 S-1。2026 年气候科技 IPO 窗口正在打开——X-energy 的
              $1B IPO（首日上涨 25%）和 Fervo Energy 约 ~$3B IPO 文件显示机构投资人愿意买能源基础设施故事——但 K 型市场现实（核能和地热受青睐，硬件重的气候科技相对不利）意味着 Base
              Power 必须证明盈利或接近盈利，公开市场才会继续支撑其增长溢价。

              战略收购是次要退出路径。潜在收购方包括：寻求 DER/VPP 资产的大型美国公用事业公司（NRG、Exelon、Dominion）；希望用“能源即配套”做差异化的全国家居建造商（Lennar
              已是渠道合作伙伴）；或希望搭建户用能源平台的能源巨头（Shell、BP）。Uplight/Octopus 交易和 OhmConnect/Nest 合并为 VPP 邻近资产在 $1–2B
              区间被收购提供了私募市场先例，说明若要让收购方给出高于当前 $4B 标记的溢价，就需要非常大的规模或独特战略契合。

              投资决策前的关键尽调缺口包括：(1) 覆盖完整客户队列的经审计单位经济性，包括当前市场价格下每块电池的 ERCOT 电网服务收入；(2) 四轮融资的股权结构表和优先股堆叠细节；(3) Gen 3
              制造计划状态——时间表、单台成本和规划产能；(4) 非 ERCOT 市场的全国扩张计划，包含监管和入市细节；(5) 单一披露案例之外的客户层面流失数据，包括 12 个月和 24 个月队列留存曲线。

              触发投资逻辑破裂的信号包括：ERCOT 电网服务收入跌破 $20/kW/year（单位回本期超过电池使用寿命的阈值）；到 2026 年底，单台制造净成本仍高于 $10,000（说明 Gen 3
              未按计划推进）；18 个月以上队列流失率加速超过 5%；以及到 2026 年 Q4 仍未落地任何非 ERCOT 市场。任何单一触发都会显著削弱乐观情景；两个或更多触发同时出现，则悲观情景应成为基准情景。
