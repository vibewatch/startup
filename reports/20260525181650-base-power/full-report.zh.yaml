      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              Base Power 当前客户集中度极高：收入基本 100% 来自 ERCOT 内的 Texas 业主。其中，放松管制的“发售电一体化（gentailer）”模式（叠加租赁、零售和套利收入）
              只适用于五个放松管制的公用事业区域（Oncor、CenterPoint、TNMP、AEP Central、AEP North）。公用事业伙伴渠道能触达不同客户口袋—— 例如不具备零售 REP
              产品资格的合作社成员——但这些容量托管或仅批发交易给 Base 带来的经济性，明显薄于完整发售电一体化栈。


              2026 年 4 月推出的无电池 “Base Energy” 计划，把可触达客户池扩至租户和公寓住户——这是突破独栋业主单一原型的第一个细分扩张信号。 Texas
              之外的地理扩张，取决于复制放松管制市场准入（Base 网站曾提到 Illinois 是目标），或在没有零售价差和批发套利的情况下跑通公用事业容量托管经济性。 El Paso Electric
              受监管区域试点，就是后者的实时测试；结果尚未披露。


              在合作社层面，头部客户风险为中等：CoServ（330,000 块电表）代表一份 100 MW 协议，若丢失或表现不及预期，可能明显拖累 2026 年部署目标。 同样，Austin Energy 40 MW
              容量托管协议每年 $4.08M，是一项依赖年度预算批准的集中式机构收入承诺。进入新的 Texas 区域，部分依赖 ERCOT 的 Strategic Transmission Expansion
              Plan（STEP），而该计划执行周期为多年。
