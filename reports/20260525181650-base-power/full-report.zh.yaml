      - number: '8.6'
        title: 证据附录
        blocks:
          - type: callout
            title: ERCOT 收入饱和是当前倍数的生存级威胁
            body: >
              本章最重要的负面信号不是 Base Power 的执行——执行确实亮眼——而是 ERCOT 电网服务收入的结构性塌陷。BESS 年均收入从 2023 年 $149/kW 降至 2025 年 $29/kW（Modo
              Energy），下滑 80%，背后是装机容量增加 70×。按 $29/kW 计算，一块 25 kWh Base Power 电池每年只能赚约 $73
              电网服务收入——远低于维持盈利单位经济性所需的零售利润和租赁费，除非接受很长回本期。除非 RTC+B 改革显著提高每 kW 补偿，或 Base 真正取得零售利润率主导权，核心收入多元化逻辑目前承压很重。任何以
              $4B 入场价投资的人，都必须拿出具体且有证据支撑的判断，说明电网服务收入如何恢复到 $50/kW 以上；否则该风险无法消除。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV031
              - CV033
              - CV037
              - CV038
          - type: callout
            title: $4B 价格是平台期权溢价，不是收入倍数
            body: >
              Base Power 的 $4B
              估值无法用任何合理可比折现率下的传统收入倍数解释。更准确的理解是，市场在给公司成为美国放松管制市场中主导户用电池和电力平台的期权定价——类似在基础设施网络尚未规模化前先定价。这并非天然不理性：Sunrun
              在太阳能持有资产真正铺开前也曾以类似方式定价。但投资人必须明确给这个期权定价，为全国规模化结果分配现实概率，并接受当前证据质量下基准情景就是按当前入场价亏损。领投或共同领投四轮融资的五家顶级 VC
              对潜力的判断未必错；但他们可能已经把潜力定满了。
            calloutType: insight
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV016
              - CV020
              - CV021
          - type: callout
            title: 任何资本承诺前的尽调闸门
            body: >
              若没有以下条件，不应投入超过 $5M 资本：(1) 数据室访问权，确认截至 2026 年 Q3 的 2026 年收入轨迹达到或超过 $50M；(2) 四轮融资的完整股权结构表和优先权堆叠文件；(3) 独立 Gen
              3 制造评估。只有入场价格等于或低于 $2.5B，基准情景才会产生正向期望回报。若没有上述三项数据，超过 $3B 入场就是投机。
            calloutType: recommendation
            claimRefs:
              - CV001
