      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >
              Base Power 的持久竞争优势集中在五个会复利的因素：公用事业合作社伙伴合同（切换成本）、ADER 资格（监管护城河）、自研硬件 + 软件垂直栈、本土制造（Austin
              工厂），以及部署速度。不过，几项替代风险需要认真计入权重。


              **锁定效应与切换成本：** 一旦 Base
              电池安装在合作社成员电表后，由公用事业调度电池群、房主获得备用服务，更换供应商就需要实物拆除并替换硬件——摩擦很高。三年最低合同期进一步锚定客户。公用事业合作（CoServ 100 MW、GVEC 50
              MW、Bandera、Farmers Electric）也形成 B2B 切换成本：合作社需要重新认证并把新的 DERMS 供应商接入运营和 ERCOT 注册。不过，这些合同有期限，续约不确定。


              **ADER 监管护城河：** Base 获得 ERCOT Aggregated Distributed Energy Resource 试点资格，允许其将聚合住宅储能直接报价进入 ERCOT
              批发和辅助服务市场。这一监管资格并不容易复制——ADER 试点总容量上限为 200 MW，遥测和合规要求会劝退小运营商，且存在互操作性壁垒，连 ERCOT ADER Task Force
              也将其称为“需要解决的关键问题”。Sonnen/Solrite 正瞄准同一个 200 MW 上限中的 144 MW，因此这条监管通道上的竞争压力已经加剧。


              **商品化电池替代风险：** ERCOT 电池收入已经崩塌——平均年收入从 2023 年 $149/kW 降至 2025 年预计 $17/kW（Enverus 数据），跌幅 89%，原因是市场饱和（进入 2026
              年时装机 14 GW）。能源套利策略已经普及，但未能抵消回报下降，主要运营商年初至今盈利率低于 2.2%。如果辅助服务和套利收入持续受压，Base 单位经济（估计每套 25 kWh 系统总年收入约
              $2,075）可能只处在边际水平，尤其是在 100+ 员工对应超过 $15 million/年的间接费用下。一位批评者指出，在基准情景收入下，Base 回本期为“8–9 年”，只有高波动年份才会缩短至 5–6
              年。


              **Tesla 和 Sunrun 价格战风险：** Tesla 和 Sunrun 都能触达内部电池制造（CATL/Panasonic 合作）和既有安装商 / 房主渠道，规模远超 Base
              当前足迹。一位批评者明确警告称，“Tesla 或 Sunrun 不需要太多动作就能复制他们的成功。这些公司，尤其是 Tesla，已经能获得内部电池制造，并会在任何价格战中击败 Base。” Base 的 $1 B
              Series C（2025 年 10 月）和计划中的本土 Austin 工厂，就是对这一风险的直接回应。


              **监管与政策逆风：** 联邦住宅 ITC 25D 于 2025 年底到期，削弱竞争性光伏加储能安装的经济性，也可能压低消费者对任何家庭能源投资的需求。2025 年的 “One Big Beautiful
              Bill Act” 压缩开发商时间表并提高合规负担。Deloitte 2026 Power and Utilities Outlook 指出，容量采购、费率设计不确定性和并网延迟仍是一线行业风险——这些都会影响
              Base 在 Texas 之外签署新的受管制市场公用事业合同。
