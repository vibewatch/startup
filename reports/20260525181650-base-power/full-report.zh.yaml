  - id: TV005
    title: 投资逻辑破裂与终止触发因素
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ERCOT 电网服务收入崩塌
        - 到 2026 年 Q4，收入低于 $20/kW/年
        - 单位回本周期超过电池有效寿命（约 10 年）；叠加收入模型破裂；2026 年预测无法达成
        - 退出或减仓；视为悲观情景确认
      - - Gen 3 制造成本超支
        - 到 2026 年底，单台电池净成本仍高于 $10,000
        - 指向工厂执行失败；全国规模化会放大资本强度；已投入 $1.3B 可能不够
        - 暂停跟投；任何后续投资前要求制造审计
      - - 全国扩张停滞
        - 到 2026 年 Q4，ERCOT 以外仍无已确认商业部署
        - 乐观情景的收入增长需要多州扩张；按当前安装速度，仅 ERCOT 会把 2027 年收入封顶在 $50M 以下
        - 将建议从观察下调为放弃
      - - 流失加速
        - 任一 12 个月队列的客户流失率超过 5%
        - 收入耐久性受到质疑；零售电力合约有执行风险；竞争替代方案侵蚀模型
        - 深入客户级尽调；可能指向结构性产品市场匹配边界
      - - 降价轮或困境融资
        - 新股融资估值低于 $3B，或债务融资票息 >15%
        - 优先股堆叠被侵蚀；显示投资人对近期路径信心下降；高管人才留存风险上升
        - 从零重估投资逻辑；即使复苏，优先股堆叠也可能压低回报
      - - ERCOT ADER 或 VPP 补偿监管逆转
        - PUCT 修改规则，降低 ADER 项目参与度或补偿费率
        - 直接冲击主要电网服务收入层；影响所有客户的 ERCOT 经济性模型
        - 必须重跑情景分析；折现率需加入监管风险溢价
    notes: 阈值基于判断，源自 GreenCarFuture 单位经济性分析、Modo Energy ERCOT 收入预测和可比资本强度研究。监控需要持续访问 ERCOT 市场数据和公司财务数据。
