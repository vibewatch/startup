          - type: callout
            title: 电池放电条款削弱备用电价值主张
            body: >
              Base Power 合同允许公司在高峰需求时段将客户电池放电至 20%，以便向电网售电——这正是电网最可能停电的条件。DFW
              一位独立电工审查后指出，这是“大多数人最容易漏掉的一件事”，并建议如要真正全屋保护，应将 Base 与补充发电机搭配。商业 VPP
              用例与客户备用电预期之间存在结构性张力；一旦发生高曝光停电事件，声誉和流失风险都会上升。
            calloutType: risk
            claimRefs:
              - CO036
              - CO037
          - type: callout
            title: 单位经济依赖波动剧烈的 ERCOT 套利
            body: >
              第三方分析估计，按当前定价，每套 25 kWh 设备简单回本期为八到九年，盈利能力取决于 ERCOT 批发电价波动能否持续。随着更多储能资产进入市场，套利价差可能收窄。另外，此前依赖中国制造电池带来关税暴露，而
              Austin 工厂尚不具备完全替代能力。
            calloutType: risk
            claimRefs:
