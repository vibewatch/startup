          - type: callout
            title: 电池调度中的客户利益冲突带来诉讼和监管敞口
            body: >-
              Base Power 可以合法地把客户电池放电至 20% SOC，用于电网交易。社区论坛记录了客户在停电期间发现备用电没有完全可用时的意外和不满。若严重天气事件（可比 Winter Storm Uri）让
              Base Power 客户在预期有备用电时失去供电，而电池当时被调度去获取电网收入，声誉损害可能很重，PUCT 投诉或集体诉讼也可能跟进。这是最清晰的负面客户影响场景，应成为尽调优先重点。
