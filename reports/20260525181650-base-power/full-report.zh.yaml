      - number: '1.4'
        title: 里程碑、牵引力与规模
        blocks:
          - type: paragraph
            body: >
              Base Power 在极短时间内做出了相当规模。公司 2023 年 8 月创立，当年即完成首批部署；2024 年初拿下 Hill Country 公用事业合作（Bandera Electric
              Cooperative），成为首个公用事业合作；2024 年 12 月宣布标志性的 Lennar 房屋建造商合作，在 Firefly Pointe（Hutto）、Rancho del
              Cielo（Jarrell）和 Rancho Canyon（Haslet）社区试点。到 2025 年 4 月，公司完成 $200 M Series B，并以“每天最多 20 套电池”的速度部署。2025 年 8
              月，公司完成向 Dallas-Fort Worth 主城区扩张，在 Grapevine 开设仓库和办公室，覆盖 Fort Worth、Arlington、Plano 和 Irving。

              2025 年夏，Base 获得 ERCOT 聚合分布式能源资源（ADER）试点资格——这正式允许分布式电池被汇聚起来，作为单一可调度资源进入批发市场报价。公司预计到 2025 年秋成为 ADER
              项目最大贡献方。Series C 和工厂公告均在 2025 年 10 月发布；前 Austin American-Statesman 印刷厂开始改造成储能和电力电子制造产线，目标是在 2026 年初全面投产。

              随后的公用事业合作公告密集落地：GVEC（Guadalupe Valley Electric Cooperative）于 2025 年 6 月启动公用事业管理的电池群；Farmers Electric
              Cooperative 于 2025 年 12 月签约，目标是部署 20 MW 住宅容量；El Paso Electric Company（EPE）在 2026 年 2 月宣布试点，夏季高峰前最高部署 10
              MW；CoServ（Denton County Electric Cooperative）在 2026 年 3 月宣布签署 100 MW 协议——这是 Base 迄今最大交易，也被描述为 Texas
              最大分布式储能项目之一。到 2025 年中，客户数超过 10,000 户，总已部署容量超过 100 MWh。2026 年预计收入约 $70 million。
