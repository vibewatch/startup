  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Base Power 在住宅储能市场中的位置很特殊：它同时是资产所有者、零售电力供应商（REP）、软件平台和公用事业服务公司。这种垂直整合意味着其竞争格局横跨四个不同集群。


              **直接 VPP 聚合商和电池即服务提供商** 是最接近的替代品，因为它们追求的是同一类家庭场景——部署电池来捕捉电网套利收入，同时以低自付成本向房主提供备用电价值。Sonnen（Shell 子公司）及其
              Texas 零售伙伴 SOLRITE Energy 于 2026 年 2 月在 ERCOT 推出纯电池 VPP，提供 60 kWh 储能，月费 $20，“全包”零售电价 12¢/kWh——与 Base 的
              $19–$29/月会员模式直接重叠。Sunrun（NASDAQ: RUN）是美国最大住宅光伏加储能公司，正通过与 NRG/Reliant 的多年合作在 Texas 建设 1 GW VPP，并另与
              Vistra/TXU Energy 推出电池聚合项目。截至 2026 年，Sunrun 在全国部署了 116,000 多套储能系统，CalReady VPP 向 California 电网交付 51 MW
              峰值——这验证了住宅聚合模型，也让 Sunrun 成为争夺 Texas 公用事业合作社带宽和房主注册的直接竞争对手。


              **争夺同一安装位置的硬件 OEM** 包括 Tesla（Powerwall 3）、Enphase（IQ Battery 5P）、Generac（PWRcell）、LG Energy Solution（RESU
              Prime）和 FranklinWH（aPower 2）。这些公司通过第三方安装商销售，而不是直接持有并运营资产。Tesla 还通过 Tesla Electric 以 REP 身份运营，并借 Autobidder
              运行自己的 VPP，因此在 ERCOT 是 OEM+聚合商混合型竞争对手。Tesla Powerwall 3 单台容量为 13.5 kWh，低于 Base 的 25 kWh；Tesla 在 Texas
              的安装成本为每台 $10,000–$13,500，而 Base 安装费为 $695——Base 在消费者经济性上优势明显。


              **需求响应和智能温控器替代品** 不部署电池，但竞争同一套电网服务价值栈。Renew Home（由 Google 的 Nest Renew 与 OhmConnect 合并而成）按注册家庭数计是北美最大住宅
              VPP，依靠智能温控器、智能插座、热水器和 EV。截至 2026 年 5 月，OhmConnect 已将 Texas 客户迁移至 Direct Energy，并以 Renew Home 品牌运营。这些平台争夺同一
              ERCOT ADER 试点容量上限（总计 200 MW）和房主注意力，但无法在停电时提供全屋备用电——这是 Base 的核心差异点。


              **现状替代品和既有电网** 仍是主导替代选择。大多数 Texas 房主没有任何备用电，接受停电风险。丙烷或天然气备用发电机（Generac 和 Kohler）是传统韧性选项，安装成本超过
              $15,000——Base 正是利用 $695 入门价打开价格差。NRG/Reliant 和 TXU/Vistra 等既有企业通过 130+ REP 服务 31 million Texas
              居民；理论上它们可在内部捆绑电池项目，但目前更愿意与聚合商（Sunrun、Renew Home、Base）合作，而不是直接持有分布式硬件。
