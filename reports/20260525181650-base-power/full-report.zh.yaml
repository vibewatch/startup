  - id: FV001
    title: 投资建议逻辑流
    type: flow
    layout: standard
    summary: 从证据支柱到有条件正面建议的决策链，串联市场、产品、单位经济和估值输入。
    data:
      nodes:
        - id: n1
          label: 部署速度（强）
          description: 截至 2026 年 5 月，10,000+ 户住宅和 100+ MWh；到 2025 年末近零流失；2025 年末运行率约 20 MW/月
        - id: n2
          label: 电网服务收入（反向）
          description: ERCOT 电池收入在 2025 年降 90% 至约 $29/kW；结构性饱和可能持续到 2026 年
        - id: n3
          label: 垂直整合模式（有潜力）
          description: 自有 / 运营电池 + 零售电力；若制造规模化，可形成结构性资本开支优势
        - id: n4
          label: 制造执行（未验证）
          description: 城市激励协议于 2026 年 3 月告吹；Gen 3 工厂未确认租约；本土成本曲线未验证
        - id: n5
          label: 全国扩张（未验证）
          description: 依赖 ERCOT 特定的放松管制；未确认非德州市场启动；PJM/NY 监管复杂
        - id: n6
          label: 估值信号（偏高）
          description: $4B 对应 2025 年收入 $12M（333x）；概率加权 EV 约 $2.2–2.5B，低于当前入场估值；基准情景意味着亏损
        - id: n7
          label: 有条件观察名单 / 联合投资
          description: 入场估值 ≤$3B、2026 年收入经验证且至少启动一个非 ERCOT 市场；若无数据室访问且估值高于 $4B，则放弃
        - id: n8
          label: 必要证据门槛
          description: 经审计单位经济；股权结构表和优先股堆叠；Gen 3 成本曲线；非 ERCOT 市场计划
      edges:
        - from: n1
          to: n7
          label: 支撑
        - from: n2
          to: n6
          label: 施压
        - from: n3
          to: n7
          label: 有条件支撑
        - from: n4
          to: n6
          label: 引发疑问
        - from: n5
          to: n6
          label: 限制乐观情景
        - from: n6
          to: n7
          label: 约束入场
        - from: n8
          to: n7
          label: 决定入场门槛
    claimRefs:
