      - number: '1.5'
        title: 反向因素与关键风险
        blocks:
          - type: paragraph
            body: >
              独立评测和分析师评论暴露出几项重大风险。最突出的一点是，Base Power 客户合同赋予公司法律权利：在高需求时段，为向电网售电，可将电池放电到最低 20%
              荷电状态。实操上，依赖电池抗停电的房主，可能在电网失效那一刻只剩部分电量可用——而高需求场景恰恰最容易引发停电。仔细审查 Base 条款的 DFW 承包商 Epic Electrical
              称，这是“大多数人最容易漏掉的一件事”，并建议真正追求全屋保护的房主，把 Base 电池与补充发电机和联锁套件（$300–$700）搭配使用。

              单位经济可持续性是第二个担忧。Green Car Future 的一项独立分析测算，25 kWh 系统单台年收入约 $2,075，按当前定价意味着简单回本期为八到九年——只有在电池循环假设成立、ERCOT
              市场波动持续且资本成本不上升时才算可接受。该分析师指出，>100 名员工按约 $150,000 全包成本计，意味着每年 $15 M+ 劳动力间接费用，而这没有计入单台经济账。收入预测高度依赖 ERCOT
              辅助服务和能源套利收入；随着更多分布式储能进入市场，这些收入可能被压缩。

              关税和供应链暴露是第三个风险：CNBC 2025 年 4 月报道，Base Power 的电池在中国制造，公司预期美国关税会造成重大影响。本土工厂明确是为解决这一问题，但制造爬坡时间表仍未得到独立来源验证。

              最后，Base 运营所依托的是 ERCOT ADER 试点，受 PUCT 监管审查；该项目的市场上限（160 MW 能量、80 MW
              non-spin/ECRS）和准入规则，可能被委员会命令收紧、修订或终止。本研究周期未发现针对 Base Power 的诉讼、制裁或消费者保护执法行动。
            claimRefs:
              - CO036
              - CO037
              - CO038
              - CO039
              - CO040
