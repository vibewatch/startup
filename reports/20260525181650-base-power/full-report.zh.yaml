  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与市场规则风险
        blocks:
          - type: paragraph
            body: >-
              Base Power 的业务夹在三套监管制度之间——ERCOT 市场规则、PUCT 零售电力供应商（REP）认证、ADER 试点计划；任何一套制度都可能单方面改写公司的经济性或运营权限。

              ERCOT NPRR 1186 于 2024 年 4 月 11 日获批、2024 年 6 月 27 日生效，要求提供辅助服务的 Energy Storage Resources
              保持足够荷电状态（SOC），覆盖完整一小时义务期。电池运营商未能维持规定 SOC，就可能面临执法，罚款最高可达每 5 分钟区间
              $25,000；批评者称这套处罚歧视储能，因为火电机组只有在实际交付失败时才会受罚。PUCT 最初在 2024 年 1 月将 NPRR 1186
              发回重审，理由是执法条款会惩罚即使完全履行调度义务的电池，从而压制储能投资；委员会在 2024 年 4 月批准了缓和版规则。Eolian 等行业参与者警告，NPRR 1186
              将“显著减少储能参与辅助服务市场，并削弱竞争”。后续于 2025 年 12 月上线的 RTC+B（Real-Time Co-optimization plus
              Batteries）用共优化调度取代了这一过渡框架，但也带来了新的算法复杂度要求，并压缩了依赖市场设计缝隙的结构性 alpha 收入。

              ADER（Aggregated Distributed Energy Resource，聚合分布式能源资源）试点让 Base Power 能汇聚户用电池参与批发市场，但它仍只是 PUCT Project No.
              53911 管辖下的试点计划。截至 2025 年 10 月，ERCOT 将全系统 ADER 总容量上限从 160 MW 提高到 200 MW，并将 QSE 集中度上限从 20% 提高到 50%。但 ADER
              仍是试点，ERCOT 和 PUCT 仍可在相对短时间通知下修改参与规则、调整容量上限或终止试点——这一风险直接威胁 Base Power 的核心收入生成机制。据报道，Base Power 已参与 ADER
              试点，但尚未在 PUCT Project No. 53911 公开文件中找到可用确认。

              作为持牌德州 REP，Base Power 必须在 3 月 5 日前提交年度报告、8 月 15 日前提交半年度报告，维持信用证（少于 50,000 个 ESI IDs 为 $750,000；超过该门槛为 $1.5
              million），并在 15 天内回复提交至 PUCT 的客户投诉。若违反 Public Utility Regulatory Act 或委员会规则，PUCT 有权暂停或吊销 REP 牌照。Uri
              之后的立法改革（SB 6、SB 7、SB 1287 及相关法案）也让 PUCT 监督更主动，ERCOT Protocol Revisions 现在需要 PUCT 批准。

              并网成本风险也在上升：PUCT 修订后的 16 TAC §25.195（2026 年 1 月 1 日生效）规定，超过 $14 million（≤138 kV）或 $20 million（高于 138
              kV）的并网成本直接由接入的发电资源承担；随着 Base Power 扩大工厂直供硬件机群，成本敞口随之出现。NERC 的 Texas RE 已将逆变器型资源合规——包括电池——列为 2026
              年重点审计领域，增加了合规成本和文件负担。
