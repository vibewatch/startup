      - number: '4.5'
        title: 图表与材料
        blocks:
          - type: callout
            title: 资本强度与收入规模错配，使公司结构性依赖持续股权融资
            body: >-
              Base Power 已融资约 $1.3 billion，而 2025 年收入为 $12 million，资本效率比约 108:1——也就是每 $1 年收入背后，公司已投入超过 $100 的投资者资本。
              这一比例是早期硬件平台的典型特征，本身并不构成否决项，但意味着以有利估值持续获得股权资金，是公司近期生存的前提。任何投资者风险偏好恶化——无论由利率变化、 政策风险（ITC 退坡或 FEOC
              限制）还是收入目标未达触发——都可能在机群达到现金流盈亏平衡前引发融资危机。
            calloutType: risk
            claimRefs:
              - CI005
              - CI016
              - CI017
              - CI032
          - type: callout
            title: 批发套利收入是回本引擎，但仍未验证且依赖市场
            body: >-
              归因于 Base Power 单元经济性的 3.5 年回本周期，取决于批发套利成为主要收入贡献者；这一收入流在单台层面尚未验证，并依赖 ERCOT 价格波动延续、 ADER 项目成熟和 QSE 成本结构。截至
              2025 年中，所有参与方实际调度的 ADER 容量只有 15 MW，单一聚合体的盈亏平衡规模约为 15–20 MW。 如果新增输电或发电让 ERCOT 电网条件降低波动，或监管变化限制 ADER
              参与，套利层可能明显压缩。
            calloutType: risk
            claimRefs:
              - CI007
              - CI027
              - CI028
              - CI029
          - type: callout
            title: 公用事业容量托管协议带来第四层收入，有望改善机群经济性
            body: >-
              Austin Energy 交易给出了一套战略模板：同一批硬件在既有零售和套利收入之外，Base Power 还能获得稳定、低波动的容量付款。40 MW 每年 $4.08 million， 隐含费率为
              $8.50/kW-month，带来温和但稳定的增量收益。若能在 ERCOT 与更多市政公用事业和合作社复制，容量托管协议有望在 200–400 MW 签约容量下贡献 $20–$40 million
              年收入，不需要额外硬件部署就能实质改善混合资本回本。
            calloutType: insight
            claimRefs:
              - CI008
              - CI009
              - CI036
          - type: callout
            title: 2026 年 $70 million 收入预测取决于 Gen 3 制造爬坡成功
            body: >-
              公司 2026 年 $70 million 收入预测，取决于 Factory One 的 Gen 3 电池生产能否放量。CEO 已公开承认，制造爬坡到 2026 年中期会“困难”。 如果 Gen 3
              产量低于目标，每月 20 MW 的部署速度就无法靠进口或外包硬件维持，除非承受明显成本冲击。若 2026 年安装量短缺 50%， 收入将约为 $40–$45 million，而不是 $70 million
              目标；这可能迫使公司比 Series C 现金跑道原本支持的时间更早再次股权融资。
            calloutType: assumption
