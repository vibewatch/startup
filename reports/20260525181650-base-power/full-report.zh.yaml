  - id: FR001
    title: 风险热力图 — 按可能性和影响划分的 Base Power 风险全集
    type: matrix
    layout: standard
    summary: 按发生可能性（低 / 中 / 高）和业务影响（中等 / 高 / 致命）映射 10 项已识别风险，并标注当前缓释后的剩余严重性。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 致命影响
          values:
            - 电池起火 / 热失控；电池集群管理遭网络攻击
            - ADER 试点容量冻结或项目解散
            - ERCOT 收入压缩 / 饱和
        - label: 高影响
          values:
            - 并网成本超支；关键高管离职
            - 电池衰减 / 质保成本；软件误调度；Factory One 爬坡失败
            - 客户利益冲突（SOC 消耗 vs 备电）
        - label: 中等影响
          values:
            - ''
            - 安装商短缺拖慢部署
            - ''
    approximationNotes: 可能性和影响评估是分析师基于公开证据的判断；未获得专有运营或财务数据。
    claimRefs:
      - CR001
      - CR011
      - CR018
      - CR022
      - CR026
      - CR035
  - id: FR002
    title: 风险传导图 — ERCOT 与监管风险如何流入 Base Power 经济模型
    type: dag
    layout: wide
    summary: 有向无环图展示 ERCOT 市场饱和、NPRR 1186、ADER 试点风险和 REP 认证风险如何传导至 Base Power 的收入、利润率和客户结果。
