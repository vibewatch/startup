      - CV006
      - CV007
      - CV008
      - CV020
      - CV021
  - id: FV003
    title: 各情景下的估值与回报区间
    type: range
    layout: standard
    summary: 以 2027 年收入和退出倍数假设为锚，展示从悲观到乐观情景的隐含退出估值区间，并与 $4B C 轮入场比较。
    data:
      items:
        - label: 悲观情景退出（35% 概率）
          low: 0.24
          mid: 0.37
          high: 0.5
          unit: $B
        - label: 基准情景退出（45% 概率）
          low: 1.5
          mid: 2.05
          high: 2.6
          unit: $B
        - label: 乐观情景退出（20% 概率）
          low: 5
          mid: 5.63
          high: 6.25
          unit: $B
        - label: 概率加权预期价值
          low: 1.8
          mid: 2.3
          high: 2.7
          unit: $B
        - label: $4B C 轮入场（参考）
          low: 4
          mid: 4
          high: 4
          unit: $B
    approximationNotes: >-
      退出倍数：悲观情景按 2027E 收入 $30–50M 取 8–10x；基准情景按 $100–130M 取 15–20x；乐观情景按 $250M 取 20–25x。概率权重：乐观 20%、基准 45%、悲观
      35%。优先股堆叠和清算条款未公开披露；若有高顺位优先股挡在普通股之前，回报可能进一步受损。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV033
  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的八维评分，覆盖市场机会、执行证据、竞争护城河、单位经济、监管风险、估值、资本强度和证据质量。
    data:
      items:
        - label: 市场机会
          note: 强：住宅 DER/VPP 市场年增 21%；2025 年住宅电池入网 +153%；AI 数据中心需求顺风进一步放大 ERCOT 电网压力
        - label: 部署执行
          note: 强：两年内 10,000+ 户住宅 / 100+ MWh；2025 年末运行率约 20 MW/月；近零流失；ADER 项目资格已确认
        - label: 商业模式新颖度
          note: 良好：垂直整合的发售一体电力商（gentailer）具备结构性差异；叠加收入（零售利润率 + 电网服务 + 租赁）提供部分底部支撑；零售合同带来持久收入
        - label: 单位经济
          note: 弱–中等：Gen 1 回本周期随 ERCOT 收入假设在 3.5–8.5 年；估计相互冲突；电网服务收入较 2023 年峰值下降 90%；规模化表现未经独立验证
        - label: 竞争护城河
          note: 中等：聚合电池集群带来的网络效应和数据真实存在，但仍处早期；Tesla Powerwall、Sunrun Battery 和公用事业赞助项目都是可信威胁；切换成本嵌在 3 年电力合同里
        - label: 监管与市场风险
          note: 较高：ERCOT 辅助服务收入结构性坍塌；RTC+B 改革是不确定上行；全国扩张需要不同监管关系；截至目前无反向监管事件，但风险敞口高
        - label: 估值与证据
          note: >-
            弱：2025 年收入的 333x；2026E 收入的 57x；概率加权 EV 为 $2.2–2.5B，低于 $4B 入场；无经审计财务；公开可比公司为
            1.5–5.6x；当前倍数只有在赢家拿走大部分市场的情景下才站得住
        - label: 资本强度和融资风险
          note: 高风险：已部署 $1.3B；全国规模化需要数十亿美元资本开支；城市激励协议告吹；Gen 3 工厂时间表未确认；普通股前方有 $1.3B 优先股堆叠压力
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV020
      - CV021
