              截至 2025 年 8 月，仅报告一名客户离开。10 年电池服务协议加 3 年电力合同，并配有低于市场价的续约保证，形成结构性粘性：
              拆除成本（$500）、续约费率匹配义务，以及卖房时转让而非终止的能力，都会降低退出动机。
