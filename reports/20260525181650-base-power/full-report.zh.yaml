  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Base Power 的投资逻辑建立在四根结构性支柱上。第一，公司创造了 ERCOT 历史上最快的户用电池部署速度：到 2026 年 5 月已覆盖 10,000+ 户、100+ MWh，同时披露截至 2025
              年末流失率接近零。在资本密集型硬件业务里，这种执行速度异常突出，也验证了运营模型。第二，垂直一体化的“gentailer”结构——制造、安装、持有并运营电池，同时充当零售电力供应商——相比公用事业级 BESS
              形成结构性资本开支优势。CEO Zach Dell 曾表示，去掉土地、并网排队和传统项目开发开销后，Base 按每 kWh 已部署口径可以低于公用事业级项目经济性。第三，Base 已获得 ERCOT
              Aggregated Distributed Energy
              Resource（ADER）计划资格，分布式机群可以向批发市场投标容量，在零售利润之外增加一层有政策支持的经常性收入。第四，投资人联盟——Addition（领投）、a16z、Lightspeed、CapitalG（Google）、Thrive
              Capital、Ribbit、Valor、Altimeter、Spark、BOND、Lowercarbon——是美国能源创业公司中最可信的跨行业联盟之一，意味着尽调成熟且后续加码意愿强。

              反向逻辑同样具体。按 $12M 2025 年收入计算，$4B 投后估值对应 333× 倍数；按 $70M 2026 年预测收入计算，对应 57× 倍数。只要未来收入倍数低于
              10–20×，几乎所有情景都意味着入场即亏。ERCOT 电网服务市场——最主要的可扩展收入层——两年内下滑 90%（Modo Energy 数据显示，平均电池收入从 2023 年 $149/kW 降至 2025
              年 $29/kW，背后是 BESS 装机容量激增 70×）。Base Power Gen 1 系统净成本约 ~$17,500，在当前市场条件下每年产生约 ~$2,053 总收入，未计融资成本前回本周期即为 8.5
              年。Austin 市政府与公司在 2026 年 3 月共同撤回 $265M 制造激励，也给本土电池工厂执行带来不确定性；该工厂正是 Gen 3 降本逻辑的核心。最后，全国扩张计划依赖复制 ERCOT
              的放松管制零售选择市场结构，而这种结构只存在于少数美国州；受监管公用事业市场需要完全不同且尚未验证的入市打法。

              综合来看，建议是有条件观察 / 跟投：模型有差异化，团队也很强，但当前入场价格预设公司能同时打穿多个尚未验证的维度。若投资人能以 ≤$3B 估值进入，并验证 $70M 2026
              年收入、且至少一个德州以外市场成功启动，风险收益会更站得住脚。按当前 $4B 轮次标记入场，只有长周期、高信念的能源基础设施投资人把它当作平台押注，而非短期回报项目，才有辩护空间。
