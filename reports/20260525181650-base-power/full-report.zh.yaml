            body: >-
              (1) 确认 PUCT Project 53911 ADER 注册以及任何容量使用数据。(2) 获取 ERCOT SOC 合规记录，以及任何不合规事件或待处理罚款。(3) 审查 Base Power 的 PUCT
              REP 案卷，了解投诉历史和财务申报。(4) 要求提供机群管理平台的网络安全审计结果（SOC 2 或同等标准）。(5) 获取 Factory One 生产数据——产能、良率、出货量——验证供应链独立性逻辑。(6)
