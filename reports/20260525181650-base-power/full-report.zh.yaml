      - number: '5.5'
        title: 技术差异化与产品风险
        blocks:
          - type: paragraph
            body: >
              Base Power 的差异化建立在四个叠加因素上；单独复制已不容易，同时复制几乎不可能：(1) 垂直整合的硬件设计，让 Base 同时掌握成本和路线图， 不依赖第三方电池产品品牌；(2) 专有 BaseOS
              软件栈，从固件延伸到云端和 SCADA，使住宅规模也能实现公用事业级调度；(3) 专门构建的部署运营引擎 （许可、物流、安装），可扩展到每周数百套系统；(4) 新的发售电一体化商业模式，Base
              同时扮演发电方（ADER 聚合商）和零售电力提供商， 同步从电网服务、能源套利和客户订阅中获取收入。

              80/20 公用事业调度 / 业主备用电分配，是产品最核心的张力。合同允许 Base Power 为履行电网交易义务，把电池放电到 20% SOC。
              如果一次电网停电紧跟峰价调度事件发生，业主手中的可用备用电可能远低于满电。这是商业模式的结构性特征，不是 bug；CleanTechnica 和独立电气承包商 （Epic
              Electrical）都公开指出，客户会低估这一风险。对希望在持续数天停电中获得有保证全屋备用电的业主而言，20% 下限叠加最坏情况下的高 HVAC 负荷， 会把单电池备用时间压到一小时以内。

              电芯目前从中国进口，带来关税敞口。Austin 工厂将在 2026 年 Q1 开始制造模块、电池包和功率电子，但在 Base 锁定本土或非中国电芯供应商之前， 电芯仍是中国来源输入。ERCOT ADER 试点的
              80 MW 上限（拟扩至 160 MW）仍是 Base 在 ERCOT 电网服务收入的监管天花板； 截至 2026 年 5 月，上限解决方案、节点调度规则和结算框架仍在 ERCOT 内部审查。Texas
              之外的地理扩张，要么需要放松管制市场 （支撑完整发售电一体化模式），要么需要公用事业伙伴关系（支撑受监管公用事业的电池即服务模式）；Base FAQ 提到 Illinois 的 ComEd 账单，
              暗示早期扩张已经启动。
            claimRefs:
              - CE031
              - CE032
              - CE033
              - CE034
              - CE035
              - CE036
              - CE037
