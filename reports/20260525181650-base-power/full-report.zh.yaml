      - number: '6.4'
        title: 留存、耐久性与合同条款
        blocks:
          - type: paragraph
            body: >
              流失率据称接近零：Sacra 记录显示，截至 2025 年 8 月仅有一名客户离开；对任何处在这一增长阶段的订阅服务而言，这都是极低水平。 结构性驱动因素是双合同锁定：10 年电池服务协议（Battery
              Services Agreement）和 3 年电力供应商协议（36 个月）。能源合同在注册和续约时都保证低于市场费率—— Base 服务条款称，续约时会匹配或优于 powertochoose.org
              上的市场平均价格，否则允许客户免费退出电池协议。


              搬家的业主可以把电池协议转给下一任业主，从而降低房屋出售带来的流失。拆除需要支付 $500 人工拆卸费。硬件全程归 Base 所有，并由 Base 覆盖维护和质保。
              备用电明确不得用于生命关键医疗设备，也无法在长时间事件中得到保证。公用事业合作社项目条款不同：GVEC 成员支付一次性 $295 购买价 （无持续电池订阅），El Paso Electric
              参与者无需付费——可获得电池使用权和备用电，但不签直接电力协议。


              截至 2026 年 5 月，除接近零流失这一轶事外，没有公开披露的 NRR、GRR 或队列留存百分比。独立评论聚合器（TrustBurn）显示，
              自选择回复者情绪一致正面，且没有记录在案的退款或法律纠纷模式。本次研究未检索 PUCT 正式投诉数据库；Base Power 提供自己的 PUCT 升级联系页面， 显示其意识到消费者保护义务。
