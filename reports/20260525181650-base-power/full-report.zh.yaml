          - type: callout
            title: ADER 试点依赖是集中度最高的监管风险
            body: >-
              Base Power 参与批发市场取决于 ERCOT ADER 试点计划；该计划由 PUCT 授权，但没有永久法定地位。PUCT 或 ERCOT 可以修改参与规则、冻结容量，或终止试点。50% QSE
              集中度上限意味着，随着 Base Power 机群增长，它将在 100 MW ADER 容量处触顶（200 MW 总量的 50%）。若 ADER
              解散或永久冻结容量，公司最核心的差异化收入机制会被移除；在这张风险图谱中，这是最大的单一否决性风险。
