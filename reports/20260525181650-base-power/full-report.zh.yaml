      - number: '7.2'
        title: 财务、资本与收入风险
        blocks:
          - type: paragraph
            body: >-
              ERCOT 电池经济性已明显恶化。ERCOT 中 BESS 年均收入从 2023 年的 $149/kW 降至 2025 年估计的 $17/kW——大约下滑 90%；主因是辅助服务市场饱和，装机容量从 2023
              年中约 3.3 GW 增至 2026 年初超过 14 GW。同期，辅助服务在 BESS 总收入中的占比从 84% 降至 48%。2025 年，大多数主要 BESS 运营商年初至今盈利率低于
              2.2%。这些变化直接压缩 Base Power 低于市场价客户定价模型所依赖的批发套利收入。

              Base Power 的商业模式在批发电价上形成结构性空头：客户签 3 年合同，支付约 $0.085/kWh 的固定费率外加输配电费用；Base Power 则必须持续管理这一定价与 ERCOT
              实际市场成本之间的价差，并用电网交易收入补足。若批发电价飙升——这在 ERCOT 的 energy-only 市场经常发生——且电网交易收入不足以抵消，亏损由 Base Power 承担。反过来，若批发电价跌破
              Base Power 成本结构，固定客户费率又没有同步重定价机制，利润率会直接蒸发。

              租赁模式（硬件由 Base Power 持有并部署在客户家中）要求持续投放资本：每新增一个安装点，就是一笔必须靠资产生命周期内未来收入回收的资本承诺。2025 年 10 月的 $1 billion Series
              C（投前估值 $3 billion）以及 2023 年以来累计 $1.3 billion 融资提供了可观现金跑道；但 Base Power 向全国扩张时，资本强度会继续叠加。2025
              年上半年，储能公司企业融资同比下降 41%，预示未来融资轮可能面临更严苛条件。

              与 CAISO 或 PJM 不同，ERCOT 的 energy-only 市场没有容量费或长期资源充足性合同。因此 ERCOT 电池运营商无法用签约容量费平滑收入，Base Power
              的经济性完全依赖市场波动和稀缺事件，而这些事件受天气驱动且不可预测。Ascend Analytics（2025 年 5 月）预计，到 2027 年 ERCOT
              将一直走在“受天气左右的刀刃上”，负荷增长快于供给建设，年份之间会大起大落。2025 年 12 月实施的 RTC+B 也在改变 alpha
              来源：从结构性市场设计缝隙转向系统基本面稀缺，压缩了算法能力较弱运营商的回报。

              监管成本敞口进一步放大财务风险：并网补贴超支、PUCT 信用证要求、NERC 合规审计成本，以及潜在 ERCOT 不合规罚款，都会成为持续固定成本，并随机群规模扩大而上升。
