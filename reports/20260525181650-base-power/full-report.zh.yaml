  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现栈
        blocks:
          - type: paragraph
            body: >-
              Base Power 的收入结构刻意叠成四层，每一层承担不同财务功能。第一层、也是最薄的一层，是业主租赁费：一次性安装费 $695（25 kWh）或 $995（50 kWh），再按电池规格收取 $19 或 $29
              的月订阅费，带来可预测但规模有限的经常性现金流。 每户每年订阅收入只有 $228–$348，若仅靠这项费用，约 $7,000 的单台净资本投入需要 20 年以上才能回本，租赁层本身不够支撑经济性。


              第二层更关键，是零售电力价差。Base Power 作为客户的零售电力供应商（Retail Electric Provider），以 8.5 cents/kWh 的固定电价加标准本地输配电费用收费 （Oncor
              区域约 5.8 cents，合计约 13.8 cents）。截至 2026 年 4 月，公司把这一价值主张延伸给不装电池的客户，推出新的 “Base Energy” 计划， 36 个月合同价格为
              13.2–15.7 cents/kWh，把可触达人群扩到公寓住户和不愿安装硬件的客户。Base 从 ERCOT 购买批发电力， 再赚取向客户收取的固定零售价格之上的价差。


              第三层、也可能是毛利最高的一层，是批发电网套利。Base Power 的软件在 ERCOT 现货价格低位或负价时给分布式电池群充电，再在价格高峰窗口释放聚合容量。
              零售业务和批发业务在结构上互相对冲：日内现货价格尖峰会压缩零售价差（固定费率客户仍付 8.5 cents，而 Base 支付升高的批发价）， 同一轮价格尖峰又会同步抬高电池放电收入。Base Power 已获得
              ERCOT Aggregated Distributed Energy Resource（ADER）项目资格， 可把组合后的电池群作为单一虚拟电厂投向批发市场。第四个新出现的层是公用事业容量托管：2026 年 5
              月，Austin Energy 签约 40 MW 电池容量， 按固定且不递增的每千瓦月费支付，最高价值为每年 $4.08 million，十年合计 $40.8
              million。这份容量托管协议可以叠加在同一批已安装电池的既有零售和套利收入之上， 不增加边际硬件成本就改善机群经济性。在 ERCOT 之外的受监管市场，只有容量托管层可用，回本测算会根本改变。
