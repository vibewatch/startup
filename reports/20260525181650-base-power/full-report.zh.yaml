            title: 电网事件中放电至 20%，是最主要的客户投诉向量
            body: >
              在峰值需求电网事件期间，Base Power 合法地将客户电池放电到低至 20% 容量——而这些时段也正是停电风险最高的时候。独立分析师报道
              （EpicElectrical）和论坛用户（TexAgs）都把这列为主要反向体验风险：如果客户在调度事件后遇到与电网同时发生的停电， 可能发现只剩 4–5 kWh 可用备用电。公司称其 ML 模型为 97%
              的历史 ERCOT 停电情景预留了足够电量，但这一说法未经独立验证，且为自报。 对大型住宅或持续数天事件，单靠电池不足，需要补充发电机。
            calloutType: risk
