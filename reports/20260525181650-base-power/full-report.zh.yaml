  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 电池硬件与产品组合
        blocks:
          - type: paragraph
            body: >
              Base Power 的 Gen 1 住宅电池采用 LFP（磷酸铁锂）体系，额定连续输出 11.4 kW，总容量 25 kWh（可用 22.5 kWh）。两台可并联安装，形成 22.8 kW / 50
              kWh（可用 44 kWh）配置。Base 有意选择 LFP，而不是 NMC 或 NCA：发售电一体化（gentailer）商业模式需要高频日循环——夜间从低价电网充电、峰价时放电—— LFP
              比其他化学体系更能承受。系统采用落地式一体化户外机柜；运行范围 14°F 到 122°F，噪音 ≤40 dB（相当于家用冰箱）， 电网停电切换时间记录低于 0.5 秒，快到多数业主不会察觉。设备可承受最高
              88–100 堵转电流（LRA），无需改造即可覆盖大多数住宅 HVAC 系统； 大型机组可选软启动套件。设计寿命为 15 年。

              Base 面向客户销售三类产品：(1) Backup + Energy——旗舰计划，把电池安装与 Base 作为零售电力提供商绑定；(2) Backup Only——只提供电池备用电，
              业主保留当前公用事业关系，在部分地区可用；(3) Base Energy——2026 年 4 月在 Texas 主要 TDU 区域（Oncor、CenterPoint、AEP Central、 AEP
              North、TNMP）推出的无电池、由 VPP 支撑的零售电力计划，面向无法安装硬件的公寓和共管公寓住户。电池系统归 Base Power 所有，不归业主所有； 服务协议为 10 年，拆除费 $500，满五年或
              Base 将费率提高到市场以上时可豁免。公司正在原 Austin American-Statesman 占地 90,000 平方英尺的场地建设第一座自有制造设施， 目标把制造爬坡到 4
              GWh/year；电芯目前来自中国，带来关税敞口，而本土工厂只能部分抵消模块、电池包和功率电子环节的风险。
