      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              Base Power 位于户用光伏加储能、VPP/DER 软件和能源零售商的交叉点，因而很难挑出干净可比公司。最相关的上市可比公司是 Sunrun（RUN）、Fluence Energy（FLNC）和
              Stem（STEM）。Sunrun 是美国最大的户用光伏加储能公司，市值约 $3.5B，企业价值 $17.7B，LTM 收入 $2.96B，对应 EV/revenue 约 5.6×。Fluence Energy
              是公用事业级电池软件和服务平台，FY2025 收入 $2.3B，并指引 FY2026 达 $3.4B；其远期收入倍数约为 1.5–2.5×。Stem（STEM）是最具警示意义的可比对象：2025 年收入
              $156M、权益为负，Macroaxis 估计截至 2026 年中破产概率 >80%。Stem 的轨迹说明，在没有高粘性、经常性收入模式的情况下，资本密集会造成什么后果——Base Power
              的零售电力订阅部分缓解了这一风险，但不能消除。

              私营可比公司中，Uplight（整合 AutoGrid 的 DER 软件平台）2021 年最后估值约 $1.5B；在一次据称目标价约 $1B 的出售流程后，公司现在由 Octopus Energy
              持有多数股权，显示 2021 至 2026 年纯 DER 软件估值已压缩。Renew Home（OhmConnect + Google Nest 合并）控制约 3 GW 户用 VPP 容量，并由 Sidewalk
              Infrastructure Partners 支持，但未披露合并后估值。私募市场可比公司的隐含结论是：没有嵌入式硬件资产的 VPP 软件公司交易估值远低于 $1B；Base Power
              的硬件主导模式足以支撑高于软件同行的溢价，但也必须承受资本重行业固有的倍数压缩风险。

              Base Power 隐含 2025 年收入倍数（333×）在任何阶段的可比能源公司中都没有先例；即使早期纯软件 SaaS 公司，也很少在短暂炒作窗口之外维持 50–100× 以上倍数。2026
              年远期收入倍数（57×）对超高速增长平台更容易辩护，但仍意味着 Base Power 退出时的交易倍数会达到上市可比公司中位数的
              5–10×。最准确的理解是平台期权溢价：投资人买的不是当前收入，而是美国放松管制市场中赢家通吃倾向的户用电池网络。只有当网络效应（客户数据、优化算法、规模化低成本制造）能真正抵御 Tesla
              Energy、Sunrun Battery 以及潜在公用事业赞助项目等资金充足的进入者时，这一溢价才成立。
            claimRefs:
