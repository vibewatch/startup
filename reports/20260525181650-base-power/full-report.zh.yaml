      - number: '7.3'
        title: 运营、安全、网络与执行风险
        blocks:
          - type: paragraph
            body: >-
              Base Power 的租赁模式制造了结构性客户利益冲突：公司可以合法地把客户电池调度到 20% SOC，用于向 ERCOT
              批发市场售电；也就是说，电网停电时，电池未必是满电。消费者论坛和电工咨询网站明确记录了这一风险：在满负荷空调下，一块 25 kWh 电池满电也只能提供 2-5
              小时备用电；若电池刚被调度过，时长会更短。社区论坛讨论显示，部分客户认为自己被备用时长承诺误导，且 20%
              下限会显著压低有效备用上限。若未来极端天气事件让客户在预期有保障的情况下失去备用电，声誉风险和监管投诉风险会急剧上升。

              电池火灾安全是真实但可管理的风险。Base Power 使用 LFP（Lithium Iron Phosphate）化学体系，热失控风险显著低于 NMC 锂离子电芯，但并非免疫火灾。CPSC 在 2026
              年召回约 10,500 套 Tesla Powerwall 2
              系统，原因是第三方电芯缺陷带来过热、起火和灼伤风险——这说明即使工程设计成熟的户用电池系统也可能需要召回。德州各县的消防安全许可要求不同，形成分散的合规负担。Clean Energy Group
              指出，正确安装的电池储能是安全的，但热失控会产生伴随有毒气体的猛烈火灾，且难以扑灭。随着 Base Power 扩展到数万户家庭并每日循环，产品责任敞口会按比例增加。

              云端管理的户用电池机群带来更高网络安全风险。NERC 的 Howard Gugel 指出，对逆变器型资源进行大规模软件更新存在双重问题：它带来运营灵活性，但一旦更新通道被攻破，也可能造成灾难性电网影响。EPRI
              研究员 Sai Ram Ganti 警告，具备双向云连接的电池可由供应商远程操作；若云服务器被攻破，威胁会非常显著。Base Power 的机群管理模式依赖这种双向云连接来实时管理 SOC 并执行 ERCOT
              调度。若 Base Power 机群管理平台遭遇协同网络攻击，可能同时禁用数千块客户电池，构成重大电网可靠性事件和声誉灾难。Brattle/Dragos BESS 网络安全报告（2025 年 12 月）发现，美国
              BESS 部署量每年增长 30%，但网络安全标准和监管要求没有跟上。

              Base Power 全国扩张时，安装商和供应链风险很实质。美国户用电池安装能力承压：专业劳动力需求旺盛，中国电芯关税压缩库存供应并推高成本。2026 年美国户用电池储能部署预计下降
              12%，显示短期逆风。Base Power 的本土制造策略（位于前 Austin American-Statesman 场址的 Factory
              One）从结构上应对供应链风险，但也给一家此前没有工厂运营经验的公司增加了制造执行风险。

              考虑到 Base Power 的公司年龄（2023 年 8 月成立）、野心范围（全国扩张、本土制造、ERCOT 市场参与、REP
              运营），以及领导层在运营大规模能源公用事业或工厂方面相对缺乏经验，执行风险偏高。CEO Zach Dell 具备金融和风险投资背景；COO Justin Lopas 有 Anduril 和 SpaceX
              制造经验，但两人此前都没有带领过如此规模的公用事业级电池机群穿越完整市场周期。
