    layout: standard
    summary: 以 $4B C 轮估值标记为锚，展示不同 2026 年收入情景和退出倍数假设下 Base Power 的隐含估值。
    data:
      series:
        - name: 10x 远期收入
          points:
            - label: $40M 收入
              value: 0.4
            - label: $70M 收入
              value: 0.7
            - label: $100M 收入
              value: 1
            - label: $150M 收入
              value: 1.5
        - name: 20x 远期收入
          points:
            - label: $40M 收入
              value: 0.8
            - label: $70M 收入
              value: 1.4
            - label: $100M 收入
              value: 2
            - label: $150M 收入
              value: 3
        - name: 30x 远期收入
          points:
            - label: $40M 收入
              value: 1.2
            - label: $70M 收入
              value: 2.1
            - label: $100M 收入
              value: 3
            - label: $150M 收入
              value: 4.5
        - name: 57x 当前远期（$4B 入场隐含）
          points:
            - label: $40M 收入
              value: 2.3
            - label: $70M 收入
              value: 4
            - label: $100M 收入
              value: 5.7
            - label: $150M 收入
              value: 8.6
    approximationNotes: >-
      收入情景为分析师估计，基于 Sacra 披露的 2025 年实际收入（$12M）和公司预测的 2026 年收入（$70M）。倍数参考
      Sunrun（5.6x）、Fluence（1.5–2.5x）和高溢价私有成长可比公司（20–30x）校准。$4B 入场参考线对应 $70M 的 57x。
    claimRefs:
