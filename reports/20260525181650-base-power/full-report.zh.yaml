      - number: '6.2'
        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >
              客户增长很快。Sacra 研究显示，2025 年 7 月到 12 月间，Base 新增约 5,500 户；截至 2026 年初，公司官网展示“10,000+ 户由 Base 供能”， TechCrunch
              也佐证其已部署住宅电池容量超过 100 MWh。应用在 2025 年 8 月约有 5,000 次月安装，夏季出现季节性高峰。 到 2025 年末，部署运行率达到每月 20 MW。


              具名客户证言覆盖 Texas 多个市场。在 Base Power 官方评论页，Michael O. 称自己从 Reliant 切换过来，账单下降 39% （从全包 $0.22/kWh 降至 Base
              的透明定价）。David C. 称从 Green Mountain Energy 切换后账单下降 40%。Magnolia, TX 的 Zac 称， 最近一场风暴中，电池让他家连续供电超过 18
              小时且没有中断。Matt M. 称邻居停电 7 小时，而他“根本没察觉”，因为 Base 已经介入。 早期用户 Venkata（太阳能集成）把系统描述为能搭出个人“微电网”，并称赞包括软启动 HVAC
              安装在内的主动系统测试。 Houston 的 Thomas 称他让一位同事也注册了，且不再担心春季雷暴。Waxahachie 的 Bob A. 说，在发现 Base 前，他原本准备购买“最大、最吵的发电机”。


              在 TrustBurn 和独立论坛上，持续出现的主题是：安装专业且准时、客服响应快、相较传统电力供应商账单节省明显。截至 2026 年 5 月， 公开论坛或 BBB 记录中未发现未解决投诉或系统性服务失败模式。
