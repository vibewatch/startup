      - number: '6.3'
        title: 渠道伙伴与安装生态
        blocks:
          - type: paragraph
            body: >
              Base Power 围绕两类不同渠道组织市场拓展：公用事业 / 合作社伙伴关系（B2B2C）和住宅开发商集成（B2B2C 新建住宅）。 到 2026 年 3 月，公司已在 Texas 宣布五项公用事业合作，并在
              2026 年 5 月新增第六个（Austin Energy）。


              公用事业伙伴的模式各不相同：CoServ 和 GVEC 保留电池调度控制权，由 Base 负责安装和维护；El Paso Electric 是受监管公用事业试点， 业主零前期成本获得电池，另有 $250
              付款；Austin Energy 采用容量托管模式，向 Base 支付最高 $4.08M/year，换取 40 MW 预留容量。 对 Bandera Electric 和 Farmers Electric
              等合作社伙伴，成员支付名义前期费用（GVEC 为 $295）和低月订阅费。CoServ 100 MW 协议 （2026 年 3 月）是迄今最大项目，目标是在 CoServ 拥有 330,000 块电表的
              North Texas 区域内新增约 5,000 户。


              安装侧，Charge Pro 等第三方承包商负责实物电池支架和放置，Base 持证电工负责配电箱连接——这种劳动力解耦策略旨在压低单台安装成本。 客户评论中具名出现的安装方包括 Ben 和他的 Charge
              Pro 团队，以及 Dylan 与 Thor 的团队；多位 Houston 地区客户提到过他们。
