            title: 高波动市场中的快速规模化
            body: >
              Base Power 在首次部署后约 18 个月内完成 >100 MWh 住宅电池容量部署，获得 ERCOT 的 ADER 批发项目资格，并在 2026 年 3 月前拿下五个 Texas
              公用事业合作。住宅许可捷径和 Lennar 房屋建造商渠道放大了执行速度，也让公司在分布式储能上形成持久的先发优势。
