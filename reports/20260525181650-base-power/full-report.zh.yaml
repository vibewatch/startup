  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - ADER 试点解散或容量冻结
        - PUCT Project 53911 文件；ERCOT 市场通知
        - 试点终止通知，或容量上限连续 2+ 个季度冻结在 Base Power 注册容量以下
        - 投资逻辑断裂 —— 批发收入机制被移除；重新评估商业模式可行性
      - - ERCOT 辅助服务收入压缩至零售成本基准以下
        - 月度 ERCOT BESS 收入指数（Enverus/Modo Energy）
        - 平均 BESS 收入连续 2 个季度 < $10/kW-year
        - 重大 —— 监测套利或 RTC+B 收入能否补偿；需要做毛利分析
      - - PUCT REP 牌照执法或客户投诉升级
        - 检索 PUCT 案卷中的 Base Power 案件；BBB 投诉数量
        - PUCT 启动正式投诉程序或发出违规通知
        - 投资逻辑断裂风险 —— REP 牌照暂停会叫停客户增长；立即尽调
      - - 客户家中电池起火事件
        - 新闻监测；CPSC Saferproducts.gov 文件；NFPA 报告
        - Base Power 安装现场出现任何已确认热失控事件
        - 重大触发项 —— 立即调查；评估产品责任和召回风险
      - - 集群管理平台网络安全事件
        - SOC 2 审计状态；NERC 合规接触；公开事故披露
        - 确认出现集群管理系统未授权访问或大规模调度事件
        - 极高 —— 电网可靠性事件；ERCOT 罚金；声誉受损；监管问询
      - - Factory One 未达到部署产能目标
        - 月度单位部署率（MWh 已部署）相对计划
        - 工厂投产后连续 3 个月部署率 < 10 MWh/month
        - 重大 —— 影响供应链独立性逻辑；回退到进口硬件采购
      - - 关键高管离职（CEO 或 COO）
        - LinkedIn/PR 监测；投资人沟通
        - CEO 或 COO 离职且没有既定继任安排
        - 投资逻辑风险——评估继任者质量和组织知识交接
      - - 固定费率合约亏损超过储备缓冲
        - 季度财务披露或投资人报告（如有）
        - REP 利润率连续 2 个以上季度转负
        - 投资逻辑破裂——当前批发价格环境下，固定费率模型不可持续
    notes: 终止标准指一旦发生就需要立即重估投资逻辑的事件。行动含义从「监控」（低严重度）到「投资逻辑破裂」（高严重度，需要考虑退出）不等。
