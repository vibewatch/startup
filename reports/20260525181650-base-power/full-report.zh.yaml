      - number: '5.3'
        title: 控制架构、软件栈与 VPP 调度
        blocks:
          - type: paragraph
            body: >
              Base Power 自建了一套端到端专有软件和控制系统，名为 BaseOS。系统覆盖固件（管理电芯级 BMS、传感器、功率电子和 OTA 更新）、
              后端服务（协调机群调度、能源交易、计费和运营物流），以及一层供公用事业伙伴管理聚合资源的原生 SCADA。后端主要用 Golang 和 Python 编写， 运行在 AWS
              上，使用容器化服务（Kubernetes）和 Terraform 管理基础设施，并用 Temporal 编排现实世界的部署和设备控制流程。 固件运行在嵌入式 Linux 或微控制器目标上，使用 C、C++ 或
              Rust。软件负责人 Jared Greene 曾在 SpaceX Starlink 软件团队任职； 许多工程师来自 Anduril、SpaceX 和 Tesla。

              现场连接采用三重冗余：(1) 客户 WiFi 作为主链路，(2) 4G 虚拟蜂窝芯片作为备份，(3) 若公用事业公司已铺设光纤，则使用电表处的光纤连接。 这一架构让 Base 能把连接加硬件强制停运率归类在 5%
              以下——这是公用事业级可靠性主张。ERCOT 调度指令在亚秒级执行； 实际送电功率与指令功率偏差在 1% 以内。公用事业伙伴既可通过网页仪表盘控制电池聚合资源，也可通过 API 直接接入自身能源管理系统。

              在 ERCOT 的放松管制市场，Base 交易算法实时监控批发价格，在价格低位（高风电 / 太阳能时期常为负价）给电池充电，并在价格峰值时向电网调度。 Base 已获得 Texas Aggregated
              Distributed Energy Resource（ADER）试点资格，可把分布式机群作为单一虚拟电厂投向 ERCOT 批发市场。 截至 2025 年 10 月，Base 已用满 ADER 试点下可投标的
              20 MW 容量，并推动提高上限。2026 年 4 月，ERCOT 与 Base Power 召开工作会议， 处理节点调度、结算处理、计量和配电服务商协同等设计问题——这表明该项目的监管框架仍在成熟。
