      - number: '1.2'
        title: 创始人与领导团队
        blocks:
          - type: paragraph
            body: >
              Base Power 由 Zach Dell（CEO）和 Justin Lopas（COO）于 2023 年 8 月共同创立。Dell 当时 29 岁，是 Dell Technologies 创始人
              Michael Dell 之子。他曾在 University of Southern California 学习社会科学、心理学和经济学（2019 届），之后在 Blackstone 任投资人，又加入
              Thrive Capital，并在那里形成了对分布式能源投资逻辑的确信。Lopas 曾任 Anduril Industries 制造负责人，并担任 SpaceX 项目的首席制造工程师。多位投资人认为，Dell
              的金融与战略能力、Lopas 的硬件运营能力形成互补，是降低风险的关键因素。

              扩展领导班底大量来自高精度制造和软件密集型消费硬件背景。Dino Sasaridis（硬件负责人）曾领导 Tesla 的 Powerwall 工程团队。Jared Greene（软件负责人）为 SpaceX
              Starlink 开发过激光网状通信系统。Cole Jones（增长负责人）负责过 Starlink 的市场进入。Dana Paz（部署负责人）曾领导 Anduril 的制造工程团队。Travis
              Kavulla（政策负责人）曾任 R Street Institute 能源与环境政策总监，也曾担任 Montana 公用事业委员。Zina Bash（首席法务官）曾是 Keller Postman 高级合伙人。

              管理层经验高度集中在 SpaceX、Tesla、Anduril、Blackstone 和 Thrive，这带来可见的关键人依赖：Dell 或 Lopas
              离职，既会冲击投资人关系，也会削弱推动快速制造爬坡的运营执行力。
