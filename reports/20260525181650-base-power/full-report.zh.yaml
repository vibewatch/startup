      - number: '5.6'
        title: 图表与材料
        blocks:
          - type: callout
            title: 垂直整合栈形成可防守护城河
            body: >
              Base Power 把硬件设计、本土制造、专有固件和软件（BaseOS）、自有部署运营以及零售电力供应合在一家公司内。这样的整合在 VPP 或电池即服务提供商中少见；
              大多数同行依赖第三方硬件（Tesla、Enphase）和第三方软件（AutoGrid、Itron）。这套栈让 Base 可以在没有供应商依赖的情况下迭代成本、 可靠性和调度速度，并在每一层捕获利润。
            calloutType: strength
            claimRefs:
              - CE017
              - CE018
              - CE021
              - CE031
          - type: callout
            title: 20% SOC 下限意味着备用电不能保证满额
            body: >
              合同允许 Base Power 为服务 ERCOT 电网交易义务，把业主电池放电到 20% SOC。若重大停电开始时业主电池正好处于 20% SOC——这在峰值需求热浪事件中最可能出现—— 可用电量约 4.5
              kWh，相当于高空调负荷下约 1–2 小时全屋备用电。这是产品核心的结构性张力：让经济性跑通的机制（电网套利）， 也正是削弱备用电可靠性的机制。独立电气承包商（Epic
              Electrical）已公开提示这一缺口，并建议加装备用发电机联锁装置来补足。
            calloutType: risk
            claimRefs:
              - CE032
              - CE037
          - type: callout
            title: 中国电芯采购带来关税和供应链敞口
            body: >
              电芯目前来自中国。截至 2025 年 4 月，Base Power CEO 直接承认存在关税敞口。Austin 工厂通过在本土制造模块、电池包和功率电子，缓解部分成本风险；
              但在非中国供应链建立之前，电芯仍是中国来源输入。升级的美中关税（Section 301 及相关措施）可能显著抬高电芯成本、压缩利润率， 或迫使公司在锁定本土电芯来源前调整电池定价。
            calloutType: risk
            claimRefs:
              - CE033
              - CE038
          - type: callout
            title: ERCOT ADER 监管成熟度是关键路径事项
            body: >
              Base Power 已用满其通过 ERCOT ADER 试点可投标的 20 MW。ERCOT 正在审查把上限扩至 160 MW，并等待 2026 年 6 月董事会批准， 但节点调度和结算规则——Base
              变现机群的核心机制——截至 2026 年 5 月仍在 ERCOT 内部审查。上限和结算框架是 Base 在 Texas 电网服务收入天花板的硬约束； 其解决结果将决定 ADER 渠道能否扩展到支撑 Base
              的增长雄心。
            calloutType: insight
            claimRefs:
              - CE023
              - CE024
              - CE035
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与服务区域
        blocks:
          - type: paragraph
            body: >
              Base Power 目前服务一个主要客户原型：位于放松管制 ERCOT 区域的 Texas 业主，他们想要停电保护和更低电费，但不愿为全屋发电机或自有电池承担资本开支。
              公司进一步按获客渠道切分客户群——直接零售注册（覆盖 Oncor、CenterPoint、TNMP、AEP Central 和 AEP North 区域）以及公用事业伙伴推荐 （Bandera
              Electric、GVEC、Farmers Electric、CoServ、El Paso Electric 和 Austin Energy 的成员）。


              第三条渠道是 Lennar 住宅开发商集成，面向 Austin 和 Dallas-Fort Worth 的新房买家：截至 2025 年中，电池在约 20 个 Lennar 社区的施工阶段安装， 包括
              Firefly Pointe（Hutto）、Rancho del Cielo（Jarrell）和 Rancho Canyon（Haslet）。这些买家把电池作为住宅套餐的一部分获得， 并自动加入 Base
              的电力服务。


              完整“发售电一体化（gentailer）”模式在地理上紧紧绑定 ERCOT。El Paso Electric（ERCOT 外的受监管公用事业）和 Austin Energy（ERCOT 内的市政公用事业，
              但不是放松管制的 REP 市场）需要不同的、仅容量托管的模式；业主不从 Base 获得电力零售服务，且通常无前期付款。据 CNBC 报道， Base Power 直接零售客户中约 50%
              已安装太阳能板，使太阳能加储能业主成为关键子分群。2026 年 4 月，Base 推出无电池 “Base Energy” 电力计划，
              面向租户和共管公寓住户开放——这是首个非业主细分市场——覆盖同样五个放松管制的公用事业区域。
