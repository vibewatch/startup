            title: ERCOT 收入压缩是短期商业模式威胁
            body: >-
              ERCOT 的 BESS 辅助服务收入在 2023 年至 2025 年间下降 90%，大多数运营商盈利率低于 2.2%。Base Power 低于市场价的客户定价依赖持续的电网交易收入。若 RTC+B
              和市场饱和继续压缩利润率，靠电池套利补贴客户费率的经济性会明显变弱。RTC+B 下未来 12–18 个月的运营数据，是验证模型的关键。
