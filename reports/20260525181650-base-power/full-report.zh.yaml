      - number: '1.3'
        title: 融资历史与投资人
        blocks:
          - type: paragraph
            body: >
              Base Power 自 2023 年创立以来，三轮已披露融资合计约 $1.3 billion。种子轮 / Series A 阶段提供了初始营运资金；具体条款未公开披露。公司首个已披露的大额融资是 2025 年
              4 月完成的 $200 million Series B，Thrive Capital、Valor Equity Partners、Andreessen Horowitz（a16z）、Lightspeed
              Venture Partners、Altimeter Capital 和 Trust Ventures 等参与领投。房屋建造商 Lennar 也在这一阶段投资。

              六个月后，2025 年 10 月，Base Power 宣布完成 $1 billion Series C，由 New York 机构 Addition 领投。老股东 Andreessen
              Horowitz、Lightspeed、Thrive Capital、Valor Equity Partners 和 Altimeter 继续跟投。新投资人包括 CapitalG（Google
              独立成长基金）、Ribbit Capital、Lowercarbon Capital、Elad Gil、Spark Capital、BOND、StepStone Group、137 Ventures 和
              Salesforce Ventures。《The New York Times》报道称，该轮把公司投前估值定为 $3 billion；投后估值约 $4 billion。Dallas Innovates 称这轮
              Series C 是“全年最大 Series C 之一”。

              累计融资约 $1.3 billion。这些资本正投向 Austin 工厂的本土电池制造、团队扩张，以及 Texas 之外逐州扩张。公开信息尚未披露老股交易或可转债安排；这些仍是尽调缺口。
