      - number: '4.4'
        title: 财务缺口与承保阻碍
        blocks:
          - type: paragraph
            body: >-
              Base Power 在投资者似乎掌握的信息和外部可公开验证的信息之间，存在明显信息不对称。收入估算、部署速度、客户数、已部署 MWh 等顶部牵引指标，
              可以从分析师来源和新闻稿中获得；但所有能验证商业模式的单元经济性指标——毛利率、EBITDA、电池利用率、每 MWh 调度的实际套利收入、 单客户贡献利润率，以及 CAC /
              回本数据——都未公开且未经验证。这形成了一类“公司声称”的单元经济性（3.5 年回本、接近零流失）： 它们可信，也与结构模型一致，但没有独立证据背书。


              承保时有几项具体财务风险必须突出。第一，ERCOT 批发收入取决于市场结构继续有利：ADER 项目仍在成熟（截至 2025 年中，所有参与方实际调度容量只有 15 MW）， QSE
              费用、充电侧配电电价和遥测成本共同抬高门槛，聚合容量约需达到 15–20 MW 之后经济性才有吸引力。第二，受监管市场扩张路径 （El Paso Electric
              试点、Illinois）会剥离零售价差和批发套利层，只剩公用事业容量付款；这还没有证明足以支撑 4 年回本。 第三，电池制造爬坡有运营风险：CEO 称 Factory One 的 Gen 3 生产到 2026
              年中期会“困难”，成本超支或延迟会直接压缩可用于大规模机群部署融资的利润空间。


              合同条款中披露的 80%/20% 电网调度与备用电分配，也会带来持续的声誉和监管风险：如果数小时前刚发生电网交易，真正停电时，期待完整备用电的业主可能发现可用电量只有 20%。 营销价值主张（“48-hour
              backup”）与正常运行条件下实际可用备用电之间的错配，是独立业主评论中最常被提及的反向担忧；若 PUCT 重新审视分布式能源资源聚合商的消费者保护规则， 这可能引发监管审查。
