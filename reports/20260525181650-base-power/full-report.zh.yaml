      - number: '2.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: ERCOT 辅助服务收入崩塌重塑 VPP 经济账
            body: >-
              ERCOT 电网级电池收入从 $149/kW（2023）降至 2025 年预计约 $17/kW（Enverus），跌幅约 90%。同期辅助服务占 BESS 收入比例从 84% 降至 48%。住宅 VPP
              的客户账单平滑价值不依赖批发价格，但在当前 ERCOT 环境下，Base Power 电网服务收入上行空间被明显压缩。稀缺事件仍高度不稳定；2026 年夏季高峰将成为收入模型的关键测试。
            calloutType: insight
            claimRefs:
              - CM027
              - CM028
          - type: callout
            title: 相互矛盾的市场规模估算显示高度不确定
            body: >-
              美国住宅储能 TAM 估算在不同分析师报告间相差两个数量级——从 $174 million（P&S Intelligence，2025，仅硬件）到 $3.5 billion（Emergen
              Research，2024，更宽口径）——取决于是否计入 VPP 电网服务收入、订阅变现和公用事业容量合同。投资人不应使用单一“巨大市场”估算；Base Power 当前模型的相关可服务市场更接近 ERCOT
              SOM（1% 渗透率对应 $42–$84M/yr），而不是 $3.5B 的美国标题数字。
