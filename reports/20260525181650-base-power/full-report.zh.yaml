      - number: '5.4'
        title: 信任、安全、合规与可靠性
        blocks:
          - type: paragraph
            body: >
              Base Power 的 Gen 1 电池系统已完成完整 UL 认证栈：UL 1973（固定应用电池模块安全）、UL 1741（分布式能源资源逆变器和并网设备安全）、 UL
              9540（集成组件层面的系统级储能安全）和 UL 9540A（热失控火灾传播测试证据）。这四项标准组合满足北美市场中 AHJ 验收、 公用事业并网和业主保险的主要要求。本地安装许可遵循由各 AHJ 执行的
              NEC（National Electrical Code）规则；Base 的 Deployment Factory 软件会跨辖区压缩这一许可流程。

              Base Power 的运营可靠性指标均为公司自称，尚未经过独立审计：<5% 强制停运率（含连接和硬件）、亚秒级停电切换、MW 级送电与指令偏差在 1% 以内。 公司称其系统可防护 97%
              的常见电网停电；这一数字来自一个观察：即便电池只能下探到最低 20% SOC，也能提供 3 小时备用电，覆盖 97% 的停电时长。 该数字假设家庭负荷适中；Texas 夏季大量使用 HVAC 时，单台 25
              kWh 电池可能在 3–4 小时内耗尽。

              Base 机群的网络安全攻击面并不小：成千上万台联网电池系统，每台都可通过 API 控制，可能构成聚合电网扰动向量。NFPA 855 和 NEC 安装标准适用于安装层面。 UL 2900 系列和 IEC
              62443 标准与连接栈相关，但 Base 的公开披露没有具体提及。截至 2026 年 5 月，公开记录中未发现监管或执法行动、召回通知或安全事故。
