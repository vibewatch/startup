chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Base Power Company 于 2023 年注册成立，总部位于 Texas 州 Austin 的 305 S. Congress Avenue。公司在 Texas 放松管制的 ERCOT
              市场持有零售电力供应商（REP）牌照，并自称是美国首个同类垂直整合分布式能源平台。其商业网站是 basepowercompany.com。

              这种商业模式有时被称为“gentailer”结构，把硬件所有权、零售供电、软件运营和批发电网交易放在同一个屋檐下。Base 在房主住宅安装 25 kWh（Gen 1：11.4 kW 连续功率）或 50 kWh
              电池系统，一次性收取 $595–$995 安装费，保留电池所有权，收取 $19–$29 月度会员费，并以约 8.0–8.5 ¢/kWh
              的固定电价（另加转嫁配送费）成为房主供电方。公司为停电保留电池备用电，同时调度电池吃 ERCOT 批发价差——夜间低价买电，早晚高峰向家庭和电网放电。客户签订三年期电力合同。Base
              约一半客户拥有屋顶光伏；任何回售电力，Base 按实时批发价另加 3 ¢/kWh 补偿。

              公司首先瞄准 Texas，因为约 85% 的 Texas 居民生活在放松管制电力区域，零售商可以直接签下客户。Texas 批发电价在北美波动最剧烈，给套利留下宽窗口。在受管制市场（其他州），Base
              计划靠公用事业合作扩张，而不是直接面向消费者建立 REP 关系。截至 2026 年 5 月，公司服务 Dallas-Fort Worth、Houston 和 Austin 都市区以及
              Williamson、Bell Counties 的 10,000 多户家庭。
