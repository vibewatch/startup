      - number: '4.2'
        title: 硬件成本结构与单元经济性
        blocks:
          - type: paragraph
            body: >-
              Base Power 的单元经济性由一笔很大的单台电池前期资本开支决定，再靠混合收入在 36 个月或更长服务周期内收回。Sacra 估算， 扣除 $3,000 联邦投资税收抵免之前，Base Power
              每台电池的全包安装成本约 $10,000，公司侧净成本约 $7,000。 面向消费者的安装费（$695–$995）覆盖不到公司净硬件成本的 15%，意味着 Base Power 每次安装先垫出约
              $6,000–$6,300 的补贴。 这种靠补贴融资的模式类似 SolarCity 开创的太阳能租赁打法：只有规模和长周期合同到位，经济性才可持续。


              NREL 2024 Annual Technology Baseline（ATB）把 2023 型号、采用 LFP 化学体系的住宅电池储能包成本基准定在 $283/kWh DC；
              加上逆变器、系统平衡、人工、许可和销售成本后，安装口径约升至 $1,300/kWh。对 25 kWh 系统而言，这意味着市场化安装成本约 $32,500， 远高于 Base Power 面向消费者的价格。Base
              Power 的垂直整合策略——自研设计、制造（Austin Factory One 的 Gen 3）和自有安装—— 目标是把硬件成本压到市场基准以下，但 Gen 3 到 2026 年中期的爬坡会引入制造执行风险。


              Sacra 估算回本周期约为 3.5 年，主要由零售电力价差和批发套利驱动，而不是单靠租赁费。这一 3.5 年窗口假设 ERCOT 批发电价波动稳定、 客户留存持续、ADER
              市场监管准入不变，且电池衰减没有明显不达标。接近零的已报告流失（截至 2025 年 8 月仅流失一名客户）是积极的领先指标， 但毛利率、EBITDA 和单台贡献利润率仍未披露，外部无法独立验证回本模型。系统预留
              20% 电池容量（每台 25 kWh 约 5 kWh）给业主备用电， 剩余 80% 可用于日常电网交易——这是一个结构性承诺，会限制备用电深度，但最大化可变现调度容量。
