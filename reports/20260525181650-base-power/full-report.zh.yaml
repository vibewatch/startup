      - number: '2.2'
        title: 市场规模与 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              多家分析机构对美国住宅储能市场的估算相差很大，取决于是否计入硬件收入、生命周期服务收入，或更广义的能源服务。P&S Intelligence 将 2025 年美国住宅储能市场估为 $174 million，到
              2030 年增至 $604 million（CAGR 约 28%），口径较窄，主要捕捉硬件和服务。Emergen Research 采用更宽口径——包括电网服务合同和软件——将 2024 年美国住宅分部估为
              $3.5 billion，并预计到 2034 年达到 $15.2 billion，CAGR 为 15.9%。估算差异主要来自是否纳入 VPP 电网服务收入和订阅变现路径。截至 2026
              年初，美国累计住宅电池储能装机约 9 GWh，仅 2025 年就部署 3.1 GWh，同比增长 51%，来源为 SEIA/Benchmark Mineral Intelligence Energy Storage
              Market Outlook Q1 2026。

              单看 ERCOT，Texas 有望在 2026 年超过 California，成为美国最大电池储能市场；进入 2026 年时，电网级 BESS 容量达到 14 GW，是 2025
              年的两倍。住宅和分布式储能仍小得多，但增长很快。Base Power 已获资格的 ERCOT ADER 试点在 2025 年中将全系统上限从 80 MW 扩到能量 160 MW、non-spin 和 ECRS 各
              80 MW。Texas 家庭层面，电池价格已降至约 $117/kWh，约为 2023 年成本的三分之一，扩大了潜在可服务基础。

              自下而上的 Texas SOM 估算：ERCOT 服务约 12 million 住宅电表。1–2% 的年度渗透率（Base Power 声称的目标）对应 120,000–240,000 户。按平均系统 20
              kW（两块 11.4 kW/25 kWh 电池）和 $29/月订阅计，每 1% 年度渗透率可转化为约 $42–$84 million 年化订阅收入，不含电网服务收入。如果 ERCOT 渗透率达到 1%，ADER
              容量将约为 2.4 GW 聚合住宅电池群，远超当前试点上限，说明市场获取的约束在监管扩容空间，而不是需求或硬件成本。

              全球 VPP 市场——Base Power 的参照同业组——2026 年估值约 $6–7 billion；按 GMInsights，美国住宅分部预计到 2035 年单独达到 $11.5 billion，CAGR
              为 22.5%。矛盾估算予以保留：分析师报告中 2026 年全球市场规模从 $4.1B 到 $6.7B 的大幅分散，反映的是方法论差异，即“市场规模”到底计算 VPP 平台收入、DER 硬件，还是电网服务交易额。
