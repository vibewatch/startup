      - number: '3.2'
        title: 直接竞争对手画像
        blocks:
          - type: paragraph
            body: >
              **Tesla（Powerwall + Autobidder + Tesla Electric）** 是 Base Power 最可信的多维竞争对手。Tesla Powerwall 3 容量为 13.5
              kWh、连续输出 11.5 kW，在 Texas 安装价为每台 $10,000–$13,500（未计 Oncor $4,500 返利）。Tesla 在 ERCOT 以 REP 身份运营 Tesla
              Electric，其 Autobidder 软件把住宅 Powerwall 聚合成电网服务资产——商业模式与 Base 相同。Tesla 的 Texas VPP 项目向房主补偿约
              $33/Powerwall/月账单抵扣，另加约 $0.05/kWh 外送电收益，典型参与总补偿约 $786/年。Tesla 优势在品牌认知、内部电芯制造、EV 集成，以及深厚的 Autobidder
              市场经验。劣势在前期成本高、市场进入路径以光伏为中心，以及电池容量小于 Base 的 25 kWh 单元；这一区别会影响 ERCOT 4CP 输电成本管理和单台电网收入。Tesla
              架构还要求房主购买（消费者资产重），而不是 Base 提供的资产轻订阅。


              **Sunrun（NASDAQ: RUN）** 是全美最大住宅光伏加储能提供商，拥有 1 million 多名光伏客户和 116,000+ 套已安装储能系统。在 Texas，Sunrun 已分别与
              NRG/Reliant（目标到 2035 年建成 1 GW VPP，初始部署 150 MW）和 Vistra/TXU Energy 建立合作。Sunrun 的 California CalReady 项目在
              16,000 户家庭中平均调度 48 MW 峰值，强力证明住宅聚合可规模化。Sunrun 的竞争弱点是债务高（$14 B+ 负债）、获客成本约
              $7,000/客户，以及据报道净推荐值偏低，反映安装延迟和售后服务问题。Sunrun 要求房主已有或安装光伏，因此结构上无法服务非光伏家庭——Base 的纯电池模型覆盖两类家庭。


              **Sonnen（SOLRITE VPP）** 于 2026 年 2 月与 SOLRITE Energy 在 ERCOT 推出项目，目标到 2026 年底达到 10,000 名客户和 600 MWh/144 MW
              容量。Sonnen 的方案——60 kWh 储能、月费 $20、全包零售电价 12¢/kWh——在每 kWh 备用电价格上直接竞争 Base 会员方案。Sonnen 由 Shell 持有（2019
              年收购），资产负债表支持雄厚。Sonnen 电池（ecoLinx 代）面向零售买家时提供 15,000 次循环 / 15 年质保，安装成本为 $1,200–$1,500/kWh；在订阅 VPP
              场景中，这套高端硬件被重新定位。Sonnen 第 11 代电池正与 Solrite 部署，按堆叠数量提供 6/12/18 kW 功率输出。200 MW ADER 试点上限是共同约束；Sonnen 144 MW
              目标与 Base 直接争夺这部分监管空间。


              **Generac（PWRcell + Enbala/Concerto DERMS）** 是美国主导性备用发电机品牌（约 75% 市场份额），并通过 PWRcell 住宅储能和 Enbala/Concerto
              DERMS 平台转向清洁能源。截至 2026 年初，Generac 清洁能源分部贡献约 60% 总收入。Generac 住宅电池提供 9–18+ kWh 可扩展容量，浪涌能力强，并可为光伏做直流耦合。不同于
              Base，Generac 通过经销商网络销售，而不是直接持有资产；它争夺相同的 Texas 安装商心智和房主注意力。Generac Power Systems 还销售丙烷 / 天然气备用发电机（安装价
              $10,000–$20,000+），这是 Base 正在替代的主要既有现状选项。


              **Fluence/AutoGrid（软件层竞争对手）** 瞄准公用事业 DERMS 和 VPP 软件市场。Fluence（NASDAQ: FLNC）雇用约 1,670
              人，运营成熟的公用事业级和电网服务软件栈；AutoGrid 被 Schneider Electric 收购、现并入 Fluence，为公用事业提供 VPP 编排和 DERMS 软件。这些玩家不争夺房主，而是争夺
              Base 在受管制市场扩张中同样想拿的公用事业合同——如果公用事业采购 AutoGrid 作为 DERMS，就可能把资产群管理内化，而不是外包给 Base。
