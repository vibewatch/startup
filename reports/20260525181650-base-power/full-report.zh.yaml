      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Base Power 市场最强增长驱动，是 Texas 结构性需求增长与住宅 VPP 变现监管支持叠加。人口增长、数据中心建设和电气化推动 ERCOT
              用电需求快速上升，促使州监管机构一方面简化住宅电池许可，另一方面扩大 ADER 试点。IRA 对独立住宅电池储能提供 30% 联邦投资税收抵免，至少执行到 2032
              年，可将电池采购有效成本降低近三分之一，并直接改善 Base Power 硬件单位经济。

              FERC Order 2222 于 2020 年定稿，到 2026 年进入高级实施阶段，为 FERC 管辖 ISO（不含 ERCOT，后者属州级）中的聚合 DER 参与批发市场扫清障碍。虽然 Base Power
              当前 Texas 市场不受 FERC 管辖，但 Order 2222 为公司计划进入的全国扩张市场提供模板。在 ERCOT 内，Public Utility Commission of
              Texas（PUCT）监管的 ADER 试点发挥同样功能，Phase 3 在 2025 年中将上限扩至 160/80/80 MW。

              关键约束包括：（1）ERCOT 电网级 BESS 收入压缩——平均电池收入从 2023 年 $149/kW 降至 2025 年预计约 $17/kW，压缩住宅 VPP
              可获取的电网服务收入池；（2）房主切换成本和注册摩擦，需要签订多年电池生命周期协议；（3）联邦政府更迭下的 IRA 政策风险，可能削减 30% ITC 或对上游电池组件加征关税；（4）快速部署的资本强度——部署
              100 MW 住宅储能需要硬件、人工和资产负债表融资同步放大；（5）ERCOT 2 秒 ADER 遥测要求下的互操作性和遥测门槛，提高了聚合商技术门槛。

              一个重大反向信号：ESS News 和 Enverus 在 2025 年底报道，ERCOT BESS 运营商年初至今盈利率低于 2.2%，能源套利并未抵消辅助服务价格崩塌。这直接压缩 Base Power
              可用于抵扣客户账单、维持有竞争力订阅价格的电网服务收入。如果 2026 年夏季高峰没有出现稀缺事件，Base Power 收入模型将承受利润率压力。
