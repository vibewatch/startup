    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 全队列单位经济性
        - 按当前（非峰值）市场费率审计每块电池每 kW ERCOT 收入、每客户月度零售利润率，以及每已部署 MWh 的混合全成本
        - 当前公开估计（Sacra、GreenCarFuture）差异很大；8.5 年与 3.5 年的回本周期差距让估值完全无法确定
        - 申请数据室访问；用 ERCOT 结算数据和公用事业账单记录交叉核验
      - - 股权结构表和优先股堆叠
        - Series C 后完整股权结构表，包括优先股类别、清算优先权倍数（1x 与 2x）、参与权和反稀释条款
        - 以 $4B 入场且有 $1.3B 优先股悬顶，普通股分配瀑布结构性劣后；缺少这些条款就无法分析回报
        - 法务审阅 COI 和投资人权利协议；Wilson Sonsini 为所有轮次提供顾问服务
      - - Gen 3 制造计划
        - 已签署的厂房租约或建设合同、设备采购时间表、目标产能（MWh/年），以及到 2027 年的单台成本曲线
        - 整个乐观情景和降本投资逻辑都押在这里；城市激励告吹且截至 2026 年 5 月无已确认工厂，是重大反向信号
        - 现场走访；独立制造顾问审查；TDLR 注册数据
      - - 全国扩张监管地图
        - 至少两个 ERCOT 以外零售选择州的市场进入计划，包括监管要求、并网规则和公用事业合作状态
        - ERCOT 放松管制有独特性；PJM、ComEd 和 NY 市场规则差异很大，可能需要不同模型或更长获客周期
        - 目标州监管律师；市场进入可行性研究
      - - 队列留存曲线
        - 按地区、安装队列和客户细分（新建 vs. 改造）拆分的客户级流失与留存数据
        - 单个已报告客户流失（2025 年 8 月）不足以做统计评估；全国扩张后，队列留存就是 LTV 的核心指标
        - 数据室 CRM 和账单数据；覆盖多个队列的 50+ 客户独立调研
      - - 竞争响应准备度
        - 面对 Tesla Powerwall+、Sunrun Battery 以及潜在公用事业赞助电池租赁计划时的防御证据
        - 在 $4B 市值下，任何大型竞争者进入 Texas 住宅电池即服务赛道，都会立刻制造价格压力
        - 竞争情报报告；围绕切换成本和 NPS 的客户访谈
    notes: 所有尽调清单项在任何超过 $50M 的投资前都是强制项。第 1、2 项（单位经济性和股权结构表）是闸门——无论轮次估值如何，缺少它们都不应推进投资。
    claimRefs:
      - CV012
      - CV017
