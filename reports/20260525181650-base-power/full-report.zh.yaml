      - number: '4.3'
        title: 资本充足度与融资架构
        blocks:
          - type: paragraph
            body: >-
              Base Power 在运营前两年半累计完成约 $1.3 billion 股权融资，使其成为美国资本最充足的早期分布式能源平台之一。2025 年 4 月 Series B 融资 $200 million， 由
              Addition、Andreessen Horowitz、Lightspeed Venture Partners 和 Valor Equity Partners 共同领投，Thrive
              Capital、Altimeter 等参投。 六个月后，2025 年 10 月 Series C 完成 $1 billion，由 Addition 领投，投前估值 $3 billion、投后估值 $4
              billion，新投资方包括 CapitalG、Ribbit、 Spark、BOND 和 Lowercarbon，所有老股东也继续跟投。已披露融资总额目前约为 $1.3
              billion。公司尚未披露项目融资或债务额度， 但其重资产机群模式在结构上适合类似太阳能租赁证券化的资产支持融资；若能接入，会显著延长现金跑道。


              资本投放速度很高。按 2025 年末每月 20 MW 的节奏——在 25 kWh 档约等于每月 800 台电池——以及单台净成本 $7,000 计算， Base Power 仅硬件一项、未计运营开支，每月就在烧约
              $5–8 million。公司刚拿到 $1 billion Series C 新资金，且 2025 年收入估计为 $12 million， 即便部署目标激进，仍有可观现金跑道，但尚未能自我造血。Series C
              资金的主要已宣布用途包括：Texas 以外的全国扩张、建设 Factory One （原 Austin American-Statesman 场地）、规划第二座工厂，以及扩大 Gen 3 电池生产。Austin
              Energy 容量托管协议（$4.08M/year） 和 CoServ 合作（Denton County 100 MW）提供了部分收入可见性，但仍只是已投资本的一小部分。


              目前融资架构是纯股权，因此主要资本结构风险是稀释，而不是债务契约或再融资触发项。不过，这一模式的长期可扩展性取决于三条路之一： (a) 现有 Texas 机群达到现金流盈亏平衡，(b)
              获得项目融资或证券化资本，把机群增长移出资产负债表融资，或 (c) 持续以有利估值融资。 选项 (c) 取决于维持 $4 billion 投后估值轨迹，这要求公司达成 2026 年 $70 million
              收入目标，并且毛利率出现实质改善。
