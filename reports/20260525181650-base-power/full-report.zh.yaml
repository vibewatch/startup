      - number: '8.2'
        title: 估值背景与融资结构
        blocks:
          - type: paragraph
            body: >
              Base Power 的融资历史显示轮次间隔快速压缩：种子轮（$7.8M，2023 年 8 月）、Series A（$68M，推断为 2024 年）、Series B（$200M，2025 年 4
              月）、Series C（$1B，2025 年 10 月），不到两年半累计融资 $1.3B。Series C 由 Addition 的 Lee Fixel 领投；他在 Series B 加入董事会。B 轮到 C
              轮只隔 6 个月，金额从 $200M 跳到 $1B，是美国能源创业史上最快的加码周期之一，显示投资人强烈相信短期部署动能。Series C 投前估值为 $3B（TechCrunch 援引 The New York
              Times），意味着 $1B 投资在未稀释基础上买入约 25% 股权；但真实经济权益取决于未公开的优先权条款。

              相对 $4B 投后估值，累计投入资本（$1.3B）意味着估值约为累计融资额的 3.1×；对于这一阶段的高增长风险投资公司，这并不算异常偏高。但从 LP 回报角度看，关键约束在于：任何低于 $5–6B 的 IPO
              或 M&A 退出（约为投入资本的 4–5×）都可能让后期投资人失望，尤其是在四轮融资清算优先权堆叠之后，标准门槛通常是 2–3×。$1.3B 累计资本带来的优先权悬顶（假设 1×
              清算优先权）意味着，普通股股东要等第一笔 $1.3B 返还后才有分配，后期优先股投资人还可能持有参与型或高级优先权结构。这些条款未公开披露，是重大尽调缺口。

              二级市场信号提供的价格发现有限：截至 2026 年 5 月，Notice.co 列出的 Base Power 股份价格约为每股
              $10.65–$11.04。若不知道股权结构表中的总股数，就无法直接反推隐含总估值；但 Forge、Hiive 和 EquityZen
              上存在活跃二级交易，确认投资人有流动性需求，也暗示当前一级轮估值标记在二级交易中尚未明显压缩。Forge Global 将 Base Power 标为 IPO 状态里程碑“Confidential
              Filing”，这与 2026–2028 年收入扩大至 $150–300M 后可能 IPO 的窗口相一致。

              按 $4B 标记入场，投资纪律要求投资人相信 Base Power 退出时可维持 5–10× 收入倍数——也就是 $400M–$800M 终局收入。到 2027–2028
              年，只有同时满足以下条件才可能实现：(1) ERCOT 每 kW 收入稳定在 $40/kW 以上，(2) Gen 3 制造计划将电池成本降低 30–40%，(3) 全国扩张在 2027
              年前至少新增两个市场，(4) 德州以外客户队列经济性得到验证且流失率接近零。每一项单独看都合理；四项同时成立，才是完整投资逻辑。
