companyProfile:
  summary: >-
    Base Power is an Austin-based residential battery operator that combines home energy storage, retail
    electricity supply, and virtual-power-plant dispatch into a single customer offer. The company installs
    and owns 25–50 kWh battery systems at homes, signs customers onto fixed-rate electricity plans, and
    monetizes the aggregated fleet in ERCOT through wholesale and pilot-program participation. Public
    evidence supports unusually fast early deployment and funding velocity, but not yet the mature financial
    disclosures needed to underwrite the business at its latest private valuation.
