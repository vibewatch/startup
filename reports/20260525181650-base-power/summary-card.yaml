  topStrengths:
    - >-
      Base Power has scaled quickly in Texas, reaching 10,000+ homes and 100+ MWh of deployed residential battery
      capacity within roughly two years of founding.
    - >-
      The company pairs hardware, electricity retailing, and ERCOT grid-services participation in a vertically
      integrated model that is difficult for single-layer competitors to copy directly.
    - >-
      A top-tier investor syndicate and channel partnerships with Lennar and multiple Texas utilities validate strong
      early market access.
  topRisks:
    - >-
      The $4B valuation implies extremely high revenue multiples relative to public storage and DER comps, leaving
      little room for execution misses.
    - >-
      ERCOT battery market revenues have compressed sharply as storage capacity saturates, directly threatening the
      grid-services layer of Base Power's unit economics.
    - >-
      The customer promise of backup power can conflict with Base Power's right to discharge batteries for grid trading,
      creating reputational and retention risk during outage events.
    - >-
      National expansion beyond ERCOT remains largely unproven because the model depends on deregulated retail-power
      conditions that do not exist in most U.S. markets.
  unresolvedGaps:
    - Audited revenue, gross margin, and per-customer unit economics are not publicly disclosed.
    - >-
      Cap-table dilution, liquidation preferences, and the current secondary-market implied valuation are not
      transparent enough to underwrite late-stage entry.
    - Verified headcount, board composition, and formal governance/control-rights disclosure remain incomplete.
    - >-
      There is not yet public proof that Base Power can reproduce its Texas model in a second market with comparable
      economics.
