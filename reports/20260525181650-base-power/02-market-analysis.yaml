  - id: market-sizing
    title: Market Sizing and TAM/SAM/SOM
    body: >-
      Multiple analyst estimates bracket the U.S. residential energy storage market at materially different
      levels depending on whether they count hardware revenue, lifetime service revenue, or broader energy
      services. P&S Intelligence sized the U.S. residential storage market at $174 million in 2025 growing
      to $604 million by 2030 (CAGR ~28%), capturing hardware-and-services on a narrower perimeter.
      Emergen Research took a broader perimeter—including grid-services contracts and software—and valued
      the U.S. residential segment at $3.5 billion in 2024, projected to reach $15.2 billion by 2034 at a
      CAGR of 15.9%. The discrepancy across estimates arises primarily from the inclusion or exclusion of
      VPP grid-services revenue and subscription monetization paths. As of early 2026, U.S. cumulative
      residential battery storage installations reached approximately 9 GWh, with 3.1 GWh deployed in 2025
      alone—a 51% year-over-year increase—according to the SEIA/Benchmark Mineral Intelligence Energy
      Storage Market Outlook Q1 2026.

      For ERCOT specifically, Texas is on track to surpass California as the largest U.S. battery storage
      market in 2026, with grid-scale BESS capacity reaching 14 GW entering 2026, double the 2025 level.
      Residential and distributed storage is a much smaller but fast-growing subset. ERCOT's ADER pilot
      (which Base Power has qualified for) expanded its system-wide cap from 80 MW to 160 MW for energy
      and 80 MW each for non-spin and ECRS in mid-2025. At the Texas household level, battery pricing has
      fallen to roughly $117/kWh—about one-third of 2023 costs—widening the potential addressable base.

      A bottom-up SOM estimate for Base Power in Texas: ERCOT serves approximately 12 million residential
      meters. A 1–2% annual penetration rate (Base Power's stated target) yields 120,000–240,000 homes.
      At an average system of 20 kW (two 11.4 kW/25 kWh batteries) and a $29/month subscription, that
      translates to roughly $42–$84 million in annualized subscription revenue per year of penetration,
      before grid-services revenue. The ADER capacity at 1% penetration across ERCOT would be
      approximately 2.4 GW of aggregated residential battery fleet, well in excess of the current pilot
      cap, indicating regulatory expansion headroom is the binding constraint on market capture rather than
      demand or hardware costs.

      The global VPP market—Base Power's reference peer group—was valued at approximately $6–7 billion in
      2026 and is expected to reach $11.5 billion in the U.S. alone by 2035, growing at a CAGR of 22.5%
      for the residential segment, according to GMInsights. Contradictory estimates are preserved: the
      wide dispersion across analyst reports (from $4.1B to $6.7B globally for 2026) reflects genuine
      methodological differences in whether "market size" counts VPP platform revenue, DER hardware, or
      grid-services transaction volume.
