  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for Base Power
      - Diligence Ask
    rows:
      - - IRA 30% residential battery ITC (standalone storage eligible since 2023)
        - Growth driver
        - Current (through 2032)
        - Lowers effective hardware cost ~30%; improves unit economics on battery deployment
        - Confirm IRA credit applicability to Base Power's ownership/subscription model vs. homeowner-owned
      - - ERCOT ADER pilot expansion (Phase 3, 160/80/80 MW cap)
        - Growth driver
        - Current (Phase 3 active mid-2025)
        - Opens larger ERCOT wholesale revenue pool for Base Power's aggregated fleet
        - Monitor PUCT rulemaking for permanent ADER rules to replace pilot; timing risk
      - - Texas population and load growth (data centers, electrification)
        - Growth driver
        - Current and accelerating
        - Increases utility demand for DER capacity alternatives; improves Base Power's utility partnership pipeline
        - Verify Base Power pipeline of utility partnerships beyond five current Texas cooperatives
      - - Battery cost deflation (~$117/kWh in 2025, ~67% below 2023)
        - Growth driver
        - Current and continuing
        - Reduces hardware capex per installation; widens addressable homeowner income bracket
        - Assess Base Power's battery sourcing agreements and cost trajectory; tariff risk on imported cells
      - - ERCOT grid-scale BESS revenue compression (ancillary revenue fell ~90%, 2023–2025)
        - Adoption constraint (adverse)
        - Current; partially structural
        - Reduces grid-services revenue available to offset customer subscription prices; margin pressure
        - Model downside scenario where no major ERCOT scarcity event occurs in 2026 summer
      - - Outage risk and Texas grid reliability anxiety post-2021 Uri
        - Growth driver
        - Persistent; amplified by each summer peak or winter event
        - Primary demand pull for homeowner segment; strong organic word-of-mouth channel
        - Track customer acquisition cost and organic vs. paid mix as market matures
      - - IRA policy uncertainty (tariffs on battery cells, potential ITC rollback)
        - Adoption constraint
        - Near-term risk (2025–2026 federal policy actions)
        - SEIA noted "severe risk" to planned Texas solar/storage capacity from new federal policies
        - Assess Base Power's domestic manufacturing (Austin factory) as tariff hedge; timeline and scale
      - - Homeowner switching cost and enrollment friction
        - Adoption constraint
        - Persistent
        - Slows organic churn risk but also slows initial enrollment conversion
        - Review cancellation rate and contract term; multi-year lock-in creates lifetime value floor
      - - ERCOT ADER telemetry and interoperability requirements (2-second telemetry mandate)
        - Adoption constraint
        - Current
        - Technical bar raises operating complexity; potential bottleneck at scale
        - Confirm Base Power's ADER qualification status and any telemetry compliance gaps
      - - Competition from Tesla Powerwall / Tesla Electric VPP, Sunrun, Bandera ADER
        - Adoption constraint
        - Current
        - Competing aggregators with more installed base or brand recognition compress addressable pool
        - Map Head-to-head Base Power win rate vs. Tesla, Sunrun in overlapping territories
    notes: >-
      Driver/constraint classification based on analyst reports, regulatory filings, and news coverage as of
