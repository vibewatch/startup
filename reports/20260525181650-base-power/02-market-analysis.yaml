company:
  name: Base Power

chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Base Power operates in two nested markets—the U.S. residential energy storage segment (≈$3.5 B+ TAM,
    growing at 15–28% CAGR) and the more proximate ERCOT residential virtual power plant (VPP) market,
    where a fast-scaling regulatory framework (ADER pilot), the IRA 30% storage ITC, and extreme summer
    price events create strong adoption pull. Grid-scale BESS revenue compression in ERCOT—down roughly
    90% from 2023 peaks—is a structural constraint that sharpens the case for customer-bill-smoothing and
    utility-partnership revenue models rather than pure wholesale arbitrage, but the residential VPP TAM
    addressable for Base Power's model remains large and underpenetrated.

sections:
  - id: market-boundary
    title: Market Boundary and Definition
    body: >-
      Base Power's market boundary spans two concentric layers. The outer layer is the U.S. residential
      energy storage market, encompassing hardware (lithium-iron-phosphate battery systems, inverters,
      controls), software-enabled grid services, and retail electricity plans bundled with home battery
      infrastructure. Included spend covers: installed battery systems (capex or subscription), ongoing
      maintenance and software subscriptions, and grid-services revenue shared with homeowners or retained
      by the aggregator. Excluded from Base Power's direct addressable market are utility-scale BESS
      (grid-scale projects above 1 MW per site), commercial and industrial storage systems without
      residential hosting, and rooftop solar-only installations without storage.

      The inner, immediately addressable layer is the ERCOT residential VPP market—specifically the
      aggregation of sub-1 MW home batteries dispatched into ERCOT wholesale energy and ancillary-services
      markets under the Aggregate Distributed Energy Resource (ADER) pilot and successor rules. Texas is
      the primary operational geography, but the broader U.S. deregulated residential market (CAISO,
      NYISO, PJM, and others) is the expansion addressable market as Base Power moves beyond Texas.

      Status-quo substitutes for Base Power's offer include: (a) traditional retail electricity plans with
      no storage, where customers absorb outage risk and volatile summer bills; (b) standalone rooftop
      solar net-metering arrangements, where homeowners earn bill credits but do not have backup power or
      grid-services participation; (c) standalone backup generators (propane/natural gas), which provide
      outage protection but no grid revenue and require fuel; and (d) competing battery programs from
      Tesla Powerwall paired with Tesla Electric, Sunrun VPPs, and emerging ERCOT ADER-qualified
      aggregators. The primary switching cost for residential customers is the installation process and
      the multi-year battery lifecycle commitment—once a battery is installed and enrolled in a VPP
      program, switching aggregators involves hardware logistics and new enrollment steps.
