  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Base Power subscription standalone economics
      missingEvidence: >-
        Base Power's grid-services revenue per enrolled home battery, and whether the subscription
        model ($19–$29/month) is financially viable without ERCOT scarcity event revenue.
      whyItMatters: >-
        If grid-services revenue is insufficient to cover battery hardware and maintenance costs at
        current ERCOT ancillary price levels, the subscription price would need to rise, reducing
        the addressable market and widening the gap between the stated SOM and reality.
      diligencePath: >-
        Request Base Power's unit economics model per installed battery: revenue split (subscription
        vs. grid services), hardware depreciation, installation cost, and maintenance cost per year.
      relatedQuestionRefs:
        - QM027

