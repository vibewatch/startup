        all active ERCOT aggregators (Tesla, Base Power, Bandera, CoServ, others).
      whyItMatters: >-
        Base Power's stated 1–2% annual penetration target is company-claimed and unverified;
        actual conversion rates from eligible homeowners would bound the SOM more tightly.
