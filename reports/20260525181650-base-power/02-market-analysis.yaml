      25.5 MW of active capacity representing roughly 5,000–12,000 enrolled residential units across all
      ERCOT aggregators. Total ERCOT meters from ERCOT/PUCT data; homeownership rate from U.S. Census
      Texas state estimate. Do not treat as Base Power-disclosed enrollment data.
    claimRefs:
      - CM013
      - CM014
      - CM015

callouts:
  - calloutType: insight
    title: ERCOT Ancillary Revenue Collapse Reshapes VPP Economics
    body: >-
      ERCOT grid-scale battery revenue fell roughly 90% from $149/kW (2023) to approximately $17/kW
      projected for 2025 (Enverus). Ancillary services dropped from 84% to 48% of BESS revenue over
      the same period. While residential VPPs benefit from customer bill-smoothing value independent of
      wholesale prices, Base Power's grid-services revenue upside is materially compressed in the
      current ERCOT environment. Scarcity events remain highly variable; the 2026 summer peak will be
      a key test of the revenue model.
    claimRefs:
      - CM027
      - CM028

  - calloutType: risk
    title: Contradictory Market Sizing Estimates Signal High Uncertainty
    body: >-
      U.S. residential storage TAM estimates span two orders of magnitude across analyst reports—from
      $174 million (P&S Intelligence, 2025, hardware-only) to $3.5 billion (Emergen Research, 2024,
      broader perimeter)—depending on whether VPP grid-services revenue, subscription monetization, and
      utility capacity contracts are counted. Investors should not use a single "large market" estimate;
      the relevant addressable market for Base Power's current model is closer to the ERCOT SOM
      ($42–$84M/yr at 1% penetration) than to the $3.5B U.S. headline.
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM031

  - calloutType: strength
    title: IRA 30% ITC Provides Durable Tailwind Through 2032
    body: >-
      The Inflation Reduction Act's 30% residential battery Investment Tax Credit applies to standalone
      battery systems (≥3 kWh) installed from 2023 through at least 2032, regardless of solar pairing.
      This substantially reduces the effective hardware cost for residential battery deployment and
      supports Base Power's economics on systems it installs. Domestic manufacturing (Base Power's
      planned Austin factory) may also qualify for additional IRA manufacturing credits, potentially
      further improving margins.
    claimRefs:
      - CM023
      - CM024

  - calloutType: assumption
    title: ERCOT Summer 2026 Scarcity Events Are a Material Revenue Variable
    body: >-
      Base Power's subscription model relies in part on grid-services revenue from ERCOT wholesale
      markets to subsidize low customer prices. Historically, extreme summer heat events (2023: $5,000/MWh
      peak prices) generated outsized BESS revenue concentrated in just a few days. If summer 2026 is
      mild, grid-services revenue will be minimal, testing the model's standalone subscription
      economics. This is an open diligence question that requires a summer 2026 post-mortem.
    claimRefs:
      - CM026
      - CM027
      - CM029

