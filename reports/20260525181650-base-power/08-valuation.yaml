  - id: valuation-context
    title: Valuation Context and Financing Structure
    body: >
      Base Power's funding history traces a rapid compression of time between rounds: Seed ($7.8M, August 2023),
      Series A ($68M, implied 2024), Series B ($200M, April 2025), Series C ($1B, October 2025), with total
      capital raised of $1.3B in under two and a half years. The Series C was led by Addition's Lee Fixel, who
      joined the board at Series B; the six-month interval between B and C — $200M to $1B — is among the fastest
      re-up cycles in U.S. energy startup history and signals strong investor conviction in near-term deployment
      momentum. The pre-money valuation at Series C was $3B (per TechCrunch citing The New York Times), implying
      that the $1B invested bought approximately a 25% stake on an undiluted basis, though the actual economic
      interest depends on preference terms that are not publicly disclosed.

      The total capital deployed ($1.3B) relative to the $4B post-money valuation implies a round-to-round
      mark-up of approximately 3.1× total-raised-to-valuation — not unusually stretched for a high-growth
      venture at this stage. However, from an LP return perspective, the critical constraint is that any IPO
      or M&A exit below $5–6B (approximately 4–5× invested capital) is likely to disappoint late-stage
      investors with standard 2–3× hurdle rates, particularly after accounting for preference liquidation
      stacks across four rounds. The preference overhang from $1.3B in cumulative capital (assuming 1×
      liquidation preferences) means that common stockholders receive nothing until the first $1.3B is
      returned, and late-stage preferred investors likely hold participating or senior preference structures.
      These terms are not publicly disclosed, which is a material diligence gap.

      Secondary market signals provide limited price discovery: Notice.co listed Base Power shares at
      approximately $10.65–$11.04 per share as of May 2026. Without knowing the per-share count from the
      cap table, it is not possible to triangulate an implied total valuation directly, though the presence
      of active secondary market trading on Forge, Hiive, and EquityZen confirms investor appetite for
      liquidity and suggests the current primary round mark has not meaningfully compressed in secondary
      trading. Forge Global lists Base Power as having a "Confidential Filing" IPO status milestone,
      consistent with a plausible 2026–2028 IPO window if revenue scales to $150–300M.

      Entry discipline at the $4B mark requires an investor to believe that Base Power can sustain a 5–10×
      revenue multiple at exit — implying $400M–$800M in terminal revenue — which is achievable by 2027–2028
      only if: (1) ERCOT revenue per kW stabilises above $40/kW, (2) the Gen 3 manufacturing programme
      reduces battery cost by 30–40%, (3) national expansion adds at least two new markets by 2027, and
      (4) customer cohort economics prove out beyond Texas at near-zero churn. Each of these is independently
      plausible; all four simultaneously is the thesis.
