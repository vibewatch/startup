  - id: comparable-analysis
    title: Comparable Valuation Analysis
    body: >
      Base Power occupies a novel intersection of residential solar+storage, VPP/DER software, and energy
      retailer — making clean comparable selection difficult. The most relevant public comps are Sunrun (RUN),
      Fluence Energy (FLNC), and Stem (STEM). Sunrun is the largest residential solar-plus-storage company
      in the U.S., with approximately $3.5B market cap and $17.7B enterprise value on $2.96B revenue (LTM),
      yielding an EV/revenue of approximately 5.6×. Fluence Energy — the utility-scale battery software and
      services platform — reported $2.3B in FY2025 revenue and guides to $3.4B for FY2026; it trades at
      approximately 1.5–2.5× forward revenue. Stem (STEM) is the most cautionary comparable: $156M in 2025
      revenue, negative equity, and an estimated >80% bankruptcy probability per Macroaxis as of mid-2026.
      Stem's trajectory illustrates the consequences of capital intensity without a sticky, recurring revenue
      model — a risk Base Power's retail-electricity subscription partially mitigates but does not eliminate.

      Among private comparables, Uplight (DER software platform with AutoGrid integration) was last valued at
      approximately $1.5B in 2021 and is now majority-owned by Octopus Energy following a sale process that
      reportedly sought approximately $1B — suggesting valuation compression in pure-play DER software between
      2021 and 2026. Renew Home (OhmConnect + Google Nest merger) controls ~3 GW of residential VPP capacity
      and is backed by Sidewalk Infrastructure Partners, but does not have a disclosed post-merger valuation.
      The implied takeaway from private market comparables is that VPP-software companies trade at well below
      $1B without embedded hardware assets; Base Power's hardware-led model justifies a premium over software
      peers but must also carry the multiple compression risk inherent in capital-heavy businesses.

      The implied 2025 revenue multiple for Base Power (333×) has no precedent among comparable energy
      companies at any stage; even early-stage pure-software SaaS companies rarely sustain multiples above
      50–100× outside of short-lived hype windows. The 2026 forward revenue multiple (57×) is more
      defensible for a hyper-growth platform but still implies Base Power will trade at 5–10× the median
      multiple of its public comp set at exit. The valuation is best understood as a platform option premium:
      investors are pricing in a winner-takes-most residential battery network in U.S. deregulated markets,
      not current revenue. That premium is justified only if the network effects (customer data, optimisation
      algorithms, low-cost manufacturing at scale) prove genuinely defensible against well-capitalised
      entrants including Tesla Energy, Sunrun Battery, and potential utility-sponsored programmes.
