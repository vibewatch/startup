  - id: scenario-analysis
    title: Bull / Base / Bear Scenario Analysis
    body: >
      The scenario framework anchors to 2027 revenue as the primary valuation driver, with exit multiples
      calibrated to the public and private comparable set. Probability weights are: bull 20%, base 45%, bear
      35% — skewed toward base/bear given the magnitude of execution dependencies and the structural
      headwinds in ERCOT grid-services economics.

      In the bull scenario, Base Power hits $250M in 2027 revenue by expanding to three additional deregulated
      markets (e.g., PJM/Pennsylvania, Illinois, New York), deploying Gen 3 batteries at $5,000 net cost
      (40% reduction from Gen 1), and sustaining ERCOT grid-services revenue above $50/kW/year as the
      December 2025 RTC+B programme creates new optimisation opportunities. At 20–25× forward revenue, the
      implied exit valuation is $5–6.25B. For Series C investors, this represents a modest positive return
      (1.25–1.56× on the $4B post-money), highlighting that even the bull case does not produce venture-scale
      returns for late-stage investors at the current entry price.

      In the base scenario, Base Power achieves $100–130M in 2027 revenue, primarily from Texas scaling
      plus one new market, deploys Gen 3 batteries at $7,000–8,000 net cost with incremental manufacturing
      improvements, and ERCOT grid-services revenue stabilises at $35–45/kW/year (consistent with Modo
      Energy and GreenCarFuture projections). At 15–20× forward revenue, the implied exit valuation is
      $1.5–2.6B — below the current $4B Series C mark, confirming that the current price point is not
      defensible on the base scenario without a significant multiple re-rating driven by scale or strategic
      acquirer premium.

      In the bear scenario, ERCOT battery revenues decline further to $15–20/kW/year as the RTC+B programme
      fails to meaningfully offset continued capacity saturation, the Gen 3 factory faces delays, and national
      expansion is limited by regulatory complexity in non-ERCOT markets. Revenue plateaus at $30–50M in
      2027, and Base raises a down-round or faces operational distress. At 10× forward revenue on a
      $40M base, the implied valuation is $400M — a 90% loss at the current entry price.

      The probability-weighted expected value across scenarios is approximately $2.2–2.5B, materially below
      the $4B current entry price. This confirms the fundamental investment tension: Base Power is a
      genuinely innovative platform, but the $4B entry price packages in five to seven years of execution
      that has not yet been demonstrated at national scale.
