  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit economics
      missingEvidence: "Audited per-customer unit economics: ERCOT grid-service revenue per installed kWh per year, retail electricity margin per MWh, and all-in cost per deployed MWh at 2025 actual market rates."
      whyItMatters: "The range between the 3.5-year (Sacra optimistic) and 8.5-year (GreenCarFuture conservative) payback period makes the financial model completely indeterminate; investment case cannot be made without resolving this."
      diligencePath: "Data-room request for cohort-level revenue and cost data; cross-check with ERCOT settlement system (ERCOT ISO public data) and utility billing records."
      relatedQuestionRefs: [QV011, QV027]
      relatedTableRefs: [TV004]

    - type: private-evidence-only
      severity: blocking
      topic: cap table
      missingEvidence: "Full cap table post-Series C including preference class, liquidation preference multiples (1× vs 2×), participation rights, anti-dilution provisions, and founder/employee equity percentage."
      whyItMatters: "With $1.3B in cumulative preferred capital, the waterfall at any exit below $3–5B is structurally subordinated for common equity; return calculations for any new investor are impossible without these terms."
      diligencePath: "Legal review of Certificate of Incorporation and Investor Rights Agreement; Wilson Sonsini has advised on all rounds."
      relatedQuestionRefs: [QV024]

    - type: missing-source
