  - id: exit-and-diligence
    title: Exit Readiness and Final Diligence Asks
    body: >
      Base Power's most plausible exit route is a public listing (IPO) in 2027–2029 once the company
      demonstrates $150–300M in annual revenue and sustained positive unit economics across multiple markets.
      Forge Global's secondary market listing indicates "Confidential Filing" status, consistent with
      preparatory IPO work but not a confirmed S-1 filing as of May 2026. The 2026 climate tech IPO window
      is opening — X-energy's $1B IPO (25% first-day pop) and Fervo Energy's ~$3B IPO filing signal
      institutional appetite for energy infrastructure stories — but the K-shaped market reality (nuclear
      and geothermal favoured, hardware-heavy climate tech less so) means Base Power must demonstrate
      profitability or near-profitability for the public market to sustain the growth premium.

      Strategic acquisition is a secondary exit path. Potential acquirers include: large U.S. utilities
      seeking DER/VPP assets (NRG, Exelon, Dominion); national homebuilders (Lennar is already a channel
      partner) wanting energy-as-amenity differentiation; or energy majors (Shell, BP) looking to build
      residential energy platforms. The Uplight/Octopus transaction and the OhmConnect/Nest merger set
      private-market precedent for VPP-adjacent acquisitions at $1–2B, suggesting that an acquirer premium
      above the current $4B mark requires very large scale or unique strategic fit.

      The critical diligence gaps before any investment decision are: (1) audited unit economics across
      the full customer cohort, including ERCOT grid-services revenue per battery at current market rates;
      (2) cap table and preference stack detail across all four rounds; (3) status of Gen 3 manufacturing
      programme — timeline, cost per unit, and planned throughput; (4) national expansion plan with
      regulatory and go-to-market specifics for non-ERCOT markets; and (5) customer-level churn data
      beyond the single reported case, including cohort retention curves at 12 and 24 months.

      The thesis-break triggers are: ERCOT grid-services revenue falling below $20/kW/year (threshold where
      unit payback exceeds battery useful life); manufacturing cost per unit remaining above $10,000 net
      by end of 2026 (signals Gen 3 is not on track); churn accelerating above 5% in cohorts beyond
      18 months; and failure to close any non-ERCOT market by Q4 2026. Any single trigger materially
      de-risks the bull scenario; two or more triggers simultaneously make the bear scenario the base case.
