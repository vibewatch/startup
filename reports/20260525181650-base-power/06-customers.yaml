      - - Bandera Electric / GVEC / Farmers / CoServ (cooperatives)
        - Electric cooperatives (inside ERCOT)
        - "No (cooperative service territories)"
        - Battery backup only — cooperative-partner programs; no REP switch for members
        - Combined target >170 MW across four cooperatives
    notes: >
      Deregulated TDU territories allow Base to serve as the retail electricity provider in
      addition to providing battery hardware. Cooperative and municipal/regulated territories
      restrict Base to the hardware-and-service role, with the utility retaining dispatch control
      and customer billing. Illinois is cited on the Base Power website as a future market but no
      formal license or launch announcement was found as of May 2026.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU036
      - CU037
      - CU038

