artifact: customers
slug: base-power
runDate: "2026-05-25"
company:
  name: Base Power
chapter:
  number: 6
  title: Customers
  summary: >
    Base Power's customer base has grown from roughly 1,500 Texas homeowners in July 2025 to
    10,000+ as of early 2026, propelled by six utility-partnership channels (CoServ, GVEC, El Paso
    Electric, Bandera Electric, Farmers Electric, Austin Energy) plus the Lennar homebuilder
    channel. Churn is near-zero (one reported departure through August 2025), anchored by 10-year
    battery-service agreements and a below-market-rate renewal guarantee. Expansion risks center on
    ERCOT geographic concentration and the unproven economics of regulated-market utility tolling
    outside the deregulated "gentailer" model that underpins the retail customer segment.

sections:
  - id: customer-segmentation-and-territory
    title: Customer Segmentation and Service Territories
    body: >
      Base Power currently serves a single primary customer archetype: Texas homeowners in
      deregulated ERCOT territories who want outage protection and lower electricity bills without
      the capital outlay of a whole-home generator or owned battery. The company further segments
      its customer base by acquisition channel — direct retail sign-up (available in Oncor, CenterPoint,
      TNMP, AEP Central, and AEP North territories) and utility-partner referrals (members of Bandera
      Electric, GVEC, Farmers Electric, CoServ, El Paso Electric, and Austin Energy).


      A third channel, the Lennar homebuilder integration, targets new-construction buyers in Austin
      and Dallas-Fort Worth: batteries are installed during construction in approximately 20 Lennar
      communities as of mid-2025, including Firefly Pointe (Hutto), Rancho del Cielo (Jarrell), and
      Rancho Canyon (Haslet). These buyers receive the battery as part of the home package and are
      auto-enrolled in Base's electricity service.


      Geography is tightly ERCOT-bound for the full "gentailer" model. El Paso Electric (a regulated
      utility outside ERCOT) and Austin Energy (a municipal utility inside ERCOT but not a deregulated
      REP market) require a different, tolling-only model where homeowners receive no electricity retail
      service from Base and often pay nothing upfront. About 50% of Base Power's direct retail customers
      already have solar panels, according to CNBC, making solar-plus-storage homeowners a key
      sub-segment. In April 2026, Base launched a battery-free "Base Energy" electricity plan open to
      renters and condo residents — the first non-homeowner segment — available in the same five
      deregulated utility territories.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
