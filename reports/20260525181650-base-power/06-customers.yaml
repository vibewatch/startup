      - TU006

  - id: retention-and-contract-terms
    title: Retention, Durability, and Contract Terms
    body: >
      Churn is reported as near-zero: Sacra documents only one customer departure through August
      2025, a remarkably low figure for any subscription service at this stage of growth. The
      structural driver is a dual-contract lock: a 10-year Battery Services Agreement and a 3-year
      electricity provider agreement (36 months). The energy contract guarantees below-market rates
      at enrollment and at renewal — Base's terms of service state it will match or beat market
      average pricing on powertochoose.org at renewal, or allow fee-free exit from the battery
      agreement.


      Moving homeowners may transfer the battery agreement to the next homeowner, which reduces
      churn from home sales. De-installation requires a $500 fee for labor removal. Base owns the
      hardware throughout, covering maintenance and warranty. Backup energy is explicitly excluded
      from use with life-critical medical devices and cannot be guaranteed during extended events.
      Utility co-op program terms differ: GVEC members pay a flat $295 purchase (no ongoing battery
      subscription) and El Paso Electric participants pay nothing — battery access and backup are
      provided without a direct electricity agreement.


      No publicly disclosed NRR, GRR, or cohort retention percentages exist as of May 2026 beyond
      the near-zero churn anecdote. Independent review aggregators (TrustBurn) show uniformly
      positive sentiment among self-selecting respondents with no documented refund or legal dispute
      pattern. The PUCT formal complaint database was not searched in this run; Base Power provides
      its own PUCT escalation contact page, indicating awareness of consumer protection obligations.
    claimRefs:
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
    tableRefs:
      - TU004

  - id: expansion-and-concentration-risks
    title: Expansion and Concentration Risks
    body: >
      Base Power's customer concentration is currently extreme: essentially 100% of revenue flows
      from Texas homeowners within ERCOT. Within that, the deregulated "gentailer" model (stacking
      lease, retail, and arbitrage revenues) is only available in the five deregulated utility
      territories (Oncor, CenterPoint, TNMP, AEP Central, AEP North). Utility-partner channels
      access different customer pockets — co-op members who would be ineligible for the retail REP
      product — but these tolling or wholesale-only deals generate substantially thinner economics
      for Base than the full gentailer stack.


      The April 2026 battery-free "Base Energy" plan widens the addressable customer pool to renters
      and apartment dwellers — a first signal of segmentation expansion beyond the single-family
      homeowner archetype. Geographic expansion beyond Texas depends on replicating deregulated
      market access (Illinois was mentioned on Base's website as a target) or on utility-tolling
      economics that pencil out without retail margin and wholesale arbitrage. The El Paso Electric
      regulated-territory pilot is the live test of the latter; results are not yet disclosed.


      Top-customer risk is moderate at the cooperative level: CoServ (330,000 meters) represents a
      single agreement for 100 MW, which if lost or underperforming could meaningfully impair the
      2026 deployment target. Similarly, the Austin Energy 40 MW tolling agreement at $4.08M/year
      is a concentrated institutional revenue commitment dependent on annual budget approval.
      Expansion into new Texas territories relies partly on ERCOT's Strategic Transmission Expansion
      Plan (STEP), which is multi-year in execution.
    claimRefs:
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040
      - CU041
