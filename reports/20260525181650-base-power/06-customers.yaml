  - id: TU005
    title: Expansion and Concentration Risk
    columns:
      - Risk / Expansion Driver
      - Type
      - Current Exposure
      - Impact if Realized
      - Diligence Path
    rows:
      - - ERCOT-only concentration
        - Geographic concentration
        - "~100% of revenue; full gentailer model only works in ERCOT deregulated territories"
        - High — regulatory, pricing, or weather changes in ERCOT could impair entire business
        - Track Illinois launch and any non-ERCOT REP filings
      - - CoServ 100 MW single-partner dependency
        - Channel concentration
        - "Largest single deployment target; B2B contract cancelable per standard utility terms"
        - Medium — represents ~5,000 homes if fully deployed; loss would materially slow 2026 targets
        - Obtain contract term, cancelation conditions, and performance milestones
      - - Austin Energy tolling agreement concentration
        - Revenue concentration
        - "$4.08M/year for 40 MW; subject to annual budget approval"
        - Medium — non-recurring if budget not approved; regulated utility can reallocate to alternatives
        - Monitor Austin City Council budget sessions for continuation signals
      - - Battery-free Base Energy plan (expansion driver)
        - Market expansion
        - "Launched April 2026 in five deregulated TDU territories; renters/condos now eligible"
        - Low risk — diversifies from homeowner-only model; economics under evaluation
        - Track sign-up velocity and margin per customer vs. battery-bundled plan
      - - Geographic expansion beyond Texas
        - Expansion driver
        - "Illinois mentioned on website; no formal announcement as of May 2026"
        - Low risk — if successful, reduces ERCOT concentration; if it fails, capital is lost
        - Request Illinois REP license filing status with PUCT / Illinois ICC
      - - Lennar community concentration
        - Channel dependency
        - "~20 communities; LENx is also an investor; strategic alignment reduces exit risk"
        - Low-medium — if Lennar pulls partnership, new-construction pipeline narrows sharply
        - Obtain Lennar community pipeline for 2026–2027 and exclusivity terms
    notes: >
      Concentration estimates are derived from public partnership announcements and analyst
      estimates (Sacra). Austin Energy annual payment is subject to City Council budget approval;
      it is not a guaranteed multi-year commitment. Illinois expansion status is unconfirmed.
    claimRefs:
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040
      - CU041

