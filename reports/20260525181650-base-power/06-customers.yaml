  - id: adoption-and-named-customer-evidence
    title: Adoption Trajectory and Named Customer Evidence
    body: >
      Customer growth has been rapid. Sacra's research indicates Base added roughly 5,500 homes
      between July and December 2025; the company's own homepage displays "10,000+ homes powered by
      Base" as of early 2026, and TechCrunch corroborated more than 100 MWh of deployed
      residential battery capacity. The app saw approximately 5,000 monthly installs as of August
      2025, with seasonal peaks in summer. Deployment run rate reached 20 MW per month by late 2025.


      Named customer testimonials span multiple Texas markets. On the official Base Power reviews
      page, Michael O. reports switching from Reliant and achieving a 39% bill reduction (from
      $0.22/kWh all-in to Base's transparent pricing). David C. reports a 40% reduction after
      switching from Green Mountain Energy. In Magnolia, TX, Zac reports that during a recent storm
      the battery kept his home powered for over 18 hours with no interruption. Matt M. reports that
      his neighbors lost power for 7 hours and he "didn't even know" because Base had already kicked
      in. Early adopter Venkata (solar integration) describes the system as enabling a personal
      "micro-grid" and praises proactive system testing including soft-start HVAC installation.
      Thomas from Houston notes he got a coworker to sign up and is no longer nervous about
      spring thunderstorms. Bob A. of Waxahachie says he was ready to buy "the biggest, loudest
      generator" before finding Base.


      On TrustBurn and independent forums, the consistent themes are: professional and timely
      installation, responsive customer service, and meaningful bill savings versus legacy providers.
      No pattern of unresolved complaints or systemic service failures was identified in public forums
      or BBB records as of May 2026.
