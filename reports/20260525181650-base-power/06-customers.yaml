callouts:
  - calloutType: strength
    title: Near-Zero Churn Anchored by Dual-Contract Structure
    body: >
      Only one customer departure was reported through August 2025. The 10-year battery-service
      agreement plus a 3-year electricity contract with a below-market renewal guarantee creates
      structural stickiness: de-installation cost ($500), rate-matching obligation at renewal, and
      the ability to transfer rather than terminate upon home sale all reduce exit incentives.
    claimRefs:
      - CU029
      - CU030
      - CU031
      - CU032

  - calloutType: risk
    title: Battery Discharge to 20% During Grid Events Is the Primary Customer Complaint Vector
    body: >
      Base Power legally discharges customer batteries to as low as 20% capacity during peak-demand
      grid events — the same periods when outage risk is highest. Independent analyst coverage
      (EpicElectrical) and forum users (TexAgs) have identified this as the primary adverse
      experience risk: a customer who experiences a grid-coincident outage after a dispatch event
      may find only 4–5 kWh of usable backup remaining. The company claims its ML model reserves
      sufficient charge for 97% of historical ERCOT outage scenarios, but this claim has not been
      independently verified and is self-reported. For large homes or multi-day events, the battery
      alone is inadequate, and a supplemental generator is required.
    claimRefs:
      - CU042
      - CU043
      - CU044

  - calloutType: insight
    title: Utility-Partner Channel Widens Addressable Market But Dilutes Economics
    body: >
      The six utility partnerships (Bandera, GVEC, Farmers, CoServ, EPE, Austin Energy) reach
      cooperative and municipal-utility members who cannot switch electricity providers — expanding
      the addressable customer base but removing the retail electricity margin and wholesale
      arbitrage revenue streams that are the core of the gentailer model. These partnerships are
      strategically valuable for capacity deployment and brand validation but may generate
      materially lower per-customer economics than the direct retail channel.
    claimRefs:
      - CU036
      - CU023
      - CU024
      - CU025

