  - id: channel-partners
    title: Channel Partners and Installer Ecosystem
    body: >
      Base Power has structured its go-to-market around two distinct channel types: utility/cooperative
      partnerships (B2B2C) and homebuilder integration (B2B2C new construction). By March 2026, the
      company had announced five utility collaborations in Texas, with a sixth (Austin Energy) added
      in May 2026.


      Utility partners vary in model: CoServ and GVEC retain battery dispatch control while Base
      handles installation and maintenance; El Paso Electric is a regulated-utility pilot where
      homeowners receive the battery at no upfront cost plus a $250 payment; Austin Energy uses a
      tolling model paying Base up to $4.08M/year for 40 MW of reserved capacity. For co-op
      partners such as Bandera Electric and Farmers Electric, members pay a nominal upfront fee
      ($295 for GVEC) and a low monthly subscription. CoServ's 100 MW agreement (March 2026) is
      the largest to date, targeting an estimated 5,000 additional homes within CoServ's
      330,000-meter North Texas territory.


      On the installer side, third-party contractors such as Charge Pro execute physical battery
      racking and placement while Base's licensed electricians handle panel connections — a
      labor-decoupling strategy designed to compress per-unit installation costs. Named installers
      in customer reviews include Ben and his Charge Pro crew, and the team of Dylan and Thor,
      referenced by multiple Houston-area customers.
    claimRefs:
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
