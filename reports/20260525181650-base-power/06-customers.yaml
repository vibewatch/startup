  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-customer-proof
      missingEvidence: >
        Third-party validated case studies with independently metered outcome data (bill reduction
        percentages, backup kWh delivered) for named Base Power customers across all five
        customer segments in the Named Customer Proof Table.
      whyItMatters: >
        All named testimonials in TU003 are self-reported via Base Power's own platforms and are
        a self-selected, positive-skewed sample. No independent auditor has verified savings
        percentages or backup performance for any specific customer. The near-zero churn claim
        cannot be cross-checked against individual customer records without audited cohort data.
      diligencePath: >
        Request a randomized, stratified sample survey of 50–100 customers spanning all
        acquisition cohorts (pre/post Lennar channel, cooperative partner members, and DFW vs.
        Houston markets); commission independent utility-bill auditor to verify top-cited savings
        claims; obtain PUCT formal switching data as churn proxy.
      relatedTableRefs:
        - TU003
      relatedQuestionRefs:
        - QU006
        - QU011
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: >
        Audited or independently reported customer churn rate, NRR, GRR, and cohort retention
        data by acquisition vintage and TDU territory.
      whyItMatters: >
        The near-zero churn claim (1 customer through August 2025, Sacra) is based on a single
        secondary data point from a period when the customer base was still under 1,500 homes.
        Retention durability at 10,000+ homes and across utility-partner segments has not been
        validated.
      diligencePath: >
        Request monthly churn report by cohort from Base Power investor relations or management;
        cross-reference with PUCT switching data (ERCOT publishes retail switching counts by REP).
      relatedQuestionRefs:
        - QU006

    - type: missing-source
      severity: material
      topic: adverse
      missingEvidence: >
        PUCT informal complaint database records for Base Power as a licensed Texas REP, including
        complaint volume, type, and resolution outcomes.
      whyItMatters: >
        The BBB review page was inaccessible (403/bot-challenge) during this research run.
        PUCT is the regulatory escalation path acknowledged by Base Power itself; complaint
        frequency and nature would signal hidden service quality issues not captured in
        self-selected positive reviews.
      diligencePath: >
        Query PUCT Interchange for docket filings and complaint logs for "Base Power" or its
        registered REP license number; cross-reference with ERCOT REP complaint aggregate data.
      relatedQuestionRefs:
        - QU012

    - type: missing-source
      severity: material
      topic: concentration-risks
      missingEvidence: >
        Unit economics comparison between the full gentailer model (retail customers) and the
        utility tolling/cooperative model (El Paso Electric, Austin Energy, CoServ), including
        per-home margin, payback period, and IRR under each structure.
      whyItMatters: >
        Sacra notes that the tolling-only model's financial viability without retail electricity
        margin and wholesale arbitrage is "the central unresolved question" in Base's expansion
        into regulated markets. If the cooperative/utility model generates insufficient returns,
        ERCOT geographic concentration cannot be mitigated through partner-channel scaling.
      diligencePath: >
        Obtain Base Power's per-segment contribution margin data; model El Paso Electric pilot
        returns using disclosed $4.08M/yr Austin Energy payment as a comparable; request
        investor-level financial model with tolling vs. retail scenario.
      relatedQuestionRefs:
        - QU024

    - type: private-evidence-only
      severity: minor
      topic: battery-limitations
      missingEvidence: >
        Independent third-party verification of Base Power's "97% of historical ERCOT outage
        scenarios covered" claim, including the data set used, the outage duration threshold,
        and the battery state-of-charge assumptions.
      whyItMatters: >
        The 97% figure is Base Power's primary resilience marketing claim, cited in Sacra and
        on the company website. If this is based on narrow assumptions (e.g., only outages
        under 2 hours when battery is at 93% charge, not after a dispatch event), it would
        materially overstate the backup reliability for customers during simultaneous grid stress.
      diligencePath: >
        Request the statistical methodology from Base Power's engineering team; obtain an
        independent simulation using ERCOT historical outage data from 2020–2025 with Base's
        dispatch algorithm applied.
      relatedQuestionRefs:
        - QU010
        - QU021

