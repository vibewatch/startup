    title: Competitor profile and alternative landscape
    columns: [Alternative, Category, Documented scale or scope, Target buyer/use, Differentiation or role, Limitation / unknown]
    rows:
      - [Neara, direct utility infrastructure intelligence, "More than 15 million assets and 3 million km reported in 2026 coverage", Electricity network utilities, Physics-enabled digital twins and network simulations, Realized pricing and win rates undisclosed]
      - [Bentley Systems, incumbent infrastructure software, "Public company with infrastructure-software portfolio; Q1 2026 results", Infrastructure owners and engineering organizations, Installed base and broad infrastructure tooling, Direct Neara overlap not established by source]
      - [RFP.wiki-listed grid software alternatives, adjacent/direct software set, "Alternatives page lists multiple grid-software vendors", Utility software buyers, Comparative discovery and procurement shortlist signal, Scores and pricing are not audited benchmarks]
      - [Engineering consultancies, adjacent service substitute, Not quantified in assigned sources, Utilities needing planning/design/assessment, Human engineering capacity and regulated delivery, Slower repeatability and labor economics not quantified]
      - [Internal utility teams and manual inspections, status quo/internal build, "Neara coverage describes manual work taking months in examples", Utilities with existing engineering and field teams, Existing data ownership and operational familiarity, "Speed, consistency, and model fidelity depend on local resources"]
    notes: "Scope combines direct, incumbent, adjacent, and status-quo alternatives from assigned public sources; scale is not comparable across rows and null/unknown fields are not evidence of absence."
    enumerationScope:
      coverage: sample
      basis: "Representative alternatives documented in the assigned competitor, customer, and infrastructure-software sources for the 2026-10-23 report run."
    claimRefs: [CP001, CP002, CP003, CP011]
  - id: TP002
    title: Capability and buying-criteria comparison
    columns: [Buying criterion, Neara evidence, Incumbent / specialist alternative, Buyer implication, Evidence status]
    rows:
      - [Network-scale modeling, "21,000 powerline spans analyzed in 15 minutes in SA Power Networks case", "Manual systems described as taking months", "Time-to-insight can affect emergency and planning workflows", "Company/customer-reported case; not controlled benchmark"]
      - [Physics and geospatial fidelity, "LiDAR, geospatial data, imagery, and physics-enabled modeling described", "Alternative data/model stacks not specified", "Fidelity and input coverage are likely gating criteria", "Neara capability documented; competitor parity unknown"]
      - [Extreme-weather risk analysis, "Flood, wildfire, wind, ice, and snow scenarios described", "Specialist engineering and inspection workflows remain substitutes", "Breadth may support cross-workflow adoption", "Use-case evidence; comparative performance unknown"]
      - [Regulatory defensibility, "Simulations intended to demonstrate resilience upgrades", "Engineering consultants and incumbent systems may already support regulated processes", "Approval workflow and auditability can determine switching cost", "Mechanism stated; buyer acceptance not quantified"]
      - [Data integration, "Customers can use captured or historic LiDAR and multiple data sources", "Existing utility systems may already own network and asset data", "Integration effort and data rights can determine deployment cost", "Neara inputs documented; integration cost unknown"]
      - [Distribution and references, "Customers cited across Australia, US, Ireland, and UK", "Bentley has established infrastructure-software reach", "Utility references and channels may reduce enterprise adoption friction", "Geographic customer presence documented; relative channel power unknown"]
    notes: "Cells marked unknown are intentionally preserved because the assigned sources do not provide a comparable competitor specification, price, or measured outcome."
    claimRefs: [CP005, CP006, CP007, CP008, CP013]
  - id: TP003
    title: Pricing, packaging, and switching evidence
    columns: [Dimension, Public evidence, Competitive interpretation, Diligence ask]
    rows:
      - [List price, null, "No public list price in assigned sources", "Obtain price cards or anonymized deal ranges by utility size"]
      - [Contract model, null, "Subscription or project packaging is not established", "Confirm recurring versus implementation and services revenue"]
      - [Discounting, null, "Realized discount and renewal uplift are unknown", "Review cohort-level bookings, renewals, and expansion"]
      - [Implementation effort, "Models use LiDAR, geospatial data, imagery, and customer network data", "Data preparation and integration may create switching friction", "Measure implementation hours, elapsed time, and customer dependencies"]
      - [Lock-in, "Digital twins and configured workflows can accumulate network-specific context", "Potential workflow and data switching cost; not measured", "Test exportability, multi-homing, and termination provisions"]
      - [Displacement proof, "Selected utilities and named workflows reported", "Adoption does not prove displacement of incumbent systems", "Request win/loss records and named displaced alternatives"]
    notes: "Pricing and packaging are evidence gaps, not zero values; public funding and customer case-study metrics cannot be used as pricing or ARR proxies."
    claimRefs: [CP013, CP014]

figures:
  - id: FP001
    title: Single-source competitive scorecard
    type: quadrant
    summary: RFP.wiki's overall score and feature score place five operational or engineering incumbents above Neara on that publisher's grid-software scorecard.
    data:
      points:
        - {label: "Neara", x: 3.3, y: 2.8, detail: "Ranked 16 of 20 by RFP.wiki."}
        - {label: "Oracle Utilities NMS", x: 4.4, y: 4.5, detail: "Mature NMS/ADMS and outage-management breadth."}
        - {label: "AspenTech OSI", x: 4.5, y: 4.4, detail: "Real-time SCADA/ADMS orientation."}
        - {label: "ETAP", x: 3.8, y: 4.1, detail: "Engineering-analysis incumbent."}
        - {label: "GE Vernova", x: 4.0, y: 4.1, detail: "Broad enterprise infrastructure and grid footprint."}
        - {label: "Survalent", x: 3.7, y: 4.0, detail: "Unified SCADA, OMS, and DMS positioning."}
    approximationNotes: "Exact values are copied from one RFP.wiki page: x is its 1-5 Feature Score and y is its 1-5 composite Score. The methodology is not independently audited, category breadth favors suites, and the chart is directional rather than a product benchmark or investment ranking."
    claimRefs: [CP015]

callouts:
  - calloutType: strength
    title: Workflow-specific differentiation
    body: Neara's clearest public edge is rapid, network-scale analysis that combines utility data with physics-aware simulation; this is more specific than a generic AI positioning claim.
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Incumbent and substitute response
    body: Public evidence does not show whether incumbent infrastructure platforms, engineering firms, or internal teams are being displaced, nor whether Neara's data and workflows produce measurable renewal lock-in.
    claimRefs: [CP011, CP013, CP014]
  - calloutType: recommendation
    title: Underwrite proof of durability
    body: Request competitor-specific win/loss, renewal, implementation, price, and exportability evidence before assigning a durable moat premium.
    claimRefs: [CP013, CP014]

