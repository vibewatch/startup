  evidenceGaps:
    - type: missing-source
      severity: material
      topic: technical-disclosure
      missingEvidence: Customer-facing service-level objectives, model error bounds, drift monitoring, and incident history by production use case.
      whyItMatters: Utility planning and emergency decisions depend on predictable accuracy, reliability, and operational response.
      diligencePath: Request a production architecture and model-risk pack with SLAs, validation results, monitoring dashboards, incident summaries, and customer references.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: data-foundation
      missingEvidence: Evidence of performance under incomplete, stale, inconsistent, or customer-specific LiDAR and GIS data.
      whyItMatters: Source-data quality is a direct dependency of the digital twin and can determine deployment time and decision quality.
      diligencePath: Review representative data-quality samples, reprocessing rates, exception logs, and accuracy results across geographies.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: Public or customer-verified security, privacy, residency, access-control, and compliance documentation.
      whyItMatters: Utility network data is operationally sensitive and may be subject to critical-infrastructure controls.
      diligencePath: Obtain current security certifications, penetration-test summaries, data-flow diagrams, residency options, and contractual control schedules.
      relatedQuestionRefs: [QE007]
