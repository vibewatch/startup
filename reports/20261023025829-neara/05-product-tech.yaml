figures:
  - id: FE001
    title: Neara product architecture map
    type: stack
    summary: Neara's disclosed product layers connect utility data to physics-enabled simulations and operational decisions.
    data:
      layers:
        - label: Decision workflows
          detail: Translate modeled conditions into utility planning and intervention decisions.
          items:
            - label: Risk prioritization
              detail: Select assets and interventions for planning, response, or hardening.
            - label: Network planning
              detail: Evaluate design, capacity, and renewable-connection scenarios.
        - label: Simulation
          detail: Run environmental and engineering scenarios against the modeled network.
          items:
            - label: Weather and flood scenarios
              detail: Test network behavior under environmental conditions.
            - label: Structural and clearance analysis
              detail: Examine asset loading, clearances, and failure-risk conditions.
        - label: Digital twin
          detail: Represent network assets and surrounding context in three dimensions.
          items:
            - label: 3D network model
              detail: Represent network components and surrounding context.
            - label: Asset and terrain context
              detail: Retain network, environmental, and engineering context for scenario analysis.
        - label: ML services
          detail: Automate classification, data preparation, and complex scenario analysis.
          items:
            - label: Classification and scenario analysis
              detail: Apply machine learning to data preparation and complex analyses.
        - label: Data foundation
          detail: Supply spatial observations, asset records, and engineering context.
          items:
            - label: LiDAR and imagery
              detail: Capture spatial observations from utility or third-party sources.
            - label: GIS and engineering data
              detail: Supply asset, geospatial, and specification context.
        - label: Utility integrations
          detail: Connect modeled outputs to customer planning, operations, and field processes.
          items:
            - label: Planning and response outputs
              detail: Deliver prioritized risks and scenario results to utility teams.
    claimRefs: [CE002, CE005, CE006, CE007, CE008]
callouts:
  - calloutType: strength
    title: Product strength
    body: The strongest public proof is workflow compression in named utility use cases, especially flood analysis and field-insight prioritization, rather than a generic AI performance claim.
    claimRefs: [CE010, CE011, CE012]
  - calloutType: risk
    title: Technical diligence risk
    body: Neara's value is sensitive to source-data quality, deployment QA, and model validation; public sources do not provide error bounds, monitoring results, or customer-specific security and residency controls.
    claimRefs: [CE006, CE009, CE014]
