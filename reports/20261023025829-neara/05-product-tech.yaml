company:
  name: Neara
chapter:
  number: 5
  title: Product & Technology
  summary: Neara delivers physics-enabled digital twins for utility infrastructure by combining geospatial and engineering data with AI/ML simulation. Public evidence shows meaningful operational speed and scale, but also makes deployment quality, data readiness, model validation, and production monitoring central diligence risks.
sections:
  - id: product-and-workflow
    title: Product definition and utility workflow
    body: >-
      Neara is described as a software platform that turns utility network data into an
      engineering-grade digital twin. The documented input pattern combines LiDAR, geospatial,
      satellite, and imagery data, while the operating output is a network-wide model that can
      simulate asset behavior under weather, flood, wildfire, and design scenarios. The customer
      workflow is therefore not simply visualization: teams ingest or reuse network data, generate
      a model, test scenarios, identify vulnerable assets or clearance breaches, and prioritize
      field or capital interventions. Public customer examples show this workflow applied to flood
      response, vegetation risk, grid hardening, and renewable-connection planning. The distinction
      matters because the product's value depends on the quality and freshness of source data and
      on whether model outputs are accepted for consequential engineering decisions.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-operating-model
    title: Architecture, delivery, and maturity
    body: >-
      The available technical evidence supports a layered architecture rather than a single opaque
      AI feature. Neara combines multimodal spatial data ingestion, a 3D network representation,
      physics-enabled simulation, machine-learning services, and decision workflows for utility
      teams. A current engineering hiring surface describes training data warehouses, distributed
      compute, model serving, model monitoring, cloud and container infrastructure, and multimodal
      point-cloud, geospatial, and asset models. A deployment leadership role separately describes
      model build, QA, contractor execution, standardization, and delivery metrics. Together these
      are evidence of an operating model designed to industrialize deployments, not proof that
      every layer is mature across all customers. Public disclosures do not establish service-level
      objectives, incident history, customer-specific data residency, model error rates, or the
      exact interface between customer systems and the platform.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-diligence
    title: Differentiation, controls, and key risks
    body: >-
      Neara's stated differentiation is the combination of physics-based simulation and
      network-wide spatial context, intended to move utilities from manual surveys and fragmented
      analyses toward repeatable scenario testing. External and customer-linked reporting
      describes faster analysis in several use cases, including a 15-minute flood report covering
      21,000 powerline spans and a reduction of one CenterPoint field-analysis process from a
      historical year and a half to three hours. These are use-case outcomes, not a general
      benchmark or guarantee. The central technical diligence question is whether the same
      accuracy and throughput persist when LiDAR or GIS data are incomplete, stale, inconsistent,
      or expanded to new verticals. Independent model-verification guidance recommends risk-informed
      verification and validation for digital twins; Neara's public materials do not disclose a
      comparable customer-facing V&V dossier, security certification set, or production
      model-monitoring results.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: []
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits summarize the disclosed product layers, customer workflow, and operating
      dependencies without implying that unreported metrics are zero or that marketing claims are
      independently verified. They are deliberately framed as evidence maps: a module or workflow
      appears because a retained source describes it, while a missing metric remains a diligence
      question. This avoids turning a current hiring requirement into proof of a shipped feature or
      turning a customer case study into a population-wide benchmark.
    claimRefs: []
