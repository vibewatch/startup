      - ["Physics-enabled simulation", "Test asset behavior under environmental and engineering scenarios", "Validated physical assumptions and scenario inputs", "Error bounds and intended-use limits are undisclosed"]
      - ["Machine-learning services", "Automate classification and complex scenario analysis", "Training data, distributed compute, and serving infrastructure", "Drift, monitoring, and explainability evidence are undisclosed"]
      - ["Deployment and QA", "Build and quality-assure customer models", "Internal teams and contractor partners", "Delivery economics, quality gates, and partner controls require diligence"]
      - ["Decision workflows", "Prioritize interventions and support planning or response", "Utility processes and regulatory acceptance", "Integration, security, and auditability are not fully disclosed"]
    notes: "Architecture is synthesized only from disclosed platform descriptions and current engineering or deployment role requirements; it is not a complete technical design or security architecture."
