        title: Capital and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              The 2026 Series D is consistently reported as a major financing event, but currency and cumulative totals
              must remain explicit. Startup Daily reports a $90 million round, a valuation above $1 billion, and $180
              million raised in total without identifying the currency in those sentences. TechEDT reports AUD 90
              million for the same round and approximately AUD 180 million in cumulative capital. Tracxn separately
              reports $126 million across five rounds and masks its current valuation. These figures may be reconcilable
              after currency conversion or differences in round coverage, but the public record does not prove that. TCV
              led the Series D, while coverage names Partners Group, EQT, Square Peg, Skip Capital, and Prosus among
              current or earlier backers. A signed cap table and financing schedule are needed before using any single
              total-raised or valuation figure as canonical.
