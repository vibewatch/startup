  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Neara's relevant market is utility and critical-infrastructure software that models physical assets and
              network behavior for planning, resilience, vegetation management, and faster connection decisions. The
              included spend is recurring or project-linked software and data work used by electricity network
              operators. It excludes the underlying poles, wires, substations, construction, grid hardware, and the full
              value of data-centre development. The status quo is a mix of manual inspection, engineering studies, GIS
              and statistical tools, and fragmented workflows. Public descriptions show why the software can matter:
              TechCrunch reports that Neara combines lidar and other data with physics-based models, while the SA Power
              Networks example describes analysis of 21,000 power-line spans in 15 minutes rather than months. These
              examples establish workflow pain and potential time savings, not a market-wide willingness to pay or a
              proven software budget.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Demand drivers and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The strongest external demand signal is the growth and complexity of electricity loads. The IEA source
              reports global electricity demand rising at an average 3.6% a year from 2026 through 2030. In Australia,
              Modo Energy forecasts National Electricity Market data-centre demand from 3.9 TWh in FY25 to 14 TWh in
              FY30 and 37 TWh in FY50, while Fitch cites an AEMO forecast that business and industry grid consumption
              reaches 253 TWh in 2050 from 133 TWh today, with data centres contributing 29 TWh of the increase. These
              are infrastructure-demand lenses, not Neara revenue forecasts. They support a need for grid planning and
              capacity optimization, but the conversion from electricity growth to software spend remains unobserved.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM006
              - CM011
              - CM012
      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is an electricity network or utility operator, while engineering, vegetation,
              resilience, planning, and field teams are the users. The payer is therefore likely a utility operating or
              capital-planning budget, sometimes supported by resilience, reliability, or regulatory programs; the
              public evidence does not disclose Neara's contract structure, pricing, or procurement cycle. Neara's
              reported utility footprint is a useful adoption signal: Forbes Australia says it works with close to 90%
              of Australia's electricity network utilities, and the same article lists customers across Australia, the
              United States, and Europe. That breadth suggests repeatable utility use cases, but customer concentration,
              renewal rates, annual contract value, and the share of spend from expansion versus new logos remain
              unknown.
            claimRefs:
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption depends on more than a large grid-investment headline. Fitch identifies transmission bottlenecks
              and permitting delays as key challenges in Australia's transition, and USSC notes that data centres can be
              built in 18 to 24 months while major network upgrades and renewable projects often take five to ten years
              or more. Clayton Utz summarizes scrutiny around energy, water, planning, land use, noise, and backup
              generation in New South Wales, while Modo Energy emphasizes that connection capacity is not the same as
              realized demand because projects must be built, utilized, and ramped. These constraints can increase the
              value of faster scenario analysis, but they can also lengthen procurement, require jurisdiction-specific
              data and validation, and limit how quickly a software vendor converts macro demand into revenue. Neara's
              February 2026 financing coverage reports an A$1.1 billion valuation and approximately A$180 million
              raised; without disclosed revenue, retention, or addressable contract spend, the market evidence supports
              strategic relevance but not a defensible valuation multiple.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural demand tailwind
            body: >-
              Grid congestion, extreme-weather exposure, electrification, and data-centre loads create recurring
              planning and resilience problems that fit Neara's stated workflow.
            calloutType: strength
            claimRefs:
              - CM003
              - CM005
              - CM008
              - CM013
          - type: callout
            title: Macro growth is not software TAM
            body: >-
              Public forecasts quantify electricity demand and infrastructure pressure, but Neara's addressable software
              spend, pricing, retention, and serviceable account universe remain undisclosed.
            calloutType: risk
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM014
              - CM015
          - type: callout
            title: Underwrite from utility economics
            body: >-
              Treat market expansion as credible but valuation-sensitive until independent procurement, pricing, and
              renewal evidence connects utility adoption to recurring revenue.
            calloutType: recommendation
            claimRefs:
              - CM010
              - CM012
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The buyer problem is utility network planning, inspection, resilience, and risk remediation rather than a
              generic AI purchase. Neara's direct category is software that combines geospatial, LiDAR, imagery,
              engineering models, and simulation for electricity networks. The alternatives include incumbent utility
              asset-management and engineering systems, specialist LiDAR and vegetation-management providers,
              engineering consultancies, and internal spreadsheet/manual inspection workflows. RFP.wiki lists Neara
              alongside multiple grid-software alternatives, but its scoring and pricing are not independently audited,
              so it is useful as a discovery signal rather than a benchmark. Neara's own reported expansion into
              telecommunications and public transportation broadens the addressable set but also puts it against
              established vertical software and engineering vendors. The central buying criteria are network coverage,
              model fidelity, time-to-insight, integration with existing asset data, regulatory defensibility, and the
              ability to prioritize capital work. Public disclosures show Neara winning workflow depth in utilities;
              they do not establish that it displaces a system of record or wins every adjacent use case.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP015
      - number: '3.2'
        title: Capability, distribution, and switching
        blocks:
          - type: paragraph
            body: >-
              Neara's strongest documented differentiation is the combination of physics-based digital twins and rapid
              network-scale analysis. TechCrunch reports that its models combine LiDAR, satellite imagery, weather
              variables, and other data, while Neara case coverage describes analyses historically taking months being
              completed in hours or minutes. Separate trade coverage explains why this workflow matters: LiDAR point
              clouds can be converted into GIS asset inventories and vegetation-risk maps, while conventional
              helicopter, foot-patrol, and paper processes can introduce data silos and human error. These references
              indicate workflow and data advantages, but they are not a controlled competitor benchmark. Distribution is
              reinforced by utility relationships across Australia, the United States, Ireland, and the United Kingdom.
              Switching costs likely rise with accumulated network data, configured models, regulatory workflows, and
              trained users, yet public sources do not quantify implementation time, retention, multi-homing, or
              contract exclusivity.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat case rests on data integration, engineering-specific model fidelity, customer workflow embedding,
              and utility distribution rather than on a disclosed proprietary price or a measured network effect.
              TechCrunch says Neara's model was trained on more than one million miles of diverse network territory,
              while the 2026 funding coverage reports much larger asset and distance totals; the different periods and
              denominators should not be combined into a single growth metric. Customer examples show operational value,
              including rapid flood analysis and vegetation-risk workflows, but most quantified outcomes are company or
              customer statements carried by industry publications. Incumbents with larger installed bases can add
              simulation, LiDAR, or AI features, and specialist providers can compete for individual workflows. Bentley
              Systems' public results demonstrate the scale and recurring reach of an established
              infrastructure-software competitor, although the source does not establish a direct Neara product overlap.
              The key diligence question is whether Neara's models and integrations create renewal and expansion
              behavior that is difficult to reproduce, not merely whether its demos are faster.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP013
              - CP014
      - number: '3.4'
        title: Competitive evidence and unknowns
        blocks:
          - type: paragraph
            body: >-
              Public evidence is asymmetric: Neara and its customers disclose selected outcomes, while list prices,
              realized discounts, head-to-head win rates, churn, and implementation economics are not public in the
              assigned pool. The resulting comparison should therefore distinguish documented capabilities from
              unknowns. Neara appears strongest where a utility needs large-scale, physics-aware scenario analysis
              across an existing network. It is less clear whether it owns the broader asset-management workflow or
              whether customers can substitute incumbent systems, consultancies, or internal teams for portions of the
              job. Competitive underwriting should request anonymized win/loss data, renewal cohorts, implementation
              hours, customer concentration by competitor displacement, realized annual contract value, and evidence
              that model outputs survive regulatory and engineering review.
            claimRefs:
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow-specific differentiation
            body: >-
              Neara's clearest public edge is rapid, network-scale analysis that combines utility data with
              physics-aware simulation; this is more specific than a generic AI positioning claim.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: Incumbent and substitute response
            body: >-
              Public evidence does not show whether incumbent infrastructure platforms, engineering firms, or internal
              teams are being displaced, nor whether Neara's data and workflows produce measurable renewal lock-in.
            calloutType: risk
            claimRefs:
              - CP011
              - CP013
              - CP014
          - type: callout
            title: Underwrite proof of durability
            body: >-
              Request competitor-specific win/loss, renewal, implementation, price, and exportability evidence before
              assigning a durable moat premium.
            calloutType: recommendation
            claimRefs:
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and go-to-market economics
        blocks:
          - type: paragraph
            body: >-
              Public evidence identifies Neara as a cloud-based SaaS platform used by large utilities, but it does not
              reveal whether contracts are priced by network, asset, seat, module, project, or usage. Named deployments
              across regulated utilities and the absence of self-serve pricing point to a relationship-led enterprise
              motion, although sales cycle, channel mix, quotas, commissions, and customer-acquisition cost remain
              undisclosed. Delivery also depends on LiDAR and other network data captured by customers or third parties.
              That dependency may leave data acquisition, integration, onboarding, and engineering support either
              customer-borne, passed through, or embedded in Neara's cost of revenue; the public record does not
              distinguish among those treatments. Consequently, recurring software quality is plausible but not
              underwritten, and neither gross-margin scalability nor sales efficiency can be calculated from public
              inputs.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI009
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI014
              - CI015
      - number: '4.2'
        title: Operating traction is not financial traction
        blocks:
          - type: paragraph
            body: >-
              Neara and financing coverage report more than 15 million modeled assets, more than 3 million kilometres of
              infrastructure across four continents, and relationships with nearly 90% of Australian network utilities.
              TechCrunch also reported a customer case in which SA Power Networks analyzed 21,000 spans in 15 minutes
              rather than months and re-energized lines in five days rather than an anticipated three weeks. These
              measures indicate deployment scale and potential customer value, not revenue, ARR, recognized backlog,
              gross profit, or cash collection. No retained source connects assets, kilometres, utilities, time savings,
              or claimed cost savings to contract value or realized pricing. An independent company review explicitly
              asks for more case studies and specific cost savings, reinforcing that the economic denominator behind the
              operating claims remains thin.
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI012
              - CI014
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI009
              - CI014
      - number: '4.3'
        title: Capital adequacy remains unmeasurable
        blocks:
          - type: paragraph
            body: >-
              Multiple publications report that Neara closed an A$90 million Series D in February 2026 and had raised
              approximately A$180 million in total. Reported use of proceeds centers on machine-learning and AI
              engineering hires plus international commercial expansion, both of which imply continued investment rather
              than an immediate profitability commitment. Funding raised is not cash on hand: the public evidence
              provides no closing cash balance, net burn, runway, debt or credit facilities, restricted cash,
              project-finance obligations, capex plan, or next-round trigger. The UK corporate register confirms that
              Neara Software Ltd's latest filed accounts cover the year to 30 June 2025, but the fetched overview does
              not expose financial figures and is not a consolidated view of the group. Capital adequacy therefore
              cannot be tested against current obligations or expansion plans.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is promising in mechanism but presently non-underwritable in magnitude. Enterprise
              software could support recurring, high-margin revenue, while utility data ingestion, implementation
              support, and a global field organization could create material services or deployment costs. Public
              sources do not resolve that mix. Directional SaaS benchmarks define the necessary tests—gross margin, net
              dollar retention, CAC payback, burn multiple, and runway—but they are not substitutes for Neara's actual
              cohorts and accounts, and the benchmark publisher itself cautions that vertical and go-to-market motion
              matter. Source quality also requires care: TCV states that information on its website, including
              portfolio-company material, has not been independently verified. Investment underwriting should therefore
              remain conditional on a management data room that reconciles contracts, revenue recognition, delivery
              costs, retention, cash, burn, and debt.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing does not establish runway
            body: >-
              The reported A$90 million Series D is capital raised, not a disclosed cash balance. Underwriting still
              requires closing cash, monthly net burn, debt, working-capital needs, and a scenario-based runway tied to
              the planned hiring and international expansion.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI009
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and utility workflow
        blocks:
          - type: paragraph
            body: >-
              Neara is described as a software platform that turns utility network data into an engineering-grade
              digital twin. The documented input pattern combines LiDAR, geospatial, satellite, and imagery data, while
              the operating output is a network-wide model that can simulate asset behavior under weather, flood,
              wildfire, and design scenarios. The customer workflow is therefore not simply visualization: teams ingest
              or reuse network data, generate a model, test scenarios, identify vulnerable assets or clearance breaches,
              and prioritize field or capital interventions. Public customer examples show this workflow applied to
              flood response, vegetation risk, grid hardening, and renewable-connection planning. The distinction
              matters because the product's value depends on the quality and freshness of source data and on whether
              model outputs are accepted for consequential engineering decisions.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.2'
        title: Architecture, delivery, and maturity
        blocks:
          - type: paragraph
            body: >-
              The available technical evidence supports a layered architecture rather than a single opaque AI feature.
              Neara combines multimodal spatial data ingestion, a 3D network representation, physics-enabled simulation,
              machine-learning services, and decision workflows for utility teams. A current engineering hiring surface
              describes training data warehouses, distributed compute, model serving, model monitoring, cloud and
              container infrastructure, and multimodal point-cloud, geospatial, and asset models. A deployment
              leadership role separately describes model build, QA, contractor execution, standardization, and delivery
              metrics. Together these are evidence of an operating model designed to industrialize deployments, not
              proof that every layer is mature across all customers. Public disclosures do not establish service-level
              objectives, incident history, customer-specific data residency, model error rates, or the exact interface
              between customer systems and the platform.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Differentiation, controls, and key risks
        blocks:
          - type: paragraph
            body: >-
              Neara's stated differentiation is the combination of physics-based simulation and network-wide spatial
              context, intended to move utilities from manual surveys and fragmented analyses toward repeatable scenario
              testing. External and customer-linked reporting describes faster analysis in several use cases, including
              a 15-minute flood report covering 21,000 powerline spans and a reduction of one CenterPoint field-analysis
              process from a historical year and a half to three hours. These are use-case outcomes, not a general
              benchmark or guarantee. The central technical diligence question is whether the same accuracy and
              throughput persist when LiDAR or GIS data are incomplete, stale, inconsistent, or expanded to new
              verticals. Independent model-verification guidance recommends risk-informed verification and validation
              for digital twins; Neara's public materials do not disclose a comparable customer-facing V&V dossier,
              security certification set, or production model-monitoring results.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits summarize the disclosed product layers, customer workflow, and operating dependencies without
              implying that unreported metrics are zero or that marketing claims are independently verified. They are
              deliberately framed as evidence maps: a module or workflow appears because a retained source describes it,
              while a missing metric remains a diligence question. This avoids turning a current hiring requirement into
              proof of a shipped feature or turning a customer case study into a population-wide benchmark.
            claimRefs: []
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product strength
            body: >-
              The strongest public proof is workflow compression in named utility use cases, especially flood analysis
              and field-insight prioritization, rather than a generic AI performance claim.
            calloutType: strength
            claimRefs:
              - CE010
              - CE011
              - CE012
          - type: callout
            title: Technical diligence risk
            body: >-
              Neara's value is sensitive to source-data quality, deployment QA, and model validation; public sources do
              not provide error bounds, monitoring results, or customer-specific security and residency controls.
            calloutType: risk
            claimRefs:
              - CE006
              - CE009
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and customer segmentation
        blocks:
          - type: paragraph
            body: >-
              Neara sells into electricity-network operators whose operating problems are geographically distributed,
              safety-critical, and expensive to inspect manually. The buyer is typically a utility or network operator;
              public descriptions place engineering, asset-management, vegetation, emergency-response, field-inspection,
              and planning teams in the operating workflow, while the communities served by the network are indirect
              beneficiaries. Reporting names Australian operators such as Essential Energy, Endeavour Energy, Ausgrid,
              Ausnet, Powercor, and SA Power Networks, as well as Southern California Edison, CenterPoint Energy, ESB
              Networks, Scottish Power, and Hedno. The evidence therefore supports a multi-market utility customer base,
              but not a verified count of active accounts, contract size, revenue contribution, or whether every named
              organization is in production rather than a pilot or project relationship.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and operating outcomes
        blocks:
          - type: paragraph
            body: >-
              Adoption is best evidenced by the scope and recurrence of operational workflows, not by the existence of a
              logo. TechCrunch reports that SA Power Networks analyzed 21,000 power-line spans in 15 minutes after the
              River Murray floods and re-energized lines within five days versus an originally expected three weeks.
              Endeavour Energy used the twin across four successive floods, eliminating 300 hours of inspection time,
              while another report attributes a 50% faster high-risk vegetation response to Southern California Edison.
              CenterPoint's deployment covers an 8,000-square-kilometer service area, and 2026 reporting attributes more
              than 15 million modeled assets to Neara. These signals measure projects, assets, or response episodes, not
              paid-seat activity, renewal, or recurring revenue.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named proof, durability, and expansion
        blocks:
          - type: paragraph
            body: >-
              Named proof spans production-like emergency response, network planning, resilience, vegetation management,
              and asset prioritization. Endeavour's account describes repeated use during record floods and continued
              use for maintenance and future-grid planning; CenterPoint's reported engagement covers resilience planning
              after Hurricane Beryl; and Southern California Edison is linked to high-risk vegetation response. This
              breadth suggests expansion potential from one urgent workflow into adjacent asset and planning functions.
              However, no assigned source reports net retention, gross retention, churn, renewal rate, contract length,
              customer satisfaction, or a top-customer revenue share. The commercial durability thesis is therefore
              supported by repeated use cases, not quantified retention, and a 2024 plan to enter other infrastructure
              sectors is not evidence of current customers there.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Procurement friction and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Utility procurement is likely a material adoption constraint because deployments touch critical
              infrastructure, field data, safety decisions, and regulated operations. The assigned Vertice benchmark
              reports average new software purchases of 53.9 days and renewals of 90.5 days in Q3 2026 across more than
              75 billion dollars of processed spend; this is not Neara-specific evidence, but it frames the likely
              approval burden for enterprise infrastructure software. Neara's Australian penetration and named
              multinational accounts indicate geographic reach, yet the public record does not provide customer-level
              revenue, account-level contract terms, or a denominator for concentration. Investors should treat
              expansion and concentration as open diligence questions rather than infer low risk from the breadth of
              named logos.
            claimRefs:
              - CU013
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU010
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Operational proof is stronger than logo proof
            body: >-
              The strongest public evidence is repeated utility use in flood response, wildfire/vegetation risk, and
              resilience planning, including quantified cycle-time or inspection outcomes.
            calloutType: strength
            claimRefs:
              - CU005
              - CU009
              - CU011
          - type: callout
            title: Retention and concentration remain unmeasured
            body: >-
              Public sources name utilities and report modeled assets, but do not disclose customer-level revenue,
              renewal, churn, contract duration, or concentration denominators.
            calloutType: risk
            claimRefs:
              - CU012
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Neara's highest-consequence exposure is operational rather than merely commercial: customers may use its
              models to prioritize infrastructure work, outage response, wildfire mitigation, or flood decisions.
              TechCrunch reports that a one-degree elevation error can produce inaccurate flood-water levels, while
              Neara's CenterPoint deployment is aimed at an 8,000-square-kilometer service area after Hurricane Beryl
              caused $1.7 billion of damage and left 87% of CenterPoint customers without power. These facts make model
              accuracy, data lineage, and customer validation material diligence items. The available evidence documents
              speed and use cases, but not an independently audited error rate, service-level agreement, model-incident
              history, or financial penalty exposure. A thesis break would be a substantiated customer safety or
              reliability incident attributable to model output, repeated inability to refresh customer asset data, or a
              material loss of a utility relationship. Monitoring should therefore include validated false-negative and
              false-positive rates by use case, model refresh latency, critical customer renewals, and any incident or
              regulator finding involving Neara-supported decisions.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR010
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Grid rules are tightening around reliability, cyber controls, and visibility into large loads. The
              Australian Energy Market Commission draft described in the assigned WattClarity source would introduce
              ride-through standards for large data-centre connections, clearer disturbance data, and compliance terms
              for non-registered facilities; the source says submissions close on 7 May 2026 and a final rule was
              expected mid-year, so the proposal must not be treated as enacted. In the United States, FERC's 19 March
              2026 action approved updated virtualization and low-impact cybersecurity standards, including remote-user
              password protocols and intrusion detection. These changes can support demand for Neara's planning and
              resilience workflows, but they also raise the bar for security, auditability, data handling, and customer
              integration. No assigned source establishes a Neara license, certification, litigation record, privacy
              incident, or enforcement action. The appropriate stance is conditional: treat regulatory alignment as a
              potential tailwind, but require jurisdiction-by-jurisdiction mapping of product claims, data residency,
              security controls, and contractual liability before underwriting regulated deployment.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Operational, partner, and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              Neara's product depends on ingesting LiDAR, satellite, sensor, and utility asset data and converting it
              into a usable digital twin. TechCrunch says LiDAR is critical to accurate simulation and that some
              customers continuously scan networks while others rely on historic data; this creates exposure to
              incomplete coverage, stale asset states, inconsistent capture standards, and customer-side integration
              work. The company also relies on utility partners and long enterprise procurement cycles: Kurrant
              describes a       CenterPoint deal for predictive analysis across a large service territory, while Energy,
              Oil & Gas reports customer-specific recovery and vegetation-management outcomes. Public sources do not
              disclose churn, net retention, customer concentration by revenue, gross margin, burn, runway, or the
              contractual allocation of model-risk liability. The February 2026 funding coverage describes AUD 90
              million of Series D capital and an expansion of the workforce, but funding raised is not cash available
              and does not prove runway. Diligence should tie renewals and expansion to verified production use,
              reconcile data refresh obligations, and obtain audited or management-certified unit economics.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR010
              - CR011
      - number: '7.4'
        title: Mitigations, monitoring, and diligence path
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a mitigation plan, not a conclusion that risk is low. Neara's physics-enabled
              approach is designed to model conductors, poles, clearances, flood levels, wildfire conditions, and
              network capacity; TechCrunch also describes a River Murray analysis of 21,000 spans completed in 15
              minutes and restoration in five days versus an initial three-week expectation. Those outcomes are useful
              operating evidence but remain case-specific and do not establish generalized accuracy or customer
              economics. Management should provide validation packs for each high-consequence workflow, including
              baseline data quality, exception handling, human approval steps, incident escalation, and post-event
              reconciliation. Investors should monitor renewal and expansion by named production customer, the share of
              models using current versus historic data, security-control attestations, regulatory commitments by
              jurisdiction, and cash runway. Kill criteria should be explicit: a material security or safety incident,
              an unremediated critical-model defect, loss of a key utility without replacement expansion, or financing
              terms that imply materially higher dilution than the operating evidence supports.
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR013
              - CR014
          - type: table
            tableRef: TR004
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-consequence unknown
            body: >-
              Neara's platform is used to inform grid-resilience decisions, yet the assigned evidence does not disclose
              a Neara-specific model-error, security-incident, or service-level history. Underwriting should require
              validation and incident evidence before treating operational risk as low.
            calloutType: risk
            claimRefs:
              - CR001
              - CR007
              - CR010
          - type: callout
            title: Regulatory tailwind with a compliance trade-off
            body: >-
              AEMC and FERC actions show stronger requirements for grid visibility, reliability, and cyber controls.
              This may enlarge the need for infrastructure intelligence while increasing the proof burden on Neara and
              its utility customers.
            calloutType: insight
            claimRefs:
              - CR006
              - CR007
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a research-more recommendation rather than a buy decision. Dealroom records a
              February 2026 Series D of $58 million at a $712 million valuation, while its only public revenue
              disclosure is a $1 million-$10 million range and its year-by-year revenue series is blank. Using the top
              of that range produces an estimated equity valuation-to-revenue ratio of at least 71.2x. That calculation
              is not an ARR multiple and cannot be compared mechanically with enterprise-value multiples because Neara's
              net debt, cash, security terms, and exact revenue period are not public. It nevertheless establishes a
              demanding entry burden: Multiples.vc reports 1.9x NTM EV/revenue for public energy and utilities software,
              and MarketScreener reports 6.35x 2026 EV/revenue for Hexagon. Neara may deserve a private-growth premium,
              but the disclosed evidence cannot quantify one. The valuation stance is therefore stretched, confidence is
              medium, and risk is high; a price recommendation should wait for primary financial and cap-table evidence.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV008
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public financing records do not reconcile to one investable cap-table view. TechEDT reports an AUD 90
              million Series D and approximately AUD 180 million of total capital raised; Indexed.vc reports $196.3
              million across four rounds; and Dealroom records the Series D as $58 million with a $712 million
              valuation. These may reflect foreign-exchange conversion, different inclusion rules, or different update
              dates, but none of the sources discloses a fully diluted capitalization, whether the valuation is pre- or
              post-money, liquidation preferences, participation rights, debt, or cash on hand. Funding raised is not
              cash available, so runway and gross dilution cannot be inferred. Entry discipline should require the
              signed term sheet, closing documents, option-pool treatment, all preferred-security terms, debt schedules,
              current cash, and monthly burn. Without those items, neither target return nor hold-period return can be
              modeled responsibly.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV015
      - number: '8.3'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis rests on evidence that Neara solves expensive, mission-critical utility workflows.
              TechCrunch reported that SA Power Networks analyzed 21,000 power-line spans in 15 minutes during the River
              Murray flood response, while TechEDT reported that Neara works with close to 90% of Australian network
              utilities. Those signals support product utility, referenceability, and a potentially durable
              vertical-software position. The anti-thesis is that commercial proof remains less transparent than the
              valuation: ChoppingBlock explicitly called for more case studies and specific cost-saving examples, and
              the available sources do not disclose audited revenue, ARR, gross margin, net revenue retention, customer
              concentration, or burn. The product evidence therefore supports continued diligence, not an unconditional
              premium. The view would improve with audited cohort economics and contract-level expansion data; it would
              deteriorate if reference customers do not convert into repeatable, high-margin recurring revenue.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Scenarios, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              A numerical bull/base/bear valuation range is not supportable from the assigned public evidence because
              the denominator, capital structure, and security waterfall are missing. The scenario framework is
              therefore milestone- and price-sensitive. A bull case requires verified growth, retention, margins, and
              utility expansion strong enough to justify a premium to public vertical-software references. The base case
              treats the $712 million Dealroom mark as a financing reference, not fair value, until exact operating
              metrics are supplied. The bear case is a material reset below that mark if growth, retention, or margins
              are weak, or if preferences amplify common-equity downside. Hexagon is a useful mature boundary at 6.35x
              2026 EV/revenue, while Multiples.vc's 1.9x energy-and-utilities benchmark provides a sector anchor;
              neither is a direct private-company comparable. Exit readiness is unproven because no source supplies
              IPO-grade financials or a relevant transaction set. Thesis-break triggers are failure to reconcile
              financing records, weak audited unit economics, concentrated or non-renewing contracts, and a security
              waterfall that prevents target returns at a realistic exit.
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive decision
            body: >-
              Research more at the recorded valuation. A lower price alone is insufficient unless exact operating
              metrics, cash, dilution, and preference terms also support the target return.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV015
              - CV016
          - type: callout
            title: Financing is not runway
            body: >-
              Reported capital raised cannot be treated as cash available; current cash, debt, burn, and committed uses
              remain undisclosed.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
