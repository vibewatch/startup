chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Tracxn describes Neara as a Sydney-based Series D company founded in 2016, while both Tracxn and Equilar
              characterize the product as physics-enabled digital-twin software for utility or critical-infrastructure
              networks. The platform ingests infrastructure data and supports engineering simulation, scenario analysis,
              risk assessment, maintenance prioritization, and network design. TechCrunch reported that Neara launched
              commercially in 2019 and described applications spanning wildfire, flood, wind, ice, and snow risk. This
              evidence supports an enterprise software model sold into utilities and infrastructure operators rather
              than a consumer or asset-owning model. However, none of the assigned sources establishes pricing, contract
              duration, subscription mix, implementation revenue, or gross margin, so the exact commercial model remains
              a diligence gap rather than an inferred SaaS profile.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO013
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Startup Daily and TechCrunch identify Daniel Danilatos, Karamvir Singh, and Jack Curtis as Neara's
              co-founders. Startup Daily further identifies Curtis as chief commercial officer, providing direct
              evidence of founder-led commercial execution, but the assigned text does not establish current titles for
              Danilatos or Singh. Equilar describes three executive role categories—founder and chief executive officer,
              chief commercial and operations officer, and chief product officer—yet its fetched public text omits the
              associated names. The evidence therefore supports a three-founder origin and a founder-led operating
              structure, but not a complete current executive or board roster. Director independence, board rights,
              voting control, succession planning, and changes in leadership remain undisclosed, making key-person and
              governance dependence impossible to quantify from public evidence.
