  - id: FM001
    title: Market signal to adoption proof
    type: pyramid
    summary: >-
      Six disclosed indicators move from global demand pressure to Neara-specific workflow and adoption evidence without
      implying an additive market size.
    data:
      nodes:
        - label: Global data-centre electricity demand in 2024
          value: 415
          unit: TWh
          detail: IEA figure reported in the cited 2026 coverage.
        - label: Global data-centre electricity demand forecast for 2030
          value: 945
          unit: TWh
          detail: IEA forecast reported in the cited 2026 coverage.
        - label: SA Power Networks spans analyzed
          value: 21000
          unit: power-line spans
          detail: Flood-area analysis reported by TechCrunch.
        - label: SA Power Networks analysis time
          value: 15
          unit: minutes
          detail: TechCrunch reports that the manual process would otherwise have taken months.
        - label: Southern California Edison vegetation response
          value: 50
          unit: percent faster
          detail: Outcome reported in the Renewable Energy World article.
        - label: Australian electricity network utility penetration
          value: 90
          unit: percent, approximately
          detail: Forbes Australia reports that Neara works with close to 90 percent of the network utilities.
    approximationNotes: >-
