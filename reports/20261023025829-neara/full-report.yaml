      between subscription and services revenue.
    claimRefs:
      - CI003
      - CI014
      - CI015
  - id: FE001
    title: Neara product architecture map
    type: stack
    summary: Neara's disclosed product layers connect utility data to physics-enabled simulations and operational decisions.
    data:
      layers:
        - label: Decision workflows
          detail: Translate modeled conditions into utility planning and intervention decisions.
          items:
            - label: Risk prioritization
              detail: Select assets and interventions for planning, response, or hardening.
            - label: Network planning
              detail: Evaluate design, capacity, and renewable-connection scenarios.
        - label: Simulation
          detail: Run environmental and engineering scenarios against the modeled network.
          items:
            - label: Weather and flood scenarios
              detail: Test network behavior under environmental conditions.
            - label: Structural and clearance analysis
              detail: Examine asset loading, clearances, and failure-risk conditions.
        - label: Digital twin
          detail: Represent network assets and surrounding context in three dimensions.
          items:
            - label: 3D network model
              detail: Represent network components and surrounding context.
            - label: Asset and terrain context
              detail: Retain network, environmental, and engineering context for scenario analysis.
        - label: ML services
          detail: Automate classification, data preparation, and complex scenario analysis.
          items:
            - label: Classification and scenario analysis
              detail: Apply machine learning to data preparation and complex analyses.
        - label: Data foundation
          detail: Supply spatial observations, asset records, and engineering context.
          items:
            - label: LiDAR and imagery
              detail: Capture spatial observations from utility or third-party sources.
            - label: GIS and engineering data
              detail: Supply asset, geospatial, and specification context.
        - label: Utility integrations
          detail: Connect modeled outputs to customer planning, operations, and field processes.
          items:
            - label: Planning and response outputs
              detail: Deliver prioritized risks and scenario results to utility teams.
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: Customer journey from utility pain to expansion
    type: journey-map
    summary: >-
      Neara's public customer evidence follows a path from data and inspection pain through emergency analysis,
      operational adoption, and adjacent planning use cases.
    data:
      nodes:
        - id: utility-need
          label: Network risk or inspection burden
          title: Network risk or inspection burden
          description: Distributed assets, extreme weather, and manual inspection create urgency.
          touchpoints:
            - Floods
            - wildfire risk
            - asset maintenance
            - new-load planning
        - id: data-ingestion
          label: Build the digital twin
          title: Build the digital twin
          description: LiDAR, imagery, network records, and sensors are combined into a network model.
          touchpoints:
            - Historic data
            - current scans
            - network records
        - id: scenario-analysis
          label: Simulate conditions
          title: Simulate conditions
          description: Utility teams test flood, wind, fire, loading, and outage scenarios before field action.
          touchpoints:
            - Risk identification
            - capacity questions
            - asset prioritization
        - id: emergency-response
          label: Act during an event
          title: Act during an event
          description: Named deployments support rapid assessment, safe isolation, and reconnection decisions.
          touchpoints:
            - SA Power Networks flood response
            - Endeavour flood response
        - id: operational-adoption
          label: Repeat operational workflows
          title: Repeat operational workflows
          description: The model extends into vegetation, maintenance, resilience, and inspection prioritization.
          touchpoints:
            - Southern California Edison
            - Endeavour Energy
            - CenterPoint Energy
        - id: expansion
          label: Broaden infrastructure scope
          title: Broaden infrastructure scope
          description: Neara reports plans to extend predictive modeling beyond electricity into other infrastructure sectors.
          touchpoints:
            - Telecommunications
            - public transportation
    claimRefs:
      - CU004
      - CU010
      - CU015
      - CU016
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Residual exposure is highest where Neara-supported decisions combine safety-critical outcomes with unverified
      control evidence.
    data:
      columns:
        - Likelihood
        - Impact
        - Residual severity
        - Monitoring signal
      rows:
        - label: Model or data error
          values:
            - Medium
            - Very high
            - High
            - Validated error rate
        - label: Cybersecurity or compliance
          values:
            - Medium
            - Very high
            - High
            - Security attestation
        - label: Customer-data refresh
          values:
            - Medium
            - High
            - Medium-high
            - Refresh latency
        - label: Utility concentration
          values:
            - Medium
            - High
            - Medium-high
            - Renewal and expansion
        - label: Funding and runway opacity
          values:
            - Medium
            - High
            - High
            - Cash runway
        - label: Case-study generalization
          values:
            - Medium
            - High
            - Medium-high
            - Cross-customer benchmark
    approximationNotes: >-
      Likelihood and residual-severity labels are qualitative analyst judgments based on assigned evidence and
      explicitly disclosed gaps; they are not statistical probabilities.
    claimRefs:
      - CR001
      - CR006
      - CR010
      - CR013
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Product and adoption proof are positive, but disclosure and valuation gaps gate an investment decision.
    data:
      nodes:
        - id: utility-proof
          label: Utility workflow proof
          detail: 21,000 power-line spans analyzed in 15 minutes in the cited SA Power Networks example.
        - id: adoption
          label: Adoption signal
          detail: Reported work with close to 90% of Australian network utilities.
        - id: financing
          label: Fresh financing
          detail: Series D records provide expansion capital but do not establish cash available.
        - id: disclosure-gap
          label: KPI and terms gap
          detail: Exact revenue quality, margins, retention, cash, debt, and preferences are unavailable.
        - id: valuation-burden
          label: High valuation burden
          detail: Recorded valuation implies at least 71.2x the upper end of the disclosed revenue range.
        - id: recommendation
          label: Research-more
          detail: Require primary financial and cap-table evidence before pricing an entry.
      edges:
        - source: utility-proof
          target: adoption
        - source: adoption
          target: financing
        - source: financing
          target: disclosure-gap
        - source: disclosure-gap
          target: valuation-burden
        - source: valuation-burden
          target: recommendation
    approximationNotes: >-
      The flow is a qualitative decision chain; the 71.2x estimate uses Dealroom's broad revenue range and recorded
      valuation and is not an enterprise-value or ARR multiple.
    claimRefs:
      - CV006
      - CV008
      - CV012
      - CV013
      - CV015
      - CV016
