    rows:
      - ["Incorrect elevation or asset geometry produces unsafe flood or clearance decision", Medium, "Very high", "Partial; physics-based simulation and LiDAR are described", High, "No independent Neara error-rate or incident dataset"]
      - ["Historic data no longer represents current network state", Medium, High, "Partial; some customers continuously scan while others use historic data", "Medium-high", "No disclosed refresh SLA or stale-data threshold"]
      - ["Cyber compromise or insecure remote access", Medium, "Very high", "Unverified; FERC standards raise the control baseline", High, "No Neara-specific security attestation or incident history in pool"]
      - ["Large-scale analysis does not generalize beyond case studies", Medium, High, "Partial; 21,000-span and customer examples exist", "Medium-high", "No cross-customer benchmark with denominator and error bars"]
    notes: "Rows separate evidenced operating mechanisms from unresolved control evidence; severity is not a claim that an incident occurred."
    claimRefs: [CR001, CR002, CR007, CR010, CR011]
  - id: TR004
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or owner, Role, Concentration signal, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["LiDAR, satellite, and sensor inputs", "Utility or third-party capture provider", "Feeds the digital twin", "Customer-specific and variable", "Missing or stale coverage undermines simulation", High, "Refresh governance and exception review", "Medium-high"]
      - ["Utility procurement and production adoption", Regulated network operators, "Buyer, operator, and workflow owner", "Named deployments span several markets but revenue concentration is undisclosed", "Key renewal or procurement loss", High, "Prove production outcomes and expansion by account", "Medium-high"]
      - ["Cloud and software security controls", "Neara and customer IT environments", "Platform delivery and access", "Contractual allocation is undisclosed", "Availability, access, or cyber failure interrupts critical workflows", "Very high", "Obtain architecture, recovery objectives, and incident obligations", High]
      - ["External capital", "TCV and other investors", "Funds international expansion and hiring", "AUD 90 million Series D reported; cash balance and runway unknown", "Capital need arrives before operating leverage", High, "Reconcile cash, burn, covenants, and dilution", High]
    notes: "The register identifies dependencies visible in assigned sources; it does not infer exclusivity or contractual concentration where sources are silent."
    claimRefs: [CR010, CR011, CR012, CR013, CR014]

figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Residual exposure is highest where Neara-supported decisions combine safety-critical outcomes with unverified control evidence.
    data:
      columns: [Likelihood, Impact, Residual severity, Monitoring signal]
      rows:
        - label: Model or data error
          values: [Medium, "Very high", High, "Validated error rate"]
        - label: Cybersecurity or compliance
          values: [Medium, "Very high", High, "Security attestation"]
        - label: Customer-data refresh
          values: [Medium, High, "Medium-high", "Refresh latency"]
        - label: Utility concentration
          values: [Medium, High, "Medium-high", "Renewal and expansion"]
        - label: Funding and runway opacity
          values: [Medium, High, High, "Cash runway"]
        - label: Case-study generalization
          values: [Medium, High, "Medium-high", "Cross-customer benchmark"]
    approximationNotes: "Likelihood and residual-severity labels are qualitative analyst judgments based on assigned evidence and explicitly disclosed gaps; they are not statistical probabilities."
    claimRefs: [CR001, CR006, CR010, CR013, CR014]

callouts:
  - calloutType: risk
    title: Highest-consequence unknown
    body: Neara's platform is used to inform grid-resilience decisions, yet the assigned evidence does not disclose a Neara-specific model-error, security-incident, or service-level history. Underwriting should require validation and incident evidence before treating operational risk as low.
    claimRefs: [CR001, CR007, CR010]
  - calloutType: insight
    title: Regulatory tailwind with a compliance trade-off
    body: AEMC and FERC actions show stronger requirements for grid visibility, reliability, and cyber controls. This may enlarge the need for infrastructure intelligence while increasing the proof burden on Neara and its utility customers.
    claimRefs: [CR006, CR007, CR008]

