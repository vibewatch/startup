company:
  name: Neara
chapter:
  number: 7
  title: Risks
  summary: Neara addresses consequential grid-resilience problems, but its risk profile remains tied to utility data quality, regulatory change, concentration in critical-infrastructure buyers, and limited public disclosure of operating performance. The strongest mitigants are physics-based modeling, documented utility use cases, and growing regulatory demand for better grid visibility; the key unresolved question is whether those mitigants scale reliably across jurisdictions and customer workflows.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis-break triggers
    body: >-
      Neara's highest-consequence exposure is operational rather than merely commercial: customers may use its models to prioritize infrastructure work, outage response, wildfire mitigation, or flood decisions. TechCrunch reports that a one-degree elevation error can produce inaccurate flood-water levels, while Neara's CenterPoint deployment is aimed at an 8,000-square-kilometer service area after Hurricane Beryl caused $1.7 billion of damage and left 87% of CenterPoint customers without power. These facts make model accuracy, data lineage, and customer validation material diligence items. The available evidence documents speed and use cases, but not an independently audited error rate, service-level agreement, model-incident history, or financial penalty exposure. A thesis break would be a substantiated customer safety or reliability incident attributable to model output, repeated inability to refresh customer asset data, or a material loss of a utility relationship. Monitoring should therefore include validated false-negative and false-positive rates by use case, model refresh latency, critical customer renewals, and any incident or regulator finding involving Neara-supported decisions.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Regulatory and legal exposure
    body: >-
      Grid rules are tightening around reliability, cyber controls, and visibility into large loads. The Australian Energy Market Commission draft described in the assigned WattClarity source would introduce ride-through standards for large data-centre connections, clearer disturbance data, and compliance terms for non-registered facilities; the source says submissions close on 7 May 2026 and a final rule was expected mid-year, so the proposal must not be treated as enacted. In the United States, FERC's 19 March 2026 action approved updated virtualization and low-impact cybersecurity standards, including remote-user password protocols and intrusion detection. These changes can support demand for Neara's planning and resilience workflows, but they also raise the bar for security, auditability, data handling, and customer integration. No assigned source establishes a Neara license, certification, litigation record, privacy incident, or enforcement action. The appropriate stance is conditional: treat regulatory alignment as a potential tailwind, but require jurisdiction-by-jurisdiction mapping of product claims, data residency, security controls, and contractual liability before underwriting regulated deployment.
    claimRefs: [CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: operating-dependencies
    title: Operational, partner, and financial-model risks
    body: >-
      Neara's product depends on ingesting LiDAR, satellite, sensor, and utility asset data and converting it into a usable digital twin. TechCrunch says LiDAR is critical to accurate simulation and that some customers continuously scan networks while others rely on historic data; this creates exposure to incomplete coverage, stale asset states, inconsistent capture standards, and customer-side integration work. The company also relies on utility partners and long enterprise procurement cycles: Kurrant describes a       CenterPoint deal for predictive analysis across a large service territory, while Energy, Oil & Gas reports customer-specific recovery and vegetation-management outcomes. Public sources do not disclose churn, net retention, customer concentration by revenue, gross margin, burn, runway, or the contractual allocation of model-risk liability. The February 2026 funding coverage describes AUD 90 million of Series D capital and an expansion of the workforce, but funding raised is not cash available and does not prove runway. Diligence should tie renewals and expansion to verified production use, reconcile data refresh obligations, and obtain audited or management-certified unit economics.
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
  - id: diligence-priorities
    title: Mitigations, monitoring, and diligence path
    body: >-
      The evidence supports a mitigation plan, not a conclusion that risk is low. Neara's physics-enabled approach is designed to model conductors, poles, clearances, flood levels, wildfire conditions, and network capacity; TechCrunch also describes a River Murray analysis of 21,000 spans completed in 15 minutes and restoration in five days versus an initial three-week expectation. Those outcomes are useful operating evidence but remain case-specific and do not establish generalized accuracy or customer economics. Management should provide validation packs for each high-consequence workflow, including baseline data quality, exception handling, human approval steps, incident escalation, and post-event reconciliation. Investors should monitor renewal and expansion by named production customer, the share of models using current versus historic data, security-control attestations, regulatory commitments by jurisdiction, and cash runway. Kill criteria should be explicit: a material security or safety incident, an unremediated critical-model defect, loss of a key utility without replacement expansion, or financing terms that imply materially higher dilution than the operating evidence supports.
    claimRefs: [CR002, CR003, CR010, CR013, CR014]
    tableRefs: [TR004]

