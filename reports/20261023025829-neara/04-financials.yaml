company:
  name: Neara
chapter:
  number: 4
  title: Financials
  summary: >-
    Neara appears to monetize a sales-led enterprise software platform for utilities, with
    substantial operating-scale and customer-value claims but no public revenue, ARR, realized
    pricing, margin, retention, burn, cash, or runway disclosure. The reported A$90 million
    Series D finances expansion, but it is not evidence of current cash available or efficient
    unit economics.
sections:
  - id: revenue-model-and-gtm
    title: Revenue model and go-to-market economics
    body: >-
      Public evidence identifies Neara as a cloud-based SaaS platform used by large utilities,
      but it does not reveal whether contracts are priced by network, asset, seat, module,
      project, or usage. Named deployments across regulated utilities and the absence of
      self-serve pricing point to a relationship-led enterprise motion, although sales cycle,
      channel mix, quotas, commissions, and customer-acquisition cost remain undisclosed.
      Delivery also depends on LiDAR and other network data captured by customers or third
      parties. That dependency may leave data acquisition, integration, onboarding, and
      engineering support either customer-borne, passed through, or embedded in Neara's cost of
      revenue; the public record does not distinguish among those treatments. Consequently,
      recurring software quality is plausible but not underwritten, and neither gross-margin
      scalability nor sales efficiency can be calculated from public inputs.
    claimRefs: [CI001, CI002, CI003, CI011]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-versus-financial-visibility
    title: Operating traction is not financial traction
    body: >-
      Neara and financing coverage report more than 15 million modeled assets, more than
      3 million kilometres of infrastructure across four continents, and relationships with
      nearly 90% of Australian network utilities. TechCrunch also reported a customer case in
      which SA Power Networks analyzed 21,000 spans in 15 minutes rather than months and
      re-energized lines in five days rather than an anticipated three weeks. These measures
      indicate deployment scale and potential customer value, not revenue, ARR, recognized
      backlog, gross profit, or cash collection. No retained source connects assets, kilometres,
      utilities, time savings, or claimed cost savings to contract value or realized pricing.
      An independent company review explicitly asks for more case studies and specific cost
      savings, reinforcing that the economic denominator behind the operating claims remains
      thin.
    claimRefs: [CI004, CI005, CI009, CI012, CI014, CI015]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Capital adequacy remains unmeasurable
    body: >-
      Multiple publications report that Neara closed an A$90 million Series D in February 2026
      and had raised approximately A$180 million in total. Reported use of proceeds centers on
      machine-learning and AI engineering hires plus international commercial expansion, both
      of which imply continued investment rather than an immediate profitability commitment.
      Funding raised is not cash on hand: the public evidence provides no closing cash balance,
      net burn, runway, debt or credit facilities, restricted cash, project-finance obligations,
      capex plan, or next-round trigger. The UK corporate register confirms that Neara Software
      Ltd's latest filed accounts cover the year to 30 June 2025, but the fetched overview does
      not expose financial figures and is not a consolidated view of the group. Capital
      adequacy therefore cannot be tested against current obligations or expansion plans.
    claimRefs: [CI006, CI007, CI008, CI009, CI016]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The financial case is promising in mechanism but presently non-underwritable in
      magnitude. Enterprise software could support recurring, high-margin revenue, while
      utility data ingestion, implementation support, and a global field organization could
      create material services or deployment costs. Public sources do not resolve that mix.
      Directional SaaS benchmarks define the necessary tests—gross margin, net dollar
      retention, CAC payback, burn multiple, and runway—but they are not substitutes for
      Neara's actual cohorts and accounts, and the benchmark publisher itself cautions that
      vertical and go-to-market motion matter. Source quality also requires care: TCV states
      that information on its website, including portfolio-company material, has not been
      independently verified. Investment underwriting should therefore remain conditional on
      a management data room that reconciles contracts, revenue recognition, delivery costs,
      retention, cash, burn, and debt.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI016]
tables:
  - id: TI001
    title: Revenue streams and monetization status
    columns:
      - Stream
      - Mechanism
      - Potential unit
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - - Core platform access
        - Enterprise SaaS or cloud software contract
        - Not disclosed
        - SaaS classification is public; contract mechanics are not
        - Recurrence and minimum commitments unverified
        - Provide contract templates, billing schedules, and ARR bridge
      - - Implementation and onboarding
        - Deployment, integration, or professional services
        - Project, milestone, or bundled fee
        - No separate revenue stream disclosed
        - Services mix and recognition timing unknown
        - Split software, services, and pass-through revenue by year
      - - Data capture and ingestion
        - LiDAR and other network-data preparation
        - Asset, kilometre, survey, or project basis
        - Customers or third parties capture LiDAR; monetization is unknown
        - Payer and gross-margin treatment unknown
        - Identify who pays capture costs and how they enter cost of revenue
      - - Expansion and additional use cases
        - More networks, modules, assets, or scenarios
        - Not disclosed
        - Large deployment scale is reported without pricing linkage
        - Expansion revenue and NDR are unavailable
        - Provide cohort ARR, module attach, upsell, contraction, and churn
    notes: >-
      The table separates observed software and delivery mechanisms from unverified monetization;
      no listed potential unit is asserted to be Neara's actual billing unit.
    claimRefs: [CI001, CI003, CI009, CI011]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Pricing item
      - Public value
      - Evidence status
      - Underwriting implication
      - Diligence ask
    rows:
      - - List price or rate card
        - null
        - No retained source publishes a price
        - Entry price and packaging cannot be compared
        - Provide current rate card and SKU packaging
      - - Realized annual contract value
        - null
        - No contract value or customer revenue disclosed
        - Revenue concentration and deal size are unknown
        - Provide ACV distribution and top-20 customer schedule
      - - Discounts and implementation fees
        - null
        - No discount or fee schedule disclosed
        - List-to-realized price and services burden are unknown
        - Provide discount waterfall and implementation gross margin
      - - Renewal and expansion pricing
        - null
        - No renewal uplift, usage tier, or expansion rate disclosed
        - NDR and pricing power cannot be tested
        - Provide renewal cohorts, price increases, and module expansion
    notes: >-
      Null means no Neara-specific public value was found in the nine retained sources; operating
      scale and customer outcomes are not converted into implied prices.
    claimRefs: [CI001, CI009, CI014]
  - id: TI003
    title: Unit economics and capital adequacy gaps
    columns:
      - Metric
      - Neara public value
      - Confidence in gap
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue and ARR
        - null
        - High for retained public evidence
        - Establishes scale, recurrence, and growth base
        - Provide audited revenue, ARR, bookings, backlog, and recognition policy
      - - Gross margin
        - null
        - High for retained public evidence
        - Tests software leverage versus deployment and support cost
        - Reconcile hosting, data capture, implementation, and support COGS
      - - NDR, GDR, and logo churn
        - null
        - High for retained public evidence
        - Tests expansion quality and customer retention
        - Provide annual and quarterly cohorts by geography and utility tier
      - - CAC and CAC payback
        - null
        - High for retained public evidence
        - Tests efficiency of an apparent enterprise sales motion
        - Provide fully loaded S&M, new ARR, gross margin, and sales-cycle data
      - - Net burn and runway
        - null
        - High for retained public evidence
        - Determines financing dependency and negotiating leverage
        - Provide monthly cash, net burn, hiring plan, and scenario runway
      - - Debt, capex, and working capital
        - null
        - High for retained public evidence
        - Identifies obligations that equity-funding headlines do not reveal
        - Provide debt schedule, covenants, capex, receivables, and deferred revenue
    notes: >-
      Null means no Neara-specific figure was present in the retained evidence. CFO Advisors'
      directional SaaS definitions frame the diligence asks but are not used to estimate Neara.
    claimRefs: [CI009, CI010, CI011, CI016]
