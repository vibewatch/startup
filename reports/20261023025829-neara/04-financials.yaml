        - id: utility-data
          label: Utility network and LiDAR data
          detail: Customers or third parties capture source data.
        - id: ingestion
          label: Data ingestion and network modeling
          detail: Neara converts inputs into a physics-enabled digital twin.
        - id: analysis
          label: Scenario analysis and risk identification
          detail: Utilities analyze assets, weather risk, capacity, and maintenance.
        - id: customer-outcome
          label: Customer operating outcome
          detail: Faster analysis and restoration are reported in named cases.
        - id: contract
          label: Enterprise software contract
          detail: Contract unit, term, and realized price are not publicly disclosed.
        - id: revenue
          label: Recognized revenue
          detail: Revenue, ARR, mix, and recognition policy are not publicly disclosed.
        - id: gross-profit
          label: Gross profit
          detail: Delivery costs and gross margin are not publicly disclosed.
    approximationNotes: >-
      The ordered flow is qualitative; it does not imply conversion rates, proportional values,
      or a verified separation between subscription and services revenue.
    claimRefs: [CI003, CI014, CI015]
callouts:
  - calloutType: risk
    title: Financing does not establish runway
    body: >-
      The reported A$90 million Series D is capital raised, not a disclosed cash balance.
      Underwriting still requires closing cash, monthly net burn, debt, working-capital needs,
      and a scenario-based runway tied to the planned hiring and international expansion.
    claimRefs: [CI006, CI007, CI009, CI016]
