    claimRefs: [CM003, CM006, CM011, CM012]
callouts:
  - calloutType: strength
    title: Structural demand tailwind
    body: Grid congestion, extreme-weather exposure, electrification, and data-centre loads create recurring planning and resilience problems that fit Neara's stated workflow.
    claimRefs: [CM003, CM005, CM008, CM013]
  - calloutType: risk
    title: Macro growth is not software TAM
    body: Public forecasts quantify electricity demand and infrastructure pressure, but Neara's addressable software spend, pricing, retention, and serviceable account universe remain undisclosed.
    claimRefs: [CM004, CM006, CM007, CM014, CM015]
  - calloutType: recommendation
    title: Underwrite from utility economics
    body: Treat market expansion as credible but valuation-sensitive until independent procurement, pricing, and renewal evidence connects utility adoption to recurring revenue.
    claimRefs: [CM010, CM012, CM016]
