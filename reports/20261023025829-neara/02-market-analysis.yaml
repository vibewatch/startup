company:
  name: Neara
chapter:
  number: 2
  title: Market Analysis
  summary: Neara operates at the intersection of utility-grid modernization, climate resilience, and rapidly growing large-load electricity demand. Public evidence supports a real adoption tailwind, but it does not isolate a clean Neara TAM or prove how much of broader grid investment is software-addressable.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      Neara's relevant market is utility and critical-infrastructure software that models physical assets and network behavior for planning, resilience, vegetation management, and faster connection decisions. The included spend is recurring or project-linked software and data work used by electricity network operators. It excludes the underlying poles, wires, substations, construction, grid hardware, and the full value of data-centre development. The status quo is a mix of manual inspection, engineering studies, GIS and statistical tools, and fragmented workflows. Public descriptions show why the software can matter: TechCrunch reports that Neara combines lidar and other data with physics-based models, while the SA Power Networks example describes analysis of 21,000 power-line spans in 15 minutes rather than months. These examples establish workflow pain and potential time savings, not a market-wide willingness to pay or a proven software budget.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: demand-and-sizing
    title: Demand drivers and sizing lenses
    body: >-
      The strongest external demand signal is the growth and complexity of electricity loads. The IEA source reports global electricity demand rising at an average 3.6% a year from 2026 through 2030. In Australia, Modo Energy forecasts National Electricity Market data-centre demand from 3.9 TWh in FY25 to 14 TWh in FY30 and 37 TWh in FY50, while Fitch cites an AEMO forecast that business and industry grid consumption reaches 253 TWh in 2050 from 133 TWh today, with data centres contributing 29 TWh of the increase. These are infrastructure-demand lenses, not Neara revenue forecasts. They support a need for grid planning and capacity optimization, but the conversion from electricity growth to software spend remains unobserved.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-segmentation
    title: Buyer, user, and payer map
    body: >-
      The primary buyer is an electricity network or utility operator, while engineering, vegetation, resilience, planning, and field teams are the users. The payer is therefore likely a utility operating or capital-planning budget, sometimes supported by resilience, reliability, or regulatory programs; the public evidence does not disclose Neara's contract structure, pricing, or procurement cycle. Neara's reported utility footprint is a useful adoption signal: Forbes Australia says it works with close to 90% of Australia's electricity network utilities, and the same article lists customers across Australia, the United States, and Europe. That breadth suggests repeatable utility use cases, but customer concentration, renewal rates, annual contract value, and the share of spend from expansion versus new logos remain unknown.
    claimRefs: [CM010, CM011, CM012]
    tableRefs: [TM003]
  - id: constraints-and-valuation-relevance
    title: Adoption constraints and valuation relevance
    body: >-
      Adoption depends on more than a large grid-investment headline. Fitch identifies transmission bottlenecks and permitting delays as key challenges in Australia's transition, and USSC notes that data centres can be built in 18 to 24 months while major network upgrades and renewable projects often take five to ten years or more. Clayton Utz summarizes scrutiny around energy, water, planning, land use, noise, and backup generation in New South Wales, while Modo Energy emphasizes that connection capacity is not the same as realized demand because projects must be built, utilized, and ramped. These constraints can increase the value of faster scenario analysis, but they can also lengthen procurement, require jurisdiction-specific data and validation, and limit how quickly a software vendor converts macro demand into revenue. Neara's February 2026 financing coverage reports an A$1.1 billion valuation and approximately A$180 million raised; without disclosed revenue, retention, or addressable contract spend, the market evidence supports strategic relevance but not a defensible valuation multiple.
    claimRefs: [CM013, CM014, CM015, CM016]
