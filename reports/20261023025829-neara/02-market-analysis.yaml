      - [Wildfire and vegetation exposure, "Utility vegetation or risk leader", "Inspectors and vegetation-management teams", "Safety, vegetation, or resilience program", "Identify high-risk assets and inspection priorities", "Extreme weather, wildfire exposure, and regulatory obligations"]
      - [Flood and storm response, "Utility incident and network-management leadership", "Control-room, engineering, and restoration teams", "Reliability or emergency-response budget", "Simulate impact, monitor clearances, and plan restoration", "Severe weather and restoration-time pressure"]
