schemaVersion: "report-v2"
artifact: customers
slug: neara
runDate: 2026-10-23
company:
  name: Neara
chapter:
  number: 6
  title: Customers
  summary: Neara shows credible utility adoption across Australia, North America, and Europe, with named deployments tied to operational use cases rather than logos alone. Public evidence supports meaningful scale and outcomes, but does not disclose customer counts, contract values, retention, or concentration.
sections:
  - id: customer-segments
    title: Buyer, user, and customer segmentation
    body: Neara sells into electricity-network operators whose operating problems are geographically distributed, safety-critical, and expensive to inspect manually. The buyer is typically a utility or network operator; public descriptions place engineering, asset-management, vegetation, emergency-response, field-inspection, and planning teams in the operating workflow, while the communities served by the network are indirect beneficiaries. Reporting names Australian operators such as Essential Energy, Endeavour Energy, Ausgrid, Ausnet, Powercor, and SA Power Networks, as well as Southern California Edison, CenterPoint Energy, ESB Networks, Scottish Power, and Hedno. The evidence therefore supports a multi-market utility customer base, but not a verified count of active accounts, contract size, revenue contribution, or whether every named organization is in production rather than a pilot or project relationship.
    claimRefs: [CU001, CU002, CU003, CU016]
    tableRefs: [TU001]
  - id: adoption-and-outcomes
    title: Adoption trajectory and operating outcomes
    body: Adoption is best evidenced by the scope and recurrence of operational workflows, not by the existence of a logo. TechCrunch reports that SA Power Networks analyzed 21,000 power-line spans in 15 minutes after the River Murray floods and re-energized lines within five days versus an originally expected three weeks. Endeavour Energy used the twin across four successive floods, eliminating 300 hours of inspection time, while another report attributes a 50% faster high-risk vegetation response to Southern California Edison. CenterPoint's deployment covers an 8,000-square-kilometer service area, and 2026 reporting attributes more than 15 million modeled assets to Neara. These signals measure projects, assets, or response episodes, not paid-seat activity, renewal, or recurring revenue.
    claimRefs: [CU005, CU006, CU007, CU009, CU010, CU011]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named proof, durability, and expansion
    body: Named proof spans production-like emergency response, network planning, resilience, vegetation management, and asset prioritization. Endeavour's account describes repeated use during record floods and continued use for maintenance and future-grid planning; CenterPoint's reported engagement covers resilience planning after Hurricane Beryl; and Southern California Edison is linked to high-risk vegetation response. This breadth suggests expansion potential from one urgent workflow into adjacent asset and planning functions. However, no assigned source reports net retention, gross retention, churn, renewal rate, contract length, customer satisfaction, or a top-customer revenue share. The commercial durability thesis is therefore supported by repeated use cases, not quantified retention, and a 2024 plan to enter other infrastructure sectors is not evidence of current customers there.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: procurement-and-concentration
    title: Procurement friction and concentration risks
    body: Utility procurement is likely a material adoption constraint because deployments touch critical infrastructure, field data, safety decisions, and regulated operations. The assigned Vertice benchmark reports average new software purchases of 53.9 days and renewals of 90.5 days in Q3 2026 across more than 75 billion dollars of processed spend; this is not Neara-specific evidence, but it frames the likely approval burden for enterprise infrastructure software. Neara's Australian penetration and named multinational accounts indicate geographic reach, yet the public record does not provide customer-level revenue, account-level contract terms, or a denominator for concentration. Investors should treat expansion and concentration as open diligence questions rather than infer low risk from the breadth of named logos.
    claimRefs: [CU013, CU014, CU015]
    figureRefs: [FU001]
callouts:
  - calloutType: strength
    title: Operational proof is stronger than logo proof
    body: The strongest public evidence is repeated utility use in flood response, wildfire/vegetation risk, and resilience planning, including quantified cycle-time or inspection outcomes.
    claimRefs: [CU005, CU009, CU011]
  - calloutType: risk
    title: Retention and concentration remain unmeasured
    body: Public sources name utilities and report modeled assets, but do not disclose customer-level revenue, renewal, churn, contract duration, or concentration denominators.
    claimRefs: [CU012, CU014, CU015]
