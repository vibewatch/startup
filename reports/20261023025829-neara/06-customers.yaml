    title: Named customer proof table
    columns: [Customer, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    rows:
      - ["SA Power Networks", "Australian electricity network", "Flood-impact modeling and reconnection planning after River Murray floods", "Operational use reported", "21,000 spans analyzed in 15 minutes; re-energization within five days versus three weeks anticipated", "One disaster-response episode; no retention or contract data"]
      - ["Endeavour Energy", "Australian electricity network", "Digital twin for floods, vegetation, asset risk, and maintenance", "Operational use reported", "300 inspection hours eliminated across four successive floods; faster recovery and safer clearance decisions", "Customer-authored case material; no independent revenue or renewal evidence"]
      - ["Southern California Edison", "US electricity utility", "Vegetation and wildfire-risk management", "Customer deployment described", "A trade publication reports a 50% faster response for high-risk vegetation", "No underlying measurement method or contract status"]
      - ["CenterPoint Energy", "US electricity utility", "Greater Houston resilience and equipment-upgrade prioritization", "Full-scale project reported", "3D twin deployed across an 8,000-square-kilometer service area", "Expected resilience benefit is not the same as measured outage reduction"]
    enumerationScope:
      coverage: partial
      basis: "Four named utility deployments selected from assigned 2024-2026 public coverage, not a complete customer census."
    notes: "The table distinguishes reported operational or full-scale use from measured outcomes; a named customer or project does not prove a recurring contract, renewal, or revenue contribution."
    claimRefs: [CU005, CU009, CU010, CU011, CU012]
