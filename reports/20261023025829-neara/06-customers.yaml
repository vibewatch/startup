    type: journey-map
    summary: Neara's public customer evidence follows a path from data and inspection pain through emergency analysis, operational adoption, and adjacent planning use cases.
    data:
      nodes:
        - id: utility-need
          label: Network risk or inspection burden
          title: Network risk or inspection burden
          description: Distributed assets, extreme weather, and manual inspection create urgency.
          touchpoints: [Floods, wildfire risk, asset maintenance, new-load planning]
        - id: data-ingestion
          label: Build the digital twin
          title: Build the digital twin
          description: LiDAR, imagery, network records, and sensors are combined into a network model.
          touchpoints: [Historic data, current scans, network records]
        - id: scenario-analysis
          label: Simulate conditions
          title: Simulate conditions
          description: Utility teams test flood, wind, fire, loading, and outage scenarios before field action.
          touchpoints: [Risk identification, capacity questions, asset prioritization]
        - id: emergency-response
          label: Act during an event
          title: Act during an event
          description: Named deployments support rapid assessment, safe isolation, and reconnection decisions.
          touchpoints: [SA Power Networks flood response, Endeavour flood response]
        - id: operational-adoption
          label: Repeat operational workflows
          title: Repeat operational workflows
          description: The model extends into vegetation, maintenance, resilience, and inspection prioritization.
          touchpoints: [Southern California Edison, Endeavour Energy, CenterPoint Energy]
        - id: expansion
          label: Broaden infrastructure scope
          title: Broaden infrastructure scope
          description: Neara reports plans to extend predictive modeling beyond electricity into other infrastructure sectors.
          touchpoints: [Telecommunications, public transportation]
    claimRefs: [CU004, CU010, CU015, CU016]
