  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-concentration
      missingEvidence: Customer-level ARR or revenue, gross and net retention, churn, renewal rates, contract terms, and top-account concentration.
      whyItMatters: Without cohort and account economics, adoption scale cannot be translated into durable recurring revenue or concentration-adjusted customer quality.
      diligencePath: Request a customer cohort bridge and anonymized account schedule showing ARR, renewals, churn, expansion, contract length, and top-ten revenue share.
      relatedQuestionRefs: [QU006, QU007]
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table
      missingEvidence: Complete active-customer roster segmented by buyer, user, geography, use case, deployment status, and revenue band.
      whyItMatters: Public named references are selective and cannot establish the full customer mix or the share represented by each geography and workflow.
      diligencePath: Obtain a dated customer master list reconciled to billing and deployment records, with pilots separated from production accounts.
      relatedQuestionRefs: [QU001, QU002]
      relatedTableRefs: [TU001, TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-concentration
      missingEvidence: Customer references that verify renewal, satisfaction, implementation duration, and measurable outcomes across a representative cohort.
      whyItMatters: A small number of successful public case studies may overstate typical customer durability and expansion.
      diligencePath: Conduct reference calls with renewed, churned, and current customers and reconcile responses to CRM and support data.
      relatedQuestionRefs: [QU004, QU005, QU006]
    - type: missing-source
      severity: minor
      topic: procurement
      missingEvidence: Neara-specific procurement-cycle, implementation-time, and security-review data.
      whyItMatters: Generic enterprise-software benchmarks provide context but do not measure Neara's sales friction or deployment burden.
      diligencePath: Request funnel and implementation metrics by region, including time from qualified opportunity to signature and production go-live.
      relatedQuestionRefs: [QU008]
