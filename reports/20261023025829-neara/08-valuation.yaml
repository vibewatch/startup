schemaVersion: "report-v2"
artifact: valuation
slug: neara
runDate: 2026-10-23
company:
  name: Neara
chapter:
  number: 8
  title: Valuation
  summary: >-
    Neara has meaningful utility adoption and fresh growth capital, but the public evidence does
    not support underwriting its recorded $712 million valuation. The recommendation is
    research-more with medium confidence, high risk, and a stretched valuation stance until
    revenue quality, growth, retention, margins, cash, and financing terms are verified.
sections:
  - id: recommendation-and-price-sensitivity
    title: Recommendation and price sensitivity
    body: >-
      The evidence supports a research-more recommendation rather than a buy decision. Dealroom
      records a February 2026 Series D of $58 million at a $712 million valuation, while its only
      public revenue disclosure is a $1 million-$10 million range and its year-by-year revenue
      series is blank. Using the top of that range produces an estimated equity
      valuation-to-revenue ratio of at least 71.2x. That calculation is not an ARR multiple and
      cannot be compared mechanically with enterprise-value multiples because Neara's net debt,
      cash, security terms, and exact revenue period are not public. It nevertheless establishes
      a demanding entry burden: Multiples.vc reports 1.9x NTM EV/revenue for public energy and
      utilities software, and MarketScreener reports 6.35x 2026 EV/revenue for Hexagon. Neara may
      deserve a private-growth premium, but the disclosed evidence cannot quantify one. The
      valuation stance is therefore stretched, confidence is medium, and risk is high; a price
      recommendation should wait for primary financial and cap-table evidence.
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      Public financing records do not reconcile to one investable cap-table view. TechEDT reports
      an AUD 90 million Series D and approximately AUD 180 million of total capital raised;
      Indexed.vc reports $196.3 million across four rounds; and Dealroom records the Series D as
      $58 million with a $712 million valuation. These may reflect foreign-exchange conversion,
      different inclusion rules, or different update dates, but none of the sources discloses a
      fully diluted capitalization, whether the valuation is pre- or post-money, liquidation
      preferences, participation rights, debt, or cash on hand. Funding raised is not cash
      available, so runway and gross dilution cannot be inferred. Entry discipline should require
      the signed term sheet, closing documents, option-pool treatment, all preferred-security
      terms, debt schedules, current cash, and monthly burn. Without those items, neither target
      return nor hold-period return can be modeled responsibly.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV015]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The investment thesis rests on evidence that Neara solves expensive, mission-critical
      utility workflows. TechCrunch reported that SA Power Networks analyzed 21,000 power-line
      spans in 15 minutes during the River Murray flood response, while TechEDT reported that
      Neara works with close to 90% of Australian network utilities. Those signals support
      product utility, referenceability, and a potentially durable vertical-software position.
      The anti-thesis is that commercial proof remains less transparent than the valuation:
      ChoppingBlock explicitly called for more case studies and specific cost-saving examples,
      and the available sources do not disclose audited revenue, ARR, gross margin, net revenue
      retention, customer concentration, or burn. The product evidence therefore supports
      continued diligence, not an unconditional premium. The view would improve with audited
      cohort economics and contract-level expansion data; it would deteriorate if reference
      customers do not convert into repeatable, high-margin recurring revenue.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV002]
  - id: scenarios-exit-and-final-diligence
    title: Scenarios, exit readiness, and thesis-break triggers
    body: >-
      A numerical bull/base/bear valuation range is not supportable from the assigned public
      evidence because the denominator, capital structure, and security waterfall are missing.
      The scenario framework is therefore milestone- and price-sensitive. A bull case requires
      verified growth, retention, margins, and utility expansion strong enough to justify a
      premium to public vertical-software references. The base case treats the $712 million
      Dealroom mark as a financing reference, not fair value, until exact operating metrics are
      supplied. The bear case is a material reset below that mark if growth, retention, or margins
      are weak, or if preferences amplify common-equity downside. Hexagon is a useful mature
      boundary at 6.35x 2026 EV/revenue, while Multiples.vc's 1.9x energy-and-utilities benchmark
      provides a sector anchor; neither is a direct private-company comparable. Exit readiness is
      unproven because no source supplies IPO-grade financials or a relevant transaction set.
      Thesis-break triggers are failure to reconcile financing records, weak audited unit
      economics, concentrated or non-renewing contracts, and a security waterfall that prevents
      target returns at a realistic exit.
    claimRefs: [CV006, CV008, CV009, CV010, CV011, CV015, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Decision field, Current view, Decision implication]
    rows:
      - [Recommendation, Research-more, "Do not underwrite an entry until primary financial and financing evidence is available."]
      - [Confidence, Medium, "Financing marks and utility proof are public, but operating metrics and security terms are not."]
      - [Risk rating, High, "Opaque revenue quality, capital structure, and return mechanics create material underwriting risk."]
      - [Valuation stance, Stretched, "The recorded valuation implies at least 71.2x the upper end of Dealroom's revenue range."]
      - [Entry discipline, Evidence-gated, "Require audited KPIs, current cash and burn, a fully diluted cap table, and the preference waterfall."]
    notes: >-
      Recommendation is analytical, not a transaction instruction; the 71.2x estimate divides
      Dealroom's $712 million recorded valuation by the $10 million upper bound of its revenue
      range and is not an EV/revenue or ARR multiple.
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Side, Argument, What would change the view]
    rows:
      - [Thesis, "Utility workflow value is demonstrated by the 15-minute analysis of 21,000 power-line spans.", "Replicated outcomes across named customers with quantified savings would strengthen the thesis."]
      - [Thesis, "Reported penetration of close to 90% of Australian network utilities suggests strong local referenceability.", "Contract values, renewals, and expansion by cohort would show whether adoption is economically durable."]
      - [Thesis, "A fresh Series D provides capital to pursue global expansion.", "Current cash, burn, and deployment efficiency are needed before treating funding as runway."]
      - [Anti-thesis, "Exact revenue, ARR, growth, gross margin, and retention are not publicly disclosed.", "Audited statements and monthly KPI bridges could close the valuation denominator gap."]
      - [Anti-thesis, "Independent commentary asks for more case studies and specific cost-saving evidence.", "Customer-validated ROI studies would reduce commercialization uncertainty."]
      - [Anti-thesis, "Preference and dilution terms are absent from public records.", "A fully diluted cap table and exit waterfall would make common-equity returns modelable."]
    notes: >-
      Utility penetration and financing are publisher-reported or company-attributed claims;
      missing operating metrics and security terms remain diligence gaps rather than assumed
      negatives.
    claimRefs: [CV002, CV012, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions and probability signal, Valuation / return logic, Key risks and triggers]
    rows:
      - [Bull, "Conditional: audited growth, retention, margins, and international expansion substantiate a premium vertical-software profile.", "Value above the $712 million reference is supportable only after verified KPIs demonstrate a durable premium to public benchmarks; no numeric range is supportable now.", "Fails if customer proof does not translate into repeatable high-margin revenue."]
      - [Base, "Most supportable current case: strong product signals coexist with opaque operating and financing data.", "Treat $712 million as a recorded financing mark, not fair value; defer target-return modeling pending cap-table and KPI evidence.", "Weak disclosure persists or the round terms create preference overhang."]
      - [Bear, "Probability rises if audited growth, retention, or margins disappoint, contracts concentrate, or financing records cannot be reconciled.", "A material reset below $712 million would be required; exact downside is unknowable without revenue, cash, debt, and waterfall data.", "Down round, weak renewals, cash pressure, or preference-heavy terms impair common-equity recovery."]
    notes: >-
      Scenarios intentionally avoid false numerical precision. Public EV/revenue references are
      directional boundaries, not direct private-company valuation equivalents.
    claimRefs: [CV006, CV008, CV009, CV010, CV011, CV015, CV016]
figures:
