          detail: "21,000 power-line spans analyzed in 15 minutes in the cited SA Power Networks example."
        - id: adoption
          label: Adoption signal
          detail: "Reported work with close to 90% of Australian network utilities."
        - id: financing
          label: Fresh financing
          detail: "Series D records provide expansion capital but do not establish cash available."
        - id: disclosure-gap
          label: KPI and terms gap
          detail: "Exact revenue quality, margins, retention, cash, debt, and preferences are unavailable."
        - id: valuation-burden
          label: High valuation burden
          detail: "Recorded valuation implies at least 71.2x the upper end of the disclosed revenue range."
        - id: recommendation
          label: Research-more
          detail: "Require primary financial and cap-table evidence before pricing an entry."
      edges:
        - source: utility-proof
          target: adoption
        - source: adoption
          target: financing
        - source: financing
          target: disclosure-gap
        - source: disclosure-gap
          target: valuation-burden
        - source: valuation-burden
          target: recommendation
    approximationNotes: >-
      The flow is a qualitative decision chain; the 71.2x estimate uses Dealroom's broad revenue
      range and recorded valuation and is not an enterprise-value or ARR multiple.
    claimRefs: [CV006, CV008, CV012, CV013, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive decision
    body: >-
      Research more at the recorded valuation. A lower price alone is insufficient unless exact
      operating metrics, cash, dilution, and preference terms also support the target return.
    claimRefs: [CV008, CV015, CV016]
  - calloutType: risk
    title: Financing is not runway
    body: >-
      Reported capital raised cannot be treated as cash available; current cash, debt, burn, and
      committed uses remain undisclosed.
    claimRefs: [CV002, CV003, CV004, CV006]
