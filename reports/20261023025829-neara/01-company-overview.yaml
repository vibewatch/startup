company:
  name: Neara
chapter:
  number: 1
  title: Company Overview
  summary: Neara is a Sydney-based Series D infrastructure-software company founded in 2016 that models utility networks with physics-enabled digital twins. Its public profile shows broad utility traction and a 2026 financing step-up, but funding currencies, employee scale, governance, revenue, and customer economics remain insufficiently reconciled.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Tracxn describes Neara as a Sydney-based Series D company founded in 2016, while both Tracxn and Equilar characterize the product as physics-enabled digital-twin software for utility or critical-infrastructure networks. The platform ingests infrastructure data and supports engineering simulation, scenario analysis, risk assessment, maintenance prioritization, and network design. TechCrunch reported that Neara launched commercially in 2019 and described applications spanning wildfire, flood, wind, ice, and snow risk. This evidence supports an enterprise software model sold into utilities and infrastructure operators rather than a consumer or asset-owning model. However, none of the assigned sources establishes pricing, contract duration, subscription mix, implementation revenue, or gross margin, so the exact commercial model remains a diligence gap rather than an inferred SaaS profile.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Startup Daily and TechCrunch identify Daniel Danilatos, Karamvir Singh, and Jack Curtis as Neara's co-founders. Startup Daily further identifies Curtis as chief commercial officer, providing direct evidence of founder-led commercial execution, but the assigned text does not establish current titles for Danilatos or Singh. Equilar describes three executive role categories—founder and chief executive officer, chief commercial and operations officer, and chief product officer—yet its fetched public text omits the associated names. The evidence therefore supports a three-founder origin and a founder-led operating structure, but not a complete current executive or board roster. Director independence, board rights, voting control, succession planning, and changes in leadership remain undisclosed, making key-person and governance dependence impossible to quantify from public evidence.
    claimRefs: [CO004, CO005]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital and stakeholder structure
    body: >-
      The 2026 Series D is consistently reported as a major financing event, but currency and cumulative totals must remain explicit. Startup Daily reports a $90 million round, a valuation above $1 billion, and $180 million raised in total without identifying the currency in those sentences. TechEDT reports AUD 90 million for the same round and approximately AUD 180 million in cumulative capital. Tracxn separately reports $126 million across five rounds and masks its current valuation. These figures may be reconcilable after currency conversion or differences in round coverage, but the public record does not prove that. TCV led the Series D, while coverage names Partners Group, EQT, Square Peg, Skip Capital, and Prosus among current or earlier backers. A signed cap table and financing schedule are needed before using any single total-raised or valuation figure as canonical.
    claimRefs: [CO006, CO007, CO008, CO009, CO012]
    tableRefs: [TO003]
  - id: scale-milestones-and-evidence-limits
    title: Scale, milestones, and evidence limits
    body: >-
      Operating evidence points to substantial utility adoption. Startup Daily and TechEDT name customers across the United States, Europe, and Australia, and report that Neara works with close to 90% of Australian network utilities. TechEDT also reports more than 15 million modeled assets across over 3 million kilometres and four continents. A TechCrunch case study, repeated by two industry publications, says SA Power Networks analyzed 21,000 power-line spans in 15 minutes rather than months; this is useful customer-outcome evidence, but it ultimately traces to company and customer reporting rather than an audited benchmark. Current workforce evidence conflicts: Tracxn states 263 employees "as of Sep 26," while Equilar gives a 51–250 band without a visible date. An independent review also calls for more case studies and specific cost-savings examples. Revenue, ARR, margins, retention, burn, runway, total customer count, and contract concentration remain unsupported.
    claimRefs: [CO010, CO011, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
