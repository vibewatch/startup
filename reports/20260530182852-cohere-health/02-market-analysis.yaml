company:
  name: Cohere Health
  website: https://coherehealth.com
chapter:
  number: 2
  title: Market Analysis
  summary: 'Cohere Health sells into a real but narrowly bounded market: payer-sponsored medical prior authorization and adjacent utilization-management automation, not all healthcare administration software. Public evidence supports strong regulatory and ROI tailwinds, but headline market-size estimates vary from hundreds of millions to low tens of billions because sources mix geographies, adjacencies, and product scopes; the cleanest public U.S. proxy is the $613 million to $1.2 billion utilization-management solutions market, while a precise Cohere-specific SOM remains unsupported without pricing and contract detail.'
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: Cohere's relevant market is narrower than generic “healthcare AI” or even generic revenue-cycle automation. The regulated core is medical prior authorization and adjacent utilization-management workflows where payers must evaluate medical-necessity requests, collect supporting documentation, communicate decisions, and increasingly expose those workflows through FHIR APIs. The most important included spend is software and workflow services that reduce friction between payers and providers for medical services such as imaging, procedures, post-acute care, and other utilization-managed items. The most important excluded spend is pharmacy-only prior authorization, because CMS' 2024 final rule explicitly excludes drugs and the 2026 drugs proposal treats pharmacy authorization as a separate extension path rather than the current baseline. Broader claims processing, generalized revenue-cycle tools, and care-management platforms matter as adjacencies, but they overstate the opportunity if
    counted as core TAM. The dominant substitutes are still fax, phone, portal, and manual review workflows. That matters because a vendor like Cohere is not replacing “nothing”; it is displacing fragmented coordination labor on both the payer and provider sides.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM024
  - CM025
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Evidence-constrained sizing lenses
  body: 'Public sizing is usable only when separated into distinct lenses. A volume lens shows that Medicare Advantage alone generated nearly 53 million prior-authorization requests in 2024, with 99% of enrollees subject to at least some prior authorization, which establishes that medical PA is operationally large even before commercial and Medicaid managed care are added. A value-at-stake lens shows why buyers invest: CAQH still sees a $21 billion automation opportunity across manual and partially manual healthcare transactions, and AMA survey data show the category burns provider time every week. A software-spend lens is much noisier. Recent public estimates range from $224 million for one utilization-management-software definition to $11.25 billion for another, while prior-authorization-software estimates cluster around roughly $2-3 billion globally. Those numbers are not directly comparable because they mix U.S. versus global scopes and pure PA versus broader UM definitions. For diligence
    purposes, the $613 million 2024 U.S. utilization-management-solutions estimate is the closest public SAM proxy for Cohere''s core workflow. It is still imperfect, but it is more decision-useful than quoting a broad multi-billion global TAM without boundary discipline.'
  claimRefs:
