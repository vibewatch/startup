- id: TM004
  title: Growth drivers and adoption constraints
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - CMS 2026 operational deadlines and 2027 API deadlines
    - Positive
    - Near-term
    - Creates non-discretionary payer spend on digital PA capabilities
    - Ask which plan segments already budgeted for FHIR/API compliance
  - - AHIP / BCBSA 80% real-time commitment
    - Positive
    - Near-term
    - Rewards vendors that can support real-time decisions and standardized submissions
    - Ask how much of buyer volume can reach real-time eligibility in practice
  - - State reform and AI-governance laws
    - Mixed
    - Near-term
    - Can accelerate platform replacement but raises local configuration burden
    - Map state-law exposure by payer footprint and specialty mix
  - - Provider labor burden and burnout
    - Positive
    - Current
    - Makes ROI case easier when automation removes documentation chase work
    - Request documented labor savings from live deployments
  - - CAQH automation savings opportunity
    - Positive
    - Current
    - Supports admin-efficiency budget narratives across payers and providers
    - Test whether savings accrue to plan, provider, or both
  - - Provider dependence on fax / phone
    - Negative
    - Current
    - Benefits will stall if provider onboarding lags despite payer investment
    - Measure electronic submission rates by specialty and region
  - - Legacy core-system integration
    - Negative
    - Ongoing
    - Raises switching cost, slows deployment, and increases implementation risk
    - Ask about required middleware, EHR adapters, and timeline to go-live
  - - Privacy, security, and denial transparency
    - Negative
    - Ongoing
    - Trust and auditability are essential for clinical workflows
    - Review audit trails, explanation logic, and security certifications
  - - OIG / AMA scrutiny of denial quality
    - Negative
    - Current
    - Makes black-box automation politically and commercially risky
    - Ask for clinician-in-the-loop controls and override rates
  - - Pricing and contract opacity
    - Negative
    - Current
    - Blocks precise SOM and share-of-wallet modeling from public data
    - Request pricing model, request-volume tiers, and average contract value
  notes: Several rows mix regulatory and operational evidence because the same force can accelerate category growth while simultaneously increasing implementation burden and trust requirements.
