  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cohere-som
    missingEvidence: Public pricing, average contract value, and request-volume mix by line of business for Cohere Health.
    whyItMatters: Without pricing and contract mix, a company-specific SOM in dollars would be invented rather than diligence-backed.
    diligencePath: Request payer contract structure, pricing metric, live plan count, and request volume split across MA, commercial, and Medicaid.
    relatedQuestionRefs:
    - QM024
    - QM025
  - type: conflicting-data
    severity: material
    topic: market-size-methodology
    missingEvidence: Comparable market definitions that separate medical PA, drug PA, and broader UM software on one geography and time base.
    whyItMatters: Contradictory third-party TAMs can materially distort valuation framing if they are blended without boundary adjustments.
    diligencePath: Ask management and vendors which product modules and services are counted in their market deck and align that to one U.S. definition.
    relatedQuestionRefs:
    - QM014
    - QM020
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: provider-segment-adoption
    missingEvidence: Publicly segmented ePA adoption rates by specialty, payer line, or provider size for medical prior authorization.
    whyItMatters: Provider-side onboarding is a major bottleneck, but public evidence is still too aggregated to size specialty-by-specialty rollout friction.
    diligencePath: Request deployment cohorts by specialty, electronic submission rate, and manual fallback rate from customers or prospective buyers.
    relatedQuestionRefs:
    - QM009
    - QM021
  - type: stale
    severity: minor
    topic: oig-denial-quality
    missingEvidence: A newer nationwide government sample of inappropriate prior-authorization denials under current workflows.
    whyItMatters: The leading official misuse evidence is still the 2022 OIG report, so category trust-risk may have improved or worsened since then.
    diligencePath: Monitor the OIG 2026 post-acute-care work-plan series and request plan-level audit findings during diligence.
