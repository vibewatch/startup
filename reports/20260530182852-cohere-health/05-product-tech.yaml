- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in stack
  - Named dependency
  - Why it matters
  - Risk / gap
  rows:
  - - Provider entry layer
    - Portal onboarding, browser access, fax fallback, status checks
    - Cohere portal plus chatbot, IVR, email, phone, fax
    - Determines provider adoption and support burden
    - No public portal uptime or abandonment data
  - - Interoperability layer
    - CRD, DTR, PAS, SMART on FHIR, single-front-door routing
    - HL7 Da Vinci guides plus CMS rule alignment
    - Core to CMS-0057-F readiness and EMR embedding
    - Real-world latency, error rates, and volume distribution are not public
  - - Policy digitization layer
    - Turns payer policy into workflow prompts and review logic
    - Medical-policy teams and policy-management tooling
    - Critical because APIs alone do not solve prior-auth complexity
    - Public proof of policy-authoring governance is still thin
  - - Clinical AI layer
    - Evidence-based models, attachment extraction, recommendation support
    - Millions of past decisions and >350 clinician-trained models
    - Main technical moat claim versus simple portal digitization
    - Independent accuracy, bias, and drift evidence is not public
  - - Human review and coding layer
    - Clinicians and coding experts handle complex cases and audits
    - Internal clinical and reimbursement teams
    - Shows the product is software plus operations, not pure SaaS
    - Service intensity could pressure margins and implementation scalability
  - - Cloud / security layer
    - Application hosting, isolation, traffic filtering, deployment tooling
    - AWS, CloudFront, WAF, VPCs, ELBs, Fargate, ECS
    - Gives enterprise buyers a more concrete architecture picture
    - No public redundancy topology, recovery objectives, or incident disclosures
  notes: The architecture table combines what Cohere explicitly publishes with integration-role evidence from public implementation hiring.
