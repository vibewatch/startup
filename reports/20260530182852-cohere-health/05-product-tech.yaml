    - Supports minimum buyer expectations for data protection
    - No public key-management detail or penetration-test evidence
  - - HITRUST, NCQA, URAC, OIG program
    - Claimed current / recent
    - Security and compliance posture across enterprise platform
    - Supports procurement conversations with regulated payers
    - Public evidence does not expose underlying reports or renewal cadence detail
  - - Responsible-AI posture
    - Partially disclosed
    - Clinician-trained models, evidence-based guidelines, minimum-necessary extraction, clinician review on non-routine cases
    - Shows Cohere understands AI governance expectations
    - No public module-level fairness, denial, or error-analysis dataset
