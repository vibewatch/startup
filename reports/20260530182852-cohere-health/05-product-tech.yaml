  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-disclosure
    missingEvidence: Public or customer-shareable uptime, latency, recovery objectives, incident history, and support-SLA reporting for the portal and API stack.
    whyItMatters: Implementation-heavy healthcare workflow software can look mature in architecture slides while still failing operationally at go-live or under peak volume.
    diligencePath: Request the status-page history, Sev-1 / Sev-2 incident log, contractual SLAs, and the last twelve months of uptime and turnaround dashboards.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: trust-artifacts
    missingEvidence: SOC 2, ISO, penetration-test, data-flow, and business-associate artifacts that buyers can independently inspect.
    whyItMatters: Marketing claims about compliance are useful for sourcing but do not replace the underlying trust evidence needed for enterprise security review.
    diligencePath: Request the current SOC 2 package, any ISO certificates in scope, pen-test executive summary, BAA template, and model-risk or AI-governance package.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: module-performance
    missingEvidence: Module-level adoption, pricing, approval accuracy, false-positive, provider-abrasion, and payment-integrity hit-rate metrics for Connect, Validate, Review Assist, and Policy Studio.
    whyItMatters: The public evidence proves product breadth but not whether the newer modules are truly sticky, profitable, or clinically safe at scale.
    diligencePath: Request customer counts, cohort dashboards, ROI studies, appeal / overturn analysis, and product-line P&L views for each major module.
    relatedQuestionRefs:
    - QE016
    - QE017
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: implementation-burden
    missingEvidence: Time-to-go-live, staffing required per deployment, policy-digitization backlog metrics, and provider-support volume by customer type.
    whyItMatters: A platform with heavy integration and policy work can create services drag or slower scaling even if the headline product story is compelling.
    diligencePath: Request implementation plans for recent wins, professional-services effort by project, support-ticket trends, and post-go-live stabilization metrics.
    relatedQuestionRefs:
    - QE014
    - QE018
    - QE025
    relatedTableRefs:
    - TE002
    - TE003
