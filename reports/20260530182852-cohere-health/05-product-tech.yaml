- id: support-reliability-and-roadmap-signals
  title: Support, reliability, and roadmap signals
  body: 'Cohere’s public support posture is stronger than its public reliability posture. Provider-facing resources show recurring 2026 training sessions, onboarding documentation, browser guidance, troubleshooting, and alternate submission/status channels. Novitas’ WISeR page adds operational proof that Cohere is prepared to run a compliance-sensitive Medicare workflow with real-time status tracking and missing-document alerts for Texas providers beginning in January 2026 [CE030][CE031][CE043]. Public jobs also point to scaled delivery functions across implementation, clinical training, DevOps, platform engineering, and client support, which is consistent with a company building repeatable enterprise deployment capacity rather than only selling pilots [CE029][CE038][CE040].


    Roadmap and velocity signals are visible, but they are mostly company-issued. The 2025 releases show a sequence of adjacent-module expansion: Cohere Connect for CMS-0057-F readiness, the ZignaAI-backed payment-integrity suite, and then broader claims that the platform now reaches acute inpatient review and policy management. That sequence supports a credible horizontal-product thesis from pre-care into post-care workflows [CE011][CE025][CE026][CE027][CE028]. What remains notably absent is decision-grade reliability disclosure. The retained official surfaces do not publish uptime SLAs, incident history, public status data, or downloadable attestation artifacts, so diligence still cannot verify whether the implementation-heavy workflow is as operationally mature as the product narrative implies [CE045][CE046][CE047].'
