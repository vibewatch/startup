tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user / buyer
  - Public status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Cohere Unify platform
    - Health-plan operations leaders
    - GA / shared platform foundation
    - Single integration layer reused across authorization, payment accuracy, appeals, and policy workflows
    - Need module-level adoption and reliability data beyond platform narrative
  - - In-house UM workflow (Intake / Decision / Review / provider optimization)
    - Plan UM teams
    - GA / core offering
    - Lets plans modernize while keeping control of internal teams and workflows
    - Need customer references on reviewer productivity and override rates
  - - Delegated / hybrid specialty operations
    - Plan medical-management teams
    - GA / flexible deployment
    - Allows gradual transition between outsourced and insourced review models
    - Need economics and staffing assumptions by specialty
  - - Specialty packages (MSK, cardiology, diagnostic imaging, sleep, GI)
    - Plan clinical-program owners
    - GA / named specialty packages
    - Makes the platform sellable by pain point rather than only enterprise replacement
    - Need current attach rates and specialty-level outcome data
  - - Cohere Connect
    - Interoperability / compliance buyers
    - Newer growth module / standalone offering
    - Turns CMS-0057-F compliance into a standalone product with single-front-door APIs
    - Need payer count, pricing, and live production performance by line of business
  - - Payment Integrity Suite (Validate / Match / Complete)
    - Payment-integrity and claims leaders
    - Newer growth module / launched 2025
    - Extends the same clinical-intelligence layer from pre-care into post-care claims validation
    - Need independent validation of hit rate, false positives, and provider-abrasion impact
  - - Review Assist
    - Acute inpatient review teams
    - Newer growth module / public in 2025
    - Pushes Cohere beyond outpatient UM into acute inpatient workflow
    - Need proof of current customer penetration and medical-necessity quality metrics
  - - Policy Studio
    - Medical-policy teams
    - Newer growth module / public in 2025
    - Centralizes policy creation and deployment, which complements DTR workflow claims
    - Need evidence on authoring efficiency and policy-governance controls
  notes: Rows reflect the publicly visible Cohere module map rather than a confidential full SKU catalog.
  enumerationScope:
    coverage: partial
    basis: Covers the main public modules and named workflow extensions visible across official product pages and 2025 release materials, not an internal SKU inventory.
