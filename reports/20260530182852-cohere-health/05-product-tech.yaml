- id: FE001
  title: Cohere product architecture map
  type: stack
  layout: standard
  summary: Five layers summarize the publicly disclosed architecture from provider entry points down to cloud infrastructure and trust controls.
  data:
    layers:
    - label: Provider and payer entry points
      detail: Portal onboarding, browser access, fax / phone fallback, chatbot and IVR status tools, plus EMR-initiated submissions.
    - label: Interoperability and routing layer
      detail: CRD, DTR, PAS, SMART on FHIR, single-front-door APIs, and named connections to Epic, Rhyme, Availity, NaviNet, and provider portals.
    - label: Policy and workflow orchestration
      detail: Medical-policy digitization, documentation prompts, in-network checks, intake / decision / review modules, and specialty packages.
    - label: Clinical AI and human review
      detail: Evidence-based models trained on millions of decisions, minimum-necessary attachment extraction, clinician review on non-routine cases, and coding experts in payment integrity.
    - label: Cloud and security foundation
      detail: AWS, CloudFront, WAF, VPCs, load balancers, Fargate, ECS, HIPAA / HiTECH safeguards, and encryption claims.
  approximationNotes: The company does not publish a canonical architecture diagram, so this stack collapses explicit component disclosures into a reader-friendly layered view.
