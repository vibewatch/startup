- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow surface
  - Cohere solution
  - Public benefit signal
  - Limitation / gap
  rows:
  - - Provider submits routine prior-auth request
    - Portal submission or EMR-connected workflow
    - Portal plus CRD/DTR/PAS APIs and single-front-door routing
    - Up to 85% real-time approvals and faster turnaround are publicly claimed
    - No public external benchmark on approval accuracy or appeal overturns
  - - Plan reviews complex medical-necessity case
    - Clinical reviewer with AI support
    - Precision AI extracts indications and routes complex cases to clinicians
    - Remaining non-auto-approved cases are reviewed by clinicians
    - Public evidence does not disclose reviewer override rates or audit precision
  - - Plan deploys by specialty rather than full replacement
    - Legacy stack plus specialty-specific modernization
    - In-house, delegated, or hybrid deployment options with named specialty packages
    - Lets buyers start where burden is highest
    - No public implementation-duration or services-load benchmark by specialty
  - - Provider checks status and resolves missing information
    - Phone, fax, email, or portal follow-up
    - Portal tracking, chatbot, IVR, and built-in missing-document alerts
    - Novitas WISeR page highlights real-time status tracking and fewer delays
    - Support responsiveness and escalation SLAs are not public
  - - Plan moves upstream from post-pay disputes to pre-pay prevention
    - Disconnected UM and payment-integrity teams
    - Validate, Match, and Complete connect authorization and payment workflows
    - Company claims faster payments, 30% efficiency gains, and 8-9x ROI
    - No independent breakdown by customer or claim class
  notes: Workflow rows focus on operational job-to-be-done framing rather than abstract product naming.
