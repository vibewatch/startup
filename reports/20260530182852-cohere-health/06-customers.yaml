- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named proof
  body: |-
    Adoption proof is strongest when the evidence moves beyond logos into dated deployment milestones. Humana is the clearest example: Cohere’s own record shows a 12-state musculoskeletal pilot in 2021, nationwide expansion in 2022, additional cardiovascular and surgical scope in 2023, and another expansion into diagnostic imaging and sleep in 2024. The current Humana case study then frames that journey as scaled production coverage for more than 5.1 million members across all 50 states. Aggregate company metrics reinforce that the platform is not a tiny pilot business: Cohere says it processes 5.5 million prior authorizations annually, impacts more than 15 million members and 420,000 providers, and closed ten new deals in 2025.

    Geisinger and WISeR add fresher operational proof. Geisinger’s original launch materials include concrete outcomes and line-of-business breadth, while a January 2026 Geisinger update shows the Cohere portal replacing a daily inpatient fax report with real-time status, uploads, notifications, and training resources. CMS and Novitas provide a different kind of proof: not outcomes yet, but current referenceability. CMS lists Cohere as the Texas WISeR participant, and Novitas plus the Texas Medical Association show January 2026 submission dates, portal registration, status tracking, and missing-document alerts. Taken together, that means Cohere’s public adoption evidence is real and current enough to support production deployment claims, but it still rests on a small number of marquee accounts rather than a broad named roster.
