- id: durability-satisfaction-and-expansion
  title: Durability, satisfaction, and expansion signals
  body: |-
    Cohere’s public durability evidence is better than logo-only proof, but it still stops short of investor-grade retention disclosure. The positive side is visible: Humana’s multi-year rollout and Geisinger’s 2026 operating update both suggest relationships that stayed live long enough to deepen, while Cohere’s platform positioning explicitly encourages plans to start with one workflow and add modules later. Satisfaction and workflow measures are also plentiful. Cohere reports 94% provider satisfaction, NPS of 67, 94% digital-intake adoption, 90% portal-heavy usage, 91% easier tasks, and 82% faster decisions than other portals or vendors. Those are meaningful signals that the product is resonating with users, not just with procurement teams.

    The missing pieces are just as important. None of the retained public sources disclose net revenue retention, gross retention, churn, contract duration, renewal rates, or cohort economics. Even the strongest public proofs are mostly about operational workflow, not revenue durability. The public surveys also show that category friction remains high: treatment abandonment, decision delays, and phone or fax dependency are still common, and AI sentiment is mixed across sources despite Cohere-sponsored survey enthusiasm. That combination suggests Cohere likely has real expansion momentum, but public evidence cannot yet distinguish durable recurring revenue from a small set of strong reference accounts and broad company-issued satisfaction statistics.
