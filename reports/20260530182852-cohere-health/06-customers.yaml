  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: A broader named roster of production customers with deployment dates, covered lives, and primary workflows.
    whyItMatters: Public proof is credible but concentrated; a wider roster would show whether Cohere’s adoption is broad or driven by a few marquee references.
    diligencePath: Request the current active-customer list segmented by line of business, status, and covered lives, then sample-reference at least five accounts.
    relatedQuestionRefs:
    - QU011
    - QU016
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: NRR, GRR, churn, renewal-rate, and contract-duration metrics by customer cohort.
    whyItMatters: Without retention economics, public expansion proof cannot be converted into a durable recurring-revenue view.
    diligencePath: Request board or investor metrics on gross retention, net retention, logo churn, and renewal rates for the last eight quarters.
    relatedQuestionRefs:
    - QU013
    - QU021
    - QU025
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, covered-life concentration, and top-five customer mix by module.
    whyItMatters: The named public evidence is concentrated enough that a single outsized account could materially shape growth or renewal risk.
    diligencePath: Request ARR and gross profit concentration for top customers plus attach rates for payment integrity, policy, and API modules.
    relatedQuestionRefs:
    - QU016
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: independent-user-proof
    missingEvidence: Independent, dated provider reviews or reference calls that quantify usability, implementation burden, and support quality.
    whyItMatters: The strongest user-satisfaction claims are company-issued; independent voices would make the durability story more reliable.
    diligencePath: Request at least three provider references and pull independent portal review or complaint data where available.
    relatedQuestionRefs:
    - QU012
    - QU014
    - QU018
    - QU020
