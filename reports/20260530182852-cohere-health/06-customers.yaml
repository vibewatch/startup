  title: Customer segmentation by buyer, user, payer, and use case
  columns:
  - Segment
  - Buyer / user / payer
  - Geography / vertical
  - Use case
  - Public scale / strategic value
  - Coverage gap
  rows:
  - - Core health-plan enterprise
    - 'Buyer: UM, medical-management, and operations leaders; user: plan reviewers + providers; payer: health plan'
    - U.S. commercial and government-adjacent plans
    - Prior authorization and utilization management
    - Most direct public messaging and named proof sit here
    - No public pricing, ACV, or customer-count band by plan size
  - - Regulatory-readiness buyer
    - 'Buyer: interoperability / compliance leaders; user: provider offices + payer IT; payer: health plan'
    - Plans preparing for CMS-0057-F
    - Prior Authorization API and Cohere Connect workflows
    - Relevant because CMS deadlines create urgency for adoption
    - No public count of live Cohere Connect customers
  - - Payment-integrity expansion buyer
    - 'Buyer: payment-integrity and claims leaders; user: coders and reviewers; payer: health plan'
    - Same payer accounts as core UM plus adjacent workflows
    - Pre-pay clinical review and payment accuracy
    - Supports land-and-expand thesis beyond prior auth
    - No disclosed attach rate or customer mix by module
  - - Government contractor program
    - 'Buyer: CMS or contractor program; user: Texas providers + Cohere reviewers; payer: Medicare program'
    - Texas WISeR under JH Novitas
    - Prior authorization and pre-payment review for selected services
    - Fresh public deployment proof and referenceability
    - No public throughput, outcomes, or renewal criteria yet
  - - Provider workflow user base
    - 'Buyer: usually not the provider; user: physician offices, administrators, hospitals; payer: linked health plan'
    - Nationwide across payer relationships
    - Submission, status tracking, documentation, and support
    - Provider experience appears central to adoption and retention
    - No provider-paid revenue or cohort retention disclosures
  - - Member / patient beneficiary
    - 'Buyer: none; user: indirect; payer: health plan'
    - Members across named plan deployments
    - Faster approval, less delay, more appropriate care
    - Important to payer ROI and care-quality story
    - No public member satisfaction or complaint metrics by account
  notes: Segmentation reflects only what the retained public evidence supports; it is not a full confidential customer roster or pricing segmentation.
