- id: people-execution-capital-and-thesis-break-risk
  title: People, execution, capital, and thesis-break triggers are the swing factors
  body: |-
    People, execution, and capital risk are the swing factors for the investment case. Cohere is scaling go-to-market, engineering, and product breadth simultaneously: a new chief revenue officer, a Hyderabad capability centre, expanded payment-integrity offerings, compliance tooling, and CMS model work all point to a company stretching beyond a single prior-authorization product. The upside is category leadership with more than one growth vector. The downside is prioritization drift, implementation strain, and inconsistent customer outcomes across modules, geographies, or customer cohorts if delivery maturity lags commercial ambition.

    Capital and disclosure risk should not be ignored just because the 2025 Series C was large. The round gives Cohere room to invest, but public disclosure still relies mainly on company releases and selected media coverage, not public-company risk-factor discipline or audited recurring-revenue reporting. That matters because the thesis breaks faster from a few measurable events than from a gradual narrative change: a failed WISeR audit, a high-profile security incident, a large-customer nonrenewal, evidence that reform reduces prior-authorization volume faster than adjacent products scale, or the need to raise capital before public operating evidence gets materially stronger.
