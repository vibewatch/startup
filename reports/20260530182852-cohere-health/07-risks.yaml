- id: dependency-concentration-and-competition-risk
  title: Customer concentration and dependency risk remain under-disclosed
  body: |-
    Dependency and concentration risk remain material because the public customer story is strong but narrow. Humana is the clearest anchor account, Geisinger offers fresh operational proof, and WISeR provides a current government reference. That is enough to validate product relevance, but not enough to rule out concentration. Cohere’s own growth materials highlight deals, providers, and requests processed, yet still do not disclose revenue by customer, renewal concentration, or attach rates by module. Investors can therefore see proof of deployment depth without seeing economic diversification, which matters because a single reference-account setback would likely affect both topline confidence and future sales credibility.

    Partner surfaces widen the risk. Cohere depends on FHIR standards, payer configuration, provider workflow partners like Availity and NaviNet, and external criteria partners like MCG. At the same time, the competitive field is not standing still: Availity, Myndshft, Waystar, EviCore, and other incumbents or adjacent vendors all sell automation, network reach, or evidence-based decisioning into similar buyer problems. Reform may create more budget, but it also lowers the barrier for rivals to position themselves as CMS-ready alternatives. Category scrutiny from outsourced utilization-management vendors can also spill over to Cohere even when the underlying business model is more provider-friendly or more clinically governed.
