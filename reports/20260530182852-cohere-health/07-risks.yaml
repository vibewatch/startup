- id: TR005
  title: Mitigation and thesis-break triggers
  columns:
  - Risk
  - Monitoring indicator
  - Threshold / event
  - Action implication
  rows:
  - - AI scrutiny / denial governance
    - Audit findings, appeal overturn rates, state enforcement, customer complaints
    - Any material regulator or customer finding that AI-assisted decisions lacked adequate human review or explanation
    - Pause underwriting until model-governance evidence is revalidated
  - - Prior-authorization reform compresses core workflow volume
    - Customer code-list reductions, reduced PA touch volume, slower UM growth
    - Reform narrows prior-auth scope faster than PI, policy, or adjacent revenue grows
    - Cut terminal multiple assumptions and require diversification proof
  - - Customer concentration
    - Top-account renewals, expansion cadence, public reference losses
    - Loss or material contraction of an anchor payer or WISeR-related setback
    - Treat as thesis-break unless replacement pipeline and concentration data offset the loss
  - - Security / privacy event
    - Incident disclosures, customer notices, failed audits, HITRUST lapse
    - Material PHI incident, weak incident response, or recertification failure
    - Reset diligence to security-first and demand remediation evidence before proceeding
  - - Competitive pricing pressure
    - Win-loss data, implementation ROI, price concessions
    - Repeated losses to Availity, Waystar, Myndshft, or incumbents on CMS-ready functionality
    - Lower growth and margin assumptions; require proof of defensible differentiation
  - - Capital / disclosure risk
    - Board reporting depth, audited metrics, runway, fundraising terms
    - Need for new capital before stronger public or private operating evidence emerges
    - Treat valuation as disclosure-constrained and widen downside case
  notes: These triggers are designed to be monitorable in diligence and over the first post-investment year, not just descriptive risk labels.
