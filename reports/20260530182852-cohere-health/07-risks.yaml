  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-renewals
    missingEvidence: Customer-level ARR, top-five customer concentration, renewal dates, termination rights, and module attach rates by account.
    whyItMatters: The public named-customer set is concentrated, but investors still cannot tell whether one payer or one public-sector program dominates revenue quality.
    diligencePath: Request cohort-level revenue concentration, renewal schedule, gross retention, and net retention by product line for 2024-2026.
    relatedQuestionRefs:
    - QR019
    - QR030
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: capital-efficiency-and-disclosure
    missingEvidence: Audited ARR bridge, gross margin, burn, cash runway, implementation margin, and product-level contribution data.
    whyItMatters: A private company can look well funded while still carrying execution or margin risk that only becomes visible when scale spending outruns durable revenue.
    diligencePath: Request board or lender materials showing 2025-2026 budget-versus-actual performance, runway, hiring plan, and path to cash-flow break-even.
    relatedQuestionRefs:
    - QR024
    - QR030
  - type: private-evidence-only
    severity: material
    topic: model-auditability-and-appeal-outcomes
    missingEvidence: Production audit logs, override rates, appeal overturn rates, bias testing by cohort, and WISeR or health-plan audit findings.
    whyItMatters: Public AI-principles language does not prove that model behavior stays explainable, fair, and clinically appropriate under real customer load.
    diligencePath: Request model-governance SOPs, sample denial explanations, drift dashboards, post-deployment monitoring reports, and any regulator or customer audit summaries.
    relatedQuestionRefs:
    - QR015
    - QR027
    - QR029
  - type: private-evidence-only
    severity: material
    topic: security-architecture-and-incident-readiness
    missingEvidence: Architecture diagrams, subprocessor list, most recent pen test, incident-response tabletop outputs, and customer security review packages.
    whyItMatters: The company processes PHI in a multi-party workflow environment, so a single operational failure can become both a trust event and a reportable compliance issue.
    diligencePath: Request current security architecture, AWS control mapping, BAA language, tabletop evidence, incident history, and remediation tracker.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR029
  - type: private-evidence-only
    severity: material
    topic: legal-and-regulatory-risk-register
    missingEvidence: Internal legal register covering complaints, demand letters, state examinations, customer disputes, indemnity exposure, and contract-specific audit clauses.
    whyItMatters: The public record supports only the highest-severity visible risks and cannot substitute for counsel-level visibility into contingent liabilities or bespoke contract terms.
    diligencePath: Request management and counsel summaries of material litigation, regulator contacts, contract audit clauses, and any unresolved payer or provider disputes.
    relatedQuestionRefs:
    - QR004
    - QR029
    relatedTableRefs:
