- id: operational-security-and-model-risk
  title: Operational, security, and model risk all sit inside the same workflow stack
  body: |-
    Operational risk is less about keeping one portal live and more about running a PHI-heavy workflow layer that touches EHRs, provider portals, payers, clinical rules, and cloud infrastructure. Cohere’s privacy policy makes clear that customers upload PHI into a password-restricted PaaS under business-associate agreements, while HHS is tightening business-associate cybersecurity expectations. HITRUST recertification helps, but it does not remove the core problem: any control failure, integration outage, weak contingency process, or misrouted authorization can immediately become both a service problem and a regulated privacy event. The cloud and compliance boundary also depends on third-party infrastructure and attestations, which means customer trust partially rests on control environments that require direct diligence rather than marketing-language comfort.

    Model risk sits inside that same operating stack. Cohere publicly emphasizes clinician review for non-real-time cases, explicit clinical rationales, and bias, drift, and accuracy monitoring, which are real mitigations. But independent policy sources are focused on exactly the failure mode where automation narrows individualized review or obscures why a case was denied, pended, or delayed. Because Cohere’s value proposition includes high real-time approval rates and policy digitization, the diligence question is not whether the company has AI-governance language; it is whether override data, appeal outcomes, audit logs, and monitoring outputs show that governance holds under production load and under external audit.
  claimRefs:
