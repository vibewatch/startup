evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founders
    missingEvidence: An official founder-history page or incorporation-era document naming the full founding team.
    whyItMatters: Founder-market fit and founder continuity influence governance risk and the assessment of institutional memory.
    diligencePath: >-
      Request a cap-table or company-history memo from management and reconcile it against Delaware filings and archived
      launch materials.
    relatedQuestionRefs:
      - QO004
      - QO022
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A publicly supportable post-money valuation for the May 2025 Series C and any preference or secondary terms.
    whyItMatters: Entry price discipline and dilution analysis are impossible without the reference valuation and security terms.
    diligencePath: >-
      Request the Series C term sheet, cap table, and any board-approved financing summary from the company or lead
      investor.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Any audited revenue, ARR, gross margin, or run-rate disclosure for Cohere's current business.
    whyItMatters: >-
      Operating scale looks strong, but underwriting the company requires financial conversion from authorization volume
      to recurring revenue and margin.
    diligencePath: Request monthly recurring revenue, ARR bridge, gross margin by workflow, and 2024-2026 budget versus actuals.
    relatedQuestionRefs:
      - QO012
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A management-confirmed current employee count and location split.
    whyItMatters: >-
      Public directories differ modestly, which affects productivity and cost-structure assumptions when no audited
      labor disclosures exist.
    diligencePath: Request current headcount by function and geography and reconcile it against HRIS exports or board materials.
    relatedQuestionRefs:
      - QO013
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: Earlier seed or Series A milestone details and exact publication dates for some late-2025 releases.
    whyItMatters: >-
      The chronology is usable as a public timeline of record, but a few early financing and late-2025 milestones still
      rely on incomplete public metadata.
    diligencePath: >-
      Reconcile the public timeline against archived launch materials, cap-table records, and management's internal
      financing chronology.
    relatedQuestionRefs:
      - QO008
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: cohere-som
    missingEvidence: Public pricing, average contract value, and request-volume mix by line of business for Cohere Health.
    whyItMatters: >-
      Without pricing and contract mix, a company-specific SOM in dollars would be invented rather than
      diligence-backed.
    diligencePath: >-
      Request payer contract structure, pricing metric, live plan count, and request volume split across MA, commercial,
      and Medicaid.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: conflicting-data
    severity: material
    topic: market-size-methodology
    missingEvidence: >-
      Comparable market definitions that separate medical PA, drug PA, and broader UM software on one geography and time
      base.
    whyItMatters: >-
      Contradictory third-party TAMs can materially distort valuation framing if they are blended without boundary
      adjustments.
    diligencePath: >-
      Ask management and vendors which product modules and services are counted in their market deck and align that to
      one U.S. definition.
    relatedQuestionRefs:
      - QM014
      - QM020
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: provider-segment-adoption
    missingEvidence: Publicly segmented ePA adoption rates by specialty, payer line, or provider size for medical prior authorization.
    whyItMatters: >-
      Provider-side onboarding is a major bottleneck, but public evidence is still too aggregated to size
      specialty-by-specialty rollout friction.
    diligencePath: >-
      Request deployment cohorts by specialty, electronic submission rate, and manual fallback rate from customers or
      prospective buyers.
    relatedQuestionRefs:
      - QM009
      - QM021
  - type: stale
    severity: minor
    topic: oig-denial-quality
    missingEvidence: A newer nationwide government sample of inappropriate prior-authorization denials under current workflows.
    whyItMatters: >-
      The leading official misuse evidence is still the 2022 OIG report, so category trust-risk may have improved or
      worsened since then.
    diligencePath: Monitor the OIG 2026 post-acute-care work-plan series and request plan-level audit findings during diligence.
    relatedQuestionRefs:
      - QM015
      - QM018
  - type: private-evidence-only
    severity: material
    topic: private-challenger-scale
    missingEvidence: Exact live customer counts, payer logos, revenue scale, and funding detail for Infinx and Myndshft.
    whyItMatters: >-
      Without real deployment and capital data it is hard to rank private challengers by durability versus simply by
      marketing breadth.
    diligencePath: >-
      Request current customer count, payer count, ARR, and latest capitalization table or board materials for both
      challengers.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: >-
      Realized pricing, implementation fees, guarantees, and per-authorization or PEPM economics for Cohere and the main
      rivals.
    whyItMatters: >-
      Public price opacity prevents a clean view of ROI, bundling leverage, and whether network incumbents can
      underprice point solutions.
    diligencePath: >-
      Obtain redlined customer contracts, pricing schedules, and implementation SOWs from at least Cohere, Availity, and
      Waystar.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-incidence
    missingEvidence: >-
      Observed win-loss data or migration case studies showing how often plans replace core authorization engines versus
      layering new routing tools around them.
    whyItMatters: >-
      The investment case changes materially if front-door tools are easy to multi-home while policy engines are
      effectively single-home for long periods.
    diligencePath: >-
      Ask for customer migration histories, replacement reasons, module adoption sequencing, and current coexistence
      architecture by account.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, debt obligations, monthly burn, and runway under base and downside cases.
    whyItMatters: Capital adequacy and next-round dependency cannot be judged from the Series C headline alone.
    diligencePath: Request the latest board deck, balance sheet, debt schedule, and monthly cash forecast with covenant headroom.
    relatedQuestionRefs:
      - QI013
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
      Revenue-recognition policy and actual mix across software, delegated services, implementation, and
      payment-integrity engagements.
    whyItMatters: >-
      Without this split, investors cannot tell whether growth is software-like, service-heavy, or deferred by
      onboarding mechanics.
    diligencePath: >-
      Request auditor policy memos and examples of contract accounting for at least one UM, one API, and one PI
      customer.
    relatedQuestionRefs:
      - QI014
    relatedTableRefs:
      - TI001
      - TI002
      - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, ACV, NRR, churn, implementation cost, and sales-cycle data by cohort.
    whyItMatters: Proxy signals are not enough to value customer lifetime economics or judge whether growth is efficient.
    diligencePath: Request cohort dashboards, pipeline conversion data, and onboarding-cost reporting by segment and by product.
    relatedQuestionRefs:
      - QI008
      - QI009
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer concentration, renewal dates, and revenue dependence on major payer relationships such as Humana.
