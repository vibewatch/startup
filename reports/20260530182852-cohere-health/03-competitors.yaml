- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse competitor evidence
  body: The most important adverse evidence cuts in two directions. First, incumbent trust failures are real. ProPublica’s reporting on eviCore’s denial practices and the post-Change Healthcare disruption documented by AHA and AMA show why buyers increasingly care about auditability, override rights, and resilience rather than only automation rate. Those failures create an opening for vendors that can credibly market policy-grounded AI and better provider collaboration. Second, the same scrutiny that hurts incumbents also raises the standard for Cohere and every other entrant. It is no longer enough to say “AI automates prior auth”; buyers will ask who controls the policy logic, how denials are reviewed, whether workflows are resilient, and how much of the process can be embedded into existing provider systems. That leaves Cohere with a real but not impregnable moat. Its provider-first positioning and clinical-intelligence framing matter, yet larger network players can bundle distribution
    and standards readiness, while content incumbents can defend their control of the clinical-policy layer. In practice, Cohere’s durability looks strongest when a buyer wants both high provider adoption and transparent clinical automation; it looks weaker when the buyer primarily values installed-base leverage, delegated review depth, or bundled network economics.
