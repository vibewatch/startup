- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor / option
  - Public pricing / contract model
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - Cohere
    - Custom enterprise pricing not public in reviewed pack
    - Clinical-intelligence PA automation, APIs, payer-provider collaboration
    - Per-auth, PEPM, guarantees, and implementation fees undisclosed
    - Buyers must evaluate ROI through outcomes and workflow fit, not public list price
  - - Availity
    - Quote-driven payer contracts; provider auth sits inside broader network suite
    - Routing, AuthAI, FHIR APIs, provider front door, compliance work
    - Realized economics by payer and provider channel are private
    - Network leverage may matter more than narrow feature price
  - - Waystar
    - Official pricing undisclosed; third-party review says per-user subscription plus custom enterprise levels
    - Authorization manager plus patient-access workflow
    - Third-party price framing is incomplete and not a verified rate card
    - Software-subscription framing helps benchmarking but still leaves real TCO opaque
  - - MCG / eviCore
    - Contracted guideline or UM arrangements with no public list price in retained pack
    - Clinical content, specialty review logic, delegated review workflows
    - Shared-savings, service, and licensing economics are private
    - Lock-in may hide inside content and service contracts rather than visible software fees
  - - Infinx / Myndshft
    - Custom quote; public list pricing not posted in reviewed pack
    - PA automation embedded in broader patient-access or medical-plus-pharmacy workflow
    - Scale and customer-mix disclosure are limited for both challengers
    - Can compete on scope and automation even without transparent list pricing
  - - Manual / internal build
    - Internal labor and engineering cost rather than vendor list price
    - Existing portals, fax, phone, payer workflows, or API-led build
    - Hidden operating cost dominates; maintenance burden is organization-specific
    - Cheapest-looking pilot path can become the most expensive operating model
  notes: Public pricing is weak across the category, so the table shows packaging signals and known unknowns rather than pretending public net price is available. Manual and internal-build rows are included because they are budget competitors even when no software invoice is posted.
