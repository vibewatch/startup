chapter:
  number: 3
  title: Competitors
  summary: 'Cohere Health faces a layered competitive set rather than one clean look-alike: Availity and Waystar bring larger distribution surfaces, while MCG and eviCore bring deeper guideline and delegated-review entrenchment. Cohere looks differentiated on provider-first clinical intelligence and collaboration, but public evidence suggests its moat is moderate because pricing is opaque, front-door tooling can multi-home, and rivals are rapidly embedding AI and FHIR-native workflows into existing payer-provider channels.'
sections:
- id: landscape-map
  title: 'Landscape: direct peers, incumbents, substitutes, and likely entrants'
  body: 'Cohere does not compete in a winner-take-all niche with one obvious like-for-like rival. The landscape splits across different control points in the prior-authorization stack. Direct software peers such as Infinx and Myndshft pitch automation and AI, but the more dangerous near-term threats are larger incumbents that already control adjacent workflow surfaces. Availity can attack from a payer-provider network and routing layer, Waystar from provider revenue-cycle workflow, MCG from licensed clinical-guideline content, and eviCore from delegated utilization-management infrastructure. The status quo is still a real competitor too: phone, fax, payer portals, and manual status checks remain sufficiently painful that multiple vendors explicitly sell against them. Finally, the category is opening to likely entrants that do not need to rebuild a full UM stack. Abridge plus Availity shows how ambient-AI or workflow vendors can use APIs and partnerships to move prior authorization into the
    clinical conversation itself. That means Cohere is really competing against networks, workflow incumbents, content licensors, manual process, and embedded entrants at the same time.'
