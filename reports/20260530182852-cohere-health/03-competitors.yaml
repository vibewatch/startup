  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-challenger-scale
    missingEvidence: Exact live customer counts, payer logos, revenue scale, and funding detail for Infinx and Myndshft.
    whyItMatters: Without real deployment and capital data it is hard to rank private challengers by durability versus simply by marketing breadth.
    diligencePath: Request current customer count, payer count, ARR, and latest capitalization table or board materials for both challengers.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: Realized pricing, implementation fees, guarantees, and per-authorization or PEPM economics for Cohere and the main rivals.
    whyItMatters: Public price opacity prevents a clean view of ROI, bundling leverage, and whether network incumbents can underprice point solutions.
    diligencePath: Obtain redlined customer contracts, pricing schedules, and implementation SOWs from at least Cohere, Availity, and Waystar.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: switching-incidence
    missingEvidence: Observed win-loss data or migration case studies showing how often plans replace core authorization engines versus layering new routing tools around them.
    whyItMatters: The investment case changes materially if front-door tools are easy to multi-home while policy engines are effectively single-home for long periods.
    diligencePath: Ask for customer migration histories, replacement reasons, module adoption sequencing, and current coexistence architecture by account.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
