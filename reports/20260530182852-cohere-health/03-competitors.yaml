- id: switching-costs-and-distribution
  title: Switching cost, lock-in, multi-homing, and distribution power
  body: 'The key strategic distinction in this market is not just feature breadth but which layer owns the customer relationship and the authoritative policy engine. Front-door submission and status tooling can plausibly multi-home. A payer can keep one rules source while exposing authorization flows through a network partner, a provider RCM tool, or an API-enabled workflow layer. That is why Availity and Waystar are important even when they are not identical to Cohere at the clinical-decision layer: both have distribution surfaces that can carry automation into existing provider behavior. By contrast, MCG and eviCore appear harder to displace once embedded because their value sits in guideline logic, delegated review, and governance processes that buyers may only want to maintain in one place. Internal build is becoming more credible for submission and interoperability, because FHIR-native pathways reduce the need for bespoke portal work, but internal build does not automatically solve
    policy curation, provider adoption, or trust. For Cohere, this means the moat depends less on owning every prior-authorization module and more on proving that its clinical-intelligence layer is important enough that a buyer will choose it as the anchor rather than merely as another front-end channel.'
