sections:
- id: identity-and-platform
  title: Identity, mission, and platform scope
  body: 'Cohere Health positions itself as a clinical intelligence company whose core purpose is to make prior authorization an ally rather than an obstacle for patients, physicians, and health plans [CO001]. That framing matters because the company is not selling a narrow workflow automation tool; it is explicitly pitching a shared operating layer for payer-provider decision-making that starts with prior authorization and extends into appeals, payment accuracy, and adjacent operational moments [CO002][CO038]. The central product brand is Cohere Unify, which the company describes as the common platform underneath utilization management, payment integrity, and future workflows, with shared clinical AI, decision engines, and integrations [CO002]. Public databases and company materials consistently place Cohere''s launch in 2019 and its operating center in the Greater Boston market [CO004][CO008]. Built In adds that the company also has a Hyderabad office and a distributed U.S. workforce, reinforcing
    that Cohere is scaling like a software platform rather than a regional services vendor [CO008][CO009][CO036]. What remains missing at this stage is financial transparency: the operating model is clearly enterprise SaaS-like, but publicly accessible sources do not provide audited revenue, ARR, or an independently verifiable current valuation [CO039].'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO008
  - CO009
  - CO036
  - CO038
  - CO039
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership, founder ambiguity, and governance depth
  body: 'Siva Namasivayam is the most consistently corroborated executive in the company narrative: official materials describe him as CEO and co-founder and say he has held that position since 2019 [CO005]. Governance visibility improved in 2026 when Cohere announced the addition of Dr. Mark Leenay to the board, explicitly highlighting the need for deeper health-plan operating expertise as the business scales clinical AI partnerships [CO012]. Cohere''s own company-journey content also references Dr. Gary Gottlieb as board chair or executive chair, signaling a governance structure with recognized healthcare leadership rather than a founder-only board [CO013]. The main unresolved issue is the founder roster. Crunchbase lists Duncan Reece and Siva Namasivayam as founders, while Tracxn instead points to Clay Williams and Duncan Reece as former co-founders [CO006][CO007]. That conflict does not undermine the company mission or current CEO identity, but it does limit confidence in public biographies
    and founder-continuity analysis. The company also leans heavily on clinician-led AI oversight in its governance narrative, saying more than 150 clinical experts monitor the models and that non-approved requests receive licensed-professional review [CO031][CO032]. That oversight claim is strategically important because category critics increasingly focus on whether AI in prior authorization is supervised or denial-oriented.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO012
  - CO013
  - CO031
  - CO032
  - CO040
  tableRefs:
  - TO002
- id: capital-and-operating-scale
  title: Capital formation and visible operating scale
  body: 'Cohere''s financing history shows a clear progression from early specialist healthcare venture support to larger growth capital. The company raised a $36 million Series B in April 2021 led by Polaris Partners, with Longitude Capital, Deerfield, Flare Capital, and Define Ventures participating [CO010]. In May 2025 it announced a $90 million Series C led by Temasek, with existing investors Deerfield, Define, Flare, Longitude, and Polaris continuing support, bringing total disclosed funding to $200 million [CO011]. That syndicate matters because it combines sector-focused health investors with a large global institution, suggesting that Cohere had moved from category formation into scale financing. Publicly visible operating metrics are stronger than public financial metrics. Cohere repeatedly says it processes more than 12 million prior authorization requests annually, supports at least 600,000 providers, and can auto-approve up to 90% of requests [CO014][CO015][CO017]. Later 2025
    releases update the provider figure to over 660,000 and cite 94% provider satisfaction plus up to 8x ROI, implying a platform that already has production-level adoption across major payer workflows [CO016][CO021][CO022]. The caveat is that headcount and revenue remain estimated rather than audited: directories point to roughly 900 to 930 employees, while no public source we fetched disclosed revenue or ARR [CO034][CO035][CO039].'
  claimRefs:
  - CO010
  - CO011
  - CO014
  - CO015
  - CO016
  - CO017
  - CO021
  - CO022
  - CO034
  - CO035
  - CO039
  tableRefs:
  - TO003
  figureRefs:
  - FO003
- id: milestones-validation-and-regulatory-context
  title: Milestones, market validation, and category tailwinds
  body: 'Cohere''s recent milestones show both product expansion and external validation. Humana broadened its relationship from an initial musculoskeletal pilot into nationwide and then additional diagnostic and sleep services, providing unusually specific proof that a major national payer kept expanding the deployment over multiple years [CO023]. The MCG partnership added evidence-based care guidelines directly into Cohere''s decisioning workflow, which strengthens the company''s argument that it is combining automation with clinically defensible content rather than generic rules engines [CO024]. By late 2025 Cohere was also marketing payment integrity as a second platform wedge and said it acquired ZignaAI to bridge utilization management and payments [CO033]. External recognition supports traction but should not be mistaken for underwriting proof. TIME placed Cohere in its top-tier HealthTech list, Deloitte ranked it No. 218 on the 2025 Fast 500, and company-backed coverage says it reached
    the 2025 Inc. 5000 while adding nine new health-plan partnerships in 2024 [CO025][CO026][CO027][CO037]. Regulatory timing is another tailwind: CMS''s 2026 prior-authorization deadlines make digital, FHIR-enabled, faster-response workflows more valuable to health plans [CO030]. At the same time, AMA and AJMC sources highlight the category''s key adverse narrative: AI in prior authorization is under scrutiny whenever it appears to increase denials or reduce clinician judgment [CO029]. Cohere''s promise that its AI is not used to deny care is therefore not just messaging; it is a necessary strategic defense for the category [CO031].'
  claimRefs:
  - CO023
  - CO024
  - CO025
  - CO026
  - CO027
  - CO029
  - CO030
  - CO031
  - CO033
  - CO037
  tableRefs:
  - TO004
  figureRefs:
  - FO001
- id: what-is-still-missing
  title: What remains missing for later diligence chapters
  body: 'Chapter one establishes that Cohere is real, scaled, and well-capitalized enough to merit deeper diligence, but it also shows that the company remains disclosure-light where investment decisions become most sensitive. The exact founder roster is not fully reconciled in public sources, the post-money valuation for the 2025 Series C is not supportable from the material we could fetch, and there is no public revenue or ARR figure to translate operational scale into software economics [CO006][CO007][CO039]. Even the current employee count comes from private-company databases rather than management-certified reporting [CO034][CO035]. Those gaps do not invalidate the company overview. Instead, they sharpen the mandate for later chapters: test whether operational scale converts into durable customer outcomes, whether product breadth is real or mostly narrative, and whether valuation discipline is possible without a transparent pricing reference. Cohere''s own public releases are strong
    on workflow impact, clinician oversight, and partnership expansion, but they remain promotional sources. The rest of the report therefore needs to separate what is independently corroborated from what still depends on company framing [CO029][CO039][CO040].'
  claimRefs:
  - CO006
  - CO007
  - CO029
  - CO034
  - CO035
  - CO039
  - CO040
