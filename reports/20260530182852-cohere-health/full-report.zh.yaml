      - number: '4.4'
        title: 资本充足性与财务结论：资金足以继续建设，披露不足以承销
        blocks:
          - type: paragraph
            body: >-
              Cohere 2025 年 5 月 Series C
              显著改善了前瞻融资位置，管理层称该轮资金用于平台扩展、新用例和运营增长。这足以支持一个合理判断：公司有资本继续扩张到下一个产品周期。但这不足以承销资本充足性。保留公开材料没有披露账面现金、债务、月度烧钱速度、契约结构、现金跑道或客户集中度。在这个品类中，这一缺失比常规
              SaaS 筛选更重要，因为市场正进入更强调合规的阶段。CMS-0057-F 和行业 2027 年 FHIR 承诺抬高交付预期，OIG、KFF、ASCO、ProPublica 和法律评论对 AI
              的审视也抬高了自动化出错的成本。因此，财务结论是混合的。收入机会和账户扩张逻辑可信；利润率路径可行但可能低于纯软件；实体资本强度看起来低；真正的卡点是披露质量。承销前，尽调需要合同层面的收入组合、服务附加、续约行为、分模块利润率，以及董事会级现金跑道视图。
