      - number: '2.2'
        title: 受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              公开规模测算只有在拆成不同视角后才有用。按量看，仅 Medicare Advantage 在 2024 年就产生近 53 million 次预授权请求，99%
              参保人至少受某种预授权约束；这说明即使尚未计入商业险和 Medicaid 管理式医疗，医疗预授权在运营上也已经很大。按可释放价值看，买方为什么会投入很清楚：CAQH 仍看到人工和部分人工医疗交易中存在 $21
              billion 自动化机会，AMA 调查数据也显示该品类每周都在消耗医疗服务方时间。按软件支出看，噪声大得多。近期公开估计从一种医疗利用管理软件定义下的 $224 million，到另一种定义下的 $11.25
              billion 不等，而预授权软件估计大致集中在全球 $2-3 billion。这些数字不能直接比较，因为它们混合了美国与全球范围、纯 PA 与更广 UM 定义。用于尽调时，2024 年美国医疗利用管理解决方案
              $613 million 的估计，是最接近 Cohere 核心工作流的公开 SAM 代理值。它仍不完美，但比不设边界地引用数十亿美元全球 TAM 更能服务决策。
