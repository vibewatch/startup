companyProfile:
  summary: >-
    Cohere Health 是一家位于 Boston 的临床智能公司，聚焦帮助健康险计划和承担风险的医疗服务方改造预授权及相邻支付方工作流。其 Cohere Unify 平台把临床
    AI、规则引擎和面向医疗服务方的工作流工具组合起来，覆盖医疗利用管理、支付准确性、政策及相关决策环节。公开证据显示，公司已有真实运营规模和多年支付方扩张，但相对上市软件可比公司，财务仍不透明。
