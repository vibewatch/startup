        title: 格局：直接同行、既有厂商、替代方案与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Cohere 不是在一个赢家通吃、且只有一个明显同类对手的窄赛道里竞争。预授权技术栈里的控制点不同，格局也随之分层。Infinx 和 Myndshft 这类直接软件同行主打自动化和
              AI，但近期更危险的威胁来自已经控制相邻工作流触面的更大既有厂商。Availity 可以从支付方—服务方网络和路由层进攻，Waystar 可以从服务方收入周期工作流进攻，MCG
              可以从授权临床指南内容进攻，eviCore
