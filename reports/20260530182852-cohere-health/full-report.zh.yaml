      - number: '8.2'
        title: 融资背景、估值可见度和优先权压力
        blocks:
          - type: paragraph
            body: >-
              融资事实清楚；估值事实不清楚。Cohere 公开宣布 2025 年 5 月 14 日完成 $90 million Series C，并称该轮后累计融资达到 $200 million，Temasek 加入继续投资的
              Deerfield、Define、Flare、Longitude 和 Polaris。公司称融资用途是扩展 Cohere Unify、拓展更广的临床用例，并加深 AI
              投资。这足以说明公司在该轮融资时获得了真实投资人支持，也有足够新增资本穿越当前产品周期继续建设。


              但这些还不足以支撑价格。本章保留下来的公开来源没有披露 Series C 的投后估值、企业价值、股数或证券条款。也就是说，公开证据无法告诉投资人，这轮相对此前内部估值是持平、上行
              还是下行，也无法说明新钱是否拿到了异常强的优先权、估值调整条款或反稀释保护。由于累计融资已通过多轮优先股达到 $200 million，谨慎默认应是：在数据室证明相反之前，假设存在有意义但未披露的清算优先权堆叠。


              这正是入场纪律发挥作用的地方。如果业务强到多种公开方法都收敛到宽阔的上行区间，隐藏价格仍可能可以接受。Cohere
              还没到这一步。公司有清晰进展，但公开证据不足以支撑精确的当前估值。实际结论是，融资背景有支撑，估值背景仍未解决。新资本要么要求直接披露，要么要求相对保守情景下公允价值区间有明显折扣。
