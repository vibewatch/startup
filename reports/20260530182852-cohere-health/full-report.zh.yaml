  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与采购中心
        blocks:
          - type: paragraph
            body: >-
              Cohere Health 的公开客户图景以支付方为先，但只有拆成买方、用户、支付方和受益人角色后才说得通。清晰的经济买方是健康险计划或支付方相邻项目负责人：Cohere
              的平台页面和增长发布，写给医疗利用管理、政策、支付准确性和监管就绪负责人，他们想要更快决策、更低医疗支出和更好的服务方关系。医疗服务方是日常用户，通过门户、EHR
              集成、电话或传真支持工作流互动；会员和患者在下游，是预期体验更少延误和更低行政摩擦的一方。这个角色分离很重要，因为 Cohere
              证明的不是消费医疗产品，而是企业级工作流层；即便预算在支付方，采用仍取决于服务方体验。


              可支撑的分层也比“到处都是健康险计划”的宽泛叙事更窄。公开可验证账户以美国为中心，集中在全国或区域健康险计划加一个 Medicare
              承包商项目，而不是小型诊所、雇主或国际市场。最强垂直证据覆盖商业险、交易所计划、Medicare Advantage、Medicaid，现在还通过 WISeR 覆盖 Medicare
              按服务收费监督。公开用例广度也不止一个预授权细分：Humana 时间线横跨多个专科，Cohere 平台故事则把预授权与支付准确性、政策管理和 CMS-0057-F
              合规连在一起。可观察渠道也更像直销支付方，而不是转售驱动；服务方门户和 EHR
              连接工作流是部署触面，不是独立采购渠道。这支持先落地再扩张的销售动作，但公开证据仍未披露按细分市场划分的定价、客户数量层级或模块附加率。
