  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户工作流与产品边界
        blocks:
          - type: paragraph
            body: >-
              Cohere Health 的产品最好理解为支付方—服务方运营工作流，而不是狭义授权表单填报工具。在支付方侧，Cohere
              销售一个临床智能层，可以在同一底层平台上运行预授权、医疗利用管理审核、支付准确性、政策管理和与申诉相邻的决策。在服务方侧，工作流从 Cohere 门户或嵌入 EMR 的 API
              路径开始，随后进入政策检查、文件提示、授权审核和状态跟踪。这个框架很关键，因为 Cohere 不只是声称数字化更好；它声称同一套临床智能应从诊疗前授权延伸到诊疗后支付准确性及相关工作流
              [CE001][CE002][CE012][CE042]。


              公开证据能够支撑的产品地图，比单一预授权更宽。官方页面点名 Unify 平台、核心自研 UM 工作流模块、专科包、独立 Cohere Connect API 层，以及由 Validate、Match 和
              Complete 牵头的支付准确性套件。2025 年公开材料还新增急性住院审核和政策管理模块，说明 Cohere 正横向扩展到相邻支付方运营，而不只是深挖一个点状工具
              [CE008][CE009][CE011][CE025][CE026][CE027][CE028]。最强的部署证据是 Humana 公开描述已扩展到全美 50 州超过 5.1 million 名成员，同时
              Cohere 自己的材料和一则公开招聘信息都指向超过 12 million 的年度请求量 [CE032][CE041]。
