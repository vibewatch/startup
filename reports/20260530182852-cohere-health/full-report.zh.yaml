  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和替代方案
        blocks:
          - type: paragraph
            body: >-
              Cohere 的相关市场比泛泛的“医疗健康 AI”更窄，也比通用收入周期自动化更窄。受监管的核心是医疗预授权及相邻医疗利用管理工作流：支付方必须评估医疗必要性请求、收集支持文件、传达决定，并越来越多地通过
              FHIR API 暴露这些工作流。最重要的纳入支出，是减少影像、手术、急后期照护及其他受利用管理项目中支付方与医疗服务方摩擦的软件和工作流服务。最重要的排除支出，是仅药房侧的预授权，因为 CMS 2024
              年最终规则明确排除药品，2026 年药品提案也把药房授权视为单独扩展路径，而不是当前基线。更广义的索赔处理、通用收入周期工具和照护管理平台都是相邻领域，但如果算进核心
              TAM，会夸大机会。主导替代方案仍是传真、电话、门户和人工审核工作流。这一点很重要，因为 Cohere 这类厂商不是在替代“空白”，而是在支付方和医疗服务方两端挤掉碎片化协调人力。
