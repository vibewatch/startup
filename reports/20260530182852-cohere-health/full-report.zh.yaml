      - number: '4.2'
        title: GTM 动作与销售效率代理：企业级落地扩张，而非自助式 SaaS
        blocks:
          - type: paragraph
            body: >-
              Cohere 的公开 GTM 证据指向支付方主导、带扩张经济性的企业级动作，而不是低触达 SaaS 销售引擎。Humana 从 2021 年 12 州肌骨试点，走到全美 50
              州，又扩展到心血管和外科服务，随后进入诊断影像和睡眠。这个路径说明，核心商业动作是先赢下一个工作流或专科，深度集成，再拓宽到相邻类别。MCG 关系从另一个角度支持同一判断：合作伙伴内容被嵌入
              Unify，而不是作为断裂的点状集成销售，这可以提高切换成本和单账户钱包份额。公开销售效率指标仍然缺失——没有披露 CAC、回本周期、ACV、NRR 或流失率——但有可用代理。Cohere 称去年签下 10
              个新交易，声称 94% 服务方满意度和最高 85% 实时批准，并且所在品类的人工负担仍高到自动化 ROI 显而易见。这在商业上令人鼓舞，但不能替代队列层面的收入留存和实施成本数据。
