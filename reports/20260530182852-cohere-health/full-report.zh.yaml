  - id: TP003
    title: 定价 / 打包比较
    columns:
      - 竞品 / 选项
      - 公开定价 / 合同模型
      - 包含能力
      - 折扣 / 未知项
      - 影响
    rows:
      - - Cohere
        - 所审材料未公开定制企业定价
        - 临床智能事前授权自动化、API、支付方-服务方协作
        - 单次授权、PEPM、担保和实施费用未披露
        - 买方必须用结果和工作流契合度评估 ROI，而不是看公开标价
      - - Availity
        - 支付方合同按报价驱动；服务方授权纳入更宽的网络套件
        - 路由、AuthAI、FHIR API、服务方入口、合规工作
        - 按支付方和服务方渠道实现的经济性不公开
        - 网络杠杆可能比单点功能价格更重要
      - - Waystar
        - 官方定价未披露；第三方评测称按用户订阅，另有定制企业层级
        - 授权管理器 + 患者准入工作流
        - 第三方价格框架不完整，也不是已验证价目表
        - 软件订阅框架有助于基准比较，但真实 TCO 仍不透明
      - - MCG / eviCore
        - 所留材料中的指南或 UM 合同安排没有公开标价
        - 临床内容、专科审核逻辑、委托审核工作流
        - 共享节省、服务和许可经济性不公开
        - 锁定效应可能藏在内容和服务合同里，而不是显性软件费
      - - Infinx / Myndshft
        - 定制报价；所审材料未发布公开标价
        - 事前授权自动化嵌入更宽的患者准入或医疗 + 药房工作流
        - 两家挑战者对规模和客户组合披露都有限
        - 即使没有透明标价，也可凭范围和自动化竞争
      - - 手工 / 内部自建
        - 成本来自内部人力和工程，而非供应商标价
        - 既有门户、传真、电话、支付方工作流或 API 主导自建
        - 隐性运营成本占主导；维护负担依组织而异
        - 看起来最便宜的试点路径，可能变成最贵的运营模式
    notes: 整个品类的公开定价都弱，所以表中展示打包信号和已知未知项，而不是假装能拿到公开净价。纳入手工和内部自建，是因为即使没有软件发票，它们也是预算竞争者。
