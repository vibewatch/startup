      - number: '7.2'
        title: 运营、安全和模型风险都嵌在同一套工作流堆栈里
        blocks:
          - type: paragraph
            body: >-
              运营风险的核心不是让一个门户保持在线，而是跑一层 PHI 密集的工作流，连接 EHR、服务提供方门户、支付方、临床规则和云基础设施。Cohere 的隐私政策明确表示，客户会在商业伙伴协议下把 PHI
              上传到有密码限制的 PaaS，而 HHS 正在收紧对商业伙伴的网络安全预期。HITRUST
              重新认证有帮助，但去不掉核心问题：任何控制失效、集成中断、薄弱的应急流程或错路由授权，都可能立刻变成服务问题和受监管的隐私事件。云与合规边界还依赖第三方基础设施和认证，这意味着客户信任有一部分落在控制环境上，需要直接尽调，而不是靠营销话术安抚。


              模型风险也嵌在同一套运营堆栈里。Cohere
              公开强调，非实时案例有临床医生复核、给出明确临床理由，并监控偏差、漂移和准确性；这些都是实质性缓释。但独立政策来源关注的恰恰是这种失效模式：自动化压缩个体化审核，或让一个案例为什么被拒批、挂起或延迟变得不透明。因为
              Cohere 的价值主张包括很高的实时批准率和政策数字化，尽调问题不是公司有没有 AI 治理话术，而是人工推翻数据、申诉结果、审计日志和监控输出能否证明：治理在生产负载和外部审计下仍能守住。
