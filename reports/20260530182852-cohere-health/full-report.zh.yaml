  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与公开牵引：运营证据强，已实现收入披露弱
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个多产品线收入故事，但不支持一份已披露损益表。Cohere 明确营销的是预授权和医疗利用管理平台；同一批官方页面也把支付准确性、索赔智能、申诉和政策管理定位为同一 Unify
              底座之上的扩展。这一点很重要，因为它指向账户扩张模型，而不是单模块产品销售。公司还表示，可以用软件、服务或符合 CMS-0057-F 的 API
              部署，这扩大了潜在合同结构，却让实际定价仍不透明。异常强的是运营规模证据：Cohere 称它每年为超过 600,000 名服务方处理超过 12 million 次授权；Humana 相关材料则显示，从 2024
              年每年 5.5 million 次授权、触达 15 million 名成员，推进到案例研究视角下覆盖全美 50 州超过 5.1 million 名 Humana
              成员。仍然缺的是从活动量到收入的关键转换层：保留材料中的公开来源没有披露 ARR、GAAP 收入、毛利率或产品收入组合。
