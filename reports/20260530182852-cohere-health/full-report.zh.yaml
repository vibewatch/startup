        - 无公开标价
        - 企业软件合同；可能按 PMPM、按提供方或按授权次数计费，但未披露
        - 最低消费、PEPM、实施费、保证条款和折扣
        - 仅凭公开定价无法筛查收入质量
      - - 委托 UM 服务
        - 无公开费率表
        - 针对部分专科的服务加平台安排
        - 临床人员配置负担、审核量假设和利润分成
        - 毛利率可能更低，但钱包份额更高
      - - API / 互操作层
        - 无公开 API 定价
        - 与事前授权工作流绑定的合规或交易驱动接入
        - API 是打包、按量计费还是单独销售
        - 对 CMS-0057-F 需求很重要，但变现不透明
      - - 支付完整性服务
        - 官方材料强调更低或有费用和透明度，而不是公布价格
        - 服务费、节省额捕获或基于审计的经济性
        - 实际或有费率、固定费，以及与申诉相关的成本回收
        - 收入可能更多取决于结果和服务范围，而不是软件席位
      - - Surface 理赔智能
        - 无公开定价
        - 可能是软件或分析订阅，但公开信息未证实
        - 附加率、实施工作量、数据摄取费和合同期限
        - 若采用度足够，可能改善软件收入占比
      - - 可比基准：Waystar
        - 10-K 披露订阅收入、按量收入和实施收入按期确认，但没有客户费率表
        - 月度提供方数量费用、最低消费、交易费和实施费
        - 具体客户定价和折扣历史仍属私有信息
        - 可比公司公开文件能证明合同复杂度，不能直接对标价格
    notes: 本表记录公开定价能说明什么、不能说明什么。对 Cohere 而言，主结论是企业定价靠谈判，实际经济性未披露。
