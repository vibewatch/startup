  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 公开价值或状态
      - 收入质量信号
      - 尽调问题
    rows:
      - - 事前授权 / UM 平台
        - 面向健康险计划销售的企业平台，用于授权和决策支持
        - '>12M 年度事前授权；>600k 医疗服务提供者；最高 85% 实时批准'
        - 核心平台看起来真实且已有规模，但实际合同价值未披露
        - 调取逐客户 ARR、计价单位和实施范围
      - - 委托利用管理服务
        - 端到端委托运营，并由同专科医生审核
        - 官方提供平台、服务或全委托运营三种形态
        - 合同价值被抬高，但毛利率可能低于纯软件
        - 调取软件与委托运营的毛利率拆分
      - - CMS-0057-F / API 互操作
        - 面向合规的 API 接入与单一入口集成
        - Cohere 称 API 已用于 9M+ 次授权，并支持 4,000+ 项政策
        - 可能支撑粘性经常性收入，但计价基础未披露
        - 调取 API 定价、实施费和托管成本转嫁条款
      - - 支付完整性服务
        - 付款前和付款后审计、编码校验与对账
        - 官方按端到端服务销售，并宣称 8–9x ROI
        - 可能是高价值增购，但服务强度和或有收费经济性不清楚
        - 调取 PI 收入、收费结构，以及或有收费或节省分成条款
      - - Surface 理赔智能
        - 面向健康险计划挖掘理赔、合同、福利和政策数据
        - 公开渠道显示，这是新推出的自适应理赔智能模块
        - 可能带来类软件经常性收入，但采用度和定价未公开
        - 调取 Surface 已签客户、附加率和定价模型
      - - 合作伙伴嵌入的临床内容
        - MCG 指南集成进 Unify 决策流程
        - 合作伙伴证据显示这是工作流增强，而不是独立 SKU
        - 支撑增购和留存，但收入分成或授权条款未公开
