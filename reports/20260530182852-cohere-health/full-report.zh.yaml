          label: CMS / WISeR
          description: 政府可引用性，加上审计和政治敏感性。
        - id: interop
          label: 互操作轨道
          description: FHIR 指南、门户和 EHR 路由触点。
        - id: aws
          label: AWS
          description: 云底座和第三方控制环境。
        - id: mcg
          label: MCG
          description: 集成到决策中的外部临床准则。
        - id: market
          label: 竞争市场
          description: Availity、Waystar、Myndshft、EviCore 和相邻供应商。
      edges:
        - from: cohere
          to: humana
        - from: cohere
          to: geisinger
        - from: cohere
          to: cms
        - from: cohere
          to: interop
        - from: cohere
