      - number: '8.4'
        title: 乐观、基准、悲观情景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              由于当前收入未披露，估值只能做情景化，而不是假装精确。基准情景假设 Cohere 到 2027 年把可见运营规模转化为约 $90 million 至 $130 million
              收入；这会与预授权工作流市场中有意义份额，加上支付完整性、政策管理和理赔智能等相邻模块的部分成功相一致。对这段收入区间套用 4x 至 6x 倍数，得到约 $360 million 至 $780 million
              的基准估值区间。这不是确定性判断；而是在承认公司已有真实规模和工作流相关性前提下，最不激进的承保情景。


              乐观情景假设模块化扩张故事更像高质量工作流软件那样落地。在这种情况下，Cohere 证明支付完整性、合规工具和理赔智能产品不只是服务包装，而是耐久的经常性软件收入。如果收入达到约 $150 million 至
              $200 million，业务获得 6x 至 8x 倍数，估值会进入约 $900 million 至 $1.60 billion
              区间。悲观情景假设相反：监管审视、集中度或服务强度把公司拉向承压健康科技可比。收入约 $45 million 至 $70 million、倍数 2.5x 至 4.0x 时，估值落入约 $110 million 至
              $280 million 区间。


              入场纪律直接来自这些区间。企业价值等价口径高于约 $900 million 时，除非 Cohere 能证明 Abridge 式 AI 溢价经济性或 Waystar 式披露质量，否则公开证据给出的上行太少。约
              $450 million 至 $550 million 区间内，基准到乐观回报在四到五年持有期内变得可支撑。介于两者之间，公司战略上仍可能有吸引力，但价格承担了太多工作。
            claimRefs:
              - CV024
              - CV032
              - CV033
