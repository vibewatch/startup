      - number: '1.3'
        title: 融资历程与可见运营规模
        blocks:
          - type: paragraph
            body: >-
              Cohere 的融资历史显示，公司从早期专业医疗投资人支持，清晰走向更大规模的成长资本。公司在 2021 年 4 月完成 $36 million Series B，由 Polaris Partners
              领投，Longitude Capital、Deerfield、Flare Capital 和 Define Ventures 参投 [CO010]。2025 年 5 月，公司宣布由 Temasek 领投 $90
              million Series C，既有投资人 Deerfield、Define、Flare、Longitude 和 Polaris 继续支持，使已披露累计融资达到 $200 million
              [CO011]。这个投资人组合很重要，因为它把专注医疗健康的投资人与大型全球机构结合在一起，说明 Cohere 已从品类形成走到规模融资。公开可见的运营指标强于公开财务指标。Cohere 反复称，公司每年处理超过
              12 million 次预授权请求，支持至少 600,000 名医疗服务方，并可自动批准最高 90% 的请求 [CO014][CO015][CO017]。2025 年后续发布把服务方数字更新为超过
              660,000，并引用 94% 服务方满意度和最高 8x ROI，意味着平台已经在主要支付方工作流中获得生产级采用
              [CO016][CO021][CO022]。但需要注意，员工数和收入仍是估计而非审计数字：名录显示员工约 900 到 930 人，我们抓取的公开来源没有披露收入或 ARR
              [CO034][CO035][CO039]。
