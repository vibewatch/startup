  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑和价格敏感的建议
        blocks:
          - type: paragraph
            body: >-
              Cohere 的正向逻辑很直接。公司明显已经大过早期试点供应商：公开材料显示每年处理 1200 万次以上预授权请求，覆盖 60 万名以上提供方、Humana 510 万会员足迹；2026 年 1
              月更新称，提供方满意度 94%、实时授权批准率 85%、支付 ROI 最高 8 倍，上一年新增十个交易。这些信号重要，因为它们把市场需求、产品证明、客户采用和扩张可选性连了起来。相邻产品故事也真实。Cohere
              不再只谈预授权；它在推支付完整性、政策管理和监管就绪工具。如果一家工作流平台要走出狭窄的利用管理利基，这正是投资人想看到的多模块扩张。


              反向逻辑同样重要。公开证据仍没有披露当前价格、收入、毛利率、净收入留存率或优先股堆叠。这意味着，最强证据支持的是公司质量，而不是当前入场价值。监管下行也不小。WISeR 给 Cohere
              带来新的相关性和可引用性，但保留下来的多个反向来源称，AI 辅助预授权可能增加行政负担、延迟必要护理，并通过与拒批挂钩的共享节省奖励供应商。2026 年对 eviCore
              的审视提醒人们：当拒批和治理成为故事主线，利用管理资产可以很快从战略溢价转为声誉折价。


              这组因素指向一个价格敏感的建议：继续研究，而不是买入。如果私下尽调证明经常性收入耐久、利润率像软件，Cohere
              也许值得一个健康的工作流软件倍数。仅靠公开证据还达不到这个门槛。在价格、经济性和结构披露之前，正确姿态是承认公司商业上在前进，同时拒绝承保一个具体估值。
