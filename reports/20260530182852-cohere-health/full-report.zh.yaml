  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        This set covers the most relevant retained public anchors for Cohere: profitable healthcare workflow software,
        challenged or service-heavy health-tech, adjacent private AI workflow premiums, and one major strategic
        utilization-management transaction. It is not a census of every payer, RCM, or care-management comp.
    columns:
      - 可比公司
      - 最近收入或 ARR
      - 估值标记 / 市值
      - 隐含倍数
      - 为什么可比
      - 局限
