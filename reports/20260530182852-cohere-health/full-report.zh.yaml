      - number: '8.5'
        title: 退出就绪度、最终尽调事项和打破逻辑的触发点
        blocks:
          - type: paragraph
            body: >-
              基于保留证据包，Cohere 还没到公开退出就绪状态。Waystar 展示了公开市场投资人能看到并定价的东西：收入、利润率、留存、大客户数量和明确指引。Cohere
              还没有发布同等信息。这不意味着业务弱；它意味着今天更可能的退出路径是战略交易或后期私募，而不是 IPO。如果 Cohere 能证明自己掌握的是可信的临床智能层，而不是狭窄的预授权
              UI，战略买家可能有兴趣。eviCore 先例说明，品类规模价值是可能的。但 eviCore 争议也说明，买家现在会更强力尽调拒批治理、可审计性和提供方信任。


              剩余尽调事项因此主要是结构和财务。投资人需要模块级 ARR 或收入、毛利率、NRR 或总留存率、头部客户集中度、现金跑道、债务条款和完整优先权瀑布。还需要 WISeR
              特定的经济性和治理：项目是否产生真实收入，申诉和推翻数据是什么样，共享节省暴露相对任何拒批激励反弹有多大。


              打破逻辑的触发点可衡量。如果 WISeR 因拒批激励被暂停或实质收窄，如果标杆客户停止扩张或续约，或下一轮融资低于基准情景区间，溢价逻辑会迅速变弱。换句话说，Cohere
              作为公司仍看起来可投，但只有在价格合适、且尽调远强于公开证据时才可投。
            claimRefs:
