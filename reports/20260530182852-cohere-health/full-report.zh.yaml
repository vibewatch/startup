      - - Waystar
        - FY2025 收入 $1.099B
        - $3.81B 市值（2026 年 5 月）
        - ~3.5x 收入
        - 最接近的公开证明：医疗工作流软件只要有利润率和净留存率（NRR），就能拿到健康倍数
        - 盈利能力更强，披露远多于 Cohere
      - - Doximity
        - FY2026 收入 $644.9M
        - $3.91B 市值（2026 年 5 月）
        - ~6.1x 收入
        - 高质量数字工作流与网络型可比，说明优质软件结果可获溢价
        - 提供方网络模式比 Cohere 更轻服务
      - - Health Catalyst
        - FY2026 指引 $260M-$265M
        - ~$0.10B 市值（2026 年 5 月）
        - ~0.4x 收入
        - 显示医疗科技执行受挫时的下行倍数
        - 产品栈不同，情绪也低迷
      - - Evolent
        - 过去 12 个月收入 $1.89B
        - ~$444M 市值（2026 年 5 月）
        - ~0.24x 收入
        - 显示信心收缩时，服务偏重的支付方平台底部
        - 价值医疗敞口不同于事先授权工作流
      - - Abridge
        - ~$100M ARR / $117M 合约 ARR
        - Series E 估值 $5.3B（2025 年 6 月）
        - ~45x-53x ARR
        - 说明私募市场能给 AI 工作流多高的溢价
        - 提供方 AI 病历助手经济模型不可直接比较
      - - 可比案例：eviCore / Express Scripts
        - 收购时覆盖 100M 名受保人
