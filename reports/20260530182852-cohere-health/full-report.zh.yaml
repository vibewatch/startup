      - number: '1.5'
        title: 后续尽调章节仍缺什么
        blocks:
          - type: paragraph
            body: >-
              第一章确认 Cohere 真实存在、已有规模、资本也足够充足，值得做更深尽调；但它也显示，在投资决策最敏感的地方，公司披露仍然很轻。公开来源无法完全对齐准确创始人名单，2025 年 Series C
              的投后估值无法用我们可抓取材料支撑，也没有公开收入或 ARR 数字，把运营规模转化为软件经济性 [CO006][CO007][CO039]。即便当前员工数也来自私营公司数据库，而不是管理层认证报告
              [CO034][CO035]。这些缺口不推翻公司概况，反而让后续章节的任务更清楚：检验运营规模能否转化为持久客户结果，产品广度是真实还是主要停留在叙事，以及在缺少透明价格参考时能否保持估值纪律。Cohere
              自己的公开发布在工作流影响、临床监督和合作扩展上很强，但它们仍是带推广属性的来源。因此，报告后续部分需要区分哪些内容已被独立印证，哪些仍依赖公司表述 [CO029][CO039][CO040]。
