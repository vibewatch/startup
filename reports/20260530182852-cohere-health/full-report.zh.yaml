      - number: '4.3'
        title: 成本结构、利润率路径与资本强度：软件上行受临床服务负载调节
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Cohere
              不应被建模为纯按席位计费的软件厂商。其官网和支付准确性材料明确包含委托医疗利用管理、同专科医生审核、临床与编码验证、病历工作流、申诉支持，以及面向合规敏感计划的美国本土运营。这些功能可能提高产品可信度、支撑更高合同价值，但也意味着服务交付成本基础会压低相对纯工作流软件的毛利率。保留材料中最好的公开申报代理是
              Waystar。它展示了规模化医疗工作流厂商如何混合订阅和按量收入，在合同期内确认实施费，具备中高毛利率，同时仍在销售、实施支持和软件投资上投入明显。对 Cohere
              而言，可能路径形态类似，但临床人力和监管开销更重。由于 Unify
              基于云且设计上无需本地托管，实体资本开支应保持较轻；但合规、政策数字化、集成工作和人工复核能力仍是真实成本中心。公开层面看，利润率故事因此可信，但尚未达到决策级。
