      - number: '8.3'
        title: 可比估值框架：上市可比公司、私募溢价和战略先例
        blocks:
          - type: paragraph
            body: >-
              Cohere 最有用的估值锚来自三类参考：上市医疗工作流软件、承压或服务占比较高的健康科技，以及相邻私募 AI 工作流溢价。Waystar 是最干净的上市基准，因为它盈利、工作流属性重、公开披露足够展示 IPO
              门槛。Waystar 报告 FY2025 收入约 $1.099 billion、调整后 EBITDA 利润率 42%、NRR 112%，2026 年 5 月下旬市值约 $3.81 billion，对应约 3.5x
              过去十二个月收入。Doximity 处在医疗工作流和网络软件的高质量一端，2026 财年收入 $644.9 million，市值约 $3.91 billion，约为 6.1x 收入。另一端，Health
              Catalyst 和 Evolent 分别接近 0.4x 和 0.24x 收入，说明增长、服务强度或信心恶化时会发生什么。


              私募可比也同时强化上行和谨慎。Sacra 称 Abridge 达到约 $100 million ARR，随后在 2025 年 6 月以 $5.3 billion 估值融资，而几个月前估值还是 $2.75
              billion。当增长、品类热度和软件经济性同时对齐，私募投资人会为医疗 AI 工作流公司支付这种溢价。但 Abridge 不是干净可比：它是提供方工作流
              AI，单位经济不同，而且引用估值远高于保留材料中任何上市工作流倍数。更有用的传导是，相邻 AI 进入者正通过 Availity 和 Highmark 关系进入预授权，这抬高了品类上行天花板，也加大了竞争压力。


              战略先例也重要。Express Scripts 在 2017 年以 $3.6 billion 收购 eviCore，证明福利管理和利用管理资产可以拥有真实战略价值。但 2026 年围绕 eviCore
              的审视也说明，当拒批和治理占据叙事，同一品类会失去支持。对 Cohere 来说，可比教训很清楚：可比区间很宽，但正确锚点取决于业务有多少像软件、多少像服务，以及未来有多少价值来自监管信任，而不只是工作流自动化。
