        title: 护城河持久性与竞品反向证据
        blocks:
          - type: paragraph
            body: >-
              最重要的反向证据指向两个方向。第一，既有厂商的信任失败是真实的。ProPublica 关于 eviCore 拒付做法的报道，以及 AHA 和 AMA 记录的 Change Healthcare
              事件后中断，说明买方为什么越来越关心可审计性、覆盖权和韧性，而不只看自动化率。这些失败为能够可信营销政策扎根 AI 和更好服务方协作的厂商创造了入口。第二，伤害既有厂商的同一轮审视，也提高了 Cohere
              和所有其他进入者的标准。只说“AI 自动化预授权”已经不够；买方会追问谁控制政策逻辑、拒付如何复核、工作流是否有韧性，以及流程有多少能嵌入服务方既有系统。因此，Cohere
              拥有真实但并非固若金汤的护城河。它的服务方优先定位和临床智能叙事很重要，但更大的网络玩家可以捆绑分发和标准就绪能力，内容既有厂商也能守住临床政策层控制权。实践中，当买方同时需要高服务方采用和透明临床自动化时，Cohere
              的持久性看起来最强；当买方主要看重装机基础杠杆、委托审核深度或捆绑网络经济性时，Cohere 会弱一些。
