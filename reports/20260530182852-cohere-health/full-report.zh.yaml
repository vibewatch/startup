      - number: '1.2'
        title: 领导层、创始人不确定性与治理深度
        blocks:
          - type: paragraph
            body: >-
              Siva Namasivayam 是公司叙事中最稳定得到交叉印证的高管：官方材料称其为 CEO 兼联合创始人，并称他自 2019 年起担任该职位 [CO005]。2026 年 Cohere 宣布 Dr. Mark
              Leenay 加入董事会，治理可见度有所提高；公司明确强调，随着临床 AI 合作扩张，业务需要更深的健康险计划运营经验 [CO012]。Cohere 自己的公司历程内容也提到 Dr. Gary Gottlieb
              是董事长或执行董事长，说明治理结构中有受认可的医疗健康领导者，而不是只有创始人的董事会 [CO013]。主要未解问题是创始人名单。Crunchbase 列出 Duncan Reece 和 Siva
              Namasivayam 为创始人，Tracxn 却指向 Clay Williams 和 Duncan Reece 为前联合创始人 [CO006][CO007]。这一冲突不削弱公司使命或当前 CEO
              身份，但会限制我们对公开履历和创始人延续性分析的信心。公司在治理叙事中也强调临床专家主导的 AI 监督，称超过 150 名临床专家监控模型，未获自动批准的请求会由持证专业人员复核
              [CO031][CO032]。这一监督主张具有战略意义，因为品类批评者越来越关注预授权中的 AI 是否有人监督、是否偏向拒付。
