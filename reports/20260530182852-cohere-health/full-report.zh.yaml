      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              监管是最干净的增长驱动，因为它创造的是有期限的支出，而不是可选创新预算。CMS 的 2026 年运营要求和 2027 年 API 时间表、AHIP/BCBSA 80% 实时承诺，以及针对 AI
              治理和响应时间的州改革，都让可配置数字工作流优于传真流程。ROI 是第二个驱动：AMA 负担数据和 CAQH 节省数据让支付方和医疗服务方容易看到劳动力和延误成本在哪里累积。AI
              采用是第三个驱动，因为更多计划和服务方组织已经在行政环节使用 AI，这会降低它们对自动化的概念阻力。约束同样实质。遗留核心系统、EHR
              集成复杂度、隐私和安全要求，以及服务方变更管理，都会放慢部署。信任本身也是一道独立闸门：OIG 关于不当拒付的发现和 AMA
              的患者伤害证据意味着，买方需要可审计工作流、临床人员复核和透明拒付逻辑，而不只是更快的自动化。换句话说，品类在增长，但厂商仍必须先赢得自动化高后果决策的许可。
