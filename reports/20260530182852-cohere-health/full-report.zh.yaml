      - number: '6.2'
        title: 采用轨迹与具名证据
        blocks:
          - type: paragraph
            body: >-
              当证据从客户标志走到带日期的部署里程碑时，采用证明最强。Humana 是最清楚的例子：Cohere 自己的记录显示，2021 年有 12 州肌骨试点，2022 年扩展到全国，2023
              年增加心血管和外科范围，2024 年又扩展到诊断影像和睡眠。当前 Humana 案例研究随后把这一旅程描述为覆盖全美 50 州超过 5.1 million
              名成员的规模化生产。汇总公司指标进一步说明平台不是一个小试点业务：Cohere 称每年处理 5.5 million 次预授权，影响超过 15 million 名成员和 420,000 名服务方，并在 2025
              年签下 10 个新交易。


              Geisinger 和 WISeR 提供更新的运营证据。Geisinger 最初发布材料包含具体结果和业务线广度，而 2026 年 1 月 Geisinger 更新显示，Cohere
              门户用实时状态、上传、通知和培训资源，取代了每日住院传真报告。CMS 和 Novitas 提供的是另一类证据：还不是结果，而是当前可引用性。CMS 将 Cohere 列为 Texas WISeR
              参与方，Novitas 与 Texas Medical Association 则显示 2026 年 1 月提交日期、门户注册、状态跟踪和缺失文件提醒。合在一起看，Cohere
              的公开采用证据真实且足够当前，可以支撑生产部署主张；但它仍依赖少数标志性账户，而不是广泛具名客户名单。
