      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方通常是支付方，而不是医生诊所。CMS 规则、AHIP 承诺和 BCBSA 承诺都把硬性责任放在保险公司和管理式医疗组织身上：API
              就绪、透明度、周转时间、照护连续性和实时响应。因此，预算所有权通常在医疗管理、临床运营和健康险计划 IT
              负责人手里，合规与互操作团队也有很强影响力。医疗服务方仍然关键，因为他们是提交请求、提供文件、最直接承受时间负担的运营用户；但他们通常是影响者和工作流参与者，而不是签下企业软件支票的一方。短期最好的业务线目标是
              Medicare Advantage、商业险计划和 Medicaid 管理式医疗，因为当前简化努力明确点名这些领域。采用路径也分多步：政策或 ROI
              触发、支付方赞助、工作流标准化、集成工作、服务方上线，然后在诊疗现场实时使用。任何厂商如果不能同时推动支付方配置和服务方工作流改变，都很难把监管顺风转化为真实使用。
