  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 结论从真实工作流证明出发，穿过缺失的价格支撑和监管风险，落到继续研究建议。
    data:
      nodes:
        - label: 运营规模
          detail: '>12M 次请求和 >600k 家提供方构成真实市场相关度。'
        - label: 客户证明
          detail: Humana 和 Geisinger 展示的是已上线部署和扩张，而不是试点泡影。
        - label: 多模块上行
          detail: 支付完整性、政策和合规工具拓宽收入机会。
        - label: 缺失价格和结构
          detail: 现有公开来源都没有披露当前估值、股份条款或清算优先权结构。
        - label: 监管审查
          detail: WISeR 和 eviCore 说明，拒付和治理问题会迅速压低估值。
        - label: 继续研究
          detail: 等到信息披露，或价格相对基准情景区间给出明确折扣再看。
      edges:
        - from: Operating scale
          to: Customer proof
        - from: Customer proof
          to: Multi-module upside
        - from: Multi-module upside
          to: Research-more
        - from: Missing price and structure
          to: Research-more
        - from: Regulatory scrutiny
          to: Research-more
    approximationNotes: 图中呈现一条逻辑链，不是流程图；结论是，缺少价格和交易结构，单靠公司质地还不足以支撑投资判断。
    claimRefs:
      - CV005
      - CV007
      - CV023
      - CV026
      - CV038
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 将选定收入倍数套用到 $110 million 的基准情景收入中点，得到隐含企业价值。
    data:
      items:
        - label: 服务占重下限（0.25x）
          value: 28
          unit: $M EV
        - label: 承压健康科技（0.40x）
          value: 44
          unit: $M EV
        - label: Waystar 式上市工作流（3.5x）
          value: 385
          unit: $M EV
        - label: 基准投资测算锚点（4.5x）
          value: 495
          unit: $M EV
        - label: 高质量工作流（6.0x）
          value: 660
          unit: $M EV
        - label: 激进 AI 溢价（8.0x）
          value: 880
          unit: $M EV
    approximationNotes: 采用基准情景收入假设的中点，不是已披露的当前收入。重点在敏感性，不是在声称 Cohere 已有 $110M 收入。
    claimRefs:
      - CV015
      - CV017
      - CV019
      - CV021
      - CV030
      - CV031
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以公开可比公司区间和市场规模证据为锚，情景假设推导出悲观、基准、乐观估值带。
    data:
      items:
        - label: 悲观
          low: 110
          mid: 195
          high: 280
          unit: $M EV
        - label: 基准
          low: 360
          mid: 570
          high: 780
          unit: $M EV
        - label: 乐观
          low: 900
          mid: 1250
          high: 1600
          unit: $M EV
    approximationNotes: 这些区间是情景输出，不是直接估值标记。中点只是用于展示的简单中心点，并非另行披露的估计值。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 用一组简要 KPI 看清当前拉高或压低 Cohere 测算价值的主要因素。
    data:
      items:
        - label: 市场顺风
          value: Medium-High
          detail: 监管压力和工作流痛点仍然存在，这一品类还在数字化。
        - label: 产品 / 工作流验证
          value: High
          detail: 规模、自动化和具名客户验证强于许多未上市同业。
        - label: 客户留存可见度
          value: Medium-Low
          detail: 标杆客户不错，但留存和集中度数据仍然缺位。
        - label: 经济性可见度
          value: Low
          detail: 现有资料包没有公开披露收入、利润率、NRR 或现金续航期。
        - label: 监管风险
          value: High
          detail: WISeR 和拒付治理审查会迅速改变估值。
        - label: 价格支撑
          value: Unknown
          detail: 当前估值未披露，公开资料包无法证明定价公平。
    approximationNotes: 这组 KPI 是定性判断，并有意把公司实力和价格支撑拆开。
    claimRefs:
      - CV006
      - CV010
      - CV025
      - CV026
      - CV039
      - CV040
      - CV044
