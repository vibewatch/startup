      - number: '5.4'
        title: 信任、差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              Cohere 最清晰的技术差异化主张，是其临床 AI 由临床人员训练、扎根循证指南，并在多个工作流中复用，而不是事后贴在数字化门户上。公开材料用数百万真实授权决策、超过 350
              个临床人员训练模型、按最低必要原则抽取附件数据，以及横跨授权、支付准确性、申诉和政策工作流的平台，来强化这一论点 [CE018][CE019][CE042]。信任主张同样重要：Cohere 公开表示采用
              AES-256 和 TLS 1.2+ 保护、HIPAA 与 HiTECH 保障，以及 HITRUST、NCQA 和 URAC 资质 [CE021][CE022]。这些对健康险计划是有意义的采购信号，尤其是与面向
              CMS 的互操作就绪能力放在一起看 [CE034][CE035][CE044]。


              风险在于，监管和声誉预期上升的速度快于公开证据基础。CMS 正推动生态走向更透明的 API 工作流和公开指标，KFF 强调预授权和索赔审核中 AI 的联邦与州治理仍未定型，AMA
              调查证据也显示，一线医生仍怀疑当前改革承诺能否真正减轻负担 [CE034][CE035][CE036][CE037][CE048]。对 Cohere
              来说，举证责任不再只是自动化原则上是否有效；公司需要按模块展示准确性、公平性、可解释性、可靠性和服务方体验。这些证据点公开程度还不足以单独关闭产品尽调 [CE045][CE046][CE047]。
