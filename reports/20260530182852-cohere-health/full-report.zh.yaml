        title: 持久性、满意度与扩张信号
        blocks:
          - type: paragraph
            body: >-
              Cohere 的公开耐久性证据强过只摆客户标识，但仍没到投资级留存披露的标准。积极面很清楚：Humana 多年铺开，Geisinger 的 2026 运营更新，都说明这些关系持续到足以继续深化；Cohere
              的平台定位也明确鼓励医保计划先从一个工作流切入，再逐步加模块。满意度和工作流指标同样充足。Cohere 披露 94% 提供方满意度、67 的 NPS、94% 数字化受理采用率、90% 以门户为主的使用率、91%
              任务更轻松，以及 82% 决策速度快于其他门户或供应商。这些信号有意义：产品不只是打动采购团队，也在用户端形成共鸣。


              缺口同样重要。保留下来的公开来源没有披露
              NRR、GRR、流失率、合同期限、续约率或队列经济。即便最强的公开证明，也主要说明运营工作流，而不是收入耐久性。公开调查还显示，品类摩擦仍然很高：放弃治疗、决策延迟、依赖电话或传真仍很常见；即便 Cohere
              赞助的调查情绪积极，不同来源对 AI 的态度仍然分化。组合起来看，Cohere 很可能有真实扩张动能，但公开证据还无法区分两件事：耐久的经常性收入，还是少数强参考客户加公司发布的广泛满意度统计。
