      - number: '3.3'
        title: 切换成本、锁定、多栖与分发力
        blocks:
          - type: paragraph
            body: >-
              这个市场的关键战略差异不只是功能广度，而是哪一层拥有客户关系和权威政策引擎。入口提交和状态查询工具完全可能多栖。支付方可以保留一个规则来源，同时通过网络伙伴、服务方 RCM 工具或支持 API
              的工作流层暴露授权流程。因此，即使 Availity 和 Waystar 在临床决策层并不与 Cohere 完全相同，它们依然重要：两者都有分发触面，可以把自动化带进服务方既有行为。相比之下，MCG 和
              eviCore 一旦嵌入，似乎更难被替换，因为它们的价值位于指南逻辑、委托审核和治理流程，买方可能只想在一个地方维护这些能力。随着 FHIR
              原生路径降低定制门户工作的必要性，内部自建在提交和互操作上变得更可信；但内部自建不会自动解决政策梳理、服务方采用或信任问题。对 Cohere
              而言，这意味着护城河不取决于是否拥有每一个预授权模块，而更取决于能否证明其临床智能层足够重要，让买方把它选为锚点，而不是只把它当作另一个前端渠道。
