      - number: '2.5'
        title: 矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              后续章节应保留两点尽调警示。第一，公开品类估计过于不一致，不能单独作为估值输入。视来源而定，这个品类可能看起来像低于 $1 billion 的工作流细分市场，也可能是 $2-3 billion
              的预授权软件市场，或超过 $11 billion 的医疗利用管理软件平台市场。它们在各自定义里都可能“正确”，但不能未经调整就混在一起。第二，Cohere 自身 SOM
              无法仅凭公开数据支撑。公开来源没有披露定价、按请求收费、平均合同价值，或 Medicare Advantage、商业险和 Medicaid
              账本之间的收入拆分，因此自下而上的钱包份额模型会是编出来的，而不是尽调出来的。务实做法是保留有边界纪律的 SAM
              代理值，让互相矛盾的厂商市场估计保持可见，并在把市场分析转成估值数学之前，直接索取定价、客户组合、上线计划数和分业务线请求量。
