    rows:
      - - Cohere Health
        - 直接支付方工作流同行
        - 年度支付方-服务方互动 47M；实时批准率最高 85%；服务方满意度 94%
        - 健康险计划，以及参与支付方工作流的服务方
        - 服务方优先的临床智能和协作层
        - 公开分发覆盖小于 Availity 或 Waystar
      - - Availity
        - 网络既有者 / 相邻同行
        - 最大双边网络；所审材料提到覆盖 95% 支付方和 3.4M 服务方
        - 健康险计划、服务方、HIT 伙伴
        - 分发、路由、FHIR 原生 API、可审计 AuthAI
        - 更偏路由 / 网络，而不是纯临床项目专家
      - - Waystar
        - 服务方工作流既有者
        - 30k 客户；>1M 服务方；7.5B 笔交易；约 60% 美国患者
        - 医院、医疗系统、服务方 RCM 团队
        - 深度嵌入服务方，且自动化成效可见
        - 公开证据更偏服务方 RCM，而非支付方临床编排
      - - MCG Health
        - 指南 / 内容既有者
        - 数千家医院；绝大多数健康险计划；第 30 版发布提到 3,200+ 家医院
        - 健康险计划、医院、机构、EHR 伙伴
        - 许可临床指南和 AI 加持内容
        - 服务方 UX 或网络分发能力证据较少
      - - eviCore
        - 委托 UM 既有者
        - 调查报道中承保人数超过 100M；多专科 UM 项目
        - 大型保险公司和委托使用管理工作流
        - 专科审核覆盖深，临床标准卡位牢
        - 拒付做法引发明显信任反弹
      - - Infinx
        - AI 工作流挑战者
        - 获 HITRUST i1 和 Gartner 2026 认可；公开融资和客户数细节仍薄
        - 医疗系统和服务方患者准入 / RCM 团队
        - 事前授权自动化嵌入更宽的患者准入栈
        - 公开上线规模证据不如大型既有者完整
      - - Myndshft / DrFirst
        - 医疗 + 药房挑战者
        - 整合平台说法称可触达 95% 参保患者
        - 服务方、专科药房、支付方、PBM、药企
        - 打通医疗和药房事前授权及用药工作流
        - 所审材料战略论述更强，独立部署规模证据较弱
      - - 手工门户 / 内部自建 / 嵌入式进入者
        - 现状替代方案，也可能是进入路径
        - 无公开软件价目表；主要成本在人力和工程
        - 计划和服务方使用既有工具或 API 主导的自建路径
        - 前期切换摩擦最低，并可搭载既有系统
        - 人力成本高、UX 碎片化，或政策 / 治理深度弱
    notes: 所选对象覆盖直接同行、分发既有者、指南既有者、AI 挑战者和替代路径。规模和融资单元格把当前公开指标与公开证据局限放在一起， 而不是假装每家私营竞品都有清晰公开画像。
