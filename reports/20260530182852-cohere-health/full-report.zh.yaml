      - number: '7.3'
        title: 客户集中度和依赖风险披露仍不足
        blocks:
          - type: paragraph
            body: >-
              依赖和集中度风险仍然重要，因为公开客户故事强但窄。Humana 是最清晰的锚定账户，Geisinger 给出新的运营证明，WISeR 提供当前政府参考。这足以验证产品相关性，但不足以排除集中度。Cohere
              自己的增长材料强调交易、提供方和处理请求，却仍不披露按客户划分的收入、续约集中度或按模块划分的附加率。投资人因此能看到部署深度，却看不到经济多元化；这很关键，因为单一参考账户受挫，很可能同时打击收入信心和未来销售可信度。


              合作伙伴面进一步放大风险。Cohere 依赖 FHIR 标准、支付方配置、Availity 和 NaviNet 等提供方工作流伙伴，以及 MCG
              这样的外部准则伙伴。与此同时，竞争场没有停下：Availity、Myndshft、Waystar、EviCore
              以及其他既有玩家或相邻供应商，都在向类似买方问题销售自动化、网络覆盖或基于证据的决策能力。改革可能带来更多预算，但也降低了竞争对手把自己定位成符合 CMS
              要求的替代方案的门槛。外包利用管理供应商受到的品类审视，也可能外溢到 Cohere，即便它的底层商业模式更偏提供方友好，或临床治理更强。
