      - number: '3.2'
        title: 能力、定价、GTM 与信任对比
        blocks:
          - type: paragraph
            body: >-
              Cohere 最清晰的公开差异化，是它围绕医疗服务方优先的临床智能叙事：实时批准、更少申诉，并明确表示设计时同时考虑支付方和服务方工作流。Availity
              的对比点不同。它强调规模、路由覆盖，以及在庞大既有网络中可审计且符合政策的 AI；当支付方希望改造预授权、又不想引入新的狭义工作流厂商时，这尤其危险。Waystar
              同样强势，但切入口在服务方侧：它的公开证据点是授权发起时间、自动批准率，以及替代人工收入周期工作。MCG 和 eviCore 在技术栈中嵌得更深，因为它们绑定临床内容库和利用审核流程，比门户或前端 UI
              更难拆掉。几乎所有选项的定价都不透明，因此帮助不大。主要公开例外是关于 Waystar
              的第三方评价语境，但即便在那里，可用基准仍是“定制报价加企业级打包”，而不是能直接用于决策的公开价目表。因此，买方更可能比较实施杠杆、工作流适配度和信任姿态，而不是名义标价。
