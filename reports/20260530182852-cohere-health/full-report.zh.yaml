      - number: '1.4'
        title: 里程碑、市场验证与品类顺风
        blocks:
          - type: paragraph
            body: >-
              Cohere 近期里程碑同时显示产品扩展和外部验证。Humana 将合作从最初的肌骨试点，扩大到全国范围，随后又纳入更多诊断和睡眠服务；这给出了少见的具体证据，说明一家大型全国支付方在多年里持续扩大部署
              [CO023]。与 MCG 的合作把循证照护指南直接嵌入 Cohere 决策工作流，强化了公司的论点：它结合的是自动化和临床上可辩护的内容，而不是通用规则引擎 [CO024]。到 2025 年底，Cohere
              也开始把支付准确性作为第二个平台楔子来营销，并称收购 ZignaAI 是为了打通医疗利用管理和支付 [CO033]。外部认可支持牵引力，但不能误当作承销证据。TIME 将 Cohere 列入其顶级
              HealthTech 榜单，Deloitte 将其排在 2025 Fast 500 第 218 位，公司支持的报道称它进入 2025 Inc. 5000，并在 2024 年新增 9 个健康险计划合作
              [CO025][CO026][CO027][CO037]。监管时点也是顺风：CMS 的 2026 年预授权期限，让数字化、支持 FHIR、响应更快的工作流对健康险计划更有价值 [CO030]。同时，AMA 和
              AJMC 来源也凸显该品类的关键反向叙事：只要预授权 AI 看起来会增加拒付或削弱临床判断，它就会受到审查 [CO029]。因此，Cohere 承诺其 AI
              不用于拒绝照护，不只是传播口径，而是这个品类必要的战略防线 [CO031]。
