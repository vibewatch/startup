  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险是严重性最高的风险桶
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险是严重性最高的风险桶，因为 Cohere 短期受益于 CMS 和 AHIP 改革，同一轮改革也把预授权从不透明的供应商利基变成公开、可衡量、可审计的工作流。CMS-0057-F
              已经推动受影响支付方向 FHIR APIs、拒批理由、72 小时和 7 天服务水平、公开指标靠拢。Cohere 正通过 Cohere Connect 和更广的 Unify
              堆栈切入这项强制要求，需求因此受支撑，但执行余地变小：客户能更直接地对标合规性、及时性和拒批行为，相邻的 CMS 规则制定也在继续移动靶心。州级 AI 法、联邦政策活动和 Medicare Advantage
              改革压力又叠加一层法律波动，因为门槛不再只是自动化质量，而是可解释性、人工监督，以及为每一条判定路径辩护的能力。


              WISeR 让这种暴露更尖锐。Cohere 在 Texas 不只是软件卖方；它是具名的 CMS 模型参与方，参与一个政治敏感试点。KFF 称，该试点已经引发对拒批激励、提供方负担和未来扩张的担忧。CMS
              称人工临床医生二次意见和审计是防护栏，但这本身意味着，一旦出现反向发现，就可能演变成公众信任事件。OIG 关于 Medicare Advantage
              拒批的证据说明了为什么环境如此严苛：一旦预授权被框定为延迟治疗或不当拒绝护理，法律、监管和商业风险会迅速相互强化。
