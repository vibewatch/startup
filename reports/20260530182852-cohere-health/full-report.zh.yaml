chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与平台边界
        blocks:
          - type: paragraph
            body: >-
              Cohere Health 把自己定位为临床智能公司，核心目标是让预授权成为患者、医生和健康险计划的助力，而不是障碍
              [CO001]。这个表述很关键，因为公司卖的不是狭义工作流自动化工具；它明确在推一个支付方与医疗服务方共用的决策运营层，从预授权开始，延伸到申诉、支付准确性和相邻运营环节
              [CO002][CO038]。核心产品品牌是 Cohere Unify。公司称，该平台承载医疗利用管理、支付准确性和未来工作流，共用临床 AI、决策引擎和集成能力
              [CO002]。公开数据库和公司材料都显示，Cohere 于 2019 年启动，运营中心位于 Greater Boston 市场 [CO004][CO008]。Built In 还显示公司在 Hyderabad
              设有办公室，并拥有分布式美国员工队伍，进一步说明 Cohere 正按软件平台而非区域服务商的方式扩张 [CO008][CO009][CO036]。现阶段仍缺的是财务透明度：运营模型明显接近企业级
              SaaS，但公开可得来源没有提供经审计收入、ARR，或可独立核验的当前估值 [CO039]。
