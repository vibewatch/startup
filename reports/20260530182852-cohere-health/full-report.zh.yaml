        - 除非替代管线和集中度数据能抵消损失，否则视为投资逻辑破裂
      - - 安全 / 隐私事件
        - 事件披露、客户通知、审计失败、HITRUST 失效
        - 重大 PHI 事件、事件响应薄弱，或再认证失败
        - 把尽调重置为安全优先，继续推进前要求整改证据
      - - 竞争性定价压力
