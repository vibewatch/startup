        - Cohere 失去得州项目角色、拒付激励被限制，或模式暂停
        - 砍掉新的公开验证点，并抬高商业化风险
        - 重新测算增长，并下调估值倍数区间
      - - 标杆客户不续约或扩张停滞
        - 类似 Humana 或 Geisinger 的客户停止扩张或退出
        - 损害先落地再扩张逻辑和销售可信度
        - 在集中度数据改善前，切到悲观情景
      - - 下一轮融资低于基准情景区间
        - 新一轮估值显著低于 ~$360M-$780M 区间
        - 显示现有投资人不支持当前逻辑
        - 除非条款异常防守，否则视为逻辑破裂
      - - 出现拒付治理失效证据
        - 申诉、审计或公开调查显示有害拒付行为
        - 把监管审查转成声誉和商业损害
        - 暂停投资，重新评估治理护城河
      - - 下一轮流程前仍无可信经济性披露
        - 到下一次融资时，收入、利润率、留存或股权结构仍不透明
        - 让价格完全由叙事驱动
        - 数据质量改善前拒绝
    notes: 这些触发器刻意选择可观察项，目的是在叙事动能跑过尽调事实前叫停投资逻辑。
    claimRefs:
      - CV010
      - CV011
      - CV026
      - CV027
      - CV043
  - id: TV008
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR 与分模块收入
        - 当前收入运行率、已签约 ARR，以及 UM、支付完整性、政策和理赔智能的收入结构
        - 没有这些，情景区间只是占位符
        - CFO 材料包、董事会材料和客户队列桥接表
      - - 毛利率与服务强度
        - 按模块毛利率，以及交付中仍需临床医生或编码人力的比例
        - 决定 Cohere 应拿 Waystar 式还是 Evolent 式倍数
        - FP&A 复核，以及实施与服务人员配置模型
      - - 留存与集中度
        - 总留存率（GRR）、净留存率（NRR）、前十大客户占比和续约日程
        - 在这个价格阶段，客户质量比客户名单数量更重要
        - 客户成功仪表盘和收入队列表
      - - 股权结构表与优先权瀑布
        - 股份类别、清算优先权、参与权、转换计算和期权池
        - 优先权悬置可能吃掉大部分账面上行空间
        - 法务股权结构表导出和融资文件
      - - 现金跑道与义务
        - 现金余额、烧钱速度、债务、契约条款和招聘计划
        - 决定下一轮融资紧迫性和谈判筹码
        - 资金计划表和董事会批准预算
      - - WISeR 经济性与治理
        - 合同经济性、共享节省条款、申诉、推翻率和审计权
        - 区分顺风和声誉陷阱
        - 项目合同、合规复核和临床治理日志
    notes: 多数未决事项关乎经济性和结构，而不是 Cohere 是否真有产品。因此建议仍是「继续研究」，而不是「回避」。
    claimRefs:
      - CV025
      - CV027
      - CV041
      - CV042
      - CV043
