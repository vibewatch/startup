      - number: '6.4'
        title: 扩张、集中度与采购风险
        blocks:
          - type: paragraph
            body: >-
              上行情景很直接：Cohere 最好的公开客户故事支撑模块化的先落地再扩张路径。Humana 从 12
              州试点走到全国多专科铺开，正是企业级健康科技投资人想看到的轨迹；平台叙事也试图把这个模式从预授权复制到支付完整性、政策管理和更广的临床智能工作流。CMS-0057-F 和 WISeR
              又提高了支付方买家现代化的紧迫性，可能让 Cohere 的互操作性和工作流叙事更贴近正在发生的采购。


              风险在于，公开证据集中且披露不足。具名账户主要是 Humana、Geisinger 和 Texas WISeR
              项目。更宽的汇总说法——数百万次提交、数百万会员、十个新交易——说明已有规模，但没有说明哪些账户在经济上占主导、任一客户绑定多少收入，或新模块是在扩张既有合同，还是只增加实施工作量。整个品类的采购摩擦仍然明显：提供方仍报告不确定、延迟、依赖电话或传真，也担心治理薄弱时
              AI 会增加拒批。尽调上，这意味着 Cohere 的客户故事在参考质量和工作流深度上有吸引力，但集中度、续约质量和扩张的具体经济性仍未解开。
