      - number: '5.2'
        title: 架构、部署与集成模型
        blocks:
          - type: paragraph
            body: >-
              Cohere 的公开架构故事比营销标题更具体。公司称 Unify 提供共享临床 AI、决策引擎和 EHR 集成；技术页面则称技术栈使用 CRD、DTR 和 PAS API，并与 HL7 Da Vinci
              实施指南对齐。同一批公开材料称，平台可以把端点集中成一个服务方提交的统一入口，并能叠在既有计划系统之上，而不是要求全面推倒重来。实践中，这意味着 Cohere
              试图拥有编排、政策数字化和工作流智能，同时保留核心记录系统 [CE002][CE010][CE012][CE015][CE017][CE033][CE044]。


              运营模型也不是纯软件。Cohere 公开技术栈描述点名 AWS、CloudFront、WAF、VPC、负载均衡、Fargate 和 ECS；一个前置部署工程岗位又补上一层具体实施能力，包括 AWS
              集成服务、FHIR 和 X12 等标准，以及 OAuth2、OIDC、SAML、JWT 和 mTLS 等身份模式。这一点很重要，因为它说明真实产品负担是集成很重的企业交付，而不只是模型推理
              [CE020][CE039][CE040]。同一批来源也清楚显示，人类临床和编码工作仍嵌在运营模型中：支付准确性依赖报销专家，非例行预授权案例仍交给临床人员，服务方上线则依赖门户管理、网络研讨会、Learning
              Center 内容和运营手册 [CE005][CE023][CE030][CE043]。
