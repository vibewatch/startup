  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor / option
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - Cohere Health
        - Direct payer-workflow peer
        - 47M annual payer-provider interactions; up to 85% real-time approvals; 94% provider satisfaction
        - Health plans plus providers participating in payer workflows
        - Provider-first clinical intelligence and collaboration layer
        - Smaller public distribution footprint than Availity or Waystar
      - - Availity
        - Network incumbent / adjacent peer
        - Largest dual-sided network; 95% of payers and 3.4M providers cited in reviewed pack
        - Health plans, providers, HIT partners
        - Distribution, routing, FHIR-native APIs, auditable AuthAI
        - More routing/network oriented than a pure clinical-program specialist
      - - Waystar
        - Provider-workflow incumbent
        - 30k clients; >1M providers; 7.5B transactions; ~60% of U.S. patients
        - Hospitals, health systems, provider RCM teams
        - Deep provider embedment and visible automation outcomes
        - Public evidence skews toward provider RCM rather than payer clinical orchestration
      - - MCG Health
        - Guideline/content incumbent
        - Thousands of hospitals; vast majority of health plans; 3,200+ hospitals in 30th-edition release
        - Health plans, hospitals, agencies, EHR partners
        - Licensed clinical guidance and AI-enabled content
        - Less evidence of provider UX or network distribution strength
      - - eviCore
        - Delegated UM incumbent
        - More than 100M covered lives in investigative reporting; multi-specialty UM programs
        - Large insurers and delegated utilization-management workflows
        - Deep specialty review coverage and entrenchment in clinical criteria
        - Meaningful trust backlash around denial practices
      - - Infinx
        - AI workflow challenger
        - HITRUST i1 and Gartner 2026 recognition; detailed public funding and customer count still thin
        - Health systems and provider patient-access / RCM teams
        - PA automation embedded in broader patient-access stack
        - Public live scale evidence is less complete than for large incumbents
      - - Myndshft / DrFirst
        - Medical-plus-pharmacy challenger
        - Combined platform pitch says access to 95% of insured patients
        - Providers, specialty pharmacy, payers, PBMs, manufacturers
        - Unifies medical and pharmacy PA and medication workflow
        - Reviewed pack is stronger on strategy than on deployed standalone scale
      - - Manual portals / internal build / embedded entrants
        - Status quo substitute plus likely entrant path
        - No public software rate card; labor and engineering cost dominate
        - Plans and providers using existing tools or API-led build paths
        - Lowest upfront switching friction and can piggyback on existing systems
        - High labor cost, fragmented UX, or weak policy/governance depth
    notes: >-
      Selected set covers direct peers, distribution incumbents, guideline incumbents, AI challengers, and substitute
