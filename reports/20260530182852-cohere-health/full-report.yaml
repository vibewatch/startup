      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Regulation is the cleanest growth driver because it creates deadline-driven spend rather than optional
              innovation budgets. CMS's 2026 operational requirements and 2027 API timelines, the AHIP/BCBSA 80%
              real-time commitment, and state reforms targeting AI governance and response times all favor configurable
              digital workflows over fax-based processes. ROI is the second driver: AMA burden data and CAQH savings
              data make it easy for payers and providers to see where labor and delay costs accumulate. AI adoption is
              the third driver because more plans and provider organizations are already using AI administratively,
              which lowers conceptual resistance to automation. The constraints are equally material. Legacy core
              systems, EHR integration complexity, privacy and security requirements, and provider change management all
              slow deployments. Trust is a distinct gating factor as well: OIG's inappropriate-denial findings and AMA's
              patient-harm evidence mean buyers need auditable workflows, clinician review, and transparent denial
              logic, not just faster automation. In other words, the category is growing, but vendors still need to earn
              permission to automate high-consequence decisions.
            claimRefs:
