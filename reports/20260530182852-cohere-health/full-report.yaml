  - id: FU004
    title: Customer durability and friction KPI strip
    type: kpi
    layout: standard
    summary: >-
      Headline customer metrics skew positive on workflow adoption, while category-level timing and burden metrics show
      why diligence on durability still matters.
    data:
      items:
        - label: Humana reach
          value: '>5.1M'
          detail: Members across all 50 states in the public case study.
        - label: Annual PA volume
          value: 5.5M
          detail: Company-reported prior authorizations processed annually.
        - label: Provider satisfaction
          value: 94%
          detail: Company aggregate satisfaction figure cited in 2026 growth materials.
        - label: Current SLA attainment
          value: 12% / 7%
          detail: Clinicians / administrators consistently receiving decisions within 2026-rule timelines.
    claimRefs:
      - CU015
      - CU016
      - CU036
      - CU041
      - CU042
      - CU049
    approximationNotes: >-
      This KPI strip combines company-scale metrics with market-friction survey metrics to show why strong adoption
      claims do not yet equal disclosed retention quality.
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Regulatory and customer-concentration risks carry the highest residual severity because they can simultaneously
      hit trust, revenue, and valuation.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: AI / utilization-review scrutiny
          values:
            - High
