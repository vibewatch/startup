      - number: '1.2'
        title: Leadership, founder ambiguity, and governance depth
        blocks:
          - type: paragraph
            body: >-
              Siva Namasivayam is the most consistently corroborated executive in the company narrative: official
              materials describe him as CEO and co-founder and say he has held that position since 2019 [CO005].
              Governance visibility improved in 2026 when Cohere announced the addition of Dr. Mark Leenay to the board,
              explicitly highlighting the need for deeper health-plan operating expertise as the business scales
              clinical AI partnerships [CO012]. Cohere's own company-journey content also references Dr. Gary Gottlieb
              as board chair or executive chair, signaling a governance structure with recognized healthcare leadership
              rather than a founder-only board [CO013]. The main unresolved issue is the founder roster. Crunchbase
              lists Duncan Reece and Siva Namasivayam as founders, while Tracxn instead points to Clay Williams and
              Duncan Reece as former co-founders [CO006][CO007]. That conflict does not undermine the company mission or
              current CEO identity, but it does limit confidence in public biographies and founder-continuity analysis.
              The company also leans heavily on clinician-led AI oversight in its governance narrative, saying more than
              150 clinical experts monitor the models and that non-approved requests receive licensed-professional
              review [CO031][CO032]. That oversight claim is strategically important because category critics
              increasingly focus on whether AI in prior authorization is supervised or denial-oriented.
