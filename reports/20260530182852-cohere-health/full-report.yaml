        title: Exhibits
        blocks:
          - type: callout
            title: Regulation turns PA modernization into deadline-driven spend
            body: >-
              CMS deadlines, state reforms, and payer commitments mean this category is no longer just a discretionary
              workflow upgrade.
            calloutType: insight
