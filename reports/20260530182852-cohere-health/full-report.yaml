  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call flows from real workflow proof through missing price support and regulatory risk into a research-more
      recommendation.
    data:
      nodes:
        - label: Operating scale
          detail: '>12M requests and >600k providers create real market relevance.'
        - label: Customer proof
          detail: Humana and Geisinger show live deployment and expansion rather than pilot vapor.
        - label: Multi-module upside
          detail: Payment integrity, policy, and compliance tools widen the revenue opportunity.
        - label: Missing price and structure
          detail: No retained public source discloses current valuation, share terms, or preference stack.
        - label: Regulatory scrutiny
          detail: WISeR and eviCore show that denials and governance can compress value fast.
        - label: Research-more
          detail: Wait for disclosure or a clear discount to the base-case range.
      edges:
        - from: Operating scale
          to: Customer proof
        - from: Customer proof
          to: Multi-module upside
        - from: Multi-module upside
          to: Research-more
        - from: Missing price and structure
          to: Research-more
        - from: Regulatory scrutiny
          to: Research-more
    approximationNotes: >-
      This is a logic chain rather than a process map. It summarizes why company quality alone is insufficient without
      price and structure.
    claimRefs:
      - CV005
      - CV007
      - CV023
      - CV026
      - CV038
      - CV044
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Implied enterprise value at selected revenue multiples applied to a $110 million base-case revenue midpoint.
    data:
      items:
        - label: Service-heavy floor (0.25x)
          value: 28
          unit: $M EV
        - label: Challenged health-tech (0.40x)
          value: 44
          unit: $M EV
        - label: Waystar-like public workflow (3.5x)
          value: 385
          unit: $M EV
        - label: Base underwriting anchor (4.5x)
          value: 495
          unit: $M EV
        - label: High-quality workflow (6.0x)
          value: 660
          unit: $M EV
        - label: Aggressive AI premium (8.0x)
          value: 880
          unit: $M EV
    approximationNotes: >-
      Uses the midpoint of the base-case revenue assumption, not disclosed current revenue. The point is sensitivity,
      not a claim that Cohere already generates $110M of revenue.
    claimRefs:
      - CV015
      - CV017
      - CV019
      - CV021
      - CV030
      - CV031
      - CV032
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Bear, base, and bull valuation bands implied by scenario assumptions anchored in public comp ranges and
      market-size evidence.
    data:
      items:
        - label: Bear
          low: 110
          mid: 195
          high: 280
          unit: $M EV
        - label: Base
          low: 360
          mid: 570
          high: 780
          unit: $M EV
        - label: Bull
          low: 900
          mid: 1250
          high: 1600
          unit: $M EV
    approximationNotes: >-
      Bands are scenario outputs rather than direct marks. Midpoints are simple center points for display and are not
      separate disclosed estimates.
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV037
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Compact investment view of the main factors that help or hurt Cohere's underwritten value today.
    data:
      items:
        - label: Market tailwind
          value: Medium-High
          detail: Regulatory and workflow pain remain real, and the category is still digitizing.
        - label: Product / workflow proof
          value: High
          detail: Scale, automation, and named customer proof are stronger than for many private peers.
        - label: Customer durability visibility
          value: Medium-Low
          detail: Reference accounts are good, but retention and concentration data are still missing.
        - label: Economics visibility
          value: Low
          detail: No public revenue, margin, NRR, or cash runway disclosure in the retained pack.
        - label: Regulatory risk
          value: High
          detail: WISeR and denial-governance scrutiny can change valuation quickly.
        - label: Price support
          value: Unknown
          detail: Current valuation is undisclosed, so the public pack cannot prove the mark is fair.
    approximationNotes: This KPI strip is qualitative and intentionally separates company strength from price support.
    claimRefs:
      - CV006
      - CV010
      - CV025
      - CV026
      - CV039
      - CV040
      - CV044
