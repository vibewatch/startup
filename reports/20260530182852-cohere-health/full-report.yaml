      - number: '1.3'
        title: Capital formation and visible operating scale
        blocks:
          - type: paragraph
            body: >-
              Cohere's financing history shows a clear progression from early specialist healthcare venture support to
              larger growth capital. The company raised a $36 million Series B in April 2021 led by Polaris Partners,
              with Longitude Capital, Deerfield, Flare Capital, and Define Ventures participating [CO010]. In May 2025
              it announced a $90 million Series C led by Temasek, with existing investors Deerfield, Define, Flare,
              Longitude, and Polaris continuing support, bringing total disclosed funding to $200 million [CO011]. That
              syndicate matters because it combines sector-focused health investors with a large global institution,
              suggesting that Cohere had moved from category formation into scale financing. Publicly visible operating
              metrics are stronger than public financial metrics. Cohere repeatedly says it processes more than 12
              million prior authorization requests annually, supports at least 600,000 providers, and can auto-approve
              up to 90% of requests [CO014][CO015][CO017]. Later 2025 releases update the provider figure to over
              660,000 and cite 94% provider satisfaction plus up to 8x ROI, implying a platform that already has
              production-level adoption across major payer workflows [CO016][CO021][CO022]. The caveat is that headcount
              and revenue remain estimated rather than audited: directories point to roughly 900 to 930 employees, while
              no public source we fetched disclosed revenue or ARR [CO034][CO035][CO039].
