      - number: '8.4'
        title: Bull, base, bear scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Because current revenue is undisclosed, the valuation work has to be scenario-based rather than falsely
              precise. The base case assumes Cohere converts visible operating scale into roughly $90 million to $130
              million of revenue by 2027, which would be consistent with a meaningful share of the prior-authorization
              workflow market plus some success in adjacent modules like payment integrity, policy management, and
              claims intelligence. Applying a 4x to 6x multiple to that revenue range gives a base valuation band of
              roughly $360 million to $780 million. That is not a certainty claim; it is the least-aggressive
              underwriting case that still credits the company for real scale and workflow relevance.


              The bull case assumes the modular expansion story lands more like higher-quality workflow software. In
              that world, Cohere proves that payment integrity, compliance tooling, and claims-intelligence products are
              not just services wrappers but durable recurring software revenue. If revenue reaches roughly $150 million
              to $200 million and the business earns a 6x to 8x multiple, valuation moves into a roughly $900 million to
              $1.60 billion range. The bear case assumes the opposite: regulatory scrutiny, concentration, or services
              intensity pull the company toward challenged health-tech comps. At roughly $45 million to $70 million of
              revenue and a 2.5x to 4.0x multiple, valuation falls into a roughly $110 million to $280 million band.


              Entry discipline follows directly from those ranges. Above about $900 million of enterprise value
              equivalent, public evidence gives too little upside unless Cohere can prove Abridge-like AI premium
              economics or Waystar-like disclosure quality. Around $450 million to $550 million, base-to-bull returns
              become supportable over a four-to-five-year hold. Between those points, the company may still be
              attractive strategically, but the price is doing too much of the work.
