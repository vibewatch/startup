  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product scope
        blocks:
          - type: paragraph
            body: >-
              Cohere Health’s product is best understood as a payer-provider operating workflow rather than as a narrow
              authorization form filler. On the payer side, Cohere sells a clinical-intelligence layer that can run
              prior authorization, utilization-management review, payment integrity, policy management, and
              appeals-adjacent decisioning on one underlying platform. On the provider side, the workflow starts either
              in the Cohere portal or through an EMR-embedded API path, then moves through policy checks, documentation
              prompts, authorization review, and status tracking. That framing matters because Cohere is not simply
              claiming better digitization; it is claiming that the same clinical intelligence should carry from
              pre-care authorization into post-care payment accuracy and related workflows [CE001][CE002][CE012][CE042].


              The product map that is actually supportable in public evidence is broader than prior authorization alone.
              Official surfaces name the Unify platform, the core in-house UM workflow modules, specialty packages, the
              standalone Cohere Connect API layer, and the payment-integrity suite led by Validate, Match, and Complete.
              Public 2025 materials also add acute inpatient review and policy-management modules, which suggests Cohere
              is expanding horizontally across adjacent payer operations rather than just deepening one point tool
              [CE008][CE009][CE011][CE025][CE026][CE027][CE028]. The strongest deployment proof is that Humana publicly
              describes expansion to more than 5.1 million members across all 50 states, while Cohere’s own materials
              and a public job post both point to annual request volumes above 12 million [CE032][CE041].
