  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The riskiest pathways are the ones that move from audit, integration, or concentration shocks into customer trust
      and then into revenue and valuation.
    data:
      nodes:
        - id: ai
          label: AI scrutiny
          description: Bias, opacity, or insufficient human review in authorization decisions.
        - id: wiser
          label: WISeR event
          description: Audit finding, political backlash, or operational issue in the CMS pilot.
        - id: reform
          label: PA reform shift
          description: CMS, AHIP, or state reforms reduce friction and narrow some PA scope.
        - id: integration
          label: Integration failure
          description: Portal, EMR, API, or routing issues across payer-provider workflows.
        - id: security
          label: Security incident
          description: PHI compromise or material control failure.
        - id: concentration
          label: Anchor-customer loss
          description: Large payer contraction or public-reference degradation.
        - id: competition
          label: Competition
          description: CMS-ready rivals compress pricing or win rates.
        - id: trust
          label: Customer trust
          description: Confidence that the platform is fair, compliant, and reliable.
        - id: revenue
          label: Revenue quality
          description: Retention, expansion, and new-logo durability.
        - id: margin
          label: Margin
          description: Implementation cost, clinical-review cost, and remediation burden.
        - id: valuation
          label: Valuation
          description: Multiple support and downside protection.
        - id: financing
          label: Financing options
          description: Ability to raise capital on strong terms if needed.
      edges:
        - from: ai
          to: trust
        - from: wiser
          to: trust
        - from: integration
          to: trust
        - from: security
          to: trust
        - from: concentration
          to: revenue
        - from: competition
          to: revenue
        - from: competition
          to: margin
        - from: reform
          to: revenue
        - from: reform
          to: competition
        - from: trust
          to: revenue
        - from: security
          to: margin
        - from: integration
          to: margin
        - from: revenue
          to: valuation
        - from: margin
          to: valuation
        - from: valuation
          to: financing
    claimRefs:
      - CR017
      - CR021
      - CR024
      - CR025
      - CR029
      - CR036
      - CR041
      - CR043
      - CR045
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Cohere sits at the center of a dependency web spanning anchor customers, CMS programs, interoperability rails,
      cloud controls, and third-party criteria.
    data:
      nodes:
        - id: cohere
          label: Cohere Health
          description: Clinical-intelligence workflow platform spanning UM, PI, and compliance tooling.
        - id: humana
          label: Humana / large payers
          description: Anchor references, payer workflows, and renewal risk.
        - id: geisinger
          label: Geisinger
          description: Fresh operational proof and provider-workflow referenceability.
        - id: cms
          label: CMS / WISeR
          description: Government referenceability plus audit and political sensitivity.
        - id: interop
