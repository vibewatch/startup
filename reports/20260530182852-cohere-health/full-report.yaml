            body: >-
              People, execution, and capital risk are the swing factors for the investment case. Cohere is scaling
              go-to-market, engineering, and product breadth simultaneously: a new chief revenue officer, a Hyderabad
              capability centre, expanded payment-integrity offerings, compliance tooling, and CMS model work all point
              to a company stretching beyond a single prior-authorization product. The upside is category leadership
              with more than one growth vector. The downside is prioritization drift, implementation strain, and
              inconsistent customer outcomes across modules, geographies, or customer cohorts if delivery maturity lags
