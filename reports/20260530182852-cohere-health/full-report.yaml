  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and platform scope
        blocks:
          - type: paragraph
            body: >-
              Cohere Health positions itself as a clinical intelligence company whose core purpose is to make prior
              authorization an ally rather than an obstacle for patients, physicians, and health plans [CO001]. That
              framing matters because the company is not selling a narrow workflow automation tool; it is explicitly
              pitching a shared operating layer for payer-provider decision-making that starts with prior authorization
              and extends into appeals, payment accuracy, and adjacent operational moments [CO002][CO038]. The central
              product brand is Cohere Unify, which the company describes as the common platform underneath utilization
              management, payment integrity, and future workflows, with shared clinical AI, decision engines, and
              integrations [CO002]. Public databases and company materials consistently place Cohere's launch in 2019
              and its operating center in the Greater Boston market [CO004][CO008]. Built In adds that the company also
              has a Hyderabad office and a distributed U.S. workforce, reinforcing that Cohere is scaling like a
              software platform rather than a regional services vendor [CO008][CO009][CO036]. What remains missing at
              this stage is financial transparency: the operating model is clearly enterprise SaaS-like, but publicly
              accessible sources do not provide audited revenue, ARR, or an independently verifiable current valuation
              [CO039].
