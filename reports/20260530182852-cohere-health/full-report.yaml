  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Cohere's relevant market is narrower than generic “healthcare AI” or even generic revenue-cycle
              automation. The regulated core is medical prior authorization and adjacent utilization-management
              workflows where payers must evaluate medical-necessity requests, collect supporting documentation,
              communicate decisions, and increasingly expose those workflows through FHIR APIs. The most important
              included spend is software and workflow services that reduce friction between payers and providers for
              medical services such as imaging, procedures, post-acute care, and other utilization-managed items. The
              most important excluded spend is pharmacy-only prior authorization, because CMS' 2024 final rule
              explicitly excludes drugs and the 2026 drugs proposal treats pharmacy authorization as a separate
              extension path rather than the current baseline. Broader claims processing, generalized revenue-cycle
              tools, and care-management platforms matter as adjacencies, but they overstate the opportunity if counted
              as core TAM. The dominant substitutes are still fax, phone, portal, and manual review workflows. That
              matters because a vendor like Cohere is not replacing “nothing”; it is displacing fragmented coordination
              labor on both the payer and provider sides.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM024
              - CM025
          - type: table
            tableRef: TM001
