    type: flow
    layout: wide
    summary: >-
      Humana, Geisinger, and WISeR together show a repeatable pattern from first proof point to live operations and
      adjacent-scope expansion.
    data:
      nodes:
        - id: entry
          label: Initial account entry
          description: Pilot or first workflow lands with a payer or public program.
        - id: specialty
          label: Specialty or scope win
          description: The buyer proves a pain point in one specialty, region, or program.
        - id: operations
          label: Live operating workflow
          description: Portal status, uploads, notifications, and support move into daily use.
        - id: expansion
          label: Adjacent workflow expansion
          description: Coverage extends to more services, states, or modules.
        - id: referenceability
          label: Named reference account
          description: The deployment becomes referenceable in case studies, plan updates, or CMS lists.
        - id: economics-gap
          label: Economics still undisclosed
          description: Public proof stops before renewal, churn, or top-customer revenue share.
      edges:
        - from: entry
          to: specialty
        - from: specialty
          to: operations
        - from: operations
          to: expansion
        - from: expansion
          to: referenceability
        - from: referenceability
          to: economics-gap
    claimRefs:
      - CU011
      - CU014
      - CU027
      - CU029
      - CU030
      - CU033
      - CU034
      - CU035
      - CU036
  - id: FU003
    title: Named customer proof quality matrix
    type: matrix
    layout: wide
    summary: >-
      The named-customer set is credible, but evidence quality varies: Humana is strongest on scale, Geisinger on fresh
      operations, and WISeR on referenceability rather than outcomes.
    data:
      columns:
        - Deployment maturity
        - Outcome specificity
        - Freshness
        - Renewal visibility
      rows:
