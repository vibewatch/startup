      - number: '2.5'
        title: Contradictions and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Two diligence cautions should survive into later chapters. First, public category estimates are too
              inconsistent to use as a standalone valuation input. Depending on the source, the category looks like a
              sub-$1 billion workflow niche, a $2-3 billion prior-authorization software market, or an $11 billion-plus
              utilization-management software platform market. Those can all be “true” within their own definitions, but
              they should not be blended without adjustment. Second, Cohere's company-specific SOM is not supportable
              from public data alone. Public sources do not disclose pricing, per-request fees, average contract value,
              or revenue split across Medicare Advantage, commercial, and Medicaid books, so a bottom-up share-of-wallet
              model would be invented rather than diligenced. The practical answer is to carry a boundary-disciplined
              SAM proxy, keep contradictory vendor-market estimates visible, and ask directly for pricing, customer mix,
              live plan count, and request volume by line of business before converting market analysis into valuation
              math.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM041
              - CM045
