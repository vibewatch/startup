        title: 'Cost structure, margin path, and capital intensity: software upside moderated by clinical-service load'
        blocks:
          - type: paragraph
            body: >-
              The public evidence suggests Cohere should not be modeled as a pure seat-based software vendor. Its own
              homepage and payment-integrity materials explicitly include delegated utilization management,
              same-specialty physician review, clinical and coding validation, medical-record workflows, appeals
              support, and U.S.-based operations for compliance-sensitive plans. Those features may improve product
              credibility and support higher contract value, but they also imply a service-delivery cost base that will
              weigh on gross margin relative to pure workflow software. The best public filing proxy in the retained
              pack is Waystar, which shows how a scaled healthcare workflow vendor mixes subscription and volume-based
              revenue, recognizes implementation fees over the contract term, carries mid-to-high gross margins, and
              still spends meaningfully on sales, implementation support, and software investment. For Cohere, the
              likely path is similar in shape but with more clinical labor and regulatory overhead. Physical capex
              should remain light because Unify is cloud-based and no-hosting by design, yet compliance, policy
              digitization, integration work, and human review capacity are still real cost centers. Publicly, the
              margin story is therefore plausible but not yet decision-grade.
