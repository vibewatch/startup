      - number: '6.4'
        title: Expansion, concentration, and procurement risks
        blocks:
          - type: paragraph
            body: >-
              The upside case is straightforward: Cohere’s best public customer stories support a modular
              land-and-expand motion. Humana’s sequence from 12-state pilot to nationwide multi-specialty rollout is
              exactly what enterprise health-tech investors want to see, and the platform narrative aims to repeat that
              pattern from prior authorization into payment integrity, policy management, and broader
              clinical-intelligence workflows. CMS-0057-F and WISeR further raise the urgency for payer buyers to
              modernize, which could make Cohere’s interoperability and workflow narrative more relevant in active
              procurement.


              The risk case is that public evidence is concentrated and disclosure-light. The named-account set is
              dominated by Humana, Geisinger, and the Texas WISeR program. Broader aggregate claims—millions of
              submissions, millions of members, ten new deals—suggest scale, but they do not show which accounts are
              economically dominant, how much revenue is tied to any one customer, or whether new modules are expanding
              existing contracts or merely adding implementation workload. Procurement friction also remains material
              across the category: providers still report uncertainty, delays, phone or fax dependency, and concern that
              AI can increase denials if governance is weak. For diligence, that means Cohere’s customer story is
              attractive on reference quality and workflow depth, but unresolved on concentration, renewal quality, and
