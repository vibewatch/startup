        title: Architecture, deployment, and integration model
        blocks:
          - type: paragraph
            body: >-
              Cohere’s public architecture story is more specific than its marketing headline. The company says Unify
              provides shared clinical AI, decision engines, and EHR integrations, while the technical pages say the
              stack uses CRD, DTR, and PAS APIs that align with HL7 Da Vinci implementation guides. The same public
              material says the platform can centralize endpoints into a single front door for provider submissions and
              can sit on top of existing plan systems instead of demanding full rip-and-replace. In practice that means
              Cohere is trying to own orchestration, policy digitization, and workflow intelligence while leaving core
              systems of record in place [CE002][CE010][CE012][CE015][CE017][CE033][CE044].


              The operating model is also not purely software-only. Cohere’s public stack description names AWS,
              CloudFront, WAF, VPCs, load balancing, Fargate, and ECS, while a forward-deployed engineering role adds a
              concrete implementation layer around AWS integration services, standards such as FHIR and X12, and
              identity patterns such as OAuth2, OIDC, SAML, JWT, and mTLS. That matters because it shows the real
              product burden is integration-heavy enterprise delivery, not just model inference [CE020][CE039][CE040].
              The same sources also make clear that human clinical and coding work remains embedded in the operating
              model: payment integrity relies on reimbursement experts, non-routine prior-auth cases still go to
              clinicians, and provider onboarding relies on portal administration, webinars, Learning Center content,
              and operational runbooks [CE005][CE023][CE030][CE043].
