  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buying center
        blocks:
          - type: paragraph
            body: >-
              Cohere Health’s public customer picture is payer-first, but it only makes sense when separated into buyer,
              user, payer, and beneficiary roles. The clear economic buyer is the health plan or payer-adjacent program
              owner: Cohere’s platform pages and growth releases are written to utilization-management, policy,
              payment-integrity, and regulatory-readiness leaders who want faster decisions, lower medical spend, and
              better provider relations. Providers are the daily users, interacting through portal, EHR-integrated,
              phone, or fax-supported workflows, while members and patients sit downstream as the group meant to
              experience fewer delays and less administrative friction. That role separation matters because Cohere is
              not proving a consumer health product; it is proving an enterprise workflow layer whose adoption depends
              on provider experience even though the budget sits with the payer.


              The supportable segmentation is also narrower than a broad “health plans everywhere” narrative. Publicly
              verifiable accounts are U.S.-centric and cluster around national or regional health plans plus a Medicare
              contractor program, not small practices, employers, or international markets. The strongest vertical
              evidence spans Commercial, Exchange, Medicare Advantage, Medicaid, and now Medicare fee-for-service
              oversight through WISeR. Public use-case breadth is wider than one prior-authorization niche: Humana’s
              timeline extends across multiple specialties, while Cohere’s platform story now ties prior authorization
              to payment integrity, policy management, and CMS-0057-F compliance. The observable channel also looks
              direct-to-payer rather than reseller-led, with provider portals and EHR-connected workflows functioning as
              deployment surfaces instead of standalone buying channels. That supports a land-and-expand sales motion,
              but public evidence still does not disclose pricing, customer-count tiers, or module attach rates by
              segment.
            claimRefs:
