  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is the highest-severity bucket
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk is the highest-severity bucket because Cohere wins near-term from CMS and AHIP
              reform while the same reforms convert prior authorization from an opaque vendor niche into a public,
              measurable, and auditable workflow. CMS-0057-F already forces affected payers toward FHIR APIs, denial
              rationales, 72-hour and seven-day service levels, and public metrics. Cohere is explicitly selling into
              that mandate through Cohere Connect and the broader Unify stack, which supports demand but reduces
              execution slack: customers can benchmark compliance, timeliness, and denial behavior more directly, and
              adjacent CMS rulemaking continues to move the target. State AI laws, federal policy activity, and Medicare
              Advantage reform pressure add another layer of legal volatility because the bar is no longer just
              automation quality; it is explainability, human oversight, and the ability to defend each determination
              path.


              WISeR sharpens that exposure. Cohere is not only a software seller in Texas; it is a named CMS model
              participant in a politically sensitive pilot that KFF says has already triggered concern about denial
              incentives, provider burden, and future expansion. CMS says human-clinician second opinions and audits are
              safeguards, but that itself means adverse findings could become public trust events. OIG evidence on
              Medicare Advantage denials shows why the environment is unforgiving: once prior authorization is framed as
              delayed or inappropriately denied care, legal, regulatory, and commercial risk reinforce each other
              quickly.
