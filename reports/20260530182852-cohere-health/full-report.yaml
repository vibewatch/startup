      - number: '8.3'
        title: 'Comparable valuation framework: public comps, private premiums, and strategic precedent'
        blocks:
          - type: paragraph
            body: >-
              The most useful valuation anchors for Cohere come from three reference classes: public healthcare workflow
              software, distressed or service-heavy health-tech, and adjacent private AI workflow premiums. Waystar is
              the cleanest public benchmark because it is profitable, workflow-heavy, and public enough to show what the
              IPO bar looks like. Waystar reported roughly $1.099 billion of FY2025 revenue, 42% adjusted EBITDA margin,
              112% NRR, and a late-May 2026 market cap near $3.81 billion, implying about 3.5x trailing revenue.
              Doximity sits at the high-quality end of healthcare workflow and network software, with $644.9 million of
              fiscal 2026 revenue and roughly $3.91 billion of market value, or about 6.1x revenue. At the other end,
              Health Catalyst and Evolent trade nearer 0.4x and 0.24x revenue respectively, showing what happens when
              growth, services intensity, or confidence deteriorate.


              Private comps reinforce both upside and caution. Sacra says Abridge hit roughly $100 million ARR, then
              raised at a $5.3 billion valuation in June 2025 after a $2.75 billion valuation just months earlier. That
              is the sort of premium private investors will pay for a healthcare AI workflow company when growth,
              category excitement, and software economics all line up. But Abridge is not a clean comparable: it is
              provider-workflow AI with different unit economics, and its quoted valuation is far above any public
              workflow multiple in the retained pack. The more relevant read-through is that adjacent AI entrants are
              moving into prior authorization via Availity and Highmark relationships, which raises the upside ceiling
              for the category while also increasing competitive pressure.


              Strategic precedent also matters. Express Scripts paid $3.6 billion for eviCore in 2017, proving that
              benefit-management and utilization assets can command real strategic value. Yet the 2026 scrutiny around
              eviCore also shows that the same category can lose narrative support when denials and governance dominate.
              For Cohere, the comparable lesson is clear: the comp band is wide, but the right anchor depends on how
              much of the business behaves like software versus services, and how much of the future is regulatory trust
              instead of mere workflow automation.
