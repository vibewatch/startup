      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public sizing is usable only when separated into distinct lenses. A volume lens shows that Medicare
              Advantage alone generated nearly 53 million prior-authorization requests in 2024, with 99% of enrollees
              subject to at least some prior authorization, which establishes that medical PA is operationally large
              even before commercial and Medicaid managed care are added. A value-at-stake lens shows why buyers invest:
              CAQH still sees a $21 billion automation opportunity across manual and partially manual healthcare
              transactions, and AMA survey data show the category burns provider time every week. A software-spend lens
              is much noisier. Recent public estimates range from $224 million for one utilization-management-software
              definition to $11.25 billion for another, while prior-authorization-software estimates cluster around
              roughly $2-3 billion globally. Those numbers are not directly comparable because they mix U.S. versus
              global scopes and pure PA versus broader UM definitions. For diligence purposes, the $613 million 2024
              U.S. utilization-management-solutions estimate is the closest public SAM proxy for Cohere's core workflow.
              It is still imperfect, but it is more decision-useful than quoting a broad multi-billion global TAM
              without boundary discipline.
