            body: >-
              Cohere's May 2025 Series C materially improved its forward financing position, and management says the
              round funded platform expansion, new use cases, and operational growth. That is enough to support a
              reasonable view that the company has capital to continue scaling through the next product cycle. It is not
              enough to underwrite adequacy. The retained public pack does not disclose cash on hand, debt, monthly
              burn, covenant structure, runway, or customer concentration. That omission matters more in this category
              than in a conventional SaaS screen because the market is entering a more compliance-intensive phase.
              CMS-0057-F and the industry's 2027 FHIR commitments raise delivery expectations, while AI scrutiny from
              OIG, KFF, ASCO, ProPublica, and legal commentary raises the cost of getting automation wrong. The
              financial verdict is therefore mixed. Revenue opportunity and account-expansion logic are credible; the
              margin path is plausible but likely below pure software; physical capital intensity looks low; and the
              real blocker is disclosure quality. Before underwriting, diligence needs contract-level revenue mix,
