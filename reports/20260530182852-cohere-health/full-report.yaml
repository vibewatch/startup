      - number: '1.5'
        title: What remains missing for later diligence chapters
        blocks:
          - type: paragraph
            body: >-
              Chapter one establishes that Cohere is real, scaled, and well-capitalized enough to merit deeper
              diligence, but it also shows that the company remains disclosure-light where investment decisions become
              most sensitive. The exact founder roster is not fully reconciled in public sources, the post-money
              valuation for the 2025 Series C is not supportable from the material we could fetch, and there is no
              public revenue or ARR figure to translate operational scale into software economics [CO006][CO007][CO039].
              Even the current employee count comes from private-company databases rather than management-certified
              reporting [CO034][CO035]. Those gaps do not invalidate the company overview. Instead, they sharpen the
              mandate for later chapters: test whether operational scale converts into durable customer outcomes,
              whether product breadth is real or mostly narrative, and whether valuation discipline is possible without
              a transparent pricing reference. Cohere's own public releases are strong on workflow impact, clinician
              oversight, and partnership expansion, but they remain promotional sources. The rest of the report
              therefore needs to separate what is independently corroborated from what still depends on company framing
              [CO029][CO039][CO040].
