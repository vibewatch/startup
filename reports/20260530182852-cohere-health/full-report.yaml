      - number: '3.2'
        title: Capability, pricing, GTM, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Cohere’s clearest public differentiation is its provider-first clinical-intelligence story: real-time
              approvals, fewer appeals, and explicit messaging that it is designed with both payer and provider
              workflows in mind. Availity’s comparison point is different. It emphasizes scale, routing coverage, and
              auditable policy-aligned AI across a huge existing network, which makes it especially dangerous where a
              payer wants to modernize prior authorization without introducing a new narrow workflow vendor. Waystar is
              similarly powerful, but from the provider side: its public proof points are about authorization initiation
              time, auto-approval rates, and replacing manual revenue-cycle work. MCG and eviCore sit even deeper in the
              stack because they are tied to clinical-content libraries and utilization-review processes, which can be
              harder to unwind than a portal or front-end UI. Pricing is unhelpfully opaque across almost all of these
              options. The main public exception is third-party review context for Waystar, but even there the live
              benchmark is still “custom quote plus enterprise packaging,” not a decision-ready public rate card. As a
              result, buyers are likely comparing implementation leverage, workflow fit, and trust posture more than
              nominal list price.
