companyProfile:
  summary: >-
    Cohere Health is a Boston-based clinical-intelligence company focused on helping health plans and risk-bearing
    providers modernize prior authorization and adjacent payer workflows. Its Cohere Unify platform combines clinical
    AI, rules engines, and provider-facing workflow tools across utilization management, payment integrity, policy, and
    related decisioning steps. Public evidence shows real operating scale and multiyear payer expansion, but the company
    remains financially opaque relative to public software comparables.
  foundedDate: '2019-01-01'
  founders:
    - name: Siva Namasivayam
      role: CEO and co-founder
      background: Healthcare analytics entrepreneur; previously founding partner at SCIO Health Analytics.
      claimRefs:
        - CO005
  foundingLocation: Boston, Massachusetts, USA
  headquarters: Boston, Massachusetts, USA
  productSummary: >-
    Cohere sells the Cohere Unify clinical-intelligence platform, which started in prior authorization and now extends
    to payment integrity, appeals, policy management, and other payer-provider decision workflows.
  customerFocus: >-
    Health plans and risk-bearing providers seeking to reduce prior-authorization burden and improve payer-provider
    collaboration.
  businessModel: >-
    Enterprise SaaS and workflow-platform contracts with health plans, with expanding module revenue opportunities in
    payment integrity, policy, and adjacent payer operations.
  stage: Series C
  fundingStatus: $200M total raised; $90M Series C announced in May 2025; public post-money valuation undisclosed.
