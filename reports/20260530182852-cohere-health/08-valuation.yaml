  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue-and-margin
    missingEvidence: Current ARR or revenue by module, current gross margin, and services mix.
    whyItMatters: Without these numbers the comp set cannot be matched confidently and scenario ranges stay assumption-heavy.
    diligencePath: Request current board deck, revenue bridge, and gross-margin rollforward by module.
    relatedQuestionRefs:
    - QV016
    - QV021
    - QV022
    relatedTableRefs:
    - TV005
    - TV008
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Full cap table, share classes, liquidation preferences, anti-dilution terms, and conversion math.
    whyItMatters: Preference overhang can absorb most of the upside even if the headline valuation looks attractive.
    diligencePath: Request legal cap-table export plus financing documents for all preferred rounds.
    relatedQuestionRefs:
    - QV017
    - QV025
    - QV030
    relatedTableRefs:
    - TV003
    - TV006
    - TV008
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Gross retention, NRR, logo churn, renewal calendar, and top-customer revenue concentration.
    whyItMatters: Valuation depends on whether Cohere's growth is durable recurring revenue or a narrow set of reference accounts.
    diligencePath: Review cohort data, customer concentration tables, and renewal memos.
