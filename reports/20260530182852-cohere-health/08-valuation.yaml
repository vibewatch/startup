- id: financing-context-and-public-price-support
  title: Financing context, valuation visibility, and preference overhang
  body: |-
    The financing facts are clear; the valuation facts are not. Cohere publicly announced a $90 million Series C on May 14, 2025 and said the round brought lifetime funding to $200 million, with Temasek joining continuing investors Deerfield, Define, Flare, Longitude, and Polaris. The stated use of proceeds was expansion of Cohere Unify, broader clinical use cases, and deeper AI investment. That is enough to conclude the company had real investor support at the time of the round and enough fresh capital to keep building through the current product cycle.

    It is not enough to support a price. None of the retained public sources in this chapter disclose post-money valuation, enterprise value, share count, or security terms for the Series C. That means public evidence cannot tell an investor whether the round was flat, up, or down relative to prior internal marks, nor whether new money received unusually strong preferences, ratchets, or anti-dilution protection. Because total funding now stands at $200 million across multiple preferred rounds, the prudent default is to assume a meaningful but undisclosed liquidation-preference stack until the data room proves otherwise.

    This is where entry discipline matters. A hidden price can still be acceptable if the business is so strong that multiple public methods converge on a wide upside range. Cohere is not there yet. The company has clear traction, but public evidence does not support a precise current mark. The practical conclusion is that the financing context is supportive, while the valuation context remains unresolved. New capital should demand either direct disclosure or a meaningful discount to a conservative scenario-based fair-value band.
