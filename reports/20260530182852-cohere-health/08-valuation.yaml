- id: TV008
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current ARR and revenue by module
    - Current run-rate revenue, booked ARR, and mix across UM, payment integrity, policy, and claims intelligence
    - Without this, scenario ranges are only placeholders
    - CFO pack, board materials, and customer cohort bridge
  - - Gross margin and services intensity
    - Gross margin by module and percent of delivery still requiring clinician or coding labor
    - Determines whether Cohere deserves Waystar-like or Evolent-like multiples
    - FP&A review plus implementation and services staffing model
  - - Retention and concentration
    - Gross retention, NRR, top-10 customer share, and renewal calendar
    - Customer quality matters more than logo count at this price stage
    - Customer success dashboard and revenue cohort tables
  - - Cap table and preference waterfall
    - Share classes, liquidation preferences, participating rights, conversion math, and option pool
    - Preference overhang can absorb most of the headline upside
    - Legal cap-table export and financing documents
  - - Cash runway and obligations
    - Cash balance, burn, debt, covenants, and hiring plan
    - Determines urgency of the next raise and negotiating leverage
    - Treasury schedule and board-approved budget
  - - WISeR economics and governance
    - Contract economics, shared-savings terms, appeals, overturns, and audit rights
    - Separates tailwind from reputational trap
    - Program contract, compliance review, and clinical governance logs
  notes: Most open items are about economics and structure, not whether Cohere has a real product. That is why the recommendation remains research-more instead of avoid.
