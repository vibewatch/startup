- id: exit-readiness-diligence-and-thesis-breaks
  title: Exit readiness, final diligence asks, and thesis-break triggers
  body: |-
    Cohere is not yet public-exit ready on the retained evidence pack. Waystar shows what public investors can see and price: revenue, margins, retention, large-customer counts, and explicit guidance. Cohere has not published the equivalent set. That does not mean the business is weak; it means the likely exit path today is strategic or late-stage private rather than IPO. A strategic buyer could be interested if Cohere proves that it owns a trusted clinical-intelligence layer rather than a narrow prior-authorization UI. The eviCore precedent shows category-scale value is possible. But the eviCore controversy also shows why buyers will now diligence denial governance, auditability, and provider trust more aggressively.

    The remaining diligence asks are therefore mostly structural and financial. Investors need module-level ARR or revenue, gross margin, NRR or gross retention, top-customer concentration, cash runway, debt terms, and the full preference waterfall. They also need WISeR-specific economics and governance: whether the program creates real revenue, what appeals and overturn data look like, and how much shared-savings exposure exists relative to any denial-incentive backlash.

    The thesis-break triggers are measurable. If WISeR is paused or materially narrowed around denial incentives, if a marquee customer stops expanding or renewing, or if the next financing lands below the base-case band, the premium thesis weakens quickly. Stated differently: Cohere still looks investable as a company, but only investable at the right price and with much better diligence than public evidence alone can supply.
