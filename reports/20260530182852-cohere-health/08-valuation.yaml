chapter:
  number: 8
  title: Valuation
  summary: Cohere Health has real operating scale, strong financing support, and a plausible path to become a category leader in prior-authorization workflow, but public evidence still does not reveal the latest round price, revenue, margin, or cap-table terms. Using public workflow comps, service-heavy health-tech comps, adjacent AI premiums, and scenario assumptions, a defendable public valuation range sits around $360 million to $780 million in the base case and $900 million to $1.60 billion in the bull case, so the call is research-more with high risk and an unknown current valuation stance until price and preference terms are disclosed.
sections:
- id: thesis-and-price-sensitive-recommendation
  title: Investment thesis, anti-thesis, and price-sensitive recommendation
  body: |-
    Cohere's positive thesis is straightforward. The company is visibly larger than an early pilot vendor: public materials show more than 12 million prior-authorization requests annually, more than 600,000 providers, a 5.1 million-member Humana footprint, and a January 2026 update claiming 94% provider satisfaction, 85% real-time authorization approvals, up to 8x payment ROI, and ten new deals in the prior year. Those signals matter because they connect market need, product proof, customer adoption, and expansion optionality. The adjacent-product story is also real. Cohere is no longer talking only about prior authorization; it is pitching payment integrity, policy management, and regulatory-readiness tooling, which is exactly the kind of multi-module expansion investors want if a workflow platform is going to outgrow a narrow utilization-management niche.

    The anti-thesis is just as important. Public evidence still does not disclose the current price, revenue, gross margin, net revenue retention, or preference stack. That means the strongest evidence supports company quality, not current entry value. The regulatory downside is also non-trivial. WISeR gives Cohere fresh relevance and referenceability, but multiple retained adverse sources say AI-assisted prior authorization can increase administrative burden, delay necessary care, and reward vendors through denial-linked shared savings. The 2026 eviCore scrutiny is a reminder that utilization-management assets can move from strategic premium to reputational discount quickly when denials and governance become the story.

    That combination leads to a price-sensitive recommendation of research-more rather than buy. Cohere may deserve a healthy workflow-software multiple if private diligence proves durable recurring revenue and software-like margins. Public evidence alone does not clear that bar. Until price, economics, and structure are disclosed, the right stance is to keep the company on the front foot commercially while refusing to underwrite a specific mark.
