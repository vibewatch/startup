- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: 'This set covers the most relevant retained public anchors for Cohere: profitable healthcare workflow software, challenged or service-heavy health-tech, adjacent private AI workflow premiums, and one major strategic utilization-management transaction. It is not a census of every payer, RCM, or care-management comp.'
  columns:
  - Comparable
  - Most recent revenue or ARR
  - Valuation mark / market cap
  - Implied multiple
  - Relevance
  - Limitation
  rows:
  - - Waystar
    - $1.099B FY2025 revenue
    - $3.81B market cap (May 2026)
    - ~3.5x revenue
    - Closest public proof that healthcare workflow software can command a healthy multiple with margins and NRR
    - More profitable and much more disclosed than Cohere
  - - Doximity
    - $644.9M FY2026 revenue
    - $3.91B market cap (May 2026)
    - ~6.1x revenue
    - High-quality digital workflow and network comp for premium software outcomes
    - Provider-network model is less services-heavy than Cohere
  - - Health Catalyst
    - $260M-$265M FY2026 guidance
    - ~$0.10B market cap (May 2026)
    - ~0.4x revenue
    - Shows downside multiple for challenged healthcare-tech execution
    - Different product stack and depressed sentiment
  - - Evolent
    - $1.89B trailing revenue
    - ~$444M market cap (May 2026)
    - ~0.24x revenue
    - Shows service-heavy payer platform floor when confidence compresses
    - Value-based-care exposure differs from prior-auth workflow
  - - Abridge
    - ~$100M ARR / $117M contracted ARR
    - $5.3B Series E valuation (Jun 2025)
    - ~45x-53x ARR
    - Illustrates how large AI workflow premiums can get in private markets
    - Provider AI scribe economics are not directly comparable
  - - eviCore / Express Scripts
    - 100M covered lives at acquisition
    - $3.6B acquisition value (2017)
    - N/A
    - Proves strategic buyers have paid real money for utilization-management scale
    - Historic deal and later controversy limit direct read-through
  notes: Public-comparable figures are approximate and mix equity-market marks with private and M&A reference points. They are anchors, not a single deterministic fair value.
