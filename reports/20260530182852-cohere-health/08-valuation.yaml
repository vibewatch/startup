- id: TV005
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation range
  - Probability signal
  - Key risks
  rows:
  - - Bull
    - Revenue reaches $150M-$200M by 2027; payment integrity and claims products monetize well; regulatory tailwinds hold; market pays 6x-8x
    - ~$900M-$1.60B
    - Low-to-medium
    - AI premium fades, regulatory scrutiny escalates, or adjacencies stay services-heavy
