- id: TV006
  title: Entry discipline and target return guardrails
  columns:
  - Entry zone
  - What it implies
  - Target return / hold
  - Action implication
  rows:
  - - "\u2264$450M EV equivalent"
    - Below or near the low end of the base-case range
    - 2.0x-2.5x over 4-5 years looks supportable
    - Lean in after diligence if structure is clean
  - - $450M-$550M EV equivalent
    - Within disciplined underwriting band
    - ~1.8x-2.2x over 4-5 years requires base-to-bull execution
    - Proceed only with strong retention and cap-table proof
  - - $550M-$900M EV equivalent
    - Most of the base case is already priced in
    - ~1.2x-1.8x unless bull case lands cleanly
    - Track or negotiate harder rather than buy
  - - '>$900M EV equivalent'
    - Requires private-AI premium economics or exceptional disclosure
    - Return profile compresses below the risk taken
    - Avoid new capital without major new evidence
  notes: Return guardrails are scenario-derived and assume a strategic sale or later-stage financing rather than an immediate IPO. They should be tightened further if the preference stack is heavy.
  claimRefs:
