  - CV037
  - CV041
  - CV045
- id: TV007
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - WISeR policy reversal or major redesign
    - Cohere loses Texas role, denial incentives are curtailed, or the model is paused
    - Cuts a fresh public proof point and raises commercialization risk
    - Re-underwrite growth and lower the multiple band
  - - Marquee customer non-renewal or stalled expansion
    - Humana-like or Geisinger-like reference stops expanding or exits
    - Damages land-and-expand thesis and sales credibility
    - Move to bear case until concentration data improves
  - - Next financing below base-case band
    - New round prices the company materially below ~$360M-$780M range
    - Signals existing investors do not support the current thesis
    - Treat as thesis break unless terms are unusually defensive
  - - Evidence of denial-governance failure
    - Appeals, audits, or public investigations show harmful denial behavior
    - Turns regulatory scrutiny into reputational and commercial damage
    - Pause investment and reassess governance moat
  - - No credible economics disclosure before next process
    - Still no revenue, margin, retention, or cap-table visibility at next fundraise
    - Keeps price entirely narrative-driven
    - Decline until data quality improves
  notes: These triggers are intentionally observable. They are designed to stop the investment case before narrative momentum outruns diligence reality.
