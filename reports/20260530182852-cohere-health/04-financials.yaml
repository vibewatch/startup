chapter:
  number: 4
  title: Financials
  summary: 'Cohere Health shows strong public operating scale and a credible multi-module revenue opportunity, but public evidence still stops well short of investment-grade financial disclosure. The chapter verdict is that revenue quality and capital adequacy remain only partially visible: the margin path is plausible, physical capital intensity looks low, and financing support appears real, yet realized pricing, revenue mix, cash burn, and runway are still diligence blockers.'
sections:
- id: revenue-model-and-public-traction
  title: 'Revenue model and public traction: strong operating proof, weak realized-revenue disclosure'
  body: 'Public evidence supports a multi-line revenue story, but not a disclosed income statement. Cohere clearly markets a platform for prior authorization and utilization management, yet the same official surfaces also position payment integrity, claims intelligence, appeals, and policy management as extensions on top of the same Unify base. That matters because it points to an account-expansion model rather than a one-module product sale. The company also says it can deploy as software, as a service, or through CMS-0057-F-compliant APIs, which broadens the potential contract structures but leaves realized pricing opaque. What is unusually strong is operating-scale proof: Cohere says it processes more than 12 million annual authorizations for more than 600,000 providers, while Humana-related materials show a progression from 5.5 million annual authorizations and 15 million touched members in 2024 to over 5.1 million Humana members across all 50 states in the case-study view. What remains
    missing is the crucial translation layer from activity to revenue: no public source in the retained pack discloses ARR, GAAP revenue, gross margin, or product revenue mix.'
  claimRefs:
