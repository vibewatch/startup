tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public value or status
  - Revenue-quality signal
  - Diligence ask
  rows:
  - - Prior authorization / UM platform
    - Enterprise platform sale to health plans for authorization and decision support
    - '>12M annual prior auths; >600k providers; up to 85% real-time approvals'
    - Core platform looks real and scaled, but realized contract value is undisclosed
    - Request customer-by-customer ARR, pricing unit, and implementation scope
  - - Delegated utilization management services
    - End-to-end delegated operations with same-specialty physician review
    - Officially offered as platform, service, or fully delegated operations
    - Raises contract value but likely lowers gross margin versus pure software
    - Request gross margin split between software and delegated operations
  - - CMS-0057-F / API interoperability
    - Compliance-oriented API access and single-front-door integrations
    - Cohere says APIs have been leveraged for 9M+ authorizations and support 4,000+ policies
    - Could support sticky recurring revenue, but pricing basis is undisclosed
    - Request API pricing, implementation fees, and pass-through hosting terms
  - - Payment integrity services
    - Pre-pay and post-pay audits, coding validation, and reconciliation
    - Officially marketed as end-to-end services with 8–9x ROI claims
    - Likely high-value upsell, but service intensity and contingency economics are unclear
    - Request PI revenue, fee structure, and contingency or savings-share terms
  - - Surface claims intelligence
    - Claims, contracts, benefits, and policy data mining for health plans
    - Newly launched adaptive claims-intelligence module on public surfaces
    - Potential software-like recurring revenue, but adoption and pricing are not public
    - Request booked customers, attach rate, and pricing model for Surface
  - - Partner-embedded clinical content
    - MCG guideline integration inside Unify decisioning
    - Partner proof shows workflow enrichment rather than a stand-alone SKU
    - Supports upsell and retention, but revenue share or licensing terms are not public
    - Request partner economics and whether guideline content is bundled or pass-through
  notes: Rows reflect public product lines and monetization hooks visible in official and partner sources; realized contract mix remains private.
