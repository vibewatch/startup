  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, debt obligations, monthly burn, and runway under base and downside cases.
    whyItMatters: Capital adequacy and next-round dependency cannot be judged from the Series C headline alone.
    diligencePath: Request the latest board deck, balance sheet, debt schedule, and monthly cash forecast with covenant headroom.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: Revenue-recognition policy and actual mix across software, delegated services, implementation, and payment-integrity engagements.
    whyItMatters: Without this split, investors cannot tell whether growth is software-like, service-heavy, or deferred by onboarding mechanics.
    diligencePath: Request auditor policy memos and examples of contract accounting for at least one UM, one API, and one PI customer.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, ACV, NRR, churn, implementation cost, and sales-cycle data by cohort.
    whyItMatters: Proxy signals are not enough to value customer lifetime economics or judge whether growth is efficient.
    diligencePath: Request cohort dashboards, pipeline conversion data, and onboarding-cost reporting by segment and by product.
    relatedQuestionRefs:
    - QI008
    - QI009
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer concentration, renewal dates, and revenue dependence on major payer relationships such as Humana.
    whyItMatters: A concentrated book can make the visible expansion story look stronger than the underlying renewal risk.
    diligencePath: Request top-10 customer revenue share, renewal schedule, and logo plus revenue retention history.
    relatedQuestionRefs:
    - QI021
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
