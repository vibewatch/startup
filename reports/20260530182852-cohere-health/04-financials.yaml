- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public evidence
  - Current read
  - Underwriting implication
  - Diligence ask
  rows:
  - - Total capital raised
    - $200M disclosed after Series C
    - Positive financing signal
    - Supports continued product and go-to-market investment
    - Request full cap table and historical primary versus secondary split
  - - Latest round
    - $90M Series C led by Temasek with prior investors continuing
    - Strong syndicate support
    - Suggests reputable backers still view expansion case as viable
    - Request term sheet, liquidation preference, and any structured features
  - - Stated use of funds
    - Scale Unify, expand use cases, strengthen operations and regulatory readiness
    - Growth capital, not a public liquidity bridge
    - Capital likely aimed at execution and adjacency expansion
    - Request board-approved use-of-funds schedule and hiring plan
  - - Cash / debt / burn / runway
    - Not publicly disclosed
    - Unknown
    - Cannot underwrite financing dependency from public sources
    - Request latest balance sheet, monthly burn, debt agreements, and runway forecast
  - - Next-round trigger
    - No public trigger disclosed; only growth and product-expansion narrative is visible
    - Unknown
    - Future capital need could depend on margin path and sales efficiency that are also undisclosed
    - Request 24-month operating plan with downside case and financing triggers
  notes: Historical round chronology belongs in chapter 1; this table only keeps the financing facts needed to judge forward adequacy.
  enumerationScope:
