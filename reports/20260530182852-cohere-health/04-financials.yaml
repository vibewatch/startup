- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value or proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Real-time approvals
    - Up to 85% company-claimed
    - medium-high
    - Supports workflow ROI and lower manual review load
    - Request audited definition, specialty mix, and false-positive / appeal rates
  - - Provider satisfaction
    - 94% company-claimed
    - medium-high
    - Useful proxy for adoption and renewal health in payer-provider workflows
