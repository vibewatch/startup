- id: gtm-motion-and-sales-efficiency-proxies
  title: 'GTM motion and sales-efficiency proxies: enterprise land-and-expand, not self-serve SaaS'
  body: 'Cohere''s public GTM evidence points to a payer-led enterprise motion with expansion economics, not to a low-touch SaaS sales engine. Humana moved from a 12-state musculoskeletal pilot in 2021 to all 50 states, then expanded into cardiovascular and surgical services, and later into diagnostic imaging and sleep. That path suggests the core commercial motion is to win one workflow or specialty, integrate deeply, and then broaden into adjacent categories. The MCG relationship supports the same reading from a different angle: partner content is being embedded into Unify rather than sold as a disconnected point integration, which can raise switching costs and wallet share per account. Public sales-efficiency metrics are still missing—there is no disclosed CAC, payback, ACV, NRR, or churn—but there are usable proxies. Cohere says it closed ten new deals last year, claims 94% provider satisfaction and up to 85% real-time approvals, and operates in a category where manual burden remains
    high enough that automation still has obvious ROI. That is commercially encouraging, but it is not a substitute for cohort-level revenue retention and implementation-cost data.'
  claimRefs:
