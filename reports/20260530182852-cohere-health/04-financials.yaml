- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Public proxy
  - Exact diligence path
  - Severity
  rows:
  - - Revenue / ARR by module and customer cohort
    - Needed to convert operating scale into revenue quality and valuation inputs
    - Only activity metrics and funding are public
    - Request monthly recurring revenue bridge, ARR by module, and customer cohort revenue history
    - blocking
  - - Gross margin by product and service line
    - Needed to test whether PI and delegated UM are accretive or dilutive
    - Waystar filing offers only a directional proxy
    - Request gross margin split across software, delegated UM, PI services, and implementation
    - blocking
  - - Cash on hand, debt, burn, and runway
    - Needed to assess financing dependency and next-round timing
    - Series C amount is public but balance-sheet detail is absent
    - Request latest board package, debt schedule, and 12- to 24-month cash forecast
    - blocking
  - - Pricing realization and discount history
    - Needed to test whether ROI claims convert into pricing power
    - No public list price or realized rate card
    - Request sample MSAs/SOWs, pricing schedules, discount approvals, and renewal uplifts
    - material
  - - CAC, payback, ACV, NRR, churn, and implementation cost
    - Needed to underwrite GTM efficiency and customer lifetime value
    - Public proxies are expansion milestones and deal count only
    - Request cohort dashboard with bookings, CAC, payback, NRR, churn, and onboarding cost
    - material
  - - Customer concentration and renewal economics
    - Needed to measure downside from large payer concentration
    - Humana expansion is visible, but revenue concentration is not
    - Request top-10 customer revenue share, renewal dates, and logo / revenue churn history
    - material
  - - Revenue-recognition policy for bundled software plus services
    - Needed to judge timing, quality, and deferral risk in enterprise contracts
    - Comparable filing shows ratable recognition can matter
    - Request auditor memo or revenue-recognition policy by major contract archetype
    - material
  notes: These are the main underwriting gaps left after reviewing public materials. None can be solved credibly by extrapolating from operational scale alone.
  enumerationScope:
    coverage: exhaustive
    basis: This is the full set of public-data gaps that most directly block an investment-grade financial underwriting view from the retained source pack.
