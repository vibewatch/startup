  - - Payments ROI
    - 8x to 9x company-claimed
    - medium
    - Suggests meaningful expansion economics in PI if measured consistently
    - Request numerator, denominator, and period behind ROI claims
  - - Admin-cost savings
    - 47% reduction company-claimed on homepage
    - medium
    - Supports buyer ROI story and potential shorter payback
    - Request baseline process, specialty scope, and third-party validation
  - - Comparable gross margin
    - Waystar proxy ~68.3% gross margin before D&A
    - medium
    - Public benchmark for mature healthcare workflow software economics
    - Request Cohere gross margin by module to locate it versus the proxy
  - - Comparable sales intensity
    - Waystar S&M ~16.2% of revenue
    - medium
    - Helps bound likely enterprise-sales cost for a scaled workflow vendor
    - Request Cohere S&M spend, CAC, payback, and implementation cost per launch
  - - Comparable capital intensity
    - Waystar capex plus capitalized software ~2.4% of revenue
    - medium
    - Suggests low physical capex but continued software investment needs
    - Request Cohere software capitalization policy and infrastructure spend
  notes: Public unit economics are mostly company claims or filing proxies. Missing Cohere-specific CAC, NRR, and margin data should be treated as diligence blockers, not filled with estimates.
