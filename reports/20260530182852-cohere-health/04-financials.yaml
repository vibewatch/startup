- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer
  - Public pricing signal
  - Likely billing hook
  - Unknowns that matter
  - Implication
  rows:
  - - Unify prior authorization platform
    - No public list pricing
    - Enterprise software contract; possibly PMPM, per provider, or per authorization, but not disclosed
    - Minimums, PEPM, implementation fees, guarantees, and discounting
    - Revenue quality cannot be screened from public pricing alone
  - - Delegated UM services
    - No public rate card
    - Service-plus-platform arrangement for select specialties
    - Clinical staffing burden, review-volume assumptions, and margin sharing
    - Could carry lower gross margin but higher wallet share
  - - API / interoperability layer
    - No public API pricing
    - Compliance or transaction-driven access tied to prior-auth workflow
    - Whether APIs are bundled, metered, or sold separately
    - Important for CMS-0057-F demand, but monetization is opaque
  - - Payment integrity services
    - Official materials emphasize lower contingency fees and transparency, not a posted price
    - Services, savings capture, or audit-based economics
    - Actual contingency rate, fixed fee, and appeals-related cost recovery
    - Revenue may depend on outcomes and service scope more than software seats
  - - Surface claims intelligence
    - No public pricing
    - Software or analytics subscription is plausible but unconfirmed publicly
    - Attach rate, implementation lift, data-ingestion fees, and contract term
    - Could improve software mix if adoption is meaningful
  - - 'Comparable benchmark: Waystar'
    - 10-K discloses subscription plus volume-based revenue and ratable implementation recognition, but no customer rate card
    - Monthly provider-count fees, minimums, transaction fees, and implementation fees
    - Specific customer pricing and discount history still private
    - Comparable public filings support contract complexity, not direct price benchmarking
  notes: The table records what public pricing does and does not reveal. For Cohere itself, the dominant answer is negotiated enterprise pricing with undisclosed realized economics.
  enumerationScope:
    coverage: partial
    basis: Includes the main Cohere offers and one relevant public comparable to show monetization structure when list prices are absent.
