companyProfile:
  summary: >-
    Cohere Health is a Boston-based clinical-intelligence company focused on helping health plans and risk-bearing
    providers modernize prior authorization and adjacent payer workflows. Its Cohere Unify platform combines clinical AI,
    rules engines, and provider-facing workflow tools across utilization management, payment integrity, policy, and
    related decisioning steps. Public evidence shows real operating scale and multiyear payer expansion, but the company
    remains financially opaque relative to public software comparables.
  foundedDate: '2019-01-01'
