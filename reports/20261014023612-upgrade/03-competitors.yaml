callouts:
  - calloutType: insight
    title: Channel Diversification Mitigates Digital Acquisition Inflation
    body: Upgrade's decision to acquire Uplift (now Flex Pay) and develop merchant networks across 2,000 contractors and 1,000 auto dealerships grants proprietary customer acquisition access. By embedding financing at points of high consumer intent, Upgrade sidesteps search-engine and affiliate aggregator price inflation that compresses margins for direct-to-consumer monoline lenders.
    claimRefs:
      - CP003
      - CP009
      - CP011
  - calloutType: risk
    title: Balance-Sheet Intermediation Risk Across Depository Partners
    body: While Upgrade's network of 200+ credit union buyers eliminates balance-sheet equity drag, it introduces secondary channel vulnerability. Should liquidity conditions tighten across regional credit unions or loan purchase appetites retrench, Upgrade must redirect loan origination volume toward higher-yield institutional asset managers, potentially compressing origination margins.
    claimRefs:
      - CP005
      - CP007
      - CP012
