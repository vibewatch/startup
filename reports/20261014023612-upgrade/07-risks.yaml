callouts:
  - calloutType: "risk"
    title: "BaaS Sponsor Bank Regulatory Vulnerability"
    body: "Upgrade's lack of an independent banking charter necessitates reliance on depository partners like Cross River Bank. Federal regulatory enforcement against sponsor banks represents an existential channel risk that cannot be entirely mitigated by contract covenants."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
  - calloutType: "risk"
    title: "Credit Tightening and Institutional Capital Elasticity"
    body: "The dual role of institutional partners as both equity shareholders and loan buyers creates circular capital exposure. A pullback in third-party loan purchases would constrain origination velocity and squeeze fee margins."
    claimRefs:
      - "CR002"
      - "CR007"
      - "CR010"
