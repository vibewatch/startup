callouts:
  - calloutType: "insight"
    title: "Proprietary Distribution Economics in High-CAC Environment"
    body: "Upgrade's multi-channel B2B2C distribution model—integrating Flex Pay directly into airlines, hotel connectivity platforms like Hapi, theme park operators like Six Flags, and home improvement contractor networks—structurally insulates the platform from escalating direct-to-consumer digital acquisition costs that have compressed margins for mono-line consumer lenders."
    claimRefs:
      - "CM002"
      - "CM008"
      - "CM012"
  - calloutType: "risk"
    title: "High-APR Concentration and Vulnerable Consumer Exposure"
    body: "While Upgrade positions its fixed-rate installment card and personal loan products as responsible alternatives to compounding credit card revolving debt, point-of-sale and personal loan APR tiers reaching up to 35.99% or 36.00% expose lower-credit borrowers to substantial carrying costs, creating heightened regulatory scrutiny and credit-cycle sensitivity as consumer savings buffers compress."
    claimRefs:
      - "CM003"
      - "CM010"
      - "CM014"
