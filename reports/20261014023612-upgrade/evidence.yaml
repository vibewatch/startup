evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financial-statements
    missingEvidence: >-
      Audited GAAP financial statements for fiscal years 2024 through 2026 verifying company-reported revenue run-rate
      and net income margins.
    whyItMatters: >-
      Upgrade reports profitable growth and a $1B revenue run rate, but private company status precludes independent
      GAAP verification of loss provisions and revenue recognition.
    diligencePath: >-
      Request confidential audited financials, auditor opinion letters, and loan tape loss performance data under an
      NDA.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: >-
      Comprehensive capitalization table detailing exact ownership percentages, liquidation preferences, and secondary
      transaction terms for Series G investors.
    whyItMatters: >-
      Public announcements identify lead investors such as Neuberger Berman and Coatue but do not disclose individual
      shareholder equity stakes or senior liquidation terms.
    diligencePath: Examine full Series G stock purchase agreement and certificate of incorporation amendments filed in Delaware.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: regulatory-oversight
    missingEvidence: >-
      Public disclosure of depository partner-bank exam ratings, supervisory agreements, or credit warehouse line
      renewal covenants.
    whyItMatters: >-
      Upgrade's platform origination velocity depends entirely on third-party commercial bank charters (Cross River
      Bank, Blue Ridge Bank, Celtic Bank) and institutional warehouse liquidity.
    diligencePath: >-
      Review public FDIC regulatory consent orders, Call Reports for issuing partner banks, and institutional
      securitization filings for warehouse covenant triggers.
    relatedQuestionRefs:
      - QM006
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      Audited breakdown of annual origination volumes disaggregated by credit tier, product line, and geographic
      concentration.
    whyItMatters: >-
      Public sources report headline cumulative credit figures ($42B to $50B+) without isolating annual run-rate
      originations per product vertical.
    diligencePath: Request confidential loan tape stratifications and cohort performance data during confirmatory diligence.
    relatedQuestionRefs:
      - QM001
  - type: missing-source
    severity: material
    topic: competitor-retention-metrics
    missingEvidence: >-
      Detailed product-level cohort retention schedules, cross-sell conversion rates from BNPL (Flex Pay) to core
      personal loans, and segmented net credit loss curves relative to standalone competitors.
    whyItMatters: >-
      Without segmented cohort loss curves and cross-product conversion rates, durability of Upgrade's multi-product CAC
      advantage against specialized competitors cannot be independently verified.
    diligencePath: >-
      Request audited cohort performance schedules, borrower acquisition cost attribution, and product-level loss
      histories across Flex Pay, OneCard, and direct personal loans during management diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: gaap-financial-statements
    missingEvidence: >-
      Audited GAAP income statements, balance sheets, and cash flow statements for fiscal 2025 and 2026 detailing
      operating margins, GAAP net income, and cash burn.
    whyItMatters: >-
      Without audited financial statements, reported top-line scale and management profitability assertions cannot be
      tied to GAAP revenue recognition or cash flow margins.
    diligencePath: >-
      Request audited 2024-2025 financial statements and year-to-date 2026 unaudited management accounts under
      non-disclosure agreement during pre-IPO diligence.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: credit-loss-cohorts
    missingEvidence: >-
      Product-level net charge-off curves, 30+ and 90+ day delinquency cohorts, and partner bank repurchase liabilities
      across personal loan and card vintages.
    whyItMatters: >-
      Although Upgrade acts as an off-balance-sheet marketplace, high cohort loss rates would compress partner bank
      demand, lower secondary loan sale premiums, and threaten funding liquidity.
    diligencePath: >-
      Review historical loan performance data tapes and bank partner warehouse covenant compliance certificates in a
      confidential data room.
    relatedQuestionRefs:
      - QI006
      - QI009
  - type: private-evidence-only
    severity: minor
    topic: liquidation-preferences
    missingEvidence: >-
      Detailed Series G capitalization table outlining senior liquidation preferences, participation rights, and
      employee stock option pool dilution.
    whyItMatters: >-
      The $7.3 billion headline pre-money valuation reflects senior preferred shares; common share value and true
      enterprise returns depend on preference seniority and hurdle structures.
    diligencePath: >-
      Obtain the amended Certificate of Incorporation and cap table distribution waterfall model directly from issuer
      counsel.
    relatedQuestionRefs:
      - QI008
      - QI009
  - type: private-evidence-only
    severity: material
    topic: underwriting-engine
    missingEvidence: >-
      Product-level historical default rates, charge-off curves, and proprietary scoring weightings across personal
      loans, cards, and BNPL.
    whyItMatters: >-
      Essential to independently assess whether Upgrade's cash-flow underwriting out-performs standard FICO models
      during economic downturns.
    diligencePath: Request audited vintage performance loss data and underwriting algorithm white papers under institutional NDA.
    relatedQuestionRefs:
