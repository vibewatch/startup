company:
  name: Upgrade
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Upgrade is a San Francisco-based consumer credit platform that has originated over $42B in credit across 7.5M
    customers, backed by $750M in equity funding and valued at $7.3B following its Series G round in October 2025. The
    company operates six core credit and banking products via bank partnerships and has initiated charter applications
    in Nevada to establish an industrial loan bank.
sections:
  - id: identity-and-business-model
    title: Corporate Identity, Operating Scale, and Business Model
    body: >-
      Upgrade, Inc. is a San Francisco-headquartered digital consumer finance platform established to provide accessible
      credit and integrated banking services to mainstream American households. Operating across six primary product
      lines—including fixed-rate personal loans, installment-enabled credit cards, mobile checking and savings, buy now
      pay later financing (Flex Pay), home improvement loans, and auto refinancing—Upgrade positions itself as a
      responsible alternative to revolving high-interest credit card debt. Unlike traditional monoline lenders, the
      company combines direct-to-consumer digital channels with embedded merchant checkout partnerships across retail
      and travel sectors. By distributing products directly at merchant points of sale, Upgrade achieves lower customer
      acquisition costs while progressively cross-selling borrowers into deposit accounts and revolving card products.
      As of late 2025, the platform reports having delivered over $42 billion in cumulative credit across more than 7.5
      million consumer accounts since commencing commercial lending in 2017.
    claimRefs:
      - CO001
      - CO003
      - CO004
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Founders, Executive Leadership, and Governance
    body: >-
      Upgrade was conceived and established in 2016 by veteran online lending pioneer Renaud Laplanche alongside
      co-founders Adelina Grozdanova, Jeff Bogan, Matt Wierman, Soul Htite, and Visar Nimani. The founding team
      leverages extensive prior experience scaling marketplace credit technology and managing institutional loan
      securitizations. Corporate governance has expanded to accommodate substantial institutional capital, underscored
      by the addition of Peter Sterling, Head of Specialty Finance at Neuberger Berman, to Upgrade's Board of Directors
      following the firm's leadership of the Series G preferred equity round. To manage accelerated multi-product
      operational complexity, executive management added Jeffrey Meiler, former CEO of Best Egg, as Chief Operating
      Officer overseeing consumer lending operations and underwriting efficiency, alongside dedicated leadership heads
      for credit cards and operational strategy. While executive bench depth has matured considerably, key-person
      dependency on Laplanche remains significant given his central role in shaping corporate vision, capital markets
      relationships, and bank distribution channels.
    claimRefs:
      - CO002
      - CO007
      - CO009
    tableRefs:
      - TO002
  - id: capitalization-and-funding-history
    title: Financing History, Valuation Trajectory, and Capitalization
    body: >-
      Upgrade has executed a disciplined equity capitalization strategy, accumulating approximately $750 million in
      total equity financing since inception. The company's valuation trajectory accelerated dramatically during the
      fintech investment expansion, rising from early venture rounds to a $3.325 billion pre-money valuation in its
      August 2021 Series E led by Koch Disruptive Technologies, followed quickly by a $280 million Series F in November
      2021 led by Coatue Management and DST Global at a $6 billion valuation. In October 2025, amid a broader
      normalization in private fintech multiples, Upgrade secured a $165 million Series G round led by Neuberger Berman
      Funds with participation from LuminArx Capital Management, DST Global, and Ribbit Capital, establishing a
      pre-money valuation of $7.3 billion. BofA Securities served as exclusive placement agent. The capital injection
      provides liquidity for early stakeholders while strengthening the balance sheet ahead of an anticipated initial
      public offering window over the ensuing 12 to 18 months.
    claimRefs:
      - CO005
      - CO006
      - CO008
    tableRefs:
      - TO003
  - id: operational-milestones-and-regulatory-evolution
    title: Operational Milestones, Bank Charter Strategy, and Diligence Risks
    body: >-
      Since its 2016 incorporation, Upgrade has achieved pivotal operational and product milestones, expanding from
      unsecured personal loans into cards in 2019, acquiring travel BNPL provider Uplift in 2023 (subsequently rebranded
      to Flex Pay in December 2024), and reaching cumulative milestones of $2 billion in home improvement credit and $1
      billion in auto financing. Historically, Upgrade has operated entirely via third-party originating bank
      partnerships—relying primarily on Cross River Bank, Blue Ridge Bank, and Celtic Bank to issue credit and host
      consumer deposits. However, in October 2026, Upgrade announced a major structural evolution by submitting formal
      charter applications to the Nevada Financial Institutions Division and the FDIC to establish Upgrade Bank as an
      industrial loan bank. If approved, an owned bank charter would reduce reliance on partner-bank rent-a-charter
      models and capture deposit funding, but introduces heightened regulatory supervision and capital reserve
      obligations. Additionally, diligence must weigh consumer credit risks: revolving balances on Upgrade OneCard incur
      fixed APRs between 14.99% and 29.99% that can elevate credit utilization ratios, while Flex Pay installment
      pricing ranges up to 36% APR.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
    figureRefs:
      - FO001
