callouts:
  - calloutType: "insight"
    title: "The Merchant Acquisition Engine vs. Retention Transparency"
    body: "Upgrade's multi-channel distribution network with airlines, cruise lines, contractor networks, and theme parks provides a structural cost advantage over pure-play consumer lenders that rely on expensive search advertising. However, the true durability of this flywheel hinges on cohort conversion: whether point-of-sale borrowers stick around to adopt core deposit and card products, a metric management has yet to disclose publicly."
    claimRefs:
      - "CU006"
      - "CU008"
      - "CU010"
      - "CU013"

