company:
  name: "Upgrade"
chapter:
  number: 6
  title: "Customers"
  summary: "Upgrade serves over 7.5 million mainstream consumers across six core lending and banking products, having facilitated more than $42 billion in cumulative credit. The platform relies on proprietary, low-cost merchant and contractor networks for customer acquisition, while over 200 institutional depository partners purchase prime loans with weighted average credit scores between 731 and 786 FICO. However, public disclosures omit cohort-level retention curves and repeat borrowing metrics, and consumer risk remains elevated in point-of-sale leisure financing where interest rates reach 36% APR."

sections:
  - id: "customer-segmentation-and-demographics"
    title: "Customer Segmentation and Borrower Demographics"
    body: "Upgrade targets mainstream American consumers across multiple distinct credit and liquidity needs, segmenting its borrower base across personal unsecured credit, residential home improvement financing, auto purchase and refinance contracts, and point-of-sale installment lending. Rather than competing solely as a subprime or near-prime alternative lender, Upgrade's primary depository-funded credit portfolios exhibit distinctly prime credit characteristics. In personal loans, which represent the platform's core debt-consolidation engine, borrowers carry a weighted average FICO score of approximately 731 and an average household income of $161,000, with over 80% utilizing proceeds to consolidate existing obligations into fixed-rate amortizing installment debt. In home improvement financing, borrower quality skews even higher, demonstrating a weighted average credit score of 786 FICO and an average income near $159,000 across a borrower pool where 84.76% are verified homeowners. This demographic positioning allows Upgrade to package attractive prime credit assets for traditional depository institutions seeking yield replacement while avoiding unsecured subprime default volatility."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"

  - id: "adoption-trajectory-and-origination-scale"
    title: "Adoption Trajectory and Cumulative Credit Scale"
    body: "Upgrade has demonstrated sustained origination momentum since its founding in 2017, scaling from a pure-play personal loan originator into a multi-product consumer finance platform. The platform reached cumulative credit delivery milestones of over $42 billion across more than 7.5 million customers by late 2025, expanding toward $50 billion across 8 million consumers through 2026. Growth has been accelerated by rapid line extensions into secured and specialized consumer lending verticals. Specifically, Upgrade scaled its home improvement financing product to $2 billion in cumulative volume within three years of introduction, while auto financing reached $1 billion in cumulative originations within two years of launch. Despite these impressive top-line cumulative metrics, public disclosures lack periodic active-account counts, monthly active borrower metrics, or annualized origination denominators, making it challenging to differentiate newly acquired borrowers from repeat users or measure true active wallet retention over time."
    claimRefs:
      - "CU001"
      - "CU007"
      - "CU014"
    tableRefs:
      - "TU002"

  - id: "named-partnerships-and-merchant-proof"
    title: "Institutional Deployments and Named Merchant Evidence"
    body: "Upgrade's commercial model operates as a two-sided network linking capital providers with consumer distribution channels. On the capital supply side, Upgrade has established formal partnerships with more than 200 depository financial institutions and credit unions that purchase originated loans to diversify their balance sheets and replace compressed interest margins. On the consumer distribution side, Upgrade differentiates itself from traditional fintechs by bypassing paid search acquisition in favor of embedded merchant networks. Following its $100 million acquisition of Uplift, Upgrade deploys its Flex Pay BNPL solution across hundreds of commercial airlines, cruise operators, and hotel technology platforms such as Hapi, which automates virtual card settlements across thousands of hospitality properties. Additionally, high-profile leisure operators including Six Flags Entertainment have deployed Upgrade FlexPay to finance season passes and merchandise orders exceeding $49. While this outsources collections and risk from the merchant, consumer advocates note that risk-based APRs up to 36% impose high carrying costs on credit-stretched visitors."
    claimRefs:
      - "CU003"
      - "CU006"
      - "CU009"
      - "CU010"
      - "CU013"
    tableRefs:
      - "TU003"

  - id: "customer-journey-and-retention-risks"
    title: "Customer Journey, Cross-Sell Loops, and Retention Durability"
    body: "The central thesis of Upgrade's multi-product strategy is creating an integrated consumer financial journey that transitions low-cost merchant point-of-sale borrowers into high-lifetime-value banking and credit relationships. Consumers initially encounter Upgrade during checkout for travel, home contractor repairs, or theme park tickets, where real-time risk underwriting approves promotional 0% or risk-adjusted installment plans. Following transaction settlement, users are onboarded into the Upgrade mobile app, where they can manage installment schedules and access Rewards Checking deposit accounts. Upgrade subsequently cross-sells higher-tier offerings, including the hybrid Upgrade OneCard—which allows users to toggle between Pay Now checking debits and Pay Later installments at 14.99% to 29.99% fixed APR—as well as larger personal consolidation loans. Furthermore, Upgrade has actively adapted customer discovery toward artificial intelligence-driven search visibility. However, because Upgrade does not disclose Net Revenue Retention (NRR) or multi-year cohort retention curves, the long-term durability of these cross-sell conversion loops remains a material diligence gap."
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU008"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
    figureRefs:
      - "FU001"

