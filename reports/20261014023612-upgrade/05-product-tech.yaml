chapter:
  number: 5
  title: Product & Technology
  summary: Upgrade operates a digital consumer-credit and payment platform spanning six core products—personal loans, cards, mobile banking, BNPL, home improvement financing, and auto financing—facilitating over $42B in originations through a marketplace partner-bank architecture. Credit evaluation combines proprietary underwriting algorithms with open-banking transaction data, while front-end delivery leverages embedded finance integrations and mobile apps backed by industrial and commercial partner banks like Cross River, Celtic, and Blue Ridge.
sections:
  - id: product-portfolio-and-workflows
    title: Core Product Portfolio and Consumer Workflow Delivery
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
    tableRefs:
      - TE001
      - TE002
    body: 'Upgrade delivers a unified consumer credit and banking suite spanning six core product lines: personal loans, installment-enabled credit cards, mobile banking deposits, buy now, pay later (BNPL) point-of-sale financing, home improvement loans, and auto financing. Rather than functioning as a monoline unsecured personal lender, Upgrade structures its consumer workflow around an integrated digital mobile and web experience that consolidates borrowing, transacting, and credit tracking. The product portfolio originated with fixed-rate personal loans designed for debt consolidation, where borrowers obtain structured 3- to 7-year installment terms. Over time, the platform expanded into retail and point-of-sale workflows, deploying the Upgrade OneCard and Flex Pay products to capture everyday transactions and merchant checkout events. Cumulative consumer originations surpassed $42 billion across more than 7.5 million customers by late 2025, expanding past $50 billion and 8 million users in 2026 partner records, with home improvement and auto financing originations contributing over $2 billion and $1 billion respectively. The point-of-sale BNPL capability was accelerated through the $100 million acquisition of Uplift, anchoring Upgrade''s embedded installment presence across airlines, cruise lines, and hospitality platforms.'
  - id: architecture-and-operating-model
    title: Marketplace Technology Architecture and Bank-Partner Operating Rails
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE011
      - CE013
      - CE014
    tableRefs:
      - TE003
    figureRefs:
      - FE001
    body: Upgrade operates technically and operationally as a balance-sheet-light credit marketplace rather than a chartered depository institution. Loans and deposit balances do not reside on Upgrade's balance sheet; instead, credit origination and account issuance are executed through banking-as-a-service (BaaS) infrastructure provided by partner depository institutions. Personal loans, personal credit lines, and deposit accounts are originated primarily through Cross River Bank and Blue Ridge Bank, while credit cards are issued by Cross River Bank and Sutton Bank, with commercial facilities supported by Celtic Bank. Upgrade's proprietary technology stack provides the front-end user experience, partner API integration layer, automated underwriting logic, and post-origination servicing engine. Following origination, loans are sold at par or premium to a distribution network of more than 200 financial institution buyers—principally credit unions seeking high-yielding prime consumer assets with custom buy-book criteria. Upgrade retains complete servicing responsibility throughout the asset lifecycle, maintaining customer relationships and payment operations while collecting upfront platform fees, recurring servicing fees, and card interchange revenue.
  - id: underwriting-differentiation-and-technical-risks
    title: Credit Underwriting Differentiation, Embedded Rails, and Technical Risk Factors
    claimRefs:
      - CE007
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
    body: Upgrade differentiates its underwriting technology by combining traditional bureau scores with real-time cash flow verification and open-banking transaction telemetry. By analyzing banking transaction histories and applicant debt-to-income profiles, Upgrade targets 'periodic revolvers' and near-prime borrowers, offering annual percentage rates typically 300 to 400 basis points below traditional credit card revolvers for comparable credit tiers. The company has extended this underwriting capability beyond direct-to-consumer surfaces by exposing embedded credit APIs to ecosystem partners. In embedded personal lending, Upgrade powers the OnePay application, allowing consumers to pre-qualify and obtain loans up to $50,000 directly within third-party digital wallets. Similarly, through hospitality middleware partner Hapi, Upgrade automates Flex Pay virtual credit card generation and property management system reconciliation across hotel chains above-property. However, this operating architecture exposes Upgrade to material partner-dependency risks, regulatory BaaS scrutiny under third-party risk management guidance, and consumer credit concerns stemming from Flex Pay's risk-based APR pricing reaching up to 36% for vulnerable borrowers.
tables:
  - id: TE001
    title: Product Module and Asset Line Matrix
    columns:
      - Product Line / Module
      - Target User / Buyer
      - Maturity / Scale
      - Differentiation
      - Diligence Gap
    rows:
      - - Personal Loans
        - Prime and near-prime debt consolidators
        - Core mature product; majority of cumulative volume
        - Fixed 3–7 year terms, automated rate discount for direct payoff
        - Audited cohort charge-off rates by vintage undisclosed
      - - Cards / OneCard
        - Periodic revolvers seeking lower APRs
        - High growth; approaching personal loan origination scale
        - Hybrid charge card with automated monthly installment conversion
        - Net interchange margin and revolving balance duration
      - - Flex Pay (BNPL)
        - Travel and retail installment shoppers
        - Scaled via Uplift acquisition; thousands of merchants
        - Embedded checkout with 0% to 36% APR risk-based pricing
        - Loss rates on subprime point-of-sale balances
      - - Home Improvement Financing
        - Homeowners funding residential contractor projects
        - Fast-growing; over $2B cumulative originations
        - Integrated contractor merchant network with terms up to 20 years
        - Contractor channel concentration and dispute rates
      - - Auto Financing
        - Vehicle owners seeking refinance and indirect purchase
        - Rapid expansion; over $1B cumulative originations
        - Streamlined online title transfer and dealership integration
        - Collateral repossession costs and auction recovery rates
      - - Mobile Banking / Rewards Checking
        - Mainstream consumers seeking digital accounts
        - Multi-year deployment; Cross River Bank partnership
        - No monthly fees, no overdraft fees, cash back debit rewards
        - Deposit retention sensitivity to interest rate cycles
    notes: Product originations and platform scale derived from company press announcements and partner bank disclosures; product-level unit economics remain undisclosed private data.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
  - id: TE002
    title: Consumer Workflow and Use-Case Comparison Table
    columns:
      - User Job / Context
      - Traditional Legacy Workflow
      - Upgrade Platform Solution
      - Measurable Benefit
      - Technical / Structural Limitation
    rows:
      - - Debt Consolidation
        - Branch visits, manual document uploads, multi-week underwriting
        - Online application, open-banking verification, same-day disbursement
        - 300–400 bps lower APR vs traditional cards, direct creditor payoff
        - Borrower must have qualifying credit and verifiable income
      - - Everyday Spending & Credit
        - Separate debit cards or high-APR revolving cards (20%+ APR)
        - Upgrade OneCard with in-app toggle between debit payoff and installment
        - Cash back rewards up to 3%, fixed monthly payoff discipline
        - Requires linked checking account for immediate debit feature
      - - Travel & Event Checkout
        - High-cost point-of-sale merchant financing or upfront cash outlay
        - Flex Pay checkout integration with transparent monthly payment options
        - Instant eligibility check at checkout without impact on credit score
        - APRs scale up to 36% for lower-tier credit profiles
      - - Embedded Partner Borrowing
        - Redirect to external lending site, discontinuous customer journey
        - Native in-app loan application and servicing via partner SDKs (e.g. OnePay)
        - Frictionless embedded borrowing from $1,000 to $50,000
        - Underwriting relies on third-party app data and API uptime
    notes: Workflow benefits benchmarked against conventional bank credit card revolving terms and legacy personal installment lending practices.
    claimRefs:
      - CE001
      - CE007
      - CE009
      - CE010
      - CE011
      - CE012
  - id: TE003
    title: Platform Technology Components and Operational Dependencies Table
    columns:
      - Architectural Layer / Component
      - Role & Functionality
      - Key Dependency
      - Technical & Operational Risk
    rows:
      - - Client & Embedded Surface
        - Mobile apps (iOS/Android), responsive web, merchant widgets, and partner SDKs
        - Apple App Store, Google Play, enterprise partner app hosts
        - App distribution friction, third-party UI latency and rendering breaks
      - - Credit Decisioning Engine
        - Automated applicant scoring, cash flow analytics, and custom buy-book matching
        - Credit bureaus (Experian/TransUnion), open-banking aggregators
        - Model drift during macroeconomic stress, bureau service disruptions
      - - Bank Partner BaaS Rails
        - Loan origination, regulatory compliance execution, and deposit account hosting
        - Cross River Bank, Blue Ridge Bank, Sutton Bank, Celtic Bank
        - BaaS regulatory enforcement actions, partner contract renegotiation risk
      - - Servicing & Capital Marketplace
        - In-house payment collection, investor portal, and secondary loan allocation
        - ACH payment network, 200+ depository buyer network APIs
        - Investor liquidity pullbacks during credit tightening, ACH transfer delays
    notes: Architecture components identified from bank partnership disclosures and partner integration specifications; proprietary core algorithms remain undisclosed.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE011
      - CE013
      - CE014
figures:
  - id: FE001
    title: Multi-Tier Technology Architecture and Capital Distribution Stack
    type: stack
    summary: End-to-end architectural stack illustrating Upgrade's workflow from consumer and embedded distribution surfaces down to depository capital allocation.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE011
      - CE012
      - CE013
    approximationNotes: Stack modules categorized from public partner integration announcements, API documentation summaries, and institutional partnership disclosures.
    data:
      layers:
        - label: 'Layer 1: Client & Embedded Distribution Surface'
          description: Direct and embedded consumer engagement touchpoints
          modules:
            - Upgrade Mobile Apps (iOS & Android native clients)
            - Direct Web Application & Customer Account Portal
            - OnePay Embedded Credit SDK (White-label wallet loans)
            - Flex Pay E-Commerce & POS Merchant Widgets
        - label: 'Layer 2: Partner Integration & Connectivity Layer'
          description: Integration middleware connecting ecosystem partners
          modules:
            - Open-Banking Transaction Ingestion APIs
            - Hapi Hospitality Payments Automation & VCC Engine
            - Merchant & Contractor Point-of-Sale Connectors
            - Real-Time Webhook & Event Notification Gateway
        - label: 'Layer 3: Proprietary Underwriting & Decisioning Engine'
          description: Alternative data scoring and institutional rule evaluation
          modules:
            - Cash-Flow Verification & Income Analytics Engine
            - Alternative Risk Scoring & Bureau Data Synthesizer
            - Custom Buy-Book Matching & Filtering Algorithms
            - Real-Time Risk-Based APR Pricing Engine (0%–36%)
        - label: 'Layer 4: Bank Partner Origination Rails (BaaS)'
          description: Chartered bank execution and regulatory compliance rails
          modules:
            - Cross River Bank Origination Conduit (Personal loans, auto, checking)
            - Blue Ridge Bank Lending Rails (Personal loans & auto refinance)
            - Sutton Bank Card Issuing Rails (Upgrade Card programs)
            - Celtic Bank Commercial & Line-of-Credit Facilities
        - label: 'Layer 5: Loan Servicing & Lifecycle Operations'
          description: In-house servicing, payment processing, and customer care
          modules:
            - Automated ACH Repayment & Billing Platform
            - Delinquency Tracking & Early Loss Mitigation Tools
            - Customer Account Dashboard & Rewards Tracker
            - Montreal Technology Center Platform Services
        - label: 'Layer 6: Secondary Capital Distribution Marketplace'
          description: Institutional liquidity and loan purchasing infrastructure
          modules:
            - 200+ Depository Institution Institutional Buyer Portal
            - Credit Union Forward-Flow Purchase Matching
            - Institutional Loan Sale Settlement & File Delivery
            - Secondary Market Securitization Data Pipeline
callouts:
  - calloutType: risk
    title: BaaS Partner Concentration and Regulatory Dependency
    body: Upgrade's reliance on a concentrated cluster of bank partners—primarily Cross River Bank and Blue Ridge Bank—creates systemic regulatory and operational dependency. In recent years, federal banking agencies (FDIC, OCC, Federal Reserve) have intensified oversight of bank-fintech partnerships, issuing formal enforcement orders and stricter third-party risk management guidance across the BaaS sector. Any regulatory disruption, consent order, or operational limitation placed on Cross River or Blue Ridge could directly impede Upgrade's origination throughput, card issuance, or deposit account administration.
    claimRefs:
      - CE002
      - CE003
  - calloutType: insight
    title: Embedded Finance Integration as an Acquisition Moat
    body: Upgrade's expansion into embedded finance through partner platforms like OnePay and hospitality automation provider Hapi creates low-cost, proprietary distribution moats that bypass conventional direct-to-consumer search acquisition. By integrating credit underwriting directly into third-party payment workflows, Upgrade captures prime and near-prime borrowers at the immediate point of need, lowering customer acquisition costs and creating cross-sell pipelines for its broader multi-product financial suite.
    claimRefs:
      - CE011
      - CE012
