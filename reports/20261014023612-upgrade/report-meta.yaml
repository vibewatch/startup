companyProfile:
  summary: >-
    Upgrade is a San Francisco-based consumer credit fintech that combines personal loans, installment cards, mobile
    banking, BNPL, home-improvement financing, and auto financing through partner-bank infrastructure. The company
    reports more than $53 billion in cumulative credit delivered to over 8.5 million customers, has raised roughly $750
    million in equity capital, and is pursuing a Nevada industrial loan bank charter to reduce its dependence on
    sponsor-bank funding.
  headquarters: San Francisco, CA
  productSummary: >-
    A multi-product consumer credit and banking platform spanning personal loans, installment cards, deposit products,
    BNPL, home-improvement financing, and auto financing.
  customerFocus: Mainstream near-prime consumers and embedded merchant partners in travel, home improvement, and auto.
  businessModel: >-
    Originates and services consumer credit through partner banks, monetizing via upfront origination fees, servicing
    fees, interchange, and loan-sale premiums.
  stage: Series G
  fundingStatus: >-
    Series G preferred equity round closed in October 2025 at a $7.3 billion pre-money valuation; total equity raised is
    about $750 million.
