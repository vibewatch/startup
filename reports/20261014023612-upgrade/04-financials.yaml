figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: End-to-end operational flow showing how borrower demand and partner distribution convert into off-balance-sheet fee income and platform gross profit.
    data:
      nodes:
        - id: node-1
          label: Customer Acquisition & Credit Request
          description: Consumer applies via Upgrade direct app or embedded partner channels (OnePay, travel brands, home improvement contractors).
        - id: node-2
          label: Partner Bank Credit Underwriting
          description: Originating partner banks (Cross River Bank, Celtic Bank, Blue Ridge Bank) evaluate eligibility and issue loan or credit line.
        - id: node-3
          label: Upfront Origination Monetization
          description: Platform captures 5% upfront origination fee on personal loans and merchant discount rates on Flex Pay transactions.
        - id: node-4
          label: Whole-Loan & Receivable Placement
          description: Off-balance-sheet distribution transfers loan assets at par or premium to a network of 220+ banks and credit unions.
        - id: node-5
          label: Recurring Servicing & Interchange Capture
          description: Upgrade collects ongoing monthly loan servicing fees and transaction interchange on card spending.
        - id: node-6
          label: Deposit Synergy & Low-Cost Funding
          description: Partner banks receive core deposit inflows from Upgrade checking/savings, subsidizing credit purchase capacity.
        - id: node-7
          label: Platform Net Margin Realization
          description: High gross margins realized as Upgrade absorbs zero credit-loss default risk on distributed loan balances.
    approximationNotes: Flow illustrates the operational monetization architecture of Upgrade marketplace model; contractual revenue-share percentages between Upgrade and partner institutions are private.
