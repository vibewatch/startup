  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gaap-financial-statements
      missingEvidence: Audited GAAP income statements, balance sheets, and cash flow statements for fiscal 2025 and 2026 detailing operating margins, GAAP net income, and cash burn.
      whyItMatters: Without audited financial statements, reported top-line scale and management profitability assertions cannot be tied to GAAP revenue recognition or cash flow margins.
      diligencePath: Request audited 2024-2025 financial statements and year-to-date 2026 unaudited management accounts under non-disclosure agreement during pre-IPO diligence.
      relatedQuestionRefs:
        - QI009
    - type: missing-source
      severity: material
      topic: credit-loss-cohorts
      missingEvidence: Product-level net charge-off curves, 30+ and 90+ day delinquency cohorts, and partner bank repurchase liabilities across personal loan and card vintages.
      whyItMatters: Although Upgrade acts as an off-balance-sheet marketplace, high cohort loss rates would compress partner bank demand, lower secondary loan sale premiums, and threaten funding liquidity.
      diligencePath: Review historical loan performance data tapes and bank partner warehouse covenant compliance certificates in a confidential data room.
      relatedQuestionRefs:
        - QI006
        - QI009
    - type: private-evidence-only
      severity: minor
      topic: liquidation-preferences
      missingEvidence: Detailed Series G capitalization table outlining senior liquidation preferences, participation rights, and employee stock option pool dilution.
      whyItMatters: The $7.3 billion headline pre-money valuation reflects senior preferred shares; common share value and true enterprise returns depend on preference seniority and hurdle structures.
      diligencePath: Obtain the amended Certificate of Incorporation and cap table distribution waterfall model directly from issuer counsel.
