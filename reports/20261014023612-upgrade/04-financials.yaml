      - CI001
      - CI002
      - CI003
      - CI014
callouts:
  - calloutType: insight
    title: Marketplace Architecture Insulates Capital While Requiring Institutional Liquidity
    body: 'By routing loan originations and deposits through chartered partner banks like Cross River Bank and distributing whole loans to over 220 credit unions, Upgrade operates without retaining balance-sheet credit risk. This structural choice shields platform profitability from direct consumer defaults during credit downturns. However, it creates an acute dependency on secondary market liquidity: any institutional hesitation to buy loans or regulatory restriction on partner banks would immediately constrain origination throughput.'
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI014
  - calloutType: risk
    title: High Consumer APR Ceilings Expose Embedded Lending to Scrutiny
    body: With personal loan APRs reaching 35.99% and Flex Pay leisure installment rates scaling up to 36%, Upgrade pricing model captures subprime risk premiums on point-of-sale and personal credit products. In leisure financing, shifting credit risk to consumers through high-APR installments creates reputational and regulatory vulnerabilities, particularly as state rate caps and CFPB scrutiny around embedded credit products intensify.
    claimRefs:
      - CI005
      - CI007
      - CI012
      - CI013
