chapter:
  number: 4
  title: Financials
  summary: Upgrade operates a capital-light consumer-credit marketplace generating revenue from upfront origination fees, loan servicing fees, secondary market sale premiums, interchange, and partner deposit placements across a network of over 220 credit unions and partner banks. While the platform has facilitated over $42 billion in cumulative credit and achieved profitability without retaining balance-sheet credit risk, detailed GAAP margins, loss cohort economics, and forward debt-service terms remain undisclosed private-company gaps.
sections:
  - id: revenue-streams-and-pricing-model
    title: Revenue Streams and Monetization Architecture
    body: Upgrade has established a diversified, capital-light revenue model across six core consumer-credit and banking product categories, designed to generate multi-stream monetization without retaining balance-sheet credit exposure. The primary engine of platform monetization centers on personal loan originations, where Upgrade charges borrowers an upfront fee of approximately 5% on disbursed principal while securing recurring servicing fees and gains on sale as whole loans are sold at par value to institutional buyers (CI001). In its credit card operations, including the hybrid installment OneCard, Upgrade monetizes through whole-loan sale premiums on card receivables, ongoing servicing fees, and transactional interchange revenue captured across consumer spend (CI002). This monetization architecture relies on an expansive off-balance-sheet distribution network comprising approximately 220 banking institutions and credit unions that purchase credit assets and accept consumer deposits originated through the platform (CI003). Chartered institution partners, specifically Cross River Bank, Celtic Bank, and Blue Ridge Bank, provide the underlying bank charters and regulatory infrastructure for originations (CI004). By routing credit delivery through embedded partnerships such as the OnePay personal loan integration, Upgrade captures large-scale borrower volume with minimal direct acquisition friction (CI005, CI014).
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI014
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: pricing-mechanics-and-product-terms
    title: Product Pricing Spectrum and Rate Dispersion
    body: The contractual pricing structure across Upgrade product lines reflects a wide risk-based spectrum tailored to mainstream consumers navigating higher borrowing costs. Personal loan facilities, spanning borrowing amounts from $1,000 to $50,000, carry annual percentage rates between 7.74% and 35.99% subject to borrower eligibility and underwriting tiering (CI005). The Upgrade OneCard product operates on a fixed-rate installment model where Pay Later transactions carry APRs between 14.99% and 29.99% without annual or foreign transaction fees, shielding revolving balances from fluctuating variable rates (CI006). Point-of-sale financing via Flex Pay extends installment credit ranging from 0% promotional APR to 36% based on individual creditworthiness (CI007). In entertainment and leisure deployments such as Six Flags season pass financing, FlexPay shifts credit default risk from corporate merchants to third-party lenders while assessing consumer interest rates up to 36% (CI012). This broad APR spread enables Upgrade to maximize conversion across prime and near-prime applicant tiers while charging risk-adjusted yields that preserve institutional buyer appetite.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI012
    tableRefs:
      - TI002
  - id: capital-structure-and-scale-milestones
    title: Capital Structure, Scale Milestones, and Forward Adequacy
    body: Upgrade has scaled its cumulative origination footprint rapidly since its 2017 inception, delivering more than $42 billion in affordable credit to over 7.5 million customers by late 2025 (CI008). Product-level expansion has driven cumulative financing milestones of over $2 billion in home improvement loans and $1 billion in auto refinance volume, illustrating successful multi-product cross-selling beyond general unsecured personal loans (CI009). To bolster its capital foundation and prepare for a potential initial public offering within 12 to 18 months, Upgrade completed a $165 million Series G equity funding round led by Neuberger in October 2025, with participation from LuminArx Capital Management, DST Global, and Ribbit Capital, elevating total equity capital raised since inception to $750 million (CI010). The funding round valued Upgrade at a pre-money valuation of $7.3 billion, representing a 21.7% step-up over its 2021 financing round (CI011). This fresh equity capital provides operational runway, supports continued product development, and enables selective secondary liquidity for early employees and investors prior to public listing.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
    tableRefs:
      - TI003
  - id: financial-verdict-and-diligence-blockers
    title: Financial Verdict and Underwriting Blockers
    body: From an institutional diligence perspective, Upgrade presents an attractive combination of multi-product distribution scale, reported operational profitability, and capital insulation derived from its off-balance-sheet marketplace structure (CI001, CI003). The company $7.3 billion valuation benchmark demonstrates strong institutional support from loan-purchasing partners like Neuberger (CI010). Nonetheless, substantial information barriers prevent conclusive private equity underwriting. Most critically, audited GAAP financial statements remain undisclosed, precluding independent verification of net revenue retention, GAAP operating margins, and true unit-level profitability. Furthermore, because credit products carry APRs reaching up to 36% on discretionary point-of-sale purchases, the platform faces heightened regulatory vulnerability from evolving consumer-protection and rate-cap initiatives (CI012, CI013). Diligence must focus on inspecting vintage default tapes, bank partner warehouse terms, and cap table liquidation preferences before validating common equity value.
    claimRefs:
      - CI001
      - CI003
      - CI010
      - CI012
      - CI013
