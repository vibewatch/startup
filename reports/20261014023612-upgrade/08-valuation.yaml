company:
  name: "Upgrade"
chapter:
  number: 8
  title: "Valuation"
  summary: "Comprehensive valuation diligence on Upgrade assessing its $7.3 billion Series G valuation against secondary market trading discounts, Nevada ILC charter funding implications, and pre-IPO entry hurdles."
sections:
  - id: "sec-v-thesis"
    title: "Investment Thesis, Multi-Product Differentiation, and Strategic Vulnerabilities"
    body: "Upgrade presents a differentiated consumer credit platform that has achieved substantial operating scale, delivering over $53 billion in cumulative credit originations to more than 8.5 million customers across six core lending verticals. The company's core bull thesis centers on its proprietary low-cost distribution architecture across travel partners, contractors, and auto dealerships, enabling efficient customer acquisition and cross-selling from personal loans into installment credit cards, home improvement loans, and point-of-sale financing. However, the anti-thesis highlights critical credit and regulatory risks: financing terms featuring annual percentage rates reaching up to 36 percent expose the platform to severe loss spikes among vulnerable consumer segments, while banking trade group opposition poses ongoing hurdles to its pending Nevada Industrial Loan Company charter application."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV008"
      - "CV012"
    tableRefs:
      - "TV002"
  - id: "sec-v-valuation-framework"
    title: "Financing History, Preference Seniority, and Private Secondary Pricing"
    body: "Upgrade has raised approximately $750 million in primary equity capital since inception, most recently closing a $165 million Series G round in October 2025 led by Neuberger Berman Funds at a $7.3 billion pre-money valuation. While the primary round price of $5.88 reflected an expansion from its 2021 unicorn mark, real-time private secondary market transactions on Forge Global indicate persistent investor caution, with the Forge Price remaining at $3.25 per share through early 2026. This secondary discount of approximately 45 percent signals substantial private market skepticism regarding whether the $7.3 billion headline valuation can hold in public equity markets without transparent, audited GAAP profitability and clarity on senior liquidation preference terms."
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV006"
      - "CV010"
      - "CV013"
  - id: "sec-v-scenarios-comps"
    title: "Scenario Modeling, Multiples Analysis, and Peer Benchmarking"
    body: "At a headline valuation of $7.3 billion against reported annualized revenue run-rates crossing $1.0 billion, Upgrade trades at roughly 7.3 times revenue, an aggressive valuation multiple compared to mature consumer lending peers. Management has signaled an initial public offering target window within 12 to 18 months, making disciplined scenario analysis essential for prospective investors. Under our baseline scenario (55 percent probability), the company executes an IPO at flat valuation multiples of 7.0x to 7.5x revenue, protecting capital for secondary buyers entering at discounted marks while offering limited upside for primary Series G equity. Our bear scenario (25 percent probability) models multiple compression to 3.0x to 4.0x revenue if consumer delinquencies accelerate or bank charter approval is denied, producing a severe valuation contraction to between $3.0 billion and $4.5 billion."
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV006"
      - "CV011"
      - "CV013"
    tableRefs:
      - "TV003"
  - id: "sec-v-recommendation"
    title: "Investment Recommendation, Decision Guardrails, and Thesis-Break Kill Criteria"
    body: "We assign Upgrade an overall recommendation of Track with Medium confidence, a High risk rating, and a Stretched valuation stance. While the platform exhibits undeniable origination velocity and strategic ambition through its Nevada Industrial Loan Company filing, the divergence between primary venture marks and secondary trading values warrants strict capital discipline. Institutional investors should refrain from primary commitments until audited GAAP income statements and cohort default data are publicly filed in an S-1 registration statement. A thesis break requiring an immediate downgrade to Avoid would be triggered if the Nevada ILC charter is rejected by regulators, if 30-day consumer loan delinquencies breach historical bank partner thresholds, or if private down-round financing impairs common equity."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV008"
      - "CV010"
      - "CV014"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
