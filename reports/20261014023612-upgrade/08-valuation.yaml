      - "CV010"
  - id: "TV002"
    title: "Thesis / Anti-Thesis Table"
    columns:
      - "Pillar"
      - "Bullish Thesis Argument"
      - "Bearish Anti-Thesis Counterargument"
      - "What Would Change the View"
    rows:
      - - "Distribution & Origination"
        - "Proprietary partner-bank channels (airlines, contractors, dealerships) deliver low customer acquisition cost and cross-sell across six core credit products."
        - "Co-brand travel and retail channels add partner concentration and platform fees while vulnerable consumers face up to 36% APR credit."
        - "Third-party audited cohort unit economics proving sustainable organic repeat volume across non-travel products."
      - - "Banking Charter & Cost of Funds"
        - "Nevada Industrial Loan Company (ILC) charter filing enables FDIC-insured captive deposits to lower funding costs and increase loan retention flexibility."
        - "ILC charter approval is historically contested by banking trade groups with uncertain regulatory timelines and Fed capital restrictions."
        - "Formal FDIC approval and state issuance of Nevada ILC charter without prohibitive operational restrictions."
      - - "Multi-Product Monetization"
        - "Platform expansion from personal loans into cards, BNPL Flex Pay, auto, and home improvement drives over $53B cumulative credit across 8.5M customers."
        - "Aggressive multi-product expansion into near-prime consumer loans risks asset quality deterioration during macro credit tightening."
        - "Detailed disclosure of 30+ day delinquency rates and net charge-off vintage curves across cards and BNPL."
      - - "Valuation & Exit Liquidity"
        - "May 2025 annualized revenue milestone of $1B and Series G raise of $165M position the company for an IPO in late 2026 / 2027."
        - "Secondary market price of $3.25 implies a 45% discount to Series G $5.88 share price, signaling late-stage private overhang."
        - "Public S-1 filing confirming positive GAAP net margins and clean conversion of Series G preference overhang into common equity."
    notes: "Comparative synthesis of core investment thesis pillars against downside vulnerability vectors and monitoring catalysts."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV007"
      - "CV011"
  - id: "TV003"
    title: "Bull / Base / Bear Scenario Table"
    columns:
      - "Scenario"
      - "Core Operating Assumptions"
      - "Implied Valuation Range"
      - "Key Valuation & Return Logic"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "Nevada ILC charter approved; deposit base reduces cost of funds by 150 bps; revenue grows 25% YoY; successful IPO at 8.0x-10.0x P/S."
        - "$9.0B - $11.0B"
        - "Public market awards neobank multiple comparable to top-tier fintechs; secondary shares achieve 2.0x-2.5x MOIC from current Forge price."
        - "20% probability (conditional on prompt FDIC charter approval and receptive tech IPO window)"
      - - "Base Case"
        - "Hybrid marketplace model maintained; steady origination growth in cards and auto; IPO within 12-18 months at Series G mark (7.0x-7.5x P/S)."
        - "$6.5B - $7.5B"
        - "Valuation holds flat to the October 2025 Series G pre-money valuation of $7.3B; modest return for primary Series G, 1.8x MOIC for secondary buyers at $3.25."
        - "55% probability (baseline expectation given disclosed management timeline and revenue scale)"
      - - "Bear Case"
        - "ILC charter delayed or denied; consumer credit delinquencies rise in 36% APR products; secondary market discount deepens; down-round or IPO at 3.0x-4.0x P/S."
        - "$3.0B - $4.5B"
        - "Multiple compresses to legacy consumer finance peers; Series G preferred liquidation preference wipes out common equity upside."
        - "25% probability (reflects macroeconomic consumer strain and current Forge secondary pricing signal of $3.25)"
    notes: "Scenarios model potential outcomes over an 18-month horizon through the projected 2026-2027 IPO window."
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV006"
      - "CV013"
