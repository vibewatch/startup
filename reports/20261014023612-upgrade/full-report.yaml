chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Scale, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Upgrade, Inc. is a San Francisco-headquartered digital consumer finance platform established to provide
              accessible credit and integrated banking services to mainstream American households. Operating across six
              primary product lines—including fixed-rate personal loans, installment-enabled credit cards, mobile
              checking and savings, buy now pay later financing (Flex Pay), home improvement loans, and auto
              refinancing—Upgrade positions itself as a responsible alternative to revolving high-interest credit card
              debt. Unlike traditional monoline lenders, the company combines direct-to-consumer digital channels with
              embedded merchant checkout partnerships across retail and travel sectors. By distributing products
              directly at merchant points of sale, Upgrade achieves lower customer acquisition costs while progressively
              cross-selling borrowers into deposit accounts and revolving card products. As of late 2025, the platform
              reports having delivered over $42 billion in cumulative credit across more than 7.5 million consumer
              accounts since commencing commercial lending in 2017.
            claimRefs:
              - CO001
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO008
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Upgrade was conceived and established in 2016 by veteran online lending pioneer Renaud Laplanche alongside
              co-founders Adelina Grozdanova, Jeff Bogan, Matt Wierman, Soul Htite, and Visar Nimani. The founding team
              leverages extensive prior experience scaling marketplace credit technology and managing institutional loan
              securitizations. Corporate governance has expanded to accommodate substantial institutional capital,
              underscored by the addition of Peter Sterling, Head of Specialty Finance at Neuberger Berman, to Upgrade's
              Board of Directors following the firm's leadership of the Series G preferred equity round. To manage
              accelerated multi-product operational complexity, executive management added Jeffrey Meiler, former CEO of
              Best Egg, as Chief Operating Officer overseeing consumer lending operations and underwriting efficiency,
              alongside dedicated leadership heads for credit cards and operational strategy. While executive bench
              depth has matured considerably, key-person dependency on Laplanche remains significant given his central
              role in shaping corporate vision, capital markets relationships, and bank distribution channels.
            claimRefs:
              - CO002
              - CO007
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO007
              - CO009
      - number: '1.3'
        title: Financing History, Valuation Trajectory, and Capitalization
        blocks:
          - type: paragraph
            body: >-
              Upgrade has executed a disciplined equity capitalization strategy, accumulating approximately $750 million
              in total equity financing since inception. The company's valuation trajectory accelerated dramatically
              during the fintech investment expansion, rising from early venture rounds to a $3.325 billion pre-money
              valuation in its August 2021 Series E led by Koch Disruptive Technologies, followed quickly by a $280
              million Series F in November 2021 led by Coatue Management and DST Global at a $6 billion valuation. In
              October 2025, amid a broader normalization in private fintech multiples, Upgrade secured a $165 million
              Series G round led by Neuberger Berman Funds with participation from LuminArx Capital Management, DST
              Global, and Ribbit Capital, establishing a pre-money valuation of $7.3 billion. BofA Securities served as
              exclusive placement agent. The capital injection provides liquidity for early stakeholders while
              strengthening the balance sheet ahead of an anticipated initial public offering window over the ensuing 12
              to 18 months.
            claimRefs:
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO010
      - number: '1.4'
        title: Operational Milestones, Bank Charter Strategy, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Since its 2016 incorporation, Upgrade has achieved pivotal operational and product milestones, expanding
              from unsecured personal loans into cards in 2019, acquiring travel BNPL provider Uplift in 2023
              (subsequently rebranded to Flex Pay in December 2024), and reaching cumulative milestones of $2 billion in
              home improvement credit and $1 billion in auto financing. Historically, Upgrade has operated entirely via
              third-party originating bank partnerships—relying primarily on Cross River Bank, Blue Ridge Bank, and
              Celtic Bank to issue credit and host consumer deposits. However, in October 2026, Upgrade announced a
              major structural evolution by submitting formal charter applications to the Nevada Financial Institutions
              Division and the FDIC to establish Upgrade Bank as an industrial loan bank. If approved, an owned bank
              charter would reduce reliance on partner-bank rent-a-charter models and capture deposit funding, but
              introduces heightened regulatory supervision and capital reserve obligations. Additionally, diligence must
              weigh consumer credit risks: revolving balances on Upgrade OneCard incur fixed APRs between 14.99% and
              29.99% that can elevate credit utilization ratios, while Flex Pay installment pricing ranges up to 36%
              APR.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO005
              - CO011
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-Product Cross-Selling Strategy
            body: >-
              Upgrade differentiates from single-product lenders by pairing point-of-sale customer acquisition in travel
              and home improvement with high-margin revolving credit and personal loans, though reliance on third-party
              partner banks introduces ongoing regulatory dependencies.
            calloutType: insight
            claimRefs:
              - CO001
              - CO010
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Architecture, and Core Substitutes
        blocks:
          - type: paragraph
            body: >-
              Upgrade operates across the intersection of non-bank consumer lending, point-of-sale installment
              financing, and digital card products. The company defines its commercial perimeter around mainstream
              credit-seeking consumers who carry revolving debt or require structured liquidity for planned
              expenditures. Unlike mono-line buy-now-pay-later operators focused strictly on small-dollar retail
              checkout carts, Upgrade's product suite spans six core categories: personal installment loans, hybrid
              installment cards, mobile banking, merchant buy-now-pay-later, home improvement contractor financing, and
              automotive purchase and refinance loans. The core economic substitute for Upgrade's offerings remains
              traditional bank-issued revolving credit cards, which profit heavily from compounding finance charges and
              late penalties. By structuring credit with fixed repayment terms, level monthly amortizations, and
              transparent fee structures, Upgrade positions its portfolio as a debt-reduction mechanism rather than a
              perpetual balance-revolving vehicle. However, because credit facilities carry annual percentage rates
              scaling from 0% up to 36% based on borrower risk, Upgrade remains directly linked to broader consumer
              credit performance, macroeconomic interest rate cycles, and depository partner underwriting constraints.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: TAM, SAM, and Multi-Lens Sizing Analysis
        blocks:
          - type: paragraph
            body: >-
              Evaluating Upgrade's total addressable market requires triangulating multiple distinct credit categories
              rather than relying on a single top-down macroeconomic estimate. At the broadest level, the total
              addressable market is bounded by the $1.3 trillion in outstanding U.S. credit card revolving debt
              balances, which represents the aggregate pool of high-interest consumer liabilities vulnerable to
              consolidation. Within that macro pool, the serviceable addressable market is defined by annual U.S.
              unsecured personal loan originations and non-bank installment balances, an industry segment that
              demonstrated 12% year-over-year balance expansion in 2025 according to financial sector tracking.
              Complementing this balance-transfer and consolidation market is the rapid emergence of embedded
              point-of-sale credit, where enterprise forecasts project global embedded finance transaction volumes to
              approach $7.2 trillion by 2027. Point-of-sale travel and leisure financing constitutes an immediate
              high-velocity vertical, supported by consumer research showing that 17% of summer travelers actively
              utilize installment options to budget major trip expenses. Upgrade's serviceable obtainable volume is
              constrained by its partner-bank funding capacity and risk tolerance, resulting in an estimated $12 billion
              to $15 billion annualized origination run-rate across its diversified lending verticals.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM009
              - CM011
      - number: '2.3'
        title: Buyer Segmentation, B2B Distribution Channels, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Upgrade addresses distinct consumer segments through a bifurcated acquisition architecture combining
              direct consumer acquisition with proprietary enterprise distribution partnerships. The consumer base is
              primarily comprised of mainstream credit users who maintain fair-to-prime credit profiles but face
              escalating borrowing costs under traditional revolving cards. Rather than competing exclusively against
              fintech competitors for expensive direct-to-consumer search and social advertising clicks, Upgrade deploys
              low-cost merchant and enterprise distribution channels. These partnerships encompass hundreds of
              commercial airlines, cruise lines, and hospitality platforms through its Flex Pay division, as well as
              thousands of residential home improvement contractors and automotive dealerships nationwide. In
              hospitality and travel, Upgrade partners with industry connectivity platforms such as Hapi to automate
              property-level payment reconciliation across global hotel chains, resolving complex booking workflows and
              virtual credit card exceptions. This embedded distribution allows Upgrade to capture borrowers at the
              transactional point of need, while passing customer acquisition efficiencies into competitive loan pricing
              and underwriting margins across its 7.5 million historical customer accounts.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Regulatory Friction
        blocks:
          - type: paragraph
            body: >-
              The primary secular growth tailwind propelling Upgrade's platform adoption is consumer dissatisfaction
              with compounding credit card interest and the rising demand for disciplined, amortizing payment options.
              However, several material adoption constraints and structural frictions govern long-term market
              penetration. First, macroeconomic capital market volatility has dampened venture capital investment into
              retail consumer fintech platforms, which fell 49% year-over-year in recent industry funding data, raising
              the cost of secondary capital and portfolio equity financing. Second, Upgrade's reliance on originating
              partner banks—specifically Cross River Bank, Blue Ridge Bank, and Celtic Bank—creates ongoing exposure to
              regulatory scrutiny regarding fintech-bank third-party risk management and depository compliance. Third,
              while Upgrade promotes responsible borrowing, its risk-based APR pricing architecture reaches up to 35.99%
              or 36.00% on certain installment and personal loan contracts. For lower-tier mainstream borrowers, these
              high APR ceilings carry elevated delinquency hazards during sustained inflationary environments, requiring
              rigorous automated underwriting to prevent margin compression from rising credit loss provisions.
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Proprietary Distribution Economics in High-CAC Environment
            body: >-
              Upgrade's multi-channel B2B2C distribution model—integrating Flex Pay directly into airlines, hotel
              connectivity platforms like Hapi, theme park operators like Six Flags, and home improvement contractor
              networks—structurally insulates the platform from escalating direct-to-consumer digital acquisition costs
              that have compressed margins for mono-line consumer lenders.
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
              - CM012
          - type: callout
            title: High-APR Concentration and Vulnerable Consumer Exposure
            body: >-
              While Upgrade positions its fixed-rate installment card and personal loan products as responsible
              alternatives to compounding credit card revolving debt, point-of-sale and personal loan APR tiers reaching
              up to 35.99% or 36.00% expose lower-credit borrowers to substantial carrying costs, creating heightened
              regulatory scrutiny and credit-cycle sensitivity as consumer savings buffers compress.
            calloutType: risk
            claimRefs:
              - CM003
              - CM010
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Structural Categorization
        blocks:
          - type: paragraph
            body: >-
              The consumer credit ecosystem in which Upgrade operates spans four distinct competitive archetypes:
              digital neobanks, standalone digital personal lenders, point-of-sale buy-now-pay-later networks, and
              entrenched money-center commercial banks. Historically, fintech lenders emerged as monoline personal loan
              providers focused strictly on prime balance consolidation. Upgrade, founded by LendingClub co-founder
              Renaud Laplanche, intentionally bypassed this monoline trajectory by establishing a diversified
              multi-product platform that pairs consumer credit with installment cards, mobile banking, and specialized
              installment verticals. Having delivered over $42 billion in credit to 7.5 million borrowers, Upgrade
              competes directly against scaled digital neobanks like SoFi Technologies, legacy marketplace lenders like
              LendingClub, and traditional banking giants like JPMorgan Chase and Citibank. Its $165 million Series G
              equity round at a $7.3 billion valuation supplies growth capital to challenge traditional credit card
              providers, whose $1.3 trillion in aggregate revolving balances represent the primary pool of consumer
              spend Upgrade targets.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: Capability and Distribution Differentiation
        blocks:
          - type: paragraph
            body: >-
              Upgrade's core structural advantage stems from its dual differentiation strategy: hybrid card product
              architecture and proprietary partner distribution networks. Traditional credit cards rely on revolving
              balances and fee compounding, whereas Upgrade OneCard introduces a dual-action mechanism allowing
              consumers to pay immediately from checking or spread purchases over fixed amortizing installments without
              compound penalties. To solve the persistent fintech challenge of escalating digital customer acquisition
              costs, Upgrade has constructed proprietary distribution channels across three non-traditional verticals.
              In travel and hospitality, its Flex Pay BNPL platform serves over 750 travel brands and automates hotel
              reservation workflows via connectivity partners like Hapi. In home improvement, Upgrade partners with more
              than 2,000 contractor firms to originate project loans, while its indirect auto finance network connects
              over 1,000 auto dealerships. Simultaneously, Upgrade syndicates loan originations to a network of over 200
              depository credit unions, facilitating prime loan sales without retaining portfolio credit risk on its own
              balance sheet.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.3'
        title: Pricing Models and Customer Economic Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging across consumer installment credit reflect sharp structural tradeoffs between
              flexibility, borrower transparency, and platform monetization. Upgrade OneCard establishes transparent
              fixed regular APRs ranging from 14.99% to 29.99% with zero annual fee, positioning its cost structure
              favorably against revolving card penalty APRs that frequently exceed 30%. On the point-of-sale front, Flex
              Pay offers 0% to 36% APR financing terms across 24-month durations for high-ticket merchant purchases. By
              structuring card balances as fixed-rate installment loans rather than open-ended revolving lines, Upgrade
              enforces programmatic debt reduction. However, because personal lending operates without high switching
              costs or technological lock-in, rate-sensitive consumers frequently multi-home across competing loan
              aggregators and balance transfer promotions. Upgrade counters this customer attrition by bundling rewards
              checking and high-yield savings to cross-sell primary banking relationships.
            claimRefs:
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
      - number: '3.4'
        title: Moat Durability and Substitution Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Evaluating Upgrade's competitive moat requires examining structural switching barriers, distribution
              durability, and incumbent response risks. Unlike enterprise software companies that benefit from high data
              stickiness, consumer lending platforms exhibit minimal technical switching friction. Borrowers can easily
              substitute an Upgrade personal loan or OneCard with an offer from Marcus, Discover, or local credit unions
              if terms diverge. Furthermore, money-center banks maintain structural advantages through zero-cost retail
              core deposits, whereas Upgrade relies on third-party banking infrastructure, such as Cross River Bank, and
              institutional loan purchase appetites. Upgrade's defensibility resides primarily in its specialized
              point-of-sale merchant integrations and deep credit union purchase commitments. Competitors attempting to
              replicate Flex Pay's travel presence must negotiate complex hospitality PMS integrations and establish
              balance-sheet syndication with hundreds of regional institutions. Nonetheless, sustained moat durability
              will depend on Upgrade's ability to convert transactional merchant borrowers into multi-product primary
              banking depositors.
            claimRefs:
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Channel Diversification Mitigates Digital Acquisition Inflation
            body: >-
              Upgrade's decision to acquire Uplift (now Flex Pay) and develop merchant networks across 2,000 contractors
              and 1,000 auto dealerships grants proprietary customer acquisition access. By embedding financing at
              points of high consumer intent, Upgrade sidesteps search-engine and affiliate aggregator price inflation
              that compresses margins for direct-to-consumer monoline lenders.
            calloutType: insight
            claimRefs:
              - CP003
              - CP009
              - CP011
          - type: callout
            title: Balance-Sheet Intermediation Risk Across Depository Partners
            body: >-
              While Upgrade's network of 200+ credit union buyers eliminates balance-sheet equity drag, it introduces
              secondary channel vulnerability. Should liquidity conditions tighten across regional credit unions or loan
              purchase appetites retrench, Upgrade must redirect loan origination volume toward higher-yield
              institutional asset managers, potentially compressing origination margins.
            calloutType: risk
            claimRefs:
              - CP005
              - CP007
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Upgrade has established a diversified, capital-light revenue model across six core consumer-credit and
              banking product categories, designed to generate multi-stream monetization without retaining balance-sheet
              credit exposure. The primary engine of platform monetization centers on personal loan originations, where
              Upgrade charges borrowers an upfront fee of approximately 5% on disbursed principal while securing
              recurring servicing fees and gains on sale as whole loans are sold at par value to institutional buyers
              (CI001). In its credit card operations, including the hybrid installment OneCard, Upgrade monetizes
              through whole-loan sale premiums on card receivables, ongoing servicing fees, and transactional
              interchange revenue captured across consumer spend (CI002). This monetization architecture relies on an
              expansive off-balance-sheet distribution network comprising approximately 220 banking institutions and
              credit unions that purchase credit assets and accept consumer deposits originated through the platform
              (CI003). Chartered institution partners, specifically Cross River Bank, Celtic Bank, and Blue Ridge Bank,
              provide the underlying bank charters and regulatory infrastructure for originations (CI004). By routing
              credit delivery through embedded partnerships such as the OnePay personal loan integration, Upgrade
              captures large-scale borrower volume with minimal direct acquisition friction (CI005, CI014).
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
      - number: '4.2'
        title: Product Pricing Spectrum and Rate Dispersion
        blocks:
          - type: paragraph
            body: >-
              The contractual pricing structure across Upgrade product lines reflects a wide risk-based spectrum
              tailored to mainstream consumers navigating higher borrowing costs. Personal loan facilities, spanning
              borrowing amounts from $1,000 to $50,000, carry annual percentage rates between 7.74% and 35.99% subject
              to borrower eligibility and underwriting tiering (CI005). The Upgrade OneCard product operates on a
              fixed-rate installment model where Pay Later transactions carry APRs between 14.99% and 29.99% without
              annual or foreign transaction fees, shielding revolving balances from fluctuating variable rates (CI006).
              Point-of-sale financing via Flex Pay extends installment credit ranging from 0% promotional APR to 36%
              based on individual creditworthiness (CI007). In entertainment and leisure deployments such as Six Flags
              season pass financing, FlexPay shifts credit default risk from corporate merchants to third-party lenders
              while assessing consumer interest rates up to 36% (CI012). This broad APR spread enables Upgrade to
              maximize conversion across prime and near-prime applicant tiers while charging risk-adjusted yields that
              preserve institutional buyer appetite.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
      - number: '4.3'
        title: Capital Structure, Scale Milestones, and Forward Adequacy
        blocks:
          - type: paragraph
            body: >-
              Upgrade has scaled its cumulative origination footprint rapidly since its 2017 inception, delivering more
              than $42 billion in affordable credit to over 7.5 million customers by late 2025 (CI008). Product-level
              expansion has driven cumulative financing milestones of over $2 billion in home improvement loans and $1
              billion in auto refinance volume, illustrating successful multi-product cross-selling beyond general
              unsecured personal loans (CI009). To bolster its capital foundation and prepare for a potential initial
              public offering within 12 to 18 months, Upgrade completed a $165 million Series G equity funding round led
              by Neuberger in October 2025, with participation from LuminArx Capital Management, DST Global, and Ribbit
              Capital, elevating total equity capital raised since inception to $750 million (CI010). The funding round
              valued Upgrade at a pre-money valuation of $7.3 billion, representing a 21.7% step-up over its 2021
              financing round (CI011). This fresh equity capital provides operational runway, supports continued product
              development, and enables selective secondary liquidity for early employees and investors prior to public
              listing.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI003
              - CI008
              - CI010
      - number: '4.4'
        title: Financial Verdict and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional diligence perspective, Upgrade presents an attractive combination of multi-product
              distribution scale, reported operational profitability, and capital insulation derived from its
              off-balance-sheet marketplace structure (CI001, CI003). The company $7.3 billion valuation benchmark
              demonstrates strong institutional support from loan-purchasing partners like Neuberger (CI010).
              Nonetheless, substantial information barriers prevent conclusive private equity underwriting. Most
              critically, audited GAAP financial statements remain undisclosed, precluding independent verification of
              net revenue retention, GAAP operating margins, and true unit-level profitability. Furthermore, because
              credit products carry APRs reaching up to 36% on discretionary point-of-sale purchases, the platform faces
              heightened regulatory vulnerability from evolving consumer-protection and rate-cap initiatives (CI012,
              CI013). Diligence must focus on inspecting vintage default tapes, bank partner warehouse terms, and cap
              table liquidation preferences before validating common equity value.
            claimRefs:
              - CI001
              - CI003
              - CI010
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Marketplace Architecture Insulates Capital While Requiring Institutional Liquidity
            body: >-
              By routing loan originations and deposits through chartered partner banks like Cross River Bank and
              distributing whole loans to over 220 credit unions, Upgrade operates without retaining balance-sheet
              credit risk. This structural choice shields platform profitability from direct consumer defaults during
              credit downturns. However, it creates an acute dependency on secondary market liquidity: any institutional
              hesitation to buy loans or regulatory restriction on partner banks would immediately constrain origination
              throughput.
            calloutType: insight
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI014
          - type: callout
            title: High Consumer APR Ceilings Expose Embedded Lending to Scrutiny
            body: >-
              With personal loan APRs reaching 35.99% and Flex Pay leisure installment rates scaling up to 36%, Upgrade
              pricing model captures subprime risk premiums on point-of-sale and personal credit products. In leisure
              financing, shifting credit risk to consumers through high-APR installments creates reputational and
              regulatory vulnerabilities, particularly as state rate caps and CFPB scrutiny around embedded credit
              products intensify.
            calloutType: risk
            claimRefs:
              - CI005
              - CI007
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Product Portfolio and Consumer Workflow Delivery
        blocks:
          - type: paragraph
            body: >-
              Upgrade delivers a unified consumer credit and banking suite spanning six core product lines: personal
              loans, installment-enabled credit cards, mobile banking deposits, buy now, pay later (BNPL) point-of-sale
              financing, home improvement loans, and auto financing. Rather than functioning as a monoline unsecured
              personal lender, Upgrade structures its consumer workflow around an integrated digital mobile and web
              experience that consolidates borrowing, transacting, and credit tracking. The product portfolio originated
              with fixed-rate personal loans designed for debt consolidation, where borrowers obtain structured 3- to
              7-year installment terms. Over time, the platform expanded into retail and point-of-sale workflows,
              deploying the Upgrade OneCard and Flex Pay products to capture everyday transactions and merchant checkout
              events. Cumulative consumer originations surpassed $42 billion across more than 7.5 million customers by
              late 2025, expanding past $50 billion and 8 million users in 2026 partner records, with home improvement
              and auto financing originations contributing over $2 billion and $1 billion respectively. The
              point-of-sale BNPL capability was accelerated through the $100 million acquisition of Uplift, anchoring
              Upgrade's embedded installment presence across airlines, cruise lines, and hospitality platforms.
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
