      - number: '5.2'
        title: Marketplace Technology Architecture and Bank-Partner Operating Rails
        blocks:
          - type: paragraph
            body: >-
              Upgrade operates technically and operationally as a balance-sheet-light credit marketplace rather than a
              chartered depository institution. Loans and deposit balances do not reside on Upgrade's balance sheet;
              instead, credit origination and account issuance are executed through banking-as-a-service (BaaS)
              infrastructure provided by partner depository institutions. Personal loans, personal credit lines, and
              deposit accounts are originated primarily through Cross River Bank and Blue Ridge Bank, while credit cards
              are issued by Cross River Bank and Sutton Bank, with commercial facilities supported by Celtic Bank.
              Upgrade's proprietary technology stack provides the front-end user experience, partner API integration
              layer, automated underwriting logic, and post-origination servicing engine. Following origination, loans
              are sold at par or premium to a distribution network of more than 200 financial institution
              buyers—principally credit unions seeking high-yielding prime consumer assets with custom buy-book
              criteria. Upgrade retains complete servicing responsibility throughout the asset lifecycle, maintaining
              customer relationships and payment operations while collecting upfront platform fees, recurring servicing
              fees, and card interchange revenue.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE011
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE011
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE011
              - CE012
              - CE013
      - number: '5.3'
        title: Credit Underwriting Differentiation, Embedded Rails, and Technical Risk Factors
        blocks:
          - type: paragraph
            body: >-
              Upgrade differentiates its underwriting technology by combining traditional bureau scores with real-time
              cash flow verification and open-banking transaction telemetry. By analyzing banking transaction histories
              and applicant debt-to-income profiles, Upgrade targets 'periodic revolvers' and near-prime borrowers,
              offering annual percentage rates typically 300 to 400 basis points below traditional credit card revolvers
              for comparable credit tiers. The company has extended this underwriting capability beyond
              direct-to-consumer surfaces by exposing embedded credit APIs to ecosystem partners. In embedded personal
              lending, Upgrade powers the OnePay application, allowing consumers to pre-qualify and obtain loans up to
              $50,000 directly within third-party digital wallets. Similarly, through hospitality middleware partner
              Hapi, Upgrade automates Flex Pay virtual credit card generation and property management system
              reconciliation across hotel chains above-property. However, this operating architecture exposes Upgrade to
              material partner-dependency risks, regulatory BaaS scrutiny under third-party risk management guidance,
              and consumer credit concerns stemming from Flex Pay's risk-based APR pricing reaching up to 36% for
              vulnerable borrowers.
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: BaaS Partner Concentration and Regulatory Dependency
            body: >-
              Upgrade's reliance on a concentrated cluster of bank partners—primarily Cross River Bank and Blue Ridge
              Bank—creates systemic regulatory and operational dependency. In recent years, federal banking agencies
              (FDIC, OCC, Federal Reserve) have intensified oversight of bank-fintech partnerships, issuing formal
              enforcement orders and stricter third-party risk management guidance across the BaaS sector. Any
              regulatory disruption, consent order, or operational limitation placed on Cross River or Blue Ridge could
              directly impede Upgrade's origination throughput, card issuance, or deposit account administration.
            calloutType: risk
            claimRefs:
              - CE002
              - CE003
          - type: callout
            title: Embedded Finance Integration as an Acquisition Moat
            body: >-
              Upgrade's expansion into embedded finance through partner platforms like OnePay and hospitality automation
              provider Hapi creates low-cost, proprietary distribution moats that bypass conventional direct-to-consumer
              search acquisition. By integrating credit underwriting directly into third-party payment workflows,
              Upgrade captures prime and near-prime borrowers at the immediate point of need, lowering customer
              acquisition costs and creating cross-sell pipelines for its broader multi-product financial suite.
            calloutType: insight
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Borrower Demographics
        blocks:
          - type: paragraph
            body: >-
              Upgrade targets mainstream American consumers across multiple distinct credit and liquidity needs,
              segmenting its borrower base across personal unsecured credit, residential home improvement financing,
              auto purchase and refinance contracts, and point-of-sale installment lending. Rather than competing solely
              as a subprime or near-prime alternative lender, Upgrade's primary depository-funded credit portfolios
              exhibit distinctly prime credit characteristics. In personal loans, which represent the platform's core
              debt-consolidation engine, borrowers carry a weighted average FICO score of approximately 731 and an
              average household income of $161,000, with over 80% utilizing proceeds to consolidate existing obligations
              into fixed-rate amortizing installment debt. In home improvement financing, borrower quality skews even
              higher, demonstrating a weighted average credit score of 786 FICO and an average income near $159,000
              across a borrower pool where 84.76% are verified homeowners. This demographic positioning allows Upgrade
              to package attractive prime credit assets for traditional depository institutions seeking yield
              replacement while avoiding unsecured subprime default volatility.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU007
              - CU008
      - number: '6.2'
        title: Adoption Trajectory and Cumulative Credit Scale
        blocks:
          - type: paragraph
            body: >-
              Upgrade has demonstrated sustained origination momentum since its founding in 2017, scaling from a
              pure-play personal loan originator into a multi-product consumer finance platform. The platform reached
              cumulative credit delivery milestones of over $42 billion across more than 7.5 million customers by late
              2025, expanding toward $50 billion across 8 million consumers through 2026. Growth has been accelerated by
              rapid line extensions into secured and specialized consumer lending verticals. Specifically, Upgrade
              scaled its home improvement financing product to $2 billion in cumulative volume within three years of
              introduction, while auto financing reached $1 billion in cumulative originations within two years of
              launch. Despite these impressive top-line cumulative metrics, public disclosures lack periodic
              active-account counts, monthly active borrower metrics, or annualized origination denominators, making it
              challenging to differentiate newly acquired borrowers from repeat users or measure true active wallet
              retention over time.
            claimRefs:
              - CU001
              - CU007
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU007
              - CU014
      - number: '6.3'
        title: Institutional Deployments and Named Merchant Evidence
        blocks:
          - type: paragraph
            body: >-
              Upgrade's commercial model operates as a two-sided network linking capital providers with consumer
              distribution channels. On the capital supply side, Upgrade has established formal partnerships with more
              than 200 depository financial institutions and credit unions that purchase originated loans to diversify
              their balance sheets and replace compressed interest margins. On the consumer distribution side, Upgrade
              differentiates itself from traditional fintechs by bypassing paid search acquisition in favor of embedded
              merchant networks. Following its $100 million acquisition of Uplift, Upgrade deploys its Flex Pay BNPL
              solution across hundreds of commercial airlines, cruise operators, and hotel technology platforms such as
              Hapi, which automates virtual card settlements across thousands of hospitality properties. Additionally,
              high-profile leisure operators including Six Flags Entertainment have deployed Upgrade FlexPay to finance
              season passes and merchandise orders exceeding $49. While this outsources collections and risk from the
              merchant, consumer advocates note that risk-based APRs up to 36% impose high carrying costs on
              credit-stretched visitors.
            claimRefs:
              - CU003
              - CU006
              - CU009
              - CU010
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU006
              - CU009
              - CU010
              - CU013
      - number: '6.4'
        title: Customer Journey, Cross-Sell Loops, and Retention Durability
        blocks:
          - type: paragraph
            body: >-
              The central thesis of Upgrade's multi-product strategy is creating an integrated consumer financial
              journey that transitions low-cost merchant point-of-sale borrowers into high-lifetime-value banking and
              credit relationships. Consumers initially encounter Upgrade during checkout for travel, home contractor
              repairs, or theme park tickets, where real-time risk underwriting approves promotional 0% or risk-adjusted
              installment plans. Following transaction settlement, users are onboarded into the Upgrade mobile app,
              where they can manage installment schedules and access Rewards Checking deposit accounts. Upgrade
              subsequently cross-sells higher-tier offerings, including the hybrid Upgrade OneCard—which allows users to
              toggle between Pay Now checking debits and Pay Later installments at 14.99% to 29.99% fixed APR—as well as
              larger personal consolidation loans. Furthermore, Upgrade has actively adapted customer discovery toward
              artificial intelligence-driven search visibility. However, because Upgrade does not disclose Net Revenue
              Retention (NRR) or multi-year cohort retention curves, the long-term durability of these cross-sell
              conversion loops remains a material diligence gap.
            claimRefs:
              - CU002
              - CU006
              - CU008
              - CU010
              - CU011
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU008
              - CU011
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Merchant Acquisition Engine vs. Retention Transparency
            body: >-
              Upgrade's multi-channel distribution network with airlines, cruise lines, contractor networks, and theme
              parks provides a structural cost advantage over pure-play consumer lenders that rely on expensive search
              advertising. However, the true durability of this flywheel hinges on cohort conversion: whether
              point-of-sale borrowers stick around to adopt core deposit and card products, a metric management has yet
              to disclose publicly.
            calloutType: insight
            claimRefs:
              - CU006
              - CU008
              - CU010
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Analysis
        blocks:
          - type: paragraph
            body: >-
              Upgrade operates as a non-bank financial technology platform that originates consumer loans,
              installment-enabled credit cards, and deposit accounts through third-party depository institutions
              including Cross River Bank, Blue Ridge Bank, and Celtic Bank [CR002, CR003]. This partner-bank structural
              architecture isolates Upgrade from direct national banking charter obligations but exposes the firm to
              intensifying regulatory scrutiny under federal interagency guidance on third-party risk management [CR002,
              CR011]. Heightened regulatory enforcement directed at banking-as-a-service (BaaS) sponsor institutions
              creates structural operational exposure, as consent orders or regulatory mandates restricting sponsor-bank
              growth directly constrain Upgrade's origination bandwidth [CR001, CR003]. Furthermore, consumer financial
              protection scrutiny surrounding buy-now-pay-later (BNPL) credit and high-APR installment lending poses
              material compliance risks [CR004, CR005]. Upgrade's Flex Pay point-of-sale financing features APRs ranging
              from 0% up to 36.00% depending on consumer credit underwriting [CR005], drawing public scrutiny and
              adverse consumer advocacy regarding risk-based leisure financing and potential debt-trap dynamics [CR004].
              State usury challenges, evolving CFPB guidance on non-bank installment lending, and true-lender legal
              recharacterization threats represent persistent regulatory contingencies that could impair multi-state
              product consistency or force structural changes to origination fees and contractual interest sharing
              [CR002, CR004].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR011
      - number: '7.2'
        title: Partner and Counterparty Dependency Exposure
        blocks:
          - type: paragraph
            body: >-
              The platform's operational continuity is fundamentally dependent on specialized banking partners and
              institutional capital providers across its multi-product ecosystem [CR001, CR002]. Cross River Bank serves
              as the primary infrastructure backbone across four core product lines, providing payment settlement,
              deposit accounts, card issuance APIs, and critical credit facility capacity [CR001]. While Cross River
              expanded Upgrade's revolving credit line from $150 million to $250 million secured by personal credit line
              assets in 2026 [CR001], this high degree of counterparty concentration creates systemic vulnerability to
              operational disruptions, sponsor credit limit adjustments, or regulatory friction at Cross River [CR001,
              CR003]. On the funding distribution side, Upgrade relies on whole-loan sales to institutional investors
              and specialized credit funds, alongside a participating network of credit unions and regional banks
              [CR002]. The leadership and governance structure of Upgrade's Series G financing further underscores
              institutional capital dependency: lead investor Neuberger Berman also acts as an institutional purchaser
              of Upgrade's originated loan assets, with its Head of Specialty Finance Peter Sterling holding a board
              seat [CR007, CR010]. If institutional capital partners demand higher loss absorption or reduce loan
              purchase volumes during macroeconomic credit tightening, Upgrade's balance-sheet velocity, origination
              capacity, and transactional fee generation would experience severe compression [CR002, CR007, CR010].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR010
              - CR011
      - number: '7.3'
        title: Operational, Credit Model, and Financial Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Upgrade's financial model relies on high-velocity credit origination fees, interest sharing, and loan
              servicing fees while operating with significant sensitivity to macroeconomic consumer credit conditions
              [CR002]. A substantial proportion of Upgrade's target market comprises mainstream near-prime and
              middle-market consumer borrowers seeking debt consolidation or point-of-sale financing [CR002, CR004,
              CR005]. When cardholders utilize installment features on revolving cards such as Upgrade OneCard, high
              credit utilization ratios can depress borrower credit scores and accelerate repayment defaults during
              periods of sustained inflationary pressure [CR006]. In hospitality and leisure checkout integrations, such
              as hotel booking automation via Hapi or theme park ticket financing, BNPL default risk transfers to
              Upgrade and its institutional capital partners, exposing loss reserves to discretionary consumer spending
              shocks [CR004, CR005, CR012]. As Upgrade prepares for a prospective initial public offering within a 12 to
              18-month execution horizon [CR008, CR009], management must demonstrate GAAP earnings durability across
              volatile rate cycles without relying on aggressive private valuation multiples [CR007, CR008, CR009].
              Executive governance concentration presents an additional key-person consideration given co-founder and
              CEO Renaud Laplanche's centralized leadership role, necessitating rigorous institutional oversight ahead
              of public market scrutiny [CR002, CR008].
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: BaaS Sponsor Bank Regulatory Vulnerability
            body: >-
              Upgrade's lack of an independent banking charter necessitates reliance on depository partners like Cross
              River Bank. Federal regulatory enforcement against sponsor banks represents an existential channel risk
              that cannot be entirely mitigated by contract covenants.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Credit Tightening and Institutional Capital Elasticity
            body: >-
              The dual role of institutional partners as both equity shareholders and loan buyers creates circular
              capital exposure. A pullback in third-party loan purchases would constrain origination velocity and
              squeeze fee margins.
            calloutType: risk
            claimRefs:
              - CR002
              - CR007
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Multi-Product Differentiation, and Strategic Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Upgrade presents a differentiated consumer credit platform that has achieved substantial operating scale,
              delivering over $53 billion in cumulative credit originations to more than 8.5 million customers across
              six core lending verticals. The company's core bull thesis centers on its proprietary low-cost
              distribution architecture across travel partners, contractors, and auto dealerships, enabling efficient
              customer acquisition and cross-selling from personal loans into installment credit cards, home improvement
              loans, and point-of-sale financing. However, the anti-thesis highlights critical credit and regulatory
              risks: financing terms featuring annual percentage rates reaching up to 36 percent expose the platform to
              severe loss spikes among vulnerable consumer segments, while banking trade group opposition poses ongoing
              hurdles to its pending Nevada Industrial Loan Company charter application.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV011
      - number: '8.2'
        title: Financing History, Preference Seniority, and Private Secondary Pricing
        blocks:
          - type: paragraph
            body: >-
              Upgrade has raised approximately $750 million in primary equity capital since inception, most recently
              closing a $165 million Series G round in October 2025 led by Neuberger Berman Funds at a $7.3 billion
              pre-money valuation. While the primary round price of $5.88 reflected an expansion from its 2021 unicorn
              mark, real-time private secondary market transactions on Forge Global indicate persistent investor
              caution, with the Forge Price remaining at $3.25 per share through early 2026. This secondary discount of
              approximately 45 percent signals substantial private market skepticism regarding whether the $7.3 billion
              headline valuation can hold in public equity markets without transparent, audited GAAP profitability and
              clarity on senior liquidation preference terms.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV010
              - CV013
      - number: '8.3'
        title: Scenario Modeling, Multiples Analysis, and Peer Benchmarking
        blocks:
          - type: paragraph
            body: >-
              At a headline valuation of $7.3 billion against reported annualized revenue run-rates crossing $1.0
              billion, Upgrade trades at roughly 7.3 times revenue, an aggressive valuation multiple compared to mature
              consumer lending peers. Management has signaled an initial public offering target window within 12 to 18
              months, making disciplined scenario analysis essential for prospective investors. Under our baseline
              scenario (55 percent probability), the company executes an IPO at flat valuation multiples of 7.0x to 7.5x
              revenue, protecting capital for secondary buyers entering at discounted marks while offering limited
              upside for primary Series G equity. Our bear scenario (25 percent probability) models multiple compression
              to 3.0x to 4.0x revenue if consumer delinquencies accelerate or bank charter approval is denied, producing
              a severe valuation contraction to between $3.0 billion and $4.5 billion.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV013
      - number: '8.4'
        title: Investment Recommendation, Decision Guardrails, and Thesis-Break Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              We assign Upgrade an overall recommendation of Track with Medium confidence, a High risk rating, and a
              Stretched valuation stance. While the platform exhibits undeniable origination velocity and strategic
              ambition through its Nevada Industrial Loan Company filing, the divergence between primary venture marks
              and secondary trading values warrants strict capital discipline. Institutional investors should refrain
              from primary commitments until audited GAAP income statements and cohort default data are publicly filed
              in an S-1 registration statement. A thesis break requiring an immediate downgrade to Avoid would be
              triggered if the Nevada ILC charter is rejected by regulators, if 30-day consumer loan delinquencies
              breach historical bank partner thresholds, or if private down-round financing impairs common equity.
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV011
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Valuation Stance: Maintain Track Recommendation'
            body: >-
              Upgrade presents significant commercial traction with over $53 billion in cumulative credit originations
              and an annualized revenue run-rate exceeding $1.0 billion. However, entering at the primary $7.3 billion
              Series G valuation is stretched when secondary transactions price shares at a 45 percent discount.
              Institutional investors should track the name pending audited GAAP disclosures and IPO S-1 filing
              transparency.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV013
          - type: callout
            title: 'Key Vulnerability: High APR Exposure and Charter Uncertainty'
            body: >-
              The multi-product lending platform relies on point-of-sale financing with APRs escalating up to 36 percent
              for vulnerable borrowers. While the pending Nevada Industrial Loan Company charter application represents
              a strategic move toward lower-cost captive deposits, regulatory approval remains uncertain and contested
              by traditional banking groups.
            calloutType: risk
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV014
