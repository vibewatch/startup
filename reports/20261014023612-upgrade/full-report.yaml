  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Pillar
      - Bullish Thesis Argument
      - Bearish Anti-Thesis Counterargument
      - What Would Change the View
    rows:
      - - Distribution & Origination
        - >-
          Proprietary partner-bank channels (airlines, contractors, dealerships) deliver low customer acquisition cost
          and cross-sell across six core credit products.
        - >-
          Co-brand travel and retail channels add partner concentration and platform fees while vulnerable consumers
          face up to 36% APR credit.
        - >-
          Third-party audited cohort unit economics proving sustainable organic repeat volume across non-travel
          products.
      - - Banking Charter & Cost of Funds
        - >-
          Nevada Industrial Loan Company (ILC) charter filing enables FDIC-insured captive deposits to lower funding
          costs and increase loan retention flexibility.
        - >-
          ILC charter approval is historically contested by banking trade groups with uncertain regulatory timelines and
          Fed capital restrictions.
        - Formal FDIC approval and state issuance of Nevada ILC charter without prohibitive operational restrictions.
      - - Multi-Product Monetization
        - >-
          Platform expansion from personal loans into cards, BNPL Flex Pay, auto, and home improvement drives over $53B
          cumulative credit across 8.5M customers.
        - >-
          Aggressive multi-product expansion into near-prime consumer loans risks asset quality deterioration during
          macro credit tightening.
        - Detailed disclosure of 30+ day delinquency rates and net charge-off vintage curves across cards and BNPL.
      - - Valuation & Exit Liquidity
        - >-
          May 2025 annualized revenue milestone of $1B and Series G raise of $165M position the company for an IPO in
          late 2026 / 2027.
        - >-
          Secondary market price of $3.25 implies a 45% discount to Series G $5.88 share price, signaling late-stage
          private overhang.
        - >-
          Public S-1 filing confirming positive GAAP net margins and clean conversion of Series G preference overhang
          into common equity.
    notes: >-
      Comparative synthesis of core investment thesis pillars against downside vulnerability vectors and monitoring
      catalysts.
