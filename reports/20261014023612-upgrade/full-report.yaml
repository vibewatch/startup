      - CV003
      - CV007
      - CV011
  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Implied Valuation Range
      - Key Valuation & Return Logic
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Nevada ILC charter approved; deposit base reduces cost of funds by 150 bps; revenue grows 25% YoY; successful
          IPO at 8.0x-10.0x P/S.
        - $9.0B - $11.0B
        - >-
          Public market awards neobank multiple comparable to top-tier fintechs; secondary shares achieve 2.0x-2.5x MOIC
          from current Forge price.
        - 20% probability (conditional on prompt FDIC charter approval and receptive tech IPO window)
      - - Base Case
        - >-
          Hybrid marketplace model maintained; steady origination growth in cards and auto; IPO within 12-18 months at
          Series G mark (7.0x-7.5x P/S).
        - $6.5B - $7.5B
        - >-
          Valuation holds flat to the October 2025 Series G pre-money valuation of $7.3B; modest return for primary
          Series G, 1.8x MOIC for secondary buyers at $3.25.
        - 55% probability (baseline expectation given disclosed management timeline and revenue scale)
      - - Bear Case
        - >-
          ILC charter delayed or denied; consumer credit delinquencies rise in 36% APR products; secondary market
          discount deepens; down-round or IPO at 3.0x-4.0x P/S.
        - $3.0B - $4.5B
        - >-
          Multiple compresses to legacy consumer finance peers; Series G preferred liquidation preference wipes out
          common equity upside.
        - 25% probability (reflects macroeconomic consumer strain and current Forge secondary pricing signal of $3.25)
    notes: Scenarios model potential outcomes over an 18-month horizon through the projected 2026-2027 IPO window.
