  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 支柱
      - 看涨论点
      - 看跌反论点
      - 哪些情况会改变判断
    rows:
      - - 分销与发放
        - 专有的伙伴银行渠道（航空公司、承包商、经销商）带来低获客成本，并在六类核心信贷产品间交叉销售。
        - 联名旅行和零售渠道增加伙伴集中度与平台费用，而脆弱消费者面对最高 36% APR 的信贷。
        - 第三方审计的队列单位经济模型证明非旅行产品具备可持续的自然复购量。
      - - 银行牌照与资金成本
        - 申请内华达工业贷款公司（ILC）牌照，可引入 FDIC 保险覆盖的专属存款，降低资金成本并提高保留贷款的灵活性。
        - ILC 牌照审批历来遭银行业协会反对，监管时间表不确定，且面临美联储资本限制。
        - FDIC 正式批准、州政府发放内华达 ILC 牌照，且没有禁止性运营限制。
      - - 多产品变现
        - 平台从个人贷款扩展至卡、BNPL Flex Pay、汽车和家装，覆盖 850 万客户，累计信贷超过 $53B。
        - 激进扩展近优质消费者贷款产品，可能在宏观信贷收紧时导致资产质量恶化。
        - 详细披露卡和 BNPL 的逾期 30 天以上比例及净冲销分期曲线。
      - - 估值与退出流动性
        - 2025 年 5 月收入年化达到 $1B，Series G 融资 $165M，使公司具备在 2026 年末 / 2027 年 IPO 的条件。
        - 二级市场价格 $3.25 相对 Series G 每股 $5.88 折价 45%，显示后期私募股权存在压制。
        - 公开提交 S-1，确认 GAAP 净利润率为正，并将 Series G 优先权负担顺利转换为普通股。
    notes: 将核心投资论点支柱与下行脆弱性及监测催化剂进行对照综合。
