  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险分析
        blocks:
          - type: paragraph
            body: >-
              Upgrade 是一家非银行金融科技平台，通过 Cross River Bank、Blue Ridge Bank 和 Celtic Bank 等第三方存款机构发放消费贷款、分期信用卡和存款账户 [CR002,
              CR003]。合作银行架构使公司免于直接承担全国银行牌照义务，却使其受到联邦跨机构第三方风险管理指导下日益严格的监管审查 [CR002, CR011]。针对 BaaS 主办机构的执法若限制其增长，会直接压缩
              Upgrade 的发放能力 [CR001, CR003]。BNPL 信贷和高 APR 分期放贷也带来重大合规风险 [CR004, CR005]；Flex Pay 销售点融资 APR 为 0% 至
              36.00%，取决于消费者承保 [CR005]，并因风险定价休闲融资和潜在债务陷阱受到公众及消费者组织审视 [CR004]。州高利贷争议、CFPB
              非银行分期放贷指导变化及真实贷款人法律重新定性风险，可能破坏跨州产品一致性或迫使公司调整发放费和合同利息分成 [CR002, CR004]。
