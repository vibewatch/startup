      - number: '4.4'
        title: 财务结论与承保障碍
        blocks:
          - type: paragraph
            body: >-
              从机构尽调角度看，Upgrade 兼具多产品分销规模、公司所称的运营盈利能力，以及轻资产市场化结构带来的资本隔离（CI001, CI003）。$7.3B 估值基准显示 Neuberger
              等贷款购买伙伴支持度较强（CI010）。但信息壁垒阻碍确定性的私募股权投资判断：经审计 GAAP 财报仍未披露，无法独立核验净收入留存、GAAP 运营利润率和真实单位经济。信贷产品在非必需销售点消费中 APR
              最高达 36%，也使平台面临消费者保护和利率上限变化带来的监管风险（CI012, CI013）。验证普通股价值前，尽调应检查分期违约数据、银行合作方仓储条款和股权结构表清算优先权。
