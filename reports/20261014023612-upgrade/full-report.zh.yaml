      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: BaaS 主办银行的监管脆弱性
            body: Upgrade 缺少独立银行牌照，必须依赖 Cross River Bank 等存款机构。联邦对主办银行的监管执法构成无法完全靠合同契约缓解的生存性渠道风险。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 信贷收紧与机构资本弹性
            body: 机构合作伙伴既是股东又是贷款买方，双重身份形成了循环资本敞口。若第三方减少购入贷款，公司的放款推进速度会受限，费率利润率也会被挤压。
            calloutType: risk
            claimRefs:
              - CR002
              - CR007
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、多产品差异化与战略脆弱性
        blocks:
          - type: paragraph
            body: >-
              Upgrade 打造了差异化的消费信贷平台，运营规模已相当可观：累计放款超过 $53 billion，覆盖 8.5 million 多名客户，横跨六个核心借贷垂直领域。看多 Upgrade
              的核心逻辑，是其在旅游合作伙伴、承包商和汽车经销商之间搭建了专有的低成本分销体系，从而高效获客，并把个人贷款交叉销售到分期信用卡、家装贷款和销售点融资。不过，反方论点指出了关键的信用与监管风险：年利率最高达
              36% 的融资条款，可能让脆弱消费群体的损失大幅上升；银行业协会的反对，也持续给其待审批的 Nevada Industrial Loan Company 牌照申请制造障碍。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV011
      - number: '8.2'
        title: 融资历史、优先级与私募二级定价
        blocks:
          - type: paragraph
            body: >-
              Upgrade 自成立以来已筹得约 $750 million 的一级股权资本，最近于 2025 年 10 月完成 $165 million 的 Series G 轮融资，由 Neuberger Berman
              Funds 领投，投前估值为 $7.3 billion。一级融资每股 $5.88 的价格较 2021 年独角兽估值有所上升，但 Forge Global 的实时私募二级市场交易显示，投资者仍保持谨慎：截至
              2026 年初，Forge Price 一直是每股 $3.25。二级市场约 45% 的折价，说明私募市场高度怀疑 $7.3 billion 的表面估值能否在公开股票市场站稳，尤其是在公司尚未提供透明、经审计的
              GAAP 盈利数据，也未明确高级清算优先权条款的情况下。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV010
              - CV013
      - number: '8.3'
        title: 情景建模、倍数分析与同业对标
        blocks:
          - type: paragraph
            body: >-
              以 $7.3 billion 的表面估值对比已披露的超过 $1.0 billion 年化收入运行率，Upgrade 的交易估值约为收入的 7.3 倍，相较成熟消费信贷同业偏激进。管理层已释放信号，目标是在未来
              12 至 18 个月内启动 IPO，因此潜在投资者必须做严谨的情景分析。在我们的基准情景中（概率 55%），公司按收入 7.0x 至 7.5x 的平坦估值倍数完成 IPO；以折价估值进入的二级买方可守住资本，但
              Series G 一级股权的上行空间有限。在悲观情景中（概率 25%），若消费者逾期加速或银行牌照申请被拒，收入倍数将压缩至 3.0x 至 4.0x，估值会大幅收缩至 $3.0 billion 至 $4.5
              billion。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV013
      - number: '8.4'
        title: 投资建议、决策边界与论点失效标准
        blocks:
          - type: paragraph
            body: >-
              我们给予 Upgrade 的总体建议为继续跟踪，置信度为中等，风险评级为高，估值判断为偏高。平台通过提交 Nevada Industrial Loan Company
              申请，展现出不容忽视的放款速度和战略野心；但一级创投估值与二级交易价格之间的分化，要求投资者严格控制资本。机构投资者应在审计后的 GAAP 损益表和客户群违约数据通过 S-1
              注册声明公开提交前，暂缓一级投资。若监管机构否决 Nevada ILC 牌照、30 天消费贷款逾期率突破历史银行合作伙伴阈值，或私募下轮融资损害普通股权益，则应立即下调至回避。
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV011
              - CV014
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 估值判断：维持继续跟踪建议
            body: >-
              Upgrade 已取得显著商业进展，累计放款超过 $53 billion，年化收入运行率超过 $1.0 billion。但在一级市场以 $7.3 billion 的 Series G
              估值进入并不划算，因为二级交易给出的股价折价达到 45%。机构投资者应继续跟踪该公司，等待经审计的 GAAP 披露和透明的 IPO S-1 文件。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV013
          - type: callout
            title: 关键脆弱性：高 APR 敞口与牌照不确定性
            body: >-
              这家多产品借贷平台依靠销售点融资，面向脆弱借款人的 APR 最高升至 36%。待审批的 Nevada Industrial Loan Company
              牌照申请，意在转向成本更低的专属存款资金；但监管批准仍不确定，且受到传统银行业团体的反对。
            calloutType: risk
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV014
