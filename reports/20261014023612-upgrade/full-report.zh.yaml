      - number: '7.3'
        title: 运营、信用模型与财务执行风险
        blocks:
          - type: paragraph
            body: >-
              Upgrade 的财务模式依赖高速信贷发放费、利息分成和贷款服务费，并高度敏感于宏观消费信贷状况 [CR002]。目标市场很大一部分是寻求债务整合或销售点融资的大众近优质和中端消费者 [CR002, CR004,
              CR005]。当持卡人使用 Upgrade OneCard 等循环卡的分期功能时，高信贷使用率可能压低信用分数，并在持续通胀期间加速还款违约 [CR006]。酒店和休闲结账集成中的 BNPL 违约风险会转移给
              Upgrade 及其机构资本伙伴，使损失准备暴露于可选消费冲击 [CR004, CR005, CR012]。公司准备在 12 至 18 个月内寻求 IPO，必须证明 GAAP
              盈利能经受利率周期波动，而不能依赖激进的私募估值倍数 [CR007, CR008, CR009]。联合创始人兼 CEO Renaud Laplanche 的集中式领导也带来关键人物风险，需要在上市前加强机构监督
              [CR002, CR008]。
