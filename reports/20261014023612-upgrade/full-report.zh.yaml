        - 内华达 ILC 牌照获批；存款基础将资金成本降低 150 bps；收入同比增长 25%；以 8.0x—10.0x 市销率成功 IPO。
        - $9.0B - $11.0B
        - 公开市场给予可比一线金融科技公司的新银行倍数；二级股份相对当前 Forge 价格实现 2.0 倍—2.5 倍 MOIC。
        - 20% 概率（取决于 FDIC 及时批准牌照及科技 IPO 窗口友好）
      - - 基准情景
        - 维持混合市场模式；卡和汽车贷款发放稳步增长；12—18 个月内按 Series G 估值（7.0 倍—7.5 倍市销率）IPO。
        - $6.5B - $7.5B
        - 估值持平于 2025 年 10 月 Series G 融资前估值 $7.3B；一级 Series G 回报温和，按 $3.25 买入的二级买方 MOIC 为 1.8 倍。
        - 55% 概率（基于管理层披露的时间表和收入规模，这是基准预期）
      - - 悲观情景
        - ILC 牌照延迟或被拒；36% APR 产品的消费者信贷逾期上升；二级市场折价加深；折价轮融资或以 3.0 倍—4.0 倍市销率 IPO。
        - $3.0B - $4.5B
        - 倍数压缩至传统消费金融同业水平；Series G 优先股清算优先权抹去普通股上行空间。
        - 25% 概率（反映宏观经济下消费者承压，以及当前 Forge 二级价格 $3.25 的信号）
    notes: 情景模拟 18 个月内、直至预计 2026—2027 年 IPO 窗口的潜在结果。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV013
