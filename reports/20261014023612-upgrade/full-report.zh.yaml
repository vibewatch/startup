            body: >-
              平台运营连续性根本依赖多产品生态中的专业银行伙伴和机构资本提供方 [CR001, CR002]。Cross River Bank 是四条核心产品线的基础设施骨干，提供支付结算、存款账户、发卡 API
              和关键信贷额度 [CR001]。该行 2026 年将 Upgrade 循环信贷额度从 $150M 提至 $250M，并以个人信用额度资产作担保；高度交易对手集中使公司易受运营中断、主办行额度调整和 Cross
              River 监管摩擦影响 [CR001, CR003]。资金分销侧依赖整笔贷款出售给机构投资者和专业信贷基金，并依托信用合作社及地区银行网络 [CR002]。Series G 的领投方 Neuberger
              Berman 同时购买 Upgrade 发起的贷款资产，其专业金融负责人 Peter Sterling 还担任董事 [CR007,
              CR010]。若宏观信贷收紧时机构资本伙伴要求更高损失吸收或减少购贷量，Upgrade 的资产负债表周转、发放能力和交易费收入将大幅受压 [CR002, CR007, CR010]。
