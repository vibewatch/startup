chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营规模与商业模式
        blocks:
          - type: paragraph
            body: >-
              Upgrade, Inc. 是一家总部位于旧金山的数字消费金融平台，为美国大众家庭提供可负担的信贷和一体化银行服务。平台覆盖六条主线：固定利率个人贷款、分期信用卡、移动支票与储蓄、先买后付融资（Flex
              Pay）、家装贷款和汽车再融资。Upgrade
              将自己定位为高息循环信用卡债务的负责任替代方案。与传统单一产品贷款机构不同，公司把直达消费者的数字渠道与零售、旅游领域的嵌入式商户结账合作结合起来，在销售点直接分发产品以降低获客成本，并逐步向借款人交叉销售存款账户和循环卡产品。截至
              2025 年底，平台称自 2017 年开始商业放贷以来，已向超过 750 万个消费账户累计发放逾 $42B 信贷。
            claimRefs:
              - CO001
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO008
      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Upgrade 由在线放贷先驱 Renaud Laplanche 与 Adelina Grozdanova、Jeff Bogan、Matt Wierman、Soul Htite 和 Visar Nimani 于
              2016 年创立。创始团队拥有扩张市场化信贷技术和管理机构贷款证券化的丰富经验。Neuberger Berman 专业金融负责人 Peter Sterling 领投 Series G 优先股融资后加入
              Upgrade 董事会。为应对多产品运营复杂度，管理层聘请 Best Egg 前 CEO Jeffrey Meiler 担任
              COO，负责消费放贷运营和承保效率，并增设信用卡和运营策略负责人。管理层梯队虽已成熟，但 Laplanche 仍主导公司愿景、资本市场关系和银行分销渠道，对其依赖依然很高。
            claimRefs:
              - CO002
              - CO007
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO007
              - CO009
      - number: '1.3'
        title: 融资历程、估值轨迹与资本结构
        blocks:
          - type: paragraph
            body: >-
              Upgrade 自成立以来累计股权融资约 $750M。估值在金融科技投资扩张期快速上升：Koch Disruptive Technologies 领投的 2021 年 8 月 Series E 投前估值为
              $3.325B；Coatue Management 和 DST Global 领投的 2021 年 11 月 Series F 融资 $280M，估值达 $6B。2025 年 10 月，Upgrade 获
              Neuberger Berman Funds 领投的 $165M Series G 融资，LuminArx Capital Management、DST Global 和 Ribbit Capital
              参投，投前估值为 $7.3B。BofA Securities 担任独家配售代理。资金为早期股东提供流动性，并在未来 12 至 18 个月可能上市前强化资产负债表。
            claimRefs:
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO010
      - number: '1.4'
        title: 运营里程碑、银行牌照策略与尽调风险
        blocks:
          - type: paragraph
            body: >-
              自 2016 年注册以来，Upgrade 于 2019 年从无抵押个人贷款扩展至信用卡，2023 年收购旅游 BNPL 提供商 Uplift（后于 2024 年 12 月更名为 Flex
              Pay），家装信贷累计达到 $2 billion，汽车融资达到 $1 billion。过去公司完全依托 Cross River Bank、Blue Ridge Bank 和 Celtic Bank
              发放信贷并托管存款。2026 年 10 月，Upgrade 向内华达州金融机构部门和 FDIC 提交申请，拟将 Upgrade Bank
              设为工业贷款银行。若获批，自有牌照可减少对合作银行租牌模式的依赖并吸收存款资金，但会带来更严格的监管和资本储备要求。Upgrade OneCard 循环余额的固定 APR 为 14.99% 至
              29.99%，可能推高信贷使用率；Flex Pay 分期定价最高达 36% APR。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO005
              - CO011
      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 多产品交叉销售策略
            body: Upgrade 将旅游和家装销售点获客与高利润循环信贷、个人贷款结合，区别于单一产品贷款机构；但对第三方合作银行的依赖也带来持续的监管约束。
            calloutType: insight
            claimRefs:
              - CO001
              - CO010
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类架构与核心替代品
        blocks:
          - type: paragraph
            body: >-
              Upgrade 横跨非银行消费放贷、销售点分期融资和数字卡产品，面向背负循环债务或需要规划性流动性的主流信贷消费者。产品覆盖个人分期贷款、混合分期卡、移动银行、商户
              BNPL、家装承包商融资及汽车购车和再融资。核心替代品仍是传统银行发行的循环信用卡。Upgrade 通过固定还款期限、等额月供和透明费用，把产品定位为减债工具而非永久循环余额；但其 0% 至 36% 的 APR
              仍使平台受消费信贷表现、利率周期和存款合作方承保约束影响。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: TAM、SAM 与多维度市场规模分析
        blocks:
          - type: paragraph
            body: >-
              Upgrade 的 TAM 需要综合多个信贷品类，而非依赖单一宏观估算。最宽口径是 $1.3T 的美国未偿循环信用卡债务余额。SAM 由美国无抵押个人贷款年度发放额和非银行分期余额构成，该行业 2025
              年余额同比增长 12%。嵌入式销售点信贷快速发展，企业预测全球嵌入式金融交易量到 2027 年接近 $7.2T。旅游休闲销售点融资是近期高增长垂直领域，研究显示 17%
              的夏季旅行者使用分期选项。受合作银行资金能力和风险偏好限制，Upgrade 的可获取服务量估计为年化 $12B 至 $15B 发放额。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM009
              - CM011
      - number: '2.3'
        title: 买方细分、B2B 分销渠道与预算归属
        blocks:
          - type: paragraph
            body: >-
              Upgrade
              以直达消费者获客结合企业分销合作，服务不同消费群体。客户主要是信用良好至优质、但传统循环卡借贷成本上升的大众用户。公司通过低成本商户和企业渠道，连接数百家航空公司、邮轮公司和酒店平台，以及数千家家装承包商和汽车经销商。旅游和酒店业务通过
              Hapi 等连接平台，自动化全球酒店的物业级支付对账，并处理虚拟信用卡例外。嵌入式分销让 Upgrade 在交易需求发生时获取借款人，并把获客效率转化为更有竞争力的贷款定价和承保利润，覆盖 7.5M
              个历史客户账户。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
      - number: '2.4'
        title: 增长驱动、采用约束与监管摩擦
        blocks:
          - type: paragraph
            body: >-
              推动 Upgrade 采用的长期动力，是消费者对信用卡复利利息的不满以及对纪律性摊销还款的需求。但宏观资本市场波动使零售消费金融科技投资同比下降 49%，推高二级资本和组合股权融资成本；依赖 Cross
              River Bank、Blue Ridge Bank 和 Celtic Bank 也使公司持续面对金融科技与银行第三方风险和存款合规审查。部分分期及个人贷款合同的风险定价最高达 35.99% 或
              36.00%，低层级大众借款人在持续通胀下违约风险更高，需要严格的自动承保以防信贷损失准备金挤压利润。
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM013
              - CM014
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 高获客成本环境下的专有分销经济
            body: >-
              Upgrade 的多渠道 B2B2C 分销模式将 Flex Pay 嵌入航空公司、酒店连接平台 Hapi、Six Flags
              等主题公园运营商和家装承包商网络，降低直接消费者数字获客成本上升对单一产品贷款机构利润的挤压。
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
              - CM012
          - type: callout
            title: 高 APR 集中度与脆弱消费者暴露
            body: >-
              Upgrade 将固定利率分期卡和个人贷款定位为循环信用卡债务的负责任替代品，但销售点和个人贷款 APR 最高达 35.99% 或
              36.00%，使低信用借款人承担较高持有成本，并在储蓄缓冲收缩时增加监管审查和信贷周期敏感性。
            calloutType: risk
            claimRefs:
              - CM003
              - CM010
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与结构分类
        blocks:
          - type: paragraph
            body: >-
              Upgrade 所处的消费信贷生态包括数字新银行、独立数字个人贷款机构、销售点 BNPL 网络和大型商业银行。Upgrade 由 LendingClub 联合创始人 Renaud Laplanche
              创立，刻意避开单一个人贷款路线，构建将消费信贷与分期卡、移动银行和专业分期垂直业务结合的多产品平台。公司已向 7.5M 借款人发放逾 $42B 信贷，直接竞争者包括 SoFi
              Technologies、LendingClub、JPMorgan Chase 和 Citibank；其 $165M Series G 融资和 $7.3B 估值为挑战传统信用卡提供增长资本，而传统发卡机构合计
              $1.3T 的循环余额正是 Upgrade 瞄准的主要消费支出池。
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: 能力与分销差异化
        blocks:
          - type: paragraph
            body: >-
              Upgrade 的结构性优势来自混合卡产品架构和专有合作伙伴分销网络。Upgrade OneCard 允许消费者从支票账户即时支付，或将消费摊销为固定分期，避免复利罚息。Flex Pay 覆盖超过 750
              个旅游品牌，并通过 Hapi 自动化酒店预订；家装业务合作超过 2,000 家承包商，间接汽车融资网络连接超过 1,000 家经销商。公司还将贷款发放联合销售给超过 200
              家存款类信用合作社，推动优质贷款销售而不在自身资产负债表上保留组合信贷风险。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.3'
        title: 定价模式与客户经济权衡
        blocks:
          - type: paragraph
            body: >-
              Upgrade OneCard 提供 14.99% 至 29.99% 的固定常规 APR，免年费；循环卡罚息 APR 往往超过 30%；Flex Pay 为高客单价商户消费提供 0% 至 36% APR、最长
              24 个月的融资。将卡余额设计为固定利率分期贷款而非开放式循环额度，可持续降低债务。但个人贷款转换成本低，价格敏感用户会在贷款聚合平台和余额转移促销之间多处借贷；Upgrade
              以奖励支票账户和高收益储蓄账户交叉销售核心银行关系。
            claimRefs:
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Upgrade 的竞争护城河取决于转换壁垒、分销持久性和现有银行的反应。借款人可轻易以 Marcus、Discover 或当地信用合作社的报价替代个人贷款或 OneCard。大型银行拥有零成本零售核心存款，而
              Upgrade 依赖 Cross River Bank 等第三方基础设施及机构购买贷款。Upgrade
              的防御力主要来自专有销售点商户集成和信用合作社购买承诺；但护城河能否持续，取决于能否把交易型商户借款人转化为多产品主银行存款客户。
            claimRefs:
              - CP013
              - CP014
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 渠道多元化缓解数字获客通胀
            body: >-
              Upgrade 收购 Uplift（现为 Flex Pay），并建设覆盖 2,000 家承包商和 1,000
              家汽车经销商的商户网络，获得专有获客入口。在消费者意愿最强的销售点嵌入融资，避开挤压单一产品贷款机构利润的搜索引擎和联盟聚合商价格通胀。
            calloutType: insight
            claimRefs:
              - CP003
              - CP009
              - CP011
          - type: callout
            title: 存款合作伙伴的资产负债表中介风险
            body: >-
              Upgrade 的 200 多家信用合作社买方网络消除了资产负债表上的股权拖累，却带来二级渠道风险。若地区信用合作社流动性收紧或贷款购买意愿下降，Upgrade
              必须把发放量转向收益率更高的机构资产管理者，可能压缩发放利润。
            calloutType: risk
            claimRefs:
              - CP005
              - CP007
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现架构
        blocks:
          - type: paragraph
            body: >-
              Upgrade 在六类消费信贷和银行产品上建立多元、轻资本收入模式，不保留资产负债表信贷敞口。个人贷款是主要变现引擎：公司对发放本金收取约 5%
              前端费用，并在整笔贷款按面值出售给机构买方时获得持续服务费和出售收益（CI001）。信用卡业务（包括混合分期 OneCard）通过卡应收整笔贷款出售溢价、持续服务费和消费交换费变现（CI002）。约 220
              家银行和信用合作社购买信贷资产并接收平台发放的存款；Cross River Bank、Celtic Bank 和 Blue Ridge Bank 提供发起所需的银行牌照和监管基础设施（CI003,
              CI004）。通过 OnePay 个人贷款集成等嵌入式合作，Upgrade 以较低直获客摩擦获取大量借款人（CI005, CI014）。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
      - number: '4.2'
        title: 产品定价区间与利率分散
        blocks:
          - type: paragraph
            body: >-
              Upgrade 各产品的合同定价覆盖宽广的风险区间。个人贷款金额为 $1,000 至 $50,000，APR 为 7.74% 至 35.99%，取决于资格和承保层级（CI005）。Upgrade OneCard
              的 Pay Later 交易采用固定利率分期，APR 为 14.99% 至 29.99%，免年费和境外交易费（CI006）。Flex Pay 销售点融资的促销 APR 为 0% 至 36%（CI007）。Six
              Flags 季票融资等休闲场景中，FlexPay 将信用违约风险从商户转给第三方贷款人，消费者利率最高 36%（CI012）。宽广的 APR 区间帮助 Upgrade
              覆盖优质和近优质申请人，并收取风险调整收益以保持机构买方兴趣。
