      - CR002
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将发放规模、监管与二级价格摩擦及情景边界连接至“跟踪”建议的逻辑决策路径。
    data:
      nodes:
        - id: origination-scale
          label: 发放规模：$53B+ 信贷与 $1B 运行率
          detail: 已证明覆盖 850 万客户和 6 个核心贷款垂直领域的多产品触达能力
        - id: charter-catalyst
          label: 资本结构：内华达 ILC 银行牌照申请
          detail: 战略性争取 FDIC 保险，以获得更低资金成本和专属存款
        - id: downside-friction
          label: 下行阻力：准优质借款人敞口与监管审查
          detail: 年利率最高达 36% 的信贷产品面临消费者公平性和 CFPB 监管风险
        - id: valuation-divergence
          label: 估值脱节：$7.3B 一级市场估值 vs $3.25 二级市场估值
          detail: Forge 二级市场交易价格较 Series G $5.88 优先股估值标记低约 45%
        - id: disclosure-gap
          label: 信息不对称：经审计 GAAP 数据与股权结构表未披露
          detail: 未公开披露按成立年份划分的历史违约曲线，以及优先股清算顺位条款
        - id: decision-outcome
          label: 建议立场：持续跟踪偏高估值
          detail: 在提交 S-1 并披露信息或二级市场价格回归合理水平前，维持严格的入场纪律
      edges:
        - from: origination-scale
          to: charter-catalyst
        - from: charter-catalyst
          to: downside-friction
        - from: downside-friction
          to: valuation-divergence
        - from: valuation-divergence
          to: disclosure-gap
        - from: disclosure-gap
          to: decision-outcome
    claimRefs:
      - CV002
      - CV005
      - CV007
      - CV011
      - CV014
