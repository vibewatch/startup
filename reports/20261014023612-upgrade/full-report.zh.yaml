          description: 直接和嵌入式消费者触点
          modules:
            - Upgrade 移动应用（iOS 与 Android 原生客户端）
            - 直营网页应用与客户账户门户
            - OnePay 嵌入式信贷 SDK（白标钱包贷款）
            - Flex Pay 电商与 POS 商户组件
        - label: 第 2 层：伙伴集成与连接层
          description: 连接生态伙伴的集成中间件
          modules:
            - 开放银行交易接入 API
            - Hapi 酒店支付自动化与 VCC 引擎
            - 商户与承包商销售点连接器
            - 实时 Webhook 与事件通知网关
        - label: 第 3 层：专有承保与决策引擎
          description: 另类数据评分与机构规则评估
          modules:
            - 现金流验证与收入分析引擎
            - 另类风险评分与征信数据合成器
            - 定制买入账簿匹配与筛选算法
            - 实时基于风险的 APR 定价引擎（0%–36%）
        - label: 第 4 层：伙伴银行发放通道（BaaS）
          description: 持牌银行执行与监管合规通道
          modules:
            - Cross River Bank 发放管道（个人贷款、汽车贷款、支票账户）
            - Blue Ridge Bank 贷款通道（个人贷款与汽车再融资）
            - Sutton Bank 发卡通道（Upgrade Card 项目）
            - Celtic Bank 商业贷款与授信额度设施
        - label: 第 5 层：贷款服务与生命周期运营
          description: 内部服务、支付处理与客户服务
          modules:
            - 自动 ACH 还款与账单平台
            - 逾期跟踪与早期损失缓释工具
            - 客户账户面板与奖励跟踪器
            - 蒙特利尔技术中心平台服务
        - label: 第 6 层：二级资本分销市场
          description: 机构流动性与贷款购买基础设施
          modules:
            - 200 多家存款机构的机构买方门户
            - 信用合作社远期贷款购买匹配
            - 机构贷款出售结算与文件交付
            - 二级市场证券化数据管道
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 覆盖销售点获客、承保、交叉销售和机构融资的端到端客户生命周期。
    data:
      items:
        - label: 发现与 POS 获客
          touchpoints:
            - 旅行伙伴结账（航空公司、邮轮公司）
            - 零售和主题公园 POS（Six Flags FlexPay）
            - 家装承包商报价
          description: 消费者通过商户嵌入式融资在销售点发现 Upgrade，绕开昂贵的直接付费营销。
        - label: 实时承保与资格评估
          touchpoints:
            - 专有信用算法
            - 自动信用检查（FICO 评估）
            - 基于风险的 APR 分配（0% 至 36%）
          description: 借款人会即时接受评估：优质申请人可获得促销 0% 利率，近优质借款人则按风险调整后的 APR 定价。
        - label: 交易结算与商户拨款
          touchpoints:
            - 即时向商户付款
            - 伙伴银行贷款发放
            - Flex Pay 虚拟信用卡结算
          description: Upgrade 和发起行伙伴银行预先向商户拨款，并承担收款职责和信用风险。
        - label: 核心应用开户与服务
          touchpoints:
            - Upgrade 移动银行应用
            - Rewards Checking 账户开立
            - 合并月度分期账单
          description: 借款人下载 Upgrade 移动应用管理还款，同时接触日常银行功能。
        - label: 多产品交叉销售
          touchpoints:
            - Upgrade OneCard（先享后付）
            - 个人贷款债务整合方案
            - 汽车再融资与家装额度
          description: Upgrade 利用借款人初始信任，提供个人贷款和混合 OneCard 等高 LTV 产品。
        - label: 机构贷款出售与资本循环
          touchpoints:
            - 向 200 多家伙伴存款银行出售贷款
            - 机构投资者银团
            - Upgrade 保留的服务平台
          description: 贷款出售给寻求优质资产的伙伴金融机构，为持续发放释放资产负债表资本。
    approximationNotes: 阶段和触点综合官方产品架构与商户集成文档。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU006
      - CU008
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图与剩余暴露矩阵
    type: matrix
    summary: 可视化展示 Upgrade 主要风险向量的发生可能性、潜在影响严重性和剩余暴露。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 严重影响
      rows:
        - label: 高可能性
          values:
            - label: 常规商户流失
              tone: low
            - label: 客户服务延迟
              tone: neutral
            - label: 信用损失率上升
              tone: warning
            - label: BaaS 监管审查
              tone: critical
        - label: 中等可能性
          values:
            - label: 轻微功能上线缺陷
              tone: low
            - label: 卡片信用评分摩擦
              tone: neutral
            - label: 州利率上限合规
              tone: warning
            - label: 资本市场购买收缩
              tone: critical
        - label: 低可能性
          values:
            - label: 内部运营故障
              tone: low
            - label: API 伙伴集成缺陷
              tone: neutral
            - label: 备用银行退出
              tone: neutral
            - label: 主要发起行牌照丧失
              tone: critical
        - label: 罕见可能性
          values:
            - label: 轻微报告笔误
              tone: low
            - label: 计划维护延迟
              tone: low
            - label: 暂时性支付网关错误
              tone: neutral
            - label: 灾难性系统性银行失败
              tone: critical
        - label: 极高可能性
          values:
            - label: 市场整体广告通胀
              tone: low
            - label: 客户利率比较询问
              tone: neutral
            - label: 借款人重新安排还款请求
              tone: warning
            - label: 日益严格的 BaaS 审计标准
              tone: critical
        - label: 近乎确定的可能性
          values:
            - label: 常规软件依赖补丁
              tone: low
            - label: 定期提交合规报告
              tone: neutral
            - label: 宏观经济利率持续波动
              tone: warning
            - label: 持续审查消费信贷定价
              tone: critical
    approximationNotes: 可能性和严重性分类综合了实际伙伴依赖与宏观信用周期。
