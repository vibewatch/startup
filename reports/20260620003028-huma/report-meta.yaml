  productSummary: >-
    Huma sells the Huma Cloud Platform, Huma Workspace, Huma Intelligence, and disease-specific regulated
    workflows for virtual wards, respiratory RPM, gestational diabetes, triage, primary care, public health,
    and decentralized clinical trials.
  customerFocus: >-
