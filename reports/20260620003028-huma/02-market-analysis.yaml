  - id: SM-04
    title: Growth Drivers and Structural Tailwinds
    body: >
      Seven structural tailwinds accelerate digital health platform adoption. Population aging across
      the UK, EU, and US creates sustained multi-decade demand for chronic disease monitoring outside
      hospital walls: by 2030, over 25% of the EU population will be aged 65+, driving chronic disease
      management volume beyond the capacity of in-person clinic delivery at current staffing levels.
      The World Health Organization identifies non-communicable diseases (NCDs) as responsible for
      74% of global deaths annually, making chronic condition monitoring a public health imperative
      at national scale.

      The NHS virtual ward mandate is the single most direct near-term revenue tailwind for Huma's UK
      business. NHS England's policy requires technology-enabled monitoring for all virtual wards, with
      10,000+ virtual ward beds targeted by end of FY2024/25. Huma claims its platform underpins
      deployments across 2/3+ of UK primary and secondary care providers post-eConsult acquisition,
      giving it a large installed base from which to upsell virtual ward capability.

      CMS reimbursement expansion for RPM (CPT codes introduced 2018, expanded 2020 and 2022) enables
      a scalable per-patient revenue model in the US market. The American Medical Association has
      published guidance on RPM coding and billing that directly enables the health-system procurement
      wave. The Aluna acquisition gives Huma access to 150+ US health systems and approximately
      500,000 contracted RPM lives, providing a platform for rapid US revenue growth.

      Pharma's structural shift to decentralized clinical trials (DCT) post-COVID accelerated by 3-5
      years based on McKinsey analysis. DCT reduces per-patient recruitment costs by 30-50% versus
      site-based trials and enables access to geographically distributed patient populations. This
      creates a sustained tailwind for Huma's Alcedis-powered life-sciences business, where the
      regulatory credibility of EU MDR Class IIb and FDA Class II clearances enables deployment
      in high-stakes rare-disease and oncology trials.

      EU MDR enforcement from 2024 is a competitive moat amplifier: vendors that did not achieve
      EU MDR certification by the regulatory cutoff must either invest significantly or exit the
      European SaMD market. Huma's 2023 EU MDR Class IIb certification creates a durable advantage
      versus non-certified competitors. Finally, the Saudi Vision 2030 health IT investment programme
      represents a greenfield $40B+ opportunity in an under-served market where Huma has first-mover
      advantage with Saudi FDA Class C certification and the Bayer CVD screening deployment.

