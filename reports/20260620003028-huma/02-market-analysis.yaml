          detail: "Buyers qualify vendors on regulatory certification, interoperability, clinical evidence, and total cost of ownership; EU MDR and FDA certifications serve as qualification gate."
        - label: "Pilot / Procurement Close"
          value: 20
          detail: "Contract signed; pilot deployment with 50-500 patients; 12-24 month NHS / 6-18 month US commercial typical cycle from this stage."
        - label: "Full Deployment / Integration"
          value: 10
          detail: "EHR integration, clinical workflow embedding, staff training; CMS reimbursement codes activated for US health systems."
        - label: "Scale and Renewal"
          value: 5
          detail: "Contract renewal, expanded patient cohort, add-on modules (virtual wards, intelligence layer, Hi-Scribe). High switching cost at this stage sustains retention."
