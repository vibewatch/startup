callouts:
  - calloutType: strength
    title: Structural Regulatory Moat Creates Long Procurement Windows
    body: >
      Huma's multi-jurisdictional SaMD certifications function as a qualification gate in all major
      public health system procurements. NHS England's virtual ward technology requirement, EU MDR
      enforcement creating vendor attrition, and CMS RPM reimbursement structure all disproportionately
      advantage certified SaMD platforms over non-certified digital health software. This structural
      alignment between policy mandate and Huma's product positioning is the primary market tailwind.
    claimRefs:
      - CM002
      - CM019
      - CM028

  - calloutType: risk
    title: Market Sizing Divergence Creates Valuation Uncertainty
    body: >
      The $200+ billion gap between GrandView and Fortune BI digital health TAM estimates reflects
      genuine methodological divergence, not merely optimism versus pessimism. Investors using the
      larger estimate to justify valuation multiples face material risk if the narrower SaMD software
      market definition proves accurate. Huma's own SAM — configurable SaMD software licensed to
      health systems and pharma — is estimated at $9-15B in 2025, not $292-492B, sharply narrowing
      the implicit valuation ceiling for SaMD platform pure-plays.
    claimRefs:
      - CM009
      - CM010
      - CM015

  - calloutType: risk
    title: Current Health Divestiture Signals Enterprise-Only Viability
    body: >
      Best Buy's June 2025 divestiture of Current Health — acquired for $400M in 2021 — validates
      that consumer-channel RPM distribution fails to achieve clinical-grade enterprise adoption
      at scale. This validates Huma's enterprise-first NHS and health-system strategy but also
      confirms the structural difficulty: RPM scaling requires deep clinical integration,
      reimbursement infrastructure, and certified regulatory status that consumer platforms
      cannot achieve without fundamental repositioning.
    claimRefs:
      - CM039
      - CM040

