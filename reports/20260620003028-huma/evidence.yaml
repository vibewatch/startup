evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation
    missingEvidence: Post-money valuation for any funding round including the Series D; Huma has not disclosed a valuation.
    whyItMatters: Cannot assess investability, dilution, or multiples without a reference valuation.
    diligencePath: Request data room; consult secondary market databases (EquityZen, Forge, PitchBook) for inferred valuations.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-losses-and-funding-breakdown
    missingEvidence: >-
      Confirmed FY2023 and FY2024 financial results; only FY2022 loss (£31m) is from Companies House. Full
      round-by-round capital breakdown (pre-Series C amounts) is also undisclosed.
    whyItMatters: >-
      Unable to verify break-even claim or full dilution trajectory without audited financials and complete funding
      history.
    diligencePath: Request management accounts; check Companies House for more recent filings; request full cap table from data room.
    relatedQuestionRefs:
      - QO006
      - QO017
      - QO020
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: governance-and-leadership
    missingEvidence: >-
      Board composition, independent directors, governance rights of major investors, shareholder agreement provisions,
      and non-CEO leadership team beyond CMO.
    whyItMatters: >-
      Governance quality affects investor protection and management accountability; key-person risk assessment requires
      board visibility.
    diligencePath: Request governance documents via data room; UK Companies House PSC register may surface majority shareholders.
    relatedQuestionRefs:
      - QO001
      - QO019
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: Huma-actual-revenue
    missingEvidence: >-
      Huma's actual ARR or total revenue for FY2023, FY2024, or FY2025; current SOM conversion rate from contracted
      lives to enrolled patients; current pharma deal count and average deal value.
    whyItMatters: >-
      Without disclosed revenue, the SOM estimate is entirely speculative and cannot be validated against the SAM or TAM
      estimates. Contracted lives represent a gross opportunity, not realised revenue.
    diligencePath: >-
      Request audited P&L and revenue build from data room; benchmark against comparable RPM platform peers (iRhythm
      publishes quarterly revenue).
    relatedQuestionRefs:
      - QM005
      - QM024
  - type: missing-source
    severity: material
    topic: NHS-market-share-validation
    missingEvidence: >-
      Independent third-party verification of Huma's claimed 2/3+ UK primary and secondary care market share following
      eConsult acquisition; NHS Digital or NHS England procurement data showing Huma's actual contracted institutions.
    whyItMatters: >-
      If the 2/3 market share claim is overstated, the NHS virtual ward revenue opportunity is materially smaller than
      Huma presents.
    diligencePath: Request NHS Digital framework contract data; cross-reference with NHS England ICB digital health programme data.
    relatedQuestionRefs:
      - QM007
      - QM025
  - type: missing-source
    severity: material
    topic: DCT-market-sizing
    missingEvidence: >-
      No authoritative, widely-cited market sizing estimate for decentralised clinical trial (DCT) software
      specifically; estimates range widely from $0.8B to $4.5B by 2028 depending on scope definition.
    whyItMatters: >-
      Alcedis's DCT market opportunity is difficult to size precisely without a reliable market estimate; impacts
      life-sciences revenue forecasts for Huma.
    diligencePath: >-
      Request primary DCT market data from PAREXEL, Medidata/Veeva, or CRO industry bodies; review Alcedis's own
      pipeline data.
    relatedQuestionRefs:
      - QM006
      - QM027
