  - id: milestones-and-adverse-events
    title: Key Milestones, Acquisitions, and Adverse Events
    body: >
      Huma's fifteen-year history spans the full lifecycle from a single-disease patient-data
      company to a multi-product global healthcare infrastructure provider. The most significant
      regulatory milestones are the EU MDR Class IIb approval (March 2023)—the first disease-agnostic
      configurable SaMD to achieve this classification—followed by the US FDA 510(k) Class II
      clearance (June 2023) and Saudi FDA Class C certification (November 2023). These three
      multi-jurisdictional approvals represent a meaningful barrier to entry that few competitors
      have replicated. Health Canada Class II approval was announced April 17, 2025.


      On the acquisition front, Huma has executed four known deals: iPlato (UK patient engagement,
      dates not publicly disclosed), Alcedis (German clinical-trials CRO with 30+ years experience
      and 670+ studies), eConsult (October 2024, UK digital triage platform used in 1,400+ NHS
      GP practices), and Aluna (May 2025, US respiratory RPM device and software). The eConsult
      acquisition in particular was accompanied by the launch of Huma Workspace for Health Systems,
      which added AI-first primary care triage and automated consultation to the platform stack.


      Adverse events include a material headcount reduction: Sifted reported in July 2024 that
      Huma's workforce had dropped from approximately 500 to approximately 400 employees over the
      preceding year, following an August 2023 announcement of planned 45+ layoffs. CEO Dan Vahdat
      acknowledged the cuts as part of an "efficiency" drive and did not rule out further reductions.
      Financial losses of £31 million in FY2022 (Companies House) and "similar" losses in FY2023
      (Vahdat, Sifted interview) represent a structural risk given the pursuit of platform economics
      at scale. The company had not disclosed a formal path to break-even beyond its stated target.
