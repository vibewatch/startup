callouts:
  - calloutType: strength
    title: Unique Multi-Jurisdictional Regulatory Moat
    body: >
      Huma holds FDA Class II, EU MDR Class IIb, Saudi FDA Class C, Health Canada Class II, MHRA,
      and MDSAP certifications for a single disease-agnostic platform. No named competitor holds
      an equivalent multi-jurisdictional configurable SaMD stack. This regulatory portfolio took
      over a decade and tens of millions of dollars to assemble and provides a structural barrier
      to entry that cannot be shortcut by better-funded rivals.
    claimRefs:
      - CO022
      - CO023
      - CO024
      - CO025

  - calloutType: risk
    title: Persistent Financial Losses and Structural Cash Burn
    body: >
      Huma reported a £31 million loss in FY2022 with "similar" losses in FY2023 per CEO statements.
      The company has stated break-even targets but not confirmed achievement. The acquisition-driven
      growth strategy (four deals since 2022) and headcount restructuring (100 employees laid off)
      suggest ongoing pressure on burn rate. Private company status means investors cannot independently
      verify financial health without access to management accounts.
    claimRefs:
      - CO019
      - CO020
      - CO027

  - calloutType: risk
    title: Key-Person Concentration Risk on Founder CEO
    body: >
      Dan Vahdat is the sole public face of Huma's strategy, investor relations, and regulatory
      advocacy. All major announcements since founding cite him as CEO. Board structure and
      independent governance are not disclosed. Loss of or material changes to Vahdat's leadership
      would create significant market uncertainty given founder-centric positioning.
    claimRefs:
      - CO009
      - CO010

