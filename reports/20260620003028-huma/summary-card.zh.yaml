    - 确认 post-money valuation，以及任何 liquidation preference 或 option overhang 细节。
    - 客户留存、续约率和按付款方划分的合同集中度的独立证据。
    - 2026 年 2 月融资事件到底重大、属于 primary capital，还是只是数据库噪音。
