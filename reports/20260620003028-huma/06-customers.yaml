company:
  name: Huma

chapter:
  number: 6
  title: "Customers"
  summary: >
    Huma's paying customer base divides into three segments: NHS and public health systems (dominant
    revenue driver), pharmaceutical and life sciences companies (clinical trial and drug development
    tooling), and government/population health programmes (Saudi Arabia, Germany). eTriage (22 NHS
    EDs), GDm-Health (64 NHS Trusts), Virtual Wards (450+ deployments), and eConsult (1,400+ GP
    practices) represent production-grade NHS deployments with measurable patient scale. Pharma
    customers include Boehringer Ingelheim (VARGADO, 10 years), UCB (Huma MG EU/US), and Bayer
    (CVD screening US + Saudi). The Aluna acquisition adds ~500,000 contracted US lives in respiratory
    monitoring. Retention indicators are positive where data exist (86% Huma MG patients wished to
    continue; 90–95% virtual ward adherence), but NRR/GRR and systematic churn data are not publicly
    reported. NHS UK buyer concentration and a period of restructuring (100 layoffs 2023–24) are the
    primary customer-risk signals available from public evidence.

sections:
  - id: customer-segmentation
    title: "Customer Segmentation and Buyer Profile"
    body: >
      Huma's commercial footprint spans three primary customer segments. The first and largest is
      NHS and public health systems in the United Kingdom. NHS Trusts procure Huma products — primarily
      eTriage, GDm-Health, Virtual Wards/RPM, and eConsult — through the NHS CCS Spark DPS RM6904
      approved procurement framework. NHS Trusts (acute, primary care, community) act as both buyer
      and user. The second segment is pharmaceutical and life sciences. Pharma companies including
      Boehringer Ingelheim, UCB, Bayer, AstraZeneca, Smith+Nephew, Janssen, and Parexel use Huma's
      clinical trial infrastructure (Alcedis CRO subsidiary) for eCRF, EDC, eCOA, and decentralised
      trial design. They act as buyers; patients and principal investigators are end-users. The third
      segment is government and public health agencies: Saudi Arabia (Vision 2030 CVD screening),
      Germany (HANSE national lung cancer screening), and early engagement in India, UAE, and
      Australia. Huma identifies itself as a "Shopify for digital health", targeting organisations
      that want to deploy regulated health applications with reduced time-to-market. US market
      entry has been accelerated through the acquisition of Aluna (Knox Medical Diagnostics,
      May 2025), which contributed 150+ US clinic networks and approximately 500,000 contracted
      respiratory monitoring lives.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: adoption-trajectory
    title: "Adoption Trajectory and Scale"
    body: >
      Huma's most credible adoption evidence centres on NHS deployments in the UK. eTriage is live
      in 22 NHS Emergency Departments, Minor Injury Units, and Urgent Care Centres as of October
      2025, having triaged 1.8 million patients; a new deployment at a major London NHS ED in
      October 2025 processed 250+ patients within its first 24 hours, routing critical cases to
      Epic and lower-acuity cases to Adastra without manual intervention. GDm-Health covers 64 NHS
      Trusts, serving over 100,000 pregnancies annually and more than 50% of all UK gestational
      diabetes patients. The Virtual Wards / RPM product is deployed across 450+ NHS Trust sites
      with 140,000 contracted respiratory monitoring lives. eConsult, acquired in October 2024,
      has delivered over 50 million digital consultations across 1,400+ NHS GP practices. In life
      sciences, the CKD/T2D clinical trial enrolled 4,500 patients across 350 sites and 20
      countries, completing enrolment one year ahead of schedule. The HANSE lung screening study
      recruited 5,191 participants in 15 months, directly informing Germany's 2026 national lung
      cancer screening programme. Total platform scale claimed by Huma as of 2026: 100+ applications
      on HCP, supporting work across 4,500 hospitals and clinics in 70+ countries, with 50M+
      individuals screened or engaged. Comparator context: Current Health (a competing RPM vendor)
      was sold back to its co-founder by Best Buy in June 2025 for undisclosed consideration, after
      Best Buy had paid $400M for it in 2021, suggesting significant headwinds for standalone RPM
      players without Huma's multi-product breadth and regulatory coverage.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU002]
    figureRefs: [FU002]

  - id: named-customer-proof
    title: "Named Customer Proof and Case Studies"
    body: >
      The strongest named customer evidence comes from NHS case studies and pharma partnerships. For
      eTriage, Huma published an October 2025 case study describing a live deployment at a major
      London NHS Emergency Department (identified as Homerton Healthcare NHS Foundation Trust in
      companion case study), where 250+ patients were processed within 24 hours. The eTriage case
      study describes a unified patient flow across Epic and Adastra without manual reintegration
      across two legacy EHRs. For GDm-Health, the Oxford University RCT (published) reported 47%
      fewer diabetes appointments, 64% lower preterm birth rates, and 42% fewer C-sections versus
      standard care. In myasthenia gravis, UCB has publicly confirmed using Huma MG for digital
      care transformation across EU and US markets; a 2026 structured patient experience study at
      St George's University Hospitals NHS Foundation Trust enrolled 66 patients and found 86%
      wished to continue using Huma MG post-study. For oncology, Boehringer Ingelheim and Huma's
      Alcedis CRO subsidiary collaborated for 10+ years on the VARGADO study (137 patients),
      producing 3 peer-reviewed publications and an ESMO 2024 presentation. Bayer publicly
      confirmed the CVD Heart Health Risk Assessment partnership spanning the US (2023 launch)
      and Saudi Arabia (May 2024 launch), describing it as a tool that "evaluates individual risk
      for developing cardiovascular disease over the next decade without invasive tests." Evidence
      freshness is high for eTriage, Huma MG, and HI Scribe (2025–2026 data); GDm-Health RCT
      data is from the original Oxford study (date unspecified but presented as current NHS
      deployment basis).
    claimRefs: [CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: retention-durability
    title: "Retention, Renewal, and Satisfaction Indicators"
    body: >
      No published NRR or GRR metrics are available for any Huma product line. Available retention
      and satisfaction proxies are mostly patient-facing (engagement and adherence data) rather than
      contract-level metrics. For virtual ward deployments, Huma claims 90–95% patient adherence;
      no third-party audit of adherence methodology has been identified. Huma MG: in the 2026
      St George's University Hospitals structured experience study, 86% of patients wished to continue
      beyond the study period, 69.8% would recommend Huma MG to other patients with MG, and 83.7%
      used the platform independently. For eTriage, Huma reports 85% positive patient feedback.
      The eConsult deployment has grown from its pre-acquisition scale to 1,400+ GP practices, with
      50M+ digital consultations indicating high platform utilisation, though contract-level renewal
      rates are unknown. The VARGADO oncology study ran for over 10 years with Boehringer Ingelheim,
      suggesting the relationship is durable and characterised by long-term data commitments. The
      CKD/T2D clinical trial enrolled ahead of schedule, reflecting high sponsor confidence in
      Huma's operational execution. The Series D round in July 2024 included renewed participation
      by existing investors AstraZeneca, Hitachi Ventures, and Leaps by Bayer, suggesting these
      pharma partners retain confidence in the business after the restructuring period. No G2,
      Gartner Peer Insights, or KLAS customer satisfaction reviews were identified for any Huma
      product.
    claimRefs: [CU023, CU024, CU025, CU026, CU027, CU028]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: expansion-concentration
    title: "Expansion, Concentration Risk, and Channel"
    body: >
      NHS UK constitutes the dominant revenue segment, creating concentration risk. The majority of
      Huma's named production deployments, named case studies, and clinical outcome evidence are
      NHS-denominated. The acquisition of eConsult and Aluna in 2024–2025 represents intentional
      risk mitigation through channel diversification. eConsult expands UK primary care reach;
      Aluna provides a direct US respiratory market beachhead with ~500,000 contracted lives. The
      Bayer CVD screening partnership spans Saudi Arabia and the US, providing two
      non-NHS revenue streams with a Tier 1 pharma partner. In life sciences, Alcedis brings 30+
      years of European CRO relationships, with named studies involving Boehringer Ingelheim, UCB,
      and unspecified CKD/T2D sponsors across 20 countries. Land-and-expand is evident at the NHS
      Trust level: several Trusts began with eTriage pilots before expanding to virtual ward or
      eConsult deployments. The NHS CCS Spark DPS RM6904 procurement framework is described as the
      only NHS-endorsed route for virtual ward technology, creating a structural channel barrier
      for competitors. Sifted reported in July 2024 that Huma had laid off approximately 100
      employees in the prior year and that the company carried a £31 million operating loss in
      2022, with a stated target of break-even in 2024. The Sifted Series D article notes Huma's
      dependency on NHS UK as its primary customer base, with limited disclosed international
      commercial traction to that date. Customer concentration in NHS UK, combined with the
      history of restructuring, represents the principal customer-side adverse signal.
    claimRefs: [CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU036]
    tableRefs: [TU005]

