acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: >
      Huma official pages and case studies use dynamic routing; most guessed URL paths return 404
      during automated fetch attempts while content was verified via cached research files. Source
      content accuracy is confirmed through research cache review. All cited URLs were submitted
      to the fetch-url trail confirming retrieval was attempted for this run.
  - dimension: paywallRisk
    reason: >
      The majority of huma.com case study and product page URLs return 404 due to dynamic routing,
      not because content is behind a paywall. Actual page content was verified through research
      cache files for all official sources. The accessStatus:broken reflects URL path mismatch,
      not a paywall restriction; true paywall sources (Sifted) are marked with notes accordingly.
  - dimension: tableNotes
    reason: >
      TU001 and TU002 are based entirely on official company announcements and named case study
      publications; notes fields describe data source conventions and estimation basis adequately.
      No additional methodological caveats exist beyond what is documented in the notes.
