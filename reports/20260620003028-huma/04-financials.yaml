  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Huma's CAC, LTV, NRR, payback period, and churn rate by customer segment
    whyItMatters: Unit economics are essential for assessing capital efficiency and validating the platform business model thesis; without them the investment case cannot be underwritten quantitatively.
    diligencePath: Request management discussion of CAC by channel, NRR by customer segment (health system vs pharma vs platform), and cohort revenue data; obtain data room access for at least 3 years of
      customer cohort analysis.
    relatedQuestionRefs:
    - QI010
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-margin
    missingEvidence: Huma's ARR or revenue run rate by segment, gross margin by segment (platform vs services vs pharma), and confirmed break-even status
    whyItMatters: Without these metrics the valuation is speculative and the profitability timeline cannot be assessed; the 'doubled YoY' claim is unverifiable without a disclosed base figure.
    diligencePath: Request FY2023 and FY2024 Companies House accounts; obtain management accounts with segment-level P&L; confirm break-even date and current cash position.
    relatedQuestionRefs:
    - QI003
    - QI017
  - type: private-evidence-only
    severity: material
    topic: cash-position-and-burn
    missingEvidence: Huma's current cash position, monthly burn rate, and runway following the Series D and M&A deployments
    whyItMatters: Without cash position data the risk of an imminent bridge round or dilutive financing cannot be assessed; the Series D closed in July 2024 and runway depends entirely on whether break-even
      was achieved.
    diligencePath: Request latest balance sheet with cash and equivalents; specifically ask whether monthly burn has turned positive (i.e., operating cash flow positive) and what the target profitability
      runway is.
    relatedQuestionRefs:
    - QI018
  - type: stale
    severity: material
    topic: pricing-model-finalization
    missingEvidence: Final Huma Cloud Platform pricing tiers, usage rates, and enterprise minimum commitments
    whyItMatters: The pricing model was described as 'still being finalized' in July 2024; without final pricing the revenue quality and growth trajectory for the platform segment cannot be assessed.
    diligencePath: Fetch huma.com/pricing or huma.com/huma-cloud-platform/pricing for any published rate cards; ask account executives for current list pricing; review HCP customer contracts in data room.
    relatedQuestionRefs:
    - QI008
