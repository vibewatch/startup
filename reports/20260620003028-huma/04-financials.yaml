- id: public-traction
  title: Public Traction Metrics and Deployment Scale
  body: 'Huma discloses a set of deployment-scale metrics on its official website and press releases. As of April 2025, the platform supports more than 4,500 hospitals and clinics globally, has engaged
    over 50 million individuals, and operates in 70+ countries. These figures are company-claimed and not independently audited. Earlier milestones include: 3,000+ hospitals and clinics as of the July 2024
    Series D announcement; 35 million screened individuals and 1.8 million active users cited in the Series D announcement; and 100+ applications built on the HCP. The Hi-Scribe respiratory monitoring product,
    launched in March 2026, supports 38 therapists and approximately 2,250 active patients with ~2,300 monthly interaction notes—a commercially modest but clinically live deployment signal. Revenue growth
    is asserted by the company: Huma stated it ''doubled its revenue year-on-year'' in the July 2024 Series D announcement. Without a disclosed base year or absolute revenue figure, this doubling claim
    is unverifiable independently, though it is consistent with the company''s growth investments and the scale of its partner base. ARR, GMV, monthly recurring revenue, and net revenue retention are all
    private metrics not publicly disclosed. The company''s UK holding entity (Huma Therapeutics Limited) files accounts with Companies House in the UK, but FY2023 and FY2024 filings were not yet accessible
    in the research cache, leaving a material gap in independently verifiable financial data.'
