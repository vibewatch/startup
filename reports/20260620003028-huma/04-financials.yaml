chapter:
  number: 4
  title: Financials
  summary: Huma is a private company with limited public financial disclosure. It has raised over USD 300 million in total, most recently an $80M+ Series D in July 2024, and is targeting profitability after
    reporting a £31 million net loss in 2022 and similar losses in 2023. Revenue doubled year-on-year as of the Series D, but ARR, gross margin, cash on hand, and unit economics are not publicly disclosed.
    The primary adverse financial signal is the approximately 100 employee layoffs in 2023-2024, confirming material burn and management focus on cost reduction before a profitability milestone that has
    not been publicly confirmed.
sections:
- id: revenue-model
  title: Revenue Streams, Pricing Model, and Revenue Mix
  body: Huma generates revenue across three distinct streams. First, enterprise health system contracts—primarily with NHS England, the German Federal Ministry of Health, and national health systems in
    Saudi Arabia, Greece, and other countries—cover virtual wards, RPM services, population health, and primary care digitization. These are multi-year government and health system contracts with recurring
    subscription or usage-based components. Second, pharmaceutical and life sciences licensing fees—covering companion apps, decentralized clinical trials, real-world evidence programmes, and AI biomarker
    tools—represent a growing stream as Huma collaborates with over half of the top 20 pharma companies globally, including confirmed partnerships with AstraZeneca, Bayer, UCB (myasthenia gravis), and Pfizer
    (hemophilia). Third, the newly launched Huma Cloud Platform (HCP) introduces a consumption-based, self-serve platform-as-a-service model analogous to Shopify—enabling third parties (health systems,
    pharma companies, and digital health startups) to build and deploy their own regulated applications on Huma's FDA-cleared, EU MDR Class IIb infrastructure. The CEO described this pricing model as consumption-based
    'similar to Shopify' and indicated pricing was still being finalized at the time of the Series D announcement in July 2024. Specific tiers, usage rates, minimum commitments, and realized pricing for
    existing contracts remain undisclosed. The RPM product built on HCP for respiratory use cases covers 140,000 contracted lives in the US, suggesting an emerging reimbursement-supported revenue stream
    tied to CMS remote physiologic monitoring codes (CPT 99453, 99454, 99457). Revenue mix between health system, pharma, and platform segments is not publicly quantified. The transition from project-based
    service delivery (historical model) toward consumption-based platform access is expected to improve gross margins over time as the regulatory certification cost becomes amortized across a larger platform
    user base.
