- id: capital-adequacy
  title: Capital Adequacy, Burn, Runway, and Profitability Path
  body: Huma has raised USD 300M+ in total lifetime capital, including a $130M Series C in May 2021 and an $80M+ Series D completed in July 2024 with strategic investors AstraZeneca, Leaps by Bayer, Hitachi
    Ventures, and HAT SGR. The Series D was assembled through multiple smaller injections over approximately 12 months and was described by Sifted as the largest European digital health funding round since
    the start of 2023, reflecting both the tight funding environment and the strategic value of Huma's regulatory platform. The company's adverse financial signals are significant. UK Companies House filings
    confirm a £31 million net loss in 2022. CEO Dan Vahdat stated to Sifted that 2023 losses were 'similar' to 2022, implying approximately £30-32M in annual losses in both years. The company underwent
    approximately 100 layoffs in 2023-2024, reducing headcount from ~500 to ~400 to cut burn and move toward profitability. Vahdat targeted break-even 'across the year' by end of 2024 but as of the run
    date (June 2026) there is no public confirmation of whether this target was achieved. Cash on hand, monthly burn rate, and runway are not publicly disclosed. Based on the timing of the Series D ($80M+
    in July 2024), a reasonable inference is that 2024 runway extended through 2025 and into 2026, but this is an estimate only. The company has also deployed capital on M&A, acquiring Alcedis, iPlato,
    and one undisclosed company in 2023-2024, which consumed additional cash but extended platform capabilities. Huma's financing dependency—a critical underwriting risk—means the path to self-funded growth
    requires either confirmed break-even or continued investor support at acceptable dilution.
