company:
  name: Huma

chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Huma Therapeutics operates a three-layer regulated cloud platform—intelligence, product, and
    core infrastructure—that serves as a disease-agnostic Software as a Medical Device (SaMD) with
    FDA Class II (510k #K230214), EU MDR Class IIb, Saudi FDA Class C, and Health Canada Class II
    clearances. Its product suite spans eTriage for emergency departments, GDm-Health for gestational
    diabetes, Huma MG for myasthenia gravis, virtual wards/RPM for chronic disease management, eConsult
    for primary-care triage, and HI Scribe for AI-powered clinical documentation. Differentiation rests
    on multi-jurisdictional regulatory coverage and a low-code/no-code build layer, but real-world
    clinical outcomes at full production scale and developer community size remain thin diligence gaps.

sections:
  - id: platform-architecture
    title: "Platform Architecture and Layers"
    body: >
      The Huma Cloud Platform (HCP) is structured around three interdependent layers. The core
      infrastructure layer is a federated network that connects disjointed digital health systems,
      operating on a cloud-agnostic basis with data remaining securely within each institution.
      The product layer provides regulated, low-code/no-code applications for patient flow, remote
      patient monitoring (RPM), clinical dashboards, and research data capture. The intelligence
      layer (Huma Intelligence, or "Hi") adds analytics, AI agents, and machine learning tools
      including cardiovascular risk prediction, myasthenia gravis severity assessment, AI-powered
      clinical documentation (HI Scribe), and generative-AI application configuration.
      The platform is device-agnostic—integrating wearables, smart inhalers, blood glucose monitors,
      and ECG devices—and exposes APIs and an SDK enabling external developers and pharma partners to
      configure regulated applications without writing new device-specific regulatory code. Integration
      connectors exist for Epic, EMIS, SystmOne, Oracle, CompuGroup Medical, and other major EMR
      platforms. As of 2025–2026, the platform supports over 4,500 hospitals and clinics across
      70+ countries and has been used to engage or screen over 50 million individuals. The architecture
      is supported by over 100 applications built on HCP and ~100 million patients supported globally
      with HCP products.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006]
    tableRefs: [TE001]
    figureRefs: [FE001]

  - id: product-suite
    title: "Core Product Suite and Use Cases"
    body: >
      Huma's product suite covers five primary care pathways. (1) eTriage is a kiosk-based A&E
      digital check-in system deployed in 22 NHS emergency departments and urgent care centres;
      it captures ECDS data, runs automated risk stratification (P1–P5), and has safely triaged
      1.8 million patients across 21 NHS EDs and UCCs as of September 2025. (2) GDm-Health is a
      gestational diabetes management platform co-developed with Oxford University; it is live in
      64 NHS Trusts covering over 100,000 pregnancies, and an RCT supports claims of 47% fewer
      diabetes appointments and 64% lower preterm birth rates. (3) Huma MG is a remote monitoring
      platform for myasthenia gravis, with 600+ patients across UK, Europe, and the US; a structured
      experience study at St George's University Hospitals NHS Foundation Trust in 2026 showed 89%
      rated the app easy to use, 93% found MG-ADL questionnaire straightforward, and 86% wished to
      continue beyond the study period. (4) The Virtual Wards / RPM product enables hospital-at-home
      care pathways; across 450+ deployments in NHS Trusts, Huma claims the platform has doubled
      clinical capacity, reduced readmission rates by >30%, and yielded 90–95% patient adherence.
      (5) eConsult (acquired October 2024) is a digital triage and automated consultation platform
      live in over 1,400 NHS GP practices with 50+ million digital consultations delivered. The
      intelligence-layer product HI Scribe (launched March 2026 on NVIDIA AI) is a real-time
      transcription tool generating patient and clinician summaries; it was live as of March 2026
      with 38 active respiratory therapists, ~2,250 active patients, and ~2,300 live interaction
      notes generated per month. In life sciences, the Alcedis-powered clinical trials platform
      supports eCRF, EDC, eConsent, and eCOA for decentralised and hybrid trials.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE012, CE013, CE014, CE015, CE016]
    tableRefs: [TE002, TE003]
    figureRefs: [FE002]

  - id: regulatory-trust
    title: "Regulatory Status, Trust, and Compliance"
    body: >
      Huma holds multi-jurisdictional medical device regulatory clearances across its core SaMD
      platform, making it among the most broadly certified disease-agnostic platforms in the digital
      health sector. US FDA 510(k) Class II clearance (device number K230214) was received in June
      2023 via the joint eSTAR programme with Health Canada; this permits monitoring patients of all
      ages with any condition and hosting AI/ML algorithms for clinical decision support. EU MDR
      2017/745 Class IIb certification was received in March 2023, the world's first multi-condition
      configurable SaMD at that classification level. Saudi FDA Class C was received in November 2023.
      Health Canada Class II Medical Device License was received in April 2025. The platform also
      holds MHRA Class IIb (UK), TGA Class IIb (Australia), CDSCO Class C (India), and MOHAP (UAE).
      The quality management system is ISO 13485 certified (basis for MDSAP across Japan, Australia,
      Canada, US). Information security is ISO 27001 certified. Additional certifications include
      IEC 62304 (software lifecycle), IEC 62366 (usability), IEC 82304-1 (health software safety),
      ISO 14971 (risk management), ISO 14155 (clinical investigation), CyberEssentials, and
      CyberEssentials Plus. The platform is HIPAA-compliant and NHS DSPT (Data Security and
      Protection Toolkit) certified. Huma acts as Legal Manufacturer for customer deployments,
      providing a certified quality framework that reduces the regulatory burden on customers
      seeking to launch new disease-specific applications.
    claimRefs: [CE017, CE018, CE019, CE020, CE021, CE022, CE023]
    tableRefs: [TE004]
    figureRefs: [FE003]

  - id: technology-differentiation
    title: "Technology Differentiation and AI Stack"
    body: >
      Huma's core technical differentiation lies in its pre-certified, device-agnostic regulatory
      wrapper enabling third parties to configure regulated health applications in days rather than
      years. The AI/ML stack within Huma Intelligence is structured around three capability clusters:
      monitoring and predictive intelligence (CVD risk prediction via a model trained on 500,000+
      UK Biobank individuals, myasthenia gravis severity tracking via validated questionnaires and
      computer-vision analysis, range-of-motion tracking post-surgery); generative AI for clinical
      workflows (HI Scribe using NVIDIA Parakeet ASR and TitaNet speaker identification, with
      NVIDIA-optimized Llama models for reasoning); and AI-assisted application configuration via
      Huma Workspace (low-code, prompt-driven generation of regulated health applications). The
      federated data model means patient data is processed at the institution level; cross-institution
      analytics are supported on a federated basis without requiring data centralisation, which
      addresses EU GDPR and UK NHS data governance constraints. Google Cloud Vertex AI is an
      announced collaboration partner for generative AI use-case development. The GitHub organisation
      huma-engineering has public repositories including huma-docs (MIT-licensed documentation
      service with 8 contributors, 3 stars, updated June 2026) and huma-common-actions, indicating
      an active but small public developer surface. The IP portfolio includes the cardiovascular risk
      algorithm cleared by the FDA as part of the 510(k) submission and validated in the European
      Society of Cardiology.
    claimRefs: [CE024, CE025, CE026, CE027, CE028, CE029, CE030]
    tableRefs: [TE005]
    figureRefs: [FE004]

  - id: roadmap-gaps
    title: "Roadmap, Dependencies, and Technical Gaps"
    body: >
      Huma's published roadmap as of H1 2026 includes: (1) HI Scribe US rollout to additional
      respiratory therapists and extension to 25 languages; (2) integration of Aluna respiratory
      spirometry hardware (FDA Class II post-acquisition) onto HCP; (3) continued expansion in
      Germany where HCP powered the HANSE lung screening programme that recruited 5,191 participants
      in 15 months and directly shaped Germany's 2026 national lung cancer screening programme
      launch; (4) extension of the MG-ADL framework for broader symptom capture. Key platform
      dependencies include NVIDIA AI infrastructure for HI Scribe (Parakeet, TitaNet, Llama
      Nemotron), Google Cloud for Vertex AI integration, and the NHS CCS Spark DPS RM6904
      agreement as the procurement route for NHS virtual ward technology. The open developer
      community is thin: the huma-engineering GitHub org has a small number of public repositories
      and low external star/fork activity, which limits independent verification of platform
      internals. No public API status page was accessible during this research run. Clinical outcome
      evidence is strongest for GDm-Health (RCT) and eTriage (3+ years NHS deployment), while
      HI Scribe, CVD screening algorithm, and MG computer-vision modules remain early-stage with
      limited peer-reviewed outcome data beyond company-authored publications and conference
      presentations.
    claimRefs: [CE031, CE032, CE033, CE034, CE035]

