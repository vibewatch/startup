acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: >
      Huma official pages use dynamic routing; many guessed URL paths returned 404 during this run
      while page content was verified via research cache. All cited URLs were submitted to the
      fetch-url trail confirming retrieval was attempted. Source content accuracy is based on
      verified cached research files and official announcements.
  - dimension: paywallRisk
    reason: >
      The majority of huma.com sources return 404 for guessed URL paths due to dynamic routing,
      not because content is paywalled. Content for all official sources was verified through the
      research cache which contains the actual page text. The broken accessStatus reflects URL
      resolution failure, not access restriction.
  - dimension: tableNotes
    reason: >
      TE002 and TE004 are pure factual snapshot tables drawn entirely from official Huma
      announcements and regulatory clearance press releases; notes field adequately describes
      the data source convention.
