callouts:
  - calloutType: strength
    title: "Multi-jurisdictional SaMD certification is a structural moat"
    body: >
      Huma is the only disease-agnostic configurable SaMD platform to hold EU MDR Class IIb, US FDA
      Class II (510k), Saudi FDA Class C, and Health Canada Class II clearances simultaneously. This
      multi-jurisdictional regulatory portfolio took over a decade to build and represents a barrier
      to entry that significantly reduces the time-to-market cost for pharma and NHS customers.
    claimRefs: [CE017, CE018, CE019, CE020]

  - calloutType: risk
    title: "NVIDIA dependency for HI Scribe is a concentration risk"
    body: >
      The HI Scribe product is architecturally dependent on NVIDIA Parakeet, TitaNet, and Llama
      Nemotron models. Should NVIDIA change API pricing, deprecate models, or alter licensing terms,
      Huma would need to re-engineer HI Scribe and potentially obtain regulatory re-clearance for
      any material model change.
    claimRefs: [CE015, CE025]

  - calloutType: risk
    title: "Small public developer community limits external validation"
    body: >
      The huma-engineering GitHub organisation has limited public repository activity (huma-docs has
      3 stars, 8 contributors) and no publicly visible SDK documentation or changelog. This limits
      independent technical scrutiny and makes ecosystem size difficult to assess.
    claimRefs: [CE030]

  - calloutType: insight
    title: "GDm-Health is the strongest clinically validated product in the portfolio"
    body: >
      GDm-Health has the highest-quality evidence base in Huma's portfolio: co-developed with Oxford
      University, evaluated in an RCT, and deployed across >50% of UK gestational diabetes patients.
      This is the anchor product for claims about clinical outcome impact and should be the
