      - number: '6.5'
        title: Expansion, Concentration Risk, and Channel
        blocks:
          - type: paragraph
            body: >
              NHS UK constitutes the dominant revenue segment, creating concentration risk. The majority of Huma's named
              production deployments, named case studies, and clinical outcome evidence are NHS-denominated. The
              acquisition of eConsult and Aluna in 2024–2025 represents intentional risk mitigation through channel
              diversification. eConsult expands UK primary care reach; Aluna provides a direct US respiratory market
              beachhead with ~500,000 contracted lives. The Bayer CVD screening partnership spans Saudi Arabia and the
              US, providing two non-NHS revenue streams with a Tier 1 pharma partner. In life sciences, Alcedis brings
              30+ years of European CRO relationships, with named studies involving Boehringer Ingelheim, UCB, and
              unspecified CKD/T2D sponsors across 20 countries. Land-and-expand is evident at the NHS Trust level:
              several Trusts began with eTriage pilots before expanding to virtual ward or eConsult deployments. The NHS
              CCS Spark DPS RM6904 procurement framework is described as the only NHS-endorsed route for virtual ward
              technology, creating a structural channel barrier for competitors. Sifted reported in July 2024 that Huma
              had laid off approximately 100 employees in the prior year and that the company carried a £31 million
              operating loss in 2022, with a stated target of break-even in 2024. The Sifted Series D article notes
              Huma's dependency on NHS UK as its primary customer base, with limited disclosed international commercial
              traction to that date. Customer concentration in NHS UK, combined with the history of restructuring,
              represents the principal customer-side adverse signal.
