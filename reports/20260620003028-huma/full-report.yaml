      - number: '8.2'
        title: Market tailwinds exist, but public comparables cap the valuation argument
        blocks:
          - type: paragraph
            body: >-
              The category backdrop is attractive. Grand View, Fortune Business Insights, and Insight Partners all
              describe large and growing digital health, RPM, and hospital-at-home markets, while McKinsey frames
              healthcare access and labor shortage as structural demand drivers for digitally enabled care. That
              supports why Huma can plausibly grow. But a good market does not eliminate valuation discipline. The most
              relevant public benchmark, iRhythm, shows what a specialist RPM company looks like after years of
              commercialization: substantial revenue, strong gross margin, and recently achieved positive free cash
              flow. Masimo and Philips show how much larger hospital-monitoring incumbents are, but they are hardware or
              diversified-care references, not clean platform comparables. The more cautionary benchmarks are
              private-market outcomes: Best Buy's troubled Current Health ownership and Biofourmis' merger with
              CopilotIQ show that this sector has produced consolidation and impaired expectations, not universally
              strong exits. That mix argues for a premium to weak digital-health peers because of Huma's regulatory
              moat, but not for paying peak-market software multiples without more disclosure.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
