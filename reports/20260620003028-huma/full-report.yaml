  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture and Layers
        blocks:
          - type: paragraph
            body: >
              The Huma Cloud Platform (HCP) is structured around three interdependent layers. The core infrastructure
              layer is a federated network that connects disjointed digital health systems, operating on a
              cloud-agnostic basis with data remaining securely within each institution. The product layer provides
              regulated, low-code/no-code applications for patient flow, remote patient monitoring (RPM), clinical
              dashboards, and research data capture. The intelligence layer (Huma Intelligence, or "Hi") adds analytics,
              AI agents, and machine learning tools including cardiovascular risk prediction, myasthenia gravis severity
              assessment, AI-powered clinical documentation (HI Scribe), and generative-AI application configuration.
              The platform is device-agnostic—integrating wearables, smart inhalers, blood glucose monitors, and ECG
              devices—and exposes APIs and an SDK enabling external developers and pharma partners to configure
              regulated applications without writing new device-specific regulatory code. Integration connectors exist
              for Epic, EMIS, SystmOne, Oracle, CompuGroup Medical, and other major EMR platforms. As of 2025–2026, the
              platform supports over 4,500 hospitals and clinics across 70+ countries and has been used to engage or
              screen over 50 million individuals. The architecture is supported by over 100 applications built on HCP
              and ~100 million patients supported globally with HCP products.
            claimRefs:
