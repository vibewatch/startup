              - CV045
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation remains track, not buy
            body: >-
              Huma has enough regulatory, customer, and partner proof to stay on the list, but not enough disclosed
              economics to justify a conviction pricing view.
            calloutType: recommendation
            claimRefs:
              - CV030
              - CV032
              - CV044
          - type: callout
            title: Current Health is the most important adverse benchmark
            body: >-
              The Current Health acquisition and reversal show that a credible RPM platform can still produce
              disappointing outcomes when economics and market timing do not line up.
            calloutType: risk
            claimRefs:
              - CV027
              - CV029
              - CV039
          - type: callout
            title: The next valuation step depends on Huma Cloud evidence
            body: >-
              If Huma Cloud proves to be a real consumption-based regulated infrastructure product, valuation support
              expands materially; if it stays services-heavy, it does not.
            calloutType: insight
            claimRefs:
              - CV031
              - CV042
