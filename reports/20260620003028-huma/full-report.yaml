      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Huma has raised over $300 million in total capital across multiple rounds since its 2011 founding. The
              most recent financing was a Series D of over $80 million announced July 16, 2024. Importantly, this Series
              D encompassed multiple tranches of investment received since the Series C (May 2021), meaning Huma issued
              shares over several years cumulatively totalling over $80 million before the formal round close. Investors
              in the Series D included AstraZeneca (new), Hat Technology Fund 4 by HAT SGR (new), HV Fund by Hitachi
              Ventures (existing), and Leaps by Bayer (existing long-term backer). HSBC Bank plc acted as financial
              adviser during the raise.


              As of July 2024, the about page on Huma's website stated "$250m raised so far"—which appears to be a stale
              figure predating the $300m+ disclosed in the Series D press release. This discrepancy is a minor data
              quality issue rather than a material conflict. Total capital raised as of the Series D close is confirmed
              by both the company's own announcement and independent reporting (FierceHealthcare, Sifted) at over $300
              million.


              Huma has not publicly disclosed a formal valuation for any round; it remains a private company with no
              publicly reported post-money valuation. The company made a loss of £31 million in fiscal year 2022
              according to Companies House filings cited by Sifted. Figures for 2023 were described by CEO Dan Vahdat as
              "similar" to 2022 in the Sifted interview around the Series D close. The company has been targeting
              break-even since mid-2024 but no formal profitability milestone has been confirmed. In addition to equity,
              Huma has made at least four known acquisitions financed through a combination of cash and equity
              consideration.
