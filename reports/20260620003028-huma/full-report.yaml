      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Huma's go-to-market operates across three buyer archetypes with structurally distinct procurement cycles,
              budget ownership, and success metrics. Health systems constitute the largest buyer segment by patient
              volume. In the UK, NHS England's Virtual Ward programme creates a mandated procurement channel: NHS
              England committed to 10,000+ virtual ward beds by end-2024, requiring technology- enabled remote
              monitoring platforms. NHS procurement cycles average 12-24 months from initial tender to live deployment,
              with NHS frameworks (e.g., G-Cloud, NHS Digital frameworks) as the primary procurement vehicle. Budget
              ownership typically rests with NHS Integrated Care Board (ICB) digital health or virtual care
              transformation leads.

              In the United States, commercial health systems procure RPM software under CMS CPT codes 99453, 99454,
              99457, and 99458, which enable Medicare and Medicaid reimbursement of approximately $100- $150 per
              enrolled patient per month for certified RPM services. This reimbursement structure creates a
              pay-per-patient SaaS-compatible revenue model — Huma's US RPM strategy via Aluna targets approximately
              500,000 contracted lives across 150+ US health systems, at which scale the potential RPM reimbursement
              pool exceeds $600M annually if fully captured. Capital-efficient conversion of contracted lives to active
              enrolled patients is the key adoption challenge.

              Life-sciences companies (pharma, biotech) represent the highest average contract value segment.
              Decentralized clinical trial (DCT) software deals range from $2M to $10M+ per study, with deployment
              cycles of 6-18 months. Decision makers are VP Clinical Operations, Chief Digital Officers, and VP Patient
              Engagement. Huma's Alcedis subsidiary brings end-to-end CRO capability that differentiates it from pure
              SaaS DCT vendors. Over 50% of the top-20 global pharma companies have engaged Huma per company claims,
              though deal-level revenue figures are undisclosed.

              Government and public-health buyers (Saudi MOH, German Federal Ministry of Health, Greek health agencies)
              engage through national screening programmes with multi-year contracts funded by national health IT
              budgets. Saudi Arabia's Vision 2030 programme allocates over $40 billion to healthcare transformation;
              Huma's Bayer CVD screening programme and Saudi FDA Class C certification position it directly in this
              procurement cycle.
