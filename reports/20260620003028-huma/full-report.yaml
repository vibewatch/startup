      - number: '2.2'
        title: 'Market Sizing: Three-Lens TAM, SAM, and SOM Analysis'
        blocks:
          - type: paragraph
            body: >
              Multiple independent market research firms provide significantly divergent digital health market estimates
              depending on methodology, scope, and base year. Grand View Research sizes the global digital health market
              at $288.55 billion in 2024, growing to $946 billion by 2030 at a 22.2% compound annual growth rate (CAGR).
              Fortune Business Insights offers a larger estimate of $491.62 billion in 2026 growing to $2.35 trillion by
              2034 at a 21.6% CAGR. These differences primarily reflect scope boundaries — Grand View's estimate
              excludes hardware-intensive telemedicine devices that Fortune BI includes, and the base-year reference
              differs.

              For the sub-market most directly relevant to Huma — remote patient monitoring devices and software —
              Fortune Business Insights estimates $59.92 billion in 2025 growing to $289.77 billion by 2034 at a 19.16%
              CAGR. The Hospital-at-Home market, Huma's primary NHS go-to-market channel, is separately estimated by The
              Insight Partners at $37.17 billion in 2025 growing to $72.84 billion by 2034 at a 7.8% CAGR — a
              substantially slower growth rate reflecting the capital intensity and clinical complexity of acute home
              care delivery.

              For a tighter serviceable addressable market (SAM) estimation, the software and platform licensing layer
              within RPM and virtual care — which excludes hardware, logistics, and nursing services — represents
              approximately 15-25% of the RPM market value based on comparable SaaS healthcare platform margins.
              Applying this capture rate to the RPM market yields a SAM of approximately $9-15 billion in 2025 growing
              to $43-72 billion by 2034. Huma's current contracted patient base (~500K US RPM lives plus 4,500+
              hospitals globally) implies a serviceable obtainable market (SOM) of approximately $500M-$1.5B ARR at
              scale across its three customer segments, assuming $50-100 per patient per year in SaaS fees and $2-10M
              per pharma study. Actual current revenue is undisclosed; CEO stated RPM revenue doubled year-over-year in
              the twelve months to Series D close.

              McKinsey's digital health market analysis identifies five value pools: electronic health records, care
              delivery, care management, digital therapeutics, and analytics/AI — Huma straddles the care management,
              digital therapeutics, and analytics/AI pools, suggesting the effective SAM is a blended slice across
              multiple value pools rather than any single segment estimate.
