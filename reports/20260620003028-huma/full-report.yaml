      - number: '7.5'
        title: Mitigations, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The correct investment framing is conditional rather than binary. Huma already has meaningful mitigants:
              cleared and certified products, a large installed footprint, NHS operating experience, and blue-chip
              strategic partners. Those facts justify further diligence; they do not eliminate the need for it.
              Monitoring should focus on events that would directly break the thesis: loss or material restriction of
              key regulatory statuses; lapse in NHS procurement or trust requirements; a material privacy, security, or
              patient-safety incident; inability to show a stable post-Series D path to break-even; or evidence that new
              AI modules cannot be validated quickly enough for clinical deployment. The diligence burden should
              therefore be document-heavy and operationally specific: per-product regulatory maps, SCC and DPA packages,
              uptime and incident logs, concentration by customer and partner, AI change-control governance, and
              post-acquisition integration KPIs. If those artifacts are weak, the remaining risk is not just slower
              growth; it is that Huma becomes a permanently complex, lower-margin services and compliance business
              instead of a scalable regulated software platform.
            claimRefs:
