      - number: '5.4'
        title: Technology Differentiation and AI Stack
        blocks:
          - type: paragraph
            body: >
              Huma's core technical differentiation lies in its pre-certified, device-agnostic regulatory wrapper
              enabling third parties to configure regulated health applications in days rather than years. The AI/ML
              stack within Huma Intelligence is structured around three capability clusters: monitoring and predictive
              intelligence (CVD risk prediction via a model trained on 500,000+ UK Biobank individuals, myasthenia
              gravis severity tracking via validated questionnaires and computer-vision analysis, range-of-motion
              tracking post-surgery); generative AI for clinical workflows (HI Scribe using NVIDIA Parakeet ASR and
              TitaNet speaker identification, with NVIDIA-optimized Llama models for reasoning); and AI-assisted
              application configuration via Huma Workspace (low-code, prompt-driven generation of regulated health
              applications). The federated data model means patient data is processed at the institution level;
              cross-institution analytics are supported on a federated basis without requiring data centralisation,
              which addresses EU GDPR and UK NHS data governance constraints. Google Cloud Vertex AI is an announced
              collaboration partner for generative AI use-case development. The GitHub organisation huma-engineering has
              public repositories including huma-docs (MIT-licensed documentation service with 8 contributors, 3 stars,
              updated June 2026) and huma-common-actions, indicating an active but small public developer surface. The
              IP portfolio includes the cardiovascular risk algorithm cleared by the FDA as part of the 510(k)
              submission and validated in the European Society of Cardiology.
