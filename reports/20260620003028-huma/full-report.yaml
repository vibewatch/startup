      - number: '5.3'
        title: Regulatory Status, Trust, and Compliance
        blocks:
          - type: paragraph
            body: >
              Huma holds multi-jurisdictional medical device regulatory clearances across its core SaMD platform, making
              it among the most broadly certified disease-agnostic platforms in the digital health sector. US FDA 510(k)
              Class II clearance (device number K230214) was received in June 2023 via the joint eSTAR programme with
              Health Canada; this permits monitoring patients of all ages with any condition and hosting AI/ML
              algorithms for clinical decision support. EU MDR 2017/745 Class IIb certification was received in March
              2023, the world's first multi-condition configurable SaMD at that classification level. Saudi FDA Class C
              was received in November 2023. Health Canada Class II Medical Device License was received in April 2025.
              The platform also holds MHRA Class IIb (UK), TGA Class IIb (Australia), CDSCO Class C (India), and MOHAP
              (UAE). The quality management system is ISO 13485 certified (basis for MDSAP across Japan, Australia,
              Canada, US). Information security is ISO 27001 certified. Additional certifications include IEC 62304
              (software lifecycle), IEC 62366 (usability), IEC 82304-1 (health software safety), ISO 14971 (risk
              management), ISO 14155 (clinical investigation), CyberEssentials, and CyberEssentials Plus. The platform
              is HIPAA-compliant and NHS DSPT (Data Security and Protection Toolkit) certified. Huma acts as Legal
              Manufacturer for customer deployments, providing a certified quality framework that reduces the regulatory
              burden on customers seeking to launch new disease-specific applications.
