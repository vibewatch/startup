  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and ranking
        blocks:
          - type: paragraph
            body: >-
              Huma is not a pre-proof digital health startup. It already has multi-jurisdiction medical-device
              clearances, NHS virtual ward deployments, major pharma relationships, and tens of millions of screened
              users. That maturity lowers first-order market-entry risk, but it changes the failure mode: mistakes now
              propagate through regulated workflows, patient data processing, partner dependencies, and enterprise
              procurement rather than through simple customer acquisition noise. The highest-severity residual risks are
              therefore concentrated in maintaining approvals across FDA, EU, UK, Canada, and Saudi Arabia; keeping
              privacy and international data-transfer controls robust at scale; preserving platform reliability for
              virtual wards and remote monitoring; managing dependence on NHS pathways, pharma partners, and Google
              Cloud for new AI features; and funding the path from repeated losses to credible break-even without
              another destabilizing cost-reset. The visible mitigants—FDA and MDR approvals, ISO 13485, ISO 27001, SOC 2
              Type II, NHS DSPT, and large strategic partners—are meaningful, but they are process controls, not proof
              that every new algorithm, acquisition, or market expansion can be absorbed without delay or safety debt.
