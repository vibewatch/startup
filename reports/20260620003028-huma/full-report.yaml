      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Dan Vahdat, an Iranian-British entrepreneur, founded Huma in 2011 as Medopad in London and has served as
              CEO continuously since founding. Vahdat has maintained a high public profile advocating for UK digital
              health investment, including testimony before Parliament in 2026. No co-founder has been named in the
              public record; Huma's growth appears to be founder-CEO-led throughout. Key-person concentration on Dan
              Vahdat is a material governance risk given his dual role as founder, CEO, and public face of the company.


              Dr. Mert Aral serves as Chief Medical Officer (CMO), responsible for clinical safety, regulatory science,
              and evidence generation. Dr. Harpreet Sood is VP of Primary Care and Partnerships, with a background as a
              former NHS Digital clinical informatician. Michael Macdonnell serves as Global Head of Healthcare and
              Pharma Partnerships.


              Board and governance details are not publicly disclosed by the company; known institutional representation
              includes Leaps by Bayer, AstraZeneca, and Hitachi Ventures as Series D investors likely holding board or
              observer rights. The eConsult acquisition announcement (October 2024) noted that eConsult CEO Dr. Murray
              Ellender joined as part of that transaction. The Eckuity Capital partnership (May 2025) added Youssef
              Sebban and Vishal Jain as key external principals with capital and M&A advisory roles. Full board roster,
              governance structure, and independent director count have not been publicly disclosed.
