  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Profile
        blocks:
          - type: paragraph
            body: >
              Huma's commercial footprint spans three primary customer segments. The first and largest is NHS and public
              health systems in the United Kingdom. NHS Trusts procure Huma products — primarily eTriage, GDm-Health,
              Virtual Wards/RPM, and eConsult — through the NHS CCS Spark DPS RM6904 approved procurement framework. NHS
              Trusts (acute, primary care, community) act as both buyer and user. The second segment is pharmaceutical
              and life sciences. Pharma companies including Boehringer Ingelheim, UCB, Bayer, AstraZeneca, Smith+Nephew,
              Janssen, and Parexel use Huma's clinical trial infrastructure (Alcedis CRO subsidiary) for eCRF, EDC,
              eCOA, and decentralised trial design. They act as buyers; patients and principal investigators are
              end-users. The third segment is government and public health agencies: Saudi Arabia (Vision 2030 CVD
              screening), Germany (HANSE national lung cancer screening), and early engagement in India, UAE, and
              Australia. Huma identifies itself as a "Shopify for digital health", targeting organisations that want to
              deploy regulated health applications with reduced time-to-market. US market entry has been accelerated
              through the acquisition of Aluna (Knox Medical Diagnostics, May 2025), which contributed 150+ US clinic
              networks and approximately 500,000 contracted respiratory monitoring lives.
