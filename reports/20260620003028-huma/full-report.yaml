  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing Model, and Revenue Mix
        blocks:
          - type: paragraph
            body: >-
              Huma generates revenue across three distinct streams. First, enterprise health system contracts—primarily
              with NHS England, the German Federal Ministry of Health, and national health systems in Saudi Arabia,
              Greece, and other countries—cover virtual wards, RPM services, population health, and primary care
              digitization. These are multi-year government and health system contracts with recurring subscription or
              usage-based components. Second, pharmaceutical and life sciences licensing fees—covering companion apps,
              decentralized clinical trials, real-world evidence programmes, and AI biomarker tools—represent a growing
              stream as Huma collaborates with over half of the top 20 pharma companies globally, including confirmed
              partnerships with AstraZeneca, Bayer, UCB (myasthenia gravis), and Pfizer (hemophilia). Third, the newly
              launched Huma Cloud Platform (HCP) introduces a consumption-based, self-serve platform-as-a-service model
              analogous to Shopify—enabling third parties (health systems, pharma companies, and digital health
              startups) to build and deploy their own regulated applications on Huma's FDA-cleared, EU MDR Class IIb
              infrastructure. The CEO described this pricing model as consumption-based 'similar to Shopify' and
              indicated pricing was still being finalized at the time of the Series D announcement in July 2024.
              Specific tiers, usage rates, minimum commitments, and realized pricing for existing contracts remain
              undisclosed. The RPM product built on HCP for respiratory use cases covers 140,000 contracted lives in the
              US, suggesting an emerging reimbursement-supported revenue stream tied to CMS remote physiologic
              monitoring codes (CPT 99453, 99454, 99457). Revenue mix between health system, pharma, and platform
              segments is not publicly quantified. The transition from project-based service delivery (historical model)
              toward consumption-based platform access is expected to improve gross margins over time as the regulatory
              certification cost becomes amortized across a larger platform user base.
