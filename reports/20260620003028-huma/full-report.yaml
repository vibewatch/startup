      - number: '5.2'
        title: Core Product Suite and Use Cases
        blocks:
          - type: paragraph
            body: >
              Huma's product suite covers five primary care pathways. (1) eTriage is a kiosk-based A&E digital check-in
              system deployed in 22 NHS emergency departments and urgent care centres; it captures ECDS data, runs
              automated risk stratification (P1–P5), and has safely triaged 1.8 million patients across 21 NHS EDs and
              UCCs as of September 2025. (2) GDm-Health is a gestational diabetes management platform co-developed with
              Oxford University; it is live in 64 NHS Trusts covering over 100,000 pregnancies, and an RCT supports
              claims of 47% fewer diabetes appointments and 64% lower preterm birth rates. (3) Huma MG is a remote
              monitoring platform for myasthenia gravis, with 600+ patients across UK, Europe, and the US; a structured
              experience study at St George's University Hospitals NHS Foundation Trust in 2026 showed 89% rated the app
              easy to use, 93% found MG-ADL questionnaire straightforward, and 86% wished to continue beyond the study
              period. (4) The Virtual Wards / RPM product enables hospital-at-home care pathways; across 450+
              deployments in NHS Trusts, Huma claims the platform has doubled clinical capacity, reduced readmission
              rates by >30%, and yielded 90–95% patient adherence. (5) eConsult (acquired October 2024) is a digital
              triage and automated consultation platform live in over 1,400 NHS GP practices with 50+ million digital
              consultations delivered. The intelligence-layer product HI Scribe (launched March 2026 on NVIDIA AI) is a
              real-time transcription tool generating patient and clinician summaries; it was live as of March 2026 with
              38 active respiratory therapists, ~2,250 active patients, and ~2,300 live interaction notes generated per
              month. In life sciences, the Alcedis-powered clinical trials platform supports eCRF, EDC, eConsent, and
              eCOA for decentralised and hybrid trials.
