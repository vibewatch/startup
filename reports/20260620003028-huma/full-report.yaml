  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundaries
        blocks:
          - type: paragraph
            body: >
              Huma Therapeutics operates at the intersection of clinical-grade remote patient monitoring (RPM), virtual
              care delivery, and Software as a Medical Device (SaMD) — a sub-segment of the broader digital health
              software market. The primary served market is disease-agnostic, configurable SaMD licensed to health
              systems, life-sciences companies, and governments. This differs from narrow single-indication RPM devices
              (e.g., cardiac patches), consumer wellness applications, and EHR platforms, all of which are excluded from
              Huma's direct competitive space.

              The digital health market broadly captures software, hardware, and services enabling diagnosis, treatment,
              monitoring, and care delivery via digital means. Within this, the RPM software layer (distinct from RPM
              hardware) represents Huma's primary addressable opportunity. Hospital-at-Home (HaH) — delivering acute and
              post-acute care at patients' homes via remote monitoring — is a structurally significant sub-market that
              national health systems in the UK, US, and Germany are actively scaling. Decentralized clinical trials
              (DCT) constitute a second high-value adjacent market where Huma's Alcedis subsidiary competes directly.

              Status-quo substitutes remain in-person clinic visits, bedside monitoring equipment (traditional intensive
              monitoring), and paper-based or manual clinical-trial data collection. Regulatory classification matters
              acutely in this space: SaMD that hosts predictive AI/ML algorithms is regulated as Class II or higher in
              the US, UK, and EU, creating a structural barrier that separates certified platforms from general-purpose
              digital health software vendors.

              The EU Medical Device Regulation (EU MDR), effective May 2021 and fully enforced by 2024, raised
              classification requirements for SaMD platforms, driving less-prepared vendors to exit or downgrade their
              claims. This regulation-driven attrition is a supply-side tailwind for Huma, whose EU MDR Class IIb
              certification was achieved in March 2023. NHS England's virtual ward programme, which mandates
              technology-enabled remote monitoring, further defines a captive procurement channel for certified SaMD
              platforms in the UK.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
