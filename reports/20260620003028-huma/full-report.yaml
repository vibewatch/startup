      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Huma's operating risk sits inside clinical workflows, not just enterprise software operations. NHS virtual
              wards, remote monitoring programs, and companion apps depend on timely connectivity, alerting, escalation
              logic, and patient engagement; a failure here can become a patient-safety issue before it becomes a churn
              issue. Huma's published certifications—ISO 13485, ISO 27001, SOC 2 Type II, Cyber Essentials Plus, and NHS
              DSPT—show real control investment, but they do not disclose uptime, incident history, alert false-negative
              rates, or CAPA and complaints trends. Operational complexity also rises because Huma has expanded through
              acquisitions such as Alcedis and iPlato, and because decentralized trials, patient engagement, and RPM
              products must be integrated onto one cloud and regulatory backbone. The risk is therefore less that Huma
              lacks a compliance program and more that scale, acquisitions, and new AI functionality can outrun
              validation, monitoring, or support capacity—especially after layoffs reduced headcount from roughly 500 to
              roughly 400.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR031
