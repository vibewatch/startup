          equity dilution is unquantifiable
        - >-
          Request latest balance sheet (cash, cash equivalents, short-term investments); ask specifically whether
          break-even was achieved in 2024 and what current monthly burn is
      - - Net revenue retention (NRR) and churn rate
        - >-
