      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Top residual risk
            body: >-
              The biggest underwriting risk is not whether Huma has product demand; it is whether regulated,
              privacy-sensitive, AI-enabled scale stays operationally clean while the company is still working toward
              break-even.
            calloutType: risk
