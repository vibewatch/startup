      - number: '1.5'
        title: Scale, Customers, and Platform Reach
        blocks:
          - type: paragraph
            body: >
              As of May 2025, Huma's platform supports 4,500+ hospitals and clinics and engages more than 50 million
              individuals across 70+ countries in 4 continents. The company reports approximately 100 million patients
              supported globally with HCP products. In life sciences, Huma's Alcedis subsidiary has conducted 670+
              studies and recruited 1 million+ participants across 70+ countries over 30+ years. Pharma partnerships
              span more than half of the top 20 global pharmaceutical companies, including UCB, Pfizer, AstraZeneca, and
              Bayer.


              In the UK, Huma states it is implemented in more than two-thirds of all primary and secondary care
              providers following the eConsult acquisition. National deployments include the NHS England virtual wards
              program, German Federal Ministry of Health projects, Greek national initiatives, and Saudi Arabia Vision
              2030 health programs. The US RPM business has grown significantly since launching with the FDA clearance,
              with the respiratory RPM product covering 140,000 contracted lives as of July 2024 per the Series D press
              release. The addition of the Aluna acquisition (May 2025) added approximately 500,000 contracted lives in
              respiratory care across 150+ US health systems.


              Cover metrics with confidence levels: Valuation undisclosed (private company; no round valuation publicly
              confirmed); Total raised >$300 million (high confidence, confirmed); Revenue/ARR undisclosed (low
