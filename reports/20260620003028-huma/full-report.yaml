companyProfile:
  summary: >-
    Huma is a London-founded digital health infrastructure company building a regulated software layer for remote
    patient monitoring, virtual wards, hospital-at-home programs, companion apps, and digital-first clinical research.
    Its Huma Cloud Platform combines federated data infrastructure, configurable product modules, and an intelligence
    layer that can host regulated AI and clinical decision-support workflows. Public materials show deep regulatory
    work, broad partner coverage across health systems and pharma, and meaningful deployment scale, while leaving the
    core economic profile largely private.
