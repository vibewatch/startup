      - number: '4.2'
        title: GTM Motion, Unit Economics, and Sales Efficiency
        blocks:
          - type: paragraph
            body: >-
              Huma's go-to-market motion combines direct enterprise sales targeting national health systems and global
              pharma companies with a newly launched self-serve Huma Workspace platform for smaller customers and
              digital health startups. The enterprise sales channel—focused on NHS, German government, Saudi Ministry of
              Health, and top-20 pharma accounts—involves long sales cycles, regulatory and security evaluation
              processes, and multi-year contracts. Huma's Health Canada Class II clearance (April 2025) and CDSCO Class
              C (India) clearance extend its enterprise sales addressable geography. The pharma channel benefits from
              Huma's existing relationships with over half of the top 20 pharma companies, which creates an
              account-expansion playbook: initial companion app or clinical trial use cases can expand to additional
              therapeutic areas and post-market surveillance programmes. Unit economics—including customer acquisition
              cost (CAC), lifetime value (LTV), net revenue retention (NRR), and payback period—are not publicly
              available for Huma. As a proxy, iRhythm's 2025 gross margin of 70.6% represents the premium end for a
              vertical RPM model; Huma's margin is expected to be lower in the near term given its larger service and
              regulatory maintenance overhead, but the platform model is designed to asymptotically approach SaaS-level
              margins as consumption scales. The Hi-Scribe product (March 2026 launch) provides an early adoption
              signal: 38 active respiratory therapists and approximately 2,250 active patients across US clinics,
              generating approximately 2,300 live interaction notes per month. This modest early traction indicates the
              product is live but has not yet achieved material commercial scale.
