          - type: paragraph
            body: >
              Huma's most credible adoption evidence centres on NHS deployments in the UK. eTriage is live in 22 NHS
              Emergency Departments, Minor Injury Units, and Urgent Care Centres as of October 2025, having triaged 1.8
              million patients; a new deployment at a major London NHS ED in October 2025 processed 250+ patients within
              its first 24 hours, routing critical cases to Epic and lower-acuity cases to Adastra without manual
              intervention. GDm-Health covers 64 NHS Trusts, serving over 100,000 pregnancies annually and more than 50%
              of all UK gestational diabetes patients. The Virtual Wards / RPM product is deployed across 450+ NHS Trust
              sites with 140,000 contracted respiratory monitoring lives. eConsult, acquired in October 2024, has
              delivered over 50 million digital consultations across 1,400+ NHS GP practices. In life sciences, the
              CKD/T2D clinical trial enrolled 4,500 patients across 350 sites and 20 countries, completing enrolment one
