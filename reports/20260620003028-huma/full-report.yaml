    rows:
      - - Bull
        - >-
          Huma Cloud adoption accelerates, break-even is proven, margins trend toward premium software levels, and the
          regulatory moat continues to shorten partner time-to-launch.
        - >-
          Illustrative support band of roughly $0.9B-$1.5B on premium late-stage software-style multiples if private
          revenue quality is strong.
