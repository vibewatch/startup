            body: >-
              iRhythm (NASDAQ: IRTC) is a public-company benchmark for premium vertical RPM. Its Zio wearable ECG patch
              generated USD 747.1 million in 2025 revenue—a 26.2% year-over-year increase—at 70.6% gross margins,
              achieving positive GAAP net income in Q4 2025 for the first time. iRhythm's model is reimbursement-driven,
              narrowly focused on cardiac arrhythmia detection, and relies on individual Zio patch service contracts
              billed through CMS codes; it does not compete on platform breadth or disease-agnostic coverage. Masimo
              Corporation is a hardware-centric patient monitoring company whose multi-parameter monitoring devices
              (pulse oximetry, capnography, and rainbow technology) dominate hospital pulse oximetry but whose software
              layer (Masimo SafetyNet) represents an add-on rather than a standalone platform. Philips' 2025 annual
              report reflects a connected-care business that has undergone significant restructuring following
              ventilator recall controversies; its RPM revenue previously reached USD 6.8 billion in 2020 but current
              segment details require direct access to the full 2025 filing. AliveCor's KardiaMobile and Kardia system
              provide consumer-grade personal ECG devices that address cardiac monitoring for individual consumers
              rather than health-system deployment workflows; it competes in the consumer remote monitoring niche rather
              than in enterprise clinical management. Medtronic's Reveal LINQ insertable cardiac monitor and its remote
              monitoring infrastructure (Carelink) compete in specific cardiac monitoring niches with a
              hardware-anchored business model. The key distinction between all four incumbent players and Huma is that
              incumbents monetize through device sales and reimbursed procedures; Huma monetizes through platform
              access, software configuration, and consumption-based fees. This creates fundamentally different buyer
