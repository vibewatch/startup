chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >
              Huma Therapeutics Limited (commercial name: Huma) is a private global healthcare AI and digital health
              company incorporated in England and Wales. Its registered principal offices are at Millbank Tower, 21-24
              Millbank, Westminster, London SW1P 4QP, UK. US operations are anchored at 650 California Street, San
              Francisco CA 94108, and 225 West 34th Street, New York NY 10122. The company was founded in 2011 and
              describes its mission as accelerating the adoption of digital and AI across care and research.


              The core product is the Huma Cloud Platform (HCP), a three-layer technology stack comprising (1) Core
              Infrastructure—a federated network connecting disjointed digital health systems; (2) Product
              Layer—regulated, configurable applications for remote patient monitoring (RPM), patient flow, and clinical
              dashboards; and (3) Intelligence Layer—AI agents, ML tools, and analytics converting connected data into
              clinical action. The platform holds FDA 510(k) Class II, EU MDR Class IIb, MHRA Class IIb, Saudi FDA Class
              C, Health Canada Class II, and MDSAP certifications, making it uniquely multi-jurisdictionally regulated
              among disease-agnostic configurable platforms.


              Huma's business model is multi-segment B2B SaaS and platform services. Health systems and national health
              bodies pay for virtual ward, RPM, triage, and primary care modules. Pharmaceutical companies and contract
              research organizations (CROs) pay for clinical-trial enablement via the Alcedis CRO subsidiary and Huma's
              life-sciences platform. Third-party technology vendors pay to build on the Huma Workspace SDK under a
              consumption-based model similar to Shopify for e-commerce. CEO Dan Vahdat has explicitly positioned HCP as
              "Shopify for digital health." The company supports 100+ applications built and configured on HCP and
              reports approximately 100 million patients supported globally with HCP products.
