            body: >-
              Biofourmis is Huma's most direct US-market competitor. Following its merger with CopilotIQ, Biofourmis
              presents an end-to-end platform for AI-driven in-home care, operating across 25+ US states with licensed
              operations and partnerships with more than 50 global health systems and payers. Its outcomes data claims a
              70% reduction in 30-day readmissions, 21-hour earlier deterioration detection, and up to 38% reduction in
              cost of care. Unlike Huma's horizontal platform-as-a-service positioning, Biofourmis operates more as a
              managed-service provider embedded within US health system workflows; its international footprint is
              significantly smaller than Huma's 70-country deployment. Current Health, reacquired from Best Buy in June
              2025 by co-founder Christopher McGhee, had served more than 70,000 patients and cared for over one-third
              of all US hospital-at-home patients using its platform before the divestiture. Best Buy's $475 million
              goodwill impairment on its health segment—alongside $109 million in restructuring costs—confirms that the
              hospital-at-home software market is scaling more slowly than initially projected, driven by provider
              financial constraints and uncertainty around CMS hospital-at-home waivers. Current Health's renewed
              independence under its original founder signals continued competition but from a financially constrained
              base. Doccla, a UK-focused virtual ward provider, appears in analyst market reports as a hospital-at-home
              software example but has a materially smaller disclosed customer base than Huma. Both Biofourmis and
              Current Health target overlapping buyer segments—hospital networks and integrated delivery systems seeking
              to extend care to the home—but neither holds the multi-jurisdiction Class II/IIb regulatory portfolio that
              Huma does.
