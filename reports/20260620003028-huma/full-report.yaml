      - number: '5.5'
        title: Roadmap, Dependencies, and Technical Gaps
        blocks:
          - type: paragraph
            body: >
              Huma's published roadmap as of H1 2026 includes: (1) HI Scribe US rollout to additional respiratory
              therapists and extension to 25 languages; (2) integration of Aluna respiratory spirometry hardware (FDA
              Class II post-acquisition) onto HCP; (3) continued expansion in Germany where HCP powered the HANSE lung
              screening programme that recruited 5,191 participants in 15 months and directly shaped Germany's 2026
              national lung cancer screening programme launch; (4) extension of the MG-ADL framework for broader symptom
              capture. Key platform dependencies include NVIDIA AI infrastructure for HI Scribe (Parakeet, TitaNet,
              Llama Nemotron), Google Cloud for Vertex AI integration, and the NHS CCS Spark DPS RM6904 agreement as the
              procurement route for NHS virtual ward technology. The open developer community is thin: the
              huma-engineering GitHub org has a small number of public repositories and low external star/fork activity,
              which limits independent verification of platform internals. No public API status page was accessible
              during this research run. Clinical outcome evidence is strongest for GDm-Health (RCT) and eTriage (3+
              years NHS deployment), while HI Scribe, CVD screening algorithm, and MG computer-vision modules remain
              early-stage with limited peer-reviewed outcome data beyond company-authored publications and conference
              presentations.
