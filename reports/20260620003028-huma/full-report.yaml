  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Valuation framing: strong regulated platform, weak financial visibility'
        blocks:
          - type: paragraph
            body: >-
              Huma clears the first threshold for venture-style interest: it is not a conceptual digital health company
              but a scaled, regulated platform with live usage across hospitals, clinics, pharma, and national-health
              deployments. The company claims 4,500-plus provider sites, tens of millions of screened individuals, 4
              million registered users, 1.8 million active users, and 70-plus countries of deployment. It also holds a
              rare multi-jurisdiction SaMD stack spanning FDA, EU MDR, UK MHRA, Health Canada, and Saudi FDA approvals.
              Those facts support real strategic value. The underwriting problem is price, not quality alone. Public
              evidence discloses a large Series D, revenue doubling, and a break-even target, but it does not disclose
              actual revenue, gross margin, ARR, cash balance, post-money valuation, or liquidation preference stack.
              That leaves investors unable to tell whether Huma is priced as a premium regulated infrastructure company
              or as a still-loss-making services-heavy platform transition story. The correct stance is therefore to pay
              for validated milestones, not narratives.
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV010
              - CV011
              - CV014
