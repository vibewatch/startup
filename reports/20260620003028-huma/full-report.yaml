  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Huma's competitive landscape spans five distinct categories. First, direct RPM and digital health platform
              providers—including Biofourmis (now merged with CopilotIQ), Current Health (reacquired from Best Buy in
              2025), and UK-focused Doccla—compete on virtual-ward software and remote patient monitoring features.
              Second, vertical incumbents with hardware-embedded monitoring such as iRhythm (cardiac arrhythmia), Masimo
              (pulse oximetry and multi-parameter hardware), Philips (connected care), and Medtronic (implantable
              cardiac monitors) address narrower but deeply reimbursed clinical niches. Third, adjacent platform
              providers including EMR vendors (Epic, Cerner), telemedicine platforms (Teladoc, Doximity), and
              CRO-software players (Veeva, Medidata) can displace Huma in specific use cases. Fourth, large technology
              companies—Microsoft (Nuance DAX, Azure Health), Google (Med-PaLM 2, Cloud Healthcare API), and Amazon
              (HealthLake)—are expanding AI and infrastructure offerings into regulated healthcare. Fifth, internal
              build and status-quo workflows remain the incumbent alternative for every health system that has not yet
              digitized remote monitoring. The global digital health market was estimated at USD 288.55 billion in 2024
              and is projected to reach USD 946 billion by 2030 at a 22.2% CAGR. The remote patient monitoring segment
              alone stood at USD 59.92 billion in 2025, forecast to grow to USD 289.77 billion by 2034.
              Hospital-at-home, Huma's core deployment vertical, was valued at USD 37.17 billion in 2025. North America
              dominated the RPM market with a 48% share in 2025, while the UK NHS virtual ward programme has become the
              most concentrated single-payer deployment environment in Huma's portfolio.
