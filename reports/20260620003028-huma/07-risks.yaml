  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: regulatory maintenance detail
    missingEvidence: Product-level regulatory matrix, surveillance schedule, and recent audit findings by jurisdiction.
    whyItMatters: Those documents determine whether Huma's visible approval footprint is easy to maintain or already operationally stretched.
    diligencePath: Request RA/QA tracker, notified-body or registrar audit summary, and software-change categorization SOP.
    relatedQuestionRefs:
    - QR002
    - QR007
  - type: private-evidence-only
    severity: material
    topic: uptime and incident transparency
    missingEvidence: Historical uptime, severity-one incident log, complaints trend, and alert-performance metrics for core RPM programs.
    whyItMatters: Certification status alone does not show whether safety-critical workflows operate reliably at Huma's stated scale.
    diligencePath: Request SLA dashboard, incident postmortems, CAPA summaries, and safety governance cadence.
    relatedQuestionRefs:
    - QR012
    - QR013
    - QR014
  - type: private-evidence-only
    severity: material
    topic: customer and partner concentration
    missingEvidence: Revenue mix by NHS, pharma, and geography; top-customer share; and partner-linked pipeline contribution.
    whyItMatters: Public partner logos and case studies do not reveal whether Huma can absorb procurement shocks or partner reprioritization.
    diligencePath: Request top-10 customer concentration, renewal cohort, and strategic-partner revenue attribution.
