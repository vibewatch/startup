  - type: enumeration-incomplete
    severity: minor
    topic: regulatory / legal risk register coverage
    missingEvidence: A complete list of every live regional registration, pending renewal, and any historic field action or enforcement correspondence.
    whyItMatters: The public chapter can rank the main risk categories, but exhaustive enumeration would materially improve diligence precision.
    diligencePath: Request the current regulatory register and legal issue log from management.
