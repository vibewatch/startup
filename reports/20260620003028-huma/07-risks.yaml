- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory maintenance slippage
    - Approval, certification, or surveillance status changes
    - Loss, suspension, or material labeling restriction in a core market
    - Treat as thesis-break until remediation path and commercial impact are quantified
  - - Privacy / transfer fragility
    - Security incident or SCC adequacy shock
    - Material health-data incident or transfer mechanism invalidation affecting live customers
    - Escalate legal diligence, re-underwrite geography mix, and stress customer churn
  - - NHS concentration
    - Procurement-route or policy change
    - Removal from required framework path, trust-compliance failure, or UK virtual-ward budget retrenchment
    - Haircut UK growth and renewal assumptions immediately
  - - Financial execution
    - Break-even trajectory
    - Missed or deferred profitability target without offsetting growth or margin proof
    - Assume new capital need and model dilution / restructuring risk
  - - AI deployment governance
    - Validation and filing velocity
    - Material delay between AI launch claims and regulated deployment readiness
    - Do not underwrite AI uplift in near-term revenue or margin scenarios
  - - People / integration stress
    - Further layoffs or leadership disruption
    - Another broad reduction in force or founder-CEO transition during integration period
    - Increase execution discount and require operating review before commitment
  notes: Kill criteria are framed as observable external events or diligence findings that can change the underwriting case without waiting for annual financial disclosure.
