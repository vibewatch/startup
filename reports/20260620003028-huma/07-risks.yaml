- id: regulatory-legal
  title: Regulatory and legal risk
  body: 'Huma carries the obligations of a scaled SaMD manufacturer rather than a wellness app vendor. Its platform and modules are marketed with FDA 510(k), EU MDR Class IIb, UK MHRA Class IIb, Health Canada Class II, Saudi FDA Class C, and CE-marked status, which is valuable commercially but creates a continuing burden of change control, post-market surveillance, technical documentation, and audit readiness across jurisdictions. That burden becomes sharper as Huma promotes Huma Intelligence and the 10x Nurse workflow on top of regulated care pathways. Public materials support that Huma uses SCCs for EU-US and UK-US transfers and does not claim SecNumCloud 3.2 certification, leaving a visible international-transfer fragility if court or regulatory standards move again. Privacy risk also scales with Huma''s installed base: it reports 35M+ screened users, 4M registered users, and 1.8M active users across 70+ countries. Even without a disclosed public breach, any material exposure of health
    data would create GDPR, UK GDPR, contract, and device-quality consequences at once.'
  claimRefs:
