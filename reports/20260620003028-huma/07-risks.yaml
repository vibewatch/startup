  title: Mitigation is real but incomplete
  body: FDA, MDR, MHRA, Health Canada, Saudi FDA, ISO, SOC 2, and NHS trust markers materially de-risk first adoption, but they do not substitute for evidence on uptime, incident history, concentration, and AI change control.
  claimRefs:
