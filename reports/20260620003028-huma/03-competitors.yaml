callouts:
- calloutType: strength
  title: Unmatched Multi-Jurisdiction Regulatory Portfolio
  body: Huma holds simultaneous FDA Class II, EU MDR Class IIb, Health Canada Class II, Saudi FDA Class C, MHRA Class IIb, TGA Class IIb, and CDSCO Class C clearances for a disease-agnostic, AI/ML-hosting
    platform—a portfolio no identified competitor has yet replicated. This materially reduces the time and cost for customers to launch regulated digital health products globally and creates high switching
    costs once a health system or pharma partner has built on the platform.
  claimRefs:
  - CP006
  - CP024
  - CP025
- calloutType: risk
  title: Hospital-at-Home Market Scaling Slower Than Expected
  body: Best Buy's $475 million goodwill impairment and $109 million restructuring charge on its health segment, specifically citing slower-than-expected hospital-at-home growth, is an adverse signal for
    all RPM software providers. Current Health's forced divestiture and Biofourmis's merger with CopilotIQ both reflect capital pressure in the category. If the US hospital-at-home market fails to scale
    as projected, Huma's RPM and virtual-ward revenue projections could face material downside.
  claimRefs:
  - CP013
  - CP032
  - CP033
- calloutType: risk
  title: Large-Tech Entrants Lower the Infrastructure Moat
  body: Microsoft (Azure Health, Nuance), Google (Cloud Healthcare API, Med-PaLM 2), and Amazon (HealthLake) are investing in regulated healthcare infrastructure and AI, potentially commoditizing the undifferentiated
    layers of Huma's platform. These companies have dramatically larger R&D budgets, existing EHR integrations, and enterprise sales forces. The risk is not that they replicate Huma's regulatory portfolio
    immediately, but that they erode the moat around the infrastructure layer over a 3-5 year horizon.
  claimRefs:
  - CP034
