- id: TP004
  title: Moat Durability and Competitive Risk Register
  columns:
  - Moat Claim
  - Threat
  - Severity
  - Mitigation / Diligence Ask
  rows:
  - - Multi-jurisdiction regulatory portfolio (FDA, EU MDR, MHRA, SFDA, HC)
    - Large tech (Microsoft, Google, AWS) or new entrant investing in multi-region SaMD certification
    - Medium (2-3 year minimum investment to replicate)
    - Verify no current competitor is actively pursuing equivalent multi-jurisdiction Class II portfolio; check EU MDR pipeline submissions
  - - Disease-agnostic AI/ML algorithm hosting clearance
    - EU MDR provisional approvals expiring 2023-2024; competitors may obtain new algorithm-specific clearances without needing a platform
    - Medium (algorithm-level clearances are cheaper per use case)
    - Assess whether pharma partners require platform clearance vs. algorithm clearance; check if Epic's AI module certifications erode platform moat
  - - NHS England virtual ward incumbency
    - NHS procurement framework re-tendering; Doccla, Current Health UK expansion, or internal NHS build
    - Medium (NHS re-tenders regularly but switching costs are high)
    - Verify current NHS contract structure and re-tender schedule; assess Doccla market share
  - - Ecosystem lock-in (EHR integrations, workflow configs, patient data)
    - 'Multi-homing: pharma partners deploy multiple platform vendors per therapeutic area; health systems may prefer single-EMR-vendor solutions'
    - High (multi-homing is standard in pharma tech)
    - Audit actual customer concentration; quantify pharma partner exclusive vs. non-exclusive engagements
  - - Acquisition-based platform extension (Alcedis, iPlato)
    - Integration risk; post-acquisition cultural and technical debt could slow product development
    - Medium (M&A integration is resource-intensive)
    - Assess Alcedis and iPlato integration progress; verify combined ARR and margins
  notes: Severity ratings are author estimates based on competitive landscape analysis and independent news sources. No internal Huma documents were available.
