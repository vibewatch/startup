- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Illustrative valuation logic
  - Probability signal
  - Triggers
  rows:
  - - Bull
    - Huma Cloud adoption accelerates, break-even is proven, margins trend toward premium software levels, and the regulatory moat continues to shorten partner time-to-launch.
    - Illustrative support band of roughly $0.9B-$1.5B on premium late-stage software-style multiples if private revenue quality is strong.
    - Would require audited growth quality, strong retention, and proof that usage pricing scales cleanly.
    - Upside supported by new strategic partnerships, disclosed high gross margins, and no renewed restructuring.
  - - Base
    - Growth continues, but profitability and margins are only partially proven; Huma remains a valuable strategic platform with mixed software/services characteristics.
    - Illustrative support band of roughly $0.5B-$0.9B, reflecting a strategic premium but not full software-market exuberance.
    - 'Most consistent with current public evidence: strong product proof, thin P&L proof.'
    - Validation would come from confirmed 2024-2025 profitability progress and moderate dilution terms.
  - - Bear
    - Losses persist, layoffs continue, pricing proves opaque, or the business behaves more like implementation-heavy regulated services amid sector multiple compression.
    - Illustrative support band of roughly $0.3B-$0.5B, closer to strategic-asset or challenged-growth outcomes than premium SaaS.
    - Supported if Huma cannot disclose attractive economics or if sector exits remain weak.
    - Downside triggered by regulatory setbacks, poor retention, heavy services mix, or new capital raised on defensive terms.
  approximationNotes: Ranges are intentionally wide because Huma has not disclosed revenue or margins publicly; they are scenario support bands, not claimed fair values.
