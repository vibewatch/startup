- id: recommendation-and-diligence
  title: 'Recommendation: track, with high risk and strict entry discipline'
  body: 'The investment call is track, not pass, because Huma has already cleared meaningful technical and regulatory hurdles and has better strategic validation than most private digital-health companies. The call is also not buy, because the public corpus is thin exactly where valuation must be won or lost: revenue denominator, margin profile, cash efficiency, cap table, and confirmed break-even status. The anti-thesis is straightforward: if Huma is still materially loss-making, must keep cutting headcount, and cannot show that Huma Cloud changes economics, then the company may deserve only a middling strategic or late-stage private-market valuation despite its impressive approvals. The key diligence asks are therefore narrowly practical—monthly recurring revenue or ARR, gross margin, implementation mix, customer concentration, retention, cap table, preference stack, and proof that post-2024 profitability actually occurred. Until those are disclosed, investors should underwrite Huma as
    a premium asset with stretched price risk rather than as a conviction buy.'
  claimRefs:
