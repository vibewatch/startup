- id: scenario-valuation
  title: Bull, base, and bear ranges should be milestone-based rather than point estimates
  body: 'Because Huma has not disclosed revenue, a precise revenue-multiple model would create false certainty. A better approach is to define valuation support ranges based on the quality of evidence that could justify different private-market outcomes. In the bull case, Huma Cloud proves that the company is becoming a regulated infrastructure layer for digital health: usage-based pricing lands well, revenue keeps compounding from a larger base, margins approach best-in-class software economics, and the multi-jurisdiction approval set remains a real moat. In the base case, Huma continues growing with strong partners and deployments but remains only partially proven economically, so valuation support exists mainly as a strategic premium rather than a broad-market software multiple. In the bear case, Huma looks more like a labor- and implementation-heavy digital health business in a consolidating sector, where the Current Health precedent matters more than the iRhythm precedent. That is why
    the most honest range is wide and conditional.'
  claimRefs:
  - CV014
  - CV015
  - CV023
  - CV027
