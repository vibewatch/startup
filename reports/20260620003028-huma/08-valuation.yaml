  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: break-even confirmation
    missingEvidence: Audited 2024 and 2025 P&L or board reporting confirming whether Huma actually reached break-even or profitability after the July 2024 Series D raise.
    whyItMatters: The recommendation depends on whether doubled revenue translated into real operating leverage or only offset ongoing losses.
    diligencePath: Request audited annual accounts, monthly management reporting, and cash runway bridge for 2024-2025.
    relatedQuestionRefs:
    - QV014
  - type: private-evidence-only
    severity: material
    topic: cap table and preference overhang
    missingEvidence: Current cap table, preference stack, option pool, debt or structured financing, and any side-letter economics from late-stage investors.
    whyItMatters: Common-equity return can differ sharply from headline valuation when preferences or senior instruments are heavy.
    diligencePath: Request cap table export, financing documents, and counsel summary of liquidation and anti-dilution terms.
    relatedQuestionRefs:
    - QV030
  - type: private-evidence-only
    severity: material
    topic: revenue and margin disclosure
    missingEvidence: ARR or revenue base, software versus services mix, gross margin, retention, and implementation burden for Huma Cloud deployments.
    whyItMatters: These metrics determine whether Huma deserves premium regulated-software pricing or a lower strategic-services valuation frame.
    diligencePath: Request finance model, product-level cohort data, customer concentration, and reference calls on deployment effort.
    relatedQuestionRefs:
    - QV018
    - QV029
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: A broader peer set with disclosed current revenue multiples for additional private digital-health platforms and late-stage rounds.
    whyItMatters: The table is sufficient for framing but not exhaustive for every possible peer because many private companies still lack transparent financial disclosure.
    diligencePath: Expand the peer set with paid databases or management-provided competitor lists if a live deal process moves forward.
    relatedTableRefs:
    - TV004
