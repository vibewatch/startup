- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Profitability miss
    - Management cannot evidence that 2024 break-even was achieved or that 2025 losses narrowed materially
    - Undercuts claim that Huma Cloud and restructuring improved economics
    - Pause pricing work; treat next round as capital-preservation rather than growth financing
  - - Defensive financing
    - New capital is raised with heavy preferences, ratchets, or insider support only
    - Signals that the current private valuation is not externally validated
    - Re-underwrite to downside band and ask for full cap table before proceeding
  - - Regulatory slippage
    - Material restriction, delay, or remediation against key FDA, EU, UK, Canada, or Saudi approvals
    - Weakens moat and slows commercialization
    - Move to pass unless issue is isolated and quickly remediable
  - - Execution stress
    - Further broad layoffs or visible support-quality deterioration after the 2023-2024 reset
    - Suggests Huma remains structurally under-scaled operationally
    - Delay investment until org stability and customer metrics are proven
  - - Services-heavy mix
    - Implementation or bespoke-services revenue dominates cloud/platform revenue
    - Reduces software multiple potential and margin outlook
    - Anchor valuation to lower strategic-service outcomes rather than premium SaaS ranges
  notes: These are monitorable thesis-break events tied directly to valuation compression rather than generic operating risks.
  claimRefs:
  - CV017
  - CV030
  - CV031
  - CV041
  - CV043
  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue base
    - Current ARR or revenue, split by software vs services
    - Without the denominator, no multiple-based valuation can be trusted
    - Request board pack or audited monthly financials from management
  - - Margin quality
    - Gross margin and contribution margin by product line
    - Separates scalable platform economics from implementation-heavy deployments
    - Request finance model and cohort P&L
  - - Retention and concentration
    - NRR, GRR, top-10 customer share, NHS/pharma/geography mix
    - Tests durability and concentration risk inside a logo-rich partner set
    - Request customer analytics and sales operations extracts
  - - Cap table and preferences
    - Current ownership, option pool, liquidation preferences, and any senior instruments
    - Determines whether headline valuation translates into common-equity return potential
    - Request cap table, financing docs, and counsel summary
  - - Break-even proof
    - Actual 2024 and 2025 profitability trajectory, cash runway, and covenant position
    - Validates whether the July 2024 message became reality
    - Request post-Series D board materials and cash waterfall
  - - Cloud adoption quality
    - Usage, pricing, gross retention, deployment time, and implementation burden for Huma Cloud
    - Tests the core bull-case claim that Huma is becoming regulated infrastructure software
    - Request product analytics, pipeline conversion data, and reference calls
  notes: Every ask is tied to a valuation variable that cannot be safely inferred from public materials alone.
