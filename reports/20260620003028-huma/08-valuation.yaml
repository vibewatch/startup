- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status / metric
  - Valuation or multiple reference
  - Relevance to Huma
  - Key limitation
  rows:
  - - iRhythm
    - Public RPM specialist; FY2025 revenue $747.1M; 70.6% gross margin; first positive FCF
    - Mature public benchmark; premium valuation support appears only after clear scale and economic proof
    - Useful for showing what investors reward once RPM economics are visible
    - Cardiac-only, reimbursement-led, and much more mature than Huma
  - - Masimo
    - Public hospital monitoring incumbent
    - Large established monitoring company, but primarily hardware-led rather than platform-led
    - Shows scale and strategic importance of monitoring workflows to hospitals
    - Not a clean software comparable; device economics dominate
  - - Philips
    - Public connected-care incumbent
    - Strategic scale reference for home and connected care after restructuring
    - Useful as an incumbent reference for strategic buyer interest and category size
    - Far too diversified to anchor a direct Huma multiple
  - - Current Health
    - Private M&A benchmark
    - Acquired for about $400M in 2021, then sold back in 2025 after a troubled ownership period
    - Most relevant cautionary benchmark for RPM platform exit risk
    - Different geography and ownership path; exact current financials undisclosed
  - - Biofourmis
    - Private consolidation signal
    - Merged with CopilotIQ instead of emerging as a clean public-market success story
    - Signals category consolidation and capital discipline
    - Limited public financial disclosure; not a priced current round
  notes: This peer set is designed for valuation framing, not for mechanical median-multiple output. It combines one public RPM specialist, two strategic incumbents, one private M&A outcome, and one consolidation signal.
  enumerationScope:
    coverage: exhaustive
    basis: 'Exhaustive for the five reference points intentionally selected for this chapter''s valuation framework: one public RPM benchmark, two larger public strategic incumbents, one RPM M&A outcome, and one private consolidation signal drawn from the reviewed 2021-2026 source set.'
