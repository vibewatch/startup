  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与层级
        blocks:
          - type: paragraph
            body: >
              Huma Cloud Platform（HCP）由三层相互依赖的结构组成。核心基础设施层是一个联邦网络，连接彼此割裂的数字健康系统；它不绑定云厂商，数据安全留在各机构内部。 产品层提供受监管的低代码 /
              无代码应用，覆盖患者流、远程患者监测（RPM）、临床仪表盘和研究数据采集。智能层（Huma Intelligence，或「Hi」） 加入分析、AI
              智能体和机器学习工具，包括心血管风险预测、重症肌无力严重程度评估、AI 驱动的临床文档（HI Scribe）和生成式 AI 应用配置。平台不绑定设备，可集成可穿戴设备、智能吸入器、血糖仪和 ECG 设备；同时开放
              APIs 和 SDK，让外部开发者和药企伙伴无需编写新的设备专用监管代码， 就能配置受监管应用。Epic、EMIS、SystmOne、Oracle、CompuGroup Medical 等主要 EMR
              平台都有集成连接器。截至 2025–2026 年，平台支持 70+ 个国家的 4,500 多家医院和诊所，已经用于触达或筛查超过 50 million 人。架构背后有基于 HCP 构建的 100
              多个应用，以及全球约 100 million 名患者使用 HCP 产品获得支持。
