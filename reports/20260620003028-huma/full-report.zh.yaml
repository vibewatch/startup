        title: 资本充足性、烧钱、跑道与盈利路径
        blocks:
          - type: paragraph
            body: >-
              Huma 累计融资超过 USD 300M，其中包括 2021 年 5 月的 $130M Series C，以及 2024 年 7 月完成、规模超过 $80M 的 Series D，战略投资方包括
              AstraZeneca、Leaps by Bayer、Hitachi Ventures 和 HAT SGR。Series D 由多笔较小注资在约 12 个月内拼成；Sifted 称，这是 2023
              年初以来欧洲数字健康领域最大一轮融资，既反映融资环境偏紧，也反映 Huma 监管平台的战略价值。公司的负面财务信号很重。UK Companies House 文件确认，2022 年净亏损 £31
              million。CEO Dan Vahdat 对 Sifted 表示，2023 年亏损与 2022 年「相近」，意味着两年年度亏损均约 £30-32M。公司在 2023-2024 年裁员约 100 人，员工数从约
              500 降至约 400，以压低烧钱并走向盈利。Vahdat 的目标是在 2024 年底实现「全年」盈亏平衡，但截至运行日期 （2026 年 6
              月），公开资料尚未确认该目标是否达成。账上现金、月度烧钱和现金续航均未公开。按 Series D 的时间点 （2024 年 7 月超过 $80M）推断，2024 年现金续航可能覆盖 2025 年并延伸至 2026
              年，但这只是估算。公司还把资金投向 M&A，在 2023-2024 年收购 Alcedis、iPlato 和一家未披露公司，消耗了额外现金，也扩展了平台能力。Huma 对融资的依赖是关键承销风险：
              要走向自筹资金增长，公司需要确认已经盈亏平衡，或继续获得投资人支持且稀释可接受。
