      - number: '5.5'
        title: 路线图、依赖与技术缺口
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 H1，Huma 已公布的路线图包括：（1）HI Scribe 在美国推广至更多呼吸治疗师，并扩展至 25 种语言；（2）把收购后获得的 Aluna 呼吸肺量计硬件（FDA Class
              II）接入 HCP；（3）继续扩张德国市场，HCP 曾支撑 HANSE 肺筛查项目，该项目 15 个月招募 5,191 名参与者，并直接影响德国 2026 年全国肺癌筛查项目启动；（4）扩展 MG-ADL
              框架，以捕捉更广泛症状。关键平台依赖包括用于 HI Scribe 的 NVIDIA AI 基础设施（Parakeet、TitaNet、Llama Nemotron）、用于 Vertex AI 集成的 Google
              Cloud，以及作为 NHS 虚拟病房技术采购路径的 NHS CCS Spark DPS RM6904 协议。开放开发者社区偏薄：huma-engineering GitHub 组织只有少量公开仓库，外部
              star / fork 活动低，限制了对平台内部的独立验证。本轮研究期间未能访问公开 API 状态页。临床结果证据以 GDm-Health（RCT）和 eTriage（3+ 年 NHS 部署）最强；HI
              Scribe、CVD 筛查算法和 MG 计算机视觉模块仍处早期，除公司署名出版物和会议报告外，同行评议结果数据有限。
