  - id: FM001
    title: 数字健康市场规模金字塔
    type: pyramid
    layout: standard
    summary: 三层 TAM 到 SOM 金字塔，展示截至 2026 年中从最广义总可寻址市场到 Huma 特定可服务可获得市场的数字健康市场估计。
    data:
      items:
        - label: TAM：全球数字健康市场
          value: $288-492B (2024-2026)
          detail: 最广义口径，包含所有数字健康软件、服务及相邻硬件；GrandView 的 $288B（2024）和 Fortune BI 的 $492B（2026）体现口径差异。
        - label: 相邻 SAM：RPM + HaH + DCT 市场
          value: $99-160B (2025 combined)
          detail: RPM 设备 / 软件 $59.9B + Hospital-at-Home $37.2B + DCT 约 $1.4B（2025 年估计）；合并 Huma 已服务细分。
        - label: SAM：SaMD 平台软件层
