      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Huma 承担的是规模化 SaMD 制造商的义务，而不是健康 app 供应商的义务。其平台和模块以 FDA 510(k)、EU MDR Class IIb、 UK MHRA Class IIb、Health
              Canada Class II、Saudi FDA Class C 和 CE 标志状态进行市场推广，商业价值高，但也持续带来跨司法辖区的变更控制、 上市后监督、技术文档和审计就绪负担。Huma
              在受监管照护路径之上推广 Huma Intelligence 和 10x Nurse 工作流后，这一负担更尖锐。 公开材料支持 Huma 对 EU-US 和 UK-US 传输使用 SCCs，且未声称拥有
              SecNumCloud 3.2 认证；如果法院或监管标准再次变化，国际传输脆弱性清晰可见。 隐私风险也随 Huma 装机基础放大：公司报告在 70+ 个国家有 35M+ 筛查用户、4M 注册用户和 1.8M
              活跃用户。即便没有披露的公开数据泄露， 任何重大健康数据暴露都会同时引发 GDPR、UK GDPR、合同和设备质量后果。
