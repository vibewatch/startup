      - number: '6.5'
        title: 扩张、集中风险与渠道
        blocks:
          - type: paragraph
            body: >
              英国 NHS 是主导收入板块，带来集中风险。Huma 多数具名生产部署、具名案例研究和临床结果证据都以 NHS 为核心。2024–2025 年收购 eConsult 和
              Aluna，是通过渠道多元化主动降低风险。eConsult 扩大英国初级照护触达；Aluna 提供直接进入美国呼吸市场的滩头阵地，约 500,000 名已签约覆盖人群。Bayer CVD 筛查合作横跨 Saudi
              Arabia 和美国，与 Tier 1 药企伙伴形成两条非 NHS 收入流。生命科学方面， Alcedis 带来 30+ 年欧洲 CRO 关系，具名研究涉及 Boehringer
              Ingelheim、UCB，以及覆盖 20 个国家的未披露 CKD/T2D 赞助方。 NHS Trust 层面的 land-and-expand 已经可见：多家 Trusts 从 eTriage
              试点起步，随后扩展到虚拟病房或 eConsult 部署。NHS CCS Spark DPS RM6904 采购框架被描述为 NHS 背书的唯一虚拟病房技术路径，为竞争对手形成结构性渠道壁垒。Sifted 2024
              年 7 月报道称， Huma 在此前一年裁员约 100 人，且公司 2022 年经营亏损 £31 million，目标是在 2024 年盈亏平衡。Sifted 的 Series D 文章指出，Huma 依赖英国
              NHS 作为主要客户基础，截至当时披露的国际商业牵引有限。英国 NHS 客户集中，加上重组历史，构成客户侧主要负面信号。
