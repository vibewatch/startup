      - number: '1.5'
        title: 规模、客户与平台覆盖
        blocks:
          - type: paragraph
            body: >
              截至 2025 年 5 月，Huma 平台支持 4,500+ 家医院和诊所，在 4 大洲 70+ 个国家触达超过 50 million 名个人。 公司报告 HCP 产品在全球支持约 100 million
              名患者。生命科学方面，Huma 子公司 Alcedis 在 30+ 年里开展了 670+ 项研究，并在 70+ 个国家招募 1 million+ 名参与者。药企合作覆盖全球前 20 大制药公司中的一半以上， 包括
              UCB、Pfizer、AstraZeneca 和 Bayer。


              在英国，Huma 称 eConsult 收购后，公司已落地于所有初级和二级医疗服务提供者的三分之二以上。国家级部署包括 NHS England 虚拟病房项目、德国联邦卫生部项目、希腊国家级计划和沙特 Vision
              2030 健康项目。美国 RPM 业务自 FDA 许可后显著增长；按 Series D 新闻稿，截至 2024 年 7 月，呼吸 RPM 产品覆盖 140,000 个签约生命。 Aluna 收购（2025 年 5
              月）又在 150+ 个美国健康系统的呼吸照护中增加约 500,000 个签约生命。


              封面指标及置信度：估值未披露（私营公司；未公开确认任何轮次估值）；累计融资 >$300 million（高置信度，已确认）； 收入 / ARR 未披露（低置信度；公司报告 2024
              年同比翻倍并以盈亏平衡为目标）；员工数约 400-500（中置信度； Sifted 2024 年 7 月约 400，但 about 页面显示约 500）；医院 / 诊所 4,500+（中置信度，公司陈述）；
              触达个人 50M+（中置信度，公司陈述）。作为未披露财务的私营公司，Huma 无法被独立验证财务数据。
