          - type: callout
            title: Current Health 的困境退出验证 Huma 的多产品护城河
            body: >
              Best Buy 在 2025 年 6 月把 Current Health 卖回给创始人——条款未披露，而 2021 年曾支付 $400M——凸显了纯 RPM 供应商在缺少 Huma 的监管深度、NHS
              集成和多产品广度时面临的困难。Huma 同时拥有监管许可（FDA、EU MDR、Saudi FDA、Health Canada） 和多元产品组合，构成结构性差异化，使其越来越不适合与独立 RPM 供应商直接比较。
