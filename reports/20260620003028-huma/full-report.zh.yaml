  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方画像
        blocks:
          - type: paragraph
            body: >
              Huma 的商业足迹横跨三类主要客户。第一类、也是最大的一类，是英国 NHS 和公共卫生系统。NHS Trusts 通过 NHS CCS Spark DPS RM6904 认证采购框架采购 Huma
              产品，主要包括 eTriage、GDm-Health、Virtual Wards/RPM 和 eConsult。NHS Trusts
              （急性、初级照护、社区）既是买方也是用户。第二类是制药和生命科学。Boehringer Ingelheim、UCB、Bayer、AstraZeneca、Smith+Nephew、 Janssen 和
              Parexel 等药企使用 Huma 的临床试验基础设施（Alcedis CRO 子公司）开展 eCRF、EDC、eCOA 和去中心化试验设计。
              它们是买方；患者和主要研究者是终端用户。第三类是政府和公共卫生机构：Saudi Arabia（Vision 2030 CVD 筛查）、Germany（HANSE 全国肺癌筛查），以及在 India、UAE 和
              Australia 的早期接触。Huma 将自己定位为「数字健康的 Shopify」，目标客户是希望缩短上市时间、部署受监管健康应用的机构。 通过收购 Aluna（Knox Medical
              Diagnostics，2025 年 5 月），Huma 加速进入美国市场；Aluna 带来 150+ 个美国诊所网络和约 500,000 名已签约呼吸监测覆盖人群。
