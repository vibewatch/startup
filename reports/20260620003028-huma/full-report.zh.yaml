  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 示例估值逻辑
      - 概率信号
      - 触发因素
    rows:
      - - 乐观
        - Huma Cloud 采用加速，盈亏平衡得到证实，利润率向高端软件水平靠拢，监管护城河继续缩短合作伙伴上市时间。
        - 如果私下收入质量强，按高端后期软件式倍数计算，示例支撑区间约为 $0.9B-$1.5B。
        - 需要经审计的增长质量、强留存，以及使用量定价可顺畅放大的证据。
        - 新战略合作、披露的高毛利率且没有再次重组，将支撑上行情景。
      - - 基准
        - 增长延续，但盈利和利润率只得到部分证明；Huma 仍是有价值的战略平台，同时带有软件 / 服务混合特征。
        - 示例支撑区间约为 $0.5B-$0.9B，反映战略溢价，但不计入完整的软件市场亢奋。
        - 这与当前公开证据最一致：产品证据强，损益证据薄。
        - 若确认 2024-2025 年盈利进展且稀释条款温和，可验证该情景。
      - - 悲观
        - 亏损持续、裁员继续、定价不透明，或在赛道倍数压缩下，公司表现得更像实施很重的受监管服务。
        - 示例支撑区间约为 $0.3B-$0.5B，更接近战略资产或增长承压结果，而非高端 SaaS。
        - 如果 Huma 无法披露有吸引力的经济性，或赛道退出仍偏弱，该情景获得支撑。
        - 监管挫折、留存不佳、服务组合过重，或以防御性条款融资，都会触发下行情景。
    approximationNotes: >-
      Ranges are intentionally wide because Huma has not disclosed revenue or margins publicly; they are scenario
      support bands, not claimed fair values.
    claimRefs:
      - CV014
      - CV015
      - CV023
      - CV027
      - CV031
      - CV038
      - CV042
      - CV043
      - CV046
    notes: 情景区间是基于公开里程碑和赛道参照构建的示例支撑范围，因为 Huma 尚未披露收入、利润率或投后估值。
