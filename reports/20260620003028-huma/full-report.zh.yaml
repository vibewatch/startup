    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >
              Huma Therapeutics Limited（商业名称：Huma）是一家在英格兰和威尔士注册的私营全球医疗 AI 与数字健康公司。 其注册主要办公室位于英国伦敦 Westminster, Millbank,
              21-24 Millbank Tower, SW1P 4QP。美国业务据点位于 650 California Street, San Francisco CA 94108，以及 225 West 34th
              Street, New York NY 10122。 公司成立于 2011 年，自称使命是加速数字和 AI 在照护与研究中的采用。


              核心产品是 Huma Cloud Platform（HCP），一个三层技术栈：（1）Core Infrastructure——连接割裂数字健康系统的联邦网络； （2）Product
              Layer——面向远程患者监测（RPM）、患者流转和临床仪表盘的受监管、可配置应用； （3）Intelligence Layer——把已连接数据转为临床行动的 AI 代理、ML 工具和分析能力。平台持有 FDA
              510(k) Class II、EU MDR Class IIb、MHRA Class IIb、Saudi FDA Class C、Health Canada Class II 和 MDSAP
              认证，使其在疾病无关的可配置平台中具备罕见的多司法辖区监管资质。


              Huma 的商业模式是多细分 B2B SaaS 与平台服务。健康系统和国家卫生机构为虚拟病房、RPM、分诊和基层医疗模块付费。 制药公司和合同研究组织（CRO）通过 Alcedis CRO 子公司和 Huma
              的生命科学平台，为临床试验赋能付费。 第三方技术供应商则在 Huma Workspace SDK 上构建应用，按类似电商 Shopify 的用量模式付费。CEO Dan Vahdat 明确把 HCP
              定位为「数字健康的 Shopify」。公司支持 100+ 个在 HCP 上构建和配置的应用，并报告 HCP 产品在全球支持约 100 million 名患者。
