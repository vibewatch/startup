      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              Huma 的上市路径覆盖三类买方，它们在采购周期、预算归属和成功指标上结构不同。按患者量看，健康系统是最大买方细分。 在英国，NHS England 的 Virtual Ward 项目创造了强制采购渠道：NHS
              England 承诺到 2024 年底建成 10,000+ 张虚拟病房床位， 需要技术支持的远程监测平台。NHS 采购周期从初始招标到上线平均 12-24 个月，NHS 框架（如 G-Cloud、NHS
              Digital 框架） 是主要采购载体。预算通常归 NHS Integrated Care Board（ICB）的数字健康或虚拟照护转型负责人所有。

              在美国，商业健康系统依据 CMS CPT 代码 99453、99454、99457 和 99458 采购 RPM 软件； 这些代码允许 Medicare 和 Medicaid 为认证 RPM
              服务按每名入组患者每月约 $100-$150 报销。这一报销结构创造了 按患者付费、兼容 SaaS 的收入模式——Huma 通过 Aluna 的美国 RPM 策略瞄准 150+ 个美国健康系统中的约
              500,000 个签约生命， 若完全捕获，该规模下潜在 RPM 报销池每年超过 $600M。能否资本高效地把签约生命转为活跃入组患者，是关键采用挑战。

              生命科学公司（药企、生物科技）是平均合同价值最高的细分。去中心化临床试验（DCT）软件单项研究合同在 $2M 到 $10M+ 之间，部署周期 6-18
              个月。决策者包括临床运营副总裁、首席数字官和患者互动副总裁。Huma 的 Alcedis 子公司带来端到端 CRO 能力，使其区别于纯 SaaS DCT 供应商。按公司说法，全球前 20 大药企中超过 50%
              已与 Huma 接触， 但交易级收入数字未披露。

              政府和公共卫生买方（Saudi MOH、德国联邦卫生部、希腊卫生机构）通过国家筛查项目采购，多年期合同由国家卫生 IT 预算出资。 沙特 Vision 2030 计划向医疗转型配置超过 $40
              billion；Huma 的 Bayer CVD 筛查项目和 Saudi FDA Class C 认证， 使其直接进入这一采购周期。
