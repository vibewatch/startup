  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、定价模型与收入结构
        blocks:
          - type: paragraph
            body: >-
              Huma 有三条不同收入流。第一，企业健康系统合同——主要来自 NHS England、德国联邦卫生部，以及沙特、希腊和其他国家的国家健康系统—— 覆盖虚拟病房、RPM
              服务、人口健康和基层医疗数字化。这些是多年期政府和健康系统合同，包含经常性订阅或按使用计费部分。 第二，制药和生命科学授权费——覆盖伴随应用、去中心化临床试验、真实世界证据项目和 AI 生物标志物工具—— 随着
              Huma 与全球前 20 大药企中过半合作而增长，已确认伙伴包括 AstraZeneca、Bayer、UCB（重症肌无力）和 Pfizer（血友病）。 第三，新推出的 Huma Cloud
              Platform（HCP）引入用量型、自助式平台即服务模式，类似 Shopify—— 让第三方（健康系统、制药公司和数字健康初创公司）在 Huma 已获 FDA 许可、EU MDR Class IIb
              的基础设施上构建并部署自己的受监管应用。 CEO 将这一计价模式描述为「类似 Shopify」的按用量计费，并表示截至 2024 年 7 月 Series D 公告时定价仍在最终确定。
              具体层级、使用费率、最低承诺和现有合同的实际价格均未披露。基于 HCP 构建的呼吸用 RPM 产品在美国覆盖 140,000 个签约生命，显示一条新兴、由报销支持且绑定 CMS 远程生理监测代码（CPT
              99453、99454、99457）的收入流。 健康系统、药企和平台板块之间的收入结构未公开量化。从项目型服务交付（历史模式）转向用量型平台访问， 预计会随监管认证成本在更大平台用户基础上摊销，逐步改善毛利率。
