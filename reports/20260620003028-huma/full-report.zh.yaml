      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              自 2011 年创立以来，Huma 已在多轮融资中累计募集超过 $300 million。最近一次融资是 2024 年 7 月 16 日宣布的 超过 $80 million 的 Series D。关键在于，这轮
              Series D 包含自 Series C（2021 年 5 月）以来收到的多笔投资， 也就是说，Huma 在正式关账前数年间累计发行了超过 $80 million 的股份。Series D 投资者包括
              AstraZeneca（新进）、 Hat Technology Fund 4 by HAT SGR（新进）、HV Fund by Hitachi Ventures（既有）和 Leaps by
              Bayer（既有长期支持者）。 HSBC Bank plc 在融资中担任财务顾问。


              截至 2024 年 7 月，Huma 官网 about 页面写着「$250m raised so far」——这一数字似乎已过时， 早于 Series D 新闻稿披露的
              $300m+。这个差异更像轻微数据质量问题，而非重大冲突。Series D 关账时累计融资超过 $300 million，已由公司自己的公告和独立报道（FierceHealthcare、Sifted）共同确认。


              Huma 没有公开披露任何一轮的正式估值；公司仍是私营公司，没有公开报道的投后估值。根据 Sifted 引用的 Companies House 文件，公司 2022 财年亏损 £31 million。围绕
              Series D 关账的 Sifted 采访中，CEO Dan Vahdat 称 2023 年数字与 2022 年「类似」。公司自 2024 年中以来一直以盈亏平衡为目标，但没有确认正式盈利里程碑。
              除股权融资外，Huma 至少完成四笔已知收购，对价由现金和股权组合支付。
