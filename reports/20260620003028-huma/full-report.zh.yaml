  - id: FO002
    title: Huma Cloud Platform 架构
    type: flow
    layout: standard
    summary: 三层联邦平台把基础设施、受监管应用和 AI 智能连接到医疗系统、药企和政府客户。
    data:
      nodes:
        - id: infra
          label: 核心基础设施
          detail: 联邦网络连接割裂的 EHR、设备和医疗系统；云无关托管
        - id: product
          label: 产品层
          detail: 受监管低代码应用：RPM、虚拟病房、eTriage、临床试验、伴随应用
        - id: intelligence
          label: 智能层
          detail: AI agent、ML 算法、分析：CVD 风险评分、MG 症状追踪、临床记录（Hi-Scribe）
        - id: workspace
          label: Huma Workspace
          detail: 低代码 SDK；第三方开发者无需自建监管栈，即可部署 FDA / EU MDR 许可应用
        - id: hs
          label: 医疗系统
          detail: 4,500+ 家医院和诊所；NHS、德国卫生部、Saudi MOH；虚拟病房和 RPM
        - id: pharma
          label: 生命科学 / 药企
          detail: 全球前 20 大药企中超过 50%；UCB、Pfizer、Bayer、AstraZeneca；临床试验和伴随应用
        - id: gov
          label: 政府 / 公共卫生
          detail: 国家级筛查项目；英国、沙特阿拉伯、德国、希腊；规模化人群健康
      edges:
        - from: infra
          to: product
          label: 驱动受监管应用
        - from: product
          to: intelligence
          label: 注入临床数据
        - from: workspace
          to: product
          label: 无代码配置
        - from: intelligence
          to: hs
          label: 临床决策支持
        - from: product
          to: pharma
          label: 试验和伴随应用
        - from: product
          to: gov
          label: 筛查和人群健康
