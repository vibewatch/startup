  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入基础
        - 当前 ARR 或收入，按软件与服务拆分
        - 没有分母，任何基于倍数的估值都站不住
        - 向管理层索取董事会材料或经审计的月度财务报表
      - - 利润率质量
        - 按产品线拆分的毛利率和贡献利润率
        - 区分可扩展的平台经济性和实施负担重的部署
        - 索取财务模型和队列 P&L
      - - 留存与集中度
        - NRR、GRR、前十大客户占比、NHS / 药企 / 地理区域组合
        - 检验一个伙伴名单亮眼的组合里，留存是否稳、集中风险有多高
        - 索取客户分析和销售运营导出数据
      - - 股权结构和优先权
        - 当前所有权、期权池、清算优先权，以及任何优先级工具
        - 判断表面估值能否转化为普通股回报潜力
        - 索取股权结构表、融资文件和律师摘要
      - - 盈亏平衡证明
        - 2024 和 2025 年实际盈利轨迹、现金跑道和契约状态
        - 验证 2024 年 7 月的信息是否落地
        - 索取 Series D 后董事会材料和现金瀑布
      - - Huma Cloud 采用质量
        - Huma Cloud 的使用量、定价、总留存、部署时间和实施负担
        - 检验核心多头判断：Huma 是否正在变成受监管的基础设施软件
        - 索取产品分析、管线转化数据和客户访谈
    notes: 每一项索取都对应一个估值变量；仅靠公开材料，无法安全推断这些变量。
    claimRefs:
      - CV015
      - CV031
      - CV032
      - CV041
      - CV045
figures:
  - id: FO001
    title: Huma 里程碑时间线
    type: timeline
    layout: wide
    summary: 2011 年至 2026 年 3 月，从创立到产品、监管、融资、合作和负面事件的关键节点。
    data:
      items:
        - date: '2011'
          label: 以 Medopad 名义创立
          detail: Dan Vahdat 在伦敦创立 Medopad，聚焦面向 NHS 的远程患者监测。
          tone: positive
        - date: 2021-05
          label: Series C 完成
          detail: Series C 融资完成，金额未披露，支撑国际扩张。
          tone: positive
        - date: '2022'
          label: 收购 iPlato 和 Alcedis
          detail: iPlato（英国 GP 患者互动）和 Alcedis（德国临床试验 CRO）并入平台。
          tone: positive
        - date: '2023-03-23'
          label: 取得 EU MDR Class IIb 批准
          detail: 全球首个疾病无关的可配置 Class IIb SaMD，可在欧盟支持预测型 AI 算法。
          tone: positive
        - date: '2023-06-12'
          label: 通过 FDA 510(k) Class II 许可
          detail: 获得美国 FDA 多病种许可，平台可承载用于筛查和诊断的 AI 算法。
          tone: positive
        - date: 2023-09
          label: Google Cloud GenAI 合作
          detail: 集成 Vertex AI 和 Med-PaLM 2，用于临床摘要、分诊自动化和患者提醒。
          tone: positive
        - date: '2023-11-21'
          label: 获 Saudi FDA Class C 认证
          detail: 第三个主要监管辖区完成许可，可支持 Saudi Vision 2030 医疗项目。
          tone: positive
        - date: 2023-2024
          label: 裁员约 100 人
          detail: 员工数从约 500 人降至约 400 人；CEO 承认在推动效率；FY2022 亏损 £31m。
          tone: negative
        - date: '2024-07-16'
          label: Series D — 累计融资超过 $300M
          detail: $80m Series D；AstraZeneca 和 Hitachi Ventures 加入；Huma Cloud Platform 推出；RPM 收入同比翻倍。
          tone: positive
        - date: '2024-10-02'
          label: 收购 eConsult；推出 Huma Workspace
          detail: eConsult 带来 1,400+ 家 NHS GP 诊所；面向医疗系统、带 AI 分诊的 Huma Workspace 上线。
          tone: positive
        - date: '2025-05-16'
          label: 收购 Aluna；与 Eckuity 合作
          detail: Aluna 增加 50 万美国呼吸系统签约生命数和 150+ 个医疗系统；Eckuity Capital 为 M&A 管线提供融资。
          tone: positive
        - date: '2026-03-20'
          label: 推出 Huma Intelligence Scribe
          detail: NVIDIA 驱动的 AI 临床转录上线；38 名呼吸治疗师、2,250 名患者、每月 2,300 份病历记录。
          tone: positive
    approximationNotes: Series C 日期为近似值（上下文中常见说法为 2021 年 5 月）。iPlato 和 Alcedis 的收购日期未公开披露；图中显示为约 2022 年。
