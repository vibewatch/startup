              Huma 未披露收入，精确的收入倍数模型会制造虚假确定性。更好的方法，是按证据质量定义估值支撑区间，判断哪些证据足以支撑不同私有市场结果。 牛市情形中，Huma Cloud
              证明公司正在成为数字健康的受监管基础设施层：按用量定价落地顺利，收入在更大基数上继续复合，利润率接近最佳软件经济性， 跨司法辖区审批组合仍是真实护城河。基准情形中，Huma
              依靠强伙伴和部署继续增长，但经济性只得到部分验证，因此估值支撑主要来自战略溢价，而不是广泛市场软件倍数。 熊市情形中，Huma 更像一个劳动和实施密集型的数字健康业务，身处整合中的赛道；此时 Current
