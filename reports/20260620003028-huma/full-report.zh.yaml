        title: 估值框架：强监管平台，弱财务可见度
        blocks:
          - type: paragraph
            body: >-
              Huma 通过了风险投资式关注的第一道门槛：它不是概念型数字健康公司，而是一个已规模化、受监管的平台，在医院、诊所、药企和国家级健康部署中都有真实使用。 公司声称拥有 4,500
              多个医疗服务点、数千万筛查个体、4 million 注册用户、1.8 million 活跃用户，并部署于 70 多个国家。 它还持有罕见的跨司法辖区 SaMD 组合，覆盖 FDA、EU MDR、UK
              MHRA、Health Canada 和 Saudi FDA 批准。这些事实支撑真实战略价值。 承销问题在价格，而不只是质量。公开证据披露了大额 Series
              D、收入翻倍和盈亏平衡目标，但没有披露实际收入、毛利率、ARR、现金余额、投后估值或清算优先权结构。 投资人因此无法判断，Huma
              是按高端监管基础设施公司定价，还是按仍在亏损、服务属性较重的平台转型故事定价。正确立场应是为已验证里程碑付费， 而不是为叙事付费。
