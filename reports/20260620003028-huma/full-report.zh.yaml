      - number: '3.2'
        title: 直接平台竞争者：RPM 与虚拟病房软件
        blocks:
          - type: paragraph
            body: >-
              Biofourmis 是 Huma 在美国市场最直接的竞争者。与 CopilotIQ 合并后，Biofourmis 展示为一个 AI 驱动居家照护端到端平台， 在 25+ 个美国州拥有持牌运营，并与 50
              多个全球健康系统和支付方合作。其结局数据声称 30 天再入院率下降 70%、 提前 21 小时发现恶化、照护成本最高下降 38%。不同于 Huma 的横向平台即服务定位，Biofourmis
              更像嵌入美国健康系统工作流的托管服务商； 其国际足迹显著小于 Huma 的 70 国部署。Current Health 由联合创始人 Christopher McGhee 于 2025 年 6 月从 Best
              Buy 回购， 剥离前已服务超过 70,000 名患者，并用其平台照护了超过三分之一的美国居家医院患者。Best Buy 对健康板块计提 $475 million 商誉减值，并发生 $109 million
              重组成本，确认居家医院软件市场扩张慢于最初预期， 原因包括服务提供方财务约束和 CMS 居家医院豁免的不确定性。Current Health 在原创始人旗下重新独立，意味着竞争仍在，
              但基础受财务约束。Doccla 是聚焦英国的虚拟病房提供商，在分析师市场报告中作为居家医院软件案例出现， 但其披露客户基础明显小于 Huma。Biofourmis 和 Current Health
              都瞄准重叠买方——希望把照护延伸到家庭的医院网络和整合交付系统—— 但都没有 Huma 持有的多司法辖区 Class II/IIb 监管组合。
