  - id: TV005
    title: 投资逻辑破裂和否决触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 盈利未达预期
        - 管理层无法证明 2024 年已实现盈亏平衡，或 2025 年亏损实质性收窄
        - 削弱 Huma Cloud 和重组改善经济性的主张
        - 暂停定价工作；将下一轮视为保资本融资，而非增长融资
      - - 防御性融资
        - 新资本只靠重度优先权、棘轮条款或内部人支持募集
        - 表明当前私募估值未得到外部验证
        - 按下行情景重新核保，并在推进前要求完整股权结构表
      - - 监管滑坡
        - 关键 FDA、EU、UK、Canada 或 Saudi 批准受到重大限制、延迟或补救要求
        - 削弱护城河并拖慢商业化
        - 除非问题孤立且可快速补救，否则转为放弃
      - - 执行压力
        - 2023-2024 年重置后进一步大范围裁员，或支持质量明显恶化
        - 表明 Huma 运营上仍结构性规模不足
        - 推迟投资，直到组织稳定性和客户指标得到证明
      - - 服务占比过重
        - 实施或定制服务收入压过云 / 平台收入
        - 压低软件倍数潜力和利润率展望
        - 用更低的战略服务结果锚定估值，而非高端 SaaS 区间
    notes: 这些可监测的投资逻辑破裂事件直接绑定估值压缩，而非泛化运营风险。
