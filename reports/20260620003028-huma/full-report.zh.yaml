      - number: '6.4'
        title: 留存、续约与满意度指标
        blocks:
          - type: paragraph
            body: >
              Huma 任何产品线都没有公开的 NRR 或 GRR 指标。可用的留存和满意度替代指标多面向患者（参与度和依从性数据），而非合同层面指标。 虚拟病房部署方面，Huma 称患者依从性为
              90–95%；尚未发现第三方对依从性方法的审计。Huma MG：在 2026 年 St George's University Hospitals 结构化体验研究中，86% 的患者希望研究期后继续使用，69.8%
              会向其他 MG 患者推荐 Huma MG，83.7% 可独立使用平台。eTriage 方面，Huma 报告 85% 的患者反馈为正面。eConsult 部署规模较收购前继续增长，达到 1,400+ 家 GP
              诊所、50M+ 次数字问诊，说明平台使用率高，但合同层续约率未知。VARGADO 肿瘤研究与 Boehringer Ingelheim 持续超过 10 年， 说明关系耐久，并由长期数据承诺支撑。CKD/T2D
              临床试验提前完成入组，反映赞助方对 Huma 运营执行有较高信心。2024 年 7 月 Series D 中，既有投资人 AstraZeneca、Hitachi Ventures 和 Leaps by Bayer
              再度参与，说明这些药企伙伴在重组期后仍对业务有信心。未发现任何 Huma 产品的 G2、Gartner Peer Insights 或 KLAS 客户满意度评论。
