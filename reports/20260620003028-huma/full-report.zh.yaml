      - number: '8.2'
        title: 市场顺风存在，但公开可比公司限制估值论证
        blocks:
          - type: paragraph
            body: >-
              品类背景有吸引力。Grand View、Fortune Business Insights 和 Insight Partners 都描述了庞大且增长中的数字健康、RPM 和居家住院市场； McKinsey
              则把医疗可及性和劳动力短缺定义为数字化照护的结构性需求驱动。这解释了 Huma 为什么有可能增长。但好市场不能取消估值纪律。 最相关的公开基准 iRhythm 展示了专业 RPM
              公司多年商业化后的样子：收入规模可观、毛利率强，并在近期实现正自由现金流。Masimo 和 Philips
              展示了更大型医院监测在位企业的体量，但它们是硬件或多元照护参照，不是干净的平台可比。更需要警惕的是私有市场结果：Best Buy 持有 Current Health 的挫折，以及 Biofourmis 与
              CopilotIQ 合并，说明该领域出现过整合和预期受损，而不是普遍强退出。这个组合支持 Huma 因监管护城河相对弱数字健康同业 享有溢价，但不支持在缺少更多披露时支付峰值市场软件倍数。
