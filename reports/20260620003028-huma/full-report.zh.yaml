  - id: TV002
    title: 正方 / 反方投资逻辑表
    columns:
      - 论点领域
      - 正方逻辑
      - 反方逻辑
      - 哪些信息会改变判断
    rows:
      - - 市场
        - 数字健康、RPM 和居家医院市场规模大，仍在增长，背后有可及性和劳动力压力支撑。
        - 大市场不等于平台供应商一定能拿到漂亮的单位经济或持久买方预算。
        - 证明企业需求多年持续、续约客户群稳定，并且预算韧性不只依赖一两个旗舰合作伙伴。
      - - 产品和护城河
        - 多司法辖区 SaMD 批准为疾病无关平台形成差异化监管护城河。
        - 护城河只有转化为商业转化和利润率才有意义，而不能只是合规成本。
        - 提供赢单 / 输单分析，证明批准显著改善成交率或定价。
      - - 客户和合作伙伴
        - 蓝筹合作伙伴名单和 4,500+ 个护理站点意味着真实的企业验证。
        - 合作伙伴标识可能遮住收入集中不均、试点流失或低利润率服务工作。
        - 按部署类型披露集中度、续约和毛利率。
      - - 财务
        - 截至 2024 年 7 月，收入同比翻倍；Huma Cloud 可能改善软件式经营杠杆。
        - 绝对收入、利润率、烧钱和盈亏平衡达成情况仍未披露，因此增长质量未知。
        - 分享经审计收入、毛利率、烧钱、现金续航，以及已实现盈利的证据。
      - - 竞争
        - Huma 比多数直接 RPM 同行更宽，也更受监管。
        - Current Health 和 Biofourmis 显示，该赛道仍可能以令人失望的结果整合。
        - 证明 Huma 能把护城河转成比失败或并购同行更好的经济性。
      - - 执行
        - 收购和全球覆盖可叠加平台价值。
        - 收购、裁员和 AI 扩张也可能拉伸运营纪律。
        - 展示整合 KPI、质量指标，以及重组后稳定的组织健康度。
    notes: 每一行都把核心投资论点与最强反方观点配对，让建议保持价格敏感，而不是只给质量打分。
    claimRefs:
