      - number: '3.3'
        title: 既有玩家与垂直竞争者
        blocks:
          - type: paragraph
            body: >-
              iRhythm（NASDAQ: IRTC）是高端垂直 RPM 的上市公司标尺。其 Zio 可穿戴 ECG 贴片在 2025 年创造 USD 747.1 million 收入， 同比增长 26.2%，毛利率
              70.6%，并在 2025 年 Q4 首次实现 GAAP 净利润。iRhythm 的模式由报销驱动， 狭窄聚焦心律失常检测，依赖通过 CMS 代码计费的单个 Zio
              贴片服务合同；它不在平台宽度或疾病无关覆盖上竞争。 Masimo Corporation 是一家以硬件为中心的患者监测公司，其多参数监测设备（脉搏血氧、二氧化碳图和 rainbow 技术）
              主导医院脉搏血氧，但其软件层（Masimo SafetyNet）更像附加组件，而非独立平台。Philips 2025 年年报显示， 其互联照护业务在呼吸机召回争议后经历了重大重组；其 RPM 收入曾在 2020
              年达到 USD 6.8 billion， 但当前细分细节需要直接访问完整 2025 年文件。AliveCor 的 KardiaMobile 和 Kardia 系统提供消费者级个人 ECG 设备，
              服务个人消费者的心脏监测，而非健康系统部署工作流；它竞争的是消费者远程监测利基，而不是企业临床管理。 Medtronic 的 Reveal LINQ
              植入式心脏监测器及其远程监测基础设施（Carelink）在特定心脏监测利基中竞争， 商业模式锚定硬件。四类既有玩家与 Huma 的关键区别在于，既有玩家靠设备销售和报销程序变现； Huma
              靠平台访问、软件配置和用量型费用变现。因此买方旅程、采购流程和竞争动态都根本不同。
