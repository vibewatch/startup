  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Huma 的竞争格局横跨五类。第一，直接 RPM 和数字健康平台提供商——包括 Biofourmis（现已与 CopilotIQ 合并）、 Current Health（2025 年从 Best Buy
              回购）和聚焦英国的 Doccla——在虚拟病房软件和远程患者监测功能上竞争。 第二，带硬件监测的垂直既有玩家，如 iRhythm（心律失常）、Masimo（脉搏血氧和多参数硬件）、Philips（互联照护）和
              Medtronic（植入式心脏监测器），服务更窄但报销更深的临床利基。第三，相邻平台提供商，包括 EMR 供应商（Epic、Cerner）、 远程医疗平台（Teladoc、Doximity）和 CRO
              软件玩家（Veeva、Medidata），可在特定用例中替代 Huma。第四， 大型科技公司——Microsoft（Nuance DAX、Azure Health）、Google（Med-PaLM 2、Cloud
              Healthcare API）和 Amazon（HealthLake）——正把 AI 和基础设施产品扩展到受监管医疗。第五，内部自建和现状工作流仍是每个尚未数字化远程监测的健康系统的既有替代。 2024
              年全球数字健康市场估计为 USD 288.55 billion，预计到 2030 年达 USD 946 billion，CAGR 为 22.2%。 仅远程患者监测细分 2025 年就达到 USD 59.92
              billion，预计到 2034 年增至 USD 289.77 billion。 Huma 核心部署垂直 Hospital-at-home 在 2025 年估值 USD 37.17 billion。北美以
              2025 年 48% 份额主导 RPM 市场， 而英国 NHS 虚拟病房项目已成为 Huma 组合中最集中的单一支付方部署环境。
