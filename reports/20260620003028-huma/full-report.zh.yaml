      - number: '5.4'
        title: 技术差异化与 AI 栈
        blocks:
          - type: paragraph
            body: >
              Huma 的核心技术差异化在于预认证、设备无关的监管外壳，让第三方可在数天内配置受监管的健康应用，而不是耗费数年。Huma Intelligence 内部的 AI/ML 栈分为三组能力：监测与预测智能（基于
              500,000+ 名 UK Biobank 个体训练的 CVD 风险预测模型、通过已验证问卷和计算机视觉分析追踪重症肌无力严重程度、 术后活动范围追踪）；面向临床工作流的生成式 AI（HI Scribe 使用
              NVIDIA Parakeet ASR 和 TitaNet 说话人识别，并用 NVIDIA 优化的 Llama 模型推理）；以及通过 Huma Workspace 提供 AI
              辅助应用配置（低代码、提示词驱动生成受监管健康应用）。联邦数据模型意味着患者数据在机构层面处理； 跨机构分析也以联邦方式支持，无需集中数据，这回应了 EU GDPR 和英国 NHS 数据治理约束。Google
              Cloud Vertex AI 是已宣布的生成式 AI 场景开发合作伙伴。GitHub 组织 huma-engineering 拥有公开仓库，包括 huma-docs（MIT 许可的文档服务，8 名贡献者、3
              stars，2026 年 6 月更新）和 huma-common-actions，说明其公开开发者界面活跃但规模很小。IP 组合包括作为 510(k) 提交一部分获 FDA 许可、并在 European
              Society of Cardiology 验证的心血管风险算法。
