      - number: '2.2'
        title: 市场规模：三重视角下的 TAM、SAM 与 SOM 分析
        blocks:
          - type: paragraph
            body: >
              多家独立市场研究机构给出的数字健康市场估算差异显著，取决于方法、范围和基准年份。Grand View Research 将 2024 年全球数字健康市场估为 $288.55 billion，并以 22.2%
              的复合年增长率（CAGR）增长至 2030 年 $946 billion。Fortune Business Insights 给出更大的估算：2026 年 $491.62 billion，以 21.6% CAGR
              增至 2034 年 $2.35 trillion。 差异主要来自范围边界——Grand View 的估算排除了 Fortune BI 纳入的硬件密集型远程医疗设备，且基准年份不同。

              对 Huma 最直接相关的子市场——远程患者监测设备和软件——Fortune Business Insights 估算 2025 年为 $59.92 billion， 到 2034 年增至 $289.77
              billion，CAGR 为 19.16%。Huma 主要 NHS 上市渠道 Hospital-at-Home 市场则由 The Insight Partners 单独估算为 2025 年 $37.17
              billion，到 2034 年增至 $72.84 billion，CAGR 为 7.8%； 增速明显更慢，反映急性居家照护交付的资本密集度和临床复杂度。

              要更紧地估算可服务市场（SAM），RPM 和虚拟照护中的软件与平台授权层——剔除硬件、物流和护理服务——按可比 SaaS 医疗平台利润率， 约占 RPM 市场价值的 15-25%。把这一捕获率套到 RPM
              市场，可得 2025 年 SAM 约 $9-15 billion， 到 2034 年增至 $43-72 billion。Huma 目前的签约患者基础（约 500K 个美国 RPM 生命，加全球 4,500+
              家医院） 暗示其三个客户细分在规模化后可服务可获得市场（SOM）约为 $500M-$1.5B ARR，假设 SaaS 费用为每名患者每年 $50-100、 每项药企研究 $2-10M。实际当前收入未披露；CEO
              称 RPM 收入在 Series D 关账前十二个月同比翻倍。

              McKinsey 的数字健康市场分析识别出五个价值池：电子健康记录、照护交付、照护管理、数字疗法和分析 / AI。 Huma 横跨照护管理、数字疗法和分析 / AI，说明有效 SAM
              更像是多个价值池的混合切片，而不是某一个细分估算。
