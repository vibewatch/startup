      - number: '2.5'
        title: 采用约束、竞争格局与尽调缺口
        blocks:
          - type: paragraph
            body: >
              五个结构性约束压低数字健康平台采用速度。第一，数据隐私监管——欧盟 GDPR 和美国 HIPAA——要求平台供应商落实数据驻留、
              处理协议和患者同意基础设施，抬高合规开销并拉长销售周期，跨境部署尤其明显。第二，NHS 12-24 个月采购周期在政策强制要求与商业收入转化之间制造结构性滞后， 供应商必须在等待采购关账期间维持烧钱。

              第三，临床验证缺口仍是支付方强制扩大报销的障碍：美国支付方和英国 NICE 要求随机对照试验（RCT）证据， 才会在现有 CPT 代码覆盖之外扩大 RPM 报销。Huma
              的平台无关路径，使其比单适应症竞争者更难积累疾病特定 RCT 证据。 第四，拼出多司法辖区监管组合资本密集——复制 Huma 当前 5 个司法辖区栈估计需要 $30-60M 和 5-10 年——
              这既给新进入者制造壁垒，也给 Huma 带来高额持续维护成本。

              临床级 RPM 竞争格局正在整合。iRhythm（NASDAQ: IRTC）仅心脏监测一项就在 2025 全年录得 $747 million 收入；
              其疾病特定聚焦带来深厚报销基础设施，但疾病覆盖有限。AliveCor 通过 Kardia 设备和 FDA 510(k) 单病种心脏监测许可， 在 AI ECG 上竞争。Biofourmis 到 2022
              年累计融资超过 $300 million，2024 年与 CopilotIQ 合并， 形成一个预测分析和慢病照护组合平台；这一整合显示多适应症 RPM 供应商承受资本压力。Masimo FY2024 收入约
              $2.1 billion， 主导医院床旁监测硬件，并用 Patient SafetyNet 平台向软件延伸。

              Best Buy 于 2025 年 6 月剥离 Current Health——距 $400 million 收购约四年——给出最清晰的不利市场信号： 通过零售合作进行消费者渠道
              RPM，未能规模化实现临床级采用。联合创始人回购业务，说明企业市场仍有剩余价值， 但也承认消费者分发假设失败。这强化了 Huma 企业优先战略，同时验证 RPM 扩张需要深度临床集成和报销基础设施，
              而不是消费者分发。

              市场规模和采用速度上仍有若干关键尽调缺口：Huma 所称 2/3 NHS 市占率没有独立验证；其 500K 个签约美国生命的 RPM 采用到入组转化率未披露；也没有公开发表针对 Huma 平台本身的 RCT
              级临床证据。
