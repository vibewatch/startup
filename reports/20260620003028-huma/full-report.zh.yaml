      - number: '6.6'
        title: 图表资料
        blocks:
          - type: callout
            title: GDm-Health 是金标准临床证据锚点
            body: >
              GDm-Health 是唯一接受独立开展、同行评议 RCT（Oxford University）评估的 Huma 产品，覆盖超过 50% 的英国妊娠糖尿病患者。它是组合中最强的临床证据， 支撑 Huma 在
              NHS 规模下交付可衡量医疗结果的主张。其他结果主张均基于公司陈述的运营数据、公司支持的研究或合作伙伴声明。
            calloutType: strength
            claimRefs:
              - CU016
              - CU017
          - type: callout
            title: 英国 NHS 买方集中是主要商业风险
            body: >
              Huma 多数生产级、具名部署都在英国 NHS。五个主要 NHS 面向产品（eTriage、GDm-Health、Virtual Wards、eConsult、Huma MG） 都依赖 NHS
              持续委托决策、CCS Spark DPS 采购框架和 NHS IT 集成标准。NHS 政策、采购框架或数字健康支出若发生变化，可能实质影响 Huma 收入。Aluna 收购和药企 /
              政府扩张，是公开资料中最主要的、主动降低集中风险的信号。
            calloutType: risk
            claimRefs:
              - CU029
              - CU033
              - CU034
          - type: callout
            title: Sifted：重组、£31M 亏损和约 100 人裁员提示商业执行风险
            body: >
              Sifted 2024 年 7 月报道称，Huma 已裁员约 100 人（员工数从约 500 降至约 400），且公司 2022 年经营亏损 £31 million。 Series D
              由「多笔较小注资」完成，而非单次交割，说明投资人谨慎。尽管 $80M Series D 宣布时既有药企投资人再度承诺， 重组期及其对产品交付节奏或客户关系连续性的影响无法独立验证。
            calloutType: risk
