      - number: '7.5'
        title: 缓释因素、监测指标与退出标准
        blocks:
          - type: paragraph
            body: >-
              正确的投资框架应是有条件的，而非二元判断。Huma 已经有实质缓释因素：获批和认证产品、大规模装机基础、NHS 运营经验，以及蓝筹战略伙伴。
              这些事实足以支持继续尽调，但不能替代尽调。监测应聚焦会直接击穿投资假设的事件：关键监管状态丧失或被实质限制；NHS 采购或 Trust 要求失效； 重大隐私、安全或患者安全事故；无法展示 Series D
              后稳定走向盈亏平衡；或证据显示新 AI 模块无法足够快地完成验证并用于临床部署。 因此，尽调负担应以文件为主、运营细节要具体：逐产品监管地图、SCC 和 DPA
              包、正常运行时间与事故日志、按客户和伙伴划分的集中度、AI 变更控制治理， 以及收购后整合 KPIs。如果这些材料薄弱，剩余风险不只是增长更慢；而是 Huma
              变成一个永久复杂、利润率更低的服务和合规业务，而不是可规模化的受监管软件平台。
