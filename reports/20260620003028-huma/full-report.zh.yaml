              GrandView 与 Fortune BI 对数字健康 TAM 的估算相差 $200+ billion，反映的是真实方法论分歧， 不只是乐观与悲观之别。若用更大估算来支撑估值倍数，一旦更窄的 SaMD
              软件市场定义被证明准确，投资者将面对实质风险。 Huma 自身 SAM——授权给健康系统和药企的可配置 SaMD 软件——2025 年估计为 $9-15B，而不是 $292-492B， 这会显著压低 SaMD
