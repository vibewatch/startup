  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与排序
        blocks:
          - type: paragraph
            body: >-
              Huma 不是尚未验证的数字健康初创公司。它已经拥有跨司法辖区医疗器械许可、NHS 虚拟病房部署、主要药企关系，以及数千万筛查用户。
              这种成熟度降低了一阶市场进入风险，但也改变了失败模式：错误不再只是简单获客噪音，而会沿着受监管工作流、患者数据处理、伙伴依赖和企业采购扩散。 因此，最严重的剩余风险集中在几件事：维持
              FDA、欧盟、英国、加拿大和沙特阿拉伯审批；在规模化中保持隐私和国际数据传输控制足够稳健； 为虚拟病房和远程监测守住平台可靠性；管理对 NHS 路径、药企伙伴和 Google Cloud 新 AI
              功能的依赖；以及在不再触发破坏性成本重置的前提下， 为从反复亏损走向可信盈亏平衡筹资。可见缓释因素——FDA 和 MDR 批准、ISO 13485、ISO 27001、SOC 2 Type II、NHS DSPT
              以及大型战略伙伴——都有意义，但它们是流程控制，不等于证明每个新算法、收购或市场扩张都能不拖延、不积累安全债就被吸收。
