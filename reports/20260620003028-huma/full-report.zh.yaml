      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              伊朗裔英国企业家 Dan Vahdat 于 2011 年在伦敦以 Medopad 之名创立 Huma，并自创立以来一直担任 CEO。 Vahdat 维持着很高的公开曝光，倡导英国数字健康投资，包括 2026
              年在议会作证。公开记录未提及任何联合创始人； Huma 的增长看起来始终由创始人 CEO 牵引。Dan Vahdat 同时是创始人、CEO 和公司公开门面， 关键人物集中度构成实质治理风险。


              Dr. Mert Aral 担任首席医疗官（CMO），负责临床安全、监管科学和证据生成。Dr. Harpreet Sood 是基层医疗与合作伙伴副总裁， 曾任 NHS Digital
              临床信息学专家。Michael Macdonnell 担任全球医疗与药企合作负责人。


              公司没有公开披露董事会和治理细节；已知机构代表包括 Leaps by Bayer、AstraZeneca 和 Hitachi Ventures， 这些 Series D
              投资者很可能拥有董事会或观察员权利。eConsult 收购公告（2024 年 10 月）称，eConsult CEO Dr. Murray Ellender 作为交易的一部分加入公司。Eckuity
              Capital 合作（2025 年 5 月）引入 Youssef Sebban 和 Vishal Jain， 作为在资本和 M&A 顾问角色上的关键外部负责人。完整董事名单、治理结构和独立董事人数均未公开披露。
