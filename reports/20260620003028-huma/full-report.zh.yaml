        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              Huma 的运营风险嵌在临床工作流里，而不只是企业软件运营。NHS 虚拟病房、远程监测项目和配套 app 依赖及时连接、告警、升级逻辑和患者参与； 这里一旦失败，可能先成为患者安全问题，然后才是流失问题。Huma
              已公布的认证——ISO 13485、ISO 27001、SOC 2 Type II、 Cyber Essentials Plus 和 NHS DSPT——说明公司确实投入控制体系，但这些认证没有披露
              uptime、事故历史、告警假阴性率，或 CAPA 和投诉趋势。运营复杂度还会上升，因为 Huma 通过 Alcedis、iPlato 等收购扩张，且去中心化试验、患者参与和 RPM
              产品必须整合到同一个云和监管骨干上。 因此，风险不太是 Huma 没有合规体系，而是规模、收购和新 AI 功能可能跑得比验证、监控或支持能力更快——尤其是在裁员把员工数从约 500 降至约 400 之后。
