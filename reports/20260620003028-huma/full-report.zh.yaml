      - number: '5.2'
        title: 核心产品组合与使用场景
        blocks:
          - type: paragraph
            body: >
              Huma 的产品组合覆盖五条主要照护路径。（1）eTriage 是基于自助终端的 A&E 数字签到系统，已部署在 22 个 NHS 急诊科和紧急照护中心； 它采集 ECDS
              数据，运行自动风险分层（P1–P5），截至 2025 年 9 月已在 21 个 NHS ED 和 UCC 安全分诊 1.8 million 名患者。（2）GDm-Health 是与 Oxford
              University 共同开发的妊娠糖尿病管理平台；已在 64 个 NHS Trusts 上线，覆盖超过 100,000 例妊娠，RCT 支持其糖尿病就诊减少 47%、早产率降低 64% 的说法。（3）Huma
              MG 是面向重症肌无力的远程监测平台， 覆盖英国、欧洲和美国 600+ 名患者；St George's University Hospitals NHS Foundation Trust 在 2026
              年开展的一项结构化体验研究显示， 89% 认为应用易用，93% 认为 MG-ADL 问卷直观，86% 希望研究期后继续使用。（4）Virtual Wards / RPM 产品支持居家住院照护路径； 在 NHS
              Trusts 的 450+ 个部署中，Huma 称平台让临床容量翻倍、再入院率降低 >30%、患者依从性达到 90–95%。（5）eConsult （2024 年 10 月收购）是数字分诊和自动化问诊平台，已在
              1,400 多家 NHS GP 诊所上线，交付 50+ million 次数字问诊。智能层产品 HI Scribe（2026 年 3 月在 NVIDIA AI
              上推出）是实时转录工具，可生成患者和临床医生摘要；截至 2026 年 3 月，已有 38 名活跃呼吸治疗师、约 2,250 名活跃患者，并每月生成约 2,300 条实时互动记录。在生命科学领域，由 Alcedis
              支撑的临床试验平台为去中心化和混合试验提供 eCRF、EDC、eConsent 和 eCOA。
