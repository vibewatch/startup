              的单位经济——包括获客成本（CAC）、生命周期价值（LTV）、 净收入留存（NRR）和回本周期——没有公开数据。作为代理，iRhythm 2025 年 70.6% 毛利率代表垂直 RPM 模式的高端； Huma
