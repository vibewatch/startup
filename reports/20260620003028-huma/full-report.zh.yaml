      - number: '6.2'
        title: 采用轨迹与规模
        blocks:
          - type: paragraph
            body: >
              Huma 最可信的采用证据集中在英国 NHS 部署。截至 2025 年 10 月，eTriage 已在 22 个 NHS Emergency Departments、Minor Injury Units 和
              Urgent Care Centres 上线，已分诊 1.8 million 名患者；2025 年 10 月在一家伦敦大型 NHS ED 的新部署首个 24 小时处理 250+ 名患者，将危重病例路由至
              Epic，将低危病例路由至 Adastra，无需人工干预。GDm-Health 覆盖 64 个 NHS Trusts，每年服务超过 100,000 例妊娠，并覆盖英国所有妊娠糖尿病患者的 50%
              以上。Virtual Wards / RPM 产品部署在 450+ 个 NHS Trust 站点，签约呼吸监测覆盖人群为 140,000。2024 年 10 月收购的 eConsult 已在 1,400+ 家
              NHS GP 诊所交付超过 50 million 次数字问诊。在生命科学领域，CKD/T2D 临床试验在 20 个国家 350 个中心招募 4,500 名患者，并提前一年完成入组。 HANSE 肺筛查研究 15
              个月招募 5,191 名参与者，直接影响德国 2026 年全国肺癌筛查项目。Huma 截至 2026 年声称的平台总规模： HCP 上 100+ 个应用，支持 70+ 个国家 4,500
              家医院和诊所的工作，筛查或触达 50M+ 人。可比背景：竞争性 RPM 供应商 Current Health 在 2025 年 6 月被 Best Buy 卖回给联合创始人，金额未披露；Best Buy 曾在
              2021 年为其支付 $400M。 这说明，没有 Huma 的多产品广度和监管覆盖，独立 RPM 玩家面临明显逆风。
