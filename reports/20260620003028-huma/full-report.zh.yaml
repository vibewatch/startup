      - number: '5.3'
        title: 监管状态、信任与合规
        blocks:
          - type: paragraph
            body: >
              Huma 的核心 SaMD 平台拥有跨司法辖区医疗器械监管许可，使其跻身数字健康领域认证最广的疾病无关型平台之一。US FDA 510(k) Class II 许可（设备编号 K230214）于 2023 年 6
              月通过与 Health Canada 的联合 eSTAR 计划取得；该许可允许监测任意年龄、任意病症的患者，并托管用于临床决策支持的 AI/ML 算法。EU MDR 2017/745 Class IIb 认证于
              2023 年 3 月取得，是全球首个达到该分类级别的多病种可配置 SaMD。Saudi FDA Class C 于 2023 年 11 月取得。Health Canada Class II Medical
              Device License 于 2025 年 4 月取得。平台还持有 MHRA Class IIb（英国）、TGA Class IIb（澳大利亚）、CDSCO Class C（印度）和
              MOHAP（阿联酋）。质量管理体系通过 ISO 13485 认证（也是日本、澳大利亚、加拿大、美国 MDSAP 的基础）。信息安全通过 ISO 27001 认证。其他认证包括 IEC 62304（软件生命周期）、
              IEC 62366（可用性）、IEC 82304-1（健康软件安全）、ISO 14971（风险管理）、ISO 14155（临床研究）、CyberEssentials 和 CyberEssentials
              Plus。平台符合 HIPAA，并通过 NHS DSPT（Data Security and Protection Toolkit）认证。Huma 在客户部署中担任 Legal
              Manufacturer，提供经过认证的质量框架，降低客户推出新病种应用时的监管负担。
