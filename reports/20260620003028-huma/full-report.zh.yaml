            body: >-
              商业上，Huma 受益于令人印象深刻的交易对手，但同一生态也带来集中和谈判风险。NHS England 虚拟病房政策和采购指引实质塑造英国需求； 与 Bayer、AstraZeneca、Google
              Cloud、UCB、Parexel 等药企伙伴的战略关系增强可信度，也可能让路线图优先级、试点转化和未来融资更依赖少数机构。 Google Cloud 对 Huma Intelligence 和 10x
              Nurse 尤其重要，因此模型、基础设施和合规假设不能被视为完全自有。财务上，公司已融资超过 $300 million，但 2022 年净亏损约 £31 million，2023 年也大致在该水平，随后 2024
