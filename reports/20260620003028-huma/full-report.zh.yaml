      - number: '6.3'
        title: 具名客户证据与案例研究
        blocks:
          - type: paragraph
            body: >
              最强的具名客户证据来自 NHS 案例研究和药企合作。eTriage 方面，Huma 在 2025 年 10 月发布案例研究，描述其在一家伦敦大型 NHS Emergency Department
              的实时部署（配套案例研究中识别为 Homerton Healthcare NHS Foundation Trust），24 小时内处理 250+ 名患者。eTriage 案例研究描述了横跨 Epic 和
              Adastra 的统一患者流，两个旧 EHR 无需人工重新集成。GDm-Health 方面，Oxford University RCT（已发表）报告相较标准照护，糖尿病就诊减少 47%、早产率降低
              64%、C-section 减少 42%。 重症肌无力方面，UCB 已公开确认在欧盟和美国市场使用 Huma MG 做数字照护转型；St George's University Hospitals NHS
              Foundation Trust 2026 年一项结构化患者体验研究纳入 66 名患者，发现 86% 希望研究结束后继续使用 Huma MG。肿瘤方面，Boehringer Ingelheim 与 Huma 的
              Alcedis CRO 子公司围绕 VARGADO 研究（137 名患者）合作 10+ 年，产出 3 篇同行评议论文和一场 ESMO 2024 报告。Bayer 公开确认 CVD Heart Health
              Risk Assessment 合作横跨美国（2023 年推出）和沙特阿拉伯（2024 年 5 月推出）， 称其为一款「无需侵入性检测即可评估个人未来十年发生心血管疾病风险」的工具。eTriage、Huma MG
              和 HI Scribe 的证据新鲜度较高 （2025–2026 年数据）；GDm-Health RCT 数据来自最初 Oxford 研究（日期未说明，但作为当前 NHS 部署依据呈现）。
