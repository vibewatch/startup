      - number: '4.5'
        title: 财务结论：收入质量、利润率路径与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Huma 的财务图景在增长叙事上结构完整，但量化核心不透明。优势包括：已经验证的企业模式，覆盖 4,500+ 家医院；前 20
              大药企中超过一半为活跃伙伴；跨司法辖区监管许可支撑溢价定价；平台化转型有望随时间推高利润率。收入翻倍说法——假设基准年为 USD 30M，翻倍意味着约 USD 60M——会把 Huma 放入一个类别：再规模化
              2-3 年后，Series E 或盈利有可能实现。但没有披露数字时，这仍属推测。 弱点同样明显：2022 年确认净亏损 £31M，CEO 称 2023 年亏损相近，说明公司持续消耗现金；2023
              年欧洲数字健康融资环境仅 £1.2B（2021 年为 £3.1B），压缩了再融资选项；员工数削减约 20% 以降低烧钱；截至 2026 年中，盈亏平衡尚未公开确认。
              从服务主导收入转向平台主导收入是真实动作，但尚未量化。单位经济仍是完全黑箱：CAC、LTV、NRR、流失率和回本周期都是私有指标，需要直接接触管理层才能承销。 主要尽调阻塞点是：（1）实际 ARR
              或收入运行率及同比轨迹；（2）按板块划分的毛利率（医疗系统、药企、平台）； （3）当前现金头寸和烧钱率，用以确认或否定 2024 年盈亏平衡；（4）前 3-5 大医疗系统账户的合同结构，用以确认收入耐久性；
              （5）至少一个可复制客户群组的单位经济。
