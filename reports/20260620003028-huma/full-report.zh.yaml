      - number: '2.4'
        title: 增长驱动与结构性顺风
        blocks:
          - type: paragraph
            body: >
              七个结构性顺风正在加速数字健康平台采用。英国、欧盟和美国人口老龄化，为院墙之外的慢病监测创造持续数十年的需求： 到 2030 年，欧盟 65 岁以上人口将超过
              25%，在当前人员配置下，慢病管理量会超出线下门诊交付能力。 世界卫生组织认定，非传染性疾病（NCD）每年造成全球 74% 死亡，使慢病监测成为国家级公共卫生刚需。

              NHS 虚拟病房强制要求，是 Huma 英国业务最直接的近期收入顺风。NHS England 政策要求所有虚拟病房采用技术支持的监测， 并以 FY2024/25 结束前建成 10,000+
              张虚拟病房床位为目标。Huma 称 eConsult 收购后，其平台支撑了英国 2/3+ 初级和二级医疗服务提供者的部署，形成了可向上销售虚拟病房能力的大型装机基础。

              CMS 对 RPM 的报销扩展（CPT 代码 2018 年引入，2020 年和 2022 年扩展）让美国市场具备可扩张的按患者收入模式。 American Medical Association 已发布 RPM
              编码和计费指南，直接推动健康系统采购浪潮。Aluna 收购让 Huma 进入 150+ 个美国健康系统，并获得约 500,000 个签约 RPM 生命，为美国收入快速增长提供平台。

              疫情后，药企向去中心化临床试验（DCT）的结构性转移按 McKinsey 分析提前了 3-5 年。DCT 相比基于中心的试验， 可将每名患者招募成本降低 30-50%，并触达地理分散的患者群体。这给 Huma 由
              Alcedis 驱动的生命科学业务带来持续顺风； EU MDR Class IIb 和 FDA Class II 许可的监管可信度，使其能够部署在高风险罕见病和肿瘤试验中。

              2024 年起执行的 EU MDR 会放大竞争护城河：未在监管截止日前获得 EU MDR 认证的供应商，要么大幅投资， 要么退出欧洲 SaMD 市场。Huma 2023 年取得的 EU MDR Class IIb
              认证相对未认证竞争者形成持久优势。 最后，沙特 Vision 2030 健康 IT 投资计划代表一个未充分服务市场中的 $40B+ 绿地机会；凭借 Saudi FDA Class C 认证和 Bayer CVD
              筛查部署，Huma 拥有先发优势。
