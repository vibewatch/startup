      - number: '1.4'
        title: 关键里程碑、收购与不利事件
        blocks:
          - type: paragraph
            body: >
              Huma 十五年历史覆盖了从单一疾病患者数据公司到多产品全球医疗基础设施提供商的完整生命周期。最重要的监管里程碑是 EU MDR Class IIb 批准（2023 年 3
              月）——首个获得这一分类的疾病无关可配置 SaMD——随后是美国 FDA 510(k) Class II 许可（2023 年 6 月）和 Saudi FDA Class C 认证（2023 年 11
              月）。这三项跨司法辖区批准形成了有意义的进入壁垒， 复制者寥寥。Health Canada Class II 批准于 2025 年 4 月 17 日宣布。


              收购方面，Huma 完成了四笔已知交易：iPlato（英国患者互动，日期未公开）、Alcedis（德国临床试验 CRO， 拥有 30+ 年经验和 670+ 项研究）、eConsult（2024 年 10
              月，英国数字分诊平台，用于 1,400+ 家 NHS GP 诊所）、 Aluna（2025 年 5 月，美国呼吸 RPM 设备和软件）。其中 eConsult 收购伴随 Huma Workspace for
              Health Systems 发布， 为平台栈加入 AI 优先的基层医疗分诊和自动问诊能力。


              不利事件包括一次实质裁员：Sifted 2024 年 7 月报道称，Huma 员工数在此前一年从约 500 人降至约 400 人， 此前公司在 2023 年 8 月宣布计划裁员 45+ 人。CEO Dan
              Vahdat 承认裁员是「效率」行动的一部分， 且没有排除进一步裁减。FY2022 亏损 £31 million（Companies House）和 FY2023「类似」亏损（Vahdat，Sifted 采访）
              构成结构性风险，因为公司仍在追求规模化平台经济。除既定目标外，公司尚未披露正式盈亏平衡路径。
