      - number: '5.6'
        title: 图表资料
        blocks:
          - type: callout
            title: 跨司法辖区 SaMD 认证是结构性护城河
            body: >
              Huma 是唯一同时持有 EU MDR Class IIb、US FDA Class II（510k）、Saudi FDA Class C 和 Health Canada Class II 许可的疾病无关型可配置
              SaMD 平台。这一跨司法辖区监管组合用了十多年才建成，构成进入壁垒，并显著降低药企和 NHS 客户的上市时间成本。
            calloutType: strength
            claimRefs:
              - CE017
              - CE018
              - CE019
              - CE020
          - type: callout
            title: HI Scribe 对 NVIDIA 的依赖是集中风险
            body: >
              HI Scribe 产品在架构上依赖 NVIDIA Parakeet、TitaNet 和 Llama Nemotron 模型。如果 NVIDIA 调整 API 定价、弃用模型或改变许可条款， Huma 将需要重构
              HI Scribe，并可能因任何重大模型变更而重新取得监管许可。
            calloutType: risk
            claimRefs:
              - CE015
              - CE025
          - type: callout
            title: 小规模公开开发者社区限制外部验证
            body: >
              huma-engineering GitHub 组织的公开仓库活动有限（huma-docs 有 3 stars、8 名贡献者），且没有公开可见的 SDK 文档或 changelog。
              这限制了独立技术审查，也让生态规模难以评估。
            calloutType: risk
            claimRefs:
              - CE030
          - type: callout
            title: GDm-Health 是组合中临床验证最强的产品
            body: >
              GDm-Health 拥有 Huma 产品组合中质量最高的证据基础：与 Oxford University 共同开发，接受 RCT 评估，并部署到超过 50% 的英国妊娠糖尿病患者。
              该产品是临床结果影响主张的锚点，也应成为尽调时评估平台更广泛证据质量主张的参照。
            calloutType: insight
