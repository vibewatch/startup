  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Huma Therapeutics 处在临床级远程患者监测（RPM）、虚拟照护交付和医疗器械软件（SaMD）的交汇处； SaMD
              是更广义数字健康软件市场的一个子细分。公司主要服务的市场是面向健康系统、生命科学公司和政府授权的、 疾病无关、可配置 SaMD。这不同于狭窄的单适应症 RPM 设备（如心脏贴片）、消费者健康应用和 EHR 平台；
              这些都不属于 Huma 的直接竞争空间。

              广义数字健康市场涵盖用数字方式支持诊断、治疗、监测和照护交付的软件、硬件和服务。其中，RPM 软件层 （区别于 RPM 硬件）是 Huma
              的主要可服务机会。Hospital-at-Home（HaH）——通过远程监测在患者家中交付急性和急性后期照护——
              是结构性重要的子市场，英国、美国和德国的国家健康系统都在积极扩张。去中心化临床试验（DCT）构成第二个高价值邻近市场， Huma 的 Alcedis 子公司在其中直接竞争。

              现状替代方案仍是在院门诊、床旁监测设备（传统强化监测），以及纸质或人工临床试验数据收集。监管分类在这个空间尤其关键： 承载预测性 AI/ML 算法的 SaMD 在美国、英国和欧盟被归为 Class II
              或更高，形成结构性壁垒， 把认证平台与通用数字健康软件供应商区分开。

              欧盟医疗器械法规（EU MDR）2021 年 5 月生效并在 2024 年全面执行，提高了 SaMD 平台分类要求， 迫使准备不足的供应商退出或下调主张。这种监管驱动的出清给 Huma 形成供给侧顺风；其 EU
              MDR Class IIb 认证于 2023 年 3 月取得。NHS England 的虚拟病房项目要求技术支持的远程监测，也进一步为英国认证 SaMD 平台定义出一个锁定采购渠道。
