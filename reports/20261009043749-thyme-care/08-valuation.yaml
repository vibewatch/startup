callouts:
  - calloutType: "recommendation"
    title: "Price-sensitive conclusion"
    body: "A credible company can still be an unattractive investment at the wrong price. The retained evidence supports continued diligence, not a buy at the latest private mark."
    claimRefs:
      - "CV011"
      - "CV016"
  - calloutType: "risk"
