      - "Argument"
      - "Current evidence"
      - "What would change the view"
    rows:
      - - "Thesis"
        - "Scale can support payer relevance and operating leverage."
        - "Company-issued evidence cites >10.5M available lives and >$7B of oncology spend."
        - "Independent confirmation of retained contracts, realized savings, and durable margins."
      - - "Thesis"
        - "The business may already fund growth internally."
        - "The company claims profitability and meaningful positive free cash flow."
        - "Audited statements confirming cash conversion and excluding financing inflows."
      - - "Anti-thesis"
        - "The entry price embeds substantial growth before core economics are visible."
        - "The >$2B mark exceeds 16x independently reported 2025 revenue."
        - "A lower entry price or audited growth, margin, and retention sufficient to support the premium."
      - - "Anti-thesis"
        - "New adjacent businesses could dilute management focus and capital."
        - "Thyme Companies is developing biosimilar-adoption and trial-accrual businesses."
        - "Ring-fenced financing, dedicated leadership, and independently verified unit economics."
    notes: "Company-issued operating statements are identified as claims rather than independently verified outcomes; change conditions are diligence thresholds, not forecasts."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV011"
      - "CV013"
      - "CV014"
  - id: "TV003"
    title: "Bull, Base, and Bear Evidence Scenarios"
    columns:
      - "Scenario"
      - "Explicit assumptions"
      - "Valuation / return logic"
      - "Probability signal"
      - "Key downside trigger"
    rows:
      - - "Bull"
        - "Audited growth and cash generation validate the company claims; adjacencies are separately financed."
        - "Current >$2B mark may be defensible, but no higher range or target return is supportable from assigned public evidence."
        - "Rises with audited margins, retention, and cash conversion."
        - "Evidence fails to confirm positive free cash flow."
      - - "Base"
        - "Core navigation scales, while retention, concentration, and preference terms remain only partly disclosed."
        - "Fair-value range remains indeterminate; require a discount or contractual protection before entry."
        - "Most consistent with the current mixed evidence."
        - "Material payer non-renewal or renewed external-capital dependence."
      - - "Bear"
        - "Growth slows, adjacencies consume capital, or financing preferences amplify common-equity downside."
        - "A down round below the >$2B Series E mark is plausible, but no precise floor is supportable."
        - "Rises with cash burn, concentration, or delayed adjacent-business proof."
        - "Down round, adverse preference waterfall, or core-business dilution."
    notes: "No probabilities, terminal multiples, or valuation ranges are quantified because the assigned evidence lacks audited forecasts, net debt, ownership, preferences, and exit comparability."
    claimRefs:
      - "CV002"
      - "CV005"
      - "CV006"
      - "CV010"
      - "CV011"
      - "CV013"
      - "CV014"
      - "CV016"
