company:
  name: "Thyme Care"
chapter:
  number: 8
  title: "Valuation"
  summary: "Thyme Care's September 2026 Series E established a disclosed valuation above $2B after raising more than $125M, but the assigned public evidence does not disclose audited financials, preference terms, or a defensible exit model. The appropriate stance is track / research-more with medium-low confidence, high risk, and a stretched valuation rather than a price-insensitive buy."
sections:
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and Entry Discipline"
    body: >-
      The recommendation is track / research-more, with medium-low confidence, a high risk
      rating, and a stretched valuation stance. The September 2026 financing supplies a real
      price anchor above $2B, while an independent article reports $125M of 2025 revenue and
      attributes profitability and positive free cash flow to the company. Those figures imply
      a price-to-reported-revenue ratio above 16x, not an enterprise-value multiple, because net
      debt, cash, and fully diluted capitalization are not disclosed in the retained evidence.
      Entry discipline should therefore be conditional: do not underwrite a target return, hold
      period, or exit value until audited revenue quality, contract retention, cash conversion,
      and liquidation preferences are available. Strategic investor participation is encouraging,
      but it does not establish that the Series E price offers an adequate risk-adjusted return.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV005"
      - "CV006"
      - "CV010"
      - "CV011"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-context-and-data-quality"
    title: "Financing Context and Data Quality"
    body: >-
      The latest round was reported as more than $125M and valued Thyme Care above $2B. That
      follows a $97M Series D in September 2025 at more than $1B, so the headline valuation
      approximately doubled in under a year. Multiples also charts a rise from $181M at the
      August 2023 Series B to $2B in September 2026. The cumulative-capital record is materially
      less settled: three databases report $359M across five rounds, $399M across six rounds,
      and $400M across seven rounds. The divergence may reflect debt, round-counting, or update
      conventions, but the assigned evidence does not reconcile it. The same sources omit the
      fully diluted share count, cash and debt at close, liquidation stack, anti-dilution rights,
      and secondary components. These are valuation inputs, not clerical details, and remain
      mandatory diligence items.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
  - id: "thesis-antithesis-and-scenarios"
    title: "Thesis, Anti-Thesis, and Scenario Boundaries"
    body: >-
      The thesis is that a scaled oncology-navigation platform can convert payer alignment and
      operating leverage into durable cash generation. The company says it is profitable and
      free-cash-flow positive, and its financing release says services are available to more than
      10.5 million people while it manages more than $7B of oncology spend. The anti-thesis is
      that investors are paying a software-like growth price for a care-management and navigation
      model whose audited margins, retention, concentration, and risk-contract economics are not
      public in the assigned evidence. Thyme Companies adds a second execution question: the
      financing funds businesses in biosimilar adoption and clinical-trial accrual, while an
      independent article explicitly questions whether those spinouts can avoid diluting the core.
      Bull, base, and bear cases can therefore be defined by evidence milestones and downside
      triggers, but precise probability weights or terminal values would be false precision.
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV002"
      - "TV003"
  - id: "comparables-exit-readiness-and-diligence"
    title: "Comparables, Exit Readiness, and Final Diligence"
    body: >-
      The available comparable set is an orientation tool, not an independent valuation
      benchmark. Multiples places public insurers, value-based-care companies, and private
      navigation businesses in one list, with disclosed revenue multiples ranging from 0.1x for
      Molina to 13.7x for Garner. The spread demonstrates model and maturity differences rather
      than supporting a single multiple for Thyme Care. Exit readiness is similarly unproven:
      no retained source provides audited segment economics, an IPO timetable, likely acquirers,
      or a preference waterfall. Final diligence should obtain audited 2025 and year-to-date 2026
      financials, payer-level retention and concentration, risk-contract settlement history,
      cap-table and preference terms, debt and cash at close, and board-approved separation rules
      for Thyme Companies. Thesis-break triggers are a down round, renewed cash burn, material
      payer non-renewal, or adjacent ventures consuming capital without independently verified
      economics.
    claimRefs:
      - "CV010"
      - "CV014"
      - "CV015"
      - "CV016"
