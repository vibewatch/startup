evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited revenue, gross margin, operating loss or income, cash balance, cash flow, burn, runway, and cohort-level
      unit economics.
    whyItMatters: >-
      Funding raised is not cash available, and company assertions about scale cannot establish financial quality or
      durability.
    diligencePath: >-
      Request audited 2024-2025 statements, 2026 year-to-date management accounts, bank statements, debt schedules, and
      cohort contribution margins.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent legal, regulatory, cybersecurity, outage, and clinical-incident records covering the company and its
      affiliated professional entities.
    whyItMatters: >-
      The assigned adverse query retained no result, but absence from this pool does not prove that no material incident
      exists.
    diligencePath: >-
      Run entity-specific federal and state court, regulator, licensing-board, breach-notification, and payer-dispute
      searches before investment.
    relatedQuestionRefs:
      - QO010
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Current post-Series E board roster, committee structure, executive employment terms, and founder or investor
      voting rights.
    whyItMatters: >-
      Public executive announcements do not establish board control, reserved matters, succession protections, or
      key-person exposure.
    diligencePath: >-
      Request the current organization chart, board minutes, charter documents, voting agreements, and executive
      employment and equity documents.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: capitalization
    missingEvidence: >-
      Certified fully diluted cap table, share-class rights, liquidation preferences, debt balance, secondary
      transactions, and investor ownership percentages.
    whyItMatters: >-
      Named financing participants do not establish economic ownership, control, preference overhang, or current
      liquidity.
    diligencePath: >-
      Obtain the certified post-Series E cap table, stock-purchase documents, investor-rights agreements, debt facility,
      and secondary-sale ledger.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: buyer-retention-and-concentration
    missingEvidence: >-
      Audited retention data including net revenue retention (NRR), gross revenue retention (GRR), logo churn, and
      contract duration across Medicare Advantage, provider, and employer cohorts.
    whyItMatters: >-
      Without segmented retention and concentration metrics, valuation models cannot determine whether platform revenue
      is defensibly recurring or vulnerable to partner renegotiation.
    diligencePath: >-
      Request customer cohort retention schedules and top-10 customer revenue concentration tables under confidential
      diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: independent-outcomes
    missingEvidence: >-
      Peer-reviewed or third-party actuarial audit data evaluating Thyme Care's claimed 5-10% total cost of care
      reduction against matched control groups across multiple payer cohorts.
    whyItMatters: >-
      Without independent verification, payers and investors cannot confirm whether acute-care cost reductions persist
      across diverse oncology patient populations or reflect selection bias.
    diligencePath: >-
      Request blinded third-party actuarial reconciliation reports and Medicare Advantage risk adjustment data from
      anchor payer partners (Humana, CVS/Aetna).
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: minor
    topic: competitor-contracting
    missingEvidence: Contract terms, PMPM rates, and shared-savings split percentages for direct peers like Daymark Health.
    whyItMatters: >-
      Prevents precise comparison of net margin retention and customer switching barriers across competing oncology
      navigation vendors.
    diligencePath: >-
      Conduct payer procurement reference calls to review RFP evaluations and pricing structures in competitive oncology
      carve-out bids.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-margin
    missingEvidence: >-
      Audited GAAP income statement, cost of goods sold (COGS) care team labor breakdown, gross margin percentage, and
      cash burn schedule
    whyItMatters: >-
      Gross margin determines whether navigation can scale profitably as membership expands across all 50 states or
      whether clinical labor costs dilute earnings
    diligencePath: Request audited 2024-2025 financial statements and management P&L breakdown during private diligence
    relatedQuestionRefs:
      - QI003
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: contract-retention-and-nrr
    missingEvidence: >-
      Payer contract renewal histories, net revenue retention (NRR), gross revenue retention (GRR), and logo retention
      rates across commercial and MA plans
    whyItMatters: >-
      Validates whether commercial revenue growth is driven by expanding scope within existing anchor payers or
      continuous new logo acquisition
    diligencePath: Obtain cohort-level retention data and payer contract amendment schedules in virtual data room
    relatedQuestionRefs:
      - QI002
      - QI006
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: downside-risk-guarantees
    missingEvidence: >-
      Actuarial reconciliation terms, maximum downside loss caps, and performance guarantee reserves for value-based
      total-cost-of-care contracts
    whyItMatters: >-
      Catastrophic cancer drug spending or high inpatient utilization could trigger contractual deficit repayments that
      impair operational cash flow
    diligencePath: >-
      Inspect risk-sharing schedules and performance guarantee provisions across top three payer master services
      agreements
    relatedQuestionRefs:
      - QI001
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: ehr-integration-architecture
    missingEvidence: >-
      Technical documentation specifying standard interfaces (HL7, FHIR, direct API) used for bidirectional EHR
      integration with community oncology practices.
    whyItMatters: >-
      Bidirectional EHR integration determines the implementation friction and latency of patient identification and
      clinical data updates across partner clinics.
    diligencePath: >-
      Request integration specifications, supported EHR vendor certification lists (e.g., Epic, Flatiron OncoEMR), and
      average integration onboarding timelines during technical diligence.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: Audited payer-level cohort retention metrics, including NRR, GRR, and contract renewal rates.
    whyItMatters: >-
      Without formal cohort retention data, investors cannot verify whether revenue expansion is driven by recurring
      utilization or temporary pilot expansions.
    diligencePath: >-
      Request confidential payer contract schedules showing historical contract lengths, renewal clauses, and historical
      cohort NRR during management diligence.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: actuarial-reconciliation
    missingEvidence: >-
      Granular historical shared savings reconciliation data, downside risk loss caps, and corridor provisions across
      Humana, CVS Health, and Medicare Advantage contracts.
    whyItMatters: >-
      Without contract-level loss limits, investors cannot quantify potential cash liabilities if cancer drug
      expenditures or emergency admissions exceed actuarial baselines.
    diligencePath: >-
      Request standard risk contract templates, actuarial settlement memos for 2024–2025, and reinsurance / stop-loss
      policy limits during confidential management diligence.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: minor
    topic: mso-administrative-agreements
    missingEvidence: >-
      Complete Administrative Services Agreements (ASAs) between Thyme Care, LLC and affiliated physician entities
      (Thyme Care Medical, PLLC, Bobby Green Medical, P.C.).
    whyItMatters: >-
      Confirms management fee calculation methodology and validates that clinical physician autonomy satisfies stringent
      state Corporate Practice of Medicine and fee-splitting rules.
    diligencePath: >-
      Conduct legal diligence review of intercompany MSO agreements, physician employment contracts, and state corporate
      healthcare filings.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: exit-and-return-underwriting
    missingEvidence: >-
      Audited financials, net debt and cash, fully diluted ownership, liquidation preferences, retention, concentration,
      and an evidence-based exit path.
    whyItMatters: >-
      Without these inputs, a target return, hold period, exit valuation, and common-equity downside cannot be
      underwritten.
    diligencePath: >-
      Request audited 2025 and year-to-date 2026 financials, payer cohorts, cap table, preference waterfall, debt
      schedule, board materials, and management's exit-readiness plan.
    relatedQuestionRefs:
      - QV007
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A primary financing ledger reconciling the $359M, $399M, and $400M cumulative-funding totals and five-, six-, and
      seven-round counts.
    whyItMatters: The differences may change conclusions about debt usage, dilution, and capital efficiency.
    diligencePath: >-
      Reconcile signed financing documents, debt facilities, secondary transactions, and round-closing dates with the
      company and lead investors.
