    title: "Founder influence remains material"
    body: "The September 2026 transition separates operating leadership from founder-led expansion rather than removing founder dependence: Robin Shah remains executive chairman and Bobby Green remains president and chief medical officer."
    claimRefs:
      - "CO015"
