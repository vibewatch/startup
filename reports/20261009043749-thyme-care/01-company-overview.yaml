company:
  name: "Thyme Care"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Thyme Care is a Nashville-founded oncology care-management company that entered Series E in September 2026, when company-issued disclosures reported a round of more than $125 million at a valuation above $2 billion. The public record supports substantial scale and a recent founder-to-professional-CEO transition, but current audited financials, the post-Series E cap table, and independently verified adverse-event history remain unavailable."
sections:
  - id: "identity-and-operating-boundary"
    title: "Identity and Operating Boundary"
    body: "Thyme Care was founded in 2020 and is headquartered in Nashville, Tennessee. Its operating proposition is an oncology-focused platform for virtual care navigation, care coordination, analytics, and support between oncology visits. The legal boundary matters: Thyme Care's own disclosures say the management company supports affiliated professional entities and provides non-clinical services, while the affiliated provider entities deliver clinical cancer support. The same disclosures state that Thyme Care itself does not diagnose cancer, prescribe treatment, or replace the treating oncology team. Investors should therefore diligence both the technology-enabled navigation business and the professional-entity structure rather than treating the company as a single conventional provider."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "capital-and-scale"
    title: "Capital Formation and Reported Scale"
    body: "The financing record shows rapid late-stage expansion, but most current operating metrics are issuer supplied. Thyme Care reported a $97 million Series D and said that round brought total capital raised to $275 million. Tracxn separately records a $40 million conventional-debt transaction in July 2024 and total funding of $400 million across seven rounds after the September 2026 Series E. Company-issued Series E releases described more than $125 million of new financing, a valuation above $2 billion, 85,000 members at the end of 2025, a care team exceeding 500 people, and availability to more than 10.5 million people nationwide. These are scale indicators, not substitutes for audited revenue, cash, or unit-economics evidence."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance Transition"
    body: "A leadership reorganization became effective on September 1, 2026. Company releases identify Brad Diephuis as chief executive officer, co-founder Robin Shah as executive chairman focused on new business lines, co-founder Bobby Green as president and chief medical officer, and Marcia Macphearson as chief operating officer. This structure retains both founders in senior positions while shifting day-to-day leadership to an operator who joined Thyme Care in 2022. Public governance evidence is less current and less reliable than the executive announcement: Tracxn still labels Shah as the current CEO, demonstrating that third-party profiles can lag a fast-moving private-company reorganization. The post-Series E board composition and voting control require direct confirmation."
    claimRefs:
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO002"
  - id: "diligence-interpretation"
    title: "What Is Established and What Remains Open"
    body: "The strongest defensible overview is narrower than the headline growth narrative. Founding year, headquarters, legal service boundary, financing events, and the September 2026 executive transition are supported by the assigned evidence. However, the financing and scale disclosures are predominantly company-issued press releases, even when hosted by Morningstar, Yahoo Finance, or PR Newswire; those hosts do not convert the releases into independent reporting. The assigned adverse search returned no retained result, but that absence is not evidence that lawsuits, regulatory actions, outages, breaches, or clinical incidents have not occurred. Before an investment decision, diligence should obtain audited financial statements, a certified cap table, current board records, and independent legal and regulatory searches."
    claimRefs:
      - "CO003"
      - "CO008"
      - "CO009"
      - "CO011"
      - "CO014"
      - "CO016"
