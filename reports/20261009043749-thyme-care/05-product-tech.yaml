callouts:
  - calloutType: "insight"
    title: "Tech-Enabled Services vs. Pure Software Operating Realities"
    body: "While Thyme Care brands itself as a tech-native oncology platform, its operating model remains heavily dependent on human-in-the-loop care delivery. The company employs more than 600 Care Team personnel whose productivity is enhanced, but not replaced, by the Thyme Box application. Long-term gross margin expansion hinges on whether new AI initiatives and automation can dramatically increase the ratio of managed patients per care coordinator without eroding clinical support quality."
    claimRefs:
      - "CE002"
      - "CE008"
      - "CE010"
  - calloutType: "risk"
    title: "Clinical Scope Boundaries and Regulatory Exposure"
    body: "Thyme Care operates under a corporate practice of medicine (CPOM) structure wherein non-clinical navigation entities support separate professional medical corporations. Because Thyme Care disclaims providing direct medical diagnoses or altering chemotherapy regimens, technical workflows must enforce strict boundary controls to prevent care coordinators from providing unlicensed clinical guidance, maintaining defensible audit trails across all electronic communications."
    claimRefs:
      - "CE009"
      - "CE011"
