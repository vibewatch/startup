chapter:
  number: 5
  title: "Product & Technology"
  summary: "Thyme Care operates a hybrid oncology navigation platform anchored by its proprietary care management web application, Thyme Box, which coordinates over 600 clinical and non-clinical care team members across all 50 states. The technology stack combines Vue.js and TypeScript single-page front-ends with Python FastAPI and PostgreSQL back-ends on AWS, integrating electronic patient-reported outcomes (ePROs) and nascent LLM decision-support initiatives to manage oncology utilization and lower total cost of care."
sections:
  - id: "care-delivery-platform"
    title: "Care Delivery Platform and Navigation Workflow"
    body: "Thyme Care positions its product offering as a comprehensive value-based oncology care enablement platform that bridges health plans, community oncologists, employers, and cancer patients. In day-to-day workflow terms, the service delivers personalized, continuous navigation between clinic appointments, addressing symptoms, appointment logistics, transportation assistance, chemotherapy side effects, and social determinants of health. The primary clinical interface is Thyme Box, an internally built care management application that enables more than 600 distributed Care Team members—including oncology nurses, navigators, and resource specialists—to triage member touchpoints and manage interventions. Member interactions are captured through structured workflows and digital check-ins, notably electronic patient-reported outcomes (ePROs), which achieve a 72% proactive completion rate and support clinical triage to mitigate acute emergency department utilization."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE002"
  - id: "modular-architecture-and-operating-model"
    title: "Modular Architecture and Technical Stack"
    body: "Thyme Care's software platform is organized around modular web applications and back-end integration services engineered to ingest heterogeneous clinical data while keeping care coordinators focused on active member interventions. Front-end engineering relies primarily on Vue.js single-page applications authored in TypeScript, transitioning from legacy JavaScript patterns and providing interactive search, filtering, and activity categorization. The back-end architecture standardizes on Python services using the FastAPI framework running on relational PostgreSQL databases, containerized and deployed across Amazon Web Services (AWS) cloud infrastructure. A dedicated internal engineering CLI utility named Thymesaver automates local developer environment bootstrapping across PostgreSQL tools, AWS CLI, and language toolchains. For emerging zero-to-one product lines, the engineering team has established a New Initiatives group tasked with embedding large language model (LLM) decisioning, document comprehension, and automated guardrails into high-stakes oncology treatment workflows."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "clinical-governance-security-and-scaling-risks"
    title: "Clinical Governance, Enterprise Integration, and Technical Risks"
    body: "Because oncology navigation involves sensitive protected health information and high-consequence clinical trajectories, Thyme Care separates non-clinical care navigation from physician-directed medical treatment. Corporate entities provide management services to affiliated medical practices, including Thyme Care Medical, PLLC and Dr. Bobby Green Medical, P.C., while explicitly disclaiming direct cancer diagnosis or prescription authority. Programmatic design and economic evaluation are overseen by a cross-functional Clinical Innovation & Design group that benchmarks outcomes, member experience, and medical cost structure. Technical and operational risks center on the platform's heavy reliance on custom EHR and claims integrations across disparate payer and provider legacy environments, the latency and accuracy of asynchronous ePRO reporting, and the auditability of proposed automated LLM decisioning tools in regulated healthcare environments."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"
