    summary: 八个有证据支撑的里程碑，串起 Thyme Care 从成立到 2026 年融资及管理层重组的历程。
    data:
      items:
        - date: '2020'
          label: 公司成立
          detail: 公司及第三方简介证据认定 2020 年为成立年份。
          tone: neutral
          claimRefs:
            - CO001
        - date: '2024-07-24'
          label: 传统债务记录
          detail: Tracxn 记录了一笔 $40 million 的传统债务交易。
          tone: neutral
          claimRefs:
            - CO007
        - date: '2025-04-04'
          label: Series D 记录
          detail: Tracxn 将 $97 million 的 Series D 日期定为 2025 年 4 月 4 日。
          tone: positive
          claimRefs:
            - CO005
        - date: '2025-10-03'
          label: 公司报告累计融资
          detail: Thyme Care 的一篇帖子称，Series D 使累计融资总额达到 $275 million。
          tone: positive
          claimRefs:
            - CO006
        - date: '2025-12-31'
          label: 年末会员规模
          detail: 公司发布的公告称，截至 2025 年末，会员数为 85,000，照护团队超过 500 人。
          tone: positive
          claimRefs:
            - CO012
            - CO013
        - date: '2026-07-15'
          label: 管理层变动公告
          detail: Thyme Care 宣布创始人转任职业 CEO，并任命新的首席运营官。
          tone: neutral
          claimRefs:
            - CO015
        - date: '2026-09-01'
          label: CEO 交接生效
          detail: Brad Diephuis 出任 CEO，Robin Shah 转任执行董事长。
          tone: neutral
          claimRefs:
            - CO015
        - date: '2026-09-02'
          label: Series E 公告
          detail: 公司发布的公告称融资超过 $125 million，估值超过 $2 billion。
          tone: positive
          claimRefs:
            - CO008
            - CO009
    approximationNotes: 日期和金额均按指定证据复现；公司发布的公告不视为独立验证。
