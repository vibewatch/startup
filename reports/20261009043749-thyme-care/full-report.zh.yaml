      - number: '7.2'
        title: 运营可靠性、护理质量与临床安全控制
        blocks:
          - type: paragraph
            body: >-
              运营风险集中在 Thyme Care 经过肿瘤培训的 24/7
              护理团队、预测性风险分析和电子患者报告结局（ePRO）症状监测的可靠性上。在肿瘤治疗中，急性治疗毒性（如发热性中性粒细胞减少、严重脱水或免疫治疗相关不良事件）分诊延迟，可能迅速升级为重症监护入院或可避免的死亡。Thyme
              Care 高度依赖患者报告的症状更新，并指出 72% 的登记会员会通过 ePRO
              主动分享更新。如果数据接入、移动消息送达或算法患者风险分层失败，病情恶化的患者可能在脆弱的夜间或周末无人联系。为降低临床质量和标准化分诊风险，Thyme Care 于 2026 年 8 月获得为期 3 年的
              NCQA Case Management Accreditation 和 NCQA Population Health Program Accreditation。NCQA
              评估核实了规范化护理规划、患者监测、数据集成、员工执照、资质核验和保密流程。但在全部 50
              个州扩张并保持一致临床质量，会造成严重的临床人员依赖，使组织暴露于专业肿瘤护士流失、地域工资上涨以及区域登记激增期间的分诊瓶颈。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
