      - number: '7.3'
        title: 精算暴露、下行保证与战略伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Thyme Care 的财务可持续性和商业耐久性，直接取决于两个相互关联的因素：价值型合同表现和战略伙伴匹配。公司管理着归属于 135,000 名风险会员的超过 $7 billion
              年度肿瘤支出。商业合同下，支付方提供预付管理费，但 Thyme Care
              保证先产生等于该费用加约定增量节省门槛的成本降低，才能参与共享节省池。由于肿瘤支出很大程度由新型免疫疗法、靶向生物制剂和不可预测的住院驱动，精算误算或不利患者选择可能迫使 Thyme Care
              吸收绩效结算缺口。交易对手集中进一步放大这一风险。战略投资人和核心商业伙伴包括全国性支付方 Humana、CVS Health（Aetna）和 Morgan Health，以及代表超过 400
              名肿瘤医生的社区医疗服务提供方网络 Thyme Care Oncology Partners（TCOP）。如果大型全国性支付方改变肿瘤福利设计，或社区肿瘤医生拒绝价值型生物类似药替代路径，Thyme Care
              将同时面临业务量流失和共享节省利润率压缩。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
