      - number: '7.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 肿瘤医疗总成本中的下行精算保证
            body: >-
              不同于采用非风险按服务收费模式的纯软件导航方，              Thyme Care 主动承担 135,000 名会员的医疗总成本风险。支付方发放预付管理费，Thyme Care
              保证靠降低医疗总支出收回这些费用。风险分层失败或高价药物使用增加，都会直接威胁现金流，因此成熟的精算监督是关键的生存能力。
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
          - type: callout
            title: 战略支付方兼任投资人：匹配与双重代理治理
            body: >-
              Humana、CVS Health Ventures 和 Morgan Health 参与 Thyme Care 的 Series E，使其能够在 10.5 million
              名承保人群中获得前所未有的分发规模。但这也造成双重代理暴露：公司最大的股权持有人同时也是主要商业客户，可能使合同定价重谈和共享节省争议解决变得复杂。
            calloutType: insight
            claimRefs:
              - CR009
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议为继续跟踪 / 继续研究，信心中低，风险评级高，估值偏高。2026 年 9 月融资提供了一个超过 $2B 的真实价格锚点，而一篇独立文章披露 2025 年收入为
              $125M，并将盈利和正自由现金流归因于公司。这些数字意味着披露收入对应的价格倍数超过
              16x，而不是企业价值倍数，因为保留证据没有披露净债务、现金和完全稀释后资本结构。因此，入场纪律应当有条件：在获得经审计的收入质量、合同留存、现金转化和清算优先权前，不要承诺目标回报、持有期或退出价值。战略投资人参与令人鼓舞，但不能证明
              Series E 价格提供了足够的风险调整后回报。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV010
              - CV011
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV010
              - CV014
              - CV016
      - number: '8.2'
        title: 融资背景与数据质量
        blocks:
          - type: paragraph
            body: >-
              最新一轮融资披露超过 $125M，并将 Thyme Care 估值定在 $2B 以上。此前公司于 2025 年 9 月以超过 $1B 估值完成 $97M Series D，因此 headline
              估值在不到一年内大约翻倍。Multiples 还记录了估值从 2023 年 8 月 Series B 的 $181M 上升到 2026 年 9 月的 $2B。累计资本记录则明显未统一：三家数据库分别报告五轮融资
              $359M、六轮 $399M 和七轮
              $400M。这一差异可能来自债务、轮次计算或更新口径，但指定证据没有协调出答案。同一批来源还缺少完全稀释后的股数、交割时现金和债务、清算顺位、反稀释权利以及二级交易成分。这些是估值输入，不是文书细节，仍是必须完成的尽调项目。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 投资论点、反论点与情景边界
        blocks:
          - type: paragraph
            body: >-
              投资论点是，规模化肿瘤导航平台可以把支付方匹配和运营杠杆转化为持久的现金生成。公司称自己已盈利并产生正自由现金流，融资公告称服务覆盖超过 10.5 million 人，同时管理超过 $7B
              的肿瘤支出。反论点是，投资人正在为一个护理管理和导航模式支付类似软件的增长价格，而指定证据没有公开其经审计的利润率、留存、集中度和风险合同经济性。Thyme Companies
              又带来第二个执行问题：融资投向生物类似药采用和临床试验入组业务，而一篇独立文章明确质疑这些剥离业务能否避免稀释核心业务。因此，牛市、基准和熊市情景可以由证据里程碑与下行触发条件界定，但给出精确概率权重或终值会制造虚假精确。
            claimRefs:
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 可比公司、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              现有可比公司集合只能用于定位，不能作为独立估值基准。Multiples 将上市保险公司、价值型医疗公司和私有导航企业列在同一张表中，披露收入倍数从 Molina 的 0.1x 到 Garner 的 13.7x
              不等。这个区间体现的是模式和成熟度差异，并不支持为 Thyme Care 选定单一倍数。退出准备度同样未经证明：保留来源没有提供经审计的分部经济性、IPO 时间表、可能的收购方或优先权瀑布。最终尽调应取得
              2025 年经审计财务报表和 2026 年年初至今财务数据、支付方层面的留存与集中度、风险合同结算历史、资本表与优先权条款、交割时债务和现金，以及 Thyme Companies
              经董事会批准的分拆规则。投资论点被打破的触发条件包括低价轮、现金消耗重新出现、重要支付方不续约，或相邻业务在缺乏独立验证经济性的情况下持续消耗资本。
            claimRefs:
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 一家可信的公司仍可能因为价格不对而成为糟糕的投资。保留证据支持继续尽调，而不是在最新私有市场估值上买入。
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV016
          - type: callout
            title: 不要把融资等同于流动性
            body: E 轮融资金额是筹得的资本，不等于已核实可用的现金；保留的证据未披露交割后现金、债务、消耗或现金跑道。
            calloutType: risk
            claimRefs:
              - CV001
              - CV010
