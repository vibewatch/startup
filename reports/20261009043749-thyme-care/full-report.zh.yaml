      - number: '3.3'
        title: 护城河耐久性、在位者反应与下行风险
        blocks:
          - type: paragraph
            body: >-
              Thyme Care 的竞争耐久性依赖社区肿瘤医生网络密度和多年期风险承担型支付方关系。截至 2025 年底，公司已与大型健康计划中的超过 1,400 名肿瘤医生合作，会员数超过
              85,000；一旦护理导航工作流和数据接口深度嵌入合作方诊所，就会形成运营切换成本。不过，结构性脆弱性仍然存在。独立行业分析指出，Thyme Care 的增长模式对交易和政策高度敏感，扩张取决于 Medicare
              Advantage 年度周期和商业福利设计窗口。此外，关键急性护理节省指标和结果主要仍由公司披露，而非经独立随机试验验证，因此健康计划精算团队会持续审视 Thyme
              Care。当大型全国性健康计划探索内部护理管理能力、区域医疗服务提供方评估内部护理协调人员配置时，Thyme Care 必须持续证明其共享节省收益超过外部供应商整合带来的摩擦和行政开销。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
