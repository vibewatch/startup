      - 论点
      - 当前证据
      - 会改变判断的因素
    rows:
      - - 正方
        - 规模可以支撑付款方重要性和运营杠杆。
        - 公司发布的证据称可触达受保人超过 1,050 万，肿瘤支出超过 $7B。
        - 独立确认留存合同、已实现节省及可持续利润率。
      - - 正方
        - 业务可能已经能够靠自身为增长融资。
        - 公司声称已实现盈利并拥有可观的正自由现金流。
        - 经审计报表确认现金转换，并剔除融资流入。
      - - 反方
        - 核心经济性尚未显现，进入价格却已计入大幅增长。
        - '>$2B 估值标记超过独立报道的 2025 年收入的 16 倍。'
        - 更低的进入价格，或经审计且足以支撑溢价的增长、利润率和留存。
      - - 反方
        - 新的相邻业务可能分散管理层注意力并稀释资本。
        - Thyme Companies 正在开发生物类似药采用及试验入组业务。
        - 隔离使用的融资、专职领导团队及经独立验证的单位经济性。
    notes: 公司发布的运营陈述被标记为主张，而非独立验证的结果；改变判断的条件是尽调门槛，不是预测。
