              Thyme Care 的成本结构主要由专业临床劳动力和高接触护理协调构成，而不是软件托管开销 [CI005, CI006]。服务交付依靠由医疗主任、注册护士、社会工作者和护理伙伴组成的肿瘤专业 Care
              Team，提供 24/7 覆盖 [CI006]。临床工作流使用专有算法分诊工具和自动化电子患者报告结局评估，使急诊就诊相对风险降低 28%，再入院减少 30%
              [CI006]。这些干预带来可验证的节省，但也产生随登记活跃患者数量增长的固定和半可变运营费用 [CI005, CI008]。因此，毛利率受到临床人员配置比、临床人员工资上涨以及社区肿瘤诊所技术整合摩擦的限制
              [CI008, CI009]。经审计的财务报表、准确毛利率和客户获取回收周期仍是未披露的私有数据点 [CI009, CI010]。
