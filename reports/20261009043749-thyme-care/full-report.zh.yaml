            body: >-
              Thyme Care 的收入主要来自与价值型肿瘤安排绑定的两类商业机制：预付的经常性行政管理费，以及与绩效挂钩的共享节省分配 [CI001, CI002]。公司直接与商业保险公司、Humana 等
              Medicare Advantage 健康计划以及 CVS Health Ventures 的健康计划关联方签约 [CI003, CI004]。在这些人群协议下，Thyme Care
              为已登记的癌症会员协调护理，承担患者两次肿瘤就诊之间的导航运营和临床责任 [CI002, CI005]。预付行政管理费为 500 人的多学科 Care Team
