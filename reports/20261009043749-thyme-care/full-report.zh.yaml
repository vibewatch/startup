  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别范围与现状替代方案
        blocks:
          - type: paragraph
            body: >
              肿瘤护理导航和价值型肿瘤服务市场，针对的是美国癌症治疗中严重的临床碎片化、行政摩擦和失控支出。根据 National Cancer Institute
              基准，癌症是美国医疗支出中规模最大、增长最快的驱动因素之一，每年成本超过 $200 billion [CM004]。癌症总支出高度集中在全身治疗上——药物方案通常每名患者每年超过
              $200,000，占单次治疗总成本最高达 70% [CM005]——同时还包括未妥善管理治疗毒性导致的急诊就诊和住院 [CM006]。

              在更广泛的肿瘤支出格局中，专业肿瘤导航平台的可服务市场聚焦急性医疗支出、非临床障碍解决和可避免的住院成本，而不是普通肿瘤药物采购或外科设施费用
              [CM001]。传统现状方案主要依赖交易型健康计划事先授权、被动的护士分诊热线，或缺乏风险匹配激励且彼此未协调的医院癌症中心导航员 [CM002]。相比之下，技术赋能的协同护理模式配置多学科护理团队，提供
              24/7 连续导航、电子患者报告结局监测（ePROs），并与社区肿瘤诊所紧密衔接 [CM001,
              CM003]。导航模式把临床协调和社会决定因素支持嵌入两次就诊之间，旨在减少可避免的急性医疗使用，同时帮助患者坚持最佳治疗方案 [CM007]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与 SOM 拆解
        blocks:
          - type: paragraph
            body: >
              评估肿瘤导航和价值型管理市场，需要从全国疾病发生率、可管理医疗总支出和可寻址风险分成费用三个不同视角衡量。在宏观边界上，全国肿瘤支出池每年超过 $200 billion，预计 2026 年美国新增癌症患者超过 2
              million [CM004, CM008]。这一顶层支出界定了肿瘤成本控制和护理改善方案更广义的理论总可寻址市场（TAM）。

              可服务可寻址市场（SAM）把这笔总支出收窄到风险承担框架内的活跃肿瘤支出，包括 Medicare Advantage 计划、承担委托风险的初级医疗组织和自保型商业雇主 [CM009, CM010]。由于超过
              50% 的癌症患者会在积极治疗的前六个月内因化疗住院 [CM006]，风险承担主体会主动寻找专业合作方以减少急性住院。Thyme Care 已将活跃平台覆盖范围扩展至全国超过 10.5 million
              名符合条件的承保人群，覆盖全部 50 个州，并依据风险承担和价值型合同管理超过 $7 billion 的肿瘤医疗支出 [CM011]。

              可服务可获得市场（SOM）代表从这笔管理支出产生的可寻址净费用和共享节省机会。在风险承担合作结构下，导航平台通过行政管理费、按会员按月（PMPM）安排，以及经验证的医疗总成本降低所带来的共享节省来获得收入
              [CM009, CM012]。已发表评估显示，急性护理支出可降低 15% 至 20%，每名接受导航的患者平均每月净节省 $594，其中主要来自住院支出每月减少 $421 [CM013,
              CM014]。经验证的医疗总成本降低幅度为 5% 至 10%，为支付方和医疗服务提供方伙伴带来可观的经常性经济价值 [CM011, CM012]。
            claimRefs:
              - CM004
              - CM006
              - CM008
