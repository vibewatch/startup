    title: 乐观、基准与悲观证据情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键下行触发因素
    rows:
      - - 乐观
        - 经审计的增长与现金创造验证公司主张；相邻业务单独融资。
        - 当前 >$2B 估值标记或许站得住，但现有公共证据不足以支持更高区间或目标回报。
        - 随经审计的利润率、留存及现金转换得到验证而上升。
        - 证据无法确认正自由现金流。
      - - 基准
        - 核心导航业务扩大规模，但留存、集中度及优先权条款仍仅部分披露。
        - 公允价值区间仍无法确定；进入前需要折价或合同保护。
        - 与当前混杂的证据最为一致。
        - 重要付款方不续约，或再次依赖外部资本。
      - - 悲观
        - 增长放缓、相邻业务消耗资本，或融资优先权放大普通股下行风险。
        - 低于 >$2B Series E 估值标记的下轮融资是可能的，但无法支持精确底价。
        - 随现金消耗、集中度上升或相邻业务验证延迟而上升。
        - 下轮融资、不利的优先权瀑布，或核心业务被稀释。
    notes: 由于指定证据缺少经审计预测、净债务、所有权、优先权及退出可比性，因此未量化概率、终值倍数或估值区间。
