              Thyme Care 于 2020 年成立，总部位于田纳西州纳什维尔。公司的运营定位是一个聚焦肿瘤的虚拟护理导航、护理协调、分析和就诊间支持平台。法律边界很重要：Thyme Care
              自己披露，管理公司为关联专业实体提供支持并提供非临床服务，而关联医疗服务实体负责临床癌症支持。同一披露还说明，Thyme Care
