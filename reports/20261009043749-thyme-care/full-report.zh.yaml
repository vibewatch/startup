        title: 监管、法律与医疗法人执业治理
        blocks:
          - type: paragraph
            body: >-
              Thyme Care
              处在医疗导航、远程医疗和专业医疗执业的复杂交叉地带。主要结构性暴露来自各州医疗法人执业（CPOM）规则和禁止分拆收费的规定。在加利福尼亚、纽约和得克萨斯等州的标准医疗监管框架下，非医生商业实体不得行医或控制临床决策。Thyme
              Care 正式将运营分开：Thyme Care, LLC 提供非临床管理支持、技术和导航；关联专业实体包括 Thyme Care Medical, PLLC、Bobby Green Medical,
              P.C.、Thyme Care CA PC、Thyme Care KS PA 和 Thyme Care GA, P.C.。公司正式披露明确表示，Thyme Care Providers 提供临床癌症支持服务，而
              Thyme Care, LLC 提供不包含医疗护理、临床诊断或治疗建议的非临床护理管理和导航项目。即便如此，监管审计或各州对管理服务组织（MSO）执法变化，仍可能挑战护理协调与临床诊断之间的边界。此外，平台处理
              10.5 million 名符合条件人群的敏感癌症患者记录，因此受到严格的 HIPAA
              隐私与安全要求、健康信息交换义务及第三方数据合规要求约束；任何安全失败或未经授权披露受保护健康信息，都可能带来联邦法定处罚并损害企业客户信任。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
