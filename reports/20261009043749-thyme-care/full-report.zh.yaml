      - number: '2.3'
        title: 买方分层、预算归属与采用经济学
        blocks:
          - type: paragraph
            body: >
              专业肿瘤导航平台的采用由三个主要买方群体推动，它们的经济动机各不相同：Medicare Advantage 健康计划、承担委托风险的医疗服务提供方集团，以及自保型企业雇主 [CM009,
              CM010]。Medicare Advantage 计划面临复杂癌症人群带来的严重医疗损失率（MLR）波动，以及 CMS Enhancing Oncology Model（EOM）等价值型模式的监管压力
              [CM010, CM015]。这些支付方与导航合作伙伴合作，以减少急诊使用、改善质量评分，并在不激化社区肿瘤医生矛盾的前提下锁定可预测的医疗支出 [CM001, CM002]。

              Oak Street Health 等承担委托风险的医疗服务提供方集团，是承担 Medicare Advantage 计划全部或部分下行风险的关键客户群
              [CM009]。患者进入复杂肿瘤治疗方案后，初级医疗提供方往往会失去运营和临床可见性，从而增加心力衰竭或糖尿病等基础合并症恶化的风险 [CM006,
              CM009]。价值型肿瘤导航员连接社区肿瘤医生和初级医疗医生之间的信息断点，确保整体临床协调 [CM001,
              CM009]。与此同时，自保型雇主将癌症视为主要医疗成本驱动因素，且年度成本增幅达到两位数，因此加快商业签约以减少急性住院并支持员工留任 [CM008, CM016]。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM008
              - CM009
              - CM010
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM015
              - CM016
      - number: '2.4'
        title: 采用驱动因素、监管催化剂与增长约束
        blocks:
          - type: paragraph
            body: >
              价值型肿瘤导航的采用既受强劲宏观顺风推动，也受到持续的结构性约束。首要增长驱动因素是全国向风险承担支付模式迁移，而 CMS 包括 Enhancing Oncology
              Model（EOM）在内的政策举措进一步强化了这一趋势 [CM015]。同时，高免赔额计划和药品共付额加剧了肿瘤患者的严重财务毒性，推动市场迫切需要覆盖交通、营养和经济援助的非临床导航服务 [CM007,
              CM016]。

              但显著的市场约束决定了部署速度。整合导航平台需要与不同社区肿瘤机构的电子健康记录（EHR）深度互操作，并协调独立的肿瘤诊所 [CM002,
              CM003]。如果导航被认为会增加行政负担或干扰临床自主权，肿瘤诊所往往会抵制第三方介入 [CM002,
              CM003]。此外，从共享节省的上行安排转向全面的双向下行风险，需要成熟的精算基准和资本储备，给新兴进入者带来运营障碍 [CM009, CM012]。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM009
              - CM012
              - CM015
              - CM016
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 减少急性护理支出是主要价值驱动因素
            body: 价值型肿瘤导航的核心经济引擎是减少住院，而不是限制化疗。已发表评估显示，会员每月总节省的 71%（$421 / $594）直接来自避免住院，证明持续症状跟踪和主动分诊能够为风险承担型支付方带来可量化的投资回报。
            calloutType: insight
            claimRefs:
              - CM013
              - CM014
          - type: callout
            title: 下行风险与精算基准波动
            body: 承担双向下行风险可以让支付激励与临床结果对齐，但也带来精算脆弱性。由于小规模肿瘤患者群体也可能出现极端异常支出，价值型肿瘤平台需要稳健的风险走廊保护、准确基准以及充足的资产负债表流动性，以吸收意外的急性医疗波动。
            calloutType: risk
            claimRefs:
              - CM009
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 肿瘤导航格局与直接竞争梯队
        blocks:
          - type: paragraph
            body: >-
              肿瘤护理协调和导航的竞争格局覆盖专业价值型导航平台、诊所级肿瘤 EHR 和患者参与软件、多元化护理管理老牌厂商以及健康计划内部项目。直接获得风险投资支持的肿瘤导航竞争者包括 Daymark
              Health（早期聚焦症状管理和导航，并已完成 Series A）以及 Navigating Cancer（聚焦患者门户和诊所分诊）。与此同时，Carevive、Cordata Healthcare
              Innovations 和 Noona 等传统护理协调供应商过去主要面向医疗服务提供方的工作流自动化，并不承担下游下行风险或双向价值分成风险。Thyme Care
              通过把多学科临床支持团队、集成技术和与大型健康计划签订的双边风险分成合同结合起来，形成差异化定位。不过，医疗服务机构仍需持续权衡，是采用 Thyme Care
              这样的集成外部伙伴，还是依靠诊所内部人员或支付方赞助的护理管理人员。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 能力架构、定价模式与市场差异化
        blocks:
          - type: paragraph
            body: >-
              肿瘤导航的差异化取决于三个核心运营支柱：EHR 融入肿瘤医生工作流的深度、使用持证临床人员还是纯软件工具，以及通过风险型合同对齐经济激励。Navigating Cancer 和 Carevive
              等工作流供应商按按服务收费或 SaaS 订阅模式向肿瘤诊所授权软件门户，而 Thyme Care 采用混合模式，让技术平台与超过 500
              名临床专家、肿瘤护士和社会工作者组成的多学科护理团队并行运行。其护理管理服务与 Thyme Care Signal 等软件工具结合，接入 EHR 工作流并提供患者分析。Thyme Care 主要通过与
              Medicare Advantage 和商业健康计划签订价值型绩效协议运营，目标是让急诊和住院减少 15% 至 20%。相比之下，Daymark Health
              等专业进入者累计融资少得多（$37.6M），区域覆盖也更集中。
