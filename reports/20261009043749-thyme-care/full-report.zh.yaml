  - id: FM001
    title: 按价值计费的肿瘤市场规模层级
    type: pyramid
    summary: 将市场机会从全国肿瘤总支出逐层拆解至可触达的共享节省费经济性。
    data:
      nodes:
        - label: 美国肿瘤医疗总支出（TAM）
          detail: 全国年度癌症支出超过 $200B，覆盖全国超过 200 万名新诊断患者。
          tone: neutral
        - label: 全身治疗与化疗支出层
          detail: 占阶段性癌症总支出的最高 70%；先进治疗方案的人均年费用超过 $200,000。
          tone: neutral
        - label: 住院与急性医疗利用支出层
          detail: 住院及急诊照护中，超过 50% 的化疗患者在 6 个月内经历急性住院。
          tone: warning
        - label: 合同平台可触达支出（SAM）
          detail: 在全部 50 个州、超过 10.5M 名符合条件的受保人中管理超过 $7B 的活跃肿瘤支出。
          tone: positive
        - label: 可管理的急性支出节省机会
          detail: 目标是将急性照护支出降低 15% 至 20%，主要由每位患者每月 $421 的住院节省驱动。
          tone: positive
        - label: 净共享节省与价值捕获（SOM）
          detail: 经验证的总照护成本降低 5% 至 10%，每名接受导航的会员平均每月带来 $594 净节省。
          tone: positive
    approximationNotes: 源自 National Cancer Institute 支出估算、已发布的 ASCO Quality Care 评估及公司合同披露。
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM011
      - CM012
      - CM013
      - CM014
  - id: FP001
    title: 竞争定位矩阵：经济风险匹配度 vs. 临床交付深度
    type: quadrant
    summary: 将肿瘤导航替代方案按临床交付深度与经济风险匹配度进行映射。
    data:
      points:
        - label: Thyme Care
          x: 8.5
          'y': 8.5
          description: 深厚的临床人员配置，配合完整的双向风险及共享节省合同。
        - label: Daymark Health
          x: 5.5
          'y': 6
          description: 专业化症状导航，并已出现地区性风险承担安排。
        - label: Navigating Cancer
          x: 2.5
          'y': 7
          description: 纯软件许可模式下，诊所工作流和门户能力较深。
        - label: Carevive
          x: 2
          'y': 5.5
          description: 专业化照护规划软件，但不直接匹配风险。
        - label: Cordata Healthcare
          x: 2
          'y': 4
          description: 覆盖多个专科的通用型照护协调软件。
        - label: 付款方内部团队
          x: 7
          'y': 3
          description: 付款方直接掌握经济性，但临床互动以电话为主且不具专科化。
    approximationNotes: 分数是基于经验证运营模式和已报告合同结构的序数评估（1-10 分制）。X 值高表示风险深度共享；Y 值高表示临床交付专业化程度高。
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
  - id: FI001
    title: 肿瘤照护导航经济价值流与收入转化
    type: flow
    summary: 展示合同健康计划的肿瘤支出如何转化为临床导航触点、医疗总节省及已赚取的企业收入。
    data:
      nodes:
        - id: managed-spend
          label: $7B+ 可管理肿瘤支出
          detail: 商业计划和 Medicare Advantage 计划中，覆盖 10.5M 名符合条件受保人的归属肿瘤医疗人群
          value: $7,000M
          unit: USD
        - id: care-triage
          label: 24/7 照护团队导航
          detail: 500 人照护团队提供症状分诊、ePRO 跟踪及社会支持
          value: 500 staff
          unit: FTE
        - id: cost-reduction
          label: 总成本降低 5-10%
          detail: 经验证的急性急诊就诊（28%）及再住院（30%）下降
          value: 5-10%
          unit: percent
        - id: revenue-capture
          label: 年度收入 >$125M
          detail: 通过经常性行政 PMPM 费用及已赚取的共享节省捕获
          value: $125M
          unit: USD
        - id: operating-cash-flow
          label: 正自由现金流
          detail: 运营盈利支持再投资于 Thyme Companies 的扩张
          value: Profitable
          unit: status
        - id: reinvestment-growth
          label: 企业再投资与 Series E 储备
          detail: 再投资于相邻生命科学业务线、生物类似药及 $125M 资产负债表储备
          value: $125M
          unit: USD
    approximationNotes: 该流程展示医疗支出降低转化为收入的经济机制。步骤之间的转化比率取决于保密的付款方合同条款。
    claimRefs:
      - CI002
      - CI006
      - CI011
      - CI012
  - id: FE001
    title: Thyme Care 平台技术栈
    type: stack
    summary: 支撑 Thyme Box 和照护团队协同的多层软件与运营架构。
    data:
      layers:
        - label: 客户端应用与导航 UI
          detail: 供照护团队成员与 Thyme Box 交互的单页界面
          modules:
            - Vue.js 单页应用
            - TypeScript 组件框架
            - Thyme Box 照护导航 UI
            - 会员任务优先级排序与活动搜索
        - label: 应用与服务层
          detail: 高并发微服务与照护协调分诊逻辑
          modules:
            - Python FastAPI 微服务
            - 照护协调逻辑引擎
            - 异步分诊处理
        - label: AI 与决策层
          detail: 从零到一的应用型 AI 项目与文档理解
          modules:
            - LLM 自动照护决策原型
            - 临床指南匹配引擎
            - 评估、可观测性与护栏流水线
        - label: 数据摄取与集成
          detail: 用于 ePRO、EHR 数据流及理赔数据的数据摄取流水线
          modules:
            - 数字 ePRO 收集引擎
            - EHR 诊所数据连接器
            - 跨生态系统附加福利规则
        - label: 数据持久化与审计
          detail: 关系型持久化、纵向历史与审计轨迹
          modules:
            - PostgreSQL 事务数据库
            - 临床互动历史表
            - 纵向会员旅程记录
        - label: 云基础设施与工具
          detail: 安全云环境与自动化开发者工具
          modules:
            - Amazon Web Services（AWS）云平台
            - HIPAA 合规网络边界
            - Thymesaver 环境自动化 CLI
    approximationNotes: 基于经验证的工程博客、技术面试指南及高级员工岗位要求梳理的逻辑架构分层。
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: 客户生命周期与付款方扩张旅程
    type: journey-map
    summary: 展示机构客户从付款方采购到临床诊所整合、患者导航及风险合同扩张的完整生命周期。
    data:
      items:
        - label: 1. 付款方签约与风险评估
          touchpoints:
            - 肿瘤理赔精算基线分析
            - 带节省保证的按价值计费协议
            - 数据共享与名单资格摄取
        - label: 2. 医疗服务方与肿瘤医生协同
          touchpoints:
            - 引入地区社区肿瘤诊所
            - 建立双向 EHR 与 ePRO 工作流
            - 将诊所员工与多学科团队连接起来
        - label: 3. 会员识别与引导入组
          touchpoints:
            - 主动联系新诊断会员
            - 分配专属肿瘤护士或社会工作者
            - 部署 ePRO 应用，主动报告率为 72%
        - label: 4. 纵向照护协调
          touchpoints:
            - 管理两次临床就诊之间的副作用
            - 对财务毒性和社会决定因素进行分诊
            - 防止本可避免的急诊就诊和住院
        - label: 5. 对账与账户扩张
          touchpoints:
            - 验证总照护成本节省 5-10%
            - 扩展至其他健康计划业务线
            - 会员覆盖范围翻倍后的合同续约
        - label: 6. 母平台增购
          touchpoints:
            - Thyme Companies 扩展至临床试验入组
            - 支持付款方药房支出中的生物类似药采用
            - 整合纵向肿瘤生态系统
    approximationNotes: 代表根据 Thyme Care 商业披露及合作案例研究总结的标准机构客户旅程。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU006
      - CU007
  - id: FR001
    title: 风险矩阵：关键威胁向量的可能性 vs. 剩余影响
    type: matrix
    summary: 从监管、精算、运营及交易对手维度，对剩余风险严重性和概率进行可视化评估。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 灾难性影响
          values:
            - label: 灾难性网络入侵与 PHI 泄露
            - label: 主要付款方终止合同（Humana / CVS）
            - label: 下行成本保证造成系统性精算赤字
        - label: 严重影响
          values:
            - label: 联邦虚假理赔或计费执法行动
            - label: 失去关键风险承担型付款方合同
            - label: 大规模下行共享节省对账追回
        - label: 重大影响
          values:
            - label: Thyme Companies 业务分拆导致管理层分心
            - label: 多州对 MSO 导航模式发起 CPOM 质疑
            - label: 专科肿瘤护士人手短缺与加班
        - label: 中等影响
          values:
            - label: 双向 EHR 数据接入链路临时中断
            - label: 医疗服务提供者抵制生物类似药临床应用路径
            - label: 区域性 ePRO 患者参与度波动
        - label: 低影响
          values:
            - label: 轻微行政审计调整
            - label: 常规临床资质再核验延迟
            - label: 非重大合同措辞不一致
        - label: 极小影响
          values:
            - label: 分诊运营之外的网站偶发宕机
            - label: 临时会员联系信息更新延迟
            - label: 区域监管机构的常规信息咨询
    approximationNotes: 矩阵单元格位置反映既定缓解因素实施后的企业残余严重程度定性评估，其中包括 NCQA 认证和盈利能力。
    claimRefs:
      - CR001
      - CR005
      - CR008
      - CR010
      - CR011
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 披露的融资定价先经过证据质量和下行风险闸门，再进入“持续跟踪 / 继续研究”的条件性决策路径。
    data:
      nodes:
        - id: financing-anchor
          label: 融资锚点
          detail: Series E 轮，融资额 >$125M，估值 >$2B
        - id: operating-signal
          label: 经营信号
          detail: 2025 年报告收入 $125M；公司自称已实现盈利
        - id: price-test
          label: 价格检验
          detail: '>16 倍报告收入市销率'
        - id: evidence-gap
          label: 证据缺口
          detail: 没有经审计的利润率、留存率、净债务或优先权分配瀑布
        - id: execution-risk
          label: 执行风险
          detail: Thyme Companies 新拓展的相邻业务可能分散重点
        - id: decision
          label: 决策
          detail: 持续跟踪 / 继续研究；估值偏高
      edges:
        - from: financing-anchor
          to: operating-signal
        - from: operating-signal
          to: price-test
        - from: price-test
          to: evidence-gap
        - from: evidence-gap
          to: execution-risk
        - from: execution-risk
          to: decision
    approximationNotes: 这是一条定性决策链，不估算公允价值、概率或投资回报。
    claimRefs:
      - CV002
      - CV005
      - CV010
      - CV014
      - CV016
