company:
  name: "Thyme Care"
chapter:
  number: 6
  title: "Customers"
  summary: "Thyme Care has scaled its value-based cancer navigation footprint to 85,000 active members and over 10.5 million eligible covered lives across national and regional health plan partnerships, managing between $5 billion and $7 billion in oncology spend. However, revenue remains heavily concentrated in deal- and policy-dependent payer relationships, while customer-level unit retention metrics like NRR and GRR remain private."
sections:
  - id: "customer-segmentation-and-payer-buyer-model"
    title: "Customer Base Segmentation and Payer Alignment"
    body: "Thyme Care operates a multi-stakeholder enterprise model where the primary economic buyer and risk-bearing partner is the health plan, while oncology clinics and patients act as primary users [CU001, CU002]. Commercial relationships center on Medicare Advantage and commercial health plans that assume financial risk for total cost of oncology care [CU002, CU003]. The company contracts directly with national payers including Humana and CVS Health Ventures affiliates to manage active cancer treatment populations [CU003, CU004]. Under these arrangements, Thyme Care provides navigation services that are available to more than 10.5 million individuals nationwide across all 50 states [CU004]. Oncology practices such as Texas Oncology and health systems like Memorial Hermann serve as clinical delivery partners and strategic stakeholders rather than traditional fee-paying software clients [CU005, CU006]. While this alignment creates broad patient distribution without direct-to-consumer acquisition friction, it makes customer acquisition lumpy and dependent on institutional payer procurement cycles [CU007]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-spend-scale"
    title: "Adoption Trajectory and Spend Under Management"
    body: "Adoption of Thyme Care's platform expanded rapidly between late 2024 and 2026, driven by expanding payer contracts and expanding covered membership [CU002, CU008]. Active patient count rose from approximately 10,000 members at year-end 2024 to 80,000 members by September 2025 and 85,000 members across Medicare Advantage and commercial plan partnerships by the end of 2025 [CU002, CU008]. Concurrently, oncology spend under management grew from $5 billion in 2025 to more than $7 billion by late 2026 [CU002, CU004, CU008]. Clinical network adoption is supported by collaboration with more than 1,400 oncologists nationwide who coordinate with over 500 care team specialists [CU002]. Reported revenue climbed to $125 million in 2025, representing a fivefold increase over the prior year [CU008]. Despite rapid macro scaling, the reported member count represents enrolled lives within payer contracts rather than voluntary individual software subscriptions [CU002, CU007]."
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
  - id: "customer-proof-retention-and-concentration-risks"
    title: "Customer Proof, Contract Durability, and Concentration"
    body: "Proof of customer adoption is demonstrated through scaled operational deployments with anchor payers including Humana and health system partners like Memorial Hermann Health System and Texas Oncology [CU003, CU005, CU006]. The company reports that its largest payer relationships doubled in size as early clinical performance results exceeded savings guarantees, generating validated 5 to 10 percent reductions in total cost of care [CU002, CU004]. In addition, member engagement is evidenced by 72% of members sharing updates via electronic patient-reported outcomes (ePROs), which correlates with a 40% reduction in emergency department visits and 19% fewer hospital admissions [CU006]. Nevertheless, third-party software reviews remain sparse, with platforms like PeerSpot noting an absence of user-submitted reviews [CU009]. Crucially, contract durability remains vulnerable to policy adjustments and contracting cycles in Medicare Advantage, as commercial contracts remain concentrated among a small cohort of major national payers [CU007, CU010]. Standard SaaS retention metrics, such as net revenue retention (NRR), gross revenue retention (GRR), and logo churn, remain completely undisclosed [CU011, CU012]."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
