    title: "Customer lifecycle and payer expansion journey"
    type: "journey-map"
    summary: "Illustrates the institutional customer lifecycle from payer procurement to clinical practice integration, patient navigation, and risk contract expansion."
    data:
      items:
        - label: "1. Payer Contracting & Risk Underwriting"
          touchpoints:
            - "Actuarial baseline analysis on oncology claims"
            - "Value-based agreement with savings guarantee"
            - "Data sharing and roster eligibility ingestion"
        - label: "2. Provider & Oncologist Alignment"
          touchpoints:
            - "Onboarding regional community oncology practices"
            - "Establishing bidirectional EHR and ePRO workflows"
            - "Connecting practice staff with multidisciplinary teams"
        - label: "3. Member Identification & Onboarding"
          touchpoints:
            - "Proactive outreach to newly diagnosed members"
            - "Assignment of dedicated oncology nurse or social worker"
            - "ePRO app deployment with 72% proactive reporting"
        - label: "4. Longitudinal Care Coordination"
          touchpoints:
            - "Managing side-effects between clinical visits"
            - "Financial toxicity and social determinants triage"
            - "Preventing avoidable emergency room visits and admissions"
        - label: "5. Reconciliation & Account Expansion"
          touchpoints:
            - "Validation of 5-10% total cost of care savings"
            - "Expansion into additional health plan lines of business"
            - "Contract renewals with doubled membership scope"
        - label: "6. Parent Platform Upsell"
          touchpoints:
            - "Thyme Companies expansion into clinical trial accrual"
            - "Biosimilar adoption support across payer pharmacy spend"
            - "Longitudinal oncology ecosystem integration"
    approximationNotes: "Represents the standard institutional customer journey derived from Thyme Care's commercial disclosures and partnership case studies."
