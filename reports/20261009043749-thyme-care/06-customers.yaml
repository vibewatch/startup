callouts:
  - calloutType: "risk"
    title: "High Payer Concentration and Policy Exposure"
    body: "Thyme Care's rapid expansion to 85,000 active members and $7 billion in managed spend is concentrated among a small number of national Medicare Advantage and commercial health plan partners. While performance results have allowed initial relationships to double in size, growth remains exposed to Medicare Advantage rate shifts, regulatory changes in value-based oncology models, and elongated payer sales cycles."
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU007"
      - "CU010"
