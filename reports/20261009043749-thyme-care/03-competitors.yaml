callouts:
  - calloutType: "risk"
    title: "Exposure to Payer Contracting Cycles and Regulatory Milestones"
    body: "Thyme Care's commercial momentum is tightly bound to annual Medicare Advantage plan bids and value-based care policy adjustments. While strategic investments from Humana, CVS Health Ventures, and Morgan Health provide distribution moats, changes in payer risk-sharing appetite or stricter audits of self-reported cost savings could compress margin expansion."
    claimRefs:
      - "CP011"
      - "CP012"
      - "CP015"
  - calloutType: "insight"
    title: "Capital Asymmetry Across Dedicated Oncology Navigation Peers"
    body: "With $400M in cumulative capital raised, Thyme Care commands an overwhelming funding lead compared to direct peers like Daymark Health ($37.6M) and Navigating Cancer ($41.4M). This enables aggressive hiring of multidisciplinary clinical teams and balance-sheet capacity to underwrite shared-savings guarantees."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP008"
