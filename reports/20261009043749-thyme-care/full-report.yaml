  - id: FM001
    title: Value-Based Oncology Market Sizing Hierarchy
    type: pyramid
    summary: >-
      Hierarchical breakdown of market opportunity from national gross oncology expenditure down to addressable
      shared-savings fee economics.
    data:
      nodes:
        - label: Total US Oncology Medical Expenditure (TAM)
          detail: >-
            Over $200B in annual national cancer spending across more than 2 million newly diagnosed patients
            nationwide.
          tone: neutral
        - label: Systemic Therapy & Chemotherapy Spend Layer
          detail: >-
            Accounts for up to 70% of total episodic cancer spend, with advanced regimens exceeding $200,000 annually
            per patient.
          tone: neutral
        - label: Hospitalization & Acute Utilization Spend Layer
          detail: >-
            Inpatient and emergency care where over 50% of chemotherapy patients face acute hospital admissions within 6
            months.
          tone: warning
        - label: Contracted Platform Addressable Spend (SAM)
          detail: Over $7B in active oncology spend managed across 10.5M+ eligible covered lives in all 50 states.
          tone: positive
        - label: Managed Acute Spend Savings Opportunity
          detail: >-
            Targeted 15% to 20% acute care spend reduction, driven primarily by $421 monthly per-patient inpatient
            hospitalization savings.
          tone: positive
        - label: Net Shared Savings & Value Capture (SOM)
          detail: >-
            5% to 10% validated total cost of care reduction, delivering $594 average monthly net savings per navigated
            member.
          tone: positive
    approximationNotes: >-
      Derived from National Cancer Institute spending estimates, published ASCO Quality Care evaluations, and company
      contract disclosures.
