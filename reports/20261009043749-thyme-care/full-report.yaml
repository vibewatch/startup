      - number: '4.2'
        title: Operating Cost Structure, Service Delivery Drivers, and Margin Exposure
        blocks:
          - type: paragraph
            body: >-
              The cost structure of Thyme Care is dominated by specialized clinical labor and high-touch care
              coordination rather than software hosting overhead [CI005, CI006]. Service delivery relies on an
              oncology-trained Care Team comprising medical directors, registered nurses, social workers, and care
              partners delivering 24/7 coverage [CI006]. Clinical workflows leverage proprietary algorithmic triage
              tools and automated electronic patient-reported outcome assessments, generating a 28% relative risk
              reduction in emergency department visits and a 30% reduction in readmissions [CI006]. While these
              interventions drive verifiable savings, they impose fixed and semi-variable operational expenses that
              scale with enrolled active patient volume [CI005, CI008]. Gross margin is therefore constrained by
              clinical staffing ratios, clinician wage inflation, and technical integration friction across community
              oncology practices [CI008, CI009]. Audited financial statements, precise gross margins, and customer
              acquisition payback horizons remain undisclosed private data points [CI009, CI010].
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Capital Adequacy, Commercial Traction, and Diligence Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Thyme Care achieved exceptional top-line expansion in 2025, reporting revenue in excess of $125 million—a
              fivefold increase over the prior year [CI011]. Commercial reach extends across all 50 states, with
              navigation services available to more than 10.5 million people and active medical spend under management
              exceeding $7 billion [CI002, CI011]. Executive leadership announced that the enterprise achieved
              operational profitability and generates positive free cash flow, supported by a substantial balance sheet
              that was further fortified by a $125 million Series E round in September 2026 at a valuation exceeding $2
              billion [CI002, CI011, CI012]. Concurrently, corporate restructuring established Thyme Companies to
              incubate adjacent life sciences lines in biosimilar adoption and clinical trial enrollment [CI002, CI012].
              For institutional underwriting, the platform demonstrates proven payer validation and balance-sheet
              durability, but private opacity surrounding net retention, downside guarantee reserves, and true software
              gross margins prevents traditional SaaS-multiple valuation benchmarking [CI010, CI013].
            claimRefs:
              - CI002
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Revenue Model Dichotomy: Fee-for-Service vs Value-Based Risk'
            body: >-
              Thyme Care operates a hybrid revenue model that balances fixed recurring administrative revenue with
              upside shared savings. By providing upfront management fees, payers fund the operational costs of Thyme
              Care's 500-person Care Team. In exchange, Thyme Care guarantees clinical and financial performance,
              aligning its profitability directly with verifiable reductions in emergency room visits and hospital
              readmissions.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI006
          - type: callout
            title: Downside Actuarial Risk and Private Metric Opacity
            body: >-
              While Thyme Care announced profitability and positive free cash flow in 2026, the absence of public
              financial statements conceals critical underwriting variables. Total cost of care contracts can expose
              navigators to catastrophic oncologic drug spend or adverse patient selection. Without visibility into
              gross margins, contract renewal terms, or net revenue retention, institutional investors cannot
              independently verify the durability of earnings.
            calloutType: risk
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Care Delivery Platform and Navigation Workflow
        blocks:
          - type: paragraph
            body: >-
              Thyme Care positions its product offering as a comprehensive value-based oncology care enablement platform
              that bridges health plans, community oncologists, employers, and cancer patients. In day-to-day workflow
              terms, the service delivers personalized, continuous navigation between clinic appointments, addressing
              symptoms, appointment logistics, transportation assistance, chemotherapy side effects, and social
              determinants of health. The primary clinical interface is Thyme Box, an internally built care management
              application that enables more than 600 distributed Care Team members—including oncology nurses,
              navigators, and resource specialists—to triage member touchpoints and manage interventions. Member
              interactions are captured through structured workflows and digital check-ins, notably electronic
              patient-reported outcomes (ePROs), which achieve a 72% proactive completion rate and support clinical
              triage to mitigate acute emergency department utilization.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
