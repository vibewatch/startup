              - CU008
      - number: '6.3'
        title: Customer Proof, Contract Durability, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Proof of customer adoption is demonstrated through scaled operational deployments with anchor payers
              including Humana and health system partners like Memorial Hermann Health System and Texas Oncology [CU003,
              CU005, CU006]. The company reports that its largest payer relationships doubled in size as early clinical
              performance results exceeded savings guarantees, generating validated 5 to 10 percent reductions in total
              cost of care [CU002, CU004]. In addition, member engagement is evidenced by 72% of members sharing updates
              via electronic patient-reported outcomes (ePROs), which correlates with a 40% reduction in emergency
              department visits and 19% fewer hospital admissions [CU006]. Nevertheless, third-party software reviews
              remain sparse, with platforms like PeerSpot noting an absence of user-submitted reviews [CU009].
              Crucially, contract durability remains vulnerable to policy adjustments and contracting cycles in Medicare
              Advantage, as commercial contracts remain concentrated among a small cohort of major national payers
              [CU007, CU010]. Standard SaaS retention metrics, such as net revenue retention (NRR), gross revenue
              retention (GRR), and logo churn, remain completely undisclosed [CU011, CU012].
            claimRefs:
              - CU002
