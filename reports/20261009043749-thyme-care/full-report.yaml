      - number: '3.3'
        title: Moat Durability, Incumbent Response, and Downside Risks
        blocks:
          - type: paragraph
            body: >-
              Thyme Care's competitive durability relies on network density among community oncologists and multi-year
              risk-bearing payer relationships. Having partnered with over 1,400 oncologists across major health plans
              and reached over 85,000 members by late 2025, Thyme Care creates operational switching costs once care
              navigation workflows and data interfaces are deeply embedded into partner practices. Nevertheless,
              structural vulnerabilities persist. Independent industry analysis notes that Thyme Care's growth model
              exhibits high deal- and policy-dependent sensitivity, where scaling hinges on annual Medicare Advantage
              and commercial benefit design windows. Furthermore, because key acute-care savings metrics and outcomes
              remain largely company-reported rather than validated through independent randomized trials, Thyme Care
              faces ongoing scrutiny from health plan actuarial teams. As large national health plans explore in-house
              care management capabilities and regional providers assess internal care coordinator staffing, Thyme Care
              must continually prove that its shared-savings yields exceed the friction and administrative overhead of
              external vendor integration.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Exposure to Payer Contracting Cycles and Regulatory Milestones
            body: >-
              Thyme Care's commercial momentum is tightly bound to annual Medicare Advantage plan bids and value-based
              care policy adjustments. While strategic investments from Humana, CVS Health Ventures, and Morgan Health
              provide distribution moats, changes in payer risk-sharing appetite or stricter audits of self-reported
              cost savings could compress margin expansion.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
              - CP015
          - type: callout
            title: Capital Asymmetry Across Dedicated Oncology Navigation Peers
            body: >-
              With $400M in cumulative capital raised, Thyme Care commands an overwhelming funding lead compared to
              direct peers like Daymark Health ($37.6M) and Navigating Cancer ($41.4M). This enables aggressive hiring
              of multidisciplinary clinical teams and balance-sheet capacity to underwrite shared-savings guarantees.
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
              - CP008
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Commercial Monetization, and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              Thyme Care generates revenue primarily through two commercial mechanisms tied to value-based oncology
              arrangements: upfront recurring administrative management fees and performance-contingent shared savings
              distributions [CI001, CI002]. Contracts are established directly with commercial insurers, Medicare
              Advantage health plans such as Humana, and health plan affiliates of CVS Health Ventures [CI003, CI004].
              Under these population agreements, Thyme Care coordinates care for enrolled members diagnosed with cancer,
              assuming operational and clinical responsibility for navigating patients between oncology appointments
              [CI002, CI005]. Upfront administrative fees provide predictable working capital to support the 500-person
              multidisciplinary Care Team, while shared savings payments require validated total cost of care reductions
              of 5% to 10% against actuarial benchmarks [CI002, CI006]. However, official list pricing,
              per-member-per-month (PMPM) rates, and realized risk corridor splits are negotiated confidentially per
              payer contract and are not publicly disclosed [CI007].
            claimRefs:
              - CI001
              - CI002
              - CI003
