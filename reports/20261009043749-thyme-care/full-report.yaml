      - number: '5.2'
        title: Modular Architecture and Technical Stack
        blocks:
          - type: paragraph
            body: >-
              Thyme Care's software platform is organized around modular web applications and back-end integration
              services engineered to ingest heterogeneous clinical data while keeping care coordinators focused on
              active member interventions. Front-end engineering relies primarily on Vue.js single-page applications
              authored in TypeScript, transitioning from legacy JavaScript patterns and providing interactive search,
              filtering, and activity categorization. The back-end architecture standardizes on Python services using
              the FastAPI framework running on relational PostgreSQL databases, containerized and deployed across Amazon
              Web Services (AWS) cloud infrastructure. A dedicated internal engineering CLI utility named Thymesaver
              automates local developer environment bootstrapping across PostgreSQL tools, AWS CLI, and language
              toolchains. For emerging zero-to-one product lines, the engineering team has established a New Initiatives
              group tasked with embedding large language model (LLM) decisioning, document comprehension, and automated
              guardrails into high-stakes oncology treatment workflows.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE004
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Clinical Governance, Enterprise Integration, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Because oncology navigation involves sensitive protected health information and high-consequence clinical
              trajectories, Thyme Care separates non-clinical care navigation from physician-directed medical treatment.
              Corporate entities provide management services to affiliated medical practices, including Thyme Care
              Medical, PLLC and Dr. Bobby Green Medical, P.C., while explicitly disclaiming direct cancer diagnosis or
              prescription authority. Programmatic design and economic evaluation are overseen by a cross-functional
              Clinical Innovation & Design group that benchmarks outcomes, member experience, and medical cost
              structure. Technical and operational risks center on the platform's heavy reliance on custom EHR and
              claims integrations across disparate payer and provider legacy environments, the latency and accuracy of
              asynchronous ePRO reporting, and the auditability of proposed automated LLM decisioning tools in regulated
              healthcare environments.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Tech-Enabled Services vs. Pure Software Operating Realities
            body: >-
              While Thyme Care brands itself as a tech-native oncology platform, its operating model remains heavily
              dependent on human-in-the-loop care delivery. The company employs more than 600 Care Team personnel whose
              productivity is enhanced, but not replaced, by the Thyme Box application. Long-term gross margin expansion
              hinges on whether new AI initiatives and automation can dramatically increase the ratio of managed
              patients per care coordinator without eroding clinical support quality.
            calloutType: insight
            claimRefs:
              - CE002
              - CE008
              - CE010
          - type: callout
            title: Clinical Scope Boundaries and Regulatory Exposure
            body: >-
              Thyme Care operates under a corporate practice of medicine (CPOM) structure wherein non-clinical
              navigation entities support separate professional medical corporations. Because Thyme Care disclaims
              providing direct medical diagnoses or altering chemotherapy regimens, technical workflows must enforce
              strict boundary controls to prevent care coordinators from providing unlicensed clinical guidance,
              maintaining defensible audit trails across all electronic communications.
            calloutType: risk
            claimRefs:
              - CE009
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Payer Alignment
        blocks:
          - type: paragraph
            body: >-
              Thyme Care operates a multi-stakeholder enterprise model where the primary economic buyer and risk-bearing
              partner is the health plan, while oncology clinics and patients act as primary users [CU001, CU002].
              Commercial relationships center on Medicare Advantage and commercial health plans that assume financial
              risk for total cost of oncology care [CU002, CU003]. The company contracts directly with national payers
              including Humana and CVS Health Ventures affiliates to manage active cancer treatment populations [CU003,
              CU004]. Under these arrangements, Thyme Care provides navigation services that are available to more than
              10.5 million individuals nationwide across all 50 states [CU004]. Oncology practices such as Texas
              Oncology and health systems like Memorial Hermann serve as clinical delivery partners and strategic
              stakeholders rather than traditional fee-paying software clients [CU005, CU006]. While this alignment
              creates broad patient distribution without direct-to-consumer acquisition friction, it makes customer
              acquisition lumpy and dependent on institutional payer procurement cycles [CU007].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
