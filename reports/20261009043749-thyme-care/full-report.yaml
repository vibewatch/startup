      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Economics
        blocks:
          - type: paragraph
            body: >
              Adoption of specialized oncology navigation platforms is governed by three primary buyer segments with
              distinct economic motivations: Medicare Advantage health plans, delegated risk-bearing provider groups,
              and self-insured enterprise employers [CM009, CM010]. Medicare Advantage plans face severe medical loss
              ratio (MLR) volatility driven by complex cancer populations and regulatory pressure from value-based
              models such as CMS's Enhancing Oncology Model (EOM) [CM010, CM015]. These payers engage navigation
              partners to mitigate emergency department utilization, improve quality scores, and secure predictable
              medical spend without antagonizing treating community oncologists [CM001, CM002].


              Delegated risk-bearing provider groups, such as Oak Street Health, represent a critical customer segment
              that assumes full or shared downside risk from Medicare Advantage plans [CM009]. Primary care providers
              often lose operational and clinical visibility once a patient enters complex oncology regimens, risking
              exacerbation of underlying comorbidities such as heart failure or diabetes [CM006, CM009]. Value-based
              oncology navigators bridge this communication gap between community oncologists and primary care
              physicians, ensuring holistic clinical coordination [CM001, CM009]. Meanwhile, self-insured employers
              identify cancer as a leading healthcare cost driver with double-digit annual cost increases, accelerating
              commercial contracting to curb acute admissions and support workforce retention [CM008, CM016].
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM008
              - CM009
              - CM010
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM015
              - CM016
      - number: '2.4'
        title: Adoption Drivers, Regulatory Catalysts, and Growth Constraints
        blocks:
          - type: paragraph
            body: >
              Adoption of value-based oncology navigation is propelled by powerful macro tailwinds alongside persistent
              structural constraints. A primary growth driver is the national migration toward risk-bearing payment
              models reinforced by CMS policy initiatives, including the Enhancing Oncology Model (EOM) [CM015].
              Concurrently, severe financial toxicity among oncology patients—exacerbated by high deductible plans and
              drug copayments—creates urgent demand for non-clinical navigation covering transportation, nutrition, and
              financial assistance [CM007, CM016].


              However, significant market constraints govern deployment velocity. Integrating navigation platforms
              requires deep interoperability with diverse community oncology electronic health records (EHRs) and
              coordination with independent oncology practices [CM002, CM003]. Oncology practices frequently resist
              third-party intervention if navigation appears to impose administrative burden or interfere with clinical
              autonomy [CM002, CM003]. Furthermore, moving from shared-savings upside arrangements to full two-sided
              downside risk requires sophisticated actuarial benchmarking and capital reserves, creating operational
              barriers for emerging entrants [CM009, CM012].
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM009
              - CM012
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Acute Care Spend Reduction as the Primary Value Driver
            body: >-
              The core economic engine of value-based oncology navigation centers on inpatient diversion rather than
              chemotherapy rationing. Published evaluations demonstrate that 71% of total monthly member savings ($421
              of $594) stem directly from avoided inpatient hospitalizations, validating that continuous symptom
              tracking and proactive triage deliver measurable return on investment for risk-bearing payers.
            calloutType: insight
            claimRefs:
              - CM013
              - CM014
          - type: callout
            title: Downside Risk and Actuarial Benchmark Volatility
            body: >-
              Assuming two-sided downside risk aligns payment incentives with clinical outcomes but introduces actuarial
              vulnerability. Because small cohorts of oncology patients can experience extreme outlier expenditures,
              value-based oncology platforms require robust risk-corridor protections, accurate baselines, and
              substantial balance-sheet liquidity to absorb unexpected acute medical volatility.
            calloutType: risk
            claimRefs:
              - CM009
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Oncology Navigation Landscape and Direct Competitor Tiers
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for oncology care coordination and navigation spans specialized value-based
              navigation platforms, clinic-level oncology EHR and patient engagement software, diversified care
              management incumbents, and health plan internal programs. Direct venture-backed oncology navigation
              competitors include Daymark Health (formerly focused on symptom management and navigation, which secured
              Series A funding) and Navigating Cancer (focused on patient portals and clinic triage). Meanwhile, legacy
              care coordination vendors such as Carevive, Cordata Healthcare Innovations, and Noona have historically
              targeted provider workflow automation rather than accepting downstream downside risk or two-sided
              value-based risk sharing. Thyme Care positions itself distinctly by combining multidisciplinary clinical
              support teams with integrated technology and bilateral risk-sharing contracts with major health plans.
              However, provider organizations face continuous trade-offs between adopting an integrated external partner
              like Thyme Care and relying on clinic-level staff or payer-sponsored care managers.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Capability Architecture, Pricing Models, and Market Differentiation
        blocks:
          - type: paragraph
            body: >-
              Differentiation in oncology navigation hinges on three core operational pillars: the depth of EHR
              integration into oncologist workflows, the employment of licensed clinical staff versus pure software
              tooling, and the alignment of economic incentives through risk-based contracts. While workflow vendors
              like Navigating Cancer and Carevive license software portals to oncology practices under fee-for-service
              or SaaS subscription terms, Thyme Care deploys a hybrid model where its tech platform operates alongside a
              multidisciplinary care team of more than 500 clinical specialists, oncology nurses, and social workers.
              Its care management services are coupled with software tools such as Thyme Care Signal that connect into
              EHR workflows to deliver patient analytics. Thyme Care operates primarily through value-based performance
              agreements with Medicare Advantage and commercial health plans, targeting acute-care reductions of 15% to
              20% in emergency room visits and hospital admissions. By contrast, specialized entrants like Daymark
              Health have raised substantially less capital ($37.6M total funding) and maintain a more concentrated
              regional footprint.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
