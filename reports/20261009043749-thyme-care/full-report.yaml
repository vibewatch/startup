  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              The oncology care navigation and value-based oncology enablement market addresses the severe clinical
              fragmentation, administrative friction, and runaway expenditures characteristic of cancer treatment in the
              United States. Cancer represents one of the largest and fastest-growing drivers of domestic medical
              spending, costing more than $200 billion annually according to National Cancer Institute benchmarks
              [CM004]. Total cancer expenditures are heavily weighted toward systemic therapies—where pharmaceutical
              regimens frequently exceed $200,000 annually per patient and comprise up to 70% of total episodic costs
              [CM005]—alongside acute emergency department visits and inpatient hospitalizations resulting from
              unmanaged treatment toxicities [CM006].


              Within this broader oncology expenditure landscape, the addressable market for specialized oncology
              navigation platforms isolates the acute medical spend, non-clinical barrier remediation, and avoidable
              hospitalization costs rather than general oncology drug acquisition or surgical facility fees [CM001].
              Traditional status-quo alternatives rely heavily on transactional health plan prior authorization, passive
              nurse triage hotlines, or uncoordinated hospital cancer center navigators lacking risk-aligned incentives
              [CM002]. In contrast, tech-enabled collaborative care models deploy multidisciplinary care teams to
              deliver 24/7 continuous navigation, electronic patient-reported outcome monitoring (ePROs), and close
              operational integration with community oncology practices [CM001, CM003]. By inserting clinical
              coordination and social determinants support between clinical visits, navigation models seek to mitigate
              avoidable acute care utilization while maintaining patient adherence to optimal therapeutic regimens
              [CM007].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and SOM Breakdown'
        blocks:
          - type: paragraph
            body: >
              Evaluating the oncology navigation and value-based management market requires distinct sizing lenses
              across national disease incidence, total managed medical spend, and addressable risk-share fees. At the
              macro boundary, the national oncology expenditure pool exceeds $200 billion annually, with more than 2
              million newly diagnosed cancer patients expected across the United States in 2026 [CM004, CM008]. This
              top-line expenditure defines the broader theoretical total addressable market (TAM) for oncology cost
              containment and care improvement solutions.


              The serviceable addressable market (SAM) narrows this aggregate spending to active oncology spend held
              within risk-bearing frameworks across Medicare Advantage plans, delegated risk-bearing primary care
              organizations, and self-insured commercial employers [CM009, CM010]. Because more than 50% of cancer
              patients undergo chemotherapy hospitalization within their first six months of active treatment [CM006],
              risk-bearing entities actively seek specialized partners to mitigate acute inpatient admissions. Thyme
              Care has scaled its active platform reach to more than 10.5 million eligible covered lives nationwide
              across all 50 states, actively managing over $7 billion in oncology medical spend under risk-bearing and
              value-based contracts [CM011].


              The serviceable obtainable market (SOM) represents the addressable net fee and shared savings opportunity
              derived from this managed spend. Under risk-bearing partnership structures, navigation platforms generate
              revenue through administrative management fees, per-member-per-month (PMPM) arrangements, and shared
              savings derived from verified reductions in total cost of care [CM009, CM012]. Published evaluations
              demonstrate 15% to 20% reductions in acute care spend, generating an average net monthly savings of $594
              per navigated patient, primarily driven by a $421 monthly reduction in inpatient hospital spend [CM013,
              CM014]. Validated total cost of care reductions ranging from 5% to 10% establish a substantial recurring
              economics layer across payer and provider partners [CM011, CM012].
            claimRefs:
              - CM004
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
