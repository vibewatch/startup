chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Operating Boundary
        blocks:
          - type: paragraph
            body: >-
              Thyme Care was founded in 2020 and is headquartered in Nashville, Tennessee. Its operating proposition is
              an oncology-focused platform for virtual care navigation, care coordination, analytics, and support
              between oncology visits. The legal boundary matters: Thyme Care's own disclosures say the management
              company supports affiliated professional entities and provides non-clinical services, while the affiliated
              provider entities deliver clinical cancer support. The same disclosures state that Thyme Care itself does
              not diagnose cancer, prescribe treatment, or replace the treating oncology team. Investors should
              therefore diligence both the technology-enabled navigation business and the professional-entity structure
              rather than treating the company as a single conventional provider.
