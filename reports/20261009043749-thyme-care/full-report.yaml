      - number: '6.2'
        title: Adoption Trajectory and Spend Under Management
        blocks:
          - type: paragraph
            body: >-
              Adoption of Thyme Care's platform expanded rapidly between late 2024 and 2026, driven by expanding payer
              contracts and expanding covered membership [CU002, CU008]. Active patient count rose from approximately
              10,000 members at year-end 2024 to 80,000 members by September 2025 and 85,000 members across Medicare
              Advantage and commercial plan partnerships by the end of 2025 [CU002, CU008]. Concurrently, oncology spend
              under management grew from $5 billion in 2025 to more than $7 billion by late 2026 [CU002, CU004, CU008].
              Clinical network adoption is supported by collaboration with more than 1,400 oncologists nationwide who
              coordinate with over 500 care team specialists [CU002]. Reported revenue climbed to $125 million in 2025,
              representing a fivefold increase over the prior year [CU008]. Despite rapid macro scaling, the reported
              member count represents enrolled lives within payer contracts rather than voluntary individual software
              subscriptions [CU002, CU007].
            claimRefs:
              - CU002
              - CU004
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
