companyProfile:
  summary: >-
    Thyme Care is a private, disclosed oncology care-management platform founded in 2020 and headquartered in Nashville,
    Tennessee. It provides non-clinical navigation, member support, and care coordination through Thyme Care, LLC while
    affiliated professional entities handle clinical cancer support. The business monetizes through payer and provider
    contracts that mix administrative management fees with shared-savings economics, and it says it reached a September
    2026 Series E above $2 billion while scaling to more than 10.5 million eligible lives and 85,000 members. Audited
    financial statements, cap-table terms, and other private underwriting inputs remain undisclosed.
