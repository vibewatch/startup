callouts:
  - calloutType: insight
    title: "Acute Care Spend Reduction as the Primary Value Driver"
    body: "The core economic engine of value-based oncology navigation centers on inpatient diversion rather than chemotherapy rationing. Published evaluations demonstrate that 71% of total monthly member savings ($421 of $594) stem directly from avoided inpatient hospitalizations, validating that continuous symptom tracking and proactive triage deliver measurable return on investment for risk-bearing payers."
    claimRefs:
      - CM013
      - CM014
  - calloutType: risk
    title: "Downside Risk and Actuarial Benchmark Volatility"
    body: "Assuming two-sided downside risk aligns payment incentives with clinical outcomes but introduces actuarial vulnerability. Because small cohorts of oncology patients can experience extreme outlier expenditures, value-based oncology platforms require robust risk-corridor protections, accurate baselines, and substantial balance-sheet liquidity to absorb unexpected acute medical volatility."
    claimRefs:
      - CM009
      - CM012
