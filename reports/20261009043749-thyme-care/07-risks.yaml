callouts:
  - calloutType: "risk"
    title: "Downside Actuarial Guarantees in Oncology Total Cost of Care"
    body: "Unlike pure software navigators operating on non-risk fee-for-service models, Thyme Care actively takes total-cost-of-care risk across 135,000 members. Payers disburse upfront management fees, which Thyme Care guarantees to recover through gross medical spend reductions. Any failure in risk stratification or escalation in high-cost drug utilization directly endangers cash flow, making sophisticated actuarial oversight a vital existential capability."
    claimRefs:
      - "CR010"
      - "CR011"
  - calloutType: "insight"
    title: "Strategic Payers as Investors: Alignment vs Dual-Agency Governance"
    body: "The syndication of Humana, CVS Health Ventures, and Morgan Health in Thyme Care's Series E provides unprecedented distribution scale across 10.5 million covered lives. However, this creates dual-agency exposure: the company's largest equity owners are also its primary commercial customers, potentially complicating contract pricing renegotiations and shared savings dispute resolution."
    claimRefs:
      - "CR009"
      - "CR012"
