callouts:
  - calloutType: "insight"
    title: "Revenue Model Dichotomy: Fee-for-Service vs Value-Based Risk"
    body: "Thyme Care operates a hybrid revenue model that balances fixed recurring administrative revenue with upside shared savings. By providing upfront management fees, payers fund the operational costs of Thyme Care's 500-person Care Team. In exchange, Thyme Care guarantees clinical and financial performance, aligning its profitability directly with verifiable reductions in emergency room visits and hospital readmissions."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI006"
  - calloutType: "risk"
    title: "Downside Actuarial Risk and Private Metric Opacity"
    body: "While Thyme Care announced profitability and positive free cash flow in 2026, the absence of public financial statements conceals critical underwriting variables. Total cost of care contracts can expose navigators to catastrophic oncologic drug spend or adverse patient selection. Without visibility into gross margins, contract renewal terms, or net revenue retention, institutional investors cannot independently verify the durability of earnings."
    claimRefs:
      - "CI007"
      - "CI009"
      - "CI010"
      - "CI013"
