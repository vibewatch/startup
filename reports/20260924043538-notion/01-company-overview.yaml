company:
  name: Notion
chapter:
  number: 1
  title: Company Overview
  summary: Refreshes identity, leadership, financing, scale, and the major milestones that anchor the rest of the report.
sections:
- id: identity
  title: Identity and positioning
  body: 'Notion remains best understood as a single workspace layer that bundles notes, wikis, databases, project coordination,
    and AI tools. The current refresh keeps the company in the late-stage private bucket: it is not public, it continues to
    sell a freemium seat-based product, and the public narrative now revolves around AI agents rather than only note-taking.
    The evidence base is strong on positioning and weaker on the exact operating metrics, which is normal for a private company
    that does not publish full financials. That keeps the analysis tethered to what is publicly observable today, and it leaves
    the unresolved question visible for the next refresh instead of forcing false precision into a private-company estimate.
    That is the right tradeoff for this report.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  tableRefs:
  - TO001
  figureRefs: []
- id: leadership
  title: Leadership, scale, and ownership signals
  body: 'The founders remain central to the story, and the available source set still points to founder-led execution rather
    than a professionally managed handoff. The 2026 refresh also keeps the company on a distributed hiring path, with careers
    and customer stories showing active teams and a broad user base. Headcount is the least reliable current metric: third-party
    profiles disagree too much to treat any one value as definitive, so the report intentionally keeps it as a gap rather
    than overstating precision. That keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved
    question visible for the next refresh instead of forcing false precision into a private-company estimate. That is the
    right tradeoff for this report.'
  claimRefs:
  - CO004
  - CO007
  - CO008
  tableRefs:
  - TO002
  figureRefs: []
- id: milestones
  title: Funding and milestones
  body: 'The most important financial milestone in the current refresh is the private tender that priced Notion at roughly
    $11B and brought in well-known institutional buyers. On the operating side, the current milestone pattern is consistent
    with a company that has moved from classic freemium PLG into AI monetization and agents. That is a meaningful strategic
    shift, but it does not yet erase the basic diligence gap: no public filing confirms the exact gross margin, NRR, or preference
    stack. That keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved question visible
    for the next refresh instead of forcing false precision into a private-company estimate. That is the right tradeoff for
    this report.'
  claimRefs:
  - CO003
  - CO005
  - CO006
  - CO009
  - CO010
  - CO011
  - CO012
  tableRefs:
  - TO003
  figureRefs:
  - FO001
