company:
  name: Notion
chapter:
  number: 3
  title: Competitors
  summary: Maps direct, adjacent, open-source, and substitute products and tests whether Notion's breadth still creates a
    durable edge.
sections:
- id: landscape
  title: Competitive landscape
  body: The competition is broader than one incumbent. Confluence-style enterprise wiki platforms, open-source databases and
    wikis, and developer-adjacent note-taking tools all exert pressure from different directions. The point of the landscape
    is not to rank every competitor as equal; it is to show that Notion faces both direct feature competition and substitution
    from internal builds or open-source tooling. That keeps the analysis tethered to what is publicly observable today, and
    it leaves the unresolved question visible for the next refresh instead of forcing false precision into a private-company
    estimate. That is the right tradeoff for this report. That keeps the moat discussion grounded in actual switching behavior.
  claimRefs:
  - CP001
  - CP003
  - CP008
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: pricing
  title: Pricing and packaging
  body: 'The pricing battle matters as much as the feature battle. Review sources emphasize that Notion sits in the middle
    of the market: cheaper and more flexible than some suite alternatives, but more expensive than self-hosted or free open-source
    substitutes once governance and compliance are included. In enterprise deals, migration and permissioning often dominate
    the evaluation more than the nominal sticker price. That keeps the analysis tethered to what is publicly observable today,
    and it leaves the unresolved question visible for the next refresh instead of forcing false precision into a private-company
    estimate. That is the right tradeoff for this report. That keeps the moat discussion grounded in actual switching behavior.'
  claimRefs:
  - CP002
  - CP009
  - CP010
  tableRefs:
  - TP003
  figureRefs: []
- id: moat
  title: Moat durability
  body: 'The moat is real but not bulletproof. Breadth, brand, template ecosystems, and bottom-up distribution still matter.
    The counterargument is commoditization: enough substitutes can now cover a meaningful subset of the same use case that
    a weak implementation or a missing admin feature can trigger churn. The refresh therefore keeps the moat as durable-but-bounded
    rather than winner-take-all. That keeps the analysis tethered to what is publicly observable today, and it leaves the
    unresolved question visible for the next refresh instead of forcing false precision into a private-company estimate. That
    is the right tradeoff for this report. That leaves a modest but real switching cost moat. That keeps the moat discussion
    grounded in actual switching behavior.'
  claimRefs:
  - CP004
  - CP005
  - CP006
  - CP007
  - CP011
  - CP012
  tableRefs:
  - TP002
  figureRefs: []
