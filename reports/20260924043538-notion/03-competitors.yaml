- id: TP003
  title: Pricing / packaging comparison
  columns:
  - price/unit/contract model
  - included capabilities
  - discounts/unknowns
  - implication
  rows:
  - - Freemium -> paid seat tiers
    - docs, wikis, databases, AI
    - enterprise discounts opaque
    - conversion depends on team adoption
  - - AI bundled in higher tiers
    - agent and AI workflows
    - usage economics not public
    - AI can lift ARPU but complicates predictability
  - - Self-hosted / open-source
    - core wiki or DB features
    - implementation and ops cost hidden
    - cash price is low, switching friction is the real cost
  claimRefs:
