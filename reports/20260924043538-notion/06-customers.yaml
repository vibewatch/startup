company:
  name: Notion
chapter:
  number: 6
  title: Customers
  summary: Assesses who uses the product, what proof exists for real adoption, and how durable the customer base looks.
sections:
- id: segments
  title: Customer segmentation
  body: 'The customer base is still easiest to think about as a funnel: individuals discover the product, startup teams standardize
    on it, and enterprise admins or function owners eventually govern it. The strongest evidence is in the public customer
    stories and official enterprise claims, which show that the product is now used in production workflows rather than as
    a novelty note-taking app. That said, the exact customer concentration profile is still opaque. That keeps the analysis
    tethered to what is publicly observable today, and it leaves the unresolved question visible for the next refresh instead
    of forcing false precision into a private-company estimate. That is the right tradeoff for this report. That keeps the
    customer thesis grounded in public proof while preserving the concentration questions that still need management data.'
  claimRefs:
  - CU001
  - CU002
  - CU005
  tableRefs:
  - TU001
  figureRefs: []
- id: adoption
  title: Adoption and expansion
  body: 'The adoption pattern still looks like classic bottom-up software: one user or team adopts, then the use case widens
    once the product becomes the team''s shared operating layer. The current evidence also suggests that AI agents can deepen
    expansion once the account is already warm. That means customer success is not just about keeping seats; it is about turning
    one useful workspace into the default place where the team works. That keeps the analysis tethered to what is publicly
    observable today, and it leaves the unresolved question visible for the next refresh instead of forcing false precision
    into a private-company estimate. That is the right tradeoff for this report. That keeps the customer thesis grounded in
    public proof while preserving the concentration questions that still need management data.'
  claimRefs:
  - CU003
  - CU004
  - CU006
  - CU008
  - CU010
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: proof
  title: Named proof and gaps
  body: 'Official customer pages and third-party case studies provide enough proof to say the product is in real production
    use. The gap is precision: the refresh still lacks a public named-account rollup, NRR, or a concentration table that would
    let an investor quantify how durable the base really is. So the customer picture is directionally strong but not fully
    underwritten. That keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved question
    visible for the next refresh instead of forcing false precision into a private-company estimate. That is the right tradeoff
    for this report. That keeps the customer thesis grounded in public proof while preserving the concentration questions
    that still need management data.'
  claimRefs:
  - CU003
  - CU009
  - CU011
  - CU012
  tableRefs:
  - TU003
  figureRefs: []
