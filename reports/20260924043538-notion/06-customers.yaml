- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  data:
    items:
    - label: Discovery (Free Tier)
      description: Individual user adopts free plan for personal notes, tasks, or portfolio.
    - label: Team Invitation (Free to Plus)
      description: User invites teammates and upgrades when the free plan becomes constraining.
    - label: Organizational Adoption (Business)
      description: Team standardizes on Notion for shared docs, databases, and coordination.
    - label: Enterprise Governance (Enterprise)
      description: IT / security reviews SSO, SCIM, audit, and policy controls.
    - label: AI Expansion (Custom Agents)
      description: Teams deploy agents for repetitive workflows and credit consumption grows.
    - label: Renewal / expansion
      description: Existing workspaces widen to more departments and use cases.
