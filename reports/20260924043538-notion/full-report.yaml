              most: gross margin, NRR, and a clear burn / runway picture. The available commentary suggests the business
              is healthy enough to avoid a new primary round, but that is not the same as proving clean unit economics.
              The refresh therefore treats the capital stack as supportive but not fully observable. That keeps the
              analysis tethered to what is publicly observable today, and it leaves the unresolved question visible for
