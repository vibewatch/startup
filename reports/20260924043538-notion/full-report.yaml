            body: >-
              The customer base is still easiest to think about as a funnel: individuals discover the product, startup
              teams standardize on it, and enterprise admins or function owners eventually govern it. The strongest
              evidence is in the public customer stories and official enterprise claims, which show that the product is
              now used in production workflows rather than as a novelty note-taking app. That said, the exact customer
              concentration profile is still opaque. That keeps the analysis tethered to what is publicly observable
