        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The architecture story is now a mix of browser, desktop, integration, and AI layers. Public discussion
              around WASM SQLite and native storage paths suggests the team keeps optimizing around the same challenge:
              keep the collaborative workspace fast enough while preserving flexibility. That makes the operating model
              hybrid rather than purely SaaS in the shallow sense. The product is still cloud-first, but some
              performance-critical paths are clearly closer to client-side systems engineering than to a simple CRUD
              app. That keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved
              question visible for the next refresh instead of forcing false precision into a private-company estimate.
              That is the right tradeoff for this report. The important tradeoff is between breadth, speed, and control,
              and the public evidence still says breadth is winning.
