chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              Notion remains best understood as a single workspace layer that bundles notes, wikis, databases, project
              coordination, and AI tools. The current refresh keeps the company in the late-stage private bucket: it is
              not public, it continues to sell a freemium seat-based product, and the public narrative now revolves
              around AI agents rather than only note-taking. The evidence base is strong on positioning and weaker on
              the exact operating metrics, which is normal for a private company that does not publish full financials.
              That keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved
              question visible for the next refresh instead of forcing false precision into a private-company estimate.
              That is the right tradeoff for this report.
