  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The risk profile is dominated by product quality, trust, and substitution rather than by a single
              catastrophic legal case. That is important: for collaboration software, small reliability issues can
              compound because the product sits in the center of team workflows. The risk register therefore prioritizes
              downtime, data access, and agent safety above abstract macro concerns. That keeps the analysis tethered to
              what is publicly observable today, and it leaves the unresolved question visible for the next refresh
              instead of forcing false precision into a private-company estimate. That is the right tradeoff for this
              report. The risk picture remains concentrated in workflows that users already treat as mission-critical,
              so small failures can have outsized retention effects.
