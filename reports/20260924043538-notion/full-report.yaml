        title: Adoption and expansion
        blocks:
          - type: paragraph
            body: >-
              The adoption pattern still looks like classic bottom-up software: one user or team adopts, then the use
              case widens once the product becomes the team's shared operating layer. The current evidence also suggests
              that AI agents can deepen expansion once the account is already warm. That means customer success is not
              just about keeping seats; it is about turning one useful workspace into the default place where the team
              works. That keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved
              question visible for the next refresh instead of forcing false precision into a private-company estimate.
