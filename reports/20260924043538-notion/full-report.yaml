        title: Operational / dependency / financial risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is the most visible because user complaints are easy to find and because browser
              performance is part of the product experience. Dependency risk is also real: open-source substitutes,
              competitor suites, and local workflows can all become exit routes if the product feels slow or
              over-automated. Financially, the same opaque margin questions from the financial chapter still matter
              because AI and cloud costs can turn product complexity into cost complexity. That keeps the analysis
