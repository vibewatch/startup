        title: Legal / regulatory / privacy
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory story is mostly about privacy, access control, and the way AI agents interact
              with customer data. There is no public evidence of a major enforcement action in the current refresh, but
              that should not be mistaken for zero exposure. As soon as more autonomous behavior and more integrations
              enter the workflow, the compliance burden rises. That keeps the analysis tethered to what is publicly
