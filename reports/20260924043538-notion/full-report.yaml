  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              The competition is broader than one incumbent. Confluence-style enterprise wiki platforms, open-source
              databases and wikis, and developer-adjacent note-taking tools all exert pressure from different
              directions. The point of the landscape is not to rank every competitor as equal; it is to show that Notion
              faces both direct feature competition and substitution from internal builds or open-source tooling. That
              keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved question
              visible for the next refresh instead of forcing false precision into a private-company estimate. That is
              the right tradeoff for this report. That keeps the moat discussion grounded in actual switching behavior.
            claimRefs:
              - CP001
              - CP003
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
