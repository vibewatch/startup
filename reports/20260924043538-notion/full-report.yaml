      - number: '4.3'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The financial picture remains attractive on growth and brand but opaque on margin quality. The business
              appears to be monetizing its user base better than it did a year earlier, and private-market buyers still
              value the company at a premium. But the absence of audited metrics and the uncertainty around AI share,
              gross margin, and churn keep the report from claiming a fully de-risked model. That keeps the analysis
              tethered to what is publicly observable today, and it leaves the unresolved question visible for the next
