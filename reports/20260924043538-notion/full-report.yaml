      - number: '3.2'
        title: Pricing and packaging
        blocks:
          - type: paragraph
            body: >-
              The pricing battle matters as much as the feature battle. Review sources emphasize that Notion sits in the
              middle of the market: cheaper and more flexible than some suite alternatives, but more expensive than
              self-hosted or free open-source substitutes once governance and compliance are included. In enterprise
              deals, migration and permissioning often dominate the evaluation more than the nominal sticker price. That
              keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved question
              visible for the next refresh instead of forcing false precision into a private-company estimate. That is
              the right tradeoff for this report. That keeps the moat discussion grounded in actual switching behavior.
            claimRefs:
              - CP002
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP004
      - number: '3.3'
        title: Moat durability
        blocks:
          - type: paragraph
            body: >-
              The moat is real but not bulletproof. Breadth, brand, template ecosystems, and bottom-up distribution
              still matter. The counterargument is commoditization: enough substitutes can now cover a meaningful subset
              of the same use case that a weak implementation or a missing admin feature can trigger churn. The refresh
              therefore keeps the moat as durable-but-bounded rather than winner-take-all. That keeps the analysis
              tethered to what is publicly observable today, and it leaves the unresolved question visible for the next
              refresh instead of forcing false precision into a private-company estimate. That is the right tradeoff for
              this report. That leaves a modest but real switching cost moat. That keeps the moat discussion grounded in
              actual switching behavior.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP011
