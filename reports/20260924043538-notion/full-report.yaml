  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition
        blocks:
          - type: paragraph
            body: >-
              Notion is now a broad workspace substrate rather than a simple note app. The customer-facing story is
              about docs, databases, project coordination, and AI all living in the same place. That breadth is the
              product's largest advantage because it makes the workspace sticky, but it also creates a larger testing
              and support burden than a narrower point solution would carry. That keeps the analysis tethered to what is
              publicly observable today, and it leaves the unresolved question visible for the next refresh instead of
              forcing false precision into a private-company estimate. That is the right tradeoff for this report. The
              important tradeoff is between breadth, speed, and control, and the public evidence still says breadth is
              winning.
