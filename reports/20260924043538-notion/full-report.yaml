      - number: '5.3'
        title: Reliability, support, and trust
        blocks:
          - type: paragraph
            body: >-
              Trust controls matter more as the product gets closer to enterprise operations. The company publishes
              adoption guidance and access troubleshooting, which is normal for a scaled collaboration platform. The
              unresolved question is not whether the product is useful; it is whether the trust, privacy, and
              agent-safety layer has matured as quickly as the feature layer. That is the main technical diligence gap
              in this refresh. That keeps the analysis tethered to what is publicly observable today, and it leaves the
              unresolved question visible for the next refresh instead of forcing false precision into a private-company
              estimate. That is the right tradeoff for this report. The important tradeoff is between breadth, speed,
              and control, and the public evidence still says breadth is winning.
