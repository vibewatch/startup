    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Notion still looks like one of the strongest private software brands in the market. The thesis is that the
              company has enough scale, distribution, and product breadth to turn AI usage into a second growth curve.
              The anti-thesis is equally clear: the company remains opaque on the exact metrics that would let an
              investor underwrite the premium without hand-waving. That keeps the analysis tethered to what is publicly
              observable today, and it leaves the unresolved question visible for the next refresh instead of forcing
              false precision into a private-company estimate. That is the right tradeoff for this report. The right
              posture is constructive but disciplined: the company is strong, but the entry price already reflects a lot
