  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and pricing
        blocks:
          - type: paragraph
            body: >-
              Notion's financial model is still best described as freemium seat SaaS with a growing AI layer. The
              important shift in this refresh is that AI is no longer a standalone curiosity; it is part of the pricing
              architecture that lifts seats into higher-priced tiers and then adds credit-based usage on top. That makes
              revenue more elastic, but also less predictable than a pure per-seat model. That keeps the analysis
              tethered to what is publicly observable today, and it leaves the unresolved question visible for the next
              refresh instead of forcing false precision into a private-company estimate. That is the right tradeoff for
              this report. The model is attractive on growth but still too opaque on margins for a clean underwriting
              story.
