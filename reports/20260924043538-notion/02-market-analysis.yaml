company:
  name: Notion
chapter:
  number: 2
  title: Market Analysis
  summary: Defines the market boundary, buyer structure, adoption drivers, and the evidence-constrained sizing lens for the
    company.
sections:
- id: boundary
  title: Market boundary and substitutes
  body: Notion does not live in a clean single-purpose software market. It sits at the intersection of note-taking, wiki software,
    lightweight databases, project coordination, and AI workspace tools. That makes the category bigger than a classical docs
    app and smaller than a full suite replacement. The right diligence move is to define the market by the buyer's job-to-be-done
    and by the software stack that would be replaced if Notion wins the account. That keeps the analysis tethered to what
    is publicly observable today, and it leaves the unresolved question visible for the next refresh instead of forcing false
    precision into a private-company estimate. That is the right tradeoff for this report.
  claimRefs:
  - CM001
  - CM003
  - CM011
  tableRefs:
  - TM001
  figureRefs: []
- id: size
  title: Sizing lenses
  body: 'No single source gives a clean audited TAM for this product. Instead, the refresh uses multiple lenses: broad workspace
    and collaboration spending, adjacent database/no-code tools, and the share of that market that plausibly converts through
    a freemium bottom-up funnel. The broad conclusion is not that Notion has saturated the market; it is that its current
    revenue remains a small slice of a very large, very fragmented spend pool. That keeps the analysis tethered to what is
    publicly observable today, and it leaves the unresolved question visible for the next refresh instead of forcing false
    precision into a private-company estimate. That is the right tradeoff for this report.'
  claimRefs:
  - CM005
  - CM006
  - CM010
  - CM012
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: adoption
  title: Buyer path and constraints
  body: The product still spreads from individual users upward. That is why the most important market constraint is not awareness;
    it is the jump from personal use to governance-heavy team use. Teams upgrade when they need permissions, admin controls,
    version history, and AI access. They stall when enterprise suites already sit in procurement, or when open-source and
    self-hosted tools can satisfy the workflow at lower cash cost. That keeps the analysis tethered to what is publicly observable
    today, and it leaves the unresolved question visible for the next refresh instead of forcing false precision into a private-company
    estimate. That is the right tradeoff for this report.
  claimRefs:
  - CM002
  - CM004
  - CM007
  - CM008
  - CM009
  tableRefs:
  - TM003
  figureRefs: []
