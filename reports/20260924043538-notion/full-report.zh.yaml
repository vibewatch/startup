              已用于实际生产工作流。本次更新的缺口在数据精度：仍缺少公开的具名客户汇总、净留存率（NRR）和客户集中度表，投资者难以量化客户基础的稳固程度。因此，客户情况整体看强，但证据还不足以支持完整的投资判断。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。客户投资逻辑有公开证据支撑，但集中度问题仍需管理层数据回答。
            claimRefs:
              - CU003
              - CU009
              - CU011
              - CU012
