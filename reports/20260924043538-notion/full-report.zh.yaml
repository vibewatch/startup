          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV011
      - number: '8.2'
        title: 投资建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              本次更新维持建设性、但不盲目乐观的建议。$11B 私募要约收购定价确有其事，但相对于目前披露的指标，公司仍然昂贵，核心财务数据也只披露了一部分。Notion
              凭借强劲的产品和改善中的变现能力，理应享有溢价；但估值模型已充分计入这份溢价。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。审慎而建设性的判断是：公司基本面强，但入场价格已计入不少利好。
            claimRefs:
              - CV003
              - CV005
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求 AI 捆绑和智能体继续推高每用户平均收入（ARPU），同时不损害用户信任。基准情景假设公司稳健增长，一级市场溢价估值大致持平。悲观情景则是典型的 SaaS
              困局：定价承压、留存走弱，传统办公套件的捆绑竞争又进一步挤压，最终导致估值倍数收缩。本次更新没有找到足够可靠的公开可比公司，因此做情景分析比在数据不足时假装精确更有用。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。审慎而建设性的判断是：公司基本面强，但入场价格已计入不少利好。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
