  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Notion 仍是市场上品牌最强的非上市软件公司之一。看多逻辑是，公司规模、分发能力和产品覆盖面足够大，有望把 AI
              使用转化为第二条增长曲线。反方逻辑也很清楚：关键指标仍不透明，投资者很难不靠猜测就把溢价纳入判断。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。审慎而建设性的判断是：公司基本面强，但入场价格已计入不少利好。
            claimRefs:
              - CV001
              - CV002
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
