              年更新显示，公司延续分布式招聘；招聘页面和客户案例反映团队仍在运作，用户覆盖面也广。员工人数是目前最不可靠的指标：第三方估算分歧过大，无法认定任何一个数字，因此本报告将其保留为证据缺口，不报出看似精确的数值。本报告以公开信息为界，把未解问题留待下次更新，不拿私企估算冒充精确数据；这是更合适的取舍。
