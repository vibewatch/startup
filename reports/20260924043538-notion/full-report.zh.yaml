  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Notion 所处的并非边界清晰的单一用途软件市场，而是笔记、wiki、轻量数据库、项目协同和 AI
              工作区工具的交汇处。这一品类覆盖面宽于传统文档应用，但比整套企业办公套件的替代市场更窄。划定市场时，应看买方要完成什么任务（job-to-be-done），以及 Notion
              若赢下客户，会替换对方软件栈中的哪些工具。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。
