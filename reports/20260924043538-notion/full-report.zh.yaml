      - number: '2.2'
        title: 市场测算视角
        blocks:
          - type: paragraph
            body: >-
              没有单一来源能给出清晰、经审计的总可用市场（TAM）。本次更新因此采用几种口径：广义工作区与协同支出、相邻的数据库和无代码工具，以及免费增值自下而上漏斗有望转化的那部分市场。重点不是断言 Notion
              已触及市场天花板，而是看到其当前收入在庞大、分散的总支出中仍只占一小部分。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。
