  - id: FU001
    title: 客户旅程图
    type: journey-map
    data:
      items:
        - label: 发现期（免费版）
          description: 个人用户用免费版记笔记、管任务或搭建作品集。
        - label: 团队邀请（免费版升级至 Plus）
          description: 用户邀请团队成员，并在免费版额度受限时选择升级。
        - label: 组织内推广（Business 版）
          description: 团队把 Notion 定为共享文档、数据库和协作的标准工具。
        - label: 企业级治理（Enterprise 版）
          description: IT 与安全团队审查 SSO、SCIM、审计及策略管控。
        - label: AI 拓展（Custom Agents）
          description: 团队部署智能体处理重复工作流，点数用量随之增加。
        - label: 续约 / 扩张
          description: 现有工作区逐步拓展至更多部门与业务场景。
