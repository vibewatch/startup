          to: rev
          label: ARPU 提升
        - from: ai
          to: rev
          label: ARR 提升
        - from: paid
          to: rev
          label: 留存 / 增购
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI006
    summary: 该图显示，Notion 不改产品驱动的分发模式，也能进一步提升变现。
