      - number: '2.3'
        title: 购买路径与制约因素
        blocks:
          - type: paragraph
            body: >-
              Notion 仍从个人用户向上扩散。市场的主要约束不是知名度，而是产品能否从个人使用跨到治理要求更高的团队场景。团队需要权限、管理员控制、版本历史和 AI
              访问权限时会升级；如果企业套件已进入采购清单，或开源、自托管工具能以更低现金成本满足工作流，采购就可能停滞。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。
