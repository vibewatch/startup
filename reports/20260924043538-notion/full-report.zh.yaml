  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重度排序的风险全景
        blocks:
          - type: paragraph
            body: >-
              风险主要来自产品质量、信任和替代竞争，而非某起灾难性诉讼。协同软件处在团队工作流的核心，细小的稳定性问题也可能层层放大。因此，风险清单优先关注服务宕机、数据访问和智能体安全，而不是抽象的宏观担忧。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。风险集中在用户视为关键任务的工作流中，小故障也可能显著影响客户留存。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
