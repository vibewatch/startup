              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 法律、监管与隐私风险
        blocks:
          - type: paragraph
            body: >-
              法律和监管风险主要涉及隐私、访问控制，以及 AI
              智能体如何与客户数据交互。本次更新没有发现重大执法行动的公开证据，但不能因此认为风险敞口为零。更多自主行为和外部集成一旦进入工作流，合规负担就会增加。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。风险集中在用户视为关键任务的工作流中，小故障也可能显著影响客户留存。
            claimRefs:
              - CR004
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR008
      - number: '7.3'
        title: 运营、外部依赖与财务风险
        blocks:
          - type: paragraph
            body: >-
              运营风险最容易观察：公开渠道不难找到用户抱怨，浏览器性能也直接影响产品体验。依赖风险同样真实存在；如果产品变慢或自动化过度，开源替代品、竞品套件和本地工作流都可能成为用户的替代选择。财务方面，利润率不透明仍是关键问题，因为
              AI 和云服务成本会把产品复杂度转化为成本压力。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。风险集中在用户视为关键任务的工作流中，小故障也可能显著影响客户留存。
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR012
