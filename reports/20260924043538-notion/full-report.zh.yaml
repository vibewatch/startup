              收入占比、毛利率和客户流失情况也不确定，因此本报告不能断言其商业模式已充分消除风险。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。增长逻辑有吸引力，但利润率仍不透明，投资判断难以落地。
