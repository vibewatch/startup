        title: 业务定位与属性
        blocks:
          - type: paragraph
            body: >-
              判断 Notion，首先要把它看作整合笔记、wiki、数据库、项目协同与 AI 工具的一体化工作区。公司仍是后期非上市企业，销售按席位收费的免费增值产品；如今公开叙事已从笔记扩展到 AI
              智能体。公开资料足以说明产品定位，却不足以精确衡量运营表现——对不披露完整财务数据的私企而言，这并不意外。本报告以公开信息为界，把未决问题留待下次更新，不用估算冒充精确数据；这是更合适的取舍。
