  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与定价结构
        blocks:
          - type: paragraph
            body: >-
              Notion 的财务模式仍可概括为免费增值、按席位收费的 SaaS，并叠加不断扩大的 AI 层。本次更新的重要变化是：AI
              不再只是独立的尝鲜功能，而是进入定价体系，推动客户升级到更高价位的席位方案，并在此基础上增加按点数计费的用量。这让收入更有弹性，但比纯席位模式更难预测。本报告以公开信息为界，把未决问题留待下次更新，不用私企估算冒充精确值；这是更合适的取舍。增长逻辑有吸引力，但利润率仍不透明，投资判断难以落地。
