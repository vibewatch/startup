  name: Notion
chapter:
  number: 5
  title: Product & Technology
  summary: Explains the product surface, architecture, deployment shape, and the main reliability and trust tradeoffs.
sections:
- id: product
  title: Product definition
  body: Notion is now a broad workspace substrate rather than a simple note app. The customer-facing story is about docs,
    databases, project coordination, and AI all living in the same place. That breadth is the product's largest advantage
    because it makes the workspace sticky, but it also creates a larger testing and support burden than a narrower point solution
    would carry. That keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved question
    visible for the next refresh instead of forcing false precision into a private-company estimate. That is the right tradeoff
    for this report. The important tradeoff is between breadth, speed, and control, and the public evidence still says breadth
    is winning.
  claimRefs:
  - CE001
  - CE006
  - CE012
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: architecture
  title: Architecture and operating model
  body: 'The architecture story is now a mix of browser, desktop, integration, and AI layers. Public discussion around WASM
    SQLite and native storage paths suggests the team keeps optimizing around the same challenge: keep the collaborative workspace
    fast enough while preserving flexibility. That makes the operating model hybrid rather than purely SaaS in the shallow
    sense. The product is still cloud-first, but some performance-critical paths are clearly closer to client-side systems
    engineering than to a simple CRUD app. That keeps the analysis tethered to what is publicly observable today, and it leaves
    the unresolved question visible for the next refresh instead of forcing false precision into a private-company estimate.
    That is the right tradeoff for this report. The important tradeoff is between breadth, speed, and control, and the public
    evidence still says breadth is winning.'
  claimRefs:
  - CE003
  - CE004
  - CE010
  tableRefs:
  - TE002
  - TE003
  figureRefs: []
- id: trust
  title: Reliability, support, and trust
  body: Trust controls matter more as the product gets closer to enterprise operations. The company publishes adoption guidance
    and access troubleshooting, which is normal for a scaled collaboration platform. The unresolved question is not whether
    the product is useful; it is whether the trust, privacy, and agent-safety layer has matured as quickly as the feature
    layer. That is the main technical diligence gap in this refresh. That keeps the analysis tethered to what is publicly
    observable today, and it leaves the unresolved question visible for the next refresh instead of forcing false precision
    into a private-company estimate. That is the right tradeoff for this report. The important tradeoff is between breadth,
    speed, and control, and the public evidence still says breadth is winning.
  claimRefs:
  - CE002
  - CE005
  - CE008
  - CE011
  tableRefs: []
  figureRefs: []
