    - latency and main-thread load
  - - Storage layer
    - persist pages, databases, and local state
    - SQLite / storage design
    - offline / sync edge cases
  - - Integrations
    - connect code and external work
    - GitHub and other connectors
    - permissioning and data leakage
  - - AI layer
    - draft, summarize, and act
    - models and credits
    - safety, cost, and determinism
