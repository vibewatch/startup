company:
  name: Notion
chapter:
  number: 7
  title: Risks
  summary: Ranks the operational, legal, dependency, and financial risks that matter most for the current refresh.
sections:
- id: severity
  title: Severity-ranked risk picture
  body: 'The risk profile is dominated by product quality, trust, and substitution rather than by a single catastrophic legal
    case. That is important: for collaboration software, small reliability issues can compound because the product sits in
    the center of team workflows. The risk register therefore prioritizes downtime, data access, and agent safety above abstract
    macro concerns. That keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved question
    visible for the next refresh instead of forcing false precision into a private-company estimate. That is the right tradeoff
    for this report. The risk picture remains concentrated in workflows that users already treat as mission-critical, so small
    failures can have outsized retention effects.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: legal
  title: Legal / regulatory / privacy
  body: The legal and regulatory story is mostly about privacy, access control, and the way AI agents interact with customer
    data. There is no public evidence of a major enforcement action in the current refresh, but that should not be mistaken
    for zero exposure. As soon as more autonomous behavior and more integrations enter the workflow, the compliance burden
    rises. That keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved question visible
    for the next refresh instead of forcing false precision into a private-company estimate. That is the right tradeoff for
    this report. The risk picture remains concentrated in workflows that users already treat as mission-critical, so small
    failures can have outsized retention effects.
  claimRefs:
  - CR004
  - CR010
  tableRefs:
  - TR002
  figureRefs: []
- id: operational
  title: Operational / dependency / financial risk
  body: 'Operational risk is the most visible because user complaints are easy to find and because browser performance is
    part of the product experience. Dependency risk is also real: open-source substitutes, competitor suites, and local workflows
    can all become exit routes if the product feels slow or over-automated. Financially, the same opaque margin questions
    from the financial chapter still matter because AI and cloud costs can turn product complexity into cost complexity. That
    keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved question visible for the
    next refresh instead of forcing false precision into a private-company estimate. That is the right tradeoff for this report.
    The risk picture remains concentrated in workflows that users already treat as mission-critical, so small failures can
    have outsized retention effects.'
  claimRefs:
  - CR005
  - CR006
  - CR008
  - CR009
  - CR012
  tableRefs:
  - TR003
  figureRefs: []
