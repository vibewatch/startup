  title: Valuation
  summary: Turns the evidence into a recommendation, valuation stance, scenarios, and the remaining diligence asks.
sections:
- id: thesis
  title: Investment thesis and anti-thesis
  body: 'Notion still looks like one of the strongest private software brands in the market. The thesis is that the company
    has enough scale, distribution, and product breadth to turn AI usage into a second growth curve. The anti-thesis is equally
    clear: the company remains opaque on the exact metrics that would let an investor underwrite the premium without hand-waving.
    That keeps the analysis tethered to what is publicly observable today, and it leaves the unresolved question visible for
    the next refresh instead of forcing false precision into a private-company estimate. That is the right tradeoff for this
    report. The right posture is constructive but disciplined: the company is strong, but the entry price already reflects
    a lot of the good news.'
  claimRefs:
  - CV001
  - CV002
  tableRefs:
  - TV001
  - TV002
  figureRefs: []
- id: valuation
  title: Recommendation and valuation stance
  body: 'The refresh keeps the recommendation constructive rather than euphoric. The private tender at $11B is real, but it
    does not erase the fact that the company is still expensive relative to current disclosed metrics and that the core financials
    are only partially visible. The right interpretation is that the company deserves a premium because the product is strong
    and monetization is improving, but the premium is already doing a lot of work in the model. That keeps the analysis tethered
    to what is publicly observable today, and it leaves the unresolved question visible for the next refresh instead of forcing
    false precision into a private-company estimate. That is the right tradeoff for this report. The right posture is constructive
    but disciplined: the company is strong, but the entry price already reflects a lot of the good news.'
  claimRefs:
  - CV003
  - CV005
  - CV010
  - CV012
  tableRefs:
  - TV003
  figureRefs:
  - FV001
- id: scenarios
  title: Bull / base / bear cases
  body: 'The bull case requires AI bundling and agents to keep expanding ARPU without degrading trust. The base case assumes
    healthy growth and a premium private valuation that remains roughly stable. The bear case is a familiar SaaS story: pricing
    pressure, weaker retention, and suite bundling compress the multiple. The refresh does not produce a clean public comp
    set, so scenario work is more useful than pretending precision exists where it does not. That keeps the analysis tethered
    to what is publicly observable today, and it leaves the unresolved question visible for the next refresh instead of forcing
    false precision into a private-company estimate. That is the right tradeoff for this report. The right posture is constructive
    but disciplined: the company is strong, but the entry price already reflects a lot of the good news.'
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV009
  - CV011
  tableRefs: []
  figureRefs: []
