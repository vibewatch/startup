            body: >-
              Interos 还承担有意义的依赖风险。公开足迹显示 AWS Marketplace 分销、iQ 对 ERP 系统的依赖，以及更大产品套件中由 Dataminr 关联的声誉风险能力，因此执行不仅依赖
