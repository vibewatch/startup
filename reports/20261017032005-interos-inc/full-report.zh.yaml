      - number: '3.3'
        title: 定价、既有厂商与切换现实
        blocks:
          - type: paragraph
            body: >-
              直接同业的公开定价仍不透明。SelectHub 和 Procurement AI Agents 都把 Interos 描述为按报价、面向企业，而非公开列价；同一比较资料称 Resilinc 和
              Everstream 也采用定制化企业定价。这限制了公开可比性，使尽调转向合同范围、模块、供应商数量和部署负担。既有套件厂商仍是现实替代方案：已经标准化使用 SAP、Oracle
              或类似采购栈的买方，可能为了更低的集成和治理摩擦而接受较浅的专业覆盖。公开记录还表明，Interos 仍需要买方自行尽调数据依赖、集成和控制权，而不是端到端替代这些任务。
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP009
              - CP013
      - number: '3.4'
        title: 持久性判断
        blocks:
          - type: paragraph
            body: >-
              当快速上线、广泛风险领域覆盖和产品级追踪比供应商验证深度更重要时，Interos
              似乎有差异化优势。对拥有广泛供应商基础的大型企业和公共部门买家而言，这是可信的切入点，尤其是近期发布能把风险信号接入财务与合规工作流时。公开风险在于，本材料池没有独立验证图谱准确性、层级完整性、预测表现或客户实际成果。这给
              Resilinc 留出了凭验证深度取胜的空间，给 Everstream 留出了凭预测优先场景取胜的空间，也让既有套件厂商可以靠捆绑压低独立采购支出。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP011
              - CP013
