      - number: '4.2'
        title: 上市动作与价值证明
        blocks:
          - type: paragraph
            body: >-
              证据指向高接触式企业和政府销售，而不是自助获客。ERP Research 称没有免费试用；AWS 列表引导买家向销售申请私有报价，并声称部署可在两周内完成。公司提供的 AWS 案例称，一支采购团队的尽调时间减少
              20%，另一家客户的外部咨询成本和外联工作减少
              60%。这些案例可作销售效率和客户价值代理指标，但不是经审计的单位经济学：基线、客户身份、测量窗口、合同金额、实施人力和样本代表性均未披露。管理层应把这些结果说法与赢单率、销售周期、CAC、回本期、扩张和留存队列连接起来。
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
              - CI012
      - number: '4.3'
        title: 成本结构与单位经济学
        blocks:
          - type: paragraph
            body: >-
              Interos 称其平台持续映射超过 2.5
              亿家公司和数十亿条关系，产品页面则描述六类受监控风险和多个专业模块。这种交付模式意味着数据获取、云处理、模型运营、产品开发、安全、客户成功和实施成本都可能不低，但指定来源没有给出量化成本拆分。快速部署和工作流自动化可能支撑有吸引力的软件经济学，但公开成果轶事无法证明毛利率或回本期。因此，尽调模型应将毛利率、CAC、回本期、NRR、服务收入占比和贡献利润留空，而不是套用可能不适用于数据许可、渠道费用或政府支持要求的
              SaaS 基准。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI011
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI014
      - number: '4.4'
        title: 资本充足性与财务判断
        blocks:
          - type: paragraph
            body: >-
              ERP Research 报道 Interos 已募资接近 2.9 亿美元，其中包括 2024 年 10 月的 4,000 万美元战略成长轮；但募资额不是可用现金，也不能证明当前
              runway。指定来源均未披露现金、烧钱、runway、债务余额、契约、认股权证或资金计划用途，也没有提供经审计的收入、ARR、毛利率或 NRR。一篇低声誉私募市场文章声称 2026
              年收购及详细运营指标，但没有指定的公司公告、买方公告、申报文件或可靠报道佐证，因此不纳入投资判断。财务结论应保持谨慎：变现机制和客户价值可见，但没有管理层证据，就无法判断收入质量、利润率变化、资本强度和融资依赖。
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 财务投资判断阻碍
            body: 不要把募资额换算成可用流动性，也不要接受未经佐证的交易指标。在确定财务或估值判断前，应取得经审计的收入和 ARR 桥接、毛利与 NRR 队列、现金到 runway 的排程，以及完整债务条款。
            calloutType: risk
            claimRefs:
              - CI013
