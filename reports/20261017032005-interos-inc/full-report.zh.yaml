      - number: '8.3'
        title: 情景框架、下行触发因素与尽调要求
        blocks:
          - type: paragraph
            body: >-
              情景差异较少取决于 Interos 是否解决真实问题，更多取决于故事下方有多少已验证的经济质量。乐观情景需要传闻中的 Vista
              价格被证实真实，或至少方向上合理；随后管理层还需证明，即使软件市场估值压缩，收入质量、留存和利润率仍足以支撑溢价倍数。基准情景假设平台具有战略相关性且有融资支持，但投资者在给予持久的独立估值前，仍需要硬 KPI
              披露。悲观情景不是产品崩溃，而是为一家真实 ARR、毛利率、续约表现或优先股堆叠最终明显弱于市场叙事的企业支付战略稀缺性价格。因此，关键尽调关口是当前交易文件、经审计 SaaS 指标和完整融资条款。
