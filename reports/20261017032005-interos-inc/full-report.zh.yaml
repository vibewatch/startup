          detail: itracing 和其他模块可以扩大使用范围，但附加销售定价和扩张 ARR 尚未披露。
        - id: customer-outcomes
          label: 工作流与成本结果
          detail: 公司发布的案例称，尽调速度更快，咨询或外联负担更低。
        - id: financial-gap
          label: 收入与毛利转换
          detail: 确认收入、毛利率、服务收入组合、渠道费用和贡献毛利均不可得。
    approximationNotes: 该顺序是定性描述，不代表比例数值、转化率或量化的累计桥接。
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
      - CI008
      - CI009
      - CI010
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据指向由数据摄取、图谱建模和应用套件组成的技术栈，而不是单一的风险仪表盘。
    data:
      layers:
        - label: 外部数据源
          detail: 公开、专有和事件数据为供应商映射及风险更新提供输入。
          modules:
            - label: 公开来源
            - label: 专有来源
            - label: 真实世界情景 / 事件数据
          outputs:
            - label: Supplier and event inputs
        - label: 关系图谱
          detail: AI/ML 创建一张持续更新的全球多层级商业关系图。
          modules:
            - label: 多层级供应商—买家映射
            - label: 实体解析
          outputs:
            - label: Extended supplier network view
        - label: 风险模型与评分
          detail: 风险模型在供应链风险的总体视图中对多个类别评分。
          modules:
            - label: 财务
            - label: ESG
            - label: 网络
            - label: 灾难 / 地缘政治 / 限制
          outputs:
            - label: Unified risk view
        - label: 核心应用
          detail: 模块层在图谱和评分基础上提供专门工作流。
          modules:
            - label: itracing
            - label: ireputation
            - label: itariffs
            - label: Resilience Watchtower
          outputs:
            - label: Role-specific risk workflows
        - label: 功能解决方案
          detail: 官方解决方案页面按采购、网络、合规、映射和第三方风险团队描述使用场景。
          modules:
            - label: 采购风险
            - label: 网络韧性
            - label: 合规风险
            - label: 供应链映射 / TPRM
          outputs:
            - label: Team-level operating views
        - label: 决策输出
          detail: 产品以可执行情报而非被动监测的形式销售。
          modules:
            - label: 谱系报告
            - label: 收入风险敞口框架
            - label: 替代供应商推荐（路线图）
          outputs:
            - label: Mitigation and compliance decisions
    approximationNotes: 架构综合了公开产品描述；现有证据无法核实内部服务边界或部署拓扑。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Interos 似乎先进入采购和公共部门风险工作流，再通过监测、合规和新产品模块扩张。
    data:
      nodes:
        - label: 政府渠道切入
          detail: Carahsoft 和 FedRAMP 相关信息将 Interos 定位于机构和国防采购中心。
          touchpoints:
            - Carahsoft public-sector listing
            - FedRAMP-cleared federal operating posture
        - label: 供应商尽调
          detail: 早期用例是预筛选和引入供应商，以识别薄弱环节和谈判议题。
          touchpoints:
            - Due diligence
            - Procurement risk
        - label: 持续监测
          detail: 部署后，Interos 会在更广泛的供应商基础上推送自动化多领域监测。
          touchpoints:
            - Continuous monitoring
            - Risk scoring across six domains
        - label: 高管与合规报告
          detail: 随后，产品会呈现董事会、监管和合规报告用例。
          touchpoints:
            - Executive reporting
            - Compliance risk
            - Third-party risk management
        - label: 产品扩张
          detail: itracing、ireputation 和 itariffs 等新模块创造交叉销售机会。
          touchpoints:
            - itracing
            - ireputation
            - itariffs
        - label: 续约与集中度检查
          detail: 由于缺少留存率和收入组合披露，公开证据在续约阶段变得稀薄。
          touchpoints:
            - NRR/GRR not disclosed
            - Customer concentration not disclosed
    approximationNotes: 旅程阶段综合自公开用例描述和模块发布信息，而非逐客户生命周期遥测数据。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU009
      - CU010
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 当集成复杂度、控制证明缺口和控制变更不确定性重叠时，排名靠前的剩余风险最高。
    data:
      columns:
        - label: 可能性
          note: 根据章节引用证据的分析师排名。
        - label: 影响
          note: 失效模式未被遏制时的业务影响。
        - label: 缓释成熟度
          note: 依据留存的公开证明，而非工作池之外的管理层声明。
        - label: 剩余敞口
          note: 结合已观察到的缓释成熟度后的判断。
      rows:
        - label: 实施 / 数据质量
          note: ERP 关联、供应商参与度和刷新频率的质量决定结果。
          values:
            - label: 高
              tone: high
              note: 留存审查明确指出复杂部署和主数据不匹配。
            - label: 高
              tone: critical
              note: 混乱的 ERP 或层级映射数据可能削弱优先级排序和缓释决策。
            - label: 中
              tone: medium
              note: iQ 和 itracing 提供缓释工作流，但落地证明仍有限。
            - label: 高
              tone: high
              note: 对规模化采用而言，这仍是最直接的论点破坏风险。
        - label: 网络 / 合规证明
          note: 联邦和受监管用例将证明门槛抬高，不能只看宽泛的产品定位。
          values:
            - label: 中
              tone: medium
              note: 留存工作池未显示公开事故，但也未核实控制证明材料。
            - label: 高
              tone: critical
              note: 控制失效会影响客户信任、采购和可审计性。
            - label: 低
              tone: adverse
              note: 留存的公开证据无法独立核实认证、SLA 或事故披露惯例。
            - label: 高
              tone: high
              note: 在尽调填补证明缺口前，剩余敞口仍处于高位。
        - label: 伙伴 / 信号依赖
          note: AWS、ERP 系统和第三方事件源会影响交付质量。
          values:
            - label: 中
              tone: medium
              note: 公开足迹可见这些依赖，但集中度没有量化。
            - label: 中高
              tone: high
              note: 连接器损坏或信号源质量下降可能扭曲客户工作流。
            - label: 中
              tone: medium
              note: 工作流设计暗示存在部分缓释，但连续性控制并未公开。
            - label: 中高
              tone: high
              note: 只有深入尽调合同和冗余情况，依赖风险才可控。
        - label: 商业规模化 / 定价
          note: 如果映射供应商、SKU 或附加模块带来的成本增速快于价值证明，扩张经济性可能恶化。
          values:
            - label: 中
              tone: medium
              note: 负面审查提示定价和续约需关注，但没有观察到公开流失。
            - label: 中高
              tone: high
              note: 即使没有产品缺陷，成本上升也会拖慢落地或压缩利润率。
            - label: 低
              tone: adverse
              note: 留存的公开证据未显示足以确认缓释效果的定价架构、留存率或服务收入组合。
            - label: 中高
              tone: high
              note: 在完成定价和留存数据尽调前，剩余敞口仍处于高位。
        - label: 公开证明点稀缺
          note: 公开评价稀少、独立客户证明有限，降低了外部核验质量。
          values:
            - label: 高
              tone: high
              note: 留存审查明确指出公开评价足迹薄弱。
            - label: 中
              tone: medium
              note: 这不证明产品薄弱，但会降低外部尽调信心。
            - label: 低
              tone: adverse
              note: 由于公开工作池缺乏规模化第三方客户证据，缓释成熟度难以核实。
            - label: 中高
              tone: high
              note: 只有尽调拿到更强的可供引用的部署案例和续约证明，剩余敞口才会下降。
        - label: 控制变更 / 交易不确定性
          note: 治理风险取决于据报的 Vista 交易是否真实以及是否按时推进。
          values:
            - label: 中
              tone: medium
              note: 只有在该交易报道属实时风险才成立，但这份报道是近期的。
            - label: 高
              tone: high
              note: 审批延迟或条款变化可能打乱路线图重点和客户沟通。
            - label: 低
              tone: adverse
              note: 由于章节缺少备案、最终协议或公司确认，留存的缓释证明很薄弱。
            - label: 高
              tone: high
              note: 在尽调确认状态、审批和融资前，剩余敞口维持高位。
    claimRefs:
      - CR010
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开产品和融资证明真实存在，但经核实的估值支撑仍然滞后。
    data:
      nodes:
        - label: 新鲜资本
          summary: January 2026 funding followed the October 2024 Blue Owl round.
          note: 赞助方支持降低近期生存风险，但不能降低估值风险。
          claimRefs:
            - CV001
            - CV002
            - CV003
        - label: 产品广度
          summary: Official materials show six risk categories plus itracing, ireputation, and itariffs.
          note: 广度支撑战略相关性和交叉销售逻辑。
          claimRefs:
            - CV004
            - CV005
        - label: 外部规模信号不一
          summary: Third-party datasets disagree on employee scale and marketed relationship counts.
          note: 二手指标可作为背景，但不足以构成精确的投资判断依据。
          claimRefs:
            - CV006
            - CV007
        - label: 单一来源估值标记
          summary: The only explicit current mark in this pool is a reported $1.05B Vista deal.
          note: 可作为参考，但尚未完全核实。
          claimRefs:
            - CV008
            - CV009
        - label: 溢价风险筛选
          summary: A 15x forward-revenue mark remains premium if revenue quality still needs proof.
          note: ARR、利润率、留存率和条款披露缺失，使下行风险仍然存在。
          claimRefs:
            - CV010
            - CV011
            - CV013
        - label: 建议
          summary: Research-more with a stretched stance until transaction documents or KPI disclosure arrive.
          note: 入场纪律比叙事热情更重要。
          claimRefs:
            - CV012
            - CV014
    claimRefs:
