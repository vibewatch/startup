            body: >-
              运营模式要求 ERP 记录、供应商图谱数据和持续刷新的外部信号之间进行困难的协调。Interos 官方发布强调 ERP 编排、下钻至 SKU
              和材料的产品级追踪，以及财务暴露工作流；但这些产品说法也意味着，比仅有仪表盘的工具承担更多集成和数据治理负担。独立评测进一步具体指出主数据不匹配、供应商响应率，以及可能随映射供应商或 SKU
