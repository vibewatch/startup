      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 立场
      - 论点
      - 什么会改变判断
    rows:
      - - 论点
        - Blue Owl 在 2024 年和 2026 年提供的资金表明，投资者仍支持该平台和产品路线图。
        - 如果出现下轮融资、繁重的资本结构或赞助方撤回支持，将削弱持续性判断。
      - - 论点
        - 官方产品证据显示，Interos 正从供应商监控扩展到产品级追踪、关税可见性和合规工作流。
        - 发布停滞、采用数据疲弱或失去主要参考客户，将缩小产品溢价论点。
      - - 反论点
        - 公开证据仍缺少经审计 ARR、毛利率、NRR、烧钱细节和经核实的独立股权估值。
        - 经审计 KPI 披露或已签交易文件将显著提升置信度。
      - - 反论点
        - 如果传闻中的 $1.05B 出售和 15x 收入倍数属实，那么对于收入质量问题尚未解决的企业，入场门槛已经很高。
        - 更低的有效入场价，或更强的留存 / 利润率证据，将降低溢价风险担忧。
    notes: 这些论点将公司质量与价格纪律分开；若披露变化而非运营势头变化，若干反论点也会随之改变。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV009
      - CV010
      - CV011
      - CV013
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - Vista 交易接近报道中的 $1.05B 价格或同等证据验证溢价定价；KPI 披露支持强劲留存和利润率。
        - 战略稀缺性和软件溢价经济性保持不变，限制当前水平的下行。
        - 单一来源的交易报道被证明不准确；KPI 材料令人失望。
        - 可能发生，但依据今日公开证据尚不足以做投资判断。
      - - 基准
        - Interos 仍具战略相关性并有融资支持，但投资者必须先验证收入质量和资本结构条款，再赋予持久估值。
        - 回报取决于披露后的纪律性入场，而不是追逐当前叙事。
        - 披露保持稀薄时价格仍有溢价，压缩上行空间。
        - 与当前证据集合最匹配。
      - - 熊市
        - 溢价估值参考被夸大，或业务的 ARR 质量、利润率或融资结构弱于公开叙事所暗示的水平。
        - 溢价倍数收缩速度快于运营证明改善速度，导致风险调整后的入场表现不佳。
        - 不透明的优先权条款或更慢的商业进展放大稀释和下行。
        - 如果尽调无法填补披露缺口，可信的下行情景。
    notes: 情景表仅用于方向性判断，不是 DCF 或可比公司模型；现有来源池没有披露足够的经核实财务细节，无法给出精确估值区间。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
