  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻支出
        blocks:
          - type: paragraph
            body: >-
              留存证据显示，Interos
              参与的是供应链风险情报，而非泛化采购软件或单点供应商审查。官方产品页面始终将平台定位为：在扩展供应商图谱上持续监控财务、ESG、网络安全、灾害、地缘政治和限制风险；独立报道则强调多层映射以及超越直接供应商的可见性。这一边界包含供应链韧性、第三方风险和采购决策支持相关支出，但排除独立
              ESG 评分、由基础合规驱动的供应商问卷，或缺乏深层供应商映射能力的广义 ERP 套件等更窄或相邻品类。Interos 在 2025 年推出
              itracing，又把可服务工作流延伸到产品级谱系和收入影响分析，在没有证明 Interos 已拥有独立市场品类的情况下，扩大了现有买方组织内的使用场景。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
