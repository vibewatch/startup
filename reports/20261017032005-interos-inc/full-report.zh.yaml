        title: 收入模型与变现
        blocks:
          - type: paragraph
            body: >-
              可观察到的模式是按报价销售的企业软件，而不是透明的按席位或按用量价目表。ERP Research 描述按报价订阅，并指出两条采购路径：企业买家通过请求联系销售，联邦买家则通过 Carahsoft 的 GSA
              SCRIPTS 一揽子采购协议。AWS Marketplace 列表又增加了协商式 Private Offer 和渠道合作伙伴 Private Offer
              路径。合起来看，这些来源说明合同按项目议价，采购也由渠道协助，但没有披露实际 ACV、合同期限、折扣、续约条款、渠道费用或收入确认政策。itracing
              对现有客户开放，因此模块附加可能是扩张机制，但公开资料没有附加率或增量价格。
