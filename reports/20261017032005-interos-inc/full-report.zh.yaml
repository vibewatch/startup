      - number: '3.2'
        title: 直接同业：覆盖面、深度与预测
        blocks:
          - type: paragraph
            body: >-
              指定比较资料对直接同业内部的差异给出了最清晰的划分。资料称，当买方希望跨多个风险领域自动完成多层映射、不愿等待供应商沟通来建立图谱时，Interos 最有优势。Resilinc 在供应商确认的 N
              层和站点级深度最重要的场景中更强，尤其适合高度依赖单一来源的供应链。Everstream 的定位更偏向中断预测分析，而不是经过验证的映射深度。Interos 在 2025—2026 年的发布，尤其是
              itracing 和 iQ，通过把中断数据连接到产品、收入暴露和 ERP 关联工作流，扩大了产品覆盖面。
            claimRefs:
