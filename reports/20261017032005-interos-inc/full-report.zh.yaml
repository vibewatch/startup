      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              公开融资信号仍然积极，但不完整。FundedIQ 记录六轮融资，披露资本总额为 1.8 亿美元，最近一轮是 2026 年 1 月宣布的 2,000 万美元。TipRanks 及其他二级报道将该轮归因于 Blue
              Owl Capital 和 Structural Capital；Supply Chain Digital 则另行报道 Blue Owl 在 2024 年 10 月投资 4,000
              万美元。这些数据点说明赞助方仍在支持，并降低近期存续风险，但无法证明新资金以什么价格完成，或资本是否附带认股权证、清算优先权、类债务契约或其他影响回报的条款。即便基础规模指标在材料池中也不精确：Beatable
              列出 109 名员工，FundedIQ 将公司置于 251—500 人区间；二级来源中的生态规模则在 110 亿和 180 亿条关系之间变化。对估值工作而言，信号方向偏正，但噪声仍太大，无法做精细投资判断。
            claimRefs:
