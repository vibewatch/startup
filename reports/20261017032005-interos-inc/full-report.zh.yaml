  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台交付内容
        blocks:
          - type: paragraph
            body: >-
              Interos 将产品定位为供应链风险情报的记录系统，而非单点监控工具。官方解决方案把供应商映射、持续监控、网络安全、合规、采购、关税和灾害风险工作流整合进一套产品；2025 年发布报道则把较新的
              itracing
              模块置于核心位置，作为从供应商级可见性扩展到产品、零件和收入暴露的路径。按工作流看，用户反复要做的是找出隐藏依赖、追踪哪些货物暴露于中断、生成可用于合规的谱系答案，以及在采购、合规和韧性团队之间排定行动优先级。覆盖面确实构成差异化，但投资判断取决于这些模块在实际部署中整合得有多紧，而不能只看营销范围。
