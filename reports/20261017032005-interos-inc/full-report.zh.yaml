      - number: '2.3'
        title: 买方地图与采用路径
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方模式是企业采购与风险负责人，尤其是拥有深层供应商网络、受监管产品或国家安全暴露的组织。独立来源和公司控制来源都指向联邦部门、国防导向项目和《财富》1000
              强企业这一核心受众，采购、供应链和合规负责人也在工作流中被明确点名。采用路径似乎从供应商网络映射和风险评分开始，再扩展到采购决策、中断监控、监管筛查以及现在的产品级追踪。这对尽调很有用，因为它表明 Interos
              可以从韧性或采购痛点切入，随后扩展到相邻工作流；但这也意味着预算可能由采购、供应链、合规和项目领导共同承担，而非集中在单一科目。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM011
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM011
              - CM013
      - number: '2.4'
        title: 采用约束、矛盾与估值相关性
        blocks:
          - type: paragraph
            body: >-
              支持品类重要性的同一批证据也暴露了采用摩擦。公开定价仍不透明，入门似乎高度依赖集成，至少一份独立评测称用户需要先培训才能让输出真正有用。这些特征符合高接触式企业品类，而非自助软件细分市场：它们可能支撑更大的合同金额，却会放慢市场扩张并使自下而上的规模估算更复杂。本章还必须延续相互矛盾的市场规模披露：部分留存来源称企业超过
              2.5 亿家、关系 110 亿条，另一些来源称供应商或公司超过 4 亿家、关系 180
              亿条。这种不一致不会否定产品相关性，却降低了简单市场份额计算的可信度，也强化了管理层需说明当前图谱覆盖、客户集中度，以及近期产品发布是在扩大钱包份额还是只是在刷新叙事。
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
