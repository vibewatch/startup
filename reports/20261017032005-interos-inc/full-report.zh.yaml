      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              公开记录没有提供多层供应链风险情报领域可辩护的独立 TAM、SAM 或 SOM，因此最稳妥的做法是使用需求和变现代理指标，而不是重复“市场很大”的泛化叙事。Interos
              自身信息强调大型企业内部的复杂性，包括引用一家具备 S&P 500 规模的公司平均拥有超过 1,700
              家供应商；独立评测报道则显示，买家愿意为专业供应商风险可见性支付有意义的合同金额。公开图谱覆盖声明提供第三个视角，但彼此冲突的 2.5 亿与 4 亿实体数、110 亿与 180
              亿关系数衡量的是数据覆盖，不是买方支出。这些代理指标说明运营问题广泛，单个企业合同也可能很可观，但无法分离出当前同时有需求且有实施能力购买 Interos 的组织数量。
