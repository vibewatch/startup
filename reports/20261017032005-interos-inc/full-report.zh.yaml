  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方任务
        blocks:
          - type: paragraph
            body: >-
              同一项买方任务可以有几种解法：专业供应商风险平台、广义 ERP 或采购套件模块，或者用电子表格、季度评估和供应商沟通拼出的低技术组合。Interos
              的产品界面把公司定位为覆盖六类领域、超越直接供应商的多层供应链风险情报平台；第三方比较则把它与 Resilinc 和 Everstream
              放在专业同业集合中，而非泛化分析类别。买方真正要权衡的是：广泛的自动化图谱覆盖、经过验证的深层供应商和站点深度、预测能力，还是既有套件内更低的切换摩擦。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP013
              - CP014
