              Krantz 为 CEO、Dave DeWalt
              为董事长。这足以推断公司经历了真实的领导层交接，或至少治理结构已有实质更新，但不足以精确确定时间，也不足以区分高管管理与董事会影响力。投资者名称比控制权更清楚：Blue Owl 是披露的 2024
