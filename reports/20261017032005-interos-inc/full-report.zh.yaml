            body: >-
              最大投资判断风险不是 Interos
              是否有可销售的产品，而是技术和运营叙事有多少能被独立核验。指定材料池没有提供公开状态数据、正常运行时间承诺、实施案例细节、基准化模型表现，或公开文档、生态使用遥测等直接的开发者或实践者信号。不同来源的公开规模数字也不一致，可能意味着快速演进，也可能意味着分母定义不一致。因此，产品尽调应聚焦参考架构、安全与合规材料、客户部署证据，以及证明套件表现为一套整合的运营工作流，而不是松散拼接的相邻模块。
