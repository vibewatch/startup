chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与运营足迹
        blocks:
          - type: paragraph
            body: >-
              留存的官方材料对 Interos 的业务描述异常一致：这是一套 AI 驱动的平台，用于映射和监控扩展供应商网络，让采购、风险和合规团队在中断升级为高管层问题前采取行动。这种一致性很重要，因为后续章节可以把
              Interos 视为供应链风险情报厂商，而不是泛化的采购工作流工具。本材料池中的公开足迹最能证明产品范围和客户类型，无法充分证明经审计的运营规模。独立参考资料将公司置于 Arlington/Washington,
              DC 市场，并将成立年份追溯至 2005 年；官方及第三方材料都强调多层可见性以及大型企业或政府采用，而非自助式 SMB 使用。总部证据并不干净：一份未注明日期的简介写作 Washington,
              DC，而低声誉交易文章写作 Arlington, Virginia。本章保留这一冲突，不把两种描述压缩成单一已验证地点。
