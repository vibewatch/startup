  - id: TV001
    title: 建议摘要表
    columns:
      - 决策视角
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - research-more
        - 新资本和产品广度确实存在，但当前价格发现尚未核实。
        - 管理层分享可审计的 KPI 和估值支持前，不要据此承销买入逻辑。
      - - 置信度
        - medium
        - 战略论点清晰可见，但若干核心估值输入仍属私人信息或只有单一来源。
        - 保持尽调推进；目标回报计算避免伪精确。
      - - 风险评级
        - high
        - 回报风险来自缺少单位经济披露、可能的溢价定价和不透明融资条款。
        - 即使业务质量论点方向上偏正面，也应假设投资判断的下行风险仍在。
      - - 估值立场
        - stretched
        - 本来源池唯一明确的当前估值是报道中的 $1.05B 交易，约为预期收入的 15x。
        - 在独立确认和 KPI 对账前，将当前定价视为溢价。
      - - 入场纪律
        - document-gated
        - 只有核实 2026 年交易条款，或管理层披露 ARR、利润率、留存和优先权结构悬置后，才上调判断。
        - 尽调材料包或价格重置，可能比又一次叙事更新更快改变判断。
    notes: 本综合表仅基于公开来源信号；“stretched”反映单一来源的当前估值参考，不应视为经核实的市场出清价格。
