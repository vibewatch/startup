schemaVersion: report-v2
artifact: competitors
slug: interos-inc
runDate: 2026-10-17
company:
  name: Interos Inc.
chapter:
  number: 3
  title: Competitors
  summary: >-
    Interos is positioned most clearly against Resilinc and Everstream, with
    the public evidence splitting the category into automated breadth
    (Interos), supplier-validated depth (Resilinc), and predictive disruption
    analytics (Everstream). The competitive risk is less from a feature vacuum
    than from pricing opacity, incumbent ERP/procurement bundling, and the lack
    of independent proof on graph accuracy, tier completeness, and forecast
    quality.
sections:
  - id: landscape-and-alternatives
    title: Landscape and buyer job
    body: >-
      The same buyer job can be solved several ways: a specialist supplier-risk
      platform, a broader ERP or procurement suite module, or a lower-tech mix
      of spreadsheets, quarterly assessments, and supplier outreach. Interos's
      own product surfaces frame the company around six-domain supply-chain risk
      intelligence and multi-tier mapping beyond direct suppliers, while
      third-party comparisons place it in a specialist peer set with Resilinc
      and Everstream rather than in a generic analytics bucket. The relevant
      question for buyers is therefore which tradeoff matters most: broad
      automated graph coverage, validated sub-tier and site depth, predictive
      forecasting, or lower switching friction inside an existing suite.
    claimRefs: [CP001, CP002, CP006, CP013, CP014]
    tableRefs: [TP001]
  - id: direct-peers-and-positioning
    title: "Direct peers: breadth vs. depth vs. prediction"
    body: >-
      The assigned comparison source gives the cleanest public split inside the
      direct peer set. Interos is described as strongest when a buyer wants
      automated multi-tier mapping across many risk domains and does not want to
      wait for supplier outreach to stand up the graph. Resilinc is described as
      stronger where supplier-confirmed n-tier and site-level depth matter most,
      especially for single-source-heavy supply chains. Everstream is positioned
      more around predictive disruption analytics than around validated mapping
      depth. Interos's 2025-2026 launches, especially itracing and iQ, expand
      its footprint by linking disruption data to products, revenue exposure,
      and ERP-linked workflows.
    claimRefs: [CP003, CP004, CP006, CP007, CP008]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: pricing-incumbents-and-switching
    title: Pricing, incumbents, and switching realities
    body: >-
      Public pricing remains opaque across the direct peer set. SelectHub and
      Procurement AI Agents both describe Interos as quote-based and enterprise
      oriented rather than list-priced, and the same comparison source says
      Resilinc and Everstream also use custom enterprise pricing. That limits
      public comparability and shifts diligence toward contract scope, modules,
      supplier counts, and deployment burden. Incumbent suite vendors remain a
      real substitute because buyers already standardized on SAP, Oracle, or
      similar procurement stacks may accept shallower specialist coverage in
      exchange for lower integration and governance friction. The public record
      also suggests Interos still requires buyer diligence on data dependencies,
      integrations, and control ownership rather than replacing those tasks
      end-to-end.
    claimRefs: [CP005, CP009, CP010, CP012, CP013, CP015]
    tableRefs: [TP003]
  - id: durability-and-risk
    title: Durability verdict
    body: >-
      Interos appears differentiated when fast stand-up, broad risk-domain
      coverage, and product-level tracing matter more than supplier-validated
      depth. That is a credible wedge for large enterprises and public-sector
      buyers running wide supplier bases, especially if recent launches help tie
      risk signals to finance and compliance workflows. The public risk is that
      the source pool does not independently validate graph accuracy, tier
      completeness, prediction performance, or realized customer outcomes. That
      leaves room for Resilinc to win on verified depth, for Everstream to win
      on prediction-first use cases, and for incumbent suites to blunt
      standalone spend through bundling.
    claimRefs: [CP004, CP006, CP007, CP008, CP011, CP013]
callouts:
  - calloutType: risk
    title: Moat still needs neutral proof
    body: >-
      Public evidence supports Interos's breadth and product velocity, but the
      assigned pool does not independently prove relationship accuracy, tier
      completeness, forecast quality, or realized enterprise pricing, while
      suite incumbents can bundle adjacent risk modules into broader workflow
      contracts.
    claimRefs: [CP006, CP011, CP013]
tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale or funding signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - [Interos, direct platform, 'Blue Owl $40M financing in 2025; public customer logos include DoD, NASA, Accenture, and Freddie Mac', 'Large enterprises and federal or public-sector buyers', 'Automated multi-tier mapping, six risk domains, ERP-linked iQ, and product-level itracing', 'No public list pricing or independent benchmark on graph accuracy']
      - [Resilinc, direct platform, Unknown in assigned pool, 'Single-source-heavy supply chains needing validated depth', 'Supplier-validated n-tier and site-level mapping', 'Public pricing undisclosed; supplier data collection burden appears higher']
      - [Everstream, direct platform, Unknown in assigned pool, 'Enterprises prioritizing disruption forecasting', 'Predictive disruption analytics built from network signals', 'Less evidence in this pool on validated site-depth']
      - ['ERP or procurement suite modules', incumbent or adjacent, 'Scaled inside larger suite economics; standalone module economics not isolated in pool', 'Buyers already standardized on SAP, Oracle, or similar enterprise systems', 'Bundled workflow and data integration inside broader suite contracts', 'Specialist network depth may be lower than dedicated risk platforms']
      - ['Manual assessments and internal build', status quo or substitute, 'Internal labor budget rather than a clear software price', 'Lower-maturity teams or narrow supplier programs', 'Local control and familiar process', 'Tier visibility and alert speed appear weaker than specialist graph tools']
    notes: >-
      Combines direct peer comparisons with public positioning and substitute
      evidence; unknown cells reflect absent public detail in the assigned pool,
      not negative proof.
    claimRefs: [CP005, CP006, CP007, CP008, CP010, CP013, CP014, CP015]
  - id: TP002
    title: Feature and capability matrix
    columns:
      - Buying criterion
      - Interos
      - Resilinc
      - Everstream
      - Evidence signal and implication
    rows:
      - ['Graph construction', 'Automated, AI-derived, broad', 'Supplier-validated, deep n-tier', 'Network-inferred', 'Interos appears optimized for fast stand-up, Resilinc for confirmed depth, and Everstream for analytics-led monitoring']
      - ['Sub-tier or site detail', 'Inferred relationships', 'Site and component-level depth', 'Analytical inference', 'Critical single-source supply chains may value Resilinc''s validated detail more than Interos breadth']
      - ['Primary edge', 'Breadth across many risk domains', 'Validated mapping depth', 'Predictive disruption', 'The buyer is choosing a failure mode to minimize, not one universal best product']
      - ['Supplier outreach dependency', 'Limited supplier surveys', 'Strong supplier data collection', 'Primarily external data', 'Resilinc may require more participation; Interos and Everstream should stand up faster from external data']
      - ['Product-level tracing and financial context', 'itracing and iQ extend into product, revenue, compliance, and ERP-linked workflows', Unknown in assigned pool, Unknown in assigned pool, 'Interos widened its product story materially in 2025-2026']
      - ['Public proof of model quality', 'No independent benchmark in pool', 'No independent benchmark in pool', 'No independent benchmark in pool', 'Positioning is public; hit rate, false positives, and tier completeness remain diligence items']
    notes: >-
      Matrix uses the assigned 2026 comparison source plus Interos official
      launch and product pages; unsupported peer cells are marked unknown rather
      than guessed.
    claimRefs: [CP003, CP004, CP006, CP007, CP008, CP011, CP012, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Vendor or approach
      - Public pricing signal
      - Contract model or unit
      - What appears included
      - Unknowns and implication
    rows:
      - [Interos, 'Custom quote; SelectHub says pricing starts in the range of $1,000 or more', 'Annual, quote-based; scope appears tied to suppliers, modules, and users', 'Mapping, monitoring, multi-domain risk coverage, plus newer iQ and itracing expansion', 'No published list price, discount curve, minimums, or module uplifts']
      - [Resilinc, 'Custom enterprise', 'Suppliers plus tiers plus users', 'Validated n-tier and site mapping with event monitoring', 'Need diligence on supplier participation and data-collection effort']
      - [Everstream, 'Custom enterprise', 'Suppliers plus analytics plus users', 'Predictive disruption analytics and near-real-time monitoring', 'No public list price; forecasting claims need proof in diligence']
      - ['ERP or procurement suite modules', 'Standalone module pricing not isolated in assigned pool', 'Bundled inside broader ERP or procurement contracts', 'Risk modules plus suite workflow integration', 'Lower incremental switching cost if the suite is already standard, but specialist depth may be lower']
    notes: >-
      Pricing rows capture public list-signal availability, not realized spend;
      enterprise discounts, deployment services, module bundling, and minimum
      commitments remain evidence gaps.
    claimRefs: [CP005, CP009, CP013]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The public comparison evidence positions Interos on fast automated breadth,
      Resilinc on validated depth, and Everstream on predictive analytics.
    data:
      xAxis:
        label: Automation and stand-up speed
        min: 1
        max: 5
        low: Manual or suite-heavy
        high: Fast automated stand-up
        description: Evidence-backed ordinal score from cited public descriptions.
        scale: ordinal
      yAxis:
        label: Validated downstream depth
        min: 1
        max: 5
        low: Limited or manual
        high: Deep validated detail
        description: Evidence-backed ordinal score from cited public descriptions.
        scale: ordinal
      points:
        - label: Interos
          x: 5
          y: 4
          note: Automated multi-tier breadth across many risk domains, but with more inferred relationships than Resilinc's validated site depth.
          claimRefs: [CP002, CP006]
        - label: Resilinc
          x: 3
          y: 5
          note: Best fit where supplier-validated n-tier and site-level depth matter most.
          claimRefs: [CP007]
        - label: Everstream
          x: 4
          y: 3
          note: Stronger on predictive disruption analytics than on validated mapping depth in the assigned pool.
          claimRefs: [CP008]
        - label: ERP suite modules
          x: 2
          y: 2
          note: Lower switching friction inside existing enterprise systems, but public evidence suggests shallower specialist depth.
          claimRefs: [CP013]
        - label: Dun and Bradstreet style data
          x: 2
          y: 2
          note: Adjacent data-rich substitute, but not positioned in the pool as a validated multi-tier specialist.
          claimRefs: [CP013]
        - label: Manual status quo
          x: 1
          y: 1
          note: Traditional quarterly assessments and spreadsheets appear slower and shallower than specialist graph tools.
          claimRefs: [CP014]
    approximationNotes: >-
      Ordinal scores summarize public positioning, not measured benchmark values;
      they are anchored to cited source descriptions rather than inferred market
      shares or conversion rates.
    claimRefs: [CP006, CP007, CP008, CP013, CP014]
