      - ["Trace a disruption to specific goods", "Supplier or country alerts do not show which parts, SKUs, or products are exposed", "itracing product-level tracing", "Shows which goods are vulnerable and how much revenue is at risk", "Current support is still mainly company launch material and derivative coverage"]
      - ["Prepare compliance and provenance answers", "Boards and regulators need fast lineage answers under tightening sourcing rules", "Compliance-ready lineage reports in minutes", "Faster, defensible reporting on product origins and sourcing exposure", "No public sample report or audit outcome evidence in the assigned pool"]
      - ["Monitor tariff, catastrophic, cyber, and compliance exposure in one workflow", "Risk signals often sit in separate tools and functions", "iTariffs, Watchtower, Cyber Resilience, and Compliance Risk modules on one platform", "Shared risk view across finance, ESG, cyber, geopolitical, and restrictions signals", "Need proof that data, alerts, and remediation actions are unified in customer operations"]
    notes: "Benefits are vendor- or publisher-described and should be treated as workflow claims until customer-reference evidence confirms realized outcomes."
    claimRefs: ["CE001", "CE003", "CE006", "CE007", "CE009", "CE013"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["External data ingestion", "Pulls public, proprietary, and event data into the platform", "Coverage, licensing, and freshness of upstream data sources", "Opaque source mix makes data lineage and refresh cadence hard to audit externally"]
      - ["Knowledge graph / living global map", "Maps multi-tier entities and business relationships across the supplier ecosystem", "Entity resolution across suppliers, products, and geographies", "Public sources disagree on current graph scale, so the headline corpus size is not cleanly reconciled"]
      - ["Risk models and scoring", "Scores finance, ESG, cyber, catastrophic, geopolitical, restrictions, and operations-related signals", "Model validity, weighting logic, and calibration data", "No public benchmark or model-performance evidence appears in the assigned pool"]
      - ["Workflow outputs", "Turns graph and scoring data into alerts, views, lineage reports, and revenue-at-risk framing", "Integrations, customer process design, and governance", "Implementation burden and operational adoption remain direct diligence items"]
    notes: "Architecture is inferred from official copy plus methodology and directory descriptions; it is a functional model, not a vendor-published reference architecture."
    claimRefs: ["CE003", "CE004", "CE005", "CE010", "CE011", "CE012", "CE013"]
