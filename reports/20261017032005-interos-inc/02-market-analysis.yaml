company:
  name: Interos Inc.
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Interos sits in a narrow but strategically important slice of supply-chain software:
    multi-tier risk intelligence for procurement, resilience, and compliance teams that
    need visibility beyond tier-one suppliers. Public evidence supports real enterprise
    and government demand, but it does not support a clean standalone TAM/SAM/SOM, and
    current market-scale disclosures remain internally inconsistent across sources.
sections:
  - id: market-boundary
    title: Market boundary and adjacent spend
    body: >-
      The retained evidence points to Interos competing in supply-chain risk intelligence
      rather than generic procurement software or point-solution supplier vetting. The
      official product pages consistently frame the platform around continuous monitoring
      of finance, ESG, cyber, catastrophic, geopolitical, and restriction risk across an
      extended supplier graph, while independent coverage emphasizes multi-tier mapping
      and visibility beyond direct vendors. That boundary matters because it includes
      spend tied to supply-chain resilience, third-party risk, and procurement decision
      support, but excludes narrower categories such as standalone ESG scoring, basic
      compliance-led supplier questionnaires, or broad ERP suites that lack deep
      sub-tier mapping. Interos' 2025 itracing launch further stretches the addressable
      workflow into product-level lineage and revenue-impact analysis, which broadens the
      use case inside existing buyer organizations without proving that Interos owns a
      separate market category of its own.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM007
      - CM015
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: Evidence-constrained market sizing
    body: >-
      The public record does not provide a defensible standalone TAM, SAM, or SOM for
      multi-tier supply-chain risk intelligence, so the safest approach is to use demand
      and monetization proxies instead of repeating a generic "large market" narrative.
      Interos' own messaging highlights complexity inside large enterprises, including a
      cited average of more than 1,700 suppliers for an S&P 500 company, while
      independent review coverage shows buyers paying meaningful contract values for
      specialized supplier-risk visibility. Public graph-coverage claims provide a third
      lens, but their conflicting 250-million-versus-400-million entity counts and
      11-billion-versus-18-billion relationship counts are measures of data coverage,
      not buyer spend. These proxies show that the operational problem is broad and that
      individual enterprise contracts can be material, but they do not isolate how many
      organizations have both the need and implementation capacity to buy Interos today.
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM015
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-and-adoption
    title: Buyer map and adoption path
    body: >-
      The clearest buyer pattern is enterprise procurement and risk ownership, especially
      in organizations with deep supplier networks, regulated products, or national
      security exposure. Independent and company-controlled sources both point to federal
      departments, defense-oriented programs, and Fortune 1000 enterprises as the core
      audience, with procurement, supply-chain, and compliance leaders named explicitly
      in the workflow. The adoption path appears to start with supplier-network mapping
      and risk scoring, then expand into procurement decisions, disruption monitoring,
      regulatory screening, and now product-level tracing. That sequence is useful for
      diligence because it suggests Interos can land on a resilience or procurement pain
      point and later expand into adjacent workflows, but it also means budget ownership
      is likely shared across procurement, supply-chain, compliance, and program
      leadership rather than concentrated in a single line item.
    claimRefs:
      - CM004
      - CM005
      - CM007
      - CM011
      - CM014
    tableRefs:
      - TM003
  - id: constraints-and-valuation
    title: Adoption constraints, contradictions, and valuation relevance
    body: >-
      The same evidence that supports category importance also flags adoption friction.
      Public pricing remains opaque, onboarding appears integration-heavy, and at least
      one independent review says users need training before outputs become useful. Those
      traits are consistent with a high-touch enterprise category rather than a
      self-serve software segment, which can support larger contract sizes but slows
      market expansion and complicates bottoms-up sizing. The chapter also has to carry
      forward contradictory market-scale disclosures: some retained sources cite more than
      250 million businesses and 11 billion relationships, while others cite more than
      400 million suppliers or companies and 18 billion relationships. That inconsistency
      does not negate product relevance, but it lowers confidence in simple market-share
      math and strengthens the case for management diligence on current graph coverage,
      customer concentration, and whether recent product launches are expanding wallet
      share or just refreshing the narrative.
    claimRefs:
      - CM005
      - CM006
      - CM008
      - CM009
      - CM010
      - CM013
      - CM014
      - CM015
