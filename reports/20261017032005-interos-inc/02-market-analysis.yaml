      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Federal departments and defense-industrial-base programs
        - Agency procurement and program leadership
        - Supplier-risk analysts and compliance teams
        - Government program budgets
        - Supplier down-select, restricted-party screening, mission assurance
        - Shared across procurement and program offices
        - Need for continuous sub-tier visibility and compliance-ready reporting
      - - Fortune 1000 procurement organizations
        - Chief procurement office and supplier-risk leadership
        - Category managers and resilience teams
        - Enterprise procurement or resilience budgets
        - Supplier mapping, sourcing decisions, continuous monitoring
        - Procurement leadership with risk stakeholders
        - Large supplier bases and hidden dependency exposure
      - - Regulated manufacturing and product companies
        - Supply-chain and compliance leadership
        - Product, sourcing, and trade-compliance teams
        - Cross-functional operations and compliance budgets
        - Product lineage, tariff exposure, and forced-labor or sourcing checks
        - Shared across supply-chain and compliance functions
        - Tighter regulatory demands and pressure for defensible lineage
      - - Existing Interos customers adding itracing
        - Current account sponsors
        - Supply-chain operations and finance stakeholders
        - Expansion inside existing enterprise accounts
        - Link disruptions to SKUs, revenue, and compliance outcomes
        - Existing procurement or operations sponsors
        - Need to quantify which parts and products are financially exposed
    notes: >-
      Buyer, payer, and budget-owner fields are synthesized from role labels named in the
