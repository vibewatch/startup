  evidenceGaps:
    - type: missing-source
      severity: material
      topic: tam-sam-som
      missingEvidence: >-
        Independent market reports or company disclosures that isolate the serviceable
        market for multi-tier supply-chain risk intelligence rather than adjacent
        procurement or compliance software.
      whyItMatters: >-
        Without a segmented market model, valuation and penetration arguments rely on
        indirect proxies rather than an evidence-backed TAM, SAM, and SOM.
      diligencePath: >-
        Request management's category sizing model, recent board materials, and any
        third-party analyst work used in fundraising or strategic planning.
      relatedQuestionRefs:
        - QM009
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: pricing-and-mix
      missingEvidence: >-
        Public disclosure of pricing bands, average contract value, deployment scope, and
        commercial versus federal customer mix.
      whyItMatters: >-
        Budget ownership, sales efficiency, and market-share potential depend on whether
        Interos lands as a broad resilience platform or a narrower high-touch federal and
        enterprise product.
      diligencePath: >-
        Obtain price books, representative MSAs or order forms, cohort-level ACV data,
        and a current revenue split by customer segment.
      relatedQuestionRefs:
        - QM003
        - QM005
        - QM009
    - type: conflicting-data
      severity: material
      topic: graph-scale
      missingEvidence: >-
        A current management-verified definition of graph coverage, including whether the
        business, supplier, and relationship counts changed because of methodology or
        product-scope updates.
      whyItMatters: >-
        Conflicting scale metrics weaken credibility around differentiation and make it
        hard to benchmark penetration or data-network moat strength.
      diligencePath: >-
        Ask management to reconcile current graph metrics across investor, product, and
        press materials and provide the latest audited or board-level definition.
      relatedQuestionRefs:
        - QM008
