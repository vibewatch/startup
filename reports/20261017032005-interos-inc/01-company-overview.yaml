      - Gap
    rows:
      - [Headquarters, "Washington, DC versus Arlington, Virginia", Current, Low, "Conflicting third-party descriptions require a current corporate record."]
      - [Founded, "2005 (third-party reported)", Historical, Medium, "Primary incorporation record or archived company newsroom item is not retained in this pool."]
      - [Current stage / ownership, "Not established; one outlet reports a pending Vista transaction", "Q2 2026 reported", Low, "Need signed-deal status, approvals, and close confirmation."]
      - [Recent financing, "$40M Blue Owl growth capital", 2024, Medium, "Terms, covenants, warrants, and draw mechanics are undisclosed."]
      - [Valuation / control event, "$1.05B all-cash Vista acquisition asserted by one outlet", 2026, Low, "No retained official confirmation, filing, or merger agreement."]
      - [Customer footprint, "100+ Fortune 1000 companies plus federal agencies", 2024, Medium, "Current customer count, revenue concentration, and retention remain undisclosed."]
      - [Platform scale, "400M+ mapped entities/companies across multi-tier networks", "2024-2026", High, "Public sources do not reconcile the 11B versus 18B relationship denominator."]
      - [Revenue / pricing transparency, "Not publicly disclosed; custom enterprise pricing implied", Current, Low, "Need ARR, revenue, gross margin, burn, and pricing schedule."]
    notes: >-
      Mixes official claims with third-party reporting; "Gap" states the diligence follow-up needed
      where public disclosures are incomplete or conflicting.
    claimRefs: [CO003, CO004, CO005, CO009, CO010, CO013, CO014, CO015]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Jennifer Bisceglie", "Founder; older retained profile says CEO", "Silicon Review profiles her as a 25+ year supply-chain architect with congressional-facing credibility.", "Strong founder-market fit around supply-chain resilience and policy-heavy enterprise selling.", "Current operating role requires confirmation because later retained evidence names another CEO."]
      - ["Ted Krantz", "CEO in Blue Owl release", "Quoted in the 2024 financing announcement as the executive leading growth and AI adoption.", "Adds current operating coverage for product-led growth and go-to-market scaling.", "Need transition date, predecessor role, and management-team continuity."]
      - ["Dave DeWalt", "Chairman; NightDragon founder/CEO", "Named in the Blue Owl release as chairman and NightDragon's founder and CEO.", "Brings cybersecurity/software capital-markets network and board-level credibility.", "Need board rights, ownership level, and any investor-control provisions."]
    notes: >-
      Partial enumeration based on leadership names explicitly retained in the worker pool; it is
      sufficient for key-person risk review but not a full org chart.
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerates named founder, current CEO, and chairman from the retained public sources rather
        than the full executive bench or board roster.
    claimRefs: [CO006, CO007, CO008]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Blue Owl Capital", "Growth-capital investor", "Disclosed provider of the $40M 2024 capital infusion.", "Request facility terms, covenants, warrants, board observer rights, and draw status."]
      - ["Vista Equity Partners", "Unverified reported acquirer", "One low-reputation outlet asserts a $1.05B all-cash transaction expected in Q2 2026.", "Confirm signing, regulatory approvals, closing, earnouts, and integration assumptions."]
      - ["NightDragon", "Prior investor / chairman nexus", "Named as a backer and linked to chairman Dave DeWalt.", "Clarify ownership percentage and whether NightDragon has governance rights."]
      - ["Kleiner Perkins", "Prior venture investor", "Named among top-tier financial backers in the Blue Owl release.", "Confirm current ownership, pro rata rights, and exit expectations."]
      - ["Venrock", "Prior venture investor", "Named among historical backers in the Blue Owl release.", "Confirm current cap-table weight and any board rights."]
      - ["Accenture / Coupa / ServiceNow", "Strategic supporters", "Named as strategic investors or ecosystem supporters, adding channel and enterprise credibility.", "Separate passive ownership from commercial dependency and partnership economics."]
    notes: >-
      Partial stakeholder map limited to publicly named capital providers and strategic backers in
      the retained pool; ownership percentages are not publicly disclosed here.
    enumerationScope:
      coverage: partial
      basis: >-
        Captures every capital provider or strategic backer explicitly named in the retained worker
        pool, but not unnamed common shareholders or debt counterparties.
    claimRefs: [CO009, CO010]
