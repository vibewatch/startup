artifact: company-overview
slug: interos-inc
runDate: 2026-10-17
company:
  name: Interos Inc.
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Interos presents as a private supply-chain risk intelligence platform with a consistent product
    identity, recent product announcements, and a verified 2024 growth-capital event, but the
    retained pool still leaves leadership chronology, financing terms, and core financial metrics
    under-disclosed. A single low-reputation outlet's claimed Vista transaction is not corroborated
    and is not treated as a current ownership or valuation fact.
sections:
  - id: identity-and-positioning
    title: Identity, positioning, and operating footprint
    body: >-
      The retained official materials are unusually consistent on what Interos sells: an
      AI-powered platform that maps and monitors extended supplier networks so procurement, risk,
      and compliance teams can respond before disruptions become executive-level problems. That
      consistency matters because later chapters can treat Interos as a supply-chain risk
      intelligence vendor rather than a generic procurement workflow tool. The public footprint in
      this pool is strongest around product scope and customer type, not around audited operating
      scale. Independent references place the company in the Arlington/Washington, DC market and
      date its founding to 2005, while official and third-party materials both emphasize multi-tier
      visibility and large-enterprise or government adoption rather than self-serve SMB usage.
      Headquarters evidence is not clean: an undated profile says Washington, DC, while the
      low-reputation transaction article says Arlington, Virginia. This chapter preserves the
      conflict instead of collapsing both descriptions into a single verified location.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO013, CO014]
    tableRefs: [TO001]
  - id: leadership-governance-and-stakeholders
    title: Leadership, governance, and stakeholder map
    body: >-
      Leadership is the least cleanly documented part of the current public record. A retained
      Silicon Review profile still describes Jennifer Bisceglie as founder and chief executive
      officer, while the later Blue Owl financing release quotes Ted Krantz as CEO and Dave
      DeWalt as chairman. That is enough to infer a real leadership transition or at least a
      materially updated governance structure, but not enough to time it precisely or separate
      executive management from board-level influence. Investor naming is clearer than control
      rights: Blue Owl is the disclosed 2024 growth-capital provider, while NightDragon, Kleiner
      Perkins, Venrock, Accenture, Coupa, and ServiceNow are named as backers or strategic
      supporters. One low-reputation outlet describes Vista as an acquirer, but no assigned
      official or high-reputation source confirms signing or closing. The diligence implication is
      key-person, cap-table, and governance verification, not founder-risk elimination.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO014]
    tableRefs: [TO002, TO003]
  - id: funding-stage-and-milestones
    title: Funding, stage, and milestone chronology
    body: >-
      The strongest dated items in the retained pool are the 2024 Blue Owl investment, company
      claims about customer scale, the June 2025 iTariffs listing, and the October 2025 itracing
      launch. The 2026 Vista assertion remains an unverified diligence lead, not evidence of a
      completed control event. A comparison source credits Interos with automated breadth but
      describes supplier relationships as inferred and supplier surveys as limited; because the
      publisher's benchmarking methodology is not established, this is treated as a limitation
      signal rather than an independent product benchmark. The corpus also lacks official,
      filing-grade, or high-reputation evidence for current revenue, gross margin, burn, pricing,
      concentration, and Blue Owl's detailed terms. The chapter therefore anchors identity and
      chronology, not software-quality, leverage, or valuation underwriting.
    claimRefs: [CO005, CO009, CO010, CO011, CO012, CO014, CO015, CO016]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value/status
      - Date
