          detail: One low-reputation outlet reports a $1.05B transaction expected to close in Q2 2026; assigned evidence does not confirm signing or closing.
          tone: risk
          claimRefs: [CO010]
    approximationNotes: >-
      Timeline dates use only explicit dated cues retained in the worker pool; older financing and
      product milestones are omitted because this pool does not preserve enough date-specific
      primary evidence to reach eight dated points.
    claimRefs: [CO003, CO005, CO007, CO009, CO010, CO011, CO012]
callouts:
  - calloutType: strength
    title: Clear product identity despite sparse financial disclosure
    body: >-
      Official and third-party sources align unusually well on Interos's category position:
      multi-tier supply-chain risk intelligence for enterprise and government buyers, with AI-led
      mapping and monitoring as the core wedge.
    claimRefs: [CO001, CO002, CO003, CO013]
  - calloutType: risk
    title: Governance and underwriting still need management-grade evidence
    body: >-
      Leadership chronology, financing terms, and software-quality metrics remain under-disclosed in
      the retained public pool, so this chapter should anchor identity and chronology rather than
      serve as a complete underwriting record.
    claimRefs: [CO008, CO010, CO014, CO015, CO016]
