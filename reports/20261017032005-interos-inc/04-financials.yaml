      - "What remains unknown"
    rows:
      - ["Direct enterprise", null, "Quote-based subscription initiated through request-contact or demo", "ACV, seats or entities included, usage overages, discounts, term, and renewal uplift"]
      - ["AWS Marketplace", null, "Private Offer and Channel Partner Private Offer are supported", "Marketplace price, AWS fee, reseller margin, committed spend treatment, and realized discount"]
      - ["Federal / GSA", null, "ERP Research reports access through the GSA SCRIPTS BPA via Carahsoft", "Task-order rates, minimum commitment, option periods, and prime/subcontractor economics"]
    notes: "Null means no price or unit was disclosed in the assigned fetched evidence; list availability must not be treated as realized revenue."
    claimRefs: ["CI001", "CI002", "CI003"]
  - id: "TI003"
    title: "Unit-economics and operating evidence"
    columns:
      - "Metric / proxy"
      - "Public value"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["Deployment time", "Under two weeks", "Low — company-issued marketplace claim", "Implementation burden affects time-to-value and services margin", "Provide median and p90 deployment hours, implementation fees, and customer sample"]
      - ["Due-diligence time reduction", "20%", "Low — unnamed customer example", "Potential labor ROI can support price and renewal", "Provide baseline, measurement period, customer identity, and attributable savings"]
      - ["Consulting cost and outreach reduction", "60%", "Low — unnamed customer example", "Potential hard-dollar ROI may support expansion", "Separate consulting spend from outreach volume and provide absolute savings"]
      - ["Gross margin / contribution margin", null, "Unavailable", "Determines whether data, cloud, support, and channel costs scale efficiently", "Provide audited gross margin, data and cloud COGS, services margin, and channel fees"]
    notes: "Company-issued outcome examples are directional proxies, not audited unit economics; null means the assigned evidence disclosed no value."
    claimRefs: ["CI004", "CI005", "CI006", "CI014"]
