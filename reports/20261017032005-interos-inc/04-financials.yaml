      - ["Federal procurement", "GSA SCRIPTS BPA through Carahsoft", "Reported procurement route", "May shorten procurement access, but task-order economics and concentration are unknown", "Provide agency revenue mix, task-order duration, backlog, and channel economics"]
      - ["AWS Marketplace", "Private Offer or Channel Partner Private Offer", "Negotiated offers available through AWS sales", "Cloud marketplace can ease procurement; fees and discounts are undisclosed", "Provide gross-to-net price waterfall, AWS fees, partner share, and renewal ownership"]
