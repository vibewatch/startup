      severity: "material"
      topic: "financial-disclosure-gap"
      missingEvidence: "Audited revenue and ARR bridges, gross margin, NRR, services mix, and revenue-recognition policy."
      whyItMatters: "Without these inputs, recurring revenue quality, retention, and scalable contribution economics cannot be tested."
      diligencePath: "Obtain audited statements, monthly ARR and revenue bridges, cohort retention schedules, and COGS allocations from management."
      relatedQuestionRefs: ["QI004", "QI005", "QI008"]
      relatedTableRefs: ["TI001", "TI003"]
    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-adequacy-gap"
      missingEvidence: "Current cash, monthly burn, runway, debt balances, facility terms, covenants, warrants, and planned use of funds."
      whyItMatters: "Funding raised is not cash available, and financing obligations could materially change runway and ownership outcomes."
      diligencePath: "Review bank statements, the latest balance sheet, a 24-month cash forecast, debt agreements, covenant certificates, and board financing plans."
      relatedQuestionRefs: ["QI006"]
    - type: "missing-source"
      severity: "material"
      topic: "pricing"
      missingEvidence: "Realized ACV, price metric, discounting, channel fees, contract duration, renewal uplift, and revenue mix by route."
      whyItMatters: "Quote-based packaging reveals the sales motion but not pricing power, gross-to-net leakage, or contract quality."
      diligencePath: "Request anonymized order forms, a contract cohort export, discount approvals, renewal schedules, and channel settlement statements."
      relatedQuestionRefs: ["QI001", "QI002"]
      relatedTableRefs: ["TI001", "TI002"]
    - type: "conflicting-data"
      severity: "material"
      topic: "source-risk"
      missingEvidence: "Primary confirmation or reputable independent corroboration of the alleged 2026 acquisition and operating metrics."
      whyItMatters: "Using an uncorroborated transaction article would create false precision in revenue, margin, retention, valuation, and ownership analysis."
      diligencePath: "Require company and buyer announcements, transaction filings, signed deal documents, and audited financial schedules before using any asserted figures."
      relatedQuestionRefs: ["QI007"]
