schemaVersion: "report-v2"
artifact: "financials"
slug: "interos-inc"
runDate: "2026-10-17"
company:
  name: "Interos Inc."
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Interos appears to monetize through quote-based enterprise subscriptions, federal procurement
    channels, and negotiated AWS private offers, with new modules creating potential expansion
    paths. The assigned public evidence does not disclose audited revenue, ARR, gross margin, NRR,
    cash, burn, runway, or debt obligations, so revenue quality and capital adequacy remain
    underwriting blockers despite company-issued customer-efficiency claims.
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue model and monetization"
    body: >-
      The observable model is enterprise software sold by quote rather than a transparent
      seat-based or usage-based price card. ERP Research describes quote-based subscriptions and
      identifies two procurement routes: a request-contact sales process for enterprises and the
      GSA SCRIPTS blanket purchase agreement through Carahsoft for federal buyers. The AWS
      Marketplace listing adds negotiated Private Offer and Channel Partner Private Offer paths.
      Together, these sources indicate contract-level negotiation and channel-assisted procurement,
      but they do not reveal realized ACV, contract duration, discounting, renewal terms, channel
      fees, or revenue recognition policy. itracing is available to existing customers, making
      module attachment a plausible expansion mechanism, although no attach rate or incremental
      price is public.
    claimRefs: ["CI001", "CI002", "CI003", "CI009"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "go-to-market-and-value-proof"
    title: "Go-to-market motion and value proof"
    body: >-
      The evidence points to a high-touch enterprise and government motion rather than
      self-service acquisition. ERP Research reports no free trial, while the AWS listing routes
      buyers to sales for private offers and claims deployment in under two weeks. Company-supplied
      AWS examples report a 20% reduction in due-diligence time for one procurement team and a 60%
      reduction in external consulting costs and outreach for another customer. These examples are
      useful sales-efficiency and customer-value proxies, not audited unit economics: the baselines,
      customer identities, measurement windows, contract values, implementation labor, and sample
      representativeness are not disclosed. Management should connect these outcome claims to
      win rates, sales cycles, CAC, payback, expansion, and retention cohorts.
    claimRefs: ["CI001", "CI003", "CI004", "CI005", "CI006", "CI012"]
  - id: "cost-structure-and-unit-economics"
    title: "Cost structure and unit economics"
    body: >-
      Interos says its platform continuously maps 250 million-plus companies and billions of
      relationships, while its product pages describe six monitored risk categories and multiple
      specialized modules. That delivery model implies meaningful data acquisition, cloud
      processing, model operations, product development, security, customer success, and
      implementation costs, but the assigned sources provide no quantified cost split. Fast
      deployment and workflow automation could support attractive software economics, yet public
      outcome anecdotes cannot establish gross margin or payback. The diligence model should
      therefore leave gross margin, CAC, payback, NRR, services mix, and contribution margin blank
      rather than importing SaaS benchmarks that may not reflect data licensing, channel fees, or
      government support requirements.
    claimRefs: ["CI004", "CI005", "CI006", "CI007", "CI008", "CI011", "CI014"]
    tableRefs: ["TI003"]
  - id: "capital-adequacy-and-verdict"
    title: "Capital adequacy and financial verdict"
    body: >-
      ERP Research reports that Interos has raised close to $290 million, including a $40 million
      strategic growth round in October 2024, but funding raised is not cash available and does not
      establish current runway. None of the assigned sources discloses cash, burn, runway, debt
      balances, covenants, warrants, or planned use of funds; none provides audited revenue, ARR,
      gross margin, or NRR. A low-reputation private-markets article asserts a 2026 acquisition and
      detailed operating metrics, but no assigned company announcement, buyer announcement, filing,
      or reputable report corroborates those claims, so they are excluded from the underwriting
      case. The financial verdict is therefore cautious: monetization mechanics and customer value
      are visible, but revenue quality, margin progression, capital intensity, and financing
      dependency cannot be assessed without management evidence.
    claimRefs: ["CI013", "CI014", "CI015", "CI016"]
callouts:
  - calloutType: "risk"
    title: "Financial underwriting blocker"
    body: >-
      Do not convert funding raised into available liquidity or accept uncorroborated transaction
      metrics. Obtain audited revenue and ARR bridges, gross-margin and NRR cohorts, a cash-to-runway
      schedule, and complete debt terms before setting a financial or valuation case.
    claimRefs: ["CI013", "CI014", "CI015", "CI016"]
