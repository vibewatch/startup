schemaVersion: report-v2
artifact: valuation
slug: interos-inc
runDate: 2026-10-17
company:
  name: Interos Inc.
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports real product breadth and fresh 2024-2026 financing, but current
    price discovery remains thin. The only explicit current valuation datapoint in this pool is a
    single-source report of a $1.05 billion Vista acquisition at roughly 15x projected 2026
    revenue, while audited ARR, gross margin, retention, and cap-structure terms remain private.
    That keeps Interos in research-more territory with a stretched valuation stance rather than a
    buy call.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The current evidence supports a price-sensitive research-more call rather than a buy. Interos
      clearly still attracts capital, and both the official product pages and the October 2025
      itracing launch show a company broadening its platform from supplier monitoring toward
      product-level tracing, revenue-impact analysis, tariff visibility, and compliance workflows.
      That is the positive side of the thesis. The harder problem is price discovery: in this
      chapter's pool, the only explicit current valuation reference is a single independent report
      that Vista agreed to buy Interos for $1.05 billion, implying about 15x projected 2026
      revenue. Without independently verified ARR, gross margin, NRR, burn, or the capital-stack
      terms behind the 2024 and 2026 financings, the right decision is to keep the company on a
      tighter diligence leash than the product story alone would justify.
    claimRefs: [CV011, CV012, CV013, CV014, CV004, CV005]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-reference-points
    title: Financing and valuation context
    body: >-
      Public financing signals remain constructive but incomplete. FundedIQ records six funding
      rounds totaling $180 million of disclosed capital, with a latest $20 million round announced
      in January 2026. TipRanks and other secondary coverage attribute that round to Blue Owl
      Capital and Structural Capital, while Supply Chain Digital separately reported a $40 million
      Blue Owl investment in October 2024. Those datapoints indicate continued sponsor support and
      reduce near-term survival risk, but they do not establish what price new money cleared at or
      whether the capital came with warrants, liquidation preferences, debt-like covenants, or
      other return-shaping terms. Even basic scale indicators remain imprecise across the pool:
      Beatable lists 109 employees, while FundedIQ places the company in a 251-500 band, and
      marketed ecosystem scale varies between 11 billion and 18 billion relationships across
      secondary sources. For valuation work, the signal is directionally positive but still too
      noisy for fine-grained underwriting.
    claimRefs: [CV001, CV002, CV003, CV006, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios-and-diligence-gates
    title: Scenario framing, downside triggers, and diligence asks
    body: >-
      The scenario spread is driven less by whether Interos solves a real problem and more by how
      much verified economic quality sits beneath the story. The bull case needs the rumored Vista
      price to prove real, or at least directionally fair, and then needs management to show that
      revenue quality, retention, and margins justify a premium multiple even after software-market
      compression. The base case assumes the platform is strategically relevant and financing-backed
      but that investors still need hard KPI disclosure before assigning a durable standalone mark.
      The bear case is not product collapse; it is paying a strategic scarcity price for a business
      whose real ARR, gross margin, renewal profile, or preference stack turns out materially weaker
      than the market narrative. That is why the key diligence gates are current transaction
      documents, audited SaaS metrics, and full financing terms.
    claimRefs: [CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision lens
      - Current read
      - Evidence basis
      - Decision implication
    rows:
      - [Recommendation, research-more, "Fresh capital and product breadth are real, but current price discovery is not yet verified.", "Do not underwrite a buy case until management shares auditable KPI and valuation support."]
      - [Confidence, medium, "The strategic thesis is visible, but several core valuation inputs are still private or singly sourced.", "Keep diligence active; avoid false precision in target-return math."]
      - [Risk rating, high, "Return risk is driven by missing unit-economics disclosure, possible premium pricing, and opaque financing terms.", "Assume underwriting downside is still live even if the business quality thesis is directionally positive."]
      - [Valuation stance, stretched, "The only explicit current mark in this pool is a reported $1.05B transaction at about 15x projected revenue.", "Treat current pricing as premium until independent confirmation and KPI reconciliation arrive."]
      - [Entry discipline, document-gated, "Upgrade only after verified 2026 transaction terms or management disclosure of ARR, margins, retention, and preference overhang.", "A diligence package or price reset could move the call faster than another narrative update."]
    notes: >-
      Synthesis table based on public-source signals only; "stretched" reflects a single-source
      current valuation reference and should not be read as a verified market-clearing mark.
    claimRefs: [CV011, CV012, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Blue Owl-backed funding in 2024 and 2026 suggests investors still support the platform and roadmap.", "Evidence of a down round, heavy structure, or withdrawn sponsor support would weaken the durability case."]
      - [Thesis, "Official product evidence shows Interos expanding from supplier monitoring into product-level tracing, tariff visibility, and compliance workflows.", "A stalled rollout, weak adoption data, or loss of major reference customers would narrow the product-premium argument."]
      - [Anti-thesis, "Public evidence still lacks audited ARR, gross margin, NRR, burn detail, and a verified standalone equity mark.", "Audited KPI disclosure or signed transaction documents would materially improve confidence."]
      - [Anti-thesis, "If the rumored $1.05B sale and 15x revenue multiple are accurate, the entry bar is already high for a business with unresolved revenue-quality questions.", "A lower effective entry price or stronger retention/margin evidence would reduce premium-risk concerns."]
    notes: >-
      Arguments separate company quality from price discipline; several anti-thesis items can move
      with disclosure rather than with a change in operating momentum.
    claimRefs: [CV002, CV003, CV004, CV005, CV009, CV010, CV011, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Vista deal closes near the reported $1.05B mark or equivalent evidence validates premium pricing; KPI disclosure supports strong retention and margins.", "Strategic scarcity and premium software economics remain intact, limiting downside from current levels.", "Single-source transaction report proves inaccurate; KPI package disappoints.", "Possible, but not underwritten from today's public evidence."]
      - [Base, "Interos remains strategically relevant and financing-backed, but investors must validate revenue quality and capital-stack terms before assigning a durable mark.", "Return depends on disciplined entry after disclosure rather than on chasing the current narrative.", "Price stays premium while disclosure stays thin, compressing upside.", "Best fit with the current evidence set."]
      - [Bear, "The premium valuation reference is overstated or the business shows weaker ARR quality, margins, or financing structure than public narratives imply.", "A premium multiple compresses faster than operating proof improves, producing poor risk-adjusted entry.", "Opaque preference terms or slower commercial traction magnify dilution and downside.", "Credible downside if diligence cannot close the disclosure gap."]
    notes: >-
      Scenario table is directional, not a DCF or comps model; the source pool does not disclose
      enough verified financial detail for precise valuation ranges.
    claimRefs: [CV010, CV011, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public product and financing proof is real, but verified valuation support still lags.
    data:
      nodes:
        - label: Fresh capital
          summary: January 2026 funding followed the October 2024 Blue Owl round.
          note: Sponsor support reduces immediate survival risk but not valuation risk.
          claimRefs: [CV001, CV002, CV003]
        - label: Product breadth
          summary: Official materials show six risk categories plus itracing, ireputation, and itariffs.
          note: Breadth supports strategic relevance and cross-sell logic.
          claimRefs: [CV004, CV005]
        - label: Mixed external scale signals
          summary: Third-party datasets disagree on employee scale and marketed relationship counts.
          note: Secondary metrics are useful context but not a precision basis for underwriting.
          claimRefs: [CV006, CV007]
        - label: Single-source valuation mark
          summary: The only explicit current mark in this pool is a reported $1.05B Vista deal.
          note: Treat as informative, not yet fully verified.
          claimRefs: [CV008, CV009]
        - label: Premium-risk filter
          summary: A 15x forward-revenue mark remains premium if revenue quality still needs proof.
          note: Missing ARR, margin, retention, and term disclosure keeps downside live.
          claimRefs: [CV010, CV011, CV013]
        - label: Recommendation
          summary: Research-more with a stretched stance until transaction documents or KPI disclosure arrive.
          note: Entry discipline matters more than narrative enthusiasm.
          claimRefs: [CV012, CV014]
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Hold the price line
    body: >-
      Interos looks strategically relevant enough to keep working, but the public evidence pool
      still does not justify a buy call at a premium mark. The upgrade path is straightforward:
      verify the current transaction or share audited SaaS metrics and financing terms.
    claimRefs: [CV011, CV012, CV013, CV014]
