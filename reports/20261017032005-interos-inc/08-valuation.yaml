  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: audited-saas-metrics
      missingEvidence: Audited or board-approved ARR, revenue, gross margin, NRR, and burn disclosures for 2025-2026.
      whyItMatters: Those metrics are needed to test whether any premium valuation reference reflects durable software economics or just strategic scarcity.
      diligencePath: Request the latest board package or lender/investor KPI schedule with definitions that reconcile ARR, revenue, margin, and cash burn.
      relatedQuestionRefs: [QV006, QV007, QV008]
    - type: private-evidence-only
      severity: material
      topic: current-equity-mark
      missingEvidence: Signed merger documents, a term sheet, or another verified 2026 pricing record confirming whether the reported $1.05 billion Vista transaction is real and on what terms.
      whyItMatters: Without a verified current mark, the chapter cannot distinguish between narrative valuation and actual price discovery.
      diligencePath: Request executed transaction documents, a signed lead-investor term sheet, or a recent 409A or board-approved equity mark with context.
      relatedQuestionRefs: [QV002, QV005, QV007]
    - type: private-evidence-only
      severity: material
      topic: capital-structure-terms
      missingEvidence: The Blue Owl and Structural financing documents, including whether the capital is debt, preferred equity, warrant-linked, or covenant-heavy.
      whyItMatters: Preference, warrant, and covenant overhang can materially change realized investor returns even if headline valuation appears unchanged.
      diligencePath: Obtain financing agreements, cap-table detail, and any side letters governing liquidation preference, warrants, or lender controls.
      relatedQuestionRefs: [QV001, QV008]
