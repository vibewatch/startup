figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Ranked residual risk is highest where integration complexity, control-proof gaps, and control-change uncertainty overlap.
    data:
      columns:
        - label: Likelihood
          note: Analyst ranking from cited chapter evidence.
        - label: Impact
          note: Business effect if the failure mode is not contained.
        - label: Mitigation maturity
          note: Based on retained public proof, not management assertions outside the pool.
        - label: Residual exposure
          note: Combined read after observed mitigation maturity.
      rows:
        - label: Implementation / data quality
          note: ERP linkage, supplier participation, and refresh-cadence quality drive the outcome.
          values:
            - label: High
              tone: high
              note: Complex deployments and master-data mismatches are explicitly flagged in the retained review.
            - label: High
              tone: critical
              note: Dirty ERP or tier-mapping data can undermine prioritization and mitigation decisions.
            - label: Medium
              tone: medium
              note: iQ and itracing provide a mitigation workflow, but rollout proof is still limited.
            - label: High
              tone: high
              note: This remains the most direct thesis-break risk for scaled adoption.
        - label: Cyber / compliance proof
          note: Federal and regulated use cases raise the proof bar beyond broad product positioning.
          values:
            - label: Medium
              tone: medium
              note: The retained pool does not show a public incident, but it also does not verify control artifacts.
            - label: High
              tone: critical
              note: A control failure would affect customer trust, procurement, and auditability.
            - label: Low
              tone: adverse
              note: Retained public evidence does not independently verify certifications, SLAs, or incident disclosure practice.
            - label: High
              tone: high
              note: Residual exposure stays elevated until diligence closes the proof gap.
        - label: Partner / signal dependency
          note: AWS, ERP systems, and third-party event feeds shape delivery quality.
          values:
            - label: Medium
              tone: medium
              note: Dependencies are visible in the public footprint, but concentration is not quantified.
            - label: Medium-High
              tone: high
              note: A broken connector or degraded signal feed can distort customer workflows.
            - label: Medium
              tone: medium
              note: Some mitigation is implied by workflow design, but continuity controls are not public.
            - label: Medium-High
              tone: high
              note: Dependency risk is manageable only with deeper diligence on contracts and redundancy.
        - label: Commercial scaling / pricing
          note: Expansion economics can deteriorate if mapped suppliers, SKUs, or add-ons drive cost faster than value proof.
          values:
            - label: Medium
              tone: medium
              note: The adverse review flags pricing and renewal watchouts rather than observed public churn.
            - label: Medium-High
              tone: high
              note: Cost escalation can slow rollouts or compress margin even without a product defect.
            - label: Low
              tone: adverse
              note: Retained public evidence does not show pricing architecture, retention, or services mix that would confirm mitigation.
            - label: Medium-High
              tone: high
              note: Residual exposure remains elevated until pricing and retention data are diligenced.
        - label: Public proof-point scarcity
          note: Sparse public reviews and limited independent customer proof reduce outside verification quality.
          values:
            - label: High
              tone: high
              note: The retained review explicitly calls out the weak public review footprint.
            - label: Medium
              tone: medium
              note: This does not prove product weakness, but it does weaken outside diligence confidence.
            - label: Low
              tone: adverse
              note: Mitigation maturity is hard to verify because the public pool lacks scaled third-party customer evidence.
            - label: Medium-High
              tone: high
              note: Residual exposure falls only if diligence produces stronger referenceable deployments and renewal proof.
        - label: Control-change / transaction uncertainty
          note: Governance risk depends on whether the reported Vista deal is real and on schedule.
          values:
            - label: Medium
              tone: medium
              note: The risk is live only if the reported transaction is accurate, but that report is current.
            - label: High
              tone: high
              note: Delayed approvals or changed terms can disrupt roadmap focus and customer messaging.
            - label: Low
              tone: adverse
              note: Retained mitigation proof is thin because the chapter lacks a filing, definitive agreement, or company confirmation.
            - label: High
              tone: high
              note: Residual exposure stays high until diligence confirms status, approvals, and financing.
    claimRefs:
      - CR010
      - CR013
      - CR015
      - CR016
