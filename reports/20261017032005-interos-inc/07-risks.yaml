  evidenceGaps:
    - type: missing-source
      severity: material
      topic: control-proof-gap
      missingEvidence: Public trust-center artifacts, SOC 2 or ISO certificates, uptime SLAs, and incident-history disclosures tied to cyber or compliance claims.
      whyItMatters: Regulated and federal buyers will underwrite vendor risk against control evidence, not only product positioning.
      diligencePath: Request the security package, customer security questionnaire responses, uptime history, and incident postmortems.
      relatedQuestionRefs:
        - QR008
      relatedTableRefs:
        - TR001
        - TR002
    - type: missing-source
      severity: material
      topic: change-of-control
      missingEvidence: Definitive acquisition agreement, approval timetable, financing commitments, and management-retention terms for the reported Vista transaction.
      whyItMatters: Governance and execution risk can change quickly if the company is actually under signed change-of-control or debt-financed ownership transition.
      diligencePath: Obtain the signed deal package, board materials, lender term sheet, and current approval-status tracker.
      relatedQuestionRefs:
        - QR007
      relatedTableRefs:
        - TR001
        - TR003
    - type: missing-source
      severity: material
      topic: commercial-risk
      missingEvidence: Pricing architecture, gross retention, contract minimums, add-on attachment rates, and implementation services mix.
      whyItMatters: The adverse review flags expansion-cost risk, but public evidence is too thin to size margin or renewal pressure.
      diligencePath: Ask for cohort pricing data, standard order forms, customer expansion history, and implementation gross-margin splits.
      relatedQuestionRefs:
        - QR004
      relatedTableRefs:
        - TR003
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Revenue mix by government versus commercial accounts, top-customer concentration, and referenceable scaled deployments beyond limited-release products.
      whyItMatters: Federal and large-enterprise positioning can create renewal and procurement concentration risk that is invisible from logo claims alone.
      diligencePath: Request ARR concentration by top ten accounts, sector mix, renewal cohorts, and named production references.
      relatedTableRefs:
        - TR002
        - TR003
