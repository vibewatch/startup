schemaVersion: report-v2
artifact: customers
slug: interos-inc
runDate: 2026-10-17
company:
  name: Interos Inc.
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence points to a customer base anchored in government and large-enterprise
    procurement/risk teams rather than SMB volume. Interos shows credible public-sector and
    named-enterprise adoption signals, but most proof is still company-controlled or partner-led,
    while renewal, concentration, and contract economics remain undisclosed.
sections:
  - id: customer-mix-and-buyers
    title: Customer mix and buying center
    body: >-
      Interos sells into procurement, supply-chain, compliance, and risk teams that need ongoing
      visibility into multi-tier supplier exposure rather than one-time vendor screening. Its own
      product pages frame the platform around due diligence, continuous monitoring, executive
      reporting, and compliance use cases, while Carahsoft positions the same platform directly for
      government procurement, sourcing, and risk leaders. That points to a buyer mix concentrated
      in large enterprises and public-sector programs where complex supplier networks, sanctions,
      cyber, and resilience mandates justify custom enterprise deployments rather than self-serve
      adoption or short transactional pilots in lightly governed segments.
    claimRefs: [CU001, CU002, CU009, CU013]
    tableRefs: [TU001, TU002]
  - id: named-proof-and-reference-quality
    title: Named customer proof is real but unevenly evidenced
    body: >-
      The assigned pool contains multiple public customer signals, but they vary sharply in proof
      quality. Official and partner sources show that Interos has a federal route to market and an
      installed base eligible for new modules, while independent coverage adds named accounts such
      as Accenture, Freddie Mac, the U.S. Department of Defense, NASA, the Canadian Coast Guard,
      and the Royal Canadian Navy. The strongest public proof is the Accenture quotation describing
      how Interos helps expose compliance gaps and real-time risk, plus the reported multi-year
      Canadian maritime contract; broader logo lists from Interos itself are directionally useful
      but do not establish deployment breadth, production scope, or spend per account.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008]
    tableRefs: [TU003]
  - id: durability-expansion-and-concentration
    title: Expansion logic is visible; durability and concentration are not
    body: >-
      Interos has a plausible land-and-expand story because the platform already spans supplier due
      diligence, continuous monitoring, cyber/compliance workflows, and newer add-ons such as
      itracing, ireputation, and itariffs, with Business Wire explicitly stating that itracing is
      available to existing customers. Independent comparison coverage also suggests the product is
      best suited to buyers that value broad automated graph coverage over the validated sub-tier
      depth or predictive specialization highlighted by competitors. What remains missing is the
      harder underwriting data: the pool does not disclose NRR, GRR, churn, renewal rates, contract
      length, customer concentration, or government-versus-commercial mix, so durability and
      account concentration risk stay open.
    claimRefs: [CU004, CU009, CU010, CU011, CU012, CU013]
    figureRefs: [FU001]
callouts:
  - calloutType: insight
    title: Two visible customer cores
    body: >-
      Public evidence most clearly supports two customer clusters: government programs reached
      through FedRAMP and Carahsoft channels, and large enterprises using Interos for procurement,
      compliance, and board-level risk reporting.
    claimRefs: [CU001, CU002, CU003, CU006]
  - calloutType: risk
    title: Durable revenue quality is still unproven
    body: >-
      Named logos and contracts are not the same as retention proof; the assigned sources do not
      disclose renewal rates, churn, contract length, or customer concentration, leaving the core
      SaaS durability question unanswered.
    claimRefs: [CU005, CU010, CU011]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Federal agencies
        - Government procurement, sourcing, and risk leaders; agencies as payer and end user
        - Continuous supplier risk visibility inside federal environments
        - Carahsoft public-sector page plus FedRAMP-cleared operating posture
        - Strategically important because certification and channel access reduce public-sector sales friction
        - No disclosed agency count, contract values, or renewal data
      - - Defense industrial base partners
        - Program managers and supplier-risk operators across mission-critical supply chains
        - Monitoring restricted-party, cyber, geopolitical, and resilience exposures in sub-tier suppliers
        - PRNewswire says FedRAMP Class D now enables defense-industrial-base use inside federal environments
        - Helpful adjacency to federal demand and national-security workflows
        - Public sources do not disclose live logos, usage depth, or expansion rates
      - - Fortune 1000 / large enterprises
        - Procurement, compliance, board, and C-suite stakeholders
        - Due diligence, continuous monitoring, executive reporting, and resilience workflows
        - Official pages cite Fortune 1000 market leaders and enterprise-scale supplier graphs
        - Likely core commercial ACV base given custom-enterprise positioning
        - Company-issued evidence does not separate active users from marketing references
      - - Regulated commercial enterprises
        - Compliance and third-party-risk teams as users; enterprise budget owners as payer
        - Tariff, cyber, sanctions, catastrophic, and third-party risk workflows
        - Solutions page shows multiple named solution modules across risk categories
        - Supports land-and-expand across adjacent risk problems once a buyer is onboarded
        - No disclosed module attach rates or segment revenue mix
      - - ERP / procurement ecosystem participants
        - Users work inside ServiceNow, Coupa, SAP Ariba, and adjacent procurement systems
        - Consume Interos risk scores within established sourcing workflows
        - Official blog says iScore is used by ServiceNow, Coupa, and SAP Ariba
        - Embedding in existing procurement workflows can improve stickiness and upsell paths
        - Public sources do not quantify integration-driven expansion or partner-sourced bookings
    notes: >-
      Mixes company, partner, and independent sources; strategic value reflects likely sales
      importance rather than disclosed revenue contribution, and "gap" captures what public evidence
      still does not prove.
    claimRefs: [CU001, CU002, CU003, CU005, CU006, CU009, CU013]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric / signal
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Federal operating clearance
        - FedRAMP Class D certification with Knox Systems
        - "Recent"
        - PRNewswire release distributed for interos.ai and Knox
        - Medium
        - Lowers a major procurement barrier for federal accounts and defense-industrial-base programs
        - No disclosed pipeline, bookings, or agency conversion from certification
      - - Cross-sell motion
        - itracing is available today to existing interos.ai customers
        - "2025-10-14"
        - Business Wire launch announcement
        - Medium
        - Confirms an installed base that can buy incremental product modules rather than only net-new seats
        - No disclosed attach rate, adoption rate, or incremental ACV
      - - Named public-sector expansion
        - Multi-year contract at the Canadian Coast Guard and Royal Canadian Navy
        - "Recent"
        - Supply Chain Digital
        - Medium
        - Suggests Interos can extend from U.S.-centric messaging into allied-government deployments
        - No disclosed contract size, deployment scope, or renewal terms
      - - Broad enterprise roster claim
        - Leading enterprises include Mastercard, Google, L3Harris, and the US Navy
        - Current page reviewed on 2026-10-17
        - interos.ai blog
        - Low
        - Shows breadth of logos used in selling motion and reference marketing
        - No production status, spend, expansion history, or recency by named account
    notes: >-
      This table records adoption signals rather than a clean cohort time series because the
      assigned pool does not publish account counts, cohorts, or revenue-retention metrics.
    claimRefs: [CU003, CU004, CU005, CU007]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Accenture
        - Enterprise professional services
        - Compliance-gap and real-time third-party risk visibility for client work
        - Appears production-like from quoted practitioner use, not labeled as a pilot
        - Accenture says Interos helps show clients compliance gaps and manage risk in real time
        - Scope, user count, contract value, and retention are undisclosed
      - - Canadian Coast Guard and Royal Canadian Navy
        - Allied government / defense
        - Multi-tier visibility and risk monitoring contract for resilience and adversarial disruption mitigation
        - Reported as a multi-year contract, implying live deployment intent rather than a short pilot
        - Independent coverage points to geographic and public-sector expansion
        - No direct customer quote or post-deployment outcome metric
      - - U.S. Department of Defense and NASA
        - U.S. federal departments
        - Operational resilience and supplier-risk visibility
        - Publicly referenced customer list; production depth not independently described
        - Independent article corroborates that Interos serves major federal accounts
        - Public evidence does not separate active programs from brand references
      - - Mastercard, Google, L3Harris, and the US Navy
        - Large enterprise and government logos
        - Broad reference set used in Interos customer messaging
        - Unknown
        - Shows Interos markets itself with recognizable anchors across commercial and federal buyers
        - Company-issued logo evidence only; no public detail on scope, timing, or outcomes
    notes: >-
      Public named-account evidence is partial rather than exhaustive; rows combine the strongest
      assigned proof and keep unknown fields explicit instead of inferring production depth.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to publicly named accounts and quoted examples visible in the assigned prefetched
        pool on 2026-10-17; private customer lists and undisclosed deployments are out of scope.
    claimRefs: [CU005, CU006, CU007, CU008]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Interos appears to land in procurement and public-sector risk workflows, then expand through
      monitoring, compliance, and new product modules.
    data:
      nodes:
        - label: Government channel entry
          detail: Carahsoft and FedRAMP messaging position Interos for agency and defense buying centers.
          touchpoints:
            - Carahsoft public-sector listing
            - FedRAMP-cleared federal operating posture
        - label: Supplier due diligence
          detail: Early use case is pre-screening and onboarding suppliers for weaknesses and negotiation topics.
          touchpoints:
            - Due diligence
            - Procurement risk
        - label: Continuous monitoring
          detail: Once deployed, Interos pushes automated multi-domain monitoring across broader supplier bases.
          touchpoints:
            - Continuous monitoring
            - Risk scoring across six domains
        - label: Executive and compliance reporting
          detail: The product then surfaces board, regulatory, and compliance reporting use cases.
          touchpoints:
            - Executive reporting
            - Compliance risk
            - Third-party risk management
        - label: Product expansion
          detail: New modules such as itracing, ireputation, and itariffs create cross-sell opportunities.
          touchpoints:
            - itracing
            - ireputation
            - itariffs
        - label: Renewal and concentration check
          detail: Public evidence becomes thin at the renewal stage because retention and mix disclosures are absent.
          touchpoints:
            - NRR/GRR not disclosed
            - Customer concentration not disclosed
    approximationNotes: >-
      Journey stages are synthesized from public use-case descriptions and module launches rather
      than customer-by-customer lifecycle telemetry.
    claimRefs: [CU001, CU002, CU004, CU009, CU010, CU011, CU013]
