  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: Public disclosure of NRR, GRR, logo churn, renewal rates, renewal timing, and typical contract term.
      whyItMatters: Without retention and renewal data, customer durability cannot be distinguished from a logo roster or one-time bookings.
      diligencePath: Request cohort retention, renewal, and contract-duration data segmented by federal and commercial accounts.
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: concentration-gap
      missingEvidence: Government-versus-commercial revenue mix, top-customer concentration, and partner-sourced pipeline or bookings.
      whyItMatters: Concentration can materially change downside risk if a few government programs or channel relationships drive most revenue.
      diligencePath: Ask management for customer concentration, revenue mix, and partner-channel contribution by current fiscal year.
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table coverage
      missingEvidence: A complete list of publicly referenceable production customers with deployment scope, go-live timing, and measured outcomes.
      whyItMatters: The current named-account table is useful but partial, so it cannot establish breadth, recency, or the share of customers in full production.
      diligencePath: Request reference calls or customer case studies that identify production scope, module footprint, and outcome metrics for named accounts.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
