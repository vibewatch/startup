      - number: '5.2'
        title: Operating model and architecture
        blocks:
          - type: paragraph
            body: >-
              The public technical story is a data-ingestion and graph-modeling stack. A 2022 methodology interview
              describes Interos using AI and machine learning to create a knowledge graph of multi-tier business
              relationships and disruptive events, then scoring risk across multiple categories from financial and cyber
              signals to geopolitical and ESG factors. Official solutions copy aligns with that framing by describing
              one overarching risk metric and continuous monitoring across an extended supplier ecosystem. What is less
              settled is scale: public sources cite different counts for entities, suppliers, and relationships, which
              makes the current size of the graph directionally impressive but not a clean, independently corroborated
              KPI. The architectural takeaway is that Interos appears to sell a graph-plus-risk-model platform with
              multiple application surfaces, not a pure dashboard wrapper.
            claimRefs:
