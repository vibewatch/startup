      - number: '3.3'
        title: Pricing, incumbents, and switching realities
        blocks:
          - type: paragraph
            body: >-
              Public pricing remains opaque across the direct peer set. SelectHub and Procurement AI Agents both
              describe Interos as quote-based and enterprise oriented rather than list-priced, and the same comparison
              source says Resilinc and Everstream also use custom enterprise pricing. That limits public comparability
              and shifts diligence toward contract scope, modules, supplier counts, and deployment burden. Incumbent
              suite vendors remain a real substitute because buyers already standardized on SAP, Oracle, or similar
              procurement stacks may accept shallower specialist coverage in exchange for lower integration and
              governance friction. The public record also suggests Interos still requires buyer diligence on data
              dependencies, integrations, and control ownership rather than replacing those tasks end-to-end.
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP012
