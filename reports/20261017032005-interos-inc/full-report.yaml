  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              The observable model is enterprise software sold by quote rather than a transparent seat-based or
              usage-based price card. ERP Research describes quote-based subscriptions and identifies two procurement
              routes: a request-contact sales process for enterprises and the GSA SCRIPTS blanket purchase agreement
              through Carahsoft for federal buyers. The AWS Marketplace listing adds negotiated Private Offer and
              Channel Partner Private Offer paths. Together, these sources indicate contract-level negotiation and
              channel-assisted procurement, but they do not reveal realized ACV, contract duration, discounting, renewal
              terms, channel fees, or revenue recognition policy. itracing is available to existing customers, making
              module attachment a plausible expansion mechanism, although no attach rate or incremental price is public.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
