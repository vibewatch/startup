      - number: '4.2'
        title: Go-to-market motion and value proof
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a high-touch enterprise and government motion rather than self-service acquisition.
              ERP Research reports no free trial, while the AWS listing routes buyers to sales for private offers and
              claims deployment in under two weeks. Company-supplied AWS examples report a 20% reduction in
              due-diligence time for one procurement team and a 60% reduction in external consulting costs and outreach
              for another customer. These examples are useful sales-efficiency and customer-value proxies, not audited
              unit economics: the baselines, customer identities, measurement windows, contract values, implementation
              labor, and sample representativeness are not disclosed. Management should connect these outcome claims to
              win rates, sales cycles, CAC, payback, expansion, and retention cohorts.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
              - CI012
      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Interos says its platform continuously maps 250 million-plus companies and billions of relationships,
              while its product pages describe six monitored risk categories and multiple specialized modules. That
              delivery model implies meaningful data acquisition, cloud processing, model operations, product
              development, security, customer success, and implementation costs, but the assigned sources provide no
              quantified cost split. Fast deployment and workflow automation could support attractive software
              economics, yet public outcome anecdotes cannot establish gross margin or payback. The diligence model
              should therefore leave gross margin, CAC, payback, NRR, services mix, and contribution margin blank rather
              than importing SaaS benchmarks that may not reflect data licensing, channel fees, or government support
              requirements.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI011
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI014
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              ERP Research reports that Interos has raised close to $290 million, including a $40 million strategic
              growth round in October 2024, but funding raised is not cash available and does not establish current
              runway. None of the assigned sources discloses cash, burn, runway, debt balances, covenants, warrants, or
              planned use of funds; none provides audited revenue, ARR, gross margin, or NRR. A low-reputation
              private-markets article asserts a 2026 acquisition and detailed operating metrics, but no assigned company
              announcement, buyer announcement, filing, or reputable report corroborates those claims, so they are
              excluded from the underwriting case. The financial verdict is therefore cautious: monetization mechanics
              and customer value are visible, but revenue quality, margin progression, capital intensity, and financing
              dependency cannot be assessed without management evidence.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial underwriting blocker
            body: >-
              Do not convert funding raised into available liquidity or accept uncorroborated transaction metrics.
              Obtain audited revenue and ARR bridges, gross-margin and NRR cohorts, a cash-to-runway schedule, and
              complete debt terms before setting a financial or valuation case.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the platform delivers
        blocks:
          - type: paragraph
            body: >-
              Interos positions the product as a system of record for supply chain risk intelligence rather than a
              single-point monitoring tool. The official solutions surface bundles supplier mapping, continuous
              monitoring, cyber, compliance, procurement, tariff, and catastrophic-risk workflows into one suite, while
              2025 launch coverage centers the newer itracing module as the expansion from supplier-level visibility
              into product, part, and revenue exposure. In workflow terms, the recurring user jobs are finding hidden
              dependencies, tracing which goods are exposed to a disruption, producing compliance-ready lineage answers,
              and prioritizing actions across procurement, compliance, and resilience teams. That breadth is a real
              differentiator, but it also means underwriting depends on how tightly the modules are integrated in live
              deployments rather than on marketing scope alone.
            claimRefs:
              - CE001
