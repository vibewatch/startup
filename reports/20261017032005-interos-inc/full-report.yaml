        title: Exhibits
        blocks:
          - type: callout
            title: Moat still needs neutral proof
            body: >-
              Public evidence supports Interos's breadth and product velocity, but the assigned pool does not
              independently prove relationship accuracy, tier completeness, forecast quality, or realized enterprise
              pricing, while suite incumbents can bundle adjacent risk modules into broader workflow contracts.
            calloutType: risk
