  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The retained official materials are unusually consistent on what Interos sells: an AI-powered platform
              that maps and monitors extended supplier networks so procurement, risk, and compliance teams can respond
              before disruptions become executive-level problems. That consistency matters because later chapters can
              treat Interos as a supply-chain risk intelligence vendor rather than a generic procurement workflow tool.
              The public footprint in this pool is strongest around product scope and customer type, not around audited
              operating scale. Independent references place the company in the Arlington/Washington, DC market and date
              its founding to 2005, while official and third-party materials both emphasize multi-tier visibility and
              large-enterprise or government adoption rather than self-serve SMB usage. Headquarters evidence is not
              clean: an undated profile says Washington, DC, while the low-reputation transaction article says
              Arlington, Virginia. This chapter preserves the conflict instead of collapsing both descriptions into a
              single verified location.
