        title: 'Direct peers: breadth vs. depth vs. prediction'
        blocks:
          - type: paragraph
            body: >-
              The assigned comparison source gives the cleanest public split inside the direct peer set. Interos is
              described as strongest when a buyer wants automated multi-tier mapping across many risk domains and does
              not want to wait for supplier outreach to stand up the graph. Resilinc is described as stronger where
              supplier-confirmed n-tier and site-level depth matter most, especially for single-source-heavy supply
              chains. Everstream is positioned more around predictive disruption analytics than around validated mapping
              depth. Interos's 2025-2026 launches, especially itracing and iQ, expand its footprint by linking
              disruption data to products, revenue exposure, and ERP-linked workflows.
