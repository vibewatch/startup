  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix and buying center
        blocks:
          - type: paragraph
            body: >-
              Interos sells into procurement, supply-chain, compliance, and risk teams that need ongoing visibility into
              multi-tier supplier exposure rather than one-time vendor screening. Its own product pages frame the
              platform around due diligence, continuous monitoring, executive reporting, and compliance use cases, while
              Carahsoft positions the same platform directly for government procurement, sourcing, and risk leaders.
              That points to a buyer mix concentrated in large enterprises and public-sector programs where complex
              supplier networks, sanctions, cyber, and resilience mandates justify custom enterprise deployments rather
              than self-serve adoption or short transactional pilots in lightly governed segments.
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
              - CU009
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
      - number: '6.2'
        title: Named customer proof is real but unevenly evidenced
        blocks:
          - type: paragraph
            body: >-
              The assigned pool contains multiple public customer signals, but they vary sharply in proof quality.
              Official and partner sources show that Interos has a federal route to market and an installed base
              eligible for new modules, while independent coverage adds named accounts such as Accenture, Freddie Mac,
              the U.S. Department of Defense, NASA, the Canadian Coast Guard, and the Royal Canadian Navy. The strongest
              public proof is the Accenture quotation describing how Interos helps expose compliance gaps and real-time
              risk, plus the reported multi-year Canadian maritime contract; broader logo lists from Interos itself are
              directionally useful but do not establish deployment breadth, production scope, or spend per account.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Expansion logic is visible; durability and concentration are not
        blocks:
          - type: paragraph
            body: >-
              Interos has a plausible land-and-expand story because the platform already spans supplier due diligence,
              continuous monitoring, cyber/compliance workflows, and newer add-ons such as itracing, ireputation, and
              itariffs, with Business Wire explicitly stating that itracing is available to existing customers.
              Independent comparison coverage also suggests the product is best suited to buyers that value broad
              automated graph coverage over the validated sub-tier depth or predictive specialization highlighted by
              competitors. What remains missing is the harder underwriting data: the pool does not disclose NRR, GRR,
              churn, renewal rates, contract length, customer concentration, or government-versus-commercial mix, so
              durability and account concentration risk stay open.
            claimRefs:
              - CU004
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU009
              - CU010
              - CU011
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Two visible customer cores
            body: >-
              Public evidence most clearly supports two customer clusters: government programs reached through FedRAMP
              and Carahsoft channels, and large enterprises using Interos for procurement, compliance, and board-level
              risk reporting.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
          - type: callout
            title: Durable revenue quality is still unproven
            body: >-
              Named logos and contracts are not the same as retention proof; the assigned sources do not disclose
              renewal rates, churn, contract length, or customer concentration, leaving the core SaaS durability
              question unanswered.
            calloutType: risk
            claimRefs:
              - CU005
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The clearest public risk signal is not a disclosed incident; it is scope. Interos says the platform spans
              six risk domains, serves Fortune 1000 and federal buyers, links supplier events to revenue and dollar
              exposure, and is extending into ERP-orchestrated execution rather than a narrow alerting workflow. That
              breadth can be valuable, but it also means delivery quality depends on deep supplier participation, clean
              enterprise master data, and reliable external signal ingestion rather than a single point feature. The
              retained adverse review reinforces that setup risk by flagging complex deployments, low supplier response
              at deeper tiers, and limited public review proof, while Interos's own April 2026 launch still described iQ
              as a debut limited release for select customers.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR010
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR011
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR010
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and control-proof risk
        blocks:
          - type: paragraph
            body: >-
              Interos positions itself as infrastructure for sanctions, trade restrictions, ESG, cyber, catastrophic,
              financial, and geopolitical risk monitoring, and says major federal departments already trust the
              platform. That positioning raises the bar on control evidence: buyers in regulated or defense-adjacent
              environments will expect defensible data integrity, incident response, uptime, and export/sanctions
              governance. The retained pool, however, does not independently verify certifications, uptime commitments,
              or prior incident handling, so the legal and compliance posture is still under-evidenced in public. That
              gap matters more because the independent acquisition report says a Vista transaction would require HSR and
              CFIUS clearance, explicitly linking Interos's customer set and data sensitivity to federal review.
            claimRefs:
              - CR001
              - CR009
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR009
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.3'
        title: Operational and product execution risk
        blocks:
          - type: paragraph
            body: >-
              The operating model demands difficult coordination across ERP records, supplier graph data, and
              continuously refreshed external signals. Interos's official launches emphasize ERP orchestration,
              product-level tracing down to SKUs and materials, and financial-exposure workflows, but the same product
              claims imply more integration and data-governance burden than a dashboard-only tool. The independent
              review sharpens that concern with specific watchouts around master-data mismatches, supplier response
              rates, and pricing add-ons that can expand with mapped suppliers or SKUs. Mitigation exists — the platform
              is designed to prioritize suppliers and connect risk to existing workflows — yet the retained evidence
              still shows an ambitious rollout curve and limited public proof of scaled customer outcomes or mature
              review coverage.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR008
              - CR010
              - CR015
      - number: '7.4'
        title: Dependency, partner, and control-change risk
        blocks:
          - type: paragraph
            body: >-
              Interos also carries meaningful dependency risk. The public footprint shows AWS marketplace distribution,
              ERP-system dependence inside iQ, and a Dataminr-linked reputational-risk capability inside the broader
              product set, so execution depends on third-party platforms and feeds as well as Interos's own graph. Those
              dependencies become more important if the reported Vista transaction is real and on its published
              timeline: a pending change of control can absorb management bandwidth, reshape commercial policy, and
              alter integration priorities before the market has public confirmation of final approvals or financing
              terms. Until diligence confirms transaction status, key partner terms, and customer concentration by
              sector and account, the safest read is that dependency risk remains elevated rather than fully mitigated.
            claimRefs:
              - CR004
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Top risk: implementation quality before category leadership'
            body: >-
              The strongest disconfirming evidence is not market demand; it is execution complexity. Interos's public
              claims require clean ERP linkage, deep supplier participation, and dependable external data, while the
              retained review highlights master-data mismatches, supplier response challenges, and sparse public review
              proof.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR015
          - type: callout
            title: Public control maturity is still under-proven
            body: >-
              The retained pool supports that Interos addresses cyber and compliance use cases, but it does not
              independently verify certifications, uptime commitments, or incident-history disclosures that a regulated
              or federal buyer would typically request before underwriting vendor risk.
            calloutType: assumption
            claimRefs:
              - CR009
              - CR014
              - CR016
          - type: callout
            title: Kill criteria for investment diligence
            body: >-
              The thesis should weaken sharply if management cannot show production-grade security and uptime evidence,
              referenceable scaled deployments beyond limited-release workflows, or a clean approval and financing path
              for any pending change-of-control process.
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The current evidence supports a price-sensitive research-more call rather than a buy. Interos clearly
              still attracts capital, and both the official product pages and the October 2025 itracing launch show a
              company broadening its platform from supplier monitoring toward product-level tracing, revenue-impact
              analysis, tariff visibility, and compliance workflows. That is the positive side of the thesis. The harder
              problem is price discovery: in this chapter's pool, the only explicit current valuation reference is a
              single independent report that Vista agreed to buy Interos for $1.05 billion, implying about 15x projected
              2026 revenue. Without independently verified ARR, gross margin, NRR, burn, or the capital-stack terms
              behind the 2024 and 2026 financings, the right decision is to keep the company on a tighter diligence
              leash than the product story alone would justify.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              Public financing signals remain constructive but incomplete. FundedIQ records six funding rounds totaling
              $180 million of disclosed capital, with a latest $20 million round announced in January 2026. TipRanks and
              other secondary coverage attribute that round to Blue Owl Capital and Structural Capital, while Supply
              Chain Digital separately reported a $40 million Blue Owl investment in October 2024. Those datapoints
              indicate continued sponsor support and reduce near-term survival risk, but they do not establish what
              price new money cleared at or whether the capital came with warrants, liquidation preferences, debt-like
              covenants, or other return-shaping terms. Even basic scale indicators remain imprecise across the pool:
              Beatable lists 109 employees, while FundedIQ places the company in a 251-500 band, and marketed ecosystem
              scale varies between 11 billion and 18 billion relationships across secondary sources. For valuation work,
              the signal is directionally positive but still too noisy for fine-grained underwriting.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: Scenario framing, downside triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The scenario spread is driven less by whether Interos solves a real problem and more by how much verified
              economic quality sits beneath the story. The bull case needs the rumored Vista price to prove real, or at
              least directionally fair, and then needs management to show that revenue quality, retention, and margins
              justify a premium multiple even after software-market compression. The base case assumes the platform is
              strategically relevant and financing-backed but that investors still need hard KPI disclosure before
              assigning a durable standalone mark. The bear case is not product collapse; it is paying a strategic
              scarcity price for a business whose real ARR, gross margin, renewal profile, or preference stack turns out
              materially weaker than the market narrative. That is why the key diligence gates are current transaction
              documents, audited SaaS metrics, and full financing terms.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Hold the price line
            body: >-
              Interos looks strategically relevant enough to keep working, but the public evidence pool still does not
              justify a buy call at a premium mark. The upgrade path is straightforward: verify the current transaction
              or share audited SaaS metrics and financing terms.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
