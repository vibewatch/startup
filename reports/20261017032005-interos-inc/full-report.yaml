  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent spend
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to Interos competing in supply-chain risk intelligence rather than generic
              procurement software or point-solution supplier vetting. The official product pages consistently frame the
              platform around continuous monitoring of finance, ESG, cyber, catastrophic, geopolitical, and restriction
              risk across an extended supplier graph, while independent coverage emphasizes multi-tier mapping and
              visibility beyond direct vendors. That boundary matters because it includes spend tied to supply-chain
              resilience, third-party risk, and procurement decision support, but excludes narrower categories such as
              standalone ESG scoring, basic compliance-led supplier questionnaires, or broad ERP suites that lack deep
              sub-tier mapping. Interos' 2025 itracing launch further stretches the addressable workflow into
              product-level lineage and revenue-impact analysis, which broadens the use case inside existing buyer
              organizations without proving that Interos owns a separate market category of its own.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM015
      - number: '2.2'
        title: Evidence-constrained market sizing
        blocks:
          - type: paragraph
            body: >-
              The public record does not provide a defensible standalone TAM, SAM, or SOM for multi-tier supply-chain
              risk intelligence, so the safest approach is to use demand and monetization proxies instead of repeating a
              generic "large market" narrative. Interos' own messaging highlights complexity inside large enterprises,
              including a cited average of more than 1,700 suppliers for an S&P 500 company, while independent review
              coverage shows buyers paying meaningful contract values for specialized supplier-risk visibility. Public
              graph-coverage claims provide a third lens, but their conflicting 250-million-versus-400-million entity
              counts and 11-billion-versus-18-billion relationship counts are measures of data coverage, not buyer
              spend. These proxies show that the operational problem is broad and that individual enterprise contracts
              can be material, but they do not isolate how many organizations have both the need and implementation
              capacity to buy Interos today.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM011
