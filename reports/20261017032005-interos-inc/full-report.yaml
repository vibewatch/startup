              - CM006
              - CM007
              - CM011
              - CM013
      - number: '2.3'
        title: Buyer map and adoption path
        blocks:
          - type: paragraph
            body: >-
              The clearest buyer pattern is enterprise procurement and risk ownership, especially in organizations with
              deep supplier networks, regulated products, or national security exposure. Independent and
              company-controlled sources both point to federal departments, defense-oriented programs, and Fortune 1000
              enterprises as the core audience, with procurement, supply-chain, and compliance leaders named explicitly
              in the workflow. The adoption path appears to start with supplier-network mapping and risk scoring, then
              expand into procurement decisions, disruption monitoring, regulatory screening, and now product-level
              tracing. That sequence is useful for diligence because it suggests Interos can land on a resilience or
              procurement pain point and later expand into adjacent workflows, but it also means budget ownership is
              likely shared across procurement, supply-chain, compliance, and program leadership rather than
              concentrated in a single line item.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM011
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM011
              - CM013
      - number: '2.4'
        title: Adoption constraints, contradictions, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The same evidence that supports category importance also flags adoption friction. Public pricing remains
              opaque, onboarding appears integration-heavy, and at least one independent review says users need training
              before outputs become useful. Those traits are consistent with a high-touch enterprise category rather
              than a self-serve software segment, which can support larger contract sizes but slows market expansion and
              complicates bottoms-up sizing. The chapter also has to carry forward contradictory market-scale
              disclosures: some retained sources cite more than 250 million businesses and 11 billion relationships,
              while others cite more than 400 million suppliers or companies and 18 billion relationships. That
              inconsistency does not negate product relevance, but it lowers confidence in simple market-share math and
              strengthens the case for management diligence on current graph coverage, customer concentration, and
              whether recent product launches are expanding wallet share or just refreshing the narrative.
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer job
        blocks:
          - type: paragraph
            body: >-
              The same buyer job can be solved several ways: a specialist supplier-risk platform, a broader ERP or
              procurement suite module, or a lower-tech mix of spreadsheets, quarterly assessments, and supplier
              outreach. Interos's own product surfaces frame the company around six-domain supply-chain risk
              intelligence and multi-tier mapping beyond direct suppliers, while third-party comparisons place it in a
              specialist peer set with Resilinc and Everstream rather than in a generic analytics bucket. The relevant
              question for buyers is therefore which tradeoff matters most: broad automated graph coverage, validated
              sub-tier and site depth, predictive forecasting, or lower switching friction inside an existing suite.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP013
