      - number: '5.3'
        title: Maturity, deployment, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The visible suite mixes mature cross-functional risk modules with a more recent product-level workflow.
              The official site shows an already broad catalog, while the October 2025 itracing launch indicates Interos
              is still adding materially new surfaces rather than simply rebranding the original mapping engine. That
              matters because itracing is the clearest evidence of product maturation from generic network visibility
              into revenue-linked and compliance-linked use cases that operating teams can act on. Third-party
              directories also point to iTariffs, Resilience Watchtower, and integration-oriented positioning around
              ERP, TMS, and cloud environments. Still, the public materials in this pool do not show implementation
              benchmarks, published APIs, or customer architecture references, so maturity is better evidenced by suite
              breadth and launch cadence than by externally verified deployment depth.
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE008
              - CE009
              - CE013
              - CE014
      - number: '5.4'
        title: Technical diligence risks
        blocks:
          - type: paragraph
            body: >-
              The main underwriting risk is not whether Interos has a marketable product surface, but how much of the
              technical and operational story can be verified independently. The assigned pool does not provide public
              status data, uptime commitments, implementation case detail, benchmarked model performance, or direct
              developer/practitioner signal such as public documentation or ecosystem usage telemetry. Public scale
              figures also vary across sources, suggesting either fast evolution or inconsistent denominator
              definitions. As a result, product diligence should focus on reference architectures, security/compliance
              artifacts, customer deployment evidence, and proof that the suite behaves as an integrated operating
              workflow instead of a loose bundle of adjacent modules.
            claimRefs:
