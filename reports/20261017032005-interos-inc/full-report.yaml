        title: Leadership, governance, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Leadership is the least cleanly documented part of the current public record. A retained Silicon Review
              profile still describes Jennifer Bisceglie as founder and chief executive officer, while the later Blue
              Owl financing release quotes Ted Krantz as CEO and Dave DeWalt as chairman. That is enough to infer a real
              leadership transition or at least a materially updated governance structure, but not enough to time it
              precisely or separate executive management from board-level influence. Investor naming is clearer than
              control rights: Blue Owl is the disclosed 2024 growth-capital provider, while NightDragon, Kleiner
              Perkins, Venrock, Accenture, Coupa, and ServiceNow are named as backers or strategic supporters. One
              low-reputation outlet describes Vista as an acquirer, but no assigned official or high-reputation source
              confirms signing or closing. The diligence implication is key-person, cap-table, and governance
              verification, not founder-risk elimination.
