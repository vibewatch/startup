      - number: '3.4'
        title: Durability verdict
        blocks:
          - type: paragraph
            body: >-
              Interos appears differentiated when fast stand-up, broad risk-domain coverage, and product-level tracing
              matter more than supplier-validated depth. That is a credible wedge for large enterprises and
              public-sector buyers running wide supplier bases, especially if recent launches help tie risk signals to
              finance and compliance workflows. The public risk is that the source pool does not independently validate
              graph accuracy, tier completeness, prediction performance, or realized customer outcomes. That leaves room
              for Resilinc to win on verified depth, for Everstream to win on prediction-first use cases, and for
              incumbent suites to blunt standalone spend through bundling.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP011
              - CP013
