evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Current ARR or revenue, gross margin, burn, net retention, and customer concentration disclosures.
    whyItMatters: Later valuation and risk judgments cannot be underwritten from category positioning alone.
    diligencePath: Request a current operating-metrics pack or lender/investor materials from management.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: blue-owl-terms
    missingEvidence: Blue Owl facility terms, covenants, warrants, security package, and current draw status.
    whyItMatters: Capital structure and downside risk can change materially even when headline funding amounts look manageable.
    diligencePath: Request executed financing documents and any board materials describing the capital raise.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: leadership-transition
    missingEvidence: >-
      Dated public record or management confirmation explaining the Jennifer Bisceglie to Ted Krantz leadership
      transition and current board composition.
    whyItMatters: Governance, key-person dependence, and customer confidence hinge on who actually owns the operating mandate today.
    diligencePath: Obtain a current board roster, executive org chart, and dated newsroom chronology from the company.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: platform-scale-denominator
    missingEvidence: >-
      A current official fact sheet reconciling 400M+ mapped entities with the inconsistent 11B versus 18B relationship
      counts shown in public references.
    whyItMatters: >-
      Scale claims are part of the product moat narrative and should use a stable denominator before later chapters
      reuse them.
    diligencePath: Ask management for the current dataset methodology and the latest approved product-fact sheet.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: minor
    topic: milestone-chronology
    missingEvidence: Additional dated pre-2024 financing, product, or regulatory milestones to extend the chronology beyond six points.
    whyItMatters: >-
      The chapter can show momentum and stage, but not a fully continuous operating history from the retained public
      pool alone.
    diligencePath: Pull a full newsroom archive and financing database export before final publication.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      Independent market reports or company disclosures that isolate the serviceable market for multi-tier supply-chain
      risk intelligence rather than adjacent procurement or compliance software.
    whyItMatters: >-
      Without a segmented market model, valuation and penetration arguments rely on indirect proxies rather than an
      evidence-backed TAM, SAM, and SOM.
    diligencePath: >-
      Request management's category sizing model, recent board materials, and any third-party analyst work used in
      fundraising or strategic planning.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-mix
    missingEvidence: >-
      Public disclosure of pricing bands, average contract value, deployment scope, and commercial versus federal
      customer mix.
    whyItMatters: >-
      Budget ownership, sales efficiency, and market-share potential depend on whether Interos lands as a broad
      resilience platform or a narrower high-touch federal and enterprise product.
    diligencePath: >-
      Obtain price books, representative MSAs or order forms, cohort-level ACV data, and a current revenue split by
      customer segment.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM009
  - type: conflicting-data
    severity: material
    topic: graph-scale
    missingEvidence: >-
      A current management-verified definition of graph coverage, including whether the business, supplier, and
      relationship counts changed because of methodology or product-scope updates.
    whyItMatters: >-
      Conflicting scale metrics weaken credibility around differentiation and make it hard to benchmark penetration or
      data-network moat strength.
    diligencePath: >-
      Ask management to reconcile current graph metrics across investor, product, and press materials and provide the
      latest audited or board-level definition.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized Interos contract ranges, module uplifts, supplier-count thresholds, services fees, and discount curves
      versus peer contracts.
    whyItMatters: >-
      Public quote-based pricing prevents clean switching-cost and ACV comparisons across direct peers and incumbent
      suite substitutes.
    diligencePath: >-
      Request redacted order forms or recent quotes for Interos, Resilinc, Everstream, and one suite incumbent
      deployment.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat-risk
    missingEvidence: >-
      Neutral benchmark evidence on graph accuracy, tier completeness, alert precision, false positives, and outcome
      attribution by product.
    whyItMatters: >-
      Competitive durability depends on whether Interos's breadth translates into measurably better decisions than
      validated-depth peers or incumbent suite modules.
    diligencePath: >-
      Request buyer win-loss summaries, pilot scorecards, and customer references that compare accuracy and
      time-to-value against named alternatives.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: Audited revenue and ARR bridges, gross margin, NRR, services mix, and revenue-recognition policy.
