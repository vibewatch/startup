chapter:
  number: 3
  title: Competitors
  summary: >-
    Cognite CDF competes across three distinct rings: legacy operational-technology (OT) incumbents led by AVEVA
    (PI System, now Schneider Electric) and AspenTech (now Emerson), a cohort of enterprise AI horizontal
    platforms including C3.ai and Palantir, and cloud hyperscaler industrial services from AWS and Azure that
    commoditize the lower data-collection stack. Cognite's Industrial Knowledge Graph and Atlas AI workbench
    offer genuine differentiation over every incumbent category, but entrenched OT distribution channels,
    ongoing hyperscaler infrastructure build-out, and the pervasive status-quo of PI+spreadsheet deployments
    represent durable headwinds that constrain the pace of competitive displacement.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: |
      Cognite operates in a multi-layer competitive landscape with no single direct twin. The primary competitive
      categories are: (1) legacy OT data historians and industrial software incumbents—AVEVA PI System
      (Schneider Electric), AspenTech (Emerson), and Siemens Industrial Edge—whose entrenched installed bases
      create high switching friction; (2) enterprise AI horizontal platforms—C3.ai, Palantir AIP—that compete
      for the same enterprise AI budget at large industrial operators; (3) cloud hyperscaler industrial services—
      AWS IoT SiteWise, Azure Digital Twins—that commoditize the data ingestion and connectivity layer; (4)
      adjacent Industrial IoT vendors—Seeq (analytics), PTC ThingWorx/Velotic (IIoT connectivity), Hexagon
      (asset lifecycle/3D spatial intelligence), and GE Vernova (power-focused)—that overlap on specific
      capabilities; and (5) status-quo and internal-build alternatives—OSI PI historian plus manual spreadsheet
      analysis plus siloed SCADA/DCS systems, or custom cloud data-lake architectures built on Snowflake or
      Databricks. No single competitor replicates CDF's full stack of data ingestion, knowledge graph
      contextualization, and low-code AI agent workbench for industrial operations. The competitive threat
      landscape is therefore asymmetric: incumbents hold distribution power, hyperscalers hold infrastructure
      leverage, horizontal AI platforms hold enterprise sales relationships, and Cognite holds domain depth and
      AI-native architecture.
