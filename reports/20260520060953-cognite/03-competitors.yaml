  - id: capability-pricing-gtm-comparison
    title: Capability, Pricing, and GTM Comparison
    body: |
      Cognite's key differentiators across the competitor landscape are its Industrial Knowledge Graph
      architecture—which contextualizes relationships between assets, time series, documents, and 3D models
      in a unified semantic layer—its Atlas AI low-code agent workbench, and its cloud-native open-API design.
      No incumbent historian (AVEVA PI, AspenTech) or horizontal AI platform (C3.ai, Palantir) replicates this
      combination. AWS IoT SiteWise and Azure Digital Twins address the infrastructure layer but lack
      Cognite's domain-specific data modeling and pre-built industrial contextualization.

      Pricing across this landscape is largely opaque for private-market participants. Cognite operates on
      a SaaS subscription model with per-asset or per-data-volume pricing components, implementation services,
      and professional-services layers, but exact list pricing is not publicly disclosed. AVEVA PI System is
      sold via perpetual plus maintenance and subscription models; AspenTech uses a token-based subscription
      model for its aspenONE engineering suite. C3.ai uses an application-specific subscription model;
      Palantir's engagements are large-scale custom contracts often in the $10 million-plus range.
      AWS IoT SiteWise and Azure Digital Twins use cloud consumption-based pricing (per-message, per-query,
      per-tag) that creates a lower entry point at small scale but potentially high costs at enterprise scale.

      Cognite's GTM strategy emphasizes executive-level enterprise sales, Microsoft co-sell partnerships,
      and strategic integrations with Databricks and Snowflake for analytics and data lake interoperability.
      Its key distribution moat versus incumbents is the Microsoft partner ecosystem: named Microsoft Energy
      and Resources Partner of the Year for three consecutive years through 2024, Cognite benefits from
      Microsoft's global enterprise account relationships. This partially offsets the OEM/bundled channel
      advantages held by AVEVA (inside Schneider Electric's broader industrial automation portfolio) and
      AspenTech (inside Emerson's process automation suite).
