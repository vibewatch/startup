  - id: switching-costs-and-lock-in
    title: Switching Costs, Lock-in, and Multi-homing
    body: |
      Cognite CDF creates multi-layered switching costs for customers who complete full deployments.
      The Industrial Knowledge Graph schema, once populated with thousands of asset models, contextual
      relationships, and time-series tag mappings across an enterprise's facilities, represents a
      significant proprietary data structure investment. Custom integrations with OT source systems
      (DCS, SCADA, historians), API applications built on CDF, and trained Atlas AI agents are all
      specific to CDF's data model and API surface, increasing the operational cost of migration.
      Multi-homing—running CDF alongside a competing platform—is technically feasible but operationally
      complex and is rarely observed beyond pilot/evaluation contexts.

      The migration path from a legacy AVEVA PI System deployment to Cognite CDF requires rebuilding
      OT source connectors, remapping the PI tag hierarchy to CDF's knowledge graph schema, and
      retraining operational users who rely on PI-based tools for day-to-day operations. This transition
      typically involves multi-month implementation efforts with system integrators, creating a meaningful
      barrier that benefits the incumbent (PI System) even when buyers prefer CDF's capabilities.

      Conversely, the status-quo alternative—the combination of PI historian, manual data exports,
      and spreadsheet-based analysis—has the lowest switching cost profile for initial replacement
      but the highest analyst productivity cost, and represents Cognite's most common greenfield
      opportunity. The internal-build alternative (custom Snowflake/Databricks data lake plus
      Python/ML pipelines) is a growing competitive threat among industrial IT teams with sufficient
      data engineering resources, offering zero license cost at the price of sustained internal
      development investment.
    claimRefs:
      - CP033
      - CP031
      - CP032
      - CP039

  - id: moat-durability-adverse-evidence
    title: Moat Durability, Commoditization Risk, and Adverse Evidence
    body: |
      Cognite's most durable competitive advantage is the combination of industrial domain expertise,
      the Industrial Knowledge Graph's semantic data architecture, and the Atlas AI agent workbench
      that sits atop this foundation. However, three structural threats warrant ongoing diligence:
      first, AVEVA's entrenched PI System installed base and Emerson/AspenTech's bundled OT+software
      channel represent distribution advantages that cannot be overcome quickly by product superiority
      alone—Cognite must demonstrate multi-million-dollar ROI per deployment to displace incumbent
      contracts; second, AWS and Azure are actively expanding industrial IoT service portfolios,
      potentially commoditizing the lower layers of CDF's value stack over a 3-to-5-year horizon
      as cloud-native connectivity and storage become undifferentiated; and third, Cognite's last
      publicly confirmed valuation of $1.6 billion (May 2021) has not been updated, while publicly
      traded competitors (C3.ai, Palantir) have full market-cap transparency, and well-funded
      enterprise divisions of Schneider Electric and Emerson have virtually unlimited investment
      capacity, meaning Cognite's competitive capitalization relative to peers is opaque.

      Adverse evidence from Gartner Peer Insights reviews of the industrial IoT platform market
      indicates that enterprise buyers cite implementation complexity, total cost of ownership, and
      professional services dependency as top concerns across the category—concerns that apply
      directly to Cognite's high-touch deployment model. The Gartner reviews also reflect a buyer
      landscape that is genuinely competitive across multiple vendors, with no single platform
      earning overwhelming user endorsement, underscoring execution risk for all vendors including
      Cognite. No specific documented competitive losses by Cognite to named competitors have been
      identified in public sources reviewed through May 2026, though Cognite does not disclose
      win/loss data publicly.
