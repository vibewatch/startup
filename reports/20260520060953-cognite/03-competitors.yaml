callouts:
  - calloutType: strength
    title: Industrial Knowledge Graph is Structurally Unreplicated
    body: >-
      No competitor in the reviewed landscape replicates Cognite's combination of operational time-series
      ingestion, semantic knowledge graph contextualization, and low-code AI agent workbench in a unified
      cloud-native architecture. AVEVA PI focuses on historian depth; C3.ai and Palantir are horizontal and
      require customer-provided data infrastructure; AWS and Azure provide infrastructure without domain AI.
      This structural gap sustains Cognite's competitive differentiation in the near term, with the primary
      risk being internal build on Databricks/Snowflake by sophisticated industrial IT teams.
    claimRefs:
      - CP034
      - CP035
      - CP032

  - calloutType: risk
    title: Incumbent OT Channel and Hyperscaler Commoditization Represent Durable Headwinds
    body: >-
      AVEVA's PI System installed base and Emerson/AspenTech's OT+software bundle represent distribution
      advantages that cannot be overcome by product superiority alone—incumbent contracts have 3-to-7-year
      renewal cycles and embedded user workflows. Simultaneously, AWS IoT SiteWise and Azure Digital Twins
      are expanding industrial capabilities at infrastructure pricing, risking commoditization of CDF's
      lower data-collection stack over a 3-to-5-year horizon. Cognite must demonstrate compounding ROI
      from the knowledge graph and Atlas AI layers to justify premium pricing versus hyperscaler alternatives.
    claimRefs:
      - CP036
      - CP037
      - CP003
      - CP008

  - calloutType: insight
    title: C3.ai as Public-Market Proxy for Industrial AI Category Health
    body: >-
      C3.ai (NYSE: AI) is the only publicly traded pure-play industrial AI SaaS company with comparable
      positioning. Its SEC-filed financials indicate continued losses and revenue growth scrutiny, providing
      an adverse data point for the industrial AI category's path to profitability. Cognite's stronger
      revenue growth rate (36% ARR growth vs. C3.ai's slower growth) and vertically integrated platform
      approach may support a differentiated financial trajectory, but the C3.ai proxy should be monitored
      for market signals on customer willingness to pay and contract durability in industrial AI deployments.
    claimRefs:
      - CP014
      - CP018
      - CP016

