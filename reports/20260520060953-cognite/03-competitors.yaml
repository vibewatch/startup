  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Enterprise contract deal sizes for AVEVA, AspenTech, and Cognite
      missingEvidence: "Specific average contract values (ACV), deal sizes, and professional services attach rates for AVEVA PI System, AspenTech, and Cognite CDF enterprise deployments; all vendors negotiate pricing privately and do not publish list prices."
      whyItMatters: "Without deal size benchmarks it is impossible to compare Cognite's pricing competitiveness against entrenched OT incumbents or model the total cost of ownership for a CDF deployment versus PI System, which is a critical gap for commercial diligence."
      diligencePath: "Request pricing model documentation from Cognite management; obtain indicative quotes through an SI partner engagement; review C3.ai public filings for industrial AI contract economics as a partial proxy; consult Gartner or Forrester TCO studies for IIoT platforms."
      relatedQuestionRefs: [QP005]

    - type: private-evidence-only
      severity: material
      topic: Documented competitive losses for Cognite vs. AVEVA, C3.ai, and Palantir
      missingEvidence: "Publicly verifiable records of specific customer decisions to select AVEVA CONNECT, C3.ai, or Palantir AIP over Cognite in head-to-head competitive evaluations; vendors do not disclose competitive win/loss data and no public case studies of competitive losses were identified."
      whyItMatters: "Without documented competitive loss cases it is difficult to identify Cognite's specific weaknesses in contested evaluations; Gartner peer reviews reference integration complexity concerns but do not identify win cases for named competitors, leaving the adverse-scenario picture incomplete."
      diligencePath: "Conduct reference calls with prospects who evaluated multiple vendors; consult SI partners who manage competitive RFPs; request a competitive win/loss summary from Cognite management; review Gartner Peer Insights and G2 for decision narratives."
      relatedQuestionRefs: [QP013]

