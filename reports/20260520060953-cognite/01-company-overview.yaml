callouts:
  - calloutType: risk
    title: "Founder-Linked Governance Risk"
    body: >-
      Cognite's majority control by Aker ASA (a private Norwegian conglomerate), combined with a 7.4% stake held by
      its largest customer Saudi Aramco, creates a governance structure where commercial and financial interests may
      not be fully independent. The co-founder's continued senior role as Chief Strategy Officer and the founder-CEO
      transition history merit governance diligence before any institutional investment.
    claimRefs:
      - CO011
      - CO012
      - CO013
  - calloutType: risk
    title: "Stale Valuation and Private Capital Opacity"
    body: >-
      The last publicly confirmed valuation is $1.6B from May 2021. The 2024 ~$300M TCV-led round has not disclosed
      a valuation, making it impossible to confirm whether the company has appreciated or whether dilution has occurred.
      Total capital raised may exceed $450M ($150M + $300M + Accel prior rounds) but is not officially confirmed.
    claimRefs:
      - CO017
      - CO018
      - CO019
  - calloutType: strength
    title: "Accelerating Platform Adoption with Enterprise AI Momentum"
    body: >-
      Atlas AI's 700% customer count growth, 59% ARR penetration, and >70% new booking attach rate demonstrate
      rapid platform deepening beyond the legacy DataOps offering. At 36% ARR growth with 150% NRR for newer
      customers, Cognite shows the compounding dynamics of an industrial SaaS platform with strong land-and-expand
      characteristics.
    claimRefs:
      - CO021
      - CO022
      - CO025
      - CO026

