  - id: milestones-and-adverse-events
    title: Milestones and Adverse Events
    body: |
      Cognite's ten-year trajectory reflects three phases: a founding/incubation phase (2016/2017–2020) in which the company
      developed its platform under the Aker umbrella with Aker BP as anchor customer; a scale/unicorn phase (2021–2023) in
      which TCV investment, Microsoft partnership, and international customer expansion drove rapid growth; and a U.S.-first
      AI phase (2024–2026) characterized by the Atlas AI launch, CEO-led U.S. reorientation, and Flows platform expansion.

      The CEO transition in 2022—when co-founder John Markus Lervik stepped aside for Girish Rishi—is the most significant
      governance event to date. While framed positively in public communications, founder-to-CEO transitions carry execution
      risk and potential cultural disruption. No adverse events, regulatory actions, or significant litigation are documented
      in public sources reviewed during this research run. The UpGuard vendor risk report for Cognite is active as of May 2026
      and monitors security posture across website, email, network, and brand dimensions; the detailed rating is paywalled, but
      the existence of the report and the "Start a free trial for full access" barrier suggests independent third-party security
      scrutiny that enterprise customers and investors should review. Cognite operates critical infrastructure software for
      energy companies, making security posture a material diligence item. No public incidents, data breaches, or material
      outages were identified in sources reviewed; absence of evidence is not evidence of absence, and StatusGator maintains
      an active monitoring page for Cognite service availability. CNBC Disruptor 50 listing incorrectly names Girish Rishi
      as a "founder"—he joined as CEO in 2022; this factual error in an otherwise relied-upon source is noted for diligence
      hygiene.
