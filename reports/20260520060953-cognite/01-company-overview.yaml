  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: founding-year
      missingEvidence: "Authoritative founding document (corporate registration, incorporation certificate, or official press release explicitly stating 2016 versus 2017) that resolves the discrepancy between the about-us page ('since 2016') and the 2021 press release ('founded in 2017')."
      whyItMatters: "The founding year determines whether the company is a 9- or 10-year-old business and affects milestone dating in diligence materials; for legal and regulatory filings, the exact incorporation date matters."
      diligencePath: "Request the Certificate of Incorporation from Cognite's legal counsel or the Norwegian Brønnøysund Register Centre (Foretaksregisteret) for the formal entity registration date."
      relatedQuestionRefs:
        - QO002

    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: "Post-2024-round valuation; no public disclosure of the valuation achieved in the ~$300M TCV-led round from 2024."
      whyItMatters: "The last known valuation ($1.6B) is from May 2021 and is approximately 5 years stale; with ~$170M+ revenue and 36% growth, the company may be worth significantly more, but any valuation-based analysis is speculative."
      diligencePath: "Request term sheet or investor deck from TCV or Cognite IR. If unavailable, triangulate using comparable revenue multiples for industrial AI SaaS peers."
      relatedQuestionRefs:
        - QO009

    - type: private-evidence-only
      severity: material
      topic: funding
      missingEvidence: "Complete capital history including total raised, round sizes for Accel's investment(s), any debt facilities, and current cap table with full ownership percentages."
      whyItMatters: "Without a full cap table, governance analysis (board control, drag-along/tag-along rights, liquidation preferences) is incomplete; TCV's twice-led investment may carry significant governance rights."
      diligencePath: "Request full capitalization table and investor rights agreement from Cognite's CFO or investor relations contact."
      relatedQuestionRefs:
        - QO006
        - QO010
      relatedTableRefs:
        - TO003

    - type: missing-source
      severity: material
      topic: IPO
      missingEvidence: "Any public statement, filing, or credible reporting on Cognite's plans for a liquidity event (IPO, SPAC, secondary sale, or acquisition) as of 2026."
      whyItMatters: "With >$300M raised and 10 years of operation, institutional investor exit expectations are real; absence of IPO signals may indicate governance or market timing issues, or confidence in continued private growth."
      diligencePath: "Request CEO/CFO commentary on exit timeline in diligence meetings; monitor Norwegian financial press and U.S. SEC pre-registration filings."
      relatedQuestionRefs:
        - QO026

    - type: private-evidence-only
      severity: minor
      topic: security-risk
      missingEvidence: "Full UpGuard vendor risk rating and detailed security posture assessment for Cognite; the detailed report is paywalled."
      whyItMatters: "Cognite operates in critical infrastructure environments (oil wells, refineries, power grids); a poor security rating would be a significant diligence flag for enterprise customers and investors."
      diligencePath: "Obtain full UpGuard report via commercial subscription, or request Cognite's SOC 2 Type 2 audit report directly."
      relatedQuestionRefs:
        - QO023

    - type: conflicting-data
      severity: minor
      topic: total-funding
      missingEvidence: "Confirmation of whether the CNBC Disruptor 50 '$300M' funding figure represents the total capital raised or only the most recent round; if the latter, total capital could be $450M+ (2021 $150M + 2024 $300M + Accel prior)."
      whyItMatters: "Presenting an inaccurate total funding figure affects comparisons with competitors and mischaracterizes the capital intensity of the business."
      diligencePath: "Cross-reference with Crunchbase, PitchBook, or direct Cognite IR disclosure."
      relatedTableRefs:
        - TO004

    - type: private-evidence-only
      severity: minor
      topic: ARR-base
      missingEvidence: "Absolute ARR base figure for Cognite as of FY2025; only ARR growth rate (+36%) was publicly disclosed, not the underlying ARR dollar amount."
      whyItMatters: "Without the absolute ARR base, it is impossible to determine forward revenue visibility or benchmark against publicly traded industrial software peers."
      diligencePath: "Request ARR disclosure from Cognite CFO or investor relations; triangulate against >$170M revenue figure with typical SaaS ARR-to-revenue ratios."
      relatedQuestionRefs:
        - QO005

acknowledgedWarnings:
  - dimension: paywallRisk
    reason: "Chapter restricted source rate (UpGuard paywall, Reuters rate-limited, TechCrunch/Microsoft broken, TCV js-only) is approximately 20%, within the report-level 30% ceiling tolerance; all restricted sources are independently corroborated by open official and news sources."
