  - id: funding-capital-investors
    title: Funding, Capital, and Investors
    body: |
      Cognite's most recent publicly confirmed funding milestone is a $150 million round from growth equity firm TCV in May
      2021, which valued the company at $1.6 billion and conferred unicorn status. TCV's Jake Reynolds joined the board as
      part of that transaction. Cognite's 2021 press release noted the company was growing rapidly with "over 500 employees"
      at that time and characterized the round as "one of the largest funding rounds for a SaaS company in Europe." Prior
      to the 2021 TCV round, Accel had made an earlier growth equity investment (amount undisclosed in public sources), and
      the 2021 press release describes TCV as complementing "earlier funding by global venture capital firm Accel."

      TCV subsequently led an additional investment round. TCV's press release page bears the title "TCV Leads $300M
      Investment in Cognite," and a June 2024 TechCrunch URL (since returned 404) referenced "cognite-raises-300m." CNBC's
      May 2026 Disruptor 50 listing reports "$300 million" in funding, which may refer to the 2024 round alone or total
      disclosed capital. The exact post-2024-round valuation and complete capital history are not publicly disclosed, as
      Cognite is a private company. The $1.6B valuation from May 2021 is the last publicly confirmed figure.

      Aker ASA, the investment vehicle of Norwegian billionaire Kjell Inge Roekke, is Cognite's majority shareholder and
      serves as its corporate parent. An independently run affiliate structure governs this relationship. In February 2022,
      Saudi Aramco purchased a 7.4% stake in Cognite from Aker BP (a distinct entity from Aker ASA), adding a strategically
      significant industrial customer as an equity holder. Saudi Aramco is also one of Cognite's largest customers, creating
      an alignment of financial interest and potential influence on product roadmap and customer access that warrants ongoing
      diligence. Board representation includes Aker ASA-affiliated directors, TCV's Jake Reynolds, and potentially Aramco
      representation (not confirmed in public sources).
