  - id: scale-metrics-footprint
    title: Scale, Metrics, and Geographic Footprint
    body: |
      Cognite's FY2025 was described as a "record-breaking year" in the company's January 2026 press release. Annual revenue
      exceeded $170 million for the first time, against a backdrop of 36% annual recurring revenue (ARR) bookings growth
      year-over-year. Net revenue retention (NRR) for newer customers reached 150%, indicating strong existing-customer
      expansion. Company headcount surpassed 800 employees globally by early 2026, representing 21% growth during FY2025.
      These metrics are preliminary and unaudited, as explicitly stated in Cognite's own January 2026 announcement.

      Cognite's Atlas AI product drove significant acceleration in FY2025: the number of Atlas AI customers grew nearly 700%
      year-over-year; Atlas AI was used by more than half of the customer base (59% by ARR); and more than 70% of 2025 new
      bookings included Atlas AI. Monthly active users (MAU) across the platform grew 26% in 2025. The Industrial Knowledge
      Graph underlying all Cognite products exceeded 80 trillion time series data points in context by end of 2025—a 48%
      increase—and doubled the number of data modeling instances. AI token usage grew nearly 500% year-over-year.

      Approximately 40% of FY2025 revenue came from customers outside oil and gas, representing meaningful diversification
      from the company's historical O&G concentration. Key named customers include bp, Saudi Aramco, TotalEnergies, Aker BP,
      Cosmo Energy (all three Japanese refineries), NOVA Chemicals, B. Braun (medical technology), and Idemitsu Kosan.
      The Forrester analyst blog from 2025 documents NOVA Chemicals deploying CDF in one plant with plans to expand to 11,
      TotalEnergies deploying across 39 assets over three years, and Cosmo Energy storing 250 billion data points across
      three refineries—providing evidence of enterprise-scale deployments. Gross margin, burn rate, and EBITDA remain
      undisclosed for a private company, and the absolute customer count is not published.
