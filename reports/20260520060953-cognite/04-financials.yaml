  - id: cost-structure-and-unit-economics
    title: Cost Structure and Unit Economics
    body: |
      Cognite is a cloud-native software company deployed primarily on Microsoft Azure. Its cost structure
      is dominated by research and development (platform engineering, AI model development, knowledge graph
      infrastructure), global sales and marketing (direct enterprise field force across 6 geographies,
      marketing in a niche industrial vertical), and general and administrative costs associated with a
      800+ person global organization. Cloud infrastructure costs (Azure compute, storage, and AI inference)
      are material given the scale of the Industrial Knowledge Graph (85+ trillion time series data points
      as of Q1 2026) but are largely passed through as platform costs to customers or embedded in
      subscription pricing.

      Gross margin is not publicly disclosed. Industrial SaaS platforms with significant data-infrastructure
      components and embedded professional-services elements typically carry gross margins in the 60–75%
      range, lower than pure horizontal SaaS (70–85%) due to OT-integration services and per-customer
      data contextualization work. Cognite's "Success Tracks" offering and the implementation-intensive
      onboarding for multi-site enterprise customers suggest a material services component that would
      compress blended gross margin below a pure-software benchmark.

      The Norwegian statutory accounts (FY2024) disclose that Cognite AS reported operating expenses
      (implicitly ~NOK 2.08 billion against revenues of ~NOK 1.67 billion) resulting in a significant net
      loss of approximately NOK -547M (~-$52M USD). This is a partial picture—the Norwegian entity likely
      bears centralized R&D costs while some revenue and costs sit in US and other subsidiaries—but it
      confirms the magnitude of cash consumption at the entity level. A fully consolidated group loss
      could be larger or smaller depending on intercompany transfer pricing and non-Norwegian subsidiary
      performance.

      Unit economics at the customer level—LTV, CAC, payback, and net dollar retention by cohort—are
      fully undisclosed. The 150% NRR for "newer" customers is the only public unit-economics proxy and
      is a strong positive signal, but the definition of "newer" (vintage, cohort composition) is not
      specified and the full-base NRR is not stated.
