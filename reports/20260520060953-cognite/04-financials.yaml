company:
  name: Cognite

chapter:
  number: 4
  title: Financials
  summary: >-
    Cognite's financial profile is that of a high-growth industrial SaaS platform that has achieved meaningful scale—
    exceeding $170M in annual revenue as of FY2025—while sustaining a significant net loss characteristic of a company
    investing aggressively in product, headcount, and global expansion. The Norwegian statutory entity (Cognite AS,
    org. 918274758) filed annual accounts for FY2024 reporting revenue of approximately NOK 1.67 billion (~$158M USD)
    and a net result of approximately NOK -547M (~-$52M USD), confirming substantial cash consumption. Known funding of
    at least $450M ($150M TCV 2021 + ~$300M TCV 2024) provides capitalization cover, but burn rate, cash on hand,
    and runway remain undisclosed and represent the central underwriting gap. Revenue quality appears solid: 36% ARR
    bookings growth in FY2025, 150% NRR for newer customers, and Q1 2026 ARR up 57% YoY all signal durable
    expansion economics within the installed base. The key financial blockers are: absence of disclosed gross margin,
    EBITDA, and cash position; a 2021-vintage last publicly confirmed valuation ($1.6B) that is approximately five
    years stale; and the compound conflict-of-interest created by Saudi Aramco serving simultaneously as a 7.4%
    equity holder and one of Cognite's largest customers.

sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing
    body: |
      Cognite operates a software-as-a-service (SaaS) subscription model anchored by two principal platforms:
      Cognite Data Fusion (CDF), the industrial DataOps engine, and Cognite Atlas AI, the low-code industrial
      agent workbench launched in June 2024. Both are sold to enterprise-scale industrial operators under
      multi-year subscription agreements, with professional services and Cognite Success Tracks layered on top.
      The third platform layer—Cognite Flows, launched in May 2026—extends the action layer of the platform
      to frontline workers and is expected to deepen per-seat or per-workflow monetization over time.

      Cognite has not published list pricing for any of its products as of the May 2026 run date. Industry
      convention for industrial DataOps and AI platforms at this scale suggests total contract value (TCV) for
      enterprise accounts typically ranges from several hundred thousand to multi-million dollars per year,
      driven by data volume, number of connected assets, seat count, and professional-services scope. The
      TotalEnergies 3-year partnership to deploy CDF across all upstream assets globally is consistent with
      a multi-million-dollar annual contract value (ACV); however, no specific dollar figure has been
      disclosed. Similarly, the B. Braun engagement and Celanese deployment (via NVIDIA NV-Tesseract) suggest
      mid-to-large enterprise ACV, but specific terms are not public.

      Revenue mix: In FY2025, approximately 60% of revenue derived from oil and gas customers and ~40% from
      outside oil and gas (manufacturing, chemicals, pharma, renewables, utilities). The Atlas AI product
      accounted for more than 70% of new bookings in 2025, suggesting a platform deepening dynamic where
      existing CDF customers layer on Atlas AI subscriptions, driving NRR above 100%. The company's
      "Moonshot" mission—to deliver $100 billion in measurable customer value by 2035—provides a publicly
      articulated North Star that frames both its GTM narrative and its premium pricing posture.

      The Norwegian statutory annual accounts filed with Brønnøysundregistrene (Cognite AS, org. 918274758)
      recorded FY2024 revenue of approximately NOK 1.67 billion (~$158M USD at the 2024 average NOK/USD rate
      of ~10.55). This represents the Norwegian legal entity only; consolidated group revenue including US,
      Japan, and India subsidiaries would differ. It is consistent with—and provides a FY2024 floor for—the
      reported >$170M FY2025 global revenue.
