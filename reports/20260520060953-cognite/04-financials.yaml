  - id: public-traction-and-private-gaps
    title: Public Traction and Private Information Gaps
    body: |
      Cognite's public financial disclosure profile is consistent with a late-stage private company
      actively managing investor narrative: it releases selected ARR growth, NRR, and headcount metrics
      via press releases and analyst validations, while withholding gross margin, absolute ARR, customer
      count, EBITDA, and balance sheet data. The following traction metrics are company-reported and
      preliminary/unaudited, as explicitly stated in Cognite's January 2026 announcement.

      Confirmed public metrics (FY2025): >$170M annual revenue; 36% ARR bookings growth YoY; 150% NRR
      for newer customers; >800 employees globally (+21% YoY); 40% of revenue from non-O&G customers;
      >70% of new 2025 bookings included Atlas AI; 59% of customers by ARR using Atlas AI.
      Q1 2026 acceleration signals: ARR bookings +57% YoY; Atlas AI penetration 72% by ARR;
      knowledge graph 85T+ data points (+30% YoY); AI token usage +900% YoY; MAU +54% YoY.

      Norwegian statutory data (FY2024, Cognite AS entity): NOK 1.67B (~$158M USD) revenue;
      NOK -547M (~-$52M USD) net loss; NOK 2.26B (~$214M USD) total assets; 367 Norwegian employees
      (as of May 2026 per registry). This is partial coverage of the global group.

      The central underwriting gaps are: (1) gross margin and EBITDA path to profitability; (2) absolute
      ARR base (growth rate without the denominator is insufficient for underwriting); (3) customer count
      and concentration (Saudi Aramco + bp likely > 30% of revenue based on strategic positioning—
      unconfirmed); (4) cash on hand and runway; (5) 2024 round valuation and resulting dilution.
      These gaps are systemic for a pre-IPO private company and can only be closed through formal
      due-diligence data room access.
