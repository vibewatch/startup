  - id: capital-adequacy-and-financing
    title: Capital Adequacy and Financing
    body: |
      Cognite's most recent public funding milestone is the ~$300M round led by TCV in June 2024, the
      title of which appears on the TCV press page ("TCV Leads $300M Investment in Cognite"). Combined with
      the $150M TCV round from May 2021 and an undisclosed earlier Accel investment, total known capital
      raised is at least ~$450M. The 2024 round valuation was not publicly disclosed. The last confirmed
      valuation of $1.6B is from the 2021 round—approximately five years stale by the May 2026 run date.
      CNBC Disruptor 50 (May 2026) cites $300M in total funding, which may reflect the 2024 round alone or
      represent their calculation of total publicly confirmed capital.

      The Company Overview chapter (chapter 1 of this report) contains the full round-by-round chronology
      and investor map; this chapter references it for background and mints only the financing claims
      needed to assess forward capital adequacy.

      Cash on hand, monthly burn rate, and runway are entirely undisclosed. The Norwegian statutory
      accounts (FY2024) provide the only available proxy: Cognite AS reported total assets of approximately
      NOK 2.26 billion (~$214M USD) and a net loss of approximately NOK 547M (~$52M USD) for FY2024 alone.
      If we assume the Norwegian entity holds the majority of group cash (which is not confirmed), the
      2024 year-end balance sheet implied a meaningful cash cushion. However, the 2024 round (~$300M)
      closed in June 2024—it is unclear how much of that capital has been deployed by the May 2026
      assessment date. At the FY2024 burn rate (~$52M/year for the Norwegian entity alone), a group-level
      burn rate of $60–90M/year is plausible, implying the 2024 round would provide roughly 3–5 years of
      runway—a reasonable cushion but not an indefinite horizon.

      Aker ASA, as majority shareholder, provides an implicit backstop: Aker's Net Asset Value exceeded
      NOK 100 billion in Q1 2026, its strongest quarter on record. Saudi Aramco's 7.4% equity stake (held
      since February 2022, purchased from Aker BP) adds a strategic investor with deep pockets but creates
      a governance dependency: Aramco is simultaneously Cognite's largest customer and a material
      equity holder, a structure that has historically created both access advantages and product-roadmap
      influence risk.
