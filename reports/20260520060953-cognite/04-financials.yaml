callouts:
  - calloutType: risk
    title: "Stale Valuation and Capital Opacity"
    body: >-
      The last publicly confirmed valuation of $1.6B dates from May 2021. The June 2024 ~$300M round
      closed without a published valuation, leaving any new investor unable to benchmark entry price
      against the most recent financing round. Combined with undisclosed gross margin, ARR, and cash
      position, the opacity creates a significant underwriting gap that no public source analysis can
      close without formal data room access.
    claimRefs:
      - CI021
      - CI022
      - CI023
  - calloutType: risk
    title: "Saudi Aramco Dual-Role Conflict"
    body: >-
      Saudi Aramco's position as both a 7.4% equity holder (since February 2022) and one of Cognite's
      largest customers creates a structural conflict. Aramco's influence on product roadmap, data
      access terms, pricing, and ultimately exit optionality—including any veto or tag-along rights—
      cannot be assessed from public sources and must be examined in any due diligence process.
    claimRefs:
      - CI026
      - CI027
  - calloutType: strength
    title: "Revenue Quality Metrics Consistent with Compounding SaaS Economics"
    body: >-
      The combination of 36% ARR bookings growth in FY2025 (accelerating to 57% YoY in Q1 2026),
      150% NRR for newer customers, and 72% Atlas AI penetration by ARR within 24 months of Atlas
      launch constitutes a strong quality signal. If gross margin is in the 65–75% range (consistent
      with industrial SaaS peers), the Rule of 40 score could exceed 90—a premium-tier profile that
      would support a materially higher current valuation than the stale 2021 $1.6B mark.
    claimRefs:
      - CI029
      - CI030
      - CI033

