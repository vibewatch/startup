  - id: architecture-integration
    title: Architecture and Integration Model
    body: >
      CDF's core architectural innovation is the Industrial Knowledge Graph — a unified semantic
      model that links time-series data, events, documents, visual data streams, 3D models, and
      engineering drawings within a single contextual structure. This graph stores over 80 trillion
      time-series data points in context as of fiscal year 2025, a 48% year-over-year increase. In
      the same period, customers doubled data modeling instances, and AI token usage grew nearly 500%,
      signaling rapid AI adoption on top of the graph.

      Cognite's developer surface is deliberately API-first. The REST API uses versioned endpoints with
      a published backward compatibility policy and end-of-life schedule for deprecated API versions.
      The Python SDK (v8, the current major release) introduced full async support via the new
      AsyncCogniteClient, enabling non-blocking concurrent operations and native async/await patterns
      for all API operations. The SDK is tightly integrated with pandas. A JavaScript SDK is also
      provided. Cognite additionally ships an MCP (Model Context Protocol) server integration, allowing
      developers to connect their development environments and AI coding tools directly to Cognite's
      documentation and API. The Python SDK is distributed through PyPI as the `cognite-sdk` package.

      On the infrastructure side, CDF is cloud-agnostic: it deploys on AWS, Azure, and Google Cloud
      Platform with globally distributed clusters to meet data sovereignty and latency requirements.
      Identity and access management relies on OIDC, with support for Microsoft Entra ID, Okta, and
      other identity providers. Cognite also white-labels CDF to other software providers.

      Integration depth is broad: Cognite has announced integrations with Snowflake (Energy Solutions
      collaboration, January 2026), Databricks (for enterprise AI in industrial operations), Microsoft
      Azure OpenAI Service, and NVIDIA NIM microservices. Customers connect source systems — SCADA,
      DCS, ERP, OSIsoft PI, and others — via CDF's IT/OT ingestion connectors. The Flows architecture
      builds on CDF's knowledge graph rather than adding a separate data layer, ensuring that insights
      and new applications are always grounded in real-time operational context.
