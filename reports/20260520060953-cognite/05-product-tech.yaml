  - id: trust-security-compliance
    title: Trust, Security, and Compliance
    body: >
      Cognite's security program is architected for industries where breaches extend beyond data loss
      to production shutdowns, environmental incidents, and safety events. The platform undergoes
      testing and third-party audits across infrastructure, applications, and operations as part of a
      formal Secure Development Lifecycle (SDL). The company describes security as a "functional
      requirement of the product, not a perimeter fence."

      As of May 2026, Cognite holds the following certifications and attestations: ISO 27001
      (information security management), ISO 9001 (quality management), ISO 27018 (cloud privacy
      for personal data), SOC 2 Type 2 (Security criterion), and SOC 3 (public summary security report).
      CDF additionally supports customer compliance with a set of industrial control and critical
      infrastructure standards: NIST CSF, IEC 62443 (sub-standards 2-4, 3-2, 3-3, and 4-1), CMMC,
      FIPs, NERC CIP v.5, GxP, and CSA STAR Level 1. EU AI Act compliance is declared and globally
      available clusters enable data sovereignty for regulated deployments.

      The Trust Center at trust.cognite.com provides continuous, real-time visibility into security
      posture, system health, and compliance documentation. SOC 2 Type 2 and SOC 3 audit reports are
      available to prospective customers. UpGuard continuously monitors Cognite's externally visible
      security posture using open-source and proprietary threat intelligence feeds, assessing website
      security, email security, phishing and malware, brand reputation, and network security; however,
      UpGuard has not publicly disclosed a specific numeric score or identified material vulnerabilities
      as of May 2026. The statusgator.com service monitors Cognite's platform status for outages,
      including detecting disruptions before they become public. No major publicly documented outage
      affecting customer operations has been identified in the research period.

      Diligence gaps remain: SOC 2 Type 2 full reports are shared only under NDA, not publicly posted;
      IEC 62443 compliance is stated as customer-supportable but an independent third-party IEC 62443
      audit certificate has not been identified; EU AI Act classification for high-risk industrial
      autonomy use cases may require additional documentation; and CMMC certification level is
      undisclosed.
