  - id: product-technical-risks
    title: Product and Technical Risks
    body: >
      Cognite's product and technology risks fall into four categories: data dependency and
      contextualization complexity; AI reliability in mission-critical environments; vendor and
      platform lock-in; and regulatory/compliance depth.

      The Industrial Knowledge Graph, while a strategic differentiator, also represents the primary
      lock-in mechanism. All downstream AI capabilities — Atlas AI agents, Flows workflows, and
      built-in applications — require CDF as the data foundation. Migrating away from Cognite requires
      re-contextualizing potentially hundreds of millions of data relationships across customer IT/OT
      estates. The upfront investment in data contextualization also creates an implementation risk:
      without specialized OT/IT integration expertise, customers face long time-to-value cycles
      despite Cognite's claims of 7 weeks from deployment to measurable impact.

      Context Augmented Generation improves AI accuracy in industrial settings, but LLM hallucination
      remains an inherent risk for mission-critical decisions — equipment shutdowns, process parameter
      adjustments, or safety recommendations. Cognite acknowledges this risk through its CAG architecture
      and emphasis on traceable, sourced outputs, but no independent benchmark quantifying Atlas AI
      hallucination rates versus competing approaches has been identified. Developer community signals
      on hub.cognite.com and Stack Overflow reveal recurring integration challenges with CDF data type
      management (string versus numeric classification), API authentication setup, and time-series query
      optimization — all potential friction points for new customers.

      The SOC 2 Type 2 audit scope is available but only under NDA; the IEC 62443 compliance claim is
      not supported by a publicly referenced independent certification; and the EU AI Act may impose
      additional documentation burdens on Cognite customers deploying high-risk industrial AI (e.g.,
      autonomous process control or safety-critical recommendations). The platform's OIDC reliance on
      third-party identity providers (Microsoft Entra ID, Okta) creates a dependency risk: an IdP
      outage or misconfiguration could lock operators out of mission-critical workflows.
