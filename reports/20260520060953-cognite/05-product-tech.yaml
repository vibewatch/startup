callouts:
  - calloutType: strength
    title: Industrial Knowledge Graph as Core Moat
    body: >
      The Industrial Knowledge Graph is the single most durable differentiator in Cognite's
      product stack. By contextualizing 80 trillion-plus time-series data points alongside
      3D models, documents, and events, CDF enables AI accuracy and data accessibility that
      horizontal cloud platforms cannot match without significant industrial domain investment.
      The graph's compounding value — as more data is added, AI agents become more accurate —
      creates a strong retention moat for established customers.
    claimRefs:
      - CE001
      - CE002
      - CE007

  - calloutType: risk
    title: LLM Hallucination Risk in Safety-Critical Industrial Contexts
    body: >
      Cognite's Atlas AI platform powers AI agents used in real-time industrial operations —
      predictive maintenance, root cause analysis, and process control recommendations. Despite
      the CAG architecture reducing hallucination by grounding responses in graph context,
      no independent benchmark quantifying Atlas AI's hallucination rate versus competing
      industrial AI approaches has been published. In safety-critical settings (e.g., process
      control, chemical plant management), an undetected hallucinated recommendation could result
      in significant equipment damage, production losses, or safety events.
    claimRefs:
      - CE007
      - CE040
      - CE042

  - calloutType: risk
    title: Platform Vendor Lock-in and Migration Complexity
    body: >
      All Cognite products — Atlas AI, Flows, Industrial Canvas, InField, Maintain, Charts —
      require CDF's Industrial Knowledge Graph as their data foundation. Customers who have
      invested years in contextualizing their OT estate within CDF face extremely high switching
      costs. The lack of a published data export format or migration toolchain for moving an
      entire knowledge graph to a competitor creates a structural lock-in risk that diligence
      parties should quantify before large-scale deployment commitments.
    claimRefs:
      - CE001
      - CE041
      - CE043

  - calloutType: recommendation
    title: Verify IEC 62443 and EU AI Act Compliance Depth Before Critical Deployments
    body: >
      Cognite states IEC 62443 support and EU AI Act compliance, but independent third-party
      IEC 62443 certification has not been identified, and EU AI Act classification implications
      for high-risk industrial autonomy use cases (e.g., autonomous process control) remain
      undocumented. Acquirers and enterprise customers deploying Cognite in OT environments
      subject to NIS2, IEC 62443, or EU AI Act high-risk categories should request detailed
      compliance artifacts, audit reports, and a formal legal opinion on EU AI Act risk classification
      for their specific use case before committing to large-scale rollout.
    claimRefs:
      - CE028
      - CE029
      - CE030
      - CE031

