  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security-posture
      missingEvidence: "Full SOC 2 Type 2 audit report and penetration test results for Cognite's platform"
      whyItMatters: "Without a publicly accessible SOC 2 Type 2 report, prospective customers and investors cannot independently assess the scope, effectiveness, and any exceptions noted in Cognite's security audit."
      diligencePath: "Request SOC 2 Type 2 report under NDA directly from Cognite; verify audit period, auditor identity, and any management responses to exceptions."
      relatedQuestionRefs: [QE017]

    - type: missing-source
      severity: material
      topic: developer-community
