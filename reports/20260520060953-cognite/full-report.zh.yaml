      - number: '4.2'
        title: GTM 动作与销售效率
        blocks:
          - type: paragraph
            body: >
              Cognite 只靠直销型企业销售推进商业化。Paul Grenet 的头衔是总裁兼首席营收官，说明公司把一线运营和营收责任放在同一套架构里。区域总裁覆盖美洲（Bill
              Hendricks）、EMEA（Petteri Vainikka）、日本（Ryoichi Egawa）、北亚和东南亚（TS Park）以及印度（Guru
              Ananthanarayanan），形成完整的全球直销版图，也符合 $100M+ ARR 企业软件公司的配置。


              工业 AI 和 DataOps 的销售周期很长；全新企业部署通常需要 9–18 个月，原因在于 OT 集成复杂、能源巨头采购治理严，以及需要概念验证（PoC）阶段。Cognite 用「Cognite Quick
              Start」降低首次落地门槛，并把 Atlas AI 嵌入 72% 的客户 ARR（截至 Q1 2026），意在加快初始签约、压缩扩张周期。BusinessWire 的 Flows
              公告称，一家全球制药客户把见效速度提升 30X，UAT 从 6–9 个月降到两个月；这些公开生产率指标为定价谈判提供支撑。


              关键共售路径是 Microsoft Azure 合作伙伴关系（2022–2024 连续三次 Energy & Resources Partner of the Year），它把 Cognite 导入 Azure
              Marketplace 商业协议，也接入 Microsoft 企业销售团队的共售动作。Snowflake 和 Databricks 生态合作（2026）把渠道触达延伸到以数据云为中心的采购流程。NVIDIA
              NV-Tesseract 集成（March 2026）又增加了 AI 基础设施共售维度。


              获客成本（CAC）、销售周期长度、magic number 和回本周期均未公开披露。替代指标显示，Cognite 的 CAC 可能偏高，符合长周期企业销售的特征，但高 ACV 和较强
              land-and-expand 经济性（新客户 NRR 150%）可以抵消一部分压力。客户数未公开披露。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: 成本结构与单位经济性
        blocks:
          - type: paragraph
            body: >
              Cognite 是一家云原生软件公司，主要部署在 Microsoft Azure 上。其成本结构由几类开支主导：研发（平台工程、AI 模型开发、知识图谱基础设施）、全球销售和营销（覆盖 6
              个地理区域的企业直销团队、面向小众工业垂直的市场投入），以及支撑 800+ 人全球组织的一般和行政费用。云基础设施成本（Azure 计算、存储和 AI 推理）在工业知识图谱规模下相当可观；截至 Q1
              2026，该图谱已包含 85+ trillion 个时间序列数据点，但这些成本大多以平台成本形式转嫁给客户，或嵌入订阅定价。


              毛利率未公开披露。带有重数据基础设施和嵌入式专业服务要素的工业 SaaS 平台，毛利率通常在 60–75% 区间，低于纯横向 SaaS 的 70–85%，原因是 OT
              集成服务和逐客户的数据上下文化工作会吃掉毛利。Cognite 的「Success Tracks」以及多站点企业客户高实施强度的导入流程，意味着服务成分不小，综合毛利率应低于纯软件基准。


              挪威法定账目（FY2024）披露，Cognite AS 报告运营开支（相对约 NOK 1.67 billion 收入，隐含约 NOK 2.08 billion）并产生显著净亏损，约 NOK -547M（约
              -$52M
              USD）。这只是局部图景；挪威实体可能承担集中研发成本，而部分收入和成本在美国及其他子公司入账，但它确认了实体层面现金消耗的量级。集团完全合并后的亏损可能更高，也可能更低，取决于关联方转让定价和非挪威子公司的表现。


              客户层面的单位经济性——LTV、CAC、回本周期以及按队列划分的净美元留存——均完全未披露。「新」客户 150% NRR
              是唯一公开的单位经济性替代指标，也是强正面信号；但「新」的定义（年份、队列构成）没有说明，全量客户 NRR 也没有披露。
