      - number: '6.3'
        title: 客户留存、扩张与商业耐久性
        blocks:
          - type: paragraph
            body: >
              Cognite 披露其较新客户队列净收入留存率为 150%，说明扩张收入显著超过任何流失。公司报告 Atlas AI 自发布以来客户增长 700%，截至 May 2026，30%+ 的整体客户基础已经启用
              Cognite Flows。这些数字由公司自报且未经审计，但 Forrester 分析师覆盖和具名客户部署模式提供了方向性佐证：TotalEnergies 从试点到 39 项资产的多年扩张、Aker BP
              持续的多资产部署、Idemitsu 的全平台推广，都反映了耐久的企业承诺。知识图谱现在持有 80 trillion 个时间序列数据点，同比增长
              48%，意味着客户数据活动持续发生，而不是静态部署。独立的总收入留存或流失率证据并未公开。未发现针对 NRR 或流失指标的监管文件或第三方审计。集中度风险存在：Saudi Aramco 同时是 Cognite
              的大股东（2022 年取得 74% 股权）和最大锚定客户之一，形成所有权—客户依赖关系；这种结构并不寻常，且可能让正在评估该平台的竞争性石油公司担忧。
