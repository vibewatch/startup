      - number: '1.2'
        title: 创立、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Cognite 的起源与挪威企业集团 Aker 深度交织。Cognite 官方 about-us 页面称，公司“自 2016 年以来”一直推进这项使命； 但其 2021 年 5 月新闻稿明确写道“Cognite
              成立于 2017 年”，并提到成立以来“四年”。CNBC 2026 年 5 月 Disruptor 50 档案则称，Cognite “2016 年在奥斯陆成立，作为欧洲石油公司 Aker BP 的战略伙伴”。这个
              2016 年与 2017 年的时间冲突，在公开记录中重要且尚未解决。创立命题是借工业数据释放来改造重资产行业， Aker BP 同时是孵化方和锚定客户。挪威连续创业者 John Markus Lervik 与前
              Google 软件工程师 Geir Engdahl 共同创办公司；后者担任 CTO AI 和联合创始人。两人仍在公司活跃。


              2022 年，John Markus Lervik 退居首席战略与发展官后，Girish Rishi 被任命为 CEO。Rishi 也担任董事会主席， 带来美国企业软件经验：他曾是 Blue Yonder（后被
              Panasonic 收购的供应链软件公司）CEO，此前也在 Motorola 和 Tyco 担任高管。这次 CEO 更替是一个值得注意的治理事件：创始人交棒职业 CEO，往往意味着公司转向商业化和美国市场扩张；
              随后总部迁往亚利桑那也与此一致。Cognite 现任高管包括 Jeff Coulter（CFO）、Chirayu Shah（首席产品官）、 Liat Berger（首席人力资源官）、Paul
              Grenet（全球现场运营总裁）、Sandy Joung（首席营销官）和 Håkon Bjerke（首席战略官）。区域总裁覆盖美洲（Bill Hendricks）、EMEA（Petteri
              Vainikka）、日本 （Ryoichi Egawa）、北亚和东南亚（TS Park）以及印度（Guru Ananthanarayanan）。Cognite 员工来自 60 多个国家。董事会监督包括 Aker
              ASA 关联董事，以及 Jake Reynolds（TCV 普通合伙人，2021 年加入董事会）。 鉴于 Girish Rishi 和 Geir Engdahl
              分别承担战略与技术领导职责，公司对两位关键人物的依赖评估为高。
