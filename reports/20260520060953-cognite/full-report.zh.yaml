  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览
        blocks:
          - type: paragraph
            body: >
              Cognite 位于工业运营、企业软件和生成式 AI 的交叉点；这种组合把多重风险维度同时集中在一起。截至 May 2026，公司报告 FY2025 ARR 为 $170M+、同比增长
              36%，但仍是私营公司，没有经审计公开财务报表，因此烧钱速度、毛利率和现金跑道存在根本不透明。


              风险热力图（FR001）按严重性和发生可能性绘制每个主要风险类别。剩余严重性最高的风险，是油气行业集中度，以及资本充足的既有厂商和超大规模云厂商带来的竞争替代。风险传导图（FR002）展示上游冲击——油价崩跌、Aker
              治理变化或 AWS 中断——如何传导到收入、客户续约，最终传导到融资能力和估值。三类风险足以打破投资逻辑：（a）Aker BP 或 TotalEnergies
              作为锚定客户流失且没有替代收入；（b）发生影响工业控制数据的重大安全事件；（c）油价持续跌破约 $60/bbl，导致大型 O&G 运营商推迟或取消数字化转型项目。


              本章依据监管文本（GDPR、EU DSA、EU AI Act 条款）、第三方安全评估和行业媒体风险报道。未披露诉讼、具体客户合同赔偿条款和精确现金消耗方面缺少证据；这些缺口均在证据缺口登记中明确记录。
