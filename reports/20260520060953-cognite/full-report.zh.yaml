  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Cognite 所处竞争格局分为多层，没有单一直接孪生对手。主要竞争类别包括：（1）传统 OT 数据历史数据库 和工业软件既有厂商——AVEVA PI System（Schneider
              Electric）、AspenTech（Emerson）和 Siemens Industrial Edge—— 其深厚装机基础带来高切换摩擦；（2）横向企业 AI 平台——C3.ai、Palantir
              AIP——争夺大型工业运营商同一笔企业 AI 预算；（3）云超大规模厂商工业服务——AWS IoT SiteWise、Azure Digital Twins——将数据接入和连接层商品化； （4）相邻工业 IoT
              厂商——Seeq（分析）、PTC ThingWorx/Velotic（IIoT 连接）、Hexagon（资产生命周期 / 3D 空间智能） 和 GE
              Vernova（聚焦电力）——在具体能力上重叠；以及（5）现状和内部自建替代方案——OSI PI 历史数据库加人工电子表格分析加孤立 SCADA/DCS 系统，或基于 Snowflake、Databricks
              搭建的自定义云数据湖架构。没有单一竞争者复制 CDF 面向工业运营的全栈： 数据接入、知识图谱上下文化和低代码 AI 智能体工作台。因此，竞争威胁是不对称的：既有厂商掌握分销权，超大规模云厂商掌握基础设施杠杆，
              横向 AI 平台掌握企业销售关系，而 Cognite 掌握领域深度和 AI 原生架构。
