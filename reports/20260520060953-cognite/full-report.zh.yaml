              在审阅的竞争格局中，没有竞争者复制 Cognite 在统一云原生架构中整合运营时间序列接入、语义知识图谱上下文化和低代码 AI 智能体工作台的组合。 AVEVA PI 聚焦历史数据库深度；C3.ai 和
