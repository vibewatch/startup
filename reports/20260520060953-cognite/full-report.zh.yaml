      - number: '1.4'
        title: 规模、指标与地域足迹
        blocks:
          - type: paragraph
            body: >
              Cognite 在 2026 年 1 月新闻稿中将 FY2025 描述为“破纪录的一年”。年收入首次超过 $170M；同期年经常性收入（ARR） 预订额同比增长 36%。新客户净留存率（NRR）达到
              150%，显示现有客户扩张强劲。到 2026 年初，公司全球员工数超过 800 人，FY2025 期间增长 21%。这些指标仍是初步且未经审计的数据，Cognite 自己在 2026 年 1 月公告中也明确说明。


              Atlas AI 在 FY2025 显著拉动 Cognite 提速：Atlas AI 客户数同比增长近 700%；Atlas AI 被超过半数客户群使用 （按 ARR 计为 59%）；2025 年新预订中超过
              70% 包含 Atlas AI。平台月活跃用户（MAU）在 2025 年增长 26%。 支撑所有 Cognite 产品的工业知识图谱，到 2025 年底已在上下文中覆盖超过 80 万亿个时间序列数据点，增长
              48%； 数据建模实例数翻倍。AI token 使用量同比增长近 500%。


              FY2025 约 40% 收入来自石油与天然气以外客户，说明公司正从历史上的 O&G 集中度中实现有意义的分散。具名关键客户包括 bp、Saudi Aramco、TotalEnergies、Aker
              BP、Cosmo Energy（全部三家日本炼厂）、NOVA Chemicals、B. Braun （医疗技术）和 Idemitsu Kosan。Forrester 2025
              年分析师博客记录了多项企业级部署证据：NOVA Chemicals 在一座工厂部署 CDF，并计划扩展到 11 座；TotalEnergies 三年内覆盖 39 个资产；Cosmo Energy 在三座炼厂存储
              2500 亿个数据点。 毛利率、烧钱速度和 EBITDA 作为私营公司指标仍未披露，绝对客户数量也未公布。
