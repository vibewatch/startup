      - number: '3.4'
        title: 切换成本、锁定与多平台并用
        blocks:
          - type: paragraph
            body: >
              完整部署后，Cognite CDF 为客户制造多层切换成本。工业知识图谱模式一旦填入数千个资产模型、上下文关系和横跨企业设施的时间序列标签映射，就代表一项重大的自有数据结构投资。与 OT
              源系统（DCS、SCADA、历史数据库）的自定义集成、基于 CDF 构建的 API 应用，以及训练好的 Atlas AI 智能体，都绑定在 CDF 的数据模型和 API
              接口面上，抬高迁移运营成本。多平台并用——在竞争平台旁边运行 CDF——技术上可行，但运营复杂，除试点 / 评估场景外很少看到。


              从传统 AVEVA PI System 部署迁移到 Cognite CDF，需要重建 OT 源连接器、将 PI 标签层级重新映射到 CDF 的知识图谱模式，并重新培训依赖 PI
              工具做日常运营的用户。这类迁移通常需要系统集成商投入数月实施，形成有意义的壁垒；即便买方更偏好 CDF 能力，既有厂商（PI System）仍因此受益。


              反过来，现状替代方案——PI 历史数据库、人工数据导出和基于电子表格的分析组合——初始替换的切换成本最低，但分析师生产率成本最高，也是 Cognite 最常见的新建场景机会。内部自建替代方案（自定义
              Snowflake/Databricks 数据湖加 Python/ML 管道）正在成为拥有足够数据工程资源的工业 IT 团队中的竞争威胁；它以持续内部开发投入为代价，提供零许可成本。
            claimRefs:
              - CP033
              - CP031
              - CP032
              - CP039
      - number: '3.5'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >
              Cognite 最持久的竞争优势，是工业领域专长、工业知识图谱的语义数据架构，以及立在其上的 Atlas AI 智能体工作台。但三个结构性威胁值得持续尽调：第一，AVEVA 深入扎根的 PI System
              装机基础，以及 Emerson/AspenTech 的 OT+软件捆绑渠道，都是无法仅靠产品优势快速打穿的分销优势——Cognite 必须在每次部署中证明数百万美元级 ROI，才能替换既有合同；第二，AWS 和
              Azure 正积极扩展工业 IoT 服务组合，未来 3–5 年内，随着云原生连接和存储变得无差异，可能把 CDF 价值栈底层商品化；第三，Cognite 最后一次公开确认估值是 2021 年 5 月的
              $1.6B，此后未更新，而公开上市竞争者（C3.ai、Palantir）有完整市值透明度，Schneider Electric 和 Emerson 旗下资金充足的企业事业部几乎拥有无限投资能力，这意味着
              Cognite 相对同行的竞争资本化水平不透明。


              Gartner Peer Insights 关于工业 IoT 平台市场的评论提供了反向证据：企业买方把实施复杂度、总拥有成本和专业服务依赖列为该类别最主要担忧，这些担忧直接适用于 Cognite
              的高接触部署模式。Gartner 评论也反映出买方市场确实在多个供应商之间竞争，没有单一平台获得压倒性用户认可，凸显包括 Cognite 在内所有厂商的执行风险。截至 2026 年 5 月审阅的公开资料中，未发现
              Cognite 输给具名竞争对手的具体记录；不过 Cognite 不公开披露赢 / 输数据。
