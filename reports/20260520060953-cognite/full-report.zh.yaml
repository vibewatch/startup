            body: >
              两项集中度风险很重要。第一，Saudi Aramco 74% 股权所有权制造结构性利益冲突：任何正在评估 Cognite 的竞争性一体化巨头（bp 也是具名客户）或国家石油公司，都必须权衡共享给 Cognite
              的敏感运营数据是否会流向竞争对手控股实体。该风险由 Reuters 2022 年对收购的报道记录，Cognite 尚未公开解决。第二，油气仍约占收入 60%，使 Cognite
              暴露于能源转型不确定性和行业资本纪律周期。O&G 具名客户（Aker BP、TotalEnergies、Idemitsu）的证据质量较强，Cognite 提供了带具体指标的案例研究页面，Idemitsu 和
              TotalEnergies 还存在第三方或客户自有佐证。较新垂直进入者（B. Braun、Celanese、JFE Steel）的证据质量较薄：结果主要由 Cognite
              声称，独立验证有限。净收入留存和客户数数据仅由公司披露，尚未被独立审计师或监管文件验证。
