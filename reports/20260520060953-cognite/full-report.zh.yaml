              的知识图谱增强层。March 2026，Cognite 在 NVIDIA GTC 公布并演示 NVIDIA NV-Tesseract NIM 集成，Celanese 是锚定生产部署。March 2026，IDC
              在 IDC MarketScape for Worldwide Industrial DataOps Platforms 2026 中把 Cognite 评为 Leader，理由包括 CDF 支持五项关键工业
              DataOps 能力、白标生态以及通过 Atlas AI 提供的下游 AI 能力。Cognite Flows 于 May 12, 2026 发布，公司于 May 19, 2026 登上 CNBC
