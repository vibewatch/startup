            body: >
              十家具名客户的有记录生产部署，是现实采用最强证据。Aker BP 是 Cognite 合作时间最长的油气参考客户，报告称其在挪威北海六项资产上把目视检查时间最多减少 50%，维护执行时间减少 30-80%。该公司
