      - number: '4.4'
        title: 资本充足性与融资
        blocks:
          - type: paragraph
            body: >
              Cognite 最近一次公开融资节点是 TCV 于 June 2024 领投的约 $300M 轮融资，TCV 新闻页标题为「TCV Leads $300M Investment in Cognite」。叠加
              May 2021 的 $150M TCV 轮融资，以及更早未披露金额的 Accel 投资，已知累计融资至少约 $450M。2024 轮估值未公开披露。上一次确认估值 $1.6B 来自 2021 轮；到 May
              2026 运行日期时已过时约五年。CNBC Disruptor 50（May 2026）引用的总融资额为 $300M，可能只反映 2024 轮，也可能是其对公开确认资本总额的计算口径。


              本报告的公司概况章节（第 1 章）包含完整的逐轮融资时间线和投资人图谱；本章仅把它作为背景引用，并只提炼评估未来资本充足性所需的融资判断。


              账上现金、月烧钱速度和现金跑道均完全未披露。挪威法定账目（FY2024）提供了唯一可用替代指标：Cognite AS 报告总资产约 NOK 2.26 billion（约 $214M USD），FY2024
              单年净亏损约 NOK 547M（约 $52M USD）。如果假设挪威实体持有集团大部分现金（尚未确认），2024 年末资产负债表意味着现金垫较厚。不过，2024 轮约 $300M 于 June 2024 完成；到
              May 2026 评估日时，这笔资本已部署多少并不清楚。以 FY2024 烧钱速度（仅挪威实体约 $52M/year）推算，集团层面 $60–90M/year 的烧钱速度是合理假设，意味着 2024 轮可支撑约
              3–5 年现金跑道——缓冲充足，但不是无限期。


              Aker ASA 作为控股股东提供隐性后盾：Aker 的 Net Asset Value 在 Q1 2026 超过 NOK 100 billion，创历史最强季度。Saudi Aramco 持有 7.4%
              股权（自 February 2022 起，从 Aker BP 购入），带来资金实力雄厚的战略投资人，但也制造治理依赖：Aramco 同时是 Cognite
              最大客户和重要股东，这种结构历来既带来进入优势，也带来产品路线图影响风险。
