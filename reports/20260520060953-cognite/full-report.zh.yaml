      - number: '5.6'
        title: 产品与技术风险
        blocks:
          - type: paragraph
            body: >
              Cognite 的产品与技术风险分为四类：数据依赖和上下文化复杂度；关键任务环境中的 AI 可靠性；供应商和平台锁定；以及监管 / 合规深度。

              工业知识图谱虽然是战略差异点，也是主要锁定机制。所有下游 AI 能力——Atlas AI agents、Flows 工作流和内置应用——都需要 CDF 作为数据底座。客户若要迁离 Cognite，可能需要对其
              IT/OT 资产中数亿条数据关系重新上下文化。前期数据上下文化投入也制造实施风险：如果没有专门的 OT/IT 集成经验，即便 Cognite 声称部署到可衡量影响只需 7 周，客户仍会面临较长见效周期。

              Context Augmented Generation 提升了工业场景中的 AI 准确性，但 LLM 幻觉仍是关键任务决策的内生风险——包括设备停机、工艺参数调整或安全建议。Cognite 通过 CAG
              架构和对可追踪、有来源输出的强调来承认这一风险，但尚未发现独立基准量化 Atlas AI 相对竞争方法的幻觉率。hub.cognite.com 和 Stack Overflow 上的开发者社区信号显示，CDF
              数据类型管理（字符串与数值分类）、API 认证设置和时间序列查询优化反复出现集成挑战；这些都可能成为新客户摩擦点。

              SOC 2 Type 2 审计范围可获得，但只在 NDA 下提供；IEC 62443 合规声明没有公开引用的独立认证支撑；EU AI Act 可能给部署高风险工业 AI（例如自主过程控制或安全关键建议）的
              Cognite 客户增加文档负担。平台依赖第三方身份提供商（Microsoft Entra ID、Okta）的 OIDC，也带来依赖风险：IdP 中断或配置错误可能让操作员无法进入关键任务工作流。
