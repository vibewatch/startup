      - number: '5.7'
        title: 图表与证据
        blocks:
          - type: callout
            title: 工业知识图谱是核心护城河
            body: >
              工业知识图谱是 Cognite 产品栈里最持久的单一差异点。CDF 把超过 80 trillion 个时间序列数据点与 3D 模型、文档和事件一起上下文化，使 AI
              准确性和数据可访问性达到横向云平台在没有重大工业领域投入时难以匹配的水平。随着更多数据加入，AI agents 更准确，图谱价值也会复利增长，为既有客户形成强留存护城河。
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE007
          - type: callout
            title: 安全关键工业场景中的 LLM 幻觉风险
            body: >
              Cognite 的 Atlas AI 平台驱动用于实时工业运营的 AI agents——预测性维护、根因分析和过程控制建议。尽管 CAG 架构把回答扎根在图谱上下文中，从而降低幻觉，但还没有独立基准发布，量化
              Atlas AI 相对其他工业 AI 方法的幻觉率。在安全关键场景（例如过程控制、化工厂管理）里，一个未被发现的幻觉建议可能导致重大设备损坏、生产损失或安全事件。
            calloutType: risk
            claimRefs:
              - CE007
              - CE040
              - CE042
          - type: callout
            title: 平台供应商锁定与迁移复杂度
            body: >
              Cognite 所有产品——Atlas AI、Flows、Industrial Canvas、InField、Maintain、Charts——都需要 CDF 的工业知识图谱作为数据底座。客户若已投入多年时间在
              CDF 中上下文化 OT 资产，切换成本会极高。公司未发布可把完整知识图谱迁移到竞争对手的数据导出格式或迁移工具链，这制造了结构性锁定风险；尽调方应在承诺大规模部署前量化该风险。
            calloutType: risk
            claimRefs:
              - CE001
              - CE041
              - CE043
          - type: callout
            title: 关键部署前核查 IEC 62443 与 EU AI Act 合规深度
            body: >
              Cognite 声称支持 IEC 62443 并符合 EU AI Act，但未发现独立第三方 IEC 62443 认证，高风险工业自主用例（例如自主过程控制）的 EU AI Act
              分类影响也没有文档说明。收购方和企业客户若要在受 NIS2、IEC 62443 或 EU AI Act 高风险类别约束的 OT 环境中部署
              Cognite，应在承诺大规模推广前索取详细合规材料、审计报告，以及针对其具体用例的 EU AI Act 风险分类正式法律意见。
            calloutType: recommendation
            claimRefs:
              - CE028
              - CE029
              - CE030
              - CE031
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础概览与分层
        blocks:
          - type: paragraph
            body: >
              Cognite 的工业数据和 AI 平台服务于能源、制造、化工、制药、金属和矿业等重资产运营商。截至 FY2025，公司报告收入超过 $170M，ARR bookings 同比增长
              36%，意味着客户基础横跨多个垂直和地区。管理层披露，2025 年约 40% 收入来自油气以外行业；相较公司作为挪威油气数据平台的起点，这是有意义的多元化。具名锚定客户包括 bp 和 Saudi Aramco
              等一体化巨头，Cosmo Energy 等国家石油公司，TotalEnergies 和 Aker BP 等多元化能源公司，化学品生产商（NOVA Chemicals、Celanese），一家日本钢铁公司（JFE
              Steel），一家德国医疗器械制造商（B. Braun），以及一家日本炼油商（Idemitsu）。平台 go-to-market
              强调企业数字化转型项目；公开引用的大多数部署覆盖数十到数百项资产、数千名用户。月活跃用户同比增长 26%；截至运行日期，按 ARR 计 59% 客户正在使用 Atlas AI
              层，说明产品采用深度已经超出基础数据集成层。
