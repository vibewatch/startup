      - number: '7.5'
        title: 财务、人员与执行风险
        blocks:
          - type: paragraph
            body: >
              Cognite 的财务风险主要来自行业集中。直到 FY2024，油气客户仍贡献约 60% 收入；公司称 FY2025 收入中已有 40% 来自 O&G 之外。油价如果持续跌破约 $60/bbl
              ——历史上大型资本开支项目推迟的阈值——将立刻压缩 Cognite 核心客户群的数字化转型预算。公司没有公开披露客户行业分布或合同期限，外部很难独立分析集中度。


              Cognite 上一次公开披露估值是 $1.6B，可追溯到 2021 独角兽里程碑；之后没有以新价格完成的股权融资。2024 年 TCV 领投的 $300M
              投资属于新增资本，但估值未披露。任何未来融资轮或战略交易都会重置估值预期；平轮或下轮会通过期权稀释削弱员工留任，也会向评估供应商长期存续能力的企业买家释放竞争压力信号。


              2025 年全球总部从奥斯陆迁至亚利桑那州坦佩，是一项重大人员风险。Cognite 的工程根基在挪威，创始技术团队（包括联合创始人、CTO Geir
              Engdahl）位于奥斯陆。总部迁移让公司战略（美国）和技术执行（挪威）形成地域切分，可能抬高协作成本，也可能导致未迁移的挪威资深工程师流失。员工数在 2025 增长 21%，超过 800
              人；在新地域快速扩张，可能稀释组织知识和文化。


              产品节奏快既是竞争优势，也是执行风险。Cognite 接连推出 Atlas AI（2024）和 Cognite Flows（May
              2026）；每次重大发布都需要大量一线销售赋能、客户导入能力和支持体系。如果商业化执行跟不上产品创新，成交率和价值兑现时间指标都会走弱。
