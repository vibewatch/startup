              Aker ASA 的多数持股既是 Cognite 最大优势，也是最集中的治理风险。Aker 深厚的工业网络和挪威大陆架关系，为 Cognite 带来了最早的标杆客户。但 Aker
              领导层、战略方向或财务状况一旦变化，就会影响 Cognite 获得资本的能力，也可能影响其独立性。投资者应把获得董事会层面对 Aker 未来持股意图的可见性，列为尽调前置条件。
