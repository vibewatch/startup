      - number: '3.2'
        title: 既有厂商与直接同行画像
        blocks:
          - type: paragraph
            body: >
              AVEVA PI System 现由 Schneider Electric 持有，后者在 2023 年 1 月完成了约 $9.5B 收购。PI System 是占主导地位的工业时间序列数据
              历史数据库，在石油与天然气、电力和流程工业中拥有 30 多年装机基础。PI System 的竞争优势在于无处不在的部署足迹：大型工业设施里数以万计的 历史数据库标签，形成深度运营依赖和多年切换摩擦。AVEVA
              已推出云原生数据管理平台 AVEVA CONNECT，作为下一代产品与现代云替代方案竞争； 但它与 CDF 的知识图谱方法属于不同架构哲学。


              AspenTech 在 2022 年由 Emerson Electric 以约 $11B 估值交易收购，面向化学工程、炼油、电力生产和资产绩效管理，核心产品包括 aspenONE 仿真套件和 Aspen
              Mtell 预测性维护产品。Emerson/AspenTech 组合把 OT 控制硬件和软件打包在同一个企业屋檐下，相比独立软件供应商形成渠道优势。 AspenTech
              聚焦流程仿真，而不是运营数据上下文化，因此与 CDF 核心用例的直接重叠有限。


              Seeq 将自己定位为面向工业时间序列数据的高级分析、机器学习和 AI 平台，以数据源无关层运行在 PI System、CDF 或其他历史数据库之上。 不同于 Cognite 的全栈路径，Seeq
              解决的是分析和洞察层，而非数据接入或知识图谱建设，因此它对 CDF 的分析能力既可互补，也会在部分部署中竞争。 C3.ai（NYSE: AI）提供横向企业 AI 应用平台，标杆工业客户包括 Shell、Baker
              Hughes、Koch Industries 和 U.S. Air Force； 但其横向范围和对客户自备数据基础设施的依赖，与 Cognite 的纵向一体化路径形成对比。Palantir AIP
              面向大型企业和政府 / 国防组织，采用高接触交付模式，交易规模通常高于标准工业 SaaS 合同。
