      - number: '7.6'
        title: 缓释措施、监控指标与投资逻辑击穿触发点
        blocks:
          - type: paragraph
            body: >
              几项结构性缓释因素降低了最严重风险情景的发生概率。Cognite 较新客户 150% NRR、Atlas AI 覆盖 59% ARR，说明平台有黏性，近期非计划流失的概率较低。ISO 27001、SOC 2
              Type II 和 IEC 62443 认证提供机构级合规支架，能够应对采购中最常见的安全门槛。多云架构（AWS/Azure/GCP）降低单一供应商故障风险。Aker ASA 的 NOK 110B NAV
              证明其资产负债表厚度足以支持 Cognite 穿越较长增长阶段。


              量化监控指标可以提前预警关键风险。油价期货如果超过 90 天低于 $65/bbl，应重新评估 O&G 客户续约概率。单季 NRR 读数低于 120%，将提示账户收缩先于流失出现。Gartner Peer
              Insights 分数若在两个季度内下滑超过 0.5 分，应标记客户满意度恶化。CTO、CPO、CFO 若在 12 个月内相继离职，应触发人员风险升级。


              投资逻辑击穿触发点，是会从根本上挑战投资逻辑的事件：失去 Aker BP 或 TotalEnergies 客户且看不到替代管线，Cognite 平台被认定造成重大 OT 安全事件，油价持续 12+ 个月低于
              $50/bbl，或发现未披露且有重大财务暴露的诉讼。若确认 Cognite 被大型既有厂商（AVEVA/Schneider、SAP、Microsoft）以低于 2021 $1.6B
              估值标记收购，将意味着账面回报为负。


              缓释与终止标准表（TR005）将每项主要风险映射到可监控触发点和建议行动含义。
