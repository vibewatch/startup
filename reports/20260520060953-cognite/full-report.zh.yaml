  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Cognite 的影响
      - 尽调问题
    rows:
      - - 生成式 AI 智能体采用浪潮
        - 驱动（正向）
        - 当前（2024–2026）
        - Atlas AI 客户同比增长 700%；直接拉动收入
        - 核实 Atlas AI 增长来自存量客户增购还是新增 logo；新增 logo 增长才是耐久性指标
      - - ESG 与脱碳要求
        - 驱动（正向）
        - 中期（2025–2028）
        - 为排放监测、可持续运营数据创造新增预算
        - 评估 ESG 驱动交易是增量预算，还是蚕食现有预算池
      - - 工业劳动力老龄化 / 知识传承危机
        - 驱动（正向）
        - 当前且继续扩大
        - 将 AI 智能体定位为专家知识沉淀工具——对保守买方叙事有力
        - 验证劳动力挑战是否尖锐到足以推动紧急预算分配，而不是停留在愿景路线图
      - - OT 环境云迁移
        - 驱动（正向）
        - 持续（2022–2030）
        - 让工业数据接入云端变得常态化；降低 Cognite 的集成摩擦
        - 跟踪超大规模云厂商的通用产品（AWS IoT SiteWise、Azure）是否会先于 Cognite 拿走这笔预算
      - - 监管与合规要求（ISO 27001、SOC 2）
        - 驱动 + 约束
        - 当前
        - 安全认证降低采购摩擦；合规开销拉长销售周期
        - 核实 Cognite 所称认证是否全部仍有效；检查审计续期日期
      - - 实施复杂度 / 「慢、难、贵」
        - 约束（负向）
        - 长期存在
        - 需要大规模客户成功投入；将可触达市场限制在有耐心且资源充足的企业
        - 评估早期客户队列流失；Forrester 分析师将其标为系统性市场约束
      - - 既有工业软件厂商竞争
        - 约束（负向）
        - 长期存在
        - Siemens、GE Vernova、Honeywell、AspenTech 都提供捆绑分析能力；存量账户切换成本高
        - 梳理多少目标账户已被既有套件锁定；评估 Cognite 在使用 Siemens PCS 7 或 ABB Ability 的账户中的差异化
      - - 企业预算周期长（18–36 个月）
        - 约束（负向）
        - 长期存在
        - 拖慢新增客户获取；让收入确认不均衡；增加预测难度
        - 索取按细分市场拆分的交易周期分析；核实是否已有或计划推出周期更短的 SME 项目
      - - OT 安全与数据主权约束
        - 约束（负向）
        - 长期存在但在缓和
        - 在国防相关、政府监管或中国市场部署中尤其尖锐
        - 评估数据驻留要求是否阻断过重大交易；询问本地部署支持路线图
      - - 超大规模云厂商价格压力（AWS、Azure、Google）
        - 约束（负向）
        - 增强（2025+）
        - 云巨头以低边际成本提供通用工业数据服务；可能将 Cognite 的连接层商品化
        - 评估 Cognite 在超大规模云厂商原生服务之上提供差异化价值的策略；合作与替代的动态
    notes: >-
      时间分类（当前 / 中期 / 长期存在）是分析师基于 Cognite 新闻稿、Forrester 分析师博客（2025）和行业研究作出的估计。「慢、难、贵」这句引语逐字来自分析 Cognite 客户群的 Forrester
      博客。竞争对手名称（Siemens、GE Vernova、Honeywell、AspenTech）来自公开产品目录；竞争强度会随细分市场和地域变化。超大规模云厂商价格压力来自对 AWS IoT SiteWise 和 Azure
      Industrial IoT 产品定位的推断；公开来源没有直接价格对比。
