          note: 18x × $210M NTM 收入；乐观情景中点
        - id: b8
          label: 20x 倍数（乐观上限）
          value: 4400
          unit: USD millions
          note: 20x × $220M NTM 收入；乐观情景上限；需要验证 AI 平台
    approximationNotes: 根据 FY2025 披露的 >$170M 和 15–30% 的假设 NTM 增长，NTM 收入估算为 $200–220M。倍数来自可比分析；毛利率未披露，模型中假设不变。估值为稀释前口径；优先股堆叠未知。
