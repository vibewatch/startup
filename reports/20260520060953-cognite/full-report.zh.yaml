      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Cognite 作为数据处理方，依据 GDPR 为其欧盟客户处理工业运营数据，客户包括挪威、荷兰、德国和英国的主要运营商。挪威数据保护机构（Datatilsynet）是 Cognite
              挪威实体的牵头监管机构；尽管公司在 2025 年把全球总部迁至 Tempe, Arizona，挪威实体仍是其很多欧盟业务的法律基础。


              EU AI Act（Regulation 2024/1689，August 2024 生效）把用于关键基础设施的 AI
              系统——包括炼油厂、化工厂和能源电网——归为高风险系统，要求部署前完成合格评定、风险管理文档和人类监督安排。Cognite 的 Atlas AI agents
              会对生产运营和维护排程提出自主建议，具体是否落入该类别取决于运营商客户授予的自主程度。适用性取决于客户配置，以及 Atlas AI 输出在多大程度上未经人工复核就被执行。截至 May
              2026，这仍是一个活跃监管解释风险，尚无明确先例。


              NIS2（Directive 2022/2555）于 October 2024 生效，对基本服务运营商及其关键技术供应商施加网络安全义务。Cognite 作为能源和关键制造客户的 IT/OT 集成层，可能触发
              Article 21 下的第三方 ICT 供应商义务，要求客户对 Cognite 部署进行安全审计，并通过合同约束 Cognite 遵守事件通知时限。


              截至 May 2026 的检索未发现 Cognite 涉及公开披露的监管执法、诉讼或法律纠纷。没有披露并不等于法律状态干净；私营公司并不总是披露未决争议。这构成下文记录的重大证据缺口。


              监管 / 法律风险登记（TR001）按严重性排列每项暴露，并映射到尽调动作。
