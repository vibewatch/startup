      - number: '8.3'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >
              没有一家上市公司能完全对应 Cognite。最相关的可比公司分成两层：(1) 高增长企业 AI 和数据平台（Palantir、C3.ai），它们与 Cognite 共享 AI
              原生定位和销售画像，但市场组合和客户画像差异很大；(2) 工业软件既有厂商（PTC）和已被收购的平台（AVEVA、AspenTech），它们与 Cognite 共享垂直行业焦点，但增长和利润率画像不同。


              从产品定位看，C3.ai（NYSE: AI）是最接近的上市可比公司——面向工业运营的企业 AI 应用——但有重要限制。C3.ai FY2025 收入约 $310M，同比约 25% 增长。Cognite 的 ARR
              预订增长（36–57% YoY）明显更快，支撑其相对 C3.ai 当前约 8–12x EV/NTM Revenue 倍数享有溢价。关键在于，C3.ai 的公开市场历史提供了警示数据点：EV/Revenue 倍数从
              December 2020 超过 30x 的峰值，到 2025 降至 8–12x，说明当增长不及预期时，情绪驱动的工业 AI 倍数会迅速压缩。C3.ai 向 SEC 提交的 FY2025 10-K
              年报确认净亏损约 $214M——绝对亏损高于 Cognite 估计的集团层面烧钱额，而收入规模约为 Cognite 的两倍。


              Palantir Technologies（PLTR）截至 mid-2026 的 EV/NTM Revenue 倍数高于 30x，但不能作为有效的直接可比公司：Palantir 超过 40%
              收入来自美国政府和国防合同，利润率结构不同，并受益于 Cognite 无法获得的美国国防 AI 支出顺风。Cognite 的可比倍数应较 Palantir 当前标记作实质折价。


              PTC Inc.（NASDAQ: PTC）是规模化工业软件基准，FY2024 收入约 $2.3B，EV/NTM Revenue 倍数约 8–10x。PTC 增速较慢（有机增长 8–12%），意味着 Cognite
              因更高增长应享有溢价；但这部分溢价要被 Cognite 私营公司不透明和油气集中度部分抵消。收购先例提供区间参考。AVEVA（Schneider Electric 以约 £9.5B 收购，January 2023
              完成）隐含收购倍数约为 5–7x 过去十二个月收入。AspenTech（Emerson 在 2022 以约 $11B 估值交易收购）在交割时隐含 15–18x 过去十二个月收入——该溢价由 AspenTech
              高毛利率和黏性流程仿真装机基础支撑。这些先例倍数夹住适用区间：Cognite 以 8–14x NTM Revenue 退出是可辩护的；考虑增长轨迹，低于 6x 将属于低于市场定价。


              独立工业 AI 分析机构 Verdantix 在其 Industrial AI Analytics Green Quadrant（付费报告，2025）中将 Cognite
              评为领导者，确认其在竞争格局顶部的第三方定位。PitchBook 截至 May 2026 的 Cognite 数据受访问限制；标准研究渠道无法获取更新的私人轮估值或老股标记，这本身就是负面的透明度信号。S&P
              Global Market Intelligence 对工业软件估值数据设置付费墙，阻止研究者从一手数据独立推导 NTM 中位倍数。
