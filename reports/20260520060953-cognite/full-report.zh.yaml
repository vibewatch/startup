  - id: TV005
    title: 投资逻辑失效与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Atlas AI ARR 渗透率反转
        - 24 个月内按 ARR 口径，覆盖客户基础低于 50%
        - AI 平台倍数溢价消失；乐观情景坍塌；基准情景受威胁
        - 退出 / 若投资前观察到该触发项则不投
      - - 主要锚定客户流失（Aramco 或 bp）
        - 单一客户流失超过 ARR 的 15%
        - 集中风险兑现；NRR 头部数字掩盖流失；150% NRR 指标可信度被打破
        - 立即重新评估；大概率触发退出
      - - ARR 增长放缓
        - 连续两个季度 YoY 增长低于 20%
        - 基准情景倍数压缩至 5–8x；悲观情景被触发；现金跑道担忧上升
        - 按压缩倍数重新测算；大概率减仓或退出
      - - 披露毛利率低于 50%
        - 毛利率披露显示混合毛利率 <50%
        - SaaS 基准失效；EBITDA 桥接需要重建模型；倍数压缩 30–50%
        - 立即复盘投资逻辑；除非收入加速抵消，否则大概率退出
      - - 降价轮融资或困境再融资
        - 下一轮投后估值低于 $1.6B，或债务带有惩罚性契约
        - 稀释风险兑现；管理层信誉受损；退出窗口变窄
        - 在最早流动性窗口退出
      - - Aker ASA 被迫出售或战略重组
        - Aker ASA 重组能源资产，要求以低于内在价值出售 Cognite 股份
        - 老股压力解除但价格风险上升；可能创造机会型入场
        - 作为潜在流动性事件跟踪；评估买方画像
    notes: 触发项定义为可观察事件或阈值，会在不依赖其他因素的情况下实质损害投资逻辑。触发项评估是作者基于可得证据的判断；由于绝对 ARR 和客户集中度未披露，客户 ARR 阈值均为估计。
    claimRefs:
      - CV011
      - CV016
      - CV033
      - CV034
      - CV038
      - CV039
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 按收入流划分的毛利率
        - 混合毛利率；订阅与专业服务拆分；FY2022–FY2025 毛利率趋势
        - 没有毛利率，就无法套用 EV/毛利润倍数；盈利路径无法建模；与 C3.ai 和 PTC 的基准比较也不精确
        - 向 Cognite CFO 索取；对照挪威登记机构成本结构交叉核验
      - - 全量客户 NRR 和总美元留存
        - 全队列 NRR（不只是新近客户）；总收入留存率；按部署年份划分的流失
        - 新近客户 150% NRR 可能掩盖 Atlas AI 前部署的老 O&G 队列流失；总留存是扩张倍数的底线
        - 向 Cognite 销售副总裁 / CFO 索取；要求按部署年份做队列分析
      - - 绝对 ARR 和按层级划分的客户数
        - 当前 ARR（USD）；按 ARR 层级划分的客户数（如 $1M+、$500K–$1M、<$500K）；ACV 分布
        - 没有分母，增长率无法核验；没有客户数和层级分布，集中风险无法评估
        - 向 Cognite CFO 索取；对照 Forrester TEI 和客户案例研究中的收入信号交叉核验
      - - June 2024 轮投后估值和股权结构表
        - TCV June 2024 轮的投后估值；完整股权结构表，包括优先股堆叠、清算优先权和期权池
        - 不知道当前估值标记，就无法测算入场价格；优先权包袱影响下行保护和回报建模
        - TCV 新闻稿或 Cognite 投资者关系；向法律顾问索取完整股权结构表
      - - 账面现金和 12 个月现金跑道
        - 最近季度现金及等价物；预计烧钱速度；如有，列明债务额度
        - 按估计集团烧钱 $60–90M 计算，June 2024 轮资金可能只剩约 2–3 年现金跑道；下一次融资时点影响入场纪律
        - 向 Cognite CFO 索取；对照挪威登记机构 FY2024 资产负债表核验实体层面现金
      - - 客户集中度确认
        - 前三大和前五大客户收入占比；Saudi Aramco 收入占总收入比例
        - Aramco 7.4% 股权持股带来战略客户兼股东冲突；若 Aramco 超过 ARR 的 20%，集中风险应带来倍数折价
        - 向 Cognite CFO 索取；通过客户公告和 Forrester 客户访谈数据三角验证
      - - IPO 或退出时间表
        - 董事会层面的 IPO 准备讨论（S-1 文件准备、审计师任命、CFO 上市公司经验）；与明确买方的 M&A 对话
        - 退出路径就是回报机制；时间表不清会降低流动性风险定价能力；CNBC Disruptor 50 认可可能释放近期公开市场活动信号
        - 向 Cognite CFO/CEO 索取；通过 TCV 和 Accel 投资者关系渠道交叉核验
      - - 治理与 Aker ASA 退出条款
        - Aker ASA 的治理权、拖售条款，以及对 Cognite 股份的任何优先购买权
        - Aker ASA 多数控制可能阻止或推迟 M&A 退出；理解退出约束是建模任何收购结果的前提
        - 向法律顾问索取 Cognite 股东协议；审阅 Aker ASA 年报中的 Cognite 披露
    notes: 尽调问题按对估值论证的重要性排序。第 1–4 项是投资论证的阻断项；第 5–8 项重要，但可通过替代数据源部分补齐。所有项目都需要直接接触公司或获得投资人级数据室访问权限。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV026
      - CV036
      - CV038
      - CV042
