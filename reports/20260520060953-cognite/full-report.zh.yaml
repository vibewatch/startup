      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              Cognite 市场近期最重要的增长驱动，是生成式 AI 采用浪潮与工业数据集成数十年积压工作的汇合。Cognite Atlas AI 客户在 FY2025 同比增长近 700%，说明 AI
              智能体能力已跨过工业买方的商业化门槛；此前这些买方一直等待技术成熟。ESG 与脱碳要求进一步放大了这股 AI 需求：TotalEnergies
              等公司明确部署工业数据平台，同时改善健康安全监控、减轻排放跟踪负担，并优化生产。


              结构性顺风还包括工业劳动力老龄化和用工短缺：资深工程师退休后，工业运营商面临“知识传递”危机，AI 驱动的知识图谱正对准这一约束。Cognite 对 Atlas AI 的定位——让 AI
              智能体执行过去需要数周的根因分析——直接映射到这个痛点。OT 环境的云迁移（历史上比 IT 滞后 10–15 年）正在加速，AWS（IoT SiteWise）、Azure（Digital Twins）和
              Siemens（Industrial Edge）等供应商让云连接的工厂和现场运营变得常规化。这种常规化降低了 Cognite 的基础设施摩擦，并扩大可部署基础。


              采用约束真实且重大。Forrester 分析师将企业级公司的工业 AI 部署描述为天然“慢、难、贵”，并指出闪亮的 AI 应用只是“冰山上一小块，底下压着一座数据运营基础工程的大山”。切换成本很高：多年期工业
              DataOps 实施会整合数百个 OT/IT 数据源，一旦知识图谱建立，就形成很深的供应商锁定。油气和流程制造的预算周期很长——大型 IT/OT 集成项目从批准到投产通常要 18–36 个月。OT
              安全与数据主权要求增加合规负担，拉长销售周期，并要求投入专门客户成功资源。来自 Siemens、GE Vernova、Honeywell 和 AspenTech
              的既有供应商竞争也会造成切换惯性；这些厂商在自动化套件中捆绑分析能力，且大型客户已在使用其硬件。
