        - 面向个人身份信息的云隐私
        - 适用范围限于个人数据；工业 OT 数据在 GDPR 下不归类为个人数据
      - - SOC 2 Type 2（安全）
        - 已审计 / 已认证
        - 安全信任服务准则；基础设施、应用和运营
        - 完整报告只在 NDA 下分享给潜在客户；无法公开下载
      - - SOC 3（安全）
        - 已审计 / 已认证（公开摘要）
        - 面向公众的 SOC 2 安全控制摘要
        - SOC 3 摘要只覆盖安全准则；可用性和保密性准则未鉴证
      - - IEC 62443（2-4、3-2、3-3、4-1）
        - 支持 / 与客户合规对齐
        - 工业控制系统网络安全；OT 专用安全标准
        - 未发现独立第三方 IEC 62443 认证；合规可由 Cognite 支持客户实现，并非供应商自身认证
      - - NIST CSF
        - 对齐
        - 面向关键基础设施的网络安全框架
        - 未公开披露相对于 NIST CSF 的成熟度等级
      - - NERC CIP v.5 合规框架
        - 支持
        - 大电力系统关键基础设施保护
        - NERC CIP 是否适用取决于客户部署场景；Cognite 是供应商，不直接受 NERC CIP 约束
      - - EU AI Act
        - 合规 / 对齐（自述）
        - 面向欧盟部署 AI 系统的 AI 监管；全球可用集群支持数据主权
        - 工业自主用例若被归入 AI Act 高风险类别，可能需要客户侧补充合规文件
      - - CMMC / FIPs
        - 支持（自述）
        - 美国 DoD CMMC 与联邦信息处理标准
        - CMMC 认证等级（1、2 或 3）未披露；对美国政府或国防相关客户重要
    notes: 认证状态来自 Cognite 官方安全页面和 Trust Center。「支持」表示 Cognite 提供控制，帮助客户合规，并不表示 Cognite 自身持有该认证。
    claimRefs:
