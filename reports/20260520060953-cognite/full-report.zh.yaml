chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Cognite 是一家 B2B 工业 AI 和数据平台公司，服务资产密集型行业，主要包括石油与天然气、 能源和流程制造。它帮助这些企业释放孤岛化运营数据、赋予上下文，并在企业规模部署 AI 驱动的解决方案。


              公司平台由两款核心产品打底：Cognite Data Fusion（CDF）是工业 DataOps 平台，负责在异构 OT 与 IT 系统之间创建并维护工业知识图谱；Cognite Atlas AI 是 2024
              年 6 月推出的低代码工业智能体工作台， 让非开发者也能在知识图谱之上构建和部署 AI 智能体。2026 年 5 月，公司又加入 Cognite Flows，作为平台的 “行动层”，面向一线员工提供统一的 AI
              驱动工作流体验。


              Cognite 的商业模式是软件即服务（SaaS）：客户为平台访问支付订阅费，之上再叠加专业服务和实施支持。 公司瞄准企业级工业运营商，这类客户通常有复杂的多站点环境。Cognite 将 CDF
              定位为数据底座，先把数十年的 运营数据统一起来，AI 智能体和应用才有机会释放价值。截至 FY2025，约 40% 收入来自石油与天然气以外的客户，
              说明公司正有意义地分散到制造、化工、制药和可再生能源。公司总部位于 40 E Rio Salado Pkwy, Suite 900, Tempe, AZ
              85281；近期已将全球总部从挪威奥斯陆迁至此处，以贴近亚利桑那州的高科技和半导体制造生态。 Cognite 还在 Austin TX、Houston TX、挪威 Lysaker（Oslo）、日本 Tokyo
              和印度 Bengaluru 设有区域办公室。
