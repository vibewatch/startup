      - number: '1.5'
        title: 里程碑与负面事件
        blocks:
          - type: paragraph
            body: >
              Cognite 近十年轨迹可分为三个阶段：创立 / 孵化阶段（2016/2017–2020），公司在 Aker 体系内打造平台，以 Aker BP 为锚定客户；规模化 / 独角兽阶段（2021–2023），TCV
              投资、Microsoft 合作和国际客户扩张推动快速增长；美国优先的 AI 阶段（2024–2026），特征是 Atlas AI 发布、CEO 主导美国化转向，以及 Flows 平台扩展。


              迄今最重要的治理事件，是 2022 年联合创始人 John Markus Lervik 退位，由 Girish Rishi 接任 CEO。公开传播中虽以正面方式表述， 但创始人向职业 CEO
              交接本身带来执行风险和潜在文化震荡。本轮研究审阅的公开资料中，未发现负面事件、监管行动或重大诉讼记录。 UpGuard 针对 Cognite 的供应商风险报告截至 2026 年 5
              月仍处于活跃状态，监控网站、电子邮件、网络和品牌等维度的安全态势； 详细评级位于付费墙后，但报告存在以及“开始免费试用以获得完整访问权限”的门槛，说明有独立第三方安全审查，企业客户和投资者应复核。 Cognite
              为能源公司运行关键基础设施软件，安全态势因此是重大尽调事项。审阅资料中未发现公开事故、数据泄露或重大宕机；但没有证据不等于不存在， StatusGator 仍维护 Cognite
              服务可用性的活跃监控页面。CNBC Disruptor 50 榜单错误地将 Girish Rishi 称为“创始人”—— 他是在 2022 年加入担任
              CEO；这一事实错误出现在一个本报告依赖的来源中，需作为尽调卫生问题记录。
