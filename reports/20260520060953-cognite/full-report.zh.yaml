      - number: '2.5'
        title: 尽调缺口与矛盾估计
        blocks:
          - type: paragraph
            body: >
              本章最重要的分析缺口，是缺少一份公开、独立、无付费墙的工业 DataOps 平台子细分估计。IDC 2026 MarketScape（付费墙）、Verdantix 两份 2025 年领导力报告（付费墙）以及
              Gartner 相关 Market Guide（研究时被阻挡 / 无法访问）都确认该类别存在且 Cognite 是领导者，但没有任何来源给出可提取的市场规模数字。尽调买方在接受管理层隐含市场叙事前，应购买完整
              IDC 和 Verdantix 报告。


              现有两组公开估计——GVR（2024 年 $483B，CAGR 23.3%）和 Precedence Research（2025 年 $514B，CAGR
              16.8%）——方法不一致，无法合并成一个权威数字。两者都针对宽泛 IIoT 市场，而非特定工业
              DataOps；两者也都承认，随着不同出版物对软件和硬件组件计数不同，市场边界仍在演化。这里保留而不调和这一矛盾；除非做大幅调整，否则不应把任何一个估计当作 Cognite SAM 的代理。


              Cognite 提出的 Moonshot 目标（到 2035 年为客户累计创造 $100B 价值）是愿景，不是市场规模估计——它反映管理层内部信心，但无法映射到可验证 TAM。工业 DataOps
              在石油与天然气这一主导垂直中的市场渗透率，公开资料无法量化：全球约有 50+ 家大型油气运营商具备成为 Cognite 客户的规模，但目前有多少使用任何工业 DataOps 平台，公开来源未知。
