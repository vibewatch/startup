      - number: '4.6'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              收入质量是 Cognite 财务图景中最清晰的正面因素。FY2025 ARR bookings 增长 36%、新客户 NRR 150%、Q1 2026 ARR 增长加速至同比
              57%，三者合起来构成很有吸引力的复利曲线。Atlas AI 平台的 land-and-expand 动作也有支撑：到 Q1 2026，Atlas AI 覆盖 72% 客户 ARR，并驱动 >70% 新
              bookings，说明装机基础内的扩张经济性有持续性。Forrester Total Economic Impact 研究（Q1 2026）引用 Cognite 客户 465%
              ROI，虽由供应商推动，但为溢价定价防守提供了第三方框架。


              资本充足性看起来合理，但尚未确认。若按估计集团烧钱速度 $60–90M/year 计算，June 2024 约 $300M 融资自交割起可支撑 3–5 年现金跑道，对应 mid-2027 至 mid-2029
              的跑道窗口。但这只是估计；实际烧钱速度、账上现金和任何债务融资额度均未披露。Aker ASA 这个控股股东后盾（NOK 100B+ NAV）降低了生存性融资风险。


              主要财务阻断项包括：（1）$1.6B 估值停留在 2021 年，任何新投资都必须在不了解当前估值的情况下谈判；（2）缺少毛利率披露，无法承销平台业务经济性；（3）Saudi Aramco
              同时是客户和投资人，形成利益冲突结构，可能影响产品路线图、数据访问条款和最终退出选择；（4）私营公司不披露绝对 ARR 和客户数，使收入质量无法与可比 SaaS 基准交叉验证；（5）公司未披露 IPO、SPAC
              或二级流动性路径，因此最可能的退出场景仍是 Aker、Saudi Aramco 或大型科技公司进行战略收购。
            claimRefs:
              - CI033
