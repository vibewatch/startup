      - number: '8.4'
        title: 情景分析——乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              三个情景均用未来十二个月（NTM）收入乘以适配情景的 EV/NTM Revenue 倍数建模。NTM 收入基数估计为 $200–220M，来自 >$170M FY2025 数据，并保守延续当前 36–57%
              ARR 增长轨迹，同时假设 NTM 增长均值回归至 30–40%。毛利率未公开披露，各情景均沿用工业 SaaS 基准区间 60–75%；该输入一旦变化，投资逻辑会发生实质偏移。


              悲观情景（$1.0–1.4B）：倍数压缩至 5–7x NTM Revenue，理由包括：(a) 油气市场持续下行，削弱 Aramco 和 bp 扩张；(b) Atlas AI
              无法在既有装机基础之外商业化（渗透率跌破 ARR 的 50%）；(c) ARR 增长放缓至 20% YoY 以下；或 (d) 工业 AI 倍数跟随 C3.ai 式轨迹整体压缩。按 5–7x × $200M NTM
              收入，Cognite 隐含企业价值为 $1.0–1.4B，低于 2021 $1.6B 标记；对以 2021 价格或更高价格进入的投资者而言，这是下轮情景。


              基准情景（$1.6–2.6B）：对 $200–220M NTM 收入应用 8–12x NTM Revenue 倍数区间。该情景假设：ARR 继续以 30–40% 增长；Atlas AI 渗透率保持在 ARR 的
              60% 以上；混合毛利率为 65–70%；Aramco 或 bp 不发生重大客户集中度事件。$1.6B 底部对应当前规模下的 2021 估值标记（「无溢价」退出），而 $2.6B 需要通过毛利率和留存披露验证
              12x 倍数。


              乐观情景（$3.0–4.4B）：对 $210–220M NTM 收入应用 14–20x NTM Revenue 溢价倍数。该情景要求：(a) Atlas AI 建立可持续平台护城河，全客户基数 NRR 持续高于
              130%；(b) 非 O&G 垂直扩张成功，在 24 个月内把 40% 非 O&G 收入占比推至 55%+；(c) 订阅收入占比改善，毛利率扩张至 70% 以上；以及 (d) IPO 或战略 M&A 按 AI
              平台可比公司而非工业软件可比公司定价。没有美国政府合同等价物，Palantir 倍数不能作为上限。


              Rule of 40 分数无法用公开数据计算。在 36–57% ARR 增长和估计 -20 至 -30% FCF 利润率（来自挪威实体 FY2024 ~$52M 净亏损和假设的集团层面 $60–90M
              烧钱）下，估计 Rule of 40 分数大致横跨 6–37。这一区间很宽，符合这样一家公司的状态：增长已获确认，但盈利轨迹未知。这个不确定性是核心估值阻碍。
