      - number: '7.3'
        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >
              Cognite 平台建立在横跨 AWS、Microsoft Azure 和 Google Cloud Platform 的多云基础设施上。这种架构降低了单一云中断暴露，但也让公司同时依赖三大云厂商。May 7,
              2026 AWS 中断影响 150 多项云服务，说明超大规模云基础设施退化时，SaaS 平台会承受系统性风险；Cognite 的具体 SLA 承诺和冗余故障切换程序未公开记录。


              Cognite 持有 ISO 27001:2022、SOC 2 Type II、ISO 27018 和 ISO 9001 认证，均在其 Trust Center 公开引用。平台还支持能源行业客户使用 NERC
              CIP v.5 和 IEC 62443 工业网络安全标准。UpGuard 持续监控 Cognite 外部安全态势；完整风险评级报告在付费墙后，本研究周期无法做独立第三方验证。没有任何公开披露的安全 breach
              值得注意，但不能把它当作非公开事件记录干净的确认。


              工业 OT 数据带来独特攻击面：Cognite 摄取来自 SCADA 系统、DCS 平台和 historian 数据库的数据，这些数据包含运营设施的实时工艺状态。若 breach
              影响实时工业过程数据，后果会超出典型企业软件事件，触及安全关键层面。Cognite 的 IEC 62443 认证部分缓解了这一暴露，但客户侧集成层不在 Cognite 直接控制范围内，残余风险仍在。


              企业级 CDF 部署通常需要 6–18 个月实施工作，拉长了集成风险窗口；这期间数据管道只经过部分验证。实施失败——数据模型不匹配、historian 连接器失败，或 CDF 在负载下性能退化——在工业
              DataOps 平台的行业媒体报道中被作为延迟价值实现最常见原因反复提及。
