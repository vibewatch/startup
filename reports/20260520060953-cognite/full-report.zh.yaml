      - number: '8.6'
        title: 附录图表
        blocks:
          - type: callout
            title: 估值不透明是核心投资定价障碍
            body: >-
              2021 $1.6B 估值标记已经过时约五年，当时收入规模大约只有 Cognite 当前的一半。没有 June 2024 投后估值、毛利率披露和绝对 ARR，就无法有信心地为投资价格定价。任何高于 $2B
              的入场价，都需要主动对照可比公司验证；而 Cognite 尚未披露支持这项验证的数据。这不是定性担忧，而是结构性财务透明度缺口，会阻止风险调整后回报建模。
            calloutType: risk
            claimRefs:
              - CV001
              - CV005
              - CV016
              - CV042
          - type: callout
            title: Atlas AI 渗透率是单一最佳领先指标
            body: >-
              到 Q1 2026，Atlas AI 渗透 72% 客户 ARR，而其 June 2024 发布时渗透率为零；这是平台黏性和增购耐久性的最重要早期指标。如果该指标在全客户基数上维持在 ARR 的 65%
              以上——包括较早的 O&G 部署——就会大幅降低基准情景倍数假设的风险。投资者应按季度跟踪这一数字，并把任何跌破 55% 的反转视为早期投资逻辑击穿信号。
            calloutType: insight
            claimRefs:
              - CV010
              - CV011
              - CV033
          - type: callout
            title: C3.ai 倍数压缩是警示先例
            body: >-
              C3.ai 的公开市场轨迹——EV/NTM Revenue 倍数在 2020 年末高于 30x，至 FY2025 降至 8–12x——说明当增长不及预期时，工业 AI 平台估值会多快压缩。C3.ai 在
              $310M 收入下 FY2025 仍持续净亏损（$214M），表明规模本身不能解决这一类别的盈利问题。Cognite 增长更快是积极差异点，但倍数压缩风险真实存在，应被计入价格。
            calloutType: risk
            claimRefs:
              - CV017
              - CV022
              - CV043
          - type: callout
            title: 鉴于透明度缺口，入场价格纪律至关重要
            body: >-
              由于缺少毛利率、绝对 ARR 和当前估值披露，投资者应要求相对基准情景中点（$2.1B）有实质折价，以补偿信息不对称。以等于或低于 2021 $1.6B 标记（8x NTM
              Revenue）的价格入场，在悲观情景中提供真实下行保护，在基准情景中也有温和上行。高于 $2.5B 的入场，应以披露毛利率 ≥65% 和全客户基数 NRR ≥120% 作为明确交割条件。
            calloutType: recommendation
            claimRefs:
              - CV025
              - CV030
              - CV032
              - CV042
