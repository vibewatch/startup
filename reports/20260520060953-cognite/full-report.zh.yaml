  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >
              Cognite 运行软件即服务（SaaS）订阅模式，由两大核心平台支撑：Cognite Data Fusion（CDF）是工业 DataOps 引擎；Cognite Atlas AI 是 2024 年 6
              月推出的低代码工业智能体工作台。两者都以多年期订阅协议销售给企业级工业运营商，之上叠加专业服务和 Cognite Success Tracks。第三层平台 Cognite Flows 于 2026 年 5
              月推出，把平台行动层延伸到一线员工，预计会随时间深化按席位或按工作流的变现。


              截至 2026 年 5 月研究日期，Cognite 未公布任何产品标价。按这一规模下工业 DataOps 和 AI
              平台的行业惯例，企业账户总合同价值（TCV）通常为每年数十万美元到数百万美元不等，由数据量、连接资产数量、席位数和专业服务范围驱动。TotalEnergies 为在全球全部上游资产部署 CDF 达成的 3
              年合作，符合数百万美元级年合同价值（ACV）的特征；但没有披露具体金额。同样，B. Braun 合作和 Celanese 部署（通过 NVIDIA NV-Tesseract）暗示中大型企业
              ACV，但具体条款未公开。


              收入结构：FY2025 约 60% 收入来自石油与天然气客户，约 40% 来自石油与天然气以外（制造、化工、制药、可再生能源、公用事业）。Atlas AI 产品占 2025 年新预订超过
              70%，说明平台正在深化：现有 CDF 客户叠加 Atlas AI 订阅，推动 NRR 超过 100%。公司“Moonshot”使命——到 2035 年交付 $100B
              可衡量客户价值——是一个公开表述的北极星，既塑造其 GTM 叙事，也支撑其溢价定价姿态。


              向 Brønnøysundregistrene 提交的挪威法定年度账目（Cognite AS, org. 918274758）记录 FY2024 收入约 NOK 1.67B（按 2024 年平均 NOK/USD
              汇率约 10.55，约为 $158M USD）。这只代表挪威法人实体；纳入美国、日本和印度子公司的合并集团收入会不同。该数字与报告的 FY2025 全球收入 >$170M 一致，并为 FY2024
              提供了一个收入下限。
