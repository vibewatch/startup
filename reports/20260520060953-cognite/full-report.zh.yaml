      - number: '2.2'
        title: 市场规模：多重视角
        blocks:
          - type: paragraph
            body: >
              公开可获取的分析师报告中，没有一份按 Cognite 定义直接界定“工业 DataOps 平台”或“面向资产密集型行业的工业 AI 平台”的 TAM。IDC MarketScape Worldwide
              Industrial DataOps Platforms 2026（Doc #US53013025）是最权威参考，但报告被付费墙挡住，只能通过 Cognite 自己的新闻稿看到节选。更宽 IIoT
              市场有两个独立来源可作为规模锚点，但预测差异很大。


              Grand View Research（GVR）估计，全球 IIoT 市场 2024 年为 $483.16B，到 2030 年将达到 $1,693.44B，2025–2030 年 CAGR 为
              23.3%。Precedence Research 估计同一市场 2025 年为 $514.39B，到 2035 年将达到 $2,430.21B，2026–2035 年 CAGR 为 16.8%。两组估计在
              2024/2025 基数（$483B vs $514B）和 CAGR（23.3% vs 16.8%）上均冲突，反映市场边界定义不同——GVR 可能纳入了更多工业硬件 / 连接收入，而 Precedence
              可能对软件 / 服务权重不同。两份报告都没有给工业 DataOps 平台提供专门子细分。


              自下而上的规模视角，结合 Cognite 披露指标，指向一个更受约束的可服务市场：Cognite 收入 $170M，可能已经是全球第二或第三大纯软件工业 DataOps 厂商（位于 AVEVA/OSIsoft
              之后，后者现为 Schneider Electric 的企业级资产），这意味着纯软件工业 DataOps 年合同价值市场也许只有 $500M–$2B——比 IIoT TAM 小几个数量级。C3.ai SEC
              10-K 文件（2025 财年，2025 年 7 月提交）显示 C3.ai 收入约 $252M，为企业工业 AI 规模提供了一个公开类比，并确认该市场真实存在，但收入集中度还没有达到数十亿美元。制造业是最大的
              IIoT 终端使用细分（据 Precedence Research，2025 年约 28.7%），超过单独的石油与天然气；Cognite 正积极跳出 O&G 基本盘，这一点相关。
