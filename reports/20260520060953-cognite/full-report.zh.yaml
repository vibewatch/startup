        - 披露混合回本周期，并按新增 ARR 与扩张 ARR 拆分
      - - 月度烧钱速度 / 经营现金流
        - 空值 – 未披露；Cognite AS FY2024 净亏损约 $52M USD（NOK 实体）
        - 低（部分代理）
        - 测算现金跑道和资本充足性
        - 提供集团合并经营现金流和月末现金余额
