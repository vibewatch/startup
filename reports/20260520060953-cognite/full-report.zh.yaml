  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Cognite 的主战场是工业 DataOps 与工业 AI 平台细分市场：这类软件平台面向资产密集型行业，将运营技术（OT）与信息技术（IT）数据接入、上下文化并投入运营，以支撑 AI
              驱动的工作流自动化和决策支持。该细分属于更宽的工业物联网（IIoT）伞形市场，但边界明显更窄：不包括商品化传感器硬件、通用云存储、SCADA/DCS
              控制系统和企业资源计划软件。现状替代方案包括传统历史数据库（尤其是 OSIsoft PI，现为 AVEVA/Schneider Electric 的一部分）、点状分析工具、工业自动化套件内捆绑的 OEM
              分析能力（Siemens、GE Vernova、Honeywell、AspenTech），以及基于电子表格的工程工作流。该类别也不同于通用企业 AI 平台（Palantir AIP、C3.ai）：其主要焦点是
              OT/IT 融合、实时传感器数据和工业知识图谱，而不是业务流程 AI。


              Cognite 服务三类主要终端市场垂直：石油与天然气（根据“40% 非 O&G”披露反推，约占 FY2025 收入 60%）、流程制造 / 化工 /
              制药，以及电力与可再生能源。这些垂直共同具备资本密集、多站点运营、异构旧数据基础设施，以及通过运营优化获取经济和安全收益的强激励。Cognite
              正积极利用的相邻机会包括超大规模云厂商数据平台市场（Databricks、Snowflake）和智能体 AI 工具（Microsoft Copilot Studio、AWS
              Bedrock）；两者既有竞争性，也有互补性。IOGP（International Association of Oil and Gas Producers）是全球组织运营商标准和数字化转型计划的主要行业机构。


              “Industrial DataOps”一词在 2020 年后被广泛采用，并在 2026 年初由 IDC 首次发布 MarketScape
              评估时，被验证为独立分析师类别。在此之前，相关软件类别曾被称为“工业分析”“运营智能”或“IIoT 平台”，使历史规模比较在方法上不可靠。Cognite 同时面对专业纯软件厂商（Seeq、Aspentech
              Inmation/Mtell）和超大规模云原生服务（AWS IoT SiteWise、Azure Digital Twins、Google Cloud Manufacturing Data
              Engine）的竞争；后者以云定价提供商品化数据汇聚。
