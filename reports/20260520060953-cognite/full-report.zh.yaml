      - number: '5.4'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              Cognite 的安全计划面向那些安全事件不止造成数据丢失，还会导致停产、环境事故和安全事件的行业。作为正式 Secure Development
              Lifecycle（SDL）的一部分，平台在基础设施、应用和运营层面接受测试和第三方审计。公司把安全描述为「产品的功能性要求，而不是周边围栏」。

              截至 May 2026，Cognite 持有以下认证和鉴证：ISO 27001（信息安全管理）、ISO 9001（质量管理）、ISO 27018（云端个人数据隐私）、SOC 2 Type 2（Security
              criterion）和 SOC 3（公开摘要安全报告）。CDF 还支持客户满足一组工业控制和关键基础设施标准：NIST CSF、IEC 62443（子标准 2-4、3-2、3-3 和
              4-1）、CMMC、FIPs、NERC CIP v.5、GxP 和 CSA STAR Level 1。公司声明符合 EU AI Act，全球可用集群也支持受监管部署的数据主权。

              trust.cognite.com 的 Trust Center 持续、实时展示安全态势、系统健康和合规文档。潜在客户可以获取 SOC 2 Type 2 和 SOC 3 审计报告。UpGuard
              使用开源和自研威胁情报源，持续监控 Cognite 外部可见安全态势，评估网站安全、邮件安全、钓鱼和恶意软件、品牌声誉以及网络安全；不过截至 May 2026，UpGuard
              尚未公开具体数字评分，也未指出重大漏洞。statusgator.com 服务监控 Cognite 平台中断状态，包括在中断公开前进行检测。研究期内未发现影响客户运营的重大公开记录中断。

              尽调缺口仍在：SOC 2 Type 2 完整报告只在 NDA 下分享，并未公开发布；IEC 62443 合规被表述为可支持客户合规，但未发现独立第三方 IEC 62443 审计证书；高风险工业自主用例的 EU
              AI Act 分类可能需要额外文档；CMMC 认证等级未披露。
