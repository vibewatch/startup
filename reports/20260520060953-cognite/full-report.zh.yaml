  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与建议
        blocks:
          - type: paragraph
            body: >
              Cognite 处在两条长期趋势的交汇处——工业资产数字化和企业 AI 智能体采用——并拥有差异化的工业知识图谱，单个竞争对手很难端到端复刻。投资逻辑建立在四个支柱上：(1) 先落地再扩张模型已经被验证，较新客户
              NRR 达 150%，Atlas AI 到 Q1 2026 覆盖 72% 客户 ARR；(2) 平台架构具备真实切换成本，来自多年数据语境化和嵌入式 AI 工作流依赖；(3) ARR 预订增长从 FY2025 的
              36% 加速到 Q1 2026 的 57%，说明 Atlas AI 增购周期正在跑通；(4) 客户基础是蓝筹级，包括 Saudi Aramco、bp、TotalEnergies、Aker BP 和 B.
              Braun，其中数家是多年期锚定客户。


              反向逻辑主要来自估值不透明和财务透明度缺口。最近一次确认估值为 $1.6 billion，定于 May 2021——当时 Atlas AI 尚不存在，June 2024 的 ~$300M
              轮尚未发生，收入规模也只有当前的大约一半。投资者若不知道 2024 轮投后估值、毛利率结构（估计为 60–75%，但未披露）、绝对 ARR（增长率标题的分母），以及「较新客户」队列之外的全客户基数
              NRR，就无法给持仓定价。Saudi Aramco 的 7.4% 股权和 Aker ASA 的多数持股带来退出悬置和潜在战略冲突风险；没有治理披露，很难定价。C3.ai 的公开市场轨迹——EV/Revenue
              倍数从 2021 的 30x+ 压缩到 2025 的 8–12x——为工业 AI SaaS 类别提供了警示样本。


              建议：观察。Cognite 在产品、客户验证和增长轨迹上获得强定性评分，但在毛利率、绝对 ARR、全客户基数 NRR、2024 轮估值和客户集中度数据披露前，无法落到具体入场价格。若入场价等于或低于 2021
              $1.6B 标记，下行保护中等；若达到 2021 标记的 2–3×（与基准到乐观情景区间一致），在没有确认毛利率可持续性之前，风险 / 回报不够有利。
