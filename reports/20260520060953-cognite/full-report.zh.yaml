      - number: '5.2'
        title: 客户工作流与用例
        blocks:
          - type: paragraph
            body: >
              Cognite 平台面向重资产行业——油气、能源、制造、制药和化工——这些行业的运营数据量大、形态复杂，且长期分散在孤岛中。平台的核心价值主张，是把原始传感器、设备和工程数据转成 AI-ready
              知识，让一线员工、工艺工程师和数字化团队可以实时行动。

              油气是 Cognite 最成熟的垂直领域。客户用 CDF 消除寻找运营数据的时间。Cognite 油气产品页称，凭借独特的 IT/OT/ET 上下文化，理解数据所需时间减少
              90%，解决方案部署到实时生产的速度提升 10–25x，总体产量吞吐提升 0.5–1.5%。TotalEnergies 于 September 2024 扩大 Cognite 部署，覆盖全球所有上游资产，并称
              AI-ready 数据改善了运营卓越性。Cognite 委托 Forrester 开展的 Total Economic Impact 研究引用了 465% ROI 和 USD 29.4 million 总收益。

              制造领域，B. Braun（医疗技术）使用 Cognite Flows，在部署四周内实现所有站点资产健康的统一、实时可视化。Idemitsu Kosan（日本能源 / 化工）部署
              Flows，把沉淀的专家知识数字化，并降低运营风险。一家全球前十制药公司用 Flows 把价值兑现速度提升到传统方法的 30x：过去需要 20+ 人团队、3–5 个月完成的工作，四天内交付，用户验收测试从 6–9
              个月压缩到两个月。

              化工领域，Celanese（Texas 特种化学品）与 Cognite 和 NVIDIA 合作，部署与 CDF 知识图谱集成的 NV-Tesseract NIM
              时间序列预测，目标是消除反应水位监测中的预测偏差跳变。NVIDIA 合作于 March 16, 2026 公布，通过 Cognite 平台把基础时间序列 AI 落地到重工业。
