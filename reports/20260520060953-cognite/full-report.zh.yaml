  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁来源
      - 严重性
      - 支撑证据
      - 缓释措施 / 尽调追问
    rows:
      - - 工业知识图谱的独特性：没有竞品能在统一语义层中复刻情境化资产模型 + 时间序列 + 3D 数据融合
        - AspenTech PI AF、Azure Digital Twins、Palantir Foundry 都提供部分图谱 / 本体重叠能力；在 Databricks lakehouse 上自建正成为替代方案
        - 中 – 图谱架构尚未被规模化复刻，但构件正商品化
        - AVEVA PI System 聚焦基于 tag 的历史数据库，不是语义图谱；Azure DT 偏建模而非运营；Cognite moonshot 公告称已将 80T+ 数据点置于上下文中（自研）
        - 通过 2–3 次客户访谈验证实际切换成本；评估 CDF 的图谱 schema 是否易于迁移，还是会形成真正锁定
      - - Microsoft 战略合作与联合销售分发：三次获评 Microsoft Energy & Resources Partner of the Year，把联合销售管线接入 Microsoft 全球企业客户
        - Microsoft 可能在 Azure 内自建工业 AI 能力，或偏向另一家 ISV；Azure Digital Twins 是同一合作伙伴生态内的直接竞品线
        - 中 – Microsoft 联合销售真实存在，但并非独家；Microsoft 仍在投资 Azure 工业能力
        - Cognite 确认获得 2024 Microsoft Partner of the Year（Cognite 新闻稿）；TotalEnergies 与 bp 部署涉及 Azure 基础设施
        - 评估 Microsoft 联合销售安排的排他性；核实管线贡献；关注 Azure Industrial Metaverse 投资
      - - 大规模 CDF 部署带来的数据引力：>80 万亿个已置于上下文的数据点，一旦知识图谱填充完成，迁移成本很高
        - AVEVA PI 存在迁移路径；云超大规模厂商提升数据可迁移性；Open Industrial Data（Cognite OSIsoft 数据集）为公开数据
        - 低–中 – 数据引力真实存在，但开放标准降低了绝对锁定效应
        - Cognite FY2025 业绩称数据建模实例增长 48%，知识图谱深度翻倍；TotalEnergies 多年部署覆盖 39 项资产
        - 核实 CDF 数据模型是否可通过开放标准导出；评估开放 PI 数据计划是否削弱 CDF 的图谱优势
      - - 借助 Atlas AI 的 AI 智能体差异化：低代码智能体工作台于 2024 年 6 月推出，Atlas 客户同比增长 700%
        - 横向 AI 平台（C3.ai、Palantir）正在加入低代码能力；Microsoft Copilot 面向工业场景；开源 LLM 工具降低智能体开发成本
        - 中 – 先发优势存在；2025 年订单中 70%+ 包含 Atlas AI；但 AI 开发速度可能在 18–24 个月内缩小差距
        - Cognite FY2025 业绩：Atlas AI 被 59% ARR 基数使用；2025 年新增订单中 >70% 包含 Atlas AI；AI token 用量同比 +500%
        - 评估 Atlas AI 的工业专用预训练深度，而非通用 LLM 封装；评估非 Cognite 厂商能否在 12–18 个月内靠开源复刻
      - - 油气领域能力与锚定客户网络（Aker BP、Saudi Aramco、TotalEnergies、bp）在目标垂直行业形成密集参考案例
        - Cognite 40% 非油气收入组合显示多元化正在推进，但如果能源转型压低 AI 平台资本开支，油气集中度仍是风险
        - 中高 – 油气行业风险具有结构性；能源转型可能在 3–5 年期压低油气 IT 预算
        - Cognite FY2025 提到 40% 非油气收入；CNBC Disruptor 50 榜单强调油气起家的风险；GE Vernova / Siemens 在可再生能源中的竞争增强
        - 跟踪非油气 ARR 增长率；评估可再生能源 / 公用事业管线；核实 CDF 的价值主张能否顺畅迁移到传统油气之外
    notes: 严重性是基于证据的定性评估（低 / 中 / 高），依据截至 2026 年 5 月审阅的来源。这不是量化风险分数。「支撑证据」引用已审阅的具体来源；没有可用的独立第三方护城河耐久度基准。
    claimRefs:
