      - number: '5.3'
        title: 架构与集成模型
        blocks:
          - type: paragraph
            body: >
              CDF 的核心架构创新是工业知识图谱——一个统一语义模型，把时间序列数据、事件、文档、视觉数据流、3D 模型和工程图纸连接进同一套上下文结构。截至 2025 财年，该图谱在上下文中存储超过 80 trillion
              个时间序列数据点，同比增长 48%。同期，客户的数据建模实例翻倍，AI token 使用量增长近 500%，说明图谱之上的 AI 采用正在快速推进。

              Cognite 的开发者界面刻意采用 API-first。REST API 使用版本化端点，并发布向后兼容政策和弃用 API 版本的生命周期计划。Python SDK（v8，当前主版本）通过新的
              AsyncCogniteClient 引入完整 async 支持，为所有 API 操作提供非阻塞并发操作和原生 async/await 模式。该 SDK 与 pandas 深度集成。公司也提供
              JavaScript SDK。Cognite 还发布 MCP（Model Context Protocol）server 集成，允许开发者把开发环境和 AI 编码工具直接连接到 Cognite 文档和
              API。Python SDK 通过 PyPI 以 `cognite-sdk` 包分发。

              基础设施层面，CDF 云无关：它可部署在 AWS、Azure 和 Google Cloud Platform，并通过全球分布式集群满足数据主权和延迟要求。身份和访问管理依赖 OIDC，支持 Microsoft
              Entra ID、Okta 等身份提供商。Cognite 也把 CDF 白标给其他软件提供商。

              集成深度很广：Cognite 已宣布与 Snowflake（Energy Solutions 合作，January 2026）、Databricks（面向工业运营的企业 AI）、Microsoft Azure
              OpenAI Service 以及 NVIDIA NIM microservices 集成。客户通过 CDF 的 IT/OT 摄取连接器连接源系统——SCADA、DCS、ERP、OSIsoft PI
              等。Flows 架构建立在 CDF 知识图谱之上，而不是另加一层数据层，确保洞察和新应用始终扎根在实时运营上下文中。
