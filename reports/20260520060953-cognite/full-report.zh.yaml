      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              Cognite 客户群高度偏向大型工业企业——这些公司拥有显著的多站点 OT 基础设施、超过 $1B
              的资本预算，并已在工业自动化上投入。典型买方是综合油气巨头、大型化工或流程制造企业，或国家能源公司。Cognite 具名客户包括 bp、Saudi Aramco、TotalEnergies、Aker
              BP、Cosmo Energy、TotalEnergies、NOVA Chemicals、B. Braun 和 Idemitsu Kosan；它们都是运营环境复杂、多站点的大企业，在这些场景里，数据上下文化和
              AI 的经济性最强。


              工业 DataOps 预算归属位于 IT 与运营的交汇处：首席数字官（CDO）、数字副总裁或工程副总裁通常推动投资，采购 / 财务则控制多年期 SaaS 协议机制。这意味着 Cognite
              既要争夺可自由支配的“数字化转型”预算，也要争夺核心运营 IT 支出。采用触发因素通常是三类：（1）高管层基于运营效率目标下达数字化转型要求；（2）新大型资本项目需要现代数据基础设施；（3）ESG
              披露要求带来压力，要求提升运营可视性。


              落地后扩张是 Cognite 商业模式的核心：NOVA Chemicals 先在一座工厂部署 CDF，再计划年内扩展到 11 座工厂；TotalEnergies 用三年覆盖 39 个上游资产；Cosmo
              Energy 覆盖全部三家日本炼厂。这个模式意味着初始销售往往是范围有限的试点（一个站点、一个用例），多数收入增长来自扩张。Cognite 新客户 150% NRR
              在商业上验证了该模式。用户画像包括数据科学家、流程 / 工厂工程师、IT/OT 集成架构师，以及——借助 Atlas
              AI——非技术一线员工。付款权通常位于企业级预算，而非单个工厂经理手中，因此企业采购周期很长（初始交易常为 12–24 个月），但多年期合同是常态。
