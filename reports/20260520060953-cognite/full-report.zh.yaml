      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >
              Cognite 相比竞争对手的关键差异化，来自工业知识图谱架构、Atlas AI 低代码智能体工作台和云原生开放 API 设计。工业知识图谱在统一语义层中上下文化资产、时间序列、文档和 3D
              模型之间的关系。没有既有历史数据库（AVEVA PI、AspenTech）或横向 AI 平台（C3.ai、Palantir）复制这一组合。AWS IoT SiteWise 和 Azure Digital
              Twins 解决基础设施层，但缺少 Cognite 面向特定领域的数据建模和预置工业上下文化。


              这一领域里，私营市场参与者的定价大多不透明。Cognite 采用 SaaS 订阅模式，包含按资产或按数据量计价的组件、实施服务和专业服务层，但具体标价未公开。AVEVA PI System
              通过永久许可加维护以及订阅模式销售；AspenTech 的 aspenONE 工程套件使用基于 token 的订阅模式。C3.ai 使用按应用的订阅模式；Palantir 项目是大规模定制合同，金额常在
              $10M+ 区间。AWS IoT SiteWise 和 Azure Digital Twins 使用云消费计价（按消息、按查询、按标签），小规模进入门槛更低，但企业规模下成本可能很高。


              Cognite 的 GTM 策略强调高管级企业销售、Microsoft 联合销售伙伴关系，以及与 Databricks、Snowflake 的战略集成，用于分析和数据湖互操作。相对既有厂商，它的关键分销护城河是
              Microsoft 伙伴生态：Cognite 连续三年至 2024 年获评 Microsoft 年度能源与资源合作伙伴，受益于 Microsoft 全球企业账户关系。这部分抵消了 AVEVA（处于
              Schneider Electric 更宽工业自动化组合内）和 AspenTech（处于 Emerson 流程自动化套件内）所拥有的 OEM / 捆绑渠道优势。
