      - number: '4.5'
        title: 公开牵引力与私有信息缺口
        blocks:
          - type: paragraph
            body: >
              Cognite 的公开财务披露方式符合一家主动管理投资人叙事的后期私营公司：它通过新闻稿和分析师验证释放部分 ARR 增长、NRR 和员工数指标，同时扣住毛利率、绝对 ARR、客户数、EBITDA
              和资产负债表数据。以下牵引力指标均为公司自报且为初步 / 未审计数据，Cognite 在 January 2026 公告中也明确说明了这一点。


              已确认公开指标（FY2025）：年收入 >$170M；ARR bookings 同比增长 36%；新客户 NRR 150%；全球员工 >800 人（同比 +21%）；40% 收入来自非油气客户；2025 年新
              bookings 中 >70% 包含 Atlas AI；按 ARR 计，59% 客户使用 Atlas AI。

              Q1 2026 加速信号：ARR bookings 同比 +57%；Atlas AI 按 ARR 渗透率 72%；知识图谱 85T+ 数据点（同比 +30%）；AI token 使用量同比 +900%；MAU
              同比 +54%。


              挪威法定数据（FY2024，Cognite AS 实体）：收入 NOK 1.67B（约 $158M USD）；净亏损 NOK -547M（约 -$52M USD）；总资产 NOK 2.26B（约 $214M
              USD）；挪威员工 367 人（注册处截至 May 2026）。这只覆盖全球集团的一部分。


              核心承销缺口包括：（1）毛利率和 EBITDA 走向盈利的路径；（2）绝对 ARR 基数（没有分母的增长率不足以承销）；（3）客户数和集中度（基于战略定位，Saudi Aramco + bp 很可能贡献 >30%
              收入——未确认）；（4）账上现金和现金跑道；（5）2024 轮估值及由此产生的稀释。这些缺口是 pre-IPO 私营公司的系统性问题，只有正式尽调数据室访问才能补上。
