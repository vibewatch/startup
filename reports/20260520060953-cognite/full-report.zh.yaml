  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: compact
    summary: 截至 2026 年 5 月，基于可得证据，对 Cognite 七个投资维度给出可提交 IC 的评分。分数反映证据质量，而非愿景式轨迹。
    data:
      items:
        - label: 市场机会
          value: High
          note: IIoT 可服务市场（SAM）$2–10B；AI 智能体采用浪潮加速；能源转型提供数十年顺风
        - label: 产品差异化
          value: High
          note: Industrial Knowledge Graph + Atlas AI：截至 2026 年 5 月没有全栈竞争对手；IDC MarketScape 领导者；Verdantix Green Quadrant 领导者
        - label: 收入增长质量
          value: Strong / Confirmed
          note: ARR 增长 36–57%；NRR 150%（较新队列）；Atlas AI 渗透率达 ARR 的 72%——均为公司披露
        - label: 财务透明度
          value: Low / Blocking
          note: 毛利率、绝对 ARR、客户数、2024 年融资轮估值均未披露；财务测算因此卡住
        - label: 竞争护城河
          value: Medium-High
          note: 多年数据语境化带来切换成本；但 AVEVA、Emerson/AspenTech 与超大规模云厂商掌握更深的渠道和预算关系
        - label: 退出 / 流动性路径
          value: Medium / Uncertain
          note: 多条路径可行（并购：Schneider、Emerson、Siemens；IPO）；Aker ASA 控股让时间线复杂化；CNBC Disruptor 50 提示公司在为流动性事件前定位
        - label: 估值与证据匹配度
          value: Unknown / Inconclusive
          note: 2021 年 $1.6B 标记已陈旧；基准情景 $1.6–2.6B 可支撑，但缺少毛利率 + ARR 无法确认；乐观情景需要披露验证
        - label: 治理与利益一致性
          value: Low / Risk
          note: Aker ASA 控股 + Aramco 7.4% 持股让退出动态复杂；公开董事会披露有限；Aramco 既是客户又是股东，存在冲突风险
    approximationNotes: 定性评分是本分析师截至 2026 年 5 月基于证据作出的评估。没有公开可得的独立量化基准覆盖所有维度。标记为「未知」或「低」的项目反映真实证据缺口，而不是负面判断。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV016
      - CV027
      - CV036
      - CV038
      - CV039
      - CV042
