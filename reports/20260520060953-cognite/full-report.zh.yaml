      - number: '7.4'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Aker ASA 是 Cognite 的多数股东，也是事实上的战略后盾。Aker 的 Q1 2026 净资产价值超过 NOK 110 billion，说明它仍有财力支持
              Cognite。但由工业集团控股也带来治理风险：战略方向、资本配置、退出决策都会受到 Aker 组合优先级的强影响，而这些优先级未必与纯企业软件增长策略一致。Aker
              自身财务状况、领导层或战略重点一旦变化，Cognite 获取资本的能力和战略独立性都可能受到实质影响。


              Saudi Aramco 在 February 2022 收购 Cognite 7.4% 股权。这带来与全球最大石油公司的高价值商业关系，也让 Cognite
              在阿拉伯半岛拥有锚定客户；但它同样引入潜在治理复杂性：Aramco 的战略优先级可能影响 Cognite 产品路线图，尤其是 O&G
              专用功能，从而拖慢向其他垂直行业多元化。与此同时，美国和欧盟制裁格局不断变化，Cognite 在沙特阿拉伯的业务也暴露在出口管制和地缘政治风险之下。


              Cognite 与 NVIDIA 围绕 NV-Tesseract 集成的合作，直接依赖 GPU 可用性和 NVIDIA 的 NIM 微服务路线图。在 2025–2026，GPU
              供应约束已被行业充分记录；NVIDIA 商业 API 可用性一旦中断，Atlas AI 的时间序列预测能力就会下降。Snowflake 和 Databricks
              合作关系带来双向数据流依赖，定价争议或竞争冲突都可能影响联合销售管线。Microsoft Azure 和 AWS 既是平台合作伙伴，也可能在扩展自身工业 AI 产品时成为横向竞争者。


              依赖图（FR003）把这些关键上游依赖及其向客户价值交付的传导路径可视化。
