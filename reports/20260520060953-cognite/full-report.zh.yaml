  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块图谱与定义
        blocks:
          - type: paragraph
            body: >
              Cognite 的商业平台由三层具名产品和一组内置应用组成，全部共用同一套工业知识图谱数据底座。Cognite Data Fusion（CDF）是核心工业 DataOps 平台：它从分散的 IT、OT
              和工程系统摄取、上下文化并存储数据——包括来自 SCADA 和 DCS 的时间序列、文档、事件、3D 模型和 P&ID——再通过版本化 REST API、Python SDK 和 JavaScript SDK
              对外提供。CDF 是栈里唯一可以独立运行的产品；Atlas AI 和 Flows 都需要 CDF 作为数据底座。

              Cognite Atlas AI 于 June 2024 推出，把 CDF 扩展成低代码工业智能体工作台。数字化团队和领域专家可以用预配置模板构建 AI agents，无需写代码。Agents 由 Context
              Augmented Generation（CAG）驱动，把 CDF 的图谱上下文注入 LLM 提示词；同时由 autoLLM 负责路由，为每个 agent 任务选择最合适的 Large Language
              Model、Small Language Model 或 Custom Language Model。截至 2025 财年，按 ARR 计 59% 客户已把 Atlas AI 投入运营，Atlas AI
              客户数同比增长近 700%。

              Cognite Flows 在 Cognite 的 IMPACT 大会上公布，并于 May 12, 2026 发布，是平台的行动层。它为一线操作员和工程师提供单屏、基于角色的自适应工作区，把 AI agents
              嵌入其中，并同时呈现所有企业应用的数据。Flows 也重新定义开发者体验：开发者借助 Claude 或 Cursor 等 AI 原生编码工具，可以在数天而非数月内构建生产级工业应用。Flows
              发布时，Cognite 超过 30% 客户基础已提前启用，50+ 客户正在活跃使用。Flows 打包的内置应用包括 Industrial Canvas（面向 P&ID
              和时间序列的可视工作区）、InField（移动现场访问）、Maintain（维护工单管理）和 Charts（时间序列分析）。
