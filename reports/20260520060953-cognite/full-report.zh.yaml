      - number: '8.5'
        title: 退出就绪度、最终尽调问题与否决触发点
        blocks:
          - type: paragraph
            body: >
              Cognite 在 2026–2028 最可能的退出路径是：(1) 被大型工业自动化或企业软件既有厂商战略收购，后者需要 AI 原生工业 DataOps 能力；或 (2)
              当公司达到盈利里程碑，或市场条件支持成长阶段工业 AI 上市时进行 IPO。May 2026 入选 CNBC Disruptor 50，与公司在潜在流动性事件前建立公众形象相一致。


              潜在战略收购方包括 Schneider Electric（收购 AVEVA，可作为 DataOps 先例）、Emerson Electric（收购 AspenTech）、Siemens、Honeywell 和
              ABB——它们都参与工业自动化竞争，也都有收购 Cognite 工业知识图谱和 Atlas AI 智能体工作台的战略理由。超大规模云厂商（鉴于 Energy and Resources Partner 关系的
              Microsoft，或 AWS）也可能成为战略买方。AVEVA（$9.5B）和 AspenTech（$11B）两项先例 M&A 交易，为 Cognite 当前规模下战略退出的相关企业价值区间提供上下沿。


              Aker ASA 的多数持股可能吓退收购方：战略买家若要取得控股权，需要 Aker ASA 同意；而 Aker ASA 可能更愿意保留与其更广泛能源投资逻辑一致的工业数据资产敞口。Saudi Aramco 的
              7.4% 股权又增加一个否决维度。尽调应揭示这些治理复杂性，并在任何投资逻辑依赖近期 M&A 退出前解决。


              投资前五个最关键的尽调问题：(1) 按收入流拆分毛利率（订阅 vs. 专业服务），否则无法进行 SaaS 基准比较；(2) 全客户基数 NRR 和总金额留存，以确认 150%「较新客户」NRR
              是否掩盖老队列流失；(3) 绝对 ARR 和按层级拆分的客户数，以验证集中度和 ACV 分布；(4) June 2024 投后估值和当前股权结构，包括优先股堆叠和清算优先权；(5) 账面现金和 12
              个月现金跑道，以评估下一次融资是否会稀释。
