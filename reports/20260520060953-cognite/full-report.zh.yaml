        - Siemens 收入 ~€77B；投资 Xcelerator 平台
        - 离散与流程制造；Siemens OT 客户
        - 边缘原生 OT/IT 集成；Siemens 硬件 + 软件捆绑；工厂自动化深度
        - 聚焦工厂 / OT；油气 / 流程知识图谱用例有限；生态锁定在 Siemens 硬件上
      - - GE Vernova / GE Digital
        - 能源设备与电网软件
        - GE Vernova 2024 年分拆；收入 ~$36B（聚焦电力设备）
        - 发电、电网、风电；历史 Predix 客户
        - 电力设备领域深度；电网优化软件；长期公用事业客户关系
        - GE Digital（Predix）已分离；分拆后工业 AI 平台投入有限
