      - number: '1.3'
        title: 融资、资本与投资者
        blocks:
          - type: paragraph
            body: >
              Cognite 最近一次公开确认的融资里程碑，是 2021 年 5 月来自成长股权机构 TCV 的 $150M 轮次，公司估值 $1.6B，并获得独角兽身份。TCV 的 Jake Reynolds
              作为这笔交易的一部分加入董事会。Cognite 2021 年新闻稿称， 当时公司增长迅速，拥有“超过 500 名员工”，并将该轮描述为“欧洲 SaaS 公司最大融资轮之一”。在 2021 年 TCV
              轮之前，Accel 已做过一笔更早期的成长股权投资（公开资料未披露金额）；2021 年新闻稿称，TCV 补充了“全球风险投资机构 Accel 早前提供的资金”。


              TCV 随后又领投了追加投资轮。TCV 新闻稿页面标题为“TCV Leads $300M Investment in Cognite”，而一个 2024 年 6 月 TechCrunch URL（现已返回
              404）提到“cognite-raises-300m”。CNBC 2026 年 5 月 Disruptor 50 榜单报告了“$300 million”融资，这可能单指 2024
              年轮次，也可能指已披露资本总额。由于 Cognite 是私营公司，2024 年轮后准确投后估值和完整资本历史均未公开。2021 年 5 月的 $1.6B 估值是最后一个公开确认数字。


              挪威亿万富豪 Kjell Inge Roekke 的投资载体 Aker ASA 是 Cognite 的大股东，也扮演公司母公司角色。 双方关系由独立运营的关联公司结构管理。2022 年 2 月，Saudi
              Aramco 从 Aker BP（不同于 Aker ASA 的实体）购买了 Cognite 7.4% 股份，使一个具有战略意义的工业客户成为股权持有人。Saudi Aramco 也是 Cognite
              最大客户之一， 这让财务利益与潜在产品路线图影响、客户准入影响发生对齐，值得持续尽调。董事会代表包括 Aker ASA 关联董事、 TCV 的 Jake Reynolds，以及可能存在的 Aramco
              代表（公开资料未确认）。
