company:
  name: Cognite

chapter:
  number: 7
  title: Risks
  summary: >-
    Cognite's most material risks span four axes: (1) sector concentration — oil and gas
    historically drove ~60% of revenue, leaving the company exposed to commodity-cycle capex
    cuts; (2) governance concentration — Aker ASA holds a majority stake and Saudi Aramco
    holds 7.4%, creating ownership dynamics that could conflict with independent growth
    strategies; (3) competitive displacement — AVEVA/Schneider, Palantir AIP, and
    hyperscaler industrial-AI suites all threaten to erode Cognite's differentiation; and
    (4) regulatory exposure — the EU AI Act, GDPR, and NIS2 impose material compliance
    obligations as Cognite's Atlas AI agents are deployed in safety-critical industrial
    environments. No public lawsuits or regulatory enforcement actions were found as of
    May 2026; the absence of disclosure is documented as an evidence gap, not confirmation
    of clean legal standing.

sections:
  - id: risk-overview
    title: Risk Overview
    body: |
      Cognite operates at the intersection of industrial operations, enterprise software, and
      generative AI — a combination that concentrates multiple risk dimensions simultaneously.
      As of May 2026, the company reports $170M+ in FY2025 ARR with 36% YoY growth, yet
      remains privately held with no audited public financials, creating a fundamental opacity
      around burn rate, gross margin, and capital runway.

      The risk heatmap (FR001) plots severity and likelihood for each primary risk category.
      The highest residual-severity risks are oil-and-gas sector concentration and competitive
      displacement by well-capitalised incumbents and hyperscalers. The risk transmission map
      (FR002) illustrates how upstream shocks — an oil price collapse, Aker governance
      change, or AWS outage — cascade to revenue, customer renewal, and ultimately to
      financing capacity and valuation. Three risks stand out as thesis-breaking: (a) loss
      of Aker BP or TotalEnergies as anchor customers without replacement revenue, (b) a
      material security incident affecting industrial control data, and (c) a sustained
      oil-price decline below ~$60/bbl that causes major O&G operators to defer or cancel
      digital transformation programmes.

      The chapter draws on regulatory text (GDPR, EU DSA, EU AI Act provisions), third-party
      security assessments, and trade-press risk coverage. Evidence is absent on undisclosed
      litigation, specific customer contract indemnification terms, and precise cash burn —
      each of these gaps is explicitly documented in the evidence-gap register.
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR033
    figureRefs:
      - FR001
      - FR002

  - id: regulatory-legal-risks
    title: Regulatory and Legal Risks
    body: |
      Cognite processes industrial operational data under GDPR as a data processor for its
      EU-based customers, including major operators in Norway, the Netherlands, Germany, and
      the UK. The Norwegian Data Protection Authority (Datatilsynet) is the lead supervisory
      authority for Cognite's Norwegian entity, which remains the legal base for much of its
      EU operations despite the 2025 global-HQ relocation to Tempe, Arizona.

      The EU AI Act (Regulation 2024/1689, effective August 2024) classifies AI systems used
      in critical infrastructure — including oil refineries, chemical plants, and energy grids —
      as high-risk systems, requiring conformity assessment, risk management documentation,
      and human oversight provisions before deployment. Cognite's Atlas AI agents, which make
      autonomous recommendations on production operations and maintenance scheduling, may fall
      into this category depending on the level of autonomy granted by operator customers. The
      specific applicability depends on customer configuration and the degree to which Atlas AI
      outputs are acted upon without human review. This is an active regulatory interpretation
      risk with no definitive precedent as of May 2026.

      NIS2 (Directive 2022/2555), effective October 2024, imposes cybersecurity obligations on
      operators of essential services and their critical technology suppliers. Cognite's role as
      an IT/OT integration layer for energy and critical manufacturing customers potentially
      triggers third-party ICT supplier obligations under Article 21, requiring customers to
      conduct security audits of their Cognite deployments and contractually bind Cognite to
      incident notification timelines.

      No publicly disclosed regulatory enforcement actions, lawsuits, or litigation involving
      Cognite were found in searches conducted through May 2026. The absence of disclosure
      does not confirm clean legal standing; private companies do not always disclose pending
      disputes. This constitutes a material evidence gap documented below.

      The regulatory/legal risk register (TR001) ranks each exposure by severity and maps
      it to a diligence action.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
    tableRefs:
      - TR001

  - id: operational-security-risks
    title: Operational and Security Risks
    body: |
      Cognite's platform is built on multi-cloud infrastructure spanning AWS, Microsoft Azure,
      and Google Cloud Platform. This architecture reduces single-cloud outage exposure but
      creates dependency on all three major cloud providers simultaneously. The May 7, 2026
      AWS outage that disrupted over 150 cloud services illustrates the systemic risk to
      SaaS platforms when hyperscaler infrastructure degrades; Cognite's specific SLA
      commitments and redundancy failover procedures are not publicly documented.

      Cognite holds ISO 27001:2022, SOC 2 Type II, ISO 27018, and ISO 9001 certifications,
      all publicly referenced on its Trust Center. The platform also supports NERC CIP v.5
      for energy-sector customers and IEC 62443 industrial cybersecurity standards. UpGuard
      continuously monitors Cognite's external security posture; the full risk rating report
      is behind a paywall, preventing independent third-party verification in this research
      cycle. The absence of any publicly disclosed security breach is noted but cannot be
      taken as confirmation of a clean record for non-public incidents.

      Industrial OT data presents a distinctive attack surface: Cognite ingests data from
      SCADA systems, DCS platforms, and historian databases that contain real-time process
      conditions of operating facilities. A breach affecting live industrial process data
      would carry safety-critical consequences beyond typical enterprise software incidents.
      Cognite's IEC 62443 certifications partially address this exposure, but residual risk
      remains in customer-side integration layers that are outside Cognite's direct control.

      Enterprise CDF deployments typically require 6–18 months of implementation work,
      creating extended periods of integration risk during which data pipelines are only
      partially validated. Implementation failures — data-model mismatches, historian
      connector failures, or CDF performance degradation under load — have been cited
      anecdotally in trade press coverage of industrial DataOps platforms as the most common
      cause of delayed value realisation.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
    tableRefs:
      - TR002

  - id: partner-dependency-risks
    title: Partner and Dependency Risks
    body: |
      Aker ASA is Cognite's majority shareholder and the de facto strategic backstop. Aker's
      Q1 2026 Net Asset Value exceeded NOK 110 billion, confirming continued financial capacity
      to support Cognite. However, majority ownership by an industrial conglomerate creates
      governance risks: strategic direction, capital allocation, and exit decisions are
      substantially influenced by Aker's portfolio priorities, which may diverge from pure
      enterprise-software growth strategies. A change in Aker's own financial position,
      leadership, or strategic priorities could materially affect Cognite's access to capital
      and strategic independence.

      Saudi Aramco acquired a 7.4% stake in Cognite in February 2022. This creates a
      valuable commercial relationship with the world's largest oil company and an anchor
      customer on the Arabian Peninsula, but also introduces potential governance complexity:
      Aramco's strategic priorities could influence Cognite's product roadmap, particularly
      for O&G-specific features, in ways that slow diversification into other verticals.
      Additionally, Cognite's operations in Saudi Arabia create export control and
      geopolitical risk exposure given evolving US and EU sanctions landscapes.

      Cognite's NVIDIA partnership for NV-Tesseract integration creates a direct technology
      dependency on GPU availability and NVIDIA's NIM microservice roadmap. In 2025–2026,
      GPU supply constraints have been well-documented across the industry; any interruption
      to NVIDIA's commercial API availability would degrade Atlas AI's time-series
      forecasting capability. The Snowflake and Databricks partnerships create bidirectional
      data flow dependencies where a pricing dispute or competitive conflict could affect
      the co-sell pipeline. Microsoft Azure and AWS are both platform partners and
      potential horizontal competitors as they expand their industrial AI offerings.

      The dependency map (FR003) visualises these critical upstream dependencies and their
      paths to customer value delivery.
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
    tableRefs:
      - TR003
    figureRefs:
