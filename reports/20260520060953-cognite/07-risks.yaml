callouts:
  - calloutType: risk
    title: Aker Concentration Is the Dominant Governance Risk
    body: >-
      Aker ASA's majority ownership is both Cognite's greatest strength and its most
      concentrated governance risk. Aker's deep industrial networks and Norwegian Continental
      Shelf relationships created Cognite's earliest reference customers. However, a change
      in Aker's leadership, strategic direction, or financial position would affect Cognite's
      capital access and potentially its independence. Investors should obtain board-level
      visibility on Aker's future ownership intentions as a diligence prerequisite.
    claimRefs:
      - CR016
      - CR042

  - calloutType: insight
    title: No Public Litigation Found — Evidence Gap, Not Clean Record
    body: >-
      Searches conducted through May 2026 found no publicly disclosed lawsuits, regulatory
      enforcement actions, or material legal proceedings involving Cognite in any jurisdiction.
      As a private company, Cognite has no disclosure obligation for undisclosed disputes.
      Diligence should include a formal litigation search across Norwegian, US, and EU court
      records, and a specific request to management regarding any pending or threatened
      claims exceeding a materiality threshold.
    claimRefs:
      - CR003

  - calloutType: recommendation
    title: EU AI Act Conformity Assessment Should Be a Pre-Condition for Industrial Deployments
    body: >-
      Cognite's Atlas AI agents — particularly those that provide autonomous recommendations
      on production scheduling, maintenance prioritisation, or safety system parameters —
      may be classified as high-risk AI systems under EU AI Act Annex III (critical
      infrastructure). Cognite and its customers should initiate conformity assessment and
      technical documentation processes now, before the August 2026 compliance deadline for
      new deployments. Diligence should confirm what Cognite's conformity roadmap looks like
      and who bears the regulatory responsibility — provider or deployer.
    claimRefs:
      - CR004
      - CR005

