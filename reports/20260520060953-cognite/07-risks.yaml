  - id: mitigations-monitoring-triggers
    title: Mitigations, Monitoring, and Thesis-Break Triggers
    body: |
      Several structural mitigations reduce the probability of the most severe risk scenarios.
      Cognite's 150% NRR for newer customers and 59% Atlas AI adoption by ARR demonstrate
      platform stickiness that makes unplanned churn less likely in the near term. ISO 27001,
      SOC 2 Type II, and IEC 62443 certifications provide institutional compliance scaffolding
      that addresses the most common procurement security barriers. The multi-cloud architecture
      (AWS/Azure/GCP) reduces single-provider outage risk. Aker ASA's NOK 110B NAV confirms
      balance-sheet depth sufficient to fund Cognite through extended growth phases.

      Quantitative monitoring indicators can provide early warning on key risks. Oil-price
      futures below $65/bbl for more than 90 days should trigger a re-examination of O&G
      customer renewal probability. A quarterly NRR print below 120% would signal account
      contraction preceding churn. Gartner Peer Insights scores declining more than 0.5 points
      over two quarters would flag a customer satisfaction deterioration. Executive departures
      (CTO, CPO, CFO) within 12 months of each other would trigger a people-risk escalation.

      Thesis-break triggers are events that would fundamentally challenge the investment
      thesis: loss of Aker BP or TotalEnergies as a customer without visible pipeline
      replacement, a material OT security breach attributed to the Cognite platform, an oil
      price sustained below $50/bbl for 12+ months, or discovery of undisclosed litigation
      with material financial exposure. A confirmed acquisition of Cognite by a large
      incumbent (AVEVA/Schneider, SAP, Microsoft) at below the 2021 $1.6B valuation mark
      would represent a negative carry outcome.

      The mitigation and kill-criteria table (TR005) maps each primary risk to its
      monitorable trigger and recommended action implication.
    claimRefs:
      - CR039
      - CR040
      - CR041
      - CR042
    tableRefs:
      - TR005

