callouts:
  - calloutType: strength
    title: Deep Named-Account Proof
    body: >
      Cognite has unusually detailed production evidence for a private industrial software company:
      ten named enterprise customers across five verticals, with specific outcome metrics published
      for at least three of them (Aker BP, Idemitsu, TotalEnergies), spanning multiple geographies.
      The depth of the Aker BP case study — a C-suite quote, two quantified outcomes, and independent
      Aker BP investor relations corroboration — sets a high bar for industrial AI proof points.
    claimRefs: [CU007, CU011, CU012, CU013, CU022, CU018]

  - calloutType: risk
    title: Aramco Ownership Creates Customer Conflict-of-Interest
    body: >
      Saudi Aramco's 74% majority stake in Cognite — acquired in 2022 and documented by Reuters —
      places competing integrated oil majors in a structurally awkward position: sharing operational
      intelligence with a platform majority-owned by a direct competitor. bp is a named Cognite
      customer, but no public statement from bp, TotalEnergies, or other major O&G customers addresses
      this conflict. The risk is material enough to warrant explicit diligence: prospective acquirers
      and investors should verify whether formal data governance, technical isolation, or contractual
      protections exist to ring-fence Aramco from customer data.
    claimRefs: [CU036, CU035]

  - calloutType: risk
    title: Limited Independent Review Evidence
    body: >
      Software review platforms (Gartner Peer Insights, PeerSpot, Slashdot, SourceForge) show no
      substantive user reviews for Cognite Data Fusion despite a claimed enterprise customer base
      spanning dozens of named accounts. This is consistent with a high-touch, direct-sales motion
      where buyers do not use consumer-style review platforms, but it also means there is no
      independent social proof of satisfaction or a corpus of user-generated commentary on
      limitations.
    claimRefs: [CU037]

  - calloutType: insight
    title: Atlas AI Adoption Is the Key Land-and-Expand Signal
    body: >
      With 59% of customers by ARR already using Atlas AI — and 700% customer growth for that product
      since launch — the AI agent layer has become the primary expansion vector. This matters because
      AI workloads have higher economic value and stickiness than baseline data integration, and the
      high adoption rate suggests the platform is not merely a data warehouse but an active operational
      decision-support tool.
    claimRefs: [CU006, CU009, CU032]

