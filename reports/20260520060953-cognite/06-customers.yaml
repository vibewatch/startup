company:
  name: Cognite

chapter:
  number: 6
  title: Customers

sections:
  - id: sec-segmentation
    title: Customer Base Overview and Segmentation
    body: >
      Cognite's industrial data and AI platform serves asset-intensive operators across energy, manufacturing,
      chemicals, pharmaceuticals, and metals and mining. As of FY2025 the company reported revenues exceeding
      $170M with 36% ARR bookings growth year-over-year, implying a customer base that spans multiple verticals
      and geographies. Management disclosed that approximately 40% of 2025 revenue derives from outside oil and
      gas — a meaningful diversification from the company's origins as a Norway-based O&G data platform.
      Named anchor accounts include integrated majors such as bp and Saudi Aramco, national oil companies such
      as Cosmo Energy, diversified energy companies such as TotalEnergies and Aker BP, chemicals producers
      (NOVA Chemicals, Celanese), a Japanese steel company (JFE Steel), a German medical device manufacturer
      (B. Braun), and a Japanese refiner (Idemitsu). The platform's go-to-market emphasizes enterprise digital
      transformation programs; most deployments cited involve dozens to hundreds of assets and thousands of users.
      Monthly active users grew 26% year-over-year, and 59% of customers by ARR are using the Atlas AI layer as
      of the run date, indicating broad product adoption depth beyond the foundational data integration layer.
    tableRefs: [TU001, TU004]
    figureRefs: [FU001]

  - id: sec-named-customers
    title: Named Customer Deployments and Measured Outcomes
    body: >
      Ten named customers with documented production deployments provide the strongest evidence of real-world
      adoption. Aker BP, Cognite's longest-tenured oil and gas reference, reports up to 50% reduction in visual
      inspection time and 30-80% reduction in maintenance execution time across six Norwegian North Sea assets.
      The company's CDO, Dr. Paula Doyle, publicly credited the platform as enabling "the next generation of
      operational excellence." This outcome is independently corroborated by Aker BP's own investor communications.
      Idemitsu onboarded four refinery sites in under six months, scaled to over 3,000 users, uploaded more
      than 10,000 P&IDs, and management estimates 50,000 hours of annual labor savings. TotalEnergies expanded
      its deployment to 39 upstream assets across three years with over 200 key production systems integrated,
      supported by a press release from TotalEnergies itself. NOVA Chemicals, Canada's largest polyethylene
      producer, reports reducing data access time from hours to minutes across an eleven-plant target scope.
      Celanese's "Digital Plants of the Future" program references Cognite as the enabling platform.
      B. Braun attributes a four-week improvement in a key production workflow to Cognite Flows.
      Cosmo Energy integrated three Japanese refineries with 250 billion data points and five million engineering
      documents. JFE Steel is also a named Flows customer. The proof set spans five verticals and four geographies,
      providing meaningful breadth for a platform positioned as industry-agnostic.
    tableRefs: [TU002]
    figureRefs: [FU003]

  - id: sec-retention
    title: Customer Retention, Expansion, and Commercial Durability
    body: >
      Cognite disclosed a net revenue retention rate of 150% for its newer cohorts of customers, indicating that
      expansion revenue substantially exceeds any churn. The company reported 700% growth in Atlas AI customers
      since that product's launch, and 30%+ of the entire customer base has been enabled with Cognite Flows as of
      May 2026. These figures are company-reported and unaudited, but they are corroborated directionally by
      Forrester analyst coverage and by the pattern of named customer deployments: TotalEnergies' multi-year
      expansion from a pilot to 39 assets, Aker BP's sustained multi-asset deployment, and Idemitsu's platform-wide
      rollout all reflect durable enterprise commitments. The knowledge graph now holds 80 trillion time series
      data points — a 48% year-over-year growth — implying continuous customer data activity rather than static
      deployments. Independent evidence of gross revenue retention or churn rates is not publicly available.
      No regulatory filing or third-party audit of NRR or churn metrics was found. Concentration risk exists:
      Saudi Aramco is simultaneously Cognite's majority shareholder (74% stake acquired in 2022) and one of its
      largest anchor customers, creating an ownership-customer dependency that is structurally unusual and
      potentially concerning to competing oil companies evaluating the platform.
    tableRefs: [TU003]
    figureRefs: [FU002]

  - id: sec-gtm
    title: Competitive Dynamics and Go-to-Market Evidence
    body: >
      Cognite's customer wins suggest a pattern of large enterprise land-and-expand: initial pilots at one or
      two assets followed by multi-year expansions to dozens of facilities. The company's ecosystem positioning
      with Snowflake and Databricks enables it to integrate into customer data architectures rather than
      displacing them, lowering procurement friction. The IDC MarketScape positioned Cognite as a Leader in
      worldwide industrial DataOps platforms — an independently produced analyst assessment that carries
      third-party weight. The CNBC Disruptor 50 inclusion (May 2026) signals broad technology-media recognition.
      On the go-to-market side, Cognite relies primarily on direct sales into the C-suite of industrial
      operators; channel partners (Snowflake, Databricks, AWS) expand reach without becoming primary
      distribution channels. Independent review platforms (Gartner Peer Insights, Slashdot, PeerSpot, SourceForge)
      show sparse to no user reviews relative to the claimed enterprise customer count — a meaningful gap in
      independent social proof. The platform's strength lies in reference-able production deployments at large
      named accounts rather than bottom-up review-driven adoption. Competitive differentiation vs. AVEVA, OSIsoft
      (AVEVA PI), AspenTech, and Palantir rests on industrial knowledge graph depth and the Atlas AI agent layer.
    figureRefs: [FU004]

  - id: sec-concentration
    title: Concentration Risk and Evidence Quality Assessment
    body: >
      Two concentration risks are material. First, Saudi Aramco's 74% equity ownership creates a structural
      conflict of interest: any competing integrated major (bp is also a named customer) or national oil company
      evaluating Cognite must weigh whether sensitive operational data shared with Cognite flows to a
      majority-owned entity of a competitor. This risk is documented by Reuters' 2022 coverage of the acquisition
      and has not been publicly resolved by Cognite. Second, O&G still represents approximately 60% of revenue,
      exposing Cognite to energy-transition uncertainty and capital discipline cycles in the sector.
      Evidence quality is strong for named customers in O&G (Aker BP, TotalEnergies, Idemitsu) where Cognite
      provides case study pages with specific metrics, and for Idemitsu and TotalEnergies where third-party
      or customer-owned corroboration exists. Evidence quality for newer vertical entrants (B. Braun, Celanese,
      JFE Steel) is thinner: outcomes are asserted by Cognite with minimal independent verification.
      Net revenue retention and customer count data are company-disclosed only and have not been verified by
      an independent auditor or regulatory filing.
    tableRefs: [TU005]

