    title: Investment KPI Scorecard
    type: kpi
    layout: compact
    summary: >-
      IC-ready scoring for Cognite across seven investment dimensions as of May 2026, based on available evidence.
      Scores reflect evidence quality, not aspirational trajectory.
    data:
      items:
        - label: Market Opportunity
          value: High
          note: IIoT SAM $2–10B; AI agent adoption wave accelerating; multi-decade energy transition tailwind
        - label: Product Differentiation
          value: High
          note: >-
            Industrial Knowledge Graph + Atlas AI: no full-stack competitor as of May 2026; IDC MarketScape Leader;
            Verdantix Green Quadrant Leader
        - label: Revenue Growth Quality
          value: Strong / Confirmed
          note: 36–57% ARR growth; 150% NRR (newer cohort); Atlas AI penetration 72% of ARR—all company-disclosed
        - label: Financial Transparency
          value: Low / Blocking
          note: >-
            Gross margin, absolute ARR, customer count, 2024 round valuation all undisclosed; prevents financial
            underwriting
        - label: Competitive Moat
          value: Medium-High
          note: >-
            Multi-year data contextualization switching costs; however, AVEVA, Emerson/AspenTech, and hyperscalers have
            deep channel and budget relationships
        - label: Exit / Liquidity Path
          value: Medium / Uncertain
          note: >-
            Multiple viable paths (M&A: Schneider, Emerson, Siemens; IPO); Aker ASA majority complicates timeline; CNBC
            Disruptor 50 signals pre-liquidity positioning
        - label: Valuation vs. Evidence
          value: Unknown / Inconclusive
          note: >-
            2021 $1.6B mark stale; base case $1.6–2.6B supportable but not confirmable without gross margin + ARR; bull
            case requires disclosure validation
        - label: Governance and Alignment
          value: Low / Risk
          note: >-
            Aker ASA majority + Aramco 7.4% creates complex exit dynamics; limited public board disclosure;
            customer-shareholder conflict risk at Aramco
    approximationNotes: >-
      Qualitative scores are this analyst's evidence-based assessment as of May 2026. No independent quantitative
      benchmarking source is publicly accessible for all dimensions. Items marked Unknown or Low reflect genuine
      evidence gaps, not negative assessments.
