      - number: '8.3'
        title: Comparable Company Analysis
        blocks:
          - type: paragraph
            body: |
              No single public company is a clean analog for Cognite. The most relevant comparables cluster
              in two tiers: (1) high-growth enterprise AI and data platforms (Palantir, C3.ai) that share
              Cognite's AI-native positioning and sales profile but differ substantially in market mix and
              customer profile; and (2) industrial software incumbents (PTC) and acquired platforms (AVEVA,
              AspenTech) that share Cognite's vertical focus but represent different growth and margin
              profiles.

              C3.ai (NYSE: AI) is the closest public comparable in terms of product positioning—enterprise
              AI applications for industrial operations—but carries important caveats. C3.ai reported
              approximately $310M in FY2025 revenue, growing at roughly 25% year-over-year. Cognite's
              ARR bookings growth (36–57% YoY) is meaningfully faster, supporting a premium to C3.ai's
              current EV/NTM Revenue multiple of approximately 8–12x. Crucially, C3.ai's public market
              history provides a cautionary data point: from a peak EV/Revenue multiple above 30x in
              December 2020, C3.ai declined to 8–12x by 2025, illustrating how sentiment-driven industrial
              AI multiples can compress sharply when growth disappoints. C3.ai's 10-K annual report filed
              with the SEC for FY2025 confirms a net loss of approximately $214M—a larger absolute loss
              than Cognite's estimated group-level burn—at roughly twice Cognite's revenue scale.

              Palantir Technologies (PLTR) trades at an elevated EV/NTM Revenue multiple above 30x as of
              mid-2026, but is not a valid direct comparable: Palantir derives over 40% of revenue from
              US government and defense contracts, carries a different margin structure, and benefits from
              US defense AI spending tailwinds that are not available to Cognite. Cognite's comparable
              multiple should apply a material discount to Palantir's current mark.

              PTC Inc. (NASDAQ: PTC) represents the scaled industrial software benchmark at approximately
              $2.3B in FY2024 revenue and an EV/NTM Revenue multiple of approximately 8–10x. PTC's
              slower growth profile (8–12% organic) implies Cognite deserves a premium for its higher
              growth, partially offset by Cognite's private-company opacity and oil-and-gas concentration.
              Acquisition precedents provide bracketing reference points. AVEVA (acquired by Schneider
              Electric for approximately £9.5B, completing in January 2023) implies an acquisition
              multiple of approximately 5–7x trailing revenue. AspenTech (acquired by Emerson in a
              transaction valued at approximately $11B in 2022) implies 15–18x trailing revenue at
              closing—a premium justified by AspenTech's high gross margins and sticky process-simulation
              installed base. These precedent multiples bracket the applicable range: a Cognite acquisition
              exit at 8–14x NTM Revenue is defensible; below 6x would represent below-market pricing
              given growth trajectory.

              Verdantix, an independent industrial AI analyst firm, named Cognite a Leader in its Green
              Quadrant for Industrial AI Analytics (paywalled report, 2025), confirming third-party
              positioning at the top of the competitive landscape. PitchBook data on Cognite as of May
              2026 is access-restricted; no updated private-round valuation or secondary mark is publicly
              accessible through standard research channels, which itself is an adverse transparency signal.
              S&P Global Market Intelligence paywalls industrial software valuation data, preventing
              independent derivation of a median NTM multiple from primary data.
            claimRefs:
