              - CR003
          - type: callout
            title: EU AI Act Conformity Assessment Should Be a Pre-Condition for Industrial Deployments
            body: >-
              Cognite's Atlas AI agents — particularly those that provide autonomous recommendations on production
              scheduling, maintenance prioritisation, or safety system parameters — may be classified as high-risk AI
              systems under EU AI Act Annex III (critical infrastructure). Cognite and its customers should initiate
              conformity assessment and technical documentation processes now, before the August 2026 compliance
              deadline for new deployments. Diligence should confirm what Cognite's conformity roadmap looks like and
              who bears the regulatory responsibility — provider or deployer.
            calloutType: recommendation
