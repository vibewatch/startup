            title: Land-and-Expand Is the Dominant Commercial Pattern
            body: >-
              All three documented enterprise deployments (TotalEnergies 39 assets, NOVA Chemicals 11 plants, Cosmo
              Energy 3 refineries) started as single-site pilots before expanding. Cognite's 150% NRR for newer
              customers confirms that expansion is reliable once CDF is installed. This makes initial contract size a
              lagging indicator of long-term account value; diligence should focus on expansion velocity and logo
              retention rather than initial ACV.
