  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: |
              Cognite operates at the intersection of two durable trends—industrial asset digitization and
              enterprise AI agent adoption—with a differentiated Industrial Knowledge Graph that no
              single competitor replicates end-to-end. The investment thesis rests on four pillars: (1) a
              proven land-and-expand model evidenced by 150% NRR for newer customers and Atlas AI reaching
              72% of customer ARR by Q1 2026; (2) a platform architecture with genuine switching costs
              built from multi-year data contextualization and embedded AI workflow dependencies; (3) ARR
              bookings growth accelerating from 36% in FY2025 to 57% in Q1 2026, suggesting the Atlas AI
              upsell cycle is working; and (4) a blue-chip customer base including Saudi Aramco, bp,
              TotalEnergies, Aker BP, and B. Braun, several of whom are multi-year anchor customers.

              The anti-thesis is driven primarily by valuation opacity and financial transparency gaps.
              The last confirmed valuation of $1.6 billion was set in May 2021—before Atlas AI existed,
              before the June 2024 ~$300M round, and at roughly half the current revenue scale. Investors
              cannot underwrite a position without knowing the 2024 round's post-money mark, the gross
              margin structure (estimated at 60–75% but not disclosed), absolute ARR (denominator for the
              growth rate headline), or the full-base NRR beyond the "newer customers" cohort. Saudi
              Aramco's 7.4% equity stake and Aker ASA's majority ownership create exit overhang and
              potential strategic conflict risks that are difficult to price without governance disclosure.
              C3.ai's public market trajectory—multiple compression from 30x+ EV/Revenue in 2021 to 8–12x
              by 2025—provides a cautionary precedent for the industrial AI SaaS category.

              Recommendation: TRACK. Cognite earns a strong qualitative score on product, customer proof,
              and growth trajectory, but cannot be underwritten to a specific entry price until gross margin,
              absolute ARR, full-base NRR, the 2024 round valuation, and customer concentration data are
              disclosed. At an entry price at or below the 2021 $1.6B mark, downside protection is
              moderate; at 2–3× the 2021 mark (consistent with the base-to-bull scenario range), the risk/
              return profile is less favorable without confirmation of margin sustainability.
