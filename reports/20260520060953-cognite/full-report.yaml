  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Module Map and Definitions
        blocks:
          - type: paragraph
            body: >
              Cognite's commercial platform consists of three named product layers and a set of built-in applications,
              all sharing the same Industrial Knowledge Graph data foundation. Cognite Data Fusion (CDF) is the core
              industrial DataOps platform: it ingests, contextualizes, and stores data from disparate IT, OT, and
              engineering systems — time-series from SCADA and DCS, documents, events, 3D models, and P&IDs — and makes
              the result available through a versioned REST API, a Python SDK, and a JavaScript SDK. CDF is the only
              product in the stack that can operate independently; Atlas AI and Flows both require CDF as their data
              foundation.

              Cognite Atlas AI, launched in June 2024, extends CDF with a low-code industrial agent workbench. Digital
              teams and domain experts build AI agents using pre-configured templates without writing code. Agents are
              powered by Context Augmented Generation (CAG), which injects CDF's graph context into LLM prompts, and by
              autoLLM, a routing mechanism that selects the optimal Large Language Model, Small Language Model, or
              Custom Language Model for each agent task. As of fiscal year 2025, 59% of customers by ARR had
              operationalized Atlas AI, and Atlas AI customer count grew nearly 700% year-over-year.

              Cognite Flows, announced at Cognite's IMPACT conference and launched May 12, 2026, is the action layer of
              the platform. It provides a single-screen, persona-based adaptive workspace for frontline operators and
              engineers, embedding AI agents and surfacing data from all enterprise applications simultaneously. Flows
              also redefines developer experience: using AI-native coding tools such as Claude or Cursor, developers can
              build production-grade industrial applications in days instead of months. More than 30% of Cognite's
              customer base was early-enabled with Flows at launch, with 50+ customers actively using it. Built-in
              applications bundled under Flows include Industrial Canvas (visual workspace for P&IDs and time-series),
              InField (mobile field access), Maintain (maintenance work order management), and Charts (time-series
              analytics).
