      - number: '7.5'
        title: Financial, People, and Execution Risks
        blocks:
          - type: paragraph
            body: |
              Cognite's financial risk profile is dominated by sector concentration. Oil and gas
              customers drove approximately 60% of revenue as recently as FY2024, though the company
              reports 40% of FY2025 revenue now comes from outside O&G. A sustained oil price decline
              below approximately $60/bbl — the historically observed threshold for major capex
              programme deferrals — would immediately reduce the digital-transformation budgets of
              Cognite's core customer base. The company offers no publicly disclosed view on customer
              industry distribution or contract duration, making independent concentration analysis
              difficult.

              Cognite's last publicly disclosed valuation of $1.6B dates to its 2021 unicorn milestone,
              with no subsequent equity round at a new price. The $300M TCV-led investment in 2024
              was structured as new capital but at an undisclosed valuation. Any future financing round
              or strategic transaction will reset valuation expectations; a flat or down round would
              constrain employee retention through option dilution and signal competitive difficulty
              to enterprise buyers evaluating long-term vendor viability.

              The 2025 relocation of global headquarters from Oslo to Tempe, Arizona is a significant
              people risk. Cognite's engineering heritage is Norwegian, and its founding technical
              team (including co-founder Geir Engdahl, CTO) is Oslo-based. Relocation creates a
              geographic divide between corporate strategy (US) and technical execution (Norway),
              potentially increasing coordination overhead and attrition among senior Norwegian
              engineers who did not relocate. Headcount grew 21% in 2025 to over 800 employees;
              fast growth in new geographies risks diluting institutional knowledge and culture.

              Rapid product cadence is both a competitive strength and an execution risk. Cognite
              launched Atlas AI (2024) and Cognite Flows (May 2026) in rapid succession; each major
              launch requires substantial field-enablement, customer onboarding capacity, and support
              infrastructure. If go-to-market execution lags product innovation, deal closure rates
              and time-to-value metrics will deteriorate.
