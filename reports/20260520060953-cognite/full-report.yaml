      - number: '4.6'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: |
              Revenue quality is the clearest positive in Cognite's financial picture. The combination of 36%
              ARR bookings growth in FY2025, 150% NRR for newer customers, and Q1 2026 ARR growth accelerating
              to 57% YoY is a compelling compounding profile. The Atlas AI platform land-and-expand motion—where
              Atlas AI was in 72% of customer ARR by Q1 2026 and drove >70% of new bookings—suggests durable
              expansion economics within the installed base. The Forrester Total Economic Impact study (Q1 2026)
              citing 465% ROI for Cognite customers, though vendor-facilitated, provides a third-party framework
              for premium pricing defense.

              Capital adequacy is plausible but not confirmed. At a group burn rate estimated at $60–90M/year,
              the June 2024 ~$300M round would provide 3–5 years of runway from close, implying a runway horizon
              of mid-2027 to mid-2029. But this is an estimate; actual burn, cash on hand, and any debt
              facilities are undisclosed. The Aker ASA majority-owner backstop (NOK 100B+ NAV) reduces
              existential financing risk.

              The principal financial blockers are: (1) stale $1.6B valuation from 2021—any new investment must
              negotiate blind on current valuation; (2) absence of gross margin disclosure prevents underwriting
              the economics of the platform business; (3) Saudi Aramco's combined customer-and-investor role
              creates a conflict-of-interest structure that could influence product roadmap, data access terms,
              and eventual exit optionality; (4) the private-company opacity on absolute ARR and customer count
              prevents triangulating revenue quality against comparable SaaS benchmarks; and (5) no IPO, SPAC,
              or secondary liquidity pathway has been disclosed, leaving strategic acquisition by Aker, Saudi
              Aramco, or a major technology firm as the most plausible exit scenario.
            claimRefs:
              - CI033
              - CI034
              - CI035
              - CI036
