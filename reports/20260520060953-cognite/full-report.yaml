            title: 'IIoT TAM Is a Ceiling, Not a Floor: Industrial DataOps Is a Narrow Sub-Segment'
            body: >-
              The $483–514B IIoT TAM figures cited in this chapter should be treated as a theoretical ceiling, not
              Cognite's addressable market. Industrial DataOps platforms (software only, dedicated to OT/IT
