      - number: '8.4'
        title: Scenario Analysis—Bull, Base, and Bear Cases
        blocks:
          - type: paragraph
            body: |
              Three scenarios are modeled on next-twelve-months (NTM) revenue applied against a
              scenario-appropriate EV/NTM Revenue multiple. The NTM revenue base is estimated at
              $200–220M, derived from the >$170M FY2025 print and a conservative continuation of the
              current 36–57% ARR growth trajectory with a mean-reversion assumption to 30–40% NTM growth.
              Gross margin is not publicly disclosed and is held at the industrial SaaS benchmark range
              of 60–75% across all scenarios; changes to this input materially shift the thesis.

              Bear case ($1.0–1.4B): Multiple compression to 5–7x NTM Revenue, justified by (a) sustained
              oil-and-gas market downturn reducing expansion at Aramco and bp; (b) failed Atlas AI
              commercialization beyond the installed base (penetration falls below 50% of ARR); (c) ARR
              growth deceleration to below 20% YoY; or (d) broad industrial AI multiple compression
              following a C3.ai-style trajectory. At 5–7x × $200M NTM revenue, Cognite's implied
              enterprise value is $1.0–1.4B, below the 2021 $1.6B mark and representing a down-round
              scenario for investors who entered at or above the 2021 price.

              Base case ($1.6–2.6B): Multiple range of 8–12x NTM Revenue applied to $200–220M NTM
              revenue. This scenario assumes: continued 30–40% ARR growth; Atlas AI penetration
              sustaining above 60% of ARR; blended gross margin of 65–70%; and no material customer
              concentration event at Aramco or bp. The $1.6B floor corresponds to the 2021 valuation
              mark at current scale (a "no-premium" exit), while $2.6B requires 12x multiple validation
              through gross margin and retention disclosure.

              Bull case ($3.0–4.4B): Multiple premium of 14–20x NTM Revenue applied to $210–220M NTM
              revenue. This scenario requires: (a) Atlas AI establishing a durable platform moat with
              NRR sustaining above 130% across the full customer base; (b) successful non-O&G vertical
              expansion driving the 40% non-O&G revenue share to 55%+ within 24 months; (c) gross margin
              expanding above 70% as subscription mix improves; and (d) IPO or strategic M&A exit at AI
              platform comps rather than industrial software comps. Palantir's multiple is not applicable
              as a ceiling without US government contract equivalent.

              The Rule of 40 score cannot be calculated from public data. At 36–57% ARR growth and an
              estimated FCF margin of -20 to -30% (derived from the ~$52M FY2024 net loss at the
              Norwegian entity and assumed group-level burn of $60–90M), the estimated Rule of 40 score
              spans roughly 6–37—a wide range consistent with a company whose growth is confirmed but
              whose profitability trajectory is unknown. This uncertainty is the central valuation blocker.
