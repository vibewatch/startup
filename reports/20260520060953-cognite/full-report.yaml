      - number: '5.2'
        title: Customer Workflows and Use Cases
        blocks:
          - type: paragraph
            body: >
              Cognite's platform targets asset-heavy industries — oil and gas, energy, manufacturing, pharmaceuticals,
              and chemicals — where operational data is voluminous, heterogeneous, and historically siloed. The
              platform's primary value proposition is converting raw sensor, equipment, and engineering data into
              AI-ready knowledge that frontline workers, process engineers, and digital teams can act on in real time.

              Across oil and gas, Cognite's most established vertical, customers use CDF to eliminate the time spent
              hunting for operational data. Cognite's oil and gas product page cites 90% less time spent making sense of
              data through unique IT/OT/ET contextualization, 10–25x faster time to deploying solutions into live
              production, and 0.5–1.5% increase in overall production throughput. TotalEnergies expanded its Cognite
              deployment in September 2024 to cover all upstream assets worldwide, citing improved operational
              excellence through AI-ready data. A Forrester Total Economic Impact study commissioned by Cognite cited
              465% ROI and USD 29.4 million in total benefits.

              In manufacturing, B. Braun (medical technology) used Cognite Flows to achieve unified, real-time
              visibility into asset health across all sites within four weeks of deployment. Idemitsu Kosan
              (energy/chemicals, Japan) deployed Flows to digitize accumulated expert knowledge and reduce operational
              risk. A global top-10 pharmaceutical company achieved 30x faster time-to-value using Flows versus
              traditional methods: what previously required a 20-plus-person team and 3–5 months was delivered in four
              days, with user acceptance testing compressed from 6–9 months to two months.

              In chemicals, Celanese (specialty chemicals, Texas) partnered with Cognite and NVIDIA to deploy
              NV-Tesseract NIM time-series forecasting integrated with CDF's knowledge graph, targeting elimination of
              prediction bias jumps in reaction water level monitoring. The NVIDIA partnership, announced March 16,
              2026, operationalizes foundational time-series AI for heavy industry through the Cognite platform.
