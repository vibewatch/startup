  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview
        blocks:
          - type: paragraph
            body: |
              Cognite operates at the intersection of industrial operations, enterprise software, and
              generative AI — a combination that concentrates multiple risk dimensions simultaneously.
              As of May 2026, the company reports $170M+ in FY2025 ARR with 36% YoY growth, yet
              remains privately held with no audited public financials, creating a fundamental opacity
              around burn rate, gross margin, and capital runway.

              The risk heatmap (FR001) plots severity and likelihood for each primary risk category.
              The highest residual-severity risks are oil-and-gas sector concentration and competitive
              displacement by well-capitalised incumbents and hyperscalers. The risk transmission map
              (FR002) illustrates how upstream shocks — an oil price collapse, Aker governance
              change, or AWS outage — cascade to revenue, customer renewal, and ultimately to
              financing capacity and valuation. Three risks stand out as thesis-breaking: (a) loss
              of Aker BP or TotalEnergies as anchor customers without replacement revenue, (b) a
              material security incident affecting industrial control data, and (c) a sustained
              oil-price decline below ~$60/bbl that causes major O&G operators to defer or cancel
              digital transformation programmes.

              The chapter draws on regulatory text (GDPR, EU DSA, EU AI Act provisions), third-party
              security assessments, and trade-press risk coverage. Evidence is absent on undisclosed
              litigation, specific customer contract indemnification terms, and precise cash burn —
              each of these gaps is explicitly documented in the evidence-gap register.
