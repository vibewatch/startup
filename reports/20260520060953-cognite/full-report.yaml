    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Cognite is a B2B industrial AI and data platform company that enables asset-intensive industries—primarily
              oil and gas,

              energy, and process manufacturing—to liberate siloed operational data, contextualize it, and deploy
              AI-driven solutions

              at enterprise scale. The company's platform is anchored by two core products: Cognite Data Fusion (CDF),
              an industrial

              DataOps platform that creates and maintains an Industrial Knowledge Graph across heterogeneous OT and IT
              systems, and

              Cognite Atlas AI, a low-code industrial agent workbench launched in June 2024 that allows non-developers
              to build and

              deploy AI agents on top of the knowledge graph. In May 2026, the company added Cognite Flows as the
              "action layer" of

              its platform, designed to serve frontline workers with unified, AI-driven workflow experiences.


              Cognite's business model is software-as-a-service (SaaS): customers pay subscription fees for platform
              access, with

              professional services and implementation support layered on top. The company targets enterprise-scale
              industrial operators

              with complex multi-site environments, positioning CDF as the data foundation that unifies decades of
              operational data

              before AI agents and applications can deliver value. As of FY2025, approximately 40% of revenue came from
              customers

              outside the oil and gas sector, signaling meaningful diversification into manufacturing, chemicals,
              pharmaceuticals, and

              renewables. The company is headquartered at 40 E Rio Salado Pkwy, Suite 900, Tempe, AZ 85281, having
              recently

              relocated its global headquarters from Oslo, Norway to be proximate to Arizona's high-tech and
              semiconductor

              manufacturing ecosystem. Cognite maintains regional offices in Austin TX, Houston TX, Lysaker (Oslo)
              Norway,

              Tokyo Japan, and Bengaluru India.
