      - number: '3.2'
        title: Incumbent and Direct Peer Profiles
        blocks:
          - type: paragraph
            body: >
              AVEVA PI System—now owned by Schneider Electric following a ~$9.5 billion acquisition completed in January

              2023—is the dominant industrial time-series data historian with a 30-plus-year installed base across oil

              and gas, power, and process industries. The PI System's competitive advantage is its pervasive deployment

              footprint: tens of thousands of historian tags at large industrial facilities create deep operational

              dependency and multi-year switching friction. AVEVA has launched AVEVA CONNECT, a cloud-native data

              management platform, as its next-generation offering designed to compete with modern cloud alternatives;

              however, it occupies a different architectural philosophy from CDF's knowledge graph approach.


              AspenTech, acquired by Emerson Electric in a transaction valued at approximately $11 billion in 2022,

              targets chemical engineering, refining, power generation, and asset performance management with its

              aspenONE simulation suite and Aspen Mtell predictive maintenance product. The Emerson/AspenTech
              combination

              bundles OT control hardware and software under one enterprise roof, creating a channel advantage over

              standalone software vendors. AspenTech's focus on process simulation rather than operational data

              contextualization limits direct overlap with CDF's core use cases.


              Seeq positions itself as an advanced analytics, machine learning, and AI platform for industrial

              time-series data, operating as a data-source agnostic layer that can run on top of PI System, CDF, or

              other historians. Unlike Cognite's full-stack approach, Seeq addresses the analytics and insight layer

              rather than data ingestion or knowledge graph construction, making it complementary to—but in some

              deployments competitive with—CDF's analytical capabilities. C3.ai (NYSE: AI) offers a horizontal

              enterprise AI application platform with marquee industrial customers including Shell, Baker Hughes,

              Koch Industries, and the U.S. Air Force, but its horizontal scope and reliance on customer-provided

              data infrastructure contrast with Cognite's vertically integrated approach. Palantir AIP targets

              large-enterprise and government/defense organizations with a high-touch delivery model and deal sizes

              that typically exceed standard industrial SaaS contracts.
