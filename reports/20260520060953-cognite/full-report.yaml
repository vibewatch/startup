      - number: '4.2'
        title: GTM Motion and Sales Efficiency
        blocks:
          - type: paragraph
            body: |
              Cognite sells exclusively through a direct enterprise-sales motion. Paul Grenet carries the title of
              President and Chief Revenue Officer, indicating a combined field-operations and revenue-ownership
              structure. Regional presidents cover Americas (Bill Hendricks), EMEA (Petteri Vainikka), Japan
              (Ryoichi Egawa), North and Southeast Asia (TS Park), and India (Guru Ananthanarayanan), establishing
              a full global direct-sales footprint consistent with enterprise software at $100M+ ARR.

              Sales cycles in industrial AI and DataOps are long—typically 9–18 months for greenfield enterprise
              deployments—due to OT-integration complexity, procurement governance at energy majors, and the need
              for proof-of-concept phases. Cognite's strategy of offering a "Cognite Quick Start" on-ramp and
              embedding Atlas AI into 72% of customer ARR (as of Q1 2026) is designed to accelerate initial land
              and compress expansion timelines. The BusinessWire Flows announcement cited that a global
              pharmaceutical customer achieved 30X faster time-to-value and reduced UAT from 6–9 months to two
              months—these are public productivity benchmarks offered to support the pricing conversation.

              A key co-sell vector is the Microsoft Azure partnership (three-time Energy & Resources Partner of
              the Year, 2022–2024) which routes Cognite into Azure Marketplace commercial agreements and co-sell
              motions with Microsoft's enterprise field. The Snowflake and Databricks ecosystem partnerships
              (2026) extend channel reach into data-cloud-centric procurement workflows. The NVIDIA NV-Tesseract
              integration (March 2026) adds an AI-infrastructure co-sell dimension.

              Customer acquisition cost (CAC), sales-cycle length, magic number, and payback period are not
              publicly disclosed. Proxies suggest high CAC consistent with long-cycle enterprise sales compensated
              by high ACV and strong land-and-expand economics (150% NRR for newer customers). Customer count is
              not disclosed publicly.
            claimRefs:
