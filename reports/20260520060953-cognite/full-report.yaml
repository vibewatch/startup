              third-party weight. The CNBC Disruptor 50 inclusion (May 2026) signals broad technology-media recognition.
              On the go-to-market side, Cognite relies primarily on direct sales into the C-suite of industrial
              operators; channel partners (Snowflake, Databricks, AWS) expand reach without becoming primary
              distribution channels. Independent review platforms (Gartner Peer Insights, Slashdot, PeerSpot,
              SourceForge) show sparse to no user reviews relative to the claimed enterprise customer count — a
              meaningful gap in independent social proof. The platform's strength lies in reference-able production
              deployments at large named accounts rather than bottom-up review-driven adoption. Competitive
              differentiation vs. AVEVA, OSIsoft (AVEVA PI), AspenTech, and Palantir rests on industrial knowledge graph
