      - - Aker ASA forced sale or strategic restructuring
        - Aker ASA restructures energy holdings, requiring Cognite stake sale below intrinsic value
        - Secondary overhang resolved but price risk; may create opportunistic entry
        - Monitor as potential liquidity event; assess buyer profile
    notes: >-
      Triggers are defined as observable events or thresholds that would materially impair the investment thesis
      independent of other factors. Trigger assessment is author judgment based on available evidence; customer ARR
      thresholds are estimates given that absolute ARR and customer concentration are not disclosed.
    claimRefs:
      - CV011
      - CV016
      - CV033
      - CV034
      - CV038
      - CV039
      - CV042
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Gross margin by revenue stream
        - Blended gross margin; subscription vs. professional services split; gross margin trend FY2022–FY2025
        - >-
          Without gross margin, EV/Gross Profit multiples cannot be applied; profitability path is unmodelable;
          benchmark comparison to C3.ai and PTC is imprecise
        - Request from Cognite CFO; cross-check against Norwegian registry cost structure
      - - Full-base NRR and gross dollar retention
        - Full-cohort NRR (not just newer customers); gross revenue retention rate; churn by vintage
        - >-
          150% NRR for newer customers may mask churn in legacy O&G cohorts deployed pre-Atlas AI; gross retention is
          the floor on the expansion multiple
        - Request from Cognite VP Sales / CFO; ask for cohort analysis by deployment vintage
      - - Absolute ARR and customer count by tier
        - Current ARR in USD; customer count by ARR tier (e.g., $1M+, $500K–$1M, <$500K); ACV distribution
        - >-
          Growth rate without denominator is unverifiable; concentration risk cannot be assessed without customer count
          and tier distribution
        - Request from Cognite CFO; cross-check against Forrester TEI and customer case study revenue signals
      - - June 2024 post-money valuation and cap table
        - >-
          Post-money valuation from TCV June 2024 round; full cap table with preference stack, liquidation preferences,
          and option pool
        - >-
          Cannot underwrite entry price without knowing current valuation mark; preference overhang affects downside
          protection and return modeling
        - TCV press release or Cognite investor relations; request full cap table from legal counsel
      - - Cash on hand and 12-month runway
        - Cash and equivalents as of latest quarter; projected burn rate; debt facilities if any
        - >-
          At $60–90M estimated group burn, runway from the June 2024 round may be approaching 2–3 years; next financing
          event timing affects entry discipline
        - Request from Cognite CFO; cross-check against Norwegian registry FY2024 balance sheet for entity-level cash
      - - Customer concentration confirmation
        - Revenue share attributable to top-3 and top-5 customers; Saudi Aramco revenue as % of total
        - >-
          Aramco 7.4% equity stake creates strategic customer-shareholder conflict; if Aramco exceeds 20% of ARR,
          concentration risk warrants a multiple discount
        - Request from Cognite CFO; triangulate from customer announcements and Forrester customer interview data
      - - IPO or exit timeline
        - >-
          Board-level discussions on IPO readiness (S-1 filing preparation, auditor appointment, CFO public-company
          experience); M&A conversations with identified buyers
        - >-
          Exit path is the return mechanism; unclear timeline reduces ability to price liquidity risk; CNBC Disruptor 50
          recognition may signal imminent public-market activity
        - Request from Cognite CFO/CEO; cross-check through TCV and Accel investor relations channels
      - - Governance and Aker ASA exit terms
        - Aker ASA's governance rights, drag-along provisions, and any right-of-first-refusal on Cognite shares
        - >-
          Aker ASA majority control could block or delay M&A exit; understanding exit constraints is prerequisite to
          modeling any acquisition outcome
        - Request Cognite shareholder agreement from legal counsel; review Aker ASA annual report for Cognite disclosure
    notes: >-
      Diligence asks are ranked by materiality to valuation underwriting. Items 1–4 are blocking for investment
      underwriting; items 5–8 are material but may be partially addressed through alternative data sources. All items
      require direct company engagement or investor-level data room access.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV026
      - CV036
      - CV038
      - CV042
