      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: |
              The most significant near-term growth driver for Cognite's market is the convergence of the
              generative AI adoption wave with the decades-long backlog of industrial data integration work.
              Cognite's Atlas AI customers grew nearly 700% year-over-year in FY2025, demonstrating that AI
              agent capabilities have crossed a commercial threshold for industrial buyers who previously waited
              for the technology to mature. This AI demand driver is further amplified by ESG and decarbonization
              mandates: companies like TotalEnergies are deploying industrial data platforms explicitly to
              improve health-and-safety monitoring and reduce emissions tracking burden alongside production
              optimization.

              Structural tailwinds include industrial workforce aging and labor shortages: as experienced
              engineers retire, industrial operators face a "knowledge transfer" crisis that AI-powered knowledge
              graphs directly address. Cognite's Atlas AI positioning—enabling AI agents to conduct root-cause
              analysis that previously took weeks—maps directly to this constraint. Cloud migration in OT
              environments (historically lagged IT by 10–15 years) is now accelerating as vendors like AWS
              (IoT SiteWise), Azure (Digital Twins), and Siemens (Industrial Edge) normalize cloud-connected
              factory and field operations. This normalization lowers Cognite's infrastructure friction and
              expands the addressable deployment base.

              Adoption constraints are real and material. Forrester's analyst characterizes industrial AI
              deployments as inherently "slow, hard, and expensive" for enterprise-scale companies—noting that
              the shiny AI application is "a tiny little piece of the iceberg, resting atop a mountain of data
              operations groundwork." Switching costs are severe: a multi-year Industrial DataOps implementation
              integrates hundreds of OT/IT data sources, creating deep vendor lock-in once a knowledge graph
              is established. Budget cycles in oil and gas and process manufacturing are long—major IT/OT
              integration projects commonly span 18–36 months from approval to production. OT security and
              data sovereignty requirements add compliance overhead that extends sales cycles and demands
              dedicated customer success resources. Incumbent vendor competition from Siemens, GE Vernova,
              Honeywell, and AspenTech—each offering bundled analytics in their automation suites—also creates
              switching inertia at large accounts already using these vendors' hardware.
