      - number: '7.4'
        title: Partner and Dependency Risks
        blocks:
          - type: paragraph
            body: |
              Aker ASA is Cognite's majority shareholder and the de facto strategic backstop. Aker's
              Q1 2026 Net Asset Value exceeded NOK 110 billion, confirming continued financial capacity
              to support Cognite. However, majority ownership by an industrial conglomerate creates
              governance risks: strategic direction, capital allocation, and exit decisions are
              substantially influenced by Aker's portfolio priorities, which may diverge from pure
              enterprise-software growth strategies. A change in Aker's own financial position,
              leadership, or strategic priorities could materially affect Cognite's access to capital
              and strategic independence.

              Saudi Aramco acquired a 7.4% stake in Cognite in February 2022. This creates a
              valuable commercial relationship with the world's largest oil company and an anchor
              customer on the Arabian Peninsula, but also introduces potential governance complexity:
              Aramco's strategic priorities could influence Cognite's product roadmap, particularly
              for O&G-specific features, in ways that slow diversification into other verticals.
              Additionally, Cognite's operations in Saudi Arabia create export control and
              geopolitical risk exposure given evolving US and EU sanctions landscapes.

              Cognite's NVIDIA partnership for NV-Tesseract integration creates a direct technology
              dependency on GPU availability and NVIDIA's NIM microservice roadmap. In 2025–2026,
              GPU supply constraints have been well-documented across the industry; any interruption
              to NVIDIA's commercial API availability would degrade Atlas AI's time-series
              forecasting capability. The Snowflake and Databricks partnerships create bidirectional
              data flow dependencies where a pricing dispute or competitive conflict could affect
              the co-sell pipeline. Microsoft Azure and AWS are both platform partners and
              potential horizontal competitors as they expand their industrial AI offerings.

              The dependency map (FR003) visualises these critical upstream dependencies and their
              paths to customer value delivery.
