      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: |
              Cognite's customer base is skewed heavily toward large industrial enterprises—companies with
              significant multi-site OT infrastructure, capital budgets exceeding $1B, and existing investments
              in industrial automation. The archetypal buyer is an integrated oil and gas major, a large
              chemicals or process manufacturer, or a national energy company. Cognite's named customers
              include bp, Saudi Aramco, TotalEnergies, Aker BP, Cosmo Energy, TotalEnergies, NOVA Chemicals,
              B. Braun, and Idemitsu Kosan—all large enterprises with complex, multi-site operational
              environments where the economic case for data contextualization and AI is strongest.

              Budget ownership for Industrial DataOps sits at the intersection of IT and Operations: the Chief
              Digital Officer (CDO), VP of Digital, or VP of Engineering typically champions the investment,
              while procurement/finance controls the multi-year SaaS agreement mechanics. This means Cognite
              competes for both discretionary "digital transformation" budgets and core operational IT spend.
              Adoption triggers are consistently: (1) a digital transformation mandate from the C-suite
              driven by operational efficiency targets, (2) a new major capital project requiring modern data
              infrastructure, or (3) pressure from ESG reporting requirements demanding operational visibility.

              The land-and-expand pattern is central to Cognite's commercial model: NOVA Chemicals deployed CDF
              in one plant, then planned expansion to 11 plants within the year; TotalEnergies is deploying
              across 39 upstream assets over three years; Cosmo Energy deployed across all three Japanese
              refineries. This pattern implies that the initial sale is often a limited-scope pilot (one site,
              one use case), and the majority of revenue growth comes from expansion. Cognite's 150% NRR for
              newer customers validates this model commercially. The user personas span data scientists,
              process/plant engineers, IT/OT integration architects, and—with Atlas AI—non-technical frontline
              workers. The payer authority typically sits with a corporate-level budget rather than individual
              plant managers, which means enterprise procurement cycles are long (often 12–24 months for
              initial deals) but multi-year contracts are the norm.
