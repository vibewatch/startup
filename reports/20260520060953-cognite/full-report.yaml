      - number: '7.2'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: |
              Cognite processes industrial operational data under GDPR as a data processor for its
              EU-based customers, including major operators in Norway, the Netherlands, Germany, and
              the UK. The Norwegian Data Protection Authority (Datatilsynet) is the lead supervisory
              authority for Cognite's Norwegian entity, which remains the legal base for much of its
              EU operations despite the 2025 global-HQ relocation to Tempe, Arizona.

              The EU AI Act (Regulation 2024/1689, effective August 2024) classifies AI systems used
              in critical infrastructure — including oil refineries, chemical plants, and energy grids —
              as high-risk systems, requiring conformity assessment, risk management documentation,
              and human oversight provisions before deployment. Cognite's Atlas AI agents, which make
              autonomous recommendations on production operations and maintenance scheduling, may fall
              into this category depending on the level of autonomy granted by operator customers. The
              specific applicability depends on customer configuration and the degree to which Atlas AI
              outputs are acted upon without human review. This is an active regulatory interpretation
              risk with no definitive precedent as of May 2026.

              NIS2 (Directive 2022/2555), effective October 2024, imposes cybersecurity obligations on
              operators of essential services and their critical technology suppliers. Cognite's role as
              an IT/OT integration layer for energy and critical manufacturing customers potentially
              triggers third-party ICT supplier obligations under Article 21, requiring customers to
              conduct security audits of their Cognite deployments and contractually bind Cognite to
              incident notification timelines.

              No publicly disclosed regulatory enforcement actions, lawsuits, or litigation involving
              Cognite were found in searches conducted through May 2026. The absence of disclosure
              does not confirm clean legal standing; private companies do not always disclose pending
              disputes. This constitutes a material evidence gap documented below.

              The regulatory/legal risk register (TR001) ranks each exposure by severity and maps
              it to a diligence action.
