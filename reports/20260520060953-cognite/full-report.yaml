            title: Aker Concentration Is the Dominant Governance Risk
            body: >-
              Aker ASA's majority ownership is both Cognite's greatest strength and its most concentrated governance
              risk. Aker's deep industrial networks and Norwegian Continental Shelf relationships created Cognite's
              earliest reference customers. However, a change in Aker's leadership, strategic direction, or financial
