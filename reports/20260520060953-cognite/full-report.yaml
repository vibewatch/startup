            body: >-
              Searches conducted through May 2026 found no publicly disclosed lawsuits, regulatory enforcement actions,
              or material legal proceedings involving Cognite in any jurisdiction. As a private company, Cognite has no
              disclosure obligation for undisclosed disputes. Diligence should include a formal litigation search across
              Norwegian, US, and EU court records, and a specific request to management regarding any pending or
              threatened claims exceeding a materiality threshold.
            calloutType: insight
