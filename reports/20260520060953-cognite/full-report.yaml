      - number: '1.2'
        title: Founding, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Cognite's origin story is intertwined with Norwegian conglomerate Aker. The official Cognite about-us page
              states

              that the company has been on its mission "since 2016," while its May 2021 press release explicitly states
              "Cognite

              was founded in 2017" and references "four years" since founding. CNBC's May 2026 Disruptor 50 profile
              states Cognite

              was "formed in 2016 in Oslo as a strategic partner with European oil company Aker BP." This dating
              conflict—2016 vs.

              2017—is material and unresolved in public records. The founding thesis was to transform heavy-asset
              industries through

              industrial data liberation, with Aker BP as both incubator and anchor customer. John Markus Lervik, a
              Norwegian serial

              entrepreneur, co-founded the company alongside Geir Engdahl, a former Google software engineer, who serves
              as CTO AI

              and co-founder. Both remain active in the company.


              In 2022, Girish Rishi was named CEO after John Markus Lervik stepped aside to become Chief Strategy and
              Development

              Officer. Rishi, who also serves as Chairman of the Board, brings U.S. enterprise software experience as
              former CEO of

              Blue Yonder (a Panasonic-acquired supply chain software company) and prior executive leadership at
              Motorola and Tyco.

              This CEO transition is a notable governance event: the founder-to-professional-CEO handoff often signals a
              pivot

              toward commercialization and U.S. market expansion, consistent with the subsequent relocation of
              headquarters to

              Arizona. Cognite's current senior leadership team includes Jeff Coulter (CFO), Chirayu Shah (Chief Product
              Officer),

              Liat Berger (Chief Human Resources Officer), Paul Grenet (President, Global Field Operations), Sandy Joung
              (Chief

              Marketing Officer), and Håkon Bjerke (Chief Strategy Officer). Regional presidents cover Americas (Bill
              Hendricks),

              EMEA (Petteri Vainikka), Japan (Ryoichi Egawa), North and Southeast Asia (TS Park), and India (Guru
              Ananthanarayanan).

              Cognite employs professionals from more than 60 countries. Board oversight includes Aker ASA-affiliated
              directors and

              Jake Reynolds (TCV General Partner, joined board in 2021). Key-person dependence on Girish Rishi and Geir
              Engdahl is

              assessed as high given their strategic and technical leadership roles respectively.
