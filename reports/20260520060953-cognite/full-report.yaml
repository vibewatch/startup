      - number: '8.2'
        title: Financing, Valuation, and Capital Structure
        blocks:
          - type: paragraph
            body: |
              Cognite's financing history consists of two large disclosed rounds. In May 2021, TCV led a
              $150M investment that valued the company at $1.6 billion, with TCV's Jake Reynolds joining
              the board. This represented the largest SaaS funding round in Europe at that time per the
              company's own press release. In June 2024, TCV led a second round described as approximately
              $300M; the post-money valuation for this round has never been publicly disclosed. Combined
              with an undisclosed earlier investment by Accel (Cognite investor confirmed via Accel's
              portfolio page), total known capital raised is at least $450M. CNBC's May 2026 Disruptor 50
              profile cites $300M in funding, likely reflecting the 2024 round alone rather than cumulative
              capital.

              The ownership structure is materially opaque. Aker ASA holds a majority stake in Cognite; the
              exact percentage is undisclosed as of May 2026. Saudi Aramco acquired a 7.4% stake from Aker
              BP in February 2022, creating a strategic customer-shareholder that simultaneously provides
              revenue and equity upside but also concentration and influence risk. TCV holds board
              representation through Jake Reynolds. The combination of Aker ASA majority control, Aramco
              strategic stake, and TCV minority position creates a complex governance structure that could
              complicate a standard acquisition exit and may require multiple acquirer consents.

              From the Norwegian Registry (Brønnøysund Register Centre), Cognite AS (org. nr. 918274758)
              filed accounts showing FY2024 revenue of approximately NOK 1.67 billion (~$158M USD at the
              2024 average exchange rate) and a net loss of approximately NOK 547M (~$52M USD). These
              figures cover the Norwegian legal entity only; global consolidated group revenue exceeded
              $170M in FY2025 per Cognite's January 2026 press release. The implied group-level burn rate
              is estimated at $60–90M/year, suggesting the June 2024 ~$300M round provides runway through
              mid-2027 to mid-2029 absent material burn acceleration. This estimate is highly uncertain given
              the absence of consolidated cash flow disclosure.

              The stale valuation mark is the single most operationally significant gap for any investor.
              At NTM revenue of approximately $200–220M (implied by current growth trajectory), a Cognite
              entry at the 2021 $1.6B mark implies an ~7–8x NTM Revenue multiple—toward the lower end of
              the applicable comp range for a high-growth industrial AI platform—providing some downside
              discipline. Any entry above $2.5B implies 11–12.5x NTM Revenue and demands confirmation of
              gross margin sustainability and full-base NRR to justify the premium.
