      - number: '7.3'
        title: Operational and Security Risks
        blocks:
          - type: paragraph
            body: |
              Cognite's platform is built on multi-cloud infrastructure spanning AWS, Microsoft Azure,
              and Google Cloud Platform. This architecture reduces single-cloud outage exposure but
              creates dependency on all three major cloud providers simultaneously. The May 7, 2026
              AWS outage that disrupted over 150 cloud services illustrates the systemic risk to
              SaaS platforms when hyperscaler infrastructure degrades; Cognite's specific SLA
              commitments and redundancy failover procedures are not publicly documented.

              Cognite holds ISO 27001:2022, SOC 2 Type II, ISO 27018, and ISO 9001 certifications,
              all publicly referenced on its Trust Center. The platform also supports NERC CIP v.5
              for energy-sector customers and IEC 62443 industrial cybersecurity standards. UpGuard
              continuously monitors Cognite's external security posture; the full risk rating report
              is behind a paywall, preventing independent third-party verification in this research
              cycle. The absence of any publicly disclosed security breach is noted but cannot be
              taken as confirmation of a clean record for non-public incidents.

              Industrial OT data presents a distinctive attack surface: Cognite ingests data from
              SCADA systems, DCS platforms, and historian databases that contain real-time process
              conditions of operating facilities. A breach affecting live industrial process data
              would carry safety-critical consequences beyond typical enterprise software incidents.
              Cognite's IEC 62443 certifications partially address this exposure, but residual risk
              remains in customer-side integration layers that are outside Cognite's direct control.

              Enterprise CDF deployments typically require 6–18 months of implementation work,
              creating extended periods of integration risk during which data pipelines are only
              partially validated. Implementation failures — data-model mismatches, historian
              connector failures, or CDF performance degradation under load — have been cited
              anecdotally in trade press coverage of industrial DataOps platforms as the most common
              cause of delayed value realisation.
            claimRefs:
