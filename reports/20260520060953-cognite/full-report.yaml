      - number: '5.5'
        title: Roadmap, Releases, and Ecosystem
        blocks:
          - type: paragraph
            body: >
              Cognite follows a quarterly product release cadence for CDF, Atlas AI, and Flows capabilities. The most
              significant recent milestones span June 2024 through May 2026 and include two major new product launches
              and multiple partner integrations.

              The June 2024 Atlas AI launch marked the platform's formal entry into industrial agentic AI, adding a
              low-code agent builder and a pre-built agent library on top of CDF's existing DataOps capabilities. The
              January 2026 Snowflake Energy Solutions collaboration enabled joint customers to unify IT/OT data in the
              Snowflake AI Data Cloud while retaining Cognite's knowledge graph enrichment layer. In March 2026, Cognite
              announced and demonstrated the NVIDIA NV-Tesseract NIM integration at NVIDIA GTC, with Celanese as the
              anchor production deployment. In March 2026, IDC recognized Cognite as a Leader in the IDC MarketScape for
              Worldwide Industrial DataOps Platforms 2026, citing CDF's support for all five key industrial DataOps
              capabilities, its white-label ecosystem, and its downstream AI capabilities through Atlas AI. Cognite
              Flows launched on May 12, 2026, and the company appeared on the CNBC Disruptor 50 list on May 19, 2026.

              The partner ecosystem spans hyperscalers (Microsoft Azure, AWS, GCP), specialized data platforms
              (Snowflake, Databricks), AI infrastructure (NVIDIA), and a growing ISV/SI channel including Radix, L&T
              Technology Services, and RoviSys as Flows launch partners. The developer community is accessible through
              hub.cognite.com, with active discussions on data type configuration, API authentication, and time-series
              query patterns. Stack Overflow questions tagged 'cognite' reflect active practitioner engagement,
              including challenges with CDF data type management and SDK authentication flows. The Python SDK on PyPI
              (cognite-sdk) is the primary distribution channel for developer adoption. The GitHub repository for
              cognite-sdk-python reflects ongoing active development, with the v8 release introducing async support.
