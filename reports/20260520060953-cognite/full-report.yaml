      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Opacity Is the Central Underwriting Blocker
            body: >-
              The $1.6B 2021 valuation mark is approximately five years stale and was set at roughly half of Cognite's
              current revenue scale. Without the June 2024 post-money valuation, gross margin disclosure, and absolute
              ARR, it is not possible to underwrite an investment price with confidence. Any entry above $2B requires
              active validation against comps that Cognite has not disclosed the data to support. This is not a
              qualitative concern—it is a structural financial transparency gap that prevents risk-adjusted return
              modeling.
            calloutType: risk
            claimRefs:
              - CV001
              - CV005
              - CV016
              - CV042
          - type: callout
            title: Atlas AI Penetration Is the Single Best Leading Indicator
            body: >-
              Atlas AI penetrating 72% of customer ARR by Q1 2026, compared to zero penetration at its June 2024 launch,
              is the most important early indicator of platform stickiness and upsell durability. If this metric
              sustains above 65% of ARR across the full customer base—including older O&G deployments—it substantially
              de-risks the base-case multiple assumption. Investors should track this figure quarterly and treat any
              reversal below 55% as an early thesis-break signal.
            calloutType: insight
            claimRefs:
              - CV010
              - CV011
              - CV033
          - type: callout
            title: C3.ai Multiple Compression Is a Cautionary Precedent
            body: >-
              C3.ai's public market trajectory—a peak EV/NTM Revenue multiple above 30x in late 2020, declining to 8–12x
              by FY2025—illustrates how rapidly industrial AI platform valuations can compress when growth disappoints.
              C3.ai's continued net losses ($214M in FY2025) despite $310M in revenue demonstrate that scale alone does
              not resolve the profitability question in this category. Cognite's faster growth is a positive
              differentiator, but multiple compression risk is real and should be priced in.
            calloutType: risk
            claimRefs:
              - CV017
              - CV022
              - CV043
          - type: callout
            title: Entry Price Discipline Is Critical Given Transparency Gaps
            body: >-
              Given the absence of gross margin, absolute ARR, and current valuation disclosure, an investor should
              require a meaningful discount to the base-case midpoint ($2.1B) as compensation for information asymmetry.
              An entry at or below the 2021 $1.6B mark (8x NTM Revenue) provides genuine downside protection in the bear
              case and modest upside in the base case. Entries above $2.5B should be conditioned on disclosure of gross
              margin ≥65% and full-base NRR ≥120% as explicit closing conditions.
            calloutType: recommendation
            claimRefs:
              - CV025
              - CV030
              - CV032
