            title: Market Sizing Gap Is Structurally Unresolvable Without Analyst Report Access
            body: >-
              No unpaywalled analyst report provides a directly bounded TAM for Industrial DataOps platforms. IDC
              MarketScape 2026 is the most authoritative reference but access requires purchase. Without a credible SAM,
