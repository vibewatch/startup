      - number: '8.5'
        title: Exit Readiness, Final Diligence Asks, and Kill Triggers
        blocks:
          - type: paragraph
            body: |
              Cognite's most plausible exit paths in 2026–2028 are: (1) strategic acquisition by a
              large industrial automation or enterprise software incumbent seeking an AI-native industrial
              DataOps capability; or (2) an IPO when the company achieves profitability milestones or
              market conditions support a growth-stage industrial AI listing. The CNBC Disruptor 50
              recognition in May 2026 is consistent with building public profile ahead of a potential
              liquidity event.

              Strategic acquirer candidates include Schneider Electric (which acquired AVEVA as a
              DataOps precedent), Emerson Electric (acquired AspenTech), Siemens, Honeywell, and ABB—
              all of which compete in industrial automation and have strategic rationale for acquiring
              Cognite's Industrial Knowledge Graph and Atlas AI agent workbench. A hyperscaler (Microsoft,
              given the Energy and Resources Partner relationship; or AWS) could also be a strategic buyer.
              The AVEVA ($9.5B) and AspenTech ($11B) precedent M&A transactions bracket the relevant
              enterprise value range for strategic exits at Cognite's scale.

              Aker ASA's majority ownership creates a potential acquirer deterrent: a strategic buyer would
              need Aker ASA consent to acquire a controlling stake, and Aker ASA may prefer to retain
              exposure to industrial data assets aligned with its broader energy investment thesis. Saudi
              Aramco's 7.4% equity stake adds another veto dimension. These governance complexities
              should be surfaced in diligence and resolved before any investment thesis relies on a
              near-term M&A exit.

              The five most critical diligence asks before investment: (1) gross margin by revenue stream
              (subscription vs. professional services), without which SaaS benchmarking is impossible;
              (2) full-base NRR and gross dollar retention, to confirm whether the 150% "newer customer"
              NRR masks churn in older cohorts; (3) absolute ARR and customer count by tier, to verify
              concentration and ACV distribution; (4) the June 2024 post-money valuation and current
              cap-table structure including preference stack and liquidation preferences; and (5) cash on
              hand and 12-month cash runway, to assess whether the next financing event will be dilutive.
            claimRefs:
