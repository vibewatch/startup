    severity: material
    topic: valuation
    missingEvidence: Post-2024-round valuation; no public disclosure of the valuation achieved in the ~$300M TCV-led round from 2024.
    whyItMatters: >-
      The last known valuation ($1.6B) is from May 2021 and is approximately 5 years stale; with ~$170M+ revenue and 36%
      growth, the company may be worth significantly more, but any valuation-based analysis is speculative.
    diligencePath: >-
