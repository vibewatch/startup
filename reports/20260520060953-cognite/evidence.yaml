evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-year
    missingEvidence: >-
      Authoritative founding document (corporate registration, incorporation certificate, or official press release
      explicitly stating 2016 versus 2017) that resolves the discrepancy between the about-us page ('since 2016') and
      the 2021 press release ('founded in 2017').
    whyItMatters: >-
      The founding year determines whether the company is a 9- or 10-year-old business and affects milestone dating in
      diligence materials; for legal and regulatory filings, the exact incorporation date matters.
    diligencePath: >-
      Request the Certificate of Incorporation from Cognite's legal counsel or the Norwegian Brønnøysund Register Centre
      (Foretaksregisteret) for the formal entity registration date.
