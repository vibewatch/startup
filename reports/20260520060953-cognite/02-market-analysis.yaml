      - CM021
      - CM022
      - CM023
      - CM027
      - CM028
      - CM029

  - id: FM004
    title: Industrial DataOps Adoption Funnel
    type: funnel
    layout: standard
    summary: >-
      End-to-end enterprise adoption journey from initial awareness through land-and-expand growth,
      mapping the Cognite commercial motion observed across documented customer deployments.
    data:
      items:
        - id: "awareness"
          label: "Awareness"
          value: 100
          detail: "Industry events (Impact), analyst reports (IDC, Verdantix), peer referrals, hyperscaler partnerships"
        - id: "evaluation"
          label: "Evaluation & Pilot (POC)"
          value: 30
          detail: "Single-site proof of concept (3–6 months), executive sponsorship required, CDF integration with key OT sources"
        - id: "land"
          label: "Land (Initial Contract)"
          value: 12
          detail: "1–3 site SaaS agreement (typically 3-year term), professional services for initial knowledge graph build"
        - id: "expand"
          label: "Expand (Land-and-Expand)"
          value: 8
          detail: "Multi-site rollout (NOVA: 11 plants; TotalEnergies: 39 assets), Atlas AI add-on, 150% NRR for newer cohorts"
        - id: "platform"
          label: "Platform Consolidation"
          value: 4
          detail: "Enterprise-wide Industrial Knowledge Graph; Snowflake/Databricks data fabric integration; Cognite as AI data foundation"
    approximationNotes: >-
      Adoption funnel stages are inferred from Forrester analyst blog (NOVA Chemicals, TotalEnergies, Cosmo
      Energy case studies), Cognite FY2025 press release, and Atlas AI launch announcement. Timelines are
      representative; actual POC-to-land duration varies by account complexity and budget readiness.
    claimRefs:
      - CM024
      - CM025
      - CM026
      - CM027
      - CM031
      - CM039

