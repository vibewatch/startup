  - id: market-sizing-multiple-lenses
    title: "Market Sizing: Multiple Lenses"
    body: |
      No publicly accessible analyst report provides a directly bounded TAM for "Industrial DataOps
      platforms" or "Industrial AI platforms for asset-intensive industries" as Cognite defines its
      market. The IDC MarketScape Worldwide Industrial DataOps Platforms 2026 (Doc #US53013025) is the
      most authoritative reference but is sold at paywall pricing and only available in excerpt form via
      Cognite's own press release. Two independent sources on the broader IIoT market provide sizing
      anchors with materially different projections.

      Grand View Research (GVR) estimates the global IIoT market at $483.16 billion in 2024, projected
      to reach $1,693.44 billion by 2030 at a CAGR of 23.3% (2025–2030). Precedence Research estimates
      the same market at $514.39 billion in 2025, projecting $2,430.21 billion by 2035 at a CAGR of
      16.8% (2026–2035). The two estimates conflict on both the 2024/2025 base ($483B vs $514B) and the
      CAGR (23.3% vs 16.8%), reflecting different market boundary definitions—GVR likely includes more
      industrial hardware/connectivity revenue while Precedence may weight software/services differently.
      Neither report provides a dedicated sub-segment for Industrial DataOps platforms.

      A bottom-up sizing lens using Cognite's disclosed metrics suggests a constrained addressable market:
      Cognite at $170M revenue is likely the second or third largest pure-play Industrial DataOps vendor
      globally (behind AVEVA/OSIsoft, which is now part of Schneider Electric at enterprise scale), implying
      a pure-play Industrial DataOps software market of perhaps $500M–$2B in annual contract value—orders
      of magnitude smaller than the IIoT TAM. The C3.ai SEC 10-K filing (fiscal 2025, filed July 2025) shows
      C3.ai at approximately $252M revenue, providing a public analog for enterprise industrial AI scale and
      confirming the market is real but not yet at multi-billion revenue concentration. Manufacturing accounts
      for the largest IIoT end-use segment (~28.7% in 2025 per Precedence Research), exceeding oil and gas
      alone—this is relevant as Cognite is actively expanding beyond its O&G base.
