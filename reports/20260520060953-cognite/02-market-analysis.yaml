  - id: diligence-gaps-and-contradictions
    title: Diligence Gaps and Contradictory Estimates
    body: |
      The most significant analytical gap in this chapter is the absence of a public, independently
      produced, unpaywalled estimate for the Industrial DataOps platform sub-segment. IDC's 2026
      MarketScape (paywalled), Verdantix's two 2025 leadership reports (paywalled), and Gartner's
      relevant Market Guide (blocked/inaccessible at time of research) all confirm that the category
      exists and that Cognite is a leader—but none of these sources provide an extractable market
      size figure. Diligence buyers should acquire the full IDC and Verdantix reports before accepting
      management's implied market framing.

      The two available public estimates—GVR ($483B in 2024, CAGR 23.3%) and Precedence Research
      ($514B in 2025, CAGR 16.8%)—are methodologically inconsistent and cannot be reconciled into
      a single authoritative figure. Both are for the broad IIoT market, not Industrial DataOps
      specifically, and both acknowledge that the market boundary is still evolving as software
      and hardware components are counted differently across publications. This contradiction is
      preserved rather than resolved; neither estimate should be used as a proxy for Cognite's SAM
      without significant adjustment.

      Cognite's stated Moonshot goal ($100B in cumulative customer value by 2035) is aspirational
      and not a market size estimate—it reflects management's internal confidence but does not map
      to a verifiable TAM. The market penetration rate for Industrial DataOps in oil and gas (the
      dominant vertical) is not publicly quantifiable: there are approximately 50+ major oil and gas
      operators globally with the scale to be Cognite customers, but the fraction currently using
      any Industrial DataOps platform is unknown from public sources.
    claimRefs:
      - CM041
      - CM042
