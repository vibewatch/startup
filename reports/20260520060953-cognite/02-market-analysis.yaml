  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-sizing
      missingEvidence: >-
        Full IDC MarketScape 2026 (Doc #US53013025) report with market size figures, vendor positioning details,
        and buyer survey data for the Industrial DataOps platform category. Verdantix Industrial AI Analytics
        and Industrial Data Management leadership reports (both 2025). Gartner Market Guide for
        industrial AI platforms (publication not confirmed).
      whyItMatters: >-
        Without a credible sub-segment TAM, Cognite's market share and penetration cannot be independently
        estimated. Management's implied market positioning (leader in a growing category) cannot be independently
        validated without access to the underlying analyst assessments.
      diligencePath: >-
        Purchase IDC MarketScape 2026 and both Verdantix reports (estimated $3,000–$8,000 per report); request
        Gartner client access; compare market boundary definitions across all three before accepting any
        single estimate.
      relatedQuestionRefs:
        - QM002
        - QM003
        - QM023

    - type: missing-source
      severity: material
      topic: industrial-ai-pilot-failure
      missingEvidence: >-
        Public case studies or analyst reports documenting Industrial DataOps implementations that failed
        to scale beyond pilot stage. Churn data or early-termination statistics for the Industrial DataOps
        sector. Independent post-mortems of failed digitalization programs.
      whyItMatters: >-
        The Forrester analyst blog explicitly warns that many firms fail at industrial AI implementation,
        but provides no data on failure rates. Without this evidence, the market constraint from implementation
        complexity cannot be quantified, and Cognite's disclosed NRR (which excludes early churners by
        focusing on "newer customers") may overstate long-term retention.
      diligencePath: >-
        Request Cognite cohort-level NRR data across all customer vintages (not just newer cohorts);
        commission primary research with 5–10 Cognite customer references to understand pilot success rates;
        ask Cognite for contract renewal rates by year of first deployment.
      relatedQuestionRefs:
        - QM021

    - type: missing-source
      severity: material
      topic: industrial-dataops-market-penetration
      missingEvidence: >-
        Estimate of what fraction of the top 50–100 global oil and gas operators, top 100 chemicals/process
        manufacturers, and top 50 power/renewables companies currently use any Industrial DataOps platform
        (Cognite or competitor). This would allow calculation of early-market versus late-market positioning.
      whyItMatters: >-
        Market penetration rate is a critical input for assessing whether Cognite is still in an early-adopter
        phase (high growth, large opportunity ahead) or approaching saturation in its core verticals. Without
        this denominator, revenue growth rates do not translate into a clear picture of remaining opportunity.
      diligencePath: >-
        Request Cognite's pipeline analysis by vertical with total addressable company counts; cross-reference
        with IOGPmembership list (~100 companies), CEFIC member list for chemicals, and Wood Mackenzie or
        S&P Global upstream operator databases; triangulate with IDC and Verdantix buyer survey data.
      relatedQuestionRefs:
        - QM023

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TM003 (Segment and Buyer Map) is an analytical archetype table derived from qualitative case study
      evidence and Forrester analyst characterization. Notes are included in the table; this acknowledgment
      covers any residual tableNotes warning given that buyer personas are representative constructs
      rather than exhaustive primary-source enumerations.
