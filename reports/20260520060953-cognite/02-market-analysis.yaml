chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Cognite competes in the Industrial DataOps and Industrial AI platform market—a distinct
    sub-segment of the broader Industrial IoT ($483–514B in 2024) in which no analyst firm
    publicly publishes an unpaywalled TAM. Two independent sizing sources (Grand View Research
    at 23.3% CAGR through 2030; Precedence Research at 16.8% through 2035) confirm robust
    IIoT growth but disagree on magnitude. Cognite's primary buyers are large oil and gas,
    chemicals, and power enterprises deploying enterprise-scale knowledge graphs; the land-
    and-expand motion (150% NRR for newer customers) is the defining commercial pattern.
    Adoption is real but the Forrester analyst characterizes industrial AI as inherently
    "slow, hard, and expensive," constraining pace despite strong AI tailwinds.

sections:
  - id: market-boundary-and-definition
    title: Market Boundary and Definition
    body: |
      Cognite's primary market is the Industrial DataOps and Industrial AI platform segment: software
      platforms that ingest, contextualize, and operationalize operational technology (OT) and information
      technology (IT) data within asset-intensive industries to enable AI-driven workflow automation and
      decision support. This segment sits inside the broader Industrial Internet of Things (IIoT) umbrella
      but is meaningfully narrower: it excludes commodity sensor hardware, general-purpose cloud storage,
      SCADA/DCS control systems, and enterprise resource planning software. Status-quo substitutes include
      legacy historian databases (notably OSIsoft PI, now part of AVEVA/Schneider Electric), point
      analytics tools, OEM-bundled analytics in industrial automation suites (Siemens, GE Vernova,
      Honeywell, AspenTech), and spreadsheet-based engineering workflows. The category is also
      distinguished from general-purpose enterprise AI platforms (Palantir AIP, C3.ai) by its primary
      dedication to OT/IT convergence, real-time sensor data, and industrial knowledge graphs rather
      than business process AI.

      Cognite serves three primary end-market verticals: oil and gas (approximately 60% of FY2025
      revenue based on implied reverse calculation of the "40% non-O&G" disclosure), process
      manufacturing/chemicals/pharmaceuticals, and power and renewables. These verticals share the
      defining characteristics of capital intensity, multi-site operations, heterogeneous legacy data
      infrastructure, and strong economic and safety incentives for operational optimization. Adjacencies
      that Cognite is actively exploiting include the hyperscaler data platform market (Databricks,
      Snowflake) and agentic AI tooling (Microsoft Copilot Studio, AWS Bedrock)—both competitive and
      complementary. The IOGP (International Association of Oil and Gas Producers) represents the
      primary industry body organizing operator standards and digital transformation initiatives globally.

      The term "Industrial DataOps" was adopted broadly post-2020 and was first validated as a distinct
      analyst category by IDC with the inaugural MarketScape assessment in early 2026. Prior to this,
      the relevant software category was variously called "industrial analytics," "operational intelligence,"
      or "IIoT platforms"—making historical sizing comparisons methodologically unreliable. Cognite
      competes against both specialized pure-play vendors (Seeq, Aspentech Inmation/Mtell) and
      hyperscaler-native services (AWS IoT SiteWise, Azure Digital Twins, Google Cloud Manufacturing
      Data Engine) that offer commodity data aggregation at cloud pricing.
