callouts:
  - calloutType: insight
    title: Land-and-Expand Is the Dominant Commercial Pattern
    body: >-
      All three documented enterprise deployments (TotalEnergies 39 assets, NOVA Chemicals 11 plants,
      Cosmo Energy 3 refineries) started as single-site pilots before expanding. Cognite's 150% NRR
      for newer customers confirms that expansion is reliable once CDF is installed. This makes initial
      contract size a lagging indicator of long-term account value; diligence should focus on
      expansion velocity and logo retention rather than initial ACV.
    claimRefs:
      - CM024
      - CM025
      - CM026

  - calloutType: risk
    title: Market Sizing Gap Is Structurally Unresolvable Without Analyst Report Access
    body: >-
      No unpaywalled analyst report provides a directly bounded TAM for Industrial DataOps platforms.
      IDC MarketScape 2026 is the most authoritative reference but access requires purchase. Without
      a credible SAM, it is impossible to independently verify management's market share claims or
      assess whether $170M+ revenue represents strong or weak penetration. Acquiring the full IDC
      and Verdantix reports is a recommended pre-closing diligence action.
    claimRefs:
      - CM014
      - CM041
      - CM042

  - calloutType: assumption
    title: "IIoT TAM Is a Ceiling, Not a Floor: Industrial DataOps Is a Narrow Sub-Segment"
    body: >-
      The $483–514B IIoT TAM figures cited in this chapter should be treated as a theoretical ceiling,
      not Cognite's addressable market. Industrial DataOps platforms (software only, dedicated to
      OT/IT contextualization and AI deployment) represent a small fraction of total IIoT spend
      dominated by hardware, connectivity, and broad-platform vendors. Bottom-up analysis suggests
      the pure-play software SAM is in the $500M–$2B range—three orders of magnitude smaller.
    claimRefs:
      - CM011
      - CM012
      - CM016
      - CM020

