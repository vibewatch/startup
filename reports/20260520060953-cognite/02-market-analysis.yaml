    type: matrix
    layout: wide
    summary: >-
      Matrix mapping industrial verticals to buyer personas, end users, payers, and primary
      adoption triggers, illustrating the enterprise procurement complexity Cognite must navigate.
    data:
      columns:
        - "Buyer Persona"
        - "End User"
        - "Payer Authority"
        - "Adoption Trigger"
        - "Budget Cycle"
      rows:
        - label: "Oil & Gas Upstream"
          values: ["CDO / VP Digital", "Production Engineers / Operators", "Corporate Opex", "Efficiency + AI mandate", "18–36 months"]
        - label: "Oil & Gas Downstream"
          values: ["VP Operations / IT Director", "Refinery Process Engineers", "Refinery Opex", "Safety + compliance", "12–24 months"]
        - label: "Chemicals / Process Mfg"
          values: ["VP Engineering / CDO", "Process Engineers", "Capex + Opex blend", "Cost + ESG mandate", "12–24 months"]
        - label: "Power & Renewables"
          values: ["VP Asset Management", "Grid/Plant Engineers", "Asset Mgmt Budget", "Energy transition", "18–30 months"]
        - label: "Pharmaceuticals"
          values: ["VP Manufacturing / CDO", "Manufacturing Scientists", "Manufacturing IT", "Regulatory compliance", "12–18 months"]
        - label: "Mining"
          values: ["VP Operations / CDO", "Mining/Safety Engineers", "Capital project budget", "ESG + remote ops", "18–36 months"]
    approximationNotes: >-
      Budget cycle estimates are representative archetypes derived from Forrester analyst characterization
      of enterprise industrial software procurement. Actual cycles vary significantly by company size,
      digital maturity, and geographic jurisdiction.
