  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: coordinator-internals
    missingEvidence: Public documentation of the internal software, CRM, queueing, or workflow tooling that care coordinators use to manage patient cases.
    whyItMatters: The operating moat depends on coordinator throughput and consistency, but investors cannot judge service leverage without tooling detail.
    diligencePath: Request coordinator tooling screenshots, queue metrics, staffing ratios, escalation paths, and case-resolution dashboards.
    relatedQuestionRefs:
    - QE002
    - QE024
  - type: private-evidence-only
    severity: material
    topic: hospital-insurer-integration
    missingEvidence: Named insurer, TPA, hospital HIS, EMR, or claims-system integrations tied to the insurance and admission workflow.
    whyItMatters: If insurance and hospital coordination are mostly manual, the product may scale more like an operations business than a software platform.
    diligencePath: Ask for integration partner list, API or file-exchange methods, claims turnaround metrics, and hospital onboarding playbooks.
    relatedQuestionRefs:
    - QE022
    - QE025
  - type: missing-source
    severity: material
    topic: abdm-depth
    missingEvidence: Proof that Pristyn reads or writes longitudinal clinical records within ABDM rather than only creating ABHA IDs and storing uploaded documents.
    whyItMatters: ABHA onboarding alone is useful, but it is much weaker than true digital-health interoperability as a long-term moat.
    diligencePath: Request ABDM participation details, linked provider counts, record-sync flows, and examples of records written back into the patient account.
    relatedQuestionRefs:
    - QE012
    - QE013
  - type: conflicting-data
    severity: material
    topic: teleconsultation-surface
    missingEvidence: A reconciled explanation of whether teleconsultation is strategically active, app-only, merged into another surface, or partly deprecated on the web.
    whyItMatters: Channel inconsistency makes it difficult to assess consultation demand capture, UX reliability, and feature maintenance discipline.
    diligencePath: Ask for current consult volumes by app vs web, the canonical consult URL map, and the reason for redirecting or breaking older consultation pages.
    relatedQuestionRefs:
    - QE015
    - QE016
  - type: missing-source
    severity: material
    topic: privacy-and-profiling-governance
    missingEvidence: A public trust center or policy note explaining how retargeting, profiling, and health-sensitive engagement data are governed in practice.
    whyItMatters: Healthcare users and regulators may judge these practices differently than ordinary ecommerce remarketing, especially when app permissions and medical data are involved.
    diligencePath: Request data-classification policy, consent UX, retention periods, profiling logic, and compliance review under India's current privacy regime.
    relatedQuestionRefs:
    - QE021
  - type: private-evidence-only
    severity: material
    topic: unit-economics-of-service-layer
    missingEvidence: Per-patient service cost, coordinator utilization, insurance-processing productivity, and follow-up completion metrics after the layoffs and profitability push.
    whyItMatters: The biggest unresolved question is whether the product moat is financially durable or simply expensive service labor wrapped around strong acquisition.
    diligencePath: Request contribution margin by procedure cohort, coordinator productivity metrics, partner-hospital support cost, and post-layoff service-quality trends.
    relatedQuestionRefs:
    - QE024
    - QE025
