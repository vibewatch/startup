company:
  name: Pristyn Care
chapter:
  number: 5
  title: Product & Technology
  summary: 'Pristyn Care''s product is a coordinator-led surgery workflow rather than a pure software app: discovery pages, city-doctor rosters, a patient app, ABHA onboarding, insurance and transport support, and post-op follow-up all feed one full-stack care journey. The main diligence issue is depth of automation. Public surfaces clearly prove patient-facing features and a very large SEO funnel, but they do not prove hospital-system integration, insurer APIs, or durable web teleconsultation reliability; several critical steps still look human-mediated and therefore potentially expensive.'
sections:
- id: coordinator-led-surgery-workflow
  title: Coordinator-led surgery workflow
  body: 'Pristyn Care''s core product should be described as an operating workflow for elective and secondary-care surgery, not merely as an app. The homepage and about page both present a guided journey that starts with discovery, then moves through consultation, diagnostics, insurance paperwork, hospital commute, admission, discharge, and follow-up. The most distinctive layer is the human care coordinator. Official copy says coordinators provide end-to-end support and personally respond to service problems, while treatment pages add free cab or pick-up support, cashless or EMI help, and post-operative follow-up. That combination is a real conversion and trust advantage for surgery, where patients care as much about logistics and confidence as about doctor search. At the same time, the public record does not reveal the coordinator software stack, case-management tooling, or automation depth. Investors should therefore separate what is explicit from what is inferred: the guided workflow
    is explicit, but the internal CRM or orchestration engine behind it is not. The best current reading is that Pristyn''s moat is a software-enabled service layer that wraps partner doctors and hospitals, with a meaningful human-in-the-loop component that may be harder to scale efficiently than marketing copy suggests.'
