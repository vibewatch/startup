- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  - Source
  rows:
  - - Permission and privacy disclosure
    - Documented
    - Privacy policy explicitly explains camera, audio, location, files, storage, phone, SMS, and image-upload usage for app workflows
    - No product trust center consolidates privacy, retention, security, and records practices in one place
    - Privacy policy
  - - Teleconsultation consent and confidentiality
    - Partially documented
    - Mobile-app page says consultations are confidential; privacy policy ties permissions to doctor consultations
    - No public detail on video infrastructure, call recording, or clinician-identity verification controls
    - Mobile app + privacy policy
  - - ABHA consent posture
    - Documented at onboarding level
    - ABHA page explains consent-based health-record threading and Aadhaar OTP flow
    - No proof of downstream ABDM write-back or provider-side record governance
    - ABHA page + ABDM
  - - Refund and payment recourse
    - Documented but manual
    - Refund policy gives a patient experience escalation path and says failed-payment refunds can take 7-15 working days
    - Manual refund handling may be slow relative to healthcare urgency and offers no workflow dashboard
    - Refund policy
  - - Marketing retargeting and profiling
    - Documented and cautionary
    - Privacy policy allows retargeting, marketing notifications, and profiling for recommendations
    - Public material does not explain how health-service sensitivity is ring-fenced in these marketing practices
    - Privacy policy
  - - Post-op support and complaint resolution
    - Documented
    - Official pages promise free follow-up, 24/7 support, and personal coordinator callbacks
    - No public metrics on complaint resolution time, follow-up completion, or escalation outcomes
    - Homepage + contact + treatment page
