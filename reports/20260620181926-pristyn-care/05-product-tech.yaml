- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Pristyn Care solution
  - Measurable benefit
  - Limitation
  rows:
  - - Find the right surgeon or specialist nearby
    - Patient searches by disease, city, or specialist and may need reassurance before booking
    - City-doctor pages, near-me pages, location-aware app discovery, and coordinator outreach
    - Reduces search friction for high-intent surgery queries and routes leads into one support team
    - No public evidence on matching accuracy, wait time, or conversion by channel
  - - Book physical OPD or online consultation
    - Patient wants a quick consult before committing to treatment
    - Mobile app and store listings promote online consultation, chat, or call plus clinic appointment booking
    - Lets Pristyn capture both in-person and remote demand from the same app funnel
    - Dedicated web teleconsultation URLs are inconsistent, creating channel ambiguity
  - - Upload documents, lab requests, and treatment evidence
    - Patient needs to share tests, prescriptions, vaccination records, or progress images
    - Privacy policy confirms files, media, records viewing, lab-test uploads, and image-based progress tracking
    - Centralizes pre-op and post-op data collection inside the app flow
    - No public explanation of clinician review workflow or AI triage for uploaded images
  - - Create a digital health identity and store records
    - Patient wants a reusable health ID and accessible record history
    - ABHA creation, document storage, and consent-based record framing through Pristyn pages and app
    - Makes identity setup and record collection part of the booking journey instead of a separate government process
    - Public evidence shows onboarding, not full ABDM interoperability depth
  - - Get through surgery logistics with minimal paperwork
    - Patient needs insurance support, commute support, admission help, and follow-up
    - Coordinator-led support plus explicit insurance, EMI, free cab, and post-op services
    - Converts a stressful surgery process into a guided workflow with fewer drop-off points
    - Human mediation may be expensive and operationally brittle at scale
  - - Use symptom or wellness tools and convert into care
    - User arrives with fertility or symptom questions rather than an immediate procedure request
    - Period tracker, pregnancy tools, symptom-checker page, and consultation CTAs
    - Creates a softer top-of-funnel that can expand beyond strictly surgical keywords
    - Symptom-checker public surface does not clearly prove interactive triage sophistication
  notes: Benefits are directional workflow advantages inferred from public product surfaces, not audited outcome claims.
