- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Public evidence
  - Key dependency
  - Risk
  rows:
  - - SEO acquisition layer
    - Captures symptom, cost, city, and near-me demand before a patient speaks to a human
    - Root sitemap, page sitemap, category sitemap, and near-me sitemap
    - Search-engine visibility and content freshness
    - A core growth loop may be vulnerable to search-algorithm or quality-policy changes
  - - Discovery and routing layer
    - Turns search traffic or app visits into doctor shortlist and consultation intent
    - City-doctor pages, location permission disclosure, app-store copy, and mobile-app page
    - Correct specialty mapping, city coverage, and coordinator responsiveness
    - No public ranking logic or SLA for how quickly a lead becomes a booked consult
  - - Coordinator operations layer
    - Orchestrates non-medical tasks around the surgery journey
    - Homepage, about page, contact page, and treatment pages
    - Human staffing, internal CRM or ticketing, and partner responsiveness
    - Internal workflow software is not publicly described, so operational leverage is hard to assess
  - - App identity and engagement layer
    - Handles login, permissions, deep links, and ongoing patient touchpoints
    - Privacy policy, app-store listings, and period-tracker deep link
    - SMS OTP, device permissions, mobile release cadence, and app-store distribution
    - No public security architecture note, release changelog, or app telemetry
  - - Records and ABHA layer
    - Collects documents, exposes records viewing, and helps create ABHA identity
    - Privacy policy, ABHA page, app stores, and ABDM context
    - Aadhaar OTP flow, consent handling, and government digital-health standards
    - Public evidence proves onboarding but not longitudinal exchange with hospitals
  - - Partner care-delivery layer
    - Connects doctors, hospitals, insurance, diagnostics, commute, and follow-up into one service journey
    - About page, treatment pages, terms, and adverse reporting on operations
    - Partner hospitals, insurers, labs, logistics vendors, and care-team capacity
    - No named HIS, EMR, TPA, or API partner evidence was found in public sources
  notes: This architecture is reconstructed from public pages and disclosures because Pristyn does not publish a system diagram or integration manual.
