- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Coordinator-led surgery ops layer
    - Patients and attendants during a procedure journey
    - Mature and central
    - Dedicated care coordinators handle discovery-to-follow-up logistics instead of leaving patients to manage hospitals and paperwork alone
    - No public evidence on coordinator tooling, case load, training, or automation ratio
  - - Patient app and consultation surface
    - Patients booking consults, tests, and records tasks
    - Live across Android and iPhone
    - Combines specialist search, online consultation, records tasks, wellness tools, and surgery support in one consumer surface
    - No public retention, MAU, app-rating, or consultation conversion metrics
  - - ABHA / records module
    - Patients needing digital identity and document management
    - Live but scope-limited
    - Pristyn exposes ABHA creation plus document and record handling inside the care journey
    - No proof of partner-hospital write-back into ABDM or longitudinal record sync
  - - Doctor discovery and city roster layer
    - Patients searching by specialty, disease, city, or proximity
    - Live and extensive
    - City-doctor pages, near-me pages, and app filters support high-intent matching before consultation
    - Matching logic looks opaque; no proof of ranking quality or algorithmic triage
  - - Insurance, transport, admission, and follow-up service bundle
    - Patients undergoing procedures and their attendants
    - Live and explicit on official pages
    - Cashless or EMI help, free commute support, admission-discharge assistance, and follow-up remove non-clinical friction from surgery
    - No named insurer, TPA, or workflow-integration partners are publicly documented
  - - SEO content and symptom-intent engine
    - Prospective patients entering through search
    - Large and still updated in 2026
    - Thousands of specialty, city, near-me, and cost pages create a high-intent acquisition moat for surgery leads
    - Traffic dependence on SEO creates platform risk and content-quality exposure
  notes: Maturity reflects the depth of public evidence, not audited usage or revenue contribution.
