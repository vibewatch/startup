- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Why it matters
  - Implication
  - Diligence ask
  rows:
  - - Historical equity funding before Series E1
    - ~$177 million
    - Sets the capital base available before the owned-hospital push accelerated
    - Large historical funding does not guarantee current runway after multiple loss years
    - Provide cap table, liquidation preferences, and net cash remaining from each round
  - - Series E1 bridge round (July 2025)
    - $4 million via 34,280 Series E1 CCPS at INR 10,038.16 per share
    - Latest hard financing event and strongest sign of near-term capital need
    - Too small by itself to fund aggressive owned-hospital scale if FY24 burn remained elevated
    - Provide close-date cash balance, bridge purpose, and 12- to 18-month budget
  - - Larger ongoing raise
    - $50-100 million under discussion
    - Key next-round trigger for continuing expansion without retrenchment
    - Suggests Series E1 was a stopgap, not a completed recapitalization
    - Confirm lead investors, valuation expectations, and close conditions
  - - Owned-hospital expansion load
    - Eight hospitals / ~450 beds / ~200,000 sq ft by July 2025; 11 hospitals / 700+ beds / 300,000+ sq ft claimed by October 2025
    - Physical expansion increases fixed cost, working capital, and fit-out burden
    - Capital intensity is rising faster than disclosure quality
    - Provide capex per bed, per OT, and per hospital launch cohort
  - - Net-loss burn proxy
    - FY24 net loss of INR 381 crore implies roughly INR 31.8 crore per month before balance-sheet adjustments
    - Crude runway stress test when cash data is absent
    - A $4 million bridge alone would not offset many months of FY24 loss intensity
    - Provide monthly burn, debt service, and operating cash flow
  - - Cash, debt, and runway
    - Not publicly disclosed in retained corpus
    - Core solvency input
    - Open-source underwriting cannot conclude sufficiency
    - Provide treasury summary, debt schedule, and covenant package
  notes: Capital adequacy is inferential rather than proven because public sources disclose rounds and expansion plans, not the live balance sheet.
  enumerationScope:
    coverage: partial
    basis: 'Rows enumerate the public capital signals directly tied to financing sufficiency: historical rounds, the July 2025 bridge, expansion load, and the missing balance-sheet fields investors still need.'
