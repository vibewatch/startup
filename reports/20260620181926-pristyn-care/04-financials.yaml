tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Surgery services via partner hospitals
    - Consultation, scheduling, surgeon coordination, diagnostics support, insurance handling, and procedure execution through third-party facilities
    - Procedure / patient episode
    - Still the core line; FY23 healthcare services were INR 338 crore and FY24 services revenue was INR 332 crore
    - 'Medium: real demand, but gross-versus-net recognition remains unclear'
    - Provide net revenue policy, take-rate by surgery, and partner-hospital payout waterfall
  - - Owned-hospital inpatient and surgical services
    - Capture more facility economics inside Pristyn-operated hospitals
    - Procedure / occupied bed day / hospital episode
    - Eight owned hospitals and ~450 beds reported by July 2025; 11 hospitals and 700+ beds claimed by October 2025 promotional coverage
    - 'Low-to-medium: strategically important but hospital-level economics are undisclosed'
    - Provide occupancy, ARPOB, contribution margin, and payback by hospital cohort
  - - Medical products
    - Sale of products inside the broader patient journey
    - Product sale
    - FY24 product revenue reached INR 226.7 crore, up 112.6% YoY
    - 'Medium: visible and growing, but mix and repeatability are opaque'
    - Break out product categories, gross margin, and attach rate to surgery patients
  - - Advertising and ancillary lines
    - Residual non-core revenue referenced in FY23 reporting
    - Campaign / referral / ancillary service
    - Entrackr says the non-service remainder included medical products and advertising services
    - 'Low: likely non-core and hard to annualize'
    - Disclose whether advertising is material, recurring, or tied to one-off campaigns
  - - Insurance-enabled patient conversion
    - Cashless and EMI support used to improve patient conversion rather than billed as a standalone line
    - Approval / financed procedure
    - Official site markets cashless surgery on 100+ insurers with fast approvals, but no direct revenue line is disclosed
    - 'Low: conversion lever, not a clearly disclosed revenue stream'
    - Show payor mix, denial rates, and whether payors change realized ASP or cash cycle
  notes: Public revenue is a blended top line; none of the retained sources disclose a clean stream-by-stream gross-margin bridge.
