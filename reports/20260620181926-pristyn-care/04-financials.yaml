- id: TI006
  title: Conflict and preferred-anchor register
  columns:
  - Metric
  - Figure A
  - Figure B
  - Conflict source set
  - Preferred anchor / rationale
  rows:
  - - Series E size (Dec 2021)
    - $84.7-85M first allotment
    - $96M completed round
    - Entrackr filing view vs Inc42 updated round-close view
    - Use $96M for cumulative funding and valuation history; keep $84.7M for initial CCPS mechanics
  - - Total funding after Series E1
    - $177M pre-E1
    - ~$180-181M post-E1
    - Inc42 pre-E1 reporting vs CXO Digitalpulse / Digital Health News post-E1 reporting
    - Use ~$181M post-E1; reject any unsupported “$200M+” shorthand
  - - FY24 operating revenue
    - INR 600.5 crore
    - INR 600-601 crore rounded
    - Inc42 precision vs CXO/Digital Health/Inc42 roundup
    - Use INR 600.5 crore as the precise retained anchor; treat 600 or 601 as rounding
  - - Current owned-hospital footprint
    - Eight hospitals / 450 beds / 200,000 sq ft by July 2025
    - 11 hospitals / 700+ beds / 300,000+ sq ft by October 2025
    - Series E1 coverage vs October 2025 promotional expansion coverage
    - Treat July 2025 figures as the cleaner financing-date anchor and October 2025 as a later promotional update
  - - Network footprint wording
    - 700 hospitals / 200 clinics / 30-40 cities in older coverage
    - 800+ partner hospitals / 150+ clinics / 45+ cities on current homepage
    - Older fundraising and layoff coverage vs refreshed official homepage
    - Use the current homepage for current footprint and retain older figures only as historical snapshots
  notes: Conflicts are preserved instead of normalized away because several figures changed over time or were rounded differently by different outlets.
  enumerationScope:
    coverage: sample
    basis: 'Rows capture the material conflicts that affect financial interpretation in this chapter: round size, cumulative funding, revenue anchoring, and footprint changes across reporting dates.'
