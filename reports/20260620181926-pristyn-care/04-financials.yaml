  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, debt outstanding, operating cash flow, and monthly burn/runway bridge.
    whyItMatters: Without a treasury view, the chapter cannot tell whether Series E1 meaningfully extended runway or merely prevented an immediate financing crunch.
    diligencePath: Request latest management accounts, treasury dashboard, debt schedule, and 18-month cash forecast from finance.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: owned-hospital-capex
    missingEvidence: Capex per hospital, per bed, and per OT plus launch-cohort payback assumptions.
    whyItMatters: The investment thesis for the owned-hospital pivot depends on capital efficiency and payback speed, neither of which is public.
    diligencePath: Obtain hospital launch budget templates, fixed-asset additions by site, and monthly P&L for the first five owned hospitals.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI003
    - TI004
  - type: missing-source
    severity: material
    topic: fy25-actuals
    missingEvidence: FY25 audited financial statements or reliable filing-based coverage showing revenue, EBITDA, and net loss outcomes against management targets.
    whyItMatters: The company publicly targeted FY25 profitability, but the retained corpus does not show whether that target was met, missed, or redefined.
    diligencePath: Pull FY25 MCA filings or management accounts and reconcile them to the March 2024 profitability plan.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI005
  - type: access-blocked
    severity: material
    topic: revenue-recognition
    missingEvidence: Underlying accounting-policy detail and any paywalled adverse reporting about whether reported revenue is gross or net of hospital payouts.
    whyItMatters: Revenue-quality risk can materially change gross margin, scale interpretation, and valuation multiples.
    diligencePath: Review audited revenue-recognition note, pull a sample surgery ledger, and obtain the full Morning Context reporting or equivalent expert accounting diligence.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: group-consolidation
    missingEvidence: Consolidated Pristyn-plus-Beatxp statements and intercompany eliminations.
    whyItMatters: If group cash needs are materially higher than core surgery-business needs, stand-alone Pristyn economics could understate capital risk.
    diligencePath: Request full group consolidation package, subsidiary schedules, and board materials describing Beatxp funding strategy.
    relatedQuestionRefs:
    - QI015
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
