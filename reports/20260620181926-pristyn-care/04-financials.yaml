    - 74% FY25 occupancy; ARPOB INR 73,900 overall and INR 81,400 excluding newer facilities; PBILDT margin ~25.8%
    - high
    - Shows what mature hospital disclosure and operating leverage look like in a listed peer
    - Benchmark Pristyn owned hospitals against similar occupancy and ARPOB disclosures
  - - Narayana Health utilization proxy
    - Occupancy held around 60-65% while ARPOB rose 11% in FY25
    - high
    - Shows the minimum operating disclosure investors expect from scaled hospital networks
    - Disclose Pristyn hospital occupancy, payor mix, and ARPOB by cohort
