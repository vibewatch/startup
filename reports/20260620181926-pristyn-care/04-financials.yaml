- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - FY25 actual revenue, EBITDA, and net loss
    - Cannot tell whether the FY25 profitability target was hit or simply deferred
    - Obtain FY25 audited financials or MCA filing pack and reconcile to media-reported targets
  - - Cash balance, debt, and runway
    - Cannot judge whether Series E1 bought quarters of runway or just weeks
    - Request treasury report, bank balances, debt schedule, and 18-month cash forecast
  - - Per-hospital capex and payback
    - Cannot underwrite owned-hospital rollout economics or validate the eight-week profitability claim
    - Request launch-budget template, capex by site, and cohort-level payback model
  - - Gross-versus-net revenue recognition
    - Cannot evaluate whether reported revenue reflects retained economics or gross billings
    - Request accounting policy note plus surgery-level sample ledger from patient billing through hospital payout
  - - Group consolidation with Beatxp and other entities
    - Cannot tell whether group cash needs exceed core surgery-business needs
    - Request consolidated financial statements and intercompany elimination schedule
  notes: These gaps, not the absence of growth, are the main reason the chapter stops short of a positive underwriting call.
  enumerationScope:
    coverage: partial
    basis: Rows focus on the highest-leverage missing items that would change an investment decision; they are prioritized blockers rather than every conceivable diligence question.
