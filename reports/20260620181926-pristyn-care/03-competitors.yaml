  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: apollo247-feature-verification
      missingEvidence: A directly accessible Apollo 24|7 feature set showing whether it now offers surgery-specific navigation, insurer handling, or post-op workflows.
      whyItMatters: Apollo is the most credible incumbent with both hospital infrastructure and a digital front door, so missing feature visibility limits threat sizing.
      diligencePath: Re-fetch Apollo 24|7 through a browser-authenticated or manually reviewed session and compare workflow stages one by one.
      relatedQuestionRefs: [QP014]
    - type: private-evidence-only
      severity: material
      topic: clinical-outcomes-comparison
      missingEvidence: Procedure-level outcomes, complication rates, and readmission data for Pristyn versus Apollo, Fortis, Medanta, and HCG.
      whyItMatters: Coordination alone is not a moat if clinical outcomes are not equal to or better than incumbent hospitals for the same elective procedures.
      diligencePath: Request audited quality dashboards or accreditation-linked clinical metrics by specialty and city.
      relatedQuestionRefs: [QP023]
    - type: missing-source
      severity: material
      topic: coordinator-incentives-and-over-indication
      missingEvidence: Public documentation on coordinator compensation, surgeon utilization targets, and safeguards against unnecessary elective procedures.
      whyItMatters: If conversion incentives are misaligned, Pristyn's strongest commercial engine could also become its largest reputational and regulatory risk.
      diligencePath: Ask for sales-compensation design, clinical-governance policy, and complaint-escalation protocols; supplement with patient-forum and court-record review.
      relatedQuestionRefs: [QP024]
    - type: access-blocked
      severity: minor
      topic: skeptical-journalism-depth
      missingEvidence: Full text of The Morning Context critique and any named factual allegations or documented patient harm claims.
      whyItMatters: The existence of skeptical coverage is clear, but the substance determines whether this is a reputational warning or a deeper diligence blocker.
      diligencePath: Obtain subscription access or secondary reporting that quotes the article's core allegations.
      relatedQuestionRefs: [QP021, QP024]
    - type: missing-source
      severity: material
      topic: procedure-pricing-comparison
      missingEvidence: Like-for-like elective surgery package pricing across Pristyn, Apollo, Fortis, Medanta, and HCG by city and procedure.
      whyItMatters: Pricing and contribution margin determine whether Pristyn's coordinator-heavy model is economically superior or merely more convenient.
      diligencePath: Secret-shop a small set of high-volume procedures such as piles, hernia, and gallstone surgery across shared geographies.
      relatedQuestionRefs: [QP019]
