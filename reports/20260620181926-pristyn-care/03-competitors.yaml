  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat or counter-force
      - Severity
      - Mitigation or diligence ask
    rows:
      - - Coordinator-led, end-to-end surgery workflow is hard to replicate quickly
        - Large incumbents already own hospital supply and could add concierge layers if they prioritize elective secondary-care growth
        - High
        - Test whether Pristyn's technology stack or insurer integrations create real switching costs beyond operational playbooks
      - - Exclusive surgeon network creates quality and conversion consistency
        - Exclusive specialists are expensive to recruit and retain; 2024-2025 layoffs and cost discipline reporting imply pressure on labor-heavy operations
        - High
        - Request surgeon attrition, compensation mix, and city-level utilization by specialty
      - - Partner-hospital model stays asset-light while scaling geographic footprint
        - Partner hospitals can multi-home with other aggregators or strengthen direct patient acquisition, reducing Pristyn's negotiating power
        - High
        - Review top partner concentration, exclusivity terms, and hospital churn by city
      - - Digital SEO and symptom-led funnel lowers acquisition friction
        - Practo, Apollo 24|7, and other digital-health apps can own upstream patient discovery and redirect traffic away from Pristyn
        - Medium
        - Quantify paid versus organic lead mix, conversion rates, and dependency on search rankings
      - - Cashless and EMI support improves elective-surgery conversion
        - Hospitals and payer networks can internalize insurance navigation; if that becomes table stakes, Pristyn's service premium narrows
        - Medium
        - Compare approval turnaround and denial rates versus direct hospital channels
      - - Strong growth and unicorn funding validate demand
        - Adverse reporting on layoffs, exits, fundraising strain, and skeptical journalism suggests the model may still be operationally fragile
        - High
        - Obtain audited FY24-FY26 metrics, city profitability bridge, and complaint or readmission data before treating profitability as durable
    notes: Severity reflects investor relevance, not certainty of occurrence. Each row summarizes public evidence plus the main diligence work needed before calling the moat durable.
