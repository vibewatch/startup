  - id: incumbent-hospital-chains-cover-more-acuity-but-own-less-of-the-patient-journey
    title: Apollo, Fortis, Medanta, and HCG are larger care-delivery systems, but they solve a different workflow
    body: >-
      The strongest incumbent comparators are listed hospital networks, but their competitive posture is different from Pristyn's. Apollo's official annual-reports page confirms a full public-company disclosure apparatus and its facilities page lists a broad multi-city hospital footprint across metro and tier-1 locations, which is the opposite of Pristyn's asset-light partner-capacity model. Fortis states that it runs 36 healthcare facilities across 12 states with more than 6,000 operational beds and 400 diagnostics labs, while Medanta describes a doctor-led network in which superspecialist doctors work full-time and exclusively across its hospitals and the site highlights six-plus hospitals in India plus substantial international-patient flow. HCG Hospitals likewise positions itself as a multispecialty and tertiary-care operator with 1,30,000-plus patients treated per year, 575-plus doctors, and 24 comprehensive care units. These operators therefore beat Pristyn on owned infrastructure, tertiary-care breadth, and public disclosure, but the retained official evidence does not show them offering the same end-to-end elective-surgery coordination layer that Pristyn markets so aggressively. Said differently, Apollo, Fortis, Medanta, and HCG are more formidable institutions than Pristyn, yet they are not documented here as offering Pristyn's exact productized workflow of digital lead capture, coordinator-led conversion, partner-hospital execution, and standardized post-op navigation for secondary-care procedures.
