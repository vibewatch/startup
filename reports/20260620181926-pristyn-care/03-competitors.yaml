callouts:
  - calloutType: insight
    title: Why Pristyn is not just “another hospital startup”
    body: Pristyn's actual competitor set cuts across categories because the company packages a workflow, not merely a clinical location. Its strongest evidence-backed difference is that it inserts software, coordinators, insurer handling, and logistics between patient demand and partner-hospital supply.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP010
      - CP037
  - calloutType: risk
    title: The moat can narrow if operational strain weakens conversion quality
    body: Public reporting on layoffs, city exits, senior departures, and financing pressure suggests Pristyn's labor- and coordination-intensive model may be harder to sustain than its top-line differentiation story implies. That matters because patient trust can erode quickly if the coordinator layer becomes understaffed or overly sales-driven.
    claimRefs:
      - CP023
      - CP030
      - CP039
      - CP040
