    rows:
      - - Pristyn Care
        - Tech-assisted surgical coordinator using partner hospitals
        - 150+ clinics, 800+ partner hospitals, 400+ exclusive super-specialist surgeons, 2M+ patients, 45+ cities
        - Elective and secondary-care surgery from discovery through follow-up
        - Owns more of the patient journey than either hospital chains or booking apps
        - Lower owned infrastructure and thinner public governance disclosure than listed hospital groups
      - - Apollo Hospitals
        - Listed hospital chain and ecosystem incumbent
        - Public annual-reports archive plus large multi-city hospital list on official site
        - Broad inpatient and outpatient care across owned facilities
        - Much stronger owned infrastructure, brand trust, and disclosure discipline
        - Retained sources do not show the same productized surgery-coordinator workflow Pristyn markets
      - - Fortis Healthcare
        - Listed integrated healthcare delivery platform
        - 36 facilities across 12 states, 6,000+ beds, 400 diagnostics labs
        - Hospitals, diagnostics, day care, tertiary and quaternary care
        - Bed capacity, diagnostics network, and listed-company transparency exceed Pristyn
        - Official materials do not evidence Pristyn-like end-to-end elective-surgery concierge
      - - Medanta
        - Doctor-led superspecialty hospital network
        - 06+ hospitals in India, 20,000+ international patients per year, doctors work full-time and exclusively
        - High-acuity multispecialty and tertiary care
        - Clinical depth and exclusive-doctor model make it the closest institutional analogue on quality signaling
        - Network remains asset-heavy and metro-oriented rather than partner-capacity and coordinator-led
      - - HCG Hospitals
        - Multispecialty and tertiary-care hospital chain
        - 1,30,000+ patients treated yearly, 575+ doctors, 24 comprehensive care units
        - Tertiary care and complex hospital services
        - Strong specialist infrastructure and home-health adjacency
        - Category focus is broader and more hospital-centric than Pristyn's elective-surgery navigation model
      - - Practo
        - Discovery, teleconsultation, and referral marketplace
        - 200,000+ doctors across 70,000+ clinics and hospitals; 20+ specialties; 9,000+ hospital or clinic bookings on about page
        - Search, booking, teleconsultation, and provider routing
        - Massive multi-homing demand funnel across leading Indian hospital brands
        - Retained sources do not show employed surgeons, hospital-capacity control, or day-of-surgery logistics
      - - MediBuddy
        - Horizontal digital-health and benefits platform
        - Public surface emphasizes health checks, lab tests, medicine ordering, and doctor consultation
        - Employee or consumer wellness, diagnostics, and general digital-health tasks
        - Broad digital-health adjacency and possible employer referral channel
        - No retained source shows surgery-first positioning or Pristyn-level care coordination
      - - Apollo 24|7
        - Incumbent digital front door inside Apollo ecosystem
        - Official site exists but product detail was blocked at fetch time by 403
        - Digital navigation and telehealth
        - Potential bridge between Apollo's hospital base and digital patient acquisition
        - Current feature-by-feature comparison remains partially unverified because the site blocked inspection
    notes: Public scale is limited to what retained official or news sources explicitly expose as of 2026-06-20; “limitation” means limitation relative to Pristyn's surgery-coordination workflow, not weakness as a standalone business.
