  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Competitor
      - Public commercial surface
      - What is packaged in the offer
      - Public pricing visibility
      - Competitive implication
    rows:
      - - Pristyn Care
        - Free consultation plus surgery navigation with cashless and EMI support
        - Consultation, diagnostics routing, insurance help, logistics, surgery coordination, follow-up
        - Exact procedure pricing is not standardized publicly, but packaging elements are explicit
        - Converts a fragmented hospital purchase into a managed service, which can justify premium conversion economics even without transparent list pricing
      - - Apollo Hospitals
        - Hospital brand and facility network
        - Inpatient and outpatient care inside owned facilities
        - Procedure pricing not centrally disclosed in retained sources
        - Competes on trust and breadth, but less on standardized elective-surgery packaging
      - - Fortis Healthcare
        - Integrated hospitals, diagnostics, and day care
        - Facility-led care bundle by specialty and location
        - Procedure pricing not publicly consolidated here
        - Better infrastructure and diagnostics breadth, weaker evidence of patient-navigation packaging
      - - Medanta
        - Doctor-led superspecialty hospital system
        - High-acuity institutional care and specialist reputation
        - Pricing not publicly consolidated here
        - Strong quality signal for complex care, weaker evidence of high-volume concierge packaging
      - - Practo
        - Booking, teleconsultation, and subscription-oriented digital health access
        - Discovery, consultations, referrals, and some surgery-center discovery
        - Pricing is mostly consultation or plan based rather than procedure based in retained sources
        - Can intercept top-of-funnel traffic without solving the surgery workflow end to end
      - - MediBuddy
        - Health checks, medicines, labs, and consultation access
        - Horizontal digital-health access; likely employee or family health workflows
        - No surgery-package pricing visible in retained public surface
        - More adjacency and referral risk than direct surgical-package substitution
      - - Apollo 24|7
        - Digital health front door inside incumbent ecosystem
        - Product specifics not inspectable at fetch time
        - Unknown
        - Potentially important if Apollo unifies digital demand with hospital execution, but current public evidence here is incomplete
    notes: This is a pricing and packaging disclosure table, not a unit-economics table. For most incumbents the retained official surfaces did not disclose standardized elective-surgery prices, which is itself relevant to how Pristyn productizes the workflow.
