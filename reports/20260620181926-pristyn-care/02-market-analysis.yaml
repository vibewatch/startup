- id: constraints-and-evidence-gaps
  title: Adoption Constraints, Reimbursement Friction, and Evidence Gaps
  body: 'The strongest constraints on Pristyn''s model are economic and informational, not conceptual. Private-care demand
    exists, but India still places a large financing burden on households, and formal private care remains far more expensive
    than public provision in the limited studies available. PM-JAY expands access but also exposes the tariff gap: private-hospital
    executives publicly argue that package rates do not cover the cost of high-quality care, and the accessible public corpus
    still does not make current procedure-by-procedure tariff comparisons easy to verify. Geography is a second constraint.
    Private elective-surgery capacity is concentrated in metros and denser urban corridors, which helps Pristyn in the cities
    where it already operates but limits how far the model can stretch without disciplined partner quality control. Finally,
    precise market sizing remains an evidence problem. Official NHA and HMIS datasets do not publish a national elective-surgery
    SAM by procedure, accessible insurance archives do not neatly split the relevant payer cohorts, and Pristyn''s own payer
    mix or revenue per surgery remains private. Even the company''s 2024 layoffs and city exits suggest that execution discipline
    matters as much as secular demand. The market is therefore attractive, but still better modelled as a constrained, evidence-gapped
    opportunity than as a frictionless national TAM.'
