  claims:
  - id: CM001
    statement: Pristyn's relevant market is not all of healthcare but planned secondary and tertiary surgeries delivered through
      private hospitals, day-care centres, and partner-surgeon networks.
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM001
    - SM017
    - SM024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM001
    - QM002
  - id: CM002
    statement: IBEF describes Indian healthcare as a broad sector comprising hospitals, medical devices, clinical trials,
      outsourcing, telemedicine, medical tourism, health insurance, and medical equipment.
    type: third-party-reported
    topic: market-boundary
    sourceRefs:
    - SM001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM002
  - id: CM003
    statement: IBEF values Indian healthcare at ₹31,87,668 crore (US$372 billion) in 2023 and projects ₹54,67,022 crore (US$638
      billion) by 2025.
    type: third-party-reported
    topic: market-sizing
    sourceRefs:
    - SM001
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM003
  - id: CM004
    statement: IBEF says hospitals account for nearly 80% of the overall healthcare market, making hospital-delivered care
      the most relevant macro sub-bucket for Pristyn.
    type: third-party-reported
    topic: hospital-share
    sourceRefs:
    - SM001
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM004
  - id: CM005
    statement: The IBEF headline is materially wider than a Pristyn-relevant elective surgery SAM because it bundles insurance,
      devices, telemedicine, tourism, and other non-surgical categories into one sector figure.
