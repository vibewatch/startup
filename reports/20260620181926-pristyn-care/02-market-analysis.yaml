- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - User
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  rows:
  - - Urban salaried / privately insured households
    - Patient plus family attendant
    - Employer plan, retail insurance, or family budget top-up
    - Cashless approval, specialist referral, scheduled partner-hospital procedure
    - Need to reduce search, paperwork, and time off work
  - - Mass-affluent self-pay households
    - Patient plus family decision unit
    - Household savings, card spend, or EMI financing
    - Diagnosis, cost comparison, financing decision, surgery scheduling
    - Desire for faster treatment and cleaner peri-operative experience
  - - PM-JAY-eligible households
    - Patient and local family sponsor
    - Public scheme if partner hospital accepts tariff economics
    - Eligibility verification, package fit, empanelled-hospital navigation
    - Affordable access to secondary or tertiary surgery without catastrophic cash payment
  - - Taboo-sensitive specialties
    - Patient is user but family influence is high
    - Mostly self-pay or insurance where covered
    - Digital search, discreet consultation, surgery and follow-up coordination
    - Privacy, pain relief, and reduced stigma matter as much as clinical indication
  - - Referring clinicians and surgeons
    - Doctor is not the payer but shapes conversion
    - Indirect via patient payer route
    - Diagnosis, recommendation, partner-hospital routing, surgery completion
    - Confidence in partner-hospital quality, care coordination, and claim handling
  notes: The same case can involve a patient-user, a family economic buyer, a surgeon recommender, and either a private, public,
    or self-pay funding path; Pristyn's workflow exists to reduce friction across that stack.
