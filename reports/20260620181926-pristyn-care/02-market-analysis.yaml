- id: TM002
  title: TAM / SAM / sizing lens table
  columns:
  - Lens
  - Publisher / basis
  - Value / status
  - Methodology
  - Confidence / limitation
  rows:
  - - Broad healthcare economy
    - IBEF
    - ₹31,87,668 crore in 2023; ₹54,67,022 crore 2025E
    - Sector-wide industry framing spanning hospitals, insurance, devices, tourism, and more
    - Medium; useful headline, but too broad for Pristyn SAM
  - - Official health-financing lens
    - PIB + NHA + Frontiers review
    - OOPE 47.1% of THE; GHE 41.4% of THE; FY 2021-22 THE cited at ₹9,04,461 crore
    - Measures financed care and household burden rather than commercial market value
    - High for financing mix; not a procedure TAM
  - - PM-JAY throughput lens
    - PIB 2024 + The Hindu 2025
    - 8.39 crore admissions / ₹1.16 lakh crore by Nov 2024; 9.19 crore / ₹1,29,386 crore by Mar 2025
    - Government-funded hospital utilization and claims value across all covered packages
    - Medium; volume is real but not elective-only
  - - National surgery backlog lens
    - India-wide HMIS study
    - 1,385.28 surgeries per 100,000; 49 million unmet procedures in 2019
    - Population-level surgical rate benchmarked against 5,000 surgeries per 100,000 target
    - Medium; includes non-elective surgery and undercounts private granularity
  - - Pristyn-relevant elective SAM
    - Author synthesis from official and operator proxies
    - Not publicly pinned; low-confidence heuristic only
    - Constrained slice of private planned surgery, cashless insurance, PM-JAY-eligible procedures, and EMI-assisted self-pay
    - Low; public sources do not publish a single India elective-surgery SAM table
  notes: This table preserves the contradiction between broad sector headlines and narrower financing or utilization lenses
    instead of forcing one false-precision TAM number.
