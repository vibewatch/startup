- id: buyers-users-and-payers
  title: Buyers, Users, and Payers in Elective Surgery
  body: 'The buyer map for Pristyn is fundamentally different from enterprise healthcare IT or hospital-equipment sales because
    the user, economic buyer, and reimbursement gatekeeper often differ within the same case. The patient is the user, but
    the real decision unit often includes a family member, the referring clinician, the surgeon, and whichever payer rail
    is available. For affluent or salaried urban households that means private insurance, cashless approvals, or employer-sponsored
    cover; for lower-income households it can mean PM-JAY eligibility; and for many patients it still means self-pay supplemented
    by instalment financing. Pristyn''s own description of the business reinforces this structure: the company is not just
    matching a patient to a doctor, it is coordinating diagnostics, insurance paperwork, hospital commute, admission, discharge,
    and follow-up. That orchestration matters because India''s financing mix remains messy. Official data still shows nearly
    half of total health expenditure coming from households directly, and even accessible insurance archives do not give a
    simple public table of employer-group versus retail versus government-scheme elective surgery lives. In practical terms,
    Pristyn wins when it reduces friction across multiple payer types rather than when it relies on one reimbursement channel
    alone.'
  claimRefs:
