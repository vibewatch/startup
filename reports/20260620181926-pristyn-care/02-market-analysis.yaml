callouts:
- calloutType: insight
  title: The real boundary is a coordinated elective-care workflow
  body: Pristyn is not selling the whole hospital stack. It is monetizing the coordination layer that turns a clinically indicated
    planned surgery into a completed case across diagnosis, hospital routing, payer approval, admission, discharge, and follow-up.
  claimRefs:
  - CM001
  - CM016
  - CM017
  - CM040
- calloutType: risk
  title: The market is large, but reimbursement and data quality still distort it
  body: The strongest public evidence for scale sits in broad healthcare headlines, PM-JAY throughput, and surgery backlog
    studies rather than in one clean elective-surgery market table. Tariff stress, household cash burden, and missing procedure-level
    public data all make precise TAM claims fragile.
  claimRefs:
  - CM005
  - CM013
  - CM015
  - CM031
  - CM035
