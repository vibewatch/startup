company:
  name: Pristyn Care
chapter:
  number: 2
  title: Market Analysis
  summary: 'Pristyn Care sits inside a large but poorly bounded Indian private-care opportunity: broad sector headlines and
    official health-financing accounts diverge sharply, while the serviceable slice is better understood as planned, short-stay,
    insurance-assisted or self-pay surgery delivered through private hospital networks. Demand is supported by rising insurance
    premiums, PM-JAY expansion, tier-2 and tier-3 healthcare growth, and documented surgical backlogs, but adoption is constrained
    by still-heavy out-of-pocket spending, weak public procedure-level data, uneven geography, and reimbursement rates that
    many private hospitals say remain below cost.'
sections:
- id: market-boundary-and-sizing-lenses
  title: Market Boundary and Contradictory Sizing Lenses
  body: Pristyn Care should be analysed against a narrower market than India's full healthcare economy. IBEF's sector page
    is useful as a macro sentiment indicator because it frames healthcare as one of India's largest industries and puts hospitals
    at nearly 80% of the sector, but that same page also rolls together hospitals, insurance, devices, telemedicine, tourism,
    and other categories that do not map cleanly to Pristyn's workflow. For valuation or adoption work, the more relevant
    boundary is planned secondary and tertiary surgery delivered through private hospitals, day-care centres, and partner-surgeon
    networks, especially where patients can move through diagnosis, cashless approval, or EMI-assisted self-pay without a
    prolonged inpatient stay. Official NHA and HMIS evidence makes the contradiction explicit rather than incidental. India
    still spends heavily out of pocket, the official data series does not publish a national elective-surgery market table
    by procedure, and the country's measured surgical rate remains far below global-surgery adequacy thresholds. The right
    conclusion is not that the market is small; it is that public evidence supports multiple constrained sizing lenses rather
    than one clean TAM headline. Investors should preserve the gap between IBEF's promotional macro number, official health-financing
    accounts, and the still-unpinned elective surgery slice that matters most for Pristyn.
