- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Tier-2 and tier-3 healthcare demand growth
    - Positive
    - Current to medium term
    - Supports city expansion beyond metros for planned procedures
    - Which of Pristyn's non-metro cities have enough insurer and surgeon density?
  - - Health-insurance premium growth
    - Positive
    - Current
    - More reimbursed private-care capacity over time, especially for salaried and retail-covered patients
    - What share of Pristyn cases are cashless versus self-pay?
  - - PM-JAY coverage expansion to 70+ citizens
    - Positive for volume, mixed for margins
    - Current
    - Expands publicly financed surgical demand, especially for cataract and age-linked procedures
    - Which specialties remain economically viable at PM-JAY package rates?
  - - Short-stay / minimally invasive surgery formats
    - Positive
    - Current
    - Helps convert planned procedures into day-care or shorter-stay workflows
    - How often can partner hospitals deliver same-day or next-day discharge by specialty?
  - - High out-of-pocket burden and medicine spend
    - Negative
    - Persistent
    - Households still face affordability shocks even when some hospital cost is reimbursed
    - How much of patient drop-off happens before surgery scheduling because of cost?
  - - Low PM-JAY reimbursement economics for private hospitals
    - Negative
    - Persistent until tariff resets
    - Can suppress private participation or push providers toward only selected packages
    - What is the real private-hospital acceptance rate for Pristyn-relevant packages by city?
  - - Weak public procedure-level data
    - Negative
    - Persistent
    - Creates TAM ambiguity and makes city or specialty prioritization more model-driven than reported-data-driven
    - Can management provide surgery counts, payer mix, and revenue by specialty cohort?
  notes: Rows mix demand accelerants with unit-economics and data constraints because Pristyn's market is governed as much
    by reimbursement and information quality as by underlying clinical need.
