  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Fully diluted cap table, liquidation preferences, anti-dilution clauses, and any investor protections tied to Series E and Series E1.
    whyItMatters: A preserved unicorn headline does not by itself reveal whether new money would actually sit behind unattractive economics.
    diligencePath: Request the cap table model, signed term sheets, and shareholder-rights summary from finance and counsel.
    relatedQuestionRefs:
    - QV013
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: treasury-runway
    missingEvidence: Cash balance, debt schedule, monthly burn, and forward treasury forecast after the Series E1 bridge.
    whyItMatters: Without runway data the bridge cannot be distinguished from a temporary patch.
    diligencePath: Pull the latest management accounts, treasury dashboard, and board cash-forecast materials.
    relatedQuestionRefs:
    - QV014
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: hospital-cohort-economics
    missingEvidence: Occupancy, ARPOB, payor mix, contribution margin, and payback by owned-hospital cohort.
    whyItMatters: This is the main missing variable separating a premium hospital-asset thesis from a capital-intensive execution risk.
    diligencePath: Request monthly site-level dashboards and cohort P&Ls for every owned hospital.
    relatedQuestionRefs:
    - QV015
    relatedTableRefs:
    - TV002
    - TV006
  - type: access-blocked
    severity: material
    topic: adverse-quality-narrative
    missingEvidence: Full text and any documentary support behind the medical-negligence allegations in The Morning Context.
    whyItMatters: Adverse quality claims can influence brand durability, regulator posture, and valuation discount rates.
    diligencePath: Obtain the full article, complaint details, and management's written rebuttal or remediation record.
    relatedQuestionRefs:
    - QV016
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: larger-round-closing-terms
    missingEvidence: Final terms, lead investor, and actual close status of the larger raise referenced in 2025 bridge-round coverage.
    whyItMatters: The next real price-discovery event is the cleanest public catalyst for validating or breaking the preserved unicorn mark.
    diligencePath: Pull the closing announcement or regulatory filing for the larger raise as soon as it exists.
    relatedQuestionRefs:
    - QV005
    - QV030
    relatedTableRefs:
    - TV003
    - TV006
  - type: conflicting-data
    severity: material
    topic: comparable-denominator-mismatch
    missingEvidence: Clean numerator-and-denominator alignment for private-healthtech comparable rows, especially where valuation timing and statutory revenue timing do not match.
    whyItMatters: Comparable table TV004 is analytically useful only as a rough range because several private comps lack same-period valuation and revenue disclosure.
    diligencePath: For every retained private comparable, pair valuation with same-period audited or filing-based revenue before relying on a single-point multiple.
    relatedQuestionRefs:
    - QV026
    - QV027
    - QV029
    relatedTableRefs:
    - TV004
