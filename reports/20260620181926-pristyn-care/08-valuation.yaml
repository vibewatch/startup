    basis: Rows cover the public hospital chains and private healthtech references with the best retained open-source valuation or revenue anchors as of 2026-06-20.
  notes: All public multiples are inferred equity-value-to-revenue ratios from fetched Screener quote pages, not enterprise-value multiples. Private rows are even less precise and are retained mainly to show where denominator and disclosure quality break down.
