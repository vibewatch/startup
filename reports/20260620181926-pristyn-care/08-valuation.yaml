- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument type
  - Argument
  - What would change the view
  rows:
  - - Thesis
    - A hybrid surgery coordinator plus owned-hospital rollout can justify a premium multiple if it captures more of the procedure wallet than digital-health peers.
    - Audited hospital-cohort data showing occupancy, ARPOB, payor mix, and contribution margin would strengthen this materially.
  - - Thesis
    - Flat 2025 bridge pricing suggests insiders still defend the unicorn mark rather than accepting a visible down-round.
    - A larger round led by new investors at or above the same price would convert insider support into broader validation.
  - - Thesis
    - Rapid hospital expansion and a company-claimed two-month first-hospital payback create a plausible forward-upside path.
    - Replicated proof across multiple hospitals, not just one, would make the premium easier to underwrite.
  - - Anti-thesis
    - The $4 million E1 raise is too small relative to the loss base and looks like bridge capital rather than full valuation validation.
    - If the larger round closes quickly on strong terms, this concern softens.
  - - Anti-thesis
    - Public sources still hide cap-table economics, cash runway, and hospital-level unit economics, making the entry price hard to defend.
    - Disclosure of audited FY25/FY26 numbers plus liquidation preferences would directly address this.
  - - Anti-thesis
    - Adverse medical-negligence and layoffs/GST narratives increase the burden of proof on governance and care quality.
    - A cleaner public legal / regulatory record and independently validated care-quality data would reduce this discount.
  notes: The investment case is not whether Pristyn is growing; it is whether growth quality and disclosure quality justify paying a unicorn price today.
