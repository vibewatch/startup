- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Larger round terms
    - Lead investor, round size, post-money, liquidation preferences, anti-dilution terms, and secondary participation
    - The bridge preserved price but not enough economics to underwrite the mark
    - Request term sheet set from management and lead investor counsel
  - - Audited FY25 and FY26 revenue quality
    - Statutory audited revenue, gross vs net recognition, and surgery-business versus product / other mix
    - The multiple only makes sense if the denominator is robust and recurring enough
    - Pull audited statements and revenue-recognition note
  - - Cash runway and debt
    - Cash balance, monthly burn, debt schedule, covenant burden, and 18-month treasury forecast
    - Needed to judge whether the bridge merely delayed a harder financing problem
    - Obtain treasury dashboard and latest management accounts
  - - Hospital cohort economics
    - Occupancy, ARPOB, payor mix, case mix, contribution margin, and payback by owned-hospital cohort
    - This is the core missing proof for a premium hospital-asset narrative
    - Request cohort P&Ls and operating dashboards for all owned hospitals
  - - Cap table and preference stack
    - Fully diluted ownership, ESOP overhang, liquidation waterfall, and investor rights
    - A unicorn headline can still hide unattractive entry economics
    - Review cap table model with legal counsel and finance
  - - Quality / compliance record
    - Complaint log, litigation / claim status, GST / insurance correspondence, and hospital accreditation / audit trail
    - Adverse narratives deserve direct rebuttal or confirmation before underwriting a premium mark
    - Run legal, medical-quality, and regulatory diligence in parallel
  notes: None of these asks are optional if the investor intends to rely on the preserved unicorn mark rather than a discounted reset.
