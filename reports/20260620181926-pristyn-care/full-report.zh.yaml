  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁或反向力量
      - 严重性
      - 缓释措施或尽调问题
    rows:
      - - 协调方主导的端到端手术工作流很难快速复制
        - 大型既有玩家已经掌握医院供给；如果把择期二级医疗增长列为优先级，它们可以加上礼宾层
        - 高
        - 测试 Pristyn 的技术栈或保险公司集成，是否在运营手册之外创造了真实切换成本
      - - 独家外科医生网络带来质量和转化一致性
        - 独家专科医生招募和留存成本高；2024-2025 年裁员和成本纪律报道意味着重人力运营承压
        - 高
        - 要求提供外科医生流失率、薪酬结构，以及按城市和专科划分的利用率
      - - 合作医院模式在扩大地理覆盖时保持轻资产
        - 合作医院可以同时接入其他聚合方，或加强直接获客，从而削弱 Pristyn 的议价能力
        - 高
        - 审查头部合作医院集中度、排他条款和按城市划分的医院流失
      - - 数字 SEO 和症状驱动漏斗降低获客摩擦
        - Practo、Apollo 24|7 及其他数字健康 App 可能掌握上游患者发现，并把流量从 Pristyn 引走
        - 中
        - 量化付费与自然线索结构、转化率，以及对搜索排名的依赖
      - - 免现金和 EMI 支持提高择期手术转化
        - 医院和付款方网络可以内化保险导航；一旦成为基本配置，Pristyn 的服务溢价会收窄
        - 中
        - 比较审批周转和拒赔率，相对直接医院渠道的差异
      - - 强增长和独角兽融资验证需求
        - 裁员、高管离职、融资压力和质疑性报道等反向信息显示，该模式可能仍有运营脆弱性
        - 高
        - 在把盈利能力视为耐久之前，先取得经审计的 FY24-FY26 指标、城市盈利桥，以及投诉或再入院数据
    notes: 严重性反映投资相关性，而不是发生确定性。每一行都概括公开证据，以及在认定护城河耐久前所需的主要尽调工作。
