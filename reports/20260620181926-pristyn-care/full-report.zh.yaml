      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任方 / 尽调路径
    rows:
      - - 更大一轮融资条款
        - 领投方、轮次规模、投后估值、清算优先权、反稀释条款和老股参与情况
        - 过桥轮保住了价格，但经济条款不足以支撑该估值
        - 向管理层和领投方法律顾问索取整套投资条款清单
      - - 经审计 FY25 和 FY26 收入质量
        - 法定审计收入、总额法 vs 净额法确认、手术业务与产品 / 其他收入结构
        - 只有分母足够稳、足够可重复，倍数才说得通
        - 调取经审计报表和收入确认附注
      - - 现金跑道和债务
        - 现金余额、月度烧钱、债务计划、契约负担和 18 个月资金预测
        - 用来判断过桥轮是否只是推迟了更硬的融资问题
        - 获取资金看板和最新管理账
      - - 医院队列经济性
        - 按自营医院队列拆分的入住率、ARPOB、付款方结构、病例结构、贡献利润率和回本期
        - 这是溢价医院资产叙事最核心的缺失证据
        - 索取所有自营医院的队列 P&L 和运营看板
      - - 股权结构和优先权堆栈
        - 完全摊薄股权、ESOP 稀释、清算瀑布和投资人权利
        - 独角兽标题仍可能掩盖不吸引人的入场经济性
        - 与法律顾问和财务一起审阅股权结构模型
      - - 质量 / 合规记录
        - 投诉日志、诉讼 / 索赔状态、GST / 保险往来，以及医院认证 / 审计轨迹
        - 在承保溢价估值前，不利叙事需要直接反驳或确认
        - 并行推进法律、医疗质量和监管尽调
    notes: 如果投资者打算依赖保住的独角兽估值，而不是折价重置，这些问题没有一个可以跳过。
    claimRefs:
      - CV007
      - CV015
      - CV019
      - CV020
      - CV021
      - CV022
      - CV040
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 留存记录显示，Pristyn Care 2018 年创立，2021 年跃升为独角兽，之后经历裁员、孟加拉业务撤回，并在 2025 年靠一轮小额过桥融资扩张自营医院。
    data:
      items:
        - date: 2018-01
          label: 创立
          detail: Harsimarbir Singh、Dr. Vaibhav Kapoor 和 Dr. Garima Sawhney 在 Gurugram 创立 Pristyn Care。
          tone: positive
          claimRefs:
            - CO001
            - CO002
            - CO003
        - date: 2020-06
          label: Series A 标记
          detail: 公开回顾报道提到 Sequoia 领投的 $4M Series A。
          tone: positive
          claimRefs:
            - CO016
        - date: 2020-09
          label: Series B 扩张
          detail: $12M Series B 伴随 70+ 家诊所、250+ 家医院和 10,000+ 台手术。
          tone: positive
