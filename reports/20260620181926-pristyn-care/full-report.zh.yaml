  - id: TI004
    title: 资本充足性表
    columns:
      - 项目
      - 公开数值 / 状态
      - 重要性
      - 含义
      - 尽调要求
    rows:
      - - Series E1 前历史股权融资
        - 约 $177 million
        - 自有医院推进加速前，可动用资本基础由此确定
        - 经历多年亏损后，历史融资规模大并不保证当前 runway
        - 提供股权结构表、清算优先权，以及各轮融资剩余净现金
      - - Series E1 过桥轮（2025 年 7 月）
        - 通过 34,280 股 Series E1 CCPS 融资 $4 million，每股 INR 10,038.16
        - 最近一次硬融资事件，也是短期资金需求最强信号
        - 如果 FY24 烧钱仍高，仅靠这笔钱不足以支撑激进的自有医院扩张
        - 提供交割日现金余额、过桥用途和 12–18 个月预算
      - - 更大规模在谈融资
        - $50-100 million 正在讨论
        - 若不收缩，继续扩张要靠下一轮触发
        - Series E1 更像权宜过桥，而不是已完成的资本重组
        - 确认领投方、估值预期和交割条件
      - - 自有医院扩张负担
        - 2025 年 7 月为八家医院 / 约 450 张床 / 约 200,000 sq ft；2025 年 10 月称 11 家医院 / 700+ 张床 / 300,000+ sq ft
        - 实体扩张抬高固定成本、营运资本和装修投入负担
        - 资本强度上升速度快于披露质量
        - 提供每张床、每间 OT、每个医院启动 cohort 的 capex
      - - 净亏损烧钱代理
        - FY24 净亏损 INR 381 crore，意味着资产负债表调整前每月约 INR 31.8 crore
        - 缺少现金数据时的粗略 runway 压力测试
        - 单靠 $4 million 过桥，抵不过 FY24 亏损强度下的许多个月
        - 提供月度烧钱、债务服务和经营现金流
      - - 现金、债务和 runway
        - 保留语料中未公开披露
        - 核心偿付能力输入
        - 开源承销无法判断是否充足
        - 提供资金库摘要、债务期限表和 covenant 套件
    notes: 资本充足性只能推断，无法证实；公开来源披露的是融资轮和扩张计划，不是实时资产负债表。
