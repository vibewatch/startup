  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛
        - 更大轮次以不低于平价过桥轮的价格完成；医院扩张持续；经审计收入加速；披露质量大幅改善。
        - 可支撑区间约 $1.3-1.7B；若当前以 $1.4B 入场，除非增长显著跑赢当下叙事，否则上行有限。
        - 自有医院执行失误、增长放缓，或融资仅由内部人完成。
        - 低到中；需要多个缺失证明同时到位。
      - - 基准
        - 收入继续增长，但医院经济性和资本结构仍只披露一部分；下一轮提供支持，却不能清晰发现价格。
        - 可支撑区间约 $0.8-1.1B；按 $1.4B 计算，盯市支持偏弱或为负。
        - 公开尽调补上缺失数据后，溢价倍数被压缩。
        - 中；最符合目前证据质量。
      - - 熊市
        - 更大一轮融资定价低于过桥轮，不利质量问题加深，或自营医院经济性不及预期。
        - 可支撑区间约 $0.4-0.7B；若以独角兽估值入场，下行空间会很大。
        - 降价轮、治理摩擦或资本稀缺迫使估值重置。
        - 中；过桥结构和披露缺口让该情景仍然可信。
    notes: 区间是判断性的可支撑价值带，不是管理层指引，也不是折现现金流输出。
    claimRefs:
      - CV015
      - CV017
      - CV018
      - CV033
      - CV034
      - CV037
      - CV038
      - CV039
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 指标 / 估值
      - 相关性
      - 局限
    rows:
      - - Pristyn Care 隐含当前估值
        - 私营 / 推断
        - E1 轮股价持平，保住 $1.4B 独角兽估值；约为 FY24 经营收入的 19.3x，或 FY24 总收入的 18.4x
        - 直接锚定本章的入场纪律问题
        - 倍数来自已经滞后的 2021 年估值加上 2025 年平价过桥轮；股权结构和优先权未披露
      - - Apollo Hospitals
        - 上市医院连锁
        - 市值 ₹1,22,066 crore；收入 ₹9,326 crore；推断市值 / 收入约 13.1x
        - 大规模上市医院运营商，有公开申报文件，医疗交付覆盖面广
        - 不是手术市场混合体；倍数是股权价值 / 收入，不是 EV / 收入
      - - Narayana Health
        - 上市医院连锁
        - 市值 ₹38,393 crore；收入 ₹3,975 crore；推断市值 / 收入约 9.7x
        - 更接近传统医疗交付经济性和披露标准
        - 运营模式和上市公司治理成熟得多
      - - HCG Oncology
        - 上市专科医院连锁
        - 市值 ₹9,122 crore；收入 ₹1,365 crore；推断市值 / 收入约 6.7x
        - 专科医疗运营商，规模更窄，公开披露更干净
        - 肿瘤连锁不是择期手术的直接类比
      - - Aster DM Healthcare
        - 上市医院连锁
        - 市值 ₹41,937 crore；收入 ₹2,616 crore；推断市值 / 收入约 16.0x
        - 说明上市医疗交付资产可以拿到公开市场溢价倍数
        - 业务组合和地域与 Pristyn 差异明显
      - - Max Healthcare
        - 上市医院连锁
        - 市值 ₹1,06,546 crore；收入 ₹2,874 crore；推断市值 / 收入约 37.1x
        - 展示顶级公开市场质量溢价如何拉宽估值带
        - 公开市场质量溢价很高；不适合作为基准可比
      - - Fortis Healthcare
        - 上市医院连锁
        - 市值 ₹72,699 crore；收入 ₹1,792 crore；推断市值 / 收入约 40.6x
        - 当投资者给战略资产和可选性定价时，上市医院倍数可以很高
        - 本组中倍数最高的一行；对仍未上市且仍亏损的运营商来说可能过于宽松
      - - MediBuddy
        - 私营健康科技
        - 2024 年 4 月估值接近 $500M；管理层称 FY24 收入超过 ₹1,000 crore；Entrackr 随后显示 FY25 经营收入为 ₹724.6 crore；隐含粗略区间约 4-6x
        - 可作为数字加医疗服务平台的私营健康科技参照
        - 分子 / 分母错配很明确；公司口径收入和法定收入并非同一基础
      - - Practo
        - 私营健康科技
        - FY24 经营收入 ₹242 crore，经营亏损 ₹17 crore；留存可访问来源未披露当前估值
        - 说明即便私营收入可见，也不会自动产出可用的倍数计算
        - 没有当前估值锚点，无法计算倍数
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the public hospital chains and private healthtech references with the best retained open-source
        valuation or revenue anchors as of 2026-06-20.
    notes: 所有公开市场倍数都是根据抓取的 Screener 报价页推断出的股权价值 / 收入比，不是企业价值倍数。私营公司行更不精确，保留它们主要是为了显示分母和披露质量在哪些地方失效。
