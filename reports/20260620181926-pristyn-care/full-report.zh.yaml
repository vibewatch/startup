      - 当前工作流
      - Pristyn Care 方案
      - 可衡量收益
      - 限制
    rows:
      - - 找到附近合适的外科医生或专科医生
        - 患者按疾病、城市或专科搜索，预约前可能还需要确认感
        - 城市医生页、附近页面、基于位置的 App 发现和协调员外联
        - 降低高意向手术查询的搜索摩擦，并把线索导入同一个支持团队
        - 没有匹配准确率、等待时间或分渠道转化的公开证据
      - - 预约线下 OPD 或在线问诊
        - 患者在决定治疗前想快速问诊
        - 移动 App 和商店列表推广在线问诊、聊天或电话，以及诊所预约
        - 让 Pristyn 用同一个 App 漏斗承接线下和远程需求
        - 专用网页远程问诊 URL 不一致，造成渠道模糊
      - - 上传文件、化验申请和治疗证据
        - 患者需要分享检查、处方、疫苗接种记录或恢复图片
        - 隐私政策确认支持文件、媒体、病历查看、化验上传和基于图片的进展追踪
        - 把术前和术后数据收集集中到 App 流程内
        - 没有公开解释临床医生审核流程或上传图片的 AI 分诊
      - - 创建数字健康身份并存储病历
        - 患者想要可复用的健康 ID 和可访问的病历历史
        - 通过 Pristyn 页面和 App 提供 ABHA 创建、文档存储和基于同意的病历框架
        - 把身份设置和病历收集嵌入预约旅程，而不是另走一个政府流程
        - 公开证据显示已能引导开户，但不能证明完整 ABDM 互操作深度
      - - 用最少文书跑完手术事务
        - 患者需要保险支持、通勤支持、入院帮助和随访
        - 协调员主导支持，并明确提供保险、EMI、免费用车和术后服务
        - 把高压手术过程变成带引导的工作流，减少掉队节点
        - 人工协调成本可能较高，规模化时运营韧性也可能不足
      - - 使用症状或健康工具并转化为护理
        - 用户带着生育或症状问题进入，而不是立刻提出手术需求
        - 经期追踪、怀孕工具、症状检查页和问诊 CTA
