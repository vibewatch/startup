      - number: '4.4'
        title: 财务结论、负面信号与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              平衡后的结论是，Pristyn 已证明需求、融资可信度和足够的运营变化，使利润率改善故事具备可信度，但披露仍不足以仅凭公开来源把故事变成可投资。负面记录并不轻。Inc42 报道过一项 GST
              调查，问题是公司究竟作为医疗服务提供者还是技术中介，管理层承认在抗议下放弃进项税抵扣。The Morning Context 发布过一个明确质疑收入确认的标题。Mint 还报道，在 Pristyn
              寻求新资本的同时，它正谈判规模更小的 Beatxp 融资，并处理更多高管离职。这些单独看并不致命，但会提高收入质量、集团现金需求和治理纪律的举证负担。


              关键阻断项不是缺少增长，而是在模式正变得更资本密集的时点，缺少可入档的财务能见度。公开资料没有现金余额、债务计划、FY25 实际 P&L、医院层面的入住率或
              ARPOB、单院装修成本，也没有硬证据说明报告收入由患者总账单还是净留存经济性驱动。在这些缺口关闭前，首选财务姿态应保持谨慎：把 FY24 收入和亏损视为真实规模标记，把 Series E1
              视为桥接而非解决方案，并把自有医院扩张视为潜在正向的利润率策略，但其经济性在公开记录中仍未证明。
