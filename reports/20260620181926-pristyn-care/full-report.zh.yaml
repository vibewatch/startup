      - number: '1.5'
        title: 里程碑、裁员、离职与战略转向
        blocks:
          - type: paragraph
            body: >-
              时间线很重要，因为它同时显示野心和压力。Pristyn 2018 年起步，借助 2020 年融资激进扩张，并在 2021 年成为独角兽。公司也在最初的轻资产手术网络叙事之外做过试验。2023 年开始的
              Bangladesh 推进不到一年便因社会动荡和停摆条件破坏市场而逆转，使国际扩张更像警示，而不是值得庆祝的里程碑。在印度国内，2024 年 3 月据报裁员 120 人并退出部分城市，公司当时瞄准盈利能力和未来
              IPO。2025 年，公开报道又增加了第二轮裁员、一系列高管离职，以及 Beatxp 这项健身科技副业既亏损又在融资压力下运转的迹象。与此同时，公司明显加码自有机构：2025 年 7 月 Series E1
              桥接融资用于医院扩张，Medical Buyer 描述其拥有八家自有医院和 450 张床位，The Print 则报道到 2025 年 10 月已有 11 家自有医院和 100+ ICU
              单元。因此，里程碑记录同时支持一个扩张故事和一个在资本收紧条件下重讲纪律的故事。
