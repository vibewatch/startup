  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相互矛盾的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              分析 Pristyn Care 时，应采用比印度整体医疗经济更窄的市场边界。IBEF 的行业页面可作为宏观情绪指标，因为它将医疗保健描述为印度最大的行业之一，并称医院占行业近
              80%；但同一页面也把医院、保险、设备、远程医疗、医疗旅游和其他类别卷在一起，无法干净映射到 Pristyn
              的工作流。用于估值或采用率分析时，更相关的边界是通过私立医院、日间护理中心和合作外科医生网络交付的计划性二级和三级手术，尤其是患者能够在无需长期住院的情况下完成诊断、无现金审批或 EMI 辅助自费的场景。官方
              NHA 与 HMIS
              证据把矛盾变成显性问题，而非偶然噪音。印度仍大量依赖自付，官方数据序列不按手术项目发布全国择期手术市场表，且该国测得的手术率仍远低于全球手术充分性阈值。正确结论不是市场小，而是公开证据支持多个受约束的规模测算视角，而不是一个干净的
              TAM 标题。投资者应保留 IBEF 的宣传性宏观数字、官方卫生融资账户，以及对 Pristyn 最关键但仍未钉住的择期手术切片之间的差距。
