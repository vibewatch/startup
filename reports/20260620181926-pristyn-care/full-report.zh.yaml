            body: >-
              公开客户叙事里，耐久性是最弱的一环。Pristyn Care 没有披露
              NRR、GRR、患者复购率、按术式调整复发后的满意度、转介绍率，也没有披露城市层面的留存队列。结构上这说得通——很多手术是一次性事件，不是订阅——但投资者仍然看不清，业务增长主要靠营销拉新，还是靠稳定转介绍、交叉销售和重复触达。能支撑的结论只是方向性的扩张。医院页面、移动
              app 流程以及近期 Entrackr 报道显示，公司在向自有医院、ICU
              更重的场景，以及骨科、眼科等更宽专科扩展，这可能把客户基础从最早的肛肠和泌尿科分散出去。但集中度风险仍然不低。官方推荐数在疝气等传统品类明显高于膝关节置换等较新品类，说明术式组合和客户验证可能仍集中在少数核心品类。Financial
              Express 还报道，公司 2024
              年裁撤支持职能并退出六个表现不佳城市，提醒投资者网点收缩和支持质量可能同步波动。尽调要问的不是总客户量，而是渠道结构、转介绍占比、保险结构、术式集中度，以及城市层面的服务表现随时间如何变化。
