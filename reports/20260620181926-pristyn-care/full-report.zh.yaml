      - number: '8.6'
        title: 展品
        blocks:
          - type: callout
            title: 平价桥轮不等于新一轮价格发现
            body: 维持股价有用，但在更大一轮以披露经济条款完成前，应把它视为内部人支持的连续性，而不是对独角兽标记的独立验证。
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
              - CV015
          - type: callout
            title: Pristyn 介于数字健康和医院连锁之间，因此两组可比公司都不完美
            body: 私营健康科技可比公司通常缺少干净估值数据，上市医院连锁披露又远多于 Pristyn。因此，正确的估值答案是一个区间加尽调门槛，而不是虚假的点估计。
            calloutType: insight
            claimRefs:
              - CV025
              - CV026
