      - number: '7.2'
        title: 临床责任、医生质量控制与支付风险
        blocks:
          - type: paragraph
            body: >-
              最重要的运营风险不是 Pristyn 能否找到需求，而是它能否在一个并非完全自有、也非完全自聘的网络里维持一致的手术质量。官网售卖的是高度托管的体验——无现金支持、免费接送、护理协调员、NABH
              认证设施和快速恢复话术——但没有公布外部投资者承保临床控制所需的硬治理指标：合作医生准入标准、合作医院审计频率、不良事件率、再入院率、保险拒赔率，或按术式划分的投诉分布。这个披露缺口很重要，因为印度医疗过失法已经相当成熟。法律资料显示，医疗过失可触发民事责任，极端情况下还可能引发刑事风险；res
              ipsa loquitur 等原则会在明显手术失败场景里加重审视。Pristyn 的合作伙伴模式让责任分配尤其棘手。患者体验到的是一个统一协调的品牌服务，但手术可能涉及外部医院、名册医生、麻醉师，以及保险公司或
              TPA。公开法律资料没有解决任何具体 Pristyn
              纠纷中这条链如何分配责任，因此即便正式合同把部分风险下沉，公司也应被视为存在实质的替代责任和声誉敞口。支付风险会放大质量风险。官方材料和历史报道显示，Pristyn 高度依赖无现金理赔、保险文书支持以及
              EMI/融资协助。商业上这有帮助，但也意味着预授权延迟、TPA 拒付和应收款节奏，会在患者结局和满意度最关键的同一批案例里挤压现金转换。重要的是，抓取到的公开记录没有出现 Pristyn 专属的过失判决或 NMC
              纪律处分令。这是一个真实的证据缺口，不是安全证明。正确解读是：结构性下行很高，但直接公开执法证据仍然稀薄。
