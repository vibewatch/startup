        title: 创始人、领导依赖与治理能见度
        blocks:
          - type: paragraph
            body: >-
              创始人叙事格外重要，因为公开运营身份仍围绕最初三人组展开。Harsimarbir Singh 最常作为商业和战略声音出现，Dr. Vaibhav Kapoor 与 Dr. Garima Sawhney
              则为最初的手术护理主张提供医学可信度。这一背景有助于解释公司早期围绕可负担先进手术的定位，以及后来转向更广的二级护理网络。更不清楚的是正式治理。保留的公开来源都没有给出当前董事会名单、Series E1
              后投资者权利图谱，或创始人与 Peak XV、Tiger Global、Hummingbird 等投资者之间决策权分配的清晰图像。2024-2025
              年的公开记录反而强调人员流动：多名高管据报离职，公司自有媒体页面突出医院与盈利里程碑，而不是机构治理披露。结果是一家公司具备强创始人-市场匹配，却缺少董事会层面的透明度。
