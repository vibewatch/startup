  - id: TV005
    title: 论点失效与终止触发表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 更大一轮融资定价低于平价过桥轮
        - 任何定价轮低于每股 ₹10,038.16，或低于保住的独角兽估值
        - 过桥轮从验证信号变成临时价格支撑
        - 论点从偏紧转为破裂；用熊市区间重审可支撑价值
      - - 经审计收入未扛住隐含增长负担
        - FY25 / FY26 经审计收入未显著高于 FY24 基数，或收入质量转弱
        - 18-19x 的滞后倍数不再像前瞻增长押注，而是显得陈旧
        - 没有实质折扣时，不要支付独角兽价格
      - - 自营医院未公布或证明利用率经济性
        - 没有入住率 / ARPOB / 付款方结构 / 贡献披露，或披露数字偏弱
        - 拿掉其相对私营数字健康可比公司的主要溢价理由
        - 估值重估应更接近较低倍数医院连锁或数字健康可比公司
      - - 医疗质量 / 疏忽叙事扩大
        - 正式投诉、监管行动或重复调查报道增加
        - 治理和品牌折扣扩大；收入耐久性更不稳
        - 提高下行情景权重，并升级法律 / 合规尽调
      - - 过桥后现金需求仍然急迫
        - 又一轮小额内部融资替代更大融资，或跑道仍不透明
        - 暗示保价格比根本融资充足性更重要
        - 在现金图景披露前，把估值视为脆弱
    notes: 这些是可监测的尽调触发项，不是确定性预测。
    claimRefs:
      - CV007
      - CV015
      - CV019
      - CV020
      - CV021
      - CV022
