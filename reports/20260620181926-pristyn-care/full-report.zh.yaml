  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 公开状态 / 成熟度
      - 差异化
      - 尽调缺口
    rows:
      - - 协调员主导的手术运营层
        - 患者和手术旅程中的陪护
        - 成熟且核心
        - 专属护理协调员处理从发现到随访的全链路事务，而不是让患者独自应对医院和文书
        - 没有关于协调员工具、个案负载、培训或自动化比例的公开证据
      - - 患者 App 和问诊入口
        - 预约问诊、检查和病历任务的患者
        - Android 和 iPhone 均已上线
        - 把专科搜索、在线问诊、病历任务、健康工具和手术支持整合到一个消费者入口
        - 没有公开留存、MAU、App 评分或问诊转化指标
      - - ABHA / 病历模块
        - 需要数字身份和文档管理的患者
        - 已上线但范围有限
        - Pristyn 在护理旅程中提供 ABHA 创建，以及文档和病历处理
        - 没有证据证明合作医院能回写 ABDM，或能同步长期病历
      - - 医生发现和城市名录层
        - 按专科、疾病、城市或距离搜索的患者
        - 已上线且覆盖广
        - 城市医生页、附近页面和 App 筛选器，在问诊前支撑高意向匹配
        - 匹配逻辑不透明；没有排序质量或算法分诊证据
      - - 保险、交通、入院和随访服务包
        - 接受手术的患者及其陪护
        - 已上线，官方页面明确展示
        - 无现金或 EMI 帮助、免费通勤支持、入出院协助和随访，把非临床摩擦从手术中拿掉
        - 公开材料没有记录具名保险公司、TPA 或流程集成伙伴
      - - SEO 内容和症状意图引擎
        - 从搜索进入的潜在患者
        - 规模大，且 2026 年仍在更新
        - 数千个专科、城市、附近和费用页面，为手术线索构筑高意向获客护城河
        - 流量依赖 SEO，带来平台风险和内容质量暴露
