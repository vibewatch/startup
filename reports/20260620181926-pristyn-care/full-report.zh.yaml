      - number: '4.2'
        title: 亏损画像、成本结构与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开 P&L 报道显示，公司扩张很快，但尚未把规模转化为持久盈利。FY23 在约 INR 453 crore 运营收入上亏损约 INR 382.5-383 crore；FY24 收入增至 INR 600.5
              crore 后，亏损仍几乎持平于 INR 381 crore。最有建设性的运营变化发生在净亏损线以下：FY24 EBITDA 亏损从 INR 352 crore 改善至 INR 345.3
              crore，EBITDA 利润率从此前年度的 -71% 至 -78% 改善至 -57%，广告费从 FY23 约 INR 220-231 crore 降至 FY24 的 INR 182.5
              crore。Entrackr 对 FY23 的测算显示 Pristyn 每赚 INR 1 运营收入需花 INR 1.94，也意味着相较 FY22 的 INR 1.97 至少有一些纪律改善。


              但公开单位经济图景只部分改善。FY24 服务收入基本持平，产品收入大幅增长，因此部分收入加速并非来自核心手术吞吐。公司还希望投资者相信，自有医院可以修复利润率质量：Elets
              报道首家医院在八周内达到运营盈利，远快于其引用的 12-24 个月行业常态。这个说法方向上令人鼓舞，但不足以承销，因为 Pristyn
              未披露单院资本开支、入住率、ARPOB、支付方组合或单台手术贡献利润率。上市同业会披露这些指标：Max、Narayana 和 Aster 都发布入住率、ARPOB、收入和 EBITDA 披露，使 Pristyn
              医院经济性的模糊更显眼。
