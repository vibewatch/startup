      - - 自有医院住院与手术服务
        - 在 Pristyn 运营的医院内捕获更多设施经济性
        - 手术 / 占用床日 / 医院病例
        - 2025 年 7 月报道有 8 家自有医院和约 450 张床位；2025 年 10 月宣传报道声称有 11 家医院和 700+ 张床位
        - 中低：战略上重要，但医院级经济性未披露
        - 提供按医院队列划分的入住率、ARPOB、贡献利润率和回本周期
      - - 医疗产品
        - 在更广泛患者旅程中销售产品
        - 产品销售
        - FY24 产品收入达到 INR 226.7 crore，同比增长 112.6%
        - 中：可见且增长，但结构和可重复性不透明
        - 拆分产品类别、毛利率，以及对手术患者的附加率
      - - 广告和辅助业务线
        - FY23 报道提到的剩余非核心收入
        - 活动 / 转诊 / 辅助服务
        - Entrackr 称非服务收入余额包括医疗产品和广告服务
        - 低：很可能非核心，且难以年化
        - 披露广告是否重要、是否经常性，或是否绑定一次性活动
      - - 保险支持的患者转化
        - 使用免现金和 EMI 支持改善患者转化，而不是作为独立业务线计费
        - 审批 / 融资手术
        - 官网营销称可通过 100+ 家保险公司实现免现金手术并快速审批，但未披露直接收入线
        - 低：是转化杠杆，不是明确披露的收入流
        - 展示付款方结构、拒赔率，以及付款方是否改变实现 ASP 或现金周期
    notes: 公开收入是混合口径收入；留存来源均未披露干净的分收入流毛利率桥。
