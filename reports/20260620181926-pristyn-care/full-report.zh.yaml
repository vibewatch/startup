            body: >-
              在官方触点上，Pristyn Care 卖的不只是手术，也是一整套协调：协调员支持、保险文书、EMI、交通、出院办理、app
              更新和术后随访。患者焦虑和照护者物流安排在这个品类里和医生名单同样重要，这种打包很可能有助于转化。
