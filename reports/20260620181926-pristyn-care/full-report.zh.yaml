  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现界面与公开牵引力锚点
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care 起步时是轻资产择期手术协调方，官方和第三方描述中仍留有这一模式的痕迹。2019 年 Series A 报道描述了一个由礼宾式服务牵头、利用合作医院基础设施的系统；当前官网仍营销 50+
              疾病的先进手术、无现金保险支持，以及广泛的诊所加医院覆盖，而不是狭窄的单一设施主张。公开财务报道也显示，公司并非纯医院服务业务。Entrackr 的 FY23 复盘称，医疗服务贡献 75%
              运营收入，其余来自产品和广告关联业务线；Inc42 的 FY24 文章进一步量化这一拆分，服务收入为 INR 332 crore，产品收入为 INR 226.7
              crore。这个组合很重要，因为它意味着标题收入是一个混合数字，横跨手术、产品和仍不清楚的附属变现。


              保留的最干净收入锚点是 FY23 的 INR 452.8-453 crore 和 FY24 的 INR 600.5 crore。这些规模足以说明 Pristyn
              已建立有意义的运营体量，但无法解决收入质量问题。官网披露面向消费者的咨询价格和保险协助，而不是已实现手术 ASP、队列经济性或总额 /
              净额记账政策。因此，收入模式最有用的读法是混合型：患者获取和咨询由数字渠道介导，护理交付仍依赖外科医生和设施，公司较新的自有医院推进则试图捕获更多手术钱包份额，同时收紧对患者体验的控制。
