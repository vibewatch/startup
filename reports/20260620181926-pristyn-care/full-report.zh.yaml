  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 取值
      - 支撑证据
      - 限制条件
    rows:
      - - 建议
        - 继续研究
        - 平价过桥轮保住了独角兽价格信号，但公开证据尚不足以支撑有把握的入场价格。
        - 更大轮次条款、经审计的 FY25/FY26 数据和优先权条款仍缺失。
      - - 置信度
        - 低
        - 多个独立来源交叉印证了 2021 年独角兽轮和 2025 年平价过桥机制。
        - 决定承销判断的输入仍缺位，因此置信度属于事实本身，而不是估值判断。
      - - 风险评级
        - 高
        - 亏损仍重，过桥资本规模很小，负面执行 / 疏忽叙事仍未消散。
        - 如果更大轮次成功完成，或医院经济性拿出经审计证明，风险评级可能下调。
      - - 估值立场
        - 偏紧
        - 按 FY24 收入计算，隐含尾随收入倍数约 18-19x；宽口径公开可比公司区间约为 6.7-40.6x。
        - 可比公司测算是推断得出，且并非同口径对比，因此它是谨慎信号，不是确定性的高估结论。
      - - 决策含义
        - 等待尽调或价格重置
        - 下一轮融资、经审计财务和医院 cohort 指标，是最干净、最可能改变判断的催化剂。
        - 仅凭保住的独角兽标记入场，会过度依赖管理层叙事。
    notes: 本章结论有意对价格敏感；它并不是泛泛地说这家公司缺乏战略价值。
    claimRefs:
      - CV003
      - CV007
      - CV017
      - CV018
      - CV033
      - CV036
      - CV040
  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点类型
      - 论点
      - 什么会改变判断
    rows:
      - - 正方论点
        - 混合型手术协调平台叠加自有医院扩张，若能比数字健康同行吃下更多手术钱包份额，就能支撑溢价倍数。
        - 若经审计医院 cohort 数据能展示入住率、ARPOB、支付方组合和贡献利润率，该论点会明显增强。
      - - 正方论点
        - 2025 年过桥轮平价定价说明，内部人仍在捍卫独角兽标记，而不是接受可见的 down-round。
        - 如果新投资者领投更大轮次，且价格不低于当前水平，内部人支持就会转化为更广泛的验证。
      - - 正方论点
        - 医院快速扩张，以及公司声称首家医院两个月回本，拼出了一条可信的前瞻上行路径。
        - 不只是一家医院，而是在多家医院重复验证，才会让溢价更容易承销。
      - - 反方论点
        - 相比亏损基数，$4 million E1 融资太小，更像过桥资金，而不是完整估值验证。
        - 如果更大轮次很快以强条款交割，这一担忧会减弱。
      - - 反方论点
        - 公开来源仍看不到股权结构经济性、现金跑道和医院层面单位经济性，入场价格难以辩护。
        - 披露经审计 FY25/FY26 数据和清算优先权，将直接回应这一问题。
      - - 反方论点
        - 负面的医疗疏忽、裁员和 GST 叙事，抬高了治理和护理质量的举证门槛。
        - 更干净的公开法律 / 监管记录，以及经过独立验证的护理质量数据，会降低这项折价。
    notes: 投资判断不在于 Pristyn 是否增长，而在于增长质量和披露质量是否足以支撑今天支付独角兽价格。
    claimRefs:
      - CV007
      - CV011
      - CV015
