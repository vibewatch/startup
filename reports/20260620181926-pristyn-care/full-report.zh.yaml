              下载量及预约、数字记录、症状检查和费用估算等工作流功能，但保留抓取的页面文本没有暴露当前公开星级评分。iOS 方面，App Store 搜索抓取返回由 429 触发的阅读器回退，没有干净的 Pristyn
              页面。第三方评论覆盖也零散：MouthShut 产品评论 URL 只解析到错误或限制页面，可访问的 Glassdoor
              评论界面则面向员工且偏历史，而非面向患者。净结果是，独立公开满意度数据主要以投诉证据和运营代理形式存在，而不是一套干净、近期、跨平台的患者评分。
