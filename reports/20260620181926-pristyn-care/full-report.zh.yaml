    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与护理模式
        blocks:
          - type: paragraph
            body: >-
              本报告应将 Pristyn Care 定位为一家总部位于 Gurugram、由 Harsimarbir Singh、Dr. Vaibhav Kapoor 和 Dr. Garima Sawhney 于 2018
              年创立的医疗平台。最强的官方证据并非来自一页囊括所有基础信息的公司简介，因此第一章需要综合官网与高声誉报道。官方页面把公司描述为服务择期或二级护理手术患者旅程的业务，而不是传统意义上的医院体系：Pristyn
              称其帮助患者找到合适医生、预约、完成诊断、处理保险、前往医院，并完成出院与随访。隐私政策将法律实体识别为 GHV Advanced Care Private Limited；第三方报道则一致将总部放在
              Haryana 的 Gurugram 或 Gurgaon。尽调时，最合适的处理方式是把它视为一家聚焦印度的择期手术编排方，其公开身份如今混合了市场平台、护理导航和医院所有者三种特征。
