      - number: '7.3'
        title: 融资、烧钱、竞争与收入质量风险
        blocks:
          - type: paragraph
            body: >-
              Pristyn 的融资历史足以说明投资人有兴趣，但更近的公开证据不那么舒服。历史报道和资料支持一条清晰的融资阶梯：从 2019 年 Series B，到 Tiger 领投的 2021 年 Series D，再到
              2021 年 12 月 Series E，把公司推到 US$1.4 billion 的独角兽估值。问题在于资金到位之后发生了什么。Entrackr 和 CNBC 共同支持 FY23 总收入约 ₹494
              crore、经营收入约 ₹453 crore；但 Entrackr 也报道亏损约 ₹383 crore，并称公司每赚 1 卢比经营收入仍花掉近 ₹1.94。Medical Buyer 随后报道 FY24 收入为
              ₹600.5 crore，净亏损仍约 ₹381 crore。这是规模进展，不是干净地摆脱烧钱。因此，公司公开叙事已从高速增长转向盈利、城市优先级和最终 IPO 准备。CNBC 2024 年 3
              月报道是最清晰的当前信号：裁撤 120 个岗位、退出六个城市，管理层把动作表述为上市前几年围绕盈利能力调整。竞争维度更微妙，但同样真实。收购 Lybrate 明确是为了进入初级护理和在线问诊，说明 Pristyn
              希望更上游地控制患者漏斗，而不是只依赖下游手术转化。在一个传统医院连锁、保险公司和数字健康平台都能争夺同一患者旅程的市场里，这是一招防御。抓取到的公开记录仍留下两个尤其重要的尽调缺口。第一，可访问资料没有任何一项披露公司收入确认政策，精度不足以支撑
              IPO 级别的舒适度。第二，协调层与免税医疗服务之间的 GST 处理也未解决。这些不是小会计脚注；它们直接影响收入质量、合规和任何未来发行备忘录。
