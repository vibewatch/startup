  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 独角兽标记、平价桥轮，以及隐含倍数真正说明什么
        blocks:
          - type: paragraph
            body: >
              Pristyn Care 最新可靠的估值锚点仍是 2021 年 12 月的独角兽轮，而不是 2025 年新的价格发现事件。Economic Times 报道 Series E 融资给公司的估值为 $1.4
              billion，Entrackr 基于备案的报道也把同一轮描述为现有投资人新一轮出资后让 Pristyn 迈入独角兽的交易。2025 年 7 月的 Series E1
              桥轮很重要，因为它看起来是在守住、而不是重设这个标记：Entrackr、CXO Digital Pulse 和 Digital Health News 均称，公司发行 34,280 股 Series E1
              CCPS，每股 ₹10,038.16，与上一轮价格相同。也就是说，市场有公开证据看到价格连续性，却没有看到新的第三方价格发现。


              如果把桥轮视为独角兽标记的平价延伸，就可以估算隐含倍数，但必须明确加上限制。Entrackr 基于 FY24 RoC 的文章给出 ₹601 crore 经营收入和 ₹632 crore
              总收入；TheKredible 公司页显示的 FY24 收入基数也基本相同，为 ₹632.21 crore。用 ₹83 兑 1 美元作为简化汇率假设，$1.4 billion 股权价值约等于 ₹11,620
              crore，隐含约 19.3x FY24 经营收入，或 18.4x FY24 总收入。这个计算是推导出来的，不是公司披露的：Pristyn
              没有发布当前估值备忘录、股权结构表、优先权栈，也没有任何声明确认平价桥轮让所有经济条款保持不变。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV013
              - CV016
              - CV017
              - CV018
      - number: '8.2'
        title: Series E1 更像桥接资本，不是决定性验证
        blocks:
          - type: paragraph
            body: >
              承保问题不在于 Pristyn 缺增长，而在于公司最新资本事件本身太小，难以独立验证独角兽标记。Entrackr 独家、CXO Digital Pulse 和 Digital Health News 都把这笔
              $4 million Series E1 融资描述为更大进行中融资的一部分，并称公司正寻求从新老投资人处最多筹集 $100
              million。公司还提高了授权资本，以容纳未来融资。换句话说，桥轮维持了股价连续性，但也暴露融资工作尚未完成。相较 FY24 ₹381 crore 亏损，以及管理层推进的自有医院建设——从 2025
              年中八家新开医院、450 张床位，到 2025 年 10 月 11 家自有医院、700+ 张床位、100+ 个 ICU 单元和 30 间模块化手术室——$4 million 补充资金并不大。


              这笔桥轮在运营上比在财务上更鼓舞。Entrackr 关于医院扩张的报道显示，Pristyn
              正试图把资产轻的手术协调模式，转成控制力更高的自有医院网络；公司还宣传了一个早期验证点：首家自有医院两个月内实现盈利。如果能复制，这会支撑溢价倍数；如果不能，自有医院转向只是把更多固定成本内部化。公开层面，投资者仍缺少判断哪种解释正确的核心队列数据：没有入住率、没有
              ARPOB、没有支付方结构、没有单店 capex、没有贡献利润率、没有现金余额，也没有优先权栈披露。因此，平价桥轮应被解读为价格防守加跑道延长，而不是决定性第三方确认 $1.4 billion 就是正确估值。
