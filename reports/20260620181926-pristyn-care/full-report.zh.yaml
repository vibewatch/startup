      - number: '7.4'
        title: 领导层流失、孟加拉退出与负面信号质量
        blocks:
          - type: paragraph
            body: >-
              人员和执行故事里，已确认风险和指控必须分开。先看已确认部分：Wikipedia 保留了 2022 年 9 月围绕 Harsimarbir Singh 公开面试技巧的联合创始人争议，CNBC 确认 2024
              年一次有分量的裁员，与盈利和 IPO 准备相关。Medical Buyer
              还报道了近期高管离职，以及孟加拉业务上线不到一年后撤退。这些都是真实的运营压力信号。尚不确定的是早前裁员的严重程度，以及国际撤退背后的完整原因栈。一些无法访问或只有预告页的创业媒体曾流传更大规模早期裁员说法，但抓取到的可访问语料不足以把该数字保留为已确认事实，因此应留在指控桶里。孟加拉也类似。已确认的是退出本身：Medical
              Buyer 称 Pristyn 2023 年 8 月进入当地，计划建设五个中心、招聘 200 人，并投入 Rs 100-crore 扩张项目；随后在 2024 年 7
              月内乱后暂停运营。有争议的是原因。公司口径强调员工安全和政治扰动；同一篇文章又另称，未具名来源把撤退归因于销售低于预期。这个区别很重要，因为一个故事是暂时的外生扰动，另一个则是对印度以外模式可移植性的更严重否定。文章还补充，资本被重新分配回印度，同时
              Pristyn
              追求自有或更严控的超级专科医院；这也暗示战略正在偏离纯资产轻叙事。合并来看，领导层和扩张风险应评为高，不是因为公司已被证明坏掉，而是因为它已经显现劳动力削减、创始人文化震荡、战略重置和证据缺口并存的模式，足以让任何
              IPO 前风险备忘录变复杂。
