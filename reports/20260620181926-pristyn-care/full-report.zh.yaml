      - number: '2.2'
        title: 择期手术中的买方、用户与支付方
        blocks:
          - type: paragraph
            body: >-
              Pristyn 的买方地图与企业医疗 IT
              或医院设备销售根本不同，因为同一个病例里，用户、经济买方和报销看门人往往不是同一方。患者是用户，但真正的决策单元常包括家属、转诊医生、外科医生，以及可用的支付通道。对富裕或领薪的城市家庭来说，这意味着商业保险、无现金审批或雇主赞助保障；对低收入家庭来说，可能意味着
              PM-JAY 资格；对许多患者来说，仍是分期融资补充自费。Pristyn
              对自身业务的描述强化了这一结构：公司不只是把患者匹配给医生，而是在协调诊断、保险文件、前往医院、入院、出院和随访。这种编排很重要，因为印度的融资组合仍然混乱。官方数据仍显示近一半卫生总支出直接来自家庭，即便可访问的保险档案，也没有给出雇主团体、零售和政府计划择期手术覆盖人数的简单公开表。实际来看，Pristyn
              的胜出条件是降低多种支付方类型之间的摩擦，而不是只依赖一个报销渠道。
