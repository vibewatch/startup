            body: >-
              患者 App 不止于预约。官方 App 页面、隐私披露和应用商店页面共同显示，这是一个多功能消费者界面，包含在线问诊、专科搜索、基于位置的发现、文件上传、实验室检测预约、基于 OTP
              的登录、疫苗或检测记录查看、经期与排卵工具、妊娠支持，以及 ABHA 创建。隐私政策格外有信息量，因为它披露了让工作流跑起来的权限：摄像头和音频用于问诊，文件和媒体用于上传，短信用于 OTP
              自动填充，存储用于快速访问，图片上传用于治疗进展追踪和个性化推荐。ABHA 页面明确了数字记录野心，但仍停留在入门层级。Pristyn 明确支持创建和下载 ABHA
              ID，并解释基于同意的健康记录共享，但公开证据尚未证明合作医院或医生会把纵向记录写回 ABDM 兼容系统。这个区别很重要。患者 App
              作为接入、协调和记录收集层具备可信度；但作为深度集成的健康记录交换网络，公开证据仍未证明。
