  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: Pristyn 的核心竞争对手是碎片化的择期手术现状，而不只是另一个 App
        blocks:
          - type: paragraph
            body: >-
              Pristyn 的官方界面呈现的业务既不是传统医院连锁，也不是通用医生预约 App。about
              页面称，公司管理从医生发现、诊所预约，到诊断、保险文件、家到医院交通、入出院和随访咨询的完整手术旅程；官网还加入了零文书处理、专属护理协调员、免费出院后送达、IPD 后随访咨询和 24x7
              协助等运营细节。这在竞争上很关键，因为大多数印度替代方案仍要求患者自己拼接外科医生搜索、医院选择、支付方互动、交通和术后随访。Pristyn 还声称采用混合供给模式，而不是纯转诊套利：官网和 Google
              Play 页面均称其通过 150+ 诊所、800+ 合作医院运营，有 400+ 超专科外科医生专为公司服务，覆盖 45+ 城市、服务 2M+
              患者。用实际买方语言说，最接近的对标类别是“搭在合作基础设施之上的手术协调层”，而不是简单医院或远程问诊产品。数字漏斗也格外重要。Pristyn 的 App、症状检查页面和 XML 站点地图显示，公司提供
              ABHA 卡创建、Redcliffe 关联实验室采样、症状驱动分诊，以及大量城市-治疗落地页。它们合起来意味着，在患者到达医院前，公司已经拥有强意图捕获引擎。
