      - number: '3.4'
        title: 护城河在协调密度与合作方准入，但公开负面信号显示执行风险
        blocks:
          - type: paragraph
            body: >-
              公开证据支持真实的差异化故事，但不是无条件的护城河。Pristyn 最强的边缘在于它试图掌握的触点数量：数字症状捕获、免费专科咨询、诊断分流、保险和 EMI
              支持、协调员牵头排期、合作医院执行、免费交通或送达，以及结构化随访。Inc42 2020 年报道也保留了最初的经济性假设：管理层称，相比大型企业医院，轻资产方式可将先进手术成本降低约
              30-40%；到当时，公司已覆盖 14 个城市、250 多家合作医院，并完成 10,000 多台手术。后续新闻来源说明投资者仍应谨慎。Economic Times、YourStory 和 Moneycontrol
              记录了 Pristyn 的快速融资和独角兽跳升：从估值约 $550 million 的 $53 million Series D，到估值 $1.4 billion、报道口径为约 $100 million
              Series E / $96 million Series E。但 Entrackr、Livemint、The Statesman 和 IndianStartupNews 的 2024-2025
              年报道也描述了裁员、城市退出、高管离职，以及融资或现金效率压力。The Morning Context 的怀疑性标题强调，即使完整负面细节被付费墙挡住，关键审视仍然存在。实际结论是，Pristyn
              的重协调模式相对医院连锁和 App 市场确有差异化，但耐久性取决于它能否守住外科医生质量、转诊转化和患者信任，同时不让协调员成本、治理缺口或激进增长策略侵蚀患者体验。
