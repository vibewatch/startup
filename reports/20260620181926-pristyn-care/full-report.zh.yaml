      - number: '3.3'
        title: Practo、MediBuddy 和 Apollo 24|7 在流量获取与门诊导航上重叠
        blocks:
          - type: paragraph
            body: >-
              数字医疗竞争者与 Pristyn 最强的重叠发生在漏斗顶部，而不是手术执行点。Practo 官方首页营销即时视频问诊、已确认预约、实验室检查、药品，甚至“安全可信的手术中心”；其 about 页面和 Play
              页面让真正的规模优势更清楚：在 9,000 多家医院和诊所提供在线预约，覆盖 20 多个专科的在线问诊，并拥有 200,000 多名医生、70,000 多家诊所和医院的网络，其中包括
              Apollo、Fortis、Max 和 Manipal。这给 Practo 带来广泛的发现与转诊护城河，但保留来源没有显示 Practo 雇佣外科医生、管理合作医院产能，或提供 Pristyn
              式交通、保险、入院和随访编排。MediBuddy 的公开界面更通用，核心是健康检查、实验室检测、在线购药和医生问诊；它更像横向的消费者和雇主健康平台，而不是手术优先公司。Apollo 24|7
              具有战略重要性，因为它表明 Apollo 生态理解数字导航，但官方站点在抓取时返回 403
              阻断体验，因此本章只能确认渠道威胁存在，不能确认其当前功能深度。结果是一个有意义但有边界的威胁模型：这些平台可以拥有患者需求和多归属转诊，而 Pristyn 在实际择期手术转化与陪伴上仍显得差异化。
