      - number: '2.4'
        title: 采用约束、报销摩擦与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Pristyn 模式最强的约束来自经济性和信息，而不是概念。私立护理需求存在，但印度仍把很大融资负担压在家庭身上，且在有限可得研究中，正规私立护理远比公立供给昂贵。PM-JAY
              扩大了可及性，也暴露了费率缺口：私立医院高管公开称套餐价格无法覆盖高质量护理成本，而可访问的公开语料仍不便核验当前按项目拆分的费率比较。地理是第二重约束。私立择期手术产能集中在大都市和更密集的城市走廊，这有利于
              Pristyn 在现有运营城市开展业务，但若没有严格的合作方质量控制，也限制了模式能向外延展多远。最后，精确市场规模仍是证据问题。官方 NHA 与 HMIS 数据集不按项目发布全国择期手术
              SAM，可访问的保险档案没有整齐拆分相关支付方人群，Pristyn 自身的支付方组合或单台手术收入仍未公开。即便公司 2024
              年裁员和退出城市，也说明执行纪律和长期需求同样重要。因此，市场具备吸引力，但更适合建模为一个受约束、证据有缺口的机会，而不是无摩擦的全国 TAM。
