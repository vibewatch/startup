      - 机制
      - 单位
      - 当前值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - 通过合作医院提供手术服务
        - 通过第三方设施完成问诊、排期、外科医生协调、诊断支持、保险处理和手术执行
        - 手术 / 患者单次诊疗
        - 仍是核心业务线；FY23 医疗服务为 INR 338 crore，FY24 服务收入为 INR 332 crore
        - 中：需求真实，但总额与净额确认仍不清楚
