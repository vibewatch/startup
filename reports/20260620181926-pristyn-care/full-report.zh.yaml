      - number: '5.1'
        title: 协调员牵头的手术工作流
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care 的核心产品应被描述为择期和二级护理手术的运营工作流，而不只是一个 App。官网和 about
              页面都呈现了一条引导式旅程：从发现开始，进入咨询、诊断、保险文件、前往医院、入院、出院和随访。最有特色的一层是人工护理协调员。官方文案称协调员提供端到端支持，并亲自回应服务问题；治疗页面还加入免费出租车或接送支持、无现金或
              EMI
              帮助，以及术后随访。对手术来说，这一组合是真正的转化与信任优势，因为患者在意物流和信心，不亚于医生搜索。与此同时，公开记录没有揭示协调员软件栈、病例管理工具或自动化深度。投资者因此应区分明示和推断：引导式工作流是明示的，但背后的内部
              CRM 或编排引擎不是。当前最佳读法是，Pristyn 的护城河是一层包裹合作医生和医院的软件赋能服务，并带有重要的人工参与成分；它可能比营销文案暗示的更难高效扩张。
