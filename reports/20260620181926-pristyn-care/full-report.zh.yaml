        - 只适合作为情绪和上限背景
      - - 私营二级和三级医院照护
        - 住院和日间手术、专科咨询、围手术诊断、住院入院
        - 公共初级卫生、药品制造、纯保险收入
        - 家庭、私人保险公司、雇主、被接受时的 PM-JAY
        - Pristyn 合作伙伴的核心运营场域
      - - 择期和短住手术
        - 计划性白内障、肛肠、腹腔镜、耳鼻喉、泌尿、妇科及类似手术
        - 急诊创伤、ICU 主导的重症照护、慢病药物发放
        - 患者家庭决策单元，加上医生和报销把关方
        - Pristyn 最接近的公开市场边界
      - - PM-JAY 报销的计划性手术
        - 在入网医院中、套餐和资格匹配时由政府资助的入院
        - 高于计划经济性的高端城市标价手术
        - 邦或中央公共支付方
        - 相关的量通道，但未必总是有吸引力的单位经济性通道
      - - 现状替代和延迟
        - 观察等待、本地诊所、非正式服务提供者，或因成本 / 污名推迟治疗
        - 确定性手术解决方案
        - 家庭预算和可及性约束占主导
        - 已实现需求的主要边界限制
    notes: 边界有意从广义医疗经济收窄到医院交付的计划性手术，因为 Pristyn 变现的是协调式择期照护流程，而不是整个卫生系统。
