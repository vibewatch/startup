      - number: '8.4'
        title: 私营健康科技可比公司有方向价值，但披露错配仍很严重
        blocks:
          - type: paragraph
            body: >
              印度私营健康科技参照主要有用之处，在于它们展示了私募市场分母选择有多混乱。留存资料中最好的例子是 MediBuddy。Hindu BusinessLine 2024 年 4 月引用 CEO 说法，称 FY24
              收入已超过 ₹1,000 crore，公司估值接近 $500 million。但 Entrackr 后来基于 RoC 的 FY25 文章显示，经营收入只有 ₹724.6 crore，亏损 ₹137
              crore。这些数字不一定互相矛盾——一个可能是更宽的管理层收入口径，另一个是更窄的法定经营收入线——但错配本身说明了问题：即便一家私营健康科技公司同时有估值和收入，倍数计算也取决于分子和分母是否来自同一个会计边界。


              Practo 是相反的问题。Economic Times 给出更新后的 FY24 收入锚点 ₹242 crore，并称经营亏损降至 ₹17 crore，但留存的可访问资料没有给出同期私有估值。因此没有干净倍数可与
              Pristyn 对比。结果是，私营健康科技可比公司无法拯救承保确定性。若用 MediBuddy 粗略 $500 million 估值对照公司声称的 ₹1,000 crore+ 收入，隐含倍数只有约 4x；若改用
              Entrackr 的 ₹724.6 crore 经营收入，倍数升向 6x。无论哪种，粗略区间仍明显低于 Pristyn 的平价独角兽标记。这不能证明 Pristyn 被高估，因为 Pristyn
              比纯数字平台拥有更多实体照护交付敞口，但它强化了一个判断：市场已经在价格里放入了相当大的医院执行溢价。
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV035
              - CV036
      - number: '8.5'
        title: 牛、基准、熊三种情形都指向继续研究，而不是带价格的强确信判断
        blocks:
          - type: paragraph
            body: >
              牛市情形不难想象：自有医院继续爬坡，更大一轮融资以平价桥轮或更高价格完成，FY25/FY26
              经审计收入显示手术业务在复合增长、而不只是重新洗牌组合，医院层面的利用率数据也开始接近上市连锁披露的证明标准。在这组假设下，$1.3-1.7 billion
              区间可以辩护，当前标记也能守住。基准情形没那么好看。收入增长，但披露只部分改善；下一轮融资仍由内部人支撑；医院队列经济性在公开层面仍未验证。在这个世界里，公司仍可能具备战略吸引力，但公允价值会漂向约
              $0.8-1.1 billion。


              熊市情形让立即给出带价格的推荐不合适。如果更大一轮融资低于平价桥轮价格，如果收入质量担忧加剧，如果医疗过失或保险销售指控固化成更广泛的品牌问题，或如果自有医院经济性弱于宣传，最可支撑的价值可能重设到约
              $0.4-0.7 billion。相对独角兽入场价，这个下行很实质。基于开源资料，正确结论因此是继续研究，置信度低，估值立场偏紧。能改变判断的变量很清楚：FY25/FY26
              经审计收入、完整股权结构条款、医院层面入住率和利润率数据、现金跑道，以及更大一轮融资的定价条款。
