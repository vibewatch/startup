      - number: '1.3'
        title: 融资历史、独角兽背景与投资者基础
        blocks:
          - type: paragraph
            body: >-
              保留的融资记录显示，Pristyn Care 从早期风险轮快速进入独角兽阵营，但 2021 年之后能见度变弱。Inc42 称，2020 年 6 月 Sequoia Capital India 领投 $4
              million Series A，随后 $12 million Series B 引入 Hummingbird Ventures、Greenoaks Capital 和 AngelList。到 2021 年 4
              月，Tiger Global 领投 $53 million Series D，估值超过 $550 million，Sequoia、Hummingbird 和 Epiq 继续跟投。公司随后在 2021 年 12
              月达到独角兽状态，当时 Economic Times、Moneycontrol 和 IBEF 报道其完成约 $96 million 至 $100 million 的 Series E，估值约 $1.4
              billion，Sequoia、Tiger、Winter Capital、Epiq、Hummingbird、Trifecta 和天使投资人均在其中。2025 年 7 月则完全不同：Entrackr 和
              Medical Buyer 将其描述为一笔 $4 million Series E1
              桥接融资，价格与上一轮持平，并指定用于自有医院扩张。这说明投资者仍支持公司，但并不是一次新的估值上调。公开披露仍无法完整还原累计融资或 E1 后的精确稀释。
