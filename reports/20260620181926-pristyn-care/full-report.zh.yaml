  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 患者分群、地理覆盖与规模代理指标
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care
              更适合被理解为消费者健康服务编排方，而不只是诊所连锁。官方界面一致描述的服务对象，是需要医生发现、咨询、保险文件、入院协调、手术当天交通和术后随访的择期与二级护理手术患者。可能的经济买方是患者或家庭照护者，支付路径则依病例组合走自费、无现金保险、报销或免息
              EMI。当前官方规模说法很大但口径混杂：官网和 Google Play 页面称有 150+ 诊所、800+ 合作医院、400+ 超专科医生或外科医生，并覆盖 45 个以上城市；公司 about
              页面仍描述六个大都市加 30 个二、三线城市。Entrackr 2026 年医院扩张片段又加入更大的运营代理指标——五年 300,000 台手术、每年超过 3 million 次患者互动、每月 100,000
              个手术登记——但这些是媒体转述的公司说法，不是经审计的利用率指标。客户地图也正在超出公司最初的肛肠科 / 泌尿科核心。官方医院和 App
              界面如今覆盖骨科、眼科、皮肤科、生育、神经科、肾内科、呼吸科和肿瘤科，意味着客户基础越来越包括白内障和膝关节置换等更高急性度、更高年龄段人群，而不只是更年轻的激光手术病例。
