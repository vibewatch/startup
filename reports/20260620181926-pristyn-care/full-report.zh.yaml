        - 提供 FY24/FY25 成本收入桥和 cohort 级贡献利润率
      - - FY24 每 INR 1 经营收入对应费用（推算）
        - 约 INR 1.69，由 INR 1,013.8 crore 支出和 INR 600.5 crore 经营收入估算
