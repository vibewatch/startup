  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与数据治理边界
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care 落在印度多套医疗监管制度的交叉地带，却没有公开披露一张整合后的合规地图。运营模式本身足够清楚：官网和公开资料描述的是一家手术协调业务，覆盖 150+ 家诊所、800+ 家合作医院和
              400+ 名专科医生，而不是一家完全自有的医院连锁。这个规模很关键，因为 Clinical Establishments Act 2010
              按机构层面适用，但抓取到的公开记录仍显示各邦采纳不均、处罚偏低，因此合作地点之间执法也不均。实际效果是，公司可以比重资产连锁扩张更快，但也继承了一圈碎片化的医院合规边界，投资者仅靠公开证据无法充分审计。消费者法一侧更具体。Indian
              Medical Association v. V.P. Shantha 以及 Consumer Protection Act
              框架，让医疗服务保留在患者可使用的诉讼路径中，即便服务由私立医院和专科医生交付。也就是说，Pristyn
              面临下行不需要等监管主导的整顿；只要一次足够严重的疏忽或术后纠纷，就可能变成消费者案件、声誉问题或回款问题。数据层又叠加第二套监管。Gazette 和百科资料确认 Digital Personal Data
              Protection Act 2023 已成为运营背景的一部分，官方 ABDM 材料也显示政府在推动数字健康 ID 和数据交换。这里最强的反向证据不是针对 Pristyn 的执法行动，而是 Internet
              Freedom Foundation 的批评：PM-JAY/ABDM 相关系统暴露了可识别患者记录，且健康数据制度缺少旧草案中更强的特殊类别保护。这些是倡议组织主张，不是裁判结果，但仍然重要，因为 Pristyn
              处理手术排期、保险和病历流，而这个行业里的同意、留存和泄露义务正在变严，速度快过公开披露质量的改善。
