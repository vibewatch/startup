        - 暂停承销，直到责任分配和补救措施形成文件
      - - 收入质量存疑
        - 披露激进确认政策或重大 GST 争议
        - 手术 / 回款前确认费用，或税务口径被主管机关挑战
        - 重新切分收入、利润率和 IPO 准备度假设
      - - 烧钱并未真正改善
        - 尽管收入增长且裁员，亏损仍接近 FY24 水平
        - 又一年亏损约 ₹350 crore 以上，或每卢比支出经济性恶化
        - 将 2024 年裁员视为压力信号，而非纪律性证明
      - - 合作伙伴控制薄弱
        - 证据显示保险拒赔、投诉或合作医院流失同步上升
        - 投诉强度连续多个季度上升，且未发布 QA 响应
        - 假设品牌扩张速度快于运营控制
      - - 数据治理失效
        - 患者数据泄露、DPB 调查或隐私政策逆转
        - 任何影响手术记录或同意流程的泄露
        - 立即上调法律和声誉风险评级
      - - 战略漂移 / 资本密集化
        - 自有医院扩张在回报不清时加速，同时轻资产叙事削弱
        - 资本开支跃升叠加又一次地区失败或城市撤退
        - 降低估值容忍度，并要求更严格的资本配置备忘录
    notes: 这些触发项把宽泛担忧转成决策级检查项，可在任何私募或公开融资事件前持续监控。
