      - number: '4.3'
        title: 融资历史、Series E1、医院扩张与资本需求
        blocks:
          - type: paragraph
            body: >-
              Pristyn 的资本历史足以显示它曾拥有强投资者渠道，同时也显示当前融资姿态更脆弱。Series A 在 2019 年加入 $4 million，2021 年 8 月 Series D 以 $550
              million 估值加入 $53 million，2021 年 12 月 Series E 轮创造了独角兽标记。但 Series E 数字本身必须谨慎处理。Entrackr 基于备案的文章捕捉到第一笔配发约
              $84.7 million，对应 1,266 份 Series E CCPS；Inc42 后续更新则将完成轮视为 $96 million、估值 $1.4 billion。最干净的承销处理是保留两个事实：$84.7
              million 解释最初监管机制，$96 million 是更适合采用的最终轮规模锚点。


              这一细节很重要，因为 2025 年 7 月 Series E1 更像增量，而非转折。CXO Digitalpulse 和 Digital Health News 都将其描述为 Peak XV 与
              Hummingbird 参与的 $4 million 桥接式融资，按平价估值发行，同时伴随授权资本增加，并明确称这笔钱位于一轮更大且仍在进行的融资之内。E1 后累计融资约 $181
              million，公司仍需为八家自有医院、约 450 张床位，以及声称到 2025 年 12 月自有产能翻倍提供资金。当一家企业 FY24 亏损 INR 381 crore 时，$4 million
              桥接本身无法消除融资依赖；它主要为管理层讨论中的更大 $50-100 million 轮融资争取时间。
