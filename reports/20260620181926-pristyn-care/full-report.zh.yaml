      - number: '8.3'
        title: 上市医院连锁可为估值划出区间，但只能作为推导的市值 / 收入
        blocks:
          - type: paragraph
            body: >
              印度上市医院连锁是最好的开源基准组，因为它们披露的信息足以做可重复计算，即便它们不是商业模式孪生。2026-06-20 抓取的 Screener 页面显示了 Apollo
              Hospitals、Fortis、Narayana Health、HCG、Max Healthcare 和 Aster DM Healthcare
              的当前市值和收入字段。把这些视作当前股权价值除以过去收入，可以推导出一个大致区间：HCG 约 6.7x、Narayana 约 9.7x、Apollo 约 13.1x、Aster 约 16.0x、Max 约
              37.1x、Fortis 约 40.6x。这明确不是 EV/revenue，因为没有调整债务、现金和少数股东权益；也不是与手术市场平台的同口径比较。它只是留存资料中最干净的公开倍数框架。


              这个区间足够宽，Pristyn 隐含 18-19x
              过去收入的标记在数学上可以成立，但质量门槛很关键。区间上端属于已经上市、持续被跟踪、并有定期披露支撑的公司，而不是三年前的独角兽轮加一笔平价桥轮。Apollo、Narayana、HCG 和 Aster
              都有公开年报或投资者关系触点，让外部投资者检查备案；Pristyn
              仍没有针对股权结构经济条款或医院队列回报的开源等价物。因此，可比公司解读是有层次的：从纯倍数数学看，当前标记并非自动荒谬，但要配得上这个倍数，Pristyn 需要承担的披露负担远高于现状。
