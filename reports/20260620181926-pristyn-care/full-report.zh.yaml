companyProfile:
  summary: >-
    Pristyn Care 是一家总部位于 Gurugram 的私营医疗公司，2018 年由 Harsimarbir Singh、Dr. Vaibhav Kapoor 和 Dr. Garima Sawhney
    创立。公司围绕择期和二级护理手术建立品牌，通过合作医疗机构网络，以及近年新增的自有医院，协调从医生发现、诊断、保险文件、入院、出院到随访的完整患者旅程。公开报道支持公司在 2021 年 12 月升至约 $1.4 billion
    的独角兽估值，并在 2025 年 7 月完成一笔规模较小、按上一轮平价定价的 $4 million Series E1
    桥接融资；同期公司仍录得大额亏损，并继续扩张自有临床基础设施。置身规模庞大且碎片化的印度手术市场，这家公司具备战略相关性，但外部投资者仍缺少达到 IPO 级别的经济性、治理条款和质量控制披露。
