      - number: '3.2'
        title: Apollo、Fortis、Medanta 和 HCG 是更大的护理交付体系，但解决的是不同工作流
        blocks:
          - type: paragraph
            body: >-
              最强的在位对标是上市医院网络，但它们的竞争姿态不同于 Pristyn。Apollo 的官方年报页面确认其拥有完整上市公司披露体系，设施页面列出横跨大都市和一线城市的广泛多城医院布局，这与 Pristyn
              的轻资产合作产能模式相反。Fortis 表示其在 12 个邦运营 36 家医疗机构，拥有 6,000 多张运营床位和 400 家诊断实验室；Medanta
              描述一个医生主导的网络，超专科医生在其医院全职且独家工作，网站还突出印度六家以上医院和可观的国际患者流。HCG Hospitals 同样把自己定位为多专科和三级护理运营商，每年治疗 1,30,000
              多名患者，拥有 575 多名医生和 24 个综合护理单元。因此，这些运营商在自有基础设施、三级护理广度和公开披露上胜过 Pristyn，但保留的官方证据没有显示它们提供 Pristyn
              大力营销的同类端到端择期手术协调层。换句话说，Apollo、Fortis、Medanta 和 HCG 是比 Pristyn 更强大的机构，但本报告没有文件证明它们提供 Pristyn
              完全相同的产品化工作流：数字获客、协调员牵头转化、合作医院执行，以及针对二级护理手术的标准化术后导航。
