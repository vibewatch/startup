      - number: '2.3'
        title: 支撑计划性手术采用的增长驱动
        blocks:
          - type: paragraph
            body: >-
              尽管精确市场规模没有公开钉住，多项独立信号仍支持 Pristyn 可触达需求持续增长。保险保费仍在增长，PM-JAY 扩大了公共融资基础，IBEF
              预计二、三线城市的医疗需求增速将快于大都市。从手术项目看，白内障提供了最干净的公开择期手术证明点：WHO
              强调全球白内障负担，印度本土研究则显示，即便在成熟手术类别中，未治疗需求仍然可观。更广泛的手术数据也指向同一方向。印度全国手术率仍远低于 Lancet Commission
              基准，意味着数千万例未满足手术需求。护理形态也在以符合 Pristyn 模式的方式变化。Apollo Spectra 证明短住院择期手术可以被组织成跨城市网络产品，Apollo 和 Max
              则把微创、机器人和认证驱动的手术定位为信任与结果主张。合在一起，这些信号支持一个判断：Pristyn 正参与一个真实的需求池，该需求池由积压清理、城市专业化和便利性驱动的程序化护理塑造，而不是从零发明一个市场。
