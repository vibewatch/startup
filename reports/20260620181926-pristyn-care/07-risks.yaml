- id: r-leadership-attrition-bangladesh-and-adverse
  title: Leadership attrition, Bangladesh exit, and adverse signal quality
  body: 'The people and execution story is where confirmed risks and allegations have to be kept separate. Confirmed first: Wikipedia preserves the September 2022 co-founder backlash around Harsimarbir Singh''s published interview hacks, and CNBC confirms a meaningful 2024 layoff tied to profitability and IPO preparation. Medical Buyer also reports recent senior-executive resignations and a Bangladesh retreat less than a year after launch. Those are real operating-stress signals. What is less settled is the severity of earlier cuts and the full reason stack behind the international withdrawal. Some inaccessible or teaser-only startup-media pages have circulated claims of larger earlier layoffs, but the fetched accessible corpus does not let that number be retained as confirmed fact, so it should stay in the allegation bucket. Bangladesh is similar. The confirmed element is the exit itself: Medical Buyer says Pristyn entered in August 2023 with plans for five centres, 200 hires, and a Rs
    100-crore expansion program, then put operations on hold after July 2024 civil unrest. The disputed element is causation. The company''s line emphasised employee safety and political disruption; the same article separately attributed the retreat to lower-than-expected sales according to unnamed sources. That distinction matters because one story is temporary exogenous disruption and the other is a more serious indictment of model portability outside India. The article''s extra detail—that capital was reallocated back to India while Pristyn pursued owned or more tightly controlled super-speciality hospitals—also suggests strategy drift away from a purely asset-light narrative. Netting it out, leadership and expansion risk should be rated high not because the company is proven broken, but because it has already shown a pattern of labour cuts, founder-culture turbulence, strategy resets, and evidence gaps large enough to complicate any pre-IPO risk memo.'
