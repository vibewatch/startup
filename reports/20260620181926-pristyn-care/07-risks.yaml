- id: r-financial-model-competition-and-capital
  title: Funding, burn, competition, and revenue-quality risk
  body: 'Pristyn''s capital history is strong enough to show investor appetite, but the more current public evidence is much less comfortable. Historical coverage and profiles support a clean funding ladder from the 2019 Series B through Tiger''s 2021-led Series D and the December 2021 Series E that produced a US$1.4 billion unicorn valuation. The challenge is what happened after the capital was raised. Entrackr and CNBC together support that FY23 total income reached roughly ₹494 crore with operating revenue around ₹453 crore, but Entrackr also reports a roughly ₹383 crore loss and says the company still spent nearly ₹1.94 to earn one rupee of operating revenue. Medical Buyer then reported FY24 revenue of ₹600.5 crore with net loss still around ₹381 crore. That is progress on scale, not a clean escape from burn. The company has therefore shifted its public narrative from hypergrowth to profitability, city prioritisation, and eventual IPO preparation. CNBC''s March 2024 reporting is the
    clearest current signal: 120 jobs were cut, six cities were exited, and management framed the move around profitability before going public over the next few years. The competitive angle is subtler but still real. The Lybrate acquisition was explicitly about entering primary care and online consultation, which implies Pristyn wanted more upstream control over patient funnel creation rather than relying only on downstream surgery conversion. That is a defensive move in a market where traditional hospital chains, insurers, and digital health platforms can all compete for the same patient journey. Two especially important diligence gaps remain unresolved in the fetched public record. First, none of the accessible sources disclose the company''s revenue-recognition policy at the level needed for IPO-grade comfort. Second, the GST treatment of the coordination layer versus exempt healthcare services also remains unresolved. Those are not small accounting footnotes; they directly affect revenue
    quality, compliance, and any future offering memo.'
