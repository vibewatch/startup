  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory / legal risk register coverage
    missingEvidence: A partner-hospital-by-state license map covering every major operating city, plus any internal tax and privacy memos.
    whyItMatters: Without the underlying partner roster and legal memos, the regulatory register can only cover public top risks rather than an exhaustive compliance census.
    diligencePath: Request the full partner-hospital list, state-license status, GST memos, and privacy compliance register from management.
    relatedQuestionRefs:
    - QR007
    - QR008
    - QR009
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: revenue-recognition policy
    missingEvidence: Auditor-approved accounting policy showing when Pristyn books coordination fees, bad-debt treatment, and any gross-vs-net judgments.
    whyItMatters: Revenue timing and quality are central to burn, valuation, and IPO readiness, and the fetched public corpus does not disclose the policy.
    diligencePath: Obtain statutory financial statements, notes to accounts, and an accounting-policy memo before relying on any IPO narrative.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: GST treatment of coordination layer
    missingEvidence: Indirect-tax analysis showing whether Pristyn books exempt healthcare revenue, taxable service revenue, or a mixed treatment by line item.
    whyItMatters: A tax reclassification could alter net revenue, margin, and retrospective liability, especially before an IPO.
    diligencePath: Request GST filings, indirect-tax counsel memo, and any notices or audits for the last three fiscal years.
    relatedQuestionRefs:
    - QR027
  - type: missing-source
    severity: material
    topic: Pristyn-specific negligence or NMC actions
    missingEvidence: Court dockets, consumer-commission searches, insurer disputes, and any NMC or state-medical-council disciplinary records referencing Pristyn or key surgeons.
    whyItMatters: The legal environment is clearly active, but the absence of named Pristyn cases in the fetched corpus cannot be mistaken for proof that none exist.
    diligencePath: Run paid court and consumer-forum searches, plus NMC/state medical council checks, across Pristyn entity names and leading clinicians.
    relatedQuestionRefs:
    - QR013
  - type: private-evidence-only
    severity: material
    topic: surgeon credentialing and partner audit process
    missingEvidence: Written surgeon onboarding criteria, partner-hospital quality audits, adverse-event reviews, and complaint-resolution SLAs.
    whyItMatters: Clinical quality control is the core operating risk in a branded but partner-delivered surgery model.
    diligencePath: Request QA committee materials, partner scorecards, offboarding rules, and insurer denial dashboards.
    relatedQuestionRefs:
    - QR014
  - type: access-blocked
    severity: material
    topic: earlier layoff history
    missingEvidence: Reliable accessible reporting that independently confirms or disproves the larger pre-2024 layoff numbers circulating in startup-media coverage.
    whyItMatters: Labour-stress intensity affects culture, hiring, and the credibility of the 2024 profitability story.
    diligencePath: Use subscription access or internal HR records to reconcile 2022/2023 layoff counts and severance outcomes.
    relatedQuestionRefs:
    - QR006
  - type: conflicting-data
    severity: material
    topic: current headcount after restructuring
    missingEvidence: A current 2026 employee count broken down by cities, hospitals, and clinical versus non-clinical staff.
    whyItMatters: The public record currently shows inconsistent employee numbers, which obscures productivity and overhead analysis.
    diligencePath: Request updated org charts, headcount bridge since March 2024, and city-level staffing metrics.
    relatedQuestionRefs:
    - QR028
  - type: conflicting-data
    severity: material
    topic: Bangladesh exit causation
    missingEvidence: Board-level post-mortem or management memo separating political-disruption effects from commercial underperformance and capital-allocation reasons.
    whyItMatters: If the exit was mainly exogenous, re-entry may be possible; if it reflected weak unit economics, model portability is worse than management suggests.
    diligencePath: Request the Bangladesh launch model, monthly performance, and closure memo; if unavailable, obtain subscription access to longer-form investigative reporting.
    relatedQuestionRefs:
    - QR021
    - QR022
