- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Clinical-liability blowup
    - Any named negligence suit, NMC action, or repeated adverse patient stories
    - First credible case involving death, wrong-site surgery, or systemic complaint cluster
    - Pause underwriting until liability allocation and remediation are documented
  - - Revenue-quality doubt
    - Disclosure of aggressive booking policy or material GST dispute
    - Fees booked before surgery / collection or tax position challenged by authorities
    - Re-cut revenue, margin, and IPO-readiness assumptions
  - - Burn not genuinely improving
    - Losses stay near FY24 levels despite revenue growth and layoffs
    - Another year of ~₹350 crore-plus losses or worsening spend-per-rupee economics
    - Treat 2024 layoffs as signal of pressure, not proof of discipline
  - - Partner-control weakness
    - Evidence of insurer denials, complaints, or partner-hospital churn rising together
    - Multi-quarter increase in complaint intensity without published QA response
    - Assume the brand is scaling faster than operating control
  - - Data-governance failure
    - Patient-data leak, DPB inquiry, or privacy-policy reversal
    - Any breach affecting surgery records or consent workflows
    - Re-rate legal and reputational risk upward immediately
  - - Strategy drift / capital intensity
    - Owned-hospital expansion accelerates without clear returns while asset-light narrative weakens
    - Capex step-up plus another failed geography or city retreat
    - Lower valuation tolerance and demand a tighter capital-allocation memo
  notes: These triggers convert broad concern into decision-grade checks that can be monitored before any private or public financing event.
