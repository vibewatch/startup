evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, liquidation preferences, information rights, and post-Series E1 cap-table detail.
    whyItMatters: >-
      Later chapters need governance and dilution ground truth to assess investor control, refresh risk, and IPO
      readiness.
    diligencePath: Request the latest cap table, board deck, shareholder agreement summary, and board observer list from management.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: footprint-definition
    missingEvidence: >-
      A reconciled operating-footprint schedule distinguishing active cities, partner hospitals, owned hospitals,
      clinics, SEO pages, and surgeon panel counts.
    whyItMatters: >-
      The public record ranges from 200 to 800 partner hospitals and from 30 to 45+ cities, which affects diligence on
      scale quality and unit economics.
    diligencePath: >-
      Obtain a dated operating-footprint export from the company and reconcile it to website pages, partner contracts,
      and owned-hospital assets.
    relatedQuestionRefs:
      - QO017
      - QO025
  - type: missing-source
    severity: minor
    topic: total-raised
    missingEvidence: A full round-by-round funding ledger including any seed, bridge, or omitted rounds between Series B and Series D.
    whyItMatters: >-
      Public articles support major rounds, but not the complete historical capital stack or a company-certified
      lifetime amount.
    diligencePath: Request a financing history table from finance or inspect MCA/share-allotment filings to close the gap.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: surgeon-structure
    missingEvidence: >-
      A breakdown of how many surgeons are employees, retained contractors, or exclusive affiliates, with geographic
      coverage.
    whyItMatters: >-
      The 400+ surgeon claim is central to operating leverage and clinical consistency, yet the engagement model is not
      public.
    diligencePath: Ask for HR or credentialing records that classify surgeons by employment type and active status.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: minor
    topic: bangladesh-exit
    missingEvidence: >-
      Management commentary quantifying capital lost, team wind-down cost, and whether any Bangladesh relaunch remains
      active.
    whyItMatters: >-
      The Bangladesh exit is a cautionary milestone, but its financial impact and strategic lesson are not fully
      disclosed.
    diligencePath: Request post-mortem notes or board materials covering international expansion and shutdown economics.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO004
  - type: access-blocked
    severity: material
    topic: pmjay-procedure-tariffs
    missingEvidence: >-
      Current PM-JAY package-level tariffs for piles, hernia, cataract, ENT, and similar Pristyn-relevant procedures
      mapped against private rack rates.
    whyItMatters: >-
      Without tariff detail, it is hard to judge which elective specialties are volume-supportive but margin-destructive
      for private partners.
    diligencePath: >-
      Pull the current PM-JAY HBP tariff tables directly from NHA or management's package-level reimbursement data and
      compare them city by city with partner-hospital charge sheets.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: insurance-segmentation
    missingEvidence: >-
      A current public table splitting employer-group, retail, and government-scheme covered lives and claims relevant
      to elective surgery.
    whyItMatters: >-
      The growth mix between employer-led cover and retail insurance changes how scalable Pristyn's cashless pipeline is
      outside PM-JAY.
    diligencePath: >-
      Obtain IRDAI annual-report tables or insurer management data that break covered lives and claims by group, retail,
      and government health segments.
    relatedQuestionRefs:
