            body: >-
              Public discovery surfaces suggest Pristyn built a large acquisition and routing machine around surgery
              intent. The city-doctor roster, location permission, app-store copy, and near-me sitemap all support a
              workflow where patients can discover specialists by disease, procedure, city, or proximity. The web estate
              behind that motion is large. Root sitemaps enumerate more than twenty specialty families, near-me landing
              pages, city pages, and blog properties, while the page sitemap exposes city × procedure-cost pages that
              look designed for high-intent search capture. This is likely one of Pristyn's most important moats: it
              converts fragmented symptom, condition, and price-search traffic into coordinator-assisted consultations.
              But the teleconsultation layer is less clean than the top-of-funnel surface. The company sitemap still
              lists online-consultation URLs by specialty, yet the old consultation path now resolves to the homepage
              and a generic doctor-consultation page returns 404. Meanwhile, the app and store listings still promote
              online consultation. The most reasonable interpretation is not that teleconsultation disappeared
              completely, but that the dedicated web experience was reorganized or deprioritized while app-led
              consultation remained live. That inconsistency is a real product-quality gap because it makes channel
              reliability harder to judge from public evidence.
