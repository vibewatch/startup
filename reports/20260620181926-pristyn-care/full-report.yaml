  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Contradictory Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care should be analysed against a narrower market than India's full healthcare economy. IBEF's
              sector page is useful as a macro sentiment indicator because it frames healthcare as one of India's
              largest industries and puts hospitals at nearly 80% of the sector, but that same page also rolls together
              hospitals, insurance, devices, telemedicine, tourism, and other categories that do not map cleanly to
              Pristyn's workflow. For valuation or adoption work, the more relevant boundary is planned secondary and
              tertiary surgery delivered through private hospitals, day-care centres, and partner-surgeon networks,
              especially where patients can move through diagnosis, cashless approval, or EMI-assisted self-pay without
              a prolonged inpatient stay. Official NHA and HMIS evidence makes the contradiction explicit rather than
              incidental. India still spends heavily out of pocket, the official data series does not publish a national
              elective-surgery market table by procedure, and the country's measured surgical rate remains far below
              global-surgery adequacy thresholds. The right conclusion is not that the market is small; it is that
              public evidence supports multiple constrained sizing lenses rather than one clean TAM headline. Investors
              should preserve the gap between IBEF's promotional macro number, official health-financing accounts, and
              the still-unpinned elective surgery slice that matters most for Pristyn.
