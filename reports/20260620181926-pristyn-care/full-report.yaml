              200 hospitals, and 30+ cities in December 2024, while IPO Central described 150 clinics, 200 hospitals, 30
              cities, and 400+ surgeons in January 2025. The best interpretation is not that one figure set is
              necessarily false, but that Pristyn is using different denominators across owned hospitals, partner
              hospitals, clinics, city marketing pages, and surgeon-panel definitions. The homepage numbers should
              therefore be carried forward as company claims, not as fully reconciled operating truth.
