              The strongest public evidence for scale sits in broad healthcare headlines, PM-JAY throughput, and surgery
              backlog studies rather than in one clean elective-surgery market table. Tariff stress, household cash
              burden, and missing procedure-level public data all make precise TAM claims fragile.
