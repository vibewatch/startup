  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Pristyn's core competitor is the fragmented elective-surgery status quo, not only another app
        blocks:
          - type: paragraph
            body: >-
              The official Pristyn surfaces present a business that is neither a conventional hospital chain nor a
              generic doctor-booking app. The about page says the company manages the full surgery journey from doctor
              discovery and clinic booking through diagnostics, insurance paperwork, home-to-hospital commute,
              admission-discharge, and follow-up consultation, while the homepage adds operational specifics such as
              zero-paperwork handling, dedicated care coordinators, free post-discharge drop, post-IPD follow-up
              consultation, and 24x7 assistance. That matters competitively because most Indian alternatives still
              require patients to stitch together surgeon search, hospital selection, payer interaction, transport, and
              post-op follow-up themselves. Pristyn also claims a hybrid supply model rather than pure referral
              arbitrage: the homepage and Google Play listing both say it operates through 150+ clinics and 800+ partner
              hospitals with 400+ super-specialist surgeons working exclusively for the company, serving 2M+ patients
              across 45+ cities. In practical buyer terms, that makes the closest comparison class “surgical
              coordination layer on top of partner infrastructure” rather than a simple hospital or teleconsultation
              product. The digital funnel is also unusually important. Pristyn's app, symptom-checker page, and XML
              sitemaps show ABHA card creation, Redcliffe-linked lab collection, symptom-led triage, and a large
              city-treatment landing-page footprint, which together imply a strong intent-capture engine before the
              patient ever arrives at a hospital.
