          The decisive underwriting inputs are absent, so the confidence belongs to the facts, not to the valuation
          call.
      - - Risk rating
        - high
        - Losses remain heavy, bridge capital was small, and adverse execution / negligence narratives remain live.
        - A successful larger round or audited proof of hospital economics could reduce the risk rating.
      - - Valuation stance
        - stretched
        - >-
          Implied trailing-revenue multiple is about 18-19x on FY24 revenue versus a broad public-comp band of about
          6.7-40.6x.
        - >-
          The comp math is inferred and non-like-for-like, so this is a caution signal rather than a definitive
          overvaluation verdict.
      - - Decision implication
        - Wait for diligence or price reset
        - >-
          The next round, audited financials, and hospital-cohort metrics are the cleanest catalysts that can move the
          call.
        - Entering purely off the preserved unicorn mark would rely too heavily on management narrative.
    notes: >-
      The chapter's call is intentionally price-sensitive; it is not a general statement that the business lacks
      strategic merit.
