      - - Narayana Health
        - Public hospital chain
        - ₹38,393 crore market cap; ₹3,975 crore revenue; ~9.7x inferred market-cap-to-revenue
        - Closer to conventional care-delivery economics and disclosure standards
        - Much more mature operating model and listed-company governance
      - - HCG Oncology
        - Public specialty hospital chain
        - ₹9,122 crore market cap; ₹1,365 crore revenue; ~6.7x inferred market-cap-to-revenue
        - Specialty-care operator with a narrower scale and cleaner public disclosures
        - Oncology chain is not a direct elective-surgery analogue
      - - Aster DM Healthcare
        - Public hospital chain
        - ₹41,937 crore market cap; ₹2,616 crore revenue; ~16.0x inferred market-cap-to-revenue
        - Demonstrates that a premium public multiple is possible for listed care-delivery assets
        - Mix and geography differ materially from Pristyn
      - - Max Healthcare
        - Public hospital chain
        - ₹1,06,546 crore market cap; ₹2,874 crore revenue; ~37.1x inferred market-cap-to-revenue
        - Shows how a top-tier public quality premium can stretch valuation bands
        - Very high public-market quality premium; not appropriate as a base-case comp
      - - Fortis Healthcare
        - Public hospital chain
        - ₹72,699 crore market cap; ₹1,792 crore revenue; ~40.6x inferred market-cap-to-revenue
        - >-
          Illustrates that quoted hospital multiples can be very high when investors price strategic assets and
          optionality
        - Highest-multiple row in the set; likely too generous for a still-private, still-lossmaking operator
      - - MediBuddy
        - Private healthtech
        - >-
          Close to $500M valuation in Apr-2024; management said FY24 revenue crossed ₹1,000 crore; Entrackr later showed
          FY25 operating revenue ₹724.6 crore; implied rough range ~4-6x
        - Useful private healthtech reference for a digital-plus-care-services platform
        - >-
