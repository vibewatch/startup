        title: Patient Segments, Geographic Footprint, and Volume Proxies
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care is best understood as a consumer health-services orchestrator rather than only a clinic
              chain. Official surfaces consistently describe a service for elective and secondary-care surgery patients
              who need doctor discovery, consultations, insurance paperwork, hospital admission coordination,
              surgery-day transport, and post-operative follow-up. The likely economic buyer is either the patient or
              family caregiver, with payment routed through self-pay, cashless insurance, reimbursements, or no-cost EMI
              depending on case mix. Current official scale claims are large but heterogeneous: the homepage and Google
              Play listing cite 150+ clinics, 800+ partner hospitals, 400+ super-specialist doctors or surgeons, and
              coverage across more than 45 cities, while the company about page still describes six metro cities plus 30
              tier-2 and tier-3 cities. Entrackr's 2026 hospital-expansion snippets add bigger operating proxies—300,000
              surgeries over five years, more than 3 million patient interactions annually, and 100,000 surgery
              registrations per month—but these are company statements relayed by media, not audited utilization
              metrics. The customer map is also broadening beyond the company's original proctology/urology core.
              Official hospital and app surfaces now span orthopedics, ophthalmology, dermatology, fertility, neurology,
              nephrology, pulmonology, and oncology, implying a customer base that increasingly includes higher-acuity
              and older-age cohorts such as cataract and knee-replacement patients, not just younger laser-surgery
