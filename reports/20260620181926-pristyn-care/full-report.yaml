      - number: '1.3'
        title: Funding history, unicorn context, and investor base
        blocks:
          - type: paragraph
            body: >-
              The retained funding record shows Pristyn Care climbing quickly from early venture rounds into the unicorn
              cohort, but with thinner visibility after 2021. Inc42 says Sequoia Capital India led a $4 million Series A
              in June 2020 before a $12 million Series B that added Hummingbird Ventures, Greenoaks Capital, and
              AngelList. By April 2021, Tiger Global led a $53 million Series D at more than a $550 million valuation,
              with Sequoia, Hummingbird, and Epiq returning. The company then reached unicorn status in December 2021
              when Economic Times, Moneycontrol, and IBEF reported a roughly $96 million to $100 million Series E at
              about a $1.4 billion valuation, with Sequoia, Tiger, Winter Capital, Epiq, Hummingbird, Trifecta, and
              angels in the mix. July 2025 looks very different: Entrackr and Medical Buyer describe a $4 million Series
              E1 bridge priced flat to the prior round and earmarked for owned-hospital expansion, which suggests
              continued investor support but not a new upward valuation reset. Public disclosures still do not fully
              reconstruct lifetime capital or precise post-E1 dilution.
