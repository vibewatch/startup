        - id: records
          label: Records and ABHA
          detail: >-
            Document upload, vaccination or test-record viewing, treatment-progress images, and ABHA onboarding support
            identity and data collection.
        - id: coordinator
          label: Coordinator operations
          detail: >-
            Care coordinators translate patient intent into doctor matching, insurance handling, transport, admission,
            discharge, and follow-up actions.
