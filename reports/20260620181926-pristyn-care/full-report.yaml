      - number: '1.2'
        title: Founders, leadership dependence, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founder story is unusually important because public operating identity still clusters around the
              original trio. Harsimarbir Singh appears most often as the commercial and strategic voice, while Dr.
              Vaibhav Kapoor and Dr. Garima Sawhney supply the medical credibility behind the original surgical-care
              proposition. That background helps explain the company’s early positioning around affordable advanced
              surgery and its later move into a broader secondary-care network. What is less visible is formal
              governance. None of the retained public sources provides a current board roster, post-Series E1
              investor-rights map, or a clean picture of how much decision-making authority sits with the founders
              versus investors such as Peak XV, Tiger Global, or Hummingbird. The 2024-2025 public record instead
              emphasizes churn: multiple senior executives were reported to have departed, and the company’s own media
              page highlights hospital and profitability milestones rather than institutional governance disclosures.
              The result is a business with strong founder-market fit but limited board-level transparency.
