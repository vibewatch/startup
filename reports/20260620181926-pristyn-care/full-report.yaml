  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Pristyn
    rows:
      - - Broad Indian healthcare economy
        - Hospitals, insurance, devices, telemedicine, medical tourism, diagnostics, and related services
        - None at this layer; it is the top macro bucket
        - Government, households, insurers, employers, investors
        - Useful as sentiment and upper-bound context only
      - - Private secondary and tertiary hospital care
        - Inpatient and day-care procedures, specialist consultations, diagnostics around surgery, hospital admissions
        - Primary public health, pharma manufacturing, pure insurance revenue
        - Households, private insurers, employers, PM-JAY where accepted
        - Core operating arena for Pristyn partners
      - - Elective and short-stay surgery
        - Planned cataract, proctology, laparoscopy, ENT, urology, gynecology, and similar procedures
        - Emergency trauma, ICU-led critical care, chronic medicine dispensing
        - Patient-family decision unit plus surgeon and reimbursement gatekeeper
        - Closest public-market boundary for Pristyn
      - - PM-JAY reimbursed planned procedures
        - Government-funded admissions in empanelled hospitals where package and eligibility fit
        - Premium urban rack-rate procedures above scheme economics
        - State or central public payer
        - Relevant volume rail but not always an attractive unit-economics rail
      - - Status-quo substitutes and delay
        - Watchful waiting, local clinics, informal providers, or treatment deferral because of cost or stigma
        - Definitive surgical resolution
        - Household budget and access constraints dominate
        - Main boundary limiter for realized demand
    notes: >-
      The boundary intentionally narrows from the broad healthcare economy toward planned hospital-delivered surgery
      because Pristyn monetizes a coordinated elective-care workflow rather than the whole health system.
