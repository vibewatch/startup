chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and care model
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care should be anchored in this report as a Gurugram-based healthcare platform founded in 2018 by
              Harsimarbir Singh, Dr. Vaibhav Kapoor, and Dr. Garima Sawhney. The strongest official evidence does not
              come from a single corporate profile page with all basics in one place, so chapter one has to synthesize
              the official website with high-reputation reporting. Official pages frame the company as a patient-journey
              business for elective or secondary-care surgeries rather than a hospital system in the legacy sense:
              Pristyn says it helps patients discover the right doctor, book appointments, complete diagnostics, process
              insurance, travel to the hospital, and navigate discharge and follow-up. The privacy policy identifies the
              legal entity as GHV Advanced Care Private Limited, while third-party reporting consistently locates
              headquarters in Gurugram or Gurgaon, Haryana. For diligence purposes, this is best treated as an
              India-focused elective-surgery orchestrator whose public identity now mixes marketplace, care-navigation,
              and hospital-owner characteristics.
