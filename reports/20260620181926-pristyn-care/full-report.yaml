        title: Trust controls, moats, and product gaps
        blocks:
          - type: paragraph
            body: >-
              Pristyn's strongest product advantages appear to be operational rather than purely technical. The business
              combines high-intent SEO, city-level specialist discovery, a cross-platform patient app, ABHA onboarding,
              and a coordinator-led service layer that handles messy surgery logistics such as insurance, travel, and
              follow-up. That is a stronger patient-acquisition and conversion bundle than a normal clinic website or
              simple telemedicine app. Trust controls are also at least partially surfaced: the privacy policy documents
              permissions and consent language, the ABHA page explains consent-based records, and the refund policy
              defines a manual escalation path through the patient experience team. Even so, the major gaps are
              material. The privacy policy also allows retargeting and profiling around health-service usage; there is
              no public trust center that reconciles those practices with modern health-data expectations. Public
              sources do not name insurer APIs, TPAs, hospital HIS or EMR integrations, or ABDM write-back capability.
              The human support model that likely improves conversion may also be the same model that creates
              operational cost pressure, especially when adverse reporting describes layoffs, cash-flow strain, and a
              need to prune cities or categories. In short, the product moat is believable, but the automation moat is
              not yet publicly proven.
