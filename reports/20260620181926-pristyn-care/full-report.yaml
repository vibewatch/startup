            title: The real boundary is a coordinated elective-care workflow
            body: >-
              Pristyn is not selling the whole hospital stack. It is monetizing the coordination layer that turns a
              clinically indicated planned surgery into a completed case across diagnosis, hospital routing, payer
              approval, admission, discharge, and follow-up.
