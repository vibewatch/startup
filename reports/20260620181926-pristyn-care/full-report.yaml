  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Larger round prices below the flat bridge
        - Any priced round below ₹10,038.16 per share or below the preserved unicorn mark
        - Converts the bridge from validation to temporary price support
        - Move from stretched to broken thesis; revisit supportable value using bear-case range
      - - Audited revenue misses the implied growth burden
        - FY25 / FY26 audited revenue does not materially exceed the FY24 base or quality of revenue weakens
        - 18-19x trailing multiple stops looking like a forward-growth bet and starts looking stale
        - Avoid paying unicorn price without a material discount
      - - Owned hospitals do not publish or demonstrate utilization economics
        - No occupancy / ARPOB / payor-mix / contribution disclosure, or disclosed figures are weak
        - Removes the main argument for a premium over private digital-health comps
        - Re-rate closer to lower hospital-chain or digital-health comps
      - - Care-quality / negligence narrative widens
        - More formal complaints, regulatory actions, or repeat investigative reporting
        - Governance and brand discount widen; revenue durability becomes less secure
        - Increase downside weighting and escalate legal / compliance diligence
      - - Cash need remains acute after the bridge
        - Another small insider round substitutes for the larger raise, or runway remains opaque
        - Suggests price preservation matters more than fundamental financing sufficiency
        - Treat valuation as fragile until the treasury picture is disclosed
    notes: These are monitorable diligence triggers rather than deterministic forecasts.
    claimRefs:
      - CV007
      - CV015
      - CV019
      - CV020
      - CV021
      - CV022
      - CV037
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Larger round terms
        - >-
          Lead investor, round size, post-money, liquidation preferences, anti-dilution terms, and secondary
          participation
        - The bridge preserved price but not enough economics to underwrite the mark
        - Request term sheet set from management and lead investor counsel
      - - Audited FY25 and FY26 revenue quality
        - Statutory audited revenue, gross vs net recognition, and surgery-business versus product / other mix
        - The multiple only makes sense if the denominator is robust and recurring enough
        - Pull audited statements and revenue-recognition note
      - - Cash runway and debt
        - Cash balance, monthly burn, debt schedule, covenant burden, and 18-month treasury forecast
        - Needed to judge whether the bridge merely delayed a harder financing problem
        - Obtain treasury dashboard and latest management accounts
      - - Hospital cohort economics
        - Occupancy, ARPOB, payor mix, case mix, contribution margin, and payback by owned-hospital cohort
        - This is the core missing proof for a premium hospital-asset narrative
        - Request cohort P&Ls and operating dashboards for all owned hospitals
      - - Cap table and preference stack
        - Fully diluted ownership, ESOP overhang, liquidation waterfall, and investor rights
        - A unicorn headline can still hide unattractive entry economics
        - Review cap table model with legal counsel and finance
      - - Quality / compliance record
        - >-
          Complaint log, litigation / claim status, GST / insurance correspondence, and hospital accreditation / audit
          trail
        - Adverse narratives deserve direct rebuttal or confirmation before underwriting a premium mark
        - Run legal, medical-quality, and regulatory diligence in parallel
    notes: >-
      None of these asks are optional if the investor intends to rely on the preserved unicorn mark rather than a
      discounted reset.
    claimRefs:
      - CV007
      - CV015
      - CV019
      - CV020
      - CV021
