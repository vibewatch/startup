companyProfile:
  summary: >-
    Pristyn Care is a Gurugram-based private healthcare company founded in 2018 by Harsimarbir Singh, Dr. Vaibhav
    Kapoor, and Dr. Garima Sawhney. It built its brand around elective and secondary-care surgeries by coordinating the
    full patient journey across doctor discovery, diagnostics, insurance paperwork, hospital admission, discharge, and
    follow-up through a network of partner providers and, more recently, owned hospitals. Public reporting supports a
    rise to a roughly $1.4 billion unicorn valuation in December 2021 and a smaller flat-priced $4 million Series E1
    bridge in July 2025 while the company continued to post heavy losses and expand owned clinical infrastructure. The
    business looks strategically relevant inside a large, fragmented Indian surgery market, but outside investors still
    lack IPO-grade disclosure on economics, governance terms, and quality control.
