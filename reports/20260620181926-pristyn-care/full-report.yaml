      - number: '3.3'
        title: Practo, MediBuddy, and Apollo 24|7 overlap on traffic acquisition and outpatient navigation
        blocks:
          - type: paragraph
            body: >-
              The digital-health competitors overlap with Pristyn most strongly at the top of funnel, not at the point
              of surgical execution. Practo's official homepage markets instant video consultation, confirmed
              appointments, lab tests, medicines, and even “safe and trusted surgery centers,” while its about page and
              Play listing make the real scale advantage clearer: online appointment booking at more than 9,000
              hospitals and clinics, online consultation across 20-plus specialties, and a network of 200,000-plus
              doctors across 70,000-plus clinics and hospitals including Apollo, Fortis, Max, and Manipal. That gives
              Practo a broad discovery and referral moat, but the retained sources do not show Practo employing
              surgeons, managing partner-hospital capacity, or offering Pristyn-style commute, insurance, admission, and
              follow-up orchestration. MediBuddy's public surface is even more general-purpose, centering on health
              checks, lab tests, online medicine, and doctor consultation; it looks more like a horizontal consumer and
              employer-health platform than a surgery-first company. Apollo 24|7 is strategically important because it
              suggests the Apollo ecosystem understands digital navigation, yet the official site returned a 403-blocked
              experience at fetch time, so this chapter can only confirm the existence of the channel threat, not its
              present feature depth. The result is a meaningful but bounded threat model: these platforms can own
              patient demand and multi-home referrals, while Pristyn still appears differentiated on actual
              elective-surgery conversion and hand-holding.
