      - number: '2.3'
        title: Growth Drivers Supporting Planned Surgery Adoption
        blocks:
          - type: paragraph
            body: >-
              Several independent signals support continued growth in Pristyn's addressable demand even though the exact
              market size is not publicly pinned. Insurance premiums are still growing, PM-JAY has broadened the
              publicly financed base, and IBEF expects faster healthcare-demand growth in tier-2 and tier-3 cities than
              in metros. On the procedure side, cataract provides the cleanest public elective-surgery proof point: WHO
              highlights the global cataract burden, while India-specific studies still find material untreated need
              even in an established procedure category. Broader surgery data points the same way. India's national
              surgical rate remains well below the Lancet Commission benchmark and implies tens of millions of unmet
              procedures. The format of care is also shifting in ways that align with Pristyn's model. Apollo Spectra
              demonstrates that short-stay elective surgery can be organized as a network product across multiple
              cities, while Apollo and Max position minimally invasive, robotic, and accreditation-led surgery as a
              trust and outcome proposition. Together these signals support the view that Pristyn is participating in a
              real demand pool shaped by backlog clearance, urban specialization, and convenience-led procedural care
              rather than inventing a market from scratch.
