  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Coordinator-led surgery workflow
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care's core product should be described as an operating workflow for elective and secondary-care
              surgery, not merely as an app. The homepage and about page both present a guided journey that starts with
              discovery, then moves through consultation, diagnostics, insurance paperwork, hospital commute, admission,
              discharge, and follow-up. The most distinctive layer is the human care coordinator. Official copy says
              coordinators provide end-to-end support and personally respond to service problems, while treatment pages
              add free cab or pick-up support, cashless or EMI help, and post-operative follow-up. That combination is a
              real conversion and trust advantage for surgery, where patients care as much about logistics and
              confidence as about doctor search. At the same time, the public record does not reveal the coordinator
              software stack, case-management tooling, or automation depth. Investors should therefore separate what is
              explicit from what is inferred: the guided workflow is explicit, but the internal CRM or orchestration
              engine behind it is not. The best current reading is that Pristyn's moat is a software-enabled service
              layer that wraps partner doctors and hospitals, with a meaningful human-in-the-loop component that may be
              harder to scale efficiently than marketing copy suggests.
