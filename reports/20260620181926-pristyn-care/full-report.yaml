            body: >-
              The patient app is broader than appointment booking. Official app pages, privacy disclosures, and
              marketplace listings all show a multi-function consumer surface with online consultation, specialist
              search, location-aware discovery, document upload, lab-test booking, OTP-based login, vaccination or
              test-record viewing, period and ovulation tools, pregnancy support, and ABHA creation. The privacy policy
              is unusually revealing because it discloses the permissions that make the workflow work: camera and audio
              for consultation, files and media for uploads, SMS for OTP autofill, storage for quick access, and image
              uploads for treatment-progress tracking and personalized recommendations. The ABHA page makes the
              digital-records ambition explicit, but only at an entry level. Pristyn clearly supports creating and
              downloading ABHA IDs and explains consent-based health-record sharing, yet the public evidence stops short
              of proving that partner hospitals or doctors are writing longitudinal records back into ABDM-compatible
              systems. That distinction matters. The patient app is credible as an intake, coordination, and
              record-collection layer; it is not yet publicly proven as a deeply integrated health-record exchange
              network.
