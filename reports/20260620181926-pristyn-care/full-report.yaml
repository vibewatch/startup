  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, monetization surfaces, and public traction anchors
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care started as an asset-light elective-surgery coordinator and still carries traces of that model
              in both official and third-party descriptions. The 2019 Series A coverage described a concierge-led system
              that leverages partner-hospital infrastructure, while the current homepage still markets advanced surgery
              across 50+ diseases, cashless insurance support, and broad clinic-plus-hospital reach rather than a narrow
              single-facility proposition. Public financial reporting also shows that the company is not purely a
              hospital-services business. Entrackr's FY23 review said healthcare services contributed 75% of operating
              revenue, with the remainder coming from products and advertising-linked lines, and Inc42's FY24 piece
              quantified that split further at INR 332 crore of services revenue and INR 226.7 crore of product revenue.
              That mix matters because it means the headline top line is a blended number spanning surgeries, products,
              and still-unclear ancillary monetization.


              The cleanest retained revenue anchors are INR 452.8-453 crore in FY23 and INR 600.5 crore in FY24. Those
              are large enough to show Pristyn built meaningful operating scale, but they do not settle revenue quality.
              The official site discloses consumer-facing consultation prices and insurance assistance, not realized
              surgery ASPs, cohort economics, or gross-versus-net booking policy. That is why the most useful reading of
              the revenue model is hybrid: patient acquisition and consultation are digitally mediated, care delivery
              still relies on surgeons and facilities, and the company's newer owned-hospital push is trying to capture
              more of the procedure wallet while tightening control over patient experience.
