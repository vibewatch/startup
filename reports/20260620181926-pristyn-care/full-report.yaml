      - number: '4.2'
        title: Loss profile, cost structure, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Public P&L coverage shows a business that scaled quickly but has not yet converted that scale into durable
              profitability. FY23 loss was about INR 382.5-383 crore on roughly INR 453 crore of operating revenue, and
              FY24 loss stayed almost flat at INR 381 crore even after revenue grew to INR 600.5 crore. The most
              constructive operating change is below the net-loss line: EBITDA loss improved to INR 345.3 crore in FY24
              from INR 352 crore, EBITDA margin improved to -57% from -71% to -78% in prior years, and advertising fell
              from about INR 220-231 crore in FY23 to INR 182.5 crore in FY24. Entrackr's FY23 math that Pristyn spent
              INR 1.94 to earn INR 1 of operating revenue also implies at least some discipline versus FY22's INR 1.97.


              Still, the public unit-economics picture is only partially improved. Services revenue was basically flat
              in FY24 while products grew sharply, so some of the top-line acceleration did not come from core surgery
              throughput. The company also wants investors to believe owned hospitals can fix margin quality: Elets
              reported the first hospital reached operating profitability within eight weeks, a far faster payback than
              the 12-24 month sector norm it cited. That claim is directionally encouraging but not enough for
              underwriting because Pristyn does not disclose capex per hospital, occupancy, ARPOB, payor mix, or
              contribution margin per procedure. Listed peers do: Max, Narayana, and Aster all publish occupancy, ARPOB,
              revenue, and EBITDA disclosures that make Pristyn's hospital-economics opacity stand out.
