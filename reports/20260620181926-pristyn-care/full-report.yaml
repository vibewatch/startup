  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and data-governance perimeter
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care sits inside several overlapping Indian healthcare regimes without publicly disclosing a
              single integrated compliance map. The operating model is clear enough: the official site and public
              profiles describe a surgery-coordination business spanning 150+ clinics, 800+ partner hospitals, and 400+
              specialist surgeons rather than a fully owned hospital chain. That scale matters because the Clinical
              Establishments Act 2010 applies at the facility level, yet the fetched public record still points to
              uneven state adoption, low penalties, and therefore uneven enforcement across partner locations. In
              practice, the company can scale faster than a brick-and-mortar chain, but it also inherits a fragmented
              hospital-compliance perimeter that investors cannot fully audit from public evidence alone. The
              consumer-law side is more concrete. Indian Medical Association v. V.P. Shantha and the Consumer Protection
              Act framework keep medical services inside a litigation route that patients can use even when care is
              delivered through private hospitals and specialists. That means Pristyn does not need a regulator-led
              crackdown to face downside; a sufficiently serious negligence or post-operative dispute can still become a
              consumer-case, reputation, or collections problem. The data layer adds a second regulatory stack. Gazette
              and encyclopedia sources confirm the Digital Personal Data Protection Act 2023 is now part of the
              operative backdrop, while official ABDM materials show the state's push toward digital health IDs and data
              exchange. The strongest adverse evidence here is not a Pristyn-specific enforcement action but the
              Internet Freedom Foundation's critique that PM-JAY/ABDM-linked systems exposed patient-identifiable
              records and that the health-data regime lacks the stronger special-category protections present in older
              drafts. Those are advocacy claims rather than adjudicated findings, but they are still important because
              Pristyn handles surgery scheduling, insurance, and records flows in a sector where consent, retention, and
              breach obligations are getting stricter faster than public disclosure quality is improving.
