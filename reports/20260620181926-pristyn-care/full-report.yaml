      - number: '6.4'
        title: Retention, Expansion, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Durability is the weakest part of the public customer story. Pristyn Care discloses no NRR, GRR, patient
              repeat rate, procedure-level recurrence-adjusted satisfaction score, referral rate, or city-level
              retention cohort. That is structurally understandable—many surgeries are episodic rather than
              subscription-based—but it still leaves investors without a good public read on whether the business grows
              mainly through marketing-fueled acquisition or through durable referrals, cross-sell, and repeat
              engagement. What can be supported is directional expansion. The hospitals page, mobile-app flows, and
              recent Entrackr coverage show expansion into owned hospitals, ICU-heavy settings, and broader specialties
              including orthopedics and ophthalmology, which likely diversify the customer base beyond founding
              proctology and urology categories. At the same time, concentration risk remains meaningful. Official
              recommendation counts are much higher in legacy categories like hernia than in newer areas like knee
              replacement, implying that procedure mix and customer proof may still be concentrated in a few core
              categories. Financial Express also reported layoffs in support functions and exits from six
              underperforming cities in 2024, a reminder that footprint rationalization and support quality may move
              together. For diligence, the key ask is not just total customer volume but channel mix, referral share,
              insurance mix, procedure concentration, and city-level service performance over time.
