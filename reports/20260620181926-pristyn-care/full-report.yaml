        title: Public hospital-chain comparables can bracket the math, but only as inferred market-cap-to-revenue
        blocks:
          - type: paragraph
            body: >
              Listed Indian hospital chains provide the best open-source benchmark set because they publish enough
              information for repeatable math, even if they are not business-model twins. Screener pages fetched on
              2026-06-20 show current market capitalization and revenue fields for Apollo Hospitals, Fortis, Narayana
              Health, HCG, Max Healthcare, and Aster DM Healthcare. Treating those as current equity value divided by
              trailing revenue yields an inferred band of roughly 6.7x for HCG, 9.7x for Narayana, 13.1x for Apollo,
              16.0x for Aster, 37.1x for Max, and 40.6x for Fortis. This is explicitly not EV/revenue, because debt,
              cash, and minority interest are not adjusted, and it is not a like-for-like surgery-marketplace
              comparison. It is simply the cleanest public multiple frame available from retained sources.


              That band is wide enough that Pristyn's implied 18-19x trailing-revenue mark is mathematically possible,
              but the quality threshold matters. The upper end of the band belongs to companies that are already public,
              continuously followed, and supported by recurring disclosures, not by a three-year-old unicorn round plus
              a flat bridge. Apollo, Narayana, HCG, and Aster all expose public annual-report or investor-relations
              surfaces that let outside investors inspect filings, while Pristyn still provides no open-source
              equivalent for cap-table economics or hospital-cohort returns. So the comp read is nuanced: the current
              mark is not automatically absurd on pure multiple math, but the disclosure burden required to deserve that
              math is much higher than what Pristyn presently offers.
