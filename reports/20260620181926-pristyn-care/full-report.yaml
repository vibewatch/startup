  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Larger round clears at or above the flat bridge price; hospital rollout sustains; audited revenue accelerates;
          disclosure quality improves sharply.
        - >-
          Supportable range roughly $1.3-1.7B; at a current $1.4B entry, upside is modest unless growth meaningfully
          outruns today's narrative.
        - Execution misfire in owned hospitals, slower growth, or insider-only financing.
        - Low-to-medium; requires several missing proofs to arrive together.
      - - Base
        - >-
          Revenue keeps growing, but hospital economics and capital structure remain only partially disclosed; next
          round is supportive but not cleanly price-discovering.
        - Supportable range roughly $0.8-1.1B; at $1.4B this implies weak or negative mark-to-market support.
        - Premium multiple compresses once public diligence catches up with missing data.
        - Medium; most consistent with current evidence quality.
      - - Bear
        - Larger round prices below the bridge, adverse quality concerns deepen, or owned-hospital economics disappoint.
        - Supportable range roughly $0.4-0.7B; a unicorn entry would then carry large downside.
        - Down-round, governance friction, or capital scarcity forces a reset.
        - Medium; the bridge structure and disclosure gaps keep this scenario credible.
    notes: Ranges are judgmental supportable-value bands, not management guidance or discounted-cash-flow outputs.
