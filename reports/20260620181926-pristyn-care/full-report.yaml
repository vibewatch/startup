        title: Current scale markers and why they conflict
        blocks:
          - type: paragraph
            body: >-
              Scale is the most important chapter-one area where the public record should be used cautiously. The
              current homepage claims 150+ clinics, 800+ partner hospitals, 400+ super-specialist surgeons, and more
              than 45 cities. The older about page presents a different but still current-sounding lens: six metros plus
