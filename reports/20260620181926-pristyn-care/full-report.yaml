      - number: '8.4'
        title: Private healthtech comparables are directionally useful but disclosure mismatch remains severe
        blocks:
          - type: paragraph
            body: >
              Private Indian healthtech references are helpful mainly because they show how messy private-market
              denominator selection can be. The best retained example is MediBuddy. Hindu BusinessLine quoted the CEO in
              April 2024 saying FY24 revenue had crossed ₹1,000 crore and that the company stood at a valuation of close
              to $500 million. Entrackr's later RoC-based FY25 article, however, showed only ₹724.6 crore of operating
              revenue and a ₹137 crore loss. Those figures are not necessarily contradictory — one may reflect a broader
              management topline while the other is a narrower statutory operating-revenue line — but the mismatch
              proves the point: even when both valuation and revenue exist for a private healthtech company, multiple
              math depends on whether the numerator and denominator come from the same accounting perimeter.


              Practo is the opposite problem. Economic Times gives an updated FY24 revenue anchor of ₹242 crore and says
              operating loss fell to ₹17 crore, but the retained accessible source set does not give a contemporary
              private valuation. That leaves no clean multiple to compare with Pristyn. The result is that private
              healthtech comparables do not rescue underwriting certainty. If one uses MediBuddy's rough $500 million
              valuation against the company-stated ₹1,000 crore-plus revenue, the implied multiple is only around 4x; if
              one instead uses Entrackr's ₹724.6 crore operating revenue, the multiple rises toward 6x. Either way, the
              rough range still sits well below Pristyn's flat unicorn mark. That does not prove Pristyn is overvalued,
              because Pristyn owns more physical care-delivery exposure than a pure digital platform, but it does
              reinforce that the market is already pricing in a substantial hospital-execution premium.
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV035
              - CV036
      - number: '8.5'
        title: Bull, base, and bear cases point to research-more rather than a priced conviction call
        blocks:
          - type: paragraph
            body: >
              The bull case is not hard to imagine: owned hospitals continue to ramp, the larger round closes at or
              above the flat bridge price, FY25/FY26 audited revenue shows that the surgery business is compounding
              rather than merely reshuffling mix, and hospital-level utilization data begins to resemble the proof
              standards public chains disclose. Under that set of assumptions, a $1.3-1.7 billion range is defensible
              and the current mark survives. The base case is less flattering. Revenue grows, but disclosure only
              partially improves, the next financing remains insider-supported, and hospital-cohort economics stay
              unproven in public. In that world, the company can still be strategically interesting while fair value
              drifts closer to roughly $0.8-1.1 billion.


              The bear case is what makes an immediate priced recommendation inappropriate. If the larger raise comes in
              below the flat bridge price, if revenue-quality concerns intensify, if medical-negligence or
              insurance-selling allegations harden into a broader brand problem, or if owned-hospital economics prove
              weaker than advertised, the most supportable value could reset toward roughly $0.4-0.7 billion. That
              downside is material relative to a unicorn entry. The right call from open sources is therefore
              research-more, with low confidence and a stretched valuation stance. What moves the call is clear: audited
              FY25/FY26 revenue, full cap-table terms, hospital-level occupancy and margin data, cash runway, and the
