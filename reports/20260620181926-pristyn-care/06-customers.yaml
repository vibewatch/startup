- id: independent-reviews-complaints-and-app-evidence
  title: Independent Reviews, Complaint Surfaces, and App Evidence Gaps
  body: 'Independent customer evidence is much thinner and materially less flattering than the official testimonial stack. The strongest accessible adverse source in the retained pack is ConsumerComplaints, which shows 72 complaints and contains repeated narratives around hidden or changing surgery pricing, insurance or cashless confusion, delayed discharge, weak post-admission responsiveness, lack of follow-up, and dissatisfaction with outcomes or recurrence. These complaint posts are not court findings or medically adjudicated incidents, but they do show that the friction points Pristyn Care highlights as strengths—coordinator support, insurance handling, discharge management, and follow-up—also recur in the negative evidence when delivery breaks. App evidence is mixed. The Google Play listing is live and confirms 10L+ downloads plus workflow features such as appointment booking, digital records, symptom checking, and cost estimates, but the extracted page text did not expose a current
    public star rating in the retained fetch. On iOS, the App Store search fetch returned a 429-driven reader fallback and no clean Pristyn listing. Third-party review coverage is also patchy: the MouthShut product-review URL resolved only to an error or limit page, while the accessible Glassdoor review surface is employee-facing and historical rather than patient-facing. The net result is that independent public satisfaction data exists mainly as complaint evidence and operational proxies, not as a clean, recent cross-platform patient-rating set.'
