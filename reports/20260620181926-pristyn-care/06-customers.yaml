  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: No public NRR, GRR, repeat-booking, referral-rate, or complaint-rate denominator data is available for Pristyn Care.
    whyItMatters: Without denominator-based durability metrics, the public customer story can show acquisition scale and curated satisfaction without proving repeat quality or efficient retention.
    diligencePath: Request quarterly city-by-procedure cohorts, referral share, repeat booking share, complaint rate per 1,000 surgeries, and insurer-approval statistics.
    relatedQuestionRefs:
    - QU022
    - QU027
    relatedTableRefs:
    - TU005
  - type: access-blocked
    severity: material
    topic: app-ratings
    missingEvidence: A clean current iOS listing and cross-platform star-rating series were not retained; Android downloads were visible but star-rating extraction was incomplete.
    whyItMatters: App-store ratings are one of the few independent public satisfaction proxies for a consumer health platform with a large coordination layer.
    diligencePath: Capture live Android and iOS listing screenshots, star ratings, review counts, and recent review themes on the diligence date.
    relatedQuestionRefs:
    - QU020
    - QU021
    relatedTableRefs:
    - TU004
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-patient-proof
    missingEvidence: The retained patient-proof table covers only the main official testimonial clusters and one complaint forum, not every procedure page or independent review surface.
    whyItMatters: Customer proof quality can vary materially by procedure, city, and support pathway, so a partial enumeration may overstate consistency.
    diligencePath: Sample top 10 revenue procedures by city, capture page-level recommendation counts, and cross-check with independent review or complaint incidence where available.
    relatedQuestionRefs:
    - QU009
    - QU014
    - QU026
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: channel-and-procedure-concentration
    missingEvidence: No public disclosure breaks customer volume or revenue by procedure, city, insurer, or owned-hospital channel.
    whyItMatters: Procedure concentration and support-quality concentration can create hidden customer risk even when total network scale appears strong.
    diligencePath: Request city-level contribution margins, top procedures by GMV, insurance-vs-cash mix, owned-hospital utilization, and closure criteria for underperforming cities.
    relatedQuestionRefs:
    - QU024
    - QU025
    - QU027
    relatedTableRefs:
    - TU006
