- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or service risk
  - Likely impact
  - Evidence basis
  - Diligence path
  rows:
  - - Expansion into owned hospitals and ICU-equipped sites
    - Owned-hospital ramp raises fixed-cost and service-consistency risk versus the older asset-light model
    - High strategic upside; high execution risk
    - 2026 Entrackr hospital-expansion coverage
    - Request owned-hospital occupancy, payback, and case-mix by city
  - - Broader specialties such as orthopedics and ophthalmology
    - Newer verticals show thinner public proof than core hernia/proctology/urology categories
    - Moderate
    - Hospitals page + lower visible recommendation counts on knee vs hernia
    - Request procedure mix and conversion by specialty
  - - Insurance and reimbursement coordination as a sales wedge
    - If cashless or reimbursement handling fails, dissatisfaction can spike at the most expensive point in the journey
    - High
    - Official support promises plus complaint narratives
    - Audit insurer approval rate, TAT, and complaint escalation data
  - - City-footprint rationalization
    - Layoffs and exits from six cities suggest not all local markets convert efficiently
    - Moderate to high
    - Financial Express 2024 restructuring coverage
    - Request city-level contribution margin and closure criteria
  - - Marketing-led lead generation
    - Without referral or cohort data, growth may still depend heavily on paid acquisition rather than durable loyalty
    - Material
    - Absence of public retention/referral metrics
    - Request CAC payback, repeat-booking, and referral-share data
  notes: Risk rows combine directly observed evidence with structured inference. They should be read as diligence priorities, not as finalized downside scenarios.
