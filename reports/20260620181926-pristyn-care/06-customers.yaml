- id: TU004
  title: Independent satisfaction and complaint signals
  columns:
  - Signal
  - Observed value / pattern
  - Segment
  - Confidence
  - Interpretation
  - Diligence ask
  rows:
  - - ConsumerComplaints complaint volume
    - 72 complaints visible on retained page
    - Cross-procedure patients
    - Medium
    - Independent adverse activity is material enough to review
    - Request internal complaint rate per 1,000 cases by city and procedure
  - - Billing / insurance mismatch complaints
    - Repeated allegations of hidden charges, overbilling, or cashless confusion
    - Insurance-assisted and self-pay
    - Medium
    - Commercial friction can damage trust at the handoff from sales to hospital
    - Review pre-auth scripts, billing audits, and insurer dispute rates
  - - Post-admission responsiveness complaints
    - Repeated narratives of coordinators not answering or support ending after admission
    - Attendants and surgery-day patients
    - Medium
    - The support layer is a key promise and a visible failure point when stretched
    - Audit coordinator staffing, SLA dashboards, and escalation response times
  - - Outcome dissatisfaction / recurrence allegations
    - Some complaints allege poor outcomes, recurrence, or need for corrective treatment
    - Procedure-specific patients
    - Low
    - These are allegations, not medical findings, but they flag quality-review needs
    - Request complication, revision, and recurrence rates by procedure
  - - Employee review signal
    - Glassdoor shows 4.1/5 and 81% recommend, but also repeated long-hours and six-day-workweek complaints
    - Support and operations staff
    - Low
    - Internal strain could spill into patient-support consistency
    - Request attrition and staffing data for coordinators, support, and operations
  - - App-store visibility
    - Google Play is live with 10L+ downloads, but retained fetch did not expose a star rating; Apple search returned a blocked/not-found style result
    - Digital self-service users
    - Low
    - App adoption is visible, but cross-platform satisfaction evidence remains incomplete
    - Capture live Android and iOS ratings plus review volumes at diligence date
  notes: 'Independent public satisfaction evidence is asymmetric: complaint data is visible, while clean patient-rating or cohort-quality data is sparse. Employee-review data is included only as an operating-strain proxy, not as a patient-outcome measure.'
