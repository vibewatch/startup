company:
  name: Pristyn Care
chapter:
  number: 6
  title: Customers
  summary: Pristyn Care appears to sell elective and secondary-care surgery access to self-pay, insurance-assisted, and EMI-assisted patients plus their caregivers, with strong official proof on network breadth and service packaging but much weaker independent proof on satisfaction and retention. Company-controlled treatment and testimonial pages show high curated recommendation counts for core procedures such as hernia, varicocele, phimosis, and knee replacement, while independent public evidence is dominated by complaint-forum allegations around billing, insurance coordination, discharge support, and follow-up rather than clean cross-platform ratings. Recent Entrackr snippets suggest materially larger current scale—300,000 surgeries to date, 3 million yearly patient interactions, and 100,000 monthly surgery registrations—but those are company-relayed volume proxies rather than audited completed-surgery, repeat-usage, or cohort-retention disclosures.
sections:
- id: patient-segments-footprint-and-volume-proxies
  title: Patient Segments, Geographic Footprint, and Volume Proxies
  body: 'Pristyn Care is best understood as a consumer health-services orchestrator rather than only a clinic chain. Official surfaces consistently describe a service for elective and secondary-care surgery patients who need doctor discovery, consultations, insurance paperwork, hospital admission coordination, surgery-day transport, and post-operative follow-up. The likely economic buyer is either the patient or family caregiver, with payment routed through self-pay, cashless insurance, reimbursements, or no-cost EMI depending on case mix. Current official scale claims are large but heterogeneous: the homepage and Google Play listing cite 150+ clinics, 800+ partner hospitals, 400+ super-specialist doctors or surgeons, and coverage across more than 45 cities, while the company about page still describes six metro cities plus 30 tier-2 and tier-3 cities. Entrackr''s 2026 hospital-expansion snippets add bigger operating proxies—300,000 surgeries over five years, more than 3 million patient
    interactions annually, and 100,000 surgery registrations per month—but these are company statements relayed by media, not audited utilization metrics. The customer map is also broadening beyond the company''s original proctology/urology core. Official hospital and app surfaces now span orthopedics, ophthalmology, dermatology, fertility, neurology, nephrology, pulmonology, and oncology, implying a customer base that increasingly includes higher-acuity and older-age cohorts such as cataract and knee-replacement patients, not just younger laser-surgery cases.'
