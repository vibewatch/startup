  title: The customer proposition is built around reducing surgery friction
  body: 'Across official surfaces, Pristyn Care consistently sells coordination as much as surgery itself: coordinator support, insurance paperwork, EMI, transport, discharge handling, app updates, and follow-up. That packaging likely helps conversion in a category where patient anxiety and caregiver logistics matter as much as the surgeon roster.'
