- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale signal
  - Revenue / strategic value
  - Key gap
  rows:
  - - Elective surgery patients
    - Patient; often family caregiver influences hospital choice and payment
    - Laser, laparoscopic, vascular, urology, gynecology, cataract, and orthopedic procedures
    - 150+ clinics, 800+ partner hospitals, 45+ cities claimed on official surfaces
    - Core revenue base
    - No disclosed split by procedure, city, payer, or outcome
  - - Insurance-assisted patients
    - Patient plus insurer or TPA for cashless / reimbursement flow
    - Cashless approvals, insurance paperwork, hospitalization coordination
    - Insurance help is repeatedly marketed across about, cost, treatment, and knee pages
    - Important conversion lever for higher-ticket surgeries
    - No public approval-rate, denial-rate, or reimbursement-turnaround data
  - - EMI-assisted self-pay patients
    - Patient / household payer
    - Affordability support for out-of-pocket surgery via no-cost EMI
    - Zero-cost EMI appears across homepage and treatment/cost pages
    - Expands TAM beyond fully insured patients
    - No disclosure of EMI mix, default risk, or partner concentration
  - - Caregivers and attendants
    - Family member or attendant alongside patient
    - Doctor selection, hospital logistics, discharge, transport, and follow-up coordination
    - Official messaging repeatedly addresses surgery-day transport and coordinator support
    - Critical referral and NPS driver in elective surgery
    - No caregiver satisfaction or referral-rate disclosure
  - - Higher-acuity specialty patients
    - Older or more complex patients and families
    - Knee replacement, cataract, ICU-linked or owned-hospital pathways
    - Hospitals page and 2026 Entrackr snippets show broader specialty and hospital expansion
    - Supports larger-ticket cases and brand expansion
    - Public customer proof is thinner than in legacy proctology/urology categories
  notes: Segments are inferred from official workflow pages, app surfaces, and hospital expansion coverage rather than from a disclosed CRM segmentation file. “Scale signal” mixes company statements with media-relayed company statements.
