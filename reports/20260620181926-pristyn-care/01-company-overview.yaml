company:
  name: Pristyn Care
chapter:
  number: 1
  title: Company Overview
  summary: 'Pristyn Care is a Gurugram-founded 2018 surgery platform built around elective and secondary-care procedures, with public evidence showing a patient-journey model that bundles consultation, insurance support, partner hospitals, and a newer owned-hospital estate. Funding evidence supports a rise from a $53 million Series D at a $550 million valuation in 2021 to a December 2021 unicorn round around $1.4 billion, followed by a small July 2025 Series E1 bridge that appeared flat to the prior round. The main diligence caution is that current scale claims are internally and externally inconsistent: the homepage now says 150+ clinics, 800+ partner hospitals, 400+ surgeons, and 45+ cities, while 2024-2025 independent reporting centered on ~100-150 clinics, ~200 hospitals, and ~30 cities.'
sections:
- id: identity-and-care-model
  title: Identity, headquarters, and care model
  body: 'Pristyn Care should be anchored in this report as a Gurugram-based healthcare platform founded in 2018 by Harsimarbir Singh, Dr. Vaibhav Kapoor, and Dr. Garima Sawhney. The strongest official evidence does not come from a single corporate profile page with all basics in one place, so chapter one has to synthesize the official website with high-reputation reporting. Official pages frame the company as a patient-journey business for elective or secondary-care surgeries rather than a hospital system in the legacy sense: Pristyn says it helps patients discover the right doctor, book appointments, complete diagnostics, process insurance, travel to the hospital, and navigate discharge and follow-up. The privacy policy identifies the legal entity as GHV Advanced Care Private Limited, while third-party reporting consistently locates headquarters in Gurugram or Gurgaon, Haryana. For diligence purposes, this is best treated as an India-focused elective-surgery orchestrator whose public identity
    now mixes marketplace, care-navigation, and hospital-owner characteristics.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO028
