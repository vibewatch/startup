- id: milestones-and-adverse-signals
  title: Milestones, layoffs, exits, and strategic pivots
  body: 'The chronology matters because it shows both ambition and strain. Pristyn started in 2018, scaled aggressively through 2020 funding, and became a unicorn in 2021. It also experimented beyond the original asset-light surgery-network narrative. The Bangladesh push that began in 2023 was reversed within a year after civil distress and shutdown conditions undermined the market, making international expansion a cautionary rather than celebratory milestone. Domestically, March 2024 brought a reported 120-person workforce reduction and city exits as the company targeted profitability and a future IPO. In 2025, public reporting added a second round of layoffs, a series of senior exits, and signs that Beatxp—the fitness-tech side business—was both loss-making and fundraising under pressure. At the same time, the company was clearly doubling down on owned facilities: the July 2025 Series E1 bridge funded hospital expansion, Medical Buyer described eight owned hospitals and 450 beds, and The
    Print reported 11 owned hospitals and 100+ ICU units by October 2025. The milestone record therefore supports both a scaling story and a discipline story under tighter capital conditions.'
