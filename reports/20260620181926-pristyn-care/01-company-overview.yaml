  rows:
  - - Peak XV / Sequoia
    - Earliest visible institutional backer and 2025 returning investor
    - Series A, Series B, Series E, and Series E1 coverage.
    - Most persistent sponsor across the documented financing history.
    - Confirm current ownership, board rights, and whether Peak XV still leads the cap table.
  - - Tiger Global
    - Growth-stage lead investor
    - Series D and Series E reporting.
    - Key to the 2021 valuation jump from $550M to unicorn status.
    - Request current stake, pro-rata behavior, and any secondary activity.
  - - Hummingbird Ventures
    - Recurring early-stage and bridge investor
    - Series B, D, E, and E1 reporting.
    - Important signal that a long-time investor still supported the 2025 bridge.
    - Clarify check size and any governance protections in the E1 bridge.
  - - Greenoaks Capital and AngelList
    - Series B participants
    - Inc42 Series B coverage.
    - Evidence of broader early investor syndication beyond Sequoia alone.
    - Determine whether these holders remained meaningful by later rounds.
  - - Epiq Capital, Winter Capital, Trifecta, and angels
    - Late-stage syndicate around unicorn step-up
    - ET and Moneycontrol Series E reporting.
    - Helped close the unicorn round and broaden the investor base.
    - Separate strategic support from passive capital and map any special rights.
  - - Hospital and insurance partners
    - Operating counterparties rather than equity holders
    - Official about page and homepage financing support claims.
    - Critical because revenue depends on partner throughput, cashless approvals, and referral economics.
    - Request concentration by top hospital chains, insurer partners, and owned versus partner case mix.
