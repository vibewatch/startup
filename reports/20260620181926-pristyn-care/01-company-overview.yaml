- id: scale-metrics-and-conflicts
  title: Current scale markers and why they conflict
  body: 'Scale is the most important chapter-one area where the public record should be used cautiously. The current homepage claims 150+ clinics, 800+ partner hospitals, 400+ super-specialist surgeons, and more than 45 cities. The older about page presents a different but still current-sounding lens: six metros plus 30 tier-2 or tier-3 cities, more than 250,000 treated patients, over 3 million interactions, and 12 categories. An older stories page preserves yet another snapshot: 80+ clinics, 400+ hospitals, 140+ surgeons, and 60,000 patients. Independent 2024-2025 reporting diverges again. ANI described 100 clinics, 200 hospitals, and 30+ cities in December 2024, while IPO Central described 150 clinics, 200 hospitals, 30 cities, and 400+ surgeons in January 2025. The best interpretation is not that one figure set is necessarily false, but that Pristyn is using different denominators across owned hospitals, partner hospitals, clinics, city marketing pages, and surgeon-panel definitions.
    The homepage numbers should therefore be carried forward as company claims, not as fully reconciled operating truth.'
