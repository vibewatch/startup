summary:
  headline: >-
    Pristyn Care has real operating reach and clear category fit in Indian elective surgery, but opaque disclosure,
    still-large losses, and a flat-priced bridge at a preserved unicorn valuation keep the recommendation at
    RESEARCH-MORE.
