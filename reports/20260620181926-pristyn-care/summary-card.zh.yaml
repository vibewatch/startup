  topStrengths:
    - 以工作流为核心的定位，把发现、诊断、保险处理、物流、入院支持和术后随访打包成真正的手术协调产品，而不是简单列表层。
    - 即便按保守口径看，运营触达也有分量：官方和第三方来源都支撑其拥有多城市网络、大规模合作伙伴容量和可见的获客引擎。
    - FY24 运营收入达到 ₹600.5 crore，EBITDA 利润率改善；在融资市场偏冷的背景下，需求仍在，成本纪律也有进展。
    - 若早期单院盈利说法可复制，自有医院建设有机会改善质量控制和经济性。
  topRisks:
    - 公开披露质量仍弱：股权结构表、优先股堆叠、现金余额、入住率、ARPOB、单点资本开支和经审计医院队列经济性都未公开。
    - 亏损仍大；即便收入增长并完成重组，FY24 净亏损仍约 ₹381 crore。
    - 2025 年 7 月 $4 million Series E1 过桥轮，更像是更大融资前的现金跑道支持，而不是第三方对独角兽估值的新验证。
    - 临床责任、合作伙伴控制、保险周转资金，以及收入确认 / GST 处理风险仍是结构性关键问题，公开资料只呈现了一部分。
    - 客户质量证据噪音很大：投诉界面、规模口径分母不一致、裁员和 Bangladesh 折返，都增加执行风险。
  unresolvedGaps:
    - 经审计 FY25-FY26 财务数据，包括明确的收入确认政策、GST 处理和现金跑道披露。
    - 完整股权结构表和融资条款，包括清算优先权、债务或周转资金义务，以及据报道仍在推进的更大一轮融资定价。
    - 判断控制策略能否创造持久价值，需要自有医院入住率、ARPOB、支付方结构、贡献利润率和单点资本开支。
    - 需要一份已核对的当前运营足迹和客户规模台账，并统一城市、医院、诊所、手术量和患者互动的定义。
    - 外科医生资质认证、合作医院审计频率、不良事件率、投诉率分母和保险拒赔率统计仍缺失。
