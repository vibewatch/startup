  topStrengths:
    - >-
      Workflow-led positioning bundles discovery, diagnostics, insurance
      handling, logistics, admission support, and follow-up into a real
      surgery-coordination product rather than a simple listing layer.
    - >-
      Operating reach is meaningful even on conservative reads: official and
      third-party sources both support a multi-city network with large partner
      capacity and a visible patient-acquisition engine.
    - >-
      FY24 operating revenue reached ₹600.5 crore and EBITDA margin improved,
      showing continued demand and some cost-discipline progress despite a hard
      funding market.
    - >-
      The owned-hospital buildout could improve quality control and economics if
      early site-level profitability claims prove repeatable.
  topRisks:
    - >-
      Public disclosure quality is still weak: no open cap table, preference
      stack, cash balance, occupancy, ARPOB, per-site capex, or audited
      hospital-cohort economics.
    - >-
      Losses remain large, with FY24 net loss still around ₹381 crore despite
      revenue growth and restructuring.
    - >-
      The July 2025 $4 million Series E1 bridge looked more like runway support
      ahead of a larger raise than fresh third-party validation of the unicorn
      mark.
    - >-
      Clinical-liability, partner-control, insurance working-capital, and
      revenue-recognition / GST-treatment risks remain structurally important
      and only partially visible in public sources.
    - >-
      Customer-quality evidence is noisy: complaint surfaces, denominator
      mismatch in scale claims, layoffs, and the Bangladesh reversal all add
      execution risk.
  unresolvedGaps:
    - >-
      Audited FY25-FY26 financials, including explicit revenue-recognition
      policy, GST treatment, and cash-runway disclosure.
    - >-
      Full cap table and financing terms, including liquidation preferences,
      debt or working-capital obligations, and the pricing of the larger round
      still reportedly in progress.
    - >-
      Owned-hospital occupancy, ARPOB, payor mix, contribution margins, and
      per-site capex needed to judge whether the control strategy creates
      durable value.
    - >-
      A reconciled current operating-footprint and customer-scale ledger with
      consistent definitions for cities, hospitals, clinics, surgeries, and
      patient interactions.
    - >-
      Surgeon credentialing, partner-hospital audit cadence, adverse-event
      rates, complaint-rate denominators, and insurer-denial statistics.
disclaimer: >-
  This report-meta artifact relies only on the public-source record retained in
