coverageNotes: >-
  Public evidence as of 2026-06-20 supports Pristyn Care's 2018 founding, core
  elective/secondary-care positioning, major 2021 funding, July 2025 bridge
  financing, and FY24 revenue/loss anchors. The main gaps are disclosure
  quality and denominator consistency: current footprint claims vary materially
  between the homepage and recent third-party coverage, while cash balance,
  preference stack, owned-hospital occupancy, ARPOB, capex, revenue-recognition
  policy, GST treatment, and denominator-based patient quality metrics remain
  undisclosed in the retained public record.
