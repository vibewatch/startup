- id: funding-history-and-capital-structure
  title: Funding History, Valuation Reset, and Investor Base
  body: Job&Talent’s capital history shows both strong investor sponsorship and a material valuation reset. In December 2021 the company raised a $500 million Series E led by Kinnevik with major participation from SoftBank Vision Fund 2 and follow-on backing from Atomico, DN, Infravia, Kibo, and Quadrille; it also added $75 million of debt financing from BlackRock. That round valued the company at $2.35 billion post-money and supported U.S. expansion. By April 2025, however, Job&Talent raised a much smaller €92 million Series F at a €1.3 billion valuation. TechCrunch explicitly called the round a down round, and the company itself attributed the markdown to broader market dynamics in growth-stage technology. The new round still attracted a credible syndicate—Atomico, BlackRock, DN Capital, Hercules, InfraVia, Kibo, and Kinnevik—but the message for diligence is mixed. The investor base remains deep and supportive, yet the public record does not fully reconcile cumulative capital raised, current
    debt outstanding, preference terms, or dilution across the 2021–2025 reset. Forbes’ reference to more than €800 million raised historically suggests the company has attracted very large aggregate capital, but public sources do not provide enough detail to convert that into a fully reliable current cap-table model.
