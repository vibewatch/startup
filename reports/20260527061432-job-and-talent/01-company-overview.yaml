company:
  name: Job&Talent
chapter:
  number: 1
  title: Company Overview
  summary: Job&Talent is a Madrid-based workforce management platform founded in 2009 that pivoted from a job board into a tech-enabled staffing and employer-of-record model for blue-collar workers. Public sources show real scale—10 countries, more than 300,000 workers placed in 2024, €1.8 billion of 2024 revenue, and aggressive AI productization through Clara and related agents—but the company also carries clear diligence caveats, including a 2025 down round, opaque current headcount and cap table data, and a governance reset tied to U.S.-led growth.
sections:
- id: identity-platform-and-footprint
  title: Identity, Product Shift, and Operating Footprint
  body: 'Job&Talent’s core identity is clearer today than it was at founding: the business started in Madrid in 2009 as a youth-oriented job website, but public founder interviews and the company’s own timeline show that management later killed the classifieds-style product and rebuilt the company around blue-collar temporary work. That 2016 pivot matters because the present product is not just candidate discovery. Job&Talent now describes itself as an AI-powered workforce platform for essential industries, combining worker sourcing, onboarding, payroll, timesheets, shift management, and compliance. The public footprint is meaningful and current. Official 2025 disclosures say the company now operates in 10 countries across Europe, the U.S., and Latin America, placed more than 300,000 workers in 2024, and served more than 3,250 companies in sectors such as logistics, warehousing, retail, manufacturing, and e-commerce. The U.S. has become strategically central to the story, both as the fastest-growing
    market and as the geography shaping later governance and product investments. That gives later chapters a clean anchor: Job&Talent should be analyzed as a scaled, software-enabled staffing operator with real labor-market exposure, not as a pure recruiting SaaS vendor or a legacy temp agency with a thin digital layer.'
