- id: founders-leadership-and-governance
  title: Founders, Leadership Continuity, and Governance Visibility
  body: 'Founder continuity is a major positive in chapter one, but governance transparency remains incomplete. Juan Urdiales and Felipe Navío have remained the central executives since the company’s origin, and multiple interviews show that they still frame the company’s strategic choices around labor-market friction, product reinvention, and AI-led operating leverage. Vision Fund’s profile adds useful operating color: Urdiales originally ran more external responsibilities such as fundraising, finance, and sales, while Navío leaned more heavily into internal operations and product evolution. Public governance visibility improved sharply in September 2025 when Job&Talent reset its board for an AI-led growth phase. The published board now includes Bruce Felt, Javier Torremocha, Jim Grube, Natalie Tydeman, Guillaume Santamaria, and Urdiales, with observers Felipe Navío, BlackRock’s John Doyle, Quadrille’s Edouard Brunet, and DN Capital’s Nenad Marovac. That board composition signals a more
    institutional, U.S.-aware governance structure, but public materials still do not expose committee charters, ownership percentages, or a current cap-table waterfall. Forbes’ founder interview also adds a cautionary governance note: management says a previous board structure had become unwieldy and that debt management consumed an outsized share of leadership time, which is a reminder that the current cleaner governance picture was not always present.'
