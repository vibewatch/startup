  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: A reconciled capitalization table showing lifetime equity raised, current ownership percentages, liquidation preferences, and any remaining debt balances was not available in public sources.
    whyItMatters: Without a current cap table, the company’s 2025 down round cannot be translated into dilution, downside recoveries, or investor-alignment analysis.
    diligencePath: Request the latest cap table, debt schedule, and board-approved financing summary from management or a lead investor.
    relatedQuestionRefs:
    - QO012
    - QO013
    - QO025
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: No clean current official employee count was found; the main public reference is a Forbes interview citing more than 2,000 employees.
    whyItMatters: Headcount is needed to assess operating leverage, sales productivity, support intensity, and whether AI-led margin expansion is translating into real staffing efficiency.
    diligencePath: Ask management for current FTE, contractor, and recruiter counts by geography and function.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: scale-metrics
    missingEvidence: Public scale figures differ by source and disclosure date, with official 2024 metrics at 300,000 workers and 3,250 companies while Forbes cites 400,000 hires per year and 3,500 clients.
    whyItMatters: Later chapters need one canonical scale baseline to avoid metric drift in market-share, customer-density, and valuation analysis.
    diligencePath: Obtain a dated KPI pack that reconciles worker placements, annual hires, active clients, and employee headcount using one reporting convention.
    relatedQuestionRefs:
    - QO013
    - QO014
    - QO015
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: governance-rights
    missingEvidence: Public sources identify board members and observers but do not show committee charters, reserved matters, or current investor consent rights.
    whyItMatters: Those governance details determine how much autonomy founders retain and how the post-down-round investor group may influence strategy, hiring, and future financing.
    diligencePath: Review shareholder agreements, board committee documents, and any observer-right letters tied to recent financing rounds.
    relatedQuestionRefs:
    - QO008
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: minor
    topic: regulatory-cleanliness
    missingEvidence: A robust jurisdiction-by-jurisdiction public legal and regulatory pack was not assembled beyond broad adverse-news searches, so the absence of major enforcement findings should not be treated as exhaustive.
    whyItMatters: Workforce intermediaries can carry wage-and-hour, worker-classification, and labor-compliance exposure that does not always surface in mainstream funding or profile coverage.
    diligencePath: Run direct court, labor-agency, and regulatory database checks in the company’s major markets, especially Spain, the U.K., and the U.S.
    relatedQuestionRefs:
    - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table coverage
    missingEvidence: The milestone table captures the major inflection points but does not enumerate every acquisition, local-country launch, or intermediate financing event.
    whyItMatters: A complete chronology is useful for understanding whether scale came from organic execution, acquisition rollups, or financing-dependent expansion.
    diligencePath: Request a management-prepared corporate timeline covering every country entry, acquisition, major product launch, and financing close.
    relatedQuestionRefs:
    - QO018
    - QO019
    relatedTableRefs:
    - TO004
