  body: Job&Talent is not pitching AI from a blank slate. Its public materials tie more than one million worker placements, millions of shifts, and direct operating control over recruiting, attendance, and payroll to a growing suite of agents led by Clara. That gives the company a more defensible AI story than a staffing intermediary that only sells recruiter labor.
