  topStrengths:
    - >-
      Scaled cross-border platform with 10-country coverage, 300,000+ worker placements, and 3,250+ client companies in
      2024.
    - >-
      2024 profitability improved despite a weak staffing market, with €1.8B revenue and €61.3M underlying EBITDA
      publicly disclosed.
    - >-
      AI productization is more credible than at many peers because Clara and related agents are tied to a large
      operational data base and customer proof.
  topRisks:
    - >-
      The April 2025 Series F was a down round from the 2021 peak valuation, signaling repricing and possible
      preference-stack complexity.
    - >-
      Gross margin, NRR, cash, debt balances, and current headcount remain incompletely disclosed for a company priced
      above listed staffing multiples.
    - >-
      Macro staffing cyclicality, labor regulation, and large-incumbent AI catch-up could compress both growth and
      valuation multiples.
  unresolvedGaps:
    - Current cap table, liquidation preferences, and debt schedule, including the April 2026 UK charge registration.
    - Audited 2025 accounts showing gross margin, cash generation, and segment-level economics.
    - NRR, software take-rate, and customer concentration data sufficient to test the AI-platform premium.
    - A clean current headcount and workforce productivity bridge by geography and function.
