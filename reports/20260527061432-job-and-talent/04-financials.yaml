- id: TI005
  title: Cost structure, working capital, and service-delivery economics
  columns:
  - Driver
  - Public evidence
  - Likely effect on economics
  - Confidence
  - Diligence ask
  rows:
  - - Worker pay and statutory benefits
    - Sifted says Job&Talent workers receive pension contributions, sick pay, holiday pay, and health insurance.
    - Makes the model more employment-like and likely raises direct labor cost versus contractor-only platforms.
    - Medium
    - Need country-by-country worker-cost stack and margin by worker classification.
  - - Recruitment and onboarding labor
    - Clara automates interviews, candidate screening, documentation follow-up, and onboarding tasks.
    - Automation should lower recruiter cost per placement and reduce time-to-fill leakage.
    - Medium
    - Need cost-per-hire before/after AI deployment and recruiter productivity data.
  - - Attendance and no-show management
    - Business pages and AI-agent releases emphasize absenteeism reduction and real-time callouts.
    - Lower no-shows can protect gross profit and service quality on thin-margin staffing programs.
    - Medium
    - Need quantified revenue loss avoided and cost of replacement shifts.
  - - Shift data, clocking, and ratings
    - Platform pages highlight geofenced clocking, attendance scores, and post-shift feedback.
    - Improves operational control and may lower supervision and rework costs.
    - Medium
    - Need operating margin contribution from clocking, compliance, and quality modules.
  - - Receivables and DSO exposure
    - Job&Talent does not publish DSO; Randstad highlights DSO and trade receivables as core working-capital levers.
    - Suggests staffing cash conversion can lag revenue even when demand holds.
    - Medium
    - Need Job&Talent AR aging, dispute rate, and any receivables financing arrangements.
  - - Cyclical demand and low churn
    - WEC, ASA, and HR Brew all describe moderated hiring, low churn, and uneven recovery into 2026.
    - Soft demand can compress volume while wage and service commitments stay relatively sticky.
    - Medium
    - Need customer concentration, vertical mix, and site-level elasticity under weak demand scenarios.
  notes: This table focuses on cost and cash-flow drivers rather than on disclosed income-statement lines, because public sources do not provide a full audited cost-of-revenue bridge for Job&Talent.
