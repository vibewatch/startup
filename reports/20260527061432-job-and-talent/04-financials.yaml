  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway-gap
    missingEvidence: Current consolidated cash balance, minimum liquidity threshold, monthly burn or generation, and downside runway model.
    whyItMatters: A fresh equity round does not by itself prove capital adequacy; without cash and runway figures an investor cannot test solvency, covenant headroom, or dilution risk under weak staffing demand.
    diligencePath: Request treasury pack, 13-week cash forecast, monthly cash bridge since the April 2025 raise, and any board liquidity reporting.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-gap
    missingEvidence: Customer bill-rate cards, worker pay ranges, take rate by country and vertical, and revenue-recognition split between staffing delivery and software-enabled services.
    whyItMatters: Revenue quality and margin path depend on realized spreads, discounting, and mix; public product claims cannot substitute for contract-level economics.
    diligencePath: Request sample master service agreements, top-customer pricing schedules, gross-to-net bridge, and cohort contribution margin by vertical.
    relatedQuestionRefs:
    - QI008
    - QI024
    relatedTableRefs:
    - TI001
    - TI002
    - TI007
  - type: private-evidence-only
    severity: material
    topic: working-capital-disclosure-gap
    missingEvidence: DSO, receivables aging, bad-debt history, customer payment terms, and any receivables financing or factoring facilities.
    whyItMatters: Staffing companies can look profitable while still consuming cash through receivables and seasonal working-capital swings, so missing cash-conversion data directly limits underwriting confidence.
    diligencePath: Request aged AR, bad-debt reserves, monthly DSO trend, customer payment terms, and documentation on any working-capital facilities.
    relatedQuestionRefs:
    - QI016
    - QI023
    relatedTableRefs:
    - TI005
    - TI006
  - type: enumeration-incomplete
    severity: minor
    topic: public-financial-gaps-table
    missingEvidence: An exhaustive public inventory of all missing financial disclosures across margin, customer concentration, debt, geography mix, and software-only adoption.
    whyItMatters: TI007 is intentionally selective and should not be mistaken for a full data-room substitute; users still need a broader management-information request list before underwriting.
    diligencePath: Use TI007 as the starting list, then expand it with management accounts, debt agreements, customer concentration reports, and parsed statutory filings.
    relatedQuestionRefs:
    - QI023
    - QI024
    relatedTableRefs:
    - TI007
