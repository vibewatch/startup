- id: TI004
  title: Unit economics and staffing benchmark table
  columns:
  - Metric or proxy
  - Job&Talent public signal
  - Benchmark or comparison
  - Why it matters
  - Diligence ask
  rows:
  - - Workers per FTE
    - 63 workers per FTE
    - 19 at incumbents (company claim)
    - Shows the company’s core cost-to-serve thesis if measured consistently.
    - Need methodology and comparable denominator definition versus staffing peers.
  - - Client productivity uplift
    - Up to 30%
    - No independent benchmark disclosed
    - Suggests the product is sold on measurable ROI rather than staffing supply alone.
    - Need customer case-level before/after economics and cohort persistence.
  - - Fill rate
    - 98% versus 75% industry norm
    - Internal benchmark versus market norm on business site
    - Fill rate is a direct driver of revenue conversion and client stickiness.
    - Need independent reporting by vertical, season, and geography.
  - - Absenteeism
    - 2% versus 8%
    - Internal benchmark versus market norm on business site
    - No-show reduction directly protects gross profit on labor-intensive shifts.
    - Need site-level variance and service-credit exposure for missed shifts.
  - - Contribution margin
    - 27.3%
    - Randstad gross margin 18.7% and underlying EBITA margin 3.1% in 2025
    - Shows Job&Talent discloses one important margin layer, but cross-company comparability is imperfect.
    - Need Job&Talent gross margin and EBITDA margin definitions by segment.
  - - Revenue per FTE
    - €804k
    - Adecco cites AI-driven time savings and lower cost-to-serve, but not the same ratio
    - Supports automation leverage, though peer normalization is limited.
    - Need consistent productivity KPIs against peers over several years.
  - - Working-capital proxy
    - Not disclosed
    - Randstad DSO 56.7 days in 2025
    - Staffing economics are often constrained by receivables even when operating profit is positive.
    - Need Job&Talent DSO, bad-debt expense, and factoring/financing arrangements.
  - - Digital-platform benchmark
    - Platform now manages temporary and expanding permanent workflows
    - Randstad says €2bn already runs through digital marketplaces
    - Shows peer incumbents are also digitizing, so software uplift alone is not a moat.
    - Need attach rate, net retention, and churn data for Job&Talent platform users.
  notes: The table mixes company-stated operating proxies with disclosed public-company staffing benchmarks. Metrics are directional, not apples-to-apples audited unit economics.
