chapter:
  number: 4
  title: Financials
  summary: 'Job&Talent has unusually strong public top-line disclosure for a private staffing platform: the company said 2024 revenue held at €1.8 billion while underlying EBITDA rose 23% to €61.3 million and contribution margin reached 27.3%. The evidence also shows a 2025 €92 million equity raise at a lower €1.3 billion valuation, an expanding bundled staffing-plus-software model, and meaningful operational improvement claims, but no public cash balance, debt schedule, take rate, or audited consolidated margin bridge sufficient for full underwriting.'
sections:
- id: reported-scale-revenue-model-and-disclosed-profitability
  title: Reported scale, revenue model, and disclosed profitability
  body: 'Job&Talent’s financial story starts with an important distinction: unlike many private labor platforms, it has recently disclosed group-level revenue and profitability metrics, but it still does not publish the detailed revenue-mix and recognition mechanics that a full underwriting model would need. The company said 2024 revenue held at €1.8 billion even as the staffing market contracted, with underlying EBITDA rising 23% to €61.3 million, contribution margin reaching 27.3%, and revenue per FTE increasing to €804,000. Public business pages also show that the commercial model is bundled rather than cleanly SaaS-like: Job&Talent markets staffing supply, onboarding, clocking, attendance, and workforce-management software together as part of an on-site service. That matters because the disclosed contribution margin probably reflects a hybrid labor-plus-software operating model, not a pure agency spread or standalone software subscription. The company has also said the platform is expanding
    beyond temporary labor into permanent and internal workforce management, which broadens the monetization surface but leaves actual realized pricing, take rate, and revenue-recognition split undisclosed.'
