- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Current public status
  - Revenue quality view
  - Diligence ask
  rows:
  - - Temporary staffing placements
    - Employer demand is converted into filled hourly or shift-based frontline work through the marketplace, branches, and on-site delivery model.
    - Clearly active and still the core monetization engine.
    - High for existence; low for exact take rate or vertical mix.
    - Need customer invoices, worker pay files, and gross-to-net bridge by country and vertical.
  - - Bundled workforce-management platform
    - Clocking, attendance, ratings, scheduling, and insights are marketed as part of Job&Talent Business alongside labor supply.
    - Clearly bundled with the service model; no public standalone software pricing.
    - Medium; strong evidence of product scope but not software-only revenue mix.
    - Need product P&L split between labor intermediation and software/service revenue.
  - - AI recruitment and workforce agents
    - Clara, Sara, Teo, and Maria automate sourcing, attendance, account management, and performance workflows.
    - Commercially active as part of the platform value proposition.
    - Medium; value proposition is public but monetization line item is not.
    - Need contract language showing whether AI modules raise bill rates, attach fees, or lower delivery cost only.
  - - Permanent/internal workforce management expansion
    - In 2025 the company said platform access would extend to permanent workers and internal workforces.
    - Expansion announced; realized revenue still undisclosed.
    - Medium for strategic direction; low for current contribution.
    - Need customer rollout count, pricing model, and revenue contribution from permanent-worker use cases.
  - - Operational data and compliance layer
    - Contracts, onboarding tasks, shift management, and attendance workflows run through the app and platform.
    - Present across the workflow, but not separately priced in public evidence.
    - Medium; likely sticky, but not monetized transparently.
    - Need renewal terms, attach rates, and evidence on whether compliance tooling improves gross profit or only retention.
