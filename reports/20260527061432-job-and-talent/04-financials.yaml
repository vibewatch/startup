- id: TI002
  title: Pricing / monetization table
  columns:
  - Surface
  - Public price / unit visibility
  - What is actually disclosed
  - Economics implication
  - Source or diligence ask
  rows:
  - - Employer bill rate / staffing fee
    - Not disclosed
    - No public rate card, spread, or markup formula is visible in reviewed sources.
    - Core revenue quality cannot be underwritten without realized pricing.
    - Request sample customer contracts and bill/pay spreads by market.
  - - Platform access
    - Bundled, not list-priced
    - Company says clients get the tech platform as part of on-site service.
    - Suggests software value may defend pricing or reduce churn, but not a visible standalone SaaS line.
    - Need pricing schedule for customers using technology with and without supplied labor.
  - - AI recruitment
    - Operational outcomes disclosed, not price
    - The company advertises faster hiring, high interview throughput, and better fill rates.
    - Likely monetized through better retention, faster fill, or premium service rather than transparent software fees.
    - Need proof of premium pricing, attach fees, or reduced recruiter cost per hire.
  - - Attendance and shift reliability tools
    - Outcome metrics disclosed, not price
    - Absenteeism and attendance improvements are marketed as client value.
    - These tools likely improve contribution margin by lowering operational leakage.
    - Need before/after site economics and service credits tied to reliability.
  - - Permanent-worker platform expansion
    - Pricing undisclosed
    - The company says permanent and internal workforce users will be added to the platform.
    - Could improve software mix and reduce cyclicality if monetized well.
    - Need launch customer count, contract structure, and any subscription or seat-based pricing.
  notes: Public sources show product outcomes and bundled delivery, but not customer rate cards, platform fees, or realized pricing after discounts and geography mix.
