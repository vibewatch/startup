- id: TI006
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - New equity capital
    - €92 million
    - Official April 2025 Series F announcement and independent coverage
    - Adds liquidity and reduces immediate financing pressure.
    - Need post-close cash bridge showing starting cash plus net proceeds.
  - - Post-money valuation
    - €1.3 billion
    - Official funding announcement and independent coverage
    - Confirms capital access, but at a lower price point than the 2021 peak.
    - Need board materials showing valuation rationale and preference stack.
  - - Adverse valuation signal
    - Down round versus 2021 $2.35 billion valuation
    - TechCrunch and Sifted frame the 2025 raise as a valuation reset
    - Shows investors demanded a lower mark despite continued growth narrative.
    - Need cap-table, liquidation preferences, and any anti-dilution terms.
  - - Use of proceeds
    - International expansion, sales scale, and AI product development
    - Official funding announcement
    - Suggests the round is intended for offensive growth and product build-out.
    - Need 24-month budget allocation and milestone-linked spending plan.
  - - Formal filing cadence
    - 2024 group accounts filed on 7 May 2025; next accounts due 30 September 2026 for Jobandtalent UK Limited
    - Official Companies House pages
    - Shows formal reporting exists, but not the operating metrics investors need at a glance.
    - Need parsed accounts and confirmation of parent/subsidiary scope alignment.
  - - Cash balance and runway
    - Not publicly disclosed in reviewed sources
    - Funding press materials and filing index do not surface cash figures
    - Liquidity cannot be stress-tested from public evidence alone.
    - Need current cash, minimum cash covenant, and downside runway model.
  - - Debt, interest, and covenants
    - Not publicly disclosed in reviewed sources
    - No reviewed source provided current debt balances or facility terms
    - Capital-structure risk remains opaque despite the fresh equity raise.
    - Need debt schedule, covenants, amortization, and security package.
  notes: This is a partial enumeration of capital-adequacy signals, not a full balance-sheet reconstruction. The key missing numbers are the company’s current cash, debt, and covenant position.
