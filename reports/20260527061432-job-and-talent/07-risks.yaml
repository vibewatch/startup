  evidenceGaps:
  - type: missing-source
    severity: material
    topic: worker-misclassification-litigation
    missingEvidence: No public evidence of worker misclassification litigation, labour authority investigations,
      or regulatory enforcement actions against Job&Talent or its subsidiaries in Spain, Germany, UK,
      Netherlands, or any other operating market through May 2026.
    whyItMatters: Absence of public records may reflect no enforcement to date, sealed proceedings, or
      confidential settlements; it does not confirm absence of exposure. Misclassification is the highest-severity
      risk in TR001.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Job&Talent monthly cash burn, operating cash generation, and current cash balance
      are not disclosed in any public source reviewed. With EUR 61.3 million underlying EBITDA but a large
      cumulative fundraise and an undisclosed BlackRock debt facility, liquidity analysis requires access
      to management accounts.
    whyItMatters: Without cash burn data, it is impossible to assess covenant headroom, months of runway,
      or whether the company can sustain operations through a prolonged staffing-sector contraction.
    relatedQuestionRefs:
    - QR018
  - type: missing-source
    severity: moderate
    topic: regulatory-enforcement-history
    missingEvidence: No regulatory enforcement actions, warnings, or investigation notices involving Job&Talent
      were identified in public filings, press coverage, or regulatory registers through May 2026.
    whyItMatters: It is not possible to confirm whether the absence reflects a clean record or limited
      disclosure. In-country regulatory register searches (Spain, Germany, UK HMRC) are required to verify.
    relatedQuestionRefs:
    - QR004
  - type: missing-source
    severity: moderate
    topic: cybersecurity-compliance
    missingEvidence: Job&Talent has not published a SOC 2 report, ISO 27001 certificate, GDPR Article
      30 records-of-processing disclosure, or any third-party cybersecurity audit in publicly available
      sources.
    whyItMatters: As a platform processing payroll and biometric-adjacent data for 300,000+ workers, the
      absence of security certification evidence is a material diligence gap.
    relatedQuestionRefs:
    - QR009
  - type: missing-source
    severity: low
    topic: platform-incident-history
    missingEvidence: No evidence of platform outages, AI placement errors, worker payment failures, or
      material client complaints was identified in any public source through May 2026.
    whyItMatters: Absence of incident reports may reflect genuine operational reliability or limited transparency
      obligations. Customer-reference calls and SLA review would be needed to verify.
    relatedQuestionRefs:
    - QR011
