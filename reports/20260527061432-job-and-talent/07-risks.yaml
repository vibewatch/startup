tables:
- id: TR001
  title: Regulatory / Legal Risk Register
  enumerationScope:
    coverage: partial
    basis: Covers six highest-priority regulatory and legal exposures across EU, UK, and U.S. jurisdictions
      as of May 2026. Additional country-specific labour laws and sector-specific rules are not catalogued.
      Customer contract breach risk and IP risk excluded.
  columns:
  - Rule / License / Case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual Exposure
  - Diligence Path
  rows:
  - - EU Platform Work Directive (2024/2831)
    - EU-10 (all operating markets)
    - Transposition deadline 2 Dec 2026; not yet in national law
    - High - algorithmic allocation likely triggers presumption indicators
    - Critical - worker reclassification could add EUR 100M+ employer cost
    - Rebut presumption proactively; restructure tool autonomy levels
    - Material - rebuttal requires jurisdiction-by-jurisdiction legal opinion
    - Obtain counsel rebuttal memo per country; confirm algorithm audit trail
  - - EU AI Act - high-risk AI system obligations (Annex III)
    - EU-10
    - Compliance deadline Aug 2026; Clara in scope
    - High - system meets automated-selection criteria
    - Critical - fines up to EUR 35M or 7% global turnover
    - Appoint AI system operator; deploy human-review layer; register system
    - Material - requires retroactive logging and conformity assessment
    - Request Clara conformity assessment status; confirm human-oversight SOP
  - - GDPR Art. 22 - automated employment decision-making
    - EU-10 + UK
    - Effective; enforcement intensifying through 2026
    - Medium - automated interviews without confirmed human final review
    - High - fines up to EUR 20M or 4% global turnover
    - Add mandatory human reviewer step; publish privacy impact assessment
    - Medium - depends on degree of human intervention in final hire decision
    - Verify whether Clara interviews are final or advisory; request DPA status
  - - EU Pay Transparency Directive
    - EU member states
    - Transposition required by June 2026
    - Medium - applies to all job postings; J&T posts at high volume
    - Medium - salary-range obligations increase advertiser compliance burden
    - Update posting templates; train account managers; audit job board feeds
    - Low-Medium - mainly process and tooling cost; limited revenue impact
    - Confirm posting-system update timeline and compliance testing cadence
  - - UK Employment Rights Act 2025 / Fair Work Agency
    - UK
    - Active from 6-7 April 2026
    - Medium - day-one sick pay and collective consultation exposure
    - High - doubled protective awards and proactive enforcement
    - Update UK contracts; align sick-pay administration; train compliance team
    - Medium - UK is a material revenue market; cost impact not yet quantified
    - Obtain UK employment counsel review of worker contract templates
  - - U.S. State AI Hiring Laws (CO, IL, and others)
    - United States
    - Colorado and Illinois laws active; 10+ states drafting legislation
    - Medium - applicable to U.S. market, fastest-growing J&T geography
    - High - 20000+ federal discrimination suits filed in 2025; class-action risk
    - Deploy bias audit; add state-law compliance layer; retain U.S. counsel
    - Material - U.S. is largest single market by growth rate
    - Audit Clara decision logs for demographic disparate-impact indicators
  notes: Likelihood and severity are qualitative assessments based on public regulatory analysis and third-party
    legal commentary. No Job&Talent-specific enforcement history was confirmed in public sources. Residual
    exposure assumes good-faith compliance efforts are underway.
