callouts:
- calloutType: risk
  title: 2026 Regulatory Sprint Creates Simultaneous Multi-Jurisdiction Exposure
  body: The EU Platform Work Directive (December 2026), EU AI Act (August 2026), and EU Pay Transparency
    Directive (June 2026) all require substantive compliance action within a single calendar year across
    all ten of Job&Talent's operating markets. No comparable multi-directive compliance sprint has occurred
    in the staffing sector before. Clara's autonomous interview scale of 180,000 interviews places it
    unambiguously in the EU AI Act's high-risk category. Failure to achieve conformity by August 2026
    could require suspension of AI-driven placements across the EU, the platform's core value-creation
    mechanism.
  claimRefs:
  - CR001
  - CR004
  - CR005
  - CR043
- calloutType: recommendation
  title: 'Priority Diligence: Platform Work Directive and Clara Conformity'
  body: 'Before finalising any investment decision, obtain: (1) jurisdiction-by-jurisdiction legal counsel
    opinions on whether Job&Talent''s algorithmic shift allocation, performance monitoring, and remuneration
    practices trigger the employment presumption under Directive 2024/2831; (2) a Clara AI system conformity
    assessment or roadmap to Annex III compliance before August 2026; (3) the BlackRock debt covenant
    schedule; and (4) a customer-revenue-concentration breakdown for the top 10 accounts. These four information
    requests address the four material unresolved risk dimensions identified in this chapter.'
  claimRefs:
  - CR002
  - CR005
  - CR033
  - CR039
  - CR045
