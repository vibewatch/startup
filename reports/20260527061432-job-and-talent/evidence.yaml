evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      A reconciled capitalization table showing lifetime equity raised, current ownership percentages, liquidation
      preferences, and any remaining debt balances was not available in public sources.
    whyItMatters: >-
      Without a current cap table, the company’s 2025 down round cannot be translated into dilution, downside
      recoveries, or investor-alignment analysis.
    diligencePath: >-
      Request the latest cap table, debt schedule, and board-approved financing summary from management or a lead
      investor.
    relatedQuestionRefs:
      - QO012
      - QO013
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: >-
      No clean current official employee count was found; the main public reference is a Forbes interview citing more
      than 2,000 employees.
    whyItMatters: >-
      Headcount is needed to assess operating leverage, sales productivity, support intensity, and whether AI-led margin
      expansion is translating into real staffing efficiency.
    diligencePath: Ask management for current FTE, contractor, and recruiter counts by geography and function.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: scale-metrics
    missingEvidence: >-
      Public scale figures differ by source and disclosure date, with official 2024 metrics at 300,000 workers and 3,250
      companies while Forbes cites 400,000 hires per year and 3,500 clients.
    whyItMatters: >-
      Later chapters need one canonical scale baseline to avoid metric drift in market-share, customer-density, and
      valuation analysis.
    diligencePath: >-
      Obtain a dated KPI pack that reconciles worker placements, annual hires, active clients, and employee headcount
      using one reporting convention.
    relatedQuestionRefs:
      - QO013
      - QO014
      - QO015
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: governance-rights
    missingEvidence: >-
      Public sources identify board members and observers but do not show committee charters, reserved matters, or
      current investor consent rights.
    whyItMatters: >-
      Those governance details determine how much autonomy founders retain and how the post-down-round investor group
      may influence strategy, hiring, and future financing.
    diligencePath: >-
      Review shareholder agreements, board committee documents, and any observer-right letters tied to recent financing
      rounds.
    relatedQuestionRefs:
      - QO008
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: regulatory-cleanliness
    missingEvidence: >-
      A robust jurisdiction-by-jurisdiction public legal and regulatory pack was not assembled beyond broad adverse-news
      searches, so the absence of major enforcement findings should not be treated as exhaustive.
    whyItMatters: >-
      Workforce intermediaries can carry wage-and-hour, worker-classification, and labor-compliance exposure that does
      not always surface in mainstream funding or profile coverage.
    diligencePath: >-
      Run direct court, labor-agency, and regulatory database checks in the company’s major markets, especially Spain,
      the U.K., and the U.S.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table coverage
    missingEvidence: >-
      The milestone table captures the major inflection points but does not enumerate every acquisition, local-country
      launch, or intermediate financing event.
    whyItMatters: >-
      A complete chronology is useful for understanding whether scale came from organic execution, acquisition rollups,
      or financing-dependent expansion.
    diligencePath: >-
      Request a management-prepared corporate timeline covering every country entry, acquisition, major product launch,
      and financing close.
    relatedQuestionRefs:
      - QO018
      - QO019
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sizing-gaps
    missingEvidence: >-
      A bottom-up market sizing for blue-collar-only temporary staffing revenues disaggregated by "Job&Talent's" 10
      operating countries (Spain, UK, US, Germany, France, Portugal, Italy, Colombia, Mexico, Sweden) is not available
      from any public source.
    whyItMatters: >-
      Without a defensible blue-collar-specific SAM, valuation TAM multiples cannot be properly deflated to the
      addressable opportunity, creating risk of over-stated addressable market in pitch materials.
    diligencePath: >-
      Commission primary-source SAM analysis from SIA or Oxford Economics using their proprietary country-level temp
      staffing revenue databases.
    relatedQuestionRefs:
      - QM007
  - type: conflicting-data
    severity: material
    topic: sizing-methodology
    missingEvidence: >-
      Major analyst houses (Grand View Research, SIA, WEC) use different perimeters for "temporary staffing market" —
      some include permanent placement, RPO, and WFM software while others do not — making market-size comparisons
      unreliable.
    whyItMatters: >-
      Inconsistent methodology means that a due-diligence model using one headline number as the TAM may be off by a
      factor of 2–5x versus a properly bounded blue-collar temp-only figure.
    diligencePath: >-
      Request SIA's proprietary segmented revenue tables for blue-collar vs professional staffing in Europe and North
      America, and reconcile against Randstad and Adecco segment-level disclosures when next reporting season opens.
    relatedQuestionRefs:
      - QM011
  - type: private-evidence-only
    severity: minor
    topic: market-penetration
    missingEvidence: >-
      "Job&Talent's" internal view of its SAM (as presented in board materials or investor decks) is not public, so
      there is no way to validate whether the company's self-defined addressable market matches any third-party
      estimate.
    whyItMatters: >-
      If the company uses an inflated TAM in investor materials, the growth story looks stronger than defensible public
      data supports.
    diligencePath: >-
      Request the company's current market-sizing methodology and investor deck market-size slide during due diligence,
      and compare against SIA country data.
    relatedQuestionRefs:
      - QM007
      - QM012
  - type: enumeration-incomplete
    severity: material
    topic: competitor-coverage
    missingEvidence: >-
      An exhaustive map of additional rivals such as UKG, Legion, WorkJam, ERP-native WFM suites, and local staffing
      agencies by country and vertical.
    whyItMatters: >-
      The selected competitor set is sufficient for underwriting the main substitution routes, but it can still
      understate niche or country-specific entrants that win on one workflow or one geography.
    diligencePath: >-
      Collect country-by-country win/loss logs, procurement shortlists, and third-party market maps for frontline WFM
      and staffing software by vertical.
    relatedQuestionRefs:
      - QP001
      - QP013
    relatedTableRefs:
      - TP001
  - type: enumeration-incomplete
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Realized markups, gross profit per labor hour, software discounts, and add-on attachment rates for Job&Talent,
      Instawork, incumbents, and software vendors.
    whyItMatters: >-
      Public list prices and booking examples do not reveal the true margin structure, negotiated discounts, or whether
      software modules actually improve account economics.
    diligencePath: >-
      Request customer contracts, SOWs, invoice samples, and country-level gross-margin bridges to compare realized
      economics rather than brochure pricing.
    relatedQuestionRefs:
      - QP018
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: multi-homing
    missingEvidence: >-
      Account-level data showing how often customers run Job&Talent alongside Deputy, Shiftboard, MSP providers, or
      direct sourcing programs.
    whyItMatters: >-
      Switching costs and displacement risk depend on whether alternatives coexist with Job&Talent in the same account
      or replace it outright.
    diligencePath: >-
      Ask for top-account stack diagrams, churn analyses, implementation timelines, and workflow-usage telemetry by
      cohort.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: digital-attach-rates
    missingEvidence: Quantitative attach rates for incumbent digital modules and Job&Talent workflow features within staffing accounts.
    whyItMatters: >-
      Without attach-rate data, it is hard to know whether digital tooling drives durable retention or is mostly a sales
      narrative layered on staffing relationships.
    diligencePath: >-
      Request module penetration, active-usage data, attendance-score adoption, and upsell conversion by account cohort
      and geography.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: cash-runway-gap
    missingEvidence: >-
      Current consolidated cash balance, minimum liquidity threshold, monthly burn or generation, and downside runway
      model.
    whyItMatters: >-
      A fresh equity round does not by itself prove capital adequacy; without cash and runway figures an investor cannot
      test solvency, covenant headroom, or dilution risk under weak staffing demand.
    diligencePath: >-
      Request treasury pack, 13-week cash forecast, monthly cash bridge since the April 2025 raise, and any board
      liquidity reporting.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-gap
    missingEvidence: >-
      Customer bill-rate cards, worker pay ranges, take rate by country and vertical, and revenue-recognition split
      between staffing delivery and software-enabled services.
    whyItMatters: >-
      Revenue quality and margin path depend on realized spreads, discounting, and mix; public product claims cannot
      substitute for contract-level economics.
    diligencePath: >-
      Request sample master service agreements, top-customer pricing schedules, gross-to-net bridge, and cohort
      contribution margin by vertical.
    relatedQuestionRefs:
      - QI008
      - QI024
    relatedTableRefs:
      - TI001
      - TI002
      - TI007
  - type: private-evidence-only
    severity: material
    topic: working-capital-disclosure-gap
    missingEvidence: >-
      DSO, receivables aging, bad-debt history, customer payment terms, and any receivables financing or factoring
      facilities.
    whyItMatters: >-
      Staffing companies can look profitable while still consuming cash through receivables and seasonal working-capital
      swings, so missing cash-conversion data directly limits underwriting confidence.
    diligencePath: >-
      Request aged AR, bad-debt reserves, monthly DSO trend, customer payment terms, and documentation on any
      working-capital facilities.
    relatedQuestionRefs:
      - QI016
      - QI023
    relatedTableRefs:
      - TI005
      - TI006
  - type: enumeration-incomplete
    severity: minor
    topic: public-financial-gaps-table
    missingEvidence: >-
      An exhaustive public inventory of all missing financial disclosures across margin, customer concentration, debt,
      geography mix, and software-only adoption.
    whyItMatters: >-
      TI007 is intentionally selective and should not be mistaken for a full data-room substitute; users still need a
      broader management-information request list before underwriting.
    diligencePath: >-
      Use TI007 as the starting list, then expand it with management accounts, debt agreements, customer concentration
      reports, and parsed statutory filings.
    relatedQuestionRefs:
      - QI023
      - QI024
    relatedTableRefs:
      - TI007
  - type: missing-source
    severity: material
    topic: platform-reliability
    missingEvidence: >-
      No published SLA, uptime history, disaster-recovery architecture, or formal incident record for the platform was
      found.
    whyItMatters: >-
      Reliability evidence is essential for enterprise diligence because workforce operations, attendance, and
      payroll-adjacent workflows are time-sensitive and outage-sensitive.
    diligencePath: >-
      Request uptime dashboards, BCP/DR architecture, status-page history, and the formal security incident register
      from management.
    relatedQuestionRefs:
      - QE020
      - QE028
  - type: missing-source
