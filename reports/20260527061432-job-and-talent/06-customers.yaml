- id: named-customer-proof-and-outcomes
  title: Named customer proof and measurable outcomes
  body: 'Named-customer proof is strongest where Job&Talent is embedded in live frontline operations. GLS Spain provides the clearest operating-control case: Job&Talent says attendance reached 99.6% within eight weeks, live workforce visibility went from two to three hours down to 10 to 15 minutes, and rating data helped retain stronger workers. THG Fulfil shows a different but still production-grade motion: Clara, the AI recruiter, allegedly cut hiring time from eight weeks to three, produced 1,828 hires in three weeks, and lifted fulfilment to 100% during a Black Friday ramp, with attrition down 50%. Diab''s manufacturing story is smaller but useful because it speaks to skilled labor, on-site service, and several temporary workers converting to permanent roles. Cabify extends the book beyond warehouse labor by showing a live Colombia call-center staffing relationship since 2021, including a rapid 85-vacancy fill and better compliance and data visibility. Together these cases prove real
    deployments and measurable outcomes, but they still represent a curated sample rather than a disclosed customer cohort.'
