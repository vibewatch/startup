chapter:
  number: 6
  title: Customers
  summary: Public customer proof shows Job&Talent fitting best in high-volume frontline sectors where employers buy both labor supply and operating control over attendance, compliance, and rehire quality. Named case studies with GLS, THG Fulfil, Diab, and Cabify show measurable operating impact, but portfolio-level retention, concentration, and contract-duration disclosure remains thin, so durability still rests more on operational proxies than on published cohorts.
sections:
- id: customer-mix-buyers-and-footprint
  title: Customer mix, buyers, and operating footprint
  body: 'Job&Talent''s public customer evidence points to a buyer profile that is operational rather than purely HR-led. The product is sold to employers that need flexible frontline labor and tighter control of attendance, compliance, and productivity, while the day-to-day users are site managers and supervisors on one side and workers on the other. The payer remains the client employer, but the workflow only works if workers also use the companion app for shift acceptance, clock-in/out, hours, and feedback. Public sector pages show the company targeting logistics and warehousing, retail, and manufacturing, with role lists ranging from warehouse managers and forklift operators to store staff, assemblers, and maintenance technicians. Geography also matters: the company consistently describes a 10-country footprint, and public case studies span Spain, the UK, Sweden, Colombia, and the United States. This mix suggests Job&Talent wins where labor demand is volatile, compliance matters, and
    customers value an operating layer around staffing rather than a bare marketplace.'
  claimRefs:
  - CU001
  - CU002
  - CU005
  - CU006
