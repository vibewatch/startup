  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-retention-metrics
    missingEvidence: Portfolio-level NRR, GRR, logo churn, renewal rate, and cohort retention by vertical and geography.
    whyItMatters: The public story shows operating wins, but without renewal cohorts it is impossible to distinguish sticky accounts from successful but one-off staffing projects.
    diligencePath: Request quarterly account-retention cohorts, gross and net retention, and renewal timing by country and sector from management.
    relatedQuestionRefs:
    - QU015
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-contracts
    missingEvidence: Top-customer revenue share, average contract duration, site count per account, and top-10 customer concentration.
    whyItMatters: A labor marketplace can look diversified in logo count while still depending on a small number of high-volume accounts or short-duration contracts.
    diligencePath: Request a top-20 customer schedule with revenue, margin, site count, sector, tenure, and contract end dates.
    relatedQuestionRefs:
    - QU019
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table
    missingEvidence: A fuller named-reference set showing additional production customers, customer segment, deployment stage, and measurable outcomes.
    whyItMatters: The public evidence set is concentrated in four curated case studies, which is too narrow to infer the breadth or representativeness of the full customer book.
    diligencePath: Ask management for a full public-reference list or a confidential top-reference account pack, including outcomes and renewal status.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: multi-site expansion cohorts
    missingEvidence: Evidence showing how often accounts expand from one site to multiple sites, from staffing to workforce-management software, or across geographies.
    whyItMatters: The platform appears designed for land-and-expand motion, but no public cohort data shows whether that expansion is common or economically meaningful.
    diligencePath: Request account-expansion cohorts by initial site count, current site count, software attach rate, and vertical.
    relatedQuestionRefs:
    - QU016
    - QU020
    - QU023
