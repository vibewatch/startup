- id: constraints-and-concentration-gaps
  title: Adoption constraints and concentration gaps
  body: 'Adoption constraints and concentration questions remain meaningful. The product pitch explicitly addresses employer pain around compliance, attendance, and rapid scale-up, but the public materials also imply a service-heavy model: U.S. growth came through subsidiary integration and branch presence, and the U.S. app listing still directs workers to contact local offices before using the app. That operating depth can help Job&Talent win complex accounts, yet it also means customer acquisition may be less software-like than the AI-platform messaging suggests. Independent worker reviews are mixed rather than disastrous: Trustpilot shows a 3.5 out of 5 archived score, while negative reviews cite broken app flows, delayed pay, scheduling confusion, and weak support; AppBrain comments show onboarding glitches despite strong aggregate ratings. On the customer side, the main concentration issue is not evidence of a single dominant account but absence of disclosure. Public named proof is
    concentrated in four published case studies and is heaviest in logistics and industrial workflows, so investors still need top-account, contract-term, and vertical-mix data before calling the book durable.'
