- id: durability-and-expansion-proxies
  title: Durability and expansion proxies
  body: 'Public durability evidence is weaker than the operating proof. Job&Talent repeatedly claims high retention rates in logistics, retail, and manufacturing, and its case studies show some expansion mechanics: customers can order more workers from the company app, managers can rehire from rated talent pools, THG cites lower attrition during peak hiring, Diab points to temp-to-perm conversions, and Cabify describes a relationship that has lasted since 2021. Worker-side adoption is clearly broad. Apple''s UK storefront says more than 340,000 people have found work through the platform, while Apple''s UK and US listings and Google Play show roughly 4.7-star ratings across iOS and Android, and AppBrain records 5.7 million cumulative downloads. That breadth matters because Job&Talent''s employer promise depends on worker-side participation in confirmations, clocking, hours, and ratings. Even so, there is still no public NRR, GRR, contract-length, or renewal disclosure, so the chapter has
    to rely on proxies rather than institutional-quality retention cohorts.'
  claimRefs:
