- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: standard
  summary: 'The operating funnel is service-heavy: local account setup and recruiting feed app-led confirmation, live shift management, and eventual rehire or site expansion.'
  data:
    nodes:
    - id: need-detect
      label: Demand spike
      detail: Seasonal peaks, new stores, plant throughput, or service backlog create temp-labor demand.
    - id: client-onboard
      label: Client onboarding
      detail: Account teams and local operations set site rules, compliance, and staffing plans.
    - id: recruit
      label: Recruit and screen
      detail: Recruiters and Clara move candidates into verified pools for open shifts.
    - id: confirm
      label: Shift confirmation
      detail: Workers confirm attendance before shifts in the worker app.
    - id: operate
      label: Live shift management
      detail: Managers monitor attendance, hours, ratings, and coverage gaps in real time.
    - id: rehire
      label: Rehire / expansion
      detail: Rated workers and site visibility support repeat orders and expansion to more shifts or sites.
    edges:
    - from: need-detect
      to: client-onboard
      label: Buyer decides to outsource variable labor demand
    - from: client-onboard
      to: recruit
      label: Compliance, roles, and staffing targets are configured
    - from: recruit
      to: confirm
      label: Candidates are screened and placed into upcoming shifts
    - from: confirm
      to: operate
      label: Confirmed workers show up and are managed on site
    - from: operate
      to: rehire
      label: Ratings, attendance, and output data shape repeat usage
