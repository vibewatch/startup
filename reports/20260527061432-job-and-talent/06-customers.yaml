- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk / constraint
  - Impact
  - Diligence path
  rows:
  - - Company-app to worker-app synchronization
    - Requires buyers to trust app-led shift ordering and attendance workflows
    - Strong land-and-expand potential where staffing demand is volatile
    - Request cohort of sites that expanded from one site to multi-site deployment
  - - Ratings and rehiring loop
    - Quality scores can deepen wallet share by steering repeat hires to top performers
    - Could be powerful, but repeat-order data is undisclosed
    - Ask for repeat-fill rate, rehire share, and gross-margin uplift from rated talent pools
  - - U.S. branch and subsidiary network
    - Expansion still appears operationally dependent on acquisitions, branches, and account teams
    - May slow software-like scaling or hide service intensity
    - Ask for software-revenue mix, branch productivity, and organic vs acquired client growth
  - - Named proof set concentrated in four public accounts
    - Public references are far smaller than claimed total customer base
    - Raises reference-quality and selection-bias risk
    - Request top-20 accounts by revenue, industry, country, and tenure
  - - Logistics / industrial skew
    - Most quantified proof is in logistics, fulfilment, and manufacturing
    - Could expose the book to cyclicality in e-commerce and light industry
    - Request vertical revenue mix, concentration limits, and counter-cyclical categories
  - - Worker-experience friction
    - Pay and support complaints can weaken supply reliability and employer satisfaction if unresolved
    - Adoption can stall even when employer ROI is strong
    - Request payroll dispute rate, app-incident logs, and support staffing ratios by market
  notes: Public evidence supports real expansion mechanisms, but not enough disclosure exists to score concentration or durability with the confidence expected for an institutional diligence file.
