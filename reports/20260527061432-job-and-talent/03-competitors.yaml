chapter:
  number: 3
  title: Competitors
  summary: Job&Talent competes most directly at the intersection of frontline labor supply and workflow control. Global staffing incumbents still dominate on procurement and disclosed scale, while Instawork, Zenjob, WorkMotion, Deputy, and Shiftboard prove that buyers can also substitute only one layer of Job&Talent’s bundle, which makes pricing opacity and attach-rate evidence the main remaining diligence gaps.
sections:
- id: landscape-and-buyer-overlap
  title: Landscape and buyer overlap
  body: Competition around Job&Talent is not one clean peer set. Buyers trying to solve the same frontline labor problem can choose a scaled staffing incumbent, a digital staffing platform, or a software-first workflow tool that removes only one painful layer such as scheduling, attendance, or compliance. Job&Talent sits in the middle because it bundles labor supply with workflow control, especially in logistics-heavy use cases where pre-shift certainty and worker quality matter. That makes the most direct overlap broader than “staffing marketplace” peers alone. Randstad, Adecco, and ManpowerGroup can absorb the need inside far larger staffing and procurement programs; Instawork and Zenjob attack the same variable-hour labor budget with more digital-native supply models; and Deputy, Shiftboard, and WorkMotion attack narrower jobs-to-be-done that can still peel away buyer budget if labor supply is already handled elsewhere. Buyers often combine several of these routes inside one account.
    The category map therefore matters as much as any one named rival.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP007
  - CP008
  - CP009
  - CP010
