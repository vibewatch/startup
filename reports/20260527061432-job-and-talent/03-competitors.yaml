tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Job&Talent
    - Direct digital staffing and workforce platform
    - 10 countries; 300k+ workers placed in 2024; €1.3B valuation after 2025 down round
    - Large frontline employers in logistics, manufacturing, retail, and similar essential industries
    - Bundles worker supply with attendance, feedback, planning, and workforce insights
    - Public pricing remains opaque and the model stays exposed to temp-labor cyclicality
  - - Adecco
    - Incumbent staffing major
    - SIA 2024 staffing revenue $22.28B; multi-unit accounts are 43% of group revenue
    - Enterprise temp staffing, onsite, MSP, and broad industry coverage
    - Scale, cross-sell, and procurement reach across large accounts
    - Digital workflow differentiation is less explicit in public product pages than in Job&Talent’s pitch
  - - ManpowerGroup
    - Incumbent staffing major
    - SIA 2024 staffing revenue $17.28B; 3,500+ branch offices in 75 countries
    - Contingent, contract-to-perm, onsite, and sector-specialist staffing
    - Local reach and flexible staffing constructs at global scale
    - Public materials emphasize service breadth more than a distinct frontline software layer
  - - Randstad
    - Incumbent staffing and total-talent major
    - SIA 2024 staffing revenue $23.05B; largest global staffing firm by SIA ranking
    - Enterprise procurement, MSP, RPO, direct sourcing, contingent, and services talent
    - Integrated total-talent design and strong enterprise procurement access
    - Portfolio complexity can make the offer feel less mobile-first than a digital-native staffing platform
  - - Instawork
    - Digital staffing challenger
    - 9M+ workers; 90%+ fill rate; 2% no-show rate; AI hiring expansion
    - Hourly hospitality, warehouse, logistics, and adjacent frontline roles
    - Transparent booking economics, speed, and reliability metrics
    - Less evidence of deep onsite managed-service breadth than incumbent programs
  - - Zenjob
    - Regional digital staffing challenger
    - 20k students matched monthly; 12k jobs; 1,800+ companies; $50M Series D in 2022
    - German retail, logistics, hospitality, service, and student-heavy temporary labor
    - Direct-employment model and rapid ad-hoc plus longer-duration student staffing
    - Regional and student-centric rather than multinational and broad-based
  - - WorkMotion
    - Adjacent EOR and compliance platform
    - Official list pricing for EOR, direct hiring, and contractor management
    - Distributed teams and global hiring without local entities
    - Compliance-heavy onboarding, payroll, contracts, and country guidance
    - Not a local labor-supply network for warehouse or retail shifts
  - - Shiftboard
    - Workforce management point solution
    - Archived review pricing starts around $6 per month; enterprise configuration oriented
    - Manufacturing and other complex hourly or contingent environments
    - Scheduling, contingent labor management, credentialing, and integrations
    - No worker supply and some public reviews mention a steep learning curve
  - - Deputy
    - Workforce management point solution
    - Public list pricing at $5 / $6.50 / $9 per user per month
    - Shift-based SMB and mid-market frontline teams
    - Low-friction scheduling, time, attendance, and AI scheduling actions
    - Limited labor-supply depth or procurement leverage relative to staffing-led rivals
  notes: Selected competitor set covers global staffing majors, digital staffing challengers, and point solutions that can substitute for part of the same buyer problem. Scale and funding cells mix current public pages with independent press and market-ranking evidence.
  enumerationScope:
    coverage: partial
    basis: The table covers the most relevant direct, incumbent, adjacent, and point-solution rivals surfaced in the reviewed source pack, but it is not an exhaustive census of all regional agencies, ERP suites, or niche frontline software vendors.
