- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor
  - Price / unit / contract model
  - Included capabilities
  - Public signal or unknown
  - Implication
  rows:
  - - Job&Talent
    - Custom staffing and platform contract; no public list price in reviewed official pages
    - Labor supply, onsite service, and workforce-management platform access
    - Rate card not public
    - Public benchmarking is weak; margin quality must be tested with contracts and invoices
  - - Adecco
    - Custom quote
    - Temporary staffing plus centralized delivery and broader workforce solutions
    - List pricing not public
    - Procurement-led deals are not comparable to seat pricing
  - - ManpowerGroup
    - Custom quote
    - Contingent staffing, contract-to-perm, and onsite services
    - List pricing not public
    - Large-account economics likely depend on bundled services and volume
  - - Randstad
    - Custom quote
    - Total talent, MSP, RPO, direct sourcing, contingent, and services talent
    - List pricing not public
    - Enterprise procurement program economics matter more than sticker price
  - - Instawork
    - Upfront all-inclusive hourly rate; no monthly subscription
    - Worker pay, insurance, checks, taxes or fees, and booking transparency
    - Exact rate shown at booking; markup varies by role and worker class
    - Closest public proxy to staffing-market economics among digital challengers
  - - Zenjob
    - No monthly fees or minimums for short-term staffing; longer-term bookings bill contracted weekly hours
    - Short-term temps or longer-duration working students with digital administration
    - 48-hour short-term cancellation window; 3-18 month longer-term structure
    - Hybrid of staffing economics and managed student workforce commitments
  - - WorkMotion
    - €499 EOR; €399 direct hiring; €29 contractor management
    - Global hiring, payroll, contracts, and compliance support
    - Volume discounts and implementation terms unclear publicly
    - Competes for distributed hiring budgets, not local shift-fill budgets
  - - Shiftboard
    - Official pricing custom; archived review shows starting price around $6 per month
    - Scheduling, contingent labor management, credentialing, and integrations
    - Public price signal is dated and incomplete
    - Software entry cost appears far lower than staffing spend but may not map to enterprise TCO
  - - Deputy
    - $5 Lite; $6.50 Core; $9 Pro per user per month
    - Scheduling, timesheets, compliance, forecasting, and add-ons
    - Add-ons increase price; enterprise terms still separate
    - Easy pilot path for buyers that only need the workflow layer
  notes: Public pricing is strongest for software and EOR tools. Staffing-led rivals mostly require custom quotes or booking-specific rates, so the table shows packaging signals and known unknowns rather than a definitive net-price benchmark.
  enumerationScope:
    coverage: partial
    basis: This table includes only the vendors in the reviewed source pack for which an employer-facing pricing or packaging signal was publicly visible; realized discounts, negotiated markups, and customer-specific contract terms remain private.
