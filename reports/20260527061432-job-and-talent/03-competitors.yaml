  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: competitor-coverage
    missingEvidence: An exhaustive map of additional rivals such as UKG, Legion, WorkJam, ERP-native WFM suites, and local staffing agencies by country and vertical.
    whyItMatters: The selected competitor set is sufficient for underwriting the main substitution routes, but it can still understate niche or country-specific entrants that win on one workflow or one geography.
    diligencePath: Collect country-by-country win/loss logs, procurement shortlists, and third-party market maps for frontline WFM and staffing software by vertical.
    relatedQuestionRefs:
    - QP001
    - QP013
    relatedTableRefs:
    - TP001
  - type: enumeration-incomplete
    severity: material
    topic: pricing-realization
    missingEvidence: Realized markups, gross profit per labor hour, software discounts, and add-on attachment rates for Job&Talent, Instawork, incumbents, and software vendors.
    whyItMatters: Public list prices and booking examples do not reveal the true margin structure, negotiated discounts, or whether software modules actually improve account economics.
    diligencePath: Request customer contracts, SOWs, invoice samples, and country-level gross-margin bridges to compare realized economics rather than brochure pricing.
    relatedQuestionRefs:
    - QP018
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: multi-homing
    missingEvidence: Account-level data showing how often customers run Job&Talent alongside Deputy, Shiftboard, MSP providers, or direct sourcing programs.
    whyItMatters: Switching costs and displacement risk depend on whether alternatives coexist with Job&Talent in the same account or replace it outright.
    diligencePath: Ask for top-account stack diagrams, churn analyses, implementation timelines, and workflow-usage telemetry by cohort.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: digital-attach-rates
    missingEvidence: Quantitative attach rates for incumbent digital modules and Job&Talent workflow features within staffing accounts.
    whyItMatters: Without attach-rate data, it is hard to know whether digital tooling drives durable retention or is mostly a sales narrative layered on staffing relationships.
    diligencePath: Request module penetration, active-usage data, attendance-score adoption, and upsell conversion by account cohort and geography.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP002
