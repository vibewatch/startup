- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Integrated labor supply plus workflow control
    - Software-only vendors can replicate scheduling and attendance layers while clients source labor elsewhere
    - High
    - Request evidence that accounts using Job&Talent actually consolidate tools rather than multi-home across labor and software providers.
  - - Operational data from attendance and feedback loops
    - Deputy, Instawork, and incumbents are all adding AI, ratings, and workflow automation
    - Medium-High
    - Measure whether Job&Talent data improves fill rate, retention, or supervisor productivity versus alternatives.
  - - Enterprise account penetration
    - Randstad, Adecco, and Manpower can route the need into MSP, RPO, onsite, and total-talent programs
    - High
    - Map top-account procurement channels and win/loss reasons against incumbent program incumbency.
  - - Geographic and vertical footprint
    - Regional challengers can still dominate one country or one talent pool such as German student labor
    - Medium
    - Review country-by-country share, margins, and vertical repeat-order concentration.
  - - Compliance credibility
    - WorkMotion and incumbent agencies can neutralize compliance as a moat when the buyer does not need local shift-fill supply
    - Medium
    - Compare country coverage, indemnities, and compliance workflows for customers with multi-country needs.
  - - Pricing discipline
    - Public software seat prices look cheaper and easier to approve than opaque staffing contracts
    - High
    - Get realized pricing, gross-profit bridges, and procurement comparisons instead of relying on brochure economics.
  - - AI differentiation
    - AI is becoming table stakes across staffing and scheduling vendors, reducing narrative uniqueness
    - Medium-High
    - Separate true proprietary workflow outcomes from generic AI marketing claims in diligence.
  notes: The register translates public evidence into underwriting risks. Severity is a judgment call based on the likely effect on procurement, switching, and margin durability rather than a quantified loss forecast.
