        - 公司称，客户在现场服务中获得技术平台。
        - 说明软件价值可能支撑定价或降低流失，但看不到独立 SaaS 收入线。
        - 需要使用技术且有 / 无配套劳动力供给客户的定价表。
      - - AI 招聘
        - 披露运营成效，未披露价格
        - 公司宣传招聘更快、面试吞吐量高、填班率更好。
        - 更可能靠更好留存、更快填班或高端服务变现，而不是透明的软件费。
