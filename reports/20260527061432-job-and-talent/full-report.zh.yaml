      - number: '2.6'
        title: 证据缺口、矛盾估算与尽调路径
        blocks:
          - type: paragraph
            body: >-
              公开来源里仍有几个重要的规模和市场定义问题没有解决。没有任何单一数据提供商发布按欧洲、美国和拉美分别拆分的蓝领临时用工收入干净数据；大多数行业报告把临时用工、长期用工、RPO 和 WFM
              软件混在总量数据里，没有一手研究就无法可靠拆分。Randstad 和 Adecco 年报引用的是合并收入，但没有在分部层面单独披露临时、长期和 WFM 平台收入，因此无法独立验证 Job&Talent
              所竞争的蓝领特定 SAM。WFM 软件市场估算也随分析师是否纳入内嵌薪资的软件、更广 HCM 模块，或仅纳入独立排班工具而显著变化——Grand View Research 的 $8.07 billion
              2022 年基数无法直接与运营商报告的平台费相比。由此产生的不确定性意味着，Job&Talent 的 SAM 和 SOM 应被视为搭建出来的估算，而不是已确认的市场测量；任何依赖特定 TAM
              倍数的估值分析，都应锚定在最窄且合理可支撑的边界，而不是最宽的汇总数字。
            claimRefs:
              - CM036
              - CM037
              - CM038
      - number: '2.7'
        title: 展示材料
        blocks:
