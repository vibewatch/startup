      - number: '2.2'
        title: 市场规模：TAM、SAM 和 SOM 估算
        blocks:
          - type: paragraph
            body: >-
              测算全球临时用工市场，需要在几份不完美的公开来源之间交叉验证，每份来源的范围定义都不同。World Employment Confederation 的 2026 Industry Impact Report
              基于 40 多个国家的全国性联合会以及 Staffing Industry Analysts 的数据，记录私营就业机构 2024 年在全球安置 6,100 万人就业——比 2023 年多近 100
              万人——即便行业收入全球下降 4.2%。再对照 Randstad 2025 全年在 39 个市场的 €23.1 billion
              收入（按收入计为该行业最大运营商），全球前三大集团（Randstad、Adecco、ManpowerGroup）的合计收入超过 €60 billion，指向一个包含临时和长期用工的全球总市场，规模远高于 $500
              billion，2024 年最常见估算落在 $590–640 billion。劳动力管理软件子市场增长更快（到 2030 年 CAGR 11.7%），但层级小得多，当前约 $8–13
              billion。Job&Talent 2024 年 €1.8 billion 收入约占估算全球市场的 0.3%，印证了市场极度分散。公司的可服务市场——在其运营的 10
              个国家、聚焦蓝领临时用工——按这些地区和劳动力类型在全球市场中的份额估算为 $120–160 billion，不过没有干净的第三方来源直接确认这一拆分。WFM 软件层还增加了 $9–13 billion 的
              SAM 溢价，Job&Talent 正在通过平台费模型切入。美国临时帮助服务截至 2026 年初约有 2.41 million 名工人，说明需求较 2022 年峰值已明显收缩；BLS
              数据显示该板块仍低于下滑前高点。
