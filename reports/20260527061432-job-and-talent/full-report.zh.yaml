  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方重叠
        blocks:
          - type: paragraph
            body: >-
              Job&Talent
              周围的竞争不是一个干净的同业集合。想解决同一个一线用工问题的买方，可以选择规模化用工在位巨头、数字化用工平台，或软件优先的工作流工具；后者只移除排班、考勤或合规等一个痛点层。Job&Talent
              站在中间，因为它把劳动力供给和工作流控制打包在一起，尤其是在物流密集型场景，班前确定性和工人质量很关键。这让最直接的重叠范围比“用工市场平台”同业更宽。Randstad、Adecco、ManpowerGroup
              可以把需求吸收到规模大得多的用工和采购项目中；Instawork 和 Zenjob 用更数字原生的供给模型切同一个可变工时劳动力预算；Deputy、Shiftboard、WorkMotion
              则切更窄的待办任务，只要劳动力供给已在别处解决，它们仍能拿走买方预算。买方经常在同一个账户里组合几条路径。因此，品类地图和任何一个具名竞争对手同样重要。
