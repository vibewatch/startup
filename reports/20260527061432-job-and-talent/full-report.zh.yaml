      - number: '2.4'
        title: 结构性增长驱动与需求顺风
        blocks:
          - type: paragraph
            body: >-
              几个结构性因素支撑蓝领临时用工中介的长期需求。第一，制造业劳动力短缺：Deloitte 和 Manufacturing Institute 预计，美国制造商到 2033 年可能需要最多 3.8 million
              名新工人；若没有干预，约 1.9 million 个岗位可能无法填补。2025 年，20%
              的美国制造工厂因技能缺口无法满负荷生产。这一结构性缺口为能快速寻源合格一线工人的灵活用工方案创造了持久需求。第二，灵活劳动力偏好正在加速：2025 年 LinkedIn 上合同和临时岗位发布同比增长
              7%，尽管整体岗位发布下降，说明在当前宏观不确定期，客户更偏好可变劳动力，而不是长期用工承诺。第三，AI 采用正在重塑竞争格局。WEC 引用的 OECD 数据显示，2025 年 20.2% 的企业在运营中使用
              AI，是 2023 年比例的两倍多；同期，用工机构工人新增 AI 素养技能的比例比更广泛的 LinkedIn 人群高 46%。能把 AI
              嵌入招聘、排班和合规层的平台运营商，将获得结构性服务成本优势。第四，人口结构支撑长期代理需求：WEC 指出，代理机构是女性（占机构工人 40%）、学生（12%）和 45
              岁以上工人（23%）的包容引擎；即便劳动力市场更紧，灵活工作路径对这些人群仍很关键。
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM032
              - CM042
