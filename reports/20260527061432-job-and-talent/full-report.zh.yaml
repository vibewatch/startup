  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 这条运营漏斗服务成分很重：本地账户配置和招聘先铺底，再进入 app 确认、实时班次管理，最后走向复聘或站点扩张。
    data:
      nodes:
        - id: need-detect
          label: 需求激增
          detail: 季节性高峰、新门店、工厂产能或服务积压，都会拉动临时用工需求。
        - id: client-onboard
          label: 客户上线
          detail: 客户团队和本地运营先配置站点规则、合规要求与用工方案。
        - id: recruit
          label: 招募与筛选
          detail: 招聘人员和 Clara 把候选人推进已核验人才池，匹配即将开放的班次。
        - id: confirm
          label: 班次确认
          detail: 工人在班次开始前，通过员工端 app 确认出勤。
        - id: operate
          label: 实时班次管理
          detail: 经理实时盯住出勤、工时、评分和覆盖缺口。
        - id: rehire
          label: 复聘 / 扩张
          detail: 工人评分和站点可视性支撑复购订单，也把需求扩到更多班次或站点。
      edges:
        - from: need-detect
          to: client-onboard
          label: 买方决定外包波动用工需求
        - from: client-onboard
          to: recruit
          label: 配好合规要求、岗位和用工目标
        - from: recruit
          to: confirm
          label: 筛选候选人并排入即将开始的班次
        - from: confirm
          to: operate
          label: 已确认工人到岗，由现场管理
        - from: operate
          to: rehire
          label: 评分、出勤和产出数据决定复用
