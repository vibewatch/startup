      - number: '4.3'
        title: 资本结构、流动性可见度与负面信号
        blocks:
          - type: paragraph
            body: >-
              Job&Talent 的短期资本状况看起来好于紧急融资故事，但信号混杂。官方口径是，公司 2025 年 4 月以 €1.3 billion 估值完成 €92 million
              股权融资，并称资金将用于国际增长、销售能力和 AI 产品开发。但独立报道明确指出，相比 2021
              年峰值估值，这是一轮降价轮，是资本结构中最清晰的负面市场信号。公司称自身资金充足，融资公告也把这笔融资与进攻性扩张而非救助性资本重组相连。即便如此，公开记录仍漏掉核心承销输入：当前现金、月度烧钱或现金生成、未偿债务、契约、利息负担、到期安排和客户集中度。英国官方申报页面至少显示，Jobandtalent
              UK Limited 2024 年集团账目已在 2025 年 5 月提交，下一份账目应在 2026 年 9 月 30
              日前提交，因此公司有正式报告节奏。但本次审阅的公开证据仍没有给出合并流动性桥。宏观背景也仍不友好：WEC、ASA 和 HR Brew 都描述了一个进入 2026
              年仍存在流动性疲弱、选择性需求和利润率压力的用工市场。
