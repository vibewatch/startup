      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Job&Talent 的企业买方主要是物流、仓储、制造、零售或电商中大型公司的运营总监、工厂经理或供应链负责人。在物流和制造场景，临时用工预算归运营而非 HR 掌握，因此 Job&Talent
              的销售动作由运营推动、采购牵头；触发决策的通常是产能缺口、季节性高峰，或新配送中心开业，而不是总部统一下达的人才战略项目。在零售和酒店餐饮场景，买方组合更多转向 HR
              总监和总经理，他们与区域或地区运营共同掌握预算。使用者——被派到班次上的工人——与付款方不同：客户公司向代理机构付款，工人则按临时代理用工模式受雇于 Job&Talent。监管约束会影响买方对短合同的胃口：英国
              Agency Workers Regulations 规定，满足资格后 12 周即产生同工同酬权利，给客户的岗位轮换设计加上一只合规时钟。EU Directive 2008/104/EC
              要求所有欧盟成员国在临时工与正式工之间适用非歧视原则，因此在 Job&Talent 有欧盟业务的 7 个市场里，合规成为买方—平台关系的结构性部分。季节性需求是最清晰的高容量采用触发器：NRF 预测 2025
              年美国季节性零售招聘 265,000–365,000 人，这是一个反复出现的采购窗口，平台必须能在短时间内接住。采用路径通常从直接企业销售开始，配合试点、填补率验证，再从一个业务单元或地区逐步扩展到全公司部署。
