      - number: '7.3'
        title: 财务、模式与合作伙伴 / 依赖风险
        blocks:
          - type: paragraph
            body: >-
              Job&Talent 的财务风险集中在三项相互关联的暴露。第一，2025 年 4 月 Series F 轮以 EUR 1.3 billion 降估值完成——比 2021 年 Series E 峰值低近 $1
              billion——说明二级市场定价已经转向不利于公司，未来要以有利条款融资，需要继续保持盈利增长。公司把估值下调归因于更广泛市场动态，但估值压缩限制管理层战略选择，也可能与持有优先权的早期投资人产生治理张力。第二，行业集中度风险显著：收入偏向物流、仓储、零售和电商，而这些行业
              2024 年全球下滑 9.5%，尽管 Job&Talent 表现优于市场。若这些垂直需求进一步收缩，量和价格可能同时承压，这一动态已经在 2025 年 Q3 影响 Robert Half、Kelly
              Services 和 Randstad。第三，Job&Talent 与 BlackRock 的债务额度、契约时间表和到期结构完全未披露。在收入持续疲软情景下，未披露的契约触发器可能加速还款义务。公司美国市场
              2024 年 Q4 增长 27%，提供部分抵消，但增长引擎集中在单一地域，也有自身脆弱性。十国运营所依赖的第三方技术和薪资处理供应商没有公开具名，仅凭公开来源无法评估集中度。
