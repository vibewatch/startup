  - id: TI004
    title: 单位经济性与用工服务基准表
    columns:
      - 指标或代理指标
      - Job&Talent 公开信号
      - 基准或比较
      - 为何重要
      - 尽调要求
    rows:
      - - 每名 FTE 覆盖工人数
        - 每名 FTE 覆盖 63 名工人
        - 传统机构为 19（公司称）
        - 若口径一致，能体现公司的核心服务成本逻辑。
        - 需要方法论，以及与用工服务同行可比的分母定义。
      - - 客户生产率提升
        - 最高 30%
        - 未披露独立基准
        - 说明产品卖点是可衡量 ROI，而不只是劳动力供给。
        - 需要客户案例层面的前后经济性，以及队列持续性。
      - - 填班率
        - 98%，行业常态为 75%
        - 业务网站上的内部基准对比市场常态
        - 填班率直接驱动收入转化和客户黏性。
        - 需要按垂直行业、旺季和地域拆分的独立报告。
      - - 缺勤率
        - 2%，对比 8%
        - 业务网站上的内部基准对比市场常态
        - 降低爽约直接保护劳动密集型班次的毛利。
        - 需要站点层面的差异，以及漏班带来的服务抵扣敞口。
      - - 贡献利润率
        - 27.3%
        - Randstad 2025 年毛利率为 18.7%，基础 EBITA 利润率为 3.1%
        - 说明 Job&Talent 披露了一个重要利润层级，但跨公司可比性并不完美。
        - 需要 Job&Talent 按分部拆分的毛利率和 EBITDA 利润率定义。
      - - 每名 FTE 收入
        - €804k
        - Adecco 提到 AI 驱动的省时和服务成本下降，但未披露相同比率
        - 支持自动化杠杆逻辑，但同行口径归一化有限。
        - 需要与同行对比的多年一致生产率 KPI。
      - - 营运资本代理指标
        - 未披露
        - Randstad 2025 年 DSO 为 56.7 天
        - 即使经营利润为正，用工服务经济性也常受应收账款约束。
        - 需要 Job&Talent DSO、坏账费用和保理 / 融资安排。
      - - 数字平台基准
        - 平台现在管理临时用工，并向长期员工工作流扩张
        - Randstad 称已有 €2bn 跑在数字化市场上
        - 说明传统同行也在数字化，仅靠软件提升不是护城河。
        - 需要 Job&Talent 平台用户的附加销售率、净留存和流失数据。
    notes: 本表混合了公司自述运营代理指标与上市人力派遣公司的披露基准。这些指标只有方向性， 不是苹果对苹果的经审计单位经济性。
