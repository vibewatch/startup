      - number: '1.3'
        title: 融资历史、估值重置与投资者基础
        blocks:
          - type: paragraph
            body: >-
              Job&Talent 的资本历史同时说明投资者背书很强，也说明估值出现实质性重置。2021 年 12 月，公司完成由 Kinnevik 领投的 $500 million Series E，SoftBank
              Vision Fund 2 大额参投，Atomico、DN、Infravia、Kibo、Quadrille 继续跟投；同时从 BlackRock 获得 $75 million 债务融资。该轮投后估值 $2.35
              billion，用于支持美国扩张。但到 2025 年 4 月，Job&Talent 只完成规模小得多的 €92 million Series F，估值 €1.3 billion。TechCrunch
              明确称这是一轮降价轮，公司自己把估值下调归因于成长阶段科技公司的整体市场环境。新一轮仍然吸引了可信的投资者组合——Atomico、BlackRock、DN
              Capital、Hercules、InfraVia、Kibo、Kinnevik——但尽调信息并不单向利好。投资者基础仍深且愿意支持；但公开记录没有完整对齐累计融资额、当前未偿债务、优先权条款，或
              2021–2025 重置期间的稀释情况。Forbes 提到历史累计融资超过 €800 million，说明公司吸引过巨额总资本；但公开资料细节不足，无法把它转换成完全可靠的当前股权结构模型。
