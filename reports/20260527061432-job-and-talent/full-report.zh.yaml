      - number: '8.5'
        title: 待补尽调与监测信号
        blocks:
          - type: paragraph
            body: >-
              阻碍更高确信度判断的主要信息缺口是财务和结构。此次运行审阅的公开来源未披露：合并现金或净现金状况；月度或季度烧钱 / 产现速度；完整股权结构表优先权瀑布和清算优先权倍数；按业务分部拆分的毛利率（人力服务收入
              vs. 软件 / 服务费）；NRR 或队列留存统计；未偿债务本金、利率和到期时间表；2026 年 4 月 Job and Talent Holding Limited 押记登记细节。Jobandtalent UK
              Limited 2024 年集团账目（AA 申报，2025 年 5 月，46 页）可能部分回答现金和资产负债表问题，但本报告未审阅。

              关键宏观监测信号：FRED 临时帮助服务序列（TEMPHELPS）是美国人力服务需求的领先指标；若月度持续下滑，将压缩基准情景收入假设。WEC Industry Impact Report 2026
              报告称，2024 年北美安置量约减少 100 万，这是 Job&Talent 最大增长市场的逆风。Staffing Industry Analysts
              的滚动衰退逻辑（三年连续临时就业收缩）把企稳识别为最新信号，但若再出现一轮收缩，将损害乐观情景假设。

              AI 竞争者监测：SIA Staffing Company Tech Stack 2026 Update 记录了前台、中台和后台正在形成趋同的 AI
              化运营架构。如果大型传统厂商（Randstad、Adecco、ManpowerGroup）在更大的收入基数上成功部署可比 AI 能力，Job&Talent 的技术护城河可能在 AI
              收入溢价反映进倍数前收窄。Adecco Group 2025 年年报指出，智能体 AI 目标是在 2026 年底覆盖 Adecco GBU 收入的 50% 以上——这是直接竞争信号。HR Brew 2025 年
              Q3 报道捕捉到的人力服务市场逆风（Robert Half 同比 -8%，Kelly -10%，Randstad -1.2%）显示，即便对债务负担更低的成熟玩家，运营环境仍然困难。
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
              - CV046
              - CV047
              - CV048
      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 建议——观察
            body: >-
              在完成毛利率、NRR、优先权瀑布和 2026 年 4 月债务押记的财务尽调前，不要按当前 €1.3 billion 标记投入资本。AI 逻辑可信，但商业验证尚未达到足以支撑相对上市人力服务同业约 2.5×
              溢价的规模。待 2025 年经审计集团账目提交（2026 年 9 月到期），且 2026 年 4 月押记性质确认后，再重新评估。
            calloutType: recommendation
            claimRefs:
              - CV001
