              招聘器处理的候选人和客户数据。Clara 还自我声明符合 SOC 2 原则和 EU AI Act 对 HR 招聘的高风险要求，并发布 GDPR
              文档和欧盟数据驻留承诺。这些控制对企业采购有意义，也确实降低了明显安全反对意见。即便如此，公开证据仍有三个重要缺口：Clara 没有发布第三方算法偏见审计；没有披露正式正常运行时间
