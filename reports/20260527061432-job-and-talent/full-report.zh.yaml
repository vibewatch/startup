  - id: TP003
    title: 定价 / 打包方式对比
    columns:
      - 竞争对手
      - 价格 / 单位 / 合同模式
      - 包含能力
      - 公开信号或未知项
      - 影响
    rows:
      - - Job&Talent
        - 自定义用工与平台合同；审阅过的官方页面没有公开标价
        - 劳动力供给、驻场服务和劳动力管理平台访问
        - 费率表未公开
        - 公开基准弱；利润率质量必须用合同和发票验证
      - - Adecco
        - 定制报价
        - 临时用工加集中交付，以及更广的劳动力解决方案
        - 标价未公开
        - 采购主导交易不能与按席位定价直接比较
      - - ManpowerGroup
        - 定制报价
        - 弹性用工、合同转正式和驻场服务
        - 标价未公开
        - 大客户经济性可能取决于捆绑服务和用量
      - - Randstad
        - 定制报价
        - 全人才、MSP、RPO、直接寻源、弹性用工和服务型人才
        - 标价未公开
        - 企业采购项目经济性比标价更重要
      - - Instawork
        - 预先给出全包小时费率；无月订阅
        - 工资、保险、核查、税费，以及预订透明度
        - 预订时显示精确费率；加价随岗位和工人类别变化
        - 在数字挑战者中，是最接近用工市场经济性的公开代理指标
      - - Zenjob
        - 短期用工无月费或最低消费；较长期预订按合同约定周工时计费
        - 短期临时工，或较长期工作学生，并配数字化管理
        - 短期取消窗口为 48 小时；较长期结构为 3-18 个月
        - 用工经济性与托管学生劳动力承诺的混合
      - - WorkMotion
        - €499 EOR；€399 直接招聘；€29 承包商管理
        - 全球招聘、薪资发放、合同与合规支持
        - 批量折扣和实施条款公开信息不清楚
        - 争夺分布式招聘预算，而不是本地补班预算
      - - Shiftboard
        - 官方价格定制；存档评论显示起价约为每月 $6
        - 排班、临时劳动力管理、资质认证与集成
        - 公开价格信号陈旧且不完整
        - 软件入门成本看起来远低于用工服务支出，但可能无法映射到企业 TCO
      - - Deputy
        - $5 Lite；$6.50 Core；$9 Pro，每用户每月
        - 排班、工时表、合规、预测和附加组件
        - 附加组件抬高价格；企业条款仍需另谈
        - 只需要工作流层的买方可以轻松试点
    notes: 公开定价最清楚的是软件和 EOR 工具。以用工服务为主的竞争对手大多需要定制报价或按预订定价， 因此本表呈现的是包装信号和已知未知项，而不是确定的净价基准。
