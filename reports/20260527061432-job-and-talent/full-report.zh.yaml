  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释措施 / 尽调要求
    rows:
      - - 劳动力供给与工作流控制一体化
        - 纯软件厂商可以复制排班和考勤层，客户则从别处采购劳动力
        - 高
        - 要求提供证据，证明使用 Job&Talent 的客户确实在整合工具，而不是在劳动力和软件供应商之间多栖。
      - - 来自考勤和反馈闭环的运营数据
        - Deputy、Instawork 与传统机构都在加 AI、评分和工作流自动化
        - 中高
        - 衡量 Job&Talent 数据是否相较替代方案提升填班率、留存或主管效率。
      - - 企业客户渗透
        - Randstad、Adecco 与 Manpower 可以把需求导入 MSP、RPO、驻场和全人才方案
        - 高
        - 梳理头部客户采购渠道，并把赢单 / 输单原因与既有项目席位对照。
      - - 地域与垂直行业覆盖
        - 区域挑战者仍可主导一个国家或某个人才池，例如德国学生劳动力
        - 中
        - 逐国审查份额、利润率和垂直行业复购集中度。
      - - 合规可信度
        - 当买方不需要本地补班供给时，WorkMotion 和传统派遣机构可以抵消合规护城河。
        - 中
        - 比较多国需求客户的国家覆盖、赔付承诺和合规工作流。
      - - 定价纪律
        - 公开的软件席位价格看起来比不透明的人力派遣合同更便宜，也更容易获批
        - 高
        - 拿到实际成交价格、毛利桥和采购比较，不要只看宣传册经济性。
      - - AI 差异化
        - AI 正成为人力派遣和排班厂商的标配，叙事独特性被削弱
        - 中高
        - 尽调时把真正的自有工作流成效与泛化 AI 营销话术拆开。
    notes: 该登记表把公开证据转成投资判断风险。严重性是判断项，依据是其可能影响采购、切换和利润率耐久性， 而不是量化损失预测。
