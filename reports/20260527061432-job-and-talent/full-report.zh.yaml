          - type: callout
            title: 降估值轮信号与优先权悬顶
            body: >-
              2025 年 Series F 明确是降估值轮，从 $2.35 billion（2021）降至 $1.5 billion，峰谷跌幅约 36%。2026 年 4 月 Holding
              实体押记登记引入新的未量化优先义务。两者合起来，形成一个结构性信息缺口：在优先权和债务堆叠被尽调清楚前，新投资人可获得的有效回报无法判断。
            calloutType: risk
            claimRefs:
              - CV001
              - CV006
              - CV022
              - CV036
              - CV043
          - type: callout
            title: 公开可比公司校准溢价
            body: >-
              Randstad 披露的 2025 年 EV 为 €6.702 billion、收入为 €23.077 billion（0.29× EV/Revenue），EBITA 利润率
              3.1%，为纯人力服务业务建立了底部倍数。Job&Talent 隐含 0.72× EV/Revenue，要求投资人为 AI 可选性支付约 2.5× 于上市人力服务基线的价格——只有软件层毛利率扩张或平台 NRR
              高于 110% 的证据，才能证明这一溢价合理。
