      - number: '8.2'
        title: 可比估值与融资分析
        blocks:
          - type: paragraph
            body: >-
              要为一家私有、AI 增强型人力服务平台建立公允价值锚点，需要三类参照：上市传统人力服务公司、私有平台同业，以及内部 DCF/EBITDA 交叉校验。

              上市传统人力服务可比公司收入倍数低迷，反映临时用工中介的周期性和低利润率特征。Randstad 2025 年年报显示，收入 €23.077 billion，基础 EBITA 利润率 3.1%（EBITA €715
              million），年末市值 €5.696 billion，企业价值 €6.702 billion——对应 EV/Revenue 约 0.29×、EV/EBITA 约 9.4×。ManpowerGroup
              投资者页面披露 2025 年分部收入 $17.957 billion；按 NYSE 每股 $26.63–$62.66 的 2025 年股价区间和 $1.677 billion 总债务估算，EV/Revenue 约
              0.20–0.25×。Staffing Industry Analysts 的 100 大人力服务公司报告（2025 年 8 月）将 Randstad、Adecco（约 $22.3 billion）和
              ManpowerGroup（约 $17.3 billion）列为前三，三者 2024 年合计收入下滑 3% 至 $257 billion——确认行业仍处于量收缩。

              私有平台同业更难估值。Zenjob 2022 年 2 月完成 $50 million Series D，估值未披露；TechCrunch 当时称其在欧洲市场直接与 Job&Talent
              竞争。截至运行日，Zenjob 没有后续公开融资定价。美国小时工撮合平台 Instawork 也没有确认的 2022 年后公开估值。这些缺口说明，Job&Talent 当前 €1.3 billion
              定价是行业里最可操作的私有可比标尺。

              对照上市可比公司，若按纯人力服务假设，Job&Talent €1.3 billion 投后股权价值显得偏高。若按 Randstad 0.29× EV/Revenue 倍数估值，隐含 EV 约 €522
              million——远低于当前标记。按 0.5×（给 AI 增强交付一个温和技术溢价）计算，隐含 EV 约 €900 million。当前 €1.3 billion 标记意味着 EV/Revenue 约
              0.72×——约为上市人力服务平均水平的 2.5×——这需要持续证明软件层毛利率和平台粘性。按 EBITDA 口径，€1.3 billion 标记意味着约 21× EV/EBITDA，而 Randstad 约
              9.4×——同样是一个为未来 AI 变现定价的实质溢价。Upwork 2025 年 10-K 显示总收入 $787.8 million；虽然 Upwork
              模式不同（白领自由职业），但它为成长阶段数字劳动力撮合平台的 EV/Revenue 倍数提供参照。

              Jobandtalent UK Limited（07890603）的 Companies House 申报显示，截至 2024 年 12 月 31 日的集团账目已在 2025 年 5 月提交（46
              页），确认英国正式报告节奏。2026 年 4 月在 Job and Talent Holding Limited
              实体（10084917）上登记的押记（MR01，100849170018）是一个重大进展：它表明募资后新增了有担保信贷额度或融资安排，叠加一层公开来源未量化的债务义务。
