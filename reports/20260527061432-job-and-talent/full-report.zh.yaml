      - number: '4.2'
        title: 单位经济代理指标与用工服务基准
        blocks:
          - type: paragraph
            body: >-
              关于 Job&Talent 单位经济的公开证据仍高度依赖代理指标，但比许多私营用工服务 公司能披露的内容更强。公司在业务网站上宣称填补率 98%，行业常态为 75%；缺勤率 2%，行业为
              8%；并称运营工作流可以减少未到岗、提高打卡准确性和工人质量。单独的产品发布给出更多方向性指标：Clara 据称完成超过 190,000 次面试和 22,000 次录用，速度比人工招聘快 65%；AI
              考勤教练据称在已观察部署中把缺勤率降低 30%，并把出勤率推至 90%。这些是公司主张，不是经审计的单位经济表，因此应当视为方向性的运营杠杆信号。行业基准在这里很重要。Staffing Industry
              Analysts 称，人才平台定价正在向买方费用、工人收费和订阅多元化；而 Randstad 年报仍显示，规模化用工服务 的低利润率和营运资金敏感性没有消失：2025 年毛利率 18.7%、基础 EBITA
              利润率 3.1%、DSO 56.7 天。合在一起看，证据表明 Job&Talent 的 AI 层可能改善服务成本，但无法消除用工服务 与劳动力绑定的根本经济属性。
