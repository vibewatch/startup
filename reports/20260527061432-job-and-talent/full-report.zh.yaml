            body: >-
              公开证据足以支持一个方向性的财务判断。Job&Talent 不只是概念阶段的 HR 市场平台；它披露了 €1.8 billion 的 2024 年收入、正的基础
              EBITDA、上升的贡献毛利率，以及显示客户交付已有真实规模的运营指标。公司也似乎正从纯临时劳动力中介，演进为一个捆绑式劳动力管理平台，内嵌
              AI，并扩大对长期工人的覆盖。话虽如此，承销案例仍不完整，因为最影响决策的数字缺失。本文审阅的公开来源没有披露实际雇主账单费率、工人薪酬价差、分部毛利率、净收入留存、现金余额、债务条款、DSO、应收账款账龄或跑道。2025
              年融资降低了即时偿付风险，但更低估值说明外部投资者不愿维持 2021 年的定价基准。因此，正确结论是平衡的：盈利轨迹看起来可信，平台可能正在改善服务经济性，资本依赖度似乎低于 2021–2022
              年扩张阶段，但仅凭公开证据仍无法精确承销下行保护。
