chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、产品转向与运营版图
        blocks:
          - type: paragraph
            body: >-
              Job&Talent 如今的核心身份比创立时清楚得多：公司 2009
              年在马德里起步，最初是面向年轻人的求职网站；但公开的创始人访谈和公司自己的时间线显示，管理层后来砍掉了分类信息式产品，围绕蓝领临时用工重建公司。2016
              年这次转向很关键，因为现在的产品不只是候选人发现。Job&Talent 现在把自己定位为面向基础行业的 AI
              劳动力平台，把工人寻源、入职、发薪、工时表、班次管理和合规合在一起。公开版图既有规模，也足够新。2025 年官方披露称，公司在欧洲、美国和拉美 10 个国家运营，2024 年安置超过 30
              万名工人，并服务物流、仓储、零售、制造、电商等行业超过 3,250 家公司。美国已成为叙事中的战略核心，既是增长最快的市场，也是后续治理和产品投入的塑形区域。这给后文提供了清晰锚点：分析 Job&Talent
              时，应把它看作一家有真实劳动力市场敞口、已经规模化的软件赋能用工服务商，而不是纯招聘 SaaS 厂商，或只套了一层薄数字界面的传统临时用工机构。
