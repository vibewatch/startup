companyProfile:
  summary: >
    Job&Talent 是一家总部位于马德里的劳动力管理平台，由 Juan Urdiales 和 Felipe Navío 于 2009
    年创立。公司从在线招聘网站转向数字化用工和劳动力运营平台，聚焦一线和蓝领工作。公开证据显示公司已有相当规模——2024 年覆盖 10 个国家，安置 30 多万名工人，服务 3,250 多家客户企业，并推出了以 Clara
    为先导、后续智能体跟进的 AI 产品。但从上市公司投资者视角看，毛利率、NRR、现金、债务、股权优先权和当前员工数等披露仍明显不足。
