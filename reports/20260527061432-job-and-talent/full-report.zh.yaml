            body: >-
              公开持久性证据弱于运营证明。Job&Talent 反复声称在物流、零售和制造行业留存率高，案例也呈现一些扩张机制：客户可以从公司 app 订购更多工人，经理可以从已评分人才池中重新雇用，THG
              提到高峰招聘期间流失率下降，Diab 指向临时转正式，Cabify 则描述一段自 2021 年延续的关系。工人端采用显然很广。Apple 英国店面称，已有 340,000 多人通过平台找到工作；Apple
              英国和美国列表以及 Google Play 显示，iOS 和 Android 评分大约 4.7 星，AppBrain 记录累计下载 570 万次。广度重要，因为 Job&Talent
              对雇主的承诺取决于工人端参与确认、打卡、工时和评分。即便如此，公司仍未公开 NRR、GRR、合同期限或续约数据，本章只能依赖代理指标，而不是机构级留存队列。
