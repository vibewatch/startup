      - number: '8.4'
        title: 建议、退出准备度与入场纪律
        blocks:
          - type: paragraph
            body: >-
              综合结论是观察。核心原因是价格：按约 21× EV/EBITDA 和约 0.72× EV/Revenue，Job&Talent 已按 AI 平台未来定价，但支撑承销最关键的指标仍未证明——P&L
              层面的毛利率、NRR、软件 ARR，或清晰债务堆叠。降估值轮结构增加额外摩擦：BlackRock 和 InfraVia 参与 2025 年 4
              月融资，说明股权结构表中包含拥有优先权和治理权的成熟机构投资人，新投资人在入场前必须仔细尽调。2026 年 4 月押记登记又增加一项未量化的优先义务。

              满足以下条件时，买入逻辑才站得住：(a) 2025 年集团账目（按 Companies House 要求 2026 年 9 月 30 日前到期）确认毛利率高于 30%，自由现金流为正；(b) NRR
              和软件抽成率指标披露或估算高于 110%；(c) 优先权和债务堆叠经尽调确认，在基准退出情景下不会吸收超过 30–35% 的上行；(d) 2026 年 4 月押记确认是运营性信贷额度，而不是通往困境的过桥工具。

              退出准备度受限。人力服务行业公开市场胃口疲弱：Randstad 市值从 €7.4 billion（2024）降 23% 至 €5.7 billion（2025），ManpowerGroup 股价触及 2025
              年低点 $26.63，全球人力服务收入收缩（SIA：2024 年 -3% 至 $257 billion）削弱 IPO 可比集合吸引力。若 AI
              差异化得到证明，出售给全球前五大人力服务公司之一（Randstad、Adecco、ManpowerGroup、Allegis、Recruit）是一条可信退出路径，但产业买家很可能按 EBITDA
              倍数（9–12×）定价，按当前 EBITDA 对应退出估值 €550–€740 million——明显低于当前入场标记。战略溢价有可能，但缺少可比交易数据，无法建模。

              ASA/LinkedIn 2026 survey 显示合同岗位发布同比上升 7%，灵活用工工人添加 AI 技能的速度比更广泛的 LinkedIn 人群快 46%，这对 Job&Talent
              可服务市场是方向性正面信号，但不能验证当前估值下的具体变现逻辑。
            claimRefs:
              - CV033
              - CV034
              - CV035
