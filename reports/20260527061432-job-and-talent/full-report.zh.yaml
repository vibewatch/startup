      - number: '2.5'
        title: 采用约束、周期逆风与监管摩擦
        blocks:
          - type: paragraph
            body: >-
              最明显的约束是 2022 至 2025 年左右席卷全球临时用工市场的三年周期下行。Staffing Industry Analysts 将其称为“滚动衰退”——一场没有触发更广泛 GDP
              警报的长期收缩，驱动因素包括后 COVID 招聘泡沫正常化、利率上行，以及向直接寻源和 AI 转移的结构性变化。美国临时就业在持续下滑后，2025 年大体持平；Robert Half（收入同比下降
              8%）、Kelly Services（下降 9.9%）和 Randstad（CFO 提到招聘信心极低）的 2025 年 Q3 业绩都证明，宏观环境压缩了数量和定价。Adecco Group
              同期同比增长是例外，部分由技能培训和教练服务驱动，而不是传统临时安置。结构性约束包括切换成本：成熟供应商积累了深厚工人池、审计轨迹和合规历史，即使平台提供更好技术，企业客户也不愿迁移。监管摩擦也是约束——更严格的数据治理和
              AI Act 义务带来的合规成本上升，正成为部署算法匹配的机构越来越重的负担。全球宏观不确定性（关税波动、利率政策不确定、地缘政治压力）会让客户在新供应商承诺上更谨慎。Job&Talent 在 2024 年维持
              €1.8 billion 收入，跑赢全球市场 -9.5% 的下滑，显示出相对韧性；但所有用工运营商面对的结构性逆风真实存在，截至 2026 年中仍未完全消退。
