        - 中
        - 需要客户集中度、垂直行业组合，以及弱需求情景下的站点层面弹性。
    notes: 本表聚焦成本和现金流驱动因素，而非已披露利润表科目，因为公开来源没有提供 Job&Talent 完整且经审计的收入成本桥。
