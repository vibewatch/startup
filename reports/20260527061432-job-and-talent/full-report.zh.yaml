  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 毛利率和收入组合
        - 按分部披露的已审计毛利率（人力派遣 vs. 软件 / 服务）
        - 决定 AI 带来利润率扩张，还是只带来成本下降
        - 索取数据室；2024 年英国集团账户（46 页，2025 年 5 月提交）可能包含
      - - 净留存率（NRR）
        - 2023–2025 年雇主账户队列 NRR
        - NRR >110% 支撑溢价倍数；低于 100% = 结构性流失风险
        - 管理层材料；无公开替代指标
      - - 清算优先权分配瀑布
        - Series E 和 F 的优先权倍数、参与权和反稀释条款
        - 决定基准或悲观退出情景中新投资人的实际回报
        - 数据室股权结构表；优先股公司注册证书
      - - 2026 年 4 月债务押记细节
        - 交易对手、本金、利率、到期日、契约（MR01 文件 100849170018）
        - 融资后六个月新增了无法量化的高级义务
        - Companies House 押记文件（18 页）；管理层确认
      - - 现金和现金跑道
        - 当前现金余额、每月现金消耗或生成，以及 Series F 后现金跑道
        - 对下一轮融资时点和金额承保至关重要
        - 数据室；已审阅公开来源均未披露
      - - 美国收入和利润率细节
        - 2024 年和 2025 年 Q1 美国收入、贡献利润率和单位经济
        - 美国是最大增长驱动因素；没有分部利润率，乐观情景无法验证
        - 管理层披露；2024 年账户可能包含地理分部数据
      - - 客户集中度和 NPS
        - 前 10 大客户收入占比和净推荐值
        - 集中度风险影响 NRR、流失暴露和收入质量
        - 数据室；集团账户中可能部分披露
      - - AI 智能体商业表现
        - Clara 和后续智能体对收入的贡献，而不只是节约成本
        - 决定 AI 带来定价权（乐观），还是只带来效率（基准）
        - 产品简报；要求披露费率卡和增量收入归因
    notes: >-
      尽调事项按其对建议的重要性作非正式排序。第 1–4 项（毛利率、NRR、优先权瀑布、债务押记）是作出买入或强烈买入判断的阻断项。第 5–8 项（现金、美国细节、集中度、AI 商业化）重要，但可能通过 2024
      年英国集团账户部分回答。
