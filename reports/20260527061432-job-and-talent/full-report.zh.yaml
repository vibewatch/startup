  - id: TP001
    title: 竞品画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标客群
      - 差异化
      - 局限
    rows:
      - - Job&Talent
        - 直营数字用工与劳动力平台
        - 10 个国家；2024 年安置 300k+ 名工人；2025 年估值下调融资后估值 €1.3B
        - 物流、制造、零售等基础行业的大型一线雇主
        - 把工人供给与考勤、反馈、规划、劳动力洞察打包
        - 公开定价仍不透明，模式仍暴露在临时用工周期波动中
      - - Adecco
        - 传统用工巨头
        - SIA 2024 用工服务收入 $22.28B；多单元账户占集团收入 43%
        - 企业临时用工、驻场、MSP，以及广泛行业覆盖
        - 在大客户中有规模、交叉销售和采购触达
        - 与 Job&Talent 的叙事相比，公开产品页面中的数字工作流差异化不够明确
      - - ManpowerGroup
        - 传统用工巨头
        - SIA 2024 用工服务收入 $17.28B；75 个国家 3,500+ 家分支机构
        - 弹性用工、合同转正式、驻场和行业专家用工服务
        - 以全球规模提供本地触达和灵活用工结构
        - 公开材料更强调服务广度，而不是清晰的一线软件层
      - - Randstad
        - 传统用工与全人才管理巨头
        - SIA 2024 用工服务收入 $23.05B；按 SIA 排名为全球最大用工服务公司
        - 企业采购、MSP、RPO、直接寻源、弹性用工和服务型人才
        - 一体化全人才设计和强企业采购入口
        - 组合复杂度会让产品相比数字原生用工平台显得不够移动优先
      - - Instawork
        - 数字用工挑战者
        - 9M+ 名工人；90%+ 填补率；2% 缺勤率；AI 招聘扩张
        - 酒店餐旅、仓储、物流及相邻一线小时工岗位
        - 透明的预订经济性、速度和可靠性指标
        - 深度驻场托管服务广度的证据少于传统机构项目
      - - Zenjob
        - 区域数字用工挑战者
        - 每月匹配 20k 名学生；12k 个岗位；1,800+ 家公司；2022 年 $50M Series D
        - 德国零售、物流、酒店餐旅、服务业，以及学生占比高的临时用工
        - 直接雇佣模式；快速临时补位与较长期学生用工并存
        - 更偏区域和学生人群，不是跨国、宽口径平台
      - - WorkMotion
        - 相邻 EOR 与合规平台
        - EOR、直接招聘和承包商管理有官方标价
        - 面向分布式团队和无需本地实体的全球招聘
        - 以合规为重心的入职、薪资、合同和国家指南
        - 不是服务仓储或零售班次的本地劳动力供给网络
      - - Shiftboard
        - 劳动力管理单点解决方案
        - 存档评测显示价格约 $6 / 月起；偏企业配置
        - 制造业及其他复杂小时工或弹性用工场景
        - 排班、弹性劳动力管理、资质认证和集成
        - 不提供工人供给，部分公开评论提到学习曲线陡峭
      - - Deputy
        - 劳动力管理单点解决方案
        - 公开标价为每用户每月 $5 / $6.50 / $9
        - 轮班制 SMB 和中端市场一线团队
        - 低摩擦排班、工时、考勤和 AI 排班动作
        - 相比用工服务驱动的对手，劳动力供给深度或采购杠杆有限
    notes: 所选竞品覆盖全球用工巨头、数字用工挑战者，以及能替代同一买方问题一部分的单点解决方案。规模和融资单元混合使用当前公开页面、独立媒体和市场排名证据。
