      - - 投后估值
        - €1.3 billion
        - 官方融资公告和独立报道
        - 证明仍能融资，但价格低于 2021 年峰值。
        - 需要董事会材料说明估值依据和优先股堆叠。
      - - 反向估值信号
        - 相较 2021 年 $2.35 billion 估值，属于降价轮
        - TechCrunch 和 Sifted 将 2025 年融资描述为估值重置
        - 说明即便公司仍讲增长故事，投资人仍要求更低估值。
        - 需要股权结构表、清算优先权和任何反稀释条款。
      - - 资金用途
        - 国际扩张、销售扩张和 AI 产品开发
        - 官方融资公告
        - 说明本轮资金用于进攻性增长和产品建设。
        - 需要 24 个月预算分配和与里程碑挂钩的支出计划。
      - - 正式申报节奏
        - 2024 年集团账目于 7 May 2025 提交；Jobandtalent UK Limited 下一份账目在 30 September 2026 到期
        - Companies House 官方页面
        - 说明有正式报告，但一眼看不到投资人需要的经营指标。
        - 需要解析后的账目，并确认母公司 / 子公司范围一致。
      - - 现金余额与现金跑道
        - 已审阅来源未公开披露
        - 融资新闻材料和备案索引没有呈现现金数字
        - 仅靠公开证据无法对流动性做压力测试。
        - 需要当前现金、最低现金契约和下行情景现金跑道模型。
      - - 债务、利息和契约
        - 已审阅来源未公开披露
        - 已审阅来源没有提供当前债务余额或融资条款
        - 尽管刚完成股权融资，资本结构风险仍不透明。
        - 需要债务明细、契约、摊还安排和担保包。
    notes: 这是对资本充足性信号的部分列举，不是完整资产负债表重建。关键缺失数字是公司当前现金、债务和契约状态。
