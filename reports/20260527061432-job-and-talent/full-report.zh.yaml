  - id: TV005
    title: 投资逻辑击穿与放弃触发项
    columns:
      - 触发项
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 确认 2026 年 4 月押记属于困境融资
        - 押记被确认为过桥或救援融资，而非运营循环信贷
        - 发出现金消耗超过融资所得的信号；悲观情景加速
        - 退出持仓；不再追加资本
      - - 2025 年集团账户显示自由现金流为负
        - 2025 财年账户中 FCF <0（2026 年 9 月到期）
        - 即使融资后，现金跑道仍令人担忧；EBITDA 不能转化为现金
        - 下调至回避；任何承诺前要求完整现金桥
      - - 2025 年美国收入同比增速降至 10% 以下
        - Companies House 账户或公司披露显示美国增长放缓
        - 移除主要乐观情景驱动因素；基准情景变成区间震荡
        - 降低持有；承诺前要求 NRR 或软件指标
      - - 优先清算堆叠在基准退出情景中吸收 €1.3B 的 >40%
        - 股权结构表尽调显示 Series E 或更早优先权面值超过 €520M
        - 基准 / 悲观结果中，普通股和近轮股权深度受损
        - 重新定价或放弃；优先权压力会击穿回报测算
      - - 大型在位企业的 AI 推出在 12 个月内追平 Clara 指标
        - Adecco 或 Randstad 宣布 AI 智能体填补率和面试吞吐量可与 Clara 竞争
        - 技术护城河收窄；倍数中的 AI 溢价蒸发
        - 下调倍数；按 0.40× EV/Revenue 重新评估
      - - TEMPHELPS 序列连续三个月环比下滑 >1%
        - 美国 BLS 临时帮助就业人数大幅下降
        - 美国收入驱动因素逆转；乐观情景假设不再成立
        - 下调至回避；等待企稳信号
