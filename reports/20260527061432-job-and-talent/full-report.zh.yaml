      - number: '7.2'
        title: 运营与执行风险
        blocks:
          - type: paragraph
            body: >-
              Job&Talent 的运营风险主要来自 AI 决策被放进高风险安置工作流后的规模化。Clara
              代理如今大规模面试并直接推动录用，但公开披露几乎没有证明其具备正式人工监督协议、审计日志、模型漂移检测或偏见测试节奏。基于历史招聘模式训练的 AI 系统可能延续人口统计偏见；在 GDPR 第 22
              条下，没有有意义人工复核和申诉权的全自动雇佣决策违法。180,000 场面试规模下的模型漂移可能造成系统性安置错误，同时损害工人和客户满意度。AI 可靠性之外，Job&Talent
              的服务成本模型取决于相对传统厂商三到五倍的 FTE 效率；平台可用性、薪资处理准确性或合规自动化一旦退化，优势就会被侵蚀。公司未披露第三方网络安全审计、SOC 2 认证或 GDPR 第 30
              条处理活动记录状态。联席 CEO 治理模式放大执行风险：Juan Urdiales 和 Felipe Navio 出现在每一项重大战略公告中，联席 CEO
              层以下没有公开继任计划或梯队厚度披露。此外，蓝领劳动力供给正在被自动化和回流生产重塑；如果安置算法无法重新训练、行业覆盖无法重配，公司可能会错位于 2026
              年真实劳动力需求所在。未找到平台宕机或重大安置失败的公开证据，但没有公开事件报告本身就是尽调缺口。
