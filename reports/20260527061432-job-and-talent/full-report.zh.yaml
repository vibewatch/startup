      以上倍数套用 2024 年收入 €1.8 billion。以 Series F 标记 €1.3 billion 作为 EV 代理值；债务和现金明确后，实际 EV 会不同。Randstad 倍数来自其披露的 2025 年 EV
      €6.702B 和收入 €23.077B。软件平台倍数仅作示意，并非基于某个具体可比公司。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
  - id: FV003
    title: 分情景估值与回报区间
    type: range
    layout: standard
    summary: 基于 EV/Revenue 和 EV/EBITDA 锚定假设，给出 Job&Talent 相对 2025 年 4 月 €1.3 billion 入场标记的乐观、基准和悲观退出估值区间。
    data:
      items:
        - label: 悲观（战略出售，9–12× EBITDA）
          low: 550
          mid: 645
          high: 740
          unit: €M EV
        - label: 基准（0.6–0.8× EV/Rev）
          low: 1080
          mid: 1260
          high: 1440
          unit: €M EV
        - label: 乐观（2027E 收入上 1.0–1.3× EV/Rev）
          low: 2000
          mid: 2250
          high: 2500
          unit: €M EV
        - label: 当前标记（入场）
          low: 1300
          mid: 1300
          high: 1300
          unit: €M EV
    approximationNotes: >-
      悲观情景假设在 2024 年 EBITDA €61.3M 上按 9–12× EBITDA 定价（不增长）。基准情景假设收入年增 5–8%，到 2027E 达 €1.8–€2.1B。乐观情景假设收入持续增长 20%+，2027E
      收入 €2.0–€2.5B。未建模优先权瀑布；如果高级优先权先于普通股吸收 EV，悲观情景下股权回报可能实质更差。
