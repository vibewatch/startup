        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              三种情景的差异主要在 AI 平台逻辑兑现率和宏观人力服务环境；两者共同决定收入倍数能否守住，还是需要向传统人力服务水平压缩。

              乐观情景：AI 代理证明能带来可量化的 NRR 扩张和毛利率台阶。Clara 及后续代理提高填补率、降低缺勤率、改善客户留存，并且这些改善通过定价权变现，而不只是降本。美国收入增长连续两年或更久维持在 20%
              以上。全球人力服务市场从 2022–2025 年低迷中复苏，这与 WEC Industry Impact 2026 report
              的观察一致：即便北美和欧洲收入下滑，亚太安置仍增长。在该情景下，公司证明类软件毛利率高于 35%，2027 年以 €2.0–€2.5 billion 融资，并按 1.0–1.5× EV/Revenue 倍数为
              IPO 做准备，意味着按当前标记、3–4 年持有期可实现 2–3× 回报。

              基准情景：平台指标改善，但仍受人力服务经济模型约束。AI 降低服务成本，但未实质扩大在行业层面披露的毛利率（贡献利润率保持在 30% 以下）。2025–2028 年收入年增
              5–8%，公司在美国巩固收获，欧洲企稳。公司 2028 年前不寻求 IPO，但可能以接近当前估值标记完成二级交易或 Series G，较 €1.3 billion 入场价上行有限。WEC Economic
              Report 2025 暗示的行业背景——北美和欧洲收入持续承压，但亚太增长——支持谨慎乐观。

              悲观情景：AI 商业逻辑未能带来增量收入。宏观不确定下客户推迟招聘，人力服务需求进一步恶化（FRED 临时帮助就业数据的周期性下降支持这一点），直接寻源竞争加剧。2026 年 4 月 Holding
              实体押记登记演变为限制增长投资的重大债务契约。2021 年优先股堆叠持有人享有清算优先权，在普通股 / 后续轮投资人之前吸收回报价值。在该情景下，公司可能需要以进一步降估值完成防御性 Series G，或以
              0.3–0.4× 收入出售给大型传统人力服务集团，意味着相对 €1.3 billion 发生显著减记。
