      - number: '1.4'
        title: 里程碑、规模信号、AI 推出与开放尽调风险
        blocks:
          - type: paragraph
            body: >-
              近期里程碑显示，公司正试图把运营规模转成类似软件的杠杆。2025 年官方材料把一套已经盈利的 2024 年运营基础——€1.8 billion 收入、€61.3 million 基础 EBITDA、27.3%
              贡献毛利率——与围绕自有劳动力数据构建的更大 AI 叙事连在一起。管理层称，平台训练数据来自 100 多万次工人安置和数百万个已记录班次；现在每名 FTE 可管理 63 名工人，而传统同业为 19 名。Clara
              是最清晰的证据点：截至 2025 年 4 月，公司称该智能体已完成 18 万多次面试并促成 7,000 次录用；到 2025 年 8 月，公司报告面试超过 19 万次、录用超过 22,000 次、招聘速度快
              65%、候选人满意度 90%。客户案例和旺季披露进一步支撑了平台能吸收大规模需求峰值的说法，包括 2025 年旺季在 10 个国家动员 12
              万名工人。即便如此，开放风险仍然很大。公开规模指标方向上强劲，但不同来源并不总是完全对齐；当前员工数仍未清晰披露；债务和优先权条款仍属私密；2025 年降价轮也说明，技术和运营进展并未让 Job&Talent
              免于市场重估。
