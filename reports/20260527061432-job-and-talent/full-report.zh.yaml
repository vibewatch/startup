  - id: TI007
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 重要性
      - 当前公开替代指标
      - 投资判断影响
      - 具体尽调路径
    rows:
      - - 按分部拆分的毛利率
        - 需要拆分劳动力价差与软件 / 服务经济性。
        - 已披露贡献利润率，但没有毛利率桥。
        - 无法判断软件是在结构性抬升毛利，还是只是在掩盖服务组合。
        - 要求提供 2024 年和 LTM 2025 按垂直行业、地域和产品线拆分的经审计毛利率。
      - - EBITDA 利润率与 EBITDA 到现金的转化
        - 已披露绝对 EBITDA，但利润率质量和现金转化未披露。
        - €61.3m 基础 EBITDA 和 €1.8bn 收入只显示盈利方向。
        - 无法完整建模下行情景或契约。
        - 要求提供月度管理口径 P&L 和现金流量表，并列示一次性调整。
      - - 现金余额与现金跑道
        - 这是私营公司资本充足性的核心输入。
        - 新一轮股权融资，以及公司称资本充足。
        - 人员需求疲弱或回款放慢时，无法测试偿付能力。
        - 索取资金报告、最低现金政策和 13 周现金预测。
      - - 债务期限表和契约
        - 需要用来判断再融资和下行情景风险。
        - 已审阅来源未找到公开债务明细。
        - 若存在未披露债务堆叠，股权价值可能被大幅改写。
        - 索取债务协议、契约测算和贷款人合规证明。
      - - DSO 和应收账款账龄
        - 人力派遣业务里，收入变成可用流动性之前，营运资金会先吃掉现金。
        - Randstad 同业基准 DSO 为 56.7 天。
        - 看不到现金回流节奏、坏账或外部营运资金融资需求。
        - 索取应收账款账龄、争议、核销和任何保理安排。
      - - 实际收费费率、工人薪酬价差和抽成率
        - 需要按垂直行业验证定价权和单位利润率。
        - 公开信息只有打包产品承诺和运营结果。
        - 因此难以硬评估收入质量和竞争韧性。
        - 索取客户合同、费率卡，以及按客户 / 岗位队列拆分的贡献利润。
      - - 客户集中度和垂直行业结构
        - 大型用工账户可能埋下收入集中度风险。
        - 公开披露 3,250 家公司，以及物流、仓储、零售和制造业案例。
        - 无法判断对少数大型电商或物流客户的暴露。
        - 索取前 20 大客户收入占比、流失历史和按垂直行业拆分的毛利率。
      - - 纯软件采用率和留存
        - 需要判断平台能否摆脱临时用工周期性。
        - 公司已宣布扩展到永久 / 内部劳动力管理。
        - 没有采用率和留存数据，软件上行空间仍只是叙事，不是财务事实。
        - 索取纯平台 ARR、附加率、留存，以及席位或站点扩张指标。
    notes: 每一行都是实质性承销阻碍或重大精度缺口。本表有意筛选，不应被当作完整资料室需求清单。
