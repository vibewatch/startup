      - number: '1.2'
        title: 创始人、领导层连续性与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人连续性是第一章的重要正面项，但治理透明度仍不完整。Juan Urdiales 和 Felipe Navío 自公司创立以来一直是核心高管，多次访谈显示他们仍围绕劳动力市场摩擦、产品重塑和 AI
              驱动运营杠杆来定义公司的战略选择。Vision Fund 的介绍补充了运营层面的有用细节：Urdiales 起初承担更多外部职责，如融资、财务和销售；Navío 则更偏内部运营和产品演进。2025 年 9
              月，Job&Talent 为 AI 驱动增长阶段重置董事会，公开治理可见度大幅提高。已公布的董事会包括 Bruce Felt、Javier Torremocha、Jim Grube、Natalie
              Tydeman、Guillaume Santamaria 和 Urdiales，观察员包括 Felipe Navío、BlackRock 的 John Doyle、Quadrille 的 Edouard
              Brunet、DN Capital 的 Nenad Marovac。这个董事会构成释放出更机构化、更理解美国市场的治理信号，但公开材料仍未披露委员会章程、持股比例或当前股权结构瀑布。Forbes
              的创始人访谈还给出一个治理层面的提醒：管理层称，过去的董事会结构一度变得笨重，债务管理耗掉了领导层过多时间。这说明如今更清爽的治理图景并非一直存在。
