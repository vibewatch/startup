  - id: FV004
    title: 投资 KPI 仪表盘
    type: kpi
    layout: standard
    summary: 面向 IC 的 Job&Talent 打分，覆盖市场、客户证明、护城河、经济性、风险、估值和证据质量。
    data:
      items:
        - label: 市场规模
          value: 7/10
          note: 全球用工服务市场 >$600B；可触达蓝领细分市场很大，但有周期性
        - label: 市场验证（客户牵引）
          value: 6/10
          note: 300K+ 工人、3,250+ 客户、10 个国家 — 规模真实，但缺 NRR 或队列数据
        - label: 竞争护城河
          value: 5/10
          note: 公司声称 AI 带来服务成本优势；大型在位者也在搭同等 AI 能力
        - label: 单位经济
          value: 5/10
          note: EBITDA 为正且在改善；毛利率和 NRR 不透明；用工服务经济性压住天花板
        - label: 风险水平
          value: 4/10
          note: 降价轮、股权结构表不透明、2026 年 4 月费用、宏观逆风 — 风险高于平均
        - label: 估值公允性
          value: 4/10
          note: 21× EV/EBITDA vs. 上市同业约 9×；0.72× EV/Rev vs. Randstad 0.29× — 偏高
        - label: 证据质量
          value: 5/10
          note: 对私营公司而言披露少见；仍缺 NRR、毛利率、债务、FCF
        - label: 退出路径清晰度
          value: 4/10
          note: 最可能卖给大型用工服务在位者；IPO 需要指标升级
    approximationNotes: 分数是作者基于已披露证据给出的 1–10 分判断。分数越高越好。整体隐含评级：5/10 — 跟踪 / 观察。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV033
      - CV034
      - CV035
