  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Job&Talent 横跨十个欧盟和非欧盟国家运营，2026 年同时压上三道有约束力的监管期限。第一，欧盟平台工作指令（Directive 2024/2831）要求成员国在 2026 年 12 月 2
              日前转化为国内法。当平台存在指挥、薪酬和任务监督指标时，该指令建立可反驳的雇佣推定——这一触发条件直接适用于算法排班分配和 Clara 介入的任务管理。如果成员国从宽解释该推定，Job&Talent 可能必须在
              300,000 名工人范围内承担雇主身份重分类成本，轻资产模式会被抵消。第二，欧盟 AI 法案将用于自动化候选人筛选和绩效评估的 AI 系统列为附录 III
              下的高风险；透明度报告、人工监督、工人通知和系统登记等合规义务自 2026 年 8 月生效。Clara 代理 180,000 场面试的规模让它明确落入范围，不合规罚款最高可达 EUR 35 million
              或全球年营业额的 7%。第三，欧盟薪酬透明度指令必须在 2026 年 6 月前由所有欧盟成员国落地，要求所有职位发布披露薪资区间，并提交薪酬比较报告。欧盟要求之外，英国 2025 年就业权利法自 2026 年 4
              月起生效，带来入职首日病假工资权利和翻倍的保护性赔偿；英国 Fair Work Agency 也获得主动执法权。西班牙 SMI 上调 3.1%，数字化工时记录要求适用。美国各州层面，科罗拉多、伊利诺伊等地的 AI
              招聘法律造成碎片化合规负担。未发现 Job&Talent 过往遭监管执法的证据，但这些期限集中在同一日历年，构成实质性合规冲刺。
