    summary: 从 AWS 基础设施到 AI 智能体产品表层的五层架构视图。
    data:
      layers:
        - label: 云基础设施（AWS）
          detail: AWS 托管，静态数据采用 KMS 加密，传输中采用 TLS，配套 IAM 和 MFA 控制、员工设备 MDM，以及平台层面的 ISO/IEC 27001:2022 认证。
        - label: 劳动力数据平台
          detail: 从 AWS 托管、Terraform 和 Atmos IaC、OpenTelemetry 风格的可观测性信号推断出劳动力数据环境；公开指标提到 300,000+ 次岗位安置，以及 1M+ 条岗位安置历史训练数据。
        - label: 核心平台服务
          detail: 微服务和应用层覆盖 Go、Elixir、TypeScript 和 Java/Android，用于职位匹配、入职、薪资支持、考勤和班次管理。
        - label: 双移动应用
          detail: Worker App 覆盖 iOS 和 Android，版本为 v12.38.0，Android 下载量 5.7M；另有面向雇主的 Business App，用于班次规划和实时劳动力控制。
        - label: AI 智能体层（Clara、Sara、Teo、Maria）
          detail: Clara 已处理 190K+ 场面试和 22K+ 个录用，Sara 针对爽约，Teo 和 Maria 扩展了 2024 年推出的分析和辅导工作流。
    approximationNotes: 数据平台和可观测性子层部分来自公开仓库和安全证据的推断；官方架构图尚未发布。
