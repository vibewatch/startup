  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 当前公开状态
      - 收入质量判断
      - 尽调要求
    rows:
      - - 临时用工安置
        - 市场、分支机构和现场交付模式把雇主需求转成已填补的按小时或按班次一线工作。
        - 明确活跃，仍是核心变现引擎。
        - 业务存在性的置信度高；具体抽成率或垂直行业组合的置信度低。
        - 需要客户发票、工人工资文件，以及按国家和垂直行业拆分的总额到净额桥。
      - - 捆绑式劳动力管理平台
        - 打卡、考勤、评分、排班和洞察作为 Job&Talent Business 的一部分，与劳动力供给一起销售。
        - 明确与服务模式捆绑；没有公开的独立软件定价。
        - 中等；产品范围证据强，但软件纯收入占比未披露。
        - 需要按劳动力中介与软件 / 服务收入拆分的产品 P&L。
      - - AI 招聘与劳动力智能体
        - Clara、Sara、Teo 和 Maria 自动化寻源、考勤、客户管理与绩效工作流。
        - 作为平台价值主张的一部分，已商业化运行。
        - 中等；价值主张公开，但没有单列变现项目。
        - 需要合同文本说明 AI 模块是提高账单费率、收取附加费，还是只降低交付成本。
      - - 长期 / 内部员工管理扩张
        - 2025 年，公司称平台访问将扩展到长期员工和内部劳动力。
        - 扩张已宣布；实际收入仍未披露。
        - 战略方向置信度中等；当前贡献置信度低。
        - 需要客户上线数量、定价模型，以及长期员工用例带来的收入贡献。
      - - 运营数据与合规层
        - 合同、入职任务、班次管理和考勤工作流都在应用和平台里运转。
        - 贯穿工作流，但公开证据未显示单独定价。
        - 中等；可能有黏性，但变现不透明。
        - 需要续约条款、附加销售率，以及合规工具是提升毛利还是只改善留存的证据。
    notes: 这是对公开可见变现面的部分列举。公开证据支持“人力派遣 + 软件”的捆绑模式， 但不支持经审计的收入结构或实际抽成率。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the revenue surfaces that are explicitly visible in current company pages, funding press releases, and
        public coverage as of the 2026-05-27 run date; realized customer pricing and segment mix remain private.
    claimRefs:
