  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 已披露规模、收入模型与盈利能力
        blocks:
          - type: paragraph
            body: >-
              Job&Talent 的财务故事要从一个关键区别讲起：不同于许多私营劳动力平台，它最近披露了集团层面的收入和盈利指标；但完整承销模型需要的详细收入构成和确认机制，它仍未公开。公司称，2024
              年收入在用工市场收缩时仍维持 €1.8 billion，基础 EBITDA 增长 23% 至 €61.3 million，贡献毛利率达到 27.3%，每名 FTE 收入升至
              €804,000。公开业务页面还显示，商业模型是打包式，而非干净的 SaaS 模型：Job&Talent
              把人员供给、入职、打卡、考勤和劳动力管理软件作为现场服务的一部分一起销售。这一点关键，因为披露的贡献毛利率很可能反映的是“劳动力 +
              软件”的混合运营模型，而不是纯代理价差或独立软件订阅。公司还称，平台正从临时劳动力扩展到长期和内部劳动力管理，变现面被拓宽，但实际实现的定价、抽佣率和收入确认拆分仍未披露。
