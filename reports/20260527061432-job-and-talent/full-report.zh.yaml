  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场范围、纳入项与相邻板块
        blocks:
          - type: paragraph
            body: >-
              Job&Talent
              的可服务市场是蓝领临时用工——中介以短期合同雇用工人，再派到客户企业，并收取代理费或工资加价。公司把物流、仓储、制造、零售、电商和酒店餐饮列为核心垂直行业；这些行业都有高容量、按班次、重合规的一线用工需求，传统招聘网站或白领用工机构服务不好。纳入的支出包括代理费、工资加价和劳动力行政管理；排除支出包括白领合同用工、猎头，以及
              Uber、TaskRabbit 等独立零工经济平台，后者的法律和经济结构不同。Job&Talent 正在延伸的相邻市场包括劳动力管理软件——一个独立 SaaS 层，Grand View Research 估算其
              2022 年规模为 $8.07 billion，并预计 2030 年达到 $19.35 billion——以及名义雇主服务，它把薪资合规直接嵌入用工关系。主要现状替代方案有三类：(a) 与
              Adecco、Randstad、ManpowerGroup 等在位巨头的直接代理关系；(b) 内部长期雇佣；(c)
              零工平台劳动力，合规负担更低，但可靠性也更低，也没有一个支撑大规模排班的单一平台。Job&Talent 2024 年在 10 个国家服务超过 3,250
              家公司，业务版图锚定在其目标欧洲和美国蓝领细分市场。这个市场边界有意比总 HR 服务市场窄：它排除了知识工作者用工、RPO、离职安置和更广义 HCM 软件；这些领域的买方、定价模型和竞争集合都不同。
