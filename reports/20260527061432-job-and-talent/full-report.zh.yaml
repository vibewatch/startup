        blocks:
          - type: paragraph
            body: >-
              Job&Talent 公开把其平台定位为云原生劳动力操作系统，安全页面明确显示生产环境运行在 Amazon Web Services 上。该页面还披露了围绕技术栈的主要安全原语：启用 MFA 的 AWS
              Identity and Access Management、静态 Key Management Service 加密、传输中 TLS，以及员工终端的 Mobile Device Management。公开
              GitHub 仓库补充了重要运营细节：基础设施用 Terraform 和 Atmos HCL 作为代码管理，工程技术栈覆盖 TypeScript、Go、Elixir 和 Java/Android
              工具。公开组织中的 OpenTelemetry 仓库显示公司具备现代可观测性姿态，尽管没有披露公开 uptime 正常运行时间 SLA、多区域拓扑或第二云故障切换架构。结果是：生产栈可信，DevOps
              成熟度可见，但 AWS 是唯一披露的基础设施提供商，集中风险清楚存在。
