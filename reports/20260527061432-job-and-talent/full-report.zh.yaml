  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与估值背景
        blocks:
          - type: paragraph
            body: >-
              Job&Talent 在私营公司估值谱系上位置很特殊：规模大到承担类似上市公司的披露义务（英国集团账目通过 Companies House
              申报），定价却仍在私人市场，并且相对上市人力服务同业带着厚厚的科技溢价。2025 年 4 月 €92 million Series F，投后估值 €1.3 billion，由
              Atomico、BlackRock、DN Capital、Hercules、InfraVia、Kibo 和 Kinnevik 支持，是目前最清晰的独立定价。TechCrunch
              明确把该轮称为降估值轮，并指出公司上一次融资是在 2021 年 12 月、估值 $2.35 billion，意味着以美元计约 36% 的峰谷跌幅。公司自己的表述——“估值调整符合更广泛的市场动态”——与 2022
              年以来压缩大多数成长阶段估值的行业性重定价一致。

              正面逻辑建立在四条腿上：(1) 收入韧性高于市场——Job&Talent 2024 年收入维持 €1.8 billion，而全球人力服务市场下滑 9.5%；(2) 单位经济改善——基础 EBITDA 增长 23%
              至 €61.3 million，贡献利润率扩大 6.2 个百分点至 27.3%，每 FTE 收入提升 21% 至 €804,000；(3) 平台差异化——公司称，嵌入 Clara、Sara、Teo 和 Maria
              等 AI 代理后，服务成本优势达到 3.3×（每名内部 FTE 服务 63 名工人，而传统厂商为 19 名）；(4) 美国增长可选性——2024 年 Q4 美国收入同比增长 +27%，领先市场 15.1
              个百分点，美国已成为最大且增长最快的地区。

              反向逻辑来自三项结构性担忧：(1) 公司相对上市人力服务可比公司有实质溢价，但盈利形态仍主要像人力服务运营商——已披露指标停留在 EBITDA 层面，不是软件式毛利率或
              NRR，因此内嵌溢价缺乏充分公开依据；(2) 2025 年 4 月降估值轮本身说明包括头部机构在内的现有投资人不愿捍卫 2021 年估值，带来治理和清算优先权不确定性；(3)
              宏观人力服务环境仍不利——Randstad 2025 年收入从 €24.1 billion 降至 €23.1 billion，HR Brew 报道 Robert Half、Kelly 和 Randstad 的
              2025 年 Q3 结果疲弱，客户和候选人都更趋谨慎。
