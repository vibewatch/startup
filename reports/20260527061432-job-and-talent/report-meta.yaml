companyProfile:
  summary: >
    Job&Talent is a Madrid-based workforce management platform founded in 2009 by Juan Urdiales and Felipe Navío.
    The company pivoted from an online job board into a digital staffing and workforce-operations platform focused on
    frontline and blue-collar work. Public evidence supports meaningful scale — 10 countries, more than 300,000 workers
    placed and 3,250+ client companies in 2024, plus a visible AI rollout led by Clara and follow-on agents — but the
    business still discloses much less than a public-company investor would ideally want on gross margin, NRR, cash,
    debt, cap-table preferences, and current headcount.
  foundedDate: "2009-01-01"
  founders:
    - name: "Juan Urdiales"
      role: "Co-Founder & Co-CEO"
    - name: "Felipe Navío"
      role: "Co-Founder & Co-CEO"
  foundingLocation: "Madrid, Spain"
  headquarters: "Madrid, Spain"
  productSummary: >
    Workforce management platform spanning worker sourcing, recruitment, onboarding, scheduling, attendance,
    payroll, compliance, and AI agents such as Clara, Sara, Teo, and Maria for frontline labour operations.
  customerFocus: >
    Large employers and enterprise operating teams in logistics, warehousing, retail, manufacturing,
    hospitality, and e-commerce that need high-volume temporary and frontline workforce management.
  businessModel: >
    Revenue primarily from temporary staffing and workforce-management services, with increasing emphasis on
    AI-enabled workflow automation and broader platform usage across temporary and permanent frontline workers.
  stage: "growth"
  fundingStatus: >
