              commitments. Those controls are meaningful for enterprise procurement and do reduce obvious security
              objections. Even so, public evidence remains incomplete in three important ways: no third-party
              algorithmic bias audit is published for Clara, no formal uptime or disaster-recovery commitments are
              disclosed, and no public incident register or regulator-issued clearance package is available. That means
