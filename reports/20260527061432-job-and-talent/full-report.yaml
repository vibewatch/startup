      - number: '2.4'
        title: Structural Growth Drivers and Demand Tailwinds
        blocks:
          - type: paragraph
            body: >-
              Several structural factors sustain long-term demand for blue-collar temporary staffing intermediaries.
              First, the manufacturing labour shortage: Deloitte and the Manufacturing Institute project that U.S.
              manufacturers could need up to 3.8 million new workers by 2033, with roughly 1.9 million roles at risk of
              going unfilled without intervention; 20% of US manufacturing plants failed to produce at full capacity in
              2025 due to skills gaps. This structural deficit creates durable demand for flexible staffing solutions
              that can rapidly source qualified frontline workers. Second, flexible labour preference is accelerating:
              contract and temporary job postings on LinkedIn rose 7% year-over-year in 2025 even as overall postings
              declined, signalling that clients are preferring variable labour over permanent commitment during the
              current period of macro uncertainty. Third, AI adoption is reshaping the competitive landscape. OECD data
              cited by WEC shows that 20.2% of firms were using AI in their operations in 2025 — more than double the
              2023 rate — and staffing agency workers added AI literacy skills at 46% more than the broader LinkedIn
              population over the same period. Platform operators able to embed AI at the recruiting, scheduling, and
              compliance layers gain structural cost advantages. Fourth, demographics underpin long-term agency demand:
              the WEC notes that agencies are inclusion engines for women (40% of agency workers), students (12%), and
              workers over 45 (23%) — populations for which flexible work pathways remain essential even in tighter
              labour markets.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM032
              - CM042
          - type: figure
            figureRef: FM004
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM044
      - number: '2.5'
        title: Adoption Constraints, Cyclical Headwinds, and Regulatory Friction
        blocks:
          - type: paragraph
            body: >-
              The most visible constraint is the three-year cyclical downturn that gripped global temporary staffing
              from roughly 2022 to 2025. Staffing Industry Analysts characterised it as a "rolling recession" — a
              prolonged contraction that unfolded without triggering broader GDP alarms — driven by the post-COVID
              hiring bubble normalising, rising interest rates, and structural shifts toward direct sourcing and AI. US
              temporary employment was largely flat in 2025 after a sustained decline, and Q3 2025 results from Robert
              Half (revenue down 8% YoY), Kelly Services (down 9.9%), and Randstad (whose CFO cited extremely low hiring
              confidence) all confirm that the macro environment has compressed volumes and pricing. The Adecco Group's
              YoY growth in the same period was the outlier, driven partly by skilling and coaching services rather than
              traditional temporary placements. Structural constraints include switching costs: established providers
              have accumulated deep worker pools, audit trails, and compliance histories that make enterprise clients
              reluctant to migrate even when a platform offers better technology. Regulatory friction is another
              constraint — rising compliance costs from stricter data governance and AI-Act obligations represent a
              growing burden for agencies deploying algorithmic matching. Global macro uncertainty (tariff volatility,
              rate policy uncertainty, and geopolitical stress) pushes clients toward caution on new vendor commitments.
              "Job&Talent" outperformed the -9.5% global market decline in 2024 by maintaining revenues at €1.8 billion,
              demonstrating relative resilience, but the structural headwinds facing all staffing operators are real and
              are not fully resolved as of mid-2026.
            claimRefs:
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM033
              - CM034
          - type: table
            tableRef: TM004
