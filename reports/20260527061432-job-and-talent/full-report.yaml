        - Audited gross margin by segment (staffing vs. software/service)
        - Determines whether AI generates margin expansion or only cost reduction
        - Request data room; 2024 UK group accounts (46 pages, May 2025 filing) may contain
      - - Net Revenue Retention (NRR)
        - Cohort NRR for employer accounts for 2023–2025
        - NRR >110% supports premium multiple; below 100% = structural churn risk
        - Management presentation; no public proxy available
      - - Liquidation preference waterfall
        - Series E and F preference multiples, participation rights, and anti-dilution provisions
        - Determines effective return to new investors in base or bear exit scenario
        - Data room cap table; preferred stock certificate of incorporation
      - - April 2026 debt charge details
        - Counterparty, principal, interest rate, maturity, covenants (MR01 filing 100849170018)
        - Unquantified senior obligation introduced six months post-raise
        - Companies House charge document (18 pages); management confirmation
      - - Cash and runway
        - Current cash balance, monthly cash consumption or generation, and runway post-Series F
        - Essential underwriting input for timing and amount of next capital raise
        - Data room; not disclosed in any public source reviewed
      - - U.S. revenue and margin detail
        - U.S. revenue, contribution margin, and unit economics for 2024 and Q1 2025
        - U.S. is the largest growth driver; without segment margin, bull case is unverifiable
        - Management disclosure; 2024 accounts may include geographic segment data
      - - Customer concentration and NPS
        - Top-10 client revenue share and Net Promoter Score
        - Concentration risk affects NRR, churn exposure, and revenue quality
        - Data room; may be partially disclosed in group accounts
      - - AI agent commercial performance
        - Clara and follow-on agents' contribution to revenue vs. cost-saving only
        - Determines whether AI generates pricing power (bull) or only efficiency (base)
        - Product briefing; ask for rate-card disclosure and incremental revenue attribution
    notes: >-
      Diligence items are ranked informally by materiality to the recommendation. Items 1–4 (gross margin, NRR,
      preference waterfall, debt charge) are blocking for a buy or strong-buy call. Items 5–8 (cash, U.S. detail,
