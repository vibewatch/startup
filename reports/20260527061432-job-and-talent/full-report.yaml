  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Job&Talent's operations across ten EU and non-EU countries place it at the nexus of three simultaneous and
              binding regulatory deadlines in 2026. First, EU Directive 2024/2831 on platform work requires member-state
              transposition by 2 December 2026. It creates a rebuttable presumption of employment when indicators of
              direction, remuneration, and task supervision by the platform are present — a trigger directly applicable
              to algorithmic shift allocation and Clara-mediated task management. If member states interpret the
              presumption broadly, Job&Talent could face mandatory employer-of-record reclassification costs across its
              300,000 workers, negating its asset-light model. Second, the EU AI Act designates AI systems used for
              automated candidate screening and performance evaluation as high-risk under Annex III; compliance
              obligations including transparency reports, human oversight, worker notification, and system registration
              take effect August 2026. The Clara agent's 180,000-interview scale puts it squarely in scope, and
              non-compliance fines can reach EUR 35 million or 7 percent of global annual turnover. Third, the EU Pay
              Transparency Directive must be implemented by June 2026 in all EU member states, requiring salary-range
              disclosure in all postings and comparative pay reporting. Beyond EU mandates, the UK Employment Rights Act
              2025 commenced from April 2026 with day-one sick pay rights and doubled protective awards, while the UK
              Fair Work Agency acquired proactive enforcement powers. In Spain, the SMI was raised 3.1 percent and
              digital working-time record requirements apply. Across the U.S., state-level AI hiring laws in Colorado,
              Illinois, and others create a fragmented compliance burden. No evidence of prior regulatory enforcement
              against Job&Talent was identified, but the convergence of these deadlines in a single calendar year
              represents a material compliance sprint.
