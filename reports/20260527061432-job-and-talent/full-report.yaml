  - id: FV004
    title: Investment KPI Dashboard
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring of Job&Talent across market, proof, moat, economics, risk, valuation, and evidence quality
      dimensions.
    data:
      items:
        - label: Market size
          value: 7/10
          note: Global staffing market >$600B; addressable blue-collar segment large but cyclical
        - label: Market proof (customer traction)
          value: 6/10
          note: 300K+ workers, 3,250+ clients, 10 countries — real scale, but no NRR or cohort data
        - label: Competitive moat
          value: 5/10
          note: AI cost-to-serve advantage claimed; large incumbents building equivalent AI capabilities
        - label: Unit economics
          value: 5/10
          note: EBITDA-positive and improving; gross margin and NRR opaque; staffing economics constrain ceiling
        - label: Risk level
          value: 4/10
          note: Down round, opaque cap table, April 2026 charge, macro headwinds — above-average risk
        - label: Valuation fairness
          value: 4/10
          note: 21× EV/EBITDA vs. ~9× listed peers; 0.72× EV/Rev vs. 0.29× at Randstad — stretched
        - label: Evidence quality
          value: 5/10
          note: Unusual disclosure for a private firm; still missing NRR, gross margin, debt, FCF
        - label: Exit pathway clarity
          value: 4/10
          note: Trade sale to large staffing incumbent most likely; IPO requires metric upgrade
    approximationNotes: >-
      Scores are author judgments on a 1–10 scale anchored by disclosed evidence. Higher scores are better. Overall
      implied rating: 5/10 — Monitor/Track.
