      - number: '7.2'
        title: Operational and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Job&Talent's operational risk profile is dominated by the scaling of AI decision-making into high-stakes
              placement workflows. The Clara agent now conducts interviews at scale and directly drives hires, yet
              public disclosures provide limited evidence of formal human-oversight protocols, audit logs, model-drift
              detection, or bias-testing cadences. AI systems trained on historical hiring patterns can perpetuate
              demographic biases and, under GDPR Article 22, fully automated employment decisions are unlawful without
              meaningful human review and challenge rights. Model drift at the 180,000-interview scale could produce
              systematic placement errors that damage both worker and client satisfaction. Beyond AI reliability,
              Job&Talent's cost-to-serve model depends on a three-to-five-times FTE efficiency ratio versus incumbents;
              any degradation in platform uptime, payroll-processing accuracy, or compliance automation would erode this
              advantage. The company has not disclosed a third-party cybersecurity audit, SOC 2 certification, or GDPR
              Article 30 records-of-processing status. Execution risks are amplified by the co-CEO governance model:
              Juan Urdiales and Felipe Navio are referenced in every major strategic announcement, and there is no
              public succession plan or bench-strength disclosure below the co-CEO layer. Additionally, blue-collar
              labor supply dynamics are being reshaped by automation and reshoring; any failure to retrain placement
              algorithms and retool sector coverage risks misalignment with where 2026 labor demand actually sits. No
              public evidence was found of platform outages or material placement failures, but the absence of public
              incident reporting is itself a diligence gap.
