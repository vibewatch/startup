  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Shift, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Job&Talent’s core identity is clearer today than it was at founding: the business started in Madrid in
              2009 as a youth-oriented job website, but public founder interviews and the company’s own timeline show
              that management later killed the classifieds-style product and rebuilt the company around blue-collar
              temporary work. That 2016 pivot matters because the present product is not just candidate discovery.
              Job&Talent now describes itself as an AI-powered workforce platform for essential industries, combining
              worker sourcing, onboarding, payroll, timesheets, shift management, and compliance. The public footprint
              is meaningful and current. Official 2025 disclosures say the company now operates in 10 countries across
              Europe, the U.S., and Latin America, placed more than 300,000 workers in 2024, and served more than 3,250
              companies in sectors such as logistics, warehousing, retail, manufacturing, and e-commerce. The U.S. has
              become strategically central to the story, both as the fastest-growing market and as the geography shaping
              later governance and product investments. That gives later chapters a clean anchor: Job&Talent should be
              analyzed as a scaled, software-enabled staffing operator with real labor-market exposure, not as a pure
              recruiting SaaS vendor or a legacy temp agency with a thin digital layer.
