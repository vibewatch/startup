  - id: TI007
    title: Public financial gaps table
    columns:
      - Missing metric
      - Why it matters
      - Current public substitute
      - Underwriting impact
      - Exact diligence path
    rows:
      - - Gross margin by segment
        - Needed to separate labor spread from software/service economics.
        - Contribution margin is disclosed, but gross-margin bridge is not.
        - Cannot tell whether software is structurally lifting gross profit or only masking service mix.
        - Request audited gross margin by vertical, geography, and product line for 2024 and LTM 2025.
      - - EBITDA margin and EBITDA-to-cash conversion
        - Absolute EBITDA is disclosed, but margin quality and cash conversion are not.
        - Underlying EBITDA of €61.3m and revenue of €1.8bn show profitability direction only.
        - Prevents full downside or covenant modeling.
        - Request monthly management P&L and cash-flow statement with one-off adjustments.
      - - Cash balance and runway
        - Core capital-adequacy input for a private company.
        - Fresh equity round and company statements that it is well capitalized.
        - Cannot test solvency under weak staffing demand or slower collections.
        - Request treasury report, minimum cash policy, and 13-week cash forecast.
      - - Debt schedule and covenants
        - Needed to understand refinancing and downside risk.
        - No public debt detail found in reviewed sources.
        - A hidden debt stack could change equity value materially.
        - Request debt agreements, covenant calculations, and lender compliance certificates.
      - - DSO and receivables aging
        - Staffing working capital can absorb cash before revenue becomes usable liquidity.
        - Randstad peer benchmark of 56.7 DSO days.
        - No view on cash timing, bad debt, or need for external working-capital finance.
        - Request AR aging, disputes, write-offs, and any factoring facilities.
      - - Realized bill rates, worker pay spread, and take rate
        - Needed to test pricing power and unit margins by vertical.
        - Only bundled product promises and operating outcomes are public.
        - Prevents hard assessment of revenue quality and competitive durability.
        - Request customer contracts, rate cards, and cohort contribution by client/role.
      - - Customer concentration and vertical mix
        - Large staffing accounts can create hidden revenue concentration risk.
        - Public count of 3,250 companies and examples in logistics, warehousing, retail, and manufacturing.
        - Cannot assess exposure to a few large e-commerce or logistics customers.
        - Request top-20 customer revenue share, churn history, and gross margin by vertical.
      - - Software-only adoption and retention
        - Needed to know whether the platform can decouple from temp-staffing cyclicality.
        - Expansion to permanent/internal workforce management has been announced.
        - Without adoption and retention data, software upside remains narrative rather than financial fact.
        - Request platform-only ARR, attach rate, retention, and seat or site expansion metrics.
    notes: >-
      Each row is a real underwriting blocker or major precision gap. The table is intentionally selective and should
      not be mistaken for a complete data-room request list.
