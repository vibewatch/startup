  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Job&Talent occupies an unusual position on the private-company valuation spectrum: it is large enough to
              carry public-company-style disclosure obligations (UK group accounts are filed via Companies House) yet
              privately priced with a thick tech premium relative to listed staffing peers. The April 2025 €92 million
              Series F at a €1.3 billion post-money valuation, backed by Atomico, BlackRock, DN Capital, Hercules,
              InfraVia, Kibo, and Kinnevik, provides the clearest independent mark available. TechCrunch explicitly
              characterised the round as a down round, noting the company last raised at $2.35 billion in December 2021,
              implying a roughly 36% peak-to-trough decline in USD terms. The company's own framing — "a valuation
              adjustment in line with broader market dynamics" — is consistent with the sector-wide repricing that
              compressed most growth-stage valuations from 2022 onward.

              The thesis for a positive view rests on four legs: (1) above-market revenue resilience — Job&Talent
              maintained €1.8 billion in 2024 revenues while the global staffing market fell 9.5%; (2) improving unit
              economics — underlying EBITDA rose 23% to €61.3 million, contribution margin expanded 6.2 pp to 27.3%, and
              revenue per FTE climbed 21% to €804,000; (3) platform differentiation — the company claims a 3.3×
              cost-to-serve advantage (63 workers per internal FTE vs. 19 at incumbents) enabled by embedded AI agents
              including Clara, Sara, Teo, and Maria; and (4) U.S. growth optionality — Q4 2024 U.S. revenues grew +27%
              YoY, 15.1 pp ahead of the market, and the U.S. has become the largest and fastest-growing geography.

              The anti-thesis rests on three structural concerns: (1) the company is priced at a meaningful premium to
              listed staffing comps but still earns predominantly like a staffing operator — the disclosed metrics are
              EBITDA-level, not software-style gross margin or NRR, so the embedded premium has limited public
              justification; (2) the April 2025 down round itself signals that existing investors (who include marquee
              names) were not willing to defend the 2021 mark, introducing governance and liquidation preference
              uncertainty; and (3) the macro staffing environment remains adverse — Randstad saw 2025 revenues fall from
              €24.1 billion to €23.1 billion, and HR Brew reported rough Q3 2025 results across Robert Half, Kelly, and
              Randstad, with clients and candidates both favouring caution.
