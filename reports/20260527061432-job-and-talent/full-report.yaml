      - number: '1.4'
        title: Milestones, Scale Signals, AI Rollout, and Open Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Recent milestones show a company trying to convert operational scale into software-like leverage. Official
              2025 materials connect a profitable 2024 operating base—€1.8 billion of revenue, €61.3 million of
              underlying EBITDA, and 27.3% contribution margin—to a broader AI story built around proprietary labor
              data. Management says the platform is trained on more than one million worker placements and millions of
              logged shifts, and that it can now manage 63 workers per FTE versus 19 at incumbents. Clara is the
              clearest proof point: by April 2025 the company said the agent had already conducted more than 180,000
              interviews and contributed to 7,000 hires, and by August 2025 it reported 190,000-plus interviews,
              22,000-plus hires, 65% faster recruiting, and 90% candidate satisfaction. Customer case studies and
              peak-season disclosures reinforce the claim that the platform can absorb large demand spikes, including
              120,000 workers mobilized across 10 countries in peak season 2025. Even so, the open risks are
              significant. Public scale metrics are directionally strong but not always perfectly aligned across
              sources, current headcount is still not cleanly disclosed, debt and preference terms remain private, and
              the 2025 down round shows that technology and operating progress have not insulated Job&Talent from market
              repricing.
