      - number: '3.4'
        title: Moats, vulnerabilities, and the most likely substitution routes
        blocks:
          - type: paragraph
            body: >-
              Job&Talent’s moat is strongest where a client wants worker supply, attendance control, performance
              feedback, and operating insights in one loop. In that scenario, software-only vendors do not remove the
              labor problem and incumbents can look slower or less productized. The weakness is that many buyers do not
              need the full bundle all the time. If labor supply is already secured, Deputy or Shiftboard can attack the
              workflow layer at a visibly lower software budget. If the company is solving international compliance,
              WorkMotion can intercept the spend. If procurement wants to rationalize suppliers across permanent,
              contingent, and services labor, Randstad or another incumbent can route the need into a total-talent
              construct. The competitive end-state is therefore coexistence and bundling more than winner-take-all
              displacement, but that still leaves real underwriting gaps around multi-homing, attach rates, and realized
              pricing. Job&Talent’s AI language also helps less if every rival can now tell some version of the same
              automation story.
