      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM Estimation'
        blocks:
          - type: paragraph
            body: >-
              Sizing the global temporary staffing market requires triangulating across several imperfect public
              sources, each using different scope definitions. The World Employment Confederation's 2026 Industry Impact
              Report, drawing on data from national federations in more than 40 countries and Staffing Industry
              Analysts, documents that private employment agencies placed 61 million people in jobs globally in 2024 —
              nearly one million more than in 2023 — even as industry revenues fell 4.2% globally. When cross-referenced
              with Randstad's €23.1 billion full-year 2025 revenues across 39 markets (the sector's largest operator by
              revenue), the top three global groups (Randstad, Adecco, ManpowerGroup) imply combined revenues exceeding
              €60 billion, suggesting an all-in global temporary-and-permanent staffing market well above $500 billion
              and most commonly estimated in the $590–640 billion range for 2024. The workforce management software
              sub-market, while growing faster (CAGR of 11.7% to 2030), is a much smaller layer at roughly $8–13 billion
              today. "Job&Talent's" €1.8 billion 2024 revenue represents approximately 0.3% of the estimated global
              market, confirming extreme fragmentation. The company's serviceable addressable market — the 10 countries
              it operates in, focused on blue-collar temp — is estimated at $120–160 billion based on share of global
              market attributable to those geographies and labour types, though no clean third-party source confirms
              this disaggregation directly. The WFM software layer adds a $9–13 billion SAM premium that "Job&Talent" is
              now pursuing through platform-fee models. US temporary help services employment of approximately 2.41
              million workers as of early 2026 confirms that demand has contracted meaningfully from 2022 peaks, with
              the BLS data showing the sector remains below its pre-decline highs.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
              - CM011
              - CM012
