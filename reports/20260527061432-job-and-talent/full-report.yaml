      - number: '4.4'
        title: Underwriting verdict and public-data gaps
        blocks:
          - type: paragraph
            body: >-
              The public evidence is strong enough to support a directional financial verdict. Job&Talent is not just a
              concept-stage HR marketplace; it disclosed €1.8 billion of 2024 revenue, positive underlying EBITDA,
              rising contribution margin, and operational metrics that imply real scale in client delivery. It also
              appears to be evolving from a pure temporary-labor intermediary into a bundled workforce-management
              platform with embedded AI and expanding coverage of permanent workers. That said, the underwriting case
              remains incomplete because the most decision-critical figures are missing. Public sources reviewed here do
              not disclose realized employer bill rates, worker pay spread, gross margin by segment, net revenue
              retention, cash balance, debt terms, DSO, receivables aging, or runway. The capital raise in 2025 reduces
              immediate solvency concern, but the lower valuation says outside investors were not willing to preserve
              the 2021 pricing benchmark. The right conclusion is therefore balanced: profitability trajectory looks
              credible, the platform may be improving service economics, and capital dependence appears lower than
              during the 2021–2022 expansion phase, but precise downside protection still cannot be underwritten from
              public evidence alone.
