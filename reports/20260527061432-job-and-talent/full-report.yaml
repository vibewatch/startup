      - number: '4.2'
        title: Unit economics proxies and staffing benchmarks
        blocks:
          - type: paragraph
            body: >-
              Public evidence on Job&Talent’s unit economics is still proxy-heavy, but it is stronger than the
              disclosure available for many private staffing businesses. On its business site, the company advertises a
              98% fill rate versus a 75% industry norm, 2% absenteeism versus 8%, and operational workflows designed to
              reduce no-shows, improve clocking accuracy, and raise worker quality. Separate product releases add more
              directional metrics: Clara reportedly delivered more than 190,000 interviews and 22,000 hires at 65%
              faster speed than manual recruiting, while the AI attendance coach reportedly reduced absenteeism by 30%
              and pushed attendance to 90% in observed deployments. These are company claims rather than audited
              unit-economics tables, so they should be read as directional operating-leverage signals. The sector
              benchmarks matter here. Staffing Industry Analysts says talent-platform pricing is diversifying across
              buyer fees, worker charges, and subscriptions, while Randstad’s annual report still shows how low-margin
              and working-capital-sensitive scaled staffing remains: 18.7% gross margin, 3.1% underlying EBITA margin,
              and 56.7 days of DSO in 2025. Taken together, the evidence suggests Job&Talent’s AI layer may improve
              cost-to-serve, but it does not eliminate the fundamentally labor-linked economics of staffing.
