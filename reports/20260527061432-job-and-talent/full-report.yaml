      - number: '8.4'
        title: Recommendation, Exit Readiness, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The consolidated verdict is Track. The core reason is price: at ~21× EV/EBITDA and ~0.72× EV/Revenue,
              Job&Talent is priced for an AI-platform future that has not yet been proven in the metrics that matter
              most for underwriting — gross margin at P&L level, NRR, software ARR, or a clear debt stack. The
              down-round structure introduces additional friction: BlackRock and InfraVia participated in the April 2025
              round, suggesting the cap table includes sophisticated institutional investors with preferences and
              governance rights that new investors must diligence carefully before entry. The April 2026 charge
              registration adds an unquantified senior obligation.

              A buy case becomes supportable if: (a) 2025 group accounts (due by 30 September 2026 per Companies House)
              confirm gross margin above 30% and positive free cash flow; (b) NRR and software take-rate metrics are
              disclosed or estimated above 110%; (c) the preference and debt stack is diligenced and does not absorb
              more than 30–35% of upside in base-case exit scenarios; and (d) the April 2026 charge is confirmed as an
              operational credit facility rather than a bridge-to-distress instrument.

              Exit readiness is constrained. The staffing sector's public market appetite has been weak: Randstad's
              market cap fell 23% from €7.4 billion (2024) to €5.7 billion (2025), ManpowerGroup stock reached a 2025
              low of $26.63, and the global staffing revenue contraction (SIA: -3% to $257 billion in 2024) reduces the
              IPO comp set attractiveness. A trade sale to one of the top-five global staffing firms (Randstad, Adecco,
              ManpowerGroup, Allegis, Recruit) is a credible exit path if AI differentiation is demonstrated, but trade
              buyers would likely price on EBITDA multiples (9–12×), implying an exit valuation of €550–€740 million at
              current EBITDA — well below the current entry mark. Strategic premium is possible but unmodeled without
              comparable transaction data.

              The ASA/LinkedIn 2026 survey showing contract postings rising 7% YoY and staffing workers adding AI skills
              46% faster than the broader LinkedIn population is a directionally positive signal for Job&Talent's
              addressable market, but it does not validate the specific monetisation thesis at the current valuation.
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
              - CV046
              - CV047
              - CV048
      - number: '8.5'
        title: Outstanding Diligence and Monitoring Signals
        blocks:
          - type: paragraph
            body: >-
              The primary information gaps preventing a higher-conviction call are financial and structural. Public
              sources reviewed during this run do not disclose: consolidated cash or net cash position; monthly or
              quarterly burn/generation rate; full cap-table preference waterfall and liquidation preference multiples;
              gross margin by business segment (staffing revenue vs. software/service fees); NRR or cohort retention
              statistics; outstanding debt principal, interest rate, and maturity schedule; details of the April 2026
              charge registered at Job and Talent Holding Limited. The Jobandtalent UK Limited 2024 group accounts (AA
              filing, May 2025, 46 pages) may partially address cash and balance-sheet questions but have not been
              reviewed here.

              Key macro monitoring signals: The FRED temporary help services series (TEMPHELPS) is a leading indicator
              for U.S. staffing demand; sustained monthly declines would compress the base-case revenue assumption. The
              WEC Industry Impact Report 2026 reported North American placements declined by roughly one million in
              2024, which is an adverse headwind for Job&Talent's largest growth market. The Staffing Industry Analysts
              rolling-recession thesis (three-year consecutive temporary-employment contraction) identifies
              stabilisation as the most recent signal, but a renewed contraction leg would impair bull-case assumptions.

              AI-competitor monitoring: The SIA Staffing Company Tech Stack 2026 Update documents a converging,
              AI-enabled operating architecture across front office, middle office, and back office. If large incumbents
              (Randstad, Adecco, ManpowerGroup) successfully deploy comparable AI capabilities at their much larger
              revenue bases, Job&Talent's technology moat may narrow before the AI revenue premium is captured in the
              multiple. The Adecco Group annual report for 2025 notes that agentic AI is targeted to cover more than 50%
              of Adecco GBU revenues by end of 2026 — a direct competitive signal. Staffing market headwinds captured by
              HR Brew's Q3 2025 coverage (Robert Half -8% YoY, Kelly -10%, Randstad -1.2%) show the operating
              environment remains challenged even for established players with lower debt burdens.
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
              - CV046
              - CV047
              - CV048
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation — Track
            body: >-
              Do not commit capital at the current €1.3 billion mark without completing financial diligence on gross
              margin, NRR, preference waterfall, and the April 2026 debt charge. The AI thesis is credible but not yet
              commercially validated at a scale that justifies the ~2.5× premium over listed staffing peers. Re-evaluate
              when 2025 audited group accounts are filed (due September 2026) and when the nature of the April 2026
              charge is confirmed.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV033
              - CV034
              - CV043
              - CV044
          - type: callout
            title: Down-Round Signal and Preference Overhang
            body: >-
              The 2025 Series F was explicitly a down round from $2.35 billion (2021) to $1.5 billion, a ~36%
              peak-to-trough decline. The April 2026 charge registration on the Holding entity introduces a new
              unquantified senior obligation. Together, these create a structural information gap on the effective
              return available to new investors before the preference and debt stack is diligenced.
            calloutType: risk
            claimRefs:
              - CV001
              - CV006
              - CV022
              - CV036
              - CV043
          - type: callout
            title: Public Comps Calibrate the Premium
            body: >-
              Randstad's disclosed 2025 EV of €6.702 billion on €23.077 billion in revenue (0.29× EV/Revenue) and 3.1%
              EBITA margin establishes the floor multiple for a pure-play staffing business. Job&Talent's implied 0.72×
              EV/Revenue asks investors to price AI optionality at roughly 2.5× the listed-staffing baseline — a premium
              that can only be justified by evidence of software-layer gross margin expansion or platform NRR above
              110%.
            calloutType: insight
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
