      - number: '3.3'
        title: Digital challengers and point solutions attack narrower but real jobs-to-be-done
        blocks:
          - type: paragraph
            body: >-
              Instawork and Zenjob are the closest product-shape peers because both market digitally mediated hourly
              labor with stronger automation and faster booking than legacy agencies. Instawork leans into reliability
              metrics, transparent hourly pricing signals, and AI expansion into permanent hiring. Zenjob is narrower
              geographically and demographically, but its direct-employment model and mix of ad-hoc and longer-duration
              student staffing still overlap with Job&Talent’s value proposition more than a pure software tool does.
              WorkMotion, Shiftboard, and Deputy compete differently: they are meaningful because they can unbundle
              parts of Job&Talent’s promise. WorkMotion can win when the buyer’s real problem is compliant cross-border
              hiring, not local shift fill. Shiftboard can win when the buyer needs contingent labor visibility and
              compliance around an existing labor pool. Deputy can win when a low-friction seat-based scheduling
              purchase is enough. Those adjacencies matter because buyers rarely buy “competition” by category label;
              they buy the cheapest acceptable path to the workflow outcome they need.
