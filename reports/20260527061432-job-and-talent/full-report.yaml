  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Scope, Inclusions, and Adjacent Segments
        blocks:
          - type: paragraph
            body: >-
              "Job&Talent's" addressable market is blue-collar temporary staffing — the service in which an intermediary
              employs workers on short-term contracts and deploys them to client businesses in exchange for an agency
              fee or payroll markup. The company identifies logistics, warehousing, manufacturing, retail, e-commerce,
              and hospitality as its core verticals, all of which share high-volume, shift-based, compliance-heavy
              labour needs that are poorly served by traditional job boards or white-collar staffing agencies. The
              included spend covers agency fees, payroll markup, and workforce administration; excluded spend includes
              white-collar contract staffing, executive search, and independent gig-economy platforms (Uber, TaskRabbit)
              that operate under different legal and economic structures. Adjacent markets that "Job&Talent" is actively
              extending into include workforce management software — a distinct SaaS layer that Grand View Research
              values at $8.07 billion in 2022 and projects to reach $19.35 billion by 2030 — and employer-of-record
              services, which embed payroll compliance directly into the staffing relationship. The principal status-quo
              substitutes are: (a) direct agency relationships with incumbents such as Adecco, Randstad, and
              ManpowerGroup; (b) in-house permanent hiring; and (c) gig marketplace labour, which offers lower
              compliance but also lower reliability and no single platform for large-scale shift scheduling.
              "Job&Talent" served more than 3,250 companies across 10 countries in 2024, giving it a footprint anchored
              across the European and US blue-collar segments it targets. The market boundary is deliberately narrow
              relative to the total HR-services market: it excludes knowledge-worker staffing, RPO, outplacement, and
              broader HCM software, each of which has a distinct buyer, pricing model, and competitive set.
            claimRefs:
              - CM004
