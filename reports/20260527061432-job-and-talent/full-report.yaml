        title: Trust, Compliance, and Data Governance
        blocks:
          - type: paragraph
            body: >-
              Public trust materials are materially stronger than is typical for a private staffing-tech platform.
              'Job&Talent' publishes ISO/IEC 27001:2022 certification for the core platform on its security page, and
              Clara states that it holds a separate ISO 27001 certification covering candidate and client data processed
              through the AI recruiter. Clara also self-declares alignment with SOC 2 principles and the EU AI Act's
