  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix, buyers, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Job&Talent's public customer evidence points to a buyer profile that is operational rather than purely
              HR-led. The product is sold to employers that need flexible frontline labor and tighter control of
