            body: >-
              Job&Talent's financial risk profile centers on three interconnected exposures. First, the April 2025
              Series F down round at EUR 1.3 billion — nearly $1 billion below the 2021 Series E peak — signals that
              secondary-market price discovery has moved against the company and that future funding rounds at favorable
              terms will require continued profitable growth. The company attributed the markdown to broader market
              dynamics, but the valuation compression constrains management's strategic optionality and creates
              potential governance tensions with preference-holding early investors. Second, sector concentration risk
              is significant: revenue is skewed toward logistics, warehousing, retail, and e-commerce sectors that
              declined 9.5 percent globally in 2024 while Job&Talent outperformed. A further demand contraction in these
              verticals could compress both volume and pricing simultaneously, a dynamic that already affected Robert
              Half, Kelly Services, and Randstad in Q3 2025. Third, Job&Talent's debt facility with BlackRock, its
              covenant schedule, and maturity profile are entirely undisclosed. In a scenario of sustained revenue
              softness, undisclosed covenant triggers could accelerate repayment obligations. The company's U.S. market
              grew 27 percent in Q4 2024, providing a partial offset, but single-geography concentration within its
              growth engine creates its own fragility. Third-party technology and payroll-processing vendors for
              10-country operations are not publicly named, making concentration assessment impossible from public
