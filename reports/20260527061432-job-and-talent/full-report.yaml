      - number: '4.3'
        title: Capital structure, liquidity visibility, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Job&Talent’s near-term capital position looks better than that of an emergency financings story, but the
              signal is mixed. Officially, the company raised €92 million of equity in April 2025 at a €1.3 billion
              valuation and said the proceeds would fund international growth, sales capacity, and AI product
              development. Independent coverage, however, is explicit that this was a down round versus the 2021 peak
              valuation, which is the clearest adverse market signal in the capital structure. The company described
              itself as well capitalized, and its funding announcement ties the raise to offensive expansion rather than
              a rescue recapitalization. Even so, the public record still omits the core underwriting inputs: current
              cash, monthly burn or generation, debt outstanding, covenants, interest burden, maturity schedule, and
              customer concentration. Official UK filing pages do at least show that 2024 group accounts for
              Jobandtalent UK Limited were filed in May 2025 and that the next accounts are due by 30 September 2026, so
              there is formal reporting cadence. But the reviewed public evidence still does not surface a consolidated
              liquidity bridge. Macro context also remains unsupportive: WEC, ASA, and HR Brew all describe a staffing
              market with weak churn, selective demand, and margin pressure into 2026.
