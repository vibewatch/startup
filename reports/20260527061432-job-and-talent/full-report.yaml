      - number: '2.6'
        title: Evidence Gaps, Contradictory Estimates, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Several important sizing and market-definition questions remain unresolved in public sources. No single
              data provider publishes a clean disaggregated figure for blue-collar-only temporary staffing revenue
              across Europe, the US, and Latin America separately; most industry reports blend temp, perm, RPO, and WFM
              software into headline figures that cannot be reliably split without primary research. Randstad and Adecco
              annual reports cite consolidated revenues but do not separately disclose temporary versus permanent versus
              WFM-platform revenue at the segment level, making it impossible to independently validate the
              blue-collar-specific SAM "Job&Talent" competes in. WFM software market estimates also vary significantly
              depending on whether analysts include payroll-embedded software, broader HCM modules, or just standalone
              scheduling tools — Grand View Research's $8.07 billion 2022 base is not directly comparable to
              operator-reported platform fees. The resulting uncertainty means that "Job&Talent's" SAM and SOM figures
              must be treated as constructed estimates, not confirmed market measurements, and any valuation analysis
              that relies on a specific TAM multiple should anchor on the narrowest reasonably supportable boundary
              rather than the broadest aggregate number.
            claimRefs:
              - CM036
              - CM037
              - CM038
      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Market is Large, Fragmented, and Cyclically Challenged — but Structurally Intact
            body: >-
              The global temporary staffing market offers "Job&Talent" an enormous nominal TAM (above $600 billion), but
              the key investment thesis test is whether the company can build durable platform economics in a market
              dominated by labour arbitrage rather than software margin. The 2022–2025 downturn was real and global;
              recovery is stabilising, not accelerating. The structural demand story — manufacturing labour gaps,
              e-commerce logistics growth, flexible labour preference — remains intact and supports long-term demand for
              tech-enabled staffing operators.
            calloutType: insight
            claimRefs:
              - CM001
              - CM008
              - CM010
              - CM019
          - type: callout
            title: Clean SAM/SOM Isolation Is Not Currently Possible from Public Data
            body: >-
              No public source disaggregates blue-collar-only temporary staffing revenue by "Job&Talent's" exact
              geographies and sectors. This creates a diligence gap: valuation multiples that reference a TAM should use
              the narrowest defensible boundary, and any model assuming a specific SAM needs primary-source validation.
            calloutType: risk
            claimRefs:
              - CM036
              - CM037
              - CM038
          - type: callout
            title: Structural Blue-Collar Labour Gap Creates Durable Platform Demand
            body: >-
              The manufacturing labour shortage (3.8M US workers needed by 2033), combined with growing client
              preference for flexible contracts and rapid AI skill uptake among agency workers, creates a structurally
              supportive demand environment for platforms that can efficiently match, schedule, and retain blue-collar
              workers.
