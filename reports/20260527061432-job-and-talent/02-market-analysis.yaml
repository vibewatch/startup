  - id: growth-drivers
    title: Structural Growth Drivers and Demand Tailwinds
    body: >-
      Several structural factors sustain long-term demand for blue-collar temporary
      staffing intermediaries. First, the manufacturing labour shortage: Deloitte
      and the Manufacturing Institute project that U.S. manufacturers could need
      up to 3.8 million new workers by 2033, with roughly 1.9 million roles at risk
      of going unfilled without intervention; 20% of US manufacturing plants failed
      to produce at full capacity in 2025 due to skills gaps. This structural
      deficit creates durable demand for flexible staffing solutions that can rapidly
      source qualified frontline workers. Second, flexible labour preference is
      accelerating: contract and temporary job postings on LinkedIn rose 7%
      year-over-year in 2025 even as overall postings declined, signalling that
      clients are preferring variable labour over permanent commitment during the
      current period of macro uncertainty. Third, AI adoption is reshaping the
      competitive landscape. OECD data cited by WEC shows that 20.2% of firms were
      using AI in their operations in 2025 — more than double the 2023 rate — and
      staffing agency workers added AI literacy skills at 46% more than the broader
      LinkedIn population over the same period. Platform operators able to embed AI
      at the recruiting, scheduling, and compliance layers gain structural cost
      advantages. Fourth, demographics underpin long-term agency demand: the WEC
      notes that agencies are inclusion engines for women (40% of agency workers),
      students (12%), and workers over 45 (23%) — populations for which flexible
      work pathways remain essential even in tighter labour markets.
