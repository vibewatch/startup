callouts:
  - calloutType: insight
    title: Market is Large, Fragmented, and Cyclically Challenged — but Structurally Intact
    body: >-
      The global temporary staffing market offers "Job&Talent" an enormous nominal
      TAM (above $600 billion), but the key investment thesis test is whether the
      company can build durable platform economics in a market dominated by labour
      arbitrage rather than software margin. The 2022–2025 downturn was real and
      global; recovery is stabilising, not accelerating. The structural demand
      story — manufacturing labour gaps, e-commerce logistics growth, flexible
      labour preference — remains intact and supports long-term demand for
      tech-enabled staffing operators.
    claimRefs:
      - CM001
      - CM008
      - CM010
      - CM019
  - calloutType: risk
    title: Clean SAM/SOM Isolation Is Not Currently Possible from Public Data
    body: >-
      No public source disaggregates blue-collar-only temporary staffing revenue
      by "Job&Talent's" exact geographies and sectors. This creates a diligence gap:
      valuation multiples that reference a TAM should use the narrowest defensible
      boundary, and any model assuming a specific SAM needs primary-source validation.
    claimRefs:
      - CM036
      - CM037
      - CM038
  - calloutType: strength
    title: Structural Blue-Collar Labour Gap Creates Durable Platform Demand
    body: >-
      The manufacturing labour shortage (3.8M US workers needed by 2033), combined
      with growing client preference for flexible contracts and rapid AI skill uptake
      among agency workers, creates a structurally supportive demand environment for
      platforms that can efficiently match, schedule, and retain blue-collar workers.
    claimRefs:
      - CM019
      - CM020
      - CM021
      - CM022
