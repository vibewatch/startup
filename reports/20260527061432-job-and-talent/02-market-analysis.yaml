  - id: sizing-gaps
    title: Evidence Gaps, Contradictory Estimates, and Diligence Path
    body: >-
      Several important sizing and market-definition questions remain unresolved in
      public sources. No single data provider publishes a clean disaggregated figure
      for blue-collar-only temporary staffing revenue across Europe, the US, and
      Latin America separately; most industry reports blend temp, perm, RPO, and
      WFM software into headline figures that cannot be reliably split without
      primary research. Randstad and Adecco annual reports cite consolidated
      revenues but do not separately disclose temporary versus permanent versus
      WFM-platform revenue at the segment level, making it impossible to
      independently validate the blue-collar-specific SAM "Job&Talent" competes
      in. WFM software market estimates also vary significantly depending on whether
      analysts include payroll-embedded software, broader HCM modules, or just
      standalone scheduling tools — Grand View Research's $8.07 billion 2022 base
      is not directly comparable to operator-reported platform fees. The resulting
      uncertainty means that "Job&Talent's" SAM and SOM figures must be treated as
      constructed estimates, not confirmed market measurements, and any valuation
      analysis that relies on a specific TAM multiple should anchor on the narrowest
      reasonably supportable boundary rather than the broadest aggregate number.
    claimRefs:
      - CM036
      - CM037
      - CM038
