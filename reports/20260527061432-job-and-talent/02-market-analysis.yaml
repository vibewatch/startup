  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gaps
      missingEvidence: >-
        A bottom-up market sizing for blue-collar-only temporary staffing revenues
        disaggregated by "Job&Talent's" 10 operating countries (Spain, UK, US,
        Germany, France, Portugal, Italy, Colombia, Mexico, Sweden) is not
        available from any public source.
      whyItMatters: >-
        Without a defensible blue-collar-specific SAM, valuation TAM multiples
        cannot be properly deflated to the addressable opportunity, creating risk
        of over-stated addressable market in pitch materials.
      diligencePath: >-
        Commission primary-source SAM analysis from SIA or Oxford Economics using
        their proprietary country-level temp staffing revenue databases.
      relatedQuestionRefs:
        - QM007
    - type: conflicting-data
      severity: material
      topic: sizing-methodology
      missingEvidence: >-
        Major analyst houses (Grand View Research, SIA, WEC) use different perimeters
        for "temporary staffing market" — some include permanent placement, RPO, and
        WFM software while others do not — making market-size comparisons unreliable.
      whyItMatters: >-
        Inconsistent methodology means that a due-diligence model using one headline
        number as the TAM may be off by a factor of 2–5x versus a properly bounded
        blue-collar temp-only figure.
      diligencePath: >-
        Request SIA's proprietary segmented revenue tables for blue-collar vs
        professional staffing in Europe and North America, and reconcile against
        Randstad and Adecco segment-level disclosures when next reporting season opens.
      relatedQuestionRefs:
        - QM011
    - type: private-evidence-only
      severity: minor
      topic: market-penetration
      missingEvidence: >-
        "Job&Talent's" internal view of its SAM (as presented in board materials or
        investor decks) is not public, so there is no way to validate whether the
        company's self-defined addressable market matches any third-party estimate.
      whyItMatters: >-
        If the company uses an inflated TAM in investor materials, the growth
        story looks stronger than defensible public data supports.
      diligencePath: >-
        Request the company's current market-sizing methodology and investor deck
        market-size slide during due diligence, and compare against SIA country data.
      relatedQuestionRefs:
        - QM007
        - QM012
acknowledgedWarnings:
  - dimension: paywallRisk
    reason: >-
      SM027 (SIA Research hub) is js-only due to member paywall; this single
      restricted source represents less than 4% of total chapter sources and the
      key data points from SIA are corroborated by WEC and BLS open sources,
      keeping the report-level restricted share well below the 30% ceiling.
  - dimension: unverifiedSource
    reason: >-
      SM027 (staffingindustry.com/research) returns a js-rendered paywall page
      that fetch-url cannot retrieve; access is logged as js-only and the source
      is used only as a research pointer, not as the sole basis for any factual
      claim. All claims that reference SIA data are independently corroborated by
      WEC and BLS open-access sources.
