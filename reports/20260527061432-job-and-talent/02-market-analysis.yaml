  - id: adoption-constraints
    title: Adoption Constraints, Cyclical Headwinds, and Regulatory Friction
    body: >-
      The most visible constraint is the three-year cyclical downturn that gripped
      global temporary staffing from roughly 2022 to 2025. Staffing Industry
      Analysts characterised it as a "rolling recession" — a prolonged contraction
      that unfolded without triggering broader GDP alarms — driven by the post-COVID
      hiring bubble normalising, rising interest rates, and structural shifts toward
      direct sourcing and AI. US temporary employment was largely flat in 2025 after
      a sustained decline, and Q3 2025 results from Robert Half (revenue down 8%
      YoY), Kelly Services (down 9.9%), and Randstad (whose CFO cited extremely
      low hiring confidence) all confirm that the macro environment has compressed
      volumes and pricing. The Adecco Group's YoY growth in the same period was
      the outlier, driven partly by skilling and coaching services rather than
      traditional temporary placements. Structural constraints include switching
      costs: established providers have accumulated deep worker pools, audit trails,
      and compliance histories that make enterprise clients reluctant to migrate even
      when a platform offers better technology. Regulatory friction is another
      constraint — rising compliance costs from stricter data governance and AI-Act
      obligations represent a growing burden for agencies deploying algorithmic
      matching. Global macro uncertainty (tariff volatility, rate policy uncertainty,
      and geopolitical stress) pushes clients toward caution on new vendor
      commitments. "Job&Talent" outperformed the -9.5% global market decline in 2024
      by maintaining revenues at €1.8 billion, demonstrating relative resilience,
      but the structural headwinds facing all staffing operators are real and are
      not fully resolved as of mid-2026.
