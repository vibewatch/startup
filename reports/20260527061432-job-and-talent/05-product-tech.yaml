- id: mobile-applications
  title: 'Mobile Applications: Worker App and Business App'
  body: 'The worker app is the primary supply-side interface for the platform and one of the strongest public traction signals in the dossier. AppBrain records version 12.38.0 on April 29, 2026, approximately 5.7 million Android downloads, and a 4.68/5 rating, while official pages and the Google Play listing describe the core workflow: job discovery, shift acceptance, geolocation-based clocking, e-contract signing, earnings visibility, gamification mechanics, and in-app communications. On the demand side, the Business App and related employer workflow pages support shift planning, attendance monitoring, bulk clocking edits, the Insights tab, and Request Centre operations for clients across all 50 U.S. states. Together these mobile surfaces reinforce a durable operational moat: employers get workforce control in real time, while workers stay inside a frequently updated app that concentrates supply, behavioral data, and repeat engagement. Trustpilot complaints show the surface is not flawless,
    but the scale of mobile adoption still appears difficult for smaller staffing rivals to replicate.'
  claimRefs:
