callouts:
- calloutType: strength
  type: finding
  severity: positive
  title: AI Agent Squad Delivers Measurable Productivity Uplift
  body: 'Clara and Sara give the strongest measurable proof that the product is more than a digital temp agency wrapper. ''Job&Talent'' says Clara has handled 190K+ interviews, contributed to 22K+ hires, and cut time-to-fill by 65%, while Sara reduced absenteeism by 30% in measured client cohorts. The August 2025 AI-first release adds a broader operating claim: 63 placements per FTE versus an industry average of 19.'
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE005
  - CE010
- calloutType: strength
  type: finding
  severity: positive
  title: Worker App Network Effect Creates Durable Supply-Side Moat
  body: The worker app combines strong public adoption with operational embedding. AppBrain reports 5.7M Android downloads, a 4.68/5 rating, and active version velocity through v12.38.0, while the employer surface reports a 98% fill-rate claim. That combination suggests a supply-side network that smaller staffing operators would struggle to recreate quickly.
  claimRefs:
  - CE011
  - CE012
  - CE022
  - CE028
- calloutType: strength
  type: finding
  severity: positive
  title: ISO 27001:2022 Certification Removes an Enterprise Security Blocker
  body: The platform's published ISO/IEC 27001:2022 certificate, Clara's separate ISO 27001 posture, GDPR data-processing commitments, and self-declared SOC 2 and EU AI Act alignment create a materially better procurement posture than many private staffing-tech peers can show.
  claimRefs:
  - CE015
  - CE016
  - CE035
  - CE036
  - CE041
  - CE045
- calloutType: risk
  type: risk
  severity: negative
  title: Single-Cloud AWS Dependency Raises Concentration Risk
  body: Public evidence points to AWS as the only disclosed infrastructure provider. Without a public secondary-cloud strategy or disaster-recovery topology, any serious AWS outage or service disruption would have direct operational and revenue consequences.
  claimRefs:
  - CE008
  - CE033
- calloutType: risk
  type: risk
  severity: negative
  title: Third-Party Integration Depth Remains Undisclosed
  body: Clara names Teamtailor, SAP, and Workday integrations, but public materials stop short of showing connector depth, certification status, APIs, webhook behavior, or implementation timelines. That creates avoidable uncertainty for complex enterprise HR stacks.
  claimRefs:
  - CE037
  - CE038
- calloutType: risk
  type: risk
  severity: negative
  title: Adverse Worker Reviews Indicate App UX Gaps and Payment Reliability
  body: 'Trustpilot''s 3.5/5 aggregate score across roughly 940 reviews is not catastrophic, but the recurring complaint pattern matters: app glitches during clocking, delayed or incorrect payments, and slow support. Those issues can erode worker trust even when top-line placement and fill-rate metrics look strong.'
  claimRefs:
  - CE039
  - CE040
