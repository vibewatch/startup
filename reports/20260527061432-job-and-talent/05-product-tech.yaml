chapter:
  number: 5
  title: Product & Technology Deep Dive
  slug: product-tech
  summary: '''Job&Talent'' combines a cloud-native AWS platform, dual mobile applications, and an AI agent squad led by Clara, Sara, Teo, and Maria to deliver recruiting, onboarding, attendance, shift-management, and workforce analytics workflows for large blue-collar employers. Public evidence supports strong mobile distribution, meaningful AI productivity gains, and a credible enterprise compliance baseline, but it also leaves diligence gaps around single-cloud exposure, integration depth, model-provider disclosure, uptime commitments, and independent bias testing.'
sections:
- id: platform-architecture-and-infrastructure
  title: Platform Architecture and Infrastructure
  body: '''Job&Talent'' publicly presents its platform as a cloud-native workforce operating system, and the security page makes clear that the production environment runs on Amazon Web Services. That page also discloses the main security primitives around the stack: AWS Identity and Access Management with MFA, Key Management Service encryption at rest, TLS in transit, and Mobile Device Management on employee endpoints. Public GitHub repositories add important operating detail: infrastructure is managed as code in Terraform and Atmos HCL, and the engineering footprint spans TypeScript, Go, Elixir, and Java/Android tooling. An OpenTelemetry repository in the public org suggests a modern observability posture, although no public uptime SLA, multi-region topology, or secondary cloud failover architecture is disclosed. The result is a credible production stack with visible DevOps maturity but a clear concentration risk around AWS as the single disclosed infrastructure provider.'
  claimRefs:
  - CE001
  - CE008
  - CE009
  - CE015
