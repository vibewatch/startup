- id: trust-compliance-and-data-governance
  title: Trust, Compliance, and Data Governance
  body: 'Public trust materials are materially stronger than is typical for a private staffing-tech platform. ''Job&Talent'' publishes ISO/IEC 27001:2022 certification for the core platform on its security page, and Clara states that it holds a separate ISO 27001 certification covering candidate and client data processed through the AI recruiter. Clara also self-declares alignment with SOC 2 principles and the EU AI Act''s high-risk requirements for HR recruiting, and it publishes GDPR documentation alongside EU data residency commitments. Those controls are meaningful for enterprise procurement and do reduce obvious security objections. Even so, public evidence remains incomplete in three important ways: no third-party algorithmic bias audit is published for Clara, no formal uptime or disaster-recovery commitments are disclosed, and no public incident register or regulator-issued clearance package is available. That means the compliance posture is real, but it is not the same thing as a
    fully closed diligence file.'
  claimRefs:
  - CE015
  - CE016
  - CE017
  - CE034
  - CE035
  - CE036
  - CE041
  - CE042
  - CE045
