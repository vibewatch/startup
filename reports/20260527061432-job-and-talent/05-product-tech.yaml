  evidenceGaps:
  - type: missing-source
    severity: material
    topic: platform-reliability
    missingEvidence: No published SLA, uptime history, disaster-recovery architecture, or formal incident record for the platform was found.
    whyItMatters: Reliability evidence is essential for enterprise diligence because workforce operations, attendance, and payroll-adjacent workflows are time-sensitive and outage-sensitive.
    diligencePath: Request uptime dashboards, BCP/DR architecture, status-page history, and the formal security incident register from management.
    relatedQuestionRefs:
    - QE020
    - QE028
  - type: missing-source
    severity: material
    topic: ai-model-providers
    missingEvidence: The specific voice AI, LLM, ASR, or ranking-model providers underlying Clara, Sara, Teo, and Maria are not publicly disclosed.
    whyItMatters: Model-provider concentration affects cost, vendor risk, privacy, latency, and regulatory accountability for an AI-led workflow stack.
    diligencePath: Request the AI architecture diagram, model-provider inventory, and fallback policy for all four agents.
    relatedQuestionRefs:
    - QE008
  - type: missing-source
    severity: minor
    topic: patents
    missingEvidence: No public patent record or published patent strategy was identified for AI recruitment or workforce-management workflows.
    whyItMatters: A thin formal-IP perimeter increases reliance on execution, data advantages, and trade secrets rather than enforceable technical exclusivity.
    diligencePath: Ask management for patent filings, abandoned applications, or a deliberate no-patent policy.
  - type: missing-source
    severity: material
    topic: integrations
    missingEvidence: No public API documentation, webhook reference, connector certification detail, or implementation-depth documentation was found for Clara or the Business App.
    whyItMatters: Enterprise HR stacks often require deep ATS, HRIS, and payroll integration; named logos do not prove low-friction deployment.
    diligencePath: Request the integration catalog, API reference, webhook schemas, and customer implementation case studies for SAP, Workday, and Teamtailor.
    relatedQuestionRefs:
    - QE018
    - QE027
  - type: missing-source
    severity: material
    topic: ai-governance
    missingEvidence: No independent third-party bias or fairness audit for Clara's recruiting workflows was found in public trust materials.
    whyItMatters: Recruiting AI is a high-risk use case under the EU AI Act and raises obvious fairness, explainability, and discrimination concerns for enterprise buyers and regulators.
    diligencePath: Request external audit reports, bias-testing methodology, adverse-impact monitoring, and the human-oversight policy for Clara.
    relatedQuestionRefs:
    - QE017
  - type: missing-source
    severity: material
    topic: kpi-verification
    missingEvidence: No independent validation was found for the advertised KPIs around 98% fill rate, 2% absenteeism, 30% Sara improvement, or 65% Clara time-to-fill reduction.
    whyItMatters: These operating claims are central to the product thesis and commercial ROI story, so weak verification would materially affect underwriting confidence.
    diligencePath: Request cohort definitions, measurement methodology, customer references, and raw before/after operating data for the headline KPIs.
