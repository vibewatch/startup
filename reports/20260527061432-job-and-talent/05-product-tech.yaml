- id: FE001
  title: Platform Architecture Stack
  type: stack
  layout: standard
  summary: Five-layer architecture view from AWS infrastructure up to the AI-agent product surface.
  data:
    layers:
    - label: Cloud Infrastructure (AWS)
      detail: AWS hosting with KMS encryption at rest, TLS in transit, IAM and MFA controls, MDM on employee devices, and platform-level ISO/IEC 27001:2022 certification.
    - label: Workforce Data Platform
      detail: Workforce data environment inferred from AWS hosting, Terraform and Atmos IaC, and OpenTelemetry-style observability signals; public metrics reference 300,000+ placements and 1M+ placement-history training data.
    - label: Core Platform Services
      detail: Microservice and application layer spanning Go, Elixir, TypeScript, and Java/Android for job matching, onboarding, payroll support, attendance, and shift management.
    - label: Dual Mobile Applications
      detail: Worker App across iOS and Android at v12.38.0 with 5.7M Android downloads, plus the employer-facing Business App for shift planning and live workforce control.
    - label: AI Agent Layer (Clara, Sara, Teo, Maria)
      detail: Clara has processed 190K+ interviews and 22K+ hires, Sara targets no-shows, and Teo and Maria extend analytics and coaching workflows introduced in 2024.
  approximationNotes: Data-platform and observability sublayers are partially inferred from public repository and security evidence; no official architecture diagram has been published.
