  - TE004
  figureRefs: []
- id: product-velocity-and-roadmap
  title: Product Velocity and Roadmap Signals
  body: 'Public launch signals imply a product organization shipping meaningful workflow features on a recurring cadence, even without a formal roadmap. In September 2024 ''Job&Talent'' announced Teo, Bulk Clocking Editor, Recruitment Insights, and coverage across all 50 U.S. states. In December 2024 it followed with Maria, Request Centre, and the People Requests workflow. By late April 2026 the worker app had reached version 12.38.0, implying continued mobile iteration after the 2024 release wave. The August 2025 profitability-and-AI press release added a broader strategic framing: management wants to run an AI-first workforce management model with a 3.3x FTE productivity advantage over legacy peers. Commercial packaging supports that interpretation, because the AI squad is offered through a 12-week trial. What remains missing is the deeper integration roadmap: Teamtailor, SAP, and Workday are named on Clara''s enterprise surface, but no public API, webhook, certification, or implementation-depth
    documentation is available.'
