- id: scenarios-and-sensitivity
  title: Bull, Base, and Bear Scenarios
  body: 'The three scenarios differ primarily in the realisation rate of the AI-platform thesis and the macro staffing environment, which together determine whether the revenue multiple can be sustained or needs to compress back toward legacy-staffing levels.

    Bull case: AI agents demonstrate measurable NRR expansion and gross margin step-up. Clara and follow-on agents drive fill rate, absenteeism, and client-retention improvements that are monetised as pricing power rather than only cost reduction. U.S. revenue growth sustains above 20% YoY for two or more years. Global staffing markets recover from the 2022–2025 downturn, consistent with the WEC Industry Impact 2026 report''s observation that Asia-Pacific placements grew even as revenues fell in North America and Europe. In this scenario, the company demonstrates software-like gross margins above 35%, raises in 2027 at €2.0–€2.5 billion, and positions for IPO on a 1.0–1.5× EV/Revenue multiple, implying a 2–3× return from the current mark over a 3–4 year holding period.

    Base case: Platform metrics improve but remain staffing-economics-constrained. AI reduces cost-to-serve but does not materially expand gross margin disclosed at the sector level (contribution margin stays below 30%). Revenue grows at 5–8% annually in 2025–2028 as the company consolidates gains in the U.S. while Europe stabilises. The company does not pursue IPO before 2028 but may secure a secondary transaction or Series G at approximately the current valuation mark, offering limited upside over the €1.3 billion entry. The sector backdrop suggested by the WEC Economic Report 2025 — continued revenue pressure in North America and Europe but growth in Asia-Pacific — supports cautious optimism.

    Bear case: The AI commercial thesis fails to generate incremental revenue. Staffing demand deteriorates further as clients defer hiring amid macro uncertainty (supported by FRED temporary-help employment data showing cyclical declines) and direct-sourcing competition intensifies. The April 2026 charge registration at the Holding entity materialises as a material debt covenant that restricts growth investment. The 2021 preference stack holders are entitled to liquidation preferences that absorb return value before common/later-round investors. In this scenario the company may require a defensive Series G at a further down-round valuation, or execute a trade sale at 0.3–0.4× revenue to a large incumbent staffing group, implying meaningful mark-down from €1.3 billion.'
