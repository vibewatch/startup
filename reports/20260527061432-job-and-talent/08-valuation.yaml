- id: TV005
  title: Thesis-Break and Kill Triggers
  columns:
  - Trigger
  - Threshold or Event
  - Transmission to Thesis
  - Action Implication
  rows:
  - - Confirmed distress interpretation of April 2026 charge
    - Charge confirmed as bridge or rescue financing, not operational revolving credit
    - Signals cash burn exceeding raise proceeds; bear case accelerates
    - Exit position; no further capital
  - - 2025 group accounts show negative free cash flow
    - FCF <0 in FY2025 accounts (due September 2026)
    - Raises runway concern even post-raise; EBITDA does not convert to cash
    - Downgrade to avoid; require full cash-bridge before any commitment
  - - U.S. revenue growth decelerates below 10% YoY in 2025
    - Companies House accounts or company disclosure shows US growth slowdown
    - Removes the primary bull-case driver; base case becomes range bound
    - Reduce hold; require NRR or software metrics before committing
  - - Preference liquidation stack absorbs >40% of €1.3B in base exit scenario
    - Cap-table diligence reveals Series E or prior preference seniors > €520M face
    - Common and recent-round equity deeply impaired in base/bear outcomes
    - Reprice or pass; preference overhang kills return math
  - - Large incumbent AI rollout matches Clara metrics within 12 months
    - Adecco or Randstad announces AI-agent fill rates and interview throughput competitive with Clara
    - Technology moat narrows; AI premium in the multiple evaporates
    - Reduce multiple; reassess at 0.40× EV/Revenue
  - - TEMPHELPS series posts three consecutive monthly declines >1%
    - U.S. BLS temporary help employment falls sharply
    - U.S. revenue driver reverses; bull case assumptions no longer valid
    - Downgrade to avoid; wait for stabilisation signal
  notes: Triggers are monitoring-based thresholds derived from the evidence base and scenario logic. Liquidation preference threshold is illustrative (assumes €520M of senior preferences absorbing 40% of €1.3B total equity value). Actual threshold requires cap-table diligence.
