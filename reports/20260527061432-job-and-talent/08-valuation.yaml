  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: NRR
    missingEvidence: Net Revenue Retention statistics for employer cohorts across 2023–2025
    whyItMatters: NRR is the single most important metric for determining whether the tech premium in the valuation is justified. Without it, any multiple above 0.5× EV/Revenue is speculative.
    diligencePath: Request from data room; management presentation; may be partially inferrable from 2024 group accounts if customer revenue concentration is disclosed.
    relatedQuestionRefs:
    - QV024
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
