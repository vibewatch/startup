- id: recommendation-and-exit-readiness
  title: Recommendation, Exit Readiness, and Entry Discipline
  body: 'The consolidated verdict is Track. The core reason is price: at ~21× EV/EBITDA and ~0.72× EV/Revenue, Job&Talent is priced for an AI-platform future that has not yet been proven in the metrics that matter most for underwriting — gross margin at P&L level, NRR, software ARR, or a clear debt stack. The down-round structure introduces additional friction: BlackRock and InfraVia participated in the April 2025 round, suggesting the cap table includes sophisticated institutional investors with preferences and governance rights that new investors must diligence carefully before entry. The April 2026 charge registration adds an unquantified senior obligation.

    A buy case becomes supportable if: (a) 2025 group accounts (due by 30 September 2026 per Companies House) confirm gross margin above 30% and positive free cash flow; (b) NRR and software take-rate metrics are disclosed or estimated above 110%; (c) the preference and debt stack is diligenced and does not absorb more than 30–35% of upside in base-case exit scenarios; and (d) the April 2026 charge is confirmed as an operational credit facility rather than a bridge-to-distress instrument.

    Exit readiness is constrained. The staffing sector''s public market appetite has been weak: Randstad''s market cap fell 23% from €7.4 billion (2024) to €5.7 billion (2025), ManpowerGroup stock reached a 2025 low of $26.63, and the global staffing revenue contraction (SIA: -3% to $257 billion in 2024) reduces the IPO comp set attractiveness. A trade sale to one of the top-five global staffing firms (Randstad, Adecco, ManpowerGroup, Allegis, Recruit) is a credible exit path if AI differentiation is demonstrated, but trade buyers would likely price on EBITDA multiples (9–12×), implying an exit valuation of €550–€740 million at current EBITDA — well below the current entry mark. Strategic premium is possible but unmodeled without comparable transaction data.

    The ASA/LinkedIn 2026 survey showing contract postings rising 7% YoY and staffing workers adding AI skills 46% faster than the broader LinkedIn population is a directionally positive signal for Job&Talent''s addressable market, but it does not validate the specific monetisation thesis at the current valuation.'
