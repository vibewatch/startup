- id: comparable-valuation-analysis
  title: Comparable Valuation and Financing Analysis
  body: 'Establishing a fair-value anchor for a private, AI-enhanced staffing platform requires three reference classes: listed legacy staffing companies, private platform peers, and an internal DCF/EBITDA sanity check.

    Listed legacy staffing comps trade at depressed revenue multiples reflecting the cyclicality and low-margin nature of temporary labour intermediation. Randstad''s 2025 annual report shows €23.077 billion in revenues, a 3.1% underlying EBITA margin (€715 million in EBITA), a year-end market capitalisation of €5.696 billion, and an enterprise value of €6.702 billion — yielding an EV/Revenue of approximately 0.29× and an EV/EBITA of approximately 9.4×. ManpowerGroup''s investor page discloses $17.957 billion in 2025 segment revenues; with a 2025 stock price range of $26.63–$62.66 per share on the NYSE and $1.677 billion in total debt, its EV/Revenue is estimated at approximately 0.20–0.25×. The Staffing Industry Analysts 100-largest staffing firms report (August 2025) ranked Randstad, Adecco (~$22.3 billion), and ManpowerGroup (~$17.3 billion) as the top three, with combined revenue decline of 3% in 2024 to $257 billion — confirming a sector still in volume contraction.

    Private platform peers are harder to value. Zenjob raised a $50 million Series D in February 2022 at an undisclosed valuation; TechCrunch described it then as competing directly with Job&Talent in European markets. No subsequent public Zenjob funding mark exists as of the run date. Instawork, the U.S. hourly-work marketplace, has no confirmed post-2022 public valuation. These gaps confirm that Job&Talent''s €1.3 billion mark is currently the most actionable private comp in the sector.

    Against listed comps, Job&Talent''s €1.3 billion post-money equity value appears stretched for pure-staffing assumptions. If the company were valued on Randstad''s 0.29× EV/Revenue multiple, the implied EV would be approximately €522 million — well below the current mark. At 0.5× (a modest technology premium for AI-enhanced delivery), the implied EV is approximately €900 million. The current €1.3 billion mark implies an EV/Revenue of ~0.72× — roughly 2.5× the listed-staffing average — which requires sustained evidence of software-layer margin and platform stickiness. On an EBITDA basis, the €1.3 billion mark implies ~21× EV/EBITDA vs. Randstad''s ~9.4× — again, a substantive premium that prices forward AI monetisation. Upwork''s 2025 10-K shows $787.8 million in total revenue for a company operating a digital talent marketplace; while Upwork is a different model (white-collar freelance) it provides a reference for marketplace-style EV/Revenue multiples in growth-stage digital labour.

    Companies House filings for Jobandtalent UK Limited (07890603) show group accounts made up to 31 December 2024 were filed in May 2025 (46 pages), confirming formal UK reporting cadence. The April 2026 charge registration (MR01, 100849170018) on the Job and Talent Holding Limited entity (10084917) is a material development: it indicates a new secured credit facility or financing arrangement post-raise, adding a layer of debt obligation that is not quantified in public sources.'
