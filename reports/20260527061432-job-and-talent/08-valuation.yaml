callouts:
- calloutType: recommendation
  title: Recommendation — Track
  body: Do not commit capital at the current €1.3 billion mark without completing financial diligence on gross margin, NRR, preference waterfall, and the April 2026 debt charge. The AI thesis is credible but not yet commercially validated at a scale that justifies the ~2.5× premium over listed staffing peers. Re-evaluate when 2025 audited group accounts are filed (due September 2026) and when the nature of the April 2026 charge is confirmed.
  claimRefs:
  - CV001
  - CV002
  - CV033
  - CV034
  - CV043
  - CV044
- calloutType: risk
  title: Down-Round Signal and Preference Overhang
  body: The 2025 Series F was explicitly a down round from $2.35 billion (2021) to $1.5 billion, a ~36% peak-to-trough decline. The April 2026 charge registration on the Holding entity introduces a new unquantified senior obligation. Together, these create a structural information gap on the effective return available to new investors before the preference and debt stack is diligenced.
  claimRefs:
  - CV001
  - CV006
  - CV022
  - CV036
  - CV043
- calloutType: insight
  title: Public Comps Calibrate the Premium
  body: Randstad's disclosed 2025 EV of €6.702 billion on €23.077 billion in revenue (0.29× EV/Revenue) and 3.1% EBITA margin establishes the floor multiple for a pure-play staffing business. Job&Talent's implied 0.72× EV/Revenue asks investors to price AI optionality at roughly 2.5× the listed-staffing baseline — a premium that can only be justified by evidence of software-layer gross margin expansion or platform NRR above 110%.
  claimRefs:
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
