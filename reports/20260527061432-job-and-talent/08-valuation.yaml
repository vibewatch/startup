- id: diligence-asks-and-monitoring
  title: Outstanding Diligence and Monitoring Signals
  body: 'The primary information gaps preventing a higher-conviction call are financial and structural. Public sources reviewed during this run do not disclose: consolidated cash or net cash position; monthly or quarterly burn/generation rate; full cap-table preference waterfall and liquidation preference multiples; gross margin by business segment (staffing revenue vs. software/service fees); NRR or cohort retention statistics; outstanding debt principal, interest rate, and maturity schedule; details of the April 2026 charge registered at Job and Talent Holding Limited. The Jobandtalent UK Limited 2024 group accounts (AA filing, May 2025, 46 pages) may partially address cash and balance-sheet questions but have not been reviewed here.

    Key macro monitoring signals: The FRED temporary help services series (TEMPHELPS) is a leading indicator for U.S. staffing demand; sustained monthly declines would compress the base-case revenue assumption. The WEC Industry Impact Report 2026 reported North American placements declined by roughly one million in 2024, which is an adverse headwind for Job&Talent''s largest growth market. The Staffing Industry Analysts rolling-recession thesis (three-year consecutive temporary-employment contraction) identifies stabilisation as the most recent signal, but a renewed contraction leg would impair bull-case assumptions.

    AI-competitor monitoring: The SIA Staffing Company Tech Stack 2026 Update documents a converging, AI-enabled operating architecture across front office, middle office, and back office. If large incumbents (Randstad, Adecco, ManpowerGroup) successfully deploy comparable AI capabilities at their much larger revenue bases, Job&Talent''s technology moat may narrow before the AI revenue premium is captured in the multiple. The Adecco Group annual report for 2025 notes that agentic AI is targeted to cover more than 50% of Adecco GBU revenues by end of 2026 — a direct competitive signal. Staffing market headwinds captured by HR Brew''s Q3 2025 coverage (Robert Half -8% YoY, Kelly -10%, Randstad -1.2%) show the operating environment remains challenged even for established players with lower debt burdens.'
