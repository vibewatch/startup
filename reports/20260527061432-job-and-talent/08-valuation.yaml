- id: TV002
  title: Thesis and Anti-Thesis
  columns:
  - Argument
  - Supporting Evidence
  - What Would Change the View
  rows:
  - - AI-platform premium is partly justified by operating leverage
    - 3.3× workers-per-FTE advantage; 23% EBITDA growth in contracting market
    - Gross margin above 30% and NRR confirmed in audited accounts
  - - U.S. growth creates a large incremental revenue opportunity
    - +27% U.S. revenue in Q4 2024 vs. market decline of -9.4%
    - U.S. growth sustained at 15%+ for 2025 full year
  - - Revenue resilience is above-peer and worth a multiple premium
    - Market outperformance of 8 pp in 2024; contribution margin +6.2 pp
    - At least two consecutive years of margin expansion disclosed
  - - Down round is a valuation reset, not a distress signal
    - Round was backed by marquee names; framed as offensive growth capital
    - April 2026 debt charge confirmed as operational, not rescue financing
  - - €1.3B mark is stretched vs. listed staffing comps
    - Randstad 0.29× EV/Rev, ManpowerGroup ~0.20×; implied premium is ~2.5×
    - Software ARR or blended gross margin disclosed at >35% resolves the gap
  - - Cap table preference overhang is unquantified
    - No public disclosure of liquidation preferences or Series E vs. F waterfall
    - Full cap table and preference stack confirmed via diligence data room
  - - Sector demand remains under pressure into 2026
    - 'Randstad revenues down from €24.1B to €23.1B; SIA: -3% global staffing'
    - Staffing volume recovery confirmed by TEMPHELPS series or SIA mid-year
  notes: Evidence references combine company-disclosed metrics from the 2025 profitability announcement and Series F press release with public-comp data from the Randstad 2025 Annual Report and Staffing Industry Analysts. Views presented do not represent investment advice.
