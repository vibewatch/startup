callouts:
  - calloutType: "insight"
    title: "Fiduciary Positioning in an Opaque Distribution Ecosystem"
    body: "Chapter's primary structural differentiator is decoupling advisor compensation from carrier commission differentials. While traditional brokerages face scrutiny and regulatory crackdowns for steering seniors into high-commission plans, Chapter's salaried advisor model and 24,000-plan recommendation engine align guidance with senior healthcare needs."
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM007"
  - calloutType: "risk"
    title: "Regulatory Headwinds and Carrier Commission Dependency"
    body: "Although Chapter positions itself as an unbiased advocate, its core revenue model remains dependent on insurance carrier commissions. As CMS tightens marketing rules and lead-generation restrictions, any policy shift that alters carrier commission schedules or broker compensation poses a material risk to top-line economics."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM010"
