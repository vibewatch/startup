company:
  name: Chapter
chapter:
  number: 1
  title: Company Overview
  summary: Chapter (Memoir, Inc.) is a New York-based Medicare navigation platform and licensed insurance brokerage that uses
    proprietary data and advisor-assisted workflows to compare nationwide Medicare plans. Founded in 2020 by Cobi Blumenfeld-Gantz
    and Corey Metzman, Chapter closed a 00 million Series E round led by Generation Investment Management in April 2026 at
    a reported  billion valuation, scaling to surpass 00 million in ARR while maintaining flat corporate headcount.
sections:
- id: corporate-identity-and-mission
  title: Corporate Identity, Mission, and Operating Model
  body: Chapter operates as a technology-enabled healthcare navigation platform and licensed insurance advisory dedicated
    to helping older Americans navigate the complexities of Medicare coverage. Legally incorporated as Memoir, Inc., the enterprise
    conducts insurance brokerage operations through its wholly owned subsidiary Chapter Advisory, LLC, with licensed advisory
    operations spanning all fifty U.S. states from its primary corporate headquarters at 19 Union Square West in New York
    City. Unlike conventional commission-driven insurance agencies whose revenue incentives favor a narrow set of contracted
    Medicare Advantage carriers, Chapter differentiates its operating model by employing salaried Medicare advisors who are
    compensated equally regardless of which insurance plan a beneficiary selects. The platform searches and compares more
    than 24,000 Medicare plans nationwide across Medicare Supplement, Medicare Advantage, and Part D prescription drug options,
    explicitly including plans that provide no commission compensation to Chapter. This fiduciary-aligned guidance structure
    directly addresses documented industry agency conflicts, combining proprietary algorithmic search tools with personalized
    consultations to eliminate search friction and minimize out-of-pocket healthcare expenses for retiring seniors.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  tableRefs:
  - TO001
- id: leadership-governance-and-team
  title: Founders, Leadership, and Governance Architecture
  body: Chapter was co-founded in 2020 by Chief Executive Officer Cobi Blumenfeld-Gantz, Chief Operating Officer Corey Metzman,
    and advisor Ari Parker, inspired by personal family experiences navigating Medicare enrollment hurdles, opaque carrier
    incentives, and administrative plan errors. Blumenfeld-Gantz brings enterprise government software experience from a five-year
    tenure at Palantir Technologies leading U.S. Government client deployments, shaping Chapter’s emphasis on data integration
    and technical rigor in plan comparison. Corey Metzman oversees agency scaling, licensed advisor hiring, and carrier relations,
    while Ari Parker serves as lead advisor and consumer advocate, authoring widely circulated educational guidance on Medicare
    decision-making. Governance and strategic oversight are anchored by high-profile board members and venture sponsors, including
    PayPal and Palantir co-founder Peter Thiel, former U.S. Secretary of Health and Human Services Donna Shalala, and institutional
    investment directors across early rounds. The organization maintains an efficient human capital model, deploying approximately
    thirty corporate and engineering staff in New York alongside a national distributed corps of roughly 150 salaried, remote
    licensed advisors to support members year-round.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  tableRefs:
  - TO002
- id: capitalization-valuation-and-ownership
  title: Financing Trajectory, Valuation, and Capitalization
  body: Chapter has raised cumulative equity financing of approximately 86 million across six institutional funding rounds
    since its 2020 inception, reflecting substantial venture capital conviction in software-enabled Medicare distribution.
    In April 2026, the company completed a landmark 00 million Series E round led by Generation Investment Management, with
    new commitments from Fifth Down Capital and 8VC alongside participating existing backers Stripes, Addition, XYZ Venture
    Capital, Narya Capital, Susa Ventures, and Maverick Ventures. The Series E round valued Chapter at an estimated .0 billion
    post-money valuation, more than doubling its capitalization benchmark established during its 5 million Series D led by
    Stripes in early 2025. This valuation expansion has been accompanied by rapid financial performance, with the company
    reporting that 2025 revenue tripled and annual recurring revenue surpassed 00 million while corporate headcount remained
    essentially flat. However, because Chapter operates as a closely held private Delaware corporation, definitive terms such
    as share class liquidation preference waterfalls, option pool dilution, and exact revenue recognition mechanics remain
    undisclosed private details.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  tableRefs:
  - TO003
- id: strategic-milestones-and-infrastructure
  title: Operating Milestones, Product Roadmap, and Technical Capabilities
  body: Since launching in 2020, Chapter has executed an aggressive product roadmap that expanded its scope from direct-to-consumer
    Medicare plan comparison into enterprise B2B2C distribution and supplemental senior financial applications. Key operational
    milestones include national 50-state licensing in 2021, Series B scaling in 2022, congressional testimony before the U.S.
    Senate Finance Committee in 2023 on curbing deceptive third-party lead generation, and the 2024 launch of an Over The
    Counter benefits mobile application enabling beneficiaries to access underutilized wellness benefits. The company has
    also structured distribution partnerships with wealth management firms and healthcare systems to provide embedded advisory
    workflows. In evaluating external technical posture, an independent review by APIs.io highlighted that Chapter currently
    maintains zero public developer APIs and received a minimal Kin Score of 8.9 out of 100, reflecting its focus as an advisor-mediated
    consumer health service rather than an open developer platform. Diligence asks must focus on verifying private carrier
    retention metrics and commission sustainability.
  claimRefs:
  - CO014
  - CO015
  - CO012
  figureRefs:
  - FO001
