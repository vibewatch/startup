callouts:
- calloutType: insight
  title: Incentive Alignment and Advisor Neutrality
  body: Traditional Medicare brokerages rely on disparate commission structures that skew recommendations toward high-paying
    Medicare Advantage carriers. Chapter structurally neutralizes this bias by paying advisors standardized salaries and searching
    all available plans—including non-commissioning options—supported by algorithmic plan-matching software.
  claimRefs:
  - CO004
  - CO005
