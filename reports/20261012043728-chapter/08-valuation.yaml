callouts:
  - calloutType: "recommendation"
    title: "Track Stance Recommended on Stretched Valuation"
    body: "While Chapter has demonstrated exceptional commercial traction by reaching $100M ARR, the $3.0B Series E valuation reflects an aggressive 30x ARR multiple. Without audited confirmation of GAAP operating profitability or unit-level contribution margins, immediate capital commitment is difficult to justify."
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV013"
  - calloutType: "risk"
    title: "Public Comparable Compression Risk"
    body: "Publicly traded Medicare brokerages trade at 2.5x to 5.0x price-to-sales multiples. An eventual public listing or down-round repricing presents significant multiple compression risk if markets value Chapter as an insurance distributor rather than a pure software enterprise."
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV009"
