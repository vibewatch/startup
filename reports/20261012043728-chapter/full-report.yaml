      - number: '3.3'
        title: Pricing, Packaging, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Chapter discloses that its service is free to beneficiaries and that the organization may receive carrier
              commissions, while individual advisors receive the same pay regardless of the plan recommended. Public
              evidence does not disclose enterprise partner pricing, carrier contract economics, realized commission
              mix, discounts, or comparable named-rival pricing. Distribution is better evidenced: Fierce Healthcare
              reported that Chapter used little direct-to-consumer advertising and instead worked through health
              systems, financial institutions, and content sites; Chapter's own materials describe the same partner
              categories. That embedded route can lower dependence on consumer lead buying, but partner concentration
              and channel economics remain private.
            claimRefs:
              - CP002
