      - number: '6.2'
        title: Adoption Trajectory, Growth Signals, and Retention Durability
        blocks:
          - type: paragraph
            body: >-
              Chapter demonstrated accelerating commercial momentum through the 2025 operating year, tripling annual
              revenue and crossing the milestone of $100 million in annual recurring revenue. This commercial trajectory
              was accomplished while maintaining flat corporate headcount of approximately thirty employees in its New
              York headquarters, demonstrating meaningful operating leverage from proprietary data pipelines and
              licensed advisor tooling. Consumer adoption expanded in tandem, with Chapter logging a 4x year-over-year
              increase in policy enrollments across Medicare Advantage, Medicare Supplement, and prescription drug
              plans. Organic customer word-of-mouth has emerged as a principal growth engine, with management reporting
              that referrals from existing members constituted the single largest source of new member acquisition in
              2025. Customer satisfaction signals remain exceptionally high, reflected in an average rating of 4.95 out
              of 5 across 5,011 verified portal reviews. Chapter asserts its annual member churn is fivefold lower than
              prevailing Medicare brokerage industry averages, though audited cohort retention curves remain private.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Customer Journey Dynamics and Regulatory Compliance Safeguards
        blocks:
          - type: paragraph
            body: >-
              The customer lifecycle on Chapter spans awareness, digital onboarding, comprehensive plan matching,
              salaried advisor consultation, and continuous post-enrollment advocacy. Because seniors frequently
              confront confusing plan options and deceptive third-party marketing, Chapter differentiates its advisory
              model by paying advisors fixed salaries rather than variable carrier commissions, eliminating financial
              incentives to steer members toward high-bounty policies. Following enrollment, Chapter engages members
              year-round through specialized services, including an over-the-counter benefits application that helps
              seniors redeem an estimated five billion dollars in historically unused allowances. Dedicated member
              advocates manage prior authorization denials and doctor appointment logistics. However, because Chapter
              operates as a licensed brokerage earning carrier commissions and paying referral fees to organizations
              like AARP, it faces stringent federal compliance boundaries. Federal healthcare regulations, including 42
              CFR Part 483 resident protection standards and tightening CMS lead generation restrictions, require
              Chapter to maintain rigorous documentation and data privacy controls across all client touchpoints.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
