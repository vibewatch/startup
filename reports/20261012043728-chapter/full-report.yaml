  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Oversight, Marketing Scrutiny, and Healthcare Compliance
        blocks:
          - type: paragraph
            body: >-
              Chapter operates Memoir, Inc. and its licensed subsidiary Chapter Advisory LLC in a Medicare Advantage and
              Part D distribution market subject to intense federal and state regulatory oversight. The Centers for
              Medicare and Medicaid Services (CMS) enforces stringent marketing and lead generation regulations designed
              to restrict predatory steering and misleading third-party advertising. As detailed in CEO Cobi
              Blumenfeld-Gantz's congressional testimony before the Senate Finance Committee, federal scrutiny has
              targeted deceptive lead generators and aggressive broker practices. While Chapter advocates for
              consumer-first fiduciary standards and uniform comparison across all plans, any regulatory tightening on
              telephonic enrollment, electronic consent, cross-selling, or broker compensation limits creates direct
              compliance exposure across all 50 states.
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR014
