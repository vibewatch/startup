              - CU010
              - CU011
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Partner-Led Distribution Moat
            body: >-
              Chapter differentiates itself from direct-to-consumer Medicare brokers by acquiring customers through
              trusted enterprise partnerships with institutions like AARP and wealth advisory firms, substantially
              lowering customer acquisition costs.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: callout
            title: Carrier Commission and Referral Fee Scrutiny
            body: >-
              While Chapter positions its advisors as fiduciary-aligned and salaried, the agency remains dependent on
              carrier enrollment commissions and referral fees, requiring continuous compliance oversight under
              tightening CMS marketing guidelines.
            calloutType: risk
            claimRefs:
              - CU012
