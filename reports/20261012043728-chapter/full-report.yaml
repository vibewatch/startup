chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Chapter operates as a technology-enabled healthcare navigation platform and licensed insurance advisory
              dedicated to helping older Americans navigate the complexities of Medicare coverage. Legally incorporated
              as Memoir, Inc., the enterprise conducts insurance brokerage operations through its wholly owned
              subsidiary Chapter Advisory, LLC, with licensed advisory operations spanning all fifty U.S. states from
              its primary corporate headquarters at 19 Union Square West in New York City. Unlike conventional
              commission-driven insurance agencies whose revenue incentives favor a narrow set of contracted Medicare
              Advantage carriers, Chapter differentiates its operating model by employing salaried Medicare advisors who
              are compensated equally regardless of which insurance plan a beneficiary selects. The platform searches
              and compares more than 24,000 Medicare plans nationwide across Medicare Supplement, Medicare Advantage,
              and Part D prescription drug options, explicitly including plans that provide no commission compensation
              to Chapter. This fiduciary-aligned guidance structure directly addresses documented industry agency
              conflicts, combining proprietary algorithmic search tools with personalized consultations to eliminate
              search friction and minimize out-of-pocket healthcare expenses for retiring seniors.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: Founders, Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              Chapter was co-founded in 2020 by Chief Executive Officer Cobi Blumenfeld-Gantz, Chief Operating Officer
              Corey Metzman, and advisor Ari Parker, inspired by personal family experiences navigating Medicare
              enrollment hurdles, opaque carrier incentives, and administrative plan errors. Blumenfeld-Gantz brings
              enterprise government software experience from a five-year tenure at Palantir Technologies leading U.S.
              Government client deployments, shaping Chapter’s emphasis on data integration and technical rigor in plan
              comparison. Corey Metzman oversees agency scaling, licensed advisor hiring, and carrier relations, while
              Ari Parker serves as lead advisor and consumer advocate, authoring widely circulated educational guidance
              on Medicare decision-making. Governance and strategic oversight are anchored by high-profile board members
              and venture sponsors, including PayPal and Palantir co-founder Peter Thiel, former U.S. Secretary of
              Health and Human Services Donna Shalala, and institutional investment directors across early rounds. The
              organization maintains an efficient human capital model, deploying approximately thirty corporate and
              engineering staff in New York alongside a national distributed corps of roughly 150 salaried, remote
              licensed advisors to support members year-round.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
