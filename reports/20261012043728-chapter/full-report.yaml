              Committee regarding deceptive marketing and misaligned broker incentives in Medicare Advantage,
              positioning Chapter as a reform-aligned operator. Nevertheless, potential CMS regulatory interventions to
              cap carrier distribution fees or restrict Medicare Advantage payment benchmarks present structural margin
              risks that demand rigorous data room verification of renewal cash flows.
            claimRefs:
              - CI001
              - CI005
              - CI010
              - CI014
