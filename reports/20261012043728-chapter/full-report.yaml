      - number: '5.2'
        title: Customer Workflows and Enterprise Use Cases
        blocks:
          - type: paragraph
            body: >-
              Chapter's operating model centers on multi-touch consultative workflows tailored to retiring individuals,
              wealth management advisory clients, and healthcare system patients. When an individual initiates a
              consultation, Chapter's licensed Medicare advisors utilize an internal AI copilot tool that ingests the
              consumer's preferred physicians, active prescription medications, and budget preferences to produce an
              objective plan recommendation. Crucially, Chapter enforces an institutional compensation policy that pays
              advisors uniform salaries regardless of which plan the beneficiary chooses or whether Chapter earns a
              carrier commission, creating operational alignment with consumer welfare. For wealth management firms and
              registered investment advisors, Chapter provides dedicated partner portals where financial planners can
              refer retiring clients without violating insurance licensing rules or navigating carrier conflicts.
              Similarly, Chapter partners with regional health systems and academic medical centers to ensure patients
              transition to Medicare plans that preserve in-network physician and hospital continuity, minimizing
              administrative friction and care disruption.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
