        title: Capital Adequacy, Valuation, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Chapter strengthened its balance sheet in April 2026 by completing a $100 million Series E financing round
              led by Generation Investment Management, supported by Fifth Down Capital, 8VC, Stripes, XYZ Venture
              Capital, Addition, Narya Capital, Susa Ventures, and Maverick Ventures. This transaction brought total
              equity funding raised to approximately $284 million and established a post-money valuation of $3.0
              billion, double its $1.5 billion Series D valuation from April 2025. While Chapter's capital adequacy
