        title: Capability and Trust Positioning
        blocks:
          - type: paragraph
            body: >-
              Chapter says it evaluates more than 24,000 Medicare plans, pays advisors the same regardless of the
              recommended plan, and will recommend a plan even when the carrier does not compensate Chapter. It also
              describes proprietary provider, prescription, benefit, and price data pipelines plus ongoing
              post-enrollment advocacy. Together, these features address search completeness, incentive alignment, and
              continuity of support rather than competing only on enrollment convenience. The caveat is material: most
              detailed capability evidence is company-issued, including Chapter's comparison of other brokers and public
              tools. The independent retained sources discuss funding, growth, and distribution, but do not benchmark
