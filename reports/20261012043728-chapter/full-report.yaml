            title: Differentiation is a system, not a single feature
            body: >-
              The disclosed advantage combines plan breadth, data normalization, advisor incentives, institutional
              distribution, and post-enrollment support. Copying one component would not reproduce the full operating
              model.
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
              - CP014
          - type: callout
            title: Independent outcome proof is missing
            body: >-
              Funding and growth reporting validate market momentum, not recommendation quality. No retained independent
              benchmark compares Chapter with named rivals on savings, plan fit, retention, or service outcomes.
            calloutType: risk
            claimRefs:
