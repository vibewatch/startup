  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Overview and Modular Capabilities
        blocks:
          - type: paragraph
            body: >-
              Chapter delivers a technology-driven Medicare navigation platform that combines automated algorithmic plan
              matching with human advisor consultations to guide older Americans through healthcare coverage decisions.
              The product catalog spans consumer-facing web tools, licensed advisor workflow applications, partner
              integration portals, and post-enrollment benefit retention applications. Central to Chapter's core
              platform is its plan comparison engine, which evaluates all Medicare Advantage, Medicare Supplement, Part
              D prescription drug plans, and Special Needs Plans nationwide rather than restricting search options to
              contracted carriers that pay enrollment commissions. To support consumer decision-making beyond basic plan
              selection, Chapter expanded its functional capabilities in 2024 with the launch of its Over The Counter
              (OTC) mobile application, which allows members to scan their physical insurance cards and instantly
              discover eligible supplemental benefit allowances that frequently go unused. In 2026, backed by Series E
              capital, Chapter deployed upgraded national provider directory parsing tools and prescription cost
              calculators to improve network matching fidelity across fragmented healthcare systems.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
