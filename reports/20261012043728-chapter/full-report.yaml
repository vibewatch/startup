      - number: '5.3'
        title: Technical Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The technological architecture supporting Chapter's platform is structured across six primary operational
              layers, transitioning from external regulatory standards and data ingestion pipelines to frontline advisor
              interfaces and consumer applications. At the ingestion tier, Chapter processes annual Centers for Medicare
              & Medicaid Services (CMS) plan benefit packages, provider directories, and carrier formularies to
              establish a comprehensive data repository. Because public resources such as Medicare.gov Plan Finder lack
              integrated provider network APIs and detailed supplemental benefit data, Chapter engineers proprietary
              parsing algorithms to normalize doctor network statuses and prescription copays across disparate insurer
              databases. On top of this data core, Chapter operates its multi-factor recommendation engine and advisor
              copilot tools, which guide licensed advisors through telephonic consultations with real-time prompt
              generation and plan rule verification. Following its $100 million Series E funding in April 2026, Chapter
              has directed engineering capital toward expanding this AI-native trust layer and extending its operating
              model into broader retirement financial products.
            claimRefs:
              - CE009
              - CE010
              - CE012
              - CE013
