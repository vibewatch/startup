        title: Exhibits
        blocks:
          - type: callout
            title: Fiduciary Alignment as a Distribution Catalyst
            body: >-
              Chapter's salaried advisor structure and willingness to recommend non-commission plans create a
              significant trust advantage over traditional lead-generation brokers. By eliminating agent-level
              commission incentives, Chapter secures lower-cost distribution through prestigious institutional wealth
              management partners like Raymond James and Wealthspire Advisors.
            calloutType: insight
            claimRefs:
              - CI011
              - CI012
