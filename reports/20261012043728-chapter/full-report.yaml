  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Industry Scope
        blocks:
          - type: paragraph
            body: >-
              Medicare navigation operates at the intersection of consumer health decisions, regulated insurance
              brokerage, and digital advisory software. Over 65 million Americans navigate the Medicare system,
              selecting among Medicare Advantage, Medicare Supplement (Medigap), and standalone Part D prescription drug
              plans. The decision environment is characterized by extreme fragmentation, with more than 24,000 distinct
              plan options offered across geographic counties nationwide. Although federal tools such as the
              Medicare.gov Plan Finder exist, they lack comprehensive physician network integration and detailed
              evaluations of ancillary benefits like dental, vision, and hearing coverage. Consequently, between 30% and
              50% of beneficiaries seek assistance from licensed agents or brokers to navigate coverage choices,
              establishing a massive addressable service market. Chapter defines its market boundary around full-market
              navigation and advisory, consciously separating its fiduciary-style guidance from speculative
              non-healthcare lead sales and direct medical claim adjudication.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
      - number: '2.2'
        title: Addressable Market Sizing and Penetration Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the Medicare advisory and navigation market requires evaluating multiple structural layers rather
              than relying on a single top-line estimate. The broadest demographic foundation encompasses 65 million
              eligible beneficiaries, bolstered by an aging demographic tailwind of approximately 10,000 seniors aging
              into Medicare eligibility each day. Within this population, the serviceable addressable market of
              agent-assisted enrollees spans 19.5 million to 32.5 million seniors. Beyond core plan enrollment, an
              estimated $5 billion in annual over-the-counter and ancillary healthcare benefits goes unredeemed due to
              plan complexity, creating a sizable software and engagement opportunity. The broader Healthcare Payer Tech
              sector in the United States captured $540 million in venture funding through 2026 across 442 tracked
              competitors. At the company level, Chapter reported crossing $100 million in annual recurring revenue
              following a year of tripling revenue during 2025, demonstrating rapid market capture within its targeted
              enterprise and consumer segments.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
