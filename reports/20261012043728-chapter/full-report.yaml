      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Asymmetry Between Unbiased Plan Recommendations and Commission Revenues
            body: >-
              Chapter's commitment to search and recommend every Medicare plan—even those that do not pay Chapter a
              commission—is its key consumer differentiator. However, this creates a structural financial risk: as
              Chapter scales, any shift in beneficiary enrollments toward non-commissioned plans increases advisor
              operating costs without generating offsetting revenue, exposing the firm to carrier contract leverage.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR015
          - type: callout
            title: Regulatory Alignment as an Adverse Shield
            body: >-
              While Medicare Advantage marketing is subject to escalating regulatory enforcement, Chapter's proactive
              advocacy for consumer-first fiduciary standards and transparent data models positions the company to
              benefit if CMS tightens restrictions on predatory third-party lead generation.
            calloutType: insight
            claimRefs:
