      - number: '1.4'
        title: Operating Milestones, Product Roadmap, and Technical Capabilities
        blocks:
          - type: paragraph
            body: >-
              Since launching in 2020, Chapter has executed an aggressive product roadmap that expanded its scope from
              direct-to-consumer Medicare plan comparison into enterprise B2B2C distribution and supplemental senior
              financial applications. Key operational milestones include national 50-state licensing in 2021, Series B
              scaling in 2022, congressional testimony before the U.S. Senate Finance Committee in 2023 on curbing
              deceptive third-party lead generation, and the 2024 launch of an Over The Counter benefits mobile
              application enabling beneficiaries to access underutilized wellness benefits. The company has also
              structured distribution partnerships with wealth management firms and healthcare systems to provide
              embedded advisory workflows. In evaluating external technical posture, an independent review by APIs.io
              highlighted that Chapter currently maintains zero public developer APIs and received a minimal Kin Score
              of 8.9 out of 100, reflecting its focus as an advisor-mediated consumer health service rather than an open
              developer platform. Diligence asks must focus on verifying private carrier retention metrics and
              commission sustainability.
