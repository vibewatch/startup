      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Chapter's strongest defensibility case is the combined system rather than any single feature: broad plan
              search, proprietary data normalization, aligned advisor incentives, institutional distribution, and
              support after enrollment. Its 2026 Series E and reported post-money valuation indicate substantial
              resources to extend that system, but capital is not proof of superior outcomes. There is also a credible
              commoditization path. Chapter itself advocates for more transparent and accessible provider, formulary,
              benefit, and pricing data; if those inputs become easier for public tools and competitors to use, part of
              the data-aggregation advantage could narrow. Durable differentiation would then depend more heavily on
              execution, trusted distribution, advisor quality, and independently demonstrated member outcomes.
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP014
              - CP015
              - CP016
