      - number: '7.2'
        title: AI Platform Scaling, Plan Data Ingestion, and Execution Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              The core value proposition of Chapter rests on comparing every Medicare plan nationwide across tens of
              thousands of variables, including carrier networks, formularies, and supplemental benefits. Ingesting and
              reconciling volatile benefit structures from thousands of local Medicare Advantage and Part D plans
              creates severe operational and technical failure modes. A corrupted directory, stale formulary file, or
              flawed prescription calculator recommendation can cause a beneficiary to lose physician access or face
              catastrophic out-of-pocket costs. Furthermore, scaling an AI-native platform while keeping corporate
              headcount flat at approximately 30 corporate employees introduces key-person and technical infrastructure
              bottlenecks during peak annual enrollment periods.
            claimRefs:
              - CR003
              - CR008
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR008
              - CR010
              - CR011
      - number: '7.3'
        title: Carrier Commission Concentration, Valuation Expectations, and Growth Dependencies
        blocks:
          - type: paragraph
            body: >-
              Chapter relies fundamentally on enterprise distribution partnerships with health systems, wealth
              advisories, and retail pharmacy partners for OTC benefit redemptions. Financially, Chapter earns
              commissions when beneficiaries enroll in plans from contracted carriers, despite paying its advisors fixed
              compensation regardless of plan recommendation. This creates counterparty dependency where carrier
              commission compression or consolidation among major Medicare Advantage sponsors directly threatens revenue
              growth. Furthermore, closing a $100M Series E round at a $3B valuation more than doubles Chapter's prior
              valuation mark, setting demanding exit hurdles and ARR expansion requirements amid volatile healthcare
              policy cycles.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR012
              - CR013
              - CR015
