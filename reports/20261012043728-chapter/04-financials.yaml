callouts:
  - calloutType: "insight"
    title: "Fiduciary Alignment as a Distribution Catalyst"
    body: "Chapter's salaried advisor structure and willingness to recommend non-commission plans create a significant trust advantage over traditional lead-generation brokers. By eliminating agent-level commission incentives, Chapter secures lower-cost distribution through prestigious institutional wealth management partners like Raymond James and Wealthspire Advisors."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"

  - calloutType: "risk"
    title: "Carrier Commission Dependency and Regulatory Margin Pressure"
    body: "Despite Chapter's consumer-first positioning, its underlying revenue model remains heavily reliant on statutory carrier commissions. Regulatory shifts by CMS to cap broker fees, ban third-party lead reselling, or alter Medicare Advantage rate structures could pressure unit economics and renewal margins across the sector."
    claimRefs:
      - "CI004"
      - "CI014"

