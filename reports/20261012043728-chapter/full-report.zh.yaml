      - number: '1.3'
        title: 融资历程、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              自 2020 年成立以来，Chapter 在六轮机构融资中累计筹集约 86 million 股权融资，显示风险资本对软件驱动 Medicare 分销的强烈信心。2026 年 4 月，公司完成由
              Generation Investment Management 领投的标志性 00 million Series E 融资；Fifth Down Capital 和 8VC 新加入，既有投资方
              Stripes、Addition、XYZ Venture Capital、Narya Capital、Susa Ventures 和 Maverick Ventures 也继续参与。Series E 使
              Chapter 的投后估值达到估计 .0 billion，较 Stripes 于 2025 年初领投的 5 million Series D 所确立的资本化基准翻倍有余。估值扩张伴随快速的财务表现：公司称
              2025 年收入增长三倍，ARR 超过 00 million，而公司员工数基本持平。不过，Chapter
              是一家股权高度集中的特拉华州私人公司，股份类别清算优先权瀑布、期权池稀释和确切的收入确认机制等最终条款仍属于未披露的私有信息。
