  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与运营规模
        blocks:
          - type: paragraph
            body: >-
              Chapter 的核心投资论点，是借助 AI 驱动、受托式导航平台，改造 Medicare 计划选择。传统 Medicare 经纪商依靠与承保方挂钩的佣金，激励经纪人把受益人引向高支付计划。Chapter
              则雇用薪资制持牌 Medicare 顾问，顾问报酬不因计划选择或承保方签约状态而变化。公司报告称，2025 年 ARR 超过 $100 million，较上一年增长 3x；增长来自能够评估全国全部 24,000
              个 Medicare Advantage、Medicare Supplement 和 Part D 计划的专有数据基础设施。Chapter
              还通过覆盖主要医疗系统、退休咨询网络和理财公司的高效率企业合作伙伴，补充直接消费者获客，并取得低于传统经纪网络的流失率和更强会员留存。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
