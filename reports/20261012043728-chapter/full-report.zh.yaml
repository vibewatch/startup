      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 激励一致性与顾问中立性
            body: >-
              传统 Medicare 经纪商依靠差异化佣金结构，推荐往往偏向高支付的 Medicare Advantage 承保方。Chapter
              通过向顾问支付统一薪资，并搜索所有可用计划（包括不支付佣金的选项），再辅以算法计划匹配软件，从结构上中和这一偏差。
            calloutType: insight
            claimRefs:
              - CO004
              - CO005
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与行业范围
        blocks:
          - type: paragraph
            body: >-
              Medicare 导航处在消费者医疗决策、受监管保险经纪和数字咨询软件的交汇处。超过 65 million 美国人需要使用 Medicare 系统，在 Medicare Advantage、Medicare
              Supplement（Medigap）和独立 Part D 处方药计划之间选择。决策环境高度碎片化：全国各地县域提供超过 24,000 个不同计划。虽然存在 Medicare.gov Plan Finder
              等联邦工具，但它们缺乏完整的医生网络整合，也不能细致评估牙科、视力和听力等附加福利。因此，30% 至 50% 的受益人会寻求持牌代理或经纪人的帮助，形成巨大的可服务市场。Chapter
              将市场边界定义为全市场导航与咨询，并有意把其受托式指导与投机性的非医疗获客销售及直接处理医疗保险理赔主张审核分开。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
      - number: '2.2'
        title: 可触达市场规模与渗透视角
        blocks:
          - type: paragraph
            body: >-
              评估 Medicare 咨询和导航市场，需要拆解多个结构层次，而不是依赖单一的总量估计。最宽泛的人口基础包括 65 million 名符合资格的受益人；人口老龄化每天约新增 10,000 名达到 Medicare
              资格的老年人，进一步推高需求。在这一人群中，由代理协助投保者构成的可服务可触达市场约为 19.5 million 至 32.5 million 名老年人。除核心计划投保外，由于计划复杂，每年约 $5
              billion 的非处方药及附加医疗福利未被兑换，形成可观的软件和用户参与机会。美国更广义的 Healthcare Payer Tech 行业截至 2026 年从风险投资中获得 $540 million，覆盖
              442 家被跟踪的竞争者。就公司自身而言，Chapter 称其在 2025 年收入增长三倍后，ARR 已突破 $100 million，显示其在目标企业和消费者细分市场中快速获取份额。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
