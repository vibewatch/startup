      - number: '7.2'
        title: AI 平台扩张、计划数据摄入与执行脆弱性
        blocks:
          - type: paragraph
            body: >-
              Chapter 的核心价值主张，是在全国比较每个 Medicare 计划，覆盖承保方网络、药品目录和补充福利等数万个变量。摄入并协调数千个本地 Medicare Advantage 和 Part D
              计划不断变化的福利结构，会产生严重的运营和技术故障模式。损坏的目录、过时的药品目录文件或有缺陷的处方计算器推荐，可能让受益人失去医生就诊资格，或承担灾难性的自付费用。此外，在公司员工数约 30
              人且基本不变的情况下扩展 AI 原生平台，会在年度投保高峰期造成关键人员和技术基础设施瓶颈。
            claimRefs:
