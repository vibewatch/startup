          value: 100
          unit: USD M ARR
          detail: 2025 年增长加速后的公开年度经常性收入运行率
    approximationNotes: 顾问协助人口采用经估算的 30% 至 50% 经纪人使用率区间中点 40%。年度达到资格年龄的人口按每天 10,000 名退休者、持续 365 天计算。收入运行率和行业融资数字反映截至 2026 年最新披露的估算。
    claimRefs:
      - CM001
      - CM003
      - CM008
      - CM011
      - CM013
  - id: FP001
    title: 竞争定位图：搜索广度与支持连续性
    type: quadrant
    summary: 分析师按 1-5 级进行序数定位：x 轴代表已披露的跨计划搜索广度，y 轴代表已披露的人工支持连续性。
    data:
      points:
        - label: Chapter
          x: 5
          'y': 5
          detail: 公司披露称其提供全市场搜索，以及持续的顾问和倡导者支持。
        - label: 全国经纪商类别
          x: 2
          'y': 3
          detail: Chapter 称其签约保险公司的选择范围更窄；具名服务提供方的支持连续性尚未得到证实。
        - label: 本地代理人类别
          x: 2
          'y': 4
          detail: 人际服务连续性可能较高，但在本证据集中，计划广度尚无独立证据。
        - label: Medicare.gov
          x: 5
          'y': 1
          detail: 提供广泛的公开计划信息，但据 Chapter 称不存在持续的持牌顾问关系。
        - label: SHIP
          x: 3
          'y': 2
          detail: 非商业咨询替代方案；本处未量化项目层面的广度和连续性。
        - label: 直接保险公司 / 自主选择
          x: 1
          'y': 1
          detail: 按保险公司指定或手动操作的路径，需要受益人或家属自行整理比较结果。
    approximationNotes: 坐标是定性的序数评分，不是实测市场数据。它们综合了保留的披露；由于没有独立的正面对比基准，竞争者点位的置信度较低。
    claimRefs:
      - CP010
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: 收入模型与资本转化流程
    type: flow
    summary: 展示老年会员参与和无偏计划评估如何转化为保险公司佣金收入及运营杠杆的工作流。
    data:
      nodes:
        - id: n1
          label: 老年人咨询
          description: 老年人直接联系 Chapter，或通过机构 B2B 财务顾问合作伙伴联系 Chapter。
        - id: n2
          label: 全市场评估
          description: AI 辅助引擎分析全国全部 24,000+ 个 Medicare 选项，覆盖医生网络和药品目录。
        - id: n3
          label: 无偏计划推荐
          description: 薪资制顾问不考虑保险公司合同或潜在佣金支付，推荐最优计划。
        - id: n4
          label: 保险公司保单投保
          description: 会员加入选定计划；Chapter Advisory LLC 作为登记在案的持牌代理机构。
        - id: n5
          label: 保险公司佣金支付
          description: 签约保险公司按法定标准向 Chapter 支付初始佣金和每年续期佣金。
        - id: n6
          label: 福利使用与留存
          description: Chapter 会员倡导者协助持续的医疗导航和 OTC 卡福利兑换。
    claimRefs:
      - CI004
      - CI011
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Chapter Medicare 顾问平台的六层架构图，展示从合规到消费者应用的端到端流程。
    approximationNotes: 层级抽象与功能边界综合自已发布的平台描述、高管证词和监管要求。
    claimRefs:
      - CE001
      - CE005
      - CE009
      - CE013
    data:
      layers:
        - label: 消费者参与与移动层
          detail: 适合老年人使用的门户网站、咨询预约引擎和移动 OTC 福利卡扫描器。
        - label: 企业与合作伙伴集成层
          detail: 面向财富管理机构的 B2B2C 转介门户、医疗系统接入工作流和联合品牌落地页面。
        - label: 顾问工作流与 Copilot 系统
          detail: 电话顾问指导界面、实时处方和医生检查工具，以及 CRM 通话记录。
        - label: 算法决策与评分引擎
          detail: 多参数匹配引擎按预计总成本、网络广度和药品保障对计划选项排序。
        - label: 数据导入与标准化核心
          detail: 自动化管道解析 CMS 计划福利包、保险公司药品目录和医院网络目录。
        - label: 监管合规与安全底座
          detail: 持牌代理机构治理、CMS 通话录音存档、同意管理和严格的 HIPAA 数据保护。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示老年人发现服务、顾问协助计划评估、投保和持续福利倡导的六阶段旅程图。
    data:
      items:
        - label: 1. 认知与合作伙伴转介
          touchpoints:
            - AARP 联合品牌落地页
            - 财富顾问介绍
            - 医疗系统出院宣传单
        - label: 2. 接入与偏好采集
          touchpoints:
            - 在线输入药品
            - 医生网络检查
            - 健康与财务优先事项采集
        - label: 3. 全面计划比较
          touchpoints:
            - 搜索自有数据库中的 24,000+ 个计划
            - 算法总成本分析
            - 药品目录层级核验
        - label: 4. 薪资制顾问咨询
          touchpoints:
            - 持牌顾问电话咨询
            - 符合受托人标准的审阅
            - 无偏、无压力指导
        - label: 5. 数字申请与投保
          touchpoints:
            - 符合 CMS 要求的电子签名
            - 提交保险公司申请
            - 确认投保状态
        - label: 6. 终身投保后倡导
          touchpoints:
            - 兑换非处方福利
            - 事先授权申诉
            - 年度保障检查
    approximationNotes: 根据公开平台披露和顾问服务描述，展示标准客户工作流。
    claimRefs:
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: 风险严重程度与缓解矩阵
    type: matrix
    summary: 从影响、可能性和缓解成熟度三个维度评估 Chapter 面临的主要运营、监管和商业风险。
    data:
      columns:
        - 可能性
        - 影响严重程度
        - 缓解成熟度
        - 残余暴露
      rows:
        - label: 保险公司佣金重构
          values:
            - 中
            - 严重
            - 部分
            - 高
        - label: CMS 对经纪人的监管收紧
          values:
            - 高
            - 高
            - 先进
            - 中
        - label: 计划数据导入不准确
          values:
            - 高
            - 高
            - 中等
            - 高
        - label: 企业合作伙伴流失
          values:
            - 低
            - 高
            - 中等
            - 中
        - label: 估值倍数压缩（$3B Series E）
          values:
            - 中
            - 高
            - 初期
            - 高
        - label: AEP 运营高峰拥堵
          values:
            - 中
            - 中
            - 先进
            - 低
    approximationNotes: 可能性、严重程度和成熟度是基于公司披露的财务数据、监管文件和合作伙伴结构综合形成的尽调评估。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR006
      - CR010
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将 Chapter 的收入增长、分销模式、资本结构和偏高估值倍数连接至 track 建议的决策架构。
    data:
      nodes:
        - id: scale
          label: 运营规模
          detail: 2025 年 ARR 超过 $100M，收入增长 3 倍
        - id: partnerships
          label: 分销优势
          detail: 与医疗系统和财务顾问机构建立企业合作
        - id: capitalization
          label: Series E 资本化
          detail: Generation Investment Management 领投 $100M 轮，估值 $3.0B
        - id: multiple
          label: 估值溢价
          detail: 隐含 ARR 倍数为 30 倍，而公开经纪商可比公司为 2.5x–5.0x
        - id: opacity
          label: 信息不对称
          detail: GAAP 盈利能力未获确认，且清算优先权结构为私有信息
        - id: decision
          label: Track 建议
          detail: 在单位经济模型和估值重新匹配前，维持 track 立场
      edges:
        - from: scale
          to: partnerships
        - from: partnerships
          to: capitalization
        - from: capitalization
          to: multiple
        - from: multiple
          to: opacity
        - from: opacity
          to: decision
    approximationNotes: 根据公开估值指标和运营披露综合形成的分析决策流程。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV009
      - CV013
