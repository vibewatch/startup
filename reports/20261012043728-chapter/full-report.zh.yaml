        title: 展示项
        blocks:
          - type: callout
            title: 估值偏高，建议持续跟踪
            body: >-
              Chapter 达到 $100M ARR，已展现出极强的商业牵引力；但 $3.0B Series E 估值对应激进的 30x ARR 倍数。若没有经审计的 GAAP
              经营盈利或单位贡献利润率确认，就很难为立即投入资本找到充分理由。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV013
          - type: callout
            title: 公开可比公司估值压缩风险
            body: 公开交易的 Medicare 经纪商市销率为 2.5x 至 5.0x。若未来上市或因下轮融资重新定价，而市场把 Chapter 视为保险分销商而非纯软件企业，公司将面临显著的倍数压缩风险。
            calloutType: risk
            claimRefs:
