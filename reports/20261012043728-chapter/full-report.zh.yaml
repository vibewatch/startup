      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Chapter 最有力的防御性并非单一功能，而是由广泛计划搜索、专有数据标准化、顾问激励一致、机构分销和投保后支持组成的系统。2026 年 Series E
              和据报道的投后估值表明，公司有充足资源继续扩展这套系统，但资本并不能证明结果更优。市场也存在可信的商品化路径。Chapter
