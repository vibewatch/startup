      - number: '8.2'
        title: 融资历史与估值纪律
        blocks:
          - type: paragraph
            body: >-
              自 2020 年成立以来，Chapter 通过六轮融资累计筹集 $285 million 股权资本。2026 年 4 月，公司获得由 Generation Investment Management 领投的
              $100 million Series E，Fifth Down Capital、8VC、Stripes、Addition、Narya Capital、Susa Ventures 和 Maverick
              Ventures 参与。Series E 建立了 $3.0 billion 投后估值，较 Chapter 在 2025 年 4 月 $75 million Series D 时确立的 $1.5 billion
              估值翻倍有余。收入增长虽然迅速，但隐含的 30x ARR 入场倍数与 GoHealth、SelectQuote 等公开医疗分销可比公司的估值明显不同，后者的市销率在 2.5x 至 5.0x
              之间。此外，上市公司数据库记录的 2025 年收入为 $70.7 million，却没有确认 GAAP 经营盈利；Series A 至 E 的高级清算优先权也仍未披露。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV011
              - CV012
      - number: '8.3'
        title: 建议、风险评级与尽调路径
        blocks:
          - type: paragraph
            body: >-
              我们给予 Chapter “持续跟踪”的总体建议，置信度为中等，风险评级为高，估值判断偏高。公司在数字健康领域执行力突出，在保持公司员工数不变的同时扩大 AI 支持的顾问基础。不过，以 30x ARR
              倍数投入资本，会让投资者在上市或监管干预 Medicare 经纪人薪酬导致收入倍数压缩时面临严重下行风险。在乐观情景下，扩展非处方福利和综合退休财富咨询，可能支持 2028 年 $5.0B 至 $6.0B
              的估值。相反，基准情景显示，在软件服务正常化倍数下，估值区间可能为 $2.5B 至 $3.2B。管理层表示 IPO
              或流动性退出并非眼下重点，因此在上调建议前，必须取得经审计的贡献利润率、队列续期经济性和股权结构表清算条款。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
