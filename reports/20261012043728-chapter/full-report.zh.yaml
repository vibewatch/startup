chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              Chapter 是一家技术驱动的医疗健康导航平台和持牌保险咨询机构，专门帮助老年人应对 Medicare 保障的复杂性。公司法律实体为 Memoir, Inc.，保险经纪业务由其全资子公司 Chapter
              Advisory, LLC 运营；持牌咨询业务覆盖美国全部 50 个州，主要公司总部位于纽约市 19 Union Square West。传统佣金驱动的保险机构通常与少数 Medicare Advantage
              承保方签约，收入激励也会把推荐导向这些承保方；Chapter 则采用不同模式，雇用薪资制 Medicare 顾问，无论受益人选择哪种保险计划，顾问获得的报酬都相同。平台在全国搜索并比较超过 24,000 个
              Medicare 计划，覆盖 Medicare Supplement、Medicare Advantage 和 Part D 处方药选项，也明确纳入不向 Chapter
              支付佣金的计划。这套与受托原则一致的指导机制直面行业中已有记录的经纪机构利益冲突，把专有算法搜索工具与个性化咨询结合起来，减少搜索摩擦，压低退休老人的自付医疗支出。
            claimRefs:
