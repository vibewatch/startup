      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 无偏计划推荐与佣金收入之间的不对称
            body: >-
              Chapter 承诺搜索并推荐每一个 Medicare 计划，即使计划不向 Chapter 支付佣金，这也是其关键消费者差异化。但这会带来结构性财务风险：随着 Chapter
              扩张，若受益人投保转向非佣金计划，顾问运营成本会上升，却没有相应收入，令公司暴露于承保方合同议价压力。
