      - number: '2.3'
        title: 买方细分与合作伙伴主导的分销
        blocks:
          - type: paragraph
            body: >-
              Chapter 的市场进入策略与依赖电视广告和电话营销获客的传统直面消费者 Medicare 经纪商明显不同。Chapter 优先采用 B2B2C
              分销模式，把导航平台嵌入受信任的企业机构，包括区域医疗系统、学术医疗中心、注册投资顾问机构和面向老年人的数字出版商。医疗系统与 Chapter 合作，确保患者继续看偏好的医生并保持照护连续性；财富管理机构则借助
              Chapter 提供客观的退休医疗规划，不收取服务费。终端消费者无需为咨询服务付费，参与的企业合作伙伴也无需支付集成费。Chapter
              在受益人选择投保时收取标准化的保险承保方佣金，同时通过固定薪酬结构让雇用的顾问不受佣金差异影响。Chapter 声称其流失率比传统经纪商平均水平低 5x，但按渠道划分的持续率曲线仍属私有信息。
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM007
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动、监管变化与约束
        blocks:
          - type: paragraph
            body: >-
              市场采用受到 Medicare 计划选项极度复杂和监管部门日益审查传统经纪业务的双重推动。传统经纪人通常只搜索本地可用计划的 10% 至
              15%，并受不同承保方佣金表激励，导致普遍性的引导式推荐。随着消费者投诉增加，美国司法部对三家大型 Medicare
              经纪商的欺骗性做法展开执法行动；美国医疗保险和医疗补助服务中心则推出更严格的营销规则，禁止获客平台同时向多个买方转售老年人联系数据。这些监管顺风明显利好能够评估完整计划版图的透明、技术驱动咨询平台。不过，老年人对数字工具的犹豫、根深蒂固的本地代理关系，以及
              Chapter 长期变现仍依赖保险承保方佣金表，都会限制采用。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不透明分销生态中的受托定位
            body: >-
              Chapter 最主要的结构性差异，在于把顾问薪酬与承保方佣金差异拆开。传统经纪商因把老年人引向高佣金计划而受到审查和监管打击；Chapter 的薪资制顾问模式和 24,000
              计划推荐引擎，则让指导与老年人的医疗需求保持一致。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
          - type: callout
            title: 监管逆风与承保方佣金依赖
            body: 尽管 Chapter 将自己定位为无偏见的倡导者，其核心收入模式仍依赖保险承保方佣金。CMS 收紧营销规则和获客限制后，任何改变承保方佣金表或经纪人薪酬的政策变化，都会对收入端经济性构成重大风险。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM010
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              买方可以通过多条路径解决 Medicare 导航：Chapter、全国或本地保险经纪商、Medicare.gov 和 State Health Insurance Assistance
              Programs、承保方直销网站，或在家人帮助下自行比较。Chapter 自身材料把关键分界定义为：顾问是否审查完整计划市场，以及薪酬是否会影响推荐。其 CEO
              在参议院作证时也描述了在提供商网络数据碎片化的情况下比较各承保方网站的实际负担。这是一张有用的市场地图，但不是独立的竞争者普查：现有证据没有包含当前、具名竞争者的资料，也没有可比的融资、投保、留存或保障统计。
            claimRefs:
