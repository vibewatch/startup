      - number: '1.2'
        title: 创始人、管理层与治理架构
        blocks:
          - type: paragraph
            body: >-
              Chapter 由 CEO Cobi Blumenfeld-Gantz、COO Corey Metzman 和顾问 Ari Parker 于 2020 年共同创立，创始灵感来自他们亲身经历的 Medicare
              投保障碍、承保方激励不透明和计划行政错误。Blumenfeld-Gantz 曾在 Palantir Technologies 任职五年，负责美国政府客户部署，带来企业级政府软件经验，也塑造了 Chapter
              对计划比较中数据整合和技术严谨性的重视。Corey Metzman 负责机构扩张、持牌顾问招聘和承保方关系；Ari Parker 担任首席顾问和消费者权益倡导者，撰写了广泛传播的 Medicare
              决策教育材料。公司治理和战略监督由知名董事及风险投资支持者参与，包括 PayPal 和 Palantir 联合创始人 Peter Thiel、前美国卫生与公众服务部长 Donna
              Shalala，以及早期轮次的机构投资负责人。公司采用高效的人力资本模式：纽约约 30 名公司及工程员工，加上全国分布的约 150 名薪资制远程持牌顾问，全年为会员提供支持。
            claimRefs:
