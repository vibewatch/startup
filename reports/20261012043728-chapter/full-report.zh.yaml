      - number: '3.2'
        title: 能力与信任定位
        blocks:
          - type: paragraph
            body: >-
              Chapter 称其评估超过 24,000 个 Medicare 计划，无论推荐哪种计划都向顾问支付相同报酬，即使承保方不向 Chapter
              付费也会推荐该计划。公司还介绍了自有的提供商、处方药、福利和价格数据管道，以及持续的投保后倡导服务。综合来看，这些能力解决的是搜索完整性、激励一致性和支持连续性，而不只是投保便利性。需要注意的是，大部分细致能力证据来自公司自身，包括
              Chapter 对其他经纪商和公共工具的比较。独立保留来源讨论了融资、增长和分销，却没有把推荐准确率、消费者节省、计划匹配度或流失率与具名竞争者进行基准比较。
            claimRefs:
