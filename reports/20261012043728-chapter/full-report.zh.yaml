        title: 定价、产品组合与分销能力
        blocks:
          - type: paragraph
            body: >-
              Chapter
              披露其服务对受益人免费，公司可能收取承保方佣金；个别顾问无论推荐哪种计划都获得相同报酬。公开证据没有披露企业合作伙伴定价、承保方合同经济性、实际佣金组合、折扣或具名竞争者的可比价格。分销方面的证据更充分：Fierce
              Healthcare 报道称，Chapter 很少投放直面消费者广告，而是通过医疗系统、金融机构和内容网站开展业务；Chapter
              自身材料也描述了相同的合作伙伴类别。这种嵌入式渠道可以降低对消费者获客购买的依赖，但合作伙伴集中度和渠道经济性仍属私有信息。
