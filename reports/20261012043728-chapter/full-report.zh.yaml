            body: >-
              Chapter 在 Medicare Advantage 和 Part D 分销市场运营 Memoir, Inc. 及其持牌子公司 Chapter Advisory
              LLC，该市场受到联邦和州层面的严格监管。Centers for Medicare and Medicaid Services（CMS）执行严格的营销和获客规定，旨在限制掠夺式引导和误导性的第三方广告。正如
              CEO Cobi Blumenfeld-Gantz 在参议院财政委员会作证时所详述，联邦审查已针对欺骗性获客商和激进的经纪商做法。Chapter
              倡导消费者优先的受托标准和所有计划的统一比较，但任何收紧电话投保、电子同意、交叉销售或经纪人薪酬限制的监管变化，都会让全部 50 个州面临直接合规风险。
            claimRefs:
