      - number: '1.4'
        title: 运营里程碑、产品路线图与技术能力
        blocks:
          - type: paragraph
            body: >-
              自 2020 年上线以来，Chapter 按激进的产品路线图推进业务，从直接面向消费者的 Medicare 计划比较，扩展到企业 B2B2C 分销和面向老年人的补充金融应用。关键运营里程碑包括 2021
              年取得全国 50 州牌照、2022 年通过 Series B 扩张、2023 年在美国参议院财政委员会就遏制欺骗性第三方获客作证，以及 2024 年推出 Over The Counter
              福利移动应用，让受益人能够使用此前闲置的健康福利。公司还与财富管理机构和医疗系统建立分销合作，为其提供嵌入式咨询工作流。在外部技术状况评估中， APIs.io 的独立审查指出，Chapter 目前没有公开开发者
              API，Kin Score 仅为 8.9 / 100，说明其定位是顾问介导的消费者医疗服务，而非开放的开发者平台。尽调应重点核实私有的承保方留存指标和佣金可持续性。
            claimRefs:
