      - number: '7.3'
        title: 承保方佣金集中度、估值预期与增长依赖
        blocks:
          - type: paragraph
            body: >-
              Chapter 根本上依赖与医疗系统、财富咨询机构和零售药房伙伴建立企业分销合作，以兑换 OTC 福利。财务上，受益人投保签约承保方计划时 Chapter
              才会获得佣金，尽管顾问无论推荐哪种计划都领取固定薪酬。因此，公司形成交易对手依赖：主要 Medicare Advantage 发起方压缩佣金或进行整合，会直接威胁收入增长。此外，以 $3B 估值完成 $100M
              Series E 使 Chapter 之前的估值翻倍以上，在医疗政策周期波动之际，对退出和 ARR 扩张提出更高要求。
