        - label: "Local agent class"
          x: 2
          y: 4
          detail: "Personal continuity can be high, but plan breadth is not independently established in this evidence set."
        - label: "Medicare.gov"
          x: 5
          y: 1
          detail: "Broad public plan information with no ongoing licensed-advisor relationship according to Chapter."
        - label: "SHIP"
          x: 3
          y: 2
          detail: "Non-commercial counseling substitute; program-level breadth and continuity are not quantified here."
        - label: "Direct carrier / self-directed"
          x: 1
          y: 1
          detail: "Carrier-specific or manual route requiring the beneficiary or family to assemble comparisons."
    approximationNotes: "Coordinates are qualitative ordinal scores, not measured market data. They synthesize the retained disclosures; competitor points are low-confidence because no independent head-to-head benchmark was available."
