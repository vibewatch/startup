callouts:
- calloutType: insight
  title: The strongest public financial signal is expansion, not margin quality
  body: Aether’s reported 94% retention, 158% NRR, and rapid MRR growth point to genuine commercial traction, but they do not answer whether that growth is efficient or software-like at the gross-margin line.
  claimRefs:
  - CI008
  - CI009
  - CI018
  - CI031
- calloutType: risk
  title: The round size does not eliminate financing risk without burn data
  body: A $250 million raise is meaningful, but without post-close cash, burn, and budget timing, investors cannot know whether the company is overcapitalized, prudently capitalized, or racing to a new funding need.
  claimRefs:
  - CI019
  - CI020
