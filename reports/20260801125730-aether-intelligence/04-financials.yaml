chapter:
  number: 4
  title: Financials
  summary: Aether’s public financial picture is strongest on growth and capital access. Shuraa reports a $4.2 million March 2026 MRR run-rate, 217 enterprise clients, fast multi-year growth, and expansion-heavy retention metrics; those figures imply a roughly $50.4 million recurring-revenue base and average ARR per customer near $232,000. The weak spots are cost structure, cash efficiency, and accounting detail. Public evidence does not disclose cash on hand, burn, realized gross margin, CAC, or revenue-recognition mechanics. The $250 million Series C lowers immediate financing risk and funds a credible multi-front operating plan, but it does not by itself prove software-quality economics.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization — recurring software core with services on top
  body: The public picture is clearest on revenue mechanism. Shuraa says Aether sells annual software subscriptions priced by deployment scale and adds professional-services revenue for custom model development and integration. That implies a business model closer to classic enterprise infrastructure software than to API-first consumption. The reported price band—roughly $120,000 to $2.4 million per year—also suggests large variance in customer size and use-case complexity. Using the reported March 2026 MRR of $4.2 million, the recurring run-rate annualizes to about $50.4 million. With 217 customers, that equates to average ARR per client around $232,000, although real distribution is almost certainly skewed by a small number of larger regulated accounts. Professional services could add meaningful revenue on top of that recurring base, but public evidence does not show attachment rates, gross margins, or the split between license and services recognition. The financial floor is therefore
    the recurring run-rate, while the fully loaded revenue picture remains less certain.
  claimRefs:
