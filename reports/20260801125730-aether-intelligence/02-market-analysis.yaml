  evidenceGaps:
  - type: missing-source
    severity: material
    topic: gcc-enterprise-ai-tam
    missingEvidence: A direct published GCC enterprise-AI-infrastructure TAM, SAM, and SOM tied to regulated
      workloads.
    whyItMatters: Without a narrow market denominator, any market-share or valuation math stays approximate.
    diligencePath: Request regional pipeline by country/vertical, ACV by customer type, and third-party
      TAM work focused on governed enterprise AI.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: aether-market-share
    missingEvidence: The underlying Gartner or equivalent source behind the claimed 12% Gulf market share
      and third-place ranking.
    whyItMatters: Market-share credibility materially changes how differentiated Aether’s position appears
      relative to hyperscalers.
    diligencePath: Obtain the source report excerpt or a licensed analyst citation naming Aether explicitly.
    relatedQuestionRefs:
    - QM015
  - type: private-evidence-only
    severity: material
    topic: buyer-conversion
    missingEvidence: Pilot-to-production conversion rates, sales-cycle length, and ACV by vertical.
    whyItMatters: The largest practical risk in enterprise AI is that ambition does not convert into durable
      recurring revenue.
    diligencePath: Request CRM cohort data, procurement cycle data, and NRR/GRR segmented by vertical.
    relatedQuestionRefs:
    - QM016
    - QM025
    relatedTableRefs:
    - TM003
    - TM004
  - type: stale
    severity: minor
    topic: regional-policy-path
    missingEvidence: A single official consolidated source for 2026 AI Act implementation, rather than
      commentary and policy context.
    whyItMatters: Procurement friction depends on implementation details, not only headline policy.
