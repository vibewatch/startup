      - number: '2.2'
        title: Buyer map and vertical demand
        blocks:
          - type: paragraph
            body: >-
              Shuraa’s disclosed revenue mix makes the buyer map unusually clear: financial services is the anchor
              segment, healthcare is the secondary vertical, and government is the third leg of the stool. That
              distribution is plausible given what the named reference organizations publicly say about themselves.
              Emirates NBD already uses AI and machine learning in compliance operations and is openly partnering to
              accelerate enterprise-grade AI solutions across MENAT. Cleveland Clinic Abu Dhabi describes real
              patient-data AI workflows, a clinical AI scientist initiative, and smart-hospital recognition. Dubai
              Customs now has a formal 2030 AI strategy and frames AI as core to trade and risk operations. In other
              words, the logos are credible not because they prove Aether’s exact contract scope, but because they prove
              the underlying sectors are already buying sophisticated AI.


              The buyer, user, and payer roles inside these organizations are likely distributed. Innovation or digital
              leadership may sponsor the initiative, data or engineering teams may evaluate the platform, and business
              or control functions often justify budget through fraud reduction, clinical quality, or customs
              efficiency. This matters for sales motion. Aether’s market is not simply “sell to a data-science leader”;
              it is “sell into regulated operating systems where multiple stakeholders need proof on compliance,
              deployment, and ROI before expansion.”
