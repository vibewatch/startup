      - number: '8.3'
        title: The right call is research-more / track with a fair-to-stretched stance
        blocks:
          - type: paragraph
            body: >-
              The scenario work points toward caution rather than rejection. In a bull case, Aether reaches management’s
              2027 ambition, sustains premium retention, and proves that its regulated-enterprise wedge deserves a high
              software multiple. In that world, the current price can look sensible or even attractive. In a base case,
              however, the company grows meaningfully but not flawlessly, disclosure improves only partially, and the
              market assigns a more disciplined 12x-16x multiple. That leads to valuation support roughly around today’s
              level rather than dramatically above it. In a bear case, growth slows toward the current ARR base,
              certification or concentration questions remain unresolved, and the company gets priced closer to
              lower-support public software comps. That creates significant downside from the current mark. Because the
              public evidence does not yet eliminate those downside paths, the cleanest stance is research-more / track
              with medium confidence, high risk, and a fair-to-stretched valuation view.
            claimRefs:
