  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current price support exists, but it is already premium enough to require proof
        blocks:
          - type: paragraph
            body: >-
              Aether’s valuation debate starts with two clear public anchors: Shuraa’s reported $1.0 billion post-money
              valuation and the company’s reported $4.2 million March 2026 MRR. That MRR annualizes to roughly $50.4
              million ARR, implying a current valuation around 19.8x ARR. This is not absurd in a world where premium
              software and AI names can command much richer public multiples, but it is far from obviously cheap. It
              also matters that SaaS Capital’s historical public-software sample and private-company discount framework
              both sit materially below that level. In other words, Aether is not being priced like a conventional
              late-stage private SaaS business. It is being priced more like a premium enterprise-software or
              AI-infrastructure candidate that is expected to preserve strong growth and strategic relevance. The
              question is not whether such a price is possible. The question is whether the current public evidence is
              strong enough to support that price with conviction rather than with optimism.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
