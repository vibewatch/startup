  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and IP risk
        blocks:
          - type: paragraph
            body: >-
              The first risk bucket is regulatory rather than commercial. Aether’s product is aimed at banking,
              healthcare, and government, so privacy, governance, and trust are not optional add-ons. UAE
              data-protection laws, broader AI-governance expectations, and sector-specific compliance norms all raise
              the cost of weak controls. This matters doubly because Aether’s story depends on regional compliance
              advantages over global rivals. If those certifications and trust claims are robust, they are a moat. If
              they are under-scoped, unverified, or hard to renew, they become a liability. Intellectual-property risk
              sits in the same bucket. Shuraa says Aether has three UAE patents, but the reviewed public patent-search
              surfaces do not independently confirm the patent numbers or scope. That does not disprove the claims; it
              means the market cannot easily validate how much real legal defensibility they create. On balance, the
              legal/regulatory picture is strategically important and still partially opaque, which makes it a top-tier
              diligence item rather than a background issue.
