  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Aether should be analyzed against the enterprise AI platform market, not against consumer AI or generic
              cloud spend. The closest public comparables are platforms such as AWS SageMaker, Azure Machine Learning,
              Google Cloud’s Vertex/Gemini enterprise stack, and IBM watsonx.ai — systems that help enterprises train,
              tune, deploy, govern, and observe models inside existing production environments. DataRobot and H2O add a
              second layer of adjacent competition by abstracting some of that complexity for enterprises that want
              faster time to value. In that sense, Aether’s alleged “Aether Core” positioning is category-coherent: it
              is competing for infrastructure and workflow budgets tied to real deployment, not just experimentation.


              The top-down market numbers are large but need careful handling. PwC’s $320 billion Middle East AI impact
              estimate is an economic-effect ceiling, while IDC’s $4.5 billion to $14.6 billion META spending trajectory
              is a nearer-term technology-spend path. They are complementary, not interchangeable. The first says the
              region cares about AI at macro level; the second says buyers are actually spending. Neither, however,
              gives a clean GCC-only enterprise-AI-infrastructure TAM. That gap matters because a $1 billion startup can
              look modest against macro AI narratives yet still be rich against the narrower market slice it can truly
              serve.
