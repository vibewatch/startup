      - - Compliance-proof risk
        - Certification and privacy evidence not produced
        - No auditable certification scope or privacy-control pack before deeper public-sector / healthcare scaling
        - Pause or narrow investment thesis
      - - Reliability risk
        - Severe platform instability returns
        - Multi-customer outage or weak incident transparency
        - Re-rate operational risk sharply upward
      - - Customer concentration risk
        - Large-account dependency exposed
        - Top 5 customers dominate ARR or one major bank churns
        - Cut revenue durability assumptions
      - - Expansion-quality risk
        - Retention or NRR weakens materially
        - Retention materially below reported 94% or NRR materially below reported 158%
        - Lower growth and valuation assumptions
      - - Capital-efficiency risk
        - Runway or burn disappoints
        - Post-round runway proves short or growth requires persistent heavy services intensity
        - Shift stance toward capital-risk case
    notes: Kill criteria are monitoring tools, not predictions; each converts an abstract risk into an observable event.
