      - number: '3.2'
        title: Capabilities and pricing — Aether likely wins on fit, while incumbents win on breadth and price visibility
        blocks:
          - type: paragraph
            body: >-
              On public evidence, Aether’s likely pitch is not maximum breadth but better fit for regulated Gulf
              deployments. Shuraa says the platform automates model training, deployment, and monitoring and sells
              annual contracts from roughly $120,000 to $2.4 million. That sounds like an enterprise-software motion
              with negotiated scope, implementation, and support. By contrast, AWS, Azure, Google, and IBM expose far
              more of their pricing logic directly to the market. AWS prices by instance usage and service consumption;
              Azure emphasizes pay-as-you-go compute plus reservations and savings plans; Google meters training,
              deployment, and prediction; IBM even discloses GPU-hour pricing on specific accelerators. The implication
              is important. Aether may offer commercial simplicity and local service for buyers that want a managed
              platform relationship, but the incumbents offer broader ecosystems and clearer unit-cost comparables. In a
              cost-sensitive or technically sophisticated procurement, that transparency becomes an advantage for the
              larger vendors.
