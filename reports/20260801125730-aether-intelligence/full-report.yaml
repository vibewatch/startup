  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segmentation and buyer map
        blocks:
          - type: paragraph
            body: >-
              Aether’s reported customer base is large enough to matter but narrow enough to require concentration
              discipline. Shuraa says the company serves 217 enterprise clients across 18 countries, yet the revenue mix
              reveals where the business actually lives: financial services first, healthcare second, and government
              third. That means the customer base should be analyzed by workflow criticality and procurement complexity,
              not by raw logo count. Banks likely buy through digital, compliance, and risk leaders; hospitals through
              clinical innovation and CIO functions; government agencies through operations and procurement leadership.
              In every case the user is not merely a data scientist. The user is an operating team trying to embed AI
              inside a regulated process. This is strategically positive because such customers can expand over time,
              but it also means they are slow-moving, multi-stakeholder accounts. Aether’s customer story is therefore a
              concentrated regulated-enterprise story, not a mass-market software story.
