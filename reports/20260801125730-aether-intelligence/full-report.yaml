      - number: '4.2'
        title: Traction and unit-economics proxies — strong top-line signals, limited cost visibility
        blocks:
          - type: paragraph
            body: >-
              Top-line momentum, at least on the reported numbers, is hard to ignore. A 340% increase from January 2024
              to March 2026 implies the company scaled from roughly $0.95 million MRR to $4.2 million. Shuraa also
              reports 94% retention and 158% net revenue retention, which, if accurate, would suggest healthy in-account
              expansion. Yet these are still incomplete unit-economics signals. They tell us growth and expansion are
              happening, but they do not reveal how expensive that growth is to acquire or support. Selling into banks,
              hospitals, and government agencies likely increases implementation burden, customer success demands, and
              procurement friction relative to lighter-weight SaaS. That can still be a good business if retention stays
              high and margins mature, but it means gross margin, CAC payback, services intensity, and deployment cycles
              matter disproportionately. Those fields remain blank in the public record, so the correct reading is
