      - number: '1.3'
        title: Capital stack, customer proof, and scale signals
        blocks:
          - type: paragraph
            body: >-
              If Shuraa’s funding chronology is correct, Aether moved from small ecosystem-backed beginnings to a
              heavyweight investor syndicate unusually quickly. The article reports $500,000 of pre-seed support, a $4.5
              million seed in 2020, a $22 million Series A in 2021, a $103 million Series B in 2023, and a $250 million
              Series C in April 2026. That last round is said to have been co-led by Mubadala and Sequoia, with SoftBank
              Vision Fund 2, Shorooq, and 212 also participating. The investor identities themselves are plausible:
              Mubadala is an established sovereign-backed venture investor, Sequoia and SoftBank are global technology
              franchises, and Shorooq plus 212 are relevant regional growth investors.


              The scale claims also rely on the same article but are directionally supported by the quality of the named
              customer set. Shuraa reports 217 enterprise clients across 18 countries, a March 2026 MRR of $4.2 million,
              and sector exposure weighted to financial services, healthcare, and government. It names Emirates NBD,
              Cleveland Clinic Abu Dhabi, and Dubai Customs as reference logos. While those customer relationships were
              not independently confirmed on the buyers’ own sites, each organization clearly uses AI at enterprise
              scale in its own operations, which makes the logos credible from a category-fit perspective even if
              contract scope and production status remain opaque.
