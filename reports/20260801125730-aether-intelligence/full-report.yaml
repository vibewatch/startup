        title: Exhibits
        blocks:
          - type: callout
            title: The market is big enough to matter, but not broad enough to hide weak execution
            body: >-
              Aether benefits from a genuinely fast-growing regional AI market, but its real target pool is the subset
              of regulated Gulf enterprises that require deployment, governance, and local support. That makes vertical
              execution, not generic “AI tailwinds,” the core market question.
