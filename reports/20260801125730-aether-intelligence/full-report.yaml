      - number: '7.4'
        title: Mitigation, residual risk, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of the risk picture is that many of the dangers are monitorable. Certification scope
              can be checked. Patent numbers can be produced. Uptime history, renewal cohorts, and top-customer
              concentration can be audited. The challenge is that the public record does not yet provide enough of that
              material, so investors are still inferring more than they should. That makes mitigation maturity uneven.
              Aether likely understands the strategic need for trust, resilience, and customer expansion, but
              understanding is not the same as evidence. The most important kill criteria are therefore concrete:
              failure to produce hard compliance proof before deeper healthcare or government expansion, recurrence of
              severe platform instability, visible deterioration in retention or NRR, or disclosure that a small number
              of customers drive a disproportionate share of ARR. The residual-risk verdict is not “uninvestable,” but
              it is clearly “high diligence burden.” At this stage, the company should be underwritten only with
              explicit monitoring thresholds and evidence gates.
