            body: >-
              The round itself is large enough to change the financing conversation. Shuraa outlines a full $250 million
              use-of-funds plan: $95 million for core and generative-AI R&D, $62 million for geographic expansion, $48
              million for talent, $28 million for vertical productization, and $17 million for go-to-market. That is a
              real operating plan, not just an abstract “growth capital” label. It also shows the company is trying to
              do several expensive things at once—deepen the platform, expand internationally, hire aggressively, and
              package vertical solutions. Management’s stated goal of reaching $100 million ARR and profitability by Q2
              2027 is directionally encouraging, but it is forward-looking and unverified. Most importantly, the public
