      - number: '2.4'
        title: Adoption constraints and sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The bullish story is real, but so are the constraints. BCG’s global adoption survey says only 26% of
              companies have developed the capabilities to generate tangible AI value, while 74% still struggle to scale
              it. In the GCC specifically, BCG also highlights talent and research shortages despite high ambition. That
              means the path from strategy to production remains fragile. Aether may sell into customers that are
              enthusiastic and well funded but still organizationally unprepared to convert pilots into broad recurring
              deployments. This is exactly where headline AI spending and vendor reality often diverge.


              Competition further compresses the serviceable market. Hyperscalers already bundle model catalogs,
              governance, data services, and secure deployment into existing cloud relationships; enterprise suites like
              IBM watsonx.ai, DataRobot, and H2O sell unified workflow layers on top. Sequoia’s “AI’s $600B Question”
              adds a valuation-aware warning: infrastructure enthusiasm can outpace monetized end-user value. As a
              result, the correct market conclusion is nuanced. Aether appears aimed at a real, fast-growing, and
              strategically important market, but the precise SAM and SOM are still underdetermined without ACV,
              sales-cycle, and deployment-depth data.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM029
              - CM030
              - CM031
              - CM032
              - CM034
              - CM035
              - CM036
