            title: Aether is good enough to track, but not yet transparent enough to chase aggressively
            body: >-
              The company’s market position and reported traction are credible enough to keep it on the radar. The
              blocker is not quality alone; it is that the current public proof is too thin for a premium-upside
              underwriting case.
