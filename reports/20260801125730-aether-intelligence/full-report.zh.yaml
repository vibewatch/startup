      - number: '3.3'
        title: 分发与切换成本——Aether 可在信任重要的地方落地，但扩张仍会撞上云重力
        blocks:
          - type: paragraph
            body: >-
              主要商业问题在于，既有巨头不需要在每个功能上击败 Aether
              才能赢。它们可以借既有云、采购、安全或转型关系进入，让买方在已经信任的基础设施之上延展工作负载。在受监管账户中，这一点尤其相关，因为平台周围的控制环境可能与平台本身同样重要。银行、医疗和政府等具名垂直行业证明机会存在，但并不能让
              Aether
              免受打包压力。事实上，这些行业还可能因为吸引最大、资本最充足的供应商而加剧压力。工作流、治理控制和数据管道一旦嵌入，切换成本确实存在，但并非绝对：客户可以多宿主，可以把基础云工具与第三方层组合，也可以为特定工作负载内部自建。结果是，Aether
              可能凭本地可信度落地，但每一次扩张仍要防守远大得多的分发机器。
