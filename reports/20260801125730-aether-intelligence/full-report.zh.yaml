      - number: '8.4'
        title: 上调路径很明确，因为当前判断高度依赖证据
        blocks:
          - type: paragraph
            body: >-
              触发观点上调的条件也相当清楚。若管理层能提供经审计或董事会级别的财务披露、头部客户集中度数据、留存队列、认证范围、专利编号，以及改版后的 正常运行时间证据，Aether
              在当前价格下会更有吸引力。这些不是形式性要求，而是把一个可信公司故事接到可承销溢价估值上的缺口桥梁。下调路径同样清晰：若留存弱于报告口径，路线图延误，集中度极高，或合规证据薄于叙事暗示，当前估值相对私营软件基准和低端公开可比公司都会很快显得昂贵。公司本身仍可能很优秀，但投资判断仍然对价格敏感。缺少这些尽调项，新资金就是在为高端上行情景付款，而支撑溢价的证据还没有充分可见。因此，本章把尽调请求视为估值变量，而不是行政性后续事项：每一个缺失答案都会直接改变收入基数、倍数，或两者同时改变。
