chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品定位和生态背景
        blocks:
          - type: paragraph
            body: >-
              以一家据称估值 $1 billion 的公司看，Aether Intelligence 的公开存在感异常薄：官网能打开，但只是一个写着「Launching
              Soon」的落地页，没有详细产品资料、团队页、信任中心或客户证明。因此，实质性的公开叙事几乎全部来自一篇 Shuraa 长文；该文称，Aether 是一家 2019 年成立、位于 Dubai Internet
              City 的初创公司，以 Aether Core 品牌销售企业级 AI 基础设施。按该文说法，平台可在云端和本地环境中自动化模型训练、部署和监控，让企业买家无需组建庞大的内部数据科学团队，也能部署定制机器学习。


              即便公司自身披露偏薄，更大的生态背景仍可信。Dubai Internet City 自称是区域领先科技枢纽，Hub71 目前拥有 410+ 家初创公司和 200+ 个合作伙伴，in5 称自 2013
              年以来已支持超过 500 家初创公司。这些机构，加上 Dubai Future Foundation 和阿联酋 2017 年国家 AI 战略，使一家海湾企业 AI
              公司从本地基础设施中长出来显得合理。缺口仍在直接的一手公司证据：本轮没有发现详细官方产品文档、法律实体资料或客户案例库。
