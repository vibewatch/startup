  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与 IP 风险
        blocks:
          - type: paragraph
            body: >-
              第一类风险不是商业，而是监管。Aether 的产品面向银行、医疗和政府，因此隐私、治理和信任不是可选附加项。阿联酋数据保护法律、更广的 AI
              治理预期以及行业特定合规规范，都会抬高控制薄弱的成本。这一点加倍重要，因为 Aether
              的故事依赖相对于全球竞争对手的区域合规优势。如果这些认证和信任主张扎实，它们就是护城河；如果范围不足、未经验证或难以续期，它们就会变成负债。知识产权风险也在同一桶里。Shuraa 称 Aether
              拥有三项阿联酋专利，但已审阅的公开专利检索渠道没有独立确认专利号或范围。这并不证伪主张；它意味着市场无法轻易验证这些专利创造了多少真实法律防御性。总体看，法律 /
              监管图景具有战略重要性且仍部分不透明，所以它是一线尽调事项，而不是背景问题。
