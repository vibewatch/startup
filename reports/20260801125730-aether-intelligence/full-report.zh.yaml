      - number: '4.4'
        title: 基准背景与财务结论——增长观感好，毛利和现金效率证据未解
        blocks:
          - type: paragraph
            body: >-
              公开基准数据有助于框定缺口。Snowflake 官方 Q1 FY26 业绩展示了投资人希望在规模化云软件中看到的经济性：124% 净收入留存率和约 76% 非 GAAP 产品毛利率。Yahoo Finance
              数据显示，公开 AI 与数据基础设施公司结局跨度极大，从 C3.ai 的低 EV/revenue 倍数和深度负利润率，到 Palantir 的高倍数和强盈利能力。信息很简单：“AI”
              本身不够。市场奖励增长、留存、利润质量和战略防御性的某种组合。Aether 在增长和资本获取上最强，但在毛利画像、CAC 效率、收入确认和现金消耗的外部证明上弱得多。BCG 关于多数企业仍难以规模化 AI
              价值的证据，以及 Sequoia 的需求警告，都指向谨慎。财务结论因此是：动能有利，质量参差，真正承销仍依赖内部数据。
