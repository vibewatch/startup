      - number: '2.2'
        title: 买方地图与垂直需求
        blocks:
          - type: paragraph
            body: >-
              Shuraa 披露的收入结构让买方地图异常清楚：金融服务是锚点板块，医疗是第二垂直，政府是第三条支柱。结合具名参考机构对自身的公开表述，这一分布合理。Emirates NBD 已在合规运营中使用 AI
              和机器学习，并公开合作以加速 MENAT 的企业级 AI 解决方案。Cleveland Clinic Abu Dhabi 描述了真实的患者数据 AI 工作流、临床 AI 科学家项目和智慧医院认可。Dubai
              Customs 已有正式的 2030 AI 战略，并把 AI 视为贸易和风险运营的核心。换句话说，这些客户标识可信，不是因为它们证明了 Aether 的确切合同范围，而是因为它们证明底层行业已经在采购复杂 AI。


              这些组织内部的买方、用户和付款方很可能分散。创新或数字化负责人可能发起项目，数据或工程团队可能评估平台，业务或控制职能往往用欺诈降低、临床质量或海关效率来论证预算。这会改变销售动作。Aether
              的市场不是简单地“卖给数据科学负责人”，而是“卖进受监管运营系统；在扩张前，多个利益相关方都需要看到合规、部署和 ROI 证据”。
