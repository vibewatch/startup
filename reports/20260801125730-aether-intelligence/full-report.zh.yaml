      - number: '1.2'
        title: 创始人、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              公开的创始人故事也几乎完全来自 Shuraa。文章点名 Dr. Rania Al-Masri 和 Omar Khalfan 为联合创始人，将 Al-Masri 定位为机器学习战略负责人，将 Khalfan
              定位为基础设施和工程搭档。Shuraa 分别归因其曾在 Careem 和 Souq.com 任职；若属实，这意味着团队确有在海湾构建应用型企业系统的创始人—市场匹配。文章还称，公司早期获得 Hub71
              支持，之后又得到 in5 Tech 和 Dubai Future Foundation 的生态协助，并将人才培养同 Mohamed bin Zayed University of Artificial
              Intelligence 联系起来。


              公开记录没有展示的内容同样重要。本轮没有发现董事会名单、独立董事名单、治理章程或继任计划。极简官网也无法补上这些缺口。因此，公司看起来高度依赖双创始人叙事，公开证据尚不足以证明更宽的高管梯队。对尽调而言，这不是表面缺口，而是实质治理弱点：一家处于后期、按独角兽估值融资的企业软件公司，通常应更清楚地披露董事会构成、高级管理层厚度和运营控制。
