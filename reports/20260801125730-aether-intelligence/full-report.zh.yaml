      - - 悲观
        - ARR 接近当前 run-rate，证据改善弱，存在集中度或合规担忧
        - 5x-8x ARR 对应约 $0.25B-$0.4B 价值
        - 倍数压缩和客户脆弱性
        - 明显下行情景
