      - number: '2.4'
        title: 采用约束与规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              乐观故事真实存在，约束也同样存在。BCG 的全球采用调查显示，只有 26% 的公司已经形成创造切实 AI 价值的能力，74% 仍难以规模化。在 GCC，BCG
              也指出，尽管雄心很高，人才和研究仍短缺。这意味着从战略走到生产的路径仍脆弱。Aether 可能卖进热情高、资金足的客户，但这些客户在组织上仍未准备好把试点转化为大范围经常性部署。AI
              头部支出与供应商现实经常分叉，正是在这里。


              竞争会进一步压缩可服务市场。超大规模云厂商已经把模型目录、治理、数据服务和安全部署打包进既有云关系；IBM watsonx.ai、DataRobot 和 H2O
              这样的企业套件则在其上销售统一工作流层。Sequoia 的「AI’s $600B Question」增加了一条估值相关警告：基础设施热情可能超过已货币化的终端用户价值。因此，正确的市场结论需要更细。Aether
              看起来瞄准了一个真实、快速增长且具战略重要性的市场，但如果没有 ACV、销售周期和部署深度数据，精确的 SAM 和 SOM 仍无法确定。
