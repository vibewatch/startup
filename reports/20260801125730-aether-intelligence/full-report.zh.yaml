        - 公共部门 / 医疗继续放量前，仍没有可审计的认证范围或隐私控制包
        - 暂停或收窄投资论点
      - - 可靠性风险
        - 严重平台不稳定再次出现
        - 多客户宕机或事故透明度弱
        - 大幅上调运营风险评级
      - - 客户集中度风险
        - 大账户依赖暴露
        - 前 5 大客户主导 ARR，或一家主要银行流失
        - 下调收入可持续性假设
      - - 扩张质量风险
        - 留存或 NRR 明显走弱
        - 留存率明显低于披露的 94%，或 NRR 明显低于披露的 158%
        - 下调增长和估值假设
      - - 资本效率风险
        - 跑道或烧钱表现不及预期
        - 轮后跑道显示偏短，或增长需要持续较高服务投入
        - 转向资本风险情景
    notes: 叫停标准是监测工具，不是预测；每一项都把抽象风险转成可观察事件。
    claimRefs:
      - CR031
      - CR032
      - CR033
      - CR034
