companyProfile:
  summary: >-
    Aether Intelligence 是一家总部位于 Dubai Internet City 的迪拜企业 AI 基础设施公司，成立于 2019 年。公司销售 Aether
    Core，一个托管平台，覆盖模型训练、部署、监控以及对隐私敏感的企业 AI 运营，核心叙事围绕海湾数据主权、受监管企业需求和阿拉伯语工作流。公开报道显示，公司在金融服务、医疗和政府领域已有牵引，具名关系包括 Emirates
    NBD、Cleveland Clinic Abu Dhabi 和 Dubai Customs。公司看起来确有后期动能和严肃机构背书，但公开披露在经审计财务质量、客户集中度和护城河深度证据上仍然偏薄。
  foundedDate: '2019-01-01'
  founders:
