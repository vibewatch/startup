  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              分析 Aether，应把它放在企业 AI 平台市场里，而不是拿它对标消费级 AI 或泛云支出。最接近的公开可比对象是 AWS SageMaker、Azure Machine Learning、Google
              Cloud 的 Vertex/Gemini 企业栈以及 IBM watsonx.ai 这类平台——它们帮助企业在现有生产环境中训练、微调、部署、治理和观测模型。DataRobot 和 H2O
              构成第二层相邻竞争，它们为希望更快兑现价值的企业抽象掉一部分复杂度。按这个口径，Aether 所谓的「Aether Core」定位在品类上说得通：它争夺的是与真实部署绑定的基础设施和工作流预算，而不只是实验预算。


              自上而下的市场数字很大，但需要谨慎使用。PwC 对中东 AI 影响的 $320 billion 估算，是经济效应上限；IDC 对 META 技术支出从 $4.5 billion 到 $14.6 billion
              的路径，则更接近短中期技术预算。两者互补，但不能互换。前者说明区域在宏观层面重视 AI；后者说明买方确实在花钱。但两者都没有给出干净的仅 GCC 企业 AI 基础设施 TAM。这个缺口重要，因为一家 $1
              billion 初创公司放进宏观 AI 叙事里可能显得不大，但放进它真正能服务的较窄市场切片里，估值可能已经很贵。
