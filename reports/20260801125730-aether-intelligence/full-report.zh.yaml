      - CR032
      - CR033
      - CR034
      - CR039
      - CR040
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 关键依赖横跨监管机构、客户行业、云基础设施和周边 ML 工具。
    data:
      nodes:
        - id: aether
          label: Aether 核心平台
          category: company
          note: 中央交付与控制平面。
        - id: reg
          label: 监管机构 / 隐私法
          category: regulator
          note: PDPL、AI 治理和行业预期。
        - id: cloud
          label: 云 / 混合基础设施
          category: platform
          note: 算力和可用性层。
        - id: cust
          label: 受监管客户
          category: customer
          note: 银行、医院、政府机构。
        - id: ecosys
          label: ML 生态工具
          category: partner
          note: MLflow、Kubeflow 和集成预期。
        - id: local
          label: 本地信任叙事
          category: partner
          note: 合规与主权差异化。
        - id: rivals
          label: 区域 + 超大规模云厂商对手
          category: competitor
          note: 替代平台和值得信任的供应商。
      edges:
        - from: reg
          to: aether
          label: 控制与审批
        - from: cloud
          to: aether
          label: 算力 + 可用性
        - from: ecosys
          to: aether
          label: 集成预期
        - from: local
          to: aether
          label: 信任护城河
        - from: aether
          to: cust
          label: 已部署工作流
        - from: rivals
          to: cust
          label: 竞争性替代方案
        - from: rivals
          to: local
          label: 护城河压缩
    claimRefs:
      - CR011
      - CR012
      - CR025
      - CR026
      - CR027
      - CR028
      - CR039
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议由两端共同驱动：一端是真实业务牵引和客户契合，另一端是证明薄弱和定价偏高。
    data:
      nodes:
        - id: a
          label: 真实业务牵引
          detail: 报道中的增长、客户数量和行业契合度让公司不容轻视。
          tone: positive
        - id: b
          label: 当前价格溢价
          detail: 约 19.8x ARR 已经计入强劲结果。
          tone: warning
        - id: c
          label: 披露缺口
          detail: 一手证明薄，也缺少达到申报文件水准的 Aether 披露。
          tone: warning
        - id: d
          label: 可比估值纪律
          detail: 公开可比估值区间很宽，且对证明质量敏感。
          tone: neutral
        - id: e
          label: 继续研究 / 跟踪
          detail: 可以接触，但不要盲目为溢价上行买单。
          tone: warning
      edges:
        - from: a
          to: e
        - from: b
          to: e
        - from: c
          to: e
        - from: d
          to: e
    claimRefs:
      - CV013
      - CV020
      - CV023
      - CV024
      - CV027
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 当前估值对披露质量、留存耐久性和集中度可见度最敏感。
    data:
      items:
        - label: 披露质量改善
          value: 5
        - label: 留存 / NRR 得到验证
          value: 4
        - label: 集中度已披露且可控
          value: 4
        - label: 认证 / 护城河证明加强
          value: 3
        - label: 路线图执行风险下降
          value: 3
    approximationNotes: 数值是 1-5 的敏感性评分，总结每个因素可能多大程度改变公允价值信心。
    claimRefs:
      - CV020
      - CV023
      - CV025
      - CV026
      - CV031
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前证据更能支持雄心而非精确性，因此情景区间很宽。
    data:
      items:
        - label: 悲观
          low: 0.25
          high: 0.4
          unit: USDbn
        - label: 基准
          low: 0.9
          high: 1.2
          unit: USDbn
        - label: 乐观
          low: 2
          high: 2.5
          unit: USDbn
    approximationNotes: 区间是基于 ARR 和倍数假设的情景化分析判断，不是管理层指引。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 评分卡在市场相关性上最强，在披露质量和安全边际上最弱。
    data:
      items:
        - label: 市场相关性
          score: 4
          detail: 海湾受监管 AI 市场和客户行业看起来真实。
        - label: 客户证明
          score: 3
          detail: 客户名单和行业可信，但直接范围仍薄。
        - label: 护城河证明
          score: 3
          detail: 合规和本地化楔子说得通，但验证不足。
        - label: 经济性证明
          score: 2
          detail: 现金消耗、利润率和集中度仍未披露。
        - label: 证据质量
          score: 2
          detail: 过多公司特定证明仍压在一篇主要文章上。
        - label: 安全边际
          score: 2
          detail: 当前价格已经计入溢价结果。
    approximationNotes: 评分采用 1-5 分制，总结的是章节证据，而不是公司披露指标。
    claimRefs:
      - CV014
      - CV015
      - CV020
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV036
      - CV040
