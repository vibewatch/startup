      - number: '4.2'
        title: 牵引与单位经济代理指标——收入端信号强，成本可见度有限
        blocks:
          - type: paragraph
            body: >-
              至少按披露数字看，收入端动能很难忽视。2024 年 1 月至 2026 年 3 月增长 340%，意味着公司从约 $0.95 million MRR 扩张到 $4.2 million。Shuraa 还披露 94%
              留存率和 158% 净收入留存率；若准确，说明存量账户扩张健康。但这些仍是不完整的单位经济信号。它们告诉我们增长和扩张正在发生，却没有揭示获取或支持这些增长有多贵。相较轻量
              SaaS，卖给银行、医院和政府机构很可能提高实施负担、客户成功要求和采购摩擦。如果留存维持高位、毛利成熟，这仍可以是一门好生意；但这意味着毛利率、CAC
              回收期、服务强度和部署周期格外重要。公开记录中这些字段仍是空白，所以正确读法是“有希望但披露不足”，不是“已经完全承销”。
