        - 路线图、竞争、合规执行
        - 有可能，但需要大量证据
      - - 基准
        - ARR 约 $75M，披露质量不错但仍不完整，受监管市场切入点可持续
        - 12x-16x ARR 对应约 $0.9B-$1.2B 价值
        - 集中度和执行仍然重要
