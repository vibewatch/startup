    type: flow
    layout: wide
    summary: Aether 的公开故事把海湾政策支持、企业客户类别和大额融资连在一起，但披露脆弱性仍是硬约束。
    data:
      nodes:
        - id: ecosystem
          label: 阿联酋 AI 生态
          detail: Dubai Internet City、Hub71、in5、MBZUAI 和 DFF 共同提供 AI 创业故事所需的周边基础设施。
          tone: positive
        - id: product
          label: Aether Core 平台
