      role: 联合创始人
      background: 曾在 Careem 领导 AI 项目，并拥有 MIT 分布式机器学习系统博士学位。
    - name: Omar Khalfan
      role: 联合创始人
      background: 曾在 Souq.com 搭建数据基础设施，并在 Khalifa University 学习计算机工程和工商管理。
