      - number: '8.3'
        title: 合理结论是继续研究 / 跟踪，估值处于合理到偏紧
        blocks:
          - type: paragraph
            body: >-
              情景分析指向谨慎，而不是否定。在牛市情景，Aether 达成管理层 2027
              年目标，守住高端留存，并证明其受监管企业切入点值得高软件倍数。那时，当前价格可以显得合理，甚至有吸引力。但在基准情景，公司仍有明显增长，却并非一路完美；披露只部分改善，市场给出更有纪律的 12x-16x
              倍数。这样估值支撑大致落在今天水平附近，而不是大幅高于今天。熊市情景里，增长向当前 ARR
              基数回落，认证或集中度问题悬而未决，公司被定价到支撑较弱的公开软件可比公司附近。相较当前标记，这会带来显著下行。公开证据还没有排除这些下行路径，因此最干净的立场是继续研究 /
              跟踪：中等信心、高风险，估值看法为合理到偏紧。
