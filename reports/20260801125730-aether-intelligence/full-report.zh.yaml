              阿联酋生态、具名客户类别和投资人组合，都让 Aether 的故事显得合理。真正的问题在于，一家据称价值 $1 billion
              的后期基础设施公司，仍只展示占位官网，并让大多数公司特定事实依赖一篇媒体文章。因此，本章建议不应停留在“相信还是不相信”，而应转为“承销前必须强力核验”。
