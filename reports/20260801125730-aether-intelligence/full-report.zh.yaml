      - number: '1.4'
        title: 里程碑、反向信号与未解尽调问题
        blocks:
          - type: paragraph
            body: >-
              公开记录拼出的时间线好看，但脆弱。Shuraa 称，Aether 从 2019 年获得 Hub71 支持的 pre-seed 起步，到 2020 年开展银行试点，2021 年借 Series A
              支持商业化发布，2023 年完成重要增长轮，并在 2026 年跻身独角兽。同一来源还声称，公司获得三项阿联酋授权专利，拥有 217 家企业客户，并计划用 Series C 资金投入阿拉伯语生成式
              AI、垂直行业产品，以及向沙特阿拉伯、埃及和新加坡扩张。这些信号正是让公司值得认真研究的那类证据。


              但信心有两道主要刹车。第一，公司层面的故事大多收束到一篇庆祝性文章和一个占位官网；连董事会构成、专利号、经审计收入和员工数这样的基础项也没有独立披露。第二，Sequoia 的「AI’s $600B
              Question」提醒市场，基础设施热情可能跑在已货币化的终端用户价值前面。Aether 未来仍可能证明自己是真正的海湾企业 AI
              赢家，但仅凭公开证据，本章应被视为支撑较充分的方向性叙事，而不是已经完全交叉验证的公司记录。
