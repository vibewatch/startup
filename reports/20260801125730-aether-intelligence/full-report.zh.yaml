figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Aether 的公开叙事从 2017 年政策铺垫开始，经过 2019 年成立、2022 年宕机、2023 年成长期融资，到 2026 年独角兽估值跃升。
    data:
      items:
        - date: 2017-10
          label: 阿联酋 AI 战略启动
          detail: 联邦 AI 战略先打下国家背书的政策底座，支撑本土 AI 公司成形。
          tone: positive
        - date: 2019-10
          label: Aether 成立
          detail: 据 Shuraa，Al-Masri 和 Khalfan 在迪拜创办 Aether，并获得 Hub71 关联的种子前轮支持。
          tone: positive
        - date: 2020-03
          label: 测试版平台和首批银行试点
          detail: 据称，最初的金融服务试点验证了商业痛点。
          tone: positive
        - date: 2020-12
          label: 种子轮据报完成
          detail: 据报，212 Capital 领投 $4.5M 种子轮，用于扩建工程能力。
          tone: positive
        - date: 2021-08
          label: A 轮据报完成
          detail: 据报，Shorooq 参投的 A 轮为商业化发布和 GCC 推广提供资金。
          tone: positive
        - date: 2022 Q1
          label: 平台宕机与重构
          detail: 据报，一次影响 15 家客户、持续三个月的宕机迫使公司大幅重置架构。
          tone: warning
        - date: 2023-06
          label: B 轮据报完成
          detail: 据报，Mubadala 和 Sequoia 参与 $103M 扩张轮。
          tone: positive
        - date: 2025-10
          label: 迪拜海关 AI 战略
          detail: 一个具名公共部门客户类别也在加码自身 AI 战略。
          tone: positive
        - date: '2026-04-15'
          label: C 轮 / 独角兽估值
          detail: 据称，$250M C 轮把公司投后估值推到 $1.0B。
          tone: positive
        - date: 2026-07
          label: 资金预留给生成式 AI 和扩张
          detail: 据报，C 轮资金将投向阿拉伯语生成式 AI、扩张、招聘和垂直行业解决方案。
          tone: neutral
    approximationNotes: 多项公司特定事项仍只有 Shuraa 单一来源；政策和客户背景里程碑则有独立来源支撑。
    claimRefs:
      - CO003
      - CO016
      - CO023
      - CO026
      - CO033
      - CO034
      - CO035
      - CO037
