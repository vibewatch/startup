  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现——经常性软件为核心，上面叠加服务
        blocks:
          - type: paragraph
            body: >-
              公开图景中，收入机制最清楚。Shuraa 称，Aether 销售按部署规模定价的年度软件订阅，并为定制模型开发和集成增加专业服务收入。这意味着业务模型更接近经典企业基础设施软件，而不是 API
              优先的消耗模式。披露的价格带——每年约 $120,000 至 $2.4 million——也说明客户规模和用例复杂度差异很大。按披露的 2026 年 3 月 MRR $4.2 million
              计算，经常性收入年化约为 $50.4 million。以 217 家客户计，平均每客户 ARR 约
              $232,000，虽然真实分布几乎肯定被少数大型受监管账户拉偏。专业服务可能在经常性基础之上贡献可观收入，但公开证据没有显示附加率、毛利率，或许可证与服务收入确认的拆分。因此，财务底线是经常性收入年化，全口径收入图景仍不够确定。
