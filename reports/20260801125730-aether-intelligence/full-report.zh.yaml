      - number: '1.3'
        title: 资本结构、客户证明与规模信号
        blocks:
          - type: paragraph
            body: >-
              如果 Shuraa 的融资时间线准确，Aether 从小规模生态支持起步到获得重量级投资人联合体，速度异常快。文章称，公司获得 $500,000 pre-seed 支持，2020 年完成 $4.5 million
              seed，2021 年完成 $22 million Series A，2023 年完成 $103 million Series B，并在 2026 年 4 月完成 $250 million Series
              C。最后一轮据称由 Mubadala 和 Sequoia 共同领投，SoftBank Vision Fund 2、Shorooq 和 212 也参与。投资人身份本身合理：Mubadala
              是成熟的主权背景风险投资人，Sequoia 和 SoftBank 是全球技术投资品牌，Shorooq 与 212 则是相关的区域成长投资人。


              规模主张也依赖同一篇文章，但具名客户组合的质量提供了方向性支撑。Shuraa 称，公司拥有分布在 18 个国家的 217 家企业客户，2026 年 3 月 MRR 为 $4.2
              million，行业暴露主要在金融服务、医疗和政府。文章点名 Emirates NBD、Cleveland Clinic Abu Dhabi 和 Dubai Customs
              作为参考客户。虽然这些客户关系没有在买方自己的官网上得到独立确认，但每个组织显然都在自身运营中以企业级规模使用 AI；从品类匹配看，这些客户标识可信，即便合同范围和生产状态仍不透明。
