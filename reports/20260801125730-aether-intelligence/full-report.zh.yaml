  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Aether 的主要风险经合规、可用性、集中度和执行，传导到客户、利润率和估值。
    data:
      nodes:
        - id: compliance
          label: 合规 / 隐私缺口
          category: risk
          note: 受监管数据工作流中的证明或控制较弱。
        - id: uptime
          label: 可靠性事件
          category: risk
          note: 宕机或服务降级事件。
        - id: concentration
          label: 客户集中度
          category: risk
          note: 大客户或行业依赖。
        - id: execution
          label: 路线图 / 招聘压力
          category: risk
          note: 并行事项过多。
        - id: customers
          label: 客户续约
          category: outcome
          note: 留存和扩张行为。
        - id: margin
          label: 利润率 / 支持负载
          category: outcome
          note: 服务负担和毛利率压力。
        - id: valuation
          label: 估值支撑
          category: outcome
          note: 守住溢价倍数的能力。
      edges:
        - from: compliance
          to: customers
          label: 信任侵蚀
        - from: uptime
          to: customers
          label: 续约压力
        - from: concentration
          to: valuation
          label: 耐久性折价
        - from: execution
          to: margin
          label: 成本超支
        - from: execution
          to: customers
          label: 部署放慢
        - from: customers
          to: valuation
          label: 增长耐久性
        - from: margin
          to: valuation
          label: 经济质量
