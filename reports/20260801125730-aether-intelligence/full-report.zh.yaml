        title: 分群与买方地图
        blocks:
          - type: paragraph
            body: >-
              Aether 披露的客户基础大到值得重视，但也窄到必须严控集中度。Shuraa 称，公司服务 18 个国家的 217
              家企业客户，但收入结构揭示了业务真正所在：金融服务第一，医疗第二，政府第三。这意味着客户基础应按工作流关键性和采购复杂度分析，而不是按原始客户标识数量。银行很可能通过数字化、合规和风险负责人采购；医院通过临床创新和
              CIO 职能采购；政府机构通过运营和采购领导层采购。每种情况下，用户都不只是数据科学家，而是试图把 AI
              嵌入受监管流程的运营团队。这在战略上是正面的，因为这类客户可随时间扩张；但它也意味着客户行动慢、利益相关方多。Aether 的客户故事因此是一个集中的受监管企业故事，而不是大众市场软件故事。
