      - number: '3.2'
        title: 能力与定价——Aether 可能赢在适配，既有巨头赢在广度和价格透明度
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，Aether 可能推销的不是最大功能广度，而是更适配受监管海湾部署。Shuraa 称，平台可自动化模型训练、部署和监控，并销售约 $120,000 至 $2.4 million
              的年度合同。这听起来像企业软件销售动作，范围、实施和支持都需要谈判。相比之下，AWS、Azure、Google 和 IBM 向市场直接暴露更多定价逻辑。AWS 按实例使用和服务消耗定价；Azure
              强调按量计算、预留和节省计划；Google 计量训练、部署和预测；IBM 甚至披露特定加速器的 GPU-hour 定价。这里的含义重要。Aether
              可能为想要托管平台关系的买方提供商业简化和本地服务，但既有巨头拥有更宽生态和更清楚的单位成本可比项。在成本敏感或技术成熟的采购中，这种透明度会成为大厂优势。
