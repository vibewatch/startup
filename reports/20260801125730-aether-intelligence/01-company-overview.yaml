callouts:
- calloutType: risk
  title: The biggest issue is not category plausibility — it is disclosure quality
  body: The UAE ecosystem, named customer categories, and investor set all make the Aether story plausible.
    The real problem is that a late-stage infrastructure company allegedly worth $1 billion still presents
    only a placeholder website and relies on one media article for most company-specific facts. That shifts
    this chapter’s recommendation from “believe or disbelieve” to “verify aggressively before underwriting.”
