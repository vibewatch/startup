- id: final-diligence-asks-and-thesis-breakers
  title: The upgrade path is explicit because the current call is evidence-sensitive
  body: 'What would change the call is also reasonably clear. Aether would look more compelling at the current price if management could provide audited or board-grade financial disclosure, top-customer concentration data, retention cohorts, certification scope, patent identifiers, and post-redesign uptime evidence. Those are not cosmetic requests; they are the missing bridge between a plausible company story and an underwritable premium valuation. The downgrade path is equally clear. If retention is weaker than reported, if the roadmap slips, if concentration proves extreme, or if compliance proof is thinner than implied, then the current valuation can quickly look expensive relative to both private-software benchmarks and lower-end public comps. The company may still be very good. The investment call, however, remains price-sensitive. Without those diligence items, new money is paying for premium-upside outcomes before enough of the premium-supporting evidence is visible. That is why this chapter treats diligence requests as valuation variables rather than administrative follow-ups: every missing answer directly changes either the revenue base, the multiple, or both.'
