  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Retention degrades
    - Reported retention or NRR materially below current claims
    - Weakens expansion case and premium multiple support
    - Reduce revenue and multiple assumptions
  - - Compliance proof disappoints
    - Certification or privacy evidence weaker than implied
    - Weakens local-trust moat and public-sector angle
    - Re-rate moat and customer-risk
  - - Concentration proves extreme
    - Small number of accounts drive outsized ARR
    - Weakens durability and increases downside volatility
    - Apply concentration discount
  - - Roadmap slips materially
    - Arabic foundation / multimodal modules delayed well past target
    - Weakens premium-growth narrative
    - Lower bull-case probability
  - - Economic quality disappoints
    - Burn, margin, or services intensity look weak
    - Weakens software-quality thesis
    - Shift stance toward pass or lower entry price
  notes: These triggers convert vague concerns into observable events for investment governance.
