  topStrengths:
    - Reported traction in regulated Gulf sectors gives the company a more serious starting point than a generic AI tooling startup.
    - Gulf data-sovereignty and Arabic-enterprise positioning create a plausible local wedge against global platforms.
    - The April 2026 $250M round and backing from Mubadala, Sequoia, and SoftBank indicate strong capital-market credibility.
    - Reported MRR growth and customer count suggest the company is already operating at meaningful enterprise scale.
  topRisks:
    - Most company-specific operating evidence is still thinly disclosed and heavily dependent on one main article rather than filing-grade documentation.
    - The current valuation implies a premium software multiple, leaving limited margin of safety if growth, retention, or moat proof disappoint.
    - Customer concentration, contract durability, and gross-margin quality remain unresolved, which matters materially for valuation support.
    - Hyperscalers and regional sovereign-AI platforms can pressure both pricing and moat perception over time.
  unresolvedGaps:
    - Audited or board-grade financial disclosure covering gross margin, burn, runway, and revenue recognition.
    - Top-customer concentration, cohort retention, contract length, and expansion data.
    - Certification scope, patent identifiers, and other hard proof of the claimed trust moat.
    - Post-redesign uptime history, SLA performance, and roadmap milestone evidence for 2026-2027.
