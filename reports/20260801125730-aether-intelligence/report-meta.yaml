companyProfile:
  summary: Aether Intelligence is a Dubai-based enterprise AI infrastructure company founded in 2019 and headquartered in Dubai Internet City. The company sells Aether Core, a managed platform for model training, deployment, monitoring, and privacy-sensitive enterprise AI operations, with a particular pitch around Gulf data sovereignty, regulated-enterprise requirements, and Arabic-language workflows. Public reporting indicates traction in financial services, healthcare, and government, including cited relationships with Emirates NBD, Cleveland Clinic Abu Dhabi, and Dubai Customs. The company appears to have real late-stage momentum and serious institutional backing, but public disclosure is still thin on audited financial quality, concentration, and proof of moat depth.
  foundedDate: '2019-01-01'
  founders:
    - name: Dr. Rania Al-Masri
      role: Co-founder
      background: Previously led AI initiatives at Careem and holds a PhD in distributed machine learning systems from MIT.
    - name: Omar Khalfan
      role: Co-founder
      background: Previously built data infrastructure at Souq.com and studied computer engineering and business administration at Khalifa University.
  foundingLocation: Dubai, UAE
  headquarters: Dubai Internet City, Dubai, UAE
  productSummary: Aether Core is positioned as an enterprise AI infrastructure layer for custom model training, deployment, monitoring, privacy-preserving ML, and workflow orchestration in regulated organizations.
  customerFocus: Banks, healthcare providers, government agencies, and other regulated enterprises across the Gulf and wider MENA region.
  businessModel: Subscription and platform revenue from enterprise AI infrastructure, deployment, monitoring, and adjacent implementation or support services for regulated organizations.
  stage: late-stage private
  fundingStatus: $250M Series C announced in April 2026 at a $1.0B post-money valuation, bringing total reported funding to $380M.
