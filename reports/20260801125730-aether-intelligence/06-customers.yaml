  - FU003
- id: retention-expansion-and-durability
  title: Retention, expansion, and durability
  body: 'On public evidence, the most attractive customer metrics are retention and expansion. Shuraa reports 94% customer retention and 158% net revenue retention in 2025, which, if accurate, would imply existing customers are widening their usage enough to more than offset churn. That is exactly the profile investors want from a regulated enterprise platform. It suggests Aether may be landing in one workflow and expanding into adjacent ones. The problem is auditability. No public source reviewed provides contract lengths, cohort tables, top-customer share, or segment-level churn. Without those inputs, the durability case remains one level short of underwritten. Still, the sector mix itself does imply plausible expansion paths: more risk and compliance workflows inside banks, more imaging and clinical workflows inside hospitals, and more trade or security processes inside government agencies. The conclusion is favorable but qualified: expansion looks plausible, concentration still looks
    real, and retention proof is directionally positive rather than fully complete.'
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU022
