  - TU004
  - TU005
  figureRefs:
  - FU004
- id: concentration-procurement-and-adverse-evidence
  title: Concentration, procurement, and adverse evidence
  body: The customer-quality risks are not hidden; they are simply unresolved. A business with 68% of revenue in financial services is meaningfully exposed to one sector even if the sector itself is attractive. Top-customer concentration is unknown. Public-sector procurement adds another friction layer, especially where trust, policy compliance, and formal governance matter. Adverse market evidence reinforces the caution. BCG says most enterprises still struggle to scale AI value, and Sequoia warns that infrastructure demand narratives can outrun end-customer monetization. Those warnings do not negate Aether’s traction, but they do argue against over-reading logos and headline counts. The right verdict is that Aether appears to have reached the correct customer archetypes and may be expanding within them, yet the public record still lacks the contract, cohort, and concentration data needed to prove the base is durable across cycles and procurement regimes. That missing granularity is the
    main reason the customer chapter remains cautious rather than fully bullish.
  claimRefs:
  - CU021
  - CU023
  - CU026
  - CU027
