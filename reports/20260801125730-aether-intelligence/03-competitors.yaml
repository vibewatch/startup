- id: distribution-and-switching-cost
  title: Distribution and switching cost — Aether can land where trust matters, but expansion still runs into cloud gravity
  body: 'The main commercial problem is that incumbents do not need to beat Aether on every feature to win. They can enter through existing cloud, procurement, security, or transformation relationships and let buyers extend workloads on top of infrastructure they already trust. That is especially relevant in regulated accounts because the control environment around the platform can matter as much as the platform itself. Named verticals such as banking, healthcare, and government validate that the opportunity exists, but they do not insulate Aether from bundle pressure. In fact, they can heighten it by attracting the largest, best-capitalized vendors. Switching costs are real once workflows, governance controls, and data pipelines are embedded, yet they are not absolute: customers can multi-home, combine base-cloud tooling with third-party layers, or build internally for specific workloads. The result is a competitive environment where Aether may land through local credibility but still has
    to defend every expansion against much larger distribution machines.'
  claimRefs:
  - CP011
  - CP012
  - CP013
  - CP021
