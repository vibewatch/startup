summary:
  headline: >-
    Track: ShareChat still owns meaningful vernacular-social and short-video scale in India and has repaired operations
    faster than many consumer-internet peers, but the stale $5 billion mark remains stretched until cleaner financing
    terms, audited cash-flow proof, and steadier leadership support a firmer IPO case.
