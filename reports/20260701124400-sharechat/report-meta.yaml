companyProfile:
  summary: >-
    ShareChat is Mohalla Tech's vernacular-internet platform built around two consumer surfaces: the flagship ShareChat social product and Moj, the company's short-video and now short-drama app. The business still has exceptional India-specific distribution in regional-language social content and creator-led entertainment, but the current investment question is no longer whether the audience exists. It is whether management can convert that scale into durable, higher-quality monetization after a 2022 peak valuation, a 2024 financing reset, repeated layoffs, and a strategy shift toward profitability, subscriptions, and premium drama content.
