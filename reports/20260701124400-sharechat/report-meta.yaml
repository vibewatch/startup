  topStrengths:
    - Large combined ShareChat-plus-Moj reach gives the company a real Bharat distribution moat and advertiser relevance in regional-language internet categories.
    - Management has shown a visible operating-repair arc, with revenue rising, adjusted EBITDA losses narrowing sharply, and the core ShareChat business described as cashflow positive in FY25.
    - The product stack is broader than one app, spanning social, short video, live gifting, creator monetization, subscriptions, and premium short-drama experiments.
    - The cap table still includes blue-chip strategic and crossover investors such as Google, Temasek, Lightspeed, Snap, and X/Twitter, which supports ecosystem relevance even after the reset.
  topRisks:
    - The last clean $5 billion valuation is stale, while later convert and debt financings imply a much lower current clearing price and opaque preference economics.
    - Public disclosure is still weak on current cash, debt or convertible terms, realized ad pricing, creator payout waterfalls, and true revenue quality.
    - Repeated layoffs, founder-role contraction, and later senior commercial churn raise governance and execution questions ahead of any IPO process.
    - Advertisers and agencies still voice concerns about creator quality, attribution, conversion intent, and brand safety versus Meta and YouTube.
    - Policy, moderation, privacy, and app-store or platform-governance issues can still transmit quickly into growth, monetization, and listing readiness.
  unresolvedGaps:
    - Audited FY25 and FY26 financial statements with full cash-flow bridge, current unrestricted cash, and financing obligations.
    - Exact term-sheet detail for the 2024 debt or convertible financings, including coupon, maturity, conversion triggers, and preference stack.
    - Cohort-level retention, payer density, creator payout waterfall, and realized advertiser pricing or repeat-spend data.
    - Board composition, committee independence, and concrete IPO-readiness workstreams across auditors, controls, and venue planning.
disclaimer: >-
  This report is a public-information diligence snapshot prepared as of 2026-07-01. It is not investment advice. Several underwriting-critical inputs remain undisclosed by ShareChat, especially audited current-period financial statements, financing terms, and detailed monetization-quality cohorts.
