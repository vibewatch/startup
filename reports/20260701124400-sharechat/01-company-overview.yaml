  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-visibility
    missingEvidence: A current board list, committee structure, and investor-rights summary for Mohalla Tech.
    whyItMatters: Founder-role contraction and repeated restructurings make formal governance visibility important to assessing control and escalation paths.
    diligencePath: Request the latest board deck or shareholder-rights summary alongside any observer, veto, or reserved-matter schedule.
    relatedQuestionRefs:
    - QO009
    - QO024
    relatedTableRefs:
    - TO002
    - TO003
  - type: stale
    severity: material
    topic: headcount-freshness
    missingEvidence: A current 2026 employee count by platform and function.
    whyItMatters: Public headcount disclosures lag the current turnaround story, which makes operating leverage and execution capacity hard to underwrite.
    diligencePath: Ask management for the latest monthly headcount bridge from peak staffing through the current quarter, split by ShareChat, Moj, and new bets.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-terms
    missingEvidence: The live cap table, 2024 debt terms, covenant package, and any liquidation-preference stack.
    whyItMatters: Public sources show structured funding and valuation pressure, but not the rights or downside protection attached to the latest capital.
    diligencePath: Request the cap table, debt schedule, and the most recent financing documents, including maturity, pricing, and security terms.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: valuation-reconciliation
    missingEvidence: A management-confirmed current valuation bridge explaining the move from the 2022 peak to later debt-heavy financing and the reported 2023 down-round terms.
    whyItMatters: Public valuation references span near-$5B peak marks and sub-$1.5B down-round talk, which materially affects ownership dilution and return math.
    diligencePath: Ask for the last priced-equity mark, any implied conversion terms on debt, and any internal or investor-mark valuation memos.
    relatedQuestionRefs:
    - QO012
    - QO025
    relatedTableRefs:
    - TO001
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-resolution
    missingEvidence: Primary documents for exact close dates, final consideration, and post-close outcomes on select launches, debt rounds, and product shutdowns.
    whyItMatters: The public milestone spine is strong enough for overview work, but exact deal and shutdown mechanics matter when later chapters test strategy quality and capital efficiency.
    diligencePath: Request press-release packets, board approvals, and internal timeline summaries for the MX TakaTak integration, debt raises, and QuickTV rollout.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO004
