- id: scale-milestones-and-visible-risks
  title: Scale, Milestones, and Visible Risks
  body: 'ShareChat still has a legitimate scale story. The company''s current official surfaces and recent press coverage cluster around a combined ShareChat-plus-Moj audience of roughly 325 million monthly actives, more than 30 minutes of daily time spent, heavy regional-language reach, and a meaningful advertiser proposition in Bharat. The company has also been willing to keep changing the product mix: Moj launched quickly after TikTok''s ban, the MX TakaTak deal consolidated short video, and the latest visible growth bet is micro-drama through QuickTV and Moj+.


    The risk surface is equally visible. The company has undergone repeated workforce reductions, large founder-role contraction, and a major valuation markdown while the broader Indian short-video market has proved harder to monetise than user numbers initially suggested. Storyboard18''s advertiser feature is particularly useful here because it captures both the bullish company pitch and the skeptical buyer view: management argues that Bharat audiences, creator-led campaigns, and brand-safe regional reach are a strength, while agency voices still worry about creator quality, attribution, conversion intent, and brand safety relative to Meta and YouTube. The result is a company with genuine distribution, culturally specific product-market fit, and recent profitability progress—but still one whose investability depends on proving that engagement can convert into repeatable, high-quality revenue at a scale commensurate with the capital already raised.'
