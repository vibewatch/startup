- id: privacy-safety-compliance-and-roadmap-risks
  title: Privacy, Safety, Compliance, and Roadmap Risks
  body: 'The public control surface is meaningful, but it also reveals how much operating burden ShareChat carries. The privacy
    policy discloses broad data inputs including login, content, search, chat, contacts, location, device, and media permissions,
    and explicitly ties them to language/location personalization, Mera Mohalla and Lokpriya feeds, targeted advertising,
    fraud prevention, and support. User-facing controls exist: private profiles restrict who can see posts or message/comment;
    account deletion requires authentication and includes a data-download path; SC Blue says masked IDs are deleted after
    review. Safety policy is also comparatively explicit. ShareChat''s 2026 content policy requires synthetic content disclosure,
    bars manipulative traffic generation, and documents a wide range of prohibited categories. Historical transparency reporting
    shows just how large the moderation burden can be, while the Vibely takedown shows that adjacent product launches can
    still collide with outside platform-governance rules even when the company says moderation controls exist. For diligence,
    the takeaway is that ShareChat has real policy, workflow, and review machinery, but investors should still treat moderation
    precision, per-language model quality, and roadmap timing as open technical risks because those metrics are not yet public.'
