- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / process / component
  - Role
  - Key dependency
  - Observed risk
  rows:
  - - AI / personalization layer
    - Turns content understanding and engagement signals into personalized distribution across ShareChat and Moj
    - Model quality, training data, and low-latency serving
    - No public per-language model-quality metrics
  - - Candidate retrieval + ranking flow
    - Fetches candidates, filters duplicates, scores/ranks with ML models, returns top results
    - Vector-database retrieval, dedup logic, model serving
    - Bad retrieval or ranking can reduce relevance even if app UX is intact
  - - Sent-post / viewed-post state
    - Balances duplicate prevention with avoiding suppression of unseen content
    - Correct event timing and durable user-level state
    - State drift can either repeat content or over-filter feeds
  - - Streaming and state infrastructure
    - Processes events and stores per-user history for feed logic
    - Redpanda, Flink, ScyllaDB, Kubernetes, and cost-tuned routing
    - Cost or autoscaling errors can directly affect latency
  - - Mobile interaction and media plumbing
    - Supports messaging-like persistence, video handling, and front-end safety signals
    - Persistent connection handling, client efficiency, media codecs, sanitization
    - Public repos show capability but not exact production usage
  - - Ads delivery and measurement stack
    - Serves campaigns, optimizes variables, and reports delivery statistics
    - Business account integrity, creative review, targeting criteria, and platform inventory
    - No performance guarantees; invalid traffic and under-delivery remain stated limitations
  - - Governance and policy layer
    - Applies privacy, moderation, synthetic-content, and deletion rules over product surfaces
    - Policy updates, human review, reporting systems, and external platform rules
    - Adjacent launches can still be blocked by app-store policy decisions
  notes: This table synthesizes explicit public architecture disclosures with developer-signal artifacts; it avoids claiming
    secret internal implementation details beyond what the reviewed sources actually name.
