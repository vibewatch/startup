  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: model-quality
    missingEvidence: Per-language recommendation quality, moderation precision or recall, and creator-tool lift metrics for
      ShareChat and Moj.
    whyItMatters: The core investment thesis depends on whether vernacular personalization and safety quality actually outperform
      global alternatives in production, not just in marketing copy.
    diligencePath: Request internal dashboards or experiment readouts showing ranking quality, moderation outcomes, and creator-surface
      conversion by language and content type.
    relatedQuestionRefs:
    - QE027
    - QE028
    relatedTableRefs:
    - TE004
    - TE005
  - type: stale
    severity: material
    topic: moderation-reporting
    missingEvidence: A current 2024-2026 transparency or enforcement dashboard covering user reports, takedown rates, and
      resolution SLAs.
    whyItMatters: Historical reporting proves that moderation is important, but stale public enforcement data makes it hard
      to judge whether current controls scaled with newer products and AI content rules.
    diligencePath: Ask management for the latest transparency reports, internal policy review cadence, and current moderation
      operations KPIs by product surface.
    relatedQuestionRefs:
    - QE014
    - QE027
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: production-dependencies
    missingEvidence: Explicit confirmation of which public GitHub repositories are active production dependencies for ShareChat
      or Moj rather than side projects or forks.
    whyItMatters: The GitHub footprint is a useful developer signal, but over-interpreting it could misstate the product architecture
      or the maturity of customer-facing features.
    diligencePath: Request an engineering walk-through that maps open-source repos, internal services, and production ownership
      for the consumer apps, ads stack, and creator systems.
    relatedQuestionRefs:
    - QE022
    - QE023
    - QE027
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: roadmap-timing
    missingEvidence: Public timing and success criteria for broader SC Blue rollout, SC Plus evolution, Moj+ monetization
      goals, and the future of Vibely-like adjacent experiments.
    whyItMatters: Without roadmap timing and launch criteria, investors cannot tell whether current paid or adjacent products
      are durable strategic bets or still mostly experimentation.
    diligencePath: Request the live product roadmap, rollout gates, pilot-to-GA criteria, and postmortems or decisions on
      adjacent experiments such as Vibely.
