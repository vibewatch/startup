- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Adjusted EBITDA loss FY24
    - INR 793 crore
    - high
    - Shows the magnitude of improvement versus FY23 and anchors the cost-reset narrative
    - Confirm audited bridge from adjusted EBITDA to operating cash flow
  - - Consolidated loss before tax FY24
    - ~INR 1,899 crore
    - high
    - Shows consolidated economics remain deeply negative despite better app-level performance
    - Request audited PBT to cash-flow reconciliation
  - - Ad gross margin
    - '>90%'
    - medium
    - Implies ad economics are structurally superior to the blended company margin
    - Request segment P&L and allocation of shared infra costs
  - - Livestreaming gross margin
    - ~35-40%
    - medium
    - Explains why a livestream-heavy mix dilutes overall margin quality
    - Request take-rate bridge, creator payout %, and gateway costs
  - - Server cost per user
    - -50% since start of 2024
    - medium
    - Supports management's profitability improvement story
    - Request infra-cost bridge by app and by view/gift transaction
  - - User acquisition spend
    - Near zero by late 2024
    - medium
    - Shows margin expansion partly came from pausing paid growth rather than only pricing power
    - Request monthly paid-marketing spend and attribution methodology
  - - Monthly burn
    - ~INR 5 crore by late 2024
    - medium
    - Key anchor for current solvency framing and runway estimation
    - Request monthly cash-burn history after financing and debt service
  - - CAC payback
    - 3-4 months (management claim)
    - low
    - If true, marketing reinvestment could be rational rather than value-destructive
    - Request cohort-level payback by channel and app
  - - Cost to earn INR 1 revenue
    - INR 3.68 in FY24 public-web proxy
    - medium
    - Reminds investors that full-company unit economics were still poor in FY24
    - Confirm methodology and whether finance cost is included
  notes: Values mix direct disclosures with third-party filing analysis and should be read as signposts, not a substitute for a true segment-level management P&L.
