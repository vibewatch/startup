- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Current unrestricted cash and month-end liquidity
    - Blocks reliable runway, covenant, and downside-case analysis
    - Request monthly cash bridge from Mar-2024 to latest month, including debt draws, interest, and working-capital uses
  - - Convertible-debenture terms
    - Blocks true dilution, cash-interest, and refinancing-risk assessment
    - Obtain executed debenture documents, board approvals, and any side letters
  - - Realized ad pricing, fill rate, and discounting
    - Blocks judgment on ad revenue quality and margin durability
    - Request campaign-level yield dashboards by format, category, and cohort
  - - Creator payout and gifting take-rate waterfall
    - Blocks understanding of whether livestreaming revenue can become structurally attractive
    - Request gross gift volume, platform take-rate, creator share, gateway fees, refunds, and abuse losses
  - - Top advertiser concentration and retention
    - Blocks durability assessment for the ad business after gaming/crypto pullback
    - Request top-20 advertiser revenue, churn, renewal, and sector mix across FY24-FY26
  - - SC Plus / SC Blue subscriber counts and ARPPU
    - Blocks sizing of consumer-subscription optionality
    - Request subscriber counts, paid conversion, churn, renewal, and revenue-recognition policy
  - - Audited FY25 segment P&L and cash flow
    - Blocks confirmation that the late-2024 burn reduction persisted through FY25 close
    - Request audited FY25 statements and segment bridge for ads vs livestreaming vs other
  notes: These are the minimum missing data points for full underwriting; each one materially changes the interpretation of ShareChat's improving but still opaque financial story.
