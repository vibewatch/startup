- id: TI002
  title: Pricing / monetization table
  columns:
  - Product
  - Price / unit / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source
  rows:
  - - Self-serve ads
    - Advertiser-selected bid price; monthly billing in INR
    - List mechanics are public; realized auction-clearing price is private
    - Actual CPM/CPC, discounting, fill rate, and make-goods are not public
    - ShareChat Ads home; self-serve ad terms
  - - Lead ads
    - Commercial terms via insertion order plus policy disclosures
    - Mechanism is public; economics are bespoke
    - No public CPL benchmarks or pricing schedules
    - Lead Ad Terms
  - - SC Plus
    - INR 1 first month for new subscriber; recurring price basis actuals after promo
    - Intro pricing is public; steady-state pricing and attach rate are not
    - Renewal pricing and cohort mix are undisclosed
    - SC Plus FAQ
  - - SC Blue
    - INR-denominated subscription with annual plan enabling gifting access
    - Payments rails are public; sticker price is not visible on the web
    - Plan pricing, refunds, and attach by creator segment are undisclosed
    - SC Blue FAQ
  - - Livestreaming / gifting
    - Platform takes a share of user gifting volume
    - Take-rate implied only indirectly through margin commentary
    - Token pricing, payout cadence, creator share, and gateway leakage are undisclosed
    - Financial Express; official funding/results posts
  - - Influencer / branded campaigns
    - Negotiated campaign economics with creators and brands
    - Evidence shows campaigns exist, not what ShareChat keeps
    - Platform fee, agency role, and measurement-linked rebates are undisclosed
    - Mediainfoline; Storyboard18 advertiser-confidence
  notes: This table distinguishes public list mechanics from realized economics; unknowns are meaningful because ShareChat's external materials emphasize access and format, not monetization yield.
