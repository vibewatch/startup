  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-liquidity
    missingEvidence: Current unrestricted cash, minimum-cash policy, and monthly liquidity bridge after the 2024 convertible financing.
    whyItMatters: Without current unrestricted cash, public burn commentary cannot be translated into a reliable runway or downside case.
    diligencePath: Request month-end cash balances, bank statements, and management cash-flow bridge from Mar-2024 through the latest closed month.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: debenture-terms
    missingEvidence: Coupon, maturity, conversion floor/cap, covenants, security package, and lender ranking for the 2024 convertible debentures.
    whyItMatters: The financing structure determines dilution, cash-interest burden, refinancing pressure, and what valuation-reset language really means.
    diligencePath: Obtain executed debenture instruments, board approvals, side letters, and updated cap-table waterfalls from counsel or finance.
    relatedQuestionRefs:
    - QI016
    - QI023
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: realized-ad-pricing
    missingEvidence: Campaign-level CPM/CPC, fill-rate, discount, and yield data by format, language, and advertiser cohort.
    whyItMatters: Public list mechanics do not reveal whether ad revenue quality is scaling or merely supported by aggressive discounting and opaque make-goods.
    diligencePath: Request internal ad-yield dashboards and cohort retention for top advertisers across FY24-FY26.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI002
  - type: missing-source
    severity: material
    topic: creator-take-rate
    missingEvidence: Gross gifting volume, platform take-rate, creator payout share, refund rates, and payment-gateway leakage for livestreaming revenue.
    whyItMatters: Livestreaming is currently the larger disclosed revenue line, so without payout-waterfall data the margin path cannot be fully underwritten.
    diligencePath: Request livestreaming gross-profit bridge and creator payout ledger by month, platform, and payer cohort.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI001
    - TI003
  - type: private-evidence-only
    severity: material
    topic: advertiser-concentration
    missingEvidence: Top-20 advertiser contribution, sector mix, renewal, churn, and exposure to gaming/crypto or other cyclical ad categories.
    whyItMatters: The FY24 miss versus internal target and external skepticism around conversion quality both make revenue concentration a real valuation issue.
    diligencePath: Request top-account revenue cube and vertical concentration analysis for FY24, FY25, and year-to-date FY26.
    relatedQuestionRefs:
    - QI021
    - QI027
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: minor
    topic: subscription-optionalities
    missingEvidence: Subscriber counts, ARPPU, renewal, and churn for SC Plus and SC Blue.
    whyItMatters: The products prove optional monetization, but without attach and retention data they should not influence valuation materially.
    diligencePath: Request subscription dashboards and revenue-recognition memo for consumer premium products.
    relatedQuestionRefs:
    - QI005
    - QI027
    relatedTableRefs:
    - TI002
    - TI005
  - type: stale
    severity: material
    topic: fy25-audited-financials
    missingEvidence: Audited FY25 segment revenue, gross margin, EBITDA bridge, and cash-flow statement.
    whyItMatters: Late-2024 commentary is encouraging, but without audited FY25 statements investors cannot verify whether the burn reset persisted through year-end.
    diligencePath: Obtain FY25 audited statements, management discussion, and segment bridge for ads, livestreaming, and other revenue.
    relatedQuestionRefs:
    - QI023
    - QI027
    relatedTableRefs:
    - TI004
    - TI005
