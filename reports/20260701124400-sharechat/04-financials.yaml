- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - April 2024 financing
    - US$49M convertible debentures
    - high
    - Confirms fresh capital was needed even as profitability messaging improved
    - Request coupon, maturity, conversion floor/cap, covenants, and ranking
  - - 2024 capital-in / latest valuation
    - ~US$65M at ~US$1.5B valuation in public reporting
    - medium
    - Shows the capital raise came at a much lower implied valuation than the 2022 peak
    - Reconcile debt and equity tranches and actual post-money cap table
  - - Cumulative capital raised
    - ~US$1.2-1.3B
    - high
    - Indicates the company is heavily venture-funded, not self-financed
    - Request full round-by-round capitalization table and secondary history
  - - FY24 ending cash and bank balance
    - INR 36.2 crore
    - medium
    - Useful but stale liquidity anchor
    - Request current unrestricted cash, minimum cash policy, and debt-service schedule
  - - Finance cost FY24
    - INR 510.57 crore
    - medium
    - Suggests debt and financing structures materially affect cash generation
    - Request split between cash interest, accrued interest, FX, and fair-value effects
  - - Public runway proxy
    - ~7 months on FY24-end cash and late-2024 burn, but unreliable
    - medium
    - Shows why current runway cannot be inferred cleanly from public data
    - Request month-end cash balances after the 2024 financing and any subsequent draws/repayments
  - - Filing-derived FY25 revenue band / bank charge
    - INR 500-750 crore range; HDFC Bank charge shown by Tofler
    - medium
    - Signals the business still carries debt-linked encumbrances and incomplete disclosure
    - Obtain audited FY25 financials and full charge register directly from the company
  notes: 'Capital adequacy is framed conservatively: public sources prove financing and some stale balance-sheet points, but not current free liquidity or full debt terms.'
