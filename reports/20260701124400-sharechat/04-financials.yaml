- id: capital-adequacy-and-balance-sheet-risk
  title: Capital adequacy and balance-sheet risk
  body: 'ShareChat bought itself time in 2024, but the terms of that time matter. In April 2024 the company raised US$49 million via convertible debentures and said the proceeds would go into ad-targeting technology plus consumer transactions on ShareChat Live and Moj Live. Independent coverage later framed total 2024 capital raised closer to US$65 million and the effective valuation nearer US$1.5 billion, while TechCrunch reported the convert would price below US$2 billion in the next round. Relative to the 2022 peak, the market message is clear: investors still back the company, but at a materially lower price and with debt-like structure rather than a euphoric common-equity step-up.


    The harder issue is present liquidity. Entrackr''s filing-based analysis says FY24 ended with only INR 36.2 crore of cash and bank balances and INR 128.96 crore of current assets, while finance cost and borrowings were still rising. Tofler adds a FY25 operating-revenue band of INR 500-750 crore and shows an HDFC Bank asset charge, but most detailed line items remain gated. A naive runway calculation using late-2024 burn against FY24-end cash points to only about seven months, yet that is intentionally conservative and stale because it excludes the 2024 financing and any subsequent cash use. The right interpretation is not imminent insolvency; it is that the current runway cannot be credibly underwritten from public evidence alone.'
