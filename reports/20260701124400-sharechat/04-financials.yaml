- id: financial-verdict-and-blockers
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is directionally positive but still incomplete. ShareChat has proven it can grow revenue, reduce burn, shrink infrastructure cost, and lift app-level profitability even after the 2024 valuation reset. Advertising looks like the cleaner economic engine with gross margin above 90%, while livestreaming remains strategically important but structurally lower margin at roughly 35-40%. That mix means the company is not yet a simple high-gross-margin ad platform, and the missed FY24 revenue target is a reminder that monetization still depends on advertiser-category mix and product maturity.


    The unresolved blockers are practical rather than theoretical. Public evidence still does not show current unrestricted cash, the coupon/maturity/conversion guardrails on the debentures, realized ad pricing and discounts, creator payout waterfalls, subscription attach rates, or top-advertiser concentration. Storyboard18''s advertiser-confidence piece also shows why those missing fields matter: brands still debate conversion quality, attribution, and creator professionalism relative to Meta and YouTube. In other words, ShareChat now looks financeable as a stabilizing consumer-internet platform, but not yet fully underwritable as a margin-rich compounding asset without private data-room access.'
