- id: cost-base-and-unit-economics
  title: Cost base and unit economics
  body: 'The cost reset is real. Adjusted EBITDA loss fell 67% year over year to roughly INR 793 crore, total expenses fell 33.2%, employee-benefit cost dropped to INR 580.39 crore, and server rent fell 45.3% to INR 559.57 crore. Management separately says server cost per user has fallen 50% since the start of 2024 and that improved ranking quality let user-acquisition spend fall to near zero. Those facts, taken together, show that ShareChat is no longer spending as if it were still in 2021-style land grab mode.


    But the underlying economics are still mixed rather than clean. Consolidated FY24 loss before tax remained near INR 1,899 crore, finance cost rose to INR 510.57 crore, and Entrackr''s public-web unit-economics proxy still shows INR 3.68 spent for every INR 1 of operating revenue in FY24. The encouraging late-2024 datapoints are that the ShareChat app itself crossed 15% EBITDA margin, Moj became operationally profitable excluding salaries, and the CFO said consolidated burn had fallen to about INR 5 crore per month with CAC payback of three to four months. The problem for an investor is that these are management disclosures rather than full audited bridge data. Public evidence supports real improvement, but not yet a fully underwritten margin model.'
