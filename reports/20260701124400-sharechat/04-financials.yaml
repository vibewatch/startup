chapter:
  number: 4
  title: Financials
  summary: ShareChat disclosed FY24 revenue of INR 718 crore with livestreaming slightly larger than ads, cut adjusted EBITDA losses sharply, and reported late-2024 burn of roughly INR 5 crore per month. The underwriting challenge is that current cash, debt terms, realized pricing, and creator payout take-rates remain opaque even after a 2024 valuation reset and repeated restructurings.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization stack
  body: 'ShareChat''s public revenue picture is much stronger than it was two years ago, but it still does not look like a clean software P&L. FY24 revenue reached INR 718 crore, with advertising contributing about INR 315 crore and livestreaming contributing roughly INR 402-403 crore. That means the higher-margin ad business is important but not yet dominant: livestreaming appears to be the larger line, so blended revenue quality still depends on creator payouts, payment rails, and the health of consumer transaction flows. The official disclosures also show better monetization density, with advertising revenue per user up 25% and livestreaming margin up by nearly ten percentage points.


    The monetization stack is broader than ads alone. ShareChat runs self-serve and lead-ad products, says the platform has supported thousands of SMB advertisers, and sells paid consumer products such as SC Plus and SC Blue. Official and company-linked materials also describe creator monetization through live streaming, virtual gifting, and branded collaborations. That diversity matters because it reduces dependence on one surface, but it does not remove diligence risk. Realized ad pricing, discounts, fill rates, subscription attach rates, and creator payout take-rates are still undisclosed, so public sources prove mechanism better than monetization quality.'
