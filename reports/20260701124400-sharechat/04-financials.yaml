tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Advertising
    - Brand ads sold through ShareChat Ads across in-feed and video inventory
    - INR revenue / auction-priced campaigns
    - INR 315 crore FY24; >90% gross margin per CFO commentary
    - High-margin but pricing disclosure is external-user opaque
    - Request realized CPM/CPC, fill rate, discounting, and top-category mix
  - - Livestreaming / virtual gifting
    - Users buy virtual goods and transact in live formats on ShareChat and Moj
    - INR revenue / take-rate on transactions
    - INR 402-403 crore FY24; ~35-40% gross margin
    - Largest line but lower-quality margin than ads because creators and gateways share economics
    - Request take-rate waterfall, creator payout %, refund rates, and payer cohorts
  - - SC Plus subscription
    - Paid ad-light subscription with personalized sharing
    - Subscriber count / ARPPU
    - Product is live; first month advertised at INR 1 for new buyers
    - Proof of existence is good; revenue significance unknown
    - Request active subscribers, renewal rate, ARPPU, and revenue recognition policy
  - - SC Blue subscription
    - Paid blue-tick / ad-light individual subscription with gifting access on annual plans
    - Subscriber count / ARPPU
    - Product is live for eligible individual accounts; INR payments supported
    - Likely experimental rather than material today
    - Request paying-account count, annual-plan mix, churn, and gross margin
  - - Lead ads and self-serve SMB ads
    - Auction inventory plus lead-capture products sold to brands and SMBs
    - Advertiser count / campaign spend
    - 2,400+ SMBs cited in 2022; SMB and mid-market expansion still cited in 2023-2025 materials
    - Good GTM breadth signal, weak public spend visibility
    - Request active advertiser count, average spend, and repeat-rate by cohort
  - - Brand collaborations / creator campaigns
    - Influencer campaigns and brand collabs run through Moj and ShareChat creators
    - Campaign count / platform fee
    - 75 brands and ~150 customized campaigns cited in one six-month period
    - Useful demand proof but fee capture undisclosed
    - Request platform fee, creator payout split, and repeat-campaign economics
  notes: Rows separate proved monetization mechanisms from public-evidence quality; unknown realized pricing and payout splits remain deliberate diligence asks rather than implied nulls.
