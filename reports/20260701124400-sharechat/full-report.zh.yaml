      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的结构性增长驱动仍在需求端。印度互联网基数继续扩大，区域语言使用已经是主流而非小众，短视频也成了数亿用户的默认格式。IAMAI/Kantar 2025 年发布内容把 AI
              功能、短视频消费和电商列为主要扩张引擎；Redseer 显示，寓教于乐和微短剧等新媒体格式已经在二线 / 三线受众中成形；BCG 显示，品牌计划在未来两到三年把创作者预算提高 1.5x 至 3x。变现端，WPP
              和 Dentsu 都描述了数字广告市场正在转向商业、视频、社交和结果导向媒体；EY 则显示，数字媒体已经成为印度最大的 M&E 板块。


              约束同样实质。第一，公开市场规模测算仍不一致，WPP 与 Dentsu 对总 AdEx 的判断相距很远，IAMAI 与 Kepios 也采用不同互联网用户方法。第二，ShareChat
              特有的变现质量仍有争议：Storyboard18 描述了广告主对归因、转化质量和品牌安全感知的谨慎，即便 ShareChat 称其服务 75% 的顶级 BARC ADEX 品牌。第三，合规成本正在上升。印度
              2025 年中介机构规则修订收紧了下架治理，MeitY 规则草案将要求合成内容标签和声明工作流。DPDP Rules 2025
              还带来数据治理义务和有意义的财务处罚。合在一起，这些压力说明市场增长很快，但并非所有增长都能被本土语言平台以同等质量变现或增厚利润率。
