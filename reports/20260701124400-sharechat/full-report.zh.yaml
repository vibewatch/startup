  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 上一轮定价标记与当下成交价
        blocks:
          - type: paragraph
            body: >-
              ShareChat 估值的起点并无争议：最后一个干净的公开股权里程碑，是公司在 2022 年 6 月宣布多批次融资以 $5 billion
              估值完成。这个数字仍重要，因为它是最后一个明确披露、与知名投资人和公司自发公告绑定的定价标记。更难的问题是，到 2026 年它是否仍能作为入场参考。2022 峰值之后的公开证据表明不能。TechCrunch
              2023 年 12 月报道，新融资谈判可能把 ShareChat 定价低至 $1.5 billion 以下；Moneycontrol 另报道 2023 年 12 月可转票据流程约为 $2.7
              billion，随后又引用媒体报道，称 2024 年 4 月风险债务轮约在 $1.5 billion。后续数据点都不如定价股权轮干净，但合在一起说明，可投资的成交价已远低于 $5 billion
              标题标记。因此，$5 billion 是历史参照，不是当前可直接写入投资假设的事实；这也意味着，新投资人应同样关注工具条款、稀释和优先清偿栈，而不只看名义估值标题。
