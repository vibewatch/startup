            body: >-
              本土比较组仍然重要，因为它显示 TikTok 封禁窗口打开后哪些做法有效、哪些没有。ShareChat 自己的申报文件显示，公司正通过直播和聊天室大量变现，同时缩小亏损；但 Moj
              的反向证据说明，规模韧性没有公司顶线叙事暗示的那么确定。ShareChat 在并购期和管理层说法中仍指向很大的 MAU 与创作者数字；然而 Inc42 基于 data.ai 的报道显示，Moj、Josh 和
              Roposo 在 2023 年都失去 MAU，而 Instagram 继续增长。Josh 和 Dailyhunt 的母公司 VerSe 仍是最相关的本土同业，因为它同时拥有比 ShareChat
              更大的内容图谱和更大的披露收入基础；但它同样在削减烧钱，并依赖管理层提供的用户数字。Chingari 和 Roposo
              更小，但它们重要，因为它们显示了同一个品类真相：用户说法可以很大，变现质量、创作者留存和资本效率却难证明得多。
