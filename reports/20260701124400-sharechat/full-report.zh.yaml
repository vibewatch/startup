  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局概览与竞争分类
        blocks:
          - type: paragraph
            body: >-
              ShareChat 同时在两个重叠市场竞争：由 ShareChat 主导的本土语言社区信息流，以及由 Moj 主导的短视频注意力。印度封禁 TikTok 后形成的本土同业仍然重要——Josh、Chingari 和
              Roposo 都依然是本地语言内容、直播商业或创作者供给的参照点——但如今替代压力主要来自全球巨头。Instagram Reels 和 YouTube Shorts
              已成为最清晰的注意力与创作者流动性替代品，Snapchat Spotlight 是有意义的年轻受众替代品，Roposo/Glance 则通过 Android
              锁屏提供非信息流分发路径。因此，本章讨论的竞争更多是非对称，而不是功能对等：本土应用仍掌握部分 Bharat
              语言和直播社交细微差异，但全球平台带来更大的触达、更强的变现轨道和资本更充足的母公司栈。结果是，ShareChat 必须守住更窄的本地护城河，同时在一个越来越由 Meta、Google 和
              Snap，而不是其他印度创业公司设定基准的市场里竞争。
