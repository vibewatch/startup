  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现栈
        blocks:
          - type: paragraph
            body: >-
              ShareChat 的公开收入画面比两年前强得多，但仍不像一个干净的软件 P&L。FY24 收入达到 INR 718 crore，其中广告贡献约 INR 315 crore，直播贡献约 INR 402-403
              crore。这意味着利润率更高的广告业务重要，但尚未占主导：直播似乎是更大的收入线，因此混合收入质量仍取决于创作者支付、支付轨道和消费者交易流的健康程度。官方披露也显示变现密度提高，广告单用户收入增长
              25%，直播利润率提高近 10 个百分点。


              变现栈不止广告。ShareChat 运营自助投放和线索广告产品，称平台已支持数千家 SMB 广告主，并销售 SC Plus 和 SC Blue
              等付费消费者产品。官方和公司关联材料还描述了通过直播、虚拟礼物和品牌合作进行创作者变现。这种多样性重要，因为它降低对单一入口的依赖，但并不消除尽调风险。已兑现的广告定价、折扣、填充率、订阅附着率和创作者支付抽成率仍未披露，所以公开来源更能证明机制，而不是变现质量。
