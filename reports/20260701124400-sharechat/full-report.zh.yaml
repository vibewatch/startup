      - number: '2.5'
        title: 尽调缺口与投资含义
        blocks:
          - type: paragraph
            body: >-
              主要市场问题已经不是印度本土语言短视频市场是否存在；它显然存在。更难的问题是，这部分需求有多少能以有吸引力的单位经济性转成广告主支出和平台收入。公开来源没有披露 ShareChat/Moj
              的活跃广告主数量、重复广告主留存、按语言划分的平均 CPM、创作者支付抽成率，或两个应用合计 325 million MAU 之间的重叠。因此，公司的理论触达可以测算，但真实 SOM 不能干净拆出。


              对投资人而言，实用结论是分开看三条曲线。受众曲线强：区域语言和二线 / 三线增长仍在复利。创作者商业曲线有希望：BCG 和 Qoruz
              都显示品牌资金正在流向创作者，尤其围绕高注意力事件和本土语言互动。转化曲线最缺证明：第三方营销人员仍把 Moj 和 ShareChat 视为效果结果上的实验渠道，而监管栈正变重，恰逢 AI
              生成内容和直播变现入口扩张。除非公司披露更多广告主质量、重复支出和创作者变现效率，否则市场应被估值为一个快速增长但仍在收敛的本土语言注意力平台，而不是一个完全成熟的效果广告网络。
