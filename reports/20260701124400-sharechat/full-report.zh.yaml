  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标细分市场
      - 差异化
      - 相对 ShareChat/Moj 的局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the main domestic peers and global substitutes repeatedly cited across fetched public sources as of the
        2026 run date; excludes niche creator tools and pure messaging apps without short-video evidence in this
        chapter.
    rows:
      - - ShareChat / Moj
        - 本土基准
        - 已融资约 $1.3B；FY24 收入 ₹718.1 Cr；合并时期 Moj 声称 MAU 160M
        - 本地语种社交用户、创作者、直播受众
        - 印度优先的本地语种身份定位，叠加直播社交变现和微短剧试验
        - 当前 Moj 规模受到独立跟踪数据质疑；广告技术栈和创作者分成也不如 大科技对手透明
      - - Josh / Dailyhunt (VerSe)
        - 本土直接同行
        - 2024 年声称 Josh MAU 139M、DAU 68M；Dailyhunt 声称用户 >350M；融资 >$1.5B
        - 区域语言内容消费者、创作者、出版方
        - 借 Dailyhunt 形成语言图谱和新闻 / 内容网络
        - 用户数据来自公司自称；VerSe 仍在压低烧钱并争取盈亏平衡
      - - Instagram Reels
        - 全球在位替代品
        - Meta India FY24 总广告收入 ₹22,730 Cr；委托研究称 Reels 是印度首选 SFV 平台
        - 大众短视频和品牌发现受众
        - Meta 生态内最大的广告投放栈，并宣称创作者互动强
        - 本组材料中的印度领先证据由 Meta 委托，不是独立研究
      - - YouTube Shorts
        - 全球在位替代品
        - 印度广告触达 500M（2025 年末）；印度 Shorts 播放量达数万亿；印度 1M+ 订阅频道 11K+
        - 视频创作者、广告主、大众娱乐受众
        - 正式创作者收入分成，加上庞大的创作者基数和观看时长规模
        - 触达数据是广告触达和公司引用的 Comscore 指标，并非直接披露 MAU
      - - Snapchat Spotlight
        - 相邻在位替代品
        - 2025 年印度 MAU 250M；120M+ 用户观看 Stories/Spotlight
        - 年轻、相机优先、由创作者带动的受众
        - 13-34 岁集中度高，印度创作者通过 Spotlight/Stories 的分发在增长
        - Snapchat 使用场景宽于短视频，直接可比性有限
      - - Roposo / Glance
        - 本土相邻同行
        - 声称有 80M 活跃用户；直播电商叠加 200M+ Glance 锁屏分发
        - Z 世代娱乐、直播购物、创作者电商
        - 锁屏分发和购物娱乐，不只是信息流消费
        - 公开证据来自公司自称，且电商色彩更重，并非纯社交视频
      - - Chingari
        - 较小本土同行
        - FY23 收入 ₹113.1 Cr+、融资 $88.34M+、员工 158 人，但数据置信度低
        - Bharat 娱乐用户和直播受众
        - 本土品牌，尝试直播和区块链时期的变现
        - 裁员、亏损扩大、代币价格崩盘，显示业务韧性弱
    notes: 本表混合了公司自称规模、独立财务报道和广告触达估算；各项数据并非同口径，应该读作方向性的竞争信号， 而不是经审计的市场份额。
