      - number: '2.2'
        title: 多重视角下的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              单一「TAM」数字会误导，因为这个市场至少可以从三个不等价视角来测算。用户注意力视角从印度互联网基数出发：IAMAI/Kantar 统计 2024 年活跃用户 886 million、2025 年 958
              million；DataReportal/Kepios 则估计 2025 年末互联网用户 1.03 billion、社交媒体身份 500 million。这个差距重要，因为 ShareChat
              变现的是活跃注意力，而不是原始注册数。第二个视角是广告主钱包规模。Dentsu 估计印度 2025 年总 AdEx 为 Rs 1,21,339 crore，并预测 2026 年为 Rs 1,30,416
              crore，其中 2025 年数字广告为 Rs 71,621 crore，社交加在线视频合计 Rs 41,061 crore。不过，WPP 预测 2026 年广告市场要大得多，达到 Rs 2,01,891
              crore，数字广告占收入 68.1%。Dentsu 与 WPP 对 2026 年总量预测相差 55%，差距太大，不能抹平；它很可能反映了数字延伸、商业媒体和更宽计量范围上的纳入规则不同。


              第三个视角是创作者影响的商业。BCG 估计印度已经有 2 million 至 2.5 million 可变现创作者，影响 USD 350-400 billion 的消费者支出；到 2030
              年，创作者影响的消费将超过 USD 1 trillion。这不等于平台收入，但解释了为什么围绕 Moj 的投资人叙事越来越把广告库存、创作者变现和商业发现揉在一起。EY/FICCI
              还提供了第四个有用邻接视角：数字媒体在 2025 年突破 Rs 1 trillion，仅数字广告就达到 Rs 947 billion，其中超过 1 million 家 SME 和长尾广告主贡献 Rs 363
              billion。做估值时，ShareChat/Moj 最保守的 SAM 是 Dentsu 2025 年社交媒体加在线视频池；更扩张的 SAM 会叠加创作者商业和直播变现，但这些变现率并未公开披露。
