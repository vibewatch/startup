  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 法律、审核与事件冲击，都可能传导到创作者供给、广告主信心、收入质量与融资选择。
    data:
      nodes:
        - id: legal
          label: 版权 / 安全港冲击
          detail: Zee 案结果不利，或中介责任保护收窄
        - id: mod
          label: 审核 SLA 承压
          detail: 快速下架、申诉、误杀、漏判
        - id: trust
          label: 信任 / 品牌安全受挫
          detail: 用户、创作者和广告主失去信心
        - id: creators
          label: 创作者 / 内容供给承压
          detail: 内容库限制或政策摩擦压低产出
        - id: ads
          label: 广告收入质量受挫
          detail: 预算组合转回 Meta / YouTube
        - id: arr
          label: FY26 增长 / ARR 未达预期
          detail: 年化收入与盈利目标滑坡
        - id: capital
          label: 融资 / IPO 压力
          detail: 估值、稀释与公开市场准备度恶化
      edges:
        - from: legal
          to: creators
          label: 约束
        - from: legal
          to: trust
          label: 损害
        - from: mod
          to: trust
          label: 侵蚀
        - from: trust
          to: ads
          label: 削弱
        - from: creators
          to: ads
          label: 降低广告库存质量
        - from: ads
          to: arr
          label: 放慢
        - from: arr
          to: capital
          label: 收紧
        - from: mod
          to: capital
          label: 增加监管阴影
    claimRefs:
      - CR006
      - CR008
      - CR013
      - CR025
      - CR032
      - CR034
      - CR035
      - CR042
      - CR043
      - CR044
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: ShareChat 同时依赖移动分发、云基础设施、版权供给、广告主，以及一支精简执行团队。
    data:
      nodes:
        - id: play
          label: 应用商店分发
          detail: Google Play 与移动应用入口
        - id: cloud
          label: AWS / Google Cloud
          detail: 存储、分发与平台运营
        - id: rights
          label: 音乐 / 权利方
          detail: 音频库与创作者工作流
        - id: brands
          label: 广告主 / 代理商
          detail: 需求质量与衡量信任
        - id: team
          label: 执行团队
          detail: 政策、法务、产品、广告与审核纵深
        - id: moj
          label: Moj / QuickTV 产品组合
          detail: 短视频加微短剧变现
        - id: economics
          label: 持久盈利能力
          detail: ARR 增长、利润率与融资准备度
      edges:
        - from: play
          to: economics
          label: 限制触达
        - from: cloud
          to: economics
          label: 塑造成本与韧性
        - from: rights
          to: moj
          label: 支撑内容工作流
        - from: brands
          to: economics
          label: 为增长供血
        - from: team
          to: brands
          label: 必须证明衡量有效
        - from: team
          to: rights
          label: 必须管住合规
        - from: moj
          to: economics
          label: 必须变现
