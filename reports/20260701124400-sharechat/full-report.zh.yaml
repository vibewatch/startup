          unit: USD B
        - label: FY25 收入
          value: '723'
          unit: INR Cr
        - label: FY26 H1 年化收入
          value: 1000+
          unit: INR Cr
        - label: 当前员工数
          value: 500-550
          unit: employees
    claimRefs:
      - CV001
      - CV007
      - CV015
      - CV018
      - CV024
      - CV047
