        - 公司声称创作者规模，但本次未发现公开分成规则
        - 广告支持的语种内容生态，但未发现公开价格透明度
        - 低
        - Josh 争夺同一批预算，但本组材料没有披露分成机制
      - - Instagram Reels
        - Instagram 内的免费消费者功能
        - 已抓取来源中未发现公开创作者收入分成规则
        - Meta 将 Reels 包装为高互动的品牌发现广告场景
        - 低
        - 即使公开 CPM 仍未披露，Meta 卖的是规模化广告解决方案
      - - YouTube Shorts
        - YouTube 内的免费消费者功能
        - Shorts 信息流广告池和 Premium 分配中，45% 归创作者
        - Brandcast 和 Help 页面同时展示创作者与广告主打包
        - 中等
        - YouTube 提供本组材料中最清晰的公开变现规则
      - - Snapchat Spotlight
        - Snapchat 内的免费消费者功能
        - 本次未发现公开分成规则，但 Spotlight/Stories 正在扩大年轻创作者触达
        - 印度 MAU 上升后，Snap 向广告主强调商业价值
        - 低
        - Snap 竞争靠受众集中度，而不是已披露的分成透明度
      - - Roposo / Glance
        - 免费消费者 App 和锁屏内容
        - 直播节目叠加商业参与；未披露公开抽佣率
        - 购物娱乐和直播购物是可见的打包角度
        - 低
        - Roposo 靠商业化打包差异化，而不是传统广告规模披露
      - - Chingari
        - 免费消费者应用
        - 能看到区块链时期的创作者变现实验和直播，但没有披露稳定、公开的分成规则
        - 已获取材料里，广告主打包方式不清楚
        - 低
        - 变现实验存在，但耐久性看起来弱于同业
    notes: 公开费率卡大多缺失，因此本表比较的是打包结构和分成可见度，而不是尝试给出没有依据的 CPM 对比。
