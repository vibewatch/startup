      - number: '4.3'
        title: 资本充足性与资产负债表风险
        blocks:
          - type: paragraph
            body: >-
              ShareChat 在 2024 年为自己买到了时间，但这段时间的条款很重要。2024 年 4 月，公司通过可转换债券融资 US$49 million，并称资金将投入广告定向技术，以及 ShareChat
              Live 和 Moj Live 上的消费者交易。独立报道后来把 2024 年总融资额描述为接近 US$65 million，有效估值接近 US$1.5 billion；TechCrunch
              则报道，该可转债会在下一轮以低于 US$2 billion 的价格定价。相对 2022 年峰值，市场信息很清楚：投资人仍支持公司，但价格显著更低，结构也更像债务，而不是亢奋的普通股估值上跳。


              更难的问题是当前流动性。Entrackr 基于申报文件的分析称，FY24 年末公司只有 INR 36.2 crore 现金及银行余额、INR 128.96 crore
              流动资产，而财务成本和借款仍在上升。Tofler 追加了 FY25 INR 500-750 crore 的经营收入区间，并显示 HDFC Bank 资产抵押，但大多数详细科目仍被门控。用 2024 年末烧钱率除以
              FY24 年末现金做朴素 runway 计算，只得到约 7 个月；但这个算法有意保守且已经过时，因为它排除了 2024 年融资和之后任何现金使用。正确解读不是公司即将资不抵债，而是当前 runway
              无法仅凭公开证据可信承销。
