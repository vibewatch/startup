      - number: '6.2'
        title: 采用轨迹与具名广告主证据
        blocks:
          - type: paragraph
            body: >-
              当 ShareChat 或 Moj 披露具名活动并给出可衡量结果时，公开采用证据最强。Amazon miniTV 是最清楚的触达案例，官方案例研究称 Moj 帮它触达 4.3 crore 用户。Flipkart
              的 Big Billion Days 活动据称由 100 位区域网红带来 12.3 crore 次观看；Dettol 的 Moj 活动引用 Nielsen 提升研究，显示推荐意愿和购买意愿提高 33%。Star
              Sports 同时使用 ShareChat 和 Moj 扩大 Pro Kabaddi 互动，Adgully 报道 Mountain Dew 为期 50 天的 Moj 活动在 200 多名创作者参与下超过 10
              billion 次观看。公司还单独称，自己已服务前 200 大广告主，并在搭建更大的销售基础。限制在于证据质量：几乎所有具名证据都来自供应商发布或访谈，能更好证明真实活动使用，却难以证明长期钱包份额或重复预算。
