      - 2026 年公开市值 / 状态
      - 收入证据
      - 意义
      - 局限
    rows:
      - - Reddit
        - 市值约 $33.4B
        - 2025 年收入 $2.2B（SEC 10-K）
        - 收入已达数十亿美元时，规模化上市 UGC 平台能拿到怎样的估值
        - 美国公开市场流动性和变现深度远高于 ShareChat
      - - Pinterest
        - 市值约 $11.8B
        - 2025 年收入 $4.22B（SEC 10-K）
        - 可为广告和电商导向的消费者互联网平台提供参照
        - 使用场景不同，全球广告主基础更强
      - - Snap
        - 市值约 $7.35B
        - 2025 年收入 $5.9B（SEC 10-K）
        - 最接近的提醒：即便承压的上市社交平台，披露收入规模仍远大于 ShareChat
        - 公开股权价值不等于私人企业价值，且 Snap 仍是全球化平台
      - - ShareChat 较低隐含区间
        - 由 2023-2025 年融资证据推得约 $1.5B-$2.7B
        - FY24 收入 Rs 718 crore；FY25 收入 Rs 723 crore
        - 2022 年峰值后，最接近当前出清价格的公开线索
        - 不是干净的定价股权轮；债务和可转债结构让信号变浑
