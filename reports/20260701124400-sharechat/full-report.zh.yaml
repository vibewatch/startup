        - 索取董事会批准的条款清单和股权结构桥
      - - FY25 和 FY26 经审计财报
        - 超出新闻稿的完整 P&L、现金流、资产负债表和分部明细
        - 需要验证扭亏是否可持续，并有现金支撑
        - 获取已提交账目和管理账调节表
      - - 变现分群
        - ARPU、付费用户分群、留存、创作者变现和分业务线收入
        - 需要判断规模是在像上市社交平台那样变现，还是只是企稳
        - 结合分群表开展产品和财务尽调
      - - IPO 就绪工作流
        - 审计师就绪度、董事会构成、内控、法律清理和上市地点计划
        - 不能只凭访谈承销上市野心
        - 索取 IPO 就绪材料和治理日历
      - - 政策与审核暴露
        - 应用商店沟通、审核例外日志和跨平台执法姿态
        - 如果政策风险看起来失控，上市折价会迅速扩大
        - 审查信任与安全控制和平台往来函件
    notes: 这些索取项是从情景框架推进到真实入场定价所需的最低资料包。
    claimRefs:
      - CV019
