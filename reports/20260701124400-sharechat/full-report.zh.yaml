  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品入口与用户任务
        blocks:
          - type: paragraph
            body: >-
              ShareChat 的公开产品入口现在至少覆盖五类待完成任务。主 ShareChat
              应用仍是本土语言社交和实用信息流：它把状态分享、视频、meme、shayari、聊天室、直播主播、虚拟礼物和社区互动打包成一个语言优先的发现产品，而不是好友图谱网络。Moj
              是独立娱乐和创作者入口，为可滑动短视频、滤镜、特效、热门声音优化，并且越来越通过 Moj+ 精品原创承载短剧观看。第三个入口是广告主栈：ShareChat Ads Manager 和自助 SSP
              暴露活动设置、语言定向、预算和投放控制给品牌。在这些之上，还有 Original Creator 资格、Streaks、Spotlight、ShareChat+ 和 SC Blue
              等创作者与变现模块。结果是一个多产品架构：信息流是分发引擎，创作者项目是供给引擎，广告或订阅是变现层。这个宽度在战略上有用，因为它分散了参与度循环；但它也意味着产品质量取决于能否协调消费者、创作者、广告主和信任工作流，而不是把它们当成彼此隔离的应用。
