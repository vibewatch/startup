      - number: '7.4'
        title: 融资、烧钱与 IPO 执行风险
        blocks:
          - type: paragraph
            body: >-
              财务风险已有改善，但没有消失。公开报道显示，Mohalla Tech 大幅削减调整后 EBITDA 亏损，把核心业务推到现金流为正，并在声称 ₹1,000 crore 年化收入规模的同时瞄准 FY26 增长
              30%。问题在于，更干净的 P&L 正搭配一个仍很吃力的战略重置：估值已从 $5 billion 峰值降到 2024 债务轮的低于 $2 billion，管理层此前把盈利与较晚的 IPO
              路径相连，当前增长也越来越依赖微短剧采用和广告主变现，而不只是旧信息流经济。这并不自动看空，但意味着投资判断靠执行，而不是靠资产负债表充裕度。一个约 500
              人的组织，被要求同时跑直播社交、短视频、版权管理、广告销售、政策合规和一个新内容垂类。没有公开储备数据、详细股权结构背景或董事会阐明的 IPO 计划，融资故事仍重大披露不足。
