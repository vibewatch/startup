  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              对 ShareChat
              而言，经济上真正相关的市场比「印度社交媒体」更窄，又比单一应用类别更宽。核心市场包括本土语言社交信息流、短视频库存、创作者驱动品牌活动、直播与虚拟礼物变现，以及介于娱乐和商业之间的区域语言发现入口。这个边界符合用户真实行为：IAMAI/Kantar
              报告称 2025 年有 958 million 活跃互联网用户，其中 588 million 消费短视频；几乎所有用户都会在某个环节消费 Indic 语言内容。ShareChat 自己的业务页面明确推介 15+
              种语言触达、ShareChat 与 Moj 合计 325 million MAU、以及每月 280 billion
              次视频观看，因此公司是在一个区域语言、移动优先的消费层里变现注意力，而不是只和文本优先社交网络竞争。


              因此，纳入支出包括围绕区域视频和信息流展示出售的品牌广告、经由 Moj 或 ShareChat 路由的创作者和网红活动、旨在推动 Bharat
              市场发现或考虑的商业品牌活动，以及公司自己强调的虚拟礼物或直播互动等数字消费者交易，用来让收入不止靠纯广告。排除支出包括长视频 OTT
              订阅、电视广告、搜索广告、纯展示网络和游戏支出，尽管它们都是消费者注意力和广告预算的重要相邻替代品。最重要的现状替代品是 Instagram Reels、YouTube
              Shorts、用于触达的传统电视，以及区域市场里的线下口碑。因此，估值时正确的市场框架不是简单的「印度社交用户」，而是区域语言注意力、短视频参与度，以及广告主为这种注意力付费的意愿三者交叉处。
