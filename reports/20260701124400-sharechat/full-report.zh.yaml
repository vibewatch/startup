      - number: '5.2'
        title: 推荐与运营架构
        blocks:
          - type: paragraph
            body: >-
              公开材料中，最能看见 ShareChat 技术核心的是 2026 年 ScyllaDB 文章和公司自己的团队描述。公开层面，ShareChat 称 AI 和 ML 构成 ShareChat 与 Moj
              的骨干，并把内容理解、个性化信息流、创作者工具和视频质量提升列为明确职责。外部工程文章补上了缺失架构：个性化信息流先从向量数据库拉取候选，过滤重复项，用 ML
              模型打分和排序，再返回顶部结果。一个关键细节是区分「已发送帖子」和「已观看帖子」状态，从而避免重复投喂，也避免过度压制用户其实从未看见的内容。历史上，这个去重层跑在
              Pub/Sub、Dataflow、Bigtable、Redis，以及 Kubernetes 上的 Go 服务；ShareChat 后来把大部分迁到 Redpanda、Flink 和 ScyllaDB，又调优
              HPA、压缩、保留窗口和路由，显著降低成本和延迟。这些证据说明公司在推荐基础设施上确有系统深度，但也凸显了它对流处理可靠性、状态存储经济性、云路由和高流量波动下运营正确性的依赖。
