      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人身份仍锚定 Ankush Sachdeva、Bhanu Pratap Singh 和 Farid Ahsan 三人，但领导层画面已经不是经典的三位创始人共同运营结构。Ankush 仍是公开门面和
              CEO，多篇报道则称 Bhanu 与 Farid 已在 2023 年 1
              月退出高管角色，而此前他们已经逐渐远离日常运营控制。这一点重要，因为公开证据没有显示一个完全制度化的治理层接替了他们。相反，报道反复指向一个围绕 Ankush 和少数非创始高管更集中的运营中心。


              2025-2026 年招聘节奏也强化了这个判断。Moneycontrol 把 CFO Manohar Charan 描述为公司重组期 Ankush Sachdeva 的主要副手之一，后续报道则突出前 TikTok
              高管 Nitin Jain 出任 CTO、前 Google India 高管 Neha Markanda
              出任首席商务官。这些任命说明，公司正在围绕变现、绩效和广告主关系重建，而不是围绕一个披露充分的董事会或委员会结构。法律文件确认了注册办公室、申诉渠道和政策维护节奏，但公开来源仍没有充分披露董事会构成、委员会职责和当前投资人控制权。公司已经经历创始人角色收缩、多轮裁员和估值重置，这就构成真实的尽调缺口。
