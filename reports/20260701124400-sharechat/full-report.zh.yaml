      - number: '1.3'
        title: 资本基础、投资人与经济性
        blocks:
          - type: paragraph
            body: >-
              ShareChat 显然融资能力很强，但融资故事已经不再是简单的成长股权叙事。Tracxn 的轮次历史和 Reuters 2022 年报道显示，公司从 2021 年末的独角兽融资推进到 2022 年中近 $5
              billion 估值，Google、Temasek 和 Times Group 都与这轮主要上调估值融资有关。公开投资人名单也显示，股东名单很密，覆盖 Lightspeed、Tiger
              Global、Snap、X/Twitter、EDBI、HarbourVest、Moore 等创投、跨界和战略支持方。


              更近期的融资记录就逊色得多。TechCrunch 报道称，2023 年末公司曾谈判低于 $1.5 billion 的下轮融资；Tracxn 显示，2024
              年融资更偏向风险债务和常规债务，而不是大额新定价股权。运营数字解释了原因。Moneycontrol 和 Entrackr 都显示 FY24 收入约 Rs 718
              crore，但同时也显示绝对亏损很大、财务成本显著、并持续依赖外部资本。管理层在降本上取得了可见进展，并称核心 ShareChat 产品到 2024 年 10 月已实现 EBITDA
              转正；但承销判断仍取决于直播打赏、广告和较新的订阅实验，能否支撑一个不需要再次估值重置或额外结构化融资的持久现金生成模型。
