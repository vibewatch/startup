      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务结论方向积极，但仍不完整。ShareChat 已经证明，即使在 2024 年估值重置后，它也能增长收入、减少烧钱、压缩基础设施成本，并提升应用层盈利能力。广告看起来是更干净的经济引擎，毛利率超过
              90%；直播仍有战略意义，但结构性利润率更低，约 35-40%。这种组合意味着公司还不是简单的高毛利广告平台；FY24 收入目标落空也提醒我们，变现仍取决于广告主类别组合和产品成熟度。


              未解决阻塞项是实践问题，而非理论问题。公开证据仍没有显示当前不受限现金、债券的票息 / 到期 / 转换护栏、实际广告定价和折扣、创作者支付瀑布、订阅附着率，或头部广告主集中度。Storyboard18
              的广告主信心文章也说明这些缺失字段为何重要：品牌仍在相对 Meta 和 YouTube 讨论转化质量、归因和创作者专业度。换言之，ShareChat
              现在像一个正在稳定的消费者互联网平台，具备融资可行性；但如果没有私有数据室访问，它还不能被完全承销为一个利润丰厚的复利资产。
