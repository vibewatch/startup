      - number: '6.3'
        title: 重复使用、创作者供给与 SMB 扩张
        blocks:
          - type: paragraph
            body: >-
              消费者和创作者侧的重复使用有公开信号，广告主侧却不够透明。ShareChat 披露核心应用平均每日使用 31 分钟，当前广告材料则把合并网络标为每天超过 34 分钟。Google Play
              还提供规模代理指标：ShareChat 下载量超过 500 million，Moj 超过 100 million，二者评分均高于
              4.1，评论数达数百万。创作者韧性来自明确运营机制：连续发布规则要求每周和每日发帖，原创创作者可获得更高奖励和品牌合作，Spotlight 创作者获得导师支持。销售动作也在扩宽。Media Infoline
              称，Moj 在六个月内有约 75 个品牌合作，生成约 150 个网红主导的活动；Social Samosa 称，自助平台已支持 2,400 多家
              SMB。这些是真实的重复使用和变现信号，但它们仍更能说明活动量，而不是广告主留存或利润质量的耐久性。
