      - number: '7.3'
        title: 平台、广告主与依赖风险
        blocks:
          - type: paragraph
            body: >-
              ShareChat 也有典型平台依赖问题，只是被大触达掩盖。官方页面显示 ShareChat 和 Moj
              规模声明很大、使用时长很长、创作者产出活跃，但同一批材料也显示，产品本质上仍靠移动应用商店分发，并靠广告主变现，而广告主会把它们拿来和 Meta、YouTube 对标。Moj
              现在把短视频、微短剧和精品原创内容放进一个应用；ShareChat
              仍依赖聊天室、直播和分享循环维持互动。这种广度可以是优势，也会拉长产品质量、审核和效果衡量的战线。独立广告主报道是压力点：Storyboard18
              报道，行业对归因、转化质量、创作者质量和品牌安全仍有持续担忧，Meta 和 YouTube 仍更受绩效导向预算偏好。换句话说，ShareChat
              有可能赢下本地语言触达；但如果衡量信心和品牌安全信任不能继续提升，它仍会输掉最有价值的需求池。
