        - 品牌广告通过 ShareChat Ads 销售，覆盖信息流和视频库存
        - INR 收入 / 竞价定价投放
        - FY24 为 INR 315 crore；CFO 评论称毛利率 >90%
        - 毛利率高，但外部用户看不到定价披露
        - 索取实际 CPM/CPC、填充率、折扣和头部品类组合
      - - 直播 / 虚拟礼物
        - 用户在 ShareChat 和 Moj 的直播形态里购买虚拟商品并交易
        - INR 收入 / 交易抽成率
        - FY24 为 INR 402-403 crore；毛利率约 35-40%
        - 规模最大，但毛利质量低于广告，因为创作者和支付网关分走经济收益
        - 索取抽成率瀑布、创作者分成 %、退款率和付费用户队列
      - - SC Plus 订阅
        - 付费轻广告订阅，附带个性化分享
        - 订阅用户数 / ARPPU
        - 产品已上线；面向新购买者宣传首月 INR 1
        - 存在性证据充分；收入重要性未知
