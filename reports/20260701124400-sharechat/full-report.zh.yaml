        - 重置看起来像靠成本工程撑出，而非可持续
        - 在经审计的修复可见前暂停估值工作
      - - 结构化融资恶化
        - 新资本附带惩罚性优先权、大幅折价或不透明转换机制
        - 名义估值可能高估真实股权价值
        - 继续推进前重算持股经济账
      - - 领导层不稳定回潮
        - IPO 准备变得可触达前，又有重大变现或产品负责人离职
        - 削弱执行信心和治理叙事
        - 按 IPO 时间表延后处理，并扩大折价
      - - 平台政策摩擦加剧
        - Vibely 式审核或 App Store 问题扩散到整个生态
        - 上市推进中，监管和分发风险会抬升
