  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 缓释措施 / 尽调追问
    rows:
      - - 本地语言与印度本土身份认同
        - Reels 和 Shorts 本地化内容更快，也吸走更多创作者注意力
        - 高
        - 2023 年 Moj/Josh/Roposo 的 MAU 下滑，Instagram 增长；印度本土用户口径仍有争议
        - 在假设本地语言粘性之前，索取按平台和语言分群的留存队列
      - - 历史用户规模大
        - 独立追踪数据质疑当前 Moj 规模
        - 高
        - ShareChat 称 Moj MAU 为 160M，但 Inc42/data.ai 报道 2023 年 12 月为 54M
        - 获取 2025-2026 年第三方面板数据和内部 MAU/DAU 定义
      - - 本土融资优势
        - 资本最终体现为这一批公司的裁员、降低现金消耗和减值
        - 高
        - ShareChat、VerSe 和 Chingari 即便历史融资额大，也都承受成本压力
        - 索取当前现金续航期、成本结构和创作者获客经济性
      - - 直播社交和新格式变现
        - 微短剧、直播和订阅押注可能把公司推向相邻品类，而不是加固核心护城河
        - 中
        - QuickTV 推进、订阅叙事和 RMG 广告需求冲击，都指向产品模型转型
        - 厘清新格式是在防守 Moj，还是只是把业务从 Moj 分散出去
      - - 独立应用分发
        - 全球在位巨头掌握更强的广告主、创作者和发现链路
        - 高
        - Meta India 广告收入、YouTube 创作者分成、Snapchat 规模和 Glance 锁屏触达，都超过 ShareChat 公开展示的分发信号
        - 用 Meta、YouTube、Snap 和 Glance 做基准，比较创作者流动性和广告主复购率
      - - 本土对手疲弱构成护城河
        - 如果全球替代品已经定下品类标杆，本土对手弱不弱并不重要
        - 中
        - 本土应用承压，但真正标杆已转向 Reels、Shorts 和 Snapchat
        - 尽调框架要对标在位替代品，不只看印度本土对手
    notes: 风险清单聚焦竞争耐久性，而不是一般公司风险；若干行刻意把官方主张和不利独立证据放在一起，以保留矛盾。
