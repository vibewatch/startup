  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资建议从真实历史 $5B 标记出发，经过当前更低的隐含价值与经营修复，最后落在跟踪而非买入。
    data:
      nodes:
        - id: peak
          label: 历史估值标记
          detail: 2022 年官方定价轮参考：$5B
        - id: reset
          label: 重估证据
          detail: 2023-2025 年融资线索指向 ~$1.5B-$2.7B
        - id: repair
          label: 经营修复
          detail: 现金消耗下降，FY25 EBITDA 亏损大幅收窄，核心业务现金流转正
        - id: comp
          label: 公开市场可比公司现实
          detail: 上市社交同业披露的收入基数大得多
        - id: call
          label: 投资判断
          detail: 跟踪；$5B 偏高，只有接近较低隐含区间才更合理
      edges:
        - from: peak
          to: reset
          label: 遭遇挑战
        - from: reset
          to: repair
          label: 有所缓和
        - from: repair
          to: comp
          label: 仍需对照
        - from: comp
          to: call
          label: 导向
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV017
      - CV019
      - CV038
      - CV044
      - CV047
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 如果估值锚点选过时的 2022 峰值、更低的私募重估信号或公开社媒基准，结论会明显不同。
    data:
      items:
        - label: 更低重估传闻
          value: 1.5
        - label: 可转债传闻
          value: 2.7
        - label: 上一轮定价融资
          value: 5
        - label: Snap 市值
          value: 7.35
        - label: Pinterest 市值
          value: 11.78
        - label: Reddit 市值
          value: 33.41
    approximationNotes: 柱状图把报道中的私募隐含价值与公开股权市值放在一起，只为提供语境，不代表严格可比的企业价值。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV029
      - CV030
      - CV031
      - CV037
      - CV038
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 按情景加权后的估值区间，在基准情形下明显低于过时峰值，但仍保留乐观情形重新接近该峰值的路径。
    data:
      items:
        - label: 悲观重估
          low: 1
          mid: 1.4
          high: 1.8
        - label: 基准测算
          low: 2
          mid: 2.5
          high: 3
        - label: 乐观重估
          low: 4
          mid: 4.5
          high: 5
    approximationNotes: 区间是根据公开证据推断出的情景带，刻意比模型支撑的公允价值更宽，因为条款清单和股权结构细节仍未公开。
    claimRefs:
      - CV007
      - CV017
      - CV019
      - CV039
      - CV040
      - CV041
      - CV042
      - CV047
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 紧凑的 KPI 视图抓住了将 ShareChat 纳入未来融资或 IPO 讨论时最关键的数字。
    data:
