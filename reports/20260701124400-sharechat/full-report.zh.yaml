      - number: '1.4'
        title: 规模、里程碑与可见风险
        blocks:
          - type: paragraph
            body: >-
              ShareChat 的规模故事仍然成立。公司当前官方入口和近期媒体报道大致都指向 ShareChat 加 Moj 合计约 325 million 月活、日均使用时长超过 30 分钟、强区域语言触达，以及面向
              Bharat 的有意义广告主主张。公司也愿意持续调整产品组合：TikTok 被禁后 Moj 很快上线，MX TakaTak 交易整合了短视频，而最新可见增长押注是通过 QuickTV 和 Moj+ 做微短剧。


              风险面同样清晰。公司经历了多轮裁员、大幅创始人角色收缩和重大估值下调；与此同时，印度短视频市场的变现难度也高于最初用户数字所暗示的水平。Storyboard18
              的广告主专题尤其有用，因为它同时记录了公司乐观叙事和买方怀疑：管理层认为 Bharat 受众、创作者驱动活动和品牌安全的区域触达是优势；代理商声音仍担心创作者质量、归因、转化意图，以及相对 Meta 和
              YouTube 的品牌安全。结果是，公司确实拥有分发、文化特定产品市场匹配和近期盈利进展，但其可投性仍取决于能否证明参与度可以在与既有融资规模相称的水平上转成可重复、高质量收入。
