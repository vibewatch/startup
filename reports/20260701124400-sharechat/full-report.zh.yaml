      - number: '8.2'
        title: 运营修复与公开可比公司的规模
        blocks:
          - type: paragraph
            body: >-
              运营故事比峰值到重置的估值故事好得多。Mohalla Tech 通过 Moneycontrol 的公开披露显示了一条真实修复弧线：收入从 FY22 的 Rs 346.9 crore 增至 FY23 的 Rs
              553 crore、FY24 的 Rs 718 crore、FY25 的 Rs 723 crore；调整后 EBITDA 亏损从 FY23 的 Rs 2,400 crore 收窄至 FY24 的 Rs 793
              crore，再到 FY25 的 Rs 219 crore。管理层现在称，核心社交业务现金流为正，FY26 上半结束时年化收入规模已超过 Rs 1,000
              crore，新增长预计来自订阅和微短剧。即便如此，公开可比公司框架仍会压住乐观情绪。截至 2026 年 7 月，Reddit 市值约 $33.4 billion，Pinterest 约 $11.8
              billion，Snap 约 $7.35 billion；它们在 SEC 文件中的 2025 年收入分别约 $2.2 billion、$4.22 billion 和 $5.9
              billion。即使用户触达很大，ShareChat 在公开证据中的变现规模仍小得多。因此，运营扭转支持生存和可选性，但对照上市社交媒体收入规模和股票市场背景，单靠运营扭转还不能让旧 $5 billion
