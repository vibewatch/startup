        - 收入质量取决于创作者供给、原创度和活动执行质量
        - 创作者供给强能放大品牌声量；创作者留存弱会拉低库存质量
        - 索取活跃创作者留存、支付经济性，以及使用付费创作者的活动占比
      - - Bharat 与语言优先触达
        - 广告主逻辑高度绑定印度本土语言和短视频广告预算
