    title: 技术 / 运营架构表
    columns:
      - 层级 / 流程 / 组件
      - 作用
      - 关键依赖
      - 已观察风险
    rows:
      - - AI / 个性化层
        - 将内容理解和互动信号转化为 ShareChat 与 Moj 上的个性化分发
        - 模型质量、训练数据和低延迟服务
        - 未公开分语言的模型质量指标
      - - 候选召回 + 排序流程
        - 召回候选内容，过滤重复项，用 ML 模型打分 / 排序，返回顶部结果
        - 向量数据库召回、去重逻辑、模型服务
        - 即使 app UX 完整，召回或排序失准也会拉低相关性
      - - 已发送帖 / 已浏览帖状态
        - 在防重复和避免压制未看内容之间做平衡
        - 事件时点准确，以及可持久保存的用户级状态
        - 状态漂移可能让内容重复出现，也可能让信息流过度过滤
      - - 流式处理和状态基础设施
        - 处理事件，并为信息流逻辑存储每个用户的历史
        - Redpanda、Flink、ScyllaDB、Kubernetes，以及成本调优后的路由
        - 成本或自动扩缩容出错会直接影响延迟
      - - 移动端交互和媒体管线
        - 支持类消息的持久连接、视频处理和前端安全信号
        - 持久连接处理、客户端效率、媒体编解码、清洗
        - 公开仓库显示能力，但不说明确切生产使用
      - - 广告投放和衡量栈
        - 投放活动，优化变量，并报告投放统计
        - 商业账号完整性、素材审核、定向条件和平台库存
        - 无绩效保证；无效流量和投放不足仍是声明中的限制
      - - 治理和政策层
        - 在产品界面上执行隐私、审核、合成内容和删除规则
        - 政策更新、人工复审、举报系统和外部平台规则
        - 相邻产品发布仍可能被应用商店政策挡住
    notes: 本表把明确的公开架构披露与开发者信号资料合并解读；已审阅来源没有点名的秘密内部实现细节，不在这里主张。
