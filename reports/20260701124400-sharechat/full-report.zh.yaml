    enumerationScope:
      coverage: partial
      basis: >-
        Compares only monetization mechanisms that were publicly observable in fetched sources; advertiser CPMs,
        discounts, and creator take-rates are largely undisclosed outside YouTube policy documentation.
    rows:
      - - ShareChat / Moj
        - 免费消费者 App
        - 直播和聊天室已经变现；订阅和微短剧正在新增
        - 广告仍有意义，但本次未发现公开价目表
        - 低
        - 纯广告依赖看起来脆弱，ShareChat 正在拓宽打包方式
      - - Josh / Dailyhunt
