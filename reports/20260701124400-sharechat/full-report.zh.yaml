      - number: '8.4'
        title: IPO 准备度、放弃触发器与尽调
        blocks:
          - type: paragraph
            body: >-
              ShareChat 已重新赢得讨论 IPO 的资格，但还没到可以无保留按具备 IPO 条件来投资的程度。管理层公开提过两年内上市愿景和 2027
              年末目标措辞；同一公开记录也包括约两年内四轮裁员、联合创始人角色退出、高级商业领导层流动，以及 2026 年 6 月涉及 Vibely 的 App Store
              政策问题。这些问题不致命，但确实抬高了治理、内容审核和组织韧性的尽调门槛。更重要的是，股权结构故事仍不透明，因为最近融资是债务或可转结构，而不是干净、广泛披露的股权轮。认真投资人仍需要准确证券条款、优先清偿栈、稀释测算、经审计
              FY25 报表、FY26 现金流桥接表、用户留存和付费用户队列，以及围绕治理、审计师、内控和上市地点的具体 IPO
              工作计划。在这些材料可见之前，即便运营趋势继续改善，投资主题也可能败在融资质量上。这就是本章以尽调问题和放弃触发器收尾，而不是给出硬买入结论的原因。
