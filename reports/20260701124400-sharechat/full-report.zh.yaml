      - number: '6.4'
        title: 留存缺口、集中度与渠道风险
        blocks:
          - type: paragraph
            body: >-
              最大的公开尽调问题不是 ShareChat 能否吸引用户或跑活动，而是投资人能否把耐久性写进投资假设。已审阅材料均未披露
              NRR、GRR、客户标识流失、重复活动率、合同期限或头部广告主集中度。合作伙伴渠道也重要：GroupM 和 Httpool
              是有用的扩张路径，但也说明一部分销售与分发依赖代理机构和转售式分发，而不是纯直接需求。宏观条件顺风——WPP 预计 2026 年印度广告市场接近 10% 增长，并称数字已经拿走 68%
              支出——但这股顺风本身解决不了低 ARPU 变现。IIM Ahmedabad 案例明确把变现置于印度低 ARPU 环境中来讨论，称其很难；近期 Vibely 从 App Store
              下架也说明，新产品增长会被平台政策决定打断。简言之，公开证据支持触达和活动相关性，但集中度、续约和渠道耐久性仍披露不足。
