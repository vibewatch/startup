      - number: '7.2'
        title: 内容治理、隐私与网络合规风险
        blocks:
          - type: paragraph
            body: >-
              第二组主要风险是运营合规：ShareChat 的产品把 UGC、直播场景、聊天室、打赏、推荐系统，以及跨设备、联系人、搜索和位置相关信号的广泛数据收集放在一起。管理层称审核靠 AI
              加人工，因为全自动不安全；但法律时限缩短时，这也意味着合规成本和误判风险上升。公开政策栈为仇恨言论、隐私、错误信息、合成媒体和聊天室行为设下宽规则，同时 CERT-In 指引要求中介六小时内报告事件、日志留存
              180 天。对窄产品来说，这些义务可管理；ShareChat 并不窄，它是一个多场景社交与短视频生态，有实时互动功能，且 Android
              分发很重。缺口是公开运营证据：已获取的透明度页面没有展示详细执法、滥用发生率或事件历史数据，投资人无法判断公司是稳稳处在合规边界内，还是只是把合规文档写得好。
