      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              市场用户端由 Bharat 优先、移动优先受众主导，而不是只由大城市早期用户构成。IAMAI/Kantar 称，2025 年印度农村已经占活跃互联网用户的 57%，短视频消费则覆盖总体用户的
              61%。ShareChat 的商业材料和第三方报道强化了这个定位：公司称自己以 15+ 种语言触达 325 million 月活用户，Storyboard18 则报道约 63%
              平台用户来自二线和三线城市。这意味着最重要的终端用户分层是农村和半城市本土语言消费者、城市 Gen Z 短视频观看者、寻求受众增长和变现的创作者，以及通过母语视频发现产品的社交影响购物者。


              付费方则不同。全国性 FMCG、美妆、电信、汽车、娱乐和电商品牌是规模化活动的主要预算所有者；区域品牌和 SME 也重要，因为它们需要文化语境化触达和更低创意成本格式。EY 估计，2025 年超过 1
              million 家 SME 和长尾广告主已经为印度数字广告市场贡献 Rs 363 billion；WPP 则把 SME、Tech/Telco、Realty、Auto 和 Education 列为 2026
              年主要增长类别。因此，代理商和品牌团队是实际买方，创作者是供给端，终端用户提供注意力与信任。变现挑战在于，用户群清楚地又大又活跃，但广告主仍用归因、品牌安全和转化视角评判它，而这些视角更偏向 Meta 和
              YouTube。受众强度和买方谨慎之间的分裂，是承销 ShareChat 市场时的核心。
