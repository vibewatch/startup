chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              法律实体是 Mohalla Tech Pvt Ltd，当前公开入口也清楚地区分旗舰 ShareChat 产品和 Moj，而不是把它们包装成一个无差别消费者应用。ShareChat 自己的法律和隐私文件把平台归到
              Mohalla Tech 名下，并把注册办公室放在 Bengaluru；关于页面则把起点追溯到 2014 年 11 月，当时创始人发现英语优先社交平台没有服务好 Indic
              语言内容受众。今天的产品版图已经不止这个创始洞察。ShareChat 仍把自己定位成状态、meme、笑话、宗教内容、直播间和区域语言互动的社交目的地；Moj 如今则明确被包装为短视频和短剧应用，并带有精品
              Moj+ 层。


              公开材料也让运营模式更容易看清。团队页面描述了信息流个性化、内容理解、发现、审核、创作者工具、直播和创作者生态等产品
              pod；业务页面和广告入口则说明，管理层通过广告、品牌解决方案、创作者活动、虚拟礼物，以及如今类似订阅的短剧实验来变现。因此，最可辩护的身份陈述不只是「印度版 TikTok
              替代品」。公司运营的是一个双平台本土语言互联网栈：ShareChat 负责社交图谱和文化层，Moj 负责视频与短剧层，共用的变现引擎则把 Bharat 触达卖给广告主，同时尝试用直播和精品内容把变现做深。
