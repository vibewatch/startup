          - type: paragraph
            body: >-
              成本重置是真实的。调整后 EBITDA 亏损同比下降 67% 至约 INR 793 crore，总费用下降 33.2%，员工福利成本降至 INR 580.39 crore，服务器租金下降 45.3% 至 INR
              559.57 crore。管理层另称，自 2024 年初以来，单用户服务器成本已下降 50%，排名质量改善让获客支出降至接近零。把这些事实放在一起看，ShareChat 已经不再像 2021
              年式圈地阶段那样花钱。


              但底层经济性仍然混合，而不是干净。FY24 合并税前亏损仍接近 INR 1,899 crore，财务成本升至 INR 510.57 crore；Entrackr 的公开网页单位经济性代理指标仍显示，FY24 每
              INR 1 经营收入要花 INR 3.68。令人鼓舞的 2024 年末数据点是，ShareChat 应用自身跨过 15% EBITDA 利润率，Moj 在不计薪酬的口径下实现运营盈利，CFO 称合并烧钱降至约每月
              INR 5 crore，CAC 回收期为三到四个月。投资人的问题在于，这些都是管理层披露，而不是完整经审计桥接数据。公开证据支持真实改善，但尚不足以支撑一个完全可承销的利润率模型。
