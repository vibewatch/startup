  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前流程
      - 公司方案
      - 可衡量收益
      - 限制
    rows:
      - - 在 ShareChat 浏览本地语言内容
        - 打开应用，浏览信息流，加入聊天室/直播，分享状态和视频
        - 语言优先的社交信息流，配合 AI 支撑的个性化和社区界面
        - 在母语语境下相关性和参与度更高
        - 公开文件未按语言量化推荐质量
      - - 在 Moj 消费短娱乐
        - 刷短视频，或打开微短剧剧集
        - Moj 把短视频、创作者短片和 Moj+ 付费剧内容放在一个入口
        - 会话类型比纯短视频应用更宽
        - 没有公开付费采纳率或完播率数据
      - - 作为创作者成长
        - 持续发布，跟进活动，迭代形式，争取曝光
        - Streaks、创作者中心提示、原创创作者激励、Spotlight 培育
        - 触达和曝光更好，也有通向奖励或品牌活动的路径
        - 没有公开衡量创作者 ROI 或流失
      - - 分享品牌化或个性化内容
        - 选择图片帖，修改预览，再分发到外部
        - ShareChat+ 叠加个人资料、联系方式和业务信息，并为订阅用户减少广告
        - 把分享变成轻量的推广或身份展示入口
        - 功能集明确仍在完善中
      - - 面向 Bharat 受众投放活动
        - 开通商业账号，设定预算、日期和定向，提交素材
        - Ads Manager 和 SSP 支持自助搭建、审核、优化和报告
        - 在多语言受众中捕捉本地化需求
        - ShareChat 不保证触达量或目标达成
      - - 降低隐私或安全暴露
        - 限制受众、举报内容，或删除账号 / 数据
        - 私密主页、举报 / 下架流程、删除和数据导出路径
        - 提供被动政策披露之外的具体用户控制
        - 当前审核质量指标未公开
