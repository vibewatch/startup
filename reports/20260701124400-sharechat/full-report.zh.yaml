        blocks:
          - type: paragraph
            body: >-
              ShareChat 可防守的切口真实存在，但比公司峰值期规模说法暗示的更窄。最强的正面论点是，没有全球巨头像 ShareChat 和 Moj
              这样专门围绕本土语言社区身份、社交打赏和印度优先微娱乐来搭建；Roposo 的商业层和 Josh 的语言图谱也证明，本地差异化仍有空间。负面论点在公开记录中更强：Moj
              的独立使用趋势有争议，领导层流失显著，国内同类公司整体更常把融资转成削减烧钱计划，而不是无可争议的品类领导。与此同时，最大竞争对手拥有结构性更好的分发。Meta 在印度的变现规模是 ShareChat
              目前无法接近的，YouTube 公布创作者支付公式而不只是营销说法，Snapchat 在印度已有 250 million MAU，Glance 把 Roposo 放到超过 200 million
              个锁屏上。因此，ShareChat 面对的是典型护城河测试：在本土品类经济性变得不利之前，本土语言细微差异、直播社交变现和新格式能否抵消巨头规模？
