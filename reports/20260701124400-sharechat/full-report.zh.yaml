      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景与结论
        blocks:
          - type: paragraph
            body: >-
              今天给 ShareChat 估值，最干净的方法是把公司质量和价格纪律分开。乐观情景认为，公司已经做完最难的事：削减烧钱、简化组织、守住本地语言社交和短视频规模，并在直播之外叠加订阅和微短剧变现。如果转型延续，公开
              IPO 市场也重新奖励盈利的消费互联网扭转，估值重新靠近旧 $5 billion 区间并非不可能。基准情景更保守，也更符合公开材料：在经审计 FY25-FY26
              证据、更清楚的融资披露和更稳的领导层证明转型是耐久而非战术之前，当前隐含价值更应落在 $2 billion 至 $3 billion 区间。悲观情景则是，ShareChat 仍是低 ARPU
              市场中的低变现资产，反复裁员、平台政策摩擦和结构化融资都指向一个仍需证明自己、才配得上高溢价退出定价的业务。综合来看，建议是跟踪，信心中等，风险高；估值立场是 $5 billion 偏贵，只有新一轮或最终 IPO
              定价更接近较低隐含区间时才接近公允。
