  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              ShareChat 最大的非财务风险在于，印度中介地位并不能完全隔离那些看起来像编辑、版权管理或商业化赋能的产品选择。公司 2026 年更新条款和内容政策，明确以 IT Act 和 IT Rules
              为基础，并公布申诉与合规联系人。好消息在这里。更难的是，Zee Entertainment 争议并不抽象：Delhi High Court 记录显示，在许可到期后，Mohalla Tech 在 ShareChat
              和 Moj 内置音乐库仍是版权纠纷核心；2025 年 12 月判决让案件继续留在 Delhi，公司也继续依赖 Section 79 安全港 抗辩。再叠加管理层 2026
              年描述的三小时下架预期，法律风险不只是一起诉讼；它关乎一个高吞吐量本地语言平台，能否证明治理、授权和响应流程扩张得和产品试验一样快。
