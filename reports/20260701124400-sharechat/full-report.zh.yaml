      - number: '5.4'
        title: 隐私、安全、合规与路线图风险
        blocks:
          - type: paragraph
            body: >-
              公开控制面有意义，但它也暴露了 ShareChat 承担的运营负担。隐私政策披露了广泛数据输入，包括登录、内容、搜索、聊天、联系人、位置、设备和媒体权限，并明确把它们用于语言 / 位置个性化、Mera
              Mohalla 和 Lokpriya 信息流、定向广告、欺诈防范和支持。用户侧控制存在：私密资料限制谁能看帖子或发消息 / 评论；账户删除需要认证，并包含数据下载路径；SC Blue 称遮蔽 ID
              会在审核后删除。安全政策也相对明确。ShareChat 2026 年内容政策要求披露合成内容，禁止操纵性流量生成，并记录了大量被禁止类别。历史透明度报告显示审核负担可以有多大；Vibely
              下架也显示，即便公司称有审核控制，相邻产品发布仍可能撞上外部平台治理规则。尽调结论是，ShareChat
              确有政策、工作流和复核机器，但投资人仍应把审核精度、分语言模型质量和路线图节奏视为开放技术风险，因为这些指标还没有公开。
