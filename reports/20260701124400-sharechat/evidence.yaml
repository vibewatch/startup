evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-visibility
    missingEvidence: A current board list, committee structure, and investor-rights summary for Mohalla Tech.
    whyItMatters: >-
      Founder-role contraction and repeated restructurings make formal governance visibility important to assessing
      control and escalation paths.
    diligencePath: >-
      Request the latest board deck or shareholder-rights summary alongside any observer, veto, or reserved-matter
      schedule.
    relatedQuestionRefs:
      - QO009
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: headcount-freshness
    missingEvidence: A current 2026 employee count by platform and function.
    whyItMatters: >-
      Public headcount disclosures lag the current turnaround story, which makes operating leverage and execution
      capacity hard to underwrite.
    diligencePath: >-
      Ask management for the latest monthly headcount bridge from peak staffing through the current quarter, split by
      ShareChat, Moj, and new bets.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-terms
    missingEvidence: The live cap table, 2024 debt terms, covenant package, and any liquidation-preference stack.
    whyItMatters: >-
      Public sources show structured funding and valuation pressure, but not the rights or downside protection attached
      to the latest capital.
    diligencePath: >-
      Request the cap table, debt schedule, and the most recent financing documents, including maturity, pricing, and
      security terms.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation-reconciliation
    missingEvidence: >-
      A management-confirmed current valuation bridge explaining the move from the 2022 peak to later debt-heavy
      financing and the reported 2023 down-round terms.
    whyItMatters: >-
      Public valuation references span near-$5B peak marks and sub-$1.5B down-round talk, which materially affects
      ownership dilution and return math.
    diligencePath: >-
      Ask for the last priced-equity mark, any implied conversion terms on debt, and any internal or investor-mark
      valuation memos.
    relatedQuestionRefs:
      - QO012
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-resolution
    missingEvidence: >-
      Primary documents for exact close dates, final consideration, and post-close outcomes on select launches, debt
      rounds, and product shutdowns.
    whyItMatters: >-
      The public milestone spine is strong enough for overview work, but exact deal and shutdown mechanics matter when
      later chapters test strategy quality and capital efficiency.
    diligencePath: >-
      Request press-release packets, board approvals, and internal timeline summaries for the MX TakaTak integration,
      debt raises, and QuickTV rollout.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: advertiser-economics
    missingEvidence: >-
      Active advertiser count, repeat-advertiser retention, campaign ROAS benchmarks, and language-level CPM yields for
      ShareChat and Moj.
    whyItMatters: >-
      Without buyer-quality and monetization-efficiency data, the market can be sized only at the category level and not
      at a defensible SOM level for ShareChat.
    diligencePath: >-
      Request cohort-level advertiser metrics, repeat-spend curves, and case-study level conversion data by vertical and
      language.
    relatedQuestionRefs:
      - QM026
      - QM028
  - type: private-evidence-only
    severity: material
    topic: user-overlap
    missingEvidence: Unique-user overlap between ShareChat and Moj, plus DAU/MAU and retention splits by app and geography.
    whyItMatters: >-
      Combined MAUs overstate effective addressability if the same users are counted across both apps or if occasional
      users dominate the tally.
    diligencePath: Ask management for de-duplicated MAU, DAU, retention, and overlap disclosures for ShareChat and Moj separately.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: creator-monetization
    missingEvidence: >-
      Public disclosure of creator payout take-rates, virtual-gifting revenue split, and monetization by creator tier or
      language cohort.
    whyItMatters: >-
      Creator-economy upside is central to the bull case, but absent take-rate data it is impossible to translate
      creator activity into platform revenue quality.
    diligencePath: Obtain creator-economy P&L slices, creator payout ladders, and live / gifting attach rates from management.
    relatedQuestionRefs:
      - QM029
  - type: conflicting-data
    severity: minor
    topic: market-sizing-methodology
    missingEvidence: >-
      A methodology bridge that reconciles IAMAI active users with Kepios internet users and Dentsu AdEx with WPP TYNY
      totals.
    whyItMatters: >-
      Contradictory public baselines can distort valuation if the numerator and denominator come from incomparable
      market definitions.
    diligencePath: >-
      Standardize one valuation model on a single methodology and request publisher notes or management guidance on
      which benchmark best mirrors revenue exposure.
    relatedQuestionRefs:
      - QM019
      - QM020
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: moj-current-mau-claim
    missingEvidence: >-
      Independent 2025-2026 app-analytics or internal cohort data that reconciles ShareChat's 160 million Moj MAU claim
      with data.ai-based 54 million December 2023 tracking.
    whyItMatters: >-
      The chapter's central question is whether Moj still has enough scale to matter against Reels and Shorts; the
      answer changes competitive ranking and moat assessment.
    diligencePath: >-
      Request internal MAU/DAU cohorts, 30/90-day retention, and third-party app-analytics exports for Moj and Josh
      covering 2024-2026.
    relatedQuestionRefs:
      - QP008
      - QP022
    relatedTableRefs:
      - TP001
      - TP004
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Comparable advertiser rate cards or campaign benchmark data for Moj, Josh, Reels, Snapchat, and Roposo.
    whyItMatters: >-
      Public packaging pages do not reveal whether domestic apps can price competitively against Meta and YouTube for
      brand or performance budgets.
    diligencePath: >-
      Ask management for anonymized CPM/CPC benchmarks, creator-marketplace take-rates, and advertiser case studies by
      platform.
    relatedQuestionRefs:
      - QP018
      - QP021
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: minor
    topic: current-domestic-peer-scale
    missingEvidence: Fresh independent 2025-2026 scale, retention, and creator-liquidity data for Roposo and Chingari.
    whyItMatters: >-
      Current domestic-peer positioning otherwise leans on company claims or older independent snapshots, which weakens
      direct comparability.
    diligencePath: >-
      Pull recent app-analytics panels and management accounts for Roposo, Chingari, and Josh before final investment
      committee comparison.
    relatedQuestionRefs:
      - QP005
      - QP015
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: current-liquidity
    missingEvidence: Current unrestricted cash, minimum-cash policy, and monthly liquidity bridge after the 2024 convertible financing.
    whyItMatters: >-
      Without current unrestricted cash, public burn commentary cannot be translated into a reliable runway or downside
      case.
    diligencePath: >-
      Request month-end cash balances, bank statements, and management cash-flow bridge from Mar-2024 through the latest
      closed month.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: debenture-terms
    missingEvidence: >-
      Coupon, maturity, conversion floor/cap, covenants, security package, and lender ranking for the 2024 convertible
