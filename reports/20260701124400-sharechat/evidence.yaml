    whyItMatters: >-
      The financing structure determines dilution, cash-interest burden, refinancing pressure, and what valuation-reset
      language really means.
    diligencePath: >-
      Obtain executed debenture instruments, board approvals, side letters, and updated cap-table waterfalls from
      counsel or finance.
