  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: advertiser-retention
    missingEvidence: NRR, repeat-campaign rate, renewal cohorts, contract length, and average campaigns per advertiser by size or vertical.
    whyItMatters: Without retention and cohort data, public proof can show campaign activity but cannot show whether advertiser spend compounds or churns quickly.
    diligencePath: Request campaign cohort retention, average revenue per active advertiser, and top-decile renewal rates split by enterprise, agency, and SMB accounts.
    relatedQuestionRefs:
    - QU017
    - QU026
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-advertiser share, top-10 account revenue concentration, vertical mix, and agency-versus-direct revenue split.
    whyItMatters: A small number of large brands or agencies could be driving a disproportionate share of monetization even if the user base is broad.
    diligencePath: Request internal revenue concentration tables, direct-versus-channel revenue mix, and advertiser spend distributions by sector and account size.
    relatedQuestionRefs:
    - QU018
    - QU024
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: minor
    topic: scale-definitions
    missingEvidence: A current management bridge reconciling ShareChat-only MAU, Moj MAU, combined-network MAU, creator counts, downloads, and registered-user figures.
    whyItMatters: Public scale claims are usable only when the metric scope is explicit; mixed definitions can overstate or understate actual adoption momentum.
    diligencePath: Request a one-page KPI dictionary and historical monthly series for MAU, DAU, active creators, paying advertisers, and combined-network reach.
    relatedQuestionRefs:
    - QU004
    - QU019
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: material
    topic: independent-customer-proof
    missingEvidence: Customer-authored renewal references, procurement-grade advertiser references, or independent ROI studies showing repeat budget decisions.
    whyItMatters: Most named proof is vendor-curated, which is useful for existence proof but weaker for underwriting wallet durability and satisfaction.
    diligencePath: Seek reference calls with repeat advertisers, customer-authored case studies, and agency post-campaign renewal data tied to named accounts.
    relatedQuestionRefs:
    - QU019
    - QU026
    relatedTableRefs:
    - TU003
