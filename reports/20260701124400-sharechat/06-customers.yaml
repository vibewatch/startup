- id: retention-gaps-concentration-and-channel-risk
  title: Retention gaps, concentration, and channel risk
  body: 'The biggest public diligence problem is not whether ShareChat can attract users or run campaigns; it is whether investors can underwrite durability. None of the reviewed materials discloses NRR, GRR, logo churn, repeat-campaign rates, contract duration, or top-advertiser concentration. Partner channels also matter: GroupM and Httpool are useful expansion routes, but they show that part of the go-to-market depends on agencies and reseller-style distribution rather than only direct demand. Macro conditions are supportive—WPP expects India''s ad market to grow almost 10 percent in 2026 and says digital already takes 68 percent of spend—but that tailwind does not solve low-ARPU monetization by itself. The IIM Ahmedabad case explicitly frames monetization as hard in India''s low-ARPU environment, and the recent Vibely App Store removal shows that new-product growth can be interrupted by platform-policy decisions. In short, the public evidence supports reach and campaign relevance, but
    concentration, renewal, and channel durability remain under-disclosed.'
