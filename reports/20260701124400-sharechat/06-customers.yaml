- id: adoption-and-named-customer-proof
  title: Adoption trajectory and named advertiser proof
  body: 'Public proof of adoption is strongest when ShareChat or Moj discloses a named campaign with a measurable output. Amazon miniTV is the clearest reach example, with the official case study stating that Moj helped it reach 4.3 crore users. Flipkart''s Big Billion Days campaign reportedly generated 12.3 crore views with 100 regional influencers, while Dettol''s Moj campaign cites a Nielsen lift study showing 33 percent gains in recommendation and purchase intention. Star Sports used both ShareChat and Moj to expand Pro Kabaddi engagement, and Adgully reports that Mountain Dew''s 50-day Moj campaign exceeded 10 billion views with more than 200 creators. Separately, the company has described itself as already working with the top 200 advertisers and building toward a much larger sales base. The caveat is proof quality: almost all named evidence is vendor-published or interview-based, so it proves real campaign usage far better than it proves long-term wallet share or repeat budgets.'
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU031
  - CU037
  - CU039
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: repeat-usage-creator-supply-and-smb-expansion
  title: Repeat usage, creator supply, and SMB expansion
  body: 'Repeat usage is visible publicly on the consumer and creator sides, but much less visible on the advertiser side. ShareChat discloses 31 minutes of average daily time spent on the core app, while current ad materials put the combined network at more than 34 minutes per day. Google Play adds additional scale proxies, with ShareChat above 500 million downloads and Moj above 100 million downloads, both at ratings above 4.1 with multi-million review counts. Creator durability is supported by explicit operating mechanisms: streak rules require weekly and daily posting, original creators qualify for better rewards and brand deals, and Spotlight creators receive mentorship. The sales motion is also broadening. Media Infoline says Moj had about 75 brand collaborations generating about 150 influencer-led campaigns over six months, and Social Samosa says the self-serve platform had already supported more than 2,400 SMBs. Those are real repeat-usage and monetization signals, but they still
    describe activity better than they describe durable advertiser retention or margin quality.'
  claimRefs:
  - CU003
  - CU008
  - CU010
  - CU012
  - CU013
  - CU014
  - CU024
  - CU028
  - CU029
  - CU030
  - CU041
