- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or channel risk
  - Impact
  - Diligence path
  rows:
  - - Self-serve ads and multilingual targeting
    - SMB accounts diversify the base but may carry smaller budgets and higher churn
    - Broadens wallet count beyond large brands while potentially lowering average spend per account
    - Request cohort spend, CAC payback, and retention by advertiser size
  - - Agency and channel partnerships (GroupM, Httpool)
    - Part of go-to-market is partner-assisted, so channel priorities can shape account flow
    - Helps land more buyers quickly, but can create indirect dependence on agency and reseller momentum
    - Request direct-versus-channel revenue mix and partner concentration
  - - Creator-led branded campaigns
    - Revenue quality depends on creator supply, originality, and campaign execution quality
    - Strong creator supply can amplify brands, while weak creator retention can degrade inventory quality
    - Request active creator retention, payout economics, and share of campaigns using paid creators
  - - Bharat and language-first reach
    - Advertiser thesis is heavily tied to India's vernacular and short-video ad budgets
    - If ad demand weakens in those categories, revenue could swing despite large consumer reach
    - Request vertical revenue mix, regional spend mix, and top-category exposure
  - - App-store distribution and policy compliance
    - New products can be impaired by marketplace policy decisions, as shown by Vibely's App Store removal
    - Limits experimentation and acquisition in new surfaces even if the core brands remain large
    - Request history of platform-policy incidents and contingency distribution plans
  - - Vendor-curated proof set
    - Most public proof is on reach and lift, not repeat budgets or procurement-grade references
    - Can overstate breadth relative to durable wallet share if repeat spend is concentrated
    - Request top 20 advertisers, repeat-campaign share, and customer reference calls
  notes: This table separates visible expansion levers from the public-data gaps that still block an underwrite on revenue durability.
