company:
  name: ShareChat
chapter:
  number: 6
  title: Customers
  summary: Public evidence shows ShareChat running a very large multi-sided vernacular network—180 million ShareChat MAU on the core app, 325 million-plus combined ShareChat and Moj MAU in current ad materials, and named advertiser proof from Amazon miniTV, Flipkart, Dettol, Star Sports, and Mountain Dew. The strengths are breadth across Bharat users, creators, and advertisers plus visible SMB onboarding; the weak point is durability disclosure, because repeat-spend, contract, and concentration data are still absent from the public record.
sections:
- id: user-and-buyer-segmentation
  title: User, creator, and buyer segmentation
  body: 'ShareChat''s customer picture only makes sense if the platform is treated as multi-sided. On the demand side, the core ShareChat app is positioned around vernacular consumers who come for status content, memes, video, chatrooms, and live interaction, while Moj skews toward younger short-video audiences. Official materials place ShareChat at 180 million monthly active users with 32 million-plus creators, and ad materials market the combined ShareChat-plus-Moj network at 325 million-plus MAU across 15 or more languages. The public segmentation split is also meaningful: ShareChat is described as broader, older, and more tier-2/tier-3, while Moj is described as younger and more tier-1. On the paying side, buyers range from national brands and agencies to SMBs using self-serve ads, with repeated vertical references to e-commerce, FMCG, entertainment, gaming, and mobile brands. That breadth is strategically attractive, but public disclosures still stop short of revenue mix by segment
    or category.'
  claimRefs:
  - CU001
  - CU002
  - CU006
