tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale proof
  - Strategic value
  - Key gap
  rows:
  - - ShareChat vernacular consumers
    - User and viewer; payer is indirect via advertisers
    - Statuses, memes, video, chatrooms, and live community content
    - 180M MAU; 31 minutes daily; 75M+ UGC items per month
    - Core attention pool monetized through ads, gifting, and creator programs
    - No public DAU, cohort retention, or paid-user split
  - - Moj young short-video viewers
    - User and viewer; payer is indirect via advertisers
    - Short videos, reels, short dramas, and creator discovery
    - 85% of Moj users are 18-34; ~300M users in 2023 interview; 100M+ downloads
    - Youth-heavy inventory for reach and creator-led brand campaigns
    - Current MAU definition and paid-vs-free mix are unclear
  - - Creators and influencers
    - User-supplier on the content side; may also become campaign earners
    - Original content creation, hashtag challenges, livestreaming, and brand collaborations
    - 32M+ ShareChat creators; ~50M Moj creators; 1 in 4 Moj creators join brand hashtag challenges
    - Supplies inventory and native distribution for campaigns
    - Creator retention, payout take-rate, and top-creator concentration are undisclosed
  - - National brands and agencies
    - Buyer and payer are brand or agency teams; user is the audience they target
    - Awareness, recall, seasonal launches, and creator-led UGC campaigns
    - Top 200 advertisers mentioned in 2023 CRO interview; named cases across Amazon miniTV, Flipkart, Dettol, and Star Sports
    - Large-wallet buyers validate enterprise demand for Bharat reach
    - No public top-customer share, renewal rate, or contract-length disclosure
  - - SMB, D2C, and mid-market advertisers
    - Buyer and payer are business owners or growth teams; user is the target audience
    - Self-serve awareness and conversion campaigns in Indic languages
    - 2400+ SMBs supported on self-serve ads platform; Httpool expansion into mid-market
    - Diversifies revenue beyond large agencies and brands
    - Spend per account, churn, and expansion economics are not public
  - - 'Vertical specialists: e-commerce, FMCG, media, gaming, OEM, music'
    - Buyer is category marketing team; user is Bharat-language consumer or fan community
    - Category-specific launches, offers, entertainment promotion, and performance campaigns
    - Official factsheets and interview evidence cite these verticals repeatedly
    - Shows demand is not tied to one single advertiser category
    - No public revenue mix by vertical or sector concentration disclosure
  notes: Segmentation mixes the user, creator, and advertiser sides of ShareChat's network because this chapter covers who uses, who supplies, and who pays for the platform.
