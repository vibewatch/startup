- id: moat-durability-and-risk
  title: Moat Durability, Distribution Power, and Adverse Evidence
  body: 'ShareChat''s defensible wedge is real but narrower than the company''s peak-era scale claims suggest. The strongest
    positive case is that no global incumbent is built specifically for vernacular community identity, social gifting, and
    India-first micro-entertainment in the way ShareChat and Moj are; Roposo''s commerce layer and Josh''s language graph
    prove there is still local room to differentiate. The negative case is stronger in the public record: Moj''s independent
    usage trend is disputed, leadership churn has been meaningful, and the domestic cohort overall has translated funding
    into burn reduction programs more often than into unambiguous category leadership. Meanwhile, the largest rivals have
    structurally better distribution. Meta monetizes India at a scale ShareChat cannot currently approach, YouTube publishes
    a creator payout formula rather than only marketing claims, Snapchat already has 250 million India MAU, and Glance places
    Roposo on more than 200 million lock screens. ShareChat therefore faces a classic moat test: can vernacular nuance, live-social
    monetization, and new formats offset incumbent scale before domestic-category economics harden against it?'
