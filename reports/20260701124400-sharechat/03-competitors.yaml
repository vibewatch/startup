callouts:
- calloutType: insight
  title: The metric lens matters as much as the number
  body: The biggest analytical trap in this category is treating MAU, DAU, ad reach, and views as interchangeable. Moj's 160M
    company claim, data.ai's 54M December 2023 estimate, YouTube's 500M India ad reach, and Snapchat's 250M company MAU are
    all real public signals, but they describe different things. Any investor comparison that compresses them into one “current
    scale” column will overstate certainty.
  claimRefs:
  - CP016
  - CP017
  - CP044
  - CP047
- calloutType: risk
  title: Global platforms set the monetization benchmark
  body: Domestic peers still matter, but the revenue and creator-economics benchmark is no longer another Indian startup.
    Meta already monetizes India at ₹22,730 crore of FY24 gross ad revenue, YouTube publishes a formal 45% Shorts payout rule,
    Snapchat reports 250M India MAU, and Glance can put Roposo on more than 200M lock screens. ShareChat therefore competes
    against distribution systems, not just against other apps.
  claimRefs:
  - CP033
  - CP036
  - CP037
  - CP044
  - CP050
