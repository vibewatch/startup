- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Vernacular and Bharat-language identity
    - Reels and Shorts localize content faster and absorb more creator attention
    - High
    - Moj/Josh/Roposo MAU declines in 2023 while Instagram grew; domestic user claims remain contested
    - Request retention and language-segment cohorts by platform before assuming vernacular stickiness
  - - Large historical user base
    - Current Moj scale is disputed by independent tracking
    - High
    - ShareChat cites 160M Moj MAU, but Inc42/data.ai reports 54M in Dec 2023
    - Obtain 2025-2026 third-party panels and internal MAU/DAU definitions
  - - Domestic funding advantage
    - Capital has translated into layoffs, burn reduction, and impairment across the cohort
    - High
    - ShareChat, VerSe, and Chingari all show cost pressure despite large historical raises
    - Ask for current runway, cost structure, and creator-acquisition economics
  - - Live-social and new-format monetization
    - Micro-drama, live, and subscription bets may shift the company into adjacent categories rather than strengthen the core
      moat
    - Medium
    - QuickTV push, subscription narrative, and RMG-ad demand shock all imply product-model transition
    - Clarify whether new formats defend Moj or simply diversify away from it
  - - Independent app distribution
    - Global incumbents own stronger advertiser, creator, and discovery rails
    - High
    - Meta India ad revenue, YouTube creator payouts, Snapchat scale, and Glance lock-screen reach all exceed ShareChat's
      public distribution signals
    - Benchmark creator liquidity and advertiser repeat rates against Meta, YouTube, Snap, and Glance
  - - Domestic peer weakness is a moat
    - Weak peers do not matter if global substitutes already set the category benchmark
    - Medium
    - Domestic apps are stressed, but the true benchmark has shifted to Reels, Shorts, and Snapchat
    - Frame diligence against incumbent substitutes, not only Indian peers
  notes: Risk register focuses on competitive durability rather than general company risk; several rows intentionally combine
    official claims with adverse independent evidence to preserve contradictions.
