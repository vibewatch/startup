tables:
- id: TP001
  title: Competitor Profile Table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation vs. ShareChat/Moj
  enumerationScope:
    coverage: partial
    basis: Covers the main domestic peers and global substitutes repeatedly cited across fetched public sources as of the
      2026 run date; excludes niche creator tools and pure messaging apps without short-video evidence in this chapter.
  rows:
  - - ShareChat / Moj
    - Domestic benchmark
    - ~$1.3B raised; FY24 revenue ₹718.1 Cr; merger-era Moj 160M MAU claim
    - Vernacular social users, creators, live-streaming audiences
    - India-first vernacular identity plus live-social monetization and micro-drama experimentation
    - Current Moj scale is disputed by independent tracking; ad stack and creator payouts are less transparent than big-tech
      rivals
  - - Josh / Dailyhunt (VerSe)
    - Direct domestic peer
    - 139M Josh MAU and 68M DAU claimed in 2024; >350M Dailyhunt users claimed; >$1.5B raised
    - Regional-language content consumers, creators, publishers
    - Language graph plus news/content network through Dailyhunt
    - User figures are company-claimed; VerSe is still cutting burn and targeting break-even
  - - Instagram Reels
    - Global incumbent substitute
    - Meta India FY24 gross ad revenue ₹22,730 Cr; commissioned study claims Reels is India's preferred SFV platform
    - Mass consumer short-video and brand-discovery audiences
    - Largest advertiser stack and strong creator engagement claims inside Meta ecosystem
    - India leadership evidence in this set is commissioned by Meta, not independent
  - - YouTube Shorts
    - Global incumbent substitute
    - 500M India ad reach (late 2025); trillions of India Shorts views; 11K+ Indian 1M-subscriber channels
    - Video creators, advertisers, mass entertainment audiences
    - Formal creator revenue share plus very large creator base and watchtime scale
    - Reach figures are ad-reach and company-cited Comscore metrics, not direct MAU disclosure
  - - Snapchat Spotlight
    - Adjacent incumbent substitute
    - 250M India MAU in 2025; 120M+ users watch Stories/Spotlight
    - Young, camera-first and creator-led audiences
    - Strong 13-34 concentration and growing India creator distribution via Spotlight/Stories
    - Snapchat usage is broader than short video alone, so direct comparability is imperfect
  - - Roposo / Glance
    - Domestic adjacent peer
    - 80M active users claimed; live commerce plus 200M+ Glance lock-screen distribution claimed
    - Gen-Z entertainment, live shopping, creator commerce
    - Lock-screen distribution and shopatainment, not just feed consumption
    - Public evidence is company-claimed and commerce-heavy rather than purely social-video
  - - Chingari
    - Smaller domestic peer
    - ₹113.1 Cr+ FY23 revenue, $88.34M+ funding, 158 employees, but data is low-confidence
    - Bharat entertainment users and live-streaming audiences
    - Domestic brand with live streaming and blockchain-era monetization experimentation
    - Layoffs, widening losses, and token-price collapse show weak business durability
  notes: Mixes company-claimed scale, independent financial reporting, and ad-reach estimates; figures are not like-for-like
    and should be read as directional competitive signals rather than audited market shares.
