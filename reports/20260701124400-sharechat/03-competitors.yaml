  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: moj-current-mau-claim
    missingEvidence: Independent 2025-2026 app-analytics or internal cohort data that reconciles ShareChat's 160 million Moj
      MAU claim with data.ai-based 54 million December 2023 tracking.
    whyItMatters: The chapter's central question is whether Moj still has enough scale to matter against Reels and Shorts;
      the answer changes competitive ranking and moat assessment.
    diligencePath: Request internal MAU/DAU cohorts, 30/90-day retention, and third-party app-analytics exports for Moj and
      Josh covering 2024-2026.
    relatedQuestionRefs:
    - QP008
    - QP022
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Comparable advertiser rate cards or campaign benchmark data for Moj, Josh, Reels, Snapchat, and Roposo.
    whyItMatters: Public packaging pages do not reveal whether domestic apps can price competitively against Meta and YouTube
      for brand or performance budgets.
    diligencePath: Ask management for anonymized CPM/CPC benchmarks, creator-marketplace take-rates, and advertiser case studies
      by platform.
