- id: domestic-peers-and-measurement-friction
  title: Domestic Peers and the Measurement Friction Problem
  body: 'The domestic comparison set is still important because it shows what has and has not worked since the TikTok-ban
    window opened. ShareChat''s own filings show a business that is monetizing heavily through live streaming and chatrooms
    while reducing losses, but the adverse evidence on Moj suggests that scale durability is less certain than top-line company
    narratives imply. ShareChat''s merger-era and management claims still point to very large MAU and creator numbers, yet
    Inc42''s data.ai-sourced reporting shows Moj, Josh, and Roposo all losing MAU in 2023 while Instagram kept growing. VerSe,
    the Josh and Dailyhunt parent, remains the most relevant domestic peer because it has both a larger content graph and
    a larger disclosed revenue base than ShareChat, but it too is cutting burn and leaning on management-provided user numbers.
    Chingari and Roposo are smaller, but they matter because they show the same category truth: user claims can be large,
    yet monetization quality, creator retention, and capital efficiency remain much harder to prove.'
