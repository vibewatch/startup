  - id: FE003
    title: Critical Dependency Map
    type: dag
    layout: wide
    summary: >-
      The product promise depends on the ranking stack, state infrastructure, supply quality, mobile or runtime
      reliability, and outside platform-governance rules all holding together.
    approximationNotes: >-
      Directed dependencies reflect public materials only; they show the highest-consequence failure points rather than
      every internal microservice.
