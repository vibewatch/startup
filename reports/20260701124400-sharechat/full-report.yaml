        - id: models
          label: Recommendation and content models
          detail: Personalization, content understanding, video-quality and targeting logic
        - id: state
          label: Dedup state + stream stack
          detail: ScyllaDB, Flink, Redpanda, Redis legacy, and candidate-processing state
        - id: runtime
          label: Kubernetes / network / mobile runtime
          detail: Autoscaling, routing, compression, persistent connections, video handling
        - id: policy
