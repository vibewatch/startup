            title: The next 500 million users matter more than the last 100 million
            body: >-
              ShareChat's strategic edge is not that India is online; it is that the marginal growth in Indian internet
              consumption is increasingly rural, regional-language, and short-video native. That is a better fit for
              ShareChat and Moj than for text-first or metro-first social products.
