  - id: FE002
    title: Customer Workflow / Operating Flow
    type: flow
    layout: wide
    summary: >-
      The public operating loop runs from creator supply and content ingestion into recommendation, consumption,
      monetization, and safety feedback.
    approximationNotes: >-
      The flow compresses consumer, creator, and advertiser interactions into one operating picture because the public
      materials describe them as interlocking loops rather than isolated subsystems.
    data:
      nodes:
        - id: create
          label: Creators produce content
          detail: Posts, videos, short dramas, live sessions, and branded content
        - id: shape
          label: Quality / originality shaping
          detail: Streaks, creator hub prompts, Spotlight, and originality rules influence supply
        - id: rank
          label: AI + dedup recommendation
          detail: Candidates are filtered, ranked, and personalized before delivery
        - id: consume
          label: Users consume / share / chat
          detail: ShareChat feed, Moj viewing, chatrooms, live, private profile controls
        - id: monetize
          label: Ads and subscriptions monetize engagement
          detail: Ads Manager, SSP, SC Plus, SC Blue, Moj+
        - id: moderate
          label: Reports, policy, and deletion controls
          detail: Reporting, takedowns, synthetic-content rules, and account deletion close the loop
      edges:
        - from: create
          to: shape
          label: is guided by
        - from: shape
          to: rank
          label: feeds
        - from: rank
          to: consume
          label: delivers to
        - from: consume
          to: monetize
          label: creates inventory for
        - from: consume
          to: moderate
          label: can trigger
        - from: moderate
          to: shape
          label: constrains
    claimRefs:
