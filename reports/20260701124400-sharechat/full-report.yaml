      - number: '5.2'
        title: Recommendation and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              The best public view into ShareChat's technical core comes from the 2026 ScyllaDB write-up and the
              company's own team descriptions. Publicly, ShareChat says AI and ML create the backbone of ShareChat and
              Moj, with content understanding, personalized feeds, creator tools, and video quality improvement as named
              responsibilities. The external engineering write-up then fills in the missing architecture: the
              personalized feed first pulls candidates from vector databases, filters duplicates, scores and ranks items
              with ML models, and returns the top results. A key nuance is the split between 'sent posts' and 'viewed
              posts' state, which prevents both repeated feed delivery and overzealous suppression of items a user never
              actually saw. Historically, this dedup layer ran on Pub/Sub, Dataflow, Bigtable, Redis, and a Go service
              on Kubernetes; ShareChat later moved large parts of it to Redpanda, Flink, and ScyllaDB, then tuned HPA,
              compression, retention windows, and routing to cut cost and latency sharply. That evidence implies a
              company with real systems depth in recommendation infrastructure, but it also highlights dependencies on
              streaming reliability, state-store economics, cloud routing, and operational correctness under high
              traffic variability.
