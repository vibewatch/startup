            body: >-
              ShareChat's differentiation is not only that it serves Indian languages, but that it productizes creator
              behavior and monetization around that vernacular supply. Public materials describe creator streaks,
              creator hub prompts, hashtag challenges, motion-video templates, originality rules, Spotlight mentoring,
              and brand-campaign eligibility as built-in workflow levers rather than back-office community programs. The
              originality documentation is particularly important because it shows how the company tries to shape supply
