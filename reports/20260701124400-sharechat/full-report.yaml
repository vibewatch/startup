  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Overview and Competitive Taxonomy
        blocks:
          - type: paragraph
            body: >-
              ShareChat competes in two overlapping markets at once: vernacular community feeds led by ShareChat and
              short-video attention led by Moj. The domestic peer set created by India's TikTok ban still matters—Josh,
              Chingari, and Roposo all remain reference points for local-language content, live commerce, or creator
              supply—but the substitution pressure now comes primarily from global incumbents. Instagram Reels and
              YouTube Shorts have become the clearest attention and creator-liquidity alternatives, while Snapchat
              Spotlight is a meaningful youth-audience substitute and Roposo/Glance adds a non-feed distribution path
              through Android lock screens. That makes this a competition chapter about asymmetry more than feature
              parity: domestic apps still own some Bharat-language and live-social nuance, but the global platforms
              arrive with much larger reach, stronger monetization rails, and better capitalized parent stacks. The
              consequence is that ShareChat must defend a narrower local moat while competing in a market whose
              benchmark is increasingly set by Meta, Google, and Snap rather than by other Indian startups.
