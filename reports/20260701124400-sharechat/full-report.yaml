  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: User, creator, and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              ShareChat's customer picture only makes sense if the platform is treated as multi-sided. On the demand
              side, the core ShareChat app is positioned around vernacular consumers who come for status content, memes,
              video, chatrooms, and live interaction, while Moj skews toward younger short-video audiences. Official
              materials place ShareChat at 180 million monthly active users with 32 million-plus creators, and ad
              materials market the combined ShareChat-plus-Moj network at 325 million-plus MAU across 15 or more
              languages. The public segmentation split is also meaningful: ShareChat is described as broader, older, and
              more tier-2/tier-3, while Moj is described as younger and more tier-1. On the paying side, buyers range
              from national brands and agencies to SMBs using self-serve ads, with repeated vertical references to
              e-commerce, FMCG, entertainment, gaming, and mobile brands. That breadth is strategically attractive, but
              public disclosures still stop short of revenue mix by segment or category.
