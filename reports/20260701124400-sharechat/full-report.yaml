  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              ShareChat's biggest non-financial risk is that Indian intermediary status does not fully insulate product
              choices that look editorial, rights-managed, or commercially enabled. The company has refreshed its terms
              and content policy in 2026, explicitly grounds them in the IT Act and IT Rules, and publishes grievance
              and compliance contacts. That is the good news. The harder issue is that the Zee Entertainment dispute is
              not abstract: the Delhi High Court record says Mohalla Tech's in-built music libraries on ShareChat and
              Moj remained central to a copyright fight after license expiry, and the December 2025 judgment kept the
              case alive in Delhi while the company continued to rely on Section 79 safe-harbour arguments. Add the
              newer three-hour takedown expectation described by management in 2026, and the legal exposure is not
              merely about one lawsuit; it is about whether a high-volume vernacular platform can prove that governance,
              licensing, and response processes scale as fast as product experimentation.
