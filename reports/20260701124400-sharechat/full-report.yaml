      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Founding identity is still anchored to the original trio of Ankush Sachdeva, Bhanu Pratap Singh, and Farid
              Ahsan, but the leadership picture is no longer the classic three-founder operating structure. Ankush
              remains the public face and CEO, while multiple reports say Bhanu and Farid stepped back from executive
              roles in January 2023 after already drifting away from day-to-day operating control. That matters because
              public evidence does not show a fully institutionalised governance layer replacing them. Instead,
              reporting repeatedly points to a much more concentrated operating centre around Ankush and a smaller set
              of non-founder executives.


              The 2025-2026 hiring pattern reinforces that reading. Moneycontrol positioned CFO Manohar Charan as one of
              Ankush Sachdeva's main lieutenants during the company's restructuring period, while later reporting
              highlighted the addition of former TikTok executive Nitin Jain as CTO and former Google India executive
              Neha Markanda as chief business officer. Those hires suggest the company is rebuilding around
              monetisation, performance, and advertiser relationships rather than around a broad disclosed board or
              committee structure. The legal documents confirm the registered office, grievance channels, and policy
              maintenance cadence, but public sources still leave board composition, committee responsibilities, and
              current investor-control rights under-disclosed. That is a real diligence gap because the company has
              already lived through founder-role contraction, repeated layoffs, and a valuation reset.
            claimRefs:
