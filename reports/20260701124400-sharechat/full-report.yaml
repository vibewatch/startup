      - number: '3.3'
        title: Monetization Models and Incumbent Scale Advantages
        blocks:
          - type: paragraph
            body: >-
              The sharpest competitive gap is not content format but monetization infrastructure. ShareChat's FY24
              advertising revenue of roughly ₹315 crore and its FY25 pivot toward subscriptions and micro-dramas show a
              domestic platform still searching for stable monetization lines beyond volatile ad categories. By
              contrast, Meta India alone reported ₹22,730 crore of FY24 gross advertising revenue, and YouTube not only
              claims enormous India Shorts usage but also publishes an explicit 45% creator revenue-share framework for
              Shorts. That combination matters because creator liquidity and advertiser budgets reinforce each other:
              creators prefer platforms with clearer payouts and audience conversion, while brands prefer platforms with
              reliable measurement and scaled demand. ShareChat's QuickTV pivot and live-streaming strength show it is
              trying to escape a pure short-video commoditization trap, but the public evidence suggests Meta and
              YouTube still set the monetization benchmark, with Snapchat increasingly relevant for youth audience share
