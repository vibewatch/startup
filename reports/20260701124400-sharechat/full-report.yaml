        title: Adoption trajectory and named advertiser proof
        blocks:
          - type: paragraph
            body: >-
              Public proof of adoption is strongest when ShareChat or Moj discloses a named campaign with a measurable
              output. Amazon miniTV is the clearest reach example, with the official case study stating that Moj helped
              it reach 4.3 crore users. Flipkart's Big Billion Days campaign reportedly generated 12.3 crore views with
              100 regional influencers, while Dettol's Moj campaign cites a Nielsen lift study showing 33 percent gains
              in recommendation and purchase intention. Star Sports used both ShareChat and Moj to expand Pro Kabaddi
              engagement, and Adgully reports that Mountain Dew's 50-day Moj campaign exceeded 10 billion views with
              more than 200 creators. Separately, the company has described itself as already working with the top 200
              advertisers and building toward a much larger sales base. The caveat is proof quality: almost all named
              evidence is vendor-published or interview-based, so it proves real campaign usage far better than it
