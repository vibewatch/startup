      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The user side of the market is dominated by Bharat-first, mobile-first audiences rather than metro-only
              early adopters. IAMAI/Kantar says rural India already represented 57% of active internet users in 2025,
              and short-video consumption reached 61% of users overall. ShareChat’s commercial material and third-party
              coverage reinforce that positioning: the company says it reaches 325 million monthly active users in 15+
              languages, while Storyboard18 reports that about 63% of platform users come from Tier 2 and Tier 3 cities.
              This means the most important end-user segments are rural and semi-urban vernacular consumers, urban Gen Z
              short-video viewers, creators seeking audience growth and monetization, and socially influenced shoppers
              who discover products through native-language video.


              The payer side is different. National FMCG, beauty, telecom, auto, entertainment, and e-commerce brands
              are the primary budget owners for scaled campaigns, while regional brands and SMEs matter because they
              need culturally contextualized reach and lower creative-cost formats. EY estimated that more than one
              million SMEs and long-tail advertisers already contributed Rs 363 billion to India’s digital advertising
              market in 2025, while WPP named SME, Tech/Telco, Realty, Auto, and Education as major 2026 growth
              categories. Agencies and brand teams therefore act as the effective buyers, creators are the enabling
              supply side, and end users supply attention plus trust. The monetization challenge is that the user cohort
              is clearly large and engaged, but advertisers still judge it through attribution, brand-safety, and
              conversion lenses that favor Meta and YouTube. That split between audience strength and buyer caution is
              central to how ShareChat’s market should be underwritten.
