chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Products, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The legal entity is Mohalla Tech Pvt Ltd, and the current public surface clearly separates the flagship
              ShareChat product from Moj rather than presenting one undifferentiated consumer app. ShareChat's own legal
              and privacy documents tie the platform back to Mohalla Tech and place the registered office in Bengaluru,
              while the about page roots the origin story in November 2014, when the founders identified an
              Indic-language content audience underserved by English-first social platforms. Today the product footprint
              is broader than that founding insight alone. ShareChat still markets itself as the social destination for
              statuses, memes, jokes, devotional content, live rooms, and regional-language engagement, while Moj is now
              explicitly framed as a short-video and short-drama app with a premium Moj+ layer.


              The operating model has also become easier to see in public artifacts. The team page describes product
              pods for feed personalisation, content understanding, discovery, moderation, creator tools, livestreaming,
              and creator ecosystem work, while the business page and ads surface make clear that management is
              monetising through advertising, brand solutions, creator campaigns, virtual gifting, and now
              subscription-style short-drama experiments. This is why the most defensible identity statement is not
              “Indian TikTok alternative” alone. The company is running a two-platform vernacular internet stack:
              ShareChat as the social graph and culture layer, Moj as the video-and-drama layer, and a common
              monetisation engine that sells Bharat reach to advertisers while trying to deepen monetisation through
              live and premium content.
