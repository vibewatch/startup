  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Last Priced Mark Versus Today's Clearing Price
        blocks:
          - type: paragraph
            body: >-
              The starting point for ShareChat valuation is not controversial: the last clean public equity milestone is
              the company's June 2022 announcement that a multi-tranche round closed at a $5 billion valuation. That
              figure still matters because it is the last clearly disclosed priced mark tied to marquee investors and a
              company-authored announcement. The harder question is whether it remains a usable entry reference in 2026.
              Public evidence after the 2022 peak argues that it does not. TechCrunch reported in December 2023 that new
              funding talks could price ShareChat as low as below $1.5 billion, while Moneycontrol separately reported a
              December 2023 convertible-notes process at roughly $2.7 billion and later cited media reports putting the
              April 2024 venture-debt round around $1.5 billion. None of those later datapoints are as clean as a priced
              equity round, but taken together they imply that the investable clearing price moved far below the
              headline $5 billion mark. That makes $5 billion a historical reference point, not a current underwriting
              fact, and it also means any new investor should focus as much on instrument terms, dilution, and
              preference stack as on the nominal valuation headline.
