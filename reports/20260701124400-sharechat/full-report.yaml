  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      ShareChat's monetization journey starts with vernacular user attention, deepens through creator supply, and only
      then converts into advertiser spending and repeat budgets.
    data:
      nodes:
        - id: discover
          label: Vernacular discovery
          detail: >-
            Users arrive for status content, memes, video, and community interactions in their preferred Indian
            language.
        - id: habit
          label: Habit formation
          detail: Repeat time spent, sharing, and content creation build attention inventory that can later be monetized.
        - id: creator
          label: Creator activation
          detail: >-
            Creators are nudged by streaks, spotlight grooming, original-content incentives, and brand campaign
            eligibility.
        - id: brand
          label: Brand onboarding
          detail: Advertisers land through managed sales or self-serve ads and choose language, audience, and campaign goal.
        - id: ugc
          label: Creator-led amplification
          detail: Hashtag challenges, branded lenses, and influencer videos expand reach into user-generated distribution.
        - id: repeat
          label: Repeat-budget test
          detail: The loop only becomes durable if campaigns repeat, but public renewal metrics are not disclosed.
    approximationNotes: >-
      The map combines user, creator, and advertiser stages because ShareChat's customer journey is inherently
      multi-sided rather than a one-sided B2B sales funnel.
    claimRefs:
      - CU008
      - CU009
      - CU012
      - CU013
      - CU014
      - CU020
      - CU021
      - CU022
      - CU028
      - CU041
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Public evidence supports a staged flow from brand need to creator-led execution and then to repeat-budget
      decisions, but not reliable public conversion percentages between stages.
    data:
      nodes:
        - id: need
          label: Brand need
          detail: Buyer wants reach, recall, creator-led engagement, or lower-funnel action with Bharat audiences.
        - id: entry
          label: Entry route
          detail: Account arrives through enterprise sales, agency partners, or self-serve onboarding.
        - id: targeting
          label: Targeting and language selection
          detail: Campaign is localized by language, region, and audience segment across ShareChat and Moj.
        - id: execution
          label: Creator and format execution
          detail: Campaign uses creators, hashtag challenges, branded lenses, in-feed ads, or premium placements.
        - id: measurement
          label: Outcome measurement
          detail: Public proofs emphasize reach, views, lift studies, and CPR improvement rather than contract economics.
        - id: repeat
          label: Repeat budget decision
          detail: Durability depends on campaign renewal and spend expansion, which are not publicly disclosed.
      edges:
        - from: need
          to: entry
          label: Choose route
        - from: entry
          to: targeting
          label: Set audience
        - from: targeting
          to: execution
          label: Launch campaign
        - from: execution
          to: measurement
          label: Read outcomes
        - from: measurement
          to: repeat
          label: Renew or stop
    approximationNotes: >-
      A flow is used instead of a numeric funnel because the public corpus shows staged motions and outputs, but not
      disclosed stage-by-stage conversion rates.
