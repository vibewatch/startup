  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      The recommendation moves from a real historical $5B mark through lower current implied values and operating repair
      to a track call rather than a buy call.
    data:
      nodes:
        - id: peak
          label: Historical mark
          detail: $5B official 2022 priced-round reference
        - id: reset
          label: Reset evidence
          detail: 2023-2025 financing clues point to ~$1.5B-$2.7B
        - id: repair
          label: Operating repair
          detail: Cash burn down, FY25 EBITDA loss much lower, core business cashflow positive
        - id: comp
          label: Public comp reality
          detail: Listed social peers carry much larger disclosed revenue bases
        - id: call
          label: Investment call
          detail: Track; stretched at $5B, fairer only near the lower implied band
      edges:
        - from: peak
          to: reset
          label: is challenged by
        - from: reset
          to: repair
          label: tempered by
        - from: repair
          to: comp
          label: still judged against
        - from: comp
          to: call
          label: leads to
    claimRefs:
