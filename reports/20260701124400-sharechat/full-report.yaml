  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              For ShareChat, the economically relevant market is narrower than “Indian social media” and broader than a
              single app category. The core market includes vernacular social feeds, short-form video inventory,
              creator-led brand campaigns, live and virtual-gifting monetization, and the regional-language discovery
              surfaces that sit between entertainment and commerce. That boundary matches how users actually behave:
              IAMAI/Kantar reported 958 million active internet users in 2025, 588 million of whom consumed short
              videos, while nearly all users consumed Indic-language content somewhere in the journey. ShareChat’s own
              business pages explicitly pitch 15+ language reach, 325 million combined MAUs across ShareChat and Moj,
              and 280 billion monthly video views, so the company is monetizing attention inside a regional-language,
              mobile-first consumption layer rather than competing only with text-first social networks.


              Included spend therefore covers brand advertising sold against regional video and feed impressions,
              creator and influencer campaigns routed through Moj or ShareChat, commerce-led brand activity meant to
              drive discovery or consideration in Bharat markets, and digital consumer transactions such as virtual
              gifting or live interactions that the company itself highlights as diversification beyond pure ads.
              Excluded spend includes long-form OTT subscriptions, TV advertising, search advertising, pure display
              networks, and gaming spend, although these are important adjacent substitutes for consumer attention and
              advertiser budgets. The most important status-quo substitutes are Instagram Reels, YouTube Shorts,
              traditional television for reach, and offline word-of-mouth in regional markets. That is why the right
              market frame for valuation is not simply “social users in India” but the intersection of regional-language
              attention, short-video engagement, and advertiser willingness to pay for that attention.
