  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surfaces and User Jobs
        blocks:
          - type: paragraph
            body: >-
              ShareChat's public product surface now spans at least five distinct jobs-to-be-done. The main ShareChat
              app is still the vernacular social and utility feed: it packages status sharing, videos, memes, shayari,
              chatrooms, live hosts, virtual gifts, and community interaction into a language-first discovery product
              rather than a friend-graph network. Moj is a separate entertainment and creator surface optimized for
              swipeable short videos, filters, effects, trending sounds, and increasingly short-drama viewing through
              Moj+ premium originals. A third surface is the advertiser stack: ShareChat Ads Manager and the self-serve
              SSP expose campaign setup, language targeting, budgets, and delivery controls for brands. On top of that
              sit creator and monetization modules such as Original Creator qualification, Streaks, Spotlight,
              ShareChat+, and SC Blue. The result is a multi-product architecture where the feed is the distribution
              engine, creator programs are the supply engine, and ads or subscriptions are the monetization layers. That
              breadth is strategically useful because it diversifies engagement loops, but it also means product quality
              depends on keeping consumer, creator, advertiser, and trust workflows coordinated rather than treating
              them as isolated apps.
