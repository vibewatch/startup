              refreshed policies, publishes grievance and compliance contacts, claims rights-management tools in court,
              markets large scale to advertisers, and has improved losses materially. Those factors matter. But they are
              not self-proving. For this chapter, the right framing is to treat them as procedural mitigants that buy
              time rather than as definitive proof that the platform can absorb a legal shock, a cyber event, or a
