      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest structural growth drivers are still on the demand side. India’s internet base keeps
              expanding, regional-language usage is mainstream rather than niche, and short-form video has become a
              default format for hundreds of millions of users. IAMAI/Kantar’s 2025 release points to AI features,
              short-video consumption, and e-commerce as the main expansion engines; Redseer shows that new-media
              formats such as edutainment and micro-dramas are already taking hold among Tier 2/3 audiences; BCG shows
              brands are planning to increase creator budgets by 1.5x to 3x over the next two to three years. On the
              monetization side, WPP and Dentsu both describe a digital ad market shifting toward commerce, video,
              social, and outcome-led media, while EY shows digital media has already become India’s largest M&E
              segment.


              The constraints are equally material. First, public market sizing remains inconsistent, with WPP and
              Dentsu far apart on total AdEx and IAMAI/Kepios using different internet-user methodologies. Second,
              ShareChat-specific monetization quality is disputed: Storyboard18 describes advertiser caution around
              attribution, conversion quality, and brand-safety perceptions, even while ShareChat says it works with 75%
              of top BARC ADEX brands. Third, compliance costs are rising. India’s 2025 intermediary amendments
              tightened takedown governance, and draft MeitY rules would require labeling and declaration workflows for
              synthetically generated content. DPDP Rules 2025 add data-governance obligations and meaningful financial
              penalties. Together, these pressures suggest the market is growing fast, but not all growth is equally
              monetizable or margin-accretive for a vernacular platform.
