- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Rural internet expansion to 57% of active users
    - Driver
    - Current
    - Expands vernacular audience depth outside metros
    - What share of ShareChat/Moj watch time comes from new versus repeat rural cohorts?
  - - 588 million short-video consumers in 2025
    - Driver
    - Current
    - Confirms the format is mainstream, not experimental
    - How much of this cohort is monetizable at premium CPMs?
  - - Regional-language content preference and OTT localization
    - Driver
    - Current / medium term
    - Supports ShareChat's language-first positioning and creator supply
    - What portion of brand creative is natively localized versus translated?
  - - Brands scaling creator budgets 1.5-3x
    - Driver
    - 2-3 years
    - Creator monetization can grow faster than pure display ads
    - How much of creator budget expansion flows to short-video regional platforms?
  - - Advertiser caution on attribution and conversion quality
    - Constraint
    - Current
    - Suppresses performance-budget share despite high reach
    - What are repeat-advertiser rates and ROAS benchmarks versus Meta/YouTube?
  - - Divergent market estimates (Dentsu vs WPP; ICUBE vs Kepios)
    - Constraint
    - Current
    - Complicates valuation models and TAM comparability
    - Which methodology best matches the monetization surface being valued?
  - - Synthetic-content and takedown compliance obligations
    - Constraint
    - Current / medium term
    - Raises moderation, tooling, and legal-compliance costs
    - How much moderation and trust-and-safety spend is required to stay compliant?
  - - DPDP compliance and data-governance penalties
    - Constraint
    - Current / medium term
    - Could limit ad-targeting freedom and increase operational burden
    - What first-party data and consent architecture does ShareChat rely on for targeting?
  notes: Direction reflects impact on market expansion or monetization efficiency, not on gross consumer demand alone. Several constraints do not shrink user demand but can still cap ad yields and valuation multiples.
