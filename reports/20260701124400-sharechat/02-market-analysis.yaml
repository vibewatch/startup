- id: diligence-gaps-and-investment-implications
  title: Diligence Gaps and Investment Implications
  body: 'The main market question is no longer whether India’s vernacular short-video market exists; it clearly does. The harder question is what portion of that demand converts into advertiser spend and platform revenue at attractive unit economics. Public sources do not disclose ShareChat/Moj’s active advertiser count, repeat advertiser retention, average CPMs by language, creator payout take-rates, or the overlap between the 325 million combined MAUs across the two apps. That means the company’s theoretical reach can be sized, but its true SOM cannot be cleanly isolated.


    For investors, the practical takeaway is to treat three separate curves differently. The audience curve is strong: regional-language and Tier 2/3 growth is still compounding. The creator-commerce curve is promising: BCG and Qoruz both show brand money moving toward creators, especially around high-attention events and vernacular engagement. The conversion curve remains the least proven: third-party marketers still describe Moj and ShareChat as experimental for performance outcomes, and the regulatory stack is getting heavier just as AI-generated content and live monetization surfaces expand. Until the company discloses more around advertiser quality, repeat spend, and creator monetization efficiency, the market should be valued as a fast-growing but still converging vernacular-attention platform rather than a fully matured performance-ad network.'
