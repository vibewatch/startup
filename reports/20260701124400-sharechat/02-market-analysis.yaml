  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: advertiser-economics
    missingEvidence: Active advertiser count, repeat-advertiser retention, campaign ROAS benchmarks, and language-level CPM yields for ShareChat and Moj.
    whyItMatters: Without buyer-quality and monetization-efficiency data, the market can be sized only at the category level and not at a defensible SOM level for ShareChat.
    diligencePath: Request cohort-level advertiser metrics, repeat-spend curves, and case-study level conversion data by vertical and language.
    relatedQuestionRefs:
    - QM026
    - QM028
  - type: private-evidence-only
    severity: material
    topic: user-overlap
    missingEvidence: Unique-user overlap between ShareChat and Moj, plus DAU/MAU and retention splits by app and geography.
    whyItMatters: Combined MAUs overstate effective addressability if the same users are counted across both apps or if occasional users dominate the tally.
    diligencePath: Ask management for de-duplicated MAU, DAU, retention, and overlap disclosures for ShareChat and Moj separately.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: creator-monetization
    missingEvidence: Public disclosure of creator payout take-rates, virtual-gifting revenue split, and monetization by creator tier or language cohort.
    whyItMatters: Creator-economy upside is central to the bull case, but absent take-rate data it is impossible to translate creator activity into platform revenue quality.
    diligencePath: Obtain creator-economy P&L slices, creator payout ladders, and live / gifting attach rates from management.
    relatedQuestionRefs:
    - QM029
  - type: conflicting-data
    severity: minor
    topic: market-sizing-methodology
    missingEvidence: A methodology bridge that reconciles IAMAI active users with Kepios internet users and Dentsu AdEx with WPP TYNY totals.
    whyItMatters: Contradictory public baselines can distort valuation if the numerator and denominator come from incomparable market definitions.
    diligencePath: Standardize one valuation model on a single methodology and request publisher notes or management guidance on which benchmark best mirrors revenue exposure.
    relatedQuestionRefs:
    - QM019
    - QM020
    relatedTableRefs:
    - TM002
