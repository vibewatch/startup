- id: market-sizing-multiple-lenses
  title: Market Sizing Through Multiple Lenses
  body: 'A single “TAM” number would be misleading because the market can be sized from at least three non-equivalent lenses. The user-attention lens starts with India’s internet base: IAMAI/Kantar counted 886 million active users in 2024 and 958 million in 2025, while DataReportal/Kepios estimated 1.03 billion internet users and 500 million social-media identities at the end of 2025. The gap matters because ShareChat monetizes active attention, not raw registrations. The second lens is advertiser wallet size. Dentsu estimated India’s total AdEx at Rs 1,21,339 crore in 2025 and forecast Rs 1,30,416 crore in 2026, with digital at Rs 71,621 crore in 2025 and social plus online video together at Rs 41,061 crore. WPP, however, forecast a much larger 2026 advertising market of Rs 2,01,891 crore, with digital at 68.1% of revenue. That 55% spread between Dentsu’s and WPP’s 2026 top-line forecasts is too large to smooth away; it likely reflects different inclusion rules around digital extensions,
    commerce media, and broader measurement scope.


    The third lens is creator-influenced commerce. BCG estimated India already has 2 to 2.5 million monetized creators influencing USD 350-400 billion of consumer spending, with creator-influenced consumption surpassing USD 1 trillion by 2030. That is not the same as platform revenue, but it explains why investor narratives for Moj increasingly blend ad inventory, creator monetization, and commerce discovery. EY/FICCI adds a fourth useful adjacency: digital media crossed Rs 1 trillion in 2025 and digital advertising alone reached Rs 947 billion, with over one million SMEs and long-tail advertisers contributing Rs 363 billion. For valuation work, the most conservative SAM for ShareChat/Moj is Dentsu’s 2025 social-media plus online-video pool; the more expansive SAM layers in creator commerce and live monetization, but those monetization rates are not publicly disclosed.'
