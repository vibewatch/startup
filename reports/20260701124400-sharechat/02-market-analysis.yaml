  title: Audience scale does not automatically equal advertiser quality
  body: Third-party marketers still describe ShareChat and Moj as experimental for performance outcomes even while the company reports deep engagement and major-brand adoption. That gap between reach and conversion proof is the core market-risk variable for valuation.
