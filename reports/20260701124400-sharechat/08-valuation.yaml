- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - 2026 public value / status
  - Revenue evidence
  - Why it matters
  - Limitation
  rows:
  - - Reddit
    - ~$33.4B market cap
    - 2025 revenue $2.2B (SEC 10-K)
    - Shows what a scaled public UGC platform can command when revenue is already in the billions
    - US public-market liquidity and monetization are much deeper than ShareChat's
  - - Pinterest
    - ~$11.8B market cap
    - 2025 revenue $4.22B (SEC 10-K)
    - Useful for a consumer internet platform with ad and commerce orientation
    - Different use case and stronger global advertiser base
  - - Snap
    - ~$7.35B market cap
    - 2025 revenue $5.9B (SEC 10-K)
    - Closest reminder that even a pressured listed social platform still has far larger disclosed revenue scale than ShareChat
    - Public equity value is not the same as private enterprise value and Snap remains global
  - - ShareChat lower implied band
    - ~$1.5B-$2.7B from 2023-2025 financing evidence
    - FY24 revenue Rs 718 crore; FY25 revenue Rs 723 crore
    - Closest public clue to current clearing price after the 2022 peak
    - Not a clean priced equity round; debt and convertible structures muddy the signal
  - - ShareChat last priced peak
    - ~$5.0B official 2022 mark
    - Official round closure plus later funding history
    - Still the anchor for historical cap-table expectations and employee-option psychology
    - Stale ZIRP-era reference, not current market consensus
  notes: This table mixes public equity market caps and private implied marks to show valuation context; it is not a strict EV/revenue comp sheet.
