- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale
    - Vernacular social reach and creator distribution remain uniquely large in India
    - Large audience has not yet converted into listed-peer monetization density
    - Show sustained ARPU and paying-user expansion without subsidy
  - - Turnaround
    - Burn has fallen sharply and the core business is cashflow positive
    - The repair may be cost-led rather than proof of durable growth quality
    - Publish audited FY25 and FY26 cash-flow conversion with cleaner margins
  - - Financing quality
    - Lower implied values can reset expectations and create room for upside
    - Debt and convertible structures can hide preference overhang and dilution
    - Disclose full security terms and cap-table economics
  - - IPO path
    - Management is openly discussing a listing window and market-driven pricing
    - Leadership churn and policy issues could still slow governance readiness
    - Evidence a stable senior bench, auditor path, and listing workstream
  - - Valuation
    - A new round near the lower implied band could look investable
    - The stale $5B mark remains too full against public-comp scale
    - Price discipline matters more than headline brand value
  notes: The anti-thesis is about price, governance, and monetization quality rather than the absence of product-market fit.
