- id: operating-repair-versus-public-comp-scale
  title: Operating Repair Versus Public-Comp Scale
  body: 'The operating story is much better than the peak-to-reset valuation story. Mohalla Tech''s public disclosures through Moneycontrol show a real repair arc: revenue rose from Rs 346.9 crore in FY22 to Rs 553 crore in FY23, Rs 718 crore in FY24, and Rs 723 crore in FY25, while adjusted EBITDA losses narrowed from Rs 2,400 crore in FY23 to Rs 793 crore in FY24 and then Rs 219 crore in FY25. Management now says the core social business is cashflow positive, that annualized revenue run rate topped Rs 1,000 crore by the end of the first half of FY26, and that new growth is expected from subscriptions and micro-dramas. Even so, the public-comp frame still restrains enthusiasm. As of July 2026, Reddit''s market cap was about $33.4 billion, Pinterest''s about $11.8 billion, and Snap''s about $7.35 billion, while their 2025 revenues in SEC filings were roughly $2.2 billion, $4.22 billion, and $5.9 billion, respectively. ShareChat''s monetization scale remains far smaller in public evidence,
    even if its user reach is large. So the operating turnaround supports survival and optionality, but it does not by itself make the old $5 billion mark look conservative when set against listed social-media revenue scale and equity-market context.'
