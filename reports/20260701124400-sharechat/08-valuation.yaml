  - CV042
  - CV046
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - 2024-2025 financing terms
    - Exact instrument, conversion terms, liquidation preference, seniority, and dilution math
    - Current implied value is unusable without understanding the real economic stack
    - Request board-approved term sheets and cap-table bridge
  - - Audited FY25 and FY26 statements
    - Full P&L, cash flow, balance sheet, and segment detail beyond press statements
    - Needed to test whether the turnaround is sustainable and cash-backed
    - Obtain filed accounts and management accounts reconciliation
  - - Monetization cohorts
    - ARPU, paying-user cohorts, retention, creator monetization, and revenue by line
    - Needed to know whether scale is monetizing like a public social platform or just stabilizing
    - Run product and finance diligence with cohort tables
  - - IPO readiness workstream
    - Auditor readiness, board composition, internal controls, legal cleanup, and listing venue plan
    - Public-listing ambition should not be underwritten from interviews alone
    - Request IPO readiness deck and governance calendar
  - - Policy and moderation exposure
    - App-store interactions, moderation exception logs, and cross-platform enforcement posture
    - A listing discount can widen quickly if policy risk looks unmanaged
    - Review trust-and-safety controls and platform correspondence
  notes: These asks are the minimum package needed to move from scenario framing to real entry pricing.
