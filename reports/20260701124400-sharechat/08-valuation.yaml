- id: ipo-readiness-kill-triggers-and-diligence
  title: IPO Readiness, Kill Triggers, and Diligence
  body: ShareChat has re-earned the right to discuss an IPO, but it has not yet earned the right to be underwritten as IPO-ready without caveats. Management has publicly floated a two-year listing ambition and late-2027 target language, yet the same public record also includes four rounds of layoffs in roughly two years, co-founder role exits, senior commercial leadership churn, and a June 2026 App Store policy issue involving Vibely. Those are not fatal problems, but they do raise the diligence threshold for governance, content moderation, and organization durability. More importantly, the cap-table story remains opaque because the most recent financings were debt or convertible structures rather than clean, widely disclosed equity rounds. A serious investor still needs the exact security terms, preference stack, dilution math, audited FY25 statements, FY26 cash-flow bridge, user-retention and paying-user cohorts, and a tangible IPO workplan around governance, auditors, controls, and listing
    venue. Until that package is visible, the thesis can break on financing quality even if the operating trend keeps improving. That is why the chapter ends with diligence asks and kill triggers, not with a hard buy call.
