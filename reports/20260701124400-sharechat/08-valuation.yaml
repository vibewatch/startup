  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-opacity
    missingEvidence: Exact 2024-2025 venture-debt and convertible instruments, conversion mechanics, liquidation preferences, and dilution bridge.
    whyItMatters: The public valuation debate cannot be turned into real new-money economics without knowing what sits senior to common equity and at what price it converts.
    diligencePath: Request executed term sheets, board approvals, and an updated fully diluted cap table covering every post-2022 financing instrument.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: fy25-audit-gap
    missingEvidence: Audited FY25 financial statements and a FY26 management bridge covering cash flow, balance sheet, and segment-level revenue mix.
    whyItMatters: The turnaround case relies on profitability quality and cash generation, which cannot be fully tested from interviews and article summaries alone.
    diligencePath: Obtain filed accounts, auditor commentary, and monthly management-reporting packs that reconcile FY24, FY25, and FY26 run-rate claims.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: ipo-readiness
    missingEvidence: Board, auditor, internal-control, legal-cleanup, and listing-workstream evidence for a credible IPO timetable.
    whyItMatters: A management interview about timing does not establish actual readiness for a public filing or justify an IPO-style multiple.
    diligencePath: Ask for the IPO readiness deck, governance calendar, listing venue memo, and current status of statutory and control remediation items.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-coverage
    missingEvidence: A fuller private and APAC social-media comp set with consistent enterprise-value and revenue normalization.
    whyItMatters: The current comparable table is decision-useful, but it is not an exhaustive sector screen and therefore should guide bands rather than produce a single-point fair value.
    diligencePath: Expand the comp deck with additional consumer-internet peers and broker-style adjustments for geography, ad maturity, and monetization mix.
    relatedTableRefs:
    - TV004
