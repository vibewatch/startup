  topStrengths:
    - ShareChat 与 Moj 合并覆盖面大，公司在 Bharat 分发上有真实护城河，也能继续吸引区域语言互联网类别的广告主。
    - 管理层已经跑出清晰的经营修复曲线：收入上升，调整后 EBITDA 亏损大幅收窄，核心 ShareChat 业务据称在 FY25 实现现金流为正。
    - 产品栈不止一个 app，覆盖社交、短视频、直播打赏、创作者变现、订阅和高端短剧试验。
    - 股东名单仍有 Google、Temasek、Lightspeed、Snap、X/Twitter 等一线战略和 crossover 投资人；即便估值重置，生态相关性仍有支撑。
  topRisks:
    - 上一次清晰的 $5 billion 估值已经过期，后续可转债和债务融资暗示当前清算价格低得多，优先权经济条款也不透明。
    - 当前现金、债务或可转债条款、实际广告定价、创作者分成瀑布，以及真实收入质量，公开披露仍很薄。
    - 多轮裁员、创始人角色收缩，以及后续高级商业团队流失，让任何 IPO 流程前的治理和执行都打上问号。
    - 相比 Meta 和 YouTube，广告主与代理商仍担心创作者质量、归因、转化意图和品牌安全。
    - 政策、审核、隐私、应用商店或平台治理问题，仍可能快速传导到增长、变现和上市准备。
  unresolvedGaps:
    - 经审计的 FY25 和 FY26 财务报表，包括完整现金流桥、当前不受限现金和融资义务。
    - 2024 年债务或可转债融资的准确条款清单，包括票息、到期日、转换触发条件和优先权结构。
    - cohort 层面的留存、付费用户密度、创作者分成瀑布，以及广告主实际定价或复投数据。
    - 董事会构成、委员会独立性，以及审计师、内控和上市地点规划等 IPO 准备工作的具体进展。
