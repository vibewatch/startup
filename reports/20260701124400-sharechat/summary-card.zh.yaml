summary:
  headline: 跟踪：ShareChat 在印度本土语言社交和短视频仍有可观规模，运营修复也快于许多消费者互联网同行；但在融资条款更清晰、经审计现金流证据和更稳定管理层支撑 IPO 叙事之前，过期的 $5 billion 估值仍显偏高。
