company:
  name: ShareChat
chapter:
  number: 7
  title: Risks
  summary: ShareChat's risk profile is dominated by Indian content-liability and takedown compliance, recurring copyright litigation tied directly to its music-library and UGC workflows, heavy dependence on ad-tech and mobile-app distribution, and a financing/execution story that still rests on turning microdrama and advertiser scale into durable profitability. The public file shows meaningful mitigants—formal policies, named compliance contacts, grievance routing, and sharply improved EBITDA losses—but not enough operating detail to underwrite moderation throughput, incident readiness, litigation reserve discipline, or IPO preparedness with high confidence.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and Legal Risk
  body: 'ShareChat''s biggest non-financial risk is that Indian intermediary status does not fully insulate product choices that look editorial, rights-managed, or commercially enabled. The company has refreshed its terms and content policy in 2026, explicitly grounds them in the IT Act and IT Rules, and publishes grievance and compliance contacts. That is the good news. The harder issue is that the Zee Entertainment dispute is not abstract: the Delhi High Court record says Mohalla Tech''s in-built music libraries on ShareChat and Moj remained central to a copyright fight after license expiry, and the December 2025 judgment kept the case alive in Delhi while the company continued to rely on Section 79 safe-harbour arguments. Add the newer three-hour takedown expectation described by management in 2026, and the legal exposure is not merely about one lawsuit; it is about whether a high-volume vernacular platform can prove that governance, licensing, and response processes scale as fast as
    product experimentation.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
