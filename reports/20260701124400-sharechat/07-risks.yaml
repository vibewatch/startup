- id: mitigations-and-kill-criteria
  title: Mitigations and Kill Criteria
  body: There are real mitigants in the public file, so the risk case is not one-dimensional. ShareChat has refreshed policies, publishes grievance and compliance contacts, claims rights-management tools in court, markets large scale to advertisers, and has improved losses materially. Those factors matter. But they are not self-proving. For this chapter, the right framing is to treat them as procedural mitigants that buy time rather than as definitive proof that the platform can absorb a legal shock, a cyber event, or a demand-side slowdown. The practical investment response is therefore trigger-based. If the Zee matter constrains the music-library workflow, if takedown or incident obligations start outrunning operating capacity, or if FY26 growth misses while microdrama spend stays elevated and advertisers still prefer Meta/YouTube, the thesis weakens quickly. Investors should underwrite ShareChat as a company with improving economics but still meaningful execution leverage, not as a fully
    de-risked vernacular social-media compounder.
