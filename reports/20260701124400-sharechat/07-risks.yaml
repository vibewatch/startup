  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: moderation-sla
    missingEvidence: Government and court takedown volumes, median handling times, appeal outcomes, false-positive rates, and moderator staffing coverage by language.
    whyItMatters: The public file proves the rulebook exists but not that ShareChat can satisfy shrinking response windows without material accuracy or legal tradeoffs.
    diligencePath: Request a 12-month moderation SLA pack segmented by order type, language, and escalation path.
    relatedQuestionRefs:
    - QR009
    - QR010
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: incident-transparency
    missingEvidence: Detailed transparency reports, incident history, abuse-prevalence metrics, CERT-In reporting examples, and customer-facing outage or abuse disclosures.
    whyItMatters: Without operating evidence, investors cannot tell whether policy breadth maps to real control performance across ShareChat and Moj.
    diligencePath: Request the last 12-18 months of transparency reports, abuse dashboards, and incident / postmortem summaries.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: cloud-concentration
    missingEvidence: Current AWS vs Google Cloud spend split, disaster-recovery design, recovery-time targets, and mobile-store contingency planning.
    whyItMatters: Cloud and mobile distribution are critical dependencies, yet public sources do not quantify concentration or recovery readiness.
    diligencePath: Request architecture, DR/BCP, provider-contract, and app-store escalation materials.
