    severity: material
    topic: litigation-reserve
    missingEvidence: Current music-licensing coverage, litigation reserve policy, settlement scenarios, and rights-management error rates for disputed audio content.
    whyItMatters: The core legal case is product-native, so reserve discipline and licensing completeness affect both valuation and operating flexibility.
