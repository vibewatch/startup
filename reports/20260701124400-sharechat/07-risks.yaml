- id: financing-burn-and-ipo-risk
  title: Financing, Burn, and IPO Execution Risk
  body: 'Financial risk has improved, but it has not disappeared. Public reporting shows that Mohalla Tech cut adjusted EBITDA losses sharply, pushed the core business to cashflow-positive territory, and is targeting 30% FY26 growth while claiming a ₹1,000 crore annualized run rate. The problem is that this cleaner P&L is being paired with a still-demanding strategic reset: valuation already fell from the $5 billion peak to below $2 billion in the 2024 debt round, management previously linked profitability to a later IPO path, and current growth increasingly depends on microdrama adoption and advertiser monetization rather than legacy feed economics alone. That is not automatically bearish, but it means the underwriting case rests on execution rather than balance-sheet abundance. A roughly 500-person organization is being asked to run live social, short video, rights management, ad sales, policy compliance, and a new content vertical at once. Without public reserve data, detailed cap-table
    context, or a board-articulated IPO plan, the financing story remains materially under-disclosed.'
