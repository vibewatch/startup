- id: moderation-privacy-and-cyber-risk
  title: Moderation, Privacy, and Cyber Compliance Risk
  body: 'The second major risk cluster is operational compliance: ShareChat''s products mix user-generated content, live surfaces, chatrooms, gifting, recommendation systems, and broad data collection across devices, contacts, searches, and location-linked signals. Management says moderation uses AI plus humans because full automation is unsafe, but that also means compliance costs and error risk rise when legal deadlines shrink. The public policy stack shows a wide rulebook for hate speech, privacy, misinformation, synthetic media, and chatroom conduct, while CERT-In directions impose six-hour incident reporting and 180-day logging duties on intermediaries. Those are manageable obligations for a narrow product, but ShareChat is not narrow; it is a multi-surface social and short-video ecosystem with real-time engagement features and heavy Android distribution. The missing piece is public operating proof: fetched transparency pages do not show detailed enforcement, abuse-prevalence, or incident-history
    data, so investors cannot tell whether the company is comfortably within the compliance envelope or simply documenting it well.'
  claimRefs:
