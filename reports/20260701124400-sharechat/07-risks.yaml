- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Copyright / intermediary liability
    - Delhi HC orders, settlement terms, platform audio-library changes
    - Adverse order or settlement that materially narrows licensed or UGC audio workflows
    - Re-underwrite creator supply, engagement, and brand-safety assumptions immediately
  - - Moderation SLA strain
    - Government-order volume, public controversy, takedown turnaround evidence
    - Repeated evidence that three-hour or similar deadlines cannot be met safely
    - Assume higher compliance opex and greater legal tail risk
  - - Cyber / privacy incident
    - CERT-In notice, public breach disclosure, or meaningful data-handling controversy
    - Material event requiring emergency disclosure, India logging review, or extended platform remediation
    - Reset trust assumptions and require incident playbook evidence before adding exposure
  - - Advertiser confidence and FY26 growth
    - ARR / annualized run rate, repeat advertiser activity, ad-revenue mix
    - Growth misses 30% target while conversion-oriented budgets still migrate to Meta or YouTube
    - Treat monetization thesis as weakened and re-rate valuation expectations down
  - - Microdrama execution
    - QuickTV / Moj+ retention, content spend, ad-supported episode monetization
    - High investment persists without clear retention or monetization proof by FY27 planning cycle
    - Assume new-vertical spend is delaying durable profitability rather than creating it
  - - IPO / financing readiness
    - Board narrative, audited profitability path, next fundraise terms
    - Need for another defensive capital raise before a credible public-market process emerges
    - Shift focus from upside optionality to dilution and preference risk
  notes: Kill criteria convert procedural mitigants into observable thresholds so improved EBITDA does not get mistaken for fully closed risk.
