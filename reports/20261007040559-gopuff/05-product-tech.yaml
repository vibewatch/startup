callouts:
  - calloutType: "insight"
    title: "First-Party Inventory Control Decouples Fulfillment from Merchant Friction"
    body: "Gopuff's primary technological and operating advantage over third-party marketplace delivery platforms is direct inventory ownership within hundreds of local micro-fulfillment centers. By holding approximately 4,000 SKUs per dark store and coordinating bin-location picking via digital panels, Gopuff minimizes pick-and-pack times to under 90 seconds. However, this model concentrates balance-sheet inventory risk and requires high localized order density to amortize lease and labor overhead."
    claimRefs:
      - "CE001"
      - "CE003"
  - calloutType: "risk"
    title: "Algorithmic Workforce Supervision Creates Severe Legal Exposure"
    body: "The algorithmic mechanisms that ensure sub-30 minute delivery—enforcing physical proximity to micro-fulfillment centers, strict shift-scheduling queues, and penalties for rejected orders—directly underpin government labor enforcement actions. In March 2025, the District of Columbia sued Gopuff under multiple wage and hour statutes, demonstrating that algorithmic dispatch controls threaten the viability of the independent contractor operating model."
    claimRefs:
      - "CE011"
      - "CE012"
