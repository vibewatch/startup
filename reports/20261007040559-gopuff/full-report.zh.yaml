              - CP003
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 覆盖面扩大伴随渠道依赖
            body: >-
              Gopuff 入驻 Uber Eats、DoorDash、Deliveroo，以及已宣布的 Instacart
