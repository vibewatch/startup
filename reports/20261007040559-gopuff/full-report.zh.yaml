chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              Gopuff 于 2013 年在费城由 Drexel 学生 Yakir Gola 和 Rafael Ilishayev
              创立。它不像纯配送平台那样撮合买卖，而是在微型履约设施中采购并持有库存，再以零售价销售，同时在订单上叠加配送费、会员收入和广告收入。相比聚合平台，这种结构让 Gopuff
              更能控制选品、定价、拣货和履约，但也意味着库存、设施、人工和配送经济性都由公司自己承担。现有证据支持其覆盖美国和英国；一份第三方资料称，截至 2025 年已服务美国 500
              多个地方，但资料池没有提供公司当前发布的地点数量。Gopuff 在 2022 年声称每单贡献利润超过 $4，这可作为单位经济性背景，不能视为公司整体盈利的经审计证明。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
