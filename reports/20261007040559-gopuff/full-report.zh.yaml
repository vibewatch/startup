  - id: FM001
    title: 受证据约束的市场规模阶梯
    type: pyramid
    summary: 证据从宽泛且低置信度的全球预测，逐步收窄到公司的运营代理指标和仍未解决的当前 SOM。
    data:
      items:
        - label: 宽泛的全球即时零售预测
          value: More than $337B by 2032
          detail: 低置信度二手参考，抓取文本中没有指明底层预测
        - label: 宽泛的数字化采用信号
          value: 30% pre-COVID online FMCG CAGR
          detail: 历史美国渠道增长，范围大于即时配送
        - label: 公司服务边界
          value: About 4,000 products
          detail: 公司称库存分布在数百个本地微型履约中心
        - label: 篮子扩张
          value: Beyond snacks and soda
          detail: 行业报道提到现制披萨、本地产品和杂货
        - label: 经济性限定
          value: At least 400 orders per day
          detail: 2022 年顾问估计；据报道，只有约 10% 至 20% 的 Gopuff 站点达到该水平
        - label: 当前收入口径 SOM
          value: Unavailable
          detail: 需要当前站点队列、客单价、留存率和贡献利润率
    approximationNotes: 这是不同口径的规模视角层级，而不是可相加的金字塔；宽泛预测和历史增长率没有被转换为 Gopuff 的 TAM、SAM 或 SOM。
