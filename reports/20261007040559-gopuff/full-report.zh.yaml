        title: 尽调解读与未解决的基线问题
        blocks:
          - type: paragraph
            body: >-
              更新后的公开记录在身份、商业模式机制、已命名融资事件和部分领导层变动方面最扎实；但在判断企业价值所需的数量上明显薄弱，包括经审计净收入、毛利率、EBITDA、自由现金流、现金、债务、活跃客户、订单频率、准确当前员工数，以及经核对的完全稀释股权结构表。一家声誉较低的软件供应商给出
              $2.2-$2.4 billion 收入估算，但页面对期间的标注前后不一致；这里仅把它保留为公开数据噪声信号，不作为经验证
              KPI。第三方资料还提到仓库关闭、反复裁员和员工分类罚款。这些不利事项应进一步追查原始文件，不能被解读为完整事件记录。因此，投资决策应锚定已披露交易，并要求管理层提供当前规模和盈利能力的证据。
