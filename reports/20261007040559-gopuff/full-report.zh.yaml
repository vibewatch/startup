      - number: '7.4'
        title: 监测指标与论点破裂标准
        blocks:
          - type: paragraph
            body: >-
              风险监测应区分可观察事件和未经支持、仅属估计值的判断。若法院或监管机构在核心市场要求员工分类、支付重大欠薪或施加运营限制，劳动暴露就会升级。若经审计材料显示，扣除履约人工和库存损失后四墙贡献持续为负、反复出现可用性失败，或保险及安全控制不足，运营暴露就会升级。若任何交易对手提供相当大比例的订单或履约，同时保留单方面定价、排名、客户数据或终止杠杆，合作伙伴暴露就会升级。如果这些事件同时发生且流动性不足以资助整改，投资论点应破裂。保留的
              Built In 资料无法回答这一问题：页面明确称其内容总结热门 LLM 的回答，未经 Gopuff 审阅或批准。因此，该页面的说法只被视为弱信号，热力图标注未知，而不是把未知转换为概率。
