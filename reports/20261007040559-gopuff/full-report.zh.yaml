  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现机制
        blocks:
          - type: paragraph
            body: >
              Gopuff 的核心收入架构与 DoorDash 或 Instacart 等第三方配送市场平台截然不同，因为它是垂直整合的直接零售商。公司在母实体 GoBrands, Inc.
              旗下运营，批量采购消费品，在数百个微型履约中心网络中持有实物库存，再以零售价直接销售给消费者。这种库存所有权结构消除了第三方杂货店中介，让 Gopuff
              能在零食、饮料、杂货、家居必需品、酒类和自有品牌商品等品类中，获取从批发采购成本到零售结账价之间的全部零售毛利。

              除产品零售加价外，Gopuff 还按订单收取履约费。非订阅用户每单支付标准固定配送费 $1.95；订单含酒类等受监管商品时，调整后的配送费为
              $2.00。为了维持低客单便利交易的正贡献利润，低于最低购物篮门槛的订单会收取小额附加费，而超过 $49 的订单可享受标准配送免费。这些物流费用直接抵消城市配送枢纽的订单路由、拣货、打包和骑手派送开支。

              为提高下单频率和经常性现金流，Gopuff 通过 Gopuff Fam 会员订阅变现用户。Fam 会员享受订单免配送费、较低最低订单门槛、促销折扣和优先派送，部分城市还包括 FAM20
              二十分钟配送保证。高频会员订阅提供稳定的基础运营现金流，同时提高三十天复购订单速度。在零售和订阅收入之外，Gopuff 还运营应用内数字媒体网络，PepsiCo、Mars Wrigley 和 Unilever
              等消费品制造商按点击付费广告费和赞助费，购买优先货架位置、赞助搜索结果和品类横幅。
