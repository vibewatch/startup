      - number: '5.2'
        title: 软件基础设施、分布式数据层与并发控制
        blocks:
          - type: paragraph
            body: >-
              Gopuff 的核心技术栈在客户端结合 React 和 Redux，移动应用使用 Swift 及跨平台网页技术开发。后端微服务分布在 Python 和 Ruby on Rails 服务环境中，由 Docker
              容器化支持，并托管于云基础设施。数据持久化和事务完整性依托关系型数据库管理系统，主要是 PostgreSQL；它执行严格的行级锁定和原子库存扣减，防止同时进行的多商品订单重复占用。云端遥测和系统完整性通过
              Sentry 等分布式跟踪平台及自定义运营遥测进行监控。
