  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与运营模式
        blocks:
          - type: paragraph
            body: >-
              竞争集合不止是快速配送初创公司。Gopuff 称其在数百个本地微型履约中心持有约 4,000 种商品；第三方资料则将 Instacart 描述为杂货市场平台、DoorDash
              描述为本地商店和餐厅配送平台、Shipt 描述为按需杂货服务商，将 Getir 和 Gorillas 描述为多品类杂货应用。Tracxn 的分类按其专有评分将 Gopuff 排在庞大市场的第三位，并将
              Instacart、DoorDash 和 Shipt 列为主要同行；该排名适合发现线索，不是独立的业绩基准。SoftwareSuggest
              将替代方案扩展到配送软件、线上杂货商和零售商关联服务，同时承认部分描述来自供应商。因此，买方真正的选择集合包括自有库存即时零售、第三方市场平台、零售商配送、由软件支持的内部配送运营，以及购物或自提的现状。现有证据没有量化后两类方案，其经济性仍是尽调缺口，不应被评分为优势。
            claimRefs:
