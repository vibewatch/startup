      - number: '8.2'
        title: 可比倍数与公开同行基准
        blocks:
          - type: paragraph
            body: >
              评估 Gopuff，要把其纵向整合的即时需求模式与 DoorDash（NASDAQ: DASH）、Instacart（NASDAQ:
              CART）等上市配送和平台同业比较。纯平台不持有库存，资本强度较低；Gopuff 则运营数百个本地化微型履约中心（MFC），备有约 4,000 个
              SKU，直接管理库存，获取商品毛利、配送便利费和不断增长的零售媒体广告收入。

              盈利上市同业的企业价值 / 收入倍数为 2.2x–4.6x：Instacart 为 2.2x–2.3x，广告高毛利收入提供支撑，但杂货 GMV 增长中等；DoorDash 约
              4.6x，受美国餐饮和本地配送份额、国际扩张及调整后 EBITDA 增长推动。相比之下，Gopuff $8.5 billion 私募基准对应估计为 $800 million 至 $1.0 billion
              的净收入，倍数约为 8.5x–10.5x。

              这份溢价反映其在北美快速商务领域的幸存者地位：Gorillas、Getir（美国 / 英国业务）、Buyk、Fridge No More 等直接竞争者均因现金消耗过重而倒闭或撤退。2026 年 9 月宣布的
              Instacart 全国合作、私有品牌扩张（Crave Shoppe、Basically）及 Howard Schultz 等董事会任命进一步强化商业护城河。但没有经审计的合并 GAAP
              财务数据验证毛利率、广告贡献和公司自由现金流时，把上市龙头的 2 倍溢价计入投资判断，估值风险很大。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 情景估值建模：乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              为建立严谨的估值框架，我们构建覆盖 2026–2028 年的三个前瞻退出情景，纳入运营规模、广告利润率扩张、资本结构，以及监管和劳工阻力，尤其是哥伦比亚特区总检察长等地方监管机构提起的独立承包商错误分类诉讼。

              乐观情景：私有品牌渗透率达到两位数、零售媒体广告变现，并借助 Instacart 整合增加配送量，使净收入达到 $1.2 billion–$1.4 billion。连续季度实现正公司自由现金流后，IPO 可按
              10.0x–12.0x EV/Revenue 定价，对应 $12.0 billion–$15.0 billion 上市估值；所有优先股类别正回报，普通股显著上行。

              基准情景：收入稳定在 $900 million–$1.05 billion，微型履约中心运营盈亏平衡，但公司 G&A 和司机分类合规成本限制合并净利润率。2027 年末按 8.0x–9.0x EV/Revenue
              IPO，对应 $7.5 billion–$9.0 billion 股权估值；优先清算顺位大致按面值兑付，普通股增量价值有限。

              悲观情景：消费者对便利费敏感，需求放缓；劳工诉讼迫使高成本重新分类或增加司机福利；广告收入无法抵消仓库费用。现金消耗重新加速，无法独立 IPO，只能以 4.0x–5.0x EV/Revenue（$3.5
              billion–$5.0 billion）重组或整合；高级清算优先权吸收全部收益，Series H 及更早期成长投资者严重减值，次级股权归零。
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 投资建议、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >
              综合证据记录，我们给予 Gopuff TRACK（跟踪）建议，置信度中等；估值判断为 STRETCHED（偏高），总体风险为 HIGH（高）。在许多同业失败的地方，Gopuff
              仍具运营韧性，在高密度城市和郊区市场守住 15–30 分钟配送利基。Matt McBrady 任 CFO；他曾在 Axon 和 aQuantive 负责公开退出，加上 PitchBook 给出的 96% IPO
              概率，说明上市准备已进入后期。

              但在 S-1 注册前按隐含 $8.5 billion 估值投入资本并不划算：相对 DoorDash、Instacart
              溢价过高，审计单位经济性也不透明。若法院判决要求关键大都市配送司机取得雇员身份、年度化现金消耗超过 $200 million，或首轮下行融资低于 $6.0 billion，评级将降至 AVOID。升级至 BUY
              则须由 S-1 证明持续公司 EBITDA 盈利和可核实的季度自由现金流。

              参与二级交易或 IPO 前联合投资前，机构投资者必须核实三项：经审计的 GAAP 报表（净收入、按履约中心批次划分的贡献利润率、广告收入占比）；完整股权结构表瀑布（Series X、Series H
              高级清算倍数和股息累计）；以及工人错误分类诉讼和地方执法程序的法律责任准备金。
            claimRefs:
              - CV002
              - CV005
              - CV009
              - CV010
              - CV013
              - CV016
      - number: '8.5'
        title: 附件
        blocks:
          - type: callout
            title: 建议：TRACK，等待公开 S-1 透明度
            body: >
              Gopuff 是快速商务领域令人印象深刻的幸存者，熬过了资金充裕的全球竞争者，同时压缩运营成本并强化治理。但 $8.5 billion 私募基准要求一个估计为 9.4x 的 EV/Revenue 倍数，明显高于
              DoorDash（4.6x）和 Instacart（2.3x）。在经审计的季度财务数据证明合并自由现金流为正之前，机构投资者应避免进入二级市场，等待公开市场发现价格。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV009
              - CV010
              - CV016
          - type: callout
            title: 资本结构悬置与下行情景下的优先权保护
            body: >
              Gopuff 通过债务、股权和延期轮融资累计筹资超过 $5.14 billion，背负沉重的优先股堆叠。后续融资轮（包括 Series H、Series X
              融资工具）的高级清算权优先于次级轮次和普通股。退出估值低于 $8.0 billion–$9.0 billion 时，普通股股东和持有期权的员工面临收益被压缩的风险，管理层与早期利益相关方的激励也会错位。
            calloutType: risk
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV016
