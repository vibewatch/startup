      - number: '4.2'
        title: 单位经济性、履约运营与成本结构
        blocks:
          - type: paragraph
            body: >
              即时零售的单位经济性，需要在产品零售毛利率与仓库履约间接费用、技术基础设施和本地骑手配送报酬之间取得平衡。由于 Gopuff
              在自营设施中持有自己的库存，而不是派骑手去第三方零售店取货，每单拣货和打包可在两分钟内完成。但这种垂直整合也把商业地产租赁、仓库人工、损耗、制冷公用事业和本地库存持有成本直接压到 Gopuff 的损益表上，覆盖
              200 多个活跃微型履约中心。

              履约流程从算法订单路由开始，依次经过实体拣货、批量打包和骑手派送。配送骑手从指定仓库备货区取走袋装订单，在 15 至 30
              分钟内完成最后一公里配送。订单批处理和算法路线优化能提高大都市市场的骑手每次投递密度，但郊区和次级市场的投递密度更低、运输时间更长。公司自有品牌产品线（如
              'Basically'）绕过全国品牌的批发加价，从而提高单位产品利润；不过，固定设施间接费用和骑手单次配送最低报酬仍会压缩这些利润增益。

              劳动成本是 Gopuff 配送模式中最大的可变运营成本，也是最大的监管风险。Gopuff 将最后一公里配送司机归类为独立 1099
              承包商，并单方面制定报酬公式、班次可用时间窗口和派单优先规则。在基准运营模式下，这种分类让 Gopuff
              无需支付最低工资、加班溢价、带薪病假和工资税。但地方及州监管机构正对该劳动模式发起强力法律挑战，可能推高可变骑手履约成本，改变基础订单单位贡献经济性。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
