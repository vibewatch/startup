  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Gopuff 的核心市场是即时需求零售，不是全部杂货或电商消费。其官方支持页面称，数百个本地微型履约中心持有约 4,000 种商品，这将供给范围限定在精选、直接备货的品类。历史独立分析把 Gopuff
              与便利店而非大型超市比较；后续报道则记录其从零食和汽水扩展到现制披萨、本地商品和杂货。因此，纳入的需求是看重有货率和短配送窗口的紧急补货、冲动消费及小篮子家庭需求；排除的需求包括计划好的每周采购、大众百货、餐厅餐食，以及从第三方货架履约的市场交易。现状仍是步行或驾车去便利店或超市；数字替代方案包括门店拣货服务和成熟杂货商自己的快速配送。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
