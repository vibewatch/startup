      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              增长可以来自更广选品、价值导向购物篮、渠道合作、大众品牌认知，以及同一购买场景上的零售媒体收益。这些驱动因素无法消除自有库存和本地履约带来的密度约束。Grocery Dive 报道称，2022 年一位顾问预估
              Gopuff 站点每天至少需要 400 单才能赚钱，只有约 10% 至 20%
              的站点达到该水平。同一文章称，收到所订商品比速度更重要，这削弱了只依赖不断缩短配送承诺的论点。劳动监管是第二项约束：哥伦比亚特区总检察长于 2025
              年提起诉讼，指控员工错误分类，并要求支付工资、缴款、损害赔偿和罚款；这些是指控，不是裁决结论。因此，估值应围绕当前队列留存、履约率、站点贡献利润率和劳动敏感度，而不是广泛的全球预测。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
