  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史、估值轨迹与资本结构悬垂
        blocks:
          - type: paragraph
            body: >
              Gopuff 的融资轨迹勾勒出过去十年即时零售行业的剧烈扩张及后续重新定价。Gopuff 由 Drexel University 本科生 Yakir Gola 和 Rafael Ilishayev 于 2013
              年创立，通过拥有库存而非只做第三方配送，开创了垂直整合的便利品配送。早期增长由天使资金和机构轮次支撑，包括 2015 年最初的 $8.25 million A 轮，以及 SoftBank Vision Fund
              于 2019 年 8 月投入的 $750 million 转折性资金。疫情期触发异常资本流入：2020 年 10 月，公司以 $3.9 billion 估值完成 $377.53 million F 轮融资，由
              Accel 和 D1 Capital Partners 牵头。2021 年 3 月，$1.15 billion G 轮融资又在短短五个月内将估值翻倍以上至 $8.9 billion。

              资本流入高峰出现在 2021 年 7 月：Gopuff 完成 $1.0 billion H 轮融资，估值达到 $15.0 billion 的历史高点，Blackstone、Guggenheim
              Investments、Hedosophia、Fidelity Management and Research 和 SoftBank 参与支持。机构和天使融资累计超过 $5.14 billion，其中包括 Bob
              Iger 于 2022 年 5 月牵头的天使参与轮。然而，全球风险投资市场随后降温，疫情后需求恢复常态，迫使公司激进转向运营。Gopuff 将定位转向暗仓盈利，在 2022 至 2025
              年间分阶段裁员并缩减仓库网络。

              2025 年末，Gopuff 完成一轮 $250 million 融资，实质上稳定了资本结构，并将私募估值重新锚定在约 $8.5 billion，较 2021 年峰值收缩 43%。PitchBook
              数据显示，这一融资里程碑将 Gopuff 通过 IPO 实现退出的概率提升至 96%。然而，累计超过 $5.14 billion
              的融资额造成巨大的清算优先权悬垂。高级优先股股东保有结构性下行保护，因此普通股股东和员工股权池必须在退出时获得大幅估值溢价，才能实现有意义的回报。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
