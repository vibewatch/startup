      - number: '3.3'
        title: 分销能力与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Gopuff 的模式形成了比单独应用更难复制的实体运营网络，但保留来源没有证明持久转换成本。Business of Apps 报道称，Gopuff 于 2021 年开始通过 Uber Eats 销售，之后扩展到
              DoorDash、Deliveroo 及其他配送应用，由 Gopuff 司机完成这些订单。Gopuff 新闻中心随后列出 2026 年 9 月与 Instacart
              的新美国合作。这种多平台经营可以提高利用率和客户发现，但也把部分需求获取放进了指定竞争者运营的渠道；这种依赖是推断，不是已披露商业条款。自有品牌扩张以及历史上的 FAM20
              和学生会员优惠，说明公司在差异化选品、服务和包装上做过尝试，但没有保留来源量化订阅者留存或自有品牌利润率。监管态势进一步造成不对称：哥伦比亚特区总检察长于 2025 年 3 月起诉 Gopuff
              相关实体，指控员工错误分类以及违反最低工资、加班和带薪病假规定。该指控尚非最终裁决，但如果运营方式或劳动成本必须改变，可能削弱归因于承包商配送的成本优势。
