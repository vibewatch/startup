      - number: '7.3'
        title: 合作伙伴依赖与薄弱的公开服务质量信号
        blocks:
          - type: paragraph
            body: >-
              Gopuff 新闻中心索引记录了 2026 年 9 月与 Instacart
              的美国合作公告，正值合作伙伴驱动和自有品牌发布节奏加快。该索引确认有活动，但未披露经济条款、排他性、集中度、服务义务、终止权或数据所有权，因此无法判断合作是分散需求还是造成重大依赖。Wikipedia
              还称，在司机劳动力缺口期间，Uber 骑手于 2023 年 3 月处理了至少 4% 的美国 Gopuff 订单；这是历史二手证据，不是当前集中度指标。公开投诉证据同样稀薄：保留的 BBB
              页面只有一般方法论免责声明，没有投诉详情或交易分母。因此它支持尽调缺口，而不支持关于 Gopuff 当前投诉率或服务质量的主张。
            claimRefs:
