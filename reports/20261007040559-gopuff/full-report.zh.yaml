  - id: FV001
    title: 推荐决策链
    type: flow
    summary: 将运营规模、成本重组、估值倍数和尽调要求连接至 TRACK 推荐的逻辑链。
    data:
      nodes:
        - id: node-scale
          label: 规模壁垒：美国 / 英国最后一家实现规模化的即时零售运营商，在数百个 MFC 中拥有 4,000 个 SKU
        - id: node-efficiency
          label: 重组：削减成本、融资 $250M 以及聘任 Matt McBrady 为 CFO，共同推高 IPO 概率至 96%
        - id: node-valuation
          label: 估值立场：$8.5B 的估值意味着约 9.4x EV/Rev，而实现盈利的上市同业为 2.3x-4.6x
        - id: node-risk
          label: 风险压顶：$5.14B 的优先股堆叠、DC AG 误分类诉讼，以及不透明的 GAAP FCF
        - id: node-governance
          label: 治理催化剂：Howard Schultz 进入董事会并与 Instacart 合作，进一步强化规模壁垒
        - id: node-verdict
          label: 结论：跟踪——估值偏高；等待公开提交 S-1 文件期间保持审慎立场
      edges:
        - from: node-scale
          to: node-efficiency
        - from: node-efficiency
          to: node-valuation
        - from: node-valuation
          to: node-risk
        - from: node-risk
          to: node-governance
        - from: node-governance
          to: node-verdict
    approximationNotes: 流程图展示投资评估与决策逻辑的结构性推进。
