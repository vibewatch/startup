      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              消费者用户和付款方通常是同一家庭，但采用触发因素各异。年轻消费者是历史核心：Grocery Dive 认为该体验对年轻用户有吸引力，并引用顾问称品牌身份面向 Z
              世代。家庭扩张取决于扩大购物篮；疫情期分析称，年长用户带来更大订单，而 Gopuff
              新闻中心后来将批量采购上线列为响应价值需求的举措。消费商业之外还存在独立的企业市场。消费品广告主从零售媒体预算中付费购买赞助商品和赞助搜索，触达已经接近购买的购物者。零售和平台合作伙伴构成另一类买方，但 2026
              年 9 月的 Instacart 合作目前仅由公司发布的标题确认；经济条款、客户关系归属和预算分配均未披露。
