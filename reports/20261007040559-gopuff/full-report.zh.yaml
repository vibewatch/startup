            title: 通过数字货架广告实现双重收入捕获
            body: Gopuff 的客户经济性受益于双重收入模式：一方面从直接消费者销售中获取零售产品毛利，另一方面把支付赞助展示和本地化履约中心优先数字货架曝光的供应商品牌变现。
            calloutType: insight
            claimRefs:
              - CU004
              - CU007
          - type: callout
            title: 司机分类诉讼威胁 SLA 可靠性
            body: 哥伦比亚特区和马萨诸塞州针对配送工人错误分类的现行诉讼及监管执法，直接威胁司机留存、本地订单履约 SLA 和客户满意度。
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管暴露
        blocks:
          - type: paragraph
            body: >-
              在现有证据中，哥伦比亚特区执法行动是与决策最相关的法律风险。总检察长宣布于 2025 年 3 月起诉，指控 GoBrands 和 GB Logistics
              错误分类配送工人并违反该区七项法规；请求救济包括补发工资、损害赔偿、公共项目缴款和民事罚款。一家独立人权出版物称 Gopuff 强烈反驳这些指控，因此申诉不是责任认定。另一起 2026
              年南卡罗来纳州命令以未能陈述合理诉求且未完成送达为由，对一项当事人自行代理的 ADA 和 ERISA
              诉讼作出不妨碍再次起诉的驳回。不能把这一程序性结果泛化为对劳动合规的整体判断。投资含义是把重新分类经济性视为正在发生的下行情景，直到审查当前案卷、保险条款和逐司法辖区的做法前，不应给出概率估计。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
