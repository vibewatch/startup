      - number: '7.2'
        title: 自有网络执行与财务不透明
        blocks:
          - type: paragraph
            body: >-
              Gopuff 称其在数百个本地微型履约中心持有约 4,000 种商品。该模式让公司直接控制可用性和履约，但也使库存、设施、本地劳动力和服务连续性留在运营边界内，而不是完全转移给商家。Wikipedia
              汇总的历史二手报道记录了 2022 年 7 月关闭 76 个仓库并影响约 1,500 名员工，随后 2024 年再减少约 600 名员工，即全球员工的
              6%。这些数字来自二手汇编且属于历史数据，说明过去的网络重构，不代表当前不稳定。现有资料池无法确定当前现金续航、经审计现金流、四墙经济性、损耗、停机频率或安全控制有效性。这些缺失使当前剩余风险严重程度无法量化，需要私下尽调，而不是模型化的精确数字。
            claimRefs:
              - CR005
              - CR006
              - CR013
              - CR014
              - CR016
