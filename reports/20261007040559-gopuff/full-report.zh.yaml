figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 精选的身份、融资、运营、治理及不利事件里程碑，展示公司从快速扩张转向重新投资。
    data:
      items:
        - date: '2013'
          label: 在费城创立
          detail: Yakir Gola 和 Rafael Ilishayev 就读 Drexel University 时创立了 Gopuff。
          tone: neutral
          claimRefs:
            - CO001
            - CO002
        - date: 2020-10
          label: 非上市估值达到 $3.9 billion
          detail: CNBC 将 2020 年 10 月的估值作为下一轮融资的基准。
          tone: neutral
          claimRefs:
            - CO006
        - date: '2021-03-23'
          label: 以 $8.9 billion 估值融资 $1.15 billion
          detail: CNBC 报道了这轮融资，以及此前非上市估值翻倍以上。
          tone: positive
          claimRefs:
            - CO006
        - date: 2021-07
          label: Reuters 报道 $15 billion 估值
