  - id: FE001
    title: Gopuff 技术与运营基础设施栈
    type: stack
    summary: 六层架构栈，展示消费者交互、合作伙伴发现 API、微服务编排、交易数据持久化、本地暗店拣选和末端调度。
    data:
      layers:
        - label: 客户端与呈现层
          detail: 提供客户目录浏览和实时订单追踪的移动端与网页端界面
          items:
            - 消费者移动应用（Swift / iOS）
            - 网页店面（React / Redux / Webpack）
        - label: 合作伙伴与外部 API 层
          detail: 接入市场平台需求渠道的外部发现网关和对话式界面
          items:
            - 合作伙伴入口 API（Instacart 美国集成）
            - 对话式商务引擎（Go / SpaceXAI 集成）
        - label: 应用与微服务层
          detail: 分布式服务路由、可用性计算和异步事件处理
          items:
            - 订单编排 API（Ruby on Rails 5 / Python）
            - 可用性计算引擎（等时圈与 Haversine 行驶时间）
            - 容器化微服务（Docker / 云平台）
        - label: 数据持久化与并发层
          detail: 关系型存储为库存分配维持严格的 ACID 事务保证
          items:
            - PostgreSQL 事务引擎（行级锁）
            - 微型履约 SKU 库存表（条件递减）
            - 分布式遥测与告警（Sentry 平台）
        - label: 暗店履约层
          detail: 设施内拣选指引和库存管理，推动包裹快速合并
          items:
            - 仓库拣选员面板（货位指引）
            - 实体 MFC 网络（每个暗店约 4,000 个 SKU）
            - 补货与入库补给工作流
        - label: 末端配送与骑手层
          detail: 通过算法进行骑手排队和车辆路径规划，实现快速送货上门
          items:
            - 司机调度应用（算法队列）
            - 动态行驶时间路线优化
            - 送达证明核验（数字签名 / OTP）
    approximationNotes: 层级分类综合自工程面试指南、系统设计分析和技术架构评审。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 可视化展示消费者发现、快速订单履约、Fam 订阅转化和多品类扩张的过程。
    data:
      items:
        - label: 发现应用
          stage: 发现与下载
          title: App Discovery
          touchpoints: App stores, social promotions, and college campus marketing
          actions: Consumer installs mobile application and registers delivery location
          painPoints: Delivery boundary limitations and local inventory availability checks
        - label: 即时需求购买
          stage: 首次下单
          title: Instant Needs Purchase
          touchpoints: Search catalog, curated essentials carousel, and checkout screen
          actions: User selects snack, drink, or OTC medicine items and submits order
          painPoints: Per-order delivery fee and convenience pricing markup
        - label: 订单调度
          stage: 超本地履约
          title: Order Dispatch
          touchpoints: Micro-fulfillment center picking, driver dispatch, live tracking
          actions: MFC staff picks order in minutes; driver completes doorstep delivery
          painPoints: Driver availability and weather-related delivery disruptions
        - label: Gopuff Fam 会员
          stage: 订阅转化
          title: Gopuff Fam Membership
          touchpoints: In-app membership prompt, free delivery promotion at checkout
          actions: User enrolls in $7.99/month Fam plan to eliminate delivery fees
          painPoints: Monthly recurring cost justification if order frequency declines
        - label: 全渠道购物篮增长
          stage: 品类扩张
          title: Omnichannel Basket Growth
          touchpoints: Alcohol catalog, BevMo! pickup, and partner brand promotions
          actions: Customer expands basket from late-night snacks to meal staples and beverages
          painPoints: Alcohol age verification checks and local retail licensing restrictions
        - label: 自动化习惯下单
          stage: 留存与再次下单
          title: Automated Habitual Ordering
          touchpoints: Push notifications, personalized re-order recommendations, Instacart channel
          actions: User establishes weekly instant grocery and convenience shopping routine
          painPoints: Platform switching to competing instant delivery services
    approximationNotes: 客户旅程阶段和触点取自 Gopuff 商业模式分析及公开服务工作流。
    claimRefs:
      - CU002
      - CU003
      - CU007
      - CU008
      - CU010
