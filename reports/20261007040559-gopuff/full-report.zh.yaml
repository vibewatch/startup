          - type: callout
            title: 劳动姿态属于竞争成本栈的一部分
            body: 哥伦比亚特区申诉指控员工错误分类并未支付法定保障。由于这只是指控而非判决，正确的投资判断应测试暴露程度和劳动模式敏感性，而不是假定有责或无责。
