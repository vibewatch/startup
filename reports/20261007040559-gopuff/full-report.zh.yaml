        blocks:
          - type: paragraph
            body: >-
              现有来源没有提供覆盖 Gopuff 服务地区、方法透明且当前有效的 TAM、SAM 或 SOM。一家软件供应商引用一份未署名预测，称全球即时零售到 2032 年可能超过 $337
              billion，但抓取到的文章没有说明预测发布方、基准年、分母或 CAGR，因此只能作为低置信度背景点，不能作为估值输入。2020 年 HBS Digital Initiative 分析引用美国线上快消品疫情前
              30% CAGR，但该历史指标覆盖的渠道比即时需求配送更广。公司覆盖范围和成熟站点吞吐量更适合自下而上分析：数百个微型履约中心约 4,000 种库存商品，再与 2022 年顾问估算的每站点每天至少 400
              单盈利门槛对照。当前站点数量、订单分布、总订单价值和贡献利润率仍不可得。
