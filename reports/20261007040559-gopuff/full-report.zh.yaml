        title: 垂直整合的运营架构与客户流程
        blocks:
          - type: paragraph
            body: >-
              Gopuff 通过运营数百个本地微型履约中心（MFC），在便利品、杂货、OTC
              医疗和酒类品类提供即时零售，而不是依赖第三方商家路由。客户在移动端或网页端发起会话时，可用性管道会查询驾车时间范围内能够配送的微型履约中心。不同于把司机派往零售店的点对点配送平台，Gopuff 直接拥有 SKU
              库存，从而实现端到端运营可视化。订单下达后，原子数据库事务确认库存分配，在本地暗仓内触发按货位拣货打包路由，再将合并包裹交给算法司机派单队列。
