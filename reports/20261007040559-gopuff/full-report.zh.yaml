      - number: '3.2'
        title: 能力、定价与规模
        blocks:
          - type: paragraph
            body: >-
              Gopuff 最明确的已证实差异是运营控制：本地设施在订单发出前就持有库存，而关于 Instacart 和 DoorDash
              的资料强调市场平台以及从第三方门店配送。这可以改善目录控制，并为自有品牌商品留出空间，但现有来源没有提供可比的缺货率、配送可靠性、购物篮经济性或贡献利润率。历史规模指标相互矛盾。Business of Apps
              估算 2023 年收入为 $1.2 billion，比 2022 年下降 20%，并估算 2023 年有 1.8 million 活跃购物者；这些是估算，不是经审计披露。Tracxn 报告 Gopuff 累计融资
              $5.14 billion，且若干指定同行总额更低，但累计融资不等于当前现金、运营规模或竞争表现。公开定价证据尤其薄弱：SoftwareSuggest 展示替代方案的部分起始价格，但其分类混合了消费者服务和
              B2B 软件，不能支持同口径价格比较。Gopuff 当前标准配送费、会员价格、零售商加价和实际折扣在资料池中仍未验证。
            claimRefs:
