      - number: '1.2'
        title: 资本历史与治理信号
        blocks:
          - type: paragraph
            body: >-
              就尽调而言，Gopuff 最适合被视为后期私营公司。CNBC 报道称，公司 2021 年 3 月以 $8.9 billion 估值完成 $1.15 billion 融资；Reuters 则报道其截至 2021 年
              7 月估值为 $15 billion，并于同年 12 月发行 $1.5 billion 可转债。这些历史估值不能代表当前估值。公司随后宣布 2025 年 11 月在 Eldridge Industries 和
              Valor Equity Partners 牵头下获得 $250 million 新融资；一家融资数据库独立记录了这轮已披露融资，但明确没有重建完整融资历史。同一份公司公告任命 Matt McBrady 为
              CFO，带来公开市场和投资经验。Howard Schultz 于 2026 年 4 月获任董事，增添消费和零售运营视角，但现有证据没有披露完整董事名单、投票控制权、优先权或当前持股。
