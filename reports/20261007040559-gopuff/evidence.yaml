evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited consolidated net revenue, gross margin, EBITDA, free cash flow, cash, debt, and current valuation
      evidence.
    whyItMatters: >-
      Financing proceeds and per-order contribution claims do not establish company-wide profitability, liquidity, or
      enterprise value.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, lender statements, and the latest independent
      409A or secondary transaction evidence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Current active-customer, order-frequency, cohort-retention, exact headcount, and operating-location counts with
      period definitions.
    whyItMatters: >-
      Public footprint bands and company momentum language cannot establish current demand density, retention, or labor
      efficiency.
    diligencePath: >-
      Request monthly operating dashboards, customer cohort exports, payroll records, and an active-site register
      reconciled to financials.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive and board roster, committee assignments, voting rights, succession plan, and related-party
      governance.
    whyItMatters: >-
      Named appointments do not reveal board independence, founder control, oversight coverage, or key-person
      contingency.
    diligencePath: >-
      Obtain the current organization chart, board list, charters, voting agreement, and founder employment and
      succession documents.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Reconciled financing history, fully diluted cap table, preference waterfall, convertible-note status, debt
      covenants, and secondaries.
    whyItMatters: >-
      Public round announcements do not show current ownership, liquidation priority, dilution, conversion exposure, or
      cash still available.
    diligencePath: >-
      Request the capitalization ledger, financing documents, debt schedule, investor rights agreements, option ledger,
      and secondary-transfer log.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A current, named, methodology-transparent market study and Gopuff geography-level order data sufficient to
      calculate TAM, SAM, and revenue-qualified SOM.
    whyItMatters: >-
      The available global forecast, historical channel CAGR, company footprint, and site-throughput proxy use different
      populations, periods, and denominators and cannot support a precise valuation multiple.
    diligencePath: >-
      Obtain the underlying named market study and reconcile it with current serviceable households, order frequency,
      basket value, retention, and site contribution margins by geography.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: order-density
    missingEvidence: >-
      Current site-level daily orders, fill rate, average basket, repeat rate, gross margin, and contribution margin by
      facility cohort.
    whyItMatters: >-
      The only throughput threshold in the assigned evidence is a 2022 consultant estimate and cannot establish current
      network economics.
    diligencePath: >-
      Request a site-cohort operating schedule and reconcile management's profitability definition to audited accounting
      and cash-flow measures.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: partner-and-advertiser-economics
    missingEvidence: >-
      Current retail-media revenue, advertiser retention, partnership take rates, customer ownership, and incremental
      contribution margin.
    whyItMatters: >-
      Partnership and advertising channels may improve monetization, but the assigned public evidence does not quantify
      their scale or profitability.
    diligencePath: >-
      Request advertiser cohort data, partnership contracts, channel P&Ls, and incrementality studies segmented from
      merchandise revenue.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitive-unit-economics
    missingEvidence: >-
      Comparable contribution margins, order density, stockout rates, service-level attainment, retention, channel
      commissions, and customer-data rights by distribution platform.
    whyItMatters: >-
      Without normalized economics and retention, owned inventory and rapid delivery are operating differences rather
      than demonstrated durable advantages.
    diligencePath: >-
      Obtain market-level cohort retention, four-wall fulfillment economics, channel agreements, stockout reports, and
      independently measured service-level data for Gopuff and named alternatives.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited consolidated income statement, balance sheet, net revenue, gross margin dollars, adjusted EBITDA, and cash
      runway.
    whyItMatters: >-
      Without audited figures, investors cannot confirm whether warehouse closures and workforce cuts achieved true net
      profitability or if cash burn continues.
    diligencePath: >-
      Obtain confidential audited financial statements and quarterly board reporting packages under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: database-clustering-and-replication
    missingEvidence: >-
      Audited architecture specifications detailing production database clustering, cross-region replication latency,
      and PostgreSQL failover topologies.
    whyItMatters: >-
      Direct insight into database clustering reveals whether peak traffic surges create localized write-locking
      contention or checkout failure spikes.
    diligencePath: >-
      Request confidential infrastructure topology documentation and database performance SLA reports during technical
      management meetings.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: subscription-cohort-retention
    missingEvidence: >-
      Audited figures detailing total Gopuff Fam subscriber count, monthly cohort churn, and average member order
      frequency.
    whyItMatters: >-
      Gopuff Fam represents the core retention mechanism for high-value customers; without subscriber metrics,
      durability and lifetime customer value cannot be verified.
    diligencePath: >-
      Request company management disclose confidential subscriber cohort retention curves, Fam membership count, and
      subscriber contribution margin.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: material
    topic: active-user-frequency-denominators
    missingEvidence: >-
      Audited breakdown of 1.8M+ active users defining active period (monthly vs annual) and distribution of orders per
      active account.
    whyItMatters: >-
      Secondary investor metrics cite 1.8M+ active users without specifying active definition, obscuring repeat order
      velocity.
    diligencePath: >-
      Obtain internal transaction logs or audited investor presentation detailing 30-day, 60-day, and 90-day user
      activity thresholds.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: named-brand-commercial-terms
    missingEvidence: >-
      Revenue share, take-rate, and contract duration data for enterprise distribution deals such as the Instacart
      partnership.
    whyItMatters: Channel partnerships expand delivery reach but may dilute customer ownership or carry margin compression.
    diligencePath: >-
      Review commercial partnership agreements and merchant services master agreements between Gopuff and channel
      distributors.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: legal-register-coverage
    missingEvidence: >-
      A complete current docket and licensing, labor, consumer-protection, privacy, safety, and alcohol-compliance
      register by jurisdiction.
    whyItMatters: >-
      The assigned pool contains only selected matters, so it cannot establish total exposure or confirm the absence of
      other proceedings.
    diligencePath: >-
      Run entity-name and subsidiary searches across federal and state dockets and request management's legal and
      regulatory matter schedule with counsel confirmation.
    relatedQuestionRefs:
      - QR001
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: >-
      Audited cash flow, unrestricted cash, debt, lease liabilities, current burn, runway, and site-level contribution
      economics.
    whyItMatters: >-
      Liquidity determines whether Gopuff can absorb labor remedies, operational disruption, or partner repricing
      without distressed financing.
    diligencePath: >-
      Obtain audited statements, monthly cash bridge, debt and lease schedules, board-approved forecast, and site-cohort
      contribution analysis.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-terms-gap
    missingEvidence: >-
      Counterparty-level order share, gross margin, commissions, service levels, data rights, exclusivity, indemnities,
      and termination protections.
    whyItMatters: >-
      Announcement volume does not reveal whether a partner diversifies demand or controls a material economic or
      operational dependency.
    diligencePath: >-
      Review the Instacart and major fulfillment or brand agreements and reconcile contract terms to partner-level
      revenue and order concentration.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: controls-and-incidents
    missingEvidence: >-
      Current security-control reports, privacy assessments, outage and incident history, business-continuity tests,
      insurance coverage, shrink, spoilage, and recall metrics.
    whyItMatters: >-
      Without control and incident evidence, operational and technical residual risk cannot be measured and absence of
      recorded incidents cannot imply safety.
    diligencePath: >-
      Request SOC reports, penetration tests, incident and outage registers, continuity-test results, insurance
      schedules, and inventory-loss reporting.
    relatedTableRefs:
      - TR002
