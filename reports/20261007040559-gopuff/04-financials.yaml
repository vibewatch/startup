callouts:
  - calloutType: "risk"
    title: "Labor Misclassification Poses Material Cost Structure Shock"
    body: "Gopuff's reliance on 1099 independent contractor delivery drivers is under sustained regulatory attack in key jurisdictions, including a $6.2 million fine in Massachusetts and an active lawsuit by the Attorney General of the District of Columbia alleging wage, overtime, and sick leave violations. If forced to reclassify drivers as W-2 employees or provide statutory minimum wage guarantees, Gopuff's last-mile delivery costs would increase substantially, impairing order contribution economics across high-volume urban corridors."
    claimRefs:
      - "CI011"
      - "CI012"

  - calloutType: "insight"
    title: "Valuation Reset and Path to Self-Funded Operations"
    body: "Gopuff's capital reset from a $15 billion peak valuation in 2021 to $8.5 billion in November 2025 illustrates the necessary transition from growth-at-all-costs to operating discipline. Having closed 76 fulfillment centers and reduced headcount by more than 2,000 employees between 2022 and 2024, management claims positive contribution profit. However, without audited statements verifying positive free cash flow, prospective investors cannot determine whether Gopuff can sustain operations without another dilutive capital round."
    claimRefs:
      - "CI013"
      - "CI014"
      - "CI015"

