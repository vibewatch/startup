          detail: "Requires current site cohorts, basket values, retention, and contribution margins"
    approximationNotes: "This is a hierarchy of unlike sizing lenses, not an additive pyramid; the broad forecast and historical growth rate are not transformed into Gopuff TAM, SAM, or SOM."
