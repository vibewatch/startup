chapter:
  number: 7
  title: "Risks"
  summary: "The clearest current risk is the District of Columbia worker-classification lawsuit, which seeks back wages, program contributions, damages, and penalties while Gopuff disputes the allegations. Gopuff's owned-inventory fulfillment model and growing partnership surface add operating exposure, but audited runway, network-level controls, incident history, insurance coverage, and counterparty concentration remain unverified."
sections:
  - id: "legal-and-regulatory"
    title: "Legal and regulatory exposure"
    body: >-
      The District of Columbia enforcement action is the most decision-relevant legal risk in the assigned evidence.
      The Attorney General announced a March 2025 lawsuit alleging that GoBrands and GB Logistics misclassified
      delivery workers and violated seven District statutes; the requested remedies include back wages, damages,
      public-program contributions, and civil penalties. An independent human-rights publication reports that Gopuff
      strongly disputes the allegations, so the complaint is not a finding of liability. A separate 2026 South
      Carolina order dismissed a pro se ADA and ERISA action without prejudice for failure to state a plausible claim
      and without service of process. That procedural result should not be generalized into a broader view of labor
      compliance. The investment implication is to treat reclassification economics as a live downside scenario while
      withholding probability estimates until current dockets, insurance terms, and jurisdiction-by-jurisdiction
      practices are reviewed.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
    tableRefs:
      - "TR001"
  - id: "operational-and-financial"
    title: "Owned-network execution and financial opacity"
    body: >-
      Gopuff states that it owns roughly 4,000 products held in hundreds of local micro-fulfillment centers. That model
      gives the company direct control over availability and fulfillment, but it also places inventory, facilities,
      local labor, and service continuity inside the operating perimeter rather than transferring them entirely to
      merchants. Historical secondary reporting summarized by Wikipedia records 76 warehouse closures and about 1,500
      affected employees in July 2022, followed by about 600 employees, or 6% of global staff, in 2024. Those figures
      are historical and come from a secondary compilation, so they indicate prior network reconfiguration rather than
      current instability. The assigned pool does not establish present cash runway, audited cash flow, four-wall
      economics, shrink, outage frequency, or security-control effectiveness. These omissions make current residual
      severity unquantifiable and require private diligence rather than modeled precision.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR013"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR002"
  - id: "partners-and-customer-signals"
    title: "Partner dependencies and weak public service-quality signals"
    body: >-
      Gopuff's newsroom index records a September 2026 U.S. partnership announcement with Instacart amid a broader
      cadence of partner-led and private-label launches. The index confirms activity but does not disclose economics,
      exclusivity, concentration, service obligations, termination rights, or data ownership, so it cannot establish
      whether partnerships diversify demand or create material dependence. Wikipedia also reports that Uber couriers
      handled at least 4% of U.S. Gopuff orders in March 2023 amid a driver-workforce gap; this is historical,
      secondary evidence rather than a current concentration measure. Public complaint evidence is similarly thin:
      the retained BBB page contains only its general methodology disclaimer, not complaint details or a transaction
      denominator. It therefore supports a diligence gap, not a claim about Gopuff's current complaint rate or service
      quality.
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR015"
    tableRefs:
      - "TR003"
  - id: "monitoring-and-kill-criteria"
    title: "Monitoring indicators and thesis-break criteria"
    body: >-
      Risk monitoring should separate observable events from unsupported estimates. Labor exposure escalates if a court
      or regulator imposes employee classification, material back-pay obligations, or operating restrictions in a core
      market. Operating exposure escalates if audited materials show sustained negative four-wall contribution after
      fulfillment labor and inventory losses, repeated availability failures, or inadequate insurance and security
      controls. Partner exposure escalates if any counterparty supplies a material share of orders or fulfillment while
      retaining unilateral pricing, ranking, customer-data, or termination leverage. The thesis should break if those
      events coincide with insufficient liquidity to fund remediation. Built In's retained profile cannot close that
      question: it explicitly says its content summarizes popular-LLM responses and was not reviewed or approved by
      Gopuff. Accordingly, claims from that page are treated only as weak signals, and the heatmap labels unknowns
      rather than converting them into probabilities.
    claimRefs:
      - "CR001"
      - "CR006"
      - "CR008"
      - "CR011"
      - "CR012"
      - "CR016"
    figureRefs:
      - "FR001"
