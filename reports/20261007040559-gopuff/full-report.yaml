      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The consumer user and payer are usually the same household, but the adoption trigger varies. Young
              consumers are the historical core: Grocery Dive described the experience as appealing to young users and
              quoted a consultant calling the brand's identity Gen Z-oriented. Household expansion depends on broadening
              the basket; pandemic-era analysis reported older users arriving with larger order sizes, while Gopuff's
              newsroom later listed a bulk-shopping rollout as a response to demand for value. A separate
              business-to-business market sits beside consumer commerce. Consumer-packaged-goods advertisers pay from
              retail-media budgets for sponsored products and sponsored search, reaching shoppers already close to
              purchase. Retail and platform partners represent another buyer class, but the September 2026 Instacart
              partnership is only confirmed here by a company-issued headline; economics, ownership of the customer
              relationship, and budget allocation are not disclosed.
