              historical metric covers a broader channel than instant-needs delivery. Company footprint and mature-site
              throughput are more useful bottom-up lenses: about 4,000 stocked products across hundreds of
              micro-fulfillment centers, tested against a 2022 consultant estimate of at least 400 orders per day for
              site profitability. Current site count, order distribution, gross order value, and contribution margin
              remain unavailable.
