      - number: '2.4'
        title: Growth Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              Growth can come from a broader assortment, value-oriented baskets, channel partnerships, mass-market brand
              awareness, and retail-media yield on the same purchase occasion. Those drivers do not remove the density
              constraint created by owned inventory and local fulfillment. Grocery Dive reported in 2022 that a cited
              consultant estimated at least 400 daily orders were needed for a Gopuff site to make money and that only
              about 10% to 20% of sites had reached that level. The same article reported that speed mattered less than
              receiving the items ordered, weakening a thesis based only on ever-shorter delivery promises. Labor
              regulation is a second constraint: the District of Columbia attorney general filed a 2025 lawsuit alleging
              worker misclassification and seeking wages, contributions, damages, and penalties; these are allegations,
              not an adjudicated finding. Valuation should therefore be tied to current cohort retention, fill rate,
              site contribution margin, and labor sensitivity rather than the broad global forecast.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
