      - number: '6.4'
        title: Customer Retention, Service Durability, and Regulatory Friction
        blocks:
          - type: paragraph
            body: >-
              Customer retention and long-term delivery durability depend heavily on Gopuff's ability to maintain rapid
              fulfillment SLAs without passing unsustainable operational surcharges to consumers. The Gopuff Fam
              subscription program serves as the company's primary retention mechanism, locking in repeat purchasing
              behavior through free delivery benefits, yet Gopuff does not publicly disclose Fam subscriber counts,
              cohort churn rates, or net revenue retention metrics. Operational durability is further complicated by
              severe legal challenges concerning driver classification. In March 2023, the Massachusetts Attorney
              General cited Gopuff for $6.2 million for misclassifying 968 delivery workers, while in March 2025 the
              District of Columbia Attorney General filed suit alleging systematic labor law violations. Because
              Gopuff's customer value proposition relies entirely on reliable courier dispatch from local MFCs, ongoing
              worker misclassification litigation threatens delivery speed, driver availability, and order fulfillment
              consistency.
            claimRefs:
