      - number: '5.2'
        title: Software Infrastructure, Distributed Data Layers, and Concurrency Controls
        blocks:
          - type: paragraph
            body: >-
              The core technology stack of Gopuff combines React and Redux on the client-facing layer with mobile
              applications engineered in Swift and cross-platform web technologies. Backend microservices are
              distributed across Python and Ruby on Rails service environments, supported by Docker containerization and
              hosted within cloud infrastructure environments. Data persistence and transaction integrity are anchored
              on relational database management systems, predominantly PostgreSQL, which enforce strict row-level
              locking and atomic inventory decrements to prevent double-booking across simultaneous multi-item orders.
              Cloud telemetry and system integrity are monitored using distributed tracking platforms including Sentry
              and custom operational telemetry.
            claimRefs:
