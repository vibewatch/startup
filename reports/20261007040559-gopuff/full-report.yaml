      - number: '7.2'
        title: Owned-network execution and financial opacity
        blocks:
          - type: paragraph
            body: >-
              Gopuff states that it owns roughly 4,000 products held in hundreds of local micro-fulfillment centers.
              That model gives the company direct control over availability and fulfillment, but it also places
              inventory, facilities, local labor, and service continuity inside the operating perimeter rather than
              transferring them entirely to merchants. Historical secondary reporting summarized by Wikipedia records 76
              warehouse closures and about 1,500 affected employees in July 2022, followed by about 600 employees, or 6%
              of global staff, in 2024. Those figures are historical and come from a secondary compilation, so they
              indicate prior network reconfiguration rather than current instability. The assigned pool does not
              establish present cash runway, audited cash flow, four-wall economics, shrink, outage frequency, or
              security-control effectiveness. These omissions make current residual severity unquantifiable and require
              private diligence rather than modeled precision.
