      - number: '3.2'
        title: Capability, Pricing, and Scale
        blocks:
          - type: paragraph
            body: >-
              Gopuff's clearest evidenced distinction is operational control: its local facilities hold inventory before
              an order is placed, whereas the cited descriptions of Instacart and DoorDash emphasize marketplaces and
              delivery from third-party stores. That can improve catalog control and create room for private-label
              products, but the available sources do not provide comparable stockout rates, delivery reliability, basket
              economics, or contribution margins. Historical scale indicators are mixed. Business of Apps estimates 2023
              revenue at $1.2 billion, down 20% from 2022, and estimates 1.8 million active shoppers in 2023; these are
              estimates, not audited disclosures. Tracxn reports $5.14 billion of total Gopuff funding and lower totals
              for several named peers, but cumulative funding is not current cash, operating scale, or competitive
              performance. Public pricing evidence is especially weak: SoftwareSuggest shows selected starting prices
              for alternatives, but its categories mix consumer services with B2B software and cannot support a
              like-for-like price comparison. Gopuff's standard current delivery fee, membership price, retailer
              markups, and realized discounts remain unverified in this pool.
