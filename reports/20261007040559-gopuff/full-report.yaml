  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Operating Models
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than rapid-delivery startups. Gopuff says it holds about 4,000 products in
              hundreds of local micro-fulfillment centers, while third-party profiles describe Instacart as a grocery
              marketplace, DoorDash as a local-store and restaurant delivery platform, Shipt as an on-demand grocery
              provider, and Getir and Gorillas as multi-category grocery applications. Tracxn's taxonomy places Gopuff
              third in a large field by its proprietary score and names Instacart, DoorDash, and Shipt as leading peers;
              that ranking is useful for discovery, not an independent performance benchmark. SoftwareSuggest broadens
              the alternatives to delivery software, online grocers, and retailer-linked services, although it
              acknowledges that some descriptions are vendor-provided. The buyer's real choice set therefore includes
              owned-inventory instant commerce, third-party marketplaces, retailer delivery, internal delivery
              operations enabled by software, and the status quo of shopping or pickup. The assigned evidence does not
              quantify the last two alternatives, so their economics remain diligence gaps rather than scored
              advantages.
