  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The District of Columbia enforcement action is the most decision-relevant legal risk in the assigned
              evidence. The Attorney General announced a March 2025 lawsuit alleging that GoBrands and GB Logistics
              misclassified delivery workers and violated seven District statutes; the requested remedies include back
              wages, damages, public-program contributions, and civil penalties. An independent human-rights publication
              reports that Gopuff strongly disputes the allegations, so the complaint is not a finding of liability. A
              separate 2026 South Carolina order dismissed a pro se ADA and ERISA action without prejudice for failure
              to state a plausible claim and without service of process. That procedural result should not be
              generalized into a broader view of labor compliance. The investment implication is to treat
              reclassification economics as a live downside scenario while withholding probability estimates until
              current dockets, insurance terms, and jurisdiction-by-jurisdiction practices are reviewed.
