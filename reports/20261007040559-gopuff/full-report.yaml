      - number: '1.2'
        title: Capital history and governance signals
        blocks:
          - type: paragraph
            body: >-
              Gopuff remains best treated as a late-stage private company for diligence purposes. CNBC reported a $1.15
              billion round at an $8.9 billion valuation in March 2021, while Reuters reported a $15 billion valuation
              by July 2021 and a $1.5 billion convertible note issued that December. Those historical marks are not
              current valuation evidence. The company then announced $250 million of new funding in November 2025 led by
              Eldridge Industries and Valor Equity Partners; a funding database independently records that one disclosed
              round but explicitly does not reconstruct the full funding history. The same company announcement
              appointed Matt McBrady CFO, adding public-markets and investment experience. Howard Schultz's April 2026
              board appointment adds consumer and retail operating perspective, yet the assigned evidence does not
              disclose a complete board roster, voting control, preferences, or current ownership.
