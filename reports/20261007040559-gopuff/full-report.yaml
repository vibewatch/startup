      - number: '6.2'
        title: Adoption Trajectory, Operating Footprint, and Order Dynamics
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Gopuff reflects rapid expansion followed by footprint consolidation and density
              optimization across major metropolitan markets. Silicon Valley Investclub benchmark figures report more
              than 1.8 million active users and over 20 million lifetime mobile app downloads across the platform's
              footprint of more than 1,000 cities in the United States and the United Kingdom. Operations are supported
              by a physical logistics network that GoBrands' CA SB 261 climate disclosure documents as comprising over
              400 micro-fulfillment centers and retail storefronts across 36 states, including 224 dedicated Gopuff MFCs
              and grocery facilities, 161 BevMo! retail sites, 22 Liquor Barn locations, and two primary distribution
              centers. This vertically integrated logistics footprint enables Gopuff to maintain complete inventory
              ownership and pick, pack, and dispatch instant-delivery orders within 15 to 30 minutes, sustaining high
              customer order frequency even as rapid delivery platforms face macroeconomic margin scrutiny.
