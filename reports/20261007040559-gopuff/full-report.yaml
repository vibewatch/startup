            title: Reach comes with channel dependence
            body: >-
              Gopuff's presence on Uber Eats, DoorDash, Deliveroo, and the announced Instacart partnership expands
              distribution, but it also moves some customer discovery onto platforms operated by named competitors. The
              retained evidence does not disclose commissions, ranking terms, or customer-data rights.
