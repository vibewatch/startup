chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Gopuff was founded in Philadelphia in 2013 by Drexel students Yakir Gola and Rafael Ilishayev. Unlike a
              pure delivery marketplace, it buys and holds inventory in micro-fulfillment facilities, sells that
              inventory at retail, and layers delivery fees, membership revenue, and advertising onto the order. That
              structure gives Gopuff more control over assortment, pricing, picking, and fulfillment than an aggregator,
              but it also leaves the company responsible for inventory, facilities, labor, and delivery economics. The
              latest assigned evidence supports a U.S.-and-U.K. footprint; a tertiary profile reports service in more
              than 500 U.S. localities as of 2025, but the pool does not provide a current company-issued location
              count. Gopuff's 2022 claim of more than $4 in contribution profit per order is useful unit-economics
              context, not audited proof of company-wide profitability.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
