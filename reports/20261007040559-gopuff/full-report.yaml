        title: Operating momentum and milestones
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company moving from pandemic-era hypergrowth and high private-market marks
              toward a broader retail, private-label, partnership, and technology strategy. The 2025 financing
              announcement highlighted fresh grocery, SNAP EBT, FAM membership, AI, and brand partnerships, but those
