  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Core Purchasing Demographics
        blocks:
          - type: paragraph
            body: >-
              Gopuff segments its customer base primarily around high-frequency urban consumers, late-night convenience
              seekers, and college campus populations who prioritize rapid delivery speed over traditional grocery
              basket size. Originally founded around student essentials and snacks, the company has scaled into a
              multi-category instant e-commerce platform offering over 5,000 SKUs encompassing convenience staples,
              over-the-counter health items, household goods, and alcoholic beverages. In addition to individual
              on-demand retail shoppers who pay per-order delivery and convenience fees, Gopuff has established a
              dedicated Gopuff Fam subscription tier that provides members with free delivery on qualifying orders in
              exchange for a recurring monthly fee of $7.99. Through its acquired retail subsidiaries BevMo! and Liquor
              Barn, Gopuff also serves traditional brick-and-mortar beverage shoppers across California, Arizona,
              Washington, and Kentucky, with 89 BevMo! locations converted into hybrid micro-fulfillment hubs supporting
              integrated digital driver dispatch.
