      - number: '3.3'
        title: Distribution Power and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Gopuff's model creates a physical operating footprint that is harder to replicate than an app alone, but
              the retained sources do not prove durable switching costs. Business of Apps reports that Gopuff began
              selling through Uber Eats in 2021 and later expanded to DoorDash, Deliveroo, and other delivery
              applications, with Gopuff drivers fulfilling those orders. Gopuff's own newsroom then listed a new US
              partnership with Instacart in September 2026. This multi-homing can improve utilization and customer
              discovery, but it also places part of demand acquisition inside channels operated by named competitors;
              that dependence is an inference, not a disclosed commercial term. Private-label expansion and the
              historical FAM20 and student-membership offers show attempts to differentiate assortment, service, and
              packaging, yet no retained source quantifies subscriber retention or private-label margin. Regulatory
              posture is a further source of asymmetry: the District of Columbia Attorney General sued Gopuff entities
              in March 2025, alleging worker misclassification and failures involving minimum wage, overtime, and paid
              sick leave. The allegation is not a final adjudication, but it could weaken any cost advantage attributed
              to contractor delivery if operating practices or labor costs must change.
            claimRefs:
              - CP003
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
