          - type: callout
            title: Labor posture is part of the competitive cost stack
            body: >-
              The District of Columbia complaint alleges worker misclassification and unpaid statutory protections.
              Because this is an allegation rather than a judgment, the correct underwriting response is to test
              exposure and labor-model sensitivity rather than assume liability or absence of liability.
