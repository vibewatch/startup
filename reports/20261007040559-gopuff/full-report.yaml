            body: >-
              The assigned sources do not provide a current, methodology-transparent TAM, SAM, or SOM for Gopuff's
              served geographies. One software vendor cites an unnamed forecast that global quick commerce could exceed
              $337 billion by 2032, but the fetched article does not identify the forecast publisher, base year,
              denominator, or CAGR, so it is a low-confidence context point rather than a valuation input. A 2020 HBS
