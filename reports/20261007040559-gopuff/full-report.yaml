      - number: '1.4'
        title: Diligence interpretation and unresolved baseline
        blocks:
          - type: paragraph
            body: >-
              The refreshed public record is strongest on identity, business-model mechanics, named financing events,
              and selected leadership changes. It is materially weaker on the quantities needed to judge enterprise
              value: audited net revenue, gross margin, EBITDA, free cash flow, cash, debt, active customers, order
              frequency, exact current headcount, and a reconciled fully diluted capitalization table. A low-reputation
              software vendor publishes a $2.2-$2.4 billion revenue estimate but labels the period inconsistently across
              the page; it is retained as a signal of public-data noise, not used as a verified KPI. A tertiary source
              also flags warehouse closures, repeated layoffs, and a worker-classification fine. Those adverse items
              warrant primary-document follow-up rather than being interpreted as a complete incident record. Investment
              decisions should therefore anchor on disclosed transactions and require management evidence for current
              scale and profitability.
