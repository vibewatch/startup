      - number: '7.4'
        title: Monitoring indicators and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Risk monitoring should separate observable events from unsupported estimates. Labor exposure escalates if
              a court or regulator imposes employee classification, material back-pay obligations, or operating
              restrictions in a core market. Operating exposure escalates if audited materials show sustained negative
              four-wall contribution after fulfillment labor and inventory losses, repeated availability failures, or
              inadequate insurance and security controls. Partner exposure escalates if any counterparty supplies a
              material share of orders or fulfillment while retaining unilateral pricing, ranking, customer-data, or
              termination leverage. The thesis should break if those events coincide with insufficient liquidity to fund
              remediation. Built In's retained profile cannot close that question: it explicitly says its content
              summarizes popular-LLM responses and was not reviewed or approved by Gopuff. Accordingly, claims from that
              page are treated only as weak signals, and the heatmap labels unknowns rather than converting them into
