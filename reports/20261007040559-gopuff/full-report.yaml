  - id: FE001
    title: Gopuff Technology and Operational Infrastructure Stack
    type: stack
    summary: >-
      Six-tier architectural stack illustrating consumer interaction, partner discovery APIs, microservice
      orchestration, transactional data persistence, localized dark store picking, and last-mile dispatch.
    data:
      layers:
        - label: Client & Presentation Layer
          detail: Mobile and web client interfaces providing customer catalog browsing and real-time order tracking
          items:
            - Consumer Mobile App (Swift / iOS)
            - Web Storefront (React / Redux / Webpack)
        - label: Partner & External API Layer
          detail: External discovery gateways and conversational interfaces integrating marketplace demand channels
          items:
            - Partner Surface API (Instacart U.S. Integration)
            - Conversational Commerce Engine (Go / SpaceXAI Integration)
        - label: Application & Microservices Layer
          detail: Distributed service routing, availability math, and asynchronous event processing
          items:
            - Order Orchestration API (Ruby on Rails 5 / Python)
            - Availability Computation Engine (Isochrone & Haversine Drive-Time)
            - Containerized Microservices (Docker / Cloud Platforms)
        - label: Data Persistence & Concurrency Layer
          detail: Relational storage maintaining strict ACID transaction guarantees for inventory allocation
          items:
            - PostgreSQL Transaction Engine (Row-Level Locking)
            - Micro-Fulfillment SKU Inventory Tables (Conditional Decrements)
            - Distributed Telemetry & Alerting (Sentry Platform)
        - label: Dark Store Fulfillment Layer
          detail: In-facility picking guidance and inventory management driving rapid parcel consolidation
          items:
            - Warehouse Picker Panel (Bin-Location Guidance)
            - Physical MFC Network (~4,000 SKUs per Dark Store)
            - Restock & Inbound Replenishment Workflows
        - label: Last-Mile Delivery & Courier Layer
          detail: Algorithmic courier queueing and vehicle routing engine executing rapid doorstep dispatch
          items:
            - Driver Dispatch Application (Algorithmic Queue)
            - Dynamic Travel-Time Route Optimization
            - Proof of Delivery Verification (Digital Signatures / OTP)
    approximationNotes: >-
      Layer taxonomy synthesized from engineering interview guides, system design analyses, and technical architecture
      reviews.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
