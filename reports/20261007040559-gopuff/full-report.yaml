  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Vertically Integrated Operating Architecture and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Gopuff delivers instant commerce across convenience, grocery, OTC healthcare, and alcohol categories by
              operating hundreds of local micro-fulfillment centers (MFCs) rather than relying on third-party merchant
              routing. When a customer initiates a session on the mobile or web client, an availability pipeline queries
              deliverable micro-fulfillment centers within drive-time proximity. Unlike peer-to-peer delivery platforms
              that dispatch drivers to retail stores, Gopuff maintains direct ownership of SKU inventory, enabling
              end-to-end operational visibility. Upon order placement, an atomic database transaction confirms stock
              allocation, triggering bin-directed pick-and-pack routing inside the localized dark store before handing
              the consolidated parcel to an algorithmic driver dispatch queue.
            claimRefs:
              - CE001
              - CE002
              - CE003
