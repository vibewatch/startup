  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Gopuff's core market is instant-needs retail, not all grocery or e-commerce spending. Its official support
              page describes about 4,000 products held in hundreds of local micro-fulfillment centers, which bounds the
              offer around a curated, directly stocked assortment. A historical independent analysis positioned Gopuff
              against convenience stores rather than full supermarkets, while later reporting documented expansion from
              snacks and soda into fresh-made pizza, local products, and groceries. Included demand is therefore urgent
              replenishment, impulse consumption, and small-basket household needs that value availability and short
              delivery windows. Excluded demand includes scheduled weekly grocery baskets, broad general merchandise,
              restaurant meals, and marketplace transactions fulfilled from third-party shelves. The status quo remains
              a walk or drive to a convenience store or supermarket; digital substitutes include store-picking services
              and established grocers' own rapid-delivery offers.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
