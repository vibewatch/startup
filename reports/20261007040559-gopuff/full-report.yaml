        title: Exhibits
        blocks:
          - type: callout
            title: Do not capitalize the headline forecast
            body: >-
              The only forward market value in the assigned pool is an unnamed global forecast repeated by a software
              vendor. A valuation case should remain contingent on current geography-level order density, basket value,
              retention, site contribution margin, and labor sensitivity.
