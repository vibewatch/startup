callouts:
  - calloutType: risk
    title: Historical private marks are not current valuation
    body: >-
      The $8.9 billion and $15 billion figures are dated 2021 financing marks.
      The assigned evidence contains no current arm's-length valuation,
      secondary price, or audited balance sheet from which to infer one.
    claimRefs: [CO006, CO007]
  - calloutType: insight
    title: Renewed activity, still-limited financial visibility
    body: >-
      The 2025 financing and 2026 partnership and product announcements support
      a renewed-growth narrative, but they do not disclose audited revenue,
      free cash flow, cash balance, or customer cohorts.
    claimRefs: [CO005, CO011, CO012]
