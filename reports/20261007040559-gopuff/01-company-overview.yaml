company:
  name: Gopuff
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Gopuff is a Philadelphia-founded, vertically integrated instant-commerce
    retailer whose owned-inventory model combines product margin, delivery and
    membership fees, and advertising. A $250 million financing and CFO
    appointment in November 2025, followed by 2026 board, product, and
    partnership announcements, indicate renewed expansion, but current audited
    financials, exact operating scale, governance rights, and a defensible
    current valuation remain unavailable.
sections:
  - id: identity-and-operating-model
    title: Identity, footprint, and operating model
    body: >-
      Gopuff was founded in Philadelphia in 2013 by Drexel students Yakir Gola
      and Rafael Ilishayev. Unlike a pure delivery marketplace, it buys and
      holds inventory in micro-fulfillment facilities, sells that inventory at
      retail, and layers delivery fees, membership revenue, and advertising
      onto the order. That structure gives Gopuff more control over assortment,
      pricing, picking, and fulfillment than an aggregator, but it also leaves
      the company responsible for inventory, facilities, labor, and delivery
      economics. The latest assigned evidence supports a U.S.-and-U.K.
      footprint; a tertiary profile reports service in more than 500 U.S.
      localities as of 2025, but the pool does not provide a current
      company-issued location count. Gopuff's 2022 claim of more than $4 in
      contribution profit per order is useful unit-economics context, not
      audited proof of company-wide profitability.
    claimRefs: [CO001, CO002, CO003, CO004, CO016]
    tableRefs: [TO001]
  - id: capital-and-governance
    title: Capital history and governance signals
    body: >-
      Gopuff remains best treated as a late-stage private company for diligence
      purposes. CNBC reported a $1.15 billion round at an $8.9 billion valuation
      in March 2021, while Reuters reported a $15 billion valuation by July
      2021 and a $1.5 billion convertible note issued that December. Those
      historical marks are not current valuation evidence. The company then
      announced $250 million of new funding in November 2025 led by Eldridge
      Industries and Valor Equity Partners; a funding database independently
      records that one disclosed round but explicitly does not reconstruct the
      full funding history. The same company announcement appointed Matt
      McBrady CFO, adding public-markets and investment experience. Howard
      Schultz's April 2026 board appointment adds consumer and retail operating
      perspective, yet the assigned evidence does not disclose a complete
      board roster, voting control, preferences, or current ownership.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: operating-momentum-and-milestones
    title: Operating momentum and milestones
    body: >-
      The milestone record shows a company moving from pandemic-era
      hypergrowth and high private-market marks toward a broader retail,
      private-label, partnership, and technology strategy. The 2025 financing
      announcement highlighted fresh grocery, SNAP EBT, FAM membership, AI,
      and brand partnerships, but those statements were issued by Gopuff and
      contain no audited revenue, cash-flow, or customer cohort data. During
      2026, the newsroom recorded private-label expansion and a U.S.
      partnership with Instacart, alongside multiple branded-product launches.
      These are evidence of commercial activity rather than proof of durable
      economics. The timeline therefore keeps financing, product, governance,
      and adverse operating events together while preserving the distinction
      between company announcements and independent reporting.
    claimRefs: [CO005, CO006, CO007, CO008, CO011, CO012, CO013, CO015]
    figureRefs: [FO001]
  - id: diligence-interpretation
    title: Diligence interpretation and unresolved baseline
    body: >-
      The refreshed public record is strongest on identity, business-model
      mechanics, named financing events, and selected leadership changes. It
      is materially weaker on the quantities needed to judge enterprise value:
      audited net revenue, gross margin, EBITDA, free cash flow, cash, debt,
      active customers, order frequency, exact current headcount, and a
      reconciled fully diluted capitalization table. A low-reputation software
      vendor publishes a $2.2-$2.4 billion revenue estimate but labels the
      period inconsistently across the page; it is retained as a signal of
      public-data noise, not used as a verified KPI. A tertiary source also
      flags warehouse closures, repeated layoffs, and a worker-classification
      fine. Those adverse items warrant primary-document follow-up rather than
      being interpreted as a complete incident record. Investment decisions
      should therefore anchor on disclosed transactions and require management
      evidence for current scale and profitability.
    claimRefs: [CO005, CO013, CO014, CO015, CO016]
