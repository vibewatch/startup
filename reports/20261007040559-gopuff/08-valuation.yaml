callouts:
  - calloutType: "recommendation"
    title: "Recommendation: TRACK Awaiting Public S-1 Transparency"
    body: >
      Gopuff represents an impressive survivor in the quick-commerce category, having outlasted well-funded global competitors
      while rationalizing operating costs and strengthening corporate governance. However, the private benchmark of $8.5 billion
      demands an estimated 9.4x EV/Revenue multiple, representing a sharp premium over listed marketplace leaders DoorDash (4.6x)
      and Instacart (2.3x). Without audited quarterly financials establishing positive consolidated free cash flow, institutional
      investors should resist secondary entry and await price discovery in the public market.
    claimRefs:
      - CV002
      - CV009
      - CV010
      - CV016

  - calloutType: "risk"
    title: "Capital Structure Overhang and Downside Preference Protection"
    body: >
      Having raised over $5.14 billion across debt, equity, and extension rounds, Gopuff carries a heavy preference stack.
      Senior liquidation rights from later financing rounds (including Series H and Series X instruments) hold preference over junior
      tranches and common equity. At an exit valuation below $8.0 billion to $9.0 billion, common shareholders and option-holding
      employees face substantial risk of proceeds compression, creating misaligned incentives between executive leadership and
      earlier stakeholders.
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV016

