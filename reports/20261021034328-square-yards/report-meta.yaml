  topStrengths:
    - Integrated platform spans property transactions, mortgages, interiors, rentals, and management.
    - Reported FY26 revenue reached INR 2,086 crore, up 48% year over year.
    - Reported FY26 adjusted EBITDA reached INR 176 crore at an 8% margin.
    - Urban Money adds material mortgage-distribution scale and cross-sell potential.
  topRisks:
    - The June 2026 financing mix, debt covenants, maturities, preference rights, and cash proceeds are undisclosed.
    - >-
      Public KPI inconsistencies and the absence of audited consolidated statements weaken pre-IPO disclosure
      confidence.
    - Returning developer relationships reportedly account for 85% of business, but individual concentration is unknown.
    - Regulatory, privacy, cybersecurity, litigation, and incident controls are not independently verified.
    - Segment margins, customer retention, concentration, acquisition cost, and cash conversion are unavailable.
  unresolvedGaps:
    - >-
      Executed June 2026 financing documents, debt schedule, covenants, preference waterfall, and fully diluted
      capitalization.
    - >-
      Audited consolidated and segment financials, cash balance, working capital, cash conversion, and KPI
      reconciliations.
    - Current statutory board, governance rights, related-party controls, management succession, and verified cap table.
    - >-
      Customer cohorts, retention, concentration, reference calls, acquisition cost, and contribution margins by
      segment.
    - >-
      Entity-level licenses, complaints, litigation, security attestations, incident history, and recovery-test
      evidence.
    - Filed offer document, appointed IPO timetable, and primary-versus-secondary issuance plan.
