schemaVersion: "report-v2"
artifact: customers
slug: square-yards
runDate: "2026-10-21"
company:
  name: Square Yards
chapter:
  number: 6
  title: Customers
  summary: >-
    Square Yards addresses a multi-sided customer base spanning homebuyers, property owners,
    developers, brokers, mortgage applicants, lenders, and adjacent-service users. Aggregate
    adoption is visible in company and partner metrics, but the assigned evidence does not
    disclose named customer outcomes, retention rates, contract duration, or top-customer
    concentration.
sections:
  - id: customer-base-and-buyers
    title: Customer base, users, and payers
    body: >-
      Square Yards presents an integrated journey rather than a single listing product:
      discovery and transactions lead into mortgages, interiors, rentals, property management,
      and post-sales services. That breadth creates several distinct economic relationships.
      Homebuyers and property owners are end users; developers pay for transaction distribution
      and sales support; brokers use inventory, marketing, and transaction tools; and lenders
      participate through mortgage origination. Independent profiles also characterize the
      platform as serving both B2C and B2B constituencies, including homebuyers, agents,
      developers, and banks. The evidence therefore supports broad segment coverage, but not
      revenue, gross margin, acquisition cost, or lifetime value by customer segment. A
      historical company page reported more than 200,000 registered brokers, which establishes
      channel reach but not active use or current monetization.
    claimRefs: [CU001, CU015]
    tableRefs: [TU001]
  - id: aggregate-adoption
    title: Aggregate adoption and operating scale
    body: >-
      Adoption evidence is substantial at the platform level but mixes unlike measures. Google
      Cloud reports eight million monthly visitors across nine countries and 200,000 automated
      calls per day in more than twelve Indian languages, while Square Yards' LinkedIn profile
      claims more than 15,000 transactions worth over US$1 billion each year. Inc42 separately
      displays 1.61 million web visits for a trailing 30-day period. These figures should not be
      combined into a funnel: visitors, web traffic, AI calls, property transactions, and loan
      disbursals use different populations, periods, and denominators. They do show that customer
      acquisition and qualification operate at meaningful scale, but none independently reveals
      conversion, active accounts, repeat purchase, or unit economics.
    claimRefs: [CU002, CU003, CU005, CU007, CU009, CU011, CU012]
    tableRefs: [TU002]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      The clearest durability indicator is Aurum PropTech's statement that 85% of business comes
      from repeat developer relationships and that Square Yards contributes 2-5% of those
      developers' sales. This is useful relationship evidence, but it is not customer-level NRR,
      GRR, renewal, churn, or cohort retention, and Aurum is a proptech-sector participant rather
      than an independent benchmark. Business Standard reports that Urban Money supplied more
      than half of FY26 revenue, real-estate transaction services supplied 40%, and interiors
      plus other digital products supplied about 10%. That is segment concentration, not
      top-customer concentration. VCCircle's coverage index also identifies Urban Money expansion
      as a growth driver, reinforcing the strategic importance of mortgage distribution without
      disclosing lender, borrower, or channel-partner concentration.
    claimRefs: [CU006, CU010, CU013, CU016]
    tableRefs: [TU003]
  - id: journey-and-proof-gaps
    title: Customer journey and proof gaps
    body: >-
      The evidence supports an assisted journey from digital discovery through AI qualification,
      human relationship management, transaction execution, mortgage processing, and adjacent
      post-sale services. Management told Business Standard that AI handles the first customer
      interaction, lead qualification, and requirement gathering before a relationship manager
      takes over. Google Cloud says the mortgage workflow is developing document automation that
      can populate up to 75% of loan applications. This design creates plausible cross-sell
      surfaces, but no source in the assigned pool names a buyer, developer, lender, or property
      owner and documents a production deployment with a measured outcome. Reference calls,
      cohort exports, renewal schedules, and concentration data are therefore required before
      treating aggregate reach as durable customer proof.
    claimRefs: [CU001, CU004, CU014]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and economic roles
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Scale evidence
      - Strategic or revenue relevance
      - Unresolved gap
    rows:
      - [Homebuyers, "User; payer may be buyer, developer, or lender depending on service", "Search, comparison, transaction, financing, and interiors", "Eight million monthly visitors across nine countries reported by Google Cloud", "Entry point for transaction and cross-sell journey", "No active-buyer, conversion, CAC, or repeat-purchase disclosure"]
      - [Developers, "Institutional customer and payer", "Inventory distribution, sales operations, pricing, and transaction support", "Aurum reports 85% repeat business from developer relationships", "Recurring distribution relationship and supply access", "No named developer, contract term, renewal rate, or revenue concentration"]
      - [Brokers and agents, "Professional user and channel participant", "Inventory access, marketing, mortgage workflow, and assisted closing", "More than 200,000 registered brokers reported on a historical company page", "Extends distribution beyond direct sales teams", "Registered count is historical and active or paying brokers are not disclosed"]
      - [Mortgage applicants and lenders, "Borrower is user; lenders and distributors monetize origination", "Loan matching, qualification, documents, and disbursal", "Urban Money disbursed INR 87,831 crore in FY26", "Largest disclosed business segment by revenue share", "No approval rate, lender concentration, borrower repeat rate, or take rate"]
      - [Property owners and tenants, "Owners may pay for management; tenants are service users", "Rentals, property management, and post-sale support", "Service surface is identified by company and independent profiles", "Extends lifetime engagement beyond purchase", "No properties under management, occupancy, churn, or segment revenue"]
    notes: >-
      Segment roles combine company descriptions and third-party profiles; scale measures use
      different periods and denominators and are not additive.
    claimRefs: [CU001, CU002, CU006, CU011, CU015]
  - id: TU002
    title: Customer growth and adoption evidence
    columns:
      - Metric
      - Reported value
      - Period / date
      - Source
      - Confidence
      - Implication
      - Missing denominator or limitation
    rows:
      - ["Homes sold", "~15,000", "FY21", "Square Yards blog", Medium, "Historical transaction proof", "Company-issued; no buyer count or repeat rate"]
      - ["Annual transactions and value", "15,000+ transactions worth US$1bn+", "Undated current profile", LinkedIn, Medium, "Ongoing transaction scale claim", "Company-issued; period definition and unique customers absent"]
      - ["Monthly visitors", "Eight million across nine countries", "Google Cloud case study; publication date not stated", "Google Cloud", Medium, "Broad acquisition surface", "Partner case study; visitors are not active or paying customers"]
      - ["Automated customer calls", "200,000 daily in 12+ Indian languages", "Google Cloud case study; publication date not stated", "Google Cloud", Medium, "Scaled lead qualification workflow", "Calls are interactions, not unique customers or conversions"]
      - ["Web traffic", "1.61 million", "Trailing 30 days displayed at access", Inc42, Medium, "Independent directional traffic signal", "Methodology, geography, and unique-user denominator not provided"]
      - ["Urban Money disbursals", "INR 87,831 crore; INR 2.15 trillion cumulative", "FY26 / cumulative through FY26", "Business Standard", Medium, "Mortgage channel has material operating scale", "Loan count, unique borrowers, approvals, defaults, and take rate absent"]
    notes: >-
      Values are reproduced with their source periods and units; visitor, traffic, call,
      transaction, and disbursal measures are not a common cohort and cannot form a conversion
      funnel.
    claimRefs: [CU002, CU003, CU005, CU007, CU009, CU011, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / reference
      - Segment
      - Deployment or use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - ["No named homebuyer reference in assigned evidence", Homebuyer, "Search through transaction and financing", "Aggregate production metrics only", "Eight million monthly visitors reported by Google Cloud", "No identifiable customer, conversion, satisfaction, or repeat outcome"]
      - ["No named developer reference in assigned evidence", Developer, "Sales distribution and transaction support", "Aggregate relationship claim only", "85% of business reported from repeat developer relationships", "No developer name, contract period, renewal record, or independently verified outcome"]
      - ["No named lender or borrower reference in assigned evidence", "Lender / mortgage applicant", "Qualification, document automation, and disbursal", "Mix of live disbursal scale and developing document automation", "INR 87,831 crore FY26 disbursals reported", "No counterparty name, approval rate, economics, default performance, or borrower cohort"]
    notes: >-
      Sample is limited to the successful prefetched pool assigned to this chapter; aggregate
      company, partner, and press metrics do not substitute for named reference calls.
    enumerationScope:
      coverage: partial
      basis: >-
        Successful prefetched customer-related evidence assigned to the 2026-10-21 report run.
    claimRefs: [CU002, CU004, CU006, CU011, CU012]
figures:
  - id: FU001
    title: Assisted customer journey and expansion surfaces
    type: journey-map
    summary: >-
      The journey connects digital acquisition to human-assisted closing and adjacent services,
      while retention and customer-level conversion remain undisclosed.
    data:
      nodes:
        - id: discovery
          label: Search and discovery
          detail: Property research, comparison, and immersive viewing attract buyers and investors.
          touchpoints: [Web portal, "3D / VR views", Market data]
        - id: qualification
          label: AI qualification
          detail: Automated voice interactions collect requirements and identify higher-intent leads.
          touchpoints: [SuperAgent Pro, "200,000 daily calls", "12+ Indian languages"]
        - id: advisory
          label: Human advisory
          detail: Qualified leads move to relationship managers for site visits and closing support.
          touchpoints: [Relationship manager, Site visit, Negotiation]
        - id: transaction
          label: Property transaction
          detail: Inventory, payment, documentation, and signatures support execution.
          touchpoints: [Inventory blocking, Payment gateway, Digital signature]
        - id: mortgage
          label: Mortgage facilitation
          detail: Urban Money supports lender matching, applications, documents, and disbursal.
          touchpoints: [Loan application, Document automation, Lender network]
        - id: expansion
          label: Adjacent and repeat services
          detail: Interiors, rentals, property management, and developer relationships create expansion paths.
          touchpoints: [Interior Company, Azuro, Repeat developer business]
    approximationNotes: >-
      Ordered synthesis of documented service surfaces; it does not assert conversion rates,
      stage volumes, or a shared customer cohort.
    claimRefs: [CU001, CU003, CU004, CU014]
callouts:
  - calloutType: strength
    title: Aggregate reach spans acquisition and fulfillment
    body: >-
      Traffic, transaction, call, and disbursal evidence indicates meaningful operating activity
      across discovery, brokerage, and mortgages, although the measures are not directly comparable.
    claimRefs: [CU002, CU003, CU007, CU011]
  - calloutType: risk
    title: Retention and concentration remain unquantified
    body: >-
      Repeat developer business is the only durability signal; customer-level NRR, churn,
      contract duration, satisfaction, and top-customer revenue shares require direct diligence.
    claimRefs: [CU006, CU010]
