schemaVersion: "report-v2"
artifact: financials
slug: square-yards
runDate: 2026-10-21
company:
  name: Square Yards
chapter:
  number: 4
  title: Financials
  summary: >-
    Third-party reporting indicates that Square Yards reached FY26 revenue of
    ₹2,086 crore and EBITDA of ₹176 crore, improving the reported EBITDA margin
    to 8%. The growth and operating-leverage signals are promising, but segment
    economics, realized pricing, cash, burn, debt terms, and runway remain
    unavailable in the retained public evidence.
sections:
  - id: revenue-trajectory
    title: Revenue growth and earnings quality
    body: >-
      The clearest current traction signal is FY26 revenue of ₹2,086 crore, up
      48% year over year, alongside EBITDA of ₹176 crore and an 8% EBITDA
      margin versus 3% a year earlier. FY25 reporting cited ₹1,410 crore of
      revenue and ₹46 crore of EBITDA, so the direction of travel suggests
      substantial operating leverage rather than growth alone. However, these
      figures come from private-company reporting repeated by third parties,
      not audited public filings in the retained set. A separate analyst page
      records $223 million of revenue as of June 2026 and a 4.5x revenue
      multiple on a $1 billion valuation; currency conversion, period, and
      accounting scope should be reconciled before underwriting.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI015, CI016]
    tableRefs: [TI003]
  - id: monetization-model
    title: Monetization breadth exceeds disclosed economics
    body: >-
      Square Yards spans brokerage, mortgage facilitation, rentals, property
      management, interiors, and digital products. An analyst source describes
      the revenue model as commission and subscription based, while official
      materials describe an integrated consumer journey across these services.
      Urban Money's reported ₹87,831 crore of FY26 loan disbursals is an
      activity-volume indicator, not revenue, ARR, cash, or gross profit. The
      model offers several cross-sell points, but the retained sources do not
      disclose current take rates, realized prices, segment revenue shares, or
      segment contribution margins. Consequently, revenue diversification and
      quality cannot be quantified from public evidence.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Financing adds capacity but does not establish runway
    body: >-
      The June 2026 financing was reported as ₹900 crore, approximately $95
      million, in a mixture of debt and equity. Multiple retained sources
      support the round size, and reporting says proceeds were intended for
      geographic expansion, technology investment, and IPO preparation.
      However, the exact debt-equity split, debt pricing, covenants, maturity
      profile, cash on hand, and cash burn are not disclosed. Funding raised is
      therefore not equivalent to cash available, and the round cannot be
      converted into a defensible runway estimate. Any planned follow-on
      financing should be treated as a dependency rather than committed
      liquidity until documented.
    claimRefs: [CI006, CI007, CI013, CI016]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The public picture supports a positive but provisional verdict: reported
      revenue growth is strong and EBITDA expansion indicates improving
      operating leverage. The integrated model may support cross-sell and
      several monetization paths, yet the evidence does not reveal whether
      growth is concentrated in low-margin mortgage facilitation, brokerage, or
      service-heavy businesses. Underwriting should remain conditional on
      management accounts that reconcile legal-entity and group revenue,
      segment gross margins, CAC and payback, working capital, capex,
      service-delivery costs, cash, burn, and financing obligations. Without
      those inputs, neither sustainable margin nor capital adequacy can be
      established.
    claimRefs: [CI001, CI002, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns:
      - Stream
      - Mechanism
      - Economic unit
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - - Real estate brokerage
        - Transaction commission
        - Completed property transaction or property value
        - Current realized rate and segment share not disclosed
        - Transactional and market-sensitive
        - Revenue, take rate, cancellation rate, and contribution margin by geography
      - - Mortgage marketplace
        - Lender-paid facilitation or origination economics
        - Loan facilitated
        - ₹87,831 crore FY26 disbursal volume reported; revenue contribution not disclosed
        - High activity volume, but disbursal is not revenue
        - Net take rate, lender concentration, approval conversion, and loss or clawback exposure
      - - Interiors and home services
        - Project or service fees
        - Completed project or service contract
        - Service offering confirmed; revenue and margin unavailable
        - Potentially service- and working-capital-intensive
        - Order value, gross margin, completion time, cancellations, and working capital
      - - Rentals, property management, SaaS, and digital products
        - Service fees and subscriptions
        - Managed property, user, or contract
        - Subscription model reported; pricing and mix unavailable
        - Potentially recurring, but recurrence is unverified
        - ARR, retention, contract duration, gross margin, and customer concentration
    notes: >-
      Mechanisms are drawn from retained official and analyst descriptions;
      values are not estimates, and undisclosed mix, pricing, or margins remain
      null rather than inferred.
    claimRefs: [CI010, CI011, CI012, CI013]
  - id: TI002
    title: Pricing and monetization visibility
    columns:
      - Product or service
      - Reported model
      - Public list price
      - Realized pricing
      - Underwriting implication
    rows:
      - - Property transactions
        - Commission
        - Unavailable
        - Unavailable
        - Current take rate and discounting cannot be modeled
      - - Mortgage facilitation
        - Commission or lender-paid economics
        - Unavailable
        - Unavailable
        - Loan volume cannot be converted into net revenue
      - - Property management and interiors
        - Service or project fees
        - Unavailable
        - Unavailable
        - Delivery cost and working-capital intensity are unknown
      - - SaaS and digital products
        - Subscription
        - Unavailable
        - Unavailable
        - Recurring-revenue quality and retention cannot be verified
    notes: >-
      The retained sources identify commission and subscription mechanisms but
      do not provide current list or realized prices for any stream.
    claimRefs: [CI010, CI011, CI013]
  - id: TI003
    title: Unit economics and capital-adequacy scorecard
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence request
    rows:
      - - FY26 revenue growth and EBITDA margin
        - 48% YoY revenue growth; 8% EBITDA margin
        - Medium; third-party reporting
        - Indicates operating leverage at group level
        - Audited group accounts and EBITDA reconciliation
      - - Gross margin by revenue stream
        - Unavailable
        - Low
        - Separates asset-light commissions from service delivery
        - Segment gross-profit bridge and cost allocation
      - - CAC, payback, and sales cycle
        - Unavailable
        - Low
        - Determines whether growth is capital efficient
        - Cohort CAC, conversion, cancellation, payback, and channel economics
      - - Cash, burn, and runway
        - Unavailable
        - Low
        - Determines financing dependency and downside resilience
        - Monthly cash-flow statement, unrestricted cash, and 24-month plan
      - - Debt share, covenants, and maturity
        - Mixed debt-equity round; split and terms unavailable
        - Medium on structure; low on obligations
        - Debt service may constrain expansion and IPO timing
        - Facility agreements, repayment schedule, security, and covenant headroom
    notes: >-
      Public values preserve their reported periods and metric names; unavailable
      fields are explicit diligence gaps, not analyst estimates.
    claimRefs: [CI001, CI002, CI006, CI013, CI016]
figures:
  - id: FI001
    title: Revenue model bridge and missing cost visibility
    type: flow
    summary: >-
      Customer activity can feed several monetization paths, but public evidence
      does not support a quantified bridge from activity to segment gross profit.
    data:
      nodes:
        - id: discovery
          label: Search and discovery
          detail: Customer demand enters through property search and decision tools.
        - id: transaction
          label: Property transaction
          detail: Brokerage activity can generate transaction commissions.
        - id: mortgage
          label: Mortgage facilitation
          detail: Urban Money connects borrowers with lending partners; disbursal volume is not revenue.
        - id: services
          label: Interiors, rentals, and management
          detail: Add-on services may generate project, service, or management fees.
        - id: monetization
          label: Commission and subscription revenue
          detail: Analyst evidence identifies commission and subscription models, without current take rates.
        - id: profit
          label: Gross profit and EBITDA
          detail: FY26 group EBITDA is reported, but segment costs and gross-profit conversion are undisclosed.
      edges:
        - from: discovery
          to: transaction
          label: customer conversion
        - from: transaction
          to: mortgage
          label: optional financing
        - from: transaction
          to: services
          label: optional cross-sell
        - from: transaction
          to: monetization
          label: commission
        - from: mortgage
          to: monetization
          label: facilitation economics
        - from: services
          to: monetization
          label: service or subscription fees
        - from: monetization
          to: profit
          label: costs not publicly allocated
    approximationNotes: >-
      The flow is qualitative and non-proportional; it does not imply that every
      customer uses every service or that loan disbursal equals revenue.
    claimRefs: [CI010, CI011, CI012, CI014]
callouts:
  - calloutType: strength
    title: Reported operating leverage improved
    body: >-
      FY26 reporting pairs 48% revenue growth with EBITDA increasing 3.7 times
      and margin expanding to 8% from 3%, a stronger signal than revenue growth
      in isolation.
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Capital adequacy remains unproven
    body: >-
      The latest round mixes debt and equity, while cash, burn, financing terms,
      and planned obligations remain undisclosed; the headline raise cannot be
      treated as runway.
    claimRefs: [CI006, CI013, CI016]
