  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The operating case strengthens through scale and margin expansion, but financing opacity and weak price
      comparability stop the chain at research more.
    data:
      nodes:
        - id: integrated-model
          label: Integrated model
          value: Transactions through post-sale services
          detail: Multiple services create cross-sell potential but require segment-level economics.
        - id: revenue-scale
          label: FY26 scale
          value: INR 2,086 Cr revenue
          detail: Reported revenue increased 48% year over year.
        - id: operating-leverage
          label: Operating leverage
          value: 8% adjusted EBITDA margin
          detail: Reported adjusted EBITDA reached INR 176 Cr.
        - id: financing-structure
          label: Financing structure
          value: $95M mixed debt-equity
          detail: The exact debt-equity split and seniority were not disclosed.
        - id: price-test
          label: Price test
          value: 4.5x reported revenue
          detail: The $1B marker lacks a sufficiently comparable public benchmark.
        - id: recommendation
          label: Recommendation
          value: Research more / track
          detail: Require audited segment economics, cap-table rights, debt terms, and an IPO filing.
    approximationNotes: Ordered logic only; node widths do not encode probability, valuation, or relative importance.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
