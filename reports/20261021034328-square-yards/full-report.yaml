  - id: FI001
    title: Revenue model bridge and missing cost visibility
    type: flow
    summary: >-
      Customer activity can feed several monetization paths, but public evidence does not support a quantified bridge
      from activity to segment gross profit.
    data:
      nodes:
        - id: discovery
          label: Search and discovery
          detail: Customer demand enters through property search and decision tools.
        - id: transaction
          label: Property transaction
          detail: Brokerage activity can generate transaction commissions.
        - id: mortgage
          label: Mortgage facilitation
          detail: Urban Money connects borrowers with lending partners; disbursal volume is not revenue.
        - id: services
          label: Interiors, rentals, and management
          detail: Add-on services may generate project, service, or management fees.
        - id: monetization
          label: Commission and subscription revenue
          detail: Analyst evidence identifies commission and subscription models, without current take rates.
        - id: profit
          label: Gross profit and EBITDA
          detail: FY26 group EBITDA is reported, but segment costs and gross-profit conversion are undisclosed.
      edges:
        - from: discovery
          to: transaction
          label: customer conversion
        - from: transaction
          to: mortgage
          label: optional financing
        - from: transaction
          to: services
          label: optional cross-sell
        - from: transaction
          to: monetization
          label: commission
        - from: mortgage
          to: monetization
          label: facilitation economics
        - from: services
          to: monetization
          label: service or subscription fees
        - from: monetization
          to: profit
          label: costs not publicly allocated
    approximationNotes: >-
      The flow is qualitative and non-proportional; it does not imply that every customer uses every service or that
      loan disbursal equals revenue.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI014
