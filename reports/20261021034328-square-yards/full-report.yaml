              - CE009
              - CE014
              - CE016
      - number: '5.4'
        title: Trust, reliability, and roadmap gaps
        blocks:
          - type: paragraph
            body: >-
              The public trust case is materially behind the breadth of the product claim. An official profile says
              buyer information, KYC data, and digital signatures use file encryption, but the assigned evidence does
              not name a security certification, privacy-control framework, penetration-test cadence, uptime objective,
              disaster-recovery target, or public incident process. Likewise, current reporting says AI has accelerated
              product development and improved technology and marketing productivity, yet provides no measured baseline.
              The available practitioner-community proxy mentions an AI and broker operating-system category but
              contains no Square Yards implementation evidence. Investment diligence should treat security, reliability,
              integration quality, and developer adoption as private-evidence questions until control reports,
              architecture documentation, service metrics, and customer references are produced.
            claimRefs:
              - CE006
              - CE007
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow breadth is the clearest product advantage
            body: >-
              Multiple current and historical sources describe a connected service surface across property transactions,
              financing, visualization, interiors, rentals, and management.
            calloutType: strength
            claimRefs:
              - CE001
              - CE008
              - CE009
          - type: callout
            title: Full-stack breadth is not technical proof
            body: >-
              Public sources do not establish service levels, security certifications, model performance, integration
              quality, or active adoption by module.
            calloutType: risk
            claimRefs:
              - CE013
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base, users, and payers
        blocks:
          - type: paragraph
            body: >-
              Square Yards presents an integrated journey rather than a single listing product: discovery and
              transactions lead into mortgages, interiors, rentals, property management, and post-sales services. That
              breadth creates several distinct economic relationships. Homebuyers and property owners are end users;
              developers pay for transaction distribution and sales support; brokers use inventory, marketing, and
              transaction tools; and lenders participate through mortgage origination. Independent profiles also
              characterize the platform as serving both B2C and B2B constituencies, including homebuyers, agents,
              developers, and banks. The evidence therefore supports broad segment coverage, but not revenue, gross
              margin, acquisition cost, or lifetime value by customer segment. A historical company page reported more
              than 200,000 registered brokers, which establishes channel reach but not active use or current
              monetization.
            claimRefs:
              - CU001
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU011
              - CU015
      - number: '6.2'
        title: Aggregate adoption and operating scale
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is substantial at the platform level but mixes unlike measures. Google Cloud reports
              eight million monthly visitors across nine countries and 200,000 automated calls per day in more than
              twelve Indian languages, while Square Yards' LinkedIn profile claims more than 15,000 transactions worth
              over US$1 billion each year. Inc42 separately displays 1.61 million web visits for a trailing 30-day
              period. These figures should not be combined into a funnel: visitors, web traffic, AI calls, property
              transactions, and loan disbursals use different populations, periods, and denominators. They do show that
              customer acquisition and qualification operate at meaningful scale, but none independently reveals
              conversion, active accounts, repeat purchase, or unit economics.
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU007
              - CU009
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU007
              - CU009
              - CU011
              - CU012
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The clearest durability indicator is Aurum PropTech's statement that 85% of business comes from repeat
              developer relationships and that Square Yards contributes 2-5% of those developers' sales. This is useful
              relationship evidence, but it is not customer-level NRR, GRR, renewal, churn, or cohort retention, and
              Aurum is a proptech-sector participant rather than an independent benchmark. Business Standard reports
              that Urban Money supplied more than half of FY26 revenue, real-estate transaction services supplied 40%,
              and interiors plus other digital products supplied about 10%. That is segment concentration, not
              top-customer concentration. VCCircle's coverage index also identifies Urban Money expansion as a growth
              driver, reinforcing the strategic importance of mortgage distribution without disclosing lender, borrower,
              or channel-partner concentration.
            claimRefs:
              - CU006
              - CU010
              - CU013
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU004
              - CU006
              - CU011
              - CU012
      - number: '6.4'
        title: Customer journey and proof gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence supports an assisted journey from digital discovery through AI qualification, human
              relationship management, transaction execution, mortgage processing, and adjacent post-sale services.
              Management told Business Standard that AI handles the first customer interaction, lead qualification, and
              requirement gathering before a relationship manager takes over. Google Cloud says the mortgage workflow is
              developing document automation that can populate up to 75% of loan applications. This design creates
              plausible cross-sell surfaces, but no source in the assigned pool names a buyer, developer, lender, or
              property owner and documents a production deployment with a measured outcome. Reference calls, cohort
              exports, renewal schedules, and concentration data are therefore required before treating aggregate reach
              as durable customer proof.
            claimRefs:
              - CU001
              - CU004
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Aggregate reach spans acquisition and fulfillment
            body: >-
              Traffic, transaction, call, and disbursal evidence indicates meaningful operating activity across
              discovery, brokerage, and mortgages, although the measures are not directly comparable.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU007
              - CU011
          - type: callout
            title: Retention and concentration remain unquantified
            body: >-
              Repeat developer business is the only durability signal; customer-level NRR, churn, contract duration,
              satisfaction, and top-customer revenue shares require direct diligence.
            calloutType: risk
            claimRefs:
              - CU006
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implication
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is execution across an unusually broad transaction stack rather than one
              documented adverse event. Square Yards reports FY26 revenue of INR 2,086 crore and adjusted EBITDA of INR
              176 crore, but its own page contains an internally inconsistent gross-profit table entry, while an Inc42
              snapshot still labels the company "Yet To File" for an IPO. The operating model also depends on returning
              developer partners for a reported 85% of business. These signals make developer concentration,
              regulated-workflow controls, and disclosure readiness the first diligence priorities. The matrix is a
              qualitative evidence-based ranking, not a probability model; likelihood remains unquantified where the
              public record lacks incidents, contracts, or regulator findings.
            claimRefs:
              - CR002
              - CR004
              - CR008
              - CR009
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, privacy, and transaction-control exposure
        blocks:
          - type: paragraph
            body: >-
              The platform spans property transactions, loan facilitation, KYC-related data, payment gateways, digital
              signatures, and credit-bureau or banking integrations. That breadth creates multiple control surfaces
              across jurisdictions, even though the reviewed sources do not identify a specific enforcement action or
              breach. Company material says buyer information, KYC data, and signatures use file encryption, but it does
              not name a certification, independent audit, incident history, license inventory, or privacy-control test.
              The proper conclusion is therefore not that incidents are absent; it is that public evidence cannot verify
              the control environment. Investment approval should require jurisdiction-level licenses, complaints and
              litigation schedules, security attestations, and an incident register.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR009
              - CR013
              - CR014
              - CR016
      - number: '7.3'
        title: Operational, financial, and reporting execution
        blocks:
          - type: paragraph
            body: >-
              Reported growth and positive adjusted EBITDA provide operating cushion, but they do not remove execution
              risk. India contributes 88% of reported revenue, while the business coordinates property sales, mortgages,
              interiors, rentals, management, and digital products. Public workforce indicators also conflict: Inc42
              lists 9,624 employees while LinkedIn uses a 1,001-5,000 company-size band. That may reflect timing,
              contractors, or different counting methods, but the denominator is not disclosed. The FY26 page's
              gross-profit headline and table are likewise inconsistent. Before relying on margins or operating
              leverage, diligence should reconcile audited statements to management KPIs, define employee and agent
              populations, and test segment-level cash conversion rather than treating adjusted EBITDA as cash
              generation.
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
              - CR011
              - CR013
              - CR014
      - number: '7.4'
        title: Dependencies, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The most measurable dependency is the reported 85% share of business from returning developer partners;
              the largest individual exposures and contract terms remain unknown. Mortgage scale adds reliance on
              lenders, credit bureaus, and financial institutions, while a large agent-supported sales model raises
              process-quality and supervision demands. Mitigation claims are presently directional: integrated tools,
              diversification across services, and a 55% attachment rate may deepen customer monetization, but they also
              increase cross-product operational coupling. A thesis break should be triggered by loss of a major
              developer or lender relationship, material regulatory restriction, a significant data or payment incident,
              failure to reconcile audited filings with advertised KPIs, or sustained reversal of positive adjusted
              EBITDA. Contract-level concentration and covenant data are required to set numerical thresholds.
            claimRefs:
              - CR004
              - CR005
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Disclosure controls need pre-IPO reconciliation
            body: >-
              The official FY26 page presents gross profit as INR 476 crore in its headline but INR 48 crore in the
              detailed table. Audited statements and KPI definitions should control the investment model before any
              valuation decision.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
          - type: callout
            title: Gate investment approval on primary diligence
            body: >-
              Require licenses, litigation and complaints schedules, security attestations, incident history, lender and
              developer concentration, financing covenants, and audited segment cash conversion before treating the
              public growth narrative as de-risked.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR009
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and investment framing
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research more and track, with medium confidence and high underwriting risk. The
              positive case is unusually tangible for a private proptech platform: Square Yards spans property
              transactions, mortgages, interiors, rentals, and property management, while reported FY26 revenue rose 48%
              to INR 2,086 crore and adjusted EBITDA reached INR 176 crore at an 8% margin. The anti-thesis is price and
              structure rather than product breadth. The latest financing reportedly combined debt and equity at a
              valuation above $1 billion, but the split and investor protections were not disclosed. Investors should
              therefore separate company quality from security-level attractiveness. Entry should wait for the
              capitalization table, debt terms, liquidation preferences, audited statements, and an internally
              consistent IPO plan; without those items, neither downside protection nor dilution can be underwritten
              from public evidence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              June 2026 evidence converges on a roughly $95 million mixed debt-equity raise and a post-money value above
              $1 billion. Multiples records $223 million of revenue beside a $1 billion valuation, implying 4.5x
              revenue. That is a useful transaction marker, not proof of fair value: the public record does not disclose
              the debt-equity allocation, seniority, coupons, covenants, liquidation preferences, or fully diluted
              ownership. Funding totals also conflict, with Inc42 showing more than $208.82 million and Multiples
              showing $228 million across eight rounds. The November 2025 financing at a reported $900 million pre-money
              valuation offers a directionally relevant prior mark, but successive rounds with different security mixes
              cannot be treated as like-for-like common equity prices.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario and comparable discipline
        blocks:
          - type: paragraph
            body: >-
              The operating setup can support upside if management sustains its 40% or greater FY27 growth ambition
              while moving into double-digit EBITDA margins. Revenue concentration also matters: Business Standard
              reports that Urban Money produced more than half of FY26 revenue, real-estate transactions about 40%, and
              interiors plus other digital products about 10%. This mix makes a single portal-company multiple
              misleading because lending distribution, brokerage, and services have different margin and risk profiles.
              The available comparable set spans approximately 1.2x to 11.2x revenue across materially different
              businesses and geographies. The scenario ranges below are therefore transparent analytical cases applied
              to reported FY26 revenue, not observed bids, forecasts, or price targets. Audited segment economics and a
              genuinely comparable peer set are required before narrowing them.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Exit evidence is inconsistent. Online Marketplaces reported the chief executive's ambition to float the
              company at a minimum $1.5 billion valuation in 2026, while a later Business Standard interview said an IPO
              remained on the horizon with no announced timetable. This divergence does not prove delay, but it prevents
              underwriting a dated liquidity event. The thesis improves if a filed offer document confirms audited
              segment profitability, cash conversion, debt maturity, preference terms, and a credible
              primary-versus-secondary issuance mix. It breaks if growth falls materially below management's 40%+
              ambition, EBITDA margin retreats from 8%, financing adds senior claims without matching cash generation,
              or an IPO requires a valuation below the June round. Until those tests are observable, track execution and
              negotiate on security terms rather than relying on unicorn status.
            claimRefs:
              - CV003
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite the security, not the unicorn label
            body: >-
              The June valuation marker is credible enough to frame negotiations but not complete enough to establish
              common-equity value. A decision requires the debt-equity allocation, fully diluted capitalization,
              preference stack, covenant package, and audited segment cash generation.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
