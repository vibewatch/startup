chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and integrated model
        blocks:
          - type: paragraph
            body: >-
              Square Yards was founded in 2014 and is headquartered in Gurugram, India. Its operating proposition is
              broader than a listings marketplace: company and third-party profiles describe a full-stack journey across
              search and discovery, property transactions, mortgages, interiors, rentals, property management, and
              post-sales services. The live website still exposes property discovery and market-insight surfaces, while
              the company profile describes separate operating brands for financing, interiors, rentals, and immersive
              property visualization. This breadth creates several monetization points, but it also means that group
              performance cannot be assessed as a single pure software or marketplace model. The company claims a
              footprint of more than 100 cities across nine countries; that reach is useful directional evidence, not an
              independently audited location count. Unsupported cover metrics, including a verified customer count, are
              explicitly left open rather than carried forward from an earlier report.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.2'
        title: Founder leadership and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public records consistently associate the business with founders Tanuj Shori and Kanika Gupta Shori.
              Tracxn identifies Tanuj Shori as the current chief executive, while Business Standard identifies Vivek
              Agarwal as cofounder and chief technology officer. This gives the visible leadership team direct coverage
              across general management and technology, and the CTO's public comments indicate continuing executive
              ownership of product, artificial intelligence, and growth strategy. The same sources do not provide a
              reliable, current account of board committees, investor consent rights, succession depth, or the present
              operating remit of every founder. Founder leadership is therefore both an alignment signal and a
              key-person dependency. Pre-IPO diligence should verify the statutory board, reserved matters,
              related-party controls, and management succession rather than treating directory profiles as a governance
              audit.
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: Financing, scale, and denominator discipline
        blocks:
          - type: paragraph
            body: >-
              Business Standard reported FY26 revenue of INR 2,086 crore, up 48% year over year, and EBITDA of about INR
              176 crore, 3.7 times the prior year. It also reported that Urban Money contributed more than half of
              revenue, real-estate transaction services about 40%, and interiors plus other digital products about 10%.
              Those figures show that financing distribution, rather than brokerage alone, is now central to the group.
              The latest capital event is better supported: independent sources describe a $95 million mixed debt-equity
              financing in June 2026 and a valuation of about $1 billion. Cumulative funding is not similarly settled.
              Multiples reports $228 million across eight rounds, while Tracxn reports $96.9 million across eleven
              rounds. The disagreement likely reflects different treatment of debt and historical rounds, but that
              explanation is not disclosed in the available records. Funding raised must not be treated as cash
              available, and the debt portion requires separate covenant and maturity diligence.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: Milestones and current stage
        blocks:
          - type: paragraph
            body: >-
              The public chronology shows a long private-company build rather than a single recent breakout: formation
              in 2014, successive equity and growth financings, a $35 million round in November 2025, and the larger
              June 2026 mixed financing that accompanied unicorn status. FY26 revenue and EBITDA provide evidence of
              operating scale at the time of that valuation, although neither figure establishes cash generation after
              interest, working capital, or debt service. Management told Business Standard in July 2026 that an IPO
              remained on the horizon but had no announced timetable. Square Yards should therefore be treated as a
              private, pre-IPO company rather than as a near-certain listing candidate. The investable next step is to
              reconcile financing documents, audited group accounts, legal entities, and governance readiness before
              assigning liquidity value to an IPO.
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO011
              - CO012
              - CO013
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO011
              - CO012
              - CO013
              - CO014
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital raised is not cash available
            body: >-
              The $95 million June 2026 event mixes debt and equity, while public cumulative totals disagree materially.
              Underwriting needs instrument-level proceeds, repayments, covenants, and current cash before treating the
              round as runway.
            calloutType: risk
            claimRefs:
              - CO012
              - CO014
              - CO015
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is narrower than all real estate and broader than an online listing portal. Square
              Yards describes an end-to-end consumer journey covering search and discovery, property transactions,
              mortgages, home furnishing, rentals, and property management, while also offering business-facing
              workflows for developers, financial institutions, and agents. The included spend is therefore fees or
              revenue earned from enabling those services, not the underlying value of homes or loan principal passing
              through the platform. Status-quo substitutes include offline brokers, direct developer sales teams,
              bank-led mortgage processes, and separate interiors or property-management vendors. The company operates
              across India, the UAE, Australia, and Canada, but the market boundary remains operationally India-led
              rather than a uniform global category.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM015
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not support a defensible top-down TAM, SAM, or SOM for the integrated boundary.
              It instead offers four non-interchangeable company-scale lenses: FY26 revenue of INR 2,086 crore, 273,643
              customers acquired, INR 13,236 crore of houses transacted, and INR 87,831 crore of loans disbursed.
              Revenue is accounting output; property and mortgage figures are facilitated principal or transaction
              value; and the customer count is a volume measure. These figures must not be added or converted into
              market share without category spend and denominator evidence. The geography mix gives the clearest
              serviceable-market constraint: India generated 88% of FY26 revenue and international markets 12%, while
              India grew faster than the consolidated business.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM015
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The demand system is multi-sided. Home seekers and property owners use consumer services; developers,
              lenders, and agents use or participate in business workflows; and the sources do not consistently disclose
              which party pays each fee or owns each software budget. Mortgage distribution is especially
              partner-dependent: Fortune India reports more than 150 bank and non-bank partners behind Urban Money's
              FY26 disbursals. The adoption path is therefore not a single software purchase. It begins with customer
              acquisition, continues through transaction and financing workflows, and may extend into interiors,
              rentals, or management. The reported 55% attachment rate is evidence of cross-service adoption, but the
              source does not define the denominator or provide segment-level economics.
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is supported by digitization of paperwork-heavy property workflows, a large reported flow of
              transactions and loans, and opportunities to attach adjacent services after a core transaction. Square
              Yards reports faster India growth than consolidated growth and meaningful activity in designed and managed
              homes, which indicates that adjacencies are active rather than merely announced. Constraints are equally
              material: the workflow crosses regulated lenders, identity and payment processes, developers, agents, and
              consumers, raising coordination, trust, and execution requirements. EAAA Alternatives described the
              industry as highly fragmented, which can create room for consolidation but also implies costly local
              operations. Without independent category spend, fee take rates, retention, acquisition cost, and segment
              margins, valuation should rely on demonstrated revenue and profitability rather than a broad market-size
              multiple.
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not capitalize throughput as revenue
            body: >-
              The INR 87,831 crore loan figure and INR 13,236 crore property figure are facilitated principal or
              transaction values, not Square Yards revenue or independently measured addressable market spend.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM015
          - type: callout
            title: Use a bottom-up diligence bridge
            body: >-
              Request segment revenue, take rates, transaction counts, repeat behavior, acquisition cost, and
              geography-level margins before converting the operating footprint into a market-share or valuation-growth
              assumption.
            calloutType: recommendation
            claimRefs:
              - CM009
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and alternative models
        blocks:
          - type: paragraph
            body: >-
              The evidence supports three distinct competitive models rather than one homogeneous peer set. Square Yards
              presents an assisted, full-lifecycle model spanning property discovery, transactions, mortgages, rentals,
              property management, interiors, and post-sales services. Online Marketplaces identifies Housing.com,
              MagicBricks, and 99acres as rivals for marketplace traffic, while a separate industry account describes
              NoBroker as removing broker commissions from direct landlord-tenant transactions. Those alternatives
              compete at different stages and with different intermediation models. Traditional brokers, direct
              developer sales, and internal buyer research remain plausible status-quo substitutes, but the assigned
              source pool does not quantify their share, price, or service quality and they are therefore treated as
              diligence gaps rather than scored competitors.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP013
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP008
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP013
      - number: '3.2'
        title: Capability breadth, distribution, and partner access
        blocks:
          - type: paragraph
            body: >-
              Square Yards' strongest evidenced distinction is breadth. Its portfolio combines the core transaction
              platform with Urban Money, Azuro, Interior Company, PropVR, and broker-facing distribution. Urban Money's
              reported FY26 facilitation volume and relationships with more than 150 banks and NBFCs indicate meaningful
              access to mortgage supply, while the historical Square Connect broker count shows a channel layer beyond
              consumer traffic. Breadth can improve cross-sell and data reuse, but it also creates execution
              dependencies: financing depends on lenders, transactions depend on developers and agents, and service
              quality must remain consistent across several operating businesses. The reviewed evidence establishes
              scope and reach, not exclusive supply or superior customer outcomes.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP009
              - CP010
              - CP011
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.3'
        title: Pricing, switching costs, and trust posture
        blocks:
          - type: paragraph
            body: >-
              The source set does not contain comparable list prices, realized commissions, subscription fees, contract
              terms, discounts, or total customer costs for Square Yards and its alternatives. It also does not disclose
              cohort retention, exclusivity, repeat use, customer acquisition cost, complaint rates, or independently
              benchmarked trust and regulatory outcomes. Consequently, the evidence cannot establish whether users
              single-home, multi-home across portals, or switch between digital and traditional channels. The absence of
              these fields is not evidence of weak performance or misconduct; it is a boundary on the comparison.
              Procurement-grade pricing sheets, channel agreements, customer cohorts, and complaint-resolution data are
              required before underwriting lock-in or a trust advantage.
            claimRefs:
              - CP003
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP014
              - CP015
      - number: '3.4'
        title: Differentiation durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The integrated stack is a plausible moat because it can connect discovery, assisted transactions,
              financing, post-sale services, and property management within one group. Public operating scale and
              improved profitability show that the model has reached material scale, but they do not prove that the
              breadth is difficult to reproduce. Portal competitors benefit from large corporate parents, NoBroker
              offers a structurally different commission proposition, and specialist lenders or service providers can
              compete at individual stages. PropVR's acquisition also shows that capabilities can be bought rather than
              developed organically. The investment conclusion is therefore conditional: integration is differentiated
              today, while durable pricing power, retention, exclusive supply, and cross-sell economics remain
              unverified.
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP010
              - CP012
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the clearest evidenced differentiator
            body: >-
              Square Yards combines transaction, financing, post-sale, and property-management capabilities in one
              group, creating more cross-sell surfaces than the traffic-only peer descriptions available in the assigned
              evidence.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP013
          - type: callout
            title: Moat evidence stops short of customer lock-in
            body: >-
              No retained source provides comparable retention, exclusivity, realized pricing, or customer-outcome data,
              so integration should not be equated with proven switching costs or durable pricing power.
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue growth and earnings quality
        blocks:
          - type: paragraph
            body: >-
              The clearest current traction signal is FY26 revenue of ₹2,086 crore, up 48% year over year, alongside
              EBITDA of ₹176 crore and an 8% EBITDA margin versus 3% a year earlier. FY25 reporting cited ₹1,410 crore
              of revenue and ₹46 crore of EBITDA, so the direction of travel suggests substantial operating leverage
              rather than growth alone. However, these figures come from private-company reporting repeated by third
              parties, not audited public filings in the retained set. A separate analyst page records $223 million of
              revenue as of June 2026 and a 4.5x revenue multiple on a $1 billion valuation; currency conversion,
              period, and accounting scope should be reconciled before underwriting.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI013
              - CI016
      - number: '4.2'
        title: Monetization breadth exceeds disclosed economics
        blocks:
          - type: paragraph
            body: >-
              Square Yards spans brokerage, mortgage facilitation, rentals, property management, interiors, and digital
              products. An analyst source describes the revenue model as commission and subscription based, while
              official materials describe an integrated consumer journey across these services. Urban Money's reported
              ₹87,831 crore of FY26 loan disbursals is an activity-volume indicator, not revenue, ARR, cash, or gross
              profit. The model offers several cross-sell points, but the retained sources do not disclose current take
              rates, realized prices, segment revenue shares, or segment contribution margins. Consequently, revenue
              diversification and quality cannot be quantified from public evidence.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI010
              - CI011
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI014
      - number: '4.3'
        title: Financing adds capacity but does not establish runway
        blocks:
          - type: paragraph
            body: >-
              The June 2026 financing was reported as ₹900 crore, approximately $95 million, in a mixture of debt and
              equity. Multiple retained sources support the round size, and reporting says proceeds were intended for
              geographic expansion, technology investment, and IPO preparation. However, the exact debt-equity split,
              debt pricing, covenants, maturity profile, cash on hand, and cash burn are not disclosed. Funding raised
              is therefore not equivalent to cash available, and the round cannot be converted into a defensible runway
              estimate. Any planned follow-on financing should be treated as a dependency rather than committed
              liquidity until documented.
            claimRefs:
              - CI006
              - CI007
              - CI013
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The public picture supports a positive but provisional verdict: reported revenue growth is strong and
              EBITDA expansion indicates improving operating leverage. The integrated model may support cross-sell and
              several monetization paths, yet the evidence does not reveal whether growth is concentrated in low-margin
              mortgage facilitation, brokerage, or service-heavy businesses. Underwriting should remain conditional on
              management accounts that reconcile legal-entity and group revenue, segment gross margins, CAC and payback,
              working capital, capex, service-delivery costs, cash, burn, and financing obligations. Without those
              inputs, neither sustainable margin nor capital adequacy can be established.
            claimRefs:
              - CI001
              - CI002
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported operating leverage improved
            body: >-
              FY26 reporting pairs 48% revenue growth with EBITDA increasing 3.7 times and margin expanding to 8% from
              3%, a stronger signal than revenue growth in isolation.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
          - type: callout
            title: Capital adequacy remains unproven
            body: >-
              The latest round mixes debt and equity, while cash, burn, financing terms, and planned obligations remain
              undisclosed; the headline raise cannot be treated as runway.
            calloutType: risk
            claimRefs:
              - CI006
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              Square Yards is not a single listings product: its current public surfaces describe a connected journey
              from property search and transaction support through mortgages, home furnishing, rentals, and property
              management. FY26 reporting indicates that this breadth is economically uneven, with Urban Money and
              real-estate transaction services accounting for most revenue while interiors and other digital products
              remain smaller. The portfolio has also been assembled partly through acquisitions, including PropVR for
              immersive property experiences and PropsAMC and Azuro for data, asset-management, and rental workflows.
              This breadth can reduce handoffs for customers, but it also creates a larger integration and
              service-quality surface than a focused marketplace.
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE009
              - CE010
              - CE011
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE009
              - CE010
              - CE011
              - CE013
              - CE014
      - number: '5.2'
        title: Transaction workflow and AI assistance
        blocks:
          - type: paragraph
            body: >-
              Company materials describe a digital transaction path that combines e-payments and e-signatures with
              mortgage fulfilment through credit-bureau, identity, address, and income checks. PropVR adds virtual tours
              and digital transaction tooling, while developer and brokerage modules are described as pre-built
              workflows, dashboards, and mobile apps. The most current independent reporting adds a clearer operating
              detail: AI handles the first customer interaction, qualification, and requirements gathering before a
              relationship manager takes over. This is an assistive-sales architecture rather than evidence of an
              autonomous property transaction system, and no public latency, conversion, accuracy, or exception-handling
              benchmark was found in the assigned evidence.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE009
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE009
              - CE014
              - CE015
      - number: '5.3'
        title: Architecture and differentiation
        blocks:
          - type: paragraph
            body: >-
              The defensible thesis is the orchestration of data, transaction, financing, visualization, and post-sale
              services rather than a disclosed proprietary software stack. Historical company material points to
              research tools, transaction data, PropsAMC data assets, a broker network, immersive visualization, and
              twelve patent filings. These signals suggest accumulated workflow know-how and cross-product data, but
              they do not establish granted patents, exclusive datasets, model quality, or switching costs. The 2025
              information memorandum also labelled digital products and home renovation as investment-phase segments,
              which argues against treating every module as equally mature. Technical diligence should therefore test
              integration depth and usage by module rather than accept the full-stack label as proof of a unified
              platform.
            claimRefs:
              - CE003
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
