        - FY27 growth remains at least 40%, EBITDA margin becomes double digit, and IPO terms are common-equity friendly
        - $1.34B-$1.78B (6.0x-8.0x FY26 revenue)
        - Requires strong confirmation
        - Filed offer document confirms clean leverage, cash conversion, and durable segment margins
      - - Base
        - >-
          Growth moderates but remains strong, margin holds near or above FY26, and no punitive preference overhang
          emerges
        - $0.89B-$1.12B (4.0x-5.0x FY26 revenue)
        - Closest to the reported 4.5x marker
        - Audited results reconcile revenue, EBITDA, debt, and fully diluted ownership
      - - Bear
        - Growth slows materially, margin compresses, or senior financing absorbs equity value before exit
        - $0.45B-$0.67B (2.0x-3.0x FY26 revenue)
        - Material until financing is disclosed
        - Missed growth guidance, margin reversal, covenant stress, or a down-round/discounted IPO
    notes: >-
      Illustrative analyst cases multiply the reported $223M FY26 revenue by stated scenario multiples selected within
      the source's broad 1.2x-11.2x comparable range; they are not observed offers, probabilities, or price targets.
    claimRefs:
      - CV002
      - CV003
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
