company:
  name: "Square Yards"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Square Yards is a Gurugram-headquartered, founder-led proptech platform spanning
    property discovery, transactions, mortgages, interiors, rentals, and property
    management. FY26 growth and the June 2026 financing support its newly reported
    $1 billion valuation, but cumulative funding, headcount, governance rights, and
    an IPO timetable remain insufficiently reconciled for underwriting.
sections:
  - id: "identity-and-business-model"
    title: "Identity, footprint, and integrated model"
    body: >-
      Square Yards was founded in 2014 and is headquartered in Gurugram, India. Its
      operating proposition is broader than a listings marketplace: company and
      third-party profiles describe a full-stack journey across search and discovery,
      property transactions, mortgages, interiors, rentals, property management, and
      post-sales services. The live website still exposes property discovery and
      market-insight surfaces, while the company profile describes separate operating
      brands for financing, interiors, rentals, and immersive property visualization.
      This breadth creates several monetization points, but it also means that group
      performance cannot be assessed as a single pure software or marketplace model.
      The company claims a footprint of more than 100 cities across nine countries;
      that reach is useful directional evidence, not an independently audited location
      count. Unsupported cover metrics, including a verified customer count, are
      explicitly left open rather than carried forward from an earlier report.
    claimRefs: [CO001, CO002, CO003, CO007]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Founder leadership and governance visibility"
    body: >-
      Public records consistently associate the business with founders Tanuj Shori
      and Kanika Gupta Shori. Tracxn identifies Tanuj Shori as the current chief
      executive, while Business Standard identifies Vivek Agarwal as cofounder and
      chief technology officer. This gives the visible leadership team direct coverage
      across general management and technology, and the CTO's public comments indicate
      continuing executive ownership of product, artificial intelligence, and growth
      strategy. The same sources do not provide a reliable, current account of board
      committees, investor consent rights, succession depth, or the present operating
      remit of every founder. Founder leadership is therefore both an alignment signal
      and a key-person dependency. Pre-IPO diligence should verify the statutory board,
      reserved matters, related-party controls, and management succession rather than
      treating directory profiles as a governance audit.
    claimRefs: [CO004, CO005, CO006]
    tableRefs: [TO002]
  - id: "funding-scale-and-evidence-quality"
    title: "Financing, scale, and denominator discipline"
    body: >-
      Business Standard reported FY26 revenue of INR 2,086 crore, up 48% year over
      year, and EBITDA of about INR 176 crore, 3.7 times the prior year. It also
      reported that Urban Money contributed more than half of revenue, real-estate
      transaction services about 40%, and interiors plus other digital products about
      10%. Those figures show that financing distribution, rather than brokerage
      alone, is now central to the group. The latest capital event is better supported:
      independent sources describe a $95 million mixed debt-equity financing in June
      2026 and a valuation of about $1 billion. Cumulative funding is not similarly
      settled. Multiples reports $228 million across eight rounds, while Tracxn reports
      $96.9 million across eleven rounds. The disagreement likely reflects different
      treatment of debt and historical rounds, but that explanation is not disclosed
      in the available records. Funding raised must not be treated as cash available,
      and the debt portion requires separate covenant and maturity diligence.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: "milestones-and-current-stage"
    title: "Milestones and current stage"
    body: >-
      The public chronology shows a long private-company build rather than a single
      recent breakout: formation in 2014, successive equity and growth financings,
      a $35 million round in November 2025, and the larger June 2026 mixed financing
      that accompanied unicorn status. FY26 revenue and EBITDA provide evidence of
      operating scale at the time of that valuation, although neither figure establishes
      cash generation after interest, working capital, or debt service. Management told
      Business Standard in July 2026 that an IPO remained on the horizon but had no
      announced timetable. Square Yards should therefore be treated as a private,
      pre-IPO company rather than as a near-certain listing candidate. The investable
      next step is to reconcile financing documents, audited group accounts, legal
      entities, and governance readiness before assigning liquidity value to an IPO.
    claimRefs: [CO001, CO008, CO009, CO011, CO012, CO013, CO016]
    figureRefs: [FO001]
