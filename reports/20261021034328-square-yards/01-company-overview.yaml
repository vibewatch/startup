  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "governance"
      missingEvidence: "Current statutory board roster, committee mandates, investor consent rights, related-party controls, management succession plan, and material leadership changes."
      whyItMatters: "Founder concentration and pre-IPO readiness cannot be assessed from public leadership profiles alone."
      diligencePath: "Request the latest corporate registry extracts, board and committee charters, shareholder agreement, organization chart, and three years of board minutes."
      relatedQuestionRefs: [QO003]
      relatedTableRefs: [TO002]
    - type: "conflicting-data"
      severity: "material"
      topic: "cumulative funding"
      missingEvidence: "An instrument-level schedule reconciling $228M across eight rounds with $96.9M across eleven rounds, including debt, equity, convertibles, repayments, and secondary sales."
      whyItMatters: "Funding raised is not cash available, and unreconciled debt can materially change leverage, dilution, and runway."
      diligencePath: "Reconcile bank statements, cap-table issuances, loan agreements, repayment records, and audited cash-flow statements for every financing."
      relatedQuestionRefs: [QO004, QO005]
      relatedTableRefs: [TO001, TO003]
    - type: "conflicting-data"
      severity: "material"
      topic: "cover metrics"
      missingEvidence: "A current, consistently defined group headcount and customer count with entity, geography, period, and active-customer denominator."
      whyItMatters: "Public headcount signals conflict, and a missing customer denominator prevents productivity, penetration, and unit-economics analysis."
      diligencePath: "Request payroll and contractor rosters by legal entity plus CRM extracts defining active transacting customers and repeat cohorts as of the run date."
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "stakeholder map"
      missingEvidence: "A verified fully diluted capitalization table, security classes, beneficial owners, option pool, pledges, secondaries, and investor control rights."
      whyItMatters: "Named financing participants do not establish current ownership, liquidation economics, or voting control."
      diligencePath: "Obtain the signed cap table, securities register, shareholder agreements, financing closing sets, and beneficial-ownership confirmations."
      relatedQuestionRefs: [QO003, QO004, QO005]
      relatedTableRefs: [TO003]
