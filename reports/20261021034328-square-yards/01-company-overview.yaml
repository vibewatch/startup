callouts:
  - calloutType: "risk"
    title: "Capital raised is not cash available"
    body: >-
      The $95 million June 2026 event mixes debt and equity, while public cumulative
      totals disagree materially. Underwriting needs instrument-level proceeds,
      repayments, covenants, and current cash before treating the round as runway.
    claimRefs: [CO012, CO014, CO015]
