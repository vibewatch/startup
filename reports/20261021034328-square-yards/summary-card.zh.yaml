  topStrengths:
    - 一体化平台覆盖房产交易、按揭、室内装修、租赁和物业管理。
    - 公司披露 FY26 收入达到 INR 2,086 crore，同比提升 48%。
    - 公司披露 FY26 调整后 EBITDA 达到 INR 176 crore，利润率为 8%。
    - Urban Money 带来可观的按揭分销规模和交叉销售潜力。
  topRisks:
    - 2026 年 6 月融资结构、债务契约、到期安排、优先权条款和现金到账均未披露。
    - 公开 KPI 存在不一致，且缺少经审计的合并财务报表，IPO 前披露的可信度因此下降。
    - 据报道，回头开发商关系贡献了 85% 的业务，但单个客户的集中度未知。
    - 监管、隐私、网络安全、诉讼和事件控制均未经过独立验证。
    - 各分部利润率、客户留存、集中度、获客成本和现金转化数据均不可得。
  unresolvedGaps:
    - 已签署的 2026 年 6 月融资文件、债务明细、契约、优先权分配瀑布和完全摊薄后的资本结构。
    - 经审计的合并及分部财务数据、现金余额、营运资金、现金转化和 KPI 对账。
    - 当前法定董事会、治理权利、关联方控制、管理层继任安排和经核实的股权结构表。
    - 按分部划分的客户队列、留存、集中度、客户访谈、获客成本和贡献利润率。
    - 实体层面的许可证、投诉、诉讼、安全认证、事件历史和恢复测试证据。
    - 已提交的发行文件、确定的 IPO 时间表以及新股发行与老股出售的安排。
