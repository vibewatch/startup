    title: Evidence-bounded competitive positioning map
    type: quadrant
    summary: >-
      Ordinal categories place evidenced operating models by service breadth and
      transaction intermediation without implying measured performance.
    data:
      xAxis:
        title: "Service breadth: 1 single-stage, 2 adjacent stages, 3 full lifecycle"
        min: 1
        max: 3
      yAxis:
        title: "Intermediation: 1 self-service/direct, 2 facilitation, 3 assisted transaction"
        min: 1
        max: 3
      points:
        - label: Square Yards
          x: 3
          y: 3
          detail: "Integrated discovery, brokerage, mortgage, post-sale, and management model"
        - label: Housing.com
          x: 1
          y: 1
          detail: "Assigned evidence establishes traffic competition only"
        - label: MagicBricks
          x: 1
          y: 1
          detail: "Assigned evidence establishes traffic competition only"
        - label: 99acres
          x: 1
          y: 1
          detail: "Assigned evidence establishes traffic competition only"
        - label: NoBroker
          x: 1
          y: 1
          detail: "Direct landlord-tenant model avoiding intermediary commissions"
        - label: Urban Money
          x: 1
          y: 2
          detail: "Adjacent mortgage-facilitation module within the Square Yards group"
    approximationNotes: >-
      Values are ordinal category codes derived from source-described business scope,
      not market-share, quality, or performance scores; coincident portal points are
      intentionally retained because the evidence does not support finer separation.
    claimRefs: [CP003, CP004, CP005, CP013]
callouts:
  - calloutType: strength
    title: Breadth is the clearest evidenced differentiator
    body: >-
      Square Yards combines transaction, financing, post-sale, and property-management
      capabilities in one group, creating more cross-sell surfaces than the traffic-only
      peer descriptions available in the assigned evidence.
    claimRefs: [CP001, CP002, CP013]
  - calloutType: risk
    title: Moat evidence stops short of customer lock-in
    body: >-
      No retained source provides comparable retention, exclusivity, realized pricing,
      or customer-outcome data, so integration should not be equated with proven
      switching costs or durable pricing power.
    claimRefs: [CP014, CP015, CP016]
