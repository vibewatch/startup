      - Square Yards
      - Housing.com
      - MagicBricks
      - 99acres
      - NoBroker
    rows:
      - ["Property discovery", "Supported", "Traffic competitor; detail unknown", "Traffic competitor; detail unknown", "Traffic competitor; detail unknown", "Direct transaction model described"]
      - ["Assisted brokerage / transaction", "Supported", "Unknown", "Unknown", "Unknown", "Model emphasizes avoiding intermediary commissions"]
      - ["Mortgage facilitation", "Urban Money; more than 150 bank and NBFC relationships reported", "Unknown", "Unknown", "Unknown", "Unknown"]
      - ["Rentals and property management", "Azuro supported", "Unknown", "Unknown", "Unknown", "Direct landlord-tenant transaction supported; management breadth unknown"]
      - ["Interiors / modular furnishing", "Interior Company supported", "Unknown", "Unknown", "Unknown", "Unknown"]
      - ["3D / AR / VR property experience", "PropVR supported", "Unknown", "Unknown", "Unknown", "Unknown"]
      - ["Broker / partner distribution", "Historical Square Connect network of more than 200,000 registered brokers", "Unknown", "Unknown", "Unknown", "Broker-disintermediation model"]
    notes: >-
      "Supported" means the capability appears in an assigned source, not that its
      performance is independently benchmarked; unknown cells must not be read as absent.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP009, CP010, CP011, CP016]
  - id: TP003
    title: Pricing and packaging evidence
    columns:
      - Model
      - Price / unit / contract evidence
      - Included capability evidence
      - Discount or realization evidence
      - Underwriting implication
    rows:
      - [Square Yards, "Not disclosed in assigned evidence", "Multiple lifecycle services are evidenced", "Not disclosed", "Request segment price cards, realized take rates, and attach rates"]
      - ["Housing.com / MagicBricks / 99acres", "Not disclosed in assigned evidence", "Traffic competition is evidenced; other scope is unknown", "Not disclosed", "Obtain consumer, broker, and developer packages on a common unit basis"]
      - [NoBroker, "Intermediary-commission avoidance is described; current fees are not disclosed", "Direct landlord-tenant transaction model is evidenced", "Not disclosed", "Compare total transaction cost rather than headline commission alone"]
      - ["Traditional broker / internal route", "Not quantified in assigned evidence", "Local or direct execution is plausible but unverified", "Not disclosed", "Commission surveys and buyer interviews are required"]
    notes: >-
      The assigned evidence contains no like-for-like current pricing; every price,
      discount, realized commission, and contract term is therefore recorded as a gap.
    claimRefs: [CP004, CP014, CP015]
figures:
