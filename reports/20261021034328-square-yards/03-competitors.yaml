      - [Housing.com, "Property marketplace / portal", "Owned by REA India; operating scale not disclosed in the assigned evidence", "Property search traffic", "Identified as a traffic competitor", "Capability breadth, pricing, and outcomes are unknown"]
      - [MagicBricks, "Property marketplace / portal", "Owned by Times Group; operating scale not disclosed in the assigned evidence", "Property search traffic", "Identified as a traffic competitor", "Capability breadth, pricing, and outcomes are unknown"]
      - [99acres, "Property marketplace / portal", "Owned by Info Edge; operating scale not disclosed in the assigned evidence", "Property search traffic", "Identified as a traffic competitor", "Capability breadth, pricing, and outcomes are unknown"]
      - [NoBroker, "Disintermediated transaction platform", "Described as India's first proptech unicorn in 2021", "Landlords and tenants seeking direct transactions", "Avoids intermediary commissions", "Current scale, pricing, and breadth are not established by the assigned evidence"]
      - ["Traditional broker, direct developer, or internal search", "Status quo / substitute", "Not quantified in the assigned evidence", "Buyers and sellers using offline or direct channels", "Potential local relationships or direct control", "Share, price, service quality, and outcomes require primary research"]
    notes: >-
      Public-source snapshot as of 2026-10-21; peer scale, pricing, and capability
      fields are marked unknown where the assigned evidence does not support a comparison.
    claimRefs: [CP001, CP003, CP004, CP007, CP008, CP012, CP015]
