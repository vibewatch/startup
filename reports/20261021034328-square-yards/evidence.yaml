evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current statutory board roster, committee mandates, investor consent rights, related-party controls, management
      succession plan, and material leadership changes.
    whyItMatters: Founder concentration and pre-IPO readiness cannot be assessed from public leadership profiles alone.
    diligencePath: >-
      Request the latest corporate registry extracts, board and committee charters, shareholder agreement, organization
      chart, and three years of board minutes.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: cumulative funding
    missingEvidence: >-
      An instrument-level schedule reconciling $228M across eight rounds with $96.9M across eleven rounds, including
      debt, equity, convertibles, repayments, and secondary sales.
    whyItMatters: Funding raised is not cash available, and unreconciled debt can materially change leverage, dilution, and runway.
    diligencePath: >-
      Reconcile bank statements, cap-table issuances, loan agreements, repayment records, and audited cash-flow
      statements for every financing.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: cover metrics
    missingEvidence: >-
      A current, consistently defined group headcount and customer count with entity, geography, period, and
      active-customer denominator.
    whyItMatters: >-
      Public headcount signals conflict, and a missing customer denominator prevents productivity, penetration, and
      unit-economics analysis.
    diligencePath: >-
      Request payroll and contractor rosters by legal entity plus CRM extracts defining active transacting customers and
      repeat cohorts as of the run date.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder map
    missingEvidence: >-
      A verified fully diluted capitalization table, security classes, beneficial owners, option pool, pledges,
      secondaries, and investor control rights.
    whyItMatters: Named financing participants do not establish current ownership, liquidation economics, or voting control.
    diligencePath: >-
      Obtain the signed cap table, securities register, shareholder agreements, financing closing sets, and
      beneficial-ownership confirmations.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-size-gap
    missingEvidence: Independent category spend for the defined service boundary, split by geography and segment.
    whyItMatters: Without a consistent spend denominator, TAM, SAM, SOM, and market share cannot be calculated defensibly.
    diligencePath: >-
      Obtain current analyst or industry datasets for brokerage fees, mortgage distribution, interiors, rentals, and
      property management, then reconcile overlaps.
    relatedQuestionRefs:
      - QM004
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Contract structures, fee payer, take rate, retention, acquisition cost, and margin by service segment.
    whyItMatters: >-
      The same throughput can produce materially different revenue quality and contribution margins depending on payer
      and take rate.
    diligencePath: >-
      Request segment P&Ls, cohort retention, acquisition-channel economics, and representative customer and partner
      contracts.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM006
      - QM008
    relatedTableRefs:
      - TM001
      - TM003
  - type: conflicting-data
    severity: minor
    topic: customer-definition
    missingEvidence: A reconciled definition of FY26 customers acquired, transactions, and cross-service attachment denominator.
    whyItMatters: >-
      Without denominator definitions, customer volume and the 55% attachment rate cannot be translated into conversion
      or retention.
    diligencePath: >-
      Reconcile management dashboards to audited segment reporting and define unique customers, transactions, and
      attachment cohorts.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Current price cards, realized commission and fee schedules, discounts, contract lengths, and service attach rates
      for Square Yards and named alternatives.
    whyItMatters: >-
      Without common-unit pricing, the analysis cannot test customer savings, price elasticity, or durable pricing
      power.
    diligencePath: >-
      Request anonymized contracts and invoices, then run mystery-shopping calls with Square Yards, portal, NoBroker,
      and traditional-broker channels.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Comparable current revenue, transaction volume, traffic quality, active customer, and geographic coverage metrics
      for Housing.com, MagicBricks, 99acres, and NoBroker.
    whyItMatters: Square Yards' disclosed scale cannot be ranked against peers without aligned periods and denominators.
    diligencePath: >-
      Collect parent-company filings, audited disclosures, traffic datasets, and management interviews using a single
      fiscal-period definition.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: moat-evidence-gap
    missingEvidence: >-
      Cohort retention, cross-service attach, exclusivity, multi-homing, repeat transaction, churn, and customer
      acquisition data.
    whyItMatters: Service breadth alone does not demonstrate switching costs, customer lock-in, or defensible cross-sell economics.
    diligencePath: >-
      Review anonymized cohorts by acquisition channel and service line, including customers who use competing portals
      concurrently.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: missing-source
    severity: material
    topic: trust-and-regulatory
    missingEvidence: >-
      Comparable complaint rates, resolution times, security attestations, regulatory findings, litigation outcomes, and
      customer trust surveys.
    whyItMatters: >-
      The reviewed sources cannot establish a trust or regulatory advantage, and absence of a reported incident is not
      proof of absence.
    diligencePath: >-
      Search regulator and court records, obtain security documentation, and sample verified customer complaints for
      every named platform.
    relatedQuestionRefs:
      - QP009
  - type: enumeration-incomplete
    severity: minor
    topic: status-quo-substitutes
    missingEvidence: >-
      Quantified use, pricing, and outcomes for traditional brokers, direct developer sales, informal referrals, and
      internal buyer research.
    whyItMatters: Digital competitors may not represent the buyer's most common or lowest-cost alternative.
    diligencePath: >-
      Interview buyers, developers, and brokers across priority cities and quantify channel shares on a consistent
      transaction basis.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-model
    missingEvidence: Current segment revenue mix, realized pricing, take rates, discounts, retention, and customer concentration.
    whyItMatters: >-
      These inputs determine whether growth is diversified, recurring, and durable rather than transaction-volume
      dependent.
    diligencePath: >-
      Obtain audited segment schedules, pricing policies, contract samples, and monthly revenue cohorts for FY25 through
      the latest month.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      CAC, conversion, cancellations, sales cycle, payback, gross margin, working capital, capex, and service-delivery
      costs by stream.
    whyItMatters: Group EBITDA does not show which businesses create or consume contribution profit and growth capital.
    diligencePath: >-
      Review management accounts, cohort economics, channel-level sales data, segment cost allocations, and
      working-capital schedules.
    relatedQuestionRefs:
      - QI004
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Unrestricted cash, monthly burn, debt-equity split, interest cost, covenants, security, maturities, and planned
      uses of funds.
    whyItMatters: >-
      Funding raised does not establish cash available or runway, and debt service could constrain expansion or IPO
      timing.
    diligencePath: >-
      Obtain bank statements, a 24-month cash forecast, financing agreements, covenant calculations, and a
      board-approved uses-of-funds plan.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
