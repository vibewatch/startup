      - number: '7.4'
        title: 依赖、缓释措施与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              可量化程度最高的依赖是：据报道，85%
              的业务来自回头合作的开发商伙伴；最大的单项敞口和合同条款仍未知。抵押贷款规模增加了对贷款方、征信机构和金融机构的依赖，大量代理支持的销售模式也提高了流程质量和监督要求。当前的缓释主张仍有方向性：整合工具、跨服务多元化和
              55% 的附加率可能深化客户变现，但也增加跨产品的运营耦合。如果失去重要开发商或贷款方关系、受到重大监管限制、发生重大数据或支付事件、无法使经审计申报与宣传 KPI 对账，或正向调整后 EBITDA
              持续反转，就应触发投资论点破坏。要设定数值阈值，还需要合同层面的集中度和契约数据。
            claimRefs:
              - CR004
              - CR005
              - CR012
              - CR015
              - CR016
