      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              保留的证据不足以支持对这一整合边界作出可信的自上而下 TAM、SAM 或 SOM 测算。现有证据提供了四个不能互换的公司规模视角：FY26 收入 INR 2,086 crore、获客 273,643
              人、促成交易的房屋价值 INR 13,236 crore，以及发放贷款 INR 87,831
              crore。收入是会计产出；房产和抵押贷款数字是促成的本金或交易价值；客户数则是数量指标。没有品类支出和分母证据，不能把这些数字相加，也不能据此换算市场份额。地域结构提供了最清晰的可服务市场约束：印度贡献
              FY26 收入的 88%，国际市场贡献 12%，且印度增长快于合并业务。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM015
              - CM016
