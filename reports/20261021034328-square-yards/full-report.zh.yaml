            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM015
              - CM016
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              需求体系是多边的。购房者和房产所有者使用消费者服务；开发商、贷款方和代理使用或参与企业工作流；来源并未持续披露每项费用由哪一方支付、每项软件预算由谁掌握。抵押贷款分销尤其依赖合作伙伴：Fortune India
              报道，Urban Money FY26 的放款背后有逾 150 家银行和非银行合作伙伴。因此，采用路径不是一次性软件采购，而是从获客开始，经过交易和融资工作流，并可能延伸至室内设计、租赁或管理。报道中的 55%
              附加率表明客户在跨服务采用，但来源没有定义分母，也没有提供分部经济性。
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              纸张密集型房产工作流的数字化、已报道的大量交易和贷款流量，以及在核心交易后附加相邻服务的机会，都支持采用。Square Yards
              报告称印度增长快于合并业务，并已在房屋设计与管理业务上形成可观活动，这说明相邻业务已经在运营，而不只是宣布。约束同样重要：工作流横跨受监管贷款方、身份和支付流程、开发商、代理和消费者，提高了协调、信任和执行要求。EAAA
              Alternatives
              将行业描述为高度分散，这既可能带来整合空间，也意味着本地运营成本高昂。在缺乏独立品类支出、费用抽成率、留存、获客成本和分部利润率的情况下，估值应依赖已证明的收入和盈利能力，而不是宽泛的市场规模倍数。
            claimRefs:
              - CM007
              - CM009
              - CM010
