              - CO016
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 募集资金不等于可用现金
            body: 2026 年 6 月的 9,500 万美元融资混合了债务和股权，而公开披露的累计融资总额存在重大差异。在把这轮融资当作现金跑道之前，需要取得逐项工具的资金到账、偿还、契约和当前现金余额。
            calloutType: risk
            claimRefs:
              - CO012
              - CO014
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场小于整个房地产市场，但大于线上房源门户。Square Yards
              描述了一条覆盖搜索与发现、房产交易、抵押贷款、家居装饰、租赁和物业管理的端到端消费者旅程，同时也为开发商、金融机构和代理提供面向企业的工作流。因此，纳入的支出应是促成这些服务所获得的费用或收入，而不是房屋本身的价值，也不是流经平台的贷款本金。线下经纪人、开发商直销团队、银行主导的抵押贷款流程，以及独立的室内设计或物业管理供应商，都是现状替代方案。公司业务覆盖印度、阿联酋、澳大利亚和加拿大，但从运营上看，市场边界仍由印度主导，并非统一的全球品类。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
