      - number: '3.2'
        title: 能力广度、分销与合作伙伴获取
        blocks:
          - type: paragraph
            body: >-
              Square Yards 最有证据支持的差异化在于广度。其组合将核心交易平台与 Urban Money、Azuro、Interior Company、PropVR 以及面向经纪人的分销结合起来。Urban
              Money 已报道的 FY26 促成规模以及与逾 150 家银行和 NBFC 的关系，显示其能有效接触抵押贷款供给；历史上的 Square Connect
              经纪人数则说明其渠道层不止于消费者流量。广度可以改善交叉销售和数据复用，但也带来执行依赖：融资依赖贷款方，交易依赖开发商和代理，多个运营业务之间还必须保持一致的服务质量。已审阅证据证明了范围和触达，却没有证明独家供给或更优客户结果。
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP009
              - CP010
              - CP011
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
