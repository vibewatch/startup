      - number: '3.3'
        title: 定价、转换成本与信任姿态
        blocks:
          - type: paragraph
            body: >-
              来源集合没有提供 Square Yards
              及其替代方案的可比挂牌价格、实际佣金、订阅费、合同条款、折扣或客户总成本，也没有披露客户群留存、排他性、复购、获客成本、投诉率，或经独立基准比较的信任与监管结果。因此，证据无法证明用户是只在一个平台找房、在多个门户之间交叉使用，还是在数字渠道与传统渠道之间切换。这些字段缺失并不代表业绩弱或存在不当行为，而是比较边界。要评估锁定效应或信任优势，还需要采购级价格表、渠道协议、客户群数据和投诉解决数据。
            claimRefs:
              - CP003
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP014
              - CP015
      - number: '3.4'
        title: 差异化持久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              整合式技术栈可能构成护城河，因为它能在一个集团内连接发现、有人协助的交易、融资、售后服务和物业管理。公开运营规模和改善的盈利能力表明模型已达到一定规模，但不能证明其广度难以复制。门户竞争者拥有大型母公司支持，NoBroker
              提供结构上不同的佣金方案，专业贷款方或服务商也能在单个环节竞争。PropVR
              的收购还表明，能力可以通过购买获得，而不必有机开发。因此，投资结论仍是有条件的：整合今天确实形成差异化，但持久定价权、留存、独家供给和交叉销售经济性仍未得到验证。
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP010
              - CP012
              - CP013
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 广度是证据最清晰的差异化
