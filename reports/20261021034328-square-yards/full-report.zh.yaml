      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: IPO 前需要对账披露控制
            body: 官方 FY26 页面在标题口径中将毛利列为 INR 476 crore，但详细表格列为 INR 48 crore。在作出任何估值决定前，应由经审计报表和 KPI 定义主导投资模型。
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
          - type: callout
            title: 以一手尽调作为投资批准门槛
            body: 在把公开增长叙事视为已降风险之前，应要求提供许可证、诉讼和投诉清单、安全鉴证、事件历史、贷款方和开发商集中度、融资契约以及经审计的分部现金转化。
            calloutType: recommendation
            claimRefs:
              - CR004
