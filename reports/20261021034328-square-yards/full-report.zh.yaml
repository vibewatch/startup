  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代模式
        blocks:
          - type: paragraph
            body: >-
              证据支持三种不同的竞争模式，而不是一个同质化的可比公司集合。Square Yards 展示的是覆盖房产发现、交易、抵押贷款、租赁、物业管理、室内设计和售后服务的有人协助式全生命周期模式。Online
              Marketplaces 将 Housing.com、MagicBricks 和 99acres 列为市场流量竞争者；另一份行业资料则称 NoBroker
              通过房东与租户直接交易取消经纪佣金。这些替代方案处在不同环节，采用不同的中介模式。传统经纪人、开发商直销和买方自行研究仍是合理的现状替代方案，但指定来源池没有量化它们的份额、价格或服务质量，因此将其视为尽调缺口，而不是打分竞争者。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP013
              - CP015
