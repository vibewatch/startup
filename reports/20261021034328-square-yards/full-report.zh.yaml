            title: 不要把流量吞吐量资本化为收入
            body: INR 87,831 crore 的贷款数字和 INR 13,236 crore 的房产数字，是促成的本金或交易价值，不是 Square Yards 的收入，也不是独立测量的可寻址市场支出。
            calloutType: risk
            claimRefs:
              - CM006
