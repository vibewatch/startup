  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模扩大和利润率提升强化了经营论点，但融资透明度不足、价格可比性弱，判断因此止步于继续研究。
    data:
      nodes:
        - id: integrated-model
          label: 一体化模式
          value: Transactions through post-sale services
          detail: 多项服务带来交叉销售潜力，但仍需要分部经济数据。
        - id: revenue-scale
          label: FY26 规模
          value: INR 2,086 Cr revenue
          detail: 据报告，收入同比增长 48%。
        - id: operating-leverage
          label: 经营杠杆
          value: 8% adjusted EBITDA margin
          detail: 据报告，调整后 EBITDA 达到 INR 176 Cr。
        - id: financing-structure
          label: 融资结构
          value: $95M mixed debt-equity
          detail: 确切的债务股权比例和优先级尚未披露。
        - id: price-test
          label: 价格测试
          value: 4.5x reported revenue
          detail: $1B 估值标记缺乏足够的公开可比基准。
        - id: recommendation
          label: 建议
          value: Research more / track
          detail: 应要求提供经审计的分部经济数据、股权结构权利、债务条款和 IPO 申报文件。
    approximationNotes: 仅展示逻辑顺序；节点宽度不代表概率、估值或相对重要性。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
