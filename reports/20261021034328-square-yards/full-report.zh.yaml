  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资框架
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究并跟踪，信心中等，投资判断风险高。对一家私营房地产科技平台而言，积极情景的可见度异常高：Square Yards 覆盖房产交易、抵押贷款、室内设计、租赁和物业管理；据报道 FY26 收入增长 48%
              至 INR 2,086 crore，调整后 EBITDA 达到 INR 176 crore，利润率为 8%。反方论点在于价格和结构，而不是产品广度。最新融资据报道混合了债务和股权，估值超过 10
              亿美元，但拆分和投资人保护条款没有披露。因此，投资人应把公司质量与证券层面的吸引力分开。应等待资本结构表、债务条款、清算优先权、经审计报表和内部一致的 IPO
              方案；没有这些资料，就无法根据公开证据判断下行保护或稀释。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月的证据大体收敛于一笔约 9,500 万美元的债务与股权混合融资，投后估值超过 10 亿美元。Multiples 将 2.23 亿美元收入与 10 亿美元估值并列，隐含收入倍数为 4.5
              倍。这是有用的交易标记，但不是公允价值证明：公开记录没有披露债股分配、优先级、票息、契约、清算优先权或完全稀释后的持股。融资总额也存在冲突：Inc42 显示超过 2.0882 亿美元，Multiples
              则显示八轮合计 2.28 亿美元。2025 年 11 月据报道 9 亿美元的投前估值可作为有方向意义的先前标记，但不同证券组合的连续轮次不能视为同类普通股价格。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: 情景与可比纪律
        blocks:
          - type: paragraph
            body: >-
              如果管理层维持 FY27 不低于 40% 的增长目标，并把 EBITDA 利润率推入两位数，当前运营基础可以支持上行空间。收入集中度同样重要：Business Standard 报道 Urban Money 贡献
              FY26 收入的一半以上，房地产交易约占 40%，室内设计及其他数字产品约占 10%。由于贷款分销、经纪和服务的利润率及风险特征不同，这种组合使单一门户公司倍数产生误导。现有可比公司集合覆盖约 1.2 倍至
              11.2 倍收入，业务和地域差异很大。因此，下方情景区间是套用在已报道 FY26 收入上的透明分析案例，不是实际报价、预测或目标价格。在收窄区间之前，还需要经审计的分部经济性和真正可比的同业集合。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏
        blocks:
          - type: paragraph
            body: >-
              退出证据并不一致。Online Marketplaces 报道首席执行官希望在 2026 年以至少 $1.5b 估值推动公司上市；而 Business Standard 随后的采访称 IPO
              仍在计划中，但没有公布时间表。这一分歧不能证明延期，却使投资判断无法基于一个有日期的流动性事件。若已提交的发行文件确认经审计的分部盈利能力、现金转化、债务到期、优先权条款以及可信的公开发行与老股出售组合，投资论点会改善。如果增长显著低于管理层
              40%+ 的目标、EBITDA 利润率从 8% 回落、融资增加优先级债权但没有相应现金创造，或 IPO 要求低于 6
              月轮次的估值，投资论点就会破坏。在这些测试可观察之前，应跟踪执行并就证券条款谈判，而不是依赖独角兽身份。
            claimRefs:
              - CV003
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 投资判断应针对证券，而不是独角兽标签
            body: 6 月估值标记足以为谈判提供框架，但还不足以确定普通股价值。作出决定需要债股分配、完全稀释后的资本结构、优先股堆叠、契约方案以及经审计的分部现金创造。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
