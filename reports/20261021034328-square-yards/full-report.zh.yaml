  - id: TV003
    title: 看涨、基准和看跌估值情景
    columns:
      - 情景
      - 明确假设
      - 示意估值区间
      - 概率信号
      - 下行或确认触发条件
    rows:
      - - 看涨
        - FY27 增长至少为 40%，EBITDA 利润率达到双位数，且 IPO 条款对普通股友好
        - $1.34B-$1.78B（FY26 收入的 6.0x-8.0x）
        - 需要强力确认
        - 已提交的发行文件确认杠杆干净、现金转化良好且分部利润率持久
      - - 基准
        - 增长放缓但仍然强劲，利润率维持在 FY26 附近或更高，且没有出现惩罚性优先权负担
        - $0.89B-$1.12B（FY26 收入的 4.0x-5.0x）
        - 最接近已报告的 4.5x 标记
        - 经审计的结果核对收入、EBITDA、债务和完全摊薄后的持股比例
      - - 看跌
        - 增长大幅放缓、利润率收缩，或高级融资在退出前吸收股权价值
        - $0.45B-$0.67B（FY26 收入的 2.0x-3.0x）
        - 在融资披露前仍属重大风险
        - 未达到增长指引、利润率反转、契约压力，或下轮融资 / 折价 IPO
    notes: 分析师示意情景以已报告的 $223M FY26 收入乘以情景倍数；倍数取自来源中的宽泛可比区间 1.2x-11.2x，并非已观察到的报价、概率或目标价格。
