            title: 用自下而上的尽调桥接
            body: 在把运营覆盖范围换算为市场份额或估值增长假设之前，应索取分部收入、抽成率、交易数量、复购行为、获客成本和按地域划分的利润率。
            calloutType: recommendation
            claimRefs:
