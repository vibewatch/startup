    columns:
      - 立场
      - 论点
      - 当前证据
      - 哪些变化会改变判断
    rows:
      - - 正论
        - 一体化分销可以覆盖漫长住房旅程并进行交叉销售
        - 平台覆盖交易、按揭、室内装修、租赁和管理
        - 经审计的附加购买率、留存率和贡献利润率数据会增强这一主张
      - - 正论
        - 经营杠杆正在显现
        - FY26 调整后 EBITDA 为 INR 176 Cr，利润率为 8%，FY25 为 3%
        - 若双位数利润率能够持续并实现现金转化，将支持更高质量的倍数
      - - 反论
        - 融资结构可能把价值从普通股转走
        - 6 月轮次混合了债务和股权，确切比例未披露
        - 完整条款清单、债务明细、契约和清算瀑布将消除这一风险
      - - 反论
        - 流动性时点尚未确定
        - 至少 $1.5B 的公开流通规模目标，与后来“尚未公布 IPO 时间表”的表述并存
        - 已提交的发行文件和确定的时间表，才能让退出时点足以纳入投资判断
    notes: 这些论点把已报告的经营事实与尚未解决的融资、退出假设分开；目前没有非公开条款清单或发行文件。
