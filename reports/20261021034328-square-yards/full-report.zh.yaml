          x: 1
          'y': 1
          detail: 直接连接房东和租客，避免中介佣金
        - label: Urban Money
          x: 1
          'y': 2
          detail: Square Yards 集团内相邻的按揭协助模块
    approximationNotes: 数值是根据来源描述的业务范围得出的序数类别代码，不是市场份额、质量或业绩评分；门户点位重合是有意保留的，因为现有证据不足以进一步区分。
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP013
  - id: FI001
    title: 收入模式桥接与成本可见性缺口
    type: flow
    summary: 客户活动可以导向多条变现路径，但公开证据不足以量化活动如何转化为分部毛利。
    data:
      nodes:
        - id: discovery
          label: 搜索与发现
          detail: 客户需求从房产搜索和决策工具进入。
        - id: transaction
          label: 房产交易
          detail: 经纪活动可以产生交易佣金。
        - id: mortgage
          label: 按揭协助
          detail: Urban Money 将借款人与贷款合作伙伴连接起来；放款量不等于收入。
        - id: services
          label: 室内装修、租赁和管理
          detail: 增值服务可能产生项目费、服务费或管理费。
        - id: monetization
          label: 佣金与订阅收入
          detail: 分析师证据识别出佣金和订阅模式，但当前抽成率尚不明确。
        - id: profit
          label: 毛利与 EBITDA
          detail: 据报告，FY26 集团 EBITDA 已披露，但分部成本和毛利转化率尚未披露。
      edges:
        - from: discovery
          to: transaction
          label: 客户转化
        - from: transaction
          to: mortgage
          label: 可选融资
        - from: transaction
          to: services
          label: 可选交叉销售
        - from: transaction
          to: monetization
          label: 佣金
        - from: mortgage
          to: monetization
          label: 协助服务经济性
        - from: services
          to: monetization
          label: 服务费或订阅费
        - from: monetization
          to: profit
          label: 成本未公开分配
    approximationNotes: 该流程是定性的，且不按比例绘制；不表示每位客户都会使用每项服务，也不表示贷款发放等于收入。
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI014
  - id: FE001
    title: 受证据约束的产品架构
    type: stack
    summary: 公开证据支持一套面向客户和运营的一体化层级，但不足以证明底层基础设施拓扑或生产环境控制设计。
    data:
      layers:
        - label: 发现与研究
          detail: 房源、搜索、研究工具和市场背景
          items:
            - 房源供给
            - 搜索与比较
            - 研究信号
        - label: AI 辅助互动
          detail: 初次互动、线索筛选和需求收集
          items:
            - AI 首次接触
            - 线索筛选
            - 人工交接
        - label: 可视化与决策支持
          detail: 虚拟参观以及项目或房源可视化
          items:
            - PropVR
            - 3D 漫游
            - 远程看房
        - label: 交易编排
          detail: 房源预留、付款、签名和售后处理
          items:
            - 锁定房源
            - 电子付款
            - 电子签名
        - label: 融资
          detail: 依托 Urban Money 完成按揭核验和履约
          items:
            - 征信机构
            - 身份与收入核查
            - 贷款方工作流
        - label: 购后服务
          detail: 室内装修、租赁、物业管理和资产智能
          items:
            - Interior Company
            - Azuro
            - PropsAMC
    approximationNotes: 层级顺序反映公开描述的客户旅程；不表示存在经过验证的软件拓扑、共享数据模型、延迟路径或部署边界。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE009
      - CE014
      - CE016
  - id: FU001
    title: 人工协助的客户旅程与扩张面
    type: journey-map
    summary: 这条旅程把数字获客连接到人工协助成交和相邻服务，但留存率及客户层面的转化率仍未披露。
    data:
      nodes:
        - id: discovery
          label: 搜索与发现
          detail: 房产研究、比较和沉浸式看房吸引买家和投资者。
          touchpoints:
            - Web portal
            - 3D / VR views
            - Market data
        - id: qualification
          label: AI 线索筛选
          detail: 自动语音互动收集需求并识别高意向线索。
          touchpoints:
            - SuperAgent Pro
            - 200,000 daily calls
            - 12+ Indian languages
        - id: advisory
          label: 人工顾问
          detail: 合格线索转交关系经理，由其支持实地看房和成交。
          touchpoints:
            - Relationship manager
            - Site visit
            - Negotiation
        - id: transaction
          label: 房产交易
          detail: 房源、付款、文件和签名支持交易执行。
          touchpoints:
            - Inventory blocking
            - Payment gateway
            - Digital signature
        - id: mortgage
          label: 按揭协助
          detail: Urban Money 支持贷款方匹配、申请、文件处理和放款。
          touchpoints:
            - Loan application
            - Document automation
            - Lender network
        - id: expansion
          label: 相邻及复购服务
          detail: 室内装修、租赁、物业管理和开发商关系共同打开扩张路径。
          touchpoints:
            - Interior Company
            - Azuro
            - Repeat developer business
    approximationNotes: 这是按已记录服务面整理的有序综合，不表示转化率、阶段量或共享客户群体。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU014
  - id: FR001
    title: 剩余风险热力图
