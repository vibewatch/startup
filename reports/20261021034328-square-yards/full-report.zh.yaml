chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与整合模式
        blocks:
          - type: paragraph
            body: >-
              Square Yards 成立于 2014 年，总部位于印度
              Gurugram。它的业务主张不只是房源列表市场：公司及第三方资料描述了一条覆盖搜索与发现、房产交易、抵押贷款、室内设计、租赁、物业管理和售后服务的全栈旅程。官网目前仍展示房产发现和市场洞察页面，公司资料则介绍了融资、室内设计、租赁及沉浸式房产可视化等独立运营品牌。覆盖面扩大了变现入口，但也意味着不能把集团业绩当作单一的纯软件或市场平台模型来评估。公司声称覆盖九个国家、逾
              100 座城市；这属于有方向性的证据，并非经独立审计的地点数量。包括经核实客户数在内、缺乏支持的封面指标被明确留空，没有沿用早期报告的数据。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.2'
        title: 创始人领导与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开记录持续将该业务与创始人 Tanuj Shori 和 Kanika Gupta Shori 联系在一起。Tracxn 认定 Tanuj Shori 为现任首席执行官，Business Standard 则认定
              Vivek Agarwal 为联合创始人兼首席技术官。可见的领导团队覆盖了总经理职责和技术职责，CTO
              的公开表态也显示其继续负责产品、人工智能和增长战略。但同一批来源没有可靠、最新的董事会委员会、投资人同意权、继任梯队或每位创始人当前运营职责的说明。因此，创始人领导既是利益一致性的信号，也是关键人物依赖。IPO
              前尽调应核实法定董事会、保留事项、关联方控制和管理层继任安排，而不能把目录资料当作治理审计。
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: 融资、规模与分母纪律
        blocks:
          - type: paragraph
            body: >-
              Business Standard 报道 FY26 收入为 INR 2,086 crore，同比上涨 48%；EBITDA 约为 INR 176 crore，是上年水平的三点七倍。报道还称 Urban Money
              贡献了逾一半收入，房地产交易服务约占 40%，室内设计及其他数字产品约占 10%。这些数字表明，融资分销如今已成为集团核心，而不只是经纪业务。最新资本事件的证据更充分：独立来源描述了 2026 年 6 月一笔
              $95m 的债务与股权混合融资，估值约 $1b。但累计融资额并未同样确定。Multiples 报道八轮融资合计 $228m，Tracxn 则报道十一轮合计
              $96.9m。差异可能来自对债务和历史轮次的不同处理，但可得记录没有披露具体原因。已募集资金不得视为可用现金，债务部分还需单独核查契约和到期安排。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: 里程碑与当前阶段
        blocks:
          - type: paragraph
            body: >-
              公开时间线显示，这是一家长期建设中的私营公司，而非最近突然爆发：2014 年成立，随后完成多轮股权及成长融资，2025 年 11 月完成 3,500 万美元融资，并在 2026 年 6
              月完成伴随独角兽地位而来的更大规模混合融资。FY26 收入和 EBITDA 证明公司在该估值时已具备一定运营规模，但二者都不能证明扣除利息、营运资本或债务偿付后的现金创造能力。管理层于 2026 年 7 月向
              Business Standard 表示，IPO 仍在计划中，但尚无已公布时间表。因此，Square Yards 应被视为一家私营、IPO 前公司，而不是几乎确定会上市的候选标的。在赋予 IPO
              流动性价值之前，下一步投资工作应是核对融资文件、经审计的集团账目、法律实体和治理准备度。
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO011
              - CO012
              - CO013
              - CO016
