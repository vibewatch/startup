company:
  name: Square Yards
chapter:
  number: 7
  title: Risks
  summary: >-
    Square Yards' strongest public risk signals are dependency on returning developer
    relationships, a broad set of regulated and data-sensitive transaction workflows,
    and disclosure controls that are not yet public-company grade. Reported FY26 scale
    and profitability improve resilience, but public evidence does not establish license
    coverage, cyber assurance, financing terms, litigation status, or counterparty
    concentration.
sections:
  - id: risk-ranking
    title: Risk ranking and investment implication
    body: >-
      The highest residual exposure is execution across an unusually broad transaction
      stack rather than one documented adverse event. Square Yards reports FY26 revenue
      of INR 2,086 crore and adjusted EBITDA of INR 176 crore, but its own page contains
      an internally inconsistent gross-profit table entry, while an Inc42 snapshot still
      labels the company "Yet To File" for an IPO. The operating model also depends on
      returning developer partners for a reported 85% of business. These signals make
      developer concentration, regulated-workflow controls, and disclosure readiness the
      first diligence priorities. The matrix is a qualitative evidence-based ranking,
      not a probability model; likelihood remains unquantified where the public record
      lacks incidents, contracts, or regulator findings.
    claimRefs: [CR002, CR004, CR008, CR009, CR013, CR014, CR015]
    figureRefs: [FR001]
  - id: regulatory-legal-and-data
    title: Regulatory, legal, privacy, and transaction-control exposure
    body: >-
      The platform spans property transactions, loan facilitation, KYC-related data,
      payment gateways, digital signatures, and credit-bureau or banking integrations.
      That breadth creates multiple control surfaces across jurisdictions, even though
      the reviewed sources do not identify a specific enforcement action or breach.
      Company material says buyer information, KYC data, and signatures use file
      encryption, but it does not name a certification, independent audit, incident
      history, license inventory, or privacy-control test. The proper conclusion is
      therefore not that incidents are absent; it is that public evidence cannot verify
      the control environment. Investment approval should require jurisdiction-level
      licenses, complaints and litigation schedules, security attestations, and an
      incident register.
    claimRefs: [CR001, CR005, CR006, CR007, CR016]
    tableRefs: [TR001]
  - id: operational-financial-and-reporting
    title: Operational, financial, and reporting execution
    body: >-
      Reported growth and positive adjusted EBITDA provide operating cushion, but they
      do not remove execution risk. India contributes 88% of reported revenue, while the
      business coordinates property sales, mortgages, interiors, rentals, management,
      and digital products. Public workforce indicators also conflict: Inc42 lists
      9,624 employees while LinkedIn uses a 1,001-5,000 company-size band. That may reflect
      timing, contractors, or different counting methods, but the denominator is not
      disclosed. The FY26 page's gross-profit headline and table are likewise inconsistent.
      Before relying on margins or operating leverage, diligence should reconcile audited
      statements to management KPIs, define employee and agent populations, and test
      segment-level cash conversion rather than treating adjusted EBITDA as cash generation.
    claimRefs: [CR002, CR003, CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR002]
  - id: dependency-mitigation-and-kill-criteria
    title: Dependencies, mitigations, and thesis-break triggers
    body: >-
      The most measurable dependency is the reported 85% share of business from returning
      developer partners; the largest individual exposures and contract terms remain
      unknown. Mortgage scale adds reliance on lenders, credit bureaus, and financial
      institutions, while a large agent-supported sales model raises process-quality and
      supervision demands. Mitigation claims are presently directional: integrated tools,
      diversification across services, and a 55% attachment rate may deepen customer
      monetization, but they also increase cross-product operational coupling. A thesis
      break should be triggered by loss of a major developer or lender relationship,
      material regulatory restriction, a significant data or payment incident, failure
      to reconcile audited filings with advertised KPIs, or sustained reversal of positive
      adjusted EBITDA. Contract-level concentration and covenant data are required to set
      numerical thresholds.
    claimRefs: [CR004, CR005, CR012, CR015, CR016]
    tableRefs: [TR003]
