callouts:
  - calloutType: risk
    title: Disclosure controls need pre-IPO reconciliation
    body: >-
      The official FY26 page presents gross profit as INR 476 crore in its headline but
      INR 48 crore in the detailed table. Audited statements and KPI definitions should
      control the investment model before any valuation decision.
    claimRefs: [CR013, CR014]
  - calloutType: recommendation
    title: Gate investment approval on primary diligence
    body: >-
      Require licenses, litigation and complaints schedules, security attestations,
      incident history, lender and developer concentration, financing covenants, and
      audited segment cash conversion before treating the public growth narrative as de-risked.
    claimRefs: [CR004, CR005, CR007, CR009, CR015, CR016]
