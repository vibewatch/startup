schemaVersion: "report-v2"
artifact: product-tech
slug: square-yards
runDate: 2026-10-21
company:
  name: Square Yards
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Square Yards presents an integrated property journey spanning discovery, transactions,
    mortgages, interiors, rentals, and property management, with AI now handling early lead
    qualification before human handoff. Public evidence is strong on workflow breadth but weak
    on production reliability, security certifications, technical architecture, and independently
    measured product outcomes.
sections:
  - id: product-surface
    title: Product surface and user workflow
    body: >-
      Square Yards is not a single listings product: its current public surfaces describe a
      connected journey from property search and transaction support through mortgages, home
      furnishing, rentals, and property management. FY26 reporting indicates that this breadth is
      economically uneven, with Urban Money and real-estate transaction services accounting for
      most revenue while interiors and other digital products remain smaller. The portfolio has
      also been assembled partly through acquisitions, including PropVR for immersive property
      experiences and PropsAMC and Azuro for data, asset-management, and rental workflows. This
      breadth can reduce handoffs for customers, but it also creates a larger integration and
      service-quality surface than a focused marketplace.
    claimRefs: [CE001, CE002, CE008, CE009, CE010, CE011, CE013]
    tableRefs: [TE001]
  - id: transaction-and-ai-workflow
    title: Transaction workflow and AI assistance
    body: >-
      Company materials describe a digital transaction path that combines e-payments and
      e-signatures with mortgage fulfilment through credit-bureau, identity, address, and income
      checks. PropVR adds virtual tours and digital transaction tooling, while developer and
      brokerage modules are described as pre-built workflows, dashboards, and mobile apps. The
      most current independent reporting adds a clearer operating detail: AI handles the first
      customer interaction, qualification, and requirements gathering before a relationship
      manager takes over. This is an assistive-sales architecture rather than evidence of an
      autonomous property transaction system, and no public latency, conversion, accuracy, or
      exception-handling benchmark was found in the assigned evidence.
    claimRefs: [CE004, CE005, CE006, CE007, CE009, CE014]
    tableRefs: [TE002]
  - id: architecture-and-differentiation
    title: Architecture and differentiation
    body: >-
      The defensible thesis is the orchestration of data, transaction, financing, visualization,
      and post-sale services rather than a disclosed proprietary software stack. Historical
      company material points to research tools, transaction data, PropsAMC data assets, a broker
      network, immersive visualization, and twelve patent filings. These signals suggest accumulated
      workflow know-how and cross-product data, but they do not establish granted patents, exclusive
      datasets, model quality, or switching costs. The 2025 information memorandum also labelled
      digital products and home renovation as investment-phase segments, which argues against
      treating every module as equally mature. Technical diligence should therefore test integration
      depth and usage by module rather than accept the full-stack label as proof of a unified platform.
    claimRefs: [CE003, CE010, CE011, CE012, CE013, CE014, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-reliability-and-roadmap
    title: Trust, reliability, and roadmap gaps
    body: >-
      The public trust case is materially behind the breadth of the product claim. An official
      profile says buyer information, KYC data, and digital signatures use file encryption, but the
      assigned evidence does not name a security certification, privacy-control framework,
      penetration-test cadence, uptime objective, disaster-recovery target, or public incident
      process. Likewise, current reporting says AI has accelerated product development and improved
      technology and marketing productivity, yet provides no measured baseline. The available
      practitioner-community proxy mentions an AI and broker operating-system category but contains
      no Square Yards implementation evidence. Investment diligence should treat security,
      reliability, integration quality, and developer adoption as private-evidence questions until
      control reports, architecture documentation, service metrics, and customer references are
      produced.
    claimRefs: [CE006, CE007, CE015, CE016]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or product line
      - Primary user
      - Publicly evidenced status
      - Differentiation thesis
      - Diligence gap
    rows:
      - [Property discovery and brokerage, "Homebuyers, sellers, developers", "Operating service; current profiles cover search through transactions", "Integrated research and assisted transaction path", "Active users, conversion, data freshness, and listing verification"]
      - [Urban Money mortgage services, "Borrowers, lenders, relationship managers", "Operating and reported as the largest FY26 revenue contributor", "Mortgage workflow connected to property demand and verification inputs", "Approval rate, lender concentration, turnaround time, and unit economics"]
      - [Interior Company and home renovation, "Homeowners and design teams", "Operating, but grouped with smaller digital services in FY26 reporting", "Post-purchase cross-sell and visualization-assisted design", "Project completion, rework, gross margin, and customer satisfaction"]
      - [Azuro and PropsAMC, "Owners, tenants, asset managers, valuers", "Acquired operating capabilities described in company and analyst profiles", "Rental operations plus transaction and asset data", "Current product boundaries, retained users, data rights, and integration depth"]
      - [PropVR, "Homebuyers, agents, and developers", "Acquired product with company-described virtual tours and transaction tooling", "Immersive visualization linked to the sales workflow", "Usage, rendering economics, accuracy, and incremental conversion"]
      - [Square Connect and B2B tools, "Brokers, agents, and developers", "Historically described as an operating broker network and workflow suite", "Distribution network, mobile workflows, and inventory access", "Current active brokers, retention, permissions, and duplicate-listing controls"]
    notes: >-
      Statuses synthesize assigned company materials and 2026 reporting; historical scale claims are
      not treated as current usage, and null operating metrics are explicit diligence gaps.
    claimRefs: [CE001, CE002, CE008, CE009, CE010, CE011, CE013, CE014]
  - id: TE002
    title: Workflow and use-case assessment
    columns:
      - User job
      - Publicly described workflow
      - Company solution
      - Evidenced benefit
      - Limitation
    rows:
      - [Find and evaluate property, "Search listings and use research or visualization tools", "Discovery portal, analytics, recommendations, and PropVR", "Fewer offline discovery steps are claimed", "No independent search-quality or conversion benchmark"]
      - [Complete a property transaction, "Reserve inventory, pay, sign, and submit documents", "Inventory blocking, payment gateways, e-signatures, and post-sales modules", "Company materials describe a digital transaction path", "No completion rate, failure rate, or exception-handling data"]
      - [Arrange financing, "Qualify, compare, verify, and process a mortgage", "Urban Money plus credit-bureau and identity/income integrations", "A connected financing workflow is described", "No approval, pricing, lender-routing, or turnaround benchmark"]
      - [Qualify an inbound lead, "Gather requirements before relationship-manager engagement", "AI first interaction followed by human handoff", "Current reporting says AI supports early qualification", "No accuracy, abandonment, bias, or productivity denominator"]
      - [Manage a property after purchase, "Collect rent, inspect property, and track maintenance", "Azuro and PropsAMC service workflows", "Extends engagement beyond the initial transaction", "No current retention, SLA, geographic coverage, or service-quality measure"]
    notes: >-
      Benefits are limited to what the sources describe; the table does not convert workflow claims
      into measured customer outcomes where no denominator or benchmark is public.
    claimRefs: [CE001, CE004, CE005, CE006, CE009, CE014, CE015]
  - id: TE003
    title: Technology and operating architecture assessment
    columns:
      - Layer or component
      - Role
      - Public evidence
      - Dependency
      - Principal risk
    rows:
      - [Supply and research data, "Support search, comparison, and valuation context", "Company materials cite listings, heatmaps, scores, price analytics, and transaction history", "Fresh and permissioned property data", "Stale, duplicated, or weakly verified data"]
      - [AI interaction layer, "Handle initial engagement, lead qualification, and requirement capture", "CTO statements reported by Business Standard", "Training data, guardrails, escalation, and human availability", "Incorrect qualification, bias, or opaque productivity claims"]
      - [Transaction orchestration, "Connect reservation, payment, signature, and post-sales steps", "Repeated company descriptions of integrated digital workflows", "Developer inventory, payment gateways, and document systems", "Third-party failure, reconciliation, fraud, and exception handling"]
      - [Mortgage integrations, "Verify applicants and route fulfilment", "Company materials name credit-bureau, identity, address, and income checks", "Lenders, bureaus, identity providers, and consent controls", "Partner concentration, privacy, approval latency, and regulatory change"]
      - [Visualization and post-sale services, "Provide virtual tours, interiors, rentals, and asset management", "PropVR acquisition and adjacent-service descriptions", "Accurate source assets and field-service execution", "Content accuracy, implementation cost, and inconsistent service quality"]
      - [Trust and operations, "Protect KYC, buyer data, signatures, and service continuity", "Historical company claim of file encryption", "Security governance, observability, resilience, and incident response", "No assigned certification, uptime, recovery, or incident-history evidence"]
    notes: >-
      This is an evidence-bounded operating model, not a verified deployment diagram; component
      boundaries, vendors, data flows, control ownership, and service levels remain undisclosed.
    claimRefs: [CE003, CE004, CE005, CE006, CE014, CE015]
figures:
  - id: FE001
    title: Evidence-bounded product architecture
    type: stack
    summary: >-
      Public evidence supports an integrated sequence of customer-facing and operating layers, but
      not the underlying infrastructure topology or production-control design.
    data:
      layers:
        - label: Discovery and research
          detail: Listings, search, research tools, and market context
          items: ["Property supply", "Search and comparison", "Research signals"]
        - label: AI-assisted engagement
          detail: Initial interaction, lead qualification, and requirement gathering
          items: ["AI first contact", "Qualification", "Human handoff"]
        - label: Visualization and decision support
          detail: Virtual tours and project or unit visualization
          items: ["PropVR", "3D walkthroughs", "Remote showing"]
        - label: Transaction orchestration
          detail: Inventory reservation, payments, signatures, and post-sales processing
          items: ["Inventory blocking", "E-payments", "E-signatures"]
        - label: Financing
          detail: Mortgage verification and fulfilment through Urban Money
          items: ["Credit bureau", "Identity and income checks", "Lender workflow"]
        - label: Post-purchase services
          detail: Interiors, rentals, property management, and asset intelligence
          items: ["Interior Company", "Azuro", "PropsAMC"]
    approximationNotes: >-
      Layer order reflects the publicly described customer journey; it does not assert a verified
      software topology, shared data model, latency path, or deployment boundary.
    claimRefs: [CE004, CE005, CE006, CE009, CE014, CE016]
callouts:
  - calloutType: strength
    title: Workflow breadth is the clearest product advantage
    body: >-
      Multiple current and historical sources describe a connected service surface across property
      transactions, financing, visualization, interiors, rentals, and management.
    claimRefs: [CE001, CE008, CE009]
  - calloutType: risk
    title: Full-stack breadth is not technical proof
    body: >-
      Public sources do not establish service levels, security certifications, model performance,
      integration quality, or active adoption by module.
    claimRefs: [CE013, CE015, CE016]
