artifact: valuation
slug: square-yards
runDate: 2026-10-21
company:
  name: Square Yards
chapter:
  number: 8
  title: Valuation
  summary: >-
    Square Yards combines strong FY26 growth and improving EBITDA with a June 2026
    financing above a reported $1 billion valuation, but the mixed debt-equity
    structure, cap-table terms, and IPO timetable remain opaque. Public evidence
    therefore supports a price-sensitive research-more stance, not an unconditional
    buy recommendation.
sections:
  - id: recommendation-and-investment-framing
    title: Recommendation and investment framing
    body: >-
      The recommendation is research more and track, with medium confidence and high
      underwriting risk. The positive case is unusually tangible for a private
      proptech platform: Square Yards spans property transactions, mortgages,
      interiors, rentals, and property management, while reported FY26 revenue rose
      48% to INR 2,086 crore and adjusted EBITDA reached INR 176 crore at an 8%
      margin. The anti-thesis is price and structure rather than product breadth.
      The latest financing reportedly combined debt and equity at a valuation above
      $1 billion, but the split and investor protections were not disclosed.
      Investors should therefore separate company quality from security-level
      attractiveness. Entry should wait for the capitalization table, debt terms,
      liquidation preferences, audited statements, and an internally consistent
      IPO plan; without those items, neither downside protection nor dilution can be
      underwritten from public evidence.
    claimRefs: [CV001, CV002, CV003, CV007, CV008, CV012]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-valuation-context
    title: Financing and valuation context
    body: >-
      June 2026 evidence converges on a roughly $95 million mixed debt-equity raise
      and a post-money value above $1 billion. Multiples records $223 million of
      revenue beside a $1 billion valuation, implying 4.5x revenue. That is a useful
      transaction marker, not proof of fair value: the public record does not
      disclose the debt-equity allocation, seniority, coupons, covenants, liquidation
      preferences, or fully diluted ownership. Funding totals also conflict, with
      Inc42 showing more than $208.82 million and Multiples showing $228 million
      across eight rounds. The November 2025 financing at a reported $900 million
      pre-money valuation offers a directionally relevant prior mark, but successive
      rounds with different security mixes cannot be treated as like-for-like common
      equity prices.
    claimRefs: [CV007, CV008, CV009, CV014, CV015, CV016]
    tableRefs: [TV002]
  - id: scenario-and-comparable-discipline
    title: Scenario and comparable discipline
    body: >-
      The operating setup can support upside if management sustains its 40% or
      greater FY27 growth ambition while moving into double-digit EBITDA margins.
      Revenue concentration also matters: Business Standard reports that Urban Money
      produced more than half of FY26 revenue, real-estate transactions about 40%,
      and interiors plus other digital products about 10%. This mix makes a single
      portal-company multiple misleading because lending distribution, brokerage,
      and services have different margin and risk profiles. The available comparable
      set spans approximately 1.2x to 11.2x revenue across materially different
      businesses and geographies. The scenario ranges below are therefore
      transparent analytical cases applied to reported FY26 revenue, not observed
      bids, forecasts, or price targets. Audited segment economics and a genuinely
      comparable peer set are required before narrowing them.
    claimRefs: [CV004, CV005, CV006, CV009, CV010, CV011]
    tableRefs: [TV003]
  - id: exit-readiness-and-thesis-breaks
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      Exit evidence is inconsistent. Online Marketplaces reported the chief
      executive's ambition to float the company at a minimum $1.5 billion valuation
      in 2026, while a later Business Standard interview said an IPO remained on the
      horizon with no announced timetable. This divergence does not prove delay, but
      it prevents underwriting a dated liquidity event. The thesis improves if a
      filed offer document confirms audited segment profitability, cash conversion,
      debt maturity, preference terms, and a credible primary-versus-secondary
      issuance mix. It breaks if growth falls materially below management's 40%+
      ambition, EBITDA margin retreats from 8%, financing adds senior claims without
      matching cash generation, or an IPO requires a valuation below the June round.
      Until those tests are observable, track execution and negotiate on security
      terms rather than relying on unicorn status.
    claimRefs: [CV003, CV008, CV011, CV012, CV013, CV014]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - [Recommendation, "Research more / track", "Strong FY26 scale and profitability evidence, but incomplete security-level evidence", "Do not issue a buy call until financing and cap-table terms are reviewed"]
      - [Confidence, Medium, "Multiple sources corroborate operating metrics; transaction structure remains partly undisclosed", "Treat the operating case as firmer than the valuation conclusion"]
      - [Risk rating, High, "Hybrid financing, segment mix, and IPO timing create material underwriting uncertainty", "Require downside protection and covenant review"]
      - [Valuation stance, "Price-sensitive; unsupported as fair value", "$1B marker and 4.5x revenue multiple are observable, but comparability is weak", "Negotiate against audited segment economics and fully diluted ownership"]
      - [Exit stance, "Not yet underwritable", "IPO ambition exists, but no timetable was announced in the later interview", "Do not include a dated IPO in the base case"]
    notes: "Assessment as of 2026-10-21; financing terms, cap-table rights, and audited segment data are not public, so the table is a diligence stance rather than a security recommendation."
    claimRefs: [CV002, CV003, CV007, CV008, CV009, CV010, CV012, CV013]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - [Thesis, "Integrated distribution can cross-sell across a long housing journey", "Platform covers transactions, mortgages, interiors, rentals, and management", "Audited attachment, retention, and contribution-margin data would strengthen the claim"]
      - [Thesis, "Operating leverage is emerging", "FY26 adjusted EBITDA was INR 176 Cr at an 8% margin, versus 3% in FY25", "Sustained double-digit margin with cash conversion would support a higher-quality multiple"]
      - [Anti-thesis, "Financing structure may transfer value away from common equity", "The June round mixed debt and equity, with the exact split undisclosed", "Full term sheet, debt schedule, covenants, and liquidation waterfall would resolve the risk"]
      - [Anti-thesis, "Liquidity timing is not established", "A minimum $1.5B float ambition coexists with a later statement that no IPO timeline was announced", "A filed offer document and appointed timetable would make exit timing underwritable"]
    notes: "Arguments distinguish reported operating facts from unresolved financing and exit assumptions; no private term sheet or offer document was available."
    claimRefs: [CV001, CV003, CV008, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns:
      - Case
      - Explicit assumptions
      - Illustrative valuation range
      - Probability signal
      - Downside or confirmation trigger
    rows:
      - [Bull, "FY27 growth remains at least 40%, EBITDA margin becomes double digit, and IPO terms are common-equity friendly", "$1.34B-$1.78B (6.0x-8.0x FY26 revenue)", "Requires strong confirmation", "Filed offer document confirms clean leverage, cash conversion, and durable segment margins"]
      - [Base, "Growth moderates but remains strong, margin holds near or above FY26, and no punitive preference overhang emerges", "$0.89B-$1.12B (4.0x-5.0x FY26 revenue)", "Closest to the reported 4.5x marker", "Audited results reconcile revenue, EBITDA, debt, and fully diluted ownership"]
      - [Bear, "Growth slows materially, margin compresses, or senior financing absorbs equity value before exit", "$0.45B-$0.67B (2.0x-3.0x FY26 revenue)", "Material until financing is disclosed", "Missed growth guidance, margin reversal, covenant stress, or a down-round/discounted IPO"]
    notes: "Illustrative analyst cases multiply the reported $223M FY26 revenue by stated scenario multiples selected within the source's broad 1.2x-11.2x comparable range; they are not observed offers, probabilities, or price targets."
    claimRefs: [CV002, CV003, CV008, CV009, CV010, CV011, CV012]
