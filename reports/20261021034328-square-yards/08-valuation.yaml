callouts:
  - calloutType: recommendation
    title: Underwrite the security, not the unicorn label
    body: >-
      The June valuation marker is credible enough to frame negotiations but not
      complete enough to establish common-equity value. A decision requires the
      debt-equity allocation, fully diluted capitalization, preference stack,
      covenant package, and audited segment cash generation.
    claimRefs: [CV007, CV008, CV009, CV015, CV016]
