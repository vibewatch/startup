slug: "square-yards"
runDate: "2026-10-21"
company:
  name: "Square Yards"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Square Yards addresses an integrated property-services boundary spanning discovery,
    transactions, mortgages, interiors, rentals, and property management, with India
    accounting for 88% of FY26 revenue. Public evidence demonstrates substantial company
    throughput but does not provide a comparable independent TAM, SAM, or SOM, so valuation
    should distinguish company revenue from property and loan principal facilitated.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The relevant market is narrower than all real estate and broader than an online
      listing portal. Square Yards describes an end-to-end consumer journey covering search
      and discovery, property transactions, mortgages, home furnishing, rentals, and
      property management, while also offering business-facing workflows for developers,
      financial institutions, and agents. The included spend is therefore fees or revenue
      earned from enabling those services, not the underlying value of homes or loan
      principal passing through the platform. Status-quo substitutes include offline
      brokers, direct developer sales teams, bank-led mortgage processes, and separate
      interiors or property-management vendors. The company operates across India, the UAE,
      Australia, and Canada, but the market boundary remains operationally India-led rather
      than a uniform global category.
    claimRefs: [CM001, CM002, CM003, CM013]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: "sizing-lenses"
    title: "Evidence-constrained sizing"
    body: >-
      The retained evidence does not support a defensible top-down TAM, SAM, or SOM for the
      integrated boundary. It instead offers four non-interchangeable company-scale lenses:
      FY26 revenue of INR 2,086 crore, 273,643 customers acquired, INR 13,236 crore of houses
      transacted, and INR 87,831 crore of loans disbursed. Revenue is accounting output;
      property and mortgage figures are facilitated principal or transaction value; and the
      customer count is a volume measure. These figures must not be added or converted into
      market share without category spend and denominator evidence. The geography mix gives
      the clearest serviceable-market constraint: India generated 88% of FY26 revenue and
      international markets 12%, while India grew faster than the consolidated business.
    claimRefs: [CM004, CM005, CM006, CM007, CM012, CM015, CM016]
    tableRefs: [TM002]
  - id: "buyers-and-adoption"
    title: "Buyers, users, payers, and adoption path"
    body: >-
      The demand system is multi-sided. Home seekers and property owners use consumer
      services; developers, lenders, and agents use or participate in business workflows;
      and the sources do not consistently disclose which party pays each fee or owns each
      software budget. Mortgage distribution is especially partner-dependent: Fortune India
      reports more than 150 bank and non-bank partners behind Urban Money's FY26
      disbursals. The adoption path is therefore not a single software purchase. It begins
      with customer acquisition, continues through transaction and financing workflows,
      and may extend into interiors, rentals, or management. The reported 55% attachment
      rate is evidence of cross-service adoption, but the source does not define the
      denominator or provide segment-level economics.
    claimRefs: [CM002, CM005, CM008, CM009, CM010, CM011, CM013]
    tableRefs: [TM003]
  - id: "drivers-constraints-and-valuation"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Adoption is supported by digitization of paperwork-heavy property workflows, a large
      reported flow of transactions and loans, and opportunities to attach adjacent services
      after a core transaction. Square Yards reports faster India growth than consolidated
      growth and meaningful activity in designed and managed homes, which indicates that
      adjacencies are active rather than merely announced. Constraints are equally material:
      the workflow crosses regulated lenders, identity and payment processes, developers,
      agents, and consumers, raising coordination, trust, and execution requirements.
      EAAA Alternatives described the industry as highly fragmented, which can create room
      for consolidation but also implies costly local operations. Without independent
      category spend, fee take rates, retention, acquisition cost, and segment margins,
      valuation should rely on demonstrated revenue and profitability rather than a broad
      market-size multiple.
    claimRefs: [CM007, CM009, CM010, CM011, CM012, CM013, CM014, CM015, CM016]
