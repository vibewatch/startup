      The sources identify participants and workflows but do not consistently disclose
      procurement authority, contract structure, pricing, or the ultimate fee payer.
    claimRefs: [CM002, CM005, CM008, CM009, CM010, CM011, CM013]
figures:
  - id: "FM001"
    title: "Market-sizing evidence hierarchy"
    type: "pyramid"
    summary: >-
      Public evidence becomes more concrete toward company activity, but the upper
      category-spend layers required for TAM, SAM, and SOM remain unquantified.
    data:
      items:
        - label: "Integrated category TAM"
          value: "Not publicly quantified"
          detail: "Independent spend across transactions, mortgages, interiors, rentals, and property management is missing."
          tone: "risk"
          claimRefs: [CM016]
        - label: "India-addressable SAM"
          value: "Not publicly quantified"
          detail: "India produces 88% of company revenue, but no category-spend denominator is available."
          tone: "risk"
          claimRefs: [CM004, CM016]
        - label: "Serviceable segment spend"
          value: "Not publicly quantified"
          detail: "Segment fee pools and payer take rates are not disclosed."
          tone: "risk"
          claimRefs: [CM015, CM016]
        - label: "Customer volume"
          value: "273,643 acquired in FY26"
          detail: "Company-reported acquisition count without a disclosed unique-customer definition."
          tone: "neutral"
          claimRefs: [CM005]
        - label: "Transaction throughput"
          value: "INR 13,236 crore houses in FY26"
          detail: "Property value facilitated, not company revenue."
          tone: "neutral"
          claimRefs: [CM006, CM015]
        - label: "Revenue capture"
          value: "INR 2,086 crore in FY26"
          detail: "Company revenue is the most concrete monetization lens in the retained evidence."
          tone: "opportunity"
          claimRefs: [CM015]
    approximationNotes: >-
      This is an evidence hierarchy, not a value-proportional TAM/SAM/SOM estimate;
      layer order and width do not encode magnitude.
    claimRefs: [CM004, CM005, CM006, CM015, CM016]
callouts:
  - calloutType: "risk"
    title: "Do not capitalize throughput as revenue"
    body: >-
      The INR 87,831 crore loan figure and INR 13,236 crore property figure are facilitated
      principal or transaction values, not Square Yards revenue or independently measured
      addressable market spend.
    claimRefs: [CM006, CM007, CM015]
  - calloutType: "recommendation"
    title: "Use a bottom-up diligence bridge"
    body: >-
      Request segment revenue, take rates, transaction counts, repeat behavior, acquisition
      cost, and geography-level margins before converting the operating footprint into a
      market-share or valuation-growth assumption.
    claimRefs: [CM009, CM015, CM016]
