      - ["Square Yards", "FY26", "Platform", "273,643", "Customers acquired", "Medium", "Denominator and unique-customer definition are not disclosed"]
      - ["Square Yards", "FY26", "Platform", "INR 13,236 crore", "Value of houses transacted", "Medium", "Transaction value is not company revenue or market spend captured"]
