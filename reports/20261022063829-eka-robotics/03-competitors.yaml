  - id: TP003
    title: Commercial, switching-cost, and production-proof comparison
    columns:
      - Diligence factor
      - Current Eka evidence
      - Required alternative comparison
      - Competitive implication
    rows:
      - [Realized pricing, "Not disclosed in the assigned evidence", "Quoted equipment, software, integration, support, and replacement cost", "No defensible price advantage can be claimed"]
      - [Contract packaging, "License, hardware-sale, service, and performance-guarantee mix is unknown", "Comparable scope, term, warranty, and service-level terms", "Packaging may determine lock-in more than model capability"]
      - [Integration, "Integrated sensing, control, and hardware are described", "Robot, gripper, PLC, safety, quality, and data interfaces", "Integration can create both performance advantage and switching cost"]
      - [Throughput, "About 1,500 operations/hour is company-reported", "Same objects, cycle definition, retries, and shift duration", "A headline rate is not a matched operating benchmark"]
      - [Reliability, "Public coverage reports a success claim but no raw sustained-production denominator", "Failures, interventions, recovery time, safety stops, and uptime", "Reliability remains the principal adverse proof gap"]
      - [Generalization, "Varied-object handling is demonstrated", "Unseen objects, changeovers, lighting, placement, and task transfer", "Generalization beyond pick-and-place remains open"]
      - [Lifecycle and support, "The hiring signal shows formal hardware validation work", "Maintenance, consumables, release controls, response times, and certifications", "Incumbent service access may offset Eka's adaptability"]
      - [Customer proof, "Specific contracts and named operating results are not disclosed", "Reference customer or independent integrator over sustained production", "Commercial readiness and distribution power remain unresolved"]
    notes: "This table is a diligence protocol, not a populated vendor benchmark. It keeps missing commercial terms and unmatched operating evidence explicit rather than estimating them."
    claimRefs: [CP009, CP011, CP012, CP013, CP014, CP015, CP016]
