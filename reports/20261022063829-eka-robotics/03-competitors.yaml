company:
  name: Eka Robotics
chapter:
  number: 3
  title: Competitors
  summary: Eka Robotics has a differentiated force-aware manipulation thesis, but the assigned evidence does not establish a durable commercial advantage over well-funded physical-AI peers, incumbent automation, or the existing human workflow. Its competitive case therefore depends on production validation, integration economics, and pricing that remain undisclosed.
sections:
  - id: landscape
    title: Competitive landscape and substitutes
    body: >-
      The competitive set is broader than manipulation-model startups. Eka combines visual
      understanding, force sensing, and action control for variable physical tasks, placing it
      against AI-native robotics companies such as Physical Intelligence, Generalist, Skild AI,
      THEKER, and Dream Labs. Those peers are visible primarily through financing signals in the
      assigned evidence, not matched product or deployment data. Buyers can also choose an
      incumbent robot-and-integrator cell, commission specialist vision or gripper automation,
      build internally, or preserve a human-operated workflow. These alternatives compete on the
      whole job rather than on model architecture alone: implementation risk, service access,
      safety validation, exception handling, and the cost of changing an operating process. The
      named startup financing figures indicate a capital-intensive race, but they do not measure
      revenue, installed base, market share, or production reliability.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP007, CP008]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability
    title: Capability, trust, and production evidence
    body: >-
      Eka's reported differentiation is the coupling of vision, force feedback, learned control,
      and custom robotic hardware. Humanoids Daily says the model is trained with reinforcement
      learning in simulation, while a syndicated report describes force-sensitive grippers paired
      with a vision-force-action model. The company's reposted hardware-test role also covers
      validation from PCBAs and actuators through grippers and complete robotic arms, including
      safety and ingress-protection certification. These facts make the technical thesis more
      specific than a generic robotics-AI claim. They do not demonstrate lower total cost,
      smoother integration, or sustained reliability. The public video is expressly not a
      controlled competitor comparison, and the reviewed evidence provides no common test across
      Eka, an incumbent automation cell, a specialist system, internal build, and the current human
      process.
    claimRefs: [CP001, CP002, CP010, CP011, CP012, CP015]
    tableRefs: [TP002]
  - id: durability
    title: Switching costs, distribution, and moat durability
    body: >-
      A moat could emerge from force-rich task data, simulation-to-real learning, integrated
      hardware, and validation knowledge accumulated in deployments. The same integration can
      become a buyer liability if interfaces, maintenance, model updates, or support are
      proprietary. Incumbents and integrators may counter with installed equipment, service
      relationships, and proven safety processes, while buyers may multi-home across arms,
      grippers, controls, and software when interfaces permit. The assigned evidence does not
      disclose Eka customer contracts, revenue, or a detailed deployment timeline, and it does not
      disclose realized pricing or matched total cost. Servicta therefore recommends measuring
      interventions, recovery time, damage, safety stops, uptime, and integration cost in a pilot.
      Without those data, technical differentiation is credible but commercial lock-in and pricing
      power remain hypotheses.
    claimRefs: [CP009, CP011, CP013, CP014, CP016]
    tableRefs: [TP003]
  - id: verdict
    title: Competitive diligence verdict
    body: >-
      Eka merits a buyer-controlled pilot, not a conclusion that it has won the manipulation
      market. The evidence is strongest for a force-aware architecture and a company-reported
      throughput claim of about 1,500 operations per hour versus a human baseline of about 600.
      It is weakest for named production deployments, shift-length reliability, realized pricing,
      customer outcomes, and comparable economics. An external expert quoted by SiliconANGLE
      questioned whether the system could run on an assembly line for a year without failure and
      whether it generalizes beyond pick-and-place. A decisive test should use the same objects,
      cycle definition, exception rules, safety boundary, and duration for Eka and at least one
      credible alternative. Until that evidence exists, the durable advantage is unproven and
      capital-rich peers, incumbent distribution, internal build, and the status quo remain viable
      displacement paths.
    claimRefs: [CP008, CP009, CP012, CP013, CP014, CP015, CP016]
