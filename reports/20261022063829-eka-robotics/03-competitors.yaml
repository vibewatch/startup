callouts:
  - calloutType: insight
    title: Technical differentiation is clearer than commercial differentiation
    body: Eka's force-aware architecture is repeatedly described, but the assigned evidence does not establish a durable cost, channel, uptime, or customer-outcome advantage over incumbents or narrower automation.
    claimRefs: [CP001, CP002, CP009, CP016]
  - calloutType: risk
    title: The production-shift test remains open
    body: Public coverage explicitly distinguishes demonstrations from controlled comparisons and questions sustained assembly-line reliability and generalization beyond pick-and-place.
    claimRefs: [CP012, CP013]
