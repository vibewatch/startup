  evidenceGaps:
    - type: missing-source
      severity: material
      topic: production-reliability
      missingEvidence: Independent customer or integrator data showing uptime, intervention rate, recovery time, task breadth, and sustained performance.
      whyItMatters: A manipulation demonstration does not establish reliable production economics or safe operation over long periods.
      diligencePath: Obtain a customer-referenced pilot report with test protocol, denominator, duration, retries, interventions, downtime, and maintenance records.
      relatedQuestionRefs: [QE006, QE007]
    - type: missing-source
      severity: material
      topic: security-governance
      missingEvidence: Product security documentation covering data flows, access control, software updates, vulnerability handling, and incident response.
      whyItMatters: Robots connected to operational networks can create safety, availability, and data-governance exposure even when manipulation performance is strong.
      diligencePath: Request a security questionnaire, architecture/data-flow review, update policy, support SLA, and incident-response commitments before a production pilot.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: certification
      missingEvidence: Certificates, test reports, and scope showing which hardware configurations meet applicable safety and ingress-protection requirements.
      whyItMatters: A job description mentioning certification activity is not evidence that a deployed configuration is certified.
      diligencePath: Review current certificates, test reports, configuration assumptions, guarding requirements, and integrator responsibilities.
      relatedQuestionRefs: [QE006]
    - type: enumeration-incomplete
      severity: minor
      topic: product-module-asset-matrix
      missingEvidence: A complete public inventory of supported arms, grippers, cameras, software releases, integrations, and customer-facing SKUs.
      whyItMatters: Buyers cannot estimate deployment scope or switching costs from a partial public architecture description.
      diligencePath: Request the current product and compatibility matrix, release notes, supported interfaces, and lifecycle policy under NDA.
      relatedQuestionRefs: [QE002, QE003]
