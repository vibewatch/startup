chapter:
  number: 5
  title: Product & Technology
  summary: Eka Robotics is building a physical-AI manipulation system that combines vision, force feedback, learned control, and custom gripper hardware. Public evidence shows a technically ambitious stack and a field-support model, but the available material is largely company-described or job-derived; independent evidence on sustained production reliability, security, and deployment outcomes remains limited.
sections:
  - id: product-workflow
    title: Product and customer workflow
    body: >-
      Eka's product is described as a robotic manipulation system rather than a
      standalone software model. The reported workflow runs from sensing and
      perception through force-aware action, physical manipulation, deployment,
      and operational support. Servicta describes the core model as using visual
      and force information together, while the company-described recruiting
      material places the system at customer sites for configuration, calibration,
      demonstrations, and issue triage. This implies a buyer workflow in which
      Eka must integrate with existing arms, grippers, cameras, edge compute,
      safety controls, and site procedures. The public record does not identify
      production customers, contract terms, or measured deployment outcomes, so
      the product should be evaluated as an integrated workflow with material
      implementation work rather than as a plug-in model.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: technical-architecture
    title: Technical architecture and maturity
    body: >-
      The available evidence points to a layered architecture: visual and force
      sensing feed a learned policy; simulation and reinforcement learning support
      training; real robots provide transfer and feedback; and production
      software provides deployment, telemetry, diagnostics, and safety functions.
      Recruiting requirements mention ROS2 or similar middleware, Linux, edge
      deployment, TensorRT or ONNX, production C++ and Python, automated testing,
      simulation, and system-identification experiments. Hardware validation roles
      cover PCBAs, actuators, grippers, robotic arms, environmental and stress
      testing, failure analysis, and certification documentation. These are
      concrete engineering activities, but job requirements establish intended
      capabilities and process needs, not proof that every component is mature
      or deployed at scale.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: reliability-and-differentiation
    title: Reliability, differentiation, and technical diligence
    body: >-
      Eka's differentiation claim is the combination of a vision-force-action
      model, a force-sensing gripper, simulation-based reinforcement learning,
      and an operating loop that feeds telemetry and field failures back to
      engineering. Independent coverage reports company claims of approximately
      1,500 object-picking operations per hour and more than 95% success, but
      does not provide a matched benchmark, customer identity, or enough test
      detail to establish production performance. The same coverage says a
      specialist believes the system still needs to prove itself with integrators
      and sustained industrial use. The decisive diligence questions are therefore
      task-specific transfer, intervention and recovery rates, uptime, safety
      stops, maintenance, data handling, update controls, certification scope,
      and performance after object or layout changes. Public evidence does not
      establish those measures.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Integrated sensing and control thesis
    body: Eka's reported architecture connects visual perception, force feedback, learned action, simulation, and custom end-effectors instead of treating manipulation as a vision-only problem.
    claimRefs: [CE005, CE006, CE010]
  - calloutType: risk
    title: Production transfer remains unproven
    body: Public sources describe demonstrations and engineering requirements, but do not establish sustained customer uptime, independent benchmark conditions, safety performance, or long-run maintenance economics.
    claimRefs: [CE011, CE012, CE013, CE014]
