      - [Policy and control, "Select actions and force application for physical interaction", "Learned models, control theory, and real-time execution", "Model failure, unstable contact, latency, and recovery behavior"]
      - [Simulation and training, "Train policies through physics-based simulation and reinforcement learning", "Physics engine fidelity, compute, and sim-to-real validation", "Simulation assumptions may not transfer to production variation"]
      - [Runtime and edge deployment, "Run production C++/Python, ROS2-like middleware, ML inference, logging, and monitoring", "Linux, edge devices, GPU inference, networks, and safety interfaces", "Latency, observability gaps, software updates, and safety integration"]
      - [Hardware validation and field operations, "Test PCBAs, actuators, grippers, arms; deploy, diagnose, and feed failures to R&D", "Fixtures, labs, integrators, telemetry, and trained support staff", "Component wear, certification scope, integration cost, and downtime"]
    notes: "Architecture is synthesized from explicit responsibilities and qualifications in assigned recruiting sources plus reported model descriptions; it is not a verified public system diagram."
    claimRefs: [CE004, CE007, CE008, CE009, CE012]
