      - QE006
  - type: missing-source
    severity: material
    topic: certification
    missingEvidence: >-
      Certificates, test reports, and scope showing which hardware configurations meet applicable safety and
      ingress-protection requirements.
    whyItMatters: A job description mentioning certification activity is not evidence that a deployed configuration is certified.
    diligencePath: >-
      Review current certificates, test reports, configuration assumptions, guarding requirements, and integrator
      responsibilities.
