evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Complete executive roster, board composition, investor rights, and key-person succession coverage.
    whyItMatters: Technical founder credentials do not establish operating depth, independent oversight, or leadership continuity.
    diligencePath: >-
      Obtain the board roster, cap table, investor-rights agreements, executive responsibilities, and succession plan
      under NDA.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: commercial traction
    missingEvidence: >-
      Named customer pilots with task scope, duration, uptime, intervention rate, quality outcomes, pricing, and
      commercial terms.
    whyItMatters: >-
      Without customer-level operating evidence, reported demonstrations and financing cannot establish repeatable
      production value or revenue.
    diligencePath: >-
      Request customer references, pilot scorecards, deployment contracts, pipeline conversion, and a reconciled revenue
      bridge.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: missing-source
    severity: material
    topic: operating metrics
    missingEvidence: >-
      Revenue, ARR or bookings, headcount, cash balance, burn, runway, gross margin, locations, and customer
      concentration.
    whyItMatters: >-
      These metrics determine whether the financing valuation is supported by operating scale and whether the new
      capital provides adequate runway.
    diligencePath: >-
      Request monthly financial statements, metric definitions, employee roster, location list, cash waterfall, and
      use-of-proceeds plan.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone timeline
    missingEvidence: >-
      Primary-source dates for incorporation, product releases, partnerships, regulatory events, production deployments,
      and adverse events.
    whyItMatters: >-
      The assigned pool supports seven meaningful dated milestones or disclosures, but not a complete company chronology
      with eight distinct operating events.
    diligencePath: >-
      Request a company chronology and reconcile it to incorporation records, primary announcements, customer documents,
      certifications, and legal searches.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: missing-source
    severity: blocking
    topic: market-sizing
    missingEvidence: Customer-level pricing, contract value, deployment count, revenue, and task-level serviceable-market data.
    whyItMatters: >-
      Without buyer spend and deployment denominators, a precise SAM, SOM, or market-share claim would convert broad
      industry signals into unsupported company economics.
    diligencePath: >-
      Request a customer and pipeline schedule with signed or pilot contract values, deployment counts, task mix,
      recurring software or support components, and geographic scope.
    relatedQuestionRefs:
      - QM002
      - QM008
  - type: missing-source
    severity: material
    topic: adoption
    missingEvidence: >-
      Independent, longitudinal production results covering uptime, interventions, safety stops, quality, and
      maintenance.
    whyItMatters: >-
      Demonstration throughput and company-reported success do not establish repeatable customer ROI or the cost of
      exceptions.
    diligencePath: >-
      Obtain anonymized pilot scorecards and a third-party or customer reference covering at least a sustained
      production period.
    relatedQuestionRefs:
      - QM003
      - QM007
  - type: enumeration-incomplete
    severity: material
    topic: buyer-segmentation
    missingEvidence: Named customer segments, procurement owners, budget envelopes, and status-quo alternatives by workflow.
    whyItMatters: >-
      Industrial manipulation budgets are workflow-specific, so an installed-robot denominator cannot identify Eka's
      reachable buyers.
    diligencePath: >-
      Map three target workflows end to end with operations, automation, safety, finance, and procurement stakeholders
      and their approval gates.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: missing-source
    severity: material
    topic: competitive-economics
    missingEvidence: >-
      Matched pricing, uptime, intervention, and total-cost data for Eka and at least one incumbent or specialist
      alternative.
    whyItMatters: >-
      Without a common denominator, technical differentiation cannot be translated into buyer ROI, switching cost, or
      durable pricing power.
    diligencePath: >-
      Run a buyer-controlled pilot using the same task, objects, safety boundary, duration, exception rules, and cost
      accounting.
    relatedQuestionRefs:
      - QP004
      - QP005
      - QP007
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: deployment-proof
    missingEvidence: Named customer references and sustained production results with raw success denominators and exception handling.
    whyItMatters: >-
      Demonstrations and financing coverage do not establish repeatability, channel fit, production readiness, or
      customer retention.
    diligencePath: >-
      Request reference calls, anonymized shift logs, maintenance records, and an independent integrator validation
      report.
    relatedQuestionRefs:
      - QP006
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: monetization
    missingEvidence: Signed customer contracts, invoices, backlog, revenue by stream, pricing, and recognition policy.
    whyItMatters: >-
      Without realized revenue and contract terms, the financing valuation cannot be related to revenue quality,
      retention, or gross margin.
    diligencePath: >-
      Request a confidential revenue bridge, contract sample, backlog schedule, and customer-level deployment economics
      under NDA.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI005
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Latest cash balance, monthly burn, committed obligations, debt schedule, and management runway forecast.
    whyItMatters: >-
      The $150 million financing amount is not equivalent to cash available or runway, especially for a hardware and
      deployment business.
    diligencePath: >-
      Request current management accounts, a 24-month cash forecast, debt and lease schedules, and the next-round
      trigger under NDA.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Independent production-pilot results covering uptime, retries, interventions, quality, maintenance, integration
      effort, and total cost.
    whyItMatters: >-
      Laboratory throughput and company-reported component specifications do not establish customer payback or
      sustainable margin.
    diligencePath: >-
      Obtain a named-customer or independently witnessed pilot scorecard with matched baseline and full-shift or
