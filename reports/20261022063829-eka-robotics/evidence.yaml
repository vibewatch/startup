    whyItMatters: >-
      Different task definitions, object mixes, retries, and assistance can make nominal picks-per-hour figures
      non-comparable.
    diligencePath: Request raw test logs, object mix, success definition, intervention count, and matched human baseline.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
