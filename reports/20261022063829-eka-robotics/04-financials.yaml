    title: Public financing and capital signals
    columns: [Signal, Reported value or status, Attribution and period, Underwriting interpretation]
    rows:
      - [Series A amount, "$150 million", "Reported in October 2026 coverage", "Financing capacity; not cash-on-hand or revenue"]
      - [Post-money valuation, "$1.45 billion", "Reported with the Series A in October 2026", "Negotiated valuation signal; not operating performance"]
      - [Lead investors, "Andreessen Horowitz and F-Prime", "Series A reporting", "Investor sponsorship; no disclosed terms or covenants"]
      - [Continuing investors, "Obvious Ventures and E14 Fund", "WorkNation account of the round", "Participation reported; ownership and proceeds not disclosed"]
    notes: Sources report the financing event and intended expansion, but do not disclose cash balance, burn, runway, debt, liquidation terms, or use-of-proceeds detail beyond broad development and deployment purposes.
    claimRefs: [CI001, CI003, CI004, CI005]
  - id: TI002
    title: Revenue streams and monetization evidence
    columns: [Potential stream, Public mechanism or status, Current value, Quality and diligence ask]
    rows:
      - [Robotic hardware or system deployment, "Industrial manipulation and robot-hand deployments are described; price is not published", null, "Unverified; obtain quote, bill of materials, installation scope, and payment terms"]
      - [Software or model economics, "Vision-Force-Action model is described; subscription or license structure is not disclosed", null, "Unverified; obtain license metric, renewal terms, and update/support fees"]
      - [Pilot or customer deployment revenue, "Pilots and customer deployments are referenced without named customers or contract values", null, "Unverified; obtain signed contracts, deployment count, and recognized revenue"]
      - [Service and integration revenue, "Integration, maintenance, safety, and support requirements are identified as economic drivers", null, "Unverified; obtain implementation hours, SLA, maintenance schedule, and pass-through costs"]
    notes: Null means no public value was found in the assigned pool; it is not zero revenue. The pool does not establish whether any stream is recognized as recurring revenue.
    claimRefs: [CI006, CI007, CI008, CI010, CI013]
  - id: TI003
    title: Unit-economics inputs and diligence status
    columns: [Metric, Public value or null, Confidence, Why it matters and diligence ask]
    rows:
      - [Throughput, "Up to 1,500 picks per hour in laboratory induction and bin-picking tasks", medium, "Potential capacity input; verify task mix, retries, uptime, and sustained-shift performance"]
      - [Reported human comparison, "About 600 picks per hour for a human in the cited comparison", medium, "Baseline is not a matched total-cost study; obtain equivalent task and quality definitions"]
      - [Reported gripper cost, "Less than $1,000", medium, "Hardware-cost input; verify configuration, consumables, assembly, and replacement assumptions"]
      - [Gripper duty-cycle rating, "Five million duty cycles reported; 20 million described as a longer-term goal", medium, "Lifecycle input; verify test protocol, failure modes, and warranty coverage"]
      - [Revenue, null, low, "Obtain monthly revenue by stream, backlog, contract duration, and recognition policy"]
      - [Gross margin, null, low, "Obtain hardware, software, installation, service, and warranty cost bridge"]
      - ["CAC, payback, and sales cycle", null, low, "Obtain funnel, win rate, selling cost, deployment lead time, and customer payback"]
      - ["Cash, burn, runway, and debt", null, low, "Obtain latest management accounts, cash forecast, debt schedule, and next-round trigger"]
    notes: Reported performance and hardware figures are company or investor-announcement claims, not independently audited unit economics; null values require primary diligence rather than estimation from the financing valuation.
    claimRefs: [CI008, CI009, CI011, CI012, CI014]
