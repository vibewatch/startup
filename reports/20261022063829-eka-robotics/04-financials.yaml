chapter:
  number: 4
  title: Financials
  summary: Eka Robotics has secured a reported $150 million Series A at a reported $1.45 billion post-money valuation, but the assigned evidence does not disclose revenue, pricing, cash, burn, or customer-level economics. The underwriting case therefore depends on converting laboratory manipulation performance into repeatable deployments while validating hardware, integration, service, and working-capital costs.
sections:
  - id: financing-and-revenue-visibility
    title: Financing provides capacity, not operating proof
    body: The assigned sources consistently describe a $150 million Series A led by Andreessen Horowitz and F-Prime at a reported $1.45 billion post-money valuation. WorkNation identifies Obvious Ventures and E14 Fund as continuing investors, while KuCoin attributes the announcement to third-party reporting and includes an explicit disclaimer that the information may be obtained from third parties and carries no representation or warranty. These are financing-event facts, not evidence of cash on hand, revenue, ARR, gross margin, or cash burn. The available reporting says the funding is intended to expand the Vision-Force-Action model, broaden tasks, and accelerate customer deployments, but no source in this pool provides a budget, runway, debt obligation, or financing covenant. The valuation is a negotiated financing signal and should not be used as a substitute for operating performance or an intrinsic-value conclusion.
    claimRefs: [CI001, CI003, CI004, CI005]
    tableRefs: [TI001]
  - id: monetization-and-unit-economics
    title: Monetization and unit economics remain unverified
    body: The public material describes a robotics system aimed at industrial and manufacturing workflows, including pick-and-place, bin-picking, wire manipulation, and other contact-rich tasks. It does not publish a list price, lease or usage model, software fee, realized revenue, customer contract, deployment count, CAC, sales cycle, gross margin, service cost, or payback period. Renascence explicitly says that funding terms, customers, and independent performance tests are not covered in its available material, while Servicta distinguishes a financing valuation from deployed robots, customer savings, production uptime, and commercial revenue. A financial model should therefore separate a possible equipment or deployment transaction from recurring software economics until contracts and invoicing evidence are obtained. The company-reported throughput and gripper-cost figures are useful diligence inputs, but they do not establish contribution margin because labor, integration, maintenance, downtime, consumables, safety systems, and support costs are not disclosed.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI002, TI003]
  - id: capital-intensity-and-underwriting-verdict
    title: Capital intensity and the next financing trigger
    body: >-
      Eka's disclosed plan to expand model capability and accelerate deployments implies continued research, hardware, deployment, and support spending, but the pool does not quantify any of those categories. The a16z announcement describes simulation-based reinforcement learning and integrated model, sensing, controller, and hardware development; WorkNation says the round will support research and development, capability expansion, and faster customer deployment. Those activities can create a capital-intensive path even if the model ultimately improves automation economics. SiliconAngle and Servicta both emphasize that laboratory or demonstration throughput still needs validation in sustained production, with integration, downtime, maintenance, safety, and repeatability affecting customer economics. The financial verdict is consequently evidence-constrained: financing capacity appears stronger after the round, while revenue quality, margin path, runway, and the timing of a next financing remain unknown. A buyer or investor should require production-pilot economics and a cash plan before underwriting scale.
    claimRefs: [CI011, CI012, CI013, CI014]
    tableRefs: []
    figureRefs: [FI001]
tables:
