callouts:
  - calloutType: risk
    title: Valuation is ahead of disclosed operating evidence
    body: The reported $1.45 billion post-money valuation is supported as a financing-event figure by multiple accounts, but the assigned pool does not disclose revenue, customer contracts, production uptime, or independent performance tests. Treat the valuation as a market signal pending operating data.
    claimRefs: [CI006, CI007]
  - calloutType: recommendation
    title: Make production economics the next gate
    body: Before underwriting a larger deployment or a next financing, require a representative pilot scorecard covering completed-task rate, cycle time, interventions, recovery, damage, safety stops, uptime, integration cost, maintenance, and total cost of ownership.
    claimRefs: [CI010, CI011, CI013, CI014]
