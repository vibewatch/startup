    notes: "Headline financing and operating claims are reported by assigned sources; the table does not treat a reported post-money valuation as independently verified fair value."
    claimRefs: [CV006, CV007, CV008, CV010, CV014]
  - id: TV003
    title: Financing and entry-discipline register
    columns: [Item, Public evidence, Valuation implication, Diligence requirement]
    rows:
      - ["Series A amount", "$150M reported", "Signals investor demand; not cash available after fees or restrictions.", "Signed financing announcement and closing confirmation."]
      - ["Post-money mark", "$1.45B reported; Multiples rounds to $1.4B", "Use as a transaction mark, not fair value.", "Preferred terms, option pool, and liquidation preferences."]
      - ["Lead investors", "a16z and F-Prime reported as co-leads", "Reputation may support financing access but does not prove traction.", "Investor confirmation and ownership schedule."]
      - ["Prior seed", "$11M reported in May 2025 by Pomegra", "Large step-up in reported financing needs operating proof.", "Historical closing documents and dilution schedule."]
      - ["Revenue", "Not disclosed in Pomegra coverage", "Revenue multiple cannot be calculated.", "Monthly recurring or contracted revenue by customer and cohort."]
      - ["Customer contracts", "Not disclosed; pilots described without named customers", "No contract-backed valuation denominator.", "Customer references, ACV, backlog, and renewal terms."]
      - ["Cash runway", "Not supportable from assigned evidence", "Funding raised is not equivalent to cash available or runway.", "Cash balance, burn, capex, and restricted cash."]
      - ["Data conflict", "Tracxn record dated 2026-10-15 says unfunded and no rounds", "Transaction state must be reconciled before underwriting.", "Primary transaction evidence and data-room reconciliation."]
    notes: "The rows separate reported financing, valuation, and operating evidence; missing values are intentionally left as diligence requirements rather than estimated."
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
  - id: TV004
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Paid deployments validate force-sensitive manipulation across multiple tasks; independent testing confirms throughput and reliability.", "Potential upside could be assessed after revenue and margin inputs are verified; no range is supportable now.", "Sim-to-real transfer, safety, durability, customer concentration.", "Milestone-dependent; currently unquantified."]
      - [Base, "Funding supports technical scaling and pilot conversion, but public evidence remains sparse.", "Hold valuation stance at unknown; use the reported mark only as a reference point.", "Unclear revenue timing, dilution, preference terms, and deployment costs.", "Most defensible from current public evidence; unquantified."]
      - [Bear, "Pilots fail to become paid production deployments or performance degrades outside controlled tests.", "Downside cannot be quantified without entry terms, cash burn, and liquidation preferences.", "Commercialization failure, hardware reliability, multiple compression.", "Material risk; unquantified."]
    notes: "Scenario ranges and probabilities are not numerically estimated because the assigned evidence lacks revenue, margins, cap-table terms, customer contracts, and a verified cash-flow base."
    claimRefs: [CV002, CV005, CV010, CV011, CV014]

