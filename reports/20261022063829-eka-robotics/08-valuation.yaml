company:
  name: Eka Robotics
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public reporting describes a $150M Series A at a $1.45B post-money valuation, but the same
    evidence says revenue and customer contracts remain undisclosed. The valuation case is
    therefore milestone-dependent: promising reported technical throughput is not yet a
    demonstrated commercial earnings base, so the appropriate stance is research-more pending
    customer, revenue, cap-table, and deployment evidence.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      Eka's positive case is a differentiated robotics thesis backed by a reported financing, a
      force-sensitive gripper, and a Vision-Force-Action model trained through simulation and
      reinforcement learning. Multiple reports describe a claimed 1,500 operations per hour
      versus roughly 600 for a human and applications including pick-and-place, wire handling,
      light-bulb insertion, and other contact-rich tasks. The anti-thesis is equally material:
      the performance numbers are company-reported, no independent test is cited in the assigned
      evidence, pilots are described without named customers, and revenue and contracts are not
      disclosed. The financing therefore validates investor interest more than business-model
      maturity. A buy call would require evidence that the laboratory or pilot claims translate
      into paid, durable production deployments.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV016]
    tableRefs: [TV001]
  - id: price-and-financing
    title: Financing context and entry discipline
    body: >-
      The reported financing context is unusually clear on headline terms but weak on the
      operating denominator needed for valuation. Pomegra, DutchStartup, TechFundingNews, WOWTALE,
      Robothot, Jawlah, and Multiples each report a $150M Series A around October 20, 2026, at
      approximately $1.4B to $1.45B post-money, with a16z and F-Prime leading. These are largely
      syndicated or overlapping accounts, not independent marks. Multiples presents the company
      as privately held with licensing and product sales, while Pomegra explicitly says revenue
      and customer contracts were not disclosed. Tracxn's October 15 record still labels Eka
      unfunded and reports no funding, a direct data conflict that should be resolved against
      transaction documents rather than averaged away. Entry discipline should therefore be
      milestone- and price-sensitive, with no supported revenue multiple or cash-runway
      calculation.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV016]
    tableRefs: [TV003]
  - id: scenarios-and-comparables
    title: Scenarios, comparables, and downside
    body: >-
      The bull case is that force sensing and simulation-trained control produce repeatable
      deployment economics, pilots convert to named paid customers, and the reported performance
      advantage supports a higher value as the company expands tasks. The base case is that the
      round funds technical and commercial validation while public evidence remains insufficient
      to price operating performance. The bear case is that sim-to-real transfer, uptime,
      durability, safety, or customer integration costs prevent conversion, leaving a premium
      private mark unsupported. Multiples lists several comparables and reports very different
      company-level valuations, including Physical Intelligence at $11B and Skild at $14B in the
      surrounding coverage, but those figures are reported private marks rather than a comparable
      revenue or EBITDA set. No probability-weighted range is supportable without revenue,
      margin, retention, deployment, dilution, liquidation-preference, and cap-table inputs.
    claimRefs: [CV011, CV012, CV013, CV014, CV016]
    tableRefs: [TV004]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Recommendation and decision gates
    body: >-
      The recommendation is research-more rather than buy, track, or avoid. The evidence supports
      a credible technical and financing narrative, but not a sufficiently observable commercial
      cash-flow base or a reliable denominator for entry valuation. The next decision should be
      tied to named production customers, paid contract value, deployment uptime, gross margin or
      contribution economics, repeatability across tasks, and financing terms. A thesis break
      would be a failed or delayed production deployment, materially lower throughput or success
      under independent testing, evidence that force-sensing hardware cannot meet durability or
      safety requirements, or a financing structure that creates substantial preference or dilution
      overhang. If those gates clear, a new price-sensitive assessment can use a business-model-
      matched method; until then, the current reported valuation should be treated as an investor
      mark with substantial execution uncertainty.
    claimRefs: [CV002, CV005, CV008, CV010, CV014]

