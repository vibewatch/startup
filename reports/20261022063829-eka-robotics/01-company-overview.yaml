company:
  name: Eka Robotics
chapter:
  number: 1
  title: Company Overview
  summary: Eka Robotics is a Cambridge, Massachusetts robotics startup developing force-aware robotic manipulation. Current reporting supports a $150 million Series A at a reported $1.45 billion post-money valuation and about $161 million of cumulative funding, while revenue, customer identities, headcount, governance, and production results remain undisclosed.
sections:
  - id: identity-product-and-stage
    title: Identity, product, and stage
    body: >-
      Eka Robotics is described as a Cambridge, Massachusetts robotics company developing
      manipulation systems that combine visual perception, force-sensitive hardware, and learned
      physical actions. The product thesis is a full-stack approach: robotic hands supply contact
      information to a Vision-Force-Action model so a robot can adjust how it handles an object.
      Reporting places the company at the Series A stage and says unnamed industrial pilots are
      under way for pick-and-place and wire-handling tasks. That evidence supports an early
      deployment-stage identity, not a proven commercial business model. The assigned sources do
      not disclose pricing, contract structure, named customers, revenue, or a complete product
      catalogue, so these remain diligence gaps rather than inferred scale.
    claimRefs: [CO001, CO002, CO003, CO006, CO013]
    tableRefs: [TO001]
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      Current reports identify Pulkit Agrawal and Tuomas Haarnoja as the founders. Agrawal is an
      MIT professor, while Haarnoja previously worked at Google DeepMind and is associated with
      reinforcement-learning research for robot control. This pairing is directly relevant to a
      force-aware manipulation architecture and provides strong technical founder-market fit.
      However, the public pool does not identify a broader executive team, board composition,
      investor board rights, succession coverage, or operating ownership outside the founders.
      A current company-issued job repost shows active hiring for senior hardware test leadership,
      including reliability testing and certification work, but a vacancy does not establish that
      those capabilities are already staffed or institutionalized.
    claimRefs: [CO004, CO005, CO013, CO014]
    tableRefs: [TO002]
  - id: funding-and-stakeholders
    title: Funding history and stakeholders
    body: >-
      SiliconANGLE reports an $11 million seed round in May 2025 and says investors have put about
      $161 million into the company after the October 2026 Series A. Multiple sources report that
      the latest round raised $150 million at a $1.45 billion post-money valuation, co-led by
      Andreessen Horowitz and F-Prime. TechStartups also names Obvious Ventures, E14 Fund, MFV
      Partners, Bison Ventures, Glasswing Ventures, Samsung Next, and unspecified strategic
      investors as participants. These reports establish financing history and investor interest,
      but not cash available, ownership percentages, liquidation preferences, debt exposure, or
      board control. The valuation is a negotiated financing outcome and should not be treated as
      independently verified enterprise value or operating performance.
    claimRefs: [CO006, CO007, CO008, CO009, CO015, CO016]
    tableRefs: [TO003]
  - id: scale-readiness-and-milestones
    title: Scale, readiness, and milestone evidence
    body: >-
      Public reporting attributes roughly 1,500 object-picking operations per hour and greater
      than 95% pick success to company-reported tests, with the throughput compared against a
      reported human benchmark of about 600 operations per hour. Those figures preserve the
      stated task and attribution; they are not independent production benchmarks. The gripper is
      also reported as rated for five million duty cycles against a company goal of 20 million.
      Servicta and SiliconANGLE highlight the unresolved transition from demonstrations to
      sustained industrial use, including uptime, task breadth, recovery, integration cost, and
      maintenance. Named pilot results and revenue are absent. The evidence therefore supports a
      well-financed technical program with promising reported demonstrations, while commercial
      scale and long-run reliability remain material open questions. No recorded incident in this
      assigned pool should be interpreted as proof that no incident exists.
    claimRefs: [CO003, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Technical founder-market fit
    body: The founders' robotics and reinforcement-learning backgrounds align with the company's force-aware manipulation thesis, and the active test-engineering search indicates attention to hardware validation.
    claimRefs: [CO004, CO005, CO014]
  - calloutType: risk
    title: Financing is not production proof
    body: The $150 million round and $1.45 billion post-money valuation establish investor support, but disclosed evidence does not establish revenue, named customer outcomes, production uptime, or independently replicated benchmarks.
    claimRefs: [CO006, CO007, CO010, CO011, CO013]
