          values: [null, Medium, High, null]
        - label: Financial model
          note: Revenue, burn, runway, margins, and deployment economics are not disclosed.
          values: [null, Medium, High, null]
        - label: Intervention burden
          note: Public accounts do not provide raw reset, recovery, or human-assistance rates.
          values: [null, Medium, High, null]
        - label: Hardware lifecycle
          note: Durability targets are company-reported and lack an independent lifecycle record.
          values: [null, Medium, High, null]
    approximationNotes: "Qualitative placement reflects disclosed evidence gaps and reported operating hurdles; it is not a statistical probability model or an incident count."
    claimRefs: [CR003, CR007, CR010, CR014, CR018]
callouts:
  - calloutType: risk
    title: Production proof is the gating risk
    body: "The assigned sources describe pilots and laboratory or demonstration claims, while customer names, pilot revenue, and sustained production results remain undisclosed. Treat production-transfer evidence as a prerequisite to underwriting scale."
    claimRefs: [CR001, CR002, CR018]
  - calloutType: assumption
    title: Financing is not operating capacity
    body: "A reported $150 million financing and $1.45 billion post-money valuation do not establish cash runway, revenue, margins, or deployment-level returns."
    claimRefs: [CR014, CR015, CR016]
