schemaVersion: "report-v2"
artifact: risks
slug: eka-robotics
runDate: 2026-10-22
company:
  name: Eka Robotics
chapter:
  number: 7
  title: Risks
  summary: Eka Robotics has attracted substantial financing for a force-aware manipulation approach, but public evidence remains concentrated in investor, company-attributed, and early-stage coverage. The principal diligence issue is whether laboratory and demonstration performance transfers to safe, reliable, economically viable production deployments.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis-break triggers
    body: "The highest-consequence risk is commercialization transfer. Public accounts describe pilots, demonstrations, and reported laboratory throughput, but do not identify customers, disclose pilot revenue, or provide sustained production-line results. That leaves a material gap between technical promise and deployable operating performance. A thesis break would be repeated failure to meet a buyer's agreed cycle-time, completed-task, quality, safety, and uptime thresholds on representative production work, or an integration burden that erases the expected labor and throughput benefit. The next risk is model generalization: force feedback and simulation may improve recovery from contact variation, but simulation-to-reality transfer remains a recognized challenge and the public sources do not establish performance across shifts, layouts, materials, or unfamiliar task families. Financial risk follows from opacity: the reported $150 million Series A and $1.45 billion post-money valuation provide capital and market validation, not evidence of revenue, cash runway, margins, or customer concentration. Investors should require a task-specific pilot protocol, failure and intervention logs, lifecycle-cost assumptions, and a financing plan before treating the round as proof of reduced execution risk."
    claimRefs: [CR001, CR002, CR003, CR005, CR005]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, legal, and safety exposure
    body: "No public source in the assigned pool establishes that Eka holds a particular industrial safety certification, has faced enforcement, or has been involved in litigation. That is an evidence gap, not evidence that no incident or legal exposure exists. The relevant exposure is operationally coupled to deployment: a flexible gripper applying force around people, equipment, or delicate parts must fit the customer's guarding, emergency-stop, validation, data, and change-control procedures. The reported custom gripper, force sensing, and manipulation claims should therefore be assessed through documentation and site testing rather than inferred from marketing or investor language. Before deployment, diligence should obtain the applicable machine-safety conformity basis, hazard analysis, validation records, software-update controls, incident ownership, insurance allocation, and the customer's responsibility for integration. A kill criterion is any unresolved safety hazard, missing validation artifact, or change to model behavior that cannot be tested and rolled back before production use."
    claimRefs: [CR007, CR007, CR008, CR008]
    tableRefs: [TR002]
  - id: operational-dependencies
    title: Operational, partner, and dependency risks
    body: "Eka's product depends on a stack rather than a model alone: sensing, a force-aware gripper, robot hardware, simulation and reinforcement-learning infrastructure, controls, site integration, maintenance, and human exception handling. The investor description explicitly frames sensing, model, controller, and hardware as a coupled system, which creates differentiation but also expands the failure surface. Public reporting places the work in industrial pick-and-place and wire-manipulation pilots while withholding customer names and operating results. That makes integrator compatibility, spare parts, calibration, support response, and the boundary between Eka and the customer especially important unknowns. Supplier or partner concentration is also not disclosed; a single gripper, robot-arm, compute, or integration dependency could delay deployment or increase cost. Diligence should map every critical counterparty and substitute, test degraded operation, and require service-level commitments. A thesis break is a dependency that cannot be replaced within the buyer's required recovery window or a pilot that needs persistent manual intervention to maintain nominal output."
    claimRefs: [CR010, CR011, CR010, CR013]
    tableRefs: [TR003]
  - id: financial-model
    title: Financial and execution model risks
    body: "The financing headline should not be confused with cash available for operations or with commercial traction. Public coverage reports a $150 million Series A and a reported $1.45 billion post-money valuation, but it does not disclose revenue, gross margin, burn, runway, contract value, or production deployment economics. A robotics company can consume capital through hardware iteration, testing, integration, support, inventory, and field reliability work even when its model is technically promising. The reported 1,500 picks per hour and comparison with a roughly 600-per-hour human baseline are not a complete unit-economics test: sources do not provide matched task definitions, intervention rates, downtime, damage, maintenance, or total cost of ownership. The immediate diligence ask is a bridge from pilot metrics to paid deployment economics, including hardware and software pricing, gross margin by deployment, installation labor, warranty exposure, support costs, working capital, and customer payback. A thesis break is a sustained inability to reach a buyer-approved payback period without undisclosed subsidies or continuing engineering services."
    claimRefs: [CR014, CR015, CR016, CR016]
    evidenceGaps:
      - type: private-evidence-only
        severity: material
        topic: financial-model
        missingEvidence: Audited or management-provided revenue, burn, runway, margins, pricing, backlog, and deployment-level unit economics.
        whyItMatters: The financing amount and reported valuation do not show whether the company can fund hardware commercialization or earn attractive returns from deployed systems.
        diligencePath: Request the latest management accounts, cash forecast, cap table, customer contracts, pricing schedule, deployment cost build, and a cohort-level contribution-margin bridge under NDA.
        relatedQuestionRefs: [QR007, QR008]
  - id: unresolved-diligence
    title: Monitoring plan and unresolved evidence
    body: "The public record supports a monitored, evidence-first posture rather than a conclusion that Eka has failed. Investors should track named production customers, months of continuous operation, completed-task rate, intervention and recovery time, unplanned downtime, safety stops, defect or damage rate, changeover performance, gross margin, paid conversion, and concentration by customer and integrator. Each metric needs a denominator, evaluation period, task definition, and attribution. Public sources repeatedly distinguish reported demonstrations from the still-unproven test of sustained production-shift performance. Until those records are available, residual exposure is high for commercialization, integration, safety validation, and financial model risk. The decision can improve if an independent or customer-authored evaluation shows repeatable results on representative tasks with transparent exceptions and a credible path to positive deployment economics; it should worsen if customer results remain undisclosed while valuation expectations rise."
    claimRefs: [CR018, CR019, CR020, CR021]
    evidenceGaps:
      - type: missing-source
        severity: material
        topic: production-validation
        missingEvidence: Independent or named-customer evidence of sustained production deployment, safety validation, uptime, intervention rate, and economics.
        whyItMatters: Demonstrations and investor descriptions cannot establish repeatability, generalization, or commercial readiness in a customer's operating environment.
        diligencePath: Require a reference call and signed pilot report covering at least one representative task across repeated shifts, with raw denominator, exception, safety, quality, and cost data.
        relatedQuestionRefs: [QR001, QR002, QR003, QR004, QR005, QR006]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule, jurisdiction or setting, status, likelihood, severity, mitigation maturity, residual exposure, diligence path]
    rows:
      - [Industrial machine safety and guarding, "Customer production site", "Not disclosed in assigned sources", medium, critical, "Unverified", "High until validated", "Obtain hazard analysis, conformity basis, guarding and emergency-stop validation"]
      - [Product or deployment liability, "Customer and supplier contracts", "Allocation not disclosed", medium, high, "Unverified", "High", "Review indemnities, insurance, acceptance criteria, and incident ownership"]
      - [Model and software change control, "Deployed robot software", "No public control framework", medium, high, "Unverified", "High", "Require versioning, rollback, validation after updates, and customer approval gates"]
      - [Privacy and operational data handling, "Factory data and telemetry", "Data practices not disclosed", low, medium, "Unverified", "Medium", "Review retention, access, training-use restrictions, and security controls"]
    notes: "Rows are a risk-oriented partial register based on public sources assigned to this chapter; absence of a disclosed case, certification, or incident is not evidence of absence. Likelihood and severity remain diligence judgments until the named artifacts are obtained."
    enumerationScope:
      coverage: partial
      basis: "Publicly visible safety, liability, software-change, and data-control exposure for an industrial robotics deployment as of 2026-10-22."
    claimRefs: [CR007, CR007, CR008, CR008]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, likelihood, severity, mitigation maturity, residual exposure, unresolved gap]
    rows:
      - [Simulation-to-reality transfer failure, medium, critical, "Partially described; not independently validated", "High", "Cross-condition and out-of-distribution production results"]
      - ["Intervention, reset, or recovery burden", high, high, "Not disclosed", "High", "Raw intervention frequency and recovery-time logs"]
      - [Forceful contact causes damage or unsafe motion, medium, critical, "Force sensing is described; validation absent", "High", "Safety cases, damage rates, and stop-test results"]
      - ["Hardware wear, calibration, or gripper failure", medium, high, "Lifecycle target described only as company claim", "Medium-high", "Duty-cycle test, consumables, calibration interval, and spares plan"]
      - [Cybersecurity or unauthorized model update, low, high, "Controls not disclosed", "Medium-high", "Threat model, access control, update signing, and incident response"]
    notes: "This register separates operational failure modes from confirmed incidents. Public sources provide design descriptions and reported claims, but not a complete reliability, safety, or security test record."
    claimRefs: [CR010, CR011, CR010, CR013, CR018]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, counterparty or role, concentration visibility, failure scenario, severity, mitigation, residual exposure, diligence path]
    rows:
      - [Custom force-sensing gripper, "Eka hardware and manufacturing chain", "Unknown", "Component shortage or redesign delays deployment", high, "Map suppliers and qualify substitutes", "High", "Obtain BOM, lead times, second sources, warranty and spares plan"]
      - [Industrial robot arm and controls, "Customer or integrator stack", "Unknown", "Interface or safety integration blocks go-live", high, "Run site-specific integration test", "High", "Name supported platforms, integrators, acceptance tests, and escalation owner"]
      - [Simulation and compute infrastructure, "Internal or external compute providers", "Unknown", "Training or inference capacity interruption", medium, "Test degraded mode and capacity plan", "Medium", "Review hosting, costs, failover, and data portability"]
      - [Pilot customers and reference sites, "Unnamed industrial customers", "Not disclosed", "No referenceable production evidence or delayed feedback", high, "Contract milestones and reference rights", "High", "Disclose customer segment, paid status, task, duration, and reference permission"]
    notes: "Counterparties and concentration are not publicly identified in the assigned sources. Unknown visibility is retained as a risk attribute rather than converted into a numerical concentration estimate."
    claimRefs: [CR002, CR003, CR010, CR011, CR010]
