  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: market-sizing
      missingEvidence: Customer-level pricing, contract value, deployment count, revenue, and task-level serviceable-market data.
      whyItMatters: Without buyer spend and deployment denominators, a precise SAM, SOM, or market-share claim would convert broad industry signals into unsupported company economics.
      diligencePath: Request a customer and pipeline schedule with signed or pilot contract values, deployment counts, task mix, recurring software or support components, and geographic scope.
      relatedQuestionRefs: [QM002, QM008]
    - type: missing-source
      severity: material
      topic: adoption
      missingEvidence: Independent, longitudinal production results covering uptime, interventions, safety stops, quality, and maintenance.
      whyItMatters: Demonstration throughput and company-reported success do not establish repeatable customer ROI or the cost of exceptions.
      diligencePath: Obtain anonymized pilot scorecards and a third-party or customer reference covering at least a sustained production period.
      relatedQuestionRefs: [QM003, QM007]
    - type: enumeration-incomplete
      severity: material
      topic: buyer-segmentation
      missingEvidence: Named customer segments, procurement owners, budget envelopes, and status-quo alternatives by workflow.
      whyItMatters: Industrial manipulation budgets are workflow-specific, so an installed-robot denominator cannot identify Eka's reachable buyers.
      diligencePath: Map three target workflows end to end with operations, automation, safety, finance, and procurement stakeholders and their approval gates.
      relatedQuestionRefs: [QM004, QM005]
