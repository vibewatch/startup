      - number: '1.1'
        title: Identity, product, and stage
        blocks:
          - type: paragraph
            body: >-
              Eka Robotics is described as a Cambridge, Massachusetts robotics company developing manipulation systems
              that combine visual perception, force-sensitive hardware, and learned physical actions. The product thesis
              is a full-stack approach: robotic hands supply contact information to a Vision-Force-Action model so a
              robot can adjust how it handles an object. Reporting places the company at the Series A stage and says
              unnamed industrial pilots are under way for pick-and-place and wire-handling tasks. That evidence supports
              an early deployment-stage identity, not a proven commercial business model. The assigned sources do not
              disclose pricing, contract structure, named customers, revenue, or a complete product catalogue, so these
              remain diligence gaps rather than inferred scale.
