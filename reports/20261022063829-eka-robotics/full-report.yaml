      - number: '3.3'
        title: Switching costs, distribution, and moat durability
        blocks:
          - type: paragraph
            body: >-
              A moat could emerge from force-rich task data, simulation-to-real learning, integrated hardware, and
              validation knowledge accumulated in deployments. The same integration can become a buyer liability if
              interfaces, maintenance, model updates, or support are proprietary. Incumbents and integrators may counter
              with installed equipment, service relationships, and proven safety processes, while buyers may multi-home
              across arms, grippers, controls, and software when interfaces permit. The assigned evidence does not
              disclose Eka customer contracts, revenue, or a detailed deployment timeline, and it does not disclose
              realized pricing or matched total cost. Servicta therefore recommends measuring interventions, recovery
              time, damage, safety stops, uptime, and integration cost in a pilot. Without those data, technical
              differentiation is credible but commercial lock-in and pricing power remain hypotheses.
            claimRefs:
              - CP009
              - CP011
              - CP013
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Competitive diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Eka merits a buyer-controlled pilot, not a conclusion that it has won the manipulation market. The
              evidence is strongest for a force-aware architecture and a company-reported throughput claim of about
              1,500 operations per hour versus a human baseline of about 600. It is weakest for named production
              deployments, shift-length reliability, realized pricing, customer outcomes, and comparable economics. An
              external expert quoted by SiliconANGLE questioned whether the system could run on an assembly line for a
              year without failure and whether it generalizes beyond pick-and-place. A decisive test should use the same
              objects, cycle definition, exception rules, safety boundary, and duration for Eka and at least one
              credible alternative. Until that evidence exists, the durable advantage is unproven and capital-rich
              peers, incumbent distribution, internal build, and the status quo remain viable displacement paths.
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
