        blocks:
          - type: paragraph
            body: >-
              The public material describes a robotics system aimed at industrial and manufacturing workflows, including
              pick-and-place, bin-picking, wire manipulation, and other contact-rich tasks. It does not publish a list
              price, lease or usage model, software fee, realized revenue, customer contract, deployment count, CAC,
