              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than manipulation-model startups. Eka combines visual understanding, force
              sensing, and action control for variable physical tasks, placing it against AI-native robotics companies
              such as Physical Intelligence, Generalist, Skild AI, THEKER, and Dream Labs. Those peers are visible
              primarily through financing signals in the assigned evidence, not matched product or deployment data.
              Buyers can also choose an incumbent robot-and-integrator cell, commission specialist vision or gripper
              automation, build internally, or preserve a human-operated workflow. These alternatives compete on the
              whole job rather than on model architecture alone: implementation risk, service access, safety validation,
              exception handling, and the cost of changing an operating process. The named startup financing figures
              indicate a capital-intensive race, but they do not measure revenue, installed base, market share, or
              production reliability.
            claimRefs:
