        title: Capital intensity and the next financing trigger
        blocks:
          - type: paragraph
            body: >-
              Eka's disclosed plan to expand model capability and accelerate deployments implies continued research,
              hardware, deployment, and support spending, but the pool does not quantify any of those categories. The
