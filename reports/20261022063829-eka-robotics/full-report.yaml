  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer problem
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all artificial intelligence or all industrial automation. Eka's reported
              product sits in robotic manipulation: systems that combine visual sensing, force feedback and physical
              action to pick, place, insert or otherwise handle objects in industrial workflows. The included spend is
              the hardware, gripper and sensing package, control/model software, integration, validation, maintenance
              and support needed to automate a defined manipulation task. Excluded from this boundary are general
              warehouse software, autonomous driving, pure vision inspection, and robotics projects whose main value is
              navigation rather than contact-rich handling. SiliconANGLE reports that Eka's model uses force data as
              well as camera images and that pilots are underway for pick-and-place and wire handling, while its cited
              expert cautions that generalization beyond pick-and-place remains open. This narrows the immediate wedge
              but also makes the market testable: a buyer can compare an exact task's completed cycles, interventions,
              safety stops and maintenance against its current process. Eka's own site frames the ambition as a single
              model that generalizes across objects, tasks, and environments, plus robots that are fast and reliable,
              but that positioning is not evidence of market share or deployment scale.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM009
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports multiple lenses but not a defensible company-specific TAM, SAM or SOM. The first
              lens is the installed industrial-robot base: the WorkNation source cites International Federation of
              Robotics data of 603,000 industrial robots installed in 2025, up 11%, with global operational stock above
              five million. That is an industry-scale denominator, not Eka's addressable spend, because it includes
              robots that do not require generalized manipulation and does not disclose replacement, software or
              integration budgets. The second lens is physical-AI financing: WorkNation cites Crunchbase's $47.4 billion
              across 521 physical-AI venture deals in the first half of 2026, while warning that the category includes
              autonomous vehicles, aerospace and drones. It is a capital-market signal, not customer spend. The third
              lens is task-level throughput: SiliconANGLE reports a company comparison of roughly 1,500 picks per hour
              versus a human baseline of about 600, with more than 95% pick success and objects up to one kilogram.
              Those figures are company-reported and lack public independent test conditions. A valuation and funding
              round can indicate investor expectations, but cannot be converted into revenue, ARR or serviceable market
              share. Until Eka discloses customer count, contract value, deployment duration and task-level economics,
              SAM/SOM remain unresolved.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.3'
        title: Buyer segments, drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The likely buyer is an industrial operator with a repetitive manipulation workflow where object variation
              or contact uncertainty limits conventional automation. Operations and manufacturing own the throughput and
              quality outcome; automation or engineering teams own integration; safety and compliance own release risk;
              finance owns the labor, uptime and total-cost case. The adoption trigger is a bounded task with measurable
              baseline performance, not a generic promise of general-purpose autonomy. The strongest drivers are labor
              substitution or augmentation, higher throughput, and flexibility when the object mix changes. The
              constraints are equally material: the public record does not name industrial pilot customers or provide
              sustained line results; an expert cited by SiliconANGLE questions whether the system can run on an
              assembly line for a year without failure; and the gripper is reported at five million duty cycles today
              against Eka's stated goal of twenty million, leaving lifecycle evidence incomplete. A current Eka hardware
              test-engineer posting also describes functional, environmental, stress and reliability testing plus
              certification work, including ISO 10218 and ingress protection, which indicates that validation and
              compliance are part of the deployment burden rather than solved assumptions. Buyers should therefore
              require a pilot scorecard covering completed-task rate, cycle time, exception recovery, damage, safety
              stops, uptime, integration cost and maintenance.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market conclusion
            body: >-
              Eka has a credible wedge into contact-rich industrial manipulation, but the available record supports
              market interest and technical promise rather than a quantified serviceable market or proven adoption
              curve.
            calloutType: insight
            claimRefs:
