      - number: '3.2'
        title: Capability, trust, and production evidence
        blocks:
          - type: paragraph
            body: >-
              Eka's reported differentiation is the coupling of vision, force feedback, learned control, and custom
              robotic hardware. Humanoids Daily says the model is trained with reinforcement learning in simulation,
              while a syndicated report describes force-sensitive grippers paired with a vision-force-action model. The
              company's reposted hardware-test role also covers validation from PCBAs and actuators through grippers and
              complete robotic arms, including safety and ingress-protection certification. These facts make the
              technical thesis more specific than a generic robotics-AI claim. They do not demonstrate lower total cost,
              smoother integration, or sustained reliability. The public video is expressly not a controlled competitor
              comparison, and the reviewed evidence provides no common test across Eka, an incumbent automation cell, a
              specialist system, internal build, and the current human process.
