        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Eka's product is described as a robotic manipulation system rather than a standalone software model. The
              reported workflow runs from sensing and perception through force-aware action, physical manipulation,
              deployment, and operational support. Servicta describes the core model as using visual and force
              information together, while the company-described recruiting material places the system at customer sites
