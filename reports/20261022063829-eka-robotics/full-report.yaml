figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public milestones show a rapid move from founding and seed financing to a large Series A, while production
      validation remains undisclosed.
    data:
      items:
        - date: '2025'
          label: Company founded
          details: >-
            SiliconANGLE's dated October 2026 report says Pulkit Agrawal started Eka the prior year with Tuomas
            Haarnoja, placing founding in 2025.
          tone: neutral
          claimRefs:
            - CO004
        - date: 2025-05
          label: Seed financing
          details: >-
            SiliconANGLE reports PitchBook data showing an $11 million seed round co-led by Obvious Ventures and E14
            Fund.
          tone: positive
          claimRefs:
            - CO015
        - date: '2026-10-20'
          label: Series A reported
          details: Current coverage reports a $150 million Series A co-led by Andreessen Horowitz and F-Prime.
          tone: positive
          claimRefs:
            - CO006
            - CO008
        - date: '2026-10-20'
          label: Post-money valuation reported
          details: Multiple reports place the post-money valuation at $1.45 billion.
          tone: neutral
          claimRefs:
            - CO007
        - date: '2026-10-20'
          label: Industrial pilots reported
          details: Reporting says unnamed industrial pilots are under way for pick-and-place and wire-handling work.
          tone: neutral
          claimRefs:
            - CO003
        - date: '2026-10-20'
          label: Throughput comparison reported
          details: >-
            Coverage attributes about 1,500 picks per hour to the company and compares it with a reported human
            benchmark of about 600.
          tone: neutral
          claimRefs:
            - CO010
        - date: '2026-10-20'
          label: Success-rate claim reported
          details: >-
            Coverage attributes a greater-than-95% pick success rate to the company, without a disclosed independent
            production protocol.
          tone: warning
          claimRefs:
            - CO011
            - CO013
    approximationNotes: >-
      The 2025 founding year is inferred from a dated report saying the company started the prior year. Capability items
      are disclosure dates, not independently verified launch or production dates.
    claimRefs:
      - CO003
      - CO004
      - CO006
      - CO007
      - CO010
      - CO011
      - CO013
      - CO015
  - id: FM001
    title: From market context to deployment proof
    type: pyramid
    summary: >-
      The available evidence moves from broad industrial context to narrower task-level signals without implying a
      numeric TAM-to-SOM conversion.
    data:
      nodes:
        - label: Global industrial robot context
          value: 603,000 installed in 2025; operational stock above 5 million
          tone: neutral
        - label: Physical-AI capital context
          value: $47.4B across 521 deals in H1 2026
          tone: neutral
        - label: Eka task-performance signal
          value: 1,500 picks/hour reported; over 95% pick success reported
          tone: positive
        - label: Pilot proof threshold
          value: Bounded task with measured recovery, safety, uptime, and integration cost
          tone: opportunity
        - label: Reliability diligence
          value: Five million duty-cycle rating reported; twenty million is a stated goal
          tone: warning
        - label: Open market proof
          value: Customer count, pricing, revenue, and company-specific SAM/SOM undisclosed
          tone: adverse
    approximationNotes: >-
      Layers are ordered from broad market context to narrower deployment proof; they are not additive, proportional, or
      a validated TAM/SAM/SOM funnel.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
  - id: FP001
    title: Reported capital signal versus evidence visibility
    type: quadrant
    summary: >-
      The map separates reported financing scale from the amount of product and deployment evidence present in the
      assigned pool; it is not a market-share or performance ranking.
    data:
      points:
        - label: Eka Robotics
          x: 2
          'y': 3
          note: >-
            $150M Series A and $1.45B reported valuation; technical detail and unnamed pilots are described, but
            sustained production results are not disclosed.
        - label: Physical Intelligence
          x: 3
          'y': 1
          note: Reported $11B valuation; the assigned pool supplies no matched product or deployment detail.
        - label: Generalist
          x: 2
          'y': 1
          note: >-
            Reported nearly $200M round at a $3B valuation; the assigned pool supplies no matched product or deployment
            detail.
        - label: Skild AI
          x: 3
          'y': 1
          note: Reported $1.4B raise at a valuation above $14B; the assigned pool supplies no matched production detail.
        - label: THEKER
          x: 1
          'y': 1
          note: Reported $85M Series A; the assigned pool supplies no matched product or deployment detail.
        - label: Dream Labs
          x: 1
          'y': 1
          note: Reported $90M seed round; the assigned pool supplies no matched product or deployment detail.
      xAxis: >-
        Reported capital signal (ordinal: 1=up to $100M round; 2=$100M-$999M round or valuation below $5B; 3=at least
        $1B raised or valuation at least $5B)
      yAxis: >-
        Assigned-pool evidence visibility (ordinal: 1=financing mention only; 2=technical description; 3=technical
        description plus unnamed pilots; 4=named sustained production result)
    approximationNotes: >-
      Ordinal coordinates use disclosed round or valuation bands exactly as stated in the notes, but those metrics are
      not economically equivalent. Evidence visibility scores only the assigned source pool and does not assert that
      undisclosed evidence is absent.
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
  - id: FI001
    title: Revenue model bridge and diligence gates
    type: flow
    summary: >-
      Public evidence supports a financing-funded development path, but the conversion from deployment activity to
      revenue and gross profit remains unverified.
    data:
      nodes:
        - id: funding
          label: Series A
          detail: $150 million reported financing
        - id: development
          label: Model and hardware development
          detail: Vision-Force-Action model, sensing, controller, and hardware
        - id: deployment
          label: Customer deployment
          detail: Expansion and faster deployments are reported goals
        - id: production
          label: Production operation
          detail: Sustained shifts, uptime, safety, and repeatability remain to be validated
        - id: revenue
          label: Revenue
          detail: Public value not disclosed
        - id: gross-profit
          label: Gross profit
          detail: Public value and cost bridge not disclosed
    claimRefs:
      - CI001
      - CI007
      - CI010
      - CI012
      - CI014
  - id: FE001
    title: Reported product and operating architecture
    type: stack
    summary: Eka's reported product spans sensing, learned manipulation, simulation, runtime deployment, and field validation.
    data:
      layers:
        - label: Physical interaction
          modules:
            - name: Robotic arms and grippers
              detail: Manipulate objects and components; custom gripper is reported to add force sensors.
            - name: Cameras and force signals
              detail: Provide visual and contact-related inputs for manipulation.
        - label: Learned manipulation
          modules:
            - name: Vision-Force-Action policy
              detail: Combines visual information, force feedback, and physical actions.
            - name: Control and recovery
              detail: Adjusts actions during contact; public recovery metrics are unavailable.
        - label: Training and validation
          modules:
            - name: Physics simulation
              detail: Generates simulated experience for reinforcement-learning training.
            - name: Real-robot evaluation
              detail: Transfers policies to physical systems; independent transfer evidence is limited.
        - label: Runtime and operations
          modules:
            - name: Edge ML and robotics software
              detail: Recruiting calls for ROS2-like middleware, Linux, C++/Python, and edge inference.
            - name: Telemetry and field support
              detail: Deployment roles cover logs, diagnostics, calibration, RCA, and feedback to R&D.
        - label: Quality and safety
          modules:
            - name: Hardware validation
              detail: Testing roles cover functional, environmental, stress, and reliability validation.
            - name: Certification and traceability
              detail: Public role requirements mention safety, ingress protection, and test documentation.
        - label: Integration boundary
          modules:
            - name: Customer controls and procedures
              detail: >-
                Production integration must account for site interfaces, safety controls, operators, and exception
                handling.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: Customer journey from pilot to expansion
    type: journey-map
    summary: >-
      Public evidence supports a pilot-stage journey, while production durability and expansion remain unverified
      checkpoints.
    data:
      nodes:
        - id: target
          label: Target workflow
          description: Bounded pick-and-place or wire-handling task with a measurable baseline
          touchpoints:
            - Buyer defines objects, cycle target, quality boundary, and safety constraints
        - id: pilot
          label: Industrial pilot
          description: SiliconANGLE reports undisclosed industrial-customer pilots
          touchpoints:
            - Pilot customer and site are not named in the assigned evidence
        - id: validate
          label: Operational validation
          description: Test throughput, success, uptime, interventions, recovery, and maintenance
          touchpoints:
            - Independent duration and denominator are not publicly disclosed
            - Company recruiting indicates validation and certification work remains active
        - id: rollout
          label: Production rollout
          description: Repeatable deployment across a line, shift, or site
          touchpoints:
            - No retained source establishes a production rollout
        - id: expand
          label: Expansion and renewal
          description: Additional tasks, sites, or repeat purchases
          touchpoints:
            - No NRR, renewal, contract length, or customer concentration evidence is retained
        - id: support
          label: Support and durability
          description: Sustained service, maintenance, and exception handling after rollout
          touchpoints:
            - Uptime, intervention burden, maintenance ownership, and support response are not publicly disclosed
    claimRefs:
      - CU001
      - CU004
      - CU007
      - CU009
      - CU014
      - CU015
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual exposures are production transfer, safety validation, intervention burden, and opaque
      deployment economics.
    data:
      columns:
        - label: Low
          detail: Lower likelihood or impact still requires monitoring.
        - label: Medium
          detail: Material exposure that can be reduced with evidence and controls.
        - label: High
          detail: Significant residual exposure before named validation.
        - label: Critical
          detail: Thesis-break exposure if not controlled before production use.
      rows:
        - label: Production transfer
          note: Sustained production-shift results are not publicly disclosed.
          values:
            - null
            - null
            - High
            - Critical
        - label: Safety and liability
          note: Certification, hazard analysis, and liability allocation are not disclosed.
          values:
            - null
            - High
            - High
            - Critical
        - label: Dependency concentration
          note: Supplier, integrator, compute, and customer concentration are unknown.
          values:
            - null
            - Medium
            - High
            - null
        - label: Financial model
          note: Revenue, burn, runway, margins, and deployment economics are not disclosed.
          values:
            - null
            - Medium
            - High
            - null
        - label: Intervention burden
          note: Public accounts do not provide raw reset, recovery, or human-assistance rates.
          values:
            - null
            - Medium
            - High
            - null
        - label: Hardware lifecycle
          note: Durability targets are company-reported and lack an independent lifecycle record.
          values:
            - null
            - Medium
            - High
            - null
    approximationNotes: >-
      Qualitative placement reflects disclosed evidence gaps and reported operating hurdles; it is not a statistical
      probability model or an incident count.
    claimRefs:
      - CR003
      - CR007
      - CR010
      - CR014
      - CR018
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The reported financing and technical promise lead to a research-more recommendation until commercial and valuation
      denominators are verified.
    data:
      nodes:
        - id: scale
          label: Reported $150M Series A
          note: Transaction terms are reported, not independently verified.
        - id: technical
          label: Reported 1,500 ops/hour
          note: Company-reported performance; no independent test in assigned evidence.
        - id: commercial
          label: Revenue and contracts undisclosed
          note: Named paid production deployments remain a diligence gate.
        - id: pricing
          label: $1.45B reported post-money
          note: Use as a financing mark, not a fair-value conclusion.
        - id: downside
          label: Sim-to-real and deployment risk
          note: Uptime, safety, durability, and customer conversion are unresolved.
        - id: recommendation
          label: Research-more
          note: Reassess after customer, operating, and financing evidence.
      edges:
        - from: scale
          to: technical
        - from: technical
          to: commercial
        - from: commercial
          to: pricing
        - from: pricing
          to: downside
        - from: downside
          to: recommendation
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV010
      - CV014
