  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The highest-consequence risk is commercialization transfer. Public accounts describe pilots,
              demonstrations, and reported laboratory throughput, but do not identify customers, disclose pilot revenue,
              or provide sustained production-line results. That leaves a material gap between technical promise and
              deployable operating performance. A thesis break would be repeated failure to meet a buyer's agreed
              cycle-time, completed-task, quality, safety, and uptime thresholds on representative production work, or
              an integration burden that erases the expected labor and throughput benefit. The next risk is model
              generalization: force feedback and simulation may improve recovery from contact variation, but
              simulation-to-reality transfer remains a recognized challenge and the public sources do not establish
              performance across shifts, layouts, materials, or unfamiliar task families. Financial risk follows from
              opacity: the reported $150 million Series A and $1.45 billion post-money valuation provide capital and
              market validation, not evidence of revenue, cash runway, margins, or customer concentration. Investors
              should require a task-specific pilot protocol, failure and intervention logs, lifecycle-cost assumptions,
              and a financing plan before treating the round as proof of reduced execution risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR007
              - CR008
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR007
              - CR010
              - CR014
              - CR018
      - number: '7.2'
        title: Regulatory, legal, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              No public source in the assigned pool establishes that Eka holds a particular industrial safety
              certification, has faced enforcement, or has been involved in litigation. That is an evidence gap, not
              evidence that no incident or legal exposure exists. The relevant exposure is operationally coupled to
              deployment: a flexible gripper applying force around people, equipment, or delicate parts must fit the
              customer's guarding, emergency-stop, validation, data, and change-control procedures. The reported custom
              gripper, force sensing, and manipulation claims should therefore be assessed through documentation and
              site testing rather than inferred from marketing or investor language. Before deployment, diligence should
              obtain the applicable machine-safety conformity basis, hazard analysis, validation records,
              software-update controls, incident ownership, insurance allocation, and the customer's responsibility for
              integration. A kill criterion is any unresolved safety hazard, missing validation artifact, or change to
              model behavior that cannot be tested and rolled back before production use.
            claimRefs:
              - CR007
              - CR007
              - CR008
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR010
              - CR011
              - CR010
              - CR013
              - CR018
      - number: '7.3'
        title: Operational, partner, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Eka's product depends on a stack rather than a model alone: sensing, a force-aware gripper, robot
              hardware, simulation and reinforcement-learning infrastructure, controls, site integration, maintenance,
              and human exception handling. The investor description explicitly frames sensing, model, controller, and
              hardware as a coupled system, which creates differentiation but also expands the failure surface. Public
              reporting places the work in industrial pick-and-place and wire-manipulation pilots while withholding
              customer names and operating results. That makes integrator compatibility, spare parts, calibration,
              support response, and the boundary between Eka and the customer especially important unknowns. Supplier or
              partner concentration is also not disclosed; a single gripper, robot-arm, compute, or integration
              dependency could delay deployment or increase cost. Diligence should map every critical counterparty and
              substitute, test degraded operation, and require service-level commitments. A thesis break is a dependency
              that cannot be replaced within the buyer's required recovery window or a pilot that needs persistent
              manual intervention to maintain nominal output.
            claimRefs:
              - CR010
              - CR011
              - CR010
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR011
              - CR010
      - number: '7.4'
        title: Financial and execution model risks
        blocks:
          - type: paragraph
            body: >-
              The financing headline should not be confused with cash available for operations or with commercial
              traction. Public coverage reports a $150 million Series A and a reported $1.45 billion post-money
              valuation, but it does not disclose revenue, gross margin, burn, runway, contract value, or production
              deployment economics. A robotics company can consume capital through hardware iteration, testing,
              integration, support, inventory, and field reliability work even when its model is technically promising.
              The reported 1,500 picks per hour and comparison with a roughly 600-per-hour human baseline are not a
              complete unit-economics test: sources do not provide matched task definitions, intervention rates,
              downtime, damage, maintenance, or total cost of ownership. The immediate diligence ask is a bridge from
              pilot metrics to paid deployment economics, including hardware and software pricing, gross margin by
              deployment, installation labor, warranty exposure, support costs, working capital, and customer payback. A
              thesis break is a sustained inability to reach a buyer-approved payback period without undisclosed
              subsidies or continuing engineering services.
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR016
      - number: '7.5'
        title: Monitoring plan and unresolved evidence
        blocks:
          - type: paragraph
            body: >-
              The public record supports a monitored, evidence-first posture rather than a conclusion that Eka has
              failed. Investors should track named production customers, months of continuous operation, completed-task
              rate, intervention and recovery time, unplanned downtime, safety stops, defect or damage rate, changeover
              performance, gross margin, paid conversion, and concentration by customer and integrator. Each metric
              needs a denominator, evaluation period, task definition, and attribution. Public sources repeatedly
              distinguish reported demonstrations from the still-unproven test of sustained production-shift
              performance. Until those records are available, residual exposure is high for commercialization,
              integration, safety validation, and financial model risk. The decision can improve if an independent or
              customer-authored evaluation shows repeatable results on representative tasks with transparent exceptions
              and a credible path to positive deployment economics; it should worsen if customer results remain
              undisclosed while valuation expectations rise.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Production proof is the gating risk
            body: >-
              The assigned sources describe pilots and laboratory or demonstration claims, while customer names, pilot
              revenue, and sustained production results remain undisclosed. Treat production-transfer evidence as a
              prerequisite to underwriting scale.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR018
          - type: callout
            title: Financing is not operating capacity
            body: >-
              A reported $150 million financing and $1.45 billion post-money valuation do not establish cash runway,
              revenue, margins, or deployment-level returns.
            calloutType: assumption
            claimRefs:
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Eka's positive case is a differentiated robotics thesis backed by a reported financing, a force-sensitive
              gripper, and a Vision-Force-Action model trained through simulation and reinforcement learning. Multiple
              reports describe a claimed 1,500 operations per hour versus roughly 600 for a human and applications
              including pick-and-place, wire handling, light-bulb insertion, and other contact-rich tasks. The
              anti-thesis is equally material: the performance numbers are company-reported, no independent test is
              cited in the assigned evidence, pilots are described without named customers, and revenue and contracts
              are not disclosed. The financing therefore validates investor interest more than business-model maturity.
              A buy call would require evidence that the laboratory or pilot claims translate into paid, durable
              production deployments.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV014
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The reported financing context is unusually clear on headline terms but weak on the operating denominator
              needed for valuation. Pomegra, DutchStartup, TechFundingNews, WOWTALE, Robothot, Jawlah, and Multiples
              each report a $150M Series A around October 20, 2026, at approximately $1.4B to $1.45B post-money, with
              a16z and F-Prime leading. These are largely syndicated or overlapping accounts, not independent marks.
              Multiples presents the company as privately held with licensing and product sales, while Pomegra
              explicitly says revenue and customer contracts were not disclosed. Tracxn's October 15 record still labels
              Eka unfunded and reports no funding, a direct data conflict that should be resolved against transaction
              documents rather than averaged away. Entry discipline should therefore be milestone- and price-sensitive,
              with no supported revenue multiple or cash-runway calculation.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, comparables, and downside
        blocks:
          - type: paragraph
            body: >-
              The bull case is that force sensing and simulation-trained control produce repeatable deployment
              economics, pilots convert to named paid customers, and the reported performance advantage supports a
              higher value as the company expands tasks. The base case is that the round funds technical and commercial
              validation while public evidence remains insufficient to price operating performance. The bear case is
              that sim-to-real transfer, uptime, durability, safety, or customer integration costs prevent conversion,
              leaving a premium private mark unsupported. Multiples lists several comparables and reports very different
              company-level valuations, including Physical Intelligence at $11B and Skild at $14B in the surrounding
              coverage, but those figures are reported private marks rather than a comparable revenue or EBITDA set. No
              probability-weighted range is supportable without revenue, margin, retention, deployment, dilution,
              liquidation-preference, and cap-table inputs.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV004
            claimRefs:
              - CV002
              - CV005
              - CV010
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV010
              - CV014
      - number: '8.4'
        title: Recommendation and decision gates
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more rather than buy, track, or avoid. The evidence supports a credible
              technical and financing narrative, but not a sufficiently observable commercial cash-flow base or a
              reliable denominator for entry valuation. The next decision should be tied to named production customers,
              paid contract value, deployment uptime, gross margin or contribution economics, repeatability across
              tasks, and financing terms. A thesis break would be a failed or delayed production deployment, materially
              lower throughput or success under independent testing, evidence that force-sensing hardware cannot meet
              durability or safety requirements, or a financing structure that creates substantial preference or
              dilution overhang. If those gates clear, a new price-sensitive assessment can use a business-model-
              matched method; until then, the current reported valuation should be treated as an investor mark with
              substantial execution uncertainty.
            claimRefs:
              - CV002
              - CV005
              - CV008
              - CV010
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Research-more: the reported financing and technical claims justify continued diligence, but public
              evidence does not support a price-sensitive buy decision.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV010
              - CV014
          - type: callout
            title: Primary valuation risk
            body: >-
              The reported $1.45B post-money mark has no public revenue or customer-contract denominator, while the main
              performance evidence remains company-reported.
            calloutType: risk
            claimRefs:
              - CV002
              - CV005
              - CV007
