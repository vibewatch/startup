      - ["Undisclosed industrial customers", "Manufacturing or industrial operations", "Wire handling", "Pilot reported", "No customer-attributed outcome disclosed", "Names, sites, duration, and results unavailable"]
      - ["No named customer in assigned sources", "Logistics or warehouse operations", "No deployment evidenced", "Unverified", "No outcome available", "A customer reference, procurement record, or customer-controlled case study is needed"]
