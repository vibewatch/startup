  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: named-customer-proof
      missingEvidence: "A named customer reference, procurement record, or customer-controlled case study showing production versus pilot status and an outcome."
      whyItMatters: "Without customer-attributed proof, the report cannot distinguish investor-backed technical promise from paid, durable adoption."
      diligencePath: "Request two customer references and redacted statements of work; verify site, task, duration, paid status, baseline, outcome, and permission to contact the operator."
      relatedQuestionRefs: [QU005, QU006]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: retention-expansion
      missingEvidence: "Account count, paid deployment count, renewal or repeat-purchase data, contract duration, and customer concentration by revenue or deployment."
      whyItMatters: "Retention and concentration determine whether a pilot-led motion can become durable revenue and whether one account or partner could dominate the commercial outcome."
      diligencePath: "Obtain a dated cohort or deployment schedule with denominators, renewal status, expansion events, and the share attributable to the largest customer and channel."
      relatedQuestionRefs: [QU003, QU006, QU007]
    - type: missing-source
      severity: material
      topic: adoption-metrics
      missingEvidence: "Independent test protocol for the 1,500-operations-per-hour and greater-than-95%-success claims, including retries, human interventions, object mix, uptime, and sample size."
      whyItMatters: "Headline throughput and success rates can overstate customer value if they exclude resets, exceptions, downtime, or downstream quality failures."
      diligencePath: "Run a buyer-observed pilot on representative objects and compare matched human and robotic baselines over multiple shifts with all interventions recorded."
      relatedQuestionRefs: [QU004, QU008]
    - type: enumeration-incomplete
      severity: material
      topic: customer-segmentation
      missingEvidence: "An exhaustive or bounded list of customer verticals, geographies, buyer roles, and use cases, with each named deployment classified as pilot or production."
      whyItMatters: "Segment breadth and repeatability are unknown, so expansion potential and procurement friction cannot be assessed from the current public record."
      diligencePath: "Request a customer and pipeline segmentation schedule, then sample evidence for each segment and reconcile it to deployment and revenue records."
      relatedQuestionRefs: [QU001, QU002, QU007]
    - type: conflicting-data
      severity: material
      topic: adoption-stage
      missingEvidence: "Primary documentation reconciling Emergent's commercial-availability and early-adopter shipment claims with reports that describe only unnamed pilots."
      whyItMatters: "Shipment, pilot, paid deployment, and production use are different adoption stages with materially different implications for commercial traction."
      diligencePath: "Request a dated deployment ledger identifying each shipped system, customer status, paid or evaluation basis, site, operating duration, and production acceptance criteria."
      relatedQuestionRefs: [QU003, QU005, QU009]
