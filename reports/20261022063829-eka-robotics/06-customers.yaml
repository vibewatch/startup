company:
  name: Eka Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence points to an early B2B robotics company pursuing industrial pilots, but
    the assigned sources do not identify customers, disclose deployment results, or provide
    retention and revenue denominators. The customer thesis is therefore promising but
    unproven: narrow, measured pilots are the clearest path to validate adoption, durability,
    and expansion.
sections:
  - id: buyer-and-use-case-segments
    title: Buyer and use-case segments
    body: >-
      The available evidence places Eka in a B2B industrial-automation motion rather than a
      self-serve software market. SiliconANGLE reports that the company is running undisclosed
      industrial-customer pilots on pick-and-place and wire-handling work, while its reported
      product positioning centers on a force-sensing gripper and a vision-force-action model.
      That combination suggests a buyer set involving manufacturing or logistics operators,
      automation integrators, and operational teams responsible for repetitive manipulation.
      It does not establish which party signs the contract, owns the robot, or pays for
      integration. The practical initial segment is likely a bounded workflow where object
      variation creates labor or automation friction and failures can be safely recovered.
      This is a diligence framing, not evidence of an installed customer base. The assigned
      public material does not name a customer, facility, geography of deployment, contract
      value, or production status, so logos or investor interest should not be treated as
      proof of customer adoption.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: >-
      Adoption evidence is at the pilot-and-demonstration stage in the retained material.
      SiliconANGLE says pilots are underway but does not name the industrial customers or
      publish their operating results; the same report attributes a 1,500-operations-per-hour
      figure and a greater-than-95% pick-success figure to Eka. Those metrics describe
      reported system performance, not active accounts, paid deployments, renewal, or
      customer return on investment. A separate Servicta analysis makes the same commercial
      distinction, stating that pilot conditions, uptime, task breadth, and long-run
      reliability still need independent validation. Emergent makes a materially stronger
      claim that systems are commercially available and shipping to early adopters, but it
      supplies no customer identity or operating result and is not reconciled with the
      pilot-stage accounts. A company-issued test-engineer posting also shows Eka building
      functional, environmental, stress, reliability, and certification processes. The
      trajectory is therefore best described as commercialization in progress, not verified
      expansion. The most decision-useful next evidence is a customer-attributed production
      deployment with a defined baseline, operating duration, intervention rate, uptime,
      quality result, and denominator for any success percentage.
    claimRefs: [CU004, CU005, CU006, CU013, CU014, CU015]
    tableRefs: [TU002]
  - id: named-proof-and-expansion-risk
    title: Named proof, expansion, and concentration risk
    body: >-
      No retained source names a paying customer or provides a customer-controlled outcome.
      WorkNation and KuCoin repeat the financing and technical thesis, while BuiltIn's page
      explicitly warns that its material was generated from popular LLM responses and was not
      reviewed or approved by Eka; none supplies customer references or retention evidence.
      That absence is not proof that customers do not exist, but it prevents verification of
      production deployment, repeat purchase, concentration, channel dependence, or
      land-and-expand behavior. The reported use cases—pick-and-place and wire handling—are
      narrower than a general-purpose automation claim and should be evaluated separately.
      Emergent's assertion that systems are shipping to early adopters raises, rather than
      resolves, the need to distinguish a shipment from a paid production rollout. Expansion
      should be treated as an open commercial hypothesis until Eka discloses how a pilot
      becomes a paid rollout, who performs integration, what support obligations remain with
      the vendor, and whether performance survives new objects, layouts, shifts, and sites. A
      customer reference list, redacted contracts, or procurement records would materially
      improve confidence.
    claimRefs: [CU007, CU008, CU009, CU013, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
