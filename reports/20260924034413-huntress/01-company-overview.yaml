chapter:
  number: 1
  title: Company Overview
  summary: Huntress is a scaled SMB managed-security platform with offensive-security roots, a broader leadership bench, and
    a 2026 ARR milestone above $250M. The main open questions are governance detail, exact cap-table mechanics, and the precise
    mix of capital raised versus secondary valuation.
sections:
- id: SO001
  title: Identity, Business Model, and Current Scale
  body: 'Huntress is a privately held, Maryland-based cybersecurity company focused on managed security for SMBs through MSPs
    and adjacent channel partners. The public story is unusually consistent across official pages, company blogs, and independent
    profiles: the business bundles endpoint, identity, SIEM, awareness training, and posture-management products with a 24/7
    human-led SOC, then sells that outcome at simple per-unit prices. The 2026 refresh matters because the company is no longer
    a sub-$100M ARR startup. The latest official release says Huntress is above $250M ARR, growing 65% year over year, and
    protecting 270,000+ businesses worldwide. That scale makes Huntress a genuine platform vendor, not just a niche endpoint
    tool, but it also raises the bar for governance clarity, margin quality, and IPO readiness.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO007
  - CO008
  - CO009
  tableRefs:
  - TO001
- id: SO002
  title: Leadership, Governance, and Founder-Market Fit
  body: 'The founder story remains a core diligence input because the company’s product and GTM choices are tightly linked
    to the founding team’s offensive-security background. The official leadership page now shows a broader operating bench:
    Maria Izurieta in finance, Prakash Ramamuram in product, Paul Strelzick in go-to-market, Eric Stride as CSO, and Daniel
    Westendorf as an innovation lead. That is a material evolution from founder-only heroics toward a more durable operating
    company. At the same time, the board and control structure are only partially visible. Public sources identify several
    investors and board members, but not the complete voting and protective-provision package. For a late-stage private company,
    that missing detail is not fatal, but it is a real diligence gap for any investor underwriting liquidity, future dilution,
    or a late-stage secondary entry.'
  claimRefs:
  - CO004
  - CO010
  - CO011
  - CO012
  tableRefs:
  - TO002
  - TO003
- id: SO003
  title: Funding, Milestones, and Adverse/Unclear Items
  body: 'Huntress’s capital history shows a classic growth-company arc: early support, a scale-up Series B and C, then the
    June 2024 Series D that pushed the company above unicorn status. Multiple independent sources put total capital raised
    near the high-$200M range, but the precise figure changes depending on whether debt, close timing, or round tranches are
    included. The current milestone cadence is strong: the company crossed $100M ARR in 2024 and then, in July 2026, announced
    a much larger ARR base, broader international coverage, and a substantially larger workforce. The unresolved items are
    equally important: no public S-1, no fully disclosed cap table, and no open-book view of liquidation preference or governance
    rights. Those are normal for a private company, but they are exactly the things a late-stage investor would want to confirm
    before paying a premium secondary price.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO012
  figureRefs:
  - FO001
