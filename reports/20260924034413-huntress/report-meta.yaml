companyProfile:
  summary: >-
    Huntress is a privately held cybersecurity company founded in 2015 by Kyle Hanslovan, Chris Bisnett, and John
    Ferrell. It sells a managed security platform for SMBs through MSP partners, combining endpoint, identity, SIEM,
    awareness training, and posture products with a 24/7 human-led SOC. In July 2026 the company said it had surpassed
    $250M ARR and was protecting 270,000 businesses, confirming that it has moved far beyond startup scale while still
    leaving core private-company economics opaque.
