  title: Customers
  summary: Customer proof is strongest at the MSP layer, where named case studies, testimonials, and channel references show
    real adoption. The main unresolved risk is concentration and retention visibility by cohort.
sections:
- id: SU001
  title: Customer Segments and Adoption Pattern
  body: 'Huntress’s customer base is best understood as a mix of SMB end customers, MSP partners, and regulated small businesses
    that need outcomes instead of an internal security team. The public evidence shows strong partner adoption, not just individual
    software adoption. This matters because revenue is likely to expand in two steps: first the partner standardizes Huntress,
    then the partner expands the footprint across more endpoints, identities, and log sources. The current scale metrics—270,000
    businesses, 15M identities, and 5.5M endpoints—suggest adoption is broad enough to be durable, but the exact mix by customer
    segment is not public.'
  claimRefs:
  - CU001
  - CU002
  - CU008
  tableRefs:
  - TU001
  - TU002
- id: SU002
  title: Named Customer Proof and Retention Signals
  body: The best named proof comes from MSP case studies. WTG is the strongest because it is specific about deployment friction,
    Microsoft Defender integration, and day-to-day value. Integris provides a second named proof point, and the homepage testimonials
    add qualitative support from multiple partner personas. Retention and satisfaction look strong—130% NRR and 99% CSAT—but
    those are still company-claimed metrics. That means the report can say Huntress likely has good expansion, but it cannot
    claim independent cohort proof without more data. The diligence gap is top-customer concentration and churn by partner,
    which are exactly the metrics that matter when a channel business scales quickly.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU009
  tableRefs:
  - TU003
  figureRefs:
  - FU001
- id: SU003
  title: Expansion and Concentration Risk
  body: Huntress appears to expand through channel standardization rather than direct sales heroics. That is operationally
    efficient, but it also makes the partner layer essential. If MSPs multi-home or shift to another managed SOC provider,
    Huntress can lose volume even if the product remains strong. The public record supports broad use, good partner sentiment,
    and geographic expansion, yet it does not disclose concentration, churn, or renewal cohorts. Therefore, customer quality
    should be judged as “strong but not fully audited.” For valuation purposes, the key question is whether expansion comes
    from deeper attach across the same partners or merely from new partner additions that could be fragile.
  claimRefs:
  - CU007
  - CU010
  - CU011
  - CU012
