  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按托管成效覆盖广度与产品自助服务程度划分的常规竞争定位。
    data:
      points:
        - label: Huntress
          x: 4
          'y': 3
          rationale: Endpoint + identity + SIEM + SAT + posture, but still human-SOC heavy
          claimRefs:
            - CP002
            - CP012
        - label: Microsoft 捆绑方案
          x: 2
          'y': 4
          rationale: Very broad, but often not operated as a managed outcome
          claimRefs:
            - CP004
        - label: 托管 SOC 同业
          x: 4
          'y': 4
          rationale: Broader but quote-based and heavier operations
          claimRefs:
            - CP001
            - CP003
        - label: 端点优先型同业
          x: 3
          'y': 4
          rationale: Strong telemetry depth, less cross-domain breadth
          claimRefs:
            - CP007
        - label: 白标 SOC
          x: 4
          'y': 3
          rationale: Partner-owned delivery and brand control
          claimRefs:
            - CP011
        - label: 维持现状 / 自建
          x: 2
          'y': 3
          rationale: Internal teams can be broad but labor constrained
          claimRefs:
            - CP003
            - CP010
