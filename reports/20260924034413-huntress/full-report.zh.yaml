            figureRef: FI001
            claimRefs: []
      - number: '4.3'
        title: 成本结构、利润率动因与核保缺口
        blocks:
          - type: paragraph
            body: >-
              核心财务风险在于软件与服务双重经济属性的混合交织。Huntress 必须持续投入资金支撑分析师主导的 SOC、客户支持、合作伙伴赋能以及不间断的产品研发。这促使尽调焦点转向毛利率、资金消耗率以及 MSP
              渠道的实际经济效益。公开记录显示公司已有相当规模，足以规避近期的再融资压力，但并未透露其利润率究竟是在向典型 SaaS
              靠拢，还是长期固守偏重人力的重服务模式。审慎的投资评估立场，应当是将公开的业务增长与私密的单位经济效益区分开来，在管理层予以确切披露前，不宜轻言当前的估值倍数完全合理。
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI010
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与功能模块
        blocks:
          - type: paragraph
            body: >-
              Huntress 并非单一工具，而是一套将终端、身份、SIEM、安全意识和安全姿态管理产品与 24/7 SOC
              紧密结合的托管安全平台。这种模块化形态至关重要，因为各条产品线分别切中买方的不同痛点：终端检测与响应、身份滥用、安全日志记录、员工行为偏差以及配置漂移。如今该平台更像是一套面向中小企业的安全操作系统，而非单纯的单点产品。关键尽调疑问在于：公司究竟是在扎实构建更广泛的综合平台，还是仅在若干相邻产品门类外层套上了托管服务包装。
            claimRefs:
              - CE001
