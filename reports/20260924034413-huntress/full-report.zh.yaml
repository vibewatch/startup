      - number: '1.3'
        title: 融资历程、关键里程碑与不利/存疑事项
        blocks:
          - type: paragraph
            body: >-
              Huntress 的融资历程展现了成长期企业的典型轨迹：早期孵化、B 轮与 C 轮规模化扩张，随后 2024 年 6 月的 D 轮融资助其迈入独角兽行列。多家独立信源将累计融资金额划定在 $200M
              高位区间附近，但具体数额因是否计入债务、交割时点或分期到账而有所差异。当前里程碑节奏强劲：公司于 2024 年迈过 $100M ARR 门槛，继而在 2026 年 7 月公布了规模大得多的 ARR
              体量、更广泛的国际业务版图以及显著扩充的员工队伍。尚未明确的考量项同样关键：未提交公开 S-1
              文件、未完全披露股权结构表，亦无公开透明的清算优先权或治理权明细。这些在私营企业中固然常见，却正是后期投资者在支付二级市场溢价前必须核实的关键事项。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
