chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、商业模式与当前规模
        blocks:
          - type: paragraph
            body: >-
              Huntress 是一家总部位于马里兰州的私营网络安全公司，专注于通过 MSP
              及相邻渠道合作伙伴为中小企业提供托管安全服务。官方页面、公司博客与独立分析中展现的公开叙事高度一致：业务将终端、身份、SIEM、安全意识培训与安全姿态管理产品同 24/7 人工主导的 SOC
              相结合，随后以简明的单体单价销售该安全成效。2026 年的数据更新意义重大，因为公司已不再是 ARR 低于 $100M 的初创企业。最新官方新闻稿称，Huntress 的 ARR 已超 $250M，同比增长
              65%，在全球保护 270,000+ 家企业。这种规模让 Huntress 成为真正的平台型厂商，而非单纯的利基终端工具，但同时也对治理透明度、利润率质量以及 IPO 准备度提出了更高要求。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: 领导团队、公司治理与创始人契合度
        blocks:
          - type: paragraph
            body: >-
              创始人背景仍是核心尽调依据，因为公司产品与 GTM 抉择均紧密根植于创始团队的进攻性安全经历。官方管理层页面目前展现出更完备的高管班底：Maria Izurieta 掌管财务，Prakash Ramamuram
              统筹产品，Paul Strelzick 负责市场拓展，Eric Stride 出任 CSO，Daniel Westendorf
              担任创新主管。这标志着公司从纯粹依赖创始人的个人运作，实质迈向更稳健的规范化运营企业。与此同时，董事会与控制权架构仅部分可见。公开渠道披露了数位投资人与董事会席位，但未见完整的表决权与保护性条款约定。这类细节在成长期后期私营企业中虽非致命缺陷，但任何投资者在评估流动性、未来稀释或后期老股交易时，都需面对切实的尽调缺口。
            claimRefs:
              - CO004
              - CO010
              - CO011
              - CO012
