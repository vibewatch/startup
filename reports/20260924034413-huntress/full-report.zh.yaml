      - CV006
      - CV007
      - CV010
    notes: 情景测算仅具方向性参考意义，并非精确的现金流折现输出。
figures:
  - id: FO001
    title: Huntress 里程碑时间线
    type: timeline
    summary: 时间线记录公司创立、早期融资、平台拓展，以及 2026 年 ARR 与国际化规模的跃升。
    data:
      items:
        - label: 创立
          date: '2015'
          detail: Kyle Hanslovan、Chris Bisnett 与 John Ferrell 创立 Huntress
          tone: positive
          claimRefs:
            - CO001
        - label: Series B / 平台规模化
          date: '2021'
          detail: 公司跨过早期产品阶段，业务走向规模化
          tone: positive
          claimRefs:
            - CO005
        - label: Series D
          date: Jun 2024
          detail: 完成 $150M 融资，估值达 $1.5B+
          tone: positive
          claimRefs:
            - CO005
        - label: $100M ARR
          date: Sep 2024
          detail: 官方公布达成半人马（Centaur）里程碑
          tone: positive
          claimRefs:
            - CO007
        - label: 全球扩张
          date: 2025-2026
          detail: EMEA、APAC 与 LATAM 渠道增长
          tone: positive
          claimRefs:
            - CO008
            - CO009
        - label: $250M ARR
          date: Jul 2026
          detail: 公司称 ARR 突破 $250M
          tone: positive
          claimRefs:
            - CO007
  - id: FM001
    title: 收窄后的市场规模金字塔
    type: pyramid
    summary: 自上而下的需求总量、受约束的 SMB 契合客群、MSP 附加渗透与当前已变现切入点。
    data:
      nodes:
        - label: 全球企业总量
          value: 270M+
          detail: 公司声称需要安全防护的全球企业数量
          claimRefs:
            - CM004
        - label: SMB / MSP 契合客群
          value: subset
          detail: 内部安全人员配备较少的中小型企业
          claimRefs:
            - CM001
            - CM011
        - label: 可变现安全支出
          value: endpoint + identity + SIEM + SAT + posture
          detail: 具备公开标价的按单元计费服务
          claimRefs:
            - CM002
            - CM005
        - label: 当前 Huntress 切入点
          value: $250M+ ARR
          detail: 当前已验证的变现市场，而非理论 TAM
          claimRefs:
            - CM003
            - CM009
        - label: 合作伙伴附加渗透
          value: multi-product
