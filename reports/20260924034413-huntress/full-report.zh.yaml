        blocks:
          - type: paragraph
            body: >-
              直观呈现的技术架构由托管 SaaS 平台、终端 Agent 及 SOC 工作流共同组成。公开集成显示，安全姿态数据可直接注入 Tailscale 访问策略；同时发布说明显示出活跃的 Agent
              版本迭代、功能分批推移以及面向合作伙伴的事件调查视图。工程招聘信息尤为具有参考价值，清晰展现出兼具现代感的技术栈与强劲的内部产品交付节奏：Ruby on
