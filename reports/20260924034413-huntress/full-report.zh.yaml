      - number: '4.2'
        title: 业务进展、资本充足度与公开指标
        blocks:
          - type: paragraph
            body: >-
              最新官方披露的业务数据在非上市企业中异常亮眼：>$250M ARR、65% 增速、130% NRR、99% CSAT、270,000 家受保护企业，业务版图跨越 100+
              个国家。这些证据足以印证公司坐拥旺盛需求与扎实渠道。然而由于利润率质量、现金转化率或可用资金周期等指标属于私密数据，据此断定财务底色尚显不足。来自 Forge 的二级市场行情显示，其交易价格已高于最近一次公开的
              D 轮估值基准，既有股东自可视为积极信号，但新进资本却未必能捡到便宜。关键结论在于：尽调核心不单在于看清营收，更在于核验盈利质量。
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI011
