    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 核心风险
      - 发生概率信号
    rows:
      - - 乐观
        - ARR 突破 >$300M，毛利率提升，平台搭售率走高
        - 享受类似软件资产的 20x 估值溢价，对应估值 ~$4.5-5B
        - Microsoft / 渠道风险
        - 中低
      - - 基准
        - 维持接近当前的增速，毛利率适度改善
        - 对应类似 12-15x 的估值结果，对应估值 ~$3B
        - 增速常态化自然放缓
        - 中
      - - 悲观
        - 增长放缓，毛利率承压收窄，大厂捆绑竞争加剧
        - 估值倍数回落至类似 8-10x，对应估值 ~$1.5-2B
        - 折价轮次（Down-round）或平价老股转让
        - 中低
