chapter:
  number: 2
  title: Market Analysis
  summary: The right market frame is managed SMB security delivered through MSPs, with endpoint, identity, SIEM, awareness,
    and posture products as monetized subcategories. Demand is supported by breach economics and staffing scarcity, while
    the biggest constraints are Microsoft bundling and overlapping tools.
sections:
- id: SM001
  title: Market Boundary and Subcategory Mapping
  body: 'Huntress sits at the intersection of managed detection and response, managed endpoint security, and MSP-distributed
    SMB cybersecurity. That makes the market boundary narrower than “cybersecurity” and wider than classic endpoint software:
    the buyer is usually an SMB or mid-market organization, but the operating path is mediated through a service provider
    that wants predictable pricing and low deployment friction. The cleanest market definition is therefore “managed security
    for SMBs delivered through MSPs,” with adjacent spend in endpoint, identity, SIEM, awareness training, and posture management.
    This framing matters because it separates Huntress from enterprise-first platforms that assume a large in-house security
    team.'
  claimRefs:
  - CM001
  - CM002
  - CM008
  - CM011
  tableRefs:
  - TM001
- id: SM002
  title: Sizing Lenses and Adoption Drivers
  body: 'A multi-lens sizing approach is better than a single TAM slide. One lens uses Huntress’s own current ARR, protected-business
    count, and published list pricing to estimate the size of the active monetized wedge. A second lens uses the company’s
    claim that more than 270 million businesses globally need protection, then discounts that universe for SMB fit, MSP reach,
    willingness to pay, and overlap with existing tools. A third lens focuses on demand drivers: breach costs, phishing, ransomware,
    staffing gaps, and compliance pressure. Those drivers appear repeatedly in Huntress’s own educational content and in the
    alternative-vendor comparisons that frame the buyer problem as operations, not just software.'
  claimRefs:
  - CM003
  - CM004
  - CM006
  - CM009
  - CM010
  - CM012
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: SM003
  title: Adoption Constraints and Diligence Gaps
  body: The main adoption constraint is not whether SMBs have security problems; they clearly do. The constraint is whether
    a buyer will pay for managed protection versus relying on Microsoft bundles, a managed SOC provider, or a co-managed internal
    model. Huntress is strongest where the buyer values speed, simplicity, and a low operational burden. It is weaker when
    a customer wants deep cross-domain SOC integration or already owns overlapping Microsoft controls. Because independent
    market sources rarely isolate this exact subcategory, the report should preserve a range rather than a point estimate.
    The diligence ask is to separate true incremental spend from budget reallocation inside the Microsoft ecosystem or a traditional
    MSSP contract.
  claimRefs:
  - CM005
  - CM007
  - CM012
  tableRefs:
  - TM003
