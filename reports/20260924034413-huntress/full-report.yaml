chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Current Scale
        blocks:
          - type: paragraph
            body: >-
              Huntress is a privately held, Maryland-based cybersecurity company focused on managed security for SMBs
              through MSPs and adjacent channel partners. The public story is unusually consistent across official
              pages, company blogs, and independent profiles: the business bundles endpoint, identity, SIEM, awareness
              training, and posture-management products with a 24/7 human-led SOC, then sells that outcome at simple
              per-unit prices. The 2026 refresh matters because the company is no longer a sub-$100M ARR startup. The
              latest official release says Huntress is above $250M ARR, growing 65% year over year, and protecting
              270,000+ businesses worldwide. That scale makes Huntress a genuine platform vendor, not just a niche
              endpoint tool, but it also raises the bar for governance clarity, margin quality, and IPO readiness.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: Leadership, Governance, and Founder-Market Fit
        blocks:
          - type: paragraph
            body: >-
              The founder story remains a core diligence input because the company’s product and GTM choices are tightly
              linked to the founding team’s offensive-security background. The official leadership page now shows a
              broader operating bench: Maria Izurieta in finance, Prakash Ramamuram in product, Paul Strelzick in
              go-to-market, Eric Stride as CSO, and Daniel Westendorf as an innovation lead. That is a material
              evolution from founder-only heroics toward a more durable operating company. At the same time, the board
              and control structure are only partially visible. Public sources identify several investors and board
              members, but not the complete voting and protective-provision package. For a late-stage private company,
              that missing detail is not fatal, but it is a real diligence gap for any investor underwriting liquidity,
              future dilution, or a late-stage secondary entry.
            claimRefs:
              - CO004
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO011
      - number: '1.3'
        title: Funding, Milestones, and Adverse/Unclear Items
        blocks:
          - type: paragraph
            body: >-
              Huntress’s capital history shows a classic growth-company arc: early support, a scale-up Series B and C,
              then the June 2024 Series D that pushed the company above unicorn status. Multiple independent sources put
              total capital raised near the high-$200M range, but the precise figure changes depending on whether debt,
              close timing, or round tranches are included. The current milestone cadence is strong: the company crossed
              $100M ARR in 2024 and then, in July 2026, announced a much larger ARR base, broader international
              coverage, and a substantially larger workforce. The unresolved items are equally important: no public S-1,
              no fully disclosed cap table, and no open-book view of liquidation preference or governance rights. Those
              are normal for a private company, but they are exactly the things a late-stage investor would want to
              confirm before paying a premium secondary price.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
          - type: figure
            figureRef: FO001
            claimRefs: []
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Subcategory Mapping
        blocks:
          - type: paragraph
            body: >-
              Huntress sits at the intersection of managed detection and response, managed endpoint security, and
              MSP-distributed SMB cybersecurity. That makes the market boundary narrower than “cybersecurity” and wider
              than classic endpoint software: the buyer is usually an SMB or mid-market organization, but the operating
              path is mediated through a service provider that wants predictable pricing and low deployment friction.
              The cleanest market definition is therefore “managed security for SMBs delivered through MSPs,” with
              adjacent spend in endpoint, identity, SIEM, awareness training, and posture management. This framing
              matters because it separates Huntress from enterprise-first platforms that assume a large in-house
              security team.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM011
      - number: '2.2'
        title: Sizing Lenses and Adoption Drivers
        blocks:
          - type: paragraph
            body: >-
              A multi-lens sizing approach is better than a single TAM slide. One lens uses Huntress’s own current ARR,
              protected-business count, and published list pricing to estimate the size of the active monetized wedge. A
              second lens uses the company’s claim that more than 270 million businesses globally need protection, then
              discounts that universe for SMB fit, MSP reach, willingness to pay, and overlap with existing tools. A
              third lens focuses on demand drivers: breach costs, phishing, ransomware, staffing gaps, and compliance
              pressure. Those drivers appear repeatedly in Huntress’s own educational content and in the
              alternative-vendor comparisons that frame the buyer problem as operations, not just software.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs: []
      - number: '2.3'
        title: Adoption Constraints and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The main adoption constraint is not whether SMBs have security problems; they clearly do. The constraint
              is whether a buyer will pay for managed protection versus relying on Microsoft bundles, a managed SOC
              provider, or a co-managed internal model. Huntress is strongest where the buyer values speed, simplicity,
              and a low operational burden. It is weaker when a customer wants deep cross-domain SOC integration or
              already owns overlapping Microsoft controls. Because independent market sources rarely isolate this exact
              subcategory, the report should preserve a range rather than a point estimate. The diligence ask is to
              separate true incremental spend from budget reallocation inside the Microsoft ecosystem or a traditional
              MSSP contract.
            claimRefs:
              - CM005
              - CM007
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitor Landscape
        blocks:
          - type: paragraph
            body: >-
              Huntress should be compared against four classes of alternatives. First are status-quo bundles such as
              Microsoft Defender, which already sit in many SMB budgets. Second are endpoint-first vendors and MDR
              platforms that sell stronger telemetry and broader control but often require more operational maturity.
              Third are managed SOC or co-managed SIEM providers that solve the same problem through analyst labor
              rather than a single point product. Fourth are MSP-native or white-label channel platforms that let
              partners keep the customer relationship. The important conclusion is that Huntress competes on operating
              model, not only on product feature lists.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
      - number: '3.2'
        title: Capability, Pricing, and Distribution Comparison
        blocks:
          - type: paragraph
            body: >-
              Huntress’s strongest comparison point is simplicity: transparent unit pricing, managed outcomes, and broad
              enough coverage to be useful without forcing the buyer into a full SOC re-platform. Competitors can beat
              it on scope or on niche depth. Managed SOC providers can cover more telemetry. Microsoft can undercut on
              bundle economics. MSSP-native alternatives can provide white-label ownership. The trade-off is that each
              alternative introduces either more operating complexity, less transparency, or weaker response authority.
              Huntress’s own customer references reinforce that its message lands best when the buyer wants
              “common-sense” security and quick deployment rather than a large-scale security program.
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP008
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP008
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs: []
      - number: '3.3'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              The moat is real but not invulnerable. Huntress has a channel advantage, a strong research brand, and a
              human SOC that many smaller competitors cannot easily replicate. However, the most serious threat is
              bundling and platformization. If Microsoft keeps pushing better-managed security features into M365, if
              large endpoint vendors continue downmarket, and if managed SOC providers can wrap the same telemetry with
              less pricing pressure, Huntress becomes a very good product in a crowded buyer shortlist rather than an
              unassailable category owner. The right diligence question is not whether Huntress is better than one peer;
              it is whether its managed-outcome model can keep enough differentiation to protect price and retention
              over time.
            claimRefs:
              - CP006
              - CP010
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing, and Monetization
        blocks:
          - type: paragraph
            body: >-
              Huntress monetizes through per-unit subscriptions, which makes the revenue bridge relatively easy to
              explain but not fully easy to underwrite. The public list prices are straightforward: endpoint, identity,
              SIEM, and learner pricing are all spelled out by a third-party pricing guide that matches the product
              architecture visible on Huntress’s own site. The company’s revenue model is therefore not a mystery; the
              mysteries are mix, discounts, renewal quality, and attach rates. The managed-service layer matters because
              it means Huntress is not just selling software licenses—it is also absorbing human operations work that
              could compress margins relative to a pure SaaS peer.
            claimRefs:
              - CI001
              - CI002
              - CI012
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI009
      - number: '4.2'
        title: Traction, Capital Adequacy, and Public Metrics
        blocks:
          - type: paragraph
            body: >-
              The latest official traction release is unusually strong for a private company: >$250M ARR, 65% growth,
              130% NRR, 99% CSAT, 270,000 protected businesses, and a global footprint in 100+ countries. That is enough
              evidence to believe the company has good demand and a real channel. It is not enough to conclude margin
              quality, cash conversion, or runway, because those inputs are private. The current secondary-market price
              from Forge suggests the company trades above its last disclosed Series D mark, which is a constructive
              sign for existing holders but not necessarily a bargain for new capital. The key conclusion is that this
              is a profitable-quality diligence question, not a revenue-visibility question alone.
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs: []
      - number: '4.3'
        title: Cost Structure, Margin Drivers, and Underwriting Gaps
        blocks:
          - type: paragraph
            body: >-
              The principal financial risk is the blend of software and services economics. Huntress has to fund an
              analyst-led SOC, customer support, partner enablement, and ongoing product engineering. That pushes the
              diligence focus toward gross margin, burn, and the economics of the MSP channel. The public record
              suggests the business is scaled enough to avoid immediate financing pressure, but it does not tell us
              whether the company is converging on SaaS-like margins or living in a permanently service-heavy model. The
              correct underwriting stance is to separate public traction from private unit economics and require
              management disclosure before treating the current multiple as fully justified.
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Modules
        blocks:
          - type: paragraph
            body: >-
              Huntress is not a single tool. It is a managed security platform that combines endpoint, identity, SIEM,
              awareness, and posture-management products with a 24/7 SOC. That modular shape matters because each
              product line maps to a different buyer pain: endpoint detection and response, identity abuse, security
              logging, employee behavior, and configuration drift. The platform now looks closer to an operating system
              for SMB security than a point product. The key diligence question is whether the company is truly building
              a broader platform, or simply adding managed wrappers around several adjacent product categories.
            claimRefs:
              - CE001
              - CE002
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE012
      - number: '5.2'
        title: Architecture, Integrations, and Engineering Signal
        blocks:
          - type: paragraph
            body: >-
              The visible architecture is a managed SaaS platform plus agent plus SOC workflow. Public integrations show
              posture data flowing into Tailscale access policy, while the release notes show active agent versioning,
              feature rollout, and partner-facing investigation views. The engineering job post is especially useful
              because it reveals a modern web stack and strong internal product velocity: Ruby on Rails, Postgres,
              ClickHouse, Vector, Hotwire, Tailwind, and AI-assisted development. That is unusually concrete evidence
              for a private security company. It also suggests the platform has enough operational and data complexity
              to justify a dedicated engineering organization rather than a thin wrappers-only model.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs: []
      - number: '5.3'
        title: Trust, Security, and Quality Controls
        blocks:
          - type: paragraph
            body: >-
              Huntress’s technical trust posture is stronger than its marketing posture alone would suggest. The company
              publishes security research, reacts to live incidents, and shows a pattern of iterative release
              management. The axios supply-chain writeup is a good example because it shows the SOC and research teams
              handling real-world threat data, not just marketing “thought leadership.” Still, public trust signals such
              as CNA status, customer testimonials, and partner integrations are not the same thing as third-party
              certification or audited efficacy. The right conclusion is that Huntress looks technically credible and
              operationally mature, but some claims remain hard to verify externally, especially around depth of
              detection efficacy and formal certification scope.
            claimRefs:
              - CE006
              - CE008
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Adoption Pattern
        blocks:
          - type: paragraph
            body: >-
              Huntress’s customer base is best understood as a mix of SMB end customers, MSP partners, and regulated
              small businesses that need outcomes instead of an internal security team. The public evidence shows strong
              partner adoption, not just individual software adoption. This matters because revenue is likely to expand
              in two steps: first the partner standardizes Huntress, then the partner expands the footprint across more
              endpoints, identities, and log sources. The current scale metrics—270,000 businesses, 15M identities, and
              5.5M endpoints—suggest adoption is broad enough to be durable, but the exact mix by customer segment is
              not public.
            claimRefs:
              - CU001
              - CU002
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU006
      - number: '6.2'
        title: Named Customer Proof and Retention Signals
        blocks:
          - type: paragraph
            body: >-
              The best named proof comes from MSP case studies. WTG is the strongest because it is specific about
              deployment friction, Microsoft Defender integration, and day-to-day value. Integris provides a second
              named proof point, and the homepage testimonials add qualitative support from multiple partner personas.
              Retention and satisfaction look strong—130% NRR and 99% CSAT—but those are still company-claimed metrics.
              That means the report can say Huntress likely has good expansion, but it cannot claim independent cohort
              proof without more data. The diligence gap is top-customer concentration and churn by partner, which are
              exactly the metrics that matter when a channel business scales quickly.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.3'
        title: Expansion and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Huntress appears to expand through channel standardization rather than direct sales heroics. That is
              operationally efficient, but it also makes the partner layer essential. If MSPs multi-home or shift to
              another managed SOC provider, Huntress can lose volume even if the product remains strong. The public
              record supports broad use, good partner sentiment, and geographic expansion, yet it does not disclose
              concentration, churn, or renewal cohorts. Therefore, customer quality should be judged as “strong but not
              fully audited.” For valuation purposes, the key question is whether expansion comes from deeper attach
              across the same partners or merely from new partner additions that could be fragile.
            claimRefs:
              - CU007
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Top Failure Modes
        blocks:
          - type: paragraph
            body: >-
              Huntress has the profile of a healthy growth company, but the risk stack is still real. The biggest issues
              are not classic balance-sheet distress; they are channel dependency, SOC labor economics, and the
              possibility that Microsoft or another large platform can reduce the need for a separate managed vendor.
              The company’s own release notes show disciplined rollout management, which is a positive sign. The
              operational question is whether the platform can keep scaling safely as the installed base grows and the
              product set broadens. That is especially important because Huntress is now large enough that even small
              quality issues could affect many partners at once.
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR010
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR009
              - CR012
      - number: '7.2'
        title: Legal, Regulatory, and Trust Risk
        blocks:
          - type: paragraph
            body: >-
              The fetched public record does not show a major enforcement action or lawsuit, but that is not a clean
              bill of health. The more useful insight is that Huntress has to maintain a visible trust posture because
              it sells into security-sensitive environments and depends on partner confidence. The company publishes
              research and release notes, which helps. However, public certification depth, incident response SLAs, and
              infrastructure specifics are not fully visible in the fetched sources. Those omissions are normal for a
              private company, yet they should be treated as diligence items rather than ignored. In short: no obvious
              red flag, but not enough transparency to stop asking questions.
            claimRefs:
              - CR001
              - CR010
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs: []
      - number: '7.3'
        title: Partner, Dependency, and Financial Risk
        blocks:
          - type: paragraph
            body: >-
              Huntress’s model is structurally exposed to channel and platform risk. MSPs can multi-home, Microsoft can
              bundle, and managed SOC vendors can wrap the same telemetry. The company’s human SOC is a differentiator,
              but it is also a cost center. If automation doesn’t keep up with growth, gross margin could compress. The
              thesis break is therefore not a single incident or lawsuit; it is a pattern of slower expansion, rising
              cost to serve, and weak partner economics. The best public mitigations are to ship often, maintain partner
              trust, and use batch rollouts and investigations views to reduce friction.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is simple: Huntress has moved from a promising SMB security vendor to a scaled managed-security
              platform with strong growth, broad channel reach, and credible product breadth. The anti-thesis is equally
              simple: the company may already be priced as though all of that is durable and margin-efficient, while the
              public record still lacks audited gross margin, cash flow, and exact channel concentration. The current
              evidence supports confidence in the business, but not a blind premium. That is why the correct posture is
              measured rather than euphoric.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV011
      - number: '8.2'
        title: Recommendation, Confidence, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              Recommendation: HOLD / WATCH. Confidence: medium. Risk rating: medium. Valuation stance: fair to slightly
              rich relative to the last primary mark, but not obviously stretched if the secondary valuation is current
              and if margin quality is acceptable. Huntress deserves a premium to smaller managed-security peers because
              it has proven scale and visible growth. It does not deserve a pure enterprise software multiple until the
              market sees audited margin, full partner economics, and a clearer exit path. For new investors, the best
              outcome may be patience; for existing holders, the better question is not whether to admire the company,
              but whether to wait for better price discovery or confirmation from public filings. In other words, the
              market is paying for growth, but it is still not paying for a fully audited exit-ready profile.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs: []
      - number: '8.3'
        title: Comparable Set, Scenarios, and Exit Logic
        blocks:
          - type: paragraph
            body: >-
              A useful comparison set includes endpoint leaders, managed-security peers, and operating-model
              substitutes. The bull case is a broader security platform with improving margins and a 4.5-5B valuation
              range. The base case is a continuation of strong growth with a 3B-ish outcome. The bear case is a multiple
              reset toward the last primary mark if Microsoft bundling, channel softness, or margin compression
              dominate. The exit logic is therefore not merely “is Huntress good?” but “how much of the current growth
              and channel story is already priced in, and what evidence would prove the next step up?”
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
