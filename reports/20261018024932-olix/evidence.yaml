evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: scale-metrics
    missingEvidence: Current revenue, run-rate, customer count, and named paid pilots or design wins.
    whyItMatters: Public valuation and commercialization readiness cannot be judged cleanly without operating proof.
    diligencePath: >-
      Request current management accounts, pipeline detail, signed customer references, and pilot-to-production
      conversion data.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: ownership-structure
    missingEvidence: Post-Series B cap table, preference stack, any secondary sales, and debt or credit arrangements.
    whyItMatters: Control, dilution, and downside protection cannot be assessed from named investors alone.
    diligencePath: Request the financing documents, cap table export, shareholder register, and any side-letter summary from counsel.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Primary financing records that reconcile the $220m and $250m descriptions of the earlier 2026 round and establish
      cumulative funding.
    whyItMatters: >-
      Funding raised is not cash available, and conflicting round amounts prevent a defensible total-raised figure or
      dilution analysis.
    diligencePath: >-
      Obtain signed closing documents, cap-table ledgers, bank receipts, and a currency-by-closing reconciliation from
      company counsel.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table
    missingEvidence: Full executive roster, board composition, and functional leaders below the founder, board addition, and CFO.
    whyItMatters: The current table shows visible public leaders but not the full execution bench or governance depth.
    diligencePath: Request an org chart, board list, committee structure, and leadership bios used in current fundraising materials.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: company-milestone-timeline
    missingEvidence: >-
      Two or more additional dated product, manufacturing, regulatory, partnership, or adverse milestones supported by
      public records.
    whyItMatters: >-
      The assigned evidence supports only six dated events or targets, limiting analysis of execution cadence and
      schedule slippage.
    diligencePath: >-
      Request a board-approved milestone history and corroborate material dates with suppliers, investors, customers,
      and filings.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: Named TAM, SAM, or SOM estimates tied to workload class, buyer segment, geography, and pricing assumptions.
    whyItMatters: >-
      Current public evidence sizes investor appetite around the category, but it does not quantify the commercial
      demand Olix can realistically address.
    diligencePath: >-
      Request management's market model, underlying assumptions, and at least one external benchmark crosswalk that
      links buyer counts to workload or budget data.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-validation
    missingEvidence: Named design wins, paid pilots, procurement commitments, or customer references tied to real inference workloads.
    whyItMatters: >-
      The buyer map remains inferred until a public or diligence-room customer shows that decode savings matter enough
      to change purchasing behavior.
    diligencePath: >-
      Request LOIs, pilot statements, procurement records, and workload-specific customer references segmented by
      deployment type.
    relatedQuestionRefs:
      - QM003
      - QM006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Comparable cost-per-million-token, throughput-per-watt, and power-envelope data measured on representative models.
    whyItMatters: >-
      Without benchmark methodology and comparable operating data, public claims about total cost of ownership and
      adoption timing cannot be underwritten.
    diligencePath: >-
      Request third-party benchmark reports, test conditions, and side-by-side comparisons versus incumbent GPU systems
      on comparable models.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Public list pricing, contract structure, and support terms for Olix and the named alternatives.
    whyItMatters: Without price and packaging detail, procurement-grade switching-cost or ROI claims would be guesswork.
    diligencePath: >-
      Request price sheets, pilot proposals, and any discount or capacity commitments directly from Olix and from
      procurement teams evaluating alternatives.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: Independent benchmarks and named production customer deployments for Olix or directly comparable workloads.
    whyItMatters: >-
      The moat and readiness debate cannot be resolved confidently while public evidence stops at architecture claims
      and delivery targets.
    diligencePath: >-
      Obtain third-party benchmark reports, pilot results, and customer references comparing Olix against incumbent or
      specialty alternatives.
    relatedQuestionRefs:
      - QP004
      - QP006
      - QP008
  - type: missing-source
    severity: minor
    topic: rival-detail-depth
    missingEvidence: >-
      Deeper source-backed product, pricing, and customer detail for Cerebras, Etched, Google TPU, Amazon Trainium, and
      software-layer substitutes.
    whyItMatters: >-
      This chapter can name the substitute set, but the assigned pool is still Olix-centric and therefore thin on rival
      proof.
    diligencePath: >-
      Run competitor-specific source discovery for each named route and add direct pricing, deployment, and benchmark
      evidence before final underwriting.
    relatedQuestionRefs:
      - QP001
      - QP002
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Customer-facing pricing sheets, proposal language, or signed commercial terms for DX-1 or the X-1 platform.
    whyItMatters: Pricing visibility is required to turn technical performance claims into a revenue and gross-profit model.
    diligencePath: >-
      Obtain current price cards, pilot contracts, or board materials that reconcile list, realized, and discounted
      pricing.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: traction
    missingEvidence: Revenue, ARR, backlog, paid pilots, and customer-count reporting.
    whyItMatters: The valuation cannot be tied to present commercial adoption without basic traction disclosures.
    diligencePath: Request monthly revenue, bookings, backlog, and customer pipeline reporting, plus evidence of paid deployments.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: burn-runway
    missingEvidence: Cash balance, monthly burn, capex plan, working-capital needs, and any debt or project-finance obligations.
    whyItMatters: Cash raised alone does not show how long Olix can finance tape-out, system integration, and customer delivery.
    diligencePath: Review current cash position, 18-to-24-month operating plan, and manufacturing-commitment schedule.
    relatedQuestionRefs:
      - QI002
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Independent benchmark results and a gross-margin bridge from throughput claims to delivered system economics.
    whyItMatters: Public architecture and TCO claims do not establish whether deployed systems will earn attractive margins.
    diligencePath: >-
      Require third-party performance validation, BOM detail, yield assumptions, and support-cost modeling for the first
      shipped systems.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Public security, privacy, compliance, reliability, and support documentation for production deployments.
    whyItMatters: >-
      Buyers need to know how a novel infrastructure component is secured, supported, and governed before underwriting
      deployment risk.
    diligencePath: >-
      Request trust-center material, export-control and compliance documentation, incident or status-history evidence,
      and production support commitments.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: benchmarking-gap
    missingEvidence: Independent silicon benchmark data covering throughput, latency, power, and cost-per-token on real workloads.
    whyItMatters: >-
      The underwriting case depends on whether the claimed performance and cost advantages survive outside
      company-selected comparisons.
    diligencePath: >-
      Request third-party benchmark packs, customer-run test reports, and workload-level comparisons against HBM-based
      alternatives.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: manufacturing-readiness
    missingEvidence: Tapeout status, process node, foundry or OSAT partners, qualification milestones, and yield-readiness evidence.
    whyItMatters: Photonic promise is not enough if manufacturing, packaging, or qualification slips before first customer delivery.
    diligencePath: >-
      Request tapeout plan, partner list, qualification gates, and any manufacturability reports tied to the H2 2027
      roadmap.
    relatedQuestionRefs:
      - QE006
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal
