chapter:
  number: 7
  title: "Risks"
  summary: >-
    Olix's biggest risks are still execution-led: the company has raised at an aggressive
    valuation step-up, but first customer delivery is only targeted for H2 2027 and the
    retained public pool still lacks independent benchmark or customer proof. Public
    mitigations exist in the form of capital, board/CFO additions, and an architecture
    designed to avoid HBM bottlenecks, but legal/compliance disclosure, named manufacturing
    counterparties, and OEM adoption evidence remain unresolved.
sections:
  - id: "execution-risk-ranking"
    title: "Execution risk still dominates the downside"
    body: >-
      Olix's risk profile is still dominated by execution risk rather than financing access.
      The company moved from a February 2026 round valuing it above $1 billion to an August
      2026 Series B at $3.3 billion, while public sources still place first customer delivery
      in H2 2027 rather than in-market today. That creates a long gap in which value must be
      justified by shipping silicon, not just by fundraising momentum. The public evidence is
      also explicit about what is still missing: retained third-party sources say there are no
      independent benchmarks, no disclosed cost-per-token or power envelope, and no public
      customer-run production results yet. In practical terms, the highest-severity risk is a
      schedule or performance miss before commercialization, because the valuation already
      moved ahead of independent product proof.
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR011", "CR013"]
    tableRefs: ["TR002"]
    figureRefs: ["FR001"]
  - id: "regulatory-and-governance"
    title: "Regulatory and legal risk is mostly a disclosure gap today"
    body: >-
      The retained pool does not show a public legal incident, but it also does not provide
      the underlying artifacts that would clear legal and compliance risk. There is no direct
      regulator, court, patent, certification, or incident record in the assigned evidence, so
      export-control exposure, IP chain-of-title, enterprise security posture, and litigation
      status remain unresolved rather than de-risked. That gap matters more because sovereign
      capital is already on the cap table and the company is scaling hiring across multiple
      geographies, both of which raise the cost of a compliance mistake. Governance additions
      such as a CFO and an experienced board member are real mitigants for internal control,
      but they do not substitute for diligence on export controls, IP ownership, benchmark
      substantiation, or customer-contract representations.
    claimRefs: ["CR007", "CR010", "CR012", "CR014"]
    tableRefs: ["TR001"]
  - id: "dependencies-and-kill-criteria"
    title: "Counterparty and system dependencies need explicit milestone proof"
    body: >-
      Dependency risk is concentrated in counterparties and subsystems that public materials do
      not yet name or validate. The retained sources say the Series B will finance manufacturing
      and supply-chain commitments, but they do not disclose foundry, packaging, or OSAT
      counterparties in the public pool. Strategic backers like Arm and the UK Sovereign AI
      fund help credibility, yet public adoption proof still depends on named OEM, cloud, or
      customer commitments that are not disclosed here. The architecture's main mitigation is
      to avoid HBM and advanced packaging bottlenecks, but that replaces one constraint with
      another: compiler portability, photonic interconnect scale, and system integration all
      have to work at production quality before the H2 2027 window narrows. The investment
      kill criteria are therefore concrete: named manufacturing relationships, independent
      throughput and power data, and evidence of customer sampling need to appear before the
      first-delivery timeline becomes tight.
    claimRefs: ["CR005", "CR006", "CR008", "CR009", "CR011", "CR015"]
    tableRefs: ["TR003"]
