callouts:
  - calloutType: "risk"
    title: "Highest-conviction kill criteria"
    body: >-
      If independent throughput or power data still has not appeared by customer-sampling time,
      if manufacturing counterparties remain unnamed as tapeout and qualification approach, or
      if the H2 2027 delivery target slips without offsetting customer proof, the risk case moves
      from speculative to thesis-breaking.
    claimRefs: ["CR003", "CR004", "CR006", "CR009", "CR013"]
  - calloutType: "insight"
    title: "Public mitigations are real, but they are still mostly enabling conditions"
    body: >-
      The public record does show meaningful mitigations: substantial capital, a CFO hire, a
      board addition, and an architecture intended to sidestep HBM and advanced-packaging
      bottlenecks. Those reduce financing and process risk, but they do not yet substitute for
      independent product proof or named customer and manufacturing evidence.
    claimRefs: ["CR010", "CR011", "CR015"]
