    "number": 2,
    "title": "Market Analysis",
    "summary": "Olix is positioning for a narrow but potentially valuable part of AI infrastructure: large-model inference systems where decode latency, memory bandwidth, and HBM supply constraints matter more than raw training throughput. Public evidence supports the bottleneck logic and capital-market appetite, but it does not disclose a source-backed TAM/SAM/SOM or any customer benchmark data, so the market case still depends on inferred buyer pain rather than proven adoption."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and status-quo substitute",
      "body": "The retained sources describe Olix as an inference-first hardware company rather than a general AI semiconductor vendor. Across TechTimes, New Electronics, and DatacenterDynamics, the recurring wedge is the decode stage of large language model inference, where data movement and memory bandwidth are presented as the binding constraint. That framing puts the company in the market for rack-scale inference infrastructure and accelerator procurement, with incumbent GPU systems as the status-quo substitute. It excludes most training-led compute budgets, generic enterprise edge devices, and software-only inference optimizations, even though those categories still affect the broader AI stack. In practical diligence terms, Olix is not claiming to serve all AI chip spend; it is claiming that a specific workload bottleneck is large enough to justify a specialized system architecture.",
      "claimRefs": ["CM001", "CM002", "CM003", "CM004", "CM006"],
      "tableRefs": ["TM001"]
    },
    {
      "id": "sizing-lenses",
      "title": "Sizing lenses are capital proxies, not demand proof",
      "body": "No retained source publishes an Olix-specific TAM, SAM, or SOM, so the public record sizes this market indirectly. The strongest numeric lenses are financing and policy signals: TechTimes cites $16 billion of semiconductor investment committed globally in 2026 so far and $8.3 billion into AI chip startups, while the UK Sovereign AI Fund adds a state-backed compute-policy layer to the story. Those numbers show that investors and governments believe inference hardware and sovereign compute are worth funding, but they do not prove that buyers will switch workloads or budgets to Olix. The cleanest interpretation is that public evidence supports a hot funding environment around inference infrastructure, while the commercial market size for Olix's specific architecture remains unquantified.",
      "claimRefs": ["CM007", "CM008", "CM009", "CM010", "CM014", "CM016"],
      "tableRefs": ["TM002"],
      "figureRefs": ["FM001"]
    },
    {
      "id": "buyers-drivers-and-constraints",
      "title": "Buyer path, adoption drivers, and gating constraints",
      "body": "The likely buyer path remains inferred rather than named. Retained sources point to hyperscalers, cloud or model operators, and other latency-sensitive infrastructure teams because the value proposition centers on recurrent inference cost, throughput per watt, and relief from HBM and advanced-packaging shortages. Policy-backed compute programs are part of the narrative, but they are still financing signals rather than purchase orders. The harder constraint is execution risk: AI Tech Connect says there are no independent benchmarks, no published cost-per-million-token data, and no third-party model runs, while TechTimes and related coverage emphasize photonic-manufacturing and yield risks before first customer delivery targeted for H2 2027. Adoption therefore depends on proving that the architecture can move from a compelling bottleneck thesis to customer-qualified hardware on schedule.",
      "claimRefs": ["CM005", "CM011", "CM012", "CM013", "CM015"],
      "tableRefs": ["TM003"]
    }
  ],
