        - 加速器和推理平台预算
        - 与 TechTimes、New Electronics 和 DCD 所述的 decode 专属切入点一致。
      - - 机架级推理系统
        - 集成芯片、激光器、光网络和系统软件的完整机架
        - 独立 IP 授权或边缘设备硅片
        - 数据中心运营商和大型模型部署者
        - 系统采购和扩容预算
