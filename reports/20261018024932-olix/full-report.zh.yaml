      - number: '3.3'
        title: 护城河能否持久取决于供应链缓解是否先于在位厂商适应
        blocks:
          - type: paragraph
            body: >-
              这组资料中的护城河论点不是算力领先，而是主张避开 HBM 系统周围的内存与封装瓶颈，才是降低推理成本的最快路径。如果 Olix 按期出货，且光互连与编译器技术栈能让专用 decode
              系统在机架规模上具备经济性，这可能成为真正的切入点。反面的证据同样清楚：公开来源仍没有独立基准测试和具名生产部署，而 Nvidia 既被描述为在位商用平台，也是在光子学领域的活跃投资者。因此，在 Olix
              证明自己能把架构新意变成已部署系统前，买方可以在投资组合中多栖部署——保留 GPU 集群、测试专用 ASIC，并使用云或软件替代方案。
