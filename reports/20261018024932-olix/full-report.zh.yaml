      - number: '3.2'
        title: 在 Olix 出货前，能力与采购权衡仍偏向在位厂商
        blocks:
          - type: paragraph
            body: >-
              最有依据的差异化在于架构：多份来源反复提到，Olix 试图把权重存进片上 SRAM、用光子搬运数据，从而避开 HBM
              和先进封装。这一切入点具有战略意义，因为留存资料也将推理经济性描述为受内存搬运、封装和供应获取约束。但同一资料集没有提供 Olix
              的公开目录价格、合同条款或独立基准结果，对替代方案的定价细节也很少。实际而言，当前比较的是采购准备度，而不是足以计算 ROI 的价格：Nvidia 级商用系统和超大规模云厂商自研硅片现在就能买到，而 Olix
              仍在销售一套架构论点，产品目标是 2027 年下半年首次交付。
            claimRefs:
