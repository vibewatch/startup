        title: 展示项
        blocks:
          - type: callout
            title: 切入点是瓶颈，而不是宽泛的品类主张
            body: Olix 最有依据的市场论点是，decode 推理与 HBM 稀缺造成了一个现有 GPU 系统无法干净解决的具体痛点。这一市场比整个 AI 芯片市场窄，但比泛泛而谈的“AI 算力市场巨大”更可信。
            calloutType: insight
            claimRefs:
