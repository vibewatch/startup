        title: 规模测算是资本代理指标，不是需求证明
        blocks:
          - type: paragraph
            body: >-
              没有留存来源披露 Olix 专属的 TAM、SAM 或 SOM，因此公开记录只能间接估算市场规模。最有力的数字线索来自融资和政策信号：TechTimes 称，截至 2026 年全球已承诺投入 160
              亿美元半导体投资，其中 83 亿美元流向 AI 芯片初创公司；英国 Sovereign AI Fund
              则为这一叙事加入了国家支持的算力政策层。这些数字说明投资者和政府认为推理硬件与主权算力值得投入，但不能证明买方会把工作负载或预算转向 Olix。最稳妥的解读是，公开证据支持推理基础设施处于火热融资环境，而
              Olix 特定架构对应的商业市场规模仍无法量化。
