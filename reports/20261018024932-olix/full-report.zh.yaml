chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 定位、阶段与产品立场
        blocks:
          - type: paragraph
            body: >-
              Olix 将自己定位为一家 2024 年在伦敦创立、为前沿 AI 推理建设基础设施的公司，系统以完整机架交付，而不是单独的芯片 SKU。2026 年 8 月的官方融资公告与公司主页都指向同一核心叙事：Olix
              正在打造以推理为先、围绕定制硅、光子学、网络和 SRAM 密集型系统设计的架构。由此可见，公司当前仍处于资本密集型的 B
              轮硬件建设阶段，而非已被商业验证的部署平台。公开材料清楚说明了产品方向和目标工作负载，但没有披露收入、具名付费试点或客户数量，尚不足以把定位叙事转化为经验证的运营规模。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO015
