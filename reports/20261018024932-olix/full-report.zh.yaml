      - number: '2.3'
        title: 买方路径、采用驱动因素与门槛约束
        blocks:
          - type: paragraph
            body: >-
              可能的买方路径仍是推断出来的，而非已具名确认。留存来源指向超大规模云厂商、云或模型运营商，以及其他对延迟敏感的基础设施团队，因为其价值主张围绕经常性推理成本、每瓦吞吐量，以及缓解 HBM
              和先进封装短缺展开。政策支持的算力项目也是叙事的一部分，但它们仍是融资信号，不是采购订单。更难的约束在于执行风险：AI Tech Connect 称没有独立基准测试、没有公开的每百万 token
              成本数据，也没有第三方模型运行；TechTimes 及相关报道则强调，目标在 2027
              年下半年首次交付前仍面临光子制造和良率风险。因此，采用取决于公司能否按期证明其架构可以从有说服力的瓶颈论点变成通过客户验证的硬件。
            claimRefs:
              - CM005
              - CM011
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
