      - - 避开 HBM 的架构
        - 旨在避开 HBM 和先进封装稀缺性的架构
        - 仍依赖 HBM/CoWoS 的现有 GPU 更新周期
        - 受供应、延迟或功耗约束阻碍的买方
        - AI 基础设施和采购团队
        - 商业切入点部分在于缓解供应链，而不仅是原始模型性能。
      - - 主权算力与产业政策层
