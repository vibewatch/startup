      - number: '4.2'
        title: 公开成本信号属于架构层面，而非经济层面
        blocks:
          - type: paragraph
            body: >-
              公开材料以定性而非定量方式描述成本驱动因素。Olix 的论点是，采用片上 SRAM 和光互连的 decode 设计可以避开 HBM 与先进封装瓶颈，相比传统 GPU
              技术栈，可能改善供应可得性和最终成本基础。但这些材料没有提供经验证的物料清单、良率假设、毛利率区间、安装负担、服务成本、CAC、销售周期或回本期。即使最好的公开性能主张，也仍由公司主导且面向未来。尽调的关键结论是，架构或许能解释未来经济性，但不能替代出货后的毛利和获客数据。
