  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图比直接的光子芯片同行更广
        blocks:
          - type: paragraph
            body: >-
              现有证据支持一个广泛的竞争集合，而不是单一的初创公司对初创公司较量。多份留存来源将 Olix 描述为专注于 decode、SRAM 和光互连，试图撼动 Nvidia 基于 HBM
              的推理技术栈，而不是推出更快的通用 GPU。同一组证据还列出 Cerebras、Etched、Nvidia 旗下 Groq 资产、Google TPU、Amazon
              Trainium，以及软件层或内部自研路径，均可能帮助买方解决同一推理问题。这一点很重要，因为买方替代并不局限于“另一块光子芯片”：采购团队可以继续使用现有商用技术栈，转向超大规模云厂商控制的技术栈，购买专用推理
              ASIC，或推迟采购新硅片、围绕现有设备优化软件。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP012
