        title: 领导层、治理与关键人物集中度
        blocks:
          - type: paragraph
            body: >-
              2026 年 8 月这一轮融资带来了两项明显的领导层升级：Nick McKeown 加入董事会，前 Wise CFO Matt Briers
              出任首席财务官。这些任命在漫长的硬件商业化周期前增强了治理与财务可信度。与此同时，留存的独立报道仍高度聚焦创始人 James Dacombe，并报道他还领导
              CoMind；在公开高管名单和董事会委员会信息不完整的情况下，这加大了关键人物集中风险。因此，公开来源支持高管新增这一事实，但不足以完整判断管理层冗余、继任深度或正式治理控制。
