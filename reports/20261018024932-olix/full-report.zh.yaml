        - 继续研究
        - 没有新证据前，不要按 2026 年 8 月轮融资价格评估上行空间。
      - - 置信度
        - 中
        - 融资事实得到充分佐证，但轮融资价格之外的估值支撑仍不完整。
      - - 风险评级
        - 高
        - 在 H2 2027 交付前，商业化、进度和证据缺口仍占主导。
      - - 估值立场
        - 偏高
        - $3.3B 价格已将未来里程碑计入，领先于公开基准测试或收入披露。
    notes: 摘要判断锚定于指定的 2026 年 8 月融资价格和公开商业化指标的缺失，而非收入倍数或 DCF。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV009
      - CV012
  - id: TV002
    title: 正论 / 反论表
    columns:
      - 论点
      - 当前证据
      - 什么会改变判断
    rows:
      - - 正论：架构可能有价值
        - 独立来源和投资者关联来源一致描述了一套无 HBM、聚焦解码的 SRAM 加光子技术栈，目标是降低推理成本。
        - 能验证吞吐量、延迟和功耗声明的独立生产基准测试。
      - - 正论：融资质量强
        - Arm、英国主权 AI 基金、Hudson River Trading、Reed Hastings 和现有投资者均支持了本轮融资。
        - 将金融信号转化为市场证据的具名客户或 OEM 承诺。
      - - 反论：证据仍然薄弱
        - 指定来源未披露公开收入、ARR、具名付费试点或独立客户参考。
        - 任何经验证的商业指标、付费部署或外部客户案例。
      - - 反论：估值已预期成功
        - 在 H2 2027 交付前，价格已从 2026 年 2 月约 $1B 上升至 2026 年 8 月的 $3.3B。
        - 更低的入场价格，或在需要追加资本前实现里程碑。
    notes: 本表将投资者和架构支持与实际商业化证据分开；不把投资者团质量当作客户验证的替代品。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV008
      - CV009
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 独立基准测试验证 DX-1 的经济性，出现具名设计赢单或付费试点，且 H2 2027 交付按计划进行。
        - 商业证据开始追上融资叙事，因此维持或超过 $3.3B 价格变得有理可循。
        - 在需要追加融资前，公开里程碑节奏改善。
        - 基准测试表现不佳或首个客户交付延期。
      - - 基准
        - Olix 继续推进技术执行并招聘，但在临近发布前公开证据仍有限。
        - 估值可能处于此前私募价格与 2026 年 8 月价格之间，因为投资者仍在为期权价值付费，而非为已证明的盈利能力付费。
        - 证据喜忧参半：支持者实力强且技术确有进展，但外部验证有限。
        - 证据周期拉长或单位经济性不清晰。
      - - 悲观
        - 交付延期、基准测试持续未披露，或客户验证未能实现。
        - 价格回调至此前私募价格附近或更低变得合理，因为当前跃升没有披露的收入或基准数据支撑。
        - 信号可能包括里程碑节奏放慢、在取得证据前需要更多融资，或市场对经济性的怀疑加深。
        - 进度延期、采用疲弱，或成本 / 性能出现反向证据。
    notes: 情景区间是以观察到的 2026 年 2 月和 8 月融资价格为锚的里程碑启发式判断，因为指定证据未披露收入、利润率，也没有足够的公开可比公司支持精确模型。
    claimRefs:
      - CV002
      - CV003
      - CV010
      - CV011
      - CV012
