  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              留存来源将 Olix 描述为一家以推理为先的硬件公司，而不是通用 AI 半导体供应商。在 TechTimes、New Electronics 和 DatacenterDynamics
              的报道中，反复出现的切入点是大语言模型推理的 decode 阶段；数据搬运和内存带宽被视为瓶颈。按这一框架，公司所处市场是机架级推理基础设施和加速器采购，现有 GPU
              系统是现状替代方案。该边界排除了大部分以训练为主的算力预算、通用企业边缘设备和纯软件推理优化，尽管这些类别仍会影响更广泛的 AI 技术栈。就实际尽调而言，Olix 并未声称服务全部 AI
              芯片支出，而是认为某个具体工作负载的瓶颈足够大，值得采用专用系统架构。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
              - CM007
