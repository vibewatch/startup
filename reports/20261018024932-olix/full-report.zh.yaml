        title: 融资历史、估值跃升与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              最有依据的融资图景是：2026 年 8 月 3 日宣布的 $312m Series B，估值 $3.3bn。公开报道列出了金融、战略和政府关联的多类支持者，包括 Fundomo、Arm、Hudson River
              Trading、Reed Hastings、英国政府的 Sovereign AI
              风投基金，以及多家老股东。这足以梳理公开与该轮相关的参与者，却不足以重建投后股权结构表、优先股堆叠、债务敞口或任何老股转让部分。历史融资也存在冲突：Data Center Dynamics 和 New
              Electronics 报道 2026 年 2 月完成 $220m 融资、估值 $1bn，而投资方 Plural 称融资额为 $250m
              亿美元。因此，最新公告层面的融资叙事来源充足，但无法支持精确的累计融资总额或完整的控制权与经济权益判断。
