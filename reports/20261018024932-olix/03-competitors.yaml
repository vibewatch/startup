company:
  name: "Olix"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Olix is competing less against one direct like-for-like startup than against a
    stack of incumbent and substitute routes: Nvidia-led merchant GPU systems,
    specialized inference ASICs such as Cerebras and Etched, hyperscaler-owned
    silicon such as TPU and Trainium, and software or internal-build workarounds.
    The retained evidence suggests Olix's wedge is bypassing HBM and advanced
    packaging constraints with SRAM plus photonics, but the same sources also
    show that the company has no public independent benchmarks, no named
    production customers, and a long incumbent-response window before H2 2027
    delivery.
sections:
  - id: "competitive-landscape"
    title: "Landscape breadth is wider than direct photonic-chip peers"
    body: >-
      The assigned pool supports a broad competitive set rather than a single
      startup-versus-startup matchup. Multiple retained sources describe Olix as
      an attempt to dislodge Nvidia's HBM-based inference stack by specializing
      around decode, SRAM, and photonic interconnects rather than by shipping a
      faster general-purpose GPU. The same evidence set names Cerebras, Etched,
      Groq's assets under Nvidia, Google TPU, Amazon Trainium, and
      software-layer or internal-build paths as plausible ways a buyer can solve
      the same inference problem. That matters because buyer substitution is not
      limited to "another photonic chip"; a procurement team can stay with the
      incumbent merchant stack, move to a hyperscaler-controlled stack, buy a
      specialty inference ASIC, or postpone new silicon and optimize software
      around the installed base.
    claimRefs: ["CP001", "CP004", "CP005", "CP006", "CP012"]
    tableRefs: ["TP001"]
  - id: "capability-and-procurement-tradeoffs"
    title: "Capability and procurement tradeoffs favor incumbents until Olix ships"
    body: >-
      The strongest supported differentiator is architectural: several sources
      repeat that Olix is trying to avoid HBM and advanced packaging by storing
      weights in on-chip SRAM and moving data with photonics. That wedge is
      strategically relevant because the retained pool also frames inference
      economics as constrained by memory movement, packaging, and supply access.
      But the same pool does not provide public list pricing, contract terms, or
      independent benchmark results for Olix, and it offers only thin pricing
      detail for the alternatives as well. In practice, that means current
      comparisons are procurement-readiness comparisons rather than ROI-grade
      price comparisons: Nvidia-class merchant systems and hyperscaler-owned
      silicon are available now, while Olix is still selling an architecture
      thesis for a product targeted at first customer delivery in H2 2027.
    claimRefs: ["CP002", "CP003", "CP009", "CP011", "CP014"]
    tableRefs: ["TP002", "TP003"]
  - id: "durability-and-response-risk"
    title: "Moat durability depends on supply-chain relief arriving before incumbents adapt"
    body: >-
      The moat case in this pool is not raw arithmetic leadership; it is a claim
      that the fastest route to cheaper inference is to avoid the memory and
      packaging chokepoints surrounding HBM-centric systems. That could become a
      real wedge if Olix ships on time and if its photonic interconnect and
      compiler stack make specialized decode systems economical at rack scale.
      The disconfirming evidence is equally clear: public sources still lack
      independent benchmarks and named production deployments, while Nvidia is
      described as both the incumbent merchant platform and an active investor in
      photonics. Buyers can therefore multi-home at the portfolio level—keeping
      GPU fleets, testing specialized ASICs, and using cloud or software
      substitutes—until Olix proves it can turn architectural novelty into
      deployed systems.
    claimRefs: ["CP003", "CP008", "CP010", "CP013", "CP014"]
    figureRefs: ["FP001"]
