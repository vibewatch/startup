      falls short of what is needed to underwrite a buy call at the round mark.
    claimRefs: [CV001, CV004, CV009, CV012]
  - calloutType: risk
    title: The key unlock is third-party proof, not another funding headline
    body: >-
      Independent benchmark data, named design wins or paid pilots, and clearer
      financing terms would do more to move the recommendation than additional
      narrative coverage of the same round.
    claimRefs: [CV004, CV010, CV011]
