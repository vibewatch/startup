company:
  name: Olix
chapter:
  number: 8
  title: Valuation
  summary: >-
    Olix's August 2026 financing establishes a real market price signal, but the
    $3.3 billion mark is still being set ahead of public revenue, named customer
    proof, or independent benchmark validation. The evidence supports keeping the
    recommendation at research-more with a stretched valuation stance until
    delivery and commercialization milestones move from narrative to verified
    performance.
sections:
  - id: price-sensitive-view
    title: Price-sensitive recommendation
    body: >-
      The current financing context is impressive on its face: multiple
      independent outlets report that Olix raised a $312 million Series B at a
      $3.3 billion valuation in August 2026, only about six months after a
      roughly $1 billion February 2026 mark. That step-up matters because first
      customer systems are still targeted for H2 2027 rather than already in
      production. In other words, investors are underwriting a future delivery
      and adoption curve rather than public commercial proof available today.
      Because the assigned evidence does not disclose revenue, ARR, gross
      margin, or named paid deployments, the chapter should not pretend that a
      conventional multiple-based valuation is well grounded. The right
      interpretation is that Olix has won a strong financing signal, but the
      price already assumes several technical and commercial milestones that the
      public evidence has not yet independently verified.
    claimRefs: [CV001, CV002, CV003, CV009, CV012]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: valuation-support-and-gaps
    title: What supports the valuation and what does not
    body: >-
      The bull case is understandable. Multiple sources describe Olix as a
      decode-focused, SRAM-plus-photonics architecture intended to avoid HBM
      bottlenecks, lower inference cost, and create an alternative to incumbent
      GPU economics. Strategic participation from Arm, the UK Sovereign AI
      venture fund, Hudson River Trading, and Reed Hastings also improves the
      company's financing credibility and access to follow-on capital. But the
      sources also show why that is not enough to turn the round price into an
      investable public valuation floor: technical claims are still largely
      company- or investor-framed, commercialization is future-dated, and the
      strongest adverse source in the pool explicitly notes the absence of
      independent benchmarks, cost-per-token data, or named third-party proof.
      The valuation is therefore being supported more by architectural promise,
      investor quality, and timing around AI infrastructure scarcity than by
      independently observed operating performance.
    claimRefs: [CV004, CV005, CV006, CV007, CV008]
    tableRefs: [TV002]
  - id: scenario-discipline-and-diligence
    title: Scenario discipline and final diligence asks
    body: >-
      Scenario framing should stay milestone-based, not false-precision
      spreadsheet work. The assigned evidence is strong enough to anchor the
      recent financing marks and to show that Olix has execution momentum, but
      it is not strong enough to defend a hard fair-value point estimate. That
      means the decision process should focus on what would earn the current
      price or force a reset. The most important unlocks are independent
      benchmark data, named design wins or paid pilots, and clearer financing
      terms around dilution and preferences. If those arrive before or during
      the H2 2027 delivery window, the August round price could look
      justifiable. If delivery slips, customers stay unnamed, or economics fail
      to validate, the downside is a financing reset back toward much lower
      private marks because today's step-up is not anchored by disclosed
      commercial metrics.
    claimRefs: [CV007, CV010, CV011, CV012]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current view
      - Decision implication
    rows:
      - [Recommendation, research-more, "Do not underwrite upside from the August 2026 round price without new proof."]
      - [Confidence, medium, "The financing facts are well corroborated, but valuation support beyond the round mark is still incomplete."]
      - [Risk rating, high, "Commercial, schedule, and proof gaps still dominate before H2 2027 delivery."]
      - [Valuation stance, stretched, "The $3.3B mark prices future milestones ahead of public benchmarks or revenue disclosure."]
    notes: >-
      Summary judgments are anchored to the assigned August 2026 financing mark
      and the absence of public commercialization metrics, not to a revenue
      multiple or DCF.
    claimRefs: [CV001, CV003, CV004, CV009, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence today
      - What would change the view
    rows:
      - ["Bull: architecture could matter", "Independent and investor-linked sources consistently describe an HBM-free, decode-focused SRAM-plus-photonics stack aimed at lower inference cost.", "Independent production benchmarks that validate throughput, latency, and power claims."]
      - ["Bull: financing quality is strong", "Arm, the UK Sovereign AI fund, Hudson River Trading, Reed Hastings, and existing investors all backed the round.", "Named customers or OEM commitments that convert financial signaling into market proof."]
      - ["Anti-thesis: proof is still thin", "Assigned sources do not disclose public revenue, ARR, named paid pilots, or independent customer references.", "Any verified commercial metrics, paid deployments, or external customer case studies."]
      - ["Anti-thesis: valuation already anticipates success", "The mark moved from about $1B in February 2026 to $3.3B in August 2026 before H2 2027 delivery.", "A lower entry price or milestone achievement before additional capital is required."]
    notes: >-
      This table separates investor and architecture support from actual
      commercialization evidence; it does not treat syndicate quality as a
      substitute for customer validation.
    claimRefs: [CV002, CV004, CV005, CV008, CV009]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - ["Bull", "Independent benchmarks validate DX-1 economics, named design wins or paid pilots emerge, and H2 2027 delivery holds.", "Sustaining or exceeding the $3.3B mark becomes defensible because commercial proof starts to catch up with the financing narrative.", "Public milestone cadence improves before additional financing is needed.", "Benchmark underperformance or first-customer slip."]
      - ["Base", "Olix continues executing technically and hiring, but public proof remains limited until close to launch.", "Value likely sits between the prior private mark and the August 2026 mark because investors are still paying for option value rather than demonstrated earnings power.", "Mixed evidence: strong backers plus real technical progress, but limited external validation.", "Longer proof timeline or unclear unit economics."]
      - ["Bear", "Delivery slips, benchmarks stay undisclosed, or customer validation does not materialize.", "A reset toward or below prior private marks becomes plausible because the current step-up is not supported by disclosed revenue or benchmark data.", "Signals would include a slower milestone cadence, more financing needed before proof, or widening skepticism on economics.", "Schedule slip, muted adoption, or adverse evidence on cost/performance."]
    notes: >-
      Scenario bands are milestone-based heuristics anchored on the observed
      February and August 2026 financing marks because the assigned evidence
      does not disclose revenue, margins, or enough public comparables for a
      precise model.
    claimRefs: [CV002, CV003, CV010, CV011, CV012]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Financing strength and architectural promise are outweighed, for now, by
      proof gaps and a valuation that already prices future execution.
    data:
      nodes:
        - id: capital
          label: Strong financing signal
          detail: $312M Series B with strategic and government-linked backers.
        - id: architecture
          label: Technical upside exists
          detail: SRAM-plus-photonics could ease HBM bottlenecks if delivered as claimed.
        - id: proof-gap
          label: Independent proof gap
          detail: No public independent benchmarks, revenue, or named paid customer evidence in the assigned pool.
          tone: warning
        - id: timing
          label: Commercial timing remains future-dated
          detail: First customer systems are still targeted for H2 2027.
          tone: warning
        - id: pricing
          label: Price already demanding
          detail: The mark stepped from about $1B in February 2026 to $3.3B in August 2026.
          tone: warning
        - id: decision
          label: Recommendation stays research-more
          detail: Wait for benchmark, customer, and financing-term proof before underwriting upside.
          tone: warning
      edges:
        - from: capital
          to: architecture
          label: supports upside narrative
        - from: architecture
          to: proof-gap
          label: still needs external validation
        - from: proof-gap
          to: timing
          label: extends uncertainty window
        - from: timing
          to: pricing
          label: leaves valuation ahead of proof
        - from: pricing
          to: decision
          label: drives entry discipline
    approximationNotes: >-
      This is a qualitative decision chain, not a quantified conversion funnel
      or probability model.
    claimRefs: [CV001, CV003, CV004, CV009, CV010]
