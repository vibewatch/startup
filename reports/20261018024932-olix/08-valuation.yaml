  evidenceGaps:
    - type: missing-source
      severity: material
      topic: commercial-proof
      missingEvidence: Independent benchmark results, named design wins or paid pilots, and customer references with economics.
      whyItMatters: Those data would show whether the August 2026 valuation reflects real adoption or only architectural promise.
      diligencePath: Request benchmark packages, customer reference calls, and any signed pilot or design-win evidence before revisiting the recommendation.
      relatedQuestionRefs: [QV001, QV005, QV007, QV008]
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: Post-Series B cap table, liquidation preferences, pro rata structure, and governance/control terms.
      whyItMatters: Price alone is insufficient if dilution, preferences, or control rights materially change downside protection and return potential.
      diligencePath: Request the lead term sheet summary, board composition, and post-money ownership table from the company or investors.
      relatedQuestionRefs: [QV002, QV008]
    - type: missing-source
      severity: material
      topic: valuation-comparables
      missingEvidence: Revenue, ARR, backlog, margin, or order-book disclosure plus any external valuation memo or comp set.
      whyItMatters: Without operating metrics, the scenario work cannot move from heuristic milestone bands to a more defendable valuation framework.
      diligencePath: Request monthly bookings and revenue bridges, unit-economics support, and any comparable-company valuation work used in the round.
      relatedQuestionRefs: [QV007, QV008]
      relatedTableRefs: [TV003]
