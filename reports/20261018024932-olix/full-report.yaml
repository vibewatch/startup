  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitute
        blocks:
          - type: paragraph
            body: >-
              The retained sources describe Olix as an inference-first hardware company rather than a general AI
              semiconductor vendor. Across TechTimes, New Electronics, and DatacenterDynamics, the recurring wedge is
              the decode stage of large language model inference, where data movement and memory bandwidth are presented
              as the binding constraint. That framing puts the company in the market for rack-scale inference
              infrastructure and accelerator procurement, with incumbent GPU systems as the status-quo substitute. It
              excludes most training-led compute budgets, generic enterprise edge devices, and software-only inference
              optimizations, even though those categories still affect the broader AI stack. In practical diligence
              terms, Olix is not claiming to serve all AI chip spend; it is claiming that a specific workload bottleneck
              is large enough to justify a specialized system architecture.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
              - CM007
      - number: '2.2'
        title: Sizing lenses are capital proxies, not demand proof
        blocks:
          - type: paragraph
            body: >-
              No retained source publishes an Olix-specific TAM, SAM, or SOM, so the public record sizes this market
              indirectly. The strongest numeric lenses are financing and policy signals: TechTimes cites $16 billion of
              semiconductor investment committed globally in 2026 so far and $8.3 billion into AI chip startups, while
              the UK Sovereign AI Fund adds a state-backed compute-policy layer to the story. Those numbers show that
              investors and governments believe inference hardware and sovereign compute are worth funding, but they do
              not prove that buyers will switch workloads or budgets to Olix. The cleanest interpretation is that public
              evidence supports a hot funding environment around inference infrastructure, while the commercial market
              size for Olix's specific architecture remains unquantified.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM013
              - CM014
              - CM016
      - number: '2.3'
        title: Buyer path, adoption drivers, and gating constraints
        blocks:
          - type: paragraph
            body: >-
              The likely buyer path remains inferred rather than named. Retained sources point to hyperscalers, cloud or
              model operators, and other latency-sensitive infrastructure teams because the value proposition centers on
              recurrent inference cost, throughput per watt, and relief from HBM and advanced-packaging shortages.
              Policy-backed compute programs are part of the narrative, but they are still financing signals rather than
              purchase orders. The harder constraint is execution risk: AI Tech Connect says there are no independent
              benchmarks, no published cost-per-million-token data, and no third-party model runs, while TechTimes and
              related coverage emphasize photonic-manufacturing and yield risks before first customer delivery targeted
              for H2 2027. Adoption therefore depends on proving that the architecture can move from a compelling
              bottleneck thesis to customer-qualified hardware on schedule.
            claimRefs:
              - CM005
              - CM011
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM007
              - CM011
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The wedge is a bottleneck, not a broad category claim
            body: >-
              Olix's best-supported market argument is that decode inference and HBM scarcity create a specific pain
              point that incumbent GPU systems do not address cleanly. That is narrower than the total AI-chip market,
              but it is more credible than a generic 'AI compute is huge' narrative.
            calloutType: insight
            claimRefs:
              - CM002
              - CM004
              - CM006
          - type: callout
            title: Public demand proof is still missing
            body: >-
              The retained sources support investor appetite and architecture intent, but they do not provide
              independent benchmark results, cost-per-token disclosures, or named customer deployments. Until first
              deliveries and third-party validation arrive, market adoption remains an inference rather than a
              demonstrated fact.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape breadth is wider than direct photonic-chip peers
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a broad competitive set rather than a single startup-versus-startup matchup.
              Multiple retained sources describe Olix as an attempt to dislodge Nvidia's HBM-based inference stack by
              specializing around decode, SRAM, and photonic interconnects rather than by shipping a faster
              general-purpose GPU. The same evidence set names Cerebras, Etched, Groq's assets under Nvidia, Google TPU,
              Amazon Trainium, and software-layer or internal-build paths as plausible ways a buyer can solve the same
              inference problem. That matters because buyer substitution is not limited to "another photonic chip"; a
              procurement team can stay with the incumbent merchant stack, move to a hyperscaler-controlled stack, buy a
              specialty inference ASIC, or postpone new silicon and optimize software around the installed base.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
              - CP012
      - number: '3.2'
        title: Capability and procurement tradeoffs favor incumbents until Olix ships
        blocks:
          - type: paragraph
            body: >-
              The strongest supported differentiator is architectural: several sources repeat that Olix is trying to
              avoid HBM and advanced packaging by storing weights in on-chip SRAM and moving data with photonics. That
              wedge is strategically relevant because the retained pool also frames inference economics as constrained
              by memory movement, packaging, and supply access. But the same pool does not provide public list pricing,
              contract terms, or independent benchmark results for Olix, and it offers only thin pricing detail for the
              alternatives as well. In practice, that means current comparisons are procurement-readiness comparisons
              rather than ROI-grade price comparisons: Nvidia-class merchant systems and hyperscaler-owned silicon are
              available now, while Olix is still selling an architecture thesis for a product targeted at first customer
              delivery in H2 2027.
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP011
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP010
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP007
              - CP011
              - CP013
              - CP014
      - number: '3.3'
        title: Moat durability depends on supply-chain relief arriving before incumbents adapt
        blocks:
          - type: paragraph
            body: >-
              The moat case in this pool is not raw arithmetic leadership; it is a claim that the fastest route to
              cheaper inference is to avoid the memory and packaging chokepoints surrounding HBM-centric systems. That
              could become a real wedge if Olix ships on time and if its photonic interconnect and compiler stack make
              specialized decode systems economical at rack scale. The disconfirming evidence is equally clear: public
              sources still lack independent benchmarks and named production deployments, while Nvidia is described as
              both the incumbent merchant platform and an active investor in photonics. Buyers can therefore multi-home
              at the portfolio level—keeping GPU fleets, testing specialized ASICs, and using cloud or software
              substitutes—until Olix proves it can turn architectural novelty into deployed systems.
            claimRefs:
              - CP003
              - CP008
              - CP010
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP010
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The real wedge is supply-chain bypass, not raw FLOPS
            body: >-
              Across the retained sources, Olix's differentiation case is repeatedly framed around avoiding HBM and
              advanced packaging constraints rather than claiming an already-proven throughput lead in deployed customer
              workloads.
            calloutType: insight
            claimRefs:
              - CP002
              - CP009
          - type: callout
            title: Incumbent response window stays open until shipment
            body: >-
              Because public evidence still stops short of independent benchmarks or named production customers, Nvidia
              and other substitute routes can keep the category in a multi-home state until Olix turns its architecture
              into shipped systems.
            calloutType: risk
            claimRefs:
