  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Financing scale is visible; revenue visibility is not
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial signal is financing momentum, not operating output. Multiple assigned
              sources corroborate that Olix announced a $312 million Series B at a $3.3 billion valuation in August
              2026, after a separately reported $220 million February 2026 round. That level of capital matters because
              Olix is still describing future system shipments rather than current commercial throughput, so the
              balance-sheet story is easier to verify than the revenue story. The same evidence set does not disclose
              list pricing, realized selling prices, signed backlog, revenue, ARR, or customer count, which means the
              chapter can explain the intended revenue mechanism but cannot yet validate revenue quality or current
              commercial traction. The retrieved text of the official news page also contained only media-contact
              language, so it did not close those disclosure gaps.
            claimRefs:
