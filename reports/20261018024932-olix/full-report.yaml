        title: Funding history, valuation step-up, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The most supportable financing picture is a $312m Series B at a $3.3bn valuation announced on 3 August
              2026. Public coverage names a mix of financial, strategic, and state-linked backers, including Fundomo,
              Arm, Hudson River Trading, Reed Hastings, the UK government's Sovereign AI venture fund, and multiple
              returning investors. That is enough to map who is publicly associated with the round, but not enough to
              reconstruct the post-money cap table, preference stack, debt exposure, or any secondary component.
              Historical funding also conflicts: Data Center Dynamics and New Electronics report a February 2026 $220m
              round at a $1bn valuation, while investor Plural describes a $250m round. The financing narrative is
              therefore well sourced at the latest-announcement level but does not support a precise cumulative total or
              complete control-and-economics view.
