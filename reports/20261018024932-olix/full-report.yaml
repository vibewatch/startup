              - CO015
      - number: '1.2'
        title: Leadership, governance, and key-person concentration
        blocks:
          - type: paragraph
            body: >-
              The August 2026 round came with two visible leadership upgrades: Nick McKeown joined the board and former
              Wise CFO Matt Briers joined as chief financial officer. Those additions strengthen governance and finance
              credibility ahead of a long hardware commercialization cycle. At the same time, retained independent
              coverage still centers heavily on founder James Dacombe, including reporting that he also leads CoMind,
              which increases key-person concentration risk in the absence of a fuller public executive roster or board
              committee disclosure. Public sources therefore support the existence of senior additions, but not a
              complete view of management redundancy, succession depth, or formal governance controls.
