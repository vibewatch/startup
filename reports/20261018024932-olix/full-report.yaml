              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Retention, expansion, and concentration cannot yet be underwritten from public evidence
        blocks:
          - type: paragraph
            body: >-
              The hardest diligence questions for investors are the ones the current source set does not answer. No
              assigned source discloses NRR, GRR, logo retention, renewal rates, contract terms, or top-customer
              concentration, and none names a design partner, procurement win, or customer testimonial that would let an
              investor test account quality. Public messaging instead emphasizes future scale-out potential and
              aggressive team expansion. That means Olix's expansion loop is presently a hypothesis: if the silicon
              works and deliveries land in 2027, large accounts could expand rack by rack, but the evidence required to
              underwrite durability or concentration risk is still private. The disclosure gap is a diligence
              constraint, not proof that customer activity is absent.
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU011
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU008
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof is the largest unresolved diligence gap
            body: >-
              The current evidence base supports a credible target market and a funded commercialization plan, but it
              does not yet support a view on account quality, expansion durability, or concentration because no named
              customer, pilot, benchmark, or retention metric is public.
            calloutType: risk
            claimRefs:
              - CU004
              - CU006
              - CU008
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Execution risk still dominates the downside
        blocks:
          - type: paragraph
            body: >-
              Olix's risk profile is still dominated by execution risk rather than financing access. The company moved
              from a February 2026 round valuing it above $1 billion to an August 2026 Series B at $3.3 billion, while
              public sources still place first customer delivery in H2 2027 rather than in-market today. That creates a
              long gap in which value must be justified by shipping silicon, not just by fundraising momentum. The
              public evidence is also explicit about what is still missing: retained third-party sources say there are
              no independent benchmarks, no disclosed cost-per-token or power envelope, and no public customer-run
              production results yet. In practical terms, the highest-severity risk is a schedule or performance miss
              before commercialization, because the valuation already moved ahead of independent product proof.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR008
              - CR009
              - CR011
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory and legal risk is mostly a disclosure gap today
        blocks:
          - type: paragraph
            body: >-
              The retained pool does not show a public legal incident, but it also does not provide the underlying
              artifacts that would clear legal and compliance risk. There is no direct regulator, court, patent,
              certification, or incident record in the assigned evidence, so export-control exposure, IP chain-of-title,
              enterprise security posture, and litigation status remain unresolved rather than de-risked. That gap
              matters more because sovereign capital is already on the cap table and the company is scaling hiring
              across multiple geographies, both of which raise the cost of a compliance mistake. Governance additions
              such as a CFO and an experienced board member are real mitigants for internal control, but they do not
              substitute for diligence on export controls, IP ownership, benchmark substantiation, or customer-contract
              representations.
            claimRefs:
              - CR007
              - CR010
              - CR012
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR010
              - CR012
              - CR014
      - number: '7.3'
        title: Counterparty and system dependencies need explicit milestone proof
        blocks:
          - type: paragraph
            body: >-
              Dependency risk is concentrated in counterparties and subsystems that public materials do not yet name or
              validate. The retained sources say the Series B will finance manufacturing and supply-chain commitments,
              but they do not disclose foundry, packaging, or OSAT counterparties in the public pool. Strategic backers
              like Arm and the UK Sovereign AI fund help credibility, yet public adoption proof still depends on named
              OEM, cloud, or customer commitments that are not disclosed here. The architecture's main mitigation is to
              avoid HBM and advanced packaging bottlenecks, but that replaces one constraint with another: compiler
              portability, photonic interconnect scale, and system integration all have to work at production quality
              before the H2 2027 window narrows. The investment kill criteria are therefore concrete: named
              manufacturing relationships, independent throughput and power data, and evidence of customer sampling need
              to appear before the first-delivery timeline becomes tight.
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR011
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction kill criteria
            body: >-
              If independent throughput or power data still has not appeared by customer-sampling time, if manufacturing
              counterparties remain unnamed as tapeout and qualification approach, or if the H2 2027 delivery target
              slips without offsetting customer proof, the risk case moves from speculative to thesis-breaking.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR009
              - CR013
          - type: callout
            title: Public mitigations are real, but they are still mostly enabling conditions
            body: >-
              The public record does show meaningful mitigations: substantial capital, a CFO hire, a board addition, and
              an architecture intended to sidestep HBM and advanced-packaging bottlenecks. Those reduce financing and
              process risk, but they do not yet substitute for independent product proof or named customer and
              manufacturing evidence.
            calloutType: insight
            claimRefs:
              - CR010
              - CR011
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive recommendation
        blocks:
          - type: paragraph
            body: >-
              The current financing context is impressive on its face: multiple independent outlets report that Olix
              raised a $312 million Series B at a $3.3 billion valuation in August 2026, only about six months after a
              roughly $1 billion February 2026 mark. That step-up matters because first customer systems are still
              targeted for H2 2027 rather than already in production. In other words, investors are underwriting a
              future delivery and adoption curve rather than public commercial proof available today. Because the
              assigned evidence does not disclose revenue, ARR, gross margin, or named paid deployments, the chapter
              should not pretend that a conventional multiple-based valuation is well grounded. The right interpretation
              is that Olix has won a strong financing signal, but the price already assumes several technical and
              commercial milestones that the public evidence has not yet independently verified.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
              - CV010
      - number: '8.2'
        title: What supports the valuation and what does not
        blocks:
          - type: paragraph
            body: >-
              The bull case is understandable. Multiple sources describe Olix as a decode-focused, SRAM-plus-photonics
              architecture intended to avoid HBM bottlenecks, lower inference cost, and create an alternative to
              incumbent GPU economics. Strategic participation from Arm, the UK Sovereign AI venture fund, Hudson River
              Trading, and Reed Hastings also improves the company's financing credibility and access to follow-on
              capital. But the sources also show why that is not enough to turn the round price into an investable
              public valuation floor: technical claims are still largely company- or investor-framed, commercialization
              is future-dated, and the strongest adverse source in the pool explicitly notes the absence of independent
              benchmarks, cost-per-token data, or named third-party proof. The valuation is therefore being supported
              more by architectural promise, investor quality, and timing around AI infrastructure scarcity than by
              independently observed operating performance.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV008
              - CV009
      - number: '8.3'
        title: Scenario discipline and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Scenario framing should stay milestone-based, not false-precision spreadsheet work. The assigned evidence
              is strong enough to anchor the recent financing marks and to show that Olix has execution momentum, but it
              is not strong enough to defend a hard fair-value point estimate. That means the decision process should
              focus on what would earn the current price or force a reset. The most important unlocks are independent
              benchmark data, named design wins or paid pilots, and clearer financing terms around dilution and
              preferences. If those arrive before or during the H2 2027 delivery window, the August round price could
              look justifiable. If delivery slips, customers stay unnamed, or economics fail to validate, the downside
              is a financing reset back toward much lower private marks because today's step-up is not anchored by
              disclosed commercial metrics.
            claimRefs:
              - CV007
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation remains research-more
            body: >-
              The August 2026 round proves financing demand, but public evidence still falls short of what is needed to
              underwrite a buy call at the round mark.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV012
          - type: callout
            title: The key unlock is third-party proof, not another funding headline
            body: >-
              Independent benchmark data, named design wins or paid pilots, and clearer financing terms would do more to
              move the recommendation than additional narrative coverage of the same round.
            calloutType: risk
            claimRefs:
              - CV004
              - CV010
              - CV011
