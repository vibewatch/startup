chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and product stance
        blocks:
          - type: paragraph
            body: >-
              Olix presents itself as a London-founded 2024 company building infrastructure for frontier AI inference,
              with systems delivered as complete racks rather than a standalone chip SKU. The official August 2026
              financing announcement and company homepage both anchor the same core story: Olix is pursuing an
              inference-first architecture built around custom silicon, photonics, networking, and SRAM-heavy system
              design. That makes the current company stage legible as a capital-intensive Series B hardware build rather
              than a commercially proven deployment platform. Public materials describe the product direction and target
              workload clearly, but they do not disclose revenue, named paid pilots, or customer counts that would
              convert the identity story into verified operating scale.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO015
