            body: >-
              The retained sources support a limited milestone arc from 2024 founding through the February and August
              2026 financings, board and CFO additions, and a stated target to reach first DX-1 customer deliveries in
              H2 2027. Investor commentary also claims that optical, electronic, and software integration is complete
