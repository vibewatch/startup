              - CI013
      - number: '4.2'
        title: Public cost signals are architectural, not economic
        blocks:
          - type: paragraph
            body: >-
              Public materials describe cost drivers qualitatively rather than numerically. Olix's thesis is that a
              decode-focused design using on-chip SRAM and photonic interconnect can avoid HBM and advanced-packaging
              bottlenecks, which could improve supply availability and the eventual cost base versus a conventional GPU
              stack. But those same materials provide no verified bill of materials, yield assumptions, gross margin
              range, installation burden, service cost, CAC, sales cycle, or payback period. Even the best public
              performance claims remain company-led and forward-looking. For diligence, the key takeaway is that
              architecture may explain future economics, but it does not substitute for shipment-era gross-profit and
              customer-acquisition data.
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI010
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI010
              - CI013
              - CI014
      - number: '4.3'
        title: Capital appears ample for the next build phase, but the underwriting case is still milestone-driven
        blocks:
          - type: paragraph
            body: >-
              The disclosed financings suggest Olix is better capitalized than most hardware startups at a comparable
              product stage, and the addition of board and finance leadership around the Series B supports the view that
              the company is preparing for a more complex manufacturing and fundraising cycle. Even so, independent
              coverage still describes the business as pre-product and pre-revenue, with first customer deliveries only
              targeted for H2 2027 and no independent benchmark data yet in the assigned pool. That combination means
              capital adequacy cannot be reduced to cash raised alone: without burn, capex, working-capital, and
              customer-conversion data, the $3.3 billion valuation still assumes future technical and commercial
              milestones that remain unproven in public.
            claimRefs:
              - CI003
              - CI004
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting is capital-first, revenue-later
            body: >-
              The assigned evidence supports financing momentum and a coherent product thesis, but it does not yet
              support revenue quality, pricing power, or unit economics. Until Olix shows contracted demand, benchmarked
              system performance, and post-shipment margin data, the financial case rests on execution into H2 2027
              rather than on present commercial proof.
            calloutType: risk
            claimRefs:
              - CI001
              - CI004
              - CI007
              - CI010
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and workflow target
        blocks:
          - type: paragraph
            body: >-
              The disclosed customer workflow is not general AI training; it is inference serving, and specifically the
              decode stage where models repeatedly reread weights while generating output tokens. Across independent
              coverage, Olix's first public product surface is the DX-1 inside the X-1 platform, framed as a decode
              accelerator rather than a broad replacement for all GPU work. That matters because the product promise is
              narrow and concrete: improve interactivity and throughput on the latency-sensitive part of model serving,
              while leaving the prefill-heavy portions of the stack outside the company's strongest public claim set.
            claimRefs:
              - CE001
              - CE004
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Public descriptions converge on the same stack: an OTPU or optical-digital compute path, on-chip SRAM
              rather than HBM, and an optical interconnect that links many chips into a larger serving domain. The
              central mechanism is to attack data movement, not just arithmetic density. Plural and New Electronics both
              describe the processor as digital rather than analog photonics, while DCD and The Robotics Media emphasize
              the "slow and wide" optical network and rack-scale expansion claims. In practical diligence terms, the
              architecture is specific enough to analyze, but most public evidence still describes design intent and
              claimed system behavior rather than independent performance.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE011
              - CE013
