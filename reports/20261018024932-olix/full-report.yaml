  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments are inferable, but commercialization is still ahead of delivery
        blocks:
          - type: paragraph
            body: >-
              The public record supports an initial customer thesis, not a demonstrated installed base today.
              Independent coverage consistently describes Olix as an inference-focused infrastructure vendor whose first
              chip targets the decode stage of large-language-model serving, which implies early buyers are likely to be
              frontier-model operators, cloud inference platforms, and other teams running large-scale AI inference
              clusters rather than edge-device OEMs or broad enterprise IT buyers. That positioning may be commercially
              attractive if inference economics keep worsening, but the same sources say customer deliveries are still
              planned for 2027, so the chapter's core judgment is that the segment story is clearer than the
              customer-proof story.
