              - CE012
      - number: '5.3'
        title: Maturity, deployment path, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Olix remains pre-commercial at the run date. Multiple sources place first customer delivery in H2 2027,
              and the latest financing is described as supporting first-chip delivery, silicon-platform build-out, and
              manufacturing commitments. The best positive maturity signal in the assigned evidence is partner-sourced:
              Plural says the company has demonstrated its foundational technology, completed
              optical/electronic/software integration, and moved into custom-ASIC development. That is encouraging, but
              it is still not a substitute for a named pilot, a deployed customer system, or an independently operated
              benchmark on production silicon.
            claimRefs:
              - CE007
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE007
      - number: '5.4'
        title: Differentiation, trust controls, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The differentiation case is clear in theory: Olix says the SRAM-plus-photonics stack can outperform
              HBM-based accelerators on throughput per megawatt and total cost of ownership, while also sidestepping the
              supply bottlenecks that handicap mainstream accelerators. The diligence problem is that public proof is
              thinner than the architecture story. Inference Chips explicitly says no independent benchmark has been
              published and that public materials do not identify named production deployments. The assigned source pool
              also does not surface public security, privacy, reliability, or compliance materials, so trust and
              operational controls remain substantially under-documented for an infrastructure product that would sit
              inside critical inference paths.
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural differentiation is aimed at the memory bottleneck
            body: >-
              Olix is not publicly pitching another general-purpose GPU. The story is a narrower inference stack that
              avoids HBM, specializes in decode, and uses optical links to expand the serving domain.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE005
