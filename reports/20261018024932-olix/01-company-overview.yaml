    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - [Fundomo, "Series B investor", "Named as part of the August 2026 syndicate and described in AITech as the lead.", "Confirm check size, board rights, and any lead-investor protective provisions."]
      - [Arm, "Strategic investor", "Signals ecosystem relevance and semiconductor credibility, but economics and commercial tie-ins are undisclosed.", "Request any commercial, supply, or go-to-market agreements tied to the investment."]
      - [Hudson River Trading, "Series B investor", "Adds technically credible capital to the round, but ownership percentage is undisclosed.", "Confirm ownership stake, information rights, and whether the relationship extends beyond capital."]
      - ["UK Sovereign AI venture fund", "State-linked investor", "Introduces policy alignment and reputational support, but not disclosed control rights.", "Clarify governance rights, strategic conditions, and any domestic production expectations."]
      - ["Returning investors (Hummingbird, Crane, Plural, Creandum, Phoenix Court, Transition)", "Existing backers increasing commitments", "Signals continued support across prior investors, but individual pro rata and ownership concentration are not public.", "Request post-round cap table, pro rata participation levels, and any preference layering."]
      - ["Reed Hastings", "Angel investor", "Named as an angel in the Series B announcement, but economics and involvement are undisclosed.", "Confirm whether participation is symbolic capital or includes advisory access or board observer rights."]
    notes: Publicly disclosed participants only; this is not a cap table and does not evidence secondaries, debt, or liquidation preferences.
    enumerationScope:
      coverage: partial
      basis: Publicly disclosed funding participants and stakeholders named in retained February-August 2026 financing coverage; no ownership register is available.
    claimRefs: [CO003, CO004, CO005, CO016]
