      - ["Nick McKeown", "Board director (appointed August 2026)", "Stanford professor emeritus and co-inventor of software-defined networking per the company announcement.", "Adds deep networking and systems credibility as Olix scales rack-level architecture.", "Medium: governance depth improved, but public sources do not show committee structure or wider board composition."]
      - ["Matt Briers", "Chief Financial Officer (appointed August 2026)", "Former Wise CFO for nine years, according to the company announcement.", "Adds public-markets-grade finance leadership ahead of manufacturing commitments and future capital raises.", "Medium: helpful scaling hire, but finance function breadth below CFO is not publicly described."]
    notes: Publicly named leaders only; the retained sources do not provide a full management-team or board roster.
    enumerationScope:
      coverage: partial
      basis: Publicly named founder, board, and CFO figures in retained August 2026 company and media coverage; this is not a full org chart.
    claimRefs: [CO008, CO009, CO014]
  - id: TO003
