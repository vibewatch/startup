artifact: company-overview
slug: olix
runDate: 2026-10-18
company:
  name: Olix
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Olix announced an August 2026 $312m Series B at a $3.3bn valuation while
    adding Nick McKeown to the board and Matt Briers as CFO. The public record
    supports a clear identity and latest-round timeline, but conflicting
    $220m and $250m accounts of the earlier 2026 financing prevent a reconciled
    total-raised figure; revenue, customer proof, independent benchmark data,
    and post-round ownership also remain materially under-disclosed.
sections:
  - id: identity-and-product
    title: Identity, stage, and product stance
    body: >-
      Olix presents itself as a London-founded 2024 company building
      infrastructure for frontier AI inference, with systems delivered as
      complete racks rather than a standalone chip SKU. The official August 2026
      financing announcement and company homepage both anchor the same core
      story: Olix is pursuing an inference-first architecture built around
      custom silicon, photonics, networking, and SRAM-heavy system design. That
      makes the current company stage legible as a capital-intensive Series B
      hardware build rather than a commercially proven deployment platform.
      Public materials describe the product direction and target workload
      clearly, but they do not disclose revenue, named paid pilots, or customer
      counts that would convert the identity story into verified operating
      scale.
    claimRefs: [CO001, CO002, CO003, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person concentration
    body: >-
      The August 2026 round came with two visible leadership upgrades: Nick
      McKeown joined the board and former Wise CFO Matt Briers joined as chief
      financial officer. Those additions strengthen governance and finance
      credibility ahead of a long hardware commercialization cycle. At the same
      time, retained independent coverage still centers heavily on founder James
      Dacombe, including reporting that he also leads CoMind, which increases
      key-person concentration risk in the absence of a fuller public executive
      roster or board committee disclosure. Public sources therefore support the
      existence of senior additions, but not a complete view of management
      redundancy, succession depth, or formal governance controls.
    claimRefs: [CO008, CO009, CO010, CO014]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Funding history, valuation step-up, and stakeholder map
    body: >-
      The most supportable financing picture is a $312m Series B at a $3.3bn
      valuation announced on 3 August 2026. Public coverage names a
      mix of financial, strategic, and state-linked backers, including Fundomo,
      Arm, Hudson River Trading, Reed Hastings, the UK government's Sovereign AI
      venture fund, and multiple returning investors. That is enough to map who
      is publicly associated with the round, but not enough to reconstruct the
      post-money cap table, preference stack, debt exposure, or any secondary
      component. Historical funding also conflicts: Data Center Dynamics and New
      Electronics report a February 2026 $220m round at a $1bn valuation, while
      investor Plural describes a $250m round. The financing narrative is
      therefore well sourced at the latest-announcement level but does not
      support a precise cumulative total or complete control-and-economics view.
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO011, CO016]
    tableRefs: [TO003]
  - id: milestones-and-proof-gaps
    title: Milestones, readiness signals, and proof gaps
    body: >-
      The retained sources support a limited milestone arc from 2024 founding
      through the February and August 2026 financings, board and CFO additions,
      and a stated target to reach first DX-1 customer deliveries in H2 2027.
      Investor commentary also claims that optical, electronic, and software
      integration is complete and that custom ASIC development is under way,
      but the fetched investor text carries no publication date. The key gap is
      external proof: independent
      commentary explicitly says no public third-party benchmarks, cost-per-token
      data, or power envelope have been published. That leaves the core debate
      unresolved: Olix may have assembled capital, talent, and an ambitious
      roadmap quickly, but the public evidence still does not validate
      commercial traction or performance claims at the new valuation.
    claimRefs: [CO006, CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
