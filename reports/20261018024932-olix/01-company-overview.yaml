          claimRefs: [CO003, CO004]
        - date: 2026-08-03
          label: Nick McKeown joins the board
          detail: The Series B announcement added a high-profile systems and networking operator to governance.
          tone: positive
          claimRefs: [CO008]
        - date: 2026-08-03
          label: Matt Briers becomes CFO
          detail: Olix paired the financing with a senior finance hire from Wise to support scaling.
          tone: positive
          claimRefs: [CO009]
        - period: "H2 2027"
          label: First customer delivery target
          detail: Current financing is intended to fund DX-1 toward first customer deliveries and supply-chain commitments by H2 2027.
          tone: warning
          claimRefs: [CO006]
    approximationNotes: >-
      The assigned evidence supports six dated events or targets, fewer than the
      eight desired for a complete company chronology; H2 2027 is a target, not
      a completed milestone.
    claimRefs: [CO001, CO003, CO005, CO006, CO007, CO008, CO009]
callouts:
  - calloutType: insight
    title: Capital and senior hires are ahead of public operating proof
    body: >-
      The refresh clearly improves Olix's capital base and executive bench, but
      the public evidence still stops short of verified customer, revenue, and
      benchmark disclosure.
    claimRefs: [CO003, CO008, CO009, CO013, CO015]
  - calloutType: risk
    title: Ownership visibility and founder concentration remain open diligence items
    body: >-
      Public sources name the backers and founder, but they do not disclose the
      post-round cap table, preference stack, or enough leadership depth to rule
      out concentrated execution risk.
    claimRefs: [CO004, CO014, CO016]
