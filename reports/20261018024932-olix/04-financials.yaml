    notes: >-
      This table separates public performance and TCO claims from absent commercial
      pricing evidence.
    claimRefs: [CI005, CI006, CI007, CI010]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Revenue or ARR, null, low, Current scale cannot be underwritten without even a directional revenue base, Quarterly revenue bridge and bookings or backlog data]
