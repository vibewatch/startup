    claimRefs: [CI003, CI004, CI005, CI009, CI013]
callouts:
  - calloutType: risk
    title: Underwriting is capital-first, revenue-later
    body: >-
      The assigned evidence supports financing momentum and a coherent product
      thesis, but it does not yet support revenue quality, pricing power, or unit
      economics. Until Olix shows contracted demand, benchmarked system
      performance, and post-shipment margin data, the financial case rests on
      execution into H2 2027 rather than on present commercial proof.
    claimRefs: [CI001, CI004, CI007, CI010, CI014, CI015]
