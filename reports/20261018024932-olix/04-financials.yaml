        - Customer count or named paid deployments
        - null
        - low
        - Demand validation is still indirect without disclosed paid users or contracted systems
        - "Signed pilots, LOIs, paid design wins, and conversion funnel"
      -
        - Gross margin or cost-of-goods profile
        - null
        - low
        - "Hardware valuation risk depends on yield, packaging, support, and system integration economics"
        - "BOM, yield targets, warranty assumptions, and margin bridge"
      -
        - "Burn, runway, or capex plan"
        - null
        - low
        - Cash raised alone does not show how long the company can fund tape-out and ramp
        - "Monthly burn, capex schedule, working-capital needs, and debt or project-finance obligations"
    notes: >-
      Nulls are evidence gaps, not zero values; the assigned pool does not disclose
      these metrics.
    claimRefs: [CI008, CI010, CI013, CI014]
