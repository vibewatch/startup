      - [Optical interconnect plus SRAM memory fabric, Data-center systems teams, Claimed system component; scale proof not public, Avoids HBM dependence and expands via optical links, "No public rack topology, failure-domain, or field-reliability data"]
    notes: Publicly disclosed product surfaces only; rows distinguish described assets from independently validated maturity.
    claimRefs: [CE001, CE002, CE003, CE005, CE007]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - [Interactive LLM decode serving, GPU clusters repeatedly reread weights during token generation, DX-1 is positioned as a decode accelerator inside X-1, Company claims focus on higher interactivity and better decode throughput, No independent production benchmark or SLA evidence]
      - [Memory-bandwidth constrained inference, HBM-heavy systems trade throughput against interactivity, SRAM-plus-photonics architecture avoids HBM in the disclosed design, Public claims emphasize attack on data-movement and memory bottlenecks, No public workload-level cost comparison]
      - [Rack-scale frontier-model serving, Conventional accelerators depend on electrical data movement and packaged memory scale-up, Slow-and-wide optical interconnect is meant to link many chips into one serving domain, DCD reports a 10000-chip multi-rack claim, No public deployment or operations evidence]
      - [Operator capacity planning for 2027 and beyond, Buyers still procure GPUs for near-term inference, Olix pitches future optionality once first deliveries begin, H2 2027 target implies medium-term roadmap visibility, Product is not publicly available at the run date]
    notes: Benefits are company or partner claims unless a row explicitly says otherwise; limitations mark where public proof stops.
    claimRefs: [CE001, CE004, CE005, CE006, CE007]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Decode-specialized compute, Handles sequential generation workload rather than all inference phases, Requires workload fit where decode is the true bottleneck, Narrow specialization may underperform if serving mix changes]
      - [On-chip SRAM memory strategy, Keeps model state off HBM in the disclosed design, Depends on effective sharding and memory orchestration across many chips, Capacity and scaling economics are not independently validated]
      - [Optical-digital processing path, Uses photonics for the hot path while digital systems remain part of the stack, "Depends on calibration, thermal stability, and electrical-optical integration", No public precision or drift evidence in the assigned pool]
      - [Optical interconnect and rack-scale system, Extends the platform across many chips and racks, "Depends on networking, packaging, and manufacturing execution", Public scale claims lack customer-operated proof or failure-data disclosure]
    notes: Architecture rows summarize public descriptions and explicitly separate dependencies from demonstrated operating proof.
    claimRefs: [CE002, CE003, CE005, CE010, CE013]
