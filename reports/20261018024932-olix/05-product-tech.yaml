  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Public security, privacy, compliance, reliability, and support documentation for production deployments.
      whyItMatters: Buyers need to know how a novel infrastructure component is secured, supported, and governed before underwriting deployment risk.
      diligencePath: Request trust-center material, export-control and compliance documentation, incident or status-history evidence, and production support commitments.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: benchmarking-gap
      missingEvidence: Independent silicon benchmark data covering throughput, latency, power, and cost-per-token on real workloads.
      whyItMatters: The underwriting case depends on whether the claimed performance and cost advantages survive outside company-selected comparisons.
      diligencePath: Request third-party benchmark packs, customer-run test reports, and workload-level comparisons against HBM-based alternatives.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: manufacturing-readiness
      missingEvidence: Tapeout status, process node, foundry or OSAT partners, qualification milestones, and yield-readiness evidence.
      whyItMatters: Photonic promise is not enough if manufacturing, packaging, or qualification slips before first customer delivery.
      diligencePath: Request tapeout plan, partner list, qualification gates, and any manufacturability reports tied to the H2 2027 roadmap.
      relatedQuestionRefs: [QE006, QE008]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Public developer or practitioner signal such as SDK docs, repository activity, community forums, operator talks, or recruiting detail tied to the stack.
      whyItMatters: Without an ecosystem or operator signal, it is harder to judge software-toolchain maturity and real implementation readiness.
      diligencePath: Request public compiler or SDK materials, engineering talks, or customer-operator references that show how teams would actually adopt the platform.
