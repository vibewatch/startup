company:
  name: Olix
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Olix's public product story is a rack-scale inference platform centered on the
    decode-specialized DX-1, an optical tensor processing approach, on-chip SRAM,
    and a slow-and-wide optical interconnect meant to avoid HBM bottlenecks. The
    evidence shows real architectural differentiation and recent integration claims,
    but maturity still stops short of named deployments, independent silicon
    benchmarks, public trust-controls disclosure, or manufacturing detail.
sections:
  - id: product-scope
    title: Product definition and workflow target
    body: >-
      The disclosed customer workflow is not general AI training; it is inference
      serving, and specifically the decode stage where models repeatedly reread
      weights while generating output tokens. Across independent coverage, Olix's
      first public product surface is the DX-1 inside the X-1 platform, framed as a
      decode accelerator rather than a broad replacement for all GPU work. That
      matters because the product promise is narrow and concrete: improve
      interactivity and throughput on the latency-sensitive part of model serving,
      while leaving the prefill-heavy portions of the stack outside the company's
      strongest public claim set.
    claimRefs: [CE001, CE004, CE007]
    tableRefs: [TE002]
  - id: architecture-and-stack
    title: Architecture and operating model
    body: >-
      Public descriptions converge on the same stack: an OTPU or optical-digital
      compute path, on-chip SRAM rather than HBM, and an optical interconnect that
      links many chips into a larger serving domain. The central mechanism is to
      attack data movement, not just arithmetic density. Plural and New Electronics
      both describe the processor as digital rather than analog photonics, while
      DCD and The Robotics Media emphasize the "slow and wide" optical network and
      rack-scale expansion claims. In practical diligence terms, the architecture is
      specific enough to analyze, but most public evidence still describes design
      intent and claimed system behavior rather than independent performance.
    claimRefs: [CE002, CE003, CE005, CE011, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-delivery
    title: Maturity, deployment path, and dependencies
    body: >-
      Olix remains pre-commercial at the run date. Multiple sources place first
      customer delivery in H2 2027, and the latest financing is described as
      supporting first-chip delivery, silicon-platform build-out, and manufacturing
      commitments. The best positive maturity signal in the assigned evidence is
      partner-sourced: Plural says the company has demonstrated its foundational
      technology, completed optical/electronic/software integration, and moved into
      custom-ASIC development. That is encouraging, but it is still not a substitute
      for a named pilot, a deployed customer system, or an independently operated
      benchmark on production silicon.
    claimRefs: [CE007, CE010, CE011, CE012]
    tableRefs: [TE001]
  - id: differentiation-and-risks
    title: Differentiation, trust controls, and technical risk
    body: >-
      The differentiation case is clear in theory: Olix says the SRAM-plus-photonics
      stack can outperform HBM-based accelerators on throughput per megawatt and
      total cost of ownership, while also sidestepping the supply bottlenecks that
      handicap mainstream accelerators. The diligence problem is that public proof is
      thinner than the architecture story. Inference Chips explicitly says no
      independent benchmark has been published and that public materials do not
      identify named production deployments. The assigned source pool also does not
      surface public security, privacy, reliability, or compliance materials, so
      trust and operational controls remain substantially under-documented for an
      infrastructure product that would sit inside critical inference paths.
    claimRefs: [CE006, CE008, CE009, CE013]
