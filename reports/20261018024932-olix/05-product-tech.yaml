callouts:
  - calloutType: strength
    title: Structural differentiation is aimed at the memory bottleneck
    body: >-
      Olix is not publicly pitching another general-purpose GPU. The story is a
      narrower inference stack that avoids HBM, specializes in decode, and uses
      optical links to expand the serving domain.
    claimRefs: [CE001, CE002, CE005, CE013]
  - calloutType: risk
    title: Public maturity proof still trails the architectural ambition
    body: >-
      The public stack description is specific, but independent validation is not.
      The reviewed evidence still lacks an independent silicon benchmark, named
      production deployment, and disclosed trust-control surface.
    claimRefs: [CE008, CE009]
