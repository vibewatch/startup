companyProfile:
  summary: >-
    Olix is a London-founded photonic AI-chip company that describes itself as building infrastructure for frontier AI
    inference and delivering complete racks rather than a standalone accelerator SKU. Public materials and retained
    coverage describe a rack-scale architecture that combines custom silicon, optical interconnect, lasers, compiler
    scheduling, and SRAM-first memory design. The company closed a $312m Series B at a $3.3bn valuation in August 2026,
    added Nick McKeown to the board, and hired Matt Briers as CFO, but it still has not disclosed revenue, named paid
    pilots, or public benchmark data.
