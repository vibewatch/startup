figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence supports an intended path from inference-cost pain to 2027 delivery and later scale-out, but
      not a proven land-and-expand loop.
    data:
      items:
        - label: Inference cost bottleneck identified
          details: Customers are framed as operators of demanding inference workloads rather than general-purpose GPU buyers.
          touchpoints:
            - LLM inference cost pressure
            - Decode-stage bottleneck
        - label: Technical evaluation of decode-specialized architecture
          details: Public materials emphasize SRAM-plus-photonics and rack-scale inference as the decision hook.
          touchpoints:
            - Throughput and interactivity claims
            - Supply-chain avoidance thesis
        - label: Pre-delivery diligence gate
          details: No independent benchmark or customer reference is public before shipment.
          touchpoints:
            - No third-party benchmark
            - No named customer proof
        - label: Initial customer delivery target
          details: Multiple August 2026 sources place first customer systems in H2 2027.
          touchpoints:
            - First chip delivery target
            - Manufacturing and supply-chain commitments
        - label: First production deployment
          details: This stage is intended but not yet publicly evidenced in the assigned pool.
          touchpoints:
            - Customer acceptance
            - Workload validation
        - label: Rack-scale expansion
          details: Expansion depends on proving multi-rack economics and reliability after initial deployments.
          touchpoints:
            - Multi-rack scale-up
            - Renewal and expansion proof still missing
    approximationNotes: >-
      Journey stages after the H2 2027 delivery target are analytic inferences from public product and funding
      messaging, not documented customer milestones.
    claimRefs: [CU001, CU002, CU004, CU008, CU011, CU014]
callouts:
  - calloutType: risk
    title: Customer proof is the largest unresolved diligence gap
    body: >-
      The current evidence base supports a credible target market and a funded commercialization plan, but it does
      not yet support a view on account quality, expansion durability, or concentration because no named customer,
      pilot, benchmark, or retention metric is public.
    claimRefs: [CU004, CU006, CU008, CU013, CU014]
