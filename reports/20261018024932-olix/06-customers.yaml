schemaVersion: report-v2
artifact: customers
slug: olix
runDate: 2026-10-18
company:
  name: Olix
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence for Olix is still pre-deployment rather than revenue-proven. Across the assigned
    2026 source pool, independent coverage consistently places first customer deliveries in 2027, while no source
    names a production customer, paid pilot, or retention metric.
sections:
  - id: customer-segments-and-stage
    title: Customer segments are inferable, but commercialization is still ahead of delivery
    body: >-
      The public record supports an initial customer thesis, not a demonstrated installed base today. Independent
      coverage consistently describes Olix as an inference-focused infrastructure vendor whose first chip targets
      the decode stage of large-language-model serving, which implies early buyers are likely to be frontier-model
      operators, cloud inference platforms, and other teams running large-scale AI inference clusters rather than
      edge-device OEMs or broad enterprise IT buyers. That positioning may be commercially attractive if inference
      economics keep worsening, but the same sources say customer deliveries are still planned for 2027, so the
      chapter's core judgment is that the segment story is clearer than the customer-proof story.
    claimRefs: [CU001, CU002, CU004, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof remains roadmap-heavy and benchmark-light
    body: >-
      Olix's public traction signals are mostly capital formation, hiring, and technical intent rather than live
      customer usage. The August 2026 financing was described as funding silicon buildout, manufacturing, and
      supply-chain commitments before first delivery, while a skeptical independent source explicitly called the
      company pre-revenue and warned that no third party had yet run a model on the hardware. The assigned pool
      therefore supports a commercialization-stage reading: Olix appears to be building toward first customer
      systems, but the public record still lacks named deployments, published outcomes, or independent performance
      validation that would convert product ambition into customer proof.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU012, CU013]
    tableRefs: [TU002]
  - id: durability-and-concentration
    title: Retention, expansion, and concentration cannot yet be underwritten from public evidence
    body: >-
      The hardest diligence questions for investors are the ones the current source set does not answer. No assigned source
      discloses NRR, GRR, logo retention, renewal rates, contract terms, or top-customer concentration, and none
      names a design partner, procurement win, or customer testimonial that would let an investor test account
      quality. Public messaging instead emphasizes future scale-out potential and aggressive team expansion. That
      means Olix's expansion loop is presently a hypothesis: if the silicon works and deliveries land in 2027,
      large accounts could expand rack by rack, but the evidence required to underwrite durability or concentration
      risk is still private. The disclosure gap is a diligence constraint, not proof that customer activity is absent.
    claimRefs: [CU006, CU009, CU010, CU011, CU013, CU014]
    tableRefs: [TU003]
