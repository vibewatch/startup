    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Military cyber operations, "Government acquisition organization (not identified)", "Cyber or operational mission team (not identified)", "Appropriated government program", "Mission need, security review, procurement, deployment", "Agency or program office (not identified)", "Validated operational requirement"]
      - [Defensive national-security systems, "Government security or infrastructure authority (not identified)", "Defenders of critical networks (not identified)", "Government or authorized operator", "Technical evaluation, accreditation, purchase, integration", "Agency or infrastructure budget", "Demonstrated defensive efficacy"]
      - [Pilot or proof of concept, "Program sponsor (not identified)", "Technical evaluators and mission users", "Pilot budget", "Evaluation, security approval, outcome review", "Program sponsor", "Evidence of ROI and acceptable risk"]
      - [Commercial adjacency, "No buyer evidenced", "No user evidenced", "No payer evidenced", "No documented workflow", "Unknown", "Open question"]
    notes: >-
      Roles are an evidence-constrained adoption hypothesis derived from the reported government
      target; the assigned sources do not name agencies, contracts, pilots, or budget lines.
    claimRefs: [CM009, CM010, CM011, CM012]
