schemaVersion: "report-v2"
artifact: customers
slug: cathedral
runDate: 2026-10-24
company:
  name: Cathedral
chapter:
  number: 6
  title: Customers
  summary: The assigned evidence does not establish a paying customer, production deployment, retention profile, or expansion motion for Cathedral's defense-cyber business. Public materials instead support only a broad government-cyber target and a July 2026 financing event, while several search results are demonstrably about unrelated Cathedral entities.
sections:
  - id: customer-segments
    title: Buyer, user, and payer hypothesis
    body: >-
      Cathedral is described in the assigned materials as a private New York company developing
      AI-driven cyber-warfare platforms and defensive national-security systems, with an intended
      market of military and national-security applications. That description supports a buyer
      hypothesis centered on U.S. government and defense organizations, but it does not identify a
      contracting agency, program office, prime contractor, system integrator, operational user,
      or paying account. The available financing coverage says the company aims to secure U.S.
      government contracts, which is a go-to-market objective rather than evidence of a signed award
      or deployed product. The customer segmentation therefore remains an underwriting hypothesis:
      government is the likely payer and mission operator, while the actual procurement path, user
      persona, contract vehicle, and revenue-bearing unit are undisclosed. The search pool also
      contains unrelated Cathedral City, Cathedral Candle, and Cathedral Products records, so name
      matching cannot be treated as customer evidence.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Adoption and named-customer proof
    body: >-
      No assigned source provides a named Cathedral customer, a production deployment, a pilot
      result, a contract value, utilization data, a renewal, or a customer quote. Fundz reports a
      one-employee profile and a July 2026 financing event, but its description of defense
      deployments is a funding-use narrative, not a customer reference. Jumpseat reports that
      Cathedral aims to secure government contracts, again describing intended commercialization
      rather than realized adoption. The City Detect case study contains detailed operational
      adoption metrics, but it is a case study for City Detect's PASS AI platform at Cathedral City,
      California, not for Cathedral. This distinction is material: the strongest quantified adoption
      evidence in the pool belongs to another issuer and another company. Customer diligence should
      consequently treat Cathedral as pre-commercial or unverified rather than infer traction from
      logos, funding, or a same-name municipal case study.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration
    body: >-
      The assigned materials contain no NRR, GRR, churn, renewal, cohort, contract-length,
      satisfaction, backlog, customer-concentration, or expansion data for Cathedral. A defense-cyber
      procurement may involve long security reviews, authorization requirements, and program-specific
      integration, but those mechanics are not evidenced here and should not be presented as company
      facts. The only supportable commercial conclusion is that durability and concentration are
      unresolved. The financing coverage indicates that the company seeks military and national-
      security contracts, while the data registries repeat the $160 million financing and $1.4
      billion valuation; neither source identifies customer revenue or contracted backlog. Before
      underwriting expansion, an investor needs executed contract schedules, customer references,
      deployment status, renewal terms, revenue by customer, and evidence that any initial government
      relationship can scale beyond a single sponsor or program.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: []
    figureRefs: [FU001]
tables:
