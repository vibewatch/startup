      - [No retention reference, null, null, "Not established", null, "No renewal, churn, cohort, or satisfaction evidence found in assigned sources"]
    enumerationScope:
      coverage: partial
      basis: "Assigned successful prefetched URLs only; reviewed through 2026-10-24 for attributable Cathedral customer references and same-name disambiguation."
    notes: "The table is a partial evidence inventory, not a claim that no customer exists; the unrelated Cathedral City row is retained to prevent false attribution."
    claimRefs: [CU006, CU007, CU008, CU011]
