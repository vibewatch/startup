    title: Customer evidence journey
    type: journey-map
    summary: Public evidence currently supports a target-market hypothesis and financing, but not an attributable deployment or retention loop.
    data:
      nodes:
        - {id: segment, label: "Target segment", description: "Military and national-security applications are described as the intended market."}
        - {id: buyer, label: "Buyer hypothesis", description: "U.S. government and defense procurement is an objective, not a verified account."}
        - {id: contract, label: "Contract", description: "No award, vehicle, value, or program office is disclosed in assigned sources."}
        - {id: deployment, label: "Deployment", description: "No named Cathedral production deployment or pilot is evidenced."}
        - {id: outcome, label: "Outcome", description: "No customer outcome, utilization, or mission metric is attributable to Cathedral."}
        - {id: expansion, label: "Expansion", description: "No renewal, cohort, cross-sell, or concentration evidence is disclosed."}
callouts:
  - calloutType: risk
    title: Adoption is unverified
    body: The assigned evidence supports a government-cyber commercialization objective but does not establish a paying customer, production deployment, contract award, or retention metric.
    claimRefs: [CU003, CU006, CU009]
  - calloutType: insight
    title: Same-name evidence is dangerous
    body: The most detailed customer case in the pool concerns City Detect's PASS AI deployment at Cathedral City, California; it must not be attributed to Cathedral.
    claimRefs: [CU007, CU008]
