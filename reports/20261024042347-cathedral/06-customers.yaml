      - [Military or national-security operators, "Potential operational users", null, "Mission-critical use case is described at a high level", "No named user, deployment, or outcome disclosed"]
      - [Prime contractors or integrators, "Possible channel or procurement intermediary", null, "Could provide access to government programs", "No partner, reseller, or integration relationship disclosed"]
    notes: "Source set supports only a target-market hypothesis; null scale cells mean no customer count, deployment, or contract denominator was disclosed."
    claimRefs: [CU001, CU002, CU003, CU009]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date/period, Source posture, Confidence, Implication, Missing denominator]
    rows:
      - [Employees, 1, "Profile accessed 2026-10-24; profile does not state measurement date", Fundz registry, low, "Suggests very limited publicly recorded operating footprint, but may be stale or incomplete", "No verified headcount date or methodology"]
      - [Funding event, "$160M", "July 23, 2026", "Fundz registry; financing fact, not adoption proof", medium, "Provides capital capacity but does not establish customers or revenue", "No contract value, revenue, or customer denominator"]
      - [Government contracting objective, "Aims to secure U.S. government contracts", "July 28, 2026 report", "Independent report describing company objective", medium, "Commercialization remains an intended milestone in the assigned evidence", "No award, backlog, pilot, or deployment denominator"]
      - [Customer count, null, "As of 2026-10-24", "Not disclosed in assigned sources", low, "Cannot assess adoption, concentration, or repeatability", "Active accounts and paying entities"]
    notes: "Values preserve source labels and periods; null means the assigned successful prefetched sources did not disclose the metric, not that the metric is zero."
    claimRefs: [CU005, CU006, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or reference, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [No named Cathedral customer in assigned sources, null, null, "Not established", null, "Search pool has no attributable Cathedral customer reference"]
