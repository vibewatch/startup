evidenceGaps:
  - type: missing-source
    severity: material
    topic: legal-entity
    missingEvidence: Primary incorporation record, registered address, official website, and exact legal name for the target company.
    whyItMatters: Identity and jurisdiction determine ownership, contracting eligibility, litigation searches, and enforceability.
    diligencePath: Request formation documents and federal entity registrations, then reconcile them to the financing documents.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Executed term sheet, cap table, cash receipts, primary-versus-secondary allocation, debt, and investor rights.
    whyItMatters: Reported funding and valuation do not establish ownership, dilution, liquidity, or cash available.
    diligencePath: Obtain bank evidence, closing documents, capitalization records, board materials, and debt schedules.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-disclosure
    missingEvidence: Revenue, backlog, customers, contracts, burn, runway, validated product, deployments, and reliable headcount.
    whyItMatters: These measures are needed to distinguish an investable operating company from a financed development plan.
    diligencePath: >-
      Review customer contracts, invoices, pipeline, payroll, financial statements, demos, security documentation, and
      deployment logs.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete leadership and board roster with titles, reporting lines, biographies, ownership, and conflict controls.
    whyItMatters: Role ambiguity prevents assessment of execution coverage, governance independence, and key-person concentration.
    diligencePath: >-
      Obtain the organization chart, board composition, employment agreements, conflict policy, and founder reference
      checks.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      At least eight independently dated company milestones across formation, financing, product, contracts, hiring,
      regulation, and partnerships.
    whyItMatters: The current chronology mostly repeats one financing event and cannot establish execution velocity.
    diligencePath: Request a dated corporate history and corroborate each event with primary documents or independent reporting.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: blocking
    topic: sizing
    missingEvidence: >-
      A primary or independent source with a defined military-cyber spending denominator, geography, period, and
      methodology.
    whyItMatters: Without a denominator, TAM/SAM/SOM and valuation-to-market comparisons cannot be underwritten.
    diligencePath: >-
      Obtain agency procurement data, budget documents, or a reproducible analyst market study tied to Cathedral's
      defined product and target geography.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: procurement
    missingEvidence: Named customers, contract vehicles, pilots, pricing, deployment requirements, and measurable outcomes.
    whyItMatters: Buyer, payer, adoption timing, and obtainable share remain hypotheses rather than verified market mechanics.
    diligencePath: >-
      Request a customer and pipeline reference set, contract-award evidence, pricing framework, accreditation status,
      and pilot outcome data under appropriate confidentiality.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitive-proof
    missingEvidence: >-
      Buyer evaluations, red-team results, mission outcomes, deployment records, security accreditation, and comparable
      technical benchmarks.
    whyItMatters: >-
      Without outcome evidence, Cathedral's reported military-cyber focus cannot be separated from claims that adjacent
      defense platforms could replicate.
    diligencePath: >-
      Obtain customer references, test reports, authority-to-operate records, deployment architecture, and side-by-side
      evaluation criteria under NDA.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable bids, realized prices, contract lengths, discount schedules, renewal terms, contract vehicles, channel
      economics, and switching costs.
    whyItMatters: >-
      Pricing power, distribution advantage, gross-margin potential, lock-in, and the threat from bundled incumbent
      offerings cannot be assessed.
    diligencePath: >-
      Review representative proposals and contracts, interview procurement officials and integrators, and map
      data-export and migration obligations.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: >-
      A buyer-validated enumeration of direct cyber peers, incumbent federal contractors, internal government build
      paths, point tools, and status quo.
    whyItMatters: >-
      The retained candidate list mixes several adjacent product modalities and may omit the alternatives that own the
      relevant budget and contract path.
    diligencePath: >-
      Interview program buyers and primes, inspect recent solicitations and award notices, and classify bidders by
      mission, budget owner, and vehicle.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: >-
      Monthly recognized revenue, ARR or other recurring-revenue bridge, customer concentration, and contract-level
      revenue evidence.
    whyItMatters: >-
      The reported $1.4 billion valuation cannot be compared with operating scale or revenue quality without a
      denominator.
    diligencePath: >-
      Obtain a management revenue bridge, signed-contract schedule, backlog report, and customer concentration analysis
      under NDA.
    relatedQuestionRefs:
      - QI004
      - QI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, restricted cash, committed compute spend, debt, and runway scenarios.
    whyItMatters: >-
      The $160 million financing does not reveal cash remaining, spending velocity, fixed obligations, or the next-round
      trigger.
    diligencePath: >-
      Request bank statements, a monthly cash bridge, debt and lease schedules, vendor commitments, and an 18-month cash
      forecast.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: List pricing, realized contract pricing, discounts, implementation fees, renewals, and support economics.
    whyItMatters: Licensing is a mechanism label, not evidence of repeatable, high-margin, or recurring revenue.
    diligencePath: Review representative contracts, price cards, amendments, renewal cohorts, and delivery staffing assumptions.
    relatedQuestionRefs:
      - QI003
      - QI005
  - type: enumeration-incomplete
    severity: material
    topic: entity-verification
    missingEvidence: A verified legal-entity identifier and authoritative company-controlled financial records.
    whyItMatters: The assigned pool includes unrelated Cathedral entities, so database metrics can be misattributed.
    diligencePath: >-
      Obtain the legal entity name, jurisdiction, tax identifier, and source-controlled financial statements before
