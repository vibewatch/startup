schemaVersion: "report-v2"
artifact: competitors
slug: cathedral
runDate: 2026-10-24
company:
  name: Cathedral
chapter:
  number: 3
  title: Competitors
  summary: >-
    Public evidence positions Cathedral against a broad set of defense-software,
    autonomy, analytics, and government-AI vendors, but the assigned sources do
    not establish product performance, pricing, procurement wins, or switching
    costs. The competitive conclusion is therefore a candidate landscape rather
    than a validated rank order.
sections:
  - id: landscape-and-buyer-alternatives
    title: Landscape and buyer alternatives
    body: >-
      Cathedral is described as an AI-driven cybersecurity company for military
      and national-security operations. One third-party landscape names Anduril,
      Palantir, Scale AI, Helsing, Together AI, Shield AI, Epirus, Vannevar Labs,
      SparkCognition, and Rebellion Defense as competitors, but their listed
      scopes range from defense analytics and real-time security AI to autonomous
      systems, cloud infrastructure, and high-power microwave hardware. This is
      evidence of a wide buyer alternative set, not proof that every name competes
      in the same procurement. Internal government development, incumbent
      contractors, point cyber tools, and the status quo remain plausible
      substitutes, but the assigned evidence does not enumerate or compare them.
      The positioning map consequently scores mission proximity and product
      modality only; it does not score quality, market share, or win probability.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP014
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capability-and-proof
    title: Capability comparison and proof burden
    body: >-
      The available descriptions permit only a category-level comparison.
      Cathedral is associated with offensive and defensive military cyber
      operations, while the named alternatives are described through broader
      defense autonomy, analytics, government AI, intelligence, or security-AI
      categories. No retained source supplies a common test, deployment outcome,
      accreditation record, customer evaluation, or side-by-side technical
      benchmark. The matrix therefore marks unsupported cells as unknown rather
      than converting marketing descriptions into feature parity. This missing
      proof is strategically important: without demonstrated efficacy and
      integration evidence, Cathedral's claimed focus could be a useful wedge,
      but it cannot yet be distinguished from a narrow product claim that larger
      platforms could replicate, bundle, or route through existing contracts.
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP010
    tableRefs:
      - TP002
  - id: pricing-distribution-and-switching
    title: Pricing, distribution, and switching
    body: >-
      Pricing and packaging are not disclosed in the assigned evidence for
      Cathedral or the named alternatives. Cathedral is reported to be seeking
      US government contracts, which makes procurement access, authority to
      operate, integration into classified workflows, and contract vehicles
      potentially more important than a public list price. However, no retained
      source documents Cathedral's contract vehicle, prime or channel partner,
      deployment footprint, renewal pattern, data portability, or realized
      switching cost. Government connections may help open doors, according to
      one report, but the same report flags political risk. Until buyer-side
      evidence exists, distribution advantage and lock-in should be treated as
      hypotheses rather than durable moat components, and multi-homing across
      mission-specific tools remains unresolved.
    claimRefs:
      - CP009
      - CP010
      - CP012
      - CP013
    tableRefs:
      - TP003
  - id: durability-and-diligence-verdict
    title: Durability and diligence verdict
    body: >-
      Cathedral's reported $160 million financing at a $1.4 billion valuation
      supplies resources to recruit and develop product, but financing is not
      evidence of competitive superiority, revenue, contract awards, or cash
      available after deployment costs. A directory's estimate of about one
      employee is too uncertain to reconcile with that capital signal and should
      not be treated as a verified headcount. The evidence base is also vulnerable
      to name collisions: two assigned search results concern an unrelated UK
      products company and a Los Angeles school football team. The resulting
      moat verdict is unproven. Cathedral may have a focused military-cyber wedge
      and unusual government access, yet capability validation, procurement
      traction, independent customer proof, and comparable pricing remain the
      decisive diligence requirements.
    claimRefs:
      - CP011
      - CP013
      - CP015
      - CP016
