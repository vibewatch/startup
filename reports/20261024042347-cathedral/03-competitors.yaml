  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitive-proof
      missingEvidence: >-
        Buyer evaluations, red-team results, mission outcomes, deployment records,
        security accreditation, and comparable technical benchmarks.
      whyItMatters: >-
        Without outcome evidence, Cathedral's reported military-cyber focus cannot
        be separated from claims that adjacent defense platforms could replicate.
      diligencePath: >-
        Obtain customer references, test reports, authority-to-operate records,
        deployment architecture, and side-by-side evaluation criteria under NDA.
      relatedQuestionRefs:
        - QP005
      relatedTableRefs:
        - TP002
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: >-
        Comparable bids, realized prices, contract lengths, discount schedules,
        renewal terms, contract vehicles, channel economics, and switching costs.
      whyItMatters: >-
        Pricing power, distribution advantage, gross-margin potential, lock-in,
        and the threat from bundled incumbent offerings cannot be assessed.
      diligencePath: >-
        Review representative proposals and contracts, interview procurement
        officials and integrators, and map data-export and migration obligations.
      relatedQuestionRefs:
        - QP006
        - QP007
      relatedTableRefs:
        - TP003
    - type: enumeration-incomplete
      severity: material
      topic: competitor-landscape
      missingEvidence: >-
        A buyer-validated enumeration of direct cyber peers, incumbent federal
        contractors, internal government build paths, point tools, and status quo.
      whyItMatters: >-
        The retained candidate list mixes several adjacent product modalities and
        may omit the alternatives that own the relevant budget and contract path.
      diligencePath: >-
        Interview program buyers and primes, inspect recent solicitations and
        award notices, and classify bidders by mission, budget owner, and vehicle.
      relatedQuestionRefs:
        - QP001
        - QP003
      relatedTableRefs:
        - TP001
