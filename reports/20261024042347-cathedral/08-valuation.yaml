  name: Cathedral
chapter:
  number: 8
  title: Valuation
  summary: "Cathedral's reported $160M July 2026 financing at a $1.4B post-money valuation is an unusually high price for a company with no publicly disclosed revenue, customers, product release, or secondary-market price. The evidence supports research-more rather than a buy decision until commercial traction, cap-table terms, and government-contract progress are verified."
sections:
  - id: price-and-evidence
    title: Price versus disclosed proof
    body: "The strongest current evidence is a cluster of independent database and news records describing one July 2026 financing: $160M raised at a $1.4B valuation, with Andreessen Horowitz and Sequoia Capital identified as leads. The records are not equivalent to audited financial disclosure, and they disagree on round naming, investor count, and location. Dealroom reports that both lead firms took board seats and that the company seeks government contracts, while Fundz labels the event a Series A and reports one employee. Forge, a private-market data source, says no post-money valuation or funding amount is available and explicitly warns that it does not independently verify company information. That conflict makes the headline valuation a financing reference point, not a verified current mark."
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Investment thesis and anti-thesis
    body: "The positive case is founder access and investor sponsorship: the available accounts describe Pentagon, SpaceX, and government-technology backgrounds, and the two lead firms reportedly took board seats. Those signals may improve access to a slow government procurement market, but they do not establish a contract, backlog, deployed capability, revenue, or repeatable sales motion. The anti-thesis is therefore valuation-sensitive: a $1.4B post-money price implies that investors are underwriting future strategic access and technical execution before public operating proof exists. Political exposure is also material because Dealroom describes ties to the current administration as both an advantage and a possible source of scrutiny after the 2026 midterms."
    claimRefs: [CV006, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, entry discipline, and diligence
    body: "A defensible scenario framework must remain qualitative because no public revenue, margin, retention, contract value, burn, runway, liquidation preference, or secondary price is available in the assigned evidence. The bull case requires verified defense contracts, a shipped capability, and conversion of founder access into durable programs. The base case is continued technical and procurement development with substantial financing dependence and uncertain timing. The bear case is a down-round or stalled commercialization if procurement, political, cyber-risk, or compute constraints prevent deployment. An investor should not underwrite a target return from the headline valuation alone; the next decision gate is documentary diligence on financing terms, government awards, product milestones, and cash runway."
    claimRefs: [CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence-based assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not buy on the reported price alone]
      - [Confidence, low, Public evidence is sparse and internally inconsistent]
      - [Risk rating, high, Pre-revenue and procurement execution risk remain unverified]
      - [Valuation stance, expensive, $1.4B is reported without operating denominator]
    notes: "Assessment uses reported financing data and explicit absence or non-verification in assigned sources; null operating metrics are not treated as zero."
    claimRefs: [CV001, CV003, CV004, CV005, CV010]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Founder and investor access may accelerate government entry", "Pentagon and SpaceX backgrounds are reported; a16z and Sequoia led the round", "Signed contract awards, funded program milestones, and customer references"]
      - ["The price is ahead of public operating proof", "$1.4B valuation is reported while revenue and customers are not disclosed", "Audited revenue, backlog, retention, and unit economics"]
      - ["Political exposure can affect contracting", "Administration ties are described as both an advantage and a scrutiny risk", "Evidence of bipartisan procurement durability and compliance controls"]
      - ["Market data is not independently verified", "Forge reports no available valuation and disclaims independent verification", "Cap-table documents, preferred terms, and an arms-length secondary mark"]
    notes: "Rows separate reported facts from underwriting requirements; they do not imply that an unverified absence proves non-existence."
    claimRefs: [CV006, CV007, CV008, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Contracts and shipped capability convert founder access into repeatable defense revenue", "Potentially supports the reported financing price or higher, but no multiple is supportable now", Low until awards and revenue are documented, No contract or milestone after a defined procurement window]
      - [Base, "Technical build continues and government procurement remains slow", "Capital remains tied up at an unverifiable mark; entry requires a material discount or stronger disclosure", Most plausible from current evidence, Runway or milestone slippage without new financing]
      - [Bear, "Political scrutiny, procurement failure, cyber-risk, or compute constraints block commercialization", "Down-round, impairment, or illiquidity risk; no downside floor is observable", Material, "Failed security/compliance review, adverse contracting outcome, or financing stress"]
    notes: "Qualitative scenarios only: the assigned pool contains no revenue, margin, contract value, runway, preference, or reliable comparable-company denominator from which to calculate a numeric range."
    claimRefs: [CV009, CV010, CV011, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public financing signals pass through missing operating proof and execution risks to a research-more decision.
    data:
      nodes:
        - {id: financing, label: "$160M financing reported", detail: "July 2026; valuation reported as $1.4B"}
        - {id: price, label: "$1.4B post-money reference", detail: "Not independently verified in assigned evidence"}
        - {id: proof, label: "Operating proof gap", detail: "No public revenue, customers, backlog, or shipped product disclosed"}
        - {id: procurement, label: "Government procurement risk", detail: "Contracts and timing are not documented"}
        - {id: terms, label: "Terms and liquidity gap", detail: "Preferences, cap table, and secondary price unavailable"}
        - {id: decision, label: "Research-more", detail: "Require documentary diligence before entry"}
      edges:
        - {from: financing, to: price}
        - {from: price, to: proof}
        - {from: proof, to: procurement}
        - {from: procurement, to: terms}
        - {from: terms, to: decision}
    claimRefs: [CV001, CV003, CV010, CV011, CV012]
callouts:
  - calloutType: recommendation
    title: Decision
    body: "Research-more. The reported valuation is price-sensitive but lacks a public operating denominator; require financing documents, contract evidence, product milestones, and runway before underwriting entry."
    claimRefs: [CV003, CV010, CV012, CV014]
  - calloutType: risk
    title: Thesis-break triggers
    body: "Treat a failed security or compliance review, loss of government contracting access, missed technical milestones, financing stress, or a down-round as thesis-break evidence until the company supplies contrary documentary proof."
    claimRefs: [CV009, CV013, CV014]
