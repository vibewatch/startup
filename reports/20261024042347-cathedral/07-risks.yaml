  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or channel
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Government acquisition channel
        - US government / DoD
        - Customer, authorization environment, and route to deployment
        - "No awarded contract or diversified customer base is disclosed"
        - "Political transition, protest, or procurement delay prevents conversion"
        - Critical
        - "Competitive award strategy, multiple program sponsors, and documented procurement controls"
        - Critical until awards and channel diversity are verified
      - - Dedicated computing infrastructure
        - Undisclosed data-center owner or operator
        - Secure training and operating capacity
        - "Acquisition versus partnership remains under consideration"
        - "Capacity, security boundary, or availability fails national-security requirements"
        - High
        - "Dual-site design, enforceable service levels, audit rights, and exit plan"
        - High until architecture and contracts are inspected
      - - Investor and board governance
        - Andreessen Horowitz, Sequoia Capital, and undisclosed participants
        - Capital and board oversight
        - "Co-leads and board seats are reported; full participant and rights detail is not public"
        - "Governance rights, preference terms, or financing needs constrain execution"
        - Medium
        - "Cap-table, board-rights, preference, budget, and related-party review"
        - Medium because financing terms and runway are unavailable
    notes: >-
      Dependency concentration is not quantified by the assigned sources; missing denominators
      and private contract terms are converted into diligence paths rather than estimated shares.
    claimRefs: [CR002, CR005, CR009, CR011, CR012, CR015]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Ordinal view of impact, likelihood, and mitigation maturity based on disclosed plans and
      evidence gaps, not observed failure rates.
    data:
      columns:
        - label: Impact
          detail: Consequence if the risk materializes
        - label: Likelihood
          detail: Qualitative exposure inferred from current public evidence
        - label: Mitigation maturity
          detail: Publicly evidenced mitigation status
      rows:
        - label: Product and deployment execution
          note: "Specific products, contracts, customers, and timelines are not publicly disclosed"
          values:
            - {label: Critical, tone: negative}
            - {label: High, tone: negative}
            - {label: Unverified, tone: neutral}
        - label: Offensive-cyber control and escalation
          note: "Reported capability has high-consequence authorization and collateral-risk requirements"
          values:
            - {label: Critical, tone: negative}
            - {label: Medium, tone: warning}
            - {label: Unverified, tone: neutral}
        - label: Procurement and political scrutiny
          note: "Government relationships may aid access while creating transition and integrity scrutiny"
          values:
            - {label: High, tone: negative}
            - {label: Medium, tone: warning}
            - {label: Unverified, tone: neutral}
        - label: Classified-workload compliance
          note: "No public accreditation, assessment, or authority-to-operate evidence was retained"
          values:
            - {label: High, tone: negative}
            - {label: High, tone: negative}
            - {label: Unverified, tone: neutral}
        - label: Compute and data-center dependency
          note: "Acquisition or partnership remains under consideration"
          values:
            - {label: High, tone: negative}
            - {label: Medium, tone: warning}
            - {label: Planned, tone: warning}
        - label: Evidence attribution and namesake collision
          note: "Assigned searches returned several unrelated Cathedral-named entities"
          values:
            - {label: Medium, tone: warning}
            - {label: High, tone: negative}
            - {label: Manual verification required, tone: warning}
    approximationNotes: >-
      Impact, likelihood, and maturity are ordinal analyst classifications. They are not
      probabilities, incident counts, compliance findings, or value-proportional scores.
    claimRefs: [CR001, CR003, CR007, CR009, CR012, CR013, CR016]
callouts:
  - calloutType: risk
    title: Evidence absence is the immediate underwriting risk
    body: >-
      The assigned evidence does not support a finding that Cathedral has suffered an incident or
      failed a compliance requirement. It supports a narrower conclusion: investors cannot verify
      product maturity, contracts, controls, or deployment readiness from the retained public record.
    claimRefs: [CR003, CR007, CR012, CR016]
  - calloutType: recommendation
    title: Kill criteria before the next capital decision
    body: >-
      Require primary proof of a deliverable product, competitively obtained customer work,
      applicable security authorization, human-governed operating limits, infrastructure readiness,
      and a reconciled budget and cap table. Continued absence of those materials should halt
      underwriting rather than be converted into optimistic assumptions.
    claimRefs: [CR003, CR005, CR007, CR015, CR016]
