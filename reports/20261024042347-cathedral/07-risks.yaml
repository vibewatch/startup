schemaVersion: "report-v2"
artifact: risks
slug: cathedral
runDate: 2026-10-24
company:
  name: Cathedral
chapter:
  number: 7
  title: Risks
  summary: >-
    Cathedral's principal risks are not evidenced failures but the wide gap between a reported
    $160 million financing at a $1.4 billion valuation and public proof of products, contracts,
    controls, operating scale, or deployment readiness. Political-procurement scrutiny,
    offensive-cyber oversight, infrastructure dependence, and entity-attribution noise make
    primary diligence a prerequisite to investment.
sections:
  - id: evidence-boundary-and-ranking
    title: Evidence boundary and severity ranking
    body: >-
      The assessment starts with a material verification deficit. Four current secondary sources
      describe a newly formed defense-cyber company, while the most detailed source says Cathedral
      has not publicly disclosed specific products, customers, contracts, or deployment timelines.
      Reported financing is substantial, but funding raised is not cash available and the cited
      sources provide no burn, runway, backlog, or contract economics. Fundz lists one employee,
      yet that aggregator observation is not a verified headcount and should not be used to
      calculate productivity or runway. Search attribution is also unusually fragile: assigned
      results resolve to unrelated Cathedral-named UK products, printing, holdings, and CLO
      entities. The heatmap therefore ranks residual exposure from disclosed facts and explicit
      absences; it does not imply that an unreported incident, license, control, or contract does
      or does not exist.
    claimRefs: [CR001, CR002, CR003, CR012, CR013, CR014, CR015]
    figureRefs: [FR001]
  - id: regulatory-legal-and-political
    title: Regulatory, legal, and political exposure
    body: >-
      Cathedral reportedly intends to pursue US government work spanning defensive and offensive
      cyber capabilities. Available reporting identifies requirements around classified
      information, government cybersecurity standards, access control, predictable AI behavior,
      and human authorization, but it does not establish that Cathedral has obtained approvals,
      certifications, facilities, or an authority-to-operate. Offensive use adds escalation and
      mission-assurance risk because an error could affect unintended systems or expose
      intelligence capabilities. Founder access to federal operations may accelerate buyer
      discovery, yet the same relationships create procurement-integrity and political-transition
      exposure. Reporting about a founder's prior access litigation and offensive posts raises a
      governance diligence issue; it does not establish misconduct by Cathedral. No conclusion
      about litigation or enforcement against Cathedral is supportable from the assigned pool.
    claimRefs: [CR002, CR004, CR007, CR008, CR009, CR010]
    tableRefs: [TR001]
  - id: operational-and-technical
    title: Operational, technical, and security execution
    body: >-
      The operating challenge is to turn a recently formed organization and reported financing
      into a demonstrable, controllable product. Public reporting says dedicated infrastructure
      may be acquired or supplied by a data-center partner, making compute availability, security
      boundaries, and counterparty execution gating dependencies rather than proven assets.
      Military cyber systems also require predictable model behavior, restricted access, and
      human authorization. Those requirements are especially consequential for offensive
      capability, where an incorrect action can create collateral disruption or reveal sensitive
      methods. There is no assigned evidence of product tests, red-team results, reliability
      history, incident response, classified-environment accreditation, or production deployment.
      The absence of such evidence is a diligence gap, not evidence that controls are absent or
      that an incident has occurred.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR008, CR012, CR014]
    tableRefs: [TR002]
  - id: dependencies-and-thesis-breaks
    title: Dependencies, monitoring, and thesis-break triggers
    body: >-
      Cathedral's disclosed plan concentrates execution around a difficult buyer, scarce technical
      talent, sensitive compute, and institutional relationships. The company reportedly seeks US
      government contracts, while a possible data-center acquisition or partnership adds another
      critical counterparty decision. Andreessen Horowitz and Sequoia Capital reportedly co-led
      the financing and took board seats, but a separate registry leaves round participants
      undisclosed; the complete cap table and governance rights therefore remain private. The
      thesis should break if primary diligence cannot demonstrate a deliverable product, awarded
      and competitively obtained work, applicable security controls, and human-governed operating
      limits before the next financing decision. Additional triggers include dependence on a
      single political channel, inability to secure suitable infrastructure, or continued
      nondisclosure of burn, runway, customer concentration, and deployment evidence.
    claimRefs: [CR001, CR002, CR005, CR009, CR011, CR012, CR015, CR016]
    tableRefs: [TR003]
