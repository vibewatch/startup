  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: compliance
      missingEvidence: >-
        An authoritative inventory of licenses, approvals, certifications, security assessments,
        litigation, enforcement, incidents, and failed deployments attributable to Cathedral.
      whyItMatters: >-
        Public secondary reporting describes high-consequence military cyber plans but cannot
        establish Cathedral's legal authority, control maturity, or adverse-event history.
      diligencePath: >-
        Obtain the legal entity list and official domain, then search regulator and court records
        by verified identifiers and inspect counsel letters, incident logs, certifications,
        assessment reports, and authorization packages in the data room.
      relatedQuestionRefs: [QR009]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: financial-model
      missingEvidence: >-
        Monthly burn, unrestricted cash, runway, awarded contract value, backlog, gross margin,
        working-capital needs, customer concentration, and financing terms.
      whyItMatters: >-
        Reported funding and valuation do not establish cash available, capital efficiency,
        revenue quality, concentration, or the probability of reaching the next milestone.
      diligencePath: >-
        Reconcile bank statements to the general ledger and cap table; inspect the operating plan,
        contract and backlog schedule, customer-level revenue, collections, budget-to-actuals,
        preferences, and board-approved financing plan.
      relatedQuestionRefs: [QR010]
    - type: missing-source
      severity: material
      topic: entity-resolution
      missingEvidence: >-
        A verified Cathedral legal name, incorporation record, official domain, principal offices,
        subsidiaries, and identifiers linking public claims to the defense-cyber company.
      whyItMatters: >-
        Generic-name search collisions can misattribute filings, incidents, headcount, customers,
        or liabilities from unrelated companies and structured-finance vehicles.
      diligencePath: >-
        Require formation documents and W-9 details, verify the official domain and leadership,
        and bind every database search and source to legal identifiers before relying on it.
