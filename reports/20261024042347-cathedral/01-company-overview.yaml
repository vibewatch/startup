company:
  name: "Cathedral"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Cathedral is a newly formed, stealth-mode US military-cybersecurity startup founded
    by four former DOGE personnel and reportedly financed with $160 million at a $1.4
    billion post-money valuation. The capital and investor board representation are
    visible; the legal entity, operating leadership, products, contracts, customers,
    revenue, reliable headcount, and deployment record remain unverified.
sections:
  - id: "identity-and-operating-proposition"
    title: "Identity and operating proposition"
    body: >-
      Cathedral is reported as a 2026-founded US military-cybersecurity startup created
      by Gavin Kliger, Luke Farritor, Marko Elez, and Jack Stein. Its stated ambition is
      to build AI systems for both defensive and offensive US military cyber operations
      and sell through federal contracts. This is still a proposition rather than a
      demonstrated operating footprint: the reviewed evidence identifies no named
      production product, awarded contract, customer, or deployment date. Cathedral is
      also considering a data-center acquisition or partnership for dedicated compute,
      which signals that infrastructure strategy is still being formed. No primary
      corporate page or filing in the assigned evidence establishes the exact legal
      entity, and a UK registry result is for the differently named Cathedral Products
      (UK) Limited rather than proof of the target company's registration.
    claimRefs: [CO001, CO002, CO005, CO006, CO007, CO014]
    tableRefs: [TO001]
  - id: "capital-leadership-and-control"
    title: "Capital, leadership, and control"
    body: >-
      Third-party sources consistently report a single $160 million financing in July
      2026 and a $1.4 billion post-money valuation, although they variously label the
      event Growth, Venture, or Series A. Andreessen Horowitz and Sequoia Capital are
      reported as the leads or co-leads, with representatives of both investors taking
      board seats. That creates unusually strong capital backing for a newly formed
      company, but the financing mark is not revenue, cash availability, or proof of
      contracts. Public leadership disclosure is also narrow: all four named people are
      described as cofounders, but the reviewed sources do not identify a CEO, technical
      operating lead, independent director, or complete reporting structure. Investor
      governance and founder-role allocation therefore require direct documentation.
    claimRefs: [CO003, CO004, CO008, CO015]
    tableRefs: [TO002, TO003]
  - id: "execution-and-diligence-boundary"
    title: "Execution and diligence boundary"
    body: >-
      The founders' recent government experience may provide procurement and policy
      context, yet the same proximity creates post-employment, conflict, and political
      scrutiny. Reporting links Kliger to the Pentagon chief data officer role, Farritor
      to GSA cost-reduction work, and Elez to Treasury access that drew judicial concern.
      These backgrounds do not establish cyber-product execution or clean procurement.
      Fundz alone reports New York headquarters and approximately one employee; neither
      metric is corroborated in the assigned evidence, so both remain unsuitable as
      verified cover facts. The visible chronology is similarly compressed into a 2026
      founding and several July reports of the same financing. It does not support eight
      distinct company milestones, making primary incorporation records, cap-table
      evidence, leadership biographies, contract documentation, and product proof the
      immediate diligence priorities.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
