callouts:
  - calloutType: "risk"
    title: "A financing mark is not operating traction"
    body: >-
      The reported $1.4 billion post-money valuation cannot be treated as revenue,
      backlog, contract value, or cash available. None of those operating or liquidity
      measures is disclosed in the assigned evidence.
    claimRefs: [CO003, CO007]
