    notes: Null benefit cells mean no comparable public outcome or denominator was available in the assigned pool; they are not zero benefits.
    claimRefs: [CE001, CE003, CE004, CE014]
  - id: TE003
    title: Technology / operating architecture evidence
    columns: [Layer or process, Role evidenced by sources, Dependency, Risk or diligence implication]
    rows:
      - [Mission definition, "AI-enabled military and national-security cybersecurity", "Defense buyer and mission context", "Broad scope must be narrowed to a testable product"]
      - [Product boundary, "Platforms and defensive systems are named", "Unspecified data, networks, and users", "Cannot assess integration or authorization"]
      - [Model and data layer, "No company-specific model or data detail", "Unknown training, evaluation, and provenance", "Model risk and reproducibility are open"]
      - [Deployment, "Government-contract objective is reported", "Unknown hosting, accreditation, and procurement path", "No evidence of deployability or acceptance"]
      - [Reliability and support, "No uptime, incident, or support metric", "Unknown operators and service model", "Operational readiness is unverified"]
      - [Security and compliance, "No certification or control evidence", "Unknown legal and assurance framework", "Trust and procurement risk remain material"]
    notes: This is an evidence map, not an inferred architecture; the generic architecture presentation and hospital project article are excluded from company-specific technical claims.
    claimRefs: [CE005, CE009, CE010, CE011, CE014]
