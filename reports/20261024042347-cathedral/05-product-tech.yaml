company:
  name: Cathedral
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Public evidence describes Cathedral as a newly formed defense-technology startup pursuing AI-enabled military and national-security cybersecurity, but does not disclose a verifiable product surface, architecture, deployment record, technical benchmark, or security-control framework. The principal product conclusion is therefore an evidence and execution risk: the concept is legible, while maturity remains unverified.
sections:
  - id: customer-workflow
    title: Product definition and customer workflow
    body: >-
      The strongest directly relevant evidence characterizes Cathedral as a newly formed defense-technology startup developing AI-powered cybersecurity capabilities for military and national-security applications. Fundz describes the intended product at a high level as AI-driven cyber-warfare platforms and defensive national-security systems, while Jumpseat reports an objective of securing U.S. government contracts. Those descriptions identify a buyer context and mission, not a demonstrated workflow: the public record does not specify the operator, authorization boundary, data sources, interfaces, deployment model, or measurable operational outcome. There is also no public product documentation, customer case study, pricing surface, or named production deployment in the assigned evidence. The practical diligence view is that Cathedral has a stated mission and target market, but the product remains an unverified concept from this pool.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: product-map
    title: Product lines, maturity, and differentiation
    body: >-
      No assigned source provides a SKU list, module inventory, product release, patent, benchmark, certification, or technical paper attributable to the Cathedral startup. The two relevant startup descriptions use broad labels—AI-driven cyber-warfare platforms, defensive national-security systems, and AI-powered military cybersecurity capabilities—without separating offensive from defensive functions or identifying a delivered asset. The remaining prefetched pages are important negative evidence: they concern Cathedral Products UK, a project-management article, an open-source essay, a generic architecture presentation, and unrelated cathedral sound or integration case studies. They should not be used as technical corroboration. Accordingly, product maturity cannot be graded beyond “newly formed / publicly undisclosed,” and differentiation cannot be credited to AI, data, autonomy, or defense access without original technical or customer evidence.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
  - id: operating-architecture
    title: Architecture, deployment, and reliability
    body: >-
      A defensible architecture map cannot be reconstructed from the assigned sources. The generic Digital Cathedral presentation mentions APIs, microservices, event buses, Kubernetes, observability, and search, but it is explicitly a conceptual system inspired by Gothic architecture and is not evidence about Cathedral. Likewise, the PMI article discusses coordination and technology risk in a complex hospital project rather than this company. No source establishes Cathedral's software stack, model provider, training data, hosting boundary, human-approval controls, integration interfaces, latency, uptime, incident response, or support process. For a defense-cyber product, these unknowns are material: deployment authorization, separation of duties, logging, model evaluation, and fail-safe behavior could determine whether a concept is deployable. The present conclusion is an architecture gap, not a claim that these controls are absent.
    claimRefs: [CE009, CE010, CE011]
    figureRefs: [FE001]
  - id: trust-and-diligence
    title: Trust, safety, and technical diligence
    body: >-
      The product's trust posture is unverified. Jumpseat reports that the founders previously worked at the Department of Government Efficiency and that the financing included board seats for the two lead investors; neither fact demonstrates security accreditation, responsible-use controls, or procurement eligibility. Fundz reports one employee and a private status, but the page also says its descriptions are compiled from filings, press releases, and company announcements, so the employee figure and product description should be treated as database-recorded claims rather than independently audited operating evidence. No assigned source documents an authorization to operate, FedRAMP or equivalent status, CMMC posture, penetration testing, breach history, model red-teaming, or customer acceptance test. The immediate diligence requirement is a controlled technical briefing tied to a real deployment, with evidence that can be independently checked.
    claimRefs: [CE012, CE013, CE014]
    callouts:
      - calloutType: risk
        title: Product verification risk
        body: The public record names a defense-cyber ambition but supplies no attributable technical artifact or deployment proof; underwriting should assign no value to unverified architecture, autonomy, security, or reliability claims.
        claimRefs: [CE002, CE009, CE014]
