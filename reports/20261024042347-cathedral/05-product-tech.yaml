callouts:
  - calloutType: recommendation
    title: Minimum technical diligence package
    body: Request a product demo tied to a named use case, architecture and data-flow diagram, model-evaluation results, deployment and accreditation plan, human-authorization controls, security-test evidence, support model, and a customer or pilot reference. Until these are supplied, treat Cathedral as a high-potential but technically unverified defense-cyber proposition.
    claimRefs: [CE009, CE011, CE014]
