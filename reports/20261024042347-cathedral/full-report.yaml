          - type: callout
            title: Obtain primary financial evidence before underwriting
            body: >-
              Request contracts, backlog, monthly revenue, cash bridge, burn, gross-margin bridge, and financing terms
              before relying on the reported valuation.
            calloutType: recommendation
            claimRefs:
