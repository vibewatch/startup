      - number: '3.3'
        title: Pricing, distribution, and switching
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging are not disclosed in the assigned evidence for Cathedral or the named alternatives.
              Cathedral is reported to be seeking US government contracts, which makes procurement access, authority to
              operate, integration into classified workflows, and contract vehicles potentially more important than a
              public list price. However, no retained source documents Cathedral's contract vehicle, prime or channel
              partner, deployment footprint, renewal pattern, data portability, or realized switching cost. Government
              connections may help open doors, according to one report, but the same report flags political risk. Until
              buyer-side evidence exists, distribution advantage and lock-in should be treated as hypotheses rather than
