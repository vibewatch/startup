              high-power microwave hardware. This is evidence of a wide buyer alternative set, not proof that every name
              competes in the same procurement. Internal government development, incumbent contractors, point cyber
              tools, and the status quo remain plausible substitutes, but the assigned evidence does not enumerate or
              compare them. The positioning map consequently scores mission proximity and product modality only; it does
