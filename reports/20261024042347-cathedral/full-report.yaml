chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating proposition
        blocks:
          - type: paragraph
            body: >-
              Cathedral is reported as a 2026-founded US military-cybersecurity startup created by Gavin Kliger, Luke
              Farritor, Marko Elez, and Jack Stein. Its stated ambition is to build AI systems for both defensive and
              offensive US military cyber operations and sell through federal contracts. This is still a proposition
              rather than a demonstrated operating footprint: the reviewed evidence identifies no named production
              product, awarded contract, customer, or deployment date. Cathedral is also considering a data-center
              acquisition or partnership for dedicated compute, which signals that infrastructure strategy is still
              being formed. No primary corporate page or filing in the assigned evidence establishes the exact legal
              entity, and a UK registry result is for the differently named Cathedral Products (UK) Limited rather than
              proof of the target company's registration.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO007
              - CO014
              - CO015
      - number: '1.2'
        title: Capital, leadership, and control
        blocks:
          - type: paragraph
            body: >-
              Third-party sources consistently report a single $160 million financing in July 2026 and a $1.4 billion
              post-money valuation, although they variously label the event Growth, Venture, or Series A. Andreessen
              Horowitz and Sequoia Capital are reported as the leads or co-leads, with representatives of both investors
              taking board seats. That creates unusually strong capital backing for a newly formed company, but the
              financing mark is not revenue, cash availability, or proof of contracts. Public leadership disclosure is
              also narrow: all four named people are described as cofounders, but the reviewed sources do not identify a
              CEO, technical operating lead, independent director, or complete reporting structure. Investor governance
              and founder-role allocation therefore require direct documentation.
            claimRefs:
              - CO003
              - CO004
              - CO008
              - CO015
