            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO009
              - CO010
      - number: '1.3'
        title: Execution and diligence boundary
        blocks:
          - type: paragraph
            body: >-
              The founders' recent government experience may provide procurement and policy context, yet the same
              proximity creates post-employment, conflict, and political scrutiny. Reporting links Kliger to the
              Pentagon chief data officer role, Farritor to GSA cost-reduction work, and Elez to Treasury access that
              drew judicial concern. These backgrounds do not establish cyber-product execution or clean procurement.
              Fundz alone reports New York headquarters and approximately one employee; neither metric is corroborated
              in the assigned evidence, so both remain unsuitable as verified cover facts. The visible chronology is
              similarly compressed into a 2026 founding and several July reports of the same financing. It does not
              support eight distinct company milestones, making primary incorporation records, cap-table evidence,
              leadership biographies, contract documentation, and product proof the immediate diligence priorities.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
