  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Disclosed financial profile
        blocks:
          - type: paragraph
            body: >-
              The strongest current financial evidence is a single reported July 2026 venture financing. Multiples
              records $160 million raised in one undisclosed-stage round, led by Andreessen Horowitz and Sequoia
              Capital, at a $1.4 billion valuation. Fundz independently records the same headline financing and
              describes the valuation as post-money, while Jumpseat Aerospace News reports the round and its stated
              purpose as developing AI-powered military and national-security cybersecurity capabilities. These sources
              establish financing and reported valuation, not revenue or cash available. The pool contains no company
              filing, customer contract, audited statement, or disclosed cash balance that would let an investor
              reconcile the financing with operating performance.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI005
              - CI009
              - CI011
              - CI013
      - number: '4.2'
        title: Monetization and unit economics
        blocks:
          - type: paragraph
            body: >-
              Multiples describes Cathedral's revenue model as licensing and its customer focus as
              business-to-government, but the source does not provide a price list, contract size, implementation fee,
              renewal term, gross margin, or customer count. Fundz similarly describes a private company and a
              defense-oriented product category without reporting revenue or recurring-revenue metrics. Consequently,
              list pricing, realized pricing, revenue recognition, sales cycle, CAC, payback, utilization, support cost,
              and gross-margin drivers remain unverified. The financial model should therefore treat licensing as a
              reported mechanism, not as proof of ARR, revenue quality, or SaaS-like economics.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The financing is material relative to the limited operating disclosure, but the pool cannot establish how
              much of the $160 million remains available, how quickly it is being spent, whether compute or deployment
              commitments create capital intensity, or when a next financing would be required. Jumpseat says the
              company is targeting military cybersecurity contracts; that target is a commercial objective rather than
              evidence of booked backlog or recognized revenue. A reasonable underwriting stance is research-more: the
              valuation is difficult to assess without revenue, contract economics, cash burn, runway, dilution terms,
              and evidence of repeatable government procurement. The financing may provide runway, but runway duration
              cannot be inferred from funding raised alone.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI007
              - CI010
              - CI011
      - number: '4.4'
        title: Diligence implications
        blocks:
          - type: paragraph
            body: >-
              The immediate diligence priority is to obtain primary financial evidence rather than extrapolate from
              investor participation. Management should provide a monthly cash bridge from the financing close, current
              cash and restricted cash, monthly operating burn, hiring plan, committed compute and infrastructure spend,
              backlog and contract-award status, revenue-recognition policy, and a customer-level gross-margin bridge.
              The evidence pool also contains several homonymous Cathedral entities and unrelated financial pages; those
              records are not valid operating evidence for this company. That name-collision risk makes entity
              verification a prerequisite to using any future database metric.
            claimRefs:
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation is financing-reported, not earnings-underwritten
