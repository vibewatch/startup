              - CU008
              - CU011
      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The assigned materials contain no NRR, GRR, churn, renewal, cohort, contract-length, satisfaction,
              backlog, customer-concentration, or expansion data for Cathedral. A defense-cyber procurement may involve
              long security reviews, authorization requirements, and program-specific integration, but those mechanics
              are not evidenced here and should not be presented as company facts. The only supportable commercial
              conclusion is that durability and concentration are unresolved. The financing coverage indicates that the
              company seeks military and national- security contracts, while the data registries repeat the $160 million
              financing and $1.4 billion valuation; neither source identifies customer revenue or contracted backlog.
              Before underwriting expansion, an investor needs executed contract schedules, customer references,
              deployment status, renewal terms, revenue by customer, and evidence that any initial government
              relationship can scale beyond a single sponsor or program.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption is unverified
            body: >-
              The assigned evidence supports a government-cyber commercialization objective but does not establish a
              paying customer, production deployment, contract award, or retention metric.
            calloutType: risk
            claimRefs:
              - CU003
              - CU006
              - CU009
          - type: callout
            title: Same-name evidence is dangerous
            body: >-
              The most detailed customer case in the pool concerns City Detect's PASS AI deployment at Cathedral City,
              California; it must not be attributed to Cathedral.
            calloutType: insight
            claimRefs:
              - CU007
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Evidence boundary and severity ranking
        blocks:
          - type: paragraph
            body: >-
              The assessment starts with a material verification deficit. Four current secondary sources describe a
              newly formed defense-cyber company, while the most detailed source says Cathedral has not publicly
              disclosed specific products, customers, contracts, or deployment timelines. Reported financing is
              substantial, but funding raised is not cash available and the cited sources provide no burn, runway,
              backlog, or contract economics. Fundz lists one employee, yet that aggregator observation is not a
              verified headcount and should not be used to calculate productivity or runway. Search attribution is also
              unusually fragile: assigned results resolve to unrelated Cathedral-named UK products, printing, holdings,
              and CLO entities. The heatmap therefore ranks residual exposure from disclosed facts and explicit
              absences; it does not imply that an unreported incident, license, control, or contract does or does not
              exist.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR009
              - CR012
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and political exposure
        blocks:
          - type: paragraph
            body: >-
              Cathedral reportedly intends to pursue US government work spanning defensive and offensive cyber
              capabilities. Available reporting identifies requirements around classified information, government
              cybersecurity standards, access control, predictable AI behavior, and human authorization, but it does not
              establish that Cathedral has obtained approvals, certifications, facilities, or an authority-to-operate.
              Offensive use adds escalation and mission-assurance risk because an error could affect unintended systems
              or expose intelligence capabilities. Founder access to federal operations may accelerate buyer discovery,
              yet the same relationships create procurement-integrity and political-transition exposure. Reporting about
              a founder's prior access litigation and offensive posts raises a governance diligence issue; it does not
              establish misconduct by Cathedral. No conclusion about litigation or enforcement against Cathedral is
              supportable from the assigned pool.
            claimRefs:
              - CR002
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Operational, technical, and security execution
        blocks:
          - type: paragraph
            body: >-
              The operating challenge is to turn a recently formed organization and reported financing into a
              demonstrable, controllable product. Public reporting says dedicated infrastructure may be acquired or
              supplied by a data-center partner, making compute availability, security boundaries, and counterparty
              execution gating dependencies rather than proven assets. Military cyber systems also require predictable
              model behavior, restricted access, and human authorization. Those requirements are especially
              consequential for offensive capability, where an incorrect action can create collateral disruption or
              reveal sensitive methods. There is no assigned evidence of product tests, red-team results, reliability
              history, incident response, classified-environment accreditation, or production deployment. The absence of
              such evidence is a diligence gap, not evidence that controls are absent or that an incident has occurred.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR014
      - number: '7.4'
        title: Dependencies, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Cathedral's disclosed plan concentrates execution around a difficult buyer, scarce technical talent,
              sensitive compute, and institutional relationships. The company reportedly seeks US government contracts,
              while a possible data-center acquisition or partnership adds another critical counterparty decision.
              Andreessen Horowitz and Sequoia Capital reportedly co-led the financing and took board seats, but a
              separate registry leaves round participants undisclosed; the complete cap table and governance rights
              therefore remain private. The thesis should break if primary diligence cannot demonstrate a deliverable
              product, awarded and competitively obtained work, applicable security controls, and human-governed
              operating limits before the next financing decision. Additional triggers include dependence on a single
              political channel, inability to secure suitable infrastructure, or continued nondisclosure of burn,
              runway, customer concentration, and deployment evidence.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR009
              - CR011
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR005
              - CR009
              - CR011
              - CR012
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence absence is the immediate underwriting risk
            body: >-
              The assigned evidence does not support a finding that Cathedral has suffered an incident or failed a
              compliance requirement. It supports a narrower conclusion: investors cannot verify product maturity,
              contracts, controls, or deployment readiness from the retained public record.
            calloutType: risk
            claimRefs:
              - CR003
              - CR007
              - CR012
              - CR016
          - type: callout
            title: Kill criteria before the next capital decision
            body: >-
              Require primary proof of a deliverable product, competitively obtained customer work, applicable security
              authorization, human-governed operating limits, infrastructure readiness, and a reconciled budget and cap
              table. Continued absence of those materials should halt underwriting rather than be converted into
              optimistic assumptions.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price versus disclosed proof
        blocks:
          - type: paragraph
            body: >-
              The strongest current evidence is a cluster of independent database and news records describing one July
              2026 financing: $160M raised at a $1.4B valuation, with Andreessen Horowitz and Sequoia Capital identified
              as leads. The records are not equivalent to audited financial disclosure, and they disagree on round
              naming, investor count, and location. Dealroom reports that both lead firms took board seats and that the
              company seeks government contracts, while Fundz labels the event a Series A and reports one employee.
              Forge, a private-market data source, says no post-money valuation or funding amount is available and
              explicitly warns that it does not independently verify company information. That conflict makes the
              headline valuation a financing reference point, not a verified current mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV010
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is founder access and investor sponsorship: the available accounts describe Pentagon,
              SpaceX, and government-technology backgrounds, and the two lead firms reportedly took board seats. Those
              signals may improve access to a slow government procurement market, but they do not establish a contract,
              backlog, deployed capability, revenue, or repeatable sales motion. The anti-thesis is therefore
              valuation-sensitive: a $1.4B post-money price implies that investors are underwriting future strategic
              access and technical execution before public operating proof exists. Political exposure is also material
              because Dealroom describes ties to the current administration as both an advantage and a possible source
              of scrutiny after the 2026 midterms.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, entry discipline, and diligence
        blocks:
          - type: paragraph
            body: >-
              A defensible scenario framework must remain qualitative because no public revenue, margin, retention,
              contract value, burn, runway, liquidation preference, or secondary price is available in the assigned
              evidence. The bull case requires verified defense contracts, a shipped capability, and conversion of
              founder access into durable programs. The base case is continued technical and procurement development
              with substantial financing dependence and uncertain timing. The bear case is a down-round or stalled
              commercialization if procurement, political, cyber-risk, or compute constraints prevent deployment. An
              investor should not underwrite a target return from the headline valuation alone; the next decision gate
              is documentary diligence on financing terms, government awards, product milestones, and cash runway.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Research-more. The reported valuation is price-sensitive but lacks a public operating denominator; require
              financing documents, contract evidence, product milestones, and runway before underwriting entry.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV010
              - CV012
              - CV014
          - type: callout
            title: Thesis-break triggers
            body: >-
              Treat a failed security or compliance review, loss of government contracting access, missed technical
              milestones, financing stress, or a down-round as thesis-break evidence until the company supplies contrary
              documentary proof.
            calloutType: risk
            claimRefs:
              - CV009
              - CV013
              - CV014
