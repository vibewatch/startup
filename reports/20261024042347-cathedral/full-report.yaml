              - CO003
              - CO004
              - CO007
              - CO015
              - CO016
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: A financing mark is not operating traction
            body: >-
              The reported $1.4 billion post-money valuation cannot be treated as revenue, backlog, contract value, or
              cash available. None of those operating or liquidity measures is disclosed in the assigned evidence.
            calloutType: risk
            claimRefs:
              - CO003
              - CO007
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidence quality
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary is narrower than “AI” or “cybersecurity” generally: it is the spend
              associated with AI-enabled cyber operations and defensive national-security systems sold into military or
              government buyers. The available company descriptions state that Cathedral targets “AI-powered military
              cyber operations” and national-security applications, but they do not identify a product SKU, contract
              vehicle, deployment model, or disclosed customer. Accordingly, commercial cybersecurity, consumer
              software, tourism, and general civic technology are excluded from the addressable-market frame. This
              distinction matters because the assigned search results contain multiple unrelated entities named
              Cathedral, including a dissolved UK company and a municipal survey, so name-level search volume cannot be
              treated as market evidence for the target company.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
      - number: '2.2'
        title: Sizing lenses and what cannot yet be isolated
        blocks:
          - type: paragraph
            body: >-
              Two fetched company-profile and trade-publication records repeat a July 2026 financing description: $160
              million raised at a $1.4 billion valuation for AI-powered military cybersecurity and national-security
              applications. Those figures describe financing and valuation, not market size, revenue, ARR, contract
              value, or cash available for deployment. No assigned source provides government cyber procurement totals
              attributable to Cathedral, a serviceable segment definition, win rates, pricing, backlog, or a
              time-bounded spending denominator. The sizing lenses below therefore show evidence availability rather
              than fabricated dollar estimates. A defensible SAM would require a defined agency, mission, contract
              vehicle, geography, and period; a defensible SOM would additionally require competitive win evidence and
              delivery capacity.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs: []
      - number: '2.3'
        title: Buyer, user, and payer structure
        blocks:
          - type: paragraph
            body: >-
              The reported target customer is the U.S. government, with military and national-security use cases. That
              points to a multi-party adoption path: an operational or cyber mission user would define the problem, an
              acquisition organization would control procurement, technical and security reviewers would gate
              deployment, and an appropriated government budget would pay. None of those roles, agencies, contract
              awards, pilots, or procurement milestones is identified in the assigned evidence. The commercial
              implication is that market access depends less on generic cybersecurity demand than on mission
              authorization, security accreditation, procurement timing, and proof that autonomous capabilities can be
              trusted in sensitive environments.
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence supports only a high-level demand thesis: geopolitical cyber-warfare challenges and
              critical-network defense are described as the problems Cathedral addresses. It does not establish urgency,
              budget ownership, customer ROI, switching costs, or deployment readiness. The strongest counterweight is
              verification risk: the assigned sources do not independently validate Cathedral’s capabilities, government
              traction, revenue, or customer count. Public research also returns records for unrelated Cathedral
              entities, including a dormant company and cathedral visitor studies, which increases the risk of
              false-positive market sizing. Until primary procurement or customer evidence is available, valuation
              relevance should be assessed against a hypothesis rather than a quantified market forecast.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sizing is not underwritten
            body: >-
              The assigned evidence does not isolate a defense-cyber denominator or demonstrate Cathedral's share of it;
              any precise TAM/SAM/SOM number would be unsupported.
            calloutType: risk
            claimRefs:
              - CM007
              - CM014
  - number: 3
