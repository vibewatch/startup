  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The strongest directly relevant evidence characterizes Cathedral as a newly formed defense-technology
              startup developing AI-powered cybersecurity capabilities for military and national-security applications.
              Fundz describes the intended product at a high level as AI-driven cyber-warfare platforms and defensive
              national-security systems, while Jumpseat reports an objective of securing U.S. government contracts.
              Those descriptions identify a buyer context and mission, not a demonstrated workflow: the public record
              does not specify the operator, authorization boundary, data sources, interfaces, deployment model, or
              measurable operational outcome. There is also no public product documentation, customer case study,
              pricing surface, or named production deployment in the assigned evidence. The practical diligence view is
              that Cathedral has a stated mission and target market, but the product remains an unverified concept from
              this pool.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE014
      - number: '5.2'
        title: Product lines, maturity, and differentiation
        blocks:
          - type: paragraph
            body: >-
              No assigned source provides a SKU list, module inventory, product release, patent, benchmark,
              certification, or technical paper attributable to the Cathedral startup. The two relevant startup
              descriptions use broad labels—AI-driven cyber-warfare platforms, defensive national-security systems, and
              AI-powered military cybersecurity capabilities—without separating offensive from defensive functions or
              identifying a delivered asset. The remaining prefetched pages are important negative evidence: they
              concern Cathedral Products UK, a project-management article, an open-source essay, a generic architecture
              presentation, and unrelated cathedral sound or integration case studies. They should not be used as
              technical corroboration. Accordingly, product maturity cannot be graded beyond “newly formed / publicly
              undisclosed,” and differentiation cannot be credited to AI, data, autonomy, or defense access without
              original technical or customer evidence.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE009
              - CE010
              - CE011
              - CE014
      - number: '5.3'
        title: Architecture, deployment, and reliability
        blocks:
          - type: paragraph
            body: >-
              A defensible architecture map cannot be reconstructed from the assigned sources. The generic Digital
              Cathedral presentation mentions APIs, microservices, event buses, Kubernetes, observability, and search,
              but it is explicitly a conceptual system inspired by Gothic architecture and is not evidence about
              Cathedral. Likewise, the PMI article discusses coordination and technology risk in a complex hospital
              project rather than this company. No source establishes Cathedral's software stack, model provider,
              training data, hosting boundary, human-approval controls, integration interfaces, latency, uptime,
              incident response, or support process. For a defense-cyber product, these unknowns are material:
              deployment authorization, separation of duties, logging, model evaluation, and fail-safe behavior could
              determine whether a concept is deployable. The present conclusion is an architecture gap, not a claim that
              these controls are absent.
            claimRefs:
              - CE009
              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE009
              - CE014
      - number: '5.4'
        title: Trust, safety, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              The product's trust posture is unverified. Jumpseat reports that the founders previously worked at the
              Department of Government Efficiency and that the financing included board seats for the two lead
              investors; neither fact demonstrates security accreditation, responsible-use controls, or procurement
              eligibility. Fundz reports one employee and a private status, but the page also says its descriptions are
              compiled from filings, press releases, and company announcements, so the employee figure and product
              description should be treated as database-recorded claims rather than independently audited operating
              evidence. No assigned source documents an authorization to operate, FedRAMP or equivalent status, CMMC
              posture, penetration testing, breach history, model red-teaming, or customer acceptance test. The
              immediate diligence requirement is a controlled technical briefing tied to a real deployment, with
              evidence that can be independently checked.
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Minimum technical diligence package
            body: >-
              Request a product demo tied to a named use case, architecture and data-flow diagram, model-evaluation
              results, deployment and accreditation plan, human-authorization controls, security-test evidence, support
              model, and a customer or pilot reference. Until these are supplied, treat Cathedral as a high-potential
              but technically unverified defense-cyber proposition.
            calloutType: recommendation
            claimRefs:
              - CE009
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer hypothesis
        blocks:
          - type: paragraph
            body: >-
              Cathedral is described in the assigned materials as a private New York company developing AI-driven
              cyber-warfare platforms and defensive national-security systems, with an intended market of military and
              national-security applications. That description supports a buyer hypothesis centered on U.S. government
              and defense organizations, but it does not identify a contracting agency, program office, prime
              contractor, system integrator, operational user, or paying account. The available financing coverage says
              the company aims to secure U.S. government contracts, which is a go-to-market objective rather than
              evidence of a signed award or deployed product. The customer segmentation therefore remains an
              underwriting hypothesis: government is the likely payer and mission operator, while the actual procurement
              path, user persona, contract vehicle, and revenue-bearing unit are undisclosed. The search pool also
              contains unrelated Cathedral City, Cathedral Candle, and Cathedral Products records, so name matching
              cannot be treated as customer evidence.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
      - number: '6.2'
        title: Adoption and named-customer proof
        blocks:
          - type: paragraph
            body: >-
              No assigned source provides a named Cathedral customer, a production deployment, a pilot result, a
              contract value, utilization data, a renewal, or a customer quote. Fundz reports a one-employee profile and
              a July 2026 financing event, but its description of defense deployments is a funding-use narrative, not a
              customer reference. Jumpseat reports that Cathedral aims to secure government contracts, again describing
              intended commercialization rather than realized adoption. The City Detect case study contains detailed
              operational adoption metrics, but it is a case study for City Detect's PASS AI platform at Cathedral City,
              California, not for Cathedral. This distinction is material: the strongest quantified adoption evidence in
              the pool belongs to another issuer and another company. Customer diligence should consequently treat
              Cathedral as pre-commercial or unverified rather than infer traction from logos, funding, or a same-name
              municipal case study.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
