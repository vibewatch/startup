      - number: '3.4'
        title: Durability and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Cathedral's reported $160 million financing at a $1.4 billion valuation supplies resources to recruit and
              develop product, but financing is not evidence of competitive superiority, revenue, contract awards, or
              cash available after deployment costs. A directory's estimate of about one employee is too uncertain to
              reconcile with that capital signal and should not be treated as a verified headcount. The evidence base is
              also vulnerable to name collisions: two assigned search results concern an unrelated UK products company
              and a Los Angeles school football team. The resulting moat verdict is unproven. Cathedral may have a
              focused military-cyber wedge and unusual government access, yet capability validation, procurement
              traction, independent customer proof, and comparable pricing remain the decisive diligence requirements.
