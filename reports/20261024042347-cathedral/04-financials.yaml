      - [AI-enabled military cyber operations, B2G product/application target, Government deployment, "Target market reported; no awards or recognized revenue disclosed", "Third-party reporting; target is not traction", "Obtain award notices, procurement vehicles, funded task orders, and delivery milestones"]
      - [Implementation/support services, Unknown, Unknown, null, "No public evidence in assigned pool", "Request services scope, pricing, staffing burden, and gross-margin treatment"]
      - [Data-center or compute capacity, Possible infrastructure dependency, Compute commitment, "Possible partnership/acquisition exploration reported in Multiples; terms unknown", "Unverified strategic possibility", "Request compute contracts, capex commitments, and supplier concentration"]
    notes: "Sources are limited to the assigned prefetched pool; null means no public value was disclosed, not zero revenue."
    claimRefs: [CI005, CI009, CI011, CI013]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric, List vs realized, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Licensing model, Mechanism, "Licensing reported; price undisclosed", medium, "Determines recurring-revenue quality and contractability", "Provide price cards, contract examples, minimum commitments, and renewal provisions"]
      - [Average contract value, Realized, null, low, "Needed to size pipeline conversion and sales efficiency", "Provide signed-contract distribution by customer and period"]
      - [Sales cycle, Realized, null, low, "Defense procurement timing drives cash conversion", "Provide median cycle from qualified opportunity to funded award"]
      - [Discounting and bespoke work, Realized, null, low, "Determines gross margin and repeatability", "Provide discount schedule, change-order history, and services mix"]
    notes: "No source in the assigned pool reports a price, contract value, discount, or sales-cycle statistic."
    claimRefs: [CI005, CI006, CI007, CI010]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue or ARR, null, low, "No operating scale is available to value the $1.4B reported valuation", "Provide monthly recognized revenue and ARR bridge with customer concentration"]
      - [Gross margin, null, low, "Software licensing may have different economics from managed delivery or compute-heavy operations", "Provide gross-margin bridge by product, hosting, personnel, and services"]
      - [CAC and payback, null, low, "Government GTM can require long, expensive capture cycles", "Provide fully loaded acquisition cost and cohort payback"]
      - [Cash balance, null, low, "Funding raised is not the same as cash available", "Provide latest bank statements and restricted-cash schedule"]
      - [Monthly burn and runway, null, low, "Determines next-round timing and dilution risk", "Provide 18-month cash forecast with base, downside, and hiring cases"]
      - [Debt or project-finance obligations, null, low, "Compute and infrastructure commitments could create fixed obligations", "Provide debt schedule, leases, guarantees, and supplier commitments"]
    notes: "Every unavailable field is a specific diligence request; no null is treated as zero."
    claimRefs: [CI007, CI008, CI010, CI011, CI012, CI013, CI014]
