callouts:
  - calloutType: risk
    title: Valuation is financing-reported, not earnings-underwritten
    body: The assigned sources repeat a $1.4B July 2026 valuation and $160M financing, but provide no revenue, margin, cash, or runway evidence.
    claimRefs: [CI001, CI002, CI003, CI007, CI010]
  - calloutType: assumption
    title: Funding cannot be converted into runway
    body: Cash available, burn, compute commitments, and hiring plans are undisclosed, so the financing cannot support a precise runway estimate.
    claimRefs: [CI010, CI011, CI012, CI013]
  - calloutType: recommendation
    title: Obtain primary financial evidence before underwriting
    body: Request contracts, backlog, monthly revenue, cash bridge, burn, gross-margin bridge, and financing terms before relying on the reported valuation.
    claimRefs: [CI007, CI012, CI013, CI014]
