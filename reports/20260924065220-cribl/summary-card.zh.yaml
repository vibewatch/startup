  topStrengths:
    - Cribl 在遥测数据管道中间件市场居于领先地位，企业级部署逾 9,000 处，覆盖 50%+ 的 Fortune 500 企业，形成显著的在位优势
    - 2026 年 2 月 ARR 达到 $300M+，较 Series E 于 2024 年 8 月交割时的 $200M 更高；据此可推算，18 个月内 ARR 约增长 50%，且期间未披露新一轮融资
    - 创始团队成员均曾任职于 Splunk，具备深厚领域经验；Cisco 收购 Splunk 后，大型企业对其产品走向的顾虑也有利于 Cribl 的市场定位
    - 2026 年 1 月获得 FedRAMP ATO，打开联邦采购通道；恰逢 CMMC 2.0 推动 300,000 家国防承包商的需求达到高点
    - 产品矩阵从 Stream 扩展至 Lake、Search 与 Guard，拓展了交叉销售空间，构筑起远超纯管道竞品的切换成本
    - 随数据量每年增长 30%，按量计费自然形成“先切入、再扩张”的增长飞轮
  topRisks:
    - 来自 AWS (Firehose)、Azure (Monitor Ingest) 和 GCP (Log Router) 的云原生日志路由服务，在单云轻量路由场景中构成实质替代威胁
    - Cisco 与 Splunk 的整合落地成效存在变数，取决于收购后 Splunk 自身产品演进路径，或强化或瓦解 Cribl 核心销售叙事
    - OpenTelemetry 路由能力逐步成型（Log Bridge API、用于日志的 OTLP），可能在未来 2-4 年内削弱 Cribl 在纯采集场景下的差异化优势
    - 未公开披露 NRR 与毛利率，无法验证支撑 $3.5B 估值的单位经济效益
    - 11.7x 的 ARR 估值倍数高于成长期后期 SaaS 典型重估区间 5-8x；若要在 IPO 或老股交易中实现溢价退出，需要维持 >30% 的持续增速
    - 企业一线技术人员反映，产品复杂度以及从 SPL 迁往 CriblQL 的迁移成本构成实质落地阻力
  unresolvedGaps:
    - 净收入留存率（NRR）与毛利率未公开披露；无法验证其单位经济模型能否支撑 $3.5B 估值
    - 未披露 Stream、Edge、Lake、Search 各产品线的 ARR 拆分数据；尚难看清哪些产品是核心增长引擎，哪些仍处于起步阶段
    - 客户数自 2024 年 8 月（Series E 轮时公布的 9,000+ 家）起未再更新；客户净增速度与老客扩张节奏均无法验证
    - 因脱敏案例较多，联邦政府板块的收入贡献无法验证；FedRAMP ATO 认证对新增订单的拉动幅度尚未量化
    - OpenTelemetry 对 Cribl 中期差异化优势的影响仍未明朗，尤其是在数据采集场景
    - 未公开披露 IPO 时间表及财务投资人的流动性退出预期
