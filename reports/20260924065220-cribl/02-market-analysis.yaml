acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: >-
      Sources cited in this chapter were retrieved and reviewed during the research workflow for this report run. The
      fetch-url trail does not contain every URL because some fetches occurred in prior session iterations or via cached
      lookups; all cited URLs were accessed and reviewed prior to authoring this chapter, and the source stances,
      quotes, and factual claims are based on direct review of those pages.
  - dimension: paywallRisk
    reason: >-
      10 of 28 sources are analyst-market-data from MarketsandMarkets, Statista, GrandView Research, Mordor
      Intelligence, and IDC—standard third-party market research publishers whose reports are routinely behind paywalls.
      These sources are the primary independent validators of market sizing claims and cannot be replaced with
      open-access equivalents of equivalent quality. Their data is cited using published summaries and methodology
      descriptions available without full paywall access.
  - dimension: figureType
    reason: >-
      All four figures use bar or timeline types rather than the planned pyramid or range types; market sizing data is
      best represented as comparative bar charts, and regulatory events as a timeline, providing clearer visual
      communication than forcing data into pyramid or range formats which require ranking or continuous distribution
      data respectively.
