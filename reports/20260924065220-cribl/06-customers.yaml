  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and formal renewal rates are not publicly disclosed.
        These are the primary indicators of customer durability and are unavailable for a private company.
      whyItMatters: >-
        NRR is the single most important indicator of whether $300M ARR will compound into $500M+ ARR; without it, the
        bull/base/bear valuation scenarios have very wide confidence intervals.
      diligencePath: >-
        Request NRR and GRR cohort data, quarterly renewal-rate waterfall, and net logo retention by segment in the
        investor data room.
      relatedQuestionRefs:
        - QU015
        - QU016
        - QU024
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: revenue-concentration
      missingEvidence: >-
        Revenue concentration by customer (top-5, top-10, top-25 as % of ARR) is not publicly disclosed, making
        concentration risk assessment imprecise.
      whyItMatters: >-
        High customer concentration is a valuation risk factor; if the top 3 customers represent 20%+ of ARR, there is
        meaningful churn sensitivity at the account level.
      diligencePath: >-
        Request customer concentration analysis (top-10 as % of ARR) from management; verify through audited financial
        data.
      relatedQuestionRefs:
        - QU027
      relatedTableRefs:
        - TU005
    - type: enumeration-incomplete
      severity: minor
      topic: named-customers
      missingEvidence: >-
        Only ~10–30 customers are publicly named out of 9,000+ total. The absence of systematic public case study
        disclosure limits evidence quality for most customer segments.
      whyItMatters: >-
        Without more named customers across verticals, the named customer table represents a sampling bias toward
        well-known enterprises and may not reflect typical deployment outcomes.
      diligencePath: >-
        Request full reference customer list and representative case studies across verticals; conduct 5-10 customer
        reference calls.
      relatedQuestionRefs:
        - QU017
        - QU018
        - QU019
      relatedTableRefs:
        - TU003
    - type: missing-source
      severity: minor
      topic: geographic-split
      missingEvidence: >-
        International ARR as % of total ARR and customer count by geography are not publicly disclosed; Cribl appears
        North America–centric but Europe/APAC traction is unconfirmed at scale.
      whyItMatters: >-
        International expansion is both a growth lever (large untapped markets) and a risk factor (local regulatory
        complexity, longer sales cycles); current data does not allow either to be quantified.
      diligencePath: Request international ARR %, headcount by region, and partner coverage map for EMEA and APAC.
      relatedQuestionRefs:
        - QU004
