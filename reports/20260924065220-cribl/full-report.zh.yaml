      - number: '1.2'
        title: 创始人与管理团队
        blocks:
          - type: paragraph
            body: >
              Cribl 由三位 Splunk 前员工联合创立，使公司在可观测性与日志管理领域具备深厚的行业积淀。Clint Sharp 担任 CEO，是数据管道战略领域公认的行业代表人物。CTO 兼首席科学家 Dritan
              Bitincka 与其兄弟 Ledion Bitincka 则凭借在 Splunk 及更早公司从事大规模分布式系统的经验，为公司奠定了技术底层深度。


              创始团队的「前 Splunk 员工」背景具有重大战略意义：他们对 Splunk 的架构瓶颈与定价模型了如指掌，打磨出的 Cribl Stream 得以明确卡位为 Splunk
              环境的补充方案与迁移路径。Sequoia Capital 的公开投资组合说明也证实，该公司「由三位前 Splunk 员工创立，使命是最大化释放机器数据的价值」。


              自创立以来，公司高管团队保持稳定，截至报告发布日未出现重大公开的高管离职。考虑到 2022–2024 年整个科技行业的剧烈震荡，这种稳定性尤为亮眼。《财富》杂志多次将 Cribl
              评入最佳雇主榜单，包括最佳中型企业工作场所与科技行业最佳工作场所，反映出其扎实的企业文化与人才留存能力。截至 2026 年 9 月，其 LinkedIn 官方账号拥有 117,731 名关注者，可作为 Cribl
              在技术从业者中品牌触达度的参考。公开资料中未能确认 CFO 或 COO 人选；与同阶段同业相比，这是治理透明度上的缺口。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
