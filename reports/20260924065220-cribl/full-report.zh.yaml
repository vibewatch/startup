companyProfile:
  summary: >
    Cribl 是一家总部位于旧金山的企业软件公司，2018 年由三位前 Splunk 工程师创立：Clint Sharp（CEO）、Dritan Bitincka（CTO）和 Ledion
    Bitincka。公司构建中立的遥测管道平台，在不锁定厂商的前提下，把安全和可观测性数据从任意源端路由、转换并富化到任意目标端。截至 2026 年 2 月，Cribl 的 ARR 已跨越 $300M，拥有 9,000+
    处客户部署，覆盖 50%+ 的 Fortune 500 企业，成为遥测管道中间件这一新兴品类中明确的独立市场领跑者。2024 年 8 月由 GV 领投的 $319M Series E 融资（估值 $3.5B）以及 2026 年 1
    月获得的 FedRAMP ATO 认证，证实了其后期高成长的发展轨迹和联邦市场的准入就绪度。公司产品线涵盖 Stream（路由与转换）、Edge（分布式 Agent）、Lake（按需解析模式的数据湖）、Search（联合日志搜索）和
    Guard（敏感数据检测），使 Cribl 拥有超越单一纯管道的平台化故事。
