  - id: FI001
    title: 收入与扩张流向图
    type: flow
    summary: 展示从需求开拓到续约及利润贡献的业务流程，呈现 Cribl 将企业客户兴趣转化为经常性 ARR 与增购扩张的路径。
    data:
      nodes:
        - id: demand
          label: 需求开拓
          description: 遥测成本与合规压力带动企业安全、IT 及联邦机构需求
        - id: qual
          label: 销售资质评估
          description: 针对路由、过滤与存储保留场景做需求挖掘与技术评估
        - id: poc
          label: POC / 评估
          description: 概念验证展现出降本与数据自主把控的价值
        - id: land
          label: 首笔签约
          description: 借助年度或多年期订阅落地 Stream 或周边产品
        - id: expand
          label: 增购扩张
          description: 更多产品与更大用量推动 ARR 扩张及 NRR 提升
        - id: renew
          label: 客户续约
          description: 续约稳固经常性 ARR，并加深平台渗透率
        - id: margin
          label: 利润贡献
          description: 高订阅占比与规模效应预计随时间推移改善毛利率
      edges:
