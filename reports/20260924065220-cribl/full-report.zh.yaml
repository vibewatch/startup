      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              核心投资逻辑由四大支柱构成：（1）卡位关键链路的核心流水线，构筑结构性高留存；（2）平台横向扩展拉动 130%+ 的稳固 NRR；（3）凭 FedRAMP ATO 认证打入联邦市场，形成防御壁垒；（4）借助
              Cribl Search 顺利推进 AI 平台化演进，拉高产品天花板。


              Cribl 获 2025 年 Gartner SIEM 魔力象限认可，并在 Gartner Peer Insights 拥有 300+ 企业评价、均分 4.4/5.0，印证了独立的市场认可度。Sequoia
              Capital 持续加码与 Google Ventures 以 $3.5B 估值领投 Series E，体现出顶级机构背书。GV 这一入场动作也暗示，其自设的退出估值上限远高于本次入场成本。


              最核心的反向逻辑在于产品商品化：一旦 Cisco/Splunk 在 Splunk 核心许可中捆绑免费流水线，或 OTel Collector 功能追平，Cribl 的定价权将被侵蚀，NRR 也将回落至 100%
              附近。G2 上的企业客户评论指出计费复杂引发性价比顾虑，成为 NRR 可持续性的警示信号。在 9,000+ 客户与 $300M+ ARR 体量下，有足够遥测数据量来支撑 Cribl
              授权费用的企业总量有限，中端市场扩张可能逼近饱和边界。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
      - number: '8.3'
        title: 乐观、基准与悲观回报情景
        blocks:
          - type: paragraph
            body: >
              以 2024 年 9 月 Series E 为起点，推演未来 3–5 年的三种退出情景：


              乐观情景（概率 30%）：Cribl 顺利推进 AI 平台化转型，联邦业务 ARR 增至 $50M+，Cisco/Splunk 整合未能撼动其核心场景，NRR 维持在 130% 以上。2027 至 2028
              年间获 Cisco、Microsoft 或 Google 战略收购，对应 14–18x 远期 ARR，收购总对价 $7–10B。以 $3.5B 入场估值测算，对应毛回报倍数为 2.0–2.9x。


              基准情景（概率 50%）：Cribl 在 2027 年达成 $450–500M ARR，NRR 回落至 120–125%，2028 至 2029 年以 10–12x ARR 推动 IPO 或完成 Series F
              融资，整体估值 $5–6B。对应毛回报倍数 1.4–1.7x。若 Series F 稀释 10–15%，投资者净回报倍数降至约 1.2–1.5x。


              悲观情景（概率 20%）：Cisco/Splunk 在 2026 年 Q4 前推出原生流水线，NRR 跌至 105–110%，新客获取放缓。按 6–8x ARR 开展 Series F 轮，对应估值
              $1.8–2.4B。以 $3.5B 入场测算，对应毛回报倍数 0.5–0.7x，面临部分本金亏损。


              概率加权期望回报：(0.3 x 2.5) + (0.5 x 1.5) + (0.2 x 0.6) = 1.62x 毛回报。该数字超过了成长期风投通常要求的 1.5x
              最低风险调整门槛。SiliconANGLE、Yahoo Finance 与 Sacra 的数据证实了支撑上述模型的上一轮估值及 ARR 增长轨迹。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
      - number: '8.4'
        title: 最终投资建议与尽调核查清单
        blocks:
          - type: paragraph
            body: >
              投资建议：附条件参与。Cribl 符合核心投资标准：ARR 增速亮眼、NRR 坚挺、客户群体多元、产品路线图可信，且管理团队具备将业务推至 $300M+ ARR
              的交付战绩。对比二级市场高增长基础设施软件的估值倍数，$3.5B 估值具备合理支撑。


              入场先决条件：（1）获得季度 ARR、NRR 及流失率的知情权；（2）争取董事会观察员席位或保护性条款；（3）签署针对 CEO Clint Sharp 与 CTO Dritan Bitincka
              的关键人条款；（4）落实后续估值低于 $3.5B 轮次的反稀释保护；（5）核实 FedRAMP ATO 持续合规状态，确认联邦 ARR 占总收入的比重。


              签约前核心尽调要求：经审计或管理层账面的损益表（含毛利率与烧钱速度）；按入群年份细分的前 20 大客户 NRR；联邦业务 ARR 占比；明确 CRO/销售 VP 人选与任期的组织架构图；完整股权结构表及
              Series E 条款清单。Gartner SIEM 魔力象限认可与 SEC Form D 申报确认公司不存在监管阻碍。PR Newswire 官方公告与 SiliconANGLE
              财经报道共同佐证了公司口径下的各项关键财务主张。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.5'
        title: 逻辑证伪监控与 KPI 看板
        blocks:
          - type: paragraph
            body: >
              投后监控需要建立一套结构化的可观测 KPI 体系，依托公开数据、分析师报告及投资人知情权持续追踪。核心指标包括：ARR 同比增速（2026 年目标 >= 50%）、NRR（目标 >=
              125%）、新客拓展（目标每季度新增 >= 100 家大客户）、联邦 ARR 占比（2027 年前目标 >= 15%），以及 AI 产品收入贡献（2027 年前目标 > 5%）。


              逻辑证伪监控规则：NRR 连续两个季度低于 100%，触发即刻出售信号；CEO 离职且继任者未定，触发暂缓增持信号；Cisco/Splunk 一旦官宣原生流水线，立即列入重点观察清单，启动客户背调以量化 TAM
              受损程度；Series F 估值若低于 $3.5B，将激活反稀释条款并重估投资逻辑。


              跟踪 Cribl 向 AI 平台转型，重点观察 ML/AI 研发人数、Cribl Search 渗透率与 AI 产品收入贡献。SiliconANGLE 与 TechCrunch
              可用作跟踪产品发布节奏的前哨；Sacra 的一级市场季度追踪报告是把握其财务表现最可靠的间接依据；Gartner Peer Insights 评分若能持续稳在 4.0/5.0
              以上，则是企业级市场持续认可的关键信号。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
