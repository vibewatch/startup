            body: >
              在 $300M ARR 规模下，超过 50% 的 Fortune 500 企业采纳 Cribl
              是一项卓越成就：这印证了长周期的企业级合同、跨多环境的深度部署，以及同一账户内的持续复购行为。达到这一渗透率水平的企业级 SaaS 公司通常录得 120%+ 的
              NRR，按数据量计费的模式在主动产品交叉销售之外，强力驱动着有机扩张。
