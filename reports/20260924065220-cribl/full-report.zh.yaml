      - number: '1.3'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >
              Cribl 经多轮融资集结了实力较强的投资方，已披露股权融资总额约 $864M 或更多，反映出头部风投机构看好可观测性管道市场。最近一笔经确认的重大融资为 Google Ventures（GV）领投的 $319M
              Series E 轮，据 Forbes 报道，该轮融资对公司的估值为 $3.5B，且处于超额认购状态。


              公司早期投资方囊括 Greylock Partners、Redpoint Ventures、IVP（Insight Venture Partners）、CRV（Charles River Ventures）和
              Sequoia Capital，最新一轮则由 Google Ventures 领投。IVP 和 Greylock 的投资组合页面均确认其为在投项目；GV 的投资列表也证实 Cribl
              属于当前投资标的；Sequoia 投资组合页面显示双方合作始于 2020 年，当时 Sequoia 参与了 Series B 轮融资。


              Series E 轮 $3.5B 的估值约对应 11.7x 预期 ARR（对照 2026 年 2 月公布的 $300M ARR），这一高倍数虽然与高增长企业级 SaaS 厂商匹配，但较 2024
              年公开市场同业对标明显偏高。此前轮次包括 2021 年估值 $1.5B 的 $200M Series C 轮，以及 2022 年估值 $3.5B 的 $150M Series D 轮。2024 年 6 月，公司以
              $3.0B 估值完成了一笔 $150M 的战略成长轮融资，估值较 2022 年 Series D 峰值有所回落。


              投资方未披露任何老股交易或优先清算权条款，Cribl 亦未提交 S-1 招股说明书。详细财务数据均未对外披露。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
