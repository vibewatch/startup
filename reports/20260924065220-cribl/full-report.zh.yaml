chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与概况
        blocks:
          - type: paragraph
            body: >
              Cribl, Inc. 是一家总部位于旧金山的企业软件公司，2018 年由三位前 Splunk 工程师创立：Clint Sharp（CEO）、Dritan Bitincka（联合创始人）和 Ledion
              Bitincka（联合创始人）。公司总部位于加利福尼亚州旧金山第四街 22 号 1300 室（邮编 94103），并在得克萨斯州奥斯汀设有运营机构。Cribl 将自身定位为「遥测 AI 平台」，支持企业针对人工与
              AI 驱动的各类场景，管理并分析机器生成的可观测性数据——包括日志、指标、调用链和配置数据。


              公司核心价值主张聚焦于中立的遥测管道基础设施：Cribl 不把客户锁定在单一分析平台上，而是支持企业从任意源端采集数据、高效处理，并将其路由至任意目标端。在企业预算受限的背景下，IT 与安全遥测数据正以约 30%
              的复合年均增长率（CAGR）爆发式增长，Cribl 的这套路径直接化解了由此产生的成本与复杂度难题。


              Cribl 目前为非上市公司，截至本报告成文之日尚未启动 IPO。公司在 SEC EDGAR 的登记信息证实其主要办公地位于上述旧金山地址。截至 2026 年 9 月，LinkedIn 数据显示其员工数为
              1,203 人，全球雇员约 1,200 人，但公司官方口径的员工数可能存在差异。Cribl 的产品支持云端、本地部署和混合部署，覆盖从腰部客户到大型企业及政府部门的多元客户群。
            claimRefs:
