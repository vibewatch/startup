      - number: '6.2'
        title: 客户采纳与增长轨迹
        blocks:
          - type: paragraph
            body: >
              Cribl 的各项增长指标显示，其维持着与同阶段顶级企业级 SaaS 公司相称的超高增速。截至 2026 年初，公司客户数已从 2020 年 B 轮时估计的数百家增至 9,000+
              家机构——客户复合年均增长率跑赢大多数基础设施软件同行。2026 年 2 月宣布的 $300M+ ARR 里程碑（经由 PR Newswire 与 Cribl
              博客的官方新闻稿公布），代表多年来复合年均收入增速保持在 50% 以上，契合支撑 $3.5B 估值所需的增长轨迹。


              据 Cribl 自身的产品概览并在 2026 年 2 月 ARR 新闻稿中确认，其在 Fortune 500 中的渗透率已超过 50%。此项指标是极强的采纳信号：Fortune 500
              的高渗透率通常意味着长期企业合同、经受住检验的安全架构以及广阔的增购空间。MSSP Alert 对 E 轮融资的报道指出，Cribl 的平台已广泛应用于金融服务与科技板块。


              产品采纳的广度已超出最初的 Cribl Stream 管道。Cribl Edge 的部署标志着单端点或单数据中心覆盖面的扩大，推高了每家客户的计费节点数量。约于 2023–2024 年推出的 Cribl Lake
              与 Cribl Search，凭借存储与联合查询能力推高平均合同价值，降低了对外部 SIEM 和数据湖厂商的依赖。


              AWS Marketplace 上架为中型市场与云原生客户开辟了低摩擦采购渠道，将可服务市场延伸至直销团队之外。cribl.io/partners/
              记录的伙伴生态包含集成伙伴（Splunk、AWS、Azure、Google Cloud）与交付伙伴（MSSP 与系统集成商），进一步放大了地域覆盖范围。


              截至本报告发布之日，未发现任何公开披露的客户流失事件、重大合同丢失或负面续约公告，印证了早期强劲的留存表现。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
