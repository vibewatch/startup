      - CI003
      - CI004
  - id: FE001
    title: Cribl 产品架构图
    type: flow
    summary: |
      数据从源端经由 Cribl Edge（采集）、Cribl Stream（处理）流向最终目的地（Splunk、Datadog、Elastic、S3/Lake、Search），展现 Cribl 平台的分层架构。
    data:
      nodes:
        - id: sources
          label: 数据源
          description: 生成日志、指标、链路追踪的服务器、容器、云服务、网络设备及各类应用
        - id: edge
          label: Cribl Edge（Agent 层）
          description: 在源端采集数据的轻量级 Agent；支持本地过滤与预处理，由中心统一部署管理
        - id: stream
          label: Cribl Stream（处理引擎）
          description: 核心流处理器：实时路由、过滤、转换、丰富并聚合遥测数据
        - id: lake
          label: Cribl Lake（对象存储）
          description: 在客户自有云存储（S3/Blob/GCS）上以 Parquet 格式长期保留遥测数据
        - id: search
          label: Cribl Search（查询引擎）
          description: 无需搬运数据即可跨 Lake 与 Stream 执行联合查询；支持 SQL 与 SPL
        - id: analytics
          label: 分析目标端
          description: Splunk、Datadog、Elastic、Chronicle、Microsoft Sentinel、Grafana 及 300+ 款其他工具
        - id: control
          label: Cribl 控制平面
          description: 统一管理 UI 与 API，负责流水线配置、集群管理以及平台自身的可观测性
      edges:
        - from: sources
          to: edge
          label: 原始遥测数据
        - from: edge
          to: stream
          label: 预处理事件
        - from: sources
          to: stream
          label: 直接推送（无需 Edge）
        - from: stream
          to: lake
          label: 存储原始 / 处理后数据
        - from: stream
          to: analytics
          label: 路由至目标端
        - from: lake
          to: search
          label: 静态数据查询
        - from: stream
          to: search
          label: 流中数据查询
        - from: control
          to: edge
          label: 配置与编排
        - from: control
          to: stream
          label: 流水线配置
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示不同客户群体在全生命周期内如何发现、采纳、扩展并续约 Cribl。
    data:
      nodes:
        - id: awareness
          label: 认知建立
          description: 来自 Splunk 生态转介、AWS Marketplace、行业大会（KubeCon、RSA）以及同行推荐
        - id: evaluation
          label: 评估 / POC
          description: 30–90 天概念验证；验证 SIEM 成本节省或可观测性路由效果；通常借助免费层自助体验
        - id: purchase
          label: 商务采购
          description: 财富 500 强走大企业直销；中端市场借助 AWS Marketplace 自助采购；渠道则由 MSSP 打包交付
        - id: deployment
          label: 初次部署
          description: 部署 Cribl Stream 路由安全日志；部署 Edge Agent 采集终端遥测；通常 30–60 天见效
        - id: expansion
          label: 规模扩张
          description: 交叉销售 Edge、Lake、Search；接入更多数据源；拓展分支区域或业务线；用量拉动 ARR 增长
        - id: renewal
          label: 续约与推荐
          description: 按年续约并提升用量额度；参与标杆客户推荐计划；在 GitHub 上贡献社区
        - id: churn-risk
          label: 流失风险信号
          description: 用量激增带来的价格冲击；中端市场转向 OTel Collector；Cisco/Splunk 原生捆绑的威胁
