  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险环境
        blocks:
          - type: paragraph
            body: >
              Cribl 的业务定位为企业级数据管道软件厂商。客户使用 Cribl 软件路由自身遥测数据，因此客户是负责 GDPR 和 CCPA 数据主体权利合规的数据控制者（data
              controller）。与代表客户存储或处理个人数据的 SaaS 公司相比，这种架构设计大幅降低了 Cribl 的直接监管风险。


              2026 年 3 月发布的 Cribl Guard 在管道中提供后台 PII 识别与脱敏，作为防范非意图 PII 路由的技术缓释措施。Cribl.Cloud 于 2026 年 1 月面向美国联邦民用机构获得
              FedRAMP 运营授权（ATO），证实其符合 NIST SP 800-53 控制项要求。CISA 云安全指南为联邦环境下的工具设定了基线，Cribl 的 ATO 认证达到或超出了 CISA 推荐的控制要求。


              2025–2026 年活跃的联邦政府支出效率审查可能压缩机构的 IT 采购预算，放缓 Cribl 联邦细分客群的增速。《联邦公报》（Federal Register）确认了持续适用于 FedRAMP 厂商的
              OMB 云软件采购指引。截至 2026 年 9 月，在 SEC EDGAR 检索或公开法律记录中，未发现针对 Cribl 的未决诉讼、EEOC 投诉或监管执法行动。


              出口管制条例（EAR）适用于 Cribl 的加密与网络安全软件；公开记录中未见任何违规或合规问题。源自 Apache 2.0 协议 OTel 库的开源许可证义务属于行业常规风险；Cribl 尚未公开确认正式的
              SBOM 或 CLA 合规流程。
            claimRefs:
