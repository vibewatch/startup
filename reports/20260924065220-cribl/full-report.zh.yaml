      - number: '2.2'
        title: 市场增长驱动力与阻力
        blocks:
          - type: paragraph
            body: >-
              三股叠加的结构性力量正驱动企业级遥测管道基础设施的需求加速释放。首先，多云采用率持续提升，78% 的企业在两个及以上的云端运行工作负载，导致数据采集面高度割裂，传统 SIEM
              原生转发器难以有效应对。其次，AI/ML 工作负载爆发导致遥测数据量增速远超存储成本下降幅度，给日志摄入预算带来沉重压力，激发出对过滤与路由解决方案的强烈需求。再次，2022
              年以来针对网络安全数据保留与披露的监管要求显著趋严：SEC 网络安全披露新规、CMMC 2.0 和 PCI-DSS 4.0
              共同扩大了必须维护可审计、合规日志管道的企业范围。在顺风之外，市场也面临两大显著阻力：传统 SIEM 厂商正在压低每 GB
              定价以削弱客户的迁移意愿，超大规模云厂商亦在强化原生可观测性能力，可能降低客户对独立路由层的需求。Cribl「先切入、再扩张」的定价模式提供低于 1 TB/天的免费档位，
              无需专项资本开支审批也已证明能帮助客户启动部署；但要扩展至全平台的大额合同（ACV），仍需重新谈预算。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
