- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Current public status
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - ARR and recurring revenue mix
    - Not disclosed
    - Cannot tell how much revenue is truly software-recurring
    - Request monthly recurring revenue bridge by product and customer
  - - Gross margin and COGS split
    - Not disclosed
    - Cannot decide whether PhysicsX scales like software or services
    - Request management P&L with compute, labor, and services COGS
  - - Realized pricing and discounting
    - Not disclosed
    - Public packaging clues do not show ACV discipline or payback
    - Review three recent contracts across pilot, expansion, and strategic accounts
  - - Cash, burn, and runway
    - Not disclosed
    - Capital adequacy after Series C remains unproven
    - Review latest balance sheet, 13-week cash flow, and FY2026 budget
  - - NRR, GRR, churn, and concentration
    - Not disclosed
    - Growth quality cannot be separated from project wins
    - Request cohort analysis and top-customer schedule
  - - Debt-like compute or reserved-capacity obligations
    - None disclosed publicly
    - Potential off-balance-sheet commitments could compress flexibility
    - Review cloud reservation, GPU, and sovereign-cloud capacity agreements
  notes: These are the explicit blockers to underwriting revenue quality, margin path, and funding dependency from open-source evidence alone.
