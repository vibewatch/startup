  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: A dated revenue bridge showing subscription/platform revenue, services revenue, and any partner-hosted deployment revenue.
    whyItMatters: Without a stream-level bridge, revenue quality and the services-versus-software mix cannot be underwritten.
    diligencePath: Request a board or lender reporting pack with monthly revenue by stream, customer segment, and recognition policy.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross margin, hosting/compute COGS, and delivery labor COGS split by product or engagement type.
    whyItMatters: Valuation and capital-adequacy judgments depend on whether PhysicsX behaves like scalable software or labor-heavy technical services.
    diligencePath: Request management accounts with gross margin by stream, time-sheet allocation for delivery teams, and cloud/GPU cost detail.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Sample order forms or MSAs showing contract duration, minimum commitments, discounting, and how free tools convert into paid deployments.
    whyItMatters: List-pricing opacity makes it impossible to model realized ACV, discount discipline, or recognition timing.
    diligencePath: Ask for three recent redacted customer contracts spanning pilot, expansion, and strategic-account deployments.
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Post-Series-C cash balance, monthly burn, runway, and any covenant or financing-planning assumptions.
    whyItMatters: Capital adequacy cannot be assessed from round sizes alone when hiring and compute intensity are rising at the same time.
    diligencePath: Request latest balance sheet, 13-week cash flow, FY2026 budget, and hiring plan tied to booked backlog.
    relatedQuestionRefs:
    - QI022
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention-concentration
    missingEvidence: Customer concentration, renewal cohorts, NRR/GRR, and expansion history by vertical.
    whyItMatters: A few strategic industrial accounts can make growth look strong while hiding concentration and renewal risk.
    diligencePath: Request the top-10 customer schedule, cohort waterfalls, churn log, and pipeline split between new logos and expansions.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: security-pricing-obligations
    missingEvidence: Compute reservation terms, debt-like GPU commitments, and share-price / preference details in financing documents.
    whyItMatters: Sovereign-cloud and frontier-model ambitions may create off-balance-sheet commitments or investor rights not visible in public narratives.
    diligencePath: Review signed cloud or GPU reservation agreements plus the latest cap table, share allotment PDFs, and investor-rights summaries.
    relatedQuestionRefs:
    - QI024
    - QI029
    relatedTableRefs:
    - TI004
