  - - Sovereign / partner-cloud deployments
    - PhysicsX application layer on partner compute infrastructure
    - Likely platform fee plus hosted deployment economics
    - Deployment proof exists with Deutsche Telekom and NVIDIA
    - Strategic distribution, but cloud economics unknown
    - Request partner billing construct and margin share
  - - Product-led top-of-funnel
    - Ai.rplane barebones public tool
    - Free access
    - Only public free offer found
    - Lead generation, not material revenue
    - Request conversion funnel from free tools to paid accounts
  notes: Rows distinguish what is definitely public from what is inferred. PhysicsX does not disclose stream-level revenue mix, so revenue-quality conclusions remain directional.
