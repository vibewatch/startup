  - - Forward-deployed engineering
    - Embedded customer-program delivery and workflow customization
    - Likely scoped services or bundled implementation
    - Officially disclosed as embedded motion
    - Improves win rate but can dilute software margins
    - Request delivery attach rate and implementation margin
  - - Custom model development / fine-tuning
    - Tailored model architectures, simulation pipelines, optimization loops
    - Project or expansion statement of work
    - Officially disclosed activity, pricing private
    - Higher ACV, but repeatability unclear
