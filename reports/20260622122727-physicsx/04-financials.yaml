- id: revenue-quality
  title: Revenue Quality, Demand Signals, and Public Traction
  body: Public traction is stronger than for most private industrial-AI startups, but it is still incomplete. Official Series C disclosures say recognized revenue doubled year over year, booked revenue tripled, customer count more than doubled, and headcount surpassed 300. External reporting adds that 2026 revenue should be close to $50 million, with a goal to more than double in 2027, and that the company has roughly a six-month backlog of customer demand. Named customers include Applied Materials, Siemens, and Stellantis, while sovereign-cloud deployment evidence with Deutsche Telekom and NVIDIA supports the claim that PhysicsX is landing real industrial workloads rather than running only pilot projects. The central revenue-quality nuance is that bookings are growing faster than recognized revenue. That can be bullish if implementation becomes more repeatable, but it can also mean delivery capacity and customer-specific work remain the bottleneck.
  claimRefs:
