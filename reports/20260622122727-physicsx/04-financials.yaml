- id: cost-structure
  title: Cost Structure and Gross-Margin Drivers
  body: 'PhysicsX does not look like a pure software company on cost structure. Official product and partner materials show a stack that depends on GPU-accelerated model training and inference, heavy simulation-data generation, customer-specific workflow integration, and a delivery team that works inside customer programs. The Deutsche Telekom and NVIDIA sovereign-cloud partnership shows the scale of infrastructure the company wants to plug into, with more than 1,000 DGX B200 systems and up to 10,000 Blackwell GPUs in the underlying cloud. The automotive case study further highlights the likely pre-deployment cost burden: more than 20,000 CFD simulations were used to generate training data from more than 250 baseline designs. At the same time, PhysicsX’s platform FAQ emphasizes uncertainty quantification, active learning, and customer-specific data isolation, all of which imply continuing validation and maintenance effort after deployment. No public source reviewed discloses gross margin
    or the split between reusable software gross profit and forward-deployed delivery labor.'
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
