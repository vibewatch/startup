- id: capital-adequacy
  title: Capital Adequacy and Financing Dependency
  body: 'PhysicsX is better funded than most peers, but its capital needs are also larger than a simple enterprise-software story would imply. Public sources show a $135 million initial Series B in June 2025, a November 2025 extension that took the Series B total above $155 million at nearly a $1 billion valuation, and a $300 million Series C at approximately $2.4 billion in June 2026. Secondary sources place total funding at roughly $487 million to $500 million. Companies House records add evidence of multiple capital-table updates in 2025 and 2026, including group accounts through 2024 and fresh SH01 allotment activity in February and April 2026. The Series C use of funds is explicit: expand globally, deepen US presence, open Singapore, build platform capabilities, and continue frontier research into larger physics models. What remains missing is the actual cash balance, burn, runway, or any debt-like compute commitment. The financing dependency is therefore operational rather than existential:
    if backlog, hiring, and compute intensity keep rising faster than repeatable software economics, the next round could be pulled forward despite strong demand.'
