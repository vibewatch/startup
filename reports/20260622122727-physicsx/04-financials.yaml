- id: financial-verdict
  title: Financial Verdict and Diligence Blockers
  body: 'The financial picture is good enough to support serious diligence, but not good enough to underwrite margins or capital efficiency from public evidence alone. Growth, customer quality, and fundraising credibility are all real: named industrial customers exist, sovereign-cloud partners are public, and management has disclosed uncommon traction metrics for a private company. The weakness is that virtually every underwriting variable that separates a scalable software platform from a technical-services organization remains private. No public source reviewed discloses ARR, recurring-versus-services mix, gross margin, CAC, payback, NRR, cash, or runway. That is why the adverse case matters. New Market Pitch argues the latest valuation implies roughly 48x current-year revenue and that the core unresolved question is whether PhysicsX is becoming a repeatable software layer or staying a services-heavy engineering shop. The right diligence path is therefore straightforward: verify realized
    pricing, revenue mix, gross margin, cohort retention, and post-Series-C cash planning before accepting the premium valuation at face value.'
  claimRefs:
  - CI031
  - CI032
  - CI041
  - CI042
  - CI043
