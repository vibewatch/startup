company:
  name: PhysicsX
chapter:
  number: 4
  title: Financials
  summary: PhysicsX shows credible commercial momentum — official disclosures say recognized revenue doubled, booked revenue tripled, and customer count more than doubled over the past year — but the public record still describes a hybrid software-plus-forward-deployed-services model with no disclosed ARR, gross margin, burn, or runway. The $300 million Series C materially improves capital adequacy, yet six-month backlog, heavy hiring, and compute-intensive product ambitions mean the main underwriting question is not demand but whether delivery and margin can scale faster than capital needs.
sections:
- id: revenue-model
  title: Revenue Streams, Pricing Model, and GTM Motion
  body: PhysicsX’s public materials point to a negotiated enterprise model rather than a transparent SaaS list-price business. The company sells an AI-native engineering platform spanning simulation management, model development, and deployment into engineering workflows, but it also says forward-deployed engineers embed directly into live customer programs and tailor model architectures, data pipelines, and optimization loops to customer context. That combination strongly suggests revenue comes from a hybrid of platform subscriptions or licenses, implementation and model-development work, and expansion into broader workflow ownership once deployed. The one public product-led pricing clue is Ai.rplane, a free barebones version of the LGM-Aero tool, which looks more like a top-of-funnel acquisition surface than a meaningful revenue line. Because no official rate card, minimum commitment, or contract-duration detail is public, pricing discipline and revenue-recognition timing remain diligence
    items rather than underwritten facts.
  claimRefs:
  - CI001
  - CI003
  - CI007
  - CI008
  - CI010
  - CI011
  - CI025
  tableRefs:
  - TI001
  - TI002
  figureRefs:
