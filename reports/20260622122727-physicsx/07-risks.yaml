- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Model verification / liability
    - Validated-error discipline in production use cases
    - A safety-, quality-, or uptime-critical deployment shows a material miss outside approved bounds
    - Pause underwriting until validation governance, liability allocation, and fallback simulation controls
      are verified.
  - - Cloud / GPU dependency
    - Partner availability and onboarding pace
    - CoreWeave, Azure, or Deutsche Telekom delays materially slow training, deployment, or customer onboarding
    - Re-rate the moat downward because compute leverage is proving exogenous rather than proprietary.
  - - Privacy / security / trust
    - Public and customer assurance surface
    - A security incident occurs or diligence reveals weak DPA, subprocessors, or incident governance
    - Assume slower procurement and lower expansion into strategic or regulated sectors.
  - - Commercialization quality
    - Pilot-to-production and renewal behavior
    - Pilots stay bespoke, conversion lags, or software usage does not expand beyond embedded projects
    - Mark the business as services-heavy and challenge the valuation multiple.
  - - Fundraising / valuation discipline
    - Capital efficiency and economics transparency
    - Burn, gross margin, runway, or concentration data disappoint relative to a $2.4B price point
    - Shift from growth-underwrite to proof-of-economics diligence before conviction increases.
  - - Bench scale / leadership execution
    - Retention and org leverage
    - Key technical or operating leaders depart during global expansion or hiring lead times lengthen
      materially
    - Treat execution risk as compounding with commercialization risk rather than as a separate people
      issue.
  notes: The table focuses on thesis-break conditions that can be monitored during diligence and the next
    refresh rather than on generic watch items.
