  evidenceGaps:
  - type: missing-source
    severity: material
    topic: litigation-visibility
    missingEvidence: Independent UK and US docket evidence, claims history, and outside-counsel confirmation
      on whether PhysicsX or its products have been involved in litigation, arbitration, or regulatory
      inquiry.
    whyItMatters: No retained public lawsuit or enforcement action was found, but absence of public hits
      is not proof of absence for a company selling into high-stakes engineering workflows.
    diligencePath: 'Re-run counsel-led docket review and product-liability checks using the exact 2026
      discovery path already logged here: PhysicsX litigation 2026; PhysicsX lawsuit 2026; PhysicsX incident
      outage 2026; site:courtlistener.com PhysicsX; plus Companies House and official-site review.'
    relatedQuestionRefs:
    - QR003
  - type: missing-source
    severity: material
    topic: privacy-legal-pack
    missingEvidence: Current public or diligence-room enterprise terms, DPA, subprocessors list, retention
      schedule, and customer-facing security commitments.
    whyItMatters: The website exposes a privacy notice and ISO certification, but that is thinner than
      what regulated or mission-critical buyers usually require to sign or expand.
    diligencePath: Request the current MSA, DPA, security annex, incident-notification language, subprocessors,
      and whether the privacy notice is being refreshed after the address and governance updates.
    relatedQuestionRefs:
    - QR004
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: incident-transparency
    missingEvidence: Public or private incident history, uptime metrics, product SLA terms, and evidence
      of how validation failures are escalated in production.
    whyItMatters: Without a resilience trail, investors cannot distinguish between genuinely robust operations
      and operations that are simply not publicly described.
    diligencePath: Ask for the last 12-24 months of incidents, SLA metrics, support escalation policies,
      model rollback controls, and customer-facing uptime obligations.
    relatedQuestionRefs:
    - QR010
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: financial-opacity
    missingEvidence: Gross margin, burn, runway, renewal quality, customer concentration, and pilot-to-production
      conversion metrics.
    whyItMatters: These are the core variables that determine whether the current valuation is justified
      by scalable software economics rather than by high-touch services and future optionality.
    diligencePath: Obtain board or investor-update metrics, cohort renewal data, revenue mix by software
      vs services, and top-customer concentration before underwriting upside.
    relatedQuestionRefs:
    - QR021
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: material
    topic: export-control-exposure
    missingEvidence: Country exposure, restricted-party screening workflow, export-license history, and
      whether any deployments touch controlled technical data or sanctioned jurisdictions.
    whyItMatters: PhysicsX explicitly targets strategic sectors and sovereign-cloud deployments where
      export and sanctions compliance can become a sales blocker or contractual risk.
    diligencePath: Review geo-revenue mix, denied-party checks, export-jurisdiction opinions, and any
      customer or partner restrictions tied to aerospace, semiconductor, or defense work.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR001
