  topStrengths:
  - PhysicsX is targeting a real industrial bottleneck by using Large Physics Models and workflow software to compress simulation-heavy engineering cycles.
  - The company has unusually strong strategic validation for its stage, including Temasek, Siemens, NVIDIA, Applied Materials, and other industrial or infrastructure-linked backers and partners.
  - Public customer-workload evidence from Siemens, Microsoft, and GB1 suggests the platform is being used on consequential engineering problems rather than only in sandbox pilots.
  topRisks:
  - Public disclosure is still too thin on absolute revenue, gross margin, retention, services mix, and cap-table economics to underwrite a $2.4 billion valuation with conviction.
  - Customer concentration could be material because only three publicly named paying customers were independently identified while backlog and revenue disclosures remain sparse.
  - Technical repeatability remains a live risk because PhysicsX's own materials acknowledge that some neural-operator approaches struggle on shocks, irregular geometries, strict boundary conditions, and other hard physics workloads.
  unresolvedGaps:
  - Absolute 2025-2026 recognized revenue, ARR, gross margin, and software-versus-services mix by customer cohort or vertical.
  - Retention, expansion, and concentration data, including top-customer share, contract length, and proof that deployments expand across programs or sites.
  - Cap-table and preference details for the 2026 Series C, including liquidation preferences, any secondary sales, and the evidence needed to reconcile price with repeatable software economics.
