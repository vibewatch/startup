companyProfile:
  summary: 'PhysicsX is a London-based industrial AI company building an AI-native engineering platform for physical-world design workflows. Its public positioning centers on Large Physics Models, simulation-data orchestration, and engineer-facing applications that help industrial teams replace slower solver-bound iterations with faster AI-assisted analysis. By mid-2026 the company had progressed from a 2019 incorporation and 2020 launch into a Temasek-led $300 million Series C, while public customer and partner evidence points to traction in semiconductors, data-center power systems, advanced automotive, and high-performance engineering programs. The core diligence constraint is still disclosure quality: outsiders can verify the financing event and strategic relevance, but not the underlying software economics with enough precision to fully justify the new late-stage price from public evidence alone.'
