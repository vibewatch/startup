    {
      "id": "kill-criteria",
      "title": "What would break the thesis",
      "body": "A good late-stage valuation chapter needs explicit kill criteria, because the mistake here would be confusing a strong story with a strong entry point. The first thesis-breaker would be proof that deployments are still largely projectized and not converting into repeatable, expanding software revenue across sites, plants, or product lines. The second would be technical evidence that PhysicsX's best outcomes are limited to smooth, highly structured problems while important customer workloads still need specialist simulation teams and slow human intervention. The third would be a public-market reset in engineering software and EDA without offsetting disclosure from PhysicsX, because late private prices rarely stay detached from public comp reality forever. The fourth would be a cap-table or preference stack that leaves little upside for new money. Those are not theoretical concerns; they are the practical reasons the current conclusion is to keep the company live in diligence, but keep the price on a short leash.",
