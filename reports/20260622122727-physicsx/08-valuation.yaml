  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "PhysicsX's $300 million Series C at an approximately $2.4 billion valuation is well-corroborated as a financing event, but public evidence is still too thin on absolute revenue, margin, retention, services mix, and preference overhang to underwrite that price as a buy. The company shows strong industrial relevance, credible partners, and fast claimed growth, yet the round still looks stretched versus 2025-2026 public industrial-software trading bands unless private diligence reveals software-like recurring revenue already above roughly $100 million."
  },
  "sections": [
    {
      "id": "pricing-context",
      "title": "Financing context and the proof gap",
      "body": "PhysicsX has clearly crossed an important financing milestone: its own 8 June 2026 announcement and Pulse 2.0 both report an oversubscribed $300 million Series C at an approximately $2.4 billion valuation led by Temasek, with M&G Investments and Intrepid Growth Partners joining an investor base that already included Applied Materials, Atomico, NVIDIA, Siemens, and others. That follows a 2025 Series B extension that pushed valuation toward $1 billion, so the headline mark has stepped up by about 2.4x in roughly a year. The problem is not whether the financing happened; it did. The problem is whether outside investors can independently support the new price. Public sources provide relative growth statements, more than 300 employees, and evidence of fresh 2026 share allotments, but they do not disclose the absolute revenue base, software-versus-services mix, gross margin, retention, or preference stack that would determine whether this is premium-but-fair or simply early. At today's mark, the burden of proof shifts from visionary narrative to hard economic evidence.",
