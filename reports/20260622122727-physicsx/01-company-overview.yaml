- id: milestones-partnerships-and-open-gaps
  title: Milestones, Partnerships, and Open Gaps
  body: |
    The 2026 milestone pattern suggests PhysicsX is trying to become infrastructure, not just an
    interesting engineering application vendor. In one week of March 2026 it announced a
    CoreWeave cloud partnership, a GB1 America’s Cup deployment, an NVIDIA standards initiative,
    and a Siemens collaboration around data-center power infrastructure. Together those milestones
    imply three commercialization paths running in parallel: strategic compute and distribution,
    brand-building through elite performance engineering, and direct industrial deployment into AI
    supply-chain bottlenecks. The June 2026 Series C then funded the next leg of that expansion,
    including Singapore and continued US scaling.

    The strongest adverse signal found in the retained evidence is not legal or regulatory; it is
    valuation discipline. NewMarketPitch argues the $2.4 billion price is only defendable if
    PhysicsX converts backlog into much larger realized revenue and proves a reusable platform
    model rather than a services-heavy engineering practice. That critique aligns with a real
    public-data gap: bookings are growing faster than recognized revenue, and Corbo has described
    the company as supply-side constrained. Additional diligence should therefore focus on the full
    control map, absolute 2025/2026 financials, any secondaries or debt, and the repeatability of
    deployments across customers.
  claimRefs:
