company:
  name: PhysicsX
chapter:
  number: 1
  title: Company Overview
  summary: |
    PhysicsX is a London-headquartered physics-AI startup incorporated in 2019, launched in 2020,
    and publicly emerged from stealth in late 2023 to sell an AI-native engineering platform for
    industrial hardware development. By June 2026 it had raised a $300 million Temasek-led Series C
    at an approximately $2.4 billion valuation after earlier $32 million Series A and $135 million
    Series B rounds, with public materials citing 300+ employees, doubled recognized revenue,
    tripled booked revenue, and a customer base that more than doubled year over year.

    Founder-market fit is unusually strong because Robin Tuluie and Jacomo Corbo both come from
    Formula 1 and advanced industrial AI, but diligence still needs private evidence on absolute
    revenue, cap-table control, any secondaries or debt, and whether PhysicsX is scaling as a
    reusable software platform rather than a services-heavy engineering shop.
sections:
- id: identity-product-footprint
  title: Identity, Product, and Footprint
  body: |
    PhysicsX presents itself as a UK-founded physics-AI company building an AI-native engineering
    platform for industrial organizations. The legal entity was incorporated on 1 August 2019,
    initially as Motodynamics Ltd, while later company materials say PhysicsX launched in 2020.
    By June 2026, public company pages and registry records place the headquarters in London,
    with the registered office at Victoria House, 1 Leonard Circus, and operating offices in
    London and New York. The June 2026 Series C press release also says the company is expanding
    its presence in the Bay Area and Singapore, which matters because the round is explicitly tied
    to global scale-up rather than a narrow UK footprint.

    On product, the current homepage and platform materials describe a unified stack spanning
    simulation, physics AI, data, and engineering applications across the product lifecycle. The
    disclosed sector focus is broad but coherent: aerospace and defense, semiconductors,
    materials, automotive, and energy. The company is therefore selling a horizontal engineering
    software layer into hard-tech verticals, not a single-point design tool. Public materials are
    strong on workflow positioning and integration breadth, but they still stop short of giving a
    precise 2026 revenue base, ARR, or customer concentration profile.
  claimRefs:
