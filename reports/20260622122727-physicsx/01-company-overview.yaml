- id: funding-investors-and-scale
  title: Funding, Investors, and Scale
  body: |
    PhysicsX has moved through three publicly disclosed equity rounds at rapidly increasing scale.
    It emerged from stealth with a $32 million Series A in November 2023 led by General Catalyst,
    then announced a $135 million Series B on 22 June 2025 led by Atomico, and then a $300
    million Series C on 8 June 2026 led by Temasek at an approximately $2.4 billion valuation.
    Summing the three disclosed round sizes yields at least $467 million of equity funding, while
    some 2026 news coverage rounds the total to roughly $500 million. The 2026 investor roster is
    strategically notable because it blends sovereign capital, industrial incumbents, and AI
    infrastructure exposure through names such as Siemens, NVIDIA, Applied Materials, and NGP.

    The latest round also came with unusually strong but still incomplete scale disclosures.
    Official materials say recognized revenue doubled year over year, booked revenue tripled, the
    customer base more than doubled, and headcount rose past 300 after doubling in twelve months.
    Independent outlets peg the employee base closer to 350 by June 2026 and tie demand to
    semiconductors, data-center power and cooling, and broader industrial infrastructure. The
    growth message is therefore compelling, but the absence of an absolute revenue figure, ARR,
    gross margin, or customer concentration disclosure means investors still need private evidence
    before underwriting the valuation on software-style economics alone.
