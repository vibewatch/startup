  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Full cap table, any secondaries, SAFEs, warrants, debt facilities, or structured terms across the Series B and C are not public in the retained evidence set.
    whyItMatters: Without the detailed capital stack, it is hard to judge control, dilution, liquidation preferences, and whether the headline valuation overstates common-equity economics.
    diligencePath: Request the latest cap table, financing docs, board consents, and any debt or secondary schedules directly from management and counsel.
    relatedQuestionRefs:
    - QO014
    - QO026
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Absolute 2025 and 2026 revenue, ARR, gross margin, net retention, customer concentration, and services-versus-software mix were not publicly disclosed in the retained sources.
    whyItMatters: The valuation debate depends on whether PhysicsX is scaling like a software platform with expanding margins or like a delivery-heavy engineering business with lower-quality revenue.
    diligencePath: Obtain monthly management accounts, cohort data, implementation economics, and a bridge from bookings to recognized revenue.
    relatedQuestionRefs:
    - QO015
    - QO017
    - QO024
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: founder-roster
    missingEvidence: Public materials do not cleanly reconcile the two-founder financing narrative with the about-page listing of Nicolas Haag as a co-founder.
    whyItMatters: The exact founder roster affects attribution, governance history, and any interpretation of voting control or retention packages.
    diligencePath: Ask management for the definitive founder roster, original share allocation, and an explanation of how founder titles are used in current materials.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: minor
    topic: hard-adverse-events
    missingEvidence: The retained public evidence set surfaced valuation skepticism but did not retain authoritative court, labor, or regulator records confirming whether there were any lawsuits, sanctions, or layoffs.
    whyItMatters: Negative events can change diligence posture quickly, especially for a fast-scaling private company selling into mission-critical industrial environments.
    diligencePath: Run dedicated court, sanctions, labor, and local-press database checks, then ask management to confirm any historical disputes or workforce reductions.
    relatedQuestionRefs:
    - QO025
