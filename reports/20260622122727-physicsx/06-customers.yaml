  - - Aerospace / high-performance engineering
    - 'Buyer: program engineering leads; User: aero, structures, and simulation teams; Payer: program budgets'
    - GB1 embedded deployment and unnamed aerospace outcome from Observer
    - High — Mar 2026 and Jun 2025
