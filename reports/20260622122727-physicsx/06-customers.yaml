  - - Data-center infrastructure
    - 'Buyer: infrastructure operators and power-system owners; User: electrical and thermal engineers; Payer: capex / infra budgets'
    - Specific Siemens Smart Infrastructure power-distribution workflow
    - High — Mar 2026
    - Contract economics and repeat-deployment breadth not disclosed
  - - Materials / mining and metals
    - 'Buyer: operations or process-engineering leadership; User: process engineers; Payer: plant optimization budgets'
    - Microsoft says PhysicsX works with a global leader to improve copper extraction efficiency
    - High — Feb 2026
    - Customer identity and measured uplift not public
  - - European industrial cloud channel
    - 'Buyer: T-Systems and customer IT/engineering leaders; User: industrial AI and engineering teams; Payer: cloud + transformation budgets'
    - Deutsche Telekom / T-Systems onboarding plus customer-site squads
