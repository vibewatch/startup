  - - Automotive OEM engineering
    - 'Buyer: vehicle-development and aero leads; User: CFD, systems, and test engineers; Payer: engineering programs'
    - Stellantis named by Bloomberg; PhysicsX technical note says real customer designs differ from benchmark datasets
    - High — Jun 2026 and Mar 2026
