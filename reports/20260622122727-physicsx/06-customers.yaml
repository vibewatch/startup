- id: adoption-trajectory-and-expansion-paths
  title: Adoption momentum is current, with partner-led expansion paths clearly visible
  body: 'PhysicsX''s adoption trajectory is public enough to show real momentum even though the company withholds exact account counts and ARR. The company said in June 2026 that customer count more than doubled, recognized revenue doubled, booked revenue tripled, and the team grew to more than 300 people over the prior year. Bloomberg syndication added two important details: revenue should be close to $50 million in 2026, and semiconductors are expected to become the largest segment by the end of the second quarter. That growth is not just abstract pipeline. Deutsche Telekom said PhysicsX is a launch partner on its Industrial AI Cloud, PhysicsX later said the platform was live there, and both sides described T-Systems-led onboarding plus forward-deployed squads at customer sites. CoreWeave separately framed PhysicsX as already delivering production-grade physical AI on its cloud. Microsoft''s Launchpad selection adds a go-to-market layer rather than direct spend, but it matters because
    it broadens distribution into enterprise Azure channels. The expansion pattern therefore looks like a mix of direct embedded engineering programs in flagship accounts and channel-assisted expansion through sovereign cloud, GPU infrastructure, and platform partners.'
