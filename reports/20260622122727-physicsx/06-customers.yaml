- id: named-deployments-and-reference-quality
  title: Named customer proof is strongest for Siemens, GB1, and Microsoft; Applied Materials and Stellantis remain thinly described
  body: 'The highest-quality named proof is Siemens. PhysicsX and Siemens jointly described a live March 2026 workflow for next-generation AI data centers, and Siemens independently said PhysicsX helps engineers predict busway thermal behavior in real time, shrinking analyses that used to take days into sub-second iterations. That reads like an active production engineering deployment rather than a speculative pilot. GB1 is the next-best proof: PhysicsX and GB1 both say the company is deployed as the official AI Engineering Platform partner for Britain''s America''s Cup challenge, with embedded engineers in Portsmouth and a counterparty quote from GB1''s Head of Design on higher-fidelity models and faster iteration. Microsoft is a meaningful but narrower proof point because Microsoft publicly said PhysicsX improved thermal behavior in Surface devices and reduced semiconductor prototype-development time, implying internal reference use rather than just partner status. By contrast, Applied
    Materials and Stellantis are only named by Bloomberg syndication; neither customer has a public case study, no workload is disclosed, and the public record does not say whether either account is in pilot, production, or broader enterprise rollout. Deutsche Telekom, T-Systems, CoreWeave, NVIDIA, and the Agentic Launchpad program strengthen distribution and infrastructure credibility, but they are better classified as enablement or channel relationships than as standalone evidence of end-customer revenue.'
