figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: PhysicsX's public customer motion looks like discovery through high-stakes engineering pain, technical validation inside incumbent tools, embedded delivery, secure deployment, and then channel-assisted expansion.
  data:
    items:
    - label: Problem discovery — customer faces slow, expensive, hard-to-scale simulation or optimization work
    - label: Technical evaluation — PhysicsX is tested inside existing CAE / PLM workflows such as Teamcenter or Simcenter
    - label: Embedded delivery — PhysicsX or T-Systems forward-deployed engineers work at the customer site or inside the active program
    - label: Secure deployment — private Large Physics Models run in enterprise or sovereign cloud environments on Azure, CoreWeave, or the Industrial AI Cloud
    - label: Expansion — use cases spread across additional products, sites, or disciplines once deployment capacity and proof points catch up
  claimRefs:
  - CU014
  - CU018
  - CU019
  - CU027
  - CU032
  - CU045
