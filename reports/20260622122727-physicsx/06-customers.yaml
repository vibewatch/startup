- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Category
  - Impact
  - Diligence path
  rows:
  - - Semiconductors becoming the largest segment by Q2 2026
    - Expansion driver
    - High — supports deepening within a hard-to-displace industrial budget pool
    - Break out bookings and renewals by semiconductor account and by fab-equipment vs chip-design customer
  - - Deutsche Telekom / T-Systems cloud channel
    - Expansion driver
    - High — creates European distribution and customer-site implementation leverage
    - Measure channel-sourced pipeline, conversion, and revenue share
  - - CoreWeave and Azure enterprise deployment paths
    - Expansion driver
    - Medium-High — lowers technical barriers for secure customer rollout
    - Test whether cloud enablement actually shortens sales or deployment cycles
  - - Only three publicly named customers
    - Concentration risk
    - High — a small named set can imply material revenue concentration even if total customer count is larger
    - Request top-1 / top-3 / top-10 revenue concentration and HHI
  - - Investor overlap with customer references
    - Reference-quality risk
    - Medium — alignment is strategically helpful but weakens independence of testimonials
    - Separate investor customers from non-investor customers in reference checks
  - - Six-month backlog and moderated rollout
    - Execution / concentration risk
    - Medium-High — demand is strong, but delayed implementation can slow expansion in existing accounts
    - Request backlog aging by account, implementation staffing, and revenue conversion timing
  - - No public retention metrics
    - Durability risk
    - Medium — limits conviction that early pilots turn into durable recurring revenue
    - Review renewal cohorts and expansion bookings under NDA
  notes: Impact levels are qualitative because no public customer-revenue breakdown exists. The strongest public risk signal is not weak demand; it is opaque concentration combined with implementation capacity limits.
