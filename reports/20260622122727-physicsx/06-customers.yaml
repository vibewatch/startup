- id: TU006
  title: Procurement and deployment friction table
  columns:
  - Friction
  - Public evidence
  - Affected segment
  - Current mitigation
  - Remaining gap
  rows:
  - - Mission-critical accuracy and safety proof
    - Startup Fortune says industrial customers will not buy vague AI promises when safety, cost, and performance are on the line
    - All serious industrial accounts
    - PhysicsX publishes technical notes and relies on deep workflow embedding
    - No public validation framework tying model accuracy to customer acceptance criteria
  - - Workflow integration into incumbent toolchains
    - PhysicsX says it integrates with Teamcenter and Simcenter without disrupting existing workflows
    - Industrial engineering teams
    - Native integration and simulation-in-the-loop data generation
    - No public data on time-to-value or integration duration per account
  - - Secure enterprise deployment and regulated environments
    - CoreWeave and Microsoft emphasize secure enterprise environments and regulated-cloud operations
    - Large enterprises, sovereign or regulated customers
    - Private LPM deployment paths on CoreWeave and Azure
    - No public compliance artifact or named defense / government production customer
  - - Infrastructure and grid constraints for data-center workloads
    - Siemens says grid capacity and interconnection timelines constrain data-center growth
    - Data-center and energy-intensive customers
    - PhysicsX + Siemens + Fluence + Emerald AI ecosystem
    - Public proof is strongest for one Siemens workflow, not for broad multi-site rollout
  - - Implementation capacity
    - Sifted reports moderated rollout because PhysicsX is supply-side limited; careers board shows continued hiring
    - Existing and new enterprise accounts
    - Hiring across delivery and security plus T-Systems / customer-site squads
    - No public metric on utilization, time-to-deploy, or attrition of delivery teams
  - - Defense / export-control opacity
    - PhysicsX repeatedly lists aerospace and defense, but no reviewed source names a defense customer or public contract vehicle
    - Defense and highly regulated buyers
    - Sector marketing plus embedded engineering model
    - Need named defense proof or treat defense as unproven
  notes: Friction items are framed from public evidence rather than from hypothetical enterprise-software checklists. Several mitigants exist, but almost all need private diligence to prove they scale beyond flagship accounts.
