  evidenceGaps:
  - type: missing-source
    severity: material
    topic: applied-materials-proof-depth
    missingEvidence: A counterparty or customer-side source explaining what Applied Materials uses PhysicsX for and whether the relationship is pilot, production, or enterprise-standard.
    whyItMatters: Applied Materials is one of only three named customers in public reporting, so its true deployment depth strongly affects concentration and durability analysis.
    diligencePath: Request the customer reference deck or an Applied Materials quote under NDA; alternatively find a fab-equipment case study or conference talk with Applied Materials engineers.
    relatedQuestionRefs:
    - QU004
    - QU008
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: stellantis-proof-depth
    missingEvidence: A counterparty or customer-side source explaining what Stellantis uses PhysicsX for and whether the relationship is pilot, production, or design-tool evaluation.
    whyItMatters: Stellantis is the clearest named automotive account, but no public workload or outcome is disclosed, limiting confidence in automotive production adoption.
    diligencePath: Ask management for the Stellantis workstream, deployment scope, contract structure, and renewal status; seek an OEM engineering conference mention.
    relatedQuestionRefs:
    - QU004
    - QU008
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, contract length, renewal cadence, or cohort data for PhysicsX's enterprise accounts.
    whyItMatters: Without retention and contract data, the chapter can judge demand proof and reference quality but not the durability of revenue after initial deployment.
    diligencePath: Request the board deck or data room cohort tables and renewal cohorts by top account; verify whether booked-revenue growth is expansion or mostly new-logo growth.
    relatedQuestionRefs:
    - QU020
    - QU021
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: A revenue concentration breakdown by top 1, top 3, and top 10 customers, plus the mix between direct customers and partner-led channel sales.
    whyItMatters: The public record names only three customers while discussing roughly $50 million of revenue, which could hide material single-account exposure.
    diligencePath: Request top-customer ARR and bookings share, HHI concentration, and whether Siemens or Applied Materials contribute outsized revenue.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: defense-customer-proof
    missingEvidence: A named aerospace or defense customer, public contract vehicle, or export-control compliance artifact showing that the broad aerospace-and-defense sector claim maps to a real defense buyer.
    whyItMatters: Defense work usually carries longer procurement cycles and compliance requirements; without a named example the public sector claim remains mostly marketing-level.
    diligencePath: Search for contract awards, defense conference talks, or customer references; if none exist, treat defense exposure as a future vertical rather than a proven revenue segment.
    relatedQuestionRefs:
    - QU005
    - QU031
    relatedTableRefs:
    - TU003
    - TU006
  - type: missing-source
    severity: minor
    topic: materials-customer-identity
    missingEvidence: The identity of the global mining or metals customer discussed by Microsoft and any outcome metric beyond directional efficiency improvement.
    whyItMatters: The materials vertical is publicly evidenced but not referenceable to a named customer, limiting diligence on renewal potential and strategic importance.
    diligencePath: Request the name, deployment stage, and measured recovery uplift for the copper-extraction project.
    relatedQuestionRefs:
    - QU006
    relatedTableRefs:
    - TU003
