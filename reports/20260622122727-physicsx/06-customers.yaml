    - CoreWeave and Microsoft provide secure deployment paths and enterprise-grade infrastructure
    - High — Feb to Mar 2026
    - These are enablement relationships, not direct end-customer spend proof by themselves
  notes: Rows mix direct customer proof, channel proof, and platform enablement because PhysicsX sells into complex industrial workflows rather than a simple self-serve SaaS motion. Public buyer / payer descriptions are inferred from the workflow described in each source.
