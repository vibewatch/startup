chapter:
  number: 6
  title: Customers
  summary: Public customer proof for PhysicsX is real but uneven. The best-evidenced deployments are Siemens' data-center power workflow, GB1's embedded America's Cup engineering program, and Microsoft's internal Surface thermal-design use case; by contrast, Applied Materials and Stellantis are only named through Bloomberg syndication, while retention and concentration metrics remain undisclosed.
sections:
- id: segments-and-proof-quality
  title: Customer segments are broad, but proof quality varies sharply by vertical
  body: 'PhysicsX''s June 2026 financing release says the platform is already deployed across aerospace and defense, semiconductors, industrial machinery, automotive, energy, and materials, and the same release says customer count more than doubled over the prior year while recognized revenue doubled and booked revenue tripled. That establishes broad segment reach and non-trivial commercial momentum, but it does not by itself reveal which segments are repeatable software deployments versus bespoke engineering programs. The cleanest segment evidence comes from specific workflows: Siemens in data-center power infrastructure, GB1 in elite-performance marine engineering, Microsoft Surface in device thermal design, and an unnamed mining-and-metals program for copper extraction. Semiconductors also have strong evidence because Bloomberg named Applied Materials as a customer and Microsoft described semiconductor prototype work, but the public record still lacks a customer-side description of the
    Applied Materials workload. Automotive proof is mixed: Stellantis is named, the technical note shows PhysicsX is thinking about real customer car designs, and Microsoft and CoreWeave both place the company in automotive workflows, yet the named OEM use case remains thin. Aerospace and defense are listed repeatedly, but only GB1 and an unnamed aerospace client are public proofs; no reviewed source names a defense customer or contract vehicle.'
