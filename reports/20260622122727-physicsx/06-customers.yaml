- id: retention-and-durability
  title: Durability is plausible from workflow embedding, but public retention evidence is almost absent
  body: 'PhysicsX''s public evidence is much stronger on adoption than on durability. No reviewed source disclosed NRR, GRR, churn, contract length, renewal cadence, or cohort behavior. That means the chapter can say the company has demand and some sticky-looking integrations, but it cannot prove repeat revenue quality in the way a software diligence process normally would. The best positive durability signals are structural. Siemens integration into Teamcenter and Simcenter sits close to existing engineering workflows. CoreWeave and Microsoft both emphasize secure enterprise deployment and mission-critical environments, which usually correlate with higher switching costs and longer implementation cycles. GB1 also looks like an embedded program rather than a one-off logo. Still, structural stickiness is not the same as observed retention. The six-month backlog and supply-side limits could mean excellent demand, but they also create a blind spot: if expansion into existing accounts is being
    throttled, public growth metrics cannot cleanly separate land-and-expand from delayed delivery. The practical conclusion is that durability is directionally positive but unproven in public data.'
