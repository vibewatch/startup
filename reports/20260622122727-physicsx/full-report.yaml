      - number: '8.3'
        title: Comparable context, scenario ranges, and price discipline
        blocks:
          - type: paragraph
            body: >-
              A sensible public-market lens is rough market-cap-to-revenue, not because it is perfect, but because it is
              the best public shorthand available when enterprise value, margins, and net cash are not consistently
              disclosed in one place. Using CompaniesMarketCap for 2026 market caps and Macrotrends for trailing
              revenue, Cadence trades around 20.5x, Ansys around 13.3x, Autodesk around 5.9x, and PTC around 4.8x, for a
              four-company band of roughly 4.8x to 20.5x and a median near 9.6x. Against that band, PhysicsX at $2.4
              billion looks expensive unless its hidden revenue base is already substantial. If annualized recurring
              revenue were only $50 million, the round implies roughly 48x. Even at $100 million it would still imply
              about 24x, above the sampled public band. Only once recurring revenue is somewhere above roughly $120
              million does the price begin to resemble the top end of the public comp range, and only closer to roughly
              $250 million does it approach the median. That is why the broad scenario ranges below should be treated as
              illustrative discipline, not point estimates.
