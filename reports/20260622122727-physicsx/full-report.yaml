      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: |
              The public founder story is clear on two points and fuzzy on one. Independent coverage,
              funding announcements, and the 2023 stealth-exit materials consistently identify Jacomo Corbo
              and Robin Tuluie as the founding pair. Corbo is the CEO and co-founder in current materials;
              Tuluie is presented as founder or co-founder plus chairman. Both bring unusually direct
              founder-market fit: Tuluie came from Renault/Alpine and Mercedes Formula 1 plus Bentley,
              while Corbo previously co-founded QuantumBlack and worked in Formula 1 race strategy. That is
              unusually relevant for a company selling simulation-speed and optimization gains into complex
              engineering organizations.

              Governance has professionalized since 2023 but is still founder-centered. Companies House
              shows Corbo was appointed as an officer on 1 January 2023, Jim Baum joined as a director on
              20 October 2023, and Laura Connell joined the board on 20 June 2025 after Atomico led the
              Series B. The about page also lists Nicolas Haag as a co-founder and director of simulation
              engineering, which broadens the technical founding bench but also creates a mild founder-roster
              ambiguity versus the two-founder narrative used in most financing coverage. Publicly visible
              operating depth exists through COO Alexander Dreismann and North America leader Mark
              Huntington, yet key-person dependence still sits heavily with Corbo and Tuluie because they
              dominate capital-markets, technical-vision, and external-partnership messaging.
