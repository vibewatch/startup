      - number: '2.2'
        title: TAM/SAM/SOM must be bounded with multiple lenses, not one generic TAM
        blocks:
          - type: paragraph
            body: >-
              Public market sizing supports only a range, not a single authoritative number. Narrower CAE estimates
              cluster from about USD 7.64 billion to USD 11.53 billion for 2026, while broader simulation software
              estimates reach USD 15.46 billion in 2026 and imply materially larger totals when adjacent software
              categories are included. The spread is driven less by disagreement about growth than by scope: some
              publishers count core CAE tools, while others include wider simulation software, services, cloud delivery,
              and digital-twin workflows. For PhysicsX, a broad TAM lens is therefore the simulation-software market,
              but the more defensible SAM is a smaller set of engineering programs where virtual validation is already
              strategic and where buyers can support both data and compute requirements. A cautious SOM is narrower
              still: the slice of those programs willing to add AI layers on top of incumbent stacks. The evidence does
              not support a precise PhysicsX-specific TAM point estimate, and that uncertainty should be preserved.
