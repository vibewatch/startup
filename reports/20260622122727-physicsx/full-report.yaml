  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and workflow surface
        blocks:
          - type: paragraph
            body: >-
              PhysicsX does not present itself as a single surrogate model or one-off simulator. Its public product
              story is a layered engineering software stack that starts with simulation and data orchestration, adds
              physics-AI model development, and ends in engineer-facing applications that fit into existing
              product-development workflows. In customer terms, the company is selling faster concept exploration,
              solver-informed optimization, and AI-assisted operational decision support across design, manufacturing,
              and operations rather than only a model API. The most concrete modules publicly visible today are
              Simulation Workbench, AI Workbench, Engineering Applications, platform services, and the public showcase
              pair of LGM-Aero plus Ai.rplane. The workflow is explicit: ingest CAD, simulation, and operational data;
              build traceable datasets; train or fine-tune physics models; deploy them through applications, APIs, or
              edge contexts; and keep humans in the loop for validation and decision making. This framing matters
              because it places PhysicsX closer to an engineering operating system than to a standalone foundation-model
              lab, but it also means product value depends on integration discipline and delivery execution rather than
              on model quality alone.
