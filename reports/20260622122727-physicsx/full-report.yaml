      - number: '2.5'
        title: Sizing contradictions and diligence gaps to preserve
        blocks:
          - type: paragraph
            body: >-
              The market chapter should explicitly preserve what the evidence cannot yet resolve. First, there is no
              standalone public market estimate for “physics AI for industrial engineering” with auditable methodology,
              so any exact PhysicsX TAM would be invented precision. Second, even strong adjacent signals such as
              semiconductor capex or data-center expansion do not translate cleanly into software SAM without knowing
              what share flows to simulation workflows versus hardware, services, or internal engineering labor. Third,
              current buyer evidence still points to overlay adoption rather than solver replacement, meaning SOM
              depends heavily on integrations, validation, and change management that are mostly private. Finally,
              published estimates conflict enough that investors should treat them as boundary markers rather than a
              consensus. Those contradictions are useful: they reveal where the company could outperform if physics AI
              becomes trusted, but also where adoption may stay narrow if conservative workflows and incumbent
              ecosystems continue to dominate.
