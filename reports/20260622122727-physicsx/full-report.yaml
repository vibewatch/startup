        - Gross retention, net retention, expansion by customer cohort, and deployment-to-expansion timelines.
        - Shows whether customer growth is compounding like software or resetting like consulting work.
        - CRO interview plus cohort tables from finance systems.
      - - Gross margin and delivery intensity
        - Gross margin by product and delivery model, plus forward-deployed engineering staffing load.
        - A services-heavy operating model should not receive upper-band software multiples.
        - CFO and delivery leadership diligence.
      - - Cap table and preferences
        - Full share-class stack, liquidation preferences, anti-dilution protections, and option-pool math.
        - Return outcomes for new investors cannot be trusted without this.
        - Legal diligence with outside counsel and cap-table export.
      - - Customer concentration
        - Top-customer revenue share, renewal timing, and proof that deployments expand beyond a few flagship programs.
        - A narrow concentration profile would make the current valuation brittle.
        - Finance + sales operations export, then customer-reference calls.
      - - Exit readiness
        - >-
          Board-level view on financing runway, banker engagement, secondary liquidity, and realistic IPO or
          strategic-exit timing.
        - Hold period and downside protection matter more at a late-stage entry price.
        - Board and investor-rights diligence.
    notes: These asks are ordered by what would most directly move recommendation, confidence, and price discipline.
    claimRefs:
      - CV034
      - CV036
      - CV043
      - CV044
      - CV045
