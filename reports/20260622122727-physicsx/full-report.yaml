    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing Model, and GTM Motion
        blocks:
          - type: paragraph
            body: >-
              PhysicsX’s public materials point to a negotiated enterprise model rather than a transparent SaaS
              list-price business. The company sells an AI-native engineering platform spanning simulation management,
              model development, and deployment into engineering workflows, but it also says forward-deployed engineers
              embed directly into live customer programs and tailor model architectures, data pipelines, and
              optimization loops to customer context. That combination strongly suggests revenue comes from a hybrid of
              platform subscriptions or licenses, implementation and model-development work, and expansion into broader
              workflow ownership once deployed. The one public product-led pricing clue is Ai.rplane, a free barebones
              version of the LGM-Aero tool, which looks more like a top-of-funnel acquisition surface than a meaningful
              revenue line. Because no official rate card, minimum commitment, or contract-duration detail is public,
              pricing discipline and revenue-recognition timing remain diligence items rather than underwritten facts.
