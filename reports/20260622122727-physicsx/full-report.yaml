  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              PhysicsX is best framed as an AI-native layer on top of engineering simulation rather than as a generic
              industrial AI company. Its own product description centers on unifying simulation, physics AI, data, and
              engineering applications across the product lifecycle, while partner and customer-facing materials place
              it inside aerospace, semiconductors, automotive, materials, and energy programs where physics prediction
              shapes design decisions. That means the relevant market includes CAE, solver-backed engineering analysis,
              high-value digital-twin validation, and AI-surrogate tooling that compresses those workflows. It excludes
              most generic enterprise AI, factory automation hardware, and non-engineering SaaS. The status quo is not
              blank space: incumbents such as Ansys, Siemens/Altair, Synopsys, and Cadence already span fluids,
              structures, electronics, multiphysics, and digital-twin workflows, so PhysicsX must win as an overlay or
              workflow upgrade rather than by assuming buyers start from zero.
