      - number: '3.2'
        title: Capability, trust, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The core comparison is not just “who has AI.” Incumbents still dominate on breadth, embedded workflows,
              and procurement muscle. Synopsys/Ansys and Siemens can bundle AI features into much larger simulation,
              CAD, PLM, and EDA estates, while Cadence attacks from GPU-accelerated classical simulation. Rescale
              competes from a different angle: it wraps simulation execution, AI agents, and compute economics into a
              control plane that can sit above many solver choices. PhysicsX’s counter-position is deeper AI-native
              acceleration on hard industrial physics problems, paired with customer-specific fine-tuning and tighter
              engineering workflows.


              Trust and regulatory posture are similarly asymmetric. Rescale publicly exposes FedRAMP, SOC 2, ISO 27001,
              and ITAR signals; Siemens and Synopsys inherit decades of enterprise and certification credibility;
              PhysicsX’s public signals are stronger on sovereignty and industrial partnerships than on externally
              legible certification detail. That does not mean PhysicsX is weak on trust, but it does mean buyers in
              defense, aerospace, semiconductor, or critical infrastructure procurement can often clear diligence faster
              with incumbents and infrastructure vendors than with AI-native entrants.
