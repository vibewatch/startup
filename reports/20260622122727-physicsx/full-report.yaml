      - number: '2.4'
        title: Growth drivers, adoption constraints, and structural contradictions
        blocks:
          - type: paragraph
            body: >-
              The growth case is real but conditional. PhysicsX benefits from a clear demand-side push: surrogate models
              and AI-enhanced workflows can dramatically compress iteration time; semiconductor capital spending tied to
              AI chips remains elevated; data-center buildout is forcing more complex thermal and power decisions; and
              aerospace programs face rising complexity with not enough expert labor. Cloud-native delivery also lowers
              barriers for some buyers. But the constraints are equally material. Mature engineering organizations are
              still mostly stuck in pilots, and survey evidence says data readiness, governance, and interoperability
              remain larger blockers than enthusiasm. Trust is also not solved: most organizations allow AI-driven
              pass/fail decisions only under defined oversight, while risk-averse sectors still benchmark AI outputs
              against trusted solvers and final validation. Compute and infrastructure costs remain meaningful,
              interoperability gaps preserve sunk-cost lock-in, and export controls plus AI-infrastructure bottlenecks
              complicate deployment. Consolidation among Synopsys/Ansys, Siemens/Altair, and Cadence-adjacent assets
              further raises the bar for a startup trying to become system-of-record software, even as it creates room
              for AI-native overlays.
