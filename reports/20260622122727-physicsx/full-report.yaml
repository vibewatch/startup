      - number: '8.2'
        title: Why the story is compelling — and why it is still fragile
        blocks:
          - type: paragraph
            body: >-
              The pro-investment case is not imaginary. PhysicsX is building around a real pain point in industrial
              engineering: expensive simulation bottlenecks, slow design loops, and the need to move from solver-bound
              workflows to AI-assisted iteration. Its platform description is coherent, with named modules, cloud and
              on-prem deployment options, explicit CAE integrations, and a delivery model built to work inside customer
              programs. The sector footprint is also attractive, spanning aerospace, semiconductors, automotive,
              materials, and energy, and the Siemens and NVIDIA collaborations suggest that sophisticated ecosystem
              players see strategic value in the stack. But the anti-thesis is equally important. PhysicsX's own
              technical material explains that some neural-operator approaches break down in precisely the kinds of
              environments investors worry about: shocks, irregular geometries, strict boundary conditions, and
              higher-dimensional workloads. That does not invalidate the business, but it does mean repeatability must
              be demonstrated workload by workload. If deployments remain narrow, expert-heavy, or services-led, the
              platform narrative will not deserve a public-market-style software premium.
