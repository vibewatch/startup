            body: >-
              Public traction is stronger than for most private industrial-AI startups, but it is still incomplete.
              Official Series C disclosures say recognized revenue doubled year over year, booked revenue tripled,
              customer count more than doubled, and headcount surpassed 300. External reporting adds that 2026 revenue
              should be close to $50 million, with a goal to more than double in 2027, and that the company has roughly
