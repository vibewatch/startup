      - number: '3.4'
        title: Moat durability and adverse signals
        blocks:
          - type: paragraph
            body: >-
              PhysicsX’s moat is real, but conditional. The strongest case is that it combines proprietary industrial
              data, customer-specific fine-tuning, deep integrations, and forward-deployed delivery into one productized
              workflow. That can be hard for generalist incumbents or internal teams to reproduce quickly on bespoke,
              high-value multiphysics workflows. The weak version of the moat story is “only PhysicsX can build the
              models,” because both PhysicsX’s own partner strategy and NVIDIA’s open tooling make that claim less
              defensible over time.


              The adverse case is therefore credible and should stay prominent in diligence. Siemens can become a
              replacement rather than just a channel. Synopsys/Ansys can bundle AI into an even larger installed base.
              Rescale can win the orchestration layer. OpenFOAM, SU2, and PhysicsNeMo keep the DIY path alive. And
              vertical or upstream specialists can siphon slices of the workflow without matching full-platform breadth.
              PhysicsX can still outperform this field, but its durability depends on staying ahead on data advantage,
              workflow speed, and deployment trust at the same time—not on assuming the rest of the stack stands still.
