              prove dangerous concentration, but it is enough to make top-account exposure a material diligence ask.
              Concentration risk is amplified by investor overlap: Siemens and Applied Materials are both financial
              backers and customer references, while NVIDIA is both investor and ecosystem anchor. Reference quality
              therefore improves when counterparties speak directly, as Siemens, GB1, Deutsche Telekom, T-Systems,
              Microsoft, and CoreWeave did, but it weakens when a relationship exists only inside financing coverage.
              Procurement friction also looks substantial. PhysicsX has to land inside mission-critical engineering
              workflows, prove security and accuracy, integrate into Teamcenter, Simcenter, or private cloud
              environments, and staff forward-deployed programs. Sifted's rollout-capacity quote suggests demand is
              ahead of delivery capacity, which is better than demand weakness but still a constraint on expansion and
              renewals. The broad aerospace-and-defense claim deserves caution as well because no public defense
              customer, contract, or compliance pathway was found.
