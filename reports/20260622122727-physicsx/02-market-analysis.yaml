  - - Physics-AI / surrogate layer
    - AI models that accelerate solver setup, screening, optimization, and design-space exploration
    - Pure chatbots without physics-grounded workflow integration
    - CTO, VP Engineering, simulation head, advanced R&D
    - Closest expression of the PhysicsX value proposition.
  - - EDA-adjacent physical-system analysis
    - Chip-package-system thermals, advanced packaging, 3D-IC, and electronics reliability analysis
    - Pure logic synthesis and non-physical digital design tasks
    - Semiconductor and electronics program owners
    - Important because PhysicsX targets semiconductors and the silicon-to-systems boundary is blurring.
  - - Digital twin / validation layer
    - Operational twins, virtual commissioning, and model-based validation tied to engineering assets
    - Generic BI dashboards disconnected from engineering models
    - Operations engineering, product engineering, platform owners
    - Extends PhysicsX beyond design into operations where supported.
  - - Cloud / HPC-backed simulation delivery
    - Elastic compute, secure browser deployment, workflow automation for engineering solvers
    - Commodity cloud spend unrelated to engineering workflows
    - Engineering IT, platform engineering, simulation COE
    - Often the budget path that makes AI-assisted simulation deployable at scale.
  - - Excluded generic industrial AI
    - Standalone copilots, generic enterprise analytics, and automation hardware
    - —
    - CIO or automation budgets
    - These are adjacent but not a clean proxy for PhysicsX demand.
  notes: Boundary logic distinguishes solver-centric engineering spend from broader industrial AI narratives. PhysicsX participates mainly where physics-grounded engineering decisions and validation already matter.
