company:
  name: PhysicsX
chapter:
  number: 2
  title: Market Analysis
  summary: PhysicsX sits in the overlap between incumbent engineering simulation software and a newer AI-for-physical-systems layer rather than in generic enterprise AI. Public sizing lenses range from about $7.6B for narrow CAE to more than $15B for broader simulation software in 2026, with larger semiconductor and data-center capex pools reinforcing demand but not justifying a single precise TAM. Adoption is helped by faster iteration and cloud economics, but constrained by switching costs, validation burdens, interoperability, export controls, and conservative engineering workflows.
sections:
- id: market-boundary
  title: Market boundary, included spend, and status-quo substitutes
  body: 'PhysicsX is best framed as an AI-native layer on top of engineering simulation rather than as a generic industrial AI company. Its own product description centers on unifying simulation, physics AI, data, and engineering applications across the product lifecycle, while partner and customer-facing materials place it inside aerospace, semiconductors, automotive, materials, and energy programs where physics prediction shapes design decisions. That means the relevant market includes CAE, solver-backed engineering analysis, high-value digital-twin validation, and AI-surrogate tooling that compresses those workflows. It excludes most generic enterprise AI, factory automation hardware, and non-engineering SaaS. The status quo is not blank space: incumbents such as Ansys, Siemens/Altair, Synopsys, and Cadence already span fluids, structures, electronics, multiphysics, and digital-twin workflows, so PhysicsX must win as an overlay or workflow upgrade rather than by assuming buyers start
    from zero.'
  claimRefs:
  - CM001
  - CM003
  - CM004
  - CM005
