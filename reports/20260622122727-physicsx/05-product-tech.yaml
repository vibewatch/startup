- id: architecture-operating-model
  title: Architecture, operating model, and integration stack
  body: 'The public architecture points to a fairly opinionated operating model. Simulation Workbench is the data and orchestration layer: PhysicsX describes it as the place where simulation, experimental, and operational data are normalized, tagged, versioned, and kept traceable across geometry, mesh, configuration, and results. AI Workbench then sits on top of that data backbone as the training and deployment environment for Deep Physics Models, private foundation models, and third-party model families. Engineering Applications are the consumption layer, exposing results through web interfaces, APIs, and specialized edge or manufacturing deployments. The product is designed to integrate with standard engineering toolchains rather than replace them outright, with public references to ANSYS, CATIA, Siemens NX, OpenFOAM, and STAR-CCM+, plus customer-cloud and air-gapped deployment modes. PhysicsX’s own technical writing is unusually explicit that this stack is not just a UI wrapper around
    models: it depends on orchestration, data lineage, active learning, and repeated solver-backed validation. That is technically credible and enterprise-friendly, but it also reveals the implementation burden: PhysicsX must keep abstraction layers stable across heterogeneous solver ecosystems, changing cloud targets, and bespoke customer environments.'
