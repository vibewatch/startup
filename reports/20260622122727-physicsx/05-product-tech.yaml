- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - What it helps with
  - Gap
  rows:
  - - ISO 27001
    - Publicly announced
    - Organization-level information security management
    - Shows a formal security-management baseline
    - No public control mapping to specific product modules
  - - Privacy notice / GDPR references
    - Public PDF, last updated Oct 2022
    - Website and service personal-data processing
    - Gives buyers a legal/privacy starting point
    - It is not a modern enterprise AI governance whitepaper
  - - Customer-specific model training
    - Publicly claimed
    - Training segregation across clients
    - Reduces fear of cross-customer model leakage
    - No public retention or deletion workflow detail
  - - Hosted / customer cloud / air-gapped deployment
    - Publicly claimed
    - Enterprise deployment topology options
    - Supports high-classification and sovereign use cases
    - No public incident or uptime history
  - - Uncertainty quantification and active learning
    - Publicly described in technical materials
    - Model confidence and data-acquisition loop
    - Improves trust calibration and targeted retraining
    - No public calibration metrics or acceptance thresholds
  - - Human-in-loop validation
    - Repeatedly emphasized
    - Engineer review plus solver-backed validation
    - Limits over-trust in pure model outputs
    - Makes scaling and procurement slower than marketing may imply
  - - Export-control / defense handling program
    - Not publicly described
    - Aerospace & defense and sovereign-cloud contexts
    - Could matter for sensitive workloads
    - Public corpus shows no explicit export-control framework
  notes: This table separates existence of a public signal from sufficiency for enterprise diligence; several controls are directionally positive but still incomplete for procurement-heavy environments.
