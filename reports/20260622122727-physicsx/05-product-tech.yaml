- id: trust-limits
  title: Trust, security, validation burden, and unresolved technical gaps
  body: 'PhysicsX has more public trust material than many deeptech startups, but the package is still incomplete for a company targeting mission-critical engineering workflows. Positive signals include ISO 27001 certification, a published privacy notice referencing UK data-protection law and GDPR, explicit customer-data isolation claims, public support for hosted, customer-cloud, and air-gapped deployment, and repeated emphasis on uncertainty quantification, active learning, solver-backed validation, and human judgment. Those are all directionally good controls for an industrial AI platform. The unresolved risk is that public evidence remains thinner than the marketing ambition. PhysicsX’s own technical writing highlights why the burden is real: vanilla FNO-style operators struggle on shocks, strict boundary conditions, irregular geometries, scarce data, and higher-dimensional problems; its LGM materials note lossy compression, latent-space assumptions, and the need to fine-tune for niche
    geometries. The company also said a full LGM-Aero benchmark paper was still forthcoming, and the reviewed public corpus does not spell out uptime metrics, external evaluation audits, enterprise retention policies for customer engineering data, or export-control handling for defense-adjacent workloads. For a buyer or investor, that means the platform looks technically serious, but production underwriting still depends on private diligence around benchmarking, governance, and domain-specific validation.'
