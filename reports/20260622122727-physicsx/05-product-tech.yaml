- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - PhysicsX solution
  - Measurable benefit
  - Limitation
  rows:
  - - Concept exploration for physical products
    - Run sequential CAD-to-solver loops and wait hours or days for results
    - Use platform applications and models to screen designs before solver reruns
    - Company and partners claim hours/days compress to seconds
    - Benefit is directional; public ROI metrics are sparse
  - - Create ML-ready engineering datasets
    - Manually collect logs, meshes, and KPI exports across tools
    - Simulation Workbench automates lineage, normalization, and structured outputs
    - Enables searchable and reusable training corpora
    - No public schema or connector documentation
  - - Build domain-specific physics AI
    - Train bespoke surrogates from scattered simulation files
    - AI Workbench fine-tunes pretrained DPM/LPM assets on private customer data
    - Lower data burden than from-scratch model programs
    - Private-model governance detail is not public
  - - Deploy inference into real engineering operations
    - Use isolated solver teams or offline analysts
    - Engineering Applications expose web, API, or edge workflows inside customer processes
    - Faster what-if analysis and potential operational optimization
    - Realized production case studies are still selective in public
  - - Validate AI before production action
    - Trust single-model outputs or slow solver reruns
    - Use uncertainty quantification, active learning, reference simulation, and engineer review
    - Higher confidence and targeted data generation
    - Validation burden remains domain-specific and not fully benchmarked publicly
  notes: Benefits are public claims or partner anecdotes, not a normalized ROI study across the installed base.
