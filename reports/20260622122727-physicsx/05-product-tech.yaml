  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmark-transparency
    missingEvidence: A public technical paper or independent benchmark pack for LGM-Aero and other production Large Physics Models with baselines, error bars, and domain boundaries.
    whyItMatters: Without benchmark methodology and failure envelopes, speed and generalization claims are difficult to underwrite outside the showcased settings.
    diligencePath: Request benchmark decks, customer validation studies, and any released or draft technical paper with evaluation protocols.
    relatedQuestionRefs:
    - QE015
    - QE030
    - QE032
  - type: private-evidence-only
    severity: material
    topic: enterprise-governance
    missingEvidence: A public or shareable enterprise AI governance package covering retention, audit logs, security architecture, and model-evaluation controls for customer engineering data.
    whyItMatters: Security certifications and privacy notices help, but buyers still need model-governance detail before approving deployment into sensitive engineering workflows.
    diligencePath: Request security architecture docs, retention policies, red-team or review processes, and customer-facing governance controls.
    relatedQuestionRefs:
    - QE025
    - QE026
    - QE031
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: export-controls
    missingEvidence: A public statement or policy on export-control and defense-data handling for aerospace and sovereign-cloud workloads.
    whyItMatters: Aerospace and defense use cases can create ITAR/EAR or related restrictions that affect where models and data can train, store, and infer.
    diligencePath: Ask for export-control policy, data-segmentation controls, and any sector-specific compliance mappings used in defense-adjacent programs.
    relatedQuestionRefs:
    - QE021
    - QE031
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: operational-reliability
    missingEvidence: Public or customer-shareable uptime metrics, incident history, support-response commitments, and escalation procedures for hosted or managed deployments.
    whyItMatters: Enterprise buyers need operational support evidence to evaluate whether the platform behaves like production software rather than a high-touch services engagement.
    diligencePath: Request service-level commitments, incident summaries, and support model documentation by deployment mode.
    relatedQuestionRefs:
    - QE007
    - QE031
    relatedTableRefs:
    - TE004
  - type: conflicting-data
    severity: material
    topic: generalization-limits
    missingEvidence: Customer-controlled validation across niche geometries, strict boundary-condition regimes, and shock-dominated problems where PhysicsX’s own technical writing says common operator families can fail.
    whyItMatters: The strongest technical risk is not whether the models are fast, but where they stop being reliable without domain-specific fine-tuning or fallback simulation.
    diligencePath: Run buyer-owned benchmark suites on representative edge cases and compare model inference with reference solver outputs before scaling deployment.
    relatedQuestionRefs:
    - QE028
    - QE029
    - QE032
