- id: pricing-switching-costs-and-internal-build
  title: Pricing, switching costs, and internal-build substitutes
  body: 'Public pricing disclosure is the exception, not the rule, across this landscape. Siemens and Altair explain the mechanics
    of tokens and units but do not publish rates. PhysicsX, Rescale, Monolith, and BeyondMath all look sales-led in public
    materials. That means the most useful pricing signals are packaging structure and buyer economics, not headline list price.
    PhysicsX is effectively asking buyers to pay for speed, iteration capacity, and workflow compression; incumbents are asking
    buyers to stay inside broader license pools; open-source paths ask buyers to absorb talent and integration cost instead
    of software markup.


    The internal-build route is therefore real, especially for sophisticated engineering organizations that already own solver
    expertise and GPU budgets. OpenFOAM and SU2 remain free, mature, and technically credible, while PhysicsNeMo is open-source
    across the same broad physics families PhysicsX targets. PhysicsX’s own case studies strengthen, rather than weaken, this
    conclusion because they show the product is trained on solver outputs that elite internal teams could also generate. The
    company’s best defense is not that internal build is impossible; it is that building an industrial-grade stack with proprietary
    data pipelines, uncertainty management, deployment hardening, and ongoing model operations is still expensive and slow
    for most buyers.'
  claimRefs:
