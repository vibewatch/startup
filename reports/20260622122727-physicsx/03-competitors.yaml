    - Map deal losses by workflow slice rather than only by named-headline competitor
  - - Trust posture
    - Public certification detail remains thinner than Rescale or major suites
    - Medium
    - Procurement may prefer vendors with explicit public compliance surfaces
    - Request the security packet and regulated-customer references early in diligence
