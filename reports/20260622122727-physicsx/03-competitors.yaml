    - High
    - Model layer is increasingly open and buyers already own solver data
    - Test whether reference customers stay because of data flywheel and deployment burden, not because the model is impossible
      to recreate
  - - Partner-led distribution
    - Siemens becomes replacement rather than channel
    - High
    - Simcenter integration can accelerate adoption and future displacement simultaneously
    - Clarify exclusivity, data boundaries, and account-control rules in strategic partnerships
  - - Embedded delivery quality
    - Scalability pressure from high-touch GTM
    - Medium-High
    - Forward-deployed engineers are powerful but labor-intensive
    - Measure revenue per deployment engineer and reference-customer expansion efficiency
  - - AI-native speed advantage
    - Incumbents add “good enough” AI into larger bundles
