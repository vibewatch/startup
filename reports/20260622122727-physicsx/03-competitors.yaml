- id: TP003
  title: Pricing / packaging comparison
  columns:
  - route
  - price / contract model
  - what is publicly visible
  - main unknown
  - implication for buyer
  rows:
  - - PhysicsX
    - Custom enterprise contract
    - No public rate card; consultative platform + deployment story
    - Realized ACV, usage metric, and renewal economics
    - Must diligence pricing power directly rather than infer from website
  - - Synopsys / Ansys
    - Enterprise suite subscription
    - AI products are public; pricing remains sales-led
    - How AI modules are priced against legacy bundles
    - Bundle power likely matters more than headline solver price
  - - Siemens Simcenter
    - Named user + floating tokens
    - Token mechanics are public, but token rates are not
    - Effective cost per workflow or per compute hour
    - Flexible licensing lowers friction for existing Siemens accounts
  - - Altair Units
    - Shareable units pool across 180+ products
    - Units model is public; pricing still contact-sales
    - Real unit economics and cross-portfolio discounting
    - Broad unit pool can raise switching cost by collapsing many tools into one contract
  - - Rescale
    - Enterprise platform + usage economics
    - Pricing remains opaque; financial controls and editions are public
    - Pass-through margin versus software markup
    - Harder to compare seat-for-seat with solver vendors because control-plane value is mixed with compute governance
  - - Monolith AI
    - Demo-led enterprise sale
    - No public pricing
    - Scale of deployment and support costs
    - Best viewed as project or platform sale into specific validation pain points
  - - BeyondMath
    - Early-stage enterprise / project access
    - Funding and case-study claims are public; pricing is not
    - Whether product has standardized packaging yet
    - Commercial maturity is still part of the diligence question
  - - Open-source build
    - No software license, but talent and infra cost
    - OpenFOAM and SU2 are free; PhysicsNeMo is open-source
    - True internal engineering and MLOps burden
    - Cheap software can still be expensive if the organization lacks specialist talent
  notes: This table emphasizes packaging mechanics because public list pricing is scarce across the competitive set.
