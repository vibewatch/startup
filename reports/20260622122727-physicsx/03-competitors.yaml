  rows:
  - - PhysicsX
    - AI-native physics platform
    - 2026 Series C at ~$2.4B valuation; revenue and customer count more than doubled YoY
    - Industrial engineering teams in aerospace, auto, semis, energy, materials
    - Customer-specific Large Physics Models plus embedded deployment
    - Opaque public pricing and thinner public certification detail than incumbents
  - - Synopsys / Ansys
    - Incumbent suite vendor
    - Post-2025 combined silicon-to-systems stack with explicit AI roadmap
    - Large enterprise simulation and semiconductor accounts
    - Installed base, broad workflow coverage, bundling power
    - AI posture still layered onto classical suites and integration is ongoing
  - - Siemens Simcenter + Altair
    - Incumbent suite vendor
    - Multi-domain portfolio with Simcenter X plus Altair units model
    - NX/Teamcenter accounts, industrial conglomerates, regulated engineering teams
    - Deep digital-thread lock-in, tokens/units flexibility, broad simulation heritage
    - Can also become a gatekeeper or replacement for PhysicsX in shared accounts
  - - Cadence Fidelity
    - Adjacent incumbent
    - Strong CFD and GPU-compute story from electronics/EDA base
    - Aerospace, auto, turbomachinery, electronics thermal/EM buyers
    - GPU acceleration and hardware-software integration
    - Less evidence of PhysicsX-style customer-specific Large Physics Models
  - - Rescale
    - Workflow-control-plane peer
    - Hundreds of enterprise customers and >$1B annual HPC spend through platform
    - R&D leaders managing large simulation estates
    - HPC orchestration, AI agents, broad compliance posture
    - Does not own the deepest proprietary solver or physics-model moat
  - - Monolith AI
    - Adjacent specialist
    - Testing-data AI with automotive pedigree and NAFEMS visibility
    - Validation, test, and product-performance teams
    - Self-learning models from real test data and active test planning
    - More adjacent to test/validation than direct to multiphysics simulation today
  - - nTop
    - Upstream workflow specialist
    - Established computational-design platform used in advanced engineering
    - Design and geometry automation teams
    - Design-space exploration and geometry automation upstream of simulation
    - Not a direct solver or surrogate-physics replacement
  - - Akselos
    - Vertical specialist
    - Real-time structural performance management with quantified energy outcomes
    - Critical infrastructure, oil and gas, LNG, offshore wind operators
    - Domain-specific structural ROI and operational integration
    - Threat is strongest in narrow verticals rather than broad industrial CAE
  - - BeyondMath
    - AI-native direct peer
    - Fresh funding plus Formula 1 and aerospace proof points
    - High-performance engineering teams needing rapid design exploration
    - Foundational-physics positioning with strong speed claims
    - Commercial maturity and pricing remain less legible publicly
  - - Open-source + internal build
    - Status quo / substitute
    - OpenFOAM, SU2, and PhysicsNeMo are free and actively maintained
    - Sophisticated OEMs and internal HPC/ML teams
    - Maximum control, no software markup, reuse of existing solver data
    - Requires scarce talent, MLOps, and deployment hardening that many teams lack
  notes: Rows group the most decision-relevant alternatives a serious PhysicsX buyer can choose in 2026, including substitutes
    and internal build.
