      - number: '1.3'
        title: 融资、投资人和规模
        blocks:
          - type: paragraph
            body: >
              PhysicsX 已完成三轮公开披露的股权融资，规模快速放大。它于 2023 年 11 月以 General Catalyst 领投的 $32 million Series A 退出隐身阶段，随后在 2025 年
              6 月 22 日宣布由 Atomico 领投的 $135 million Series B，又在 2026 年 6 月 8 日宣布由 Temasek 领投、估值约 $2.4 billion 的 $300
              million Series C。三轮披露融资额合计至少 $467 million；部分 2026 年新闻报道将总额四舍五入为约 $500 million。2026
              年投资人名单在战略上值得注意，因为它把主权资本、工业巨头和 AI 基础设施敞口混在一起，包含 Siemens、NVIDIA、Applied Materials、NGP 等名字。


              最新一轮还伴随强但仍不完整的规模披露。官方材料称，已确认收入同比翻倍，预订收入增长两倍，客户基数扩大一倍以上，员工数在 12 个月翻倍后超过 300 人。独立媒体将 2026 年 6 月的员工数估在接近
              350，并把需求与半导体、数据中心电力和冷却、以及更广泛的工业基础设施联系起来。因此，增长叙事很有吸引力，但缺少绝对收入、ARR、毛利率或客户集中度披露，意味着投资人仍需要私下证据，才能只按软件式经济性来承销该估值。
