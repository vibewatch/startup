      - number: '3.3'
        title: 定价、切换成本和内部自建替代方案
        blocks:
          - type: paragraph
            body: >-
              在这个格局中，公开定价披露是例外，不是常态。Siemens 和 Altair 解释 token 和 unit 机制，但不公布费率。PhysicsX、Rescale、Monolith 和 BeyondMath
              在公开材料中都像销售主导模式。因此，最有用的定价信号不是标价，而是打包结构和买方经济性。PhysicsX
              本质上要求买家为速度、迭代能力和工作流压缩付费；既有厂商要求买家留在更广的许可证池内；开源路径则要求买家吸收人才和集成成本，而不是软件加价。


              因此，内部自建路径是真实存在的，尤其适合已经拥有求解器经验和 GPU 预算的成熟工程组织。OpenFOAM 和 SU2 仍然免费、成熟且技术可信；PhysicsNeMo 则在 PhysicsX
              瞄准的同一批广泛物理族上开源。PhysicsX
              自己的案例研究强化而非削弱了这一结论，因为它们显示产品训练于精英内部团队也可以生成的求解器输出。公司最好的防御不是内部自建不可能，而是对多数买家来说，搭建带有专有数据管线、不确定性管理、部署加固和持续模型运营的工业级软件栈，仍然又贵又慢。
