        - —
        - CIO 或自动化预算
        - 这些相邻，但不是 PhysicsX 需求的干净代理。
    notes: 边界逻辑把以 solver 为中心的工程支出，与更宽泛的工业 AI 叙事区分开。PhysicsX 主要参与物理驱动工程决策和验证已经重要的场景。
