companyProfile:
  summary: >-
    PhysicsX 是一家总部在伦敦的工业 AI 公司，正在为物理世界设计流程搭建 AI 原生工程平台。它的公开定位围绕 Large Physics Models、仿真数据编排和面向工程师的应用展开，帮助工业团队用更快的 AI
    辅助分析，替代受求解器速度限制的迭代。到 2026 年中，公司已从 2019 年注册、2020 年发布，推进到由 Temasek 领投的 $300 million Series
    C；公开客户和合作伙伴证据显示，它已在半导体、数据中心电力系统、高阶汽车和高性能工程项目中取得牵引。核心尽调约束仍是披露质量：外部人士可以验证融资事件和战略相关性，但无法仅凭公开证据足够精确地验证底层软件经济性，从而完全支撑新的后期价格。
  foundedDate: '2019-08-01'
  founders:
