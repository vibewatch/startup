  - id: TP003
    title: 定价 / 包装比较
    columns:
      - 路径
      - 价格 / 合同模型
      - 公开可见内容
      - 主要未知
      - 对买方的含义
    rows:
      - - PhysicsX
        - 定制企业合同
        - 无公开费率卡；叙事是咨询式平台 + 部署
        - 实际 ACV、使用量指标和续约经济性
        - 必须直接尽调定价权，不能从网站倒推
      - - Synopsys / Ansys
        - 企业套件订阅
        - AI 产品公开；定价仍由销售主导
        - AI 模块如何相对传统捆绑包定价
        - 捆绑能力可能比求解器标价更重要
      - - Siemens Simcenter
        - 命名用户 + 浮动 tokens
        - token 机制公开，但 token 费率不公开
        - 每个工作流或每个计算小时的有效成本
        - 灵活许可降低了既有 Siemens 客户的摩擦
      - - Altair Units
        - 可在 180+ 产品间共享的 units 池
        - units 模型公开；定价仍需联系销售
        - 真实 unit 经济性和跨产品组合折扣
        - 广泛 unit 池可把多种工具压进一份合同，从而提高切换成本
      - - Rescale
        - 企业平台 + 使用量经济性
        - 定价仍不透明；财务控制和版本公开
        - 转嫁利润率与软件加价之间的差异
        - 控制平面价值与计算治理混在一起，因此很难按席位与求解器厂商逐项比较
      - - Monolith AI
        - 演示驱动的企业销售
        - 无公开定价
        - 部署规模和支持成本
        - 最适合视为卖进特定验证痛点的项目或平台销售
      - - BeyondMath
        - 早期企业 / 项目访问
        - 融资和案例研究主张公开；定价不公开
        - 产品是否已有标准化包装
        - 商业成熟度仍是尽调问题的一部分
      - - 开源自建
        - 无软件许可证，但有人才和基础设施成本
        - OpenFOAM 和 SU2 免费；PhysicsNeMo 开源
        - 真实内部工程和 MLOps 负担
        - 软件便宜不等于总成本低；缺少专业人才时仍会很贵
    notes: 本表强调包装机制，因为整个竞争集的公开标价都很少。
