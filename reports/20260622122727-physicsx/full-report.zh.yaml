      - number: '8.2'
        title: 为什么故事有吸引力，也为什么仍然脆弱
        blocks:
          - type: paragraph
            body: >-
              看多理由不是想象出来的。PhysicsX 围绕工业工程中的真实痛点建设：昂贵仿真瓶颈、缓慢设计循环，以及从受 solver 约束的工作流转向 AI
              辅助迭代的需求。平台描述自洽，有具名模块、云和本地部署选项、明确的 CAE 集成，以及能嵌入客户项目的交付模型。行业足迹也有吸引力，覆盖航空航天、半导体、汽车、材料和能源；Siemens 与 NVIDIA
              合作表明，成熟生态玩家看到了这套 stack 的战略价值。但反向论点同样重要。PhysicsX 自己的技术材料说明，部分 neural-operator
              方法恰好会在投资人担心的环境里失效：冲击、非规则几何、严格边界条件和更高维工作负载。这不会否定业务，但意味着可重复性必须逐个工作负载证明。如果部署仍然狭窄、重专家或服务主导，平台叙事就不应享有类似公开市场软件公司的溢价。
