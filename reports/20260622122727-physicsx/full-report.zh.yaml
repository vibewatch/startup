  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              PhysicsX 更适合被界定为工程仿真之上的 AI 原生层，而不是泛工业 AI 公司。它自己的产品描述聚焦于把仿真、物理
              AI、数据和工程应用统一到产品生命周期中；合作伙伴和面向客户的材料，则把它放在航空航天、半导体、汽车、材料和能源项目里，物理预测在这些项目中塑造设计决策。这意味着相关市场包括
              CAE、由求解器支撑的工程分析、高价值数字孪生验证，以及压缩这些工作流的 AI surrogate 工具。它不包括大多数泛企业 AI、工厂自动化硬件和非工程
              SaaS。现状不是空白地带：Ansys、Siemens/Altair、Synopsys、Cadence 等既有厂商已经横跨流体、结构、电子、多物理场和数字孪生工作流，因此 PhysicsX
              必须作为叠加层或工作流升级胜出，不能假设买家从零开始。
