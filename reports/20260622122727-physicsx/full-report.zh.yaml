      - number: '5.2'
        title: 架构、运营模型和集成栈
        blocks:
          - type: paragraph
            body: >-
              公开架构指向一个相当有主张的运营模型。Simulation Workbench 是数据和编排层：PhysicsX
              将其描述为把仿真、实验和运营数据规范化、打标签、版本化，并在几何、网格、配置和结果之间保持可追溯的地方。AI Workbench 则架在该数据骨干之上，作为 Deep Physics Models、私有
              foundation models 和第三方模型家族的训练与部署环境。Engineering Applications
              是消费层，通过网页界面、APIs、专用边缘或制造部署暴露结果。产品设计成接入标准工程工具链，而不是直接替代它们；公开引用包括 ANSYS、CATIA、Siemens
              NX、OpenFOAM、STAR-CCM+，以及客户云和 air-gapped 部署模式。PhysicsX 自己的技术写作异常明确地说，这套软件栈不只是模型外面的 UI
              包装：它依赖编排、数据血缘、主动学习和反复的求解器支撑验证。这在技术上可信，也适合企业，但也揭示了实施负担：PhysicsX 必须在异构求解器生态、变化的云目标和定制客户环境之间，让抽象层保持稳定。
