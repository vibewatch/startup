            body: >-
              合理的公开市场视角，是粗略市值 / 收入，而不是因为它完美，而是因为当企业价值、利润率和净现金无法在同一处稳定披露时，这是最好的公开速记。使用 CompaniesMarketCap 的 2026 年市值和
              Macrotrends 的过去十二个月收入，Cadence 约 20.5x，Ansys 约 13.3x，Autodesk 约 5.9x，PTC 约 4.8x，四家公司区间约 4.8x 至 20.5x，中位数接近
              9.6x。对照这一区间，PhysicsX 的 $2.4 billion 估值显得昂贵，除非其隐藏收入基数已经相当可观。如果年化经常性收入只有 $50 million，本轮隐含约 48x。即便达到 $100
              million，仍约 24x，高于样本公开公司区间。只有当经常性收入大致超过 $120 million，价格才开始接近公开可比区间上沿；要接近中位数，则大约需要 $250
              million。因此，下方宽情景区间应被视为说明性的纪律工具，而不是点估计。
