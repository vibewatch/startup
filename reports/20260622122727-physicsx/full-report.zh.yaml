      - number: '3.2'
        title: 能力、信任和分发对比
        blocks:
          - type: paragraph
            body: >-
              核心比较不只是「谁有 AI」。既有厂商仍在广度、嵌入式工作流和采购肌肉上占优。Synopsys/Ansys 和 Siemens 可以把 AI 功能打包进更大的仿真、CAD、PLM 和 EDA 资产；Cadence
              则从 GPU 加速的经典仿真切入。Rescale 从另一个角度竞争：它把仿真执行、AI agents 和算力经济性包成一个控制平面，可以架在多种求解器选择之上。PhysicsX
              的反向定位，是在困难工业物理问题上做更深的 AI 原生加速，并配套客户特定微调和更紧密的工程工作流。


              信任和监管姿态同样不对称。Rescale 公开展示 FedRAMP、SOC 2、ISO 27001 和 ITAR 信号；Siemens 和 Synopsys 继承了几十年的企业与认证可信度；PhysicsX
              的公开信号在主权和工业合作伙伴上更强，在外部可读的认证细节上更弱。这不意味着 PhysicsX 在信任上薄弱，但确实意味着，在国防、航空航天、半导体或关键基础设施采购中，买家往往能比面对 AI
              原生新进入者时更快通过既有厂商和基础设施供应商的尽调。
