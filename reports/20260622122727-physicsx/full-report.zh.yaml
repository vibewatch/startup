    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与证明缺口
        blocks:
          - type: paragraph
            body: >-
              PhysicsX 显然已经跨过一个重要融资里程碑：公司自己 2026 年 6 月 8 日公告和 Pulse 2.0 都报道，其完成超额认购的 $300 million Series C，估值约 $2.4
              billion，由 Temasek 领投，M&G Investments 和 Intrepid Growth Partners 加入，既有投资人包括 Applied
              Materials、Atomico、NVIDIA、Siemens 等。此前 2025 年 Series B 扩展把估值推向 $1 billion，因此头部估值约一年内提升了约
              2.4x。问题不在于融资是否发生——它已经发生。问题在于，外部投资人能否独立支撑这个新价格。公开来源提供了相对增长表述、300 多名员工和 2026 年新股配发证据，但没有披露绝对收入基数、软件与服务
              mix、毛利率、留存或优先权结构；这些才决定该价格是高溢价但公平，还是只是太早。按今天估值，证明负担已经从愿景叙事转向硬经济证据。
