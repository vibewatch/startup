        - 已签约增长转化为产品化经常性收入，合作伙伴渠道加深，PhysicsX 证明可在多个工业项目中复制。
        - 如果经常性收入达到约 $200M-$250M，且市场继续为品类龙头支付高端工业软件倍数，估值为 $3.5B-$5.0B。
        - 需要私下数据证明软件式利润率、续约和多站点扩张。
        - 如果增长仍偏服务，高端倍数会消失。
      - - 基准
        - PhysicsX 具备战略相关性且仍在快速增长，但外部人只能看到经济性和可复制性的部分证明。
        - 如果经常性收入已高于约 $120M，但低于公开可比公司中位数区间隐含的规模，估值为 $2.0B-$3.0B。
        - 当前公开证据最支持这一判断：公司有吸引力，价格证明不足。
        - 即便平台不错，不透明的单位经济性也会限制上行。
      - - 熊市
        - 部署范围仍窄，技术边界比预期更重要，或公开工业软件倍数进一步压缩。
        - 如果市场在完整收入证明出现前，把业务重估到成熟工程软件区间，估值为 $1.2B-$1.8B。
        - 弱扩张、服务成分重，或可复制性证明延迟，都会触发该场景。
        - 后期轮资本结构可能放大新钱下行。
