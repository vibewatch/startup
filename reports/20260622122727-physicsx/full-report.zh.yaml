        title: 什么会击穿投资逻辑
        blocks:
          - type: paragraph
            body: >-
              一章好的后期估值分析需要明确淘汰标准，因为这里的错误，是把强故事误当成强入场点。第一个击穿点，是有证据显示部署仍主要项目制，无法跨站点、工厂或产品线转化为可重复、可扩张的软件收入。第二个，是技术证据显示
              PhysicsX 的最佳结果仅限于平滑、高度结构化的问题，而重要客户工作负载仍需要专家仿真团队和缓慢人工介入。第三个，是工程软件和 EDA 公开市场重置，而 PhysicsX
