              月的延期融资把 Series B 总额推至超过 $155 million，估值接近 $1 billion；2026 年 6 月又以约 $2.4 billion 估值完成 $300 million Series
              C。二手来源将总融资额放在约 $487 million 至 $500 million。Companies House 记录还显示，2025 年和 2026 年有多次股权表更新，包括截至 2024
              年的集团账目，以及 2026 年 2 月和 4 月新的 SH01 配股活动。Series C 资金用途很明确：全球扩张、加深美国布局、开设
              Singapore、建设平台能力，并继续对更大物理模型做前沿研究。缺失的是实际现金余额、烧钱速度、runway 或任何类似债务的算力承诺。因此，融资依赖是运营性而非生存性：如果
