      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              公开的创始人叙事有两点清楚，一点模糊。独立报道、融资公告和 2023 年退出隐身阶段的材料一致将 Jacomo Corbo 和 Robin Tuluie 识别为创始组合。当前材料中，Corbo 是 CEO
              兼联合创始人；Tuluie 被呈现为创始人或联合创始人兼董事长。两人都带来异常直接的 founder-market fit：Tuluie 曾在 Renault/Alpine、Mercedes Formula 1
              和 Bentley 任职；Corbo 曾联合创立 QuantumBlack，并做过 Formula 1 比赛策略。这对一家向复杂工程组织销售仿真提速和优化收益的公司来说，相关性异常强。


              2023 年以来，治理更专业化，但仍围绕创始人展开。Companies House 显示，Corbo 于 2023 年 1 月 1 日被任命为高级职员，Jim Baum 于 2023 年 10 月 20
              日加入董事会，Laura Connell 在 Atomico 领投 Series B 后于 2025 年 6 月 20 日加入董事会。About 页面还列出 Nicolas Haag
              为联合创始人兼仿真工程董事，这拓宽了技术创始班底，但也与多数融资报道使用的双创始人叙事之间形成轻微的创始人名单歧义。COO Alexander Dreismann 和北美负责人 Mark Huntington
              显示出公开可见的运营厚度，但关键人依赖仍集中在 Corbo 和 Tuluie 身上，因为资本市场、技术愿景和外部合作伙伴信息主要由他们主导。
