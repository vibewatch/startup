    rows:
      - - PhysicsX
        - AI 原生物理平台
        - 2026 年 Series C 轮估值约 $2.4B；收入和客户数同比增长超过一倍
        - 航空航天、汽车、半导体、能源、材料领域的工业工程团队
        - 面向客户定制的大型物理模型，加上嵌入式部署
        - 公开定价不透明，公开认证细节也比现有厂商更薄
      - - Synopsys / Ansys
        - 现有套件厂商
        - 2025 年后形成从硅到系统的合并技术栈，并有明确 AI 路线图
        - 大型企业仿真和半导体客户
        - 装机基础、广工作流覆盖、捆绑能力
        - AI 姿态仍叠在经典套件之上，集成还在推进
      - - Siemens Simcenter + Altair
        - 现有套件厂商
        - 多领域产品组合，包含 Simcenter X 和 Altair units 模型
        - NX / Teamcenter 客户、工业集团、受监管工程团队
        - 深度数字主线锁定、tokens / units 灵活性、宽仿真传承
        - 在共同客户中也可能成为 PhysicsX 的守门人或替代者
      - - Cadence Fidelity
        - 相邻现有厂商
        - 从电子 / EDA 基础延伸出的强 CFD 与 GPU 计算叙事
        - 航空航天、汽车、涡轮机械、电子热 / EM 买方
        - GPU 加速和软硬件集成
        - PhysicsX 式客户定制大型物理模型的证据较少
      - - Rescale
        - 工作流控制平面同类
        - 数百家企业客户，平台年化 HPC 支出超过 $1B
        - 管理大型仿真资产的研发负责人
        - HPC 编排、AI 代理、广合规姿态
        - 不掌握最深的专有求解器或物理模型护城河
      - - Monolith AI
        - 相邻专业厂商
        - 测试数据 AI，具备汽车背景和 NAFEMS 能见度
        - 验证、测试和产品性能团队
        - 基于真实测试数据的自学习模型和主动测试规划
        - 当前更贴近测试 / 验证，而不是直接面向多物理场仿真
      - - nTop
        - 上游工作流专业厂商
        - 成熟的计算设计平台，已用于先进工程
        - 设计和几何自动化团队
        - 位于仿真上游的设计空间探索和几何自动化
        - 不是直接求解器，也不能替代替代物理模型
      - - Akselos
        - 垂直专业厂商
        - 实时结构性能管理，且有量化能源成效
        - 关键基础设施、油气、LNG、海上风电运营商
        - 领域专用结构 ROI 和运营集成
        - 威胁最强的地方是狭窄垂直领域，而不是广义工业 CAE
      - - BeyondMath
        - AI 原生直接同类
        - 新融资，加上 Formula 1 和航空航天验证点
        - 需要快速设计探索的高性能工程团队
        - 基础物理定位，速度主张很强
        - 商业成熟度和定价在公开层面仍不够清晰
      - - 开源 + 内部自建
        - 现状 / 替代方案
        - OpenFOAM、SU2 和 PhysicsNeMo 免费且持续维护
        - 成熟 OEM 和内部 HPC / ML 团队
        - 最大控制权、无软件加价、复用现有求解器数据
        - 需要稀缺人才、MLOps 和部署加固，很多团队不具备
    notes: 各行归纳了严肃 PhysicsX 买方在 2026 年最可能纳入决策的替代项，包括替代方案和内部自建。
