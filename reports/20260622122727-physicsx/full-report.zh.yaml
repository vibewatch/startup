      - number: '2.5'
        title: 规模测算矛盾和应保留的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场章节应明确保留证据尚无法解决的问题。第一，没有针对「工业工程物理 AI」且方法可审计的独立公开市场估算，因此任何精确的 PhysicsX TAM 都是伪精确。第二，即便半导体 capex
              或数据中心扩张等相邻信号很强，如果不知道有多少份额流向仿真工作流，而不是硬件、服务或内部工程劳动力，也无法干净转化为软件 SAM。第三，当前买方证据仍指向叠加层采纳，而非替代求解器，意味着 SOM
              很大程度取决于集成、验证和变革管理，而这些大多是私下信息。最后，已发布估算冲突足够大，投资人应把它们视为边界标尺，而不是共识。这些矛盾有用：它们揭示了物理 AI
              一旦获得信任，公司可能超预期的地方，也揭示了保守工作流和既有生态继续主导时，采纳可能保持狭窄的地方。
