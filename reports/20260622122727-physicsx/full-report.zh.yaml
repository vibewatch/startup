    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与布局
        blocks:
          - type: paragraph
            body: >
              PhysicsX 将自己定位为一家英国创立的物理 AI 公司，为工业组织搭建 AI 原生工程平台。法律实体于 2019 年 8 月 1 日注册，最初名为 Motodynamics Ltd；后续公司材料称
              PhysicsX 于 2020 年启动。到 2026 年 6 月，公开公司页面和注册记录显示总部在伦敦，注册地址为 Victoria House, 1 Leonard
              Circus，运营办公室位于伦敦和纽约。2026 年 6 月的 Series C 新闻稿还称，公司正在扩大 Bay Area 和 Singapore
              布局；这一点重要，因为该轮融资明确绑定全球扩张，而非狭窄的英国足迹。


              产品层面，当前官网和平台材料描述的是一个统一软件栈，覆盖产品生命周期中的仿真、物理
              AI、数据和工程应用。披露的行业重点很广，但逻辑一致：航空航天与国防、半导体、材料、汽车和能源。因此，公司卖的是进入硬科技垂直行业的横向工程软件层，而不是单点设计工具。公开材料在工作流定位和集成广度上很强，但仍没有给出精确的
              2026 年收入基数、ARR 或客户集中度画像。
