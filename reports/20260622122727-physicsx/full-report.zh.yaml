  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和工作流界面
        blocks:
          - type: paragraph
            body: >-
              PhysicsX 并不把自己呈现为单一 surrogate 模型或一次性仿真器。公开产品故事是一套分层工程软件栈：先做仿真和数据编排，再加入物理 AI
              模型开发，最后落到面向工程师、适配既有产品开发工作流的应用。按客户语言，公司卖的是更快的概念探索、由求解器信息支撑的优化，以及跨设计、制造和运营的 AI 辅助运营决策支持，而不只是一个模型
              API。今天公开可见的最具体模块包括 Simulation Workbench、AI Workbench、Engineering Applications、平台服务，以及 LGM-Aero 和 Ai.rplane
              这一公开展示组合。工作流很明确：摄取 CAD、仿真和运营数据；构建可追溯数据集；训练或微调物理模型；通过应用、APIs 或边缘场景部署；并让人在验证和决策中保留参与。这个框架重要，因为它让 PhysicsX
              更接近工程操作系统，而不是独立 foundation-model 实验室；但它也意味着产品价值取决于集成纪律和交付执行，不只取决于模型质量。
