        - 需要更快通过型式认证，降低原型成本，并跑更多 EV / 自动驾驶迭代。
      - - 数据中心与基础设施硬件
        - 服务器、冷却、电力或基础设施设计团队
        - 热、电力和系统工程师
        - 基础设施或产品工程预算
        - 冷却、气流和功率密度优化
        - 产品副总裁 / 基础设施工程
        - AI 负载快速增长，功率包络也很紧。
      - - 工业机械 / 材料 / 能源
        - 工业 OEM 或流程运营商
        - 流程、热、机械和控制工程师
        - 卓越运营或资本开支预算
        - 设备优化、流程建模和数字孪生验证
        - 工厂技术或工程高管
        - 能耗、良率或停机成本足够高，足以支撑基于模型的优化。
    notes: 公开证据同时显示既有仿真支出和在现有工作流之上加一层 AI 的可信需求时，本买方图谱才把这些位置纳入。
