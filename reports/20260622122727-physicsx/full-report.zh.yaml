      - number: '7.3'
        title: 运营、模型可靠性与安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，PhysicsX
              的核心暴露在于，它把加速推理卖进了错误答案代价很高的工作流。平台承诺把仿真周期从数小时或数天压缩到数秒，并支持关键任务工程问题。这正是价值主张，但公司自己的材料反复加了限定：输出是近似值，模型准确度取决于用例和训练数据，不确定性需要校准；当几何、不连续、高频细节或严格边界条件占主导时，部分
              neural-operator 家族会失效。这不是完全回避公司的理由，而是把验证纪律列为第一运营控制的理由。


              PhysicsX 确实有运营缓释。平台 FAQ 称模型按客户定制，不跨客户联合训练；出现高不确定性区域时支持主动学习；高密级场景可用混合或本地部署。公司还宣布取得 ISO 27001
              认证，并称覆盖财务数据、知识产权、员工信息和第三方数据。对企业采用来说，这些控制有意义，尤其是在敏感工业环境里。但公开证据仍留下明显空洞：没有公开状态页、没有可见事故档案、没有公开产品
              SLA，也没有公开的数据泄露或正常运行时间指标，投资人无法判断韧性是结构性强，还是只是未披露。


              商业上，PhysicsX 的运营模型仍然服务密集。公司称前置部署工程师会直接嵌入客户项目，试点由双方共同界定、持续一到三个月，客户最终需要逐步成为独立用户。这带来典型 deeptech
              软件风险：公司能在高接触部署中证明价值，却仍可能难以把价值转化为可重复、可扩展的软件使用。如果试点仍高度依赖稀缺内部人才，经营杠杆和毛利率扩张会落后于融资与估值叙事。
