  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              PhysicsX
              的风险栈，最前面不是已知法律爆雷，而是验证与商业化。公司明确卖向航空航天与国防、半导体、汽车、能源、材料和数据中心基础设施，并把平台定位成关键任务、关乎安全的工程软件。与此同时，它自己的技术材料也说得很清楚：Fourier
              Neural Operators 等核心替代模型方法，在边界条件、几何、冲击和校准上都有边界；平台 FAQ
              也承认，即便有不确定性量化，输出仍是近似值。因此最高严重度风险很直接：一旦模型在安全、质量或正常运行时间关键的工作流中，被信任到超出已验证运行包线，错误会比普通企业软件 bug
              更快传导为客户责任、采用放缓或合同流失。


              下一层风险来自依赖与规模。PhysicsX 当前增长计划依赖大型云和算力伙伴，包括 Azure、AWS、CoreWeave、Deutsche Telekom 搭载 NVIDIA 的 Industrial AI
              Cloud，以及与 Siemens 相关的工具链和应用。这些合作能缩短采购、拿到 GPU 基础设施，是优势；但也把议价权和执行风险集中到 PhysicsX 控制之外。融资上，公司从 2025 年 6 月 $135
              million Series B，到 2025 年 11 月扩展后超过 $155 million，再到 2026 年 6 月约 $2.4 billion 估值、超额认购的 $300 million Series
              C。资本底座降低了近期破产风险，却显著抬高了市场对规模化、试点转化、交付吞吐和最终软件经济性的期待。


              法律和监管暴露真实存在，但更多是公开资料不足，而非已经出现负面事件。PhysicsX 有公开隐私声明和 ISO 27001 认证，但隐私声明日期停在 2022 年 10 月，仍指向旧 Shoreditch
              地址；Companies House 则显示后续办公地址已变更。公开材料没有找到产品级
              DPA、SLA、信任门户、事故记录、出口许可统计，也没有保留的诉讼或执法案件。正确解读不是风险不存在，而是尽调负担仍然很重：相对于 PhysicsX 瞄准行业的雄心，公开缓释证据明显偏薄。
