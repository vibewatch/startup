      - number: '5.4'
        title: 信任、安全、验证负担和未解技术缺口
        blocks:
          - type: paragraph
            body: >-
              与许多 deeptech 创业公司相比，PhysicsX 有更多公开信任材料，但对一家瞄准关键任务工程工作流的公司来说，这套材料仍不完整。正面信号包括 ISO 27001 认证、引用英国数据保护法和 GDPR
              的已发布隐私通知、明确的客户数据隔离主张、公开支持托管、客户云和 air-gapped 部署，以及反复强调不确定性量化、主动学习、求解器支撑验证和人类判断。这些都是工业 AI
              平台方向上不错的控制措施。未解决风险在于，公开证据仍比营销雄心薄。PhysicsX 自己的技术写作点明了负担为何真实：普通 FNO-style operators
              在冲击、严格边界条件、不规则几何、稀缺数据和更高维问题上表现吃力；其 LGM 材料提到有损压缩、latent-space 假设，以及针对小众几何微调的需求。公司还称完整 LGM-Aero
              基准论文仍待发布；已审阅公开语料没有说明 uptime
              指标、外部评估审计、客户工程数据的企业留存政策，或国防相邻工作负载的出口管制处理。对买家或投资人而言，这意味着平台看起来技术认真，但生产级承销仍取决于围绕基准、治理和特定领域验证的私下尽调。
