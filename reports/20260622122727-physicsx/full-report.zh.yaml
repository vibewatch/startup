    rows:
      - - 核心工程仿真 / CAE
        - FEA、CFD、结构、热、电磁和系统级仿真软件
        - 通用办公 AI 和非工程 SaaS
        - 工程领导层、仿真团队、产品开发
        - PhysicsX 必须在工作流层面附着或替代的核心存量支出。
      - - Physics-AI / 替代层
        - 加速 solver 设置、筛选、优化和设计空间探索的 AI 模型
        - 没有基于物理工作流集成的纯聊天机器人
        - CTO、工程 VP、仿真负责人、高级 R&D
        - 最接近 PhysicsX 价值主张的表达。
      - - EDA 相邻的物理系统分析
        - 芯片-封装-系统热分析、先进封装、3D-IC 和电子可靠性分析
        - 纯逻辑综合和非物理数字设计任务
        - 半导体和电子项目负责人
        - 重要，因为 PhysicsX 瞄准半导体，而从 silicon 到 systems 的边界正在变模糊。
      - - 数字孪生 / 验证层
        - 运营孪生、虚拟调试，以及与工程资产绑定的基于模型验证
        - 与工程模型脱节的通用 BI 仪表盘
        - 运营工程、产品工程、平台负责人
        - 在有支持的地方，把 PhysicsX 从设计延伸到运营。
      - - 云 / HPC 支撑的仿真交付
        - 弹性算力、安全浏览器部署、工程 solver 工作流自动化
        - 与工程工作流无关的商品化云支出
        - 工程 IT、平台工程、仿真 COE
        - 往往是让 AI 辅助仿真可规模化部署的预算路径。
      - - 排除的通用工业 AI
