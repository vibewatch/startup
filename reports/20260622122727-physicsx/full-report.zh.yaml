  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位 / 合同基础
      - 当前公开状态
      - 收入质量判断
      - 尽调要求
    rows:
      - - 企业平台部署
        - 横跨生命周期的核心 AI 原生工程平台
        - 协商式企业合同
        - 官方平台页面明确活跃
        - 如果复用占主导，可能具备扩展性
        - 索取样本 MSA 和收入确认政策
      - - 前置部署工程
        - 嵌入客户项目交付和工作流定制
        - 可能是限定范围服务或打包实施
        - 官方披露为嵌入式动作
        - 提高赢单率，但可能稀释软件利润率
        - 索取交付附加率和实施利润率
      - - 定制模型开发 / 微调
        - 定制模型架构、仿真管线、优化循环
        - 项目或扩张 SOW
        - 官方披露活动，定价未公开
        - ACV 更高，但可重复性不清楚
        - 索取 SOW 示例和续约路径
      - - 仿真和数据编排
        - Simulation Workbench、数据血缘、模型训练环境
        - 平台席位、用量或项目费未披露
        - 产品模块公开，变现方式未公开
        - 可能形成粘性的记录系统经济性
        - 索取 SKU 图谱，以及模块是否单独销售
      - - 主权 / 合作伙伴云部署
        - 合作伙伴计算基础设施上的 PhysicsX 应用层
        - 可能是平台费加托管部署经济性
