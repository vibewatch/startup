      - number: '1.4'
        title: 里程碑、合作伙伴和未解缺口
        blocks:
          - type: paragraph
            body: >
              2026 年的里程碑模式显示，PhysicsX 想成为基础设施，而不只是一个有趣的工程应用供应商。2026 年 3 月的一周内，它宣布了 CoreWeave 云合作、GB1 America's Cup
              部署、NVIDIA 标准倡议，以及围绕数据中心电力基础设施的 Siemens 协作。合起来看，这些里程碑意味着三条商业化路径并行：战略算力和分发、借顶级性能工程建立品牌、以及直接部署到 AI
              供应链瓶颈中的工业场景。2026 年 6 月 Series C 则为下一阶段扩张提供资金，包括 Singapore 和持续美国扩张。


              保留证据中最强的不利信号不是法律或监管，而是估值纪律。NewMarketPitch 认为，只有当 PhysicsX 把 backlog
              转化为大得多的已实现收入，并证明可复用平台模式而非服务密集型工程实践时，$2.4 billion 价格才说得过去。这一批评与真实的公开数据缺口一致：预订收入增长快于已确认收入，Corbo
              也称公司受供给侧约束。因此，进一步尽调应聚焦完整控制权图谱、2025/2026 年绝对财务数据、任何二级交易或债务，以及跨客户部署的可复用性。
