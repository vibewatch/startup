      - number: '5.3'
        title: Large Physics Models、部署模式和差异化
        blocks:
          - type: paragraph
            body: >-
              PhysicsX 的公开差异化论点，建立在把 foundation-style 模型与工业部署基础设施耦合起来。LGM-Aero 和 Ai.rplane 是最清晰的公开成果：公司和独立报道描述了一个 100M
              参数几何模型，训练于数千万个形状以及大量 CFD 和 FEA 数据，能够在几秒内生成并评分飞机概念，而不必等待反复数值求解。展示之外，PhysicsX 主张同一产品模式可推广到以专有数据训练的私有客户
              foundation models，由平台处理编排、带不确定性感知的再训练和工作流集成。合作伙伴让这种运营模型更容易部署：Siemens 把 PhysicsX 延伸进企业 CFD 和 CAE
              工作流，Microsoft 带来 Discovery 和 Azure 分发，Deutsche Telekom 与 T-Systems 带来欧洲主权工业部署，CoreWeave 带来大规模 GPU 训练。这是强
              go-to-market 架构，因为它降低买方摩擦，并把 PhysicsX 锚定在既有企业工具链中。代价是，部分护城河来自生态位置，而非纯技术排他性。扩大触达的同一张合作伙伴网络，也让 PhysicsX
              暴露在平台依赖，以及既有厂商在自家套件内产品化相邻 AI 仿真能力的风险下。
