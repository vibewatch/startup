      - number: '2.2'
        title: TAM/SAM/SOM 必须用多重视角划边界，不能只用一个泛 TAM
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只能支撑一个区间，而不是单一权威数字。较窄的 CAE 估算在 2026 年约 USD 7.64 billion 至 USD 11.53 billion 之间聚集；更宽的仿真软件估算在 2026 年达到
              USD 15.46 billion，若纳入相邻软件类别，总量会明显更大。差异主要来自范围，而非增长判断：有些发布方只统计核心 CAE 工具，另一些则纳入更广的仿真软件、服务、云交付和数字孪生工作流。对
              PhysicsX 来说，宽口径 TAM 因此是仿真软件市场；但更可辩护的 SAM，是一组更小的工程项目：虚拟验证已具战略意义，且买家能够支撑数据和算力要求。谨慎的 SOM
              还要更窄：这些项目中愿意在既有软件栈上增加 AI 层的那一部分。证据不支持精确的 PhysicsX 专属 TAM 点估计，这种不确定性应被保留。
