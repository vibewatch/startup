      - number: '7.2'
        title: 法律、监管与责任风险
        blocks:
          - type: paragraph
            body: >-
              PhysicsX
              的法律与监管画像，不是由某一起已知执法事件定义，而是由雄心很大的行业覆盖、陈旧的公开法律披露和产品责任不确定性共同塑造。公司公开称业务覆盖航空航天与国防、半导体、能源等先进工业场景；在这些场景里，出口管制、制裁、隐私和合同责任分配都可能成为门槛。BIS
              指引明确要求出口商判断哪些事项受 EAR 管辖、哪些需要许可证或例外；OFAC 则在与战略产业供应链直接相关的多个司法辖区维持制裁项目。PhysicsX 还在欧洲推广主权云部署，并支持高密级或混合 /
              本地环境，因此出口筛查和辖区合规不是理论负担，而是公司若干最有吸引力终端市场的 go-to-market 组成部分。


              隐私和企业合同风险，比公开诉讼风险更看得见。PhysicsX 网站公开的隐私声明称其遵守 UK Data Protection Act 2018 和 GDPR，并引导用户向 ICO
              投诉。这是有用的基线，但不等于完整公开的企业保证包。同一份文件最后更新于 2022 年 10 月，仍列出公司旧 Shoreditch 地址；Companies House 则显示，2024 和 2025
              年地址更新后，当前注册地址已在 Victoria House。对成熟买家来说，这个错位虽小但真实：公开法律卫生看起来没有明显跟上公司的规模、融资和受监管行业野心。


              最难的法律问题，是安全关键工程中的模型责任分配。PhysicsX 称其平台面向关键任务工程挑战，但自家技术文章也说明，标准 neural-operator
              方法不保证严格满足边界条件，也不适合冲击、不连续、非规则几何和部分高维问题。因此，保证条款、验证协议、人工签核和责任限制，都是核心尽调项。2026
              年本章采用的检索路径没有发现保留的公开诉讼或执法行动，但这只是证据缺口：登记页面和官网不能替代外部律师、案卷检索和客户合同抽样。
