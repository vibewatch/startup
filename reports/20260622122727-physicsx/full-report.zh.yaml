      - number: '2.3'
        title: 买方、用户、付款方和行业采纳路径
        blocks:
          - type: paragraph
            body: >-
              最可信的买方图谱，穿过那些物理性能、可靠性和上市时间重要到足以支撑重仿真支出的行业。多份市场研究中，汽车仍是单一最大建模细分；航空航天与国防、半导体和先进电子则对多物理场和系统级验证有特别强的需求。PhysicsX
              自己的材料和第三方故事显示，用例覆盖半导体设备开发、热设计和航空航天几何探索。实际日常用户是仿真专家、CAE 工程师、设计工程师，以及越来越多使用 copilots 或 surrogate
              工具的更广泛产品团队。经济买方通常是资深工程负责人、CTO 办公室、产品开发预算负责人或垂直项目负责人，而不是泛 AI
              预算。采纳路径也因细分而异：航空航天要求可追溯到求解器的验证；半导体买家关注封装和热复杂性；汽车买家强调虚拟验证和周期压缩；数据中心或电子项目则聚焦热、电力和基础设施约束。
