  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局和解决方案类别
        blocks:
          - type: paragraph
            body: >-
              PhysicsX 竞争的不是一两家 AI 原生创业公司。买家至少可以通过六条路径解决同一任务：Synopsys/Ansys 和 Siemens 的既有 CAE 套件；Cadence
              等相邻仿真软件栈；Rescale 等工作流控制平面平台；BeyondMath 等 AI 原生同业；Akselos、Monolith、nTop 等垂直专家；以及基于 OpenFOAM、SU2、NVIDIA
              PhysicsNeMo 的内部自建路径。这一点重要，因为采购很少从白纸开始。大型工程团队已经拥有求解器席位、脚本、验证流程和 CAD/PLM 连接，所以真实替代集合比创业公司同业名单更宽。


              PhysicsX 自己的证据也说明，竞争框架必须包括替代方案。平台接入既有工具，而不是要求 rip-and-replace；案例研究使用 OpenFOAM 生成的求解器数据；GTM
              倚重嵌入式工程师和合作伙伴渠道。换句话说，买家常常是在决定是否把 AI 原生加速层加到已安装的仿真软件栈上，而不是决定是否抛弃仿真这一类别。这个框架让开源和内部自建的重要性远高于典型 SaaS
              竞争页面所暗示的水平。
