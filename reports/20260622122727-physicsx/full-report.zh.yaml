      - number: '7.4'
        title: 伙伴、云与商业依赖风险
        blocks:
          - type: paragraph
            body: >-
              PhysicsX 的合作网络很亮眼，但也是最清晰的非技术剩余风险来源。平台称自己云无关，可在 AWS、Azure、混合或本地基础设施上运行；但公开增长叙事反复依赖具名算力和渠道伙伴。AWS 将 PhysicsX
              选入 Generative AI Accelerator。Microsoft 让 PhysicsX 成为 Microsoft Discovery 的发布伙伴，并推出私有 Azure Marketplace
              版本，同时另行称 Azure 是关键任务工程工作负载的基础。Deutsche Telekom 和 T-Systems 给 PhysicsX 带来欧洲主权分发和搭载 NVIDIA 的 Industrial AI
              Cloud。CoreWeave 为前沿模型训练提供专用 GPU 云。Siemens 把公司延伸进工业工作流和数据中心电力应用。每个伙伴都扩大触达；每个伙伴也都成为依赖节点。


              实际问题在于，算力、采购和客户语境的控制权集中。CoreWeave 和 Deutsche Telekom 重要，是因为 PhysicsX 明确表示，更大的 Large Physics Models
              需要在海量工作负载上持续获得高吞吐 GPU 算力。Microsoft、AWS 和 Siemens
              重要，是因为它们能加速企业分发，也会调解客户已经购买、保护和运营技术软件的环境。这意味着，即便产品需求健康，伙伴经济性、路线图变化、云可用性或战略一致性改变，也可能拖慢
              PhysicsX。欧洲主权云就是好例子：它强化 go-to-market，但也把部分投资逻辑绑到特定基础设施推出和伙伴主导的 onboarding 动作上。


              还有一层更隐蔽的依赖：既有工程工具链。PhysicsX 推广 ANSYS、CATIA、Siemens NX、OpenFOAM 和 Siemens Star CCM+
              连接器，这很务实，因为工程师不想拆掉现有系统。但这也意味着，集成复杂度、客户 IT 约束或第三方工具经济性变化，都可能拖慢采用。PhysicsX
              越是靠嵌入其他生态成功，投资人越需要监控：公司掌握的是战略层，还是只是改良了别人的技术栈。
