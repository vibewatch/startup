  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - 替代模型与工作流 AI
        - 正向
        - 当前
        - 可把迭代周期从数小时或数天压到接近数秒，并扩大设计空间探索。
        - 哪些客户工作流已经用 AI 做筛选，而不是最终签核？
      - - 云原生与浏览器交付
        - 正向
        - 当前至中期
        - 买方不必都自建固定集群，也能更广泛地使用高性能仿真。
        - PhysicsX 的采用在多大程度上取决于客户云政策和数据驻留要求？
      - - 半导体资本开支浪潮
        - 正向
        - 当前
        - AI 芯片和封装复杂度强化了对热、可靠性和多物理场工程的需求。
        - 哪些半导体子工作流会最先转化为有预算的软件需求？
      - - 数据中心电力与散热瓶颈
        - 正向
        - 当前至中期
        - 功率密度和冷却权衡更复杂，抬高了更快设计迭代的价值。
        - PhysicsX 卖进的是设施级设计、部件设计，还是运营优化？
      - - 航空航天复杂度与劳动力稀缺
        - 正向
        - 当前
        - 工程团队需要工具，让更少专家在可追溯前提下评估更多变体。
        - 哪些证据能证明 AI 输出已被受监管审查关口接受？
      - - 切换成本与沉没许可证
        - 负向
        - 当前
        - 现有平台让既有工作流保持粘性，也迫使初创公司走叠加集成路线。
        - 哪些集成能让 PhysicsX 成为增量能力，而不是要求客户推倒重来？
      - - 验证、信任与监督负担
        - 负向
        - 当前
        - 风险厌恶行业仍需要与可信求解器做基准对比，并控制部署范围。
        - 哪些独立证据能显示接近求解器的精度已在生产环境成立？
      - - 互操作性、治理与数据准备度
        - 负向
        - 当前
        - 工程数据杂乱、工具链不兼容，会拖慢从试点到生产的扩展。
        - 推广过程中，客户要承担哪些数据和模型治理负担？
      - - 计算、出口管制与基础设施瓶颈
        - 负向
        - 当前至中期
        - AI 基础设施仍受芯片管制、电力、电网和硬件可得性约束。
        - PhysicsX 对先进计算限制或 GPU 稀缺有多大暴露？
      - - 现有厂商整合
        - 混合
        - 当前至中期
        - 大平台拿到了分发和信任，但整合也给专用 AI 叠加层留下空白地带。
        - PhysicsX 能否比现有厂商复制功能更快地切入大平台技术栈合作？
    notes: 本表把每个驱动因素或约束都连到时间和尽调含义，而不是假设 AI 采用加速就会自动转化为即时软件支出。
