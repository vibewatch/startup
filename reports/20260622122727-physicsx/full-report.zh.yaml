      - number: '7.5'
        title: 财务、人才与投资逻辑击穿触发器
        blocks:
          - type: paragraph
            body: >-
              PhysicsX 的财务故事，需求最容易相信，软件经济性最难承销。公开材料支持强劲的收入动能：公司称确认收入同比翻倍、预订收入同比增长三倍、客户数增加一倍以上，2026 年 6 月员工数超过 300
              人；tech.eu 报道约 350 名员工、累计融资约 $500 million。这些信号很强，但没有回答 $2.4 billion 估值下最关键的问题：毛利率、烧钱速度、
              runway、客户集中度、续约质量，以及收入中有多少来自高接触交付而非可扩展产品使用，在本次审阅的公开材料中都未披露。


              人才和执行风险，就在财务不透明之下。PhysicsX 依赖异常稀缺的跨学科人才：仿真工程师、数据科学家、机器学习工程师、产品建设者，以及能嵌入硬核工业项目的前置客户团队。管理层厚度有所增强，Chris
              Wigley 加入担任 COO，Alexander Dreismann
              转向战略；但这项变化本身也说明，公司在全球商业规模化上仍需证明很多。招聘页面还强调英国和美国搬迁与签证支持，再次提醒投资人：招聘是国际化且竞争激烈的，不是常规动作。


              缓释因素是自洽的：ISO
              27001、客户专属模型、不确定性量化、混合部署、主权云伙伴和更深的运营班底，都能降低执行风险。但只要出现三类情况之一，投资逻辑就应被击穿。第一，生产工程工作流中出现验证或安全失败，会直接攻击信任。第二，伙伴或算力中断若实质性拖慢训练、部署或
              onboarding，就会暴露公司外部杠杆有多大。第三，如果公开或私下尽调显示，试点无法转化为可重复的软件经济性，当前估值就会显得远远跑在商业模式前面。投资人应把这些监控项视为不可谈判。
