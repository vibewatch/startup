        - 工业 / EDA 软件倍数显著压缩，而 PhysicsX 没有披露收入来抵消。
        - 后期私有估值往往会重新锚定公开可比公司。
        - 在价格重置或经济性披露前，不再追加资本。
      - - 股权结构悬顶
        - 优先权结构、反稀释或期权池扩张实质削弱普通股上行。
        - 即便运营执行良好，也未必转化为新钱可接受的回报。
        - 进一步接触前重建回报模型。
      - - 证明缺口持续
        - Series C 完成后，管理层仍无法披露队列收入、毛利率和留存。
        - 业务成熟却仍不透明时，确信度应下降。
        - 维持继续研究建议，或退出。
    notes: 每个触发项都可监测，并与估值传导绑定，而不是泛泛的公司质量担忧。
    claimRefs:
      - CV041
      - CV042
      - CV045
      - CV046
      - CV047
      - CV048
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 2025 和 2026 年实际经常性收入、签约到确认收入的桥接，以及按垂直行业拆分的软件与服务结构。
        - 这是判断 $2.4B 究竟是高端但公平、还是单纯过早的核心缺失变量。
        - CFO / 数据室请求；将管理层 KPI 材料与审计账目对齐。
      - - 留存和扩张
        - 毛留存、净留存、按客户队列的扩张，以及从部署到扩张的时间线。
        - 说明客户增长是在像软件一样复利，还是像咨询项目一样重置。
        - CRO 访谈，加上来自财务系统的队列表。
      - - 毛利率和交付强度
        - 按产品和交付模式拆分的毛利率，以及前置部署工程人员负载。
        - 服务偏重的运营模式不应拿到高端软件倍数。
        - CFO 和交付领导层尽调。
      - - 股权结构和优先权
        - 完整股份类别结构、清算优先权、反稀释保护和期权池计算。
        - 没有这些，新投资人的回报结果无法可信。
        - 外部律师参与的法律尽调和股权结构导出。
      - - 客户集中度
        - 头部客户收入占比、续约时间，以及部署能扩展到少数旗舰项目之外的证明。
        - 集中度过窄会让当前估值变脆。
        - 财务 + 销售运营导出，然后做客户推荐访谈。
      - - 退出准备度
        - 董事会层面对融资跑道、投行接触、二级流动性，以及现实 IPO 或战略退出时间的看法。
        - 后期入场价格下，持有期和下行保护更重要。
        - 董事会和投资人权利尽调。
    notes: 这些问题按其对建议、确信度和价格纪律的直接影响排序。
    claimRefs:
      - CV034
      - CV036
      - CV043
      - CV044
      - CV045
