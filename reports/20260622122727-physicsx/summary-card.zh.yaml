  topStrengths:
    - PhysicsX 用 Large Physics Models 和工作流软件压缩重仿真的工程周期，切中真实工业瓶颈。
    - 公司在当前阶段拿到罕见强的战略背书：Temasek、Siemens、NVIDIA、Applied Materials，以及其他工业或基础设施相关投资方和合作伙伴。
    - 来自 Siemens、Microsoft 和 GB1 的公开客户工作负载证据显示，平台用于关键工程问题，不只是沙盒试点。
  topRisks:
    - 关于绝对收入、毛利率、留存、服务占比和股权结构经济条款的公开披露仍太薄，无法有把握承销 $2.4B 估值。
    - 客户集中度可能不低；独立识别到的公开付费客户只有三家，积压订单和收入披露也很少。
    - 技术可复用性仍是现实风险，因为 PhysicsX 自家材料承认，部分 neural-operator 方法在激波、不规则几何、严格边界条件和其他硬物理工作负载上会吃力。
  unresolvedGaps:
    - 2025-2026 已确认收入、ARR、毛利率，以及按客户队列或垂直行业拆分的软件与服务占比。
    - 留存、扩张和集中度数据，包括最大客户收入占比、合同期限，以及部署能跨项目或站点扩张的证据。
