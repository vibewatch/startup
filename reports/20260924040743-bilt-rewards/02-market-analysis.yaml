  title: Market Analysis
  summary: Define the market, buyer, sizing, drivers, and constraints that govern adoption and valuation.
sections:
- id: market-boundary
  title: Boundary and substitutes
  body: Bilt does not fit neatly into one category. Its current market is the intersection of housing payments, resident engagement,
    and neighborhood commerce. That boundary matters because the company is not selling a generic loyalty point or a plain
    rent portal; it is trying to monetize payment flows, merchant traffic, and resident retention together. The official pages
    and partner case studies show that the buyers include renters, homeowners, property managers, and merchants. The practical
    substitutes are status-quo ACH or portal payments, rent-reporting tools, resident-experience software, and ordinary reward
    cards that never touch housing. The market thesis depends on those adjacent bundles remaining fragmented.
  claimRefs:
  - CM001
  - CM002
  - CM008
  - CM009
  tableRefs:
  - TM001
- id: size-and-growth
  title: Sizing, drivers, and growth logic
  body: The best-supported size proxies are the 109 million renter figure from Bilt's launch release, the 1-in-4 apartment-building
    footprint from the 2025 release, and the 40,000-plus merchant network the company now claims. Those numbers suggest that
    the market is large enough to support a multi-sided platform, but not yet so mature that one can rely on a clean TAM/SAM/SOM
    model. Growth is driven by the promise of no-fee housing payments, credit building, and member perks, while the platform
    benefits from each new property or merchant that deepens the network. The market remains attractive because the payout
    is tied to a large monthly bill and a social/financial benefit rather than a single discretionary purchase.
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM010
  - CM012
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: constraints-and-open-questions
  title: Constraints and open questions
  body: 'The main adoption constraints are operational rather than conceptual. Bilt must keep payments correct, customer support
    responsive, and bank or card partners aligned; otherwise the market loses trust quickly. The 2026 transition showed how
    fragile the experience can be when payment rails change. Public evidence also does not support a precise SAM or SOM, so
    any valuation logic that assumes a crisp market-share model would be overstated. The right diligence output is therefore
    a constrained market view: the market is real and large, but the bridge from platform footprint to durable monetization
    still depends on partner reliability and quantified retention that the company has not published.'
  claimRefs:
  - CM006
  - CM007
  - CM011
  tableRefs:
  - TM003
