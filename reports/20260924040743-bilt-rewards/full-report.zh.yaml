      - number: '2.3'
        title: 制约因素与待解问题
        blocks:
          - type: paragraph
            body: >-
              采纳的主要瓶颈在运营，不在概念。Bilt 必须确保扣款准确、客服及时响应，并让银行及发卡伙伴协同运作，否则市场信任会迅速流失。2026 年的切换暴露出支付通道变更时用户体验有多脆弱。公开资料也不足以精确估算
              SAM 或 SOM；据此建立明确市场份额假设来支撑估值，会显得过于乐观。尽调结论应保持克制：市场真实且规模大，但平台覆盖面能否变成持续收入，仍取决于伙伴可靠性和公司尚未公布的量化留存数据。
