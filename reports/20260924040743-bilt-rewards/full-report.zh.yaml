        title: 规模测算、驱动因素与增长逻辑
        blocks:
          - type: paragraph
            body: >-
              目前最可靠的规模代理指标包括：Bilt 上线公告提到的 109 million 名租客、2025 年公告声称覆盖 1-in-4 公寓楼，以及公司自称拥有 40,000
              多家商户。它们显示市场足以容纳多边平台，但尚未成熟到可以可靠套用总可用市场（TAM）/可服务市场（SAM）/可获取市场（SOM）模型。免手续费住房支付、信用积累和会员权益是增长驱动；新增物业和商户也会加深网络。市场吸引力来自住房每月的大额账单，以及相伴的社交或财务收益，而非一次性可选消费。
