              Jain，董事会也有多位重量级战略人士。产品把支付、商户权益和会员机制组合起来；信用卡只是入口之一。官方材料称，多数会员不用这张卡也会使用平台，说明网络已超出最初的信用卡切口。这些信息构成本报告后续分析的事实底座。
