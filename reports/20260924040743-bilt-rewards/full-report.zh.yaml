              年切换期间的情况表明，客服质量和支付准确性不是后台杂务，而是产品体验。路线图也正从信用卡扩展到更广的居住与社区商业平台，更多流程要跨更多伙伴运行，系统可靠性的要求随之提高。技术尽调要回答的是：架构能否持续扩容，又不让支付交付和客服质量成为瓶颈。
