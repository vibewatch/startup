  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态与会员工作流
        blocks:
          - type: paragraph
            body: >-
              Bilt
              面向消费者的产品是一款手机应用，底层连接发卡、支付路由、积分核算和商户权益。会员可用它缴房租或房贷、赚取积分，再兑换旅行或租金抵扣，并享受社区权益。相较最初的产品，如今的卡产品组合更复杂：Blue、Obsidian
              和 Palladium 三档对应不同的经济模型和奖励规则。更准确地说，Bilt 是一套工作流引擎：把住房支付转成奖励，再靠兑换和本地优惠留住用户。这比单纯发卡的产品故事更完整，但运营上也更脆弱。
