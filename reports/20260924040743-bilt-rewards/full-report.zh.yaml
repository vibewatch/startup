  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代品
        blocks:
          - type: paragraph
            body: >-
              Bilt 横跨房产科技、支付和会员奖励，竞争集合因此很杂：既有软件，也有支付流程，还有奖励产品。真正的替代方案是住户现有的缴租或获取回报方式——ACH / 门户付款、租金征信工具、RealPage
              等住户体验套件，以及普通旅行或返现卡。没有一个替代品覆盖整套服务，所以市场分散；但分散不等于 Bilt 有护城河。Bilt 仍须协调多类伙伴，并防止网络任何一端转向更简单的现有方案。
