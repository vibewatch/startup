              - CU003
              - CU005
              - CU006
      - number: '6.3'
        title: 集中度与证据缺口
        blocks:
          - type: paragraph
            body: >-
              账面上的客户群很广，实际仍集中在几类关系上：住房运营方、银行及支付伙伴、商户网络。多边关系带来多个增长杠杆，也会造成相关风险——网络一端受挫，其他环节可能连带受影响。由于留存率和客户集中度均无公开数据，尽调仍应保守。下次更新应优先补充队列留存和伙伴集中度，而不只是再统计合作方标识数量。目前证据能证明已有实质性采用，但要确认客户群可持续，还需要运营和客服持续保持高水准。产品仍依赖运营信任，客服质量因此格外重要。
            claimRefs:
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU005
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最高等级风险
        blocks:
          - type: paragraph
            body: >-
              最严重的风险都围绕对支付体系的信任。2026 年系统切换后，延迟或漏付、客服难以联系以及投诉激增都有公开记录。住房支付平台一旦交付出错，就不是小瑕疵，而是足以危及业务存续的产品级失败。其次是伙伴依赖：Bilt
              依靠 Cardless、Column、Fidem 及银行和支付通道维持流程；公开记录显示，通道层的问题很快会变成 Bilt 的问题。这些风险之所以关键，是因为它们摧毁网络效应的速度可能快过竞争对手。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR008
              - CR010
      - number: '7.2'
        title: 监管与合规风险暴露
        blocks:
          - type: paragraph
            body: >-
              参议院来函及相关公开报道显示，Bilt 正受到更严格的监管审视。美联储对 Evolve 的行动尤其值得关注：即使执法对象是合作伙伴，伙伴合规问题也可能波及 Bilt 的运营模式。Bilt 2.0
              的交易流程也更复杂，把借记式住房扣款与信用卡关联奖励结合起来，引出信息披露和时点问题。这里并不是说诉讼必然发生；而是 Bilt 已从用户友好的奖励产品叙事，走到需要更严格消费者保护控制的阶段。
            claimRefs:
              - CR002
              - CR004
              - CR007
              - CR008
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
              - CR011
      - number: '7.3'
        title: 缓解措施与逻辑证伪触发条件
        blocks:
          - type: paragraph
            body: >-
              已公开的缓解措施方向合理：把项目规则写得更清楚、引入新的发卡机构和服务商，并用客服工具减少混乱。但公司尚未公布足够证据，证明新支付架构已足够稳固。逻辑失效的触发条件很明确：款项再次丢失或延迟到账、投诉再次持续激增、合作伙伴再次失灵，或监管行动迫使
              Bilt 再次切换系统。这些事件打击的不只是市场情绪，也会动摇 Bilt 安全处理住房款项并提供奖励的核心承诺。在这些风险得到明确控制前，风险评级应维持高位。
            claimRefs:
              - CR003
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 评级建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              更新后的证据仍支持谨慎立场。Bilt
              是一家确有业务规模的公司，拥有庞大用户基础和丰富的合作网络；但其估值已领先于公开的单位经济和运营可靠性证据。结论不是直接回避，而是继续研究。现有最佳公开数据仍不足以建立精确的利润率、现金状况或队列模型；2026
              年切换又带来尚未消除的运营风险，在这些问题解决前，就难以对估值作出有把握的判断。投资建议取决于证据质量，不只取决于规模；目前证据还不足以支持更积极的判断。在公司披露更清晰的经济数据前，应继续保持保守，因为估值支撑仍主要来自推断。
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
      - number: '8.2'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景是 Bilt
              成为真正的住房商业网络：物业、商户和房贷业务采纳继续增加，公开经济数据最终跟上规模。基准情景是业务持续扩张，但披露仍不足以建立清晰的承销模型。悲观情景是支付和客服故障侵蚀信任，公司为留住网络不得不增加投入，而估值倍数收缩。在这组情景下，估值立场仍偏高：公司值得关注，也可能有很强的业务潜力，但现有证据还不足以支持买入判断。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV008
              - CV009
      - number: '8.3'
        title: 观点修正催化剂
        blocks:
          - type: paragraph
            body: >-
              如果 Bilt 披露更扎实的经济数据、证明 2026
              年切换已完全稳定，并表明房贷及商户变现能够长期持续而非只靠促销推动，投资观点会改善。若出现清晰的上市公司可比估值，或经审计的财务桥接分析，让隐含市销率更可信，也会改善判断。反过来，若再次发生支付交付事故、投诉再度激增，或伙伴转换再次损害信任，投资逻辑会进一步转弱。因此，投资判断对运营质量敏感，不只看增长。
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV009
              - CV010
