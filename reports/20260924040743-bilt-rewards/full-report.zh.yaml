      - number: '3.2'
        title: 定价、分销与切换成本
        blocks:
          - type: paragraph
            body: >-
              Bilt 的定价不止年费表，而是随卡片档位和住房活动变化的多层奖励体系。Blue 免年费，Obsidian 和 Palladium 则收费，因此更像高端奖励产品组合，而非基础工具。Bilt
              能嵌入物业管理流程或持卡人的日常习惯时，分销效果最好；但权益是否有吸引力仍依赖银行和商户伙伴。这也是核心竞争弱点：住户一旦失去信任，或运营方改用另一套工作流，Bilt 就只能靠服务可靠性竞争，不能只比功能清单。
