        title: 护城河韧性与反向证据
        blocks:
          - type: paragraph
            body: >-
              Bilt 的护城河存在，但并非牢不可破。它主要靠网络密度、支付准确性和伙伴协同，而不是单靠软件知识产权。公司及合作伙伴资料显示，Bilt 能为物业管理方和住户创造可见价值；但 2026
              年迁移也暴露出客服和支付问题会迅速损害品牌。同质化风险并非假设：如果 Bilt 无法维持服务质量，住户平台、银行伙伴或后来者都能复制部分体验。尽调重点不是产品构想是否巧妙，而是 Bilt
              能否守住信任和网络密度，避免整套服务被更简单的替代方案拆解。
