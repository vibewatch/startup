  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Bilt
              很难归入单一类别：住房支付、住户互动和社区商业三者交汇，构成它当前的市场边界。它卖的不是通用积分，也不只是租金支付门户，而是要把支付流水、商户客流和住户留存一起变现。官方页面和合作案例显示，服务对象包括租客、房主、物业管理方和商户。现实替代方案有常规
              ACH 或门户缴租、租金征信工具、住户体验软件，以及不涉住房场景的普通奖励卡。市场逻辑能否成立，取决于这些相邻服务是否仍各自分散。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
