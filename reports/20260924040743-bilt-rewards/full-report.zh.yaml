        title: 标杆案例与黏性韧性
        blocks:
          - type: paragraph
            body: >-
              最有力的证据来自实际生产部署。Related 的案例有分量：披露了具体房源数、租金流水和积分兑换情况；RealPage 则表明 Bilt
