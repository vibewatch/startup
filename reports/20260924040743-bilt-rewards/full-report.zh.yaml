        title: 系统架构与外部依赖
        blocks:
          - type: paragraph
            body: >-
              公开技术资料显示，Bilt 采用大量第三方集成的微服务架构，而非单体式信用卡应用。Cardless 和 Column 承担核心卡业务，银行连接、商户优惠和住户工作流则接入其余系统。dbt
              案例显示，其数据平台并非简单的配套系统，能够支撑高交易量；这与公司所称的规模已带来实际工程挑战相符。该架构更灵活，但也让 Bilt
              依赖多个外部系统的准确性和可用性。广泛集成帮助业务扩张，伙伴或客服流程一旦出故障，也会带来新的失效点。
