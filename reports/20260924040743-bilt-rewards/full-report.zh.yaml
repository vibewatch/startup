    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Bilt 不是单纯的 SaaS 订阅业务。公开证据指向由信用卡业务经济性、住房支付处理，以及商户或物业管理服务构成的混合模式；具体收入占比尚未披露。定价结构并不复杂：Blue 免年费，Obsidian 和
              Palladium 收年费，平台上的住房支付不收交易费。因此，Bilt 更像是把用户活动和合作伙伴资金流变现的平台，而非普通 SaaS
              厂商。关键不在于有没有标价，而在于这些价格背后的经济性是否足以支撑公司所称的规模。
