              估算可作粗略参照，但未经审计，不宜赋予过高权重。投资评估仍有一个问题未解：平台规模化后能否自我造血，还是仍靠补贴换取扩张？在 Bilt 披露更完整的单位经济数据前，稳妥的判断是：公司扩张很快，但增长质量仍不清楚。
