  title: Competitors
  summary: Identify direct, incumbent, adjacent, substitute, and status-quo alternatives, and assess differentiation durability.
sections:
- id: competitive-landscape
  title: Competitive landscape and substitutes
  body: 'Bilt sits between proptech, payments, and loyalty. That makes the competitive set messy: part software stack, part
    payments flow, part rewards product. The real substitutes are the routes a resident already has to pay rent or capture
    value: ACH or portal payments, rent-reporting tools, resident-experience suites like RealPage, and generic travel or cash-back
    cards. Because no one substitute fully overlaps the bundle, the market is fragmented, but fragmentation does not mean
    Bilt has a moat. It means Bilt must keep coordinating multiple partner types while preventing one side of the network
    from defecting to a simpler incumbent.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP006
  - CP010
  tableRefs:
  - TP001
- id: pricing-and-distribution
  title: Pricing, distribution, and switching costs
  body: 'Bilt''s pricing is not just an annual-fee schedule; it is a multi-layer reward ladder that changes with card tier
    and housing activity. Blue is no-fee, while Obsidian and Palladium add paid tiers, which makes the offering feel more
    like a premium rewards stack than a utility. Distribution is strongest where Bilt can ride a property-manager workflow
    or a cardholder habit, but the company still depends on bank and merchant partners to keep the promise attractive. That
    distribution dependence is the central competitive vulnerability: if resident trust drops or an operator prefers a different
    workflow bundle, Bilt has to fight on service reliability rather than on simple feature checklists.'
  claimRefs:
  - CP004
  - CP005
  - CP007
  - CP009
  tableRefs:
  - TP002
  figureRefs:
  - FP001
- id: moat-and-adverse-evidence
  title: Moat durability and adverse evidence
  body: 'The moat is real but not absolute. It rests on network density, payment correctness, and partner orchestration more
    than software IP alone. Company and partner materials show that Bilt can generate visible value for property managers
    and residents, but the 2026 transition also showed how quickly support and payment problems can damage the brand. That
    means commoditization risk is not theoretical: pieces of the experience can be copied by resident platforms, bank partners,
    or future entrants, especially if Bilt cannot maintain service quality. The underwriting question is therefore not whether
    the product is clever; it is whether Bilt can keep enough trust and density to prevent the bundle from decomposing into
    simpler alternatives.'
  claimRefs:
  - CP008
  - CP010
  - CP011
  - CP012
  tableRefs:
  - TP003
