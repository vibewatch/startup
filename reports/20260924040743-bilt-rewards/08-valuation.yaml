  title: Valuation
  summary: Convert evidence into recommendation, confidence, risk rating, valuation stance, scenarios, and diligence asks.
sections:
- id: recommendation
  title: Recommendation and stance
  body: The refreshed evidence still points to a cautious stance. Bilt is clearly a real company with meaningful scale, a
    large installed base, and a rich partner network, but the valuation has outrun the public evidence on unit economics and
    operational reliability. The result is not an automatic avoidance call; it is a research-more call. The best public data
    still does not support a precise margin, cash, or cohort model, and the 2026 transition adds a live operating risk that
    must be solved before the valuation can be underwritten confidently. The recommendation is therefore a function of evidence
    quality as much as scale, and current evidence quality is not yet high enough to justify a more aggressive call. The decision
    should remain conservative until the company publishes clearer economics, because valuation support is still mostly inferential.
  claimRefs:
  - CV001
  - CV004
  - CV006
  - CV011
  - CV012
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: scenarios
  title: Bull, base, and bear cases
  body: 'The bull case is a true housing-commerce network: more properties, more merchants, and more mortgage adoption, with
    public economics eventually catching up to the scale. The base case is growth with opacity, where the company keeps expanding
    but still lacks enough disclosure for a clean underwriting model. The bear case is that payment and support failures erode
    trust, forcing the company to spend more to retain the network while the multiple compresses. In that framing the correct
    stance remains stretched: the company is interesting and potentially powerful, but the evidence is not yet strong enough
    to support a buy-style call.'
  claimRefs:
  - CV002
  - CV003
  - CV005
  - CV007
  - CV008
  - CV009
  - CV010
  tableRefs:
  - TV002
- id: what-would-change-my-mind
  title: What would change the view
  body: The view would improve if Bilt published better economics, showed that the 2026 transition has fully stabilized, and
    produced evidence that mortgage and merchant monetization are durable rather than promotional. It would also improve if
    a clean public comp or audited bridge made the implied revenue multiple more believable. Conversely, the thesis would
    weaken further if the company suffered another payment-delivery incident, another complaint spike, or a partner transition
    that damaged trust again. That makes the investment decision sensitive to operating quality, not just to growth.
  claimRefs:
  - CV004
  - CV006
  - CV008
  - CV012
  tableRefs:
  - TV003
