        - CO003
  foundingLocation: New York, NY, USA
  headquarters: New York, NY, USA
  productSummary: >-
    Bilt sells an app-led loyalty platform, a housing-rewards card stack, and resident / merchant engagement tools that
    turn rent or mortgage activity into rewards and neighborhood commerce.
  customerFocus: Renters, homeowners, property managers, and local merchants
  businessModel: Payments, card economics, partner services, and neighborhood-commerce monetization
