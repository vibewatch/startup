chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, leadership, and current positioning
        blocks:
          - type: paragraph
            body: >-
              Bilt Rewards is now best understood as a housing-payment and neighborhood-commerce platform rather than a
              narrow co-brand card. The official pages and the 2026 financing release show a New York company with Ankur
              Jain as founder and CEO, plus a board that includes heavyweight strategic names. That matters because the
              current product is a bundle of payment flows, merchant benefits, and membership mechanics. The same
              official materials also make clear that the card is only one access path: a majority of members now use
              the platform without the card, which suggests the network is broader than the original card wedge. Those
              facts are the core ground truth for the rest of the report.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO012
      - number: '1.2'
        title: Funding, scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              The refresh materially updates the capital and scale picture. Bilt's own 2025 release says the company
              raised $250 million at a $10.75 billion valuation, while Tracxn tracks nearly $958 million of disclosed
              capital across five rounds. The company also claims 1-in-4 apartment buildings, more than 40,000
              merchants, and over 85% of members using the platform without the card. The App Store page adds a
              consumer-side usage signal with more than 4 million members and 224K ratings. Together those points show a
              company that has moved from product launch into an installed base, but still relies on self-reported or
              third-party-estimated metrics for core scale facts.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO008
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO003
              - CO004
              - CO010
      - number: '1.3'
        title: Open gaps and risk signals
        blocks:
          - type: paragraph
            body: >-
              The main unresolved items are still the ones that matter most for underwriting: exact cash, headcount,
              cap-table preference stack, and audited unit economics. The 2026 Senate letter also means the company
              cannot be evaluated only on growth rhetoric; it now carries a public complaint and service-delivery record
              around the transition. That combination leaves the base thesis intact but more fragile than the company
              narrative implies. The right diligence posture is to treat the disclosed growth metrics as directional
              while keeping the opaque financial and regulatory details in explicit gaps.
            claimRefs:
              - CO010
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO008
              - CO012
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Bilt does not fit neatly into one category. Its current market is the intersection of housing payments,
              resident engagement, and neighborhood commerce. That boundary matters because the company is not selling a
              generic loyalty point or a plain rent portal; it is trying to monetize payment flows, merchant traffic,
              and resident retention together. The official pages and partner case studies show that the buyers include
              renters, homeowners, property managers, and merchants. The practical substitutes are status-quo ACH or
              portal payments, rent-reporting tools, resident-experience software, and ordinary reward cards that never
              touch housing. The market thesis depends on those adjacent bundles remaining fragmented.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM008
              - CM009
      - number: '2.2'
        title: Sizing, drivers, and growth logic
        blocks:
          - type: paragraph
            body: >-
              The best-supported size proxies are the 109 million renter figure from Bilt's launch release, the 1-in-4
              apartment-building footprint from the 2025 release, and the 40,000-plus merchant network the company now
              claims. Those numbers suggest that the market is large enough to support a multi-sided platform, but not
              yet so mature that one can rely on a clean TAM/SAM/SOM model. Growth is driven by the promise of no-fee
              housing payments, credit building, and member perks, while the platform benefits from each new property or
              merchant that deepens the network. The market remains attractive because the payout is tied to a large
              monthly bill and a social/financial benefit rather than a single discretionary purchase.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM009
              - CM012
      - number: '2.3'
        title: Constraints and open questions
        blocks:
          - type: paragraph
            body: >-
              The main adoption constraints are operational rather than conceptual. Bilt must keep payments correct,
              customer support responsive, and bank or card partners aligned; otherwise the market loses trust quickly.
              The 2026 transition showed how fragile the experience can be when payment rails change. Public evidence
              also does not support a precise SAM or SOM, so any valuation logic that assumes a crisp market-share model
              would be overstated. The right diligence output is therefore a constrained market view: the market is real
              and large, but the bridge from platform footprint to durable monetization still depends on partner
              reliability and quantified retention that the company has not published.
            claimRefs:
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM008
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              Bilt sits between proptech, payments, and loyalty. That makes the competitive set messy: part software
              stack, part payments flow, part rewards product. The real substitutes are the routes a resident already
              has to pay rent or capture value: ACH or portal payments, rent-reporting tools, resident-experience suites
              like RealPage, and generic travel or cash-back cards. Because no one substitute fully overlaps the bundle,
              the market is fragmented, but fragmentation does not mean Bilt has a moat. It means Bilt must keep
              coordinating multiple partner types while preventing one side of the network from defecting to a simpler
              incumbent.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
      - number: '3.2'
        title: Pricing, distribution, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Bilt's pricing is not just an annual-fee schedule; it is a multi-layer reward ladder that changes with
              card tier and housing activity. Blue is no-fee, while Obsidian and Palladium add paid tiers, which makes
              the offering feel more like a premium rewards stack than a utility. Distribution is strongest where Bilt
              can ride a property-manager workflow or a cardholder habit, but the company still depends on bank and
              merchant partners to keep the promise attractive. That distribution dependence is the central competitive
              vulnerability: if resident trust drops or an operator prefers a different workflow bundle, Bilt has to
              fight on service reliability rather than on simple feature checklists.
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
      - number: '3.3'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The moat is real but not absolute. It rests on network density, payment correctness, and partner
              orchestration more than software IP alone. Company and partner materials show that Bilt can generate
              visible value for property managers and residents, but the 2026 transition also showed how quickly support
              and payment problems can damage the brand. That means commoditization risk is not theoretical: pieces of
              the experience can be copied by resident platforms, bank partners, or future entrants, especially if Bilt
              cannot maintain service quality. The underwriting question is therefore not whether the product is clever;
              it is whether Bilt can keep enough trust and density to prevent the bundle from decomposing into simpler
              alternatives.
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP009
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Bilt is not a plain subscription business. The public evidence points to a mix of card economics,
              housing-payment processing, and merchant or property-manager services, while exact revenue splits remain
              undisclosed. The visible pricing structure is easy to summarize: Blue is no-fee, Obsidian and Palladium
              add annual fees, and housing payments themselves carry no transaction fee through the platform. That makes
              the company look more like a platform that monetizes behavior and partner flows than like a simple SaaS
              vendor. The key financial question is not whether the product has a price; it is whether the economics
              behind those prices are strong enough to support the scale the company is claiming.
            claimRefs:
              - CI001
              - CI005
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
      - number: '4.2'
        title: Traction, volume, and capital
        blocks:
          - type: paragraph
            body: >-
              The current traction story is unusually ambitious. Bilt says it will cross $1 billion in revenue by Q1
              2026 and process more than $100 billion in annual housing spend, while dbt says the platform already
              processes more than $40 billion in annual rent and HOA payments. TechCrunch also reported company claims
              of nearly $20 billion in annualized member spend and EBITDA profitability in 2023. Those signals, if
              durable, would justify a large mark, but they are still mostly self-reported. Tracxn shows nearly $958
              million of disclosed capital, which is a reminder that the platform has already consumed substantial
              external financing to get here and likely still requires investment to broaden the network.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI006
              - CI009
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI008
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI010
              - CI011
      - number: '4.3'
        title: Undisclosed unit economics and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The biggest financial gap is still the same one investors care about most: no public gross margin, CAC,
              NRR, or runway. GetLatka's $52 million ARR estimate is useful as a rough revenue anchor, but it is not
              audited and should not be over-weighted. That means the underwriting question remains partially
              unresolved: is the platform genuinely self-funding at scale, or is it still being subsidized to accelerate
              reach? Until Bilt publishes better unit economics, the safest conclusion is that the company is scaling
              fast but still hides the exact quality of that growth.
            claimRefs:
              - CI007
              - CI008
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and member workflow
        blocks:
          - type: paragraph
            body: >-
              Bilt's product is a single consumer-facing app sitting on top of card issuance, payment routing, rewards
              accounting, and merchant benefits. Members can pay rent or mortgage, earn points, redeem through travel or
              rent credits, and participate in neighborhood benefits. The current card stack is more complex than the
              original product, because the company now offers Blue, Obsidian, and Palladium tiers with different
              economics and reward rules. The product is therefore best understood as a workflow engine: it turns a
              housing payment into a rewards event, then tries to keep the user in the ecosystem through redemption and
              local offers. That is a stronger product story than a plain card, but also a more operationally fragile
              one.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE012
      - number: '5.2'
        title: Architecture and dependencies
        blocks:
          - type: paragraph
            body: >-
              The public technical evidence shows a microservices environment with many third-party integrations, not a
              monolithic card app. Cardless and Column handle core card operations, while bank links, merchant offers,
              and resident workflows connect the rest of the system. The dbt case study suggests the data platform is
              non-trivial and supports a high transaction volume, which is consistent with the company's claim that
              scale has become a real engineering issue. That architecture creates flexibility, but it also makes Bilt
              dependent on the correctness and uptime of several external systems. In other words, the same integration
              breadth that enables growth also creates failure modes when partners or support processes break.
            claimRefs:
              - CE002
              - CE007
              - CE008
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE006
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE007
              - CE008
      - number: '5.3'
        title: Trust, support, and roadmap implications
        blocks:
          - type: paragraph
            body: >-
              Consumer trust is now a product feature. The App Store signal suggests the app is widely used and
              generally liked, but the 2026 transition made clear that support quality and payment integrity are part of
              the product, not just back-office details. The roadmap is also broadening beyond the card into a larger
              home-and-neighborhood commerce platform, which raises the bar for reliability because more workflows now
              have to work across more partners. The technical diligence question is therefore whether the architecture
              can keep scaling without making payment delivery and support quality the bottleneck.
            claimRefs:
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and adoption
        blocks:
          - type: paragraph
            body: >-
              Bilt's customer base is inherently multi-sided. A renter can be both the user and the economic
              beneficiary, but the platform also needs property managers and merchants to make the ecosystem valuable.
              That means adoption has to be read through several lenses at once: consumer members, housing operators,
              and neighborhood businesses. The public evidence shows real adoption, not just logos. Related Companies
              reports live units and large rent volumes, while the App Store shows millions of members. Those signals
              point to genuine usage, but they also imply that concentration and durability depend on whether the
              property-manager workflow and merchant layer stay valuable enough to keep the network sticky.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU010
              - CU012
      - number: '6.2'
        title: Named proof and durability
        blocks:
          - type: paragraph
            body: >-
              The strongest proof is production proof. Related's case study is meaningful because it gives concrete unit
              counts, rent volume, and redemption activity, and RealPage shows that Bilt can be embedded inside a real
              property-manager stack. That is stronger than a logo page or a generic testimonial. Durability, however,
              is not fully proven because Bilt does not publish churn, NRR, or cohort data. The 2026 transition further
              weakens the durability story by showing that service issues can quickly become a customer issue. So the
              customer thesis is real, but the retention thesis remains incomplete.
            claimRefs:
              - CU002
              - CU003
              - CU008
              - CU009
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
      - number: '6.3'
        title: Concentration and gaps
        blocks:
          - type: paragraph
            body: >-
              The customer base is wide on paper but still concentrated in a few relationship types: housing operators,
              bank/payment partners, and merchant networks. That gives Bilt multiple growth levers, but it also creates
              correlated risk if one side of the network stumbles. Because there is no public retention or concentration
              disclosure, the diligence posture has to stay conservative. The next refresh should prioritize cohort and
              partner concentration data, not just another logo count. For now, the evidence supports meaningful
              adoption but not full confidence that the customer base will remain durable without ongoing operator and
              support excellence. The product also still depends on operational trust, which is why support quality
              matters so much.
            claimRefs:
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU005
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Highest-severity risks
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risks are all concentrated around trust in the payment stack. The 2026 transition
              produced a public record of delayed or missing payments, difficult customer support, and a large spike in
              complaints. That is not a cosmetic issue; for a housing-payments platform, incorrect delivery is an
              existential product failure. The second major risk is partner dependence. Bilt now relies on Cardless,
              Column, Fidem, and bank/payment rails to keep the flow working, and the public record shows how quickly an
              issue at the rail level can become a Bilt problem. These are the risks that matter most because they can
              destroy the network effect faster than competition can.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR008
              - CR010
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The Senate letter and the underlying public reporting make clear that Bilt is now under a brighter
              regulatory microscope. The Fed action against Evolve is especially relevant because it demonstrates that
              partner compliance issues can bleed into Bilt's operating model even when the immediate enforcement action
              lands on the partner. The product flow itself is also more complicated now because Bilt 2.0 mixes
              debit-style housing debits with card-linked rewards, which invites disclosure and timing questions. The
              right reading is not that a lawsuit is guaranteed; it is that Bilt has moved from a consumer-friendly
              rewards story to a consumer-protection story that needs harder controls.
            claimRefs:
              - CR002
              - CR004
              - CR007
              - CR008
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
              - CR011
      - number: '7.3'
        title: Mitigations and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The public mitigations are directionally sensible: more explicit program documentation, new issuers and
              servicers, and support tooling that should reduce confusion. But the company has not yet published enough
              evidence to prove that the new stack is hardened. The thesis-break triggers are straightforward: another
              run of lost or delayed funds, another sustained complaint spike, another partner failure, or a regulatory
              action that forces another transition. Those events would not just hurt sentiment; they would undermine
              the core promise that Bilt can safely route people's housing payments while rewarding them. Until those
              triggers are clearly under control, the risk rating should remain high.
            claimRefs:
              - CR003
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and stance
        blocks:
          - type: paragraph
            body: >-
              The refreshed evidence still points to a cautious stance. Bilt is clearly a real company with meaningful
              scale, a large installed base, and a rich partner network, but the valuation has outrun the public
              evidence on unit economics and operational reliability. The result is not an automatic avoidance call; it
              is a research-more call. The best public data still does not support a precise margin, cash, or cohort
              model, and the 2026 transition adds a live operating risk that must be solved before the valuation can be
              underwritten confidently. The recommendation is therefore a function of evidence quality as much as scale,
              and current evidence quality is not yet high enough to justify a more aggressive call. The decision should
              remain conservative until the company publishes clearer economics, because valuation support is still
              mostly inferential.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
      - number: '8.2'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              The bull case is a true housing-commerce network: more properties, more merchants, and more mortgage
              adoption, with public economics eventually catching up to the scale. The base case is growth with opacity,
              where the company keeps expanding but still lacks enough disclosure for a clean underwriting model. The
              bear case is that payment and support failures erode trust, forcing the company to spend more to retain
              the network while the multiple compresses. In that framing the correct stance remains stretched: the
              company is interesting and potentially powerful, but the evidence is not yet strong enough to support a
              buy-style call.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV008
              - CV009
      - number: '8.3'
        title: What would change the view
        blocks:
          - type: paragraph
            body: >-
              The view would improve if Bilt published better economics, showed that the 2026 transition has fully
              stabilized, and produced evidence that mortgage and merchant monetization are durable rather than
              promotional. It would also improve if a clean public comp or audited bridge made the implied revenue
              multiple more believable. Conversely, the thesis would weaken further if the company suffered another
              payment-delivery incident, another complaint spike, or a partner transition that damaged trust again. That
              makes the investment decision sensitive to operating quality, not just to growth.
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV009
