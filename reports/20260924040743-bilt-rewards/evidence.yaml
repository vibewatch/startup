evidenceGaps:
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: Exact ownership, liquidation preference stack, and anti-dilution terms are not public.
    whyItMatters: Preference overhang affects downside analysis and exit value.
    diligencePath: Request latest cap-table summary and financing terms from management.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: access-blocked
    severity: minor
    topic: headcount
    missingEvidence: A current independent headcount source is not public.
    whyItMatters: Headcount is a useful scale proxy but not essential to establish the business model.
    diligencePath: Use LinkedIn or a third-party employee estimate in the next refresh if available.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: A public, independent TAM/SAM/SOM for housing-rewards and resident-engagement spend.
    whyItMatters: Without it the market size is only proxied by footprint claims.
    diligencePath: Pull a housing-spend or proptech analyst source in the next refresh.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: direct-peer
    missingEvidence: A clearly named direct rival with comparable housing-rewards scale.
    whyItMatters: Bilt may be more differentiated than a normal consumer card if no direct peer exists.
    diligencePath: Search for new entrants and landlord/merchant loyalty platforms in the next refresh.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: blocking
    topic: margin
    missingEvidence: A public gross-margin or contribution-margin bridge.
    whyItMatters: Without it, the business may be subsidizing growth without durable economics.
    diligencePath: Request a finance bridge or audited segment margin in the next diligence cycle.
    relatedQuestionRefs:
      - QI005
      - QI008
      - QI007
