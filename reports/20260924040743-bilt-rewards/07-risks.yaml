sections:
- id: risk-register
  title: Highest-severity risks
  body: The highest-severity risks are all concentrated around trust in the payment stack. The 2026 transition produced a
    public record of delayed or missing payments, difficult customer support, and a large spike in complaints. That is not
    a cosmetic issue; for a housing-payments platform, incorrect delivery is an existential product failure. The second major
    risk is partner dependence. Bilt now relies on Cardless, Column, Fidem, and bank/payment rails to keep the flow working,
    and the public record shows how quickly an issue at the rail level can become a Bilt problem. These are the risks that
    matter most because they can destroy the network effect faster than competition can.
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR005
  - CR006
  - CR010
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: regulatory-and-legal
  title: Regulatory and legal exposure
  body: The Senate letter and the underlying public reporting make clear that Bilt is now under a brighter regulatory microscope.
    The Fed action against Evolve is especially relevant because it demonstrates that partner compliance issues can bleed
    into Bilt's operating model even when the immediate enforcement action lands on the partner. The product flow itself is
    also more complicated now because Bilt 2.0 mixes debit-style housing debits with card-linked rewards, which invites disclosure
    and timing questions. The right reading is not that a lawsuit is guaranteed; it is that Bilt has moved from a consumer-friendly
    rewards story to a consumer-protection story that needs harder controls.
  claimRefs:
  - CR002
  - CR004
  - CR007
  - CR008
  - CR011
  tableRefs:
  - TR002
- id: mitigations-and-triggers
  title: Mitigations and thesis-break triggers
  body: 'The public mitigations are directionally sensible: more explicit program documentation, new issuers and servicers,
    and support tooling that should reduce confusion. But the company has not yet published enough evidence to prove that
    the new stack is hardened. The thesis-break triggers are straightforward: another run of lost or delayed funds, another
    sustained complaint spike, another partner failure, or a regulatory action that forces another transition. Those events
    would not just hurt sentiment; they would undermine the core promise that Bilt can safely route people''s housing payments
    while rewarding them. Until those triggers are clearly under control, the risk rating should remain high.'
  claimRefs:
  - CR003
  - CR009
  - CR012
  tableRefs:
  - TR003
