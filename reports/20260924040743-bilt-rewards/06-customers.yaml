chapter:
  number: 6
  title: Customers
  summary: Identify who pays/uses the product, the proof of real adoption, durability, expansion, and concentration risks.
    The customer base also spans merchant and property-manager relationships that must be kept healthy.
sections:
- id: customer-segments
  title: Customer segments and adoption
  body: 'Bilt''s customer base is inherently multi-sided. A renter can be both the user and the economic beneficiary, but
    the platform also needs property managers and merchants to make the ecosystem valuable. That means adoption has to be
    read through several lenses at once: consumer members, housing operators, and neighborhood businesses. The public evidence
    shows real adoption, not just logos. Related Companies reports live units and large rent volumes, while the App Store
    shows millions of members. Those signals point to genuine usage, but they also imply that concentration and durability
    depend on whether the property-manager workflow and merchant layer stay valuable enough to keep the network sticky.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: proof-and-durability
  title: Named proof and durability
  body: The strongest proof is production proof. Related's case study is meaningful because it gives concrete unit counts,
    rent volume, and redemption activity, and RealPage shows that Bilt can be embedded inside a real property-manager stack.
    That is stronger than a logo page or a generic testimonial. Durability, however, is not fully proven because Bilt does
    not publish churn, NRR, or cohort data. The 2026 transition further weakens the durability story by showing that service
    issues can quickly become a customer issue. So the customer thesis is real, but the retention thesis remains incomplete.
  claimRefs:
  - CU002
  - CU003
  - CU008
  - CU009
  - CU011
  - CU012
  tableRefs:
  - TU002
  figureRefs: []
- id: concentration-and-gaps
  title: Concentration and gaps
  body: 'The customer base is wide on paper but still concentrated in a few relationship types: housing operators, bank/payment
    partners, and merchant networks. That gives Bilt multiple growth levers, but it also creates correlated risk if one side
    of the network stumbles. Because there is no public retention or concentration disclosure, the diligence posture has to
    stay conservative. The next refresh should prioritize cohort and partner concentration data, not just another logo count.
    For now, the evidence supports meaningful adoption but not full confidence that the customer base will remain durable
    without ongoing operator and support excellence. The product also still depends on operational trust, which is why support
    quality matters so much.'
  claimRefs:
  - CU006
  - CU007
  - CU010
  tableRefs:
  - TU003
  figureRefs: []
