  title: Financials
  summary: Explain revenue model, unit economics, capital needs, and which financial inputs are insufficient for underwriting.
sections:
- id: revenue-model
  title: Revenue model and pricing
  body: 'Bilt is not a plain subscription business. The public evidence points to a mix of card economics, housing-payment
    processing, and merchant or property-manager services, while exact revenue splits remain undisclosed. The visible pricing
    structure is easy to summarize: Blue is no-fee, Obsidian and Palladium add annual fees, and housing payments themselves
    carry no transaction fee through the platform. That makes the company look more like a platform that monetizes behavior
    and partner flows than like a simple SaaS vendor. The key financial question is not whether the product has a price; it
    is whether the economics behind those prices are strong enough to support the scale the company is claiming.'
  claimRefs:
  - CI001
  - CI005
  - CI010
  tableRefs:
  - TI001
- id: traction-and-capital
  title: Traction, volume, and capital
  body: The current traction story is unusually ambitious. Bilt says it will cross $1 billion in revenue by Q1 2026 and process
    more than $100 billion in annual housing spend, while dbt says the platform already processes more than $40 billion in
    annual rent and HOA payments. TechCrunch also reported company claims of nearly $20 billion in annualized member spend
    and EBITDA profitability in 2023. Those signals, if durable, would justify a large mark, but they are still mostly self-reported.
    Tracxn shows nearly $958 million of disclosed capital, which is a reminder that the platform has already consumed substantial
    external financing to get here and likely still requires investment to broaden the network.
  claimRefs:
  - CI002
  - CI003
  - CI004
  - CI006
  - CI009
  - CI011
  tableRefs:
  - TI002
  figureRefs:
  - FI001
- id: undisclosed-economics
  title: Undisclosed unit economics and diligence gaps
  body: 'The biggest financial gap is still the same one investors care about most: no public gross margin, CAC, NRR, or runway.
    GetLatka''s $52 million ARR estimate is useful as a rough revenue anchor, but it is not audited and should not be over-weighted.
    That means the underwriting question remains partially unresolved: is the platform genuinely self-funding at scale, or
    is it still being subsidized to accelerate reach? Until Bilt publishes better unit economics, the safest conclusion is
    that the company is scaling fast but still hides the exact quality of that growth.'
  claimRefs:
  - CI007
  - CI008
  - CI012
  tableRefs:
  - TI003
