  title: Company Overview
  summary: Establish identity, leadership, funding, scale, and milestones that every later chapter can reuse as ground truth.
sections:
- id: identity-and-control
  title: Identity, leadership, and current positioning
  body: 'Bilt Rewards is now best understood as a housing-payment and neighborhood-commerce platform rather than a narrow
    co-brand card. The official pages and the 2026 financing release show a New York company with Ankur Jain as founder and
    CEO, plus a board that includes heavyweight strategic names. That matters because the current product is a bundle of payment
    flows, merchant benefits, and membership mechanics. The same official materials also make clear that the card is only
    one access path: a majority of members now use the platform without the card, which suggests the network is broader than
    the original card wedge. Those facts are the core ground truth for the rest of the report.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO011
  tableRefs:
  - TO001
  figureRefs: []
- id: scale-funding-milestones
  title: Funding, scale, and milestones
  body: The refresh materially updates the capital and scale picture. Bilt's own 2025 release says the company raised $250
    million at a $10.75 billion valuation, while Tracxn tracks nearly $958 million of disclosed capital across five rounds.
    The company also claims 1-in-4 apartment buildings, more than 40,000 merchants, and over 85% of members using the platform
    without the card. The App Store page adds a consumer-side usage signal with more than 4 million members and 224K ratings.
    Together those points show a company that has moved from product launch into an installed base, but still relies on self-reported
    or third-party-estimated metrics for core scale facts.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  tableRefs:
  - TO002
  figureRefs:
  - FO001
- id: gaps-and-risk-signals
  title: Open gaps and risk signals
  body: 'The main unresolved items are still the ones that matter most for underwriting: exact cash, headcount, cap-table
    preference stack, and audited unit economics. The 2026 Senate letter also means the company cannot be evaluated only on
    growth rhetoric; it now carries a public complaint and service-delivery record around the transition. That combination
    leaves the base thesis intact but more fragile than the company narrative implies. The right diligence posture is to treat
    the disclosed growth metrics as directional while keeping the opaque financial and regulatory details in explicit gaps.'
  claimRefs:
  - CO010
  - CO012
  tableRefs:
  - TO003
