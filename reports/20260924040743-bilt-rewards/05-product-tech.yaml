  title: Product & Technology
  summary: Explain what is delivered, how it works, maturity, dependencies, and product/technical risks.
sections:
- id: product-surface
  title: Product surface and member workflow
  body: 'Bilt''s product is a single consumer-facing app sitting on top of card issuance, payment routing, rewards accounting,
    and merchant benefits. Members can pay rent or mortgage, earn points, redeem through travel or rent credits, and participate
    in neighborhood benefits. The current card stack is more complex than the original product, because the company now offers
    Blue, Obsidian, and Palladium tiers with different economics and reward rules. The product is therefore best understood
    as a workflow engine: it turns a housing payment into a rewards event, then tries to keep the user in the ecosystem through
    redemption and local offers. That is a stronger product story than a plain card, but also a more operationally fragile
    one.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  tableRefs:
  - TE001
  figureRefs: []
- id: architecture-and-dependencies
  title: Architecture and dependencies
  body: The public technical evidence shows a microservices environment with many third-party integrations, not a monolithic
    card app. Cardless and Column handle core card operations, while bank links, merchant offers, and resident workflows connect
    the rest of the system. The dbt case study suggests the data platform is non-trivial and supports a high transaction volume,
    which is consistent with the company's claim that scale has become a real engineering issue. That architecture creates
    flexibility, but it also makes Bilt dependent on the correctness and uptime of several external systems. In other words,
    the same integration breadth that enables growth also creates failure modes when partners or support processes break.
  claimRefs:
  - CE002
  - CE007
  - CE008
  - CE011
  tableRefs:
  - TE002
  figureRefs:
  - FE001
- id: trust-and-roadmap
  title: Trust, support, and roadmap implications
  body: Consumer trust is now a product feature. The App Store signal suggests the app is widely used and generally liked,
    but the 2026 transition made clear that support quality and payment integrity are part of the product, not just back-office
    details. The roadmap is also broadening beyond the card into a larger home-and-neighborhood commerce platform, which raises
    the bar for reliability because more workflows now have to work across more partners. The technical diligence question
    is therefore whether the architecture can keep scaling without making payment delivery and support quality the bottleneck.
  claimRefs:
  - CE009
  - CE010
  - CE012
  tableRefs:
  - TE003
