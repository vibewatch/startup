companyProfile:
  summary: >-
    Bilt Rewards is a late-stage private loyalty and payments platform centered on rent, mortgage, and neighborhood
    commerce. It has grown from a rent-rewards card into a broader home-and-neighborhood network that includes merchant
    benefits, property-manager workflows, and a multi-tier card stack. Public evidence shows real adoption and a large
    valuation mark, but the company still withholds the key economics needed to underwrite the business with confidence.
