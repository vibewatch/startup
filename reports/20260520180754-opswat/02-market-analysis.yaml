  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-som-granularity
    missingEvidence: A management view of product revenue mix, critical-infrastructure customer count, vertical mix, and attach rates across OT security, access, file security, kiosk, and transfer products.
    whyItMatters: Without product and customer mix, public TAM can be bounded but public SAM and SOM cannot be isolated credibly enough for valuation work.
    diligencePath: Request product-line ARR, customer counts by vertical, average contract value by module, and management's internal market-segmentation model.
    relatedQuestionRefs:
    - QM010
    - QM011
    - QM028
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: sector-budget-ownership
    missingEvidence: Sector-specific procurement or budget documents showing who actually signs for utilities, pipelines, transport, manufacturing, and government OT security programs.
    whyItMatters: Public survey data prove budget fragmentation at the market level, but they do not provide contract-level buyer and payer detail for each critical-infrastructure segment.
    diligencePath: Collect RFPs, procurement records, or customer references that identify the signatory budget owner, deployment sponsor, and funding source by sector.
    relatedQuestionRefs:
    - QM012
    - QM015
    - QM016
    - QM017
    - QM018
    - QM019
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: minor
    topic: market-sizing-overlap
    missingEvidence: A single public dataset that cleanly nets out overlap among OT security, NAC, file sanitization, removable media, and cross-domain transfer categories.
    whyItMatters: Published category forecasts overlap and use different horizons, so any broad addressable-market number can be overstated without an overlap adjustment.
    diligencePath: Rebuild sizing from bottoms-up customer workflow data or a management segmentation model instead of summing top-down category reports.
    relatedQuestionRefs:
    - QM009
    - QM010
    - QM028
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: sales-cycle-benchmark
    missingEvidence: Public benchmarks for pilot-to-production conversion, deployment timelines, and renewal patterns specific to OT visibility, secure access, and media or transfer controls in critical infrastructure.
    whyItMatters: Threat and compliance pressure are visible, but the commercial conversion rate from urgency to paid deployment remains hard to quantify without better sales-cycle evidence.
    diligencePath: Request pipeline conversion metrics, implementation timelines, and cohort retention data from management or channel partners.
    relatedQuestionRefs:
    - QM025
    - QM026
    - QM027
    relatedTableRefs:
    - TM004
