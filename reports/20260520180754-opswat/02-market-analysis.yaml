- id: buyer-user-payer-and-sector-map
  title: Buyer, user, payer, and sector map
  body: 'The buyer map is multi-threaded because OT cyber budgets sit between security, operations, and compliance. The strongest public budget evidence comes from the SANS/OPSWAT survey, which shows that OT cybersecurity is viewed as a primary responsibility by many respondents, yet budget decisions are led by CISOs or CSOs in only 27% of cases and are more commonly shared between IT and OT or controlled by IT. Fortinet shows the other side of the same market: direct OT-security responsibility is moving to the C-suite, with more than half of respondents saying the CISO or CSO now owns it. Taken together, these results imply a practical split between executive sponsorship and day-to-day budget ownership. Sector overlays then determine who actually signs. Utilities and grid operators buy against NERC CIP, FERC, and resilience mandates; pipelines buy against TSA implementation and incident-response requirements; manufacturers buy against uptime, ransomware, and supply-chain disruption; and
    government or defense operators buy against separation, accreditation, and mission-assurance needs. Users are equally mixed: plant engineers, OT security teams, control-room staff, incident responders, integrators, and remote vendors all touch the workflow. For OPSWAT, that means the commercial motion likely succeeds when it can unite asset visibility, compliance reporting, secure access, removable-media hygiene, and trusted file or data transfer under one operating narrative rather than selling a single point tool to a single budget owner.'
