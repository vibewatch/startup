tables:
- id: TM001
  title: Market definition and spend boundary
  columns:
  - Category / segment
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to OPSWAT
  rows:
  - - Core OT / ICS cyber platform
    - Asset visibility, network monitoring, vulnerability management, segmentation support, compliance reporting
    - Generic enterprise endpoint or SIEM budgets not tied to plant operations
    - CISO / OT security lead with operations co-sponsor
    - Direct core fit
  - - Secure remote and device access
    - Endpoint compliance, NAC-style policy enforcement, remote vendor access, just-in-time OT access
    - Broad workforce identity spend without OT or device-control requirements
    - Security architecture plus infrastructure / OT access owner
    - Direct adjacency for MetaDefender Access
  - - File security and CDR
    - Multiscanning, Deep CDR, file-based vulnerability checks, supply-chain file screening, secure MFT use cases
    - General email security or DLP budgets without industrial or sensitive-transfer context
    - Security operations, SOC, or regulated operations team
    - Direct adjacency for MetaDefender
  - - Removable media ingress control
    - USB and peripheral scanning kiosks, media sanitization at plant entry, portable-media policy enforcement
    - Generic endpoint AV spend that never governs media ingress to critical sites
    - Plant operations, OT security, or site compliance owner
    - Direct adjacency for MetaDefender Kiosk
  - - Cross-domain / one-way transfer
    - Data diodes, unidirectional gateways, cross-domain transfer, secure OT-to-IT data publishing
    - General network routing or broadband spend
    - Mission owner plus security / engineering
    - Adjacent niche for NetWall and diode-style offerings
  - - Over-broad enterprise cyber stack
    - General EDR, firewall, IAM, cloud-security, and productivity security programs
    - Not excluded if explicitly solving OT ingress, visibility, or secure transfer problems
    - Central IT or enterprise security budget
    - Usually too broad unless tied to critical-infrastructure workflow
  notes: Boundary logic centers on industrial control points where OPSWAT has direct product evidence. Generic enterprise-security categories are excluded unless the spend explicitly secures OT/ICS visibility, access, file ingress, media ingress, or cross-domain transfer.
