- id: sizing-lenses-and-constrained-market
  title: Sizing lenses and constrained addressable market
  body: 'The cleanest public numeric lens is the OT security market itself, not a single OPSWAT-specific SAM. MarketsandMarkets projects OT security from USD 23.47 billion in 2025 to USD 50.29 billion by 2030, while Mordor places the market at USD 22.15 billion in 2025, USD 25.19 billion in 2026, and USD 47.95 billion by 2031. Those estimates are directionally aligned on market size and growth, but they still show why diligence should preserve contradictory figures instead of averaging them away. Adjacent categories are materially smaller. MarketsandMarkets'' CDR forecast reaches only USD 0.5 billion by 2026, and its data-diode forecast reaches USD 0.72 billion by 2030. Those adjacencies matter strategically because OPSWAT sells into them, but they do not justify exaggerated claims that the company participates in the entire critical-infrastructure cyber stack. A constrained reading is therefore the most defensible: the core published market is roughly low-to-mid USD 20 billions today, while
    broader control-point spend rises only modestly when published file-sanitization and one-way-transfer categories are added. Public evidence does not isolate how much of NAC, remote access, removable media, or secure transfer spend is truly industrial and critical-infrastructure specific, so SAM and SOM remain diligence items rather than public facts. The most honest market conclusion is that OPSWAT operates in a real, growing, and compliance-sensitive market, but one whose public TAM gets noisy quickly once adjacencies and overlap are added.'
