companyProfile:
  summary: >
    OPSWAT is a private, founder-led cybersecurity company headquartered in Tampa, Florida,
    focused on prevention-first security for critical-infrastructure and regulated IT/OT
    environments. Its public product suite centers on MetaDefender, MetaDefender Access, and
    MetaDefender OT Security, and the company says it serves more than 2,000 customer
    organizations with more than 1,000 employees as of 2026. Public sources confirm a single $125
    million Brighton Park Capital growth investment in 2021, but not a later KKR-led round or a
    supportable current ~$1.8B valuation; audited ARR, revenue, gross margin, and cap-table data
    remain undisclosed.
  foundedDate: "2002-01-01"
  founders:
