      background: >
        Founded OPSWAT in 2002 and remains the company's public founder-operator and primary
        strategic spokesperson.
      claimRefs: [CO001, CO007]
  foundingLocation: San Francisco, California, USA
  headquarters: Tampa, Florida, USA
  productSummary: >
    OPSWAT's public platform centers on MetaDefender for file and threat prevention,
    MetaDefender Access for secure access and endpoint-compliance controls, and MetaDefender OT
    Security for OT visibility and monitoring. Public materials emphasize prevention-first
    deployment at regulated IT/OT boundaries rather than a pure-play SaaS security workflow.
  customerFocus: >
    Critical-infrastructure operators, government agencies, and other regulated enterprises that
    need malware prevention, file sanitization, secure transfer, and OT/ICS security controls.
  businessModel: >
    Public materials indicate a mix of software, appliances, and related services sold into
    regulated environments, but exact pricing, revenue mix, and margin profile are undisclosed.
  stage: Private
  fundingStatus: >
