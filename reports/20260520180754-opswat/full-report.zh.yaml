      - number: '6.3'
        title: 采用轨迹、直接证明客户与证据质量
        blocks:
          - type: paragraph
            body: >-
              OPSWAT 公司声称的采用轨迹方向上很强：公开更新从 2021 年 1,000+ 个组织，走到 2024 年 1,700+ 个客户，再到 2026 年
              2,000+。独立证据也显示产品周边有相当大的表面积。CaseStudies.com 索引了 24 个 OPSWAT 成功案例；FeaturedCustomers 显示 70 条评论和证言、65 个案例研究、19
              个视频和 154 个客户参考；Gartner 和 G2 仍有活跃评论存在；PeerSpot 保留了企业用户对功能、成本和部署的意见。但这些表面并不等价。直接证明的生产或长期客户远少于
              2,000+，硬证据密度也因细分市场而差异很大。有些故事深且运营性强——EPAM 从 3,000 台设备 POC 扩展到近 40,000 名用户，Upwork 每天处理数百万个文件，Abdi Ibrahim
              每天处理 18,000+ 个文件，公共电力公用事业每个设施每天扫描 1,000
              台设备。另一些则只是引用层级的参考，除了头衔和证言外几乎没有部署深度。这在公司声称的广度和直接证明的深度之间留下清晰分裂。本章的需求结论因此应最重视有工作流细节、公开采购或独立索引的客户，同时把更宽的 logo
              wall 视为线索名单，而不是生产部署或续约质量的经审计证明。
