      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 传闻 $1.8B 价格下应继续研究——证据不足以承销该价格
            body: >-
              在约 $1.8B 的价格上，投资者为一家不披露绝对收入、毛利率、NRR 或优先股堆叠的公司支付 12-15x 代理 ARR。可比集合（Dragos 11x ARR；Nozomi 战略 M&A 退出 13x
              收入）显示，$1.8B 要求 OPSWAT ARR 达到或超过 $140M，且倍数位于 OT 私有市场区间顶部——两者都无法在没有数据室的情况下验证。建议是继续研究：不是否定 OPSWAT
              的质量，而是拒绝为未确认信息定价。如果经审计 ARR、毛利率和股权结构数据确认乐观情景假设，那么在 $1.3B 或以下（基准情景公允价值）给出买入判断才有根据。
