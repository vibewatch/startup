      - number: '8.2'
        title: 公开和私有可比估值分析
        blocks:
          - type: paragraph
            body: >-
              OT 和关键基础设施网络安全的可比公司集合不大，但信息量足。Dragos 是最直接的私有可比：其累计融资 $440M、估值 $1.7B——在 2021 年 Series D 和 2023 年 Series D
              延长期中保持不变——对应 GetLatka 的 $154.4M ARR 估计，隐含约 11x ARR。TechCrunch 确认 $1.7B 投后估值连续两年持平。Nozomi Networks 于 2026
              年初被 Mitsubishi Electric 以总对价约 $1B 收购（此前未持有的 93% 股份对应 $883M 现金）。Nozomi 2024 年收入为 $75M（高于 2023 年的 $62M），使这次
              M&A 退出约为 13x 收入——这是战略买家溢价。Claroty 在 2025 年由 Golub Growth 领投的 Series F 中融资 $150M，据报道估值增长 80% 至约 $3B；Claroty
              累计融资约 $900M，服务 Fortune 100 中的 24 家，融资规模明显大于 OPSWAT。


              公开市场方面，PANW、SentinelOne 和 Fortinet 锚定了网络安全估值谱系。PANW 报告 FY2025 总收入 $9.2B（增长 15%），NGS ARR 为 $5.6B、增长 32%；在
              $200B 市值下，交易倍数约为 22x 往绩收入——这个溢价反映规模、盈利能力和平台化。Fortinet 2025 年收入 $6.8B，净利润 $1.85B（27% 利润率）；在 $63.6B
              市值下，交易倍数约 9x 收入。SentinelOne 的 LTM 收入 $1B、净利润 $84M，标志近期盈利拐点；在 $5B EV 下，交易倍数约 5x EV/收入。这些公开可比覆盖 5-22x
              收入，反映的是规模、利润率和增长率差异，而这些差异在 OPSWAT 的公开记录中不可见。


              套到 OPSWAT 上，相关的私有 OT 走廊是 10-13x ARR（Dragos 11x，Nozomi M&A 退出约 13x），不是 PANW 的 22x 溢价。若以 $1.8B 假设入场、GetLatka
              代理 ARR 为 $121.8M，隐含倍数约为 14.8x ARR——高于私有 OT 走廊。如果 OPSWAT 实际 ARR 更高（例如 $140-160M），隐含倍数会降到
              11-13x，但仍处在可比区间顶部。没有确认 ARR、毛利率、NRR 和优先权悬置之前，$1.8B 在任何情景下都不显得明显便宜。
