      - number: '8.3'
        title: 情景分析、入场纪律和估值立场
        blocks:
          - type: paragraph
            body: >-
              乐观情景（20-25% 概率）：OPSWAT 的 ARR 为 $140-160M，增速 25%+，产品组合向高毛利经常性软件改善，毛利率高于 65%，且没有未披露的高级优先权。公司干净解决 Tampa
              租约纠纷，维持渠道扩张，并借联邦和国际 OT 监管浪潮加速。投资者支付 12-14x ARR，隐含公允价值 $1.68B-$2.24B。在这一情景下，$1.8B 位于公允价值低端，对一个有 4-7 年耐心、等待
              IPO 或类似 Nozomi 约 13x 收入战略 M&A 退出的投资者，是有吸引力的入场点。乐观情景要求确认 ARR 达到或超过 $140M，且毛利率超过 65%。


              基准情景（50-55% 概率）：OPSWAT 的 ARR 为 $120-140M，增速在 20% 多的中段，与披露的增长说法一致。以 Dragos 持平的私有估值为锚，市场出清倍数为 10-11x，隐含公允价值
              $1.2B-$1.54B。若按 $1.8B 投资，投资者相对基准情景支付 17-50% 溢价。只有当投资者确信近期 ARR 增长会加速、利润率扩张可见，或存在公开记录看不到的战略退出可选性时，这个溢价才合理。在
              $1.8B 下，基准情景数学意味着在任何稀释、优先权悬置或倍数压缩之前，回报已经为负。


              悲观情景（25-30% 概率）：OPSWAT 的 ARR 为 $90-110M（GetLatka 高估），硬件和服务占比拖累毛利率低于 55%，公司需要新资本来维持 22 个办公室的布局。压缩后的 7-9x
              倍数隐含公允价值 $630M-$990M。若按 $1.8B 入场，悲观情景意味着相对入场价减记 45-65%。悲观触发条件包括收入增长降到 15% 以下、IPO
              窗口失败、以稀释性条款进行新融资，或利润率证据与软件收入叙事相矛盾。


              入场纪律：在约 $1.8B 的价格上，投资者实际上同时支付了乐观情景 ARR 和基准情景顶部倍数的交叉点。没有私有数据访问，这两个假设都无法验证。有纪律的入场需要：（a）经审计 ARR 确认 $140M
              或以上；（b）毛利率超过 65%，或对硬件稀释有一致解释；（c）审阅股权结构表，包括优先股堆叠、任何未披露债务和 Brighton Park 清算优先权条款；（d）确认没有 KKR 或其他老股轮次在
              Brighton Park 2021 年投资之上创造高级优先权。没有这四项数据，合适的判断是继续研究。
