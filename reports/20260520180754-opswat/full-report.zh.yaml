    title: 2026 年 5 月投资 KPI
    type: kpi
    layout: standard
    summary: 关键投资指标：一边是已确认的规模信号，一边是按任意价格投资 OPSWAT 都必须确认的核心财务输入。
    approximationNotes: ARR 和估值来自代理估算或传闻；所有财务指标置信度低，需等待私有披露。规模指标（客户、员工）来自公司官方发布。
