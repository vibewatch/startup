      - number: '4.3'
        title: 成本结构、利润率路径与现金转换
        blocks:
          - type: paragraph
            body: >-
              OPSWAT 成本结构最清晰的公开线索，是它不是一家纯云软件公司。2026 年 2 月发布称，OPSWAT 的数据二极管业务在 2025 年实现三位数增长，公司现在在 Tampa 生产设施内部制造
              MetaDefender Kiosk 和 MetaDefender Drive 等硬件。公开价目表也显示设备包、多扫描引擎包，以及软件加维护结构。结合 AWS
              和本地部署选项，可能的成本堆栈包括云基础设施、反恶意软件引擎许可、硬件组件、制造开销、支持和实施人工。即便经常性软件层仍有吸引力，这些元素也应带来低于纯数字安全厂商的利润率画像。


              人力足迹强化了这一结论。OPSWAT 目前拥有超过 1,000 名员工、22 个办公室，并在支持、专业服务、TAM 和托管 SOC 角色上积极招聘。Arlington 扩张在靠近联邦买方的位置增加了另一个办公室和
              CIP 实验室；Tampa 总部则是一处近
              32,000-square-foot、处在长期租约下的设施。对一家卖进受监管、高信任环境的公司来说，这些投资合理，但也意味着比轻量、纯软件分销模式有更多固定成本和更高营运资本强度。Citybiz 的
              Arlington 报道还称，OPSWAT
              在预算收紧时把联邦产品包装为有用方案；这提醒我们，公司部分终端市场采购周期很长，也可能呈现波动。公开证据因此支持一个可信的增长故事，但不支持干净得出规模正在转化为一流毛利率或自由现金流转换的结论。
