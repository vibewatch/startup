      - number: '8.4'
        title: 退出准备度、投资逻辑破裂触发点和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              OPSWAT CEO 在 2021 年 3 月 CRN 访谈中称 IPO「还要几年」，并计划先把渠道扩大到业务的 75%、强化合规、推进收购。截至 2026 年 5 月，没有公开提交 S-1 或 Form
              10-K，也没有确认 IPO 时间表。最现实的退出情景包括：（1）在网络安全市场窗口友好时 IPO——OPSWAT 需要至少 $150-200M
              的收入规模、与上市同行有竞争力的已证明毛利率结构，以及通向盈利的路径；（2）由寻求关键基础设施能力的大型平台买家（Palo Alto Networks、Fortinet、Cisco）进行战略
              M&A；或（3）以更高估值标记向成长型 PE 二级出售。Nozomi 被 Mitsubishi 收购说明，战略买家愿意为差异化 OT/CIP 资产支付有意义的溢价（13x 收入）。Claroty 的 OT
              市场定位和更广的整合浪潮支持退出可行性，但 OPSWAT 相对 Claroty 或 Dragos 规模更小、公开声量更低，可能限制战略买家兴趣。


              投资逻辑破裂触发点：（a）ARR 确认低于 $110M，意味着 GetLatka 高估收入，且 $1.8B 入场价格严重错配；（b）毛利率低于 50%，说明它是硬件服务公司，应适用显著更低倍数；（c）任何高于
              2021 年 Brighton Park 轮次的高级清算优先权，意味着普通股最后参与分配；（d）IPO 注册撤回或搁置超过 18 个月，说明退出路径停滞；（e）失去标杆联邦合同（DOD、DHS
              或核设施），说明存在客户集中度风险；（f）低于 $1B 的折价融资轮会摧毁投资逻辑。


              在任何高于 $1B 的价格承诺前，最终尽调问题包括：FY2024 和 FY2025 经审计财务（ARR、按细分的收入、毛利率、EBITDA、现金）；显示所有股权类别、优先权和反稀释条款的股权结构表；确认 2021
              年 3 月至 2026 年 5 月之间没有未披露融资事件；SkyCenter One 租约纠纷的完整解决状态及任何已计提财务准备金；按产品家族拆分的详细收入；以及 ARR 前 100 大客户的
              NRR、总流失率和队列留存数据。
