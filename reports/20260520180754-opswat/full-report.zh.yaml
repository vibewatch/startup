      - number: '5.2'
        title: 可信入口与传输工作流
        blocks:
          - type: paragraph
            body: >-
              最站得住脚的产品叙事不是“最佳整体 OT 平台”，而是“连接多个入口点的边界控制专家”。Core 保护入站文件工作流；Kiosk 在可移动介质接触受保护系统前完成筛查；Drive
              在临时供应商笔记本和工作站使用前或使用中扫描；Managed File Transfer 将类似控制应用到数字交换；NetWall
              则在文件或数据必须跨越安全分级时，执行单向或严格受控的跨域移动。证据也说明买方为什么可能喜欢这种平台形态。Kiosk 不只是扫描器：OPSWAT 发布了 DLP、原产国、漏洞检查、加密介质处理，以及与 Media
              Validation Agent 和 Media Firewall 等气隙后控制的集成。Managed File Transfer 不止于传输，而是嵌入 CDR、多引擎扫描、审批和审计轨迹。NetWall
              增加二极管和网关变体，并给出明确的协议和吞吐量表。合在一起，这些表面描述的是一家试图把文件和设备入口变成确定性运营工作流的公司。取舍在于，很多性能叙事仍由供应商主导，尤其是 Kiosk 吞吐量和 MFT
              简单性说法。
