  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 受监管环境中的典型 OPSWAT 客户旅程，从触发事件到续约或交叉销售。
    data:
      nodes:
        - id: trigger
          label: 触发
          detail: 围绕文件入口、可移动介质或分段网络可视化的监管、安全或正常运行时间风险迫使客户行动。
          type: input
        - id: evaluation
          label: 评估 / POC
          detail: 买方先测试一个控制点：ICAP、Kiosk、Access 或 OT 可视化。公开案例包括 EPAM 的 3,000 台设备 POC，以及范围很紧的机场和公用事业部署。
          type: process
        - id: initial
          label: 初始生产部署
          detail: 部署落在清晰边界上，例如机场文件入口、医疗生产介质、政府上传门户，或公用事业可移动介质检查点。
          type: process
        - id: operations
          label: 运营化
          detail: 随后，安全团队集中报告、日志和策略执行；用户从临时传输转向受控工作流。
          type: process
        - id: adjacent
          label: 相邻产品挂载
          detail: 公开故事显示，首个边界控制项目跑通后，Kiosk 会追加 MFT、集中管理、介质防火墙或更多 OT 控制。
          type: process
        - id: renewal
          label: 续约 / 项目嵌入
          detail: 最强的耐久性证据，是部署成为采购续约或长期公共项目，例如 FCDO、NPPD 和加拿大政府账户。
          type: output
    approximationNotes: 旅程图由公开客户故事和采购记录综合而成；它描述常见路径，不是每个账户的字面顺序。
