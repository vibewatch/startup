  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: OPSWAT 的关键风险会沿获客速度、利润率质量、续约控制、融资信心和持续运营韧性传导。
    data:
      nodes:
        - id: founder
          label: 创始人集中度
          detail: 战略、路线图和治理仍与 Benny Czarny 高度绑定。
        - id: opacity
          label: 披露不透明
          detail: 公开材料没有披露估值、ARR 质量、客户集中度，也没有披露直销 / 渠道结构。
        - id: competition
          label: 平台竞争
          detail: OT 专门厂商和更大的平台供应商都与 OPSWAT 的业务范围重叠。
        - id: friction
          label: 部署摩擦
          detail: 用户评价仍提到调优、文档、报告和价格压力。
        - id: channel
          label: 渠道依赖
          detail: 合作伙伴渠道扩大覆盖，但也可能模糊客户归属和利润率获取。
        - id: legal
          label: 法律 / 设施冲击
          detail: 诉讼和 Tampa 场地问题可能分散运营精力。
        - id: revenue
          label: 收入质量
          detail: 胜率、定价权和续约控制更难尽调确认。
        - id: valuation
          label: 估值信心
          detail: 不透明叠加执行噪音，会压低可接受入场价。
        - id: resilience
          label: 运营韧性
          detail: 连续性、补丁响应和客户满意度会吃下风险负担。
      edges:
        - from: founder
          to: valuation
          label: 领导层连续性风险
        - from: opacity
          to: valuation
          label: 投资判断锚点偏弱
        - from: competition
          to: revenue
          label: 胜率和定价承压
        - from: friction
          to: revenue
          label: 落地变慢 / 流失风险
        - from: channel
          to: revenue
          label: 利润率和归属不清
        - from: legal
          to: resilience
          label: 运营分心与连续性负担
        - from: revenue
          to: valuation
          label: 质量信心下降
        - from: founder
          to: resilience
          label: 决策集中
        - from: competition
          to: resilience
          label: 产品迭代速度要求更高
    approximationNotes: 该图是基于公开证据搭建的因果投资判断模型，不代表 OPSWAT 内部运营模型。
    claimRefs:
      - CR022
      - CR023
      - CR028
      - CR035
      - CR041
      - CR042
      - CR049
      - CR050
