      - number: '2.3'
        title: 买方、用户、付款方与行业图谱
        blocks:
          - type: paragraph
            body: >-
              买方图谱是多线程的，因为 OT 网络安全预算夹在安全、运营和合规之间。最强的公开预算证据来自 SANS/OPSWAT 调研：许多受访者把 OT 网络安全视为主要责任，但只有 27% 的案例由 CISO 或 CSO
              主导预算决策，更常见的是 IT 与 OT 共享，或由 IT 控制。Fortinet 展示了同一市场的另一面：直接 OT 安全责任正上移到 C-suite，超过半数受访者称 CISO 或 CSO
              现在拥有这项责任。合在一起看，这些结果意味着高管赞助与日常预算归属之间存在实际分裂。行业叠加层随后决定谁真正签字。公用事业和电网运营商围绕 NERC CIP、FERC 和韧性要求采购；管道运营商围绕 TSA
              实施和事件响应要求采购；制造商围绕 uptime、勒索软件和供应链中断采购；政府或国防运营商则围绕隔离、认证和任务保障采购。用户同样混合：工厂工程师、OT
              安全团队、控制室人员、事件响应人员、集成商和远程供应商都会触碰工作流。对 OPSWAT
              来说，这意味着商业动作很可能在它能把资产可视性、合规报告、安全访问、可移动介质卫生，以及可信文件或数据传输统一进一个运营叙事时成功，而不是把单点工具卖给单一预算所有者。
