        - MetaDefender Kiosk 的直接相邻市场
      - - 跨域 / 单向传输
        - 数据二极管、单向网关、跨域传输、安全 OT 到 IT 数据发布
        - 通用网络路由或宽带支出
        - 任务负责人加安全 / 工程团队
        - NetWall 和数据二极管类产品的相邻细分
      - - 过宽泛的企业网络安全栈
