      - number: '7.2'
        title: 产品广度、漏洞管理，以及来自 OT 专家和平台的竞争
        blocks:
          - type: paragraph
            body: >-
              OPSWAT 的风险不是没有产品故事；风险在于它试图守住一个很宽的产品故事。MetaDefender Core 和 Kiosk 合起来覆盖文件安全、可移动介质防护、扫描、净化、漏洞检查、策略执行，以及横跨 IT
              和 OT 环境的集成。 这种广度支撑多产品增购，但也扩大了支持、补丁、QA 和路线图表面，且这些能力必须在敏感环境中保持可靠。公开漏洞记录显示，这个负担真实存在。 NVD 记录列出 MetaDefender
              Kiosk 中一个 4.7.0 之前版本的任意代码执行问题、另一个 Kiosk 拒绝服务问题，以及 Palo Alto Networks GlobalProtect 在 Windows 上使用的
              MetaDefender Endpoint Security SDK 中的提权问题。 这些发现都不能证明系统性失败，但它们说明 OPSWAT
              不能只靠预防优先定位；即便产品面向高保障环境，仍承担普通软件供应商的补丁和披露风险。 与此同时，竞争从两侧变宽。Claroty 和 Nozomi 推出集成 CPS 或 OT
              平台，覆盖资产可视化、威胁检测、漏洞管理和安全访问。 Palo Alto 和 Netskope 则通过更广的设备、网络、访问和数据安全栈进攻相邻地带，并能打包进既有企业采购动作。 面向 Gartner
              的市场报道称，多数 CPS 密集型买家正转向平台式采购，修复能力正成为关键筛选标准。因此 OPSWAT 同时面对两类重叠威胁： 具备更深工业可信度的 OT 纯玩家，以及拥有更强打包、执行和采购杠杆的大平台。
