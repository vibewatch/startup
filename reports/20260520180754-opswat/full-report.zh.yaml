          - type: callout
            title: KKR / $1.8B 说法未经验证——不要锚定未确认价格
            body: >-
              市场对话中出现了 KKR 领投、约 $1.8B 的传闻轮次，但审阅过的所有公开来源都没有：OPSWAT 自己的新闻稿、Brighton Park 网站、SecurityWeek、CRN、TechCrunch、CB
              Insights、Tracxn 和 GetLatka 都未提到 KKR 投资或 $1.8B
              标记。没有公开确认就把尽调或竞品分析锚定在这个价格，会引入虚假精确性风险。如果该轮发生但未披露，它创造的优先权和清算堆叠也未披露——这对普通股持有人是高级风险。如果该轮没有发生，$1.8B
              就是一个没有锚的数字，可能误导估值基准。
