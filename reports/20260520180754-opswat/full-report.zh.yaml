  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: wide
    summary: 从 OPSWAT 的市场证据出发，再叠加财务不透明和估值分析，最终指向在传闻 $1.8B 入场价下「继续研究」的建议。
    approximationNotes: 仅为方向性定性流程，不是量化决策树。节点权重反映分析师对证据质量的判断，以及对 OPSWAT 未确认财务指标的不确定性。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV009
      - CV036
      - CV038
      - CV039
      - CV044
      - CV045
    data:
      nodes:
        - id: N1
          label: OT/CIP 市场顺风
          detail: 监管浪潮（CISA、NERC CIP、NIS2）推动强制性 CIP 支出
        - id: N2
          label: OPSWAT 商业规模
          detail: 2,000+ 客户；1,000+ 员工；22 个办公室；2025 年 ARR 增长 >25%
        - id: N3
          label: 财务不透明
          detail: 未披露绝对 ARR、毛利率、现金消耗或优先股堆叠
        - id: N4
          label: 未确认的 $1.8B 估值
          detail: 没有公开来源确认 KKR 轮次或 $1.8B 估值标记
        - id: N5
          label: 可比公司分析
          detail: Dragos 为 ARR 的 11x（$1.7B）；Nozomi 为收入的 13x；$1.8B 意味着估算 ARR 的 12-15x
        - id: N6
          label: 情景区间
          detail: 悲观 $630M-$990M；基准 $1.2B-$1.54B；乐观 $1.68B-$2.24B
        - id: N7
          label: 继续研究
          detail: 没有确认 ARR 和毛利率，就无法支撑 $1.8B 估值
      edges:
