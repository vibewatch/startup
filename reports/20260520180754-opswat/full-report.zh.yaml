      - CV002
      - CV003
      - CV004
      - CV008
      - CV009
      - CV011
      - CV012
      - CV044
      - CV045
    data:
      items:
        - label: 已确认融资
          value: $125M
          detail: Brighton Park Capital 于 2021 年 3 月进行成长投资；唯一确认的外部轮次
        - label: 已确认估值
          value: Not public
          detail: 本章审阅的公开来源没有确认 KKR 轮次或 $1.8B 估值标记
        - label: ARR（仅代理估算）
          value: ~$121.8M
          detail: GetLatka 2025 年 12 月估计；置信度低；未经审计，管理层也未确认
        - label: ARR 增长
          value: '>25% YoY'
          detail: 公司在 2026 年 2 月的 2025 年年终发布中披露；只有百分比，没有基数
        - label: 客户
          value: '>2,000'
          detail: 公司在 2026 年 2 月发布中披露；高于 2021 年 Brighton Park 投资时的 1,000+
        - label: 员工
          value: '>1,000'
          detail: 公司在 2026 年 2 月发布中披露；Tracxn 第三方估计截至 2026 年 4 月为 1,155 人
        - label: 毛利率
          value: Undisclosed
          detail: 未公开；硬件、软件、服务混合模式的毛利率可能低于 75%
        - label: $1.8B 下的隐含倍数
          value: ~14.8x proxy ARR
          detail: 基于 GetLatka $121.8M 代理估算；高于 Dragos 11x 私募估值标记和 Nozomi 约 13x 退出
