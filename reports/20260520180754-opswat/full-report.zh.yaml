  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与邻近类别
        blocks:
          - type: paragraph
            body: >-
              定义 OPSWAT 的市场，应看它保护哪些控制点，而不是把关键基础设施运营商的全部网络安全预算都算进去。公开产品证据显示，产品组合覆盖 OT
              资产可视性和监控、深度端点和远程访问控制、文件净化和漏洞扫描、可移动介质筛查，以及单向或跨域传输。这意味着最贴近的纳入支出，是 OT/ICS
              网络安全软件，加上工业运营商在文件、设备、供应商或数据必须跨越信任边界时部署的安全入口和安全出口控制。同一组证据也划出了排除线。通用企业端点防护、宽泛 SIEM 和防火墙预算、一般协作软件，以及非专用 IT
              身份支出，只在它们明确用于解决 OT/ICS 访问、可视性或传输问题时才间接相关。因此替代品集合是混合的。Claroty、Nozomi 和 Tenable 代表 OT 可视性与暴露管理存量厂商；Owl 和
              Advenica 代表高保障跨域替代方案；现状替代仍包括人工文件检查、USB 禁令、分段但监控薄弱的网络，以及更大工业安全套件里的捆绑控制。尽调中，这个边界比任何标题式 TAM 都更重要，因为 OPSWAT
              看起来是在多个工业控制点必须一起加固时赢单，而不是在买方寻找通用安全套件时获胜。
