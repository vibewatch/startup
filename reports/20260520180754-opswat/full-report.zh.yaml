      - number: '7.3'
        title: 销售周期摩擦、渠道依赖和客户集中度盲点
        blocks:
          - type: paragraph
            body: >-
              OPSWAT 的商业风险由谁购买、如何触达客户共同决定。产品组合瞄准关键基础设施、联邦机构和强监管企业工作流；这些买家在批准上线前，通常要求看到修复、可用性和合规契合的证据。
              仅这一点就会拉长销售周期，并让预算节奏比标准企业安全软件更不平滑。公司自己的材料显示渠道策略很重要： OPSWAT 称拥有全球合作伙伴网络；2021 年融资公告称渠道项目覆盖 40 多个国家；Carahsoft
              将 OPSWAT 分销进政府采购渠道；2026 年 Emerson 经销协议把 OPSWAT 能力嵌入 Ovation，面向电力和水务运营商。
              这些路径扩大了进入监管账户的能力，但也带来毛利和客户归属模糊，因为公开记录没有披露 ARR 中有多少来自直销、多少来自伙伴中介动作。 评论证据还显示，部署并不总是即插即用。G2
              用户称上线和策略调校需要谨慎，否则会拦截合法文件；PeerSpot
              评论者仍指出定价压力、大文件扫描慢、报告薄弱、依赖文档、偶发误报调校等问题。这些摩擦并不致命，但很重要，因为监管客户本来购买就慢，也更在意实施负担。
              剩下的集中度问题只是未解决，而不是已被否定：公开来源展示了标杆渠道和行业，却没有展示最大账户、合作伙伴或公共部门项目的收入占比。
