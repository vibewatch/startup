      - number: '2.2'
        title: 规模测算视角与受约束的可触达市场
        blocks:
          - type: paragraph
            body: >-
              最干净的公开数字视角，是 OT 安全市场本身，而不是单一的 OPSWAT 专属 SAM。MarketsandMarkets 预计 OT 安全市场将从 2025 年的 USD 23.47 billion 增至
              2030 年的 USD 50.29 billion；Mordor 则给出 2025 年 USD 22.15 billion、2026 年 USD 25.19 billion、2031 年 USD 47.95
              billion。这些估算在市场规模和增长方向上相互一致，但也说明尽调为什么应保留相互矛盾的数字，而不是把它们平均掉。邻近类别要小得多。MarketsandMarkets 的 CDR 预测到 2026 年仅达
              USD 0.5 billion，数据二极管预测到 2030 年为 USD 0.72 billion。这些邻近类别在战略上重要，因为 OPSWAT
              确实销售到其中，但它们不能支撑公司参与整个关键基础设施网络安全堆栈这种夸张说法。因此，受约束的读法最站得住脚：已发布的核心市场当前大约处于 USD 20 billions
              的低到中段；纳入已发布的文件净化和单向传输类别后，更宽的控制点支出只会温和增加。公开证据没有拆出 NAC、远程访问、可移动介质或安全传输支出中究竟有多少真正属于工业和关键基础设施特定场景，所以 SAM 和 SOM
              仍是尽调事项，而不是公开事实。最诚实的市场结论是，OPSWAT 身处一个真实、增长、且合规敏感的市场；但一旦把邻近类别和重叠支出加进来，其公开 TAM 很快就会变得嘈杂。
