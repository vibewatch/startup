    title: 依赖图
    type: dag
    layout: wide
    summary: OPSWAT 的关键依赖集中在创始人领导、投资人信号、合作伙伴渠道、产品安全执行，以及以 Tampa 为中心的运营足迹。
    data:
      nodes:
        - id: benny
          label: Benny Czarny
          detail: 创始人、CEO 兼董事长，深度参与产品路线图。
        - id: board
          label: 公开董事会披露
          detail: 具名董事会规模不大，包含 Brighton Park 代表，但公开的委员会细节有限。
        - id: brighton
          label: Brighton Park 资金
          detail: 唯一公开披露的机构融资轮是 2021 年 $125M 投资。
        - id: partners
          label: 全球合作伙伴网络
          detail: 渠道计划覆盖多国，影响市场触达。
        - id: emerson
          label: Emerson / Ovation 路径
          detail: 进入电力和水务运营商的战略转售路径。
        - id: gov
          label: Carahsoft / 政府入口
          detail: 面向联邦和受监管买家的公共部门路径。
        - id: product
          label: 补丁和产品质量纪律
          detail: 漏洞和评价摩擦让执行质量成为核心。
        - id: tampa
          label: Tampa 总部足迹
          detail: 公开地址证据不一致，灾害敞口仍需纳入判断。
      edges:
        - from: benny
          to: board
          label: 领导权集中
        - from: brighton
          to: board
          label: 投资人监督信号
        - from: partners
          to: emerson
          label: OT 公用事业触达
        - from: partners
          to: gov
          label: 公共部门路径
        - from: product
          to: partners
          label: 合作伙伴信心取决于执行
        - from: tampa
          to: benny
          label: 总部连续性影响领导层运转
        - from: product
          to: emerson
          label: OT 补丁可信度很重要
        - from: product
          to: gov
          label: 受监管买家要求保证
    approximationNotes: 依赖图突出外部可见的集中点，不代表合同依赖权重。
