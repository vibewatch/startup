        - 任何优先于 2021 年 Brighton Park 轮的股权或债务
        - 普通股在高级优先权之后参与分配；有效入场成本更高
        - 交割前要求完整股权结构表披露和瀑布分析
      - - IPO 路径停滞超过 18 个月
        - 到 2027 年底仍未提交 S-1 或 IPO 授权
        - 退出流动性窗口被压缩；只剩并购路径；收购方未必愿付 $1.8B
        - 下调为持有；若有二级流动性则寻求退出；降低目标仓位
      - - 旗舰联邦客户流失
        - 失去任何 DOD、DHS 或前 5 核设施合同
        - 监管背书叙事破裂；溢价倍数被侵蚀 2-3 个倍数点
        - 重估估值；OT 溢价降至 Fortinet 式 9x，意味着 $1.1B-$1.4B 公允价值
      - - 估值低于 $1B 的下轮融资
        - 新股融资投后估值低于 $1B
        - 估值受毁；普通股可能归零
        - 清仓触发条件；按任何可得流动性全数退出
    notes: 触发条件基于假设 $1.8B 入场价和 $120-150M 代理 ARR。阈值为示例；实际清仓水平应在投资交割时作为保护条款谈妥。
    claimRefs:
      - CV008
      - CV036
      - CV039
      - CV040
      - CV042
      - CV043
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 绝对 ARR 与收入
        - FY2024 和 FY2025 经审计或管理层确认的 ARR，以及月度 ARR 桥
        - 没有收入分母，就无法计算估值倍数
        - CFO 或管理层；要求 CPA 审计报表
      - - 按分部拆分的毛利率
        - 按收入线拆分的毛利率（软件、硬件、服务、专业服务）
        - 若综合毛利率低于 55%，软件公司溢价倍数站不住
        - CFO 或审计机构；要求审计财务中的收入与 COGS 明细
      - - 股权结构表与优先权栈
        - 完整股权结构表，列明所有股份类别、清算优先权、反稀释和债务
        - 未披露高级优先权意味着即便 $1.5B 退出，普通股也可能没有剩余价值
        - 总法律顾问或 CFO；交割前强制条件
      - - 未披露融资事件
        - 确认 2021 年 3 月至 2026 年 5 月之间没有股权轮、债务或二级交易
        - 若传闻 KKR 轮为真且为高级证券，会形成公开数据看不到的优先权悬挂
        - 法律顾问或数据室；索取董事会同意书纪要、409A 历史和可转债票据
      - - 租约纠纷状态与准备金
        - SkyCenter One 驱逐案状态、任何和解条款、财务准备金和搬迁计划
        - 全球总部被迫搬迁会消耗资本、扰乱运营，并拖慢 IPO 准备
        - 法律顾问；索取租约驱逐诉状以及任何和解或修复协议副本
      - - NRR、总流失与 cohort 留存
        - 前 100 客户 cohort 的净收入留存率、总流失率和 cohort 收入留存
        - 没有 NRR，投资者无法判断 ARR 增长来自扩张还是净新增 logo
        - CFO 或客户成功负责人；要求在管理层材料中提供 cohort 瀑布
    notes: 六项都是任何高于 $1B 入场价的阻断性尽调缺口。没有一项能从本章审阅的公开来源推断出来。
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV044
      - CV045
