  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方 / 用户 / 付款方模式
        blocks:
          - type: paragraph
            body: >-
              OPSWAT
              的公开客户故事不是一个通用企业安全客户群；它是一个关键基础设施和受监管企业组合，以公用事业和能源、公共部门、制造、医疗、金融服务，以及在信任边界间移动高风险文件或设备的数字平台为锚。公司声称的顶线很大——2026
              年 2,000+ 客户，高于 2024 年 1,700+ 和 2021 年 1,000+——但更有用的尽调视角，是谁看起来在赞助部署。具名参考反复来自工程经理、基础设施负责人、OT 经理、市政府 ICT
              负责人、银行软件工程师和平台安全团队，而不是部门终端用户。这意味着 OPSWAT 通常作为控制层决策，由中央安全、IT、OT 或合规负责人购买。用户随后按工作流拆分：工厂团队和承包商使用 Kiosk
              和可移动介质控制；SOC 和安全团队使用 NDR、OT Security 或文件分析控制；应用和平台团队使用 ICAP、CDR 和上传安全产品。因此付款方看起来坐在集中安全、OT
              网络安全、公共项目或平台工程预算中，而不是业务线预算中。这在战略上有吸引力，因为当产品降低监管、安全或 uptime
              风险时，这些买方能容忍更长评估周期；但这也意味着采购会比广义自助式软件更慢，也更集中于机构账户。
