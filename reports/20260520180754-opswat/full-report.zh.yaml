      - number: '4.4'
        title: 资本充足性与披露边界
        blocks:
          - type: paragraph
            body: >-
              本章审阅来源中，唯一公开披露的外部融资事件是 2021 年 3 月 Brighton Park 的 $125 million
              投资。管理层称，这笔资金将用于全球扩张、R&D、客户成功、业务运营和战略收购。此后，公司显然已经扩张：披露客户数从超过 1,000 翻倍至超过 2,000；办公室数从 10 增至 22；员工数从大约
              350-400 增至超过 1,000；增长发布显示 2023 和 2025 年年终期间 ARR 增幅均超过 25%。这些运营代理指标说明，2021 年融资后业务没有停滞。


              但这些指标没有说明 OPSWAT 现在是否靠自身现金流支持扩张，是否仍在消耗 2021
              年资本，是否使用未披露债务，或是否依赖审阅记录中看不见的私下后续融资。没有公开现金余额，没有披露烧钱速度或现金跑道，没有债务或信贷额度条款，没有经审计财务报表，没有绝对 ARR
              或收入，也没有披露毛利率。即便最强的增长披露，也是没有公开财务分母的公司说法。这让承销处在尴尬的中间地带：证据足以相信业务有真实商业动量和有意义规模，但不足以量化收入质量、资本效率或融资依赖。纪律严明的投资者应把资本充足性视为未解决事项，而不是假设其健康。
