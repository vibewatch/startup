      - number: '1.3'
        title: 融资、估值与规模信号
        blocks:
          - type: paragraph
            body: >-
              OPSWAT 的资本故事比许多后期网络安全同行更窄，因为公开记录只指向一笔清楚披露的机构融资：2021 年 3 月 31 日宣布、来自 Brighton Park Capital 的 $125 million
              成长投资。这一轮在公司材料、Brighton Park 自有网站、PRNewswire、SecurityWeek、CRN、Tracxn 和 CB Insights 上都一致出现，CRN 还明确将其描述为公司
              2002 年创立以来的首笔外部融资。基于这一点，公开可佐证的最稳妥累计融资额仍是 $125 million。同样重要的是，公开记录没有干净支撑什么。留存来源没有佐证用户提供的 KKR 领投融资表述，也没有支撑
              ~$1.8 billion 估值；当前债务、信贷或老股交易披露也未留存。经营规模比估值更有支撑：2021 年融资材料显示 OPSWAT 接近 400 名员工、超过 1,000 个客户组织；2026 年 2
              月公司更新把这些信号抬升到超过 1,000 名员工和超过 2,000 个客户。绝对 ARR 和收入运行率仍属私有信息，尽管公司披露了 2025 年 ARR 同比增长超过 25%。
