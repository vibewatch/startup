          - type: callout
            title: Nozomi 约 13x 收入的 M&A 退出，是 OPSWAT 退出情景最有用的私有可比
            body: >-
              Nozomi Networks 于 2026 年初被 Mitsubishi Electric 以约 $1B 总对价收购（此前未持有的 93% 股份对应 $883M 现金），对照 2024 年 $75M
              收入，退出倍数约为 13x 收入，由战略买家支付。OPSWAT 的代理 ARR 为 $120-150M，且定位在 OT/CIP，使其成为可能的战略收购目标。如果 OPSWAT 能证明 $140M+ ARR
              和可防守毛利率，战略买家可以为 $1.5B-$2B 找到理由。这给 M&A 退出情景设定了上限，但也说明，金融买家在少数股权轮次中支付 $1.8B，并不是从第一天起就拿到战略买家退出定价。
