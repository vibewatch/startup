      - number: '5.3'
        title: 访问、OT 运营与生态表面
        blocks:
          - type: paragraph
            body: >-
              MetaDefender Access 和 MetaDefender OT Security 是 OPSWAT 从纯文件和介质控制走向连续运营工作流的地方。Access
              被描述为零信任控制平面，在允许访问前检查端点状态、漏洞、加密和第三方应用；Ping 材料尤其有帮助，因为它们确认该连接器旨在嵌入真实身份编排，而不是作为独立合规孤岛。OT Security
              是更雄心勃勃的运营下注。OPSWAT 将其营销为一个 OT 资产发现、监控、补丁管理和合规平台，带有 SPAN-port 传感器、站点仪表盘、企业仪表盘，以及可选内联工业防火墙。旧 Neuralyzer
              路径如今解析到 OT Security，加上 2022 年发布记录，说明这是有真实产品线沿革，而不是一次性营销改名。生态证据也很具体。GitHub 仓库显示了 Kubernetes
              部署指南、用于下载前扫描的浏览器扩展，以及面向漏洞和合规集成的端点 SDK。Emerson 随后把叙事延伸到电力和水务补丁管理，说明 OPSWAT 试图落进运营商工作流内部，而不只是站在边界上。
