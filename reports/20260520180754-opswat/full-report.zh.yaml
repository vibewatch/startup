        title: 法律、设施、灾害敞口和剩余尽调问题
        blocks:
          - type: paragraph
            body: >-
              相比 OPSWAT 的增长故事规模，其负面记录仍算温和，但已足以影响尽调。诉讼方面，PacerMonitor 显示 PacSec3 于 2024 年 10 月起诉 Opswat 专利侵权，该案在 2025 年 3
              月经不可再诉的自愿撤诉后结案。 设施方面，Appraisal Development 转载的一篇 Tampa Bay Business Journal 报道称，OPSWAT 因 Tampa
              International Airport 附近 SkyCenter One 的飓风损坏和维修争议而面临驱逐诉讼。 同时，OPSWAT 当前联系页面列出的 Tampa 总部地址，与 CB Insights
              仍显示的地址不同；这意味着外部投资者仅凭公开材料，无法判断哪个地点、哪些租约义务或连续性控制实际约束总部运营。 这一点重要，因为 Hillsborough County、NOAA 县级灾害地图和 National
              Hurricane Center 都指向更广 Tampa 区域存在实质飓风和风暴潮敞口。OPSWAT 的法律中心还强调隐私、合规、出口、供应商行为和 IP
              义务，说明公司卖入的是受监管环境，执行失败造成的不止是产品流失。正确结论不是 OPSWAT 陷入困境；而是公司背着一组真实的法律、产品安全和设施风险，且公开材料只承销了一部分。
              投资信心因此应继续取决于诉讼后续、补丁响应纪律、渠道结构披露，以及业务连续性和租约问题已被控制而不只是勉强可承受的直接证据。
