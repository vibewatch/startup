      - - 固定成本足迹
        - 22 个办公点，Tampa 总部近 32k sq ft，另有 Arlington 办公室和实验室
        - 意味着租赁和设施义务不小
        - 部分披露
        - 要求提供租赁明细、占用成本和资本开支承诺
      - - 资本强度
        - 自有硬件制造、设备、支持、服务和全球实验室
        - 提示营运资金需求高于纯软件同行
        - 据公开记录推断
        - 要求提供库存、资本开支和制造毛利率数据
      - - 下一轮融资触发因素
        - 公开证据无法支撑
        - 没有依据判断增长是否很快需要新资本
        - 缺失
        - 要求提供 24 个月预算、烧钱速度和董事会批准的融资计划
    notes: 逐轮融资历史放在公司概况。本表聚焦当前充足性，以及公开证据远不足以拼出当前现金与债务图景。
