        - from: production
          to: management
          label: 运营采用
        - from: management
          to: attach
          label: 交叉销售 / 标准化
        - from: attach
          to: durability
          label: 续约或合作伙伴主导扩张
    approximationNotes: 这是基于已观察客户故事和采购记录的公开证据流，不是披露转化率的实测转化漏斗。
