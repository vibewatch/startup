  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              OPSWAT
              并不处在一个干净的单一品类里。买方面临的真实问题，是如何让文件、设备、供应商和数据在工业环境中跨越信任边界，同时不制造新的攻击路径或运营停机。这造就了一个混合战场。Claroty、Dragos、Nozomi 等纯
              OT 和 CPS 厂商，在资产发现、异常检测、威胁情报和 CPS 平台领导力上拥有最可信的公开叙事。Fortinet、Palo Alto Networks、Microsoft 和 Tenable
              则从邻近控制平面切入同一预算，把既有防火墙、暴露管理或 SOC 平台延伸进 OT。Trellix 与 Symantec 或 Broadcom
              也能在文件检查上覆盖同一工作的一部分，但公共材料主要围绕文件共享、网关、沙箱和内容库的恶意软件检查。Honeywell SMX、Owl、Advenica 和 Waterfall
              则在需求收敛到可移动介质治理或高保障单向传输时竞争。独立评论不支持 OPSWAT 领先完整 OT 平台市场的说法：基于 Gartner 的报道和 Dale Peterson 都把 OPSWAT
              放在纯玩家领导者集合之外，更接近利基或系列方案位置。这并不意味着 OPSWAT 无关紧要；它意味着 OPSWAT 的入围逻辑是边界控制，而不是通用 OT 平台替代。
