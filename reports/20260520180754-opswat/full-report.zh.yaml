companyProfile:
  summary: >
    OPSWAT 是一家创始人主导的私营网络安全公司，总部位于 Florida 的 Tampa，主攻关键基础设施和受监管 IT/OT 环境的预防优先安全。其公开产品套件以 MetaDefender、MetaDefender Access
    和 MetaDefender OT Security 为中心；公司称截至 2026 年服务超过 2,000 个客户组织，员工超过 1,000 人。公开来源只确认了 2021 年 Brighton Park Capital 的
    $125 million 成长投资，未确认后续 KKR 领投轮，也不足以支撑当前 ~$1.8B 估值；经审计 ARR、收入、毛利率和股权结构表数据仍未披露。
