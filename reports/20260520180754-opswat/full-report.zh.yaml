        - 在 PAN-OS/Cortex 环境内做实时 OT 清单、风险管理和工作流自动化
        - 上市多产品平台厂商
        - 设备清单叠加 Cortex XSOAR 集成，并承接既有企业安全预算
        - 公开 OT 专业深度不及纯玩家；文件 / 介质专用差异化很少
      - - Microsoft Defender for IoT 产品线
        - 混合 OT 监控套件
        - 结合 Azure、Sentinel 和混合管理的无代理或传感器式 OT 监控
        - 公开超大规模平台，安全分发广
        - 生态绑定摩擦低，支持混合云 / 本地部署选项
        - 独立评论质疑它赢下严肃 OT 优先交易的频率
      - - Tenable One OT Exposure
        - 暴露面管理扩展
        - 资产发现、Safe Active Query、合规映射和攻击路径驱动的修复
        - 上市安全平台，已有 IT 装机基础
        - IT/OT 风险统一和合规分析强
        - 不是文件 / 介质边界控制厂商，也不是 OT MDR 或威胁情报领域的公开领导者
      - - Trellix / Symantec-Broadcom
        - 文件安全既有厂商
        - 网关、沙箱、存储库和文件共享恶意软件检测
        - 成熟企业安全厂商，检测引擎成熟
        - 内容工作流中的文件深度检测和沙箱能力强
        - 不解决 OT 资产发现、OT 威胁监控或工业区执行问题
      - - Honeywell / Owl / Waterfall / Advenica
        - 可移动介质或高保障边界专业厂商
        - USB 治理、便携扫描，或硬件强制的单向 / 跨域传输
        - 工业和政府专业厂商，范围更窄，但保障表述更明确
        - 需求是单一边界控制且保障要求强时最合适
        - 工作流比 OPSWAT 文件、介质、访问和传输控制的组合更窄
    notes: 规模信号结合公司官方表述和独立评论。收入或估值不公开时，本表使用已披露融资、收入或部署线索，而不是无支撑的估计。
