      - number: '6.4'
        title: 留存耐久度、扩张机制、渠道角色与主要缺口
        blocks:
          - type: paragraph
            body: >-
              耐久性证据最有力的地方，是公开记录逼出了比营销页面更具体的信息。加拿大政府案例显示使用期超过 15 年，粘性异常强；FCDO Services 有披露支出的真实合同，并已延期至 2027 年；NPPD 的
              2026-2029 续约则说明公用事业需求仍在。扩张证据看得见，但仍不均衡。EPAM 显示 OPSWAT 可以从范围明确的 POC 切入，再快速放大；机场和公用事业案例显示 Kiosk 部署会延伸到
              托管文件传输（MFT）、集中管理或额外验证层；Emerson 经销协议则说明 OPSWAT 可以借已安装的自动化生态进入电力和水务账户。
              主要承销缺口不在于客户是否存在，而在于收入有多耐久、集中度有多高。这里没有公开来源披露 NRR、GRR、流失率或头部客户敞口。
              匿名的机场、公用事业、油气和能源案例证明了行业契合度，却不能证明账户身份。独立评论可作为有用的反向制衡，因为它们指出成本、扫描速度、报告和文档痛点，
              但仍没有揭示合同金额或续约行为。结果是，本章对需求的证明真实存在，在关键基础设施中最强；但收入耐久性仍部分不透明，并且很可能由大型直客账户和伙伴中介交易共同塑造。
