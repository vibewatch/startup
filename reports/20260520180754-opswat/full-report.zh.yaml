chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与覆盖版图
        blocks:
          - type: paragraph
            body: >-
              OPSWAT 将自己定位为一家私营、预防优先的网络安全公司，服务横跨 IT、OT 和 ICS 环境的关键基础设施运营商。公开记录在两点上相当一致：公司由 Benny Czarny 于 2002
              年创立，MetaDefender 平台也形成了稳定的产品身份。产品组合证据也足够具体，而不是泛泛而谈。MetaDefender 仍是统一的高级威胁预防平台，MetaDefender Access
              负责安全设备和应用访问，并提供深度端点合规控制；过去出现在 /products/neuralyzer 路径下的产品，如今解析到 MetaDefender OT Security，面向工业资产可视性和 OT
              网络监控。OPSWAT 的地理身份也在公开视野中成熟起来。公司将总部从 San Francisco 迁至 Tampa 之后，签下长期 SkyCenter|ONE 租约，随后在 Tampa
              International Airport 启用近 32,000-square-foot 的全球总部和 CIP 实验室。当前规模方向上很强：公司称拥有超过 2,000 个客户和超过 1,000
              名员工，但最新办公室数量仍取决于来源口径，因为 OPSWAT 称有 22 个办公室，而 Craft 识别出 17 个地点。
