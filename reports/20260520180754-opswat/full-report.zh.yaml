      - number: '2.4'
        title: 增长驱动、采用约束与矛盾证据
        blocks:
          - type: paragraph
            body: >-
              需求逻辑真实存在，但市场仍然难打。Dragos 和 Fortinet 都描述了一个威胁环境，正在把工业运营商推向更好的可视性、分段、事件响应和平台整合。Dragos
              也说明了买方为什么仍觉得防护不足：即便资产清单和可视性排在技术投资领域首位，只有 12.6% 的受访者称自己在 ICS Cyber Kill Chain
              全链路上具备完整可视性。合规是在叠加压力，而不是替代压力。CISA 的 CPG、IEC 62443、NIS2、FERC 批准的 CIP 变更，以及 TSA
              管道指令，都抬高了治理、远程访问、变更检测和事件响应的底线。与此同时，同一批来源也解释了采用为什么慢，以及 TAM 膨胀为什么危险。Mordor 强调实施成本高、遗留协议不兼容、预算优先级下移和 OT
              人才短缺。Fortinet 指出，许多 OT 环境仍依赖十年或更老的系统，无法按常规方式打补丁；SecurityWeek 和 Industrial Cyber 则认为，可视性和安全远程访问虽然 ROI
              高，却仍资金不足。Dragos 的财务风险研究还补了一条警示：风险敞口很大，间接损失也大，而且行业集中在制造业和 North
              America。净结果是，市场紧迫性真实，但销售周期、集成摩擦、采购时点和重叠存量平台，都会压缩 OPSWAT 这类私营厂商实际可获得的 SOM。
