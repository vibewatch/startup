      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              领导层能见度主要来自创始人连续性，正式治理结构则弱得多。Benny Czarny 仍是公开材料中最清晰的锚点：创始人、CEO、董事会主席，也是融资、总部和产品发布公告中的主要对外发声人。OPSWAT
              发布的当前管理团队覆盖财务、运营、产品、法务、人力和销售等职能，包括 CFO Bill Carey、CISO 兼 COO Michael Barker、CPO Yiyi Miao，以及总法律顾问兼公司秘书
              Eric Spindel。留存来源中最主要的近期领导层变化，是 Jan Miller 在 2026 年 2 月升任
              CTO，这把公司对自适应沙箱和边界威胁检测的重视正式写进组织安排。即便有这套班底，关键人物集中度仍然高。Czarny
              反复以创始人、CEO、董事长、融资对手方和公共思想领袖身份出现，说明公司在战略、文化和资本市场上依赖同一位高管。治理透明度才是更大的短板。留存公开来源没有给出独立董事或董事会委员会的清晰现任名单，后续尽调应直接确认控制权、委员会主席和接班安排，而不是从管理层履历里推断。
