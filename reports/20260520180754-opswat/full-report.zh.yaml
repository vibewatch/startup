  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台堆栈与架构
        blocks:
          - type: paragraph
            body: >-
              对一家常被概括为文件安全厂商的公司来说，OPSWAT 的产品表面异常宽。留存产品页显示了一个预防优先堆栈：从 MetaDefender Core 出发，覆盖文件检查、Deep
              CDR、多引擎扫描、漏洞检查和策略编排，再向外扩展到负责设备信任的 Access、负责可视性和补丁的 OT Security、负责可移动介质和临时设备筛查的 Kiosk 与 Drive、负责单向和跨域传输的
              NetWall，以及负责策略治理数字交换的 Managed File
              Transfer。这种广度重要，因为平台在工作流层面是连贯的：同一文件可以在多个信任边界上被扫描、净化、传输并执行策略，而不是在互不相关的点工具之间交接。架构故事在 OPSWAT
              能指向分层控制、而不是单一功能时最强。Core 发布了 API、ICAP、SIEM、SOAR 和存储集成；NetWall 增加确定性传输控制；GitHub 部署材料显示，OPSWAT
              也愿意在基础设施很重的环境里满足客户，而不只是销售封闭设备。警示是，许多层级仍主要由供应商材料记录，而不是独立技术验证。
