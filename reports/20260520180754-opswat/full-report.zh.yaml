  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 传统问题
      - OPSWAT 控制路径
      - 已发布收益
      - 限制 / 注意事项
    rows:
      - - 门户或应用的入站文件上传
        - 上传可能携带恶意软件、伪装文件类型和敏感数据
        - Core → 文件类型校验 → 多引擎扫描 → Deep CDR → 按需 DLP / 沙箱
        - 在执行或下游存储前拦住不安全内容
        - 检测、可用性和延迟指标大多由公司自述
      - - 进入厂区或安全场所的便携介质
        - USB 和传统介质会绕过网络防线
        - Kiosk → 多引擎扫描 → Deep CDR → 策略执行 → 回执 / 审计轨迹
        - 把介质筛查移到受控入口点工作流
        - 需要按站点设计物理流程并调校策略
      - - OT 访问前的临时供应商笔记本
        - 第三方设备可能携带恶意软件或缺少补丁
        - 连接前用 Drive 做预启动或会话内扫描
        - 无需永久安装代理即可检查设备可信度
        - 大规模设备群运维指标未公开量化
      - - 远程 OT 供应商或员工访问
        - 单靠身份系统无法保证设备合规
        - Access → 深度合规 → Ping 编排 / 修复 → JIT OT 或应用访问
        - 把设备可信度和修复纳入访问决策
        - 公开集成细节以 Ping 最强，其他场景较薄
      - - 跨 IT 与 OT 或受监管流程的安全文件流转
        - 传统 MFT 加密传输，但不深度检查文件
        - MFT → 审批 → 多引擎扫描 / CDR / DLP → 受控交付
        - 把安全控制和可审计性嵌入传输工作流
        - 第三方 ROI 和生产环境参考深度仍有限
      - - 跨域或单向 OT 数据传输
        - 运营方需要导出 OT 数据，同时不能制造回程路径
        - NetWall / 二极管系列 → 协议断开 / 单向光链路 → 可选文件安全
        - 以明确协议支持和型号范围支撑确定性传输
        - 型号选择和认证范围并不简单，也不统一
    notes: 收益来自已留存公开主张或评测摘要；限制项保留了部署、策略设计或认证解读仍需尽调的地方。
