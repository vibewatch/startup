  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要工作流 / 用户
      - 已发布成熟度 / 状态
      - 差异化
      - 主要尽调缺口
    rows:
      - - MetaDefender Core
        - 安全团队和应用负责人处理文件上传、下载、邮件、存储及 API 工作流
        - 成熟旗舰平台
        - 在一条文件流水线里整合多引擎扫描、Deep CDR、DLP、漏洞检查和沙箱
        - 检测和性能主张的独立证据仍薄
      - - Deep CDR
        - 安全与合规团队对高风险文档和归档做净化
        - 成熟共享引擎
        - 以预防优先的文件重建取代单纯检测
        - 未留存独立处理速度基准
      - - MetaDefender Kiosk
        - OT / 现场团队的厂区入口、介质进入和气隙中转
        - 成熟硬件系列，覆盖多种形态
        - 把可移动介质检查变成可重复的 Kiosk 工作流，覆盖策略和介质类型
        - 吞吐量和部署指标主要由厂商提供
      - - MetaDefender Drive
        - 临时笔记本、新工作站和便携端点在接入网络前的检查
        - 专用便携控制
        - 无需在目标设备安装软件，即可做预启动和会话内扫描
        - 公开证据能支撑功能集，但大型部署数据有限
      - - MetaDefender Access
        - 身份、端点合规和远程供应商 / 员工访问
        - 成熟相邻平台
        - 不仅检查网络访问，还加入深度合规、漏洞和补丁感知
        - 除头部合作伙伴页面外，参考架构有限
      - - MetaDefender OT Security
        - 厂区或企业 OT 团队的 OT 资产可视化、监控、漏洞和补丁工作流
        - 2022 年推出的增长模块，仍在积极重新定位
        - 面向 OT 的界面，加上绑定防火墙集成的传感器与仪表盘模式
        - 多站点效果和低影响部署的独立证据有限
      - - MetaDefender NetWall / 数据二极管系列
        - 跨域、单向、安全的 OT 到 IT 数据传输
        - 成熟网关系列，并纳入 Fend 资产扩展
        - 硬件强制的数据流控制，部分型号叠加 OPSWAT 文件安全层
        - 认证和协议范围因型号而有实质差异
      - - MetaDefender Managed File Transfer
        - 跨 IT、OT、云和受监管报送流程的策略化文件交换
        - 较新但营销定位清晰的模块
        - 把威胁预防和审批直接嵌进 MFT 工作流，而不是事后外挂扫描
        - 第三方落地证据比厂商定位更薄
      - - MetaDefender Aether
        - SOC 和零日检测工作流的边界文件判定
        - 最新以 AI 为中心的发布
        - 把信誉、动态分析、ML 打分和威胁狩猎统一到一条决策流水线
        - 未留存验证效果和效率主张的独立基准证据
    notes: 各行区分成熟模块和较新产品，并保留证据主要来自厂商、而非独立基准的地方。
