  - id: FU002
    title: 采用 / 部署流
    type: flow
    layout: wide
    summary: OPSWAT 需求通常如何从初始边界控制痛点，走向更大的平台足迹和采购耐久性。
    data:
      nodes:
        - id: risk
          label: 识别边界风险
          detail: 机场文件入口、公用事业分段、USB 介质、远程访问或公开上传工作流暴露出清晰控制缺口。
        - id: pilot
          label: 试点或窄范围
          detail: 先测试单一用例，例如 EPAM 的初始设备队列，或机场 ICAP / Kiosk 部署。
        - id: production
          label: 生产控制点
          detail: 产品成为工厂、机场、政府、医疗或云工作流中日常安全运营的一部分。
        - id: management
          label: 集中管理 / 审计
          detail: 客户增加集中监控、审计日志或更多扫描器，把部署变成可重复的运营工作流。
        - id: attach
          label: 相邻产品挂载
          detail: 公开故事显示，首个项目赢下后，会追加 MFT、集中管理、工业防火墙和端点 / 补丁附加模块。
        - id: durability
          label: 续约 / 渠道规模化
          detail: 账户公开续约，或渠道合作伙伴把 OPSWAT 嵌入更广泛 OT 项目时，证据最深。
      edges:
