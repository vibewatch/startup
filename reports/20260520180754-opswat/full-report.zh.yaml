  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 重要性
      - 当前公开替代指标
      - 缺失风险
      - 具体尽调路径
    rows:
      - - 绝对 ARR / 收入
        - 估值、规模和资本效率分析都需要
        - ARR 增速二十几个百分点的说法，以及客户数代理指标
        - 增长故事可能比底层收入基数更好看
        - 要求提供经审计年度收入和月度 ARR 桥表
      - - 软件 / 硬件 / 服务收入结构
        - 毛利质量和现金转化分析都需要
        - 产品目录、价格表和招聘信息
        - 无法判断增长来自经常性软件，还是低毛利交付工作
        - 要求按产品族提供收入，以及收入确认政策
      - - 按业务线毛利率
        - 用于对标网络安全同行
        - 硬件制造和支持岗位暗示毛利率混合
        - 估值倍数可能被实质性错设
        - 要求按业务线提供毛利润、COGS 和支持成本分摊
      - - 现金、烧钱速度、现金跑道和债务
        - 用于评估融资依赖
        - 2021 年融资加后续规模代理指标
        - 投资人无法判断增长是自我融资，还是高度消耗资产负债表
        - 要求提供当前资产负债表、债务明细和 24 个月现金跑道模型
      - - NRR、流失率、CAC 和回本周期
        - 用于判断经常性收入韧性
        - 合作伙伴新增、客户增长和 TAM / 支持岗位招聘
        - 销售效率和留存质量仍靠猜
        - 要求提供按细分市场拆分的队列报告，包含总流失率、NRR、CAC 和回本周期
      - - 法律 / 租赁成本敞口
        - 用于理解非经营性现金流失
        - 租赁纠纷报道和已驳回专利案
        - 意外和解、维修或占用成本可能稀释现金转化
        - 要求提供诉讼准备金摘要、保险追偿状态和总部租赁修订
    notes: 这些是阻挡 OPSWAT 达到完整承销级财务判断的核心问题。以上每一项都需要管理层材料，而不是更多公开网络检索。
