      - number: '1.4'
        title: 里程碑、合作伙伴与负面事件
        blocks:
          - type: paragraph
            body: >-
              带日期的里程碑记录显示，公司从创始人自力更生阶段走向规模化商业执行，但仍带着一些法律和运营风险。核心里程碑包括 2002 年创立、2020 年 12 月总部迁至 Tampa，以及 2021 年 3 月
              Brighton Park 融资；该融资用于扩张、R&D、客户成功和并购。OPSWAT 随后通过 2022 年 SkyCenter|ONE 总部租约和 2023 年全球总部及 CIP 实验室启用，加深了对
              Tampa 的投入。产品拐点包括 2022 年推出 MetaDefender OT Security、2026 年 3 月推出 MetaDefender Aether，以及 2026 年 4 月 Emerson
              经销协议，这些都强化了公司向关键基础设施和 OT 工作流更深处推进。2026 年 2 月的年度回顾发布也很重要，因为它把这些产品和合作动作与明确规模指标挂钩：超过 2,000 个客户、超过 1,000
              名员工、22 个办公室，以及 2025 年 ARR 增长超过 25%。反向信号小于增长叙事，但仍有实质性。针对 OPSWAT 的一宗专利案于 2024 年 10 月提起、2025 年 3
              月终结；NewsBreak 报道了 2025 年 11 月一宗与 Tampa 总部飓风损坏相关的驱逐诉讼。
