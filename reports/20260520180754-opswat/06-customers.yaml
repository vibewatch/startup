figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Typical OPSWAT customer journey in regulated environments, from trigger event to renewal or cross-sell.
  data:
    nodes:
    - id: trigger
      label: Trigger
      detail: Regulatory, safety, or uptime risk around file ingress, removable media, or segmented-network visibility forces action.
      type: input
    - id: evaluation
      label: Evaluation / POC
      detail: 'Buyers test one control point first: ICAP, Kiosk, Access, or OT visibility. Public examples include EPAM’s 3,000-device POC and tightly scoped airport and utility deployments.'
      type: process
    - id: initial
      label: Initial production deployment
      detail: Deployment lands at a clear boundary such as airport file ingress, healthcare production media, government upload portals, or public-utility removable-media checkpoints.
      type: process
    - id: operations
      label: Operationalization
      detail: Security teams then centralize reporting, logging, and policy enforcement; users shift from ad hoc transfers to controlled workflows.
      type: process
    - id: adjacent
      label: Adjacent attach
      detail: Public stories show Kiosk adding MFT, central management, media firewall, or additional OT controls once the first boundary-control project proves out.
      type: process
    - id: renewal
      label: Renewal / program embed
      detail: The strongest durability proof is when deployments become procurement renewals or long-tenure public programs, as in FCDO, NPPD, and the Canadian government account.
      type: output
  approximationNotes: Journey map is synthesized from public customer stories and procurement records; it describes a common path, not a literal sequence for every account.
