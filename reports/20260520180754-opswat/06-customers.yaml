- id: critical-infrastructure-deployment-proof
  title: Critical-infrastructure deployment proof by sector
  body: 'The strongest demand proof is where OPSWAT can show not just logos but deployment detail inside regulated workflows. Utilities and energy stand out: Genesis Energy appears as a named utility reference; Hitachi Energy says it scans files in build processes; a European utility describes segmented MFT and Core deployments with Kiosks and audit logging; a public electric utility case ties Kiosks to NRC and NIST requirements; and a Nebraska Public Power District renewal shows live procurement for Platform, Endpoint, vulnerability scanning, and MFT through 2029. Nuclear-adjacent proof is also real, though partly sparse: Dounreay Nuclear Restoration Services is named on the customer page, while the public-electric-utility case explicitly says the utility operates nuclear and fossil-fuel plants. Airports are better evidenced on deployment detail than on named logos: Berlin Brandenburg Airport appears in a named testimonial, but the deeper airport stories are anonymized even though they
    explain ICAP scanning, removable-media controls, central management, and vendor workflows. Healthcare and pharma are also credible, with Abdi Ibrahim’s 18,000-files-per-day production workflow, SCL Health’s 13,000 protected endpoints, and Clalit Health Services on the customer wall. Government proof is unusually strong because it includes >15 years at a Canadian government organization, a live FCDO contract, a federal NDR case, Hawaii State Digital Archives, and a historic Pentagon relationship via InQuest.'
