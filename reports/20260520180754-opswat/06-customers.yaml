  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-census
    missingEvidence: An exhaustive active-customer list or a management-certified count of directly referenceable production accounts by segment.
    whyItMatters: The chapter can prove dozens of references and deployments, but it cannot convert the 2,000+ company-claimed customer base into a verified active-account census.
    diligencePath: Request a customer-reference pack broken out by named production accounts, anonymous production accounts, pilots, churned accounts, and channel-led deployments.
    relatedQuestionRefs:
    - QU003
    - QU023
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-10 customer ARR share, largest single-account exposure, and renewal calendar for marquee public-sector and utility accounts.
    whyItMatters: Large institutional customers may drive disproportionate ARR, so one non-renewal could matter far more than the 2,000+ logo count suggests.
    diligencePath: Request board or lender-style customer concentration tables plus the next 24 months of major renewal dates.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU006
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Segment-level NRR, GRR, churn, and upsell statistics for direct versus channel-sourced accounts.
    whyItMatters: Demand proof is good, but without retention data investors cannot translate public deployments into durable recurring revenue quality.
    diligencePath: Request cohort waterfalls, churn reasons, and NRR by vertical for utilities, government, manufacturing, healthcare, and commercial enterprise.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: minor
    topic: channel-mix
    missingEvidence: Direct-versus-channel ARR mix, partner-sourced pipeline share, and gross-margin differences between partner-led and direct accounts.
    whyItMatters: Channel expansion is visible, but the economics and customer-ownership implications of that motion remain opaque.
    diligencePath: Request partner-influenced bookings, sourced ARR, renewal ownership, and top-reseller concentration.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU006
