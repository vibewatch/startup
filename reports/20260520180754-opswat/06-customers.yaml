- id: FU002
  title: Adoption / deployment flow
  type: flow
  layout: wide
  summary: How OPSWAT demand typically moves from initial boundary-control pain to wider platform footprint and procurement durability.
  data:
    nodes:
    - id: risk
      label: Boundary risk identified
      detail: Airport file ingress, utility segmentation, USB media, remote access, or public upload workflows expose a clear control gap.
    - id: pilot
      label: Pilot or narrow scope
      detail: A single use case is tested first, such as EPAM’s initial device cohort or airport ICAP / Kiosk deployment.
    - id: production
      label: Production control point
      detail: The product becomes part of everyday security operations in plant, airport, government, healthcare, or cloud workflows.
    - id: management
      label: Central management / audit
      detail: Customers add centralized monitoring, audit logging, or additional scanners to turn the deployment into a repeatable operating workflow.
    - id: attach
      label: Adjacent product attach
      detail: Public stories show MFT, central management, industrial firewall, and endpoint/patching add-ons after the first win.
    - id: durability
      label: Renewal / channel scale
      detail: The deepest proof arrives when the account renews publicly or channel partners embed OPSWAT into broader OT programs.
    edges:
    - from: risk
      to: pilot
      label: POC approval
    - from: pilot
      to: production
      label: Go-live
    - from: production
      to: management
      label: Operational adoption
    - from: management
      to: attach
      label: Cross-sell / standardization
    - from: attach
      to: durability
      label: Renewal or partner-led scale
  approximationNotes: This is a public-evidence flow based on observed customer stories and procurement records, not a measured conversion funnel with disclosed rates.
