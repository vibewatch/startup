- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / execution risk
  - Impact
  - Diligence path
  rows:
  - - Kiosk deployments expand into MFT, central management, or media firewall layers
    - Expansion proof is operationally visible but revenue uplift per account is unknown
    - Positive if multi-product attach is real; neutral if attach is small
    - Request product-attach rates by cohort
  - - EPAM-style POC to large-scale rollout
    - Large flagship accounts may matter more than logo count suggests
    - Positive for land-and-expand; risky if a few marquee accounts dominate
    - Request top-10 ARR share and account-level expansion history
  - - Utility and federal procurement renewals
    - Public accounts may have long cycles and lumpier budget timing
    - Can create durable revenue with stepwise renewals
    - Request contract-weighted renewal calendar
  - - Emerson reseller access to power and water operators
    - Channel can obscure direct customer ownership and gross margin
    - Can accelerate reach into installed OT bases
    - Request direct vs channel ARR mix and reseller concentration
  - - Partner ecosystem growth (48 new partners in 2023; 100+ tech partners marketed)
    - Broader reach does not prove direct enterprise pull or retention quality
    - Positive distribution leverage but uncertain revenue quality
    - Request sourced pipeline and partner-influenced win-rate data
  - - Anonymous oil/gas, airport, and energy stories
    - Hard to measure concentration when some deepest deployments are unnamed
    - Sector fit is credible, but account-level underwrite remains incomplete
    - Request reference calls or redacted contract summaries for the largest unnamed deployments
  notes: Expansion drivers are real, but concentration and channel-mix questions remain the biggest unanswered customer diligence items.
