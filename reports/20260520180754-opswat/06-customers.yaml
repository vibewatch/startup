  body: OPSWAT can show many references and customer stories, but public sources still do not disclose NRR, GRR, commercial churn, or top-customer concentration, so revenue durability remains only partially underwritten.
  claimRefs:
  - CU042
  - CU043
- calloutType: insight
  title: The strongest motion is boundary control first, platform expansion second
  body: Public stories repeatedly start with one urgent control point — removable media, file ingress, remote access, or segmented OT visibility — and only then expand into MFT, central management, endpoint, or firewall layers.
  claimRefs:
  - CU015
  - CU016
  - CU023
  - CU032
  - CU045
