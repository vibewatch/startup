- id: durability-expansion-and-risks
  title: Retention durability, expansion mechanics, channel role, and main gaps
  body: Durability proof is best where public records force more specificity than marketing pages. The Canadian government case implies extraordinary stickiness with more than 15 years of use; FCDO Services shows a real contract with disclosed spend and an extension through 2027; and NPPD’s 2026-2029 renewal signals ongoing public-utility demand. Expansion proof is visible, but still uneven. EPAM shows how OPSWAT can start with a scoped POC and scale sharply; airport and utility stories show Kiosk deployments growing into Managed File Transfer, central management, or additional validation layers; and Emerson’s reseller agreement suggests OPSWAT can ride into power and water accounts via an installed automation ecosystem. The main underwriting gaps are not about whether customers exist, but about how durable and concentrated revenue is. No public source here discloses NRR, GRR, churn, or top-customer exposure. Anonymous airport, utility, oil-and-gas, and energy stories prove sector fit but
    not account identity. Independent reviews are useful as an adverse counterweight because they highlight cost, scan-speed, reporting, and documentation pain, yet they still do not reveal contract value or renewal behavior. The result is a chapter where demand proof is real and strongest in critical infrastructure, but revenue durability remains partially opaque and likely shaped by a mix of large direct accounts and partner-mediated deals.
