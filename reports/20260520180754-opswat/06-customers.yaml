chapter:
  number: 6
  title: Customers
  summary: OPSWAT’s customer proof is strongest in critical infrastructure and regulated environments where the company can show deployment detail, public procurement, or long-tenure use — especially utilities, energy, government, manufacturing, airports, and healthcare. The company-claimed customer base grew from 1,000+ organizations in 2021 to 2,000+ in 2026, but directly evidenced production accounts are far fewer than the headline logo count and many of the deepest critical-infrastructure stories remain anonymous. Public durability proof exists through Canadian government tenure, FCDO spend and extension, and an NPPD renewal, yet NRR, GRR, top-customer concentration, and direct-versus-channel revenue mix remain undisclosed.
sections:
- id: segmentation-and-buyer-patterns
  title: Customer segmentation and buyer / user / payer patterns
  body: 'OPSWAT’s public customer story is not a generic enterprise-security customer base; it is a critical-infrastructure and regulated-enterprise portfolio anchored in utilities and energy, public sector, manufacturing, healthcare, financial services, and digital platforms that move risky files or devices across trust boundaries. The company-claimed top line is large — 2,000+ customers in 2026 versus 1,700+ in 2024 and 1,000+ in 2021 — but the more useful diligence lens is who appears to sponsor deployments. Named references repeatedly come from engineering managers, infrastructure leads, OT managers, city-government ICT leaders, bank software engineers, and platform-security teams rather than departmental end users. That implies OPSWAT is usually bought as a control-layer decision by central security, IT, OT, or compliance owners. Users then split by workflow: plant teams and contractors use Kiosks and removable-media controls; SOC and security teams use NDR, OT Security, or file-analysis
    controls; application and platform teams use ICAP, CDR, and upload-security products. Payers therefore appear to sit in centralized security, OT cybersecurity, public-program, or platform-engineering budgets instead of line-of-business budgets. This is strategically attractive because those buyers tolerate longer evaluation cycles when the product reduces regulatory, safety, or uptime risk, but it also means procurement can be slower and more concentrated in institutional accounts than in broad-based self-serve software.'
