  - - OPSWAT
    - Hybrid OT + file/media security
    - Secure file ingress, removable media, device compliance, one-way transfer, and basic OT visibility
    - Private vendor; 2,000+ businesses claimed; multi-product stack across file, media, access, and transfer
    - Deep CDR, 30+ engine multiscanning, kiosk, MetaAccess, NetWall/Fend in one boundary-control workflow
