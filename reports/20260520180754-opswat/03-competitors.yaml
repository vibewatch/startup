- id: pure-play-ot-and-bundled-incumbents
  title: Pure-play OT rivals versus bundled incumbents
  body: 'Claroty, Dragos, and Nozomi are the hardest competitors for OPSWAT to beat when the initial buying motion is asset
    inventory, OT threat detection, or CPS platform standardization. Claroty pushes SaaS asset discovery, exposure management,
    segmentation guidance, and secure access; Dragos differentiates through OT-native services and OT Watch; Nozomi leans
    into wired, wireless, endpoint, and remote sensing plus AI-assisted analysis. Those are not cosmetic differences. They
    point to stronger public proof on visibility depth, threat research, and managed operations than OPSWAT currently publishes.
    At the same time, the bundle players matter because they can win with less OT purity. Fortinet brings segmentation, virtual
    patching, PAM, and SecOps on top of FortiGate and FortiOS. Palo Alto wraps device inventory and risk management into the
    Cortex and PAN-OS workflow, including XSOAR integration. Microsoft offers asset inventory, vulnerability monitoring, and
    hybrid sensor management as part of a larger Azure and Sentinel ecosystem. Tenable’s pitch is exposure management, Safe
    Active Query, and compliance mapping. The practical consequence is that OPSWAT can be squeezed from both sides: OT specialists
    own the detection narrative, while broad platforms own procurement leverage.'
