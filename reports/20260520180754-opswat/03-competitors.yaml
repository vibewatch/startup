  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cross-domain-assurance
    missingEvidence: Public certification, accreditation, or government-approval evidence showing whether OPSWAT NetWall or
      Fend matches the assurance posture of Owl, Waterfall, or Advenica in high-assurance cross-domain deployments.
    whyItMatters: Without explicit assurance evidence, OPSWAT may look strong for workflow breadth but weak for the highest-assurance
      or defense-oriented boundary-transfer deals.
    diligencePath: Request NetWall or Fend certification documents, accreditation references, and named production deployments
      in defense, intelligence, or comparable high-assurance environments.
    relatedQuestionRefs:
    - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Module-level pricing, bundle discounts, and typical contract structures for OPSWAT, Claroty, Dragos,
      Nozomi, Fortinet, Palo Alto, and Microsoft in OT accounts.
    whyItMatters: Opaque pricing makes it difficult to judge whether OPSWAT’s workflow breadth really offsets bundle pressure
      from larger platform vendors or premium pricing from pure-play OT specialists.
    diligencePath: Request recent quote decks, price books, and three competitive deal examples showing module mix, discount
      levels, and term length.
    relatedQuestionRefs:
    - QP020
    - QP021
  - type: private-evidence-only
    severity: blocking
    topic: competitive-win-rates
    missingEvidence: Verified win-loss data, customer overlap maps, and replacement narratives showing where OPSWAT consistently
      beats or loses to Claroty, Dragos, Nozomi, Fortinet, Palo Alto, Microsoft, and Honeywell.
    whyItMatters: The chapter can identify public wedges and threats, but not whether those wedges translate into repeatable
      commercial wins at scale.
    diligencePath: Request CRM-derived win-loss data for the last 12 to 18 months, top lost-deal reasons, attach rates by
      module, and reference calls for both competitive wins and losses.
    relatedQuestionRefs:
    - QP027
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: Independent product benchmark or customer review evidence directly comparing OPSWAT OT Security’s inventory
      quality, detection quality, and operational usability against Claroty, Dragos, and Nozomi.
    whyItMatters: Public vendor marketing alone is not enough to determine whether OPSWAT’s OT module is merely adjacent or
      genuinely competitive for stand-alone OT platform evaluations.
    diligencePath: Request third-party benchmark studies, analyst evaluation extracts, PoC scorecards, and customer references
      where OPSWAT was tested head-to-head against OT pure plays.
    relatedQuestionRefs:
    - QP017
