    - Deep OT research, threat intelligence, and managed service depth
    - Narrower file/media and broad CPS workflow coverage; independent critiques cite reach and channel limits
  - - Nozomi Networks
    - OT / IoT platform
    - Passive, active, endpoint, wireless, and remote sensing with AI analysis
    - Surpassed $100M revenue and acquired by Mitsubishi Electric in 2026
    - Broad sensor coverage and strong OT/IoT visibility story
    - Less public depth on file/media sanitation; independent critiques cite sales and adoption friction
  - - Fortinet
    - Network-centric OT security platform
    - Segmentation, virtual patching, PAM, rugged networking, and SecOps across existing Fortinet estates
    - Public multi-product platform vendor
    - Native enforcement and bundle leverage through FortiGate, FortiPAM, and FortiOS
    - Weaker public OT-specialist narrative than leaders and little overlap with CDR/media-specific controls
  - - Palo Alto Networks
    - OT device security + SOC automation
    - Real-time OT inventory, risk management, and workflow automation inside PAN-OS/Cortex estates
    - Public multi-product platform vendor
    - Device inventory plus Cortex XSOAR integration and existing enterprise security spend
    - Less public OT-specialist depth than pure plays; minimal file/media-specific differentiation
  - - Microsoft Defender for IoT
    - Hybrid OT monitoring bundle
    - Agentless or sensor-based OT monitoring with Azure, Sentinel, and hybrid management
    - Public hyperscale platform with broad security distribution
    - Low-friction ecosystem attachment and hybrid cloud/on-prem deployment options
    - Independent commentary questions how often it wins serious OT-first deals
  - - Tenable One OT Exposure
    - Exposure-management extension
    - Asset discovery, Safe Active Query, compliance mapping, and attack-path-driven remediation
    - Public security platform with existing IT install base
    - Strong IT/OT risk unification and compliance analytics
    - Not a file/media boundary-control vendor and not the public leader on OT MDR or threat intel
  - - Trellix / Symantec-Broadcom
    - File-security incumbents
    - Gateway, sandbox, repository, and file-share malware inspection
    - Established enterprise cyber vendors with mature inspection engines
    - Deep file inspection and sandboxing for content workflows
    - Do not solve OT asset discovery, OT threat monitoring, or industrial zone enforcement
  - - Honeywell / Owl / Waterfall / Advenica
    - Removable-media or high-assurance boundary specialists
    - USB governance, portable scanning, or hardware-enforced one-way / cross-domain transfer
    - Industrial and government specialists with narrower but explicit assurance language
    - Best fit when the job is a single boundary control with strong assurance requirements
    - Narrower workflows than OPSWAT’s broader combination of file, media, access, and transfer controls
