- id: pricing-distribution-and-moat-durability
  title: Pricing, distribution power, and moat durability
  body: 'Public pricing evidence is weak across almost the entire field, which matters because it shifts the real competition
    away from transparent list prices and toward bundling, installed-base leverage, and proof of workflow consolidation. Microsoft,
    Palo Alto Networks, and Fortinet are dangerous precisely because they can make OT security look like an incremental add-on
    to an already approved platform. Claroty, Dragos, and Nozomi are dangerous because they enter the deal as category leaders
    and can then expand outward. OPSWAT’s moat is narrower but still real: once an operator standardizes on kiosk screening,
    file sanitization, device compliance, and transfer controls across multiple sites, replacing those workflows with separate
    products becomes operationally messy. The downside is that the moat is harder to explain in a single RFP scorecard than
    “best OT visibility platform” or “already our firewall vendor.” The biggest diligence gap is therefore commercial, not
    technical: public evidence on OPSWAT win rates, attach rates, pricing, and replacement dynamics is thin. Until management
    can show proof that the multi-control-point story converts into repeatable competitive wins, OPSWAT should be viewed as
    strongly differentiated but not broadly category-dominant.'
