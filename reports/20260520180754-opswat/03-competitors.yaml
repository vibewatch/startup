callouts:
- calloutType: strength
  title: OPSWAT’s best lane is boundary control, not generic OT platform leadership
  body: The strongest public evidence for OPSWAT clusters around file sanitization, removable-media checkpoints, endpoint
    compliance, and secure transfer between zones. That is a real and differentiated buying lane, especially in critical infrastructure
    workflows where USB devices, vendor laptops, and file movement cannot be eliminated.
  claimRefs:
  - CP001
  - CP005
  - CP007
  - CP043
- calloutType: risk
  title: Pure-play OT vendors still own the strongest monitoring and MDR narrative
  body: Claroty, Dragos, and Nozomi have better public proof on CPS visibility, OT-native threat intelligence, sensor breadth,
    and managed detection or response. If the deal starts as an asset-inventory or OT-SOC project, OPSWAT is less likely to
    be the default leader.
  claimRefs:
  - CP017
  - CP022
  - CP025
  - CP044
  - CP054
- calloutType: risk
  title: Bundle economics can compress OPSWAT pricing power before technical evaluation even starts
  body: Microsoft, Palo Alto Networks, and Fortinet can frame OT controls as extensions of broader platforms, while analyst
    commentary places OPSWAT outside the leader tier. That combination can erode pricing power unless OPSWAT proves multi-control-point
    ROI with references and win-loss data.
  claimRefs:
  - CP029
  - CP034
  - CP045
  - CP051
  - CP055
