  - type: private-evidence-only
    severity: blocking
    topic: cash-debt-and-runway
    missingEvidence: Current cash balance, debt schedule, burn rate, runway, and board-approved financing plan.
    whyItMatters: Capital adequacy cannot be underwritten from growth proxies alone; the company may be self-funding or balance-sheet-intensive, and public sources do not resolve which.
    diligencePath: Request latest balance sheet, 13-week cash flow, debt agreements, and 24-month operating plan.
