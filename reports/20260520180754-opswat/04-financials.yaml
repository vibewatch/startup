- id: adverse-signals-and-underwriting-blockers
  title: Adverse signals and core underwriting blockers
  body: |-
    The adverse evidence in the public record is not catastrophic, but it is meaningful. In November 2025, a Tampa Bay Business Journal article republished by Appraisal Development reported that SkyCenter One's landlord sued to evict OPSWAT after hurricane-related damage allegedly left the space untenantable and the parties disagreed over repairs. Separately, PacerMonitor shows a 2024 patent case brought by PacSec3 against Opswat was voluntarily dismissed with prejudice in March 2025. These items do not prove financial distress, but they do show that OPSWAT is not operating in a frictionless legal environment and that long-lease office commitments can create operational and financial noise.

    The bigger blocker is opacity. OPSWAT's scale proxies are credible and in some cases corroborated by multiple sources, yet the company asks outside observers to infer far too much from customer, office, partner, and hiring signals. Public disclosures never bridge those proxies to absolute ARR, revenue, gross margin, EBITDA, cash, debt, or retention. That means the company's growth narrative may be directionally true while still being insufficient for valuation work. For this chapter, the correct conclusion is not that OPSWAT is weak financially; it is that public evidence supports momentum but not full underwriting. The immediate diligence priority is to replace proxy-based confidence with audited or at least management-provided financial statements, revenue-mix detail, and a current cash-and-debt schedule.
