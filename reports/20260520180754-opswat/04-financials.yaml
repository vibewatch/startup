  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: absolute-arr-and-revenue
    missingEvidence: Audited annual revenue, monthly ARR, and deferred-revenue balances.
    whyItMatters: Without a denominator, OPSWAT's strong growth percentages cannot be converted into scale, valuation, or capital-efficiency analysis.
    diligencePath: Request audited financial statements and a monthly ARR bridge for 2023-2026.
    relatedQuestionRefs:
    - QI001
    - QI002
    - QI021
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-gross-margin
    missingEvidence: Revenue mix by software, hardware, maintenance, and services, plus gross margin by line.
    whyItMatters: The product mix appears materially less margin-pure than a software-only cyber vendor, but public sources do not quantify the blend.
    diligencePath: Request segment revenue, product-line gross profit, and revenue-recognition policy.
    relatedQuestionRefs:
    - QI009
    - QI013
    - QI014
    - QI016
    - QI025
    relatedTableRefs:
