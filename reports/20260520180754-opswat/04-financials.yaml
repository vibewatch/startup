- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public substitute
  - Risk if absent
  - Exact diligence path
  rows:
  - - Absolute ARR / revenue
    - Needed for valuation, scale, and capital-efficiency analysis
    - Mid-20s ARR growth claims and customer-count proxies
    - Growth story may look stronger than the underlying denominator
    - Request audited annual revenue and monthly ARR bridge
  - - Revenue mix by software / hardware / services
    - Needed for margin-quality and cash-conversion analysis
    - Product catalog, pricing sheets, and job postings
    - Cannot tell whether growth is recurring software or lower-margin delivery work
    - Request revenue by product family and revenue-recognition policy
  - - Gross margin by line
    - Needed to benchmark against cyber peers
    - Hardware manufacturing and support roles imply mixed margins
    - Valuation multiple could be materially mis-set
    - Request gross profit, COGS, and support cost allocation by line
  - - Cash, burn, runway, and debt
    - Needed to assess financing dependency
    - 2021 raise plus later scale proxies
    - Investors cannot tell whether growth is self-funded or balance-sheet-intensive
    - Request current balance sheet, debt schedule, and 24-month runway model
  - - NRR, churn, CAC, and payback
    - Needed to judge recurring-revenue durability
    - Partner additions, customer growth, and TAM / support hiring
    - Sales efficiency and retention quality remain guesswork
    - Request cohort report with gross churn, NRR, CAC, and payback by segment
  - - Legal / lease cost exposure
    - Needed to understand non-operating cash leakage
    - Lease-dispute reporting and dismissed patent case
    - Unexpected settlements, repairs, or occupancy costs could dilute cash conversion
    - Request litigation reserve summary, insurance-recovery status, and HQ lease amendments
  notes: These are the core blockers keeping OPSWAT from a full underwriting-quality financial read. Every item above requires management materials, not more public web searching.
