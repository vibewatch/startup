evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-revenue-disclosure
    missingEvidence: >-
      A board-approved financing memo, investor update, or management KPI pack showing current valuation, absolute ARR,
      and revenue run-rate.
    whyItMatters: >-
      Company overview needs a supportable valuation and revenue baseline for later financial and valuation chapters,
      and the public record does not provide one.
    diligencePath: >-
      Request the latest board materials, investor presentation, or monthly KPI dashboard with financing and revenue
      metrics.
    relatedQuestionRefs:
      - QO016
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: capital-structure-detail
    missingEvidence: >-
      A current cap table or financing summary covering ownership percentages, secondaries, debt, and any credit
      facilities.
    whyItMatters: >-
      Without cap-structure detail, investor influence, liquidation preferences, and refinancing risk cannot be
      evaluated cleanly.
    diligencePath: Obtain the current cap table, financing documents, and treasury summary from management or counsel.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: governance-roster
    missingEvidence: >-
      A current board roster with independent directors, committee assignments, and any observer or investor-rights
      information.
    whyItMatters: >-
      Founder concentration can only be assessed properly if the current governance counterweights and committee
      structure are known.
    diligencePath: Request the board list, committee charters, and any investor-rights or observer agreements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: public-milestone-chronology
    missingEvidence: >-
      A management-confirmed chronology covering all private product launches, leadership changes, financing steps, and
      office openings.
    whyItMatters: >-
      The milestone table is sufficient for public ground truth but not guaranteed to capture every inflection point
      relevant to later diligence.
    diligencePath: Request an internal milestone timeline or use management interviews to reconcile omitted internal milestones.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-som-granularity
    missingEvidence: >-
      A management view of product revenue mix, critical-infrastructure customer count, vertical mix, and attach rates
      across OT security, access, file security, kiosk, and transfer products.
    whyItMatters: >-
      Without product and customer mix, public TAM can be bounded but public SAM and SOM cannot be isolated credibly
      enough for valuation work.
    diligencePath: >-
      Request product-line ARR, customer counts by vertical, average contract value by module, and management's internal
      market-segmentation model.
    relatedQuestionRefs:
      - QM010
      - QM011
      - QM028
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: sector-budget-ownership
    missingEvidence: >-
      Sector-specific procurement or budget documents showing who actually signs for utilities, pipelines, transport,
      manufacturing, and government OT security programs.
    whyItMatters: >-
      Public survey data prove budget fragmentation at the market level, but they do not provide contract-level buyer
      and payer detail for each critical-infrastructure segment.
    diligencePath: >-
      Collect RFPs, procurement records, or customer references that identify the signatory budget owner, deployment
      sponsor, and funding source by sector.
    relatedQuestionRefs:
      - QM012
      - QM015
      - QM016
      - QM017
      - QM018
      - QM019
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-sizing-overlap
    missingEvidence: >-
      A single public dataset that cleanly nets out overlap among OT security, NAC, file sanitization, removable media,
      and cross-domain transfer categories.
    whyItMatters: >-
      Published category forecasts overlap and use different horizons, so any broad addressable-market number can be
      overstated without an overlap adjustment.
    diligencePath: >-
      Rebuild sizing from bottoms-up customer workflow data or a management segmentation model instead of summing
      top-down category reports.
    relatedQuestionRefs:
      - QM009
      - QM010
      - QM028
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: sales-cycle-benchmark
    missingEvidence: >-
      Public benchmarks for pilot-to-production conversion, deployment timelines, and renewal patterns specific to OT
      visibility, secure access, and media or transfer controls in critical infrastructure.
    whyItMatters: >-
      Threat and compliance pressure are visible, but the commercial conversion rate from urgency to paid deployment
      remains hard to quantify without better sales-cycle evidence.
    diligencePath: >-
      Request pipeline conversion metrics, implementation timelines, and cohort retention data from management or
      channel partners.
    relatedQuestionRefs:
      - QM025
      - QM026
      - QM027
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: cross-domain-assurance
    missingEvidence: >-
      Public certification, accreditation, or government-approval evidence showing whether OPSWAT NetWall or Fend
      matches the assurance posture of Owl, Waterfall, or Advenica in high-assurance cross-domain deployments.
    whyItMatters: >-
      Without explicit assurance evidence, OPSWAT may look strong for workflow breadth but weak for the
      highest-assurance or defense-oriented boundary-transfer deals.
    diligencePath: >-
      Request NetWall or Fend certification documents, accreditation references, and named production deployments in
      defense, intelligence, or comparable high-assurance environments.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Module-level pricing, bundle discounts, and typical contract structures for OPSWAT, Claroty, Dragos, Nozomi,
      Fortinet, Palo Alto, and Microsoft in OT accounts.
    whyItMatters: >-
      Opaque pricing makes it difficult to judge whether OPSWAT’s workflow breadth really offsets bundle pressure from
      larger platform vendors or premium pricing from pure-play OT specialists.
    diligencePath: >-
      Request recent quote decks, price books, and three competitive deal examples showing module mix, discount levels,
      and term length.
    relatedQuestionRefs:
      - QP020
      - QP021
  - type: private-evidence-only
    severity: blocking
    topic: competitive-win-rates
    missingEvidence: >-
      Verified win-loss data, customer overlap maps, and replacement narratives showing where OPSWAT consistently beats
      or loses to Claroty, Dragos, Nozomi, Fortinet, Palo Alto, Microsoft, and Honeywell.
    whyItMatters: >-
      The chapter can identify public wedges and threats, but not whether those wedges translate into repeatable
      commercial wins at scale.
    diligencePath: >-
      Request CRM-derived win-loss data for the last 12 to 18 months, top lost-deal reasons, attach rates by module, and
      reference calls for both competitive wins and losses.
    relatedQuestionRefs:
      - QP027
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Independent product benchmark or customer review evidence directly comparing OPSWAT OT Security’s inventory
      quality, detection quality, and operational usability against Claroty, Dragos, and Nozomi.
    whyItMatters: >-
      Public vendor marketing alone is not enough to determine whether OPSWAT’s OT module is merely adjacent or
      genuinely competitive for stand-alone OT platform evaluations.
    diligencePath: >-
      Request third-party benchmark studies, analyst evaluation extracts, PoC scorecards, and customer references where
      OPSWAT was tested head-to-head against OT pure plays.
    relatedQuestionRefs:
      - QP017
  - type: private-evidence-only
    severity: material
    topic: absolute-arr-and-revenue
    missingEvidence: Audited annual revenue, monthly ARR, and deferred-revenue balances.
    whyItMatters: >-
      Without a denominator, OPSWAT's strong growth percentages cannot be converted into scale, valuation, or
      capital-efficiency analysis.
    diligencePath: Request audited financial statements and a monthly ARR bridge for 2023-2026.
