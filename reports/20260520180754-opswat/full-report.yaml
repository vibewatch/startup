      - number: '4.3'
        title: Cost structure, margin path, and cash conversion
        blocks:
          - type: paragraph
            body: >-
              The clearest public clue on OPSWAT's cost structure is that it is not a pure cloud-software company. The
              February 2026 release says OPSWAT's data-diode business grew by triple digits in 2025 and that the company
              now manufactures hardware such as MetaDefender Kiosk and MetaDefender Drive in-house at a Tampa production
              facility. Public price sheets also show appliance bundles, multiscanning-engine packages, and
              software-plus-maintenance structures. Combined with AWS and on-prem deployment options, the likely cost
              stack includes cloud infrastructure, anti-malware engine licensing, hardware components, manufacturing
              overhead, support, and implementation labor. Those elements should produce a margin profile below that of
              a purely digital security vendor, even if the recurring software layer remains attractive.


              The labor footprint reinforces that conclusion. OPSWAT now has more than 1,000 employees, 22 offices, and
              active recruiting across support, professional services, TAM, and managed SOC roles. The Arlington
              expansion added another office and CIP lab close to federal buyers, while the Tampa headquarters is a
              nearly 32,000-square-foot facility under a long lease. These are sensible investments for a company
              selling into regulated, high-trust environments, but they also imply more fixed cost and more
              working-capital intensity than a lightweight software-only distribution model. Citybiz's Arlington
              coverage also says OPSWAT pitched its federal offerings as useful while budgets tighten, which is a
              reminder that some of the company's end markets have long procurement cycles and can be lumpy. The public
              evidence therefore supports a credible growth story, but not a clean conclusion that scale is translating
              into best-in-class gross margins or free-cash-flow conversion.
