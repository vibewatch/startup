            body: >-
              Durability proof is best where public records force more specificity than marketing pages. The Canadian
              government case implies extraordinary stickiness with more than 15 years of use; FCDO Services shows a
              real contract with disclosed spend and an extension through 2027; and NPPD’s 2026-2029 renewal signals
              ongoing public-utility demand. Expansion proof is visible, but still uneven. EPAM shows how OPSWAT can
