      - number: '4.2'
        title: GTM motion and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              OPSWAT's go-to-market motion appears meaningfully channel-assisted. In the January 2024 year-end release,
              management said the company added 48 new partners in 2023 and that new business through the channel had
              doubled for two consecutive years. The current partner-program page advertises competitive margins,
              deal-registration protection, performance-based incentives, Academy credits, joint marketing, and tiered
              support, while the February 2026 year-end release says the My OPSWAT Partner Portal centralizes licensing,
              support cases, and enablement. Taken together, those signals imply OPSWAT is willing to spend on partner
              enablement and margin-sharing in exchange for broader reach into critical-infrastructure accounts where
              trusted local integrators matter.


              Public unit economics remain mostly undisclosed. There is no public CAC, payback period, LTV, NRR, gross
              churn, or cohort data. Instead, the best proxies are operating-scale signals: customer count rose from
              more than 1,000 in 2021 to more than 1,700 in 2024 and more than 2,000 in 2026; the careers page showed 92
              open jobs when reviewed for this chapter; and many postings sit in support, professional services,
              customer success, technical account management, and managed SOC functions rather than in pure product
              engineering. That staffing mix suggests OPSWAT is investing in land-and-expand coverage, implementation,
              and post-sales retention, which can improve renewal quality but also increases service-delivery cost. The
              channel-heavy motion may lower direct field-sales intensity in some accounts, yet investors cannot prove
              sales efficiency from the public record because there is no disclosed revenue denominator, pipeline
              conversion data, or sales-and-marketing spend.
