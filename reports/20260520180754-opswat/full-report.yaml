  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and adjacencies
        blocks:
          - type: paragraph
            body: >-
              OPSWAT's market should be defined by the control points it secures, not by the entire cybersecurity budget
              of a critical-infrastructure operator. Public product evidence shows a portfolio that combines OT asset
              visibility and monitoring, deep endpoint and remote-access control, file sanitization and vulnerability
              scanning, removable-media screening, and unidirectional or cross-domain transfer. That means the closest
              included spend is OT/ICS cybersecurity software plus the secure-ingress and secure-egress controls that
              industrial operators deploy when files, devices, vendors, or data have to cross trust boundaries. The same
              evidence also draws the exclusion line. Generic enterprise endpoint protection, broad SIEM and firewall
              budgets, general collaboration software, and non-specialized IT identity spend are only indirectly
              relevant unless they are explicitly deployed to solve OT/ICS access, visibility, or transfer problems. The
              substitute set is therefore mixed. Claroty, Nozomi, and Tenable represent OT-visibility and
              exposure-management incumbents; Owl and Advenica represent high-assurance cross-domain alternatives; and
              status quo substitutes still include manual file checks, USB bans, segmented but weakly monitored
              networks, and bundled controls inside larger industrial-security stacks. For diligence, that boundary
              matters more than any headline TAM because OPSWAT appears to win where multiple industrial control points
              must be secured together, not where buyers are shopping for a generic security suite.
