          - type: callout
            title: KKR/$1.8B claim is unverified - do not anchor to an unconfirmed price
            body: |-
              The rumored KKR-led round at ~$1.8B appears in market conversations but is absent from every public
              source reviewed: OPSWAT's own releases, Brighton Park's website, SecurityWeek, CRN, TechCrunch, CB
              Insights, Tracxn, and GetLatka all fail to mention a KKR investment or a $1.8B mark. Anchoring
              diligence or a competitor analysis to this price without public confirmation introduces false precision
              risk. If the round occurred but is undisclosed, the preference and liquidation stack created by that
              round is also undisclosed - a senior risk to common equity holders. If the round did not occur, $1.8B
              is an unanchored number that could mislead valuation benchmarking.
            calloutType: risk
            claimRefs:
              - CV004
