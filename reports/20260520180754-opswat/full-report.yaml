chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and footprint
        blocks:
          - type: paragraph
            body: >-
              OPSWAT presents itself as a private, prevention-first cybersecurity company built for critical
              infrastructure operators spanning IT, OT, and ICS environments. The public record is consistent on the
              company's 2002 founding by Benny Czarny and on the durable product identity built around the MetaDefender
              platform. The portfolio evidence is also strong enough to be specific rather than generic. MetaDefender
              remains the umbrella advanced-threat-prevention platform, MetaDefender Access handles secure device and
              application access with deep endpoint-compliance controls, and the product formerly surfaced through the
              /products/neuralyzer path now resolves to MetaDefender OT Security for industrial asset visibility and OT
              network monitoring. OPSWAT's geographic identity has also matured in public view. After relocating
              headquarters from San Francisco to Tampa, the company signed a long-term SkyCenter|ONE lease and later
              inaugurated a nearly 32,000-square-foot global headquarters and CIP lab at Tampa International Airport.
              Current scale is directionally strong: the company says it has more than 2,000 customers and more than
              1,000 employees, but the exact current office count still depends on source definition because OPSWAT
              cites 22 offices while Craft detects 17 locations.
