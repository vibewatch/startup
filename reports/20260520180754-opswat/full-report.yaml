  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform stack and architecture
        blocks:
          - type: paragraph
            body: >-
              OPSWAT's product surface is unusually broad for a company most often summarized as a file-security vendor.
              The retained product pages show a prevention-first stack that starts with MetaDefender Core for file
              inspection, Deep CDR, multiscanning, vulnerability checks, and policy orchestration, then fans outward
              into Access for device trust, OT Security for visibility and patching, Kiosk and Drive for removable-media
              and transient-device screening, NetWall for one-way and cross-domain transfer, and Managed File Transfer
              for policy-governed digital exchange. That breadth matters because the platform is coherent at the
              workflow level: the same file can be scanned, sanitized, transferred, and policy-enforced across multiple
              trust boundaries instead of being handed off between unrelated point tools. The architectural story is
              strongest where OPSWAT can point to layered controls rather than single features. Core publishes APIs,
              ICAP, SIEM, SOAR, and storage integrations; NetWall adds deterministic transfer controls; and the GitHub
              deployment surfaces show that OPSWAT is also willing to meet customers in infrastructure-heavy
              environments rather than only sell sealed appliances. The caveat is that many of those layers are still
              documented primarily through vendor surfaces rather than independent technical validation.
