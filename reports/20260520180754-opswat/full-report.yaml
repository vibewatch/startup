      - number: '2.4'
        title: Growth drivers, adoption constraints, and contradictory evidence
        blocks:
          - type: paragraph
            body: >-
              The demand case is real, but the market is still hard. Dragos and Fortinet both describe a threat
              environment that is pushing industrial operators toward better visibility, segmentation, incident
              response, and platform consolidation. Dragos also shows why buyers still feel under-defended: only 12.6%
              of respondents reported full visibility across the ICS Cyber Kill Chain, even though asset inventory and
              visibility ranked as the top technology investment area. Compliance compounds that pressure rather than
              replacing it. CISA's CPGs, IEC 62443, NIS2, FERC-approved CIP changes, and TSA pipeline directives all
              raise the floor on governance, remote access, change detection, and incident response. At the same time,
              the same sources explain why adoption is slow and why TAM inflation is risky. Mordor highlights high
              implementation cost, legacy protocol incompatibility, budget deprioritization, and OT-talent shortages.
              Fortinet notes that many OT environments still rely on decade-old or older systems that cannot be patched
              conventionally, while SecurityWeek and Industrial Cyber argue that visibility and secure remote access
              remain underfunded despite their high ROI. Dragos' financial-risk work adds another caution: the stakes
              are large, but so are the indirect losses and the sector concentration in manufacturing and North America.
              The net result is a market where urgency is genuine, but sales cycles, integration friction, procurement
              timing, and overlapping incumbent platforms can all compress the practical SOM available to a private
              vendor like OPSWAT.
