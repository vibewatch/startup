      - number: '8.2'
        title: Public and private comparable valuation analysis
        blocks:
          - type: paragraph
            body: |-
              The OT and critical-infrastructure cybersecurity peer set is small but informative. Dragos is the most
              direct private comparable: its $440M total raised and $1.7B valuation - unchanged across the 2021
              Series D and 2023 Series D extension - maps to GetLatka's $154.4M ARR estimate, implying roughly 11x
              ARR. TechCrunch confirmed the $1.7B post-money valuation remained flat for two years running. Nozomi
              Networks was acquired by Mitsubishi Electric for approximately $1B in total consideration ($883M in
              cash for the 93% not previously owned) in early 2026. Nozomi had $75M revenue in 2024 (up from $62M
              in 2023), placing the M&A exit at roughly 13x revenue - a strategic-buyer premium. Claroty raised
              $150M in a 2025 Series F led by Golub Growth, with valuation reportedly growing 80% to reach
              approximately $3B; Claroty has roughly $900M total raised, serves 24 of the Fortune 100, and operates
              at a substantially larger funded scale than OPSWAT.

              On the public side, PANW, SentinelOne, and Fortinet anchor the cybersecurity spectrum. PANW reported
              $9.2B total revenue in FY2025 (15% growth), with NGS ARR of $5.6B growing 32%; at a $200B market cap
              it trades at approximately 22x trailing revenue - a premium reflecting scale, profitability, and
              platformization. Fortinet generated $6.8B revenue in 2025 with $1.85B net income (27% margin); at a
              $63.6B market cap it trades at roughly 9x revenue. SentinelOne, whose $1B LTM revenue and $84M net
              income mark a recent profitability inflection, trades at approximately 5x EV/revenue at a $5B EV.
              These public comps span 5-22x revenue, reflecting scale, margin, and growth-rate differences not
              visible in OPSWAT's public record.

              Applied to OPSWAT, the relevant private OT corridor is 10-13x ARR (Dragos at 11x, Nozomi at ~13x on
              M&A exit), not PANW's 22x premium. At a $1.8B hypothetical entry and GetLatka proxy ARR of $121.8M,
              the implied multiple is approximately 14.8x ARR - above the private OT corridor. If actual OPSWAT ARR
              is higher (e.g., $140-160M), the implied multiple falls to 11-13x, still at the top end of the
              comparable range. In no scenario does $1.8B look obviously cheap without confirmed ARR, gross margin,
              NRR, and preference overhang.
