  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      OPSWAT’s key risks transmit through customer acquisition speed, margin quality, renewal control, financing
      confidence, and continuity resilience.
    data:
      nodes:
        - id: founder
          label: Founder concentration
          detail: Strategy, roadmap, and governance remain closely associated with Benny Czarny.
        - id: opacity
          label: Disclosure opacity
          detail: Public materials do not reveal valuation, ARR quality, customer concentration, or direct/channel mix.
        - id: competition
          label: Platform competition
          detail: OT specialists and larger platform vendors both overlap with OPSWAT’s scope.
        - id: friction
          label: Deployment friction
          detail: Reviews still cite tuning, documentation, reporting, and pricing pressure.
        - id: channel
          label: Channel dependence
          detail: Partner routes expand reach but can blur customer ownership and margin capture.
        - id: legal
          label: Legal / facilities shocks
          detail: Litigation and Tampa site issues can create operating distraction.
        - id: revenue
          label: Revenue quality
          detail: Win rate, pricing power, and renewal control become harder to underwrite.
        - id: valuation
          label: Valuation confidence
          detail: Opacity plus execution noise narrows acceptable entry price.
        - id: resilience
          label: Operating resilience
          detail: Continuity, patch response, and customer satisfaction absorb the risk burden.
      edges:
        - from: founder
