      - number: '4.4'
        title: Capital adequacy and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              The only publicly disclosed external financing event in the sources reviewed for this chapter is the March
              2021 $125 million Brighton Park investment. Management said those proceeds would fund global expansion,
              R&D, customer success, business operations, and strategic acquisitions. Since then, the company has
              clearly scaled: disclosed customer count doubled from more than 1,000 to more than 2,000, office count
              rose from 10 to 22, headcount moved from roughly 350-400 to more than 1,000, and growth releases reported
              ARR expansion above 25% in both the 2023 and 2025 year-end periods. Those operating proxies show the
              business did not stagnate after the 2021 round.


              What they do not show is whether OPSWAT is now self-funding that expansion, still drawing down 2021
              capital, using undisclosed debt, or relying on private follow-on financing not visible in the reviewed
              record. There is no public cash balance, no disclosed burn or runway, no debt or credit facility terms, no
              audited financial statements, no absolute ARR or revenue, and no disclosed gross margin. Even the
              strongest growth disclosures are company claims without a public financial denominator. That leaves
              underwriting in an awkward middle ground: there is enough evidence to believe the business has real
              commercial momentum and meaningful scale, but not enough to quantify revenue quality, capital efficiency,
              or financing dependency. A disciplined investor should therefore treat capital adequacy as unresolved
              rather than assumed healthy.
