      - number: '7.4'
        title: Legal, facilities, disaster exposure, and residual diligence asks
        blocks:
          - type: paragraph
            body: >-
              The adverse record around OPSWAT is still modest relative to the size of its growth story, but it is
              material enough that it should shape diligence. On litigation, PacerMonitor shows that PacSec3 sued Opswat
              for patent infringement in October 2024 and that the case was closed after a voluntary dismissal with
              prejudice in March 2025. On facilities, a Tampa Bay Business Journal report republished by Appraisal
              Development said OPSWAT faced an eviction lawsuit tied to hurricane damage and repair disputes at
              SkyCenter One near Tampa International Airport. At the same time, OPSWAT’s current contact page lists a
              different Tampa headquarters address than the one still displayed by CB Insights, which means an outside
              investor cannot tell from public material alone which site, lease obligations, or continuity controls
              actually govern headquarters operations. That matters because Hillsborough County, NOAA’s county hazard
              mapping, and the National Hurricane Center all point to meaningful hurricane and storm-surge exposure
              across the broader Tampa region. OPSWAT’s legal center also highlights privacy, compliance, export,
              supplier-conduct, and IP obligations, underscoring that the company sells into regulated environments
              where execution failure can create more than just product churn. The right conclusion is not that OPSWAT
              is in distress; it is that the company carries a real stack of legal, product-security, and facilities
              risks that remain only partially underwritten publicly. Investment conviction should therefore remain
              conditional on litigation follow-through, patch-response discipline, channel mix disclosure, and direct
              evidence that business continuity and lease issues are controlled rather than merely survivable.
