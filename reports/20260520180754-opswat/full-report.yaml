      - number: '1.4'
        title: Milestones, partnerships, and adverse events
        blocks:
          - type: paragraph
            body: >-
              The dated milestone record shows a company that moved from founder-built bootstrapping into scaled
              commercial execution, but also one that still carries pockets of legal and operational risk. Core
              milestones begin with the 2002 founding, the December 2020 headquarters move to Tampa, and the March 2021
              Brighton Park financing that funded expansion, R&D, customer success, and acquisitions. OPSWAT then
              deepened its Tampa commitment through a 2022 SkyCenter|ONE headquarters lease and a 2023 inauguration of
              the global headquarters and CIP lab. Product inflection points include the 2022 launch of MetaDefender OT
              Security, the March 2026 launch of MetaDefender Aether, and the April 2026 Emerson reseller agreement, all
              of which reinforce the company's push deeper into critical-infrastructure and OT workflows. The February
              2026 year-in-review release is also important because it tied those product and partnership moves to
              explicit scale markers such as more than 2,000 customers, more than 1,000 employees, 22 offices, and more
              than 25% ARR growth in 2025. Adverse signals are smaller than the growth narrative but still material. A
              patent case against OPSWAT was filed in October 2024 and terminated in March 2025, and NewsBreak reported
              a November 2025 eviction lawsuit tied to hurricane damage at the Tampa headquarters.
