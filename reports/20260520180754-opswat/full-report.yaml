      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at rumored $1.8B - evidence is insufficient to underwrite the price
            body: |-
              At approximately $1.8B, an investor is paying 12-15x proxy ARR for a company that discloses no
              absolute revenue, gross margin, NRR, or preference stack. The comparable set (Dragos 11x ARR; Nozomi
              13x revenue on strategic M&A exit) shows that $1.8B requires OPSWAT ARR to be at or above $140M and
              a multiple at the top of the OT private-market range - both unverifiable without a data room. The
              recommendation is research-more: not a pass on OPSWAT's quality, but a refusal to price in
              unconfirmed information. A buy call at or below $1.3B (base-case fair value) would be warranted if
              audited ARR, gross margin, and cap table data confirm the bull-case assumptions.
            calloutType: recommendation
            claimRefs:
              - CV008
