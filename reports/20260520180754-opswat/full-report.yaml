      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - ARR confirmation far below proxy
        - Confirmed ARR < $110M
        - GetLatka proxy overstated; $1.8B entry implies >16x ARR; far above any OT comp multiple
        - Halt investment; renegotiate entry price to $900M-$1.1B range or pass
      - - Gross margin below software threshold
        - Gross margin < 50%
        - Hardware weight makes OPSWAT a tech services company; 5-7x revenue appropriate
        - Write down fair value 30-50% from $1.8B; reassess multiple basis entirely
      - - Senior preference above Brighton Park discovered
        - Any equity or debt senior to 2021 Brighton Park round
        - Common equity participates after senior preferences; effective entry cost is higher
        - Require full cap-table disclosure and waterfall analysis before closing
      - - IPO path stalled more than 18 months
        - No S-1 or IPO mandate filed through end of 2027
        - Exit liquidity window compressed; only M&A path remains; acquirer may not pay $1.8B
        - Downgrade to hold; seek secondary liquidity if available; reduce position target
      - - Flagship federal customer lost
        - Loss of any DOD DHS or top-5 nuclear facility contract
        - Regulatory reference story breaks; premium multiple erodes 2-3 turns
        - Reassess valuation; OT premium falls to Fortinet-like 9x implying $1.1B-$1.4B fair value
      - - Down round below $1B
        - New equity raised at less than $1B post-money
        - Valuation destruction; common equity potentially wiped
        - Kill trigger; full exit of position at whatever liquidity is available
    notes: >-
      Triggers are defined against the hypothetical $1.8B entry price with proxy ARR of $120-150M. Thresholds are
