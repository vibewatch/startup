              Managed File Transfer, central management, or additional validation layers; and Emerson’s reseller
              agreement suggests OPSWAT can ride into power and water accounts via an installed automation ecosystem.
              The main underwriting gaps are not about whether customers exist, but about how durable and concentrated
              revenue is. No public source here discloses NRR, GRR, churn, or top-customer exposure. Anonymous airport,
