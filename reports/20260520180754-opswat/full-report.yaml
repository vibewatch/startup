        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is strongest around founder continuity and weaker on formal governance structure.
              Benny Czarny is still the clearest anchor in the public materials: founder, CEO, and chairman of the
              board, as well as the principal external spokesperson across funding, headquarters, and product-launch
              announcements. The current management roster published by OPSWAT shows functional coverage across finance,
              operations, product, legal, HR, and sales, with Bill Carey as CFO, Michael Barker as CISO and COO, Yiyi
              Miao as CPO, and Eric Spindel as general counsel and corporate secretary. The main recent leadership
              change visible in retained sources is Jan Miller's February 2026 elevation to CTO, which formalized the
              company's emphasis on adaptive sandboxing and perimeter threat detection. Even with that bench, key-person
              concentration remains high. Czarny appears repeatedly as founder, CEO, chairman, financing counterpart,
              and public thought leader, which suggests strategic, cultural, and capital-markets dependence on one
              executive. Governance transparency is the bigger weakness. Retained public sources do not provide a clean,
              current roster of independent directors or board committees, so later diligence should confirm control
              rights, committee chairs, and succession planning rather than inferring them from management bios.
