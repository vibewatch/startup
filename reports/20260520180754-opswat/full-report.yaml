  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              OPSWAT is not competing in a single clean category. The real buyer problem is how to let files, devices,
              vendors, and data cross trust boundaries in industrial environments without creating new attack paths or
              operational downtime. That creates a mixed field. Pure-play OT and CPS vendors such as Claroty, Dragos,
              and Nozomi own the most credible public narrative around asset discovery, anomaly detection, threat
              intelligence, and CPS platform leadership. Fortinet, Palo Alto Networks, Microsoft, and Tenable attack the
              same budgets from adjacent control planes by extending existing firewall, exposure-management, or SOC
              platforms into OT. Trellix and Symantec or Broadcom cover part of the same job for file inspection, but
              mainly at gateways, repositories, and web or email layers. Honeywell SMX, Owl, Advenica, and Waterfall
              compete when the requirement collapses to removable-media governance or high-assurance one-way transfer.
              Independent commentary is adverse to any claim that OPSWAT leads the full OT platform market:
              Gartner-based coverage and Dale Peterson both place OPSWAT outside the pure-play leadership set and closer
              to a niche or family-solution position. That does not make OPSWAT irrelevant; it means its shortlist logic
              is boundary control, not generic OT platform replacement.
            claimRefs:
