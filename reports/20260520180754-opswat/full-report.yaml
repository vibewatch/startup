      - number: '1.3'
        title: Funding, valuation, and scale signals
        blocks:
          - type: paragraph
            body: >-
              OPSWAT's capital story is narrower than many late-stage cyber peers because the public record points to
              one clearly disclosed institutional financing: a $125 million growth investment announced on March 31,
              2021 from Brighton Park Capital. That round appears consistently across company materials, Brighton Park's
              own site, PRNewswire, SecurityWeek, CRN, Tracxn, and CB Insights, and CRN explicitly framed it as the
              first outside funding since the company's 2002 founding. On that basis, the most defensible publicly
              corroborated lifetime capital figure is still $125 million. What the public record does not cleanly
              support is just as important. Retained sources did not corroborate the user-supplied KKR-led financing
              characterization or a supportable ~$1.8 billion valuation, and no current debt, credit, or secondary-sale
              disclosures were retained. Operating scale is better supported than valuation: the 2021 financing
              materials put OPSWAT at close to 400 employees and more than 1,000 customer organizations, while the
              February 2026 company update raised those signals to more than 1,000 employees and over 2,000 customers.
              Absolute ARR and revenue run-rate remain private even though the company did disclose more than 25%
              year-over-year ARR growth in 2025.
