  - id: TR005
    title: Mitigation and thesis-break criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Product-security credibility
        - New severe CVEs or delayed fixes in MetaDefender products
        - Any critical vulnerability with patch SLA above customer contract norms or weak notification discipline
        - Recut downside case; require security program evidence before underwriting multiple expansion
      - - Founder / governance concentration
        - Leadership change or concentrated decision bottlenecks
        - Founder role change without documented succession or material board conflict
        - Pause investment until delegated operating model and board controls are verified
      - - Valuation / funding opacity
        - Financing need without disclosure support
        - New capital raise sought without transparent ARR, burn, or customer-cohort evidence
        - Treat valuation as speculative; tighten price or defer
      - - Channel dependence
        - Partner concentration or declining direct sales control
        - One partner or vehicle becomes dominant without clear renewal ownership rights
        - Underwrite lower gross margin and weaker retention control
      - - Sales-cycle and deployment friction
        - Rising complaints about tuning, support, or reporting
        - Reference calls confirm repeated rollout delays, false-positive pain, or support bottlenecks
        - Increase churn assumptions and reduce attach-rate expectations
      - - Legal / facilities exposure
        - Unresolved litigation, HQ disruption, or continuity weakness
        - Lease dispute persists, insurance recovery stalls, or no tested continuity plan for Tampa operations
        - Escalate diligence; if unresolved, classify as thesis-breaker for concentrated growth assumptions
    notes: Thesis-break criteria are intentionally monitorable and linked to observable operating, legal, financing, and customer-execution events rather than broad macro narratives.
