  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-and-valuation-opacity
      missingEvidence: Current ARR, growth rate, gross margin, burn, cash runway, and valuation-support materials such as the latest board deck or financing model.
      whyItMatters: Public sources confirm a historical funding round but do not let an investor judge present-day valuation or downside protection.
      diligencePath: Request the latest budget versus actuals, fundraising materials, debt schedule, and management bridge from 2021 financing to current operating profile.
      relatedQuestionRefs:
        - QR005
        - QR025
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-10 ARR share, largest-customer exposure, churn by cohort, and renewal calendar.
      whyItMatters: OPSWAT sells into regulated and partner-mediated accounts where a few large programs could dominate economics.
      diligencePath: Request customer cohort tables, top-customer ARR waterfall, logo churn by segment, and renewal history for the 20 largest accounts.
      relatedQuestionRefs:
        - QR021
      relatedTableRefs:
        - TR003
    - type: private-evidence-only
      severity: material
      topic: channel-mix
      missingEvidence: Direct-versus-channel ARR mix, partner-influenced pipeline, partner discounting, and top-partner concentration.
      whyItMatters: Partner leverage can accelerate growth while also masking gross margin quality and renewal ownership.
      diligencePath: Request partner-sourced bookings, partner-attributed pipeline conversion, top-partner revenue share, and direct-sales productivity by region.
      relatedQuestionRefs:
        - QR022
      relatedTableRefs:
        - TR003
    - type: missing-source
      severity: material
      topic: facilities-and-continuity
      missingEvidence: Current HQ lease terms, insurance claims or recovery status, disaster-recovery plan, and alternate-site readiness for Tampa operations.
      whyItMatters: The reported hurricane-related lease dispute and Tampa hazard exposure make continuity and facilities resilience directly relevant to execution risk.
      diligencePath: Request the current lease file, landlord correspondence, insurance claim summary, tested BCP/DR documents, and site hardening checklist.
      relatedQuestionRefs:
        - QR023
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: governance-rights
      missingEvidence: Board committee charters, investor consent rights, delegation matrix, and documented succession plan.
      whyItMatters: Founder concentration is manageable only if real governance controls and succession scaffolding exist behind the public narrative.
      diligencePath: Request governance package, board minutes summary, investor rights schedule, and named emergency successors for CEO, CTO, and revenue leadership.
      relatedQuestionRefs:
        - QR002
        - QR025
      relatedTableRefs:
        - TR004
