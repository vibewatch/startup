tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary workflow / user
  - Published maturity / status
  - Differentiation
  - Main diligence gap
  rows:
  - - MetaDefender Core
    - File-upload, download, email, storage, and API workflows for security teams and application owners
    - Established flagship platform
    - Combines multiscanning, Deep CDR, DLP, vulnerability checks, and sandboxing inside one file pipeline
    - Independent proof for detection and performance claims remains thin
  - - Deep CDR
    - Security and compliance teams sanitizing risky documents and archives
    - Established shared engine
    - Prevention-first file regeneration instead of pure detection
    - No independently retained processing-speed benchmark
  - - MetaDefender Kiosk
    - Plant entry, media-ingress, and air-gap staging for OT/site teams
    - Mature hardware family with multiple form factors
    - Turns removable-media inspection into a repeatable kiosk workflow with policy and media-type coverage
    - Throughput and setup metrics are vendor-led
  - - MetaDefender Drive
    - Transient laptops, new workstations, and portable endpoints before network contact
    - Specialized portable control
    - Pre-boot plus in-session scanning without installing software on target device
    - Public evidence is strong on feature set but limited on large-scale deployment stats
  - - MetaDefender Access
    - Identity, endpoint compliance, and remote vendor / employee access
    - Mature adjacent platform
    - Deep compliance plus vulnerability and patch awareness, not just network access checks
    - Reference architectures beyond headline partner pages are limited
  - - MetaDefender OT Security
    - OT asset visibility, monitoring, vulnerability and patch workflows for plant or enterprise OT teams
    - Growth module launched in 2022 and actively repositioned
    - OT-friendly interface plus sensor-and-dashboard model tied to firewall integration
    - Independent proof of multi-site outcomes and low-impact deployment is limited
  - - MetaDefender NetWall / diode family
    - Cross-domain, one-way, and secure OT-to-IT data transfer
    - Mature gateway family expanded with Fend assets
    - Hardware-enforced data-flow controls plus OPSWAT file-security layers on select variants
    - Certification and protocol scope varies materially by model
  - - MetaDefender Managed File Transfer
    - Policy-governed file exchange across IT, OT, cloud, and regulated reporting flows
    - Newer but clearly marketed module
    - Embeds threat prevention and approvals directly into MFT workflows instead of bolting on scanning
      later
    - Third-party implementation proof is thinner than vendor positioning
  - - MetaDefender Aether
    - Perimeter file verdicting for SOC and zero-day detection workflows
    - Newest AI-centric launch
    - Unifies reputation, dynamic analysis, ML scoring, and threat hunting into one decision pipeline
    - Independent benchmark evidence for efficacy and efficiency claims was not retained
  notes: Rows separate well-established modules from newer launches and preserve where proof is mostly
    vendor-led rather than independently benchmarked.
