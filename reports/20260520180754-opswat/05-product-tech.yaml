  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmark-proof
    missingEvidence: Independent benchmark packets or lab reports for Kiosk throughput, Core multiscanning
      efficacy, and Aether's 99.9% / 100x claims.
    whyItMatters: Product performance and resource-efficiency claims are central to the investment case
      but are still mostly vendor-led in retained sources.
    diligencePath: Request third-party benchmark reports, customer acceptance-test artifacts, and architecture
      notes showing file-size distribution, latency, and hardware assumptions behind the published metrics.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: certification-boundary
    missingEvidence: A module-by-module certification matrix showing which specific hardware, software,
      or cryptographic components hold formal certifications versus only map to compliance frameworks.
    whyItMatters: Certification language is a recurring buyer lever in critical infrastructure, and over-reading
      framework-support claims as audited certification would materially distort product risk.
    diligencePath: Request current certificates, scope statements, test lab references, and SKU-level
      mapping for NetWall, Drive, Kiosk, Aether, and any platform-wide compliance assertions.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: ot-security-outcomes
    missingEvidence: Independent customer deployment outcomes for OT Security covering asset-discovery
      accuracy, sensor coverage, patching effectiveness, and operational load at multi-site scale.
    whyItMatters: OT Security is the company’s most ambitious expansion beyond boundary control, but the
      public record is still far thinner than for Core, Kiosk, or transfer controls.
    diligencePath: Obtain redacted production references, proof-of-value reports, and architecture review
      decks from at least two industrial customers and one systems integrator.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: access-blocked
    severity: minor
    topic: integration-doc-depth
    missingEvidence: Detailed public integration-directory pages and step-by-step public reference architectures
      for non-Ping ecosystem integrations across the broader MetaDefender platform.
    whyItMatters: The ecosystem story looks real, but most retained evidence collapses into high-level
      partner pages, repositories, or marketing copy rather than stable public implementation detail.
    diligencePath: Request the current integration directory export, supported-version matrix, and representative
      implementation guides for SIEM, SOAR, VDI, OT, and partner workflows.
    relatedQuestionRefs:
    - QE026
  - type: private-evidence-only
    severity: material
    topic: false-positive-and-latency-telemetry
    missingEvidence: Production telemetry on false positives, large-file latency, scan-volume ceilings,
      and remediation workload across enterprise deployments.
    whyItMatters: Independent reviews confirm tuning effort and performance tradeoffs, but anecdotal comments
      are not enough to underwrite how the platform behaves under real enterprise or plant workloads.
    diligencePath: Ask for customer success dashboards, support ticket summaries by module, and benchmark
      runs segmented by file type, archive depth, and deployment model.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE004
