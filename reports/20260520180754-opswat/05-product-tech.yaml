- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Legacy problem
  - OPSWAT control path
  - Published benefit
  - Limitation / caveat
  rows:
  - - Inbound file upload to portal or app
    - Uploads carry malware, spoofed types, and sensitive data
    - Core -> file-type verification -> multiscanning -> Deep CDR -> DLP / sandbox as needed
    - Prevents unsafe content before execution or downstream storage
    - Detection, usability, and latency metrics are largely company-stated
  - - Portable media entering plant or secure site
    - USBs and legacy media bypass network defenses
    - Kiosk -> multiscanning -> Deep CDR -> policy enforcement -> receipt / audit trail
    - Moves media screening to a controlled entry-point workflow
    - Requires physical process design and policy tuning by site
  - - Transient vendor laptop before OT access
    - Third-party devices may carry malware or missing patches
    - Drive pre-boot or in-session scan before connection
    - Checks device trust without permanent agent install
    - Large-fleet operational metrics are not publicly quantified
  - - Remote OT vendor or employee access
    - Identity systems alone do not guarantee compliant devices
    - Access -> deep compliance -> Ping orchestration / remediation -> JIT OT or app access
    - Adds device trust and remediation into access decisions
    - Public integration detail is strongest for Ping, thinner elsewhere
  - - Secure file movement across IT and OT or regulated processes
    - Traditional MFT encrypts transfer but does not deeply inspect files
    - MFT -> approvals -> multiscanning / CDR / DLP -> governed delivery
    - Embeds security controls and auditability into transfer workflow
    - Third-party ROI and production reference depth is still limited
  - - Cross-domain or one-way OT data transfer
    - Operators need OT data out without creating a return path
    - NetWall / diode family -> protocol break / one-way optical link -> optional file security
    - Supports deterministic transfer with explicit protocol support and model range
    - Model selection and certification scope are non-trivial and not uniform
  notes: Benefits are retained public claims or review summaries; limitations preserve where deployment,
    policy design, or certification interpretation still requires diligence.
