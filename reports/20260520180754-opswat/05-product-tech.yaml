- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Representative products
  - Deployment surfaces
  - Key dependency
  - Key risk
  rows:
  - - Ingress and collection layer
    - Receive files, media, devices, and OT traffic before trust is granted
    - Core, Kiosk, Drive, MFT, OT Security sensors
    - API, kiosk appliance, portable USB, agentless sensor, transfer workflow
    - Customer process placement at the actual trust boundary
    - Control can be bypassed if workflows are only partially adopted
  - - Analysis engines
    - Run file verification, multiscanning, CDR, sandboxing, DLP, and vulnerability logic
    - Core, Kiosk, MFT, Aether
    - On-prem, cloud, hybrid, local integration
    - Third-party AV engines, OPSWAT intelligence, emulation pipeline
    - Performance and efficacy numbers are mostly vendor-led
  - - Policy and orchestration plane
    - Turn security results into allow, block, sanitize, approve, or remediate actions
    - Core, MFT, Access, My OPSWAT
    - Central dashboards, APIs, approval workflows
    - Correct policy design and role ownership
    - Initial tuning complexity is real in independent reviews
  - - Access and posture layer
    - Gate user or device access on endpoint trust and remediation
    - Access, Ping connector, OT Access
    - Cloud service, on-prem deployment, IdP workflow
    - IdP or workflow integration quality
    - Reference-architecture depth beyond named partners is limited
  - - OT visibility and active protection layer
    - Map assets, monitor traffic, and optionally enforce inline controls
    - OT Security, Industrial Firewall
    - SPAN-port sensors, site dashboards, enterprise console, inline appliance
    - Industrial protocol coverage and site engineering support
    - Independent multi-site outcome data is sparse
  - - Cross-domain transfer layer
    - Move data or files between networks while constraining or eliminating return paths
    - NetWall, Diode X, bilateral / unidirectional gateways
    - 1U server, DIN-rail, compact diode, rugged industrial form factor
    - Protocol mapping, physical topology, certification fit
    - Scope differs by model and can be over-read in marketing
  notes: Architecture rows describe the operating layers OPSWAT publishes publicly; hidden internal services,
    queueing, and performance engineering details are not disclosed in retained sources.
