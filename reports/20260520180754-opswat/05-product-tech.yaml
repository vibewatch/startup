- id: trusted-ingress-and-transfer-workflows
  title: Trusted ingress and transfer workflows
  body: 'The most defensible product narrative is not “best overall OT platform” but “boundary-control
    specialist that connects multiple ingress points.” Core secures inbound file workflows; Kiosk screens
    removable media before it reaches protected systems; Drive scans transient vendor laptops and workstations
    before or during use; Managed File Transfer applies similar controls to digital exchange; and NetWall
    enforces one-way or tightly controlled cross-domain movement when files or data must cross security
    classifications. The evidence also shows why buyers may like the platform shape. Kiosk is not just
    a scanner: OPSWAT publishes DLP, country-of-origin, vulnerability checking, encrypted-media handling,
    and integration with behind-the-air-gap controls such as Media Validation Agent and Media Firewall.
    Managed File Transfer goes beyond transport by embedding CDR, multiscanning, approvals, and audit
    trails. NetWall adds diode and gateway variants with explicit protocol and throughput tables. Together
    these surfaces describe a company that tries to turn file and device ingress into a deterministic
    operating workflow. The tradeoff is that much of the performance story remains vendor-led, especially
    around Kiosk throughput and MFT simplicity claims.'
