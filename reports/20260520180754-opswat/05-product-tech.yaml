- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Layered reading of OPSWAT's product stack from ingress points through analysis, policy, operational
    control, and cross-domain transfer.
  approximationNotes: Architecture is synthesized from public product pages and repositories; internal
    queueing, storage, and orchestration services are not publicly documented in detail.
  data:
    layers:
    - id: l1
      label: Ingress surfaces
      detail: Files, removable media, transient laptops, remote users, OT traffic, and cross-domain transfers
        enter the platform through Core, Kiosk, Drive, Access, OT Security sensors, or NetWall.
    - id: l2
      label: Analysis engines
      detail: Metascan multiscanning, Deep CDR, vulnerability assessment, DLP, adaptive sandboxing, and
        Aether threat analysis form the main decision engines.
    - id: l3
      label: Policy and orchestration
      detail: Core, MFT, and Access convert scan results into allow, sanitize, block, remediate, or approval
        workflows.
    - id: l4
      label: Operational control planes
      detail: OT Security dashboards, My OPSWAT management, and partner orchestration surfaces provide
        cross-site visibility and operational actions.
    - id: l5
      label: Deterministic transfer and segmentation
      detail: NetWall, diode variants, and OT access controls constrain how trusted content and telemetry
        move between networks.
    - id: l6
      label: Deployment and developer surfaces
      detail: Kubernetes guidance, browser extensions, SDKs, APIs, and partner connectors expose the stack
        beyond appliance-only deployment.
