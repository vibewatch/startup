- id: leadership-governance-and-key-person-risk
  title: Leadership, governance, and key-person dependence
  body: 'Leadership visibility is strongest around founder continuity and weaker on formal governance structure. Benny Czarny is still the clearest anchor in the public materials: founder, CEO, and chairman of the board, as well as the principal external spokesperson across funding, headquarters, and product-launch announcements. The current management roster published by OPSWAT shows functional coverage across finance, operations, product, legal, HR, and sales, with Bill Carey as CFO, Michael Barker as CISO and COO, Yiyi Miao as CPO, and Eric Spindel as general counsel and corporate secretary. The main recent leadership change visible in retained sources is Jan Miller''s February 2026 elevation to CTO, which formalized the company''s emphasis on adaptive sandboxing and perimeter threat detection. Even with that bench, key-person concentration remains high. Czarny appears repeatedly as founder, CEO, chairman, financing counterpart, and public thought leader, which suggests strategic, cultural,
    and capital-markets dependence on one executive. Governance transparency is the bigger weakness. Retained public sources do not provide a clean, current roster of independent directors or board committees, so later diligence should confirm control rights, committee chairs, and succession planning rather than inferring them from management bios.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO029
  - CO037
  - CO040
  tableRefs:
  - TO002
- id: funding-valuation-and-scale-signals
  title: Funding, valuation, and scale signals
  body: 'OPSWAT''s capital story is narrower than many late-stage cyber peers because the public record points to one clearly disclosed institutional financing: a $125 million growth investment announced on March 31, 2021 from Brighton Park Capital. That round appears consistently across company materials, Brighton Park''s own site, PRNewswire, SecurityWeek, CRN, Tracxn, and CB Insights, and CRN explicitly framed it as the first outside funding since the company''s 2002 founding. On that basis, the most defensible publicly corroborated lifetime capital figure is still $125 million. What the public record does not cleanly support is just as important. Retained sources did not corroborate the user-supplied KKR-led financing characterization or a supportable ~$1.8 billion valuation, and no current debt, credit, or secondary-sale disclosures were retained. Operating scale is better supported than valuation: the 2021 financing materials put OPSWAT at close to 400 employees and more than 1,000
    customer organizations, while the February 2026 company update raised those signals to more than 1,000 employees and over 2,000 customers. Absolute ARR and revenue run-rate remain private even though the company did disclose more than 25% year-over-year ARR growth in 2025.'
