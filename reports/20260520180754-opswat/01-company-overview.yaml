company:
  name: OPSWAT
chapter:
  number: 1
  title: Company Overview
  summary: OPSWAT is a founder-led, private critical-infrastructure cybersecurity vendor founded in 2002 and now headquartered in Tampa, Florida. Public sources support a prevention-first product suite centered on MetaDefender, MetaDefender Access, and MetaDefender OT Security; a single disclosed $125 million Brighton Park financing in 2021; and 2025-2026 scale signals of more than 1,000 employees and more than 2,000 customers. Public support for a KKR-led round, a ~$1.8 billion valuation, current debt, and absolute ARR or revenue run-rate remains incomplete.
sections:
- id: identity-product-and-footprint
  title: Identity, product, and footprint
  body: 'OPSWAT presents itself as a private, prevention-first cybersecurity company built for critical infrastructure operators spanning IT, OT, and ICS environments. The public record is consistent on the company''s 2002 founding by Benny Czarny and on the durable product identity built around the MetaDefender platform. The portfolio evidence is also strong enough to be specific rather than generic. MetaDefender remains the umbrella advanced-threat-prevention platform, MetaDefender Access handles secure device and application access with deep endpoint-compliance controls, and the product formerly surfaced through the /products/neuralyzer path now resolves to MetaDefender OT Security for industrial asset visibility and OT network monitoring. OPSWAT''s geographic identity has also matured in public view. After relocating headquarters from San Francisco to Tampa, the company signed a long-term SkyCenter|ONE lease and later inaugurated a nearly 32,000-square-foot global headquarters and CIP
    lab at Tampa International Airport. Current scale is directionally strong: the company says it has more than 2,000 customers and more than 1,000 employees, but the exact current office count still depends on source definition because OPSWAT cites 22 offices while Craft detects 17 locations.'
