  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-revenue-disclosure
    missingEvidence: A board-approved financing memo, investor update, or management KPI pack showing current valuation, absolute ARR, and revenue run-rate.
    whyItMatters: Company overview needs a supportable valuation and revenue baseline for later financial and valuation chapters, and the public record does not provide one.
    diligencePath: Request the latest board materials, investor presentation, or monthly KPI dashboard with financing and revenue metrics.
    relatedQuestionRefs:
    - QO016
    - QO019
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: capital-structure-detail
    missingEvidence: A current cap table or financing summary covering ownership percentages, secondaries, debt, and any credit facilities.
    whyItMatters: Without cap-structure detail, investor influence, liquidation preferences, and refinancing risk cannot be evaluated cleanly.
    diligencePath: Obtain the current cap table, financing documents, and treasury summary from management or counsel.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: governance-roster
    missingEvidence: A current board roster with independent directors, committee assignments, and any observer or investor-rights information.
    whyItMatters: Founder concentration can only be assessed properly if the current governance counterweights and committee structure are known.
    diligencePath: Request the board list, committee charters, and any investor-rights or observer agreements.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: public-milestone-chronology
    missingEvidence: A management-confirmed chronology covering all private product launches, leadership changes, financing steps, and office openings.
    whyItMatters: The milestone table is sufficient for public ground truth but not guaranteed to capture every inflection point relevant to later diligence.
    diligencePath: Request an internal milestone timeline or use management interviews to reconcile omitted internal milestones.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO004
