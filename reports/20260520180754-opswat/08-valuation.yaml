callouts:
- calloutType: recommendation
  title: Research-more at rumored $1.8B - evidence is insufficient to underwrite the price
  body: |-
    At approximately $1.8B, an investor is paying 12-15x proxy ARR for a company that discloses no
    absolute revenue, gross margin, NRR, or preference stack. The comparable set (Dragos 11x ARR; Nozomi
    13x revenue on strategic M&A exit) shows that $1.8B requires OPSWAT ARR to be at or above $140M and
    a multiple at the top of the OT private-market range - both unverifiable without a data room. The
    recommendation is research-more: not a pass on OPSWAT's quality, but a refusal to price in
    unconfirmed information. A buy call at or below $1.3B (base-case fair value) would be warranted if
    audited ARR, gross margin, and cap table data confirm the bull-case assumptions.
  claimRefs:
  - CV008
  - CV009
  - CV016
  - CV036
  - CV038
  - CV039
  - CV040
  - CV041
- calloutType: risk
  title: KKR/$1.8B claim is unverified - do not anchor to an unconfirmed price
  body: |-
    The rumored KKR-led round at ~$1.8B appears in market conversations but is absent from every public
    source reviewed: OPSWAT's own releases, Brighton Park's website, SecurityWeek, CRN, TechCrunch, CB
    Insights, Tracxn, and GetLatka all fail to mention a KKR investment or a $1.8B mark. Anchoring
    diligence or a competitor analysis to this price without public confirmation introduces false precision
    risk. If the round occurred but is undisclosed, the preference and liquidation stack created by that
    round is also undisclosed - a senior risk to common equity holders. If the round did not occur, $1.8B
    is an unanchored number that could mislead valuation benchmarking.
  claimRefs:
  - CV004
  - CV008
  - CV010
  - CV011
  - CV012
  - CV045
- calloutType: insight
  title: Nozomi M&A exit at ~13x revenue provides the most useful private comp for OPSWAT exit scenario
  body: |-
    Nozomi Networks was acquired by Mitsubishi Electric for approximately $1B total consideration ($883M
    in cash for 93% of shares) in early 2026, against $75M in 2024 revenue - a ~13x revenue exit
    multiple paid by a strategic buyer. OPSWAT's proxy ARR of $120-150M and its OT/CIP positioning make
    it a plausible strategic acquisition target. If OPSWAT can demonstrate $140M+ ARR and a defensible
    gross margin, a strategic buyer could justify $1.5B-$2B. That sets the upper bound for an M&A exit
    scenario but also shows that a financial buyer paying $1.8B in a minority round is not receiving
    strategic-buyer-exit pricing from day one.
  claimRefs:
  - CV019
  - CV020
  - CV021
  - CV037
  - CV038
  - CV040
