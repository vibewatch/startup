- id: TV002
  title: Thesis and anti-thesis summary
  columns:
  - Dimension
  - Thesis argument
  - Anti-thesis argument
  - What would change the view
  rows:
  - - Market position
    - 98% of US nuclear facilities as customers; 2,000+ across 70 countries; regulatory tailwinds from
      CISA NIS2 NERC CIP
    - Market share is asserted not quantified; flagship logo losses could damage the regulatory story
    - Win-rate and churn data by vertical; confirmation nuclear contracts are multi-year and renewing
  - - Financial momentum
    - '>25% ARR growth in 2025; customer count doubled from 2021 to 2026'
    - No absolute ARR denominator; growth percentage without a base is not underwritable for valuation
    - Audited ARR confirming $140M+ and clear revenue bridge from 2021
  - - Valuation anchor
    - Rumored $1.8B is within bull-case range if ARR is $140-160M and multiple is 11-13x
    - No public source confirms $1.8B or a KKR round; paying a rumored price is disciplinary risk
    - Public confirmation of a financing event or management disclosure of cap table
  - - Exit path
    - IPO ambition since 2021; OT cybersecurity consolidation wave; Nozomi sold at ~13x revenue
    - No S-1 filed as of May 2026; Claroty and Dragos are more visible IPO candidates ahead of OPSWAT
    - IPO registration filed or binding strategic M&A term sheet at disclosed premium to $1.8B
  - - Risk and adverse signals
    - Patent case dismissed March 2025; eviction dispute is operational noise not financial distress
    - Eviction dispute at HQ creates operational uncertainty; reserve or relocation cost is undisclosed
    - Full SkyCenter One lease resolution and financial disclosure of any reserve or relocation cost
  notes: >-
    Arguments derived from publicly available sources only. Private data room evidence would materially
    update all rows.
