chapter:
  number: 8
  title: Valuation
  summary: >-
    OPSWAT's only confirmed external financing is a $125M growth investment from Brighton Park Capital in
    March 2021; no public evidence confirms a KKR-led round or the rumored ~$1.8B valuation. Using GetLatka's
    low-confidence proxy of ~$121.8M ARR for 2025 and the company's own >25% ARR growth disclosure, a
    base-case implied valuation of $1.2B-$1.54B sits below the rumored price, while a bull case of
    $1.68B-$2.24B barely brackets $1.8B at its low end. Paying ~$1.8B without private financial
    verification means buying near the top-of-base or bottom-of-bull multiple for a financially opaque
    company, making this price-sensitive: the evidence is too thin to underwrite the rumored entry, and a
    research-more call is warranted until audited ARR, gross margin, and cap-table details are confirmed.
sections:
- id: investment-thesis-context
  title: Investment thesis, anti-thesis, and valuation context
  body: |-
    OPSWAT occupies a defensible niche inside the operational technology and critical-infrastructure
    cybersecurity market - a segment attracting elevated private-market multiples as regulatory requirements
    (NERC CIP, CISA mandates, NIS2, US Critical Infrastructure Protection) force industrial operators to
    invest. The company's 'Trust no file. Trust no device' philosophy, disclosed >25% ARR growth in 2025, a
    customer base exceeding 2,000 organizations including 98% of US nuclear power facilities, and a
    patent-protected technology stack built over 22 years of founder-led iteration form the core of the
    investment thesis. OPSWAT reached 1,000+ employees by early 2026, expanded to 22 offices globally, and
    has repeatedly described an IPO as a long-term ambition since the 2021 Brighton Park investment. Tracxn
    records 1,155 employees as of April 2026 and CB Insights confirms $125M in total raised, consistent
    with official sources.
    
    The anti-thesis is equally real. OPSWAT is financially opaque: no absolute ARR or revenue, no gross
    margin, no cash balance, no burn rate, no audited statements, and no preference-stack or cap-table
    detail are publicly available. The only confirmed external financing since the company's 2002 founding
    is the $125M Brighton Park growth investment from March 2021. A rumored KKR-led round at approximately
    $1.8B has circulated in market conversations, but no public source in the research corpus - including
    OPSWAT's own releases, CB Insights, Tracxn, GetLatka, SecurityWeek, CRN, or TechCrunch - confirms this
    round. The eviction lawsuit filed against OPSWAT by the landlord of its Tampa headquarters in November
    2025 and a patent infringement case closed in March 2025 add operational friction. Hardware
    manufacturing, 22-office overhead, professional services labor, and channel-incentive costs likely pull
    OPSWAT's blended gross margin below pure-software peers, yet none of these are disclosed.
    
    GetLatka estimates OPSWAT's 2025 revenue at $121.8M - a low-confidence external proxy based on platform
    research and founder interviews rather than audited data. GetLatka's simultaneously listed 'most recent
    disclosed valuation' of $87.2M for OPSWAT reflects pre-2021 seed-era data from 2008-2009 financing
    rounds and is entirely irrelevant to current market pricing. None of the secondary databases reviewed
    corroborate a KKR round or a $1.8B mark. Investors considering OPSWAT at or near $1.8B are therefore
    asked to pay a premium against an unverified valuation anchor using financial proxies that cannot
    substitute for audited data.
