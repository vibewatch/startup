  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: OPSWAT ARR and revenue
    missingEvidence: >-
      Audited or management-confirmed ARR and revenue for FY2024 and FY2025 including monthly ARR bridge
      revenue by segment and growth trajectory.
    whyItMatters: >-
      Without a confirmed revenue denominator no valuation multiple can be accurately computed. All
      scenario analysis rests on a single low-confidence GetLatka proxy ($121.8M) making the bull base
      and bear cases highly uncertain. The $1.8B rumored entry price cannot be underwritten without this.
    diligencePath: >-
      First management meeting; request audited financial statements from CFO or independent auditor.
      Require CPA-audited revenue and gross profit for FY2024 and FY2025.
    relatedQuestionRefs:
    - QV003
    - QV005
    - QV021
    - QV031
    relatedTableRefs:
    - TV003
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: OPSWAT cap table and preference stack
    missingEvidence: >-
      Full cap table showing all share classes liquidation preferences anti-dilution terms any debt
      instruments and details of any undisclosed financing events between March 2021 and May 2026.
    whyItMatters: >-
      If a KKR or other undisclosed round created senior preferences above the 2021 Brighton Park
      investment common equity holders may participate last in any exit.
    diligencePath: >-
      Request from general counsel and CFO in pre-term-sheet data room. Require board consent minutes
      and 409A valuation history confirming no undisclosed share issuances.
    relatedQuestionRefs:
    - QV002
    - QV021
    - QV027
  - type: private-evidence-only
    severity: material
    topic: OPSWAT gross margin and cost structure
    missingEvidence: >-
      Gross margin by revenue line and operating cost structure showing software vs hardware vs services
      contribution to COGS.
    whyItMatters: >-
      Hardware and professional services revenue typically carries 30-50% gross margins vs 70-80% for
      pure software. If OPSWAT's blended margin is below 55% the appropriate revenue multiple falls
      from 12-14x to 5-8x reducing fair value at current ARR proxy from $1.8B to $600M-$1.0B.
    diligencePath: >-
      Request revenue and COGS schedule from audited P&L; segment by product line and delivery mode.
    relatedQuestionRefs:
    - QV022
    - QV032
  - type: missing-source
    severity: material
    topic: KKR valuation confirmation
    missingEvidence: >-
      Any primary or credible secondary source confirming a KKR-led financing round the round amount
      and the post-money valuation at or near $1.8B.
    whyItMatters: >-
      Without public or private confirmation the $1.8B anchor is unverifiable and could represent
      inflation of OPSWAT's value in market conversations.
    diligencePath: >-
      Direct confirmation from OPSWAT management or KKR that a round occurred including board approval
      minutes and Form D filing if the round was a US equity offering.
    relatedQuestionRefs:
    - QV002
    - QV027
