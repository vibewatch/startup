- id: exit-readiness-diligence
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: |-
    OPSWAT's CEO described an IPO as 'a couple of years away' in the March 2021 CRN interview and intended
    to scale the channel to 75% of business, strengthen compliance, and make acquisitions first. As of May
    2026, no S-1 or Form 10-K has been publicly filed, and no IPO timeline is confirmed. The most
    realistic exit scenarios are: (1) IPO in a supportive cybersecurity market window - OPSWAT would need
    revenue scale of at least $150-200M, a demonstrated gross margin profile competitive with listed peers,
    and a path to profitability; (2) strategic M&A by a large platform buyer (Palo Alto Networks,
    Fortinet, Cisco) seeking critical-infrastructure capabilities; or (3) secondary sale to growth PE at a
    higher valuation mark. The Nozomi Mitsubishi acquisition demonstrates strategic buyers will pay
    meaningful premiums (13x revenue) for differentiated OT/CIP assets. Claroty's OT market positioning
    and the broader consolidation wave support exit viability, but OPSWAT's smaller scale and lower public
    profile relative to Claroty or Dragos may limit strategic buyer interest.
    
    Thesis-break triggers: (a) ARR confirmation below $110M would imply GetLatka overstated revenue and
    the $1.8B entry was grossly mispriced; (b) gross margin below 50% indicates a hardware-services
    company, warranting a materially lower multiple; (c) any senior liquidation preference above the 2021
    Brighton Park round means common equity participates last; (d) IPO registration withdrawn or shelved
    for more than 18 months signals a stalled exit path; (e) loss of a flagship federal contract (DOD,
    DHS, or a nuclear facility) signals customer concentration risk; and (f) a down round at sub-$1B
    destroys the thesis.
    
    Final diligence asks before committing at any price above $1B: audited financials for FY2024 and
    FY2025 (ARR, revenue by segment, gross margin, EBITDA, cash); cap table showing all share classes,
    preferences, and anti-dilution terms; confirmation that no undisclosed financing events occurred
    between March 2021 and May 2026; full resolution status of the SkyCenter One lease dispute and any
    financial reserve taken; a detailed breakdown of revenue by product family; and NRR, gross churn, and
    cohort retention data for the top 100 customers by ARR.
