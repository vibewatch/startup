- id: TV006
  title: Final diligence asks
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Absolute ARR and revenue
    - Audited or management-confirmed ARR for FY2024 and FY2025 plus monthly ARR bridge
    - Without a revenue denominator no valuation multiple can be computed
    - CFO or management; require CPA-audited statements
  - - Gross margin by segment
    - Gross margin by revenue line (software hardware services professional services)
    - If blended gross margin below 55% the software-company premium multiple is unjustified
    - CFO or audit firm; request revenue and COGS schedule from audited financials
  - - Cap table and preference stack
    - Full cap table showing all share classes liquidation preferences anti-dilution and debt
    - Undisclosed senior preferences mean common equity may have no residual value even in $1.5B exit
    - General counsel or CFO; mandatory pre-closing condition
  - - Undisclosed financing events
    - Confirmation no equity round debt or secondary transaction occurred between March 2021 and May 2026
    - The rumored KKR round if real and senior creates preference overhang not visible from public data
    - Legal counsel or data room; request board consent minutes 409A history and convertible notes
  - - Lease dispute status and reserves
    - SkyCenter One eviction case status any settlement terms financial reserves and relocation plan
    - Forced relocation of global HQ would consume capital disrupt operations and delay IPO preparations
    - Legal counsel; request copy of lease eviction filing and any settlement or repair agreement
  - - NRR gross churn and cohort retention
    - Net revenue retention rate gross churn and cohort revenue retention for top-100 customer cohort
    - Without NRR investors cannot assess whether ARR growth is driven by expansion or net new logos
    - CFO or head of customer success; request in management presentation with cohort waterfall
  notes: >-
    All six items are blocking diligence gaps at any entry price above $1B. None can be inferred from
    public sources reviewed for this chapter.
