  - - Dragos
    - Private OT/ICS Series D
    - ~$154.4M ARR (GetLatka 2024); $440M total raised
    - $1.7B valuation (2021 and 2023 flat) ~11x ARR
    - Most direct private comp; shared ICS/OT focus; similar enterprise customer base
    - ARR is GetLatka estimate (low confidence); valuation flat for 2+ years and may be stale
  - - Claroty
    - Private CPS/OT Series F
    - ~$900M raised; 24 of Fortune 100 customers
    - ~$3B valuation (2025 Series F; 80% step-up from prior round)
    - OT/IT/CPS peer with similar regulatory tailwinds; sets premium ceiling for well-funded OT vendors
    - $900M raised vs OPSWAT $125M; Claroty is far more mature and funded
  - - Nozomi Networks
    - OT/ICS M&A exit (strategic)
    - $75M revenue (2024); $250M+ raised
    - ~$1B acquisition by Mitsubishi Electric (~13x revenue; strategic premium)
    - Transaction comp for strategic M&A exit in OT security; shows 13x revenue achievable
    - Strategic buyer premium above private market; Nozomi was smaller than OPSWAT proxy ARR
  - - SentinelOne (S)
    - Public cybersecurity post-IPO
    - $1B LTM revenue; 74% gross margin; $84M net income LTM
    - $5B EV / $6.1B mktcap ~5x EV/revenue (May 2026)
    - Shows public-market multiple for scaled profitable cybersecurity vendor post-IPO
    - Not OT-focused; 5x reflects post-growth-premium compression; OPSWAT is earlier stage
  - - Palo Alto Networks (PANW)
    - Public cybersecurity platform
    - $9.2B revenue FY2025 (15% growth); NGS ARR $5.6B (+32%)
    - $191B EV ~22x trailing revenue (May 2026)
    - Represents ceiling for a scaled profitable cybersecurity platform; long-term reference
    - Incomparable scale; 22x reflects profitability and Rule-of-50 OPSWAT cannot yet demonstrate
  - - Fortinet (FTNT)
    - Public network security
    - $6.8B revenue 2025; $1.85B net income (27% margin)
    - $63.6B mktcap ~9x revenue (March 2026)
    - Mid-range public comp; profitable scaled security vendor with hardware-software mix
    - Much larger scale; hardware-software diversification far broader than OPSWAT
  - - Verkada
    - Private physical security Series D
    - Revenue nearly doubled YoY at time of round (2022)
    - $3.2B valuation (2022 Series D; $205M raised; $360M+ total)
    - Shows premium multiples for high-growth physical-security platforms adjacent to OPSWAT
    - Different product vertical; 2022 vintage may not reflect current multiples
  notes: >-
    Table covers 6 comparables across OT/CIP private rounds, public cybersecurity listings, and M&A
