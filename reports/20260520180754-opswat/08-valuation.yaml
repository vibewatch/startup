- id: scenario-analysis-entry-discipline
  title: Scenario analysis, entry discipline, and valuation stance
  body: |-
    Bull case (20-25% probability): OPSWAT's ARR is $140-160M, growing at 25%+ with improving mix toward
    high-margin recurring software, gross margin above 65%, and no undisclosed senior preferences. The
    company clears its Tampa lease dispute cleanly, sustains channel expansion, and accelerates into the
    federal and international OT regulatory wave. An investor pays 12-14x ARR, implying fair value of
    $1.68B-$2.24B. At this scenario, $1.8B sits at the low end of fair value and represents an attractive
    entry for a patient investor with a 4-7 year horizon toward an IPO or strategic M&A exit comparable to
    Nozomi's ~13x revenue exit. The bull case requires confirming ARR is at or above $140M and that gross
    margin exceeds 65%.
    
    Base case (50-55% probability): OPSWAT's ARR is $120-140M, growing in the mid-20% range consistent
    with disclosed growth claims. A market-clearing multiple of 10-11x (anchored to Dragos's flat private
    mark) implies fair value of $1.2B-$1.54B. At $1.8B, the investor pays a 17-50% premium to base case.
    That premium is only justified if the investor has conviction on near-term ARR growth acceleration,
    margin expansion visibility, or strategic exit optionality not visible in the public record. At $1.8B,
    base-case math implies negative return before any dilution, preference overhang, or multiple
    compression.
    
    Bear case (25-30% probability): OPSWAT's ARR is $90-110M (GetLatka overstated), gross margin is below
    55% due to hardware and services weight, and the company requires fresh capital to sustain its
    22-office footprint. A compressed multiple of 7-9x implies fair value of $630M-$990M. At $1.8B entry,
    the bear case implies a 45-65% markdown from entry price. Bear trigger conditions include revenue
    growth decelerating below 15%, a failed IPO window, a fresh-capital raise with dilutive terms, or
    margin evidence that contradicts the software-revenue narrative.
    
    Entry discipline: At ~$1.8B, an investor effectively pays at the intersection of bull-case ARR and
    top-of-base multiple simultaneously. Neither assumption is verifiable without private data access. A
    disciplined entry requires: (a) audited ARR confirming $140M or above; (b) gross margin above 65% or
    a coherent explanation of hardware dilution; (c) cap-table review including preference stack, any
    undisclosed debt, and Brighton Park liquidation preference terms; and (d) confirmation no KKR or other
    secondary round created senior preferences above Brighton Park's 2021 investment. Without these four
    data points, the appropriate call is research-more.
