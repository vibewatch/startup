  headline: |
    OPSWAT 看起来是一家真实且已有规模的 OT/IT 网络安全平台，产品宽度和客户牵引都有可信证据；但在缺少审计财务和股权结构披露之前，公开证据仍不足以支撑传闻中的 ~$1.8B 估值，也不足以形成高置信度投资判断。
