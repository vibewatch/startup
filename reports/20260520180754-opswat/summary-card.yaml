summary:
  headline: >
    OPSWAT appears to be a real, scaled OT/IT cybersecurity platform with credible product breadth and customer
    traction, but public evidence is too thin to underwrite the rumored ~$1.8B valuation or form a high-confidence
    investment view without audited financials and cap-table disclosure.
