              或分析产品。公司还明确营销面向平台的白标
              API，以及面向商家的单平台订单导入，这意味着至少三种销售动作：开发者基础设施、商家工作流工具和企业优化。这一点很重要，因为收入模式几乎肯定是混合的。有些线条可能是与发货事件绑定的低价高频使用费；另一些线条，如保险、分析和企业服务，更像附加产品，能提高每票或每账户收入。因此，官方叙事与一家从发货
              API 基础设施起步、向相邻工作流和洞察产品外扩的公司相一致，而不是简单的按席位 SaaS 订阅。
