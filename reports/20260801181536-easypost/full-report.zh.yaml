  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 目标细分
      - 公开范围 / 规模信号
      - 差异化
      - 相对 EasyPost 的局限
    rows:
      - - EasyPost
        - API 优先的多承运商发货基础设施
        - SMB 到企业级托运方、平台、3PL
        - 可信发货 API；YC 支持；承运商抽象、追踪、保险、折扣费率
        - 中立开发者层，覆盖计费和承运商抽象
        - 相比商户运营套件，公开信息显示的全套工作流宽度更窄
      - - Shippo
        - API + 应用发货平台
        - SMB 和成长型电商商户
        - 40+ 承运商；免费和 $17/mo 入门价；827 条 GetApp 评论
        - 易用、SMB 定价透明、上手快
        - 企业工作流深度不如企业编排供应商可见
      - - ShipStation
        - 履约运营套件
        - SMB、中端市场、多渠道卖家
        - 200+ 承运商；400+ 集成；订单、库存、退货
        - 运营套件更宽，集成覆盖更广
        - 如果买方只要 API 基础设施，中立性较弱
      - - Easyship
        - 跨境发货应用 + API
        - 向国际市场扩张的电商品牌
        - 550+ 承运商；60+ 原生集成
        - 聚焦结账页落地成本和国际发货
        - 企业控制 / 规则叙事不如 Metapack 或 ProShip 明确
      - - Sendcloud
        - 以欧洲为中心的发货与退货平台
        - SMB 和中端市场商户，尤其欧洲
        - 170+ 承运商；100+ 集成；自有合约或预谈判费率
        - 区域承运商深度即插即用，退货工作流强
        - 区域强项可能比中立全球 API 广度更重要
      - - Metapack
        - 企业配送管理平台
        - 大型零售商和企业托运方
        - 一个 API；4,000+ 承运商服务；采购、追踪、退货
        - 企业承运商网络深，配送套件覆盖广
        - 企业销售推进可能更慢，定价透明度更低
      - - ProShip
        - 企业多承运商执行平台
        - 高出货量零售商、制造商、医疗健康、3PL
        - 250+ 包裹 / LTL 服务；20+ 年；百强零售商信任信号
        - 承运商无关、混合引擎、偏合规的企业定位
        - 不太适合轻量 SMB 或创业公司用例
      - - Stamps.com
        - 邮寄 / 邮资老牌厂商
        - 个人、SMB、多办公室寄件方
        - 4M+ 客户；$14.99/month；近 30 年；Auctane 旗下
        - 邮资和面单工作流简单，带办公室邮件基因
        - 定位不是中立企业发货基础设施
      - - AfterShip Shipping
        - 购后发货自动化邻近品类
        - 优化发货工作流和购后体验的品牌
        - 87+ 承运商；自动化门户；国际单证
        - 品牌化工作流强，贴近国际自动化
        - 更偏广义购后，而不是核心中立 API 身份
    notes: 这些行混合了直接竞品、企业老牌厂商和替代方案，因为买方可以从多个产品入口解决同一个任务。
