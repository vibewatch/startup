  - id: TE004
    title: 可靠性、安全与技术风险表
    columns:
      - 领域
      - 公开证据
      - 正面信号
      - 风险含义
      - 尽调追问
    rows:
      - - 可扩展架构
        - 可扩展性指南提到无状态设计、异步任务、混合 SQL/NoSQL、监控、动态限流
        - 显示出成熟工程模式
        - 高峰条件下仍取决于执行是否到位
        - 索取 SLO、尾延迟图表和承运商故障预案
      - - Webhook 安全
        - 文档和支持材料描述 HMAC、时间戳校验、重放保护、自定义标头、TLS
        - 事件认证姿态较强
        - 接收端配置错误仍会造成客户侧脆弱性
        - 索取参考实现和事故统计
      - - 事故恢复
        - 2026 年 7 月故障启用了备用数据中心，并持续发布恢复更新
        - 备用方案存在，工程团队也主动沟通
        - 托管服务商依赖仍造成 API、仪表盘和积压问题
        - 索取 RTO/RPO 和服务商集中度细节
      - - 追踪 / 报告积压
        - 状态更新提到恢复后追踪延迟和报告补录
        - 团队透明披露了次生影响
        - 购后数据滞后会削弱客户信任
        - 索取积压清理指标和客户影响复盘
      - - 承运商 / 事件复杂度
        - 平台协调 100+ 家承运商、webhook 事件和多套 API
        - 稳定时，覆盖面就是护城河
        - 覆盖面也放大故障和数据漂移的暴露面
        - 索取最常见承运商相关故障模式
      - - 文档覆盖面
        - 文档、支持材料、Postman、营销页面和博客都承载技术细节
        - 开发者生态支持丰富
        - 材料分散可能带来文档漂移或失效链接
        - 审计文档新鲜度和坏链率
    notes: 留存公开证据中，安全信号强于可用性信号；最大未知数是承运商和基础设施承压时的真实韧性。
