      - number: '8.2'
        title: 估值背景与可比逻辑
        blocks:
          - type: paragraph
            body: >-
              公开估值背景异常嘈杂。Startup Intros 将 EasyPost 对应到约 $1.5 billion 的 2026 年 1 月估值；Dealroom 将公司归为独角兽；Tracxn、Prospeo 和
              Caplight 在总融资和轮次历史上差异很大；DailyDAC UCC 出售通知中还包含一条未署名说法，称 2025 年收入超过 $100 million。Prospeo 另行估计收入约 $136
              million。若非常谨慎地使用这些收入锚点，$1.5 billion 估值意味着公开估算下约 11x–15x 的估值 /
              收入——一家私有、近似软件的基础设施公司用这样的倍数并不明显荒谬，但在证据缺口下也不明显便宜。可比逻辑有帮助，却不能解决问题。按商业模式看，Shippo 是最接近的私有可比公司，也被标记为独角兽；Tracxn
              在其 2021/2022 融资历史中显示 $1 billion 的投后参考。Pitney Bowes 比 UPS 或 FedEx
              更适合作为公开经济性参照，因为它更接近发运赋能软件和邮寄基础设施，但它更成熟、已上市，运营也不同。UPS 和 FedEx 范围太广、资产太重，不能直接当倍数可比；它们主要提供规模边界。
