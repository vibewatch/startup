      - number: '2.2'
        title: 市场规模与需求背景
        blocks:
          - type: paragraph
            body: >-
              问题不在需求，而在定义。需求侧，美国人口普查局报告 2026 年 Q1 经季调零售电商销售额为 $326.7B，同比增长 9.8%，占零售总额 16.9%。Pitney Bowes
              再把这种数字需求转化为实体包裹流动：2025 年美国包裹量达到 23.1B 件，增长 3.3%，日均 63.3M 个包裹，并展望 2031 年达到 31B 件。从供给侧软件视角看，Mordor
              Intelligence 把 2026 年包裹管理和多承运商发货软件市场估为 $2.93B；Business Research Insights 则给出两个更窄口径：多承运商包裹管理解决方案
              $0.87B，更窄的多承运商发货软件 $0.27B。这些差异并不小——它们意味着 EasyPost 的可服务市场高度取决于投资人把品类看成端到端包裹运营、专门的 MCPMS 层，还是狭义 API /
              计价工具集。正确答案是一个区间，而不是单一醒目 TAM。
