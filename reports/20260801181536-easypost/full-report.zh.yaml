      - number: '8.3'
        title: 正反论点与情景区间
        blocks:
          - type: paragraph
            body: >-
              牛市论点很直接：如果 EasyPost 能把黏性交易量、高效分销、显著伙伴杠杆和基于核心发运 API 的可变现工作流产品结合起来，它可能成为很有价值的基础设施层。若公司确实收入超过 $100
              million、留存强、支持成本受控，这一论点会更强。反论点同样清楚：发运基础设施可能有战略价值，但差异化仍不足，容易受宕机影响；一旦标签、费率和编排更商品化，承销也会变难。公开记录同时支持两种叙事，所以这里情景分析比点估值更重要。牛市情景下，更充分的私有尽调可能验证披露估值，甚至支持上行。基准情景下，EasyPost
              有吸引力，但收入质量、韧性和股权结构清晰度被证明之前，应给折价。熊市情景下，运营或披露缺口意味着正确动作不是压低价格，而是在事实改善前不投资。
