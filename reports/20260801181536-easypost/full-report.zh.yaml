  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与决策视图
        blocks:
          - type: paragraph
            body: >-
              核心建议是继续研究 / 跟踪，而不是按 2026 年 1 月披露估值激进投资。EasyPost
              有足够正面证据值得继续看：它服务真实市场，销售带工作流扩展的基础设施，也有公开采用证据和可量化客户成果。但是，公开证据不足以支撑按独角兽价格高确信承销。如果 EasyPost 确实收入超过 $100
              million、留存强、毛利率可持续，公司披露的 $1.5 billion 估值可能方向上说得通。但这些恰恰是公开证据没有充分证明的变量。而且，2026 年 7 月宕机，以及 2026 年 4 月 UCC
              出售通知暴露的资本结构模糊性，让下行情景不再只是理论。因此，这是公司质量为正、投资流程为负的案例：业务值得关注，但价格和证据包仍过松，无法干净批准。
