    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品边界
        blocks:
          - type: paragraph
            body: >-
              EasyPost 卖的不是单一承运商产品，而是发货基础设施。公司首页和关于页面称，这个以开发者为中心的平台始于 2012 年的首个发货 RESTful
              API，如今覆盖面单生成、运费比选、地址校验、追踪、保险、白标发货和 AI 辅助优化。最强的官方规模信号来自运营而非财务：EasyPost 称其服务 200+ 个国家和地区，接入 100+
              家承运商，并已为数万家企业客户处理数十亿个包裹。Y Combinator 仍把公司称为「互联网的发货基础设施」，这个简写很有用，因为产品把传统承运商集成抽象成一层 API。当前产品家族也已超出纯
              API，延伸到面向白标发货的 EasyPost Forge，以及用于分析、建议和自动面单选择的 Luma AI，说明公司正沿物流软件栈上移，而不是停留在狭窄的邮资 API 供应商位置。
