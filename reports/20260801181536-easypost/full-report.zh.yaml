  - id: TE002
    title: API 和工作流能力矩阵
    columns:
      - 能力
      - EasyPost 证据
      - 重要性
      - 公开限制 / 风险
    rows:
      - - API-key 认证 + TLS
        - Postman 要求每个请求都带 API key，并使用 TLS v1.2
        - 简单的机器认证适合开发者工作流
        - 如果密钥泄露，API-key 误用会造成高账户敞口
      - - 可复用对象和引用
        - Postman 展示可复用 id 和 reference 字段
        - 有助于用程序拼出复杂工作流
        - reference 唯一性未强制执行
      - - Webhook CRUD + HMAC
        - 文档展示创建、读取、更新、删除以及 HMAC 验证
        - 对事件驱动的航运系统至关重要
        - Webhook 接收方仍可能失败并被禁用
      - - Tracker 生命周期状态
        - Tracker 文档保存当前和历史追踪详情
        - 支撑可视性和购后自动化
        - 依赖承运商数据质量和及时性
      - - 独立保险
        - 保险文档支持带 tracking_code 的第三方货件
        - 将附加机会扩展到 EasyPost 原生面单之外
        - 需要验证；若货件历史冲突，可能被取消
      - - SmartRate 运输时效预测
        - 文档给出交付置信度和运输时效估计
        - 把数据变成路由智能，而不只是 API 抽象
        - 公开文档只能部分看出模型质量
    notes: 矩阵只标注留存文档或产品页直接证明的能力，不推断未来路线图功能。
