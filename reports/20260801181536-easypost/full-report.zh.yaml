      - number: '7.4'
        title: 财务 / 模型风险与否决条件
        blocks:
          - type: paragraph
            body: >-
              投资风险不只是 EasyPost 可能定价过高，而是公开证据无法让投资者有把握地判断“合理定价”到底是什么。发运基础设施在交易量黏性强、利润率有纪律、支持成本受控时可以是好生意。Pitney Bowes
              证明相邻发运科技业务可以有真实经济性，但这反而提高了 EasyPost
              的披露门槛。公开来源却在融资总额和估值历史上互相矛盾，官方页面几乎没有直接运营披露。关键模型风险因此被藏起来：分产品毛利率、客户集中度、净留存、争议率、营运资本需求，以及产品叙事中有多少已经变现、多少还只是愿景。正确做法不是自动否决公司，而是设定明确否决条件。如果尽调无法对齐融资历史、事件韧性、客户留存和单位经济，哪怕品牌强、独角兽身份在，投资论点也不应继续推进。
