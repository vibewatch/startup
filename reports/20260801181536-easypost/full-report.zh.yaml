            body: >-
              开发者界面是 EasyPost 公开壁垒的重要组成部分。文档首页、Postman 集合和产品页面显示，这是一套 API 优先设计，围绕可复用对象 ID、API key 认证、webhook
              事件和机器对机器工作流构建，而不是围绕人工操作。Postman 文档显示，系统支持用 API key 做 Basic Auth、强制 TLS 1.2、测试和生产 key、可复用对象引用，以及常见对象的 CRUD
              流程。Webhook 文档进一步给出更强的集成细节：HMAC 校验、可选基础认证、自定义请求头、CRUD 管理，以及失败端点的自动禁用 / 重新启用行为。SmartRate 文档展示
              delivery_date_confidence 和 estimated_transit_days，追踪和保险文档则显示 EasyPost 如何随时间承载对象状态；如果包裹能用追踪数据验证，甚至可以给在
