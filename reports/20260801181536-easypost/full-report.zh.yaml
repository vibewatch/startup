      - number: '1.5'
        title: 可靠性与负面信号
        blocks:
          - type: paragraph
            body: >-
              负面记录不到生死级，但很重要，因为 EasyPost 卖的是关键任务基础设施。EasyPost 自有状态页和事故镜像记录了 2026 年 7 月 23 日的大范围连接中断，影响 API
              和仪表盘操作，并在全面恢复前需要启用备用数据中心。独立事故镜像把这次事件概括为约 7.5 小时中断。2026 年 7 月的第二起事件显示，UPS 加限流后，UPS 操作降级约四小时，部分 BYOA
              账户在恢复后还需要重新认证。这些事件不会推翻核心论点，但很重要，因为 EasyPost 变现的是信任、自动化和可靠性。官方材料一边营销 99.99%
              正常运行时间和企业级可扩展性，一边也把尽调门槛抬高：事故频率、承运商依赖集中度，以及故障沟通能否与企业 SLA
              严丝合缝对应，都要查清。公开财务不透明进一步放大风险，因为投资人难以判断可靠性承诺背后到底投入了多少韧性建设。
