      - number: '4.3'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              最大的公开财务盲点是利润率结构。EasyPost
              的定价显示，有些产品——尤其是追踪，或许还有基础地址检查——是极小的按事件收入线，需要非常大的发货量才有意义。保险的经济性则强得多，因为它随货件价值而不是只随货件数量扩张。AI
              洞察、分析和白标平台产品在结构上也看起来比商品化面单生成更有价值。即使没有披露，可能的毛利故事也很直观：邮资和承运商费用大多穿透，真正的贡献毛利来自软件编排、数据产品和附加服务。作为外部基准，Pitney
              Bowes 的 SendTech 发货与邮寄技术部门在 2025 年产生 $1.256B 收入，调整后 EBITDA 利润率约 36.5%，即便收入在下滑。这不能告诉我们 EasyPost
              的真实利润率，但说明发货技术业务在规模化后可以产生可观盈利，同时仍受量压和产品组合影响。EasyPost 真实的单位经济可能取决于发货密度、企业客户占比、承运商钱包经济和附加率，而不是「存在一个发货
