      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              这个品类服务四类相互重叠的买方：SMB 电商商家、企业零售商和品牌、需要嵌入发货的市场平台或软件平台，以及需要为多个客户提供共享承运商层的 3PL
              或履约服务商。日常用户是运营、履约、物流、客户体验和购后团队；预算所有者通常是运营、电商、IT、采购或物流负责人。当直连承运商方案变得过于僵硬，采用就会开始。Xictron
              引用消费者在购买前查看配送选项的行为，Sellerscommerce 和 ReadyCloud
              则显示发货成本与配送条款会影响弃购和转化。规模更高后，采用路径会从面单和追踪转向承运商多元化、退货、分析和路由自动化。ReadyCloud 对 WWEX 和 FedEx
              研究的综合很重要，因为它显示典型技术栈仍然多么分裂：只有少数团队运行在单一统一物流系统上。这种碎片化正是 EasyPost 这类 API 优先平台的切入楔子。
