  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与解法
        blocks:
          - type: paragraph
            body: >-
              EasyPost 不只是与一个长得相似的 API 竞争。买方至少有六条路径解决发货编排任务：EasyPost 或 Shippo 这类 API 优先的中立层；ShipStation
              这类以应用牵引的多渠道履约套件；Easyship 这类国际商务发货层；Sendcloud 这类偏欧洲的承运商与退货平台；Metapack 或 ProShip
              这类企业配送管理栈；或者由承运商直连门户、邮寄软件和内部自建组成的现状组合。EasyPost 自有界面强调发货基础设施、折扣承运商接入、集中计费、保险和 AI 驱动决策支持。这让它在产品理念上最接近
              Shippo，但更广的竞争战场还包括那些拥有相邻工作流的供应商，例如订单管理、购后体验、退货、采购或企业承运商合规。这一点很重要，因为同一份 RFP
              可能混合工程、运营、采购和客户体验标准，即便最初痛点只是发货面单。
