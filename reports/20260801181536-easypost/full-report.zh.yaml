      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度喜忧参半。EasyPost
              的品类、客户标识和产品宽度，既支持继续私有市场复利，也兼容未来战略或公开市场相关性。但公开市场准备度不止需要一个好商业故事。投资者需要确信收入耐久性、支持经济性、合规卫生、事件韧性和治理干净度。今天的公开记录只在这些维度上提供部分支持。公司的法律文件显示专业度，客户证据显示真实使用，但硬财务披露太少，无法支撑最终投资决定。正确的最终姿态，是索要能快速证伪或验证论点的数据：股权结构表、融资时间线、按产品划分的月度收入和毛利率、NRR/GRR、集中度、事后复盘指标和支持成本趋势。如果管理层能有力补上这些缺口，建议可以实质上调。否则，独角兽身份应被视为标题，而不是决策规则。
