  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险态势
        blocks:
          - type: paragraph
            body: >-
              EasyPost 最严重的公开风险是基础设施依赖。2026 年 7 月事故很重要，因为它不只显示平台会宕机，还显示恢复本身是多阶段的：核心可用性可以恢复，但追踪和报告仍有积压。发货 API
              的业务风险很实在，因为客户获得价值不只发生在购买面单那一刻；他们还依赖可视性、下游通知和运营信心。第二大风险是商业风险。发货 API 已不再只彼此竞争。EasyPost 面临来自更便宜 SMB
              工具、区域专家、企业控制型供应商，以及把发货打包进更大工作流的套件产品的压力。这意味着 EasyPost
              必须捍卫的不只是技术能力，还有经济价值。第三大风险是披露。公开来源在融资总额、估值背景和轮次历史上存在实质分歧，官方页面也不披露现金、烧钱、留存、集中度或利润率。运营、商业和披露这三类风险相互关联：停机会削弱信任，信任变弱会增加支持成本或流失压力，而披露薄弱让投资人难以判断公司是否有足够韧性吸收这些冲击。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
              - CR015
              - CR019
              - CR020
              - CR029
              - CR030
              - CR031
              - CR032
              - CR037
              - CR040
      - number: '7.2'
        title: 监管、法律与伙伴风险
        blocks:
          - type: paragraph
            body: >-
              EasyPost 目前没有明显公开迹象显示其卷入活跃的隐私或产品执法案件，但自身法律框架把风险暴露点标得很清楚。主协议、DPA、执法机构指南和隐私相关说明显示，EasyPost
              会处理个人数据，与承运商及其他第三方产品交换客户数据，也必须回应法律程序和跨境数据规则。California Attorney General 的 CCPA 指南和 European Commission 的
              GDPR 框架说明了风险为何重要：发运基础设施经常处理姓名、地址、联系方式、跟踪事件和国际投递数据。EasyPost
              还把大量合同风险回推给客户，并限制第三方产品责任。基础设施软件常这样分配责任，但它强化的是伙伴依赖，而不是消除依赖。一旦承运商、云服务商或监管机构改规则或宕机，EasyPost
              的合同立场可能在法律上保护公司，却仍会让客户在运营上不满意。2026 年 4 月与创始人持股相关的 UCC
              出售通知本身不是运营失败，但它是有意义的法律—资本信号，因为它引入了质押、控制权和治理复杂度等问题，而公司的公开材料没有给出答案。
            claimRefs:
              - CR011
              - CR012
