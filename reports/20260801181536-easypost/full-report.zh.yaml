          label: 利润率压缩
          detail: 支持成本或定价压力上升
        - id: legal
          label: 法律 / 合规负担
          detail: 隐私、承运商或流程义务
        - id: disclosure
          label: 披露不透明
          detail: 投资人无法核验韧性或资本情况
        - id: valuation
          label: 投资信心减弱
          detail: 支付或推进意愿下降
      edges:
        - from: ops
          to: trust
          label: 服务故障
        - from: trust
          to: commercial
          label: 续约 / 赢单输单影响
        - from: commercial
          to: margin
          label: 折扣
        - from: legal
          to: margin
          label: 合规成本
        - from: margin
          to: valuation
          label: 质量疑虑
        - from: disclosure
          to: valuation
          label: 尽调缺口
        - from: ops
          to: valuation
          label: 韧性疑虑
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: EasyPost 依赖多个外部规则制定方；即便内部执行到位，这些方一旦故障或改政策，服务质量也会受损。
    claimRefs:
      - CR002
      - CR003
      - CR007
      - CR012
      - CR013
      - CR014
      - CR021
      - CR022
      - CR023
      - CR024
      - CR039
      - CR041
    data:
      nodes:
        - id: easypost
          label: EasyPost 平台
          detail: API、套件、支持和编排层
        - id: carriers
          label: 承运商
          detail: 费率、面单、追踪、规则、罚金
        - id: cloud
          label: 云 / 托管
          detail: 可用性和恢复依赖
        - id: customers
          label: 客户集成
          detail: Webhook 处理和落地质量
        - id: regulators
          label: 监管机构 / DPAs / AGs
          detail: 隐私和法律程序义务
        - id: creditors
          label: 投资人 / 债权人
          detail: 资本获取和控制权背景
      edges:
        - from: easypost
          to: carriers
          label: 依赖
        - from: easypost
          to: cloud
          label: 依赖
        - from: easypost
          to: customers
          label: 集成
        - from: easypost
          to: regulators
          label: 受制于
        - from: easypost
          to: creditors
          label: 融资背景
        - from: carriers
          to: customers
          label: 服务质量传导
        - from: cloud
          to: customers
          label: 可用性影响
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: EasyPost 业务底子不错，但公开材料不足以支撑高质量投资判断，因此给出「继续研究」建议。
    claimRefs:
      - CV001
      - CV002
      - CV010
      - CV011
      - CV021
      - CV026
      - CV037
    data:
      nodes:
        - id: market
          label: 真实市场 + 产品广度
          detail: 物流 API 叠加工作流延展
        - id: proof
          label: 已有客户验证
          detail: 有量化案例和公开部署
        - id: risk
          label: 风险 / 不透明度仍高
          detail: 宕机、披露缺口、法务和资本问题
        - id: price
          label: $1.5B 估值需要证明
          detail: 现有公开证据不足
        - id: decision
          label: 继续研究 / 跟踪
          detail: 只有完成私下尽调才推进
      edges:
        - from: market
          to: proof
          label: 支撑关注
        - from: proof
          to: risk
          label: 单独看还不够
        - from: risk
          to: price
          label: 限制投资判断
        - from: price
          to: decision
          label: 决策
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: EasyPost 的估值支撑最受收入质量、毛利率和留存影响，而不是「独角兽」这个头衔。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV019
      - CV020
      - CV024
      - CV026
      - CV028
      - CV034
    data:
      items:
        - label: 收入质量 / 收入确认
          value: 10
          detail: 最关键的缺失输入。
        - label: 毛利率结构
          value: 9
          detail: 要证明软件公司式倍数，必须看到这一项。
        - label: NRR / GRR / 集中度
          value: 9
          detail: 公开信息看不到核心持续性。
        - label: 事故韧性
          value: 8
          detail: 基础设施溢价靠信任撑住。
        - label: 股权结构 / 优先权清晰度
          value: 7
          detail: 影响入场经济性和下行风险。
        - label: AI / 工作流采用深度
          value: 6
          detail: 重要上行杠杆，不是基础情景的证据。
        - label: 独角兽标签 / 报道估值
          value: 2
          detail: 单独看决策价值弱。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 估值区间很宽，因为关键投资判断变量没有公开披露。
    claimRefs:
      - CV006
      - CV013
      - CV017
      - CV024
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
    data:
      items:
        - label: 悲观
          low: 0.5
          high: 0.9
          unit: USD billions
          detail: 运营或披露疑虑持续存在。
        - label: 基准
          low: 0.9
          high: 1.4
          unit: USD billions
          detail: 业务不错，但因不透明打折。
        - label: 乐观
          low: 1.8
          high: 2.3
          unit: USD billions
          detail: 私下尽调验证留存、利润率和韧性。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: EasyPost 的战略相关性强，但证据质量和投资判断清晰度偏弱。
    claimRefs:
      - CV001
      - CV003
      - CV010
      - CV015
      - CV021
      - CV022
      - CV026
      - CV037
      - CV041
    data:
      items:
        - label: 市场相关性
          value: 8/10
          detail: 物流基础设施仍重要且真实。
          tone: positive
        - label: 客户验证质量
          value: 7/10
          detail: 公开案例不错，但经过筛选。
          tone: positive
        - label: 护城河清晰度
          value: 6/10
          detail: 有潜力，但受商品化压力挤压。
          tone: neutral
        - label: 经济性可见度
          value: 3/10
          detail: 利润率和留存未公开披露。
          tone: negative
        - label: 风险画像
          value: 4/10
          detail: 运营和资本结构问题仍未解开。
          tone: negative
        - label: 估值支撑
          value: 4/10
          detail: 报道估值或许合理，但尚未被证明。
          tone: negative
