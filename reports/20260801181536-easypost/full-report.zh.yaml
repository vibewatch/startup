      - number: '5.4'
        title: 可靠性、安全与技术风险
        blocks:
          - type: paragraph
            body: >-
              主要产品风险是真实世界复杂性下的韧性。EasyPost 可扩展性指南称，平台在可能时保持无状态，使用异步任务处理让批量购买货件速度最高提升 10x，采用混合 SQL / NoSQL
              模型，持续监控不健康阈值，并基于累计系统负载而非简单请求数进行动态限流。这些都是可信的工程模式，但事故历史显示，技术栈仍有关键依赖。2026 年 7 月的中断由托管服务商连接问题引发，影响 API 和仪表盘，迫使
              EasyPost 通过备用数据中心恢复部分服务，并在核心服务恢复后仍留下追踪和报告积压。StatusGator 补充指出，EasyPost
              跨数十个组件发布状态，并有多年中断历史。安全姿态比可用性姿态更让人放心：webhook HMAC 校验包含时间戳检查和重放保护，更广的 API 界面要求 TLS 和秘密 API key。综合看，EasyPost
              技术上认真、集成友好，但并不能免疫基础设施集中风险、文档漂移，或协调数百个承运商和事件驱动工作流所带来的运营税。
