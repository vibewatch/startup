            body: >-
              资本充足性是公开证据最严重失效的地方。EasyPost 官方页面既不披露现金余额，也不披露烧钱、资金跑道或盈利能力。第三方数据集也没有干净解决问题：Tracxn 称 EasyPost 只融资
              $3.85M，Prospeo 称 $25M，Startup Intros 称三轮合计 $55M，同时又把公司与 2026 年 1 月 $1.5B 估值联系在一起。Caplight 进一步加入带 Series A
              / B / C 条目的后期轮次时间线，以及 2022 年 4 月最新一轮标记，进一步说明公开抓取的私营公司财务数据内部不一致。公司有经验丰富的 CFO，以及具备 SEC 和 IPO
              经验的总法律顾问，这点略微让人放心，但它是准备度信号，不是当前资产负债表强度的证据。综合来看，EasyPost
              更像一家可能资本效率较高、已经规模化的私有基础设施公司，而不是烧钱的科学项目；不过，仅凭公开材料，投资人仍无法测算收入质量、毛利率、CAC 回收、资金跑道或融资依赖。正确的财务结论是：规模有希望，透明度不足。
