        - 用来检验服务质量能否在有利润的前提下规模化
        - 支持运营 / 财务
      - - 合规态势
        - 子处理方、DSR 量、审计控制、隐私事件
        - 用来检验企业级准备度和法务悬压
        - 法务 / 安全 / 隐私
    notes: 如果这些问题得到清晰回答，EasyPost 可以从跟踪进入可投。否则，不应相信其披露估值。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
