  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              EasyPost 争夺的不是包裹承运商总收入，而是夹在商家、平台、仓库和承运商之间的软件与编排层。这个市场包括多承运商包裹管理、发货
              API、运费比选、面单生成、追踪、退货、合规工作流，以及帮助运营者决定购买哪种服务的分析或自动化层。这个边界排除了大部分实体运输收入、只做仓储的 3PL
              合同，以及优化整车、海运或空运而非包裹的重型货运运输管理系统。现状很碎：承运商直连门户、定制点对点集成、ERP 或 WMS 包裹模块，以及大量人工异常处理。nShift 和 Locus
              都把这种遗留状态称为脆弱的一次性连接网络，Xictron 则把 API 集成描述为从人工创建面单走向自动选择承运商的现实路径。这个边界对 EasyPost
              很关键，因为它支撑软件式利润率和估值逻辑，但可覆盖支出池比总发货预算暗示的范围更窄。
