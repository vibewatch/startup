      - number: '2.4'
        title: 增长驱动、约束与估值含义
        blocks:
          - type: paragraph
            body: >-
              增长驱动很直接：电商持续扩张，承运商组合变得更碎，区域和替代承运商拿到更多份额，最后一公里经济性让动态路由更有价值。ReadyCloud 和 Pitney Bowes 都强调小型承运商崛起，Maersk
              则认为多承运商灵活性正从采购策略变成韧性工具。nShift 和 ShippyPro 的 Gartner
              风格供应商摘要指向买方优先级，它们已经远超单纯运费比选：成本控制、配送体验、退货管理、可持续性，以及越来越多由 AI 驱动的运营决策。约束同样清楚。Locus 称企业团队常维护 15-30
              个点对点集成，并面临版本、SLA 和异常管理风险；nShift 把同一问题描述为平台化，用标准骨干替代数十条脆弱链路。这种市场结构对 EasyPost
              有吸引力，因为它奖励中立编排；但也意味着投资人需要按一个边界模糊的品类来测算，供应商边界会与 OMS / WMS / ERP 套件重叠，市场规模估计噪音很大，持续产品广度和核心面单生成功能同样重要。
