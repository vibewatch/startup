      - number: '1.3'
        title: 资本结构与公司画像
        blocks:
          - type: paragraph
            body: >-
              EasyPost 显然已是后期私营公司，但公开数据里的确切融资历史异常混乱。Startup Intros 称公司完成三轮、累计融资 $55M，并在 2026 年 1 月融资事件后达到 $1.5B
              估值。Caplight 也把 EasyPost 估在约 $1.5B，但把最新融资参考点放在 2022 年 4 月，并列出总融资 $203.14M。Growjo 只报告 $12.5M 总融资，Tracxn 报告
              $3.85M，而且 Tracxn 还把 EasyPost 标为已被收购。这些差异大到不能简单平均掉；它们本身就是尽调问题。较可靠的点更窄：Y Combinator 记录了 2013 年 $850K
              种子轮，Startup Intros 显示 2018 年 9 月 $50M Series A，投资人数据库反复出现 Y Combinator、SV Angel、Founders Fund、MESA
              Ventures 和 GV 等支持方。公开追踪库现在把总部放在犹他州 Lehi，而更早的 YC 时代和伙伴资料仍指向旧金山，暗示公司重心迁移，而不是一个干净的单一地点故事。
