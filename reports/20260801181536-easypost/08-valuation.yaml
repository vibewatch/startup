company:
  name: EasyPost
chapter:
  number: 8
  title: Valuation
  summary: 'EasyPost looks like a real business with meaningful customer proof, broad product coverage, and genuine scale in a strategically useful category. The problem is not whether the company is interesting; it is whether the public record is strong enough to justify a reported January 2026 valuation around $1.5 billion. On the positive side, EasyPost appears to have built a multi-carrier shipping platform with credible enterprise customers, differentiated orchestration tools, and a defensible neutral-platform position. On the negative side, public funding and revenue datasets conflict, the July 2026 outage creates a meaningful resilience question, and there is almost no public disclosure on gross margin, retention, concentration, or runway. That combination supports a constructive but price-sensitive stance: track or diligence further, but do not affirm a $1.5 billion entry price from public evidence alone.'
sections:
- id: recommendation-and-decision-view
  title: Recommendation and decision view
  body: 'The core recommendation is research-more / track rather than invest aggressively at the reported January 2026 mark. EasyPost has enough positive evidence to remain interesting: it serves a real market, sells infrastructure with workflow extensions, and has public proof of adoption and measurable customer outcomes. However, public evidence does not support high-confidence underwriting at a unicorn price. The company’s reported $1.5 billion valuation may be directionally plausible if EasyPost truly has revenue above $100 million, strong retention, and durable gross margins. But those are the exact variables public evidence does not adequately prove. Moreover, the July 2026 outage and the capital-structure ambiguity surfaced by the April 2026 UCC sale notice make the downside case more than theoretical. This is therefore a company-quality positive but investment-process negative: the business may deserve attention, yet the price and evidence package remain too loose for a clean approval.'
