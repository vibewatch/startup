  - - UPS (public scale boundary)
    - Market cap
    - $88.58B market cap as of Aug 2026
    - Shows ceiling of large logistics value creation
    - Asset-heavy carrier, not a software infrastructure comp
  - - FedEx (public scale boundary)
    - Market cap
    - $72.72B market cap as of Aug 2026
    - Another scale boundary for logistics value
    - Asset-heavy network operator, not a direct multiple comp
  notes: Comparables are for triangulation, not for formulaic multiple transfer. Public carriers are boundary references, while Shippo is the closest private peer.
