- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Financing chronology and cap table
    - Primary round documents, preference stack, pledge releases
    - Needed to verify dilution, control, and the meaning of the reported mark
    - CEO/CFO + counsel
  - - Revenue quality
    - Monthly revenue by product, gross margin bridge, top-customer share
    - Needed to judge whether $1.5B implies a justified multiple
    - CFO / FP&A
  - - Retention and expansion
    - NRR, GRR, cohort retention, expansion by segment
    - Needed to test durability and upmarket moat
    - CRO / finance
  - - Operational resilience
    - Incident postmortems, SLOs, failover architecture, provider concentration
    - Needed to evaluate infrastructure-premium credibility
    - CTO / reliability
  - - Support economics
    - Case volumes, staffing ratios, CSAT, dispute rates
    - Needed to test whether service quality scales profitably
    - Support ops / finance
  - - Compliance posture
    - Subprocessors, DSR volumes, audit controls, privacy incidents
    - Needed to test enterprise readiness and legal overhang
    - Legal / security / privacy
  notes: If these asks are answered cleanly, EasyPost could move from track to investable. If not, the reported valuation should not be trusted.
