- id: thesis-anti-thesis-and-scenario-range
  title: Thesis, anti-thesis, and scenario range
  body: 'The bull thesis is straightforward: EasyPost could be a highly valuable infrastructure layer if it combines sticky transaction volume, efficient distribution, meaningful partner leverage, and monetizable workflow products on top of core shipping APIs. That case gets stronger if the company is actually generating revenue above $100 million with strong retention and controlled support costs. The anti-thesis is equally clear: shipping infrastructure may be strategically useful but still insufficiently differentiated, vulnerable to outages, and hard to underwrite if labels, rates, and orchestration become more commoditized. The public record supports both stories, which is why scenario analysis matters more than point estimates here. In the bull case, better private diligence could validate the reported mark or even support upside from it. In the base case, EasyPost is attractive but deserves a discount until revenue quality, resilience, and cap-table clarity are proven. In the bear
    case, operational or disclosure gaps mean that the correct action is not a lower price but a no-invest decision until facts improve.'
  claimRefs:
