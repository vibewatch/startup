- id: market-size-and-demand
  title: Market size and demand backdrop
  body: 'Demand is not the problem; definition is. On the demand side, the U.S. Census Bureau reported $326.7B of seasonally adjusted retail e-commerce sales in Q1 2026, up 9.8% year over year and representing 16.9% of total retail sales. Pitney Bowes then translates that digital demand into physical parcel movement: U.S. parcel volume reached 23.1B shipments in 2025, up 3.3%, with 63.3M parcels moving per day and a 31B-shipment outlook by 2031. On the supply-side software lens, Mordor Intelligence puts the parcel-management and multi-carrier shipping software market at $2.93B in 2026, while Business Research Insights publishes two narrower cuts: $0.87B for multicarrier parcel management solutions and $0.27B for still narrower multi-carrier shipping software. Those are not trivial differences—they imply that EasyPost’s addressable market depends heavily on whether investors think of the category as end-to-end parcel operations, a dedicated MCPMS layer, or a narrow API/rating toolset. The
    right answer is a range, not a single headline TAM.'
