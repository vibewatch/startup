  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: tam-definition-conflict
    missingEvidence: A standardized market taxonomy that reconciles the very different 2026 estimates for narrow shipping software, MCPMS, and the broader parcel-management workflow layer.
    whyItMatters: Valuation and market-share math change materially depending on which category boundary is used, so an investor needs a deliberate market lens rather than a borrowed headline TAM.
    diligencePath: Interview category analysts and management to map EasyPost revenue lines against MCPMS, shipping API, and parcel-operations software definitions before fixing TAM/SAM in the model.
    relatedQuestionRefs:
    - QM021
    - QM022
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: easypost-market-share
    missingEvidence: EasyPost shipment volume, ARR, customer mix by segment, and share of multi-carrier software spend by region.
    whyItMatters: Public sources can describe the market and buyer priorities, but they cannot convert that into a defendable SOM or growth-share assumption for EasyPost specifically.
