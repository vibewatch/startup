  - - Fragmented system stack
    - Constraint
    - Current
    - Manual handoffs and siloed systems slow adoption and reduce realized ROI
    - What integration burden does EasyPost remove in practice?
  - - Carrier API versioning and outages
    - Constraint
    - Current
