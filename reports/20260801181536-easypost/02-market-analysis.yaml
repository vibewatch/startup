callouts:
- calloutType: insight
  title: Market size is a range, not a fact
  body: Public 2026 market estimates span from $0.27B to $2.93B depending on whether a source means pure multi-carrier software, multicarrier parcel management, or the broader parcel-operations stack. EasyPost valuation work must pick a lens deliberately.
  claimRefs:
  - CM013
  - CM014
  - CM015
  - CM018
- calloutType: strength
  title: Demand growth is real and physical
  body: 'The market is supported by both digital demand and physical parcel growth: e-commerce continues to expand, parcel volumes keep climbing, and carrier fragmentation is increasing the value of orchestration software rather than reducing it.'
  claimRefs:
  - CM005
  - CM007
  - CM008
  - CM011
- calloutType: risk
  title: Integration debt is the main adoption tax
  body: The category promise is compelling, but buyers still face a migration tax from fragmented stacks, carrier-specific APIs, returns complexity, and cross-border data requirements. EasyPost wins only if its abstraction layer is cheaper than the buyer’s current integration debt.
  claimRefs:
  - CM025
  - CM026
  - CM027
  - CM028
  - CM038
