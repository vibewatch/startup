chapter:
  number: 2
  title: Market Analysis
  summary: 'EasyPost sells into a growing but definition-sensitive market: the broad 2026 parcel-management and multi-carrier shipping software opportunity is about $2.93B by Mordor Intelligence, while narrower multicarrier software lenses fall to $0.87B or even $0.27B depending on what is excluded from the category. The underlying demand engine is robust—U.S. e-commerce reached $326.7B in Q1 2026 and U.S. parcel volume reached 23.1B shipments in 2025—while adoption pressure comes from fragmentation, rising last-mile costs, cross-border complexity, and the need to shift volume across carriers and channels without building brittle point-to-point integrations.'
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: 'EasyPost does not compete for total parcel carrier revenue; it competes for the software and orchestration layer that sits between merchants, platforms, warehouses, and carriers. The relevant market includes multicarrier parcel management, shipping APIs, rate shopping, label generation, tracking, returns, compliance workflows, and the analytics or automation layers that help operators decide which service to buy. It excludes most physical transportation revenue, warehousing-only 3PL contracts, and heavy freight transportation management systems that optimize truckload, ocean, or air rather than parcel. The status quo is fragmented: direct carrier portals, bespoke point-to-point integrations, ERP or WMS parcel modules, and a long tail of manual exception handling. nShift and Locus both describe this legacy state as a brittle web of one-off connections, while Xictron frames API integration as the practical route from manual label creation to automated carrier choice. That boundary
    matters for EasyPost because it supports a software-style margin and valuation logic, but only over a narrower spend pool than total shipping budgets might imply.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM027
  - CM028
  - CM037
  tableRefs:
