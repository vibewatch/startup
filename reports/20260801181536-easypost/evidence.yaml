evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-and-cap-table
    missingEvidence: >-
      A current board roster, ownership table, and preference stack or at least an official financing history that
      reconciles public tracker differences.
    whyItMatters: >-
      Without governance and cap-table clarity, it is impossible to assess control rights, liquidation overhang, or
      whether the January 2026 valuation reflects primary capital, secondary transactions, or modelled pricing.
    diligencePath: >-
      Request the latest board deck, cap table, stock ledger summary, and all financing documents since the 2018 Series
      A during management diligence.
    relatedQuestionRefs:
      - QO004
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding-and-valuation-history
    missingEvidence: >-
      A reconciled funding timeline explaining why Startup Intros, Caplight, Growjo, and Tracxn report radically
      different totals and last-round dates.
    whyItMatters: >-
      Capital raised, last-money-in date, and valuation timing directly affect dilution, run-rate assumptions, exit
      timing, and whether the company truly had a January 2026 priced round.
    diligencePath: >-
      Cross-check management-provided financing history against legal documents, investor references, and any
      secondary-trade data before underwriting valuation.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO025
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited revenue, gross margin, EBITDA, customer concentration, and reliability SLA economics for 2024-2026.
    whyItMatters: >-
      Operational scale is visible, but valuation cannot be judged cleanly without the financial profile and the cost of
      sustaining enterprise-grade reliability.
    diligencePath: >-
      Request audited or reviewed financial statements, management accounts, SLA reporting, and cohort-level customer
      metrics under NDA.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: tam-definition-conflict
    missingEvidence: >-
      A standardized market taxonomy that reconciles the very different 2026 estimates for narrow shipping software,
      MCPMS, and the broader parcel-management workflow layer.
    whyItMatters: >-
      Valuation and market-share math change materially depending on which category boundary is used, so an investor
      needs a deliberate market lens rather than a borrowed headline TAM.
    diligencePath: >-
      Interview category analysts and management to map EasyPost revenue lines against MCPMS, shipping API, and
      parcel-operations software definitions before fixing TAM/SAM in the model.
    relatedQuestionRefs:
      - QM021
      - QM022
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: easypost-market-share
    missingEvidence: EasyPost shipment volume, ARR, customer mix by segment, and share of multi-carrier software spend by region.
    whyItMatters: >-
      Public sources can describe the market and buyer priorities, but they cannot convert that into a defendable SOM or
      growth-share assumption for EasyPost specifically.
    diligencePath: >-
      Request shipment volume by segment, active customer counts, revenue by product line, and regional mix under NDA to
      calculate EasyPost’s true footprint inside the software market.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: minor
    topic: vertical-adoption-weights
    missingEvidence: Reliable public splits for adoption by SMB, enterprise retail, platforms, and 3PLs across the category.
    whyItMatters: >-
      Segment economics differ materially, especially for pricing power, support burden, and retention, so buyer-weight
      assumptions can distort both market attractiveness and EasyPost’s fit.
    diligencePath: >-
      Cross-check vendor case studies, customer references, and channel-partner data with management’s internal segment
      mix during diligence.
    relatedQuestionRefs:
      - QM010
      - QM011
    relatedTableRefs:
      - TM003
