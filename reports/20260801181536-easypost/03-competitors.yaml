- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse evidence
  body: 'The most durable EasyPost moat visible in public sources is not exclusive carrier access; most rivals also promise broad carrier coverage, discounts, and easy onboarding. Durability instead has to come from the total integration burden EasyPost removes: neutral APIs, centralized billing, address/insurance/tracking breadth, and AI or rule-based routing that works across carriers without forcing the buyer into a larger suite. The adverse evidence is equally clear. ShipStation, Metapack, and Stamps.com sit in an Auctane family that can bundle adjacent products; ProShip and Metapack pitch deep enterprise reliability and procurement capabilities; Sendcloud and AfterShip can win specialized regional or post-purchase use cases; and Shipium’s competitive guide explicitly frames some API-led vendors as weaker on complex enterprise logic. Internal build also remains credible for large shippers with enough engineering capacity, because many public vendor pitches are effectively selling relief
    from direct-carrier complexity rather than proprietary network effects. EasyPost can still win, but only if its abstraction layer is cheaper and faster than suite adoption or in-house orchestration.'
