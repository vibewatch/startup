  rows:
  - - EasyPost
    - API-first multicarrier shipping infrastructure
    - SMB to enterprise shippers, platforms, 3PLs
    - Trusted shipping API; YC-backed; carrier abstraction, tracking, insurance, discounted rates
    - Neutral developer layer with billing and carrier abstraction
    - Public surfaces expose less full-suite workflow breadth than merchant-ops suites
  - - Shippo
    - API + app shipping platform
    - SMB and growing ecommerce merchants
    - 40+ carriers; free and $17/mo entry pricing; 827 GetApp reviews
    - Ease of use, transparent SMB pricing, quick onboarding
    - Less enterprise workflow depth visible than enterprise orchestration vendors
  - - ShipStation
    - Fulfillment operations suite
    - SMB, mid-market, multichannel sellers
    - 200+ carriers; 400+ integrations; orders, inventory, returns
    - Broader operations suite and integration breadth
    - Less neutral if buyer only wants API infrastructure
  - - Easyship
    - Cross-border shipping app + API
    - Ecommerce brands expanding internationally
    - 550+ carriers; 60+ native integrations
    - Checkout landed-cost and international-shipping focus
    - Less explicit enterprise control/rules narrative than Metapack or ProShip
  - - Sendcloud
    - Europe-centric shipping and returns platform
    - SMB and mid-market merchants, especially in Europe
    - 170+ carriers; 100+ integrations; own-contract or pre-negotiated rates
    - Plug-and-play regional carrier depth and returns workflows
    - Regional strength may matter more than neutral global API breadth
  - - Metapack
    - Enterprise delivery-management platform
    - Large retailers and enterprise shippers
    - One API; 4,000+ carrier services; procurement, tracking, returns
    - Deep enterprise carrier network and delivery-suite breadth
    - Enterprise motion likely slower and less transparent on pricing
  - - ProShip
    - Enterprise multi-carrier execution platform
    - High-volume retailers, manufacturers, healthcare, 3PLs
    - 250+ parcel/LTL services; 20+ years; top-100-retailer trust signal
    - Carrier-agnostic, hybrid engine, compliance-heavy enterprise posture
    - Less obvious fit for lightweight SMB or startup use cases
  - - Stamps.com
    - Mailing/postage incumbent
    - Individuals, SMBs, multi-office mailers
    - 4M+ customers; $14.99/month; nearly 30 years; Auctane-owned
    - Simple postage and label workflow with office-mail heritage
    - Not framed as neutral enterprise shipping infrastructure
  - - AfterShip Shipping
    - Post-purchase shipping automation adjacent
    - Brands optimizing shipping workflow and post-purchase experience
    - 87+ carriers; automation portal; international documents
    - Strong branded workflow and international automation adjacency
    - Broader post-purchase orientation rather than core neutral API identity
  notes: Rows mix direct peers, enterprise incumbents, and substitutes because buyers can solve the job from multiple product starting points.
