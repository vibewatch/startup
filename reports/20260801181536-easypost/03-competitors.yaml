callouts:
- calloutType: insight
  title: EasyPost is closest to Shippo in philosophy, not to ShipStation in packaging
  body: The strongest direct-peer overlap is API-first, neutral shipping infrastructure. ShipStation competes for many of the same merchants, but from a wider fulfillment-suite angle that changes the buying criteria.
  claimRefs:
  - CP005
  - CP008
  - CP021
  - CP023
  - CP024
- calloutType: risk
  title: Carrier breadth is not a moat by itself
  body: Nearly every serious rival advertises broad carrier access, discounted rates, or quick onboarding. EasyPost must prove that its abstraction layer, billing model, and automation reduce more complexity than competing suites or internal build.
  claimRefs:
  - CP003
  - CP009
  - CP014
  - CP016
  - CP017
  - CP031
  - CP032
- calloutType: strength
  title: Neutral infrastructure remains a valuable wedge
