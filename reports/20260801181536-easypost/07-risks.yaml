- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Infrastructure reliability
    - Major customer-visible outage
    - Repeat multi-hour API outage or recurring backlog within 12 months
    - Pause investment until architecture and postmortem evidence improve
  - - Customer trust / support
    - Support quality decay
    - Rising disputes, poor CSAT, or unresolved enterprise escalations
    - Treat as early warning for churn and margin pressure
  - - Commercial moat
    - Commoditization acceleration
    - Win/loss data shows price-driven losses without AI / suite uplift
    - Lower conviction on long-term margin durability
  - - Privacy / compliance posture
    - Regulatory or legal event
    - Material privacy complaint, enforcement action, or weak DSR controls
    - Escalate diligence and tighten valuation tolerance
  - - Capital adequacy
    - Financing-history mismatch persists
    - Management cannot reconcile funding, pledges, or cap table cleanly
    - Do not advance despite brand or customer proof
  - - Unit economics opacity
    - Core metrics unavailable
    - No reliable gross margin, NRR, concentration, or burn disclosure
    - Keep to research-more / track rather than commit capital
  notes: These criteria translate qualitative public risk into concrete diligence gates.
