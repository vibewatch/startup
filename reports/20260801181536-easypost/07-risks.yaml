company:
  name: EasyPost
chapter:
  number: 7
  title: Risks
  summary: 'EasyPost’s risk profile is dominated by three issues: infrastructure dependency, category commoditization, and disclosure opacity. The strongest operational proof is the July 2026 outage, which showed that third-party infrastructure failures can disrupt APIs, dashboards, and downstream reporting. The strongest commercial risk is that many competitors can now satisfy core label-and-rate jobs, forcing EasyPost to prove it is more than a neutral shipping API. The strongest investor risk is that financing, valuation, and governance data remain materially inconsistent in public sources, limiting confidence in capital adequacy and control quality. Regulatory and legal risk is not currently defined by a public enforcement action, but EasyPost’s own legal documents make clear that privacy, carrier compliance, and third-party contractual dependencies are real residual exposures.'
sections:
- id: severity-ranked-risk-posture
  title: Severity-ranked risk posture
  body: 'EasyPost’s most serious public risk is infrastructure dependence. The July 2026 incident is important because it shows not only that the platform can go down, but that recovery itself is multi-stage: core availability can return while tracking and reporting remain backlogged. For a shipping API, that is a real business risk because customers do not experience value only at label-purchase time; they depend on visibility, downstream notifications, and operational confidence. The second major risk is commercial. Shipping APIs no longer compete only against each other. EasyPost faces pressure from cheaper SMB tools, regional specialists, enterprise-control vendors, and broader suite products that bundle shipping into a larger workflow. That means EasyPost has to defend not just technical capability but economic relevance. The third major risk is disclosure. Public sources disagree materially on funding totals, valuation context, and round history, while official pages do not disclose
    cash, burn, retention, concentration, or margin. Those three risk families—operational, commercial, and disclosure—are interconnected: outages can weaken trust, weak trust can increase support cost or churn pressure, and thin disclosure makes it difficult for investors to know whether the company has enough resilience to absorb those shocks.'
