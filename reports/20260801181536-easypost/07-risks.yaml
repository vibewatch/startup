- id: regulatory-legal-and-partner-risks
  title: Regulatory, legal, and partner risks
  body: 'EasyPost does not show obvious public signs of an active privacy or product enforcement case, but its own legal framework clarifies where exposure lives. The master agreement, DPA, law-enforcement guidelines, and privacy-related references show that EasyPost processes personal data, exchanges customer data with carriers and other third-party offerings, and must respond to legal process and cross-border data rules. The California Attorney General’s CCPA guidance and the European Commission’s GDPR framework highlight why this matters: shipping infrastructure routinely handles names, addresses, contact details, tracking events, and international-delivery data. EasyPost also pushes substantial contractual risk back to customers and limits liability around third-party offerings. That is normal for infrastructure software, but it reinforces partner dependency rather than removing it. If a carrier, cloud provider, or regulator changes rules or suffers an outage, EasyPost’s contractual
    posture may protect it legally while still leaving customers operationally dissatisfied. The April 2026 UCC sale notice tied to founder-held shares is not an operating failure by itself, but it is a meaningful legal-capital signal because it introduces questions about pledges, control, and governance complexity that public company materials do not answer.'
