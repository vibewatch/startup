  topStrengths:
  - Real product breadth beyond base shipping APIs, including Suite, Forge, tracking, insurance, and orchestration layers.
  - Convincing customer proof with quantified operational outcomes across multiple shipping-intensive segments.
  - Large and strategically important market with continued relevance for e-commerce and logistics software buyers.
  - Neutral multi-carrier position can be valuable for platforms and merchants that do not want to build carrier connectivity themselves.
  - Reported unicorn status and investor interest suggest EasyPost remains commercially important within its category.
  topRisks:
  - Public evidence does not adequately support the reported $1.5B valuation with audited revenue, margin, or retention data.
  - The July 2026 outage shows that infrastructure and recovery risk are material to the valuation story.
  - Public funding and round-history sources conflict sharply, complicating any clean view of capital adequacy or dilution.
  - Core shipping features are increasingly commoditized by peers, suites, and regional specialists.
  - Customer-friction signals around billing and feature coverage weaken the cleanest premium-multiple narrative.
  unresolvedGaps:
  - Audited revenue, gross margin by product, burn, runway, and contribution-margin detail are not publicly disclosed.
  - NRR, GRR, concentration, and enterprise support-cost scaling are not publicly disclosed.
  - Financing chronology, preference stack, and the implications of the April 2026 UCC-sale notice remain unresolved publicly.
  - Provider concentration, SLO attainment, and full incident-history detail are not publicly disclosed.
  - Any refreshed post-January-2026 secondary pricing or mark validation is not publicly accessible.
