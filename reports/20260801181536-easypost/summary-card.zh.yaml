  topStrengths:
    - 产品宽度真实，不止基础物流 API，还包括 Suite、Forge、追踪、保险和编排层。
    - 客户证据有说服力，在多个重物流行业都给出量化运营结果。
    - 市场规模大且具战略重要性，对电商和物流软件买家仍然关键。
    - 中立的多承运商定位，对不想自建承运商连接的平台和商家有价值。
    - 据称的独角兽身份和投资人兴趣，说明 EasyPost 在同类公司中仍有商业分量。
  topRisks:
    - 公开证据缺少经审计收入、利润率或留存数据，无法充分支撑据称的 $1.5B 估值。
    - 2026 年 7 月宕机说明，基础设施和恢复风险会实质影响估值叙事。
    - 公开融资和轮次历史来源冲突明显，资本充足性和稀释情况很难看清。
    - 同行、套件和区域专家正在让核心物流功能越来越商品化。
    - 计费和功能覆盖上的客户摩擦信号，削弱了最干净的高倍数叙事。
  unresolvedGaps:
    - 经审计收入、分产品毛利率、烧钱速度、跑道和贡献利润细节没有公开披露。
    - NRR、GRR、客户集中度和企业支持成本扩张情况没有公开披露。
    - 融资时间线、优先权结构以及 2026 年 4 月 UCC 出售通知的影响，公开层面仍未厘清。
    - 供应商集中度、SLO 达成情况和完整事故历史细节没有公开披露。
    - 2026 年 1 月之后更新的二级市场定价或估值标记验证，公开渠道无法取得。
