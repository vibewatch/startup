  figureRefs:
  - FU001
- id: public-customer-proof-and-outcomes
  title: Public customer proof and outcomes
  body: 'The most persuasive public customer evidence is outcome-specific rather than logo-specific. Sticker Mule’s SmartRate case describes a customer with strict time-in-transit SLAs that integrated in 13 days and saved an average of $6,000 per month while improving on-time delivery decisions. Zenni Optical says EasyPost helped centralize stations, save two hours per shift, improve real-time tracking, and avoid costly downtime associated with a prior system. Winestyr says EasyPost automated labels, saved 200+ hours annually, and improved delivery notifications during both normal and peak seasonal volume. Packiyo’s case makes a different point: EasyPost was not just a shipping add-on but its first foundational shipping integration, giving the WMS platform one API for major carriers and a sales tool for showing rate savings. Kase adds another angle—faster carrier experimentation—by using EasyPost’s prebuilt Amazon Shipping integration to reduce costs by roughly 10% for one brand and improve
    weekend coverage, tracking, and on-time delivery. Even the older Dollar Shave Club enterprise case focuses on operational throughput rather than abstract ROI: 12 jobs processed simultaneously, 12,000 orders in 17 minutes, and the ability to scale from 10,000 to 100,000 labels a day.'
