- id: TU005
  title: Review and adverse evidence table
  columns:
  - Evidence source
  - Positive signal
  - Negative or limiting signal
  - Why it matters
  - Diligence ask
  rows:
  - - G2 review text
    - Seamless returns integration, easy setup, strong docs/support
    - Billing complaint and support frustration from another reviewer
    - Customer experience is uneven enough to merit closer review
    - Request support SLAs and billing dispute rates
  - - G2 review text
    - Hundreds of labels per day and broad carrier support
    - SmartRate API not available in Canada per reviewer comment
    - Feature geography may lag customer expectations
    - Request international roadmap and regional feature usage
  - - G2 review text
    - Reliable API and good event-log portal
    - Duties / border-agent customization required workarounds
    - Cross-border complexity may still create friction
    - Request cross-border support tickets by region
  - - Case-study library
    - Broad set of success stories across segments
    - Vendor-curated selection bias
    - Proof of fit is not proof of median outcome
    - Request win/loss and reference-call sampling framework
  - - Enterprise marketing
    - Thousands of companies and 24/7/365 support claim
    - Named customer list largely private
    - Installed-base breadth is hard to verify externally
    - Request top-customer segmentation and logo permission list
  - - Apps Run The World methodology
    - Independent technographic collection approach
    - Dataset is not itself a direct performance measure
    - Useful for breadth, not for retention or satisfaction
    - Request customer-count triangulation from multiple sources
  notes: Adverse evidence is modest but important; public customer proof remains much stronger on adoption and outcomes than on retention quality.
