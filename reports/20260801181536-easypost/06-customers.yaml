chapter:
  number: 6
  title: Customers
  summary: 'Public customer evidence suggests EasyPost serves a wide range of shipping-intensive operators: enterprise retailers, DTC brands, 3PLs, WMS platforms, and digital marketplaces. The strongest proof comes from selected case studies—Sticker Mule, Zenni Optical, Dollar Shave Club, Packiyo, Winestyr, and Kase—which consistently emphasize fast API integration, multi-carrier flexibility, shipping-cost reduction, and operational scale. The main caveat is that the customer narrative is heavily vendor-curated: public logos and success stories show solution fit, but they do not reveal retention, concentration, or how representative these outcomes are across the broader base.'
sections:
- id: customer-segments-and-icp
  title: Customer segments and ICP
  body: EasyPost’s public customer story spans more than one archetype. The about page says the company has partnered with tens of thousands of enterprises and ships billions of shipments, while the enterprise page says thousands of companies—including the world’s largest retailer—rely on EasyPost for 24/7/365 support, 100+ carrier access, and lifecycle visibility. The case-study library fills in the missing segment detail. Sticker Mule and Dollar Shave Club represent high-volume DTC or retail shipping operations; Zenni Optical represents a scaled digital retailer centralizing fulfillment workflows; Winestyr shows a marketplace-like consumer platform with strong seasonal peaks; Packiyo shows a WMS software platform embedding shipping into its own product; and Kase shows a 3PL using EasyPost to improve carrier flexibility for downstream brands. That mix matters because it shows EasyPost winning not only direct merchant accounts but also platform and intermediary accounts that can influence
    many end shippers. Publicly, the common denominator is not industry—it is shipping complexity, delivery promises, and the need to orchestrate multiple carriers or workflows without building from scratch.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU020
  - CU021
  - CU022
  - CU029
  - CU035
