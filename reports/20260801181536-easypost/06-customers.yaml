- id: adoption-support-and-customer-experience
  title: Adoption, support, and customer experience
  body: 'Across both case studies and review snippets, the adoption pattern is consistent: customers start with a concrete shipping bottleneck, want fast implementation, and then expand usage into visibility, savings, or additional carriers. Sticker Mule adopted SmartRate because it lacked time to build its own zip-code-level optimization logic. Zenni adopted because a prior decentralized setup created tracking friction and downtime. Winestyr adopted to escape manual carrier workflows. Kase adopted EasyPost’s prebuilt Amazon Shipping connection because rapid carrier activation mattered more than building one more integration itself. Support also appears as a recurring buying criterion. The enterprise page foregrounds 24/7/365 support. Zenni and Dollar Shave Club both praise EasyPost teams for responsiveness and adaptability. G2 review text reinforces that customers value good documentation, easy setup, and quick support when operating at scale. This is important because shipping infrastructure
    is only as sticky as its operational support during failures, carrier changes, or seasonal spikes.'
  claimRefs:
  - CU003
  - CU007
