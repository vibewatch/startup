  rows:
  - - Enterprise retailer / DTC scale-up
    - Dollar Shave Club, Sticker Mule, Zenni Optical
    - High-volume shipping throughput, on-time delivery, centralized control
    - API-led orchestration plus enterprise support
    - Public proof is case-study selected
  - - Marketplace / digital platform
    - Winestyr
    - Manual carrier workflow, seasonal volume spikes, customer notifications
    - Simple API automation and delivery visibility
    - Volume proof is directional, not audited
  - - WMS / SaaS platform
    - Packiyo
    - Need one integration to many carriers for downstream customers
    - White-label / embed-style infrastructure and EasyPost Wallet savings
    - Indirect customer economics sit with the platform operator
  - - 3PL / fulfillment provider
    - Kase
    - Rapid carrier changes, cost/speed/reliability tradeoffs for client brands
    - Carrier flexibility and prebuilt integrations
    - 3PL success does not always translate to merchant success
  - - Large enterprise prospect set
    - Enterprise page + about page
    - Carrier access, support, lifecycle visibility
    - 24/7 support and 100+ carrier claims
    - Named enterprise list remains mostly private
  - - Startup-to-enterprise general merchant base
    - Suite / home pages
    - Growth from basic labels into smarter decisions
    - Broad API + AI + post-purchase positioning
    - Marketing pages do not reveal retention or expansion rates
  notes: Rows reflect customer archetypes evidenced in retained sources, not a complete installed-base census.
