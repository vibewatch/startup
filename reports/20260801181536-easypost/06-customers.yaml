- id: adverse-customer-evidence-and-limitations
  title: Adverse customer evidence and limitations
  body: The adverse evidence is not overwhelming, but it is real. G2 review text includes complaints about billing practices, dual payment-method charging, and a desire to see SmartRate supported in Canada, which suggests that commercial operations and geographic feature coverage can frustrate users. One positive reviewer also noted that international shipping customization for duties and border-agent details required workarounds, implying that cross-border edge cases may still create operational friction. Just as importantly, the public proof base is curated. EasyPost’s visible stories are overwhelmingly success-oriented and selected by the vendor. That means investors should treat them as proof of solution fit, not proof of median customer outcomes. Customer concentration, contract length, churn, NRR, and support burden are still absent from public sources. The right interpretation is that EasyPost has real evidence of solving expensive shipping pain across several customer archetypes,
    but not enough public evidence to quantify how repeatable or durable those wins are across the full base.
  claimRefs:
  - CU018
  - CU019
