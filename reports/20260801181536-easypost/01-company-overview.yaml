  - FO003
- id: scale-technology-and-milestones
  title: Scale, technology, and milestones
  body: 'The operational maturity story is stronger than the capital-structure story. Official pages show an engineering-first organization that deploys dozens of times a day, runs hundreds of services, publishes status metrics, and markets enterprise-grade reliability alongside discounted carrier access. The 2025 scalability guide is especially useful because it moves beyond marketing slogans and describes the architectural choices EasyPost wants customers to associate with the platform: stateless APIs, dynamic rate limiting, combined SQL and NoSQL infrastructure, continuous monitoring, and staff on call at all times. Product expansion milestones reinforce the same arc. In 2025, EasyPost launched Luma AI and Forge, indicating a push into decision support and white-label platform tooling. In 2026, the company won FedEx Compatible Solution of the Year and the FedEx Diamond Award, adding third-party validation from a strategically important carrier partner. Parsers.vc and Caplight also show
    adjacent expansion signals such as EasyPost Analytics and a ShipBae integration, suggesting the roadmap continues to broaden beyond core shipping labels.'
  claimRefs:
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
  - CO035
  - CO037
