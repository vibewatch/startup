company:
  name: EasyPost
chapter:
  number: 1
  title: Company Overview
  summary: EasyPost is a 2012-founded multi-carrier shipping API platform that publicly positions itself as the shipping infrastructure of the internet and now layers analytics, white-label tooling, and shipping AI on top of its core label, tracking, insurance, and address-verification APIs. Official sources support 100+ carrier coverage, 200+ countries served, 450+ employees, and billions of packages processed, while third-party trackers disagree sharply on capital raised and the date of the latest financing even as multiple 2026-era datasets converge on an approximately $1.5B private-market valuation.
sections:
- id: identity-and-product
  title: Identity and product scope
  body: 'EasyPost sells shipping infrastructure rather than a single carrier product. The company homepage and about page describe a developer-centric platform that began in 2012 as the first RESTful API for shipping and now spans label generation, rate shopping, address verification, tracking, insurance, white-label shipping, and AI-assisted optimization. The strongest official scale signals are operational rather than financial: EasyPost says it serves 200+ countries and territories, integrates with more than 100 carriers, and has processed billions of packages for tens of thousands of enterprise customers. Y Combinator still frames the company as the shipping infrastructure of the internet, a useful shorthand because the product abstracts legacy carrier integrations into one API layer. The current product family also stretches beyond pure APIs into EasyPost Forge for white-label shipping and Luma AI for analytics, advice, and automated label selection, showing the company is moving up
    the logistics software stack rather than remaining a narrow postage API vendor.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO012
  - CO015
  - CO016
  - CO018
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership and governance
  body: 'Founder control remains central. Jarrett Streebin is still the public CEO and the easiest single person to tie to EasyPost''s strategy, origin story, and positioning around Amazon-level shipping capabilities for online merchants. Public executive disclosure is stronger than public governance disclosure: the about page names CFO T.J. Gallagher, CTO Josh Lane, VP Sales Ron Justin, and General Counsel Peter Chess, while explaining Lane''s prior Fastly and Engine Yard experience and Justin''s role in closing large enterprise customers. The governance picture is much thinner. None of the official pages reviewed publish a board roster, ownership structure, or preference stack, and the investor databases disagree on funding totals and the timing of later rounds. That means the management bench is visible, but hard governance questions still require diligence under NDA. Key-person dependence remains meaningful because the founder-CEO still anchors company narrative, and because the public
    evidence for succession planning or board oversight is limited.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO032
  - CO038
  tableRefs:
  - TO002
  - TO003
  figureRefs: []
- id: capitalization-and-corporate-profile
  title: Capitalization and corporate profile
  body: 'EasyPost clearly qualifies as a late-stage private company, but the exact capital history is unusually messy in public datasets. Startup Intros says the company raised $55M across three rounds and hit a $1.5B valuation after a January 2026 financing event. Caplight also pegs EasyPost at roughly $1.5B, but ties the latest funding reference to April 2022 and lists total funding at $203.14M. Growjo reports only $12.5M total funding and Tracxn reports $3.85M, with Tracxn also labeling EasyPost as acquired. Those differences are too wide to average away; they are a genuine diligence issue. The reliable points are narrower: Y Combinator documented an $850K seed round in 2013, Startup Intros shows a $50M Series A in September 2018, and investor databases repeatedly surface Y Combinator, SV Angel, Founders Fund, MESA Ventures, and GV among backers. Public trackers now place headquarters in Lehi, Utah, while older YC-era and partner references still point to San Francisco, implying a corporate
    center-of-gravity shift rather than a clean single-location story.'
  claimRefs:
  - CO011
  - CO013
  - CO025
  - CO026
  - CO027
  - CO028
  - CO029
  - CO030
  - CO031
  tableRefs: []
