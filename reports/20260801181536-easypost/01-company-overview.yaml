    severity: material
    topic: audited-financials
    missingEvidence: Audited revenue, gross margin, EBITDA, customer concentration, and reliability SLA economics for 2024-2026.
    whyItMatters: Operational scale is visible, but valuation cannot be judged cleanly without the financial profile and the cost of sustaining enterprise-grade reliability.
    diligencePath: Request audited or reviewed financial statements, management accounts, SLA reporting, and cohort-level customer metrics under NDA.
