  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-and-cap-table
    missingEvidence: A current board roster, ownership table, and preference stack or at least an official financing history that reconciles public tracker differences.
    whyItMatters: Without governance and cap-table clarity, it is impossible to assess control rights, liquidation overhang, or whether the January 2026 valuation reflects primary capital, secondary transactions, or modelled pricing.
    diligencePath: Request the latest board deck, cap table, stock ledger summary, and all financing documents since the 2018 Series A during management diligence.
    relatedQuestionRefs:
    - QO004
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: funding-and-valuation-history
    missingEvidence: A reconciled funding timeline explaining why Startup Intros, Caplight, Growjo, and Tracxn report radically different totals and last-round dates.
    whyItMatters: Capital raised, last-money-in date, and valuation timing directly affect dilution, run-rate assumptions, exit timing, and whether the company truly had a January 2026 priced round.
    diligencePath: Cross-check management-provided financing history against legal documents, investor references, and any secondary-trade data before underwriting valuation.
    relatedQuestionRefs:
    - QO005
    - QO006
    - QO025
    relatedTableRefs:
