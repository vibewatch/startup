      - number: '3.2'
        title: Peer profiles and segment splits
        blocks:
          - type: paragraph
            body: >-
              The segment splits are fairly clean on public evidence. Shippo markets itself as a one-stop labels
              solution with 40+ carriers, API access, and transparent SMB pricing; review data reinforces the idea that
              the product wins on ease of use and value for smaller merchants. ShipStation competes from a broader
              fulfillment-operating-system angle by combining orders, inventory, shipping, and returns with 200+
              carriers and 400+ integrations. Easyship is more explicitly cross-border, with 550+ carriers, 60+ native
              integrations, and landed-cost messaging at checkout. Sendcloud is strongest where European carrier access,
              plug-and-play integrations, and returns matter more than raw API neutrality. At the enterprise end,
              Metapack and ProShip emphasize procurement, rules, scale, WMS/OMS integration, carrier compliance, and
              higher-volume operations. Stamps.com and AfterShip matter because they cover common substitutes:
              postage-first workflows and post-purchase shipping automation.
