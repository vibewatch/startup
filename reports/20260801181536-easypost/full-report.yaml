      - number: '5.4'
        title: Reliability, security, and technical risks
        blocks:
          - type: paragraph
            body: >-
              The main product risk is resilience under real-world complexity. EasyPost’s scalability guide says the
              platform is stateless where possible, uses asynchronous job processing with up to 10x speed improvements
              for bulk shipment purchases, applies a hybrid SQL/NoSQL model, monitors unhealthy thresholds continuously,
              and uses dynamic rate limiting based on cumulative system load rather than simple request counts. Those
              are credible engineering patterns, but incident history shows that the stack still has critical
              dependencies. The July 2026 outage was caused by hosting-provider connectivity issues that affected the
              API and dashboard, forced EasyPost to restore selected services through a fallback data center, and
              created delayed tracking and reporting backlogs even after core service recovered. StatusGator adds
              context by noting that EasyPost publishes status across dozens of components and has a multi-year outage
              history. Security posture is more reassuring than availability posture: webhook HMAC validation includes
              timestamp checking and replay protection, and the broader API surfaces require TLS and secret API keys.
              Netting it out, EasyPost looks technically serious and integration-friendly, but not immune to
              infrastructure concentration risk, documentation drift, or the operational tax of coordinating hundreds of
              carrier and event-driven workflows.
