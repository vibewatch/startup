      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is mixed. EasyPost’s category, customer logos, and product breadth are compatible with both
              continued private compounding and eventual strategic or public-market relevance. But public-market
              readiness requires more than a good business story. Investors would need confidence in revenue durability,
              support economics, compliance hygiene, incident resilience, and governance cleanliness. Today, the public
              record provides only partial support on those dimensions. The company’s legal documents show
              sophistication, and the customer evidence shows real usage, but there is too little hard financial
              disclosure to justify a final investment decision. The correct final posture is to ask for data that can
              quickly falsify or validate the thesis: cap table, financing chronology, monthly revenue and gross margin
              by product, NRR/GRR, concentration, postmortem metrics, and support-cost trends. If management can close
              those gaps convincingly, the recommendation can move materially. If not, unicorn status should be treated
              as a headline rather than a decision rule.
            claimRefs:
              - CV037
