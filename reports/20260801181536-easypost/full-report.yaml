      - number: '1.3'
        title: Capitalization and corporate profile
        blocks:
          - type: paragraph
            body: >-
              EasyPost clearly qualifies as a late-stage private company, but the exact capital history is unusually
              messy in public datasets. Startup Intros says the company raised $55M across three rounds and hit a $1.5B
              valuation after a January 2026 financing event. Caplight also pegs EasyPost at roughly $1.5B, but ties the
              latest funding reference to April 2022 and lists total funding at $203.14M. Growjo reports only $12.5M
              total funding and Tracxn reports $3.85M, with Tracxn also labeling EasyPost as acquired. Those differences
              are too wide to average away; they are a genuine diligence issue. The reliable points are narrower: Y
              Combinator documented an $850K seed round in 2013, Startup Intros shows a $50M Series A in September 2018,
              and investor databases repeatedly surface Y Combinator, SV Angel, Founders Fund, MESA Ventures, and GV
              among backers. Public trackers now place headquarters in Lehi, Utah, while older YC-era and partner
              references still point to San Francisco, implying a corporate center-of-gravity shift rather than a clean
              single-location story.
