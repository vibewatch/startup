chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product scope
        blocks:
          - type: paragraph
            body: >-
              EasyPost sells shipping infrastructure rather than a single carrier product. The company homepage and
              about page describe a developer-centric platform that began in 2012 as the first RESTful API for shipping
              and now spans label generation, rate shopping, address verification, tracking, insurance, white-label
              shipping, and AI-assisted optimization. The strongest official scale signals are operational rather than
              financial: EasyPost says it serves 200+ countries and territories, integrates with more than 100 carriers,
              and has processed billions of packages for tens of thousands of enterprise customers. Y Combinator still
              frames the company as the shipping infrastructure of the internet, a useful shorthand because the product
              abstracts legacy carrier integrations into one API layer. The current product family also stretches beyond
              pure APIs into EasyPost Forge for white-label shipping and Luma AI for analytics, advice, and automated
              label selection, showing the company is moving up the logistics software stack rather than remaining a
              narrow postage API vendor.
