  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Resilience concern persists
        - Repeat customer-visible outage or evidence of recurring backlog
        - Breaks infrastructure-premium narrative
        - Pause or stop investment process
      - - Revenue-quality gap remains unresolved
        - Management cannot reconcile revenue, margin, or retention metrics
        - Undermines valuation support directly
        - Move to no-invest / watch only
      - - Cap-table or pledge complexity worsens
        - Financing chronology, preferences, or pledge details remain unclear
        - Creates governance and exit-risk overhang
        - Demand restructuring clarity before proceeding
      - - Commercial moat weakens
        - Win/loss data shows price-led churn or weak upsell outside core API
        - Reduces upside to premium software multiple
        - Lower range or stop process
      - - Support or billing friction is systemic
        - Private CSAT / dispute metrics validate public complaints
        - Signals margin and trust problems
        - Treat as thesis-break for premium entry pricing
      - - Compliance weakness surfaces
        - Material privacy or legal-process control issue appears
        - Damages enterprise and public-market readiness
