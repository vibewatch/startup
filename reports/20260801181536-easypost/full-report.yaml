        title: Scale, technology, and milestones
        blocks:
          - type: paragraph
            body: >-
              The operational maturity story is stronger than the capital-structure story. Official pages show an
              engineering-first organization that deploys dozens of times a day, runs hundreds of services, publishes
              status metrics, and markets enterprise-grade reliability alongside discounted carrier access. The 2025
              scalability guide is especially useful because it moves beyond marketing slogans and describes the
              architectural choices EasyPost wants customers to associate with the platform: stateless APIs, dynamic
              rate limiting, combined SQL and NoSQL infrastructure, continuous monitoring, and staff on call at all
