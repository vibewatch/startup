  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              EasyPost’s most serious public risk is infrastructure dependence. The July 2026 incident is important
              because it shows not only that the platform can go down, but that recovery itself is multi-stage: core
              availability can return while tracking and reporting remain backlogged. For a shipping API, that is a real
              business risk because customers do not experience value only at label-purchase time; they depend on
              visibility, downstream notifications, and operational confidence. The second major risk is commercial.
              Shipping APIs no longer compete only against each other. EasyPost faces pressure from cheaper SMB tools,
              regional specialists, enterprise-control vendors, and broader suite products that bundle shipping into a
              larger workflow. That means EasyPost has to defend not just technical capability but economic relevance.
              The third major risk is disclosure. Public sources disagree materially on funding totals, valuation
              context, and round history, while official pages do not disclose cash, burn, retention, concentration, or
              margin. Those three risk families—operational, commercial, and disclosure—are interconnected: outages can
              weaken trust, weak trust can increase support cost or churn pressure, and thin disclosure makes it
              difficult for investors to know whether the company has enough resilience to absorb those shocks.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
              - CR015
              - CR019
              - CR020
