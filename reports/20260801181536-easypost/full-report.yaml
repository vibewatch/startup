      - number: '8.2'
        title: Valuation context and comparable logic
        blocks:
          - type: paragraph
            body: >-
              The public valuation context is unusually noisy. Startup Intros ties EasyPost to a January 2026 valuation
              of about $1.5 billion; Dealroom classifies the company as a unicorn; Tracxn, Prospeo, and Caplight
              disagree materially on total funding and round history; and the DailyDAC UCC-sale notice includes an
              unattributed statement that 2025 revenue was over $100 million. Prospeo separately estimates revenue
              around $136 million. If one uses those revenue anchors very cautiously, a $1.5 billion valuation implies
              roughly 11x to 15x value-to-revenue on public estimates—neither obviously absurd for a private
              software-like infrastructure business nor obviously cheap given the evidence gaps. Comparable logic helps
              but does not solve the problem. Shippo is the closest private peer by business model and is also tagged as
              a unicorn, with Tracxn showing a $1 billion post-money reference in 2021/2022 financing history. Pitney
              Bowes is a better public-economic analogue than UPS or FedEx because it sits closer to shipping-enablement
              software and mailing infrastructure, but it is mature, public, and operationally different. UPS and FedEx
              are too broad and asset-heavy to serve as direct multiple comps; they matter mainly as scale boundaries.
            claimRefs:
