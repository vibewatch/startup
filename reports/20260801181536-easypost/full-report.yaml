  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              EasyPost does not compete for total parcel carrier revenue; it competes for the software and orchestration
              layer that sits between merchants, platforms, warehouses, and carriers. The relevant market includes
              multicarrier parcel management, shipping APIs, rate shopping, label generation, tracking, returns,
              compliance workflows, and the analytics or automation layers that help operators decide which service to
              buy. It excludes most physical transportation revenue, warehousing-only 3PL contracts, and heavy freight
              transportation management systems that optimize truckload, ocean, or air rather than parcel. The status
              quo is fragmented: direct carrier portals, bespoke point-to-point integrations, ERP or WMS parcel modules,
              and a long tail of manual exception handling. nShift and Locus both describe this legacy state as a
              brittle web of one-off connections, while Xictron frames API integration as the practical route from
              manual label creation to automated carrier choice. That boundary matters for EasyPost because it supports
              a software-style margin and valuation logic, but only over a narrower spend pool than total shipping
              budgets might imply.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM027
              - CM028
              - CM037
