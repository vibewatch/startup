  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              EasyPost’s retained official sources are unusually clear on what it sells, even if they are not clear on
              how much of each product customers buy. The pricing page and product surfaces show at least six
              monetization layers: core labels and rate shopping, address verification, basic tracking, advanced
              tracking and branded post-purchase visibility, insurance and claims, and higher-end AI or analytics
              products for high-volume shippers. The company also explicitly markets white-label APIs for platforms and
              one-platform order import for merchants, which implies at least three go-to-market motions: developer
              infrastructure, merchant workflow tooling, and enterprise optimization. This matters because the revenue
              model is almost certainly mixed. Some lines are likely low-priced, high-frequency usage fees tied to
              shipment events; others, such as insurance, analytics, and enterprise services, look more like attach
              products that can lift revenue per shipment or per account. The official story is therefore consistent
              with a business that started as shipping API infrastructure and expanded outward into adjacent workflow
              and insight products rather than a simple per-seat SaaS subscription.
