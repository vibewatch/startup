companyProfile:
  summary: >-
    EasyPost is a private shipping infrastructure company founded in 2012 that unifies carrier access, label generation,
    rate shopping, address verification, tracking, insurance, and higher-level workflow tools such as Suite and Forge.
    Public customer evidence supports real operational usage across DTC brands, retailers, 3PLs, and software platforms,
    while public market-data sources place the company in reported unicorn territory around January 2026. The main
    limitation is not business relevance but disclosure quality: public sources conflict on funding history and do not
    disclose the margins, retention, concentration, or governance detail required for high-conviction valuation
    underwriting.
