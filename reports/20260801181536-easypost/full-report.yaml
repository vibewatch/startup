      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The most durable EasyPost moat visible in public sources is not exclusive carrier access; most rivals also
              promise broad carrier coverage, discounts, and easy onboarding. Durability instead has to come from the
              total integration burden EasyPost removes: neutral APIs, centralized billing, address/insurance/tracking
              breadth, and AI or rule-based routing that works across carriers without forcing the buyer into a larger
              suite. The adverse evidence is equally clear. ShipStation, Metapack, and Stamps.com sit in an Auctane
              family that can bundle adjacent products; ProShip and Metapack pitch deep enterprise reliability and
              procurement capabilities; Sendcloud and AfterShip can win specialized regional or post-purchase use cases;
