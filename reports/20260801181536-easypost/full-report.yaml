  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and decision view
        blocks:
          - type: paragraph
            body: >-
              The core recommendation is research-more / track rather than invest aggressively at the reported January
              2026 mark. EasyPost has enough positive evidence to remain interesting: it serves a real market, sells
              infrastructure with workflow extensions, and has public proof of adoption and measurable customer
              outcomes. However, public evidence does not support high-confidence underwriting at a unicorn price. The
              company’s reported $1.5 billion valuation may be directionally plausible if EasyPost truly has revenue
              above $100 million, strong retention, and durable gross margins. But those are the exact variables public
              evidence does not adequately prove. Moreover, the July 2026 outage and the capital-structure ambiguity
              surfaced by the April 2026 UCC sale notice make the downside case more than theoretical. This is therefore
              a company-quality positive but investment-process negative: the business may deserve attention, yet the
              price and evidence package remain too loose for a clean approval.
            claimRefs:
