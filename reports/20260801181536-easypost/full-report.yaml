      - number: '7.4'
        title: Financial / model risk and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The investment risk is not simply that EasyPost might be overpriced. It is that public evidence does not
              let an investor determine what “fairly priced” means with much confidence. Shipping infrastructure can be
              a good business when volumes are sticky, margins are disciplined, and support costs remain controlled.
              Pitney Bowes demonstrates that adjacent shipping-tech economics can be real, but that fact actually raises
              the burden on EasyPost to disclose enough for underwriting. Instead, public sources contradict one another
              on funding totals and valuation history, and official pages provide almost no direct operating disclosure.
              That means the key model risks are hidden: gross margin by product, customer concentration, net retention,
              dispute rates, working-capital needs, and how much of the product story is monetized versus aspirational.
              The right response is not to reject the company automatically, but to set explicit kill criteria. If
              diligence cannot reconcile the financing history, incident resilience, customer retention, and unit
              economics, the thesis should not advance regardless of brand strength or unicorn status.
