        - Regulatory or legal event
        - Material privacy complaint, enforcement action, or weak DSR controls
        - Escalate diligence and tighten valuation tolerance
      - - Capital adequacy
        - Financing-history mismatch persists
        - Management cannot reconcile funding, pledges, or cap table cleanly
        - Do not advance despite brand or customer proof
      - - Unit economics opacity
        - Core metrics unavailable
        - No reliable gross margin, NRR, concentration, or burn disclosure
        - Keep to research-more / track rather than commit capital
    notes: These criteria translate qualitative public risk into concrete diligence gates.
