      - number: '2.4'
        title: Growth drivers, constraints, and valuation implications
        blocks:
          - type: paragraph
            body: >-
              The growth drivers are straightforward: e-commerce keeps expanding, carrier mixes are fragmenting,
              regional and alternative carriers are gaining share, and last-mile economics make dynamic routing more
              valuable. ReadyCloud and Pitney Bowes both highlight the rise of smaller carriers, while Maersk argues
              that multi-carrier flexibility is becoming a resilience tool rather than just a procurement tactic.
              Gartner-flavored vendor summaries from nShift and ShippyPro point to buyer priorities that now go well
              beyond raw rate shopping: cost control, delivery experience, returns management, sustainability, and
              increasingly AI-enabled operational decisions. The constraints are equally clear. Locus says enterprise
              teams often maintain 15-30 point-to-point integrations and face versioning, SLA, and exception-management
              risk; nShift describes the same problem as platformization replacing dozens of fragile links with a
              standard backbone. For EasyPost, this market structure is attractive because it rewards neutral
              orchestration, but it also means investors should underwrite against a category where vendor boundaries
              blur with OMS/WMS/ERP suites, where market-size estimates are noisy, and where sustained product breadth
              matters as much as core label-generation functionality.
