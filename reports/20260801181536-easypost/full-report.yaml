      - number: '1.5'
        title: Reliability and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The adverse record is not existential, but it is material because EasyPost sells mission-critical
              infrastructure. EasyPost's own status pages and incident mirrors document a broad connectivity outage on
              July 23, 2026 that affected API and dashboard operations and required fallback data-center work before
              full recovery. An independent incident mirror summarizes the event as roughly 7.5 hours of disruption. A
              second July 2026 incident shows UPS operations degraded for about four hours after UPS imposed rate
              limiting, with some BYOA accounts needing re-authentication after recovery. These events do not break the
              core thesis, but they matter because EasyPost monetizes trust, automation, and reliability. The same
              official materials that market 99.99% uptime and enterprise-grade scalability therefore create a higher
              diligence bar around incident frequency, carrier dependency concentration, and whether outage
              communications map cleanly to enterprise SLAs. Public financial opacity compounds that risk because
              investors cannot easily judge how much resiliency spending sits behind the reliability claims.
            claimRefs:
              - CO014
              - CO022
              - CO023
              - CO024
