        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder control remains central. Jarrett Streebin is still the public CEO and the easiest single person to
              tie to EasyPost's strategy, origin story, and positioning around Amazon-level shipping capabilities for
              online merchants. Public executive disclosure is stronger than public governance disclosure: the about
              page names CFO T.J. Gallagher, CTO Josh Lane, VP Sales Ron Justin, and General Counsel Peter Chess, while
              explaining Lane's prior Fastly and Engine Yard experience and Justin's role in closing large enterprise
              customers. The governance picture is much thinner. None of the official pages reviewed publish a board
              roster, ownership structure, or preference stack, and the investor databases disagree on funding totals
              and the timing of later rounds. That means the management bench is visible, but hard governance questions
              still require diligence under NDA. Key-person dependence remains meaningful because the founder-CEO still
              anchors company narrative, and because the public evidence for succession planning or board oversight is
              limited.
