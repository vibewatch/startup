  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and solving approaches
        blocks:
          - type: paragraph
            body: >-
              EasyPost does not just compete with one lookalike API. Buyers can solve the shipping-orchestration job
              through at least six routes: an API-first neutral layer such as EasyPost or Shippo; an app-led
              multi-channel fulfillment suite such as ShipStation; an international-commerce shipping layer such as
              Easyship; a Europe-centric carrier-and-returns platform such as Sendcloud; an enterprise
              delivery-management stack such as Metapack or ProShip; or a status-quo mix of direct carrier portals,
              mailing software, and internal build. EasyPost’s own surfaces emphasize shipping infrastructure,
              discounted carrier access, centralized billing, insurance, and AI-driven decision support. That places it
              closest to Shippo in product philosophy, but the broader competitive battlefield includes vendors that win
              because they own adjacent workflows like order management, post-purchase experience, returns, procurement,
              or enterprise carrier compliance. This matters because the same RFP can mix engineering, operations,
              procurement, and customer-experience criteria even when the original pain point starts at shipping labels.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP020
