        title: Developer platform and integration design
        blocks:
          - type: paragraph
            body: >-
              The developer surface is a major part of EasyPost’s public moat. The docs home, Postman collection, and
              product pages show an API-first design built around reusable object IDs, API-key authentication, webhook
              events, and machine-to-machine workflows rather than around manual human operations. Postman documentation
              shows Basic Auth with API keys, TLS 1.2 enforcement, test and production keys, reusable object references,
              and CRUD flows for common objects. The webhook docs then add stronger integration detail: HMAC validation,
              optional basic authentication, custom headers, CRUD management, and automatic disable/re-enable behavior
              for failing endpoints. SmartRate documentation surfaces delivery_date_confidence and
              estimated_transit_days, while the trackers and insurance docs show how EasyPost carries object state over
              time and can even insure shipments purchased outside the EasyPost flow if the package can be validated
              with tracking data. Altogether, the product looks designed for platforms, marketplaces, 3PLs, and
              engineering teams that need a deeply scriptable shipping layer instead of a simpler point-and-click
              dashboard alone.
