- id: TE002
  title: API and workflow capability matrix
  columns:
  - Capability
  - EasyPost evidence
  - Why it matters
  - Public caveat / risk
  rows:
  - - API-key auth + TLS
    - Postman requires API key on every request and TLS v1.2
    - Simple machine auth fits developer workflows
    - API-key misuse would create high account exposure if secrets leak
  - - Reusable objects and references
    - Postman shows reusable ids and reference fields
    - Helps compose complex workflows programmatically
    - Reference uniqueness is not enforced
  - - Webhook CRUD + HMAC
    - Docs show create, retrieve, update, delete plus HMAC validation
    - Critical for event-driven shipping systems
    - Webhook recipients can still fail and become disabled
  - - Tracker lifecycle state
    - Tracker docs store current and historical tracking details
    - Supports visibility and post-purchase automation
    - Depends on carrier data quality and timeliness
  - - Standalone insurance
    - Insurance docs support third-party shipments with tracking_code
    - Expands attach opportunity beyond native EasyPost labels
    - Requires validation and can cancel if shipment history conflicts
  - - SmartRate transit prediction
    - Docs surface delivery confidence and transit estimates
    - Turns data into routing intelligence, not only API abstraction
    - Model quality is only partially observable from public docs
  notes: The matrix only marks capabilities directly evidenced by retained docs or product pages, not inferred future roadmap features.
