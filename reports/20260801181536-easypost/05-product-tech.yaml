- id: ai-analytics-and-extensibility
  title: AI, analytics, and extensibility
  body: EasyPost’s most interesting 2026 technology move is the attempt to turn shipping data into decision advantage. Luma AI is not described as a generic chatbot bolted onto a legacy workflow. Instead, the product pages and Luma blog split it into Insights, Advisor, Select, and Supply Chain components. Insights focuses on analytics, benchmarking, and simulation; Advisor is framed as a shipping-native LLM; Select applies those recommendations at label creation; and Supply Chain connects cross-system data to find operational problems earlier. Several claims here are important. The public pages say Luma is trained on years of real behavior across billions of shipments, is included in every EasyPost account, can auto-select the best label across 100+ carriers, and can also be white-labeled for platforms. Forge then extends that same extensibility story to platform operators via sub-account control, report generation, and billing configuration. The upshot is that EasyPost’s differentiating
    technology is increasingly about turning shipping volume into optimization software rather than only into carrier abstraction.
  claimRefs:
