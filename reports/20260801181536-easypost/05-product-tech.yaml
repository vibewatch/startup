chapter:
  number: 5
  title: Product & Technology
  summary: 'EasyPost has evolved from a core shipping API into a wider orchestration platform that spans labels, rate shopping, tracking, insurance, address verification, white-label platform tooling, and AI-assisted decision support. The strongest public technology signals are its platform extensibility—Forge for white-label sub-account management, rich webhook controls, Postman-facing developer surfaces, SmartRate transit predictions, and Luma AI products trained on billions of shipments. The main product risks are operational rather than conceptual: uptime depends on a complex carrier and hosting stack, some documentation surfaces are fragmented, and July 2026 incident history shows that network-provider failures can delay tracking and reporting even when a fallback data center exists.'
sections:
- id: product-surface-and-core-workflows
  title: Product surface and core workflows
  body: 'EasyPost is no longer presented as just a label-printing API. Across the homepage, suite page, pricing page, and about page, the company now frames itself as an all-in-one shipping platform spanning pre-shipping logistics, core shipment execution, and post-shipping analytics. The public product surface includes the Shipping API, address verification, tracking, insurance and claims, rate shopping, SmartRate delivery estimates, white-label services, and Luma AI decision support. That breadth matters because it changes the job EasyPost solves: instead of only normalizing carrier APIs, the company is increasingly productizing shipping decisions, operational visibility, and embed-ready shipping infrastructure for platforms. The Forge page pushes this even further by packaging white-label APIs, code-free sub-account management, embeddable UI components, centralized analytics, and billing options for platforms or marketplaces that want to sell shipping without building every workflow themselves.
    Publicly, the architecture looks like a modular shipping stack rather than a single endpoint product.'
