- id: TE004
  title: Reliability, security, and technical risk table
  columns:
  - Area
  - Public evidence
  - Positive signal
  - Risk implication
  - Diligence ask
  rows:
  - - Scalability architecture
    - Scalability guide cites stateless design, async jobs, hybrid SQL/NoSQL, monitoring, dynamic rate limiting
    - Shows mature engineering patterns
    - Still depends on correct execution under peak conditions
    - Request SLOs, tail-latency charts, and carrier-failure playbooks
  - - Webhook security
    - Docs and support describe HMAC, timestamp validation, replay protection, custom headers, TLS
    - Strong event-authentication posture
    - Misconfigured receivers still create customer-side fragility
    - Request reference implementations and incident stats
  - - Incident recovery
    - July 2026 outage used fallback data center and recovery updates
    - Fallback exists and engineering communicated actively
    - Hosting-provider dependency still caused API, dashboard, and backlog issues
    - Request RTO/RPO and provider concentration details
  - - Tracking/reporting backlog
    - Status updates mention delayed tracking and reporting catch-up after recovery
    - Team disclosed secondary effects transparently
    - Post-purchase data lags can erode customer trust
    - Request backlog-clearing metrics and customer impact postmortems
  - - Carrier/event complexity
    - Platform coordinates 100+ carriers, webhook events, and multiple APIs
    - Breadth is a moat when stable
    - Breadth is also a surface area for outages and data drift
    - Request top recurring carrier-related failure modes
  - - Documentation surface
    - Docs, support, Postman, marketing pages, and blogs all carry technical detail
    - Rich developer ecosystem support
    - Fragmentation can create documentation drift or stale links
    - Audit documentation freshness and broken-link rates
  notes: Security signals are stronger than availability signals in the retained public evidence; the biggest unknown is real-world resilience under carrier and infrastructure stress.
