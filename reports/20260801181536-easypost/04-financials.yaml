- id: capital-adequacy-and-financial-verdict
  title: Capital adequacy and financial verdict
  body: 'Capital adequacy is where public evidence breaks down hardest. Official EasyPost pages disclose neither cash balance nor burn nor runway nor profitability. Third-party datasets do not solve the problem cleanly: Tracxn says EasyPost has raised only $3.85 million, Prospeo says $25 million, and Startup Intros says $55 million over three rounds while also associating the company with a January 2026 $1.5 billion valuation. Caplight adds a later-round chronology with Series A/B/C entries and an April 2022 last-round marker, further underlining that publicly scraped private-company finance data is internally inconsistent. The presence of an experienced CFO and a general counsel with SEC and IPO experience is mildly reassuring, but that is a readiness signal rather than evidence of current balance-sheet strength. Netting all of this out, EasyPost looks more like a potentially capital-efficient, scaled private infrastructure company than a cash-burning science project; however, investors
    still cannot underwrite revenue quality, gross margin, CAC payback, runway, or financing dependency from public materials alone. The correct financial verdict is promising scale with insufficient transparency.'
