- id: cost-structure-and-unit-economics
  title: Cost structure and unit economics
  body: 'The biggest public financial blind spot is margin structure. EasyPost’s pricing suggests that some products—especially tracking and perhaps basic address checks—are tiny per-event revenue lines that require very large shipment volume to matter. Insurance, by contrast, is economically more powerful because it scales with shipment value rather than only with shipment count. AI insights, analytics, and white-label platform products also look structurally more valuable than commodity label generation. That makes the likely gross-margin story intuitive even without disclosure: postage and carrier charges mostly pass through, while software orchestration, data products, and attached services carry the real contribution margin. For an external benchmark, Pitney Bowes’ SendTech shipping-and-mailing technology segment generated $1.256 billion in 2025 revenue and about a 36.5 percent adjusted EBITDA margin, even while revenue declined. That does not tell us EasyPost’s actual margin, but it
    shows that shipping-technology businesses can produce meaningful profitability at scale while still remaining sensitive to volume pressure and product mix. EasyPost’s real unit economics probably hinge on shipment density, enterprise mix, carrier-wallet economics, and attach rates rather than on the headline existence of a shipping API.'
