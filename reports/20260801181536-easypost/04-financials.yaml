- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Why public data is insufficient
  - Exact diligence path
  rows:
  - - Gross margin by product line
    - Cannot separate software economics from pass-through postage
    - Official pages list products and some prices, but no margin data
    - Request product P&Ls for labels, tracking, insurance, analytics
  - - Net revenue retention
    - Cannot judge land-and-expand durability
    - No cohort or retention disclosure in retained sources
    - Request NRR by segment and top customer cohorts
  - - Customer concentration
    - Cannot judge downside exposure to a few large shippers
    - Scale claims do not reveal revenue concentration
    - Request top-10 customer share and churn history
  - - CAC, payback, and sales efficiency
    - Cannot test GTM quality
    - No spend, funnel, or payback metrics are public
    - Request S&M spend, payback by segment, and channel mix
  - - Working-capital / carrier settlement dynamics
    - Cannot evaluate liquidity or float risk
    - Centralized billing is disclosed, economics are not
    - Request carrier payment terms, settlement timing, and float balances
  - - Cash, debt, and covenants
    - Cannot underwrite solvency or financing need
    - No public balance sheet exists for EasyPost
    - Request latest monthly balance sheet, debt agreements, and cash forecast
  notes: Every missing field here is material to underwriting and cannot be responsibly backfilled from the retained public sources.
