company:
  name: EasyPost
chapter:
  number: 4
  title: Financials
  summary: 'EasyPost’s public financial picture is directionally encouraging but insufficient for underwriting. Official pages clearly show a mixed monetization model—usage-driven shipping services, tracking, insurance, white-label APIs, and higher-value analytics—yet they do not disclose core label economics, margins, burn, runway, or customer concentration. Third-party revenue and funding datasets conflict materially: Prospeo estimates $125M revenue and $25M total funding, Tracxn reports only $3.85M raised, and Startup Intros reports $55M raised with a January 2026 $1.5B valuation context. The likely conclusion is a capital-efficient shipping-software business with meaningful enterprise scale, but one whose true revenue quality and capital adequacy remain blocked without private diligence.'
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization
  body: 'EasyPost’s retained official sources are unusually clear on what it sells, even if they are not clear on how much of each product customers buy. The pricing page and product surfaces show at least six monetization layers: core labels and rate shopping, address verification, basic tracking, advanced tracking and branded post-purchase visibility, insurance and claims, and higher-end AI or analytics products for high-volume shippers. The company also explicitly markets white-label APIs for platforms and one-platform order import for merchants, which implies at least three go-to-market motions: developer infrastructure, merchant workflow tooling, and enterprise optimization. This matters because the revenue model is almost certainly mixed. Some lines are likely low-priced, high-frequency usage fees tied to shipment events; others, such as insurance, analytics, and enterprise services, look more like attach products that can lift revenue per shipment or per account. The official story
    is therefore consistent with a business that started as shipping API infrastructure and expanded outward into adjacent workflow and insight products rather than a simple per-seat SaaS subscription.'
