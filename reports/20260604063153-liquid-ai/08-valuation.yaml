tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Liquid is strategically interesting, but the public pack still lacks the metrics needed for a high-conviction entry call.
    - Stay engaged, but require a deeper diligence cycle before underwriting upside from the current mark.
  - - Confidence
    - medium
    - Funding and peer anchors are visible, while revenue quality and conversion data remain private.
    - Treat the recommendation as evidence-sensitive rather than final.
  - - Risk rating
    - high
    - Competition, commoditization, governance, and partner concentration can all reset value quickly.
    - Use milestone triggers and downside thresholds rather than a passive hold posture.
  - - Valuation stance
    - fair-to-stretched
    - ~$2B is plausible for a differentiated edge-AI company but not obviously cheap versus peers with clearer commercialization proof.
    - Do not assume the company will automatically grow into the round.
  - - What improves the call
    - More proof or a better price
    - Revenue disclosure, margin quality, partner conversion, and cleaner cap-table visibility would all improve underwriting confidence.
    - A future round or secondary could become attractive if those data points are strong.
  notes: 'The table is intentionally price-sensitive: it separates company quality from entry attractiveness and disclosure quality.'
