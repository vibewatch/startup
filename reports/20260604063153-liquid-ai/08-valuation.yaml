  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: ARR, growth, retention, and customer concentration by product and deployment model.
    whyItMatters: These are the core inputs needed to decide whether Liquid deserves a premium software multiple or only strategic-option valuation.
    diligencePath: Request audited financials, cohort tables, and top-customer concentration analysis.
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: margins-and-burn
    missingEvidence: Gross margin, support burden, hosting economics, and cash burn after the Series A.
    whyItMatters: Efficient model architecture does not automatically translate into strong unit economics.
    diligencePath: Review management accounts and deployment-level gross margin bridge.
  - type: missing-source
    severity: material
    topic: mercedes-conversion
    missingEvidence: Objective evidence that the Mercedes program hits production and scales beyond a pilot.
    whyItMatters: A major part of the edge-commercialization upside depends on this milestone.
    diligencePath: Ask for program milestone plan, integration status, and launch-readiness evidence.
    relatedTableRefs:
    - TV003
    - TV005
  - type: private-evidence-only
    severity: material
    topic: license-monetization
    missingEvidence: Signed enterprise contract terms and paid conversion above the public $10M free-use threshold.
    whyItMatters: The license funnel is part of Liquid's business model, but its economics are not public.
    diligencePath: Review anonymized contracts, pricing schedules, and win-loss notes.
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Preference stack, secondary content, participation rights, and any structural overhang from the Series A.
    whyItMatters: Entry attractiveness can differ materially from the headline valuation if investor protections are stacked ahead of new money.
    diligencePath: Request financing documents and current cap-table waterfall.
    relatedTableRefs:
    - TV006
