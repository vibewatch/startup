- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - ARR by product, channel, and deployment mode
    - Determines whether the business deserves a software premium or only a strategic option value.
    - Management KPI pack and board materials.
  - - Margins and cash profile
    - Gross margin, hosting/support burden, and cash burn after the 2024 round
    - Tests whether efficient architecture actually creates economic leverage.
    - Finance diligence and audited financial review.
  - - Customer concentration
    - Top customers, pipeline mix, and partner dependence
    - Shows whether public lighthouse deals overstate repeatability.
    - Sales ops export and customer-reference program review.
  - - Mercedes milestone conversion
    - Pilot, validation, and production-readiness evidence by model year
    - Directly informs the strongest edge-commercialization proof point.
    - Program review with product, OEM partner, and account owner.
  - - License monetization
    - Paid contract terms above the public free-use threshold
    - Tests whether the open-to-commercial funnel actually works.
    - Legal / pricing review plus signed enterprise contract samples.
  - - Cap table and preferences
    - Liquidation stack, participating rights, and secondary overhang
    - Affects effective entry price and downside protection independent of company quality.
    - Corporate counsel and financing-doc review.
  notes: These are the smallest set of diligence asks that can most directly change the recommendation or valuation stance.
