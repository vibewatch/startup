- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Mercedes proof fails to convert
    - No credible initial production deployment by the end of 2026
    - Weakens the strongest public edge-commercialization proof point.
    - Downgrade the edge-premium component of the thesis.
  - - Commercial conversion remains opaque
    - Management cannot show paid license or deployment conversion beyond pilots and downloads
    - Turns the monetization story into a science story rather than a business story.
    - Hold or avoid new capital until conversion evidence appears.
  - - Category commoditization accelerates
    - Generic model pricing continues falling while Liquid lacks application-layer proof
    - Shrinks the value of being “another model builder,” even an efficient one.
    - Move the valuation frame toward lower enterprise-AI anchors.
  - - Governance trail lags deployment ambition
    - Regulated or autonomous deployments expand without strong validation and oversight artifacts
    - Increases procurement friction and downside risk in sensitive sectors.
    - Require governance package before underwriting regulated-market upside.
  - - Disclosure gap persists into the next financing event
    - No revenue, margin, retention, or concentration visibility by the next round
    - Prevents the market from validating the private mark with fundamentals.
    - Treat any up-round as sentiment-driven until fundamentals are shown.
  notes: Kill triggers are milestone-based so future diligence can test them directly rather than relying on narrative impressions.
