    - Application-layer focus and customer proof are more explicit than Liquid's.
  - - AI21 Labs
    - Aug. 2023 Series C
    - ' $1.4B valuation '
    - Efficient enterprise model company with self-hosted and secure deployment posture.
    - Older round and different product mix / market timing.
  - - Cohere
    - 2026 funding update
    - ' $7B reported valuation '
    - Sovereign-enterprise AI reference with privacy and deployment focus.
    - Significantly larger scale and more mature enterprise footprint.
  - - Mistral AI
    - Sep. 2025 Series C
    - ' 11.7B€ post-money '
    - Shows how highly the market can value an enterprise/frontier model platform.
    - Much larger platform breadth and capital base than Liquid.
  - - xAI
    - 2026 Series E
    - ' $20B raised; top-tier compute story '
    - Illustrates how distribution plus infrastructure can expand valuation ceilings.
    - Consumer reach and compute scale are not comparable to Liquid.
  - - Liquid AI
    - Dec. 2024 Series A
    - ' ~$2B reported post-money '
    - Current anchor for the underwriting decision.
    - Public sources do not disclose revenue, margins, or retention to validate the price.
