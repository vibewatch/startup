- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation logic
  - Implied value
  - Probability signal
  rows:
  - - Bull
    - Mercedes reaches production, LEAP becomes a repeatable enterprise edge stack, and management discloses strong commercial conversion on top of partner wins.
    - Premium enterprise-AI framing above the current round as edge deployment proof broadens and commoditization risk is offset by application-level defensibility.
    - $2.8B-$4.0B
    - Requires milestone conversion plus evidence that revenue quality is better than the current public record shows.
  - - Base
    - Liquid keeps strategic momentum but remains disclosure-light, with partner-led proof expanding only gradually.
    - Latest round stays roughly fair-to-stretched as the company grows into it rather than obviously beyond it.
    - $1.8B-$2.4B
    - Most consistent with current public proof and missing unit-economics detail.
  - - Bear
    - Partner milestones slip, commercialization remains narrow, and pricing pressure compresses stand-alone model economics.
    - Company re-rates toward lower enterprise-AI anchors as the market pays less for undifferentiated model exposure.
    - $1.0B-$1.6B
    - Triggered by milestone misses, weak conversion data, or continuing opacity around revenue quality.
  notes: Scenario values are valuation ranges, not forecasts; they anchor on public private-round comparables, category structure, and the specific uncertainty around Liquid's undisclosed economics.
