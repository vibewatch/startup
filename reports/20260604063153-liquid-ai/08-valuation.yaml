- id: diligence-asks-and-what-changes-the-call
  title: What would change the call and what breaks the thesis
  body: Liquid can move up the conviction curve without changing its science at all; it mainly needs to close information gaps. The highest-value asks are revenue by product and deployment model, gross-margin quality, enterprise contract structure, customer concentration, and evidence that partner-led milestones are converting into repeatable production use. Mercedes is especially important because it is the cleanest upcoming proof that Liquid's edge thesis can matter outside lab benchmarks. The negative version of the same idea is the thesis-break list. If the company cannot show paid commercial conversion above the public license threshold, if partner proofs remain narrow, if governance and compliance artifacts stay thin as deployments move into regulated settings, or if the market keeps commoditizing generic models faster than Liquid proves application-layer defensibility, then the private valuation should de-rate. Until management provides those missing metrics, the right answer is not
    avoid forever; it is research more, price carefully, and insist that future diligence be milestone-based rather than story-based.
