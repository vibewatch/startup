      - number: '1.2'
        title: 创始人、技术谱系与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人故事证据扎实，治理可见度则没有同等扎实。官方发布材料、TechCrunch 和公司数据库都把 Liquid AI 标记为 2023 年 MIT 相关孵化公司，由 Ramin Hasani、Mathias
              Lechner、Alexander Amini 和 Daniela Rus 领导，其中 Hasani 任 CEO，Lechner 任 CTO，Amini 任首席科学官。创始叙事重要，因为 Liquid
              商业化的不是通用开源模型，而是一条扎根于液态神经网络和 liquid time-constant networks 的特定研究脉络。arXiv 上的 LTC 论文和 Liquid
              自身研究页面，把这家创业公司直接连到公司成立前已经发展的连续时间和状态空间工作。公开记录里的治理信息弱得多。Tracxn 给出六人董事会名单，但 Liquid
              自身没有发布当前董事会或治理页面，留存公开来源也没有清楚描述 Series A 后的控制权。因此，投资人仍需追问投资人监督、董事会独立性，以及围绕创始科学家团队的关键人集中度。
