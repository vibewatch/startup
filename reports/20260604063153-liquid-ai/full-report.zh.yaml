  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的顶层风险与传导路径
        blocks:
          - type: paragraph
            body: >-
              Liquid AI
              的风险堆栈，与其说是科学彻底失败，不如说是差异化架构能否熬过从研究可信度到可复制企业变现的残酷转换。公开证据支持这是一家真实公司，拥有资本、技术深度和具名伙伴；但同一批公开材料也显示运营系统仍很早期：商业化通过许可、下载、伙伴渠道和定制来路由，而不是可见的第一方
              API 业务；标杆部署证明集中在 AMD、Mercedes 和 Insilico；独立报道仍把 LFMs
              描述为预览阶段，并在某些任务上有限。组合起来，就形成层层叠加的传导路径。如果伙伴试点延期、基准优势在生产中变窄，或客户对许可条款和渠道复杂度犹豫，收入可信度可能比技术叙事更快走弱。因此，正确的严重性视角是累积性的：集中度、就绪度和变现不透明会互相强化，而不是彼此孤立。
