  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与直接同业集合
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 竞争的不是一个单体基础模型赛道。它自己的页面反复强调在算力受限环境中的高效部署，而竞争对手分成几个面向买方的集群：OpenAI、Anthropic、Google 这类封闭托管 API
              领导者；Mistral、Cohere、AI21、Writer、Microsoft Phi 和 xAI 这类高效企业模型供应商；以及 Meta Llama、以 Qualcomm
              为中心的设备工作流等硬件相邻或开放权重替代。关键在于，Liquid 最强的重叠不只是最大聊天界面，而是那些提供隐私、定制或企业控制的供应商。因此格局很宽，但仍能看清：Liquid
              试图在买方更看重部署灵活性、低延迟和本地控制，而不是通用公共 API 无处不在的地方取胜。实践中，采购团队会同时把 Liquid
              拿来和模型实验室、平台选择比较，而不只和某一个基准测试领导者比较。直接同业集合因此应由买方要完成的任务和部署约束定义，而不能只看品牌。
