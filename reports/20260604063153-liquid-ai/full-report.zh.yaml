      - number: '2.2'
        title: 规模测算视角与需求边界
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个很大的机会边界，但不足以得出唯一权威 TAM。Deloitte 2026 年企业 AI 调查显示，需求正从试点走向规模化生产：2025 年员工访问量上升 50%，至少 40%
              项目进入生产的公司占比将在六个月内翻倍，58% 受访公司已使用物理 AI，且 80% 预计两年内使用。这些采用信号重要，因为 Liquid
              的产品故事绑定私有、本地和物理部署，而不只是网页聊天。市场规模报告支持同一方向的判断，但数量级分歧很大。Fortune Business Insights 和 Verified Market Reports
              都把边缘 AI 市场估为 2026 年 US$47.59 billion、2034 年 US$385.89 billion；Stratistics MRC 则仅把边缘 AI 推理估为 2026 年
              US$153.84 billion、2034 年 US$635.51 billion。这个差距太大，不能当作四舍五入噪音忽略；它说明这些发布方在衡量不同市场边界。尽调时，正确姿态是把公开估计当作外部边界，并把
              Liquid 的可服务市场看作一个更窄子集，绑定受监管、延迟关键或设备受限的部署。
