  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈、模型家族与面向买方的界面
        blocks:
          - type: paragraph
            body: >-
              Liquid 已不只是一个研究故事；公开产品栈现在有三层可见产品。第一，公司提供 Liquid Foundation Models 本身，包括文本、视觉语言、音频和 nano 变体。第二，它提供 LEAP
              作为帮助开发者定制和部署这些模型的工作流。第三，它推出 Apollo，作为消费者友好、无需云的移动界面，用设备端智能做演示，不要求企业合同。关于页面、模型页面、文档和社区页面都强化了这一产品栈形态。


              模块地图还显示，Liquid 优化的是部署现实，而不只是基准测试营销。公开文档强调 GGUF、MLX 和 ONNX 包装，几个检查点可训练，并兼容 Transformers、llama.cpp、vLLM、MLX
              和 Ollama 等广泛使用的运行时。这让开发者和平台团队更容易判断 Liquid 是封闭黑箱，还是一个可迁移模型家族。主要保留意见在于，面向买方的包装远比 LEAP
              自身的商业采用清晰：公开网站解释了可以试什么、去哪里下载，但没有披露已有多少企业客户真正把平台标准化。
