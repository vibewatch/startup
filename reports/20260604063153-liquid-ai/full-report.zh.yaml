      - number: '1.3'
        title: 融资历史、规模标记与仍缺什么
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 的资本历史足以支撑本章判断，但运营规模不够透明。官方发布材料称，2023 年 12 月公司完成由 OSS Capital 和 PagsGroup 领投的 US$46.6 million
              种子轮；官方 2024 年融资材料随后宣布 AMD 领投 US$250 million Series A。TechCrunch、Tech Funding News 和 Tracxn
              大体印证了轮次规模，但估值标记方向一致、细节并不完全相同：独立报道称 Series A 对公司的估值超过 US$2 billion，Tracxn 四舍五入到 US$2 billion，Mathias
              Lechner 2025 年 7 月的个人传记则提到 US$2.3 billion 估值和更广的战略投资方阵容。合理推论是，Liquid 是一家从后期种子到 Series A
              阶段、已达独角兽规模的公司，拥有足够资本推进产品化；但准确投后估值和投资人分配仍是尽调事项。公开规模指标明显更薄。PitchBook、Hugging Face 和 Tracxn
              的员工数信号互相冲突，收入、ARR、客户数或部署量仍没有干净的公开披露。遗漏很关键：公司已经可见地商业化、招聘 GTM 和财务岗位、宣布重大合作，但从技术承诺到可复制企业收入的变现转化仍不透明。
