      - number: '6.2'
        title: 具名客户证明、试点与生产、参考质量
        blocks:
          - type: paragraph
            body: >-
              具名公开证明集集中但真实。Mercedes-Benz 是最可见的旗舰关系：一项多年汽车合作，绑定北美 MBUX 代际，首个生产部署目标是 2026
              年下半年。这很有意义，因为客户是一线蓝筹，用例在运营上要求很高，但它仍不是发布后的证明。Insilico Medicine
              是更强的当前状态部署信号，因为双方称科学模型现在已经可在私有制药基础设施上使用。合起来看，这两个账户说明 Liquid 能赢下严肃对手方。


              离开这两个具名证明后，参考质量迅速下降。Liquid 其余公开客户证据大多来自匿名案例研究短文——汽车、欺诈、电商、翻译和合成视频——结果数字有意思，但客户
              logo、生产标签和续约证据都很薄。因此，本章可以支持“真实采用存在”的结论，但不能支持“生产采用已经广泛或可在许多账户中复制”的结论。
