      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Liquid 的公开垂直页面暗示了几种不同买方动作，而不是一种通用企业销售。在汽车领域，主要买方是想提升车内助手、同时守住延迟、隐私和硬件限制的 OEM
              软件或信息娱乐团队；用户是驾驶员或乘客；付款方是车辆项目或软件平台预算。在电商领域，买方是数字产品、搜索、商品运营或客户体验团队；用户是购物者和品牌运营者；预算来自电商、增长或客户支持条线。在金融服务领域，潜在买方是
              CIO、数据与 AI
              平台、风控或运营团队；用户是欺诈、支付、服务和交易工作流里的员工与客户；付款逻辑落在转型、合规或运营预算。创业公司和开发者社区用户形成另一条路径：买方是技术创始人或产品工程师，付款方是风险资金支持的产品预算。所有路径都不是瞬时采用。Liquid
              必须先赢下基准测试或概念验证，再完成硬件适配和模型定制，再通过安全或治理审查，最后才进入部署或支持合同。
