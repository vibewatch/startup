        - 创始研究团队经验丰富，Tracxn 披露了具名董事会成员
        - 索取董事会材料、委员会结构和投资者权利摘要
      - - 研究与工程
        - 招聘覆盖面显示，公司同时需要分布式训练、边缘推理、多模态工作和开发者关系能力
        - 高
        - 高
        - 新资金支撑招聘和研究连续性
        - 索取组织架构图、管理幅度和关键岗位空缺清单
      - - 商业化 / 解决方案
        - 公司一边面向多个行业销售，一边招聘解决方案架构、销售和市场岗位
        - 高
        - 高
        - 合作伙伴验证在多个垂直行业打开切入口
        - 按垂直行业审阅管线，并按客户类型核查实施能力
      - - 运营纪律
        - 文化明确推崇自主和低流程，能加快交付，也会拉扯可重复性
        - 中
        - 中高
        - 白盒可解释性和绩效导向文化有助于问责
        - 要求说明事件复盘节奏、项目管理层和支持升级机制设计
    notes: 组织结构、服务能力和正式治理纪律的公开能见度最低，执行风险也最高。
