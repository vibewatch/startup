  - id: FU004
    title: 留存 / 重复队列
    type: cohort
    layout: standard
    summary: 按客户类型给出的示意性耐久度代理；Liquid 未披露实际留存队列。
    data:
      columns:
        - 首次部署留存至下一次审查
        - 第 1 年活跃
        - 第 2 年活跃
        - 续约可见度
      rows:
        - label: 旗舰汽车项目（代理）
          values:
            - 95
            - 90
            - 75
            - 35
        - label: 受监管科学部署（代理）
          values:
            - 92
            - 85
            - 70
            - 30
        - label: 开发者 / 评估者队列（代理）
          values:
            - 40
            - 20
            - 10
            - 5
    claimRefs:
      - CU024
      - CU025
      - CU013
      - CU028
    approximationNotes: 仅为代理队列值。这些百分比按客户类型推断相对切换成本和可见度；它们不是公司披露的留存曲线，只应作为尽调框架。
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 商业化若依赖集中的合作伙伴证明，或依赖仍有争议的生产就绪假设，残余严重性仍然最高。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 残余严重性
      rows:
        - label: 商业许可证限制
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 中
              tone: warning
            - label: 高
              tone: negative
        - label: 基准到生产缺口
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 中低
              tone: warning
            - label: 高
              tone: negative
        - label: 合作伙伴集中
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: negative
            - label: 中
              tone: warning
            - label: 高
              tone: negative
        - label: 监管 / 治理负担
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 中低
              tone: warning
            - label: 中高
              tone: warning
        - label: 缺少第一方 API / 渠道不透明
          values:
            - label: 高
              tone: negative
            - label: 中高
              tone: warning
            - label: 低
              tone: warning
            - label: 中高
              tone: warning
        - label: 人员与垂直扩张失焦
          values:
            - label: 中高
              tone: warning
            - label: 中高
              tone: warning
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
    claimRefs:
      - CR022
      - CR024
      - CR026
      - CR031
      - CR034
      - CR043
      - CR044
  - id: FR002
    title: 风险传导图
    type: dag
    summary: 商业和监管风险通过转化、部署证明和估值支撑互相放大。
    data:
      nodes:
        - id: n1
          label: 许可证摩擦
          detail: 更大的商业采用方使用免费 / 开放版本时会遇到条件限制。
        - id: n2
          label: 采购延迟
          detail: 法务和合规审查拉长企业销售周期。
        - id: n3
          label: 伙伴集中证明
          detail: 公开叙事只靠少数具名部署支撑。
        - id: n4
          label: 生产滑期
          detail: 试点未能按计划转成上线部署。
        - id: n5
          label: 收入不透明
          detail: 公开用户看不到重复使用、留存或利润率质量。
        - id: n6
          label: 下一轮压力
          detail: 证明偏弱会推高融资和估值风险。
        - id: n7
          label: 监管开销
          detail: EU 和关键基础设施治理预期抬高尽调负担。
        - id: n8
          label: 执行拉伸
          detail: 垂直领域野心太宽、招聘太快，都会挤压运营聚焦。
      edges:
        - from: n1
          to: n2
          label: 推高合同审查负担
        - from: n2
          to: n5
          label: 放慢转化可见度
        - from: n3
          to: n4
          label: 放大里程碑依赖
        - from: n4
          to: n5
          label: 削弱变现证明
        - from: n7
          to: n2
          label: 增加合规要求
        - from: n8
          to: n4
          label: 拉伸交付能力
        - from: n5
          to: n6
          label: 削弱承销信心
        - from: n4
          to: n6
          label: 压缩战略溢价
    claimRefs:
      - CR013
      - CR026
      - CR031
      - CR034
      - CR035
      - CR043
      - CR044
      - CR045
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: Liquid 公开可见的商业化图谱，仍然围绕少数芯片、渠道和灯塔客户关系展开。
    data:
      nodes:
        - id: d1
          label: AMD
          detail: 边缘优化和公开性能证明的芯片合作伙伴。
        - id: d2
          label: Mercedes-Benz
          detail: 最可见的汽车生产路径。
        - id: d3
          label: Insilico Medicine
          detail: 私有基础设施上的科学垂直证明。
        - id: d4
          label: LEAP / Liquid 平台
          detail: 用于定制和部署的自有控制平面。
        - id: d5
          label: OpenRouter / 下载 / 试用场
          detail: 目前的公开访问渠道，替代尚未提供的第一方托管 API。
        - id: d6
          label: 受监管企业买家
          detail: 在承诺规模化之前，需要看到治理、可靠性和商业条款清晰度。
      edges:
        - from: d1
          to: d4
          label: 硬件优化
        - from: d2
          to: d4
          label: 生产验证路径
        - from: d3
          to: d4
          label: 垂直基准和部署证明
        - from: d5
          to: d4
          label: 分发和实验
        - from: d4
          to: d6
          label: 许可证、定制、部署
        - from: d1
          to: d6
          label: 硬件选择和性能预期
    claimRefs:
      - CR014
      - CR024
      - CR026
      - CR028
      - CR043
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议质量不取决于是否喜欢这家公司，更取决于公开证据能否撑住当前价格。
    data:
      nodes:
        - id: a
          label: 真实融资信号
          detail: $250M 轮融资和 ~$2B 公开估值锚点，显示市场确有强信念。
        - id: b
          label: 差异化边缘逻辑
          detail: 高效的端侧 / 本地部署具有战略相关性。
        - id: c
          label: 披露缺口
          detail: 收入、利润率、留存和股权结构表条款仍未公开。
        - id: d
          label: 商品化压力
          detail: 模型定价竞争在整个品类里加速升温。
        - id: e
          label: 伙伴主导证明
          detail: Mercedes 和 AMD 信号积极，但证明点仍然集中。
        - id: f
          label: 建议
          detail: research-more：继续关注，但暂时不要把上行空间写进投资假设。
      edges:
        - from: a
          to: b
          label: 支撑关注
        - from: b
          to: e
          label: 需要转化为
        - from: e
          to: c
          label: 仍受限于
        - from: d
          to: c
          label: 推高成本
        - from: c
          to: f
          label: 驱动
    claimRefs:
      - CV002
      - CV004
      - CV030
      - CV033
      - CV035
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 同行头部估值给出了 Liquid 被比较的区间，但并非所有同行都有同等商业化证明。
    data:
      items:
        - label: AI21 Series C 轮估值
          value: 1.4
          unit: $B
        - label: Writer Series C 轮估值
          value: 1.9
          unit: $B
        - label: Liquid 据报道的 Series A 轮估值
          value: 2
          unit: $B
        - label: Cohere 据报道估值
          value: 7
          unit: $B
        - label: Mistral Series C 轮估值
          value: 11.7
          unit: €B
        - label: xAI Series E 轮融资
          value: 20
          unit: $B
    approximationNotes: 使用留存来源报道的已披露私募轮或头部融资锚点；币种按披露口径保留，不做汇率归一化。
    claimRefs:
      - CV004
      - CV015
      - CV018
      - CV020
      - CV022
      - CV024
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 情景区间的核心，是 Liquid 能否证明可重复部署，并披露足够经济性来守住当前估值标记。
    data:
      items:
        - label: 悲观情景
          low: 1
          value: 1.3
          high: 1.6
          unit: $B
          claimRef: CV044
        - label: 基准情景
          low: 1.8
          value: 2.1
          high: 2.4
          unit: $B
          claimRef: CV043
        - label: 乐观情景
          low: 2.8
          value: 3.3
          high: 4
          unit: $B
          claimRef: CV042
    claimRefs:
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: Liquid 在战略差异化上得分较高，但公开商业化可见度和估值支撑偏弱。
    data:
      items:
        - label: 架构差异化
          value: 8/10
          detail: 超越 Transformer 和边缘高效定位有较充分证据支撑。
          tone: positive
        - label: 伙伴证明
          value: 7/10
          detail: AMD 和 Mercedes 提供了真实战略验证，但证明仍然集中。
          tone: neutral
        - label: 商业可见度
          value: 3/10
          detail: 没有公开收入、利润率或留存披露。
          tone: warning
        - label: 定价权可见度
          value: 4/10
          detail: 没有第一方 API，也没有公开变现队列。
          tone: warning
        - label: 治理准备度
          value: 4/10
          detail: 品类治理压力上升速度，快过 Liquid 公开控制证据的积累。
          tone: warning
        - label: 市场顺风
          value: 8/10
          detail: 企业和边缘 AI 需求都在扩张。
          tone: positive
        - label: 估值支撑
          value: 4/10
          detail: 当前估值标记可以解释，但相对于已披露同行和缺失指标，并不明显便宜。
          tone: warning
    claimRefs:
      - CV025
      - CV027
      - CV033
      - CV035
      - CV047
      - CV048
      - CV053
