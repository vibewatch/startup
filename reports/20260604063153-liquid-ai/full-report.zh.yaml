companyProfile:
  summary: >
    Liquid AI 是 2023 年从 MIT CSAIL 孵化出来的公司，正在把液态神经网络及相关高效序列模型架构的研究脉络商业化。公司把自己放在以 Transformer 优先的实验室之外：它构建多模态 Liquid
    Foundation Models（LFMs），并配套 LEAP 这套定制与部署平台，主攻隐私、延迟和算力效率更关键的边缘、本地部署和混合环境。


    公开证据显示，公司从隐身发布到战略合作推进很快。Liquid 在 2023 年 12 月宣布 $46.6M 种子轮，随后在 2024 年 12 月完成 AMD 领投的 $250M Series A。此后，公司围绕 AMD Ryzen
    和 Ryzen AI 处理器的硬件优化、2026 年 3 月与 Insilico Medicine 合作开发私有药物发现模型、以及 2026 年 4 月面向车内量产部署的 Mercedes-Benz
    合作，持续扩展商业叙事。核心待解问题不是科学是否成立，而是公司能否把合作伙伴牵头的验证转化为可复制、可披露的商业规模。
