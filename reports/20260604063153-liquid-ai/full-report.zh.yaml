  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - Mercedes 商业化风险
        - 汽车部署里程碑
        - 到 2026 年底没有可信生产部署证据
        - 降低对物理 AI / 汽车上行空间的信心，并基于纯软件证据重新测算估值
      - - 授权转化风险
        - 商业授权采用
        - 管理层无法证明付费转化超过 $10M 门槛
        - 将开源到付费变现视为未验证，并下调收入质量假设
      - - 基准到生产缺口
        - 客户质量证据
        - 独立或客户证据显示核心生产任务质量偏弱
        - 下调护城河判断，新资金进入前要求更强的垂直行业验证
      - - 合作伙伴集中风险
        - 标杆客户广度
        - 到下一轮融资时，公开验证仍局限于 AMD、Mercedes 和 Insilico
        - 计入集中度折价，并假设企业采用更慢
      - - 执行摊子过大风险
        - 组织准备度对比垂直行业广度
        - 关键岗位仍空缺，行业野心却继续扩张
        - 承销增长前，要求明确排序、收窄 GTM 重点，并压实运营计划
    notes: 这些触发项设计成未来尽调周期可观察的信号，而不是抽象风险表述。
    claimRefs:
      - CR012
      - CR026
      - CR028
      - CR043
      - CR045
  - id: TV001
    title: 推荐摘要表
    columns:
      - 维度
      - 评估
      - 原因
      - 决策含义
    rows:
      - - 推荐
        - 继续研究
        - Liquid 具备战略吸引力，但公开材料仍缺少做出高信心入场判断所需的指标。
        - 保持跟踪，但在按当前估值承销上行空间前，需要更深入的尽调周期。
      - - 信心
        - 中
        - 融资和同业锚点可见，但收入质量和转化数据仍未公开。
        - 将该推荐视为随证据变化，而不是最终结论。
      - - 风险评级
        - 高
        - 竞争、商品化、治理和合作伙伴集中度都可能快速重置价值。
        - 采用里程碑触发项和下行阈值，而不是被动持有。
      - - 估值立场
        - 合理至偏高
        - 对于一家有差异化边缘 AI 定位的公司，~$2B 说得通；但和商业化证据更清楚的同业相比， 并不明显便宜。
        - 不要假设公司会自动长进本轮估值。
      - - 改善判断的因素
        - 更多证据或更好价格
        - 收入披露、利润率质量、合作伙伴转化和更清晰的股权结构表，都会提高承销信心。
        - 如果这些数据点够强，未来一轮融资或老股交易可能变得有吸引力。
    notes: 本表刻意对价格敏感：它把公司质量、入场吸引力和披露质量拆开看。
    claimRefs:
      - CV004
      - CV035
      - CV036
      - CV045
      - CV046
      - CV047
      - CV048
      - CV053
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 当前观点
      - 改变观点的条件
    rows:
      - - 架构投资逻辑
        - 在边缘、本地部署和主权 AI 场景中，Liquid 有一套差异化的高效部署叙事。
        - 如果独立客户证据显示该架构在生产中持续胜出，投资逻辑会明显增强。
      - - 商业化反向逻辑
        - 公司仍未公开收入、利润率和留存披露。
        - 更详细的 KPI 披露或更低入场价格会削弱这一担忧。
      - - 合作伙伴验证逻辑
        - AMD 和 Mercedes 表明，这项技术可信度足以进入严肃的工业和设备场景。
        - 如果当前伙伴之外出现更广客户，验证就会从集中个案变成可重复模式。
      - - 商品化反向逻辑
        - 价值可能正从通用模型层迁向应用、数据和编排。
        - 如果 Liquid 证明自己实际掌握这些更高价值层，商品化威胁就会下降。
      - - 类别上行逻辑
        - Cohere、Mistral 和 xAI 说明，只要分发或算力规模真实存在，私有市场估值可以被推得很高。
        - Liquid 要可信地进入这一上行区间，需要更强的部署规模和市场能见度。
      - - 披露反向逻辑
        - 现有证据支持关注和继续尽调，但不足以给出明确买入推荐。
        - 管理层披露收入质量、股权结构条款和客户集中度，是评级上调的最短路径。
    notes: 各行把上行情景和推动判断变化所需的具体缺失证据配对，而不是把信心当成静态变量。
    claimRefs:
      - CV033
      - CV035
      - CV039
      - CV040
      - CV041
      - CV045
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 隐含价值
      - 概率信号
    rows:
      - - 乐观
        - Mercedes 进入生产，LEAP 成为可重复的企业边缘栈，管理层在合作伙伴胜利之外披露强劲商业转化。
        - 随着边缘部署证据拓宽，应用层防御力抵消商品化风险，估值框架可高于当前轮次、进入高溢价企业 AI 区间。
        - $2.8B-$4.0B
        - 需要里程碑转化，还要证明收入质量好于当前公开记录。
      - - 基准
        - Liquid 保持战略势能，但披露仍少，合作伙伴驱动的验证只会逐步扩展。
        - 最新一轮大致维持合理至偏高；公司是在长进估值，而不是明显跑到估值之上。
        - $1.8B-$2.4B
        - 最符合当前公开验证和缺失的单位经济细节。
      - - 悲观
        - 合作伙伴里程碑延迟，商业化仍然狭窄，定价压力压缩独立模型经济性。
        - 当市场不再愿意为无差异模型敞口买单，公司估值会重估到更低的企业 AI 锚点。
        - $1.0B-$1.6B
        - 触发因素包括里程碑落空、转化数据偏弱，或收入质量继续不透明。
    notes: 情景价值是估值区间，不是预测；锚点来自公开私募轮次可比公司、类别结构，以及 Liquid 未披露经济性的具体不确定性。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV042
      - CV043
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 使用指标
      - 倍数 / 估值 / 状态
      - 对 Liquid 的参考价值
      - 主要限制
    rows:
      - - Writer
        - 2024 年 11 月 Series C 轮
        - ' $1.9B 估值 '
        - 企业 AI 平台，公开材料有客户和 ROI 表述。
        - 应用层重点和客户验证比 Liquid 更明确。
      - - AI21 Labs
        - 2023 年 8 月 Series C 轮
        - ' $1.4B 估值 '
        - 高效企业模型公司，强调自托管和安全部署姿态。
        - 轮次较早，产品组合 / 市场时点不同。
      - - Cohere
        - 2026 年融资更新
        - ' 据报道估值 $7B '
        - 主权企业 AI 参照，聚焦隐私和部署。
        - 规模显著更大，企业落地足迹更成熟。
      - - Mistral AI
        - 2025 年 9 月 Series C 轮
        - ' 11.7B€ 投后估值 '
        - 显示市场能给企业 / 前沿模型平台多高估值。
        - 平台宽度和资本基础远大于 Liquid。
      - - xAI
        - 2026 年 Series E 轮
        - ' 融资 $20B；顶级算力叙事 '
        - 说明分发加基础设施如何抬高估值天花板。
        - 消费者触达和算力规模不能与 Liquid 类比。
      - - Liquid AI
        - 2024 年 12 月 Series A 轮
        - ' 据报道投后估值 ~$2B '
        - 当前承销判断的锚点。
        - 公开来源没有披露收入、利润率或留存，无法验证该价格。
    notes: 本清单覆盖本章使用的六个私募估值锚点。它们不是可互换的可比公司；参考价值和限制比标题估值更重要。
    enumerationScope:
