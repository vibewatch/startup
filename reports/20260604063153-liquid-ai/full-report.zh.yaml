  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 分层与公开客户界面的形态
        blocks:
          - type: paragraph
            body: >-
              Liquid 的公开客户界面在目标行业上很宽，在已披露账户上很窄。公司明确面向企业、汽车制造商、金融机构、电商运营者、医疗和生命科学团队、工业用户、创业公司和开发者营销。这个宽度重要，因为它说明 Liquid
              销售的是灵活的部署和定制能力，而不是单一用途应用。潜在买方也因路径不同而变化：企业里的平台团队和 CTO，汽车里的 OEM
              软件组织，金融服务里的风控和欺诈团队，电商里的商品运营或搜索团队，以及受监管制药工作流里的科学家。


              但谁真正付费的公开证据比细分叙事薄得多。Liquid 没有披露客户数、付费账户数、按细分市场划分的收入结构，也没有像更成熟应用供应商那样给出具名企业 logo
              墙。公司呈现的是混合界面：面向定制企业工作的直销页面、通过社区资源进行免费或低摩擦评估，以及少量具名或匿名部署故事。因此，细分叙事可作为 TAM 框架是可信的，但作为规模化采用证据仍不完整。
