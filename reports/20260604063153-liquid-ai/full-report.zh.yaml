      - number: '6.4'
        title: 扩张潜力、集中度与伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Liquid 确实有合理的先落地再扩张逻辑。Mercedes
              明确为初始车内部署后的其他产品领域探索留下空间。公司营销覆盖的行业也多于它目前能用具名参考证明的行业，免费评估界面应能扩大漏斗顶部。但扩张仍由伙伴调解。Mercedes 控制汽车时间表和分发。AMD
              和其他硬件伙伴塑造设备性能和部署经济性。开发者可以轻松试用模型，但公司看起来仍通过协商访问和定制解决方案工作来变现更大用例。


              这带来两类集中风险。第一，公开参考集集中在极少数旗舰名称上，因此这些项目若延迟或令人失望，会不成比例地损伤 Liquid
              的客户叙事。第二，渠道依赖很高，因为除直销和模型分发端点之外，看不到主要转售商或市场平台动作。这并不意味着客户故事弱；它意味着故事脆弱。Liquid
              有足够证据证明真实市场拉力，但还没有足够多元的公开证据说明客户耐久性已经足够广泛。
