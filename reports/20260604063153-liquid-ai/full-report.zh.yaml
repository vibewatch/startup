chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品栈与商业姿态
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 更应被理解为一家高效基础模型公司，而不是 API 优先的前沿模型实验室。公司概况、模型、企业解决方案和定价页面都反复把业务放在高性能通用 AI
              系统上：这些系统可在设备端、本地或混合环境中运行，适用于延迟、隐私、安全和算力效率比通用云规模更重要的场景。如今公开可见的产品栈也强化了这一定位：Liquid Foundation Models
              是模型家族，LEAP 是定制与部署平台，Apollo 则是面向消费者的本地 playground。商业姿态同样有辨识度。Liquid 明确表示目前不运营自己的托管 API，而是把用户导向 playground
              访问、OpenRouter、Hugging Face 下载，以及通过 LEAP 和直销完成企业定制。这意味着公司卖的不只是 token
              消耗，而是模型架构、部署工具和企业支持。贯穿官方垂直页面的承诺一致：更小内存占用、更低延迟、本地数据控制，以及在 CPU、GPU 和 NPU 上部署，而不是依赖一个中心化 serving 栈。
