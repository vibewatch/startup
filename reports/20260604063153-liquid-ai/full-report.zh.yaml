      - number: '1.4'
        title: 记录在案的里程碑、合作牵引与公开风险信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司从研究源头叙事推进到垂直商业化的速度异常快。Liquid 在 2023 年 12 月带着种子轮走出隐身状态，2024 年 10 月 MIT 发布活动前后公开首批产品，随后在 2025 年和
              2026 年初借 LEAP 和 Apollo、G42 商业合作、AMD 笔记本支持，以及与 Insilico Medicine 和 Mercedes-Benz
              的具名合作继续加速。这些里程碑说明，公司试图在对部署敏感的行业里取胜：更小、更私有、可本地运行的模型有机会打败依赖云的默认方案。它们也显示 Liquid 同时扩展软件和硬件关系，而不是押注单一 GTM
              渠道。留存材料中最主要的反向公开信号不是丑闻，而是产品成熟度：Constellation Research 2024 年的笔记称首批 LFMs
              仍在打磨中，并在零样本代码、时效性信息和人类偏好优化上明显偏弱。2026 年又出现了一个更商业化的约束：Liquid 发布的开放许可对研究和小公司仍然慷慨，但要求收入超过 US$10 million
              的企业购买商业许可。合起来看，公司有真实动能，但仍在把技术差异化转换为持久市场标准。
