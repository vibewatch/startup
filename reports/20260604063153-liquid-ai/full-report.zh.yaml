      - number: '6.3'
        title: 留存、耐久性与公开材料仍没展示什么
        blocks:
          - type: paragraph
            body: >-
              耐久性是 Liquid 公开客户故事中最弱的一环。没有披露 NRR、GRR、流失率、续约率、席位扩张曲线或客户满意度数据。最好的耐久性信号是结构性的，而非测量得出的：Mercedes
              关系明确是多年期，Insilico 的私有基础设施设置说明工作流一旦集成，切换成本会更高。但这些仍是代理信号，不能替代队列或账户级证据，证明 Liquid 能在初始试点、调优或部署工作完成后继续留住客户。


              外部市场证据让这个缺口更重要，而不是更不重要。Deloitte 2026 年企业 AI 报告称，生产使用在增长，但治理、数据、风险和人才准备仍滞后，只有少数组织已经报告 AI 带来收入提升。对 Liquid
              来说，这意味着客户可能有兴趣，也具备技术试点能力，却仍会缓慢转化为持久生产收入。在 Liquid 披露续约、满意度或重复扩张之前，留存故事仍主要是从部署架构和对手方质量中推断出来的。
