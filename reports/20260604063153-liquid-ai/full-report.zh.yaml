          description: 多个垂直页面和匿名案例研究，显示 Liquid 想覆盖广泛工作流。
        - label: 已具名旗舰交易对手
          value: 15
          description: 在已审阅的公开材料中，Mercedes 和 Insilico 是仅有的清晰具名部署参考。
        - label: 当前私有部署证明
          value: 8
          description: Insilico 是目前最清晰的具名部署。
        - label: 公开规模化生产证明
          value: 3
          description: Mercedes 尚未上线，匿名案例研究也没有清楚标出规模化生产。
    claimRefs:
      - CU013
      - CU021
      - CU004
      - CU007
      - CU006
    approximationNotes: 漏斗数值是证明密度指数，不是客户数。它们表示各阶段有多少公开证据，以最宽的漏斗顶部层为 100。
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: 具名证明在交易对手质量上很强，但广度和留存可见度偏弱。
    data:
      columns:
        - 证据质量
        - 结果具体度
        - 生产成熟度
        - 留存可见度
      rows:
