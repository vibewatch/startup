      - number: '7.2'
        title: 法律、监管与商业合同风险
        blocks:
          - type: paragraph
            body: >-
              Liquid 的公开法律界面有实质商业意义。LFM Open License 对研究和小企业慷慨，但用户一旦跨过 $10 million
              年收入门槛就会变得受限。由于版权和专利授权以这一门槛为条件，公司实际上是在告诉成功采用者转入协商商业关系。这可以是有意设计的变现杠杆，但如果企业认为免费 /
              开放渠道条件过多或太容易终止，也会成为采购风险。监管背景会抬高利害关系。EU AI Act 明确把 AI 视为安全、权利和经济风险义务来源，NIST 的 AI RMF 现在也有生成式 AI
              和关键基础设施覆盖层。Liquid 卖进金融、汽车和生物技术等隐私与延迟敏感行业，因此即使产品价值主张仍强，公开治理界面偏薄也会在尽调中越来越重要。
