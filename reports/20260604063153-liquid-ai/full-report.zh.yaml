            body: >-
              分发是 Liquid 与前沿 API 实验室结构性差异最大的地方。OpenAI、Google、Microsoft 和 xAI 受益于公共 API、庞大既有生态或平台捆绑。Writer 和 Cohere
              通过工作流软件和治理走可信企业路线。Liquid 看起来则在通过嵌入式设备、硬件和行业合作搭建分发：AMD 面向 PC 级设备端加速，Mercedes-Benz 面向车内智能。Qualcomm
              和其他设备端栈也构成替代，因为它们可以承载许多更小或开放模型，而不需要 Liquid 的完整商业栈。这让买方多栖使用的可能性很高。客户可以用一个托管 API
              处理通用工作负载，用开放权重处理私有任务，再在低延迟边缘部署重要的地方测试 Liquid。因此，Liquid
              的护城河取决于能否让这些边缘部署实质性变得更好，而不只是“可以做到”。分发力量将来自可复制的合作伙伴牵头落地、参考部署，以及证明 Liquid 能在受限硬件上比通用替代更快集成或更便宜运行。
