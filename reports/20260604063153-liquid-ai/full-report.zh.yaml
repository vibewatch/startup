      - number: '8.2'
        title: 可比公司组与市场结构检验
        blocks:
          - type: paragraph
            body: >-
              可比公司组给出的不是一个干净锚点，而是一个更细的结论。Writer 和 AI21 说明，面向企业的 AI 公司可以在 $1.4 billion 至 $1.9 billion
              区间内生存，只要商业化叙事更明确。Cohere、Mistral 和 xAI 说明，当企业定位叠加更宽的平台广度、更大的算力规模，或更强的分发与公开验证时，这个类别可以拿到高得多的估值。与此同时，OpenAI 和
              Google 的定价，加上 Artificial Analysis 和 Amadeus 的数据，说明核心模型能力正变得更容易横向比较，也更难单靠原始规模守住防线。这一点对 Liquid
              很关键，因为它的战略差异化在高效部署，而不在压倒性的消费者分发或已披露收入规模。因此，可比公司组支持把 Liquid 放进高溢价企业 AI
              的讨论里，但并不说明当前价格天然便宜。它的估值高过一部分企业同业，却还缺少最高梯队前沿实验室对应的公开证明。
