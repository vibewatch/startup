      - number: '2.5'
        title: 矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              后续估值工作需要带着两个分析边界。第一，公开市场规模来源没有分离出 Liquid 的实际 SAM 或 SOM。宽口径边缘 AI 数字可以说明部署侧 AI
              市场很大，但若没有内部管线、胜率或垂直行业组合数据，这些数字彼此太不一致，无法支撑单一自上而下收入模型。第二，公开来源没有展示 Liquid
              把技术分发转化为付费企业使用的效率。创业公司和社区页面、文档以及开放许可姿态说明它有真实获客漏斗，但没有说明漏斗中有多少比例会变成付费部署、经常性收入或战略伙伴扩张。这个缺口重要，因为 Liquid
              的替代集合既包括极其便利的托管 API，也包括部署更重的开放权重替代。缺少客户转化、交易规模和支持负担数据时，正确结论是 Liquid 看起来与强市场驱动高度契合，但实际捕获率仍是内部运营问题，而非公开事实。
