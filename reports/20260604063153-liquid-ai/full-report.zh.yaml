            body: >-
              Liquid 最好的公开 GTM 信号不是客户数量披露或 ARR 表，而是企业合作证明，以及公司谈论部署的具体方式。AMD、Mercedes-Benz 和 Insilico 材料都强化了同一个模型：Liquid
