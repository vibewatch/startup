  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代集合
        blocks:
          - type: paragraph
            body: >-
              如果把完整基础模型市场定义为所有从托管 API 购买 token 的组织，Liquid AI
              并不整齐地落在这个市场里。它自己的企业、解决方案、定价、创业公司和社区页面指向一个更窄、也更偏运营的范畴：在数据本地性、延迟、隐私、安全或硬件约束重要的地方部署高效
              AI。汽车页面强调在受限硬件上运行的车内智能；电商页面聚焦搜索、智能体店铺前端工作流，以及相对零售利润率的成本；金融服务页面强调 PII
              密集和合规敏感工作流；创业公司或社区页面则销售小模型、文档、工具和导师支持的直接访问。这意味着市场边界围绕可部署、可定制、具备边缘意识的基础模型，而不是通用云 LLM
              访问。替代集合也因此改变。OpenAI、Google、Anthropic、Writer 和 xAI 是便利型买家的 API 优先替代；Cohere、Mistral、Microsoft Phi、Meta
              Llama、Qualcomm 以及其他设备端或自托管方案，则更直接地在部署控制上竞争。因此，Liquid 不做托管 API 的姿态会收窄一部分需求，却强化了它在私有和嵌入式工作流中的契合度。
