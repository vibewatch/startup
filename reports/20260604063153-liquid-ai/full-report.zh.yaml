  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与价格纪律为何重要
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 的融资信号真实存在：公司完成 $250 million 融资，公开追踪数据把这一轮的投后估值放在 $2 billion 左右，PitchBook 至少显示公司到 2025
              年初已经开始产生收入。这足以把 Liquid 视为一家严肃公司，而不是一条实验室设想。但同一组公开材料也说明，为什么估值纪律很重要。Liquid 仍没有自有托管
              API，公开材料没有披露收入、毛利率或留存，可见的商业化故事高度依赖授权、定制和合作伙伴主导的部署。换句话说，投资人看得到公司为什么值得关注，但还看不到通常支撑倍数法承销的经营指标。因此，合适的估值姿态要从价格敏感性出发：争论点不是
              Liquid 有没有前景，而是今天的私募估值是否在更广泛客户转化和单位经济性可见之前，已经提前消化了太多显而易见的边缘 AI 上行空间。
