        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个平衡但约束清晰的财务判断。Liquid 似乎拥有连贯的企业部署收入机制、一些令人鼓舞的合作伙伴证明，以及继续建设的新资本。它的商业设计也在逻辑上区别于按 token 计量的前沿 API
              和按席位收费的应用供应商。但完整承销所需的几乎每个指标仍是私有信息：ARR、客户集中度、烧钱速度、毛利率、CAC、回本周期、续约和下一轮触发条件。这意味着公开投资逻辑最多只能走到结构，不能走到业绩。尽调时，公司应被视为一家有前景但仍不透明的私营企业
              AI
              供应商：收入模型可读，经济性不可见。下一个决策点不应再靠叙事，而应取决于管理层是否愿意打开运营模型和资本计划。因此，谨慎投资人可以认可战略方向，同时仍拒绝只凭公开数据承销估值。剩余工作是管理层接触尽调，而不是继续解读列表页面。
