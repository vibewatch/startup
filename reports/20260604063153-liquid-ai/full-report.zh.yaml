      - number: '5.2'
        title: 架构、LEAP 部署路径与关键依赖
        blocks:
          - type: paragraph
            body: >-
              Liquid 的差异化故事先是架构，再是商业。公司反复把 LFMs 描述为液态神经网络和更广状态空间研究的延伸，使用第一性原理、动力系统、信号处理和数值线性代数的语言，而不只是 Transformer
              scaling。独立发布报道基本接受了这一框架，尤其是在内存效率和小模型性能上。公开研究页面也显示，公司在发布后继续交付架构论文；这一点重要，因为公司的商业可信度取决于延展真实研究边缘，而不是简单重贴一个高效推理包装器的标签。


              在部署上，LEAP 是研究与收入之间的关键中间层。公开材料把 LEAP 描述为模型定制和部署的统一工作流，AMD 新闻稿加上 TechIntelPro 报道提供了最清楚的具体证据：Liquid
              能把模型绑定到特定硬件目标。上行空间很强：AMD 笔记本支持、合作伙伴背书的 sub-100ms 响应声明，以及面向私有推理的云无关路径。风险在于，公开文档仍没有透露 LEAP
              底层更深的编译器、调度器或编排内部机制。除了一篇报道把这套栈和 llama.cpp 联系起来，Liquid 要求买方信任一个大体封闭的部署层。
