      - number: '8.3'
        title: 投资逻辑、反向逻辑与情景承销
        blocks:
          - type: paragraph
            body: >-
              投资逻辑很直接：如果不想承担最大前沿实验室完整的资本开支和规模竞赛，Liquid 可能是投资高效主权 AI 的少数可信路径之一。公司有真实的架构故事，明确站在端侧和本地部署定位上，也有 AMD 与
              Mercedes 这样的高价值合作伙伴验证。反向逻辑同样直接：基础模型价值可能正在离开通用模型层，公开定价压力真实存在，而 Liquid
              还没有拿出足够的收入质量或部署转化数据，来支撑在当前估值下给出高确信度买入判断。这组张力决定了情景。乐观情景下，Mercedes 进入量产，Liquid 证明企业部署可以重复。基准情景下，Liquid
              仍有战略吸引力，但只是慢慢长进一个今天大致合理的估值。悲观情景下，合作伙伴集中度和定价商品化把公司拉回较低梯队的企业 AI 可比公司。这个不对称性支持谨慎，而不是被动：继续跟踪公司，但在高价进入前要求更多证明。
