  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Mercedes 验证未能转化
        - 到 2026 年底没有可信的初始生产部署
        - 削弱最强的公开边缘商业化验证点。
        - 下调投资逻辑中的边缘溢价部分。
      - - 商业转化仍不透明
        - 管理层无法展示超出试点和下载的付费授权或部署转化
        - 变现故事会变成科学故事，而不是商业故事。
        - 转化证据出现前，持有或避免投入新资金。
      - - 类别商品化加速
        - 通用模型价格继续下跌，而 Liquid 缺少应用层验证
        - 即便效率更高，「又一家模型厂商」的价值也会缩水。
        - 将估值框架移向更低的企业 AI 锚点。
      - - 治理轨迹落后于部署野心
        - 受监管或自主部署扩张，却没有强验证和监督材料
        - 增加敏感行业的采购摩擦和下行风险。
        - 承销受监管市场上行空间前，先要求治理材料包。
      - - 披露缺口延续到下一次融资事件
        - 到下一轮仍看不到收入、利润率、留存或集中度
        - 使市场无法用基本面验证私有估值标记。
        - 基本面出现前，将任何上轮估值融资都视为情绪驱动。
    notes: 否决触发项以里程碑为基础，未来尽调可以直接检验，而不是依赖叙事印象。
    claimRefs:
      - CV026
      - CV030
      - CV034
      - CV035
      - CV039
      - CV044
      - CV047
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 按产品、渠道和部署模式拆分的 ARR
        - 决定这门生意配不配软件溢价，还是只有战略期权价值。
        - 管理层 KPI 包和董事会材料。
      - - 利润率和现金画像
        - 2024 年融资后的毛利率、托管 / 支持负担和现金消耗
        - 检验高效架构是否真的带来经济杠杆。
        - 财务尽调和经审计财务审阅。
      - - 客户集中度
        - 头部客户、管线结构和伙伴依赖
        - 判断公开标杆交易是否高估了可复制性。
        - 销售运营导出数据和客户推荐计划审阅。
      - - Mercedes 里程碑转化
        - 按车型年拆分的试点、验证和量产就绪证据
        - 直接检验最强的边缘商业化证据点。
        - 与产品、OEM 合作伙伴和客户负责人做项目审阅。
      - - 许可变现
        - 超过公开免费使用门槛后的付费合同条款
        - 检验从开放使用到商业付费的漏斗是否跑得通。
        - 法律 / 定价审阅，加已签企业合同样本。
      - - 股权结构和优先权
        - 清算顺位、参与权和二级市场悬空筹码
        - 影响实际入场价格和下行保护，且独立于公司质地。
        - 公司律师和融资文件审阅。
    notes: 这些是最小一组尽调请求，最可能直接改变建议或估值立场。
    claimRefs:
      - CV035
      - CV036
      - CV042
      - CV045
      - CV046
      - CV047
      - CV048
      - CV053
