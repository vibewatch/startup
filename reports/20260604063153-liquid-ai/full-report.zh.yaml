            body: >-
              $250 million 融资显著改善了 Liquid 对外呈现的资本实力，独立报道给出超过 $2 billion
              的公司估值，也说明投资人在承销一条有分量的商业化路径。但资本充足不等于资本清晰。被审阅的公开材料没有披露账上现金、烧钱速度、现金跑道、毛利率、客户数或类债务义务。因此，这轮融资更像信心信号，而不是真正的跑道计算。Microsoft
              2025 年 10-K 在这里可作比较，不是因为 Microsoft 在规模上是同业，而是它展示了公开 AI 企业能够给出的收入、利润率和资本披露水平。按这个基准看，Liquid
