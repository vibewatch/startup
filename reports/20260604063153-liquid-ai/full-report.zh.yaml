      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              证据指向 Liquid 所处品类的真实结构性顺风。公开市场报告反复提到低延迟、隐私、数据主权、IoT 普及、5G、专用边缘芯片，以及自主或物理系统这些增长驱动。Wevolver 2026
              年边缘报告提供了更技术化的视角：有用的设备端模型越来越落在一个不大不小的黄金区间，从十亿以下到个位数十亿参数不等，这与 Liquid 对小型多模态模型、设备端
              TTFT，以及跨笔记本、嵌入式设备和企业端点部署的强调一致。但同一批来源也指出了真实摩擦。Deloitte 把技能缺口称为 AI 集成最大障碍。Stratistics
              标记了跨大量边缘设备部署和维护的复杂性。Liquid 自身的定价和许可结构又增加了一个约束：它没有开箱即用的托管 API，买方必须接受一定部署负担；一旦客户收入超过 US$10
              million，开放许可就依赖商业许可。因此，当总部署经济性、隐私和韧性最重要时，Liquid 更有吸引力；当便利性和即时消耗主导采购决策时，它的吸引力会下降。
