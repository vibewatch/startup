- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Type
  - Evidence
  - Timing
  - Implication / diligence ask
  rows:
  - - AI pilot-to-production scaling
    - Driver
    - Deloitte says worker access rose 50% in 2025 and high-production deployments are set to double in six months
    - Current
    - Supports near-term enterprise demand but requires proof that Liquid can win production budgets
  - - Physical AI expansion
    - Driver
    - Deloitte says 58% of firms already use physical AI and 80% expect to within two years
    - Current to medium term
    - Helps Liquid’s automotive and embedded positioning
  - - Latency, privacy, and sovereignty needs
    - Driver
    - Liquid pages and VMR both emphasize local control and real-time response
    - Current
    - Core reason buyers may prefer deployable models over hosted APIs
  - - Small-model efficiency trend
    - Driver
    - Wevolver and Liquid community materials point to small, efficient, on-device models as a 2026 design center
    - Current
    - Favors Liquid if benchmark claims survive customer evaluation
  - - AI skills gap
    - Constraint
    - Deloitte identifies insufficient worker skills as the biggest integration barrier
    - Current
    - Can lengthen enterprise deployment cycles and increase solution-engineering burden
  - - Complex deployment and maintenance
    - Constraint
    - Stratistics flags heterogeneous edge-device deployment and maintenance as a threat
    - Persistent
    - Raises support costs and can reduce practical SAM versus top-down TAM
  - - Hosted API convenience
    - Constraint
    - OpenAI, Google, Anthropic, Writer, and xAI offer easier hosted consumption paths
    - Current
    - Liquid must win on deployment economics and control rather than on instant API convenience
  - - Commercial-license threshold above US$10M revenue
    - Constraint
    - Liquid’s open license ends free commercial use above the threshold
    - Current
    - May friction adoption for successful startups and mid-market software buyers
  - - Contradictory market reports
    - Constraint
    - 2026 public estimates range from US$47.59B to US$153.84B
    - Current
    - Later valuation work needs sensitivity analysis rather than a single headline TAM
  notes: The table blends direct public facts with analytical implications. Timing is directional and reflects when the driver or constraint appears most relevant to Liquid’s go-to-market.
