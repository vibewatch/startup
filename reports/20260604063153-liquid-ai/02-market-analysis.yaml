- id: sizing-lenses-and-demand-envelope
  title: Sizing lenses and demand envelope
  body: The public evidence supports a large opportunity envelope, but not one canonical TAM. Deloitte’s 2026 enterprise-AI survey shows demand moving from pilot to scaled production, with worker access rising 50% in 2025, the share of companies with at least 40% of projects in production set to double in six months, and physical AI already in use at 58% of surveyed firms with 80% expected in two years. Those adoption signals matter because Liquid’s product story is tied to private, local, and physical deployments rather than only web chat. Market-size reports support the same directional thesis but diverge sharply in magnitude. Fortune Business Insights and Verified Market Reports both put the edge AI market at US$47.59 billion in 2026 and US$385.89 billion by 2034, while Stratistics MRC puts edge AI inference alone at US$153.84 billion in 2026 and US$635.51 billion by 2034. That gap is too large to wave away as rounding noise; it signals that these publishers are measuring different market
    boundaries. For diligence purposes, the right posture is to use public estimates as an outer envelope and to treat Liquid’s serviceable market as a narrower subset tied to regulated, latency-critical, or device-constrained deployments.
