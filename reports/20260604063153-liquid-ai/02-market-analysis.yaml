tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Liquid
  rows:
  - - Private and deployable foundation-model workflows
    - Model licensing, customization, deployment tooling, support, and hardware-fit work for local or hybrid AI
    - Pure consumer chatbot usage with no deployment or data-boundary decision
    - Enterprise product, IT, data, or operations budgets
    - Closest high-level description of Liquid’s practical market boundary
  - - Automotive in-cabin and embedded AI
    - In-vehicle assistant, reasoning, multimodal interaction, and edge inference layers
    - Generic cloud chat unrelated to vehicle systems
    - OEM software and vehicle-program budgets
    - Directly reflected in Liquid’s automotive positioning and Mercedes partnership
  - - Ecommerce search and agentic storefront workflows
    - Search, recommendations, cart and checkout orchestration, merchant copilots
    - Generic marketing copy generation with no storefront integration
    - Digital commerce, CX, and merchandising budgets
    - Matches Liquid’s ecommerce page and commerce-partner narrative
  - - Financial-services AI on private infrastructure
    - Fraud, payments, trading, customer-service, and knowledge workflows requiring data control
    - Low-sensitivity general productivity use with no compliance burden
    - CIO, operations, risk, and transformation budgets
    - Matches Liquid’s finserv page and sovereignty/privacy positioning
  - - Startup and developer adoption funnel
    - Model experimentation, fine-tuning, docs, mentorship, and platform usage that can convert to paid deployment
    - Casual hobbyist use with no commercial intent
    - Founder, engineering, or product budgets
    - Important lead-generation channel but not equivalent to enterprise revenue
  - - Hosted public API spend
    - Token-based cloud model access from vendors such as OpenAI or Google
    - Local and on-device deployment economics
    - Developer or product cloud-spend budgets
    - Adjacent or substitute market rather than Liquid’s clearest current fit because Liquid does not run its own hosted API
  notes: This table defines the practical market boundary for Liquid rather than the entire AI market. Included and excluded spend are analytical categories, not audited revenue pools.
