- id: growth-drivers-and-adoption-constraints
  title: Growth drivers and adoption constraints
  body: 'The evidence points to a genuine structural tailwind for Liquid’s category. Public market reports repeatedly cite low latency, privacy, data sovereignty, IoT proliferation, 5G, specialized edge chips, and autonomous or physical systems as growth drivers. Wevolver’s 2026 edge report adds a more technical lens: useful on-device models increasingly live in a Goldilocks zone from sub-billion to single-digit-billion parameters, which matches Liquid’s own emphasis on small multimodal models, on-device TTFT, and deployment across laptops, embedded devices, and enterprise endpoints. But the same sources also identify real friction. Deloitte calls the skills gap the biggest barrier to AI integration. Stratistics flags deployment and maintenance complexity across many edge devices. Liquid’s own pricing and licensing structure adds another constraint: there is no turnkey hosted API, so buyers must accept some deployment burden, and the open license becomes commercial-license-dependent once
    a customer exceeds US$10 million in revenue. That makes Liquid more attractive when total deployment economics, privacy, and resilience matter most, and less attractive when convenience and immediate consumption dominate the buying decision.'
