company:
  name: Liquid AI
chapter:
  number: 2
  title: Market Analysis
  summary: 'Liquid AI’s practical market is narrower than the generic foundation-model category: the strongest public evidence points to latency-, privacy-, and sovereignty-sensitive AI deployments across edge devices, enterprise endpoints, and regulated workflows. Public market reports support a large opportunity envelope, but they disagree materially on scale, with 2026 estimates ranging from US$47.59 billion for edge AI broadly to US$153.84 billion for edge AI inference, meaning Liquid’s SAM must be treated as directional rather than precise. The clearest buyer segments are automotive OEM software teams, digital-commerce operators, financial-services transformation and risk teams, and startup or developer builders seeking deployable small models, while the main adoption constraints are skills gaps, integration complexity, heterogeneous hardware, and Liquid’s own choice not to operate a first-party hosted API.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and substitute set
  body: 'Liquid AI does not fit neatly into the full foundation-model market if that market is defined as every organization buying tokens from a hosted API. Its own enterprise, solutions, pricing, startup, and community pages point to something narrower and more operationally specific: efficient AI deployed where data locality, latency, privacy, security, or hardware constraints matter. The automotive page emphasizes in-vehicle intelligence running on constrained hardware; the ecommerce page focuses on search, agentic storefront workflows, and cost relative to retail margins; the financial-services page stresses PII-heavy and compliance-sensitive workflows; and the startup or community pages sell direct access to small models, docs, tooling, and mentorship. That implies a market boundary centered on deployable, customizable, edge-aware foundation models rather than generic cloud LLM access. It also changes the substitute set. OpenAI, Google, Anthropic, Writer, and xAI represent API-first
    alternatives for convenience-led buyers, while Cohere, Mistral, Microsoft Phi, Meta Llama, Qualcomm, and other on-device or self-hosted options compete more directly on deployment control. Liquid’s no-hosted-API stance therefore narrows some demand while strengthening its fit in private and embedded workflows.'
