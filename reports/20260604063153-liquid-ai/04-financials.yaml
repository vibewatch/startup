- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why missing matters
  - Impact on verdict
  - Exact diligence path
  - Severity
  rows:
  - - ARR or revenue run rate
    - No scale anchor for recurring revenue quality
    - Blocks valuation and growth underwriting
    - Obtain current ARR bridge and prior-year comparison
    - Blocking
  - - Customer count and concentration
    - No way to judge platform breadth or single-logo risk
    - Blocks GTM durability view
    - Obtain paying-customer count and top-10 revenue concentration
    - Blocking
  - - Gross margin
    - No evidence on whether deployment-heavy model is software-like or services-heavy
    - Blocks margin-path judgment
    - Obtain hosting, support, and delivery gross margin by route
    - Blocking
  - - CAC, payback, and sales cycle
    - Cannot tell if enterprise motion is efficient
    - Limits confidence in growth economics
    - Obtain funnel metrics and cohort payback analysis
    - Material
  - - Cash burn and next-round trigger
    - Cannot tell when financing dependence reappears
    - Limits capital-adequacy judgment
    - Obtain board plan, downside runway, and next-financing trigger
    - Blocking
  - - Reference-customer economics
    - Case-study surface exists but economics are undisclosed
    - Limits confidence in ROI and repeatability
    - Request named customer outcomes tied to contract value and renewal
    - Material
  notes: These gaps reflect public-data limitations, not necessarily company weakness; they remain decisive
    blockers for external underwriting.
