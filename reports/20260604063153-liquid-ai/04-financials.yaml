  - - Commercial license conversion
    - Upsell after threshold breach
    - License / contract
    - Triggered when user exceeds $10M annual revenue threshold
    - Potentially strong monetization lever if enforced
    - Request number of threshold-triggered negotiations and closure rate
  notes: Public evidence explains how Liquid can charge, but not how much revenue each stream contributes
    today.
