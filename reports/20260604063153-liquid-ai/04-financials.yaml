- id: capital-adequacy-and-disclosure-gap
  title: Capital adequacy and disclosure gap
  body: The $250 million financing materially improves Liquid’s headline capital position, and independent
    reporting that values the company above $2 billion suggests investors are underwriting a meaningful
    commercialization path. But capital adequacy is not the same as capital clarity. The reviewed public
    corpus does not disclose cash on hand, burn, runway, gross margin, customer count, or debt-like obligations.
    That makes the funding round more of a confidence signal than a true runway calculation. Microsoft’s
    2025 10-K is useful here as a comparator not because Microsoft is a peer in scale, but because it
    shows the level of revenue, margin, and capital disclosure public AI businesses can provide. Against
    that benchmark, Liquid remains highly opaque. The right conclusion is that the balance-sheet headline
    is positive, but the underwriting file is still incomplete in every metric that would normally govern
    capital-risk judgment.
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI021
