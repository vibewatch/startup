- id: TI002
  title: Pricing / monetization table
  columns:
  - Route or comparator
  - Public price or contract cue
  - List vs. realized
  - What buyer gets
  - Unknowns
  - Interpretation
  rows:
  - - Liquid playground
    - Free with rate limits
    - List
    - Hands-on exploration
    - Conversion rate and usage cap economics
    - Acts as funnel rather than revenue center
  - - Liquid OpenRouter route
    - Paid with higher limits
    - Partner list pricing, not Liquid realized pricing
    - Hosted access without Liquid running own API
    - Revenue share, volume discounts, and effective take rate
    - Useful proof that some self-serve monetization exists
  - - Liquid LEAP / enterprise
    - Contact sales / custom
    - Realized only
    - Customization, deployment, support, and private infrastructure options
