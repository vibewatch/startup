    - Enterprise discounts
    - Benchmark for token-priced AI procurement
  - - Anthropic
    - $5 input / $25 output plus seat plans
    - List
    - Hybrid assistant-plus-API packaging
    - Large-account discounts
    - Shows trust-oriented commercial structure
  - - Google Gemini
    - Free tier plus paid token, cache, and search fees
    - List
    - Detailed production metering
    - Enterprise custom terms
    - Reinforces Liquid’s transparency gap
  notes: Liquid’s list-price gap is itself financially significant because it prevents outsiders from
    benchmarking realized monetization against public comparators.
