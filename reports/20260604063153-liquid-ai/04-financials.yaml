    - Potential low-friction monetization without own API infra
    - Request share of revenue retained after partner economics
  - - Model downloads
    - Direct downloadable models
    - License / deployment
    - Publicly available through Hugging Face and docs
    - Can support broad adoption but weak direct monetization alone
    - Request paid conversion path from downloaders to enterprise contracts
  - - LEAP customization
