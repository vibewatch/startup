  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: customer-arr-disclosure
    missingEvidence: Paying-customer count, ARR, revenue mix, and segment concentration.
    whyItMatters: Without core revenue disclosure, it is impossible to underwrite scale, concentration,
      or recurring quality.
    diligencePath: Request monthly recurring revenue bridge, top-customer exposure, and annualized contracted
      revenue by route to market.
    relatedQuestionRefs:
    - QI010
    - QI024
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-runway
    missingEvidence: Gross margin, cash balance, monthly burn, runway months, and any debt or committed
      compute obligations.
    whyItMatters: Capital adequacy cannot be judged from funding headlines alone when infrastructure and
      enterprise deployment costs may be meaningful.
    diligencePath: Request latest management accounts, cash waterfall, hiring plan, and committed infrastructure
      spend.
    relatedQuestionRefs:
    - QI011
    - QI012
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, win rates, sales-cycle duration, and implementation cost by channel
      or vertical.
    whyItMatters: A bespoke deployment model can look attractive strategically while still being operationally
      inefficient.
    diligencePath: Request funnel conversion, implementation staffing, and gross-profit-per-deployment
      cohorts.
    relatedQuestionRefs:
    - QI017
    - QI022
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: next-round-trigger
    missingEvidence: Any public statement on next-round timing, liquidity plans, or explicit capital milestones
      after the Series A.
    whyItMatters: Funding dependence remains qualitative until management states the trigger for raising
      again or reaching breakeven.
    diligencePath: Ask management to define milestone-based financing triggers, minimum cash buffer, and
      downside contingency plans.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
