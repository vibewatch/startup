evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, observer list, and investor-rights summary tied to the post-Series-A cap table.
    whyItMatters: Without governance detail it is hard to judge control, board independence, and key-person concentration risk.
    diligencePath: Request the latest board deck, cap table, preferred-stock terms, and any investor rights agreements.
    relatedQuestionRefs:
      - QO014
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      A canonical Series A closing memo or board-approved financing summary that reconciles exact post-money valuation
      and investor list.
    whyItMatters: >-
      Public sources differ between US$2.0B, over US$2.0B, and US$2.3B markers, which affects ownership and mark-up
      analysis.
    diligencePath: Request the Series A term sheet, closing cap table, and any investor communications naming the final syndicate.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, ARR, customer count, deployment count, and net-retention metrics.
    whyItMatters: >-
      The company is visibly commercializing, but the public record still cannot distinguish technical adoption from
      repeatable paid traction.
    diligencePath: Request a board-ready KPI pack with booked ARR, pipeline, active customers, and deployment cohorts.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A current employee census broken down by function and location.
    whyItMatters: >-
      Public headcount signals range widely, which makes it difficult to gauge burn, hiring velocity, and organizational
      maturity.
    diligencePath: Request current payroll and headcount by department and compare with open requisitions and contractor usage.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: minor
    topic: milestone chronology
    missingEvidence: >-
      More customer deployment dates, internal launch milestones, and any adverse operating events that would complete
      the public chronology.
    whyItMatters: >-
      The milestone table is directionally strong, but it still relies on public announcements rather than a full
      operating timeline and could miss delays or dropped programs.
    diligencePath: >-
      Request an internal product and partnership chronology showing signed dates, launch dates, pilot conversions, and
      any cancelled or delayed milestones.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      A market model that reconciles why broad edge-AI estimates and edge-AI-inference estimates differ so sharply in
      2026 and 2034.
    whyItMatters: >-
      The public spread is too wide to support a single top-down TAM without risking false precision in later valuation
      work.
    diligencePath: >-
      Build an internal bottoms-up sizing model from target workflows, buyer counts, expected ACVs, and deployment
      frequency rather than relying on one syndicated report.
    relatedQuestionRefs:
      - QM006
      - QM023
      - QM027
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-conversion
    missingEvidence: Actual paid customer count, design-partner count, community-to-paid conversion rate, and revenue mix by vertical.
    whyItMatters: >-
      Without conversion data it is impossible to translate Liquid’s strong market positioning into a defendable
      capture-rate assumption.
    diligencePath: Request pipeline, active customer, cohort-conversion, and ARR by vertical and by deployment model.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: adoption-economics
    missingEvidence: >-
      Benchmark TCO and deployment-burden evidence comparing Liquid with hosted APIs and other private-deployment
      alternatives.
    whyItMatters: >-
      Liquid’s market thesis depends on superior total deployment economics, but public sources do not quantify win-loss
      conditions.
    diligencePath: Request benchmark decks, customer proof, support-burden metrics, and implementation timelines from recent pilots.
    relatedQuestionRefs:
      - QM013
      - QM017
      - QM026
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: minor
    topic: sam-isolation
    missingEvidence: >-
      A public or internal segmentation that isolates Liquid’s SAM inside automotive, ecommerce, financial services, and
      enterprise endpoint deployments.
    whyItMatters: Broad edge-AI reports overstate the portion of spend that Liquid can realistically attack in the near term.
    diligencePath: >-
      Build a vertical-by-vertical SAM model using target account counts, deployment type, regulatory burden, and
      realistic ACV bands.
    relatedQuestionRefs:
      - QM023
      - QM025
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: Named win-loss data versus OpenAI, Google, Microsoft, or Writer in live enterprise pursuits.
    whyItMatters: Distribution strength and moat durability cannot be underwritten from positioning pages alone.
    diligencePath: Request a twelve-month pipeline conversion table with named competitors and segment-level win reasons.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Actual customer pricing for OpenRouter consumption, LEAP deployments, and enterprise custom contracts.
    whyItMatters: >-
      List-price opacity obscures whether Liquid monetizes efficiency at a premium or discounts heavily to land
      accounts.
    diligencePath: Request realized ASP, minimum commitments, and discount corridors by route to market.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: head-to-head-benchmarks
    missingEvidence: A public, like-for-like benchmark that places Liquid beside GPT-4o, Claude, and Gemini on buyer-relevant tasks.
    whyItMatters: >-
      Without common-task evidence, capability claims remain directional rather than directly comparable for
      procurement.
    diligencePath: Request evaluation decks or customer bake-off results with shared tasks, prompts, and scoring rules.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: minor
    topic: replication-risk
    missingEvidence: Evidence on whether rivals can rapidly replicate Liquid’s edge-private positioning with smaller open models.
    whyItMatters: This determines whether Liquid’s deployment thesis is a durable wedge or a temporary packaging lead.
    diligencePath: Track competitor launches in on-device agents, private deployment SDKs, and embedded auto or PC partnerships.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP005
  - type: private-evidence-only
    severity: blocking
    topic: customer-arr-disclosure
    missingEvidence: Paying-customer count, ARR, revenue mix, and segment concentration.
    whyItMatters: Without core revenue disclosure, it is impossible to underwrite scale, concentration, or recurring quality.
    diligencePath: >-
      Request monthly recurring revenue bridge, top-customer exposure, and annualized contracted revenue by route to
      market.
    relatedQuestionRefs:
      - QI010
      - QI024
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-runway
    missingEvidence: Gross margin, cash balance, monthly burn, runway months, and any debt or committed compute obligations.
    whyItMatters: >-
      Capital adequacy cannot be judged from funding headlines alone when infrastructure and enterprise deployment costs
      may be meaningful.
    diligencePath: Request latest management accounts, cash waterfall, hiring plan, and committed infrastructure spend.
    relatedQuestionRefs:
      - QI011
      - QI012
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, win rates, sales-cycle duration, and implementation cost by channel or vertical.
    whyItMatters: A bespoke deployment model can look attractive strategically while still being operationally inefficient.
    diligencePath: Request funnel conversion, implementation staffing, and gross-profit-per-deployment cohorts.
    relatedQuestionRefs:
      - QI017
      - QI022
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: next-round-trigger
    missingEvidence: Any public statement on next-round timing, liquidity plans, or explicit capital milestones after the Series A.
    whyItMatters: >-
      Funding dependence remains qualitative until management states the trigger for raising again or reaching
      breakeven.
    diligencePath: Ask management to define milestone-based financing triggers, minimum cash buffer, and downside contingency plans.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: trust-surface-detail
    missingEvidence: >-
      Public audit artifacts such as a trust-center packet, independent certification scope, security whitepaper, or
      detailed governance documentation for LEAP.
    whyItMatters: >-
      Liquid is selling into automotive, finance, and regulated science; without third-party trust detail, the buyer
      still relies mostly on Liquid's own marketing and legal framing.
    diligencePath: >-
      Request a trust-center export, security architecture review, audit scope summary, and documented model-governance
      controls for local and hybrid deployment paths.
    relatedQuestionRefs:
      - QE022
  - type: private-evidence-only
    severity: material
    topic: deployment-metrics
    missingEvidence: >-
      Customer-level production metrics for Mercedes and Insilico, including active endpoints, latency, uptime, usage
      volume, and post-launch retention.
    whyItMatters: >-
      The strongest public deployment references still lack the operational metrics needed to translate partnership
      headlines into underwriteable product maturity.
    diligencePath: >-
      Request deployment scorecards, reference calls, and milestone-based KPI reporting from both counterparties or from
      Liquid under NDA.
    relatedQuestionRefs:
      - QE023
  - type: private-evidence-only
    severity: material
    topic: leap-commercial-adoption
    missingEvidence: >-
      Paid LEAP customer count, active enterprise deployments, conversion from community downloads to contracts, and
      support / retention metrics for the platform itself.
    whyItMatters: >-
      LEAP is the bridge from checkpoint downloads to recurring product value, but public materials do not reveal
      whether it is already a scaled commercial platform.
    diligencePath: >-
      Ask for LEAP customer count, ARR contribution, active device count, and a cohort view of evaluation-to-production
      conversion.
    relatedQuestionRefs:
      - QE024
  - type: missing-source
    severity: material
    topic: leap-internals
    missingEvidence: >-
      A technical paper or engineering note describing LEAP's scheduler, compiler, runtime orchestration, and
      benchmarking methodology beyond marketing language.
    whyItMatters: >-
      The platform is central to Liquid's monetization thesis, yet one third-party mention of llama.cpp is not enough to
      understand implementation depth or defensibility.
    diligencePath: >-
      Request a detailed architecture review, benchmark methodology package, and component inventory for LEAP under NDA
      or in a customer engineering briefing.
    relatedQuestionRefs:
      - QE025
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: >-
      Active customer count, paid-account count, and revenue mix by segment, geography, and deployment type as of
