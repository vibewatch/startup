              healthcare and life-sciences teams, industrial users, startups, and developers. That breadth matters
              because it suggests Liquid is selling a flexible deployment and customization capability rather than a
              single-purpose application. The likely buyers also differ by motion: platform teams and CTOs in
              enterprise, OEM software organizations in automotive, risk and fraud teams in financial services,
              merchandising or search teams in ecommerce, and scientists in regulated pharma workflows.


              Yet the public evidence of who actually pays is much thinner than the segmentation story. Liquid does not
              disclose customer count, paid-account count, revenue mix by segment, or a named enterprise logo wall
              comparable to more mature application vendors. Instead, the company offers a hybrid surface: direct sales
              pages for custom enterprise work, free or low-friction evaluation via community resources, and a small set
              of named or anonymized deployment stories. That means the segmentation narrative is credible as TAM
