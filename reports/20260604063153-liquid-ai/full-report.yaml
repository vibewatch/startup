  - id: FR002
    title: Risk transmission map
    type: dag
    summary: Commercial and regulatory risks feed into one another through conversion, deployment proof, and valuation support.
    data:
      nodes:
        - id: n1
          label: License friction
          detail: Free/open usage becomes conditional for larger commercial adopters.
        - id: n2
          label: Procurement delay
          detail: Legal and compliance review lengthens enterprise sales cycles.
        - id: n3
          label: Partner-concentrated proof
          detail: Only a few named deployments anchor the public story.
        - id: n4
          label: Production slippage
          detail: Pilots fail to convert into live deployments on schedule.
        - id: n5
          label: Revenue opacity
          detail: Public users cannot observe recurring usage, retention, or margin quality.
        - id: n6
          label: Next-round pressure
          detail: Weaker proof increases financing and valuation risk.
        - id: n7
          label: Regulatory overhead
          detail: EU and critical-infrastructure governance expectations raise diligence burden.
        - id: n8
          label: Execution stretch
          detail: Wide vertical ambition and rapid hiring strain operating focus.
      edges:
        - from: n1
          to: n2
          label: raises contract review burden
        - from: n2
          to: n5
          label: slows conversion visibility
        - from: n3
          to: n4
          label: magnifies milestone dependency
        - from: n4
          to: n5
          label: reduces monetization proof
        - from: n7
          to: n2
          label: adds compliance asks
        - from: n8
          to: n4
          label: stretches delivery capacity
        - from: n5
          to: n6
          label: weakens underwriting confidence
        - from: n4
          to: n6
          label: compresses strategic premium
    claimRefs:
      - CR013
      - CR026
      - CR031
      - CR034
      - CR035
      - CR043
      - CR044
      - CR045
  - id: FR003
    title: Dependency map
    type: dag
    summary: >-
      Liquid's public commercialization graph is still centered on a few silicon, channel, and lighthouse-customer
      relationships.
    data:
      nodes:
        - id: d1
          label: AMD
          detail: Silicon partner for edge optimization and public performance proof.
        - id: d2
          label: Mercedes-Benz
          detail: Most visible automotive production pathway.
        - id: d3
          label: Insilico Medicine
          detail: Scientific vertical proof on private infrastructure.
        - id: d4
          label: LEAP / Liquid platform
          detail: Own control plane for customization and deployment.
        - id: d5
          label: OpenRouter / downloads / playground
          detail: Current public access channels in lieu of a first-party hosted API.
        - id: d6
          label: Regulated enterprise buyers
          detail: Need governance, reliability, and commercial clarity before scale commitments.
      edges:
        - from: d1
          to: d4
          label: hardware optimization
        - from: d2
          to: d4
          label: production validation path
        - from: d3
          to: d4
          label: vertical benchmark and deployment proof
        - from: d5
          to: d4
          label: distribution and experimentation
        - from: d4
          to: d6
          label: licenses, customization, deployment
        - from: d1
          to: d6
          label: hardware choice and performance expectations
    claimRefs:
      - CR014
      - CR024
      - CR026
      - CR028
      - CR043
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Recommendation quality depends less on liking the company and more on whether public evidence clears the current
      price.
    data:
      nodes:
        - id: a
          label: Real financing signal
          detail: $250M round and ~$2B public valuation anchor show serious market belief.
        - id: b
          label: Differentiated edge thesis
          detail: Efficient on-device / on-prem deployment is strategically relevant.
        - id: c
          label: Disclosure gap
          detail: Revenue, margins, retention, and cap-table terms remain private.
        - id: d
          label: Commoditization pressure
          detail: Model pricing competition is intensifying across the category.
        - id: e
          label: Partner-led proof
          detail: Mercedes and AMD are promising but still concentrated proof points.
        - id: f
          label: Recommendation
          detail: 'research-more: stay engaged, but do not underwrite upside yet.'
      edges:
        - from: a
          to: b
          label: supports attention
        - from: b
          to: e
          label: needs conversion into
        - from: e
          to: c
          label: still limited by
        - from: d
          to: c
          label: makes more costly
        - from: c
          to: f
          label: drives
    claimRefs:
      - CV002
      - CV004
      - CV030
      - CV033
      - CV035
      - CV045
  - id: FV002
    title: Valuation sensitivity
    type: bar
    summary: >-
      Headline peer valuations show the band Liquid is being judged against, but not all peers bring the same
      commercialization proof.
    data:
      items:
