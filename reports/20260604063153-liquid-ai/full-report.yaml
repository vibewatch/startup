  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Current view
      - What would change the view
    rows:
      - - Architecture thesis
        - Liquid has a differentiated efficient-deployment story for edge, on-prem, and sovereign AI use cases.
        - >-
          Independent customer evidence that the architecture consistently wins in production would strengthen the
          thesis materially.
      - - Commercialization anti-thesis
        - The company still lacks public revenue, margin, and retention disclosure.
        - Detailed KPI disclosure or a lower entry price would weaken this concern.
      - - Partner-proof thesis
        - AMD and Mercedes suggest the technology is credible enough for serious industrial and device use cases.
        - Broader customer breadth beyond the current partner set would turn proof from concentrated to repeatable.
      - - Commoditization anti-thesis
        - Value may be migrating from generic model layers toward applications, data, and orchestration.
        - If Liquid shows that it owns those higher-value layers in practice, commoditization becomes less threatening.
      - - Category-upside thesis
        - >-
          Cohere, Mistral, and xAI show how large private valuations can become when distribution or compute scale is
          real.
        - Liquid would need stronger deployment scale and market visibility to claim that upside band credibly.
      - - Disclosure anti-thesis
        - Current evidence supports attention and continued diligence, but not a clean buy recommendation.
        - >-
          Management disclosure on revenue quality, cap-table terms, and customer concentration is the shortest path to
          a rating upgrade.
    notes: >-
      Rows pair the upside case with the exact missing evidence needed to move the call rather than treating conviction
      as static.
    claimRefs:
      - CV033
      - CV035
      - CV039
      - CV040
