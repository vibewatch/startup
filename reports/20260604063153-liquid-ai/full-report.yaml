      - number: '8.2'
        title: Comparable set and market-structure test
        blocks:
          - type: paragraph
            body: >-
              The comp set supports a nuanced conclusion rather than a single clean anchor. Writer and AI21 show that
              enterprise-oriented AI companies can live around the $1.4 billion to $1.9 billion range with more explicit
              commercialization narratives. Cohere, Mistral, and xAI show that the category can command much higher
              valuations when the company pairs enterprise positioning with broader platform breadth, larger compute
              scale, or stronger distribution and public proof. At the same time, OpenAI and Google pricing, together
              with Artificial Analysis and Amadeus, show that core model capabilities are becoming easier to compare and
              harder to defend on raw scale alone. That matters for Liquid because its strategic differentiation sits in
              efficient deployment, not in overwhelming consumer distribution or disclosed revenue scale. The comp set
              therefore argues that Liquid belongs in a premium enterprise-AI conversation, but not that its current
              price is automatically a bargain. It sits above some enterprise peers while still lacking the public proof
              that accompanies the highest-tier frontier labs.
