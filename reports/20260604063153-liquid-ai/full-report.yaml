  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and why price discipline matters
        blocks:
          - type: paragraph
            body: >-
              Liquid AI has a real financing signal: the company raised $250 million, public trackers place the round
              around a $2 billion post-money valuation, and PitchBook at least indicates that revenue generation had
              begun by early 2025. That is enough to treat Liquid as a serious company, not a speculative lab note. But
              the same public pack also shows why valuation discipline matters. Liquid still does not run a first-party
              hosted API, public materials do not disclose revenue, margin, or retention, and the visible
              commercialization story leans heavily on licensing, customization, and partner-led deployment. In other
              words, investors can see why the company deserves attention, but they still cannot observe the operating
              metrics that would normally support a clear multiple-based underwriting case. The right valuation posture
              therefore starts with price sensitivity: the debate is not whether Liquid is promising, but whether
              today's private mark already discounts too much of the obvious edge-AI upside before broader customer
              conversion and unit economics are visible.
            claimRefs:
