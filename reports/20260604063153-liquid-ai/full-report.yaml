      - number: '8.3'
        title: Investment thesis, anti-thesis, and scenario underwriting
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is straightforward: Liquid may be one of the more credible ways to invest in
              efficient sovereign AI without taking on the full capex and scale race of the largest frontier labs. The
              company has a real architecture story, explicit on-device and on-prem positioning, and high-value partner
              proof in AMD and Mercedes. The anti-thesis is equally straightforward: foundation-model value may be
              migrating away from the generic model layer, public pricing pressure is real, and Liquid has not yet
              exposed enough revenue quality or deployment-conversion data to justify a high-conviction buy call at the
              current mark. That tension drives the scenarios. In the bull case, Mercedes reaches production and Liquid
              proves repeatable enterprise deployment. In the base case, Liquid remains strategically interesting but
              grows into a valuation that is only roughly fair today. In the bear case, partner concentration and
              pricing commoditization drag the company back toward lower-tier enterprise AI comparables. That asymmetry
              supports caution rather than passivity: keep the company live, but demand more proof before paying up.
