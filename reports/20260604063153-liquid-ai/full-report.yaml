      - number: '1.2'
        title: Founders, technical lineage, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founder story is well supported even if governance visibility is not. Official launch materials,
              TechCrunch, and company databases all identify Liquid AI as a 2023 MIT-related spinout led by Ramin
              Hasani, Mathias Lechner, Alexander Amini, and Daniela Rus, with Hasani serving as CEO, Lechner as CTO, and
              Amini as chief science officer. The founding narrative matters because Liquid is not merely
              commercializing generic open-source models; it is commercializing a specific research lineage rooted in
              liquid neural networks and liquid time-constant networks. The arXiv LTC paper and Liquid’s own research
              pages link the startup directly to continuous-time and state-space work developed before the company was
              incorporated. Governance is much weaker in the public record. Tracxn provides a six-person board list, but
              Liquid itself does not publish a current board or governance page, and none of the retained public sources
              cleanly describe control rights after the Series A. That leaves meaningful diligence questions around
              investor oversight, board independence, and key-person concentration around the founder-scientist bench.
