          high: 4
          unit: $B
          claimRef: CV042
    claimRefs:
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: Investment KPIs
    type: kpi
    summary: >-
      Liquid scores well on strategic differentiation but poorly on public commercialization visibility and valuation
      support.
    data:
      items:
        - label: Architecture differentiation
          value: 8/10
          detail: Beyond-transformer and edge-efficient positioning are well evidenced.
          tone: positive
        - label: Partner proof
          value: 7/10
          detail: AMD and Mercedes provide real strategic validation, but proof remains concentrated.
          tone: neutral
        - label: Commercial visibility
          value: 3/10
          detail: No public revenue, margin, or retention disclosure.
          tone: warning
        - label: Pricing power visibility
          value: 4/10
          detail: No first-party API and no public monetization cohorts.
          tone: warning
        - label: Governance readiness
          value: 4/10
          detail: Category governance pressure is rising faster than public evidence of Liquid's controls.
          tone: warning
        - label: Market tailwind
          value: 8/10
          detail: Enterprise and edge AI demand are both expanding.
          tone: positive
        - label: Valuation support
          value: 4/10
          detail: Current mark is plausible but not obviously attractive relative to disclosed peers and missing metrics.
          tone: warning
    claimRefs:
      - CV025
      - CV027
      - CV033
      - CV035
      - CV047
      - CV048
      - CV053
