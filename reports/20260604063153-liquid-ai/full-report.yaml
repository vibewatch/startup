        title: Revenue model and packaging architecture
        blocks:
          - type: paragraph
            body: >-
              Liquid’s public commercial surfaces describe a monetization architecture that is understandable in shape
              but opaque in realized economics. The company explicitly says it does not operate a hosted API of its own,
              which immediately differentiates it from token-metered leaders. Instead, public self-serve routes consist
              of a free playground, paid OpenRouter access, direct model downloads, and a sales-led LEAP and enterprise
              path. The license adds another important commercial lever: broad rights for smaller users, but a forced
              transition once a commercial user crosses the $10 million annual-revenue threshold. Taken together, that
              implies a revenue model built around enterprise deployments, licensing, support, and customization rather
              than mass-volume first-party API traffic. The mechanism is clear enough to analyze, but the realized take
              rate, ASP, and revenue mix remain unavailable from public sources.
