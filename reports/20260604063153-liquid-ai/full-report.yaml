      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Liquid’s public vertical pages imply several distinct buyer motions rather than one generic enterprise
              sale. In automotive, the primary buyer is an OEM software or infotainment team trying to improve in-car
              assistants while staying within latency, privacy, and hardware limits; the user is the driver or
              passenger; the payer is the vehicle-program or software-platform budget. In ecommerce, the buyer is a
              digital product, search, merchandising, or customer-experience team; users are shoppers and brand
              operators; budgets come from commerce, growth, or customer-support lines. In financial services, the
              likely buyers are CIO, data and AI platform, risk, or operations teams; users are employees and customers
              inside fraud, payments, service, and trading workflows; payer logic sits with transformation, compliance,
              or operations budgets. Startups and developer-community users form a separate motion where the buyer is
              the technical founder or product engineer and the payer is venture-funded product budget. Across all of
              these, the adoption path is not instantaneous. Liquid must first win a benchmark or proof-of-concept, then
              a hardware-fit and model-customization exercise, then security or governance review, and only then a
              deployment or support contract.
