      - number: '2.5'
        title: Contradictions and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Two analytical limits should shape valuation work in later chapters. First, public market-sizing sources
              do not isolate Liquid’s actual SAM or SOM. The broad edge-AI numbers are useful to show that the
              deployment-side AI market is large, but they are too inconsistent to defend a single top-down revenue
              model without internal pipeline, win-rate, or vertical mix data. Second, public sources do not show how
              efficiently Liquid converts technical distribution into monetized enterprise usage. The startup and
              community pages, docs, and open-license posture show a real acquisition funnel, but not the percentage of
              that funnel that becomes paid deployment, recurring revenue, or strategic-partner expansion. That gap
              matters because Liquid’s substitute set includes both ultra-convenient hosted APIs and more
              deployment-heavy open-weight alternatives. Without customer-conversion, deal-size, and support-burden
              data, the right conclusion is that Liquid appears well aligned with strong market drivers, but its
              practical capture rate is still an internal-operations question rather than a public fact.
            claimRefs:
              - CM015
