companyProfile:
  summary: |
    Liquid AI is a 2023 MIT CSAIL spinout commercializing a research lineage around liquid neural networks and related
    efficient sequence-model architectures. The company positions itself as an alternative to transformer-first labs by
    building multimodal Liquid Foundation Models (LFMs) and pairing them with LEAP, a customization-and-deployment
    platform optimized for edge, on-premise, and hybrid environments where privacy, latency, and compute efficiency are
    critical.

    Public evidence shows a fast progression from stealth launch to strategic partnerships. Liquid announced a $46.6M
    seed round in December 2023, followed by an AMD-led $250M Series A in December 2024. Since then it has broadened
    its commercial narrative with hardware optimization on AMD Ryzen and Ryzen AI processors, a March 2026 Insilico
    Medicine partnership for private drug-discovery models, and an April 2026 Mercedes-Benz partnership targeting in-car
    production deployment. The main open questions are not about whether the science is real, but whether the company
    can translate partner-led proof into repeatable, disclosed commercial scale.
