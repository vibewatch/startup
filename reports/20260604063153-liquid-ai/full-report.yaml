            body: >-
              Durability is the weakest part of Liquid's public customer story. There is no disclosed NRR, GRR, churn,
              renewal rate, seat expansion curve, or customer-satisfaction data. The best durability signal is
              structural rather than measured: the Mercedes relationship is explicitly multi-year, and Insilico's
              private-infrastructure setup suggests higher switching costs once workflows are integrated. But those are
              still proxies. They do not replace cohort or account-level evidence showing that Liquid can keep customers
              after initial pilot, tuning, or deployment work is finished.


              External market evidence makes this gap more important, not less. Deloitte's 2026 enterprise AI report
              says production usage is growing but governance, data, risk, and talent readiness still lag, and only a
              minority of organizations already report revenue lift from AI. For Liquid, that means customers may be
              interested and technically able to pilot, yet still slow to convert into durable production revenue. Until
              Liquid discloses renewals, satisfaction, or repeat expansion, the retention story remains mostly an
