chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product stack, and commercial posture
        blocks:
          - type: paragraph
            body: >-
              Liquid AI is best understood as an efficient-foundation-model company rather than an API-first
              frontier-model lab. The company overview, models, enterprise-solutions, and pricing pages consistently
              frame the business around high-performance general-purpose AI systems that can run on-device, on-premise,
              or in hybrid environments where latency, privacy, security, and compute efficiency matter more than
              generic cloud scale. That positioning is reinforced by the product stack now visible in public: Liquid
              Foundation Models as the model family, LEAP as the customization-and-deployment platform, and Apollo as a
              consumer-facing local playground. The commercial posture is also distinctive. Liquid explicitly says it
              does not currently operate a hosted API of its own, instead steering users toward playground access,
              OpenRouter, Hugging Face downloads, and enterprise customization through LEAP and direct sales. That means
              the company is selling model architecture, deployment tooling, and enterprise support, not just token
              consumption. Across official vertical pages, the recurring promise is the same: smaller memory footprint,
              lower latency, local control of data, and deployment on CPUs, GPUs, and NPUs rather than dependence on one
              centralized serving stack.
