      - number: '1.3'
        title: Funding history, scale markers, and what is still missing
        blocks:
          - type: paragraph
            body: >-
              Liquid AI’s capital history is public enough to anchor the chapter, but its operating scale is not.
              Official launch materials announced a US$46.6 million seed in December 2023 led by OSS Capital and
              PagsGroup, and official 2024 funding materials then announced a US$250 million Series A led by AMD.
              TechCrunch, Tech Funding News, and Tracxn broadly corroborate the round sizes, while the valuation marker
              is directionally consistent but not perfectly identical across sources: independent coverage says the
              Series A valued the company at over US$2 billion, Tracxn rounds it to US$2 billion, and Mathias Lechner’s
              July 2025 biography references a US$2.3 billion valuation and a broader strategic-investor set. The right
              inference is that Liquid is a late-seed-to-Series-A unicorn-scale company with ample capital for
              productization, but the exact post-money and investor allocations remain diligence items. Public scale
              metrics are materially thinner. Headcount signals conflict across PitchBook, Hugging Face, and Tracxn, and
              there is still no clean public disclosure of revenue, ARR, customer count, or deployment volume. Those
              omissions matter because the company is visibly commercializing, hiring GTM and finance roles, and
              announcing major partnerships, yet the monetization conversion from technical promise to repeatable
              enterprise revenue is still opaque.
