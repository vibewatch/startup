      - number: '7.4'
        title: People, economics, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The people-and-economics risk is about execution bandwidth more than headline balance-sheet weakness.
              Liquid has meaningful capital for a young company, but public sources still show mixed scale snapshots,
              active hiring across both deep research and go-to-market roles, and only third-party visibility into board
              composition. At the same time, the company is trying to serve many sectors and deployment patterns, from
              startups and enterprise customization to automotive and drug discovery. Deloitte and MAPEGY both suggest
              that enterprise demand for AI and edge inference is real, but they also show that governance maturity,
              physical-AI readiness, and regulation remain limiting factors across the market. That means Liquid is
              competing in a category where buyer demand is growing while implementation friction stays high. The thesis
              breaks if the company cannot turn partner-led proof into repeatable enterprise deployments, if the license
              funnel fails to convert into commercial contracts, or if execution sprawl outruns the organization's
              ability to ship and support products cleanly.
