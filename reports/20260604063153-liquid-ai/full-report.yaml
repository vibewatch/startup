          unit: $B
        - label: Writer Series C valuation
          value: 1.9
          unit: $B
        - label: Liquid reported Series A valuation
          value: 2
          unit: $B
        - label: Cohere reported valuation
          value: 7
          unit: $B
        - label: Mistral Series C valuation
          value: 11.7
          unit: €B
        - label: xAI Series E raise
          value: 20
          unit: $B
