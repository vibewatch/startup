  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute set
        blocks:
          - type: paragraph
            body: >-
              Liquid AI does not fit neatly into the full foundation-model market if that market is defined as every
              organization buying tokens from a hosted API. Its own enterprise, solutions, pricing, startup, and
              community pages point to something narrower and more operationally specific: efficient AI deployed where
              data locality, latency, privacy, security, or hardware constraints matter. The automotive page emphasizes
              in-vehicle intelligence running on constrained hardware; the ecommerce page focuses on search, agentic
              storefront workflows, and cost relative to retail margins; the financial-services page stresses PII-heavy
              and compliance-sensitive workflows; and the startup or community pages sell direct access to small models,
              docs, tooling, and mentorship. That implies a market boundary centered on deployable, customizable,
              edge-aware foundation models rather than generic cloud LLM access. It also changes the substitute set.
              OpenAI, Google, Anthropic, Writer, and xAI represent API-first alternatives for convenience-led buyers,
              while Cohere, Mistral, Microsoft Phi, Meta Llama, Qualcomm, and other on-device or self-hosted options
              compete more directly on deployment control. Liquid’s no-hosted-API stance therefore narrows some demand
              while strengthening its fit in private and embedded workflows.
