    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked top risks and transmission paths
        blocks:
          - type: paragraph
            body: >-
              Liquid AI's risk stack is less about existential science failure than about whether a differentiated
              architecture can survive the brutal transition from research credibility to repeatable enterprise
              monetization. Public evidence supports a real company with capital, technical depth, and named partners,
              but the same public pack also shows how early the operating system still is: commercialization is routed
              through licenses, downloads, partner channels, and customization rather than a visible first-party API
              business; marquee deployment proof is concentrated in AMD, Mercedes, and Insilico; and independent
              coverage still described LFMs as preview-stage and limited on some tasks. That combination creates a
              stacked transmission path. If partner pilots slip, if the benchmark edge proves narrower in production, or
              if customers balk at license terms and channel complexity, revenue credibility can weaken faster than the
              technical narrative. The right severity lens is therefore cumulative: concentration, readiness, and
              monetization opacity reinforce one another rather than behaving as isolated concerns.
