        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public record supports a balanced but clearly constrained financial view. Liquid appears to have a
              coherent enterprise deployment revenue mechanism, some encouraging partner proof, and fresh capital to
              keep building. Its commercial design is also logically differentiated from both token-metered frontier
              APIs and seat-based application vendors. However, nearly every metric required for full underwriting
              remains private: ARR, customer concentration, burn, gross margin, CAC, payback, renewal, and next-round
              trigger. That means the public thesis can only go as far as structure, not performance. For diligence
              purposes, the company should be treated as a promising but still opaque private enterprise-AI vendor whose
              revenue model is legible and whose economics are not. The next decision point should therefore depend less
              on narrative and more on whether management is willing to open the operating model and capital plan. A
              cautious investor could therefore like the strategic direction while still refusing to underwrite
              valuation on public data alone. The remaining work is management-access diligence, not further
              interpretation of list pages.
