      - number: '5.3'
        title: Trust, privacy, licensing, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Liquid's trust posture is built more around deployment control and commercial rules than around a mature
              public compliance surface. The strongest public trust claims are operational: no first-party hosted API,
              enterprise local access behind the customer firewall, Apollo marketed as cloud-free and offline, and
              AMD-backed language around zero dependency on cloud APIs. Those claims align with the company's edge and
              sovereign-AI positioning. In practice, they should appeal most to buyers that are explicitly optimizing
              for privacy, latency, and local control rather than to buyers who want a frictionless hosted API.


              The legal surface is also unusually important. Liquid's LFM Open License is permissive in many ways, but
              it ends free commercial rights above a $10 million revenue threshold and forces larger companies into
              negotiated commercial licensing. That may be an intelligent funnel design—free for small builders,
              monetized for enterprises—but it also means product adoption is partly gated by sales and legal
              negotiation. The weakest area is third-party trust evidence. Public sources do not give a robust trust
              center, audit report, published incident history, or detailed LEAP governance material beyond marketing
              and licensing. For a company selling into automotive, finance, and regulated science, that gap is
              material.
