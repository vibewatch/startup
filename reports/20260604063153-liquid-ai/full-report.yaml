            body: >-
              Operationally, Liquid is underwriting a hard path: heterogeneous edge deployment, custom enterprise
              integrations, and production support across regulated sectors. The public materials show real progress,
              especially around AMD optimization and the Mercedes automotive path, but they also reveal how much of the
              thesis still depends on counterparties and production milestones that Liquid does not fully control. The
              company does not yet expose a first-party hosted API, which means the public monetization path runs
              through licensing, partner channels, downloads, and bespoke deployment work. That can create stronger
              lock-in and margin later, but in the near term it also increases implementation burden and reduces
              easy-to-observe usage signals. Independent commentary compounds the concern by noting that LFMs were still
              a work in progress and weaker on several task categories in 2024. Investors should therefore treat the
              AMD, Mercedes, and Insilico proofs as valuable but concentrated, and should not assume that one lighthouse
