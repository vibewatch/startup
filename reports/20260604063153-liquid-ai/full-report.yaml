        title: Legal, regulatory, and commercialization-contract risk
        blocks:
          - type: paragraph
            body: >-
              Liquid's public legal surface is commercially meaningful. The LFM Open License is generous for research
              and smaller businesses, but it becomes restrictive once a user crosses $10 million in annual revenue.
              Because the copyright and patent grants are conditioned on that threshold, the company is effectively
              telling successful adopters to move into a negotiated commercial relationship. That can be an intentional
              monetization lever, but it is also a procurement risk if enterprises perceive the free/open channel as too
              conditional or too easy to terminate. The regulatory backdrop raises the stakes. The EU AI Act explicitly
              frames AI as a source of safety, rights, and economic-risk obligations, while NIST's AI RMF now has both
              generative-AI and critical-infrastructure overlays. Liquid sells into privacy- and latency-sensitive
              sectors such as finance, automotive, and biotech, so a thin public governance surface will increasingly
              matter in diligence even if the product value proposition remains strong.
