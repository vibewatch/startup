  - FR002
- id: legal-regulatory-and-contractual
  title: Legal, regulatory, and commercialization-contract risk
  body: Liquid's public legal surface is commercially meaningful. The LFM Open License is generous for research and smaller businesses, but it becomes restrictive once a user crosses $10 million in annual revenue. Because the copyright and patent grants are conditioned on that threshold, the company is effectively telling successful adopters to move into a negotiated commercial relationship. That can be an intentional monetization lever, but it is also a procurement risk if enterprises perceive the free/open channel as too conditional or too easy to terminate. The regulatory backdrop raises the stakes. The EU AI Act explicitly frames AI as a source of safety, rights, and economic-risk obligations, while NIST's AI RMF now has both generative-AI and critical-infrastructure overlays. Liquid sells into privacy- and latency-sensitive sectors such as finance, automotive, and biotech, so a thin public governance surface will increasingly matter in diligence even if the product value proposition
    remains strong.
  claimRefs:
  - CR031
  - CR032
  - CR033
  - CR034
  - CR035
  - CR040
  - CR058
  tableRefs:
  - TR001
- id: operational-and-dependency-risks
  title: Operational, partner, and deployment dependency risk
  body: 'Operationally, Liquid is underwriting a hard path: heterogeneous edge deployment, custom enterprise integrations, and production support across regulated sectors. The public materials show real progress, especially around AMD optimization and the Mercedes automotive path, but they also reveal how much of the thesis still depends on counterparties and production milestones that Liquid does not fully control. The company does not yet expose a first-party hosted API, which means the public monetization path runs through licensing, partner channels, downloads, and bespoke deployment work. That can create stronger lock-in and margin later, but in the near term it also increases implementation burden and reduces easy-to-observe usage signals. Independent commentary compounds the concern by noting that LFMs were still a work in progress and weaker on several task categories in 2024. Investors should therefore treat the AMD, Mercedes, and Insilico proofs as valuable but concentrated, and
    should not assume that one lighthouse deal automatically generalizes to broad enterprise repeatability.'
