  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Revenue mix, gross margin by deployment model, and paid license conversion above the public free-use threshold.
    whyItMatters: Without these data points, investors cannot test whether the commercial model scales beyond bespoke deployments.
    diligencePath: Request board-level KPI pack covering ARR, margin, channel mix, and commercial-license conversions.
  - type: missing-source
    severity: material
    topic: deployment-quality
    missingEvidence: Customer-grade latency, uptime, incident history, and support metrics across live deployments.
    whyItMatters: Benchmark claims and partner announcements do not establish production reliability or service burden.
    diligencePath: Request SLA templates, customer references, and incident-review summaries from automotive and enterprise accounts.
    relatedTableRefs:
    - TR002
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A reconciled employee-count and org-structure view for 2025-2026.
    whyItMatters: Public scale snapshots differ materially and affect how much execution bandwidth investors should assume.
    diligencePath: Ask management for current headcount by function, location, and critical open roles.
  - type: missing-source
    severity: material
    topic: governance-artifacts
    missingEvidence: Formal model-governance, red-teaming, validation, and regulated-deployment documentation.
    whyItMatters: As deployments enter automotive and other sensitive settings, governance maturity becomes part of the product.
    diligencePath: Request model cards, validation reports, customer security package, and compliance-owner map.
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Pipeline concentration, reference-customer breadth, and partner-conversion funnel data.
    whyItMatters: The public story is concentrated in a few partnerships and may overstate repeatability.
    diligencePath: Review pipeline by vertical, active paid deployments, and revenue concentration across top accounts.
    relatedTableRefs:
    - TR003
    - TR005
