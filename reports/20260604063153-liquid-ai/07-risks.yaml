- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Mercedes commercialization risk
    - Automotive deployment milestone
    - No credible production deployment evidence by end-2026
    - Reduce conviction in physical-AI / automotive upside and re-underwrite valuation on software-only proofs
  - - License conversion risk
    - Commercial license adoption
    - Management cannot show paid conversion above the $10M threshold
    - Treat open-to-paid monetization as unproven and lower revenue quality assumptions
  - - Benchmark-to-production gap
    - Customer quality evidence
    - Independent or customer evidence shows weak quality on core production tasks
    - Downgrade moat and require stronger vertical proof before new capital
  - - Partner concentration risk
    - Reference-customer breadth
    - Public proof set remains limited to AMD, Mercedes, and Insilico through the next financing cycle
    - Assume concentration discount and slower enterprise adoption
  - - Execution-sprawl risk
    - Org readiness versus vertical breadth
    - Critical roles remain open while sector ambitions continue expanding
    - Push for sequencing, narrower GTM focus, and tighter operating plan before underwriting growth
  notes: The triggers are designed to be observable in future diligence cycles rather than abstract statements of concern.
