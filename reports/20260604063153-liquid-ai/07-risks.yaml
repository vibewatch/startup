chapter:
  number: 7
  title: Risks
  summary: Liquid AI's risk profile is driven by the gap between a credible edge-AI architecture and still-concentrated commercialization proof. The company has real capital, technical depth, and lighthouse partners, but public evidence also shows restrictive license economics, partner concentration, production-readiness uncertainty, and governance demands that can quickly weaken the thesis if deployments or conversions slip.
sections:
- id: ranked-top-risks
  title: Severity-ranked top risks and transmission paths
  body: 'Liquid AI''s risk stack is less about existential science failure than about whether a differentiated architecture can survive the brutal transition from research credibility to repeatable enterprise monetization. Public evidence supports a real company with capital, technical depth, and named partners, but the same public pack also shows how early the operating system still is: commercialization is routed through licenses, downloads, partner channels, and customization rather than a visible first-party API business; marquee deployment proof is concentrated in AMD, Mercedes, and Insilico; and independent coverage still described LFMs as preview-stage and limited on some tasks. That combination creates a stacked transmission path. If partner pilots slip, if the benchmark edge proves narrower in production, or if customers balk at license terms and channel complexity, revenue credibility can weaken faster than the technical narrative. The right severity lens is therefore cumulative:
    concentration, readiness, and monetization opacity reinforce one another rather than behaving as isolated concerns.'
  claimRefs:
  - CR004
  - CR006
  - CR013
  - CR014
  - CR021
  - CR022
  - CR023
  - CR024
  - CR026
