company:
  name: Liquid AI
chapter:
  number: 1
  title: Company Overview
  summary: Liquid AI is a 2023 MIT CSAIL spinout building efficient foundation models and deployment tooling for on-device, on-premise, and hybrid AI workloads. The strongest public funding markers are the US$46.6 million seed announced at launch and the AMD-led US$250 million Series A announced in December 2024, implying roughly US$296.6 million of disclosed primary capital and a valuation around or above US$2 billion. The clearest open diligence issues are exact headcount, paid-customer/revenue scale, and the precise cap-table and board-control picture, while an external analyst note also suggests early LFMs still had material product limitations in 2024.
sections:
- id: identity-product-and-business-model
  title: Identity, product stack, and commercial posture
  body: 'Liquid AI is best understood as an efficient-foundation-model company rather than an API-first frontier-model lab. The company overview, models, enterprise-solutions, and pricing pages consistently frame the business around high-performance general-purpose AI systems that can run on-device, on-premise, or in hybrid environments where latency, privacy, security, and compute efficiency matter more than generic cloud scale. That positioning is reinforced by the product stack now visible in public: Liquid Foundation Models as the model family, LEAP as the customization-and-deployment platform, and Apollo as a consumer-facing local playground. The commercial posture is also distinctive. Liquid explicitly says it does not currently operate a hosted API of its own, instead steering users toward playground access, OpenRouter, Hugging Face downloads, and enterprise customization through LEAP and direct sales. That means the company is selling model architecture, deployment tooling, and enterprise
    support, not just token consumption. Across official vertical pages, the recurring promise is the same: smaller memory footprint, lower latency, local control of data, and deployment on CPUs, GPUs, and NPUs rather than dependence on one centralized serving stack.'
