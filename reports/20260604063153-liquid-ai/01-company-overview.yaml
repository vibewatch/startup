- id: milestones-partnerships-and-risk-signals
  title: Milestones of record, partner traction, and public risk signals
  body: 'The milestone record shows unusually fast movement from research-origin story to verticalized commercialization. After emerging from stealth with a seed round in December 2023, Liquid publicly unveiled its first products around the October 2024 MIT launch event and then accelerated through 2025 and early 2026 with LEAP and Apollo, a G42 commercial partnership, AMD laptop support, and named partnerships with Insilico Medicine and Mercedes-Benz. Those milestones suggest the company is trying to win in deployment-sensitive sectors where smaller, private, and locally running models can beat cloud-dependent defaults. They also show Liquid expanding across both software and hardware relationships rather than relying on a single GTM channel. The main adverse public signal in the retained pack is product maturity rather than scandal: Constellation Research’s 2024 note said the first LFMs were still a work in progress and specifically weak on zero-shot code, time-sensitive information, and
    human-preference optimization. A second, more commercial constraint emerged in 2026 when Liquid published an open license that remains generous for research and small companies but forces businesses above US$10 million in revenue to buy a commercial license. Together these factors imply real momentum, but also a company still converting technical differentiation into a durable market standard.'
