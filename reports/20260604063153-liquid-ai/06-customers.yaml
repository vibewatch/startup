  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, named renewals, customer satisfaction scores, and cohort retention by account type.
    whyItMatters: Durability is currently the weakest public dimension of the customer story; without these metrics, Liquid cannot be underwritten as a proven recurring-revenue platform.
