- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Liquid's public customer path runs from evaluation to custom deployment and then only sometimes to visible flagship proof.
  data:
    items:
    - label: Discover
      detail: Prospects encounter Liquid through sector pages, launch coverage, docs, HF, hackathons, or community content.
    - label: Evaluate
      detail: Builders test checkpoints in browser, via downloads, or with Apollo before deciding whether a custom deployment is needed.
    - label: Design
      detail: Enterprise or partner buyers move into a sales-led design and customization motion oriented around their hardware, data, and workflow.
    - label: Deploy
      detail: The strongest public examples are private-infrastructure specialist deployment and a pre-production automotive path.
    - label: Expand
      detail: Expansion depends on partner-controlled milestones and on Liquid converting evaluation surfaces into durable revenue accounts.
