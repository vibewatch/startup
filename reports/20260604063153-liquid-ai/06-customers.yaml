- id: durability-gaps
  title: Retention, durability, and what public materials still fail to show
  body: |-
    Durability is the weakest part of Liquid's public customer story. There is no disclosed NRR, GRR, churn, renewal rate, seat expansion curve, or customer-satisfaction data. The best durability signal is structural rather than measured: the Mercedes relationship is explicitly multi-year, and Insilico's private-infrastructure setup suggests higher switching costs once workflows are integrated. But those are still proxies. They do not replace cohort or account-level evidence showing that Liquid can keep customers after initial pilot, tuning, or deployment work is finished.

    External market evidence makes this gap more important, not less. Deloitte's 2026 enterprise AI report says production usage is growing but governance, data, risk, and talent readiness still lag, and only a minority of organizations already report revenue lift from AI. For Liquid, that means customers may be interested and technically able to pilot, yet still slow to convert into durable production revenue. Until Liquid discloses renewals, satisfaction, or repeat expansion, the retention story remains mostly an inference from deployment architecture and counterpart quality.
  claimRefs:
  - CU028
  - CU029
  - CU024
  - CU025
  - CU015
  - CU016
  - CU017
  - CU018
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-dependence
  title: Expansion potential, concentration, and partner dependence
  body: |-
    Liquid does have plausible land-and-expand logic. Mercedes explicitly leaves room to explore other product areas after the initial in-car deployment. The company also markets across more sectors than it can currently prove with named references, and its free evaluation surfaces should widen the top of funnel. But expansion is still partner-mediated. Mercedes controls automotive timelines and distribution. AMD and other hardware partners shape device performance and deployment economics. Developers can try the models easily, yet the company still appears to monetize larger use cases through negotiated access and custom-solution work.

    This creates two concentration risks. First, the public reference set is concentrated in a very small number of flagship names, so delays or disappointments there would disproportionately damage Liquid's customer narrative. Second, channel dependence is high because no major reseller or marketplace motion is visible beyond direct sales and model distribution endpoints. That does not make the customer story weak; it makes it fragile. Liquid has enough proof to show real market pull, but not enough diversified public proof to say customer durability is already broad-based.
