- id: named-proof
  title: Named customer proof, pilots versus production, and reference quality
  body: |-
    The named public proof set is concentrated but real. Mercedes-Benz is the most visible flagship relationship: a multi-year automotive partnership tied to MBUX generations in North America, with first production deployment targeted for the second half of 2026. That is meaningful because the customer is blue-chip and the use case is operationally demanding, but it is still not post-launch proof. Insilico Medicine is the stronger current-state deployment signal because the parties say the scientific model is available now on private pharmaceutical infrastructure. Together, these two accounts show Liquid can win serious counterparties.

    Reference quality drops quickly after those two named proofs. The rest of Liquid's public customer evidence comes mostly from anonymized case-study blurbs—automotive, fraud, ecommerce, translation, and synthetic video—where the outcome numbers are interesting but the customer logos, production labels, and renewal evidence are thin. That means the chapter can support a conclusion that real adoption exists, but not a conclusion that production adoption is already broad or repeatable across many accounts.
  claimRefs:
