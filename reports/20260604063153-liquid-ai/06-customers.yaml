- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Evidence
  - Concentration / dependence risk
  - Impact
  - Diligence path
  rows:
  - - Mercedes follow-on product areas
    - Business Wire says other product areas may be explored
    - Expansion is partner-controlled and contingent on initial launch success
    - Could deepen auto credibility or disappear if launch slips
    - Request joint roadmap and success milestones
  - - Insilico regulated-science fit
    - Private-infrastructure deployment aligns with pharma needs
    - Could over-concentrate proof in one specialist vertical
    - Strong scientific reference but narrow segment breadth
    - Request other regulated-science references
  - - Developer funnel to paid enterprise
    - HF, docs, community, Apollo, and playground ease trial
    - Unknown conversion rate from interest to contracts
    - Broad awareness may not translate into durable revenue
    - Request funnel conversion and cohort data
  - - Direct-sales custom motion
    - Pricing and enterprise pages route bigger customers to sales
    - Few large deals can dominate narrative and revenue
    - High ACV upside but concentration risk
    - Request top-account revenue share and pipeline mix
  - - Hardware / partner ecosystem
    - AMD plus flagship counterparties shape delivery story
    - Delays or reprioritization by a few partners could weaken proof quickly
    - Narrative and deployment economics are ecosystem-sensitive
    - Request partner dependency map and contingency plans
  notes: Expansion opportunities are real but visibly partner-mediated. The biggest public gap is the lack of segment-level revenue mix or concentration data needed to quantify downside.
