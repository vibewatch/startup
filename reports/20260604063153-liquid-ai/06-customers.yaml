chapter:
  number: 6
  title: Customers
  summary: Liquid AI can show real market pull through two named counterparties—Mercedes-Benz and Insilico Medicine—plus several anonymized vertical case studies, but the public customer ledger is still thin on breadth, retention, and concentration data. The strongest current proof is Insilico's available-now private deployment, while Mercedes is the highest-quality logo but still a pre-production milestone as of 2026-06-04; accordingly, the customer chapter supports real adoption potential, not yet broad durability at scale.
sections:
- id: segmentation-surface
  title: Segmentation and the shape of the public customer surface
  body: |-
    Liquid's public customer surface is broad in target-sector terms but narrow in disclosed-account terms. The company explicitly markets to enterprises, automakers, financial institutions, ecommerce operators, healthcare and life-sciences teams, industrial users, startups, and developers. That breadth matters because it suggests Liquid is selling a flexible deployment and customization capability rather than a single-purpose application. The likely buyers also differ by motion: platform teams and CTOs in enterprise, OEM software organizations in automotive, risk and fraud teams in financial services, merchandising or search teams in ecommerce, and scientists in regulated pharma workflows.

    Yet the public evidence of who actually pays is much thinner than the segmentation story. Liquid does not disclose customer count, paid-account count, revenue mix by segment, or a named enterprise logo wall comparable to more mature application vendors. Instead, the company offers a hybrid surface: direct sales pages for custom enterprise work, free or low-friction evaluation via community resources, and a small set of named or anonymized deployment stories. That means the segmentation narrative is credible as TAM framing, but still incomplete as proof of scaled adoption.
