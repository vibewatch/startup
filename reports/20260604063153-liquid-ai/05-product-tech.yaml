chapter:
  number: 5
  title: Product & Technology
  summary: |-
    Liquid AI's product stack now spans the core LFM model family, the LEAP customization and deployment
    platform, and the Apollo on-device app, with public support for text, vision-language, audio, and
    nano models plus packaging across GGUF, MLX, and ONNX. The strongest public proof is around edge and
    private deployment—especially AMD laptop support, Mercedes in-car intelligence, and Insilico's private
    scientific deployment—while the main diligence gaps remain around public trust/compliance detail,
    exact LEAP internals, and measured commercial adoption of the platform itself.
sections:
- id: product-stack
  title: Product stack, model family, and buyer-facing surfaces
  body: |-
    Liquid is no longer just a research story; the public stack now has three visible product layers. First, the company exposes Liquid Foundation Models themselves, including text, vision-language, audio, and nano variants. Second, it exposes LEAP as the workflow that helps developers customize and deploy those models. Third, it exposes Apollo as a consumer-friendly, cloud-free mobile surface that demonstrates on-device intelligence without requiring an enterprise contract. The about page, models page, docs, and community page all reinforce this stack shape.

    The module map also shows Liquid optimizing for deployment reality rather than only benchmark marketing. Public docs emphasize GGUF, MLX, and ONNX packaging, trainability for several checkpoints, and compatibility with widely used runtimes such as Transformers, llama.cpp, vLLM, MLX, and Ollama. That makes the product more legible to developers and platform teams evaluating whether Liquid is a closed black box or a portable model family. The main caveat is that buyer-facing packaging is much clearer than commercial adoption of LEAP itself: the public site explains what to try and where to download, but it does not disclose how many enterprise customers have actually standardized on the platform.
