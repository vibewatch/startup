  evidenceGaps:
  - type: missing-source
    severity: material
    topic: trust-surface-detail
    missingEvidence: Public audit artifacts such as a trust-center packet, independent certification scope, security whitepaper, or detailed governance documentation for LEAP.
    whyItMatters: Liquid is selling into automotive, finance, and regulated science; without third-party trust detail, the buyer still relies mostly on Liquid's own marketing and legal framing.
    diligencePath: Request a trust-center export, security architecture review, audit scope summary, and documented model-governance controls for local and hybrid deployment paths.
    relatedQuestionRefs:
    - QE022
  - type: private-evidence-only
    severity: material
    topic: deployment-metrics
    missingEvidence: Customer-level production metrics for Mercedes and Insilico, including active endpoints, latency, uptime, usage volume, and post-launch retention.
    whyItMatters: The strongest public deployment references still lack the operational metrics needed to translate partnership headlines into underwriteable product maturity.
    diligencePath: Request deployment scorecards, reference calls, and milestone-based KPI reporting from both counterparties or from Liquid under NDA.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: leap-commercial-adoption
    missingEvidence: Paid LEAP customer count, active enterprise deployments, conversion from community downloads to contracts, and support / retention metrics for the platform itself.
    whyItMatters: LEAP is the bridge from checkpoint downloads to recurring product value, but public materials do not reveal whether it is already a scaled commercial platform.
    diligencePath: Ask for LEAP customer count, ARR contribution, active device count, and a cohort view of evaluation-to-production conversion.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: leap-internals
    missingEvidence: A technical paper or engineering note describing LEAP's scheduler, compiler, runtime orchestration, and benchmarking methodology beyond marketing language.
    whyItMatters: The platform is central to Liquid's monetization thesis, yet one third-party mention of llama.cpp is not enough to understand implementation depth or defensibility.
    diligencePath: Request a detailed architecture review, benchmark methodology package, and component inventory for LEAP under NDA or in a customer engineering briefing.
    relatedQuestionRefs:
    - QE025
