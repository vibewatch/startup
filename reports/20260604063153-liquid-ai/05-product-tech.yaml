- id: trust-controls
  title: Trust, privacy, licensing, and quality controls
  body: |-
    Liquid's trust posture is built more around deployment control and commercial rules than around a mature public compliance surface. The strongest public trust claims are operational: no first-party hosted API, enterprise local access behind the customer firewall, Apollo marketed as cloud-free and offline, and AMD-backed language around zero dependency on cloud APIs. Those claims align with the company's edge and sovereign-AI positioning. In practice, they should appeal most to buyers that are explicitly optimizing for privacy, latency, and local control rather than to buyers who want a frictionless hosted API.

    The legal surface is also unusually important. Liquid's LFM Open License is permissive in many ways, but it ends free commercial rights above a $10 million revenue threshold and forces larger companies into negotiated commercial licensing. That may be an intelligent funnel design—free for small builders, monetized for enterprises—but it also means product adoption is partly gated by sales and legal negotiation. The weakest area is third-party trust evidence. Public sources do not give a robust trust center, audit report, published incident history, or detailed LEAP governance material beyond marketing and licensing. For a company selling into automotive, finance, and regulated science, that gap is material.
  claimRefs:
  - CE008
  - CE009
  - CE013
  - CE022
  - CE023
  - CE028
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: roadmap-proof
  title: Roadmap, real-world proof, and product risk
  body: |-
    The most convincing public product proof is not benchmarking alone; it is the set of deployment-adjacent partnerships and case studies. Liquid now has three distinct external proof points. First, Mercedes-Benz gives Liquid a flagship automotive path to production in the second half of 2026. Second, Insilico Medicine gives Liquid a present-tense private-infrastructure deployment story in drug discovery. Third, the case-studies page shows multiple vertical outcome claims across automotive, fraud, ecommerce, and synthetic video generation. Together, those signals suggest the company is trying to move from model vendor to domain-specific solution partner.

    But the roadmap is still easier to see than to underwrite. Funding and launch materials show continued investment in edge and on-prem readiness, and the about page advertises a cadence of LFM2.5 releases in 2026. Yet public customer metrics remain thin, LEAP commercial adoption is opaque, and some of the boldest outcome claims still come from unnamed case studies. Independent coverage also captured real technical caveats around coding, precise numerics, and time-sensitive information. The current conclusion is that Liquid has assembled a credible product stack with partner-backed deployment evidence, but not yet a public operating record that fully de-risks enterprise-scale reliability or platform adoption.
