chapter:
  number: 3
  title: Competitors
  summary: Liquid AI competes less as a generic chat vendor than as an efficient, private-deployment alternative
    to hosted API labs and enterprise workflow platforms. The strongest substitutes come from transparent
    hosted APIs, open-weight small-model stacks, and platform incumbents that already own enterprise distribution.
sections:
- id: landscape-and-direct-peers
  title: Landscape and direct-peer set
  body: 'Liquid AI does not compete in one monolithic foundation-model bucket. Its own pages repeatedly
    stress efficient deployment in compute-constrained environments, while rivals split into several buyer-facing
    clusters: closed hosted API leaders such as OpenAI, Anthropic, and Google; efficient-enterprise model
    vendors such as Mistral, Cohere, AI21, Writer, Microsoft Phi, and xAI; and hardware-adjacent or open-weight
    substitutes such as Meta Llama and Qualcomm-centered device workflows. That matters because Liquid’s
    strongest overlap is not just with the biggest chat interfaces, but with vendors offering privacy,
    customization, or enterprise control. The resulting landscape is broad, but it is still legible: Liquid
    is trying to win where buyers value deployment flexibility, low latency, and local control more than
    generic public-API ubiquity. In practice, that means procurement teams are comparing Liquid to both model
    labs and platform choices, not only to one named benchmark leader. The direct-peer set should therefore
    be defined by buyer job-to-be-done and deployment constraints, not by branding alone.'
