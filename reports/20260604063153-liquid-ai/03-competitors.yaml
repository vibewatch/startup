- id: distribution-substitutes-and-multi-homing
  title: Distribution, substitutes, and multi-homing
  body: 'Distribution is where Liquid is most structurally different from frontier API labs. OpenAI, Google,
    Microsoft, and xAI benefit from public APIs, massive existing ecosystems, or platform bundles. Writer
    and Cohere pursue trusted-enterprise routes through workflow software and governance. Liquid instead
    appears to be building distribution through embedded-device, hardware, and domain partnerships: AMD
    for PC-class on-device acceleration and Mercedes-Benz for in-car intelligence. Qualcomm and other
    on-device stacks also act as substitutes because they can host many smaller or open models without
    requiring Liquid’s full commercial stack. That leaves buyer multi-homing high. A customer can use
    one hosted API for generic workloads, open weights for private tasks, and still test Liquid where
    low-latency edge deployment matters. Liquid’s moat therefore depends on making those edge deployments
    materially better, not merely possible. Distribution power will come from repeatable partner-led landings,
    reference deployments, and proof that Liquid can integrate faster or run cheaper on constrained hardware
    than generic alternatives can.'
  claimRefs:
  - CP022
  - CP024
  - CP025
  - CP026
  - CP027
  - CP028
  - CP034
  - CP035
  - CP036
  tableRefs:
