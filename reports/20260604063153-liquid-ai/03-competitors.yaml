- id: capability-and-pricing-comparison
  title: Capability and pricing comparison
  body: The cleanest competitive split shows up in product packaging and pricing transparency. OpenAI,
    Anthropic, and Google all publish token or tool pricing that a buyer can benchmark directly, and OpenAI
    and Google also emphasize broad multimodal usage. Liquid, by contrast, explicitly says it does not
    run a hosted API of its own; its self-serve routes are a free playground, paid access through OpenRouter,
    and model downloads, while LEAP and enterprise deployments route through sales. Meta, Microsoft, and
    AI21 expand the substitute set further by pairing downloadable or open models with enterprise-friendly
    positioning. Writer, Cohere, and Mistral compete more on governed enterprise workflows than on pure
    consumer chat scale. The practical implication is that Liquid competes as much on packaging and deployment
    architecture as on raw model quality. Buyers evaluating total cost of ownership may like Liquid’s design,
    but they still see much clearer list prices from hosted rivals. That asymmetry can slow evaluation unless
    Liquid provides custom benchmark or pilot evidence quickly in the sales cycle.
