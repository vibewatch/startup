    - Liquid differentiates when its models perform better on constrained hardware
  - - Embedded vertical solution
    - Automotive or pharma specialists
    - Outcome-focused buying rather than generic model shopping
    - Could reduce the need for Liquid if a vertical partner standardizes elsewhere
    - Liquid already shows early proof in automotive-like deployments
  notes: These are substitute procurement patterns rather than mutually exclusive competitors; many buyers
