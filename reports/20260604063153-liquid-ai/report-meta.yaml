  foundingLocation: Cambridge, Massachusetts
  headquarters: Cambridge, Massachusetts
  productSummary: |
    Liquid sells a stack built around Liquid Foundation Models, LEAP for model customization and deployment, and Apollo
    as a local consumer demo surface. The public product story emphasizes efficient multimodal inference, downloadable
    checkpoints, enterprise local licensing, and deployment across CPU, GPU, and NPU hardware rather than reliance on a
    first-party hosted API.
  customerFocus: Enterprises and developers in automotive, financial services, ecommerce, biotechnology, consumer electronics, and other latency-, privacy-, and deployment-sensitive environments.
  businessModel: Sales-led enterprise licensing, customization, and deployment of LFMs through LEAP and local/on-premise access; open/downloadable distribution for smaller builders with negotiated commercial licensing above the public revenue threshold.
  stage: series-a
  fundingStatus: $46.6M seed (Dec. 2023) plus AMD-led $250M Series A (Dec. 2024); a founder biography later cites a $2.3B valuation.
