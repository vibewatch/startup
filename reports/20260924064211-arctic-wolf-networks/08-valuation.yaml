    - Customer growth persists and AI-led operations improve efficiency
    - Multiple could stay elevated
    - Fresh public metrics and margin improvement
  - - Base
    - Company keeps scaling but remains opaque
    - Valuation remains supported but not re-rated
    - A newer financing mark or public listing
  - - Bear
    - Competition compresses margins and growth slows
    - Multiple resets lower
    - Evidence of support friction or slower bookings
