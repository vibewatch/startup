- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Packaging question
  - Arctic Wolf implication
  - Competitive implication
  rows:
  - - Is it modular?
    - Yes, but the public bundle remains opaque
    - Broader suites can price by seat or module
  - - Is it self-serve?
    - No, service-led deployment matters
    - Self-serve security tools are easier to evaluate
  - - Is it enterprise-grade?
    - Yes, with managed service overhead
    - Enterprise buyers compare trust and SLAs
  - - Is it commodity-priced?
    - No clear evidence suggests commodity pricing
    - Buyers must price outcomes and support
  notes: The table is a synthesis from public product and review evidence; exact prices are not disclosed.
