figures:
- id: FP001
  title: Competitive positioning map
  type: quadrant
  layout: wide
  summary: 'Arctic Wolf sits in the middle of the security-operations battlefield: stronger on service than point tools, but
    less platform-broad than the largest suites.'
  data:
    xAxis: Platform breadth / bundle power
    yAxis: Service depth / concierge operations
    points:
    - label: Arctic Wolf
      x: 7
      y: 8
      detail: Service-led MDR platform with AI messaging and strong customer-trust emphasis.
    - label: Bundled suite vendors
      x: 9
      y: 6
      detail: Very broad product portfolios with some managed features.
    - label: MSSPs
      x: 5
      y: 7
      detail: Operational depth can be strong, but breadth is narrower.
    - label: Internal SOC
      x: 4
      y: 4
      detail: High control but high staffing burden and slower scaling.
    - label: Point tools
      x: 6
      y: 3
      detail: Featureful but not usually a full managed operations layer.
    - label: Security awareness vendors
      x: 5
      y: 4
      detail: Adjacent tools can expand into the same buyer budget.
  approximationNotes: Axis placement is ordinal and reflects qualitative judgment from public evidence rather than measured
    share or scoring data.
