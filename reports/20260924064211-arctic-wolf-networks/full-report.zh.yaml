  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开客户证据呈现出一条常见路径：发现需求、评估服务、完成集成、部署，再借助相邻模块和合作伙伴扩展。
    data:
      nodes:
        - id: n1
          label: 需求识别
          description: 安全负责人面临告警过载、人员紧张或覆盖缺口
        - id: n2
          label: 厂商评估
          description: 奖项、Gartner 评价和合作伙伴背书影响入围名单
        - id: n3
          label: 集成与上线
          description: 文档、OEM 支持和合作伙伴准备度很关键
        - id: n4
          label: 托管运营
          description: 开始 24x7 监控与分流
        - id: n5
          label: 扩展
          description: 风险、云、安全意识和相邻模块提升客户支出份额
        - id: n6
          label: 扩展 / 续约
          description: 客户续约、增加模块，并延伸至相邻工作流
    approximationNotes: 这张旅程图根据公开佐证和公司的服务叙事，归纳出一套工作流。
