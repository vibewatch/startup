        - label: 托管风险 / 相邻模块
          value: 15
          detail: 加售与捆绑扩展
        - label: 事件响应 / 服务
          value: 10
          detail: 项目和支持收入
        - label: 合作伙伴 / 渠道贡献
          value: 15
