          x: 5
          'y': 7
          detail: 运营深度可能很强，但覆盖面较窄。
        - label: 内部 SOC
          x: 4
          'y': 4
          detail: 控制力强，但人员负担重、扩张更慢。
        - label: 单点工具
          x: 6
          'y': 3
          detail: 功能丰富，但通常没有完整的托管运营服务。
        - label: 安全意识厂商
          x: 5
          'y': 4
          detail: 相邻工具可能进入同一买家的预算范围。
    approximationNotes: 坐标位置按顺序关系排列，反映基于公开证据的定性判断，而非经过测量的份额或评分数据。
    claimRefs:
