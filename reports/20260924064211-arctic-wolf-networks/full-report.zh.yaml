figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 从 2012 年创立到 2026 年商业领导层调整，公开时间线显示公司稳步扩张、持续融资并拓展产品。
    data:
      items:
        - date: '2012'
          label: 公司创立
          detail: Brian NeSmith 和 Kim Tremblay 创立 Arctic Wolf，开展安全运营业务。
          tone: positive
        - date: 2018-10
          label: C 轮融资
          detail: Arctic Wolf 宣布融资 $45M，用于加速增长并扩充团队。
          tone: positive
        - date: 2020-10
          label: E 轮融资
          detail: 公司以 $1.3B 估值融资 $200M，并将总部迁至 Eden Prairie。
          tone: positive
        - date: 2021-07
          label: F 轮融资
          detail: Arctic Wolf 宣布以 $4.3B 估值融资 $150M。
          tone: positive
        - date: 2021-12
          label: 客户与产品认可
          detail: 各类奖项和产品认可凸显市场牵引力。
          tone: positive
        - date: 2022-10
          label: 增长融资仍然可观
          detail: 第三方报道提及大额追加融资和债务融资额度。
          tone: neutral
        - date: 2024-12
          label: 客户与平台扩张
          detail: 公开材料持续强调平台广度和渠道规模。
          tone: positive
        - date: 2026-03
          label: Will May 任 CRO
          detail: 公司进入下一阶段增长期，同时更新商业团队领导层。
          tone: neutral
        - date: 2026-04
          label: Gartner 认可
          detail: Arctic Wolf 对外宣传其获得 2026 年 Customers' Choice 认可。
          tone: positive
    approximationNotes: null
    claimRefs:
      - CO003
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO011
      - CO012
  - id: FM001
    title: 市场规模金字塔
    type: pyramid
    summary: 安全运营需求层次分明：上层是广义安全支出，中层是 MDR 和托管风险，下层才是 Arctic Wolf 实际可触达的市场。
    data:
      items:
        - label: 安全预算 / 广义网络安全支出
          value: 100
          detail: 覆盖面最广，包含各类安全工具与服务
        - label: 托管安全运营
          value: 40
          detail: MDR、托管风险及相邻运营服务
        - label: MDR / SOC 即服务
          value: 20
          detail: 与 Arctic Wolf 定位最契合的核心类别
        - label: Arctic Wolf 可触达账户
          value: 10
          detail: 面临人员或工具压力的中型企业和大型企业买家
        - label: AI 辅助运营层
          value: 15
          detail: 公司强调 AI，理论上应能降低服务的人力投入强度
        - label: 采用阻力
          value: 10
          detail: 集成和信任障碍拖慢转化
    approximationNotes: 金字塔只表达定性和顺序关系。数字标签是示意性的规模标记，不是经过审计的市场规模估算。
