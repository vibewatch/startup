      - CO007
      - CO008
      - CO009
  - id: TM001
    title: 市场定义表
    columns:
      - 边界要素
      - 纳入 / 排除
      - 重要原因
    rows:
      - - 纳入
        - MDR、托管风险、云安全、身份及相邻安全运营工作流
        - 这是 Arctic Wolf 希望争取的预算
      - - 排除
        - 纯商品化终端工具、一次性事件响应和通用 IT 服务
        - 这些需求虽相邻，却不属于其核心托管运营业务
      - - 替代方案
        - 内部 SOC、以 SIEM 为核心的项目和平台套件
        - 它们争夺同一安全预算
      - - 买方
        - 中端市场和企业安全负责人
        - 人手紧张、告警噪声过多，最让这些团队头疼
      - - 付款方
        - 安全 / IT 预算负责人
        - 通常由安全运营负责人审批
    enumerationScope:
      coverage: partial
      basis: >-
        Public company messaging, recognition pages, and current-run threat/market materials that define the operational
        security category.
    notes: 边界行综合公司定位与第三方验证，不是正式行业分类。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM007
      - CM008
      - CM010
      - CM011
      - CM012
  - id: TM002
    title: TAM / 市场规模测算视角表
    columns:
      - 视角
      - 捕捉内容
      - 证据强度
      - 尽调备注
    rows:
      - - 托管安全运营
        - MDR 和相邻托管服务预算
        - 中
        - 最符合公司当前定位
      - - 安全平台支出
        - 更广泛的 XDR / SIEM / 云安全预算
        - 中
        - 有用，但可能高估可服务份额
      - - 劳动力替代价值
        - 省去内部分析师人力和 SOC 开销所带来的价值
        - 低
        - 需要客户层面的验证和定价数据
      - - 威胁量扩张
        - 持续增长的安全事件量与攻击复杂度
        - 中
        - 能说明需求在增长，却不能直接证明收入增加
    notes: 本表按不同视角拆解市场；现有公开证据不足以支撑一个看似精确的 TAM 数字。
