      - Arctic Wolf 含义
      - 竞争含义
    rows:
      - - 是否模块化？
        - 是，但公开套餐仍不透明
        - 更广泛的套件可按席位或模块定价
      - - 是否支持自助服务？
        - 不支持，服务主导的部署很重要
        - 自助式安全工具更容易评估
      - - 是否达到企业级？
        - 是，但有托管服务成本
        - 企业买家会比较可信度和 SLA
