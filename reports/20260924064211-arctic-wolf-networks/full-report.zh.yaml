  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 风险集中在财务、执行和信任：公司基础可信，但披露尚不完整。
    data:
      columns:
        - 高风险
        - 中风险
        - 较低风险
        - 控制 / 缓释
        - 尽调路径
        - 论点影响
      rows:
        - label: 执行与信任
          values:
            - 24x7 服务质量
            - 客户信任
            - 单一功能工具商品化
            - 人工运营加自动化
            - 索取响应时效 SLA 数据
            - 高
        - label: 资本与估值
          values:
            - 过时的公开估值
            - 增长放缓
            - 近期融资缓冲
            - 跟踪融资与退出时点
            - 索取更新的估值
            - 中高
        - label: 合作伙伴与竞争
          values:
            - 渠道依赖
            - 招聘压力
            - 内部 SOC 替代
            - 合作伙伴管理与产品广度
            - 确认合作伙伴集中度
            - 中
    approximationNotes: 矩阵中的风险等级是基于公开证据的定性判断，不代表发生概率。
    claimRefs:
