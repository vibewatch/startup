  - id: FE001
    title: 产品架构图
    type: stack
    summary: Arctic Wolf 的安全产品栈偏重服务：底层接入客户遥测，中层由团队托管运营，上层叠加 AI 辅助工作流。
    data:
      layers:
        - label: 客户遥测与集成
          detail: 终端、云、身份和运营日志
        - label: 分析与关联
          detail: AI 辅助检测与分流
        - label: 人工分析师 / 专属服务运营
          detail: 24x7 监控与响应
        - label: 模块与加售
          detail: 风险、云、安全意识、暴露面、事件响应
        - label: 合作伙伴 / OEM 分销
          detail: 开发者与嵌入式工作流
        - label: 衡量与报告
          detail: 结果看板、客户报告与管理层可见性
