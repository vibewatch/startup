  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 市场实力支撑跟踪判断，估值则需保持谨慎：业务基础可信，但公开证据仍显陈旧，不足以支持更积极的结论。
    data:
      nodes:
        - id: n1
          label: 市场 / 产品契合度强
          detail: 客户基础庞大，安全运营需求可信
        - id: n2
          label: 财务不透明
          detail: ARR、利润率和留存率仍未披露
        - id: n3
          label: 估值过时
          detail: 最新公开估值来自 2021 年
        - id: n4
          label: 执行风险
          detail: 客户支持负担和竞争压力仍不可忽视
        - id: n5
          label: 建议：跟踪
          detail: 公司本身质地不错，但证据不够新，尚不足以支撑更强判断
        - id: n6
          label: 退出尽调
          detail: 仍缺少公开财务数据和较新的估值参考
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
    approximationNotes: 这套流程是定性的决策树，不是量化估值模型。
