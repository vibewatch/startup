  - CI009
  - CI012
- id: TI002
  title: Pricing / monetization table
  columns:
  - Pricing element
  - Public evidence
  - Implication
  rows:
  - - List price
    - Not public
    - Customers likely buy via quote
  - - Packaging
    - Managed service bundles
    - Harder to compare than self-serve software
  - - Contract length
    - Not public
    - Likely multi-year enterprise style
  - - Expansion motion
    - Module upsell and channel expansion
    - ARPU can grow after land
  - - Discounting
    - Not public
    - Could compress realized margins
  notes: This table reflects the public pricing signal only; exact contract prices and discounting are not disclosed.
  claimRefs:
  - CI001
  - CI002
  - CI007
  - CI009
  - CI012
- id: TI003
  title: Unit economics table
  columns:
  - Dimension
  - Observed / inferred value
  - Confidence
  - Why it matters
  rows:
  - - ARR
    - not publicly disclosed
    - low
    - Primary top-line proxy remains private
  - - Gross margin
    - not publicly disclosed
    - low
    - Needed to judge service intensity
  - - NRR
    - not publicly disclosed
    - low
    - Critical to expansion thesis
  - - CAC payback
    - not publicly disclosed
    - low
    - Would indicate channel efficiency
  - - Capital intensity
    - high
    - medium
    - Service and security-operations models require real people
  - - Funding cushion
    - large
    - medium
    - Reduces near-term financing risk
  notes: Null-style values intentionally represent undisclosed data rather than zero. The table is a diligence scaffold, not
    a published operating statement.
