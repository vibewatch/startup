company:
  name: Arctic Wolf Networks
chapter:
  number: 1
  title: Company Overview
  summary: Arctic Wolf is a scaled private security-operations company with public evidence of strong customer traction, repeated
    financings, and leadership refreshes, but its current private metrics remain partially opaque.
sections:
- id: evidence-base
  title: Evidence base
  body: Arctic Wolf is supported by a mix of official company pages, third-party profiles, and current-run news items. The
    public record is strong on positioning, leadership changes, and launch activity, but it is much thinner on private metrics
    such as margin, retention, and deal-level economics. The chapter therefore separates what is directly stated by Arctic
    Wolf from what is inferred by third-party market sources, and it uses the newest 2026 materials where the company refreshed
    its narrative. This refresh keeps the distinction clear between direct evidence, third-party estimates, and unresolved
    private metrics. It also gives later chapters a stable base so the company story, market story, and valuation story do
    not collapse into the same generic narrative.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: thesis-implications
  title: Thesis implications
  body: 'The pattern across the evidence is consistent: Arctic Wolf looks like a scaled security-operations platform with
    broad customer traction, a mature capital base, and an ongoing AI-led positioning refresh. That combination supports a
    real operating thesis, but it also leaves open the usual private-company diligence questions around current growth quality,
    margin, and the durability of its moat against larger platform vendors. The chapter turns those uncertainties into explicit
    claims and gaps instead of burying them in generic marketing language. This refresh keeps the distinction clear between
    direct evidence, third-party estimates, and unresolved private metrics. It also gives later chapters a stable base so
    the company story, market story, and valuation story do not collapse into the same generic narrative.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  tableRefs:
  - TO002
- id: gaps-and-diligence
  title: Gaps and diligence path
  body: Where the public record stops, the report uses evidence gaps rather than guesses. This is especially important for
    current ARR, gross margin, NRR, debt terms, and headcount trend, which remain only partially observable in public sources.
    The chapter keeps those unknowns visible so later sections can reuse the same grounded fact pattern without over-claiming
    certainty. This refresh keeps the distinction clear between direct evidence, third-party estimates, and unresolved private
    metrics. It also gives later chapters a stable base so the company story, market story, and valuation story do not collapse
    into the same generic narrative.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  tableRefs:
  - TO003
