figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      From 2012 founding through 2026 leadership refresh, the public timeline shows steady scale, repeated financing,
      and product expansion.
    data:
      items:
        - date: '2012'
          label: Company founded
          detail: Brian NeSmith and Kim Tremblay launch Arctic Wolf as a security-operations business.
          tone: positive
        - date: 2018-10
          label: Series C funding
          detail: Arctic Wolf announces $45M to accelerate growth and expand the team.
          tone: positive
        - date: 2020-10
          label: Series E funding
          detail: The company raises $200M at a $1.3B valuation and relocates headquarters to Eden Prairie.
          tone: positive
        - date: 2021-07
          label: Series F funding
          detail: Arctic Wolf announces $150M at a $4.3B valuation.
          tone: positive
        - date: 2021-12
          label: Customer and product recognition
          detail: Awards and product recognition underscore market traction.
          tone: positive
        - date: 2022-10
