              The pattern across the evidence is consistent: Arctic Wolf looks like a scaled security-operations
              platform with broad customer traction, a mature capital base, and an ongoing AI-led positioning refresh.
              That combination supports a real operating thesis, but it also leaves open the usual private-company
              diligence questions around current growth quality, margin, and the durability of its moat against larger
              platform vendors. The chapter turns those uncertainties into explicit claims and gaps instead of burying
              them in generic marketing language. This refresh keeps the distinction clear between direct evidence,
              third-party estimates, and unresolved private metrics. It also gives later chapters a stable base so the
              company story, market story, and valuation story do not collapse into the same generic narrative.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
      - number: '8.3'
        title: Gaps and diligence path
        blocks:
          - type: paragraph
            body: >-
              Where the public record stops, the report uses evidence gaps rather than guesses. This is especially
              important for current ARR, gross margin, NRR, debt terms, and headcount trend, which remain only partially
              observable in public sources. The chapter keeps those unknowns visible so later sections can reuse the
              same grounded fact pattern without over-claiming certainty. This refresh keeps the distinction clear
              between direct evidence, third-party estimates, and unresolved private metrics. It also gives later
              chapters a stable base so the company story, market story, and valuation story do not collapse into the
              same generic narrative.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
