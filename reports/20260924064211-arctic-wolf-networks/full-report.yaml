companyProfile:
  summary: >-
    Arctic Wolf Networks is a late-stage private cybersecurity company that delivers managed security operations, MDR,
    managed risk, cloud security, and adjacent services through a concierge-style operating model. The company was
    founded in 2012, remains headquartered in Eden Prairie, Minnesota, and continues to expand through AI-led messaging,
    partner motions, and a broad customer proof stack. Public evidence shows large historical funding rounds, a 2026
    commercial leadership refresh, and a current installed base that the company says exceeds 10,000 customers, but the
    private metrics needed for precise underwriting are still not disclosed.
  foundedDate: '2012-01-01'
