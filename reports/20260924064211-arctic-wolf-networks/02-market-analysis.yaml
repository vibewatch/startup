- id: FM001
  title: Market sizing pyramid
  type: pyramid
  summary: 'Security-operations demand appears layered: broad security spend at the top, MDR and managed risk in the middle,
    and Arctic Wolf''s actual addressable slice at the bottom.'
  data:
    items:
    - label: Security budget / broad cyber spend
      value: 100
      detail: Broadest category; includes all security tooling and services
    - label: Managed security operations
      value: 40
      detail: MDR, managed risk, and adjacent operational services
    - label: MDR / SOC-as-a-service
      value: 20
      detail: Core category most aligned to Arctic Wolf positioning
    - label: Arctic Wolf addressable accounts
      value: 10
      detail: Mid-market and enterprise buyers with strong staffing or tooling pain
    - label: AI-assisted operations layer
      value: 15
      detail: Public messaging around AI should lower labor intensity
    - label: Adoption friction
      value: 10
      detail: Integration and trust hurdles slow conversion
  approximationNotes: The pyramid is qualitative and ordinal. The numeric labels are illustrative scale markers, not audited
    market-size estimates.
