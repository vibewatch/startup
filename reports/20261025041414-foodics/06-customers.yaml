company:
  name: Foodics
chapter:
  number: 6
  title: Customers
  summary: Foodics has credible evidence of broad restaurant adoption and expanding transaction activity, but the public record is weighted toward company claims and media reporting rather than independently verified retention or customer economics. Named customer references demonstrate use cases, not necessarily production depth, renewal, or account value.
sections:
  - id: customer-segmentation
    title: Customer base and operating jobs
    body: >-
      Foodics targets food-and-beverage operators that need a combined point-of-sale and
      restaurant-management workflow rather than a standalone payments terminal. Its official
      surface describes orders, payments, inventory, front-of-house and kitchen coordination,
      customer loyalty, application integrations, and online ordering in one cloud system. The
      available external descriptions place the customer base across small cafes, larger
      restaurant chains, dine-in, delivery, and cloud-kitchen models, with operations spanning
      several MENA markets. The buyer is likely the restaurant operator or owner, while staff
      are the day-to-day users and payments or working-capital products create an additional
      financial-services relationship. Public evidence does not disclose revenue by segment,
      payer mix, or customer concentration.
    claimRefs: [CU001, CU002, CU004, CU012]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and transaction trajectory
    body: >-
      The strongest current adoption evidence is a reported H1 2025 operating snapshot, not an
      audited customer cohort. Menabytes and Entarabi both report more than 33,500 active
      restaurant branches, 23% year-over-year growth, $6 billion of GMV, and accelerating use of
      embedded payments and financial services. Menabytes separately reports 38% payment-volume
      growth, 29% ARR growth, and 56% international-revenue growth. These measures indicate
      increasing activity on the platform, but they mix branches, GMV, payment volume, ARR, and
      revenue; they cannot be converted into retention, average revenue per account, or
      engagement without denominators and cohort definitions. A Wamda report gives a nearby 2024
      reference point of more than 33,000 restaurants and over $10 billion annual GMV, but the
      differing period and measure should not be treated as a direct reconciliation.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU015]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named customer proof and adoption journey
    body: >-
      Foodics publishes named testimonials from 7Ribs, Koobs Cafe, Mazaj Maghrebi, Chef's
      Restaurant, Food Gate Co., and Shams. The statements describe operational use such as
      inventory, analytics, branch coordination, monitoring, ease of use, and support response,
      which is stronger than an unqualified logo wall but remains company-published evidence.
      The Stanford case study adds independent context: integrating digital menus with existing
      point-of-sale systems required navigating proprietary platforms, local rules, city-level
      business practices, local expertise, and a substantial field-sales organization. The
      evidence therefore supports a journey from workflow replacement to multi-location
      operations, while leaving production duration, quantified outcomes, renewal, and expansion
      unverified for each named account.
    claimRefs: [CU003, CU013]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration limits
    body: >-
      Foodics appears positioned for expansion through a broader restaurant operating system:
      customers can add payments, loyalty, application integrations, analytics, and financial
      services to the core POS workflow. The reported payment and international-revenue growth
      is consistent with cross-sell or geographic expansion, but the public sources do not
      identify the mechanism, customer-level attach rates, contract lengths, churn, GRR, NRR,
      renewal cohorts, or the share of revenue from the largest customers. The platform's
      regional footprint and multi-country operating model may diversify demand, yet the Stanford
      evidence also shows localization and integration complexity that can raise implementation
      and procurement friction. A diligence decision should therefore treat adoption breadth as
      credible but durability and concentration as open questions until cohort and account-level
      data are supplied.
    claimRefs: [CU002, CU009, CU010, CU013]
