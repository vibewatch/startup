  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: Customer-level gross retention, net retention, churn, renewal cohorts, and contract duration by segment and geography.
      whyItMatters: Adoption and transaction growth do not establish durable recurring revenue or reveal whether growth is driven by new accounts, expansion, or replacement.
      diligencePath: Request cohort-level retention schedules, logo churn, revenue churn, renewal terms, and expansion data for the last three fiscal years.
      relatedQuestionRefs: [QU005, QU008]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Largest-customer revenue and GMV shares, customer concentration by country and vertical, and channel or partner dependence.
      whyItMatters: Broad branch counts can coexist with material exposure to a small number of chains, geographies, or distribution relationships.
      diligencePath: Obtain anonymized customer concentration tables, top-account contracts, channel-sourced bookings, and country-level revenue and GMV splits.
      relatedQuestionRefs: [QU006, QU008]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: Independent confirmation of the production status, deployment scale, outcomes, and current relationship for named customer references.
      whyItMatters: Company-published testimonials establish claimed use cases but do not independently verify active deployment, realized benefits, or renewal.
      diligencePath: Seek permissioned customer references, procurement records, implementation dates, and independently measured before-and-after operating outcomes.
      relatedQuestionRefs: [QU004]
      relatedTableRefs: [TU003]
    - type: conflicting-data
      severity: minor
      topic: customer-count
      missingEvidence: A reconciled definition and time series for restaurants, active branches, accounts, and locations.
      whyItMatters: Wamda reports more than 33,000 restaurants in 2024 while H1 2025 media reports more than 33,500 active branches; the units and periods differ.
      diligencePath: Reconcile customer master data, active-account definitions, branch counts, and the denominator used for growth reporting.
      relatedQuestionRefs: [QU002, QU003]
  acknowledgedWarnings:
    - dimension: tableNotes
      reason: "The three tables include explicit notes describing company-claimed evidence, partial coverage, mixed units, and missing denominators so readers are not given false precision."
