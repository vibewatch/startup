      - [Active-branch growth, "23% YoY", "H1 2025", "Menabytes and Entarabi media reports", medium, "Indicates expansion versus H1 2024", "Starting base and gross adds versus churn"]
      - [Platform GMV, "$6 billion", "H1 2025", "Menabytes and Entarabi media reports", medium, "Shows transaction scale", "GMV composition, take rate, and customer-level distribution"]
      - [Payment-volume growth, "38%", "H1 2025", "Menabytes report", medium, "Supports increasing payments adoption", "Payment-volume base, mix, and attach rate"]
      - [ARR growth, "29%", "H1 2025", "Menabytes and Entarabi media reports", medium, "Supports recurring-revenue momentum", "ARR definition, cohort bridge, and audited revenue"]
      - [International-revenue growth, "56%", "H1 2025", "Menabytes and Entarabi media reports", medium, "Supports geographic expansion", "Country mix, currency basis, and absolute revenue"]
    notes: These are reported operating metrics from media coverage, not audited customer cohorts; GMV, payment volume, ARR, revenue, branches, and restaurants are different units and should not be combined into a single funnel.
    claimRefs: [CU006, CU007, CU008, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns: [customer, segment, deployment/use case, production vs pilot, outcome, limitation]
    rows:
      - [7Ribs, "Restaurant", "Cloud POS and restaurant-management workflow", "Company-published testimonial; production status not independently verified", "Says Foodics has more features and is easy to use with good support", "No dates, scale, quantified outcome, or renewal evidence"]
      - [Koobs Cafe, "Cafe", "Cost, inventory, and analytics workflows", "Company-published testimonial; production status not independently verified", "Says Foodics addressed needs not met by prior systems", "No baseline metrics or independent confirmation"]
      - [Mazaj Maghrebi, "Restaurant group", "Connection of activity centers or branches in one platform", "Company-published testimonial; production status not independently verified", "Values quick technical-support response", "No branch count, deployment date, or retention evidence"]
      - ["Chef's Restaurant", "Restaurant", "Cloud POS and technical support", "Company-published testimonial; production status not independently verified", "Praises professionalism and technical support", "No operating metric or procurement record"]
      - [Food Gate Co., "Restaurant operator", "Cloud POS interface and navigation", "Company-published testimonial; production status not independently verified", "Describes a usable interface", "No quantified productivity or renewal evidence"]
      - [Shams, "Restaurant operator", "Branch monitoring and management", "Company-published testimonial; production status not independently verified", "Reports efficient branch management and responsive after-sales service", "No account scale, outcome measure, or independent corroboration"]
    notes: Partial sample of named testimonials visible on the official Foodics site, not an exhaustive customer registry; all rows require independent reference checks for production status and durability.
    enumerationScope:
      coverage: sample
      basis: Six named testimonials shown on the official Foodics website, sampled from the public customer-proof surface and not a complete customer registry.
    claimRefs: [CU003, CU013]
figures:
  - id: FU001
    title: Customer journey from workflow replacement to expansion
    type: journey-map
    summary: Public evidence supports a journey from core restaurant workflow digitization toward multi-location operations, payments, analytics, and financial-services expansion, with retention proof still missing.
    data:
      nodes:
        - id: discovery
          label: "Workflow replacement"
          touchpoints: "Replace manual or fragmented restaurant workflows with cloud POS, digital menus, orders, and payments."
          detail: "Core job is operational digitization; adoption depth is not quantified."
        - id: deployment
          label: "Operational deployment"
          touchpoints: "Connect front-of-house, kitchen, inventory, reporting, and branch activity."
          detail: "Stanford case evidence highlights integration and localization hurdles."
        - id: daily-use
          label: "Daily operating loop"
          touchpoints: "Monitor sales, inventory, customer activity, loyalty, and online-order workflows."
          detail: "Official testimonials describe use cases but not independently measured outcomes."
        - id: multi-location
          label: "Multi-location oversight"
          touchpoints: "Use cloud access and analytics to oversee multiple branches or restaurant formats."
          detail: "Public sources describe multi-market and multi-format reach without account-level data."
        - id: payments
          label: "Payments and financial services"
          touchpoints: "Add digital payments, settlements, lending, and cash-flow tools around the operating system."
          detail: "H1 2025 reporting shows payment-volume growth but not attach rates."
        - id: expansion
          label: "Expansion and retention"
          touchpoints: "Expand across locations, countries, and products if value is proven."
          detail: "NRR, GRR, churn, renewal, and concentration remain unresolved."
    claimRefs: [CU002, CU009, CU010, CU013]
callouts:
  - calloutType: strength
    title: Broad adoption signal
    body: Reported active-branch, GMV, payment-volume, ARR, and international-revenue growth indicate meaningful operating scale and increasing platform activity, although the metrics are not an audited cohort view.
    claimRefs: [CU006, CU008, CU009, CU010]
  - calloutType: risk
    title: Durability is not publicly proven
    body: Neither the named testimonials nor the reported growth metrics disclose churn, renewal, GRR, NRR, contract duration, account concentration, or customer-level expansion.
    claimRefs: [CU003, CU011, CU013]
