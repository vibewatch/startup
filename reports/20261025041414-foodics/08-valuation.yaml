      - [Fintech monetization, "29% ARR growth and 38% payment-volume growth reported for H1 2025", "Take rate, gross margin, and contribution profit"]
      - [Capital access, "$170m latest reported round; Kamco stake disclosed without terms", "Term sheet, ownership, preference stack, and implied valuation"]
      - [Competitive pressure, "A competitor comparison alleges cost, complexity, and enterprise-orientation limitations", "Independent win/loss, churn, and pricing data"]
      - [IPO option, "Coverage reports a planned Tadawul path within 2–3 years", "Formal mandate, audited reporting, approvals, and filing"]
    notes: "The competitor comparison is directional and issuer-interested; it is not an independent benchmark or proof of customer churn."
    claimRefs: [CV001, CV004, CV007, CV008, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "ARR growth persists; fintech adoption compounds; controls support IPO readiness", "Potential re-rating, but no numeric target without revenue and valuation inputs", "Lower probability until audited evidence", "Regulatory or credit event"]
      - [Base, "Core SaaS and payments grow; financing monetization is gradual; private status continues", "Track at an unknown stance; require a price and denominator before entry", "Most supportable on current evidence", "Retention or margin deterioration"]
      - [Bear, "Competition compresses pricing; lending losses or approvals constrain expansion", "Down-round or prolonged illiquidity risk; no defendable recovery value yet", "Material downside remains plausible", "Unreserved losses or delayed IPO"]
      - [Diligence case, "Term sheet, audited accounts, cohorts, take rate, and lending vintages become available", "Re-underwrite with SaaS/fintech blended method and sensitivity table", "Decision contingent on documents", "Missing documents persist"]
    notes: "Scenarios are qualitative because public sources do not provide Foodics revenue, margin, retention, valuation, or lending-loss denominators."
    claimRefs: [CV005, CV011, CV012, CV013, CV014]
