company:
  name: Foodics
chapter:
  number: 8
  title: Valuation
  summary: Foodics has credible scale, embedded payments momentum, and a reported $170 million financing history, but public evidence does not disclose a current valuation, revenue base, margins, or cap-table terms. The evidence therefore supports a price-disciplined track decision rather than a buy recommendation.
sections:
  - id: investment-view
    title: Investment view and entry discipline
    body: >-
      Foodics combines restaurant operating software with payments and financing, creating a plausible
      platform expansion path beyond point-of-sale subscriptions. Public reporting describes more than
      33,000 restaurants and over $10 billion of 2024 GMV, while H1 2025 reporting cites 33,500 active
      branches, $6 billion of GMV, 29% ARR growth, and 56% international-revenue growth. Those figures
      indicate operating momentum, but GMV is not revenue and ARR is not a disclosed audited revenue
      statement. The latest reported financing was $170 million led by Prosus and Sanabil; the Kamco
      transaction disclosed an acquired stake but not purchase price, ownership percentage, instrument,
      or implied valuation. Without those terms, a fair or attractive entry price cannot be tested.
      The appropriate discipline is to track the business and require audited revenue, gross margin,
      net retention, cash generation, financing terms, and a current cap table before underwriting a
      buy. A prospective IPO in two to three years is an investor expectation reported by transaction
      coverage, not a committed listing timetable.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and comparable lens
    body: >-
      The bull thesis is that Foodics can monetize a dense operating data layer through payments,
      embedded lending, open-banking visibility, and enterprise restaurant products. Its job posting
      describes payments, capital, and cash-flow tools operating in a regulated SAMA environment, and
      the Lean partnership describes consolidated bank-account data and performance-based credit scoring.
      A WIPO profile describes Foodics as a cloud-based restaurant-management and point-of-sale system
      with a broad application ecosystem.
      A 2026 product report also describes an automated restaurant-funding offer, indicating continued
      investment in embedded financial services.
      The anti-thesis is that the same expansion increases regulatory, credit, integration, and execution
      risk while public disclosure remains thin.       A competitor-authored comparison alleges high subscription costs, complex setup, add-on pricing,
      and an enterprise-oriented product; these are directional competitor claims rather than verified
      market-wide benchmarks, but they are
      relevant downside signals for retention and pricing power. Toast provides a public-market reference
      point at a $18.90 billion market capitalization in October 2026, yet Foodics has no public revenue
      or valuation denominator that permits a defensible multiple comparison. A comparable set can frame
      diligence, not manufacture a Foodics valuation.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV015, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence asks
    body: >-
      Scenario analysis must remain qualitative until Foodics supplies revenue, margin, retention,
      cash-flow, lending-loss, and capitalization data. The bull case assumes sustained ARR and
      international growth, successful conversion of payments and financing adoption into durable
      take-rate and software revenue, and a controlled IPO process. The base case assumes continued
      operating growth but a slower monetization ramp and a valuation that remains unobservable until
      a new financing or listing filing. The bear case assumes competitor pressure, financing losses,
      regulatory friction, or a delayed IPO expose weak unit economics and force a down-round or
      extended private holding period. Exit readiness is therefore conditional: an IPO aspiration is
      not an exit path until governance, audited reporting, regulatory permissions, controls, and
      market-window evidence are available. Priority diligence is to obtain the latest term sheet and
      cap table, audited financial statements, cohort retention, payment take rate, lending vintage
      performance and provisions, regulatory perimeter by country, and an IPO workplan. A thesis break
      would be material deterioration in retention or margins, unreserved credit losses, a regulatory
      restriction on core products, or financing terms that imply a materially lower value.
    claimRefs: [CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
    figureRefs: [FV001]
