callouts:
  - calloutType: "strength"
    title: "Regional scale with embedded-finance expansion"
    body: >-
      Company-reported branch, GMV, ARR-growth, and net-revenue-growth signals all point to material
      operating momentum, while product descriptions show payments and capital becoming central to
      the platform rather than peripheral add-ons.
    claimRefs: [CO003, CO008, CO009, CO010, CO011]
  - calloutType: "risk"
    title: "Public-market readiness is not yet evidenced"
    body: >-
      The IPO timetable changed between public reports, and the assigned pool contains no prospectus,
      current valuation, audited financial statements, complete board roster, or disclosed Kamco
      terms.
    claimRefs: [CO014, CO015, CO016]
