  evidenceGaps:
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "governance"
      missingEvidence: "A current executive, board, committee, and delegated-authority roster with role start dates."
      whyItMatters: "Leadership depth, succession coverage, and key-person dependence cannot be assessed from two named founders."
      diligencePath: "Request the current organization chart, board minutes, committee charters, and executive biographies."
      relatedQuestionRefs: [QO003]
      relatedTableRefs: [TO002]
    - type: "private-evidence-only"
      severity: "material"
      topic: "capitalization"
      missingEvidence: "A fully diluted cap table, financing instruments, preference stack, debt schedule, and Kamco transaction terms."
      whyItMatters: "Public funding totals do not establish ownership, liquidation economics, governance rights, or cash available."
      diligencePath: "Obtain signed financing documents, the current capitalization ledger, debt agreements, and the Kamco sale documents."
      relatedTableRefs: [TO003]
    - type: "private-evidence-only"
      severity: "material"
      topic: "financial-disclosure"
      missingEvidence: "Audited 2025-2026 revenue, absolute ARR, gross margin, operating loss, cash flow, and cash balance."
      whyItMatters: "Growth percentages and GMV cannot establish revenue quality, profitability, burn, or runway."
      diligencePath: "Request audited statements, monthly management accounts, ARR bridge, GMV-to-revenue reconciliation, and cash forecast."
    - type: "missing-source"
      severity: "material"
      topic: "valuation-and-headcount"
      missingEvidence: "A dated authoritative current valuation and a clearly dated current employee count."
      whyItMatters: "Valuation and organizational scale are cover metrics that cannot safely be inferred from funding or an ambiguous database date."
      diligencePath: "Request the latest 409A or financing valuation support and a payroll-backed headcount report by country and function."
    - type: "missing-source"
      severity: "material"
      topic: "adverse-events"
      missingEvidence: "Authoritative legal, regulatory, security-incident, outage, sanctions, and leadership-change records for all operating jurisdictions."
      whyItMatters: "The assigned search returned no probative adverse record, which is not evidence that no material incident exists."
      diligencePath: "Run jurisdiction-specific court, SAMA, company-registry, sanctions, status-page, and executive-change checks."
      relatedQuestionRefs: [QO009]
    - type: "stale"
      severity: "material"
      topic: "ipo-readiness"
      missingEvidence: "A current regulator filing, prospectus, banker mandate, audited readiness package, or confirmed listing calendar."
      whyItMatters: "The publicly reported target moved from end-2025 to a later two-to-three-year horizon."
      diligencePath: "Request board-approved IPO plans, exchange and regulator correspondence, adviser mandates, and reporting-control workplans."
