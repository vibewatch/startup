  - id: FE001
    title: Foodics product architecture map
    type: stack
    summary: >-
      Foodics layers restaurant operations, integrations and financial services, data products, and control requirements
      around a cloud platform.
    data:
      layers:
        - label: Customer workflow
          modules:
            - name: Reservations and floor management
              detail: Foodics Black describes reservations and real-time floor management for full-service dining.
            - name: Ordering and course pacing
              detail: Foodics Black combines seat-level ordering and course pacing.
        - label: Restaurant operations
          modules:
            - name: POS and menus
              detail: Cloud POS, digital menus, and multi-language access are publicly described.
            - name: Kitchen and inventory
              detail: Kitchen synchronization and inventory management connect front, back, and back-office work.
        - label: Money movement
          modules:
            - name: Embedded payments
              detail: Payment and table-side payment capabilities are described in product material.
            - name: Capital and cash flow
              detail: MENAbytes describes lending, real-time cash-flow visibility, and access to working capital.
        - label: Integration and data
          modules:
            - name: Third-party ecosystem
              detail: Public descriptions mention third-party app integration and partners such as Spice and Wi-Q.
            - name: Analytics and AI
              detail: Norma's BI application and analytics assistant are described as integrated into Foodics.
            - name: API surface
              detail: >-
                A public API catalog identifies a Foodics API profile but says authentication and permissions were not
                reviewed.
        - label: Control layer
          modules:
            - name: Compliance and auditability
              detail: >-
                ZATCA e-invoicing compliance and SAMA licensing are publicly reported, while broader control operation
                remains unverified.
            - name: Reliability and security
              detail: Public sources do not disclose security attestations, uptime, incident metrics, or recovery objectives.
        - label: Deployment and support
          modules:
            - name: Regional operations
              detail: Foodics describes offices and customer or partner coverage across multiple MENA markets.
            - name: Support and recovery
              detail: Public sources do not disclose support SLAs, incident metrics, or recovery objectives.
    claimRefs:
      - CE002
      - CE005
      - CE007
      - CE008
      - CE013
  - id: FU001
    title: Customer journey from workflow replacement to expansion
    type: journey-map
    summary: >-
      Public evidence supports a journey from core restaurant workflow digitization toward multi-location operations,
      payments, analytics, and financial-services expansion, with retention proof still missing.
    data:
      nodes:
        - id: discovery
          label: Workflow replacement
          touchpoints: Replace manual or fragmented restaurant workflows with cloud POS, digital menus, orders, and payments.
          detail: Core job is operational digitization; adoption depth is not quantified.
        - id: deployment
          label: Operational deployment
          touchpoints: Connect front-of-house, kitchen, inventory, reporting, and branch activity.
          detail: Stanford case evidence highlights integration and localization hurdles.
        - id: daily-use
          label: Daily operating loop
          touchpoints: Monitor sales, inventory, customer activity, loyalty, and online-order workflows.
          detail: Official testimonials describe use cases but not independently measured outcomes.
        - id: multi-location
          label: Multi-location oversight
          touchpoints: Use cloud access and analytics to oversee multiple branches or restaurant formats.
          detail: Public sources describe multi-market and multi-format reach without account-level data.
        - id: payments
          label: Payments and financial services
          touchpoints: Add digital payments, settlements, lending, and cash-flow tools around the operating system.
          detail: H1 2025 reporting shows payment-volume growth but not attach rates.
        - id: expansion
          label: Expansion and retention
          touchpoints: Expand across locations, countries, and products if value is proven.
          detail: NRR, GRR, churn, renewal, and concentration remain unresolved.
    claimRefs:
      - CU002
      - CU009
      - CU010
      - CU013
