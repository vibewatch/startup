  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Foodics is positioned toward higher regional operating breadth and higher implementation or total-cost burden,
      while challengers trade breadth or installed-base proof for flexibility and lower apparent cost.
    data:
      points:
        - label: Foodics
          x: 8
          'y': 8
          note: >-
            High regional breadth and financial-services adjacency; higher cost and implementation burden are reported
            in comparisons.
        - label: Marn
          x: 6
          'y': 5
          note: Saudi-native compliance and offline/device flexibility; public pricing and broader scale remain unclear.
        - label: Online eMenu
          x: 4
          'y': 2
          note: Lower reported cost and faster onboarding; smaller enterprise channel and finance proof are unresolved.
        - label: Talabxy
          x: 5
          'y': 3
          note: >-
            Bundled restaurant operations breadth is vendor-claimed; independent proof and regional compliance detail
            are limited.
        - label: PosBytz
          x: 5
          'y': 4
          note: Device-agnostic and back-office breadth are vendor-claimed; support and Saudi depth need validation.
        - label: Toast
          x: 7
          'y': 7
          note: >-
            Global restaurant POS breadth and public pricing surface; Saudi localization and ZATCA fit are unverified in
            this pool.
      xAxis:
        label: Regional operating breadth and integration scope
        min: 0
        max: 10
      yAxis:
        label: Reported cost, implementation, or lock-in burden
        min: 0
        max: 10
    approximationNotes: >-
      Scores are ordinal analyst ratings from the assigned source descriptions, not market-share or performance
      measurements; they are included to make trade-offs explicit, not to imply a common benchmark.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
