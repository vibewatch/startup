chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Foodics was founded in 2014 by Ahmad AlZaini and Mosab Al-Othmani and describes Riyadh as its
              headquarters. A current company job posting says the organization has offices across five countries,
              naming Saudi Arabia, the UAE, Egypt, Jordan, and Kuwait. Its proposition has moved beyond a standalone
              point-of-sale product: public descriptions consistently combine restaurant order and operations management
              with payments, capital, and cash-flow tools. Foodics itself says more than six billion orders have passed
              through the platform, but that cumulative total is company-issued and lacks a disclosed counting
              methodology. The breadth of the suite supports an embedded-finance strategy, while the public record does
              not disclose segment revenue, product attach rates, or geographic revenue mix.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO010
              - CO015
      - number: '1.2'
        title: Capital, ownership, and governance
        blocks:
          - type: paragraph
            body: >-
              The best-supported financing milestone is the $170 million Series C announced in 2022, led by Prosus and
              Sanabil and joined by several regional and global investors. Tracxn currently reports $194 million raised
              over four rounds, but its detailed round values are partly gated, so the database total should not be
              treated as a fully reconciled capitalization schedule. Kamco Invest subsequently acquired an undisclosed
              stake in a transaction reported as closing in the fourth quarter of 2024. Neither the stake percentage,
              price, instrument, nor governance rights were made public. The accessible sources also do not establish a
              complete board roster, voting control, option-pool size, debt position, or founder ownership, leaving
              key-person and control assessment dependent on management diligence.
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO005
              - CO013
              - CO014
      - number: '1.3'
        title: Scale and growth signals
        blocks:
          - type: paragraph
            body: >-
              Foodics reported more than 33,500 active restaurant branches in the first half of 2025, up 23% year over
              year, while platform GMV reached $6 billion for that six-month period, up 27% from H1 2024. It separately
              reported ARR growth of 29%, but did not publish the absolute ARR value, currency basis, or audited
              reconciliation. A February 2026 article carrying company-supplied figures said full-year 2025 net revenue
              grew 54% and cited a 55% Saudi growth rate without defining the latter metric's base. These are meaningful
              momentum indicators, not substitutes for revenue, cash generation, or profitability. Current valuation,
              audited revenue, gross margin, cash burn, and cash available remain public-evidence gaps.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.4'
        title: Milestones and IPO readiness
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence shows Foodics layering financing, embedded financial products, and a strategic
              investor onto its original restaurant software base. It launched the FLEX subscription-payment program in
              October 2023, then discussed a Tadawul offering in public. That listing narrative has moved: a May 2024
              report attributed an end-2025 target and a potential sale of at least 30% to the CEO, whereas July 2025
              coverage described a two-to-three year horizon. The shift does not prove abandonment, but it makes the
              original timing stale. No prospectus, regulator filing, banker mandate, audited readiness package, or
              current listing calendar appears in the assigned evidence. IPO readiness should therefore be treated as an
              objective requiring verification rather than an executable near-term event.
            claimRefs:
              - CO007
              - CO013
              - CO015
              - CO016
