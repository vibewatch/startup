  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Current multi-market uptime, incident, latency, and disaster-recovery metrics for POS, payments, APIs, and Foodics Black.
      whyItMatters: Restaurant operations and payment products are operationally critical, so availability and recovery determine adoption risk and financial-service exposure.
      diligencePath: Request the latest service-level reports, incident register, recovery objectives, and customer support escalation statistics under NDA.
      relatedQuestionRefs: [QE004, QE008]
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: Independent security attestations, penetration-test summaries, privacy controls, and access-governance evidence.
      whyItMatters: The public record states security objectives but does not verify control operation for systems handling restaurant and payment data.
      diligencePath: Obtain current SOC 2 or equivalent reports, PCI or SAMA control mapping, pen-test remediation status, and breach-notification history.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: material
      topic: AI
      missingEvidence: Independent evidence of Norma feature usage, model accuracy, data provenance, and human-review controls.
      whyItMatters: AI integration is a product differentiator only if outputs are reliable and safe for operational decisions.
      diligencePath: Request branch-level adoption, evaluation sets, error rates, model-change controls, and customer references for production use.
      relatedQuestionRefs: [QE007]
    - type: access-blocked
      severity: minor
      topic: API
      missingEvidence: First-party API documentation with authentication, permissions, rate limits, versioning, and deprecation policy.
      whyItMatters: Integration depth and developer adoption cannot be underwritten from a catalog explicitly stating that credentials and permissions were not reviewed.
      diligencePath: Obtain current partner or developer documentation and test credentials through a controlled technical diligence session.
      relatedQuestionRefs: [QE003, QE004, QE008]
