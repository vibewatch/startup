      - [Inventory and menu management, Back-office and kitchen teams, Established / publicly described, Connects operational data to ordering, Realized waste reduction and implementation effort]
      - [Payments and financial services, Merchants and finance teams, Operating in regulated environment, "Embedded payments, capital, and cash-flow tools", "Licenses, take rate, loss controls, and exception rates"]
      - [Foodics Black, Full-service restaurants, Launched / rollout stated, "Reservations through table-side payment with premium hardware", "Deployment count, SLA, and measured outcomes"]
      - [Norma analytics and AI, Restaurant operators, "Integrated; adoption reported", "Natural-language BI and analytics assistant", "Model evaluation, data rights, and branch-level usage"]
    notes: "Status combines direct product descriptions and company-issued launch material; unverified performance and deployment fields are explicit diligence gaps."
    claimRefs: [CE001, CE003, CE005, CE007, CE008, CE009]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Foodics solution, Measurable benefit, Limitation]
    rows:
      - [Capture an order, Separate ordering and POS steps, Cloud POS and seat-level ordering, Fewer disconnected handoffs are intended, No independent cycle-time measure]
      - [Coordinate service, Front and back of house use separate systems, Floor management and course pacing, Better synchronization is claimed, No public service-level benchmark]
      - [Prepare and fulfill food, Kitchen receives fragmented channels, Kitchen synchronization and display workflow, Intended error and delay reduction, Failure modes and recovery are undisclosed]
      - [Manage stock, Manual or disconnected inventory updates, Inventory management tied to operations, Intended waste and purchasing visibility, No public inventory accuracy data]
      - [Settle payment, Separate payment terminal and restaurant system, Embedded and table-side payments, Fewer devices and handoffs are intended, Transaction reliability and fees are undisclosed]
      - [Understand performance, Static reports and specialist analysis, Dashboards and AI analytics assistant, Faster data access is the stated benefit, Independent adoption and accuracy evidence is limited]
    notes: "Benefits are expressed as intended or reported outcomes unless a source provides a measured result; null or qualitative benefit cells are not estimates."
    claimRefs: [CE002, CE003, CE007, CE008, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Cloud POS and operational apps, Capture orders and run restaurant workflows, Cloud infrastructure and supported devices, Availability and offline recovery]
      - [API and integration layer, "Connect third-party apps and financial providers", Provider documentation and partner systems, "Authentication, versioning, and integration failures"]
      - [Financial-services services, "Process payments, lending, and cash-flow tools", SAMA licensing and merchant financial data, "Reconciliation, fraud, and compliance exceptions"]
      - [Operational data layer, "Aggregate order, inventory, and financial information", Cloud applications and restaurant records, "Scaling, data lineage, and consistency are not publicly verified"]
      - [Analytics and AI layer, Convert restaurant data into dashboards and answers, Norma technology and platform data, Data quality and model governance,]
      - [Security and operations controls, "Protect and recover production systems", "Identity, audit, monitoring, and recovery processes", "Control design and effectiveness are not publicly attested"]
    notes: "This is a public-evidence operating model, not a verified internal architecture diagram; product descriptions and third-party profiles do not prove the internal stack or control effectiveness."
    claimRefs: [CE005, CE006, CE007, CE008, CE013, CE014]
