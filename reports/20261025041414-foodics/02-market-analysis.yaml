      - [Multi-unit chain or franchise, "COO, operations or IT leader", "Branch and head-office teams", "Operations, finance or IT", "Cross-branch control, analytics and reconciliation", "Standardization and centralized visibility"]
      - [Cloud kitchen or virtual brand, "Founder or operations leader", "Kitchen and order-management teams", "Operations", "Multi-brand orders, delivery and payment reconciliation", "Delivery growth and lower-real-estate models"]
      - [Finance-led expansion account, "CFO or owner", "Finance and treasury teams", "Finance", "Payments, cash-flow monitoring and capital access", "Higher digital-payment volume or working-capital need"]
      - [Compliance-led account, "Owner, finance or compliance lead", "Cashier and accounting teams", "Finance or compliance", "Structured electronic invoicing and audit records", "ZATCA phase requirements"]
    notes: >-
      Buyer roles are evidence-constrained archetypes inferred from the cited product scope, market
      segmentation, and regulatory workflow; public evidence does not disclose Foodics' customer mix by archetype.
    claimRefs: [CM001, CM005, CM009, CM010, CM011, CM012]
