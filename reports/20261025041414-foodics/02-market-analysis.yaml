      - [Mordor Intelligence, "2026 forecast", "Saudi foodservice market", "USD 32.56bn", "Analyst market model", "Medium; forecast and not a Foodics SAM"]
      - [Mordor Intelligence, "2031 forecast", "Saudi foodservice market", "USD 48.06bn at 8.11% 2026-2031 CAGR", "Analyst market model", "Medium; long-range forecast uncertainty"]
      - [Invest Saudi, "Through 2030", "Saudi retail and foodservice F&B market", "USD 75bn; 7%-8% annual growth", "Government investment-promotion estimate", "Medium; broader boundary than foodservice"]
      - [Foodics via MENAbytes and EntArabi, "H1 2025", "Foodics platform GMV", "USD 6bn; +27% YoY", "Company-disclosed operating metric carried by media", "Medium; GMV is neither revenue nor TAM"]
    notes: >-
      Values have different scopes, periods, and denominators and must not be added. Foodics GMV is
      platform throughput; the two market estimates describe restaurant-sector activity, not software spend.
    claimRefs: [CM004, CM007, CM008]
