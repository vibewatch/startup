company:
  name: Foodics
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Foodics addresses restaurant operating-system and embedded-finance spend rather than the
    whole food economy. Saudi foodservice growth, compulsory e-invoicing, and a large independent
    outlet base support adoption, but public evidence does not isolate a defensible Foodics SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      Foodics' relevant market is the software and financial infrastructure used by restaurants,
      cafes, food trucks, cloud kitchens, and multi-site operators. It includes point of sale,
      order and inventory workflows, reporting, payments, lending, and adjacent direct-ordering
      tools; it excludes the value of food manufacturing, ingredients, restaurant real estate,
      and most consumer food spend. This boundary matters because broad food-and-beverage market
      values are demand context, not software TAM. The historical substitute was fragmented
      on-premise software plus separate payment terminals and manual back-office processes.
      Capterra's product record and Foodics' own hiring material support the integrated workflow
      boundary, while a third-party profile describes the legacy fragmentation. That evidence is
      sufficient to define the category, but not to price every included module or quantify
      software spending by outlet.
    claimRefs: [CM001, CM002]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      The strongest public denominator is Saudi foodservice revenue, not restaurant-technology
      spend. Mordor Intelligence estimates a USD 30.12 billion Saudi foodservice market in 2025,
      USD 32.56 billion in 2026, and USD 48.06 billion in 2031, implying 8.11% growth over
      2026-2031. Invest Saudi publishes a broader USD 75 billion figure covering retail and
      foodservice together and projects 7%-8% annual growth through 2030. Those estimates are not
      contradictory because their scopes differ, and neither is a Foodics TAM. Company-disclosed
      operating signals provide a separate bottom-up lens: reporting carried by MENAbytes and
      EntArabi put H1 2025 processed GMV at USD 6 billion, up 27% year over year, while a syndicated
      Kamco Invest release described more than USD 10 billion of 2024 GMV. GMV indicates platform
      throughput, not Foodics revenue or addressable software spend.
    claimRefs: [CM003, CM004, CM007, CM008, CM015, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and adoption path
    body: >-
      The economic buyer varies with outlet complexity. An independent restaurant owner can be
      buyer, payer, and daily operator; a chain separates budget ownership across operations,
      finance, IT, and compliance; cloud kitchens emphasize order aggregation and multi-brand
      control. Foodics reported through two media outlets that active branches reached more than
      33,500 in H1 2025, up 23% year over year. Mordor's market structure suggests a broad long tail:
      independent outlets held 57.86% of the Saudi market in 2025, while full-service restaurants
      represented 53.62%. Foodics' hiring page describes payments, capital, and cash-flow products,
      but the company-issued signal does not disclose country-level revenue, outlet mix, or
      retention. Adoption therefore likely begins with a restaurant workflow need and expands
      through payments and financial tools, rather than through one uniform enterprise procurement motion.
    claimRefs: [CM001, CM003, CM005, CM006, CM009, CM010]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation
    title: Drivers, constraints, and valuation relevance
    body: >-
      Regulation and channel digitization create real adoption pressure. ZATCA's e-invoicing
      program began Phase 1 on 4 December 2021 and Phase 2 on 1 January 2023, making compliant
      electronic invoicing part of the operating stack. Foodics' own market article cites 70,000
      registered Saudi restaurants in 2023, while Mordor forecasts delivery growth and continued
      dine-in dominance; both trends increase the value of unified order, payment, and reporting
      data. The constraints are equally material. A historical Capterra review from a small Saudi
      F&B user criticized subscription price, customer service, and inventory management, showing
      that digitization demand does not remove ROI and support friction. For valuation, the key
      distinction is between fast-growing restaurant transaction volume and Foodics' monetizable
      take rate. Without current outlet-level pricing, payment penetration, retention, and country
      mix, broad market growth should inform scenario ranges but not justify a precise revenue multiple.
    claimRefs: [CM011, CM012, CM013, CM014, CM016]
callouts:
  - calloutType: risk
    title: Do not capitalize the broad food market as software TAM
    body: >-
      The USD 75 billion Invest Saudi figure includes retail and foodservice, while the USD 30.12
      billion Mordor figure measures 2025 foodservice revenue. Neither discloses restaurant-tech
      budgets or Foodics' obtainable share, so a precise SAM or SOM remains a diligence gap.
    claimRefs: [CM007, CM008, CM016]
