      - [Updated payment-system oversight obligations, Saudi Arabia, High, High, Partial, High, Map every regulated activity to the 2026 framework and control owner]
      - ["Open-banking/API consent and governance requirements", Saudi Arabia, Medium, High, Unknown, High, "Verify licence applicability, consent logs, API controls, and governance testing"]
      - [Personal-data protection and transfer obligations, Saudi Arabia and cross-border transfers, High, High, Unknown, High, "Test controller registration, DPO, transfer, consent, and breach-response controls"]
    notes: "Risk ratings are analyst assessments grounded in the cited regulatory and company-operating evidence; public sources do not disclose Foodics's complete licence inventory, regulator findings, or control-test results."
    enumerationScope:
      coverage: partial
      basis: Publicly described payment, lending, open-banking, and cross-border regulatory exposures through 2026-10-25
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Payment or settlement reconciliation failure, Medium, Critical, Unknown, High, Exception rates and remediation evidence not public]
      - ["Platform outage or degraded restaurant operations", Medium, High, Partial, High, "Uptime, incident, and customer-impact history not public"]
      - [Cybersecurity or data-protection incident, Medium, Critical, Unknown, High, Independent testing and incident history not public]
      - [Delivery or third-party integration failure, Medium, High, Partial, Medium, Integration SLA and missed-order data not public]
    notes: "Competitor-authored comparison pages are treated as adverse signals from interested issuers, not independent benchmarks; the register therefore preserves uncertainty and specifies verification work."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Payment rails and regulated financial-services partners, Banks and payment networks, Unknown, Settlement interruption or licence dependency, Critical, Multi-rail and regulatory mapping, High]
      - [Delivery and ordering integrations, External delivery platforms, Unknown, Orders fail or are delayed during peak periods, High, Integration monitoring and tested fallback, Medium]
      - ["Solo and Norma AI acquisition integration", "Acquired product teams and technology", Unknown, "Roadmap, data, or integration execution slips", High, "Milestone-based integration governance", High]
      - [Regional operating footprint, Local teams and market permissions, Unknown, Expansion creates control inconsistency across countries, High, Country-level control owners and audits, High]
    notes: "Counterparty names and concentration levels are not fully disclosed in the assigned public evidence; unknown values are diligence gaps, not zero concentration."
    claimRefs: [CR009, CR010, CR011, CR012]
