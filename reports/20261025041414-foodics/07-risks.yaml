company:
  name: Foodics
chapter:
  number: 7
  title: Risks
  summary: Foodics is scaling a regulated restaurant-payments platform across multiple markets, so licensing, operational resilience, data controls, and acquisition integration are the main public risk lenses. Public evidence indicates meaningful growth and regulatory exposure, but does not disclose audited profitability, loss provisioning, incident history, or detailed mitigation testing.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: Foodics operates payment and lending products in a supervised environment. A Foodics financial-services job posting states that the business operates under SAMA in Saudi Arabia and is expanding into the UAE, while also emphasizing reliability, security, and correctness for systems handling real money. A 2026 Law Library of Congress summary describes Saudi Arabia's updated payment-system framework as extending oversight to fintech companies and digital financial services. Clyde & Co reports that open-banking providers now need a SAMA licence and must meet requirements around API performance, data security, consent management, and governance. SDAIA separately identifies controller obligations under Saudi Arabia's Personal Data Protection Law, including specific rules or guidance for data-protection officers, transfers, registration, and breach response. These sources support a high regulatory exposure assessment, not a finding of non-compliance. The public record reviewed here does not establish Foodics's full licence set, audit findings, complaints, litigation status, or compliance-control effectiveness. The near-term diligence path is a licence-by-licence matrix, current regulatory correspondence, material-incident log, and evidence of consent, cybersecurity, privacy, model-risk, and operational-resilience testing.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-technical
    title: Operational, quality, and security exposure
    body: The operating model combines restaurant point-of-sale, payments, lending, cash-flow tools, and integrations across a geographically distributed customer base. Foodics's own hiring material calls out idempotency, consistency, auditability, security, observability, reconciliation, and the risk that a service may fail under a ten-times volume scenario; this is a useful description of control requirements, not evidence that the controls have failed. Independent competitor comparison pages allege missed delivery-platform orders, limited support capacity, weak recipe-level costing, basic accounting, and data-security concerns, but those publishers sell competing products and are not independent benchmarks. Their allegations therefore raise testable diligence questions rather than establish incident rates. Public sources reviewed did not verify outages, breaches, recalls, or quantified service-level performance. Investors should request uptime and payment-incident registers, reconciliation exceptions, penetration-test summaries, disaster-recovery results, support backlogs, and customer-impact postmortems.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: partner-dependency
    title: Partner, market, and execution dependencies
    body: Foodics's regional expansion depends on payment rails, regulators, delivery and restaurant integrations, local operating teams, and acquired capabilities. Forbes Middle East reports that Foodics served more than 40,000 branches across Saudi Arabia, the UAE, Egypt, Jordan, and Kuwait in 2025 and acquired UK self-ordering provider Solo in February 2025 and Greece-based Norma AI in June 2026. Menabytes and Entarabi separately report H1 2025 growth in branches, GMV, payment volume, ARR, and international revenue, while also noting that exact revenue and profitability figures were not disclosed. Expansion and acquisitions can increase product breadth, but also create integration, data-governance, vendor-concentration, and execution dependencies. The public file does not identify critical suppliers, counterparty concentration, integration milestones, or failure contingencies. Diligence should map every payment, cloud, delivery, banking, and acquired-product dependency to an owner, substitutability assessment, contractual protection, and tested fallback.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: financial-and-kill-criteria
    title: Financial-model risk and thesis-break triggers
    body: Reported growth is not proof of cash generation or resilience. Menabytes and Entarabi report 29% ARR growth, 38% payment-volume growth, 56% international-revenue growth, and $6 billion of H1 2025 GMV, but both accounts say exact revenue and profitability were not disclosed. Foodics's hiring material describes payments, capital, and cash-flow tools in a regulated environment, creating potential credit, fraud, settlement, provisioning, and working-capital exposure that cannot be quantified from the assigned evidence. Forbes reports $198 million raised, but funding raised is not cash available or runway. The investment case should break if licences are restricted or suspended, a material unresolved payment or data incident emerges, payment-loss or lending-loss rates rise without pricing compensation, integration milestones slip, or audited revenue, margin, retention, and cash-use evidence remains unavailable. Monitoring should be quarterly and tied to incident severity, regulatory status, net loss/provisioning, reconciliation breaks, and liquidity headroom.
    claimRefs: [CR013, CR014, CR015, CR016]
