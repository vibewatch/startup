          values: [Critical, High, High]
        - label: Payment reconciliation and settlement
          values: [Critical, Medium, High]
        - label: Cybersecurity and data protection
          values: [Critical, Medium, High]
        - label: Third-party integrations
          values: [High, Medium, Medium]
        - label: Acquisition integration
          values: [High, Medium, High]
        - label: Financial loss and provisioning
          values: [Critical, Unknown, High]
    approximationNotes: "Qualitative positions summarize the public evidence and unresolved gaps; they are not measured probabilities or loss estimates."
    claimRefs: [CR001, CR005, CR009, CR013]
callouts:
  - calloutType: risk
    title: Highest residual risk
    body: The combination of regulated payment and lending activity, cross-border expansion, and limited public disclosure of control testing makes regulatory and operational resilience the highest-residual risk cluster.
    claimRefs: [CR001, CR002, CR005, CR013]
  - calloutType: assumption
    title: What would change the view
    body: Audited financials, licence evidence, incident and uptime data, credit-loss metrics, and successful acquisition-integration milestones would materially reduce uncertainty; an unresolved material incident or regulatory restriction would be thesis-breaking.
    claimRefs: [CR003, CR008, CR011, CR016]
