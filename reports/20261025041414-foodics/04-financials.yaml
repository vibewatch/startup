  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: underwriting-gaps
      missingEvidence: Audited or management accounts showing revenue by stream, gross margin, operating expenses, cash, debt, and burn through the current period.
      whyItMatters: Without an income statement and cash bridge, GMV and ARR growth cannot establish revenue quality, profitability, or runway.
      diligencePath: Request monthly management accounts, bank statements, debt schedules, cash forecast, and revenue-recognition policy under NDA.
      relatedQuestionRefs: [QI005, QI006, QI009]
    - type: private-evidence-only
      severity: material
      topic: financing
      missingEvidence: Capital 2.0 facility terms, funding source, portfolio balance, delinquency, defaults, recoveries, provisions, and Foodics revenue share.
      whyItMatters: Embedded finance can accelerate growth while adding credit, funding, and regulatory exposure that is not visible in a deployment target.
      diligencePath: Request financing-book vintage tables, credit policy, partner agreements, capital-provider terms, and loss provisioning methodology.
      relatedQuestionRefs: [QI003, QI007, QI008]
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: Current Foodics price book, contract templates, discount schedules, implementation fees, renewal terms, and payment take-rate schedule.
      whyItMatters: List pricing and competitor allegations do not establish realized revenue or unit economics.
      diligencePath: Obtain anonymized contracts and cohort-level bookings, churn, discounts, implementation costs, and gross-margin reporting.
      relatedQuestionRefs: [QI004, QI005]
