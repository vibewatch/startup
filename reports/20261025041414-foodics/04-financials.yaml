company:
  name: Foodics
chapter:
  number: 4
  title: Financials
  summary: Foodics shows meaningful operating scale and growth in platform activity, ARR, and embedded financial services, but its public materials do not disclose audited revenue, profitability, cash, burn, or realized pricing. The underwriting case therefore rests on reported traction and a financing-led expansion model while key unit-economics and capital-adequacy inputs remain open.
sections:
  - id: revenue-engine
    title: Revenue engine and public traction
    body: >-
      Foodics presents an integrated restaurant-management, payments, and financial-services
      platform rather than a single-product SaaS subscription. Its public surfaces describe
      cloud POS, inventory, reporting, integrations, payments, lending, and cash-flow tools,
      while the 2026 Capital 2.0 launch adds performance-data-based financing. This creates
      several possible revenue streams—software subscriptions, payment economics, lending or
      financing-related income, and partner-enabled services—but the assigned evidence does not
      separate revenue by stream or state recognition policy. The strongest disclosed traction
      is operational: Menabytes and Entarabi report $6 billion of H1 2025 GMV, with 27% year-on-year
      growth, while Entarabi reports 29% ARR growth and 56% international-revenue growth. GMV is
      processed volume, not Foodics revenue, and ARR is not a disclosed income-statement measure.
    claimRefs: [CI001, CI002, CI003, CI004, CI006]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: monetization-and-gom
    title: Monetization, GTM, and operating leverage
    body: >-
      The commercial model appears to use a land-and-expand motion: a restaurant operating
      system is the entry point, then payments, reconciliation, capital, and additional apps
      deepen the account relationship. Foodics says its POS tracks sales and inventory across
      branches, integrates with more than 100 apps, and becomes harder to switch after adoption;
      these statements support workflow stickiness, but they do not quantify retention, CAC,
      sales cycle, payback, take rate, gross margin, or implementation cost. A competitor-authored
      2026 comparison alleges high subscription costs, complex setup, and paid add-ons for some
      features. That is adverse market evidence from a seller of an alternative, not an
      independent price benchmark. Foodics has not published list prices in the retained sources,
      so realized pricing, discounting, and customer-level contribution margins remain diligence
      items rather than model inputs.
    claimRefs: [CI008, CI009, CI010]
    tableRefs: [TI002]
  - id: capital-intensity
    title: Cost structure and capital intensity
    body: >-
      The public record supports a capital-intensive expansion agenda but not a cash-flow
      forecast. Foodics states that Capital 2.0 can provide working-capital and expansion
      financing from approximately SAR 20,000 to SAR 2 million or more, with repayments deducted
      from daily settlements. It targets SAR 375 million of first-year funding deployment and
      says the product uses an embedded AI layer for underwriting. These are company-stated
      product and ambition metrics, not evidence of deployed capital, loss performance, funding
      income, or cash available to Foodics. A 2025 report also says Foodics planned to invest
      over $100 million in acquisitions across fintech, AI, and restaurant technology. The
      assigned sources provide no audited gross margin, operating expense, receivables, credit
      losses, provisions, capex, debt, cash balance, or runway. The financing partner structure
      and SAMA licensing reduce some execution ambiguity, but the economic allocation of credit
      risk and funding cost is still unclear.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      Foodics has a credible financial-growth narrative: platform activity is large, reported
      ARR and international revenue are growing, and the company is extending from restaurant
      operations into payments and merchant finance. The evidence is nevertheless insufficient
      for a conventional underwriting conclusion because the bridge from GMV and ARR to recognized
      revenue, gross profit, cash generation, and required capital is not public. Funding history
      is also not perfectly reconciled: FundedIQ reports $190 million across two recorded rounds,
      while Disruptors Digest describes approximately $198 million and explicitly recommends
      checking an official announcement. The right base case is therefore growth with high
      information risk, not a precise margin or valuation forecast. A diligence package should
      request audited or management accounts, revenue by stream, payment take rate, cohort
      retention, customer concentration, financing-book performance, credit-loss policy, cash
      and debt schedules, acquisition commitments, and realized price waterfalls.
    claimRefs: [CI018, CI020]
tables:
  - id: TI001
    title: Public revenue and traction signals
    columns: [Stream or metric, Mechanism or unit, Current public value/status, Quality and diligence implication]
    rows:
      - ["Restaurant software", "Cloud POS, inventory, reporting, and integrations", "All-in-one platform; no public revenue split", "Company and third-party descriptions; request subscription revenue and recognition policy"]
      - ["Platform activity", "GMV processed", "$6B in H1 2025; +27% YoY", "Third-party reported; GMV is not revenue and does not establish take rate"]
      - ["Recurring software or platform metric", "ARR", "+29% in H1 2025", "Third-party reported; exact ARR and reconciliation to recognized revenue unavailable"]
      - ["International expansion", "International revenue", "+56% in H1 2025", "Third-party reported; geography, base, and revenue definition require confirmation"]
    notes: "Values are reported by retained sources for H1 2025 unless stated otherwise; GMV, ARR, and revenue are distinct measures, and no audited income statement was available in the assigned pool."
    claimRefs: [CI001, CI002, CI003, CI004, CI006]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Monetization surface, Public price or contract term, Realized economics, Diligence ask]
    rows:
      - [Core POS and restaurant management, "Pricing not stated in retained sources; plans described as scalable", "Unknown; official page says pricing depends on plan and branch growth", "Obtain current price book, discounts, implementation fees, and renewal terms"]
      - [Payments and settlements, "Payment and reconciliation capabilities described; no take rate", "Unknown", "Obtain payment volume, take rate, interchange/pass-through, settlement costs, and gross margin"]
      - [Capital 2.0 working capital, "Approximately SAR 20,000 to SAR 2 million or more", "Unknown; partner and credit-risk economics not disclosed", "Obtain facility terms, funding source, underwriting policy, defaults, provisions, and revenue share"]
      - [Capital 2.0 repayments, "Small deductions from each daily settlement", "Unknown; repayment performance not disclosed", "Obtain cohort-level repayment, delinquency, loss, and recovery data"]
    notes: "Official product statements describe list mechanics and intended ranges, not realized customer pricing, revenue, margin, or credit performance."
    claimRefs: [CI008, CI009, CI010, CI011, CI012]
  - id: TI003
    title: Unit economics and capital-adequacy matrix
    columns: [Metric, Value, Confidence, Why it matters and diligence ask]
    rows:
      - ["CAC and sales cycle", null, "unavailable", "Determines payback and growth efficiency; request channel-level funnel, sales-cycle, CAC, and payback cohorts"]
      - ["Gross margin by stream", null, "unavailable", "Separates software, payments, and finance economics; request revenue and cost-of-revenue bridge"]
      - ["Cash, burn, and runway", null, "unavailable", "Tests financing dependency; request latest cash, monthly burn, debt, covenants, and runway case"]
      - ["Credit losses and provisions", null, "unavailable", "Tests Capital 2.0 downside; request vintage delinquency, loss, recovery, and provisioning schedules"]
    notes: "Null means the assigned public evidence did not disclose the metric; no zero or estimate is implied. These are material underwriting gaps."
    claimRefs: [CI013, CI014, CI015, CI016, CI020]
figures:
  - id: FI001
    title: Reported activity-to-finance operating model
    type: flow
    summary: Foodics describes a flow from restaurant operations and transaction data into payments, recurring software activity, and merchant financing, but public evidence does not quantify conversion into revenue or gross profit.
    data:
      nodes:
        - id: restaurant-operations
          label: Restaurant operations
          detail: POS, inventory, reporting, and branch workflows
        - id: transaction-data
          label: Performance data
          detail: Sales, settlement, and operating data used for merchant tools
        - id: payments
          label: Payments and settlements
          detail: Digital payments, reconciliation, and instant settlement capabilities
        - id: recurring-platform
          label: ARR / recurring platform activity
          detail: ARR growth was reported, but exact revenue and recognition are undisclosed
        - id: capital
          label: Capital 2.0
          detail: Performance-based pre-qualification and financing
        - id: gross-profit
          label: Revenue and gross profit
          detail: Conversion, take rate, cost to serve, and margin are not publicly quantified
      edges:
        - [restaurant-operations, transaction-data]
        - [transaction-data, payments]
        - [transaction-data, recurring-platform]
        - [transaction-data, capital]
        - [payments, gross-profit]
        - [recurring-platform, gross-profit]
        - [capital, gross-profit]
    approximationNotes: "This is an evidence-backed operating-model flow, not a quantitative revenue bridge; no conversion rates, revenue amounts, or margin assumptions are inferred."
    claimRefs: [CI001, CI008, CI011, CI018]
callouts:
  - calloutType: insight
    title: Growth is visible before profitability is
    body: Foodics has reported strong platform and ARR growth, but the assigned evidence does not show recognized revenue, gross margin, cash generation, or credit-loss performance.
    claimRefs: [CI003, CI004, CI006]
  - calloutType: risk
    title: Financing expansion increases information requirements
    body: Capital 2.0 introduces underwriting, settlement, partner, and credit-risk questions that cannot be answered from the stated deployment target alone.
    claimRefs: [CI008, CI009, CI010, CI011, CI016]
