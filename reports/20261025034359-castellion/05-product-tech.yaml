      - [Propulsion, "Solid rocket motor for high-speed flight", "Internal motor production, materials, and test infrastructure", "Energetic-material safety, yield, and repeatability"]
      - [Vehicle and thermal protection, "Survive high-speed flight and deliver the payload", "Aerostructures, control actuation, and thermal materials", "Configuration changes or test failures could delay qualification"]
      - [Flight computer and mission software, "Control, navigation, and platform integration", "Launcher and aircraft fire-control interfaces", "Interface and cybersecurity evidence is limited"]
      - [Project Ranger manufacturing, "Motor production, integration, static fire, and final assembly", "Construction, permits, workforce, suppliers, and quality systems", "Schedule, environmental controls, and capacity may constrain scale"]
      - [Test and feedback loop, "Use flight data to iterate designs", "Ranges, instrumentation, contracts, and government acceptance", "Public data lacks a complete failure-rate and reliability denominator"]
    notes: "Architecture layers are synthesized only from described modules and operating processes; unspecified components are intentionally not inferred."
    claimRefs: [CE005, CE006, CE007, CE008, CE013, CE014]
