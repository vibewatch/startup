company:
  name: Castelion
chapter:
  number: 5
  title: Product & Technology
  summary: Castelion is developing Blackbeard as a lower-cost, mass-producible hypersonic strike system and is pairing rapid flight-test iteration with a vertically integrated production strategy. Public evidence supports meaningful prototype, platform-integration, and factory activity, but final configuration, production yield, safety controls, and field reliability remain incompletely disclosed.
sections:
  - id: product-workflow
    title: Product and customer workflow
    body: "Castelion's public product is not a generic software platform; it is a family of strike weapons whose value depends on a chain from mission requirement to design, flight test, platform integration, production, and operational delivery. Blackbeard is described as a low-cost, mass-producible hypersonic strike missile, with a ground-launched variant intended to use the Army's HIMARS fire-control ecosystem and an air-launched variant being evaluated for the F/A-18. That creates a concrete user workflow for defense services: select a time-sensitive or hardened target, use existing or modified launch infrastructure, complete seeker-based precision engagement, and feed flight-test data into the next design cycle. The workflow is strategically attractive because it targets more affordable inventory and shorter learning cycles, but the public record does not establish realized unit cost, achieved hypersonic performance, or production acceptance."
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-manufacturing
    title: Architecture, production, and maturity
    body: "The disclosed architecture is a vertically integrated weapons-and-factory system rather than a single fully specified missile design. Public descriptions identify internally manufactured solid rocket motors, control actuation systems, flight computers, seekers, thermal-protection materials, and mission software, while Project Ranger is intended to add propulsion production, integration, static-fire testing, and final assembly. Castelion's development model emphasizes frequent tests and rapid iteration, and external reporting says the Army's Blackbeard Ground Launch pathway is a rapid-prototyping effort with a proof-of-concept followed by a ten-missile production-representative test option. These are meaningful maturity signals, but they do not prove a stable production configuration, validated yield, or qualification for full-rate output. The gap is especially important because the economic thesis depends on scaling without losing reliability or schedule."
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: integration-reliability-and-roadmap
    title: Integration, reliability, and roadmap
    body: "Integration evidence is strongest at the program and test-planning level. The Army budget description reported by The War Zone frames Blackbeard Ground Launch as a seeker-based precision-fire system for moving and hardened targets, says it is not a replacement for Long Range Hypersonic Weapons, and describes a phased prototype path using HIMARS-related equipment. Interesting Engineering reports a February 2026 Navy contract for prototype development, flight testing, and early operational capability, with work expected to continue through November 2027, while Castelion's own announcement says Blackbeard fielding is targeted for 2027. Project Ranger reporting adds a parallel facility and hiring ramp. The roadmap is therefore legible, but public sources do not provide a complete reliability series, failure-rate denominator, production acceptance criteria, or independently verified operational availability."
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: trust-safety-and-diligence
    title: Trust, safety, and diligence constraints
    body: "Product risk is inseparable from manufacturing and site controls. Common Ground Rising, an advocacy source, argues that solid-rocket manufacturing can involve oxidizers, solvents, energetic residues, and groundwater or air-quality hazards, and it calls for independent baseline sampling and transparent monitoring. The source is adverse and advocacy-driven, so its technical assertions should not be treated as proof that Castelion has caused contamination; they do establish a material diligence question for a planned propulsion and test campus. Separately, local reporting says residents questioned the absence of published safety studies, environmental assessments, and tribal consultation, while the company said studies had been conducted but not yet made public. A prudent underwriting view is that the technology thesis remains promising but execution should be gated on configuration control, test evidence, safety documentation, environmental permits, and independent production-quality data."
    claimRefs: [CE013, CE014, CE015]
callouts:
  - calloutType: strength
    title: Integrated learning loop
    body: Public evidence supports a coherent design-test-manufacture loop, but not yet a verified full-rate production outcome.
    claimRefs: [CE005, CE006, CE007]
  - calloutType: risk
    title: Factory and safety disclosure
    body: Project Ranger's scale and the use of energetic materials make independent evidence on permits, controls, yield, and reliability central to the product case.
    claimRefs: [CE013, CE014, CE015]
