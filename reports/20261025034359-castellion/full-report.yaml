      - CI006
      - CI010
      - CI013
  - id: FE001
    title: Castelion product and production architecture
    type: stack
    summary: A layered view of the disclosed weapon, integration, test, and manufacturing system.
    data:
      layers:
        - label: Mission layer
          detail: Reported use cases connect seeker-based precision fires to multi-service launch platforms.
          modules:
            - Seeker-based precision fires
            - Multi-service platforms
        - label: Weapon layer
          detail: Blackbeard is described as a low-cost, mass-producible hypersonic strike missile family.
          modules:
            - Blackbeard
            - Propulsion and controls
        - label: Integration and test layer
          detail: Ground and air integration paths are paired with iterative flight testing.
          modules:
            - HIMARS-related ground launch
            - F/A-18 air launch
            - Iterative flight testing
        - label: Manufacturing layer
          detail: Project Ranger and the distributed footprint support motors, static-fire testing, and final assembly.
          modules:
            - Project Ranger
            - Distributed operations
        - label: Safety and compliance layer
          detail: Public diligence needs include permits, environmental studies, monitoring, and tribal consultation.
          modules:
            - Site controls
            - Environmental review
        - label: Quality and acceptance layer
          detail: Public sources do not yet provide a complete reliability, yield, or operational-availability record.
          modules:
            - Configuration control
            - Government acceptance
    claimRefs:
      - CE005
      - CE006
      - CE009
      - CE011
      - CE012
      - CE013
      - CE014
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence traces Castelion from government development awards to a reported Navy production order and a
      planned partner integration, with conversion gates still open.
    data:
      nodes:
        - id: development-award
          label: Development award
          title: Air Force SBIR Phase II
          detail: 2023 award for scalable, cost-focused long-range strike weapon production and flight testing.
          touchpoints:
