    type: pyramid
    summary: >-
      These six layers show the progression from broad defense spending context to conditional Castelion-specific
      procurement signals; they are not additive market shares.
    data:
      nodes:
        - id: global-defense
          label: Global military expenditure
          value: $2,887B
          note: SIPRI 2025; broad context
        - id: nato-defense
          label: NATO members' military expenditure
          value: $1,581B
          note: SIPRI 2025; broad context
        - id: us-defense
          label: United States military spending
          value: $954B
          note: SIPRI 2025; broad context
        - id: eoc-order
          label: Navy EOC weapon support
          value: 50 weapons
          note: $89,997,162 firm-fixed-price order
        - id: annual-signal
          label: Conditional annual procurement
          value: 500/year minimum
          note: After testing and validation
        - id: five-year-signal
          label: Conditional five-year ambition
          value: '>12,000 missiles'
          note: Authorization and appropriations sought
    approximationNotes: >-
      The layers intentionally combine budget dollars and missile quantities as distinct lenses. They are not a
      common-unit funnel, do not imply proportional area, and are not additive.
