              - CO009
              - CO011
              - CO015
      - number: '1.3'
        title: Manufacturing build-out and procurement path
        blocks:
          - type: paragraph
            body: >-
              Project Ranger is the physical center of the scaling plan. New Mexico's economic-development agency
              described a $220 million private investment on a 1,000-acre Sandoval County campus, with 21 buildings
              planned to be production-ready by the end of 2026 and 300 high-wage jobs expected. The disclosed
              activities include solid-rocket-motor production, static testing, component assembly, and finished-round
              assembly, indicating vertical integration beyond a design-only business. Army Technology reported a 2027
              deployment target for Blackbeard. Demand visibility is meaningful but conditional: the Department of War
              said a two-year multi-year procurement contract for at least 500 Blackbeard missiles annually would follow
              successful testing and validation, with options extending to five years. Its separate objective to
              purchase more than 12,000 missiles over five years still depends on authorizations and appropriations.
              Those conditions distinguish a policy demand signal from a firm, funded order and make qualification,
              yield, schedule, and appropriations the critical conversion gates.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO011
              - CO012
              - CO014
              - CO015
      - number: '1.4'
        title: Diligence implications and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The evidence establishes credible institutional sponsorship, a current financing event, a manufacturing
              footprint, and an explicit federal pathway toward high-volume procurement. It does not establish that
              prototype progress has converted into repeatable production or profitable delivery. CSIS cautions that
              industrial plans are not results and that prototype- stage commercial-first technologies have not yet
              demonstrated reliable throughput at scale; this is directly relevant to a company funding a large campus
              ahead of full-rate validation. Revenue, gross margin, cash balance, burn, runway, debt pricing and
              covenants, customer count, current headcount, funded backlog, contract mix, and cap-table control remain
              unavailable in the retained public evidence. Board composition and succession coverage are also
              undisclosed. The next diligence step is therefore documentary: obtain the capitalization table, board
              materials, credit agreement, award and obligation exports, program test schedule, factory commissioning
              plan, yield data, and a bridge from signed contract value to recognized revenue. Until then, the $13
              billion valuation and federal demand objective indicate market confidence, not verified unit economics or
              execution.
            claimRefs:
              - CO006
              - CO008
              - CO010
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand signal is not contracted revenue
            body: >-
              The federal framework remains gated by testing and validation, and the larger five-year objective requires
              authorization and appropriations. Treat neither the stated procurement objective nor aggregate contract
              announcements as recognized revenue, funded backlog, or cash receipts.
            calloutType: risk
            claimRefs:
              - CO010
              - CO015
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand architecture
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all defense spending and not all hypersonic research. It is the procurement of
              operationally relevant, long-range strike and related air-defense systems, including engineering, testing,
              production, logistics, and sustainment purchased primarily by national defense ministries and military
              services. NATO defines defense expenditure broadly enough to include armed forces, stockpiled war
              reserves, operations, and research and development, while excluding civil defense and war-damage payments.
              That boundary is useful as a top-down context but overstates Castelion's addressable spend because it
              includes pensions, infrastructure, non-strike forces, and unsuccessful R&D. The narrower buyer job is
              affordable, repeatable kinetic capacity that can be tested, validated, procured, and surged. Status-quo
              substitutes include exquisite low-volume missiles, legacy cruise and ballistic systems, prime-contractor
              programs, and retaining existing inventory; internal government development and other new entrants are
              additional alternatives.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              Multiple lenses are necessary because no public source isolates a Castelion TAM, SAM, or SOM. SIPRI
              reports $2,887 billion of world military expenditure in 2025, with the 32 NATO members at $1,581 billion
              and the United States at $954 billion; these are macro budget pools, not missile-market revenue. A
              procurement-path lens is more decision-useful: the Department of War says it is seeking authorization and
              appropriations for more than 12,000 Blackbeard missiles over five years, after testing and validation, and
              describes a minimum 500 missiles annually in a two-year multi-year contract with extension options. The
              latter figures are prospective demand signals rather than booked orders. Buyer ownership is concentrated
              in service acquisition executives and defense departments, while users are operational units and
              warfighters and payers are national governments. Adoption therefore depends on test results,
              program-of-record transition, appropriations, fixed-price execution, and production capacity rather than
              on ordinary commercial self-serve conversion.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are unusually visible: SIPRI records the eleventh consecutive year of global
              military-spending growth, the Department of War describes a deliberate effort to expand the munitions
              industrial base, and Castelion's Navy award funds 50 Early Operational Capability weapons while supporting
              transition toward a program of record. Castelion's proposed value proposition is affordability plus
              manufacturing rate: Naval News reports a target production cost below $500,000 per round and a range of up
              to 500 nautical miles, while the company describes Blackbeard as designed for industrial-rate output.
              Constraints are equally material: the prospective quantity signal is contingent on testing and validation;
              the Navy award is scheduled through August 2028; a New Mexico campus requires substantial construction and
              workforce execution; and public evidence does not disclose realized unit cost, yield, margins, backlog
              conversion, or the budget status of the larger quantity ambition. These unknowns limit what market growth
              can justify in valuation.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Evidence limits and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a favorable demand environment but not a clean bottom-up market forecast. Public
              reporting gives competing valuation and financing information and describes several future weapons
              initiatives, yet it does not provide a complete serviceable-market definition by service, weapon class,
              geography, or procurement account. The most important diligence work is to obtain the current acquisition
              program documents, test and validation criteria, funded versus aspirational quantities, contract backlog
              and options, production yield and supplier capacity, and expected unit economics. Public award portals can
              be useful for transaction-level verification, but the retained USAspending fetch exposed a general data
              and disclosure page rather than award-specific fields, so it cannot support a precise award total here.
              The market thesis should therefore be treated as evidence-constrained: strong strategic demand signals,
              plausible volume expansion, and high execution and appropriation uncertainty.
            claimRefs:
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand signal is stronger than disclosed market capture
            body: >-
              The public record supports defense-budget tailwinds and prospective Blackbeard volume, but it does not
              establish Castelion's realized share, revenue conversion, or profitability.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM015
          - type: callout
            title: Validation and appropriations are gating events
            body: >-
              The largest public quantity figures are expressly conditional on testing, validation, authorization, and
              appropriations; they should not be treated as contracted revenue.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buying alternatives
        blocks:
          - type: paragraph
            body: >-
              Castelion's buyer is the U.S. government, and the relevant competitive set is broader than another
              hypersonic startup. Direct competition includes other hypersonic weapon developers and suppliers of
              propulsion, guidance, and warhead subsystems. Incumbent alternatives include Lockheed Martin's Precision
              Strike Missile and RTX's Tomahawk, each with established platform integration and different mission
              profiles. Adjacent substitutes include L3Harris and Northrop Grumman hypersonic capabilities, while
              Anduril, CoAspire, Zone 5, and Leidos show the procurement system is also creating lower-cost
              cruise-missile alternatives. The status quo is continued use of mature inventory and internal government
              programs; internal build is plausible for large primes but not evidenced as a standalone buyer option.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Capability, distribution, and economics
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiation signal is Castelion's claimed combination of hypersonic performance, vertical
              integration, and a planned production campus. Army Recognition reports that Project Ranger is planned to
              combine solid-rocket-motor manufacturing, static testing, and final assembly, while the same report
              describes an agreement providing for a minimum of 500 Blackbeard missiles annually once validated. That
              potential scale matters because the Air Force's FAMM framework is explicitly designed around lower-cost
              weapons and competitive suppliers, but the public record does not disclose Castelion's unit price,
              delivered gross margin, discounting, or production yield. Lockheed's PrSM emphasizes open architecture,
              modularity, and a 60-to-499-plus-kilometer range; RTX emphasizes long service history and operational use
              for Tomahawk. These are materially different buying criteria, so a simple feature score would overstate
              comparability.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP009
              - CP010
              - CP014
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Castelion's potential moat is executional rather than merely conceptual: repeated flight testing, common
              propulsion and guidance technologies, manufacturing capacity, and government integration could reinforce
              one another if qualification converts into recurring orders. The moat is not yet durable on public
              evidence. Established primes possess qualification history, installed launch platforms, supply chains, and
              program-management credibility; new entrants are being invited into framework agreements with minimum
              order floors and fixed-price competition. The same procurement trend that creates room for Castelion can
              therefore intensify price pressure and make affordability a table stake. Castelion also faces multi-homing
              by government customers across missile families and suppliers, while a failed test, delayed qualification,
              or slower-than-planned campus ramp could shift awards to alternatives.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Qualification and price pressure are the central competitive risks
            body: >-
              Castelion's public differentiation is strongest on planned integration and production scale, but the same
              procurement environment is recruiting lower-cost entrants and preserving incumbent alternatives. A
              defensible moat requires evidence of qualification, repeatable yield, delivered unit economics, and
              conversion from frameworks or prototypes into recurring procurement.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and contract conversion
        blocks:
          - type: paragraph
            body: >-
              Castelion appears to monetize long-cycle government defense programs rather than a subscription or
              transactional software model. The strongest public contract evidence is a $89,997,162 firm-fixed-price
              Navy order that supports engineering, technical, logistics, and manufacturing services for 50 Early
              Operational Capability weapons and transition toward a Navy Program of Record. That award is a booked
              contract value, not evidence of recognized revenue, cash collected, backlog conversion, or a steady run
              rate. A separate report says Blackbeard is intended for industrial-rate output and a target production
              cost below $500,000 per round, but that is a reported target and should not be treated as realized unit
              economics. The assigned USAspending award URL did not expose award-specific value or obligation fields in
              its fetched text, so it does not independently corroborate the reported order. Public materials do not
              disclose the share of development, production, logistics, or sustainment revenue, delivery milestones,
              acceptance terms, change-order exposure, or customer concentration. Underwriting therefore requires
              contract-level revenue schedules and a reconciliation from obligations to recognized revenue and cash
              receipts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI004
              - CI006
              - CI010
      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The operating model is manufacturing-heavy: Project Ranger is described as a 1,000-acre campus for solid
              rocket motors, static testing, component assembly, and finished rounds, while other reporting describes
              operations in New Mexico, California, and Texas. Castelion has said the New Mexico campus will require
              $220 million of private investment and include 21 buildings ready for production by the end of 2026;
              another account describes a 22-building campus and a $125 million industrial-revenue-bond package plus $10
              million in economic-development funds. These figures describe planned or supported capacity, not expense
              incurred, depreciation, working capital, or gross margin. Public sources do not provide material costs,
              labor productivity, scrap or yield, supplier terms, warranty exposure, test-failure costs, or fixed-cost
              absorption at different production volumes. The key economic question is whether scale lowers cost per
              round without creating a large pre-revenue cash trough.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The December 2025 financing report says Castelion raised $350 million in Series B funding to accelerate
              Blackbeard production and Project Ranger, while the current Navy order provides a visible program
              milestone through August 2028. The financing should be treated as capital raised, not cash currently
              available: the public evidence does not show cash on hand, committed but undrawn facilities, monthly burn,
              debt, preferred terms, or the amount already spent on the New Mexico buildout. The New Mexico
              economic-development release calls the campus a $220 million private investment and says all buildings are
              expected to be production-ready by the end of 2026, but neither source provides a cash-flow schedule. This
              leaves a financing dependency: additional equity, customer advances, milestone payments, or debt may be
              needed before production and government conversion generate self-funding cash. A decision should remain
              conditional on a monthly cash bridge, program-by-program backlog, delivery acceptance, and financing
              terms.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI006
              - CI010
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Castelion has credible demand-side signals and a potentially meaningful defense-program foothold, but the
              financial underwriting case remains incomplete. The $89.997 million Navy order and the reported $350
              million financing establish external validation and funding capacity, while the Project Ranger buildout
              demonstrates substantial capital intensity. They do not establish recurring revenue, contribution margin,
              cash runway, or a proven ability to produce at the stated target cost. Lockheed Martin, Northrop Grumman,
              and L3Harris maintain public annual-report or investor-financial pages; the assigned evidence contains no
              comparable audited financial package for Castelion. The most decision-relevant diligence is a contract
              waterfall from award to revenue and cash, a current cash-and-burn schedule, unit-cost and yield data for
              flight-tested and production-intent rounds, and the financing plan through the 2028 EOC target. Until
              those are available, financial confidence should remain medium and valuation should not be underwritten
              from funding headlines or a single contract value.
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI010
              - CI014
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI010
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Government conversion signal
            body: >-
              The Navy order funds 50 EOC weapons and work toward a Navy Program of Record, which is stronger than an
              undifferentiated concept-stage announcement but still leaves delivery, acceptance, and recognized-revenue
              timing unresolved.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
          - type: callout
            title: Cash visibility is the central blocker
            body: >-
              Public sources identify funding and planned capital investment but do not disclose cash on hand, burn,
              runway, debt, or preference terms; capital adequacy cannot be concluded from the $350 million round alone.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI012
          - type: callout
            title: Underwrite the contract-to-cash bridge
            body: >-
              Request monthly cash forecasts, contract award and acceptance schedules, production cost by lot, and
              financing commitments before treating the reported award or facility investment as revenue quality or
              margin evidence.
            calloutType: recommendation
            claimRefs:
              - CI003
              - CI008
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Castelion's public product is not a generic software platform; it is a family of strike weapons whose
              value depends on a chain from mission requirement to design, flight test, platform integration,
              production, and operational delivery. Blackbeard is described as a low-cost, mass-producible hypersonic
              strike missile, with a ground-launched variant intended to use the Army's HIMARS fire-control ecosystem
              and an air-launched variant being evaluated for the F/A-18. That creates a concrete user workflow for
              defense services: select a time-sensitive or hardened target, use existing or modified launch
              infrastructure, complete seeker-based precision engagement, and feed flight-test data into the next design
              cycle. The workflow is strategically attractive because it targets more affordable inventory and shorter
              learning cycles, but the public record does not establish realized unit cost, achieved hypersonic
              performance, or production acceptance.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE011
              - CE014
          - type: table
