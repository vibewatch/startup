          detail: Engineering, technical, logistics, and manufacturing services
        - id: weapons
          label: 50 EOC weapons
          detail: Reported quantity supported by the Navy order
        - id: cash
          label: Recognized revenue and cash
          detail: Public conversion, margin, and cash timing unavailable
      edges:
