          claimRefs:
            - CU004
            - CU005
        - id: program-status
          label: Program status
          title: Blackbeard program of record
          detail: >-
            Castelion says the program reached program-of-record status in under four years; fielding is targeted for
            2027.
          touchpoints:
            - Castelion Series C release
          claimRefs:
            - CU001
            - CU006
        - id: production-order
          label: Production order
          title: U.S. Navy order
          detail: Independent reporting identifies a first Blackbeard production order from the Navy; scope is not disclosed.
          touchpoints:
