chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, leadership, and operating model
        blocks:
          - type: paragraph
            body: >-
              Current independent reporting describes Castelion as a missile startup founded in 2022 by former SpaceX
              executives and headquartered in Torrance, California. Bryon Hargis is the only named executive in the
              retained chapter evidence: the New Mexico Economic Development Department and Army Technology identify him
              as co-founder and chief executive. The retained sources do not name the full founding team, board, chief
              financial officer, chief operating officer, or independent directors, so governance coverage is partial
              rather than an exhaustive management roster. The operating thesis is to develop and manufacture lower-cost
              hypersonic strike weapons faster and at higher volume than traditional programs, with Blackbeard as the
              disclosed lead system. That strategy sits inside a large defense-spending environment—SIPRI reported
              $2.887 trillion of global military expenditure in 2025—yet category spending is not evidence of Castelion
              revenue or market share. The public profile therefore supports founder- market fit in aerospace
              engineering and manufacturing, while leaving key-person concentration and functional leadership depth
              unresolved.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO016
      - number: '1.2'
        title: Capital, valuation, and stakeholder concentration
        blocks:
          - type: paragraph
            body: >-
              TechCrunch and Army Technology both reported an August 2026 Series C described as $1 billion at a $13
              billion valuation. The disclosed components were $800 million of equity and a $250 million revolving
              credit facility; because those components sum to $1.05 billion, the headline figure should be treated as a
              rounded, mixed-capital label rather than as equity raised or cash available. The syndicate spans venture,
              private-equity, strategic-investment, and public-markets capital: Andreessen Horowitz, Carlyle, and
              JPMorganChase's Strategic Investment Group were reported as co-leads, with Lightspeed, General Catalyst,
              Altimeter, Lavrock Ventures, Interlagos, and T. Rowe Price Associates also named. Public reporting also
              says Castelion secured more than $500 million in U.S. military contracts over the preceding 18 months, but
              that is an aggregate contract figure, not recognized revenue, funded backlog, or cash receipts. The
              fetched USAspending award page exposed generic data documentation rather than award-specific economics, so
              this chapter cannot independently reconcile that aggregate to obligations, ceilings, or revenue
              conversion.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
