      - CM006
      - CM007
      - CM008
      - CM009
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Ordinal positioning separates mature installed-platform alternatives from newer affordability and production-scale
      propositions; scores are analytical, not market-share measurements.
    data:
      xAxis:
        label: Production affordability
        min: 1
        max: 5
      yAxis:
        label: Qualification and installed-platform maturity
        min: 1
        max: 5
      points:
        - label: Castelion
          x: 4
          'y': 2
          note: Planned production scale and reported contracts; qualification and realized economics remain open
        - label: Lockheed Martin PrSM
          x: 3
          'y': 5
          note: Official page describes mature modular precision-fires positioning; price not disclosed
        - label: RTX Tomahawk
          x: 2
          'y': 5
          note: Official page reports extensive testing and operational use; price not disclosed
        - label: L3Harris
          x: 3
          'y': 4
          note: Official page describes long-running hypersonic research and manufacturing capabilities
        - label: Anduril FAMM
          x: 5
          'y': 2
          note: Reported affordability and framework participation; testing and qualification remain required
        - label: Leidos LCCM
          x: 4
          'y': 2
          note: Company states scalable modular design and expected 2027 production; forward-looking
    claimRefs:
      - CP001
      - CP011
      - CP012
      - CP014
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence traces Castelion's model from financing and government awards into manufacturing capacity and
      potential delivered weapons, while the cash and margin conversion points remain unverified.
    data:
      nodes:
        - id: funding
          label: Series B funding
          detail: $350 million reported; capital raised, not revenue
        - id: facility
          label: Project Ranger
          detail: $220 million private investment reported
        - id: award
