          title: Project Ranger
          detail: New Mexico describes a 1,000-acre campus with $220 million investment and planned production functions.
          touchpoints:
            - New Mexico EDD
          claimRefs:
            - CU010
            - CU011
        - id: partner-integration
          label: Partner integration
          title: Saronic Marauder
          detail: Blackbeard integration with Marauder is described as a planned 2027 maritime demonstration.
          touchpoints:
