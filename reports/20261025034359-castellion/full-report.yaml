            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE009
              - CE011
      - number: '5.2'
        title: Architecture, production, and maturity
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture is a vertically integrated weapons-and-factory system rather than a single
              fully specified missile design. Public descriptions identify internally manufactured solid rocket motors,
              control actuation systems, flight computers, seekers, thermal-protection materials, and mission software,
              while Project Ranger is intended to add propulsion production, integration, static-fire testing, and final
              assembly. Castelion's development model emphasizes frequent tests and rapid iteration, and external
              reporting says the Army's Blackbeard Ground Launch pathway is a rapid-prototyping effort with a
              proof-of-concept followed by a ten-missile production-representative test option. These are meaningful
              maturity signals, but they do not prove a stable production configuration, validated yield, or
              qualification for full-rate output. The gap is especially important because the economic thesis depends on
              scaling without losing reliability or schedule.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.3'
        title: Integration, reliability, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Integration evidence is strongest at the program and test-planning level. The Army budget description
              reported by The War Zone frames Blackbeard Ground Launch as a seeker-based precision-fire system for
              moving and hardened targets, says it is not a replacement for Long Range Hypersonic Weapons, and describes
              a phased prototype path using HIMARS-related equipment. Interesting Engineering reports a February 2026
              Navy contract for prototype development, flight testing, and early operational capability, with work
              expected to continue through November 2027, while Castelion's own announcement says Blackbeard fielding is
              targeted for 2027. Project Ranger reporting adds a parallel facility and hiring ramp. The roadmap is
              therefore legible, but public sources do not provide a complete reliability series, failure-rate
              denominator, production acceptance criteria, or independently verified operational availability.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety, and diligence constraints
        blocks:
          - type: paragraph
            body: >-
              Product risk is inseparable from manufacturing and site controls. Common Ground Rising, an advocacy
              source, argues that solid-rocket manufacturing can involve oxidizers, solvents, energetic residues, and
              groundwater or air-quality hazards, and it calls for independent baseline sampling and transparent
              monitoring. The source is adverse and advocacy-driven, so its technical assertions should not be treated
              as proof that Castelion has caused contamination; they do establish a material diligence question for a
              planned propulsion and test campus. Separately, local reporting says residents questioned the absence of
              published safety studies, environmental assessments, and tribal consultation, while the company said
              studies had been conducted but not yet made public. A prudent underwriting view is that the technology
              thesis remains promising but execution should be gated on configuration control, test evidence, safety
              documentation, environmental permits, and independent production-quality data.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated learning loop
            body: >-
              Public evidence supports a coherent design-test-manufacture loop, but not yet a verified full-rate
              production outcome.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: Factory and safety disclosure
            body: >-
              Project Ranger's scale and the use of energetic materials make independent evidence on permits, controls,
              yield, and reliability central to the product case.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who pays, uses, and integrates the system
        blocks:
          - type: paragraph
            body: >-
              The visible customer base is concentrated in U.S. government defense programs, with partners serving as
              integration channels rather than ordinary commercial accounts. Castelion reports more than $500 million in
              U.S. military contracts over the 18 months before its Series C announcement, while the SBIR record
              provides a primary example of an Air Force-sponsored development award. Independent reporting identifies a
              first Navy Blackbeard production order, but the public title does not disclose quantity, delivery timing,
              or whether the order is a pilot lot. Saronic adds a distinct partner-led surface: its Marauder vessel is
              intended to host a future Blackbeard demonstration. This segmentation supports strategic relevance, not a
              diversified recurring-revenue customer base.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU012
      - number: '6.2'
        title: Adoption trajectory and delivery readiness
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory moves through several non-equivalent stages. The Air Force SBIR award is a dated
              development contract whose abstract emphasizes demonstrating a scalable, cost-focused manufacturing
              approach and flight testing. Castelion says Blackbeard reached program-of-record status in under four
              years and targets fielding in 2027, while the independent Navy-order headline is a stronger production
              signal but still lacks lot and delivery detail. Project Ranger is described by New Mexico as a large
              campus with planned manufacturing and test functions, which could support delivery capacity. None of these
              milestones is a disclosed active-account, renewal, utilization, or revenue-recognition metric. Investors
              should therefore treat contract and production language as evidence of procurement access, not proof of
              durable customer economics.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.3'
        title: Named proof and expansion paths
        blocks:
          - type: paragraph
            body: >-
              Named proof is strongest where a source identifies a government program or a concrete integration. The
              SBIR.gov record names Castelion Corporation, the Air Force branch, the award amount, and the technical
              objective. The Defense Post headline identifies the Navy as the first reported Blackbeard production-order
              customer. Breaking Defense describes Saronic and Castelion planning a Marauder integration and a 2027
              maritime launch demonstration, while also noting that Marauder was still in on-water trials and that
              follow-on production depends on successful testing. These facts show an expansion path from development to
              production and then to partner deployment, but the last step remains contingent. The customer thesis is
              strategically credible yet commercially under-measured.
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
              - CU013
              - CU014
      - number: '6.4'
        title: Retention, concentration, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not disclose net revenue retention, gross retention, churn, contract length, cohort
              behavior, active customer count, backlog composition, or revenue by customer. The available signals also
              appear concentrated in U.S. government demand and a small set of defense-technology relationships,
              although the assigned sources do not provide a denominator sufficient to quantify concentration. A future
              maritime demonstration may broaden the platform surface, but it is not yet evidence of repeat procurement.
              The key diligence task is to reconcile award notices and production orders to delivered units, recognized
              revenue, renewal or follow-on awards, and customer acceptance. Until that bridge is available, customer
              durability should remain an open question rather than an assumed strength.
            claimRefs:
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Government adoption is more than a logo list
            body: >-
              The assigned record includes a primary Air Force award, a reported Navy production order, and a named
              partner integration rather than only customer logos.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU007
          - type: callout
            title: Durability is not yet measurable
            body: >-
              No assigned source discloses retention, recurring procurement, customer concentration, or award-to-revenue
              conversion; the customer thesis remains dependent on follow-on evidence.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
          - type: callout
            title: Request award-to-delivery proof
            body: >-
              Obtain contract-level quantities, delivery and acceptance records, revenue recognition, follow-on options,
              and any renewal or repeat-order history before underwriting durable customer economics.
            calloutType: recommendation
            claimRefs:
              - CU002
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Castelion's strongest public risk signal is not a recorded accident; it is the combination of
              hazardous-material process obligations, a new 1,000-acre production campus, and public concern about blast
              radius, water use, transparency, and emergency response. The company describes vertical integration, rapid
              testing, and scaled manufacturing as ways to reduce risk, while the New Mexico project is still moving
              through construction and readiness milestones. A thesis break would be a material safety or environmental
              event, a missed production-readiness milestone, or a government award that does not convert into
              repeatable deliveries. These are monitorable conditions, not conclusions that an incident has occurred.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR010
              - CR012
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and community exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory burden is structural. OSHA describes process safety management as a comprehensive program
              for hazards associated with highly hazardous chemicals, and EPA states that facilities using extremely
              hazardous substances may need a Risk Management Plan under the Clean Air Act's Risk Management Program.
              Those requirements do not establish that Castelion is subject to a particular filing or that it is
              noncompliant; they define the diligence perimeter for a solid-rocket-motor facility. Independent local
              reporting adds unresolved community questions about emergency scenarios, ammonium perchlorate, water, and
              disclosure. The material risk is therefore permitting, compliance, and social-license delay until
              facility-specific approvals and emergency plans are verified.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, quality, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Castelion's operating model depends on converting prototype and early-operational work into reliable,
              repeatable production while completing a new campus. Its own site says systems are designed for
              manufacturability and that core technologies are vertically integrated, but those statements are company
              claims rather than independent yield, defect, throughput, or supplier data. The New Mexico
              economic-development release says the campus will contain 21 buildings and be ready for production by the
              end of 2026, creating a clear schedule dependency. The Navy awards disclosed by Castelion show customer
              traction, yet public evidence in this pool does not disclose acceptance testing, delivery performance,
              margins, or backlog conversion.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.4'
        title: Mitigations, monitoring, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public mitigations include static testing rather than launches at the New Mexico site, company assertions
              that no chemical synthesis will occur there, federal process-safety and accident-prevention frameworks,
              and a stated design emphasis on manufacturability. These measures reduce exposure only if
              facility-specific controls, emergency response, workforce qualifications, supplier redundancy, quality
              records, and customer acceptance evidence are effective. The investment implication is to track rather
              than underwrite the execution case on narrative alone. The next diligence package should require permits,
              process-hazard analyses, RMP or exemption rationale, insurance, incident logs, schedule and yield
              dashboards, supplier concentration, government contract line items, and cash funding for the campus.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Safety evidence is a diligence gate
            body: >-
              Federal process-safety and accident-prevention frameworks define the control perimeter, but the retained
              evidence does not verify Castelion's facility-specific compliance, emergency planning, or incident
              history.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR008
          - type: callout
            title: Award traction is not delivery proof
            body: >-
              Castelion disclosed Navy orders, but this pool does not establish acceptance, production yield, delivery
              timing, backlog composition, or margin; those should remain explicit diligence asks.
            calloutType: assumption
            claimRefs:
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment view and entry discipline
        blocks:
          - type: paragraph
            body: >
              Castelion has credible strategic demand signals and a financing-backed plan to industrialize hypersonic
              production, but the public record remains much stronger on milestones than on investor economics. The
              Series B announcement says the capital supports Blackbeard integration, Project Ranger, and multi-service
              testing in 2026, while the New Mexico Economic Development Department describes a $220 million private
              investment and a 1,000-acre campus. Those are evidence of committed deployment and execution ambition, not
              evidence of revenue, gross margin, cash runway, or a priced equity valuation. The Army-related evidence is
              also milestone-based: Breaking Defense reports a planned $25 million FY26 Blackbeard development effort, a
              proof-of-concept phase, and possible early-FY28 deliveries, with price undisclosed. That combination
              supports a strategic option value thesis but not a precise mark. Comparable public and private
              defense-technology observations show a wide dispersion: Lockheed Martin had a $139.56 billion market
              capitalization in October 2026; TechCrunch reports that Anduril raised $5 billion in May at a $61 billion
              valuation and separately relays a Reuters report of possible financing at about $100 billion; Shield AI
              announced a $12.7 billion post-money valuation. These are comparables, not Castelion marks; business mix,
              maturity, backlog, margins, liquidity, and preferred terms differ materially. Without company-specific
              price and operating data, an aggressive buy case would be false precision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
      - number: '8.2'
        title: Thesis, anti-thesis, and conversion tests
        blocks:
          - type: paragraph
            body: >
              The bullish case is that Castelion can convert demonstrated flight-test activity and government interest
              into repeat procurement while its vertically integrated production model lowers unit cost and shortens
              cycle time. The company-issued financing release claims more than 20 development flight tests in 2025 and
              describes Blackbeard as engineered for industrial-rate output; independent reporting adds that the Army
              planned a prototype demonstration and ten minimum viable product prototypes, but it also says the company
              declined to discuss Blackbeard's associated price tag. The anti-thesis is that production commissioning,
              qualification, supplier scale, and government budget gates could consume capital before a durable backlog
              and attractive gross margin emerge. Project Ranger's schedule is ambitious: the state release says the
              first building was expected in summer and all 21 buildings ready for production by end-2026, while the
              release was later updated from a $150 million to a $220 million investment figure. That revision
              reinforces the need to verify capex, completion, yield, and commissioning rather than infer operating
              leverage. The decision should move upward only after management provides a financing cap table,
              award-to-revenue bridge, backlog composition, unit economics, and evidence that test success converts into
              funded production orders.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >
              Scenario analysis should be framed as conditional operating milestones rather than invented valuation
              outputs. In the bull case, Blackbeard clears the reported prototype and flight-test gates, Project Ranger
              commissions on schedule, and multi-service demand produces repeatable funded production; in the base case,
              technical progress continues but procurement conversion and factory economics remain unproven; in the bear
              case, testing, qualification, schedule, or funding delays extend the period before meaningful revenue and
              force a down round or additional preferred capital. The available comparable evidence is useful for
              framing market appetite but cannot establish a multiple for Castelion: Shield AI's disclosed financing
              includes both priced Series G equity and fixed-return preferred financing, and Reuters' Anduril report
              explicitly says terms, structure, pricing, and timing were speculative and denied by the company. Exit
              readiness is therefore low from a public-evidence standpoint. The next diligence package should include
              the current valuation and capitalization table, liquidation preferences and seniority, cash and burn,
              contract ceiling versus funded backlog, milestone acceptance criteria, production yield and unit cost,
              Project Ranger commissioning evidence, and customer concentration. Thesis-break triggers are a failed or
              materially delayed flight-test program, inability to fund commissioning without punitive terms, or absence
              of funded procurement after successful demonstrations.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV007
              - CV013
              - CV014
              - CV018
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track pending price discovery
            body: >-
              Castelion's public evidence supports strategic relevance and milestone progress, but the absence of a
              current valuation, revenue denominator, cash profile, and preference terms makes a precise return case
              unavailable.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV018
          - type: callout
            title: Conversion is the key uncertainty
            body: >-
              Army testing plans and company production claims are not the same as funded, accepted, recurring
              procurement; diligence should prioritize award-to-revenue conversion and factory economics.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
