evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: Full executive roster, board composition, ownership, governance rights, and succession plan.
    whyItMatters: Key-person concentration and investor control cannot be assessed from one named executive.
    diligencePath: >-
      Obtain the capitalization table, board list, governance documents, executive biographies, and retention
      arrangements.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: cover-metrics
    missingEvidence: Current revenue, gross margin, cash, burn, runway, headcount, customer count, funded backlog, and debt terms.
    whyItMatters: These figures are necessary to assess operating scale, financing sufficiency, and valuation support.
    diligencePath: >-
      Request audited financials, monthly management accounts, headcount roster, customer schedule, backlog bridge, and
      credit agreement.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: access-blocked
    severity: material
    topic: contracts
    missingEvidence: Award-specific USAspending fields for obligations, ceiling, period of performance, and modifications.
    whyItMatters: Aggregate contract announcements cannot be reconciled to funded backlog or revenue without award-level data.
    diligencePath: >-
      Export the award record and transaction history directly from USAspending or obtain the underlying contract
      documents.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: Complete capitalization, investor ownership, board seats, liquidation preferences, and public incentive terms.
    whyItMatters: Named participation does not reveal economic control, preference overhang, or stakeholder downside protection.
    diligencePath: >-
      Review the post-money capitalization table, financing documents, board consents, credit terms, and incentive
      agreements.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: milestone-timeline
    missingEvidence: At least two additional dated early product, test, regulatory, or contract milestones.
    whyItMatters: >-
      Six supportable dates are insufficient to reconstruct an eight-event company timeline or measure schedule
      adherence.
    diligencePath: Obtain the corporate milestone log, test reports, award notices, and dated program reviews.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-gaps
    missingEvidence: >-
      Funded program documents and service-level acquisition budgets that separate Blackbeard quantities from
      aspirational or contingent demand.
    whyItMatters: >-
      Prospective missile quantities cannot be converted into serviceable market size or revenue without funded-account
      and option-level detail.
    diligencePath: >-
      Obtain current Navy and Army acquisition documents, budget exhibits, contract modifications, and option exercise
      history.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM008
  - type: private-evidence-only
    severity: material
    topic: market-gaps
    missingEvidence: >-
      Castelion's production yield, supplier capacity, unit economics, realized backlog conversion, and customer
      concentration.
    whyItMatters: >-
      Manufacturing economics and conversion determine whether a large defense-spending pool can translate into durable
      company capture and valuation support.
    diligencePath: Request a management data room with lot-level cost, yield, capacity, backlog, and customer/program schedules.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: conflicting-data
    severity: minor
    topic: financing
    missingEvidence: >-
      A primary financing announcement reconciling the reported $1 billion Series C, equity amount, revolving facility,
      and valuation.
    whyItMatters: Financing claims affect perceived ability to self-fund capacity but are not themselves market-size evidence.
    diligencePath: Reconcile investor and company financing documents against independent reporting in the next refresh.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable Castelion unit economics by missile lot, including price, cost, margin, options, and contract
      denominator.
    whyItMatters: >-
      Without a normalized price and cost basis, the affordability thesis cannot be compared with incumbent or FAMM
      alternatives.
    diligencePath: >-
      Request executed contract abstracts, lot economics, delivered-cost assumptions, and production-yield data from
      management or procurement records.
    relatedQuestionRefs:
      - QP002
      - QP004
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: qualification
    missingEvidence: >-
      Independent confirmation of Blackbeard qualification, test outcomes, integration milestones, and
      production-readiness gates.
    whyItMatters: Concept and framework evidence do not establish repeatable delivery or a durable switching-cost advantage.
    diligencePath: >-
      Obtain Navy and independent test documentation, acceptance criteria, integration schedule, and award-to-production
      conversion data.
    relatedQuestionRefs:
      - QP007
      - QP008
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      A complete classified and unclassified list of likely entrants, internal government programs, and allied
      suppliers.
    whyItMatters: The public pool may omit non-public competitors that influence procurement and pricing.
    diligencePath: >-
      Review solicitation notices, budget documents, congressional materials, and customer interviews for the relevant
      weapon programs.
    relatedQuestionRefs:
      - QP001
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, monthly operating burn, runway, debt, preferred terms, and committed financing facilities.
    whyItMatters: >-
      A large funding round and planned facility investment do not show whether the company can fund production and
      testing through the 2028 EOC target.
    diligencePath: >-
      Request the latest management accounts, 24-month cash forecast, cap table, debt schedule, and financing
      commitments under NDA.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: Contract-by-contract backlog, delivery milestones, acceptance terms, recognized revenue, and cash collections.
    whyItMatters: The reported Navy order is a contract value, not a revenue run rate or proof of conversion into collected cash.
    diligencePath: >-
      Obtain the prime-contract schedule, revenue-recognition memo, billing milestones, backlog aging, and customer
      acceptance records.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Material cost, yield, labor, supplier, test-failure, warranty, and overhead data by production lot.
    whyItMatters: >-
      The stated affordability strategy depends on repeatable unit economics at scale, which public sources do not
      demonstrate.
    diligencePath: >-
      Request a unit-cost bridge from bill of materials through delivered round, including yield and rework by
      flight-test and production-intent lots.
    relatedQuestionRefs:
      - QI003
      - QI009
  - type: missing-source
    severity: material
    topic: reliability
