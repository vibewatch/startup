    whyItMatters: The product thesis depends on repeatable performance, not only successful demonstrations or a count of tests.
    diligencePath: >-
      Request configuration-controlled flight-test reports, failure reviews, corrective actions, and acceptance criteria
      from Castelion and the relevant services.
