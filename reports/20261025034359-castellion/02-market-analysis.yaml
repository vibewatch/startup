  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-gaps
      missingEvidence: Funded program documents and service-level acquisition budgets that separate Blackbeard quantities from aspirational or contingent demand.
      whyItMatters: Prospective missile quantities cannot be converted into serviceable market size or revenue without funded-account and option-level detail.
      diligencePath: Obtain current Navy and Army acquisition documents, budget exhibits, contract modifications, and option exercise history.
      relatedQuestionRefs: [QM003, QM004, QM008]
    - type: private-evidence-only
      severity: material
      topic: market-gaps
      missingEvidence: Castelion's production yield, supplier capacity, unit economics, realized backlog conversion, and customer concentration.
      whyItMatters: Manufacturing economics and conversion determine whether a large defense-spending pool can translate into durable company capture and valuation support.
      diligencePath: Request a management data room with lot-level cost, yield, capacity, backlog, and customer/program schedules.
      relatedQuestionRefs: [QM007, QM008]
    - type: conflicting-data
      severity: minor
      topic: financing
      missingEvidence: A primary financing announcement reconciling the reported $1 billion Series C, equity amount, revolving facility, and valuation.
      whyItMatters: Financing claims affect perceived ability to self-fund capacity but are not themselves market-size evidence.
      diligencePath: Reconcile investor and company financing documents against independent reporting in the next refresh.
      relatedQuestionRefs: [QM007]
