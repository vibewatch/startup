chapter:
  number: 2
  title: Market Analysis
  summary: Castelion addresses a defense-procurement market where rising military expenditure and an explicit U.S. demand signal favor affordable, scalable strike systems. Public evidence supports a large spending context and meaningful program pathways, but does not isolate Castelion's serviceable market, unit economics, or realized procurement revenue.
sections:
  - id: market-boundary
    title: Market boundary and demand architecture
    body: >-
      The relevant market is not all defense spending and not all hypersonic research. It is the
      procurement of operationally relevant, long-range strike and related air-defense systems,
      including engineering, testing, production, logistics, and sustainment purchased primarily
      by national defense ministries and military services. NATO defines defense expenditure broadly
      enough to include armed forces, stockpiled war reserves, operations, and research and
      development, while excluding civil defense and war-damage payments. That boundary is useful
      as a top-down context but overstates Castelion's addressable spend because it includes
      pensions, infrastructure, non-strike forces, and unsuccessful R&D. The narrower buyer job is
      affordable, repeatable kinetic capacity that can be tested, validated, procured, and surged.
      Status-quo substitutes include exquisite low-volume missiles, legacy cruise and ballistic
      systems, prime-contractor programs, and retaining existing inventory; internal government
      development and other new entrants are additional alternatives.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-and-segments
    title: Sizing lenses and buyer segmentation
    body: >-
      Multiple lenses are necessary because no public source isolates a Castelion TAM, SAM, or
      SOM. SIPRI reports $2,887 billion of world military expenditure in 2025, with the 32 NATO
      members at $1,581 billion and the United States at $954 billion; these are macro budget
      pools, not missile-market revenue. A procurement-path lens is more decision-useful:
      the Department of War says it is seeking authorization and appropriations for more than
      12,000 Blackbeard missiles over five years, after testing and validation, and describes a
      minimum 500 missiles annually in a two-year multi-year contract with extension options.
      The latter figures are prospective demand signals rather than booked orders. Buyer ownership
      is concentrated in service acquisition executives and defense departments, while users are
      operational units and warfighters and payers are national governments. Adoption therefore
      depends on test results, program-of-record transition, appropriations, fixed-price execution,
      and production capacity rather than on ordinary commercial self-serve conversion.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002, TM003]
    figureRefs: [FM001]
  - id: drivers-and-constraints
    title: Adoption drivers, constraints, and valuation relevance
    body: >-
      Demand drivers are unusually visible: SIPRI records the eleventh consecutive year of global
      military-spending growth, the Department of War describes a deliberate effort to expand the
      munitions industrial base, and Castelion's Navy award funds 50 Early Operational Capability
      weapons while supporting transition toward a program of record. Castelion's proposed value
      proposition is affordability plus manufacturing rate: Naval News reports a target production
      cost below $500,000 per round and a range of up to 500 nautical miles, while the company
      describes Blackbeard as designed for industrial-rate output. Constraints are equally material:
      the prospective quantity signal is contingent on testing and validation; the Navy award is
      scheduled through August 2028; a New Mexico campus requires substantial construction and
      workforce execution; and public evidence does not disclose realized unit cost, yield,
      margins, backlog conversion, or the budget status of the larger quantity ambition. These
      unknowns limit what market growth can justify in valuation.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: []
  - id: market-gaps
    title: Evidence limits and diligence priorities
    body: >-
      The evidence supports a favorable demand environment but not a clean bottom-up market
      forecast. Public reporting gives competing valuation and financing information and describes
      several future weapons initiatives, yet it does not provide a complete serviceable-market
      definition by service, weapon class, geography, or procurement account. The most important
      diligence work is to obtain the current acquisition program documents, test and validation
      criteria, funded versus aspirational quantities, contract backlog and options, production
      yield and supplier capacity, and expected unit economics. Public award portals can be useful
      for transaction-level verification, but the retained USAspending fetch exposed a general data
      and disclosure page rather than award-specific fields, so it cannot support a precise award
      total here. The market thesis should therefore be treated as evidence-constrained: strong
      strategic demand signals, plausible volume expansion, and high execution and appropriation
      uncertainty.
    claimRefs: [CM015, CM016]
    tableRefs: []
callouts:
  - calloutType: insight
    title: Demand signal is stronger than disclosed market capture
    body: The public record supports defense-budget tailwinds and prospective Blackbeard volume, but it does not establish Castelion's realized share, revenue conversion, or profitability.
    claimRefs: [CM006, CM007, CM015]
  - calloutType: risk
    title: Validation and appropriations are gating events
    body: The largest public quantity figures are expressly conditional on testing, validation, authorization, and appropriations; they should not be treated as contracted revenue.
    claimRefs: [CM007, CM008, CM014]
