company:
  name: Castelion
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Castelion is a 2022-founded, Torrance-headquartered defense manufacturer pursuing
    lower-cost hypersonic weapons through private-capital-funded development and a
    purpose-built New Mexico production campus. Its August 2026 financing and conditional
    federal procurement pathway provide scale signals, but public evidence does not establish
    revenue, cash availability, production yield, board composition, or contract-to-revenue conversion.
sections:
  - id: identity-leadership-and-model
    title: Identity, leadership, and operating model
    body: >-
      Current independent reporting describes Castelion as a missile startup founded in 2022 by
      former SpaceX executives and headquartered in Torrance, California. Bryon Hargis is the only
      named executive in the retained chapter evidence: the New Mexico Economic Development
      Department and Army Technology identify him as co-founder and chief executive. The retained
      sources do not name the full founding team, board, chief financial officer, chief operating
      officer, or independent directors, so governance coverage is partial rather than an exhaustive
      management roster. The operating thesis is to develop and manufacture lower-cost hypersonic
      strike weapons faster and at higher volume than traditional programs, with Blackbeard as the
      disclosed lead system. That strategy sits inside a large defense-spending environment—SIPRI
      reported $2.887 trillion of global military expenditure in 2025—yet category spending is not
      evidence of Castelion revenue or market share. The public profile therefore supports founder-
      market fit in aerospace engineering and manufacturing, while leaving key-person concentration
      and functional leadership depth unresolved.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO002
  - id: capital-and-stakeholders
    title: Capital, valuation, and stakeholder concentration
    body: >-
      TechCrunch and Army Technology both reported an August 2026 Series C described as $1 billion
      at a $13 billion valuation. The disclosed components were $800 million of equity and a $250
      million revolving credit facility; because those components sum to $1.05 billion, the headline
      figure should be treated as a rounded, mixed-capital label rather than as equity raised or cash
      available. The syndicate spans venture, private-equity, strategic-investment, and public-markets
      capital: Andreessen Horowitz, Carlyle, and JPMorganChase's Strategic Investment Group were
      reported as co-leads, with Lightspeed, General Catalyst, Altimeter, Lavrock Ventures, Interlagos,
      and T. Rowe Price Associates also named. Public reporting also says Castelion secured more than
      $500 million in U.S. military contracts over the preceding 18 months, but that is an aggregate
      contract figure, not recognized revenue, funded backlog, or cash receipts. The fetched
      USAspending award page exposed generic data documentation rather than award-specific economics,
      so this chapter cannot independently reconcile that aggregate to obligations, ceilings, or
      revenue conversion.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO016
    tableRefs:
      - TO001
      - TO003
  - id: manufacturing-and-procurement-path
    title: Manufacturing build-out and procurement path
    body: >-
      Project Ranger is the physical center of the scaling plan. New Mexico's economic-development
      agency described a $220 million private investment on a 1,000-acre Sandoval County campus,
      with 21 buildings planned to be production-ready by the end of 2026 and 300 high-wage jobs
      expected. The disclosed activities include solid-rocket-motor production, static testing,
      component assembly, and finished-round assembly, indicating vertical integration beyond a
      design-only business. Army Technology reported a 2027 deployment target for Blackbeard.
      Demand visibility is meaningful but conditional: the Department of War said a two-year
      multi-year procurement contract for at least 500 Blackbeard missiles annually would follow
      successful testing and validation, with options extending to five years. Its separate objective
      to purchase more than 12,000 missiles over five years still depends on authorizations and
      appropriations. Those conditions distinguish a policy demand signal from a firm, funded order
      and make qualification, yield, schedule, and appropriations the critical conversion gates.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
    figureRefs:
      - FO001
  - id: diligence-implications-and-gaps
    title: Diligence implications and evidence limits
    body: >-
      The evidence establishes credible institutional sponsorship, a current financing event, a
      manufacturing footprint, and an explicit federal pathway toward high-volume procurement.
      It does not establish that prototype progress has converted into repeatable production or
      profitable delivery. CSIS cautions that industrial plans are not results and that prototype-
      stage commercial-first technologies have not yet demonstrated reliable throughput at scale;
      this is directly relevant to a company funding a large campus ahead of full-rate validation.
      Revenue, gross margin, cash balance, burn, runway, debt pricing and covenants, customer count,
      current headcount, funded backlog, contract mix, and cap-table control remain unavailable in
      the retained public evidence. Board composition and succession coverage are also undisclosed.
      The next diligence step is therefore documentary: obtain the capitalization table, board
      materials, credit agreement, award and obligation exports, program test schedule, factory
      commissioning plan, yield data, and a bridge from signed contract value to recognized revenue.
      Until then, the $13 billion valuation and federal demand objective indicate market confidence,
      not verified unit economics or execution.
    claimRefs:
      - CO006
      - CO008
      - CO010
      - CO015
      - CO016
