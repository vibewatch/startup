callouts:
  - calloutType: risk
    title: Demand signal is not contracted revenue
    body: >-
      The federal framework remains gated by testing and validation, and the larger five-year objective
      requires authorization and appropriations. Treat neither the stated procurement objective nor
      aggregate contract announcements as recognized revenue, funded backlog, or cash receipts.
    claimRefs:
      - CO010
      - CO015
      - CO016
