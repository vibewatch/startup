company:
  name: Castelion
chapter:
  number: 4
  title: Financials
  summary: Castelion's disclosed financial picture is a capital-intensive defense-manufacturing ramp rather than a transparent recurring-revenue business. Public evidence shows substantial external financing, a large Project Ranger investment, and a $89.997 million Navy order supporting 50 early-operational-capability weapons, but does not disclose revenue recognition, realized pricing, gross margin, cash, burn, or runway.
sections:
  - id: revenue-and-contract-conversion
    title: Revenue model and contract conversion
    body: Castelion appears to monetize long-cycle government defense programs rather than a subscription or transactional software model. The strongest public contract evidence is a $89,997,162 firm-fixed-price Navy order that supports engineering, technical, logistics, and manufacturing services for 50 Early Operational Capability weapons and transition toward a Navy Program of Record. That award is a booked contract value, not evidence of recognized revenue, cash collected, backlog conversion, or a steady run rate. A separate report says Blackbeard is intended for industrial-rate output and a target production cost below $500,000 per round, but that is a reported target and should not be treated as realized unit economics. The assigned USAspending award URL did not expose award-specific value or obligation fields in its fetched text, so it does not independently corroborate the reported order. Public materials do not disclose the share of development, production, logistics, or sustainment revenue, delivery milestones, acceptance terms, change-order exposure, or customer concentration. Underwriting therefore requires contract-level revenue schedules and a reconciliation from obligations to recognized revenue and cash receipts.
    claimRefs: [CI001, CI002, CI003, CI004, CI016]
    tableRefs: [TI001, TI002]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: "The operating model is manufacturing-heavy: Project Ranger is described as a 1,000-acre campus for solid rocket motors, static testing, component assembly, and finished rounds, while other reporting describes operations in New Mexico, California, and Texas. Castelion has said the New Mexico campus will require $220 million of private investment and include 21 buildings ready for production by the end of 2026; another account describes a 22-building campus and a $125 million industrial-revenue-bond package plus $10 million in economic-development funds. These figures describe planned or supported capacity, not expense incurred, depreciation, working capital, or gross margin. Public sources do not provide material costs, labor productivity, scrap or yield, supplier terms, warranty exposure, test-failure costs, or fixed-cost absorption at different production volumes. The key economic question is whether scale lowers cost per round without creating a large pre-revenue cash trough."
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: []
  - id: capital-adequacy-and-underwriting
    title: Capital adequacy and underwriting blockers
    body: "The December 2025 financing report says Castelion raised $350 million in Series B funding to accelerate Blackbeard production and Project Ranger, while the current Navy order provides a visible program milestone through August 2028. The financing should be treated as capital raised, not cash currently available: the public evidence does not show cash on hand, committed but undrawn facilities, monthly burn, debt, preferred terms, or the amount already spent on the New Mexico buildout. The New Mexico economic-development release calls the campus a $220 million private investment and says all buildings are expected to be production-ready by the end of 2026, but neither source provides a cash-flow schedule. This leaves a financing dependency: additional equity, customer advances, milestone payments, or debt may be needed before production and government conversion generate self-funding cash. A decision should remain conditional on a monthly cash bridge, program-by-program backlog, delivery acceptance, and financing terms."
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict
    body: Castelion has credible demand-side signals and a potentially meaningful defense-program foothold, but the financial underwriting case remains incomplete. The $89.997 million Navy order and the reported $350 million financing establish external validation and funding capacity, while the Project Ranger buildout demonstrates substantial capital intensity. They do not establish recurring revenue, contribution margin, cash runway, or a proven ability to produce at the stated target cost. Lockheed Martin, Northrop Grumman, and L3Harris maintain public annual-report or investor-financial pages; the assigned evidence contains no comparable audited financial package for Castelion. The most decision-relevant diligence is a contract waterfall from award to revenue and cash, a current cash-and-burn schedule, unit-cost and yield data for flight-tested and production-intent rounds, and the financing plan through the 2028 EOC target. Until those are available, financial confidence should remain medium and valuation should not be underwritten from funding headlines or a single contract value.
    claimRefs: [CI001, CI003, CI005, CI010, CI014, CI015]
    figureRefs: [FI001]
callouts:
  - calloutType: strength
    title: Government conversion signal
    body: The Navy order funds 50 EOC weapons and work toward a Navy Program of Record, which is stronger than an undifferentiated concept-stage announcement but still leaves delivery, acceptance, and recognized-revenue timing unresolved.
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Cash visibility is the central blocker
    body: Public sources identify funding and planned capital investment but do not disclose cash on hand, burn, runway, debt, or preference terms; capital adequacy cannot be concluded from the $350 million round alone.
    claimRefs: [CI010, CI011, CI012]
  - calloutType: recommendation
    title: Underwrite the contract-to-cash bridge
    body: Request monthly cash forecasts, contract award and acceptance schedules, production cost by lot, and financing commitments before treating the reported award or facility investment as revenue quality or margin evidence.
    claimRefs: [CI003, CI008, CI013, CI014]
