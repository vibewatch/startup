  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: "Current cash, monthly operating burn, runway, debt, preferred terms, and committed financing facilities."
      whyItMatters: "A large funding round and planned facility investment do not show whether the company can fund production and testing through the 2028 EOC target."
      diligencePath: "Request the latest management accounts, 24-month cash forecast, cap table, debt schedule, and financing commitments under NDA."
      relatedQuestionRefs: [QI006]
    - type: missing-source
      severity: material
      topic: revenue
      missingEvidence: "Contract-by-contract backlog, delivery milestones, acceptance terms, recognized revenue, and cash collections."
      whyItMatters: "The reported Navy order is a contract value, not a revenue run rate or proof of conversion into collected cash."
      diligencePath: "Obtain the prime-contract schedule, revenue-recognition memo, billing milestones, backlog aging, and customer acceptance records."
      relatedQuestionRefs: [QI001, QI002, QI008]
    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: "Material cost, yield, labor, supplier, test-failure, warranty, and overhead data by production lot."
      whyItMatters: "The stated affordability strategy depends on repeatable unit economics at scale, which public sources do not demonstrate."
      diligencePath: "Request a unit-cost bridge from bill of materials through delivered round, including yield and rework by flight-test and production-intent lots."
      relatedQuestionRefs: [QI003, QI009]
