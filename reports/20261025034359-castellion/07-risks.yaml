company:
  name: Castelion
chapter:
  number: 7
  title: Risks
  summary: Castelion's public evidence shows meaningful defense-program traction and a large manufacturing buildout, but the principal risks remain execution at hazardous facilities, community and environmental acceptance, dependency on government procurement, and limited public visibility into economics and award conversion.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis-break conditions
    body: Castelion's strongest public risk signal is not a recorded accident; it is the combination of hazardous-material process obligations, a new 1,000-acre production campus, and public concern about blast radius, water use, transparency, and emergency response. The company describes vertical integration, rapid testing, and scaled manufacturing as ways to reduce risk, while the New Mexico project is still moving through construction and readiness milestones. A thesis break would be a material safety or environmental event, a missed production-readiness milestone, or a government award that does not convert into repeatable deliveries. These are monitorable conditions, not conclusions that an incident has occurred.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, legal, and community exposure
    body: The regulatory burden is structural. OSHA describes process safety management as a comprehensive program for hazards associated with highly hazardous chemicals, and EPA states that facilities using extremely hazardous substances may need a Risk Management Plan under the Clean Air Act's Risk Management Program. Those requirements do not establish that Castelion is subject to a particular filing or that it is noncompliant; they define the diligence perimeter for a solid-rocket-motor facility. Independent local reporting adds unresolved community questions about emergency scenarios, ammonium perchlorate, water, and disclosure. The material risk is therefore permitting, compliance, and social-license delay until facility-specific approvals and emergency plans are verified.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: operations-dependencies
    title: Operational, quality, and dependency risk
    body: Castelion's operating model depends on converting prototype and early-operational work into reliable, repeatable production while completing a new campus. Its own site says systems are designed for manufacturability and that core technologies are vertically integrated, but those statements are company claims rather than independent yield, defect, throughput, or supplier data. The New Mexico economic-development release says the campus will contain 21 buildings and be ready for production by the end of 2026, creating a clear schedule dependency. The Navy awards disclosed by Castelion show customer traction, yet public evidence in this pool does not disclose acceptance testing, delivery performance, margins, or backlog conversion.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: diligence-and-kill
    title: Mitigations, monitoring, and diligence asks
    body: Public mitigations include static testing rather than launches at the New Mexico site, company assertions that no chemical synthesis will occur there, federal process-safety and accident-prevention frameworks, and a stated design emphasis on manufacturability. These measures reduce exposure only if facility-specific controls, emergency response, workforce qualifications, supplier redundancy, quality records, and customer acceptance evidence are effective. The investment implication is to track rather than underwrite the execution case on narrative alone. The next diligence package should require permits, process-hazard analyses, RMP or exemption rationale, insurance, incident logs, schedule and yield dashboards, supplier concentration, government contract line items, and cash funding for the campus.
    claimRefs: [CR013, CR014, CR015, CR016]
