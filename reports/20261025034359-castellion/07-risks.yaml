      - [Project Ranger schedule and production readiness, medium, high, early-stage, high, "Campus or qualification milestone slips beyond the disclosed 2026 readiness target"]
      - [Government procurement and award-to-delivery conversion, medium, high, limited-public, high, "Orders fail acceptance or do not convert to repeat production"]
      - ["Community, environmental, and permitting acceptance", medium, high, partial-public, medium-high, "Permit challenge, material violation, or unresolved emergency/water objection"]
    notes: "Risk ratings are analytical assessments based on the cited public evidence; likelihood and residual exposure are not company-provided probabilities. Null or undisclosed operating data should be requested rather than inferred."
    claimRefs: [CR001, CR003, CR004, CR007, CR010, CR011]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule, jurisdiction, status, likelihood, severity, mitigation, residual exposure, diligence path]
    rows:
      - [OSHA Process Safety Management, United States, framework identified; facility applicability not confirmed, medium, very high, "Implement and audit process-safety program", high, "Obtain applicability analysis, PHA, operating procedures, training, and inspection records"]
      - [EPA Risk Management Program, United States, rule and five-year resubmission framework identified; facility status not confirmed, medium, high, "Confirm covered-substance inventory and emergency-preparedness controls", medium-high, "Obtain RMP, exemption rationale, or agency correspondence"]
      - ["Local land-use, safety, and environmental approvals", "Sandoval County / Rio Rancho", "public approval and meetings reported; complete permit file not reviewed", medium, high, "Public meetings and disclosed site controls", medium-high, "Review permits, conditions, appeals, water analysis, and emergency-response agreements"]
    enumerationScope:
      coverage: sample
      basis: "Public federal guidance and two local reports reviewed for the 2025-2026 Project Ranger and facility-risk perimeter."
    notes: "This is a public-source risk-register sample, not a legal opinion or exhaustive permit inventory. Status describes what the retained sources establish, not a finding of compliance."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Operational / quality / security and dependency risk register
    columns: [Failure mode or dependency, counterparty or role, likelihood, severity, mitigation maturity, residual exposure, unresolved gap]
    rows:
      - [Campus construction and commissioning delay, Project Ranger production campus, medium, high, early-stage, high, "No independent commissioning, yield, or readiness evidence in the pool"]
      - [Rocket-motor process or quality failure, facility and responders, medium, very high, partial-public, high, "No facility-specific process-hazard, defect, or incident record reviewed"]
      - [Supplier and vertical-integration dependency, critical suppliers and internal processes, medium, high, company-claimed, medium-high, "Supplier redundancy and single-source exposure are undisclosed"]
      - [Government acceptance or delivery shortfall, U.S. Navy / Department of Defense, medium, high, limited-public, high, "Award line items do not show acceptance, delivery, or repeat-order performance"]
      - [Public infrastructure and approvals, Sandoval County / New Mexico agencies, medium, high, partial-public, medium-high, "Bond, incentive, permit, or community support changes"]
      - [Hazardous-process oversight, OSHA / EPA and local responders, medium, very high, partial-public, high, "Noncompliance or inadequate response capacity halts operations"]
    notes: "Operational ratings distinguish company design claims from independently verified performance. The retained public material does not provide a denominator for defect rates, yield, delivery timeliness, supplier concentration, or dependency concentration."
    claimRefs: [CR005, CR006, CR009, CR010, CR011, CR012, CR013, CR015]
