callouts:
  - calloutType: risk
    title: Safety evidence is a diligence gate
    body: Federal process-safety and accident-prevention frameworks define the control perimeter, but the retained evidence does not verify Castelion's facility-specific compliance, emergency planning, or incident history.
    claimRefs: [CR005, CR006, CR008]
  - calloutType: assumption
    title: Award traction is not delivery proof
    body: Castelion disclosed Navy orders, but this pool does not establish acceptance, production yield, delivery timing, backlog composition, or margin; those should remain explicit diligence asks.
    claimRefs: [CR010, CR011, CR012]
