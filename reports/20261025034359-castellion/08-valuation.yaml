    notes: "Rows combine company-claimed, government-hosted, and independent reporting; financing amount is not treated as cash currently available."
    claimRefs: [CV004, CV007, CV008, CV009]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Flight tests convert to funded multi-service production; Project Ranger commissions on schedule; unit cost and yield improve.", "Potential re-rating toward high-growth defense-tech comparables, but no numeric range is supportable.", "Low-to-medium; requires several unverified gates.", "Failed qualification, delayed commissioning, or no repeat orders."]
      - [Base, "Technical milestones continue, but procurement conversion and economics remain opaque.", "Track until a price, revenue denominator, and financing terms are disclosed.", "Highest on current evidence.", "Capital needs rise before funded production."]
      - [Bear, "Testing, qualification, factory ramp, or procurement slips; further capital is needed on unattractive terms.", "Down-round, preference overhang, and dilution risk dominate; no numeric loss estimate is supportable.", "Material; public evidence does not resolve execution risk.", "No funded production after demonstrations."]
      - [Comparable frame, "Shield AI disclosed $12.7B post-money; Anduril reports cite $61B and possible $100B marks; Lockheed Martin market cap was $139.56B in October 2026.", "Use only as market-context anchors; do not apply their multiples to Castelion.", "Not a Castelion probability.", "Comparable mix or terms prove non-comparable."]
    notes: "Scenarios are conditional qualitative cases. No Castelion valuation range is supplied because valuation, revenue, margin, cash, and preference inputs are unavailable."
    claimRefs: [CV005, CV006, CV012, CV013, CV014, CV015, CV016, CV017, CV018]
