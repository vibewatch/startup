chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a strategic-growth thesis for Castelion, but it does not disclose a current company valuation, revenue base, margin profile, cash balance, or preference stack. The appropriate posture is track/research-more until award conversion, production economics, and financing terms are verified.
sections:
  - id: investment-view
    title: Investment view and entry discipline
    body: >
      Castelion has credible strategic demand signals and a financing-backed plan to industrialize hypersonic production, but the public record remains much stronger on milestones than on investor economics. The Series B announcement says the capital supports Blackbeard integration, Project Ranger, and multi-service testing in 2026, while the New Mexico Economic Development Department describes a $220 million private investment and a 1,000-acre campus. Those are evidence of committed deployment and execution ambition, not evidence of revenue, gross margin, cash runway, or a priced equity valuation. The Army-related evidence is also milestone-based: Breaking Defense reports a planned $25 million FY26 Blackbeard development effort, a proof-of-concept phase, and possible early-FY28 deliveries, with price undisclosed. That combination supports a strategic option value thesis but not a precise mark. Comparable public and private defense-technology observations show a wide dispersion: Lockheed Martin had a $139.56 billion market capitalization in October 2026; TechCrunch reports that Anduril raised $5 billion in May at a $61 billion valuation and separately relays a Reuters report of possible financing at about $100 billion; Shield AI announced a $12.7 billion post-money valuation. These are comparables, not Castelion marks; business mix, maturity, backlog, margins, liquidity, and preferred terms differ materially. Without company-specific price and operating data, an aggressive buy case would be false precision.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and conversion tests
    body: >
      The bullish case is that Castelion can convert demonstrated flight-test activity and government interest into repeat procurement while its vertically integrated production model lowers unit cost and shortens cycle time. The company-issued financing release claims more than 20 development flight tests in 2025 and describes Blackbeard as engineered for industrial-rate output; independent reporting adds that the Army planned a prototype demonstration and ten minimum viable product prototypes, but it also says the company declined to discuss Blackbeard's associated price tag. The anti-thesis is that production commissioning, qualification, supplier scale, and government budget gates could consume capital before a durable backlog and attractive gross margin emerge. Project Ranger's schedule is ambitious: the state release says the first building was expected in summer and all 21 buildings ready for production by end-2026, while the release was later updated from a $150 million to a $220 million investment figure. That revision reinforces the need to verify capex, completion, yield, and commissioning rather than infer operating leverage. The decision should move upward only after management provides a financing cap table, award-to-revenue bridge, backlog composition, unit economics, and evidence that test success converts into funded production orders.
    claimRefs: [CV007, CV008, CV009, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence asks
    body: >
      Scenario analysis should be framed as conditional operating milestones rather than invented valuation outputs. In the bull case, Blackbeard clears the reported prototype and flight-test gates, Project Ranger commissions on schedule, and multi-service demand produces repeatable funded production; in the base case, technical progress continues but procurement conversion and factory economics remain unproven; in the bear case, testing, qualification, schedule, or funding delays extend the period before meaningful revenue and force a down round or additional preferred capital. The available comparable evidence is useful for framing market appetite but cannot establish a multiple for Castelion: Shield AI's disclosed financing includes both priced Series G equity and fixed-return preferred financing, and Reuters' Anduril report explicitly says terms, structure, pricing, and timing were speculative and denied by the company. Exit readiness is therefore low from a public-evidence standpoint. The next diligence package should include the current valuation and capitalization table, liquidation preferences and seniority, cash and burn, contract ceiling versus funded backlog, milestone acceptance criteria, production yield and unit cost, Project Ranger commissioning evidence, and customer concentration. Thesis-break triggers are a failed or materially delayed flight-test program, inability to fund commissioning without punitive terms, or absence of funded procurement after successful demonstrations.
    claimRefs: [CV013, CV014, CV015, CV016, CV017, CV018]
    tableRefs: [TV003]
    figureRefs: [FV001]
