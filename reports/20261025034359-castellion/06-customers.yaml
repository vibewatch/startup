  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Castelion has credible early government and partner adoption signals, including a reported Navy production order, an Air Force development award, and a planned Saronic integration. The public record still does not establish customer breadth, recurring procurement, retention, or award-to-revenue conversion."
  },
  "sections": [
    {
      "id": "customer-segments",
      "title": "Who pays, uses, and integrates the system",
      "body": "The visible customer base is concentrated in U.S. government defense programs, with partners serving as integration channels rather than ordinary commercial accounts. Castelion reports more than $500 million in U.S. military contracts over the 18 months before its Series C announcement, while the SBIR record provides a primary example of an Air Force-sponsored development award. Independent reporting identifies a first Navy Blackbeard production order, but the public title does not disclose quantity, delivery timing, or whether the order is a pilot lot. Saronic adds a distinct partner-led surface: its Marauder vessel is intended to host a future Blackbeard demonstration. This segmentation supports strategic relevance, not a diversified recurring-revenue customer base.",
      "claimRefs": [
        "CU002",
        "CU003",
        "CU004",
        "CU007",
        "CU012"
      ],
      "tableRefs": [
        "TU001"
      ]
    },
    {
      "id": "adoption-trajectory",
      "title": "Adoption trajectory and delivery readiness",
      "body": "The adoption trajectory moves through several non-equivalent stages. The Air Force SBIR award is a dated development contract whose abstract emphasizes demonstrating a scalable, cost-focused manufacturing approach and flight testing. Castelion says Blackbeard reached program-of-record status in under four years and targets fielding in 2027, while the independent Navy-order headline is a stronger production signal but still lacks lot and delivery detail. Project Ranger is described by New Mexico as a large campus with planned manufacturing and test functions, which could support delivery capacity. None of these milestones is a disclosed active-account, renewal, utilization, or revenue-recognition metric. Investors should therefore treat contract and production language as evidence of procurement access, not proof of durable customer economics.",
      "claimRefs": [
        "CU004",
        "CU005",
        "CU006",
        "CU009",
        "CU010",
        "CU011"
      ],
      "tableRefs": [
        "TU002"
      ],
      "figureRefs": [
        "FU001"
      ]
    },
    {
      "id": "named-proof-and-expansion",
      "title": "Named proof and expansion paths",
      "body": "Named proof is strongest where a source identifies a government program or a concrete integration. The SBIR.gov record names Castelion Corporation, the Air Force branch, the award amount, and the technical objective. The Defense Post headline identifies the Navy as the first reported Blackbeard production-order customer. Breaking Defense describes Saronic and Castelion planning a Marauder integration and a 2027 maritime launch demonstration, while also noting that Marauder was still in on-water trials and that follow-on production depends on successful testing. These facts show an expansion path from development to production and then to partner deployment, but the last step remains contingent. The customer thesis is strategically credible yet commercially under-measured.",
      "claimRefs": [
        "CU003",
        "CU004",
        "CU007",
        "CU008",
        "CU014"
      ],
      "tableRefs": [
        "TU003"
      ]
    },
    {
      "id": "retention-concentration-gaps",
      "title": "Retention, concentration, and diligence gaps",
      "body": "Public evidence does not disclose net revenue retention, gross retention, churn, contract length, cohort behavior, active customer count, backlog composition, or revenue by customer. The available signals also appear concentrated in U.S. government demand and a small set of defense-technology relationships, although the assigned sources do not provide a denominator sufficient to quantify concentration. A future maritime demonstration may broaden the platform surface, but it is not yet evidence of repeat procurement. The key diligence task is to reconcile award notices and production orders to delivered units, recognized revenue, renewal or follow-on awards, and customer acceptance. Until that bridge is available, customer durability should remain an open question rather than an assumed strength.",
      "claimRefs": [
        "CU012",
        "CU013",
        "CU014"
      ],
      "tableRefs": []
    }
  ],
