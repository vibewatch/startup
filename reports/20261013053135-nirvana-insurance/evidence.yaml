evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited GAAP income statements, balance sheets, statutory loss ratios, net earned premiums, and treaty-year
      commission reconciliations for Nirvana Insurance Services.
    whyItMatters: >-
      Without statutory or GAAP financial statements, Nirvana's claimed top-decile underwriting performance and $1.5
      billion valuation cannot be independently validated.
    diligencePath: >-
      Request confidential audited financials, AM Best rating reports, fronting-carrier remittance statements, and
      reinsurance treaty loss-ratio exhibits under NDA.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independently audited state-by-state commercial auto premium datasets showing exact market share of
      telematics-underwritten policies.
    whyItMatters: >-
      Obscures whether Nirvana's growth reflects structural category creation or displacement of traditional regional
      mutual insurers.
    diligencePath: >-
      Cross-reference NAIC statutory annual statements across Nirvana's underlying fronting carriers (MS Transverse and
      SiriusPoint) to isolate written premiums in commercial auto lines.
    relatedQuestionRefs:
      - QM009
  - type: access-blocked
    severity: minor
    topic: broker-economics
    missingEvidence: >-
      Transparent subproducer commission schedules comparing Nirvana's agency splits against legacy commercial auto
      carriers like Progressive Commercial.
    whyItMatters: >-
      Broker commissions dictate agent willingness to steer clean fleet risks toward Nirvana over entrenched incumbent
      markets.
    diligencePath: >-
      Request standard producer agreements and commission schedules directly from licensed commercial retail
      transportation agencies.
  - type: private-evidence-only
    severity: material
    topic: competitors
    missingEvidence: >-
      Audited cohort-level loss ratios and renewal retention rates for Nirvana versus competing telematics MGAs (Cover
      Whale, HDVI).
    whyItMatters: >-
      Without peer loss-ratio benchmarking across matched mileage and fleet size cohorts, durability of Nirvana's
      underwriting edge over competing MGAs cannot be independently confirmed.
    diligencePath: Request actuarial treaty-year loss triangles and broker renewal retention reports under NDA during diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: loss-performance
    missingEvidence: >-
      Audited GAAP income statement, recognized net commission revenue, net earned premium (NEP), and historical
      loss-ratio triangle development by policy vintage.
    whyItMatters: >-
      Without segmented statutory or audited GAAP financials, investors cannot verify whether rapid written premium
      expansion is generating profitable net commission income or masking underwriting losses.
    diligencePath: >-
      Request audited financial statements for Nirvana Insurance Services and fronting carrier treaty-year settlement
      statements under NDA.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: reinsurance-capacity
    missingEvidence: >-
      Reinsurance treaty terms, quota-share retention rates, ceding commission percentages, and contingent commission
      true-up schedules.
    whyItMatters: >-
      As an MGA, Nirvana's operating cash flow and capacity headroom are highly sensitive to reinsurance treaty
      economics and reinsurer renewal appetite in hardening reinsurance markets.
    diligencePath: >-
      Review master reinsurance agreements, fronting fee schedules with MS Transverse and SiriusPoint, and ceding
      commission schedules.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: developer-surfaces
    missingEvidence: >-
      Public developer documentation, OpenAPI specifications, SDK repositories, or public developer community forums for
