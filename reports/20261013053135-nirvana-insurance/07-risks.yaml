callouts:
  - calloutType: risk
    title: The Rented Balance Sheet Dilemma
    body: >-
      As an MGA, Nirvana does not hold insurance risk on its balance sheet. Its commercial auto underwriting capacity is
      rented from fronting carriers MS Transverse and SiriusPoint and backed by reinsurance panels. If catastrophic
      nuclear verdicts or deteriorating loss ratios impair underwriting results, reinsurers can rapidly increase ceding
      rates or withdraw capacity, threatening Nirvana's core operating model.
    claimRefs:
      - CR001
      - CR006
      - CR008
  - calloutType: insight
    title: Mid-Term Rate Locks versus Severe Commercial Auto Tails
    body: >-
      Guaranteeing rate stability for full policy terms insulates motor carriers from mid-term rate hikes, building
      fleet loyalty. However, in an industry plagued by 13 consecutive years of underwriting losses and soaring
      litigation payouts, locking rates eliminates Nirvana's ability to adjust pricing dynamically when fleet risk
      profiles deteriorate during the term.
    claimRefs:
      - CR003
      - CR009
      - CR011
