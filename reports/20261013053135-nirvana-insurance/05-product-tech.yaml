    body: "Nirvana's primary technological differentiation lies in its proprietary data pipeline harmonizing 30 billion miles of telematics observations to offer upfront discounts and rapid quoting. However, commercial auto underwriting profitability is ultimately determined by long-tail bodily-injury litigation, defense costs, and social inflation, which cannot be eliminated by front-end software speed alone."
