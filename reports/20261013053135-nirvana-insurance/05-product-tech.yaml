      - "CE006"
      - "CE013"
  - calloutType: "risk"
    title: "Privacy Promise and Camera Utilization Boundaries"
    body: "Nirvana balances telematics data collection with strict privacy boundaries: camera footage is not utilized for quoting, billing, or real-time surveillance, but is accessed exclusively during claims resolution. This policy reassures fleets and drivers against intrusive monitoring, though it limits real-time preventative intervention during transit."
