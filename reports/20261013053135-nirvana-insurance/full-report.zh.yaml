        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Nirvana Insurance 通过 Nirvana Insurance Services（NIS）以 MGA 方式运营，而非全栈、承担风险的承保机构。在这一架构下，公司的主要营收经济引擎是按 ASC 606
              确认的佣金收入，来自分销和服务由前置承保机构及再保险能力提供商支持的保单。投保人支付商业车险毛保费——在小型车队卡车市场中，每辆车传统上平均为 $15,000 至 $20,000——Nirvana
              则根据联网电信传感器和 AI 行车摄像头显示的更佳安全状况，提供最高 20% 的前置折扣。关键在于，Nirvana 将保单保费锁定在完整的 12
              个月期限内，确保费率稳定，消除孤立事故报告后中期定价突然上升。自动化月度计费进一步降低了薄现金利润率小车队运营者的行政摩擦。除基础分保佣金外，Nirvana
              的经济模式还瞄准或有利润佣金，该佣金取决于其承保业务在协议年度维持有利的损失率。
