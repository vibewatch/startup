  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 商业车险市场边界与电信颠覆
        blocks:
          - type: paragraph
            body: >-
              商业车险是国内货运运输经济不可或缺的监管与运营基础。所有从事州际商业运输的商业运输车队，都必须依法维持主要责任险，以保护第三方免受人身伤害和财产损失。历史上，传统承保机构把商业车险视为模拟化、同质化的资产负债表业务，承保决策依赖静态的三年历史损失记录、交通运输部安全快照评级和宽泛的车队分类平均值。Nirvana
              Insurance 并非以承担风险的全栈保险资产负债表进入这一市场，而是通过专门的 MGA 架构，将承保技术、电信分析和保单管理与底层资本风险隔离。按此模式，保单由 Nirvana 发起、定价和服务，使用 AM
              Best A 级承保机构的保险凭证，由 MS Transverse、SiriusPoint
              等前置机构支持，并将灾难性风险分出到全球再保险协议。该项目化边界隔离了传统保险公司的资本拖累，同时将承保范围严格限制在商业车辆责任险和物理损害险，主动避开货运、仓储法律责任和工伤补偿等相邻货运险种。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 从不同口径衡量商业车队机会
        blocks:
          - type: paragraph
            body: >-
              评估 Nirvana 的商业市场机会，需要把宏观保险数据拆成经过校准的运营可触达层级。尽管商业财产与意外险行业整体每年国内保费规模超过万亿美元，商业汽车责任险和物理损害险这一细分线每年约为 $50B 至
              $65B。在这一可服务总市场中，市场结构高度碎片化：美国超过 90% 的商业运输车队拥有的动力单元少于 50 台。对这些小企业运营者而言，商业车险年保费通常占每辆牵引车 $15,000 至
              $20,000，风险转移因此成为仅次于柴油和司机工资的最大单项现金运营支出之一。Nirvana 的可服务市场聚焦于这一中小型车队群体：传统损失率波动迫使现有承保机构收缩业务或提高定价。Nirvana
              重点服务在其当前获准的 26 至 27 个州运营的非危险干货厢、冷藏和平板车运输商，锁定数十亿美元的即时可触达保费池，并在 2025 年底 D 轮融资前将书面保费做过 $100M。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
