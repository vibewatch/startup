chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Nirvana Insurance 于 2021 年初成立，总部位于加州旧金山。公司通过 Nirvana Insurance
              Services（NIS）以技术驱动的商业保险总代理（MGA）模式运营，而不是像传统单线保险公司那样承担完整的资产负债表风险。MGA 架构让 Nirvana
              能把持续电信数据流与现代算法风险建模结合起来，同时通过成熟承保合作伙伴和全球 A
              级再保险公司承保保单。公司的核心价值主张是利用实时物联网（IoT）车辆传感器数据、诊断故障码和计算机视觉行车摄像头，为更安全的商业卡车车队提供最高 20%
              的前置保费折扣。保单在整个期限内锁定费率，消除任意的中期费率波动，缓解商业运输车队面对标准保费飙升时的强烈痛点。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO011
              - CO014
      - number: '1.2'
        title: 创始人、高管团队与治理
        blocks:
          - type: paragraph
            body: >-
              Nirvana 由 Rushil Goel（首席执行官）、Abhay Mitra（首席技术官）和 Alex Carges（首席精算师兼保险负责人）创立。Goel 曾任 Samsara
              产品副总裁，负责将联网车队业务从零做到年经常性收入（ARR）超过 $400M。这段运营经历让他看到，传统财产与意外险公司未能利用丰富的车辆 IoT 数据，将运营良好的运输车队与高风险车队区分开。CTO Abhay
              Mitra 设计了专有数据接入管线，能把多频传感器数据解析为预测性损失模型；Alex Carges 则以传统精算纪律对接前置承保机构和再保险联合体。更广泛的高管团队还包括产品副总裁 Molli Langland
              和财务高级副总裁 Gary Weber。尽管职能深度较强，公司治理仍高度依赖关键人物：CEO Rushil Goel 是战略承保合作、平台愿景和投资者资本的主要纽带。
