      - number: '2.3'
        title: 买方细分、经纪人分销与激励对齐
        blocks:
          - type: paragraph
            body: >-
              商业车险的采用由多方参与的采购链决定，经济买方与保单分销方彼此分离。运输车队不会通过面向消费者的数字结账直接采购商业卡车保单；商业车险几乎完全由独立零售保险代理机构和运输批发经纪人撮合。Nirvana
              顺应这一市场现实，将商业产品拆成不同客户项目：面向车主兼运营者和拥有 1 至 9 台动力单元的小车队的非车队项目，以及面向拥有 10
              辆或更多卡车的商业运输商的车队项目。由于运输车队依赖持牌经纪人办理法定申报和保险凭证，Nirvana 的主要分销杠杆是把代理人的报价周期从传统的 30 至 45 天压缩至 48
              小时甚至数分钟。公司自动接入电信数据，并提供透明的按里程分期计费，让零售经纪人可以更快绑定保单，同时为运输车队提供前置保费减免，且绑定后不会出现中期费率波动。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动、技术催化剂与承保阻力
        blocks:
          - type: paragraph
            body: >-
              推动 Nirvana 数据驱动承保的主要技术催化剂，是联邦电子记录装置（ELD）强制令的实施；该规定让重型商用车必须配备车载电信设备和数字发动机监测。这一监管变化把模拟化卡车行业转成持续 IoT
              数据流环境，生成涵盖加速模式、急刹事件、路线风险和行车摄像头遥测的数十亿英里实时行为数据。Nirvana 利用基于超过 300 亿英里电信记录训练的专有预测模型，为安全车队提供最高 20%
              的前置保费折扣，形成强大的经济选择激励。不过，若干结构性阻力抵消了这一采用飞轮：Nirvana 的地理覆盖仍限于 26 至 27 个州，未覆盖关键物流走廊和货运枢纽。此外，独立市场分析指出，Trustpilot
              和 Better Business Bureau 等消费者平台上几乎没有公开司机评价，说明长期投保人留存、经纪人佣金持续性和理赔结算满意度在公司自发指标之外仍未经证明。
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: ELD 电信强制令制造巨大的承保信息不对称
            body: 2017 年联邦电子记录装置强制令把商业卡车运输从模拟检查制度转为 IoT 密集型数据生态，使技术型 MGA 能绕过传统的多年损失记录。
            calloutType: insight
