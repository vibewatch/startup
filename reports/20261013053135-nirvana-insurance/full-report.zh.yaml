  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与商业车队工作流
        blocks:
          - type: paragraph
            body: >-
              Nirvana Insurance 是一家 AI 驱动的 MGA，用电信和机器学习模型而非历史纸质损失记录重构商业车队保险。商业卡车车队通常面临持续 30 至 45
              天的漫长承保周期，期间模拟化承保机构审查静态运营半径、车辆数量和过往损失记录，却无法细致观察持续的司机风险。Nirvana 直接从车载电子记录装置（ELD）、IoT
              传感器和行车摄像头提取持续运营传感器数据，改变了这一客户工作流。公司将这些流式信号与交通运输部联邦安全记录结合，在 48
              小时内交付可绑定报价，几乎消除承保文书工作。其多险种产品覆盖商业汽车责任险、物理损害险、一般责任险和机动车货物险，服务在 28 个活跃州运营且拥有 10 台或更多动力单元的车队。被评为安全的车队可获最高 20%
              的前置保费折扣，折扣在整个保单期内锁定，并配合自动、透明的月度计费，避免中期费率波动。
