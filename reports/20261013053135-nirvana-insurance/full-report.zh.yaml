      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Nirvana 的资产负债表实力在 2025 年通过连续两轮股权融资大幅增强。2025 年 3 月，General Catalyst 领投 $80M C 轮，估值接近 $850M；2025 年 12
              月，Valor Equity Partners 领投抢先认购的 $100M D 轮，将 Nirvana 投后估值推至约 $1.5B，累计融资超过 $270M。由于软件式 MGA
              资本效率缓冲了估算的年度现金消耗，Nirvana
              拥有多年的现金跑道，短期内不易陷入融资困境。然而，商业保险的资本密集度体现为对再保险承保能力的依赖，而不只是对风险投资股权的依赖。如果再保险公司在更广泛的保险市场趋紧期间收紧能力或要求不利的配额分保条款，无论
              Nirvana 的风险投资现金余额如何，其承保增长速度都可能受到外部限制。Caplight 的二级市场跟踪显示，投资者将 Nirvana 与 Federato、Shift Technology 和 Sixfold
              等工作流及承保 AI 同业进行对标。
            claimRefs:
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: 财务承保结论与透明度缺口
        blocks:
          - type: paragraph
            body: >-
              从机构尽调角度看，Nirvana 的财务画像不对称：营收增长势头强劲，却伴随严重的私有公司披露缺口。管理层反复强调前十位损失率和保费快速翻倍，但 Nirvana 没有公开经审计的 GAAP
              收入、净赚保费明细或法定损失率发展三角表。在 Progressive 等巨头主导的行业竞争中，Nirvana 仍集中于长途和区域卡车车队，投资组合因此容易受到货运衰退、柴油通胀和核裁判诉讼趋势影响。对于按
              $1.5B 估值评估其上行空间的投资者，核心尽调障碍在于确认：当理赔发展经过 24 至 36 个月成熟后，Nirvana
              的电信选风险优势能否带来持久的承保利润；还是说，保费增长反映的是初期风险定价过低，未来必须提高费率。
            claimRefs:
