      - number: '1.4'
        title: 规模里程碑、承保模式与运营阻力
        blocks:
          - type: paragraph
            body: >-
              自 2022 年销售首张商业车险保单以来，Nirvana 在高度承压的美国商业卡车市场快速扩大运营规模。美国国内货运经济结构极其脆弱：超过 90% 的车队拥有的动力单元少于 50
              台，运营利润率薄如刀刃，柴油成本波动，每辆卡车年保险保费在 $15,000 至 $20,000 之间。Nirvana 的承保模式将数十亿条遥测数据连接起来，把报价周转从数周缩短至数分钟，以减轻这一负担。截至
              2025 年底，Nirvana 声称已积累超过 300 亿英里驾驶传感器数据，将 A+ 再保险承保能力翻倍，并在保持前十位损失率的同时实现超过 $100M
              的毛保费。然而，由于详细的法定损失率发展、再保险配额分保协议和 GAAP 财务报表均未公开，独立尽调必须谨慎对待管理层未经审计的说法。
