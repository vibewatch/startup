            title: 州许可覆盖与经纪人阻力限制即时扩张
            body: 保险覆盖仅获准在 26 至 27 个州开展，分销又依赖独立零售经纪人，因此监管碎片化和代理机构摩擦仍是全国市场获取的重要约束。
            calloutType: risk
            claimRefs:
