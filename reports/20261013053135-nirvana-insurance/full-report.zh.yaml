      - number: '5.2'
        title: 技术架构与承保能力整合
        blocks:
          - type: paragraph
            body: >-
              Nirvana 的运营架构是一条六层管线，涵盖硬件传感器接入、数据协调、预测性 AI 评分、动态定价、安全情报和数字理赔处理。公司的数据基础将不同 ELD 硬件型号、GPS
              频率和传感器格式的异构遥测流协调成统一的预测性风险资产。截至 2025 年 12 月，Nirvana 的机器学习基础设施已接入并处理超过 300
              亿英里的真实车队驾驶观察数据，在道路行为与损失结果之间建立经验反馈回路。承保团队使用 AI
              司机摘要系统分析司机群体，标记高风险行为异常值，加快档案审查和优先级排序。事故发生时，数字理赔处理会直接从收到的电子邮件创建案件，解析附件文档，并自动扫描底层保单以评估保障限额。为了交付保险凭证，Nirvana
              采用由机构风险资本支持的 MGA 架构，将 MS Transverse 作为 A 级前置承保伙伴，并接入全球 A+ 再保险联合体。
