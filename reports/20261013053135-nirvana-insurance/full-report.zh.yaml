      - number: '3.2'
        title: 承保、数据护城河与能力比较
        blocks:
          - type: paragraph
            body: >-
              承保速度和预测准确性，是现代保险科技 MGA 与传统商业车险公司之间的主要竞争战场。传统商业车险承保需要人工检查历史损失记录和司机机动车记录，通常需要一至三周才能报价。相比之下，Nirvana 使用基于超过
              30B 英里商业驾驶电信数据训练的专有机器学习风险模型，声称可以在数分钟内自动交付报价，承保决策速度最高快十五倍。Cover Whale 强调持续司机辅导和行车摄像头合规以管理风险，而 Nirvana 则围绕最高
              20% 的前置安全折扣设计模式。不过，这一数据护城河能否长期防守，取决于其专有风险分层是否持续优于传统承保机构采用的现成商业电信模型。
            claimRefs:
