      - number: '1.3'
        title: 资本化历程与投资者联合体
        blocks:
          - type: paragraph
            body: >-
              Nirvana 展现出异常迅猛的风险投资融资速度，分五轮机构融资累计募集超过 $270M 股权资金。公司于 2022 年 2 月走出隐身状态，完成由 Lightspeed Venture Partners 领投的
              $22M A 轮，种子轮领投方 General Catalyst 和战略天使投资人跟投。2023 年 10 月，Lightspeed 再次领投 $57M B 轮，Valor Equity Partners
              参与，公司投后估值翻倍至超过 $350M。2025 年 3 月，General Catalyst 领投 $80M C 轮，估值达到 $850M，增长势头进一步加快。最近一次是 2025 年 12 月，Valor
              Equity Partners 携手 Lightspeed 和 General Catalyst 抢先认购 $100M D 轮，将 Nirvana 估值推至约 $1.5B。尽管这一投资者联合体体现出顶级机构对
              Nirvana 数据护城河的信心，正式的清算优先权、治理契约和董事会构成仍未披露。
