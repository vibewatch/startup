      - 反方论点 / 看空理由
      - 论点失效 / 观点改变触发因素
    rows:
      - - 数据与 AI 壁垒
        - 30B+ 英里远程信息数据支持快速报价，并为安全车队提供最高 20% 的前置折扣
        - OEM 硬件和 ELD 厂商提供原生分析后，远程信息数据趋于商品化
        - 损失率向行业均值靠拢，或商用 ELD 厂商限制 API 访问
      - - 增长与规模
        - 保费承保额同比翻倍，Valor Equity Partners 领投 $100M Series D
        - 增长集中在小车队货运，而货运低迷时该领域淘汰率很高
        - 报告的保费运行率降至同比 30% 以下，或客户取消率激增
      - - 商业模式
        - 轻资本 MGA 结构赚取佣金收入，无需在资产负债表上持有承保股权
        - MGA 经济性取决于波动的前端保险人费用和或有佣金结算调整
        - 再保险容量收紧，或配额分保分出佣金削减 >300bps
      - - 估值纪律
        - 承保速度提升 15x，头部保险科技平台理应享有溢价倍数
        - $1.5B 估值给次级资本持有人带来巨大的清算优先权压力
        - 二级市场成交价较 Series D 公告投后估值折价 >30%
    notes: 这些支柱将公司运营声明与保险行业的结构性脆弱点进行对照。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV008
      - CV010
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营假设
      - 估值范围（$M）
      - 回报倍数逻辑
      - 概率信号
      - 主要下行触发因素
    rows:
      - - 乐观情景
        - GWP 超过 $300M，损失率保持行业前十分位，商用车险扩张成功
        - $2,200 - $2,800
        - 通过 IPO 或一线战略出售，实现 Series D 投后估值的 1.5x - 1.9x 回报
        - 25%
        - 宏观货运冲击或诉讼损失严重程度激增
      - - 基准情景
        - 货运 GWP 达到 $180M - $220M，损失率跟随同业中位数，MGA 佣金稳定
        - $1,300 - $1,600
        - 0.9x - 1.1x 回报；保全资本并实现温和股权复利
        - 50%
        - 车队新增放缓或再保险分出成本上升
      - - 悲观情景
        - 损失率恶化至 >75%，货运低迷引发车队流失，条约佣金削减
        - $600 - $800
        - 0.4x - 0.5x 回报；股权大幅减值并承受优先权压力
        - 25%
        - 前端合作伙伴不续约或准备金不利发展
    notes: 情景估值根据不同承保表现、佣金留存和资本市场倍数模拟企业价值。
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV009
      - CV012
