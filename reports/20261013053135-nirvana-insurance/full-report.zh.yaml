      - number: '3.3'
        title: 定价模式、分销渠道与承保凭证
        blocks:
          - type: paragraph
            body: >-
              商业车险的分销和定价模式决定车队获取速度及不同市场细分中的留存。Nirvana 通过覆盖 26 至 27
              个州的指定代理网络和直接数字接入分销保单，提供汽车责任险、物理损害险、一般责任险和机动车货物险。在定价结构上，Nirvana 锁定全年保单费率，并提供前置安全折扣，与 HDVI 的动态月度保费调整（HDVI
              Shift）形成差异。从资本结构看，Nirvana 通过 Nirvana Insurance Services（NIS）以 MGA 方式运营，依靠 MS Transverse
              等前置承保能力和全球再保险配额分保合作伙伴，而不是在获准承保机构的资产负债表上持有主要保险风险。这种结构支持 A 级 Fleet 项目和 A- 级 Non-Fleet
              项目快速迭代，但相较资本充足的资产负债表型承保机构，也带来交易对手依赖。
