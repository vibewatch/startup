      - number: '3.4'
        title: 转换成本、护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              商业车险的转换成本和分销护城河，仍深受独立经纪习惯和车队运营惯性的影响。车队更换保险公司时，直接技术转换成本较低，因为 Nirvana
              能接入现有电子记录装置（ELD）和电信硬件，无需安装专有硬件。然而，商业保险经纪人往往偏好具备多险种打包能力、理赔处理记录和可预测佣金结构的成熟承保机构。Nirvana 面临两类替代风险：大型商业险
              incumbents 收购或授权电信聚合数据以改造现有业务；竞争 MGA 则在前置费率折扣上展开激烈竞争。此外，由于 Nirvana
              依靠第三方前置承保机构和再保险公司提供承保能力，商业再保险市场一旦趋紧，可能挤压承保利润率或承保能力分配。
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP013
              - CP014
