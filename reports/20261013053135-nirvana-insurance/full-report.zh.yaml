      - number: '5.3'
        title: 电信接入与承保差异化
        blocks:
          - type: paragraph
            body: >-
              Nirvana
              承保模式的核心技术差异，在于把被动的硬件传感器流转化为预测性行为定价。传统商业车险公司根据广泛的行业损失平均值、车辆停放地区和历史损失经验计算保费，在卡车市场低迷时反而惩罚安全运营者。Nirvana
              接入高频电信指标，包括 GPS 位置、车速、VIN
              配置、里程表读数，以及急刹、急加速和方向盘操作异常等安全事件计数。这些细粒度信号输入专有机器学习算法，用于评估运营暴露，并在无需车队安装专有黑盒硬件的情况下提供最高 20% 的前置折扣。Nirvana 作为 AI
              原生保险公司入选 2025 年 CB Insights Insurtech 50，并锁定费率、避免绑定后的调整，以此形成差异化。传统电信项目常根据滞后事件让投保人承担波动的月度费率，而 Nirvana
              固定保单期限，用持续安全数据支持损失预防，而不是在期中惩罚性地提高费率。
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
              - CE007
              - CE009
              - CE014
      - number: '5.4'
        title: 信任、隐私控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              为推动对司机监控敏感的商业车队采用电信设备，Nirvana 通过正式的隐私承诺划定清晰的治理边界。Nirvana 明确不会通过驾驶室摄像头或 ELD
              实时监控司机，摄像头画面也不会用于报价、计费或其安全情报平台。相反，只有在报告理赔后，公司才会访问行车摄像头视频，以重建碰撞过程并协助证明无过错司机不应负责。所有遥测数据均存储在加密云环境中，并限制访问。尽管有这些技术防护，承保架构仍面临结构性商业车险风险。电信数据质量依赖第三方硬件可靠性、不同的传感器事件阈值和司机名单变动；在波动的货运周期中，这些因素可能造成模型漂移。更关键的是，严重商业卡车理赔由灾难性人身伤害、法律管辖地和社会通胀驱动，快速数字理赔接入无法缩短侵权责任漫长的结算尾部。
            claimRefs:
              - CE005
              - CE010
              - CE013
              - CE014
