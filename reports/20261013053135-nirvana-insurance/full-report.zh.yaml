            title: 承保能力依赖与传统公司电信能力趋同
            body: >-
              Nirvana 在商业车险承保上的竞争优势依赖其专有的 300 亿英里电信模型和快速报价。然而，作为依赖前置承保机构和全球再保险联合体的 MGA，如果 Progressive 或 Travelers
              等资本充足的传统公司与车队电信供应商建立同等合作关系，Nirvana 将面临结构性利润率压缩和替代风险。
