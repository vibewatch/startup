            body: >-
              Nirvana 的商业市场进入模式，将专业经纪代理分销与基于超过 200 亿至 300 亿英里驾驶传感器数据训练的专有 AI
              承保引擎结合起来。这一技术基础把商业车险报价周期从行业标准的数周压缩到数分钟，为独立零售代理创造显著的转化优势。公开牵引力里程碑显示采用速度很快：2025 年初毛书面保费超过
              $100M，同比翻倍。不过，承保交付成本和毛利率扩张受再保险配额分保协议以及与 SiriusPoint、MS Transverse 等合作伙伴的前置承保安排约束。在 MGA 框架下，毛书面保费增长并不直接等于
              GAAP 收入。真正的毛利驱动因素包括基础分保佣金与代理次级生产商支付之间的差额、运营理赔服务费用，以及完全取决于成熟损失率表现的或有佣金结算调整。
