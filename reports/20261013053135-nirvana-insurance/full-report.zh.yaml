  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与参与者分类
        blocks:
          - type: paragraph
            body: >-
              商业车险和车队保险市场分为三类竞争层：直接的电信原生 MGA、传统资产负债表承保机构和承保软件赋能商。直接竞争者 Cover Whale 和 HDVI
              使用联网车辆数据改善风险选择，瞄准相似的商业卡车客户群。Progressive、Travelers 和 Great West
              等传统商业车险巨头依托根深蒂固的独立经纪关系，以及在一般责任险和工伤补偿险上的多险种打包，保持主导市场份额。与此同时，Federato、Shift Technology 和 Sixfold 等 AI
              承保赋能商为成熟承保机构提供分流算法，却不直接承担保险风险。Nirvana 把车主兼运营者项目与大型车队覆盖结合，并获得超过 $260M 风险投资资金支持，在这一格局中形成差异化。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP011
