      - number: '5.2'
        title: Technical Architecture and Capacity Integration
        blocks:
          - type: paragraph
            body: >-
              Nirvana's operating architecture is organized into a six-layer pipeline that spans hardware sensor
              ingestion, data harmonization, predictive AI scoring, dynamic rating, safety intelligence, and digital
              claims processing. The company's data foundation harmonizes heterogeneous telemetry streams across varied
              ELD hardware models, GPS frequencies, and sensor formats into a unified predictive risk asset. By December
              2025, Nirvana's machine learning infrastructure had ingested and processed more than 30 billion miles of
              real-world fleet driving observations, establishing an empirical feedback loop between on-road behavior
              and loss outcomes. Underwriting teams utilize an AI driver summary system that analyzes driver pools and
              flags high-risk behavioral outliers, accelerating file review and prioritization. When incidents occur,
              digital claims processing initiates files directly from inbound emails, parses attached documentation, and
              automatically scans underlying policies to evaluate coverage limits. To deliver insurance paper, Nirvana
              operates an MGA structure backed by institutional risk capacity, integrating MS Transverse as an A-rated
              fronting carrier partner alongside global A+ reinsurance syndicates.
            claimRefs:
