      - number: '3.2'
        title: Underwriting, Data Moat, & Capability Comparison
        blocks:
          - type: paragraph
            body: >-
              Underwriting velocity and predictive accuracy represent the primary competitive battleground between
              modern insurtech MGAs and legacy commercial auto carriers. Traditional commercial auto underwriting
              requires manual inspection of historical loss runs and driver motor vehicle records, typically taking one
              to three weeks to return quotes. In contrast, Nirvana leverages proprietary machine learning risk models
              trained on more than 30 billion miles of commercial driving telematics, claiming automated quote delivery
              in minutes and underwriting decisions up to 15 times faster. While Cover Whale emphasizes continuous
              driver coaching and dashcam compliance to manage risk, Nirvana structures its model around upfront safety
              discounts of up to 20%. Nevertheless, the long-term defensibility of this data moat depends on proprietary
              risk segmentation remaining superior to off-the-shelf commercial telematics models adopted by legacy
              underwriters.
