chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Nirvana Insurance was founded in early 2021 and is headquartered in San Francisco, California. The company
              operates as a technology-driven commercial insurance Managing General Agent (MGA) under Nirvana Insurance
              Services (NIS), rather than bearing full balance-sheet risk as a traditional monoline insurance carrier.
              Operating as an MGA allows Nirvana to combine continuous telematics streaming with modern algorithmic risk
              modeling while fronting policies through established carrier partners and global A-rated reinsurers. The
              company's core value proposition centers on utilizing real-time Internet of Things (IoT) vehicle sensor
              data, diagnostic fault codes, and computer-vision dash cameras to reward safer commercial truck fleets
              with upfront premium discounts of up to 20%. Policies feature rate locks across the policy term to
              eliminate arbitrary mid-term rate volatility, addressing deep frustration among commercial motor carriers
              facing soaring standard premiums.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO011
              - CO014
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Nirvana was established by Rushil Goel (Chief Executive Officer), Abhay Mitra (Chief Technology Officer),
              and Alex Carges (Chief Actuary and Head of Insurance). Goel previously served as Vice President of Product
              at Samsara, where he led the connected fleet business from inception to over $400 million in annual
              recurring revenue (ARR). That operational experience illuminated how legacy property and casualty insurers
              failed to utilize rich IoT vehicle streams to differentiate well-operated motor carriers from hazardous
              fleets. CTO Abhay Mitra architected the proprietary ingestion pipeline capable of parsing multi-frequency
              sensor feeds into predictive loss models, while Alex Carges provided traditional actuarial discipline to
              interface with fronting carriers and reinsurance panels. The broader executive bench includes VP of
              Product Molli Langland and SVP of Finance Gary Weber. Despite strong functional depth, governance exhibits
              substantial key-person dependence on CEO Rushil Goel, who serves as the primary conduit for strategic
              carrier partnerships, platform vision, and investor capital.
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
