      - number: '1.3'
        title: Capitalization History and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Nirvana has demonstrated exceptional venture fundraising velocity, raising more than $270 million in
              aggregate equity financing across five distinct institutional funding rounds. The company emerged from
              stealth in February 2022 with a $22 million Series A led by Lightspeed Venture Partners, backed by seed
              lead General Catalyst and strategic angels. In October 2023, Lightspeed re-led a $57 million Series B
              joined by Valor Equity Partners, doubling Nirvana's post-money valuation to over $350 million. Momentum
              accelerated in March 2025 with an $80 million Series C led by General Catalyst at an $850 million
              valuation. Most recently, in December 2025, Valor Equity Partners preempted a $100 million Series D round
              alongside Lightspeed and General Catalyst, valuing Nirvana at approximately $1.5 billion. While this
              syndicate reflects top-tier institutional conviction in Nirvana's data moat, formal liquidation
              preferences, governance covenants, and board compositions remain undisclosed.
