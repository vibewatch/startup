      - number: '3.3'
        title: Pricing Models, Distribution Channels, & Paper Backing
        blocks:
          - type: paragraph
            body: >-
              Commercial auto distribution and pricing models dictate fleet acquisition velocity and retention across
              different market segments. Nirvana distributes policies through both an appointed agent network across 26
              to 27 states and direct digital intake, offering Auto Liability, Physical Damage, General Liability, and
              Motor Truck Cargo. In pricing structure, Nirvana locks policy rates for the full annual term while
              granting upfront safety discounts, differentiating from HDVI's dynamic monthly premium adjustments (HDVI
              Shift). From a capital structure perspective, Nirvana operates as an MGA through Nirvana Insurance
              Services (NIS), relying on fronting capacity such as MS Transverse alongside global reinsurance
              quota-share partners rather than holding primary insurance risk on an admitted carrier balance sheet. This
              structure enables rapid product iteration across its A-rated Fleet and A-minus Non-Fleet programs, but
              introduces counterparty dependency relative to well-capitalized balance-sheet incumbents.
