      - number: '3.4'
        title: Switching Costs, Moat Durability, & Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Switching costs and distribution moats in commercial auto insurance remain heavily influenced by
              independent brokerage habits and fleet operating inertia. Fleets face low direct technical switching costs
              when changing insurers because Nirvana integrates with existing electronic logging devices (ELDs) and
              telematics hardware without requiring proprietary hardware installs. However, commercial insurance brokers
              often favor established carriers with multi-line package capabilities, claims handling track records, and
              predictable commission structures. Nirvana faces displacement risks from two directions: large commercial
              incumbents acquiring or licensing telematics aggregations to modernize their existing books, and competing
              MGAs competing aggressively on upfront rate discounts. Furthermore, because Nirvana relies on third-party
              fronting carriers and reinsurers for underwriting capacity, any hardening in commercial reinsurance
              markets could pressure underwriting margins or capacity allocation.
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP013
              - CP014
