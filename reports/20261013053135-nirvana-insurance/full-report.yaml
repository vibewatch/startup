  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Commercial Auto Insurance Market Boundary and Telematics Disruption
        blocks:
          - type: paragraph
            body: >-
              The commercial auto insurance sector constitutes an indispensable regulatory and operational foundation of
              the domestic freight transportation economy. Every commercial motor carrier operating in interstate
              commerce is legally required to maintain primary liability coverage to protect third parties against
              bodily injury and property damage. Historically, commercial auto insurance has been treated by incumbent
              carriers as an analog, commoditized balance-sheet line where underwriting decisions rely on static
              three-year historical loss runs, Department of Transportation safety snapshot ratings, and broad fleet
              classification averages. Nirvana Insurance enters this landscape not as a risk-bearing full-stack
              insurance balance sheet, but through a specialized Managing General Agent structure that isolates
              underwriting technology, telematics analytics, and policy administration from underlying capital risk.
              Under this operating framework, policies are originated, priced, and serviced by Nirvana while being bound
              on AM Best A-rated carrier paper backed by fronting institutions such as MS Transverse and SiriusPoint,
              with catastrophic exposures ceded into global reinsurance treaties. This programmatic boundary isolates
              Nirvana from traditional insurance carrier capital drag while constraining its underwriting domain
              strictly to commercial vehicle liability and physical damage, intentionally bypassing adjacent freight
              lines such as cargo, warehouse legal liability, and workers compensation.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing the Commercial Fleet Opportunity Across Distinct Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the commercial market opportunity for Nirvana requires disaggregating broad macro insurance
              figures into calibrated, operational addressable layers. While the aggregate commercial property and
              casualty industry represents more than a trillion dollars in annual domestic premium volume, the specific
              commercial automobile liability and physical damage line accounts for approximately $50 billion to $65
              billion annually. Within this total addressable universe, the market structure is heavily defined by
              extreme operational fragmentation: more than 90 percent of commercial motor carriers across the United
              States operate fleets comprising fewer than 50 power units. For these small business operators, annual
              commercial auto insurance premiums routinely consume between $15,000 and $20,000 per tractor, making risk
              transfer one of the largest single cash operating expenditures alongside diesel fuel and driver payroll.
              Nirvana's serviceable addressable market targets this fragmented cohort of small-to-midsize fleets where
              traditional loss-ratio volatility has caused incumbent underwriters to retrench or escalate pricing. By
              focusing on non-hazardous dry van, refrigerated, and flatbed carriers operating across its currently
              authorized 26 to 27 states, Nirvana isolates an immediate addressable premium pool of several billion
              dollars, having established commercial momentum by growing past $100 million in written premiums prior to
              its late-2025 Series D financing.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
