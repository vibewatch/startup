      - number: '4.2'
        title: Underwriting Efficiency and Go-to-Market Economics
        blocks:
          - type: paragraph
            body: >-
              Nirvana's commercial go-to-market motion pairs specialized broker agency distribution with a proprietary
              AI underwriting engine trained on over 20 billion to 30 billion miles of driving sensor data. This
              technological foundation compresses commercial auto quoting timelines from the multi-week industry
              standard down to minutes, creating substantial conversion advantages among independent retail agents.
              Public traction milestones reflect rapid adoption, with gross written premiums surpassing $100 million in
              early 2025 and doubling year over year. However, underwriting delivery costs and gross margin expansion
              remain governed by reinsurance quota share agreements and fronting carrier arrangements with partners such
              as SiriusPoint and MS Transverse. In an MGA framework, gross written premium expansion does not equate
              directly to GAAP revenue. True gross margin drivers include the spread between base ceding commissions and
              agency subproducer payouts, operational claims-servicing expenses, and contingent commission true-ups that
              depend entirely on seasoned loss-ratio performance.
            claimRefs:
