        title: Exhibits
        blocks:
          - type: callout
            title: Capacity Dependency & Incumbent Telematics Parity
            body: >-
              Nirvana's competitive advantage in commercial auto underwriting relies on its proprietary 30-billion-mile
              telematics models and rapid quoting. However, as an MGA dependent on fronting carriers and global
              reinsurance panels, Nirvana faces structural margin compression and displacement risk if well-capitalized
              incumbents like Progressive or Travelers establish equivalent telematics partnerships with fleet
              telematics providers.
            calloutType: risk
            claimRefs:
