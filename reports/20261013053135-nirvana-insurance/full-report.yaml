  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Commercial Fleet Workflow
        blocks:
          - type: paragraph
            body: >-
              Nirvana Insurance operates as an AI-enabled managing general agent (MGA) that restructures commercial auto
              fleet insurance around telematics and machine-learning models rather than historical paper loss runs.
              Commercial trucking fleets typically face protracted underwriting cycles lasting 30 to 45 days, during
              which analog insurers review static radius, vehicle counts, and prior loss records without granular
              visibility into ongoing driver risk. Nirvana alters this customer workflow by extracting continuous
              operational sensor data directly from onboard electronic logging devices (ELDs), IoT sensors, and dash
              cameras. By combining these streaming signals with federal safety records from the Department of
              Transportation, Nirvana delivers bindable quotes in 48 hours or less while virtually eliminating
              underwriting paperwork. Its multi-coverage product suite spans commercial auto liability, physical damage,
              general liability, and motor-truck cargo for fleets operating 10 or more power units across 28 active
              states. Fleets classified as safe receive upfront premium discounts of up to 20%, which are locked for the
              entire policy term alongside automated, transparent monthly billing to prevent mid-term rate volatility.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE012
