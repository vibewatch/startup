  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Nirvana Insurance operates structurally as a managing general agent (MGA) through Nirvana Insurance
              Services (NIS), rather than as a full-stack risk-bearing carrier. Under this architecture, the company's
              primary top-line economic engine is commission income recognized under ASC 606, generated by distributing
              and servicing policies backed by fronting carriers and reinsurance capacity providers. Policyholders pay
              gross commercial auto premiums—traditionally averaging between $15,000 and $20,000 per vehicle across the
              small-fleet trucking market—which Nirvana discounts upfront by up to 20% for operators demonstrating
              superior safety profiles via connected telematics sensors and AI dashcams. Crucially, Nirvana guarantees
              rate stability by locking policy premiums for the full 12-month term, eliminating mid-term pricing spikes
              following isolated incident reports. Automated monthly billing further lowers administrative friction for
              small fleet operators struggling with thin cash margins. Beyond base ceding commissions, Nirvana's
              economic model targets contingent profit commissions tied to maintaining favorable treaty-year loss ratios
              across its underwritten books.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
