            body: >-
              With over 90% of U.S. fleets operating fewer than 50 trucks on razor-thin operating margins, rising
              commercial auto premiums of $15,000 to $20,000 per truck combined with depressed spot rates expose Nirvana
              to involuntary churn, fleet downsizing, and customer bankruptcy risks despite upfront safety discounts.
            calloutType: risk
            claimRefs:
