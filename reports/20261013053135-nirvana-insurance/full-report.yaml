      - number: '6.4'
        title: Retention Durability, Expansion Loops, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite rapid written premium expansion, evaluating Nirvana's customer durability reveals critical
              underwriting risks and disclosure limitations. The small-fleet commercial trucking sector suffers from
              chronic cyclical fragility; prolonged freight recessions and depressed spot rates continually strain motor
              carrier liquidity, elevating risks of involuntary policy cancellation, fleet downsizing, and customer
              bankruptcy. Furthermore, Nirvana does not publicly disclose cohort-level Net Revenue Retention (NRR),
              Gross Revenue Retention (GRR), or annual policy renewal percentages. While mid-term rate locks and upfront
              safety discounts foster initial policyholder satisfaction, commercial fleet buyers remain highly
              price-sensitive at annual renewal if traditional carriers offer competitive concessions. Additionally,
              reliance on major brokerage intermediaries creates potential distribution concentration, where losing a
              key national brokerage partner could immediately restrict new business submissions. Long-term customer
              durability depends on Nirvana's capacity to convert initial auto liability policyholders into multi-line
              commercial accounts across cargo, physical damage, and general liability.
            claimRefs:
              - CU001
