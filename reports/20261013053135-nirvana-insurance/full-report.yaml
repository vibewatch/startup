    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis
      - Anti-Thesis / Bear Argument
      - Thesis-Break / View-Change Trigger
    rows:
      - - Data & AI Moat
        - 30B+ miles of telematics enable rapid quoting and up to 20% upfront discounts for safe fleets
        - Telematics data becomes commoditized as OEM hardware and ELD vendors offer native analytics
        - Loss ratios converge to industry averages or commercial ELD vendors restrict API access
      - - Growth & Scale
        - Doubling written premiums year-over-year with $100M Series D funding led by Valor Equity Partners
        - Growth concentrated in small-fleet trucking which experiences high mortality during freight downturns
        - Reported premium run-rate decelerates below 30% YoY or customer cancellation rates spike
      - - Business Model
        - Capital-light MGA structure earns commission income without holding balance-sheet underwriting equity
        - MGA economics depend on volatile fronting carrier fees and contingent commission true-ups
        - Reinsurance capacity tightens or quota-share ceding commissions are cut by >300 bps
      - - Valuation Discipline
        - Leading insurtech platform deserves premium multiple given 15x underwriting speed improvement
        - $1.5B valuation creates massive liquidation preference overhang for junior capital holders
        - Secondary market trades clear at >30% discount to Series D headline post-money mark
