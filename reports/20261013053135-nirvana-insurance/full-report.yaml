      - number: '1.4'
        title: Scale Milestones, Underwriting Model, and Operational Headwinds
        blocks:
          - type: paragraph
            body: >-
              Since selling its inaugural commercial auto policy in 2022, Nirvana has achieved rapid operational scale
              within the heavily distressed US commercial trucking market. The domestic freight economy is characterized
              by extreme structural fragility: over 90% of fleets operate fewer than 50 power units, facing razor-thin
              operating margins, volatile diesel fuel expenses, and annual insurance premiums ranging from $15,000 to
              $20,000 per truck. Nirvana's underwriting model seeks to alleviate this burden by connecting billions of
              telemetry data points to expedite quote turnaround from weeks to minutes. By late 2025, Nirvana claimed to
              have amassed over 30 billion miles of driving sensor data, doubled its A+ reinsurance capacity, and
              exceeded $100 million in gross written premiums while maintaining top-decile loss ratios. Nevertheless,
              because detailed statutory loss ratio developments, reinsurance quota-share treaties, and GAAP financial
              statements remain undisclosed, independent diligence must treat unaudited management claims with caution.
