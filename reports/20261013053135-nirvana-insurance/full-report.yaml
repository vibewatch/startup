  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Architecture & Model Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Nirvana Insurance operates as an AI-native managing general agent (MGA) in commercial trucking insurance,
              a sector burdened by thirteen consecutive years of industry-wide underwriting losses through 2025. While
              Nirvana leverages over 30 billion miles of driving data to offer upfront discounts of up to 20% and fast
              automated quoting, its economic structure introduces fundamental structural exposures. Most critically,
              Nirvana is not a full-stack insurance carrier; it rents policy paper from fronting carriers MS Transverse
              and SiriusPoint while placing risk with reinsurance treaties. Because Nirvana has never published its
              retained loss ratios or cumulative reserve development across its four-year history, investors cannot
              confirm whether telematics-based risk selection offsets chronic commercial auto inflation. Furthermore,
              Nirvana commits to locked rates for full policy terms regardless of accidents, restricting mid-term
              pricing corrections. In a market where nuclear verdicts have spiked 52% to $31.3 billion, severe tail risk
              remains the existential determinant of long-term underwriting viability.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR009
              - CR010
              - CR011
