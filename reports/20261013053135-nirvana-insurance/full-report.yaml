      - number: '6.2'
        title: Adoption Scale and Fleet Usage Trajectory
        blocks:
          - type: paragraph
            body: >-
              Adoption across Nirvana's target market has expanded from regional pilots into a multi-thousand fleet
              operating footprint. Nirvana announced in early 2025 that it had surpassed $100 million in written
              premium, doubling its premium base year-over-year while reporting top-decile loss ratios relative to
              legacy commercial auto peers. This premium ramp is underpinned by deep sensor integrations, with Nirvana's
              machine learning risk models ingesting more than 30 billion cumulative miles of real-world commercial
              driving telematics data from connected vehicles. Sensor adoption within Nirvana's customer base is
              extensive: approximately 70 percent of fleet clients already operate in-cab video telematics dash cameras
              alongside mandated electronic logging devices (ELDs). Rather than merely assessing static historical Loss
              Runs, Nirvana's platform actively consumes continuous speed, harsh braking, and hours-of-service
              compliance telemetry. This continuous feedback loop powers driver coaching alerts and expedites collision
              reconstruction, transforming raw fleet operational telemetry into underwriting pricing advantages and
              claims handling efficiencies.
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
