        - Per bound policy premium
        - '>$100M GWP volume; doubling YoY'
        - High (recurring renewal flow)
        - Obtain average ceding commission rate (typically 12-18% of GWP)
      - - Contingent Underwriting Profit Commission
        - Profit share bonus paid by reinsurance partners upon achieving favorable loss ratios
        - Annual treaty-year true-up
        - Targeted; top-decile claimed
        - Variable (loss-ratio dependent)
        - Review treaty-year contingent commission calculation formulas and actual payouts
      - - Policy & Administrative Technology Fees
        - Direct platform or policy servicing fees charged to fleet operators or agencies
        - Per policy / vehicle installment
        - Embedded in policy billing
        - High (fee-based recurring)
        - Inspect fee schedules and customer invoicing breakdown
      - - Non-Fleet Commercial Trucking Program
        - Expanded underwriting program for single-truck or non-fleet operators
        - Per vehicle premium
        - Launched in 2024-2025; scaling
        - Medium (earlier vintage)
        - Examine non-fleet premium volume, loss ratios, and broker distribution reach
