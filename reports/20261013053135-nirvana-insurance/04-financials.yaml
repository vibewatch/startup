      - Discounts & Incentives
      - Primary Source
    rows:
      - - Base Commercial Auto Premium
        - Underwritten liability, physical damage, and cargo coverage for commercial fleets
        - List pricing varies by fleet size; market average $15k-$20k/truck/year
        - Standard commercial rate baseline
        - SuperbCrew industry benchmark
      - - Telematics Safety Discount
        - Upfront premium credit applied at policy binding based on driving risk score
        - Up to 20% discount applied upfront to list rate
        - Safety score threshold based on speed, braking, and hours
        - Nirvana Why Telematics official surface
      - - Mid-Term Rate Lock Guarantee
        - Premium rate remains fixed across full policy term regardless of claims
        - Realized rate locked for 12 months; no mid-term surcharge
        - Guaranteed rate stability vs traditional fluctuating carrier rates
        - Nirvana Why Telematics official surface
      - - Monthly Automated Billing
        - Installment payment schedule tied to automated fleet reporting
        - Predictable monthly installments without manual audit surcharges
        - Streamlined payment processing
        - Nirvana Why Telematics official surface
    notes: Pricing terms reflect company public offerings and industry trucking rate baselines; individual fleet quotes vary based on sensor underwriting.
