callouts:
  - calloutType: "insight"
    title: "Freemium Core Drives Volume Scale but Compresses Standalone Take Rate"
    body: "Melio's strategy of eliminating monthly software subscriptions enables rapid customer onboarding and high transaction volumes ($100B+ processed). However, because standard ACH payments carry no direct fee, the platform's aggregate monetization depends heavily on the subset of users requiring card funding or accelerated settlement."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI010"
  - calloutType: "risk"
    title: "Channel Concentration and Partner Volatility Under Xero Ownership"
    body: "While syndicated distribution broadens access across financial institutions and platforms, partner relationships carry structural termination risks, as demonstrated by the loss of the embedded QuickBooks Bill Pay integration. Ownership by Xero stabilizes corporate solvency but complicates independent vendor integration roadmaps."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
