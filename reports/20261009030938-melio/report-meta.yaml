companyProfile:
  summary: >-
    Melio is an SMB-focused accounts payable, accounts receivable, and B2B payments platform that simplifies vendor
    disbursements, cash-flow timing, and reconciliation for small and midsize businesses. The company was founded in New
    York in 2018 by Matan Bar, Ilan Atias, and Ziv Paz, scaled through a freemium bill-pay model and partner
    distribution, and was acquired by Xero in October 2025. Public evidence still leaves the standalone revenue mix,
    margins, and governance picture incomplete under the parent structure.
