  topStrengths:
    - Clear SMB product-market fit for cash-flow-sensitive bill pay and receivables workflows
    - Large reported scale in businesses served, bills paid, and processed payment volume
    - Strategic distribution value from Xero ownership and embedded partner channels
  topRisks:
    - Standalone revenue mix, margins, and cash generation remain opaque under Xero
    - Workflow friction, approval limits, and verification-driven closures can disrupt users
    - Partner dependence and fee-mix uncertainty leave valuation unsupported as a standalone entry
  unresolvedGaps:
    - Standalone revenue mix across subscriptions, transaction fees, partner economics, and international payments.
    - Gross margin by rail, EBITDA or burn bridge, and proof that post-close profitability is improving.
    - Net retention, churn, customer concentration, and direct-versus-embedded customer mix.
    - >-
      Exact contingent-consideration triggers, leadership-retention outcomes, and post-close autonomy or governance
      structure inside Xero.
    - Partner concentration and measurable evidence that Xero's promised revenue and cost synergies are being realized.
