callouts:
  - calloutType: "insight"
    title: "Strategic Decoupling of Funding and Delivery Rails"
    body: "Melio's primary product architecture breakthrough is the technical and operational decoupling of how the small business funds a payment versus how the vendor receives it. By allowing businesses to pay via credit card while issuing standard ACH or paper checks to vendors who refuse cards, Melio provides working capital float and cash-flow flexibility without requiring vendor onboarding friction."
    claimRefs:
      - "CE003"
      - "CE005"
      - "CE008"
  - calloutType: "risk"
    title: "Algorithmic Risk Verification and Operational Disruption"
    body: "Because Melio operates as a payment intermediary transmitting billions in third-party funds across card and bank rails, its automated compliance and fraud detection engines actively flag anomalies. However, automated account freezes and unexpected payment cancellations occur without transparent recourse, presenting operational hazards for SMBs facing strict vendor payment deadlines."
    claimRefs:
      - "CE009"
      - "CE014"
      - "CE016"
