  topStrengths:
    - 面向现金流敏感型企业的账单支付和应收流程，已展现清晰的 SMB 产品市场契合度
    - 服务企业数量、已支付账单数量和已处理支付金额均达到据报道的较大规模
    - Xero 持股及嵌入式合作伙伴渠道带来战略分销价值
  topRisks:
    - 在 Xero 体系下，独立收入结构、利润率和现金创造能力仍不透明
    - 流程摩擦、审批上限和由验证触发的账户关闭可能打断用户使用
    - 对合作伙伴的依赖及费用结构的不确定性，使独立入场估值缺乏支撑
  unresolvedGaps:
    - 订阅、交易费、合作伙伴经济性和国际支付各部分构成的独立收入结构。
    - 按支付通道拆分的毛利率、EBITDA 或烧钱桥接，以及交易完成后盈利能力正在改善的证明。
    - 净留存率、流失率、客户集中度，以及直接客户与嵌入式客户的构成。
    - 或有对价的确切触发条件、管理层留任结果，以及交易完成后 Melio 在 Xero 内部的自主权或治理结构。
    - 合作伙伴集中度，以及 Xero 承诺的收入和成本协同是否正在兑现的可量化证据。
