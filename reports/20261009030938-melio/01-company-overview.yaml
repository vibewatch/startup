company:
  name: "Melio"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Melio is a New York-founded SMB accounts payable, receivable, and B2B payments platform created by Matan Bar, Ilan Atias, and Ziv Paz. Publicly available evidence indicates that Xero completed an approximately $2.5 billion acquisition in October 2025; Melio later described itself as a standalone Xero company, while a competitor-authored analysis reported that its payments capability had been embedded in Xero by March 2026."
sections:
  - id: "identity-and-business-model"
    title: "Company Identity, Architecture, and Business Model"
    body: "Melio Payments Inc. was founded in 2018 and is headquartered in New York City, with Bessemer Venture Partners describing a team assembled in New York and Tel Aviv [CO001, CO002]. The company was created to address small-business cash-flow friction: suppliers may demand ACH or checks while buyers seek flexibility over payment method and timing [CO003]. Melio's workflow allows an SMB to fund an eligible vendor payment by card even when the vendor receives another supported payment type [CO004]. Third-party 2026 pricing sources describe a free entry tier plus Core at $25 per month and Boost at $55 per month; one profile also reports a 2.9% card-payment fee, but live terms require confirmation [CO005]. In June 2026, a company-issued release announced an agent-powered network intended to execute buyer payments through supplier accounts-receivable systems without requiring suppliers to join a new portal [CO009]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO009"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "founding-and-leadership"
    title: "Founders, Governance, and Operational Leadership"
    body: "The company was co-founded by Matan Bar, Ilan Atias, and Ziv Paz [CO001]. A 2026 third-party profile identifies Bar as CEO, Atias as CTO, and Paz as CPO; it also reports that Bar previously led consumer peer-to-peer products at PayPal, Atias previously held an engineering leadership role at AppsFlyer, and Paz has payments-product experience [CO002]. Bessemer's account corroborates Bar's prior PayPal product role and emphasizes the three founders' complementary backgrounds, but the assigned pool does not independently verify the complete post-acquisition reporting structure [CO002, CO003]. A June 2026 company release quotes Aharon Levine as vice president of payments strategy, providing one additional current leadership datapoint [CO009]. Founder continuity supports domain knowledge, yet the absence of a complete Xero-era governance roster leaves key-person dependence and decision rights as diligence questions rather than established conclusions."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO009"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-xero-acquisition"
    title: "Capitalization History, Ownership, and the Strategic Xero Acquisition"
    body: "A third-party profile reports approximately $706 million of venture funding across five rounds through the late-2021 Series D, including a $501 million Series D at a $4.0 billion valuation; these figures are not supported here by an audited filing and should remain reported, historical metrics [CO006]. Bessemer separately stated in September 2020 that Melio had raised $144 million across several rounds and identified itself as an investor, corroborating the earlier financing trajectory without validating the later cumulative total [CO003]. Competitor Cleo Pay reports that Xero announced the acquisition in June 2025 and completed it on October 15, 2025 for roughly $2.5 billion of consideration, described as about $2.15 billion in cash and approximately $360 million in Xero shares, plus up to $500 million in employee incentives over three years [CO007]. The $2.5 billion figure is transaction consideration, not a reusable standalone valuation or proof of cash available to Melio."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "operational-scale-and-milestones"
    title: "Operational Scale, Network Reach, and Key Milestones"
    body: "Melio's current scale is disclosed through a mixture of company claims and secondary reporting rather than audited standalone statements. The official homepage claims more than 100,000 business owners, 40 million bills paid, over $100 billion processed, and more than two million vendors paid [CO013]. A June 2026 company release separately claims more than $30 billion in annual payment volume and nearly 100,000 businesses, while naming Capital One, Shopify, and Fiserv as examples in its syndication model [CO009]. Fintech.TV reports that Xero's acquisition announcement cited 80,000 SMB customers, more than $30 billion in payout volume, and $153 million in FY25 revenue; the assigned evidence does not include the underlying Xero disclosure, so the metric remains secondhand [CO008]. Trustpilot reviews show both favorable support experiences and specific adverse reports of account closure and weak approval workflows, indicating operational variance rather than a measured incident rate [CO010]. Melio says it remains a standalone Xero platform, while competitor Cleo Pay reports Xero embedding by March 2026 [CO014, CO015]."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs: []
    figureRefs:
      - "FO001"
