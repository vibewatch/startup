callouts:
  - calloutType: "insight"
    title: "Strategic Transition from Standalone Fintech to Core Ecosystem Engine"
    body: "Melio's trajectory illustrates the shifting economics of SMB payments infrastructure: a third-party profile reports a $4.0B private valuation in 2021, while competitor Cleo Pay reports about $2.5B of acquisition consideration in 2025 [CO006, CO007]. Melio says it remains a standalone Xero company, but Cleo Pay's account of the March 2026 Xero embedding suggests that the payments engine now serves both standalone and parent-platform distribution [CO014, CO015]."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO014"
      - "CO015"
  - calloutType: "risk"
    title: "Compliance Hold Friction and Customer Account Volatility"
    body: "The assigned Trustpilot snapshot includes one review describing account cancellation after a payment was scheduled and another describing approval-workflow and support failures [CO010]. These anecdotes do not establish incident frequency, but they identify payment continuity, closure notices, workflow reliability, and escalation response times as diligence topics for a product embedded in time-sensitive payables."
    claimRefs:
      - "CO010"
