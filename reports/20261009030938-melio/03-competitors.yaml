callouts:
  - calloutType: "insight"
    title: "The Seat-Licensing Trap in SMB Accounts Payable"
    body: "The primary operational trigger that drives growing small businesses away from Melio is not software reliability, but the economics of seat licensing. While Melio offers an attractive free Go tier for single operators, the necessity of adding secondary approvers or external bookkeepers forces upgrades to paid per-seat tiers ($10/user on Core/Boost) or the $80/month Unlimited tier. When contrasted with Ramp's free team platform or Zoho Books' bundled ledger model, Melio's pricing advantage diminishes as headcount and approval hierarchies scale."
    claimRefs:
      - "CP005"
      - "CP008"
  - calloutType: "risk"
    title: "Product Roadmap Alignment Post-Xero Acquisition"
    body: "Following Xero's acquisition of Melio for up to $3.0 billion (completed October 2025 at $2.5 billion), Melio faces strategic tension regarding its ecosystem neutrality. While Melio continues supporting QuickBooks Online and other accounting ledgers, long-term feature velocity is expected to prioritize native Xero accounting workflows, potentially degrading its appeal to the vast base of QuickBooks-centric accounting professionals."
    claimRefs:
      - "CP002"
      - "CP013"
