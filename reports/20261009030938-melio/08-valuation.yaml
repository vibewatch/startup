  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: standalone-economics
      missingEvidence: >-
        Audited standalone revenue by stream, gross margin by payment rail, operating expenses,
        cash generation, retention, fee-bearing mix, fraud losses, and partner concentration.
      whyItMatters: >-
        Without these inputs, processing scale cannot be converted into durable revenue, margin,
        cash flow, or an intrinsic valuation.
      diligencePath: >-
        Obtain management accounts, payment-rail unit economics, cohort retention, loss data,
        partner contracts, and a reconciliation to Xero's post-close reporting.
      relatedQuestionRefs: [QV010]
    - type: missing-source
      severity: material
      topic: comparable-set
      missingEvidence: >-
        A normalized set of public-company, private-round, and M&A references matched on revenue
        mix, growth, margins, geography, payment volume, and transaction date.
      whyItMatters: >-
        The assigned valuation marks represent unlike events and cannot establish a defensible
        multiple or current fair-value range.
      diligencePath: >-
        Build a dated comparable set from filings and transaction documents, then normalize
        enterprise value for revenue quality, growth, margin, and control premiums.
      relatedQuestionRefs: [QV006]
    - type: private-evidence-only
      severity: material
      topic: transaction-terms
      missingEvidence: >-
        Purchase agreement economics, fully diluted consideration, contingent payments,
        preference treatment, liabilities, retention packages, and integration scorecards.
      whyItMatters: >-
        The headline acquisition consideration cannot be translated into investor proceeds,
        standalone value, or post-close return expectations without the transaction waterfall.
      diligencePath: >-
        Review definitive transaction documents and board materials, and reconcile consideration
        paid with cap-table proceeds, assumed liabilities, earn-outs, and realized synergies.
      relatedQuestionRefs: [QV004, QV008, QV010]
