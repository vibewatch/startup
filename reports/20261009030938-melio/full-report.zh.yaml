    rows:
      - - 正方
        - 已展现的付款规模可以带来战略分发和数据价值
        - Melio 报告称拥有超过 100,000 名企业主，已处理金额超过 $100 billion
        - 独立确认活跃用户、付款量、留存和变现组合
      - - 正方
        - 高交易量收费模式可以利用客户选择变现，而不必对每笔银行转账收费
        - Bessemer 描述了部分付款类型的费用，以及对高总交易量的需求
