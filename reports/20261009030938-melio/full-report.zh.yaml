  - id: FM001
    title: B2B 支付可寻址市场层级
    type: pyramid
    summary: 将美国 B2B 支付市场交易量按层级从企业总支出拆解至 Melio 可变现的费用池。
    data:
      items:
        - label: 美国 B2B 总交易量（TAM）
          value: $25.0T
        - label: 美国 SMB 供应商交易量（SAM）
          value: $10.0T
        - label: SMB 纸质支票流
          value: $4.0T
        - label: Melio 已处理交易量基准
          value: $100B+
        - label: 可变现费用池（SOM）
          value: $2.5B-$5.0B
        - label: Melio 年化收入运行率
          value: $187M
    approximationNotes: 市场层级代表行业交易量基准，并与 Melio 报告的处理量基准和收入运行率进行对照。
    claimRefs:
      - CM001
      - CM002
      - CM005
      - CM006
      - CM007
      - CM008
  - id: FP001
    title: 竞争定位：目标企业规模与工作流复杂度
    type: quadrant
    summary: 对 B2B 支付和 AP 替代方案进行可视化映射，比较目标客户企业规模与 AP 工作流及合规复杂度。
    data:
      points:
        - label: Melio
          x: 2.5
          'y': 3
          detail: 面向微型 SMB 优化，提供低订阅成本的简易工作流
        - label: QuickBooks Bill Pay
          x: 2
          'y': 2.5
          detail: 面向小企业的嵌入式账本账单支付，提供基础路由
        - label: BILL
          x: 7.5
          'y': 8.5
          detail: 企业级合规、审计轨迹和多实体 ERP 集成
        - label: Tipalti
          x: 8.5
          'y': 9
          detail: 全球付款基础设施和全面的国际税务合规
        - label: Ramp
          x: 6
          'y': 6.5
          detail: 将公司卡与多步骤账单支付结合的自动化支出控制
        - label: ResolvePay
          x: 5
          'y': 5.5
          detail: 面向卖家的专业 B2B 账期融资和信用风险评估
      xAxis:
        label: 目标企业规模（微型 SMB 至企业）
        min: 0
        max: 10
      yAxis:
        label: 工作流与合规复杂度（简单至企业 ERP）
        min: 0
        max: 10
    approximationNotes: 坐标基于目标员工规模、ERP 集成、审批层级和合规范围进行标准化序数定位。
    claimRefs:
      - CP001
      - CP003
      - CP006
      - CP011
  - id: FI001
    title: Melio SMB 交易变现瀑布
    type: waterfall
    summary: 以示例展示总交易量如何将 $1,000 的已处理付款额经过免费 ACH、收费信用卡和加急交易，转化为平台净收入。
    data:
