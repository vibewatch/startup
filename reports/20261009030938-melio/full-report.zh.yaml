        blocks:
          - type: paragraph
            body: >-
              公司由 Matan Bar、Ilan Atias 和 Ziv Paz 共同创立 [CO001]。一份 2026 年第三方资料称，Bar 任 CEO、Atias 任 CTO、Paz 任 CPO；该资料还称，Bar
              此前在 PayPal 负责消费者端点对点产品，Atias 此前在 AppsFlyer 担任工程领导职务，Paz 具备支付产品经验 [CO002]。Bessemer 的资料印证了 Bar 过往的 PayPal
              产品职务，并强调三位创始人的互补背景，但当前证据池无法独立核实收购后的完整汇报关系 [CO002, CO003]。2026 年 6 月，公司公告引述支付战略副总裁 Aharon
              Levine，提供了一个额外的当前领导层信息点 [CO009]。创始团队延续有助于保留领域知识，但 Xero 时代缺少完整治理名单，使关键人物依赖和决策权仍是尽调问题，而非已被证实的结论。
