              - CR008
              - CR014
              - CR015
      - number: '7.5'
        title: 证据边界与尽调重点
        blocks:
          - type: paragraph
            body: >-
              风险结论受指定资料池限制。资料池包括公司政策和产品页面、历史投资者评论、独立软件概览、客户评价页面，以及一条无关的同名实体结果。保留同名实体结果只是为了记录实体解析噪声，不支持任何关于 Melio
              Payments 控制或运营的主张。客户评价提供具体失效模式，但不能说明普遍性；公司页面描述缓解措施，却没有说明其有效性。因此，优先尽调应是量化取证：索取安全事件和损失、KYC
              关闭及申诉率、付款失败和恢复时间、支持 SLA、处理商及合作伙伴集中度、网络费敏感度，以及审批工作流在代表性客户负载下运行的证据。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: 公开控制措施不等于控制有效性证据
            body: 公司描述了防护措施、验证流程、审批功能和支持层级，但指定来源没有量化有效性、服务水平或事件结果。
            calloutType: risk
            claimRefs:
              - CR010
              - CR012
              - CR015
          - type: callout
            title: 以运营证据作为投资闸门
            body: 在把公司所述缓解措施视为成熟能力之前，应要求控制报告、事件与付款损失历史、KYC 关闭队列、支持指标、处理商集中度、故障切换测试和支付结构单位经济性。
            calloutType: recommendation
            claimRefs:
