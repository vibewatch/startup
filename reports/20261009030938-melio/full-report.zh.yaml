  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界逻辑与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              美国 B2B 支付市场的年度交易总额约为 $25 trillion，其中中小企业向外部供应商、供货商和承包商支付的金额约为 $10 trillion。Melio
              的核心可服务市场边界包括微型和小型企业的非工资运营供应商付款、公用事业缴费、库存采购和商业服务。我们明确将企业资金管理、高频供应链电子数据交换交易、消费者点对点转账和内部员工工资排除在核心范围之外。主导现状替代方案不是企业软件，而是手工纸质支票——历史上约占
              SMB 商业付款的
              40%——以及银行门户中的基础自动清算所转账。小企业主仍依赖这些旧通道，是因为传统应付账款自动化平台往往要求繁琐的前期设置、复杂的科目表映射和高额月度订阅最低消费，给单人经营者和微型企业配了过多功能。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: 市场规模口径与受约束的 TAM/SAM/SOM 边界
        blocks:
          - type: paragraph
            body: >-
              评估 SMB 账单支付的可服务市场，必须把交易总额拆解为可实现的软件收入和支付费收入。美国 B2B 支付总量虽达到 $25 trillion，但可服务市场收缩为美国 31 million 家小企业每年预计处理的
              $10 trillion，其中 81% 是非雇主个体户或微型企业。Melio 的可获得市场对应于通过灵活支付通道产生、能够变现的总处理量，具体包括信用卡交易、加急当日转账和国际付款，而不是不产生收入的免费 ACH
              转账。由于 Melio 在入门层对标准 ACH 处理和邮寄支票不收订阅费，软件变现池天然窄于支付总流量。要达到商业规模，公司需要在数万活跃企业端点之间处理数百亿美元的总量，才能产生有意义的手续费收入。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
