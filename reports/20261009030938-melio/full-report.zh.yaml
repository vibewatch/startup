  - id: FE001
    title: Melio 端到端技术栈与数据流架构
    type: stack
    summary: 架构概览，详述从用户界面和文档摄取，到工作流规则、支付轨道执行和账本同步的技术层级。
    data:
      layers:
        - label: 用户界面与客户端层
          detail: 用于发票摄取、审批路由和现金流排期的网页仪表盘及移动友好界面。
        - label: 文档摄取与 AI 解析
          detail: 通过 OCR 和机器学习处理文档，提取供应商数据、到期日、明细项目和付款总额。
        - label: 业务逻辑与工作流规则
          detail: 基于角色的访问控制、最多 3 级审批、6 种用户角色和审计轨迹记录。
        - label: 支付轨道执行与清算
          detail: 解耦式支付编排通过 ACH、信用卡（2.9%）、支票打印 / 邮寄和当日交付来路由资金。
        - label: 会计同步中枢
          detail: 双向 API 连接器与 QuickBooks、Xero 和 NetSuite 同步账单、会计科目表和付款状态。
        - label: 风险、欺诈与安全基础设施
          detail: 银行级加密、自动化交易欺诈监控和合规验证控制。
    approximationNotes: 基于公开披露的平台能力和集成架构推导出的逻辑架构表示。
    claimRefs:
      - CE001
      - CE007
      - CE008
      - CE009
      - CE011
      - CE016
  - id: FU001
    title: Melio 客户采用与扩张路径
    type: journey-map
    summary: 可视化展示 SMB 用户从首次账单支付引导，到基于卡的现金流延期和供应商裂变扩张的进程。
    data:
      nodes:
        - id: onboarding
          label: 1. 自助引导
          touchpoints:
            - Quick account registration under 2 minutes
            - Connection of primary business bank account
            - Synchronization with QuickBooks or Xero ledger
        - id: first-payment
          label: 2. 首次供应商付款
          touchpoints:
            - Digital invoice upload via OCR capture
            - W-9 tax form request sent automatically to vendor
            - Execution of first free ACH bank transfer
        - id: cashflow-expansion
          label: 3. 现金流优化
          touchpoints:
            - Payment funded via commercial credit card to earn rewards
            - Vendor paid by paper check or direct deposit
            - Payment terms extended 30-45 days on card statement
        - id: workflow-scaling
          label: 4. 运营规模化
          touchpoints:
            - Multi-user payment approval rules configured
            - AI-powered expense management and receipt capture
            - Batch payment scheduling across monthly payables
        - id: accountant-collaboration
          label: 5. 外部会计师集成
          touchpoints:
            - Advisor invites multiple client entities into unified portal
            - Accountant reviews pending approvals and coding sync
            - Consolidated month-end reconciliation across client ledgers
        - id: viral-network-loop
          label: 6. 双边网络裂变
          touchpoints:
            - Vendor receives branded payment notification link
            - Vendor onboards to claim faster electronic deposit
            - Vendor adopts Melio to disburse payments to downstream suppliers
    approximationNotes: 路径图综合了有记录的用户引导工作流、费用管理产品上线和网络裂变循环。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU008
      - CU010
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 仅基于指定公开证据评估定性可能性、影响、缓释成熟度和剩余严重程度。
    data:
      columns:
        - label: 可能性
          detail: “未知”表示指定证据没有总体层面的发生率。
        - label: 影响
        - label: 缓释成熟度
        - label: 剩余严重程度
      rows:
        - label: 敏感数据或安全故障
          note: 已有暴露记录；尚未确定泄露频率。
          values:
            - label: Unknown
              tone: neutral
            - label: 高
              tone: risk
            - label: 已说明，未验证
              tone: warning
            - label: 高
              tone: risk
        - label: 验证驱动式账户关停
          note: 一则评价和公司回应证明了一种故障模式，而非普遍程度。
          values:
            - label: Unknown
              tone: neutral
            - label: 高
              tone: risk
            - label: 已说明流程
              tone: warning
            - label: 高
              tone: risk
        - label: 审批流程或支持服务故障
          note: 官方功能口径与客户报告相冲突。
          values:
            - label: Unknown
              tone: neutral
            - label: 高
              tone: risk
            - label: 已说明功能
              tone: warning
            - label: 高
              tone: risk
        - label: 第三方处理商或平台故障
          note: 服务商类别是公开的；集中度和故障切换情况不是。
          values:
            - label: Unknown
              tone: neutral
            - label: 高
              tone: risk
            - label: 已说明合同控制
              tone: warning
            - label: 高
              tone: risk
        - label: 卡网络或支付组合压力
          note: 有网络限制和历史交易量敏感性的证据。
          values:
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
            - label: 部分
              tone: warning
            - label: 中高
              tone: warning
        - label: 公开来源实体歧义
          note: 这是尽调质量风险，不是运营事件。
          values:
            - label: 已观察到
              tone: neutral
            - label: 低
              tone: neutral
            - label: 手动消歧
              tone: positive
            - label: 低
              tone: neutral
    approximationNotes: 仅为分析师定性分类；指定来源池中没有可用的数值概率、损失、事件率或控制有效性数据。
    claimRefs:
      - CR004
      - CR006
      - CR007
      - CR009
      - CR011
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模证据先经过变现、客户摩擦、价格质量和披露测试，再得出继续研究的决定。
    data:
      nodes:
        - label: 规模证明
          detail: 公司报告称拥有 100,000+ 名企业主，已处理金额达 $100B+。
        - label: 变现依赖
          detail: 收费付款选项需要很高的总交易量。
        - label: 产品质量测试
          detail: 一则当前不利评价指出审批流程和支持服务存在摩擦。
        - label: 价格质量测试
          detail: 公开参考值从 $2B 到 $4.5B，涵盖不同事件和时点。
        - label: 披露测试
          detail: 缺少独立收入质量、利润率、留存和交易条款数据。
        - label: 决策
          detail: 继续研究；不赋予独立入场价值或目标回报。
    approximationNotes: 该流程为定性分析；估值参考是报道中的历史或次级市场估值，不是计算得出的区间。
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
