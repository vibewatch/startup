      - number: '7.4'
        title: 合作伙伴、支付通道与经济性依赖
        blocks:
          - type: paragraph
            body: >-
              Melio
              的政策将平台合作伙伴、会计软件连接、支付处理商、欺诈服务商、托管商和网络安全供应商列为服务交付的一部分。价格资料称，卡支付仍受卡网络限制。历史投资者报道补充称，手续费经济性依赖客户在高总交易量中选择收费支付类型，API
              分发和 Intuit
              集成也是战略增长路径。由于公开资料池没有量化处理商、平台或嵌入式渠道集中度，这些关系的耐久性及其对利润率的影响仍未解开。清算失败时若只依赖一家未经测试的处理商或平台、合同变更损害访问或经济性，或支付结构恶化导致贡献利润率无法改善，都应列入否决标准。当前方案复杂度以及降级时删除高级数据，又增加了客户摩擦和转换风险问题。
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
