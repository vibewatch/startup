  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资框架
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，而不是买入：Melio 官网称拥有超过 100,000 名企业主、已处理超过 $100 billion，这支持产品相关性和规模；Bessemer
              早期资料也解释了为什么该模式需要很高的总支付量，才能从收费支付选择中变现。这些都是真实的投资论据，但两份资料都不能证明当前独立收入质量、利润率、现金生成、留存或可投资的安全性。一条当前客户评价还描述了无法使用的审批流程和缓慢支持，构成具体的反投资论据，而不是量化的流失结论。在指定证据中既没有可执行的私人市场价格，也没有经审计的运营桥接表，因此对等待这一决定的信心为中等，对任何内在价值估计的信心为低。风险高；假设以独立实体进入市场，当前估值立场缺乏支持且偏高。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
