        - 指定来源显示 $2 billion、$2.5 billion、$4 billion 和 $4.5 billion 等不同口径的参考值
        - 对账后的交易瀑布和当前规范化财务数据
      - - 反方
        - 产品和支持服务摩擦可能削弱转化、留存或扩张
