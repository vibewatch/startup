      - number: '5.2'
        title: 系统架构、处理引擎与通道执行
        blocks:
          - type: paragraph
            body: >-
              Melio 的运营架构由四个核心功能层组成：数据接入与文档提取层、工作流与业务逻辑引擎、支付编排与付款通道，以及会计集成框架
              FE001。其关键技术和经济差异在于资金来源与交付通道解耦：即使收款供应商只接受传统纸质支票或直接银行存款，小企业付款方仍可用信用卡（收取 2.9% 费用）或银行 ACH 为付款提供资金 CE003
              CE005。付款方选择纸质支票交付时，Melio 会代为打印并邮寄，标准配送窗口为 5–7 天，也提供加急配送 CE004 CE008。但独立基准分析显示，Melio 的架构主要针对单实体国内 SMB
              工作流优化；它缺少原生多地点自动拆分、自动总账（GL）预测编码，以及自动三方采购订单匹配等高级企业采购控制 CE002 CE010 CE011。Melio 虽支持向 88 个国家、以 15
              种货币付款，却没有集成外汇（FX）对冲工具，也缺少中端市场替代方案中的深度企业税务引擎，例如自动 1099/W-9 申报向导 CE012 CE013。
