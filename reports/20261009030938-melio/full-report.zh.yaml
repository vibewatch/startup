        title: 资本化历史、所有权与 Xero 战略收购
        blocks:
          - type: paragraph
            body: >-
              第三方资料称，截至 2021 年末 Series D，Melio 通过五轮融资筹得约 $706 million，其中包括以 $4.0 billion 估值完成的 $501 million Series
              D；这里没有经审计文件支持这些数字，因此应继续将其视为被报道的历史指标 [CO006]。Bessemer 另称，Melio 在 2020 年 9 月已通过数轮融资筹得 $144
              million，并将自己列为投资者；这印证了早期融资轨迹，但不能验证后来的累计总额 [CO003]。竞争对手 Cleo Pay 称，Xero 于 2025 年 6 月宣布收购，并于 2025 年 10 月 15
              日以约 $2.5 billion 对价完成交易；对价包括约 $2.15 billion 现金和约 $360 million Xero 股票，另有未来三年最高 $500 million 的员工激励
              [CO007]。$2.5 billion 是交易对价，不是可复用的独立估值，也不能证明 Melio 可获得这笔现金。
