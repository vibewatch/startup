        - 在讨论任何价格前，要求较宽的尽调安全边际
      - - 估值立场
        - 对独立投资判断而言，从缺乏依据到偏高
        - 报道中的参考值从 $2 billion 到 $4.5 billion 不等，但并非同口径
        - 将估值桥接到收入质量和现金创造能力的规范化估值
        - 把每个公开估值视为背景信息，而非公允价值
