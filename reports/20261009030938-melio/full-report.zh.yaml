    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Melio Payments Inc. 成立于 2018 年，总部位于纽约市。Bessemer Venture Partners 称，团队在纽约和特拉维夫组建 [CO001,
              CO002]。公司要解决的是小企业的现金流摩擦：供应商可能要求 ACH 或支票，而买方希望灵活选择付款方式和时间 [CO003]。即使供应商收到的是另一种支持的付款类型，Melio 也允许 SMB
              用卡为符合条件的供应商付款 [CO004]。第三方 2026 年价格资料显示，产品提供免费入门层，Core 为每月 $25，Boost 为每月 $55；其中一份资料还称刷卡支付费率为 2.9%，但实际条款仍需确认
              [CO005]。2026 年 6 月，公司发布公告称将推出代理驱动的网络，让买方付款可以通过供应商的应收账款系统执行，而无需供应商加入新的门户 [CO009]。
