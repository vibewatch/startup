      - number: '3.3'
        title: 护城河耐久性、平台脆弱点与不利风险
        blocks:
          - type: paragraph
            body: >-
              Melio 的竞争护城河主要来自简单易用的体验、支付通道机制与资金来源的解耦（即使供应商只接受支票或银行转账，付款方仍可使用信用卡），以及与 QuickBooks 和 Xero
              的深度会计同步。但这道防线在付款前流程自动化、客户支持可达性和跨境支付可靠性方面存在漏洞。独立用户评价和评论数据指出了多个运营摩擦点，包括自动合规算法触发的意外付款冻结、低层级方案有限的电话支持，以及因缺少原生
              AI 提取工具而需要手工录入发票数据。此外，在 Xero 收购 Melio 后，使用其他总账系统的潜在买方还需判断，产品路线投入是否会越来越偏向 Xero 原生工作流，而牺牲跨平台中立性。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: SMB 应付账款中的席位许可陷阱
            body: >-
              驱动成长型小企业离开 Melio 的首要运营因素不是软件可靠性，而是席位许可的经济性。Melio 为单人经营者提供有吸引力的免费 Go 层，但一旦需要增加第二审批人或外部簿记员，就必须升级到按席位收费的
              Core/Boost（$10/用户）或 $80/月的 Unlimited。与 Ramp 的免费团队平台或 Zoho Books 的账本捆绑模式相比，随着员工数和审批层级增加，Melio 的定价优势会减弱。
            calloutType: insight
            claimRefs:
              - CP005
              - CP008
          - type: callout
            title: Xero 收购后的产品路线对齐
            body: >-
              Xero 以最高 $3.0 billion 收购 Melio（交易于 2025 年 10 月完成，金额为 $2.5 billion）后，Melio 面临生态中立性的战略张力。虽然 Melio 继续支持
              QuickBooks Online 和其他会计账本，但长期功能迭代预计会优先服务 Xero 原生会计工作流，可能削弱其对庞大 QuickBooks 生态会计专业人士群体的吸引力。
            calloutType: risk
            claimRefs:
              - CP002
              - CP013
  - number: 4
