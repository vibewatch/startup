  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 处理规模转化为持久的付费交易量；Xero 的分发扩大覆盖面；流程质量和支持服务保持强劲
        - 只有在增长、利润率和留存获得审计证明后，历史上的数十亿美元参考值才具有相关背景意义
        - 低费率、支付轨道成本、欺诈或损失暴露，以及整合不足
        - 若付费组合、留存和贡献利润率经独立验证后改善，则信号强
      - - 基准
        - 存在战略价值，但公开证据仍不足以将经营价值与买方特有协同分开
        - 没有独立入场价值；仅将报道的 $2.5 billion 收购对价作为交易参考
        - 缺少交易瀑布、独立经济数据、优先权条款和协同兑现情况
        - 在核心尽调缺口仍未解决时，这一情景与指定证据最一致
      - - 悲观
        - 免费或低收益交易量占主导，流程和支持服务摩擦持续，或整合未能把规模转化为利润率
        - 跌破公开报道参考值是可能的，但无法支持精确下限
        - 留存流失、合作伙伴依赖、利润率压缩和执行拖累
        - 若客户摩擦扩大，或付费交易量和利润率恶化，信号增强
    notes: 情景仅指示方向，并非按概率加权的预测；公开估值是背景参考，不是可比区间或可执行价格。
