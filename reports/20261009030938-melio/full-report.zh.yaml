      - number: '8.2'
        title: 融资历史与价格背景
        blocks:
          - type: paragraph
            body: >-
              公开价格参考缺乏可比性，无法形成估值锚点。Tracxn 报道，2024 年 10 月公司以 $2 billion 投后估值完成 $150 million Series E，并另列出 2025 年 7 月 $4.5
              billion 的最后已知估值。Netfigo 将 Xero 报道的 $2.5 billion 前期收购对价与 $4 billion Series D 估值比较；Forge 则显示 2026 年 5
              月最后已知估值为 $2 billion。上述数字对应不同事件、定义和时点；Forge
              还称价格不可得、市场活动有限。因此，这一范围说明的是不确定性，而非可辩护的当前公允价值。已筹融资是历史融资，不是可用现金；若没有交易条款、负债、优先权、或有对价和当前经济性的支持，也不应把战略收购价格直接当作独立进入估值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: 情景分析与回报纪律
        blocks:
          - type: paragraph
            body: >-
              由于证据缺少收入基数、增长率、毛利率、自由现金流状况、留存，以及股份数或优先股堆叠，情景分析必须保持方向性。在乐观情景中，公司披露的处理规模转化为持久的收费支付量，Xero
              分发也能发挥作用，同时产品质量保持稳定；历史上的数十亿美元估值只能作为背景，而不能当作目标。基准情景把收购视为战略价值的证明，但在获得经审计的经济数据和整合结果前，不给独立价格赋予可复用性。悲观情景由免费银行转账量变现疲弱、工作流或支持摩擦持续，或战略买方无法把规模转化为利润触发。由于赋予概率或回报率会制造虚假的精确感，这里不作此类分配。
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              传统退出准备度分析很大程度上已被完成的交易取代：Forge 列出 2025 年 6 月的并购公告和 2025 年 10 月的交割，Seedtable 也标记 Melio 已被收购。             
              仍在更新的招聘页面只能弱地说明公司仍在运营，不能证明员工数量、留存、自主性或整合成功。最终尽调路径因此应转向交割后的证据：取得收购协议和或有对价条款、独立收入与利润率桥接、客户群留存和支付结构数据、合作伙伴集中度及整合计分卡。收费支付占比、留存、工作流可靠性、支持结果、合作伙伴分发或买方实现收入与成本协同的能力出现可衡量恶化，都是投资论点破裂的触发条件。在这些数据出现前，既无法支持目标回报，也无法支持持有期判断。
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV007
              - CV010
              - CV012
              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格纪律本身就是建议
            body: 不要把 Xero 的战略收购对价或私人市场数据点转换成新的独立进入价格。只有在获得交易瀑布、经审计运营桥接、留存、支付结构和整合结果后，才应重新开启估值讨论。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV016
