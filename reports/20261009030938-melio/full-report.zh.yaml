        title: 运营规模、网络覆盖与关键里程碑
        blocks:
          - type: paragraph
            body: >-
              Melio 当前规模来自公司口径和二手报道的混合，而非经审计的独立报表。官网称平台拥有超过 100,000 名企业主、已支付 40 million 张账单、处理金额超过 $100 billion，并向超过 two
              million 家供应商付款 [CO013]。2026 年 6 月，公司公告另称年支付量超过 $30 billion、服务企业接近 100,000 家，并以 Capital One、Shopify 和
              Fiserv 为其分发模式中的案例 [CO009]。Fintech.TV 报道称，Xero 的收购公告提到 80,000 家 SMB 客户、超过 $30 billion 的付款量和 $153 million
