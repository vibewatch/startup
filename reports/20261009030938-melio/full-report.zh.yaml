      - number: '3.2'
        title: 能力架构、定价机制与锁定效应
        blocks:
          - type: paragraph
            body: >-
              评估 AP 软件时，需要在基础订阅开销、按席位许可和按交易收费之间权衡工作流深度。Melio 的 Go 方案提供免费入门层，每月含 5 笔 ACH
              付款，但用户访问限制为单一席位；一旦引入多用户审批路由，成长中的组织就会被迫升级到 Core（$25/月加 $10/用户）或 Unlimited（$80/月）等付费层。相比之下，BILL
              按用户收费，起价为每位用户每月 $49，并可在 Sage Intacct、NetSuite 和 Microsoft Dynamics 365 等多种 ERP 环境间双向同步，同时提供自动 OCR
              发票提取和复杂的多步审批。对于更精简的团队，Ramp 等支出平台提供免费软件，靠企业卡交易量的交换费变现；QuickBooks Bill Pay 和 Zoho Books
              等原生会计账单支付插件则把交易执行留在既有账本内，避免二次软件对账。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
