figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间展示 Melio 从成立和早期风险融资，到估值峰值、被 Xero 战略收购以及 2026 年产品扩张的进程。
    data:
      items:
        - label: 成立与注册
          date: 2018-01
          detail: Melio Payments Inc. 由 Matan Bar、Ilan Atias 和 Ziv Paz 在纽约市创立，旨在将小企业应付账款数字化。
          tone: positive
          claimRefs:
            - CO001
        - label: A 轮融资
          date: 2019-11
          detail: 完成 $12M 的 A 轮融资，由 Aleph 和 Bessemer Venture Partners 领投。
          tone: positive
          claimRefs:
            - CO006
        - label: B 轮融资与结束隐身
          date: 2020-06
          detail: 获得由 Accel 领投的 $80M B 轮融资，并结束隐身，累计融资 $144M，同时接入 Intuit QuickBooks。
          tone: positive
          claimRefs:
            - CO003
            - CO006
        - label: C 轮融资
          date: 2021-01
          detail: 完成由 Coatue Management 领投的 $110M C 轮融资，以加快 SMB 付款业务的采用。
          tone: positive
          claimRefs:
            - CO006
        - label: D 轮峰值估值
          date: 2021-12
          detail: 完成由 Thrive Capital 和 General Atlantic 领投的 $501M D 轮融资，峰值估值为 $4.0B。
          tone: positive
          claimRefs:
            - CO006
        - label: 宣布收购
          date: 2025-06
          detail: 竞争对手 Cleo Pay 报道称，Xero 同意以约 $2.5B 的对价收购 Melio，另加最高 $500M 的员工激励。
          tone: positive
          claimRefs:
            - CO007
        - label: 收购完成
          date: 2025-10
          detail: Xero 于 2025 年 10 月 15 日正式完成对 Melio 的收购；Matan Bar 被任命负责合并后的美国业务。
          tone: neutral
          claimRefs:
            - CO007
        - label: 原生 Xero 账单支付上线
          date: 2026-03
          detail: 竞争对手 Cleo Pay 报道称，Xero 已嵌入 Melio 的付款能力，并在 2026 年 3 月前上线美国在线账单支付。
          tone: positive
          claimRefs:
            - CO014
        - label: 账户暂停投诉
          date: 2026-03
          detail: 一名 Trustpilot 评价者称排期付款后账户被取消，另一名评价者则称审批流程无法使用。
          tone: adverse
          claimRefs:
            - CO010
        - label: 自主 AI 支付网络
          date: 2026-06
          detail: 上线由智能体驱动的支付网络，无需手动引导供应商接入即可自动执行供应商应收账款流程。
          tone: positive
          claimRefs:
            - CO009
    approximationNotes: 只有指定来源明确给出月份时才保留月级日期；2018 年成立事项仅因来源只提供年份，才使用 1 月作为显示锚点。
