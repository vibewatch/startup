              评价既有正面的支持体验，也有账户被关闭和审批流程薄弱的具体负面反馈，说明运营体验存在差异，但不能据此推算事件率 [CO010]。Melio 称自己仍是 Xero 的独立平台，而竞争对手 Cleo Pay 称
              Xero 已在 2026 年 3 月前完成嵌入 [CO014, CO015]。
