  summary: >-
    Melio 是面向 SMB 的应付账款、应收账款和 B2B 支付平台，帮助中小企业简化供应商付款、现金流时点管理和对账。公司由 Matan Bar、Ilan Atias 和 Ziv Paz 于 2018
    年在纽约创立，靠免费增值账单支付模式和合作伙伴分发实现规模化，并于 2025 年 10 月被 Xero 收购。在母公司架构下，公开证据仍不足以完整还原其独立收入结构、利润率和治理情况。
