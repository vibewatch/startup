        title: 收入模式与变现机制
        blocks:
          - type: paragraph
            body: >-
              Melio 在 B2B 应付账款软件领域采用了一种不寻常的混合变现架构。它没有向小企业账户强制收取前置按席位许可费或固定月度订阅门槛，而是提供基础方案，对标准 ACH
              账单支付不收费，以降低获客摩擦并扩大商业客户的漏斗顶部覆盖。只有当企业用户选择增值交易能力时，变现才会动态启动，包括卡支付供应商、加急支付通道和国际转账。除直接自助变现外，Melio 还通过面向金融机构、垂直
              SaaS 平台和企业合作伙伴网络的嵌入式软件与白标分发协议获得商业收入。
