  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与 SMB 工作流集成
        blocks:
          - type: paragraph
            body: >-
              Melio 提供一体化应付账款（AP）和应收账款（AR）平台，旨在简化美国中小企业的付款和收款。该产品最初是为解决小企业经营者面临的结构性不灵活而设计：他们缺少专职内部财务部门，又经常受制于供应商账期。Melio
              将账单采集、审批路由、付款执行和会计对账整合进统一的云端界面 CE001 CE006。在标准 SMB 工作流中，供应商账单会被数字化导入或手动上传，触发自动光学字符识别（OCR）和 AI
              数据提取，解析供应商信息、发票金额、明细行和到期日 CE002 CE007。验证通过后，发票先进入可定制的审批流程，再通过银行转账、信用卡或实体支票付款
              CE008。在应收端，企业发起付款请求和付款链接，配合自动跟踪和逾期提醒，加快收款并减少手工行政负担 CE009。Melio 把消费级设计原则带入财务运营，让小企业把经营付款与个人账户分开，同时保有现金流控制
              CE006。
