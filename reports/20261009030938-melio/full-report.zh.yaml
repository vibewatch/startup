      - number: '2.3'
        title: 买方分层、预算归属与工作流采用路径
        blocks:
          - type: paragraph
            body: >-
              Melio
              核心目标市场的采购决策，与中端市场企业的应付账款决策有根本区别。在独立葡萄酒商、特色工艺生产商和本地贸易承包商等微型企业和小型零售商中，企业主或总经理亲自审批账单并控制运营银行账户。现金流波动，而不是后台人工减少，是主要采用催化剂：企业主面临明显的营运资金时点错配，需要等到供应商到期日才付款，同时供应商又要求快速结算。Melio
              让企业付款方用商业信用卡支付账单，即使收款供应商只接受银行 ACH 或纸质支票，从而把这一工作流接住，并将资金占用延长至信用卡账单周期。相反，当企业员工数超过 20
              人，工作流所有权会转移给专职簿记员和财务控制人员；他们更看重多级审批层级、自动税务合规和欺诈风险评估，而不是面向消费者的简洁体验。
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM012
              - CM014
      - number: '2.4'
        title: 增长驱动、采用约束与规模估值尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场扩张受到两股叠加顺风推动：纸质支票持续转向数字支付通道，以及 QuickBooks 等平台集成推动的嵌入式会计工作流快速采用。此外，单向双边网络传播会加快商户获取：活跃 Melio
              用户发起付款时，收款供应商会接触到平台并设置交付偏好，之后经常转化为活跃付款方。不过，采用也受到明显的结构性约束。第一，Melio 不评估买方信用风险，也不提供账期营运资金融资，使 B2B
              卖方暴露于客户发票违约风险。第二，随着企业扩大规模，审批层级和复杂 ERP 集成若不及成熟企业方案，运营上限就会显现。最后，仍缺少关键尽调信息：总支付量中究竟有多少选择了收费支付方式，而不是零毛利的免费 ACH
              通道。
            claimRefs:
              - CM004
              - CM009
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对微型企业而言，现金流时点优先于流程自动化
            body: 企业应付账款方案强调后台流程自动化和职责分离。小企业经营者则更看重流动性管理：能用商业信用卡支付供应商发票、保住现金，同时让供应商收到支票或直接 ACH 银行转账，这正是 Melio 的核心价值主张。
            calloutType: insight
            claimRefs:
              - CM003
              - CM009
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与市场分层
        blocks:
          - type: paragraph
            body: >-
              SMB 应付账款自动化市场分为四类竞争者：专门的应付账款和账单支付平台、支出管理与企业卡颠覆者、B2B 账期与卖方融资专家，以及原生会计账本。Melio
              的核心价值在于，面向小团队消除手写支票和行政付款负担，同时不强制收取前置软件订阅费，也不要求交易对手注册。但 BILL 等企业竞争者凭借完整 ERP 集成和成熟合规控制主导中端市场采购；Ramp
              等平台则把账单支付打包进零订阅费企业卡架构。此外，ResolvePay 等细分玩家专注卖方信用风险和账期融资，而非买方发票付款，因此在 B2B 交易管理中形成了清晰的功能边界。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
