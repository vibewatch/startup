evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: standalone-arr-and-segment-margins
    missingEvidence: >-
      Audited post-acquisition segment breakdown of Melio's recurring subscription ARR versus transaction fee take-rates
      and gross margin by payment rail.
    whyItMatters: >-
      Determines whether Melio's core payment flows generate durable high-margin software revenues versus lower-margin
      payment passthrough economics under Xero.
    diligencePath: >-
      Review subsequent Xero Limited (ASX: XRO) annual financial statements and investor briefings for dedicated North
      American payments segment reporting.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: complete-executive-and-board-composition
    missingEvidence: >-
      Full enumeration of post-acquisition board representation and operational vice presidents across finance,
      compliance, and legal divisions.
    whyItMatters: >-
      Clarifies governance autonomy, key-person risk, and regulatory compliance leadership following incorporation into
      Xero's corporate structure.
    diligencePath: >-
      Inspect Xero corporate governance disclosures, SEC/state corporate filings, and official executive appointment
      announcements.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: complete-historical-cap-table-allocations
    missingEvidence: >-
      Exact equity distribution, liquidation preferences, and secondary transaction proceeds across Series Seed through
      Series D venture syndicates.
    whyItMatters: >-
      Explains net venture proceeds and investor returns relative to the peak $4.0B valuation and the final $2.5B
      acquisition price.
    diligencePath: >-
      Examine shareholder meeting proxy circulars, ASX acquisition filing disclosures, and private venture fund
      distribution notes.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: volume-monetization-mix
    missingEvidence: >-
      Empirical breakdown of gross processing volume between free ACH transfers and fee-bearing transactions (credit
      card, same-day ACH, cross-border).
    whyItMatters: >-
      Gross volume of $100B+ cannot be translated into sustainable software revenue without knowing the exact
      monetization take rate across payment rails.
    diligencePath: >-
      Obtain detailed payment rail volume mix and fee breakdown from internal operational disclosures or Xero segment
      filings.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: churn-and-displacement
    missingEvidence: >-
      Granular data detailing Melio customer churn rates specifically transitioning to BILL, Ramp, or QuickBooks Bill
      Pay.
    whyItMatters: >-
      Direct displacement telemetry reveals whether Melio loses customers primarily due to seat pricing, approval
      limitations, or corporate card adoption.
    diligencePath: >-
      Request customer cohort retention and account downgrade metrics categorized by destination platform in management
      diligence.
    relatedQuestionRefs:
      - QP004
      - QP005
  - type: missing-source
    severity: minor
    topic: international-wire-economics
    missingEvidence: Audited transaction failure rates and partner clearing fees for Melio's cross-border payment processing rails.
    whyItMatters: >-
      Helps substantiate whether Melio's $20 international wire service is economically sustainable or structurally
      uncompetitive against Wise and Tipalti.
    diligencePath: Review vendor payment partner agreements and cross-border payment reconciliation logs during technical diligence.
    relatedQuestionRefs:
      - QP003
      - QP006
  - type: private-evidence-only
    severity: material
    topic: standalone-unit-economics
    missingEvidence: >-
      Audited financial disclosure of Melio's standalone revenue mix across subscription tiers, credit card take rates,
      expedited rail fees, and bank syndication rev-share.
    whyItMatters: >-
      Without segmented take-rate and contribution margin data, investors cannot calculate net revenue yield per dollar
      of processed payment volume.
    diligencePath: Request management profit-and-loss schedule broken down by payment rail and commercial partnership contract.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: gross-margin-and-burn
    missingEvidence: >-
      Rail-by-rail gross margin breakdown after payment network interchange fees, partner rev-share, and banking
      clearing expenses.
    whyItMatters: >-
      Gross margin determines whether processing volume scaling translates into positive operational cash flow or
      heightened unit losses.
    diligencePath: Obtain Xero segment reporting and transaction-clearing cost schedules for Melio's payment infrastructure.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: developer-api-metrics
    missingEvidence: >-
      Quantitative developer telemetry regarding public API traffic, uptime SLA historical performance, and third-party
      webhook failure rates.
    whyItMatters: >-
      Without public API health metrics, technical reliability for embedded software partners cannot be independently
      audited.
    diligencePath: >-
      Request engineering architecture reviews, SOC-2 Type II audit logs, and integration partner API error budgets
      under NDA.
  - type: missing-source
    severity: material
    topic: multi-location-ap-roadmap
    missingEvidence: >-
      Technical documentation specifying whether native multi-location automated bill splitting and automated general
      ledger predictive coding are planned on the product roadmap.
    whyItMatters: >-
      Determines whether Melio can organically scale into multi-unit retail, restaurant, and franchise operations or
      remains confined to single-entity SMBs.
    diligencePath: >-
      Review technical product management roadmap and interview product engineering leadership during technical due
      diligence.
  - type: private-evidence-only
    severity: material
    topic: cohort-retention
    missingEvidence: >-
      Audited cohort net retention rates (NRR), gross revenue retention (GRR), and logo churn percentages segmented by
      direct SMB vs. accountant-sourced users.
    whyItMatters: >-
      Public review metrics show high planned renewal, but contractual retention and expansion revenue cannot be
      independently validated without cohort data.
    diligencePath: >-
      Request confidential historical cohort retention tables, NRR trends, and monthly account churn reports from Xero
      investor relations.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-and-legal-inventory
    missingEvidence: Complete license, regulator, enforcement, litigation, privacy-complaint, and security-incident inventory.
    whyItMatters: >-
      Company policy describes obligations and safeguards but cannot establish whether regulators, courts, or customers
      have identified control failures.
    diligencePath: >-
      Obtain counsel's jurisdiction-by-jurisdiction license memo, regulator correspondence, litigation schedule,
      complaint log, and incident register; independently verify material entries.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR004
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-performance
    missingEvidence: Payment-failure, loss, recovery-time, account-closure, appeal, approval-workflow, and support-SLA cohort metrics.
    whyItMatters: >-
      Individual reviews establish plausible failure modes but do not measure their frequency, financial impact, or
      trend.
    diligencePath: >-
      Request twelve months of cohort data and incident postmortems, reconcile them to complaint and loss ledgers, and
      test representative workflows.
    relatedQuestionRefs:
      - QR002
      - QR003
      - QR007
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Processor, sponsor-bank, network, accounting-platform, and embedded channel concentration plus contract,
      liability, and failover terms.
    whyItMatters: >-
      External providers and platforms are central to delivery, while public evidence does not show substitutability or
      economic exposure.
    diligencePath: >-
      Review partner-level volume and revenue, contracts, renewal dates, service credits, termination rights,
      contingency plans, and completed failover tests.
    relatedQuestionRefs:
      - QR005
      - QR006
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: minor
    topic: evidence-quality
    missingEvidence: A broader independent and regulatory source set free of namesake search contamination.
    whyItMatters: >-
      The assigned pool includes an unrelated Melio entity and leaves several material risks dependent on company
      statements or individual reviews.
    diligencePath: >-
      In a later authorized research pass, disambiguate by legal entity and domain, then prioritize regulators, courts,
      banking partners, and independently audited control evidence.
    relatedQuestionRefs:
      - QR008
  - type: private-evidence-only
    severity: material
    topic: standalone-economics
    missingEvidence: >-
      Audited standalone revenue by stream, gross margin by payment rail, operating expenses, cash generation,
      retention, fee-bearing mix, fraud losses, and partner concentration.
    whyItMatters: >-
      Without these inputs, processing scale cannot be converted into durable revenue, margin, cash flow, or an
      intrinsic valuation.
    diligencePath: >-
      Obtain management accounts, payment-rail unit economics, cohort retention, loss data, partner contracts, and a
      reconciliation to Xero's post-close reporting.
    relatedQuestionRefs:
      - QV010
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      A normalized set of public-company, private-round, and M&A references matched on revenue mix, growth, margins,
      geography, payment volume, and transaction date.
    whyItMatters: >-
      The assigned valuation marks represent unlike events and cannot establish a defensible multiple or current
      fair-value range.
    diligencePath: >-
      Build a dated comparable set from filings and transaction documents, then normalize enterprise value for revenue
      quality, growth, margin, and control premiums.
    relatedQuestionRefs:
      - QV006
  - type: private-evidence-only
    severity: material
    topic: transaction-terms
    missingEvidence: >-
      Purchase agreement economics, fully diluted consideration, contingent payments, preference treatment, liabilities,
      retention packages, and integration scorecards.
    whyItMatters: >-
      The headline acquisition consideration cannot be translated into investor proceeds, standalone value, or
      post-close return expectations without the transaction waterfall.
    diligencePath: >-
      Review definitive transaction documents and board materials, and reconcile consideration paid with cap-table
      proceeds, assumed liabilities, earn-outs, and realized synergies.
    relatedQuestionRefs:
      - QV004
      - QV008
      - QV010
