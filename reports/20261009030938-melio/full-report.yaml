            title: Freemium Core Drives Volume Scale but Compresses Standalone Take Rate
            body: >-
              Melio's strategy of eliminating monthly software subscriptions enables rapid customer onboarding and high
              transaction volumes ($100B+ processed). However, because standard ACH payments carry no direct fee, the
