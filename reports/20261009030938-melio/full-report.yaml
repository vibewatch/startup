              accelerated settlement.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI010
          - type: callout
            title: Channel Concentration and Partner Volatility Under Xero Ownership
            body: >-
              While syndicated distribution broadens access across financial institutions and platforms, partner
              relationships carry structural termination risks, as demonstrated by the loss of the embedded QuickBooks
              Bill Pay integration. Ownership by Xero stabilizes corporate solvency but complicates independent vendor
              integration roadmaps.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
