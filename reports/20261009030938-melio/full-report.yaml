              - CR009
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: Legal, regulatory, and data risk
        blocks:
          - type: paragraph
            body: >-
              The privacy policy is the strongest direct source for the present legal and data posture. It documents
              collection of financial-account credentials, disclosures to partners and service providers, cross-border
              transfers, contractual safeguards, and privacy-rights processes. It also expressly states that internet
              transmission cannot be guaranteed secure. Current pricing separately notes card-network limitations, while
              customer evidence raises questions about the transparency of verification-led closures. The source set
              contains no regulator order, licensing inventory, court docket, independent control audit, or incident
              register, so absence of those records here is not evidence that no enforcement, litigation, or security
              event exists. Investment diligence should obtain the complete license map, regulator correspondence,
              data-flow inventory, DPA set, and recent control reports.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR009
              - CR010
