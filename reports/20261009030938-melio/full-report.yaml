    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Architecture, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Melio Payments Inc. was founded in 2018 and is headquartered in New York City, with Bessemer Venture
              Partners describing a team assembled in New York and Tel Aviv [CO001, CO002]. The company was created to
              address small-business cash-flow friction: suppliers may demand ACH or checks while buyers seek
              flexibility over payment method and timing [CO003]. Melio's workflow allows an SMB to fund an eligible
              vendor payment by card even when the vendor receives another supported payment type [CO004]. Third-party
              2026 pricing sources describe a free entry tier plus Core at $25 per month and Boost at $55 per month; one
              profile also reports a 2.9% card-payment fee, but live terms require confirmation [CO005]. In June 2026, a
              company-issued release announced an agent-powered network intended to execute buyer payments through
              supplier accounts-receivable systems without requiring suppliers to join a new portal [CO009].
