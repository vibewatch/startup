      - number: '5.2'
        title: System Architecture, Processing Engine, and Rail Execution
        blocks:
          - type: paragraph
            body: >-
              Melio's operating architecture is organized into four core functional layers: an ingestion and document
              extraction layer, a workflow and business-logic engine, a payment orchestration and disbursement rail, and
              an accounting integration framework FE001. A critical technological and economic differentiator is Melio's
              decoupled funding and delivery rail architecture: small business payers can fund disbursements using
              credit cards (bearing a 2.9% fee) or bank ACH transfers even when the recipient vendor only accepts
              conventional paper checks or direct bank deposits CE003 CE005. When a payer selects paper check delivery,
              Melio prints and physically mails the check on their behalf within standard (5–7 days) or expedited
              delivery windows CE004 CE008. However, independent benchmark analyses indicate that Melio's architecture
              is optimized primarily for single-entity domestic SMB workflows; it lacks native multi-location automated
              splitting, automated general ledger (GL) predictive coding, and advanced enterprise procurement controls
              such as automated three-way purchase-order matching CE002 CE010 CE011. While Melio supports payouts to 88
              countries in 15 currencies, it lacks integrated foreign exchange (FX) hedging tools and deep enterprise
              tax engines like automated 1099/W-9 filing wizards found in mid-market alternatives CE012 CE013.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE008
              - CE010
