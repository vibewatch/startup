        - Preserve optionality rather than manufacture a point estimate
      - - Risk rating
        - High
        - Volume-dependent monetization, product-friction evidence, and integration uncertainty
        - Durable fee-bearing mix, retention, reliability, and support metrics
        - Require a wide diligence margin before any price discussion
      - - Valuation stance
        - Unsupported-to-stretched for standalone underwriting
        - Reported references range from $2 billion to $4.5 billion but are not like-for-like
        - A normalized valuation bridge tied to revenue quality and cash generation
        - Treat every public mark as context, not fair value
      - - Return / hold / exit
        - Not supportable from assigned public evidence
        - Xero's acquisition is already closed and no standalone liquidity is shown
        - Defined security, entry price, ownership terms, and realizable exit route
        - No target return or hold period should be stated
    notes: >-
      Assessments are analytical judgments based only on the assigned public sources; absent financial, security, and
      transaction inputs are treated as gaps rather than estimates.
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Thesis
        - Demonstrated payment scale can create strategic distribution and data value
        - Melio reports more than 100,000 business owners and more than $100 billion processed
        - Independent confirmation of active users, payment volume, retention, and monetized mix
      - - Thesis
        - A high-volume fee model can monetize customer choice without charging every bank transfer
        - Bessemer describes fees on selected payment types and a need for high aggregate volume
        - Current take rate, gross margin by rail, fraud loss, and contribution margin
      - - Anti-thesis
        - Historical financing marks and acquisition consideration do not establish current standalone value
        - Assigned sources show $2 billion, $2.5 billion, $4 billion, and $4.5 billion references with different bases
        - Reconciled transaction waterfall and current normalized financials
      - - Anti-thesis
        - Product and support friction may weaken conversion, retention, or expansion
        - A March 2026 customer review reports an unusable approval workflow and delayed support
        - Cohort data showing durable retention plus measured workflow and support improvement
    notes: >-
      The customer-review row is a single adverse account, not a prevalence estimate; valuation references preserve each
      publisher's metric, period, and definition limits.
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Processing scale converts into durable fee-bearing volume; Xero distribution expands reach; workflow quality
          and support remain strong
        - >-
          Historical multi-billion-dollar references become relevant context only after audited growth, margin, and
          retention proof
        - Low take rate, rail costs, fraud or loss exposure, and integration shortfall
        - Strong if independently verified fee-bearing mix, retention, and contribution margin improve
      - - Base
        - >-
          Strategic value exists, but public evidence remains insufficient to separate operating value from
          buyer-specific synergies
        - >-
          No standalone entry value; use the $2.5 billion reported acquisition consideration only as a transaction
          reference
        - Missing transaction waterfall, standalone economics, preference terms, and synergy realization
        - Most consistent with the assigned evidence while the core diligence gaps remain open
      - - Bear
        - >-
          Free or low-yield volume dominates, workflow and support friction persist, or integration fails to convert
          scale into margin
        - Downside to the reported public references is plausible, but no precise floor can be supported
        - Retention loss, partner dependence, margin compression, and execution drag
        - Strengthens if customer friction broadens or fee-bearing volume and margins deteriorate
    notes: >-
      Scenarios are directional and not probability-weighted forecasts; public valuation marks are contextual
      references, not comparable ranges or executable prices.
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV008
