        title: Public Scale Traction and Capital Adequacy Under Xero
        blocks:
          - type: paragraph
            body: >-
              Publicly confirmed operational milestones demonstrate substantial platform scale, with over $100 billion
              in total processed volume, more than 40 million bills paid, over 2 million receiving vendors, and an
              active business base exceeding 100,000 operators. Prior to its acquisition by Xero announced in June 2025
              and finalized later that year, Melio raised substantial venture capital, including $144 million across
              early funding rounds to scale its payments infrastructure and partner integrations. The corporate
              integration into Xero eliminates independent private venture financing dependency, but creates an
              analytical opacity barrier for external underwriters evaluating standalone cash burn, rail gross margins,
              and customer acquisition payback periods.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
