  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and SMB Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Melio provides an integrated accounts payable (AP) and accounts receivable (AR) platform engineered to
              simplify business disbursements and collections for US small and mid-sized enterprises. Built originally
              to resolve the structural inflexibility confronting small business operators—who lack dedicated internal
              finance departments and often operate at the mercy of vendor payment terms—Melio consolidates bill
              capture, approval routing, payment execution, and accounting reconciliation into a unified cloud interface
              CE001 CE006. In standard SMB workflows, incoming vendor bills are ingested digitally or uploaded manually,
              triggering automated optical character recognition (OCR) and AI data extraction that parses vendor
              details, invoice amounts, line items, and due dates CE002 CE007. Once validated, invoices pass through
              customizable approval workflows before disbursement across bank transfers, credit cards, or physical
              checks CE008. On the receivables side, businesses issue payment requests and payment links with automated
              tracking and overdue reminders, accelerating collections and reducing manual administrative drag CE009. By
              integrating consumer-grade design principles into financial operations, Melio enables small businesses to
              separate business disbursements from personal accounts while maintaining cash-flow control CE006.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE008
              - CE009
