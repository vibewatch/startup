              - CU004
              - CU008
              - CU010
      - number: '6.3'
        title: Retention Durability, Workflow Friction, and Churn Signals
        blocks:
          - type: paragraph
            body: >-
              Independent sentiment across Info-Tech Research Group and Trustpilot reflects a bifurcated customer
              experience. While 91% of user sentiment on Info-Tech is positive with an 83 Net Emotional Footprint,
              customer reviews reveal acute operational friction points that elevate mid-market churn risk. Small
              business users migrating from BILL frequently report that Melio's multi-step bill approval workflows are
              insufficiently granular, leading to delayed payment routing and strained customer support turnaround.
              Furthermore, transaction fees for credit card payments accumulate rapidly for high-volume payers,
              prompting finance teams to compare Melio against all-inclusive flat-rate alternatives. Finally,
              uncommunicated account closures and payment freezes enacted by Melio's internal compliance and risk
              verification teams present critical operational disruptions for small businesses dependent on reliable
              vendor disbursements.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Mid-Market Approval Friction Creates Defection Risk to BILL
            body: >-
              While Melio captures entry-level small businesses through simple zero-subscription bill pay, mid-market
              businesses requiring complex hierarchical approval chains encounter notable friction. User reviews confirm
              that attempted migrations from BILL can stall over approval workflow limitations, indicating a ceiling on
              Melio's organic upmarket expansion unless enterprise controls are meaningfully upgraded.
            calloutType: risk
            claimRefs:
              - CU005
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk view
        blocks:
          - type: paragraph
            body: >-
              The most consequential public-evidence risks are data and security exposure, opaque account-verification
              outcomes, approval-workflow reliability, and dependence on external payment and data infrastructure. Melio
              says it handles sensitive banking credentials, uses partners and specialized service providers, transfers
              some information across jurisdictions, and cannot guarantee internet transmission security. A customer
              review also reports an account cancellation after a payment was scheduled; Melio's reply says an internal
              verification team handles such closures while support cannot disclose details. These observations show
              exposure, not a proven breach or a measured systemic failure. Residual severity remains high because the
              assigned public evidence does not establish incident frequency, closure-error rates, processor
              concentration, or tested recovery performance.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
              - CR010
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
