      - number: '4.2'
        title: GTM Channel Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Distribution efficiency has historically relied on two complementary go-to-market motions: direct small
              business digital acquisition and syndicated partner-led distribution. Syndicated channels through core
              banking platforms, software ecosystems, and accounting integrations target an addressable pool of
              approximately 3,500 financial institutions and up to 18 million small businesses across partner networks.
              However, partner-led distribution introduces structural volatility and counterparty roadmaps risks,
              exemplified by the wind-down of the embedded QuickBooks Bill Pay powered by Melio integration. Service
              delivery costs encompass interchange expenses on card transactions, payment gateway fees, banking partner
              clearing charges, verification operations, customer support overhead, and cloud infrastructure
              requirements.
