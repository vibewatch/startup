  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Boundary Logic, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The business-to-business payments landscape in the United States represents an aggregate annual
              transaction volume of approximately $25 trillion, of which small and medium-sized businesses account for
              roughly $10 trillion in payments to external vendors, suppliers, and contractors. Melio's primary
              addressable market boundary encompasses non-payroll operational vendor disbursements, utility payments,
              inventory procurement, and commercial services for micro and small enterprises. We explicitly exclude
              enterprise treasury operations, high-frequency supply chain electronic data interchange transactions,
              consumer peer-to-peer transfers, and internal employee payroll from this core scope. The dominant
              status-quo substitute is not incumbent enterprise software, but manual paper checks—which historically
              account for roughly 40% of SMB commercial disbursements—and basic bank portal automated clearing house
              transfers. Small business owners rely on these legacy rails because traditional accounts payable
              automation platforms enforce rigid setup overhead, complex chart-of-accounts mapping, and high monthly
              subscription minimums that over-serve single-operator shops and micro-businesses.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: Market Sizing Lenses and Constrained TAM/SAM/SOM Boundaries
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for SMB bill payment requires dissecting aggregate transaction volume
              into realizable software and payment fee revenue. While the top-line US B2B payments volume reaches $25
              trillion, the serviceable addressable market contracts to the estimated $10 trillion transacted annually
              by the 31 million US small businesses, of which 81% are non-employer sole proprietorships or micro-firms.
              Melio's serviceable obtainable market reflects the monetizable gross processing volume flowing across
              flexible payment rails—specifically credit card transactions, accelerated same-day transfers, and
              international disbursements—rather than non-monetized free ACH transfers. Because Melio provides standard
              ACH processing and check mailing without subscription fees on entry tiers, the software monetization pool
              is structurally narrower than gross payment flow. Achieving commercial scale requires processing
              double-digit billions in gross volume across tens of thousands of active business endpoints to generate
              meaningful fee income.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
