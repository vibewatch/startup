schemaVersion: "report-v2"
artifact: risks
slug: melio
runDate: 2026-10-09
company:
  name: Melio
chapter:
  number: 7
  title: Risks
  summary: >-
    Melio's highest residual risks are sensitive-data exposure, opaque
    verification-driven account closures, workflow and support execution, and
    dependence on external payment and software partners. Public materials
    describe controls and product mitigations, but do not quantify incident
    rates, false-positive closures, processor concentration, control
    effectiveness, or service levels.
sections:
  - id: ranked-risk-view
    title: Ranked residual risk view
    body: >-
      The most consequential public-evidence risks are data and security
      exposure, opaque account-verification outcomes, approval-workflow
      reliability, and dependence on external payment and data infrastructure.
      Melio says it handles sensitive banking credentials, uses partners and
      specialized service providers, transfers some information across
      jurisdictions, and cannot guarantee internet transmission security. A
      customer review also reports an account cancellation after a payment was
      scheduled; Melio's reply says an internal verification team handles such
      closures while support cannot disclose details. These observations show
      exposure, not a proven breach or a measured systemic failure. Residual
      severity remains high because the assigned public evidence does not
      establish incident frequency, closure-error rates, processor
      concentration, or tested recovery performance.
    claimRefs: [CR001, CR002, CR003, CR004, CR009, CR010, CR015]
    figureRefs: [FR001]
  - id: legal-regulatory-and-data
    title: Legal, regulatory, and data risk
    body: >-
      The privacy policy is the strongest direct source for the present legal
      and data posture. It documents collection of financial-account
      credentials, disclosures to partners and service providers, cross-border
      transfers, contractual safeguards, and privacy-rights processes. It also
      expressly states that internet transmission cannot be guaranteed secure.
      Current pricing separately notes card-network limitations, while customer
      evidence raises questions about the transparency of verification-led
      closures. The source set contains no regulator order, licensing inventory,
      court docket, independent control audit, or incident register, so absence
      of those records here is not evidence that no enforcement, litigation, or
      security event exists. Investment diligence should obtain the complete
      license map, regulator correspondence, data-flow inventory, DPA set, and
      recent control reports.
    claimRefs: [CR001, CR002, CR003, CR004, CR006, CR009, CR010]
    tableRefs: [TR001]
  - id: operational-quality-and-support
    title: Operational, quality, and support risk
    body: >-
      Melio company-claims more than $100 billion of processed volume, which
      increases the impact of payment, fraud, security, or support-control
      failures even though the figure is not independently verified here. The
      adverse customer evidence is specific but not statistically
      representative: one reviewer describes an unusable approval workflow and
      unanswered tickets, while another describes a transfer affected by wrong
      bank details that support ultimately helped resolve. Official materials
      advertise simple small-business UX, custom approval workflows, user
      controls, and tiered support, creating a direct execution test rather than
      proving those controls work at scale. A thesis break would be an
      undisclosed material incident, repeated settlement failures, or an
      inability to provide twelve months of payment-failure, closure, support,
      and recovery metrics.
    claimRefs: [CR005, CR011, CR012, CR013, CR015]
    tableRefs: [TR002]
  - id: partner-and-model-dependencies
    title: Partner, rail, and economic dependencies
    body: >-
      Melio's policy identifies platform partners, accounting-software
      connections, payment processors, fraud providers, hosting, and
      cybersecurity vendors as parts of service delivery. Pricing says
      card-funded payments remain subject to card-network limits. Historical
      investor reporting adds that fee economics depended on customers choosing
      paid payment types across high aggregate transaction volume, and that API
      distribution and an Intuit integration were strategic growth paths.
      Because the public pool does not quantify processor, platform, or embedded
      channel concentration, the durability of these relationships and their
      margin effects remain open. Kill criteria should include a single
      processor or platform without tested failover, contractual change that
      impairs access or economics, or payment-mix deterioration that prevents
      contribution-margin improvement. Current plan complexity and premium-data
      deletion on downgrade add customer-friction and switching-risk questions.
    claimRefs: [CR002, CR006, CR007, CR008, CR014, CR015]
    tableRefs: [TR003]
  - id: evidence-boundaries
    title: Evidence boundaries and diligence priorities
    body: >-
      The risk conclusion is constrained by the assigned pool. It contains
      company policies and product pages, historical investor commentary, an
      independent software overview, a customer-review page, and one unrelated
      namesake result. The namesake result is retained only to document
      entity-resolution noise and does not support any claim about Melio
      Payments' controls or operations. Customer reviews supply concrete failure
      modes but not prevalence; company pages describe mitigations but not their
      effectiveness. Priority diligence is therefore quantitative: request
      security incidents and losses, KYC closure and appeal rates, payment
      failure and recovery times, support SLAs, processor and partner
      concentration, network-fee sensitivity, and evidence that approval
      workflows perform under representative customer loads.
    claimRefs: [CR011, CR012, CR013, CR015, CR016]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Rule, control, or case
      - Jurisdiction
      - Public status
      - Likelihood
      - Severity
      - Public mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Sensitive financial data and privacy obligations
        - United States and cross-border processing
        - Policy describes CCPA/CPRA rights, sensitive banking data, disclosures, and transfers
        - High exposure
        - High
        - Administrative, technical, physical, contractual, and privacy-request controls are stated
        - High; effectiveness and incident history are not public in this pool
        - Obtain data-flow map, DPAs, SOC reports, penetration results, incident register, and regulator correspondence
      - - Verification-led account restriction or closure
        - United States service users
        - Customer report and company response confirm an internal closure process; prevalence is unknown
        - Unknown
        - High
        - Internal verification team and email notification are stated
        - High; notice quality, appeal rights, and false-positive rates are unquantified
        - Review KYC/AML policy, closure reasons, appeal SLA, false-positive rate, and complaints
      - - Card-network and payment-rail rules
        - Card and payment networks
        - Current pricing expressly makes card-funded vendor payments subject to network limitations
        - Medium
        - Medium
        - Product disclosure and multiple payment methods
        - Medium-high; sponsor, acquirer, and network dependencies are undisclosed
        - Inspect sponsor-bank and processor agreements, network monitoring, reserves, and compliance findings
    notes: >-
      Partial public-evidence register as of 2026-10-09; no complete license,
      regulator, litigation, or enforcement inventory was available in the
      assigned pool, and likelihood labels are qualitative.
    enumerationScope:
      coverage: partial
      basis: >-
        Public obligations and control issues evidenced by the assigned
        prefetched sources as of the report run date.
    claimRefs: [CR001, CR002, CR003, CR004, CR006, CR009, CR010]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
      - Monitor or kill criterion
    rows:
      - - Unauthorized access, data loss, or insecure transmission
        - Unknown
        - High
        - Controls stated; effectiveness unverified
        - High
        - No incident frequency, independent control report, or recovery result
        - Kill on undisclosed material incident or unresolved critical control deficiency
      - - Verification-driven closure after payment scheduling
        - Unknown
        - High
        - Internal process stated; appeal transparency unclear
        - High
        - Closure, false-positive, notice, and appeal rates
        - Kill if management cannot provide cohort-level closure and appeal outcomes
      - - Approval workflow or support failure
        - Customer evidence shows an occurrence; prevalence unknown
        - High
        - Product features and support tiers stated; performance unverified
        - High
        - Workflow success, ticket backlog, first-response, and resolution metrics
        - Kill on repeated representative-load failures or missed contractual SLAs
      - - Incorrect bank details or transfer non-deposit
        - Customer evidence shows an occurrence; prevalence unknown
        - Medium-high
        - Support-assisted resolution is evidenced
        - Medium
        - Error-prevention, recall success, loss rate, and recovery time
        - Monitor payment exceptions, unrecovered losses, and time to resolution
      - - Scale-amplified payment or support disruption
        - Unknown
        - High
        - Company describes controls and support, but no tested resilience metric
        - High
        - Official processing claim lacks independent verification and reliability denominator
        - Kill if volume growth is not matched by stable failure and recovery rates
    notes: >-
      Qualitative ranking combines company disclosures and individual customer
      reports; review examples identify failure modes but do not establish
      population-level frequency.
    claimRefs: [CR004, CR005, CR009, CR010, CR011, CR012, CR013, CR015]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Public mitigation
      - Residual exposure
    rows:
      - - Payment, fraud, hosting, and security services
        - Unnamed service providers
        - Transaction processing, fraud control, hosting, and cyber support
        - Not disclosed
        - Provider outage, breach, control failure, or adverse commercial change
        - High
        - Purpose-limited provider access and contractual safeguards are stated
        - High until concentration, liability, and failover are reviewed
      - - Accounting and embedded-platform connections
        - Platform partners, accounting software, and historically Intuit
        - Data sync, workflow distribution, and embedded payments
        - Not disclosed
        - API degradation, platform-policy change, or channel loss
        - High
        - Multiple integrations and an API strategy are described
        - High because partner-level volume and contract durability are unavailable
      - - Card networks and payment rails
        - Card networks and processors
        - Funding acceptance and payment delivery
        - Structurally concentrated by rail
        - Network restriction, fee increase, reserve requirement, or routing disruption
        - High
        - Multiple payment methods and explicit network-limit disclosure
        - Medium-high; economics and redundancy are not quantified
      - - Transaction-volume and payment-mix economics
        - Paying customers and payment methods
        - Fee generation and contribution margin
        - Not disclosed
        - Lower paid-rail mix or volume reduces fee economics
        - High
        - Current subscription tiers and transaction fees diversify monetization
        - High; current unit economics and mix sensitivity are unavailable
    notes: >-
      Partner names and concentration are incomplete; the economic model claim
      is historical BVP commentary and is not a current margin or revenue
      measure.
    claimRefs: [CR002, CR006, CR007, CR008, CR014, CR015]
figures:
