    summary: >-
      Qualitative likelihood, impact, mitigation maturity, and residual severity
      based only on the assigned public evidence.
    data:
      columns:
        - label: Likelihood
          detail: Unknown means the assigned evidence has no population-level rate.
        - label: Impact
        - label: Mitigation maturity
        - label: Residual severity
      rows:
        - label: Sensitive-data or security failure
          note: Exposure is documented; no breach frequency is established.
          values:
            - label: Unknown
              tone: neutral
            - label: High
              tone: risk
            - label: Stated, unverified
              tone: warning
            - label: High
              tone: risk
        - label: Verification-led account closure
          note: One review and company response establish a failure mode, not prevalence.
          values:
            - label: Unknown
              tone: neutral
            - label: High
              tone: risk
            - label: Process stated
              tone: warning
            - label: High
              tone: risk
        - label: Approval workflow or support failure
          note: Official feature claims conflict with a customer report.
          values:
            - label: Unknown
              tone: neutral
            - label: High
              tone: risk
            - label: Features stated
              tone: warning
            - label: High
              tone: risk
        - label: Third-party processor or platform failure
          note: Provider categories are public; concentration and failover are not.
          values:
            - label: Unknown
              tone: neutral
            - label: High
              tone: risk
            - label: Contractual controls stated
              tone: warning
            - label: High
              tone: risk
        - label: Card-network or payment-mix pressure
          note: Network limits and historical volume sensitivity are evidenced.
          values:
            - label: Medium
              tone: warning
            - label: Medium-high
              tone: warning
            - label: Partial
              tone: warning
            - label: Medium-high
              tone: warning
        - label: Public-source entity ambiguity
          note: This is a diligence-quality risk, not an operating incident.
          values:
            - label: Observed
              tone: neutral
            - label: Low
              tone: neutral
            - label: Manual disambiguation
              tone: positive
            - label: Low
              tone: neutral
    approximationNotes: >-
      Qualitative analyst classification only; no numeric probability, loss,
      incident-rate, or control-effectiveness data was available in the
      assigned source pool.
    claimRefs: [CR004, CR006, CR007, CR009, CR011, CR012, CR015, CR016]
callouts:
  - calloutType: risk
    title: Public controls are not control-effectiveness evidence
    body: >-
      The company describes safeguards, verification processes, approval
      features, and support tiers, but the assigned sources do not quantify
      effectiveness, service levels, or incident outcomes.
    claimRefs: [CR010, CR012, CR015]
  - calloutType: recommendation
    title: Gate investment on operating evidence
    body: >-
      Require control reports, incident and payment-loss history, KYC closure
      cohorts, support metrics, processor concentration, failover tests, and
      payment-mix unit economics before treating stated mitigations as mature.
    claimRefs: [CR002, CR007, CR009, CR011, CR015]
