company:
  name: vVARDIS
chapter:
  number: 1
  title: Company Overview
  summary: >-
    vVardis enters the October 2026 refresh as a Swiss dental medtech company built around
    Curodont, with public evidence showing fast U.S. commercial adoption, $85 million of
    disclosed 2025 OrbiMed financing, and an April 2026 Apollo minority investment that
    independent coverage ties to a unicorn valuation. The same public record remains thin
    on audited financials, cap-table detail, board composition, and a single supportable
    founding date, so the identity and scale narrative is much stronger than the
    underwrite-ready disclosure set.
sections:
  - id: identity-and-platform
    title: Identity, product platform, and what is actually verified
    body: >-
      The assigned refresh evidence consistently supports the high-level company identity even
      where deeper corporate chronology remains incomplete. Official and independent sources
      describe vVardis as a Swiss dental medtech or oral-health company headquartered in Zug,
      led by dentist sisters Haley and Goly Abivardi. Public product surfaces are also
      consistent on the core proposition: Curodont is presented as a drill-free,
      peptide-based, biomimetic treatment for early-stage tooth decay that works with saliva
      minerals to regenerate enamel. What is not equally well supported is the incorporation
      timeline. Third-party profiles in the assigned pool do not reconcile cleanly with the
      company-controlled narrative, and the official pages reviewed here foreground founder
      biographies and product claims rather than a dated corporate history. That means later
      chapters can safely reuse the company identity, founders, location, and product
      framing, but should treat a precise founding date as an open diligence item rather than
      as settled ground truth.
    claimRefs: [CO001, CO002, CO003, CO004, CO016]
    tableRefs: [TO001]
  - id: leadership-capital-and-control
    title: Leadership concentration, financing path, and control signals
    body: >-
      The public record is unusually founder-centric. Across the official site, press
      releases, and independent reporting, the Abivardi sisters are not just the public face
      of the company but the visible operating and ownership center of gravity. That can be a
      strength for category evangelism, because the founders are practicing dentists and
      repeat dental entrepreneurs, but it also creates clear key-person dependence until the
      board, executive bench, and minority-protection terms are disclosed. On financing, the
      evidence is directionally strong even if it is not fully underwrite-ready: vVardis
      announced a $35 million OrbiMed round in February 2025, another $50 million from
      OrbiMed in July 2025, and then an April 2026 strategic minority investment from
      Apollo-managed funds that external coverage ties to a valuation above $1 billion.
      Independent reporting further indicates the founders still held majority control after
      the Apollo round, with Swissinfo citing a roughly 70% stake, but the actual security
      terms and governance rights remain undisclosed in the assigned public evidence.
    claimRefs: [CO002, CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: commercial-momentum-milestones-and-refresh-risks
    title: Commercial momentum is visible, but disclosure still lags the valuation story
    body: >-
      The commercial narrative strengthened during the refresh window. Company materials at
      the January 2026 J.P. Morgan Healthcare Conference said Curodont had treated more than
      2 million teeth in 24 months, and April-to-October 2026 third-party reporting pushed
      that scale signal to roughly 3 million treated teeth and nearly 20% of U.S. general
      dental practices. The milestone pattern also shows disciplined channel building:
      VideaHealth and Pearl partnerships tied diagnosis to treatment, while Henry Schein
      progressed from an exclusive DSO distribution role in 2024 to a broader all-segment
      U.S. partnership in late 2025. Even so, the most current late-stage-private narrative
      still rests on selective operating disclosures. Swissinfo/Bloomberg reported that the
      company was working with JPMorgan and Goldman Sachs on a possible U.S. IPO in October
      2026, but the story explicitly said no final decision had been made. Without audited
      revenue, margin, cash, headcount, customer-count, or board disclosures in the assigned
      refresh evidence, the public scale story is stronger than the public underwriting file.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
