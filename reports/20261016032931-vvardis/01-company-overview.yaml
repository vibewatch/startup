figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public milestones show a step-up from U.S. channel formation in 2024 to financing,
      partnership expansion, and exploratory IPO preparation by October 2026.
    data:
      items:
        - date: 2024-06-13
          label: VideaHealth partnership
          detail: vVardis announced a partnership with VideaHealth to pair improved diagnostics with earlier caries treatment.
          tone: positive
          claimRefs: [CO013]
        - date: 2024-09-17
          label: Henry Schein DSO exclusivity
          detail: Henry Schein was named exclusive distributor of Curodont for larger U.S. dental service organizations.
          tone: positive
          claimRefs: [CO012]
        - date: 2025-02-11
          label: First disclosed OrbiMed financing
          detail: vVardis announced a $35 million financing from OrbiMed to support rollout and growth.
          tone: positive
          claimRefs: [CO006]
        - date: 2025-05-14
          label: Pearl collaboration
          detail: vVardis announced a global collaboration with Pearl to link AI-led early detection with drill-free treatment.
          tone: positive
          claimRefs: [CO013]
        - date: 2025-07-15
          label: Follow-on OrbiMed round
          detail: vVardis announced another $50 million from OrbiMed, bringing disclosed OrbiMed financing to $85 million.
          tone: positive
          claimRefs: [CO007]
        - date: 2025-12-01
          label: Henry Schein partnership expansion
          detail: Henry Schein expanded from DSO exclusivity to exclusive U.S. distribution across all dental segments.
          tone: positive
          claimRefs: [CO012]
        - date: 2026-01-12
          label: J.P. Morgan conference milestone
          detail: At J.P. Morgan Healthcare Conference, founders said Curodont had treated over 2 million teeth in the prior 24 months.
          tone: positive
          claimRefs: [CO010]
        - date: 2026-04-27
          label: Apollo minority investment
          detail: Apollo-managed funds made a strategic minority investment that external coverage associated with a unicorn valuation.
          tone: positive
          claimRefs: [CO008, CO009]
        - date: 2026-10-12
          label: Exploratory IPO reporting
          detail: Swissinfo/Bloomberg reported vVardis was working with JPMorgan and Goldman Sachs on a possible U.S. IPO, but no final decision had been made.
          tone: risk
          claimRefs: [CO014]
    approximationNotes: >-
      Dates come from public announcements or reporting; the October 2026 IPO item records an
      exploratory report, not a completed transaction.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO012, CO013, CO014]
callouts:
  - calloutType: insight
    title: Category creation is visible before full financial disclosure
    body: >-
      The assigned refresh evidence supports a real commercial narrative—distribution scale,
      repeat financing, and unicorn valuation signaling—but it still does not provide the
      operating disclosure set needed to convert momentum into an underwrite-ready growth
      profile.
    claimRefs: [CO007, CO011, CO014, CO015]
  - calloutType: risk
    title: Founder concentration remains both an asset and a diligence constraint
    body: >-
      The Abivardi sisters appear to anchor product credibility, commercial storytelling, and
      post-Apollo control, which strengthens continuity but also raises key-person and
      governance questions until the broader board and executive structure is disclosed.
    claimRefs: [CO002, CO005, CO009]
