      Ordered by residual severity; concentration reflects how much current U.S. scale appears to rely on each external dependency in the assigned sources.
    claimRefs: [CR001, CR002, CR007, CR009, CR010, CR012, CR013]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual risks are reimbursement conversion, distributor concentration, and capital-markets execution rather than basic technical novelty.
    data:
      columns: [Likelihood, Impact, Mitigation maturity, Residual risk]
      rows:
        - label: Coverage and reimbursement lag
          note: Public sources still describe inconsistent coverage and fee-for-service adoption.
          values: [High, High, Early, High]
        - label: Evidence and indication scope
          note: Public claims are strongest for early non-cavitated lesions, with mixed independence in the evidence pack.
          values: [Medium, High, Moderate, Medium-High]
        - label: U.S. distributor concentration
          note: Public reporting points to exclusive Henry Schein distribution in the U.S.
          values: [Medium-High, High, Early, High]
        - label: Financing and IPO execution
          note: Unicorn valuation and reported IPO workstream increase disclosure expectations before core private metrics are public.
          values: [Medium, High, Early, High]
        - label: Practice-level workflow execution
          note: Same-appointment use is a strength, but clinician training and case selection still determine repeatable outcomes.
          values: [Medium, Medium-High, Moderate, Medium]
        - label: Outcome timing and patient adherence
          note: Benefits are marketed over a multi-month window rather than as an immediate restorative fix.
          values: [Medium, Medium-High, Early, Medium-High]
    claimRefs: [CR001, CR002, CR003, CR005, CR007, CR009, CR010, CR012, CR013]
callouts:
  - calloutType: risk
    title: Reimbursement remains the clearest single-point downside
    body: >-
      Adoption can look strong while still being fragile if practices keep relying on cash-pay behavior;
      the public sources repeatedly show coverage inconsistency rather than a proven insurer-funded flywheel.
    claimRefs: [CR007, CR008, CR013]
  - calloutType: insight
    title: The core product risk is scope discipline, not basic category legitimacy
    body: >-
      The sources support real clinical differentiation, but they also keep the investable use case
      tightly tied to early, non-cavitated lesions with slower proof windows than a simple restorative procedure.
    claimRefs: [CR003, CR004, CR005, CR006]
  - calloutType: recommendation
    title: Use measurable kill criteria before accepting a public-market-style multiple
    body: >-
      Do not underwrite the unicorn mark without office-penetration progression, payer conversion, distributor-term clarity,
      and financing disclosures that move beyond valuation headlines and rollout claims.
    claimRefs: [CR001, CR002, CR009, CR010, CR012]
