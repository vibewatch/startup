      - [Growth capital and strategic sponsorship, Apollo-managed funds, Minority investor backing global rollout and signaling category legitimacy, Medium-High, Expansion plan outruns financing or later-round / IPO demand weakens, High, Current unicorn valuation and sponsor credibility, High]
