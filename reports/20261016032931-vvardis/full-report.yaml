      - number: '1.3'
        title: Commercial momentum is visible, but disclosure still lags the valuation story
        blocks:
          - type: paragraph
            body: >-
              The commercial narrative strengthened during the refresh window. Company materials at the January 2026
              J.P. Morgan Healthcare Conference said Curodont had treated more than 2 million teeth in 24 months, and
              April-to-October 2026 third-party reporting pushed that scale signal to roughly 3 million treated teeth
              and nearly 20% of U.S. general dental practices. The milestone pattern also shows disciplined channel
              building: VideaHealth and Pearl partnerships tied diagnosis to treatment, while Henry Schein progressed
              from an exclusive DSO distribution role in 2024 to a broader all-segment U.S. partnership in late 2025.
              Even so, the most current late-stage-private narrative still rests on selective operating disclosures.
              Swissinfo/Bloomberg reported that the company was working with JPMorgan and Goldman Sachs on a possible
              U.S. IPO in October 2026, but the story explicitly said no final decision had been made. Without audited
              revenue, margin, cash, headcount, customer-count, or board disclosures in the assigned refresh evidence,
              the public scale story is stronger than the public underwriting file.
