  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and category definition
        blocks:
          - type: paragraph
            body: >-
              The product surface is broader than one restorative claim. vVARDIS positions Curodont Repair as its
              flagship professional therapy for early, non-cavitated caries, then extends the same peptide-led enamel
              story into Protect, D'Senz, enamel-serum, and whitening/home-care products. That makes the company look
              more like a clinical platform with a lead therapy and adjacencies than a single consumable. Public
              differentiation also centers on what the therapy avoids: drilling, needles, staining, and artificial
              filling materials, with the tradeoff that most proof in the retained evidence remains company-curated
              rather than independently disclosed at raw-study or audited commercial-data level.
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE009
      - number: '5.2'
        title: How the therapy works in practice
        blocks:
          - type: paragraph
            body: >-
              The retained official and trade evidence makes the mechanism specific enough to underwrite the product
              concept. vVARDIS says the P11-4 peptide diffuses into an early lesion, self-assembles into a biomatrix,
              and recruits calcium and phosphate ions from saliva to form new hydroxyapatite. Just as important, the
              workflow is clearly not a passive topical rinse: onboarding and application materials require lesion
              selection, preparation, etching, rinse/dry steps, isolation, and surface-specific application. In other
              words, the moat is partly molecular science and partly protocol discipline, which is why training and
              correct indication boundaries matter as much as the core formulation.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE011
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE006
