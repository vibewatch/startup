  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Clinical indication, chairside protocol, peptide mechanism, and channel enablement stack together to create the
      product system.
    data:
      layers:
        - label: Clinical indication and diagnosis
          summary: Early-lesion selection is the first control point.
          items:
            - Interproximal, occlusal, and smooth-surface lesions
            - Adult, pediatric, and orthodontic use cases
          outputs:
            - Eligible early, non-cavitated lesion selected before treatment
        - label: Chairside preparation and application
          summary: Deployment is a protocol, not a simple retail-use step.
          items:
            - Pellicle removal, etch, rinse/dry, and isolation
            - Surface-specific Curodont Repair placement
          modules:
            - Less than 5-minute application claim alongside an 8-10 minute full professional process tutorial
          outputs:
            - Non-invasive same-visit treatment option for qualified lesions
        - label: Peptide regeneration mechanism
          summary: P11-4 scaffolds enamel repair inside the lesion.
          items:
            - Diffusion into lesion depth
            - Self-assembly into biomatrix
            - Calcium and phosphate recruitment from saliva
          outputs:
            - Hydroxyapatite regeneration and arrest/regression claims
        - label: Commercial enablement and scale
          summary: Training and channel execution sit on top of the science.
          items:
            - Certified Curodontist e-learning path
            - Henry Schein exclusive U.S. distribution
            - Patient-facing clinic locator and practitioner messaging
          outputs:
            - Fast rollout with dependency on field education and distributor execution
        - label: Clinical evidence layer
          summary: Study-backed marketing claims bridge mechanism and adoption.
          items:
            - Above 93 percent success claim
            - Roughly 40 percent enamel-regeneration claim
          outputs:
            - Sales narrative anchored on company-curated outcome summaries
        - label: Consumer access layer
          summary: Public patient messaging turns clinician capability into demand generation.
          items:
            - Drill-free and needle-free patient framing
            - Clinic locator for nearby Certified Curodontists
          outputs:
            - Consumer pull that still depends on trained practice availability
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE007
      - CE008
