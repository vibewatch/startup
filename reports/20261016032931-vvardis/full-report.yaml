  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal evidence-backed scores place Curodont highest on early-lesion differentiation, but not on installed
      workflow familiarity.
    data:
      xAxis:
        label: Early-lesion clinical differentiation
        min: 1
        max: 5
        lowLabel: Surface-level / defer-to-status-quo
        highLabel: Lesion-depth restorative effect
        description: Ordinal 1-5 score derived from retained evidence.
      yAxis:
        label: Installed workflow and protocol embeddedness
        min: 1
        max: 5
        lowLabel: Niche / lightly evidenced
        highLabel: Already embedded in practice protocol
        description: Ordinal 1-5 score derived from retained evidence.
      points:
        - label: Curodont
          x: 5
          'y': 3
          detail: >-
            Drill-free lesion-depth narrative and same-appointment workflow, but commercial proof is still mostly
            company-controlled.
        - label: Fluoride varnish
          x: 2
          'y': 5
          detail: Incumbent preventive or caries-control workflow with repeat cadence and explicit regulatory framing.
        - label: SDF
          x: 3
          'y': 4
          detail: >-
            Minimally invasive arrest option with long market presence, affordability messaging, and iterative packaging
            upgrades.
        - label: Resin infiltration
          x: 4
          'y': 2
          detail: >-
            Similar lesion-stage intervention, but retained public evidence does not show broad adoption, price, or
            workflow scale.
        - label: Drill and fill
          x: 1
          'y': 5
          detail: Most embedded restorative pathway once cavitation occurs, but invasive and not early-lesion preserving.
        - label: Watch and wait / home fluoride
          x: 1
          'y': 4
          detail: >-
            Low-complexity status quo for very early lesions, but it delays treatment rather than replacing lost mineral
            structure.
    approximationNotes: >-
      Scores are ordinal analyst assignments from the retained source set rather than measured market-share or
      reimbursement data: x reflects clinical differentiation for early-lesion treatment, and y reflects how embedded
      the option already appears in practice protocols and public workflow evidence.
