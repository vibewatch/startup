              - CO015
              - CO016
      - number: '1.2'
        title: Leadership concentration, financing path, and control signals
        blocks:
          - type: paragraph
            body: >-
              The public record is unusually founder-centric. Across the official site, press releases, and independent
              reporting, the Abivardi sisters are not just the public face of the company but the visible operating and
              ownership center of gravity. That can be a strength for category evangelism, because the founders are
              practicing dentists and repeat dental entrepreneurs, but it also creates clear key-person dependence until
              the board, executive bench, and minority-protection terms are disclosed. On financing, the evidence is
              directionally strong even if it is not fully underwrite-ready: vVardis announced a $35 million OrbiMed
              round in February 2025, another $50 million from OrbiMed in July 2025, and then an April 2026 strategic
              minority investment from Apollo-managed funds that external coverage ties to a valuation above $1 billion.
              Independent reporting further indicates the founders still held majority control after the Apollo round,
              with Swissinfo citing a roughly 70% stake, but the actual security terms and governance rights remain
              undisclosed in the assigned public evidence.
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
