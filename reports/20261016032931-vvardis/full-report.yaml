  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is product-led, but public monetization remains opaque
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence supports a product-sales model rather than a services model. vVardis markets
              chairside Curodont products to dental professionals, adds prevention and sensitivity adjacencies, and also
              maintains at-home oral-care lines, which means the commercial surface spans both B2B2C professional
              channels and direct consumer sell-through. Workflow design is clearly optimized for chairside adoption:
              the U.S. professional site says trained clinicians can apply Curodont Repair Fluoride Plus in as little as
              three minutes in the same appointment, and third-party reporting identifies Henry Schein as the exclusive
              U.S. distributor. What the public package still does not show is equally important: none of the assigned
              sources disclose SKU pricing, realized ASPs, distributor take-rates, gross-to-net deductions, or contract
              duration, so investors can see the revenue pathway but not the monetization quality inside it.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
              - CI015
