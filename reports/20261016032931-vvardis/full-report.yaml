  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - direction
      - argument
      - evidence
      - what would change the view
    rows:
      - - thesis
        - Curodont is differentiated enough to support premium strategic interest.
        - >-
          Official product materials describe the platform as biomimetic and drill-free, and Apollo-backed coverage
          frames it as a new dental-care category.
        - Independent long-term outcomes or payer support that disproves differentiation would weaken this pillar.
      - - thesis
        - Commercial adoption appears real rather than purely conceptual.
        - >-
          Company-linked releases report >1 million treated teeth and >420,000 U.S. patients by July 2025, then ~3
          million treated teeth and nearly 20% practice penetration by April 2026.
        - >-
          Disclosed repeat-order, retention, and revenue-per-practice data that fails to scale with adoption would
          reduce conviction.
      - - thesis
        - Specialist capital has repeatedly funded commercialization.
        - >-
          OrbiMed funded $35 million in February 2025 and another $50 million in July 2025, and Apollo followed with a
          2026 minority investment at unicorn status.
        - >-
          Evidence that the new capital was primarily rescue financing, or that major investors received highly senior
          downside protection, would materially dilute the signal.
      - - anti-thesis
        - Headline valuation is better supported than the actual entry economics.
        - Apollo-related sources corroborate the >$1 billion mark but also say the transaction terms were not disclosed.
        - >-
          Disclosure of valuation mechanics, preference terms, and post-money ownership that still leaves ordinary
          equity with attractive return potential would improve the call.
      - - anti-thesis
        - Go-to-market concentration still runs through Henry Schein in the U.S.
        - >-
          Independent reporting identifies Henry Schein as the exclusive U.S. distributor for Curodont Repair Fluoride
          Plus.
        - >-
          Meaningful diversification across channels or direct evidence of durable economics inside the Henry Schein
          relationship would reduce this dependency risk.
      - - anti-thesis
        - Public-market valuation discipline has not yet been met with public operating disclosure.
        - >-
          Swissinfo/Bloomberg points to a possible IPO above the April 2026 mark, while Finviz shows listed dental-tech
          comparables trading on disclosed sales and EV/Sales ratios.
        - >-
          An S-1 or comparable audited disclosure showing premium growth and margins versus listed peers would make the
          premium easier to defend.
    notes: >-
      Each row isolates one investment argument and the specific disclosure or operating milestone that would strengthen
      or weaken it; adoption figures are company-reported unless an independent source explicitly states otherwise.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation or return logic
      - key risks
      - probability signal
    rows:
      - - bull
        - >-
          Adoption claims convert into disclosed revenue growth, gross margins are medtech-like rather than
          commodity-like, Henry Schein concentration eases, and IPO prep converts into a marketed process.
        - >-
          Supports value creation above the current >$1 billion mark because the company would then have both scarcity
          and auditable operating proof.
        - >-
          Premium multiple compresses if growth is channel-filled but economically thin, or if preference terms capture
          most upside.
        - >-
          Bull signal would be an S-1 or equivalent disclosure showing strong revenue conversion, healthy margins, and a
          clean capital stack.
      - - base
        - >-
          Commercial traction is real, but new disclosure only partly closes the underwriting gap and the IPO path
          remains possible rather than committed.
        - >-
          Supports holding valuation discipline around the current unicorn mark instead of chasing price, pending better
          economics.
        - >-
          Investors may still overpay for a differentiated story before profitability, reimbursement, or retention are
          demonstrated.
        - >-
          Base signal is incremental disclosure that validates demand but leaves key financial and term details
          unresolved.
      - - bear
        - >-
          Revenue conversion lags the adoption narrative, the IPO window slips, or Apollo terms prove senior enough to
          crowd common-equity returns.
        - >-
          Pushes fair value below the current unicorn mark because public-market discipline would dominate private
          scarcity.
        - >-
          Down-round risk, distribution concentration, and liquidation overhang combine if growth quality is weaker than
          the publicity suggests.
        - >-
          Bear signal would be delayed exit timing, disappointing disclosed economics, or term sheets showing heavy
          preference protection.
    notes: >-
      The ranges stay directional because assigned sources do not disclose audited revenue, margins, burn, or
      share-count information needed for a tighter bottoms-up valuation.
    claimRefs:
      - CV003
      - CV004
      - CV011
      - CV013
      - CV014
