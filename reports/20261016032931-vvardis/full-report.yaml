      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Dental practices are the economic buyer and delivery setting, while dentists and, where local scope rules
              permit, trained hygienists are users; patients or dental benefit plans are the ultimate payers. The
              product's reported three-minute, same-appointment workflow lowers integration friction and can convert a
              diagnosis that might otherwise be watched into an immediate service. Distribution is concentrated through
              Henry Schein, which was announced as the exclusive U.S. distributor across general dentistry,
              orthodontics, pediatrics, and other dental segments from January 2026. That channel can accelerate access,
              but it also creates dependence on distributor execution and leaves the economics of patient payment,
              practice margin, and repeat ordering undisclosed.
            claimRefs:
              - CM008
              - CM010
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM013
              - CM015
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by the prevalence of caries, movement toward minimally invasive care, and earlier
              diagnosis that creates a larger pool of lesions eligible for conservative treatment. Company-reported
              traction advanced from more than one million treated teeth and nearly 10% of U.S. offices in July 2025 to
              approximately three million teeth and nearly 20% of general practices in 2026. Those figures indicate
              commercial momentum but remain company-originated and do not disclose paid utilization, reorder cohorts,
              net pricing, or retention. Limited dental reimbursement and the cost of advanced treatment materials can
              slow early intervention, especially where patients self-pay. Valuation should therefore credit category
              creation and distribution reach while discounting broad-market arithmetic until independent utilization
              and unit economics establish the addressable revenue pool.
            claimRefs:
              - CM011
              - CM012
              - CM014
              - CM015
              - CM016
