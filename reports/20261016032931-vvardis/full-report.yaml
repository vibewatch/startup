        title: Exhibits
        blocks:
          - type: callout
            title: Reported adoption validates workflow interest
            body: >-
              Company-originated reporting places Curodont in nearly 20% of U.S. general dental practices and at
              approximately three million treated teeth in 2026, while the same-appointment application and national
              distributor reduce practical adoption friction.
            calloutType: strength
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: callout
            title: Broad category size is not company addressability
            body: >-
              The available USD 7.58 billion estimate includes later-stage restorative and endodontic care. Without
              eligible-lesion counts, realized pricing, reimbursement, reorder behavior, and geography-specific access,
              a precise vVARDIS SAM or SOM would be unsupported.
            calloutType: risk
            claimRefs:
