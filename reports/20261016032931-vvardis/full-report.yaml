              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
              - CP015
              - CP016
      - number: '3.2'
        title: Differentiation is clearest on mechanism and workflow, not transparent economics
        blocks:
          - type: paragraph
            body: >-
              Public differentiation is strongest where vVARDIS controls the narrative: mechanism and workflow. Official
              surfaces repeatedly claim lesion-depth hydroxyapatite regeneration, and they contrast that with the
              superficial remineralization of fluoride varnish. The U.S. professional site also emphasizes a
              same-appointment, as-little- as-three-minute workflow, while the Swiss professional product page publishes
              a visible list price of EUR 330 excluding VAT. That public price anchor is unusual in the retained set:
              the Duraphat and Advantage Arrest articles describe cadence, packaging, affordability, or
              cost-effectiveness, but do not disclose direct list prices. As a result, the feature matrix is more
              supportable than a fully economic one. The positioning map therefore treats Curodont as highest on
              clinical differentiation for early lesions, while incumbents such as fluoride varnish, SDF, and
              conventional fillings still score higher on installed workflow familiarity.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
