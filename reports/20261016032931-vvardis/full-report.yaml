  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape is category-based, not startup-only
        blocks:
          - type: paragraph
            body: >-
              The retained source set points to a category fight rather than a clean one-company-versus-one-company
              match. vVARDIS positions Curodont as the step between failed prevention and irreversible drilling:
              official product materials say it addresses early non-cavitated lesions without traditional filling
              materials, while the same FAQ still acknowledges the status quo of watchful waiting for very early lesions
              and conventional restoration once cavitation appears. That means the practical alternatives are not just
              direct peptide competitors. They also include fluoride varnish as an incumbent prevention/control
              workflow, silver diamine fluoride (SDF) as a minimally invasive arrest option, resin infiltration as a
              micro-invasive lesion-stage alternative, and the standard drill-and-fill pathway for progressed decay. The
              pool does not surface credible public evidence for a bespoke "internal build" threat; in this category,
              the more relevant substitute is continued use of existing practice protocols that already fit dentist
              workflow and reimbursement habits.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
