      - number: '4.2'
        title: Adoption is visible, and repeat-buying proxies are improving, but sales efficiency is still mostly hidden
        blocks:
          - type: paragraph
            body: >-
              Public traction is materially stronger than it was in the prior report cycle. A July 2025 company release
              said Curodont had already treated more than one million teeth, more than 420,000 U.S. patients, and
              reached nearly 10% of U.S. dental offices; by June 30, 2026, the filing summary and official surfaces
              pointed to more than 3.5 million teeth treated, sales into more than 20,000 U.S. general dental practices,
              and nearly 20% U.S. office penetration. The October 2026 filing summary adds two useful but still
              incomplete efficiency proxies: 8,461 recurring buying practices in Q2 2026 and DSO-heavy distributor mix
              of roughly 60% to 65%. Those datapoints suggest reorder behavior and institutional channel relevance, but
              they are still not substitutes for disclosed CAC, payback, sales-cycle length, churn, reorder cadence, or
              Henry Schein economics.
