      - number: '3.3'
        title: Channel leverage is real, but hard switching barriers remain unproven
        blocks:
          - type: paragraph
            body: >-
              The strongest non-clinical advantage visible in public evidence is distribution. Dental Tribune reports
              that Henry Schein is the exclusive U.S. distributor, and the founders cite traction through DSOs such as
              Heartland Dental, Aspen Dental, and PDS Health, plus UK group-practice relationships. That matters because
              practice adoption in dentistry often follows purchasing access, training, and reimbursement comfort as
              much as pure efficacy. Still, the moat looks commercial rather than structural. The retained sources do
              not disclose realized reimbursement by payer, reorder behavior, re-application rates, or contractual
              switching penalties, and the substitute set keeps evolving inside familiar workflows - Colgate pushes a
              licensed fluoride-varnish narrative, and Elevate is iterating SDF packaging rather than changing
              categories. vVARDIS therefore looks differentiated, but not insulated from buyer multi-homing or incumbent
              response.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiated mechanism, but public moat evidence is softer than the marketing story
            body: >-
              vVARDIS's public case is strongest on clinical mechanism and workflow simplicity. The retained source set
              does not show public realized pricing, reimbursement durability, or hard switching penalties, so practices
              can still multi-home across varnish, SDF, and conventional restoration protocols.
            calloutType: risk
            claimRefs:
