  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all dentistry and not even all caries treatment. Curodont is positioned for
              early-stage, non-cavitated lesions before a conventional restoration would normally be required; the
              immediate alternatives are fluoride-based prevention, watchful waiting, resin infiltration or other
              conservative interventions, and eventual filling if disease progresses. vVARDIS also sells adjacent
              prevention, sensitivity, and consumer oral care products, but those adjacencies should not be folded into
              the core therapeutic opportunity without separate demand evidence. Mordor Intelligence's broader category
              includes restoration, reconstruction, and endodontic products while excluding routine checkups, general
              anesthesia, toothpaste, and mouthwash. Its estimate is therefore a useful ceiling and market-context
              benchmark, not a direct vVARDIS TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The only retained independent market model sizes the global dental caries treatment market at USD 7.35
              billion in 2025, USD 7.58 billion in 2026, and USD 8.83 billion in 2031, implying a 3.12% CAGR over
              2026-2031. It also assigns 34.52% of 2025 revenue to North America, 54.55% to dental clinics, and 38.12%
              to restoration products. These shares identify relevant commercial layers but cannot be multiplied into a
              reliable vVARDIS SAM: they use different segment dimensions, and Curodont targets only eligible early
              lesions within a category that also includes later-stage procedures. A defensible SOM additionally needs
              treated-lesion incidence, practice-level price and reorder data, reimbursement, and achievable penetration
              by geography.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
