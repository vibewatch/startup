      - number: '4.3'
        title: Gross margin looks promising, but capital adequacy still cannot be underwritten
        blocks:
          - type: paragraph
            body: >-
              The best new underwriting signal is that vVardis appears gross-margin rich at current scale. The October
              2026 filing summary reports $28.6 million of H1 2026 revenue, $24.7 million of gross profit, and an 86.4%
              gross margin, which is more consistent with premium product economics than with a labor-intensive
              care-delivery model. That positive signal is offset by ongoing losses and reliance on external capital.
              The same summary reports a $(17.6) million operating loss and a $(27.8) million net loss for H1 2026;
              disclosed 2025 OrbiMed financing totaled $85 million, Apollo's April 2026 minority investment valued the
              business above $1 billion without disclosing terms, and both the filing summary and Swissinfo/Bloomberg
              frame new capital as fuel for working capital, expansion, R&D, and marketing. Without current cash, burn,
              runway, or security-level financing terms, capital adequacy remains the chapter's primary blocker.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Gross profit is now publicly visible
            body: >-
              If the filing summary is directionally accurate, vVardis has already demonstrated a very high gross-margin
              product profile, which is the clearest improvement versus the prior report cycle.
            calloutType: strength
            claimRefs:
              - CI008
              - CI009
          - type: callout
            title: Capital intensity is still under-disclosed
            body: >-
              The company is still loss-making, still raising external capital, and still not publicly disclosing cash,
              burn, runway, distributor economics, or Apollo instrument terms.
