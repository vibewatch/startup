chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product platform, and what is actually verified
        blocks:
          - type: paragraph
            body: >-
              The assigned refresh evidence consistently supports the high-level company identity even where deeper
              corporate chronology remains incomplete. Official and independent sources describe vVardis as a Swiss
              dental medtech or oral-health company headquartered in Zug, led by dentist sisters Haley and Goly
              Abivardi. Public product surfaces are also consistent on the core proposition: Curodont is presented as a
              drill-free, peptide-based, biomimetic treatment for early-stage tooth decay that works with saliva
              minerals to regenerate enamel. What is not equally well supported is the incorporation timeline.
              Third-party profiles in the assigned pool do not reconcile cleanly with the company-controlled narrative,
              and the official pages reviewed here foreground founder biographies and product claims rather than a dated
              corporate history. That means later chapters can safely reuse the company identity, founders, location,
              and product framing, but should treat a precise founding date as an open diligence item rather than as
              settled ground truth.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
