slug: "vvardis"
runDate: "2026-10-16"
company:
  name: "vVARDIS"
chapter:
  number: 4
  title: "Financials"
  summary: "vVardis now has public evidence of real revenue scale and unusually strong gross margin for a dental product company, but not yet enough disclosure to underwrite revenue quality or capital adequacy. The October 2026 filing summary reports $28.6 million of H1 2026 revenue and an 86.4% gross margin, yet public assigned sources still do not disclose realized pricing, CAC/payback, cash on hand, burn, runway, or the detailed terms of Apollo's capital."
sections:
  - id: revenue-architecture
    title: "Revenue architecture is product-led, but public monetization remains opaque"
    body: "The assigned public evidence supports a product-sales model rather than a services model. vVardis markets chairside Curodont products to dental professionals, adds prevention and sensitivity adjacencies, and also maintains at-home oral-care lines, which means the commercial surface spans both B2B2C professional channels and direct consumer sell-through. Workflow design is clearly optimized for chairside adoption: the U.S. professional site says trained clinicians can apply Curodont Repair Fluoride Plus in as little as three minutes in the same appointment, and third-party reporting identifies Henry Schein as the exclusive U.S. distributor. What the public package still does not show is equally important: none of the assigned sources disclose SKU pricing, realized ASPs, distributor take-rates, gross-to-net deductions, or contract duration, so investors can see the revenue pathway but not the monetization quality inside it."
    claimRefs: ["CI001", "CI002", "CI003", "CI014", "CI015"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: demand-signals
    title: "Adoption is visible, and repeat-buying proxies are improving, but sales efficiency is still mostly hidden"
    body: "Public traction is materially stronger than it was in the prior report cycle. A July 2025 company release said Curodont had already treated more than one million teeth, more than 420,000 U.S. patients, and reached nearly 10% of U.S. dental offices; by June 30, 2026, the filing summary and official surfaces pointed to more than 3.5 million teeth treated, sales into more than 20,000 U.S. general dental practices, and nearly 20% U.S. office penetration. The October 2026 filing summary adds two useful but still incomplete efficiency proxies: 8,461 recurring buying practices in Q2 2026 and DSO-heavy distributor mix of roughly 60% to 65%. Those datapoints suggest reorder behavior and institutional channel relevance, but they are still not substitutes for disclosed CAC, payback, sales-cycle length, churn, reorder cadence, or Henry Schein economics."
    claimRefs: ["CI004", "CI005", "CI006", "CI007", "CI014"]
    tableRefs: ["TI003"]
  - id: margin-and-capital
    title: "Gross margin looks promising, but capital adequacy still cannot be underwritten"
    body: "The best new underwriting signal is that vVardis appears gross-margin rich at current scale. The October 2026 filing summary reports $28.6 million of H1 2026 revenue, $24.7 million of gross profit, and an 86.4% gross margin, which is more consistent with premium product economics than with a labor-intensive care-delivery model. That positive signal is offset by ongoing losses and reliance on external capital. The same summary reports a $(17.6) million operating loss and a $(27.8) million net loss for H1 2026; disclosed 2025 OrbiMed financing totaled $85 million, Apollo's April 2026 minority investment valued the business above $1 billion without disclosing terms, and both the filing summary and Swissinfo/Bloomberg frame new capital as fuel for working capital, expansion, R&D, and marketing. Without current cash, burn, runway, or security-level financing terms, capital adequacy remains the chapter's primary blocker."
    claimRefs: ["CI008", "CI009", "CI010", "CI011", "CI012", "CI013", "CI016"]
callouts:
  - calloutType: "strength"
    title: "Gross profit is now publicly visible"
    body: "If the filing summary is directionally accurate, vVardis has already demonstrated a very high gross-margin product profile, which is the clearest improvement versus the prior report cycle."
    claimRefs: ["CI008", "CI009"]
  - calloutType: "risk"
    title: "Capital intensity is still under-disclosed"
    body: "The company is still loss-making, still raising external capital, and still not publicly disclosing cash, burn, runway, distributor economics, or Apollo instrument terms."
    claimRefs: ["CI010", "CI012", "CI014", "CI016"]
  - calloutType: "recommendation"
    title: "Diligence should focus on realized economics, not top-line momentum"
    body: "The next diligence package needs invoice-level pricing, reorder cohorts, Henry Schein economics, monthly cash bridge, and financing terms before the current private-market or IPO narrative can be underwritten."
    claimRefs: ["CI006", "CI007", "CI014", "CI016"]
