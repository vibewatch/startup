      - ["H1 2026 gross margin", "86.4% ($24.7m gross profit)", "Medium", "Suggests attractive product economics if the filing summary is reliable and repeatable", "Request audited COGS bridge by SKU, channel, and geography"]
      - ["H1 2026 operating loss", "$(17.6)m", "Medium", "Shows SG&A and growth spend still exceed current gross profit", "Request monthly opex bridge, headcount plan, and fixed vs variable cost split"]
      - ["H1 2026 net loss", "$(27.8)m", "Medium", "Adds bottom-line evidence that external capital still matters", "Request financing-cost, tax, and non-operating item detail"]
      - ["Q2 2026 recurring buying practices", "8,461", "Medium", "Best public reorder proxy in the assigned pool", "Request cohort retention, reorder frequency, and active-practice definition"]
      - ["Distributor sales mix to DSOs", "~65% (2024); ~60% (2025 and H1 2026)", "Medium", "Shows channel concentration and institutional relevance", "Request DSO account concentration, gross margin by channel, and renewal dynamics"]
      - ["Cash / burn / runway", null, "Low", "Core capital-adequacy inputs remain unavailable in public assigned sources", "Request treasury report, budget, debt schedule, and runway case"]
    notes: "Public figures mix company-claimed operating metrics and a third-party filing summary. Null means the assigned public pool does not disclose a defendable value."
