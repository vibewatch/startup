  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "pricing"
      missingEvidence: "Realized selling price, average order size, gross-to-net deductions, distributor take-rates, and reimbursement support by SKU and channel."
      whyItMatters: "Without realized price data, revenue quality and gross-margin durability cannot be separated from headline growth."
      diligencePath: "Request Henry Schein economics, invoice samples, price lists, rebate schedules, and payer/reimbursement support materials."
    - type: "private-evidence-only"
      severity: "material"
      topic: "sales-efficiency"
      missingEvidence: "CAC, payback, sales-cycle length, active-account definitions, reorder cadence, and cohort retention beyond the recurring-buying headline."
      whyItMatters: "Repeat-buying practices alone do not show whether distributor-led acquisition is efficient or durable."
      diligencePath: "Request cohort dashboards, sales funnel conversion data, and channel-level contribution margin analysis."
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "liquidity"
      missingEvidence: "Current cash balance, monthly burn, runway, Apollo security terms, debt obligations, and a post-F-1 financing plan."
      whyItMatters: "Capital adequacy cannot be underwritten while the company is still loss-making and still raising external capital."
      diligencePath: "Request treasury reports, board budget, cap table, financing agreements, and base/upside/downside runway cases."
    - type: "missing-source"
      severity: "material"
      topic: "cost-structure"
      missingEvidence: "SKU-level COGS, manufacturing and service-delivery cost breakdown, working-capital turns, and capex requirements."
      whyItMatters: "The gross-margin signal is promising, but there is not enough disclosure to judge whether margin holds through broader scale-up."
      diligencePath: "Request audited gross margin bridge, inventory schedule, supplier concentration data, and capex plan by geography."
