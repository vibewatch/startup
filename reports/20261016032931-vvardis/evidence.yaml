evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-chronology
    missingEvidence: A dated incorporation record or company-verified founding chronology that reconciles public profiles.
    whyItMatters: The founding timeline changes how investors interpret maturity, product gestation, and execution speed.
    diligencePath: Obtain a Swiss commercial-registry extract or company legal profile and reconcile it against investor databases.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: disclosure-gap
    missingEvidence: Audited FY2024-FY2025 revenue, gross margin, operating burn, cash balance, active-account count, and headcount.
    whyItMatters: >-
      These are the core inputs needed to test whether unicorn valuation signaling is supported by operating
      performance.
    diligencePath: Request the board pack, lender or investor materials, or an IPO draft registration statement if one exists.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, Apollo and OrbiMed security terms, voting rights, and liquidation preferences.
    whyItMatters: Governance and preference-stack terms affect founder control, downside protection, and ultimate exit economics.
    diligencePath: >-
      Review shareholder agreements, term sheets, board observer rights, and any cap-table summary prepared for
      investors.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Eligible early-lesion incidence by geography, realized treatment price, practice reorder frequency, distributor
      sell-through, and achievable penetration are not disclosed.
    whyItMatters: >-
      These inputs are required to convert the broad caries-treatment category into a defensible company-specific SAM
      and SOM.
    diligencePath: >-
      Request Henry Schein sell-through data and vVARDIS practice cohorts by geography, then reconcile treated lesions,
      price, repeat ordering, and active-practice penetration.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: reimbursement
    missingEvidence: >-
      Current payer coverage, procedure coding, denial rates, patient out-of-pocket price, and practice gross margin for
      Curodont are not established by the assigned evidence.
    whyItMatters: >-
      Payment friction can materially reduce conversion from diagnosed eligible lesions to paid treatment and therefore
      change adoption timing and market size.
    diligencePath: >-
      Obtain payer policies and remittance samples from representative U.S. practices, segmented by commercial
      insurance, Medicaid, and self-pay cases.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
