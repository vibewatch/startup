companyProfile:
  summary: >-
    vVARDIS is a Swiss dental medtech company built around Curodont, a drill-free biomimetic treatment for early caries
    that is sold through professional dental channels and supported by adjacent consumer oral-care products. The
    business has visible U.S. adoption, a Henry Schein-led distribution footprint, and public signals of strong gross
    margin, but it still does not fully disclose realized pricing, cash runway, or Apollo deal terms.
