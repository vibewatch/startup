  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job / lesion context
      - Current workflow
      - vVARDIS solution
      - Measurable benefit cited
      - Limitation
    rows:
      - ["Early non-cavitated caries", "Monitor progression or move to restorative drilling if the lesion advances", "Curodont Repair chairside treatment after preparation and application protocol", "Onboarding cites +93% clinical success rate", "Not indicated for cavitated lesions"]
      - ["Interproximal lesions", "Diagnosis plus technique-sensitive access to a hard-to-reach surface", "Surface-specific interproximal application protocol", "Trade tutorial says the full professional process is completed within 8-10 minutes", "Requires precise operator execution and preparation steps"]
      - ["Orthodontic / pediatric white-spot risk", "Preventive monitoring, hygiene reinforcement, or delayed treatment", "Non-invasive early-intervention use case highlighted in onboarding", "No drilling, no anaesthesia, and positive patient-experience claims", "Need independent pediatric outcomes and reimbursement evidence"]
      - ["Practice adoption / staff utilization", "New procedures compete for chair time and training capacity", "Certified Curodontist onboarding and e-learning support", "Company materials say the treatment is easy to integrate and can be applied by dentist, therapist, or hygienist", "No retained public data on certification completion, retention, or productivity lift"]
    notes: >-
      Benefits combine company-claimed clinical and commercial messages with one trade
      tutorial; current public evidence does not provide payer economics or audited workflow
      productivity outcomes.
    claimRefs: [CE003, CE004, CE006, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Key dependency
      - Primary risk
    rows:
      - ["Diagnostic gating", "Identify early, non-cavitated lesions and exclude cavitated or look-alike defects", "Practitioner training and diagnostic workflow", "Misclassification would undermine efficacy and satisfaction"]
      - ["Surface preparation", "Prepare the site through pellicle removal, etch, rinse/dry, and isolation", "Chairside protocol discipline and consumables", "Commercial time claims may understate real workflow complexity"]
      - ["Peptide regeneration engine", "Diffuse P11-4 into lesion depth and recruit saliva minerals to form hydroxyapatite", "Appropriate lesion selection and patient mineral environment", "Public evidence lacks raw durability cohorts and side-by-side operating data"]
      - ["Practice enablement", "Translate science into repeatable use through e-learning and certification", "Training throughput and clinician engagement", "Adoption may stall if education capacity lags demand"]
      - ["Channel scale-up", "Push product into practices through distributor and field support", "Henry Schein execution plus internal commercial readiness", "Public evidence does not disclose contract terms or service-level responsibilities"]
    notes: >-
      This architecture mixes biological mechanism with operating dependencies because the
      retained evidence shows the product's repeatability depends on both.
    claimRefs: [CE003, CE005, CE006, CE007, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Clinical indication, chairside protocol, peptide mechanism, and channel enablement stack together to create the product system.
    data:
      layers:
        - label: Clinical indication and diagnosis
          summary: Early-lesion selection is the first control point.
          items:
            - Interproximal, occlusal, and smooth-surface lesions
            - Adult, pediatric, and orthodontic use cases
          outputs:
            - Eligible early, non-cavitated lesion selected before treatment
        - label: Chairside preparation and application
          summary: Deployment is a protocol, not a simple retail-use step.
          items:
            - Pellicle removal, etch, rinse/dry, and isolation
            - Surface-specific Curodont Repair placement
          modules:
            - Less than 5-minute application claim alongside an 8-10 minute full professional process tutorial
          outputs:
            - Non-invasive same-visit treatment option for qualified lesions
        - label: Peptide regeneration mechanism
          summary: P11-4 scaffolds enamel repair inside the lesion.
          items:
            - Diffusion into lesion depth
            - Self-assembly into biomatrix
            - Calcium and phosphate recruitment from saliva
          outputs:
            - Hydroxyapatite regeneration and arrest/regression claims
        - label: Commercial enablement and scale
          summary: Training and channel execution sit on top of the science.
          items:
            - Certified Curodontist e-learning path
            - Henry Schein exclusive U.S. distribution
            - Patient-facing clinic locator and practitioner messaging
          outputs:
            - Fast rollout with dependency on field education and distributor execution
        - label: Clinical evidence layer
          summary: Study-backed marketing claims bridge mechanism and adoption.
          items:
            - Above 93 percent success claim
            - Roughly 40 percent enamel-regeneration claim
          outputs:
            - Sales narrative anchored on company-curated outcome summaries
        - label: Consumer access layer
          summary: Public patient messaging turns clinician capability into demand generation.
          items:
            - Drill-free and needle-free patient framing
            - Clinic locator for nearby Certified Curodontists
          outputs:
            - Consumer pull that still depends on trained practice availability
    claimRefs: [CE003, CE005, CE006, CE007, CE008]
callouts:
  - calloutType: insight
    title: Protocol plus science is the real product
    body: >-
      vVARDIS is selling more than a peptide consumable: the defensible package is lesion
      selection, chairside workflow, practitioner education, and a differentiated
      non-invasive clinical message.
    claimRefs: [CE003, CE005, CE006]
  - calloutType: risk
    title: Commercial traction is visible before full technical transparency
    body: >-
      The product looks commercially real, but diligence still needs contract, regulatory,
      IP, and systems-operability evidence that is not visible in the retained public pool.
    claimRefs: [CE007, CE008, CE010, CE012]
