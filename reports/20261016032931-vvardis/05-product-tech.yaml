artifact: product-tech
slug: vvardis
runDate: 2026-10-16
company:
  name: vVARDIS
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    vVARDIS has built a real product category around Curodont rather than a single SKU:
    a peptide-based, non-invasive caries treatment supported by adjacent professional and
    home-care products, clinician training, and distributor-led rollout. The retained
    evidence supports commercial maturity and a specific biological mechanism, but it does
    not provide equivalent transparency on IP durability, regulatory files, raw outcome
    datasets, or software/operational controls.
sections:
  - id: product-definition
    title: Product surface and category definition
    body: >-
      The product surface is broader than one restorative claim. vVARDIS positions
      Curodont Repair as its flagship professional therapy for early, non-cavitated caries,
      then extends the same peptide-led enamel story into Protect, D'Senz, enamel-serum,
      and whitening/home-care products. That makes the company look more like a clinical
      platform with a lead therapy and adjacencies than a single consumable. Public
      differentiation also centers on what the therapy avoids: drilling, needles, staining,
      and artificial filling materials, with the tradeoff that most proof in the retained
      evidence remains company-curated rather than independently disclosed at raw-study or
      audited commercial-data level.
    claimRefs: [CE001, CE002, CE009, CE013]
    tableRefs: [TE001]
  - id: mechanism-and-workflow
    title: How the therapy works in practice
    body: >-
      The retained official and trade evidence makes the mechanism specific enough to
      underwrite the product concept. vVARDIS says the P11-4 peptide diffuses into an early
      lesion, self-assembles into a biomatrix, and recruits calcium and phosphate ions from
      saliva to form new hydroxyapatite. Just as important, the workflow is clearly not a
      passive topical rinse: onboarding and application materials require lesion selection,
      preparation, etching, rinse/dry steps, isolation, and surface-specific application.
      In other words, the moat is partly molecular science and partly protocol discipline,
      which is why training and correct indication boundaries matter as much as the core
      formulation.
    claimRefs: [CE003, CE004, CE005, CE011, CE013]
    tableRefs: [TE002, TE003]
    figureRefs: [FE001]
  - id: commercialization-and-dependencies
    title: Enablement, channel, and scale dependencies
    body: >-
      Product maturity is strongest at the commercialization layer. vVARDIS has built a
      Certified Curodontist program and e-learning path to help practices adopt the therapy,
      and independent reporting ties U.S. scale-up to Henry Schein's exclusive distribution
      role. Company-backed coverage also shows a meaningful adoption ramp, with U.S.
      penetration moving from nearly 10% of dental offices and more than 1 million treated
      teeth in mid-2025 to nearly 20% of general dental practices and about 3 million
      treated teeth by spring 2026. That is credible momentum, but it also means channel
      execution, field education, and supply readiness sit outside the molecule itself.
    claimRefs: [CE006, CE007, CE008, CE012]
    calloutRefs: []
  - id: trust-controls-and-gaps
    title: Public controls are visible; technical transparency is not
    body: >-
      The public trust-and-quality picture is mixed. On the positive side, official
      materials do draw clear indication boundaries, explain what lesion types are out of
      scope, and anchor practice use in training and study summaries instead of pure
      lifestyle marketing. On the other hand, the retained source set does not surface
      public regulatory-clearance files, incident/status reporting, or a meaningful software
      developer surface. The only developer-signal evidence in the pool is a GitHub search
      page with zero public repository matches. That does not prove weak internal systems,
      but it does mean product, compliance, and operational diligence will have to rely on
      management materials rather than public technical evidence.
    claimRefs: [CE004, CE010, CE011, CE012]
