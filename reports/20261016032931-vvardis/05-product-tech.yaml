  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-quality-controls
      missingEvidence: Public regulatory-clearance or registration files, quality-system certifications, recall history, and incident/status reporting for Curodont products by market.
      whyItMatters: The public story is clinically specific, but diligence still lacks the assurance framework behind scaled deployment.
      diligencePath: Request device classification, approval/registration packets, complaint and recall history, and quality-management certifications for each active geography.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: channel-dependency
      missingEvidence: Henry Schein agreement terms covering exclusivity scope, duration, service obligations, commercial support, and termination rights.
      whyItMatters: Exclusive distribution concentrates go-to-market risk and affects rollout durability, field enablement, and negotiating leverage.
      diligencePath: Obtain the current Henry Schein contract or a management summary with renewal mechanics, performance covenants, and support responsibilities.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: ip-moat
      missingEvidence: Current patent family list, expiry dates, jurisdiction coverage, and any supplementary protection strategy for the core P11-4 technology.
      whyItMatters: Differentiation claims rely heavily on proprietary peptide science, but public evidence does not quantify moat duration or coverage.
