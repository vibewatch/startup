            body: >-
              保留的官方和行业证据已将机制讲得足够具体，可以据此判断产品概念。vVARDIS 称，P11-4 肽会扩散进入早期病灶，
              自组装成生物基质，并从唾液中吸引钙离子和磷酸根离子，形成新的羟基磷灰石。同样重要的是，这套工作流显然 不是被动的局部漱洗：入门和应用材料要求选择病灶、进行准备和酸蚀，完成冲洗/干燥步骤，隔离病灶，并针对
