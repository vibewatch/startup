chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、产品平台与已实际验证的内容
        blocks:
          - type: paragraph
            body: >-
              即使公司更深层的时间线仍不完整，本次指定的更新证据仍持续支持其基本公司身份。官方和独立来源都将 vVardis 描述为一家总部位于 Zug 的瑞士牙科医疗科技或口腔健康公司，由牙医姐妹 Haley 和 Goly
              Abivardi 领导。 公开产品页面对核心主张的表述也基本一致：Curodont 是一种无需钻牙、以肽为基础的仿生治疗，用于治疗早期蛀牙，
              借助唾液中的矿物质再生牙釉质。相较之下，公司注册时间线的证据并不充分。指定来源中的第三方资料与公司 自有叙事无法完全对齐，而本次审阅的官方页面重点呈现创始人简介和产品主张，没有给出有日期的公司历史。
              因此，后续章节可以放心沿用公司身份、创始人、所在地和产品定位，但应把精确的成立日期视为待尽调事项， 而不是已经确定的事实。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
