            body: >-
              公开证据支持 vVardis 正处于真实的商业拐点，但还没有消除后期私有公司或 IPO 前估值中最关键的投资判断风险。
              近期最强的风险是报销：采用增长很快，但公开来源仍描述覆盖不一致、按服务收费的行为持续存在；如果患者自费意愿 走弱，势头就可能放缓。第二层风险是市场进入集中度：Henry Schein 被描述为美国独家分销商，而
              Apollo 支持的 扩张和已报道的 IPO 准备意味着，渠道执行和资本市场窗口都关系到规模能否持续。第三层风险是证据持久性：
              产品仅适用于早期、未形成龋洞的病灶，公开证据包仍把同行评审研究与公司筛选整理的材料、较短的随访期限混在一起。
