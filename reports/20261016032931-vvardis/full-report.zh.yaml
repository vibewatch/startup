      - number: '3.3'
        title: 渠道杠杆真实存在，但较高的切换壁垒尚未得到验证
        blocks:
          - type: paragraph
            body: >-
              公开证据中最强的非临床优势是分销。Dental Tribune 报道称，Henry Schein 是美国独家分销商；创始人还提到， 公司通过 Heartland Dental、Aspen Dental、PDS
              Health 等 DSO 以及英国集团诊所关系取得了进展。这一点很重要， 因为牙科诊所的采用往往同样取决于采购渠道、培训和报销便利度，而不只是疗效。不过，这条护城河看起来是
              商业性的，而非结构性的。保留的来源没有披露按支付方划分的实际报销、复购行为、再次应用率或合同切换罚则； 替代方案也在熟悉的工作流内持续演进——Colgate 推出获许可的含氟涂层叙事，Elevate 则迭代
              SDF 包装，而不是 改变品类。因此，vVARDIS 看起来具有差异化，但还没有免受买方多重采购或现有方案反击的保护。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: 展示项
        blocks:
