      - number: '1.2'
        title: 管理层集中、融资路径与控制权信号
        blocks:
          - type: paragraph
            body: >-
              公开记录明显以创始人为中心。在官网、新闻稿和独立报道中，Abivardi 姐妹不仅是公司的公开形象，也是可见的
              运营和所有权重心。由于两位创始人都是执业牙医和连续创业者，这有利于推动品类教育；但在董事会、管理层梯队 和少数股东保护条款披露之前，公司也明显依赖关键人物。融资证据的方向性很强，虽然还不足以直接完成投资判断：
              vVardis 宣布于 2025 年 2 月完成 OrbiMed 的 $35 million 轮融资，并于 2025 年 7 月再次获得 OrbiMed 的 $50 million 融资；随后，Apollo
              管理基金于 2026 年 4 月进行战略性少数股权投资，外部报道将其与超过 $1 billion 的估值联系起来。独立报道还显示，Apollo 轮融资后创始人仍掌握多数控制权，Swissinfo 称持股比例约为
              70%；但实际证券条款和治理权利仍未在指定公开证据中披露。
