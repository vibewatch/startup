        blocks:
          - type: paragraph
            body: >-
              vVARDIS 周围的买方和用户并不相同。公司主要通过专门的专业网站向牙科专业人士推广 Curodont，同时运营一个面向
              患者的网站和诊所定位器，把需求导向认证诊所，而不是在线直售。这说明其市场进入路径围绕诊所采用、临床人员 的工作流整合和患者需求生成展开，以支持合作伙伴及诊所的接诊量。


              渠道覆盖在扩大，但集中度也在上升。Henry Schein 于 2026 年 1 月扩大的协议从 DSO 独家分销，转为覆盖普通 牙科、正畸和儿科牙科的美国独家分销，使 vVARDIS
              能立即触达主要诊所细分市场。同一结构也意味着美国扩张越来越 依赖一个合作伙伴；这有利于规模增长，但如果终端销售、促销力度或合同条款转弱，依赖风险就会上升。
