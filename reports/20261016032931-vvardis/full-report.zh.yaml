      - number: '7.4'
        title: 资本市场风险、缓释措施与终止标准
        blocks:
          - type: paragraph
            body: >-
              判断 vVardis 的投资价值，关键是把已经证明的商业进展与决定下行保护的私有信息分开。公开报道支持 Apollo 的战略性少数股权投资、超过 $1 billion 的估值，以及由一线顾问参与的 IPO
              准备，但指定来源均未披露 Apollo 的支票金额、证券条款、优先股堆叠、烧钱速度、毛利率或现金跑道。公司可能确实在扩大规模，却仍会在支付方转化落后、独家分销条款脆弱，或 IPO
              准备无法转化为公开市场需求时突然重估。最清晰的终止标准是可量化的：诊所渗透停滞、支付方不采用、失去美国独家分销支持，或融资延迟且披露质量没有同步改善。
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR009
              - CR010
              - CR012
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 报销仍是最明确的单点下行风险
            body: 如果诊所继续依赖患者自费，采用数据看起来强劲也可能很脆弱；公开来源反复显示的是覆盖不一致，而不是已被证明的 保险支付飞轮。
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR013
          - type: callout
            title: 核心产品风险在于范围纪律，而非品类本身不成立
            body: 来源支持真实的临床差异化，但也把可投资的使用场景严格限定在早期、未形成龋洞的病灶；其证明周期比简单的修复 手术更慢。
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
          - type: callout
            title: 接受公开市场式倍数之前，先使用可量化的终止标准
            body: 在没有诊所渗透率进展、支付方转化、分销商条款清晰度，以及超越估值标题和铺开主张的融资披露之前， 不要按独角兽估值标记作投资判断。
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              目前有证据支持的结论仍是继续研究，而不是按当前私有市场标记价直接买入。公开来源印证，Apollo 于 2026 年 4 月的少数股权投资将 vVARDIS 估值推至 $1 billion
              以上，创始人仍拥有相当大的多数所有权；2025 年 OrbiMed 的融资则表明，在 Apollo 进入之前，专业医疗资本已经愿意为其扩张提供资金。同样重要的是，这些证据没有披露 Apollo
              交易的经济性，指定估值证据也仍未提供经审计的收入、毛利率、烧钱速度或优先股堆叠细节。真实势头与 有限运营披露并存，因此应采取对价格敏感、以尽调为门槛的姿态，而不是坚定买入。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV012
              - CV014
