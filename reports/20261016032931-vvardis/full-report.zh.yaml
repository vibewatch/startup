      - number: '3.2'
        title: 差异化最清晰地体现在机制和工作流，而非透明的经济性
        blocks:
          - type: paragraph
            body: >-
              在 vVARDIS 能掌控叙事的地方，公开差异化最强：机制和工作流。官方页面反复声称可以在病灶深度再生羟基磷灰石， 并将其与含氟涂层的表层再矿化作对比。美国专业网站还强调同次就诊、最快 3
              分钟的工作流；瑞士专业产品页面 则公开了不含增值税的 EUR 330 标价。这个公开价格锚点在保留的来源中很少见：Duraphat 和 Advantage Arrest
              的文章描述了使用频率、包装、可负担性或成本效益，却没有披露直接标价。因此，功能矩阵比完整的经济性比较 更有证据支撑。定位图据此将 Curodont 在早期病灶的临床差异化上置于最高位置，而含氟涂层、SDF
              和传统补牙等 现有方案在既有工作流熟悉度上仍得分更高。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP008
