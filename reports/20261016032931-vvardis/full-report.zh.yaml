        title: 产品覆盖面与品类定义
        blocks:
          - type: paragraph
            body: >-
              产品覆盖面不止一项修复治疗主张。vVARDIS 将 Curodont Repair 定位为用于早期、未形成龋洞龋齿的旗舰专业疗法， 又把同一套以肽为核心的牙釉质叙事延伸到
              Protect、D'Senz、牙釉质精华液和美白 / 居家护理产品。这让公司更像一个拥有主力疗法和相邻产品的临床平台，而不是单一耗材。公开差异化也体现在这项疗法避开的环节：钻牙、针刺、
              染色和人工填充材料；代价是，保留证据中的大部分支持材料仍由公司筛选整理，尚未以原始研究或经审计商业数据的 形式独立披露。
