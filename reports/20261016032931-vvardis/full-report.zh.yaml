          - type: paragraph
            body: >-
              运营模式看起来可以扩展，但前提是培训、工作流适配和渠道关系能够持续。美国官方材料将 Curodont 作为同次就诊
              治疗进行推广，受过培训的临床人员（包括牙科保健师）都可以应用，这确实能缓解椅旁时间摩擦。即便如此，同一 材料也意味着流程依赖：治疗结果仍要求正确选择病例、掌握应用技术，并在数月内维持患者口腔卫生。更大的剩余
              敞口是商业集中度。Dental Tribune 将 Henry Schein 描述为美国独家分销商，公开来源则把 Apollo 资本定位为
              继续在美国和欧洲铺开的燃料；因此，在报销和公开披露成熟之前，渠道支持或融资节奏的任何中断都可能拖慢采用。
            claimRefs:
              - CR004
              - CR009
