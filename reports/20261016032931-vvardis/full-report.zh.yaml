  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场既不是整个牙科市场，也不是全部龋齿治疗市场。Curodont 面向早期、未形成龋洞的病灶，即通常还不需要
              传统修复的阶段；眼下的替代方案包括含氟预防、观察等待、树脂渗透或其他保守干预，以及病情进展后的补牙。 vVARDIS 还销售预防、敏感护理和消费者口腔护理等相邻产品，但没有独立需求证据，就不应把这些相邻市场并入
              核心治疗机会。Mordor Intelligence 的更宽泛品类包含修复、重建和牙髓产品，但排除了常规检查、全身麻醉、 牙膏和漱口水。因此，其估算可以作为有用的上限和市场背景基准，但不能直接视为 vVARDIS
              的 TAM。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 受证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              唯一保留下来的独立市场模型估算，全球龋齿治疗市场规模为 2025 年 USD 7.35 billion、2026 年 USD 7.58 billion、 2031 年 USD 8.83 billion，意味着
              2026-2031 年 CAGR 为 3.12%。该模型还将 2025 年收入的 34.52% 归于北美、 54.55% 归于牙科诊所、38.12% 归于修复产品。这些份额能标出相关商业层次，却不能相乘得出可靠的
              vVARDIS SAM： 它们采用了不同的细分维度，而 Curodont 只针对一个还包含晚期治疗的品类中符合条件的早期病灶。要测算站得住脚的
              SOM，还需要治疗病灶发生率、诊所层面的价格和复购数据、报销情况，以及按地区划分的可实现渗透率。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
