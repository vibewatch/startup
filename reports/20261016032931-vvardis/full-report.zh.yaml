      - number: '8.2'
        title: 上行情景与制衡因素
        blocks:
          - type: paragraph
            body: >-
              上行情景并非凭空想象。官方和独立来源都持续将 Curodont 描述为具有差异化的无钻仿生治疗品类；公司报告的商业指标也从 2025 年 7 月在美国治疗超过一百万颗牙齿、覆盖超过 420,000 名患者，提升到
              2026 年 4 月约三百万颗牙齿、接近 20% 的普通牙科诊所。这些采用主张，加上通过 Henry Schein 进行的美国独家分销，以及 OrbiMed 和 Apollo 的支持，足以构成 vVARDIS
              已建立战略价值的可信论据。制衡因素在于，大部分规模证据仍来自公司或由公司提供，商业化故事也集中在单一美国渠道合作伙伴。这个逻辑成立，但在单位经济性 得到更充分披露之前，还不够稳健，无法支持溢价买入。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 情景、退出路径与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Swissinfo 转述的 Bloomberg 报道称，vVardis 正在与 JPMorgan 和 Goldman Sachs 积极筹备可能的美国 IPO， 可能瞄准高于 2026 年 4
              月独角兽估值标记的估值；但同一报道也表示尚未作出最终决定，时间安排仍可能变化。 这构成一条现实的退出路径，同时也提高了披露门槛，因为公开市场投资者可以将公司与收入和交易倍数完全可见的
              上市医疗科技公司比较。乐观情景下，披露的运营指标将今天的采用故事转化为高增长经济性，并保留高于当前标记 价的上行空间。基准情景下，新披露方向积极，但仍不足以支持激进定价。悲观情景下，收入转化疲弱、优先股层级
              条款不利或 IPO 延迟，将迫使估值跌破当前私有市场水平。因此，下一步尽调很明确：不要只因市场标题叙事的稀缺性 就给这一轮定价；在作出投资判断前，要求经审计的经济性数据和 Apollo 优先股堆叠信息。
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 当前结论
            body: 建议：继续研究。公司的产品和采用信号可信，但进入价格仍取决于运营和交易条款披露，而公开证据目前尚未提供 这些信息。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV014
          - type: callout
            title: 下行触发因素
            body: 如果在披露经审计的经济性之前，公司宣传的 IPO 或新一轮融资估值高于当前独角兽标记价，那么一旦公开或准公开 市场投资者用已披露的医疗科技倍数对公司进行基准比较，估值压缩的概率会升高。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV013
          - type: callout
            title: 什么会促使上调结论
            body: 更清晰的买入逻辑需要同时获得 3 项披露：经审计的收入和毛利率、Apollo 优先股堆叠，以及诊所采用能够转化为 持久复购和留存经济性的证据。
            calloutType: assumption
            claimRefs:
              - CV002
              - CV009
              - CV013
