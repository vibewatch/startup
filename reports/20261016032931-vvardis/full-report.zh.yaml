  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 有证据支持的序数评分显示，Curodont 的早期病变临床差异化得分最高，但既有工作流熟悉度并未领先。
    data:
      xAxis:
        label: 早期病变临床差异化
        min: 1
        max: 5
        lowLabel: Surface-level / defer-to-status-quo
        highLabel: Lesion-depth restorative effect
        description: Ordinal 1-5 score derived from retained evidence.
      yAxis:
        label: 既有工作流与方案嵌入度
        min: 1
        max: 5
        lowLabel: Niche / lightly evidenced
        highLabel: Already embedded in practice protocol
        description: Ordinal 1-5 score derived from retained evidence.
      points:
        - label: Curodont
          x: 5
          'y': 3
          detail: 无钻病变深度叙事和同次就诊工作流，但商业证据目前仍主要由公司掌控。
        - label: 氟化物涂层
          x: 2
          'y': 5
          detail: 既有的预防或龋齿控制工作流，具备重复治疗节奏和明确的监管定位。
        - label: SDF
          x: 3
          'y': 4
          detail: 具有较长市场历史、强调可负担性的微创龋病阻断方案，并持续升级包装。
        - label: 树脂渗透
          x: 4
          'y': 2
          detail: 相似的病变阶段干预，但留存的公开证据没有显示其拥有广泛采用、价格或工作流规模。
        - label: 钻磨填充
          x: 1
          'y': 5
          detail: 发生龋洞后最成熟的修复路径，但具有侵入性，且无法保留早期病变结构。
        - label: 观察等待 / 居家氟化物
          x: 1
          'y': 4
          detail: 针对极早期病变的低复杂度现状方案，但它会延后治疗，而不是替代已经流失的矿物结构。
    approximationNotes: 评分是分析师根据留存来源作出的序数判断，而非实测市场份额或报销数据：x 轴反映早期病变治疗的临床差异化，y 轴反映该方案在现有诊疗方案和公开工作流证据中的嵌入程度。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP008
      - CP009
      - CP011
      - CP012
      - CP015
