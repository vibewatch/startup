  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 方向
      - 论点
      - 证据
      - 哪些变化会改变判断
    rows:
      - - 正面论点
        - Curodont 的差异化足以支撑战略投资者的溢价兴趣。
        - 官方产品材料将平台描述为仿生且无需钻磨，Apollo 相关报道则将其定位为新的牙科护理品类。
        - 如果独立的长期结果或支付方支持足以推翻差异化判断，这一支柱就会走弱。
      - - 正面论点
        - 商业采用看起来已经真实落地，而非只有概念。
        - 与公司相关的新闻稿称，截至 2025 年 7 月已治疗超过 100 万颗牙、覆盖超过 42 万名美国患者；到 2026 年 4 月，治疗量约 300 万颗牙，诊所渗透率接近 20%。
        - 如果披露的复购、留存和单诊所收入数据无法随采用规模同步增长，确信度就会下降。
      - - 正面论点
        - 专业资本持续为商业化提供资金。
        - OrbiMed 于 2025 年 2 月投资 3,500 万美元，并于 2025 年 7 月追加 5,000 万美元；随后 Apollo 于 2026 年以独角兽估值进行少数股权投资。
        - 如果证据显示新资金主要用于救助，或主要投资者获得了高度优先的下行保护，这一信号的说服力会明显减弱。
      - - 反论点
        - 表面估值的支撑强于实际入场经济性。
        - 与 Apollo 相关的来源证实估值超过 10 亿美元，但也称交易条款尚未披露。
        - 如果披露估值机制、优先权条款和投后持股结构后，普通股仍有吸引力的回报空间，判断会改善。
      - - 反论点
        - 美国市场的商业化仍集中在 Henry Schein。
        - 独立报道确认 Henry Schein 是 Curodont Repair Fluoride Plus 在美国的独家分销商。
        - 如果渠道实现了有意义的多元化，或 Henry Schein 关系内部有直接证据证明经济性可持续，这一依赖风险会降低。
      - - 反论点
        - 公开市场估值纪律尚未得到公开运营披露的配合。
        - Swissinfo/Bloomberg 提到公司可能以高于 2026 年 4 月估值的价格 IPO，而 Finviz 显示上市牙科科技可比公司正按已披露的销售额和 EV / Sales 比率交易。
        - 如果 S-1 或同等经审计披露显示，相比上市同业，公司拥有更高的增长和利润率，溢价就更容易自圆其说。
    notes: 每一行分别提炼一项投资论点，以及会强化或削弱该论点的具体披露或运营里程碑；除非独立来源明确说明，否则采用数据均来自公司披露。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 公司声称的采用数据最终转化为已披露的收入增长；毛利率更接近医疗科技而非大宗商品，Henry Schein 集中度下降，IPO 准备工作转化为正式推介流程。
        - 这将同时带来稀缺性和可审计的运营证明，因此支持估值超过当前 10 亿美元以上的水平。
        - 如果增长只是渠道堆出来、经济性却很薄，或优先权条款攫取了大部分上行空间，溢价倍数会压缩。
        - 乐观信号应是 S-1 或同等披露显示收入转化强劲、利润率健康且资本结构清晰。
      - - 基准
        - 商业进展真实，但新披露只能部分弥合投资判断缺口，IPO 仍是可能路径而非已承诺事项。
        - 在等待更好的经济性证据前，支持围绕当前独角兽估值保持纪律，而不是追价。
        - 在盈利能力、报销和留存得到证明前，投资者仍可能为差异化故事付出过高价格。
        - 基准信号是增量披露验证需求，但关键财务和条款细节仍未解决。
      - - 悲观
        - 收入转化落后于采用叙事，IPO 窗口推迟，或 Apollo 条款的优先级高到挤压普通股回报。
        - 公开市场纪律将压过私募稀缺性，因此公允价值低于当前独角兽估值。
        - 如果增长质量弱于宣传所示，下轮融资风险、分销集中度和清算优先权压顶会同时出现。
        - 悲观信号包括退出时间推迟、披露的经济性令人失望，或条款清单显示出沉重的优先权保护。
    notes: 由于指定来源没有披露经审计收入、利润率、现金消耗或股本数量，所以上述区间只保持方向性，无法进行更精细的自下而上估值。
    claimRefs:
      - CV003
      - CV004
      - CV011
      - CV013
      - CV014
