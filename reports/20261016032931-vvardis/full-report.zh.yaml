  - id: FE001
    title: 产品架构图
    type: stack
    summary: 临床适应症、诊室方案、肽机制和渠道赋能层层叠加，共同构成产品体系。
    data:
      layers:
        - label: 临床适应症与诊断
          summary: Early-lesion selection is the first control point.
          items:
            - 邻面、咬合面和光滑面病变
            - 成人、儿童和正畸使用场景
          outputs:
            - 治疗前选定符合条件的早期、未形成龋洞的病变
        - label: 诊室准备与应用
          summary: Deployment is a protocol, not a simple retail-use step.
          items:
            - 去除获得性膜、酸蚀、冲洗 / 干燥和隔离
            - 针对表面的 Curodont Repair 放置
          modules:
            - 不到 5 分钟的应用宣称，以及 8–10 分钟完整专业流程教程
          outputs:
            - 面向合格病变的非侵入式、同次就诊治疗选项
        - label: 肽再生机制
          summary: P11-4 scaffolds enamel repair inside the lesion.
          items:
            - 向病变深处扩散
            - 自组装形成生物基质
            - 从唾液中募集钙和磷酸盐
          outputs:
            - 羟基磷灰石再生以及阻止 / 逆转病变的宣称
        - label: 商业赋能与规模化
          summary: Training and channel execution sit on top of the science.
          items:
            - Certified Curodontist 在线学习路径
            - Henry Schein 美国独家分销
            - 面向患者的诊所定位器和从业者信息
          outputs:
            - 快速推广，但依赖现场教育和分销商执行
        - label: 临床证据层
          summary: Study-backed marketing claims bridge mechanism and adoption.
          items:
            - 超过 93% 的成功率宣称
            - 约 40% 的牙釉质再生宣称
          outputs:
            - 以公司筛选的结果摘要为锚的销售叙事
        - label: 消费者触达层
          summary: Public patient messaging turns clinician capability into demand generation.
          items:
            - 面向患者的无钻、无针定位
            - 查找附近 Certified Curodontist 的诊所定位器
          outputs:
            - 消费者拉动仍取决于受训诊所是否可用
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: vVARDIS 的公开客户路径从患者和临床人员认知开始，进入同次就诊治疗，随后主要通过认证诊所导流和 Henry Schein 主导的渠道覆盖扩张。
    data:
      items:
        - label: 患者认知
          actor: 患者 / 照护者
          channel: 消费者网站
          touchpoints:
            - 无钻、无针定位
            - 口腔健康教育和查找提供者提示
          tone: positive
        - label: 诊所发现
          actor: 患者和前台工作人员
          channel: 诊所定位器
          touchpoints:
            - Certified Curodontist 查找器
            - 需求被导向本地诊所，而非直接电商
          tone: positive
        - label: 临床筛选
          actor: 牙医和牙科保健师
          channel: 专业教育 / 工作流内容
          touchpoints:
            - 早期病变识别
            - 同次就诊治疗定位
          tone: neutral
        - label: 诊室治疗
          actor: 临床人员
          channel: 诊室工作流
          touchpoints:
            - 应用时间最短可为 3 分钟
            - 由受训临床人员操作，包括牙科保健师
          tone: positive
        - label: 复诊与推荐循环
          actor: 诊所和回诊患者
          channel: 复诊工作流 / 口碑
          touchpoints:
            - 诊所增长案例推荐
            - 复诊依从性和患者接受度宣称
          tone: positive
        - label: 渠道扩张
          actor: Henry Schein 和专科诊所
          channel: 美国独家分销
          touchpoints:
            - DSO 以及综合、正畸和儿科覆盖
            - 依赖单一规模化分销商
          tone: warning
    approximationNotes: 旅程阶段反映指定来源中的作者设定顺序；该图展示渠道流向和扩张循环，不是实测转化漏斗。
