              定位用于活动性、早期、未形成龋洞的病灶，而非已有龋洞的蛀牙；公司还称，再矿化效果需要数月 才能显现，并依赖持续的口腔卫生。这带来 2 项监管和法律敏感点：营销主张必须严格限定在证据实际支持的病灶范围内；
              现实经济性仍依赖不均衡的报销，而诊所要直接向患者定价收费。公开文献页面提升了可信度，但也表明可见的支持材料 部分由公司筛选整理，并不是完整独立的上市后资料档案。
