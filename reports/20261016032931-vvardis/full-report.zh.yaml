  summary: >-
    vVARDIS 是一家以 Curodont 为核心的瑞士牙科医疗科技公司。Curodont 是一种无需钻牙、用于早期龋齿的仿生治疗，
    通过专业牙科渠道销售，并由相邻的消费者口腔护理产品提供补充。公司在美国的采用情况已有可见信号，分销网络由 Henry Schein 主导，公开信息也显示毛利率较高；但实际成交价、现金跑道和 Apollo 交易条款仍未完全披露。
