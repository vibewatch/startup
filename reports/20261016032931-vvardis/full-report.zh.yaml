            body: >-
              指定的公开证据支持的是产品销售模式，而非服务模式。vVardis 向牙科专业人士销售椅旁 Curodont 产品，增加 预防和敏感护理等相邻产品，同时维持居家口腔护理产品线，因此商业触点同时覆盖 B2B2C
              专业渠道和直接面向 消费者的销售。工作流设计显然针对椅旁采用进行了优化：美国专业网站称，受过培训的临床人员可以在同次就诊中 用最短 3 分钟完成 Curodont Repair Fluoride Plus
              的应用；第三方报道则指 Henry Schein 为美国独家分销商。 公开材料没有披露的内容同样重要：指定来源均未披露 SKU 定价、实际 ASP、分销商分成、从毛收入到净收入的扣减
