      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              牙科诊所既是经济买方，也是服务交付场所；牙医以及在当地执业范围允许时受过培训的牙科保健师是用户； 患者或牙科福利计划则是最终支付方。产品所称的 3 分钟、同次就诊工作流降低了接入摩擦，也能把原本可能
              采取观察等待的诊断转化为即时服务。自 2026 年 1 月起，Henry Schein 被宣布为覆盖普通牙科、正畸、儿科
              及其他牙科细分市场的美国独家分销商，分销因此高度集中。该渠道可以加快触达，但也让公司依赖分销商执行， 同时患者支付、诊所利润和重复订购的经济性仍未披露。
            claimRefs:
              - CM008
              - CM010
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM013
              - CM015
      - number: '2.4'
        title: 采用驱动因素、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              龋齿高发、医疗转向微创护理，以及更早诊断扩大了可保守治疗的病灶池，共同支撑需求。公司报告的进展是：从 2025 年 7 月治疗超过一百万颗牙齿、覆盖美国近 10% 的诊所，增至 2026 年约
              三百万颗牙齿、覆盖接近 20% 的普通牙科诊所。这些数字说明商业势头在增强，但仍来自公司，且没有披露付费使用量、复购队列、
              净定价或留存。牙科报销有限，加上先进治疗材料成本较高，可能拖慢早期干预，尤其是在患者自费的地区。因此，独立使用数据和单位经济性尚未确认可服务收入池前，估值应认可品类创建和分销触达，同时对宽泛的市场算术打折。
            claimRefs:
              - CM011
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 报告的采用数据验证了工作流吸引力
            body: 公司披露称，2026 年 Curodont 已进入美国近 20% 的普通牙科诊所，并治疗约三百万颗牙齿；同次就诊完成的应用流程和全国性分销商降低了实际采用摩擦。
            calloutType: strength
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: callout
            title: 宽泛的品类规模不等于公司的可服务市场
            body: 现有的 USD 7.58 billion 估算包含晚期修复和牙髓治疗。没有符合条件的病灶数量、实际成交价、报销、复购行为 和按地区划分的可及性，就无法有证据支持精确的 vVARDIS SAM 或 SOM。
            calloutType: risk
            claimRefs:
              - CM003
              - CM005
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争先发生在品类路径上，而不只是初创公司之间的竞争
        blocks:
          - type: paragraph
            body: >-
              保留下来的来源指向的是品类竞争，而不是清晰的一对一公司对决。vVARDIS 将 Curodont 定位为预防失败与不可逆
              钻牙之间的一步：官方产品材料称，它能在不使用传统填充材料的情况下处理早期未形成龋洞的病灶；同一份 FAQ 也承认，对于非常早期的病灶，观察等待仍是现状，而出现龋洞后则采用传统修复。实际替代方案不只是
              直接的肽类竞争者，还包括作为现有预防/控制工作流的含氟涂层、作为微创阻断方案的氟化二胺银（SDF）、作为 病灶阶段微创替代方案的树脂渗透，以及蛀牙进展后的标准钻牙和补牙路径。来源池没有提供可信的公开证据，
              证明存在专门的“内部自建”威胁；在这个品类中，更相关的替代方案是继续使用已经适配牙医工作流和报销习惯 的既有诊疗流程。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP012
              - CP016
