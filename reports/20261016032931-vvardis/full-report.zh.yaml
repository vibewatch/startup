      - number: '1.3'
        title: 商业势头已显现，但披露仍落后于估值叙事
        blocks:
          - type: paragraph
            body: >-
              在本次更新窗口内，商业叙事明显增强。公司在 2026 年 1 月的 J.P. Morgan Healthcare Conference 材料中称， Curodont 在 24 个月内已治疗超过 2 million
              颗牙齿；2026 年 4 月至 10 月的第三方报道又将这一规模信号 推至约 3 million 颗牙齿，以及美国近 20% 的普通牙科诊所。里程碑的推进也体现出渠道建设较为有序： VideaHealth 和
              Pearl 的合作把诊断与治疗连接起来；Henry Schein 则从 2024 年的 DSO 独家分销角色， 在 2025
              年底拓展为覆盖美国各细分市场的合作伙伴。即便如此，最新的后期私有公司叙事仍建立在选择性运营披露上。 Swissinfo/Bloomberg 报道称，公司在 2026 年 10 月与 JPMorgan 和
              Goldman Sachs 合作筹备可能的美国 IPO， 但报道明确表示尚未作出最终决定。指定更新证据没有披露经审计的收入、利润率、现金、员工数、客户数或董事会信息， 因而公开的规模叙事强于公开的投资判断材料。
