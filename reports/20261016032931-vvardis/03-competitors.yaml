company:
  name: vVARDIS
chapter:
  number: 3
  title: Competitors
  summary: >-
    vVARDIS is competing less against a single startup peer than against a stack of incumbent clinical pathways:
    fluoride varnish, silver diamine fluoride, resin infiltration, and standard drill-and-fill restoration. Its
    visible edge is a drill-free lesion-depth regenerative narrative plus distributor-led adoption, but the public
    moat remains softer than the unicorn narrative because pricing transparency, reimbursement durability, and
    switching economics are still largely undisclosed.
sections:
  - id: landscape
    title: Competitive landscape is category-based, not startup-only
    body: >-
      The retained source set points to a category fight rather than a clean one-company-versus-one-company match.
      vVARDIS positions Curodont as the step between failed prevention and irreversible drilling: official product
      materials say it addresses early non-cavitated lesions without traditional filling materials, while the same
      FAQ still acknowledges the status quo of watchful waiting for very early lesions and conventional restoration
      once cavitation appears. That means the practical alternatives are not just direct peptide competitors. They
      also include fluoride varnish as an incumbent prevention/control workflow, silver diamine fluoride (SDF) as a
      minimally invasive arrest option, resin infiltration as a micro-invasive lesion-stage alternative, and the
      standard drill-and-fill pathway for progressed decay. The pool does not surface credible public evidence for a
      bespoke "internal build" threat; in this category, the more relevant substitute is continued use of existing
      practice protocols that already fit dentist workflow and reimbursement habits.
    claimRefs: [CP001, CP003, CP004, CP007, CP008, CP009, CP012, CP016]
    tableRefs: [TP001]
  - id: differentiation
    title: Differentiation is clearest on mechanism and workflow, not transparent economics
    body: >-
      Public differentiation is strongest where vVARDIS controls the narrative: mechanism and workflow. Official
      surfaces repeatedly claim lesion-depth hydroxyapatite regeneration, and they contrast that with the superficial
      remineralization of fluoride varnish. The U.S. professional site also emphasizes a same-appointment, as-little-
      as-three-minute workflow, while the Swiss professional product page publishes a visible list price of EUR 330
      excluding VAT. That public price anchor is unusual in the retained set: the Duraphat and Advantage Arrest
      articles describe cadence, packaging, affordability, or cost-effectiveness, but do not disclose direct list
      prices. As a result, the feature matrix is more supportable than a fully economic one. The positioning map
      therefore treats Curodont as highest on clinical differentiation for early lesions, while incumbents such as
      fluoride varnish, SDF, and conventional fillings still score higher on installed workflow familiarity.
    claimRefs: [CP001, CP002, CP005, CP008, CP009, CP010, CP011, CP014, CP015]
    tableRefs: [TP002, TP003]
    figureRefs: [FP001]
  - id: moat-durability
    title: Channel leverage is real, but hard switching barriers remain unproven
    body: >-
      The strongest non-clinical advantage visible in public evidence is distribution. Dental Tribune reports that
      Henry Schein is the exclusive U.S. distributor, and the founders cite traction through DSOs such as Heartland
      Dental, Aspen Dental, and PDS Health, plus UK group-practice relationships. That matters because practice
      adoption in dentistry often follows purchasing access, training, and reimbursement comfort as much as pure
      efficacy. Still, the moat looks commercial rather than structural. The retained sources do not disclose realized
      reimbursement by payer, reorder behavior, re-application rates, or contractual switching penalties, and the
      substitute set keeps evolving inside familiar workflows - Colgate pushes a licensed fluoride-varnish narrative,
      and Elevate is iterating SDF packaging rather than changing categories. vVARDIS therefore looks differentiated,
      but not insulated from buyer multi-homing or incumbent response.
    claimRefs: [CP005, CP006, CP007, CP011, CP012, CP013, CP015]
tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Alternative
      - Category
      - Scale / funding
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - Curodont Repair / Repair Fluoride Plus
        - Direct restorative alternative for early non-cavitated lesions
        - "$1B+ company valuation; ~3M treated teeth; ~20% of U.S. general dental practices (company-reported)"
        - Dentists, hygienists, and DSOs treating early-stage caries
        - Drill-free peptide-based lesion-depth remineralization and same-appointment workflow
        - Most traction proof remains company-controlled and realized economics are undisclosed
      - - Fluoride varnish (e.g., Duraphat)
        - Incumbent preventive / caries-control varnish
        - Retained article says Duraphat is the only UK fluoride varnish licensed for caries control
        - Children and adults at elevated caries risk via recurring preventive visits
        - Embedded guideline-friendly workflow and public regulatory labeling
        - Positioned as superficial and repeat-application care rather than lesion-depth restoration
      - - Silver diamine fluoride (e.g., Advantage Arrest 38%)
        - Minimally invasive caries-arrest substitute
        - FDA-cleared since 2014; >600 indexed studies cited in retained article; gel syringe launched in 2025
        - Pediatric and adult caries-arrest cases seeking easy, low-cost treatment
        - Ease of use, affordability, and workflow-friendly syringe packaging
        - Retained source set does not show restorative enamel regeneration or public list pricing
      - - Resin infiltration
        - Micro-invasive early-lesion treatment
        - Category alternative; no public scale or funding disclosed in retained sources
        - Practices willing to intervene before cavitation with a resin-based approach
        - Treats a similar lesion stage without waiting for cavitation
        - vVARDIS frames it as plastic-material infiltration and retained sources do not benchmark price or adoption
      - - Conventional drilling and filling
        - Status-quo restorative pathway
        - Installed standard of care; no direct market-share metric in retained pool
        - Cavitated lesions or practices preferring established restorative workflow
        - Familiar workflow with immediate repair and reimbursement familiarity
        - Invasive and tooth-structure removing, with no public fee benchmark in retained sources
    notes: >-
      Rows combine direct products and status-quo solution classes because the retained evidence is category-based;
      scale cells quote only what the sources disclose, and absence of a price or market-share figure means it was
      not published in the retained pool.
