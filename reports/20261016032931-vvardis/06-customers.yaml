  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: Practice-level reorder, renewal, churn, GRR, NRR, and contract-length metrics for U.S. customers.
      whyItMatters: Adoption momentum is visible, but durability cannot be underwritten without cohort or renewal evidence.
      diligencePath: Request cohort dashboards or ERP extracts showing active accounts, reorder cadence, and renewal history by segment.
      relatedQuestionRefs: [QU005, QU008]
    - type: missing-source
      severity: material
      topic: concentration-gap
      missingEvidence: Distributor agreement economics and concentration data, including minimums, exclusivity scope, termination rights, and top-customer revenue share.
      whyItMatters: The broadened Henry Schein relationship may accelerate growth while also increasing channel dependency and concentration risk.
      diligencePath: Review the Henry Schein distribution agreement and customer concentration schedules during management diligence.
      relatedQuestionRefs: [QU006, QU007]
    - type: enumeration-incomplete
      severity: material
      topic: proof-quality
      missingEvidence: A broader set of independently verifiable named customer deployments with quantified outcomes and multi-site scale.
      whyItMatters: Current named proof is sufficient to show use, but not enough to benchmark retention, expansion, or enterprise stickiness.
      diligencePath: Collect reference calls, case studies with quantified outcomes, and independent customer quotes across DSO and specialty segments.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: minor
      topic: reimbursement
      missingEvidence: Payer mix, reimbursement support, and patient out-of-pocket economics for U.S. practices using Curodont.
      whyItMatters: Patient willingness to accept treatment is cited qualitatively, but affordability and reimbursement can affect conversion and repeat use.
      diligencePath: Ask for reimbursement guidance, price sheets, and practice-level conversion data segmented by cash-pay and insured workflows.
