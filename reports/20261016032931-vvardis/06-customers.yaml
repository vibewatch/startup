  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / user
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof point
      - Limitation
    rows:
      - - Heartland Dental
        - DSO / large group practice
        - Early-stage caries treated non-invasively in clinical workflow
        - Production-use quote, not a pilot announcement
        - Named executive says teams have seen improved outcomes and deeper patient trust
        - No office count, treated volume, or reorder data disclosed
      - - Dr. Leonard M. Badger, DDS
        - Private-practice clinician
        - Integrates Curodont into regular appointments
        - Production-use testimonial
        - Describes the new applicator as a “Grab and Go” protocol that increases treatment confidence
        - Company-controlled testimonial with no quantified patient denominator
      - - Sarika Rambhai, RDH
        - Hygiene-led practice workflow
        - Incorporates Curodont into standard appointment flow
        - Production-use testimonial
        - Reports easier workflow integration and higher efficiency
        - Company-controlled testimonial with no quantified conversion or retention data
      - - Dr. Jin J. Vaghela / Dr. Kish Patel
        - Private-practice clinicians
        - Uses Curodont to treat lesions that would otherwise be watched and waited
        - Production-use testimonial
        - Testimonials emphasize minimally invasive treatment and practice-builder effects
        - Proof is qualitative; no site count, economic impact, or renewal data disclosed
    notes: >-
      Sample rather than exhaustive named-proof set. Public evidence is strongest for qualitative
      production use and weakest for independently verified outcomes, contract value, and retention.
    enumerationScope:
      coverage: sample
      basis: >-
        Publicly named customer and clinician references visible in the assigned source pool as of
        the 2026-10-16 run, not an exhaustive census of all vVARDIS users.
    claimRefs: [CU009, CU010, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      vVARDIS's public customer path runs from patient and clinician awareness into same-appointment
      treatment, then expands primarily through certified-practice routing and Henry Schein-led
      channel breadth.
    data:
      items:
        - label: Patient awareness
          actor: Patients / caregivers
          channel: Consumer site
          touchpoints:
            - Drill-free and needle-free positioning
            - Oral-health education and find-a-provider prompt
          tone: positive
        - label: Practice discovery
          actor: Patients and front-office staff
          channel: Clinic locator
          touchpoints:
            - Certified Curodontist finder
            - Demand routed into local practices instead of direct ecommerce
          tone: positive
        - label: Clinical qualification
          actor: Dentists and hygienists
          channel: Professional education / workflow content
          touchpoints:
            - Early-stage lesion identification
            - Same-appointment treatment framing
          tone: neutral
        - label: In-office treatment
          actor: Clinicians
          channel: Chairside workflow
          touchpoints:
            - As little as 3-minute application
            - Applied by trained clinicians, including hygienists
          tone: positive
        - label: Recall and advocacy loop
          actor: Practices and returning patients
          channel: Recall workflow / word of mouth
          touchpoints:
            - Practice-builder testimonials
            - Follow-up compliance and patient acceptance claims
          tone: positive
        - label: Channel expansion
          actor: Henry Schein and specialty practices
          channel: Exclusive U.S. distribution
          touchpoints:
            - DSO plus general, orthodontic, and pediatric reach
            - Dependency on a single scaled distributor
          tone: warning
    approximationNotes: >-
      Journey stages reflect authored sequencing from assigned sources; the figure shows channel flow
      and expansion loops, not a measured conversion funnel.
    claimRefs: [CU001, CU002, CU003, CU007, CU008, CU010, CU013]
callouts:
  - calloutType: strength
    title: Real adoption evidence is stronger than a logo wall
    body: >-
      The best customer proof is not the logo set but the combination of office-penetration claims,
      treated-teeth and patient counts, named workflow testimonials, and a broadened Henry Schein
      rollout across major U.S. practice segments.
    claimRefs: [CU004, CU005, CU006, CU009, CU010]
  - calloutType: risk
    title: Durability is still under-documented
    body: >-
      Public evidence supports adoption momentum, but not customer quality. Missing reorder, renewal,
      churn, NRR, contract, and concentration data leave the core durability question unresolved.
    claimRefs: [CU011, CU014]
