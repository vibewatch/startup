        - 2025-07
        - Company release syndicated by Dentistry Today
        - Medium
        - Shows real usage volume beyond pre-launch marketing
        - No breakdown by practice, geography, or repeat treatment
      - - U.S. treated patients
        - More than 420,000 since Jan 2024
        - 2025-07
        - Company release syndicated by Dentistry Today
        - Medium
        - Indicates patient throughput, not just office sign-ups
        - No repeat-patient or cohort data
      - - Office / practice penetration
        - Nearly 10% of U.S. dental offices by Jul-2025; nearly 20% of general dental practices by Apr-2026
        - 2025-07 to 2026-04
        - Dentistry Today, Business Wire, Dental Tribune, Dentaltown
        - High
        - Suggests fast expansion of clinical footprint
        - No active-practice definition or denominator methodology disclosed
      - - Channel expansion
        - Henry Schein exclusive across all U.S. dental market segments effective 2026-01-01
        - 2026-01
        - Orthodontic Products / Henry Schein coverage
        - Medium
        - Broadens access across DSO, general, orthodontic, and pediatric channels
        - No duration, minimum purchase, or termination terms disclosed
    notes: >-
      Trajectory rows combine company-reported adoption figures repeated by external publishers.
      Values show expansion momentum, not retention, net revenue retention, or customer quality.
