company:
  name: vVARDIS
chapter:
  number: 6
  title: Customers
  summary: >-
    vVARDIS has credible signs of real U.S. adoption for Curodont, with company-reported
    growth from more than 420,000 patients and nearly 10% of U.S. dental offices by
    mid-2025 to roughly 3 million treated teeth and nearly 20% of general dental
    practices by April 2026. The stronger proof is distribution breadth and clinician
    workflow fit; the weaker proof is durability, because public evidence still lacks
    renewal, reorder, churn, contract, and concentration disclosures.
sections:
  - id: customer-base-and-channels
    title: Customer base is practice-led, with patient demand routed back into clinicians and a single national distributor
    body: |-
      The buyer and user surfaces around vVARDIS are distinct. The company markets Curodont primarily to dental professionals through dedicated professional sites, but it also operates a patient-facing site with a clinic locator that routes demand to certified practices rather than selling directly online. That suggests a go-to-market motion built around practice adoption, clinician workflow integration, and patient demand generation that supports partner and practice throughput.

      Channel breadth is improving, but it is also concentrating. Henry Schein's expanded January 2026 agreement moved from DSO exclusivity to exclusive U.S. distribution across general dentistry, orthodontics, and pediatric dentistry, giving vVARDIS immediate reach across major office segments. The same structure also means U.S. expansion appears increasingly mediated through one partner, which is positive for scale but raises dependency risk if sell-through, promotion intensity, or contract terms weaken.
    claimRefs: [CU001, CU002, CU003, CU007, CU008]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-named-use
    title: Adoption proof is strongest on penetration and workflow evidence, not on audited customer economics
    body: |-
      Public proof of real adoption is materially better than logo-only evidence. Across the assigned source pool, company-controlled and third-party writeups consistently point to rising U.S. penetration, starting with more than one million treated teeth, more than 420,000 treated patients, and nearly 10% office penetration by July 2025, then advancing to approximately three million treated teeth and nearly 20% of general dental practices by April 2026. Those figures still come from the company, but they are repeated across multiple external publishers, which makes them useful directional proof of commercial uptake.

      Named usage evidence also exists, though it remains uneven. Heartland Dental is the clearest cited enterprise-style reference, while clinician testimonials on company-controlled properties describe easier same-appointment use, better recall compliance, and patient willingness to accept non-invasive treatment. That is enough to show real workflow fit and some proof of production use, but not enough to prove multi-site retention, reorder cadence, or practice-level revenue durability.
    claimRefs: [CU004, CU005, CU006, CU009, CU010, CU012]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Expansion evidence is visible, but retention and concentration remain the key unresolved customer questions
    body: |-
      The customer story today is more about expansion than durability. Apollo's 2026 investment and the broadened Henry Schein relationship both reinforce vVARDIS's ability to push Curodont into more practices and more segments, and the patient site plus professional testimonials imply a repeatable funnel from awareness to in-office treatment. However, the available evidence stops short of the metrics a growth investor would usually want before underwriting customer quality at scale.

      Specifically, the assigned public sources do not disclose active account counts, reorder rates, NRR, GRR, churn, renewal rates, contract duration, or top-customer revenue share. That means the chapter can support a thesis that vVARDIS has achieved meaningful adoption momentum, but it cannot support a thesis that the installed base is durable, efficiently expanding, or insulated from distributor concentration. Those missing denominators are the main customer diligence gap heading into any valuation decision.
    claimRefs: [CU011, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale evidence
      - Revenue / strategic value
      - Gap
    rows:
      - - General dental practices
        - "Buyer: practice owner or clinician; user: dentist / hygienist; payer: practice or patient"
        - Same-appointment treatment of early-stage caries
        - Patient-facing clinic locator plus company-reported presence in nearly 10% of U.S. offices by Jul-2025 and nearly 20% of general practices by Apr-2026
        - Core installed-base opportunity in U.S. commercial rollout
        - No active account count, reorder cadence, or office productivity disclosed
      - - DSOs / group practices
        - "Buyer: centralized procurement / clinical leadership; user: clinicians; payer: enterprise practice organization"
        - Standardized non-invasive early-caries treatment across multi-site networks
        - Henry Schein had prior DSO exclusivity before the Jan-2026 all-segment expansion; Heartland Dental is the clearest named enterprise-style user reference
        - Potentially high-volume channel if protocols standardize across locations
        - No disclosed DSO contract terms, minimums, or enterprise retention data
      - - Orthodontic and pediatric practices
        - "Buyer: specialty practice; user: clinicians; payer: practice or patient"
        - White-spot / early lesion treatment in specialty settings
        - Jan-2026 Henry Schein expansion explicitly added orthodontic and pediatric practices nationwide
        - Extends TAM beyond general dentistry and DSOs
        - No segment-level adoption or specialty-specific outcome data disclosed
      - - Patients routed through certified practices
        - "Buyer: patient chooses provider; user: patient receives treatment; payer: patient / insurer / practice workflow"
        - Drill-free cavity treatment located via certified-practice directory
        - Consumer site promotes a clinic locator and drill-free / needle-free positioning
        - Supports practice lead generation and consumer awareness
        - No conversion, reimbursement, or repeat-treatment data disclosed
    notes: >-
      Mixes company-controlled channel descriptions with third-party distribution reporting; public
      sources describe segments and penetration but not revenue split, reimbursement mix, or active
      account denominators.
    claimRefs: [CU001, CU003, CU006, CU007, CU008]
