evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Audited or management-certified revenue, ARR, gross margin, burn, runway, and cash balance.
    whyItMatters: >-
      The 2021 valuation cannot be assessed against current unit economics or liquidity without comparable operating
      data.
    diligencePath: Request monthly management accounts, ARR bridge, cash-flow statement, debt schedule, and runway model.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current cap table, preference stack, investor rights, board composition, and executive roster.
    whyItMatters: Ownership, control, dilution, and key-person risk cannot be evaluated from named historical investors alone.
    diligencePath: Obtain the latest cap table, charter, financing documents, board roster, and executive organization chart.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: Reconciled total funding and post-2021 financing history.
    whyItMatters: The assigned profiles report $433M and $434M totals, and the latest disclosed round is historical.
    diligencePath: Reconcile audited financing records, secondary transactions, debt, and any 2022-2026 primary capital.
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: material
    topic: security-governance
    missingEvidence: >-
      Company-level incident chronology, remediation metrics, and current exposure controls following public-workspace
      leak reporting.
    whyItMatters: Credential exposure can affect customer trust and enterprise adoption even when root cause is user configuration.
    diligencePath: >-
      Request incident attestations, secret-scanning coverage, public-workspace counts, remediation SLAs, and audit-log
      retention.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: sizing-gaps
    missingEvidence: Postman-specific TAM, SAM, SOM, paid-seat conversion, retention, and segment revenue.
    whyItMatters: Category forecasts do not show how much API-management spend Postman can reach or retain.
    diligencePath: >-
      Request management-certified segmentation, paid-seat cohorts, retention by customer segment, and a bottoms-up
      account universe.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: A reconciled definition and methodology bridge for the $20.89B and $15.1B 2030 estimates.
    whyItMatters: Different category boundaries can materially change valuation relevance and apparent growth.
    diligencePath: >-
      Obtain full publisher methodologies and reconcile included services, geographies, and API-security or gateway
      revenue.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: monetization
    missingEvidence: Current Postman pricing, enterprise contract terms, paid conversion, and expansion economics.
    whyItMatters: Seat economics and conversion determine whether broad usage becomes durable revenue.
    diligencePath: >-
      Request current price books, ARR bridge, conversion funnel, net retention, discounting, and contract-duration
      data.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: access-blocked
    severity: minor
    topic: security-constraints
    missingEvidence: Independent current incident and control effectiveness data for Postman enterprise deployments.
    whyItMatters: >-
      Security concerns can slow adoption and increase procurement friction, but assigned sources do not quantify
      remediation or customer impact.
    diligencePath: Request SOC 2 scope, incident disclosures, customer security questionnaires, and verified breach-response records.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Independent current enterprise quotes, realized discount distributions, usage overages, and migration cost studies
      by team size.
    whyItMatters: >-
      Pricing is a stated displacement trigger, but list prices and competitor comparisons cannot establish
      customer-level switching economics.
    diligencePath: >-
      Collect anonymized current quotes, renewal invoices, migration case studies, and win-loss data across small,
      mid-market, and enterprise segments.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: api-management
    missingEvidence: >-
      Customer evidence showing when Postman users adopt or replace it with developer portals, API marketplaces, gateway
      platforms, or internal builds.
    whyItMatters: >-
      The category-expansion thesis may be strategically important but is currently supported mainly by vendor
      positioning.
    diligencePath: >-
      Interview reference customers and review competitive evaluations, implementation timelines, and renewal/churn
      reasons.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: security-trust
    missingEvidence: >-
      Current independent testing of Postman enterprise defaults, secret-management adoption, incident controls, and
      remediation outcomes.
    whyItMatters: >-
      Historical exposure evidence may reflect user configuration rather than current product controls, so trust impact
      cannot be quantified.
    diligencePath: >-
      Obtain current SOC/security materials, control-adoption telemetry, incident disclosures, and customer security
      reviews.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Current price cards, realized pricing, revenue mix, paid-account counts, and revenue-recognition policy.
    whyItMatters: Subscription classification alone does not establish contract value, revenue quality, or free-to-paid conversion.
    diligencePath: Request plan-level bookings, invoices, contract samples, discount history, and the revenue-recognition memorandum.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, infrastructure cost, CAC, sales cycle, payback, retention, concentration, and contract duration by
      segment.
    whyItMatters: These metrics determine whether broad adoption converts into durable and capital-efficient revenue.
    diligencePath: Obtain cohort exports and segment-level unit-economics schedules reconciled to financial statements.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, monthly net burn, debt, commitments, runway, planned use of funds, and next-round trigger.
    whyItMatters: Funding raised and secondary trades do not measure cash available or primary financing dependency.
    diligencePath: Request the latest balance sheet, monthly cash-flow history, debt schedule, and 18-month operating plan.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled round-by-round schedule explaining the $433 million and $352 million third-party totals.
    whyItMatters: An unreconciled funding history prevents reliable tracing of historical proceeds and capitalization.
    diligencePath: Reconcile cap-table records, financing documents, and cash receipts with management.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: security-risk
    missingEvidence: >-
      Postman-specific remediation cost, insurance claims, customer churn, and support burden tied to reported workspace
      exposures.
    whyItMatters: >-
      Security obligations could affect delivery cost and retention, but vendor reports do not quantify Postman's
      financial impact.
    diligencePath: Request incident postmortems, remediation ledgers, insurance records, and affected-customer retention analysis.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: internal-architecture
    missingEvidence: >-
      Current internal service boundaries, tenancy model, storage and synchronization design, deployment topology,
      disaster recovery, and product-level SLO history.
    whyItMatters: >-
      The visible workflow stack cannot establish scalability, isolation, recovery, or reliability of the underlying
      platform.
    diligencePath: >-
      Obtain architecture diagrams, data-flow maps, service ownership, regional topology, SLO and incident history,
      recovery tests, and independent security-assessment results.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: comparative-performance
    missingEvidence: >-
      Independent, like-for-like benchmarks for large collections, pipeline throughput, protocol coverage, monitoring
      reliability, and administration at enterprise scale.
    whyItMatters: >-
      Competitor comparisons identify plausible tradeoffs but cannot independently prove Postman's relative performance
      or total operating cost.
    diligencePath: >-
      Run a buyer-defined benchmark against the incumbent toolchain and shortlisted alternatives using representative
      collections, protocols, users, and CI workloads.
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: ai-agent-adoption
    missingEvidence: >-
      Current production users, active agent workflows, retention, pricing, model and tool failure rates, permission
      controls, and roadmap delivery since the 2025 launch.
    whyItMatters: >-
      Launch coverage and API-network breadth do not establish adoption, monetization, safety, or durable
      differentiation for the agent product.
    diligencePath: >-
      Request current cohort metrics, production references, pricing realization, evaluation results, permission
      architecture, and the shipped-versus-planned roadmap.
  - type: missing-source
    severity: material
    topic: security-control-verification
    missingEvidence: >-
      First-party control documentation and current metrics for secret-scanning coverage, exposed-secret detection,
      revocation time, workspace defaults, and related incidents.
    whyItMatters: >-
      Third-party feature descriptions do not prove control adoption, default safety, effectiveness, or improvement
      after reported public-workspace exposures.
    diligencePath: >-
      Review official configuration documentation, plan entitlements, control telemetry, incident postmortems,
      penetration tests, and customer evidence for governed deployments.
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Customer-level cohorts showing paid accounts, seats, GRR, NRR, churn, renewal, expansion, and contract duration by
      segment.
    whyItMatters: Broad registered reach and positive reviews do not establish recurring revenue durability or expansion economics.
    diligencePath: >-
      Request a management-certified cohort bridge for the last eight quarters, reconciled to billing data and segmented
      by SMB, mid-market, and enterprise.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A current, permissioned customer reference list with production versus pilot status, deployment scope, outcomes,
      and contract tenure.
    whyItMatters: >-
      Public references demonstrate workflow use but do not support customer concentration, implementation success, or
      renewal underwriting.
    diligencePath: >-
      Obtain three reference calls and redacted deployment summaries covering use case, go-live date, seats, outcomes,
      renewal, and expansion.
    relatedQuestionRefs:
      - QU004
      - QU009
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: >-
      Definitions and reconciliation for registered users, active users, organizations, paid accounts, and billable
      seats.
    whyItMatters: >-
      The 30-million and 500,000-plus figures have different denominators and are not independently audited in the
