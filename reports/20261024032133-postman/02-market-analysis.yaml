      - [Security-sensitive enterprise, Security and architecture, Developers and administrators, CIO or procurement, SSO; SCIM; secrets; workspace controls, Security and IT, Compliance and incident-risk reduction]
    notes: "Buyer and payer roles are an evidence-constrained operating map; public sources do not disclose Postman's conversion rates, contract duration, or segment-level retention."
    claimRefs: [CM008, CM009, CM010, CM011]
