company:
  name: Postman
chapter:
  number: 2
  title: Market Analysis
  summary: Postman operates at the intersection of API development collaboration and the broader API-management market. The evidence supports a large, expanding infrastructure category, but published estimates use different boundaries and methods, so the chapter preserves multiple sizing lenses rather than treating one forecast as Postman's addressable market.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      The narrow product market is API development collaboration: designing requests and specifications,
      testing, documenting, monitoring, and sharing API work. GAX Online describes Postman as covering
      API design, testing, monitoring, documentation, and team collaboration under one tool. Codoid
      separately treats Postman as a practical starting point for functional and basic security testing,
      while cautioning that it does not replace specialized penetration-testing tools. The broader
      API-management market adds gateway, analytics, security, lifecycle controls, and services;
      The Business Research Company explicitly includes
      solutions and services, cloud and on-premises deployment, organization size, and industry verticals.
      The boundary therefore includes software and services used to create, govern, publish, secure, or
      observe APIs, but excludes general-purpose application development, generic observability, and
      unrelated integration spend. Status-quo substitutes remain command-line or bespoke scripts,
      separate best-of-breed tools, and incumbent cloud API gateways. Postman's relevance is highest
      where a buyer values a shared developer workflow and a single lifecycle surface, not merely an
      API endpoint gateway.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing requires multiple lenses
    body: >-
      Published market estimates are directionally consistent on growth but not directly interchangeable.
      The Business Research Company reports API management at $5.24 billion in 2025, $6.92 billion in
      2026, and $20.89 billion in 2030 at a 31.8% 2026–2030 CAGR; Strategic Market Research instead
      reports $5.6 billion in 2024 and $15.1 billion in 2030 at an 18.2% CAGR. The difference can reflect
      category scope, revenue inclusion, geography, and forecast methodology rather than a simple factual
      contradiction. The former source identifies North America as the largest region in 2025 and
      segments by solutions/services, deployment, organization size, and vertical. The latter highlights
      cloud migration, microservices, mobile-first models, IoT, AI services, data-sharing regulation,
      and security as demand forces. These figures are market-context lenses, not Postman TAM, SAM, or
      SOM. A Postman-specific sizing exercise would need paid-seat penetration, enterprise attach rates,
      usage-based monetization, geography, and overlap with cloud-provider and gateway budgets.
    claimRefs: [CM004, CM005, CM006, CM007]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      The adoption path is bottom-up but the budget owner becomes more senior as governance and risk
      requirements increase. Individual developers and QA engineers can start with request exploration,
      collections, and functional tests; engineering teams then pay for collaboration, CI/CD execution,
      documentation, monitoring, and shared workspaces. Enterprise security, identity, provisioning,
      workspace controls, and compliance move the buying center toward platform engineering, developer
      experience, security, and procurement. The hardening guide says enterprise deployments store
      sensitive API endpoints, authentication tokens, and test data, and recommends SSO, SCIM, least
      privilege, and workspace controls. GAX Online reports per-user pricing that becomes material above
      roughly 25–50 seats, while EquityZen reports that monetization of free users “has taken longer
      than expected.” The commercial implication is a broad user funnel with a narrower paid conversion
      funnel, and adoption depends on proving workflow consolidation without creating unacceptable cloud,
      governance, or seat-cost friction.
    claimRefs: [CM008, CM009, CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Drivers, constraints, and valuation relevance
    body: >-
      Demand drivers include cloud-native and microservices adoption, mobile and digital-service
      connectivity, API-first product strategies, AI-agent integration, and regulatory pressure for
      secure data sharing. Strategic Market Research identifies digital transformation, regulation,
      cybersecurity, and automation as macro forces; The Business Research Company points to mobile
      adoption, cloud-native development, microservices, and digital transformation. The same market
      remains constrained by security and trust. CybelAngel reports that exposed Postman collections
      included API keys, access tokens, and credentials, and says public visibility settings and
      misconfigured workspaces can expose data. Vorlon reports over 30,000 publicly accessible
      collections and warns that rotating credentials can disrupt payment, inventory, or other
      workflows. GAX Online also reports cloud-first lock-in, steep per-seat scaling, and collection
      performance concerns. For valuation, category growth is supportive only if Postman converts
      developer usage into durable enterprise budgets while reducing security, governance, switching,
      and monetization objections; public evidence does not isolate Postman's SAM, SOM, retention, or
      paid conversion.
    claimRefs: [CM012, CM013, CM014, CM015, CM016]
callouts:
  - calloutType: strength
    title: Platform breadth supports expansion
    body: Postman's lifecycle coverage can consolidate several point tools when buyers value one shared API workflow.
    claimRefs: [CM002, CM012]
  - calloutType: risk
    title: Market growth is not company-specific proof
    body: Category forecasts and an uncorroborated third-party revenue estimate do not establish Postman's share, paid conversion, ARR, or ability to capture gateway and security budgets.
    claimRefs: [CM004, CM005, CM015, CM016]
