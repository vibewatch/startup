company:
  name: Postman
chapter:
  number: 1
  title: Company Overview
  summary: Postman is a privately held API development and collaboration platform founded in 2014 by Abhinav Asthana, Abhijit Kane, and Ankit Sobti. Available evidence establishes a $225 million Series D at a $5.6 billion post-money valuation in August 2021 and a broad platform expansion into AI-agent workflows, but current revenue, cap table, board composition, and operating scale remain insufficiently verified.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Postman’s documented identity is consistent across the assigned sources: it began in
      Bangalore in 2014 and is headquartered in San Francisco. The platform combines API
      design, testing, documentation, monitoring, discovery, and collaboration rather than
      serving only as an API client. The product model is therefore a developer-workflow
      platform whose value depends on shared workspaces, API artifacts, integrations, and
      organization-wide governance. TechCrunch’s 2025 reporting adds a strategic extension:
      Postman was using its API hub and visual Flows environment to let users build and test
      AI agents. That expansion is strategically coherent because agents need to call
      APIs, but the same collaboration surface creates security and governance exposure
      when credentials are stored or shared improperly. Current user, customer, and
      employee figures are not treated as settled because the sources disagree or lack
      a comparable measurement date.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-funding-and-scale
    title: Leadership, funding, and scale
    body: >-
      The founder story is unusually clear at the operating level: Abhinav Asthana is
      identified as CEO and co-founder, while Abhijit Kane and Ankit Sobti are identified
      as co-founders; the available material also attributes CTO leadership to Sobti.
      This supports a founder-led operating thesis, but it does not establish current
      executive coverage, succession depth, independent directors, voting control, or
      investor rights. Funding evidence is stronger than operating evidence. Tracxn records
      six rounds totaling $434 million and identifies the August 2021 Series D as $225
      million at a $5.6 billion post-money valuation; Wikipedia independently records the
      same Series D amount and valuation. A later Forbes profile reports $433 million,
      illustrating a small source discrepancy that should not be silently normalized.
      Neither source establishes current valuation, revenue, ARR, burn, runway, or cash
      available. Those metrics remain diligence requests.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: milestones-and-risk-context
    title: Milestones and risk context
    body: >-
      The milestone sequence shows a progression from a developer utility to a broader
      API-lifecycle and AI workflow platform. The sources support founding in 2014,
      successive 2019, 2020, and 2021 financing rounds, the 2021 valuation peak, the
      2023 Akita acquisition, the 2024 Orbit acquisition, the 2025 liblab acquisition,
      the January 2025 AI Agent Builder launch, and the March 2026 AI-native platform
      launch reported in the assigned Wikipedia text. These milestones indicate continued
      product and capability expansion, but acquisition integration outcomes and
      monetization are not disclosed. Security reporting is material context rather than
      proof of a company-level breach: multiple commercially interested security vendors
      describe more than 30,000 public workspaces or collections exposing credentials
      through user misconfiguration, and a hardening guide says public-workspace visibility
      was a leading leak cause. The evidence supports a governance and trust diligence
      item, not a conclusion that Postman itself caused every downstream incident.
    claimRefs: [CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
