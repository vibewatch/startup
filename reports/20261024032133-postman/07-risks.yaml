artifact: risks
slug: postman
runDate: 2026-10-24
company:
  name: Postman
chapter:
  number: 7
  title: Risks
  summary: Postman's collaboration model creates material credential-exposure and governance risks, while public evidence is thinner on legal, financial, and operational resilience. The most actionable mitigations are access governance, secrets hygiene, monitoring, and explicit testing limits.
sections:
  - id: security-and-governance
    title: Security and governance
    body: >-
      Postman is used to build, test, document, and collaborate around APIs, so its workspaces can contain authentication tokens, API keys, internal endpoints, and test data. The strongest adverse evidence concerns the interaction between public sharing, forks, synced variables, and imperfect secret-scanning coverage. Truffle Security reported 1,689 live unique credentials across 183 secret types in a scan of about 40,000 workspaces, while noting that its search and detector coverage were incomplete. CybelAngel separately described exposed credentials and access paths affecting healthcare, payments, CRM, and observability systems. These findings are not proof that Postman itself was breached, but they establish a high-impact misuse and configuration risk around the platform's data-sharing surface.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-and-technical
    title: Operational and technical resilience
    body: >-
      Postman's operating risk is concentrated in the gap between developer-friendly functional testing and enterprise-grade control requirements. SmartBear's comparison, written by a competitor, characterizes Postman as cloud-based and collaboration-focused, with teams assembling separate tools for performance and security testing when those needs exceed its core workflow. Independent testing guidance similarly says Postman can perform basic security checks but cannot replace specialized penetration testing for advanced exploits. This creates a dependency risk: customers may overestimate what routine collection tests prove, while production reliability, authorization, and deeper vulnerability coverage remain dependent on customer process and adjacent tooling.
    claimRefs: [CR005, CR006, CR007]
    tableRefs: [TR002]
  - id: partner-and-financial-exposure
    title: Partner, dependency, and financial exposure
    body: >-
      The available pool does not establish a verified current supplier concentration, key-customer concentration, burn rate, runway, credit exposure, litigation posture, or capital structure. It does show that Postman workflows can connect to payment, identity, observability, and internal systems, making third-party and customer-side integrations consequential even when the underlying failure is a user's configuration. A security guide states that environment variables sync to Postman's cloud and travel with workspace sharing, while local vault storage avoids that exposure path. The investment implication is therefore asymmetric: a large installed workflow surface can amplify the cost of a single secret-management failure, but the public evidence does not quantify Postman's own loss frequency or financial reserve.
    claimRefs: [CR008, CR009, CR010]
    tableRefs: [TR003]
  - id: triggers-and-diligence
    title: Mitigations and thesis-break triggers
    body: >-
      The most credible mitigations are measurable controls rather than generic assurances: restrict public workspace creation, federate authentication, enforce least privilege and administrator separation, limit API-key generation and expiry, use local or external vaults for secrets, and monitor scanner findings with a documented rotation process. A thesis break would be a confirmed material incident attributable to a Postman control failure, repeated exposure after documented remediation, or evidence that enterprise customers cannot obtain adequate auditability and data-sovereignty controls for their use case. Before underwriting resilience, diligence should obtain incident and claim history, control-coverage metrics by workspace type, mean time to revoke exposed keys, independent assurance reports, retention and concentration data, and current burn/runway.
    claimRefs: [CR011, CR012, CR013]
    figureRefs: [FR001]
