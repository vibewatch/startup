        - "Likelihood / impact"
        - "Critical impact"
        - "High impact"
        - "Material impact"
      rows:
        - label: "High likelihood"
          values: ["Public or synced secret exposure", "Overbroad workspace access", "Shared credentials", null]
        - label: "Medium likelihood"
          values: ["API-key persistence", "Testing-coverage gap", "Third-party integration blast radius", "Delayed revocation"]
        - label: "Unknown likelihood"
          values: [null, "Legal / regulatory posture", "Financial resilience disclosure", null]
        - label: "Low likelihood"
          values: [null, "Contained access issue", null, null]
        - label: "Not assessed"
          values: [null, null, "Unverified operating loss", null]
        - label: "Low impact"
          values: ["Routine test failure", null, null, null]
    approximationNotes: "Qualitative placement uses source-described failure modes and explicitly preserves unknown likelihood where the assigned evidence is insufficient."
    claimRefs: [CR001, CR005, CR008, CR010]
callouts:
  - calloutType: risk
    title: Highest-ranked risk
    body: >-
      Public or synced workspace secrets can create a direct path from a developer artifact to customer or internal systems; the available evidence supports critical impact but not a quantified Postman incident rate.
    claimRefs: [CR001, CR002, CR008]
  - calloutType: assumption
    title: Evidence boundary
    body: >-
      The assigned pool does not verify current litigation, regulatory enforcement, burn, runway, customer concentration, or the effectiveness of Postman's controls across private and internal workspaces.
    claimRefs: [CR010, CR013]
