    claimRefs: [CR001, CR003, CR005, CR010]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Secrets copied into public or synced workspaces, "High", "Critical", "Partial", "High", "Coverage and response time by workspace type are not disclosed."]
      - [Basic functional tests mistaken for full security assurance, "Medium", "High", "Partial", "Medium-high", "Independent penetration-test coverage and customer control ownership are not verified."]
      - [Overbroad member or administrator access, "Medium", "High", "Partial", "Medium-high", "Obtain access-review cadence, SCIM deprovisioning metrics, and privileged-action logs."]
      - [API-key persistence or delayed rotation, "Medium", "High", "Partial", "Medium-high", "Obtain key age distribution, expiry enforcement, and mean time to revoke exposed keys."]
    notes: "Likelihood and severity are analytical ratings anchored to the cited failure modes; they are not incident-rate estimates."
    claimRefs: [CR001, CR005, CR006, CR011]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [Identity and access provider, "Customer IdP / Postman account", "A compromised or orphaned account reaches collections, environments, or tokens.", "High", "SSO, MFA, SCIM, least privilege, and rapid offboarding.", "Medium-high", "Obtain federated-authentication adoption and deprovisioning metrics."]
      - [Cloud workspace and sync layer, "Postman cloud / workspace sharing", "Synced environment values or shared collections expose credentials or internal endpoints.", "Critical", "Local Vault or external secrets manager; restrict visibility and sharing.", "High", "Verify storage, sharing, export, and deletion semantics contractually."]
      - [Customer payment and business systems, "Customer APIs and third-party integrations", "Leaked keys enable unauthorized transactions, data access, or operational disruption.", "High", "Short-lived credentials, rotation, monitoring, and scoped permissions.", "Medium-high", "Review customer incident cases, indemnities, and blast-radius controls."]
      - [Specialized security and performance tooling, "Customer-selected adjacent vendors", "Coverage gaps remain when Postman functional tests are used without deeper scanners or load tools.", "Medium-high", "Define test ownership and required complementary controls.", "Medium", "Map enterprise reference architectures and control attestations."]
    notes: "Counterparties are roles or dependency classes described by the sources, not a claim of contractual concentration or named supplier dependence."
    claimRefs: [CR008, CR009, CR012]
figures:
