  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "Customer-level cohorts showing paid accounts, seats, GRR, NRR, churn, renewal, expansion, and contract duration by segment."
      whyItMatters: "Broad registered reach and positive reviews do not establish recurring revenue durability or expansion economics."
      diligencePath: "Request a management-certified cohort bridge for the last eight quarters, reconciled to billing data and segmented by SMB, mid-market, and enterprise."
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: "A current, permissioned customer reference list with production versus pilot status, deployment scope, outcomes, and contract tenure."
      whyItMatters: "Public references demonstrate workflow use but do not support customer concentration, implementation success, or renewal underwriting."
      diligencePath: "Obtain three reference calls and redacted deployment summaries covering use case, go-live date, seats, outcomes, renewal, and expansion."
      relatedQuestionRefs: [QU004, QU009]
      relatedTableRefs: [TU003]
    - type: conflicting-data
      severity: material
      topic: customer-count
      missingEvidence: "Definitions and reconciliation for registered users, active users, organizations, paid accounts, and billable seats."
      whyItMatters: "The 30-million and 500,000-plus figures have different denominators and are not independently audited in the retained evidence."
      diligencePath: "Request a dated KPI dictionary and monthly active-user, active-organization, paid-account, and seat series for 2024-2026."
      relatedQuestionRefs: [QU002, QU005]
    - type: missing-source
      severity: material
      topic: adoption-friction
      missingEvidence: "Churn and support data linked to performance, governance, security, version-control, and pricing objections."
      whyItMatters: "Reviewer-reported friction may constrain expansion even if initial adoption is broad."
      diligencePath: "Request win-loss, churn-reason, support-ticket, and product-usage analyses segmented by account size and plan."
      relatedQuestionRefs: [QU007, QU009]
