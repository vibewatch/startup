              - CO008
      - number: '1.3'
        title: Milestones and risk context
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence shows a progression from a developer utility to a broader API-lifecycle and AI
              workflow platform. The sources support founding in 2014, successive 2019, 2020, and 2021 financing rounds,
              the 2021 valuation peak, the 2023 Akita acquisition, the 2024 Orbit acquisition, the 2025 liblab
              acquisition, the January 2025 AI Agent Builder launch, and the March 2026 AI-native platform launch
              reported in the assigned Wikipedia text. These milestones indicate continued product and capability
              expansion, but acquisition integration outcomes and monetization are not disclosed. Security reporting is
              material context rather than proof of a company-level breach: multiple commercially interested security
              vendors describe more than 30,000 public workspaces or collections exposing credentials through user
              misconfiguration, and a hardening guide says public-workspace visibility was a leading leak cause. The
              evidence supports a governance and trust diligence item, not a conclusion that Postman itself caused every
              downstream incident.
