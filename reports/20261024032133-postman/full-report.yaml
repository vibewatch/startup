      - number: '4.2'
        title: Adoption signals do not resolve sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Forge reports that Postman said 500,000 companies, including 98% of the Fortune 500, used the platform as
              of April 2023. That is a useful historical distribution signal, but it is not a paid-customer denominator.
              Economic Times later reported that people familiar with Postman's financials estimated annualized
              recurring revenue at $120-150 million and said user monetization had taken longer than expected, affecting
              ARR growth. The estimate is not audited or management-certified, and its underlying period and ARR
              definition are not disclosed in the retained text. No allocated source provides CAC, payback, sales cycle,
              net retention, contract duration, or channel economics. Consequently, scale of use cannot be translated
              into acquisition efficiency or expansion quality without cohort and contract data from management.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI015
              - CI016
      - number: '4.3'
        title: Security obligations are visible; their cost is not
        blocks:
          - type: paragraph
            body: >-
              The evidence identifies operating obligations without quantifying their expense. HowToHarden describes
              enterprise identity, provisioning, workspace, secret-management, monitoring, and compliance controls, all
              of which imply continuing product, cloud, security, and support work. CybelAngel reports that secret
              scanning covers public workspaces while private workspaces can remain exposed after unauthorized access.
              Vorlon separately reports more than 30,000 publicly accessible Postman collections containing sensitive
              data. These are adverse reports from security vendors rather than audited incident disclosures, and they
              do not establish a platform breach, recognized liability, churn, or remediation amount. They nevertheless
              make security operations, customer assurance, and incident response credible gross-margin and retention
              diligence topics. Public evidence does not reveal infrastructure cost, support burden, insurance, or
              incident-related spending.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: Historical funding does not establish current liquidity
        blocks:
          - type: paragraph
            body: >-
              Public funding totals conflict: Multiples reports $433 million across five rounds, while Forge and Sacra
              display $352 million. This discrepancy requires reconciliation against financing documents rather than
              selecting a convenient total. Economic Times reported Postman secondary transactions at a 30-40% discount
              to the 2021 primary valuation and explained that secondary proceeds go to selling holders, not company
              coffers. The same report said slower monetization had affected ARR growth. Forge states that Postman has
              not publicly endorsed an IPO, so the retained evidence does not identify a visible primary capital event.
              None of these facts reveals current cash, burn, debt, commitments, or runway. The financial verdict is
              therefore research-more: subscription potential and adoption are credible, but revenue quality, margin
              path, and capital adequacy cannot be underwritten without current company records.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI015
              - CI016
