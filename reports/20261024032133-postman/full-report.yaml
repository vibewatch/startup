  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Claimed scale and workflow breadth are outweighed by missing fundamentals, a thin secondary-price signal, and
      security-governance risk.
    data:
      nodes:
        - id: scale
          label: Claimed scale
          detail: 50M+ developers and 500K+ organizations, company-issued.
        - id: breadth
          label: Workflow breadth
          detail: Design, testing, documentation, monitoring, and governance.
        - id: boundary
          label: Product boundary
          detail: Development platform, not a production runtime gateway.
        - id: opacity
          label: Financial opacity
          detail: No audited ARR, revenue, margin, retention, burn, or runway.
        - id: price
          label: Thin price signal
          detail: $1.57B Forge indication with limited market activity.
        - id: decision
          label: Research more
          detail: Set price and return targets only after management diligence.
      edges:
        - from: scale
          to: breadth
        - from: breadth
          to: boundary
        - from: boundary
          to: opacity
        - from: opacity
          to: price
        - from: price
          to: decision
    approximationNotes: The flow is qualitative and does not assign weights or probabilities to the decision factors.
    claimRefs:
      - CV002
      - CV003
      - CV008
      - CV009
      - CV010
      - CV012
      - CV015
