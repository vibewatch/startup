chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Postman’s documented identity is consistent across the assigned sources: it began in Bangalore in 2014 and
              is headquartered in San Francisco. The platform combines API design, testing, documentation, monitoring,
              discovery, and collaboration rather than serving only as an API client. The product model is therefore a
              developer-workflow platform whose value depends on shared workspaces, API artifacts, integrations, and
              organization-wide governance. TechCrunch’s 2025 reporting adds a strategic extension: Postman was using
              its API hub and visual Flows environment to let users build and test AI agents. That expansion is
              strategically coherent because agents need to call APIs, but the same collaboration surface creates
              security and governance exposure when credentials are stored or shared improperly. Current user, customer,
              and employee figures are not treated as settled because the sources disagree or lack a comparable
              measurement date.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: Leadership, funding, and scale
        blocks:
          - type: paragraph
            body: >-
              The founder story is unusually clear at the operating level: Abhinav Asthana is identified as CEO and
              co-founder, while Abhijit Kane and Ankit Sobti are identified as co-founders; the available material also
              attributes CTO leadership to Sobti. This supports a founder-led operating thesis, but it does not
              establish current executive coverage, succession depth, independent directors, voting control, or investor
              rights. Funding evidence is stronger than operating evidence. Tracxn records six rounds totaling $434
              million and identifies the August 2021 Series D as $225 million at a $5.6 billion post-money valuation;
              Wikipedia independently records the same Series D amount and valuation. A later Forbes profile reports
              $433 million, illustrating a small source discrepancy that should not be silently normalized. Neither
              source establishes current valuation, revenue, ARR, burn, runway, or cash available. Those metrics remain
              diligence requests.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO005
