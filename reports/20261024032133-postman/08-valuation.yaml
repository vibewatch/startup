  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-fundamentals
      missingEvidence: >-
        Audited revenue, ARR, gross margin, growth, net retention, customer
        concentration, burn, cash, and runway for current periods.
      whyItMatters: >-
        These inputs are required to choose a SaaS valuation method, assess
        durability, and underwrite a target return or downside case.
      diligencePath: >-
        Obtain audited statements, monthly management accounts, cohort and
        segment schedules, bank balances, and board-approved forecasts; reconcile
        each metric to accounting definitions.
      relatedQuestionRefs: [QV010]
      relatedTableRefs: [TV003]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: >-
        Current fully diluted cap table, debt, option pool, secondary transfers,
        liquidation preferences, participation rights, anti-dilution terms, and
        investor or board rights.
      whyItMatters: >-
        Enterprise value and common-share return cannot be translated into an
        investable price without dilution and waterfall terms.
      diligencePath: >-
        Review the current cap table, charter, financing documents, debt
        agreements, board minutes, and a management-prepared proceeds waterfall.
      relatedQuestionRefs: [QV009]
      relatedTableRefs: [TV001, TV003]
    - type: conflicting-data
      severity: material
      topic: cumulative-funding
      missingEvidence: >-
        A primary-source reconciliation of the $352 million and $433 million
        cumulative funding totals, including any debt or secondary components.
      whyItMatters: >-
        Funding raised is not cash available, and inconsistent totals obscure
        dilution, financing history, and potential preference overhang.
      diligencePath: >-
        Reconcile every financing from signed stock-purchase and debt documents
        to cash receipts, secondary proceeds, fees, and the current cap table.
      relatedQuestionRefs: [QV001, QV009]
