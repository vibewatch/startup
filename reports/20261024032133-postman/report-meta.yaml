  topStrengths:
    - Broad API development and collaboration workflow with meaningful developer adoption signals.
    - Category relevance is reinforced by API-first and AI-agent adoption trends.
    - Accumulated collections, environments, tests, and team context can create workflow stickiness.
  topRisks:
    - Current revenue, ARR, margin, burn, runway, retention, and paid-account metrics are not publicly verified.
    - Security and governance exposure can weaken enterprise trust when workspaces or credentials are misconfigured.
    - Lower-cost developer tools and broader API-management platforms create credible displacement paths.
  unresolvedGaps:
