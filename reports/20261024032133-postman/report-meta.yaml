companyProfile:
  summary: >-
    Postman is a privately held API development and collaboration company founded by Abhinav Asthana, Ankit Sobti, and
    Abhijit Kane. Its platform combines API requests, collections, testing, documentation, monitoring, discovery, and
    shared workspaces, with newer AI-agent workflows. The company has category reach and a substantial developer
    footprint, but public evidence does not establish paid conversion, retention, current operating economics, or
    current valuation.
