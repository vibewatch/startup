    rows:
      - ["Core API workflow subscription", "Paid access to design, testing, documentation, and monitoring workflows", "Undisclosed", "Subscription model reported; realized revenue unavailable", "Third-party classification", "Provide plan-level revenue, paid accounts, and renewal cohorts"]
      - ["Enterprise collaboration and governance", "Collaboration, API governance, and CI/CD capabilities in the enterprise edition", "Undisclosed", "Capability bundle described; revenue mix unavailable", "Third-party product description", "Provide enterprise ACV, seat expansion, and discount history"]
      - ["Enterprise identity and security controls", "SAML and related controls gated to an Enterprise plan", "Undisclosed", "Plan gate observed; list and realized price unavailable", "Independent implementation guide", "Provide price cards, security add-on attach, and support costs"]
      - ["Security-testing workflow", "Basic API security checks within a broader development workflow", "Undisclosed", "Capability described; separate monetization not evidenced", "Independent technical guide", "Provide feature adoption, packaging, and incremental delivery cost"]
    notes: "Partial public view: sources support mechanisms and plan gating, but no retained source discloses current realized pricing, revenue mix, or accounting policy."
    claimRefs: [CI001, CI002, CI011, CI014, CI016]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [item, public_value, period_or_basis, confidence, underwriting_treatment]
    rows:
      - ["Revenue model", "Subscription", "Current Multiples profile", "Medium", "Mechanism only; not proof of revenue scale or quality"]
      - ["Enterprise SAML access", "Enterprise plan prerequisite", "HowToHarden guide dated 2026-08-08", "Medium", "Confirms plan gating, not price or realized contract value"]
      - ["ARR", "$120-150M estimate", "At the time of the Economic Times report", "Medium-low", "Reconcile definition and period to the general ledger"]
      - ["User monetization", "Took longer than expected", "Economic Times source report", "Medium", "Request free-to-paid conversion and paid-seat cohorts"]
    notes: "The ARR range and monetization assessment are attributed to people familiar with the company, not audited statements or a company-certified KPI release."
    claimRefs: [CI001, CI004, CI005, CI011]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [metric, public_value, confidence, why_it_matters, diligence_ask]
    rows:
      - ["Gross margin", null, "Unavailable", "Tests delivery scalability and support burden", "Provide GAAP and contribution gross margin by plan"]
      - ["CAC and payback", null, "Unavailable", "Tests enterprise sales efficiency", "Provide fully loaded CAC and cohort payback by segment"]
      - ["Net retention and churn", null, "Unavailable", "Tests expansion and revenue durability", "Provide logo and dollar retention by cohort"]
      - ["Cash and monthly net burn", null, "Unavailable", "Determines financing dependency", "Provide current balance sheet and monthly cash flow"]
      - ["Runway and next-round trigger", null, "Unavailable", "Determines timing and dilution risk", "Provide an 18-month operating plan and minimum-cash covenant"]
      - ["Total funding", "$433M versus $352M", "Conflicting third-party data", "Prevents reliable historical cash reconciliation", "Reconcile cap table, financing documents, and cash receipts"]
      - ["Secondary valuation signal", "30-40% discount to the 2021 primary mark", "Reported by transaction sources", "Indicates repricing but not company liquidity", "Obtain transaction documents and current primary financing terms"]
    notes: "Null means the metric is not disclosed in the retained evidence; funding raised and secondary pricing must not be substituted for cash, burn, runway, or a current primary valuation."
    claimRefs: [CI006, CI007, CI008, CI009, CI015, CI016]
figures:
  - id: FI001
    title: Subscription revenue-to-margin bridge
    type: flow
    summary: >-
      Public evidence supports the endpoints of product use and subscription packaging, while
      conversion, realized revenue, delivery cost, and cash generation remain unquantified.
    data:
      nodes:
        - id: workflow-use
          label: "API workflow use"
          value: "Broad historical adoption"
          note: "Use is not a paid-customer denominator"
        - id: enterprise-adoption
          label: "Enterprise collaboration and controls"
          value: "Capabilities and plan gates observed"
          note: "Paid conversion is undisclosed"
        - id: subscription-contract
          label: "Subscription contract"
          value: "Revenue mechanism reported"
          note: "Billing unit and realized price are undisclosed"
        - id: recurring-revenue
          label: "Recurring revenue"
          value: "$120-150M ARR estimate"
          note: "Third-party estimate with undisclosed definition and period"
        - id: delivery-cost
          label: "Cloud, support, and security delivery"
          value: "Not quantified"
          note: "Security-control and incident-response obligations are visible"
        - id: gross-profit
          label: "Gross profit"
          value: "Not disclosed"
          note: "No margin bridge is public in the retained evidence"
        - id: cash-generation
          label: "Cash generation and runway"
          value: "Not disclosed"
          note: "Funding history and secondary trades do not establish liquidity"
      edges:
        - from: workflow-use
          to: enterprise-adoption
          label: "conversion not disclosed"
        - from: enterprise-adoption
          to: subscription-contract
          label: "pricing not disclosed"
        - from: subscription-contract
          to: recurring-revenue
          label: "recognition policy not disclosed"
        - from: recurring-revenue
          to: delivery-cost
          label: "cost allocation not disclosed"
        - from: delivery-cost
          to: gross-profit
          label: "margin not disclosed"
        - from: gross-profit
          to: cash-generation
          label: "burn and working capital not disclosed"
    approximationNotes: "Conceptual flow only; no conversion rate, accounting bridge, margin, or runway is inferred."
    claimRefs: [CI001, CI002, CI004, CI011, CI013, CI016]
