company:
  name: Assort Health
chapter:
  number: 1
  title: Company Overview
  summary: Assort Health’s public file supports a San Francisco-based, co-founder-led healthcare AI company that appears to have formed in 2023, launched in November 2023, and scaled from a $3.5M 2024 seed to a $120M Series C at a $1.2B valuation by June 2026. The strongest corroborated signals are the 2025-2026 financing chronology, a provider footprint measured in the thousands, more than 190M patient interactions, and revenue-growth claims of 20x in the last 15 months. The main caveats are unresolved 2022-vs-2023 founding timing, incomplete board/control disclosure, and only partial public evidence on privacy and trust controls.
sections:
- id: identity-founding-and-scope
  title: Identity, Founding Timing, and Product Scope
  body: Assort Health’s public identity is coherent on what it sells but not perfectly clean on when to date the company’s origin. The homepage and platform pages consistently frame Assort as an AI patient-access platform spanning scheduling, intake, triage, referrals, and billing across more than 22 specialties, with scale backed by more than 190 million patient interactions. The strongest public headquarters signal is San Francisco via the careers page, while the product-origin story is better documented than the legal-incorporation story. Yahoo Finance and Wilson Sonsini both point to a 2023 founding, and Fierce says the commercial launch came in November 2023. Because the prompt referenced 2022 but the fetched public record repeatedly points to 2023 plus a late-2023 launch window, the safest treatment is to preserve 2022 as unresolved timing rather than invent certainty. The seed announcement and Menlo’s investment essay also show the company was built around specialty-specific call-center
    complexity rather than generic chatbot automation.
