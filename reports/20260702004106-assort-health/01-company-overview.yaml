- id: capital-base-and-scale-signals
  title: Capital Base, Investors, and Scale Signals
  body: 'Assort moved from seed to unicorn valuation in barely more than two years of public operating history. The financing chronology is unusually well corroborated: $3.5 million seed in March 2024 led by Quiet, $22 million Series A in April 2025 taking total raised to $26 million, $76 million Series B in September 2025 taking total to $102 million, and a $120 million Series C in June 2026 at a $1.2 billion valuation pushing cumulative disclosed funding above $222 million. The investor map shows meaningful continuity—Quiet from seed, First Round and Chemistry at A, Lightspeed at B, Menlo at C, with Felicis participating in later rounds. Public scale claims have also become stronger rather than weaker: the company now cites 190 million+ interactions, 62,000 care protocols, 1.6 million decision pathways, 5,000+ providers powered, and high-profile health-system expansion that includes John Muir Health. Those are meaningful signals, but exact headcount, cash, and runway remain undisclosed.'
