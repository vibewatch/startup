- id: leadership-governance-and-control
  title: Leadership, Governance, and Control Visibility
  body: 'The founder story is unusually legible for a young private healthcare-AI company. Public materials consistently identify Jon Wang and Jeffery Liu as founders and co-CEOs, while Menlo and the seed release provide a credible founder-market-fit narrative across clinical training, AI research, healthcare operations, and product engineering. What is less visible is the full governance stack. The September 2025 Series B announcement clearly surfaced one board addition—Lightspeed partner Galym Imanbayev—and one board advisor—former Nuance CEO Paul Ricci. Beyond that, however, the fetched record does not disclose a full board roster, investor control rights, voting thresholds, or other protective provisions. That matters because Assort’s capital formation accelerated rapidly across 2025 and 2026. The public trust surface is similarly partial: privacy, patient-privacy, and BAA pages exist, and HHS plus ABA sources clarify the seriousness of HIPAA and generative-AI governance obligations,
    but the catalog does not expose a deeper public certification pack or privacy-control narrative.'
