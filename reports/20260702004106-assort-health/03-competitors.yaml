- id: moat-durability-and-erosion-risk
  title: Moat Durability, Incumbent Response, and Evidence Gaps
  body: Assort's moat is believable but not secure. The strongest evidence in the fetched set points to specialty-specific workflow memory as the hardest thing to copy quickly; orthopedic triage, workers' compensation logic, iPLEDGE timing, and similar edge cases are not simple chatbot scripts. But the competitive threat is not only another specialty voice startup. Broader suites such as Artera and Notable can absorb adjacent workflows into larger contracts. Horizontal agent platforms such as Syllable or Hyro can move down-market into healthcare-specific templates. Microsoft or Nuance can win on enterprise trust, procurement familiarity, and broader AI roadmaps. Meanwhile, the public evidence base remains incomplete on pricing, neutral accuracy, and head-to-head win rates. The right conclusion is that Assort has a credible differentiation story today, but investors should underwrite active erosion risk from larger or broader platforms rather than assume specialty depth will remain scarce
    forever. In practice, that means diligence should focus less on polished demo quality and more on renewal behavior, specialty-by-specialty expansion, implementation speed, and whether customers are consolidating more workflows onto Assort or spreading them across several vendors.
