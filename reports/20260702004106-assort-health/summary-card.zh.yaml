  topStrengths:
    - Assort 有扎实的融资锚点：2026 年 6 月完成 $120M Series C，估值 $1.2B，公开披露累计融资超过 $222M。
    - 公开产品证据显示，公司已从简单排班扩展成更完整的患者旅程平台，覆盖接诊、触达、转诊、支付和编排。
    - 公司称已处理 190M+ 次交互、沉淀 62,000 条护理协议和 1.6M 条决策路径，15 个月收入增长 20x，显示这家私有工作流 AI 公司近期动能异常强。
    - 对一家私有 health-tech 初创来说，客户证据少见地具体；具名诊所和医疗服务集团公开了等待时长、人力、转化和收入结果。
    - 如果经济性真像叙事那样强，专科工作流深度和向 health-system 扩张给公司留出一条做成耐久企业价值的路径。
  topRisks:
    - 公开资料仍未披露 ARR、毛利率、烧钱速度、CAC 回收期、留存或客户集中度，因此当前估值不能只靠经济性承销。
    - 平台嵌在 PHI 密集的排班和分诊工作流里，HIPAA、隐私、幻觉和输出完整性控制就是主要下行风险。
    - Assort 跨专科、场景和边缘工作流扩张后，部署复杂度会上升，支持成本和实施质量都会承压。
    - 相邻赛道竞争真实且资金充足，包括工作流 AI、患者触达自动化和既有企业医疗平台。
    - 公开记录没有给出完整董事会 / 控制权图景，也缺少 Series C 的详细条款，限制了对治理和优先权栈风险的判断。
  unresolvedGaps:
    - 当前 ARR、毛利率、烧钱速度、runway，以及经审计的 2025/2026 财务报表。
    - 客户留存、NRR / GRR、模块渗透率和头部客户集中度。
    - 2026 年 6 月 Series C 的完整条款清单，包括清算优先权、是否含二级转让，以及对董事会 / 控制权的影响。
    - 相比 Hyro、Artera、Syllable、Notable、Infinitus 和既有 contact-center 替代方案，Assort 的胜负原因和定价韧性。
    - 高复杂度专科和分诊用例中的工作流准确率、升级率和安全表现，还缺少独立证据。
