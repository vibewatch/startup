- id: sizing-lenses-and-contradictions
  title: Sizing Lenses and Contradictory Estimates
  body: 'The allowed evidence set supports a market-sizing discussion, but not a single software TAM. CAQH offers the cleanest independent operating lens: roughly $90B of routine administrative work and about $20B of savings opportunity from further workflow automation. Company and investor sources frame an even broader pain pool at roughly $1.1T of annual administrative burden, which is directionally useful for why the market exists but too broad to treat as software revenue. The fetched GlobeNewswire URL would have supplied a narrower voice-agent market forecast, yet the cached page body is unrelated IMAPS Academy content, so that estimate cannot be validated under the user''s URL constraint. The correct takeaway is not to force agreement where the sources do not agree. Instead, the chapter preserves separate lenses: broad administrative burden, narrower savings opportunity, and a still-undefined patient-access software wedge that needs additional third-party sizing work.'
  claimRefs:
  - CM010
  - CM011
  - CM012
  - CM013
