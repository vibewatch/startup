company:
  name: Assort Health
chapter:
  number: 2
  title: Market Analysis
  summary: 'Assort sells into a narrow but painful market: AI-enabled patient access and front-office automation for complex phone, intake, referral, outreach, and payment workflows. The best public evidence does not support one clean TAM; instead it preserves multiple lenses ranging from CAQH''s $20B savings opportunity and $90B routine-administration cost base to broader investor-framed administrative-burden numbers, while a fetched GlobeNewswire URL cannot be validated because its cached body resolves to unrelated content. Demand is strongest among specialty groups, health systems, FQHCs, and MSO-style operators facing labor shortages, call abandonment, and referral leakage, but adoption remains constrained by compliance, trust, integration depth, and workflow complexity.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: 'Assort should be evaluated inside a narrow patient-access automation wedge, not the whole healthcare AI landscape. The relevant workflows are the phone-heavy, front-office jobs that determine whether a patient reaches the right appointment with the right prep and follow-through: scheduling, intake, triage, referrals, reminders, outreach, billing questions, and related routing. The fetched set repeatedly distinguishes this work from generic chatbot software, broad contact-center tooling, and clinical AI because specialty access depends on real-time EHR connectivity, insurance and referral logic, and provider-specific rules. That boundary matters because the dominant substitutes are still human front desks, outsourced call centers, legacy IVR, portals, and reminder products, all of which solve slices of the workflow but usually not the whole specialty journey. The phone remains core because complex visits, referral chains, and older or sicker populations still pull demand back to
    live interactions even after digital-front-door investments.'
