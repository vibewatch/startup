  - - FQHC or community clinic
    - Operations leadership
    - Front desk and contact-center staff
    - Access or care-navigation budget
    - Access, multilingual calls, patient navigation
    - Need to answer more patients without proportional headcount
  - - MSO / multi-site specialty operator
    - Platform operations or shared-services leader
    - Central call center and referral staff
    - Shared-services budget
    - Referral recovery, schedule utilization, overflow handling
    - Leakage across many sites and specialties
  - - Single-site complex specialty practice
    - Owner-operator or practice manager
    - Small phone team
    - Owner-controlled operating budget
    - Phone coverage, after-hours access, refill and message routing
    - Voicemail backlogs or missed-call revenue loss
  - - Academic or tertiary specialty center
    - Access leadership with IT partnership
    - Central access + subspecialty coordinators
    - Hospital or physician-group operations budget
    - Complex new-patient intake and routing
    - Protocol complexity that portals or IVR cannot absorb
  notes: Buyer ownership is usually cross-functional even when one leader signs the contract; the same access pain shows up as labor cost, patient experience loss, and revenue leakage depending on the organization.
