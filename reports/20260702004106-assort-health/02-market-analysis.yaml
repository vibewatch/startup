- id: buyers-users-and-budget-owners
  title: Buyers, Users, and Budget Owners
  body: 'The buyer map is broader than a single call-center software budget. Assort''s own materials and 2026 news coverage point to specialty groups, provider groups, health systems, community-based organizations, and academic medical centers, while other fetched Assort materials explicitly name FQHCs and show MSO-style operators using similar workflows. SENTA demonstrates the MSO archetype most clearly: a multi-practice ENT and allergy operator trying to stabilize call-center efficiency and referral conversion. South Shore Orthopedics shows the same access problem inside a growing specialty practice that then joined a larger orthopedic MSO. The hands-on users are schedulers, referral coordinators, call-center teams, and front-office staff, but budget ownership appears shared across operations leaders, finance-minded executives, and practice leadership because the purchase logic blends patient experience, labor capacity, revenue capture, and service-level reliability rather than a pure
    IT tooling decision.'
  claimRefs:
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
  - CM021
