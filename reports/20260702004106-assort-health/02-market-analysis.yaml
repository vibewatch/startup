callouts:
- calloutType: insight
  title: Phone-first access remains the practical market entry point
  body: The strongest evidence across the fetched set is not that providers want more portals; it is that complex specialty demand still lands on the phone, so the most investable wedge is automation of the channel patients already use.
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM030
- calloutType: risk
  title: Headline market numbers are easy to overstate
  body: CAQH savings estimates, investor descriptions of administrative burden, and voice-agent market headlines are not interchangeable. Until neutral sources isolate the patient-access software wedge, valuation work should rely on constrained workflow logic rather than a broad healthcare-AI TAM.
