- id: satisfaction-durability-and-repeat-visibility
  title: Satisfaction and throughput improvements are visible, but durability metrics are largely absent
  body: 'Public satisfaction and throughput metrics are plentiful enough to show that customers believe something improved. Annapolis, South Shore, Peninsula, and Chesapeake all publish patient-satisfaction outcomes, and several stories disclose specific baseline pain like abandoned calls, long holds, or missed urgent cases. There is also enough call-volume evidence to conclude that the product is being used at production scale inside at least some accounts: South Shore and NCRVA both talk about roughly 10,000 monthly calls, while Chesapeake and SENTA describe large multi-site or multi-provider operations. The gap is what happens after the first success story. No reviewed source disclosed contract length, renewal timing, churn, NRR, GRR, or revenue concentration by customer. Even the strongest metrics usually lack the denominator detail an underwriter would want: cohort size, time window, and how much of the gain came from demand recovery versus preexisting patient need. So the durability
    read is mixed: there is enough proof to believe real use and real value exist, but not enough to model stickiness or account quality with confidence.'
  claimRefs:
  - CU014
  - CU016
  - CU023
  - CU025
  - CU031
  - CU038
  - CU042
  - CU048
  - CU049
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-and-evidence-quality
  title: The main underwriting risks are evidence concentration, renewal opacity, and customer-story dependence
  body: 'Three risks matter more than the individual headline metrics. First, the proof base is still concentrated in company-published stories, which means the reader has to separate “there is real adoption” from “every cited ROI number is independently audited.” Second, concentration risk is unresolved. The public set spans many named practices, but it does not disclose revenue mix, largest-customer exposure, or whether big enterprise or health-system wins account for a disproportionate share of bookings. Third, renewal and contract durability are essentially invisible. That matters because patient-access tooling can look great during the initial backlog-clearing phase and still disappoint later if workflow drift, staff distrust, or procurement hurdles slow expansion. The counterpoint is that the story is not a single-logo mirage: there are multiple specialties, an FQHC, MSO-backed practices, and evidence that both inbound and outbound workflows are live. The chapter conclusion is therefore
    constructive but cautious. Assort has real customer proof; it just has much better public evidence on acquisition and workflow fit than on renewal quality or concentration exposure.'
