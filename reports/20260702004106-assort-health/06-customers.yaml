  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: renewal-metrics
    missingEvidence: NRR, GRR, logo churn, contract length, and renewal history across public customer accounts.
    whyItMatters: Strong first-wave access results do not prove the product stays sticky after backlog clearing and operational normalization.
    diligencePath: Request cohort renewal tables and top-20 customer revenue movement by year.
    relatedQuestionRefs:
    - QU014
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Largest-customer exposure by ARR, provider count, and patient-interaction volume.
    whyItMatters: The public story spans many logos, but a small number of accounts could still dominate bookings or patient traffic.
    diligencePath: Request customer concentration schedule plus backlog by segment and setting.
    relatedQuestionRefs:
    - QU019
    - QU023
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: Third-party audits or customer references validating the biggest published ROI metrics.
    whyItMatters: Most of the headline metrics are company-published, which raises the risk of selective disclosure or denominator bias.
    diligencePath: Request direct customer reference calls and exported KPI dashboards for SENTA, Chesapeake, and Annapolis.
    relatedQuestionRefs:
    - QU016
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: module-attach-rates
    missingEvidence: Share of customers using both inbound and outbound modules, plus expansion sequencing by cohort.
    whyItMatters: Cross-sell depth is central to the platform thesis and switching-cost argument.
    diligencePath: Request attach-rate, gross module count, and module-expansion timing by cohort.
    relatedQuestionRefs:
    - QU017
    - QU018
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A full public export of every named production account with consistent outcome fields.
    whyItMatters: The named-customer table is representative but not exhaustive, so selection bias remains possible.
    diligencePath: Request a complete customer-reference roster with go-live date, specialty, setting, modules, and renewal status.
    relatedQuestionRefs:
    - QU004
    relatedTableRefs:
    - TU003
