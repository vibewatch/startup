- id: named-customer-proof-and-measured-outcomes
  title: Named proof is strongest where a customer story exposes baseline pain, deployment context, and a measurable outcome
  body: 'The most investable part of the customer chapter is not the logo list but the before-and-after math in named stories. SENTA is the clearest top-line proof point because it combines footprint, operational pain, revenue capture, labor avoidance, and referral conversion in one record. Annapolis is the strongest independent corroboration because Healthcare IT News repeated the hold-time and satisfaction improvements from an external venue. Chesapeake is useful because it extends the story into an FQHC and shows provider breadth, multi-specialty scope, and financial impact. Orthopedic customers add texture rather than scale: BBJI, Barrington, South Shore, and Peninsula all describe severe pre-Assort access bottlenecks and meaningful post-deployment relief. MDCS and NCRVA are especially important because they show that the platform is not only for simple scheduling; both cases hinge on specialty-specific complexity. Across the set, the public record does prove that customers are using
    the product in live workflows. It does not, however, prove that every metric is independently audited or that each customer has renewed into a durable, multi-year account.'
  claimRefs:
  - CU004
  - CU008
  - CU010
  - CU011
  - CU017
  - CU020
  - CU023
  - CU025
  - CU034
  - CU039
