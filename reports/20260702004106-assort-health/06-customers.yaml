    - Broadens fit beyond pure specialty surgery workflows
    - Customer count and ARR by segment are unknown
  - - FQHC and high-acuity specialty settings
    - Operations leadership buys; access teams use; payer mix is complex
    - Multi-specialty triage and access recovery
    - Chesapeake and NCRVA are named
