callouts:
- calloutType: strength
  title: This is not just a logo wall; several customer stories expose real before-and-after math
  body: SENTA, Annapolis, Chesapeake, Barrington, South Shore, and NCRVA all publish concrete baseline pain plus a live operational outcome. That is enough to move the customer story past pure marketing.
  claimRefs:
  - CU008
  - CU023
  - CU031
  - CU034
  - CU041
- calloutType: risk
  title: Renewal quality and concentration are still largely invisible
  body: The public record says a great deal about recovered demand and patient satisfaction, but almost nothing about churn, NRR, contract length, or top-customer revenue exposure. That is the main underwriting gap in this chapter.
  claimRefs:
  - CU048
  - CU049
- calloutType: insight
  title: The deepest proof sits in specialty workflows where scheduling is hardest
  body: Orthopedics, dermatology, retina, and FQHC settings are not easy scheduling environments. The fact that Assort's best stories cluster there suggests the platform's value proposition is workflow depth, not generic call deflection.
  claimRefs:
  - CU020
  - CU034
  - CU036
  - CU046
  - CU052
