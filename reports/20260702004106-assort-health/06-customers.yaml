company:
  name: Assort Health
chapter:
  number: 6
  title: Customers
  summary: 'Assort Health has real customer proof, especially in specialty practices and an FQHC context, and the public 2026 record suggests adoption breadth has moved well beyond a handful of pilots. Named stories such as SENTA, Annapolis, Chesapeake, MDCS, NCRVA, Barrington, and South Shore expose meaningful before-and-after access outcomes, while independent coverage corroborates a narrower subset of those metrics. The unresolved risks are evidence quality, renewal opacity, and concentration: public sources are much stronger on first-wave operational wins than on churn, contract durability, or largest-customer exposure.'
sections:
- id: segment-map-and-adoption-surface
  title: The customer set is broad across specialty practices, FQHCs, and MSO-backed groups, but the proof is uneven by segment
  body: 'Assort''s customer story is strongest in the operational middle of healthcare rather than in consumer marketing or giant enterprise logos. The public set shows ENT and allergy, orthopedics, dermatology, retina, primary care, multispecialty groups, and an FQHC footprint, which is enough to establish segment breadth. Assort also publishes a dedicated urology workflow page describing recall scheduling, PSA pathway management, procedure routing, and kidney-stone follow-up, which widens the apparent specialty target surface even though it does not identify a named live customer. It also shows a real temporal step-up in provider footprint: the April 2026 Activate coverage cites 1,000-plus providers, while Becker''s June 2026 outreach page says the technology is now in production across more than 5,000 providers. That is meaningful adoption evidence, even though the exact split across inbound versus outbound products is not disclosed. At the same time, the customer record is still heavily curated by the company itself. Public proof is mostly customer stories and platform quotes, then supplemented by a small number of independent articles that corroborate the broad direction rather than audit every metric. The right read is that Assort has moved
    well beyond a slideware customer thesis, but the public record remains better at proving breadth and pain-point fit than at proving durable account economics.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU012
  - CU020
  - CU039
  - CU044
  - CU046
  - CU053
  - CU052
