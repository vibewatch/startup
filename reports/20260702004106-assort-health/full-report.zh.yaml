        title: 规模测算视角与互相矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              允许使用的证据集能支撑市场规模讨论，但不能支撑单一软件 TAM。CAQH 给出最干净的独立运营视角：常规行政工作约 $90B，进一步工作流自动化约有 $20B 节省机会。公司和投资人来源把痛点池讲得更宽，约为每年
              $1.1T 行政负担；这对解释市场为什么存在有方向性帮助，但过宽，不能当作软件收入。抓取的 GlobeNewswire URL 原本应提供更窄的语音智能体市场预测，但缓存页正文是无关的 IMAPS Academy
              内容，所以在用户 URL 约束下无法验证该估计。正确结论不是强行让来源对齐。相反，本章保留三套视角：宽泛行政负担、更窄的节省机会，以及仍未定义清楚、需要更多第三方测算的患者准入软件楔子。
