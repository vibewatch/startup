chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立时间与产品范围
        blocks:
          - type: paragraph
            body: >-
              Assort Health 的公开身份在“卖什么”上很一致，但在公司起点应定在哪一年上并不完全干净。官网和平台页面持续把 Assort 定位为 AI 患者准入平台，覆盖预约、信息采集、分诊、转诊和账单，横跨
              22+ 个专科，并用 190 million+ 次患者互动证明规模。最强的公开总部信号来自招聘页的 San Francisco；相比法律注册故事，产品起源故事更容易核实。Yahoo Finance 和
              Wilson Sonsini 都指向 2023 年创立，Fierce 则称商业化上线在 2023 年 11 月。由于提示词提到 2022 年，但抓取的公开记录反复指向 2023 年加 2023
              年末上线窗口，最稳妥的处理是把 2022 年保留为未解决的时间口径，而不是编造确定性。种子轮公告和 Menlo 的投资文章也显示，公司一开始瞄准的是专科呼叫中心复杂度，而不是通用聊天机器人自动化。
