              10,000 通电话，Chesapeake 和 SENTA 则描述大型多点位或多医疗服务提供者运营。缺口在首个成功故事之后。没有已审阅来源披露合同期限、续约时间、流失、NRR、GRR
              或按客户划分的收入集中度。即便最强指标，通常也缺少承销人想要的分母细节：分群规模、时间窗口，以及收益中有多少来自需求恢复，而不是原本就存在的患者需求。因此，耐久性判断是混合的：证据足以相信存在真实使用和真实价值，但不足以有信心建模粘性或账户质量。
