companyProfile:
  summary: >-
    Assort Health 是一家私营医疗 AI 公司，面向专科诊所、多点位医疗集团、FQHC
    和卫生系统，做以语音为主、覆盖多渠道的患者准入自动化。公开材料显示，平台从入站预约很快扩到信息采集、外联、转诊、支付和运营编排；公司把它包装成统一的患者旅程层，并称其训练在 190M+ 次患者互动之上。公司截至 2026 年 6 月
    C 轮后融资超过 $222M，估值 $1.2B；公开客户证据支持部署宽度，但经济性披露仍很薄。
