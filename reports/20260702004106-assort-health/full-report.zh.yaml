      - number: '7.2'
        title: 工作流质量、安全与集成风险
        blocks:
          - type: paragraph
            body: >-
              最难的风险在工作流自动化与真实临床细微差别相遇的地方。Assort 自有页面强调，初级保健路由可能涉及 1,000 多种症状变体、胸痛升级、Medicare
              时点规则和支付方特定约束。投资人和产品材料同样把公司描述成在处理处方、检验结果、转诊和主动外联，而不只是接简单入站电话。更新的专科页面又把图景扩到 ER
              后随访和影像预约、神经科亚专科路由和输注节奏、泌尿科手术规则、肿瘤治疗周期协调，以及儿科、初级保健和 OB-GYN 的演示通话流程。这种宽度解释了上行空间，但也意味着一条错误规则、过期协议、差的 EHR
              同步或弱交接，都会造成下游排期错误、患者不满或患者安全升级。客户故事证明等待时间和转化率确有改善，但获准缓存来源没有一个发布经审计的错约、错路由或不安全分诊率。这是关键运营缺口。缓释故事——带上下文的人工交接、EHR
              任务、绑定 EHR 数据的外联，以及从协议历史生成测试——方向上可信，但公司仍需要工作流级 QA 证据，投资人才能把风险承销为成熟，而不是只是营销得好。
