      - number: '7.4'
        title: 缓释、监控与终止标准
        blocks:
          - type: paragraph
            body: >-
              公开记录确实支持一套缓释栈，只是还没有把闭环补齐。Assort 可以指向大型协议语料库、带上下文的人工交接、EHR 原生任务创建、绑定 EHR
              数据的主动外联，以及那些称部署后等待时间、劳动产能和预约转化明显改善的点名客户。这些都是有意义的优势。但实际承销问题是，当公司更深入进入卫生系统、更宽行政工作流和更严格隐私 /
              治理预期时，这些优势是否仍耐用。因此，投资人应监控一小组会打破投资论点的指标：经审计的错误或升级指标，隐私 / BAA
              文件的清晰度，卫生系统部署至少能达到专科诊所部署水平的证明，医疗服务提供者数量增长反映的是宽平台使用而非窄模块的证据，以及任何迹象显示法律或安全审查者要求超过公开文件内容、从而拉长采购摩擦。如果管理层不能干净回答这些要求，当前叙事就应被视为比增长标题暗示的更脆弱。
