  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、隐私与监管风险
        blocks:
          - type: paragraph
            body: >-
              Assort 的产品触及门诊医疗最敏感的边缘：患者身份、症状、资格、转诊、随访时点，以及往往需要落进 EHR 的通话结果。法律基线不是可选项，所以这很重要。HHS 表示，维护或传输 ePHI
              的系统必须满足行政、物理和技术保障措施；近期医疗 AI 指引还认为，与 ePHI 互动的 AI
              资产应被盘点，并纳入实时风险分析。公开产品故事横跨信息采集、药物续方、检验结果、支付和多模态外联，因此隐私面比经典预约机器人更宽。公开合规评论还显示，即使产品没有作为医疗器械营销，FTC、DOJ
              和其他机构也可能通过宣传主张、隐私和偏见理论塑造责任。Assort 大概率受益于所在类别 ROI
              紧迫，但如果买方无法在营销页面之外验证业务伙伴条款、患者告知、模型治理或事故处理，同样的紧迫性也不会让它免于采购拖延。
