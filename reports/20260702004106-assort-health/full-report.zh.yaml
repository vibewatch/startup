      - number: '7.3'
        title: 商业、竞争与模型风险
        blocks:
          - type: paragraph
            body: >-
              公开证据强烈显示 Assort 在解决痛点问题，但还没有证明业务能免受集中度或竞争影响。证据集仍集中在专科集团、门诊诊所和外联密集用例上，即使管理层和媒体报道已经把公司推向更大卫生系统部署。Assort
              自己更新的转诊管理和专科信息采集指南也强化了这种集中，因为它们仍把重心放在按紧急程度路由、授权校验、防止错约和 EHR/PMS
              集成上，而不是宽泛的医院企业标准化。这是一个真实的扩张步骤，而不只是同一笔销售的放大版。与此同时，竞争集合比显而易见的创业同行更宽。Hyro 宣传卫生系统牵引力和可衡量的弃呼节省；Artera 声称在专科和
              EHR 中有 11 年装机基础；Syllable 营销生产级在线率和外联 ROI；Notable 和 Infinitus 覆盖相邻的准入、收入周期和报销工作流。在这个背景下，Assort
              的公开经济性仍很薄。投资人能看到融资、增长速度和医疗服务提供者数量主张，但看不到当前 ARR、利润率、留存、客户集中度或全平台渗透率。这让模型依赖持续执行和持续融资，而不是已经证明的财务耐久性。
