              里程碑记录足够支撑后续章节，但必须带着明确保留事项阅读。Assort 的官方记录显示，公司起点是医疗呼叫中心 AI 方案，随后很快扩成患者旅程平台，覆盖支付、转诊、文档处理和卫生系统扩张。Menlo 的文章和
