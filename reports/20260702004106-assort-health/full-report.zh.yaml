  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值与真正坐实的事实
        blocks:
          - type: paragraph
            body: >-
              给 Assort 做估值，第一步是克制：先分清哪些事实真的坐实。干净事实并不多。Assort 于 2026 年 6 月 24 日宣布 $120 million Series C，估值 $1.2
              billion；多家独立媒体重复了同一估值，并称累计融资超过 $222 million。公开来源还称，公司过去 15 个月收入增长
              20x，平台范围也已远超入站预约。缺口同样关键。获准缓存的来源没有披露当前收入、ARR、毛利率、NRR、客户集中度或条款清单的真实质量。因此，当前价格是真实市场事件，但还不是可以完整承销的内在价值答案。实务上，投资人可以把这轮
              $1.2 billion 视为当前出清价；但没有更多公司数据，无法诚实地做细粒度倍数论证，也不能把这个数字说成显然便宜。
