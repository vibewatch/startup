      - number: '1.3'
        title: 资本基础、投资人与规模信号
        blocks:
          - type: paragraph
            body: >-
              Assort 用略超两年的公开运营历史，从种子轮走到独角兽估值。融资时间线得到异常充分的交叉印证：2024 年 3 月 Quiet 领投 $3.5 million 种子轮；2025 年 4 月 $22
              million A 轮，累计融资达 $26 million；2025 年 9 月 $76 million B 轮，累计达 $102 million；2026 年 6 月 $120 million C 轮，估值
              $1.2 billion，把累计披露融资推高到 $222 million 以上。投资人图谱也显示出明显延续性——Quiet 从种子轮进入，First Round 和 Chemistry 在 A
              轮进入，Lightspeed 在 B 轮进入，Menlo 在 C 轮进入，Felicis 参与后续轮次。公开规模主张也在增强而不是减弱：公司现在称有 190 million+ 次互动、62,000
              个护理协议、1.6 million 条决策路径、5,000+ 名医疗服务提供者被覆盖，并扩进包括 John Muir Health
              在内的高知名度卫生系统。这些都是有意义的信号，但确切员工数、现金和资金续航仍未披露。
