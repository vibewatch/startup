        title: 能力、打包与信任对比
        blocks:
          - type: paragraph
            body: >-
              分析一旦从泛泛的 AI 智能体主张进入渠道宽度、工作流深度、打包和信任细节，竞争姿态就迅速分化。Assort 的骨科和皮肤科页面显示，产品围绕协议复杂度设计；Syllable 和 Hyro
              更适合被看作横向沟通或编排层。Notable 和 Artera 更像套件，因为它们在患者准入用例旁边同时讲相邻工作流和财务结果。定价证据明显稀薄：抓取的同行网站没有发布标准化公开价目表，连 Hello
              Patient
              的融资报道也只是给出规模数据，而不是可一一对比的打包基准。这个缺席本身就有竞争意义，因为它意味着买方评估很可能更多取决于工作流适配证明、实施风险和客户背书能力，而不是透明的公开价目表。信任同样重要，因为
