        title: 财务结论与阻断项
        blocks:
          - type: paragraph
            body: >-
              公开财务结论是正面的，但信心仍只能算中等。Assort
              看起来有一个有吸引力的经常性工作流平台，对私营公司来说客户结果证据异常强，近期资本基础也得到充分支持。这个组合足以说明，公司大概率有真实收入牵引力，并且有走向大型企业扩张的可行路径。但这还不足以完成承销。公司没有公开披露
              ARR、GAAP 收入、毛利率、现金、burn、资金续航、债务、CAC payback、NRR 或 GRR。因此，公开经济性叙事是不对称的：我们能看到它为客户创造价值的案例，却看不到 Assort
              在多大程度上把这些价值捕获为持久、高毛利、经常性收入。投资人应把本章结论视为方向上建设性，但仍受制于管理层对合同机制、留存、流动性规划和资产负债表韧性的披露。这仍是今天的核心承销阻断项。
