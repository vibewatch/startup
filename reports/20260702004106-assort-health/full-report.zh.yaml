      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              采用驱动因素具体且偏近期：劳动力短缺、前台流失、漏接电话、转诊积压、爽约，以及不大幅加人就无法提供 24/7 准入。抓取材料中的第三方和客户案例证据显示，当 AI
              系统缩短等待时间、提高转化、在不增加人手的情况下填满排班，真实 ROI 是可能的。但约束同样真实。HIPAA 隐私和安全义务让合规没有可选空间。部署质量也很关键，因为差的 EHR
              集成、弱交接或浅层专科逻辑，可能制造错约和返工，而不是节省。Assort 自己的语音 AI 文章引用 Gartner 关于智能体式 AI
              项目取消风险高的观点，提醒我们兴趣不等于持久采用。最大的尽调缺口仍是中立定价基准、分客群预算和独立渗透率数据；这些信息公开前，估值应依赖狭窄工作流楔子和已观察到的运营痛点，而不是英雄式大
              TAM。买方还需要务实的落地顺序，因为第一笔预算通常跟着基线痛点最清楚、集成路径最容易、ROI 证据最站得住的工作流走，而不是跟着最宽的 AI 转型叙事走。
