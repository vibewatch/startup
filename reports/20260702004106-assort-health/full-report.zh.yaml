      - number: '2.3'
        title: 买方、用户与预算负责人
        blocks:
          - type: paragraph
            body: >-
              买方地图比单一呼叫中心软件预算更宽。Assort 自有材料和 2026 年新闻报道指向专科集团、医疗服务集团、卫生系统、社区型组织和学术医疗中心；其他已抓取 Assort 材料还明确点名 FQHC，并展示了类似
              MSO 的运营方在使用相近工作流。SENTA 最清楚地展示了 MSO 原型：一个多诊所 ENT 和过敏业务运营方，试图稳定呼叫中心效率和转诊转化。South Shore Orthopedics
              展示了同一个准入问题如何出现在成长中的专科诊所里，随后该诊所又加入更大的骨科
              MSO。一线用户是排期员、转诊协调员、呼叫中心团队和前台员工；但预算归属看起来由运营负责人、偏财务的高管和诊所领导共同承担，因为购买逻辑混合了患者体验、人力产能、收入捕获和服务水平可靠性，而不是纯 IT
              工具决策。
