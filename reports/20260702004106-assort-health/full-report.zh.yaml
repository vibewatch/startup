  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              评估 Assort 时，应把它放在狭窄的患者准入自动化楔子里，而不是整个医疗 AI
              版图里。真正相关的工作流，是电话密集、由前台承担、决定患者能否带着正确准备和后续安排去到正确预约的任务：预约、信息采集、分诊、转诊、提醒、外联、账单问题以及相关路由。抓取材料反复把这类工作和通用聊天机器人软件、宽泛呼叫中心工具、临床
              AI 区分开，因为专科准入依赖实时 EHR 连接、保险和转诊逻辑，以及医疗服务方特定规则。这个边界重要，因为主导替代方案仍是人工前台、外包呼叫中心、传统
              IVR、患者门户和提醒产品；它们能解决工作流切片，但通常解决不了完整专科旅程。电话仍是核心渠道，因为复杂就诊、转诊链条，以及年长或病情更重的人群，即使在数字前门投入之后，仍会把需求拉回实时互动。
