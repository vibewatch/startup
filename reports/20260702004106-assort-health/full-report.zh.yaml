      - number: '4.2'
        title: 牵引力与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              相比公司披露的 P&L，Assort 的公开牵引力证据在客户结果上强得多。平台页宣称每 100 名医疗服务提供者年收入 $3.3 million、平均患者满意度 4.3/5；客户页称 Assort 覆盖
              5,000+ 名医疗服务提供者；Activate 发布则称该外联产品已有 1,000+ 名医疗服务提供者上线。管理层还公开说过过去 15 个月收入增长 20x。更丰富的证据来自案例研究：Annapolis
              报告劳动产能增长 220%、等待时间缩短 75%；SENTA 提到捕获 $1.3 million 预约收入，并避免 $400K+ 人工成本；Michigan Orthopedic 提到新增 $2.3
              million 收入、预约量提升 5%；Chesapeake 提到 $1M+ 新收入和 50% 产能增长。独立媒体至少部分印证了 Annapolis
              的结果故事。这些都是收入质量和销售效率的有意义代理指标，但仍是客户层面的结果证明，而不是披露过的全公司利润率模型。
