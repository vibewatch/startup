      - number: '8.3'
        title: 为什么价格仍显偏贵
        blocks:
          - type: paragraph
            body: >-
              反对当前价格的理由，不是 Assort 没有动能；而是公开档案仍把太多经济变量和风险变量藏在水下。竞争者并非纸面威胁。Hyro 宣传医疗系统成果，Artera 声称在数千家医疗服务提供方组织中拥有 11
              年装机基础，Syllable 主打生产级可用性和外呼 ROI，Notable 与 Infinitus 也显示，相邻流程 AI 正从准入扩到收入周期和报销。这个品类足够有吸引力，已经吸引多家可信玩家，Assort
              轻松长进估值的概率因此降低。合规和治理同样会压住下行情景，因为产品承载 PHI 密集、预约敏感的流程。没有公开 ARR、利润率或留存数据，投资人无法判断 Assort
              是否足够具备软件可扩展性，能支撑持久溢价；还是支持成本、采购摩擦和流程 QA 最终会挤压叙事。
