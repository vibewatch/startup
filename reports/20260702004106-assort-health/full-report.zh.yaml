      - number: '5.4'
        title: 主要技术风险是 PHI 处理、幻觉或误路由，以及未披露的保障层
        blocks:
          - type: paragraph
            body: >-
              信任是营销记录比工作流记录更薄的地方。好消息是，产品显然运行在 HIPAA 义务明确的区域；外部来源也把这些期待具体化：电子 PHI、隐私约束和多机构审查，是任何负责预约、信息采集或临床问题路由的 AI
              智能体的入场券。Assort 也有公开 BAA、隐私政策和患者隐私政策端点，至少显示它知道信任面在哪里。但公开缓存对投资人或买方在承销临床或企业级风险前想看的细节仍很弱。没有已审阅来源披露 SOC 2 或 ISO
              27001 状态、模型供应商依赖、幻觉率测量、同步延迟数据，或量化的回滚 / 错误处理率。ABA、Censinet、Protecto 和 Out-Of-Pocket
              的独立风险框架进一步说明这些遗漏为什么重要：如果升级控制薄弱，生成式系统可能误处理 PHI、隐藏边缘案例失败，或制造欺骗性的信心。Assort 看起来比通用语音 AI 同行更贴近工作流，但困难专科工作流和 PHI
              密集交接仍需要超出公开产品文案的尽调。
