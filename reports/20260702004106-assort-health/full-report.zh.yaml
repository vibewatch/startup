  - id: FO001
    title: Assort Health 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 公开记录显示，公司从 2023 年创立信号到 2026 年独角兽融资推进很快；治理和医疗体系里程碑已有明确记录，但注册成立时间仍未解决。
    data:
      items:
        - label: 创立信号
          detail: Yahoo Finance 和 Wilson Sonsini 都指向 Jon Wang 与 Jeffery Liu 于 2023 年创立公司。
          date: '2023'
          tone: positive
        - label: 商业发布
          detail: Fierce 将 Assort 的发布时间定在 2023 年 11 月。
          date: 2023-11
          tone: positive
        - label: 种子轮
          detail: $3.5M，由 Quiet Capital 领投。
          date: 2024-03
          tone: positive
