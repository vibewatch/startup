              尽管核心承销指标没有披露，资本充足性看起来方向上较强。Assort A 轮融资 $22 million，仅数月后 B 轮融资 $76 million，又以 $1.2 billion 估值完成 $120
              million C 轮，把公开累计融资推到 $222 million 以上。这些轮次不仅得到公司新闻稿和行业媒体印证，也得到 Wilson Sonsini 交易通知强化。公开资金用途表述指向团队增长、Assort
              OS 开发和更宽的患者旅程扩张。上行市场叙事也重要：Becker’s 和 Mobi 都说 Assort 正在进入社区型组织和学术医疗中心，包括 John Muir
              Health。尽管如此，公司处理的患者准入工作流会触及 ePHI、保险和支付数据，因此 HIPAA 安全义务和更宽的生成式 AI 治理要求形成真实的成本底线。没有披露
