              比单个大标题指标更重要的是三类风险。第一，证据基础仍集中在公司发布的故事里，读者必须区分“确有真实采用”和“每个引用的 ROI
              数字都经过独立审计”。第二，集中度风险未解决。公开材料横跨许多点名诊所，但没有披露收入结构、最大客户敞口，或大型企业 /
              卫生系统拿单是否贡献了不成比例的签约额。第三，续约和合同耐久性基本不可见。这很重要，因为患者准入工具在最初清理积压需求阶段可以表现很好，但如果后续工作流漂移、员工不信任或采购阻力拖慢扩张，也可能让人失望。反面证据是，这个故事不是单一客户幻象：有多个专科、一个
