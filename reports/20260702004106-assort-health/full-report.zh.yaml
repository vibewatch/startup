        title: 收入模式与模块宽度
        blocks:
          - type: paragraph
            body: >-
              Assort 的公开财务故事从产品宽度开始，而不是从明确价格表开始。公司营销的是连续的患者旅程平台，横跨预约、分诊、信息采集、外联、转诊和支付解决；各单页描述的是接入 EHR
              的工作流自动化，而不是咨询很重的实施项目。因此，最合理的公开解读是：它是绑定患者准入工作流的经常性软件或与使用量挂钩的模式。产品页反复强调全天候量级处理、直接写入
              EHR、实时资格校验和出站跟进，这些都像可货币化的经常性模块。公开文件没有给出的信息同样重要：看不到官方公开标价、模块化 SKU
              矩阵，也看不到公开合同原型。因此，定价只能从工作流深度和结果主张中推断，而不能直接从公开价目表观察到。这样的证据足以支持一个“很可能是 SaaS 加使用量”的判断，但不足以承销实际定价权或折扣行为。
