  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Assort 对外呈现的财务故事，是一个工作流平台：把患者接入量和运营复杂度转化为持续性软件模块和客户 ROI。
    data:
      nodes:
        - id: inbound
          label: 入站接入痛点
          detail: 高通话量、长等待时间和排期复杂度，会催生尖锐的工作流需求。
        - id: modules
          label: 工作流模块
          detail: 排期、分诊、患者资料采集、外联、转诊和支付处理，作为连接式产品出售。
        - id: ehr
          label: 系统嵌入
          detail: 直接写回 EHR、创建任务和同步数据，会加深工作流依赖。
        - id: roi
          label: 客户 ROI
          detail: 收入捕获、缩短等待、更高产能和更好满意度，支撑客户付费意愿。
        - id: expand
          label: 扩张路径
          detail: 外联、支付和医疗系统场景会拓宽合同范围。
        - id: revenue
          label: 经常性收入
          detail: 公开资料最能支撑的推断，是经常性 SaaS 或按使用量计费，而不是一次性服务。
      edges:
