              当产品文案离开泛泛的“医疗 AI”语言，展示真实排期员或准入团队会在意的专科约束时，Assort 的可信度上升。骨科材料记录了急性损伤路由、工伤赔偿信息采集、术后 global-period
              逻辑，以及和影像绑定的预约。皮肤科材料展示了美容与医疗路由、iPLEDGE 窗口、Mohs 协调和重复美容召回。眼科和 FQHC 页面点名具体工作流表面，并列出明确 EHR
