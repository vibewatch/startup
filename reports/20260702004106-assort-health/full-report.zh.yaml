      - number: '3.4'
        title: 护城河耐久性、既有厂商反应与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Assort 的护城河可信，但还不稳固。抓取材料中最强的证据指向专科工作流记忆，这是最难快速复制的部分；骨科分诊、工伤赔偿逻辑、iPLEDGE
              时间窗口和类似边缘案例，并不是简单的聊天机器人脚本。但竞争威胁不只来自另一家专科语音创业公司。Artera、Notable 这类更宽套件可以把相邻工作流吸收到更大的合同里。Syllable 或 Hyro
              这类横向智能体平台可以向下进入医疗专用模板。Microsoft 或 Nuance 可以靠企业信任、采购熟悉度和更宽的 AI
              路线图取胜。与此同时，公开证据在定价、中立准确率和正面交锋胜率上仍不完整。正确结论是：Assort
              今天有可信的差异化故事，但投资人应承销来自更大或更宽平台的主动侵蚀风险，而不是假设专科深度会永远稀缺。落到尽调上，应少看精修演示质量，多看续约行为、逐专科扩张、实施速度，以及客户是在把更多工作流整合到
