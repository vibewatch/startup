  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局、直接同行与替代品
        blocks:
          - type: paragraph
            body: >-
              读 Assort 竞争格局最干净的方式，是把直接的患者准入工作流同行，与更宽的平台或既有替代方案拆开。抓取材料里的直接同行，是那些销售 AI 驱动患者沟通或准入工作流、覆盖语音及相邻渠道的厂商，尤其是
              Syllable、Notable、Hyro、Artera 和 Hello Patient。Infinitus
              也重要，但更像相邻的行政电话自动化平台，而不是纯粹面向医疗服务集团前台的竞争者。第二层包括既有和现状替代品：Microsoft 或 Nuance、EHR 排期模块、患者门户、传统
              IVR、接听服务和内部呼叫中心。这个区分重要，因为买方可以用更宽的平台、沟通套件，甚至只是更多人工，来解决同一项工作，而不一定采购专科训练的准入厂商。因此，Assort
              所在的是多层市场，功能深度只是一个变量；既有关系、供应商整合和继续保留人工工作流的意愿，都会左右结果。
