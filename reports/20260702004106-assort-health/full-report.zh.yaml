  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户集合横跨专科诊所、FQHC 和 MSO 支持的集团，但分客群证据不均衡
        blocks:
          - type: paragraph
            body: >-
              Assort 的客户故事最强的位置，是医疗运营中段，而不是消费者营销或巨型企业客户标志。公开材料展示了 ENT 和过敏、骨科、皮肤科、视网膜、初级保健、多专科集团以及 FQHC
              足迹，足以证明客群宽度。Assort 还发布了专门的泌尿科工作流页面，描述召回预约、PSA
              路径管理、手术路由和肾结石随访；这扩大了看起来可触达的专科目标面，尽管没有点名一个已上线客户。医疗服务提供者覆盖也有真实的时间跃迁：2026 年 4 月 Activate 报道称覆盖 1,000+
              名医疗服务提供者，而 Becker's 2026 年 6 月外联页面称该技术已在 5,000+
              名医疗服务提供者中投产。这是有意义的采用证据，尽管入站和出站产品之间的具体拆分没有披露。同时，客户记录仍高度由公司自己筛选。公开证据主要是客户故事和平台引语，再由少量独立文章补充，后者印证大方向，而不是审计每个指标。正确解读是，Assort
