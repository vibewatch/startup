  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Assort 卖的是患者旅程平台，不是单一排期机器人
        blocks:
          - type: paragraph
            body: >-
              Assort 当前的产品故事已经不只是“AI 接电话”。最强的官方记录现在描述的是一个四产品患者旅程平台，覆盖入站患者准入、出站外联、后台编排和员工辅助工具。Concierge
              负责入站电话、聊天和预约请求；Activate 负责跨电话、短信和电子邮件的主动外联；Orchestrate 被描述为运行每次就诊背后运营工作的层；Empower 则被定位为员工处理复杂例外时使用的 AI
              副驾。实际工作流覆盖面也相应很宽：预约、信息采集、转诊、文档处理、药物续方、支付、资格校验，以及其他在渠道割裂时容易断掉的前门任务。产品论点是，Patient Journey Memory 和 Synapse
              能让这些任务共享上下文，而不是每次患者换渠道或稍后回来都重新开始。公司把差异化放在连续性、专科规则和运营覆盖上，而不是只放在通用语音机器人上，所以这一点重要。平台页和发布材料持续强化这个更宽的框架，但仍让部分技术内部机制保持不透明。
