              同行画像显示，虽然大家都在讲 AI 智能体，战略分叉仍很明显。Syllable 强调横跨语音、SMS 和聊天的可配置平台。Notable 定位为更宽的医疗 AI 运营层，触达准入、收入周期和护理运营。Hyro
              更强调面向患者支持的负责任 AI；Artera 则把沟通软件和服务结合起来，已经覆盖电话、信息采集、预约和支付。Hello Patient 规模更小，但在门诊专科和跨渠道语音、短信、聊天上很直接。Assort
              的定位有两点不同。第一，公开报道和公司材料显示，它从单一入站语音产品，扩展成患者旅程平台。第二，它最清楚的差异化是专科深度：公司不只是接电话，而是声称能编码那些横向工具经常抽象掉的、医疗服务方特定的怪异逻辑。
