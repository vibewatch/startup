      - number: '8.2'
        title: 为什么上行叙事并非空想
        blocks:
          - type: paragraph
            body: >-
              Assort 能拿到偏高的私募估值，是因为公开可见的上行故事，确实强于泛泛的 AI 电话创业公司叙事。公司声称已处理 190 million 次互动、沉淀 62,000 条护理协议、1.6 million
              条决策路径，并实现近期收入 20x 增长。公开落地证据支持一条路径：2025 年 Activate 覆盖 1,000+ 个医疗服务提供方，到 2026 年中已有 5,000+
              个医疗服务提供方进入生产。专科页面又给估值支撑加了一层：眼科、OB-GYN、儿科、初级保健、ENT、心脏科、GI、肿瘤科、FQHCs 和放射科都有流程深度，并配有具名 EHR
              场景和专科路由逻辑。这样的广度说明，公司想做的是患者旅程操作层，而不是单一用途的电话机器人。TAM
              叙事也可信：CAQH、投资人文章和患者准入评论都指向巨大的行政浪费；只要自动化可信，买方为改善准入付费的意愿也强。
