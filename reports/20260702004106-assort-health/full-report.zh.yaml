      - number: '8.4'
        title: 情景视角、建议与尽调
        blocks:
          - type: paragraph
            body: >-
              收入未披露，表达价值的正确方式是宽情景区间，而不是假精确的倍数。乐观情景下，Assort 证明 5,000+
              个医疗服务提供方规模代表广泛平台使用，医疗系统扩张跑得通，利润率也像软件公司，估值可高于当前标记。基准情景下，当前 $1.2 billion
              轮次方向上合理，但已消化大部分已知上行。悲观情景下，合规拖累、支持成本或竞争压力让公司无法顺畅兑现叙事，低于当前价格的价值也合理。因此，最实用的判断是跟踪 /
              继续研究，中等信心，估值立场为偏贵。缺失尽调很具体，不是抽象问题：ARR、毛利率、NRR、客户集中度、全平台渗透率、赢单 /
              输单动态，以及实际条款清单。在这些信息可见之前，公司值得关注，但不值得激进押注价格。价格敏感性仍然极高。
