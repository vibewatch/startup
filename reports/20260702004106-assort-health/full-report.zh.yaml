        - 190M 次交互、62k 个协议、1.6M 条路径
        - 说明训练和工作流深度超过轻量试点
        - 仍是公司口径指标
      - - 增长速度
        - 15 个月收入增长 20x
        - 解释投资人为何可能接受高溢价的私人估值
        - 未披露基准收入或利润率
      - - 部署规模
        - 2025 年 1,000+ 名医疗服务提供方，2026 年达到 5,000+
        - 支撑产品已真实投产、而不只是试点的判断
        - 医疗服务提供方数量不等于收入或全套件采用
      - - 专科广度
        - 10 个专科 / 护理场景页面，且写出具名工作流细节
        - 如果广度能转化为持久交叉销售，就能支撑溢价定价
        - 广度也可能抬高实施负担
      - - 结果代理指标
        - 官方页面显示每 100 名医疗服务提供方带来 $3.3M 年收入，满意度 4.3/5
        - 暗示客户经济性和患者接受度具备实感
        - 供应商控制的营销指标需要尽调验证
    notes: 在扣除仍然缺失的内容之前，本表先隔离出估值叙事最强的公开支撑。
    claimRefs:
      - CV005
      - CV006
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV029
      - CV033
  - id: TV006
    title: 公开支撑与缺口表
    columns:
      - 问题
      - 公开材料已经支撑什么
      - 尚未支撑什么
      - 估值后果
    rows:
      - - 当前估值标记
        - $1.2B 的 C 轮确已发生
        - 条款是干净，还是带有很强保护
        - 名义估值可能高估普通股权益质量
      - - 收入规模
        - 存在 20x 增长主张
        - 当前 ARR 或收入运行率
        - 无法把公司映射到真实可比区间
      - - 利润率质量
        - 存在工作流广度和自动化主张
        - 毛利率和人工支持强度
        - 软件式溢价仍未得到证明
      - - 持久性
        - 存在具名专科证明和医疗体系扩张
        - NRR、流失率和客户集中度指标
        - 溢价倍数案例仍不完整
      - - 市场规模支撑
        - 存在大型行政负担叙事
        - 已批准缓存中干净、独立的第三方市场规模支撑
        - 独立 TAM 交叉验证弱于标题式来源清单给人的印象
    notes: 价格是可见的；价格背后的承销质量不可见。本表明确拆开这两件事。
    claimRefs:
      - CV003
      - CV026
      - CV031
      - CV032
      - CV037
      - CV041
      - CV042
      - CV043
  - id: TV007
    title: 推翻论点与否决触发项表
    columns:
      - 触发项
      - 重要性
      - 会打破什么
      - 行动含义
    rows:
      - - ARR 或增长质量不及预期
        - 意味着当前溢价靠叙事而不是经济性支撑
        - 基准及以上情形
        - 从跟踪转为规避，直到重新定价
      - - 毛利率或支持成本质量偏低
        - 会让业务不像估值暗示的那样具备软件属性
        - 乐观和基准区间
        - 重估至悲观区间
      - - 医疗体系扩张停滞
        - 会说明专科诊所证明无法顺畅泛化
        - 上行论点
        - 将当前轮视为乐观情绪峰值
      - - 出现合规或工作流事故
        - 会直接打击信任和采购速度
        - 所有正向情形
        - 立即上调风险评级
      - - C 轮条款被证明保护性异常强
        - 会削弱 $1.2B 名义估值的含义
        - 对当前估值标记的信心
        - 在谈判中折价看待名义估值
    notes: 只有少数事件能迅速改变估值判断，因为它们同时击中经济性和叙事质量。
    claimRefs:
      - CV023
      - CV025
      - CV026
      - CV039
      - CV040
      - CV043
  - id: TV008
    title: 最终尽调要求表
    columns:
      - 要求
      - 重要性
      - 当前公开状态
      - 负责人 / 路径
    rows:
      - - 当前 ARR 和收入桥
        - 用来测试 $1.2B 是合理还是被拉伸
        - 未公开
        - 管理层 / 财务数据室
      - - 毛利率和支持成本结构
        - 用来判断平台规模化后是否像软件业务
        - 未公开
        - 管理层 / 运营模型审查
      - - NRR、流失率和客户集中度
        - 用来测试持久性和集中度风险
        - 未公开
        - 管理层 / 队列分析
      - - 5,000+ 名医疗服务提供方基数中的模块级渗透率
        - 用来区分全平台采用和窄模块使用
        - 未公开
        - 产品分析 / 部署审查
      - - 相对关键竞争者的赢单 / 输单和定价数据
        - 用来测试护城河和定价权
        - 未公开
        - 销售运营 / GTM 审查
      - - 完整 C 轮条款清单及任何老股出售组合
        - 用来判断名义估值质量
        - 未公开
        - 法务 / 融资尽调
    notes: 没有这些要求，估值仍只是情景练习，而不是有信心的承销判断。
    claimRefs:
      - CV026
      - CV027
      - CV038
      - CV041
      - CV042
      - CV043
