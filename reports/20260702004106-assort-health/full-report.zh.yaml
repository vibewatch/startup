      - number: '1.2'
        title: 领导层、治理与控制权可见度
        blocks:
          - type: paragraph
            body: >-
              对一家年轻的私营医疗 AI 公司来说，Assort 的创始人故事异常清晰。公开材料一致确认 Jon Wang 和 Jeffery Liu 是创始人兼联席 CEO；Menlo
              与种子轮新闻稿也给出了可信的创始人-市场匹配叙事，覆盖临床训练、AI 研究、医疗运营和产品工程。看不清的是完整治理栈。2025 年 9 月 B 轮公告明确披露一位新增董事——Lightspeed 合伙人
              Galym Imanbayev，以及一位董事会顾问——前 Nuance CEO Paul Ricci。除此之外，已抓取记录没有披露完整董事会名单、投资人控制权、投票门槛或其他保护性条款。Assort 在 2025
              和 2026 年融资速度很快，因此这些信息重要。公开信任面同样不完整：隐私、患者隐私和 BAA 页面存在，HHS 与 ABA 来源也说明 HIPAA 和生成式 AI
              治理义务的严肃性，但资料目录没有给出更深的公开认证包或隐私控制叙事。
