        title: 展示材料
        blocks:
          - type: callout
            title: 以电话为先的准入仍是最现实的市场切入口
            body: 抓取材料中最强的证据不是医疗服务机构想要更多门户，而是复杂专科需求仍落在电话上；因此，最值得投资的楔子，是自动化患者已经在使用的渠道。
