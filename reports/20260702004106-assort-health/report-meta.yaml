summary:
  headline: >-
    Assort Health shows real product-market pull in healthcare patient access, but opaque unit economics and meaningful privacy,
    workflow-safety, and competitive risks keep the current $1.2B mark in watchlist territory rather than clear buy territory.
  overallScore: 6.8
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1200
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 222
    customerCount: null
    headcount: null
  topStrengths:
    - >-
      Assort has a hard current financing anchor: a $120M Series C at a $1.2B valuation in June 2026 with $222M+ total
      disclosed funding.
    - >-
      Public product evidence shows the company has moved beyond simple scheduling into a broader patient-journey platform
      spanning intake, outreach, referrals, payments, and orchestration.
    - >-
      The company claims 190M+ interactions, 62,000 care protocols, 1.6M decision pathways, and 20x revenue growth over 15
      months, indicating unusually strong recent momentum for a private workflow-AI company.
    - >-
      Customer proof is unusually concrete for a private health-tech startup, with named practices and provider groups
      publishing hold-time, staffing, conversion, and revenue outcomes.
    - >-
      Specialty-specific workflow depth and health-system expansion create a plausible path to durable enterprise value if
      economics are as strong as the narrative suggests.
  topRisks:
    - >-
      Public sources still do not disclose ARR, gross margin, burn, CAC payback, retention, or concentration, so the
      current valuation cannot be underwritten on economics alone.
    - >-
      The platform sits on PHI-heavy scheduling and triage workflows, making HIPAA, privacy, hallucination, and
      output-integrity controls central to downside risk.
    - >-
      Deployment complexity rises as Assort expands across specialties, settings, and edge-case workflows, which can
      pressure support costs and implementation quality.
    - >-
      Competition is credible and well-funded across adjacent categories, including workflow AI, outreach automation, and
      incumbent enterprise healthcare platforms.
    - >-
      The public record does not provide a full board/control picture or detailed Series C terms, limiting insight into
      governance and preference-stack risk.
  unresolvedGaps:
    - Current ARR, gross margin, burn, runway, and audited 2025/2026 financial statements.
    - Customer retention, NRR / GRR, module-level penetration, and top-account concentration.
    - >-
      The exact June 2026 Series C term sheet, including liquidation preferences, any secondary component, and board/control
      implications.
    - >-
      Win-loss and pricing durability versus Hyro, Artera, Syllable, Notable, Infinitus, and incumbent contact-center
      alternatives.
    - >-
      Independent evidence on workflow accuracy, escalation rates, and safety performance for high-complexity specialty and
      triage use cases.
