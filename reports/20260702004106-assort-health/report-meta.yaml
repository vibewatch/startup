companyProfile:
  summary: >-
    Assort Health is a private healthcare AI company building voice-led and multichannel patient-access automation for specialty
    practices, multi-site medical groups, FQHCs, and health systems. Public materials show a fast platform expansion from inbound
    scheduling into intake, outreach, referrals, payments, and operational orchestration, all marketed as a unified patient-journey
    layer trained on 190M+ patient interactions. The company has raised more than $222M through a June 2026 Series C at a $1.2B
    valuation, and public customer proof supports meaningful deployment breadth, but economic disclosure remains thin.
