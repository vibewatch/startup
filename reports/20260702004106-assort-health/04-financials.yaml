    nodes:
    - id: inbound
      label: Inbound access pain
      detail: High call volume, hold times, and scheduling complexity create acute workflow demand.
    - id: modules
      label: Workflow modules
      detail: Scheduling, triage, intake, outreach, referrals, and payment resolution are sold as connected products.
    - id: ehr
      label: System embed
      detail: Direct EHR write-back, task creation, and data sync deepen workflow dependence.
    - id: roi
      label: Customer ROI
      detail: Revenue capture, shorter hold times, higher capacity, and better satisfaction support willingness to pay.
    - id: expand
      label: Expansion motion
      detail: Outreach, payments, and health-system use cases widen contract scope.
    - id: revenue
      label: Recurring revenue
      detail: Most supportable public inference is recurring SaaS or usage-based economics, not one-time services.
