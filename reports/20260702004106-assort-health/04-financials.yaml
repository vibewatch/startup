- id: TI005
  title: Module-to-Workflow Monetization Evidence Table
  columns:
  - Module family
  - Official workflow evidence
  - Operational signal
  - Revenue implication
  - Remaining unknown
  rows:
  - - Scheduling
    - Books appointments across patient channels and automates appointment-management tasks without adding staff
    - Always-on inbound workflow tied directly to patient-access volume
    - Supports recurring or usage-linked pricing on the core front door
    - Need contract structure, implementation fees, and appointment-volume pricing drivers.
  - - Triage and routing
    - Resolves the majority of inbound calls and creates EHR-native tasks automatically when escalation is needed
    - High containment plus escalation workflow can reduce staff workload
    - Supports premium pricing for automation depth in clinically sensitive workflows
    - Need containment-rate distribution, clinical carve-outs, and separate-module pricing.
  - - Intake and payment resolution
    - Real-time eligibility checks, insurance-card capture, billing-question handling, and direct EHR entry
    - Touches pre-visit verification and revenue-cycle operations
    - Could expand ACV beyond scheduling into higher-value administrative workflows
    - Need per-verification economics and whether payment workflows are bundled or standalone.
  - - Outreach and referrals
    - EHR-triggered campaigns plus minutes-fast omnichannel referral outreach until appointments are confirmed
    - Activate is already live across 1,000+ providers with measured booking lift
    - Supports expansion-led upsell across patient-engagement modules
    - Need attach rates, per-outreach pricing, and referral-conversion take rates.
  notes: This table focuses on how official workflow claims translate into monetizable recurring scope, separating product-depth evidence from customer-outcome evidence.
