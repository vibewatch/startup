  - - Proactive outreach
    - Outbound campaigns for bookings, care gaps, referrals, and payments
    - Recurring software / performance-linked
    - Activate is in 1,000+ provider deployments
    - Medium
    - Disclose whether outreach is priced per provider, per interaction, or as module uplift.
