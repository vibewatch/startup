  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-model
    missingEvidence: Actual contract examples showing whether Assort charges per provider, per workflow, per interaction, fixed subscription, or hybrid pricing.
    whyItMatters: Without realized pricing mechanics, the chapter can infer recurring economics but cannot underwrite price realization or discount discipline.
    diligencePath: Request three recent redacted contracts plus bookings-to-ARR bridge by module.
    relatedQuestionRefs:
    - QI002
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: missing-metrics
    missingEvidence: Current ARR, GAAP revenue, gross margin, CAC payback, NRR, and GRR.
    whyItMatters: These metrics determine whether strong customer outcomes translate into durable software economics and acceptable valuation support.
    diligencePath: Request monthly KPI pack, board materials, and cohort retention analysis.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI019
    - QI025
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash-on-hand, net burn, runway, debt, and downside financing plan after the Series C.
    whyItMatters: Fresh funding alone does not prove runway; the same capital base can imply very different risk depending on burn and obligations.
    diligencePath: Request current balance-sheet snapshot, debt schedule, and 12-24 month operating plan.
