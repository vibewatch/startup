  - - Clinical triage and routing
    - AI containment, routing, and EHR-task creation for inbound calls
    - Recurring software / usage
    - Function is explicit; pricing is undisclosed
    - Medium
    - Show whether triage is bundled, sold separately, or usage-metered.
  - - Intake and eligibility
    - Automated intake, insurance verification, and data capture before visits
    - Recurring software / usage
    - Function is explicit; realized revenue unknown
    - Medium
