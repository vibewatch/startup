- id: traction-and-unit-economics-proxies
  title: Traction and Unit-Economics Proxies
  body: 'Assort’s public traction evidence is much stronger on customer outcomes than on company-reported P&L. The platform page advertises $3.3 million of annual revenue per 100 providers and 4.3/5 average patient satisfaction, while the customers page says Assort powers 5,000+ providers and the Activate launch says 1,000+ providers are already live on that outreach product. Management has also gone public with a 20x revenue-growth claim over the prior 15 months. The richer proof comes from case studies: Annapolis reports 220% labor-capacity growth and 75% shorter hold times; SENTA cites $1.3 million of captured appointment revenue plus $400K+ labor-cost avoidance; Michigan Orthopedic cites $2.3 million of added revenue and 5% appointment-volume lift; Chesapeake cites $1M+ of new revenue and 50% capacity growth. Independent press corroborates at least part of that outcome story at Annapolis. These are meaningful proxies for revenue quality and sales efficiency, but they are still customer-level
    outcome proofs rather than a disclosed company-wide margin model.'
