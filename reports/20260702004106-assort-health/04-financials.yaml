- id: TI007
  title: Funding Timeline and Underwriting Gaps Table
  columns:
  - Milestone
  - Public amount
  - Corroboration
  - Expansion signal
  - What it supports
  - What is still missing
  rows:
  - - Series A (April 2025)
    - $22M round; $26M total raised
    - Wilson Sonsini plus trade coverage corroborate the close
    - Specialty-specific phone-call automation platform
    - Shows the start of institutional backing and validates early investor demand
    - Ownership, burn at close, and planned staffing were not disclosed publicly.
  - - Series B (September 2025)
    - $76M round; $102M total raised
    - Company release, Fierce, Mobi, and Wilson Sonsini align on the chronology
    - Team expansion and accelerated development of Assort OS
    - Indicates aggressive scale investment only months after the Series A
    - Post-B cash balance and spend by function were not disclosed publicly.
  - - Series C (June 2026)
    - $120M at a $1.2B valuation; more than $222M total funding
    - Company, Fierce, Becker's, and Mobi all corroborate the financing
    - Largest-deployment patient-journey expansion narrative
    - Creates a strong near-term funding buffer and resets expectations for category leadership
    - Primary versus secondary mix, net proceeds, and runway remain undisclosed.
  - - Upmarket expansion narrative
    - No separate funding amount disclosed
    - Becker's and Mobi cite community-based organizations, academic medical centers, and John Muir Health
    - Larger provider organizations and health systems
    - Suggests enterprise contract potential that could absorb heavier GTM investment
    - Pilot versus scaled rollout mix is still not public.
  - - Compliance cost floor
    - No public dollar disclosure
    - HHS and the ABA outline HIPAA, privacy, and AI-governance obligations
    - Unavoidable security, privacy, and governance work
    - Explains why gross-margin and support-cost disclosure matters to underwriting
    - Compliance staffing, tooling, and incident-response budgets are not public.
  notes: The funding timeline is well corroborated, but the chapter still lacks the cash-flow and balance-sheet details needed to convert financing momentum into a full runway judgment.
