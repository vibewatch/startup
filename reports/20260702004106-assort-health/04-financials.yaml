- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Annual revenue proxy per 100 providers
    - $3.3M
    - Medium
    - Only direct public revenue-adjacent metric tied to provider scale.
    - Request methodology, numerator definition, and whether this is customer revenue or vendor-captured value proxy.
  - - Average patient satisfaction
    - 4.3/5 platform metric; 4.3/5 Annapolis; 4.4/5 Chesapeake
    - Medium
    - Supports workflow acceptance and lower service friction.
    - Request cohort-level satisfaction distribution and methodology.
  - - Provider footprint
    - 5,000+ providers overall; 1,000+ on Activate
    - Medium
    - Scale supports recurring-software interpretation and distribution breadth.
    - Provide paid-live-provider count, not just powered-provider count.
  - - Revenue growth
    - 20x in 15 months
    - High
    - Direct public growth signal for the current scale phase.
    - Bridge the 20x claim to starting revenue, ending revenue, and module mix.
  - - Appointment-volume lift
    - +5% in public launch and Michigan case-study examples
    - Medium
    - Shows measurable commercial value for customers.
    - Provide portfolio median uplift and distribution by specialty.
  - - Labor-capacity lift
    - +50% Chesapeake; +115% Activate; +200% dermatology; +220% Annapolis
    - Medium
    - Suggests strong ROI that could support durable pricing.
    - Show how much of the labor gain converts into retained gross margin versus heavier support costs.
  - - Customer revenue capture
    - $1.0M+ Chesapeake; $1.3M SENTA; $2.3M Michigan Orthopedic
    - Medium
    - Helps infer willingness to pay and upsell potential.
    - Show realized contract value as a share of customer value created.
  - - Hold-time / access improvement
    - 75% shorter hold times at Annapolis; 97% reduction at SENTA
    - Medium
    - Operational proof that could improve win rates and retention.
    - Provide retention and NPS/CSAT outcomes for mature cohorts.
  - - ARR / revenue run rate
    - null
    - Low
    - Needed for valuation benchmarking and growth-quality analysis.
    - Provide current ARR, trailing-12-month revenue, and cohort growth.
  - - Gross margin
    - null
    - Low
    - Needed to judge whether Assort behaves like software, BPO, or hybrid delivery.
    - Provide GAAP gross margin and gross margin by module family.
  - - Burn / runway / debt
    - null
    - Low
    - Needed to test capital adequacy despite recent financing strength.
    - Provide cash balance, net burn, debt, and planned runway under base and downside cases.
  - - CAC payback / NRR / GRR
    - null
    - Low
    - Needed to understand sales efficiency and durability of expansion economics.
    - Provide CAC payback, gross retention, and net retention by recent cohort.
  notes: Public unit-economics evidence is unusually strong on customer outcomes and unusually weak on company economics; nulls reflect genuine disclosure gaps, not author omission.
