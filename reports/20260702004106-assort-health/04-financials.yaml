- id: TI006
  title: Customer ROI Benchmark Table
  columns:
  - Customer / cohort
  - Public scale context
  - Revenue impact
  - Efficiency impact
  - Access or satisfaction signal
  - Financial read-through
  rows:
  - - Annapolis Internal Medicine
    - Public customer story plus independent press coverage
    - 61% of flu-shot appointments booked through proactive outreach
    - 220% labor-capacity growth
    - 75% shorter hold times and 4.3/5 patient satisfaction
    - Shows expansion from inbound access into proactive outreach with measurable throughput gains.
  - - SENTA
    - Company-published specialty-group case study
    - $1.3M additional appointment revenue captured
    - $400K+ annual labor-cost avoidance and 250+ hours saved per month
    - 97% reduction in hold time
    - Strong ROI proxy for enterprise pricing conversations if outcomes are repeatable.
  - - Michigan Orthopedic Surgeons
    - 90+ provider specialty practice
    - $2.3M additional revenue generated
    - null
    - +5% total appointment-volume growth
    - Demonstrates that even modest volume lift can translate into large dollar value at larger practices.
  - - Chesapeake Health Care
    - 150+ provider FQHC
    - $1M+ in new revenue generated
    - 50% increase in labor capacity
    - 4.4/5 patient satisfaction
    - Suggests Assort can monetize in safety-net and multisite operating environments.
  - - Activate portfolio signal
    - 1,000+ provider deployment base
    - +5% appointment-volume lift
    - 115% labor-capacity increase
    - Less than 5% abandonment and 4.3/5 patient satisfaction
    - Indicates that the ROI narrative is broader than one or two lighthouse logos.
  notes: Public ROI evidence is still company-authored in most cases, but the benchmark set is wide enough to support a repeatable customer-value thesis.
