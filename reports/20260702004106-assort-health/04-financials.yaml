- id: capital-adequacy-and-compliance-cost-floor
  title: Capital Adequacy and Compliance Cost Floor
  body: 'Capital adequacy looks directionally strong even though the core underwriting metrics remain undisclosed. Assort raised $22 million in Series A, $76 million in Series B only months later, and $120 million in Series C at a $1.2 billion valuation, taking public cumulative funding above $222 million. Those rounds were corroborated not only by company releases and trade press, but also by Wilson Sonsini transaction notices that strengthen the chronology. Public use-of-funds language points toward team growth, Assort OS development, and broader patient-journey expansion. The upmarket narrative also matters: Becker’s and Mobi both say Assort is moving into community-based organizations and academic medical centers, including John Muir Health. Still, the company handles patient-access workflows that touch ePHI, insurance, and payment data, so HIPAA security obligations and broader generative-AI governance requirements create a real cost floor. Without disclosed burn, cash, runway, or debt,
    the capital story is supportive but incomplete.'
