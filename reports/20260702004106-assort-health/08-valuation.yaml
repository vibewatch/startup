- id: TV007
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Why it matters
  - What would break
  - Action implication
  rows:
  - - ARR or growth quality disappoints
    - Would imply the current premium is being carried by narrative rather than economics
    - The base case and above
    - Move from track to avoid until repriced
  - - Gross margin or support cost looks low-quality
    - Would make the business less software-like than the valuation implies
    - Bull and base ranges
    - Re-rate toward bear range
  - - Health-system expansion stalls
    - Would show specialty-practice proof does not generalize cleanly
    - Upside thesis
    - Treat current round as peak optimism
  - - Compliance or workflow incidents surface
    - Would directly attack trust and procurement velocity
    - All positive cases
    - Raise risk rating immediately
  - - Series C terms prove unusually protective
    - Would weaken the meaning of the headline $1.2B mark
    - Current-mark confidence
    - Discount the headline valuation in negotiations
  notes: These are the few events that can change the valuation call quickly because they hit both economics and narrative quality.
  claimRefs:
