- id: why-the-upside-story-is-not-imaginary
  title: Why the Upside Story Is Not Imaginary
  body: 'The reason Assort can command a premium private mark is that the public upside story is materially stronger than a generic AI-calls startup narrative. The company claims 190 million interactions, 62,000 care protocols, 1.6 million decision pathways, and 20x recent revenue growth. Public rollout evidence supports a path from 1,000+ providers on Activate in 2025 to 5,000+ providers in production by mid-2026. The specialty pages add another layer of valuation support because they show workflow depth across ophthalmology, OB-GYN, pediatrics, primary care, ENT, cardiology, GI, oncology, FQHCs, and radiology, each with named EHR contexts and specialty-specific routing logic. That breadth suggests the company is trying to become a patient-journey operating layer rather than a single-use call bot. The TAM framing is also credible: CAQH, investor essays, and patient-access commentary all point to large administrative waste and strong willingness to pay for access improvement if the automation
    is trusted.'
