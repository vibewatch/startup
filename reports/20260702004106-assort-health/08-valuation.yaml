- id: TV006
  title: Public Support vs. Gap Table
  columns:
  - Question
  - What the public file does support
  - What it does not support yet
  - Valuation consequence
  rows:
  - - Current mark
    - The 1.2B Series C happened
    - Whether the terms were clean or heavily protected
    - Headline valuation may overstate common-equity quality
  - - Revenue scale
    - 20x growth claim exists
    - Current ARR or revenue run rate
    - Cannot map the company onto a true comp band
  - - Margin quality
    - Workflow breadth and automation claims exist
    - Gross margin and human-support intensity
    - Software-like premium remains unproven
  - - Durability
    - Named specialty proof and health-system expansion exist
    - NRR, churn, and concentration metrics
    - Premium multiple case remains incomplete
  - - Market-size support
    - Large admin-burden framing exists
