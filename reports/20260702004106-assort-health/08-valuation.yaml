- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale
    - 190M interactions and 5,000+ providers can compound a data and deployment advantage
    - Provider-count headlines may not equal broad suite usage or durable economics
    - Module-level penetration and cohort expansion data
  - - Product breadth
    - Patient-journey coverage across many specialties can support a premium operating-system narrative
    - Breadth can also raise support cost and implementation risk
    - Gross margin and human-support intensity by workflow
  - - TAM
    - CAQH and investor commentary point to a large admin-burden market
    - Large TAM alone does not prove durable pricing power
    - Win-loss, payback, and buyer urgency by segment
  - - Competition
    - Specialty-specific depth may beat generic bots
    - Hyro, Artera, Syllable, Notable, and Infinitus all pressure the category from different angles
    - Competitive displacement or pricing data
  - - Valuation
    - $1.2B can be justified if the company is already software-like at scale
    - The same mark is rich if margins, retention, or deployment quality are weaker than implied
    - ARR, gross margin, NRR, and the Series C term sheet
  notes: The anti-thesis is about price discipline and evidence quality, not about denying the company's real operating momentum.
