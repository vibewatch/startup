- id: scenario-view-recommendation-and-diligence
  title: Scenario View, Recommendation, and Diligence
  body: 'Because revenue is undisclosed, the right way to express value is as a broad scenario range rather than a fake precise multiple. In the bull case, Assort proves that 5,000+ provider scale represents broad platform usage, health-system expansion works, and margins look software-like, which can support value above the current mark. In the base case, the current $1.2 billion round is directionally fair but already discounts much of the known upside. In the bear case, compliance drag, support cost, or competitive pressure keep the company from growing cleanly into the narrative, making sub-current value plausible. That is why the best practical call is track / research-more with medium confidence and a stretched valuation stance. The missing diligence is concrete rather than abstract: ARR, gross margin, NRR, customer concentration, full-platform penetration, win-loss dynamics, and the actual term sheet. Until those are visible, the company deserves attention but not aggressive price
    conviction. Price sensitivity remains extreme.'
