  - CV025
  - CV026
  - CV039
  - CV040
  - CV043
- id: TV008
  title: Final Diligence Asks Table
  columns:
  - Ask
  - Why it matters
  - Current public status
  - Owner / path
  rows:
  - - Current ARR and revenue bridge
    - Needed to test whether 1.2B is fair or stretched
    - Not public
    - Management / finance data room
  - - Gross margin and support-cost profile
    - Needed to know if the platform is software-like at scale
    - Not public
    - Management / operating model review
  - - NRR, churn, and customer concentration
    - Needed to test durability and concentration risk
    - Not public
    - Management / cohort analysis
  - - Module-level penetration across the 5,000+ provider base
    - Needed to separate full-platform adoption from narrow module usage
    - Not public
    - Product analytics / deployment review
  - - Win-loss and pricing data versus key competitors
    - Needed to test moat and price power
    - Not public
    - Sales ops / GTM review
  - - Full Series C term sheet and any secondary mix
    - Needed to judge headline valuation quality
    - Not public
    - Legal / financing diligence
  notes: Without these asks, valuation remains a scenario exercise rather than conviction underwriting.
