company:
  name: Assort Health
chapter:
  number: 8
  title: Valuation
  summary: 'The only hard current price signal is Assort Health''s June 24, 2026 Series C at a $1.2 billion valuation. Public evidence supports why the round could happen—20x recent growth, 190 million interactions, a product that now spans the patient journey, more than 5,000 providers in production, and specialty-specific workflow depth—but it does not reveal current revenue, ARR, gross margin, retention, concentration, or the quality of the term sheet. That makes the current mark respectable but stretched. The most defensible recommendation is track / research-more with medium confidence: there is enough proof to take the company seriously, but not enough economic disclosure to call the current price attractive.'
sections:
- id: current-mark-and-what-is-actually-hard-fact
  title: Current Mark and What Is Actually Hard Fact
  body: Valuation work on Assort has to start with discipline about what is truly known. The clean fact set is short. Assort announced a $120 million Series C on June 24, 2026 at a $1.2 billion valuation, and multiple independent outlets repeated the same mark and more than $222 million of total capital raised. Public sources also say revenue grew 20x over the prior 15 months and that the platform now extends far beyond inbound scheduling. What is missing is just as important. No approved cached source discloses current revenue, ARR, gross margin, NRR, concentration, or the exact quality of the term sheet. That means the current price is a real market event, not a fully underwritable intrinsic-value answer. In practical terms, investors can use the $1.2 billion round as the current clearing price, but they cannot honestly defend fine-grained multiple work or treat the number as obviously cheap without additional company data.
  claimRefs:
