chapter:
  number: 7
  title: Risks
  summary: 'Assort Health''s biggest risks are not demand-side; they sit in the combination of PHI-bearing workflows, specialty-specific scheduling and triage complexity, opaque economics, and an increasingly crowded healthcare-AI landscape. Public sources support a real growth story and credible mitigations—warm handoffs, EHR-native tasks, a large protocol corpus, and named customer ROI—but they do not publicly close the most important underwriting questions around audited error rates, concentration, or current unit economics. The ranked register therefore lands at high-but-manageable risk: the company looks directionally strong, yet its thesis can still break if governance, workflow quality, or enterprise rollout evidence lags the speed of expansion.'
sections:
- id: legal-privacy-and-regulatory-risk
  title: Legal, Privacy, and Regulatory Risk
  body: 'Assort''s product touches some of the most sensitive edges of outpatient healthcare: patient identity, symptoms, eligibility, referrals, follow-up timing, and call outcomes that often need to land inside an EHR. That matters because the legal baseline is not optional. HHS says systems that maintain or transmit ePHI must satisfy administrative, physical, and technical safeguards, and recent healthcare-AI guidance argues that AI assets interacting with ePHI should be inventoried and folded into live risk analysis. The privacy surface is wider than classic scheduling bots because the public product story spans intake, medication refills, lab results, payments, and multimodal outreach. Public compliance commentary also shows that FTC, DOJ, and other agencies can shape liability through claims, privacy, and bias theories even if a product is not marketed as a medical device. Assort likely benefits from operating in a category with urgent ROI, but that same urgency will not spare it from
    procurement drag if buyers cannot verify business-associate terms, patient notices, model governance, or incident handling beyond marketing surfaces.'
  claimRefs:
