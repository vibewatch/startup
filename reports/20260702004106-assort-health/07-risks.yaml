- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, Monitoring, and Kill Criteria
  body: 'The public record does support a mitigation stack; it just does not fully close the loop. Assort can point to a large protocol corpus, warm handoffs, EHR-native task creation, proactive outreach tied to EHR data, and named customers that say hold times, labor capacity, and booking conversion improved materially after deployment. Those are meaningful strengths. But the practical underwriting question is whether those strengths are durable once the company moves deeper into health systems, broader administrative workflows, and tighter privacy and governance expectations. Investors should therefore monitor a small set of thesis-break indicators: audited error or escalation metrics, the clarity of privacy/BAA artifacts, proof that health-system rollouts work at least as well as specialty-practice deployments, evidence that provider-count growth reflects broad platform usage rather than narrow modules, and any sign that procurement friction is lengthening because legal or security reviewers
    want more than the public file offers. If management cannot answer those asks cleanly, the current narrative should be treated as more fragile than the growth headlines imply.'
