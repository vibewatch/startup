  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: privacy documentation
    missingEvidence: Substantive current BAA text, privacy notice text, and any trust-center style controls overview for enterprise review.
    whyItMatters: Legal and security review can move faster or slower depending on exact contractual language, not just on the existence of a URL.
    diligencePath: Request the live BAA, DPA or trust packet directly from management and compare it with the approved cached pages.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: workflow quality metrics
    missingEvidence: Audited wrong-booking, wrong-routing, unsafe-escalation, exception-handling, and human override rates by workflow.
    whyItMatters: The core downside in healthcare access AI is not generic cyber risk; it is operational quality at real clinical and scheduling edge cases.
    diligencePath: Request workflow QA dashboards, incident logs, and a recent safety / escalation review for high-stakes specialties.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
    - TR006
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Provider, revenue, and deployment concentration by specialty, MSO, and health-system account.
    whyItMatters: The public proof set looks concentrated in certain ambulatory and specialty workflows, but investors cannot quantify the concentration today.
    diligencePath: Ask management for customer concentration, provider mix, and revenue split by module and care setting.
    relatedQuestionRefs:
    - QR029
    - QR030
    relatedTableRefs:
    - TR003
    - TR004
  - type: stale
    severity: minor
    topic: third-party market sizing
    missingEvidence: A working independent market-size source from the approved cache that actually matches the requested healthcare voice-agent article.
    whyItMatters: Broken or mismatched market-data sources reduce confidence in external TAM framing, especially when underwriting a fast-growing category.
    diligencePath: Refresh the GlobeNewswire and other market-data URLs in a later run if independent TAM triangulation becomes decision-critical.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR006
