  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, Direct Peers, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to read Assort's landscape is to separate direct patient-access workflow peers from
              broader or incumbent substitutes. Direct peers in the fetched set are vendors selling AI-driven patient
              communications or access workflows across voice and adjacent channels, notably Syllable, Notable, Hyro,
              Artera, and Hello Patient. Infinitus matters too, but more as an adjacent administrative-call automation
              platform than as a pure provider-group front-office competitor. A second layer includes incumbent and
              status-quo substitutes: Microsoft or Nuance, EHR scheduling modules, patient portals, legacy IVR,
              answering services, and in-house call centers. That distinction matters because buyers can solve the same
              job with a broader platform, a communications suite, or simply more labor instead of a specialty-trained
              access vendor. Assort therefore competes in a multi-layer market where feature depth is only one variable;
              installed relationships, vendor consolidation, and willingness to keep manual workflows all shape the
              outcome.
