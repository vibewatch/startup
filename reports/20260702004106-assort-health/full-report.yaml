        title: Peer Profiles and Assort's Positioning
        blocks:
          - type: paragraph
            body: >-
              The peer profiles show meaningful strategic divergence despite similar AI-agent language. Syllable
              emphasizes a configurable platform across voice, SMS, and chat. Notable positions as a broader healthcare
              AI operating layer touching access, revenue cycle, and care operations. Hyro leans into responsible AI for
              patient support, while Artera combines communications software with services and already spans calls,
              intake, scheduling, and payments. Hello Patient is smaller but notably direct in outpatient specialties
              and cross-channel voice, text, and chat. Assort's positioning is different in two ways. First, public
              coverage and company materials show it scaling beyond a single inbound voice product into a platform for
              the patient journey. Second, its clearest differentiation is specialty depth: the company does not just
              answer the phone; it claims to encode the weird provider-specific logic that horizontal tools often
              abstract away.
