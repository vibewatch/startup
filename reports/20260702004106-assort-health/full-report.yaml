      - number: '7.2'
        title: Workflow Quality, Safety, and Integration Risk
        blocks:
          - type: paragraph
            body: >-
              The hardest risks sit where workflow automation meets real clinical nuance. Assort's own pages emphasize
              that primary-care routing can involve more than 1,000 symptom variants, chest-pain escalation, Medicare
              timing rules, and payer-specific constraints. Investor and product materials likewise present the company
              as handling prescriptions, lab results, referrals, and proactive outreach rather than only answering
              simple inbound calls. Newer specialty pages extend that picture into post-ER follow-up and imaging
              scheduling, neurology subspecialty routing and infusion cadence, urology procedure rules, oncology
              treatment-cycle coordination, and demo call flows for pediatrics, primary care, and OB-GYN. That breadth
              helps explain the upside, but it also means a wrong rule, stale protocol, bad EHR sync, or weak handoff
              can create downstream scheduling errors, patient frustration, or patient-safety escalation. Customer
              stories prove real improvement in hold times and conversion, yet none of the approved cached sources
              publishes audited wrong-booking, wrong-routing, or unsafe-triage rates. That is the key operational gap.
              The mitigation story—warm handoffs, EHR tasks, outreach linked to EHR data, and test generation from
              protocol history—is directionally credible, but the company still needs workflow-level QA evidence for
              investors to underwrite the risk as mature rather than merely well marketed.
            claimRefs:
              - CR003
              - CR012
              - CR013
              - CR014
