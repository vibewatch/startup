    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      A simplified layer map of Assort from patient-facing channels down to workflow logic, memory, integrations, and
      governance constraints.
    data:
      layers:
        - label: Patient channel layer
          detail: Phone, web chat, text, email, and live scheduling surfaces exposed through Concierge and Activate.
        - label: Conversation and memory layer
          detail: Patient Journey Memory plus Synapse carry prior context and cross-session state.
        - label: Workflow logic layer
          detail: Specialty, provider, payer, urgency, and campaign rules govern booking, intake, and routing behavior.
        - label: Execution layer
          detail: EHR sync, task creation, eligibility checks, referral follow-up, payment resolution, and refill capture.
        - label: Trust and control layer
          detail: HIPAA obligations, human handoff, privacy policy, BAA surface, and enterprise assurance questions.
    approximationNotes: This is reconstructed from public product pages rather than vendor architecture diagrams or API docs.
    claimRefs:
      - CE003
      - CE007
      - CE014
      - CE018
      - CE020
      - CE022
      - CE028
      - CE039
      - CE049
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: Shows how the public product record moves from inbound patient contact through routing, execution, and follow-up.
    data:
      nodes:
        - id: n1
          label: Patient initiates contact
          detail: Call, chat, text, or online scheduling request reaches Concierge.
          tone: neutral
        - id: n2
          label: Context and identity retrieval
          detail: Prior interaction context and patient data are surfaced for continuity.
          tone: positive
        - id: n3
          label: Workflow logic applied
          detail: Specialty rules, provider matching, payer constraints, and urgency are evaluated.
          tone: positive
        - id: n4
          label: Execution or escalation
          detail: The system books, creates tasks, checks eligibility, or hands off with summary.
          tone: positive
        - id: n5
          label: Outbound follow-through
          detail: Activate, referral automation, and reminders re-engage patients across channels.
          tone: positive
        - id: n6
          label: Open-risk checkpoint
          detail: Failures in sync, context, or safety need human review and governance.
          tone: warning
      edges:
        - from: n1
          to: n2
          label: Start conversation
        - from: n2
          to: n3
          label: Apply memory and rules
        - from: n3
          to: n4
          label: Resolve or escalate
        - from: n4
          to: n5
          label: Trigger downstream workflow
        - from: n3
          to: n6
          label: Edge-case or safety risk
        - from: n6
          to: n4
          label: Human override
    approximationNotes: The flow is user-visible sequence, not a literal microservice diagram.
    claimRefs:
      - CE011
      - CE015
      - CE016
      - CE018
      - CE019
      - CE022
      - CE024
      - CE028
      - CE029
      - CE049
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: standard
    summary: >-
      Assort's public differentiation depends on multiple linked layers: specialty rules, context memory, integrations,
      and trust controls.
    data:
      nodes:
        - id: core
          label: Assort platform core
          type: system
          detail: Concierge, Activate, and shared patient-journey workflow engine.
        - id: memory
          label: Synapse and memory layer
          type: dependency
          detail: Context persistence and specialty-pattern learning.
        - id: ehr
          label: EHR integrations
          type: dependency
          detail: Epic, athenahealth, eClinicalWorks, NextGen, ModMed, Nextech, and other practice systems.
        - id: workflow
          label: Specialty workflow logic
          type: dependency
          detail: Orthopedics, dermatology, ophthalmology, FQHC, and other specialty playbooks.
        - id: governance
          label: HIPAA and AI governance
          type: dependency
          detail: PHI safeguards, privacy, agency oversight, and buyer assurance.
        - id: humans
          label: Human escalation path
          type: dependency
          detail: Warm handoff, task routing, and exception handling for unsafe or complex cases.
        - id: metrics
          label: Undisclosed assurance metrics
          type: dependency
          detail: Latency, rollback, hallucination rate, and certification evidence not surfaced publicly.
      edges:
        - from: core
          to: memory
          label: Needs context continuity
        - from: core
          to: ehr
          label: Needs system execution
        - from: core
          to: workflow
          label: Needs specialty rules
        - from: core
          to: humans
          label: Needs escalation path
        - from: memory
          to: governance
          label: Context implies PHI risk
        - from: ehr
          to: metrics
          label: Missing reliability telemetry
        - from: workflow
          to: metrics
          label: Missing edge-case measurements
        - from: governance
          to: core
          label: Can constrain deployment claims
    approximationNotes: The map captures operating dependencies, not contractual relationships or system ownership.
    claimRefs:
      - CE008
      - CE009
      - CE016
      - CE031
      - CE032
      - CE039
      - CE042
      - CE048
      - CE049
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public maturity is strongest on inbound access, outbound outreach, and specialty workflow examples; weaker on
      assurance telemetry and developer transparency.
    data:
      columns:
        - Inbound access
        - Outbound outreach
        - Specialty logic
        - Integration surface
        - Trust disclosure
