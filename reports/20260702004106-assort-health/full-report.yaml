          high: 1.3
        - label: Current round
          low: 1.2
          mid: 1.2
          high: 1.2
        - label: Bull floor
          low: 1.3
          mid: 1.35
          high: 1.4
        - label: Bull case
          low: 1.3
          mid: 1.5
          high: 1.7
        - label: Stretch bull
          low: 1.5
          mid: 1.65
          high: 1.8
    approximationNotes: >-
      Ranges are broad judgment bands anchored on the public 1.2B mark and adjusted for the strength of operating proof
      versus the weakness of public economic disclosure.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV027
