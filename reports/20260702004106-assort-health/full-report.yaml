      - number: '8.3'
        title: Why the Price Still Looks Stretched
        blocks:
          - type: paragraph
            body: >-
              The case against the current price is not that Assort lacks momentum; it is that the current public file
              still leaves too many economic and risk variables hidden. Competitors are not theoretical. Hyro advertises
              health- system results, Artera claims an 11-year installed base across thousands of provider
              organizations, Syllable markets production-grade uptime and outreach ROI, and Notable plus Infinitus show
              that adjacent workflow AI is spreading across access, revenue cycle, and reimbursement. The category is
              therefore attractive enough to draw multiple credible operators, which reduces the odds that Assort can
              grow into its valuation effortlessly. Compliance and governance also matter to the valuation downside
              because the product sits on PHI-heavy, scheduling-sensitive workflows. Without public ARR, margin, or
              retention data, investors cannot tell whether Assort is software-scalable enough to merit a durable
              premium or whether support cost, procurement friction, and workflow QA will eventually compress the
              narrative.
