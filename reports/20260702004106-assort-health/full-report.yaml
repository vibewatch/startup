  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Assort is selling a patient-journey platform, not a single scheduling bot
        blocks:
          - type: paragraph
            body: >-
              Assort's current product story is broader than “AI answers the phone.” The strongest official record now
              describes a four-product patient-journey platform spanning inbound patient access, outbound outreach,
              back-office orchestration, and staff-assist tooling. Concierge owns inbound calls, chat, and scheduling
              requests; Activate owns proactive outreach across phone, text, and email; Orchestrate is described as the
              layer that runs operational work behind each visit; and Empower is framed as an AI copilot for staff
              handling complex exceptions. The practical workflow coverage is correspondingly wide: appointment booking,
              intake, referrals, document processing, medication refills, payments, eligibility, and other front-door
              tasks that often break when each channel is siloed. The product thesis is that Patient Journey Memory and
              Synapse let those tasks share context rather than restart every time a patient switches channels or
              returns later. That matters because the company is positioning differentiation around continuity,
              specialty rules, and operational coverage, not around a generic voice bot alone. The platform pages and
              launch materials consistently reinforce that broader framing, while still leaving some technical internals
              opaque.
