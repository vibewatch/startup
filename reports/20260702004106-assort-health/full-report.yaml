  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Shows how Assort typically enters an account through access pain, then broadens into outbound campaigns and
      specialty-specific workflows.
    data:
      items:
        - id: stage-1
          label: Backlog or leakage pain
          actor: Practice leadership
          description: The trigger is usually dropped calls, long holds, voicemail backlog, or unscheduled referrals.
          channels:
            - Calls
            - Voicemail
            - Referral queues
        - id: stage-2
          label: Initial deployment
          actor: Access or call-center team
          description: Assort is introduced as an inbound scheduling or triage layer tied into practice systems.
          channels:
            - Inbound voice
            - EHR scheduling
            - Warm handoff
        - id: stage-3
          label: Expansion into outreach
          actor: Operations and revenue teams
          description: Accounts with early inbound success add outreach campaigns for refills, waitlists, or care gaps.
          channels:
            - Phone outreach
            - Text
            - Email
        - id: stage-4
          label: Workflow specialization
          actor: Specialty operations
          description: The account value increases when complex specialty rules are encoded and trusted.
          channels:
            - Orthopedics
            - Dermatology
            - Retina
            - FQHC
        - id: stage-5
          label: Durability question
          actor: Finance and leadership
          description: Renewal quality and expansion economics are largely absent from the public record.
          channels:
            - Renewal data not public
            - Contract data not public
    approximationNotes: This journey maps the public evidence pattern, not a universal customer lifecycle for every account.
    claimRefs:
      - CU008
      - CU014
      - CU024
      - CU041
      - CU047
      - CU049
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: standard
    summary: >-
      Public proof narrows from broad provider footprint into a smaller set of named accounts with rich KPI detail and
      then into an even smaller set with independent corroboration.
    data:
      nodes:
        - id: n1
          label: Broad provider footprint
          detail: More than 5,000 providers in production and 1,000+ on Activate.
          tone: positive
        - id: n2
          label: Named customer stories
          detail: A multi-specialty set of public reference accounts exists.
          tone: positive
        - id: n3
          label: Metric-rich stories
          detail: SENTA, Annapolis, Chesapeake, Barrington, and others publish measurable outcomes.
          tone: positive
        - id: n4
          label: Independently echoed metrics
          detail: Only some stories, especially Annapolis and SENTA outreach, have outside repetition.
          tone: neutral
        - id: n5
          label: Durable renewal visibility
          detail: NRR, churn, contract length, and concentration are still missing.
          tone: warning
      edges:
        - from: n1
          to: n2
          label: Footprint becomes logos
        - from: n2
          to: n3
          label: Logos become outcomes
        - from: n3
          to: n4
          label: Some metrics gain outside repetition
        - from: n4
          to: n5
          label: Durability still unproven publicly
    approximationNotes: The funnel is about evidence quality, not a literal sales funnel conversion rate.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU011
      - CU023
      - CU041
      - CU049
      - CU052
