              Orthopedics shows the same access problem inside a growing specialty practice that then joined a larger
              orthopedic MSO. The hands-on users are schedulers, referral coordinators, call-center teams, and
              front-office staff, but budget ownership appears shared across operations leaders, finance-minded
              executives, and practice leadership because the purchase logic blends patient experience, labor capacity,
