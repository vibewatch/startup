  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Mark and What Is Actually Hard Fact
        blocks:
          - type: paragraph
            body: >-
              Valuation work on Assort has to start with discipline about what is truly known. The clean fact set is
              short. Assort announced a $120 million Series C on June 24, 2026 at a $1.2 billion valuation, and multiple
              independent outlets repeated the same mark and more than $222 million of total capital raised. Public
              sources also say revenue grew 20x over the prior 15 months and that the platform now extends far beyond
              inbound scheduling. What is missing is just as important. No approved cached source discloses current
              revenue, ARR, gross margin, NRR, concentration, or the exact quality of the term sheet. That means the
              current price is a real market event, not a fully underwritable intrinsic-value answer. In practical
              terms, investors can use the $1.2 billion round as the current clearing price, but they cannot honestly
              defend fine-grained multiple work or treat the number as obviously cheap without additional company data.
            claimRefs:
              - CV001
