        title: Financial Verdict and Blockers
        blocks:
          - type: paragraph
            body: >-
              The public financial verdict is positive but still only medium-confidence. Assort appears to have a
              compelling recurring workflow platform, unusually strong customer-outcome proof for a private company, and
              a very well-supported recent capital base. That combination is enough to argue that the business probably
              has real revenue traction and a viable path to large-enterprise expansion. It is not enough to complete
              underwriting. The company does not publicly disclose ARR, GAAP revenue, gross margin, cash, burn, runway,
              debt, CAC payback, NRR, or GRR. The public economics narrative is therefore asymmetric: we can see
              examples of value created for customers, but not the extent to which Assort captures that value in
              durable, high-margin, recurring revenue. Investors should treat the chapter’s conclusion as directionally
              constructive but still gated on management disclosure of contract mechanics, retention, liquidity
