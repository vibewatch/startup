      - number: '7.3'
        title: Commercial, Competition, and Model Risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence strongly suggests Assort is solving a painful problem, but it does not yet prove the
              business is insulated from concentration or competition. The proof set is still concentrated in specialty
              groups, ambulatory practices, and outreach-heavy use cases, even as management and press coverage position
              the company for larger health-system deployments. Assort's own newer referral-management and
              specialty-intake guides reinforce that concentration because they still center urgency-aware specialty
              routing, authorization checks, misbooking prevention, and EHR/PMS integration more than broad
              hospital-enterprise standardization. That is a real scaling step, not just a larger version of the same
              sale. At the same time, the competitive set is broader than obvious startup peers. Hyro advertises
              health-system traction and measurable abandonment savings; Artera claims an 11-year installed base across
              specialties and EHRs; Syllable markets production-grade uptime and outreach ROI; Notable and Infinitus
              cover adjacent access, revenue-cycle, and reimbursement workflows. Against that backdrop, Assort's public
              economics remain thin. Investors can see fundraising, growth velocity, and provider-count claims, but not
              current ARR, margins, retention, customer concentration, or full-platform penetration. That keeps the
              model dependent on continued execution and continued access to capital rather than on already-proven
              financial durability.
            claimRefs:
