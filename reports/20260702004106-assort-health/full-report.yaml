      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers are tangible and near-term: labor shortages, front-office churn, missed-call leakage,
              referral backlogs, no-shows, and the inability to provide 24/7 access without expensive staffing.
              Third-party and customer-case evidence in the fetched set suggests real ROI is possible when AI systems
              reduce hold times, increase conversion, and keep schedules full without adding headcount. But the
              constraints are equally real. HIPAA privacy and security obligations make compliance non-optional.
              Deployment quality matters because poor EHR integration, weak handoffs, or shallow specialty logic can
              create misbookings and rework instead of savings. Assort's own voice-AI article cites Gartner on high
              agentic-AI project cancellation risk, which is a reminder that interest does not guarantee durable
              adoption. The biggest diligence holes are still neutral pricing benchmarks, segment-level budgets, and
              independent penetration data; until those are public, valuation should lean on the narrow workflow wedge
              and observed operating pain rather than on a heroic headline TAM. Buyers also need a practical sequencing
              plan, because the first budget usually follows the workflow with the clearest baseline pain, easiest
              integration path, and most defensible ROI evidence rather than the broadest narrative about AI
              transformation.
