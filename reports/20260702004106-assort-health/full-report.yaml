      - number: '4.1'
        title: Revenue Model and Module Breadth
        blocks:
          - type: paragraph
            body: >-
              Assort’s public financial story starts with product breadth rather than with an explicit price sheet. The
              company markets a continuous patient-journey platform that spans scheduling, triage, intake, outreach,
              referrals, and payment resolution, with individual pages describing EHR-integrated workflow automation
              rather than consulting-heavy implementation projects. That makes the most plausible public interpretation
              a recurring software or usage-linked model attached to patient-access workflows. The product pages
              repeatedly emphasize always-on volume handling, direct EHR writes, real-time eligibility checks, and
              outbound follow-through, all of which look like monetizable recurring modules. What the public file does
              not provide is equally important: there is no visible official list price, no modular SKU matrix, and no
              public contract archetype. As a result, pricing must be inferred from workflow depth and outcome claims
              rather than directly observed from a published rate card. This is enough to support a likely
              SaaS-plus-usage thesis, but not enough to underwrite realized pricing power or discounting behavior.
