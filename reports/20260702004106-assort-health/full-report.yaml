    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding Timing, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Assort Health’s public identity is coherent on what it sells but not perfectly clean on when to date the
              company’s origin. The homepage and platform pages consistently frame Assort as an AI patient-access
              platform spanning scheduling, intake, triage, referrals, and billing across more than 22 specialties, with
              scale backed by more than 190 million patient interactions. The strongest public headquarters signal is
              San Francisco via the careers page, while the product-origin story is better documented than the
              legal-incorporation story. Yahoo Finance and Wilson Sonsini both point to a 2023 founding, and Fierce says
              the commercial launch came in November 2023. Because the prompt referenced 2022 but the fetched public
              record repeatedly points to 2023 plus a late-2023 launch window, the safest treatment is to preserve 2022
              as unresolved timing rather than invent certainty. The seed announcement and Menlo’s investment essay also
              show the company was built around specialty-specific call-center complexity rather than generic chatbot
              automation.
