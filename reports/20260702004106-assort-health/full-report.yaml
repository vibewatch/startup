      - number: '1.4'
        title: Milestones, Adverse Context, and Disclosure Caveats
        blocks:
          - type: paragraph
            body: >-
              The milestone record is strong enough to anchor later chapters, but it should be read with explicit
              caveats. Assort’s official record shows an origin as a healthcare call-center AI solution, then a rapid
              broadening into a patient-journey platform with payments, referrals, document processing, and
              health-system expansion. Menlo’s essay and CAQH’s index support the category thesis that administrative
              waste at the front door of healthcare is a very large spend problem. At the same time, skeptical and
              compliance-oriented sources introduce real limits. Out-Of-Pocket argues that appointment scheduling
              remains the hardest workflow and that ROI depends on getting the hard edge cases right, while the ABA and
              HHS materials remind diligence readers that HIPAA, authorization, and training-data governance can become
              material risks. Even some company surfaces show lag: the careers page still references a Series B stage
              after the Series C had already closed. The overview, therefore, supports strong momentum but not a
              frictionless governance or compliance story.
