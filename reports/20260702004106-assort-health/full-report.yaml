  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Privacy, and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              Assort's product touches some of the most sensitive edges of outpatient healthcare: patient identity,
              symptoms, eligibility, referrals, follow-up timing, and call outcomes that often need to land inside an
              EHR. That matters because the legal baseline is not optional. HHS says systems that maintain or transmit
              ePHI must satisfy administrative, physical, and technical safeguards, and recent healthcare-AI guidance
              argues that AI assets interacting with ePHI should be inventoried and folded into live risk analysis. The
              privacy surface is wider than classic scheduling bots because the public product story spans intake,
              medication refills, lab results, payments, and multimodal outreach. Public compliance commentary also
              shows that FTC, DOJ, and other agencies can shape liability through claims, privacy, and bias theories
              even if a product is not marketed as a medical device. Assort likely benefits from operating in a category
              with urgent ROI, but that same urgency will not spare it from procurement drag if buyers cannot verify
              business-associate terms, patient notices, model governance, or incident handling beyond marketing
              surfaces.
            claimRefs:
