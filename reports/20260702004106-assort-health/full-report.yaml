  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Assort should be evaluated inside a narrow patient-access automation wedge, not the whole healthcare AI
              landscape. The relevant workflows are the phone-heavy, front-office jobs that determine whether a patient
              reaches the right appointment with the right prep and follow-through: scheduling, intake, triage,
              referrals, reminders, outreach, billing questions, and related routing. The fetched set repeatedly
              distinguishes this work from generic chatbot software, broad contact-center tooling, and clinical AI
              because specialty access depends on real-time EHR connectivity, insurance and referral logic, and
              provider-specific rules. That boundary matters because the dominant substitutes are still human front
              desks, outsourced call centers, legacy IVR, portals, and reminder products, all of which solve slices of
              the workflow but usually not the whole specialty journey. The phone remains core because complex visits,
              referral chains, and older or sicker populations still pull demand back to live interactions even after
              digital-front-door investments.
