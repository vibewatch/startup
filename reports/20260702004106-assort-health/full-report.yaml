        title: The main technical risks are PHI handling, hallucination or misrouting, and undocumented assurance layers
        blocks:
          - type: paragraph
            body: >-
              Trust is where the marketing record is thinner than the workflow record. The good news is that the product
              clearly operates in areas where HIPAA obligations are obvious, and outside sources make those expectations
              concrete: electronic PHI, privacy constraints, and overlapping agency scrutiny are table stakes for any AI
              agent that books visits, handles intake, or routes clinical questions. Assort also has public BAA,
              privacy-policy, and patient-privacy-policy endpoints, which at least shows awareness of the trust surface.
              But the public cache remains weak on the details an investor or buyer would want before underwriting
              clinical or enterprise-scale risk. No reviewed source disclosed SOC 2 or ISO 27001 posture, model-vendor
              dependence, hallucination-rate measurement, sync-latency data, or quantified rollback/error-handling
              rates. Independent risk framing from the ABA, Censinet, Protecto, and Out-Of-Pocket reinforces why those
              omissions matter: generative systems can mishandle PHI, hide edge-case failures, or create deceptive
              confidence if escalation controls are weak. Assort appears more workflow-specific than generic voice-AI
              peers, but difficult specialty workflows and PHI-heavy handoffs still require diligence beyond public
              product copy.
