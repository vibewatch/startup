      - number: '3.3'
        title: Capability, Packaging, and Trust Comparison
        blocks:
          - type: paragraph
            body: >-
              Competitive posture diverges sharply once the analysis moves from general AI-agent claims to the details
              of channel breadth, workflow depth, packaging, and trust. Assort's orthopedic and dermatology pages
              suggest a product designed around protocol complexity, whereas Syllable and Hyro are better read as
              horizontal communications or orchestration layers. Notable and Artera look more suite-like because they
              frame adjacent workflows and financial outcomes alongside patient-access use cases. Pricing evidence is
              notably thin: the fetched peer sites do not publish standardized list pricing, and even Hello Patient's
              financing coverage offers scale data rather than an apples-to-apples packaging benchmark. That absence is
              itself competitively relevant because it means buyer evaluation will likely hinge on proofs of workflow
              fit, implementation risk, and referenceability more than on transparent list-price tables. Trust also
              matters because HIPAA safeguards, handoffs, and auditability are part of the product, not just the sales
              deck.
