        title: Buyers, Users, and Budget Owners
        blocks:
          - type: paragraph
            body: >-
              The buyer map is broader than a single call-center software budget. Assort's own materials and 2026 news
              coverage point to specialty groups, provider groups, health systems, community-based organizations, and
              academic medical centers, while other fetched Assort materials explicitly name FQHCs and show MSO-style
              operators using similar workflows. SENTA demonstrates the MSO archetype most clearly: a multi-practice ENT
