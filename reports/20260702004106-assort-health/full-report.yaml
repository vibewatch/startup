  - id: FR002
    title: Risk Transmission Map
    type: dag
    layout: wide
    summary: >-
      The key downside path runs from workflow or governance failure into trust, procurement friction, slower expansion,
      and a weaker financing story.
    data:
      nodes:
        - id: workflow
          label: Workflow Error
          detail: Wrong scheduling, routing, or triage execution
        - id: privacy
          label: Privacy / Governance Gap
          detail: Weak documentation, controls, or oversight evidence
        - id: trust
          label: Customer Trust Shock
          detail: Patients or operators lose confidence
        - id: procurement
          label: Procurement Friction
          detail: Security and legal review lengthens
        - id: growth
          label: Growth Compression
          detail: Slower deployment and weaker expansion
        - id: valuation
          label: Valuation Pressure
          detail: Narrative weakens before economics are fully visible
      edges:
        - from: workflow
          to: trust
          label: causes
        - from: privacy
          to: procurement
          label: triggers
        - from: trust
          to: growth
          label: slows
        - from: procurement
          to: growth
          label: slows
        - from: growth
          to: valuation
          label: feeds
    claimRefs:
      - CR012
      - CR015
      - CR031
      - CR032
      - CR036
      - CR044
  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      The valuation call flows from a credible unicorn mark through strong operating proof into an ultimately stretched
      but watch-worthy conclusion.
    data:
      nodes:
        - id: mark
          label: Hard Current Mark
          detail: June 2026 Series C at $1.2B
        - id: proof
          label: Operating Proof
          detail: 20x growth, 190M interactions, 5,000+ providers, broad workflow surface
        - id: opacity
          label: Economic Opacity
          detail: ARR, margin, NRR, concentration, and term-sheet quality undisclosed
        - id: risk
          label: Competitive / Compliance Pressure
          detail: Strong rivals and real governance burden cap upside
        - id: output
          label: Track / Research-More
          detail: Respect the company, not the price as attractive yet
      edges:
        - from: mark
          to: proof
          label: supported by
        - from: proof
          to: opacity
          label: offset by
        - from: opacity
          to: risk
          label: amplified by
        - from: risk
          to: output
          label: leads to
    claimRefs:
      - CV001
      - CV005
      - CV009
      - CV015
      - CV025
      - CV027
      - CV036
