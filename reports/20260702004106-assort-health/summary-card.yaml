summary:
  headline: >-
    Assort Health shows real product-market pull in healthcare patient access, but opaque unit economics and meaningful
    privacy, workflow-safety, and competitive risks keep the current $1.2B mark in watchlist territory rather than clear
    buy territory.
  overallScore: 6.8
