evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-ambiguity
    missingEvidence: >-
      Authoritative incorporation or first-commercial-revenue documentation that cleanly reconciles the prompt’s 2022
      timing with fetched public sources pointing to 2023 and November 2023 launch.
    whyItMatters: Later chapters need a stable chronology anchor; asserting 2022 as settled fact would overstate confidence.
    diligencePath: Request formation docs, first payroll date, or board-approved company history from management.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: A full board roster, voting-control map, protective provisions, and investor-information-rights summary.
    whyItMatters: Without board and control detail, it is hard to assess founder dependence, investor leverage, or governance risk.
    diligencePath: Ask for the current board deck cover page, cap-table summary, and charter/right-side letters.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: trust-surface
    missingEvidence: >-
      Public or diligence-room evidence of certifications, security controls, and AI-governance operating procedures
      beyond basic privacy and BAA pages.
    whyItMatters: >-
      Healthcare workflow automation touches sensitive patient data, so trust controls materially affect underwriting
      and enterprise sales confidence.
    diligencePath: >-
      Request security overview, audits, certification scope, model-governance policies, and incident-response
      commitments.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: minor
    topic: private-metrics-gap
    missingEvidence: Current headcount, cash balance, and runway metrics tied to the post-Series-C plan.
    whyItMatters: These cover facts shape scale interpretation and help connect the overview to the financial chapter.
    diligencePath: Request the latest KPI dashboard or monthly operating review with headcount and liquidity snapshots.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
