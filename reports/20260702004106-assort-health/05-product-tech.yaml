company:
  name: Assort Health
chapter:
  number: 5
  title: Product & Technology
  summary: 'Assort Health''s public product record supports a real patient-journey platform rather than a single voice bot. Concierge and Activate are the most concrete surfaces, while Orchestrate, Empower, Synapse, and Patient Journey Memory extend the thesis into multichannel workflow continuity, specialty-specific execution, and operational orchestration. The biggest diligence gaps are not feature existence but trust depth: PHI governance, hallucination or misrouting measurement, integration reliability, and enterprise assurance remain under-disclosed in public sources.'
sections:
- id: platform-scope-and-product-map
  title: Assort is selling a patient-journey platform, not a single scheduling bot
  body: 'Assort''s current product story is broader than “AI answers the phone.” The strongest official record now describes a four-product patient-journey platform spanning inbound patient access, outbound outreach, back-office orchestration, and staff-assist tooling. Concierge owns inbound calls, chat, and scheduling requests; Activate owns proactive outreach across phone, text, and email; Orchestrate is described as the layer that runs operational work behind each visit; and Empower is framed as an AI copilot for staff handling complex exceptions. The practical workflow coverage is correspondingly wide: appointment booking, intake, referrals, document processing, medication refills, payments, eligibility, and other front-door tasks that often break when each channel is siloed. The product thesis is that Patient Journey Memory and Synapse let those tasks share context rather than restart every time a patient switches channels or returns later. That matters because the company is positioning
    differentiation around continuity, specialty rules, and operational coverage, not around a generic voice bot alone. The platform pages and launch materials consistently reinforce that broader framing, while still leaving some technical internals opaque.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE022
  - CE023
  - CE050
