  title: Technology / operating architecture table
  columns:
  - layer / component
  - public role
  - named dependency
  - risk
  rows:
  - - Channel surfaces
    - Voice, web chat, two-way texting, phone outreach, and email outreach
    - Concierge, Activate, Continuous Patient Conversations
    - Channel parity may be uneven when new flows launch
  - - Context and memory layer
    - Carries prior interaction context and patient-journey state across sessions
    - Patient Journey Memory and Synapse
    - Memory errors or stale context could misroute patients
  - - Workflow logic layer
    - Applies specialty, provider, payer, and urgency rules inside conversations
    - Specialty playbooks for ortho, derm, ophtho, FQHC
    - Complex edge cases can still break automation
  - - Execution and escalation layer
    - Books appointments, writes tasks, or hands off to humans
    - Real-time EHR sync and warm handoff
    - Public rollback and failure-handling details are missing
  - - Eligibility and billing layer
    - Checks coverage and collects payment-related data
    - Eligibility verification and insurance-card capture
    - PHI and billing data increase compliance exposure
  - - Integration layer
    - Connects the workflow engine into practice systems
    - Epic, athenahealth, eClinicalWorks, NextGen, ModMed, Nextech, 15+ integrations
    - Named integrations do not prove equivalent depth or uptime
