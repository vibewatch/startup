  - - Activate
    - Outreach teams and revenue / care-gap owners
    - Publicly launched outbound product
    - Phone, text, and email outreach tied to waitlists, reactivation, payments, and care gaps
    - Independent proof of durable ROI is still thin
  - - Orchestrate
    - Operations teams and workflow owners
    - Described in June 2026 platform narrative
    - Runs operational work behind each visit instead of stopping at conversation handoff
    - Specific UI, task model, and throughput metrics are not public
  - - Empower
    - Human schedulers and exception handlers
    - Described in June 2026 platform narrative
    - AI copilot framing for complex patient work rather than simple automation only
    - No public screenshots or quantified productivity benchmarks
  - - Patient Journey Memory / Synapse
    - All channel surfaces
    - Core shared platform layer
    - Context carry-forward across touchpoints using specialty-trained workflow memory
    - Memory retention limits and governance controls are not public
  - - Referral automation
    - Referral coordinators and specialty practices
    - Public use-case page live
    - Immediate outbound scheduling across phone, text, and email with persistent follow-up
    - No public conversion benchmark by specialty mix
  - - Medication refill and task routing
    - Clinical support staff and patients
    - Public use-case pages live
