- id: specialty-depth-and-deployment-maturity
  title: Depth is most believable where Assort exposes specialty workflow logic and multichannel automation
  body: Assort's credibility rises when the product copy leaves generic “AI for healthcare” language and shows specialty constraints that a real scheduler or access team would care about. Orthopedics is documented with acute-injury routing, workers' comp intake, post-op global-period logic, and imaging-linked scheduling. Dermatology materials expose cosmetic-versus-medical routing, iPLEDGE windows, Mohs coordination, and recurring cosmetic recall. Ophthalmology and FQHC pages name concrete workflow surfaces plus explicit EHR sets. The product line also expands beyond scheduling into referral automation, medication refills, and structured task routing, which is important because patient-access pain is rarely solved by answering the first call only. Multichannel outreach and call-parallelism claims are also increasingly explicit, especially in Activate, referral automation, and refill handling. Taken together, the public record supports a product with real specialty workflow coverage and multiple
    production surfaces. The remaining maturity question is not whether there is a platform, but how consistently that automation holds across difficult edge cases and whether all of the publicly named specialties are equally battle-tested.
