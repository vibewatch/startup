  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture-memory-and-integrations
  title: The technical center of gravity is context carry-forward, workflow logic, and EHR-connected execution
  body: 'The platform record is most concrete where Assort explains how work is executed rather than where it markets AI in the abstract. Concierge and the triage stack claim real-time EHR sync, provider-specific rules, urgency-aware routing, and warm handoff summaries so staff do not restart the patient conversation. Intake and payment workflows go further by pushing eligibility checks into the interaction itself and supporting insurance-card capture mid-call. Continuous Patient Conversations extends that operating model across website chat and two-way texting so the same workflow can continue across sessions and channels. Public integration evidence is still mostly enumerative rather than deeply technical, but it is meaningful: the homepage highlights 15+ integrations, and specialty pages explicitly name Epic, athenahealth, eClinicalWorks, NextGen, ModMed, and Nextech in settings where those integrations matter. The result is a visible architecture pattern: channel layer on top, context
    and workflow memory in the middle, EHR-connected execution underneath. What the public record still does not disclose is latency, rollback behavior, and failure-rate telemetry when those handoffs break in production.'
