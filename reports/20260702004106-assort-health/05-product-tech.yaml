  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: security-certifications
    missingEvidence: Current SOC 2, ISO 27001, HITRUST, or equivalent security-certification evidence.
    whyItMatters: Enterprise buyers and investors need third-party assurance before underwriting PHI-heavy automation at scale.
    diligencePath: Request current security-report packet and procurement-ready assurance documents from the company.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: model-risk-metrics
    missingEvidence: Assort-specific hallucination, misrouting, false-escalation, and safety-override metrics by workflow.
    whyItMatters: The hardest product risk is not the presence of AI but the rate and severity of edge-case failures in specialty workflows.
    diligencePath: Request validation dashboards, red-team results, and error-taxonomy metrics by specialty and channel.
    relatedQuestionRefs:
    - QE021
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: integration-reliability
    missingEvidence: Public documentation on EHR sync latency, rollback controls, uptime, and exception handling.
    whyItMatters: Integration failure can silently create misbookings, stale context, or duplicate work even when the voice layer sounds good.
    diligencePath: Request implementation docs or customer-facing SLA material covering sync timing and failure recovery.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: minor
    topic: developer-signal
    missingEvidence: Concrete public evidence on engineering org depth, open roles, or developer documentation.
    whyItMatters: The careers page alone is too thin to judge build velocity or internal technical specialization.
    diligencePath: Request current org chart, job list, and product or engineering roadmap staffing plan.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE005
