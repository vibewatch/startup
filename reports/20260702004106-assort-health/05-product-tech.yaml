- id: TE002
  title: Workflow / use-case table
  columns:
  - workflow
  - current pain point
  - Assort mechanism
  - claimed benefit
  - limitation
  rows:
  - - Inbound scheduling
    - High call queues and complex provider rules
    - Concierge applies specialty-specific scheduling logic with EHR availability in real time
    - 24/7 booking without adding front-desk load
    - No public misbooking-rate benchmark
  - - Clinical triage and escalation
    - Routine and urgent calls compete for the same staff
    - AI assesses urgency, routes by context, and creates EHR tasks or warm handoffs
    - Higher containment without losing escalation context
    - No public false-negative triage rate
  - - Patient intake
    - Insurance and demographic data are often incomplete until visit day
    - Eligibility checks and insurance-card capture happen during the interaction
    - Fewer downstream corrections and rejected claims
    - OCR accuracy and exception-handling metrics are not disclosed
  - - Proactive outreach
    - Waitlists, cancellations, and care-gap campaigns are under-resourced
    - Activate campaigns patients by phone, text, and email from pending EHR items
    - More filled schedules and recovered revenue without more staff calls
    - Independently verified conversion rates are limited
  - - Referral follow-through
    - Referrals sit in queues and patients leak before booking
    - Referral automation launches outbound scheduling within minutes and keeps following up
    - Lower referral leakage and faster conversion
    - No public specialty-by-specialty referral denominator data
  - - Medication refill requests
    - Volume spikes and after-hours calls create backlog
    - AI handles calls in parallel and queues requests for staff review
    - Access continuity after hours without overnight staff
    - Clinical appropriateness still depends on downstream human review
  - - Administrative and clinical tasks
    - Simple requests crowd out higher-value staff work
    - Structured tasks route documentation, lab, post-op, or medication questions to the right team
    - Staff focus shifts to judgment-heavy work
    - No public SLA metrics for routed tasks
  notes: Benefits are taken from product pages and should be read as vendor-claimed unless separately corroborated.
