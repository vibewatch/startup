  - FU002
- id: durability
  title: Retention, Durability, and Service Intensity
  body: 'The customer operating model appears relationship-heavy. Forward-deployed analyst, mission-deployment, and SRE roles imply close support near customer environments rather than lightweight self-service expansion. That can be a feature in sensitive missions: once a vendor is embedded in a workflow, trust and delivery knowledge can make displacement difficult. It can also be a bug from a scaling standpoint if every new customer requires too much bespoke deployment effort. Public sources do not disclose renewal, churn, or contract duration, so there is no direct evidence of durability yet. The most defensible public conclusion is that Twenty may have strong relationship depth where it lands, but the market still lacks proof that this depth turns into repeatable renewal and expansion economics. Customer durability remains more of a hypothesis than a measured fact. Investors should assume that relationship depth exists only where deployment has already occurred, and that winning additional
    programs could still require meaningful incremental support effort.'
  claimRefs:
  - CU010
  - CU012
  - CU013
  - CU018
  - CU019
  - CU027
  - CU028
  - CU030
  tableRefs:
  - TU005
  figureRefs:
  - FU003
- id: friction
  title: Expansion, Concentration, and Procurement Friction
  body: The customer risks are as important as the proof. Public-sector AI procurement is slow and multi-stage even in low-sensitivity domains; offensive cyber adds more governance, review, and legal sensitivity. RAND, Taraaz, Stanford, and Lawfare-style policy work all point toward procurement friction as a first-order commercial variable. That means customer concentration can remain high for a long time, even for a company with strong flagship references. It also means land-and-expand should not be assumed just because end users like the capability. Buying authority, program structure, and oversight can interrupt that path. Publicly, there is no evidence yet of broad agency expansion or repeat awards across many units. The prudent customer verdict is therefore mission-grade proof with still-unresolved concentration and procurement-scaling risk. That is a workable starting point for diligence, but not yet a complete customer-underwriting record without internal cohort and contract data.
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
  - CU020
  - CU021
  - CU031
  - CU032
  - CU033
  - CU035
