- id: proof
  title: Named Customer Proof and Adoption Trajectory
  body: 'Public customer proof is real. TechTimes, GovCon Wire, and Forbes independently associate Twenty with USCYBERCOM and Navy work, and Forbes adds specific contract values that imply more than a speculative pilot story. That matters, because many defense startups never get beyond generic statements about working with the government. Still, the proof is narrow. The public record does not disclose how many deployments exist, how many users are active, whether those contracts renewed, or whether work expanded from research into production programs. The strongest visible adoption signal is therefore not breadth but significance: a small number of high-value or high-prestige mission references. Investors should treat this as a meaningful positive signal, but not as evidence that the company has already solved repeatable scaled adoption across many customer accounts. The available evidence is enough to support seriousness, but not enough to support claims of broad deployment scale or repeatable
    customer economics.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU011
  - CU017
  - CU024
  - CU025
  - CU029
  - CU034
  tableRefs:
