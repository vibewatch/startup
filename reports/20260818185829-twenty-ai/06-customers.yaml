callouts:
- calloutType: insight
  title: The named customers matter more than the count
  body: For a defense startup, two strategically important customer references can mean more than dozens of low-value logos. The public challenge is not mission relevance; it is proving durability and repeatability.
  claimRefs:
  - CU001
  - CU007
  - CU018
  - CU024
  - CU034
- calloutType: risk
  title: Procurement friction can dominate expansion economics
  body: Even if operators value the product, procurement and authority structure can delay renewal and land-and-expand. That makes customer concentration risk hard to dismiss until renewal evidence appears.
  claimRefs:
  - CU013
  - CU016
  - CU017
  - CU020
  - CU027
  - CU035
