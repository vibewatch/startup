  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              可见客户基础很小，但逻辑一致。Twenty 公开关联到 USCYBERCOM 和美国海军，这立即把它的买方范围放进一小组国家安全组织内部。这些不是简单单线 SaaS
              客户。司令部或项目发起方可能购买，操作员和分析师可能使用，预算权力方则可能在链条的其他位置。CYBERCOM、Fleet Cyber 和 USNI
              的官方来源有助于解释为什么这一点重要：相关客户环境层级鲜明、权限敏感，并由任务牵引。WVU
              合作在人才和研究协作周围增加了一层生态，但没有改变一个事实：唯一清晰可见、能产生收入的客户仍是政府实体。因此，Twenty
              的客户分层最好按任务角色和采购权限来框定，而不是按普通企业垂直行业或泛商业用户画像。销售动作也因此天然更窄、更慢，并且比典型商业软件市场更依赖项目权限。
