  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接对手、既有承包商、相邻玩家和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Twenty 面对的不是一个干净的同业集合。公开材料至少显示四类相关玩家。第一类是 Booz Allen、CACI、Leidos、L3Harris
              等联邦网络既有承包商，它们已经向政府任务销售网络能力，并能打包产品、服务、涉密资质和合同载体。第二类是 Horizon3、Pentera、Synack、Cobalt
              等商业进攻性安全自动化平台，它们销售攻击路径验证、渗透测试或进攻模拟工作流。第三类是 Palo Alto Cortex 等大型防御性 SecOps 套件，它们可以用 AI
              辅助网络行动的承诺吸收预算，尽管并非任务进攻专家。第四类是 Shield AI 和 Anduril 等相邻国防 AI
              公司，即便不销售同一工作流，也会争夺现代化预算和操作员注意力。现状本身也构成竞争：当买方更看重控制、保密或既有关系，而不是独立平台时，政府内部开发、红队和服务主导的任务支持仍是可信替代方案。
