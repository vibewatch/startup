companyProfile:
  summary: >-
    Twenty 是一家私营国防科技公司，成立于 2024 年，总部位于弗吉尼亚州 Arlington。公开材料把它定位为面向美国军方和情报界的 AI
    驱动进攻性网络平台，产品主张集中在把此前依赖大量人工的任务工作流自动化。公开记录显示出有意义的战略验证：Twenty 以披露的 $38M 轮次结束隐身期，随后在 2026 年 6 月以 $1B 估值完成 $100M Series B
    融资，公开报道将 USCYBERCOM 和美国海军列为客户参考。核心承销缺口不在于这个品类是否重要，而在于私有的收入、毛利率、续约和控制质量数据能否支撑当前估值和风险组合。
