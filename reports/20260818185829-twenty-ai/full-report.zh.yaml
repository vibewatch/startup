      - number: '8.2'
        title: 这个价格需要收入分母，但公开记录还没证明
        blocks:
          - type: paragraph
            body: >-
              核心估值问题很简单：只有 Twenty 已经搭起足够大、足够耐久的收入基础，$1 billion 标记才可能合理。上市可比公司说明了这种支撑通常长什么样。CrowdStrike、SentinelOne 和
              Palo Alto 都会披露收入、经常性收入、毛利率、现金流、积压订单和产品扩张中的若干项。Booz Allen、Leidos 等防务导向可比公司，也披露积压订单、客户结构、指引和预算流程风险。Twenty
              目前没有公开披露任何等价的经济锚。因此，投资者只能反推所需分母，而不是直接验证。按 5x 收入计算，当前估值意味着年收入大约 $200 million；按 10x，是 $100 million；按 15x，仍约为
              $67 million。公开来源没有证实 Twenty 已经达到其中任一水平。当前价格仍可能成立，但前提是非公开的收入和续约图景显著好于今天公开记录呈现的样子。
