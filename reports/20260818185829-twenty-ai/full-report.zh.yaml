            body: >-
              有可信迹象表明，Twenty 正在构建一个真实运行平台。公司招聘的不只是工程师，也包括产品、安全、SRE
              和任务交付人员。纯概念阶段原型很难合理化这种组合。它说明产品需要在客户场景中部署、支持并保持可靠。不过，公开成熟度记录仍有限。本次审阅来源中没有可见的公开文档、更新日志、API
              参考、正式可用性披露、基准测试或客户技术案例。因此，可靠性主张仍更像愿景，而不是被测量过的事实。合理解读是，Twenty
              内部可能有相当多产品活动和真实部署，但外部技术表面被有意保持稀疏。对敏感国防公司来说，这可能合理；但外部投资者能用来验证成熟度和实施摩擦的直接材料也更少。实际操作中，尽调必须更多依赖内部演示、部署走查和客户技术访谈，而不是企业软件投资者习惯看到的公开文档链条。
