      - number: '1.2'
        title: 创始人、领导层与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Twenty 的领导阵容是尽调材料中公开证据最强的部分之一。关于页面和个人履历列明，Joe Lin 是联合创始人兼 CEO，Leo Olson 是联合创始人兼 CTO，Skyler Onken
              是联合创始人兼产品副总裁，Pete Sorrentino 是联合创始人兼增长副总裁。Joe Lin 在 Expanse 以 $1.25 billion 出售后曾任 Palo Alto Networks
              产品管理副总裁，领导过 Expanse 的 National Security Division，服役于美国海军预备役，并曾在 RAND 工作。Leo Olson 领导过交付 Palo Alto Networks
              首个网络行动能力的工程团队，此前在美国陆军情报和网络岗位任职，覆盖 INSCOM、USCYBERCOM 和 NSA。Skyler Onken 是美国军方首批 Master Cyber Operators 之一，在
              U.S. Cyber Command 和美国陆军工作超过十年。Pete Sorrentino 则带来 Palo Alto Networks Cortex 业务的业务拓展和客户规模化经验。


              更广的高管团队也更像是为国防软件公司搭建，而不是纯研究实验室。Dan Quinlan 曾把 Expanse 做到被收购，之后在 Retool、Dropbox 和 Meraki 工作；Adam Howard
              带来国会、政策和 National Security Council 过渡经验；Kevan Dunsmore 具备大规模工程经验，并被明确要求在 Arlington 和 New York
              交付进攻性网络平台。反复出现的领导层模式，是前政府作战可信度与 Expanse / Palo Alto 商业化经验相结合。在这个市场里，政府信任、涉密准入以及把操作员需求翻译成软件的能力，与原始 AI
              能力同样重要；这种组合是实质优势。


              主要缺口在治理深度。公开材料充分展示了操作员履历，但很少披露董事会构成、独立监督和正式治理结构。Accel 的投资札记反复强调可信政府关系和团队质量，但在本次审阅来源中没有找到公开董事会名单。Twenty
              构建的是进攻性网络能力，这种治理不透明并不致命，却会让关键人风险和监督集中度落到 Joe Lin 及创始团队身上。
