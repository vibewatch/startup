              公开材料中最强的财务事实，是融资支持。Twenty 在 2025 年融资 $38 million，又在 2026 年融资 $100 million，意味着累计披露资本至少 $138
              million。对一家年轻国防科技软件公司来说，这很可观，也可能给管理层时间去追逐比企业安全交易更难、更慢成交的项目。但融资公告不是现金余额披露。本次审阅没有任何公开来源说明当前账上现金、月度烧钱速度或现金跑道。公开网络安全可比公司展示了规模差距：SentinelOne
              和 Rapid7 披露数亿美元季度收入、数亿美元到超过 $1 billion 的现金，以及成熟的利润率报告。Twenty
              还没有这种公开透明度。因此，财务解读应保持平衡：已融资金额降低了近期融资压力，但烧钱和收入数据缺失，意味着下一轮融资依赖问题仍未解决，而不是已经解决。
