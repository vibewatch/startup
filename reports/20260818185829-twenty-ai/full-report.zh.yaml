      - - 客户集中
        - 旗舰项目不续约或转化延迟
        - 具名客户停滞或收缩
        - 下调收入信心和护城河假设
      - - 财务不透明
        - 烧钱速度或利润率披露不及预期
        - 资本使用显著弱于预期
        - 下调公允价值，并提高融资风险权重
      - - 执行带宽
        - 规模扩大后支持强度仍高度定制
        - 实施工作无法标准化
        - 下调软件倍数假设
    notes: 本表把分散的公开担忧转成明确的投资人监控规则。
    claimRefs:
      - CR034
      - CR035
      - CR036
      - CR037
