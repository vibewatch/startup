  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Twenty 交付什么，服务谁
        blocks:
          - type: paragraph
            body: >-
              Twenty 的产品应被理解为任务工作流系统，而不是通用网络安全功能。官网、Series A、Series B 和投资人材料都围绕服务美国及盟友任务的工业规模网络行动来描述公司。语言很明确：Twenty
              想把过去需要数周人工劳动的工作流，改造成跨数百个目标持续自动化运行的行动。招聘文案也强化了目标用户是操作员和分析师，而不是普通企业安全管理员。这个框架很重要，因为它收窄了产品成功的定义。公司不是在承诺更好的
              SOC
              仪表盘，也不是给企业防御者做边际工作流自动化；它承诺的是在敏感任务环境里提高进攻性网络吞吐能力。这让产品定义异常雄心勃勃，也异常垂直，更接近任务系统，而不是标准安全应用。每一次尽调对话都应尽早用这个区别定锚。它也解释了为什么招聘岗位强调面向任务的职能，而不是传统增长或泛企业管理角色。
