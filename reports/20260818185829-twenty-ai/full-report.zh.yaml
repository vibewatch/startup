              岗位意味着公司在客户环境附近提供紧密支持，而不是靠轻量自助服务扩张。在敏感任务中，这可以是优点：一旦供应商嵌入工作流，信任和交付知识会让替代变难。从扩张角度看，这也可能是缺点，如果每个新客户都需要过多定制部署工作。公开来源没有披露续约、流失或合同期限，因此还没有耐久性的直接证据。最站得住脚的公开结论是，Twenty
              在已落地客户处可能有很强关系深度，但市场仍缺少证据证明这种深度会转化为可重复续约和扩张经济性。客户耐久性更像假设，而不是被测量过的事实。投资者应假设，关系深度只存在于已经部署的地方；赢得更多项目仍可能需要有意义的增量支持投入。
