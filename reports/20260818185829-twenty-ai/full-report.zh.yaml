  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Twenty 实际进入的市场
        blocks:
          - type: paragraph
            body: >-
              不应把 Twenty 归为普通网络安全公司。更广的国防网络安全市场包括零信任、终端、云、网络防护、托管服务和国防工业基础安全。分析机构把这个大类在 2026 年的规模放在 $20 billion
              以上，但这些数字会夸大 Twenty 真正相关的市场，因为公司不销售通用网络卫生或传统 SOC 工具。公开来源把它放在更窄的品类里：由商业公司交付、AI
              驱动，并支持政府操作员进攻性或进攻相邻网络任务工作流的软件。TechTimes 和 Axios 都强调进攻性网络，而不是企业防御；Accel
              则描述了一个面向美国机构的端到端网络行动平台。因此，正确的市场视角是分层的：最外层是广义国防网络安全，其次是 DoD 网络空间行动预算，再到进攻性和情报相邻网络能力池，最后才是更窄、能吸收 Twenty
              这类商业平台的部分。外层大且在增长；最内层战略重要，但小得多、更集中，也更受权限约束。
