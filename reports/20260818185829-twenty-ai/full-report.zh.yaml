              还给出具体合同金额，说明这不只是投机性的试点故事。这一点重要，因为许多国防初创公司始终停留在「与政府合作」的泛泛表述上。不过，证据仍很窄。公开记录没有披露已有多少部署、多少活跃用户、合同是否续约，或者工作是否已经从研究扩展到生产项目。因此，最强的可见采用信号不是广度，而是重要性：少量高价值或高声望的任务参考。投资者应把这视为有意义的正向信号，但不能把它当作公司已经在许多客户账户中解决可重复规模化采用的证据。现有证据足以支持认真度，却不足以支持广泛部署规模或可重复客户经济性的主张。
