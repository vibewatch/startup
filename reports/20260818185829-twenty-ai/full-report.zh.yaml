              风格的政策研究都指向同一点：采购摩擦是一阶商业变量。这意味着，即便一家公司的旗舰客户参考很强，客户集中度也可能长期保持高位。它还意味着不能因为终端用户喜欢能力，就默认能先落地再扩张。购买权限、项目结构和监督都可能打断这条路径。公开层面，目前还没有证据显示公司在广泛机构中扩张，或跨多个单位拿到重复授标。谨慎的客户结论因此是：任务级验证已经出现，但集中度和采购规模化风险仍未解决。对尽调来说，这是可工作的起点；但如果没有内部队列和合同数据，它还不是完整的客户承销记录。
