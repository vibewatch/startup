  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 重要性
      - 什么会改变判断
    rows:
      - - 稀缺的任务相关性
        - 美国国防网络需求可能快速奖励稀缺供应商
        - 需要证明稀缺需求也能转成可重复收入
      - - 旗舰客户证据
        - USCYBERCOM 和美国海军案例降低商业化疑虑
        - 需要集中度和续约数据，才能判断证据有多耐久
