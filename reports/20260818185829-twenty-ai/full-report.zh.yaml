      - number: '2.3'
        title: 增长驱动、政策顺风与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求驱动是真实的。USCYBERCOM 的 2024 AI 路线图明确瞄准规模化、分析能力提升和对手干扰。CRS 报告称，FY2026 DoD 网络空间预算请求约为 $15.1 billion，其中包括 $5.4
              billion 网络空间行动经费，以及约 $2.6 billion 的 CYBERCOM 资源。Breaking Defense 和 FY2027 预算文件随后显示，AI 专项支出大幅上台阶，专门的
              AI-for-Cyber-Operations 预算线从 FY2026 的 $5 million 提升到 FY2027 请求的 $138 million。白宫在 2026 年 3
              月的网络战略强化了同一方向：更重视进攻性和先发制人的网络能力、更重视私营部门协同，也更关注机器速度能力。但约束同样真实。Lawfare 和 Nextgov
              都显示，法律边界以及私营部门进攻性网络的含义仍存在持续不确定性。Title 10 权限和国会监督仍是政府权力，不是供应商权力。USNI Proceedings
              关于美国海军网络能力的文章又增加了第二层摩擦：客户组织可能迫切需要进攻性网络能力，却仍缺少快速购买并部署的组织成熟度。因此，Twenty 所在市场紧迫感很强，但需求、权限、预算和执行之间存在实质摩擦。
