  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险是品类结构性问题
        blocks:
          - type: paragraph
            body: >-
              Twenty 的一阶风险在于，它所在品类的规则仍在被定义。最有用的法律和政策来源都指向同一方向：进攻性网络行动并不处在一个干净、完全常态化的商业框架内，AI
              还会让治理问题更难，而不是更简单。白宫网络战略和后续私营部门授权备忘录带来需求侧动能，但没有消除政府权限与供应商能力之间的区别。这意味着，像 Twenty
              这样的公司可以具有战略相关性，同时仍会面对监督、审批路径或可接受运营范围的剧烈变化。投资者应把这视为结构性品类风险，而不只是暂时的沟通问题。如果政策制定者、审计方或客户法律顾问在事件或误用担忧之后收紧解释，即便产品需求仍真实，商业规模化也可能迅速放慢。
