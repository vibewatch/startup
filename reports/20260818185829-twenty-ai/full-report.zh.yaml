        - Accel 领投轮次降低近期融资风险顾虑
        - 需要指标证明投资人背书不只是稀缺性定价
      - - 经济性披露缺口
        - 缺少 ARR、利润率、烧钱速度和 backlog，无法给出买入判断
        - 打开数据室，或降低入场价格
      - - 法律和控制面风险
        - 政策、合规和信任缺口可能压低溢价倍数
        - 提供法律工作流、安全材料包和认证路线图
