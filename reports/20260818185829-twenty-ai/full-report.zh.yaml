  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 多机构扩张、可重复工作流、强续约、类软件毛利率
        - 当前价格跑得通，上行空间超过 $1B 标记
        - 法律边界保持稳定；交付标准化
        - 有可能，但公开证据尚未证明
      - - 基准
        - 稀缺性和客户价值真实存在，但集中度和不透明仍持续
        - 当前价格介于合理与偏高之间，安全边际有限
        - 指标仍不公开；采购和支持负担仍重
        - 最符合公开记录
      - - 悲观
        - 人力强度、法律摩擦或客户挫折限制规模
        - 当前价格被证明过高，下一轮融资压缩价值
        - 续约疲弱、事件发生或预算放缓
        - 没有私有数据前无法排除
