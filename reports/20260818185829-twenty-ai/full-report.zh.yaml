chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与运营焦点
        blocks:
          - type: paragraph
            body: >-
              对一家年轻国防初创公司来说，Twenty 的公开身份异常直接。它当前运营网站是 twenty.io；用户提供的 twenty.ai 域名解析到停放的待售域名页面，而不是公司运营网站。Twenty
              在官网称，公司在构建并规模化「现代网络冲突的软件和能力」，并在「把美国面向当下战争的武库工业化」。公司没有把自己包装成通用网络安全供应商，而是把定位放在帮助美国及其盟友以工业规模开展网络冲突的软件。官网、关于页面以及
              2025 年和 2026 年新闻稿给出的核心产品描述一致：面向美国军方和情报界的 AI 驱动端到端系统，目标是加速进攻性网络行动生命周期，同时把人类判断留在重大决策中心。


              这一公开定位很重要，因为它把 Twenty 同主流防御安全公司区分开来。关于页面认为，网络冲突已经实时、持续并以机器速度发生，美国需要为冲突而生的软件，而不是臃肿的企业 IT
              系统。独立报道也强化了这一定位。Axios 将 Twenty 描述为网络战初创公司，其不同寻常之处在于毫不回避地聚焦进攻性工具；TechTimes
              则把平台描述为一种智能体架构，为美国政府任务自动化完整网络杀伤链。Tectonic 在 2025 年 11 月的报道同样称，Twenty 正在构建 AI
              驱动工具，用于发现并瞄准对手网络防御中的漏洞，同时仍由人类批准行动。合在一起看，证据支持一个清晰的公司身份：有风险资本支持、以软件为中心、进攻导向，并明确聚焦国家安全，而不是先做军民两用商业产品。
