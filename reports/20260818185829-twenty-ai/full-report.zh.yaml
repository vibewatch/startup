            body: >-
              公开架构证据很薄，但招聘地图有信息量。研究岗位指向能力生成层；应用 AI 岗位指向编排或基于模型的自动化；数据工程师和 DevSecOps
              岗位指向数据与软件交付管线；任务架构师和产品岗位指向操作员工作流代码化；SRE 加任务部署岗位则指向贴近客户环境的生产运行。Forbes 又补充了一层，报道称招聘信息提到攻击路径框架、AI
              驱动自动化工具、persona 构建，以及 CrewAI 等开源智能体工具。合在一起看，Twenty 的技术栈可能结合了进攻性技战术、AI
              智能体编排、数据管线、平台工程和前置部署执行。这比单点解决方案复杂得多，但确切系统边界、集成和模型选择仍未披露。因此，架构最好被视为推断出来、方向一致，而非已经直接验证。
