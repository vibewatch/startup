  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、定价，以及公开记录真正显示了什么
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是政府项目收入模型，而不是传统 SaaS 模型。Twenty 把自己描述为服务美国及盟友任务的端到端进攻性网络行动平台，独立报道也把公司与 USCYBERCOM 和美国海军工作联系起来。Forbes
              进一步披露了两个具体合同金额：USCYBERCOM 合同最高 $12.6 million，美国海军研究合同
              $240,000。这种组合显示，公司更可能靠项目工作、试点、研究和与部署挂钩的合同变现，而不是靠透明用量定价或自助订阅。网站和新闻材料没有披露标价、用量指标或实际合同经济性，因此收入图景仍不完整。关键结论不是
              Twenty
              没有变现，而是可见变现是定制化、采购驱动的，并且可能混合软件和服务。相比直线型企业软件模型，这通常意味着更高合同复杂度，以及收入质量短期更难看清。它也提高了订单额、确认收入和毛利率在试点、部署、扩张阶段不均匀演进的概率。
