            body: >-
              核心承销问题不是缺少野心，而是缺少运营数据。公开来源显示，公司具备实质客户相关性、优质投资人，以及跨工程、部署和财务招聘的真实意愿。它们还不足以判断利润率韧性、资本效率、积压订单质量，或部署重的工作多快能变成可重复产品收入。联邦合同结构又增加了一层模糊性，因为不定量和定量合同载体能支撑有价值的长周期工作，同时仍遮住实际软件经济性。最好的公开结论因此是谨慎建设性：Twenty
