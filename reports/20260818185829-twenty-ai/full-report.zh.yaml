  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 投资逻辑传导
      - 行动含义
    rows:
      - - 法律授权范围收窄
        - 私营部门参与进攻性网络行动遭遇重大限制
        - 稀缺性逻辑走弱，合规成本上升
        - 下调立场，削减合理估值假设
      - - 安全或滥用事件
        - 与产品、部署或控制有关的严重事件
        - 信任和采购速度下滑
        - 立即重估投资建议
      - - 旗舰项目续约失败
        - 具名项目停滞或未续约
        - 客户验证支柱开裂
        - 下调乐观与基准情景概率
      - - 烧钱速度或利润率不及预期
        - 内部指标显示软件经济性偏弱
        - 溢价倍数逻辑破裂
        - 向较低情景区间重估
      - - 降价融资
        - 下一轮资本价格低于当前估值标记
        - 当前定价逻辑被外部市场证伪
        - 除非基本面改善，否则从观察转向放弃
    notes: 估值逻辑应由可度量事件触发破裂，而不是被模糊的情绪变化带偏。
