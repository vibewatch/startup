  - id: TV001
    title: 建议摘要表
    columns:
      - 字段
      - 当前判断
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 密切跟踪，但不要把当前估值当成明显便宜来承销
      - - 置信度
        - 中
        - 战略证据扎实，经济性证据偏薄
      - - 风险评级
        - 高
        - 法律、集中度和执行风险可能快速压缩价值
      - - 估值立场
        - 偏高
        - 这个价格并非不可行，但公开指标支撑得不够稳
      - - 行动姿态
        - 等更好的证据或更好的价格
        - 只有关键私有事实打开后才上调判断
    notes: 该建议明确对价格和证据敏感，不是泛泛的质量评分。
