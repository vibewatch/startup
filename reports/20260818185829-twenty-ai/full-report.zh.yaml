              护城河的公开论证有吸引力，但仍不完整。公司拥有有用的叙事优势：进攻优先定位、早期具名政府牵引、创始人与现代网络行动高度相关，以及围绕工业规模网络行动的投资人支持。不过，同一组来源也暴露了实质压力。Booz
              Allen 已在推出智能体网络产品；Horizon3 和 Pentera 销售自主或 AI 驱动的进攻性测试；Palo Alto 持续推进 AI 辅助
              SecOps；相邻国防科技龙头也会在买方偏好可信大型平台时吸收现代化预算。这意味着 Twenty 的护城河不能建立在「AI
              会自动化网络工作」这个泛化主张上。许多竞争对手现在都在提出某种版本的同一说法。更好的尽调问题是：Twenty
              是否拥有别人无法快速复制的任务工作流、权限感知部署模型或采购切口。公开证据尚未给出结论，因此商品化和既有厂商反击仍是核心承销风险。承销负担也因此转向可重复的项目验证、采购杠杆，以及品类需求会转化为持久自有工作流，而不是演示级差异化的证据。
