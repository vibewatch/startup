      - number: '3.3'
        title: 切换成本、多供应商并用与信任姿态
        blocks:
          - type: paragraph
            body: >-
              在这个市场里，信任本身就是功能。买方关心供应商能否在敏感权限内运作、处理涉密或任务相邻工作流，并顶住采购审查。这会给拥有合同载体的既有厂商，以及具备真实操作员可信度的任务原生专家，带来持久优势。它也意味着多供应商并用很可能发生。政府买方可以让一家供应商做企业攻击路径验证，另一家做人类主导的红队，再用一个单独平台支持狭窄定义的作战任务。因此，Twenty
              可能先赢得共存，再谈替代。如果公司嵌入任务工作流，并积累难以编码进通用工具的技战术，切换成本会提高。但公开证据还没有显示这些成本有多持久，因为没有披露项目历史、续约模式或赢单 /
              输单数据。实际含义是，单靠商业牵引无法证明防御性；采购契合和操作员信任必须随产品一起规模化。
