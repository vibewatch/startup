  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：观察，而不是买入
        blocks:
          - type: paragraph
            body: >-
              建议必须明确受价格约束。Twenty 不是低质量公司。事实上，公开记录指向相反结论：投资者强、使命踩准时点，在国家安全网络领域还有少见的客户验证。但同一份公开记录，没有给出把这种质量信号转成当前 $1
              billion
              估值下买入判断所需的指标。收入、毛利率、烧钱速度、留存、积压订单和续约深度，对外部投资者仍未公开。这很关键，因为这一品类可能看起来极其出色，直到法律摩擦、客户集中或交付强度削弱叙事中默认的软件式上行空间。因此，观察是更合适的中间立场：充分承认稀缺性和战略相关性，同时拒绝为仍被遮住的变量付过高价格。置信度应为中，因为这一建议同时建立在强战略叙事和弱公开经济性之上。
