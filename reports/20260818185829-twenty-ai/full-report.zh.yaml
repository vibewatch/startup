      - number: '2.2'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Twenty 的直接买方范围集中在美国国家安全体系内。公开证据把公司与 USCYBERCOM 和美国海军关联起来，美国海军和 CYBERCOM 官方页面则展示了关键指挥结构：Fleet Cyber Command
              / Tenth Fleet 是美国海军面向 USCYBERCOM 的组成部分，USCYBERCOM 自身也为 FY2027 申请了超过 $2.18 billion
              的运营与维护经费。这些不是直接总可用市场（TAM）数字，却指出了影响采购的支出中心和任务所有者。买方、用户和付款方往往不是同一个实体。操作员和分析师使用工作流；司令部或项目发起方购买；预算所有者可能在全防务部门、军种或涉密账户中。正因为三者分离，即便任务紧迫，采用也可能很慢。这也解释了为什么
              Twenty 由大量操作员背景人员组成的团队在商业上重要：这个市场奖励工作流契合、信任、涉密资质和权限对齐，程度不亚于原始 AI 新颖性。
