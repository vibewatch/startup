        title: 受证据限制的市场规模判断与采用节奏
        blocks:
          - type: paragraph
            body: >-
              判断 Twenty 市场规模，最干净的方法不是押一个激进的总可用市场（TAM），而是用多重镜头交叉看。最宽的镜头是分析机构市场研究；更相关的镜头是 DoD 和 CYBERCOM 运营预算池；最窄的公开可见切口，是
              AI-for-Cyber-Operations 支出。公开记录支持紧迫性和一条可信的扩张路径，但不支持精确的独立可获取市场（SOM）。合理解读是，Twenty
              的近期可服务市场（SAM）可能在数亿美元到低个位数十亿美元之间，取决于
              CYBERCOM、各军种和情报支出中有多少能由商业软件承接。这显著小于头部国防网络安全总可用市场（TAM），但仍有战略意义。采用节奏也可能不均匀：试点、研究采购和狭窄任务合同先来；只有法律、条令和采购问题解决后，更大的重复性项目才会到来。保留这些限制，比假装公开材料已经支撑干净的市场模型更符合尽调原则。
