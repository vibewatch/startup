              已经融到真金白银，也似乎有分量很重的旗舰客户，但公司仍未披露能让外部投资者判断毛利质量、烧钱速度、续约韧性或现金跑道的指标。任何创业公司的不透明都会让人警惕；放在 Twenty 更是如此，因为公司已经与 $1
              billion
              估值和高后果运营品类绑定。如果该模式比投资者预期更依赖人力、法律约束更重，或把试点转成可重复续约的速度更慢，公开记录还没跟上，下行风险就可能先到。因此，缓释框架应按触发条件来设：盯住法律收紧、安全或滥用事件、旗舰客户续约失败、支持强度持续偏高，或资本消耗快过商业证据改善的迹象。在这些问题解决前，即便承认客户相关性和顶级资方背书，剩余风险仍然偏高。
