      - number: '8.3'
        title: 乐观、基准、悲观情景取决于可重复性，不只是客户 Logo
        blocks:
          - type: paragraph
            body: >-
              情景分析的关键，不在于 Twenty
              是否拥有重要产品，而在于它能否把产品变成可重复、可续约的经济性。乐观情景假设早期任务验证扩展到多个机构，平台标准化之后软件毛利改善，法律或采购摩擦保持可控。基准情景假设公司确实稀缺且有价值，但不透明、集中度和合规拖累仍然够重，投资者在称价格有吸引力前应要求更强证据。悲观情景假设业务比叙事暗示的更人力密集、更受采购影响，或政策约束更重。在这条下行路径里，下一轮融资或战略结果可能以比当前标记暗示的更平或更低估值发生。因此，当前价格更像一个押注执行和披露的条件期权，而不是经过深度承销的便宜货。
