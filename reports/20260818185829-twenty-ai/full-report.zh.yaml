      - number: '8.4'
        title: 上调需要新证据；下调可能很快发生
        blocks:
          - type: paragraph
            body: >-
              这一建议刻意保持临时性。上调路径很清晰：披露收入或
              ARR、毛利率、续约质量、客户集中度、安全与合规状态，以及约束产品使用方式的法律框架。这些事实只要出现若干项，就可能把当前立场从观察推到合理，甚至在不同价格下推到买入。下调路径同样清晰，投资者应认真对待。若旗舰客户没有续约，若法律指引缩窄私营部门适用范围，若出现重大安全或滥用事件，或现金消耗跑在商业化前面，下行风险可能比公开市场式尽调循环暗示的更快到来。换句话说，估值判断不是在等琐碎信息，而是在等少数几块私有证据：Twenty
              到底是高溢价、软件式平台，还是更脆弱、需要高接触服务的任务供应商。
