      - number: '1.3'
        title: 融资、规模信号与里程碑
        blocks:
          - type: paragraph
            body: >-
              Twenty 的融资故事压缩得很快。公司在 2025 年 11 月结束隐身期，披露完成由 Caffeinated Capital 领投、General Catalyst 和 In-Q-Tel 参与的 $38
              million Series A。新闻稿称，Twenty 在隐身期已经与美国军方和情报界合作。七个月后，2026 年 6 月 17 日，Twenty 宣布完成由 Accel 领投、Friends & Family
              Capital、Point72 Ventures 和 Caffeinated Capital 参与的 $100 million Series B，估值 $1 billion。PR
              Newswire、GovConWire、TechTimes、Axios 和 Accel 均佐证了轮次规模、领投方和 $138 million 累计融资数字。Accel
              自己的札记补充了一个有用的定性细节：尽调期间，客户和市场参与者反复把 Twenty 形容为「政府需要帮助时第一个会打的电话」，说明即便商业指标仍不透明，任务相关性也是真实存在的。


              公开规模证据最强的地方在任务牵引和招聘，而不是财务披露。招聘页面列出 28 个开放岗位，分布在 Arlington、Fort Meade、Washington、Augusta、San Antonio、New
              York 和 San Francisco，显示出全国招聘半径和多地运营雄心。WVU 在 2026 年 5 月宣布的合作，显示公司围绕进攻性网络和 AI 建设人才与研究管线。Joe Lin 在 2026 年 4
              月出席 U.S.-China Economic and Security Review Commission，以及新闻页面提到 New York Times、Wall Street Journal
              和国会活动，说明到 2026 年，公司已经进入围绕私营部门进攻性网络的公共政策讨论。


              最大保留项是商业指标缺失和客户披露不完整。本次审阅没有发现任何公开来源披露收入、年经常性收入（ARR）、烧钱速度、现金或准确员工数。TechTimes 和 Tectonic 报道称，Twenty 在 2024
              年夏季拿到一份 $12.6 million 的 USCYBERCOM 合同和一份 $240,000
              的美国海军研究合同，这是早期政府需求的强证据；但本轮没有在公开一手采购记录中找到对应授标编号和合同范围。因此，投资者已有足够证据判断相关性和融资动能，却还不足以有把握地承销单位经济性或组织成熟度。
