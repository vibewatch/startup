companyProfile:
  summary: >-
    Twenty is a private defense-tech company founded in 2024 and headquartered in Arlington, Virginia. Public materials
    position it as an AI-enabled offensive cyber platform built for the U.S. military and Intelligence Community, with
    product claims centered on automating mission workflows that previously required labor-intensive human effort. The
    public record shows meaningful strategic validation: Twenty emerged from stealth with a disclosed $38M round, then
    raised a $100M Series B at a $1B valuation in June 2026, and public reporting names USCYBERCOM and the U.S. Navy as
    customer references. The core underwriting gap is not whether the category matters; it is whether the private
    revenue, margin, renewal, and control-quality data justify the current valuation and risk profile.
