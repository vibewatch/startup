      - number: '7.4'
        title: Financial Opacity and Thesis-Break Triggers Keep Residual Exposure High
        blocks:
          - type: paragraph
            body: >-
              Finally, the financial risk is inseparable from the legal and execution story. Twenty has raised real
              capital and appears to have meaningful flagship customers, but it still does not disclose the metrics that
              would let outside investors judge margin quality, burn, renewal durability, or runway. That opacity would
              matter for any startup. It matters even more here because the company is already associated with a $1
              billion valuation and a high-consequence operating category. If the model proves labor-heavy, legally
              constrained, or slower to convert pilots into repeatable renewals than investors expect, downside can
              arrive before the public record catches up. The right mitigation framework is therefore trigger-based:
              watch for legal tightening, security or misuse events, failed flagship renewals, persistent support
              intensity, or evidence that capital is being consumed faster than commercial proof improves. Until those
              questions are resolved, the residual risk profile remains high even after giving credit for customer
              relevance and premium backers.
            claimRefs:
