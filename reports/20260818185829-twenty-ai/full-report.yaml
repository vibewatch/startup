        title: Customer, Procurement, and Talent Dependencies Can Amplify Execution Risk
        blocks:
          - type: paragraph
            body: >-
              The next layer of risk comes from dependencies. The visible customer base is concentrated in a very small
              number of named government accounts, and the buying process is shaped by procurement rules, budget
              authorities, and mission structures that sit above the end user. That can make a relationship
              strategically sticky once deployed, but it can also make renewals or expansions surprisingly fragile if
              approvals, budgets, or contracting channels change. The hiring footprint points to another dependency:
              specialized operators, cleared staff, engineers, mission-delivery personnel, and support teams are all
              needed at once. WVU and investor backing help, but they do not remove the bottleneck risk created by
              scarce national-security talent. In practical terms, Twenty must scale product, staffing, and customer
              delivery in parallel. Any weakness in one of those layers can slow the others and create nonlinear
              execution problems. The dependency map matters because this is not a one-variable scaling story; it is a
              synchronized scaling story across product, procurement, and people.
            claimRefs:
              - CR022
              - CR023
              - CR026
