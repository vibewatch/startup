            body: >-
              The core underwriting problem is not absence of ambition but absence of operating data. Public sources
              show a company with meaningful customer relevance, premium investors, and real willingness to hire across
              engineering, deployment, and finance. They do not show enough to judge margin durability, capital
              efficiency, backlog quality, or the speed at which deployment-heavy work becomes repeatable product
              revenue. Federal contracting structure adds another layer of ambiguity because indefinite and definite
              contract vehicles can support valuable long-cycle work while still obscuring realized software economics.
              The best public verdict is therefore cautiously constructive: Twenty has enough capital and mission pull
              to matter, but the economics remain largely unproven in public. Before underwriting aggressively,
              investors would need revenue by program, gross-margin bridge, services share, burn, backlog, renewal
