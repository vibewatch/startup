  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and Regulatory Risk Is Structural to the Category
        blocks:
          - type: paragraph
            body: >-
              Twenty's first-order risk is that it operates in a category where the rules are still being defined. The
              most useful legal and policy sources all point in the same direction: offensive cyber operations do not
              sit inside a clean, fully normalized commercial framework, and AI makes the governance questions harder
              rather than easier. The White House cyber strategy and later private-sector authorization memos create
              demand-side momentum, but they do not eliminate the distinction between government authority and vendor
              capability. That means a company like Twenty can be strategically relevant while still facing sharp
              changes in oversight, approval pathways, or acceptable operating scope. Investors should treat this as
              structural category risk, not just as a temporary communications issue. If policymakers, auditors, or
              customer counsel tighten interpretations after an incident or misuse concern, commercial scaling could
              slow quickly even if product demand remains real.
            claimRefs:
