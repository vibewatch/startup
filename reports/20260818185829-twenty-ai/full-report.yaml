  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What Twenty Actually Sells Into
        blocks:
          - type: paragraph
            body: >-
              Twenty should not be framed as a generic cybersecurity company. The broader defense-cyber market includes
              zero trust, endpoint, cloud, network protection, managed services, and defense-industrial-base security.
              Analyst providers put that broader category above $20 billion in 2026, but those figures overstate what
              matters for Twenty because the company does not sell general cyber hygiene or conventional SOC tooling.
              Public sources instead place it in a far narrower category: commercially delivered, AI-enabled software
              that supports offensive or offensive-adjacent cyber mission workflows for government operators. TechTimes
              and Axios both emphasize offensive cyber rather than enterprise defense, while Accel describes an
              end-to-end cyber operations platform for U.S. agencies. That makes the right market lens layered: broad
              defense cybersecurity on the outside, then DoD cyberspace-operations budgets, then offensive and
              intelligence-adjacent cyber capability pools, and finally the still narrower slice that can absorb
              commercially delivered platforms like Twenty. The outer layer is large and growing; the innermost layer is
              strategically important but much smaller, more concentrated, and more authority-constrained.
            claimRefs:
