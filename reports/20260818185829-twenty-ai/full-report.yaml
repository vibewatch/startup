  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct, Incumbent, Adjacent, and Status-Quo Alternatives'
        blocks:
          - type: paragraph
            body: >-
              Twenty does not face one clean peer set. Public materials show at least four relevant classes. First are
              federal cyber incumbents such as Booz Allen, CACI, Leidos, and L3Harris that already sell cyber capability
              into government missions and can bundle products, services, clearances, and contract vehicles. Second are
              commercial offensive-security automation platforms such as Horizon3, Pentera, Synack, and Cobalt that
              market attack-path validation, pentesting, or offensive simulation workflows. Third are large
              defensive-SecOps suites such as Palo Alto Cortex that can absorb budget by promising AI-assisted cyber
              operations without being mission-offense specialists. Fourth are adjacent defense-AI firms such as Shield
              AI and Anduril that compete for modernization dollars and operator attention even if they do not sell the
              same workflow. The status quo is also competitive: internal government development, red teams, and
              services-led mission support remain credible substitutes when buyers prefer control, secrecy, or incumbent
              relationships over a standalone platform.
