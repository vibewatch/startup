      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The category itself is a risk multiplier
            body: >-
              Many of Twenty's hardest risks are not startup-generic. They come from sitting inside AI-enabled offensive
              cyber, where law, authority, controls, and customer proof all carry more consequence than in standard
              enterprise software.
