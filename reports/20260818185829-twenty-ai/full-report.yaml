      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The company can be impressive without being investable at this price
            body: >-
              The strongest public argument for Twenty is strategic scarcity. The strongest public argument against a
              buy is that the economics needed to justify the current valuation are still hidden.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
