  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Twenty Delivers and for Whom
        blocks:
          - type: paragraph
            body: >-
              Twenty's product should be understood as a mission workflow system, not a generic cyber feature. The
              homepage, Series A, Series B, and investor materials all frame the company around industrial-scale cyber
              operations for U.S. and allied missions. The language is explicit: Twenty wants to transform workflows
              that previously took weeks of manual effort into continuous automated operations across hundreds of
              targets. Careers copy reinforces that the target users are operators and analysts, not generic enterprise
              security administrators. This framing matters because it narrows what counts as product success. The
              company is not promising better SOC dashboards or marginal workflow automation for corporate defenders; it
              is promising better offensive cyber throughput in sensitive mission environments. That makes the product
              definition unusually ambitious and unusually vertical, closer to a mission system than a standard security
              application. That distinction should anchor every diligence conversation early. It also explains why job
              postings emphasize mission-facing functions instead of conventional growth or generalized
              enterprise-administration roles.
