      - number: '2.2'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The direct buyer universe for Twenty is concentrated inside the U.S. national-security apparatus. Public
              evidence ties the company to USCYBERCOM and the U.S. Navy, while official Navy and CYBERCOM pages show the
              command structures that matter: Fleet Cyber Command / Tenth Fleet serves as the Navy component to
              USCYBERCOM, and USCYBERCOM itself requested more than $2.18 billion of operation-and-maintenance funding
              for FY2027. Those are not direct TAM figures, but they identify the spending centers and mission owners
              that shape procurement. The buyer, user, and payer are often different entities. Operators and analysts
              use the workflows; commands or program sponsors buy them; and budget owners may sit inside defense-wide,
              service, or classified accounts. That separation is why adoption can be slow even when mission urgency is
              high. It also explains why Twenty's operator-heavy team matters commercially: this market rewards workflow
              fit, trust, clearances, and authority alignment as much as raw AI novelty.
