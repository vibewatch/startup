            body: >-
              The visible customer base is small but coherent. Twenty is publicly tied to USCYBERCOM and the U.S. Navy,
              which immediately places its buyer universe inside a narrow set of national-security organizations. Those
              are not simple single-thread SaaS customers. Commands or program sponsors may buy, operators and analysts
              may use, and budget authorities may sit elsewhere in the chain. Official CYBERCOM, Fleet Cyber, and USNI
              sources help explain why that matters: the relevant customer environment is hierarchical,
              authority-sensitive, and mission-led. The WVU partnership adds an ecosystem layer around talent and
              research collaboration, but it does not change the fact that the only clearly visible revenue-bearing
              customers are still government entities. This means customer segmentation for Twenty is best framed by
              mission role and procurement authority rather than by ordinary enterprise verticals or generic commercial
              personas in practice. The sales motion is therefore inherently narrower, slower, and more dependent on
              program authority than a typical commercial software market.
