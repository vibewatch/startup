      - number: '2.4'
        title: Evidence-Constrained Sizing and Adoption Timing
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to size Twenty's market is through multiple lenses rather than one heroic TAM. The
              broadest lens is analyst market research; the more relevant lens is DoD and CYBERCOM operational budget
              pools; and the narrowest visible public wedge is AI-for-Cyber-Operations spending. The public record
              supports urgency and a plausible expansion path, but it does not support a precise standalone SOM. A
              reasonable interpretation is that Twenty's near-term SAM is in the hundreds of millions to low
              single-digit billions depending on how much of CYBERCOM, service, and intelligence spending becomes
              commercially software-addressable. That is materially smaller than headline defense-cyber TAMs but still
              strategically meaningful. Adoption is also likely to be lumpy: pilots, research buys, and narrow mission
              contracts come first; larger repeat programs come later if legal, doctrinal, and procurement questions are
              resolved. Preserving those caveats is better diligence than pretending the public file already supports a
              clean market model.
