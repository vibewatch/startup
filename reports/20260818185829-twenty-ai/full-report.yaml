          - type: callout
            title: This is a denominator problem more than a technology problem
            body: >-
              The public record already shows that the product matters. The real open question is whether the revenue,
              margin, and renewal denominator beneath the $1B mark is strong enough to support it.
            calloutType: insight
            claimRefs:
