  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The current call flows from real strategic proof, missing economics, and a price that already assumes strong
      execution.
    data:
      nodes:
        - id: proof
          label: Real strategic proof
          description: Funding, customer names, and mission relevance are genuine positives
        - id: scarcity
          label: Scarcity premium is plausible
          description: Offensive cyber plus AI plus government buyers is a rare wedge
        - id: opacity
          label: Economics are opaque
          description: Revenue, margin, burn, retention, and concentration are not public
        - id: risk
          label: Residual risk remains high
          description: Legal, concentration, and control-surface gaps can compress value fast
        - id: price
          label: Current mark is already $1B
          description: Investors are not evaluating an undiscovered asset
        - id: decision
          label: 'Recommendation: track'
          description: Follow closely, but do not underwrite a buy at the current price
      edges:
        - from: proof
          to: decision
        - from: scarcity
          to: decision
        - from: opacity
          to: decision
        - from: risk
          to: decision
        - from: price
          to: decision
