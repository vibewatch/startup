              engineers but also product, security, SRE, and mission-delivery staff. That mix is hard to justify for a
              pure concept-stage prototype. It suggests a product that must be deployed, supported, and kept reliable in
              customer contexts. Yet the public maturity record remains limited. There are no visible public docs,
