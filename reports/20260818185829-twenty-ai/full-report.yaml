chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Operating Focus
        blocks:
          - type: paragraph
            body: >-
              Twenty's public identity is unusually direct for a young defense startup. Its active operating site is
              twenty.io, while the user-provided twenty.ai domain resolves to a parked domain-for-sale page rather than
              the company's operating website. On the official homepage, Twenty says it builds and scales "the software
              and capabilities of modern cyber conflict" and is "industrializing the American arsenal for the war of
              now." The company frames itself not as a general cybersecurity vendor, but as a provider of software that
              helps the United States and its allies conduct cyber conflict at industrial scale. Across the homepage,
              about page, and 2025 and 2026 press releases, the core product description is consistent: AI-enabled,
              end-to-end systems for the U.S. military and Intelligence Community, designed to accelerate the offensive
              cyber operations lifecycle while keeping human judgment at the center of consequential decisions.


              The public positioning matters because it differentiates Twenty from mainstream defensive-security
              companies. The about page argues that cyber conflict is already live, continuous, and machine-speed, and
              that the U.S. needs software built for conflict rather than bloated enterprise IT systems. That
              positioning is reinforced by independent coverage. Axios described Twenty as a cyber warfare startup whose
              unusual feature is its unapologetic focus on offensive tools, while TechTimes described the platform as an
              agentic architecture automating the full cyber kill chain for U.S. government missions. Tectonic's
              November 2025 profile similarly described Twenty as building AI-powered tools that identify and target
              holes in adversaries' cyber defenses, with humans still approving actions. Taken together, the evidence
              supports a clear company identity: venture-backed, software-centric, offense-oriented, and explicitly
              national-security focused rather than dual-use commercial first.
