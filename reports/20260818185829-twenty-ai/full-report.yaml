      - number: '8.2'
        title: The Price Needs a Revenue Denominator the Public Record Does Not Yet Prove
        blocks:
          - type: paragraph
            body: >-
              The core valuation problem is simple: a $1 billion mark can be fair only if Twenty has already built a
              large enough and durable enough revenue base to justify it. Public peers show what that support usually
              looks like. CrowdStrike, SentinelOne, and Palo Alto all disclose some mix of revenue, recurring revenue,
              gross margin, cash flow, backlog, and product expansion. Defense-oriented comparables such as Booz Allen
              and Leidos disclose backlog, customer mix, guidance, and budget-process risk. Twenty discloses none of the
              equivalent economic anchors publicly. That forces investors to reverse-engineer the required denominator
              instead of verifying it. At 5x revenue, the current mark implies roughly $200 million of annual revenue.
              At 10x, it implies $100 million. At 15x, it still implies about $67 million. Public sources do not confirm
              that Twenty is already at any of those levels. The current price can still work, but only if the
              non-public revenue and renewal picture is substantially better than the public record reveals today.
            claimRefs:
              - CV011
