              - CV025
              - CV042
      - number: '8.4'
        title: Upgrade Requires New Evidence; Downgrade Can Happen Quickly
        blocks:
          - type: paragraph
            body: >-
              The recommendation is intentionally provisional. There is a clear upgrade path: disclose revenue or ARR,
              gross margin, renewal quality, customer concentration, security and compliance posture, and the legal
              framework governing how the product is used. Any combination of those facts could move the current stance
              from track to fair, or even to buy at a different price. The downgrade path is also clear, and investors
              should take it seriously. If a flagship customer fails to renew, if legal guidance narrows private-sector
              scope, if a meaningful security or misuse incident emerges, or if cash burn outruns commercialization,
              downside can arrive faster than the public market-style diligence loop would suggest. In other words, the
              valuation call is not waiting for trivia; it is waiting for the few pieces of private evidence that
              determine whether Twenty is a premium software-like platform or a more fragile, high-touch mission vendor.
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
