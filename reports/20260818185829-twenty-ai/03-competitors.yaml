- id: switching-and-trust
  title: Switching Costs, Multi-Homing, and Trust Posture
  body: In this market, trust is a feature. Buyers care about whether a vendor can operate inside sensitive authorities, handle classified or mission-adjacent workflows, and survive procurement scrutiny. That creates durable advantages for incumbents with contract vehicles and for mission-native specialists with authentic operator credibility. It also means multi-homing is likely. A government buyer can use one vendor for enterprise attack-path validation, another for human-led red teaming, and a separate platform for narrowly defined operational support. Twenty may therefore win coexistence before it wins displacement. Switching costs increase if the company becomes embedded in mission workflows and accumulates tradecraft that is hard to codify into a generic tool. But public evidence does not yet show how durable those costs are because there is no disclosed program history, renewal pattern, or win/loss data. The practical implication is that commercial traction alone will not prove defensibility;
    procurement fit and operator trust must scale with the product.
  claimRefs:
  - CP017
  - CP018
