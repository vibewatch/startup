callouts:
- calloutType: insight
  title: Twenty competes in a wedge, not a vacuum
  body: The market is best understood as a contested wedge between services-heavy federal incumbents and product-led offensive-security platforms. Twenty can win without looking like either group, but it must prove why buyers need a mission-specific platform rather than a bundle, a validator, or the status quo.
  claimRefs:
  - CP008
  - CP015
  - CP016
  - CP022
- calloutType: risk
  title: AI offense claims are spreading fast
  body: Booz Allen, Horizon3, Pentera, and other vendors already market AI-enabled or autonomous cyber workflows. If Twenty cannot prove a mission workflow, procurement, or trust advantage beyond the generic AI story, incumbents can compress its differentiation quickly.
  claimRefs:
  - CP004
  - CP009
  - CP010
  - CP029
  - CP030
