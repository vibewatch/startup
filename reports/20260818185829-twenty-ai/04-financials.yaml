- id: capital-adequacy
  title: Capital Adequacy, Financing Dependency, and Comparison to Public Cyber Benchmarks
  body: 'The strongest financial fact in the public file is funding support. Twenty raised $38 million in 2025 and another $100 million in 2026, implying at least $138 million of total disclosed capital. That is meaningful for a young defense-tech software company and likely gives management time to pursue hard programs that take longer to close than enterprise security deals. But funding announcements are not cash-balance disclosures. No public source reviewed states current cash on hand, monthly burn, or runway. Public cyber comparables illustrate the scale gap: SentinelOne and Rapid7 disclose hundreds of millions of quarterly revenue and hundreds of millions to more than a billion dollars of cash, along with mature margin reporting. Twenty has none of that public transparency yet. The financial interpretation is therefore balanced: capital raised lowers near-term financing stress, but missing burn and revenue data mean the next-round dependency question remains unresolved rather than
    solved.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI019
  - CI020
  - CI021
