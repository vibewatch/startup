- id: gtm-costs
  title: GTM Motion, Delivery Model, and Cost Structure Proxies
  body: Twenty's public hiring pattern is the clearest cost-structure clue. Forward-deployed analysts and mission deployment leads imply customer work that happens close to operational environments, not from a purely remote product surface. Applied AI and offensive-cyber research roles imply continued investment in specialized technical talent. A strategic finance role suggests the company is also building planning and operational discipline around that headcount base. Together these signals point toward a model that blends product development with high-touch delivery. That can be strategically rational in defense tech because trust, deployment, and workflow fit matter. Financially, however, it can delay the moment when software gross margins dominate the P&L. The company may eventually standardize more of the workflow, but public evidence today still looks more like a programmatic, deployment-led buildout than a low-touch software machine. That makes sales efficiency, implementation cost,
    and revenue-recognition detail central diligence topics.
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
