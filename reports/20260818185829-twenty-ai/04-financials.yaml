- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue by customer / program
    - Without it investors cannot separate proof from pilots
    - Request current ARR-equivalent, booked revenue, backlog, and top contracts
  - - Gross-margin bridge
    - Needed to judge whether model is scalable software or delivery-heavy services
    - Request labor, cloud, subcontractor, and support cost breakdown
  - - Burn and runway
    - Needed to judge financing dependency
    - Request monthly burn, current cash, and management runway case
  - - Retention / renewal
    - Needed to evaluate revenue durability
    - Request renewal history, option exercise rates, and expansion within agencies
  - - Services share of revenue
    - Needed to price the business correctly versus software comps
    - Request revenue split among product, services, research, and other
  - - Revenue-recognition policy
    - Needed to interpret contract wins and milestone timing
    - Request contract structure examples and recognition treatment
  notes: The financial diligence path is straightforward; the problem is not what to ask, but that none of it is public yet.
