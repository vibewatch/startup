  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-backlog
    missingEvidence: Current revenue, ARR-equivalent, backlog, booked pipeline, and revenue concentration by customer or program.
    whyItMatters: Without revenue detail, investors cannot judge traction quality or valuation support.
    diligencePath: Request monthly recurring / contracted revenue, backlog schedule, and top contract list.
    relatedQuestionRefs:
    - QI004
    - QI015
    - QI022
  - type: private-evidence-only
    severity: material
    topic: gross-margin-bridge
    missingEvidence: Gross margin by contract type and the split between software, support, and delivery labor.
    whyItMatters: The software-versus-services mix is the central economic question.
    diligencePath: Request revenue-recognition memo plus gross-margin bridge by product, service, and pilot work.
    relatedQuestionRefs:
    - QI012
    - QI019
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Current cash balance, debt, monthly burn, and management runway assumptions.
    whyItMatters: Funding announcements do not prove capital adequacy.
    diligencePath: Request cash waterfall, monthly burn, debt schedule, and downside runway case.
    relatedQuestionRefs:
    - QI016
    - QI018
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Public contract examples showing pricing structure, payment cadence, and services attachment for offensive-cyber platform work.
    whyItMatters: Realized pricing is needed to assess revenue quality and comparability to software peers.
