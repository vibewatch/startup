evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and any independent national-security oversight mechanisms.
    whyItMatters: >-
      A company building offensive cyber capability should be evaluated partly on governance safeguards, not only
      operator pedigree.
    diligencePath: Request current board deck, board observer rights, and written governance summary from management.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Debt, secondaries, SAFE/convert terms, and investor rights beyond the headline primary rounds.
    whyItMatters: >-
      Headline funding totals do not reveal liquidation preferences, governance control, or near-term financing
      pressure.
    diligencePath: Request cap table summary and financing instrument schedule covering seed through Series B.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: government-contracts
    missingEvidence: Primary award identifiers and contracting documents for the reported USCYBERCOM and Navy work.
    whyItMatters: >-
      Mission traction is a core part of the underwriting story, and press-reported contract figures are less reliable
      than award records.
    diligencePath: Search FPDS/USASpending with management-provided legal entity identifiers or request redacted award documentation.
    relatedQuestionRefs:
      - QO019
      - QO025
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Revenue, ARR, gross margin, burn, cash, and exact headcount.
    whyItMatters: >-
      These metrics determine whether the company is merely strategically interesting or financially underwritable at a
      unicorn price.
    diligencePath: Request latest board operating pack, headcount by function, and monthly recurring financial dashboard.
    relatedQuestionRefs:
      - QO017
      - QO018
      - QO019
  - type: private-evidence-only
    severity: minor
    topic: locations
    missingEvidence: Clear explanation of which cities are permanent offices versus recruiting outposts or remote role tags.
    whyItMatters: Operating footprint affects security posture, facilities cost, and access to cleared talent pools.
    diligencePath: Request current office list with headcount by site and clearance status where applicable.
    relatedQuestionRefs:
      - QO002
  - type: private-evidence-only
    severity: material
    topic: precise-som
    missingEvidence: >-
      Program-level pipeline, contract-vehicle map, and management view of software-addressable spending inside defense
      and intelligence cyber budgets.
    whyItMatters: Public budgets prove demand but not the share of demand that a vendor like Twenty can realistically capture.
    diligencePath: >-
      Request pipeline by program, buyer, and budget line plus win/loss history and classified-budget access
      assumptions.
    relatedQuestionRefs:
      - QM019
      - QM023
  - type: private-evidence-only
    severity: material
    topic: allied-market
    missingEvidence: Specific allied customers, programs, or exportable product boundaries for non-U.S. adoption.
    whyItMatters: Allied expansion could enlarge the market materially, but no clean public evidence quantifies it.
    diligencePath: Request named allied accounts or at least region-by-region pipeline and export review status.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: minor
    topic: market-size-methodology
    missingEvidence: >-
      Reconciliation between analyst-provider market boundaries that produce materially different 2026 defense-cyber
      totals.
    whyItMatters: A wide spread between analyst estimates is a reminder not to over-anchor on any single headline TAM.
    diligencePath: >-
      Review underlying analyst methodologies or replace with bottom-up budget sizing once more primary evidence is
      available.
    relatedQuestionRefs:
      - QM001
      - QM016
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: classified-budgets
    missingEvidence: >-
      Classified annex detail showing offensive-cyber, intelligence, and software-specific line items unavailable in
      public budget documents.
    whyItMatters: The most relevant buyer pools may sit in classified budget lines that public sources cannot decompose.
    diligencePath: Obtain management explanation of which classified programs matter and how procurement authority works in practice.
    relatedQuestionRefs:
      - QM008
      - QM017
  - type: private-evidence-only
    severity: material
    topic: authority-framework
    missingEvidence: >-
      Contracting and legal framework that governs how Twenty participates in mission workflows without owning
      deployment authority.
    whyItMatters: Market size is less useful than deployable scope when legal authorities are sensitive.
    diligencePath: Request customer contracting model, authorization workflow, and counsel memo on operational boundaries.
    relatedQuestionRefs:
      - QM014
      - QM022
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Named competitive win/loss examples against primes, commercial validation vendors, or internal build alternatives.
    whyItMatters: Without direct win/loss evidence, moat claims remain narrative-heavy.
    diligencePath: Request top 10 opportunities, competitors encountered, and reasons won or lost.
    relatedQuestionRefs:
      - QP023
      - QP025
  - type: private-evidence-only
    severity: material
    topic: pricing-and-packaging
    missingEvidence: Contract model, software-vs-services mix, and pricing benchmarks for Twenty and close alternatives.
