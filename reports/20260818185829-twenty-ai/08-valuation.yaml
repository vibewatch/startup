- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - CrowdStrike
    - FY26 revenue $4.81B; ARR $5.25B; non-GAAP subscription gross margin 81%
    - Premium public cyber platform with strong cash generation
    - Shows what premium AI-cyber valuation support looks like when economics are public
    - Much larger and broader than Twenty
  - - SentinelOne
    - Q1 FY26 revenue $229.0M; ARR $948.1M; non-GAAP gross margin 79%
    - Public growth-stage cyber challenger with disclosed economics
    - Useful reference for sub-scale but still transparent security software
    - Still broader enterprise defense than offensive cyber
  - - Palo Alto Networks
    - FY25 revenue $9.2B; remaining performance obligations $15.8B
    - Mature public category leader with visible contracted demand
    - Shows how recurring demand and platform breadth anchor valuation support
    - Far larger and more diversified
  - - Booz Allen
    - FY25 defense revenue $5.9B; intelligence revenue $1.9B; RPO $9.5B
    - Government-heavy services and solutions model
    - Useful floor reference for budget and backlog sensitivity in national-security tech
    - Services mix and scale make it a lower-multiple style reference
  - - Leidos
    - Q1 2026 revenue $4.4B; adjusted EBITDA margin 14%; FY26 guide $18.0B-$18.4B
    - Scaled defense technology prime with AI and cyber exposure
    - Shows the disclosure and risk framing expected in government-heavy tech
    - Not a startup and not a pure software comp
  notes: This is a deliberately mixed comp set because Twenty combines premium cyber aspirations with government concentration and mission-delivery complexity.
  enumerationScope:
    coverage: sample
    basis: Representative public reference set covering premium cyber software and government-heavy defense technology businesses most relevant to Twenty's current evidence profile; not an exhaustive comps universe.
