- id: scenarios
  title: Bull, Base, and Bear Cases Turn on Repeatability, Not Just Customer Logos
  body: The scenario work depends less on whether Twenty has an important product and more on whether it can turn that product into repeatable, renewable economics. The bull case assumes that early mission proof expands into multiple agencies, software margins improve as the platform standardizes, and legal or procurement friction stays manageable. The base case assumes that the company really is scarce and valuable, but still carries enough opacity, concentration, and compliance drag that investors should demand better proof before calling the price attractive. The bear case assumes that the business is more labor-intensive, procurement-sensitive, or policy-constrained than the narrative implies. In that downside path, the next financing or strategic outcome could happen at a flatter or lower valuation than the current mark suggests. The current price therefore behaves more like a conditional option on execution and disclosure than like a deeply underwritten bargain.
