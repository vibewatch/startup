- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Legal scope narrows
    - Material restriction on private-sector offensive cyber involvement
    - Scarcity thesis weakens and compliance cost rises
    - Downgrade stance and cut fair-value assumptions
  - - Security or misuse incident
    - Serious event tied to product, deployment, or controls
    - Trust and procurement velocity fall
    - Reassess recommendation immediately
  - - Flagship renewal failure
    - Named program stalls or does not renew
    - Customer-proof pillar cracks
    - Lower probability of bull and base cases
  - - Burn or margin disappointment
    - Private metrics show weak software economics
    - Premium multiple thesis breaks
    - Re-rate toward lower scenario range
  - - Down-round financing
    - Next capital arrives below current mark
    - Current pricing thesis is disproved externally
    - Move from track toward pass unless fundamentals improve
  notes: The valuation thesis should break on measurable events, not on vague sentiment changes.
