- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - ARR, booked revenue, mix, concentration, and renewal data
    - Without it, the current mark cannot be underwritten cleanly
    - CFO / finance diligence
  - - Margin structure
    - Gross margin, delivery mix, and services intensity
    - Determines whether software-like valuation is justified
    - CFO / operating review
  - - Capital and cap table
    - Cash, burn, runway, liquidation preferences, and option overhang
    - Determines downside protection and financing risk
    - Finance / legal diligence
  - - Security and compliance
    - Control artifacts, accreditations, incident history, AI governance
    - Determines trust discount and procurement friction
    - Security / product diligence
  - - Legal authorization model
    - Counsel view of customer authority, use boundaries, and approvals
    - Determines category risk and future policy resilience
    - Legal / customer diligence
  notes: These are the minimum private asks needed to convert the current public view into an underwritten investment call.
