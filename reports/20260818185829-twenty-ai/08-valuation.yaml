company:
  name: Twenty
chapter:
  number: 8
  title: Valuation
  summary: 'Twenty is strategically compelling but not yet price-transparent. The June 2026 $1 billion mark is directionally plausible only if the company already has far stronger revenue quality, renewal durability, and margin potential than public sources reveal. The public record supports a TRACK recommendation rather than BUY: customer proof and scarcity are real, yet the economics stack is too opaque to underwrite a clear margin of safety. On balance, the right current posture is medium-confidence, high-risk, stretched.'
sections:
- id: decision
  title: 'Recommendation: Track, Not Buy'
  body: 'The recommendation needs to be explicitly price-sensitive. Twenty is not a low-quality company. In fact, the public record suggests the opposite: strong investors, a timely mission, and rare customer proof inside national-security cyber. But the same record does not provide the metrics needed to convert that quality signal into a buy at the current $1 billion valuation. Revenue, gross margin, burn, retention, backlog, and renewal depth remain undisclosed publicly for outsiders today. That matters because this category can look exceptional right up until legal friction, customer concentration, or delivery intensity reduces the software-like upside embedded in the narrative. A TRACK recommendation is therefore the right middle ground. It gives full credit to scarcity and strategic relevance while refusing to overpay for variables that are still hidden. Confidence should be medium because the recommendation is built on a strong strategic story and a weak public economics story at the
    same time.'
