- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Why it matters
  - What would change the view
  rows:
  - - Scarce mission relevance
    - US defense cyber demand can reward rare vendors quickly
    - Need proof that scarce demand is also repeatable revenue
  - - Flagship customer proof
    - USCYBERCOM and Navy references reduce commercialization doubt
    - Need concentration and renewal data to know how durable the proof is
  - - Premium investor validation
    - Accel-led round reduces financing-risk concerns near term
    - Need metrics showing investor validation was not simply scarcity pricing
  - - Economics disclosure gap
    - Missing ARR, margin, burn, and backlog block a buy call
    - Open the data room or lower the entry price
  - - Legal and control-surface risk
    - Policy, compliance, and trust gaps can impair premium multiples
    - Provide legal workflow, security packet, and accreditation roadmap
  notes: Both thesis and anti-thesis are real; the recommendation depends on how much weight the missing economics deserve at the current price.
