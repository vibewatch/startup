companyProfile:
  summary: >-
    Twenty is a private defense-tech company founded in 2024 and headquartered in Arlington, Virginia.
    Public materials position it as an AI-enabled offensive cyber platform built for the U.S. military and
    Intelligence Community, with product claims centered on automating mission workflows that previously
    required labor-intensive human effort. The public record shows meaningful strategic validation: Twenty
    emerged from stealth with a disclosed $38M round, then raised a $100M Series B at a $1B valuation in
    June 2026, and public reporting names USCYBERCOM and the U.S. Navy as customer references. The core
    underwriting gap is not whether the category matters; it is whether the private revenue, margin,
    renewal, and control-quality data justify the current valuation and risk profile.
  founders:
    - name: Joe Lin
      role: Co-founder and CEO
      background: >-
        Previously led Expanse's National Security Division, later held a Palo Alto Networks product role,
        and has a public national-security background including Navy Reserve service.
      claimRefs: [CO013, CO017, CO018]
    - name: Leo Olson
      role: Co-founder and CTO
      background: >-
        Public bio cites prior U.S. Army cyber and signals-intelligence roles across USCYBERCOM, NSA, and
        Army intelligence.
      claimRefs: [CO014, CO019]
    - name: Skyler Onken
      role: Co-founder and VP Product
      background: >-
        Public bio says he was among the first Master Cyber Operators in the U.S. military and spent more
        than a decade across USCYBERCOM and Army roles.
      claimRefs: [CO015, CO020]
    - name: Pete Sorrentino
      role: Co-founder and VP Growth
      background: >-
        Public bio links him to growth, product, and customer work for national-security customers inside
        Palo Alto Networks' Cortex business.
      claimRefs: [CO016, CO021]
  headquarters: Arlington, Virginia, United States
  productSummary: >-
    Twenty sells AI-enabled, end-to-end offensive cyber software for U.S. military and intelligence users,
    combining offensive research, platform and AI engineering, and mission deployment workflows intended to
    automate and scale cyber operations across many targets.
  customerFocus: >-
    U.S. defense, intelligence, and allied national-security customers, especially operational cyber teams,
    mission sponsors, and procurement stakeholders responsible for offensive cyber capability.
  businessModel: >-
    Government-focused software and mission-workflow contracts, likely paired with deployment and support
    services for offensive cyber operations programs rather than broad enterprise-seat licensing.
  stage: Series B private
