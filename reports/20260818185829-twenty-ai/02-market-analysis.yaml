- id: drivers-constraints
  title: Growth Drivers, Policy Tailwinds, and Adoption Constraints
  body: 'Demand drivers are real. USCYBERCOM''s 2024 AI roadmap explicitly targets scale, analytic improvement, and adversary disruption. CRS reported a FY2026 DoD cyberspace budget request of about $15.1 billion, including $5.4 billion for cyberspace operations and about $2.6 billion of CYBERCOM resources. Breaking Defense and the FY2027 budget documents then show a sharp AI-specific step-up, with the dedicated AI-for-Cyber-Operations line moving from $5 million in FY2026 to a $138 million FY2027 request. The White House''s March 2026 cyber strategy reinforces the same direction: more offensive and preemptive cyber focus, more private-sector coordination, and more interest in machine-speed capability. Yet constraints are equally real. Lawfare and Nextgov both show persistent uncertainty around legal boundaries and the meaning of private-sector offense. Title 10 authority and congressional oversight remain government authorities, not vendor authorities. The USNI Proceedings article on Navy
    cyber adds a second layer of friction: customer organizations may badly need offensive cyber capability but still lack the organizational maturity to buy and field it quickly. Twenty therefore sits in a market with strong urgency but meaningful friction between desire, authority, budget, and execution.'
