- calloutType: risk
  title: Policy support is rising faster than market clarity
  body: The same sources that create enthusiasm for private-sector offensive cyber also describe unresolved legal and operational boundaries. Demand may grow before procurement frameworks, oversight norms, and program authority become easy to navigate.
