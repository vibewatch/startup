  title: Headline cyber TAMs overstate Twenty's real market
  body: Analyst defense-cyber market sizes are useful context, but Twenty competes in a much narrower wedge shaped by offensive authorities, classified procurement, and a small set of mission owners. The company can be strategically important without sitting in a tens-of-billions directly addressable software market today.
  claimRefs:
  - CM001
  - CM002
  - CM003
