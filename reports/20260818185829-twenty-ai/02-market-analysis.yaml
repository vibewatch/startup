  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: precise-som
    missingEvidence: Program-level pipeline, contract-vehicle map, and management view of software-addressable spending inside defense and intelligence cyber budgets.
    whyItMatters: Public budgets prove demand but not the share of demand that a vendor like Twenty can realistically capture.
    diligencePath: Request pipeline by program, buyer, and budget line plus win/loss history and classified-budget access assumptions.
    relatedQuestionRefs:
    - QM019
    - QM023
  - type: private-evidence-only
    severity: material
    topic: allied-market
    missingEvidence: Specific allied customers, programs, or exportable product boundaries for non-U.S. adoption.
    whyItMatters: Allied expansion could enlarge the market materially, but no clean public evidence quantifies it.
    diligencePath: Request named allied accounts or at least region-by-region pipeline and export review status.
    relatedQuestionRefs:
    - QM024
  - type: conflicting-data
    severity: minor
    topic: market-size-methodology
    missingEvidence: Reconciliation between analyst-provider market boundaries that produce materially different 2026 defense-cyber totals.
    whyItMatters: A wide spread between analyst estimates is a reminder not to over-anchor on any single headline TAM.
    diligencePath: Review underlying analyst methodologies or replace with bottom-up budget sizing once more primary evidence is available.
    relatedQuestionRefs:
    - QM001
    - QM016
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: classified-budgets
    missingEvidence: Classified annex detail showing offensive-cyber, intelligence, and software-specific line items unavailable in public budget documents.
    whyItMatters: The most relevant buyer pools may sit in classified budget lines that public sources cannot decompose.
    diligencePath: Obtain management explanation of which classified programs matter and how procurement authority works in practice.
    relatedQuestionRefs:
    - QM008
    - QM017
  - type: private-evidence-only
    severity: material
    topic: authority-framework
    missingEvidence: Contracting and legal framework that governs how Twenty participates in mission workflows without owning deployment authority.
    whyItMatters: Market size is less useful than deployable scope when legal authorities are sensitive.
    diligencePath: Request customer contracting model, authorization workflow, and counsel memo on operational boundaries.
    relatedQuestionRefs:
    - QM014
    - QM022
