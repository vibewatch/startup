  topStrengths:
    - Twenty 切入一个战略重要楔子：美国国家安全买家内部，AI 自动化和进攻性网络需求都在上升。
    - 公开报道点名 USCYBERCOM 和 U.S. Navy 为客户背书；对一家年轻防务初创公司来说，这是异常强的验证。
    - 创始团队融合军方网络作战、情报以及 Palo Alto / Expanse 背景，贴合问题场景和买方群体。
    - Accel 领投融资和其他知名投资人降低近期融资风险，也验证了市场对类别的兴趣。
  topRisks:
    - 公开收入、ARR、利润率、烧钱速度、backlog 和续约数据仍未披露，使当前估值难以承销。
    - AI 驱动进攻性网络行动的法律和政策边界异常敏感，变化速度可能快过公司适应能力。
    - 公开客户验证集中在极少数具名防务账户，增加了项目和续约脆弱性。
    - 相较高溢价网络安全估值通常会披露的安全、合规和 AI 治理信息，公开控制面偏薄。
    - 如果交付模式偏部署重或劳动密集，利润率可能被压缩，不及软件优先叙事。
  unresolvedGaps:
    - 已验证 ARR 或收入、毛利率、烧钱速度、现金跑道和头部客户集中度。
    - 具名 USCYBERCOM 和 Navy 关系的续约深度、扩张历史和项目周期。
    - 安全材料包、认证状态、事件历史和 AI 治理控制。
    - 法律备忘录或客户授权工作流，明确私营部门进攻性网络行动如何获批、如何受约束。
    - 股权结构条款、清算优先权，以及下一轮融资会验证还是折价当前 $1B 标记。
