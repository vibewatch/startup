callouts:
  - calloutType: insight
    title: The reachable market is far smaller than the headline TAM
    body: >-
      Headline AI inference TAM figures are dominated by silicon and hyperscaler spend. Fireworks'
      true serviceable market is the independent open-weight inference niche, a few billion dollars
      today, which makes share capture against hyperscalers the central question.
    claimRefs: [CM006, CM009, CM019]
  - calloutType: risk
    title: Low switching costs cut both ways
    body: >-
      The OpenAI-compatible API that makes it trivial to adopt Fireworks also makes it trivial to
      leave, so durable share depends on performance and tuning lock-in rather than contractual
      stickiness.
    claimRefs: [CM021, CM024]
