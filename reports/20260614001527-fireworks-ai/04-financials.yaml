callouts:
  - calloutType: risk
    title: ~50% gross margin is the central financial weakness
    body: >-
      Because GPU costs sit in COGS, Fireworks' gross margin is roughly 50%, far below software
      norms. The path to the stated 60% target depends on unproven utilization gains and a revenue
      mix shift toward dedicated and enterprise workloads.
    claimRefs: [CI011, CI012]
  - calloutType: assumption
    title: Revenue figures are directional, not audited
    body: >-
      Annualized revenue estimates range from $130M (mid-2025) to roughly $800M (May 2026). The
      absence of audited financials, revenue mix and retention metrics means any single figure must
      be treated as directional.
    claimRefs: [CI018, CI020, CI029]
