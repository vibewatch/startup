schemaVersion: "report-v2"
artifact: financials
slug: fireworks-ai
runDate: "2026-06-14"
company:
  name: Fireworks AI
chapter:
  number: 4
  title: Financials
  summary: >-
    Fireworks monetizes inference via usage-based pricing across serverless, fine-tuning, RFT and
    dedicated tiers, with company-stated annualized revenue above $280M at the October 2025 Series C
    and third-party estimates ranging higher. Gross margins near 50% reflect heavy GPU costs in COGS;
    capital adequacy looks strong after a $250M raise, but burn, runway and audited figures are not public.
sections:
  - id: revenue-streams
    title: Revenue Streams and Pricing Model
    body: >-
      Fireworks operates a usage-based B2B model layered across several product surfaces that map to
      the customer lifecycle. Serverless inference is billed per token, fine-tuning is billed per
      training token, reinforcement fine-tuning is billed per GPU-hour, and on-demand dedicated
      deployments are billed per GPU-second or GPU-hour, while reserved capacity is contracted
      separately on longer commitments at negotiated pricing. This lets Fireworks capture revenue at
      nearly every stage of a customer's AI workflow, from experimentation through scaled production.
      Published serverless rates illustrate the model: roughly $0.90 per million tokens for Llama 3.3
      70B, $0.20 for the 8B model and $0.50 for DeepSeek V3, with image generation from about $0.013
      to $0.04 per image and reserved capacity near $4.80 per hour per replica. Revenue mix is not
      disclosed, but analysts expect a shift toward higher-value dedicated deployments, fine-tuning
      and enterprise contracts rather than commodity serverless token volume, which would improve
      both margin and revenue durability over time.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-efficiency
    title: Go-to-Market and Sales Efficiency
    body: >-
      Fireworks' go-to-market is bottoms-up at entry and top-down at expansion. Developers start
      immediately with self-serve API keys and pay-as-you-go billing, supported by $1 of free
      credits rather than an ongoing free tier, and a standard rate limit near 600 requests per
      minute. Larger customers graduate into negotiated enterprise relationships with higher rate
      limits, reserved capacity, account management, custom optimization and private deployment.
      Layered on top is a field and partner sales motion, anchored by an AWS Strategic Collaboration
      Agreement that funds proofs-of-concept and a startup acceleration program, giving Fireworks
      access to enterprise buyers through existing procurement channels rather than requiring a
      standalone vendor evaluation. Sales-efficiency metrics such as CAC, payback and net revenue
      retention are not disclosed, but the land-and-expand structure, in which a single serverless
      feature can grow into dedicated, fine-tuning, voice and reserved-capacity spend, is the
      principal efficiency lever, with blended annualized revenue per company estimated near $28,000
      across a base skewed toward a smaller number of large production deployments.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: cost-structure
    title: Cost Structure and Gross Margin Drivers
    body: >-
      Fireworks is not a pure software business: GPU procurement, capacity planning and regional
      infrastructure are real cost inputs embedded in cost of goods sold, which is why Sacra
      estimates gross margin near 50%, well below the 70%-plus typical of subscription software.
      Management has told investors it targets 60% through better GPU utilization, hardware
      efficiency gains on newer architectures such as NVIDIA Blackwell, and a revenue-mix shift
      toward dedicated and enterprise workloads. The core economic logic is that proprietary
      inference optimization, FireAttention and FireOptimizer, translates engineering into pricing
      power: if Fireworks serves a model faster and at higher throughput than a customer could
      self-host, it can charge a premium while undercutting the alternative's total cost. Multi-LoRA
      improves utilization by consolidating many fine-tuned variants onto a single base-model
      deployment, lowering compute cost per variant. The cost environment is shaped by NVIDIA and
      AMD data-center GPU economics, both of which report rapidly growing AI accelerator revenue,
      underscoring that Fireworks' input costs sit inside a supplier-driven, capacity-constrained market.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
    figureRefs: [FI002]
  - id: public-traction
    title: Public Traction Versus Private-Metric Gaps
    body: >-
      Public traction signals are strong but inconsistently dated. Fireworks stated annualized
      revenue surpassing $280 million at its October 2025 Series C; Sacra estimates roughly $305
      million at year-end 2025 rising to about $800 million annualized by May 2026; a third-party
      profile cites $315 million-plus by early 2026; and earlier 2025 coverage reported $130 million
      ARR with claims of profitability and roughly 20x year-over-year growth. The platform processes
      more than 10 trillion tokens per day (15 trillion by early 2026) across 10,000-plus companies
      and hundreds of thousands of developers. These are largely company-stated or estimated figures;
      audited financials, revenue mix, net revenue retention, churn and headcount are not public.
      The wide revenue spread, from $130 million to roughly $800 million annualized within twelve
      months, reflects both genuine hypergrowth and inconsistent measurement, and any single number
      should be treated as directional rather than verified.
    claimRefs: [CI017, CI018, CI019, CI020, CI021]
    tableRefs: [TI005]
    figureRefs: [FI003]
  - id: capital-adequacy
    title: Capital Adequacy and Financing Dependency
    body: >-
      Fireworks has raised more than $327 million across seed, Series A, B and C rounds; the October
      2025 Series C alone provided $250 million, comprising roughly $230 million of primary capital
      and a $20 million secondary, at a $4 billion valuation. That primary injection, combined with
      reported profitability in 2025 and a high-growth revenue base, suggests comfortable near-term
      capital adequacy, though cash on hand, burn rate and runway are not disclosed. The company has
      signaled it will grow its compute footprint three-to-four-fold over the next year, a
      capital-intensive plan that increases dependence on GPU access and could become the next-round
      trigger; Sacra reports Fireworks is in talks to raise again at a $15 billion valuation as of
      May 2026. The principal financing dependency is GPU supply: Fireworks does not own its fleet
      and sources NVIDIA and AMD capacity from third parties, exposing it to allocation constraints
      and to NVIDIA's own entry into inference. No public debt or project-finance obligations are
      disclosed.
    claimRefs: [CI022, CI023, CI024, CI025, CI026]
    tableRefs: [TI004]
    figureRefs: [FI004]
  - id: financial-verdict
    title: Financial Verdict
    body: >-
      On revenue quality, Fireworks shows credible hypergrowth and a usage-based model that captures
      spend across the customer lifecycle, but the absence of audited figures, disclosed revenue mix
      and retention metrics caps confidence. On margin, the roughly 50% gross margin is the central
      financial weakness: it is structurally below software norms because of GPU costs, and the path
      to the stated 60% target depends on utilization gains and a mix shift that are plausible but
      unproven. On capital intensity, the three-to-four-fold compute expansion and lack of owned GPUs
      make the model more capital-hungry and supply-dependent than a typical SaaS company. The main
      diligence blockers are a single reconciled revenue figure, gross-margin and unit-economics
      verification, burn and runway, and net revenue retention. The picture is a fast-scaling,
      well-funded business with real but supplier-exposed economics rather than a proven
      high-margin software compounder.
    claimRefs: [CI027, CI028, CI029, CI030]
