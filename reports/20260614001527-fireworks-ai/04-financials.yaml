  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue and margin verification
      missingEvidence: Audited or management-confirmed revenue, gross margin, burn and runway with a dated as-of.
      whyItMatters: These are the core inputs to any financial quality and valuation judgment and are currently estimates.
      diligencePath: Request a financial data pack under NDA covering ARR, revenue mix, gross margin, burn and cash.
      relatedQuestionRefs: [QI004, QI023]
    - type: conflicting-data
      severity: material
      topic: revenue figure
      missingEvidence: A single reconciled annualized revenue number for Fireworks.
      whyItMatters: Estimates range 6x within a year, undermining growth and multiple analysis.
      diligencePath: Reconcile company-stated and Sacra figures to a common definition and date.
      relatedQuestionRefs: [QI018]
    - type: missing-source
      severity: material
      topic: sales efficiency
      missingEvidence: CAC, payback and net revenue retention data for Fireworks.
      whyItMatters: Sales efficiency determines whether revenue growth is durable and capital-efficient.
      diligencePath: Obtain cohort expansion and CAC data during diligence.
      relatedQuestionRefs: [QI006, QI009]
