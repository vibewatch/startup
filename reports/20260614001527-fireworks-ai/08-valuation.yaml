callouts:
  - calloutType: recommendation
    title: Track, with entry discipline below the rumored mark
    body: >-
      Fireworks is a high-quality asset at a demanding price. Underwrite to the base case ($5-8B),
      reserve premium entry for proof that gross margin can climb off ~50% and that retention is
      strong, and treat the $15B talk as a stretch.
    claimRefs: [CV007, CV009, CV031]
  - calloutType: risk
    title: The multiple rests on undisclosed variables
    body: >-
      The right valuation hinges on a reconciled revenue figure, the margin path to 60%, and net
      revenue retention, none of which are publicly disclosed, so any premium entry is underwriting
      to unverified inputs.
    claimRefs: [CV010, CV011, CV032]
