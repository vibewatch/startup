      diligencePath: Obtain management-confirmed ARR with a definition and as-of date.
      relatedQuestionRefs: [QV005, QV006, QV023]
    - type: private-evidence-only
      severity: material
      topic: margin and retention
      missingEvidence: Audited gross margin, the path to 60%, and net revenue retention.
      whyItMatters: These determine whether an infrastructure or commodity multiple applies.
