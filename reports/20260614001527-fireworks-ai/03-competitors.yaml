company:
  name: Fireworks AI
chapter:
  number: 3
  title: Competitors
  summary: >-
    Fireworks faces four competitive layers: managed open-model peers (Together AI, Baseten,
    Replicate), vertically integrated silicon (Groq, Cerebras, SambaNova), hyperscaler bundles
    (Bedrock, Vertex, Azure Foundry, Databricks) and open-source serving frameworks. It leads on
    reliability and function calling but is sandwiched on price by Together and on raw speed by Groq.
sections:
  - id: landscape
    title: Competitive Landscape
    body: >-
      The inference market has segmented into four distinct competitive layers, and Fireworks faces
      pressure from each. Managed open-model platforms, principally Together AI, Baseten and
      Replicate, are the closest direct peers, competing on model breadth, developer experience and
      per-token price. Vertically integrated silicon players, Groq, Cerebras and SambaNova, attack
      latency and cost from custom hardware rather than software optimization on commodity GPUs.
      Hyperscaler bundles, AWS Bedrock, Google Vertex AI, Microsoft Azure Foundry and Databricks
      Model Serving, are the most structurally threatening because they collapse model access,
      infrastructure, governance and contracting into one platform. Finally, open-source serving
      frameworks such as vLLM and SGLang, plus packaging layers like NVIDIA NIM and routers like
      OpenRouter, commoditize the proprietary advantage embedded in Fireworks' own stack. Status-quo
      alternatives include continued use of closed APIs and internal self-hosting. The most likely
      new entrant pressure comes from NVIDIA itself, which entered inference directly via its Lepton
      acquisition and a competing GPU-cloud marketplace, turning a key supplier into a rival.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006]
    figureRefs: [FP001]
  - id: competitor-profiles
    title: Competitor Profiles
    body: >-
      Together AI is Fireworks' closest direct competitor: founded in 2021 by Percy Liang, Chris Ré
      and Vipul Ved Prakash, it raised a $305 million Series B in February 2025 at a $3.3 billion
      valuation, reportedly reached about $1 billion annualized revenue by early 2026, and spans
      serverless inference, dedicated clusters, fine-tuning, voice and reinforcement learning.
      Baseten positions as an enterprise inference-engineering platform with self-hosted and hybrid
      VPC deployment; it raised a $300 million round in January 2026 at a $5 billion valuation, led
      by IVP and CapitalG with a reported $150 million from NVIDIA, lifting total funding to roughly
      $585 million. Groq competes from custom LPU silicon, raising $750 million in September 2025 at
      a $6.9 billion valuation and advertising 750-plus tokens per second on Llama models, with a
      Meta partnership powering the official Llama API. Cerebras and SambaNova extend the
      hardware-led attack at the premium latency end, while Replicate, Modal and Anyscale compete
      for developer mindshare. Against these, Fireworks holds a $4 billion valuation and $280
      million-plus revenue with category-leading reliability and function calling.
    claimRefs: [CP007, CP008, CP009, CP010, CP011, CP012, CP013]
    tableRefs: [TP001]
  - id: comparisons
    title: Capability, Pricing and GTM Comparisons
    body: >-
      On capability, Fireworks differentiates through reliability and structured output: independent
      monitoring put its Q1 2026 uptime at 99.8%, the highest among specialized providers, and its
      FireFunction models hit roughly 92% multi-tool function-calling accuracy, ahead of Together
      and Groq and within a few points of GPT-4o. On price, the field is razor-thin: Llama 3.3 70B
      runs about $0.90 per million tokens on Fireworks versus $0.88 on Together and $0.59 on Groq,
      and the same model spreads roughly sixfold across the seven-provider field. On raw speed Groq's
      LPU dominates at 400-750 tokens per second versus Fireworks' ~145, but Fireworks wins latency
      consistency and stability under load. On go-to-market, Together and Baseten match Fireworks'
      bottoms-up developer motion, but hyperscalers win distribution through existing procurement,
      security and billing relationships. On trust and regulation, Fireworks, Together and Baseten
      all offer SOC2/HIPAA postures and VPC or data-residency options, with Baseten leaning hardest
      into self-hosted compliance-heavy deployments.
    claimRefs: [CP014, CP015, CP016, CP017, CP018, CP019]
    tableRefs: [TP002, TP003]
    figureRefs: [FP002]
  - id: switching-distribution
    title: Switching Costs, Lock-in and Distribution Power
    body: >-
      Switching costs in inference are structurally low. Most providers, including Fireworks,
      Together, Groq and Baseten, expose OpenAI-compatible APIs, so migration between them can take
      minutes, and routing aggregators such as OpenRouter and TokenMix actively encourage
      multi-homing and automatic failover across providers. This caps durable lock-in for everyone
      and means share is defended by performance, tuning and enterprise integration rather than
      contracts. Distribution power is increasingly decisive: hyperscalers and NVIDIA control the
      GPU supply, security posture and procurement relationships that independents depend on.
      Fireworks' counter is to plug into those channels through its AWS Strategic Collaboration
      Agreement and Microsoft Foundry availability, while moving up the stack into fine-tuning,
      reinforcement learning, voice and enterprise governance to create stickier, higher-value
      relationships. Baseten's VPC and self-hosted footprint and Together's owned data-center and
      GPU-cluster strategy are alternative answers to the same distribution and supply problem.
    claimRefs: [CP020, CP021, CP022, CP023, CP024]
  - id: moat-durability
    title: Moat Durability and Adverse Evidence
    body: >-
      Fireworks' moat is real but narrow. Its proprietary FireAttention and FireOptimizer stack
      converts inference-systems engineering into a performance-and-price advantage, and its
      reliability and function-calling lead are genuine. But the moat faces clear erosion vectors.
      Open-source serving frameworks like vLLM and SGLang keep closing the performance gap, and
      Baseten openly builds on them; NVIDIA pushes NIM as a packaging layer; Snowflake released
      Arctic Inference as an open vLLM plugin. Better-capitalized rivals raise the stakes: Groq at
      $6.9 billion, Baseten at $5 billion and Together near a rumored $7.5 billion all have more
      balance-sheet room for GPU commitments and enterprise go-to-market. Hardware concentration is
      an adverse signal too, since Fireworks does not own GPUs while NVIDIA, a supplier and investor,
      now competes directly. The durable question is whether Fireworks can keep extending its stack
      into tuning, agents and governance faster than the ecosystem commoditizes the serving layer.
    claimRefs: [CP025, CP026, CP027, CP028, CP029, CP030]
    tableRefs: [TP004]
    figureRefs: [FP003]
