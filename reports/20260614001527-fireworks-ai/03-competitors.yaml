callouts:
  - calloutType: risk
    title: Sandwiched on price and speed
    body: >-
      Fireworks is within 2% of Together on price and runs roughly a third of Groq's throughput,
      so it must win on reliability, function calling and tuning rather than on the two axes buyers
      most easily benchmark.
    claimRefs: [CP015, CP018]
  - calloutType: insight
    title: The supplier is now a competitor
    body: >-
      NVIDIA is simultaneously Fireworks' GPU supplier, an investor and, via Lepton and its
      GPU-cloud marketplace plus NIM packaging, a direct competitor, the most structurally
      important dynamic in the landscape.
    claimRefs: [CP006, CP027]
