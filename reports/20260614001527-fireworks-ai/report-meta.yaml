companyProfile:
  summary: >-
    Fireworks AI is a Redwood City-based AI inference cloud founded in 2022 by Lin Qiao and a team of
    former Meta PyTorch engineers. It lets enterprises run, fine-tune and scale hundreds of
    open-source LLM, image, audio and multimodal models in production via an OpenAI-compatible API,
    differentiating on proprietary inference optimization (FireAttention, FireOptimizer), best-in-class
    function calling and category-leading reliability. The company raised a $250M Series C at a $4B
    valuation in October 2025, reports rapid revenue growth to a third-party-estimated ~$800M
    annualized, and serves 10,000-plus companies including Cursor, Notion, DoorDash and Samsung.
  foundedDate: "2022-01-01"
  founders:
    - name: Lin Qiao
      role: CEO & Co-founder
      background: Former Head of PyTorch at Meta leading 300+ engineers; prior LinkedIn and IBM; PhD UC Santa Barbara.
      claimRefs: [CO006, CO009]
    - name: Dmytro Dzhulgakov
      role: Co-founder (CTO-level)
      background: Former core PyTorch maintainer at Meta since 2011; from Kharkiv, Ukraine.
      claimRefs: [CO007, CO008]
    - name: Dmytro Ivchenko
      role: Co-founder
      background: Former Meta PyTorch ranking engineer; prior LinkedIn; Kyiv Polytechnic graduate.
      claimRefs: [CO008, CO010]
  foundingLocation: Redwood City, California, USA
  headquarters: Redwood City, California, USA
  productSummary: >-
    Usage-based AI inference platform: per-token serverless inference for open models, LoRA and
    reinforcement fine-tuning, dedicated and reserved GPU deployments, a function-calling model
    family (FireFunction), and a voice-agent platform, all on a proprietary optimized inference engine.
  customerFocus: >-
    AI-native startups, digital-native enterprises and select Fortune 500 buyers building
    production generative-AI applications that need fast, cost-efficient, controllable open-model inference.
  businessModel: >-
    B2B usage-based monetization across serverless (per token), fine-tuning (per training token),
    reinforcement fine-tuning (per GPU-hour) and dedicated/reserved deployments, with bottoms-up
    developer entry expanding into negotiated enterprise contracts.
  stage: Series C (private, venture-backed)
  fundingStatus: >-
    $250M Series C at $4B valuation (Oct 2025), >$327M total raised; reportedly in talks for a ~$15B
    round co-led by Index Ventures as of May 2026 (unconfirmed).
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO011, CO014, CO018]
