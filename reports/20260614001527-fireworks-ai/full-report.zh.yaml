              - CV010
      - number: '8.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 跟踪，但以低于传闻标记的价格保持进入纪律
            body: Fireworks 是高质量资产，但价格要求高。按基准情景（$5-8B）承保；只有在证明毛利率能从 ~50% 抬升、留存强劲后，才考虑溢价进入；把 $15B 讨论视为拉伸情形。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV009
              - CV031
          - type: callout
            title: 倍数取决于未披露变量
            body: 正确估值取决于对齐后的收入数字、通向 60% 的毛利率路径和净收入留存；三者均未公开披露，因此任何溢价进入都等于在承保未验证输入。
            calloutType: risk
            claimRefs:
