      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              能力上，Fireworks 通过可靠性和结构化输出做出差异：独立监测显示其 2026 年 Q1 可用性为 99.8%，在专业提供商中最高；FireFunction 模型多工具函数调用准确率约 92%，领先
              Together 和 Groq，距离 GPT-4o 只差几个百分点。价格上，竞争极薄：Llama 3.3 70B 在 Fireworks 每百万 tokens 约 $0.90，Together 为
              $0.88，Groq 为 $0.59；同一模型在七家提供商之间价差约六倍。原始速度上，Groq 的 LPU 以每秒 400–750 tokens 领先，而 Fireworks 约为 145；但 Fireworks
              赢在延迟一致性和负载下稳定性。GTM 上，Together 和 Baseten 与 Fireworks 一样走自下而上的开发者路径，但 hyperscaler
              通过既有采购、安全和计费关系赢得分发。信任与监管方面，Fireworks、Together 和 Baseten 均提供 SOC2/HIPAA 姿态以及 VPC 或数据驻留选项，Baseten
              最偏向自托管、合规重的部署。
