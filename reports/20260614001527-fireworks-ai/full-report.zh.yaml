        title: 运营、质量和安全风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Fireworks 最核心的敞口是 GPU 供给。公司不拥有自己的集群，而是从第三方采购 NVIDIA 和 AMD 容量；随着算力扩张 3–4
              倍，它会暴露在配额约束、供应瓶颈和硬件换代时点风险中。实测数据上，可靠性是强项，2026 年 Q1 独立监测 uptime 为 99.8%；但 Fireworks 未发布正式的标准层
              SLA，因此合同可靠性承诺逐案谈判，事故历史也不透明。跨 Frankfurt、Iceland、Tokyo 以及 US、EU、APAC 区域运营全球多区域集群，会增加运营复杂度和成本。安全和合规姿态相对较强：基于
              AWS 的推理具备 SOC2 Type II 和 HIPAA，支持零数据留存、airgapped EKS 和 bring-your-own-bucket
              训练，且公开信息中没有已知数据泄露；即便如此，客户工作负载是生产级且延迟敏感，单次严重宕机或数据事件都会尤其伤。评测者还指出文档偏薄、公司扩张时支持可能吃紧；这些是质量风险，不是安全风险。
