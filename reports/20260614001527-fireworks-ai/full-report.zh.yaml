        blocks:
          - type: paragraph
            body: >-
              Fireworks AI 由 CEO Lin Qiao 与六位同事共同创立，多数人曾在 Meta 共同参与 PyTorch。Qiao 此前是 Meta 工程高级总监兼 PyTorch 负责人，带过 300
              多名工程师；更早在 LinkedIn、IBM 及其他大型系统公司任职；拥有 UC Santa Barbara 计算机科学博士学位。联合创始人包括 Dmytro Dzhulgakov，他是前核心 PyTorch
              维护者，2011 年加入 Facebook；以及 Dmytro Ivchenko，毕业于 Kyiv Polytechnic，曾在 Meta 负责 PyTorch 排序，两人均来自乌克兰。其余创始人 James
              Reed、Benny Chen、Chenyu Zhao 和 Pawel Garbacki 来自 Meta PyTorch 编译器、广告基础设施、核心 ML 团队以及 Google Vertex
              AI。投资人反复把创始团队深厚的推理系统背景视为公司核心优势；这也形成集中在 Qiao 身上的关键人依赖。
