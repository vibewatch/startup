      - number: '5.3'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Fireworks 在通用 NVIDIA GPU 上运行自研多层推理栈。内核层，FireAttention 是定制 CUDA attention 实现；Fireworks 称其显著快于 vLLM 和
              TensorRT-LLM，并在多个版本中扩展，以支持长上下文和 Llama 4 chunked local attention 等架构。其上，FireOptimizer 执行自适应 speculative
              execution，针对每个工作负载个性化 speculative decoding、draft-model 选择和缓存；公司称生产中延迟最高可降低约 3 倍，并在 NVIDIA Blackwell B200
              硬件上原生支持 FP4。服务拓扑结合无状态请求路由器、用于 speculative decoding 的 draft 和 target GPU pods、分布式 KV cache、连续 batching 和
              disaggregated serving，扩展到文档记录的约每分钟 50,000 次请求测试。Multi-LoRA 将许多微调变体整合到单个基础模型上。运营模式对开放模型中立：Fireworks
              赌的是运行任一时点胜出的开放模型，而不是押注单个模型；因此对新版本首日支持成为核心工程纪律。
