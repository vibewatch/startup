      - number: '2.5'
        title: 规模测算缺口与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              几个缺口限制了市场规模测算的可信度。公开的 “AI inference” 总量差异很大，并打包了不兼容类别（芯片、hyperscaler 服务和独立软件），因此自上而下的 TAM 不能干净映射到
              Fireworks 可触达收入。没有标准分析机构衡量独立推理提供商收入池；只能从单家公司估计拼出，时间口径和可靠性参差不齐。不同机构预测的 CAGR 约在 13% 至 19% 之间，2034 年估计相差超过
              $200B。在其中，Fireworks
              自身收入数字也被多个来源争议。这些缺口说明市场显然很大且高速增长，但与估值相关的可服务和可获得份额仍是估计，不是实测事实；任何规模测算都应视为方向性判断。我们保留这种精度失败，而不是断言一个单一 SAM。
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 可触达市场远小于标题 TAM
            body: >-
              标题级 AI 推理 TAM 主要由芯片和 hyperscaler 支出主导。Fireworks 真正的可服务市场，是今天只有数十亿美元规模的独立开放权重推理细分市场；能否从 hyperscaler
              手中拿份额，才是核心问题。
            calloutType: insight
            claimRefs:
              - CM006
