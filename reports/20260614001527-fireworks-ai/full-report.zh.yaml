      - number: '4.3'
        title: 成本结构与毛利率驱动
        blocks:
          - type: paragraph
            body: >-
              Fireworks 不是纯软件业务：GPU 采购、容量规划和区域基础设施都是计入 COGS 的真实成本输入，因此 Sacra 估计毛利率接近 50%，远低于订阅软件常见的 70%
              以上。管理层告诉投资人，公司目标是通过更高 GPU 利用率、NVIDIA Blackwell 等新架构带来的硬件效率提升，以及收入结构向专用和企业工作负载转移，把毛利率推到 60%。核心经济逻辑是，自研推理优化
              FireAttention 和 FireOptimizer 能把工程能力转成定价权：如果 Fireworks 比客户自托管更快、更高吞吐地服务模型，就可以在低于替代方案总成本的同时收取溢价。Multi-LoRA
              把许多微调变体整合到单个基础模型部署上，降低每个变体的计算成本。成本环境受 NVIDIA 和 AMD 数据中心 GPU 经济性塑造；两家公司都报告 AI 加速器收入快速增长，说明 Fireworks
              的投入成本处在供应商驱动、容量受限的市场里。
