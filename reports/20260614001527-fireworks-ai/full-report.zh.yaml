chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Fireworks AI 是一家美国人工智能基础设施公司，总部位于 California Redwood City，由一支离开 Meta PyTorch 组织的团队于 2022 年末创立。公司运营其所谓的「AI
              Cloud」，面向企业开发团队：托管推理平台以低延迟服务运行、微调并扩展开源大语言、视觉、音频和多模态模型。它的核心判断是 “one-size-fits-one”（一客一策）推理：最高价值的 AI
              不会来自少数通用封闭基础模型，而会建立在更小、可定制、并用企业专有数据调优的开放模型上。商业化按客户生命周期计费：无服务器推理按 token 收费，微调按训练 token 收费，强化微调按 GPU-hour
              收费，按需或预留专用部署按 GPU-second 或 GPU-hour 收费。平台提供数百个模型、OpenAI 兼容 API、函数调用和企业安全控制，把 Fireworks 放在商品化 GPU 租赁与封闭模型
              API 之间。
