              Fireworks 的护城河真实但狭窄。自研 FireAttention 和 FireOptimizer 栈把推理系统工程转化为性能与价格优势，可靠性和函数调用领先也是真实优势。但护城河面临清晰侵蚀路径。vLLM
              和 SGLang 等开源服务框架持续缩小性能差距，Baseten 也公开基于它们构建；NVIDIA 把 NIM 推成打包层；Snowflake 发布 Arctic Inference，作为开放 vLLM
              插件。资本更厚的竞争对手抬高门槛：Groq 估值 $6.9B，Baseten 估值 $5B，Together 传闻接近 $7.5B，都有更多资产负债表空间承诺 GPU 和企业 GTM。硬件集中也是负面信号，因为
              Fireworks 不拥有 GPU，而供应商兼投资人 NVIDIA 现在直接竞争。长期问题在于，Fireworks 能否比生态系统商品化服务层更快，把栈延伸到调优、智能体和治理。
