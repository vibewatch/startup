  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              推理市场已经分成四个清晰的竞争层，Fireworks 每一层都承压。托管开放模型平台，主要是 Together AI、Baseten 和 Replicate，是最接近的直接同业，围绕模型广度、开发者体验和按
              token 价格竞争。垂直整合的芯片玩家 Groq、Cerebras 和 SambaNova，不靠通用 GPU 上的软件优化，而是用定制硬件攻击延迟和成本。Hyperscaler 套件——AWS
              Bedrock、Google Vertex AI、Microsoft Azure Foundry 和 Databricks Model
              Serving——结构性威胁最大，因为它们把模型访问、基础设施、治理和合同压进一个平台。最后，vLLM 和 SGLang 等开源服务框架，加上 NVIDIA NIM 这样的打包层和 OpenRouter
              这样的路由器，正在商品化 Fireworks 自身栈里的专有优势。现状替代方案包括继续使用封闭 API 和内部自托管。最可能的新进入者压力来自 NVIDIA 本身：它通过收购 Lepton 和推出竞争性 GPU
              云市场直接进入推理，把关键供应商变成对手。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
