      - number: '5.5'
        title: 差异化、IP 与数据
        blocks:
          - type: paragraph
            body: >-
              Fireworks 的差异化由工程驱动。核心知识产权是自研推理引擎，尤其是 FireAttention 的定制 kernels 和 FireOptimizer 的自适应优化，把创始团队 PyTorch
              背景中的系统能力转化为可衡量的速度和成本优势；没有公开专利列出，因此护城河是 know-how，而不是注册 IP。第二个差异化来源是产品—模型协同设计：客户交互形成数据反馈环，持续改进微调模型；Fireworks
              将其描述为企业用 AI 构建竞争护城河的方式。第三是广度和新鲜度：数百个开放模型和模态的首日支持，让平台受益于模型更替，而不是被它威胁。主要脆弱点在于，优化优势建立在 vLLM 和 SGLang
              等持续进步的开源框架之上，因此差异化必须不断重新赚回来。获取前沿 NVIDIA 和 AMD GPU 的供给也是助推优势，但并非独占优势。
