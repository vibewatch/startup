  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              从客户角度看，Fireworks 是把开源模型带入生产的那一层：跑得快、便宜、可靠，客户无需管理 GPU。开发者注册后，把 OpenAI 兼容 API 指向 Llama 4、DeepSeek 或 Qwen
              等模型，即可获得低延迟推理、函数调用、JSON 模式结构化输出和流式传输。随着用量增长，同一客户可以用专有数据微调模型，迁移到专用或预留 GPU 容量以获得有保障的吞吐，加入用于 RAG 的检索和
              embeddings，并部署语音智能体。平台横跨文本、图像（Flux、SDXL）、音频和多模态格式，覆盖数百个模型，并对主要新版本提供首日支持。它为客户完成的核心工作，是把「能在 notebook
              里跑」的模型，与「能在生产环境服务数百万用户」的模型之间的缺口压平；Fireworks 将此定位为实验与发货的区别。这也是客户把它称为推理引擎而非应用的原因：它提供速度、成本和控制，产品由客户自己构建。
