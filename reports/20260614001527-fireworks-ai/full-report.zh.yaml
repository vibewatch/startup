      - number: '7.2'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              Fireworks 的监管和法律敞口真实存在，但目前仍可管理。最重要的制度是 EU AI Act，它对通用和 foundation-model
              提供商及其部署方施加分层、基于风险的义务，包括透明度和文档要求；Fireworks 作为推理和微调平台，位于欧盟客户的合规链条上。GDPR
              和数据驻留要求推动公司提供零数据留存、数据驻留和区域部署功能，任何失误都会带来罚款和声誉成本。开放模型许可是更隐蔽的法律风险：Llama
              等模型带有可接受使用和许可条款，行业关于训练数据版权的未决问题也可能传导到服务这些模型的平台。知识产权敞口也存在反向问题：Fireworks 没有列出公开专利，因此 FireAttention 和
              FireOptimizer 的优势依赖商业秘密和 know-how；关键工程师离开后更难防守。公开信息中没有针对 Fireworks 的重大诉讼或执法行动，其 Series C
              也由顶级法律顾问执行，但公司卖向医疗、金融服务和准政府行业后，监管表面积会扩大。
