      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              几个因素在扩大 Fireworks 的市场。开源模型质量正在向封闭模型靠拢，智能体和复合 AI 系统会放大每个任务的推理调用次数，基于专有数据的微调正成为竞争必需品，企业也越来越希望掌控自己的
              AI，而不是依赖少数封闭实验室。成本压力同样有利：规模化时，开放权重推理可以比封闭 API 便宜很多。反向约束也很强。随着 vLLM 和 SGLang
              进步，推理正在商品化，优化栈的专有优势被压缩，并引发价格竞争；Fireworks 的 Llama 70B 价格与 Together 相差约 2% 以内。Hyperscaler 捆绑让 AWS、Azure 和
              Google 把推理折进既有安全、计费和治理关系。GPU 供给集中，Fireworks 也不拥有自己的机群。EU AI Act 等监管增加合规开销；降低迁入成本的 OpenAI 兼容 API
              同样降低迁出成本，限制长期锁定。
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
