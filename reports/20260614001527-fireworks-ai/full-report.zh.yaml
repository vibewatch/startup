      - number: '7.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 赋能伙伴也是竞争者
            body: NVIDIA、AWS 和 Microsoft 都提供关键投入或分发，同时也在竞争吸收推理层；供应商多元化和伙伴深度因此成为决定性风险变量。
            calloutType: risk
            claimRefs:
              - CR019
