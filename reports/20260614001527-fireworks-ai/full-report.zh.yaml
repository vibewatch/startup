        title: 切换成本、锁定与分发能力
        blocks:
          - type: paragraph
            body: >-
              推理的切换成本结构性偏低。包括 Fireworks、Together、Groq 和 Baseten 在内的大多数提供商都暴露 OpenAI 兼容 API，供应商之间迁移可在数分钟内完成；OpenRouter 和
              TokenMix 等路由聚合器还主动鼓励跨提供商多栖和自动故障转移。这限制了所有人的长期锁定，意味着份额要靠性能、调优和企业集成守住，而不是靠合同。分发能力越来越关键：hyperscaler 和 NVIDIA
              控制独立提供商依赖的 GPU 供给、安全姿态和采购关系。Fireworks 的反制，是通过 AWS Strategic Collaboration Agreement 和 Microsoft Foundry
              可用性接入这些渠道，同时向微调、强化学习、语音和企业治理上移，创造更粘、更高价值的关系。Baseten 的 VPC 与自托管足迹、Together 的自有数据中心和 GPU
              集群策略，是对同一分发与供给问题的替代答案。
            claimRefs:
