          - type: paragraph
            body: >-
              Fireworks 处在一张密集的依赖网络里。最尖锐的是 NVIDIA：Fireworks 的性能和毛利率主张依赖 NVIDIA 供应的领先 GPU，NVIDIA 持有投资份额，如今又通过收购
              Lepton、GPU-cloud marketplace 和 NIM 打包直接竞争。AWS 和 Microsoft 既是伙伴也是威胁：Strategic Collaboration Agreement 和
              Foundry 可用性提供分发，但 Bedrock、Vertex 和 Azure 可以把推理捆进既有安全、计费和治理关系，吸收这一品类。Fireworks 还依赖 Meta、DeepSeek、Alibaba
              等持续发布开放模型并保持许可宽松；如果开放模型质量放缓，或许可转向限制性条款，开放模型中立的论点会被削弱。云平台依赖、少数 late-stage
              基金带来的资本提供方集中，以及成熟买家可多栖造成的关键客户集中，共同补全依赖图谱。共同主线是：Fireworks 的赋能伙伴也是最可信的竞争者，因此伙伴深度和供应商多元化是风险图景的核心。
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
