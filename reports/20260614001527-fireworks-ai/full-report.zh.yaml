  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Fireworks 所在的是托管 AI 推理市场：为生产应用服务、微调并专用部署开放权重大语言、视觉、音频和多模态模型。相关支出是企业付给第三方、让模型在生产环境运行的钱，而不是训练基础模型或租裸 GPU
              的开销。核心边界之外包括前沿实验室消耗的基础模型训练算力、CoreWeave 和 Lambda 等提供商的原始 GPU IaaS，以及 OpenAI 和 Anthropic 的封闭模型 API；但封闭 API
              是最重要的现状替代方案。Fireworks 正在扩展进入的相邻预算池包括语音智能体、结合向量数据库的检索增强生成，以及面向智能体的强化学习训练。Fireworks 最直接的替代品，是在 vLLM 或 SGLang
              上自托管开放模型、AWS Bedrock 和 Azure Foundry 等 hyperscaler 套件，以及继续依赖封闭 API。必须先界定边界，因为标题里的 “AI inference”
              市场数字把硬件、hyperscaler 和独立提供商支出混在了一起。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
