      - number: '7.5'
        title: 财务、模型和执行风险
        blocks:
          - type: paragraph
            body: >-
              财务上，核心风险是毛利率压缩。约 50% 的毛利率在结构上低于软件常态，因为 GPU 成本进入 COGS；相较 Together 几乎贴身的价格差，加上开源 serving
              框架持续改进，都会形成长期下行压力。公司声称走向 60% 的路径，取决于尚未被证明的利用率提升和收入结构变化。资本强度进一步放大问题：3–4 倍算力扩张需要反复投入容量，burn、runway
              和净收入留存未披露，因此资本充足性更多是声称而非验证。从 $552 million 到 $4 billion、约十五个月内的估值爬坡，再加上 $15 billion
              传闻，嵌入了激进增长预期；任何放缓或毛利率失望都会受到惩罚。执行和人员方面，创始团队的 PyTorch 背景是优势，但关键人风险集中在 CEO Lin
              Qiao；在火热市场里留住顶尖推理工程师仍是持续挑战。所有这些风险的缓释逻辑都是同一个向上游堆栈多元化，但能否成功正是投资的核心未解题。
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
          - type: table
            tableRef: TR004
            claimRefs:
              - CR029
              - CR030
              - CR033
      - number: '7.6'
        title: 缓释、监控与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Fireworks 的缓释路径是连贯的：把堆栈延伸到微调、强化学习、语音和企业治理，逃离商品化 serving；在 NVIDIA 和 AMD 之间分散芯片，并追求 Blackwell 效率；维持 day-zero
              开放模型支持，让模型更替成为顺风；强化企业合规，拿下受监管行业；接入 AWS 和 Azure 采购，而不是正面硬拼。真正该监控的指标是毛利率向 60% 的轨迹、收入结构向专用和企业迁移、披露后的净收入留存、GPU
              成本和配额条款，以及相较 vLLM 和 SGLang 的竞争差距。最清晰的论点失效触发器包括：毛利率无法从 ~50% 抬升或进一步压缩；超大云厂商或 NVIDIA 拿走推理层，把 Fireworks 降格为优化
              add-on；关键人离开；或增长低于 $4 billion-plus 估值隐含的速度。优先尽调问题是对齐后的收入和毛利率数字、NRR 和 burn、GPU
              供给合同，以及头部客户集中度。总体剩余敞口中高，主要集中在商品化和依赖风险，而非法律或运营失败。
            claimRefs:
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
