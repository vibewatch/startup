              Fireworks 已通过种子轮、Series A、B、C 融资超过 $327M；仅 2025 年 10 月的 Series C 就提供 $250M，其中约 $230M 为一级资本、$20M 为二级交易，估值
              $4B。这笔一级注资叠加 2025 年据称盈利和高增长收入基础，说明近期资本充足性较舒服；但现金余额、烧钱速度和跑道未披露。公司已表示未来一年会将计算足迹扩大三到四倍，这是资本密集计划，会提高对 GPU
