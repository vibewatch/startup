      - number: '3.2'
        title: 竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Together AI 是 Fireworks 最接近的直接竞争对手：它由 Percy Liang、Chris Ré 和 Vipul Ved Prakash 于 2021 年创立，2025 年 2 月以
              $3.3B 估值完成 $305M Series B，据称到 2026 年初年化收入约 $1B，覆盖无服务器推理、专用集群、微调、语音和强化学习。Baseten 定位为企业推理工程平台，提供自托管和混合 VPC
              部署；它在 2026 年 1 月以 $5B 估值完成 $300M 融资，由 IVP 和 CapitalG 领投，据称 NVIDIA 投入 $150M，使总融资升至约 $585M。Groq 以定制 LPU
              芯片竞争，2025 年 9 月以 $6.9B 估值融资 $750M，并宣传 Llama 模型上每秒 750 多 tokens，且与 Meta 合作为官方 Llama API 提供动力。Cerebras 和
              SambaNova 在高端低延迟市场延续硬件主导攻击，Replicate、Modal 和 Anyscale 争夺开发者心智。相比之下，Fireworks 拥有 $4B 估值和 $280M
              以上收入，并在可靠性和函数调用上处于品类领先。
