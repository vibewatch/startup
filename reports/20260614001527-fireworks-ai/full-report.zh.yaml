      - number: '2.2'
        title: 多视角市场规模测算
        blocks:
          - type: paragraph
            body: >-
              Fireworks 的机会不能用单一数字概括，因此我们用三种视角交叉测算。最宽的自上而下视角是全球 AI 推理市场：MarketsandMarkets 估计 2025 年为 $106.15B，到 2030 年增至
              $254.98B，CAGR 为 19.2%；其他研究机构把 2026 年规模放在约 $118B 至 $126B，把 2034 年放在 $312B 至 $536B。这个视角被半导体和 hyperscaler
              支出主导，会高估 Fireworks 可触达市场。更窄一层是生成式 AI 模型支出，Gartner（Index Ventures 引用）预计从 2025 年 $14B 到 2028 年
              $39B，接近翻三倍，增长大多来自有利于 Fireworks 的专业化和微调模型。最相关的可服务视角，是独立开放权重推理服务细分市场；该市场已围绕约七家提供商整合。Together AI 年化收入接近
              $1B，Fireworks 在 $280M–800M 区间，Groq 估值 $6.9B，因此独立提供商收入池今天只有数十亿美元，但扩张很快。Fireworks 自身约 $280M
              以上收入，意味着它在该细分市场早期占个位数百分点份额。
