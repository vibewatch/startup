      - number: '2.3'
        title: 买家与细分版图
        blocks:
          - type: paragraph
            body: >-
              Fireworks 的需求横跨三个买家细分，采用路径不同。AI 原生初创公司（如 Cursor、Perplexity 和 Liner）自下而上采用：个体开发者从自助 API key
              和按量付费开始，经济买家是工程或平台负责人。数字原生企业（DoorDash、Notion、Shopify、Upwork、Quora）把功能从试点推向生产，再扩展到专用部署和微调，预算由产品工程组织掌握。传统和受监管企业（Samsung，以及越来越多的医疗和金融服务买家）通过议价合同自上而下采用，需要
              SSO、审计日志、数据驻留以及 HIPAA 或 SOC2 姿态，预算由平台和采购职能掌握。三类客户中，用户都是开发者，付款来自工程预算，主导触发因素是封闭模型 API
              在生产规模下的成本、延迟或控制限制。Fireworks 的 AWS Strategic Collaboration Agreement 和 Microsoft Foundry
              可用性，让它能在现有云采购渠道里触达这些买家，而不是以独立供应商身份另起评估流程。
            claimRefs:
              - CM013
              - CM014
