      - number: '4.2'
        title: 市场进入与销售效率
        blocks:
          - type: paragraph
            body: >-
              Fireworks 的 GTM 入口自下而上，扩张自上而下。开发者用自助 API key 和按量付费即可立即开始；支持来自 $1 免费额度，而非持续免费层，标准速率限制约为每分钟 600
              次请求。更大客户会升级为议价企业关系，获得更高速率限制、预留容量、客户管理、定制优化和私有部署。其上叠加现场与合作伙伴销售动作，由 AWS Strategic Collaboration Agreement
              锚定：该协议资助概念验证和初创加速项目，让 Fireworks 通过既有采购渠道接触企业买家，而不是要求客户做独立供应商评估。CAC、回本期和净收入留存等销售效率指标未披露；但
              先落地、再扩张的结构是主要效率杠杆，一个无服务器功能可增长为专用、微调、语音和预留容量支出。按 10,000 家以上公司粗算，混合年化每家公司收入估计接近 $28,000，但基数偏向少数大型生产部署。
