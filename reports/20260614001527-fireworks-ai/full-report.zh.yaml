      - number: '1.3'
        title: 融资与资本结构
        blocks:
          - type: paragraph
            body: >-
              Fireworks 已通过种子轮和三轮定价融资募得超过 $327M。2024 年 3 月，Benchmark 领投 $25M Series A，Sequoia Capital、Databricks
              Ventures 以及 Frank Slootman、Sheryl Sandberg、Howie Liu、Alexandr Wang 等天使参投。2024 年 7 月，Sequoia 领投 $52M Series
              B，估值 $552M，引入 NVIDIA、AMD 和 MongoDB Ventures，使累计资本达到 $77M。2025 年 10 月，公司宣布以 $4B 估值完成 $250M Series C，由
              Lightspeed Venture Partners、Index Ventures 和 Evantic 共同领投，Sequoia 继续支持；Sacra 称该轮约含 $230M 一级资本和 $20M
              二级交易。NVIDIA、AMD、MongoDB 和 Databricks 等战略参投方贯穿多轮融资，把股东名单与 Fireworks 所依赖的硬件和数据平台生态绑在一起。截至 2026 年 5 月，Sacra
              称公司正洽谈以 $15B 投后估值再次融资，Index 拟共同领投，但条款未确认。
