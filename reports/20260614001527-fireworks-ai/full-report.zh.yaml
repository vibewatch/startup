  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Fireworks 是一家高速扩张、资金充足的公司，主要风险来自商业和结构，而不是迫在眉睫的法律或运营失误。最高严重度风险包括推理商品化和毛利率压缩、可能拿走推理层的超大云厂商捆绑，以及对 NVIDIA
              硬件供给的依赖；NVIDIA 同时是供应商、投资方，并且通过收购 Lepton 和 NIM 打包成为竞争者。中等严重度风险包括计划把算力扩张 3–4 倍带来的资本强度、CEO Lin Qiao
              的关键人集中、压制留存的低切换成本，以及估值从 $552 million 冲到 $4 billion、传闻再到 $15 billion 的激进爬坡。较低但不可忽视的风险包括 EU AI Act 和 GDPR
              带来的监管成本、开放模型许可约束、无注册专利、未披露 burn 和 runway，以及对 AWS 和 Microsoft 分发渠道的依赖。缓释逻辑在各类风险中一致：在 serving
              层商品化前，更快向调优、agent、语音和企业治理上移，同时分散芯片来源，并接入既有采购渠道。剩余敞口仍然不小，因为多项缓释尚未被证明，若干关键指标也未披露。
