  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流与定价模型
        blocks:
          - type: paragraph
            body: >-
              Fireworks 采用按使用量计费的 B2B 模式，叠加在映射客户生命周期的多个产品表面上。无服务器推理按 token 计费，微调按训练 token 计费，强化微调按 GPU-hour 计费，按需专用部署按
              GPU-second 或 GPU-hour 计费；预留容量则按更长期承诺单独签约、议价定价。这让 Fireworks 几乎能在客户 AI
              工作流的每个阶段捕获收入，从实验到规模化生产。公开无服务器费率展示了模型：Llama 3.3 70B 每百万 tokens 约 $0.90，8B 模型 $0.20，DeepSeek V3
              $0.50；图像生成每张约 $0.013 至 $0.04，预留容量每 replica 每小时约 $4.80。收入结构未披露，但分析师预计收入会从商品化无服务器 token
              量，转向价值更高的专用部署、微调和企业合同；这将随时间改善毛利率和收入耐久性。
