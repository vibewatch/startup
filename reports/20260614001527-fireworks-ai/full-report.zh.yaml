  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基数分层
        blocks:
          - type: paragraph
            body: >-
              Fireworks 的客户基数横跨三大类，区别在于买家、用户、付款方和采用路径。AI 原生初创公司，包括 Cursor、Perplexity、Liner 和 Cresta，自下而上采用：个体开发者从自助 API
              key 开始，经济买家是工程或平台负责人。数字原生企业，如 DoorDash、Notion、Shopify、Upwork 和
              Quora，把功能从试点推入生产，并扩展到专用部署和微调，预算由产品工程组织掌握。Samsung 和 Uber
              代表的传统与更大型企业，以及医疗和金融服务中越来越多的受监管买家，通过需要合规和数据驻留控制的议价合同自上而下采用。三类客户中，用户是开发者，付款来自工程或采购预算，用例集中在代码辅助、对话式
              AI、企业搜索、智能体工作流和语音。地域上，客户基数偏北美和欧洲，但 API 全球可用；垂直覆盖软件、电商、市场平台、客服和法律科技。
