      - number: '5.2'
        title: 产品模块与资产版图
        blocks:
          - type: paragraph
            body: >-
              Fireworks 的产品表面可拆成几个模块。无服务器推理是入口产品：按 token 付费访问 50 多个活跃服务模型（目录中有数百个），包括 Llama 4 Scout 和 Maverick、DeepSeek
              V3、Qwen 3、Mixtral、Gemma 3 和 Phi-4，并通过 Flux、SDXL 和视觉模型生成图像。FireFunction 是自研函数调用模型族，用于工具使用和结构化输出。定制模块包括 LoRA
              微调、带量化感知训练的 Supervised Fine-Tuning V2，以及面向智能体任务的 Reinforcement Fine-Tuning，均通过 Build SDK 和 Experiment
              Platform 暴露。部署模块覆盖无服务器、按需专用和预留容量，并提供 multi-LoRA 托管，把许多微调 adapter 打包到一个基础部署上。更新的表面包括 Voice Agent
              Platform，它将转写、语言模型和工具调用共址，以实现低于 500ms 响应；以及 BYOB 安全训练，让企业从自己的 AWS S3 bucket
              训练。合在一起，这些模块让单个客户关系能从一个无服务器功能扩展为完整生产 AI 运行时。
