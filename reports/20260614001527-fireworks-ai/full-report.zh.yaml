            body: >-
              收入质量上，Fireworks 展现可信的超高速增长，按使用量计费的模型可覆盖客户生命周期支出；但缺少审计数据、收入结构和留存指标，限制了信心。毛利率上，约 50% 的毛利率是核心财务弱点：GPU
              成本使其结构性低于软件常态，通向公司所称 60% 目标的路径依赖利用率提升和结构转移，合理但尚未证实。资本强度上，三到四倍计算扩张加上缺少自有 GPU，使这个模式比典型 SaaS
