callouts:
  - calloutType: risk
    title: The enabling partners are the competitors
    body: >-
      NVIDIA, AWS and Microsoft each supply critical inputs or distribution while also competing to
      absorb inference, making supplier diversification and partnership depth the decisive risk
      variables.
    claimRefs: [CR019, CR021, CR022]
  - calloutType: recommendation
    title: Watch gross margin as the master signal
    body: >-
      Gross-margin trajectory toward 60% is the single best monitoring indicator; failure to move off
      ~50% would confirm commoditization and break the premium-software thesis.
    claimRefs: [CR025, CR031, CR034]
