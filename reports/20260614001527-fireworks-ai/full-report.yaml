  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Fireworks is a fast-scaling, well-funded business whose principal risks are commercial and structural
              rather than acute legal or operational failures. The highest-severity risks are inference commoditization
              and gross-margin compression, hyperscaler bundling that could capture the inference layer, and
              hardware-supply dependence on NVIDIA, which is simultaneously a supplier, an investor and, via its Lepton
              acquisition and NIM packaging, a competitor. Medium-severity risks include capital intensity from a
              planned three-to-four-fold compute expansion, key-person concentration in CEO Lin Qiao, low switching
              costs that cap retention, and an aggressive valuation ramp from $552 million to $4 billion and a rumored
              $15 billion. Lower but non-trivial risks include regulatory overhead from the EU AI Act and GDPR,
              open-model licensing constraints, the absence of registered patents, undisclosed burn and runway, and
              reliance on AWS and Microsoft distribution channels. The mitigation thesis is consistent across
              categories: move up the stack into tuning, agents, voice and enterprise governance faster than the serving
              layer commoditizes, while diversifying silicon and plugging into incumbent procurement channels. Residual
              exposure remains meaningful because several mitigations are unproven and several key metrics are
              undisclosed.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
