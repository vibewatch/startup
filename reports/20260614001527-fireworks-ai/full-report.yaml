      - number: '1.2'
        title: Founders and Leadership
        blocks:
          - type: paragraph
            body: >-
              Fireworks AI was co-founded by chief executive Lin Qiao alongside six colleagues, the majority of whom
              worked together on PyTorch at Meta. Qiao previously served as Senior Director of Engineering and Head of
              PyTorch at Meta, where she led an organization of more than 300 engineers, and earlier held roles at
              LinkedIn, IBM and other large systems companies; she holds a Ph.D. in Computer Science from UC Santa
              Barbara. Co-founders include Dmytro Dzhulgakov, a former core PyTorch maintainer who joined Facebook in
              2011, and Dmytro Ivchenko, a Kyiv Polytechnic graduate who worked on PyTorch ranking at Meta, both
              originally from Ukraine. The remaining founders, James Reed, Benny Chen, Chenyu Zhao and Pawel Garbacki,
              bring experience from Meta's PyTorch compiler, ads infrastructure and core ML teams as well as Google
              Vertex AI. The founding team's deep inference-systems pedigree is repeatedly cited by investors as the
              company's core advantage and is also a key-person dependency concentrated in Qiao.
