      - number: '5.3'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Fireworks runs a proprietary, multi-layer inference stack on commodity NVIDIA GPUs. At the kernel layer,
              FireAttention is a custom CUDA attention implementation that Fireworks reports as substantially faster
              than vLLM and TensorRT-LLM, extended across versions to support long context and architectures like Llama
              4's chunked local attention. Above it, FireOptimizer performs adaptive speculative execution,
              personalizing speculative decoding, draft-model selection and caching to each workload, with reported
              latency reductions up to roughly 3x in production and native FP4 support on NVIDIA Blackwell B200
              hardware. The serving topology combines a stateless request router, draft and target GPU pods for
              speculative decoding, a distributed KV cache, continuous batching and disaggregated serving, scaling to
              documented tests around 50,000 requests per minute. Multi-LoRA consolidates many fine-tuned variants onto
              a single base model. The operating model is open-model neutral: Fireworks bets on running whichever open
              model is winning at a given moment rather than on any single model, which makes day-zero support for new
              releases a core engineering discipline.
