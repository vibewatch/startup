      - number: '3.4'
        title: Switching Costs, Lock-in and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Switching costs in inference are structurally low. Most providers, including Fireworks, Together, Groq and
              Baseten, expose OpenAI-compatible APIs, so migration between them can take minutes, and routing
              aggregators such as OpenRouter and TokenMix actively encourage multi-homing and automatic failover across
              providers. This caps durable lock-in for everyone and means share is defended by performance, tuning and
              enterprise integration rather than contracts. Distribution power is increasingly decisive: hyperscalers
              and NVIDIA control the GPU supply, security posture and procurement relationships that independents depend
              on. Fireworks' counter is to plug into those channels through its AWS Strategic Collaboration Agreement
              and Microsoft Foundry availability, while moving up the stack into fine-tuning, reinforcement learning,
              voice and enterprise governance to create stickier, higher-value relationships. Baseten's VPC and
              self-hosted footprint and Together's owned data-center and GPU-cluster strategy are alternative answers to
              the same distribution and supply problem.
            claimRefs:
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
      - number: '3.5'
        title: Moat Durability and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Fireworks' moat is real but narrow. Its proprietary FireAttention and FireOptimizer stack converts
              inference-systems engineering into a performance-and-price advantage, and its reliability and
              function-calling lead are genuine. But the moat faces clear erosion vectors. Open-source serving
              frameworks like vLLM and SGLang keep closing the performance gap, and Baseten openly builds on them;
              NVIDIA pushes NIM as a packaging layer; Snowflake released Arctic Inference as an open vLLM plugin.
              Better-capitalized rivals raise the stakes: Groq at $6.9 billion, Baseten at $5 billion and Together near
              a rumored $7.5 billion all have more balance-sheet room for GPU commitments and enterprise go-to-market.
              Hardware concentration is an adverse signal too, since Fireworks does not own GPUs while NVIDIA, a
              supplier and investor, now competes directly. The durable question is whether Fireworks can keep extending
              its stack into tuning, agents and governance faster than the ecosystem commoditizes the serving layer.
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
          - type: table
            tableRef: TP004
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
