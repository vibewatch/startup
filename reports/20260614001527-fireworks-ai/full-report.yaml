chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Fireworks AI is an American artificial-intelligence infrastructure company headquartered in Redwood City,
              California, founded in late 2022 by a team that left Meta's PyTorch organization. The company operates
              what it calls an "AI Cloud" for enterprise developer teams: a managed inference platform that runs,
              fine-tunes, and scales open-source large language, vision, audio, and multimodal models with low-latency
              serving. Its core thesis is "one-size-fits-one" inference, the belief that the highest-value AI is built
              on smaller, customizable open models tuned on enterprise-specific data rather than a handful of generic
              closed foundation models. Monetization is usage-based across the customer lifecycle: serverless inference
              billed per token, fine-tuning billed per training token, reinforcement fine-tuning billed per GPU-hour,
              and on-demand or reserved dedicated deployments billed per GPU-second or GPU-hour. The platform offers
              hundreds of models plus an OpenAI-compatible API, function calling, and enterprise security controls,
              positioning Fireworks between commodity GPU rental and closed-model APIs.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO031
