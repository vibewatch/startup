      - number: '7.5'
        title: Financial, Model and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Financially, the central risk is margin compression. Gross margin near 50% is structurally below software
              norms because GPU costs sit in cost of goods sold, and a razor-thin price gap versus Together plus
              improving open-source serving frameworks create persistent downward pressure; the stated path to 60%
              depends on unproven utilization gains and a revenue-mix shift. Capital intensity compounds this: the
              three-to-four-fold compute expansion requires recurring capacity spend, and burn, runway and net revenue
              retention are undisclosed, so capital adequacy is asserted rather than verified. The valuation ramp from
              $552 million to $4 billion within roughly fifteen months, with talk of $15 billion, embeds aggressive
              growth expectations that a slowdown or margin disappointment would punish. On execution and people, the
              founding team's PyTorch pedigree is a strength but concentrates key-person risk in CEO Lin Qiao, and
              retaining elite inference engineers in a hot market is a continuing challenge. The mitigation logic across
              all of these is the same up-the-stack diversification, but its success is the core open question of the
              investment.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
          - type: table
            tableRef: TR004
            claimRefs:
              - CR029
              - CR030
              - CR033
      - number: '7.6'
        title: Mitigations, Monitoring and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Fireworks' mitigations are coherent: extend the stack into fine-tuning, reinforcement learning, voice and
              enterprise governance to escape commodity serving; diversify silicon across NVIDIA and AMD and pursue
              Blackwell efficiency; maintain day-zero open-model support so model turnover is a tailwind; harden
              enterprise compliance to win regulated verticals; and plug into AWS and Azure procurement rather than
              fighting them. The monitoring indicators that matter are gross-margin trajectory toward 60%, the revenue
              mix shifting to dedicated and enterprise, net revenue retention once disclosed, GPU-cost and allocation
              terms, and the competitive gap versus vLLM and SGLang. The clearest thesis-break triggers are gross margin
              failing to rise off ~50% or compressing further, a hyperscaler or NVIDIA capturing the inference layer and
              relegating Fireworks to an optimization add-on, a key-person departure, or growth stalling below the pace
              implied by the $4 billion-plus valuation. The priority diligence asks are a reconciled revenue and margin
              figure, NRR and burn, GPU-supply contracts, and top-customer concentration. The overall residual exposure
              is moderate-to-high, concentrated in commoditization and dependency risk rather than legal or operational
              failure.
            claimRefs:
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
