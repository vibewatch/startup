              - CM024
      - number: '2.5'
        title: Sizing Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Several gaps limit confidence in market sizing. Published "AI inference" totals vary widely and bundle
              incompatible categories (chips, hyperscaler services and independent software), so the top-down TAM cannot
              be cleanly mapped to Fireworks' reachable revenue. The independent inference-provider revenue pool is not
              measured by any standard analyst; it must be assembled from individual company estimates of uneven vintage
              and reliability. Forecast CAGRs range from roughly 13% to 19% across houses, and 2034 estimates differ by
              more than $200 billion. Within this, Fireworks' own revenue figures are themselves contested across
              sources. These gaps mean the market is clearly large and growing fast, but the serviceable and obtainable
              shares relevant to valuation remain estimates rather than measured facts, and any sizing should be treated
              as directional. We preserve the failed precision rather than assert a single SAM.
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The reachable market is far smaller than the headline TAM
            body: >-
              Headline AI inference TAM figures are dominated by silicon and hyperscaler spend. Fireworks' true
              serviceable market is the independent open-weight inference niche, a few billion dollars today, which
              makes share capture against hyperscalers the central question.
            calloutType: insight
            claimRefs:
              - CM006
              - CM009
              - CM019
          - type: callout
            title: Low switching costs cut both ways
            body: >-
              The OpenAI-compatible API that makes it trivial to adopt Fireworks also makes it trivial to leave, so
              durable share depends on performance and tuning lock-in rather than contractual stickiness.
            calloutType: risk
            claimRefs:
              - CM021
