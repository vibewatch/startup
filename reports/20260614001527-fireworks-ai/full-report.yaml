      - number: '5.5'
        title: Differentiation, IP and Data
        blocks:
          - type: paragraph
            body: >-
              Fireworks' differentiation is engineering-led. Its core intellectual property is the proprietary inference
              engine, especially FireAttention's custom kernels and FireOptimizer's adaptive optimization, which convert
              systems expertise from the founders' PyTorch background into measurable speed and cost advantages; no
              public patents are listed, so the moat is know-how rather than registered IP. A second source of
              differentiation is product-model co-design: a data feedback loop in which customer interactions
              continuously improve fine-tuned models, which Fireworks frames as how enterprises build a competitive moat
              with AI. A third is breadth and freshness: day-zero support across hundreds of open models and modalities,
              so the platform benefits from model turnover rather than being threatened by it. The principal
              vulnerability is that the optimization advantage sits atop open-source frameworks like vLLM and SGLang
              that keep improving, so the differentiation must be continuously re-earned. Supply access to leading-edge
              NVIDIA and AMD GPUs is a further enabling, but not exclusive, advantage.
