        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              Fireworks' customer base spans three broad segments distinguished by buyer, user, payer and adoption path.
              AI-native startups, including Cursor, Perplexity, Liner and Cresta, adopt bottoms-up: individual
              developers start with self-serve API keys, and the economic buyer is an engineering or platform lead.
              Digital-native enterprises, such as DoorDash, Notion, Shopify, Upwork and Quora, move features from pilot
              into production and expand into dedicated deployments and fine-tuning, with budget owned by
              product-engineering organizations. Traditional and larger enterprises, exemplified by Samsung and Uber,
              and increasingly regulated buyers in healthcare and financial services, adopt top-down through negotiated
              contracts requiring compliance and data-residency controls. Across all three, the user is a developer, the
              payer is an engineering or procurement budget, and use cases cluster around code assistance,
              conversational AI, enterprise search, agentic workflows and voice. Geographically the base skews North
              American and European with global API access, and verticals span software, e-commerce, marketplaces,
              customer service and legal tech.
