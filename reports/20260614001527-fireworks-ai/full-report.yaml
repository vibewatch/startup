      - number: '1.3'
        title: Funding and Capitalization
        blocks:
          - type: paragraph
            body: >-
              Fireworks has raised more than $327 million across a seed round and three priced rounds. A $25 million
              Series A led by Benchmark closed in March 2024, with Sequoia Capital, Databricks Ventures and angels
              including Frank Slootman, Sheryl Sandberg, Howie Liu and Alexandr Wang. A $52 million Series B led by
              Sequoia followed in July 2024 at a $552 million valuation, adding NVIDIA, AMD and MongoDB Ventures and
              bringing cumulative capital to $77 million. In October 2025 the company announced a $250 million Series C
              at a $4 billion valuation, co-led by Lightspeed Venture Partners, Index Ventures and Evantic with
              continued support from Sequoia; Sacra reports the round comprised roughly $230 million of primary capital
              plus a $20 million secondary. Strategic participants across rounds include NVIDIA, AMD, MongoDB and
              Databricks, tying the cap table to the hardware and data-platform ecosystems Fireworks depends on. As of
              May 2026 Sacra reports the company is in talks to raise again at a $15 billion post-money valuation, with
              Index set to co-lead, though terms are unconfirmed.
