      - number: '3.2'
        title: Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Together AI is Fireworks' closest direct competitor: founded in 2021 by Percy Liang, Chris Ré and Vipul
              Ved Prakash, it raised a $305 million Series B in February 2025 at a $3.3 billion valuation, reportedly
              reached about $1 billion annualized revenue by early 2026, and spans serverless inference, dedicated
              clusters, fine-tuning, voice and reinforcement learning. Baseten positions as an enterprise
              inference-engineering platform with self-hosted and hybrid VPC deployment; it raised a $300 million round
              in January 2026 at a $5 billion valuation, led by IVP and CapitalG with a reported $150 million from
              NVIDIA, lifting total funding to roughly $585 million. Groq competes from custom LPU silicon, raising $750
              million in September 2025 at a $6.9 billion valuation and advertising 750-plus tokens per second on Llama
              models, with a Meta partnership powering the official Llama API. Cerebras and SambaNova extend the
              hardware-led attack at the premium latency end, while Replicate, Modal and Anyscale compete for developer
              mindshare. Against these, Fireworks holds a $4 billion valuation and $280 million-plus revenue with
              category-leading reliability and function calling.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP007
