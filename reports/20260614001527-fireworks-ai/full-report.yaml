      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Fireworks' regulatory and legal exposure is real but currently manageable. The most material regime is the
              EU AI Act, which imposes tiered, risk-based obligations including transparency and documentation duties on
              general-purpose and foundation-model providers and their deployers; Fireworks' role as an inference and
              fine-tuning platform places it in the compliance chain for EU customers. GDPR and data-residency
              requirements drive the company's zero-data-retention, data-residency and regional-deployment features, and
              any lapse carries fines and reputational cost. Open-model licensing is a subtler legal risk: models such
              as Llama carry acceptable-use and license terms, and unresolved industry questions about training-data
              copyright could flow through to platforms that serve those models. Intellectual-property exposure runs the
              other way too: Fireworks lists no public patents, so its FireAttention and FireOptimizer advantages rest
              on trade secrets and know-how that are harder to defend if key engineers leave. No material litigation or
              enforcement action against Fireworks is publicly known, and its Series C was executed with top-tier legal
              counsel, but the regulatory surface will expand as the company sells into healthcare, financial services
              and government-adjacent verticals.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Operational, Quality and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Fireworks' defining exposure is GPU supply. The company does not own its fleet and sources
              NVIDIA and AMD capacity from third parties, leaving it exposed to allocation constraints, supply
              bottlenecks and hardware-transition timing as it scales compute three-to-four-fold. Reliability is a
              strength on observed data, with independently monitored Q1 2026 uptime of 99.8%, but Fireworks does not
              publish a formal standard-tier SLA, so contractual reliability commitments are negotiated case by case and
              incident history is opaque. Running a global multi-region fleet across Frankfurt, Iceland, Tokyo and US,
              EU and APAC regions adds operational complexity and cost. Security and compliance posture is comparatively
              strong, with SOC2 Type II and HIPAA on AWS-based inference, zero data retention, airgapped EKS and
              bring-your-own-bucket training, and no public breach is known; nonetheless, a single serious outage or
              data incident would be especially damaging given the production, latency-sensitive nature of customer
              workloads. Reviewers also flag thin documentation and potential support strain as the company scales,
              which are quality risks rather than safety risks.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
      - number: '7.4'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Fireworks sits inside a dense web of dependencies. The most acute is NVIDIA, which supplies the
              leading-edge GPUs Fireworks' performance and margin claims rely on, holds an investment stake, and now
              competes directly through its Lepton acquisition, a GPU-cloud marketplace and NIM packaging. AWS and
              Microsoft are both partners and threats: their Strategic Collaboration Agreement and Foundry availability
              provide distribution, but Bedrock, Vertex and Azure can bundle inference into existing security, billing
              and governance relationships and absorb the category. Fireworks also depends on the continued release and
              permissive licensing of open models from Meta, DeepSeek, Alibaba and others; a slowdown in open-model
              quality or a shift to restrictive licenses would undercut its open-model-neutral thesis. Cloud-platform
              dependence, capital-provider concentration among a handful of late-stage funds, and key-customer
              concentration among sophisticated buyers capable of multi-homing round out the dependency map. The common
              thread is that Fireworks' enabling partners are also its most credible competitors, so partnership depth
              and supplier diversification are central to the risk picture.
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
