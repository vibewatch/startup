      - number: '5.2'
        title: Product Module and Asset Map
        blocks:
          - type: paragraph
            body: >-
              Fireworks' product surface decomposes into several modules. Serverless inference is the entry product:
              pay-per-token access to 50-plus actively served models (hundreds across the catalog), including Llama 4
              Scout and Maverick, DeepSeek V3, Qwen 3, Mixtral, Gemma 3 and Phi-4, with image generation via Flux and
              SDXL and vision models. FireFunction is the proprietary function-calling model family for tool use and
              structured output. The customization modules include LoRA fine-tuning, Supervised Fine-Tuning V2 with
              quantization-aware training, and Reinforcement Fine-Tuning for agentic tasks, all exposed through a Build
              SDK and an Experiment Platform. The deployment modules span serverless, on-demand dedicated and reserved
              capacity, plus multi-LoRA hosting that packs many fine-tuned adapters onto one base deployment. Newer
              surfaces include the Voice Agent Platform, which co-locates transcription, language models and tool
              calling for sub-500ms response, and BYOB secure training that lets enterprises train from their own AWS S3
              buckets. Together these modules let a single customer relationship expand from one serverless feature into
              a full production AI runtime.
