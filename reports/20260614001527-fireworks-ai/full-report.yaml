  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Fireworks operates in the managed AI inference market: the serving, fine-tuning and dedicated deployment
              of open-weight large language, vision, audio and multimodal models for production applications. The
              relevant included spend is what enterprises pay third parties to run models in production rather than what
              they spend training foundation models or renting bare GPUs. Excluded from the core boundary are
              foundation-model training compute consumed by frontier labs, raw GPU infrastructure-as-a-service from
              providers such as CoreWeave and Lambda, and closed-model APIs from OpenAI and Anthropic, although closed
              APIs are the most important status-quo substitute. Adjacent budget pools that Fireworks is expanding into
              include voice agents, retrieval-augmented generation with vector databases, and reinforcement-learning
              training for agents. The most direct substitutes for Fireworks are self-hosting open models on vLLM or
              SGLang, hyperscaler bundles like AWS Bedrock and Azure Foundry, and continued reliance on closed APIs.
              Defining this boundary first is essential because headline "AI inference" market figures conflate
              hardware, hyperscaler and independent-provider spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
