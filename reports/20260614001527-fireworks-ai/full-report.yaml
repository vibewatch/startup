      - number: '4.3'
        title: Cost Structure and Gross Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              Fireworks is not a pure software business: GPU procurement, capacity planning and regional infrastructure
              are real cost inputs embedded in cost of goods sold, which is why Sacra estimates gross margin near 50%,
              well below the 70%-plus typical of subscription software. Management has told investors it targets 60%
              through better GPU utilization, hardware efficiency gains on newer architectures such as NVIDIA Blackwell,
              and a revenue-mix shift toward dedicated and enterprise workloads. The core economic logic is that
              proprietary inference optimization, FireAttention and FireOptimizer, translates engineering into pricing
              power: if Fireworks serves a model faster and at higher throughput than a customer could self-host, it can
              charge a premium while undercutting the alternative's total cost. Multi-LoRA improves utilization by
              consolidating many fine-tuned variants onto a single base-model deployment, lowering compute cost per
              variant. The cost environment is shaped by NVIDIA and AMD data-center GPU economics, both of which report
              rapidly growing AI accelerator revenue, underscoring that Fireworks' input costs sit inside a
