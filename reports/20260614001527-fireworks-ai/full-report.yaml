      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Several drivers expand Fireworks' market. Open-source model quality is converging on closed counterparts,
              agentic and compound AI systems multiply inference calls per task, fine-tuning on proprietary data is
              becoming a competitive necessity, and enterprises increasingly want to own their AI rather than depend on
              a few closed labs. Cost pressure also helps: open-weight inference can run materially cheaper than closed
              APIs at scale. Working against these are powerful constraints. Inference is commoditizing as vLLM and
              SGLang improve, compressing the proprietary advantage of optimized stacks and triggering a price race in
              which Fireworks' Llama 70B price sits within roughly 2% of Together's. Hyperscaler bundling lets AWS,
              Azure and Google fold inference into existing security, billing and governance relationships. GPU supply
              is concentrated and Fireworks does not own its fleet. Regulation such as the EU AI Act adds compliance
              overhead, and the OpenAI-compatible API that lowers switching-in cost also lowers switching-out cost,
              capping durable lock-in.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
          - type: table
            tableRef: TM004
            claimRefs:
