      - number: '5.6'
        title: Trust, Safety, Security and Compliance
        blocks:
          - type: paragraph
            body: >-
              Fireworks' enterprise posture is built for regulated buyers. The platform offers zero data retention by
              default, single sign-on, audit logs, and data-residency controls, and its AWS-based inference solution is
              HIPAA and SOC2 Type II compliant. For the most sensitive workloads it supports airgapped EKS deployments
              and bring-your-own-bucket secure training that keeps training data in the customer's own AWS S3.
              Structured output controls such as JSON mode and grammar-constrained decoding improve reliability and
              reduce malformed responses in agentic workflows, and FireFunction's high schema-compliance rate supports
              dependable tool use. These capabilities open regulated verticals including healthcare, financial services
              and government-adjacent workloads that were previously inaccessible to a standalone inference vendor.
              Quality is reinforced by continuous evaluation and reinforcement learning in the product-model co-design
              loop. Gaps remain: Fireworks does not publish a formal standard-tier SLA, enterprise SLAs are negotiated
              case by case, and independent reviewers note thin documentation in places, which are diligence items for
              security-sensitive buyers.
