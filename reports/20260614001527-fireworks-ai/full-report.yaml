      - number: '2.3'
        title: Buyer and Segment Map
        blocks:
          - type: paragraph
            body: >-
              Demand for Fireworks spans three buyer segments with different adoption paths. AI-native startups (for
              example Cursor, Perplexity and Liner) adopt bottoms-up: individual developers start with self-serve API
              keys and pay-as-you-go billing, and the economic buyer is an engineering or platform lead. Digital-native
              enterprises (DoorDash, Notion, Shopify, Upwork, Quora) move features from pilot to production and expand
              into dedicated deployments and fine-tuning, with budget owned by product-engineering organizations.
              Traditional and regulated enterprises (Samsung and, increasingly, healthcare and financial-services
              buyers) adopt top-down through negotiated contracts, requiring SSO, audit logs, data residency and HIPAA
              or SOC2 posture, with budgets owned by platform and procurement functions. Across all three, the user is a
              developer, the payer is an engineering budget, and the dominant adoption trigger is the cost, latency or
              control limitations of closed-model APIs at production scale. Fireworks' AWS Strategic Collaboration
              Agreement and Microsoft Foundry availability let it reach these buyers inside existing cloud procurement
              channels rather than as a standalone vendor.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
