  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Model
        blocks:
          - type: paragraph
            body: >-
              Fireworks operates a usage-based B2B model layered across several product surfaces that map to the
              customer lifecycle. Serverless inference is billed per token, fine-tuning is billed per training token,
              reinforcement fine-tuning is billed per GPU-hour, and on-demand dedicated deployments are billed per
              GPU-second or GPU-hour, while reserved capacity is contracted separately on longer commitments at
              negotiated pricing. This lets Fireworks capture revenue at nearly every stage of a customer's AI workflow,
              from experimentation through scaled production. Published serverless rates illustrate the model: roughly
              $0.90 per million tokens for Llama 3.3 70B, $0.20 for the 8B model and $0.50 for DeepSeek V3, with image
              generation from about $0.013 to $0.04 per image and reserved capacity near $4.80 per hour per replica.
              Revenue mix is not disclosed, but analysts expect a shift toward higher-value dedicated deployments,
              fine-tuning and enterprise contracts rather than commodity serverless token volume, which would improve
              both margin and revenue durability over time.
