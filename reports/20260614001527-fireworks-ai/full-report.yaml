      - number: '1.5'
        title: Milestones and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The company chronology runs from leaving PyTorch in 2022 through three financings, a string of platform
              launches (FireAttention, FireFunction V2, FireOptimizer, supervised and reinforcement fine-tuning), a Dev
              Day in 2025, a March 2026 launch on Microsoft Foundry, and the acquisition of Hathora to deepen real-time
              compute orchestration. Alongside the growth story sit genuine adverse signals that later chapters examine
              in depth. Independent reviewers note that Fireworks is "just the engine," requiring meaningful developer
              sophistication, and flag thin documentation and the absence of an ongoing free tier. Analysts highlight
              three structural risks: inference commoditization as open-source serving frameworks such as vLLM and
              SGLang improve, hyperscaler bundling by AWS Bedrock, Azure and Vertex, and hardware concentration given
              Fireworks does not own its GPU fleet while NVIDIA has entered inference directly through its Lepton
              acquisition. These pressures sit against an unusually strong founding team and fast revenue ramp.
