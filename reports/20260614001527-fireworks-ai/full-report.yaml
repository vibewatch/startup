      - number: '2.2'
        title: Market Sizing Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              No single number captures Fireworks' opportunity, so we triangulate three lenses. The broadest top-down
              lens, the global AI inference market, is estimated by MarketsandMarkets at $106.15 billion in 2025 growing
              to $254.98 billion by 2030, a 19.2% CAGR; other research houses place 2026 between roughly $118 billion
              and $126 billion and 2034 between $312 billion and $536 billion. This lens, however, is dominated by
              semiconductor and hyperscaler spend and overstates Fireworks' reachable market. A narrower lens is
              generative-AI model spend, which Gartner (cited by Index Ventures) projects will nearly triple from $14
              billion in 2025 to $39 billion by 2028, with much of the growth in specialized and fine-tuned models that
              favor Fireworks. The most relevant serviceable lens is the independent open-weight inference-serving
              niche, which has consolidated around roughly seven providers; with Together AI near $1 billion annualized
              revenue, Fireworks in the $280-800 million range and Groq valued at $6.9 billion, the independent-provider
              revenue pool is a few billion dollars today but expanding quickly. Fireworks' own ~$280 million-plus
              revenue represents an early single-digit share of that niche.
