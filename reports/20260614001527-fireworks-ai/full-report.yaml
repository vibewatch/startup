      - number: '4.2'
        title: Go-to-Market and Sales Efficiency
        blocks:
          - type: paragraph
            body: >-
              Fireworks' go-to-market is bottoms-up at entry and top-down at expansion. Developers start immediately
              with self-serve API keys and pay-as-you-go billing, supported by $1 of free credits rather than an ongoing
              free tier, and a standard rate limit near 600 requests per minute. Larger customers graduate into
              negotiated enterprise relationships with higher rate limits, reserved capacity, account management, custom
              optimization and private deployment. Layered on top is a field and partner sales motion, anchored by an
              AWS Strategic Collaboration Agreement that funds proofs-of-concept and a startup acceleration program,
              giving Fireworks access to enterprise buyers through existing procurement channels rather than requiring a
              standalone vendor evaluation. Sales-efficiency metrics such as CAC, payback and net revenue retention are
              not disclosed, but the land-and-expand structure, in which a single serverless feature can grow into
              dedicated, fine-tuning, voice and reserved-capacity spend, is the principal efficiency lever, with blended
              annualized revenue per company estimated near $28,000 across a base skewed toward a smaller number of
              large production deployments.
