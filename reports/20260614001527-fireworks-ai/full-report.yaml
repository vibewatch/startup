  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              In customer terms, Fireworks is the layer that takes an open-source model and makes it run in production
              fast, cheaply and reliably without the customer managing GPUs. A developer signs up, points an
              OpenAI-compatible API at a model such as Llama 4, DeepSeek or Qwen, and gets low-latency inference with
              function calling, JSON-mode structured output and streaming. As usage grows, the same customer can
              fine-tune a model on proprietary data, move to dedicated or reserved GPU capacity for guaranteed
              throughput, add retrieval and embeddings for RAG, and deploy voice agents. The platform spans text, image
              (Flux, SDXL), audio and multimodal formats across hundreds of models with day-zero support for major new
              releases. The core job it does for customers is to collapse the gap between a model that works in a
              notebook and one that serves millions of users in production, which Fireworks positions as the difference
              between experimentation and shipping. This is why its customers describe it as an inference engine rather
              than an application: it supplies speed, cost and control, while the customer builds the product.
