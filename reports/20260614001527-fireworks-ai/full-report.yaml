              Reported revenue figures vary by source and vintage and should be treated with care: the company stated
              annualized revenue had surpassed $280 million at the October 2025 Series C, while Sacra estimates roughly
              $305 million at year-end 2025 rising to about $800 million annualized by May 2026, and earlier 2025
              coverage cited $130 million ARR with claims of profitability and 20x year-over-year growth. Gross margin
              is estimated near 50 percent, below the 70 percent-plus typical of software, because GPU costs sit in cost
