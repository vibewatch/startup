        blocks:
          - type: paragraph
            body: >-
              Fireworks reports rapid commercial scaling. At the Series C the company said it powers over 10,000
              companies, a roughly tenfold increase from the Series B, serves hundreds of thousands of developers, and
              processes more than 10 trillion tokens per day; third-party profiles cite 15 trillion tokens per day by
