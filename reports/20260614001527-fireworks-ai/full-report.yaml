      - number: '5.4'
        title: Deployment, Reliability, Integration and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Fireworks supports serverless, on-demand dedicated and reserved deployments across a global multi-region
              fleet with documented locations including Frankfurt, Iceland and Tokyo plus US, Europe and APAC regions,
              enabling latency and data-residency requirements. Integration is eased by an OpenAI-compatible API plus
              SDKs and connectors for frameworks such as LangChain and LlamaIndex, so migration from closed APIs can
              take minutes. Reliability is a headline claim: independent monitoring placed Q1 2026 uptime at 99.8%, the
              highest among specialized providers, with strong stability under load. Documented production results
              include Cursor reaching about 1,000 tokens per second for code generation, Notion cutting AI response
              latency from roughly 2 seconds to 350 milliseconds, and Sourcegraph seeing a 30% latency reduction and a
              2.5x increase in completion acceptance. The roadmap, funded by the Series C, targets deeper research in
              tuning and inference alignment, an end-to-end model-lifecycle toolchain, and a three-to-four-fold
              expansion of global compute, alongside the Hathora acquisition to deepen real-time orchestration.
