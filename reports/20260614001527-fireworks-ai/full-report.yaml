      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: The enabling partners are the competitors
            body: >-
              NVIDIA, AWS and Microsoft each supply critical inputs or distribution while also competing to absorb
              inference, making supplier diversification and partnership depth the decisive risk variables.
            calloutType: risk
            claimRefs:
              - CR019
