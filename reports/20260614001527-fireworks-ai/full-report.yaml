  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              The inference market has segmented into four distinct competitive layers, and Fireworks faces pressure
              from each. Managed open-model platforms, principally Together AI, Baseten and Replicate, are the closest
              direct peers, competing on model breadth, developer experience and per-token price. Vertically integrated
              silicon players, Groq, Cerebras and SambaNova, attack latency and cost from custom hardware rather than
              software optimization on commodity GPUs. Hyperscaler bundles, AWS Bedrock, Google Vertex AI, Microsoft
              Azure Foundry and Databricks Model Serving, are the most structurally threatening because they collapse
              model access, infrastructure, governance and contracting into one platform. Finally, open-source serving
              frameworks such as vLLM and SGLang, plus packaging layers like NVIDIA NIM and routers like OpenRouter,
              commoditize the proprietary advantage embedded in Fireworks' own stack. Status-quo alternatives include
              continued use of closed APIs and internal self-hosting. The most likely new entrant pressure comes from
              NVIDIA itself, which entered inference directly via its Lepton acquisition and a competing GPU-cloud
              marketplace, turning a key supplier into a rival.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
