              - CP009
              - CP010
              - CP011
              - CP014
      - number: '3.3'
        title: Capability, Pricing and GTM Comparisons
        blocks:
          - type: paragraph
            body: >-
              On capability, Fireworks differentiates through reliability and structured output: independent monitoring
              put its Q1 2026 uptime at 99.8%, the highest among specialized providers, and its FireFunction models hit
              roughly 92% multi-tool function-calling accuracy, ahead of Together and Groq and within a few points of
              GPT-4o. On price, the field is razor-thin: Llama 3.3 70B runs about $0.90 per million tokens on Fireworks
              versus $0.88 on Together and $0.59 on Groq, and the same model spreads roughly sixfold across the
              seven-provider field. On raw speed Groq's LPU dominates at 400-750 tokens per second versus Fireworks'
              ~145, but Fireworks wins latency consistency and stability under load. On go-to-market, Together and
              Baseten match Fireworks' bottoms-up developer motion, but hyperscalers win distribution through existing
              procurement, security and billing relationships. On trust and regulation, Fireworks, Together and Baseten
              all offer SOC2/HIPAA postures and VPC or data-residency options, with Baseten leaning hardest into
              self-hosted compliance-heavy deployments.
            claimRefs:
              - CP014
              - CP015
              - CP016
              - CP017
              - CP018
              - CP019
