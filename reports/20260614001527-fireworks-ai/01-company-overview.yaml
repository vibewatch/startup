slug: fireworks-ai
runDate: "2026-06-14"
company:
  name: Fireworks AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Fireworks AI is a Redwood City inference-cloud startup founded in 2022 by ex-Meta PyTorch
    leaders. It raised a $250M Series C in October 2025 at a $4B valuation, reports >$280M
    annualized revenue, serves 10,000+ companies, and processes 10+ trillion tokens per day,
    though gross margins near 50% and inference commoditization temper the picture.
sections:
  - id: identity-business-model
    title: Identity and Business Model
    body: >-
      Fireworks AI is an American artificial-intelligence infrastructure company headquartered in
      Redwood City, California, founded in late 2022 by a team that left Meta's PyTorch
      organization. The company operates what it calls an "AI Cloud" for enterprise developer
      teams: a managed inference platform that runs, fine-tunes, and scales open-source large
      language, vision, audio, and multimodal models with low-latency serving. Its core thesis is
      "one-size-fits-one" inference, the belief that the highest-value AI is built on smaller,
      customizable open models tuned on enterprise-specific data rather than a handful of generic
      closed foundation models. Monetization is usage-based across the customer lifecycle:
      serverless inference billed per token, fine-tuning billed per training token, reinforcement
      fine-tuning billed per GPU-hour, and on-demand or reserved dedicated deployments billed per
      GPU-second or GPU-hour. The platform offers hundreds of models plus an OpenAI-compatible API,
      function calling, and enterprise security controls, positioning Fireworks between commodity
      GPU rental and closed-model APIs.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO031]
    figureRefs: [FO002]
  - id: founders-leadership
    title: Founders and Leadership
    body: >-
      Fireworks AI was co-founded by chief executive Lin Qiao alongside six colleagues, the
      majority of whom worked together on PyTorch at Meta. Qiao previously served as Senior
      Director of Engineering and Head of PyTorch at Meta, where she led an organization of more
      than 300 engineers, and earlier held roles at LinkedIn, IBM and other large systems
      companies; she holds a Ph.D. in Computer Science from UC Santa Barbara. Co-founders include
      Dmytro Dzhulgakov, a former core PyTorch maintainer who joined Facebook in 2011, and Dmytro
      Ivchenko, a Kyiv Polytechnic graduate who worked on PyTorch ranking at Meta, both originally
      from Ukraine. The remaining founders, James Reed, Benny Chen, Chenyu Zhao and Pawel Garbacki,
      bring experience from Meta's PyTorch compiler, ads infrastructure and core ML teams as well as
      Google Vertex AI. The founding team's deep inference-systems pedigree is repeatedly cited by
      investors as the company's core advantage and is also a key-person dependency concentrated in
      Qiao.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO032]
    tableRefs: [TO002]
  - id: funding-capitalization
    title: Funding and Capitalization
    body: >-
      Fireworks has raised more than $327 million across a seed round and three priced rounds. A
      $25 million Series A led by Benchmark closed in March 2024, with Sequoia Capital, Databricks
      Ventures and angels including Frank Slootman, Sheryl Sandberg, Howie Liu and Alexandr Wang. A
      $52 million Series B led by Sequoia followed in July 2024 at a $552 million valuation, adding
      NVIDIA, AMD and MongoDB Ventures and bringing cumulative capital to $77 million. In October
      2025 the company announced a $250 million Series C at a $4 billion valuation, co-led by
      Lightspeed Venture Partners, Index Ventures and Evantic with continued support from Sequoia;
      Sacra reports the round comprised roughly $230 million of primary capital plus a $20 million
      secondary. Strategic participants across rounds include NVIDIA, AMD, MongoDB and Databricks,
      tying the cap table to the hardware and data-platform ecosystems Fireworks depends on. As of
      May 2026 Sacra reports the company is in talks to raise again at a $15 billion post-money
      valuation, with Index set to co-lead, though terms are unconfirmed.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016, CO017]
    tableRefs: [TO003]
  - id: scale-traction
    title: Scale and Traction Metrics
    body: >-
      Fireworks reports rapid commercial scaling. At the Series C the company said it powers over
      10,000 companies, a roughly tenfold increase from the Series B, serves hundreds of thousands
      of developers, and processes more than 10 trillion tokens per day; third-party profiles cite
      15 trillion tokens per day by early 2026. The developer base grew from about 12,000 in
      February 2024 to 23,000 by the end of that year. Reported revenue figures vary by source and
      vintage and should be treated with care: the company stated annualized revenue had surpassed
      $280 million at the October 2025 Series C, while Sacra estimates roughly $305 million at
      year-end 2025 rising to about $800 million annualized by May 2026, and earlier 2025 coverage
      cited $130 million ARR with claims of profitability and 20x year-over-year growth. Gross
      margin is estimated near 50 percent, below the 70 percent-plus typical of software, because
      GPU costs sit in cost of goods sold; management has told investors it targets 60 percent.
    claimRefs: [CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO033]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: milestones-adverse
    title: Milestones and Adverse Signals
    body: >-
      The company chronology runs from leaving PyTorch in 2022 through three financings, a string
      of platform launches (FireAttention, FireFunction V2, FireOptimizer, supervised and
      reinforcement fine-tuning), a Dev Day in 2025, a March 2026 launch on Microsoft Foundry, and
      the acquisition of Hathora to deepen real-time compute orchestration. Alongside the growth
      story sit genuine adverse signals that later chapters examine in depth. Independent reviewers
      note that Fireworks is "just the engine," requiring meaningful developer sophistication, and
      flag thin documentation and the absence of an ongoing free tier. Analysts highlight three
      structural risks: inference commoditization as open-source serving frameworks such as vLLM
      and SGLang improve, hyperscaler bundling by AWS Bedrock, Azure and Vertex, and hardware
      concentration given Fireworks does not own its GPU fleet while NVIDIA has entered inference
      directly through its Lepton acquisition. These pressures sit against an unusually strong
      founding team and fast revenue ramp.
    claimRefs: [CO025, CO026, CO027, CO028, CO029, CO030, CO034, CO035]
    tableRefs: [TO004]
    figureRefs: [FO001]
