callouts:
  - calloutType: strength
    title: Rare founder-market fit
    body: >-
      The founding team built and scaled PyTorch at Meta, giving Fireworks unusually deep
      inference-systems expertise that investors at Index and Sequoia cite as the core reason for
      backing the company across multiple rounds.
    claimRefs: [CO006, CO007, CO032]
  - calloutType: risk
    title: Margin and commoditization pressure
    body: >-
      Gross margins near 50 percent and the steady improvement of open-source serving frameworks
      mean Fireworks' proprietary performance edge could compress unless it keeps moving up the
      stack into tuning, agents and enterprise governance.
    claimRefs: [CO024, CO029, CO034]
