callouts:
  - calloutType: strength
    title: Blue-chip, production-grade references
    body: >-
      Cursor, Notion, Sourcegraph and Upwork provide named, quantified, production case studies with
      executive attribution, unusually strong proof for a company of Fireworks' age.
    claimRefs: [CU011, CU012, CU013]
  - calloutType: risk
    title: Retention and concentration are unverified
    body: >-
      Fireworks discloses no NRR, churn or top-customer share, and low switching costs plus
      multi-homing make durability and revenue concentration material diligence gaps.
    claimRefs: [CU018, CU020, CU024]
