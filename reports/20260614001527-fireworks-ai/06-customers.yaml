schemaVersion: "report-v2"
artifact: customers
slug: fireworks-ai
runDate: "2026-06-14"
company:
  name: Fireworks AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Fireworks serves 10,000-plus companies and hundreds of thousands of developers, spanning
    AI-native startups, digital-native enterprises and select Fortune 500 buyers, with strong named
    proof points (Cursor, Notion, Sourcegraph, Upwork, Quora). Adoption and logos are credible, but
    retention metrics, churn and revenue concentration are undisclosed, leaving durability partly unverified.
sections:
  - id: segmentation
    title: Customer Base Segmentation
    body: >-
      Fireworks' customer base spans three broad segments distinguished by buyer, user, payer and
      adoption path. AI-native startups, including Cursor, Perplexity, Liner and Cresta, adopt
      bottoms-up: individual developers start with self-serve API keys, and the economic buyer is an
      engineering or platform lead. Digital-native enterprises, such as DoorDash, Notion, Shopify,
      Upwork and Quora, move features from pilot into production and expand into dedicated
      deployments and fine-tuning, with budget owned by product-engineering organizations.
      Traditional and larger enterprises, exemplified by Samsung and Uber, and increasingly
      regulated buyers in healthcare and financial services, adopt top-down through negotiated
      contracts requiring compliance and data-residency controls. Across all three, the user is a
      developer, the payer is an engineering or procurement budget, and use cases cluster around code
      assistance, conversational AI, enterprise search, agentic workflows and voice. Geographically
      the base skews North American and European with global API access, and verticals span software,
      e-commerce, marketplaces, customer service and legal tech.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption Trajectory
    body: >-
      Adoption has scaled steeply. Fireworks reported powering over 10,000 companies at its October
      2025 Series C, roughly a tenfold increase from about 1,000 at the Series B, alongside hundreds
      of thousands of developers. The developer base grew from about 12,000 in February 2024 to
      23,000 by the end of that year. Usage intensity is high: the platform processes more than 10
      trillion tokens per day, rising to about 15 trillion by early 2026, indicating that many
      accounts run production rather than experimental workloads. Customers progress along a
      land-and-expand path, beginning with serverless inference for a single feature and expanding
      into dedicated deployments, fine-tuning, reinforcement fine-tuning, embeddings for retrieval
      and voice agents. Analyst commentary on Hebbia illustrates how a single inference relationship,
      anchored on fast access to new open models and high-concurrency latency guarantees, can grow
      into a broader infrastructure dependency. The trajectory is strong on breadth and usage, though
      account-level retention and cohort expansion data are not disclosed.
    claimRefs: [CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: named-proof
    title: Named Customer Proof
    body: >-
      Fireworks has unusually strong named, production-grade proof points for a company of its age.
      Cursor used Fireworks' speculative-decoding API to reach roughly 1,000 tokens per second for
      Fast Apply code generation, with an AI researcher publicly stating Fireworks is "way more
      performant than the open source engines" and used in production. Notion reduced AI response
      latency from about two seconds to 350 milliseconds by fine-tuning with Fireworks, attributed by
      its head of AI engineering. Sourcegraph cut latency by 30% and lifted completion acceptance
      2.5x, and Upwork's "Uma" assistant drafts real-time proposals on Fireworks. Quora's Poe chatbot
      tripled response speed, and Superhuman built its Ask AI compound system on the platform. These
      are mostly production deployments with named executives and quantified outcomes, giving the
      reference base high quality and reasonable freshness, though several case studies date to 2024
      and a few logos appear only in aggregate marketing lists without standalone case studies.
    claimRefs: [CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: retention-durability
    title: Retention and Durability
    body: >-
      Retention is the weakest-evidenced dimension of the customer story. Fireworks does not disclose
      net revenue retention, gross retention, churn, renewal rates or contract lengths, so durability
      must be inferred from structural signals rather than measured. The positive signals are real:
      the platform's land-and-expand design, multi-product surface and enterprise controls encourage
      expansion, blue-chip logos run production workloads, and the OpenAI-compatible API plus
      reliability lead reduce reasons to leave once integrated. The negative signals are equally real:
      the same OpenAI-compatible API and the rise of routing aggregators make multi-homing and
      switching trivial, inference is commoditizing, and razor-thin price differentiation versus
      Together limits pricing-based stickiness. Independent reviewers explicitly note alternatives and
      switching paths. The net assessment is that durability is plausibly supported by product depth
      and integration but is not yet evidenced by disclosed retention metrics, which is a material
      diligence gap.
    claimRefs: [CU017, CU018, CU019, CU020, CU021]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: expansion-concentration
    title: Expansion and Concentration Risk
    body: >-
      Fireworks' growth engine is land-and-expand, with a single serverless feature able to grow into
      dedicated, fine-tuning, voice and reserved-capacity spend, supported by an AWS Strategic
      Collaboration Agreement that reaches buyers through existing procurement channels. The principal
      concentration risks are twofold. First, revenue is likely skewed toward a smaller number of
      large production deployments, so blended annualized revenue per company near $28,000 understates
      a probable long tail beneath a few large accounts; the identity and share of top customers are
      not disclosed, creating top-customer risk that cannot be quantified. Second, distribution and
      partner dependence is real: the AWS alliance and Microsoft Foundry availability are growth
      accelerants but also channel dependencies, and several marquee customers (for example
      DoorDash and Shopify) are themselves sophisticated buyers capable of multi-homing or
      in-housing. Procurement friction is lower than for closed APIs because of cloud-marketplace
      availability, but enterprise sales cycles and compliance reviews still gate the largest deals.
    claimRefs: [CU022, CU023, CU024, CU025, CU026]
    tableRefs: [TU005]
