    relatedQuestionRefs:
      - QM019
      - QM005
  - type: missing-source
    severity: material
    topic: single biggest competitive threat
    missingEvidence: Win/loss data showing which competitor most often displaces Fireworks in deals.
    whyItMatters: Identifying the dominant threat (hyperscalers vs Together vs OSS) shapes the durability thesis.
    diligencePath: Obtain Fireworks competitive win/loss analysis or buyer interviews across segments.
    relatedQuestionRefs:
