evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount and governance
    missingEvidence: Reliable employee headcount and board composition for Fireworks AI.
    whyItMatters: Headcount and governance affect burn, execution capacity and investor control assessment.
    diligencePath: >-
      Request a confirmatory data pack from the company or obtain LinkedIn headcount estimates and the post-Series C
      board roster.
    relatedQuestionRefs:
      - QO015
      - QO024
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: A single reconciled, dated revenue figure for Fireworks AI.
    whyItMatters: Revenue estimates vary 3-6x across sources and vintages, undermining valuation work.
    diligencePath: Obtain audited or management-confirmed ARR with a dated as-of, and reconcile company versus Sacra figures.
    relatedQuestionRefs:
      - QO011
  - type: missing-source
    severity: minor
    topic: investor map completeness
    missingEvidence: Full angel and seed investor list and ownership percentages for the stakeholder map.
    whyItMatters: Cap-table control and economic ownership cannot be fully assessed from disclosed leads alone.
    diligencePath: Review Form D filings if any, or request the cap table during diligence.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: independent inference niche sizing
    missingEvidence: A standardized analyst measure of independent open-weight inference-provider revenue.
    whyItMatters: Without it the SAM relevant to Fireworks' valuation is a low-confidence triangulation.
    diligencePath: >-
      Commission or source a bottoms-up build of provider revenues (Together, Fireworks, Baseten, Replicate, Anyscale)
      with dated as-ofs.
    relatedQuestionRefs:
      - QM007
      - QM020
  - type: conflicting-data
    severity: material
    topic: market-share
    missingEvidence: A reconciled denominator to compute Fireworks' serviceable market share.
    whyItMatters: Share estimates drive growth-runway and valuation assumptions.
    diligencePath: Pair a confirmed Fireworks ARR with a defensible niche-size estimate to derive share.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: minor
    topic: market-size forecasts
    missingEvidence: Convergence among analyst CAGR and 2034 estimates for AI inference.
    whyItMatters: A >$200B spread in 2034 estimates undermines long-range TAM extrapolation.
