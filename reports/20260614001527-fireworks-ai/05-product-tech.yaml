    title: Engineering-led differentiation
    body: >-
      FireAttention's custom CUDA kernels and FireOptimizer's adaptive speculative execution turn the
      founders' PyTorch systems expertise into measurable speed and cost advantages, reinforced by
      best-in-class function calling and 99.8% uptime.
    claimRefs: [CE012, CE013, CE018]
  - calloutType: risk
    title: Differentiation must be continuously re-earned
    body: >-
      Because Fireworks' optimization sits atop open-source frameworks like vLLM and SGLang that keep
      improving, and the IP is know-how rather than patents, the technology moat requires constant
      reinvestment to stay ahead.
    claimRefs: [CE023, CE026]
