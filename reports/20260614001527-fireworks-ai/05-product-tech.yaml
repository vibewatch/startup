company:
  name: Fireworks AI
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Fireworks is a production inference engine for open models: serverless and dedicated serving of
    hundreds of LLM, image, audio and multimodal models, plus fine-tuning, reinforcement fine-tuning
    and a voice-agent platform. Its differentiation rests on proprietary FireAttention CUDA kernels,
    the FireOptimizer adaptive speculative-execution stack, multi-LoRA, and enterprise-grade
    reliability, security and compliance controls.
sections:
  - id: product-definition
    title: Product Definition in Customer Workflow Terms
    body: >-
      In customer terms, Fireworks is the layer that takes an open-source model and makes it run in
      production fast, cheaply and reliably without the customer managing GPUs. A developer signs up,
      points an OpenAI-compatible API at a model such as Llama 4, DeepSeek or Qwen, and gets
      low-latency inference with function calling, JSON-mode structured output and streaming. As
      usage grows, the same customer can fine-tune a model on proprietary data, move to dedicated or
      reserved GPU capacity for guaranteed throughput, add retrieval and embeddings for RAG, and
      deploy voice agents. The platform spans text, image (Flux, SDXL), audio and multimodal
      formats across hundreds of models with day-zero support for major new releases. The core job
      it does for customers is to collapse the gap between a model that works in a notebook and one
      that serves millions of users in production, which Fireworks positions as the difference
      between experimentation and shipping. This is why its customers describe it as an inference
      engine rather than an application: it supplies speed, cost and control, while the customer
      builds the product.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE002]
    figureRefs: [FE002]
  - id: module-map
    title: Product Module and Asset Map
    body: >-
      Fireworks' product surface decomposes into several modules. Serverless inference is the entry
      product: pay-per-token access to 50-plus actively served models (hundreds across the catalog),
      including Llama 4 Scout and Maverick, DeepSeek V3, Qwen 3, Mixtral, Gemma 3 and Phi-4, with
      image generation via Flux and SDXL and vision models. FireFunction is the proprietary
      function-calling model family for tool use and structured output. The customization modules
      include LoRA fine-tuning, Supervised Fine-Tuning V2 with quantization-aware training, and
      Reinforcement Fine-Tuning for agentic tasks, all exposed through a Build SDK and an Experiment
      Platform. The deployment modules span serverless, on-demand dedicated and reserved capacity,
      plus multi-LoRA hosting that packs many fine-tuned adapters onto one base deployment. Newer
      surfaces include the Voice Agent Platform, which co-locates transcription, language models and
      tool calling for sub-500ms response, and BYOB secure training that lets enterprises train from
      their own AWS S3 buckets. Together these modules let a single customer relationship expand from
      one serverless feature into a full production AI runtime.
    claimRefs: [CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE001]
  - id: architecture
    title: Architecture and Operating Model
    body: >-
      Fireworks runs a proprietary, multi-layer inference stack on commodity NVIDIA GPUs. At the
      kernel layer, FireAttention is a custom CUDA attention implementation that Fireworks reports as
      substantially faster than vLLM and TensorRT-LLM, extended across versions to support long
      context and architectures like Llama 4's chunked local attention. Above it, FireOptimizer
      performs adaptive speculative execution, personalizing speculative decoding, draft-model
      selection and caching to each workload, with reported latency reductions up to roughly 3x in
      production and native FP4 support on NVIDIA Blackwell B200 hardware. The serving topology
      combines a stateless request router, draft and target GPU pods for speculative decoding, a
      distributed KV cache, continuous batching and disaggregated serving, scaling to documented
      tests around 50,000 requests per minute. Multi-LoRA consolidates many fine-tuned variants onto
      a single base model. The operating model is open-model neutral: Fireworks bets on running
      whichever open model is winning at a given moment rather than on any single model, which makes
      day-zero support for new releases a core engineering discipline.
    claimRefs: [CE011, CE012, CE013, CE014, CE015, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-reliability-roadmap
    title: Deployment, Reliability, Integration and Roadmap
    body: >-
      Fireworks supports serverless, on-demand dedicated and reserved deployments across a global
      multi-region fleet with documented locations including Frankfurt, Iceland and Tokyo plus US,
      Europe and APAC regions, enabling latency and data-residency requirements. Integration is
      eased by an OpenAI-compatible API plus SDKs and connectors for frameworks such as LangChain
      and LlamaIndex, so migration from closed APIs can take minutes. Reliability is a headline
      claim: independent monitoring placed Q1 2026 uptime at 99.8%, the highest among specialized
      providers, with strong stability under load. Documented production results include Cursor
      reaching about 1,000 tokens per second for code generation, Notion cutting AI response latency
      from roughly 2 seconds to 350 milliseconds, and Sourcegraph seeing a 30% latency reduction and
      a 2.5x increase in completion acceptance. The roadmap, funded by the Series C, targets deeper
      research in tuning and inference alignment, an end-to-end model-lifecycle toolchain, and a
      three-to-four-fold expansion of global compute, alongside the Hathora acquisition to deepen
      real-time orchestration.
    claimRefs: [CE017, CE018, CE019, CE020, CE021, CE022]
    tableRefs: [TE005]
    figureRefs: [FE004]
  - id: differentiation
    title: Differentiation, IP and Data
    body: >-
      Fireworks' differentiation is engineering-led. Its core intellectual property is the
      proprietary inference engine, especially FireAttention's custom kernels and FireOptimizer's
      adaptive optimization, which convert systems expertise from the founders' PyTorch background
      into measurable speed and cost advantages; no public patents are listed, so the moat is
      know-how rather than registered IP. A second source of differentiation is product-model
      co-design: a data feedback loop in which customer interactions continuously improve fine-tuned
      models, which Fireworks frames as how enterprises build a competitive moat with AI. A third is
      breadth and freshness: day-zero support across hundreds of open models and modalities, so the
      platform benefits from model turnover rather than being threatened by it. The principal
      vulnerability is that the optimization advantage sits atop open-source frameworks like vLLM and
      SGLang that keep improving, so the differentiation must be continuously re-earned. Supply
      access to leading-edge NVIDIA and AMD GPUs is a further enabling, but not exclusive, advantage.
    claimRefs: [CE023, CE024, CE025, CE026, CE027]
    figureRefs: [FE003]
  - id: trust-security
    title: Trust, Safety, Security and Compliance
    body: >-
      Fireworks' enterprise posture is built for regulated buyers. The platform offers zero data
      retention by default, single sign-on, audit logs, and data-residency controls, and its
      AWS-based inference solution is HIPAA and SOC2 Type II compliant. For the most sensitive
      workloads it supports airgapped EKS deployments and bring-your-own-bucket secure training that
      keeps training data in the customer's own AWS S3. Structured output controls such as JSON mode
      and grammar-constrained decoding improve reliability and reduce malformed responses in agentic
      workflows, and FireFunction's high schema-compliance rate supports dependable tool use. These
      capabilities open regulated verticals including healthcare, financial services and
      government-adjacent workloads that were previously inaccessible to a standalone inference
      vendor. Quality is reinforced by continuous evaluation and reinforcement learning in the
      product-model co-design loop. Gaps remain: Fireworks does not publish a formal standard-tier
      SLA, enterprise SLAs are negotiated case by case, and independent reviewers note thin
      documentation in places, which are diligence items for security-sensitive buyers.
    claimRefs: [CE028, CE029, CE030, CE031, CE032]
    tableRefs: [TE004]
