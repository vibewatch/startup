  evidenceGaps:
    - type: missing-source
      severity: material
      topic: independent benchmark verification
      missingEvidence: Independent reproductions of Fireworks' FireAttention/FireOptimizer speed claims versus vLLM and SGLang.
      whyItMatters: The technology moat thesis rests on performance advantages that are largely vendor-reported.
      diligencePath: Run controlled head-to-head benchmarks or commission a third-party evaluation.
      relatedQuestionRefs: [QE026, QE018]
    - type: access-blocked
      severity: minor
      topic: SLA terms
      missingEvidence: Fireworks' formal SLA and incident-history disclosures.
      whyItMatters: Security-sensitive buyers need contractual reliability commitments, not just observed uptime.
      diligencePath: Request enterprise SLA and historical incident reports during procurement.
      relatedQuestionRefs: [QE024]
