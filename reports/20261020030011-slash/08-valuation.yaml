schemaVersion: "report-v2"
artifact: valuation
slug: slash
runDate: 2026-10-20
company:
  name: Slash
chapter:
  number: 8
  title: Valuation
  summary: >-
    Slash's April 2026 Series C established a $1.4 billion post-money valuation
    against company-reported 2025 annualized revenue of more than $250 million,
    implying roughly 5.6x that metric. The recommendation is research-more:
    public evidence supports rapid scale and product breadth, but it does not
    disclose audited margins, retention, the cap table, preferences, or a
    sufficiently comparable current-market valuation set.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The recommended posture is research-more, with medium confidence, high
      risk, and a stretched valuation stance. Slash raised $100 million at a
      $1.4 billion post-money valuation in April 2026, after a $41 million
      Series B at $370 million in May 2025. Dividing the latest valuation by
      the company-reported $250 million of annualized revenue produces a
      headline multiple of about 5.6x, but that is not an ARR multiple and
      cannot be treated as a fully diluted enterprise-value multiple. Public
      sources do not disclose round EV/revenue metrics, the shareholder
      register, liquidation preferences, gross margin, retention, burn, or
      net cash. Entry discipline should therefore require private-data
      verification and a return model rather than accepting the latest
      financing mark as fair value.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV014
      - CV015
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Slash has converted an early niche product into a
      broader financial operating platform with unusually strong reported
      scale: the company says it exceeded $250 million in annualized revenue,
      powers more than $30 billion in annualized payment volume, and serves
      more than 5,000 businesses. Management says most new capital will fund
      distribution and marketing rather than the Twin product alone, creating
      a plausible route to broaden adoption. The anti-thesis is that these
      figures remain company-originated, venture pricing was unusually strong,
      and Slash previously suffered an 80% revenue drop after a vertical-market
      shock. User-review evidence is favorable overall but identifies support,
      transaction-limit, and accounting-integration complaints, while the
      Column sponsorship structure creates a material partner dependency.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
    tableRefs:
      - TV002
  - id: scenarios-and-comparable-frame
    title: Scenarios and comparable frame
    body: >-
      The public evidence supports scenario anchors, not a precise intrinsic
      valuation range. The $370 million Series B and $1.4 billion Series C are
      financing marks separated by eleven months, while the latest mark equals
      about 5.6x company-reported annualized revenue. A third-party profile
      lists historical IPO price-to-sales references from roughly 5x to 41x
      for Klarna, Coinbase, Affirm, SoFi, and Nubank, but these differ in
      geography, regulation, maturity, revenue quality, and market cycle and
      are not direct benchmarks for Slash. The base case should therefore hold
      the April financing mark only as a negotiating reference. Bull-case
      upside requires verified durable margins and retention; bear-case
      protection requires recognizing the prior mark and partner, customer,
      and multiple-compression risks.
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV010
      - CV012
      - CV016
    tableRefs:
      - TV003
  - id: exit-readiness-and-diligence-triggers
    title: Exit readiness and diligence triggers
    body: >-
      Slash has late-stage financing, substantial reported payment scale, and
      products spanning cards, banking, global payments, stablecoins, and AI
      workflows, but public evidence is not enough to underwrite an exit path
      or target return. Exit readiness depends on proving that reported
      annualized revenue converts into durable gross profit and cash flow,
      that customer and vertical concentration are controlled, and that
      sponsor-bank and digital-asset dependencies can survive regulatory or
      counterparty disruption. Before investing, obtain audited or
      board-reviewed financials, cohort retention, revenue composition, the
      fully diluted cap table, preference stack, and a current compliance map.
      Thesis-break triggers are a material revenue reset, loss of Column or
      equivalent bank coverage, weak retention, unresolved stablecoin
      compliance, or an entry price that cannot support the required return
      under conservative exit multiples.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV010
      - CV012
      - CV013
      - CV014
      - CV015
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Evidence and decision implication
    rows:
      - - Recommendation
        - Research more
        - Verify private financial, retention, cap-table, and preference evidence before pricing an investment.
      - - Confidence
        - Medium
        - The financing marks are corroborated, but most operating scale data originates with Slash.
      - - Risk rating
        - High
        - Revenue-shock history, partner-bank dependency, and missing unit economics create material downside uncertainty.
      - - Valuation stance
        - Stretched
        - The $1.4B mark is about 5.6x company-reported annualized revenue, not verified ARR or enterprise value.
      - - Decision implication
        - Do not underwrite at the headline mark yet
        - Proceed only after a fully diluted return model and downside protections are available.
    notes: >-
      Assessments use April 2026 financing data and company-reported annualized
      revenue; no audited margin, cash, retention, cap-table, or preference data
      was available in the assigned public evidence.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV010
      - CV012
      - CV014
      - CV015
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Public evidence
      - What would change the view
    rows:
      - - Thesis
        - Reported revenue scale is exceptional for company age.
        - Slash says annualized revenue exceeded $250M in 2025.
        - Audited revenue quality, gross margin, and cash conversion would strengthen the thesis.
      - - Thesis
        - Payment activity indicates substantial platform usage.
        - Slash says it powers more than $30B in annualized payment volume.
        - Cohort-level payment, take-rate, and customer-concentration data would confirm durability.
      - - Thesis
        - Distribution investment could broaden the installed base.
        - Management says most Series C proceeds will support distribution and marketing.
        - Efficient acquisition and improving retention would validate this use of capital.
      - - Anti-thesis
        - Growth may be vulnerable to vertical-market shocks.
        - Management reported an 80% revenue fall after the sneaker-resale disruption.
        - Demonstrated vertical diversification and concentration limits would reduce this risk.
      - - Anti-thesis
        - Sponsor-bank dependence can constrain product continuity.
        - Slash is a fintech, and accounts are sponsored by Column N.A.
        - Tested migration plans and redundant regulated partners would reduce dependency.
      - - Anti-thesis
        - Product quality is not uniformly proven.
        - A review synthesis found support-access, transaction-limit, and accounting-integration complaints.
        - Independently verified enterprise retention and support service levels would improve confidence.
    notes: >-
      Thesis items combine company-issued scale claims with independent reporting
      and review evidence; operating claims remain unaudited in the public record.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Bull, base, and bear scenario frame
    columns:
      - Case
      - Assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Reported scale is verified; margins, retention, and diversification are durable; distribution remains efficient.
        - Value above the $1.4B financing mark is supportable only if a conservative exit multiple clears the target return.
        - Multiple compression, regulation, partner concentration, and execution across new products.
        - Not supported by public evidence until private operating data is verified.
      - - Base
        - $250M annualized revenue is substantially accurate, but margins and retention remain unverified.
        - Treat $1.4B and the derived 5.6x revenue reference as negotiation anchors, not fair value.
        - Revenue quality, dilution, preferences, customer mix, and sponsor-bank dependency.
        - Most consistent with current evidence, but still insufficient for a buy decision.
      - - Bear
        - Revenue quality disappoints, concentration emerges, or a partner or regulatory disruption slows growth.
        - Require pricing below the latest mark; the $370M Series B is a historical downside reference, not an appraisal.
        - A repeat vertical shock, weak retention, capital needs, and down-round preference overhang.
        - Plausible because Slash has previously reported an 80% revenue shock.
    notes: >-
      Scenario values are financing references rather than appraised ranges;
      probability signals are qualitative because assigned public evidence lacks
      audited forecasts, margins, retention, cash, and a fully diluted cap table.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV009
      - CV010
      - CV014
      - CV015
      - CV016
