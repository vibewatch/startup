              - CR007
              - CR008
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 投资否决标准
            body: >-
              如果 Slash
              无法证明发起行连续性、当前独立控制鉴证、客户资金冻结和投诉队列、数字资产牌照及储备保护，或无法证明现金和烧钱情况，应暂停投资或重新定价。将发起行限制、重大资金访问或支付控制事故、反复出现的政策外冻结，或无法提供经过测试的迁移方案，视为论点破坏事件。
