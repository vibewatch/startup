          - type: paragraph
            body: >-
              Tracxn 和 2026 年 4 月公司公告都报告累计融资 $160 million，其中包括以 $1.4 billion 投后估值完成的 $100 million Series
              C。这笔融资是重要的资本获取信号，但融资额不等于手头现金，也不能说明烧钱、现金跑道、债务、受限现金或未来项目融资义务。留存证据没有当前资产负债表、现金流量表、董事会批准的预测或核对过的资金用途。投资判断因此是混合的：与交易量挂钩的交换费收入和不断扩大的变现面可以支撑有吸引力的收入增长，但收入确认、毛利率、客户集中度和资本消耗仍属于私有信息。下一步尽调不是再做一份收入总额估算，而是取得月度财务包，把已确认收入与年化运行率、支付额、奖励和网络成本、损失、经营现金流以及
              Series C 后流动性核对起来。
