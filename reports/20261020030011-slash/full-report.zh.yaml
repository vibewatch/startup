  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              最明确的公开收入机制是银行卡交换费：Forbes 报道称，Slash
              的大部分收入来自商户受理信用卡和借记卡所产生的交换费。这是一种与交易量挂钩的模式，收入质量取决于银行卡消费、网络经济性、奖励费用、欺诈与损失表现，以及高消费客户的活跃度。第二个规模较小的披露收入层来自软件和支付定价。B2B
              Reviews 列出免费套餐和每月 $25 的 Pro 套餐；Free 套餐对部分更快支付收取单笔交易费，而 Pro 套餐包含这些费用。稳定币支付、资金管理和合作方提供的营运资金扩大了产品范围，但留存证据没有披露
              Slash 在这些产品上的价差、费用、转介分成或毛利。              因此，按产品看，收入模式已经多元化，但收入结构和会计处理仍不透明。
