chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Slash Financial, Inc. 是一家总部位于 San Francisco、服务现代化和数字优先企业的金融科技公司。它本身不是 FDIC 保险银行：银行服务和 Slash Platinum 签账卡由
              Column N.A. 提供，其他产品则依赖更多合作伙伴。平台把企业活期账户、企业卡、费用控制、资金管理、全球支付、稳定币支持和 Twin 财务代理放进同一界面。这种覆盖面使 Slash
              更像软件驱动的财务操作系统，而不是单一银行卡产品；但这也意味着运营模式依赖受监管和技术合作方。公开来源一致将总部置于 San Francisco；一份独立资料还列出其在 New York
              设有办公室。最有力的创立证据指向 2021 年，但第三方资料分别称为 2019 年和 2020 年，因此在依赖公司年龄进行比较前，应先核对注册和开始运营日期。
