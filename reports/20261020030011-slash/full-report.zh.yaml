      - number: '2.4'
        title: 采用驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              免费入门层、付费套餐、收益和返现经济性、虚拟卡控制、更快的国内及国际支付、会计集成，以及借助 API 或 AI 工作流自动化，都可能推动采用。B2B Reviews 称其对 807
              条评价的综合分析总体积极，说明便利性和支持服务可能与价格同样重要。同一评测也指出了早期客服接入、交易限额和会计集成深度方面的抱怨。更根本的问题是，买方必须信任合作银行和第三方数字资产安排，因为 Slash
              并不拥有受监管银行的资产负债表。这些约束会影响转化、留存和毛利率的持续性，因此在没有定价、费率、留存和贡献利润证据前，不应把 $30 billion 的资金流量按经常性软件收入估值。
