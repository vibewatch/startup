        title: 融资与经营规模
        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月 16 日，Slash 完成 $100 million Series C，报道估值为 $1.4 billion，由 Ribbit Capital 领投，Khosla Ventures 和
              Goodwater Capital 联合领投。Slash 称累计融资额为 $160 million，此前包括 2025 年 5 月的 $41 million Series B，以及 2023 年 Seed 和
              Series A 合计 $19 million。这些数字描述的是融资额，不是当前可用现金。经营披露同样亮眼，但来自公司自身：Slash 称 2025 年年化收入超过 $250 million，年化支付额超过
              $30 billion，并在上线九个月内实现超过 $1 billion 的年化稳定币支付额。年化收入不是 ARR；在现有证据中，也没有找到经审计的收入、毛利率、烧钱、现金或盈利桥接数据。一份 2026 年 8
              月的独立资料估计公司约有 70 名员工，但没有主要来源披露对此人数作出佐证。
