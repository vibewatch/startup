      - number: '3.3'
        title: 分销、切换与控制
        blocks:
          - type: paragraph
            body: >-
              当客户在同一运营层采用多实体仪表盘、会计集成、虚拟卡、支付审批和资金管理时，工作流广度可以形成实际切换成本。但这种成本不等于拥有专有金融基础设施。Column 提供银行服务，Whop
              为新上线的受理产品提供商户接入、支付执行和结算，融资则来自合作方。帮助 Slash 扩张的同一套 API 和 SDK 界面，也为复杂客户保留了内部自建路径。因此，分销能力和合作伙伴连续性与功能广度同样重要。
