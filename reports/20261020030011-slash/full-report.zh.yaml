      - number: '7.3'
        title: 运营、欺诈控制与安全执行
        blocks:
          - type: paragraph
            body: >-
              Slash 针对 2026 年 8 月 BBB 投诉的回应称，内部欺诈控制在持续调查期间限制了一个账户及其资金，并设置了 30
              天监控期。这一回应提供了缓解机制，但投诉称该冻结中断了供应商付款，客服响应也很慢。其他 BBB
              条目涉及账单、银行卡争议、退回资金和账户关闭；另一份评测综合分析称客服总体评价积极，但也记录了联系团队困难、交易限额较小和集成深度不足。这些记录不能证明问题的普遍程度，却识别出了与企业银行产品相关的失效模式。控制能力也值得测试：第三方资料估计员工约
              70 人，而公司披露称年化支付额超过 $30 billion，且 AI 代理可以执行支付和创建银行卡。在把快速自动化视为降低风险之前，需要取得独立 SOC
              报告、渗透测试摘要、停机历史、欺诈损失率、升级响应时间和模型控制证据。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
          - type: table
