        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              Slash
              最清晰的目标客户是频繁转移资金、希望在银行、银行卡、支付和自动化之间使用一个操作界面的数字优先企业。公开的细分行业包括联盟营销、电子商务、医疗、家政服务、加密、代理机构和初创公司。可能的经济买方包括创始人、CFO、财务控制负责人
              或财务运营负责人；员工使用银行卡和支付工作流，开发者则可能使用 API 和代理集成。这一买方画像来自产品设计推断，而非披露的销售数据。覆盖超过 130 个国家以及支持超过 9
              个网络的稳定币业务扩大了相邻空间，但这两个指标都不能证明各司法辖区存在可服务需求或具备监管可用性。
