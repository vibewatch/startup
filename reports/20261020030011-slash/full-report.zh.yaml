          value: Digital-first, lean, high-velocity businesses
          note: 客户分群描述，不是计数人口
          tone: neutral
          claimRefs:
            - CM004
        - label: 公司披露的客户触达
          value: More than 5,000 businesses
          note: 公司发布的数字；一份评论另称超过 10,000
          tone: risk
          claimRefs:
            - CM005
            - CM007
        - label: 支付流规模
          value: More than $30B annualized payment volume
          note: 平台流量，不是收入或市场规模
          tone: neutral
          claimRefs:
            - CM006
        - label: 稳定币切入口
          value: More than $1B annualized volume within nine months
          note: 产品吞吐量，不是经常性收入
          tone: neutral
          claimRefs:
            - CM008
        - label: 相邻触达范围
          value: 130+ countries and 9+ networks
          note: 可用性指标，没有需求分母
          tone: neutral
          claimRefs:
            - CM009
            - CM010
    approximationNotes: 不同单位不会被相加、相除或视为嵌套人口。数值沿用来源术语，不代表 TAM、SAM、SOM、转化率或市场份额。
    claimRefs:
      - CM001
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM015
  - id: FP001
    title: 按工作流广度与买方所有权负担划分的竞争定位
    type: quadrant
    summary: 序数定位展示一体化运营层与买方需要承担的实施负担之间的战略取舍。
    data:
      xAxis:
        label: 工作流广度（1=窄，5=广）
        min: 1
        max: 5
      yAxis:
        label: 买方实施负担（1=低，5=高）
        min: 1
        max: 5
      points:
        - label: Slash
          x: 5
          'y': 2
          detail: 集成银行、卡、支付、资金管理、稳定币和 AI 操作；仍依赖合作伙伴。
        - label: Ramp / Brex
          x: 3
          'y': 2
          detail: 支出管理领域的同类公司；指定证据未验证其功能完全对等。
        - label: BILL
          x: 3
          'y': 2
          detail: 应付 / 应收自动化与卡业务的成熟厂商。
        - label: Unit
          x: 2
          'y': 5
          detail: 嵌入式金融基础设施要求买方自行构建并运营产品体验。
        - label: 传统银行 + 点工具
          x: 3
          'y': 4
          detail: 模块化替代方案，但界面和供应商管理较为分散。
        - label: 内部 API 构建
          x: 4
          'y': 5
          detail: 覆盖面可能很广且可定制，但实施和控制负担最高。
    approximationNotes: 评分为分析师赋予的序数值，不是经过测量的市场数据。评分将来源描述的产品范围和买方所需集成程度转化为 1-5 比较，不代表市场份额、产品质量或定价。
    claimRefs:
      - CP003
      - CP007
      - CP010
      - CP012
      - CP013
  - id: FI001
    title: 收入模型桥接与披露边界
    type: flow
    summary: 客户活动可以带来卡、订阅和交易收入，但公开证据没有量化从总活动量桥接到确认收入或毛利所需扣除的项目。
    data:
      nodes:
        - id: customer-activity
          label: 客户活动
          detail: 卡消费、账户使用、转账、余额、稳定币支付和融资需求。
        - id: card-interchange
          label: 卡交换费
          detail: Forbes 将交换费列为 Slash 的主要收入来源。
        - id: subscription
          label: Pro 订阅
          detail: 公开标价为每月 $25。
        - id: transaction-fees
          label: 交易费用
          detail: 部分快速支付和境外卡活动收取公开列示的费用。
        - id: partner-products
          label: 资金管理、稳定币与营运资金
          detail: 产品活动确实存在，但 Slash 的直接收入结构未披露。
        - id: recognized-revenue
          label: 确认收入
          detail: 保留证据中没有公开经审计的收入桥接或收入流构成。
        - id: gross-profit
          label: 毛利
          detail: 奖励、支付通道、合作伙伴、欺诈、损失和支持成本均未量化。
      edges:
        - from: customer-activity
          to: card-interchange
          label: 卡消费
        - from: customer-activity
          to: subscription
          label: 付费方案
        - from: customer-activity
          to: transaction-fees
          label: 支付使用
        - from: customer-activity
          to: partner-products
          label: 余额与融资
        - from: card-interchange
          to: recognized-revenue
          label: 净经济性未披露
        - from: subscription
          to: recognized-revenue
          label: 实际收入构成未披露
        - from: transaction-fees
          to: recognized-revenue
          label: 支付通道成本未披露
        - from: partner-products
          to: recognized-revenue
          label: 费用或利差未披露
        - from: recognized-revenue
          to: gross-profit
          label: 成本桥接不可得
    approximationNotes: 仅为概念机制；节点顺序和连线不代表收入贡献比例、转化率、已确认收入或毛利率。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI014
      - CI015
      - CI016
  - id: FE001
    title: 公开描述的产品架构栈
    type: stack
    summary: 一体化用户价值主张之下，连接着多个合作伙伴和控制依赖，但公开来源尚未从技术层面验证这些依赖。
    data:
      layers:
        - label: 交互入口
          detail: 用户与软件接入一体化 Slash 产品界面的入口。
          modules:
            - 控制台与移动端
            - Twin 的 Slack 或短信入口
            - API 与会计集成
        - label: 工作流应用
          detail: 在产品体验内协同运行的企业财务功能。
          modules:
            - 费用与支出控制
            - 开票与账单支付
            - 多实体管理
        - label: 代理执行
          detail: 公开材料称 Twin 可以执行的金融操作。
          modules:
            - 支付
            - 生成发票
            - 创建卡
        - label: 金融产品
          detail: 面向客户提供的账户、卡、资金管理和融资产品。
          modules:
            - 企业账户与资金管理
            - 公司卡
            - 营运资金
        - label: 全球与数字资产支付通道
          detail: 由外部服务商提供的跨境及数字资产能力。
          modules:
            - 稳定币支付
            - Global USD 账户
            - 法币兑换
        - label: 外部基础与控制
          detail: 支撑各产品层的合作伙伴基础设施和控制功能。
          modules:
            - Column N.A. 银行与卡服务
            - 第三方数字资产服务商
            - 身份、权限、审批和欺诈控制
    approximationNotes: 层级顺序为分析安排，不代表实施顺序、网络拓扑或所有权，除非保留来源明确描述了这些关系。
    claimRefs:
      - CE001
      - CE006
      - CE008
      - CE012
      - CE013
  - id: FU001
    title: 客户采用入口与潜在扩张路径
    type: journey-map
    summary: Slash 可以沿七个相邻工作流入口拓宽客户关系，但公开证据没有量化各阶段的转化或留存。
    data:
      nodes:
        - label: 资格与开户
          detail: 企业账户入口，包括国际 USD 账户入口。
          touchpoints:
            - Online application
            - Global USD account
        - label: 核心运营账户
          detail: 支票账户、资金管理、转账、虚拟账户和现金控制。
          touchpoints:
            - ACH and wires
            - Treasury
        - label: 卡部署
          detail: 实体卡和虚拟卡，配有支出限额和用户权限。
          touchpoints:
            - Card creation
            - Spend controls
        - label: 财务工作流
          detail: 费用管理、开票、账单支付和会计连接。
          touchpoints:
            - Accounting integrations
            - Approval workflows
        - label: 多实体与 API 使用
          detail: 实体切换和开发者 API 可以加深运营嵌入。
          touchpoints:
            - Multi-entity dashboard
            - API automation
        - label: 全球与稳定币支付
          detail: 跨境及数字资产支付通道扩大支付覆盖范围。
          touchpoints:
            - Global payments
            - Stablecoin on/off ramps
        - label: 合作伙伴交付的产品
          detail: 银行、卡和贷款体验部分依赖受监管银行及信贷合作伙伴。
          touchpoints:
            - Column banking and card services
            - Partner lending
    approximationNotes: 排列是分析性的工作流顺序，不是经过测量的漏斗；未推断转化率、渗透率或留存率。
    claimRefs:
      - CU009
      - CU013
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性定位强调影响和证据支持的可能性；它不估计事件发生概率，也不暗示各类别之间等距。
    data:
      columns:
        - id: lower
          label: 证据支持的较低可能性
          detail: 由于公开证据过于单薄，无法支持低可能性结论，因此这里没有归类任何风险。
        - id: medium
          label: 证据支持的中等可能性
          detail: 有证据支持一种合理的失效机制，但没有按总体口径校准的事件发生率。
        - id: higher
          label: 证据支持的较高可能性
          detail: 仅用于有重复发生且有分母支持的事件；指定证据池没有确立此类事件。
      rows:
        - id: high-impact
          label: 高影响
          note: 可能中断客户资金、核心支付或受监管产品。
          values:
            - label: 无证据支持的归类
              tone: neutral
            - label: 赞助银行集中风险；数字资产边界；客户资金冻结；AI 支付控制
              detail: 这些高影响机制的可能性在定性上为中等，且缓释措施不完整。
              tone: risk
            - label: 无证据支持的归类
              tone: neutral
        - id: high-medium-impact
          label: 中高影响
          note: 可能实质损害某项金融工作流，但不会停用所有核心产品。
          values:
            - label: 无证据支持的归类
              tone: neutral
            - label: 卡网络争议处理；特定服务商中断
              detail: 公开证据确立了依赖关系和投诉机制，但没有测量发生频率。
              tone: high
            - label: 无证据支持的归类
              tone: neutral
        - id: medium-impact
          label: 中等影响
          note: 可能降低服务、经济性或客户信任，但不会令平台停止运行。
          values:
            - label: 无证据支持的归类
              tone: neutral
            - label: 账单 / 争议处理运营；支持能力；集成深度
              detail: 投诉和评论证据识别出这些模式，但普遍程度未知。
              tone: warning
            - label: 无证据支持的归类
              tone: neutral
        - id: lower-medium-impact
          label: 中低影响
          note: 可能造成反复摩擦或带来切换压力，但直接资金暴露有限。
          values:
            - label: 无证据支持的归类
              tone: neutral
            - label: 交易限额；会计集成深度
              detail: 评论综合分析识别出这些问题，但没有量化其普遍程度或经济影响。
              tone: medium
            - label: 无证据支持的归类
              tone: neutral
        - id: lower-impact
          label: 低影响
          note: 局部不便，财务或监管后果有限。
          values:
            - label: 无证据支持的归类
              tone: neutral
            - label: 无证据支持的归类
              tone: neutral
            - label: 无证据支持的归类
              tone: neutral
        - id: minimal-impact
          label: 极小影响
          note: 指定证据池没有支持将任何受监测风险归为极小影响。
          values:
            - label: 无证据支持的归类
              tone: neutral
            - label: 无证据支持的归类
              tone: neutral
            - label: 无证据支持的归类
              tone: neutral
    approximationNotes: 各类别是分析师的定性判断。没有可用的数值概率、基准阈值、客户分母或事件频率估计。
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR006
      - CR009
      - CR010
      - CR012
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 披露的规模和融资势头，被证据质量、依赖关系和估值投资判断缺口抵消。
    data:
      nodes:
        - id: financing-mark
          label: 最新融资估值标记
          value: $1.4B post-money
          detail: 2026 年 4 月 $100M Series C
        - id: operating-scale
          label: 已披露运营规模
          value: $250M annualized revenue
          detail: 公司披露的 2025 年指标
        - id: headline-multiple
          label: 核心入场参考值
          value: ~5.6x
          detail: 投后估值除以年化收入；不是 ARR 或企业价值
        - id: resilience-test
          label: 韧性测试
          value: Unproven
          detail: 此前 80% 的收入冲击，以及对赞助银行的重大依赖
        - id: underwriting-gap
          label: 投资判断缺口
          value: Material
          detail: 没有公开的经审计利润率、留存、股权结构表或优先股堆叠数据
        - id: recommendation
          label: 建议
          value: Research more
          detail: 拿到私有证据、建立完全稀释口径的回报模型后，才能定价
    approximationNotes: 5.6 倍参考值由投后估值和公司披露的年化收入推导得出；它不是 ARR 或企业价值倍数。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV009
      - CV010
      - CV012
      - CV014
      - CV015
