      - 假设
      - 估值与回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 已披露规模得到验证；利润率、留存和多元化具有持久性；分销仍然高效。
        - 只有保守的退出倍数足以实现目标回报，才有理由支持高于 $1.4B 融资估值的价值。
        - 倍数压缩、监管、合作伙伴集中度以及新产品执行风险。
        - 在私有运营数据得到验证前，没有公开证据支持该情景。
      - - 基准
        - $250M 年化收入基本准确，但利润率和留存仍未经验证。
        - 将 $1.4B 和推导出的 5.6 倍收入参考值视为谈判锚点，而非公允价值。
        - 收入质量、稀释、优先权、客户构成和对赞助银行的依赖。
        - 与当前证据最一致，但仍不足以做出买入决策。
      - - 悲观
        - 收入质量令人失望、出现集中度，或合作伙伴及监管中断拖慢增长。
        - 定价应低于最新估值标记；$370M 的 Series B 是历史下行参考，而非评估值。
        - 垂直行业冲击重演、留存疲弱、资金需求以及下轮融资优先权悬置。
        - 这一情景具有合理性，因为 Slash 此前报告过 80% 的收入冲击。
