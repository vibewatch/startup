              最强的公开牵引力指标是年化口径，而非经审计的期间指标。Slash 在 2026 年 4 月的公司公告称，2025 年年化收入超过 $250 million，并为超过 5,000 家企业处理超过 $30
              billion 的年化支付额。更早的 Forbes 报道称约有 2,500 家客户和 $6 billion 的年化交易额；之后的一份评测称有超过 10,000
              家企业信任该平台。这些观察说明扩张很快，但由于日期、定义和分母不同，不能拼成干净的客户队列序列。2023 年从球鞋转售商转向垂直行业银行业务，说明管理层能在需求冲击后重新调整分销，但公开证据仍未披露
              CAC、销售周期、渠道结构、回本期、留存和客户集中度。因此，支付额和客户数是 GTM 代理指标，不能替代收入留存或销售效率。
