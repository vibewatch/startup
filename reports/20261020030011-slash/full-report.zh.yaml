  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              推荐姿态为继续研究，信心中等、风险高，估值偏高。Slash 于 2026 年 4 月以 $1.4 billion 投后估值融资 $100 million；此前于 2025 年 5 月完成 $41 million
              Series B，估值 $370 million。用最新估值除以公司披露的 $250 million 年化收入，得到约 5.6x 的 headline 倍数，但这不是 ARR
              倍数，也不能视为完全摊薄的企业价值倍数。公开来源没有披露各轮
              EV/收入指标、股东名册、清算优先权、毛利率、留存、烧钱或净现金。因此，入场纪律应要求核实私有数据并建立回报模型，而不是直接接受最新融资估值为公允价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
