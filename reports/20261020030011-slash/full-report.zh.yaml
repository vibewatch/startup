              公开资料将 Victor Cardenas 列为联合创始人兼 CEO，将 Kevin Bai 列为联合创始人兼 CTO。独立资料称，两人分别从 Stanford 和 University of Waterloo
              退学后，在 19 岁时创办
              Slash；公司也从球鞋转售商银行业务转向更广泛的垂直行业银行业务。这段经历说明创始团队积累了市场理解和快速迭代能力，但也让可见的战略和技术叙事集中在两个人身上。指定来源没有提供完整的现任高管名单、董事会成员、董事会观察员权利、持股、投票控制、继任计划或重大领导层离职记录。因此，投资者在评估创始人控制权、投资者保护或机构化运营深度前，需要取得
