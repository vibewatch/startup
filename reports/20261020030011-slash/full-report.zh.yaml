        title: 成本结构与单位经济性
        blocks:
          - type: paragraph
            body: >-
              留存来源无法提供可信的毛利率桥接。交换费收入需要承担返现、网络和发卡成本、欺诈及信用损失、客服、合规和合作银行经济分成；支付和稳定币产品还增加了对第三方通道和流动性的依赖。Slash
              是金融科技公司而非保险银行，银行服务由 Column N.A.
              提供；营运资金产品也被描述为合作方提供。这些结构可能降低资产负债表强度，但也意味着支付额这一表面指标不能说明净收入或贡献利润。评测证据补充了有限的负面运营信号：部分用户反映早期客服困难、交易限额较低以及会计集成较浅。没有毛利率、损失率、奖励费用、合作方费率或留存队列，就不能根据公开数据评估收入持久性或经营杠杆。
