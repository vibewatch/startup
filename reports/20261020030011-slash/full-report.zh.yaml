      - number: '7.4'
        title: 依赖、财务暴露与论点破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              核心功能依赖 Column、Visa 和数字资产基础设施提供商，因此即使 Slash 自身没有失效，发起行政策变化或服务商中断也可能限制产品。公司披露完成 $100 million Series
              C，第三方市场数据报告累计融资 $160
              million，但融资额不等于可用现金，本身也没有说明烧钱、储备、欺诈损失或合作方抵押要求。投资监测应聚焦可衡量的触发条件：失去或被重大限制的发起行关系；超出有记录服务水平的客户资金反复冻结；重大数字资产或支付控制事故；无法提供当前独立控制报告；或在按客户数和交易量调整后投诉增加。投资前应取得合作方合同及终止权、经核对的事故和投诉队列、经审计财务、现金和烧钱数据、保险安排、监管意见及经过测试的迁移方案。即使收入总量继续增长，也应在无法提供这些材料时限制投资确信度。
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
