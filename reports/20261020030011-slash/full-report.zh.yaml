      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是：Slash 已把早期利基产品转化为更广泛的财务运营平台，并实现异常强劲的披露规模。公司称年化收入超过 $250 million，年化支付额超过 $30 billion，服务超过 5,000
              家企业。管理层称大部分新增资金将用于分销和营销，而不是只投入 Twin，这为扩大采用提供了合理路径。反论点是：这些数字仍来自公司，风险投资定价异常强劲，而 Slash 此前在垂直市场受到冲击后收入下跌
              80%。用户评测总体积极，但指出客服、交易限额和会计集成方面的问题；Column 的发起行结构也造成重大合作方依赖。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 情景与可比框架
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是情景锚点，而不是精确的内在估值区间。$370 million 的 Series B 和 $1.4 billion 的 Series C 相隔 11 个月，最新估值约为公司披露年化收入的
              5.6x。第三方资料列出 Klarna、Coinbase、Affirm、SoFi 和 Nubank 历史 IPO 市销率约 5x 至 41x，但这些公司的地域、监管、成熟度、收入质量和市场周期不同，不能直接作为
              Slash 的基准。因此，基准情景只应把 4 月融资估值作为谈判参考。乐观情景需要核实持久的毛利率和留存；悲观情景的保护则要求承认此前估值、合作方、客户和倍数压缩风险。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度与尽调触发条件
        blocks:
          - type: paragraph
            body: >-
              Slash 已完成后期融资，披露支付规模可观，产品覆盖银行卡、银行服务、全球支付、稳定币和 AI
              工作流，但公开证据不足以判断退出路径或目标回报。退出准备度取决于证明披露的年化收入能转化为持久毛利和现金流，客户及垂直行业集中度受到控制，以及发起行和数字资产依赖能够经受监管或交易对手冲击。             
              投资前应取得经审计或董事会审阅的财务、客户队列留存、收入构成、完全摊薄股权结构表、优先股堆叠和当前合规地图。论点破坏触发条件包括收入大幅重置、失去 Column
              或同等银行覆盖、留存疲弱、稳定币合规未解决，或入场价格无法在保守退出倍数下支持所需回报。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 在收入质量、完全摊薄持股、下行保护和目标回报计算得到核实前，不要把快速披露增长直接转化为买入决定。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV014
