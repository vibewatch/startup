        blocks:
          - type: paragraph
            body: >-
              现有证据衡量的是 Slash，而不是可服务市场。公司披露称拥有超过 5,000 家企业、超过 $30 billion 的年化支付额，并在九个月内达到超过 $1 billion
              的年化稳定币支付额。这些数字能说明处理吞吐量和采用情况，但没有一个数字提供计算 TAM、SAM 或 SOM 所需的合格企业总量、可服务支出、费率、地域分母或采用曲线。另一份评测称有超过 10,000
