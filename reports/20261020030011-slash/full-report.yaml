chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Slash Financial, Inc. is a San Francisco-based financial technology company serving modern and
              digital-first businesses. It is not itself an FDIC-insured bank: banking services and the Slash Platinum
              charge card are provided through Column N.A., while other products rely on additional partners. The
              platform brings business checking, corporate cards, expense controls, treasury, global payments,
              stablecoin support, and the Twin financial agent into one interface. That breadth makes Slash closer to a
              software-led financial operating system than a single card product, but also means the operating model
              depends on regulated and technical counterparties. Public sources consistently place headquarters in San
              Francisco; one independent profile also lists a New York office. The strongest founding evidence says
              2021, although third-party profiles separately report 2019 and 2020, so incorporation and operating-start
              dates should be reconciled before relying on company-age comparisons.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO010
              - CO011
              - CO012
              - CO013
              - CO015
      - number: '1.2'
        title: Financing and operating scale
        blocks:
          - type: paragraph
            body: >-
              The April 16, 2026 Series C raised $100 million at a reported $1.4 billion valuation, led by Ribbit
              Capital and co-led by Khosla Ventures and Goodwater Capital. Slash says cumulative capital raised is $160
              million, following a $41 million Series B in May 2025 and $19 million across its 2023 Seed and Series A
              financing. These figures describe financing, not cash currently available. Operating disclosures are
              similarly strong but company-issued: Slash says it surpassed $250 million in annualized revenue during
              2025, processes more than $30 billion in annualized payment volume, and exceeded $1 billion in annualized
              stablecoin payment volume within nine months of launch. Annualized revenue is not ARR, and no audited
              revenue, gross margin, burn, cash, or profitability bridge was found in the assigned evidence. An August
              2026 independent profile estimates roughly 70 employees, but no primary headcount disclosure corroborates
              that number.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Public materials identify Victor Cardenas as co-founder and chief executive officer and Kevin Bai as
              co-founder and chief technology officer. Independent profiles say the pair started Slash at age 19 after
              leaving Stanford and the University of Waterloo, respectively, and that the company pivoted from
              sneaker-reseller banking toward broader vertical banking. That history supports founder-market learning
              and rapid product iteration, while also concentrating the visible strategy and technical narrative in two
              people. The assigned sources do not provide a complete current executive roster, board membership, board
              observer rights, ownership, voting control, succession plan, or a record of material leadership
              departures. Investors therefore need the post-Series C cap table and governance documents before assessing
              founder control, investor protections, or institutional operating depth.
            claimRefs:
              - CO004
              - CO007
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
      - number: '1.4'
        title: Milestones and diligence signals
        blocks:
          - type: paragraph
            body: >-
              Slash's disclosed trajectory runs from founding and early vertical experimentation through the 2023 and
              2025 financings to a 2026 unicorn round and a broader AI-enabled product suite. The timeline should be
              read as a source map rather than a fully audited chronology because even basic identity records disagree
              on the founding year. Scale disclosures also need denominator discipline: the current company page says
              more than 10,000 businesses, while a syndicated version of the April financing release says more than
              5,000. A separate review site reports generally positive user sentiment but also early support-access
              problems, small transaction limits, and demand for deeper accounting integrations. These are useful
              adverse signals, not evidence of their prevalence. The next diligence step is to reconcile customer
              definitions and dates, then test service quality and concentration using account-level cohorts rather than
              marketing totals.
            claimRefs:
