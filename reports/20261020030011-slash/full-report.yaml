  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Slash sits across business checking, corporate cards, expense management, treasury, global payments,
              stablecoin support, and finance automation. That breadth makes a single category label misleading: the
              relevant market is the bundle of financial workflows a digital-first business might otherwise assemble
              from a bank, card issuer, spend platform, payment provider, accounting stack, and internal operations. The
              boundary must also exclude bank balance-sheet activity that Slash does not perform itself. Slash is a
              fintech rather than an FDIC-insured bank, Column provides banking services, and separate third parties
              support digital-asset services. Status-quo substitutes therefore include traditional banking plus
              spreadsheets and manual approvals, while adjacent substitutes include standalone spend management, AP/AR,
              embedded-finance infrastructure, and direct integrations assembled by an internal team.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The available evidence measures Slash, not the addressable market. Company-issued materials report more
              than 5,000 businesses, more than $30 billion of annualized payment volume, and more than $1 billion of
              annualized stablecoin payment volume reached within nine months. Those figures demonstrate throughput and
              adoption, but none supplies the eligible-business population, addressable spend, take rate, geographic
              denominator, or adoption curve required to calculate TAM, SAM, or SOM. A separate review says more than
              10,000 businesses trust the platform, which conflicts with the 5,000-plus customer figure and may use a
              different definition. The correct valuation posture is therefore to treat all operating figures as
              company-scale lenses, not market size, until management provides reconciled cohorts and a bottom-up model.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Slash's clearest target is the digital-first business that moves money frequently and values one operating
              surface across banking, cards, payments, and automation. Public segment lists include affiliate marketing,
              e-commerce, healthcare, home services, crypto, agencies, and startups. The likely economic buyer is a
              founder, CFO, controller, or finance-operations lead; employees use cards and payment workflows, while
              developers may use APIs and agent integrations. This buyer mapping is inferred from product design rather
              than disclosed sales data. International availability in more than 130 countries and stablecoin support
              across more than nine networks enlarge the adjacency, but neither metric establishes serviceable demand or
              regulatory availability in every jurisdiction.
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption can be pulled by a free entry tier, a paid bundle, yield and cashback economics, virtual-card
              controls, faster domestic and international payments, accounting integrations, and automation through APIs
              or AI workflows. B2B Reviews says its synthesis of 807 reviews was positive overall, indicating that
              convenience and support can matter alongside price. The same review also identified complaints about early
              support access, transaction limits, and accounting-integration depth. More fundamentally, buyers must
              trust partner-bank and third-party digital-asset arrangements because Slash does not own the regulated
              bank balance sheet. These constraints affect conversion, retention, and gross-margin durability, so the
              $30 billion flow figure should not be valued like recurring software revenue without pricing, take-rate,
              retention, and contribution-margin evidence.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM016
              - CM006
