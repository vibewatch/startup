  - id: FI001
    title: Revenue model bridge and disclosure boundary
    type: flow
    summary: >-
      Customer activity can generate card, subscription, and transaction economics, but public evidence does not
      quantify the deductions required to bridge gross activity to recognized revenue or gross profit.
    data:
      nodes:
        - id: customer-activity
          label: Customer activity
          detail: Card spend, account usage, transfers, balances, stablecoin payments, and financing demand.
        - id: card-interchange
          label: Card interchange
          detail: Forbes identifies interchange as Slash's primary revenue source.
        - id: subscription
          label: Pro subscription
          detail: Public list price is $25 per month.
        - id: transaction-fees
          label: Transaction fees
          detail: Selected faster payments and foreign card activity carry public list fees.
        - id: partner-products
          label: Treasury, stablecoin, and working capital
          detail: Product activity exists, but Slash's direct economics are not disclosed.
        - id: recognized-revenue
          label: Recognized revenue
          detail: No audited revenue bridge or stream mix is public in the retained evidence.
        - id: gross-profit
          label: Gross profit
          detail: Rewards, rail, partner, fraud, loss, and support costs are not quantified.
      edges:
        - from: customer-activity
          to: card-interchange
          label: card spend
        - from: customer-activity
          to: subscription
          label: paid plan
        - from: customer-activity
          to: transaction-fees
          label: payment usage
        - from: customer-activity
          to: partner-products
          label: balances and financing
        - from: card-interchange
          to: recognized-revenue
          label: net economics undisclosed
        - from: subscription
          to: recognized-revenue
          label: realized mix undisclosed
        - from: transaction-fees
          to: recognized-revenue
          label: rail costs undisclosed
        - from: partner-products
          to: recognized-revenue
          label: fee or spread undisclosed
        - from: recognized-revenue
          to: gross-profit
          label: cost bridge unavailable
    approximationNotes: >-
