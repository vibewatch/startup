      - number: '3.2'
        title: Capability and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              Slash's clearest differentiation is the combination of banking, charge cards, treasury, payments,
              stablecoin support, and an action-taking AI layer in one interface. The assigned evidence verifies a $0
              Free plan and a $25-per-month Pro plan, but it does not provide current, like-for-like pricing for the
              named alternatives. The card is a daily-settled charge product rather than revolving credit, and
              partner-provided financing should not be confused with a Slash-originated lending balance sheet. The
              comparison matrix consequently marks unsupported competitor cells as unknown instead of converting broad
              category descriptions into unverified feature parity.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP016
      - number: '3.3'
        title: Distribution, switching, and control
        blocks:
          - type: paragraph
            body: >-
              Workflow breadth can create practical switching costs when a customer adopts multi-entity dashboards,
              accounting integrations, virtual cards, payment approvals, and treasury in the same operating layer. Yet
              those costs are not equivalent to proprietary financial infrastructure. Column provides the banking
              services, Whop provides merchant onboarding, payment execution, and settlement for the newly launched
              acceptance product, and financing comes from partners. The same API and SDK surfaces that help Slash
              expand also leave an internal-build path open for sophisticated customers. Distribution power and partner
              continuity therefore remain as important as feature breadth.
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP010
              - CP012
              - CP013
      - number: '3.4'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Slash has resources to keep expanding: Tracxn and the company's syndicated release report $160 million of
              total funding, while the release claims more than 5,000 businesses and over $30 billion in annualized
              payment volume. September 2026 card acceptance widens the addressable workflow and increases overlap with
              processors and invoicing products. The adverse evidence is more modest but relevant: a review synthesis
              covering 807 reviews found some complaints about early support access, transaction limits, and
              insufficiently deep accounting integrations. These signals do not prove displacement risk, but they
              identify service quality and integration depth as attack surfaces. Durable moat still requires private
              cohort, multi-product adoption, realized pricing, loss, and partner-continuity evidence.
            claimRefs:
              - CP003
              - CP008
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the current wedge
            body: >-
              Slash combines more of the finance workflow than the narrow peer lists imply, including banking, cards,
              payments, treasury, stablecoins, and agentic actions.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
          - type: callout
            title: Integration is not infrastructure ownership
            body: >-
              Banking, payment acceptance, and financing depend on external institutions, leaving continuity, economics,
              and control partly outside Slash.
            calloutType: risk
            claimRefs:
              - CP002
              - CP009
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              The clearest public revenue mechanism is card interchange: Forbes reported that Slash makes most of its
              money from interchange associated with merchant acceptance of credit and debit cards. That creates a
              volume-linked model whose revenue quality depends on card spend, network economics, rewards expense, fraud
              and loss performance, and the durability of high-spend customer activity. A second, smaller disclosed
              layer is software and payments pricing. B2B Reviews lists a free plan and a $25-per-month Pro plan, with
              per-transaction charges for selected faster payments on Free and those charges included on Pro. Stablecoin
              payments, treasury, and partner-provided working capital expand the product surface, but the retained
              evidence does not disclose Slash's spread, fee, referral share, or gross profit from those products.
              Accordingly, the model is diversified by product but not yet transparent by revenue mix or accounting
              treatment.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI015
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI015
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
              - CI015
              - CI016
      - number: '4.2'
        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction indicators are annualized rather than audited period metrics. Slash's April
              2026 company release said it surpassed $250 million in annualized revenue during 2025 and was powering
              more than $30 billion in annualized payment volume for more than 5,000 businesses. Earlier Forbes
              reporting described about 2,500 customers and $6 billion in annualized transactions, while a later review
              said more than 10,000 businesses trusted the platform. These observations suggest rapid expansion, but
              they cannot be assembled into a clean cohort series because dates, definitions, and denominators differ.
              The 2023 pivot away from sneaker resellers toward vertical banking shows management could redirect
              distribution after a demand shock, but public evidence still omits CAC, sales cycle, channel mix, payback,
              retention, and customer concentration. Payment volume and customer counts are therefore useful GTM
              proxies, not substitutes for revenue retention or sales efficiency.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI012
              - CI014
      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The retained sources do not provide a defensible gross-margin bridge. Interchange revenue must absorb
              cashback, network and issuing costs, fraud and credit losses, support, compliance, and partner-bank
              economics, while payments and stablecoin products add third-party rail and liquidity dependencies. Slash
              is a fintech rather than an insured bank, and banking services are supplied by Column N.A.;
              working-capital products are also described as partner-provided. Those structures may reduce balance-sheet
              intensity, but they also mean that headline payment volume does not reveal net revenue or contribution
              margin. The review evidence adds limited adverse operating signal: some users reported early support
              difficulty, low transaction limits, and shallow accounting integrations. Without gross margin, loss rates,
              rewards expense, partner take rates, or retention cohorts, neither revenue durability nor operating
              leverage can be underwritten from public data.
            claimRefs:
              - CI001
              - CI011
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Tracxn and the April 2026 company release both report $160 million of cumulative capital raised, including
              a $100 million Series C at a $1.4 billion post-money valuation. That financing is a meaningful
              capital-access signal, but funding raised is not cash on hand and does not establish burn, runway, debt,
              restricted cash, or future project-finance obligations. The retained evidence offers no current balance
              sheet, cash-flow statement, board-approved forecast, or reconciled use of proceeds. The underwriting
              verdict is therefore mixed: volume-linked interchange and a widening monetization surface can support
              attractive revenue growth, yet revenue recognition, gross margin, customer concentration, and capital
              consumption remain private. The next diligence step is not another top-line estimate; it is a monthly
              financial package reconciling recognized revenue to annualized run rate, payment volume, rewards and
              network costs, losses, operating cash flow, and post-Series C liquidity.
            claimRefs:
              - CI004
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is visible, but only through annualized operating claims
            body: >-
              The company reports $250 million in 2025 annualized revenue and more than $30 billion in annualized
              payment volume, indicating substantial throughput without establishing audited revenue quality.
            calloutType: strength
            claimRefs:
              - CI004
              - CI005
          - type: callout
            title: Funding is not runway
            body: >-
              Reported cumulative funding of $160 million improves access to capital, but no public cash balance, burn
              rate, debt schedule, or downside runway supports a capital-adequacy conclusion.
            calloutType: risk
            claimRefs:
              - CI012
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and maturity
        blocks:
          - type: paragraph
            body: >-
              Slash is presented as a financial operations platform rather than a standalone bank. Independent coverage
              and reviews describe a suite that combines business accounts, corporate cards, treasury, working-capital
              access, stablecoin and global payment products, invoicing, bill pay, analytics, and automation interfaces.
              The regulated account and card layer depends on Column N.A.; the company release separately states that
              Column does not accept cryptocurrency and that digital-asset services are delivered by Slash with
              third-party providers. This division matters operationally: the customer experience is integrated, but the
              underlying delivery and control responsibilities are distributed. Product breadth is evidenced more
              strongly than component maturity. Twin is described in the April 2026 release as able to execute payments,
              generate invoices, and create cards, while independent technical benchmarks or production reliability
              measures are absent.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE008
              - CE011
      - number: '5.2'
        title: Workflow differentiation and user value
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiation is workflow specialization rather than a uniquely verified banking primitive.
              Coverage of the post-pivot strategy says Slash targets distinct verticals and configures financial
              workflows around how those operators move money. The most concrete example is performance marketing, where
              separate accounts can be created for each end client so prepayments and campaign spend remain segmented.
              Third-party profiles also report virtual accounts, multi-entity management, analytics, spend controls, and
              APIs for automation. Review evidence is directionally favorable: B2B Reviews says it analyzed 807 reviews
              and found overall positive sentiment, while also noting reports of support reachability problems,
              transaction limits, and a need for deeper accounting integrations. These signals support utility, but they
              do not establish retention, error rates, or measurable productivity gains.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
              - CE010
              - CE011
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE009
              - CE010
      - number: '5.3'
        title: Evidence-bounded architecture and dependencies
        blocks:
          - type: paragraph
            body: >-
              Public material supports a dependency map, not a verified system architecture. The visible stack begins
              with dashboard, mobile, Slack or text interaction, and APIs; it then adds workflow and agent functions
              over account, card, treasury, payment, and reimbursement data. Column supplies the partner-bank foundation
              for banking services and card issuance, while digital-asset services rely on separate third parties. This
              creates several diligence boundaries: partner availability, data synchronization, authorization
              consistency, and incident ownership can each affect the integrated customer experience. Slash states that
              Twin uses a secure agent layer to protect sensitive account and card details, but the assigned evidence
              contains no control design, model-risk testing, approval-policy detail, recovery objectives, or
              independent assurance report. The map below therefore shows only publicly described components and
              relationships; it should not be read as a network or data-flow diagram.
            claimRefs:
