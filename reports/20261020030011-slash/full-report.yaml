  - id: TV003
    title: Bull, base, and bear scenario frame
    columns:
      - Case
      - Assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Reported scale is verified; margins, retention, and diversification are durable; distribution remains
          efficient.
        - >-
          Value above the $1.4B financing mark is supportable only if a conservative exit multiple clears the target
          return.
        - Multiple compression, regulation, partner concentration, and execution across new products.
        - Not supported by public evidence until private operating data is verified.
      - - Base
        - $250M annualized revenue is substantially accurate, but margins and retention remain unverified.
        - Treat $1.4B and the derived 5.6x revenue reference as negotiation anchors, not fair value.
        - Revenue quality, dilution, preferences, customer mix, and sponsor-bank dependency.
        - Most consistent with current evidence, but still insufficient for a buy decision.
      - - Bear
        - Revenue quality disappoints, concentration emerges, or a partner or regulatory disruption slows growth.
        - >-
          Require pricing below the latest mark; the $370M Series B is a historical downside reference, not an
          appraisal.
        - A repeat vertical shock, weak retention, capital needs, and down-round preference overhang.
        - Plausible because Slash has previously reported an 80% revenue shock.
    notes: >-
      Scenario values are financing references rather than appraised ranges; probability signals are qualitative because
      assigned public evidence lacks audited forecasts, margins, retention, cash, and a fully diluted cap table.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV009
      - CV010
      - CV014
      - CV015
      - CV016
