        title: Exhibits
        blocks:
          - type: callout
            title: Operating scale is not market size
            body: >-
              Slash's customer, payment-volume, geographic, and network figures cannot be converted into TAM, SAM, SOM,
              revenue, or market share without denominators, take rates, and cohort definitions.
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and category boundary
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is broader than a narrow list of neobanks. Independent datasets themselves disagree
              on the peer set: Tracxn names Meow, ZiFi, and SALID BANK, while a separate industry profile lists Ramp,
              Brex, Rho, Jeeves, Payhawk, BILL, and Unit. That divergence reflects Slash's multi-product scope, not
              proof that one list is wrong. Buyers can choose a spend-management suite, an AP/AR incumbent,
              embedded-finance infrastructure, a traditional bank plus point tools, or an internal build assembled on
              APIs. Slash therefore has to win both against integrated platforms and against a modular status quo whose
              components may already be embedded in customer workflows.
            claimRefs:
              - CP006
              - CP007
              - CP011
              - CP013
