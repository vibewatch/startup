  evidenceGaps:
    - type: missing-source
      severity: material
      topic: technical-validation
      missingEvidence: >-
        Independent uptime history, API adoption or activity, security certifications, penetration
        testing, incident records, recovery objectives, and production architecture documentation.
      whyItMatters: >-
        Twin and the broader product initiate sensitive financial actions across partner systems,
        so product breadth alone cannot establish reliability, control effectiveness, or safe
        delegation.
      diligencePath: >-
        Request the architecture and vendor map, SOC 2 and PCI responsibility matrix, status and
        incident history, API usage and error metrics, disaster-recovery tests, penetration-test
        summary, and Twin authorization and rollback test results.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE001, TE003]
    - type: private-evidence-only
      severity: material
      topic: agent-controls
      missingEvidence: >-
        Twin approval-policy configuration, model evaluation results, action-error rates, human
        override design, immutable audit trail, and customer-remediation procedures.
      whyItMatters: >-
        An agent that can create cards and move money creates loss, fraud, and compliance exposure
        if authority boundaries or recovery paths fail.
      diligencePath: >-
        Run a product-control review with engineering, compliance, and selected customers, then
        test adversarial prompts, stale context, duplicate instructions, failed partner calls, and
        reversal workflows in a controlled environment.
      relatedQuestionRefs: [QE006, QE007]
      relatedTableRefs: [TE003]
