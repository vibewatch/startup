  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: identity
      missingEvidence: >-
        An incorporation record and management-confirmed chronology reconciling
        the 2019, 2020, and 2021 founding dates.
      whyItMatters: >-
        Company age affects milestone timing, growth-rate comparisons, and founder narratives.
      diligencePath: >-
        Obtain the certificate of incorporation and a dated operating-history schedule from management.
    - type: conflicting-data
      severity: material
      topic: customer-count
      missingEvidence: >-
        A dated customer definition and reconciliation of more than 5,000 versus
        more than 10,000 businesses served.
      whyItMatters: >-
        Customer scale and revenue concentration cannot be evaluated without a stable denominator.
      diligencePath: >-
        Request monthly active, paying, onboarded, and cumulative customer cohorts by segment.
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Current executive roster, board and observer composition, voting control,
        succession plan, and material leadership-change history.
      whyItMatters: >-
        Visible founder concentration cannot be translated into governance or key-person risk without these records.
      diligencePath: >-
        Review board minutes, charter documents, employment arrangements, and the post-Series C governance package.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002]
    - type: private-evidence-only
      severity: material
      topic: ownership
      missingEvidence: >-
        Post-Series C fully diluted cap table, liquidation preferences, board rights,
        debt or credit facilities, and any secondary transactions.
      whyItMatters: >-
        Funding totals do not reveal ownership, investor control, dilution, or cash available.
      diligencePath: >-
        Obtain the closing set, capitalization ledger, side letters, debt schedule, and secondary-sale history.
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: financial-profile
      missingEvidence: >-
        Audited or board-reviewed revenue, ARR reconciliation, gross margin, burn,
        cash balance, and profitability bridge.
      whyItMatters: >-
        Company-issued annualized revenue cannot establish recurring quality, margin, or runway.
      diligencePath: >-
        Reconcile monthly general-ledger revenue to bank statements, cohorts, and board reporting.
