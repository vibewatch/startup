    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: >-
        A source-backed bottom-up TAM, SAM, and SOM model with eligible-business counts, addressable
        spend, take rates, adoption assumptions, geography, and a consistent base year.
      whyItMatters: >-
        Company throughput cannot establish market size, penetration, or remaining growth headroom.
      diligencePath: >-
        Request management's market model and rebuild it against government business counts,
        payment-spend data, segment eligibility rules, pricing, and observed cohort conversion.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: customers
      missingEvidence: >-
        A reconciled definition and dated bridge between more than 5,000 served businesses and more
        than 10,000 businesses said to trust the platform.
      whyItMatters: >-
        Different account, entity, active-customer, or cumulative-registration definitions would
        materially change penetration and customer-economics analysis.
      diligencePath: >-
        Obtain monthly active logos, legal entities, funded accounts, transacting accounts, and
        cumulative registrations by segment with a bridge to every external statement.
      relatedQuestionRefs: [QM006]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-map
      missingEvidence: >-
        Sales-cycle, budget-owner, pipeline-conversion, retention, take-rate, and contribution-margin
        data by segment and product.
      whyItMatters: >-
        Product availability and transaction volume do not establish willingness to pay, durable
        software adoption, or attractive unit economics.
      diligencePath: >-
        Review CRM opportunity data, pricing realization, cohort retention, product attach, payment
        take rate, rewards expense, partner fees, fraud losses, and support cost by segment.
      relatedQuestionRefs: [QM003, QM004, QM008]
      relatedTableRefs: [TM003]
