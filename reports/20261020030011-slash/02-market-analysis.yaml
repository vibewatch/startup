    claimRefs: [CM004, CM009, CM010, CM011, CM012, CM013, CM014]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Ordered evidence layers distinguish the product boundary and target profile from company-scale
      operating metrics; the layout does not represent a conversion funnel or a calculated market.
    data:
      items:
        - label: Addressable workflow bundle
          value: Business banking, cards, treasury, payments, and automation
          note: Market boundary, not a dollar TAM
          tone: neutral
          claimRefs: [CM001]
        - label: Target-company profile
          value: Digital-first, lean, high-velocity businesses
          note: Segment description, not a counted population
          tone: neutral
          claimRefs: [CM004]
        - label: Stated customer reach
          value: More than 5,000 businesses
          note: Company-issued figure; a review separately says more than 10,000
          tone: risk
          claimRefs: [CM005, CM007]
        - label: Payment-flow scale
          value: More than $30B annualized payment volume
          note: Platform flow, not revenue or market size
          tone: neutral
          claimRefs: [CM006]
        - label: Stablecoin wedge
          value: More than $1B annualized volume within nine months
          note: Product throughput, not recurring revenue
          tone: neutral
          claimRefs: [CM008]
        - label: Reach adjacency
          value: 130+ countries and 9+ networks
          note: Availability indicators without a demand denominator
          tone: neutral
          claimRefs: [CM009, CM010]
    approximationNotes: >-
      Mixed units are intentionally not summed, divided, or treated as nested populations. Values
      reproduce source terminology and do not establish TAM, SAM, SOM, conversion, or market share.
    claimRefs: [CM001, CM004, CM005, CM006, CM007, CM008, CM009, CM010, CM015]
callouts:
  - calloutType: risk
    title: Operating scale is not market size
    body: >-
      Slash's customer, payment-volume, geographic, and network figures cannot be converted into
      TAM, SAM, SOM, revenue, or market share without denominators, take rates, and cohort definitions.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM015]
