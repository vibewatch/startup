    whyItMatters: >-
      Product breadth does not demonstrate durable revenue or successful land-and-expand behavior without cohort
      evidence.
    diligencePath: >-
      Review board-approved cohort schedules and reproduce NRR and GRR from customer-level revenue and account-status
      exports.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-1, top-5, and top-10 customer shares of revenue, deposits, payment volume, card spend, and cashback expense,
