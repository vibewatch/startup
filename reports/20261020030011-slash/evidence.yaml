evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: identity
    missingEvidence: An incorporation record and management-confirmed chronology reconciling the 2019, 2020, and 2021 founding dates.
    whyItMatters: Company age affects milestone timing, growth-rate comparisons, and founder narratives.
    diligencePath: Obtain the certificate of incorporation and a dated operating-history schedule from management.
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: A dated customer definition and reconciliation of more than 5,000 versus more than 10,000 businesses served.
    whyItMatters: Customer scale and revenue concentration cannot be evaluated without a stable denominator.
    diligencePath: Request monthly active, paying, onboarded, and cumulative customer cohorts by segment.
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, board and observer composition, voting control, succession plan, and material
      leadership-change history.
    whyItMatters: Visible founder concentration cannot be translated into governance or key-person risk without these records.
    diligencePath: Review board minutes, charter documents, employment arrangements, and the post-Series C governance package.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: >-
      Post-Series C fully diluted cap table, liquidation preferences, board rights, debt or credit facilities, and any
      secondary transactions.
    whyItMatters: Funding totals do not reveal ownership, investor control, dilution, or cash available.
    diligencePath: Obtain the closing set, capitalization ledger, side letters, debt schedule, and secondary-sale history.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-profile
    missingEvidence: Audited or board-reviewed revenue, ARR reconciliation, gross margin, burn, cash balance, and profitability bridge.
    whyItMatters: Company-issued annualized revenue cannot establish recurring quality, margin, or runway.
    diligencePath: Reconcile monthly general-ledger revenue to bank statements, cohorts, and board reporting.
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A source-backed bottom-up TAM, SAM, and SOM model with eligible-business counts, addressable spend, take rates,
      adoption assumptions, geography, and a consistent base year.
    whyItMatters: Company throughput cannot establish market size, penetration, or remaining growth headroom.
    diligencePath: >-
      Request management's market model and rebuild it against government business counts, payment-spend data, segment
      eligibility rules, pricing, and observed cohort conversion.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: customers
    missingEvidence: >-
      A reconciled definition and dated bridge between more than 5,000 served businesses and more than 10,000 businesses
      said to trust the platform.
    whyItMatters: >-
      Different account, entity, active-customer, or cumulative-registration definitions would materially change
      penetration and customer-economics analysis.
    diligencePath: >-
      Obtain monthly active logos, legal entities, funded accounts, transacting accounts, and cumulative registrations
      by segment with a bridge to every external statement.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-map
    missingEvidence: >-
      Sales-cycle, budget-owner, pipeline-conversion, retention, take-rate, and contribution-margin data by segment and
      product.
    whyItMatters: >-
      Product availability and transaction volume do not establish willingness to pay, durable software adoption, or
      attractive unit economics.
    diligencePath: >-
      Review CRM opportunity data, pricing realization, cohort retention, product attach, payment take rate, rewards
      expense, partner fees, fraud losses, and support cost by segment.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Current comparable quotes, realized fees, discounts, interchange economics, contract terms, and implementation
      costs for Slash and named alternatives.
    whyItMatters: >-
      List prices alone cannot establish relative total cost, pricing power, or the durability of cashback-led
      acquisition.
    diligencePath: >-
      Run a matched request-for-quote using the same entity count, transaction mix, payment rails, card volume, treasury
      balance, and support requirements.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Customer cohorts, product-attach rates, multi-homing, win/loss data, retention by product, partner economics, and
      migration histories.
    whyItMatters: >-
      Product breadth and funding do not establish durable switching costs or prove that customers cannot reproduce the
      workflow with incumbents or APIs.
    diligencePath: >-
      Review product-level cohorts and twenty recent competitive wins and losses, then interview customers that adopted
      and later removed multiple products.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited or board-reviewed monthly revenue, gross margin, operating expense, cash flow, balance sheet, debt,
      restricted cash, burn, and runway through September 2026.
    whyItMatters: >-
      Annualized revenue and funding raised cannot establish recognized revenue quality, profitability, current
      liquidity, or downside capital adequacy.
    diligencePath: >-
      Obtain the monthly management package, bank statements, debt schedules, and board forecast; reconcile each
      reported annualized metric to recognized revenue and ending cash.
    relatedQuestionRefs:
      - QI003
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Net interchange yield, rewards expense, network and partner fees, fraud and loss rates, treasury and stablecoin
      take rates, support cost, CAC, payback, GRR, NRR, and concentration.
    whyItMatters: >-
      Payment volume and customer counts do not reveal contribution margin, retention, revenue durability, or whether
      growth is efficient.
    diligencePath: >-
      Request revenue and contribution-margin waterfalls by product and vertical, plus monthly acquisition and retention
      cohorts with customer-level concentration.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI006
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: A reconciled definition and dated monthly series for active customers, businesses, accounts, and legal entities.
    whyItMatters: >-
      Public counts of about 2,500, more than 5,000, and more than 10,000 use different labels and cannot support growth
      or revenue-per-customer calculations.
    diligencePath: >-
      Obtain management's canonical KPI dictionary and reconcile every public customer count to active transacting
      customers by month and segment.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: technical-validation
    missingEvidence: >-
      Independent uptime history, API adoption or activity, security certifications, penetration testing, incident
      records, recovery objectives, and production architecture documentation.
    whyItMatters: >-
      Twin and the broader product initiate sensitive financial actions across partner systems, so product breadth alone
      cannot establish reliability, control effectiveness, or safe delegation.
    diligencePath: >-
      Request the architecture and vendor map, SOC 2 and PCI responsibility matrix, status and incident history, API
      usage and error metrics, disaster-recovery tests, penetration-test summary, and Twin authorization and rollback
      test results.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: agent-controls
    missingEvidence: >-
      Twin approval-policy configuration, model evaluation results, action-error rates, human override design, immutable
      audit trail, and customer-remediation procedures.
    whyItMatters: >-
      An agent that can create cards and move money creates loss, fraud, and compliance exposure if authority boundaries
      or recovery paths fail.
    diligencePath: >-
      Run a product-control review with engineering, compliance, and selected customers, then test adversarial prompts,
      stale context, duplicate instructions, failed partner calls, and reversal workflows in a controlled environment.
    relatedQuestionRefs:
      - QE006
      - QE007
    relatedTableRefs:
      - TE003
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: >-
      A dated customer-count bridge defining active, served, mid-market, and total businesses and reconciling the
      5,000-plus and 10,000-plus figures.
    whyItMatters: Without consistent denominators, public counts cannot establish customer growth, activation, or segment mix.
    diligencePath: >-
      Obtain monthly active-customer schedules by segment and geography, then reconcile them to management dashboards
