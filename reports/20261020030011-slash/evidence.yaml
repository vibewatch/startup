    diligencePath: >-
      Conduct reference calls with at least three customers across distinct verticals and request account-level
      deployment documentation.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-durability
    missingEvidence: >-
      NRR, GRR, logo churn, renewals, contract length, cohort retention, and product expansion by customer vintage and
