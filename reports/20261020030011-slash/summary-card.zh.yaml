  topStrengths:
    - 据报 2025 年年化收入超过 $250M，年化支付量超过 $30B，表明业务已达到可观规模。
    - 产品覆盖账户、卡、资金管理、全球支付、稳定币支付、API 和 AI 工作流，提供了多条扩张路径。
    - 2026 年 4 月完成的 C 轮融资带来 $100M 新资金，Ribbit Capital、Khosla Ventures、Goodwater Capital 及多家老股东参与支持。
  topRisks:
    - 经审计的收入、毛利率、烧钱、现金、现金跑道、损失率和客户层面单位经济模型仍未披露。
    - 核心银行、卡网络和数字资产功能依赖合作伙伴，但业务连续性合同、监管覆盖范围和独立控制保障仍无法取得。
    - 公开客户数彼此冲突，具名生产环境客户、留存、流失、扩张和客户集中度均未经验证。
    - $1.4B 价格约为公司据报年化收入的 5.6 倍，并非经验证的 ARR 或企业价值；股权结构表和优先股堆叠也未公开。
  unresolvedGaps:
    - 经审计或董事会审阅的月度财务数据，用于勾稽确认收入、毛利率、运营费用、现金流、现金、烧钱和现金跑道。
    - 一套权威的活跃客户定义，以及按客户群组和细分市场拆分的留存、流失、扩张、集中度和具名客户证据。
    - 发起行和供应商协议、终止权、服务水平、事故批次、独立控制报告，以及经过测试的迁移计划。
    - 完全摊薄的股权结构表、期权和可转债明细、清算优先权、投资者权利，以及下行情景回报模型。
    - 按实体梳理的稳定币和支付合规地图，覆盖牌照、储备、托管、赎回、制裁控制和客户披露。
