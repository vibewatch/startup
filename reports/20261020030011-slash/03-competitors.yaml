    title: Competitor and substitute profile
    columns:
      - Alternative
      - Category
      - Public scale or funding
      - Target workflow
      - Differentiation versus Slash
      - Evidence limitation
    rows:
      - [Slash, "Integrated fintech platform", "$160M total funding reported", "Banking, cards, payments, treasury, stablecoins, AI finance actions", "Single operating surface across multiple financial workflows", "Company claims for customer and payment scale are not independently audited"]
      - ["Ramp / Brex", "Spend-management incumbents", "Late-stage private; no comparable funding figure in assigned evidence", "Corporate cards and spend management", "Established spend-management focus and distribution", "Assigned evidence provides category descriptions, not current feature or pricing verification"]
      - ["Rho / Jeeves / Payhawk", "Business banking and global spend alternatives", "Private; no comparable funding figure in assigned evidence", "Banking, cards, or multi-entity spend", "Focused alternatives for banking or global spend", "Grouped because source descriptions are brief; product parity is unknown"]
      - [BILL, "Public AP/AR incumbent", "Public company; no current market value in assigned evidence", "AP/AR automation and cards", "Deep payables and receivables workflow", "No like-for-like pricing or adoption data in assigned evidence"]
      - [Unit, "Embedded-finance infrastructure", "Private; no comparable funding figure in assigned evidence", "Infrastructure for companies building financial products", "Enables custom ownership of the customer experience", "Customer implementation burden and economics are not quantified"]
      - ["Traditional bank + point tools / internal build", "Status quo and substitute", "Not applicable", "Bank account combined with separate cards, invoicing, processing, accounting, or APIs", "Modularity, incumbent relationships, and buyer control", "No single vendor or standardized cost basis"]
    notes: >-
      Partial landscape based on assigned public sources as of 2026-10-20;
      undisclosed scale, funding, features, and pricing remain unknown rather than
      estimated.
    claimRefs: [CP006, CP007, CP011, CP013, CP014]
  - id: TP002
    title: Evidence-bounded capability matrix
    columns:
      - Buying criterion
      - Slash
      - Spend-management peers
      - AP/AR incumbent
      - Embedded-finance provider
      - Bank plus point tools
      - Diligence implication
    rows:
      - ["Business account", "Yes, through Column", "Varies; not verified here", "Unknown", "Infrastructure rather than end account", "Yes", "Confirm account ownership, sweep terms, and portability"]
      - ["Corporate cards and controls", "Charge cards, unlimited virtual cards, granular controls", "Category-level support reported", "Cards reported", "Build-dependent", "Separate provider", "Compare realized rewards, limits, disputes, and settlement terms"]
      - ["AP/AR and card acceptance", "Invoicing plus new card acceptance and SDK", "Unknown", "Core AP/AR category", "Build-dependent", "Separate providers", "Measure attach rate and processor economics"]
      - ["Treasury and yield", "Treasury offered", "Unknown", "Unknown", "Build-dependent", "Bank or broker product", "Compare net yield, liquidity, sweep coverage, and fees"]
      - ["Stablecoin and global rails", "USDC/USDT and Global USD capabilities reported", "Unknown", "Unknown", "Build-dependent", "Separate crypto and banking providers", "Verify jurisdiction, network, custody, and compliance scope"]
      - ["Agentic finance actions", "Twin can execute payments and create cards", "Unknown", "Unknown", "API-dependent", "Internal automation required", "Test authorization controls, audit logs, failure modes, and user adoption"]
    notes: >-
      Capability cells use only the assigned evidence; "unknown" means the source
      pool did not establish the feature and does not imply absence.
    claimRefs: [CP001, CP002, CP003, CP005, CP006, CP011]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Offer or alternative
      - Public price or contract model
      - Included or disclosed capabilities
      - Discount or unknown
      - Competitive implication
    rows:
      - ["Slash Free", "$0 per month", "Unlimited users; core banking and card features with transaction charges", "Same-day ACH $1, domestic wire $6, FedNow/RTP $1 reported by review", "Low entry price supports land motion but realized cost depends on activity"]
      - ["Slash Pro", "$25 per month", "Unlimited users; specified transfer fees included", "Realized enterprise or negotiated pricing is not disclosed", "Subscription can bundle frequent-payment economics"]
      - ["Slash corporate card", "Daily-settled charge card; up to 2% cashback on Pro", "Unlimited virtual cards and spend controls", "Not revolving credit; reward eligibility and economics require verification", "Rewards compete for payment volume but do not substitute for credit"]
      - ["Named competitors and modular status quo", "Unknown in assigned evidence", "Category-level capabilities only", "No current like-for-like price, discount, interchange, or contract terms", "Procure live quotes and compare total cost by transaction mix"]
    notes: >-
      Public list pricing comes from a third-party review dated 2026-06-30;
      competitor and realized enterprise pricing were not available in the assigned
      source set.
    claimRefs: [CP004, CP005, CP009, CP016]
figures:
  - id: FP001
    title: Competitive positioning by workflow breadth and buyer ownership burden
    type: quadrant
    summary: >-
      Ordinal positioning shows the strategic trade-off between an integrated
      operating layer and the implementation burden retained by the buyer.
    data:
      xAxis:
        label: "Workflow breadth (1=narrow, 5=broad)"
        min: 1
        max: 5
      yAxis:
        label: "Buyer implementation burden (1=low, 5=high)"
        min: 1
        max: 5
      points:
        - label: Slash
          x: 5
          y: 2
          detail: "Integrated banking, cards, payments, treasury, stablecoins, and AI actions; partner dependencies remain."
        - label: "Ramp / Brex"
          x: 3
          y: 2
          detail: "Spend-management category peers; assigned evidence does not verify full feature parity."
        - label: BILL
          x: 3
          y: 2
          detail: "AP/AR automation and cards incumbent."
        - label: Unit
          x: 2
          y: 5
          detail: "Embedded-finance infrastructure requires the buyer to build and operate the experience."
        - label: "Traditional bank + point tools"
          x: 3
          y: 4
          detail: "Modular substitute with fragmented interfaces and vendor management."
        - label: "Internal API build"
          x: 4
          y: 5
          detail: "Potentially broad and customizable, but with the highest implementation and control burden."
    approximationNotes: >-
      Analyst-assigned ordinal scores, not measured market data. Scores translate
      source-described product scope and required buyer integration into a 1-5
      comparison; they do not represent market share, product quality, or pricing.
    claimRefs: [CP003, CP007, CP010, CP012, CP013]
