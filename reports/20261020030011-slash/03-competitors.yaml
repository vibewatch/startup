        the durability of cashback-led acquisition.
      diligencePath: >-
        Run a matched request-for-quote using the same entity count, transaction mix,
        payment rails, card volume, treasury balance, and support requirements.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
