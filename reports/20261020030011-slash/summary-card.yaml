  topStrengths:
    - >-
      Reported 2025 annualized revenue above $250 million and annualized payment volume above $30 billion indicate
      substantial operating scale.
    - >-
      The product spans accounts, cards, treasury, global and stablecoin payments, APIs, and AI workflows, creating
      multiple expansion surfaces.
    - >-
      The April 2026 Series C brought $100 million of new capital and support from Ribbit Capital, Khosla Ventures,
      Goodwater Capital, and repeat investors.
  topRisks:
    - >-
      Audited revenue, gross margin, burn, cash, runway, loss rates, and customer-level unit economics remain
      undisclosed.
    - >-
      Core banking, card-network, and digital-asset functions depend on partners, while continuity contracts, regulatory
      coverage, and independent control assurance remain unavailable.
    - >-
      Public customer counts conflict, and named production references, retention, churn, expansion, and concentration
      are unverified.
    - >-
      The $1.4 billion price is about 5.6x company-reported annualized revenue, not verified ARR or enterprise value,
      and the cap table and preference stack are not public.
  unresolvedGaps:
    - >-
      Audited or board-reviewed monthly financials reconciling recognized revenue, gross margin, operating expense, cash
      flow, cash, burn, and runway.
    - >-
      A canonical active-customer definition plus retention, churn, expansion, concentration, and named-customer
      evidence by cohort and segment.
    - >-
      Sponsor-bank and provider agreements, termination rights, service levels, incident cohorts, independent control
      reports, and a tested migration plan.
    - >-
      A fully diluted cap table, option and convertible schedules, liquidation preferences, investor rights, and a
      downside return model.
    - >-
      An entity-by-entity stablecoin and payments compliance map covering licenses, reserves, custody, redemption,
      sanctions controls, and customer disclosures.
