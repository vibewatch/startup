artifact: financials
slug: slash
runDate: 2026-10-20
company:
  name: Slash
chapter:
  number: 4
  title: Financials
  summary: >-
    Slash's disclosed model combines interchange-led card economics with subscription and transaction
    fees, while treasury, stablecoin, and partner-lending products broaden activity without disclosing
    their direct revenue contribution. Public claims of $250 million in 2025 annualized revenue and
    $30 billion in annualized payment volume indicate scale, but audited revenue, gross margin, burn,
    cash, runway, retention, and customer-level unit economics remain unavailable.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing
    body: >-
      The clearest public revenue mechanism is card interchange: Forbes reported that Slash makes most
      of its money from interchange associated with merchant acceptance of credit and debit cards. That
      creates a volume-linked model whose revenue quality depends on card spend, network economics,
      rewards expense, fraud and loss performance, and the durability of high-spend customer activity.
      A second, smaller disclosed layer is software and payments pricing. B2B Reviews lists a free plan
      and a $25-per-month Pro plan, with per-transaction charges for selected faster payments on Free
      and those charges included on Pro. Stablecoin payments, treasury, and partner-provided working
      capital expand the product surface, but the retained evidence does not disclose Slash's spread,
      fee, referral share, or gross profit from those products. Accordingly, the model is diversified
      by product but not yet transparent by revenue mix or accounting treatment.
    claimRefs: [CI001, CI002, CI003, CI015, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-sales-efficiency
    title: Traction and sales-efficiency proxies
    body: >-
      The strongest public traction indicators are annualized rather than audited period metrics.
      Slash's April 2026 company release said it surpassed $250 million in annualized revenue during
      2025 and was powering more than $30 billion in annualized payment volume for more than 5,000
      businesses. Earlier Forbes reporting described about 2,500 customers and $6 billion in annualized
      transactions, while a later review said more than 10,000 businesses trusted the platform.
      These observations suggest rapid expansion, but they cannot be assembled into a clean cohort
      series because dates, definitions, and denominators differ. The 2023 pivot away from sneaker
      resellers toward vertical banking shows management could redirect distribution after a demand
      shock, but public evidence still omits CAC, sales cycle, channel mix, payback, retention, and
      customer concentration. Payment volume and customer counts are therefore useful GTM proxies,
      not substitutes for revenue retention or sales efficiency.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The retained sources do not provide a defensible gross-margin bridge. Interchange revenue must
      absorb cashback, network and issuing costs, fraud and credit losses, support, compliance, and
      partner-bank economics, while payments and stablecoin products add third-party rail and liquidity
      dependencies. Slash is a fintech rather than an insured bank, and banking services are supplied
      by Column N.A.; working-capital products are also described as partner-provided. Those structures
      may reduce balance-sheet intensity, but they also mean that headline payment volume does not
      reveal net revenue or contribution margin. The review evidence adds limited adverse operating
      signal: some users reported early support difficulty, low transaction limits, and shallow
      accounting integrations. Without gross margin, loss rates, rewards expense, partner take rates,
      or retention cohorts, neither revenue durability nor operating leverage can be underwritten from
      public data.
    claimRefs: [CI001, CI011, CI014, CI015, CI016]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Tracxn and the April 2026 company release both report $160 million of cumulative capital raised,
      including a $100 million Series C at a $1.4 billion post-money valuation. That financing is a
      meaningful capital-access signal, but funding raised is not cash on hand and does not establish
      burn, runway, debt, restricted cash, or future project-finance obligations. The retained evidence
      offers no current balance sheet, cash-flow statement, board-approved forecast, or reconciled use
      of proceeds. The underwriting verdict is therefore mixed: volume-linked interchange and a
      widening monetization surface can support attractive revenue growth, yet revenue recognition,
      gross margin, customer concentration, and capital consumption remain private. The next diligence
      step is not another top-line estimate; it is a monthly financial package reconciling recognized
      revenue to annualized run rate, payment volume, rewards and network costs, losses, operating cash
      flow, and post-Series C liquidity.
    claimRefs: [CI004, CI012, CI013, CI014]
