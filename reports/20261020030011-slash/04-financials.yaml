      - What remains unknown
    rows:
      - [Free plan, "$0 per month", "Base plan", "Active-account count and paid conversion"]
      - [Pro plan, "$25 per month", "Subscription", "Realized ARPA, annual discounts, and churn"]
      - [Same-day ACH on Free, "$1 per transfer", "Included on Pro", "Rail cost, transaction frequency, and net margin"]
      - [Domestic wire on Free, "$6 per transfer", "Included on Pro", "Rail cost, transaction frequency, and net margin"]
      - [Foreign card transaction, "1% with $0.40 minimum", "Applies to both listed plans", "Network cost, FX spread, geography mix, and net margin"]
    notes: >-
      B2B Reviews reproduced public list pricing; the source does not establish realized pricing,
      discounts, customer mix, revenue recognition, or gross margin.
    claimRefs: [CI002, CI003]
  - id: TI003
    title: Unit economics and capital adequacy scorecard
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Required diligence evidence
    rows:
      - [Annualized revenue, "$250 million for 2025, company-claimed", Medium, "Top-line scale but not audited recognized revenue", "Monthly GAAP revenue bridge and revenue by stream"]
      - [Annualized payment volume, "More than $30 billion in April 2026 company release", Medium, "Activity denominator for payments economics", "Volume by rail, net take rate, reversals, and concentration"]
      - [Customer or business count, "About 2,500; more than 5,000; and more than 10,000 across differently dated sources", Low, "Denominator is not reconciled", "Canonical active-customer definition and monthly cohort series"]
      - [Gross margin, null, Low, "Required to distinguish scaled volume from economic value", "Gross-to-net revenue, rewards, network, partner, fraud, and support costs"]
      - [CAC and payback, null, Low, "Determines whether vertical GTM scales efficiently", "Sales and marketing spend, new customers, channel attribution, and payback by segment"]
      - [Retention and concentration, null, Low, "Tests durability after the historical niche-market shock", "GRR, NRR, logo churn, top-10 concentration, and vertical mix"]
      - ["Cash, burn, and runway", null, Low, "Funding raised does not establish liquidity or capital adequacy", "Post-Series C cash balance, monthly burn, debt, restrictions, and downside runway"]
    notes: >-
      Null means the metric was not disclosed in the assigned retained evidence, not that the value
      is zero; annualized figures are source labels and are not converted into ARR or recognized revenue.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI012, CI014]
figures:
  - id: FI001
    title: Revenue model bridge and disclosure boundary
    type: flow
    summary: >-
      Customer activity can generate card, subscription, and transaction economics, but public evidence
      does not quantify the deductions required to bridge gross activity to recognized revenue or gross profit.
    data:
      nodes:
        - id: customer-activity
          label: Customer activity
          detail: Card spend, account usage, transfers, balances, stablecoin payments, and financing demand.
        - id: card-interchange
          label: Card interchange
          detail: Forbes identifies interchange as Slash's primary revenue source.
        - id: subscription
          label: Pro subscription
          detail: Public list price is $25 per month.
        - id: transaction-fees
          label: Transaction fees
          detail: Selected faster payments and foreign card activity carry public list fees.
        - id: partner-products
          label: Treasury, stablecoin, and working capital
          detail: Product activity exists, but Slash's direct economics are not disclosed.
        - id: recognized-revenue
          label: Recognized revenue
          detail: No audited revenue bridge or stream mix is public in the retained evidence.
        - id: gross-profit
          label: Gross profit
          detail: Rewards, rail, partner, fraud, loss, and support costs are not quantified.
      edges:
        - from: customer-activity
          to: card-interchange
          label: card spend
        - from: customer-activity
          to: subscription
          label: paid plan
        - from: customer-activity
          to: transaction-fees
          label: payment usage
        - from: customer-activity
          to: partner-products
          label: balances and financing
        - from: card-interchange
          to: recognized-revenue
          label: net economics undisclosed
        - from: subscription
          to: recognized-revenue
          label: realized mix undisclosed
        - from: transaction-fees
          to: recognized-revenue
          label: rail costs undisclosed
        - from: partner-products
          to: recognized-revenue
          label: fee or spread undisclosed
        - from: recognized-revenue
          to: gross-profit
          label: cost bridge unavailable
    approximationNotes: >-
      Conceptual mechanism only; node order and edges do not imply proportional revenue contribution,
      conversion rates, recognized revenue, or gross margin.
    claimRefs: [CI001, CI002, CI003, CI014, CI015, CI016]
callouts:
  - calloutType: strength
    title: Scale is visible, but only through annualized operating claims
    body: >-
      The company reports $250 million in 2025 annualized revenue and more than $30 billion in
      annualized payment volume, indicating substantial throughput without establishing audited revenue quality.
    claimRefs: [CI004, CI005]
  - calloutType: risk
    title: Funding is not runway
    body: >-
      Reported cumulative funding of $160 million improves access to capital, but no public cash balance,
      burn rate, debt schedule, or downside runway supports a capital-adequacy conclusion.
    claimRefs: [CI012, CI014]
