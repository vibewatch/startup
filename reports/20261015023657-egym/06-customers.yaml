artifact: customers
slug: egym
runDate: 2026-10-15
company:
  name: EGYM
chapter:
  number: 6
  title: Customers
  summary: >-
    EGYM shows a real multi-sided customer footprint: it sells fitness technology to facility
    operators and corporate wellness access to employers, with public scale markers of 7.5 million
    monthly active exercisers, 33,000 connected locations, and more than 20,000 employer partners.
    The strongest public proofs of adoption are ecosystem and partner integrations rather than
    disclosed customer cohorts, so expansion logic is visible but durability, churn, and
    concentration remain unverified.
sections:
  - id: customer-segments
    title: Customer segments are split between facility operators, employers, and end users
    body: >-
      Public evidence shows EGYM monetizing two distinct payer groups. On the technology side, the
      company describes fitness and health facilities as the direct buyers of smart equipment,
      digital services, and operator enablement, while gym members are the end users receiving
      guided workouts and training data. On the corporate-wellness side, EGYM Wellpass is sold to
      employers, with employees then using the network at participating facilities. That gives EGYM
      a blended go-to-market model: B2B facility sales, B2B employer sales, and B2C member
      engagement inside the operator network. What is still missing is revenue mix by segment,
      geography, or customer size, so the public record is better at showing breadth than at
      quantifying which customer group drives the economics.
    claimRefs: [CU001, CU002, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-footprint
    title: Adoption proof is real, but most public scale markers are ecosystem-level
    body: >-
      EGYM's strongest public adoption evidence is top-of-funnel and network scale rather than
      retention analytics. The company currently markets 7.5 million monthly active exercisers,
      33,000 connected locations, and more than 200 connected partners. A January 2026 Playlist
      announcement adds another scale marker by saying EGYM Wellpass partners with more than 20,000
      employers and tens of thousands of fitness locations worldwide. Older HTGF financing
      materials add historical context: as of July 2023, Wellpass covered more than 7,500 companies
      and nearly 2.5 million eligible employees across German-speaking markets, while around 16,000
      clubs worldwide were using EGYM products and services. Together these disclosures support real
      market reach, but they mix users, locations, employers, and clubs, so they should not be read
      as one comparable funnel or as proof of retention.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
  - id: deployment-proof
    title: Named public proofs skew toward integrations and platform-enablement rather than cohort disclosures
    body: >-
      The named proofs in the assigned source pool mostly show EGYM landing and expanding through
      ecosystem partners. Life Fitness and Spirit Fitness both announced integrations that route
      cardio data into EGYM's software environment, while Ionic's case study shows EGYM offering a
      shell app, APIs, and release guidance so partner gyms can ship their own microapps. Even the
      Netpulse evidence is thin: Star's prefetched text preserves only the case-study title, which
      is enough to show a named deployment reference but not enough to verify production scale or
      outcomes. This pattern matters because it supports a credible expansion loop—more equipment,
      more integrations, more branded digital surfaces—while still leaving a gap between partner
      announcements and independently verified production usage or commercial impact.
    claimRefs: [CU008, CU009, CU010, CU011, CU014]
    tableRefs: [TU003]
  - id: durability-risks
    title: Durability and concentration remain the biggest open diligence gaps
    body: >-
      Public materials repeatedly assert member engagement and operator-retention benefits, but the
      sources retained for this chapter do not disclose NRR, GRR, logo churn, contract length, or
      top-customer concentration. The official site says the ecosystem drives greater retention and
      higher revenue, yet that is still a marketing claim without a public cohort bridge. The
      sharpest counter-signal in the pool is adversarial rather than authoritative: Uptivo's
      comparison says live group heart-rate display and access control were not documented in the
      EGYM materials it reviewed. That does not prove the capability is absent, but it does show
      that some customer-facing workflow claims remain hard to validate from public evidence alone.
      For underwriting, the central risk is not lack of customer footprint; it is lack of disclosed
      durability and concentration metrics behind that footprint.
    claimRefs: [CU013, CU015, CU016]
callouts:
  - calloutType: strength
    title: Multi-sided distribution is visible in public evidence
    body: >-
      The chapter's best-supported thesis is breadth: EGYM reaches operators, employer buyers, and
      members through one ecosystem, with current public scale markers across users, facilities,
      employers, and connected partners.
    claimRefs: [CU002, CU003, CU004, CU005]
  - calloutType: risk
    title: Durability is still a disclosure gap, not a proven strength
    body: >-
      Public sources support adoption and expansion surfaces, but they do not publish retention,
      renewal, or concentration data that would convert those surfaces into a durable customer
      thesis.
    claimRefs: [CU013, CU015, CU016]
