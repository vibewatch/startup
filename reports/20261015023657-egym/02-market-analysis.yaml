      - ["Boutique studios and wellness operators in Playlist channels", "Studio or wellness operator", "Staff and booked consumers", "Operator", "Software, booking, and adjacent hardware / AI cross-sell", "Software and growth budget", "Desire to streamline operations and deepen member engagement"]
      - ["Employers via Wellpass", "HR or benefits leader", "Employees", "Employer", "Subsidized access to partner facilities and wellness options", "Benefits / people budget", "Attraction, retention, productivity, and health-cost pressure"]
      - ["End consumers", "Indirect via operator or employer platform", "Exercisers", "Self-pay or employer-sponsored benefit", "Personalized training and booked wellness participation", "Household wellness spend or employer benefit", "Demand for a guided and connected experience"]
    notes: "Buyer and payer roles are inferred from retained public positioning; exact contract economics and renewal owners remain undisclosed."
    claimRefs: ["CM002", "CM003", "CM010", "CM011", "CM012"]
