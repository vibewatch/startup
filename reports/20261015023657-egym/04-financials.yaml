artifact: financials
slug: egym
runDate: 2026-10-15
company:
  name: EGYM
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a real multi-line revenue engine and an announced $785 million
    Playlist-EGYM financing, but it does not verify that the transaction closed or expose the
    segment economics needed for clean underwriting. The strongest disclosed signals are
    company-reported combined scale, employer-network breadth, and engagement proxies rather than
    realized pricing, gross margin, CAC, cash conversion, or runway.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and disclosed traction
    body: >-
      The public record supports a multi-surface revenue model but not a clean revenue mix. EGYM's
      own materials describe a facility operating system built from connected equipment, software,
      and data-driven workflows, while investor HTGF described Wellpass as a subscription-based
      corporate wellness offering for employers. The January 2026 transaction announcement adds
      company-reported evidence of scale: Playlist and EGYM said they generated more than $800
      million of 2025 net revenue, served 20,000-plus employer partners, and intended to invest
      further in AI and geographic expansion. The same announcement said closing remained subject
      to regulatory approvals. This supports commercial traction but does not establish EGYM's
      standalone revenue mix or verify completed access to the announced financing.
    claimRefs: [CI002, CI003, CI004, CI006, CI015, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-cost-structure
    title: Unit-economics proxies are public; actual economics are not
    body: >-
      Public unit-economics evidence is still proxy-heavy. The cleanest external operating signals
      are engagement metrics: Athletech says Genius AI contributed to a 10% churn reduction among
      early adopters and cut onboarding for some customers from 50 minutes to 20. EGYM's own site
      separately reports more than 200 connected partners and describes an operating system that
      connects execution, intelligence, and integration. Those facts support a plausible
      software-and-data value proposition after deployment. They do not, however, disclose list
      pricing, realized pricing, discounting, contract duration, CAC, payback, renewal, or segment
      gross margin, so the investment case still depends on mechanism and outcome proxies rather
      than directly observed monetization quality.
    claimRefs: [CI005, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: capital-needs-and-underwriting-gaps
    title: Announced capital access is not verified liquidity
    body: >-
      The Playlist transaction announcement indicates potential access to substantial capital, but
      public liquidity disclosure is too thin for full underwriting. The companies announced $785
      million of new equity at a $7.5 billion combined enterprise value and said proceeds would
      fund AI investment and geographic expansion; they also stated that closing required
      regulatory approvals. Earlier partner evidence shows EGYM raised growth capital for Wellpass
      and digital-product development in 2023. Yet the retained funding-tracker capture was last
      updated in September 2024, and the assigned sources do not report current cash, debt
      maturities, burn, covenant headroom, or integration capex. A competitor comparison further
      argues that equipment-led deployment can wait for a gym's next capital cycle, making operator
      capex tolerance a material revenue-quality risk.
    claimRefs: [CI001, CI003, CI011, CI012, CI013, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - EGYM Technology ecosystem
        - Connected equipment, software, and workflow tooling delivered to fitness facilities
        - Public billing unit is not disclosed
        - Official sources position it as an operator operating system, but no standalone revenue split is public
        - Real product breadth; monetization detail remains undisclosed
        - Break out hardware, software, service, and maintenance revenue by segment
      - - EGYM Wellpass
        - Employer-paid corporate wellness access network
        - Employer partner and eligible employee participation
        - More than 20,000 employer partners and tens of thousands of fitness locations are disclosed publicly
        - Scale is public; take rate, subsidy mix, and renewal quality are not
        - Provide employer ARPU, employer contribution model, and utilization-linked cost structure
      - - Genius AI and digital engagement layer
        - AI-guided workout planning and onboarding embedded in the ecosystem
        - Member engagement and operator retention proxy
        - Public evidence shows churn and onboarding proxies, not direct pricing
        - Useful economic signal, but not direct monetization proof
        - Provide attach rate, upsell pricing, and incremental gross profit
      - - Playlist cross-sell and geography expansion
        - Announced capital intended to expand EGYM in North America and Asia and Playlist in Europe
        - Geography and channel expansion
        - January 2026 transaction announcement described the intended expansion
        - Proposed use of funds, not booked revenue or verified available cash
        - Show pipeline, conversion timing, and payback by geography
    notes: >-
      Combines official business-model statements with disclosed scale indicators; public sources do
      not break out standalone EGYM revenue mix or segment-level realization.
    claimRefs: [CI003, CI004, CI006]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Smart equipment plus software
        - Public price not disclosed
        - Unknown
        - No public list card, contract term, or discount structure in retained official pages
        - EGYM official pages
      - - Wellpass employer subscription
        - Public employer pricing not disclosed
        - Unknown
        - No public employer fee, subsidy split, or renewal pricing in retained sources
        - EGYM official pages and Playlist release
      - - Genius AI and onboarding value
        - Monetization not disclosed
        - Unknown
        - Public evidence is operational uplift (churn and onboarding), not sell price
        - Athletech News
      - - Equipment-led deployment path
        - Capex burden varies by operator estate and financing cycle
        - Not a list price; an adoption constraint
        - Competitor source argues value capture can be delayed until the next capital cycle
        - Uptivo comparison
    notes: >-
      Null or unknown values reflect missing public pricing disclosure, not zero price; the retained
      evidence base is better at mechanism and outcomes than at contract economics.
    claimRefs: [CI004, CI008, CI009, CI010, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Combined 2025 net revenue
        - More than $800 million
        - Medium
        - Company-issued disclosure indicates large combined scale but does not isolate EGYM
        - Break out standalone EGYM revenue and segment mix
      - - Profitability status
        - Strong profitability (combined 2025); profitable fiscal year expected in 2023
        - Medium
        - Company and investor statements suggest profitability, but mix periods and entities
        - Provide audited EBITDA and free cash flow by segment and post-merger entity
      - - Churn proxy
        - 10 percent churn reduction among early Genius adopters
        - Medium
        - Indicates potential retention leverage from software and AI
        - Provide cohort size, measurement window, and paid attach rate
      - - Onboarding efficiency proxy
        - 50 minutes to 20 minutes for some customers
        - Medium
        - Suggests labor leverage for operators during setup and member activation
        - Provide sample size, baseline, and whether savings persist after rollout
      - - Segment gross margin
        - null
        - Low
        - Hardware, software, and employer-network economics can have very different margin profiles
        - Disclose gross margin and service burden for Technology versus Wellpass
      - - CAC / payback / renewal economics
        - null
        - Low
        - Underwriting depends on acquisition efficiency and repeatability, not just growth
        - Disclose CAC, payback, sales cycle, NRR, and churn by product line
      - - Post-merger cash / burn / runway
        - null
        - Low
        - Announced financing is not proof of transaction close or cash available to EGYM
        - Provide closing evidence, cash balance, debt schedule, burn, runway, and integration capex
    notes: >-
      Null values mark metrics that were not publicly disclosed in the retained source pool; public
      traction is strongest on scale and engagement proxies rather than classic underwriting inputs.
    claimRefs: [CI002, CI008, CI009, CI010, CI012, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public sources show how EGYM converts facility and employer adoption into engagement outcomes,
      while leaving final pricing and margin capture only partially visible.
    data:
      nodes:
        - id: contracts
          label: Facilities and employers contract with EGYM
          summary: Technology serves fitness facilities while Wellpass is described as an employer subscription solution.
          claimRefs: [CI004, CI006, CI015]
        - id: deployment
          label: Connected equipment and software are deployed
          summary: The operating system combines connected gym equipment, software, and more than 200 connected partners.
          claimRefs: [CI005, CI006, CI007]
        - id: usage
          label: Members generate workout and engagement data
          summary: The ecosystem is designed to connect execution, intelligence, and integration into one coordinated system.
          claimRefs: [CI006, CI007]
        - id: personalization
          label: AI-guided onboarding and personalization improve usage
          summary: Public proxies point to lower onboarding time and lower churn among early Genius adopters.
          claimRefs: [CI009, CI010]
        - id: operator-outcomes
          label: Operators are promised retention and revenue gains
          summary: Official pages pitch sustainable business growth, higher revenue, and broader employer access.
          claimRefs: [CI004, CI006]
        - id: monetization
          label: Public monetization quality remains partially opaque
          summary: The retained public record still lacks list pricing, realized pricing, and segment-margin disclosure.
          claimRefs: [CI008, CI014]
      edges:
        - from: contracts
          to: deployment
          label: Contracted footprint is rolled out into clubs and employer programs
          claimRefs: [CI004, CI006, CI015]
        - from: deployment
          to: usage
          label: Connected training creates integrated workout and business-process data
          claimRefs: [CI006, CI007]
        - from: usage
          to: personalization
          label: Data supports Genius AI workflows and faster onboarding
          claimRefs: [CI009, CI010]
        - from: personalization
          to: operator-outcomes
          label: Claimed outcomes are retention, revenue, and member engagement
          claimRefs: [CI004, CI006, CI009]
        - from: operator-outcomes
          to: monetization
          label: The last step from claimed value to realized economics is not publicly disclosed
          claimRefs: [CI008, CI014]
    approximationNotes: >-
      This flow represents the publicly described commercial mechanism; it does not infer conversion
      rates, pricing, or gross profit that the retained sources do not disclose.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI014, CI015]
callouts:
  - calloutType: insight
    title: Scale is public; monetization quality is not
    body: >-
      The strongest public financial proof points are blended scale, employer-network breadth, and
      engagement proxies rather than segment-level pricing, margins, or cash conversion.
    claimRefs: [CI002, CI004, CI008, CI009]
  - calloutType: risk
    title: Announced financing does not equal available liquidity
    body: >-
      The transaction announcement describes fresh equity and intended uses, but also says closing
      remained subject to approvals; current cash, debt, burn, and integration spending therefore
      still require direct diligence.
    claimRefs: [CI001, CI003, CI013, CI016]
