company:
  name: EGYM
chapter:
  number: 1
  title: Company Overview
  summary: EGYM is now a Playlist subsidiary built around smart gym technology and the Wellpass corporate wellness network, with the 2026 merger fixing the clearest current valuation marker at a $7.5 billion combined enterprise value. Public evidence supports real global scale and recent product momentum, but standalone post-merger economics, current board composition, and a clean current headcount disclosure remain opaque.
sections:
- id: identity-and-model
  title: Identity and operating model
  body: 'EGYM presents itself as a fitness-technology company built to shift healthcare from repair to prevention, and the assigned evidence supports that identity across both current marketing and transaction disclosures. The core model has two recurring pillars: EGYM Technology, which sells connected equipment and software to fitness and health facilities, and EGYM Wellpass, which aggregates employer-sponsored access to fitness and health venues. The clearest current stage marker is the March 2026 merger close, after which EGYM became a subsidiary inside Playlist. That gives later chapters a clean identity anchor: EGYM is no longer a standalone venture-stage asset, but an operating business contributing hardware, software, and corporate wellness distribution inside a larger platform.'
  claimRefs:
  - CO001
  - CO002
  - CO004
  - CO005
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Leadership and governance
  body: Leadership continuity runs through Philipp Roesch-Schlanderer, who remains the most visible operator in the assigned evidence and bridges old EGYM and the new Playlist parent structure. The merger materials also elevate Playlist CEO Fritz Lanman into the same founder-led control story, with Roesch-Schlanderer joining Monti Saroya as co-chairman at the parent. That combination suggests strategy is concentrated around a small set of operator-sponsors rather than a broadly disclosed independent board. Assigned public materials name the founder and sponsor roles clearly, but they stop short of a full board roster, a current CFO disclosure, or a refreshed post-merger governance page for EGYM, so governance completeness remains an open diligence item.
  claimRefs:
  - CO004
  - CO014
  tableRefs:
  - TO002
- id: funding-and-scale
  title: Funding, valuation, and scale markers
  body: 'The cleanest current capital marker is the merger close: Playlist said the transaction brought $785 million of new equity and valued the combined enterprise at $7.5 billion. For historical context, HTGF said EGYM raised up to €207 million in Series F financing in July 2023, with €107 million funded immediately and another €100 million available for future investments. Public scale markers are meaningful but mixed in vintage and denominator. The merger disclosures referenced more than 20,000 employer partners and tens of thousands of locations, while EGYM’s current ecosystem page advertises 7.5 million monthly active exercisers, 33,000 locations, and 200 connected partners. What remains missing is a current standalone EGYM revenue run rate, gross margin, cash profile, and clean post-merger employee count.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO013
  tableRefs:
  - TO003
- id: milestones-and-caution-flags
  title: Milestones and caution flags
  body: The milestone record is strong enough to show a real company arc rather than a static profile. EGYM was founded in 2010, had HTGF on the cap table by 2011, expanded Wellpass and acquired Gymlib in 2022, then raised a large Series F round in 2023. In March 2026, independent coverage highlighted new Smart Strength Series 3 and Fitness Hub seca launches, and the company closed the Playlist merger days later. The main caution flag in the assigned pool is not litigation or a regulatory action; it is execution and product-completeness uncertainty. A competitor comparison argues some engagement layers, such as live group heart-rate displays or access control, are not clearly documented in EGYM’s public materials, which is weaker evidence than customer churn data but still worth preserving as a diligence prompt.
  claimRefs:
  - CO001
  - CO005
  - CO010
  - CO011
  - CO012
  - CO013
  - CO015
  - CO016
  figureRefs:
  - FO001
