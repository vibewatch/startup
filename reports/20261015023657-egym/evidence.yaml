evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: standalone-economics
    missingEvidence: Current standalone EGYM revenue, gross margin, cash generation, net debt, and post-merger ownership percentages.
    whyItMatters: >-
      The merger disclosures establish combined valuation and scale, but they do not show what portion of value or cash
      flow belongs to EGYM specifically.
    diligencePath: >-
      Request the latest board deck, merger closing capitalization table, and segment-level operating metrics for EGYM
      versus the wider Playlist group.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance-completeness
    missingEvidence: >-
      A current post-merger board roster, committee structure, and named finance leadership for EGYM or the combined
      parent.
    whyItMatters: >-
      Underwriting integration risk and control rights requires more than founder narratives; sponsor oversight and
      finance accountability are still not transparent.
    diligencePath: >-
      Request the current board list, committee charters, delegated-authority matrix, and executive org chart covering
      Playlist and EGYM.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: customer-outcome-proof
    missingEvidence: >-
      Independent renewal, churn, NRR, and utilization data for Wellpass employer partners and gym operators using EGYM
      technology.
    whyItMatters: >-
      The assigned evidence shows distribution breadth, but not whether customers renew or expand enough to justify the
      recurring-revenue narrative.
    diligencePath: >-
      Request cohort retention by employer vintage, partner-gym churn, and usage-to-renewal analyses segmented by
      Wellpass and technology products.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      An independent market study or public company disclosure that isolates smart-fitness equipment plus software
      spend, employer-wellness budgets, and a realistic serviceable geography for EGYM.
    whyItMatters: >-
      Without a methodology-backed TAM, SAM, or SOM, underwriting depends on footprint proxies rather than
      budget-denominated market size and penetration assumptions.
    diligencePath: >-
      Request management's market-sizing model, customer segmentation by geography, and any third-party studies used in
      fundraising or board materials.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Public disclosure of contract structure, budget owner, and renewal economics for Wellpass and bundled operator
      deployments.
    whyItMatters: >-
      Budget ownership and renewal behavior determine whether the market clears through capex, software, or
      employee-benefits budgets and therefore shape adoption timing and valuation multiples.
    diligencePath: >-
      Ask for sample contracts, renewal cohorts, and the split of revenue between hardware, software, and
      employer-sponsored access.
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Recent customer proposals, financing terms, or employer contracts that show realized pricing for EGYM Technology,
      Wellpass, and comparable alternatives.
    whyItMatters: >-
      Without actual pricing or discount structures, the public record cannot prove whether EGYM's breadth offsets its
      heavier deployment model in customer-level ROI terms.
    diligencePath: >-
      Request recent hardware-plus-software proposals, Wellpass employer agreements, and any public procurement records
      from named operator customers.
  - type: missing-source
    severity: material
    topic: competitive-migration
    missingEvidence: >-
      Independent win-loss studies, migration case studies, or churn data that show when clubs replace EGYM with
      specialists or adopt EGYM after using point solutions.
    whyItMatters: >-
      Moat durability depends on replacement economics, not only platform breadth, and the assigned pool does not
      independently show whether EGYM wins or loses those transitions.
    diligencePath: >-
      Ask management for cohort-level retention, named displacement examples, and third-party customer references that
      compare pre- and post-implementation outcomes.
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Segment pricing schedules, discounting norms, contract duration, and realized ARPU for equipment, software, and
      Wellpass.
    whyItMatters: >-
      Realized pricing and contract structure determine whether the blended revenue base is sticky, scalable, and
      margin-accretive.
    diligencePath: Request current pricing books, sample contracts, and realized net-revenue bridge by product line from management.
    relatedQuestionRefs:
      - QI001
      - QI004
      - QI007
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: segment-margins
    missingEvidence: Gross margin, installation/service burden, and working-capital profile for EGYM Technology versus Wellpass.
    whyItMatters: >-
      Hardware, software, and employer-network businesses can support very different cash-conversion profiles despite
      similar top-line growth.
    diligencePath: Request segment P&L, service-cost detail, and working-capital cadence for the last eight quarters.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: transaction-liquidity
    missingEvidence: Transaction-closing evidence plus combined cash, debt, covenants, burn, runway, and integration capex.
    whyItMatters: >-
      Financing announced is not cash available, and capital adequacy cannot be judged without closing, balance-sheet,
      and cash-flow detail.
    diligencePath: >-
      Obtain closing documents, the capitalization table, debt documents, a monthly cash-flow bridge, and the
      integration budget.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales cycle, renewal, and NRR by facility-tech versus Wellpass motion.
    whyItMatters: >-
      The strongest public signals today are usage and retention proxies, but underwriting requires repeatable
      go-to-market efficiency by motion.
    diligencePath: Request cohort retention, funnel conversion, CAC, payback, and channel-mix reporting for both product lines.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Public proof of security certifications, privacy architecture, data-segregation controls, incident reporting, and
      uptime/status commitments for the product stack.
    whyItMatters: >-
      Enterprise buyers and diligence teams need to know whether EGYM's connected-equipment and app layers meet security
      and compliance expectations before underwriting rollout at scale.
    diligencePath: >-
      Request security architecture diagrams, certification letters, subprocessor and data-hosting detail, incident
      history, and contractual SLA language from EGYM.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      No GitHub, package-registry, API-forum, or practitioner-community proxy evidence in the assigned pool shows
      external developer adoption or integration quality.
    whyItMatters: >-
      EGYM's extensibility story depends on partner development and integrations, so missing practitioner evidence
      limits confidence in how repeatable that model is outside curated case studies.
    diligencePath: >-
      Ask for developer documentation access, API-change logs, partner engineering references, and public or private
      implementation examples beyond the Ionic case study.
  - type: private-evidence-only
    severity: material
    topic: implementation-economics
    missingEvidence: >-
      Public materials do not quantify deployment timelines, integration cost, support staffing, migration effort, or
      realized ROI by installation cohort.
    whyItMatters: >-
      The product promise is broad enough that execution risk and time-to-value could dominate underwriting even if the
      feature set itself is credible.
    diligencePath: >-
      Request deployment playbooks, average implementation duration, professional-services scope, support-ticket trends,
      and renewal outcomes segmented by module adoption.
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: >-
      Public NRR, GRR, churn, renewal, contract-length, and top-customer concentration metrics for both EGYM Technology
      and Wellpass.
    whyItMatters: >-
      Without durability metrics, the public customer story proves reach and partner activity but not revenue resilience
      or concentration risk.
    diligencePath: >-
      Request cohort retention, renewal, logo churn, and top-10 customer concentration data by segment during management
      diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-proof
    missingEvidence: >-
      A fuller named customer roster showing which public deployments are live, paid, and outcome-bearing rather than
      only announced.
    whyItMatters: >-
      Named partner announcements are useful adoption proof, but they do not establish how much production usage or
      revenue has actually been realized.
    diligencePath: >-
      Request a current top-customer and flagship-deployment list with start date, contract status, usage level, and
      renewal status.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: minor
    topic: employer-channel
    missingEvidence: Active Wellpass participation rates and employer-level expansion data.
    whyItMatters: >-
      Eligible employees and employer counts do not reveal utilization or whether the employer channel is deepening
      inside existing accounts.
    diligencePath: Ask for active-user penetration, employer expansion cohorts, and country-level participation trends for Wellpass.
    relatedQuestionRefs:
      - QU002
      - QU006
  - type: missing-source
    severity: material
