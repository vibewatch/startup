      - number: '6.2'
        title: Adoption proof is real, but most public scale markers are ecosystem-level
        blocks:
          - type: paragraph
            body: >-
              EGYM's strongest public adoption evidence is top-of-funnel and network scale rather than retention
              analytics. The company currently markets 7.5 million monthly active exercisers, 33,000 connected
              locations, and more than 200 connected partners. A January 2026 Playlist announcement adds another scale
              marker by saying EGYM Wellpass partners with more than 20,000 employers and tens of thousands of fitness
              locations worldwide. Older HTGF financing materials add historical context: as of July 2023, Wellpass
              covered more than 7,500 companies and nearly 2.5 million eligible employees across German-speaking
              markets, while around 16,000 clubs worldwide were using EGYM products and services. Together these
              disclosures support real market reach, but they mix users, locations, employers, and clubs, so they should
              not be read as one comparable funnel or as proof of retention.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Named public proofs skew toward integrations and platform-enablement rather than cohort disclosures
        blocks:
          - type: paragraph
            body: >-
              The named proofs in the assigned source pool mostly show EGYM landing and expanding through ecosystem
              partners. Life Fitness and Spirit Fitness both announced integrations that route cardio data into EGYM's
              software environment, while Ionic's case study shows EGYM offering a shell app, APIs, and release guidance
              so partner gyms can ship their own microapps. Even the Netpulse evidence is thin: Star's prefetched text
              preserves only the case-study title, which is enough to show a named deployment reference but not enough
              to verify production scale or outcomes. This pattern matters because it supports a credible expansion
              loop—more equipment, more integrations, more branded digital surfaces—while still leaving a gap between
              partner announcements and independently verified production usage or commercial impact.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU014
      - number: '6.4'
        title: Durability and concentration remain the biggest open diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public materials repeatedly assert member engagement and operator-retention benefits, but the sources
              retained for this chapter do not disclose NRR, GRR, logo churn, contract length, or top-customer
              concentration. The official site says the ecosystem drives greater retention and higher revenue, yet that
              is still a marketing claim without a public cohort bridge. The sharpest counter-signal in the pool is
              adversarial rather than authoritative: Uptivo's comparison says live group heart-rate display and access
              control were not documented in the EGYM materials it reviewed. That does not prove the capability is
              absent, but it does show that some customer-facing workflow claims remain hard to validate from public
              evidence alone. For underwriting, the central risk is not lack of customer footprint; it is lack of
              disclosed durability and concentration metrics behind that footprint.
            claimRefs:
              - CU013
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-sided distribution is visible in public evidence
            body: >-
              The chapter's best-supported thesis is breadth: EGYM reaches operators, employer buyers, and members
              through one ecosystem, with current public scale markers across users, facilities, employers, and
              connected partners.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
          - type: callout
            title: Durability is still a disclosure gap, not a proven strength
            body: >-
              Public sources support adoption and expansion surfaces, but they do not publish retention, renewal, or
              concentration data that would convert those surfaces into a durable customer thesis.
            calloutType: risk
            claimRefs:
              - CU013
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Risk posture: scale and integration are the core exposure'
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risk is not demand creation but executing a much broader operating system after the
              Playlist tie-up. The merger announcement says the deal adds $785 million of new equity, values the
              combined enterprise at $7.5 billion, and was still subject to customary regulatory approvals when
              announced. At the same time, EGYM and partner materials describe a platform spanning more than 20,000
              employers, tens of thousands of fitness locations, and hundreds of connected brands. That breadth can
              create durable network effects, but it also compounds delivery, integration, and reporting complexity. The
              residual underwriting issue is that public evidence is richer on product ambition and scale than on the
              control metrics an investor would want to monitor after closing.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and disclosure risk remains under-documented publicly
        blocks:
          - type: paragraph
            body: >-
              The reviewed pool does not show a public regulatory or litigation event, but it also does not provide the
              documents needed to clear those risks with confidence. The Playlist announcement explicitly said closing
              remained subject to customary regulatory approvals, yet this chapter pool does not include a later
              official update documenting clearance, remedies, or final closing conditions. More importantly for ongoing
              diligence, the official EGYM and Playlist pages in this pool focus on product scope, employer reach, and
              growth rather than publishing security certifications, privacy frameworks, incident-response evidence, or
              post-merger financial-control disclosures. That does not prove a deficiency; it does mean legal, privacy,
              and reporting controls still require direct diligence rather than being underwritten from public materials
              alone.
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Operational risk rises with hardware, onboarding, and product-stack breadth
        blocks:
          - type: paragraph
            body: >-
              EGYM's own materials consistently position the company as an integrated operating system for clubs, not a
              single lightweight application. The homepage emphasizes a system intended to drive retention and higher
              revenue, the company overview highlights a global support footprint with over 1,000 employees, and Fitt
              Insider describes ongoing launches in smart strength and seca-integrated onboarding hardware. Even a
              competitor comparison that should be read skeptically still reinforces the same structural point:
              public-market buyers should expect floor-plan, hardware, and implementation commitments rather than a
              simple software-only rollout. Dedicated customer-success resources are a real mitigation, but they do not
              eliminate deployment friction, hardware refresh needs, or execution risk across thousands of facilities
              and partners.
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR009
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
              - CR015
      - number: '7.4'
        title: Capital, partner, and concentration dependencies remain material
        blocks:
          - type: paragraph
            body: >-
              EGYM's public history in this pool shows repeated large financings and dependence on multiple
              counterparties. HTGF described a 2023 round of up to €207 million with significant expansion investment
              still ahead, NGP described a 2024 round of about $200 million at a valuation above $1 billion, and the
              2026 Playlist combination adds much larger equity capital while keeping EGYM as a subsidiary within a
              wider platform. This is not a bootstrapped or low-dependency model. The business depends on employer
              adoption, partner facilities, connected brands, investors, and the new parent organization all continuing
              to execute. Without public disclosure on retention, partner concentration, contract duration, or segment
              economics, the downside case is that integration scale outruns monetization discipline.
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The strongest current public valuation signal is the January 2026 merger announcement, which paired EGYM
              with Playlist at a $7.5 billion enterprise value and more than $800 million of combined 2025 net revenue
              while explicitly withholding a standalone EGYM purchase price. That anchor implies at least about 9.4x
              revenue for the combined platform, which is materially above the public comparable EV/revenue figures
              surfaced in Multiples for fitness and wellness names such as Johnson Health Tech, Grupo CIE, Leejam
              Sports, and Herbalife. Because public evidence does not disclose the post-deal cap table, preference
              stack, or the exact value attributed to EGYM inside the merged vehicle, the right call is to track the
              asset and underwrite only after price or diligence materially improves.
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV016
      - number: '8.2'
        title: Thesis support versus public valuation
        blocks:
          - type: paragraph
            body: >-
              EGYM is not a story-stock with no operating proof. Company disclosures describe a platform with more than
              20,000 employer relationships, tens of thousands of fitness locations, 7.5 million monthly active
              exercisers, 33,000 locations, and 200 connected partners, while historical financing records and investor
              materials show a $1.2 billion September 2024 mark, a 5.3x implied multiple on July 2023 revenue, 70%
              year-over-year growth, and an expectation of profitability in fiscal 2023. Those signals support the view
              that EGYM built a valuable, scaled asset before the merger. The problem is that public evidence supporting
              the current entry price has moved faster than public evidence on recurring economics, because the current
              mark is on a broader combined company while most detailed operating disclosures remain historical or
              company-issued.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios, comps, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case is that EGYM's equipment, software, and corporate-wellness network become more valuable
              inside Playlist's broader software and consumer ecosystem, allowing cross-sell, AI-enabled workflow gains,
              and a cleaner path to future liquidity. The anti-thesis is that underwriting still depends on
              company-controlled disclosures, while outside sources emphasize capital intensity and reveal inconsistent
              directory estimates for revenue and headcount that do not reconcile with management-scale claims.
              Competitor criticism is not dispositive, but it does underscore the practical risk that some operators may
              see EGYM as an equipment-led investment rather than a lightweight software layer. Until management can
              prove post-merger gross margin, retention, cash generation, and capital-structure terms, the prudent
              stance is to keep scenario ranges wide, demand diligence on downside triggers, and avoid assigning a
              target return from public evidence alone.
            claimRefs:
              - CV008
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV010
              - CV011
              - CV013
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track until price transparency improves
            body: >-
              Public evidence is good enough to confirm EGYM is a scaled, strategically relevant fitness-and-wellness
              platform, but not good enough to justify buying a merged private vehicle without clearer economics or a
              better entry point.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV016
          - type: callout
            title: The key missing variable is not demand, but underwritten economics
            body: >-
              The market story is strong, yet public sources still do not reconcile standalone EGYM value, post-merger
              segment performance, or the financing terms behind the new capital stack.
            calloutType: risk
            claimRefs:
              - CV001
              - CV011
              - CV015
              - CV016
