        title: Deployment, roadmap, and differentiation
        blocks:
          - type: paragraph
            body: >-
              EGYM's differentiation is not just AI copy; it is the combination of installed hardware, connected
              third-party devices, branded member experiences, and operator workflow services. Third-party reporting
              suggests the product has already expanded from proprietary equipment into a broader software-and-network
