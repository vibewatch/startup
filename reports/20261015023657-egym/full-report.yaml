      - number: '3.3'
        title: Switching costs rise when EGYM becomes the club's integration layer
        blocks:
          - type: paragraph
            body: >-
              EGYM's strongest moat signal in public sources is not only its hardware footprint but the amount of club
              workflow it can absorb once installed. The company says its ecosystem reaches 7.5 million monthly active
              exercisers, 33,000 locations, and 200 connected partners, while Tracxn shows a history of acquisitions
              that widened the surface area around access and corporate wellness. Ionic's case study adds an important
              operational detail: partner gyms can build microapps on top of a branded shell and use EGYM APIs without
              touching the core code base. That increases stickiness because data flows, partner-built extensions, and
              branded member experiences become harder to unwind, even though bespoke customization also creates
              delivery overhead.
            claimRefs:
              - CP003
