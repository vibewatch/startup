      - number: '3.4'
        title: Durability is real, but public proof of migration economics is still thin
        blocks:
          - type: paragraph
            body: >-
              The 2026 evidence points to continued platform expansion rather than retrenchment. Fitt Insider describes
              March 2026 launches that deepen the equipment-plus-software loop around Genius AI, and the Playlist
              transaction pushes EGYM toward an even broader wellness stack. Still, moat durability should not be
              overstated from this pool alone. Some of the sharpest workflow critiques come from a competitor-authored
              comparison, public list pricing remains undisclosed, and the assigned sources do not show independent
              win-loss or churn data that proves EGYM can defend every layer against specialist vendors or adjacent
              software consolidators. The result is a credible platform position with incomplete public proof on
              replacement economics.
            claimRefs:
              - CP008
