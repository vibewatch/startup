  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments are split between facility operators, employers, and end users
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows EGYM monetizing two distinct payer groups. On the technology side, the company
              describes fitness and health facilities as the direct buyers of smart equipment, digital services, and
              operator enablement, while gym members are the end users receiving guided workouts and training data. On
              the corporate-wellness side, EGYM Wellpass is sold to employers, with employees then using the network at
              participating facilities. That gives EGYM a blended go-to-market model: B2B facility sales, B2B employer
              sales, and B2C member engagement inside the operator network. What is still missing is revenue mix by
              segment, geography, or customer size, so the public record is better at showing breadth than at
              quantifying which customer group drives the economics.
            claimRefs:
              - CU001
              - CU002
              - CU012
