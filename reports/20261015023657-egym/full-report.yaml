      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The public record supports current-footprint sizing lenses, not a clean external TAM/SAM/SOM stack. EGYM's
              current disclosures give operator-side and usage-side reach metrics such as monthly active exercisers,
              connected locations, and partners, while Playlist adds post-merger counts for Mindbody businesses,
              ClassPass venues, and Wellpass employer partners. HTGF's 2023 financing disclosure adds an older but still
              useful employer-access lens for Wellpass, including eligible employees and participating companies.
              Together those figures show real market presence across operator infrastructure and employer distribution,
              but they are not directly comparable units and do not isolate total spend, budgeted SAM, or realistic SOM
              by geography. The practical conclusion is that EGYM has proven distribution breadth across multiple
              channels, yet the remaining underwriting work is to turn that footprint into budget-denominated market
              size and adoption-rate assumptions.
