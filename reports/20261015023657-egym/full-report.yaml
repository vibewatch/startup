  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer architecture
        blocks:
          - type: paragraph
            body: >-
              The retained sources describe EGYM less as a single equipment vendor than as an operating-system layer for
              gyms, health facilities, and now a broader merged wellness stack. EGYM's own pages frame the core workflow
              around connected equipment, software, data, and member guidance for facility operators, while Playlist
              expands the adjacency set to software, consumer booking, and employer wellness. That means the relevant
              market boundary includes operator software and connected-training workflows, employer-sponsored access
              through Wellpass, and post-merger cross-sell into adjacent wellness software channels; it excludes
              acute-care delivery and any generic wellness spending that is not tied to operator workflows, employer
              benefits, or the connected gym floor. Public evidence also makes the buyer map clear enough to underwrite
              at a high level: operators buy the technology stack, employers fund the Wellpass benefit, and end users
              consume the experience through facilities or employer-sponsored access rather than buying EGYM as a pure
              consumer app.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
