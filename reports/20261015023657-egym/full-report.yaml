      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Management's adoption thesis centers on combining operator software, smart equipment, AI-driven
              programming, and employer wellness into a single workflow, then using the Playlist merger to extend that
              bundle across new geographies and customer sets. The independent Fitt Insider write-up supports the
              directional trend that operators increasingly want connected infrastructure that makes personalization
              standard and progress easier to prove. The biggest caution in the retained evidence is not demand absence
              but adoption friction: a competitor argues that EGYM remains equipment-led, requiring floor-plan decisions
              and capital budgets, which can slow rollout for clubs that already have mixed or recently financed
              equipment. That does not invalidate the market opportunity, but it means valuation should depend more on
              budget ownership, deployment timing, and cross-sell conversion than on broad wellness TAM rhetoric.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Boundary is workflow-based, not a generic wellness TAM
            body: >-
              The strongest public evidence defines EGYM's market through operator workflows, employer-sponsored access,
              and merged wellness-software adjacency, which is narrower and more underwritable than citing the full
              wellness or healthcare market.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM011
          - type: callout
            title: Capital-cycle friction can slow adoption
            body: >-
              The main disconfirming signal in the retained pool is that EGYM's value proposition can still require
              equipment and facility reconfiguration, so some clubs may defer adoption until the next capital cycle or
              pair EGYM with adjacent software rather than standardize immediately.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real competitive set is broader than smart equipment
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence shows EGYM competing for the same budget across several layers of the gym and
              wellness stack. Official EGYM pages present the company as an operating system that links training, data,
              and business processes rather than as a single equipment SKU. HTGF and Playlist both reinforce that
              breadth by tying EGYM Technology to the Wellpass employer network, while the Playlist announcement also
              extends the battlefield toward software, booking, and consumer-demand platforms. That means the buyer can
              choose a full-stack EGYM deployment, an adjacent software platform, a narrower point solution, or simply
              keep a mixed stack of existing equipment and separate engagement tools.
            claimRefs:
