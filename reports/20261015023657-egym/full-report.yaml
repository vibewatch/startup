companyProfile:
  summary: >-
    EGYM is a Munich-based connected fitness and corporate wellness platform that sells smart gym equipment, AI-guided
    training software, branded member experiences, and employer-sponsored wellness access through Wellpass. The business
    is now inside Playlist after a March 2026 merger that gave the combined platform a $7.5 billion enterprise value and
    fresh capital, but public disclosures still leave standalone economics, governance detail, and current cash
    generation only partially visible.
  foundedDate: 2010-01-01T00:00:00.000Z
  founders:
    - name: Philipp Roesch-Schlanderer
      role: Co-founder and CEO
      background: Has led EGYM from its early smart-gym and software buildout through the current post-merger operating structure.
  foundingLocation: Munich, Germany
  headquarters: Munich, Germany
  productSummary: >-
    Connected gym hardware, AI programming, operator software, branded member apps, and the Wellpass corporate wellness
    network.
  customerFocus: Fitness operators, health facilities, employers, and the end users who train through those networks.
  businessModel: >-
    Enterprise sales for connected equipment and software, plus employer-sponsored wellness access and adjacent platform
    services.
  stage: Playlist subsidiary after March 2026 merger
  fundingStatus: >-
    March 2026 Playlist merger valued the combined enterprise at $7.5 billion and added $785 million of new equity;
    historical 2023 Series F financing reached up to €207 million.
  disclosureProfile: private-disclosed
