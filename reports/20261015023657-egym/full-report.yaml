  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope in operator workflow terms
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently frame EGYM as the operating system for a facility rather than a single
              machine vendor. In practice, the documented workflow starts with intake and body analysis, routes members
              into AI-guided programs, captures workout data across connected strength and cardio surfaces, and extends
              engagement into branded mobile experiences and operator tooling. That matters because the buyer is not
              just purchasing equipment; the buyer is standardizing programming, member onboarding, analytics, and
              wellness-network access on one vendor stack. The breadth is real enough to matter in diligence, but the
              strongest proof in the assigned pool is still packaging and positioning evidence rather than independently
              benchmarked outcome evidence.
