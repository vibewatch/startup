            body: >-
              The assigned sources consistently show EGYM selling more than machines: employer access, connected
              partners, branded apps, and AI programming make it harder for a single-feature rival to displace the
              platform everywhere at once.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP005
