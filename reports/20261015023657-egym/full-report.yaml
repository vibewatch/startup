          - type: callout
            title: Governance and product-completeness still need diligence
            body: >-
              A founder-led parent structure can speed integration, but the assigned pool does not disclose a refreshed
              full board or finance leadership roster, and the only explicit product limitations come from a competitor
              comparison rather than customer churn data.
            calloutType: risk
            claimRefs:
