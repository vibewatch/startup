      - number: '3.2'
        title: Capability breadth comes with deployment and budget tradeoffs
        blocks:
          - type: paragraph
            body: >-
              EGYM's public story emphasizes integration breadth, but the clearest competitive attack in the assigned
              pool is cost and time-to-value. Uptivo's comparison page is vendor-authored rather than independent, yet
              it is still useful for showing how a rival frames the buying decision: EGYM as an equipment-led path that
              depends on connected machines and in-club stations, versus a wearable-led layer that can launch on top of
              an existing floor. The same comparison also argues that some workflows such as live heart-rate classes,
              bookings, payments, access control, and business-intelligence dashboards can be sold modularly. Because
              EGYM's reviewed official pages do not publish list pricing, public comparison is strongest on deployment
              shape and workflow scope rather than on verified price points.
