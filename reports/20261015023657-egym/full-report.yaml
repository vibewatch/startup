  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Current public evidence supports a scaled asset, but not enough pricing transparency to move from track to buy.
    data:
      nodes:
        - label: Scale proof
          value: 7.5M monthly active exercisers; 33,000 locations; 20,000+ employers
          note: Current company disclosures show broad platform reach.
        - label: Historical valuation proof
          value: $1.2B Sep 2024 mark; $130M Jul 2023 revenue at 5.3x
          note: Standalone EGYM had financing support before the merger.
        - label: Current transaction anchor
          value: $7.5B combined EV; $785M new equity; >$800M 2025 revenue
          note: Public pricing is now at the merged Playlist-EGYM vehicle level.
        - label: Multiple test
          value: about 9.4x implied EV/revenue versus listed public comp range of 0.6x-3.6x
          note: The announced valuation is above disclosed public comp levels.
        - label: Diligence friction
          value: no standalone purchase price, no public cap table, no reconciled segment margins or retention
          note: Directory estimates and competitor criticism widen the uncertainty discount.
        - label: Recommendation
          value: Track / medium confidence / high risk / stretched
          note: Wait for better entry terms or management-grade diligence evidence.
    approximationNotes: >-
      The 9.4x figure is a minimum implied EV/revenue multiple derived from $7.5 billion enterprise value divided by
      more than $800 million of 2025 net revenue.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV010
      - CV011
      - CV016
