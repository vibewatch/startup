      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The identity is clearer than the economics
            body: >-
              The assigned evidence cleanly establishes what EGYM is and where it sits in the market stack, but not the
              current standalone economic profile investors would underwrite after the Playlist transaction.
            calloutType: insight
            claimRefs:
              - CO002
