      - number: '4.3'
        title: Announced capital access is not verified liquidity
        blocks:
          - type: paragraph
            body: >-
              The Playlist transaction announcement indicates potential access to substantial capital, but public
              liquidity disclosure is too thin for full underwriting. The companies announced $785 million of new equity
              at a $7.5 billion combined enterprise value and said proceeds would fund AI investment and geographic
              expansion; they also stated that closing required regulatory approvals. Earlier partner evidence shows
              EGYM raised growth capital for Wellpass and digital-product development in 2023. Yet the retained
              funding-tracker capture was last updated in September 2024, and the assigned sources do not report current
              cash, debt maturities, burn, covenant headroom, or integration capex. A competitor comparison further
              argues that equipment-led deployment can wait for a gym's next capital cycle, making operator capex
              tolerance a material revenue-quality risk.
