chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              EGYM presents itself as a fitness-technology company built to shift healthcare from repair to prevention,
              and the assigned evidence supports that identity across both current marketing and transaction
              disclosures. The core model has two recurring pillars: EGYM Technology, which sells connected equipment
              and software to fitness and health facilities, and EGYM Wellpass, which aggregates employer-sponsored
              access to fitness and health venues. The clearest current stage marker is the March 2026 merger close,
              after which EGYM became a subsidiary inside Playlist. That gives later chapters a clean identity anchor:
              EGYM is no longer a standalone venture-stage asset, but an operating business contributing hardware,
              software, and corporate wellness distribution inside a larger platform.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Leadership continuity runs through Philipp Roesch-Schlanderer, who remains the most visible operator in
              the assigned evidence and bridges old EGYM and the new Playlist parent structure. The merger materials
              also elevate Playlist CEO Fritz Lanman into the same founder-led control story, with Roesch-Schlanderer
              joining Monti Saroya as co-chairman at the parent. That combination suggests strategy is concentrated
              around a small set of operator-sponsors rather than a broadly disclosed independent board. Assigned public
              materials name the founder and sponsor roles clearly, but they stop short of a full board roster, a
              current CFO disclosure, or a refreshed post-merger governance page for EGYM, so governance completeness
              remains an open diligence item.
            claimRefs:
              - CO004
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO010
              - CO014
      - number: '1.3'
        title: Funding, valuation, and scale markers
        blocks:
          - type: paragraph
            body: >-
              The cleanest current capital marker is the merger close: Playlist said the transaction brought $785
              million of new equity and valued the combined enterprise at $7.5 billion. For historical context, HTGF
              said EGYM raised up to €207 million in Series F financing in July 2023, with €107 million funded
              immediately and another €100 million available for future investments. Public scale markers are meaningful
              but mixed in vintage and denominator. The merger disclosures referenced more than 20,000 employer partners
              and tens of thousands of locations, while EGYM’s current ecosystem page advertises 7.5 million monthly
              active exercisers, 33,000 locations, and 200 connected partners. What remains missing is a current
              standalone EGYM revenue run rate, gross margin, cash profile, and clean post-merger employee count.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO010
              - CO014
      - number: '1.4'
        title: Milestones and caution flags
        blocks:
          - type: paragraph
            body: >-
              The milestone record is strong enough to show a real company arc rather than a static profile. EGYM was
              founded in 2010, had HTGF on the cap table by 2011, expanded Wellpass and acquired Gymlib in 2022, then
              raised a large Series F round in 2023. In March 2026, independent coverage highlighted new Smart Strength
              Series 3 and Fitness Hub seca launches, and the company closed the Playlist merger days later. The main
              caution flag in the assigned pool is not litigation or a regulatory action; it is execution and
              product-completeness uncertainty. A competitor comparison argues some engagement layers, such as live
              group heart-rate displays or access control, are not clearly documented in EGYM’s public materials, which
              is weaker evidence than customer churn data but still worth preserving as a diligence prompt.
            claimRefs:
              - CO001
