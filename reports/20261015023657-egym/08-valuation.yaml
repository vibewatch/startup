schemaVersion: report-v2
artifact: valuation
slug: egym
runDate: 2026-10-15
company:
  name: EGYM
chapter:
  number: 8
  title: Valuation
  summary: EGYM has real scale and product proof, but the public valuation anchor is the merged Playlist-EGYM vehicle at $7.5 billion enterprise value on more than $800 million of 2025 net revenue, which implies at least about 9.4x revenue without disclosing a standalone EGYM purchase price. Historical EGYM marks, public comp ranges, and unresolved capital-structure and unit-economics gaps support a track recommendation and a stretched valuation stance rather than a price-insensitive buy call.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: The strongest current public valuation signal is the January 2026 merger announcement, which paired EGYM with Playlist at a $7.5 billion enterprise value and more than $800 million of combined 2025 net revenue while explicitly withholding a standalone EGYM purchase price. That anchor implies at least about 9.4x revenue for the combined platform, which is materially above the public comparable EV/revenue figures surfaced in Multiples for fitness and wellness names such as Johnson Health Tech, Grupo CIE, Leejam Sports, and Herbalife. Because public evidence does not disclose the post-deal cap table, preference stack, or the exact value attributed to EGYM inside the merged vehicle, the right call is to track the asset and underwrite only after price or diligence materially improves.
    claimRefs: [CV001, CV002, CV010, CV011, CV012, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-support-versus-public-valuation
    title: Thesis support versus public valuation
    body: EGYM is not a story-stock with no operating proof. Company disclosures describe a platform with more than 20,000 employer relationships, tens of thousands of fitness locations, 7.5 million monthly active exercisers, 33,000 locations, and 200 connected partners, while historical financing records and investor materials show a $1.2 billion September 2024 mark, a 5.3x implied multiple on July 2023 revenue, 70% year-over-year growth, and an expectation of profitability in fiscal 2023. Those signals support the view that EGYM built a valuable, scaled asset before the merger. The problem is that public evidence supporting the current entry price has moved faster than public evidence on recurring economics, because the current mark is on a broader combined company while most detailed operating disclosures remain historical or company-issued.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: scenarios-comps-and-diligence-asks
    title: Scenarios, comps, and diligence asks
    body: The bull case is that EGYM's equipment, software, and corporate-wellness network become more valuable inside Playlist's broader software and consumer ecosystem, allowing cross-sell, AI-enabled workflow gains, and a cleaner path to future liquidity. The anti-thesis is that underwriting still depends on company-controlled disclosures, while outside sources emphasize capital intensity and reveal inconsistent directory estimates for revenue and headcount that do not reconcile with management-scale claims. Competitor criticism is not dispositive, but it does underscore the practical risk that some operators may see EGYM as an equipment-led investment rather than a lightweight software layer. Until management can prove post-merger gross margin, retention, cash generation, and capital-structure terms, the prudent stance is to keep scenario ranges wide, demand diligence on downside triggers, and avoid assigning a target return from public evidence alone.
    claimRefs: [CV008, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Recommendation
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - [track, medium, high, stretched, 'Do not underwrite a buy from public evidence alone; require either better price discipline or private diligence on cap table, margins, retention, and cash generation.']
    notes: Public evidence supports scale and profitability signals, but not a standalone post-merger purchase price, cap-table terms, or reconciled unit economics.
    claimRefs: [CV001, CV002, CV010, CV011, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [thesis, 'The merged platform disclosed more than $800 million of 2025 net revenue and strong profitability, so the asset is scaled rather than speculative.', 'Audited segment revenue and margin disclosure showing EGYM contributes durable, high-margin recurring economics would strengthen conviction.']
      - [thesis, 'EGYM disclosed more than 20,000 employer relationships, tens of thousands of fitness locations, 7.5 million monthly active exercisers, and 33,000 locations, indicating broad adoption footprints across both wellbeing and operator workflows.', 'Independent retention, utilization, and renewal data would confirm that the footprint converts into durable customer value instead of broad but shallow usage.']
      - [thesis, 'Historical financing shows a $1.2 billion September 2024 standalone mark after earlier growth and profitability signals, so the business had financing support before the merger.', 'Evidence that the merged entity preserved or expanded those economics post-close would make the current vehicle easier to value.']
      - [anti-thesis, 'The announced combined vehicle implies at least about 9.4x revenue, which is well above the public EV/revenue figures listed by Multiples for several disclosed public comps.', 'A materially lower effective entry price or evidence that EGYM deserves a structurally higher multiple than those public comps would reduce the stretched-valuation concern.']
      - [anti-thesis, 'Public evidence does not disclose a standalone EGYM purchase price inside the merger, so investors cannot isolate what they are paying for EGYM versus the wider Playlist platform.', 'Management disclosure on purchase accounting, segment contributions, or internal valuation bridges would improve price transparency.']
      - [anti-thesis, 'Outside sources highlight capital-intensity and inconsistent scale estimates, raising the risk that public data understates adoption friction or overstates comparability between historical EGYM marks and the current merged vehicle.', 'Private diligence proving low churn, strong operator ROI, and consistent group-level reporting would narrow this execution and disclosure discount.']
    notes: This table mixes company-issued, partner-issued, competitor-issued, and secondary market-data evidence; each row should be read as an underwriting lens rather than a confirmed forecast.
    claimRefs: [CV002, CV003, CV004, CV005, CV007, CV010, CV011, CV013, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [bull, 'Playlist cross-sell works, EGYM keeps expanding into North America and Asia, and management can prove that 2025 profitability scales with recurring employer and operator usage.', 'The current stretched headline multiple can hold only if post-merger disclosures show premium software-like retention and margin expansion versus historical standalone marks.', 'Integration execution, regulatory approvals, and the absence of public purchase-price allocation still matter.', 'Would need private evidence of strong NRR, segment margins, and clean cap-table terms.']
      - [base, 'EGYM remains strategically valuable but public evidence stays limited to company-controlled disclosures plus historical financing and broad combined-company metrics.', 'The current vehicle is interesting enough to track, but not transparent enough to underwrite a target return from public sources.', 'Investors may be paying for synergy and AI optionality before those economics are externally verified.', 'Most consistent with the current evidence set.']
      - [bear, 'Operator adoption proves slower or more capital-intensive than the merged story suggests, while combined-company disclosures never reconcile EGYM stand-alone economics.', 'If the merged vehicle eventually resets toward mature public-comp multiples or weaker growth expectations, current entry would look expensive.', 'Multiple compression, weak post-merger renewal, and financing overhang would drive downside.', 'Supported by the gap between the implied 9.4x+ revenue multiple and the lower public comp range.']
    notes: Scenario ranges are qualitative because the public record does not disclose a standalone EGYM purchase price, post-merger segment margins, or the new preference stack behind the $785 million financing.
    claimRefs: [CV001, CV002, CV005, CV007, CV010, CV011, CV013, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Current public evidence supports a scaled asset, but not enough pricing transparency to move from track to buy.
    data:
      nodes:
        - label: Scale proof
          value: 7.5M monthly active exercisers; 33,000 locations; 20,000+ employers
          note: Current company disclosures show broad platform reach.
        - label: Historical valuation proof
          value: $1.2B Sep 2024 mark; $130M Jul 2023 revenue at 5.3x
          note: Standalone EGYM had financing support before the merger.
        - label: Current transaction anchor
          value: $7.5B combined EV; $785M new equity; >$800M 2025 revenue
          note: Public pricing is now at the merged Playlist-EGYM vehicle level.
        - label: Multiple test
          value: about 9.4x implied EV/revenue versus listed public comp range of 0.6x-3.6x
          note: The announced valuation is above disclosed public comp levels.
        - label: Diligence friction
          value: no standalone purchase price, no public cap table, no reconciled segment margins or retention
          note: Directory estimates and competitor criticism widen the uncertainty discount.
        - label: Recommendation
          value: Track / medium confidence / high risk / stretched
          note: Wait for better entry terms or management-grade diligence evidence.
    approximationNotes: The 9.4x figure is a minimum implied EV/revenue multiple derived from $7.5 billion enterprise value divided by more than $800 million of 2025 net revenue.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV010, CV011, CV016]
callouts:
  - calloutType: recommendation
    title: Track until price transparency improves
    body: Public evidence is good enough to confirm EGYM is a scaled, strategically relevant fitness-and-wellness platform, but not good enough to justify buying a merged private vehicle without clearer economics or a better entry point.
    claimRefs: [CV001, CV002, CV010, CV011, CV016]
  - calloutType: risk
    title: The key missing variable is not demand, but underwritten economics
    body: The market story is strong, yet public sources still do not reconcile standalone EGYM value, post-merger segment performance, or the financing terms behind the new capital stack.
    claimRefs: [CV001, CV011, CV015, CV016]
