  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capital-structure-overhang
      missingEvidence: The public record does not disclose the post-merger cap table, liquidation preferences, board-control terms, or any investor protections attached to the $785 million financing.
      whyItMatters: Entry price discipline depends on knowing whether new money or legacy holders sit ahead of future returns in a way that can dilute common-equity upside.
      diligencePath: Request the merger term sheet, capitalization table, preference stack, and any side-letter economics tied to the January 2026 financing.
      relatedQuestionRefs: [QV006]
    - type: missing-source
      severity: material
      topic: standalone-purchase-price
      missingEvidence: No public source in the assigned pool discloses what portion of the combined $7.5 billion enterprise value was attributed specifically to EGYM.
      whyItMatters: Without a standalone purchase-price bridge, investors cannot compare today's effective entry mark with EGYM's prior financing marks or with public comparables on a like-for-like basis.
      diligencePath: Ask management for purchase accounting, valuation allocation, or internal board materials showing how the merger valued EGYM relative to the broader Playlist platform.
      relatedQuestionRefs: [QV001, QV006]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Public evidence does not provide post-merger segment gross margin, net revenue retention, churn, free cash flow, or customer-acquisition payback for EGYM Technology and EGYM Wellpass.
      whyItMatters: A stretched private multiple can only be defended if retention, margin structure, and cash conversion are materially better than what the public comp range implies.
      diligencePath: Obtain segment P&Ls, cohort retention by employer and operator segment, churn waterfalls, and normalized free-cash-flow bridges for 2024-2026.
      relatedQuestionRefs: [QV003, QV008]
    - type: conflicting-data
      severity: material
      topic: scale-reconciliation
      missingEvidence: Third-party directory estimates for EGYM DACH do not reconcile cleanly with company-wide scale disclosures on users, locations, and employee count.
      whyItMatters: If the public data set cannot even reconcile scale, it is unsafe to turn those signals into precise valuation math or target-return assumptions.
      diligencePath: Reconcile legal-entity scope, geography, and reporting perimeter with management before using any third-party directory estimate in the investment model.
      relatedQuestionRefs: [QV003]
