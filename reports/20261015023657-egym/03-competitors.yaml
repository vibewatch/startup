company:
  name: EGYM
chapter:
  number: 3
  title: Competitors
  summary: EGYM competes less as a standalone machine vendor than as a fitness operating system that bundles connected equipment, AI-guided training, branded apps, and corporate wellness access. The main threats in the assigned evidence are adjacent full-stack platforms that combine software and demand aggregation, plus lower-capex point solutions that attack engagement workflows without forcing a hardware refresh.
sections:
- id: landscape-categories
  title: The real competitive set is broader than smart equipment
  body: The assigned evidence shows EGYM competing for the same budget across several layers of the gym and wellness stack. Official EGYM pages present the company as an operating system that links training, data, and business processes rather than as a single equipment SKU. HTGF and Playlist both reinforce that breadth by tying EGYM Technology to the Wellpass employer network, while the Playlist announcement also extends the battlefield toward software, booking, and consumer-demand platforms. That means the buyer can choose a full-stack EGYM deployment, an adjacent software platform, a narrower point solution, or simply keep a mixed stack of existing equipment and separate engagement tools.
  claimRefs:
  - CP001
  - CP002
  - CP005
  - CP008
  - CP009
  - CP010
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: capability-and-budget-tradeoffs
  title: Capability breadth comes with deployment and budget tradeoffs
  body: 'EGYM''s public story emphasizes integration breadth, but the clearest competitive attack in the assigned pool is cost and time-to-value. Uptivo''s comparison page is vendor-authored rather than independent, yet it is still useful for showing how a rival frames the buying decision: EGYM as an equipment-led path that depends on connected machines and in-club stations, versus a wearable-led layer that can launch on top of an existing floor. The same comparison also argues that some workflows such as live heart-rate classes, bookings, payments, access control, and business-intelligence dashboards can be sold modularly. Because EGYM''s reviewed official pages do not publish list pricing, public comparison is strongest on deployment shape and workflow scope rather than on verified price points.'
  claimRefs:
  - CP010
  - CP011
  - CP014
  - CP016
  tableRefs:
  - TP002
- id: switching-costs-and-extensibility
  title: Switching costs rise when EGYM becomes the club's integration layer
  body: 'EGYM''s strongest moat signal in public sources is not only its hardware footprint but the amount of club workflow it can absorb once installed. The company says its ecosystem reaches 7.5 million monthly active exercisers, 33,000 locations, and 200 connected partners, while Tracxn shows a history of acquisitions that widened the surface area around access and corporate wellness. Ionic''s case study adds an important operational detail: partner gyms can build microapps on top of a branded shell and use EGYM APIs without touching the core code base. That increases stickiness because data flows, partner-built extensions, and branded member experiences become harder to unwind, even though bespoke customization also creates delivery overhead.'
  claimRefs:
  - CP003
  - CP007
  - CP012
  - CP013
  tableRefs:
  - TP003
- id: durability-and-adverse-signals
  title: Durability is real, but public proof of migration economics is still thin
  body: The 2026 evidence points to continued platform expansion rather than retrenchment. Fitt Insider describes March 2026 launches that deepen the equipment-plus-software loop around Genius AI, and the Playlist transaction pushes EGYM toward an even broader wellness stack. Still, moat durability should not be overstated from this pool alone. Some of the sharpest workflow critiques come from a competitor-authored comparison, public list pricing remains undisclosed, and the assigned sources do not show independent win-loss or churn data that proves EGYM can defend every layer against specialist vendors or adjacent software consolidators. The result is a credible platform position with incomplete public proof on replacement economics.
  claimRefs:
  - CP008
  - CP010
  - CP011
  - CP013
  - CP014
  - CP015
  - CP016
