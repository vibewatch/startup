figures:
- id: FP001
  title: Competitive positioning by capital intensity and workflow breadth
  type: quadrant
  summary: Assigned public evidence places EGYM high on workflow breadth but also toward the higher-capital end of the market, while specialist alternatives attack narrower workflows with lower upfront deployment.
  data:
    xAxis:
      label: Operator capital intensity
      min: 1
      max: 5
      low: Low upfront capex
      high: High upfront capex
      description: Ordinal placement from public deployment requirements and hardware dependence.
      scale: ordinal
    yAxis:
      label: Workflow breadth
      min: 1
      max: 5
      low: Single workflow layer
      high: Full-stack operating system
      description: Ordinal placement from the number of operator, member, and employer workflows described in the assigned sources.
      scale: ordinal
    points:
    - label: Status-quo mixed stack
      x: 2
      y: 2
      note: Existing equipment plus separate engagement and booking tools.
    - label: Uptivo
      x: 1
      y: 3
      note: Lower-capex, wearable-led workflow layer that emphasizes classes and operations modules.
    - label: Partner-built extensions
      x: 3
      y: 3
      note: Custom app layers increase flexibility but still require operator or partner engineering.
    - label: EGYM Technology
      x: 4
      y: 4
      note: Broad club workflow coverage built around connected equipment, software, and AI.
    - label: EGYM + Wellpass
      x: 4
      y: 5
      note: Adds employer-funded wellness distribution to the core club technology stack.
    - label: Playlist + EGYM combo
      x: 5
      y: 5
      note: Extends breadth further by combining operator software, booking demand, equipment, and wellness access.
  approximationNotes: Coordinates are evidence-backed ordinal placements rather than benchmark scores; they summarize deployment burden and workflow breadth described in the assigned sources.
