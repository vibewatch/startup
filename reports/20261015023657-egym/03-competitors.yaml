- id: TP001
  title: Competitive landscape by alternative type
  columns:
  - Alternative
  - Category
  - Public scale or funding signal
  - Target customer
  - Differentiation visible in sources
  - Limitation or constraint
  rows:
  - - EGYM platform
    - Direct / full-stack fitness OS
    - 7.5M monthly active exercisers; 33,000 locations; Series G / $580M raised
    - Gyms, health facilities, employers via Wellpass
    - Connected equipment, software, AI guidance, and corporate wellness access under one umbrella
    - Public pricing is undisclosed and rollout is still tied to equipment-led deployment
  - - Playlist + Mindbody + ClassPass + EGYM
    - Adjacent platform consolidator / likely entrant
    - $785M new equity; $7.5B combined enterprise value; $800M+ combined 2025 net revenue
    - Studios, gyms, wellness operators, consumers, employers
    - Adds booking software and consumer demand layers to EGYM's hardware and wellness stack
    - Integration and post-close execution matter, and standalone EGYM economics are not broken out
  - - Uptivo
    - Point-solution competitor
    - Public scale not disclosed on reviewed page
    - Clubs prioritizing group engagement and low-install launches
    - Wearable-led live heart-rate classes, AI coaching, bookings, payments, access control, and analytics
    - Comparison is vendor-authored and does not provide an independently benchmarked view of EGYM
  - - Existing mixed equipment + point tools
    - Status-quo substitute
    - Often tied to already-financed floors and separate vendors
    - Operators that do not want a full rip-and-replace
    - Lowest near-term disruption because existing equipment and class tools can stay in place
    - Fragmented member record and weaker integrated data loop than a single operating system
  - - Partner-built branded extensions
    - Internal build / extension path
    - Club or partner development budget rather than external funding
    - Larger operators that need branded workflows
    - Microapps and APIs can extend the member app without rebuilding the whole platform
    - Customization adds coordination, release, and maintenance burden
  notes: Mixes named companies with status-quo and internal-build alternatives because buyers can solve the same job through either a vendor platform or their existing stack; pricing and some scale fields are undisclosed in the assigned sources.
