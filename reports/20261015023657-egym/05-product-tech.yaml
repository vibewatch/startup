    title: Product module / asset matrix
    columns:
      - Module / asset / product line
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Smart Strength + Smart Cardio ecosystem, Gym member + trainer, Current commercial core, Connects personalized programs to equipment and third-party cardio, Public sources do not show install base by module or retrofit burden]
      - [Fitness Hub onboarding station, Trainer + new member, Current commercial core with 2026 refresh, Adds body analysis and guided onboarding before training starts, No public data on deployment time floor-space requirements or calibration workflow]
      - [Genius AI training layer, Member + trainer, Current commercial core with 2026 investment emphasis, Personalizes plans across connected workouts instead of static templates, No public model-governance performance or retention-lift metrics]
      - [Cloud + Business Suite, Operator + regional manager, Current commercial core, Centralizes analytics equipment management marketing and staff workflow, API depth permissioning and reporting granularity are not public]
      - [Branded member app + partner microapps, Facility partner + member, Current commercial core, Lets facilities extend the experience without a separate app per venue, Public evidence does not show security-review process or plugin governance]
      - [Wellpass corporate wellness network, Employer buyer + employee, Current commercial core, Broadens product reach beyond club-floor equipment into employer distribution, Cross-sell conversion and renewal economics are not public]
    notes: Public sources support module breadth and positioning but not exact attach rates, deployment effort, or module-level retention outcomes.
    claimRefs: [CE002, CE003, CE008, CE010, CE011]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - [Onboard a new gym member, Intake baseline and route the member into a program, Fitness Hub plus Genius-linked programming, Official materials tie onboarding to personalization and visible progress, No public conversion or completion-rate data by cohort]
      - [Run a connected strength-and-cardio floor, Capture machine and workout data while standardizing programs, Smart Strength Smart Cardio and Cloud analytics, SoftwareOne says the stack integrates with 200+ connected brands, Compatibility boundaries and upgrade costs are not public]
      - [Operate a branded digital member experience, Give each facility a branded app without rebuilding every feature natively, Native shell plus partner-built microapps and live updates, Ionic says partners can ship changes faster and with less native rewrite overhead, Public sources do not quantify defect rates release governance or support load]
      - [Sell employer wellness access, Combine gym access with training programs and operator reach, Wellpass plus EGYM technology expansion into new geographies, Playlist says new investment backs AI and geographic expansion, No public employer NRR claims or post-merger cross-sell metrics]
    notes: Benefits are documented mostly as company or partner claims; public sources do not provide cohort-level ROI, deployment timing, or renewal data.
    claimRefs: [CE004, CE008, CE009, CE011, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Assessment and onboarding, Establish baselines and launch personalized programs, Fitness Hub hardware trainer workflow and body-analysis inputs, Space calibration and implementation burden are not publicly quantified]
      - [Connected training hardware, Generate workout data and automate guided exercise, Installed smart equipment plus third-party cardio compatibility, Capex retrofit scope and support model vary by site and are not public]
      - [Cloud and AI orchestration, Aggregate workout data and generate tailored programs, Reliable cross-device data capture and model tuning, No public uptime SLA model-governance or data-quality disclosure]
      - [Branded app and extension layer, Extend the member and partner experience beyond the gym floor, APIs release channels partner engineering resources and app-store operations, Public sources do not verify security review privacy architecture or permission controls]
      - [Operator and network layer, Tie facility operations to commercial and wellness distribution, Customer-success services Business Suite workflows and Wellpass relationships, Realized ROI depends on rollout execution and post-merger coordination that public sources do not quantify]
    notes: This architecture map reflects only publicly documented components; security, privacy, and reliability controls remain under-disclosed in the assigned evidence.
    claimRefs: [CE001, CE003, CE008, CE009, CE013, CE015]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public sources show a multi-layer stack that starts on the gym floor and expands into cloud, app, and wellness-network workflows.
    data:
      layers:
        - label: Assessment & onboarding
          detail: Fitness Hub creates intake baselines and program entry points for new members.
          modules:
            - Fitness Hub
            - Body composition intake
          outputs:
            - Baseline assessment
            - Program setup
        - label: Connected equipment
          detail: Smart Strength and Smart Cardio capture guided workouts inside the facility.
          modules:
            - Smart Strength
            - Smart Cardio integrations
          outputs:
            - Connected workout data
            - In-club training execution
        - label: Cloud & data layer
          detail: EGYM Cloud centralizes workout and performance data across the ecosystem.
          modules:
            - EGYM Cloud
            - Analytics
          outputs:
            - Performance insights
            - Shared data model
        - label: Personalization layer
          detail: Genius AI turns captured data into individualized training plans.
          modules:
            - EGYM Genius
            - Personalized programming
          outputs:
            - Tailored plans
            - Progress recommendations
        - label: App & extension layer
          detail: Branded apps and partner microapps extend the experience outside the machine footprint.
          modules:
            - Branded member app
            - Partner microapps
            - Live updates
          outputs:
            - Facility-specific digital experience
            - Faster feature deployment
        - label: Operator & wellness layer
          detail: Business Suite and Wellpass connect club operations to employer and partner channels.
          modules:
            - Business Suite
            - Customer success workflows
            - Wellpass
          outputs:
            - Operator coordination
            - Employer distribution
    approximationNotes: This is a structural synthesis from public product pages, partner materials, and launch coverage; it is not a vendor-published system diagram.
    claimRefs: [CE001, CE003, CE004, CE008, CE009, CE011]
callouts:
  - calloutType: insight
    title: Breadth is the moat
    body: >-
      EGYM's strongest product asset is not a single AI feature; it is the
      combination of connected hardware, onboarding, apps, operator tooling,
      and employer distribution that makes the stack harder to replace module
      by module.
    claimRefs: [CE001, CE003, CE008, CE011, CE013]
  - calloutType: risk
    title: Enterprise-readiness proof is thinner than commercial proof
    body: >-
      Public evidence supports packaging, launches, and partner extensibility
      better than it supports security, privacy, uptime, or implementation
      economics, so those areas should be first-line technical diligence asks.
    claimRefs: [CE013, CE014, CE015]
