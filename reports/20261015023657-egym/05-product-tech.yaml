  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Public proof of security certifications, privacy architecture, data-segregation controls, incident reporting, and uptime/status commitments for the product stack.
      whyItMatters: Enterprise buyers and diligence teams need to know whether EGYM's connected-equipment and app layers meet security and compliance expectations before underwriting rollout at scale.
      diligencePath: Request security architecture diagrams, certification letters, subprocessor and data-hosting detail, incident history, and contractual SLA language from EGYM.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: No GitHub, package-registry, API-forum, or practitioner-community proxy evidence in the assigned pool shows external developer adoption or integration quality.
      whyItMatters: EGYM's extensibility story depends on partner development and integrations, so missing practitioner evidence limits confidence in how repeatable that model is outside curated case studies.
      diligencePath: Ask for developer documentation access, API-change logs, partner engineering references, and public or private implementation examples beyond the Ionic case study.
    - type: private-evidence-only
      severity: material
      topic: implementation-economics
      missingEvidence: Public materials do not quantify deployment timelines, integration cost, support staffing, migration effort, or realized ROI by installation cohort.
