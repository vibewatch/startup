            body: >-
              里程碑记录足以勾勒出真实的公司发展轨迹，而不是静态画像。EGYM 成立于 2010 年，2011 年已有 HTGF 进入股权结构表，2022 年拓展 Wellpass 并收购 Gymlib，随后于 2023
              年完成大额 Series F 融资。2026 年 3 月，独立报道突出介绍了 Smart Strength Series 3 和 Fitness Hub seca 的新产品发布；数日后，公司完成 Playlist
              合并。本证据池的主要警示并非诉讼或监管行动，而是执行和产品完整性的不确定性。一份竞争对手比较称，实时团体心率展示、门禁控制等部分互动层能力并未在 EGYM
