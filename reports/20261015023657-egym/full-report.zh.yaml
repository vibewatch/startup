  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方架构
        blocks:
          - type: paragraph
            body: >-
              留存来源描述的 EGYM，与其说是单一设备供应商，不如说是服务健身房、健康设施以及如今更广泛合并健康业务的操作系统层。EGYM
              自有页面将核心工作流定义为：为设施运营商提供联网设备、软件、数据和会员指导；Playlist 则把相邻范围扩展到软件、消费者预约和雇主健康福利。因此，相关市场边界包括运营商软件和联网训练工作流、通过
              Wellpass
              提供的雇主赞助访问，以及合并后向相邻健康软件渠道的交叉销售；不包括急性医疗服务，也不包括与运营商工作流、雇主福利或联网健身场地无关的泛健康消费。公开证据也足以勾勒买方地图：运营商购买技术栈，雇主为
              Wellpass 福利买单，终端用户则通过设施或雇主赞助的访问消费体验，而不是把 EGYM 当作纯消费者应用直接购买。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
