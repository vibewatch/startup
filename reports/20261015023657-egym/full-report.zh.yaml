  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 当前公开证据支持这是一项已形成规模的资产，但定价透明度不足，尚不能从跟踪转为买入。
    data:
      nodes:
        - label: 规模证明
          value: 7.5M monthly active exercisers; 33,000 locations; 20,000+ employers
          note: 当前公司披露显示平台触达面广。
        - label: 历史估值证明
          value: $1.2B Sep 2024 mark; $130M Jul 2023 revenue at 5.3x
          note: 独立运营的 EGYM 在合并前已有融资支持。
        - label: 当前交易锚点
          value: $7.5B combined EV; $785M new equity; >$800M 2025 revenue
          note: 公开定价目前对应合并后的 Playlist-EGYM 载体层面。
        - label: 倍数检验
          value: about 9.4x implied EV/revenue versus listed public comp range of 0.6x-3.6x
          note: 已宣布的估值高于已披露的上市可比公司水平。
        - label: 尽调阻力
          value: no standalone purchase price, no public cap table, no reconciled segment margins or retention
          note: 目录估算和竞争对手批评扩大了不确定性折价。
        - label: 建议
          value: Track / medium confidence / high risk / stretched
          note: 等待更好的入场条款或管理层级别的尽调证据。
    approximationNotes: 9.4 倍是隐含 EV/收入倍数的最低值，由 75 亿美元企业价值除以超过 $800 million 的 2025 年净收入得出。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV010
      - CV011
      - CV016
