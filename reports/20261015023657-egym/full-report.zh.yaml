              - CM011
              - CM012
      - number: '2.2'
        title: 受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              公开记录支持按当前覆盖面测算，而不足以构建干净的外部 TAM/SAM/SOM 体系。EGYM 当前披露了月活跃锻炼者、联网地点和合作伙伴等运营商侧及使用侧触达指标；Playlist 则增加了合并后的
              Mindbody 商家、ClassPass 场所和 Wellpass 雇主合作伙伴数量。HTGF 的 2023 年融资披露还提供了较旧但仍有用的 Wellpass
              雇主访问视角，包括符合条件的员工和参与企业。这些数字共同显示出 EGYM 在运营商基础设施和雇主分发两端的真实市场存在，但单位不可直接比较，也不能按地理区域拆出总支出、预算口径的 SAM 或现实
              SOM。实际结论是：EGYM 已证明自己拥有跨多个渠道的分发广度，但接下来的投资判断工作，是把覆盖面转化为以预算金额计的市场规模和采用率假设。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
