              - CM008
              - CM009
      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              管理层的采用逻辑是把运营商软件、智能设备、AI 驱动编程和雇主健康福利合并到单一工作流，再借助 Playlist 合并把这套组合带到新的地域和客户群。独立媒体 Fitt Insider
              的报道支持一个方向性趋势：运营商越来越希望联网基础设施把个性化变成标准，并更容易证明进展。留存证据中最大的警示不是需求缺失，而是采用摩擦：一名竞争对手认为 EGYM
              仍然以设备为主，需要场地布局决策和资本预算；已经拥有混合设备或近期刚完成设备融资的俱乐部，部署可能因此放慢。这并不否定市场机会，但意味着估值应更多取决于预算归属、部署时间和交叉销售转化，而不是泛泛的健康 TAM
              叙事。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 边界以工作流为核心，而非泛健康 TAM
            body: 最有力的公开证据通过运营商工作流、雇主赞助访问和合并后的健康软件相邻领域定义 EGYM 市场；相比引用整个健康或医疗市场，这个边界更窄，也更适合投资判断。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM011
          - type: callout
            title: 资本周期摩擦可能拖慢采用
            body: 留存池中的主要反向信号是：EGYM 的价值主张仍可能要求设备和场地重新配置。因此，一些俱乐部可能等到下一轮资本周期才采用，或先把 EGYM 与相邻软件搭配，而不是立即标准化。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 真正的竞争集合比智能设备更广
        blocks:
          - type: paragraph
            body: >-
              现有证据显示，EGYM 在健身房和健康业务栈的多个环节争夺同一笔预算。EGYM 官方页面把公司呈现为连接训练、数据和业务流程的操作系统，而非单一设备 SKU。HTGF 和 Playlist 都通过把 EGYM
              Technology 与 Wellpass 雇主网络连接起来，进一步证明了这一广度；Playlist 公告还把战场延伸到软件、预约和消费者需求平台。买方因此可以选择全栈 EGYM
              部署、相邻软件平台、更窄的点解决方案，或者继续使用现有设备与独立互动工具组成的混合栈。
            claimRefs:
