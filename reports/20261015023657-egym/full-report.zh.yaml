      - number: '3.2'
        title: 能力广度伴随部署与预算取舍
        blocks:
          - type: paragraph
            body: >-
              EGYM 的公开叙事强调整合广度，但本证据池中最清晰的竞争攻击集中在成本和价值实现速度。Uptivo 的比较页面由供应商撰写，并非独立来源，但仍能说明竞争对手如何框定购买决策：EGYM
              是依赖联网机器和馆内站点的设备主导路径，而可穿戴设备主导的层则能叠加在现有场地之上。该比较还称，实时心率课程、预约、支付、门禁和商业智能仪表盘等部分工作流可以模块化销售。由于 EGYM
              经审阅的官方页面没有公布目录价，公开比较最能说明的是部署形态和工作流范围，而不是已验证的价格点。
            claimRefs:
              - CP010
              - CP011
              - CP014
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.3'
        title: EGYM 成为俱乐部整合层后，切换成本会上升
        blocks:
          - type: paragraph
            body: >-
              EGYM 在公开来源中最强的护城河信号，不只是硬件覆盖面，还有安装后能够吸收的俱乐部工作流数量。公司称其生态覆盖 7.5 million 月活跃锻炼者、33,000 个地点和 200 个联网合作伙伴；Tracxn
              则展示了其通过收购扩大门禁和企业健康业务触达面的历史。Ionic 案例研究补充了重要运营细节：合作健身房可以在品牌外壳之上开发微应用，并使用 EGYM
              API，而不必触碰核心代码。这会提高粘性，因为数据流、合作伙伴扩展和品牌会员体验都更难拆除，尽管定制化也会增加交付负担。
            claimRefs:
              - CP003
              - CP007
              - CP012
              - CP013
