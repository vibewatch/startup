companyProfile:
  summary: >-
    EGYM 是一家总部位于慕尼黑的联网健身与企业健康平台，销售智能健身设备、AI 指导训练软件、品牌化会员体验，并通过 Wellpass 提供雇主赞助的健康福利。2026 年 3 月合并后，公司已纳入
    Playlist；合并平台企业价值达到 $7.5 billion 并获得新资本，但公开披露对 EGYM 的独立经济状况、治理细节和当前现金生成能力仍只呈现出部分信息。
  foundedDate: 2010-01-01T00:00:00.000Z
  founders:
    - name: Philipp Roesch-Schlanderer
      role: 联合创始人兼 CEO
      background: 他带领 EGYM 从早期智能健身房和软件建设走到当前合并后的运营架构。
  foundingLocation: Munich, Germany
  headquarters: Munich, Germany
  productSummary: 联网健身硬件、AI 编程、运营商软件、品牌会员应用，以及 Wellpass 企业健康网络。
  customerFocus: 健身运营商、医疗健康设施、雇主，以及通过这些网络训练的终端用户。
  businessModel: 面向企业销售联网设备和软件，同时提供雇主赞助的健康福利及相邻平台服务。
  stage: Playlist subsidiary after March 2026 merger
  fundingStatus: 2026 年 3 月 Playlist 合并对合并后企业估值为 $7.5 billion，并新增 $785 million 股权；历史上 2023 年 Series F 融资规模最高达 €207 million。
