  - id: TV003
    title: 看涨 / 基准 / 看跌情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 看涨
        - Playlist 的交叉销售奏效，EGYM 继续拓展北美和亚洲市场，且管理层能证明 2025 年的盈利会随着雇主和运营商的经常性使用而扩大。
        - 当前偏高的 headline 倍数只有在合并后的披露显示出相较历史独立估值更优的、类似软件公司的留存和利润率扩张时才能维持。
        - 集成执行、监管审批，以及尚未公开的收购价格分配仍然重要。
        - 需要私有证据证明 NRR 强劲、分部利润率良好且股权结构条款清晰。
      - - 基准
        - EGYM 仍具战略价值，但公开证据仍局限于公司控制的披露、历史融资和合并公司层面的宽泛指标。
        - 当前载体值得跟踪，但透明度不足，无法仅凭公开来源判断目标回报。
        - 在这些经济成果得到外部验证前，投资者可能已经在为协同效应和 AI 期权价值买单。
        - 与当前证据集最为一致。
      - - 看跌
        - 运营商采用速度比合并故事暗示的更慢或更耗资本，而合并公司披露始终无法还原 EGYM 的独立经济状况。
        - 如果合并载体最终向成熟上市可比公司的倍数或更弱的增长预期靠拢，当前入场价格会显得昂贵。
        - 倍数压缩、合并后续约疲弱和融资悬置将推动下行。
        - 合并载体隐含的 9.4 倍以上收入倍数与较低的上市可比公司区间之间的差距支持这一判断。
    notes: 由于公开记录没有披露 EGYM 的独立收购价格、合并后的分部利润率，或 $785 million 融资背后的新优先股堆叠，情景区间只能定性描述。
