    - CO010
chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              EGYM 将自己定位为一家致力于把医疗健康从“修复”转向预防的健身科技公司；现有证据中的营销材料和交易披露都支持这一定位。其核心模式有两条主线：EGYM Technology
              向健身和健康设施销售联网设备与软件；EGYM Wellpass 汇集雇主赞助的健身和健康场所访问权限。最清晰的当前阶段标志是 2026 年 3 月合并完成，此后 EGYM 成为 Playlist
              旗下子公司。由此，后续章节有了明确的身份锚点：EGYM 不再是独立的早期创投资产，而是在更大平台内贡献硬件、软件和企业健康分发能力的运营业务。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              领导层延续性集中在 Philipp Roesch-Schlanderer 身上；在本次证据中，他仍是最显眼的运营者，连接着旧 EGYM 与新的 Playlist 母公司架构。合并材料也把 Playlist CEO
              Fritz Lanman 纳入同一套创始人主导的控制叙事；Roesch-Schlanderer 则与 Monti Saroya
              共同担任母公司联席主席。战略集中于少数运营者兼赞助方，而不是由广泛披露的独立董事会主导。公开材料清楚列出了创始人和赞助方角色，但没有完整董事名单、现任 CFO 披露或 EGYM
              合并后的更新治理页面，因此治理完整性仍是待尽调事项。
            claimRefs:
              - CO004
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO010
              - CO014
      - number: '1.3'
        title: 融资、估值与规模指标
        blocks:
          - type: paragraph
            body: >-
              当前最清晰的资本标志是合并完成：Playlist 表示交易带来 $785 million 新股权，并将合并企业估值定为 $7.5 billion。作为历史背景，HTGF 称 EGYM 于 2023 年 7
              月完成最高 €207 million 的 Series F 融资，其中 €107 million 立即到账，另有 €100 million
              可用于未来投资。公开规模指标有意义，但年份和分母并不一致。合并披露提到超过 20,000 个雇主合作伙伴和数以万计的地点；EGYM 当前生态页面则宣传 7.5 million 月活跃锻炼者、33,000 个地点和
              200 个联网合作伙伴。当前 EGYM 独立收入 run rate、毛利率、现金状况及合并后准确员工数仍未披露。
            claimRefs:
