  - id: TV002
    title: 正论 / 反论表
    columns:
      - 立场
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 论点
        - 合并后的平台披露 2025 年净收入超过 $800 million，且盈利能力强，因此这是一项已经形成规模的资产，而非投机性标的。
        - 如果审计后的分部收入和利润率披露显示 EGYM 能持续贡献高利润率的经常性业务收益，投资信心会增强。
      - - 论点
        - EGYM 披露拥有超过 20,000 个雇主合作关系、数万个健身场馆、750 万月活跃锻炼者和 33,000 个场馆，说明其在健康管理和运营工作流两端都已广泛落地。
        - 独立的留存、使用率和续约数据，能证明这些覆盖面已经转化为持久的客户价值，而不是广泛但浅层的使用。
      - - 论点
        - 历史融资显示，EGYM 在 2024 年 9 月完成过 12 亿美元的独立估值，早先也有增长和盈利信号，因此合并前业务已有融资支持。
        - 如果有证据表明合并后的实体在交易完成后保住或扩大了这些经济成果，当前载体会更容易估值。
      - - 反方论点
        - 已宣布的合并载体隐含收入倍数至少约为 9.4 倍，明显高于 Multiples 列出的数家已披露上市可比公司的 EV/收入数据。
        - 更低的实际入场价格，或证明 EGYM 应享有结构性高于这些上市可比公司的倍数，都能缓解估值过高的担忧。
      - - 反方论点
        - 公开证据没有披露合并交易中 EGYM 的独立收购价格，因此投资者无法拆分自己究竟是在为 EGYM 还是更广泛的 Playlist 平台付费。
        - 管理层披露购买价分摊、分部贡献或内部估值桥接，将提高价格透明度。
      - - 反方论点
        - 外部来源指出资本密集度和规模估算并不一致；公开数据可能低估了采用阻力，或高估了历史 EGYM 估值与当前合并载体之间的可比性。
        - 私募尽调若能证明低流失率、强运营商 ROI 和一致的集团层面报告，将缩小执行与披露折价。
    notes: 这张表混合了公司、合作伙伴、竞争对手和二级市场数据证据；每一行都应作为投资判断视角，而不是已确认的预测来理解。
