  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开来源展示了一套多层技术栈：从健身房地面起步，延伸至云端、应用和健康网络工作流。
    data:
      layers:
        - label: 评估与入门
          detail: Fitness Hub 为新会员建立初始基线和训练计划入口。
          modules:
            - Fitness Hub
            - 体成分采集
          outputs:
            - 基线评估
            - 计划设置
        - label: 联网设备
          detail: Smart Strength 和 Smart Cardio 在场馆内采集引导式训练数据。
          modules:
            - Smart Strength
            - Smart Cardio 集成
          outputs:
            - 联网训练数据
            - 俱乐部内训练执行
        - label: 云与数据层
          detail: EGYM Cloud 在整个生态中集中管理训练和表现数据。
          modules:
            - EGYM Cloud
            - 分析
          outputs:
            - 表现洞察
            - 共享数据模型
        - label: 个性化层
          detail: Genius AI 将采集的数据转化为个性化训练计划。
          modules:
            - EGYM Genius
            - 个性化编程
          outputs:
            - 定制计划
            - 进度建议
        - label: 应用与扩展层
          detail: 品牌会员应用和合作伙伴微应用将体验延伸到设备覆盖范围之外。
          modules:
            - 品牌会员应用
            - 合作伙伴微应用
            - 实时更新
          outputs:
            - 场馆专属数字体验
            - 更快的功能部署
        - label: 运营商与健康福利层
          detail: Business Suite 和 Wellpass 将俱乐部运营连接至雇主和合作伙伴渠道。
          modules:
            - Business Suite
            - 客户成功工作流
            - Wellpass
          outputs:
            - 运营商协同
            - 雇主分发
    approximationNotes: 这是基于公开产品页面、合作伙伴材料和发布报道做出的结构性归纳，并非供应商发布的系统图。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE008
      - CE009
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从获客到扩张的公开可见客户路径。
    data:
      items:
        - label: 雇主或运营商获客
          actor: 雇主福利采购方或健身房运营商
          touchpoints:
            - Wellpass 向公司销售；EGYM Technology 向设施销售
            - 即使终端用户是员工或会员，付款方仍是 B2B 客户
        - label: 网络接入 / 部署
          actor: 设施运营商和会员
          touchpoints:
            - 员工获得合作健身和健康设施的访问权限
            - 运营商部署智能设备、有氧运动集成和数字服务
        - label: 入门与评估
          actor: 教练、设施员工和会员
          touchpoints:
            - EGYM 将生态定位为设施的一套操作系统
            - 官方材料强调引导式训练和数据驱动的指导
        - label: 持续使用
          actor: 健身房会员或员工参与者
          touchpoints:
            - 750 万月活跃锻炼者是当前最明确的使用标志
            - 公开材料强调个性化、可见的进步，以及训练场地内外的支持
        - label: 运营商赋能
          actor: 健身房运营商和合作伙伴开发者
          touchpoints:
            - 专属客户成功团队、现场培训和频繁更新都是销售叙事的一部分
            - Ionic 称，合作健身房可以基于 EGYM 的外壳应用和 API 构建自己的微应用
        - label: 扩张循环
          actor: 联网合作伙伴和相邻客户群
          touchpoints:
            - 与 Spirit Fitness 和 Life Fitness 的有氧设备集成扩大了可服务场地
            - 开放生态扩张已经可见，但公开续约和集中度指标仍然缺失
