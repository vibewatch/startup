      topic: capitalization
      missingEvidence: >-
        Fully diluted capitalization, Series B security terms, liquidation preferences,
        participation, anti-dilution rights, option-pool changes, warrants, debt covenants,
        maturity schedule, and committed capital expenditure.
      whyItMatters: >-
        Headline post-money value and funding raised do not determine investor proceeds,
        effective ownership, liquidity, or remaining financing need.
      diligencePath: >-
        Review the signed financing documents, current cap table, debt agreements, board
        consents, capital-expenditure commitments, and a security-by-security exit waterfall.
      relatedQuestionRefs: [QV003, QV004]
      relatedTableRefs: [TV001, TV003]
    - type: missing-source
      severity: material
      topic: commercial-proof
      missingEvidence: >-
        Independent production benchmarks, customer renewal cohorts, workload migration costs,
        realized pricing, service-level performance, and attributable customer economics.
      whyItMatters: >-
        Company and partner performance claims do not establish durable customer value,
        switching economics, or competitive margin.
      diligencePath: >-
        Commission reproducible workload benchmarks and interview reference customers using
        production-scale deployments under permissioned data-sharing terms.
      relatedQuestionRefs: [QV001, QV004, QV005, QV008]
      relatedTableRefs: [TV002, TV003]
    - type: private-evidence-only
      severity: material
      topic: exit-readiness
      missingEvidence: >-
        Board composition, investor-control rights, audited reporting cadence, internal-control
        maturity, IPO preparation, secondary liquidity, and management's credible exit timetable.
      whyItMatters: >-
        Exit timing and governance quality affect hold period, dilution risk, marketability, and
        the probability that private valuation can convert into realized returns.
      diligencePath: >-
        Interview the CFO and board, inspect governance documents and audit materials, and obtain
        the current exit-readiness plan with milestones and responsible owners.
      relatedQuestionRefs: [QV007, QV008]
      relatedTableRefs: [TV001]
