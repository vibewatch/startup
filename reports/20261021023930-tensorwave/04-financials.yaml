    rows:
      - ["Annual revenue run rate", "$5M for 2024, attributed by a profile to NextPlatform", "Low; secondary attribution", "Only public run-rate datapoint found; it is not ARR", "Reconcile to audited revenue and monthly exit run rate"]
      - ["Separate revenue estimate", "$7,015,510, attributed by a profile to Prospeo; period unstated", "Low; estimate with unclear period", "Cannot be compared cleanly with the 2024 run-rate figure", "Provide audited period revenue and explain estimate methodology"]
      - ["Online accelerator base", "8,192 MI325X GPUs online, company-claimed in June 2026", "Medium; company-issued", "Capacity can generate revenue only when contracted and utilized", "Provide paid utilization, uptime, depreciation or lease cost, and revenue per GPU"]
      - ["Operating and leased power", "Independent report: 14 MW operating and leases covering 500 MW", "Medium; secondary report citing another publication", "Shows a large gap between operating and committed expansion capacity", "Provide energized, contracted, paid, and optioned capacity by site"]
      - ["Latest equity financing", "Proceeds earmarked for global infrastructure and MI355X clusters; remaining cash undisclosed", "Medium; company-issued use-of-proceeds statement", "Funds expansion but does not reveal remaining cash or obligations", "Provide cash balance, monthly burn, runway, debt, covenants, and committed capex"]
    notes: "Values preserve the source metric names and periods. Funding raised is not cash available, capacity is not utilization, and the two revenue figures are not treated as audited revenue or ARR."
