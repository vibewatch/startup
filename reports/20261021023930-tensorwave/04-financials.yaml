company:
  name: "TensorWave"
chapter:
  number: 4
  title: "Financials"
  summary: "TensorWave has raised substantial capital and disclosed meaningful infrastructure scale, but the public record does not expose realized pricing, audited revenue, gross margin, cash burn, cash balance, or runway. The financial case therefore rests on unverified utilization and cost-efficiency assumptions rather than underwriteable unit economics."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue model and monetization"
    body: >-
      TensorWave presents an infrastructure-service model built around AMD GPU capacity rather than a conventional software subscription. Public offerings include bare-metal compute, managed inference, high-speed storage, monitoring, and hands-on engineering support, so revenue could combine reserved capacity, metered usage, managed endpoints, storage, and support. The reviewed website routes buyers to a sales conversation and publishes no list rate, contract term, discount schedule, or realized price. AMD promotes up to 70% lower inference cost per million tokens, but that is a supplier-partner marketing claim, not evidence of TensorWave's realized price, revenue, or gross margin. Without contracts or invoices, the bridge from customer activity to recognized revenue remains directional rather than quantified.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "traction-and-sales-efficiency"
    title: "Traction and sales efficiency"
    body: >-
      Public operating signals are substantial but not directly convertible into recurring revenue. A June 2026 company release said 8,192 MI325X GPUs were online, more than 2 gigawatts of long-term data-center capacity had been secured, and Fireworks AI and Luma AI were using the platform. Independent coverage reported roughly 10,000 GPUs across three data centers and 14 megawatts of operating capacity, with leases covering 500 megawatts and an ambition to reach 2 gigawatts. These figures demonstrate deployment and pipeline scale, not paid utilization, contracted backlog, retention, or sales efficiency. No public evidence gives CAC, payback, sales cycle, bookings conversion, logo churn, NRR, channel take rate, or customer concentration.
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI009"
    tableRefs:
      - "TI003"
  - id: "capital-intensity-and-financing"
    title: "Capital intensity and financing dependency"
    body: >-
      TensorWave said its latest equity-financing proceeds would expand global infrastructure and deploy MI355X clusters. That financing supports growth but is not evidence of current cash available: public sources do not disclose cash already spent, debt balances, equipment-finance obligations, lease commitments, covenants, burn, or runway. Even cumulative funding is not settled; two independent profiles report $450 million-plus and $493 million respectively. The adverse case is structural. Independent coverage notes that specialized AI clouds face high capital requirements, equipment commitments, financing costs, and utilization risk, while TensorWave's AMD-only model also concentrates supplier exposure. A forward liquidity judgment therefore requires private evidence.
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI012"
      - "CI013"
      - "CI015"
  - id: "financial-verdict-and-diligence"
    title: "Financial verdict and diligence priorities"
    body: >-
      Revenue quality and margin durability cannot yet be underwritten from the public record. One independent profile attributes a $5 million annual revenue run rate for 2024 to NextPlatform, while also listing a separate $7,015,510 revenue estimate from Prospeo without a stated period; neither is audited company disclosure, and neither should be treated as ARR. The same reviewed evidence provides no audited 2025-2026 revenue, gross margin, operating loss, cash burn, cash balance, or runway. The central diligence test is whether contracted, paid utilization can cover accelerator depreciation or lease expense, power, facilities, network, support, and financing costs while sustaining renewal quality. Until management supplies reconciled financials and customer-level cohort evidence, the financial verdict remains high-growth potential with material capital and margin uncertainty.
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI014"
      - "CI016"
