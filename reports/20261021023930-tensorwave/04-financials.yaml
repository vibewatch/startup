  - calloutType: "recommendation"
    title: "Condition underwriting on private financial evidence"
    body: "Require audited monthly financials, customer-level contracted utilization, revenue cohorts, gross margin by service, asset and lease schedules, debt terms, committed capex, cash balance, and a downside liquidity case."
    claimRefs:
      - "CI014"
      - "CI016"
