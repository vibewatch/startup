    title: Market definition and substitute boundary
    columns:
      - Segment or category
      - Included spend or role
      - Excluded spend
      - Buyer or payer
      - Relevance to TensorWave
    rows:
      - - AMD-specialized GPU cloud
        - Managed AMD Instinct compute, storage, orchestration, monitoring, and engineering support for AI/HPC
        - Unrelated general-purpose compute and non-accelerated cloud services
        - AI infrastructure leader; enterprise or AI-company compute budget
        - Core market
      - - General-purpose cloud GPU services
        - Comparable training or inference workloads that could move to specialized infrastructure
        - General cloud spend with no accelerator workload
        - Cloud platform owner; enterprise cloud budget
        - Adjacency and status-quo alternative
      - - NVIDIA-centered specialized clouds
        - Equivalent GPU capacity, managed clusters, and inference services
        - Provider revenue unrelated to workloads TensorWave can technically serve
        - ML platform or infrastructure lead; compute budget
        - Direct substitute and pricing benchmark
      - - Self-hosted or colocated accelerators
        - Internal-build alternative for organizations willing to own hardware and operations
        - Non-AI data-center infrastructure
        - CIO, infrastructure leader, or research institution
        - Capital-intensive substitute
    notes: "Boundary is analytical rather than a publisher-defined market size; no retained source supplies comparable revenue for each segment."
    claimRefs:
      - CM001
      - CM003
      - CM010
      - CM013
      - CM014
  - id: TM002
    title: Capacity and category proxies for market sizing
    columns:
      - Publisher and period
      - Reported measure
      - What it indicates
      - Confidence
      - Limitation
    rows:
      - - TensorWave release; 2026-06-10
        - "8,192 MI325X GPUs online; more than 2 GW of long-term data-center capacity secured"
        - Current company-claimed fleet and long-horizon supply ambition
        - Medium
        - Company-issued; online GPUs and secured power are not revenue TAM
      - - TechTimes; 2026-06-11
        - "About 10,000 AMD GPUs across three data centers and 14 MW; 500 MW leased with a 2 GW aim"
        - Independent report of operating scale and expansion commitments
        - Medium
        - Cites another publication; leased or targeted power is not utilized capacity
      - - ClusterBid; Q2 2026
        - "Approximately 3,000 MI300X GPUs across Dallas and Phoenix; Frankfurt under construction"
        - Model-specific fleet estimate and geographic footprint
        - Low
        - Conflicts with newer or differently scoped fleet snapshots; methodology is not disclosed
      - - Tracxn; accessed 2026-10-21
        - "579 active competitors, including 89 funded"
        - Broad category crowding and availability of alternatives
        - Low
        - Taxonomy is much broader than AMD-specialized GPU cloud and is not a spending estimate
    notes: "Measures have different units, dates, model scopes, and denominators; they are preserved as separate sizing lenses and are not aggregated."
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM014
      - CM015
  - id: TM003
    title: Segment, buyer, user, and adoption map
    columns:
      - Segment
      - Buyer and budget owner
      - Primary user
      - Workflow
      - Adoption trigger and constraint
    rows:
      - - AI-native model builders
        - CTO or infrastructure lead; compute budget
        - ML infrastructure and model engineers
        - Large-model training and production inference
        - Capacity and memory economics; constrained by portability and reliability proof
      - - Enterprise AI programs
        - CIO, VP of AI, or cloud platform owner; enterprise cloud budget
        - ML platform and application teams
        - Move from experimentation to production deployment
        - Support, security, and predictable cost; constrained by procurement and CUDA dependence
      - - Cost-sensitive PyTorch teams
        - Technical founder or engineering lead; product infrastructure budget
        - Training and inference engineers
        - PyTorch training or batched inference on memory-intensive models
        - Lower quoted GPU-hour cost; constrained by workload-specific performance
      - - Research and academic users
        - Principal investigator or compute lead; institutional or grant budget
        - Researchers and HPC practitioners
        - Training, fine-tuning, embedding, and retrieval workloads
        - Access to specialized compute; constrained by migration effort and support requirements
    notes: "Buyer roles are inferred from the retained sources' described customer groups and adoption mechanics; no procurement records or budget surveys were available."
    claimRefs:
      - CM002
      - CM008
      - CM009
      - CM010
      - CM012
      - CM016
figures:
  - id: FM001
    title: Evidence-constrained addressable-market narrowing
    type: pyramid
    summary: >-
      The reachable market narrows from broad AI/HPC infrastructure demand to production workloads that are portable to AMD and economically compelling on TensorWave.
    data:
      items:
        - label: Broad AI and HPC infrastructure demand
          value: Not quantified
          detail: The retained pool does not provide a comparable market-revenue estimate.
        - label: Specialized GPU-cloud workloads
          value: Core category
          detail: Training and inference demand that can use managed accelerator infrastructure.
        - label: Alternatives to NVIDIA-centered capacity
          value: Relevant adjacency
          detail: Buyers motivated by availability, price, or reduced single-vendor dependence.
        - label: AMD Instinct-compatible workloads
          value: Serviceable technical segment
          detail: Workloads that can run on AMD hardware and the ROCm software stack.
        - label: ROCm-ready memory-intensive workloads
          value: Best-evidenced fit
          detail: PyTorch training, batched inference, embedding, and retrieval workloads.
        - label: TensorWave obtainable production demand
          value: Not quantified
          detail: Customer count, utilization, retention, and contracted backlog are not disclosed.
    approximationNotes: "Qualitative narrowing only; layer widths and labels do not represent dollar values, conversion rates, or market shares."
    claimRefs:
      - CM001
      - CM003
      - CM009
      - CM010
      - CM015
