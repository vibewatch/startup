company:
  name: "TensorWave"
chapter:
  number: 6
  title: "Customers"
  summary: "TensorWave's clearest public customer proof is Moreh's use of MI355X infrastructure for frontier-LLM inference, including a company-hosted claim of roughly 75% faster model-weight downloads. The retained evidence otherwise describes a high-touch, sales-assisted buyer journey but does not disclose customer count, retention, contract duration, or concentration."
sections:
  - id: "customer-segments-and-buying-motion"
    title: "Customer segments and buying motion"
    body: >-
      Public evidence points to a specialized buyer rather than a broad self-serve cloud audience. TensorWave markets AMD Instinct and ROCm capacity for training and inference, while third-party profiles describe its users as AI developers, enterprises, research institutions, and cost-sensitive PyTorch teams. The likely economic buyer is an infrastructure, engineering, or procurement leader; the hands-on user is an ML or platform engineer; and the payer is the organization funding dedicated compute. This segmentation is directional, not a disclosed revenue mix: no retained source breaks customers out by vertical, geography, company size, or revenue band. Product materials emphasize hands-on solution engineering, and a company job repost describes both multi-tenant cloud and single-tenant bare-metal deployments, indicating that deployment architecture and support intensity are part of the commercial qualification process rather than incidental implementation details.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU007"
      - "CU008"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "adoption-and-reference-quality"
    title: "Adoption and reference quality"
    body: >-
      Moreh is the strongest named end-customer reference in the retained set. TensorWave's homepage says Moreh used MI355X capacity in a real production cloud for frontier-LLM inference and reports an approximately 75% reduction in model-weight download time. The accompanying customer quotation also says the work was still too early for broader customer metrics, which materially narrows what can be inferred: it supports a production workload and one technical outcome, but not fleet-wide utilization, recurring revenue, renewal, or generalized cost savings. RFP.wiki mentions published testimonials from Moreh and Higgsfield AI, yet supplies no verified review corpus and no sufficiently detailed Higgsfield deployment in the fetched text. AMD's case study validates the supplier relationship and evaluation route, but its reference to unnamed large AI customers is not a substitute for named TensorWave customer proof.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU010"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-expansion-and-concentration"
    title: "Durability, expansion, and concentration"
    body: >-
      The apparent journey is consultative: screen workloads for AMD and ROCm fit, request an evaluation, choose dedicated or managed architecture, port and tune the workload with solution engineers, move into production, then expand capacity if performance and reliability hold. That motion can create switching costs and expansion potential, but the public record does not establish that it does. TechTimes identifies reliability, compatibility, migration cost, and performance as the decision variables for moving production workloads, while RFP.wiki relays historical reports of interruptions and orchestration immaturity and ClusterBid describes CUDA-porting effort as a constraint. Most importantly, none of the retained sources discloses customer count, gross or net retention, logo churn, renewal rates, contract lengths, top-customer share, or channel-sourced revenue. Those omissions prevent a defensible view on durability or concentration and require direct cohort, contract, and billing evidence.
    claimRefs:
      - "CU009"
      - "CU011"
      - "CU012"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
