  topStrengths:
    - 聚焦 AMD 的差异化基础设施定位，并获得 AMD Ventures 的战略支持。
    - 2026 年 6 月完成大额融资，且加速器部署可见，说明公司具备执行扩张计划的能力。
    - 产品覆盖训练、推理、裸机、存储、监控和技术支持，范围较广。
  topRisks:
    - 对 AMD 和 ROCm 的集中依赖，把供应、路线图、软件兼容性和融资观感都绑在单一生态上。
    - 资本密集型扩张可能跑在签约利用率前面，而债务、租赁、契约和现金续航仍未披露。
    - 客户数量、集中度、留存率、合同期限，以及生产环境与试点客户的构成，尚未得到公开确认。
    - 基准测试、定价、收入、毛利率和工作负载经济性的说法，缺少经审计或可由独立方复现的支持。
  unresolvedGaps:
    - 经审计的 2025-2026 年收入、毛利率、经营亏损、现金余额、现金消耗和续航。
    - 按客户拆分的签约利用率、集中度、留存率、积压订单质量和生产使用构成。
    - 债务、设备融资、租赁、电力、契约、已承诺资本开支和担保受偿顺序条款。
    - 针对目标工作负载的独立基准测试，包括迁移投入、可靠性和总成本。
    - 当前股权结构表、董事会构成、投资人控制权和继任安排。
