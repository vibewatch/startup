  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Evidence moves from strategic scale signals through proof gaps and risk to a research-more decision.
    data:
      nodes:
        - id: scale
          label: $350M Series B / $1.55B post-money
          detail: A current financing reference, not proof of operating value.
        - id: differentiation
          label: AMD-exclusive infrastructure
          detail: Strategic differentiation with concentrated supplier exposure.
        - id: proof
          label: Public proof gap
          detail: No audited revenue, margin, utilization, retention, or unit economics.
        - id: risk
          label: Capital and software risk
          detail: Financing intensity and CUDA migration friction remain material.
        - id: discipline
          label: Price and terms discipline
          detail: Require cap-table, debt, preference, and deployment evidence.
        - id: decision
          label: Research more
          detail: No evidence-grounded valuation range is supportable.
      edges:
        - from: scale
          to: differentiation
        - from: differentiation
          to: proof
        - from: proof
          to: risk
        - from: risk
          to: discipline
        - from: discipline
          to: decision
    approximationNotes: >-
      The sequence expresses decision logic only; it does not imply probability, magnitude, or a quantitative conversion
      between stages.
    claimRefs:
      - CV002
      - CV008
      - CV009
      - CV013
      - CV016
