chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              TensorWave is a private AI and high-performance-computing cloud company founded in 2023 and based in Las
              Vegas. Its positioning is unusually concentrated: it builds cloud infrastructure around AMD Instinct
              accelerators rather than operating a multi-vendor GPU fleet. Public descriptions consistently identify
              training, fine-tuning, inference, bare-metal access, managed inference, storage, and liquid-cooled
              infrastructure as the core offer. This gives the company a legible wedge for customers seeking high-memory
              compute or an alternative to Nvidia-centered infrastructure, but it also makes AMD hardware availability
              and the ROCm software ecosystem central execution dependencies. Public evidence is sufficient to establish
              the business category and headquarters, not to verify customer count, revenue, utilization, or
              profitability.
            claimRefs:
              - CO001
              - CO003
              - CO014
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: Founder leadership and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The operating leadership is founder-led. Darrick Horton is identified as chief executive, Jeff Tatarchuk
              as chief growth officer, and Piotr Tomasik as president or chief operating officer across the retained
              profiles. That combination covers technical leadership, commercial development, and operations, while also
              concentrating the public company narrative in the founding team. The retained evidence does not disclose a
              current board roster, investor consent rights, voting control, related-party policies, or succession
              planning. Those omissions prevent a reliable assessment of institutional oversight or key-person
              mitigation. The leadership table is therefore a public-profile sample, not a complete management or board
              census, and the diligence priority is to obtain company-certified organization and governance records.
            claimRefs:
              - CO002
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
