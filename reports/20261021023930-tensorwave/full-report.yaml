  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              TensorWave should be evaluated inside specialized AI infrastructure rather than against all cloud
              computing spend. Its core category is managed AMD Instinct capacity for training, fine-tuning, inference,
              storage, orchestration, and monitoring; adjacent spend includes general-purpose cloud GPU services, while
              self-hosted accelerators and NVIDIA-centered neoclouds are substitutes for the same workload. The economic
              problem is access to performant accelerator capacity without accepting a single-vendor software and supply
              chain. That boundary is still broad: Tracxn's taxonomy places TensorWave among hundreds of active
              competitors, so category counts are evidence of crowding rather than a revenue opportunity. The narrower
              investable question is how much production demand is both technically portable to ROCm and willing to bear
              migration and supplier-concentration risk.
            claimRefs:
              - CM001
              - CM003
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM010
              - CM013
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Available evidence measures TensorWave's supply footprint, not total market revenue. The June 2026 company
              release reports 8,192 MI325X GPUs online and more than 2 GW of long-term data-center capacity, while
              TechTimes reports roughly 10,000 AMD GPUs, three data centers, 14 MW of operating capacity, 500 MW of
              leases, and a 2 GW objective. ClusterBid instead estimates roughly 3,000 MI300X GPUs across two sites in
              the second quarter of 2026. These snapshots use different GPU models, dates, and capacity concepts, so
              they cannot be summed or converted into TAM. They demonstrate expansion ambition and possible demand, but
              installed GPUs, power rights, and market spending are different denominators. No retained source isolates
              serviceable revenue or TensorWave's obtainable share.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM010
              - CM015
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The best-evidenced buyers are AI-native model builders, enterprise AI programs, cost-sensitive PyTorch
              teams, and research users that need specialized training or inference capacity. Infrastructure leaders or
              technical founders choose the provider, machine-learning engineers use the service, and the organization
              ultimately pays through its cloud or compute budget. Adoption starts with workload compatibility and
              benchmarking, then progresses through migration, reliability validation, security review, and production
              scaling. Fireworks AI and Luma AI provide company-reported production examples, but the pool contains no
              customer denominator, retention measure, or production-versus-pilot split. TensorWave's public site claims
              enterprise certifications and support, yet those assertions do not substitute for independent procurement
              evidence or customer-level utilization data.
            claimRefs:
              - CM002
              - CM009
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by scarce accelerator access, pressure on GPU economics, high-memory workloads, and
              buyer interest in reducing dependence on NVIDIA. TensorWave's AMD-only focus can improve price-performance
              for selected workloads, but the independent benchmark evidence is thin and workload-specific. ClusterBid
              reports lower posted prices and advantages for large-batch inference, while AMD's case study repeats
              TensorWave and Modular performance claims and explicitly says AMD did not independently verify them. ROCm
              compatibility, CUDA-specific kernels, migration effort, reliability, and customer willingness to run core
              production workloads remain adoption constraints. AMD's investment may strengthen the ecosystem while also
              concentrating supplier exposure and creating circular-financing concerns. Valuation should therefore track
              independently verified utilization, contracted production demand, portability costs, and power-to-revenue
              conversion rather than announced capacity alone.
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capacity is not market size
            body: >-
              Online GPUs, megawatts, leased power, and long-term capacity rights are supply indicators with different
              denominators; none establishes demand, utilization, revenue, or obtainable share.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive field and relative scale
        blocks:
          - type: paragraph
            body: >-
              TensorWave competes in a crowded AI-infrastructure field rather than a clean two-player contest with
              Nvidia. Tracxn places CoreWeave, Together AI, FluidStack, Rescale, and Crusoe among relevant funded
              alternatives, while buyers can also remain with a general-purpose cloud or build and operate
              infrastructure internally. The selected competitors have very different business models and funding
              vintages, so funding is a scale signal rather than a product-quality ranking. TensorWave's reported $493
              million of total funding is meaningful for a young provider, but it is below several listed peers. At the
              same time, Data Center Dynamics and TechTimes report operating scale of thousands of AMD GPUs and multiple
              facilities. Those reports support a real deployment footprint, but company-originated multi-gigawatt
              capacity ambitions should not be read as installed or utilized capacity.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP010
              - CP011
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP010
              - CP011
      - number: '3.2'
        title: Capability wedge and buyer choice
        blocks:
          - type: paragraph
            body: >-
              TensorWave's clearest wedge is specialization rather than breadth. Its own site markets an AMD Instinct
              and ROCm platform spanning training, fine-tuning, and inference, and lists four accelerator generations.
              AMD's evaluation page adds memory capacity, partitioning, security, and hands-on engineering claims. This
              creates a credible option for workloads that value AMD memory capacity, supplier diversification, or
              direct optimization support. It does not establish superiority across all workloads. The retained evidence
              does not provide like-for-like security, reliability, networking, or support data for most competitors, so
              those cells remain unknown. Likewise, AMD's case study repeats large throughput and cost-saving claims but
              expressly says those claims were supplied by TensorWave or Modular and were not independently verified by
              AMD.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP011
      - number: '3.3'
        title: Pricing, packaging, and route to market
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is the weakest part of the comparison. ClusterBid publishes specific TensorWave,
              CoreWeave, and Lambda hourly prices, but the same page contains TensorWave scale and funding statements
              that conflict with stronger June 2026 reporting. Its price observations therefore remain low-confidence
              signals, not underwriting facts. The official TensorWave and AMD surfaces reviewed here emphasize
              evaluations, managed support, performance-per-dollar, and percentage savings rather than a public rate
              card, contract length, utilization minimum, egress charge, service credit, or realized discount. That
              sales-assisted motion may support workload-specific optimization, but it prevents a reliable
              apples-to-apples TCO comparison. Procurement diligence should obtain matched quotes for the same model,
              batch profile, availability target, networking, storage, and support envelope before treating headline
              GPU-hour prices as economic advantage.
            claimRefs:
              - CP004
              - CP005
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP012
              - CP013
      - number: '3.4'
        title: Switching friction, supplier power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              TensorWave's moat is conditional on AMD and ROCm closing ecosystem gaps faster than Nvidia extends CUDA's
              installed base. TBPN Digest describes CUDA's surrounding libraries, tooling, and institutional familiarity
              as the persistent objection to AMD, while TechTimes notes that production migration still depends on
              reliability, performance, compatibility, and engineering cost. TensorWave can reduce friction with managed
              support and Modular portability, but those services also make ongoing optimization labor part of the
              product. AMD is simultaneously supplier, ecosystem sponsor, and investor; that alignment improves access
              and financing but concentrates bargaining and roadmap exposure. The durable upside is a focused
              optimization layer and an alternative supply channel. The bear case is commoditization if general clouds
              add comparable AMD capacity, or displacement if CUDA compatibility remains materially easier for customer
              engineering teams.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Supplier alignment is also concentration
            body: >-
              AMD's role as accelerator supplier, ecosystem sponsor, and investor can improve access and support, but it
              concentrates TensorWave's product roadmap and procurement leverage around one upstream platform.
            calloutType: risk
            claimRefs:
              - CP016
          - type: callout
            title: Benchmark claims are directional
            body: >-
              The largest public cost and throughput claims come from TensorWave, Modular, AMD partner material, or a
              low-confidence comparison page rather than a reproducible independent benchmark with matched workloads.
            calloutType: insight
            claimRefs:
              - CP005
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              TensorWave presents an infrastructure-service model built around AMD GPU capacity rather than a
              conventional software subscription. Public offerings include bare-metal compute, managed inference,
              high-speed storage, monitoring, and hands-on engineering support, so revenue could combine reserved
              capacity, metered usage, managed endpoints, storage, and support. The reviewed website routes buyers to a
              sales conversation and publishes no list rate, contract term, discount schedule, or realized price. AMD
              promotes up to 70% lower inference cost per million tokens, but that is a supplier-partner marketing
              claim, not evidence of TensorWave's realized price, revenue, or gross margin. Without contracts or
              invoices, the bridge from customer activity to recognized revenue remains directional rather than
              quantified.
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI014
              - CI015
      - number: '4.2'
        title: Traction and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Public operating signals are substantial but not directly convertible into recurring revenue. A June 2026
              company release said 8,192 MI325X GPUs were online, more than 2 gigawatts of long-term data-center
              capacity had been secured, and Fireworks AI and Luma AI were using the platform. Independent coverage
              reported roughly 10,000 GPUs across three data centers and 14 megawatts of operating capacity, with leases
              covering 500 megawatts and an ambition to reach 2 gigawatts. These figures demonstrate deployment and
              pipeline scale, not paid utilization, contracted backlog, retention, or sales efficiency. No public
              evidence gives CAC, payback, sales cycle, bookings conversion, logo churn, NRR, channel take rate, or
              customer concentration.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI007
              - CI009
              - CI010
              - CI011
              - CI014
              - CI015
      - number: '4.3'
        title: Capital intensity and financing dependency
        blocks:
          - type: paragraph
            body: >-
              TensorWave said its latest equity-financing proceeds would expand global infrastructure and deploy MI355X
              clusters. That financing supports growth but is not evidence of current cash available: public sources do
              not disclose cash already spent, debt balances, equipment-finance obligations, lease commitments,
              covenants, burn, or runway. Even cumulative funding is not settled; two independent profiles report $450
              million-plus and $493 million respectively. The adverse case is structural. Independent coverage notes
              that specialized AI clouds face high capital requirements, equipment commitments, financing costs, and
              utilization risk, while TensorWave's AMD-only model also concentrates supplier exposure. A forward
              liquidity judgment therefore requires private evidence.
            claimRefs:
              - CI007
              - CI008
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Revenue quality and margin durability cannot yet be underwritten from the public record. One independent
              profile attributes a $5 million annual revenue run rate for 2024 to NextPlatform, while also listing a
              separate $7,015,510 revenue estimate from Prospeo without a stated period; neither is audited company
              disclosure, and neither should be treated as ARR. The same reviewed evidence provides no audited 2025-2026
              revenue, gross margin, operating loss, cash burn, cash balance, or runway. The central diligence test is
              whether contracted, paid utilization can cover accelerator depreciation or lease expense, power,
              facilities, network, support, and financing costs while sustaining renewal quality. Until management
              supplies reconciled financials and customer-level cohort evidence, the financial verdict remains
              high-growth potential with material capital and margin uncertainty.
            claimRefs:
              - CI010
              - CI011
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital raised does not establish runway
            body: >-
              The latest equity round is a financing event, not a cash-balance disclosure. Equipment purchases, leases,
              debt service, deposits, build-out commitments, and operating burn must be reconciled before assigning
              runway.
            calloutType: risk
            claimRefs:
              - CI007
              - CI008
              - CI014
              - CI015
          - type: callout
            title: Condition underwriting on private financial evidence
            body: >-
              Require audited monthly financials, customer-level contracted utilization, revenue cohorts, gross margin
              by service, asset and lease schedules, debt terms, committed capex, cash balance, and a downside liquidity
              case.
            calloutType: recommendation
            claimRefs:
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and customer workflow
        blocks:
          - type: paragraph
            body: >-
              TensorWave sells access to an AMD-centered AI cloud rather than a standalone software tool. Its public
              surface spans training, fine-tuning, production inference, bare-metal infrastructure, managed endpoints,
              storage, monitoring, and engineering support. The buyer workflow begins with workload evaluation and
              migration, proceeds through cluster sizing and deployment, and depends on TensorWave engineers for
              optimization and scaling. Public evidence names MI300X, MI325X, MI355X, and MI455X generations, but it
              does not publish a stable SKU catalog, contract-level service definitions, or generally available pricing.
              Customer references for Moreh, Fireworks AI, and Luma AI indicate real workload engagement, yet the
              available sources do not provide a consistent production-versus-pilot boundary or comparable outcome
              metrics.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE007
              - CE008
              - CE012
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The disclosed stack is concrete enough to identify its main layers. AMD Instinct accelerators sit below a
              rack and cluster layer that includes Helios, EPYC CPUs, Pensando networking, and ROCm; TensorWave's
              training page adds RoCEv2 spine-and-leaf fabric, checkpoint-oriented storage paths, topology-aware
              placement, gang scheduling, and Slurm partitioning. A TensorWave-issued release describes a 72-GPU Helios
              building block, while an AMD partner page describes physical GPU partitioning and managed endpoints. These
              are issuer and supplier claims, not independent benchmarks. The architecture is therefore credible as a
              product blueprint, but throughput, isolation, autoscaling, and cost claims require workload-specific
              validation before they can support underwriting.
            claimRefs:
              - CE003
              - CE006
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE012
      - number: '5.3'
        title: Maturity, reliability, support, and controls
        blocks:
          - type: paragraph
            body: >-
              TensorWave publishes operational practices rather than audited service performance. Its homepage describes
              continuous infrastructure monitoring and active and passive health checks; TensorWave and AMD both
              describe SOC 2 Type II certification and HIPAA-compliant environments, and TensorWave additionally claims
              ISO 27001 certification. AMD also markets 24/7 access to senior AI/ML engineers, while TensorWave frames
              onboarding and scaling as hands-on engagements. These signals are consistent with an enterprise-oriented
              operating model, but they do not establish availability, incident response quality, recovery objectives,
              tenant-isolation effectiveness, or certification scope. The retained evidence contains no public SLA,
              status-history dataset, penetration-test summary, certification report, or incident postmortem.
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE010
              - CE011
      - number: '5.4'
        title: Differentiation and technical risk
        blocks:
          - type: paragraph
            body: >-
              TensorWave's differentiation is specialization: an AMD-only fleet, ROCm expertise, memory-oriented
              accelerator choices, and a supplier relationship that can accelerate access to successive Instinct
              generations. That focus can reduce migration friction for AMD-ready workloads and provide an alternative
              to Nvidia-centered infrastructure. It also concentrates execution risk in one hardware and software
              ecosystem. TechTimes highlights CUDA's entrenched tooling and migration costs, and notes that AMD is both
              supplier and investor; a lower-reputation sector review separately argues that ROCm still trails CUDA in
              framework and operator coverage. Those critiques are directionally plausible but do not substitute for
              reproducible benchmarks. Diligence should test representative models, failover behavior, framework
              compatibility, security scope, and support response under contracted service levels.
            claimRefs:
              - CE008
              - CE009
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Specialization is both moat and concentration
            body: >-
              AMD-only optimization can create valuable operating know-how, but TensorWave remains exposed to Instinct
              supply, ROCm compatibility, successive-generation deployment, and the engineering cost of moving
              CUDA-dependent workloads.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a specialized buyer rather than a broad self-serve cloud audience. TensorWave
              markets AMD Instinct and ROCm capacity for training and inference, while third-party profiles describe its
              users as AI developers, enterprises, research institutions, and cost-sensitive PyTorch teams. The likely
              economic buyer is an infrastructure, engineering, or procurement leader; the hands-on user is an ML or
              platform engineer; and the payer is the organization funding dedicated compute. This segmentation is
              directional, not a disclosed revenue mix: no retained source breaks customers out by vertical, geography,
              company size, or revenue band. Product materials emphasize hands-on solution engineering, and a company
              job repost describes both multi-tenant cloud and single-tenant bare-metal deployments, indicating that
              deployment architecture and support intensity are part of the commercial qualification process rather than
              incidental implementation details.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
              - CU013
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU007
              - CU013
              - CU014
      - number: '6.2'
        title: Adoption and reference quality
        blocks:
          - type: paragraph
            body: >-
              Moreh is the strongest named end-customer reference in the retained set. TensorWave's homepage says Moreh
              used MI355X capacity in a real production cloud for frontier-LLM inference and reports an approximately
              75% reduction in model-weight download time. The accompanying customer quotation also says the work was
              still too early for broader customer metrics, which materially narrows what can be inferred: it supports a
              production workload and one technical outcome, but not fleet-wide utilization, recurring revenue, renewal,
              or generalized cost savings. RFP.wiki mentions published testimonials from Moreh and Higgsfield AI, yet
              supplies no verified review corpus and no sufficiently detailed Higgsfield deployment in the fetched text.
              AMD's case study validates the supplier relationship and evaluation route, but its reference to unnamed
              large AI customers is not a substitute for named TensorWave customer proof.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU010
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The apparent journey is consultative: screen workloads for AMD and ROCm fit, request an evaluation, choose
              dedicated or managed architecture, port and tune the workload with solution engineers, move into
              production, then expand capacity if performance and reliability hold. That motion can create switching
              costs and expansion potential, but the public record does not establish that it does. TechTimes identifies
              reliability, compatibility, migration cost, and performance as the decision variables for moving
              production workloads, while RFP.wiki relays historical reports of interruptions and orchestration
              immaturity and ClusterBid describes CUDA-porting effort as a constraint. Most importantly, none of the
              retained sources discloses customer count, gross or net retention, logo churn, renewal rates, contract
              lengths, top-customer share, or channel-sourced revenue. Those omissions prevent a defensible view on
              durability or concentration and require direct cohort, contract, and billing evidence.
            claimRefs:
              - CU009
              - CU011
              - CU012
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU006
              - CU009
              - CU011
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Durability remains unverified
            body: >-
              The assigned evidence contains no customer-count denominator, retention cohort, renewal rate,
              contract-duration distribution, or top-customer concentration; production proof from one named customer
              cannot close those gaps.
            calloutType: risk
            claimRefs:
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implication
        blocks:
          - type: paragraph
            body: >
              The central underwriting risk is concentration rather than a documented legal or operating failure.
              TensorWave is explicitly built around AMD hardware and ROCm, while independent reporting also describes
              AMD as both supplier and investor. That alignment can improve engineering focus, but it links product
              competitiveness, hardware availability, financing optics, and customer adoption to one ecosystem. The
              second-order exposure is capital intensity: the $350 million Series B finances expansion, yet funding
              raised is not cash available and does not disclose equipment financing, lease commitments, utilization, or
              covenant headroom. The investment case should therefore remain conditional on verified workload
              portability, contracted demand, and financing terms rather than on announced capacity alone.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory, legal, privacy, and security exposure
        blocks:
          - type: paragraph
            body: >
              The retained current pages say TensorWave is SOC 2 Type II and ISO 27001 certified and HIPAA compliant,
              but the source set does not include the audit reports, scope statements, data-processing terms, uptime
              SLA, incident history, litigation record, or regulator correspondence needed to verify coverage. An
              undated third-party page conflicts with those current certification statements, which is best treated as a
              freshness problem rather than evidence that the certifications are absent. No retained source establishes
              a breach, enforcement action, or lawsuit; equally, the lack of such a record in this bounded pool is not
              proof that none exists. Before investment, diligence should obtain the underlying reports and
              representations, not rely on website badges.
            claimRefs:
              - CR002
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR012
              - CR015
              - CR016
              - CR001
      - number: '7.3'
        title: Operational, technical, and quality execution
        blocks:
          - type: paragraph
            body: >
              TensorWave presents specialization as a reliability advantage and describes 24/7 infrastructure
              monitoring, but customer-facing controls are not a substitute for measured availability, recovery
              performance, or a complete incident log. The technical risk is concentrated in ROCm compatibility and the
              pace of AMD's roadmap. One adverse third-party analysis says ROCm still trails CUDA in selected frameworks
              and kernels; its detailed figures are not independently corroborated here, so they should be tested rather
              than accepted as benchmarks. AMD's own case study also states that the cited performance and savings
              results came from TensorWave or Modular and were not independently verified by AMD. The kill criterion is
              repeatable underperformance or migration effort that erases the claimed cost advantage on target
              workloads.
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Financial model, partner, and customer dependencies
        blocks:
          - type: paragraph
            body: >
              Independent reports place the June 2026 Series B at $350 million and the post-money valuation at $1.55
              billion, while two databases and news accounts place aggregate funding near $493 million. Those figures
              indicate financing access, not runway, liquidity, revenue quality, or the ability to absorb lower
              utilization. The same evidence describes a large capacity build and an AMD relationship that combines
              hardware supply, software dependence, and investment. Public ownership data are incomplete, and the
              assigned evidence does not reveal top-customer concentration, contract duration, termination rights,
              backlog quality, power obligations, or debt covenants. Investment approval should require a contract-level
              demand bridge, debt and lease schedules, and a counterparty map that separates committed revenue from
              pipeline.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary kill criterion
            body: >-
              Do not underwrite announced capacity as contracted demand. The thesis breaks if site-level obligations,
              customer commitments, and target-workload benchmarks cannot show that utilization and unit economics cover
              fixed infrastructure and financing costs.
            calloutType: risk
            claimRefs:
              - CR008
              - CR010
              - CR013
              - CR014
          - type: callout
            title: Required pre-investment evidence
            body: >-
              Obtain AMD and Modular agreements, customer concentration and retention schedules, audited financials,
              debt and lease documents, certification reports, and a complete incident log before converting the current
              research-more posture into an investable case.
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR010
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment view and recommendation
        blocks:
          - type: paragraph
            body: >-
              The current recommendation is research-more, with medium confidence in the direction of the call and high
              uncertainty around price. The positive case is tangible: TensorWave raised $350 million at a disclosed
              $1.55 billion post-money valuation, has strategic backing from AMD Ventures and Magnetar, and markets an
              AMD-exclusive cloud intended for training and inference. That positioning can create procurement
              optionality for customers seeking an alternative to NVIDIA-centered infrastructure. The anti-thesis is
              equally concrete. Independent coverage highlights hyperscaler vertical integration, CUDA's software moat,
              high infrastructure capital needs, and dependence on AMD's roadmap. Public sources do not provide audited
              revenue, gross margin, utilization, customer concentration, retention, cash burn, or a defensible revenue
              multiple. A company-quality judgment is therefore possible, but a buy decision at the June mark is not.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV013
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The Series B headline implies approximately 22.6% of post-money value from the new capital, but that
              arithmetic is not a fully diluted ownership estimate and says nothing about liquidation preference,
              participation, seniority, option-pool expansion, debt, warrants, or investor control. Public funding
              totals also conflict: one independent profile reports $450 million-plus across three rounds, while another
              analysis reports approximately $493 million. Neither amount is cash available today. AMD's dual role as
              supplier and lead investor adds strategic validation but also circular-financing and concentration risk
              because some invested capital may return to AMD through accelerator purchases. Entry discipline should
              therefore require a current cap table, security waterfall, debt schedule, cash balance, committed capital
              expenditure, and remaining deployment obligations before treating the $1.55 billion reference as
              investable.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
      - number: '8.3'
        title: Bull, base, and bear framework
        blocks:
          - type: paragraph
            body: >-
              Public evidence is sufficient for a conditional scenario framework, not a numerical valuation range. The
              bull case requires production utilization, durable customer demand, and independently demonstrated AMD
              price-performance advantages to convert capacity into attractive margins. The base case assumes TensorWave
              remains a meaningful AMD-focused niche provider but needs repeated financing as it expands, making returns
              sensitive to dilution and security terms. The bear case combines lower utilization, continued CUDA
              migration friction, hyperscaler substitution, and AMD roadmap dependence; under that combination, fixed
              infrastructure commitments and multiple compression could impair equity value. An external analysis
              estimates GPU clusters at $15 million to $20 million per megawatt and describes full deployment of 2
              gigawatts as requiring tens of billions of dollars, but this is an analyst estimate rather than
              company-disclosed contracted capital expenditure and should be treated as a directional stress test only.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Comparables, exit readiness, and thesis-break tests
        blocks:
          - type: paragraph
            body: >-
              The available comparable set is only a framing device. An independent profile lists CoreWeave and several
              infrastructure-related public companies as yardsticks, but it also states that EV-to-revenue is not
              disclosed for TensorWave's rounds. The reviewed seed deck analysis likewise finds no financial projections
              or unit economics. Applying public-company sales multiples without audited revenue, growth, gross margin,
              utilization, contract duration, and customer concentration would create false precision. Exit readiness is
              similarly unresolved because no reviewed source provides an IPO timetable, audited statements, board
              composition, or governance rights. Thesis-break triggers are measurable: sustained low utilization,
              failure to produce positive contribution margin after power and hardware depreciation, material roadmap
              slippage at AMD, loss of anchor customers, or a financing round with punitive seniority. A positive move
              requires independent production benchmarks, audited economics, customer-cohort evidence, and a fully
              modeled capitalization and preference waterfall.
            claimRefs:
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive decision
            body: >-
              Treat $1.55 billion as a financing reference, not an independently validated fair value. Move beyond
              research-more only after audited economics and the full capitalization, debt, and preference waterfall are
              available.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV014
              - CV016
          - type: callout
            title: Funding raised is not cash available
            body: >-
              Conflicting public funding totals, undisclosed deployment obligations, and unknown security terms prevent
              the reported cumulative raise from serving as a runway or liquidity proxy.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV007
