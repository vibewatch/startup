              - CO015
      - number: '1.3'
        title: Financing, reported scale, and milestone tensions
        blocks:
          - type: paragraph
            body: >-
              TensorWave has raised increasingly large rounds, culminating in a $350 million Series B announced on June
              10, 2026 at a reported $1.55 billion post-money valuation. The earlier financing record is less clean: one
              database calls the October 2024 $43 million financing a Series A, while another profile calls it a SAFE,
              and retained profiles report cumulative funding of either $493 million or $450 million-plus. Employee
              estimates also diverge, with one August 2026 profile showing 100 and Tracxn showing 177 as of September
              26. These are not interchangeable measures and should remain unresolved until cap-table, payroll, and
              financing records are produced. AMD's role as both platform supplier and investor may accelerate capacity
              expansion, yet independent reporting highlights circular-financing and supplier-concentration risk.
              Product announcements with Modular and AMD Helios show continued ecosystem activity, but they do not
              establish contracted utilization or durable revenue.
