callouts:
  - calloutType: risk
    title: Supplier alignment is also concentration
    body: >-
      AMD's role as accelerator supplier, ecosystem sponsor, and investor can improve access
      and support, but it concentrates TensorWave's product roadmap and procurement leverage
      around one upstream platform.
    claimRefs: [CP016]
  - calloutType: insight
    title: Benchmark claims are directional
    body: >-
      The largest public cost and throughput claims come from TensorWave, Modular, AMD partner
      material, or a low-confidence comparison page rather than a reproducible independent
      benchmark with matched workloads.
    claimRefs: [CP005, CP013]
