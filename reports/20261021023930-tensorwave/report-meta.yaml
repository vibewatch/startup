companyProfile:
  summary: >-
    TensorWave is a founder-led, Las Vegas-based AI infrastructure company founded in 2023. It operates an AMD-focused
    cloud spanning training, fine-tuning, inference, bare-metal capacity, managed inference, storage, monitoring, and
    technical support. A June 2026 Series B supplied a reported $350 million at a $1.55 billion post-money valuation,
