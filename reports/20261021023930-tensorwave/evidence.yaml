evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, charter documents, voting rights, investor consents, succession plans, and a fully diluted
      cap table.
    whyItMatters: Governance rights determine control, downside protections, related-party oversight, and key-person mitigation.
    diligencePath: >-
      Request the charter, bylaws, board minutes, voting agreements, investor-rights agreements, and current
      organization chart.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding-and-headcount
    missingEvidence: >-
      Company-certified reconciliation of cumulative proceeds, security classification, debt or SAFE treatment, and
      payroll headcount.
    whyItMatters: >-
      The reported funding base and operating scale affect capitalization, runway, execution capacity, and valuation
      interpretation.
    diligencePath: >-
      Reconcile bank receipts and financing documents to the cap table, then tie payroll records to employees and
      contractors by location.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited revenue, ARR, gross margin, cash burn, runway, customer count, concentration, utilization, backlog, and
      retention metrics.
    whyItMatters: >-
      Financing and partnership announcements do not establish demand quality, durable utilization, or economic
      sustainability.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, customer-level cohorts, signed contracts, and
      facility-level utilization reports.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Comparable market-revenue data for AMD-capable AI cloud workloads, current utilization, contracted backlog,
      customer count, and production retention.
    whyItMatters: >-
      Without common revenue and demand denominators, announced hardware and power capacity cannot support a defensible
      TAM, SAM, SOM, or market-share estimate.
    diligencePath: >-
      Obtain management's bottom-up workload pipeline, contracted versus available GPU-hours, utilization by cluster,
      customer concentration, renewal data, and third-party market-spend benchmarks.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: capacity
    missingEvidence: >-
      A dated fleet schedule reconciling GPU model, online status, site count, megawatts, leased power, and secured
      future capacity.
    whyItMatters: The retained 2026 snapshots differ materially and may mix installed, online, leased, and planned capacity.
    diligencePath: >-
      Request site-level deployment records, energization dates, GPU inventories, lease commitments, and the definitions
      used in each public statement.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Independent customer procurement records, production benchmarks, migration cost studies, and retention or
      utilization evidence.
    whyItMatters: >-
      Vendor and partner claims do not establish that AMD workloads sustain production economics or overcome CUDA
      switching costs.
    diligencePath: >-
      Interview reference customers, inspect contracts and support tickets, reproduce workload benchmarks, and compare
      total migration effort against NVIDIA-centered alternatives.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current matched quotes covering GPU-hour price, reservation term, utilization minimum, networking, storage,
      egress, support, credits, and realized discounts.
    whyItMatters: Public directional claims cannot establish a comparable delivered cost or customer switching incentive.
    diligencePath: >-
      Run a structured RFP across TensorWave, CoreWeave, Lambda, one hyperscaler, and an internal-build case using one
      workload and service-level specification.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmark-claims
    missingEvidence: >-
      Reproducible independent benchmarks with matched models, precision, batch sizes, latency targets, cluster
      topology, software versions, and full cost allocation.
    whyItMatters: >-
      Vendor and partner claims do not establish durable performance-per-dollar across the workloads that determine
      customer retention.
    diligencePath: >-
      Commission a third-party bake-off and obtain raw logs, configurations, failure rates, and cost invoices for AMD
      and Nvidia clusters.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape
    missingEvidence: >-
      A procurement-grade census of hyperscalers, neoclouds, regional clouds, brokers, and internal-build options with
      consistent product and regional coverage.
    whyItMatters: >-
      The selected peer list demonstrates crowding but cannot prove exhaustive competitive coverage or regional
      availability.
    diligencePath: >-
      Build a buyer-specific long list from recent RFPs and verify each provider's available accelerator inventory,
      regions, certifications, and contracting entity.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Customer contracts or invoices showing list price, realized price, discounts, minimum commitments, term, and
      revenue-recognition treatment by service.
    whyItMatters: Without realized pricing and contract structure, revenue quality and gross-margin sensitivity cannot be modeled.
    diligencePath: >-
      Request a redacted contract sample, pricing waterfall, bookings-to-revenue reconciliation, and invoice cohort by
      product.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited monthly revenue, gross margin, power cost, facility cost, hardware depreciation or lease expense, network
      cost, and support labor by service.
    whyItMatters: >-
      A capacity provider can grow deployed assets while destroying value if utilization and realized pricing do not
      cover fixed and financing costs.
    diligencePath: >-
      Request audited monthly financials and contribution-margin bridges for bare metal, managed inference, storage, and
      support.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: >-
      Current unrestricted cash, monthly burn, runway, debt and equipment-finance schedules, lease commitments,
      covenants, committed capex, and next-round triggers.
    whyItMatters: >-
      Funding raised does not establish available liquidity or resilience under slower customer conversion and lower
      utilization.
    diligencePath: >-
      Obtain the latest balance sheet, 18-month cash forecast, debt documents, lease schedule, and downside covenant
      model.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: funding-total
    missingEvidence: >-
      A company-confirmed capitalization table and round schedule reconciling the $450 million-plus and $493 million
      reported totals.
    whyItMatters: The discrepancy affects dilution and financing-history analysis, although neither figure reveals current cash.
    diligencePath: >-
      Reconcile primary closing documents, cash receipts, secondary transactions, and any debt included in aggregator
      totals.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: commercial-traction
    missingEvidence: >-
      Customer-level contracted capacity, paid utilization, backlog conversion, revenue concentration, renewal, churn,
      and NRR or GRR.
    whyItMatters: Installed GPUs, leased power, and named users do not establish durable revenue or efficient capital deployment.
    diligencePath: >-
      Request a customer cohort, monthly contracted-versus-consumed capacity, top-account concentration, backlog aging,
      and renewal history.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI008
  - type: private-evidence-only
    severity: material
    topic: maturity-proof
    missingEvidence: >-
      Independent uptime history, incident and postmortem records, contracted availability and support SLAs, recovery
      objectives, and production workload success rates.
    whyItMatters: >-
      Issuer monitoring claims do not establish reliability or operational performance for training and inference
      workloads.
    diligencePath: >-
      Request 12 months of status and incident exports, customer SLA schedules, support response distributions, recovery
      tests, and three reference calls for production deployments.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: security-compliance
    missingEvidence: >-
      SOC 2 and ISO 27001 reports and scopes, HIPAA control mapping, penetration-test summary, tenant-isolation design,
      data residency, and privacy architecture.
    whyItMatters: >-
      Public certification labels do not reveal tested systems, exceptions, complementary user controls, or
      sensitive-data boundaries.
    diligencePath: >-
      Review current reports under NDA with the security team and reconcile every in-scope service, subprocessor,
      exception, and remediation.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A TensorWave-controlled public repository, package registry, changelog, API documentation set, practitioner forum,
      or quantified developer-community signal.
    whyItMatters: >-
      Without an observable developer surface, compatibility maturity and ecosystem adoption cannot be assessed
      independently.
    diligencePath: >-
      Request private repository and release evidence, API and image version history, compatibility matrices,
      support-ticket taxonomy, and customer migration case studies.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention and concentration
    missingEvidence: >-
      Current customer count, active-account definition, NRR, GRR, logo churn, renewal rates, contract-duration
      distribution, and top-customer revenue share.
    whyItMatters: >-
      These metrics determine whether the visible production proof is durable and diversified rather than concentrated
      in a few early accounts.
    diligencePath: >-
      Request a customer-level cohort export tied to invoices and contracts, reconcile it to revenue, and review the top
      20 accounts with renewal and expansion histories.
    relatedQuestionRefs:
      - QU004
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof
    missingEvidence: >-
      A complete list of production customers, pilots, workload status, contracted capacity, deployment dates, outcomes,
      and reference contacts.
    whyItMatters: >-
      Only one named deployment has detailed public evidence, so logos and unnamed references cannot establish breadth,
      production conversion, or reference quality.
    diligencePath: >-
      Obtain the customer roster, select a stratified sample across production and pilot accounts, and conduct direct
      reference calls using contract and usage records.
    relatedQuestionRefs:
      - QU002
      - QU003
      - QU007
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: reliability
    missingEvidence: >-
      Primary incident records, current uptime history, customer-facing SLA performance, and remediation evidence for
