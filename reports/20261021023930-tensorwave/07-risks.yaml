company:
  name: "TensorWave"
chapter:
  number: 7
  title: "Risks"
  summary: "TensorWave's highest residual risks are the same concentrations that sharpen its differentiation: an AMD-only hardware and ROCm strategy, a capital-intensive capacity build, and reliance on privately held operating, customer, and financing evidence. Public materials describe monitoring and security credentials, but they do not close the diligence gaps around uptime history, contract concentration, lease and debt obligations, or independently verified workload economics."
sections:
  - id: "risk-ranking"
    title: "Risk ranking and investment implication"
    body: |
      The central underwriting risk is concentration rather than a documented legal or operating failure. TensorWave is explicitly built around AMD hardware and ROCm, while independent reporting also describes AMD as both supplier and investor. That alignment can improve engineering focus, but it links product competitiveness, hardware availability, financing optics, and customer adoption to one ecosystem. The second-order exposure is capital intensity: the $350 million Series B finances expansion, yet funding raised is not cash available and does not disclose equipment financing, lease commitments, utilization, or covenant headroom. The investment case should therefore remain conditional on verified workload portability, contracted demand, and financing terms rather than on announced capacity alone.
    claimRefs: [CR001, CR005, CR006, CR007, CR008, CR009]
    figureRefs: [FR001]
  - id: "regulatory-legal-security"
    title: "Regulatory, legal, privacy, and security exposure"
    body: |
      The retained current pages say TensorWave is SOC 2 Type II and ISO 27001 certified and HIPAA compliant, but the source set does not include the audit reports, scope statements, data-processing terms, uptime SLA, incident history, litigation record, or regulator correspondence needed to verify coverage. An undated third-party page conflicts with those current certification statements, which is best treated as a freshness problem rather than evidence that the certifications are absent. No retained source establishes a breach, enforcement action, or lawsuit; equally, the lack of such a record in this bounded pool is not proof that none exists. Before investment, diligence should obtain the underlying reports and representations, not rely on website badges.
    claimRefs: [CR002, CR012, CR015, CR016]
    tableRefs: [TR001]
  - id: "operational-technical"
    title: "Operational, technical, and quality execution"
    body: |
      TensorWave presents specialization as a reliability advantage and describes 24/7 infrastructure monitoring, but customer-facing controls are not a substitute for measured availability, recovery performance, or a complete incident log. The technical risk is concentrated in ROCm compatibility and the pace of AMD's roadmap. One adverse third-party analysis says ROCm still trails CUDA in selected frameworks and kernels; its detailed figures are not independently corroborated here, so they should be tested rather than accepted as benchmarks. AMD's own case study also states that the cited performance and savings results came from TensorWave or Modular and were not independently verified by AMD. The kill criterion is repeatable underperformance or migration effort that erases the claimed cost advantage on target workloads.
    claimRefs: [CR003, CR010, CR011, CR012, CR015]
    tableRefs: [TR002]
  - id: "financial-partner-customer"
    title: "Financial model, partner, and customer dependencies"
    body: |
      Independent reports place the June 2026 Series B at $350 million and the post-money valuation at $1.55 billion, while two databases and news accounts place aggregate funding near $493 million. Those figures indicate financing access, not runway, liquidity, revenue quality, or the ability to absorb lower utilization. The same evidence describes a large capacity build and an AMD relationship that combines hardware supply, software dependence, and investment. Public ownership data are incomplete, and the assigned evidence does not reveal top-customer concentration, contract duration, termination rights, backlog quality, power obligations, or debt covenants. Investment approval should require a contract-level demand bridge, debt and lease schedules, and a counterparty map that separates committed revenue from pipeline.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR009, CR013, CR014, CR016]
    tableRefs: [TR003]
