callouts:
  - calloutType: "risk"
    title: "Primary kill criterion"
    body: "Do not underwrite announced capacity as contracted demand. The thesis breaks if site-level obligations, customer commitments, and target-workload benchmarks cannot show that utilization and unit economics cover fixed infrastructure and financing costs."
    claimRefs: [CR008, CR010, CR013, CR014]
  - calloutType: "recommendation"
    title: "Required pre-investment evidence"
    body: "Obtain AMD and Modular agreements, customer concentration and retention schedules, audited financials, debt and lease documents, certification reports, and a complete incident log before converting the current research-more posture into an investable case."
    claimRefs: [CR009, CR010, CR015, CR016]
