      - number: '4.3'
        title: 资本密集度与融资依赖
        blocks:
          - type: paragraph
            body: >-
              TensorWave 表示最新股权融资所得将用于扩大全球基础设施并部署 MI355X 集群。这笔融资支持增长，却不能证明当前可用现金：公开资料没有披露已花现金、债务余额、设备融资义务、租赁承诺、契约、烧钱速度或
              现金续航。累计融资本身也未定案，两份独立资料分别给出 $450 million-plus 和 $493 million。下行情景具有结构性：独立报道指出，专业 AI
              云面临高资本需求、设备承诺、融资成本和利用率风险，而 TensorWave 的 AMD-only 模式又集中供应商敞口。因此，判断远期流动性必须取得私有证据。
            claimRefs:
              - CI007
              - CI008
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: 财务结论与尽调重点
        blocks:
          - type: paragraph
            body: >-
              仅凭公开记录，尚不能评估收入质量和利润率持久性。一份独立资料将 2024 年 $5 million 年化收入 run rate 归因于 NextPlatform，同时列出 Prospeo 的另一项
              $7,015,510 收入估计但未说明期间；两者都不是经审计的公司披露，也不应当作 ARR。现有证据没有经审计的 2025-2026 收入、毛利率、经营亏损、烧钱、现金余额或
              现金续航。核心尽调要验证：已签约且已付费的利用率，能否覆盖加速器折旧或租赁费用、电力、设施、网络、支持和融资成本，同时保持续约质量。在管理层提供对账后的财务数据和客户级 cohort
              证据前，财务判断只能是高增长潜力伴随显著资本和利润率不确定性。
            claimRefs:
              - CI010
              - CI011
              - CI014
              - CI016
