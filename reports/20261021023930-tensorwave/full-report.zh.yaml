  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值／回报逻辑
      - 概率信号
      - 下行触发条件
    rows:
      - - 乐观
        - 生产利用率高；客户续约稳健；AMD 的性价比有独立验证；融资压力可控
        - 这些因素或可支撑 6 月估值或上行空间，但没有经审计的收入和利润率，就无法合理给出数值区间
        - 经审计的增长，加上稳定的毛利率和客户群留存
        - 基准测试无法转化为客户经济性
      - - 基准情景
        - 可行的 AMD 细分市场；迁移进度不均；持续依赖外部融资；利用率中等
        - 回报取决于入场折价、稀释和优先权条款，而不是企业表面增长势头
        - 在利用率已披露的情况下，产能可转化为已签约收入
        - 新融资会显著使普通股或新优先股处于次级地位
      - - 悲观情景
        - 利用率低；CUDA 摩擦持续；超大规模云厂商将需求内化；AMD 路线图延期
        - 估值倍数压缩叠加固定承诺可能损害股权价值；仅凭公开数据无法量化下行空间
        - 部署延期、续约疲弱或实际实现价格下降
        - 扣除电力和折旧后贡献利润率为负
    notes: 情景具有条件性，不代表概率判断；由于缺少经审计的收入、利润率、利用率、债务、优先权和现金流数据，刻意不提供估值区间。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
