            body: >-
              TensorWave 是一家由创始人主导、总部位于 Las Vegas、2023 年成立的私有 AI 与高性能计算云公司。它围绕 AMD Instinct
              加速器搭建云基础设施，覆盖训练、微调、推理、裸金属算力、托管推理、存储、监控和技术支持。公开资料足以确认其业务类别和总部，但不足以核实客户数、收入、利用率或盈利能力。
