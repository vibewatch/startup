      - number: '1.3'
        title: 融资、公开规模与里程碑冲突
        blocks:
          - type: paragraph
            body: >-
              TensorWave 的融资轮次不断扩大，最终在 2026 年 6 月 10 日宣布完成 $350 million Series B，投后估值据报为 $1.55
              billion。更早的融资记录并不一致：一家数据库将 2024 年 10 月的 $43 million 融资称为 Series A，另一份资料称其为 SAFE；现有资料给出的累计融资额也有 $493
              million 和 $450 million-plus 两种说法。员工数估计同样分歧：一份 2026 年 8 月资料显示 100 人，Tracxn 在 9 月 26 日显示 177
              人。这些口径不能互换，应等股权结构表、薪资和融资记录出具后再定论。AMD 既是平台供应商又是投资人，可能加快扩容，但独立报道也提示循环融资和供应商集中风险。与 Modular 及 AMD Helios
              的产品公告说明生态仍在推进，却不能证明已签约的利用率或持久收入。
