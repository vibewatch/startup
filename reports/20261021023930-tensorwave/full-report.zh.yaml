  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              应把 TensorWave 放在专业 AI 基础设施中评估，而不是拿它去对比全部云计算支出。其核心品类是面向训练、微调、推理、存储、编排和监控的托管 AMD Instinct 算力；相邻支出包括通用云 GPU
              服务，自建加速器和以 NVIDIA 为中心的新型云则是同一工作负载的替代方案。经济问题在于，客户需要高性能加速器，又不愿接受单一供应商的软件和供应链。边界仍然很宽：Tracxn 将 TensorWave
              放在数百家活跃竞争者之中，说明市场拥挤，不等于存在收入机会。更窄的投资问题是：有多少生产需求既能技术性迁移到 ROCm，又愿意承担迁移和供应商集中风险。
            claimRefs:
              - CM001
              - CM003
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM010
              - CM013
              - CM014
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有证据衡量的是 TensorWave 的供给规模，而不是整个市场的收入。2026 年 6 月公司公告称线上有 8,192 个 MI325X GPU，并拥有超过 2 GW 的长期数据中心容量；TechTimes
              报道约 10,000 个 AMD GPU、三个数据中心、14 MW 运营容量、500 MW 租赁容量和 2 GW 目标；ClusterBid 则估计 2026 年第二季度两个站点合计约 3,000 个
              MI300X GPU。这些快照使用了不同 GPU 型号、日期和容量口径，不能相加，也不能换算成 TAM。它们说明扩张野心和潜在需求，但已安装 GPU、电力权利和市场支出是不同分母。现有资料没有单独给出可服务收入或
              TensorWave 可获得的市场份额。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
