  - id: TV002
    title: 论点与反论点
    columns:
      - 立场
      - 论点
      - 当前证据
      - 改变判断所需证据
    rows:
      - - 论点
        - 战略生态位
        - AMD 共同领投 Series B，并将 TensorWave 推介为 AMD 独家云
        - 证明战略协同改善供应、成本或客户赢单的独立证据
      - - 论点
        - 差异化基础设施主张
        - TensorWave 销售针对内存优化的 AMD 训练与推理基础设施
        - 工作负载级第三方基准测试和生产参考客户
      - - 反论点
        - 软件迁移摩擦
        - 独立分析认为 ROCm 在工具链和装机基础优势上仍落后于 CUDA
        - 可重复的迁移证据，以及经测量的总成本和可靠性
      - - 反论点
        - 资本与融资负担
        - 外部分析估计每 MW 成本为 $15M-$20M，并预计还需继续募资
        - 与部署时点匹配的合同利用率和融资，且不会造成惩罚性稀释
      - - 反论点
        - 供应商与投资者集中度
        - AMD 既是核心供应商，也是领投方
        - 跨多代产品的供应保障，以及应对路线图延期的合同救济
    notes: 证据综合公司与合作伙伴主张及独立分析；技术和成本主张仍 须待审阅基准测试方法和客户生产数据后才能验证。
