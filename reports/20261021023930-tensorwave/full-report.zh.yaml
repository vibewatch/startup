      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据最充分的买方是 AI 原生模型开发商、企业 AI 项目、成本敏感的 PyTorch
              团队，以及需要专门训练或推理容量的研究用户。基础设施负责人或技术创始人选择供应商，机器学习工程师使用服务，最终由组织从云或算力预算中付款。采用路径从工作负载兼容性和基准测试开始，随后经过迁移、可靠性验证、安全审查和生产扩容。Fireworks
              AI 与 Luma AI 提供了公司自述的生产案例，但现有资料没有客户分母、留存指标或生产与试点的拆分。TensorWave 官网声称具备企业认证和支持能力，但这些说法不能替代独立采购证据或客户级利用率数据。
            claimRefs:
              - CM002
              - CM009
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求受到加速器稀缺、GPU 经济性压力、高显存工作负载以及买方降低 NVIDIA 依赖的意愿支撑。TensorWave 只做
              AMD，可能改善部分工作负载的性价比，但独立基准证据薄弱且高度依赖具体负载。ClusterBid 报告了更低的挂牌价格和大批量推理优势；AMD 案例则复述 TensorWave 与 Modular
              的性能说法，并明确表示 AMD 未独立验证。ROCm 兼容性、CUDA 专用 kernel、迁移工作量、可靠性，以及客户是否愿意让核心生产负载运行在其上，仍是采用约束。AMD
              的投资可能强化生态，同时也集中供应商敞口并带来循环融资疑虑。因此，估值应跟踪独立验证的利用率、已签约生产需求、可迁移成本和电力到收入的转化，而不能只看公告容量。
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM015
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 容量不等于市场规模
            body: 线上 GPU、兆瓦数、租赁电力和长期容量权利都是分母不同的供给指标；它们都不能证明需求、利用率、收入或可获得的市场份额。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与相对规模
        blocks:
          - type: paragraph
            body: >-
              TensorWave 面对的是拥挤的 AI 基础设施市场，而不是与 Nvidia 的简单双强竞争。Tracxn 将 CoreWeave、Together AI、FluidStack、Rescale 和
              Crusoe 列为相关的融资竞争者；买方也可以继续使用通用云，或自行建设和运营基础设施。所选竞争者的商业模式和融资年份差异很大，因此融资额只能作为规模信号，不能作为产品质量排名。TensorWave 据报累计融资
              $493 million，对年轻供应商而言并不少，但低于若干列出的同业。与此同时，Data Center Dynamics 和 TechTimes 报告其运营着数千个 AMD GPU
              和多个设施。这些报道支持其确有部署足迹，但公司口径的多 GW 容量目标不应解读为已安装或已利用容量。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
