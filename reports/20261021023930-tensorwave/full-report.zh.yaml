          - type: callout
            title: 以私有财务证据作为投资判断条件
            body: 要求提供经审计的月度财务报表、客户级已签约利用率、收入 cohort、按服务拆分的毛利率、资产与租赁明细、债务条款、已承诺 capex、现金余额和下行情景流动性分析。
            calloutType: recommendation
