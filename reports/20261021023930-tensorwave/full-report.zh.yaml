        title: 展品
        blocks:
          - type: callout
            title: 融资额不能证明 现金续航
            body: 最新股权轮是融资事件，不是现金余额披露。在确定 现金续航 前，必须对设备采购、租赁、偿债、押金、建设承诺和经营烧钱进行核对。
            calloutType: risk
            claimRefs:
