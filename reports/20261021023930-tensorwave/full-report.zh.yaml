        title: 创始人领导与治理透明度
        blocks:
          - type: paragraph
            body: >-
              运营团队由创始人主导。现有资料显示，Darrick Horton 任 CEO，Jeff Tatarchuk 任 首席增长官，Piotr Tomasik 任总裁或
              COO。三人分别覆盖技术领导、商业拓展和运营，也让公司对外叙事高度集中在创始团队。现有证据未披露现任董事会、投资人同意权、投票控制、关联方政策或继任规划，因此无法可靠评估机构监督和关键人风险。该领导层表只是公开资料样本，不是完整的管理层或董事会名册；首要尽调应取得公司认证的组织架构和治理记录。
