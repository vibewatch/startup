              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
      - number: '8.3'
        title: 乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >-
              公开证据足以搭建有条件的情景框架，但不足以给出数值估值区间。乐观情景要求生产利用率、持久客户需求以及独立证明的 AMD 性价比优势，才能把容量转化为有吸引力的利润率。基准情景假设 TensorWave
              仍是有意义的 AMD 专注型细分供应商，但扩张需要反复融资，使回报对稀释和证券条款敏感。悲观情景叠加较低利用率、持续的 CUDA 迁移摩擦、超大规模云厂商替代和对 AMD
              路线图的依赖；在这种组合下，固定基础设施承诺和倍数压缩可能损害股权价值。外部分析估计 GPU 集群成本为每兆瓦 $15 million 至 $20 million，并称完整部署 2 GW
              需要数百亿美元，但这只是分析师估计，不是公司披露的已签约资本支出，只能作为方向性压力测试。
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 可比公司、退出准备度与逻辑破坏测试
        blocks:
          - type: paragraph
            body: >-
              现有可比公司集合只能用于搭建框架。独立资料将 CoreWeave 和数家基础设施相关上市公司列为参照，但也指出 TensorWave 各轮融资没有披露 EV-to-revenue。审阅过的 seed deck
              分析同样找不到财务预测或单位经济性。在没有经审计收入、增长、毛利率、利用率、合同期限和客户集中度的情况下套用上市公司销售倍数，只会制造虚假精确。退出准备度同样未解，因为没有资料提供 IPO
              时间表、经审计报表、董事会构成或治理权利。投资逻辑的破坏触发点是可量化的：利用率长期偏低、扣除电力和硬件折旧后无法产生正贡献利润、AMD
              路线图明显延误、失去锚定客户，或融资轮给予惩罚性顺位。正向推进需要独立生产基准、经审计经济性、客户 cohort 证据，以及完整建模的资本结构和优先权 waterfall。
            claimRefs:
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 价格敏感型决策
            body: 把 $1.55 billion 视为融资参考值，而不是独立验证的公允价值。只有在经审计的经济性以及完整资本结构、债务和优先权 waterfall 可得后，才应超越 research-more。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV014
              - CV016
          - type: callout
            title: 融资额不等于可用现金
            body: 公开融资总额冲突、未披露的部署义务和未知的证券条款，使报告中的累计融资额不能作为 现金续航 或流动性代理指标。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV007
