      - number: '3.2'
        title: 能力切口与买方选择
        blocks:
          - type: paragraph
            body: >-
              TensorWave 最清晰的切入口是专注，而不是广度。官网将 AMD Instinct 与 ROCm 平台定位为覆盖训练、微调和推理，并列出四代加速器。AMD
              的评估页面还提出显存容量、分区、安全和工程支持等说法。这使其对重视 AMD
              显存、供应商多元化或直接优化支持的工作负载成为可信选项，但不能证明在所有负载上更优。现有证据没有为大多数竞争者提供可比的安全、可靠性、网络或支持数据，因此相关单元格仍为未知。AMD
              案例同样复述了大幅吞吐和节省成本的说法，并明确表示这些说法由 TensorWave 或 Modular 提供、未经 AMD 独立验证。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP011
      - number: '3.3'
        title: 定价、打包与市场路径
        blocks:
          - type: paragraph
            body: >-
              公开定价证据是比较中最薄弱的一环。ClusterBid 发布了 TensorWave、CoreWeave 和 Lambda 的具体小时价格，但同一页面中的规模和融资说法与更有力的 2026 年 6
              月报道冲突。因此，这些价格只能作为低置信度信号，不能作为投资判断事实。本文审阅的 TensorWave 和 AMD
              官方页面强调评估、托管支持、每美元性能和节省比例，而没有公开价目表、合同期限、最低利用率、出口费用、服务抵扣或实际折扣。这种销售介入式模式可能支持针对具体负载的优化，却无法进行可靠的同口径 TCO 比较。在把
              GPU 小时价格视为经济优势前，应就相同型号、批处理画像、可用性目标、网络、存储和支持范围取得匹配报价。
            claimRefs:
              - CP004
              - CP005
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP012
              - CP013
      - number: '3.4'
        title: 切换摩擦、供应商权力与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              TensorWave 的护城河取决于 AMD 和 ROCm 缩小生态差距的速度是否超过 Nvidia 扩大 CUDA 装机基础的速度。TBPN Digest 将 CUDA 周边库、工具链和机构熟悉度视为 AMD
              面临的长期阻力；TechTimes 则指出，生产迁移仍取决于可靠性、性能、兼容性和工程成本。TensorWave 可以靠托管支持和 Modular
              的可迁移性降低摩擦，但这些服务也会把持续优化的人力变成产品的一部分。AMD
              同时是供应商、生态支持者和投资人；这种绑定改善了获取和融资，却集中暴露出议价能力和路线图风险。可持续的上行来自专注的优化层和替代供给渠道；悲观情景则是通用云增加类似 AMD 容量后把服务商品化，或 CUDA
              兼容性继续对客户工程团队明显更友好而导致替代。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 展品
        blocks:
          - type: callout
            title: 供应商协同也意味着集中度
            body: AMD 作为加速器供应商、生态支持者和投资人，可以改善获取和支持，但也会把 TensorWave 的产品路线和采购议价集中到一个上游平台。
            calloutType: risk
            claimRefs:
              - CP016
          - type: callout
            title: 基准说法仅具方向性
            body: 最大的公开成本和吞吐量说法来自 TensorWave、Modular、AMD 合作伙伴材料或低置信度比较页面，而不是使用匹配工作负载、可复现的独立基准。
            calloutType: insight
            claimRefs:
              - CP005
              - CP013
