company:
  name: "TensorWave"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "TensorWave packages an AMD-exclusive compute stack for model training, fine-tuning, and inference, with public evidence of specific accelerator generations, network and scheduler design, rack-scale expansion, monitoring, and assisted deployment. The product is technically differentiated by AMD specialization, but the same choice creates supplier and ROCm ecosystem concentration, while independent uptime, SLA, audit-scope, and developer-adoption evidence remains unavailable."
sections:
  - id: "product-and-workflow"
    title: "Product surfaces and customer workflow"
    body: >-
      TensorWave sells access to an AMD-centered AI cloud rather than a standalone software tool. Its public surface spans training, fine-tuning, production inference, bare-metal infrastructure, managed endpoints, storage, monitoring, and engineering support. The buyer workflow begins with workload evaluation and migration, proceeds through cluster sizing and deployment, and depends on TensorWave engineers for optimization and scaling. Public evidence names MI300X, MI325X, MI355X, and MI455X generations, but it does not publish a stable SKU catalog, contract-level service definitions, or generally available pricing. Customer references for Moreh, Fireworks AI, and Luma AI indicate real workload engagement, yet the available sources do not provide a consistent production-versus-pilot boundary or comparable outcome metrics.
    claimRefs: [CE001, CE002, CE007, CE010, CE011, CE012]
    tableRefs: [TE001, TE002]
  - id: "architecture-and-operation"
    title: "Architecture and operating model"
    body: >-
      The disclosed stack is concrete enough to identify its main layers. AMD Instinct accelerators sit below a rack and cluster layer that includes Helios, EPYC CPUs, Pensando networking, and ROCm; TensorWave's training page adds RoCEv2 spine-and-leaf fabric, checkpoint-oriented storage paths, topology-aware placement, gang scheduling, and Slurm partitioning. A TensorWave-issued release describes a 72-GPU Helios building block, while an AMD partner page describes physical GPU partitioning and managed endpoints. These are issuer and supplier claims, not independent benchmarks. The architecture is therefore credible as a product blueprint, but throughput, isolation, autoscaling, and cost claims require workload-specific validation before they can support underwriting.
    claimRefs: [CE003, CE006, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "maturity-reliability-and-controls"
    title: "Maturity, reliability, support, and controls"
    body: >-
      TensorWave publishes operational practices rather than audited service performance. Its homepage describes continuous infrastructure monitoring and active and passive health checks; TensorWave and AMD both describe SOC 2 Type II certification and HIPAA-compliant environments, and TensorWave additionally claims ISO 27001 certification. AMD also markets 24/7 access to senior AI/ML engineers, while TensorWave frames onboarding and scaling as hands-on engagements. These signals are consistent with an enterprise-oriented operating model, but they do not establish availability, incident response quality, recovery objectives, tenant-isolation effectiveness, or certification scope. The retained evidence contains no public SLA, status-history dataset, penetration-test summary, certification report, or incident postmortem.
    claimRefs: [CE004, CE005, CE007, CE010, CE011]
  - id: "differentiation-and-technical-risk"
    title: "Differentiation and technical risk"
    body: >-
      TensorWave's differentiation is specialization: an AMD-only fleet, ROCm expertise, memory-oriented accelerator choices, and a supplier relationship that can accelerate access to successive Instinct generations. That focus can reduce migration friction for AMD-ready workloads and provide an alternative to Nvidia-centered infrastructure. It also concentrates execution risk in one hardware and software ecosystem. TechTimes highlights CUDA's entrenched tooling and migration costs, and notes that AMD is both supplier and investor; a lower-reputation sector review separately argues that ROCm still trails CUDA in framework and operator coverage. Those critiques are directionally plausible but do not substitute for reproducible benchmarks. Diligence should test representative models, failover behavior, framework compatibility, security scope, and support response under contracted service levels.
    claimRefs: [CE008, CE009, CE013, CE014]
