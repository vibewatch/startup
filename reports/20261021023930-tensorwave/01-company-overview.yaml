      round classifications and headcount estimates remain explicit.
    claimRefs: [CO001, CO004, CO005, CO006, CO007, CO010, CO011, CO012, CO013]
callouts:
  - calloutType: risk
    title: Public scale metrics are not decision-grade
    body: >-
      Funding totals and headcount differ materially across current profiles, while revenue, customer count, board
      rights, and audited financials are absent. Investment underwriting should use company-certified records rather
      than selecting the most favorable public number.
    claimRefs: [CO008, CO009, CO010, CO011, CO015]
