company:
  name: TensorWave
chapter:
  number: 1
  title: Company Overview
  summary: >-
    TensorWave is a Las Vegas-based, AMD-focused AI infrastructure company founded in 2023 and led by three
    co-founders. Its June 2026 Series B established a reported $1.55 billion post-money valuation, but public
    sources disagree on cumulative funding and current headcount, while board rights, revenue, customers, and
    audited financial metrics remain undisclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      TensorWave is a private AI and high-performance-computing cloud company founded in 2023 and based in Las
      Vegas. Its positioning is unusually concentrated: it builds cloud infrastructure around AMD Instinct
      accelerators rather than operating a multi-vendor GPU fleet. Public descriptions consistently identify
      training, fine-tuning, inference, bare-metal access, managed inference, storage, and liquid-cooled
      infrastructure as the core offer. This gives the company a legible wedge for customers seeking high-memory
      compute or an alternative to Nvidia-centered infrastructure, but it also makes AMD hardware availability and
      the ROCm software ecosystem central execution dependencies. Public evidence is sufficient to establish the
      business category and headquarters, not to verify customer count, revenue, utilization, or profitability.
    claimRefs: [CO001, CO003, CO014, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founder leadership and governance visibility
    body: >-
      The operating leadership is founder-led. Darrick Horton is identified as chief executive, Jeff Tatarchuk as
      chief growth officer, and Piotr Tomasik as president or chief operating officer across the retained profiles.
      That combination covers technical leadership, commercial development, and operations, while also
      concentrating the public company narrative in the founding team. The retained evidence does not disclose a
      current board roster, investor consent rights, voting control, related-party policies, or succession planning.
      Those omissions prevent a reliable assessment of institutional oversight or key-person mitigation. The
      leadership table is therefore a public-profile sample, not a complete management or board census, and the
      diligence priority is to obtain company-certified organization and governance records.
    claimRefs: [CO002, CO015]
    tableRefs: [TO002]
  - id: financing-scale-and-milestones
    title: Financing, reported scale, and milestone tensions
    body: >-
      TensorWave has raised increasingly large rounds, culminating in a $350 million Series B announced on June 10,
      2026 at a reported $1.55 billion post-money valuation. The earlier financing record is less clean: one database
      calls the October 2024 $43 million financing a Series A, while another profile calls it a SAFE, and retained
      profiles report cumulative funding of either $493 million or $450 million-plus. Employee estimates also diverge,
      with one August 2026 profile showing 100 and Tracxn showing 177 as of September 26. These are not interchangeable
      measures and should remain unresolved until cap-table, payroll, and financing records are produced. AMD's role
      as both platform supplier and investor may accelerate capacity expansion, yet independent reporting highlights
      circular-financing and supplier-concentration risk. Product announcements with Modular and AMD Helios show
      continued ecosystem activity, but they do not establish contracted utilization or durable revenue.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
