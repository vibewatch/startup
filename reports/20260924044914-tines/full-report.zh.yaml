      - CV001
      - CV002
      - CV003
      - CV009
  - id: TV002
    title: 估值与尽调关键要素表
    columns:
      - 估值驱动因素
      - 现有支持证据
      - 仍缺失的关键证据
      - 影响程度
    rows:
      - - 3B 采用进展
        - 产品发布报道及内部推广案例
        - 第三方独立客户转化数据
        - 高
      - - 合作伙伴业务增长
        - 一份报告称，超过 54% 的同比收入由合作伙伴带动
        - 合作伙伴集中度与分成经济效益
        - 高
      - - 收入体量
        - 预估收入 ≈$85M
        - 经审计的 ARR / 收入勾稽桥
        - 高
      - - 客户留存
        - 标杆客户案例与增购事实有力
        - 按客群划分的 NRR / 流失率队列
        - 极高
      - - 利润率与烧钱速度
        - 融资渠道与业务增长率
        - 毛利率与资金跑道
        - 极高
      - - 竞品定价
        - 存在多家竞争对手与开放核心（open-core）替代品
        - 赢单 / 输单动态与实际成单价
        - 中
    notes: 本表旨在说明下一次更新时哪些因素会拉动估值变化。
    enumerationScope:
      coverage: partial
      basis: Public evidence and the current refresh cache only; not a full comp set or internal model
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV011
      - CV012
  - id: TV003
    title: 投资建议汇总表
    columns:
      - 决策要素
      - 当前研判
      - 投资含义
    rows:
      - - 投资建议
        - 买入
        - 仅在接受估值偏高的前提下
      - - 置信度
        - 中
        - 产品与发展势头佐证有力，但单位经济模型证据仍然单薄
      - - 风险评级
        - 中
