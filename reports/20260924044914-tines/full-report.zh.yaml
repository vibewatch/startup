              人出头；公司材料称平台每周处理超过十亿次自动化动作。ARR
              已有一定规模，估值达到独角兽水平，但公司仍是非上市企业。本轮尽调的重点因此是验证增长能否延续，而非确认产品是否存在；现有信息足以将其视为成长型公司，但仍有问题待查。
