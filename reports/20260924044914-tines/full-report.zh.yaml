      - number: '6.2'
        title: 客户增购与横向渗透路径
        blocks:
          - type: paragraph
            body: >-
              常见的采用路径是先由一个痛点明显的团队启动，邻近团队看到效果后再申请使用。Stories 模板库、多个客户案例和 2026 年渠道报告都呈现出这一趋势；该报告显示，合作伙伴已带来相当比例的收入。3B
              又把财务和账户研究等非安全用例纳入产品范围。若这些案例能复制，客户便可在保留安全业务基础上向更多团队扩展。整体客户故事更像平台逐步渗透，而非一连串孤立的单点胜利。
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU010
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU007
      - number: '6.3'
        title: 仍待补齐的关键数据
        blocks:
          - type: paragraph
            body: >-
              客户故事有说服力，但留存论据仍以案例为主，缺少系统数据。公开资料没有清晰的流失图表、经独立确认的 NRR
              数字或经审计的留存队列。产品若要成为覆盖更广的企业平台，老客户扩展和留存与新客获取同样重要。因此，关键不在于客户是否喜欢产品，而在于他们搭好第一个工作流后是否持续使用。还需要完整的留存和队列数据，证明业务扩张能够持续。
            claimRefs:
              - CU008
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
