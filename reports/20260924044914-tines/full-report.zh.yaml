              - CU007
              - CU008
              - CU011
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险排序
        blocks:
          - type: paragraph
            body: >-
              首要风险是 Stories 向 3B 转型能否顺利执行。战略方向虽合理，但公司既要让老客户相信 Stories 会继续得到支持，也要说服新买家接受新产品是未来方向。竞争是第二项风险：智能体 SOC
              厂商、开源核心方案和工作流平台都在争夺控制平面的不同部分。第三项是信息透明度，公司尚未公开投资者评估所需的财务和治理细节。公司已有一定规模，转型出错会影响收入；风险重点在执行，而非缺少相邻客户群。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: 风险缓解因素与核心跟踪指标
        blocks:
          - type: paragraph
            body: >-
              Tines 也有缓释因素：Stories 可复用、现有客户基础大，合作伙伴案例显示产品能用于安全和 IT。它不是未经验证的概念，而是一套已有实际应用、正向外拓展的工作流引擎。仍需观察这些基础能否抵消 3B
              功能变多、定位变难懂的风险。下一轮更新应重点看留存证据、渠道集中度和公开信任信号。缓释因素能否跟上平台变化同样重要；核心风险是业务边界扩张快于产品定位变清楚，而非需求不足。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR012
      - number: '7.3'
        title: 风险综合研判
        blocks:
          - type: paragraph
            body: >-
              这属于中等、而非高风险的投资判断：公司已有规模、资金充足，也有真实企业客户在使用。但财务证据不如产品愿景充分，尚不足以完整评估经营质量。若下轮更新能补充毛利率、留存和 3B
              采用情况，风险判断可能很快改善；若没有，估值溢价就更难成立。集成证据也有助于确认产品已接入更广泛的企业技术栈，而非孤立的单点应用。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值推导逻辑
        blocks:
          - type: paragraph
            body: >-
              估值锚点仍是 2025 年 2 月 Series C 的 $1.125B。按 2025 年约 $85M 的收入计算，倍数接近 13x。对一家增长强劲、渠道杠杆显现、且有望拓展 AI
              原生工作流的非上市公司而言，这个倍数偏高，但并非毫无道理。现在要判断的不是公司是否真实存在，而是 Tines 能否把 Stories
              拓展成更广的企业平台，同时保住早期产品的经济性。投资判断因此要看价格，而不只是公司质地；平台范围若持续拓宽，溢价才有支撑。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
      - number: '8.2'
        title: 情景推演与下行风险
        blocks:
          - type: paragraph
            body: >-
              下行情景是 3B 不达预期，或 Stories 蚕食原有增长引擎；在毛利率和留存数据未充分披露的情况下，估值倍数将难以解释。反过来，若 3B 成为企业团队创建受治理工作流的主要方式，Tines
              就可能从安全单点工具走向平台基础设施。因此，下轮更新应看采用和留存，而不是又一条估值新闻。关键在于新产品能否带来持久的经济效益，而不只是扩大产品范围；下一步要看经营表现能否匹配战略雄心。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV011
              - CV012
      - number: '8.3'
        title: 投资研判结论
        blocks:
          - type: paragraph
            body: >-
              结论仍为买入，但估值偏高，信心为中等。若高增长和平台扩张延续，现有证据可以支撑当前倍数；但公开经营数据不足以消除风险溢价。作为动量型投资标的，Tines 有吸引力；若按风险已充分释放的成熟 SaaS
              来评估，则证据还不够。买入判断基于平台转型有证据支撑，但估值偏高仍是重要限制，因此建议买入时明确计入价格风险。
            claimRefs:
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV010
              - CV011
