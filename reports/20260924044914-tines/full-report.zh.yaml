        - 烧钱率可能依然居高不下
        - 净烧钱速度（net burn）是多少？
      - - 客户标杆背书
        - 拥有多家企业客户案例
        - 客户案例可能存在选择偏差
        - 各续约队列的表现如何？
    notes: 缓释因素切实存在，但仍无法替代针对利润率、留存率和管控治理的深入尽调。
    enumerationScope:
      coverage: partial
      basis: Observed mitigants visible in public materials and partner / customer proof from the current refresh cache
    claimRefs:
      - CR004
      - CR005
      - CR012
  - id: TR003
    title: 反向证据表
    columns:
      - 风险信号
      - 证据
      - 研判解读
      - 重点观察项
    rows:
      - - 3B 转轨过渡
        - 发布报道定调为平台底层重构
        - 执行风险切实存在
        - 采用与迁移进展
      - - 市场竞争
        - 竞品对比页显示赛道玩家密集
        - 差异化优势仍需持续证明
        - 赢单 / 输单动态
      - - 信息披露
        - 缺乏经审计的利润率、烧钱速度与跑道数据
        - 投资评估依据仍不完整
        - 管理层财务报表
      - - 合作伙伴集中度
        - 合作伙伴主导的收入占比较高
        - 渠道依赖风险隐现
        - 合作伙伴集中度
      - - 社区热度信号
        - Reddit 讨论帖遭屏蔽
        - 公开的开发者热度信号偏弱
        - 一线从业者社区参照指标
      - - 合规资质
        - DPA 提及认证材料
        - 仍需完整的信任与合规证明
        - 信任中心证明文件
    notes: 本表立足审慎视角，重点指出仍需补充证据的关键领域。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
  - id: TV001
    title: 估值推演表
    columns:
      - 情景
      - ARR / 收入假设
      - 估值倍数
      - 隐含估值
      - 情景研判
    rows:
      - - 悲观情景
        - $85M
        - 10x
        - $850M
        - 增长放缓或 3B 表现不及预期
      - - 基准情景
        - $85M
        - 13x
        - $1.105B
        - 大致与当前估值锚点持平
      - - 乐观情景
        - $110M
        - 16x
        - $1.76B
        - 3B 大幅拓宽目标市场
      - - 强乐观情景
        - $140M
        - 16x
        - $2.24B
        - 平台采用势头强劲且渠道杠杆显著
      - - 下行情景
        - $70M
        - 8x
        - $560M
        - 过渡转轨或客户留存走弱
      - - 当前估值锚点
        - $85M
        - ≈13x
        - $1.125B
        - 现有 Series C 轮估值
    notes: 各情景测算值仅供参考，系基于公开收入代理指标与简单倍数推导得出，并非源自管理层披露的财务模型。
