chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              Tines 最初为安全运营提供无代码自动化，如今将自己定位为服务 AI Agent、应用和企业自动化的智能工作流平台。对外叙事始终围绕两点：减少重复劳动，让操作者掌握治理权。Stories 与 3B
              不只是功能更新，而是两种不同的构建、部署和控制方式。3B 面向财务、HR、运营等不想学习旧式搭建器的团队，也因此把目标市场扩至安全之外。产品一边是安全优先，一边是 AI 原生，但两者都强调治理。
