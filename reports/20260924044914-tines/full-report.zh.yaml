      - number: '3.3'
        title: 护城河与潜在威胁
        blocks:
          - type: paragraph
            body: >-
              Tines 的差异化更多来自架构和治理，而不是某个独有功能或低价。公司将 3B 定位为应对 AI 泛滥和影子 AI
              的方案，这一优势也要放到更广的市场中检验。最大威胁是产品同质化：若其他技术栈能以更低成本提供足够的自动化、智能体能力或控制力，Tines
              就得靠执行和信任取胜。未来一年的关键是拿出落地证据，而非继续讲定位。竞争格局还会快速变化，目前只能视作一张快照。AI 生成的工作越多，治理和运行时控制相较于搭建速度就越重要。
            claimRefs:
              - CP010
              - CP012
