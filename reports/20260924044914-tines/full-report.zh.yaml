  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与细分板块
        blocks:
          - type: paragraph
            body: >-
              Tines 的市场已不止“安全编排”。其智能工作流软件把自动化、AI、治理和集成结合起来，覆盖安全运营、IT、合规及相邻业务流程；这也更符合 Stories 与 3B
              的产品组合。与其把市场看成单一垂直工具，不如视作跨系统工作的控制层，尤其适用于需要审计的流程。它还包括对 AI 生成工作的治理，而非只有传统安全编排。平台既服务原有安全买方，也试图借 3B 触达更广泛的企业买方。
