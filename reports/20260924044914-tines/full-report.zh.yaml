  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态与模块全景
        blocks:
          - type: paragraph
            body: >-
              Tines 的产品可分为两层：Stories 是带有可视化界面的安全优先构建器，曾推动公司早期增长；3B 则是新推出的代码优先层，用于创建 AI
              原生工作流、应用和智能体。两者面向不同用户，也有不同评估重点：Stories 强调控制力和熟悉的操作方式，3B 强调 AI 辅助创建及受治理的运行时执行。两条产品线可以并存，但产品思路并不相同。Tines
              因此同时进入工作流自动化和受治理的 AI 应用构建领域，在保留安全切入点的基础上扩大目标用户。如今客户评估的不只是低代码速度，还包括平台治理；比较对象也从传统工作流工具扩展到 AI 治理层和相邻的 AI
              Workspace。
            claimRefs:
              - CE001
              - CE008
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE008
