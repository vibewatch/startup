        title: 空间测算佐证与待解问题
        blocks:
          - type: paragraph
            body: >-
              现有市场空间判断主要依靠间接指标。缓存中有增长信号，却没有数据扎实的 TAM、SAM、SOM 模型。这不妨碍投资判断，但估值应更多看实际
              ARR、留存、渠道杠杆和部署深度，而不是一张看似精确的市场规模图。尽调更该问的不是“市场能有多大”，而是“Tines 能安全承接多少工作流，才会从功能走向基础设施”。答案应来自情景分析和用量证据，而非凭空给出一个
              TAM 数字。
