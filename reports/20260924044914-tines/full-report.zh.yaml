        blocks:
          - type: paragraph
            body: >-
              3B 推出后，Tines 面对的竞争范围扩大了：除传统 SOAR 外，还有智能体 SOC 厂商、开源核心方案、工作流平台和企业 AI
              Workspace。进入更大的市场是机会，也意味着买方比较的产品更多。买方可以选择工作流构建器、AI SOC
              分析工具、开源控制栈或企业自动化平台；这些产品分别侧重自主调查、工作流灵活性或开源核心的成本结构。品类因此更难界定，但横向比较也更有意义。
