    data:
      items:
        - label: 创立于都柏林
          date: '2018'
          detail: Eoin Hinchy 与 Thomas Kinsella 创立 Tines，专注于安全自动化。
          tone: positive
          claimRefs:
            - CO001
            - CO002
        - label: Series A 轮 / 早期支持
          date: 2019-2021
          detail: Accel、Addition 等投资方出资支持其最初切入 SOAR 赛道的产品。
          tone: positive
          claimRefs:
