      - number: '2.2'
        title: 需求驱动因素与采纳阻碍
        blocks:
          - type: paragraph
            body: >-
              需求来自熟悉的运营痛点：团队想减少重复劳动、防止影子 AI，并在跨系统工作中保留治理。Tines 的研究和客户案例提到员工倦怠、告警疲劳及交接成本。但采用并非毫无阻力，买方还要判断它相对脚本、SOAR
              和其他自动化工具的定位；部署通常从一个团队开始，再逐步扩展。因此，市场增长取决于平台能否证明控制力并快速体现价值。买方往往先在一个领域试用，确认平台能安全替代跨系统的人工交接后，才扩展到相邻团队。
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
