        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              比较产品时，关键是由谁编写调查逻辑或工作流，以及买方能保留多少控制权。Tracecat 和 SynapCores 主打开源或开源核心模式；Tines
