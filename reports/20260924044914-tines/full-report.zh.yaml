      - number: '5.2'
        title: 系统架构、运行时与管控平面
        blocks:
          - type: paragraph
            body: >-
              3B 以代码生成、隔离执行和集中治理为基础，回应员工绕过 IT 监管自行搭建 AI 工具的问题。Tines
              强调，价值不只是让人更快构建，还在于构建时不丢控制权、不泄露凭据，并保留日志。平台想成为受控的安全运行环境，承接原本散落在影子
              AI、电子表格或临时托管账号中的工作。因此，运行时和控制平面至少与构建器体验同样重要。买方实际上希望平台同时承担运行环境、策略引擎和自动化构建器的角色；对需要统一治理人工编写与 AI
              生成工作的企业尤其如此。运行时是产品核心，不是实现层面的枝节。
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
