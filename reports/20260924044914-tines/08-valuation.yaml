company:
  name: Tines
chapter:
  number: 8
  title: Valuation
  summary: 'Tines still looks like a buy, but the valuation is stretched: the current $1.125B anchor is easier to defend if
    3B expands the market and partner-led growth persists than if the business remains a high-multiple security workflow vendor.'
sections:
- id: valuation-bridge
  title: Valuation Bridge
  body: 'The anchor valuation is still the February 2025 Series C price: $1.125B. Against roughly $85M of 2025 revenue, that
    implies a multiple near 13x, which is high but not irrational for a private company with strong growth, meaningful channel
    leverage, and a plausible product expansion into AI-native workflows. The key valuation question is no longer whether
    the company is real. It is whether the company can convert Stories into a broader enterprise platform without losing the
    economics that made the first product attractive. That keeps the call anchored to price, not just company quality. That
    framing matters because a premium valuation only works if the platform story keeps getting wider.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: scenario-thinking
  title: Scenario Thinking and Downside Cases
  body: 'The downside case is straightforward: if 3B underperforms or Stories cannibalizes the growth engine, then the multiple
    gets hard to justify because there is no fully disclosed margin or retention cushion to fall back on. The upside case
    is also clear: if 3B becomes the primary way enterprise teams create governed work, then the business starts to look more
    like a platform infrastructure layer than a point security tool. That is why the next refresh should focus on adoption
    and retention rather than on another headline valuation anecdote. In practice, the most important swing factor is whether
    the new surface adds durable economics rather than only product breadth. The next proof point is whether the company can
    show economics that match the ambition.'
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  - CV012
  tableRefs:
  - TV002
- id: valuation-verdict
  title: Verdict
  body: The verdict remains “buy,” but only with a stretched-valuation label and a medium confidence score. The company has
    enough proof points to justify the multiple if growth and platform expansion continue, yet not enough public economics
    to remove the risk premium. In practical terms, that means Tines is investable as a momentum story, but not yet as a fully
    de-risked SaaS underwrite. The stance stays buy because the evidence supports a platform transition, but the word stretched
    still matters. That is why the recommendation is buy, but only with explicit caution around price.
  claimRefs:
  - CV010
  - CV011
  - CV012
  tableRefs:
  - TV003
