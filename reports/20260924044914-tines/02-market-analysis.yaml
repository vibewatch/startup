  name: Tines
chapter:
  number: 2
  title: Market Analysis
  summary: 'Tines now competes in the broader intelligent-workflow market: a boundary that spans security operations, IT automation,
    and AI governance, with demand driven by manual-work reduction and a growing need to govern AI-generated work.'
sections:
- id: market-boundary
  title: Market Boundary and Segments
  body: The right market boundary is no longer “security orchestration” alone. Tines now spans intelligent workflow software
    that combines automation, AI, governance, and integration across security operations, IT, compliance, and adjacent business
    workflows. That boundary better fits the product mix shown in Stories and 3B, and it better explains why the company is
    expanding beyond its original SOC use case. The market is therefore best understood as a control plane for work that crosses
    systems and requires auditability, not a single vertical tool. The market boundary therefore includes the control layer
    around AI-generated work, not just old-school security orchestration. The platform therefore serves both the original
    security buyer and the broader enterprise buyer that 3B is trying to reach.
  claimRefs:
  - CM001
  - CM002
  - CM004
  - CM010
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: demand-drivers
  title: Demand Drivers and Adoption Constraints
  body: 'The demand case is strong because the operational pain is familiar: teams want to eliminate repetitive work, avoid
    shadow AI, and keep governance in place when work moves across many systems. Tines'' own research and customer examples
    emphasize burnout, alert fatigue, and the cost of handoffs. But adoption is not frictionless. Buyers still have to decide
    where the platform sits relative to scripts, SOAR, and adjacent automation tools, and the rollout usually starts in one
    team before it expands. That makes market growth heavily dependent on proof of control and time-to-value. Buyers typically
    start in one domain and then extend to adjacent teams once the platform proves it can safely replace manual handoffs across
    systems.'
  claimRefs:
  - CM003
  - CM005
  - CM007
  - CM008
  - CM011
  tableRefs:
  - TM003
  figureRefs: []
- id: sizing-and-gaps
  title: Sizing Evidence and Open Questions
  body: Source-backed sizing is still mostly proxy-based. The cache shows strong growth signals, but it does not provide a
    clean market model with a well-supported TAM, SAM, and SOM. That is not fatal for underwriting, but it does mean valuation
    work should lean on actual ARR, retention, partner leverage, and deployment depth rather than a pretend market-size chart.
    The most useful diligence question is therefore not “how big could the market be?” but “how many workflows can Tines safely
    absorb before it looks like infrastructure rather than a feature.” That means the sizing question should be answered with
    scenario logic and usage evidence rather than with a made-up single TAM number.
  claimRefs:
  - CM006
  - CM009
  - CM012
  tableRefs:
  - TM002
  figureRefs: []
