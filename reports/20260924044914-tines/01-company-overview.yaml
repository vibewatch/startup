company:
  name: Tines
chapter:
  number: 1
  title: Company Overview
  summary: Tines is a founder-led workflow automation company that has expanded from security operations into a broader enterprise
    AI orchestration platform, closing a $125M Series C in 2025 and launching 3B in 2026 to target AI-native work across the
    business.
sections:
- id: identity-and-operating-model
  title: Identity, Mission, and Operating Model
  body: 'Tines began as a no-code automation platform for security operations and now describes itself as an intelligent workflow
    platform for AI agents, apps, and enterprise automations. The company''s public positioning has stayed consistent on two
    themes: reduce repetitive work and keep governance in the hands of the operator. The current product split matters because
    Stories and 3B are not just feature updates; they define two different ways the company thinks about authoring, deployment,
    and control. That split also widens the company''s addressable market, because 3B is explicitly aimed at teams such as
    finance, HR, and operations that do not want to learn the old builder model. The product now has a security-first and
    an AI-native expression, but both are still tied to the same governance story.'
  claimRefs:
  - CO001
  - CO003
  - CO004
  - CO005
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: founders-funding-and-scale
  title: Founders, Funding, and Scale
  body: The company remains founder-led and strongly capitalized. Tines publicly closed a $125M Series C in February 2025
    at a $1.125B valuation and says it has raised about $272M in total. Third-party sources now place revenue at roughly $85M
    and headcount in the low-500s, while company materials describe the platform as processing more than a billion automated
    actions per week. That combination—material ARR scale, a unicorn valuation, and a still-private operating model—makes
    the current refresh more about validating momentum than about proving product existence. That is enough to keep the company
    in the growth bucket while still leaving some diligence questions open.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO014
  - CO013
  tableRefs:
  - TO002
- id: milestones-and-governance
  title: Milestones, Partner Momentum, and Governance Gaps
  body: The 2026 refresh is notable because it adds a clear partner-led growth signal and a formal channel leader appointment
    on top of the earlier funding and product milestones. Tines reports 75 new technology partners, 25% channel-network growth,
    and more than 54% of year-over-year revenue driven by partners. That is a meaningful commercial signal, but it does not
    eliminate the remaining diligence gap around governance, because the public record still does not clearly show the board
    beyond the founders. The company is also still in the middle of a major product transition, which means execution quality
    matters as much as raw growth. The refresher also shows that the company's public story is broadening without abandoning
    the original security wedge.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO015
  tableRefs:
  - TO003
