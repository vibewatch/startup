slug: tines
runDate: '2026-09-24'
company:
  name: Tines
chapter:
  number: 4
  title: Financials
  summary: Tines looks like a well-capitalized private SaaS platform with meaningful revenue scale, strong partner leverage,
    and an opaque profit profile; the core underwriting gap remains gross margin, burn, and runway.
sections:
- id: revenue-model
  title: Revenue Model and Monetization
  body: Tines looks like a classic enterprise software business with a free entry point, paid enterprise packaging, and a
    growing channel motion that helps expand distribution. The current cache does not expose a clean list price for every
    tier, but it does show that the company monetizes through software subscriptions rather than usage-heavy services revenue.
    That matters because the product is now split between Stories and 3B, so monetization can no longer be read from one simple
    seat-license lens. The right question is whether the new product line increases revenue density without creating a confusing
    packaging stack. The picture is closer to a software platform with multiple monetization surfaces than a simple seat-license
    product.
  claimRefs:
  - CI001
  - CI002
  - CI006
  - CI010
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: capital-adequacy
  title: Capital Adequacy and Profitability
  body: 'Tines has enough capital to keep investing: the company closed a $125M Series C, says it has raised roughly $272M
    lifetime, and continues to hire and ship aggressively. That reduces near-term survival risk, but it does not answer the
    fundamental question of how efficiently the business converts growth into gross profit. The current cache is explicit
    about what is missing: gross margin, burn, runway, and exact enterprise-tier discounting. Until those inputs are known,
    the best financial judgment is that the company is strong on funding and weak on transparency. That leaves the cash and
    margin questions more important than the headline valuation story.'
  claimRefs:
  - CI003
  - CI004
  - CI005
  - CI007
  - CI009
  - CI011
  - CI012
  tableRefs:
  - TI002
  figureRefs: []
- id: financial-verdict
  title: Financial Verdict
  body: The financial picture is attractive if you believe the company can keep combining partner-led distribution with strong
    net retention and low marginal support costs. It is less attractive if you require current audited economics. The evidence
    in the cache supports a high-growth SaaS company with an improving commercial model, but not a fully underwritten margin
    story. That is enough for a buy/track style verdict, but not enough to call the business cheap. The verdict therefore
    hinges on how much of the new product surface can be monetized without adding heavy support cost.
  claimRefs:
  - CI006
  - CI008
  - CI010
  - CI011
  tableRefs:
  - TI003
  figureRefs: []
