  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Module Map
        blocks:
          - type: paragraph
            body: >-
              The product is now best thought of as two layers. Stories remains the visual, security-first builder that
              gave Tines its original traction, while 3B is the newer code-first layer for AI-native workflows, apps,
              and agents. That split is important because it changes who the product is for and how it should be
              evaluated. Stories optimizes for control and familiarity; 3B optimizes for AI-assisted creation and
              governed runtime execution. The two can coexist, but they are not the same product thesis. The company now
              sits at the intersection of workflow automation and governed AI app creation, which expands its target
              user base without removing the original security wedge. This matters because the evaluation is now about
              platform governance, not just low-code speed. That broader scope is why customers can now evaluate the
              platform against both workflow builders and AI governance layers. That matters because the platform is now
              being compared to adjacent AI workspaces as well as to classic workflow tools.
            claimRefs:
              - CE001
              - CE008
              - CE012
          - type: table
            tableRef: TE001
