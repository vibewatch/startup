  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              The competitive set has broadened after the 3B launch. Tines is no longer just comparing itself with
              classical SOAR tools; it is now being measured against agentic SOC vendors, open-core alternatives,
              workflow platforms, and enterprise AI workspaces. That is a good sign in one sense because it means the
              company is participating in a bigger market, but it is also a warning sign because it widens the buyer
              comparison set. Buyers can now ask whether they need a workflow builder, an AI SOC analyst, an open-source
              control stack, or a broad enterprise automation layer. Buyers now have to choose among products that
              optimize for investigation autonomy, workflow flexibility, or open-core economics, which makes the
              category more confusing but also more useful to compare.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
