  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Priority Risks
        blocks:
          - type: paragraph
            body: >-
              The highest-priority risk is execution across the Stories-to-3B transition. That move is strategically
              smart, but it creates the classic platform risk: the company has to reassure existing users that the old
              product is still supported while also convincing new buyers that the new product is the future. The second
              risk is competition. The cache shows multiple competitor classes—agentic SOC vendors, open-core
              alternatives, and workflow platforms—trying to own some part of the same control plane. The third risk is
              transparency: the company still does not publish the financial and governance details an underwriter would
              want. The company is still large enough that any misstep in the transition would have real revenue
              consequences. That makes the transition risk more about execution than about lack of customer adjacency.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
          - type: table
