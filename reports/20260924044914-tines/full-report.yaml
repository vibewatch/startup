      - number: '1.3'
        title: Milestones, Partner Momentum, and Governance Gaps
        blocks:
          - type: paragraph
            body: >-
              The 2026 refresh is notable because it adds a clear partner-led growth signal and a formal channel leader
              appointment on top of the earlier funding and product milestones. Tines reports 75 new technology
              partners, 25% channel-network growth, and more than 54% of year-over-year revenue driven by partners. That
              is a meaningful commercial signal, but it does not eliminate the remaining diligence gap around
              governance, because the public record still does not clearly show the board beyond the founders. The
              company is also still in the middle of a major product transition, which means execution quality matters
              as much as raw growth. The refresher also shows that the company's public story is broadening without
              abandoning the original security wedge.
