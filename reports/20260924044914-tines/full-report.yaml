      - number: '6.3'
        title: What Is Still Missing
        blocks:
          - type: paragraph
            body: >-
              The customer thesis is strong, but it is still more story-based than data-based. The cache does not give a
              clean churn chart, a public NRR number with independent confirmation, or audited retention cohorts. That
              matters because the product is now being marketed as a broader enterprise platform, and broader platforms
              depend on expansion retention as much as they depend on new logos. So the key diligence question is not
              whether customers like the product; it is how sticky it is once the first workflow has been built. The
              last missing step is a clean retention/cohort story that proves the expansion is durable.
            claimRefs:
