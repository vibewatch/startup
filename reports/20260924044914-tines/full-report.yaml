      - number: '3.3'
        title: Moat and Threats
        blocks:
          - type: paragraph
            body: >-
              Tines still looks differentiated, but mostly on architecture and governance rather than on a single
              feature or a uniquely low price. The company’s own framing of 3B is a response to AI sprawl and shadow AI,
              which means the moat now has to survive a broader market conversation. The biggest threat is
              commoditization: if the buyer can get enough workflow automation, enough agentic capability, or enough
              control from another stack for less money, Tines has to win on execution and trust. That makes the next
              year about proof, not positioning. The buyer should expect this space to keep changing quickly, so the map
              is a snapshot rather than a durable taxonomy. The more the market shifts toward AI-generated work, the
              more governance and runtime control matter relative to raw builder speed.
            claimRefs:
              - CP010
              - CP012
