      - number: '6.2'
        title: How Adoption Expands
        blocks:
          - type: paragraph
            body: >-
              The adoption pattern is consistent: one team starts because the pain is obvious, then adjacent teams see
              the value and request access. That is visible in the product-led story library, the multiple customer case
              studies, and the 2026 channel report that shows partners now doing a material share of the revenue work.
              The 3B launch strengthens this pattern because the examples now include non-security work such as finance
              and account research. If those examples hold, the customer base can expand horizontally without losing the
              original security wedge. That pattern is why the customer story reads more like a platform adoption curve
              than a series of one-off wins.
