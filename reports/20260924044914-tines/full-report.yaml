      - number: '5.2'
        title: Architecture, Runtime, and Control Plane
        blocks:
          - type: paragraph
            body: >-
              The 3B architecture is designed around generated code, isolated execution, and centralized governance.
              That matters because the company is explicitly responding to the problem of employees building AI tools
              outside IT supervision. Tines is saying the value is not just “let people build faster”; it is “let them
              build without losing control, credentials, or logging.” In other words, the platform is trying to be the
              safe runtime for work that would otherwise live in shadow AI, spreadsheets, or one-off hosting accounts.
              That makes the runtime and control plane at least as important as the builder experience itself. In
              practice, the buyer is asking the platform to act like a runtime, a policy engine, and an automation
              builder all at once. This is especially important for buyers who want one system to govern both
              human-authored and AI-authored work. The runtime story is therefore a core part of the product, not an
              implementation detail.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
      - number: '5.3'
        title: Trust, Security, and Developer Signal
        blocks:
          - type: paragraph
            body: >-
              The current cache shows some trust signals but not a full public certification story. The DPA points to
              enterprise security processes, but public certification proof is thin; the Reddit community signal exists
              but is blocked at fetch time. That makes the product credible as enterprise software, yet still somewhat
              opaque as a developer-community platform. The moat therefore looks more like workflow depth, governance,
              and runtime control than open-source community momentum. The result is a product that looks
              enterprise-ready, but the external proof of trust still needs tightening. That is strong enough for
              enterprise adoption, but still not enough to remove every trust gap. The open question is whether the
              market rewards that breadth or penalizes the extra complexity. Buyers will care whether the trust story
              scales as quickly as the feature story.
            claimRefs:
              - CE006
              - CE007
              - CE009
              - CE011
