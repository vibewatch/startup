        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The financial picture is attractive if you believe the company can keep combining partner-led distribution
              with strong net retention and low marginal support costs. It is less attractive if you require current
              audited economics. The evidence in the cache supports a high-growth SaaS company with an improving
              commercial model, but not a fully underwritten margin story. That is enough for a buy/track style verdict,
