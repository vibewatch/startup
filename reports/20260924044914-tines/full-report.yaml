      - number: '3.2'
        title: Capability and Pricing Comparison
        blocks:
          - type: paragraph
            body: >-
              The most useful comparison axis is who writes the investigation or workflow and how much control the buyer
              keeps. Tracecat and SynapCores are explicit about open-source or open-core economics, while Tines
              emphasizes governed workflow creation and runtime control. Workato appears in the customer stories as a
              status-quo alternative that was limited by pricing and change control. Sim and other broader AI workspaces
              show that adjacent enterprise software is also moving into this territory. The result is a messy but
              understandable field: buyers are shopping for control, autonomy, and economics at the same time. Those
              trade-offs are exactly why the comparison set now matters as much as the feature set. The result is a
              comparison set where economics, governance, and authoring model all matter at once.
