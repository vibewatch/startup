      - number: '1.2'
        title: Founders, Funding, and Scale
        blocks:
          - type: paragraph
            body: >-
              The company remains founder-led and strongly capitalized. Tines publicly closed a $125M Series C in
              February 2025 at a $1.125B valuation and says it has raised about $272M in total. Third-party sources now
              place revenue at roughly $85M and headcount in the low-500s, while company materials describe the platform
              as processing more than a billion automated actions per week. That combination—material ARR scale, a
              unicorn valuation, and a still-private operating model—makes the current refresh more about validating
              momentum than about proving product existence. That is enough to keep the company in the growth bucket
              while still leaving some diligence questions open.
