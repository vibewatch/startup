              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Mitigants and What to Watch
        blocks:
          - type: paragraph
            body: >-
              There are also strong mitigants. The company already has reusable Stories, a large install base, and
              partner proof that the platform works across security and IT. That means it is not a speculative idea; it
              is a proven workflow engine trying to widen its aperture. The question is whether those mitigants are
              strong enough to offset the risk that 3B becomes a feature-rich but hard-to-explain expansion. For the
              next refresh, the most important watch items are retention evidence, channel concentration, and whether
              public trust signals get stronger. The practical question is whether those mitigants can keep pace with
              the pace of platform change. The key risk is that breadth outpaces clarity, not that the underlying use
              case lacks demand.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR012
      - number: '7.3'
        title: Risk Verdict
        blocks:
          - type: paragraph
            body: >-
              This is a medium-risk, not high-risk, story because the company is already scaled, funded, and used by
              real enterprises. But it is also not a clean underwrite, because the evidence base is still richer on
              product ambition than on economics. If the next refresh shows better margin, retention, and 3B adoption
              clarity, the risk stack improves quickly. If not, the valuation story becomes harder to defend. If the
              next refresh does not improve these signals, the valuation premium becomes harder to defend. Integration
              proof also helps show the product is wired into the broader stack, not isolated as a niche app.
            claimRefs:
