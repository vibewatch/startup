  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Bridge
        blocks:
          - type: paragraph
            body: >-
              The anchor valuation is still the February 2025 Series C price: $1.125B. Against roughly $85M of 2025
              revenue, that implies a multiple near 13x, which is high but not irrational for a private company with
              strong growth, meaningful channel leverage, and a plausible product expansion into AI-native workflows.
              The key valuation question is no longer whether the company is real. It is whether the company can convert
              Stories into a broader enterprise platform without losing the economics that made the first product
              attractive. That keeps the call anchored to price, not just company quality. That framing matters because
              a premium valuation only works if the platform story keeps getting wider.
            claimRefs:
