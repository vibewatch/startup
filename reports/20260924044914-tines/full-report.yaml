      - number: '2.2'
        title: Demand Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The demand case is strong because the operational pain is familiar: teams want to eliminate repetitive
              work, avoid shadow AI, and keep governance in place when work moves across many systems. Tines' own
              research and customer examples emphasize burnout, alert fatigue, and the cost of handoffs. But adoption is
              not frictionless. Buyers still have to decide where the platform sits relative to scripts, SOAR, and
              adjacent automation tools, and the rollout usually starts in one team before it expands. That makes market
              growth heavily dependent on proof of control and time-to-value. Buyers typically start in one domain and
              then extend to adjacent teams once the platform proves it can safely replace manual handoffs across
              systems.
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM008
              - CM011
      - number: '2.3'
        title: Sizing Evidence and Open Questions
        blocks:
          - type: paragraph
            body: >-
              Source-backed sizing is still mostly proxy-based. The cache shows strong growth signals, but it does not
              provide a clean market model with a well-supported TAM, SAM, and SOM. That is not fatal for underwriting,
              but it does mean valuation work should lean on actual ARR, retention, partner leverage, and deployment
              depth rather than a pretend market-size chart. The most useful diligence question is therefore not “how
              big could the market be?” but “how many workflows can Tines safely absorb before it looks like
              infrastructure rather than a feature.” That means the sizing question should be answered with scenario
              logic and usage evidence rather than with a made-up single TAM number.
            claimRefs:
              - CM006
              - CM009
              - CM012
