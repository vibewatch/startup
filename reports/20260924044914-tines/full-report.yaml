  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Segments
        blocks:
          - type: paragraph
            body: >-
              The right market boundary is no longer “security orchestration” alone. Tines now spans intelligent
              workflow software that combines automation, AI, governance, and integration across security operations,
              IT, compliance, and adjacent business workflows. That boundary better fits the product mix shown in
              Stories and 3B, and it better explains why the company is expanding beyond its original SOC use case. The
              market is therefore best understood as a control plane for work that crosses systems and requires
              auditability, not a single vertical tool. The market boundary therefore includes the control layer around
              AI-generated work, not just old-school security orchestration. The platform therefore serves both the
              original security buyer and the broader enterprise buyer that 3B is trying to reach.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM010
