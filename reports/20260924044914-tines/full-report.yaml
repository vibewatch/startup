chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Tines began as a no-code automation platform for security operations and now describes itself as an
              intelligent workflow platform for AI agents, apps, and enterprise automations. The company's public
              positioning has stayed consistent on two themes: reduce repetitive work and keep governance in the hands
              of the operator. The current product split matters because Stories and 3B are not just feature updates;
              they define two different ways the company thinks about authoring, deployment, and control. That split
              also widens the company's addressable market, because 3B is explicitly aimed at teams such as finance, HR,
              and operations that do not want to learn the old builder model. The product now has a security-first and
              an AI-native expression, but both are still tied to the same governance story.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
