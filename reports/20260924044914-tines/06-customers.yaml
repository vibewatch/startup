schemaVersion: report-v2
artifact: customers
slug: tines
runDate: '2026-09-24'
company:
  name: Tines
chapter:
  number: 6
  title: Customers
  summary: Tines has strong proof-of-value across security and IT teams, with customer stories that show real time savings,
    workflow reuse, and partner-driven expansion; the main gap is still independent retention evidence.
sections:
- id: customer-proof
  title: Named Customers and Proof of Value
  body: 'The customer set is broad and credible. Public case studies and partner posts name security-ops and IT teams at Personio,
    Vimeo, Intercom, Bitpanda, Sophos, Mars, GitLab, AWS-adjacent environments, Material Security, and many more. The through-line
    is the same: teams use Tines to replace manual handoffs, enrich alerts, and stitch together many tools. That makes the
    company look less like a niche point product and more like a workflow backbone for teams that already have too much operational
    entropy. The case studies are especially persuasive because they pair qualitative fit with concrete hour savings and workflow
    count growth.'
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU005
  - CU009
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-pattern
  title: How Adoption Expands
  body: 'The adoption pattern is consistent: one team starts because the pain is obvious, then adjacent teams see the value
    and request access. That is visible in the product-led story library, the multiple customer case studies, and the 2026
    channel report that shows partners now doing a material share of the revenue work. The 3B launch strengthens this pattern
    because the examples now include non-security work such as finance and account research. If those examples hold, the customer
    base can expand horizontally without losing the original security wedge. That pattern is why the customer story reads
    more like a platform adoption curve than a series of one-off wins.'
  claimRefs:
  - CU002
  - CU006
  - CU007
  - CU010
  - CU012
  tableRefs:
  - TU002
- id: what-is-still-missing
  title: What Is Still Missing
  body: The customer thesis is strong, but it is still more story-based than data-based. The cache does not give a clean churn
    chart, a public NRR number with independent confirmation, or audited retention cohorts. That matters because the product
    is now being marketed as a broader enterprise platform, and broader platforms depend on expansion retention as much as
    they depend on new logos. So the key diligence question is not whether customers like the product; it is how sticky it
    is once the first workflow has been built. The last missing step is a clean retention/cohort story that proves the expansion
    is durable.
  claimRefs:
  - CU008
  - CU011
  tableRefs:
  - TU003
