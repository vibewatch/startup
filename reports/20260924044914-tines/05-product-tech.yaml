chapter:
  number: 5
  title: Product & Technology
  summary: 'Tines is re-architecting itself from a security-focused no-code builder into an AI-native workflow runtime: Stories
    stays as the visual layer while 3B pushes code-first creation, governance, and controlled execution.'
sections:
- id: product-surface
  title: Product Surface and Module Map
  body: The product is now best thought of as two layers. Stories remains the visual, security-first builder that gave Tines
    its original traction, while 3B is the newer code-first layer for AI-native workflows, apps, and agents. That split is
    important because it changes who the product is for and how it should be evaluated. Stories optimizes for control and
    familiarity; 3B optimizes for AI-assisted creation and governed runtime execution. The two can coexist, but they are not
    the same product thesis. The company now sits at the intersection of workflow automation and governed AI app creation,
    which expands its target user base without removing the original security wedge. This matters because the evaluation is
    now about platform governance, not just low-code speed. That broader scope is why customers can now evaluate the platform
    against both workflow builders and AI governance layers. That matters because the platform is now being compared to adjacent
    AI workspaces as well as to classic workflow tools.
  claimRefs:
  - CE001
  - CE008
  - CE012
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: architecture-and-control
  title: Architecture, Runtime, and Control Plane
  body: The 3B architecture is designed around generated code, isolated execution, and centralized governance. That matters
    because the company is explicitly responding to the problem of employees building AI tools outside IT supervision. Tines
    is saying the value is not just “let people build faster”; it is “let them build without losing control, credentials,
    or logging.” In other words, the platform is trying to be the safe runtime for work that would otherwise live in shadow
    AI, spreadsheets, or one-off hosting accounts. That makes the runtime and control plane at least as important as the builder
    experience itself. In practice, the buyer is asking the platform to act like a runtime, a policy engine, and an automation
    builder all at once. This is especially important for buyers who want one system to govern both human-authored and AI-authored
    work. The runtime story is therefore a core part of the product, not an implementation detail.
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE005
  - CE010
  tableRefs:
  - TE002
- id: trust-and-signal
  title: Trust, Security, and Developer Signal
  body: The current cache shows some trust signals but not a full public certification story. The DPA points to enterprise
    security processes, but public certification proof is thin; the Reddit community signal exists but is blocked at fetch
    time. That makes the product credible as enterprise software, yet still somewhat opaque as a developer-community platform.
    The moat therefore looks more like workflow depth, governance, and runtime control than open-source community momentum.
    The result is a product that looks enterprise-ready, but the external proof of trust still needs tightening. That is strong
    enough for enterprise adoption, but still not enough to remove every trust gap. The open question is whether the market
    rewards that breadth or penalizes the extra complexity. Buyers will care whether the trust story scales as quickly as
    the feature story.
  claimRefs:
  - CE006
  - CE007
  - CE009
  - CE011
  tableRefs:
  - TE003
