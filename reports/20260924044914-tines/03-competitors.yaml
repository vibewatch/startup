  title: Competitors
  summary: Tines now competes against agentic SOC vendors, open-core security automation stacks, workflow platforms, and legacy
    SOAR tools; the moat is governance plus workflow depth, not price alone.
sections:
- id: landscape
  title: Competitive Landscape
  body: The competitive set has broadened after the 3B launch. Tines is no longer just comparing itself with classical SOAR
    tools; it is now being measured against agentic SOC vendors, open-core alternatives, workflow platforms, and enterprise
    AI workspaces. That is a good sign in one sense because it means the company is participating in a bigger market, but
    it is also a warning sign because it widens the buyer comparison set. Buyers can now ask whether they need a workflow
    builder, an AI SOC analyst, an open-source control stack, or a broad enterprise automation layer. Buyers now have to choose
    among products that optimize for investigation autonomy, workflow flexibility, or open-core economics, which makes the
    category more confusing but also more useful to compare.
  claimRefs:
  - CP001
  - CP002
  - CP005
  - CP009
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: feature-matrix
  title: Capability and Pricing Comparison
  body: 'The most useful comparison axis is who writes the investigation or workflow and how much control the buyer keeps.
    Tracecat and SynapCores are explicit about open-source or open-core economics, while Tines emphasizes governed workflow
    creation and runtime control. Workato appears in the customer stories as a status-quo alternative that was limited by
    pricing and change control. Sim and other broader AI workspaces show that adjacent enterprise software is also moving
    into this territory. The result is a messy but understandable field: buyers are shopping for control, autonomy, and economics
    at the same time. Those trade-offs are exactly why the comparison set now matters as much as the feature set. The result
    is a comparison set where economics, governance, and authoring model all matter at once.'
  claimRefs:
  - CP003
  - CP004
  - CP006
  - CP007
  - CP008
  - CP011
  tableRefs:
  - TP002
  - TP003
  figureRefs: []
- id: moat-and-threats
  title: Moat and Threats
  body: 'Tines still looks differentiated, but mostly on architecture and governance rather than on a single feature or a
    uniquely low price. The company’s own framing of 3B is a response to AI sprawl and shadow AI, which means the moat now
    has to survive a broader market conversation. The biggest threat is commoditization: if the buyer can get enough workflow
    automation, enough agentic capability, or enough control from another stack for less money, Tines has to win on execution
    and trust. That makes the next year about proof, not positioning. The buyer should expect this space to keep changing
    quickly, so the map is a snapshot rather than a durable taxonomy. The more the market shifts toward AI-generated work,
    the more governance and runtime control matter relative to raw builder speed.'
  claimRefs:
  - CP010
  - CP012
  tableRefs: []
  figureRefs: []
