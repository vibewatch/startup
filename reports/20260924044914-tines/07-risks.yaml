- id: TR002
  title: Mitigation Table
  columns:
  - Mitigant
  - What helps
  - Residual concern
  - Diligence check
  rows:
  - - Large installed base
    - Existing Stories users can expand into 3B
    - Migration friction
    - How many existing customers pilot 3B?
  - - Reusable library
    - Hundreds of pre-built Stories lower build cost
    - May not translate to 3B directly
    - What percent of workflows are reused?
  - - Partner ecosystem
    - Partners drive reach and deal flow
    - Concentration / dependence
    - Which partners drive the most ARR?
  - - Governance controls
    - Credential protection, logging, access maps
    - Need independent proof
    - Can security review the controls?
  - - Funding runway
    - Capitalized for growth
    - Could still be burn-heavy
    - What is net burn?
  - - Customer proof
    - Multiple enterprise case studies
    - Case-study bias
    - What do renewal cohorts show?
  notes: Mitigants are real but do not eliminate the need for margin, retention, and governance diligence.
