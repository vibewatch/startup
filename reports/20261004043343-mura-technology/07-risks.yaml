company:
  name: Mura Technology
chapter:
  number: 7
  title: Risks
  summary: 'Mura''s central risk is execution: successive partner and company materials moved the expected start of the first
    20 ktpa Wilton line from 2022 to 2023 and then 2025, while a Mura executive acknowledged that design assumptions still
    require validation against steady-state operations. Partner concentration, regulatory verification, and financing capacity
    remain material because the retained evidence is company- or partner-issued and does not quantify current plant performance,
    liquidity, or contractual downside protections.'
sections:
- id: ranked-risk-view
  title: Ranked residual risk view
  body: 'Execution and commissioning rank first because the evidence records multiple prospective operating dates for the
    same first commercial Wilton line: 2022 in Dow''s 2021 announcement, 2023 in Dow''s later expansion announcement, and
    2025 in Mura''s 2025 brochure. That sequence does not establish the plant''s status on the run date, but it is direct
    evidence that schedule assumptions changed. The risk is amplified by the retained source set''s lack of current throughput,
    uptime, yield, product-quality, capex, liquidity, and contingency-funding data. Partner concentration ranks next because
    Dow, KBR, px Group, and feedstock providers occupy essential offtake, licensing, engineering, operating, and supply roles.
    The heatmap is a qualitative diligence prioritization, not a probability model.'
  claimRefs:
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR012
  - CR014
  - CR016
  figureRefs:
  - FR001
- id: regulatory-and-legal-exposure
  title: Regulatory, environmental, and claims exposure
  body: 'Mura''s brochure states that its output products are REACH registered, while its Singapore announcement anticipates
    collaboration with the National Environment Agency and a mix of domestic and imported recovered-plastic feedstock. Those
    statements identify mitigations and regulatory touchpoints, but the allocated materials do not include regulator-issued
    permits, registrations, import approvals, enforcement records, litigation searches, or site-specific environmental approvals.
    The most defensible residual-risk conclusion is therefore not that a breach or incident occurred, nor that none occurred,
    but that independent verification is missing. Sustainability-claims exposure also remains: Mura''s sustainability lead
    said design characteristics and expected loads must be checked against actual operation before carbon intensity is relied
    upon.'
  claimRefs:
  - CR002
  - CR010
  - CR011
  - CR015
  tableRefs:
  - TR001
- id: operations-and-scale-up
  title: Operations, quality, and scale-up
  body: 'Hydro-PRT requires shredding and removal of glass, grit, metals, and stones before conversion, creating a feedstock-quality
    and preprocessing control point. Mura also says product upgrading integration with KBR is still being developed, while
    its partner materials describe planned scale from a 20 ktpa first line toward 50 ktpa and 120 ktpa facilities. The evidence
    supports technical process descriptions and mitigation relationships, but not stable commercial throughput or performance
    at those scales. The operational kill criterion should be measurable: inability to show sustained nameplate-relative throughput,
    contracted-quality output, acceptable yield, uptime, and energy intensity over a representative steady-state period would
    break the scale-up thesis. Security, recall, and incident controls remain unverified rather than presumed absent.'
  claimRefs:
  - CR001
  - CR002
  - CR007
  - CR009
  - CR014
  tableRefs:
  - TR002
- id: dependencies-and-financing
  title: Partner, supply, and financing dependencies
  body: Dow is described as a key offtaker and provider of resources intended to help finance a multi-project pipeline; KBR
    is the exclusive licensing partner and participates in engineering and upgrading; and Mura says px Group received a ten-year
    Wilton operations and maintenance contract. These arrangements can reduce execution friction, but they also create concentrated
    interfaces whose termination rights, performance guarantees, step-in provisions, and minimum commitments are not disclosed
    here. Singapore adds dependence on local collection, imported verified feedstock, agency coordination, and industrial-site
    integration. Because the retained sources do not disclose capex, cash burn, liquidity, debt covenants, or contingency
    funding, funding raised or partner support cannot be treated as cash available for completion.
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR011
  - CR012
  - CR013
  - CR016
  tableRefs:
  - TR003
