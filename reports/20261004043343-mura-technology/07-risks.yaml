    - Reduced commitment, delayed qualification, or site cancellation weakens demand and project finance.
    - Critical
    - Long-term partnership and planned multi-facility rollout.
    - High; minimum volumes, pricing, termination rights, and replacement offtake are undisclosed.
  - - Licensing, engineering, and upgrading / KBR
    - Exclusive licensing partner, engineering participant, and upgrading collaborator.
    - Partner delay, contract dispute, or technology-integration shortfall constrains deployment.
    - High
    - Global engineering capability and first license relationship.
    - High; exclusivity, IP continuity, service levels, and step-in rights are undisclosed.
  - - Wilton operations / px Group
    - Mura reports a ten-year operations and maintenance contract.
    - Operator underperformance or misaligned incentives delay stable output.
    - High
    - Long-duration O&M relationship.
    - Medium-high; guarantees, remedies, and operational acceptance tests are undisclosed.
  - - Feedstock and approvals / Singapore suppliers and agencies
    - Planned reliance on local waste, imported verified feedstock, NEA coordination, and site infrastructure.
    - Insufficient compliant feedstock or delayed approvals strands capacity.
    - High
    - Local collaboration and Jurong Island integration are described.
    - High until supply volumes, import permissions, specifications, and fallback sourcing are contracted.
  notes: Counterparty roles come from company or partner materials. Concentration and residual-severity judgments are qualitative
    because contract economics, commitments, remedies, and termination provisions were not included in the assigned evidence.
