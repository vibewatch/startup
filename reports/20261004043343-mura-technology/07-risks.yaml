- id: TR002
  title: Operational, quality, and security risk register
  columns:
  - Failure mode
  - Evidence signal
  - Likelihood
  - Severity
  - Mitigation maturity
  - Residual exposure / trigger
  rows:
  - - Commissioning and schedule slippage
    - Public expectations moved from 2022 to 2023 and then 2025 for the first commercial line.
    - High
    - Critical
    - Limited evidence; later dates update plans but do not establish current operation.
    - Critical until sustained production is verified; trigger is another unexplained operating-date reset.
  - - Commercial scale-up underperforms design
    - Mura says expected loads must be checked against actual steady-state operation.
    - High
    - Critical
    - Developing through monitoring and external LCA-data work.
    - Critical if sustained throughput, yield, uptime, energy use, or product quality miss contracted thresholds.
  - - Feedstock contamination disrupts conversion
    - Process requires shredding and removal of glass, grit, metals, and stones.
    - Medium
    - High
    - Process-level preprocessing is described; rejection rates and supplier specifications are not.
    - High if contamination raises downtime, disposal cost, or yield loss beyond contracted tolerances.
  - - Product upgrading or refinery integration delays acceptance
    - Mura says upgrading integration with KBR is still under development.
    - Medium
    - High
    - Active partner development, without disclosed qualification results.
    - High if products require unplanned upgrading or fail customer specifications.
  - - Cybersecurity, process-control, recall, or incident response is inadequate
    - No control framework, audit, incident log, or recall protocol appears in the retained evidence.
    - Unknown
    - High
    - Not evidenced.
    - Unknown; require controls evidence rather than infer safety from no recorded incident in this set.
  notes: Qualitative ratings use disclosed schedule changes, process dependencies, and explicit validation gaps. They are
    not incident frequencies; the final row records an evidence gap and does not assert that an incident occurred or that
    no incident exists.
