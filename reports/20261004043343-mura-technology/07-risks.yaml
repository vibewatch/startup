      history, litigation results, and site-specific compliance status.
    whyItMatters: Company claims cannot independently establish freedom to operate or the conditions that could delay, constrain,
      or stop commercial production.
    diligencePath: Obtain registration identifiers and complete permit schedules, then verify each directly with the relevant
      UK, EU, and Singapore regulator and run jurisdiction-specific court searches.
