    - Obtain site-level LCA inputs, peer-review scope, metered energy data, yield, and steady-state test periods.
  - - Product registration and market access / UK and EU
    - Mura's 2025 brochure states all output products are REACH registered; no regulator record is retained.
    - Medium
    - High
    - Claimed registration, independently unverified in this source set.
    - Medium-high because registration scope and conditions are not shown.
    - Obtain REACH registration numbers, legal entities, tonnage bands, safety data sheets, and regulator confirmation.
  - - Feedstock, import, and site approvals / Singapore
    - Company-issued coverage describes expected NEA collaboration and local plus imported recovered-plastic feedstock.
    - Medium
    - High
