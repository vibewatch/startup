  topStrengths:
    - Proprietary Hydro-PRT process with a disclosed commercial-scale Wilton asset.
    - KBR licensing and engineering channel plus strategic backing from Dow and Innovate UK.
    - Multiple announced counterparties and project milestones provide commercialization validation.
  topRisks:
    - No audited disclosure of revenue, margin, cash, debt, runway, or valuation.
