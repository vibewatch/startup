companyProfile:
  summary: >-
    Mura Technology is a privately held UK advanced-plastics-recycling company built around its Hydro-PRT
    supercritical-water process. The company combines owner-developed plants, most visibly the Wilton commercial-scale
    asset in Teesside, with KBR's exclusive global licensing and engineering channel. Public evidence shows strategic
    support from KBR, Dow, and Innovate UK, but it does not disclose current revenue, margins, cash, debt, or a
    supportable valuation.
  foundedDate: '2019-01-01'
  headquarters: Wilton Centre, Redcar, Cleveland, UK
  productSummary: >-
    Hydro-PRT hydrothermal recycling platform that converts mixed plastic waste into circular hydrocarbon feedstocks and
    related products.
  customerFocus: Petrochemical offtakers, chemical manufacturers, and regional project licensees
  businessModel: >-
    Hybrid owner-operator and technology-licensing model with product sales from company sites and license and
