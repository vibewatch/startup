- id: feedstock-products-and-upgrading
  title: Feedstock Tolerance Envelope, Hydrocarbon Product Slate, and Refinery Upgrading
  body: The commercial differentiation of Hydro-PRT rests on its broad tolerance for contaminated, mixed post-consumer waste
    plastics that mechanical recyclers routinely reject. Target input streams encompass polyolefins (polyethylene and polypropylene),
    polystyrene, multi-layer flexible films, laminated and metalized packaging, and rigid containers laden with organic residues
    such as food remnants and paper labels. After mechanical preprocessing to shred bales and remove inert contaminants including
    metals, grit, and glass, the plastic is melted, pressurized, and blended with supercritical water before reactor injection.
    The depressurized reaction effluent undergoes flash distillation to separate products into light vapour gas cracker feedstocks,
    circular liquid hydrocarbons (naphtha substitutes), and a circular heavy residual fraction suitable as an asphalt and
    bitumen additive. Process off-gas is recycled directly into plant boilers to generate supercritical steam, reducing external
    fossil energy consumption. To maximize petrochemical substitution, Mura and engineering partner KBR have developed bolt-on
    product upgrading modules that hydrotreat raw distillates to meet stringent olefin cracker purity specifications.
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
  tableRefs:
  - TE002
- id: deployment-roadmap-and-risks
  title: Commercial Facility Deployment, Licensing Pipeline, and Infrastructure Bottlenecks
  body: Mura executes a hybrid commercial model combining direct equity asset ownership with global technology licensing managed
    exclusively by KBR Inc., which also holds an 18.5 percent equity stake secured by a charge over Mura's intellectual property.
    Mura's flagship commercial-scale asset, Mura Wilton in Teesside, UK (developed under subsidiary ReNew ELP), was planned
    as an 80,000 tonnes per annum plant constructed across four 20,000 tpa lines, with an initial 20 kta phase supported by
    a 4.42 million pound Innovate UK grant and operated under a 10-year contract by px Group. In parallel, KBR licensed Hydro-PRT
    units to international chemical producers including Mitsubishi Chemical (25 kta at Ibaraki, Japan), LG Chem (25 kta in
    South Korea), and GS Caltex (50 kta in South Korea). However, Mura's ambitious roadmap—targeting 1.5 million tonnes of
    global capacity in operation or development by 2032—experienced a severe structural disruption in August 2025 when anchor
    partner Dow canceled plans for a 120 kta facility at Böhlen, Germany. Dow's cancellation was precipitated by its planned
    fourth-quarter 2027 shutdown of the Böhlen steam cracker, exposing the critical vulnerability of co-located chemical recycling
    plants to incumbent petrochemical asset closures.
