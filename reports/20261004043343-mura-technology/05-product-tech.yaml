tables:
- id: TE001
  title: Hydro-PRT Technology and Operating Architecture
  columns:
  - Layer / Component
  - Functional Role
  - Technical Dependency
  - Operating & Diligence Risk
  rows:
  - - Mechanical Feedstock Pretreatment
    - Shredding waste plastic bales and removing non-plastic contaminants
    - Optical sorters, shredders, magnetic and ballistic separators
    - Abrasive wear and operational downtime from unseparated glass, grit, or metal fragments
  - - Extrusion & Melt Pressurisation
    - Heating and pressurizing shredded plastic into a continuous molten stream
    - High-pressure polymer feed pumps and heating elements
    - Polymer melt viscosity fluctuations and pump cavitation across mixed polymer blends
  - - Supercritical Water Injection
    - Generating and blending supercritical steam (>374°C, >221 bar) with molten plastic
    - High-pressure steam boilers and specialized corrosion-resistant mixing chambers
    - Extreme thermal fatigue, erosion, and stress corrosion cracking from supercritical steam
  - - Hydrothermal Reactor Conversion
    - Supercritical cleavage of C-C bonds with in-situ hydrogen donation (25–30 min residence)
    - Licella Cat-HTR patented reactor geometry and pressure containment vessel
    - Plug flow disruption, residence time drift, and intellectual property encumbrance
  - - Depressurisation & Energy Recovery
    - Let-down of multi-phase reaction effluent and heat integration to steam generation
    - High-differential pressure control valves and multi-stage heat exchangers
    - Severe valve trim erosion, fouling from heavy fractions, and pressure let-down instability
  - - Flash Separation & Distillation
    - Fractionating effluent into process gas, liquid distillates, and residual heavy bottoms
    - Fractionation columns, condensers, and vacuum distillation vessels
    - Product cut inconsistency, olefin recombination, and column fouling from wax carryover
  - - KBR Upgrading Bolt-On
    - Hydrotreating circular liquid hydrocarbons to remove halogens and olefinic precursors
    - Hydrogen supply, fixed-bed hydroprocessing catalysts, and KBR engineering
    - Catalyst poisoning from residual chlorine, sulfur, and heavy metals present in waste
  notes: Operating parameters and layer dependencies synthesized from Mura Technology technical disclosures, Licella platform
    documentation, and KBR engineering partnership filings.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE008
  - CE009
  - CE010
- id: TE002
  title: Hydro-PRT Product Slate and Petrochemical Use Cases
  columns:
  - Product Fraction
  - Petrochemical Role
  - Mura Solution & Specifications
  - Measurable Value & Target Market
  - Technical & Offtake Limitation
  rows:
  - - Circular Liquid Hydrocarbons (Naphtha)
    - Direct virgin fossil replacement in steam crackers
    - Light liquid hydrocarbon cuts produced via flash distillation; REACH registered
    - Enables virgin-equivalent polymer synthesis suitable for food-contact packaging
    - Requires hydrotreating / upgrading to meet steam cracker chlorine and olefin standards
  - - Light Vapour Products (Process Gas)
    - Gas cracker feedstock or on-site boiler fuel
    - Short-chain gaseous hydrocarbon fractions recovered from reactor let-down
    - Combusted in on-site boilers to generate steam, reducing external fossil utility demand
    - Fuel value cannibalizes potential petrochemical chemical feedstock yield
  - - Circular Heavy Residual
    - Binder additive for heavy industrial and infrastructure applications
    - High-boiling hydrocarbon pitch and waxy bottoms fraction
    - Commercial road asphalt and bitumen extender capturing remaining carbon mass
    - Low margin realization compared to high-value light olefin cracked chemicals
  - - Upgraded Circular Naphtha
    - Drop-in olefin cracker feedstock
    - Hydrotreated liquid fraction developed with KBR upgrading modules
    - Direct feed into commercial ethylene crackers without downstream plant fouling
    - Requires significant capital expenditure for dedicated hydroprocessing infrastructure
  notes: Product fractions and end-use specifications derived from Mura 2025 technical brochure and joint Dow announcements;
    REACH registration applies to Mura commercial fractions.
