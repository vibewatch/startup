company:
  name: Mura Technology
chapter:
  number: 5
  title: Product & Technology
  summary: Mura Technology deploys Hydro-PRT (Hydrothermal Plastic Recycling Technology), a supercritical water hydrothermal
    liquefaction process licensed exclusively via KBR that converts unsorted, contaminated post-consumer plastic waste into
    circular hydrocarbon feedstocks. While its core continuous-flow reactor design eliminates catalyst fouling and achieves
    an over 85 percent mass conversion yield to hydrocarbons, commercial maturation faces severe industrial counter-pressures
    highlighted by Dow's August 2025 cancellation of the 120 kta Böhlen project following the closure of its regional steam
    cracker.
sections:
- id: technology-operating-model
  title: Hydro-PRT Process Mechanism and Core Thermodynamic Architecture
  body: Mura Technology's operating architecture centers on Hydro-PRT (Hydrothermal Plastic Recycling Technology, formerly
    marketed as HydroPRS), an advanced hydrothermal liquefaction (HTL) system derived from Licella's patented Catalytic Hydrothermal
    Reactor (Cat-HTR) platform. Unlike conventional pyrolysis or gasification pathways that suffer from low thermal conductivity,
    severe coking, and strict feedstock sorting constraints, Hydro-PRT utilizes supercritical water as a homogeneous heat-transfer
    medium and reactive chemical agent. Operating at supercritical conditions exceeding 374 degrees Celsius and 221 bar of
    pressure, water exhibits liquid-like density and gas-like diffusivity, behaving as molecular scissors that rapidly sever
    long-chain polymer bonds in under 30 minutes. Furthermore, supercritical water acts as an active donor of hydrogen to
    stabilize cracked free radicals, suppressing secondary char-forming condensation reactions and yielding an over 85 percent
    mass conversion efficiency from dry ash-free plastic into stable, shorter-chain circular hydrocarbons.
  claimRefs:
