callouts:
- calloutType: risk
  title: Co-Location Vulnerability Exposed by Dow Böhlen Plant Cancellation
  body: Advanced chemical recycling facilities designed to supply circular naphtha directly to regional petrochemical steam
    crackers face systemic asset co-location risk. In August 2025, Dow canceled the flagship 120 kta Böhlen project following
    its decision to permanently shut down its adjacent steam cracker by Q4 2027. This development proves that advanced recycling
    capital expenditure remains hostage to the economic viability and restructuring cycles of aging incumbent petrochemical
    assets.
  claimRefs:
  - CE013
  - CE014
- calloutType: insight
  title: Thermodynamic Superiority of Supercritical Water Over Pyrolysis
  body: By employing supercritical water rather than external conductive heating, Hydro-PRT overcomes the fundamental thermodynamic
    bottlenecks of traditional pyrolysis. Supercritical steam provides instantaneous, homogeneous volumetric heat transfer,
    eliminates tube coking, and donates hydrogen to cap reactive radical species. This delivers an over 85 percent mass conversion
    to stable hydrocarbon products while accommodating mixed, organic-contaminated packaging waste.
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE006
