    notes: 评估反映截至 2026 年 10 月的状态；私人公司报告边界和缺失的经审计账目限制了该立场。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV010
      - CV014
  - id: TV002
    title: 投资逻辑与反向逻辑矩阵
    columns:
      - 支柱
      - 投资逻辑
      - 反向逻辑风险
      - 哪些信息会改变判断
    rows:
      - - 技术与产品
        - Hydro-PRT 以超临界水为介质，在 30 分钟内将受污染的多层塑料回收为高价值循环烃。
        - 长期催化剂稳定性、分水能耗，以及连续商业产率尚未经过多年运行验证。
        - 独立技术审计验证连续运营周期中的持续质量收率和产品纯度。
      - - 商业分销
        - KBR 是独家全球许可和工程合作伙伴，提供国际销售覆盖和 EPC 可信度。
        - 许可模式让 Mura 与项目执行控制脱钩；KBR 持有股权并拥有 IP 担保费用，形成悬而未决的负担。
        - 明确特许权使用费分成经济性，并完整解除或调整 KBR 的 IP 担保费用优先级。
      - - 承购与合作关系
        - 与全球化工龙头 Dow 和 CPChem 的战略性多工厂合作，为循环石脑油提供有承诺的承购需求。
        - Dow 于 2025 年 8 月取消 120 kta Böhlen 工厂，暴露出下游石化裂解装置关闭带来的结构性脆弱性。
        - 与其他欧洲和北美裂解装置运营商签署具有约束力、不可取消的承购协议。
      - - 全球项目规模化
        - 国际布局多元，覆盖 Wilton（英国）、Ibaraki（日本）、LG Chem（韩国）和裕廊岛（新加坡）。
        - 资本密集型海外工厂开发带来跨境许可、建设成本通胀和原料风险。
        - 初始 Wilton 产线和亚洲许可工厂成功完成商业调试并产生正 EBITDA。
    notes: 这些支柱综合了从一手申报文件和行业报道中识别出的技术、商业、合作伙伴和运营风险。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV011
      - CV012
  - id: TV003
    title: 情景估值与运营回报矩阵
    columns:
      - 情景
      - 核心假设
      - 运营与估值逻辑
      - 关键下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - Wilton 达到 80 kta 满负荷；MCC（25 kta）和 LG Chem（25 kta）工厂开始运营；新加坡 50 kta 场地完成 FID。
        - Mura 实现混合特许权使用费收入和强劲的 Wilton 承购利润率；在战略流动性事件中，公司估值超过 $1B。
        - 欧盟化学回收质量平衡核算遭遇未预见的催化剂中毒或监管阻力。
        - 中低（20%）
      - - 基准情景
        - Wilton 在初始 20 kta 产能下稳定运营；亚洲许可单元仅有小幅延迟；欧洲直接扩建仍处于冻结状态。
        - Mura 作为盈利的细分许可方和区域运营商，产生稳定现金流，但企业估值倍数有限。
        - 低价的原生石脑油持续压低循环绿色溢价；被许可方建设进度较慢。
        - 中等（55%）
      - - 悲观情景
        - Wilton 遭遇机械停机或运营利润为负；Böhlen 之后，更多承购伙伴取消共址单元。
        - 流动性耗尽，迫使公司进行稀释性纾困融资或债务重组；KBR 执行 IP 担保费用以收回资本。
        - 欧洲石化合作伙伴的裂解装置全部停产，或运营项目特殊目的载体资不抵债。
        - 中等（25%）
    notes: 情景反映风险调整后的定性里程碑；由于私人财务数据存在缺口，未列出确切的企业估值数字。
    claimRefs:
      - CV004
      - CV005
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
