  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Mura Technology 的核心投资逻辑建立在自研 Hydro-PRT 水热塑料回收平台的技术壁垒和全球规模化能力上，并由一流战略伙伴支持。Hydro-PRT
              以超临界水为反应介质，在约三十分钟内将混合、受污染的消费后塑料废弃物（包括机械回收商认为无法回收的多层膜）转化为循环液态烃（石脑油替代物）、重质残余油和工艺气体。KBR Inc.
              作为全球独家许可和工程合作伙伴，降低了平台商业分销风险；与 Dow 等化工巨头的长期安排也提供了全球承购验证。反过来，反向投资逻辑来自严重的项目执行依赖、交易对手资产重组和集团层面的财务不透明。2025 年 8
              月，Dow 决定在 Q4 2027 前永久关闭 Böhlen 蒸汽裂解炉并取消德国 Böhlen 计划中的 120,000 mt/year 化学回收工厂，凸显了 Mura 共址模式的脆弱性。此外，KBR
              持有股权并对 Mura 知识产权享有广泛担保权，公开投资者面临结构性次级地位，公司的烧钱状况也未获验证。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV014
              - CV015
      - number: '8.2'
        title: 资本形成历史、战略融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Mura Technology 的资本形成主要由产业战略投资者和非稀释性政府支持推动，而非传统且披露估值的风险投资轮。2020 年 10 月，Mura Wilton 从 Innovate UK 的 Smart
              Sustainable Plastic Packaging 计划获得 £4.42 million 非稀释性资助，用于支持在 Teesside 建设首座商业规模 Hydro-PRT 工厂。2022 年 6
              月，KBR 达成协议，追加投资 USD 100 million 于 Mura Technology，扩大双方战略联盟，并在 Mura 董事会安排一名 KBR 代表。战略股权参与还包括
              Dow、CPChem（2021 年 12 月通过子公司 Six Pines Investments LLC）以及运动塑料专业公司 igus GmbH 于 2020 年进行的重大投资。然而，Mura
              Technology
              从未公开提交未经调整的投前或投后股权估值，其股权结构表、期权池、清算优先权或股息条款也未公开。由于关键运营产量、收入实现和现金利润率仍由私人公司管理层隐瞒，任何精确的企业价值估算都只是推测模型，而非经验证的投资现实。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV010
              - CV014
      - number: '8.3'
        title: 情景分析、退出路径与关键尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              评估 Mura 的回报特征，需要把投资判断建立在运营里程碑、许可推进速度和交易对手资产稳定性之上。在乐观情景中，Mura Wilton 从最初 20 kta 名义产能顺利爬坡至 80 kta，KBR 成功调试
              Mitsubishi Chemical Corporation（日本 25 kta）和 LG Chem（韩国 25 kta）的许可商业生产线，Mura 也直接完成其计划中的新加坡 Jurong Island 50
              kta 工厂，从而产生混合的高利润率版税流和直接承购现金流。在基准情景中，Mura 维持 Wilton
              的运营可行性，并从亚洲化学品被许可方获得稳定的经常性版税，但随着欧洲工业裂解炉精简，国际直接资本支出扩张停滞，Mura 成为专业技术许可方。在悲观情景中，Teesside
              持续存在运营瓶颈、许可推出延迟或下游化学品生产商进一步取消承购，都会引发严重流动性压力，使 Mura 暴露于 KBR 的 IP 担保权和潜在重组风险。对机构股权投资作投资判断，需要取得 Mura 完整的
              FY2024–FY2025 经审计财务报表、实际 EPC 资本支出账目，以及 KBR IP 担保权的法律契约。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 建议立场：财务披露完成前继续研究
            body: >-
              尽管 Mura Technology 与 KBR 和 Dow 建立了顶级商业工程联盟，目前仍不宜建议投入资本。2025 年 8 月取消 120 kta Böhlen
              工厂，证明商业承购合作容易受到欧洲工业重组影响。潜在投资者应维持继续研究的立场，直到完整 FY2024–FY2025 经审计账目和 KBR IP 担保条款完成审阅。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV015
