              2025 年。这一序列不能证明工厂在运行日期的状态，但直接证明了进度假设发生变化。现有来源缺少当前产量、开工率、产出率、产品质量、资本支出、流动性和应急融资数据，进一步放大了风险。合作伙伴集中度排名第二，因为
              Dow、KBR、px Group 和原料供应商分别承担关键的承购、许可、工程、运营和供应角色。这张热力图是尽调优先级的定性排序，不是概率模型。
