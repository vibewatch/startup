      - number: '5.2'
        title: 原料容忍范围、烃产品组合与炼厂升级
        blocks:
          - type: paragraph
            body: >-
              Hydro-PRT
              的商业差异化来自其对机械回收商经常拒收的受污染混合消费后废塑料具有广泛容忍度。目标原料包括聚烯烃（聚乙烯和聚丙烯）、聚苯乙烯、多层柔性膜、层压和金属化包装，以及带有食物残渣、纸质标签等有机残留物的硬质容器。塑料先经机械预处理，撕碎料包并去除金属、砂砾和玻璃等惰性污染物，再熔融、加压并与超临界水混合后注入反应器。减压后的反应流出物经闪蒸分馏，分成轻质蒸气裂解炉原料、循环液态烃（石脑油替代物）和可用作沥青添加剂的循环重质残余馏分。工艺尾气直接回收到锅炉中生成超临界蒸汽，减少外部化石能源消耗。为最大化石化替代，Mura
              与工程合作伙伴 KBR 开发了外挂式产品升级模块，通过加氢处理原始馏分，使其达到严格的烯烃裂解炉纯度规格。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE007
              - CE008
