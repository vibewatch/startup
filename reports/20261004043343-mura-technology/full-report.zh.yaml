        title: 商业模式、资本密集度与可持续性
        blocks:
          - type: paragraph
            body: >-
              Mura 采用双重商业模式：直接持股运营旗舰工厂（如英国 Teesside 的商业规模工厂），并通过工程合作伙伴 KBR Inc. 独家开展全球技术许可。Dow
              等石化合作伙伴提供长期原料承购协议，形成结构性整合，锁定下游对循环石脑油和馏分油的需求，用于制造相当于原生料的食品接触聚合物。不过，工厂资本密集度高且容易受当地场地经济性影响，带来执行摩擦。Dow
              在其现场蒸汽裂解炉关闭后取消德国 Böhlen 年产 120,000 mt/year 化学回收工厂计划，凸显该行业对所在炼厂和石化资产关闭的敏感性。
