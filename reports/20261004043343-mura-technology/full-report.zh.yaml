      - number: '2.4'
        title: 结构性增长驱动、监管要求与商业执行阻力
        blocks:
          - type: paragraph
            body: >-
              严格的监管框架和企业可持续发展目标推动了先进水热回收的商业采用，但资本密集度和工业项目执行风险又严重限制了它。增长动力包括欧盟包装废弃物指令、强制回收成分门槛、生产者延伸责任（EPR）法规，以及品牌方实现净零循环包装的承诺。与热解相比，超临界水技术具有明显环境优势：热效率更高，能处理混合多层基材，也能消除外部催化剂中毒问题。不过，该行业仍面临明显阻力。商业项目需要巨额资本支出、专用高压冶金材料，并要复杂地接入石化联合体。2025
              年 8 月，Dow 正式取消与 Mura 合作在德国 Böhlen 建设年产 120,000
              公吨化学回收工厂，清楚暴露了商业脆弱性。即便上游承购兴趣强劲，持续存在的执行障碍、项目融资复杂性和宏观经济阻力仍会威胁大规模商业部署。
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 下行风险：商业执行与合作方取消工厂
            body: >-
              Dow 于 2025 年 8 月取消 Böhlen 年产 120,000 mt/year 化学回收工厂，对 Mura Technology 构成重大商业挫折。尽管 Dow
              重申有意探索其他欧洲合作机会，但欧洲原计划中最大的先进回收工厂被终止，凸显快速商业扩张面临的宏观经济、许可和资本支出障碍。
            calloutType: risk
            claimRefs:
              - CM010
              - CM016
          - type: callout
            title: 战略契合：即用型石化兼容性免去包装重新设计
            body: Hydro-PRT 水热液化提供可直接接入现有石化蒸汽裂解炉的液态烃，让树脂生产商能够合成机械性能和食品接触性能相同的原生级聚合物。这直接解决了品牌方的主要瓶颈：敏感包装应用无法使用性能下降的机械回收料。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与回收替代方案
        blocks:
          - type: paragraph
            body: >-
              处理塑料废弃物的技术版图包括成熟的机械回收、能源回收（焚烧）、溶剂型物理回收（溶解），以及热解、气化和水热液化等化学回收技术。由于资本成本低且运营记录经验证，成熟机械回收仍是硬质聚乙烯（PE）和聚丙烯（PP）废物流的全球主流标准。然而，机械回收在反复挤出循环中会严重降级，技术上也无法处理消费后柔性膜、受污染的消费后聚烯烃或多层阻隔包装。Mura
              Technology 明确设计 Hydro-PRT 超临界水工艺，用于处理消费后包装膜、盒、桶，以及机械分拣设施产生的拒收物流；这些是互补投入，而不是与其争夺洁净硬质单一材料包。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
      - number: '3.2'
        title: 技术能力与生命周期基准
        blocks:
          - type: paragraph
            body: >-
              与传统热解相比，Mura 的 Hydro-PRT 工艺以超临界水作为传热介质和化学试剂，像分子剪刀一样，在 25 到 30
              分钟内切断长链聚合物键，将其转化为循环烃液体和气体，无需额外添加催化剂。欧盟委员会联合研究中心（EU-JRC）对混合聚烯烃柔性包装废弃物开展的独立生命周期评估显示，水热化学回收对酸化和化石资源使用的净节省量与传统热解相当或更高。不过，EU-JRC
              也证明，包括水热系统在内的所有化学回收路径都会加重气候变化相关的温室气体净负担，因为与原生机械再造粒相比，废弃物处理及溶剂/水加压需要大量电力和热能。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
