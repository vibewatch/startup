          touchpoints:
            - 管道或油罐车运送至裂解装置场地
            - REACH 认证的化学规格
            - 质量平衡核算协议
          sentiment: positive
        - label: 聚合物合成与品牌交付
          stage: 聚合物合成与品牌交付
          actor: 全球消费品牌与包装转换商
          objective: Fabricate food-contact recycled plastic packaging meeting ESG targets
          touchpoints:
