              - CM010
              - CM016
      - number: '2.3'
        title: 客户分层、商业采用路径与价值链经济性
        blocks:
          - type: paragraph
            body: >-
              水热先进回收的采用横跨三个不同商业群体：石化树脂生产商、全球消费品包装品牌和废弃物管理聚合商。Dow、Mitsubishi Chemical Corporation
              等石化树脂制造商是主要付费客户和承购方。这些企业既面临法定要求，也承担企业 ESG
              承诺，需要把经认证的回收成分加入原生级聚合物，同时不影响食品接触监管许可。承购协议通常是多年原料供应合同，让化学品生产商免受原油价格波动影响，同时锁定高纯度回收烃。全球快速消费品（FMCG）品牌方是间接需求拉动者，需要用循环聚合物制造柔性食品包装，而无需承担昂贵的容器重新设计成本。在上游供应端，废弃物管理聚合商和机械回收分拣设施充当供应商或代加工合作伙伴，寻找具有成本竞争力的分流出口，以避免不断上涨的填埋处理费和焚烧炉碳税。Mura
              通过双重上市路径变现这一生态：既直接持股开发工厂（如旗舰 Mura Wilton 工厂），也通过与 KBR 的全球独家许可合作获得技术许可费和工程服务版税。
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
