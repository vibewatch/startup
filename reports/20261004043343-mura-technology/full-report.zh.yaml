              - CE014
      - number: '5.3'
        title: 商业工厂部署、许可管线与基础设施瓶颈
        blocks:
          - type: paragraph
            body: >-
              Mura 采用混合商业模式：直接持有资产股权，同时由 KBR Inc. 独家管理全球技术许可；KBR 还持有 18.5 percent 股权，并以 Mura 的知识产权设定担保。Mura 的旗舰商业规模资产
              Mura Wilton 位于英国 Teesside，由子公司 ReNew ELP 开发，原计划建设年产 80,000 tonnes 的工厂，分为四条 20,000 tpa 生产线；首期 20 kta 获得
              4.42 million pound Innovate UK 资助，并由 px Group 按 10 年合同运营。与此同时，KBR 向 Mitsubishi Chemical（日本 Ibaraki 25
              kta）、LG Chem（韩国 25 kta）和 GS Caltex（韩国 50 kta）等国际化学品生产商许可 Hydro-PRT 单元。然而，Mura 计划到 2032 年形成 1.5 million
              tonnes 全球在运营或开发产能，2025 年 8 月遭遇严重结构性打击：锚定合作伙伴 Dow 取消了在德国 Böhlen 建设 120 kta 工厂的计划。Dow 取消项目的直接原因是计划在 2027
              年第四季度关闭 Böhlen 蒸汽裂解炉，这暴露出共址化学回收工厂容易受既有石化资产关闭影响的关键脆弱性。
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
