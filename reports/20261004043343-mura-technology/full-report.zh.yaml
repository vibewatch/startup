  - id: TE001
    title: Hydro-PRT 技术与运营架构
    columns:
      - 层 / 组件
      - 功能角色
      - 技术依赖
      - 运营与尽调风险
    rows:
      - - 机械原料预处理
        - 撕碎废塑料包并去除非塑料污染物
        - 光学分选机、撕碎机、磁选机和弹道分选机
        - 未分离的玻璃、砂砾或金属碎片导致磨损和运营停机
      - - 挤出与熔体增压
        - 加热并加压撕碎塑料，使其形成连续熔融流
        - 高压聚合物进料泵和加热元件
        - 混合聚合物配方中的聚合物熔体黏度波动和泵汽蚀
      - - 超临界水注入
        - 将超临界蒸汽（>374°C，>221 bar）与熔融塑料生成并混合
        - 高压蒸汽锅炉和专用耐腐蚀混合室
        - 超临界蒸汽导致的极端热疲劳、侵蚀和应力腐蚀开裂
      - - 水热反应器转化
        - 通过原位供氢进行 C-C 键的超临界裂解（停留时间 25–30 min）
        - Licella Cat-HTR 专利反应器几何结构和压力容器
        - 塞流破坏、停留时间漂移和知识产权负担
      - - 降压与能量回收
        - 对多相反应流出物降压，并将热量整合用于蒸汽生成
        - 高差压控制阀和多级换热器
        - 阀内件严重侵蚀、重质组分造成的结垢以及降压不稳定
      - - 闪蒸分离与蒸馏
        - 将流出物分馏为工艺气、液体馏分和重质残余底物
        - 分馏塔、冷凝器和真空蒸馏容器
        - 产品切割不一致、烯烃再结合以及蜡夹带造成的塔内结垢
      - - KBR 升级外挂模块
        - 对循环液态烃加氢处理，去除卤素和烯烃前体
        - 氢气供应、固定床加氢处理催化剂和 KBR 工程
        - 废料中的残余氯、硫和重金属造成催化剂中毒
    notes: 运营参数和各层依赖关系综合自 Mura Technology 技术披露、Licella 平台文件和 KBR 工程合作申报文件。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE008
      - CE009
      - CE010
