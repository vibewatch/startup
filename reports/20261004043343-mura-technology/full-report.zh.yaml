      - - Hydro-PRT（Mura Technology）
        - 超临界水热液化
        - 混合柔性薄膜、多材料层压物、硬质拒收组分
        - 内部传热均匀；可容忍纸张和有机杂质
        - 资本开支高、工艺加压严苛且能耗高
