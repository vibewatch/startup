      - 石化角色
      - Mura 方案与规格
      - 可衡量价值与目标市场
      - 技术与承购限制
    rows:
      - - 循环液态烃（石脑油）
        - 在蒸汽裂解装置中直接替代化石原料
        - 通过闪蒸产生的轻质液态烃馏分；已完成 REACH 注册
        - 可合成与原生材料等效、适用于食品接触包装的聚合物
        - 需要加氢处理 / 升级，才能达到蒸汽裂解装置对氯和烯烃的标准
      - - 轻质蒸气产品（工艺气）
