  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可触达废物流与石化替代
        blocks:
          - type: paragraph
            body: >-
              先进塑料回收市场正好卡在城市及工业固体废弃物管理与原生石化制造的交界处。传统机械回收受材料化学性质和设备处理能力限制，只能处理相对洁净的单一聚合物废物流（主要是透明 PET 饮料瓶和硬质 HDPE
              容器）。多层柔性膜、金属化复合膜和食品接触类消费后包装大多无法用机械方式回收，通常只能填埋、进入带能源回收的城市垃圾焚烧，或出口。Mura Technology
              将其可触达原料边界明确限定在这些被拒收、受污染的消费后塑料，并用自研 Hydro-PRT
              超临界水热液化工艺将混合聚合物裂解回液态烃。产出端的可触达支出，代表石化树脂制造商采购的化石石脑油和裂解炉原料的替代空间。Mura 生产已完成 REACH
              注册且可接入现有蒸汽裂解装置的即用型液态烃，直接进入原生石化供应链，而不是进入降级后的机械回收料市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角与全球先进回收产能轨迹
        blocks:
          - type: paragraph
            body: >-
              评估水热先进塑料回收的可触达市场，必须把宏观层面的塑料废弃物估值与可验证的运营承购能力分开。公司资料引用的行业倡议和宏观经济分析估计，到 2033 年全球塑料年总价值将超过 $1.05
              trillion，新塑料所需原料年价值约为 $180 billion。此外，塑料包装每年约有 $120 billion
              的材料价值因填埋和焚烧而损失，代表着一座规模巨大的、尚未充分利用的烃资源池。然而，对先进回收开发商和许可方而言，可服务的可触达市场严格受石化承购承诺和已安装水热处理产能约束。Mura 最初与 Dow
              合作，目标是在 2025 年前将全球年回收产能提升至 1,000,000 metric tonnes；随后将公司目标扩大为到 2032 年拥有每年 1,500,000 tonnes
              的在运营或开发中的先进回收产能。与 Dow 的合作安排曾计划到 2030 年在美国和欧洲多个工厂将合计产能提升至每年最多 600 kilotons（KTA），同时推进区域扩张，例如新加坡 Jurong
              Island 计划中的 50 KTA 工厂，以及与 Mitsubishi Chemical 在日本开展技术许可。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
