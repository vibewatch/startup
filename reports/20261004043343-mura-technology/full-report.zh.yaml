  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Hydro-PRT 工艺机制与核心热力学架构
        blocks:
          - type: paragraph
            body: >-
              Mura Technology 的运营架构以 Hydro-PRT（Hydrothermal Plastic Recycling Technology，原名
              HydroPRS）为核心。这是一套先进水热液化（HTL）系统，源自 Licella 的专利催化水热反应器（Cat-HTR）平台。传统热解或气化路径存在导热性低、严重结焦和原料分拣要求严格等问题；Hydro-PRT
              则以超临界水作为均匀传热介质和反应性化学试剂。在超过 374 degrees Celsius、压力超过 221 bar 的超临界条件下，水兼具液体密度和气体扩散性，像分子剪刀一样在 30
              分钟内快速切断长链聚合物键。此外，超临界水主动提供氢来稳定裂解自由基，抑制二次成炭缩合反应，使无灰干燥塑料向稳定短链循环烃的质量转化效率超过 85 percent。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
