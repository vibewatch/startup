              Mura Technology 的商业模式服务全球化学回收价值链上的两类客户：采购水热循环烃的石化承购方，以及部署 Hydro-PRT
              工厂的企业流程被许可方。石化树脂生产商是各类产出的核心大客户，需要高规格液态烃（循环石脑油）接入蒸汽裂解炉、轻质蒸气用于气体裂解，以及重质残余馏分用于沥青或柏油调配。商业部署由与 Dow
              等跨国化学品制造商签订的长期战略合同支撑；Dow 既是股权投资方，也是 Mura 旗舰 Wilton 工厂回收烃的主要承购方，用于供应循环聚合物包装。与此同时，Mura
              通过流程许可和工程方案变现核心知识产权，相关方案由工程巨头 KBR 在全球独家营销。这些许可交易对手包括亚洲工业集团：日本的 Mitsubishi Chemical Corporation，以及韩国的 LG
              Chem 和 GS Caltex；它们购买设计方案，在当地建设回收产能。废弃物管理供应商通过长期供应安排交付消费后塑料料包，补足交易对手生态，但原料采购仍容易受污染上限和区域分拣经济性影响。
