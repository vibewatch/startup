      - number: '5.4'
        title: 图表
        blocks:
          - type: callout
            title: Dow 取消 Böhlen 工厂暴露共址脆弱性
            body: >-
              旨在向区域石化蒸汽裂解炉直接供应循环石脑油的先进化学回收工厂，面临系统性的资产共址风险。2025 年 8 月，Dow 决定在 Q4 2027 前永久关闭相邻蒸汽裂解炉，随后取消旗舰 120 kta Böhlen
              项目。这说明，先进回收的资本支出仍受老旧既有石化资产的经济可行性和重组周期制约。
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
          - type: callout
            title: 超临界水相对热解的热力学优势
            body: >-
              Hydro-PRT 用超临界水替代外部传导加热，克服了传统热解的根本热力学瓶颈。超临界蒸汽能够即时、均匀地进行体积传热，消除管道结焦，并提供氢来封端活性自由基。这使稳定烃产品的质量转化率超过 85
              percent，同时能够处理混合且受有机物污染的包装废弃物。
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
