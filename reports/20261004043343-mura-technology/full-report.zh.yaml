  - id: FE001
    title: Hydro-PRT 架构：多阶段水热液化堆栈
    type: stack
    summary: Mura 的 Hydro-PRT 回收系统架构覆盖原料预处理、核心超临界水热液化、初级分离和炼厂升级。
    data:
      layers:
        - label: 原料准备与采购层
          detail: 对混合消费后硬质 / 柔性塑料进行机械粉碎、密度分离和污染物去除
        - label: 热加压与熔融进料层
          detail: 反应器注入前的高压聚合物挤出和热预处理
        - label: 超临界水热液化层
          detail: 超临界水反应（>374°C，>221 bar）在 25–30 min 停留时间内充当分子剪刀和氢供体
        - label: 降压与能量回收层
          detail: 高差压降压、闪蒸分离和热整合，将尾气回收用于工厂锅炉
        - label: 分馏与产品储存层
          detail: 蒸馏为已完成 REACH 注册的循环液态烃（石脑油）、轻质蒸气和循环重质残余物
        - label: KBR 石化升级层
          detail: 可选的催化加氢处理外挂模块，确保与商业蒸汽裂解装置即插即用的兼容性
    approximationNotes: 该图代表 Mura Technology 技术文件和 KBR 工程资料定义的标准工艺边界与流程架构。
