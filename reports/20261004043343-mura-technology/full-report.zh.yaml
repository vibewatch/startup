      - number: '7.3'
        title: 运营、质量与规模化
        blocks:
          - type: paragraph
            body: >-
              Hydro-PRT 在转化前需要撕碎原料并去除玻璃、砂砾、金属和石块，因此原料质量和预处理构成控制点。Mura 还称与 KBR 的产品升级整合仍在开发中；合作伙伴资料则描述了从 20 ktpa 首条生产线向 50
              ktpa 和 120 ktpa
              工厂扩张的计划。证据支持技术流程描述和缓释关系，但不能证明这些规模下有稳定商业产量或运营表现。运营淘汰标准应当可量化：如果无法在具有代表性的稳态期间证明相对于名义产能的持续产量、符合合同规格的产出、可接受的产出率、开工率和能耗强度，规模化逻辑就会被打破。安全、召回和事故控制仍未验证，而不能假定其不存在。
            claimRefs:
