  - id: FU001
    title: 客户商业化与承购旅程图
    type: journey-map
    summary: 商业部署阶段覆盖原料获取、水热转化、客户承购和下游聚合物合成。
    data:
      items:
        - label: 原料采购与分选
          stage: 原料采购与分选
          actor: 废弃物管理分选商与市政机构
          objective: Secure segregated unrecyclable post-consumer mixed plastic bales
          touchpoints:
