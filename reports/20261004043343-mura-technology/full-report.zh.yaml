      - number: '7.2'
        title: 监管、环境与声明风险
        blocks:
          - type: paragraph
            body: >-
              Mura 宣传册称其产出产品已完成 REACH 注册，新加坡公告则预计与 National Environment Agency
              合作，并采用本地和进口回收塑料原料。这些说法指出了缓释措施和监管接触点，但指定材料不包括监管机构签发的许可、注册、进口批准、执法记录、诉讼检索或特定场地环境审批。因此，最稳妥的剩余风险结论不是发生过或没有发生违规、事故，而是缺少独立验证。可持续性声明风险也仍在：Mura
              可持续发展负责人表示，在据此采用碳强度数据前，必须将设计特征和预期负荷与实际运营进行核对。
