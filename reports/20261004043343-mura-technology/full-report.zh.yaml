          objective: Supercritical water depolymerization yielding hydrocarbon fractions
          touchpoints:
            - 粉碎和机械预处理
            - 无焦炭的超临界水裂解
            - 分馏为石脑油、气体和重油
          sentiment: positive
        - label: 石化客户承购
