  - CP005
- id: TP002
  title: Capability and Lifecycle Performance Comparison
  columns:
  - Performance Dimension
  - Mechanical Regranulation
  - Conventional Pyrolysis
  - Hydrothermal Liquefaction (Hydro-PRT)
  rows:
  - - Feedstock Flexibility
    - Low (requires clean, sorted mono-material streams)
    - Medium (sensitive to moisture, halides, and inorganic debris)
    - High (processes mixed, post-consumer multilayers and flexible films)
  - - Product Recyclability Tier
    - Downcycled grades; restricted food-contact clearance
    - Virgin-equivalent naphtha/wax for cracker blending
    - Virgin-grade chemical feedstocks suitable for food-contact packaging
  - - Residence Time in Conversion
    - Continuous mechanical extrusion (minutes)
    - 1 to 3 hours depending on thermal reactor geometry
    - Rapid hydrothermal breakdown in 25 to 30 minutes
  - - Climate Change Lifecycle Impact
    - Net GHG savings (-209 kg CO2-eq/t sorted MPO packaging)
    - Net GHG burden due to high thermal/electrical processing energy
    - Net GHG burden due to high processing energy and pressurization
  notes: Lifecycle performance comparisons derived from the European Commission Joint Research Centre (EU-JRC) 2023 technical
    report on plastic waste recycling.
