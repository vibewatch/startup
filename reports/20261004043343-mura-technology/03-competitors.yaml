  - Mura Technology / KBR Alliance
  rows:
  - - Revenue Model
    - Secondary flake and regranulate merchant sales
    - Merchant pyrolysis oil sales and gate fees
    - Technology licensing fees, royalties, and equity facility offtake
  - - Strategic Downstream Partner
    - Direct converters and plastic compounders
    - Regional petrochemical crackers and refiners
    - Dow (exclusive global offtake) and KBR (exclusive global licensing)
  - - Deployment Footprint
    - Decentralized regional compounding facilities
    - Stand-alone thermal merchant plants
    - Co-located or integrated world-scale units (120 kt/year planned modules)
  - - Capital Sensitivity & Structural Risk
    - Low capex; volatile virgin polymer price competition
    - Medium-high capex; reactor downtime and upgrading costs
    - High capital intensity; vulnerability to host petrochemical site outages
  notes: Commercial models reflect corporate announcements and licensing agreements executed with KBR, Dow, and Mitsubishi
    Chemical Corporation.
