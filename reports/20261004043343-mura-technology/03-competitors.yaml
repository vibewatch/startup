  title: Petrochemical Infrastructure Dependency and Project Vulnerability
  body: The cancellation of the planned 120 kt/year Böhlen facility following Dow's steam cracker closure highlights Mura's
    dependency on host refinery infrastructure for circular naphtha offtake, exposing advanced recycling projects to broader
    structural headwinds in the European chemical sector.
