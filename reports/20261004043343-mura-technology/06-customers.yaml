company:
  name: Mura Technology
chapter:
  number: 6
  title: Customers
  summary: Mura Technology operates a dual customer and commercialization architecture combining equity-aligned petrochemical
    offtakers like Dow with international engineering license licensees including Mitsubishi Chemical, LG Chem, and GS Caltex
    via global partner KBR. However, commercial customer adoption faces severe concentration risk and execution headwinds,
    highlighted by Dow's August 2025 cancellation of the planned 120 ktpa Böhlen facility and ongoing commissioning bottlenecks
    at the initial Wilton plant.
sections:
- id: customer-segmentation-and-commercial-model
  title: Customer Base Segmentation and Value Chain Architecture
  body: 'Mura Technology''s commercial model serves two distinct customer segments across the global chemical recycling value
    chain: petrochemical off-takers of hydrothermal circular hydrocarbons and corporate process licensees deploying Hydro-PRT
    facilities. Petrochemical resin producers represent the core volume customers for output fractions, requiring high-specification
    liquid hydrocarbons (circular naphtha) for steam cracker integration, light vapour products for gas cracking, and heavy
    residual fractions for asphalt or bitumen blending. Commercial deployment is anchored by long-term strategic contracts
    with multinational chemical manufacturers such as Dow, which acts as both an equity investor and primary offtaker for
    recycled hydrocarbons produced at Mura''s flagship Wilton site to supply circular polymer packaging. Concurrently, Mura
    monetizes its core intellectual property through process licensing and engineering packages marketed exclusively worldwide
    by engineering major KBR. These licensing counterparties—spanning Asian industrial conglomerates including Mitsubishi
    Chemical Corporation in Japan, alongside LG Chem and GS Caltex in South Korea—acquire design packages to construct regional
    recycling capacity. Waste management suppliers complete the counterparty ecosystem under long-term supply arrangements
    to deliver post-consumer plastic bales, though feedstock procurement remains vulnerable to contamination limits and regional
    sorting economics.'
