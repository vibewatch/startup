- id: adoption-trajectory-and-capacity-scale
  title: Commercial Adoption Trajectory and Scaling Timeline
  body: 'Mura''s commercial adoption trajectory has transitioned from early technology licensing into physical facility commissioning,
    targeting cumulative global capacity of 1,500 ktpa by 2032 across operated sites and licensed builds. The operational
    cornerstone is Mura Wilton (ReNew ELP) in Teesside, UK, designed for an initial capacity of 20 ktpa of circular hydrocarbons
    with planned footprint expansion to 80 ktpa across four production lines. Facility operations and maintenance are contracted
    under a 10-year agreement awarded to px Group, supported by an initial £4.42 million grant from Innovate UK. Beyond the
    UK flagship, Mura secured direct regional expansion in Southeast Asia by leasing a site on Jurong Island within the Singapore
    Essential Chemicals Complex from PCS Pte. Ltd. to construct a 50 ktpa facility with regional feedstock sourcing. In parallel,
    global licensing partner KBR executed agreements for commercial installations with Mitsubishi Chemical Corporation for
    a 25 ktpa unit at Ibaraki, LG Chem for a 25 ktpa plant, and GS Caltex for a 50 ktpa unit in South Korea. Despite these
    contracted milestones, commercial ramp-up schedules have slipped relative to original targets: the Wilton plant, initially
    scheduled for 2022 and subsequently targeted for 2023, faced extended commissioning into 2025, delaying substantial merchant
    product delivery to Dow and downstream packaging converters.'
  claimRefs:
  - CU002
