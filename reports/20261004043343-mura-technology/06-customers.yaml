callouts:
- calloutType: risk
  title: Severe Offtaker and Co-Location Vulnerability Exposed by Böhlen Termination
  body: Mura's commercial viability is heavily coupled to petrochemical co-location with anchor customer Dow. Dow's August
    2025 cancellation of the planned 120 ktpa Böhlen facility—precipitated by the permanent closure of Dow's on-site steam
    cracker—underscores that advanced recycling plants cannot easily operate as standalone merchant assets without integrated
    cracker infrastructure to absorb raw hydrocarbon fractions.
  claimRefs:
  - CU001
  - CU010
- calloutType: insight
  title: Capital-Light Licensing via KBR Offsets Capital-Intensive Operating Headwinds
  body: While Mura's balance sheet bears significant commissioning and capex risk for company-owned facilities like Wilton
    and Singapore, its exclusive global licensing partnership with KBR provides an asset-light monetization channel. Contracting
    directly with Asian chemical giants including Mitsubishi Chemical, LG Chem, and GS Caltex allows Mura to establish international
    market presence and generate license revenue while KBR and local partners fund facility construction.
  claimRefs:
  - CU007
  - CU008
