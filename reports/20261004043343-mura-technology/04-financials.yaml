callouts:
- calloutType: risk
  title: Announced capacity is not revenue
  body: Partner releases described a 120 kta Böhlen project targeted for 2025, but S&P Global reported its cancellation in
    August 2025 after Dow moved to close the associated steam cracker. Pipeline capacity should receive no revenue credit
    without final investment approval, committed financing, construction progress, and enforceable offtake.
  claimRefs:
  - CI010
  - CI011
  - CI012
- calloutType: recommendation
  title: Underwrite only after a financial data-room review
  body: Require audited group and subsidiary accounts, plant-level monthly operating data, customer and feedstock contracts,
    project sources-and-uses, debt and covenant schedules, and a 24-month cash forecast before assigning revenue, margin,
    runway, or valuation assumptions.
  claimRefs:
  - CI015
  - CI016
