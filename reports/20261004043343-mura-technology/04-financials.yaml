company:
  name: Mura Technology
chapter:
  number: 4
  title: Financials
  summary: 'Mura presents two commercial routes: sales of circular hydrocarbon products from owned facilities and technology
    licensing through KBR. Public evidence supports claimed 2026 operations at the 20 kta Wilton plant and an initial license
    contract, but it does not disclose group revenue, realized pricing, gross margin, cash, debt, burn, runway, or project
    capex; the cancellation of the proposed 120,000 mt/year Böhlen plant is a material scale-up warning.'
sections:
- id: revenue-architecture
  title: Revenue architecture is visible, but revenue is not
  body: 'Mura''s public materials describe two routes to monetization rather than reported revenue. The owner-operator route
    converts recovered plastic feedstock at the wholly owned Wilton facility into circular liquid hydrocarbons, heavy residual
    oil, and light vapour products; Mura says these products will be sold on long-term contracts, while Dow''s 2021 release
    described an agreement to receive recycled feedstocks from Teesside. The asset-light route places KBR between Mura''s
    technology and third-party plant operators: KBR and Mura announced an initial Hydro-PRT contract with Mitsubishi Chemical,
    and Mura says KBR supplies licenses, engineering, technical services, and modules. None of the allocated sources states
    product pricing, license economics, recognized revenue, or revenue mix, so these are commercial mechanisms rather than
    underwritten income streams.'
  claimRefs:
  - CI002
  - CI003
  - CI004
  - CI005
  - CI015
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: pricing-and-unit-economics
  title: Pricing and unit economics remain private
  body: Public disclosures provide operating descriptors but not an investable unit economic bridge. Mura says process gas
    is recovered to generate supercritical steam, which should reduce reliance on purchased natural gas, and its partner page
    describes long-term arrangements on both product and feedstock sides. Those facts do not quantify feedstock cost or tipping
    income, conversion yield, energy use, labor and maintenance cost, product mix, realized price per tonne, or gross margin.
    The 10-year Wilton operations and maintenance contract with px Group establishes a long-dated service obligation, not
    its annual expense. Without contract schedules and plant-level operating data, neither contribution margin nor payback
    can be estimated responsibly; unsupported values are therefore shown as gaps rather than point estimates.
  claimRefs:
  - CI002
  - CI006
  - CI008
  - CI015
  tableRefs:
  - TI002
  - TI003
- id: capital-adequacy
  title: Owned-project expansion makes capital adequacy a primary diligence item
  body: The allocated evidence confirms some non-dilutive and strategic support but not liquidity. Mura says Wilton received
    a GBP4.42 million Innovate UK grant and that Wilton is a wholly owned subsidiary; independent trade coverage describes
    the planned 50 kta Singapore facility as Mura's first direct investment in Southeast Asia. These points indicate direct
    exposure to development and operating capital, but the sources do not disclose total Wilton capex, Singapore development
    cost, cash on hand, debt, cash burn, runway, project-finance commitments, or the next financing trigger. Funding raised
    elsewhere must not be treated as cash available. Underwriting therefore requires current group and subsidiary accounts,
    committed financing schedules, covenant terms, and project-level sources-and-uses before a runway conclusion is possible.
  claimRefs:
  - CI007
  - CI009
  - CI013
  - CI015
  - CI016
- id: financial-verdict
  title: 'Financial verdict: plausible routes, unverified economics, concentrated execution risk'
  body: 'The evidence supports a plausible hybrid model, but not revenue quality or a margin path. Wilton''s claimed 20 kta
    operating status is the most concrete current traction signal, yet actual throughput, utilization, shipments, and receipts
    are absent. The downside case is not theoretical: 2022 partner releases described a 120 kta Böhlen facility targeted for
    2025, while S&P Global later reported that Dow cancelled it as the associated steam cracker faced permanent closure. This
    shows that a planned site can disappear with an offtaker''s asset strategy and that announced capacity is not contracted
    revenue. The chapter''s financial verdict is therefore research-more: revenue mechanisms are identifiable, but audited
    financials, contract economics, plant performance, capex, and financing evidence are blockers to valuation or solvency
    underwriting.'
  claimRefs:
  - CI001
  - CI010
  - CI011
  - CI012
  - CI015
  - CI016
