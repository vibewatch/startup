- id: TV001
  title: Recommendation and Investment Stance Summary
  columns:
  - Dimension
  - Assessment / Stance
  - Supporting Evidence
  - Decision Implication
  rows:
  - - Recommendation
    - research-more
    - Commercial validation via KBR, Dow, MCC, and Wilton commissioning, but major project cancellation at Böhlen and undisclosed
      group accounts.
    - Do not commit capital until operating cash flows and audited balance sheets are inspected.
  - - Confidence
    - medium
    - Multiple primary corporate filings and news releases confirm commercial partnerships, but private corporate financial
      metrics remain absent.
    - Underwrite solely on verified project milestones rather than company-targeted scaling targets.
  - - Risk Rating
    - high
    - Heavy industrial capex, technical scale-up hurdles, counterparty refinery closures, and outstanding IP security charges.
    - Require high downside protection, structural seniority, or liquidation preference rights.
  - - Valuation Stance
    - unknown
    - No verified post-money equity valuation mark, revenue run-rate, or gross margin disclosures in public domain.
    - Reject unverified secondary or self-published valuation estimates in favor of fundamental unit diligence.
  notes: Assessment reflects status as of October 2026; stance is constrained by private company reporting boundaries and
    missing audited accounts.
