- id: TV002
  title: Investment Thesis and Counter-Thesis Matrix
  columns:
  - Pillar
  - Thesis Argument
  - Anti-Thesis Risk
  - What Would Change View
  rows:
  - - Technology & Product
    - Hydro-PRT uses supercritical water to recycle contaminated, multi-layer plastics into high-value circular hydrocarbons
      in 30 minutes.
    - Long-term catalyst stability, water separation energetics, and continuous commercial yield have yet to be verified across
      multi-year runs.
    - Independent technical audit verifying sustained mass yield and product purity across continuous operating campaigns.
  - - Commercial Distribution
    - KBR acts as exclusive global licensing and engineering partner, providing international sales reach and EPC credibility.
    - Licensing model decouples Mura from project execution control; KBR holds an equity stake and IP security charge creating
      overhang.
    - Clarity on royalty split economics and full release or subordination of KBR's IP security charge.
  - - Offtake & Partnerships
    - Strategic multi-plant partnerships with global chemical leaders Dow and CPChem provide committed offtake demand for
      circular naphtha.
    - Dow's August 2025 cancellation of the 120 kta Böhlen plant reveals structural vulnerability to downstream petrochemical
      cracker closures.
    - Execution of binding, non-cancelable offtake agreements with alternative European and North American cracker operators.
  - - Global Project Scaling
    - Diverse international footprint spanning Wilton (UK), Ibaraki (Japan), South Korea (LG Chem), and Jurong Island (Singapore).
    - Capital-intensive overseas plant development introduces cross-border permitting, construction cost inflation, and feedstock
      risk.
    - Successful commercial commissioning and positive EBITDA generation from the initial Wilton line and Asian licensed plants.
  notes: Pillars synthesize technical, commercial, partner, and operational risks identified across primary filings and industry
    reporting.
