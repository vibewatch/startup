callouts:
- calloutType: recommendation
  title: 'Recommendation Stance: research-more Pending Financial Disclosure'
  body: Despite world-class commercial engineering alliances with KBR and Dow, Mura Technology cannot be recommended for capital
    commitment at present. The cancellation of the 120 kta Böhlen facility in August 2025 demonstrates that commercial off-take
    partnerships are vulnerable to European industrial restructuring. Prospective investors should maintain a research-more
    stance until full FY2024–FY2025 audited accounts and KBR IP charge terms are reviewed.
  claimRefs:
  - CV004
  - CV005
  - CV014
  - CV015
