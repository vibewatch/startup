- id: TV003
  title: Scenario Valuation and Operational Return Matrix
  columns:
  - Scenario
  - Core Assumptions
  - Operational & Valuation Logic
  - Key Downside Triggers
  - Probability Signal
  rows:
  - - Bull Case
    - Wilton reaches full 80 kta capacity; MCC (25 kta) and LG Chem (25 kta) plants commence operations; Singapore 50 kta
      site reaches FID.
    - Mura realizes blended royalty revenues and robust Wilton off-take margins; corporate valuation exceeds $1B in strategic
      liquidity event.
    - Unforeseen catalytic poisoning or regulatory pushback on chemical recycling mass-balance accounting in EU.
    - Low to Moderate (20%)
  - - Base Case
    - Wilton operates stably at initial 20 kta; licensed Asian units proceed with minor delays; direct plant expansion in
      Europe remains frozen.
    - Mura operates as a profitable niche licensor and regional operator, generating steady cash flow but modest enterprise
      valuation multiple.
    - Prolonged low virgin naphtha prices eroding circular green premiums; slower licensee construction timelines.
    - Moderate (55%)
  - - Bear Case
    - Wilton suffers mechanical downtime or negative operating margins; further offtake partners cancel co-located units post-Böhlen.
    - Liquidity exhaustion requires dilutive rescue financing or debt restructuring; KBR enforces IP security charge to recover
      capital.
    - Complete shutdown of European petrochemical partner crackers or insolvency of operating project special-purpose vehicles.
    - Moderate (25%)
  notes: Scenarios reflect qualitative risk-adjusted milestones; exact enterprise valuation figures are omitted due to private
    financial data gaps.
