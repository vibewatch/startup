  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Counter-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Mura Technology rests on the technical defensibility and global scalability
              of its proprietary Hydro-PRT hydrothermal plastic recycling platform, supported by top-tier strategic
              partners. Hydro-PRT utilizes supercritical water as a reaction medium to convert mixed, contaminated
              post-consumer plastic waste—including multi-layer films deemed unrecyclable by mechanical recyclers—into
              circular liquid hydrocarbons (naphtha substitute), heavy residual oil, and process gases in approximately
              thirty minutes. The platform's commercial distribution is de-risked by KBR Inc. acting as exclusive global
              licensing and engineering partner, and global off-take validation is established through long-term
              arrangements with chemical majors such as Dow. Conversely, the investment anti-thesis is driven by severe
              project execution dependencies, counterparty asset restructurings, and group-level financial opacity. The
              vulnerability of Mura's co-location model was highlighted in August 2025 when Dow canceled the planned
              120,000 mt/year chemical recycling facility at Böhlen, Germany, following Dow's decision to permanently
              shut down its Böhlen steam cracker by Q4 2027. Furthermore, with KBR holding an equity stake and an
              extensive security charge over Mura's intellectual property, public investors face structural
              subordination and an unverified corporate cash burn profile.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV014
              - CV015
      - number: '8.2'
        title: Capitalization History, Strategic Financing, and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Mura Technology's capital formation has been predominantly driven by corporate strategics and non-dilutive
              government support rather than traditional venture capital rounds with disclosed valuations. In October
              2020, Mura Wilton secured a £4.42 million non-dilutive grant from Innovate UK's Smart Sustainable Plastic
              Packaging programme to support construction of its first commercial-scale Hydro-PRT facility in Teesside.
              In June 2022, KBR entered into an agreement to invest an additional USD 100 million in Mura Technology,
              expanding its strategic alliance and placing a KBR representative on Mura's board of directors. Strategic
              equity participation also includes material investments from Dow, CPChem (via its subsidiary Six Pines
              Investments LLC in December 2021), and motion plastics specialist igus GmbH in 2020. However, Mura
              Technology has not publicly filed an unadjusted pre-money or post-money equity valuation, nor are its
              capitalization table, option pools, liquidation preferences, or dividend terms publicly disclosed. Because
              key operational throughput, revenue realizations, and cash margins remain undisclosed by private
              management, any precise enterprise value estimate represents speculative modeling rather than verified
              investment reality.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV010
              - CV014
      - number: '8.3'
        title: Scenario Analysis, Exit Pathways, and Critical Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Mura's return profile requires scenario-based underwriting tied to operational milestones,
              licensing velocity, and counterparty asset stability. In a bull case, Mura Wilton ramps smoothly beyond
              its initial 20 kta nameplate line toward 80 kta, KBR successfully commissions licensed commercial lines
              with Mitsubishi Chemical Corporation (25 kta in Japan) and LG Chem (25 kta in South Korea), and Mura
              directly executes its planned 50 kta Jurong Island facility in Singapore, generating blended high-margin
              royalty streams and direct off-take cash flow. In a base case, Mura maintains operational viability at
              Wilton and collects steady recurring royalties from Asian chemical licensees, but direct international
              capex scaling stalls following European industrial cracker rationalizations, leaving Mura as a specialized
              technology licensor. In a bear case, persistent operational bottlenecks at Teesside, delayed licensing
              rollouts, or further off-take cancellations by downstream chemical producers trigger severe liquidity
              strain, exposing Mura to KBR's IP security charge and potential restructuring. Underwriting an
              institutional equity investment requires access to Mura's full FY2024–FY2025 audited financial statements,
              actual EPC capex accounts, and the legal covenants of KBR's IP security charge.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Stance: research-more Pending Financial Disclosure'
            body: >-
              Despite world-class commercial engineering alliances with KBR and Dow, Mura Technology cannot be
              recommended for capital commitment at present. The cancellation of the 120 kta Böhlen facility in August
              2025 demonstrates that commercial off-take partnerships are vulnerable to European industrial
              restructuring. Prospective investors should maintain a research-more stance until full FY2024–FY2025
              audited accounts and KBR IP charge terms are reviewed.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV015
