      - number: '7.2'
        title: Regulatory, environmental, and claims exposure
        blocks:
          - type: paragraph
            body: >-
              Mura's brochure states that its output products are REACH registered, while its Singapore announcement
              anticipates collaboration with the National Environment Agency and a mix of domestic and imported
              recovered-plastic feedstock. Those statements identify mitigations and regulatory touchpoints, but the
              allocated materials do not include regulator-issued permits, registrations, import approvals, enforcement
              records, litigation searches, or site-specific environmental approvals. The most defensible residual-risk
              conclusion is therefore not that a breach or incident occurred, nor that none occurred, but that
              independent verification is missing. Sustainability-claims exposure also remains: Mura's sustainability
              lead said design characteristics and expected loads must be checked against actual operation before carbon
              intensity is relied upon.
            claimRefs:
              - CR002
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR010
              - CR011
              - CR015
      - number: '7.3'
        title: Operations, quality, and scale-up
        blocks:
          - type: paragraph
            body: >-
              Hydro-PRT requires shredding and removal of glass, grit, metals, and stones before conversion, creating a
              feedstock-quality and preprocessing control point. Mura also says product upgrading integration with KBR
              is still being developed, while its partner materials describe planned scale from a 20 ktpa first line
              toward 50 ktpa and 120 ktpa facilities. The evidence supports technical process descriptions and
              mitigation relationships, but not stable commercial throughput or performance at those scales. The
              operational kill criterion should be measurable: inability to show sustained nameplate-relative
              throughput, contracted-quality output, acceptable yield, uptime, and energy intensity over a
              representative steady-state period would break the scale-up thesis. Security, recall, and incident
              controls remain unverified rather than presumed absent.
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR009
              - CR014
