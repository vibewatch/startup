      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              Treat another unexplained commissioning reset, or failure to evidence representative steady-state
              throughput, yield, uptime, product quality, and energy intensity, as a break in the commercial scale-up
              thesis.
            calloutType: risk
            claimRefs:
              - CR002
