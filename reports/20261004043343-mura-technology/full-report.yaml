            title: Contract diligence before underwriting scale
            body: >-
              Require the Dow, KBR, px Group, feedstock, and project-finance agreements with minimum commitments,
              performance remedies, termination rights, IP continuity, step-in provisions, and contingency funding
              before assigning value to planned capacity.
            calloutType: recommendation
