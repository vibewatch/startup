        title: Business Models, Capital Intensity, and Durability
        blocks:
          - type: paragraph
            body: >-
              Mura operates a dual business model combining direct owner-operator equity investments in flagship
              facilities (such as its commercial-scale plant at Teesside, UK) with global technology licensing executed
              exclusively through engineering partner KBR Inc. Petrochemical partners like Dow provide long-term
              feedstock off-take agreements, creating structural integration that locks in downstream demand for
              circular naphtha and distillate oils intended for virgin-equivalent food-contact polymer manufacturing.
              However, high plant capital intensity and vulnerability to local site economics present execution
              friction. This vulnerability was highlighted by Dow canceling plans for a planned 120,000 mt/year chemical
              recycling facility at Böhlen, Germany, following the closure of Dow's onsite steam cracker, demonstrating
              the sector's sensitivity to host refinery and petrochemical asset closures.
