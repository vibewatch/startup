      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Severe Offtaker and Co-Location Vulnerability Exposed by Böhlen Termination
            body: >-
              Mura's commercial viability is heavily coupled to petrochemical co-location with anchor customer Dow.
              Dow's August 2025 cancellation of the planned 120 ktpa Böhlen facility—precipitated by the permanent
              closure of Dow's on-site steam cracker—underscores that advanced recycling plants cannot easily operate as
              standalone merchant assets without integrated cracker infrastructure to absorb raw hydrocarbon fractions.
            calloutType: risk
            claimRefs:
              - CU001
              - CU010
          - type: callout
            title: Capital-Light Licensing via KBR Offsets Capital-Intensive Operating Headwinds
            body: >-
              While Mura's balance sheet bears significant commissioning and capex risk for company-owned facilities
              like Wilton and Singapore, its exclusive global licensing partnership with KBR provides an asset-light
              monetization channel. Contracting directly with Asian chemical giants including Mitsubishi Chemical, LG
              Chem, and GS Caltex allows Mura to establish international market presence and generate license revenue
              while KBR and local partners fund facility construction.
            calloutType: insight
            claimRefs:
              - CU007
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk view
        blocks:
          - type: paragraph
            body: >-
              Execution and commissioning rank first because the evidence records multiple prospective operating dates
              for the same first commercial Wilton line: 2022 in Dow's 2021 announcement, 2023 in Dow's later expansion
              announcement, and 2025 in Mura's 2025 brochure. That sequence does not establish the plant's status on the
              run date, but it is direct evidence that schedule assumptions changed. The risk is amplified by the
              retained source set's lack of current throughput, uptime, yield, product-quality, capex, liquidity, and
              contingency-funding data. Partner concentration ranks next because Dow, KBR, px Group, and feedstock
              providers occupy essential offtake, licensing, engineering, operating, and supply roles. The heatmap is a
              qualitative diligence prioritization, not a probability model.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
