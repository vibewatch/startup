      - number: '2.3'
        title: Customer Segmentation, Commercial Adoption Pathways, and Value Chain Economics
        blocks:
          - type: paragraph
            body: >-
              Adoption of hydrothermal advanced recycling occurs across three distinct commercial segments:
              petrochemical resin producers, global consumer packaging brands, and waste management aggregators.
              Petrochemical resin manufacturers, including Dow and Mitsubishi Chemical Corporation, represent the
              primary paying customers and off-takers. These entities face statutory mandates and corporate ESG
              commitments to incorporate certified recycled content into virgin-grade polymers without compromising
              food-contact regulatory approvals. Off-take agreements are structured as multi-year feedstock supply
              contracts, insulating chemical producers from primary crude volatility while securing high-purity recycled
              hydrocarbons. Global fast-moving consumer goods (FMCG) brand owners act as indirect demand pull drivers,
              requiring circular polymers for flexible food packaging without undergoing costly container redesigns. On
              the upstream supply side, waste management aggregators and mechanical recycling sorting facilities act as
              suppliers or tolling partners, seeking cost-competitive diversion outlets that avoid escalating landfill
              tipping fees and incinerator carbon taxes. Mura's dual go-to-market architecture monetizes this ecosystem
              through both direct equity facility development (such as the flagship Mura Wilton facility) and technology
              licensing fees and engineering services royalties delivered via its exclusive global licensing partnership
              with KBR.
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Structural Growth Drivers, Regulatory Mandates, and Commercial Execution Headwinds
        blocks:
          - type: paragraph
            body: >-
              The commercial adoption of advanced hydrothermal recycling is propelled by strict regulatory frameworks
              and corporate sustainability targets, yet severely constrained by capital intensity and industrial project
              execution risks. Growth is driven by European Union packaging waste directives, mandatory recycled content
              thresholds, extended producer responsibility (EPR) legislation, and brand-owner commitments to achieve
              net-zero circular packaging. Supercritical water technology provides a compelling environmental advantage
              over pyrolysis, offering higher thermal efficiency, tolerance for mixed multi-layer substrates, and the
              elimination of external catalyst poisoning. Nonetheless, the sector faces substantial headwinds.
              Commercial projects demand immense capital expenditure, specialized high-pressure metallurgy, and complex
              site integration within petrochemical complexes. Commercial vulnerability was starkly demonstrated in
              August 2025 when Dow officially canceled its flagship joint project with Mura to construct a 120,000
              metric tonne per year chemical recycling facility at Böhlen, Germany. This cancellation underscores the
              persistent execution barriers, project finance complexities, and macroeconomic headwinds that threaten
              large-scale commercial deployments despite robust top-line off-take interest.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Downside Risk: Commercial Execution and Partner Plant Cancellations'
            body: >-
              The cancellation of the 120,000 mt/year Böhlen chemical recycling facility by Dow in August 2025
              represents a material commercial setback for Mura Technology. While Dow reaffirmed its intent to explore
              alternative European collaboration opportunities, the termination of Europe's planned largest advanced
              recycling plant highlights significant macroeconomic, permitting, and capital expenditure barriers
              confronting rapid commercial scaling.
            calloutType: risk
            claimRefs:
              - CM010
              - CM016
          - type: callout
            title: 'Strategic Fit: Drop-In Petrochemical Compatibility Eliminates Packaging Redesign'
            body: >-
              Hydrothermal liquefaction via Hydro-PRT provides drop-in liquid hydrocarbons that enter existing
              petrochemical steam crackers, enabling resin producers to synthesize virgin-grade polymers with identical
              mechanical and food-contact properties. This directly solves a primary bottleneck for brand owners who
              cannot utilize degraded mechanical recyclate for sensitive packaging applications.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Recycling Alternatives
        blocks:
          - type: paragraph
            body: >-
              The landscape for addressing plastic waste spans incumbent mechanical recycling, energy recovery
              (incineration), solvent-based physical recycling (dissolution), and chemical recycling technologies such
              as pyrolysis, gasification, and hydrothermal liquefaction. Incumbent mechanical recycling remains the
              predominant global standard for rigid polyethylene (PE) and polypropylene (PP) streams due to low capital
              costs and proven operational track records. However, mechanical recycling faces severe degradation across
              repetitive extrusion cycles and is technically unable to process post-consumer flexible films,
              contaminated post-consumer polyolefins, or multi-layer barrier packaging. Mura Technology explicitly
              designs its Hydro-PRT supercritical water process to treat post-consumer packaging films, pots, tubs, and
              reject streams from mechanical sorting facilities, treating them as complementary inputs rather than
              competing for clean rigid mono-material bales.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
      - number: '3.2'
        title: Technological Capabilities and Lifecycle Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Compared to conventional pyrolysis approaches, Mura's Hydro-PRT process utilizes supercritical water as a
              thermal transfer medium and chemical agent, acting as molecular scissors that cleave long-chain polymer
              bonds in 25 to 30 minutes into circular hydrocarbon liquids and gas without requiring external catalyst
              additions. According to an independent lifecycle assessment conducted by the European Commission Joint
              Research Centre (EU-JRC) evaluating mixed polyolefin flexible packaging waste, hydrothermal chemical
              recycling achieves net savings in Acidification and Fossil Resource Use comparable or superior to
              conventional pyrolysis. Nevertheless, the EU-JRC assessment also demonstrated that all chemical recycling
              pathways, including hydrothermal systems, incur a net greenhouse gas burden in Climate Change due to the
              high electricity and thermal energy required for waste processing and solvent/water pressurization
              relative to primary mechanical regranulation.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
