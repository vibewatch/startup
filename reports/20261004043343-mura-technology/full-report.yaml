              - CU009
      - number: '6.3'
        title: Customer Concentration Risk and Contractual Volatility
        blocks:
          - type: paragraph
            body: >-
              Customer adoption for Hydro-PRT exhibits acute customer and partner concentration, leaving Mura highly
              sensitive to the capital expenditure cycles and asset rationalizations of petrochemical supermajors. Dow
              serves as the anchor customer and commercial validation partner, previously planning joint facility
              construction across Europe and the US totaling up to 600 ktpa of advanced recycling capacity by 2030.
              However, this commercial alliance suffered a major adverse contraction on August 6, 2025, when Dow
              formally canceled its planned 120 ktpa chemical recycling plant at Böhlen, Germany. Dow's decision
              directly followed the structural rationalization and planned Q4 2027 shutdown of its co-located Böhlen
              steam cracker, illustrating the systemic co-location vulnerability of Mura's offtake model when host
              crackers lose viability amid European energy costs. Furthermore, Mura's software namesake entity (a field
              service billing startup acquired by ServiceTrade in June 2026) highlights search disambiguation noise in
              secondary tracking, while Mura Technology's internal IT operations rely on third-party cloud
              infrastructure managed by ElysianIT. With Böhlen terminated, commercial revenue generation remains
              entirely reliant on achieving stable operational nameplate throughput at Wilton and advancing licensing
              milestone disbursements from Asian petrochemical licensees.
            claimRefs:
              - CU001
              - CU007
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
