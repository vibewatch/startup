              - CE014
      - number: '5.3'
        title: Commercial Facility Deployment, Licensing Pipeline, and Infrastructure Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              Mura executes a hybrid commercial model combining direct equity asset ownership with global technology
              licensing managed exclusively by KBR Inc., which also holds an 18.5 percent equity stake secured by a
              charge over Mura's intellectual property. Mura's flagship commercial-scale asset, Mura Wilton in Teesside,
              UK (developed under subsidiary ReNew ELP), was planned as an 80,000 tonnes per annum plant constructed
              across four 20,000 tpa lines, with an initial 20 kta phase supported by a 4.42 million pound Innovate UK
              grant and operated under a 10-year contract by px Group. In parallel, KBR licensed Hydro-PRT units to
              international chemical producers including Mitsubishi Chemical (25 kta at Ibaraki, Japan), LG Chem (25 kta
              in South Korea), and GS Caltex (50 kta in South Korea). However, Mura's ambitious roadmap—targeting 1.5
              million tonnes of global capacity in operation or development by 2032—experienced a severe structural
              disruption in August 2025 when anchor partner Dow canceled plans for a 120 kta facility at Böhlen,
              Germany. Dow's cancellation was precipitated by its planned fourth-quarter 2027 shutdown of the Böhlen
              steam cracker, exposing the critical vulnerability of co-located chemical recycling plants to incumbent
              petrochemical asset closures.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Co-Location Vulnerability Exposed by Dow Böhlen Plant Cancellation
            body: >-
              Advanced chemical recycling facilities designed to supply circular naphtha directly to regional
              petrochemical steam crackers face systemic asset co-location risk. In August 2025, Dow canceled the
              flagship 120 kta Böhlen project following its decision to permanently shut down its adjacent steam cracker
              by Q4 2027. This development proves that advanced recycling capital expenditure remains hostage to the
              economic viability and restructuring cycles of aging incumbent petrochemical assets.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
          - type: callout
            title: Thermodynamic Superiority of Supercritical Water Over Pyrolysis
            body: >-
              By employing supercritical water rather than external conductive heating, Hydro-PRT overcomes the
              fundamental thermodynamic bottlenecks of traditional pyrolysis. Supercritical steam provides
              instantaneous, homogeneous volumetric heat transfer, eliminates tube coking, and donates hydrogen to cap
              reactive radical species. This delivers an over 85 percent mass conversion to stable hydrocarbon products
              while accommodating mixed, organic-contaminated packaging waste.
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Value Chain Architecture
        blocks:
          - type: paragraph
            body: >-
              Mura Technology's commercial model serves two distinct customer segments across the global chemical
              recycling value chain: petrochemical off-takers of hydrothermal circular hydrocarbons and corporate
              process licensees deploying Hydro-PRT facilities. Petrochemical resin producers represent the core volume
              customers for output fractions, requiring high-specification liquid hydrocarbons (circular naphtha) for
              steam cracker integration, light vapour products for gas cracking, and heavy residual fractions for
              asphalt or bitumen blending. Commercial deployment is anchored by long-term strategic contracts with
              multinational chemical manufacturers such as Dow, which acts as both an equity investor and primary
              offtaker for recycled hydrocarbons produced at Mura's flagship Wilton site to supply circular polymer
              packaging. Concurrently, Mura monetizes its core intellectual property through process licensing and
              engineering packages marketed exclusively worldwide by engineering major KBR. These licensing
              counterparties—spanning Asian industrial conglomerates including Mitsubishi Chemical Corporation in Japan,
              alongside LG Chem and GS Caltex in South Korea—acquire design packages to construct regional recycling
              capacity. Waste management suppliers complete the counterparty ecosystem under long-term supply
              arrangements to deliver post-consumer plastic bales, though feedstock procurement remains vulnerable to
              contamination limits and regional sorting economics.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
