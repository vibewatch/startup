  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Waste Streams, and Petrochemical Substitution
        blocks:
          - type: paragraph
            body: >-
              The advanced plastic recycling market occupies a critical boundary between municipal and industrial solid
              waste management and the virgin petrochemical manufacturing sector. Traditional mechanical recycling
              processes are chemically and mechanically constrained to relatively clean, single-polymer waste streams
              (predominantly clear PET beverage bottles and rigid HDPE containers). Multi-layered flexible films,
              metallised laminates, and food-contact post-consumer packaging are largely unrecyclable via mechanical
              means and are conventionally destined for landfill disposal, municipal waste incineration with energy
              recovery, or export. Mura Technology defines its addressable feedstock boundary precisely around these
              rejected, contaminated post-consumer plastics, utilizing its proprietary Hydro-PRT supercritical
              hydrothermal liquefaction process to crack mixed polymers back into liquid hydrocarbons. On the output
              side of the market boundary, the addressable spend represents the displacement of fossil naphtha and gas
              cracker feedstocks purchased by petrochemical resin manufacturers. By producing drop-in liquid
              hydrocarbons that are REACH registered and compatible with existing steam cracker infrastructure, Mura
              sells directly into virgin petrochemical supply chains rather than the downgauged mechanical recyclate
              market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses and Global Advanced Recycling Capacity Trajectory
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for hydrothermal advanced plastic recycling requires separating
              macro-level plastic waste valuations from verifiable operational off-take capacity. Industry advocacy and
              macroeconomic analyses cited in company literature estimate the total value of global plastics at over
              $1.05 trillion annually by 2033, with annual feedstock value supplied for new plastics reaching
              approximately $180 billion. Furthermore, approximately $120 billion in material value from plastic
              packaging is lost annually through landfill and incineration, reflecting a massive theoretical reservoir
              of underutilized hydrocarbon resources. However, for an advanced recycling developer and licensor, the
              serviceable addressable market is strictly bounded by petrochemical off-take commitments and installed
              hydrothermal processing capacity. Mura initially set an operational goal of reaching 1,000,000 metric
              tonnes of annual recycling capacity globally by 2025 in partnership with Dow, later expanding its
              corporate ambition to 1,500,000 tonnes per year of advanced recycling capacity in operation or development
              by 2032. Partnership arrangements with Dow contemplated scaling aggregate capacity by up to 600 kilotons
              per annum (KTA) across multiple planned facilities in the United States and Europe by 2030, alongside
              regional expansion initiatives such as a planned 50 KTA facility on Jurong Island in Singapore and
              technology licensing with Mitsubishi Chemical in Japan.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
