  - id: TP001
    title: Competitive Landscape by Recycling Technology Class
    columns:
      - Competitor / Technology Class
      - Recycling Route
      - Primary Target Waste Feedstock
      - Key Capability & Differentiation
      - Material Limitation / Disadvantage
    rows:
      - - Mechanical Recycling (Incumbents)
        - Mechanical shredding & regranulation
        - Clean rigid PE, PP, and PET containers
        - Lowest processing energy and established sorting infrastructure
        - Cannot process multi-layer flexible films; polymer degradation across cycles
      - - Solvent-based Physical Recycling
        - Selective polymer dissolution & precipitation
        - Targeted multi-layer packaging films (PE/PA)
        - Preserves polymer chain structure without chemical cracking
        - Solvent recovery energy demands; sensitive to unexpected additives
      - - Conventional Pyrolysis (Thermal/Catalytic)
        - Thermal cracking in inert atmosphere
        - Sorted mixed polyolefins (PE, PP)
        - Direct conversion to pyrolysis oils and cracker feedstocks
        - Char formation, wax buildup, reactor fouling, and strict chlorine limits
      - - Hydro-PRT (Mura Technology)
        - Supercritical water hydrothermal liquefaction
        - Mixed flexible films, multi-material laminates, rigid reject fractions
        - Homogeneous internal heat transfer; tolerates paper and organic impurities
        - High capital expenditure, severe process pressurization, and energy intensity
    notes: >-
      Data reflects structural comparisons between industrial recycling pathways based on published technical
      disclosures and lifecycle assessments.
