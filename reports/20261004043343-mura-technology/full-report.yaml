      - number: '7.4'
        title: Partner, supply, and financing dependencies
        blocks:
          - type: paragraph
            body: >-
              Dow is described as a key offtaker and provider of resources intended to help finance a multi-project
              pipeline; KBR is the exclusive licensing partner and participates in engineering and upgrading; and Mura
              says px Group received a ten-year Wilton operations and maintenance contract. These arrangements can
              reduce execution friction, but they also create concentrated interfaces whose termination rights,
              performance guarantees, step-in provisions, and minimum commitments are not disclosed here. Singapore adds
              dependence on local collection, imported verified feedstock, agency coordination, and industrial-site
              integration. Because the retained sources do not disclose capex, cash burn, liquidity, debt covenants, or
              contingency funding, funding raised or partner support cannot be treated as cash available for completion.
            claimRefs:
