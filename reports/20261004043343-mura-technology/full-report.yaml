  - id: FE001
    title: 'Hydro-PRT Architecture: Multi-Stage Hydrothermal Liquefaction Stack'
    type: stack
    summary: >-
      Structural architecture of Mura's Hydro-PRT recycling system spanning feedstock prep, core supercritical
      hydrothermal liquefaction, primary separation, and refinery upgrading.
    data:
      layers:
        - label: Feedstock Preparation & Sourcing Layer
          detail: >-
            Mechanical shredding, density separation, and contaminant removal of mixed post-consumer rigid/flexible
            plastics
        - label: Thermal Pressurisation & Molten Feed Layer
          detail: High-pressure polymer extrusion and thermal preparation prior to reactor injection
        - label: Supercritical Hydrothermal Liquefaction Layer
          detail: >-
            Supercritical water reaction (>374°C, >221 bar) acting as molecular scissors and hydrogen donor in 25–30 min
            residence
        - label: Depressurisation & Energy Recovery Layer
          detail: >-
            High-differential pressure let-down, flash separation, and heat integration recycling off-gas to plant
            boilers
        - label: Fractionation & Product Storage Layer
          detail: >-
            Distillation into REACH-registered circular liquid hydrocarbons (naphtha), light vapour gas, and circular
            heavy residual
        - label: KBR Petrochemical Upgrading Layer
          detail: >-
            Optional catalytic hydroprocessing bolt-on module ensuring drop-in compatibility with commercial steam
            crackers
    approximationNotes: >-
      Represents standard process boundaries and flow architecture as defined in Mura Technology technical documentation
      and KBR engineering literature.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE007
      - CE008
      - CE009
