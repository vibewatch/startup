              - CE009
      - number: '5.2'
        title: Feedstock Tolerance Envelope, Hydrocarbon Product Slate, and Refinery Upgrading
        blocks:
          - type: paragraph
            body: >-
              The commercial differentiation of Hydro-PRT rests on its broad tolerance for contaminated, mixed
              post-consumer waste plastics that mechanical recyclers routinely reject. Target input streams encompass
              polyolefins (polyethylene and polypropylene), polystyrene, multi-layer flexible films, laminated and
              metalized packaging, and rigid containers laden with organic residues such as food remnants and paper
              labels. After mechanical preprocessing to shred bales and remove inert contaminants including metals,
              grit, and glass, the plastic is melted, pressurized, and blended with supercritical water before reactor
              injection. The depressurized reaction effluent undergoes flash distillation to separate products into
              light vapour gas cracker feedstocks, circular liquid hydrocarbons (naphtha substitutes), and a circular
              heavy residual fraction suitable as an asphalt and bitumen additive. Process off-gas is recycled directly
              into plant boilers to generate supercritical steam, reducing external fossil energy consumption. To
              maximize petrochemical substitution, Mura and engineering partner KBR have developed bolt-on product
              upgrading modules that hydrotreat raw distillates to meet stringent olefin cracker purity specifications.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
