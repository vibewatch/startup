  - id: TV002
    title: Investment Thesis and Counter-Thesis Matrix
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Risk
      - What Would Change View
    rows:
      - - Technology & Product
        - >-
          Hydro-PRT uses supercritical water to recycle contaminated, multi-layer plastics into high-value circular
          hydrocarbons in 30 minutes.
        - >-
          Long-term catalyst stability, water separation energetics, and continuous commercial yield have yet to be
          verified across multi-year runs.
        - >-
          Independent technical audit verifying sustained mass yield and product purity across continuous operating
          campaigns.
      - - Commercial Distribution
        - >-
          KBR acts as exclusive global licensing and engineering partner, providing international sales reach and EPC
          credibility.
        - >-
          Licensing model decouples Mura from project execution control; KBR holds an equity stake and IP security
          charge creating overhang.
        - Clarity on royalty split economics and full release or subordination of KBR's IP security charge.
      - - Offtake & Partnerships
        - >-
          Strategic multi-plant partnerships with global chemical leaders Dow and CPChem provide committed offtake
          demand for circular naphtha.
        - >-
          Dow's August 2025 cancellation of the 120 kta Böhlen plant reveals structural vulnerability to downstream
          petrochemical cracker closures.
        - >-
          Execution of binding, non-cancelable offtake agreements with alternative European and North American cracker
          operators.
      - - Global Project Scaling
        - >-
          Diverse international footprint spanning Wilton (UK), Ibaraki (Japan), South Korea (LG Chem), and Jurong
          Island (Singapore).
        - >-
          Capital-intensive overseas plant development introduces cross-border permitting, construction cost inflation,
          and feedstock risk.
        - >-
          Successful commercial commissioning and positive EBITDA generation from the initial Wilton line and Asian
          licensed plants.
    notes: >-
      Pillars synthesize technical, commercial, partner, and operational risks identified across primary filings and
      industry reporting.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV011
      - CV012
  - id: TV003
    title: Scenario Valuation and Operational Return Matrix
    columns:
      - Scenario
      - Core Assumptions
      - Operational & Valuation Logic
      - Key Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Wilton reaches full 80 kta capacity; MCC (25 kta) and LG Chem (25 kta) plants commence operations; Singapore
          50 kta site reaches FID.
        - >-
          Mura realizes blended royalty revenues and robust Wilton off-take margins; corporate valuation exceeds $1B in
          strategic liquidity event.
        - Unforeseen catalytic poisoning or regulatory pushback on chemical recycling mass-balance accounting in EU.
        - Low to Moderate (20%)
      - - Base Case
        - >-
          Wilton operates stably at initial 20 kta; licensed Asian units proceed with minor delays; direct plant
          expansion in Europe remains frozen.
        - >-
          Mura operates as a profitable niche licensor and regional operator, generating steady cash flow but modest
          enterprise valuation multiple.
        - Prolonged low virgin naphtha prices eroding circular green premiums; slower licensee construction timelines.
        - Moderate (55%)
      - - Bear Case
        - >-
          Wilton suffers mechanical downtime or negative operating margins; further offtake partners cancel co-located
          units post-Böhlen.
        - >-
          Liquidity exhaustion requires dilutive rescue financing or debt restructuring; KBR enforces IP security charge
          to recover capital.
        - >-
          Complete shutdown of European petrochemical partner crackers or insolvency of operating project
          special-purpose vehicles.
        - Moderate (25%)
    notes: >-
      Scenarios reflect qualitative risk-adjusted milestones; exact enterprise valuation figures are omitted due to
      private financial data gaps.
    claimRefs:
      - CV004
      - CV005
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
