  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Hydro-PRT Process Mechanism and Core Thermodynamic Architecture
        blocks:
          - type: paragraph
            body: >-
              Mura Technology's operating architecture centers on Hydro-PRT (Hydrothermal Plastic Recycling Technology,
              formerly marketed as HydroPRS), an advanced hydrothermal liquefaction (HTL) system derived from Licella's
              patented Catalytic Hydrothermal Reactor (Cat-HTR) platform. Unlike conventional pyrolysis or gasification
              pathways that suffer from low thermal conductivity, severe coking, and strict feedstock sorting
              constraints, Hydro-PRT utilizes supercritical water as a homogeneous heat-transfer medium and reactive
              chemical agent. Operating at supercritical conditions exceeding 374 degrees Celsius and 221 bar of
              pressure, water exhibits liquid-like density and gas-like diffusivity, behaving as molecular scissors that
              rapidly sever long-chain polymer bonds in under 30 minutes. Furthermore, supercritical water acts as an
              active donor of hydrogen to stabilize cracked free radicals, suppressing secondary char-forming
              condensation reactions and yielding an over 85 percent mass conversion efficiency from dry ash-free
              plastic into stable, shorter-chain circular hydrocarbons.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
