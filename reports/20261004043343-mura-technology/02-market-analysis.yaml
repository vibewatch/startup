company:
  name: Mura Technology
chapter:
  number: 2
  title: Market Analysis
  summary: Mura Technology targets the global market for circular chemical feedstocks derived from hard-to-recycle plastic
    waste, operating via technology licensing and equity plant development. The market boundary encompasses post-consumer
    flexible films and rigid multi-layer packaging currently routed to incineration or landfill, converting them via supercritical
    water hydrothermal liquefaction into drop-in petrochemical cracker feedstocks. Commercial adoption is driven by petrochemical
    resin producers such as Dow and Mitsubishi Chemical seeking certified circular content, but faces severe constraints from
    high capital intensity, feedstock contamination limits, and commercial execution setbacks such as the cancellation of
    the 120,000 mt/year Böhlen facility.
sections:
- id: market-boundary-scope
  title: Market Boundary, Addressable Waste Streams, and Petrochemical Substitution
  body: The advanced plastic recycling market occupies a critical boundary between municipal and industrial solid waste management
    and the virgin petrochemical manufacturing sector. Traditional mechanical recycling processes are chemically and mechanically
    constrained to relatively clean, single-polymer waste streams (predominantly clear PET beverage bottles and rigid HDPE
    containers). Multi-layered flexible films, metallised laminates, and food-contact post-consumer packaging are largely
    unrecyclable via mechanical means and are conventionally destined for landfill disposal, municipal waste incineration
    with energy recovery, or export. Mura Technology defines its addressable feedstock boundary precisely around these rejected,
    contaminated post-consumer plastics, utilizing its proprietary Hydro-PRT supercritical hydrothermal liquefaction process
    to crack mixed polymers back into liquid hydrocarbons. On the output side of the market boundary, the addressable spend
    represents the displacement of fossil naphtha and gas cracker feedstocks purchased by petrochemical resin manufacturers.
    By producing drop-in liquid hydrocarbons that are REACH registered and compatible with existing steam cracker infrastructure,
    Mura sells directly into virgin petrochemical supply chains rather than the downgauged mechanical recyclate market.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
- id: sizing-lenses-capacity
  title: Market Sizing Lenses and Global Advanced Recycling Capacity Trajectory
  body: Evaluating the addressable market for hydrothermal advanced plastic recycling requires separating macro-level plastic
    waste valuations from verifiable operational off-take capacity. Industry advocacy and macroeconomic analyses cited in
    company literature estimate the total value of global plastics at over $1.05 trillion annually by 2033, with annual feedstock
    value supplied for new plastics reaching approximately $180 billion. Furthermore, approximately $120 billion in material
    value from plastic packaging is lost annually through landfill and incineration, reflecting a massive theoretical reservoir
    of underutilized hydrocarbon resources. However, for an advanced recycling developer and licensor, the serviceable addressable
    market is strictly bounded by petrochemical off-take commitments and installed hydrothermal processing capacity. Mura
    initially set an operational goal of reaching 1,000,000 metric tonnes of annual recycling capacity globally by 2025 in
    partnership with Dow, later expanding its corporate ambition to 1,500,000 tonnes per year of advanced recycling capacity
    in operation or development by 2032. Partnership arrangements with Dow contemplated scaling aggregate capacity by up to
    600 kilotons per annum (KTA) across multiple planned facilities in the United States and Europe by 2030, alongside regional
    expansion initiatives such as a planned 50 KTA facility on Jurong Island in Singapore and technology licensing with Mitsubishi
    Chemical in Japan.
