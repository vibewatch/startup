  - - Rigid Multi-Layer Packaging
    - Composite plastic trays, metallised packaging, mechanical sort residues
    - Clean mono-material PET beverage bottles and pure rigid HDPE containers
    - Material recovery facilities / Waste collectors
    - Feedstock rejected by mechanical recycling due to multi-material contamination
  - - Circular Cracker Feedstocks
    - REACH-registered circular liquid hydrocarbons, naphtha substitutes
    - Low-value unrefined pyrolysis waxes, untreated dirty heavy oils
    - Petrochemical resin producers (e.g., Dow)
    - Direct drop-in replacement for fossil feedstocks in existing steam crackers
  - - Process & Vapour Gas Fractions
    - Light vapour products, process gas recycled for internal plant steam generation
    - Flared off-gases, unrecovered atmospheric emissions
    - Internal plant operations / Gas crackers
    - Offsets external natural gas consumption, improving thermal plant economics
