callouts:
- calloutType: risk
  title: 'Downside Risk: Commercial Execution and Partner Plant Cancellations'
  body: The cancellation of the 120,000 mt/year Böhlen chemical recycling facility by Dow in August 2025 represents a material
    commercial setback for Mura Technology. While Dow reaffirmed its intent to explore alternative European collaboration
    opportunities, the termination of Europe's planned largest advanced recycling plant highlights significant macroeconomic,
    permitting, and capital expenditure barriers confronting rapid commercial scaling.
  claimRefs:
  - CM010
  - CM016
- calloutType: insight
  title: 'Strategic Fit: Drop-In Petrochemical Compatibility Eliminates Packaging Redesign'
  body: Hydrothermal liquefaction via Hydro-PRT provides drop-in liquid hydrocarbons that enter existing petrochemical steam
    crackers, enabling resin producers to synthesize virgin-grade polymers with identical mechanical and food-contact properties.
    This directly solves a primary bottleneck for brand owners who cannot utilize degraded mechanical recyclate for sensitive
    packaging applications.
  claimRefs:
  - CM003
  - CM004
  - CM012
