callouts:
- calloutType: risk
  title: Commercial-scale does not yet mean commercially proven
  body: The evidence establishes a Wilton site opening and a company forecast for 20 kt/a operation in 2025, not achieved
    2026 production. Until Mura provides throughput, uptime, yield, product-specification acceptance, customer deliveries,
    and cash-generation data, diligence should classify the asset as commercial-scale with operating performance unverified
    rather than assume steady-state commercial operation.
  claimRefs:
  - CO012
  - CO013
