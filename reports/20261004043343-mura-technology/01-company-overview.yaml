company:
  name: Mura Technology
chapter:
  number: 1
  title: Company Overview
  summary: Mura Technology is a privately held UK advanced-plastics-recycling company pursuing a hybrid model of owner-developed
    plants and Hydro-PRT licensing through KBR. Public evidence confirms substantial strategic backing and a commercial-scale
    asset, but it does not establish current Wilton throughput, revenue, valuation, total funding, customer count, or a complete
    governance picture; Dow's 2025 Böhlen cancellation also shows that announced capacity can be lost when a host petrochemical
    asset closes.
sections:
- id: identity-and-operating-model
  title: Identity, Product, and Operating Model
  body: Mura Technology describes a hydrothermal advanced-recycling business built around Hydro-PRT, which uses supercritical
    water to turn mixed plastic waste into hydrocarbon products. Its public company profile says it was founded in 2019 and
    is privately held, while its official technology page lists the Wilton Centre in Redcar as the main office; the older
    profile instead labels London as headquarters, so legal, executive, and operating locations should not be treated as interchangeable.
    The disclosed commercial model combines Mura-developed plants in the UK and Southeast Asia with sites licensed through
    KBR. This structure can extend reach without Mura funding every plant, but economics by channel, license royalties, and
    asset-level ownership are not disclosed in the assigned evidence.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Leadership and Governance Visibility
  body: Dr. Steve Mahon is identified as chief executive in partner and 2025 third-party coverage, making him the clearest
    currently evidenced senior leader and the principal public spokesperson for Mura's expansion. Mura's milestone feed records
    Greg Friedman's October 2021 appointment as chief financial officer, but the assigned pool does not independently confirm
    his current tenure, disclose the founders, or provide a complete executive roster. It also does not establish board composition,
    voting control, director independence, or succession arrangements. The public leadership surface therefore supports only
    a partial management view. Key-person dependence is potentially material because external communications, licensing relationships,
    and site-development announcements repeatedly center on Mahon, while the depth of operating and financial leadership cannot
    be tested from these sources.
  claimRefs:
  - CO006
  - CO007
  tableRefs:
  - TO002
- id: capital-and-stakeholder-structure
  title: Capital Milestones and Stakeholder Dependence
  body: Publicly quantified capital evidence is fragmentary rather than a funding history. Mura's brochure reports a £4.42
    million Innovate UK grant to the Wilton project in October 2020, and its milestone feed records a US$100 million strategic
    investment from KBR in June 2022. These amounts are not a supportable total-raised figure and say nothing about current
    cash availability, valuation, dilution, debt, or investment terms. Dow is described as both an investor and an offtaker,
    while KBR is the exclusive global licensing channel. A Dow release also says the Cat-HTR technology at the core of HydroPRS
    was developed and is owned by Licella Holdings. Those relationships provide industrial validation, but they also create
    material dependencies on counterparties for IP, licensing, engineering, funding, and product demand.
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  tableRefs:
  - TO003
- id: scale-and-milestones
  title: Commercial Scale, Milestones, and Adverse Reset
  body: Mura's website records that the Wilton commercial-scale site opened its doors in October 2023, while a 2025 brochure
    projected a 20-kilotonne-per-year initial line to become operational during 2025. Neither disclosure supplies 2026 throughput,
    uptime, yield, customer deliveries, or revenue, so steady-state commercial operation remains unverified. Expansion evidence
    is similarly mixed. Indian Chemical News reported a planned 50-kilotonne-per-year Singapore facility in August 2025, but
    S&P Global reported that Dow canceled the planned 120,000-metric-tonne-per-year Böhlen facility that same month after
    deciding to close the associated cracker. The cancellation narrows the earlier 600-kilotonne annual US-and-Europe ambition
    announced in 2022 and shows that pipeline capacity is not equivalent to financed, constructed, or operating capacity.
  claimRefs:
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  figureRefs:
  - FO001
