      - [Visibility platform, "Subscription label in a private-market profile", Realized price unknown, Contract terms unavailable, Subscription contribution cannot be modeled]
      - [Insurance, "No public premium or commission schedule", Realized economics unknown, Carrier and claims terms unavailable, Need commission and loss data]
      - [Financing, "No public interest, fee, or spread schedule", Realized economics unknown, Financing book disclosures unavailable, "Need yield, funding cost, and credit-loss data"]
    notes: The table separates a third-party revenue-model label from realized revenue. Official service descriptions are not a price list.
    claimRefs: [CI002, CI003, CI014]
  - id: TI003
    title: Unit economics and capital-adequacy data
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue growth, "More than 12x YoY in Q1 2022", Medium, "Indicates historical acceleration but not durability", "Provide monthly revenue bridge and cohort retention"]
      - [Containers shipped growth, "10x YoY in Q1 2022", Medium, "Indicates activity scale but not margin", "Provide shipment-level gross profit by mode and lane"]
      - [Customers served growth, "10x YoY in Q1 2022", Medium, "Indicates demand expansion but not quality", "Provide customer cohorts, concentration, churn, and NRR"]
      - [CAC and payback, null, Low, "Determines whether growth consumes capital", "Provide fully loaded CAC, sales cycle, and payback by segment"]
      - [Gross margin, null, Low, "Determines freight economics after carrier and service costs", "Provide audited gross margin bridge by offering"]
      - [Financing loss rate, null, Low, "Determines whether financing adds or destroys value", "Provide delinquency, defaults, reserves, and recovery history"]
      - [Cumulative funding, "More than $240M; another profile reports $242.6M", Medium, "Historical funding raised is not cash available", "Provide current cash and restricted cash"]
      - [Latest disclosed round, "$150M Series C in May 2022", High, "Dates the last public financing event", "Provide post-round cash deployment and remaining liquidity"]
      - [Historical valuation, "$1.1B post-money in May 2022", High, "A stale transaction price is not current enterprise value", "Provide current preferred and secondary pricing"]
      - [Burn and runway, null, Low, "Determines financing urgency and next-round timing", "Provide monthly cash flow, burn, runway, and next-round trigger"]
      - [Debt and facilities, null, Low, "Could add covenant, guarantee, and refinancing risk", "Provide debt schedule, guarantees, and warehouse facilities"]
      - [Financing-book exposure, null, Low, "Could add working-capital and credit-loss risk", "Provide receivables aging, reserves, funding partners, and losses"]
    notes: Nulls mean the metric was not disclosed in the assigned public sources; historical company-reported growth, funding raised, and valuation are not audited unit economics, current cash, or current enterprise value.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: From shipment activity to underwritten contribution profit
    type: flow
    summary: The disclosed operating model links shipment execution to ancillary services, but public evidence does not quantify the conversion from activity to revenue or gross profit.
    data:
      nodes:
        - id: shipments
          label: Shipment execution
          detail: Ocean, air, and ground freight
        - id: visibility
          label: Visibility service
          detail: Tracking, alerts, and account support
        - id: insurance
          label: Insurance
          detail: Cargo insurance arranged with freight
        - id: financing
          label: Inventory financing
          detail: Customer access to import working capital
        - id: revenue
          label: Revenue
          detail: Commission and subscription labels; realized mix unknown
        - id: contribution
          label: Contribution profit
          detail: Carrier, personnel, service, and credit costs not publicly disclosed
      edges:
        - [shipments, visibility]
        - [shipments, insurance]
        - [shipments, financing]
        - [visibility, revenue]
        - [insurance, revenue]
        - [financing, revenue]
        - [revenue, contribution]
    approximationNotes: The flow is a conceptual operating bridge based on source-described offerings; it does not calculate conversion rates or imply that every shipment uses every ancillary service.
    claimRefs: [CI001, CI002, CI009, CI012, CI016]
callouts:
  - calloutType: strength
    title: Historical scale signal
    body: Assigned reporting records more than 12x year-over-year revenue growth and 10x growth in containers shipped and customers served in Q1 2022, but those figures remain company-reported and historical.
    claimRefs: [CI005, CI006, CI007]
  - calloutType: risk
    title: Financing dependency is not measurable
    body: Inventory financing may increase customer throughput while adding credit and working-capital exposure; public sources do not disclose the book size, funding, reserves, delinquency, or loss rate.
    claimRefs: [CI009, CI012, CI016]
  - calloutType: recommendation
    title: Request financial operating pack
    body: Underwriting should require monthly revenue by stream, shipment-level gross profit, customer cohorts, cash and burn, debt, and financing-book performance before relying on the historical valuation.
    claimRefs: [CI013, CI014, CI015]
