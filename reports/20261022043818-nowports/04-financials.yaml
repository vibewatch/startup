  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-quality
      missingEvidence: Current monthly revenue by freight, visibility, insurance, and financing streams, with gross-versus-net recognition policy.
      whyItMatters: Historical growth does not show whether revenue is recurring, high quality, or profitable after pass-through freight costs.
      diligencePath: Request the latest 24-month monthly P&L, revenue-recognition memo, customer cohort revenue, and shipment-level gross-profit bridge.
      relatedQuestionRefs: [QI002, QI003, QI009]
      relatedTableRefs: [TI001, TI002, TI003]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash, burn, runway, debt, warehouse facilities, and financing-book reserve and delinquency data.
      whyItMatters: Funding raised is not cash available, and customer financing may create material liquidity and credit exposure.
      diligencePath: Request bank statements, cash-flow forecast, debt schedule, facility covenants, receivables aging, default history, and reserve methodology.
      relatedQuestionRefs: [QI006, QI007]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: cost-structure
      missingEvidence: Current carrier, personnel, service-delivery, and working-capital cost schedules by revenue stream.
      whyItMatters: Without cost attribution, public growth cannot establish gross margin or contribution profit.
      diligencePath: Request monthly cost-center detail and a shipment-level margin bridge reconciled to the P&L.
      relatedQuestionRefs: [QI005]
    - type: missing-source
      severity: material
      topic: sales-efficiency
      missingEvidence: Independent customer-level evidence on pricing, retention, concentration, and service-delivery economics.
      whyItMatters: Public activity metrics cannot distinguish durable customer value from capital-intensive volume growth.
      diligencePath: Obtain anonymized cohort tables, top-customer concentration, churn and NRR, CAC by segment, sales cycle, and customer references.
      relatedQuestionRefs: [QI004, QI009]
      relatedTableRefs: [TI003]
    - type: access-blocked
      severity: material
      topic: adverse
      missingEvidence: Substantive independent analysis testing the adverse unit-economics signal.
      whyItMatters: The available adverse page title indicates a potential failure mode but does not provide evidence for its conclusion.
      diligencePath: Obtain the underlying analysis or independently test lane-level contribution margin, financing losses, and cash conversion.
      relatedQuestionRefs: [QI008]
