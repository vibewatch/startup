schemaVersion: "report-v2"
artifact: financials
slug: nowports
runDate: 2026-10-22
company:
  name: Nowports
chapter:
  number: 4
  title: Financials
  summary: Nowports has disclosed a transaction-led freight-forwarding model with additional insurance and financing services, plus strong historical growth claims around its 2022 Series C. Public evidence does not disclose current revenue quality, gross margin, cash runway, financing-book performance, or realized pricing, so underwriting remains dependent on private diligence.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: Nowports presents itself as a digital freight forwarder that combines ocean, air, and land shipment execution with visibility, insurance, and financing-adjacent services. A third-party company profile labels the revenue model as commission and subscription, while the official site describes a dedicated account executive, real-time visibility, and a partner network rather than publishing a rate card. This supports a transaction- and service-led monetization hypothesis, but does not establish realized take rates, recurring-revenue mix, gross revenue versus net revenue presentation, or the share of revenue from financing and insurance. The lack of public customer contracts means list or quoted pricing cannot be treated as revenue.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: traction-and-efficiency
    title: Traction and sales-efficiency proxies
    body: TechCrunch reported that Nowports said first-quarter 2022 revenue increased by more than 12x year over year, alongside 10x growth in containers shipped and customers served. Those are company-reported growth indicators, not audited revenue, ARR, contribution margin, or customer cohorts. Coverage also described expansion to ten active offices in seven countries and more than 500 employees, while a later 2023 article reported 950 employees; the differing snapshots illustrate why current headcount and productivity need re-verification. There is no public CAC, payback, sales-cycle, churn, NRR, or gross-profit disclosure in the assigned sources, so efficiency is not underwritable from public evidence.
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: cost-structure-and-capital
    title: Cost structure, capital intensity, and financing dependency
    body: The operating model appears working-capital intensive because the company arranges physical freight and has marketed inventory financing to customers. Nowports described using shipping history and preloaded information to approve financing faster, but the assigned sources do not disclose receivables duration, funding partners, reserve policy, delinquency, losses, or whether the financing book is on balance sheet. Historical funding coverage documents a $150 million Series C at a $1.1 billion valuation and more than $240 million of cumulative funding, with proceeds intended for hiring, engineering, geographic expansion, and financing services. Funding raised is not cash available today; current cash, burn, debt, covenants, and runway remain unknown.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial underwriting verdict and diligence blockers
    body: |
      The evidence supports a real regional logistics platform with multiple service lines and historically rapid reported expansion, but it does not support a current margin or valuation conclusion. A current-run-year private-market profile still repeats the 2022 valuation and commission/subscription labels rather than providing current financial statements. An adverse page is titled “Why Nowports Failed: Unit Economics | Startup Autopsy,” but its prefetched text contains only the title, so it is a signal to investigate rather than proof of failure. The central underwriting question is whether shipment scale converts into durable contribution profit after carrier costs, personnel, service delivery, financing losses, and working capital.
    claimRefs: [CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
