  - id: FU001
    title: Customer journey from freight need to expansion
    type: journey-map
    summary: >-
      The public evidence supports a workflow from cross-border freight planning through digital execution and connected
      documentation, while retention and expansion measurement remain unverified.
    data:
      items:
        - label: 1. Freight need
          stage: 1. Freight need
          title: Import or export requirement
          description: Latin American importer or exporter seeks to move goods across borders.
          touchpoints:
            - Ocean, air, or ground freight
            - SME and broader B2B target
        - label: 2. Plan and quote
          stage: 2. Plan and quote
          title: Route and capacity decision
          description: >-
            Customer evaluates rates together with space availability, transit times, route alternatives, and
            responsiveness.
          touchpoints:
            - Volatile freight conditions
            - Delivery-time priority
        - label: 3. Book and execute
          stage: 3. Book and execute
          title: Digital freight workflow
          description: Nowports coordinates shipment execution and seeks to simplify the import/export process.
          touchpoints:
            - Bookings
            - Operational coordination
        - label: 4. Track and document
          stage: 4. Track and document
          title: Visibility and e-documents
          description: >-
            Connected workflows cover tracking and critical electronic documents such as shipping instructions and bills
            of lading.
          touchpoints:
            - Real-time data exchange
            - Shipment tracking
        - label: 5. Protect and finance
          stage: 5. Protect and finance
          title: Adjacent logistics services
          description: Public descriptions include cargo insurance and financing services alongside freight.
          touchpoints:
            - Cargo insurance
            - Trade-financing support
        - label: 6. Repeat and expand
          stage: 6. Repeat and expand
          title: Durability test
          description: >-
            Repeat purchase, renewal, cross-sell, and account expansion would validate the model, but public cohort
            evidence is absent.
          touchpoints:
            - NRR/GRR and churn requested
            - Concentration and contract data requested
    approximationNotes: Stages 1-5 reflect described customer workflows; stage 6 is a diligence checkpoint rather than a verified outcome.
