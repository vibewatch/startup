    columns:
      - Case
      - Operating assumptions
      - Valuation or return logic
      - Key risks and probability signal
    rows:
      - - Bull
        - >-
          Growth persists; forwarding contribution margins improve; financing losses remain controlled; retention is
          verified.
        - >-
          A current mark could justify a premium to freight peers only after primary evidence supports software-like
          durability.
        - Execution and credit risk remain; low-to-medium probability until current metrics are disclosed.
      - - Base
        - >-
          Regional freight platform remains useful but margins and retention are closer to logistics economics than pure
          software.
        - A material discount to the old $1.1B mark is required until current revenue and gross profit are verified.
        - Medium probability; consistent with the evidence gap and mixed database disclosures.
      - - Bear
        - Freight spreads compress, working capital or financing losses rise, or cohorts contract.
        - >-
          Down-round, impaired equity, or preference-driven residual value is plausible; no precise value is
          supportable.
        - High severity; adverse signal is directional only and requires direct verification.
      - - Decision gate
        - Current price, revenue quality, margin, cohort, credit, and preference data are supplied.
        - Move from research-more only if the evidence supports a current risk-adjusted return.
        - Blocking diligence condition; probability cannot be quantified from public evidence.
    notes: >-
