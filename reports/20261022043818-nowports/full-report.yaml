  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Argument
      - Evidence boundary
      - What would change the view
    rows:
      - - Thesis
        - Nowports combines freight execution with tracking, insurance, and inventory financing.
        - The retained product evidence is historical and does not disclose current product-level margins.
        - >-
          Current product mix, contribution margin, and attach-rate evidence would show whether the platform has durable
          economics.
      - - Thesis
        - Historical growth and multi-country expansion indicate that the platform achieved meaningful regional scale.
        - >-
          The growth figures were company-reported in 2022, while the 2023 headcount figure came from a promotional
          publication.
        - Audited 2024-2026 revenue, shipment, customer, and retention cohorts would establish whether scale persisted.
      - - Anti-thesis
        - The May 2022 $1.1B mark is too stale to serve as current fair value.
        - Current-looking databases repeat the same historical financing event and disagree on total capital raised.
        - A current arm's-length primary or secondary transaction with full terms would establish an entry reference.
      - - Anti-thesis
        - Opaque unit economics and financing exposure could make software-like multiples inappropriate.
        - >-
          The adverse page provides only a headline, and retained databases omit verified gross margin, EBITDA, and
          credit-loss data.
        - >-
          Segmented gross profit, contribution margin, delinquency, reserves, and cash conversion would resolve the
          concern.
    notes: >-
      Arguments synthesize historical reporting and current evidence gaps; the adverse headline is directional only and
      is not treated as proof that Nowports failed.
