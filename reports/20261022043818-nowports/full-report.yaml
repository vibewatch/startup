    title: Recommendation logic
    type: flow
    summary: >-
      Historical traction and financing support continued diligence, while stale pricing and opaque economics block a
      current buy call.
    data:
      nodes:
        - id: evidence
          label: Historical evidence
          detail: $150M Series C at $1.1B in May 2022; reported 2022 growth and regional expansion.
        - id: strengths
          label: Platform strengths
          detail: Freight workflow plus tracking, insurance, and inventory financing.
        - id: constraints
          label: Evidence constraints
          detail: Current revenue, margins, retention, credit losses, and cap-table terms are not publicly verified.
        - id: diligence
          label: Diligence gate
          detail: Verify current price, revenue quality, margins, retention, credit losses, and preference terms.
        - id: price
          label: Price discipline
          detail: Do not underwrite the historical $1.1B mark as current fair value.
        - id: recommendation
          label: Research-more
          detail: Require current operating, financing, and preference evidence before pricing entry.
