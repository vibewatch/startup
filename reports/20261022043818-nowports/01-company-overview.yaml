company:
  name: Nowports
chapter:
  number: 1
  title: Company Overview
  summary: Nowports is a Monterrey-founded, privately held digital freight forwarder that combines multimodal logistics with shipment visibility, insurance, and financing-related services. The evidence supports a major 2022 financing milestone and a 2026 relaunch under co-founder Alfonso de los Ríos, but current financial quality, governance, and ownership metrics remain materially under-disclosed.
sections:
  - id: identity-and-business-model
    title: Identity and operating model
    body: >-
      Nowports was founded in Monterrey in 2018 and joined Y Combinator's Winter 2019
      batch. Its core proposition is a digital freight-forwarding layer for Latin American
      importers and exporters, spanning ocean, air, and ground movements rather than a
      pure software subscription. The official site describes real-time cargo visibility,
      centralized documentation, alerts, insurance, cashback, and financing in Mexico,
      while the Y Combinator profile describes the initial focus on ocean containers moving
      to and from Latin America. This combination gives the company a service-led
      operating model with technology embedded in execution; it should not be analyzed as
      SaaS ARR without shipment-level revenue and margin disclosure. The official site
      states that its network connects more than 90 countries and more than 200 strategic
      partners, but these are company claims and their denominator and measurement date
      are not independently established.
    claimRefs: [CO001, CO002, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founder fit, and key-person dependence
    body: >-
      The founders have unusually direct domain exposure: Y Combinator's profile says
      Alfonso (Poncho) de los Ríos came from a family freight-forwarding business in
      Mexico, while co-founder Maxi worked as a freight forwarder in Kansas City before
      building the first product with him. The same profile records rapid early customer
      acquisition and a Y Combinator acceptance, supporting founder-market fit but not
      proving durable organization quality. A 2026 Mexico Business interview says de los
      Ríos spent seven years scaling the company, moved to the board, and returned as CEO
      to relaunch it. That transition makes leadership continuity and the board's actual
      composition a central diligence item: the assigned sources identify the founder
      and a board transition, but do not provide a complete current executive roster,
      independent-director list, or control map.
    claimRefs: [CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Financing history and disclosed scale
    body: >-
      The strongest independent financing record is TechCrunch's report of a $150 million
      Series C announced on May 24, 2022, led by SoftBank Latin America Fund, at a $1.1
      billion valuation. TechCrunch also reports more than $240 million of cumulative
      funding since inception, a $60 million Series B six months earlier, and a $16
      million Series A in July 2021. Aggregator records broadly corroborate the round
      sequence and investor list, but differ on round counting and total capital: Clay
      reports $242.6 million over eight rounds, while Multiples reports $240 million over
      six rounds. These discrepancies are not safely resolvable from the assigned
      evidence and should not be collapsed into a single precise total. TechCrunch
      reported more than 500 employees and 10 active offices in seven countries in 2022,
      while a 2023 secondary article reported 950 employees; the 2026 assigned sources
      do not independently refresh headcount. Current valuation, revenue, margin,
      customer concentration, debt, and preference-stack terms remain open.
    claimRefs: [CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: milestones-and-open-diligence
    title: Milestones, transition, and unresolved questions
    body: >-
      The company moved from a 2018 founding and 2019 accelerator entry to seed funding,
      successive 2021 rounds, and the 2022 unicorn financing, then expanded its physical
      footprint and financing-related product set. The 2023 report of a Miami office and
      the 2026 interview's description of a CEO relaunch show continued strategic
      repositioning, but they do not establish that historical expansion targets were
      achieved or that the 2022 valuation remains current. The 2026 interview describes
      automation of quoting and shipment-status workflows, while also acknowledging the
      need for guardrails, customer-specific calibration, and deterministic responses;
      this is a product and execution ambition, not evidence of realized unit economics.
      An assigned adverse page is titled “Why Nowports Failed: Unit Economics,” but its
      fetched body contains only the title and no analyzable operating evidence. It is
      therefore recorded as a source-review signal, not as proof of failure. The core
      next diligence asks are current audited or management financials, cap-table and
      preference terms, board minutes or roster, verified headcount and locations, and
      customer/cohort economics.
    claimRefs: [CO016, CO017, CO018, CO019]
    figureRefs: [FO001]
