callouts:
  - calloutType: strength
    title: Founder-market fit and financing access
    body: Founders combine direct freight-forwarding experience with a documented progression from Y Combinator to a $150M Series C led by SoftBank Latin America Fund.
    claimRefs: [CO007, CO011]
  - calloutType: risk
    title: Current scale and economics are opaque
    body: Public sources disagree on cumulative funding and historical headcount, while current revenue quality, margins, customer concentration, cap-table terms, and governance composition remain unresolved.
    claimRefs: [CO013, CO014, CO015, CO019]
  - calloutType: insight
    title: Relaunch raises execution questions
    body: The 2026 CEO return and AI-led operating reset may improve productivity, but the assigned evidence does not yet demonstrate realized unit economics or reliable automation at scale.
    claimRefs: [CO008, CO016, CO017]
