chapter:
  number: 5
  title: Product & Technology
  summary: Nowports combines freight execution with a customer-facing visibility and documentation layer, plus financing and insurance adjacencies. The public record supports a concrete workflow product and broad operating footprint, but provides limited independently verified evidence on reliability, security controls, technical architecture, and the maturity of its newer automation claims.
sections:
  - id: delivered-product
    title: Delivered product and customer workflow
    body: >-
      Nowports is a digital freight forwarder that executes ocean, air, and ground
      movements for importers and exporters rather than selling software in isolation.
      Its current official surface describes quote-led service, space coordination,
      drayage and cross-border ground transport, cargo insurance, cashback, and
      Mexico-specific financing. The workflow layer is explicit: a shipper can see
      an estimated arrival, track movements, access centralized bills and permits,
      and receive ETA or document-change alerts. Independent descriptions are
      directionally consistent, describing freight movement plus shipment tracking,
      insurance, and trade financing, while TechCrunch reported that the company
      uses software to track freight from ports to destinations across Latin America.
      This is a managed logistics product with a digital control surface, so the
      buyer's outcome depends on both interface quality and physical execution by
      carriers, agents, customs providers, and Nowports personnel.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture, integrations, and maturity
    body: >-
      The observable architecture is a layered operating model rather than a
      disclosed software stack. At the customer layer, the platform presents a
      shipment map, status reports, documentation, invoices, payments, and alerts.
      At the execution layer, Nowports coordinates ocean FCL/LCL, air cargo, truck
      and container drayage, border crossing, and customs brokerage. At the network
      layer, it relies on shipping lines, airlines, trucking and rail providers,
      agent networks, and stated connections to more than 90 countries and 200
      strategic partners. The official site lists WCA, IATA, and Pangea credentials,
      but those affiliations do not by themselves prove uptime, data-integrity
      controls, API coverage, or end-to-end service levels. TechCrunch reported
      management's intent to invest in engineering and referenced AI, big data, and
      IoT, while a later executive account described AI applied to prospecting,
      pricing, and finance processes. Those are roadmap or management claims, not
      independently measured technical performance.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-risk
    title: Differentiation, controls, and diligence limits
    body: >-
      The defensible proposition is workflow integration around a difficult
      cross-border process: shipment visibility, documentation, freight execution,
      insurance, and financing are presented in one customer relationship. The
      company also claims network breadth of more than 90 connected countries and
      more than 200 strategic partners, while historical coverage reported 10x
      growth in containers shipped and customers served in the first quarter of
      2022. These indicators show ambition and operating breadth, but they do not
      establish retention, incident rates, gross service margins, or technical
      differentiation. The public material does
      not disclose a detailed architecture, security program, privacy posture,
      recovery objectives, integration documentation, or independently audited
      reliability metrics. A diligence process should therefore test controls at
      the points where software meets third parties: booking and status data,
      document permissions, financing decisions, insurance claims, customs
      records, and exception escalation. The later leadership handover and stated
      focus on stronger markets also make continuity of product ownership and
      regional support an open implementation question.
    claimRefs: [CE006, CE010, CE011, CE012, CE013, CE014]
