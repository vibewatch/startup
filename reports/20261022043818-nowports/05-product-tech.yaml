      - ["Close the month", "Manual invoice and payment reconciliation", "Invoices, payments, and cashback balance per operation", "Official site presents accounting-ready status", "No independently verified reconciliation time or error rate"]
      - ["Fund imports", "Pay suppliers before customer cash collection", "Mexico financing with payment up to 120 days later", "Official site states approval on cargo already moved", "Credit losses, reserves, and partner economics undisclosed"]
