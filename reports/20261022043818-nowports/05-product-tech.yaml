callouts:
  - calloutType: strength
    title: Integrated workflow wedge
    body: The strongest supported product advantage is the combination of managed freight execution and a shared visibility, documentation, insurance, and financing workflow.
    claimRefs: [CE001, CE002, CE005]
  - calloutType: risk
    title: Technical proof remains thin
    body: Public sources describe features and management intentions, but do not provide independent evidence for security controls, reliability, integration depth, or automation performance.
    claimRefs: [CE008, CE012, CE013]
