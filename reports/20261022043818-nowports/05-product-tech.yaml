  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - [Customer interface, "Quote, map, ETA, alerts, documents, reports", "Platform data and customer identity", "Availability, permissions, and usability under disruption"]
      - [Shipment data, "Status, movement, invoice, and document records", "Carrier, agent, customs, and internal updates", "Data freshness, reconciliation, and provenance"]
      - [Execution network, "Ocean, air, ground, rail, and brokerage fulfillment", "External carriers and strategic partners", "Partner failure, handoffs, and exception escalation"]
      - [Financial adjacency, "Cashback and Mexico import financing", "Credit approval, capital, and repayment workflows", "Loss reserves, compliance, and concentration"]
      - [Risk-transfer adjacency, "Cargo insurance alongside shipment", "International suppliers and policy administration", "Claims handling, exclusions, and customer recourse"]
      - [Automation layer, "AI discussed for prospecting, pricing, and finance", "Training data, human review, and process controls", "No public benchmark, model governance, or error budget"]
    notes: "This is an evidence-bounded operating model assembled from disclosed product functions; it is not a claim that Nowports has published this exact internal architecture."
    claimRefs: [CE005, CE007, CE008, CE009, CE013]
