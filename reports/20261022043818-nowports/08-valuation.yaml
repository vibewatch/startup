  - calloutType: risk
    title: Thesis-break trigger
    body: A down-round, materially worsening financing losses, sustained customer or container contraction, or an unreconciled revenue-to-cash bridge would invalidate the platform-growth thesis.
    claimRefs: [CV014, CV017]
  - calloutType: assumption
    title: Valuation discipline
    body: No precise current valuation range is presented because the retained evidence does not disclose current revenue quality, margins, retention, or capitalization terms.
    claimRefs: [CV009, CV013]
