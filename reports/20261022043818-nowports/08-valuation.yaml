company:
  name: Nowports
chapter:
  number: 8
  title: Valuation
  summary: "Public evidence anchors Nowports to a $1.1B Series C valuation in May 2022, but current revenue, margins, retention, financing-book performance, and cap-table terms remain insufficiently disclosed for a current price call. The evidence supports research-more rather than a buy: the operating platform and historical growth are credible, while stale marks and opaque unit economics leave substantial downside uncertainty."
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      Nowports has a credible strategic asset in a difficult market: TechCrunch describes a
      digital freight-forwarding platform that expanded from shipment visibility into insurance
      and inventory financing, while the company reported more than 12x year-over-year revenue
      growth and 10x growth in containers shipped and customers served in the first quarter of
      2022. The same source reported operations in seven countries and more than 500 employees
      at the time of the Series C. This supports a thesis that Nowports can combine logistics
      workflow, data, and adjacent financial products into a regional platform rather than a
      single forwarding feature. The anti-thesis is valuation-sensitive: the $1.1B mark was set
      in May 2022, and the available current-looking databases still repeat that historical mark
      while disagreeing on headcount, funding-round count, and total capital. A private
      investor therefore cannot underwrite present value from the old mark without updated
      revenue quality, gross margin, customer retention, financing losses, and preference terms.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV009]
    tableRefs: [TV001, TV002]
  - id: financing-and-price
    title: Financing context and entry discipline
    body: >-
      The financing record is clear on the central event but not fully consistent at the edges.
      TechCrunch, Tracxn, Clay, and the valuation databases all identify a $150M Series C in May
      2022 at a $1.1B valuation, following a $60M Series B in late 2021. TechCrunch says total
      funding exceeded $240M, while Tracxn reports $243M over five rounds and Clay reports
      $242.6M over eight rounds; Latka reports $242.7M across six rounds. These differences are
      not immaterial for cap-table reconstruction, but they do not change the conclusion that
      the last disclosed institutional price is old. The appropriate entry discipline is to
      require a current primary or investor-verified mark, a fully diluted capitalization table,
      liquidation preferences, debt or warehouse facilities, and a bridge from gross bookings or
      freight revenue to sustainable gross profit. Without that package, the historical unicorn
      label should be treated as a reference point, not a fair-value estimate.
    claimRefs: [CV006, CV007, CV008, CV009]
  - id: scenarios-and-comparables
    title: Scenarios, comparables, and downside
    body: >-
      A defensible scenario range must be driven by evidence that is not currently public. The
      bull case requires repeatable growth after the 2022 expansion, positive contribution
      economics in forwarding, controlled credit losses in inventory financing, and retention
      strong enough to support a software-like revenue multiple. The base case assumes a real
      regional logistics business with meaningful customer value but lower margins and a multiple
      closer to freight-forwarding economics; it requires a current revenue and gross-profit
      bridge. The bear case is a down-round or impaired-equity outcome if freight spreads compress,
      working-capital or financing losses rise, or the platform cannot convert historical growth
      into durable cohorts. Multiples.vc lists illustrative public and private comparables but
      leaves Nowports' own revenue and EBITDA blank, while Startup Autopsy labels its page “Why
      Nowports Failed: Unit Economics” without providing a substantive fetched analysis. That
      adverse signal increases the need for direct diligence; it is not proof of failure.
    claimRefs: [CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
  - id: recommendation-and-diligence
    title: Recommendation and thesis-break tests
    body: >-
      The recommendation is research-more with medium confidence and a high risk rating. The
      company has enough corroborated evidence of historical financing, product breadth, and
      commercial expansion to avoid an avoid call, but the public record does not support a
      current attractive or fair valuation stance. A price-sensitive decision should be deferred
      until management or lead investors provide current revenue, gross margin, contribution
      margin by product, customer concentration, net retention, financing-book delinquency and
      reserves, cash runway, debt and preference terms, and any secondary or down-round evidence.
      Thesis-break tests are measurable: a current mark materially below $1.1B without operating
      improvement, a material rise in credit losses or working-capital needs, sustained customer
      or container contraction, or inability to reconcile reported revenue with cash collections
      would move the call toward avoid. Conversely, independently verified growth with improving
      margins and clean financing performance could support a re-rating.
    claimRefs: [CV013, CV015, CV016, CV017]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - ["Recommendation", "research-more", "Defer a price commitment until current operating and capitalization evidence is verified."]
      - ["Confidence", "medium", "Historical financing and product evidence are corroborated, but current metrics are sparse or estimated."]
      - ["Risk rating", "high", "Private-company opacity, stale valuation, and financing/working-capital exposure widen downside uncertainty."]
      - ["Valuation stance", "unknown", "Do not treat the May 2022 $1.1B mark as current fair value."]
    notes: >-
      Assessment is based on the retained public evidence as of 2026-10-22; “unknown” reflects
      missing current price and operating inputs rather than a zero value.
    claimRefs: [CV001, CV006, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Argument, Evidence boundary, What would change the view]
    rows:
      - ["Thesis", "Nowports combines freight execution with tracking, insurance, and inventory financing.", "The retained product evidence is historical and does not disclose current product-level margins.", "Current product mix, contribution margin, and attach-rate evidence would show whether the platform has durable economics."]
      - ["Thesis", "Historical growth and multi-country expansion indicate that the platform achieved meaningful regional scale.", "The growth figures were company-reported in 2022, while the 2023 headcount figure came from a promotional publication.", "Audited 2024-2026 revenue, shipment, customer, and retention cohorts would establish whether scale persisted."]
      - ["Anti-thesis", "The May 2022 $1.1B mark is too stale to serve as current fair value.", "Current-looking databases repeat the same historical financing event and disagree on total capital raised.", "A current arm's-length primary or secondary transaction with full terms would establish an entry reference."]
      - ["Anti-thesis", "Opaque unit economics and financing exposure could make software-like multiples inappropriate.", "The adverse page provides only a headline, and retained databases omit verified gross margin, EBITDA, and credit-loss data.", "Segmented gross profit, contribution margin, delinquency, reserves, and cash conversion would resolve the concern."]
    notes: >-
      Arguments synthesize historical reporting and current evidence gaps; the adverse headline is
      directional only and is not treated as proof that Nowports failed.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV009, CV014]
  - id: TV003
    title: Bull, base, and bear valuation logic
    columns: [Case, Operating assumptions, Valuation or return logic, Key risks and probability signal]
    rows:
      - [Bull, "Growth persists; forwarding contribution margins improve; financing losses remain controlled; retention is verified.", "A current mark could justify a premium to freight peers only after primary evidence supports software-like durability.", "Execution and credit risk remain; low-to-medium probability until current metrics are disclosed."]
      - [Base, "Regional freight platform remains useful but margins and retention are closer to logistics economics than pure software.", "A material discount to the old $1.1B mark is required until current revenue and gross profit are verified.", "Medium probability; consistent with the evidence gap and mixed database disclosures."]
      - [Bear, "Freight spreads compress, working capital or financing losses rise, or cohorts contract.", "Down-round, impaired equity, or preference-driven residual value is plausible; no precise value is supportable.", "High severity; adverse signal is directional only and requires direct verification."]
      - [Decision gate, "Current price, revenue quality, margin, cohort, credit, and preference data are supplied.", "Move from research-more only if the evidence supports a current risk-adjusted return.", "Blocking diligence condition; probability cannot be quantified from public evidence."]
    notes: >-
      These are conditional decision scenarios, not a discounted-cash-flow or comparable-company
      valuation. No numeric range is invented because current revenue, margin, retention, and price inputs are unavailable or estimated.
    claimRefs: [CV011, CV012, CV013, CV014, CV017]
