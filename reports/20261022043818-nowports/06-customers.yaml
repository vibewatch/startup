      - ["Shippers / BCOs", "Customer-side stakeholder group", "Share booking and shipment data through connected workflows", "Stakeholder group; individual deployments not named", "Intended smoother interactions across the logistics journey", "No account count, retention, or implementation evidence"]
      - ["Carriers", "Supply-side stakeholder group", "Exchange operational data through the connectivity layer", "Stakeholder group; individual deployments not named", "Intended real-time data exchange and fewer manual errors", "No carrier coverage or transaction denominator"]
      - ["U.S.-Latin America trade customers", "Target expansion segment", "Miami office and cross-border commercial relationships", "Expansion surface described; named deployments not disclosed", "Potentially broadens access to regional trade flows", "No customer conversion, repeat-use, or revenue evidence"]
    notes: "This is a partial public-proof enumeration, not a complete customer list; stakeholder groups and expansion targets are not equivalent to named production customers."
    claimRefs: [CU004, CU011, CU012, CU013, CU014]
