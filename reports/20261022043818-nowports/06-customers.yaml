chapter:
  number: 6
  title: Customers
  summary: Nowports publicly targets Latin American importers and exporters, especially SMEs, and its evidence shows a logistics workflow spanning freight, visibility, insurance, financing, and data connectivity. Public proof is stronger for market reach, named partners, and historical growth than for current retention, recurring usage, customer concentration, or cohort durability.
sections:
  - id: buyer-and-use-case-segments
    title: Buyer, user, and use-case segments
    body: >-
      Nowports is positioned as a B2B digital freight forwarder for Latin American importers and exporters, with particular emphasis on small and midsize enterprises. The customer job is not only booking transport: public descriptions combine ocean, air, and ground freight with shipment tracking, cargo insurance, trade financing, customs-related support, and documentation. That bundle points to a buyer who values execution certainty and working-capital support, while operations, procurement, and finance are likely different user groups; the public evidence does not identify their buying authority or contract economics. The geography is regional rather than single-country: sources describe offices or activity across Mexico, Brazil, Chile, Colombia, Peru, Panama, Uruguay, and a Miami expansion. The segmentation table therefore distinguishes explicit customer segments from inferred workflow roles and marks the missing revenue and utilization denominators rather than treating a broad regional footprint as proof of adoption.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: The strongest public adoption signal is historical operating growth, not a current customer-retention series. TechCrunch reported that in the first quarter of 2022 Nowports said revenue increased by more than 12x year over year and containers shipped and customers served grew 10x year over year; those are company-reported comparisons from a defined period, not current 2026 levels, audited revenue, or net retention. A 2025 connectivity partnership adds evidence that the platform was integrating bookings, tracking, and electronic documents with shippers, carriers, and operational systems, but it does not disclose customer counts or production volume. Nowports’ own 2026 article describes customers prioritizing space, delivery times, alternatives, and responsiveness during freight volatility. Retention, renewal, repeat purchase, churn, GRR/NRR, cohort payback, and active-account denominators remain unverified and should be requested before using historical growth as a durability proxy.
    claimRefs: [CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-expansion-risk
    title: Named proof, expansion, and concentration risk
    body: >-
      Public named-customer proof is limited. The Coneksion announcement names Nowports as its customer or platform partner and describes connectivity with shippers, carriers, and other operational systems, but it does not name the shippers or disclose deployment volumes, commercial terms, or outcome measurements. The evidence supports a partner-enabled operating workflow and regional expansion ambitions, including a Miami office intended to connect U.S. and Latin American trade, but logos, offices, investor backing, and employee counts do not establish production deployments or durable customer expansion. The main commercial diligence risk is therefore measurement opacity: no public top-customer share, customer concentration, renewal schedule, contract length, or channel dependence was found in the assigned evidence. A customer export by cohort, geography, use case, gross margin, and renewal status is needed to test whether the platform has repeatable land-and-expand economics.
    claimRefs: [CU004, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
callouts:
  - calloutType: strength
    title: Workflow breadth is customer-relevant
    body: Nowports’ public proposition spans freight execution, visibility, documentation, insurance, financing, and connectivity rather than a single tracking feature, which can increase the number of operational pain points addressed for an importer or exporter.
    claimRefs: [CU002, CU007, CU008]
  - calloutType: risk
    title: Retention and concentration are unresolved
    body: Historical growth and partner evidence do not substitute for current cohorts, renewal metrics, active-account denominators, or customer concentration data; these gaps limit confidence in durability and expansion.
    claimRefs: [CU009, CU010, CU014]
