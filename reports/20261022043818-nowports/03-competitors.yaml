callouts:
  - calloutType: risk
    title: Competitive proof is not procurement proof
    body: >-
      One assigned comparison source explicitly labels its output AI-generated
      and not independently verified, while the source pool lacks matched peer
      product pages and contracts. Named competitors and database scores should
      guide diligence, not substitute for buyer references and route-level bids.
    claimRefs: [CP004, CP005]
  - calloutType: recommendation
    title: Underwrite a regional execution advantage, not a software monopoly
    body: >-
      Treat the logistics-finance bundle and Latin America footprint as the
      working differentiation thesis, then test retention, multi-homing,
      exclusive capacity, service levels, and matched landed cost before
      assigning durable moat value.
    claimRefs: [CP006, CP010, CP016]
