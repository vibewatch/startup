evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Current revenue, gross margin, contribution margin, operating margin, and cash-burn data.
    whyItMatters: >-
      Freight-forwarding gross economics and financing exposure determine whether the historical valuation is
      supportable.
    diligencePath: Request 2024-2026 management accounts, unit-economics bridge, cash forecast, and lender or auditor materials.
    relatedQuestionRefs:
      - QO007
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete current executive roster, board composition, ownership, preference stack, and secondary pricing.
    whyItMatters: The CEO relaunch and large venture financing make control, succession, and investor economics material to risk.
    diligencePath: Obtain the current cap table, charter, investor-rights agreements, board roster, and latest financing documents.
    relatedQuestionRefs:
      - QO004
      - QO006
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: scale
    missingEvidence: Independently refreshed 2026 headcount, active customers, locations, shipment volumes, and revenue.
    whyItMatters: Available scale figures are from 2022-2023 or company claims without consistent denominators.
    diligencePath: >-
      Request a dated KPI pack with definitions, cohort views, customer concentration, and location-level operating
      metrics.
    relatedQuestionRefs:
      - QO007
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: >-
      Substantive independent reporting or filings that test unit economics, litigation, regulatory status, or
      financing-book performance.
    whyItMatters: The only assigned adverse page exposes a title but no analyzable claim-level evidence.
    diligencePath: >-
      Run targeted legal, regulatory, lender, customer-reference, and restructuring searches during the next evidence
      refresh.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      A transparent, current source that defines the Latin American freight-forwarding market, the company-relevant SAM,
      and a lane-level SOM.
    whyItMatters: Published regional and country estimates use different scopes and cannot establish Nowports' attainable share.
    diligencePath: >-
      Request management's lane-by-lane market model with shipment volumes, eligible shipper segments, geography, and
      take-rate assumptions.
    relatedQuestionRefs:
      - QM004
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Current gross freight billings, net revenue, contribution margin, financing attach, and repeat-customer cohorts.
    whyItMatters: The market can be large while a broker's economics remain low-margin and cyclical.
    diligencePath: >-
      Obtain monthly cohort and lane economics for the latest 24 months, separating freight, customs, insurance, and
      financing.
    relatedQuestionRefs:
      - QM008
      - QM009
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: Methodology and denominator reconciliation for the $18.7B, $38.65B, $12.62B, and nearly $40B references.
    whyItMatters: Different geography, year, and gross/net definitions can materially change the implied opportunity.
    diligencePath: Cross-check each cited estimate against the original analyst methodology and normalize geography and currency.
    relatedQuestionRefs:
      - QM003
      - QM010
    relatedTableRefs:
      - TM002
  - type: stale
    severity: material
    topic: adoption
    missingEvidence: >-
      Post-2022 shipment growth, customer retention, current active-country footprint, and current buyer budget
      evidence.
    whyItMatters: The strongest public growth evidence is historical and may not represent the 2026 operating market.
    diligencePath: Request refreshed operating KPIs and independent customer references covering 2024-2026.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: commercial-model
    missingEvidence: >-
      Matched route quotes, rate cards, contract duration, minimum volumes, discounts, surcharges, credit pricing, and
      realized take rates for Nowports and named alternatives.
    whyItMatters: >-
      Without normalized commercial terms, diligence cannot determine whether the bundle wins on landed cost,
      convenience, financing, or service.
    diligencePath: >-
      Request anonymized contracts and run a controlled bid across identical lanes, modes, shipment sizes, insurance
      terms, and payment timing.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Customer cohorts, gross and net retention, share of wallet, multi-homing rates, switching events, exclusive
      capacity, and contract-level renewal terms.
    whyItMatters: >-
      These data determine whether regional operating knowledge and integrated services create durable lock-in or merely
      a replicable convenience layer.
    diligencePath: >-
      Review cohort exports and contracts, then interview churned and retained customers about alternative providers and
      switching effort.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Current monthly revenue by freight, visibility, insurance, and financing streams, with gross-versus-net
      recognition policy.
    whyItMatters: >-
      Historical growth does not show whether revenue is recurring, high quality, or profitable after pass-through
      freight costs.
    diligencePath: >-
      Request the latest 24-month monthly P&L, revenue-recognition memo, customer cohort revenue, and shipment-level
      gross-profit bridge.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, burn, runway, debt, warehouse facilities, and financing-book reserve and delinquency data.
    whyItMatters: Funding raised is not cash available, and customer financing may create material liquidity and credit exposure.
    diligencePath: >-
      Request bank statements, cash-flow forecast, debt schedule, facility covenants, receivables aging, default
      history, and reserve methodology.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cost-structure
    missingEvidence: Current carrier, personnel, service-delivery, and working-capital cost schedules by revenue stream.
    whyItMatters: Without cost attribution, public growth cannot establish gross margin or contribution profit.
    diligencePath: Request monthly cost-center detail and a shipment-level margin bridge reconciled to the P&L.
    relatedQuestionRefs:
      - QI005
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: Independent customer-level evidence on pricing, retention, concentration, and service-delivery economics.
    whyItMatters: Public activity metrics cannot distinguish durable customer value from capital-intensive volume growth.
    diligencePath: >-
      Obtain anonymized cohort tables, top-customer concentration, churn and NRR, CAC by segment, sales cycle, and
      customer references.
    relatedQuestionRefs:
      - QI004
      - QI009
    relatedTableRefs:
      - TI003
  - type: access-blocked
    severity: material
    topic: adverse
    missingEvidence: Substantive independent analysis testing the adverse unit-economics signal.
    whyItMatters: >-
      The available adverse page title indicates a potential failure mode but does not provide evidence for its
      conclusion.
    diligencePath: >-
      Obtain the underlying analysis or independently test lane-level contribution margin, financing losses, and cash
      conversion.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: controls
    missingEvidence: Independent security, privacy, reliability, and integration documentation for the customer platform.
    whyItMatters: >-
      The product sits on operational, document, and financing data, so control failures could impair customer trust and
      create financial or compliance losses.
    diligencePath: >-
      Request SOC 2 or equivalent reports, penetration-test summaries, uptime and incident history, API documentation,
