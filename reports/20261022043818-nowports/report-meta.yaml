companyProfile:
  summary: >-
    Nowports is a Monterrey-founded private logistics company that digitizes international freight forwarding for Latin
    American trade. Its public product footprint spans ocean, air, and land transport, shipment tracking and
    documentation, cargo insurance, and inventory-financing services, while the current scale and economics of those
    offerings are not publicly established.
