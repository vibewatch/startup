company:
  name: Nowports
chapter:
  number: 7
  title: Risks
  summary: >-
    Nowports has a broad logistics-and-fintech ambition, but public evidence points to
    execution, margin, carrier-dependence, regional, and disclosure risks that remain
    material at the last disclosed unicorn valuation. The most decision-relevant gaps are
    current unit economics, financing-book performance, customer concentration, and
    measurable reliability or compliance controls.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis-break conditions
    body: >-
      The central risk is not whether demand for digitized freight exists; it is whether
      Nowports can convert a capital-intensive, carrier-dependent service into a resilient
      and profitable operating system. Independent coverage describes digital freight
      forwarding as a sector that still lacks transparency and efficiency, while a 2026
      strategic assessment characterizes the company as facing operational scaling
      challenges, margin pressure from incumbents, and LatAm volatility. The risk register
      therefore ranks execution and margin risk above generic market risk. A low-reputation
      "Startup Autopsy" page labels the company a unit-economics failure, but its fetched
      text supplies no supporting analysis; this is an adverse diligence lead, not proof.
      A thesis break
      would be visible in sustained shipment or customer deterioration, a failure to hold
      contribution margins after carrier-price changes, or a liquidity event before
      updated financial disclosure is available. These are monitoring criteria rather than
      claims that any trigger has already occurred.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal, regulatory, and financial-model exposure
    body: >-
      Nowports operates across multiple Latin American jurisdictions and combines freight
      forwarding with insurance and inventory financing. That combination increases the
      number of licenses, counterparties, data-handling obligations, and credit controls
      that must work together. The public record reviewed here does not establish a
      current enforcement action or a quantified financing-book loss; that absence is an
      evidence gap, not proof of a clean record. The financing product also introduces
      underwriting, collections, fraud, reserve, and working-capital risks that are not
      answered by the company's historical growth narrative. The appropriate diligence
      path is jurisdiction-by-jurisdiction authorization evidence, current complaints or
      litigation searches, and portfolio-level delinquency and loss data.
    claimRefs: [CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: operations-dependencies
    title: Operational, partner, and disclosure dependencies
    body: >-
      The operating model is exposed to events outside Nowports' direct control: ocean,
      air, and land carrier capacity and pricing, port disruptions, fuel costs, customs
      processes, geopolitical shocks, and the reliability of third-party data. The
      company's 2022 expansion plan also tied risk reduction to hiring and technology
      build-out, which creates a scaling-control question rather than a completed
      mitigation. More recent coverage says the company is emphasizing risk management
      and market intelligence, but it supplies no current reliability, margin, customer
      concentration, or incident KPI. Investors should treat operational resilience as
      unproven until service-level, claims, carrier concentration, and incident data are
      provided for the current period.
    claimRefs: [CR010, CR011, CR013, CR014]
    tableRefs: [TR003]
  - id: diligence-actions
    title: Mitigations and diligence asks
    body: >-
      The public mitigation signals are directionally sensible: cargo insurance and risk
      services can reduce customer exposure, shipment-history data can support financing
      decisions, and platform investment can improve visibility. They are not yet evidence
      of mitigation maturity. Before underwriting a refreshed investment view, request
      current gross and contribution margin by service, carrier and route concentration,
      on-time and exception rates, insurance claims, financing delinquency and reserves,
      regulatory permissions, security incidents, customer churn and concentration, and
      liquidity runway. The decisive test is whether these controls operate at scale
      without requiring continued venture funding to subsidize low-margin freight volume.
    claimRefs: [CR015, CR016, CR018]
callouts:
  - calloutType: risk
    title: Highest-risk unresolved issue
    body: >-
      The last public financing milestone is historical, while current profitability,
      financing-book quality, customer durability, and operational-control metrics remain
      undisclosed. Treat the valuation and liquidity downside as open until those records
      are refreshed.
    claimRefs: [CR005, CR008, CR014]
  - calloutType: recommendation
    title: Monitoring rule
    body: >-
      Do not clear the risk case on logos, funding, or historical growth alone; require
      route-level economics, service reliability, and financing-loss evidence.
    claimRefs: [CR015, CR018]
tables:
  - id: TR001
    title: Severity-ranked risk register
    columns: [Risk, Likelihood, Impact, Mitigation maturity, Residual exposure, Thesis-break monitor]
    rows:
      - [Margin and profitability compression, high, high, emerging, high, "Contribution margin falls after carrier-price changes"]
      - [Operational scaling and service quality, high, high, partial, high, "On-time or exception rates deteriorate at higher volume"]
      - [Carrier and port dependency, medium, high, partial, high, "Capacity or price shock cannot be passed through"]
      - [Regional and geopolitical volatility, medium, high, emerging, medium-high, "Route disruption or customs delay persists"]
      - [Financing and liquidity model, medium, high, unknown, high, "Delinquency, reserves, or runway breach agreed thresholds"]
    notes: >-
      Risk ordering is an analytical prioritization from the cited public evidence; likelihood,
      residual exposure, and trigger wording are diligence judgments, not disclosed company
      probabilities. Null or unknown control metrics require management evidence.
    claimRefs: [CR001, CR002, CR003, CR004, CR008, CR010, CR011]
  - id: TR002
    title: "Regulatory / legal risk register"
    columns: [Rule or exposure, Jurisdiction or scope, Public status, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["Freight-forwarding and customs compliance", "Multi-country LatAm operations", "Current permissions not established in pool", high, "Confirm local licenses and customs controls", high, "Obtain entity and authorization matrix"]
      - ["Cargo insurance obligations and claims handling", "Cross-border shipments", "Product described but current claims record unavailable", medium-high, "Review policy and claims governance", medium-high, "Obtain policy forms and three-year claims data"]
      - ["Inventory-financing credit and collections", "Customers using financing", "Product described but delinquency and reserves unavailable", high, "Underwriting uses shipping history", high, "Obtain vintage loss and reserve schedules"]
      - ["Privacy, security, and third-party data", "Platform and logistics integrations", "No current incident or certification evidence retained", medium-high, "Review security program and vendor controls", medium-high, "Obtain SOC or equivalent evidence and incident log"]
    enumerationScope:
      coverage: partial
      basis: >-
        Public-source review of disclosed products and operating footprint through the
        2026-10-22 run date; it is not a complete legal-register enumeration.
    notes: >-
      This is a partial public-source register. “Not established” and “unavailable” mean
      the assigned evidence pool did not verify the item; they do not establish noncompliance
      or an incident.
    claimRefs: [CR006, CR007, CR008, CR009, CR016]
  - id: TR003
    title: Partner, dependency, and control register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation signal, Residual exposure, Required evidence]
    rows:
      - ["Ocean and air carriers", "Capacity and pricing suppliers", "Capacity shortage or price increase compresses margin", high, "Volume and platform coordination", high, "Route-level carrier concentration and pass-through data"]
      - ["Land carriers and local operators", "Regional delivery partners", "Service failure or partner outage damages customer experience", high, "Strategic carrier partnerships described in secondary material", medium-high, "Partner SLAs and failure history"]
      - ["Ports and customs networks", "Infrastructure and authorities", "Congestion or customs disruption delays shipments", high, "Market-intelligence and risk-management emphasis", high, "Exception-rate and recovery-time history"]
      - ["Financing and insurance counterparties", "Capital and risk partners", "Credit, claims, or liquidity mismatch", high, "Embedded products intended to diversify revenue", high, "Counterparty limits and loss-sharing terms"]
      - ["Engineering and operating talent", "Internal execution capacity", "Hiring fails to keep pace with geographic and product complexity", medium-high, "Capital plan emphasized engineering hiring", medium-high, "Current headcount, attrition, and delivery metrics"]
    notes: >-
      Counterparties are described by role because the assigned sources do not provide a
      complete current supplier or partner roster. The table separates dependency exposure
      from proof that a mitigation is effective.
    claimRefs: [CR004, CR010, CR011, CR013]
