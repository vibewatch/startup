  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-size
      missingEvidence: "A transparent, current source that defines the Latin American freight-forwarding market, the company-relevant SAM, and a lane-level SOM."
      whyItMatters: "Published regional and country estimates use different scopes and cannot establish Nowports' attainable share."
      diligencePath: "Request management's lane-by-lane market model with shipment volumes, eligible shipper segments, geography, and take-rate assumptions."
      relatedQuestionRefs: [QM004, QM010]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: "Current gross freight billings, net revenue, contribution margin, financing attach, and repeat-customer cohorts."
      whyItMatters: "The market can be large while a broker's economics remain low-margin and cyclical."
      diligencePath: "Obtain monthly cohort and lane economics for the latest 24 months, separating freight, customs, insurance, and financing."
      relatedQuestionRefs: [QM008, QM009]
    - type: conflicting-data
      severity: minor
      topic: market-size
      missingEvidence: "Methodology and denominator reconciliation for the $18.7B, $38.65B, $12.62B, and nearly $40B references."
      whyItMatters: "Different geography, year, and gross/net definitions can materially change the implied opportunity."
      diligencePath: "Cross-check each cited estimate against the original analyst methodology and normalize geography and currency."
      relatedQuestionRefs: [QM003, QM010]
      relatedTableRefs: [TM002]
    - type: stale
      severity: material
      topic: adoption
      missingEvidence: "Post-2022 shipment growth, customer retention, current active-country footprint, and current buyer budget evidence."
      whyItMatters: "The strongest public growth evidence is historical and may not represent the 2026 operating market."
      diligencePath: "Request refreshed operating KPIs and independent customer references covering 2024-2026."
      relatedQuestionRefs: [QM009]
