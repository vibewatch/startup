schemaVersion: "report-v2"
artifact: market-analysis
slug: nowports
runDate: 2026-10-22
company:
  name: Nowports
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Nowports operates in a large but operationally fragmented Latin American freight-forwarding
    market, combining forwarding with visibility, customs, insurance, and financing. Public
    evidence supports a substantial opportunity and identifiable buyer pain, but does not isolate
    a defensible SAM or SOM, nor prove that the company's financing layer has converted market
    potential into durable net take-rate.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      The relevant market is cross-border freight forwarding for Latin American importers and
      exporters, with the physical unit usually a shipment or container and the service spanning
      ocean, air, and selected ground movements. Nowports adds shipment visibility, customs
      coordination, cargo insurance, and inventory financing around that core. This boundary
      excludes carrier-owned transport capacity, pure domestic parcel delivery, and generic
      enterprise software sold without freight execution. The status quo is not a single
      incumbent: it is a fragmented network of local forwarders, customs agents, carriers, and
      manual email, WhatsApp, and PDF workflows. That fragmentation creates a credible software
      wedge, but it also leaves pricing, service quality, and gross-versus-net revenue difficult
      to compare.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and what remains unproven
    body: >-
      Available estimates are useful as reference points, not as interchangeable TAM, SAM, and
      SOM layers. One current third-party analysis cites an $18.7 billion Latin American
      freight-forwarding market in 2026 and a $38.65 billion 2035 forecast, while also citing a
      separate $12.62 billion Mexican market forecast to 2031. Another source describes nearly
      $40 billion of annual freight handled into the region, but the definition and gross-versus-
      net basis are not the same. The evidence therefore supports a sizeable addressable category
      but not a precise Nowports serviceable market. No retained source isolates Nowports' lanes,
      eligible shipper segment, take-rate, or attainable share. Valuation relevance depends on
      whether financing attach and customs density lift net economics above brokerage.
    claimRefs: [CM004, CM005, CM006, CM007]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-segments
    title: Buyers, users, and budget ownership
    body: >-
      The primary economic buyer is the importer or exporter that owns landed-cost, working-
      capital, and service-level outcomes; logistics, procurement, and trade-operations staff are
      the daily users. SMEs are repeatedly identified as an initial target, while the operating
      model also reaches mid-market shippers in agriculture, manufacturing, retail, and food.
      Freight spend is normally a logistics or supply-chain budget, customs fees sit with trade
      operations, and inventory financing is a treasury or working-capital decision. Adoption is
      triggered by unreliable visibility, manual coordination, delayed cargo, or a cash gap
      between paying suppliers and collecting from customers. A multi-product sale can increase
      wallet share, but it also introduces underwriting, insurance, and local execution
      dependencies that a software-only buyer would not face.
    claimRefs: [CM008, CM009, CM010]
    tableRefs: [TM003]
  - id: adoption-drivers-constraints
    title: Adoption drivers, constraints, and diligence implications
    body: >-
      Digitization is supported by a clear operational pain point: sources describe fragmented
      forwarding, opaque handoffs, delays, and the pandemic-era visibility shock. Nowports'
      potential adoption drivers are a single workflow, shipment data, local customs capability,
      and financing linked to trade history. Constraints are equally material: freight is
      cyclical, service delivery depends on carriers and country-level agents, and incumbents
      have balance sheets, contracts, and enterprise relationships. Public reporting shows rapid
      historical growth, but current market penetration, customer concentration, contribution
      margin, financing origination, and post-2022 route economics remain unavailable in the
      retained evidence. The next diligence step is a lane-level bridge from gross freight
      billings to net revenue, contribution margin, financing attach, and repeat shipper cohorts.
    claimRefs: [CM011, CM012, CM013, CM014]
callouts:
  - calloutType: insight
    title: Market conclusion
    body: >-
      The category is large enough to support a regional platform thesis, but public market-size
      figures do not establish Nowports' serviceable share or valuation case.
    claimRefs: [CM004, CM006, CM014]
  - calloutType: risk
    title: Key constraint
    body: >-
      The central unresolved market question is whether financing and operational data create
      materially better net economics than a forwarding broker during a freight down-cycle.
    claimRefs: [CM012, CM013, CM014]
