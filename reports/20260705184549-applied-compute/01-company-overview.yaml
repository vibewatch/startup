callouts:
  - calloutType: risk
    title: Officer-title conflict signals limited governance disclosure
    body: >-
      Applied Compute's California Secretary of State filing lists Rhythm Garg as
      Chief Financial Officer and Secretary, while Comcast NBCUniversal LIFT Labs'
      investor portfolio page lists his title as Chief Technology Officer. Neither
      source is stale relative to the other, and no updated statement-of-officers
      filing was located to resolve the discrepancy, which suggests governance
      disclosure for this closely held startup is thinner than its $1.3 billion
      valuation might imply.
    claimRefs: [CO016, CO017]
  - calloutType: strength
    title: Fast, multiply-corroborated valuation step-up with blue-chip lead investors
    body: >-
      Applied Compute's valuation moved from roughly $100 million at its 2025 seed
      round to $1.3 billion at its April 2026 Kleiner Perkins-led Series B, a step-up
      corroborated by the company's own announcement, its legal counsel's press
      release, and an independent TechCrunch unicorn tracker citing PitchBook data,
      alongside named production deployments at DoorDash, Cognition, and Mercor.
    claimRefs: [CO018, CO024, CO025, CO028]
  - calloutType: risk
    title: No independent verification of revenue, ARR, or full customer count
    body: >-
      Every scale metric in this chapter beyond funding and valuation - customer
      count, headcount, and any revenue or ARR figure - is either limited to three
      named case studies or sourced entirely from third-party people-data
      estimators; no source reviewed in this pass carries a company-disclosed
      revenue or ARR figure to sanity-check the $1.3 billion valuation against.
    claimRefs: [CO041, CO037]
