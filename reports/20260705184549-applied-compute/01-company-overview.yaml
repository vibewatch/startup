company:
  name: Applied Compute
chapter:
  number: 1
  title: Company Overview
  summary: Applied Compute is a San Francisco-based enterprise AI startup founded in 2025 by three former OpenAI researchers, building "Specific Intelligence" agents trained on customer data; it reached a $1.3 billion valuation and $160 million in total disclosed funding after an April 2026 Kleiner Perkins-led round, on the strength of named deployments at DoorDash, Cognition, and Mercor.
sections:
  - id: identity-and-model
    title: Identity, headquarters, and business model
    body: >-
      Applied Compute, Inc. is an enterprise AI company that builds what it calls "Specific
      Intelligence": proprietary agents trained on a customer's own data and workflows,
      deployed into production within the customer's own environment, and continuously
      improved through reinforcement learning on real usage traces. Multiple sources
      corroborate a 2025 founding by three former OpenAI researchers, with independent
      reporting (TechStartups, Grokipedia) narrowing this to May 2025. California
      Secretary of State filing records and a Comcast NBCUniversal LIFT Labs portfolio
      page both place the company's headquarters in San Francisco, at 251 Rhode Island
      Street #207; the regulatory filing further confirms the entity was originally
      incorporated in Delaware and registered as a foreign stock corporation in
      California on October 10, 2025, under document number B20250336266. Commercially,
      Applied Compute's own product materials describe a three-part platform - Train,
      Serve, and Improve - covering post-training of tool-using agents on customer data,
      low-latency production inference in the harness the model was trained in, and
      continuous online reinforcement learning from production feedback. The company
      markets its stack as "model-flexible," letting customers swap in newer frontier
      base models later without rebuilding their harness, data pipeline, or deployment
      stack, and states that its own engineers embed directly with customer teams rather
      than outsourcing development. These are company-sourced claims not independently
      re-verified against a customer's internal engineering process in this pass.
    claimRefs: [CO003, CO004, CO006, CO007, CO008, CO009, CO001, CO002]
    figureRefs: [FO002]
  - id: leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      Applied Compute was co-founded by Yash Patil, Rhythm Garg, and Linden Li, all
      Stanford University alumni who left technical roles at OpenAI to start the
      company. Patil was a key member of OpenAI's agentic Codex software-engineering
      effort and serves as Applied Compute's CEO; Garg was a core contributor to
      OpenAI's o1, the first reinforcement-learning-trained reasoning model; and Li
      worked on ML systems and infrastructure for reinforcement-learning training.
      Officer titles are not fully reconciled across sources: Applied Compute's
      California Secretary of State filing lists Rhythm Garg as Chief Financial
      Officer and Secretary, with Yash Patil as the sole listed Chief Executive
      Officer and registered agent, while Comcast NBCUniversal LIFT Labs' investor
      portfolio page instead lists Garg's title as Chief Technology Officer and Linden
      Li as Chief Architect. This is a genuine, unreconciled conflict in the sources
      reviewed rather than an editorial choice, and it is itself a governance-disclosure
      signal worth flagging: no independent, dated statement-of-officers document was
      located to settle it. The company's own account states that two-thirds of its
      team are former startup founders, including former top AI researchers and Math
      Olympiad winners, and Lux Capital's portfolio profile adds that team alumni
      include OpenAI reinforcement-learning-infrastructure veterans alongside people
      from Scale AI, Together, Two Sigma, and Watershed. No named executive beyond the
      three co-founders (e.g., a separate general counsel or head of sales) appears in
      any source reviewed, which is itself a key-person-dependence signal roughly a
      year into the company's life.
    claimRefs: [CO012, CO013, CO014, CO015, CO016, CO017, CO010, CO011, CO043]
    tableRefs: [TO002]
  - id: funding-and-investors
    title: Funding history, valuation, and investor base
    body: >-
      Applied Compute's disclosed financing has moved in four public steps. Upstarts
      Media first reported, as an unannounced scoop, that the company had raised $20
      million at a $100 million valuation in a round led by Benchmark partner Victor
      Lazarte, with Sequoia, Conviction, Hanabi Capital, Definition, and solo investor
      Zach Frankel also participating; a separate secondary write-up (StartupsUnion)
      instead dates the same round to "June 2024," a full year earlier than the
      2025 founding corroborated elsewhere, an unreconciled and likely erroneous date
      that is reported here as-is rather than silently corrected. The Information then
      reported in approximately September 2025 that Applied Compute was in talks to
      raise at roughly a $500 million valuation, before the company emerged from
      stealth on October 29, 2025 with a publicly announced $80 million round from
      Benchmark, Sequoia, Lux Capital, Hanabi, Neo, Definition, Elad Gil, Victor
      Lazarte, and Omri Casspi; independent outlets placed the resulting valuation at
      roughly $700 million, a figure the company itself did not disclose at the time.
      By January 2026, The Information reported fresh talks at a $1.3 billion
      valuation, more than double the $500 million figure from three months earlier,
      which the company confirmed on April 8, 2026 with an $80 million Series B led by
      Kleiner Perkins (with Elad Gil, Lux, Greenoaks, Neo, and Hanabi continuing),
      bringing total disclosed funding to $160 million, per Applied Compute's own
      announcement and independently corroborated by TechCrunch citing PitchBook data.
      Latham & Watkins LLP served as Applied Compute's outside counsel on the April
      2026 round. Taken together, the valuation moved roughly 13x in under a year,
      a pace of escalation that is itself a diligence flag independent of the
      company's underlying fundamentals.
    claimRefs: [CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO029]
    tableRefs: [TO003]
  - id: scale-metrics-and-customers
    title: Scale, named customers, and cover-metric gaps
    body: >-
      Applied Compute names three enterprise customers across its own case studies and
      funding announcements: Cognition (maker of the Devin AI software engineer and the
      Windsurf IDE), DoorDash, and Mercor. With Cognition, Applied Compute co-developed
      "SWE-check," a real-time bug-detection model embedded natively in Windsurf that
      Cognition's own blog describes as roughly 10x faster than the frontier model it
      replaced (Opus 4.6) while narrowing the accuracy gap to frontier performance on
      in-distribution evaluations. With DoorDash, Applied Compute built a calibrated
      automated grader and a reinforcement-learning-trained model to correct errors in
      AI-generated merchant menus during onboarding; an independent LLMOps case-study
      database (ZenML) corroborates that this delivered a 30% relative reduction in
      low-quality menus and was rolled out to all U.S. menu traffic, though the same
      independent writeup cautions that its account "is presented by Applied Compute,
      which naturally positions their tooling favorably," a promotional-bias caveat
      worth carrying forward. With Mercor, Applied Compute's custom-trained "Applied
      Compute: Small" model ranked #1 in the corporate-law category and 4th overall on
      Mercor's APEX-Agents leaderboard as of a February 2026 case study, ahead of Opus
      4.5 and GPT-5.2, per company-hosted material not independently re-verified.
      Applied Compute's own fundraise post references working with "enterprises across
      the F500," implying customers beyond these three, but no additional names are
      disclosed anywhere in the sources reviewed. Headcount is not company-disclosed;
      RocketReach estimates 21-29 employees as of mid-2026. No source reviewed
      discloses revenue, ARR, or a customer count beyond the three named deployments.
    claimRefs: [CO030, CO031, CO032, CO033, CO034, CO035, CO036, CO037, CO038, CO039, CO040, CO041]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: milestones-and-adverse
    title: Milestone chronology and adverse signals
    body: >-
      Applied Compute's chronology runs from its 2025 OpenAI departure and founding
      through a mid-2025 seed round, a September 2025 funding-talk leak, an October 10,
      2025 California corporate filing, an October 29, 2025 stealth-exit financing, a
      January 2026 report of fresh unicorn-scale talks, a February 2026 Mercor
      benchmark result, an April 8, 2026 Kleiner Perkins-led Series B at $1.3 billion,
      a May 2026 Cognition product case study, and a July 2026 independent TechCrunch
      confirmation of unicorn status. Beyond the unreconciled officer-title conflict
      (Rhythm Garg as CFO/Secretary per the California filing versus CTO per Comcast
      LIFT Labs) and the unreconciled seed-round dating conflict (StartupsUnion's "June
      2024" versus the 2025 founding corroborated elsewhere), no lawsuit, regulatory
      enforcement action, layoff, or security-incident disclosure naming Applied
      Compute was located in any source reviewed in this pass; this is recorded as an
      absence-of-evidence finding rather than a confirmed clean record, given how young
      and privately held the company is and how limited legal-database coverage was in
      this pass. The clearest adverse signal available from primary reporting is
      structural rather than event-based: a roughly 13x valuation escalation in under a
      year, a total lack of disclosed revenue or ARR against a $1.3 billion valuation,
      and governance disclosures (officer titles, headcount) that conflict or rely
      entirely on third-party estimators rather than company statements.
    claimRefs: [CO001, CO018, CO021, CO023, CO024, CO025, CO028, CO029, CO032, CO038, CO042, CO004]
    tableRefs: [TO004]
    figureRefs: [FO001]
