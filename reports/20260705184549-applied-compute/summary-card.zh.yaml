  topStrengths:
    - 三位前 OpenAI 创始人直接参与过生产级 AI agent 建设，履历可比 2025–2026 年企业 AI 队列中的头部公司。
    - DoorDash、Cognition、Mercor 等具名企业部署，在 Series A 完成前就给出了早期商业验证。
    - Kleiner Perkins 领投、以 $1.3B 估值融资 $160M，显示一线投资人已有信心，也把现金跑道推到 2027–2028 年。
    - Specific Intelligence 的差异化在于用客户数据训练、可本地部署的 agent，直接回应企业对数据主权和准确性的真实要求。
  topRisks:
    - OpenAI、Anthropic 和超大规模云厂商（AWS Bedrock、Azure AI）都在向企业 agent 定制收敛，差异化窗口被快速压缩。
    - 目前只确认 3 家客户，收入、ARR 和留存均未披露；客户集中风险很高。
    - 创始人仍是早期职业阶段研究者，未披露过往 CEO/CRO 经验；把企业 go-to-market 放大，和做 AI 研究不是同一套能力。
    - 在收入未披露的情况下给到 $1.3B 估值，隐含很高的前瞻倍数，需要持续超高速增长才能消化。
  unresolvedGaps:
    - 需要披露收入运行率、ARR 和毛利率，才能按基本面承保。
    - 需要厘清 DoorDash、Cognition 和 Mercor 的客户合同条款，包括 ARR、NRR 和续约选择权。
    - 需要说明未来 12 个月内，面对 OpenAI 企业微调和 Microsoft/Copilot Studio 的竞争护城河在哪里。
    - 需要披露三位联合创始人之外的团队规模，以及关键工程 / 销售招聘。
    - 需要厘清 Series A 后的股权结构表和优先权安排。
