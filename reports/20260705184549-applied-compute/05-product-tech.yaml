  evidenceGaps:
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Public trust-center artifacts showing the scope, auditor, and effective dates of Applied Compute’s claimed SOC 2 controls.
    whyItMatters: Enterprise buyers and investors need to know whether the security posture is independently verified at the product level or only asserted in marketing copy.
    diligencePath: Request the latest SOC 2 report, bridge letter, and architecture notes covering VPC versus managed-cloud deployments.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: developer-surface
    missingEvidence: Public API docs, SDK docs, or pricing pages that demonstrate a repeatable self-serve developer motion.
    whyItMatters: The current public footprint could still describe a high-touch applied-research service business rather than a broadly productized platform.
    diligencePath: Request product documentation, customer onboarding flows, and any public/private SDK or API roadmaps.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: production-reliability
    missingEvidence: Service-level objectives, uptime history, rollback rates, and regression metrics for Train/Serve/Improve deployments.
    whyItMatters: Serving and online-improvement claims are central to the valuation story, but reliability cannot be underwritten from research posts alone.
    diligencePath: Request customer-facing SLA language, incident logs, and recent production scorecards from at least two deployments.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: community-adoption
    missingEvidence: Internal usage or customer usage metrics for public tooling such as trie, eval harnesses, or any private SDKs not exposed in GitHub.
    whyItMatters: Without it, open-source activity understates or obscures whether the platform has real developer pull outside bespoke engagements.
    diligencePath: Request repo-level download/usage telemetry, private package distribution stats, and a map of customer-visible versus internal-only tooling.
    relatedQuestionRefs:
    - QE011
    - QE012
    - QE023
