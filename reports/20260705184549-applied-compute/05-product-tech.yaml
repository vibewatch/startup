- id: training-and-context-architecture
  title: The technical architecture couples RL post-training with a context-and-memory system
  body: 'Applied Compute’s public technical corpus shows two tightly linked product bets. The first is reinforcement-learning-based post-training in realistic, replayable environments. DoorDash’s deployment turned internal QA labels into an automated grader and then used that grader as a reward signal; Cognition’s SWE-check case recreated the production Windsurf harness during RL and then split post-training into capability and product-alignment phases; Mercor’s work used long-horizon RL over expert-labeled worlds and trajectory-level observability to catch reward-design failures. The second bet is that weights alone are insufficient, so agents also need a runtime memory layer. The Context Engine papers describe a Remember/Refine/Retrieve pipeline that ingests SaaS data and agent traces, distills them into a Contextbase, and exposes retrieval APIs to the agent at runtime; the follow-on “Memory in the wild” post shows the same loop pointed at Applied Compute’s own code traces, with critical-memory
    retrieval rising from under 10% to around 20% over two weeks. The company’s newer “neural cheat-sheets” work further suggests it wants context compression itself to become a trained capability, not just a prompting trick. Together, these materials imply a full-stack architecture: custom environments and graders produce better weights, while traces and context systems preserve what the model should remember between runs.'
