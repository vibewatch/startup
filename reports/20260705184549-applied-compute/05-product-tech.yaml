- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - Applied Compute solution
  - measurable benefit
  - limitation
  rows:
  - - Merchant menu onboarding at DoorDash
    - Human experts verify messy menu outputs and QA labels catch quality failures after automated extraction
    - Build a calibrated grader from expert QA labels, then RL-train an error-correction model against DoorDash quality standards
    - Low-quality menus fell by roughly 30% relative and the model rolled out to all U.S. menu traffic
    - Benefits come from company and case-study evidence; public cost savings and false-positive rates are not disclosed
  - - Real-time bug detection at Cognition / Windsurf
    - Frontier models can find subtle bugs but may be too slow or expensive for instant IDE feedback
    - Replicate the production harness during RL and train a specialist bug-detection model aligned to product latency constraints
    - Roughly 10x faster than Opus 4.6 with an in-distribution delta F1 gap closed from 0.09 to 0
    - Out-of-distribution gap remains non-zero, so specialization improves but does not eliminate frontier-model tradeoffs
  - - Professional-work agents with Mercor data
    - General models struggle on long-horizon legal, consulting, and banking tasks
    - Use expert-labeled tasks plus long-horizon RL and trajectory observability to post-train a small specialist model
    - Pass@1 and mean score nearly doubled overall; corporate-law Pass@1 tripled on the cited experiment
    - Evidence is benchmark-centered rather than customer production ROI
  - - Enterprise memory / context management
    - Institutional knowledge sits in documents, traces, and SMEs rather than in reusable agent memory
    - Remember / Refine / Retrieve builds a Contextbase and feeds relevant memory back to runtime agents
    - GPT-5.4 APEX-Agents score improved from 44.2% to 51.7% in the cited benchmark; internal ACL-Wiki memory criticality roughly doubled
    - Most evidence is company-authored and benchmark-based, not third-party production telemetry
  notes: Each row maps a real customer or benchmark workflow to the product intervention Applied Compute describes. Metrics are recorded exactly as the cited public sources present them and should not be read as generalized across all customers.
