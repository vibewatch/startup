- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / process
  - role
  - public evidence
  - dependency
  - risk
  rows:
  - - Replayable environments and harnesses
    - Let models attempt tasks inside the same or similar environment they will see in production
    - DoorDash, Cognition, Mercor, and Modal descriptions all emphasize environment fidelity
    - Customer systems, tool definitions, sandbox provider
    - Train-test mismatch if mocks diverge from real production behavior
  - - Graders / reward functions
    - Score outputs so RL can reinforce desirable behavior
    - DoorDash automated grader; Mercor rubric redesign; leverage / entropy / staleness research
    - Human labels, task design, reward calibration
    - Bad reward shaping can reward refusal, shortcutting, or brittle behavior
  - - Serving and inference optimization
    - Operate long-horizon, tool-using traces with acceptable latency and cost
    - Inference benchmark and async-RL staleness papers; single-tenant and VPC claims on homepage
    - Inference engines, KV-cache management, concurrency tuning, GPU supply
    - Tail latencies and cache eviction can degrade both user experience and training quality
  - - Context Engine / retrieval APIs
    - Expose refined enterprise memory at runtime
    - Remember / Refine / Retrieve and Memory in the Wild posts
    - Enterprise documentation, trace logging, retrieval quality
    - Poor summarization or stale memory can degrade agent reliability and auditability
  - - Routing / orchestration layer
    - Choose the right model or workflow for the task instead of forcing one default
    - Agentic-router research and Anthropic workflow guidance
    - Model panel quality, routing features, orchestration logic
    - Router mistakes can add cost without improving success rate
  notes: The “public evidence” column intentionally mixes customer cases and research posts because Applied Compute’s product narrative is unusually research-led. Risks capture where the architecture can fail even if the underlying idea is sound.
