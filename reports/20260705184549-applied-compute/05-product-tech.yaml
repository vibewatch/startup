callouts:
- calloutType: strength
  title: Applied Compute has a coherent full-loop product thesis
  body: 'The public materials line up around the same idea: capture enterprise judgment in graders and traces, train a specialist model in a replayable environment, deploy it in production, and keep improving it from live feedback. For a 2025-founded startup, the architecture is unusually explicit rather than purely marketing-level.'
  claimRefs:
  - CE001
  - CE007
  - CE011
  - CE012
- calloutType: insight
  title: The moat claim is operational, not foundational
  body: Applied Compute’s strongest differentiation is not owning a frontier base model. It is owning the specialization loop — the harnesses, reward functions, routing logic, and memory systems that let a customer keep improving a task-specific agent even as the underlying model market changes.
  claimRefs:
  - CE002
  - CE020
  - CE027
  - CE038
- calloutType: risk
  title: Public trust evidence lags the sophistication of the product story
  body: The company publicly claims SOC 2, auditability, and perimeter-preserving deployment, but the best independent evidence in this chapter is generic risk guidance and external benchmarks showing how easily tool-using RL agents can go wrong without hardening. That gap is manageable in diligence, but it is real.
  claimRefs:
  - CE006
  - CE033
  - CE034
