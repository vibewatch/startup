- id: regulatory-security-and-compliance-risk
  title: Security and compliance burdens are real, and they can slow enterprise adoption before they cause headline incidents
  body: 'The clearest non-competitive risk is not a known enforcement action today; it is the breadth of the governance burden around agentic AI. CISA warns that organizations need stronger oversight for agentic AI services. NIST’s AI RMF makes the diligence surface explicit: secure, resilient, accountable, transparent, privacy-enhanced, and bias-managed systems are the target standard. The EU AI Act adds a formal legal framework around AI risk, which matters because Applied Compute is selling into precisely the kinds of high-stakes enterprise workflows where audits, logging, explainability, and human-oversight design become procurement issues. McKinsey’s survey evidence that 80% of organizations have already seen risky agent behaviors reinforces the point that buyers are not just shopping for accuracy. They are underwriting operational trust. Applied Compute’s public trust claims are directionally good, but the absence of a rich public trust-center package means each regulated or security-sensitive
    deployment could still become a bespoke diligence exercise.'
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR035
  - CR036
  - CR042
  tableRefs:
