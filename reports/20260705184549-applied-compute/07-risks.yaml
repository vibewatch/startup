- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Competitive moat compression
    - Flagship wins stop showing clear outcome delta versus platform defaults
    - Two consecutive major launches cite no material quality/cost advantage
    - Re-underwrite differentiation and valuation premium
  - - Security / governance burden
    - Customer security reviews expand faster than productized controls
    - Multiple strategic deals stall on trust / compliance requests
    - Prioritize control productization before growth acceleration
  - - Services-intensity scaling failure
    - Implementation times or staffing ratios fail to improve
    - New launches continue to require founder-level or research-heavy support
    - Treat business as lower-multiple hybrid services model
  - - Reference concentration
    - One flagship account meaningfully narrows scope or is lost
    - Loss or downgrade of a top reference before broadening roster
    - Assume pipeline conversion weakens and concentration risk rises
  - - Compute / capital squeeze
    - Training or inference cost trends outgrow commercialization proof
    - Gross-margin trajectory or burn rises without stronger revenue visibility
    - Tighten investment stance and require clearer unit economics
  - - Disclosure opacity persists too long
    - No audited financial or retention package appears in diligence
    - Unable to verify burn, runway, or customer concentration under NDA
    - Treat as unresolved blocker to high-conviction underwriting
  notes: Each row defines a monitorable thesis-break path rather than a vague concern. The most important distinction is between risks that can be productized away and risks that reveal a structurally less scalable business model.
