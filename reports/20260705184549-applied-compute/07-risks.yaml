- id: delivery-people-and-dependency-risk
  title: The delivery model proves product value but creates people, partner, and concentration risk
  body: 'Applied Compute’s customer wins show why the company exists: DoorDash, Cognition, Mercor, and Harvey all required customer-specific harnesses, graders, or benchmark environments. That depth makes the product hard to replicate quickly, but it also means deployments can stay dependent on scarce research talent for too long. The public record repeatedly describes an embedded, forward-deployed motion: researchers work with customer teams, DoorDash required onsite effort, Cognition used a replica of Windsurf, and Modal describes a deep integration model. On top of that, the company depends on a stack of outside providers and reference customers. It does not own the foundation model layer, it relies on cloud and execution partners, and its public go-to-market story is anchored by a small set of sophisticated flagship accounts. If any one of those accounts or partners weakens, the company could lose both revenue and social proof. The central question is whether Applied Compute can standardize
    enough of this motion before growth forces it to scale beyond a boutique forward-deployed team.'
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR005
  - CR006
  - CR007
