- id: capital-intensity-and-kill-criteria
  title: Capital intensity is manageable today, but valuation expectations leave little room for sloppy execution
  body: 'The April 2026 raise buys time, but it also hardens expectations. At a $1.3 billion post-money valuation and $160 million disclosed funding, Applied Compute is no longer judged like an early research boutique. It has to prove that the customization-heavy delivery model can compound into durable revenue before compute, energy, and security demands outgrow the available operating leverage. Gartner’s warning that more than 40% of agentic AI projects may be canceled by end-2027 should be read as a direct market-risk signal: even technically strong projects can fail commercially when cost, risk controls, or operating-model changes lag. Energy and data-center demand data from IEA and Goldman add a second layer of pressure by making compute-heavy post-training structurally expensive. The underwriting implication is clear: watch for whether public benchmark wins continue turning into repeatable production deployments, shorter implementation cycles, and clearer retention proof. If they do
    not, the valuation can unravel faster than the technical narrative.'
