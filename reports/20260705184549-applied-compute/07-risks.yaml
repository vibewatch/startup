  evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Public revenue, burn, runway, gross margin, and customer concentration disclosure for Applied Compute.
    whyItMatters: Without those metrics, investors cannot tightly bound whether the company is scaling like software, hybrid services, or applied research.
    diligencePath: Request audited financials, monthly burn, gross-margin bridge, and top-customer ARR mix.
    relatedQuestionRefs:
    - QR015
    - QR029
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: A public trust-center-quality package showing SOC 2 scope, incident handling, vendor controls, and deployment-mode architecture.
    whyItMatters: Security-sensitive enterprise buyers may still force bespoke diligence for every deployment if control maturity cannot be shown quickly.
    diligencePath: Request SOC 2 report, bridge letter, architecture notes, DPA, and sample customer security questionnaire responses.
    relatedQuestionRefs:
    - QR005
    - QR019
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: medium
    topic: implementation-repeatability
    missingEvidence: Implementation-time distribution, staffing ratios, and playbook reuse across customer launches.
    whyItMatters: The biggest execution risk is that every win remains bespoke longer than the valuation assumes.
    diligencePath: Request last 10 deployment timelines, named resource plans, and standardized launch artifacts.
