chapter:
  number: 7
  title: Risks
  summary: Applied Compute’s biggest risks are competitive moat compression, governance-heavy enterprise adoption, and the possibility that a high-touch delivery model scales more like premium applied research than software. The company has credible mitigants—strong customer outcomes, model flexibility, and fresh capital—but public evidence on repeatability, controls, and margin structure is still incomplete.
sections:
- id: competition-and-moat-risk
  title: Competitive pressure is the top strategic risk because the control-plane story is crowding fast
  body: 'Applied Compute’s core pitch is compelling: use a customer’s graders, data, and workflows to post-train a task-specific agent that outperforms generic models on that company’s exact use case. The problem is that the surrounding market is moving toward the same enterprise-agent control plane from several directions at once. AWS says Bedrock already serves more than 100,000 organizations and now offers AgentCore to operate agents securely at scale. OpenAI, Microsoft, Google, Salesforce, and Palantir all pitch secure enterprise agent deployment, governance, or digital labor on top of large existing distribution channels. Anthropic’s own agent guidance also undercuts any assumption that every workflow needs a heavyweight RL specialization stack; for many workflows, simpler orchestration patterns may be good enough. Applied Compute can still win where deep customization matters, but the burden of proof is now outcome-based: it must show that its specialist loop creates materially better
    economics or quality than increasingly capable platform defaults.'
  claimRefs:
  - CR003
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR033
