callouts:
- calloutType: risk
  title: Competition is no longer abstract
  body: Applied Compute is not just competing with Sierra, Glean, or Harvey-style vertical peers. It is also competing with AWS, OpenAI, Microsoft, Google, Salesforce, and Palantir on the broader enterprise-agent control plane. That makes “better technical taste” insufficient as a standalone moat.
  claimRefs:
  - CR020
  - CR021
  - CR022
  - CR024
  - CR025
  - CR026
  - CR027
  - CR038
- calloutType: insight
  title: Governance burden is a commercial risk, not just a compliance risk
  body: 'CISA, NIST, the EU AI Act, Gartner, and McKinsey all point in the same direction: enterprise buyers are evaluating agent systems as operationally risky software that needs oversight, measurement, and organizational redesign. That directly affects sales velocity and expansion timing.'
  claimRefs:
  - CR010
  - CR014
  - CR016
  - CR017
  - CR036
- calloutType: risk
  title: The public proof supports capability more than repeatability
  body: The current record proves that Applied Compute can solve very hard customer problems. It does not yet prove that those hard-won deployments translate into short implementation cycles, broad retention, or a scalable margin profile. That gap is the main underwriting issue.
  claimRefs:
  - CR030
  - CR031
  - CR032
  - CR040
  - CR041
