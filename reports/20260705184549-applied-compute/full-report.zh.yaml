        title: Specific Intelligence 是托管式专用化层，不是通用模型 API
        blocks:
          - type: paragraph
            body: >-
              Applied Compute 把产品定义为一套具体工作流里的云平台：训练、推理、持续改进，而不是一个单独的基础模型。官网把平台拆成 Train、Serve 和
              Improve：客户带来自己的数据、评测框架和评分器；Applied Compute
              在文本、图像、代码和结构化数据场景中，对会使用工具的智能体做后训练；训练出的模型随后进入生产，并从线上反馈继续更新。公司反复把这件事定位为一层架在日益商品化前沿模型之上的专业化层，让客户保留自己的奖励函数、评测和记忆，而不是把智能外包给单一上游基础模型供应商。这个说法在官网、融资文章、Modal
              客户案例以及后续技术研究文章里都一致。更重要的是，平台强调模型灵活，而不是绑定单一模型：Applied Compute
              表示，客户可以从当时最好的基础模型开始训练，之后升级模型时，不必重建评测框架、数据管线或部署栈。落到产品承诺上，它讲的不是“我们有最好的基础模型”，而是“我们帮企业把专有判断沉淀成一套持久、可复用的训练与部署循环”。
