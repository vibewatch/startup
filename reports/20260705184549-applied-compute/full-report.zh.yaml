            body: >-
              包括 Applied Compute 在内，本章画像中的公司没有一家公布核心企业智能体产品的自助标价。Harvey、Glean 和 Sierra 都销售经济条款未披露的定制企业合同；独立 2026
              年买方指南估计，Decagon 和 Sierra 合同通常从每年约 $95,000-$150,000 起，加入前线部署集成后可达到
              $200,000-$350,000，不过这些是第三方估算，不是供应商公布的数字。Cognition 的 Devin 是所审阅产品中唯一披露定价机制的产品——基于使用量的 activity credit
              units——评论者称，这造成约 $500 / 月的成本下限，并让长时间任务的总成本不可预测。OpenAI 对旗舰 API 定价最透明，但与其他公司一样，大企业合同条款仍为定制且未披露。Salesforce 和
              Microsoft 都把智能体定价折入既有 CRM 和 Microsoft 365 订阅包中，这让买方在评估独立专营供应商与既有玩家附加产品时，更难做同口径价格比较。


              能力上，功能 / 能力矩阵显示出一致模式：垂直同行（Harvey、Sierra、Decagon、Cognition）披露了很强的领域专精，但底层模型 / RL 训练深度大多未披露；OpenAI
              则披露了很强的模型深度，但在垂直领域上保持横向。分发和打包能力集中在三家平台既有玩家手中，它们可以把智能体工具附着到企业本来就会预算的续约中——Salesforce 自己披露 Agentforce 超过 60%
              的预订来自扩张而非新 logo，就是这一动态的直接证据。就信任和监管姿态而言，所审阅来源没有披露覆盖全部九个实体且详细可比的合规 / 认证矩阵；本章把它视为开放证据缺口，而不是根据不完整公开材料推断排名。
