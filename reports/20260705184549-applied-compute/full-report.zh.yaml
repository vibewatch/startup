            body: >-
              Applied Compute 的公开技术材料显示了两个紧密相连的产品押注。第一，是在真实、可回放环境里用强化学习做后训练。DoorDash 的部署把内部 QA
              标签变成自动评分器，再把该评分器作为奖励信号；Cognition 的 SWE-check 案例在 RL 中复刻生产环境里的 Windsurf 评测框架，再把后训练拆成能力阶段和产品对齐阶段；Mercor
              的工作则在专家标注世界中做长周期 RL，并用轨迹级可观测性捕捉奖励设计失败。第二，权重本身不够，智能体还需要运行时记忆层。Context Engine 论文描述了一条
              Remember/Refine/Retrieve 管线：摄取 SaaS 数据和智能体轨迹，蒸馏成 Contextbase，并在运行时向智能体开放检索 API；后续 “Memory in the wild”
              文章把同一循环指向 Applied Compute 自己的代码轨迹，两周内关键记忆检索率从不到 10% 升至约 20%。公司更新的 “neural cheat-sheets”
              研究还进一步暗示，它想把上下文压缩本身训练成一种能力，而不只是提示词技巧。合在一起，这些材料指向一套全栈架构：定制环境和评分器产出更好的权重，轨迹和上下文系统则保留模型在多次运行之间应该记住的东西。
