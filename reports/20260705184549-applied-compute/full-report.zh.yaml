      - number: '3.5'
        title: 护城河耐久性、商品化风险与竞争对手负面证据
        blocks:
          - type: paragraph
            body: >-
              Applied Compute 的核心护城河主张——深度强化学习后训练和评测基础设施能力——同时面临两个方向的直接内生化威胁。OpenAI 等超大规模云 / 模型厂商正在推动跨系统 Frontier
              编排和自己的后训练研究预算；Sierra 等资金雄厚的垂直既有玩家也公开称，会构建自有微调专有层，而不是从外部购买这项能力。更复杂的是，Applied Compute
              自己的证明点——Harvey、Cognition 和 DoorDash——本身正在向数十亿美元估值扩张，或已经跨过该门槛；这正好让这些被用来证明产品市场匹配的客户，在初始能力转移完成后，拥有将 RL
              后训练内生化的资产负债表能力。资本差距很刺眼：Sierra、Harvey、Decagon 和 Cognition 在同一 12 个月内各自完成 $200M-$950M 单轮融资，估值是 Applied
              Compute 自己披露轮的 3x-12x，让它们每一家都有更多资本去争夺算力和研究人才。


              独立证据也给整个品类，而不只是 Applied Compute，增加了更多谨慎信号。Gartner 预测，到 2027 年底，超过 40% 的智能体 AI
              项目会因成本、价值或风险控制问题被取消——这是需求侧风险，会压缩本章所有供应商的可触达管道。2026 年对 Cognition Devin
              的独立测试发现，即便是所审阅项目中资金最充足、自治程度最高的产品，也存在真实可靠性缺口：在边界清晰的 bug 修复上成功率约 78%，安全漏洞盲点未解决，并且记录到接近 $500 /
              月的成本下限；Cognition 自身在 2025 年 8 月裁员约 30 人，并向另外 200 人提供买断，同时伴随高强度工作时长预期报道，尽管其估值同季度翻倍以上。Sierra
              创始人也公开预测，约两年内市场会修正并出现「淘汰效应」。合起来看，Applied Compute
              的基础设施层位置避开了部分正面产品竞争，但避不开资本强度、内生化和需求耐久性风险；这些风险已经出现在其直接客户和同行自己的披露中。仍有一个真正开放的证据缺口：所审阅来源没有说明 DoorDash 同时出现在
              Applied Compute 案例研究和 OpenAI 企业客户名单中，代表的是重叠工作负载，还是完全不同的工作负载。
