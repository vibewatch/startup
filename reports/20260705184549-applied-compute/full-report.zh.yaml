      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Applied Compute 由 Yash Patil、Rhythm Garg 和 Linden Li 共同创立，三人都是 Stanford University 校友，并从 OpenAI
              的技术岗位离职创业。Patil 是 OpenAI 智能体式 Codex 软件工程项目的关键成员，现任 Applied Compute CEO；Garg 是 OpenAI o1 的核心贡献者，o1
              是首个经强化学习训练的推理模型；Li 则负责强化学习训练所需的 ML 系统和基础设施。不同来源无法完全对齐高管头衔：Applied Compute 的 California Secretary of State
              备案将 Rhythm Garg 列为 Chief Financial Officer 和 Secretary，并把 Yash Patil 列为唯一的 Chief Executive Officer
              和注册代理人；但 Comcast NBCUniversal LIFT Labs 的投资组合页面则把 Garg 的头衔列为 Chief Technology Officer，把 Linden Li 列为 Chief
              Architect。这不是编辑取舍，而是所审阅来源中真实存在、尚未调和的冲突，本身就是一个值得标记的治理披露信号：未找到独立且有日期的高管声明文件来解决这个差异。公司自述称，团队中三分之二曾是创业公司创始人，包括前顶尖
              AI 研究员和数学奥林匹克获奖者；Lux Capital 的投资组合资料还称，团队校友包括 OpenAI 强化学习基础设施老兵，以及来自 Scale AI、Together、Two Sigma 和
              Watershed 的人员。所审阅来源中，三位联合创始人之外没有出现任何具名高管（例如独立总法律顾问或销售负责人）；公司成立约一年时仍如此，也是关键人依赖信号。
