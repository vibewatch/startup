  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：什么算企业 AI 智能体
        blocks:
          - type: paragraph
            body: >-
              Applied Compute 竞争的不是宽泛的「所有 AI」类别，而是企业 AI
              智能体和面向内部业务工作流的智能体软件。公司自己的材料把机会表述为弥合前沿模型原始能力与单家公司特定工作流中实际效用之间的「overhang」；做法依赖两类前线部署角色——Forward Deployed
              Engineers（FDE），负责搭建评测框架和生产环境；Applied Research Engineers（ARE），负责训练和调优底层模型。因此，Applied Compute
              落在三个相互重叠的支出类别里：企业智能体平台与编排、强化学习后训练和评测框架基础设施、前线部署式定制劳动力。同样的前线部署模式由 Palantir 在十多年前开创，现在已产品化为 Palantir Foundry
              内的 AI 智能体，并正被大规模复制：AWS 在 2026 年承诺投入 $1 billion，组建专门的、智能体优先的 Forward Deployed Engineering 单元，服务 NFL、NBA、Cox
              Automotive 和 Southwest Airlines 等具名客户。本边界排除两类相邻替代品：没有评测框架或 RL 定制层、按 token 计费的无差异通用模型 API 消耗；以及早于智能体 AI
              出现的既有工作流 / RPA / CRM 软件。企业很少只选一条路：65% 的受访技术领导者称采用「自建 + 采购」混合架构，只有约 10% 仅依赖供应商。这说明内部自建不是边缘情况，而是 Applied
              Compute 必须逐单替代的现实选择。
