    type: matrix
    layout: wide
    summary: 纳入当前公开缓释后，竞争、治理负担和交付模式扩张是剩余风险最高的三项。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: 竞争护城河压缩
          values:
            - 高
            - 高
            - 中
        - label: 安全 / 治理负担
          values:
            - 高
            - 高
            - 中
        - label: 高服务强度扩张
          values:
            - 高
            - 高
            - 低中
        - label: 标杆客户集中
          values:
            - 中高
            - 高
            - 低中
        - label: 算力 / 资本挤压
          values:
            - 中
            - 高
            - 中
        - label: 创始人集中
          values:
            - 中
            - 中高
            - 中
    approximationNotes: 评分是对保留公开证据的定性综合，不是模型输出。它们用于强制排序剩余风险，而不是数学模拟概率。
    claimRefs:
      - CR001
      - CR010
      - CR018
      - CR030
      - CR037
      - CR038
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 多数风险沿同一条链传导：控制负担或竞争压力拖慢部署，削弱留存证明，压缩利润率，并动摇估值支撑。
    data:
      nodes:
        - id: r1
          label: 竞争压力
          detail: 超大云厂商和套件缩短差异化窗口
        - id: r2
          label: 部署周期拉长
          detail: 安全、合规和定制化拖慢上线
        - id: r3
          label: 证明变弱
          detail: 标准化成功案例更少，留存可见度更薄
        - id: r4
          label: 利润率 / 烧钱压力
          detail: 每次部署消耗更多研究时间和算力
        - id: r5
          label: 估值压力
          detail: 没有可重复经济性，溢价倍数更难守住
      edges:
        - from: r1
          to: r3
          label: 抬高证明门槛
        - from: r2
          to: r3
          label: 拖慢扩张
        - from: r2
          to: r4
          label: 增加服务负荷
        - from: r3
          to: r5
          label: 削弱叙事
        - from: r4
          to: r5
          label: 压缩经济性
    approximationNotes: 该 DAG 是方向性、因果性的，不是定量模型。它用来说明，看似分散的风险为什么会互相强化。
    claimRefs:
      - CR016
      - CR017
      - CR019
      - CR030
      - CR032
      - CR041
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Applied Compute 同时依赖基础模型厂商、基础设施伙伴、旗舰标杆客户和新兴监管框架。
    data:
      nodes:
        - id: d1
          label: 基础模型
          detail: 外部模型路线图和经济性
        - id: d2
          label: 基础设施伙伴
          detail: 云、沙箱和执行层
        - id: d3
          label: 旗舰客户
          detail: DoorDash、Cognition、Mercor、Harvey 是证明锚点
        - id: d4
          label: 治理框架
          detail: CISA、NIST、EU AI Act、买方安全审查
        - id: d5
          label: Applied Compute 收入模型
          detail: 定制化上线、部署和扩张
      edges:
        - from: d1
          to: d5
          label: 赋能 / 压缩
        - from: d2
          to: d5
          label: 支撑交付
        - from: d3
          to: d5
          label: 驱动证明和集中度
        - from: d4
          to: d5
          label: 约束采用
        - from: d1
          to: d3
          label: 提高内化风险
    approximationNotes: 该图隔离出最可能影响收入质量和商业速度的外部依赖，不试图覆盖每个供应商或监管方。
    claimRefs:
      - CR003
      - CR008
      - CR029
      - CR036
      - CR037
      - CR039
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议从真实融资事件出发，经过客户证明和证据不透明，最终落到跟踪 / 继续研究结论。
    data:
      nodes:
        - id: fact
          label: 独角兽事实
          detail: $1.3B 融资标记已有公开佐证
        - id: proof
          label: 客户证明
          detail: DoorDash 和 Cognition 体现真实产品价值
        - id: gap
          label: 经济性不透明
          detail: ARR、利润率、NRR 和轮次条款仍未披露
        - id: output
          label: 跟踪 / 继续研究
          detail: 没有私下尽调，价格支撑不足
      edges:
        - from: fact
          to: proof
          label: 支撑
        - from: proof
          to: gap
          label: 抵消
        - from: gap
          to: output
          label: 导向
    claimRefs:
      - CV001
      - CV003
      - CV033
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 当前 $1.3B 标记需要多少 ARR，取决于投资人认为合理的倍数区间，差异很大。
    data:
      items:
        - label: 25x ARR 溢价区间
          value: 52
        - label: 18x ARR 高增长溢价区间
          value: 72.2
        - label: 12x ARR 强软件区间
          value: 108.3
        - label: 8x ARR 克制增长区间
          value: 162.5
        - label: 5x ARR 混合 / 成熟区间
          value: 260
      yAxis:
        label: 支撑 $1.3B EV 代理值所需 ARR（USD M）
    approximationNotes: 数值用估值除以假设 ARR 倍数反推。它们是敏感性锚点，不是 Applied Compute 披露的 ARR 区间。
    claimRefs:
      - CV001
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 在几个示例 ARR 水平下，Applied Compute 是否配得上混合、强软件或溢价增长倍数，会让公允价值出现巨大差异。
    data:
      items:
        - label: 如果 ARR 为 $40M
          low: 200
          mid: 480
          high: 720
        - label: 如果 ARR 为 $60M
          low: 300
          mid: 720
          high: 1080
        - label: 如果 ARR 为 $80M
          low: 400
          mid: 960
          high: 1440
    approximationNotes: 低档使用 5x ARR，中档使用 12x ARR，高档使用 18x ARR。这些是场景分析的示例估值区间，不是市场报价。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV038
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 用紧凑 KPI 展示判断当前估值标记是否站得住的关键指标，以及公开材料中最薄弱的部分。
    data:
      items:
        - label: 公开估值标记
          value: '1300'
          unit: USD M
        - label: 已披露融资
          value: '160'
          unit: USD M
        - label: 公开细节充分的旗舰部署
          value: '4'
          unit: case studies
        - label: ARR 披露质量
          value: Low
        - label: 建议立场
          value: Track
    claimRefs:
      - CV001
      - CV003
      - CV013
      - CV033
      - CV036
