        - 压缩倍数，削弱退出可比性
        - 重新按混合服务 / 软件风险定价
      - - 客户集中度严重
        - 少数旗舰账户主导收入或证明叙事
        - 提高波动性和背书脆弱性
        - 要求集中度折价或延后
      - - 治理 / 合规摩擦拖慢增长
        - 安全和采购负担显著拖慢部署
        - 把技术护城河变成商业瓶颈
        - 继续推进前，要求看到控制产品化证据
      - - 竞争性定价或捆绑挤压支付意愿
        - 客户可替换为更便宜或捆绑的平台产品
        - 降低长期高溢价倍数支撑
        - 收紧估值纪律，监控赢单 / 输单数据
    notes: 这些是技术上令人印象深刻的公司在当前估值标记下仍可能变成糟糕投资的最短路径。
    claimRefs:
      - CV014
      - CV023
      - CV029
      - CV032
      - CV040
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 按客户 / 用例拆分的当前 ARR 和增长
        - 未公开披露 ARR
        - 用来检验当前价格是否至少在合理区间
        - NDA 下的财务 / CEO 材料
      - - 毛利率和算力 COGS
        - 未公开披露毛利率
        - 用来区分可扩张软件和高端服务
        - 财务 + 基础设施负责人
      - - NRR、流失率和客户集中度
        - 未公开披露留存或集中度
        - 用来判断明星客户能否转化为持久收入
        - 收入运营 / 客户成功
      - - 轮次结构与优先权条款
        - 仅有估值大数
        - 需要用来评估 2026 年 4 月估值标记的经济质量
        - 法务顾问 + 融资文件
      - - 实施人员配比和上线周期
        - 没有公开的可复制性指标
        - 需要用来正确定价服务强度风险
        - 运营 + 部署负责人
      - - 对平台既有厂商的赢单 / 失单数据
        - 没有公开的竞争转化数据
        - 需要判断当前价格下差异化能否守住
        - 销售负责人 / 产品营销
    notes: 在这些问题得到回答前，估值讨论应保持情景化和纪律性，而不是按高确信度定价。
    claimRefs:
