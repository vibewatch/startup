  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、平台既有玩家与自建替代
        blocks:
          - type: paragraph
            body: >-
              企业提到「AI 智能体」时常放在同一组里的大多数公司，并不是 Applied Compute 面对的同一购买决策。Applied Compute 自己的公开材料把公司定位为强化学习后训练和评测基础设施伙伴：它为
              Harvey、Cognition 和 DoorDash
              等具名客户训练专有、任务调优模型，再由这些客户以自己的品牌推出相应智能体。这样一来，实际竞争集异常分层。直接垂直同行——Harvey（法律）、Glean（企业搜索 / 智能体）、Sierra 和
              Decagon（客服）、Cognition/Devin（软件工程）——各自在特定领域拥有面向终端用户的品牌智能体产品。平台既有玩家——OpenAI 的 Frontier/AgentKit
              技术栈、Salesforce 的 Agentforce、Microsoft 的 Copilot Studio——则把智能体构建工具打包进企业已经付费的开发者平台、CRM 席位或 Microsoft 365
              订阅。一个公开创业公司聚合器还列出几十家规模更小、阶段更早的进入者（LangChain、Agent Bricks、Manus AI
              等）围绕同一广义空间展开竞争，尽管它们都没有本章所分析直接同行的融资规模或具名客户证据。


              本章最重要的细节是竞合：Harvey 同时是 Applied Compute 已披露的合作客户，用于其法律智能体的强化学习后训练；又是独立运营的垂直既有玩家，直接向律所销售自己的
              Assistant/Vault/Knowledge 套件。同样的前线部署基础设施与品牌产品之间的区分，也出现在 Cognition 和 DoorDash 身上。与此同时，Sierra
              管理层称其构建在「一组」第三方基础模型之上，并叠加自有微调专有层——这是一条内部自建替代路径；如果扩散，即便企业没有打造竞争性品牌产品，也会减少对 Applied Compute 这种外部 RL
              后训练专家的需求。
