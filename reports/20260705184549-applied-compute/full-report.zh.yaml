  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 流程
      - 角色
      - 公开证据
      - 依赖
      - 风险
    rows:
      - - 可回放环境和测试框架
        - 让模型在与生产中相同或相近的环境里尝试任务
        - DoorDash、Cognition、Mercor 和 Modal 的描述都强调环境保真度
        - 客户系统、工具定义、沙盒提供商
        - 如果模拟环境偏离真实生产行为，就会出现训练-测试错配
      - - 评分器 / 奖励函数
        - 给输出打分，让 RL 能强化理想行为
        - DoorDash 自动评分器；Mercor 评分标准重做；杠杆 / 熵 / 陈旧度研究
        - 人工标签、任务设计、奖励校准
        - 糟糕的奖励塑形可能奖励拒答、走捷径或脆弱行为
      - - 服务与推理优化
        - 以可接受的延迟和成本运行长周期、工具使用型轨迹
        - 推理基准和 async-RL 陈旧性论文；官网单租户和 VPC 说法
        - 推理引擎、KV-cache 管理、并发调优、GPU 供给
        - 尾部延迟和缓存淘汰会同时拖累用户体验和训练质量
      - - Context Engine / 检索 API
        - 在运行时暴露精炼后的企业记忆
        - Remember / Refine / Retrieve 与 Memory in the Wild 文章
        - 企业文档、轨迹日志、检索质量
        - 摘要质量差或记忆过时，会拖累 agent 可靠性和可审计性
      - - 路由 / 编排层
        - 按任务选择合适模型或工作流，而不是硬套一个默认项
        - agentic-router 研究与 Anthropic 工作流指南
        - 模型池质量、路由功能、编排逻辑
        - 路由出错会抬高成本，却不提升成功率
    notes: “公开证据”列有意混合客户案例和研究文章，因为 Applied Compute 的产品叙事异常受研究驱动。风险列记录架构在哪些环节可能失效，即便底层思路本身成立。
