  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资事实成立，但公开记录更支持“跟踪 / 继续研究”，而不是明确买入
        blocks:
          - type: paragraph
            body: >-
              Applied Compute 显然已跨过独角兽门槛：公司自己宣布完成 $80 million 融资，投后估值 $1.3 billion，TechCrunch
              也独立印证了相同估值和累计融资额。这验证了市场标记，但不能证明 $1.3 billion
              已是新投资人的公平入场价。公开证据支持高产品野心、可信旗舰客户，以及对一家如此年轻公司而言异常强的案例结果。但收入、利润率、留存和客户集中度均未披露，证据还不足以支撑有信心的价格判断。因此，估值敏感性才是主导框架。在这个价格上，即使用慷慨的
              ARR
              倍数假设，也需要公开记录尚未展示的有意义规模。仅凭公开证据，最诚实的建议是密切跟踪公司；只有私人尽调揭示更强经济性，或价格纪律改善时才行动。公开市场投资人通常会要求补齐这些缺失背景，才会把融资头条当作耐久估值锚。
