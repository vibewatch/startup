      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Applied Compute 已披露的四个企业部署横跨四个不同垂直领域，每个项目都由领域职能负责人推动，而不是同一个横向买方画像：法律（Harvey，双方共同后训练的模型在 Harvey 的 1,250 任务
              Legal Agent Benchmark 上超过 Opus 4.8 Max 和 GPT-5.5 xhigh）、软件工程（Cognition，SWE-check 漏洞检测智能体运行速度约为其替换前沿模型的
              10x）、市场运营（DoorDash，强化学习训练的评分器纠正 AI 生成商户菜单），以及劳动力市场评测（Mercor，按公司托管、未独立复核的案例研究，Applied Compute 自己的小模型在
              Mercor 的 APEX-Agents 排行榜公司法类别第 1、总榜第 4）。这类部署的预算所有权正在从中央 IT 转移：一项 2026 年对 266 名 Fortune 50-Global 2000
              技术领导者的调查发现，业务线负责人已成为最大的 AI 工具购买群体，占 46%，首次追平或超过 CIO（38%）和 CTO（38%）。典型采用路径仍然要先通过采购和治理关口才会承诺预算——84% 的企业把安全 /
              合规签核视为不可谈判条件，70% 希望先有自助沙盒试用——这有利于 Applied Compute 这类能把工程师直接嵌入工作流负责人身边的供应商，而不是只向中央 IT 销售标准化产品。
