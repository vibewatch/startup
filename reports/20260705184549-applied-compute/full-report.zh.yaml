        blocks:
          - type: paragraph
            body: >-
              Serve 和 Improve 层与训练循环一样核心。Applied Compute
              表示，客户可以做到训练到部署零错配，立即发布检查点，并按照吞吐、延迟和并发要求配置部署，覆盖异步智能体到实时用户体验。公司还声称支持在自有云上无服务器部署，或通过一个控制平面在客户 VPC
              内完整运行；同时支持单租户区域部署，并在每次调度上记录审计日志。几篇研究文章解释了这些主张为什么在技术上重要。推理基准认为，智能体工作负载不同于经典提示 / 响应服务：它们会产生几十次短生成、长生命周期 KV
              缓存和重尾工具延迟。异步 RL 陈旧性文章显示，当服务和学习解耦后，利用率、队列容量、rollout 并发和响应长度长尾都会影响训练质量。公开 GitHub 证据很薄，但方向一致：组织开放了一个 Apache
              许可仓库 `trie`，用于对端点回放推理流量，这与研究文章中的基准叙事吻合。最终图景很清楚：平台针对的是轨迹密集、会使用工具的智能体，而不是单轮聊天吞吐。
