        - 把生产轨迹、人类反馈和发布可观测性转成在线 RL 或自蒸馏更新
        - 没有公开留存或回归率数据说明生产更新多久能被安全提升
      - - Context Engine / Contextbase
        - 企业知识工作者和智能体构建者
        - 新兴但在 2026 年研究中已清晰产品化
        - 加入 Remember / Refine / Retrieve 记忆，让机构知识随时间复利，而不是只留在权重里
        - 公司基准测试之外，没有公开客户部署数量，也没有外部审计验证检索质量
      - - Router / 基准测试工具
        - 内部平台团队和高级客户
        - 早期但真实存在
        - 多模型路由、轨迹回放和工作负载基准测试，显示该平台围绕智能体运营搭建，而不只是托管模型
        - 公开开发者足迹只有一个代码仓库和公司自撰研究；面向客户工具的广度仍不清楚
    notes: 各行区分首页三个模块和 2026 年研究中浮出的相邻技术资产。“状态 / 成熟度”只反映本章审阅的公开证据，不代表内部 SKU 边界。
