      - number: '1.4'
        title: 规模、已披露客户与封面指标缺口
        blocks:
          - type: paragraph
            body: >-
              Applied Compute 在自己的案例研究和融资公告中点名了三家企业客户：Cognition（Devin AI 软件工程师和 Windsurf IDE 的开发商）、DoorDash 和 Mercor。与
              Cognition 的合作中，Applied Compute 共同开发了「SWE-check」，这是一个实时漏洞检测模型，原生嵌入 Windsurf；Cognition
              自己的博客称，该模型大约比其替换的前沿模型（Opus 4.6）快 10x，同时在同分布评测中把准确率差距收窄到接近前沿模型水平。与 DoorDash 的合作中，Applied Compute
              构建了一个校准过的自动评分器，并训练了一个强化学习模型，用来纠正商户入驻时 AI 生成菜单中的错误；独立 LLMOps 案例库（ZenML）证实，该方案让低质量菜单相对减少
              30%，并已覆盖美国全部菜单流量。不过，同一篇独立文章也提醒，其叙述「由 Applied Compute 提供，因而自然会正面呈现其工具」，这种宣传偏差警示需要延续。与 Mercor 的合作中，Applied
              Compute 定制训练的「Applied Compute: Small」模型在 Mercor 的 APEX-Agents 排行榜公司法类别中排名第 1、总榜第 4；这是截至 2026 年 2
              月案例研究的结果，领先 Opus 4.5 和 GPT-5.2，但依据的是公司托管材料，未独立复核。Applied Compute 自己的融资文章提到正在与「F500
              中的企业」合作，暗示三家之外还有客户，但所审阅来源没有披露任何其他名称。公司未披露员工数；RocketReach 估计截至 2026 年中为 21-29
              人。所审阅来源没有披露收入、ARR，或三家点名部署之外的客户数量。
