      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              采用率正在多个方向同时加速。Gartner 预计，到 2026 年底，最多 40% 的企业应用会搭载任务特定智能体（2025 年不到 5%）；McKinsey 发现，88%
              的组织现在报告至少在一个业务职能中经常使用 AI；一项 2026 年 CXO 调查则显示，42% 的企业已经在生产环境运行智能体 AI（生产 + 试点合计 72%）。AWS 和 Palantir
              的前线部署工程模式走向主流，本身也是驱动因素：它验证了 Applied Compute 的 FDE/ARE 结构已经成为行业模式，但也表明超大规模云厂商可能会直接争夺同一批客户。约束同样具体。Deloitte
              称，只有五分之一公司具备成熟的智能体治理模型；Gartner 预计，到 2027 年，40% 的企业会在生产中暴露治理缺口后，将自主智能体降级或下线。数据就绪度连续第五年位居受访 CXO
              提到的首要阻碍（58%）；投资回报门槛也很苛刻：Gartner 预计，到 2027 年，超过 40% 的智能体 AI 项目会被取消；MIT 相关 NANDA 研究发现，95% 的企业生成式 / 智能体 AI
              试点无法展现可衡量的 P&L 影响，而与供应商合作的部署成功率约为纯内部自建的两倍。所有这些之下，还叠加了任何重 RL 供应商都会面对的资本强度约束：IEA 预计，到 2030 年，数据中心用电量将几乎翻倍至约
              945 TWh；Goldman Sachs 预计，到 2030 年，全球数据中心电力需求将比 2023 年上升 165%。这种成本和供给背景会影响 Applied Compute
              训练和评测工作所依赖算力的价格与可得性。
