  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Applied Compute
        - RL 后训练 / 智能体基础设施（标的公司）
        - 据其 2026 年 4 月融资披露，估值 ~$1.3B（见公司概况）；远小于下列同行
        - 需要为自有智能体做定制 RL 后训练的企业（Harvey、Cognition、DoorDash、Mercor）
        - 通过前置部署的 RL / 评测基础设施训练客户自有模型，而不是交付一个带品牌的终端用户智能体
        - 未披露公开定价，具名客户基数小，且部分具名客户本身资金充裕，未来可能内建
      - - Harvey
        - 直接垂直同行（法律）
        - 2026 年 3 月以 $11B 估值融资 $200M
        - 律所和企业法务部门
        - 统一的 Assistant / Vault / Knowledge 套件；披露客户运行的自定义智能体超过 25,000 个
        - 未公开标价；同时披露为 Applied Compute 的 RL 后训练客户，使纯竞争对手定位变得模糊
      - - Glean
        - 直接横向同行（企业搜索 / 智能体）
        - Series F 轮融资 $150M，估值 $7.2B
        - 大型企业内跨职能知识工作者
        - 定位为在公司既有知识和应用栈之上构建、部署、编排智能体的一层
        - 横向覆盖更广，可能意味着在任一单一领域的垂直深度不及 Harvey、Sierra 或 Decagon
      - - Sierra
        - 直接垂直同行（客户服务）
        - 2026 年 5 月以 $15.8B 估值融资 $950M
        - 大型消费品牌和 Fortune 50 企业
        - 托管式前置部署交付；8 个季度 ARR 超过 $150M；Fortune 50 中超过 40% 是客户
        - 托管服务模式把迭代控制权交给 Sierra 自有团队，而不是买方工程师
      - - Decagon
        - 直接垂直同行（客户服务）
        - 2026 年 1 月 Series D 融资 $250M，估值 $4.5B
        - 面向消费者的旅游、金融科技、医疗和零售品牌
        - '"Agent Operating Procedures" 让 CX 团队用自然语言写逻辑，再编译成受治理的代码'
        - 独立买方指南认为，相比 Sierra，它需要更多客户侧工程集成
      - - Cognition / Devin
        - 直接垂直同行（软件工程）
        - 2025 年 9 月以 $10.2B 估值融资 $400M；Devin ARR ~$73M（2025 年 6 月）
        - 需要自主编码智能体吞吐量的工程团队
        - 在所审阅同行中自主性最高的编码智能体；沙盒化云开发环境
        - 2026 年独立测试发现，只有边界清晰的 bug 修复成功率 ~78%，且安全审查缺口未解决；2025 年据报道出现裁员和高压文化
      - - OpenAI（Frontier / AgentKit）
        - 平台在位者
        - 企业业务占总收入 >40%，目标到 2026 年底与消费者业务持平
        - 已基于 GPT 模型构建的企业；Oracle、State Farm、Uber 是具名 Frontier 客户
        - 由单一供应商打包模型、AgentKit 工具，以及跨系统 Frontier 编排层
        - 企业智能体编排比 Sierra / Decagon / Harvey 的垂直产品更晚，纵深上的验证也更少
      - - Salesforce（Agentforce）
        - 平台在位者
        - Agentforce ARR ~$800M（同比 +169%）；FY26 Q4 与 Data 360 合计 $2.9B
        - 销售、服务和行业云中的现有 Salesforce CRM 客户
        - 绑定进 150,000+ 客户安装基数的续约；已成交 29,000+ 笔 Agentforce 交易
        - 60%+ 预订来自现有客户扩张，而非从专业厂商手中赢得的净新增客户
      - - Microsoft（Copilot Studio）
        - 平台在位者
        - 2026 年初，230,000+ 组织在构建智能体；15M+ 付费 M365 Copilot 席位
        - Microsoft 365 和 Teams 企业客户
        - 低代码智能体构建器直接嵌入企业已经续费的订阅
        - 采用数据把智能体构建器使用量与更广义 Copilot 席位数混在一起，难以拆出净增智能体牵引力
      - - 内部构建 / 通用模型栈
        - 替代方案 / 现状
        - 不适用 -- 成本是企业自己的工程预算
        - 拥有内部 ML / 工程团队的企业（例如 Sierra 自身的 "constellation of models" 做法）
        - 完全掌控模型选择、微调和路线图，不依赖供应商
        - 需要企业内部具备大多数企业缺乏的 RL / ML 专长，而这正是 Applied Compute 与垂直同行共同销售时瞄准的缺口
    notes: 融资和估值数字均取各厂商截至本报告生成日的最新公开披露；Applied Compute 估值从公司概况重述用于比较，未在本节重新推导。
