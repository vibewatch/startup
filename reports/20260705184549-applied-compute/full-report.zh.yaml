      - number: '2.2'
        title: 市场规模：多重视角，但没有单一可靠 TAM
        blocks:
          - type: paragraph
            body: >-
              这个市场没有一个宽口径 TAM 数字可靠，因此规模判断必须叠加几个受证据约束的视角。MarketsandMarkets、Grand View Research、Precedence Research 和
              Fortune Business Insights 四家独立市场研究机构，都把 2025-2026 年全球独立「AI 智能体」软件市场规模放在大约 $7.3-8.5 billion
              区间，但对轨迹判断分歧很大：MarketsandMarkets 预计 2030 年达到 $52.62 billion（46.3% CAGR），Grand View 预计 2033 年达到 $182.9
              billion（49.6% CAGR），Precedence 预计 2035 年约 $294.66 billion（43.57% CAGR）。再往上一层，是一个更大、口径不同的估算：Gartner 把 2026
              年嵌入所有企业软件中的智能体 AI 能力支出定为 $201.9 billion——不只计算独立智能体供应商——约为独立口径数字的 25
              倍，因为它把现有应用里的内嵌助手和智能体功能也算进去。这个差异是计量边界问题，不是事实冲突；Gartner 自己对 2026 年全球 AI 总支出的估计又进一步放大了边界复杂性：总额 $2.52
              trillion（同比增长 44%，约 $1.37 trillion 为基础设施、$452.5 billion 为软件、$588.6 billion 为服务），其中「agentic AI」子类别预计以 119%
              CAGR 从约 $15 billion 增长到 2029 年接近 $753 billion。Applied Compute 自己可触达的切片——企业智能体平台 + RL/后训练基础设施 +
              前线部署定制——位于独立到嵌入口径之间，但没有独立第三方估算把它单独拆出来；这个缺口应保留为明确尽调问题，而不是用编造数字填补。
