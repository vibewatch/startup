            body: >-
              Harvey 披露的 ARR 和用户规模解释了为什么投资人可能愿意为企业 AI 支付很高倍数。Applied Compute 尚未公开展示可比经济规模，因此 Harvey
              是方向上有用的可比，而不是干净的估值理由。
            calloutType: risk
