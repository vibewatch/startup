  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争压力是首要战略风险，因为控制平面故事正在迅速拥挤
        blocks:
          - type: paragraph
            body: >-
              Applied Compute 的核心卖点很有吸引力：用客户的评分器、数据和工作流后训练一个任务专属智能体，在该公司的具体用例上超过通用模型。问题在于，周边市场正从多个方向同时走向同一套企业智能体控制平面。AWS
              表示 Bedrock 已服务超过 100,000 家组织，现在又提供 AgentCore，以便安全地大规模运行智能体。OpenAI、Microsoft、Google、Salesforce 和 Palantir
              都在大型既有分发渠道之上，推销安全的企业智能体部署、治理或数字劳动力。Anthropic 自己的智能体指南也削弱了一个假设：并非每个工作流都需要重型 RL
              专业化栈；许多工作流用更简单的编排模式可能就够了。Applied Compute
              仍能在深度定制重要的场景获胜，但举证责任已经转为结果：它必须证明，自己的专精循环能比越来越强的平台默认能力带来显著更好的经济性或质量。
