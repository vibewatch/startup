  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Applied Compute 的相关性
    rows:
      - - 企业智能体平台与编排
        - 智能体构建平台、编排 / 运行时、智能体原生应用套件（例如 Agentforce 类产品）
        - 无工作流写入权限的消费者聊天机器人和个人效率副驾驶工具
        - 业务线负责人 + IT
        - Applied Compute 智能体部署进入的核心应用层
      - - RL / 后训练基础设施与评测框架
        - 强化学习微调、奖励模型 / 评分器构建、任务专属评测框架
        - 通用基础模型预训练算力和前沿实验室 R&D 本身
        - 数据科学 / ML 平台团队，通常与供应商共用
        - Applied Compute 声称的核心方法（RL 加定制评测框架）
      - - 前线部署定制与嵌入式工程服务
        - 按项目或包月顾问费计费的现场工程人力（FDEs/AREs、AWS FDE、Palantir FDE）
        - 没有 ML / 智能体专业化的通用系统集成商人力派遣
        - 业务线预算加采购 / 专业服务
        - Applied Compute 将其 FDE/ARE 结构营销为核心差异化
      - - 应用层垂直智能体（法律、编码、市场运营、招聘）
        - 嵌入单一工作流的领域专属智能体（Harvey、Cognition、DoorDash、Mercor）
        - 没有工作流集成的横向、无差异聊天助手
        - 领域职能负责人（总法律顾问、工程负责人、运营负责人、产品负责人）
        - Applied Compute 四个已披露具名案例研究所在位置
      - - 排除：通用模型 API 消费
        - 不计入核心细分
        - 按 token 计费、没有智能体评测框架或 RL 定制层的原始 LLM API 使用
        - IT / 财务，作为转嫁型基础设施成本
        - 相邻替代供应商可在其上构建，但不属于核心智能体供应商收入
      - - 排除 / 相邻：既有工作流与 RPA/CRM 软件
        - 不计入核心细分
        - 早于智能体式 AI 的规则型自动化和案件管理软件许可费
        - 业务线软件预算
        - 现状替代品和渠道竞争者；在竞争者章节覆盖
      - - 相邻：AI 算力 / 数据中心基础设施
        - 不计入核心细分
        - 支撑所有 AI 工作负载的 GPU 资本开支、电力和机房托管支出
        - 基础设施 / 云预算
        - 整个品类的资本强度约束，而非 Applied Compute 特定收入
    notes: 边界受证据约束，来自 Applied Compute 自身定位和第三方规模测算方法；“纳入 / 排除”反映被引用分析机构对自身估算的口径，而不是经审计的市场研究分类。
