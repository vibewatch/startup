            - 工具定义
            - 人工 QA 标签
            - 生产轨迹
          outputs:
            - 企业专属事实基准
        - label: Train 层
          detail: 面向专用模型的后训练与评估基础设施
          tone: positive
          modules:
            - RL 轨迹生成
            - 评分器 / 奖励函数
            - 自蒸馏
            - 评测框架
          outputs:
            - 客户专属检查点
        - label: Serve 层
          detail: 生产推理与训练时使用的同一套评测框架对齐
          tone: positive
          modules:
            - 单租户服务
            - VPC 部署
            - 并发 / 延迟调优
            - 检查点晋升
          outputs:
            - 线上智能体响应
        - label: Improve 层
          detail: 从运行时行为持续学习
          tone: positive
          modules:
            - 轨迹捕获
            - A/B 测试
            - Online RL / 自蒸馏
            - 回归检测
          outputs:
            - 更新后的模型和策略
        - label: Context 层
          detail: 与权重并行的 Remember / Refine / Retrieve 记忆系统
          tone: positive
          modules:
            - Contextbase
            - 记忆检索 API
            - 神经速查表
          outputs:
