      - number: '8.3'
        title: 可比背景说明高溢价 AI 估值有可能，但 Applied Compute 尚未拿出最佳可比公司背后的公开披露
        blocks:
          - type: paragraph
            body: >-
              当前文件中最有用的私有可比公司是 Harvey。CNBC 报道称，Harvey 截至 2026 年 1 月估值 $11 billion、ARR 约 $190
              million，这意味着私有市场愿意给拥有可见规模、强采用率和顶级投资人支持的企业 AI 公司极高倍数。这有助于证明，市场可以高价定价高溢价应用层 AI。但它不能证明 Applied Compute
              今天也应得到同样待遇。Harvey 的估值旁边有披露 ARR 和可见下游用户规模，Applied Compute 只有少数近期公开部署，且没有披露经济性。Palantir、Salesforce、Microsoft
              和 Alphabet 等上市公司锚点仍有用，但主要是披露和规模可比，而不是干净倍数可比。由此得到的情景框架是不对称的：如果私人尽调显示 ARR
              和可重复性远强于公开记录暗示，上行存在；但除非这些私人指标异常强，基准情形仍低于当前标记。这也是为什么这里更需要情景纪律，而不是对类别的名义热情。
