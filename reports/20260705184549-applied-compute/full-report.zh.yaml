      - number: '1.3'
        title: 融资历史、估值与投资人基础
        blocks:
          - type: paragraph
            body: >-
              Applied Compute 已披露的融资经历了四个公开节点。Upstarts Media 最先以未公告独家消息报道，公司已融资 $20 million，估值 $100 million，由 Benchmark
              合伙人 Victor Lazarte 领投，Sequoia、Conviction、Hanabi Capital、Definition 和独立投资人 Zach Frankel
              也参与；另一篇二手文章（StartupsUnion）却把同一轮日期写成「June 2024」，比其他来源证实的 2025
              年创立时间早整整一年，这是一个尚未调和且很可能错误的日期，本文按原样记录而不悄悄修正。随后，The Information 约在 2025 年 9 月报道 Applied Compute 正洽谈按约 $500
              million 估值融资；公司又在 2025 年 10 月 29 日退出隐身状态，公开宣布来自 Benchmark、Sequoia、Lux Capital、Hanabi、Neo、Definition、Elad
              Gil、Victor Lazarte 和 Omri Casspi 的 $80 million 轮融资；独立媒体将融资后估值放在约 $700 million，但公司当时没有披露这个数字。到 2026 年 1
              月，The Information 又报道新一轮洽谈估值为 $1.3 billion，是三个月前 $500 million 数字的两倍多；公司在 2026 年 4 月 8 日确认完成 Kleiner
              Perkins 领投的 $80 million Series B（Elad Gil、Lux、Greenoaks、Neo 和 Hanabi 继续参与），使已披露总融资达到 $160 million。Applied
              Compute 自己的公告给出该数字，TechCrunch 也援引 PitchBook 数据独立印证。Latham & Watkins LLP 担任 Applied Compute 2026 年 4
              月融资的外部法律顾问。合起来看，公司估值不到一年约涨 13x；这种抬升速度本身就是尽调警示，独立于公司底层基本面。
