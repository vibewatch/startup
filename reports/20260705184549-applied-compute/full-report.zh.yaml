      - number: '3.2'
        title: 竞争对手画像：规模、融资、目标客户与战略方向
        blocks:
          - type: paragraph
            body: >-
              同一 12 个月窗口内，每个具名直接同行都披露了比 Applied Compute 更大、更新的融资轮。Harvey 在 2026 年 3 月按 $11B 估值融资 $200M，由 GIC 和 Sequoia
              联合领投，并称其律所和法律部门客户运行了超过 25,000 个定制智能体。Sierra 在 2026 年 5 月按 $15.8B 估值融资 $950M，是本组最大一轮；公司在八个季度内 ARR 突破
              $150M，并拥有超过 40% 的 Fortune 50 作为客户；创始人 Bret Taylor 称 Sierra 的收入比第二大竞争对手「大出数倍」。Decagon 在 2026 年 1 月完成 $250M
              Series D，估值增至 $4.5B，是六个月前 $131M Series C（$1.5B 估值）的三倍，并列出 Avis、Hertz、Block、Affirm、Duolingo 和 Oura
              等具名客户。Devin 编码智能体的开发商 Cognition 于 2025 年 9 月按 $10.2B 估值融资 $400M，披露 ARR 在一年内从约 $1M 升至
              $73M；同一季度还伴随裁员报道和高强度工作时长预期。Glean 完成 $150M Series F，估值 $7.2B，并将自己定位为横向构建 / 部署 / 编排层，而不是单一垂直楔子。


              三家平台既有玩家竞争的是分发，而不是垂直深度。OpenAI 目前报告企业收入占总收入超过 40%，并在 AgentKit 开发者工具之外推进跨系统「Frontier」编排层，背后还有与
              McKinsey、BCG、Accenture 和 Capgemini 的「Frontier Alliances」合作。Salesforce 的 Agentforce 在 2026 财年 Q4 达到约 $800M
              ARR（同比增长 169%），已完成超过 29,000 笔交易，不过超过 60% 的预订来自现有客户扩张，而不是净新客户。Microsoft 的 Copilot Studio 已被超过 230,000
              个组织采用来构建定制智能体，并作为 Microsoft 365 和 Teams 订阅中的低代码附加项分发。独立买方指南指出，即便在两个最接近的客服同行中，Decagon 更偏向客户自有工程集成，Sierra
