      - number: '8.2'
        title: 正面论点是客户质量证据强；反面论点是溢价价格下证据不透明
        blocks:
          - type: paragraph
            body: >-
              看多逻辑很容易理解。Applied Compute 在 DoorDash 和 Cognition 有可信客户证明，在 Mercor 和 Harvey 有基准可信度，创始人履历强，投资人叙事也契合企业 AI
              价值可能沉淀的位置。如果这些早期部署是可重复专业化平台的前沿，当前价格最终可能显得温和。看空逻辑更迫近。几乎所有硬商业问题在公开材料里仍无答案：ARR、现金消耗、毛利率、NRR、合同规模和轮次结构都缺失。ZenML
              对 DoorDash 案例经济性的质疑抓住了核心问题：技术证明质量不等于承销证明质量。公开证据目前支持一家高质量公司，但还没有充分支持 $1.3 billion
              公允价值结论。换句话说，市场标记方向可能没错，但证据基础仍不足以支撑精确判断。
