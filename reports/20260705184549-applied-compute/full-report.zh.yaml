  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Applied Compute 方案
      - 可衡量收益
      - 限制
    rows:
      - - DoorDash 商户菜单入驻
        - 人工专家核查混乱的菜单输出，QA 标签在自动提取后捕捉质量问题
        - 用专家 QA 标签构建校准过的评分器，再按 DoorDash 质量标准对纠错模型做 RL 训练
        - 低质量菜单相对下降约 30%，模型已覆盖美国全部菜单流量
        - 收益来自公司和案例研究证据；公开成本节省和误报率未披露
      - - Cognition / Windsurf 实时 bug 检测
        - 前沿模型能发现隐蔽 bug，但对即时 IDE 反馈可能太慢或太贵
        - 在 RL 中复刻生产测试框架，训练一个与产品延迟约束对齐的专用 bug 检测模型
        - 速度约为 Opus 4.6 的 10x，分布内 delta F1 差距从 0.09 收敛到 0
        - 分布外差距仍非零，因此专用化改善但没有消除前沿模型取舍
      - - 使用 Mercor 数据的专业工作智能体
        - 通用模型在长周期法律、咨询和银行任务上表现吃力
        - 用专家标注任务、长周期 RL 和轨迹可观测性，对小型专用模型做后训练
        - 总体 Pass@1 和平均分几乎翻倍；引用实验中的公司法 Pass@1 增至三倍
        - 证据以基准测试为中心，而不是客户生产 ROI
      - - 企业记忆 / 上下文管理
        - 机构知识散落在文档、轨迹和业务专家（SME）手中，而不是可复用智能体记忆
        - Remember / Refine / Retrieve 构建 Contextbase，并把相关记忆回灌给运行时智能体
        - 引用基准测试中，GPT-5.4 APEX-Agents 分数从 44.2% 升至 51.7%；内部 ACL-Wiki 记忆关键性约翻倍
        - 多数证据来自公司自撰内容和基准测试，不是第三方生产遥测数据
    notes: 每行都把一个真实客户或基准测试工作流映射到 Applied Compute 描述的产品介入。指标按引用公开来源原样记录，不应泛化到所有客户。
