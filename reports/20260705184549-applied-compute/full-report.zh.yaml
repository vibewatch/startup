      - number: '3.4'
        title: 切换成本、锁定、多供应商并用与分发能力
        blocks:
          - type: paragraph
            body: >-
              这个竞争格局中的切换成本来自三种不同机制，而不是单一来源。第一，前线部署或托管工程交付——Sierra、Decagon，以及（按公司概览）Applied Compute 自己的 FDE/ARE
              模式都采用——会把供应商员工嵌入客户运营工作流，实际切换成本因此高于简单软件切换。第二，数据重力：Harvey 的 Vault 和 Knowledge 模块会在 Harvey
              平台内存储并索引律所自己的文档和先例；切换意味着重新索引一家律所的机构知识，而不仅是换一个模型端点。第三，打包和分发能力：Salesforce 和 Microsoft 可以把智能体工具附着到客户每年本来就会签的
              CRM 和 Microsoft 365 续约上，这种销售动作在结构上不同于每个独立专营供应商——包括 Applied Compute——必须赢下的净新采购决策，也更低摩擦。


              模型层的多供应商并用，和应用层并不一样。Sierra 管理层称，其自有微调层之下运行着「一组」OpenAI 和 Anthropic 模型；这意味着 Sierra 的企业买方即便承诺使用 Sierra
              的应用层，也没有被锁定在单一基础模型供应商上。正是同一个多供应商选项，让内部自建对部分企业成为可信替代：原则上，拥有内部 ML 人才的公司可以直接基于 OpenAI 或 Anthropic
              API，复刻任何垂直同行技术栈的轻量版本。OpenAI 自己的 Frontier
              话术正是围绕这一张力展开，明确把能够「穿行于一家公司的系统和数据之间」的跨系统智能体，定位为比「嵌入单一产品内」的智能体更持久；Sierra 的 Bret Taylor 则把 Sierra 的 $950M
              融资描述为一项防御性动作，要「积极投资」并守住对大量资金充足对手的领先——这等于隐含承认，即便是被报道的品类领导者，也把多供应商并用和被替代视为现实风险。
            claimRefs:
              - CP037
              - CP038
              - CP039
              - CP040
              - CP041
