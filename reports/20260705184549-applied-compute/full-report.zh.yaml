      - number: '8.4'
        title: 决定性问题是私人尽调能否把叙事强度转化为经济证明
        blocks:
          - type: paragraph
            body: >-
              这笔投资首先不会败在产品质量上。它会失败于：在市场变得更竞争、更透明之前，明星案例没有及时转化为可重复经济性。因此，最终尽调极其关键。投资人需要当前 ARR、毛利率、NRR、客户集中度，以及 2026 年 4
              月轮次的精确结构，才能承销这个价格。没有这些，治理不透明和商业化风险就应该打折。Gartner 的智能体式 AI 项目取消警告，以及竞争对手定价透明度丰富，也进一步提高了一厢情愿的成本。如果尽调能证明
              Applied Compute 已接近高溢价私有 AI 倍数隐含的 ARR
              和留存门槛，当前标记可以辩护。否则，公司仍可能很优秀，但入场价依然偏贵。这个区分就是建议的核心。公司需要把技术声望转化为透明、可重复、耐久的经济性。
