    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Applied Compute, Inc. 是一家企业 AI 公司，打造其所谓的「Specific
              Intelligence」：专有智能体用客户自己的数据和工作流训练，部署到客户自身环境的生产系统中，并从真实使用轨迹中通过强化学习持续改进。多方来源共同证实，公司由三名前 OpenAI 研究员在 2025
              年创立；独立报道（TechStartups、Grokipedia）进一步将时间缩小到 2025 年 5 月。California Secretary of State 的备案记录和 Comcast
              NBCUniversal LIFT Labs 的投资组合页面都显示，公司总部位于 San Francisco，地址为 251 Rhode Island Street #207；监管备案还确认，该实体最初在
              Delaware 注册成立，并于 2025 年 10 月 10 日以外州股份公司身份在 California 登记，文件编号 B20250336266。商业上，Applied Compute
              自己的产品材料把平台描述为 Train、Serve、Improve
              三段式：在客户数据上对会用工具的智能体做后训练；在模型训练时使用的同一框架中提供低延迟生产推理；再从生产反馈中持续做在线强化学习。公司把自己的技术栈定位为「模型灵活」：客户以后可以换用更新的前沿基础模型，不必重建框架、数据管道或部署栈；公司还称，其工程师直接嵌入客户团队，而不是把开发外包。本轮研究没有把这些公司自述主张独立复核到客户内部工程流程层面。
