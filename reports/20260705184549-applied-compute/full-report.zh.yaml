  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓解措施 / 尽调问题
    rows:
      - - Applied Compute 的 RL 后训练和评测基础设施专长构成可防守的技术护城河
        - 超大云厂商（OpenAI Frontier）和资金充足的垂直既有厂商（Harvey、Sierra）正在自建或收购相近的内部后训练能力
        - 高
        - 跟踪 Harvey、Sierra 或 Cognition 是否披露内部 RL/后训练招聘，或随着时间推移减少对外部 RL 厂商的依赖
      - - Harvey、Cognition、DoorDash 等具名标杆客户验证了 Applied Compute 的路径
        - 这些客户本身估值正在迈向或已超过数十亿美元，能力转移完成后可能把 RL 后训练内化
        - 高
        - 向 Applied Compute 或其客户索取续约条款、排他性条款和多年承诺表述
      - - Applied Compute 定位在基础设施层，避开与垂直既有厂商的直接竞争
        - 垂直既有厂商自己的高管（Sierra 的 Bret Taylor）称正在内部搭建专有微调层，说明基础设施与应用的边界并不固定
        - 中
        - 尽调中厘清每个具名客户的模型 IP 有多少由 Applied Compute 训练，多少由客户自有团队完成
      - - 已募资本足以支撑 Applied Compute 当前客户基础和路线图
        - 直接同业在同一个 12 个月窗口内各自融资 $200M-$950M，估值达到 Applied Compute 已披露估值的 3x-12x
        - 高
        - 确认 Applied Compute 当前现金跑道、下一轮融资时间，以及算力成本是否比收入涨得更快
      - - 超大云厂商捆绑（Salesforce、Microsoft）正在把基础智能体构建工具商品化
        - 捆绑工具压缩点状解决方案的可服务市场，最终也可能削弱对外部 RL 专家的需求
        - 中
        - 监测超大云厂商套件是否开始纳入 RL/后训练定制，而不只是智能体编排
      - - 智能体 AI 的广泛市场需求支撑竞争集合的长期增长
        - Gartner 预计到 2027 年底，超过 40% 的智能体 AI 项目会被取消；Sierra 创始人也预期市场会修正并出现“出清效应”
        - 中
        - 把具名同业的续约率和扩张率（而不只是总预订额）作为判断需求韧性的领先指标
      - - Applied Compute 的前置部署工程模式创造了与垂直同业相似的切换成本
        - 独立评测显示，即便资金充足的同业（Devin）也仍有未解决的可靠性缺口，说明整个品类（包括 Applied Compute）的技术差异化还没有资金规模暗示的那么扎实
        - 中
        - 索取 Applied Compute 自身相对基线和竞品后训练方法的评测 / 基准测试结果，而不是只看客户证言
    notes: 严重性是基于证据的定性判断（高 / 中），不是评分指数；每行都引用了支撑该威胁的具体竞争对手披露或独立证据。
