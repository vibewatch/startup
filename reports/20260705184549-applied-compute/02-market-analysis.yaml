- calloutType: insight
  title: A 25x measurement gap, not a factual contradiction
  body: >-
    Gartner's $201.9B 2026 estimate for agentic-AI-embedded enterprise software and the ~$8.5-11.6B standalone AI-agent
    software estimates from Deloitte, Grand View, and Precedence are not competing claims about the same number -- they
    scope the market differently. Treat any single headline TAM for this space with suspicion until its boundary is stated.
