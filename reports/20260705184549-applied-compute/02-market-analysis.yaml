company:
  name: Applied Compute
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Applied Compute sells into the narrow but fast-moving market for enterprise AI agents and reinforcement-learning-based
    post-training/forward-deployed customization, a segment that four independent analyst firms size at roughly $7-11.6
    billion in 2026 even as Gartner's broader agentic-AI-embedded enterprise software estimate reaches $201.9 billion the
    same year; adoption is accelerating (42-72% of enterprises already piloting or running agents in production) but constrained
    by governance gaps, data readiness, and a well-documented pilot failure rate.
sections:
- id: market-boundary-and-definition
  title: 'Market boundary: what counts as enterprise AI agents'
  body: >-
    Applied Compute competes in enterprise AI agents and agentic software for internal business workflows, not the broader
    all-AI category. Its own material frames the opportunity as closing the "overhang" between a frontier model's raw capability
    and its realized utility inside one company's specific workflow, using two forward-deployed roles -- Forward Deployed
    Engineers (FDEs) who build evaluation harnesses and production environments, and Applied Research Engineers (AREs) who
    train and tune the underlying models. That places Applied Compute inside three overlapping spend categories: enterprise
    agent platforms and orchestration, reinforcement-learning post-training and evaluation-harness infrastructure, and forward-deployed
    customization labor. The same forward-deployed pattern -- pioneered by Palantir more than a decade ago and now productized
    as an AI agent inside Palantir Foundry -- is being copied at scale: AWS committed $1 billion in 2026 to a dedicated,
    agentic-first Forward Deployed Engineering unit serving named customers such as the NFL, the NBA, Cox Automotive, and
    Southwest Airlines. Excluded from this boundary are undifferentiated general-purpose model API consumption billed per
    token without an evaluation harness or RL customization layer, and incumbent workflow/RPA/CRM software that predates
    agentic AI; both are adjacent substitutes rather than core spend. Enterprises rarely choose only one path: 65% of surveyed
    technology leaders report a hybrid build-plus-buy architecture, with only about 10% relying on vendors alone, underscoring
    that internal build is a live substitute Applied Compute must displace deal by deal rather than a residual case.
  claimRefs:
