  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: sizing
    missingEvidence: >-
      A reconciled, boundary-consistent market-size number: current public estimates range from a ~$7.3-8.5B standalone
      2025-2026 figure across four analyst firms to a $201.9B 2026 figure from Gartner once embedded agentic capability
      is included, with no independent source isolating the agent-platform-plus-RL-infra-plus-forward-deployed-customization
      slice Applied Compute actually sells into.
    whyItMatters: >-
      Without a boundary-consistent number, any TAM/SAM figure used in a valuation model risks anchoring on the wrong lens
      (25x apart) and materially overstating or understating headroom.
    diligencePath: >-
      Commission or request a bespoke bottoms-up sizing scoped specifically to enterprise-agent-platform, RL/post-training
      infrastructure, and forward-deployed customization spend, and cross-check against Applied Compute's own disclosed
      contract values once available.
    relatedQuestionRefs:
    - QM030
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: funding-to-fte-linkage
    missingEvidence: >-
      A breakdown of how Applied Compute's disclosed $160M total funding and $1.3B valuation is allocated between forward-deployed
      customization headcount, RL/eval infrastructure, and general operations.
    whyItMatters: >-
      Forward-deployed labor is a cost-heavy, low-gross-margin GTM motion; understanding how much of the raised capital
      funds headcount versus infrastructure bears directly on unit economics and durability.
    diligencePath: >-
      Request Applied Compute's headcount mix (FDE/ARE vs. research vs. G&A) and burn rate from the company or a data room,
      since no public source discloses this breakdown.
    relatedQuestionRefs:
    - QM029
    relatedTableRefs: []
  - type: private-evidence-only
    severity: minor
    topic: customer-count
    missingEvidence: >-
      Applied Compute's total customer count and pipeline beyond the four named deployments (Harvey, Cognition, DoorDash,
      Mercor); its own fundraise post references working with 'enterprises across the F500' without naming additional customers.
    whyItMatters: >-
      Four named logos is a thin evidence base for judging whether the vertical mix in the buyer/segment map generalizes
      across the wider F500 pipeline the company claims to serve.
    diligencePath: >-
      Request a reference-customer list or aggregate deployment count directly from Applied Compute or from investor materials
      not available publicly.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TM003
  - type: stale
    severity: minor
    topic: sizing
    missingEvidence: >-
      Independently fetched primary reports for Fortune Business Insights and Deloitte's TMT Predictions; both figures in
      this chapter are cited via a secondary compilation (Software Strategies Blog) rather than the original publisher.
    whyItMatters: >-
      Secondary compilations can transcribe or round figures inconsistently, so these two data points carry lower confidence
      than the three directly fetched analyst-firm sources.
    diligencePath: >-
      Obtain direct access to the Fortune Business Insights and Deloitte TMT Predictions reports (both are paywalled/subscription
      products) to verify the compiled figures.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TM002
