- calloutType: risk
  title: The category has a well-documented failure rate
  body: >-
    Gartner expects over 40% of agentic AI projects to be canceled by 2027, and MIT-affiliated NANDA research found 95%
    of enterprise generative/agentic AI pilots fail to show measurable P&L impact. Applied Compute's three fully documented
    customer case studies are not, by themselves, evidence that it sits in the successful minority at scale.
  claimRefs:
  - CM025
  - CM029
- calloutType: strength
  title: Budget power is shifting toward the buyers Applied Compute already sells to
  body: >-
    Line-of-business leaders now match or exceed CIOs/CTOs in AI-tool budget influence (46% vs. 38% each), which favors
    a vendor whose forward-deployed model sells directly to a domain function leader (general counsel, engineering lead,
    ops lead) rather than needing to win central IT first.
