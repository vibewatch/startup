tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Applied Compute
  rows:
  - - Enterprise agent platforms & orchestration
    - >-
      Agent-building platforms, orchestration/runtime, agent-native app suites (e.g. Agentforce-type products)
    - Consumer chatbots and personal productivity copilots without workflow write-access
    - Line-of-business leaders + IT
    - Core application layer Applied Compute's agents are deployed into
  - - RL / post-training infrastructure & evaluation harnesses
    - Reinforcement-learning fine-tuning, reward-model/grader construction, task-specific eval harnesses
    - General foundation-model pre-training compute and frontier-lab R&D itself
    - Data science / ML platform teams, often shared with the vendor
    - Applied Compute's stated core method (RL plus custom evaluation harnesses)
  - - Forward-deployed customization & embedded engineering services
    - On-site engineering labor billed as project or retainer work (FDEs/AREs, AWS FDE, Palantir FDE)
    - Generic systems-integrator staffing without ML/agent specialization
    - Line-of-business budget plus procurement / professional services
    - Applied Compute markets its FDE/ARE structure as a core differentiator
  - - Application-layer vertical agents (legal, coding, marketplace ops, recruiting)
    - Domain-specific agents embedded in a single workflow (Harvey, Cognition, DoorDash, Mercor)
    - Horizontal, undifferentiated chat assistants with no workflow integration
    - Domain function head (general counsel, engineering lead, ops lead, product lead)
    - Where Applied Compute's four disclosed named case studies sit
  - - 'Excluded: general-purpose model API consumption'
    - Not counted in core segment
    - Raw LLM API usage billed per token with no agent harness or RL customization layer
    - IT / finance as a pass-through infrastructure cost
    - Adjacent substitute vendors can build on top of, not core agent-vendor revenue
  - - 'Excluded / adjacent: incumbent workflow & RPA/CRM software'
    - Not counted in core segment
    - License fees for rules-based automation and case-management software predating agentic AI
    - Line-of-business software budget
    - Status-quo substitute and channel competitor; covered in the Competitors chapter
  - - 'Adjacent: AI compute / data-center infrastructure'
    - Not counted in core segment
    - GPU capex, power, and colocation spend underlying all AI workloads
    - Infrastructure / cloud budget
    - Capital-intensity constraint on the whole category rather than Applied Compute-specific revenue
  notes: >-
    Boundary is evidence-constrained from Applied Compute's own positioning plus third-party sizing methodologies; "included/excluded"
    reflects how the cited analyst firms scope their own estimates, not an audited market-research taxonomy.
