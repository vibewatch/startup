chapter:
  number: 6
  title: Customers
  summary: Applied Compute has credible early customer proof in DoorDash and Cognition, plus strategically important design-partner relationships in Mercor, Harvey, Bridge, and Latch Bio. The main gap is not logo quality but missing disclosure on concentration, retention, and whether today’s high-touch wins can scale into diversified recurring revenue.
sections:
- id: customer-roster-and-segmentation
  title: Named roster shows real vertical breadth, but proof depth varies sharply by account
  body: 'Applied Compute has progressed beyond anonymous logo slides. Its homepage names Cognition, DoorDash, Mercor, Harvey, Bridge, and Latch Bio, and the public case-study set fills in four distinct deployment archetypes: merchant onboarding at DoorDash, real-time bug detection inside Windsurf for Cognition, benchmark-driven professional-work specialization with Mercor, and legal-agent post-training with Harvey. That means the buyer/user/payer map is already diversified across product teams, engineering leads, operations teams, and domain-expert organizations. The common pattern is not a single horizontal seat sale; it is a specialized workflow inside a sophisticated customer that already has strong internal definitions of quality. The trade-off is that the public proof is uneven. DoorDash and Cognition look like genuine production deployments, Mercor and Harvey clearly look like high-value design partners, while Bridge and Latch Bio are presently best treated as testimonial-backed customer
    signals with limited deployment disclosure.'
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU011
  - CU019
  - CU025
  - CU030
  - CU032
  - CU040
