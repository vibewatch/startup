tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - customer / segment
  - buyer / user / payer
  - use case
  - public scale signal
  - strategic value / gap
  rows:
  - - DoorDash
    - 'Buyer: merchant ML/product; user: onboarding and content systems; payer: DoorDash platform team'
    - Merchant onboarding, menu correction, merchant growth tooling
    - All U.S. menu traffic for the cited error-correction rollout; self-serve onboarding 35% faster
    - Best production proof; still missing contract value and renewal data
  - - Cognition / Windsurf
    - 'Buyer: engineering/product leadership; user: software engineers in IDE; payer: Cognition platform'
    - Real-time bug detection and specialized code review inside Windsurf
    - SWE-Check in production; broader Devin/Windsurf distribution claims
    - Strong production signal; no paid-seat or ARR contribution disclosed
  - - Mercor
    - 'Buyer: AI/product leadership; user: benchmark and data teams; payer: Mercor platform / enterprise budget'
    - Expert-data post-training and benchmark optimization
    - 874-task / 50-world dev set; benchmark depth is high
    - Looks like a valuable design partner, but commercial production scope is not disclosed
  - - Harvey
    - 'Buyer: AI research / product leadership; user: legal-product stack; payer: Harvey platform'
    - Legal-agent benchmark and model optimization
    - 142,000 lawyers across 1,500+ organizations rely on Harvey overall
    - Downstream scale is very large, but Applied Compute deployment depth inside Harvey product is not yet quantified
  - - Bridge
    - 'Buyer: support / operations leadership; user: support agents and SMEs; payer: fintech ops / product'
    - Support-ticket judgment capture and agent learning loop
    - Homepage testimonial only
    - Useful vertical proof in fintech; deployment scope and outcome metrics are absent
  - - Latch Bio
    - 'Buyer: research / benchmark leadership; user: biology-agent researchers; payer: platform / research budget'
    - Benchmarking and biology-agent evaluation
    - Homepage testimonial plus public scBench materials
    - Vertical proof exists, but the relationship is currently benchmark-led, not clearly production-led
  notes: Rows separate production deployments, benchmark/design-partner relationships, and testimonial-level proof. Strategic value reflects how much each customer expands Applied Compute’s total addressable workflow surface, not revenue contribution.
