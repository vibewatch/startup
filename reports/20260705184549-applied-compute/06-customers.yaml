callouts:
- calloutType: strength
  title: DoorDash and Cognition clear the “real production” bar
  body: Many enterprise-AI startups can show impressive pilots. DoorDash and Cognition matter because they connect Applied Compute to ongoing production systems with explicit outcome metrics, concrete workflow descriptions, and clear evidence that the model lives inside a customer product surface.
  claimRefs:
  - CU008
  - CU009
  - CU013
  - CU014
- calloutType: insight
  title: The best customers are also product co-designers
  body: Applied Compute’s most credible wins are not commodity seat sales. They are customers with strong internal graders, evaluators, expert workflows, or telemetry. That design-partner pattern is likely a moat in the near term, but it also means future scaling depends on how much of the engagement can be standardized.
  claimRefs:
  - CU003
  - CU015
  - CU022
  - CU037
- calloutType: risk
  title: Retention and concentration are still opaque
  body: The public customer set is impressive, but investors still cannot see revenue concentration, renewal cadence, or whether flagship logos represent large recurring contracts or a small number of research-heavy engagements. That makes chapter-6 conviction necessarily lower than the headline roster suggests.
  claimRefs:
  - CU034
  - CU035
  - CU038
  - CU039
