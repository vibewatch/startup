  - FU004
- id: concentration-and-go-to-market-risks
  title: The largest open questions are concentration, procurement friction, and a services-heavy motion
  body: 'The customer story is good enough to prove that Applied Compute can win sophisticated design partners, but not yet good enough to underwrite commercial durability. Most quantified outcomes come from company-authored case studies or customer-partner posts, not from independent customer-authored ROI material. The company does not disclose customer-count growth, revenue concentration, contract duration, renewal behavior, or whether its largest accounts are materially outsized. That matters because the public evidence also points to a services-intensive delivery model: Applied Compute says it embeds with customers, and Modal independently describes a deep engagement style around RL workloads. That can be a strength during the first wave of deployments, but it also raises scaling questions if every new account requires frontier-research attention. Independent adverse context reinforces the caution. CISA warns that agentic AI needs stronger oversight and Gartner’s 2026 service-ops agenda
    stresses that many pilots still need operating-model redesign and hard ROI proof before expansion. In practice, that means long sales cycles, slow security reviews, and a non-trivial risk that marquee logos overstate diversification.'
