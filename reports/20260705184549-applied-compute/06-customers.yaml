- id: production-adoption-and-outcomes
  title: DoorDash and Cognition provide the strongest production proof and the cleanest outcome metrics
  body: DoorDash and Cognition are the most important references because both connect Applied Compute to live product surfaces rather than isolated benchmarking. DoorDash ties the work to merchant activation and menu accuracy, reporting roughly a 30% relative reduction in low-quality menus and a rollout to all U.S. menu traffic. DoorDash’s own June 2026 launch materials then show that AI-assisted onboarding has become part of a broader merchant-growth system, with merchants launching more than 35% faster and AI-powered websites converting at nearly 10% on average. Cognition provides similarly strong product evidence. Both Applied Compute and Cognition say SWE-Check is in production inside Windsurf and delivers 10x faster bug detection than the frontier alternative, while Cognition’s broader product updates show that Windsurf/Devin is becoming a multi-agent command center with meaningful distribution. These are the clearest signs that Applied Compute can attach to customer workflows where
    latency, precision, and iteration speed matter enough to justify a custom specialization layer.
  claimRefs:
  - CU004
  - CU007
  - CU008
  - CU009
  - CU010
  - CU012
  - CU013
  - CU015
  - CU017
  - CU018
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: durability-and-expansion-potential
  title: Expansion potential is credible, but public durability evidence is still proxy-based
  body: The strongest expansion logic comes from the structure of the customer problems. DoorDash can apply the same merchant-quality infrastructure to onboarding, content, and ongoing merchant growth. Cognition can extend specialized models across local agents, cloud agents, review agents, and shared context surfaces. Harvey’s scale metrics suggest that a successful design-partner relationship could expose Applied Compute to a very large downstream usage base if benchmark gains feed live product modules. Mercor, Bridge, and Latch Bio each show adjacent verticals where customer-specific graders, expert data, or support judgments matter enough for post-training to be economically useful. But durability remains under-evidenced. Harvey’s 92% monthly adoption and 25+ hours saved are useful proxy metrics for the strength of the legal-AI end market, not direct proof of Applied Compute retention. Applied Compute discloses no NRR, GRR, churn, contract term, or share-of-wallet data, so the current
    public case for expansion is strategic and workflow-based rather than commercial and cohort-based.
  claimRefs:
  - CU010
  - CU016
  - CU018
  - CU022
  - CU028
  - CU029
  - CU031
  - CU033
  - CU038
  - CU040
