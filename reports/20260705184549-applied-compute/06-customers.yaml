- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Workflow adjacency inside DoorDash merchant stack
    - Single large account may account for disproportionate training/support load
    - Could create strong land-and-expand economics or hidden concentration
    - Request ARR by customer and by use case; verify whether additional DoorDash modules are live
  - - Multi-surface coding agents at Cognition / Devin
    - One flagship customer could dominate developer-tooling reference value
    - Could make future wins easier but revenue mix more fragile
    - Request contract scope, seat counts, and whether Applied Compute supports more than SWE-Check
  - - Scaled downstream adoption at Harvey
    - Benchmark win may not automatically convert into productized revenue
    - Strong option value if integrated, limited value if confined to eval work
    - Ask for checkpoint deployment scope and recurring revenue tied to Harvey engagement
  - - Vertical expansion into fintech and biology via Bridge and Latch Bio
    - Testimonial-level accounts may overstate deployable breadth
    - Helpful category signal, but not yet durable proof
    - Request deployment status, start dates, and named operator references
  - - Enterprise procurement and security review
    - Oversight, ROI proof, and operating-model redesign can slow expansions
    - Longer sales cycles and slower expansions than logo slides imply
    - Use security questionnaires, pilot-to-production funnel data, and sales-cycle timing in diligence
  - - Embedded frontier-research motion
    - High services intensity can cap account throughput
    - May constrain gross margin and speed if every account requires deep customization
    - Request implementation staffing ratios, time-to-launch distribution, and margin by engagement type
  notes: The key commercial question is not whether Applied Compute can win sophisticated logos; it is whether those logos convert into repeatable, diversified, and efficiently delivered revenue.
