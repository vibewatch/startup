      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Applied Compute was co-founded by Yash Patil, Rhythm Garg, and Linden Li, all Stanford University alumni
              who left technical roles at OpenAI to start the company. Patil was a key member of OpenAI's agentic Codex
              software-engineering effort and serves as Applied Compute's CEO; Garg was a core contributor to OpenAI's
              o1, the first reinforcement-learning-trained reasoning model; and Li worked on ML systems and
              infrastructure for reinforcement-learning training. Officer titles are not fully reconciled across
              sources: Applied Compute's California Secretary of State filing lists Rhythm Garg as Chief Financial
              Officer and Secretary, with Yash Patil as the sole listed Chief Executive Officer and registered agent,
              while Comcast NBCUniversal LIFT Labs' investor portfolio page instead lists Garg's title as Chief
              Technology Officer and Linden Li as Chief Architect. This is a genuine, unreconciled conflict in the
              sources reviewed rather than an editorial choice, and it is itself a governance-disclosure signal worth
              flagging: no independent, dated statement-of-officers document was located to settle it. The company's own
              account states that two-thirds of its team are former startup founders, including former top AI
              researchers and Math Olympiad winners, and Lux Capital's portfolio profile adds that team alumni include
              OpenAI reinforcement-learning-infrastructure veterans alongside people from Scale AI, Together, Two Sigma,
              and Watershed. No named executive beyond the three co-founders (e.g., a separate general counsel or head
              of sales) appears in any source reviewed, which is itself a key-person-dependence signal roughly a year
              into the company's life.
