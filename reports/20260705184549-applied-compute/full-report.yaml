      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Applied Compute's four disclosed enterprise deployments span four distinct verticals, each sponsored by a
              domain-function leader rather than a single horizontal buyer persona: legal (Harvey, where a jointly
              post-trained model outperformed Opus 4.8 Max and GPT-5.5 xhigh on Harvey's 1,250-task Legal Agent
              Benchmark), software engineering (Cognition, where the SWE-check bug-detection agent runs roughly 10x
              faster than the frontier model it replaced), marketplace operations (DoorDash, where an RL-trained grader
              corrected AI-generated merchant menus), and labor-marketplace evaluation (Mercor, where Applied Compute's
              own small model ranks #1 in corporate law and 4th overall on Mercor's APEX-Agents leaderboard per a
              company-hosted, not independently re-verified, case study). Budget ownership for this kind of deployment
              is shifting away from central IT: a 2026 survey of 266 Fortune 50-Global 2000 technology leaders found
              line-of-business leaders are now the largest AI-tool buying group at 46%, matching or surpassing CIOs
              (38%) and CTOs (38%) for the first time. The typical adoption path still runs through a procurement and
              governance gate before budget commitment -- 84% of enterprises require security/compliance sign-off as
              non-negotiable and 70% want a self-serve sandbox trial first -- which favors vendors like Applied Compute
              that can embed engineers directly with a workflow owner rather than sell a shrink-wrapped product to
              central IT alone.
