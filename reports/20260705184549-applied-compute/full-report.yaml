  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Competition, governance burden, and delivery-model scaling are the three highest residual risks after considering
      current public mitigations.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
      rows:
        - label: Competitive moat compression
          values:
