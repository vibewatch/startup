  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: what counts as enterprise AI agents'
        blocks:
          - type: paragraph
            body: >-
              Applied Compute competes in enterprise AI agents and agentic software for internal business workflows, not
              the broader all-AI category. Its own material frames the opportunity as closing the "overhang" between a
              frontier model's raw capability and its realized utility inside one company's specific workflow, using two
              forward-deployed roles -- Forward Deployed Engineers (FDEs) who build evaluation harnesses and production
              environments, and Applied Research Engineers (AREs) who train and tune the underlying models. That places
              Applied Compute inside three overlapping spend categories: enterprise agent platforms and orchestration,
              reinforcement-learning post-training and evaluation-harness infrastructure, and forward-deployed
              customization labor. The same forward-deployed pattern -- pioneered by Palantir more than a decade ago and
              now productized as an AI agent inside Palantir Foundry -- is being copied at scale: AWS committed $1
              billion in 2026 to a dedicated, agentic-first Forward Deployed Engineering unit serving named customers
              such as the NFL, the NBA, Cox Automotive, and Southwest Airlines. Excluded from this boundary are
              undifferentiated general-purpose model API consumption billed per token without an evaluation harness or
              RL customization layer, and incumbent workflow/RPA/CRM software that predates agentic AI; both are
              adjacent substitutes rather than core spend. Enterprises rarely choose only one path: 65% of surveyed
              technology leaders report a hybrid build-plus-buy architecture, with only about 10% relying on vendors
              alone, underscoring that internal build is a live substitute Applied Compute must displace deal by deal
              rather than a residual case.
            claimRefs:
