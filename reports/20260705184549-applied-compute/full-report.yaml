  - id: FR002
    title: Risk transmission map
    type: dag
    layout: standard
    summary: >-
      Most risks transmit through a common chain: control burden or competitive pressure slows deployments, which
      weakens retention proof, compresses margins, and undermines valuation support.
    data:
      nodes:
        - id: r1
          label: Competitive pressure
          detail: Hyperscalers and suites narrow the differentiation window
        - id: r2
          label: Longer deployments
          detail: Security, compliance, and customization slow launches
        - id: r3
          label: Weaker proof
          detail: Fewer standardized success stories and thinner retention visibility
        - id: r4
          label: Margin / burn pressure
          detail: More research time and compute per deployment
        - id: r5
          label: Valuation stress
          detail: Harder to defend premium multiple without repeatable economics
      edges:
        - from: r1
          to: r3
          label: raises proof bar
        - from: r2
          to: r3
          label: slows scaling
        - from: r2
          to: r4
          label: adds services load
        - from: r3
          to: r5
          label: weakens story
        - from: r4
          to: r5
          label: compresses economics
    approximationNotes: >-
      The DAG is directional and causal rather than quantitative. It is meant to show why seemingly separate risks can
      reinforce one another.
    claimRefs:
      - CR016
      - CR017
      - CR019
      - CR030
      - CR032
      - CR041
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Applied Compute depends simultaneously on foundation-model vendors, infrastructure partners, flagship reference
      customers, and emerging regulatory frameworks.
    data:
      nodes:
        - id: d1
          label: Foundation models
          detail: External model roadmap and economics
        - id: d2
          label: Infrastructure partners
          detail: Cloud, sandbox, and execution layers
        - id: d3
          label: Flagship customers
          detail: DoorDash, Cognition, Mercor, Harvey as proof anchors
        - id: d4
          label: Governance frameworks
          detail: CISA, NIST, EU AI Act, buyer security reviews
        - id: d5
          label: Applied Compute revenue model
          detail: Customized launches, deployments, and expansions
      edges:
        - from: d1
          to: d5
          label: enables / compresses
        - from: d2
          to: d5
          label: supports delivery
        - from: d3
          to: d5
          label: drives proof and concentration
        - from: d4
          to: d5
          label: constrains adoption
        - from: d1
          to: d3
          label: raises internalization risk
    approximationNotes: >-
      The map isolates external dependencies most likely to affect revenue quality and commercial velocity. It does not
      attempt to represent every supplier or regulator.
    claimRefs:
      - CR003
      - CR008
      - CR029
      - CR036
      - CR037
      - CR039
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation moves from a real financing event through customer proof and evidence opacity to a track /
      research-more conclusion.
    data:
      nodes:
        - id: fact
          label: Unicorn fact
          detail: $1.3B financing mark is publicly corroborated
        - id: proof
          label: Customer proof
          detail: DoorDash and Cognition show real product value
        - id: gap
          label: Economic opacity
          detail: ARR, margin, NRR, and round terms remain undisclosed
        - id: output
          label: Track / research more
          detail: Price is under-supported without private diligence
      edges:
        - from: fact
          to: proof
          label: supported by
        - from: proof
          to: gap
          label: offset by
        - from: gap
          to: output
          label: leads to
    claimRefs:
      - CV001
      - CV003
      - CV033
      - CV036
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      The current $1.3B mark requires very different ARR levels depending on the multiple band an investor believes is
      justified.
    data:
      items:
        - label: 25x ARR premium band
          value: 52
        - label: 18x ARR premium-growth band
          value: 72.2
        - label: 12x ARR strong software band
          value: 108.3
        - label: 8x ARR disciplined growth band
          value: 162.5
        - label: 5x ARR hybrid / mature band
          value: 260
      yAxis:
        label: ARR needed for $1.3B EV proxy (USD M)
    approximationNotes: >-
      Values are reverse-engineered using valuation divided by assumed ARR multiple. They are sensitivity anchors, not
      disclosed ARR ranges for Applied Compute.
    claimRefs:
      - CV001
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      For a few illustrative ARR levels, fair value varies dramatically depending on whether Applied Compute deserves a
      hybrid, strong-software, or premium-growth multiple.
    data:
      items:
        - label: If ARR is $40M
          low: 200
          mid: 480
          high: 720
        - label: If ARR is $60M
          low: 300
          mid: 720
          high: 1080
        - label: If ARR is $80M
          low: 400
          mid: 960
          high: 1440
    approximationNotes: >-
      Low uses 5x ARR, mid uses 12x ARR, and high uses 18x ARR. These are illustrative valuation bands for scenario
      analysis, not market quotes.
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV038
      - CV039
