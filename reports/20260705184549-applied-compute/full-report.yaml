      - number: '3.4'
        title: Switching cost, lock-in, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Switching costs in this landscape come from three distinct mechanisms rather than one. First,
              forward-deployed or managed-engineering delivery -- used by Sierra, Decagon, and (per Company Overview)
              Applied Compute's own FDE/ARE model -- embeds vendor staff inside the customer's operational workflow,
              which raises the practical cost of switching beyond a simple software cutover. Second, data gravity:
              Harvey's Vault and Knowledge modules store and index a law firm's own documents and precedent inside
              Harvey's platform, so switching means re-indexing a firm's institutional knowledge, not just swapping a
              model endpoint. Third, bundling and distribution power: Salesforce and Microsoft can attach agent tooling
              to CRM and Microsoft 365 renewals their customers already sign every year, which is a structurally
              different and lower-friction sales motion than the net-new procurement decision every standalone
              specialist -- including Applied Compute -- must win.


              Multi-homing works differently at the model layer than at the application layer. Sierra's own leadership
              describes running a "constellation of" OpenAI and Anthropic models underneath its own fine-tuned layers,
              which means enterprise buyers of Sierra are not locked into one foundation-model vendor even though they
              are committed to Sierra's application layer. That same multi-homing option is exactly what makes internal
              build a credible substitute for some enterprises: a company with in-house ML talent can, in principle,
              replicate a lightweight version of any vertical peer's stack directly on OpenAI or Anthropic APIs.
              OpenAI's own Frontier pitch is built around this exact tension, explicitly positioning cross-system agents
              that "move across a company's systems and data" as more durable than agents "embedded within a single
              product," while Sierra's Bret Taylor frames Sierra's $950M raise as a defensive move to "invest
              aggressively" and hold its lead against a large number of well-funded rivals -- an implicit acknowledgment
              that even the reported category leader sees multi-homing and displacement as live risks.
            claimRefs:
              - CP037
              - CP038
              - CP039
              - CP040
              - CP041
              - CP042
      - number: '3.5'
        title: Moat durability, commoditization risk, and adverse competitor evidence
        blocks:
          - type: paragraph
            body: >-
              Applied Compute's core moat claim -- deep reinforcement-learning post-training and
              evaluation-infrastructure expertise -- faces a direct insourcing threat from two directions at once.
              Hyperscalers like OpenAI are pushing cross-system Frontier orchestration and their own post-training
              research budget, while richly funded vertical incumbents like Sierra openly describe building their own
              fine-tuned proprietary layers rather than buying that capability externally. Compounding this, Applied
              Compute's own proof points -- Harvey, Cognition, and DoorDash -- are themselves scaling toward or past
              multi-billion-dollar valuations, which gives exactly the customers used as evidence of product-market fit
              the balance-sheet capacity to insource RL post-training once the initial capability transfer is complete.
              The capital gap is stark: Sierra, Harvey, Decagon, and Cognition each raised single rounds of $200M-$950M
              at valuations 3x-12x larger than Applied Compute's own disclosed round within the same 12 months, giving
              every one of them more capital to bid for compute and research talent.


              Independent evidence adds further caution for the category as a whole, not just Applied Compute. Gartner
              forecasts that more than 40% of agentic-AI projects will be canceled by the end of 2027 on cost, value, or
              risk-control grounds -- a demand-side risk that compresses the addressable pipeline for every vendor
              profiled here. Independent 2026 testing of Cognition's Devin, one of the best-funded and most autonomous
              products reviewed, found real reliability gaps: roughly 78% success only on well-scoped bug fixes,
              unresolved security-vulnerability blind spots, and a documented cost floor near $500/month; Cognition
              itself laid off about 30 staff and offered buyouts to 200 more in August 2025 amid reports of demanding
              work-hour expectations, even as its valuation more than doubled the same quarter. Sierra's own founder
              publicly forecasts a market correction and a "culling effect" within roughly two years. Taken together,
              the read for Applied Compute is that its infrastructure-layer position avoids some head-to-head product
              competition, but it does not avoid the same capital-intensity, insourcing, and demand-durability risks
              that show up in its direct customers' and peers' own disclosures. One evidence gap remains genuinely open:
              no reviewed source clarifies whether DoorDash's parallel appearance as both an Applied Compute case study
              and an OpenAI enterprise customer reflects overlapping or entirely separate workloads.
