chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              Applied Compute, Inc. is an enterprise AI company that builds what it calls "Specific Intelligence":
              proprietary agents trained on a customer's own data and workflows, deployed into production within the
              customer's own environment, and continuously improved through reinforcement learning on real usage traces.
              Multiple sources corroborate a 2025 founding by three former OpenAI researchers, with independent
              reporting (TechStartups, Grokipedia) narrowing this to May 2025. California Secretary of State filing
              records and a Comcast NBCUniversal LIFT Labs portfolio page both place the company's headquarters in San
              Francisco, at 251 Rhode Island Street #207; the regulatory filing further confirms the entity was
              originally incorporated in Delaware and registered as a foreign stock corporation in California on October
              10, 2025, under document number B20250336266. Commercially, Applied Compute's own product materials
              describe a three-part platform - Train, Serve, and Improve - covering post-training of tool-using agents
              on customer data, low-latency production inference in the harness the model was trained in, and continuous
              online reinforcement learning from production feedback. The company markets its stack as "model-flexible,"
              letting customers swap in newer frontier base models later without rebuilding their harness, data
              pipeline, or deployment stack, and states that its own engineers embed directly with customer teams rather
              than outsourcing development. These are company-sourced claims not independently re-verified against a
              customer's internal engineering process in this pass.
