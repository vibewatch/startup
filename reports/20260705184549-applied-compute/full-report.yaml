  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The financing fact is real, but the public record supports “track / research more” rather than a clean buy
        blocks:
          - type: paragraph
            body: >-
              Applied Compute clearly crossed the unicorn threshold: the company itself announced an $80 million
              financing at a $1.3 billion post-money valuation, and TechCrunch independently corroborated the same
              valuation and total funding to date. That validates the market mark. What it does not validate is whether
              $1.3 billion is already a fair entry point for a new investor. Public evidence supports high product
              ambition, credible flagship customers, and unusually strong case-study outcomes for such a young company.
              But it does not support a conviction price call because revenue, margin, retention, and customer
              concentration remain undisclosed. That makes valuation sensitivity the governing framework. At this price,
              even generous ARR multiple assumptions require meaningful scale that the public record does not yet show.
              The most honest recommendation from public evidence alone is therefore to track the company closely and
              move only if private diligence reveals stronger economics or price discipline improves. Public investors
              would normally demand this missing context before treating a financing headline as a durable valuation
              anchor.
