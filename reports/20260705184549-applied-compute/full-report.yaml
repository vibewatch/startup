      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption is accelerating on several fronts at once. Gartner expects up to 40% of enterprise applications
              to carry task-specific agents by the end of 2026 (up from under 5% in 2025), McKinsey finds 88% of
              organizations now report regular AI use in at least one business function, and a 2026 CXO survey finds 42%
              of enterprises already run agentic AI in production (72% combined production-plus-pilot). The
              forward-deployed engineering model going mainstream at AWS and Palantir is itself a driver: it validates
              Applied Compute's FDE/ARE structure as an industry pattern, though it also signals that hyperscalers may
              compete directly for the same accounts. Constraints are equally concrete. Only one in five companies has a
              mature agent-governance model per Deloitte, and Gartner expects 40% of enterprises to demote or
              decommission autonomous agents by 2027 once governance gaps surface in production. Data readiness remains
              the top-cited blocker for a fifth consecutive year (58% of surveyed CXOs), and the return-on-investment
              bar is unforgiving: Gartner expects more than 40% of agentic AI projects to be canceled by 2027, and
              MIT-affiliated NANDA research found 95% of enterprise generative/agentic AI pilots fail to show measurable
              P&L impact, with vendor-partnered deployments succeeding roughly twice as often as purely internal builds.
              Layered under all of this is a capital-intensity constraint common to any RL-heavy vendor: the IEA
              projects data-center electricity consumption will nearly double to about 945 TWh by 2030, and Goldman
              Sachs projects global data-center power demand will rise 165% by 2030 versus 2023, a cost and supply
              backdrop that affects the price and availability of the compute Applied Compute's training and evaluation
              work depends on.
