              $1M to $73M within a year, alongside reported layoffs and demanding working-hour expectations the same
              quarter. Glean raised a $150M Series F at a $7.2B valuation and positions itself as a horizontal
              build/deploy/orchestrate layer rather than one vertical wedge.


              The three platform incumbents compete on distribution rather than vertical depth. OpenAI now reports
              enterprise revenue above 40% of its total and is pushing a cross-system "Frontier" orchestration layer
