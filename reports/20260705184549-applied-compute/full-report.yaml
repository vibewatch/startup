          modules:
            - Contextbase
            - Memory retrieval APIs
            - Neural cheat-sheets
          outputs:
            - Reusable institutional knowledge
        - label: Governance layer
          detail: Company-claimed security controls plus external guardrail need
          tone: warning
          modules:
            - SOC 2 (claimed)
            - RBAC and audit logs
            - Oversight / hardening requirements
          outputs:
            - Enterprise deployment control
    approximationNotes: >-
      Layer boundaries are reconstructed from Applied Compute’s homepage, research posts, and customer cases. The
      governance layer intentionally mixes company-claimed controls with independently evidenced guardrail needs because
      the public verification surface is incomplete.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE007
      - CE010
      - CE011
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      Across customers, Applied Compute follows a repeatable flow from expert judgment capture to production deployment
      and continuous improvement.
    data:
      nodes:
        - id: problem
          label: Customer problem and quality bar
          detail: A domain-specific task with measurable failure modes
          tone: neutral
        - id: signals
          label: Collect data, traces, and labels
          detail: Internal docs, QA labels, expert tasks, or production traces
          tone: positive
        - id: grader
          label: Build harness and grader
          detail: Encode what “good” looks like in the customer’s environment
          tone: positive
        - id: train
          label: Post-train specialized model
          detail: RL and/or self-distillation against the customer objective
          tone: positive
        - id: deploy
          label: Serve in production
          detail: Launch inside the customer workflow with latency and security constraints
          tone: positive
        - id: improve
          label: Capture traces and improve
          detail: Use production behavior, evals, and monitoring to update the system
          tone: positive
      edges:
        - from: problem
          to: signals
          label: define judgment and data
        - from: signals
          to: grader
          label: turn expertise into rewards
        - from: grader
          to: train
          label: score rollouts
        - from: train
          to: deploy
          label: promote best checkpoint
        - from: deploy
          to: improve
          label: observe real usage
        - from: improve
          to: signals
          label: feed back new traces
    claimRefs:
      - CE007
      - CE009
      - CE014
      - CE015
      - CE016
      - CE018
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Applied Compute depends on customer environments, inference infrastructure, trace quality, and guardrails; failure
      at any node transmits directly to production reliability.
    data:
      nodes:
        - id: core
          label: Applied Compute platform
          detail: Train / Serve / Improve control plane
          tone: neutral
        - id: customer
          label: Customer data + harness
          detail: Proprietary docs, tools, evals, and SMEs
          tone: neutral
        - id: infra
          label: Sandbox / compute infrastructure
          detail: Rollouts, grading fan-out, inference capacity
          tone: neutral
        - id: memory
          label: Trace and memory quality
          detail: Remember / Refine / Retrieve and context compression
          tone: neutral
        - id: routing
          label: Model routing / orchestration
          detail: Selecting the right model or workflow for the task
          tone: neutral
        - id: security
          label: Guardrails and security hardening
          detail: Oversight against reward hacking, unsafe tool use, and drift
          tone: warning
        - id: outcome
          label: Production agent outcome
          detail: Customer-facing quality, latency, and reliability
          tone: positive
      edges:
        - from: customer
          to: core
          label: defines objectives
        - from: infra
          to: core
          label: supports rollouts and serving
        - from: memory
          to: core
          label: improves context
        - from: routing
          to: core
          label: optimizes cost-quality mix
        - from: security
          to: core
          label: constrains safe operation
        - from: core
          to: outcome
          label: deploys specialized agent
        - from: security
          to: outcome
          label: reduces exploit surface
        - from: memory
          to: outcome
          label: improves recall and consistency
    approximationNotes: >-
      The graph is qualitative rather than quantitative. It is intended to show transmission pathways, not a weighted
      causal model.
    claimRefs:
      - CE012
      - CE013
      - CE022
      - CE023
      - CE024
      - CE033
      - CE034
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Training, serving, and specialization are the most evidenced capabilities; public trust, self-serve tooling, and
      independent verification are the weakest.
    data:
      columns:
        - Maturity
        - Evidence strength
        - Diligence gap
      rows:
        - label: Customer-specific post-training
          values:
            - label: high
              tone: positive
              detail: Repeated across homepage, Modal, DoorDash, Cognition, and Mercor
            - label: strong
              tone: positive
              detail: Multiple concrete cases with metrics or workflow detail
            - label: medium
              tone: neutral
              detail: No public price, win-rate, or customer-count disclosure by module
        - label: Agent serving / deployment
          values:
            - label: medium-high
              tone: positive
              detail: Core homepage module plus inference benchmark and staleness research
            - label: medium
              tone: neutral
              detail: Evidence is detailed but still mostly company-authored
            - label: high
              tone: warning
              detail: No public uptime, SLA, or incident-history evidence found
        - label: Context / memory system
          values:
            - label: medium-high
              tone: positive
              detail: Substantial 2026 research output and internal deployment story
            - label: medium
              tone: neutral
              detail: Benchmark and internal gains are specific, but third-party validation is limited
            - label: medium-high
              tone: warning
              detail: Need external customer proof that Contextbase quality persists outside AC benchmarks
        - label: Developer surface / public tooling
          values:
            - label: medium-low
              tone: warning
              detail: One public repo and no visible public members on GitHub
            - label: medium-low
              tone: warning
              detail: Public benchmark harness exists, but breadth of API / SDK productization is unclear
            - label: high
              tone: warning
              detail: Request product docs, SDK maturity, and support model under NDA
        - label: Security / trust verification
          values:
            - label: medium
              tone: neutral
              detail: Claims are plausible and standard for enterprise AI
            - label: low-medium
              tone: warning
              detail: Public evidence is mostly marketing copy plus external general-risk guidance
            - label: high
              tone: warning
              detail: Need trust-center artifacts, certification scope, and incident / audit history
    claimRefs:
      - CE006
      - CE015
      - CE019
      - CE023
      - CE035
      - CE036
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      The customer path starts with a high-stakes workflow, moves through a specialist training engagement, and then
      expands only if the model earns trust inside production systems.
    data:
      nodes:
        - id: problem
          label: High-stakes workflow
          detail: Merchant onboarding, bug review, legal research, support judgment, or biology evaluation
        - id: pilot
          label: Embedded evaluation / training
          detail: Customer graders, harnesses, traces, or expert datasets define success
        - id: production
          label: Production deployment
          detail: Model lands inside a live product surface such as Windsurf or DoorDash onboarding
        - id: expand
          label: Expansion loop
          detail: More workflows, more users, or more frequent retraining as telemetry accumulates
