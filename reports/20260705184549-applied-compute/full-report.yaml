  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Specific Intelligence is a managed specialization layer, not a general-purpose model API
        blocks:
          - type: paragraph
            body: >-
              Applied Compute defines the product in concrete workflow terms as a cloud for training, inference, and
              continuous improvement rather than as a standalone base model. The homepage breaks the platform into
              Train, Serve, and Improve: customers bring their own data, harnesses, and graders; Applied Compute
              post-trains tool-using agents across text, images, code, and structured data; and the resulting model is
              then served in production and updated from live feedback. The company repeatedly frames this as a
              specialization layer that sits above commoditizing frontier models, allowing the customer to keep its own
              reward functions, evals, and memory rather than outsourcing intelligence to a single upstream
              foundation-model vendor. That framing is consistent across the homepage, the fundraise post, the Modal
              customer story, and later technical research posts. Importantly, the platform is pitched as model-flexible
              rather than model-monolithic: Applied Compute says customers can train from the best available base model
              and later upgrade without rebuilding the harness, data pipeline, or deployment stack. In practice, that
              means the product promise is less “we have the best foundation model” and more “we help enterprises turn
              proprietary judgment into a durable, reusable training-and-deployment loop.”
