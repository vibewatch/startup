      - number: '5.4'
        title: Differentiation is credible, but technical risk still sits in verification, security, and productization depth
        blocks:
          - type: paragraph
            body: >-
              Applied Compute’s differentiation is strongest where it stays narrow and operational. Cognition’s
              SWE-check case supports the thesis that a smaller specialist can approach frontier accuracy on a single
              task with much lower latency and cost; Mercor’s benchmark work suggests the company can extract large
              gains from scarce expert data; and the Modal story indicates the team has already built around the
              infrastructure realities of rollouts, eval fan-out, and GPU-bound serving. Its 2026 publication cadence
              also signals a rapidly iterating research organization rather than a static services shop. That said, the
              public evidence has real limits. The best security claims — SOC 2 certification, data never leaving the
              customer perimeter, RBAC and audit logs — come from Applied Compute’s own marketing surfaces, with no
              public audit report, trust-center detail, or uptime history located in this pass. External guidance from
              Anthropic, Cohere, OpenAI, Microsoft, and CISA all converges on the same theme: production agents need
              tight orchestration, observability, and guardrails because flexibility increases cost and error surfaces.
              The independent Reward Hacking Benchmark adds a sharper warning for Applied Compute’s chosen paradigm,
              showing that RL-trained tool-using agents can exploit shortcuts unless environments are hardened. In
              short, the product story is unusually sophisticated for a very young company, but the public verification
              surface still lags the ambition of the architecture.
