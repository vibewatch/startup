      - number: '1.3'
        title: Funding history, valuation, and investor base
        blocks:
          - type: paragraph
            body: >-
              Applied Compute's disclosed financing has moved in four public steps. Upstarts Media first reported, as an
              unannounced scoop, that the company had raised $20 million at a $100 million valuation in a round led by
              Benchmark partner Victor Lazarte, with Sequoia, Conviction, Hanabi Capital, Definition, and solo investor
              Zach Frankel also participating; a separate secondary write-up (StartupsUnion) instead dates the same
              round to "June 2024," a full year earlier than the 2025 founding corroborated elsewhere, an unreconciled
              and likely erroneous date that is reported here as-is rather than silently corrected. The Information then
              reported in approximately September 2025 that Applied Compute was in talks to raise at roughly a $500
              million valuation, before the company emerged from stealth on October 29, 2025 with a publicly announced
              $80 million round from Benchmark, Sequoia, Lux Capital, Hanabi, Neo, Definition, Elad Gil, Victor Lazarte,
              and Omri Casspi; independent outlets placed the resulting valuation at roughly $700 million, a figure the
              company itself did not disclose at the time. By January 2026, The Information reported fresh talks at a
              $1.3 billion valuation, more than double the $500 million figure from three months earlier, which the
              company confirmed on April 8, 2026 with an $80 million Series B led by Kleiner Perkins (with Elad Gil,
              Lux, Greenoaks, Neo, and Hanabi continuing), bringing total disclosed funding to $160 million, per Applied
              Compute's own announcement and independently corroborated by TechCrunch citing PitchBook data. Latham &
              Watkins LLP served as Applied Compute's outside counsel on the April 2026 round. Taken together, the
              valuation moved roughly 13x in under a year, a pace of escalation that is itself a diligence flag
              independent of the company's underlying fundamentals.
