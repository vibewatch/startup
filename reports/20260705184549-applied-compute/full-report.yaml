      - number: '2.2'
        title: 'Market sizing: multiple lenses, no single reliable TAM'
        blocks:
          - type: paragraph
            body: >-
              No single broad TAM figure is reliable for this market, so sizing has to stack several
              evidence-constrained lenses. Four independent market-research firms -- MarketsandMarkets, Grand View
              Research, Precedence Research, and Fortune Business Insights -- each size the standalone global "AI
              agents" software market within roughly a $7.3-8.5 billion band for 2025-2026, but disagree sharply on
              trajectory: MarketsandMarkets projects $52.62 billion by 2030 (46.3% CAGR), Grand View projects $182.9
              billion by 2033 (49.6% CAGR), and Precedence projects roughly $294.66 billion by 2035 (43.57% CAGR).
              Layered above that is a much larger and differently scoped estimate: Gartner sizes 2026 spending on
              agentic-AI capability embedded across all enterprise software -- not just standalone agent vendors -- at
              $201.9 billion, roughly 25 times the standalone figures, because it counts embedded assistants and agent
              features inside existing applications rather than dedicated agent platforms. That gap is a
              measurement-boundary problem, not a factual contradiction, and it is compounded by Gartner's own total
              worldwide AI spending estimate of $2.52 trillion for 2026 (44% year-over-year growth, split roughly $1.37
              trillion infrastructure, $452.5 billion software, $588.6 billion services), inside which the "agentic AI"
              sub-category alone is projected to compound at 119% CAGR from about $15 billion toward $753 billion by
              2029. Applied Compute's own addressable slice -- enterprise agent platforms plus RL/post-training
              infrastructure plus forward-deployed customization -- sits somewhere inside the standalone-to-embedded
              range but has no independent third-party estimate isolating it; that gap is preserved as an explicit
              diligence ask rather than resolved with an invented number.
