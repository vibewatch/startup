chapter:
  number: 3
  title: Competitors
  summary: Applied Compute occupies a reinforcement-learning post-training and evaluation-infrastructure layer rather than
    shipping a branded end-user agent, so its practical competitive set spans direct vertical peers (Harvey, Glean, Sierra,
    Decagon, Cognition/Devin), platform incumbents bundling agent tools into existing distribution (OpenAI, Salesforce Agentforce,
    Microsoft Copilot Studio), and an internal-build substitute path; every named direct peer raised a larger, richer round
    than Applied Compute in the same 12 months, and Harvey and Cognition are simultaneously named Applied Compute customers,
    underscoring both coopetition and insourcing risk.
sections:
- id: landscape-overview
  title: 'Landscape: direct peers, platform incumbents, and build-your-own substitutes'
  body: 'Applied Compute does not compete for the same purchase decision as most of the companies enterprises mention in the
    same breath as "AI agents." Its own public materials frame the company as a reinforcement-learning post-training and evaluation-infrastructure
    partner: it trains proprietary, task-tuned models for named customers such as Harvey, Cognition, and DoorDash, and those
    customers then ship the resulting agent themselves under their own brand. That makes the practical competitive set unusually
    layered. Direct vertical peers -- Harvey (legal), Glean (enterprise search/agents), Sierra and Decagon (customer service),
    and Cognition/Devin (software engineering) -- each own a branded end-user agent product in a specific domain. Platform
    incumbents -- OpenAI''s Frontier/AgentKit stack, Salesforce''s Agentforce, and Microsoft''s Copilot Studio -- bundle agent-building
    tools into existing developer platforms, CRM seats, or Microsoft 365 subscriptions enterprises already pay for. A public
    startup aggregator additionally lists dozens of smaller, earlier-stage entrants (LangChain, Agent Bricks, Manus AI, and
    others) circling the same broad space, though none carry the funding or named-customer evidence of the profiled direct
    peers.


    The most important nuance this chapter surfaces is coopetition: Harvey is simultaneously a disclosed Applied Compute collaboration
    customer for reinforcement-learning post-training of its legal agent, and an independently operating vertical incumbent
    that sells its own Assistant/Vault/Knowledge suite directly to law firms. The same forward-deployed-infrastructure-versus-branded-product
    distinction recurs with Cognition and DoorDash. Meanwhile, Sierra''s own leadership describes building on a "constellation
    of" third-party foundation models plus its own fine-tuned proprietary layers -- an internal-build substitute path that,
    if it spreads, would reduce demand for an external RL-post-training specialist like Applied Compute even among companies
    that do not build a competing branded product.'
