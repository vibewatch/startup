- id: competitor-profiles
  title: 'Competitor profiles: scale, funding, target customer, and strategic direction'
  body: 'Every named direct peer has disclosed a larger, more recent funding round than Applied Compute over the same 12-month
    window. Harvey raised $200M at an $11B valuation in March 2026, co-led by GIC and Sequoia, and reports more than 25,000
    custom agents run by its law-firm and legal-department customers. Sierra raised $950M at a $15.8B valuation in May 2026
    -- the largest of the group -- crossing $150M in ARR within eight quarters and counting more than 40% of the Fortune 50
    as customers; founder Bret Taylor describes Sierra as "multiples larger" than its next-biggest rival by revenue. Decagon
    tripled its valuation to $4.5B in a $250M Series D in January 2026, just six months after a $131M Series C at $1.5B, and
    lists named customers spanning Avis, Hertz, Block, Affirm, Duolingo, and Oura. Cognition, maker of the Devin coding agent,
    raised $400M at a $10.2B valuation in September 2025 with disclosed ARR climbing from about $1M to $73M within a year,
    alongside reported layoffs and demanding working-hour expectations the same quarter. Glean raised a $150M Series F at
    a $7.2B valuation and positions itself as a horizontal build/deploy/orchestrate layer rather than one vertical wedge.


    The three platform incumbents compete on distribution rather than vertical depth. OpenAI now reports enterprise revenue
    above 40% of its total and is pushing a cross-system "Frontier" orchestration layer alongside AgentKit developer tooling,
    backed by "Frontier Alliances" partnerships with McKinsey, BCG, Accenture, and Capgemini. Salesforce''s Agentforce reached
    roughly $800M in ARR in fiscal Q4 2026 (up 169% year-over-year) with more than 29,000 deals closed, though over 60% of
    bookings came from expansion inside its existing customer base rather than net-new wins. Microsoft''s Copilot Studio has
    been adopted by more than 230,000 organizations to build custom agents, distributed as a low-code add-on inside Microsoft
    365 and Teams subscriptions. Independent buyer guides note that even among the two closest customer-service peers, Decagon
    leans toward customer-owned engineering integration while Sierra leans toward a fully managed, forward-deployed delivery
    model -- a difference in delivery mechanism, not in underlying model technology.'
