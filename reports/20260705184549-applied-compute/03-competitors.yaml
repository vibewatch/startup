  rows:
  - - Applied Compute
    - RL post-training / agent infrastructure (subject company)
    - ~$1.3B valuation per its own April 2026 raise (see Company Overview); far smaller than peers below
    - Enterprises needing custom RL post-training for their own agents (Harvey, Cognition, DoorDash, Mercor)
    - Trains customer-owned models via forward-deployed RL/eval infrastructure rather than shipping a branded end-user agent
    - No disclosed public pricing, small named-customer base, and some named customers are themselves well-funded potential
      insourcers
  - - Harvey
    - Direct vertical peer (legal)
    - $200M raised at $11B valuation, March 2026
    - Law firms and corporate legal departments
    - Unified Assistant/Vault/Knowledge suite; 25,000+ customer-run custom agents disclosed
    - No public list pricing; also a disclosed Applied Compute customer for RL post-training, blurring pure-competitor framing
  - - Glean
    - Direct horizontal peer (enterprise search/agents)
    - $150M Series F at $7.2B valuation
    - Knowledge workers across functions inside large enterprises
    - Positions as a build/deploy/orchestrate layer across a company's existing knowledge and app stack
    - Broader horizontal scope may mean shallower vertical depth than Harvey, Sierra, or Decagon in any single domain
  - - Sierra
    - Direct vertical peer (customer service)
    - $950M raised at $15.8B valuation, May 2026
    - Large consumer brands and Fortune 50 enterprises
    - Managed forward-deployed delivery; over $150M ARR in 8 quarters; over 40% of Fortune 50 as customers
    - Managed-service model shifts iteration control to Sierra's own team rather than the buyer's engineers
  - - Decagon
    - Direct vertical peer (customer service)
    - $250M Series D at $4.5B valuation, January 2026
    - Consumer-facing brands in travel, fintech, health, and retail
    - '"Agent Operating Procedures" let CX teams write natural-language logic that compiles into governed code'
    - Requires more customer-side engineering integration than Sierra per independent buyer guides
  - - Cognition / Devin
    - Direct vertical peer (software engineering)
    - $400M raised at $10.2B valuation, September 2025; Devin ARR ~$73M (June 2025)
    - Engineering teams needing autonomous coding-agent throughput
    - Most autonomous coding agent among reviewed peers; sandboxed cloud dev environment
    - Independent 2026 testing found ~78% success only on well-scoped bug fixes and unresolved security-review gaps; reported
      layoffs and demanding culture in 2025
  - - OpenAI (Frontier / AgentKit)
    - Platform incumbent
    - Enterprise >40% of total revenue and targeting consumer parity by end-2026
    - Enterprises already building on GPT models; Oracle, State Farm, Uber named Frontier customers
    - Bundles model, AgentKit tooling, and a cross-system Frontier orchestration layer from one vendor
    - Enterprise agent orchestration is newer than Sierra/Decagon/Harvey's vertical products and less proven at their depth
  - - Salesforce (Agentforce)
    - Platform incumbent
    - ~$800M Agentforce ARR (+169% YoY); $2.9B combined with Data 360, FY26 Q4
    - Existing Salesforce CRM customers across sales, service, and industry clouds
    - Bundled into renewals across a 150,000+ customer install base; 29,000+ Agentforce deals closed
    - 60%+ of bookings are expansion within the existing base rather than net-new logos won from specialists
  - - Microsoft (Copilot Studio)
    - Platform incumbent
    - 230,000+ organizations building agents; 15M+ paid M365 Copilot seats, early 2026
    - Microsoft 365 and Teams enterprise customers
    - Low-code agent builder embedded directly inside subscriptions enterprises already renew
    - Adoption figures mix agent-builder usage with broader Copilot seat counts, making net incremental agent traction hard
      to isolate
  - - Internal build / general-purpose model stack
    - Substitute / status quo
    - Not applicable -- cost is enterprise's own engineering budget
    - Enterprises with in-house ML/engineering teams (e.g., Sierra's own "constellation of models" approach)
    - Full control over model choice, fine-tuning, and roadmap without vendor dependency
    - Requires in-house RL/ML expertise most enterprises lack, which is the gap Applied Compute and vertical peers both sell
      against
  notes: Funding and valuation figures are each vendor's own most recent public disclosure as of this run; Applied Compute's
    valuation is restated from Company Overview for comparison and not re-derived here.
