- id: switching-lockin-distribution
  title: Switching cost, lock-in, multi-homing, and distribution power
  body: 'Switching costs in this landscape come from three distinct mechanisms rather than one. First, forward-deployed or
    managed-engineering delivery -- used by Sierra, Decagon, and (per Company Overview) Applied Compute''s own FDE/ARE model
    -- embeds vendor staff inside the customer''s operational workflow, which raises the practical cost of switching beyond
    a simple software cutover. Second, data gravity: Harvey''s Vault and Knowledge modules store and index a law firm''s own
    documents and precedent inside Harvey''s platform, so switching means re-indexing a firm''s institutional knowledge, not
    just swapping a model endpoint. Third, bundling and distribution power: Salesforce and Microsoft can attach agent tooling
    to CRM and Microsoft 365 renewals their customers already sign every year, which is a structurally different and lower-friction
    sales motion than the net-new procurement decision every standalone specialist -- including Applied Compute -- must win.


    Multi-homing works differently at the model layer than at the application layer. Sierra''s own leadership describes running
    a "constellation of" OpenAI and Anthropic models underneath its own fine-tuned layers, which means enterprise buyers of
    Sierra are not locked into one foundation-model vendor even though they are committed to Sierra''s application layer.
    That same multi-homing option is exactly what makes internal build a credible substitute for some enterprises: a company
    with in-house ML talent can, in principle, replicate a lightweight version of any vertical peer''s stack directly on OpenAI
    or Anthropic APIs. OpenAI''s own Frontier pitch is built around this exact tension, explicitly positioning cross-system
    agents that "move across a company''s systems and data" as more durable than agents "embedded within a single product,"
    while Sierra''s Bret Taylor frames Sierra''s $950M raise as a defensive move to "invest aggressively" and hold its lead
    against a large number of well-funded rivals -- an implicit acknowledgment that even the reported category leader sees
    multi-homing and displacement as live risks.'
