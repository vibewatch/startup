  evidenceGaps:
  - type: missing-source
    severity: material
    topic: trust-regulatory-posture
    missingEvidence: A comparable, detailed compliance/certification matrix (SOC 2, ISO, sector-specific regulatory posture)
      across all nine profiled entities; reviewed public sources disclose security/trust claims inconsistently and not in
      a directly comparable format.
    whyItMatters: Trust and regulatory posture is one of this chapter's required comparison dimensions, and regulated buyers
      (law firms, financial services, healthcare) may weight it as heavily as capability or price.
    diligencePath: Request each vendor's current SOC 2/ISO attestations and sector-specific compliance documentation directly,
      since no reviewed public source assembles this comparably across all nine entities.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: minor
    topic: partner-access
    missingEvidence: Any disclosed distribution, channel, or systems-integrator partnership for Applied Compute comparable
      to OpenAI's named Frontier Alliances with McKinsey, BCG, Accenture, and Capgemini.
    whyItMatters: Distribution/partner access is one of this chapter's required comparison dimensions, and the absence of
      any disclosed channel partnership may indicate Applied Compute still relies entirely on direct, founder-led enterprise
      sales relative to platform incumbents' consultancy-driven distribution.
    diligencePath: Ask Applied Compute directly whether it has, or plans, any systems-integrator or consultancy distribution
      partnerships, since no public source discloses one.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs: []
  - type: conflicting-data
    severity: material
    topic: doordash-exclusivity
    missingEvidence: Clarification of whether DoorDash's Applied Compute engagement (merchant-onboarding RL post-training)
      and its appearance as an OpenAI enterprise customer building multi-agent systems cover the same, overlapping, or entirely
      separate internal workloads.
    whyItMatters: If DoorDash is building comparable agent capability directly on OpenAI's platform for other workloads, that
      is direct evidence of the insourcing/multi-vendor risk this chapter's moat-durability analysis flags, rather than an
      inference from indirect signals.
    diligencePath: Ask Applied Compute or DoorDash directly to scope which workloads are covered by each engagement, since
      neither company's public materials cross-reference the other's relationship with DoorDash.
    relatedQuestionRefs:
    - QP032
    relatedTableRefs: []
