- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation/diligence ask
  rows:
  - - Applied Compute's RL post-training and evaluation-infrastructure expertise is a defensible technical moat
    - Hyperscalers (OpenAI Frontier) and richly funded vertical incumbents (Harvey, Sierra) are building or buying comparable
      in-house post-training capability
    - high
    - Track whether Harvey, Sierra, or Cognition disclose in-house RL/post-training hires or reduce reliance on external RL
      vendors over time
  - - Named proof-point customers (Harvey, Cognition, DoorDash) validate Applied Compute's approach
    - The same customers are scaling toward or past multi-billion-dollar valuations and could insource RL post-training once
      capability transfer is complete
    - high
    - Request contract renewal terms, exclusivity clauses, and multi-year commitment language from Applied Compute or its
      customers
  - - Applied Compute's infrastructure-layer positioning avoids direct competition with vertical incumbents
    - Vertical incumbents' own executives (Sierra's Bret Taylor) describe building proprietary fine-tuned layers in-house,
      showing the infrastructure-vs-application boundary is not fixed
    - medium
    - Clarify in diligence how much of each named customer's model IP was trained by Applied Compute versus the customer's
      own team
  - - Capital raised to date supports Applied Compute's current customer base and roadmap
    - Direct peers raised $200M-$950M each within the same 12-month window at valuations 3x-12x Applied Compute's own disclosed
      valuation
    - high
    - Confirm Applied Compute's current runway, next-round timing, and whether compute costs are rising faster than revenue
  - - Hyperscaler bundling (Salesforce, Microsoft) commoditizes basic agent-building tooling
    - Bundled tools reduce the addressable market for point solutions and could eventually reduce demand for external RL specialists
      too
    - medium
    - Monitor whether hyperscaler bundles begin to include RL/post-training customization, not just agent orchestration
  - - Broad market demand for agentic AI supports durable growth across the competitive set
    - Gartner projects more than 40% of agentic-AI projects will be canceled by the end of 2027, and Sierra's own founder
      forecasts a market correction and "culling effect"
    - medium
    - Watch renewal and expansion rates (not just gross bookings) across named peers as a leading indicator of durable demand
  - - Applied Compute's forward-deployed engineering model creates switching costs similar to vertical peers
    - Independent reviews show even well-funded peers (Devin) have unresolved reliability gaps, suggesting technical differentiation
      across the whole category, including Applied Compute, is less proven than funding levels imply
    - medium
    - Request Applied Compute's own eval/benchmark results against baseline and competing post-training approaches, not just
      customer testimonials
  notes: Severity is an evidence-based qualitative judgment (high/medium), not a scored index; each row cites the specific
    competitor disclosure or independent evidence supporting the threat.
