- id: TP003
  title: Pricing / packaging comparison
  columns:
  - vendor
  - pricing model
  - price/tier signal
  - included capabilities
  - discount or unknowns
  - implication
  rows:
  - - Applied Compute
    - Custom engagement (implied)
    - No public price card disclosed
    - RL post-training, evaluation/grading infrastructure, harness engineering
    - Full pricing structure unknown; only collaborative case studies disclosed
    - Buyers cannot benchmark Applied Compute's cost against peers without a direct sales conversation
  - - Harvey
    - Custom enterprise contract
    - No public price card disclosed
    - Assistant, Vault, Knowledge modules across legal workflows
    - Contract economics undisclosed; only aggregate agent-run counts disclosed
    - Buyers must negotiate blind relative to publicly listed alternatives
  - - Glean
    - Custom enterprise contract
    - No public price card disclosed
    - Search, knowledge grounding, and agent build/orchestrate tooling
    - Pricing not disclosed in reviewed sources
    - Same opacity pattern as other vertical/horizontal peers
  - - Sierra
    - Managed annual contract
    - Independent buyer guides estimate $150K-$350K/year including forward-deployed integration
    - Agent Studio, Journeys builder, voice/brand-cloning, managed iteration
    - List pricing not published by Sierra itself; figures are third-party estimates
    - Premium managed-service pricing reflects Sierra's forward-deployed delivery model, not just software licensing
  - - Decagon
    - Annual contract
    - Independent buyer guides estimate $95K-$200K+/year depending on integration scope
    - Agent Operating Procedures platform, deflection/CSAT tooling
    - List pricing not published; figures are third-party estimates
    - Lower entry estimate than Sierra in third-party guides, consistent with a more self-serve/engineering-owned model
  - - Cognition / Devin
    - Usage-based (activity credit units)
    - Reviewers report a $500/month cost floor for meaningful usage
    - Autonomous coding agent, sandboxed cloud dev environment
    - ACU-based pricing makes total cost unpredictable for long-running or complex tasks
    - Usage-based pricing can create budget uncertainty versus flat per-seat models
  - - OpenAI
    - API usage + seat-based enterprise tiers
    - GPT-5.5 API list pricing published; ChatGPT Business/Enterprise seats priced separately
    - Frontier orchestration, AgentKit tooling, ChatGPT Enterprise seats
    - Large-enterprise realized/custom pricing not fully public
    - Transparent on API economics but opaque on large custom enterprise deals, similar to smaller specialists
  - - Salesforce (Agentforce)
    - Bundled add-on to CRM licensing
    - Not itemized separately from Data 360/CRM bundle pricing in reviewed sources
    - Agentforce 360, Data 360, Sales/Service/Analytics agents
    - Attach pricing likely varies by existing CRM contract; not disclosed publicly
    - Bundling makes apples-to-apples price comparison versus standalone agent vendors difficult for buyers
  - - Microsoft (Copilot Studio)
    - Bundled with Microsoft 365 Copilot licensing
    - Per-seat Copilot pricing published; Copilot Studio usage/consumption pricing separate
    - Low-code agent builder, connectors, governance tooling
    - Total blended cost depends on seat count plus consumption, not a single public number
    - Same bundling opacity pattern as Salesforce, favoring incumbents with existing seat bases
