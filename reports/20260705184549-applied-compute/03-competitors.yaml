- id: capability-pricing-gtm-trust
  title: Capability, pricing, GTM/distribution, and trust posture compared
  body: 'None of the profiled companies publish a self-serve list price for their core enterprise agent product, including
    Applied Compute itself. Harvey, Glean, and Sierra all sell custom enterprise contracts with undisclosed economics; independent
    2026 buyer guides estimate Decagon and Sierra contracts typically start around $95,000-$150,000 per year and can reach
    $200,000-$350,000 once forward-deployed integration is included, though these are third-party estimates rather than vendor-published
    figures. Cognition''s Devin is the one reviewed product with a disclosed pricing mechanism -- usage-based activity credit
    units -- which reviewers say creates a roughly $500-per-month cost floor and unpredictable total cost on long-running
    tasks. OpenAI is the most transparent on flagship API pricing but, like the others, keeps large-enterprise contract terms
    custom and undisclosed. Salesforce and Microsoft both fold agent pricing into existing CRM and Microsoft 365 subscription
    bundles, which makes apples-to-apples price comparison harder for buyers evaluating a standalone specialist against an
    incumbent add-on.


    On capability, the feature/capability matrix shows a consistent pattern: vertical peers (Harvey, Sierra, Decagon, Cognition)
    disclose strong domain specialization but leave their underlying model/RL-training depth largely undisclosed, while OpenAI
    discloses strong model depth but stays horizontal across verticals. Distribution and bundling power is concentrated in
    the three platform incumbents, which can attach agent tooling to renewals enterprises already budget for -- Salesforce''s
    own disclosure that over 60% of Agentforce bookings come from expansion, not new logos, is direct evidence of that dynamic.
    On trust and regulatory posture specifically, none of the reviewed sources disclosed a detailed, comparable compliance/certification
    matrix across all nine entities, which this chapter treats as an open evidence gap rather than inferring a ranking from
    incomplete public materials.'
