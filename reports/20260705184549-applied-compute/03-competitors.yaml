callouts:
- calloutType: insight
  title: Applied Compute's sharpest competitive risk is its own customers, not just named rivals
  body: Harvey, Cognition, and DoorDash are simultaneously Applied Compute's headline proof points and, given their own multi-billion-dollar
    scaling trajectories, plausible future insourcers of the RL post-training capability Applied Compute currently sells them.
  claimRefs:
  - CP003
  - CP044
- calloutType: risk
  title: Every direct peer out-raised and out-valued Applied Compute in the same 12 months
  body: Sierra ($950M/$15.8B), Harvey ($200M/$11B), Decagon ($250M/$4.5B), and Cognition ($400M/$10.2B) each closed rounds
    larger and richer than Applied Compute's own disclosed raise within the same window, widening the compute- and talent-spend
    gap between Applied Compute and the companies it sells to or competes with.
  claimRefs:
  - CP045
  - CP005
- calloutType: strength
  title: Applied Compute avoids head-to-head branded-product competition with any single named peer
  body: Because Applied Compute trains customer-owned models rather than shipping its own legal, support, or coding agent,
    it does not directly compete for the same purchase decision as Harvey, Sierra, Decagon, or Cognition -- it can instead
    sell RL post-training capability to some of them.
  claimRefs:
  - CP002
  - CP004
- calloutType: assumption
  title: Reliability gaps are visible even in the best-funded vertical peer
  body: Independent 2026 testing found Cognition's Devin -- the most heavily funded coding agent reviewed -- still has documented
    reliability and security-review gaps, suggesting funding and valuation are not yet reliable proxies for technical moat
    durability anywhere in this competitive set.
  claimRefs:
  - CP031
