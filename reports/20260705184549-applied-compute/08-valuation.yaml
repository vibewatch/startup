- id: comparable-context-and-scenarios
  title: Comparable context suggests premium AI valuations are possible, but Applied Compute has not yet matched the public disclosure behind the best comps
  body: 'The most useful private comp in the current file is Harvey. CNBC reports Harvey at an $11 billion valuation with about $190 million of ARR as of January 2026, which implies that the private market will award extraordinary multiples to enterprise-AI companies with visible scale, strong adoption, and elite investor support. That helps prove that the market can price premium application-layer AI expensively. It does not prove Applied Compute deserves the same treatment today. Harvey pairs valuation with disclosed ARR and visible downstream user scale, while Applied Compute has only a handful of recent public deployments and no disclosed economics. Public-company anchors like Palantir, Salesforce, Microsoft, and Alphabet are still useful, but mostly as disclosure and scale comparators rather than clean multiple comps. The resulting scenario frame is asymmetric: bull-case upside exists if private diligence reveals far stronger ARR and repeatability than the public record implies, but
    the base case remains below the current mark unless those private metrics are unusually strong. That is why scenario discipline matters more here than nominal enthusiasm about the category.'
  claimRefs:
  - CV010
  - CV011
  - CV017
