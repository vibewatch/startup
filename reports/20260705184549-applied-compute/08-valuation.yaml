- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Applied Compute already has high double-digit ARR-equivalent visibility, flagship wins standardize into a repeatable deployment engine, and premium private AI multiples stay open
    - If private diligence shows ~$100M ARR potential and premium multiples hold, value can exceed the current $1.3B mark
    - Evidence gap on current ARR; competition and implementation scaling remain major risks
    - Low-Medium
  - - Base
    - Company quality is real but economics are still immature and partially services-heavy
    - Public evidence alone supports a value below the current mark unless private ARR and retention data are much stronger than disclosed
    - Opacity on margins, concentration, and NRR keeps a discount in place
    - Medium-High
  - - Bear
    - Flagship wins stay bespoke, buyers hesitate on governance or ROI, and transparent platform pricing compresses willingness to pay
    - If economics look closer to a premium services layer than software platform, fair value can be materially below the unicorn mark
    - Case-study success does not translate into durable ARR or margin profile
    - Medium
  notes: The scenarios are intentionally directional because the public file lacks the inputs needed for false precision. Probability signals reflect evidence quality as much as business quality.
  claimRefs:
  - CV031
  - CV032
  - CV038
  - CV039
  - CV040
- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Harvey
    - Private round + disclosed ARR
    - ~$11B valuation; ~$190M ARR; ~57.9x ARR per CNBC
    - Best evidence that premium enterprise-AI application multiples can be extreme
    - Much larger disclosed ARR and user scale than Applied Compute
  - - Palantir
    - Public filed scale anchor
    - $1.4B quarterly gross profit in 2026 Q1 filing
    - Useful anchor for high-stakes enterprise AI / operations narrative
    - Far more mature public company, not an early-stage comp
  - - Salesforce / Agentforce
    - Public suite vendor + AI distribution
    - Public AI CRM / agent platform with deep enterprise distribution
    - Useful for distribution and bundling pressure on exit multiples
    - Broader CRM platform, not a focused AI specialist
  - - Microsoft / Azure Foundry
    - Public cloud + pricing transparency
    - Published AI Foundry and model pricing; public-company disclosure
    - Useful for cost transparency and platform competition
    - Not a direct valuation comp for a startup
  - - Alphabet / Google AI
    - Public AI suite / investor disclosure
    - Large-cap disclosure and enterprise-AI distribution
    - Useful as a disclosure and competition ceiling
    - Scale and business mix are incomparable to Applied Compute
  - - NVIDIA
    - Public AI infrastructure scale / investor disclosure
    - Large-cap AI infrastructure leader with detailed IR materials
    - Useful ceiling for infrastructure-scale AI equity enthusiasm and disclosure quality
    - Infrastructure economics and business mix are very different from Applied Compute
  enumerationScope:
    coverage: partial
    basis: Rows capture the most decision-useful public comp buckets for Applied Compute rather than an exhaustive enterprise-AI comp sheet.
  notes: Because no clean public analogue exists, the table intentionally mixes private-round, public-company, and platform-distribution comparators. Relevance comes from what each comp teaches, not from false symmetry.
