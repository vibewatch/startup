- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Flagship deployments suggest unusually strong product-customer fit for a 2025-founded AI company
    - Show that those deployments are repeatable and tied to meaningful ARR, not just marquee technical wins
  - - Top-tier investors and legal confirmation make the financing event credible
    - Provide actual round terms, dilution, and preference details to assess valuation quality rather than headline quality
  - - Harvey-style private comps prove the market can pay extreme multiples for enterprise AI
    - Show analogous revenue scale or adoption depth; otherwise Harvey is a direction-of-travel comp, not a like-for-like comp
  - - Transparent competitor pricing suggests the market opportunity is large and active
    - Show that Applied Compute captures value above those pricing baselines rather than being boxed in by them
  - - Public disclosure gaps are the cleanest bear case
    - Release or provide under NDA current ARR, margin, NRR, concentration, and burn data
  notes: The anti-thesis is not that Applied Compute lacks quality; it is that valuation discipline requires economic proof the public file does not yet provide.
