  evidenceGaps:
  - type: missing-source
    severity: material
    topic: arr-and-growth
    missingEvidence: Current ARR, growth rate, and revenue mix by software versus services.
    whyItMatters: These are the core variables needed to know whether the current price is rich, fair, or cheap.
    diligencePath: Request board-ready ARR bridge, trailing twelve-month revenue, and forward growth forecast.
    relatedQuestionRefs:
    - QV007
    - QV014
    - QV030
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: margin-and-burn
    missingEvidence: Gross margin, compute COGS, burn, runway, and cash-efficiency metrics.
    whyItMatters: Without margin and burn, investors cannot know whether the valuation embeds software economics or research-services economics.
    diligencePath: Request monthly burn, gross-margin bridge, and deployment staffing model.
    relatedQuestionRefs:
    - QV025
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Detailed round structure, preferences, liquidation stack, and secondary participation.
    whyItMatters: Headline valuation can materially overstate economic quality if terms are investor-protective or liquidity-heavy.
    diligencePath: Review signed financing documents and cap-table summary.
    relatedQuestionRefs:
    - QV017
    - QV030
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: medium
    topic: repeatability
    missingEvidence: Implementation-time distribution, launch staffing ratios, and customer expansion cohorts. Public-company and private-round comparables are also incomplete because Applied Compute does not disclose the metrics needed for cleaner matching.
    whyItMatters: The valuation debate turns on whether Applied Compute is becoming a repeatable platform or staying a bespoke applied-research layer.
    diligencePath: Request last 10 deployment timelines, expansion metrics, and NRR / concentration by cohort.
