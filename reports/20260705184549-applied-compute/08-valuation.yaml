- id: thesis-versus-anti-thesis
  title: The thesis is strong customer-quality proof; the anti-thesis is evidence opacity at a premium price
  body: 'The bullish side of the story is easy to see. Applied Compute has credible customer proof in DoorDash and Cognition, benchmark credibility with Mercor and Harvey, strong founder pedigree, and a backer narrative that fits where enterprise AI value may accrue. If those early deployments are the leading edge of a repeatable specialization platform, the current price may eventually look modest. The bearish side is more immediate. Almost all of the hard commercial questions remain unanswered in public: ARR, burn, gross margin, NRR, contract size, and round structure are all missing. ZenML’s skepticism about the DoorDash case-study economics captures the core problem well: quality of technical proof is not the same as quality of underwriting proof. Public evidence currently supports a high-quality company, not yet a fully supported $1.3 billion fair-value conclusion. Said differently: the market mark may be directionally right, but the evidence base still looks thin for precision.'
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV008
