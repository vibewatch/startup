- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR materially below sensitivity thresholds
    - Private diligence suggests ARR is far below what even 12x-18x multiple logic would require
    - Undermines current mark and weakens premium software framing
    - Pass at current price or require lower entry
  - - Gross margin or services intensity looks too weak
    - Delivery model resembles research-heavy services more than scalable software
    - Compresses multiple and weakens exit comparability
    - Re-rate as hybrid services / software risk
  - - Customer concentration is severe
    - A few flagship accounts dominate revenue or proof narrative
    - Raises volatility and reference fragility
    - Require concentration discount or defer
  - - Governance / compliance friction stalls growth
    - Security and procurement burden slows deployments materially
    - Turns technical moat into commercial bottleneck
    - Require evidence of control productization before proceeding
  - - Competitive pricing or bundling compresses willingness to pay
    - Customers can substitute cheaper or bundled platform offerings
    - Reduces long-term premium multiple support
    - Tighten valuation discipline and monitor win-loss data
  notes: These are the shortest routes by which a technically impressive company can still become a poor investment at the current mark.
  claimRefs:
  - CV014
  - CV023
  - CV029
  - CV032
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current ARR and growth by customer / use case
    - No public ARR disclosure
    - Needed to test whether current price is even in the right range
    - Finance / CEO deck under NDA
  - - Gross margin and compute COGS
    - No public margin disclosure
    - Needed to separate scalable software from premium services
    - Finance + infra lead
  - - NRR, churn, and customer concentration
    - No public retention or concentration disclosure
    - Needed to know if marquee logos translate into durable revenue
    - Revenue ops / customer success
  - - Round structure and preference terms
    - Headline valuation only
    - Needed to assess economic quality of the April 2026 mark
    - Counsel + financing documents
  - - Implementation staffing ratios and launch times
    - No public repeatability metrics
    - Needed to price services-intensity risk correctly
    - Ops + deployment leadership
  - - Win-loss data versus platform incumbents
    - No public competition conversion data
    - Needed to know whether differentiation is durable at current price
    - Sales leadership / product marketing
  notes: Until these asks are answered, the valuation discussion should remain scenario-based and disciplined rather than conviction-priced.
