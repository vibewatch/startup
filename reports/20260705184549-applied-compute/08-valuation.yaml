callouts:
- calloutType: insight
  title: The valuation debate is evidence quality, not company quality
  body: Applied Compute looks like a serious company with real technical and customer signal. The problem is that the public evidence package stops well short of what is needed to underwrite a $1.3 billion entry price with confidence.
  claimRefs:
  - CV003
  - CV013
  - CV033
  - CV036
- calloutType: risk
  title: Harvey proves premium AI multiples are possible—but not automatically portable
  body: Harvey’s disclosed ARR and user scale show why investors may be willing to pay very high enterprise-AI multiples. Applied Compute has not yet publicly shown comparable economic scale, which is why Harvey is a directionally useful comp but not a clean valuation justification.
  claimRefs:
  - CV010
  - CV011
  - CV030
- calloutType: risk
  title: 'The cleanest bear case is still simple: too much opacity at too premium a price'
  body: If current ARR, margin, retention, and concentration data do not look unusually strong in diligence, the current mark is hard to defend regardless of product quality. That is why price discipline matters more than narrative excitement here.
  claimRefs:
  - CV014
  - CV015
  - CV029
  - CV032
  - CV040
