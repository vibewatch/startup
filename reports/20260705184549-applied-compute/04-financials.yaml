      - ["Debt / project-finance obligations", "None disclosed; all rounds described as equity financing", "Applied Compute fundraise post; Latham & Watkins release", "medium", "Confirm the absence of venture debt or compute-financing facilities"]
    notes: "Funding and valuation figures are well corroborated across the company's own announcement, its legal counsel's release, and independent press; the cash, burn, and runway rows are genuine disclosure gaps rather than omissions from this research."
