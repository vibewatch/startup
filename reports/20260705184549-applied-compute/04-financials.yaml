    notes: "Every numeric unit-economics value for Applied Compute itself is null because the company has not disclosed it; the Palantir, Together AI, and Cerebras figures are external comparators, not Applied Compute data, and are labeled as such."
    claimRefs: [CI015, CI016, CI017, CI018, CI019, CI021, CI022]
