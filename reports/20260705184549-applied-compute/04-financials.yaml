      - ["Gross margin %", null, "n/a -- undisclosed (comparator: Palantir's FDE-model gross margin ~86.8%, Q1 2026)", "Determines whether the compute- and labor-intensive delivery model scales profitably", "Request cost-of-revenue detail by engagement type"]
      - ["CAC / sales-cycle length", null, "n/a -- undisclosed", "Indicates go-to-market efficiency of the embedded/onsite motion", "Request average deal-cycle length and CAC by segment"]
      - ["Net revenue retention / expansion", null, "n/a -- undisclosed", "Indicates whether embedded engagements convert into durable, expanding accounts", "Request renewal and expansion data for named customers"]
