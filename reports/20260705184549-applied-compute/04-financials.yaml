    claimRefs: [CI022, CI012, CI036, CI021, CI035]
callouts:
  - calloutType: risk
    title: "No revenue, margin, or cash disclosure anchors the $1.3B valuation"
    body: >-
      Applied Compute has disclosed funding and valuation events in detail but has not disclosed revenue, ARR, gross margin, cash
      on hand, burn, or runway anywhere reviewed in this chapter. Underwriting the valuation therefore rests entirely on
      qualitative production-deployment proof rather than any financial multiple.
    claimRefs: [CI016, CI029, CI032]
  - calloutType: strength
    title: "Named production deployments suggest real, if unpriced, commercial traction"
    body: >-
      The DoorDash and Cognition case studies describe models that reached full production rollout (all US menu traffic at
      DoorDash; live in Windsurf at Cognition), which is stronger evidence of genuine usage than logos alone, even though neither
      case study attaches a dollar figure.
    claimRefs: [CI004, CI005]
  - calloutType: insight
    title: "A forward-deployed-engineer model is not inherently margin-dilutive"
    body: >-
      Palantir's Q1 2026 10-Q shows roughly 86.8% gross margin despite relying on the same onsite, forward-deployed engineering
      motion Applied Compute's case studies describe, suggesting the labor-intensive delivery model does not by itself preclude
      strong unit economics at scale -- though Applied Compute's own margin remains undisclosed.
    claimRefs: [CI015]
  - calloutType: recommendation
    title: "Prioritize direct requests for ARR, gross margin, and runway before underwriting the next round"
    body: >-
      Given how well the funding and valuation chronology is externally corroborated, the highest-value diligence step is a
      direct management or lead-investor request for revenue, cost-of-revenue, cash position, and customer-count data, since none
      of it is inferable from public sources reviewed here.
    claimRefs: [CI016, CI018, CI029, CI023]
