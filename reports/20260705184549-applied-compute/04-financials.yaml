schemaVersion: "report-v2"
artifact: financials
slug: applied-compute
runDate: "2026-07-05"
company:
  name: Applied Compute
chapter:
  number: 4
  title: Financials
  summary: Applied Compute discloses funding and valuation events in unusual detail ($160M raised, $1.3B post-money as of April 2026) but discloses no revenue, ARR, gross margin, cash position, burn, or customer count -- leaving every underwriting-grade financial metric as an explicit, confirmed gap rather than an estimate.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model and monetization
    body: >-
      Applied Compute's own materials describe a three-stage "Agent Cloud" product -- Train, Serve, Improve -- delivered through an
      embedded, managed engagement model rather than a self-serve subscription. The company says its engineers "sit with" a
      customer's engineering team from the first evaluation through production deployment and ongoing online-RL improvement, a
      motion its own case studies illustrate concretely: engineers worked onsite at DoorDash's Sunnyvale office to translate
      production QA labels into an automated grader, and the Cognition engagement paired Applied Compute's RL stack with Cerebras
      inference to hit real-time latency targets for a production bug-detection agent. None of the three published case studies
      (Cognition, DoorDash, Mercor) discloses a contract value, minimum spend commitment, or usage-based fee schedule, and the
      company's own homepage, fundraise post, and launch essay describe the business only in qualitative terms. Benchmarked
      against OpenAI's, Anthropic's, Microsoft's, Cognition's own Devin, Together AI's, and Cerebras's published price lists --
      all of which disclose at least a partial per-seat or per-token rate -- Applied Compute is the only vendor in this comparison
      set with a fully undisclosed pricing structure, consistent with a company still in an early, high-touch enterprise-sales
      stage rather than a metered-product stage.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-cost-structure
    title: Unit economics and cost structure
    body: >-
      Every classic unit-economics input -- gross margin, CAC, sales-cycle length, and net revenue retention -- is undisclosed for
      Applied Compute. The closest available comparator is Palantir, whose Foundry AIP delivery model likewise relies on
      forward-deployed engineers embedded with customers and which reported a GAAP gross margin of roughly 86.8% ($1.42B gross
      profit on $1.63B revenue) for the quarter ended March 31, 2026, showing that labor-intensive, embedded delivery is not
      inherently margin-dilutive at scale. Applied Compute's own cost stack plausibly combines GPU/inference compute (the
      Cognition case study names Cerebras as an inference partner), forward-deployed engineering labor (as in the DoorDash
      onsite engagement), and data/eval-harness costs (as with the Mercor partnership, where fewer than 1,000 expert-labeled
      tasks reportedly drove large evaluation-score gains, implying a comparatively low marginal data cost per engagement). An
      independent LLMOps review of the DoorDash case study explicitly flags that Applied Compute's own materials do not disclose
      "the total cost of development, ongoing inference costs, or quantified business impact," and cautions that the case study
      is promotional and should be read with appropriate skepticism -- a genuinely adverse, third-party check on the
      cost-benefit evidence the company publishes about itself.
    claimRefs: [CI015, CI016, CI017, CI018, CI019, CI020, CI021, CI022]
    tableRefs: [TI003]
    figureRefs: [FI002, FI004]
  - id: capital-adequacy-and-financing
    title: Capital adequacy and financing dependency
    body: >-
      Applied Compute's financing history is unusually well documented for a private company: a roughly $100 million seed
      valuation in mid-2025, a $500 million funding-talk valuation reported by The Information in September 2025, an $80 million
      round at roughly $700 million disclosed at its October 2025 stealth exit, and an $80 million Series B at a $1.3 billion
      post-money valuation confirmed on April 8, 2026 by the company, its legal counsel Latham & Watkins, and Kleiner Perkins as
      lead investor -- bringing cumulative disclosed funding to $160 million, a figure TechCrunch's July 2026 unicorn roundup
      independently corroborates via PitchBook roughly three months after the round closed. What is missing is everything a
      lender or later-stage investor would need to assess capital adequacy on a forward basis: cash on hand, monthly burn, and
      runway are all undisclosed, and the company's only public statement on use of proceeds is qualitative ("grow the team,
      scale deployments, bring to market the first generation of agent workforces"). No source reviewed in this chapter discloses
      any venture debt, project-finance facility, or credit line; every round to date appears to have been priced as straight
      equity. Given the roughly 13x valuation escalation from seed to Series B in well under a year, the next raise looks more
      likely to be pulled forward by growth and investor demand than forced by an approaching cash shortfall, though that is an
      inference, not a disclosed trigger.
    claimRefs: [CI023, CI024, CI025, CI026, CI027, CI028, CI029, CI030, CI039]
    tableRefs: [TI004]
    figureRefs: [FI003]
  - id: public-disclosure-gaps-and-financial-verdict
    title: Public disclosure gaps and financial verdict
    body: >-
      A search of SEC EDGAR's company database for "Applied Compute" returns no filings tied to the 2025-founded startup -- the
      only similarly named registrant is an unrelated filer whose registration was revoked in 2006 -- confirming the company
      carries none of the standard public-company disclosures (revenue, margin, cash position, headcount) that are available for
      a forward-deployed-engineer comparator like Palantir through its 10-Q. Applied Compute's public case studies name exactly
      three customers, so the total paying-customer base, concentration risk, and renewal behavior all remain unknown. Category-level
      headwinds compound the disclosure gap: Gartner forecasts more than 40% of agentic AI projects will be canceled by the end
      of 2027 on cost and unclear-ROI grounds, McKinsey warns that a large majority of organizations have already encountered
      risky agentic behaviors that argue for new (uncosted) governance spend, and both the IEA and Goldman Sachs project
      sharply rising data-center power demand through 2030 that could raise the GPU/inference costs underlying any compute-heavy
      vendor's margin. Taken together, Applied Compute's financial profile today is best read as "well-financed but
      unverifiable": funding and valuation events are richly and consistently sourced, while every metric an underwriter would
      need to judge revenue quality, margin path, or capital runway is a confirmed, not merely under-researched, gap.
    claimRefs: [CI031, CI032, CI033, CI034, CI035, CI036]
    tableRefs: [TI005]
