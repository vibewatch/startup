    notes: "Comparator rows are list prices for adjacent model-API or coding-agent products, not confirmed analogues of Applied Compute's own embedded RL post-training contracts; they bound the range of enterprise AI pricing structures in the market rather than Applied Compute's realized pricing, which remains fully undisclosed."
    claimRefs: [CI002, CI007, CI008, CI009, CI010, CI011, CI012, CI013]
  - id: TI003
    title: Unit economics
    columns: ["Metric", "Value", "Confidence", "Why it matters", "Diligence ask"]
    rows:
