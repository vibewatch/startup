      - - Guild Academy (Nomadic)
        - Employer L&D teams
        - Cohort-based corporate capability academies
        - GA (Oct 2024)
        - Enters $28B+ corporate L&D market; Josh Bersin Academy partnership
        - Revenue from Academy vs. Marketplace not disclosed
      - - Guild Talent Advantage
        - HR / Talent leaders
        - AI-powered talent analytics, Lightcast Talent Resilience Index
        - GA (Oct 2024)
        - Real-time skills data tied to credentialed completions
        - Pricing model and adoption not disclosed
      - - Guild Navigator
        - Healthcare / Employer
        - 'Licensed-role pipelines: CNA, MA, CDL; AI-enhanced human support'
        - Early Access (GA 2026)
        - Addresses critical healthcare workforce shortage; credential-to-job pipeline
        - Early access; commercial traction unproven
      - - Guild Grow Global
        - Multinational employers
        - Canada, Mexico, India, UK; multi-currency tuition reimbursement
        - GA
        - Enables unified education benefit for global enterprise clients
        - Penetration among existing clients not disclosed
      - - Tuition Reimbursement (Global)
        - All employer clients
        - Traditional tuition reimbursement administration, now global
        - GA
        - Available in nearly every country; lowest-friction entry product
        - Share of revenue from legacy reimbursement vs. direct-bill unknown
