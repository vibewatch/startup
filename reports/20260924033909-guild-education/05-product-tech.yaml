  - id: TE002
    title: Workflow and Use-Case Table
    description: |
      How Guild's platform is used across key employer workflow scenarios.
    notes: >
      Use cases reconstructed from public case studies, press releases, and Sacra/Bersin analyst coverage; internal
      utilization data and workflow specifics are proprietary.
    columns:
      - User Job
      - Current Workflow (Without Guild)
      - Guild Solution
      - Measurable Benefit (Company-Claimed)
      - Limitation / Gap
    rows:
      - - 'Employer: retain frontline workers'
        - Cash tuition reimbursement with receipts; low utilization; no career link
        - Learning Marketplace + Career Coaching; direct-bill; employer-curated catalog
        - 2x higher retention for program participants (Guild claim)
        - Macy's terminated due to low utilization and insufficient retention ROI
      - - 'Employer: fill licensed healthcare roles'
        - External recruiting; contract agency nurses; high cost
        - 'Guild Navigator: CNA, MA, CDL pipelines; human-managed AI support'
        - 'Walgreens PharmStart: 300 workers across 6 states (early access)'
        - Navigator in early access; commercial proof limited
      - - 'Employer: reskill for AI/digital roles'
        - Point training tools; no link to career mobility or credential
        - Guild Academy (cohort) + Wharton Online executive education
        - AI program enrollment +1,200% YoY; 100K+ AI learners over 3 yrs
        - Outcome data (job placement, skill retention) not independently verified
      - - 'Employer: measure workforce resilience'
        - Static HR analytics; lag indicators; no external benchmarking
        - Guild Talent Advantage + Lightcast Talent Resilience Index
        - Real-time skills benchmarking vs. labor market peers
        - New product; enterprise adoption data not yet disclosed
      - - 'Employee: access education without cash outlay'
        - Pay tuition upfront; wait for reimbursement; high dropout due to financial stress
        - 'Direct-bill: Guild pays provider directly; employee incurs no out-of-pocket cost'
        - 60,000 completions; $1B+ tuition savings in 2024
        - Completion rates vs. baseline not independently verified
    enumerationScope:
      coverage: sample
      basis: >
        Five use cases from Sacra analyst report, BusinessWire press releases, Forbes profile, and Josh Bersin analysis.
        Full use-case coverage is partial; most employer clients have not publicly described their specific workflow
        integration.
      relatedTableRefs:
        - TE001
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
  - id: TE003
    title: Technology and Operating Architecture Table
    description: |
      Key technology components of Guild's platform assessed by layer, role, dependency, and risk.
    notes: >
      Guild does not publish technical architecture documentation; this table is reconstructed from press releases,
      analyst reports, and the Lightcast partnership announcement. Confidence levels reflect public evidence quality,
      not internal validation.
    columns:
      - Layer / Component
      - Role
      - Dependency
      - Public Evidence Quality
      - Key Risk
    rows:
      - - Learning Marketplace (catalog + enrollment)
        - Core product; employer benefit configuration; learner enrollment
        - 70+ education providers; IRS Section 127 tax policy
        - High – confirmed in multiple press sources and Sacra
        - Provider network concentration; Sec. 127 cap ($5,250) limits program scope
      - - Direct-Bill Tuition Payment
        - Eliminates employee cash barrier; pays providers directly
        - Employer funding pools; education provider billing systems
        - High – confirmed in Sacra, Forbes, Bersin
        - Payment processing risk; employer funding variability in economic downturns
      - - Career Coaching Layer
        - 1:1 academic and career advising; reduces dropout rates
        - Guild coaching staff (internal headcount); content library
        - Medium – described in press; productivity metrics not public
        - Labor-intensive; scalability constrained by coaching headcount post-layoffs
      - - Program Recommendation Engine
        - AI-assisted matching of employees to programs based on goals and pathways
        - Employee profile data; employer pathway configuration
        - Medium – described in press; algorithm not published
        - Black-box matching; employer cannot audit or tune recommendations
      - - Guild Talent Advantage + Lightcast TRI
        - AI-powered workforce analytics; skills benchmarking
        - Lightcast labor market data API; credentialed completion data
        - High – Lightcast press release; BusinessWire
        - Third-party data dependency; Lightcast API terms and pricing
      - - Cohort-Based Learning Platform (Nomadic)
        - Asynchronous/synchronous cohort delivery; social learning; content authoring
        - Nomadic content library; corporate L&D client base
        - High – Nomadic operated independently pre-acquisition
        - Integration with core Marketplace still maturing post-acquisition
      - - Guild Navigator (AI-Enhanced)
        - 'Licensed-role pipeline: CNA, MA, CDL; AI-enhanced human support'
        - Healthcare system partnerships; credentialing bodies
        - Medium – early access only; spec not public
        - Early access; no production proof at scale; GA delayed to 2026
    enumerationScope:
      coverage: partial
      basis: >
        Seven technology layers reconstructed from Sacra analyst report, BusinessWire press releases, Lightcast
        partnership announcement, and Josh Bersin analysis. Full technical architecture is proprietary and not publicly
        documented.
      relatedTableRefs: []
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
