      - - Career Coaching
        - Employee
        - 1:1 academic and career advising throughout learning journey
        - GA
        - High-touch coaching drives completion; reduces dropout rates materially
        - Coaching-to-outcome data not independently verified
      - - Career Pathways
        - Employee / Employer
        - Maps programs to in-demand roles; structured progression ladders
        - GA (2024)
