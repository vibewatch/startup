        - High (arithmetic of two estimates; may mask concentration at top clients)
      - - Employee Learners Engaged (FY2024)
        - 1.4M+
        - Guild's 2024 annual impact press release (businesswire, Jan 2025)
        - Low (company-reported; engagement definition unclear)
      - - Estimated Gross Margin
        - 50–70% (platform); 20–40% (provider share)
        - Analyst estimate based on comparable employer EdTech SaaS blended margins
        - High (no public data; estimate only)
