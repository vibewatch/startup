      - number: '5.4'
        title: Product Roadmap and Global Expansion
        blocks:
          - type: paragraph
            body: >
              Guild's product roadmap reflects a deliberate expansion from a point solution for tuition reimbursement
              into a comprehensive workforce development platform. The October 2024 Nomadic Learning acquisition was the
              most significant strategic move: it accelerated entry into the $28 billion+ corporate L&D market, adding
              cohort-based learning capabilities, an enterprise content library, and a new client base of companies that
              purchase L&D separately from education benefits. Guild Academy, the integrated product resulting from this
              acquisition, targets Fortune 500 L&D budgets previously out of Guild's reach.

              Guild Grow Global represents the international expansion strategy, bringing the platform to Canada,
              Mexico, India, and the United Kingdom with multi-currency support. This addresses multinational employer
              needs and positions Guild to serve global workforces of existing US enterprise clients. The tuition
              reimbursement product now operates in nearly every country globally, enabling multinational companies to
              deploy a unified education benefit strategy.

              Guild Navigator, in early access with partners including OSF Healthcare, Children's Nebraska, and Good
              Jobs Birmingham, targets the specific problem of credentialed role pipelines — building structured
              pathways from current employee populations to licensed positions such as CNA, MA, and CDL. General
              availability is planned for early 2026. The Walgreens PharmStart program — offering fully paid online
              pharmacy school prerequisite classes to 300 workers — exemplifies the Navigator product strategy. The
              strategic risk is product sprawl: managing five distinct product lines with varying maturity levels
              requires disciplined prioritization and sales specialization that a 900-person company may struggle to
              sustain. The Macy's partnership termination (January 2025) and the Walmart displacement by Workforce Edge
              are meaningful adverse signals that the core Learning Marketplace product must demonstrate clear ROI to
              retain large clients even as new products are being built.
            claimRefs: []
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: |
              Guild's customer base consists of large Fortune 500 and near-Fortune-500 employers with
              minimum employee populations in the tens of thousands, predominantly in industries that
              combine high workforce turnover with strong regulatory or competitive incentives to retain
              and upskill hourly and front-line workers. The five core verticals served are retail and
              e-commerce, food service and quick-service restaurants, healthcare and hospitals,
              hospitality and travel, and financial services/banking. These sectors share a structural
              tailwind: BLS data shows that workers with some postsecondary education earn 17–25%
              higher wages and experience meaningfully lower unemployment than workers with a high school
              diploma only, creating a credible ROI narrative for employers that subsidize education.

              Guild's buyer is the VP/Director of Benefits or Chief People Officer at a large employer;
              the user is the hourly or mid-career employee who enrolls in programs; and the economic
              payer is the employer (often self-insured) who funds tuition through Guild's direct-bill
              infrastructure. The geographic concentration is almost entirely US-based, though Guild
              Grow Global has begun expanding benefits administration to Canada, Mexico, India, and the UK.
              Guild does not publicly disclose revenue by vertical or a systematic client list, so the
              segmentation in this chapter is reconstructed from press releases, analyst reports (Sacra,
              Contrary Research), and news coverage of individual partnerships. The company's self-reported
              "500+ employer clients" and "1.4 million employees engaged" figures are the primary scale
              anchors; all sub-segment breakdowns are estimates.
