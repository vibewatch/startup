      - number: '2.2'
        title: Market Sizing — TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: |
              Estimating Guild's addressable market requires triangulating three complementary lenses: top-down
              employer education spend, bottom-up employer count and contract value, and peer-company revenue
              benchmarks.

              Top-down lens: US employers collectively spend an estimated $26–28 billion annually on tuition
              assistance and employer-sponsored education, per Lumina Foundation and SHRM estimates. Of this,
              the employer-pay-upfront, technology-intermediated segment (Guild's model) represents a fraction,
              as most employers still operate traditional reimbursement programs. If 20–30% of the $28B market
              could be captured by platforms like Guild over time, that implies a long-run US TAM of $5.6–8.4B
              for tech-enabled employer-sponsored learning platforms.

              Bottom-up lens: Guild targets large employers with 10,000+ employees. The US has approximately
              900 employers with 10,000+ employees (per BLS data). At an average annual contract value of $1–2M
              for a fully penetrated account, the reachable SAM from this segment is roughly $900M–$1.8B in
              annual platform revenue. At 500 active clients (Guild's reported client count), and assuming
              ~$550K average revenue per employer (derived from Sacra's ~$275M estimate divided by 500 clients),
              current revenue implies Guild is capturing roughly 0.03–0.06% of the total $28B spend market.

              SOM: Guild's current estimated revenue of ~$275M (FY2024) represents its realized SOM. Near-term
              SOM expansion will depend on deepening penetration within existing accounts (seat expansion) and
              adding new enterprise clients. If Guild can grow to 700–800 employer clients at average contract
              values of $600–800K, near-term SOM could reach $420–640M. The global L&D market of $300B+ is
              largely out of scope for current Guild economics but represents long-term optionality via Guild
              Talent Advantage and Guild Academy's enterprise learning expansion.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.3'
        title: Market Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: |
              The employer-sponsored education market is driven by structural, cyclical, and regulatory factors
              that are independently verifiable and not merely company-supplied claims.

              Primary growth drivers: First, the accelerating skills gap and AI-driven job transformation.
              McKinsey and Gallup surveys consistently document that large employers view skills obsolescence
              as a top-five strategic workforce risk. Guild's 1,200% enrollment growth in AI-focused programs
              in 2024 is one data point reflecting this demand signal. Second, labor market competition for
              hourly and front-line workers. The tight labor market of 2021–2023 drove many large employers
              to add or enhance education benefits as a retention differentiator; Walmart, Chipotle, and Target
              all publicly cited education benefits as part of their retention strategies. Third, IRS Section
              127 creates a recurring $5,250-per-employee annual tax-free benefit window that makes employer
              education cost-effective relative to wage increases or other benefits. Fourth, ESG and DE&I
              commitments have led large employers to treat workforce education as both a talent strategy and
              a social impact credential, increasing C-suite buy-in.

              Key adoption constraints: The most significant constraint is employer willingness during
              economic downturns. The 2024 Macy's program termination and Disney benefit reduction both
              occurred during periods of cost cutting, suggesting that education benefits are treated as
              discretionary rather than core. Second, employer skepticism about ROI. Without hard data on
              retention lift, promotion rates, or productivity improvement attributable to Guild programs,
              the CFO case for maintaining or expanding education spending is weak in tight budget environments.
              Third, competitive displacement risk (Workforce Edge at Walmart) and internal HR system
              substitution (large employers building in-house LXPs). Fourth, the IRS Section 127 cap of
              $5,250 limits per-employee revenue upside, creating a structural ceiling on revenue intensity
              per seat unless Guild can monetize career coaching, skills assessments, and talent analytics
              beyond the tuition pipeline.
            claimRefs:
              - CM012
      - number: '2.4'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: |
              Guild's buyer is not the employee (who benefits for free) but the employer — specifically large
              enterprises with 10,000 or more employees where the platform investment can be justified against
              workforce scale. Within the employer, the purchasing decision typically involves two or more
              functions: Human Resources (HR) or People & Culture, which owns benefits design and workforce
              development strategy; and Finance or Procurement, which approves the contract and validates ROI
              assumptions. In some enterprise accounts, the CEO or CHRO sponsors the program directly as part
              of a public workforce commitment (e.g., Walmart's "Live Better U" brand, Chipotle's "Cultivate
              Education").

              Employer segments can be characterized by industry vertical and strategic motivation. Retail,
              food service, and hospitality employers (Walmart, Chipotle, Taco Bell, Hilton) use Guild to
              differentiate in high-churn hourly worker segments where education benefits reduce voluntary
              turnover. Healthcare employers (Providence Health, OSF Healthcare, UCHealth) use Guild to address
              clinical worker pipelines and meet licensing/credentialing requirements. Financial services
              employers (Discover, PNC Bank, JPMorganChase) use Guild for professional development in roles
              subject to rapid technology disruption. Logistics and energy employers (Tyson Foods, Love's
              Travel Stops) use Guild to support front-line worker advancement.

              The adoption path typically follows: employer RFP or direct outreach → pilot with one business
              unit → full program design with Guild → launch with communication campaign → ongoing coaching
              and analytics → renewal and expansion. Sales cycles for large enterprise clients are estimated
              at 6–12 months; full program activation across a large employer base (100,000+ employees) can
              take 12–18 months. The multi-year, multi-stakeholder nature of the sales cycle creates both a
              competitive moat (high switching cost once embedded) and a constraint (slow new client
              acquisition during economic uncertainty).
            claimRefs: []
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: |
              Guild operates in a competitive landscape that spans multiple categories of alternatives, each
              representing a different "job to be done" for large employers seeking to provide education and
              learning benefits to their workforces. The market has historically been fragmented between legacy
              tuition reimbursement administrators, newer EdTech platforms, and generalist talent management
              software, but consolidation and product expansion are intensifying competition across all dimensions.

              The most relevant competitive categories for Guild are: first, direct employer-sponsored learning
              platform peers — companies that operate a similar marketplace model connecting employers, employees,
              and education providers, specifically InStride (USC spinout, 2019) and Workforce Edge (which gained
              attention by reportedly displacing Guild at Walmart). Second, legacy benefit administrators — the
              most significant being Bright Horizons EdAssist, which has long-established relationships with
              72 of the Fortune 100 companies and a broad benefits administration footprint that predates the
              online learning boom. Third, learning experience platforms (LXPs) — Degreed and Cornerstone
              OnDemand both serve the corporate L&D market and have been adding tuition and degree program
              integrations that partially overlap with Guild's core offering. Fourth, internal employer build —
              particularly relevant for very large employers like Amazon and Walmart who have built proprietary
              learning benefit platforms rather than relying on external vendors.

              The competitive intensity is increasing: EdAssist's established base, Workforce Edge's Walmart win,
              and Degreed's LXP expansion all represent material competitive threats that Guild must defend against
              while simultaneously executing its Guild Talent Advantage expansion into corporate L&D.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.2'
        title: Direct Competitor Profiles
        blocks:
          - type: paragraph
            body: |
              InStride (founded 2019, USC spinout, based in Los Angeles) is Guild's most direct peer in the
              employer-sponsored education platform model. InStride operates a similar three-sided marketplace:
              employers pay platform fees, employees access accredited degree and certificate programs at no cost,
              and education providers pay InStride a revenue-share. InStride has raised approximately $90M in
              funding and counts clients including American Airlines, PwC, and Uber. InStride's academic network
              includes partnerships with approximately 80 accredited universities globally. InStride is
              smaller than Guild (revenue not publicly disclosed but estimated materially below Guild's ~$275M)
              and has a more selective, quality-focused employer client strategy rather than Guild's breadth
              approach. InStride's university network has a stronger international component, which could be
              advantageous as Guild competes on its Guild Grow Global offering.

              Workforce Edge (Walmart subsidiary) emerged as a high-profile competitive threat when it was
              reported to have displaced Guild at Walmart's Live Better U program. Workforce Edge is a proprietary
              platform built for Walmart's internal workforce development needs, offering tuition-free degrees and
              certificates to Walmart's approximately 1.6 million US associates. As a captive internal platform
              built at the scale of the world's largest private employer, Workforce Edge is not a direct market
              competitor to Guild in the traditional sense — it is not commercially available to other employers —
              but its existence represents the risk of large employer "insourcing" that is inherent in Guild's model
              at the very largest scale.

              Bright Horizons EdAssist is the legacy leader in employer-sponsored education administration, with
              relationships with 72 of the Fortune 100 and deep integration into HR and payroll infrastructure.
              EdAssist's model is primarily tuition reimbursement administration — it manages the traditional
              reimbursement workflow (employee applies, completes, submits for reimbursement) rather than
              employer-pay-upfront with a curated provider network. This creates a different buyer relationship
              and a lower-friction switching cost for employers moving to or from EdAssist, but also means EdAssist
              serves as the status-quo alternative that Guild must displace in new enterprise sales.
            claimRefs:
              - CP005
              - CP006
              - CP007
