    notes: >
      Walmart concentration is the single highest-stakes partner risk. Workforce Edge was co-founded by Walmart,
      creating both a competitive and dependency-reversal risk simultaneously for Guild.
    title: Partner / dependency risk register
  - id: TV001
    title: Recommendation summary table
    slug: recommendation-summary-table
    description: Summary of investment recommendation, confidence, risk rating, and key conditions
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
    columns:
      - Dimension
      - Position
      - Key Rationale
    rows:
      - - Recommendation
        - Conditional Invest
        - Structural market, IRS Section 127 durability, Navigator upside path
      - - Confidence Level
        - Medium (35%)
        - Material evidence gaps on financials, Walmart renewal, post-RIF service quality
      - - Risk Rating
        - High
        - Client concentration, execution risk, competitive pressure, no recent financing
      - - Entry Valuation
        - At or below $2.0B implied EV
        - Comparable set, preference overhang, probability-weighted scenario analysis
      - - Target Return (Base)
        - 1.5-2.5x over 4 years
        - Base EV $2.2-3.0B exit / $2.0B entry; common equity discounted for preference
      - - Return (Bull)
        - 2.5-4x over 3 years
        - Navigator acceleration to 15-20% growth; 11-12x multiple rerating possible
    notes: >
      Conditional on data room validation of three items: audited financials showing loss narrowing; employer NPS above
      40 and renewal rate above 85%; Walmart contract renewal without Workforce Edge carve-out. Recommendation lapses if
      any condition is not confirmed.
  - id: TV002
    title: Thesis / anti-thesis table
    slug: thesis-anti-thesis-table
    description: Side-by-side investment thesis and anti-thesis for Guild Education
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
    columns:
      - Dimension
      - Thesis (Bull View)
      - Anti-Thesis (Bear View)
    rows:
      - - Market structure
        - $26B employer education market anchored by IRS Section 127 with bipartisan support
        - Benefit cuts are discretionary; Disney and Macy's show employers exit quickly in downturns
      - - Product moat
        - Multi-sided network (500+ employers, 150+ institutions) creates switching costs
        - Workforce Edge demonstrates that large employers can self-build competing consortia
      - - Growth trajectory
        - Navigator and Nomadic Learning open higher-value workforce intelligence market
        - Revenue growth decelerated to ~6% YoY; edtech multiples compressed market-wide
      - - Financial profile
        - Two restructurings signal deliberate path to profitability; margin improvement
        - No public financials; no equity raised in 3 years; burn rate and runway unknown
      - - Leadership
        - Shah has COO experience at Guild; CNBC changemaker recognition; board continuity
        - Founder replaced after health crisis; two RIF rounds; culture and talent risk elevated
      - - Valuation entry
        - Secondary market at $1.5-2B is 55-65% below peak; distressed entry opportunity
        - At 7-8x revenue, not deeply discounted vs. decelerating public comps (Coursera 4-5x)
    notes: >
      Thesis balance: bull case requires Navigator to prove product-led growth within 2026; bear case is validated by
      two major client cancellations in H2 2024 - H1 2025.
  - id: TV003
    title: Bull / base / bear scenario table
    slug: bull-base-bear-scenario-table
    description: Three-scenario valuation model for Guild Education with key assumptions and implied ranges
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
    columns:
      - Scenario
      - Revenue 2026E
      - Growth Assumption
      - EV/Revenue Multiple
      - Implied EV
      - Probability Weight
    rows:
      - - Bull
        - $375M
        - 15-20% YoY driven by Navigator upsell and net-new enterprise wins
        - 11-12x (platform/SaaS rerating)
        - $4.0-4.5B
        - 20%
      - - Base
        - $325M
        - 8-12% YoY Navigator incremental upsell; stable employer base
        - 7-9x (private growth software)
        - $2.3-2.9B
        - 55%
      - - Bear
        - $265M
        - 0 to negative; Walmart loss; macro benefit cuts accelerate
        - 4-5x (distressed / flat growth)
        - $1.1-1.3B
        - 25%
      - - Probability-weighted
        - $312M
        - Weighted expected revenue
        - 7-8x weighted average
        - $2.1-2.4B
        - 100%
    notes: >
      All scenarios assume no new external equity; base assumes current burn trajectory self-funds through 2026. Bull
      requires Navigator ARR contribution of at least $40-50M incremental by 2026. Bear assumes Walmart represents
      approximately 10-15% of revenue and exits by H2 2025.
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Guild's milestone arc from founding in 2015 through the 2024–2025 restructuring period, showing the hypergrowth
      unicorn trajectory followed by governance disruption, workforce reductions, and strategic pivot toward Guild
      Talent Advantage.
    data:
      items:
        - date: '2015-06-01'
          label: Founded
          details: Guild Education founded by Rachel Romer and Brittany Stich in Denver, CO as a Public Benefit Corporation
          tone: positive
        - date: '2016-01-01'
          label: Series A
          details: Bessemer Venture Partners leads first institutional round; EdTech thesis validated
          tone: positive
        - date: '2019-01-01'
          label: Walmart Live Better U
          details: Anchor partnership with Walmart establishes Guild as category leader; largest US employer adopts platform
          tone: positive
        - date: '2021-06-01'
          label: Series E at $3.75B
          details: $150M Series E led by General Atlantic; $3.75B valuation at EdTech boom peak
          tone: positive
        - date: '2022-06-01'
          label: Series F at $4.4B (peak)
          details: $175M Series F led by Wellington Management; $4.4B post-money valuation; Oprah Winfrey invests
          tone: positive
        - date: '2023-05-01'
          label: First Layoffs (12%)
          details: ~172 employees laid off; first significant workforce reduction signals growth deceleration
          tone: warning
        - date: '2023-08-01'
          label: Rachel Romer Stroke
          details: Co-founder CEO Rachel Romer suffers severe stroke; key-person risk materializes
          tone: negative
        - date: '2024-04-02'
          label: Bijal Shah Becomes CEO
          details: Bijal Shah formally appointed CEO after ~8 months as acting CEO
          tone: neutral
        - date: '2024-05-01'
          label: Major Layoffs (25%)
          details: ~300 employees (~25% of workforce) laid off; largest reduction in company history
          tone: negative
        - date: '2024-10-01'
          label: Guild Talent Advantage
          details: >-
            Nomadic Learning acquired; Guild Talent Advantage AI platform launched; Josh Bersin and Brandon Hall cover
            favorably
          tone: positive
        - date: '2025-01-01'
          label: Macy's Ends Partnership
          details: Macy's discontinues tuition program; first publicly confirmed large-employer departure
          tone: negative
        - date: '2025-04-01'
          label: Spectrum Partnership
          details: Spectrum announces new enterprise partnership with Guild; partial recovery of client roster
          tone: positive
    approximationNotes: >-
      Walmart Live Better U launch year is approximate (circa 2019) based on public references; exact date not confirmed
      from primary sources. Series A date set to 2016-01-01 as exact month is not publicly disclosed.
