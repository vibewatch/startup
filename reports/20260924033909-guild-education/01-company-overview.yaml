  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Guild financial statements and profitability
      missingEvidence: Audited revenue, gross margin, EBITDA, net income, cash position, and burn rate
      whyItMatters: Without financials, capital adequacy and path to profitability cannot be assessed
      diligencePath: Request financial statements from Guild under NDA; review any available Form D filings on SEC EDGAR
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: Guild capitalization table and board composition
      missingEvidence: Full cap table, preferred liquidation preferences, board seat assignments, option pool size
      whyItMatters: Liquidation preferences and board control affect exit economics and governance
      diligencePath: Request cap table from Guild under NDA; cross-reference any Delaware certificate filings
      relatedTableRefs:
        - TO003
    - type: enumeration-incomplete
      severity: material
      topic: Leadership and founder table
      missingEvidence: Full executive team roster (CFO, CMO, CTO roles), current board member names and affiliations
      whyItMatters: Bench depth and board composition affect governance quality and fundraising readiness
      diligencePath: Review Guild LinkedIn, press releases, and SEC Form D officer disclosures for leadership roster
    - type: enumeration-incomplete
      severity: minor
      topic: Milestone table
      missingEvidence: Precise dates for Series A and B rounds, full list of early employer partnerships before 2021
      whyItMatters: Early milestone precision affects understanding of capital efficiency and partnership acquisition timeline
      diligencePath: Review PitchBook/Crunchbase records and SEC Form D filings for early round dates and participants
    - type: conflicting-data
      severity: material
      topic: Walmart partnership status (Workforce Edge displacement)
      missingEvidence: Confirmed current status of Guild's Walmart Live Better U contract; scope of Workforce Edge displacement
      whyItMatters: Walmart is likely Guild's largest historical client; displacement would be a material revenue event
      diligencePath: Seek direct confirmation from Guild or Walmart investor relations; review recent Walmart benefits filings
