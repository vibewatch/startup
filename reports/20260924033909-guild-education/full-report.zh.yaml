chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >
              Guild PBC（运营品牌为 Guild，曾用名 Guild Education）是一家总部位于科罗拉多州丹佛的劳动力教育科技公司，注册为特拉华州公共利益公司。Guild 运营三边市场，连通大型雇主、拥有
              70+ 所优质高校及培训机构的精选网络，以及零自费享受教育福利的一线与职业中期员工。公司成立于 2015 年 6 月，总部设在科罗拉多州丹佛市 Republic Plaza。


              Guild 的商业模式采取双边变现。雇主端按员工总数支付平台订阅费，同时雇主通过 Guild 账单系统向教育机构支付学费时，Guild 会按比例抽取学费分成。教育机构端则在在读员工修完课程或获得证书后，向
              Guild 支付推介费或收入分成。这套机制下，员工可以免费攻读学位课程、考取证书及技能资质，而 Guild 则同时吃下雇主端与供给端的双重变现。美国税法 IRS Section 127
              允许雇主每年向每名员工提供最高 $5,250 的免税教育资助，这让教育福利兼具雇主税收效益，构成了嵌入美国薪酬法规的结构性优势。


              Guild 主要瞄准员工规模 10,000 人以上、单个客户年平台收入潜力超 $1M 的大型雇主。核心雇主客户涵盖 Walmart（Live Better
              U）、Target、Chipotle、Lowe's、Taco Bell、Discover Financial、Hilton、PepsiCo、Tyson Foods、Providence Health、PNC
              Bank 和 JPMorganChase 等。2024 年 10 月，Guild 将平台品牌升级为 Guild Talent Advantage，引入 AI 驱动的人才洞察、职业发展路径，并基于对 Nomadic
              Learning 的收购推出了社群制学习产品 Guild Academy。截至 2025 年，公司服务 500+ 家雇主客户，提供跨越 100+ 个领域的 2,000+ 门学习课程。
            claimRefs:
