      - number: '5.2'
        title: 技术栈与 AI 能力
        blocks:
          - type: paragraph
            body: >
              Guild 的技术基建以 B2B SaaS 平台为核心，包含面向雇主的配置工具、面向员工的学习门户以及导师协同调度层。尽管 Guild 未公开披露详细的架构设计文档，但平台的核心技术模块包括：用于跟踪使用率与
              ROI 的雇主分析看板、结合员工职业目标与雇主预设路径撮合匹配项目的主动推荐算法，以及彻底打破传统报销垫资壁垒的直付结算中台。

              2024 年 10 月随收购 Nomadic 一同上线的 Guild Talent Advantage，引入了 AI 驱动的人才情报能力。Guild 携手头部劳动力市场数据机构 Lightcast，推出了
              Talent Resilience Index 对标工具，让雇主得以参照行业基准衡量自身劳动力的流动性与技能抗风险韧性。与 Lightcast
              的合作跑通了与证书挂钩的实时技能追踪，打通了从学习投入到可验证技能成果的数据链条。Guild 学员在 AI 专项课程中的注册量同比激增 1,200%，三年内有超过 100,000 名学员选修了 AI
              素养与进阶数据技能课程。与 Wharton Online 合作拓展的高管教育项目（涵盖 AI for Business 和 Digital Leadership），更将 Guild 的 AI
              培训半径延伸至企业高管层。从技术投入信号（Glassdoor 工程师评价与招聘动向）来看，Guild 采用了现代云原生技术栈，工程团队分布在丹佛及各远程办公地。收购 Nomadic
              则补进了一套成熟的社群化学习技术平台，具备强大的企业级内容创编与交付能力，将 Guild 在企业级 L&D 领域的路线图推快了估计两到三年。
