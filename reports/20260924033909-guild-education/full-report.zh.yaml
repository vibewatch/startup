        - 据 Sacra 推算单雇主年均约 $550K；合作机构分成比例未公开
        - 双向营收流构筑结构性优势；但 IRS 上限压低了单员工年贡献上限
      - - InStride
        - 平台订阅费 + 大学学费分成
        - 企业级合同；结构与 Guild 相似
        - 未公开披露；因体量较小，整体营收预估低于 Guild 的约 $275M
        - InStride 或采取激进定价争夺份额；走精选优质路线，对标 Guild 的全面覆盖
      - - EdAssist
        - 按员工人头计费的 PEPM（每人每月）代管费
        - 通常为 1–3 年期合同；按 PEPM 结算
        - 未公开披露；纯代管模式预估为 $2–5 PEPM
        - 纯代管单价低于 Guild；但 Guild 的雇主先行代付模式享有溢价
      - - Degreed
        - SaaS 订阅（按席位 / 活跃学员计费）
        - 按年签署的 SaaS 合同；采用 LXP 平台定价
        - LXP（不含学费）预估为每用户每年 $20–50；总合同额差异极大
        - Degreed 聚焦 L&D 平台而非学费支付；定价模式无法直接横向对比
      - - Cornerstone
        - 企业级软件授权许可（SaaS）
        - 多年期企业级 TMS 合同；金额在 $100K–$1M+ 区间
        - 全套 TMS 套件公开报道营收约 $900M
        - Cornerstone 主打全套人才管理套件；学费代管仅为外围功能而非核心创收支柱
    notes: 除 Guild 源自 Sacra 的推算数据外，所有定价信息均未经证实，应视为数量级层面的粗略估算；实际合同金额因雇主规模、项目范围及竞争动态存在显著差异。
