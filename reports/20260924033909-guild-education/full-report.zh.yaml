  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局总览
        blocks:
          - type: paragraph
            body: >
              Guild
              所处的竞争格局跨越多种替代方案，每种方案代表了大型雇主向员工提供教育与学习福利时所面对的不同目标需求。历史上，该市场在传统学费报销服务商、新型教育科技平台以及通用型人才管理软件之间四分五裂，但行业整合与产品线延伸正让各维度的对抗急剧升温。


              与 Guild 最直接相关的竞品可归为四类：第一，雇主资助型学习平台同行——采用类似的三边市场撮合模式连接雇主、员工与教育机构，代表企业为 InStride（2019 年孵化自南加州大学 USC）和
              Workforce Edge（据报道在 Walmart 替换掉 Guild 而备受关注）。第二，传统福利管理服务商——以 Bright Horizons 旗下的 EdAssist
              最具威胁，其在在线教育爆发前就已深耕福利管理，并与财富 100 强（Fortune 100）中的 72 家企业建立了长期合作。第三，学习体验平台（LXP）——Degreed 与 Cornerstone
              OnDemand 均深耕企业 L&D 市场，近年来陆续接入学费与学位项目，与 Guild 的核心业务形成部分正面重叠。第四，企业内部自建——对 Amazon 和 Walmart
              等超大雇主尤为普遍，它们倾向于自建内部学习福利平台而非依赖外部供应商。


              战局正在全线收紧：EdAssist 根基深厚的存量客户群、Workforce Edge 拿下 Walmart，以及 Degreed 在 LXP 领域的扩张，都对 Guild 构成了实质性的竞争威胁；Guild
              既要在核心防线上见招拆招，又要全力推进 Guild Talent Advantage 向企业级 L&D 市场突围。
            claimRefs:
