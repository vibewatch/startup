      - number: '3.2'
        title: 直接竞品画像
        blocks:
          - type: paragraph
            body: >
              InStride（2019 年成立于洛杉矶，孵化自 USC）是雇主出资教育平台模式下与 Guild 最直接对标的同行。InStride
              同样运营三边市场：雇主支付平台费，员工零自费攻读受认证学位与证书课程，教育机构向 InStride 支付收入分成。InStride 累计融资约 $90M，客户包括 American Airlines、PwC 和
              Uber 等。其学术网络覆盖全球约 80 所认证高校。InStride 规模小于 Guild（营收未公开披露，但预估明显低于 Guild 的约 $275M），策略上更注重精选与高客单质量，而非 Guild
              追求的广覆盖打法。InStride 的高校网络国际化程度更高，在 Guild 发力 Guild Grow Global 业务时构成了有力竞争。


              Workforce Edge（Walmart 旗下子公司）据报道在 Walmart Live Better U 项目中替换了 Guild，因而成为极受关注的竞争威胁。Workforce Edge 是专为
              Walmart 内部人才发展需求打造的自研平台，向 Walmart 全美约 1.6 million 名员工提供免学费学位与证书项目。作为依托全球最大私营雇主自身体量建立的专属内生平台，Workforce Edge
              并非传统意义上与 Guild 争夺外部订单的商业竞品——它不对其他雇主商业化开放；但它的存在，暴露了超大型企业倾向于将该能力「内包自建」的固有风险，直接动摇了 Guild 在超大客户场景下的商业逻辑。


              Bright Horizons EdAssist 是雇主出资教育管理的老牌领头羊，与 72 家财富 100 强企业保持合作，并深度嵌入其 HR 与薪酬核算系统。EdAssist
              的模式以学费报销管理为主——专注于管理传统的报销流程（员工申请、修读完结、提交报销凭证），而非提供前端直付与精选合作院校网络。这形成了截然不同的买方合作关系，雇主迁入或迁出 EdAssist
              的转换门槛更低；但这也意味着，在拓展全新大客户时，EdAssist 往往是 Guild 必须正面打破的既有默认选项。
