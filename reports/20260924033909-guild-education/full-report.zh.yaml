      - number: '8.3'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >
              乐观情景的前提是 Navigator 获得规模化采用，在雇主愿从单纯学费管理延伸采购综合人才智能平台的驱动下，到 2026 年将收入增速重新拉升至 15-20%。在此情景下，Guild 将在 2026
              年实现收入约 $350-400M 并伴随 EBITDA 利润率的改善，支撑起 11-12x 的 EV/Revenue 估值倍数（受类似 SaaS 的留存率和切换成本支撑），对应企业价值为 $3.5-4.5B，较
              $1.5-2B 的入场区间实现 2-3x 的回报。基准情景假设收入增速企稳在 8-12%，Navigator 为现有客户带来增量增购（Upsell），但未斩获新的超大企业标杆，2026 年实现收入约
              $310-330M，按 7-9x 估值倍数计算，对应企业价值为 $2.2-3.0B。悲观情景则推演宏观福利削减潮延续（继 Disney 与 Macy's 之后）、Walmart 进一步倒向 Workforce
              Edge，且 Navigator 未能拉开足够的差异化壁垒，导致收入停滞甚至下滑至 $250-275M，估值倍数被压缩至 4-5x（陷入困境的非上市公司估值区间），对应企业价值仅为
              $1.0-1.4B，并可能诱发折价轮（Down-round）融资或资本重组。赋予概率权重：乐观 20%、基准 55%、悲观 25%，计算出概率加权的企业价值约为 $2.1-2.4B。鉴于累计股权融资达 $584M
              且存在优先股堆叠（Preference Stack），普通股对应价值明显偏低；参与二级老股转让或新一轮融资的投资者应主动谈判优先权条款重置或下行保护机制。
