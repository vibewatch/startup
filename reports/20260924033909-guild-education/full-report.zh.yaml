      - number: '3.3'
        title: 能力与功能对比
        blocks:
          - type: paragraph
            body: >
              横向对比四大竞品阵营的核心功能，可以看清 Guild 的相对长板与短板。Guild 的核心差异化在于：(1) 雇主前端直付模式彻底消除了阻碍传统报销普及的员工垫资门槛；(2) 拥有覆盖 70+ 所机构、提供
              2,000+ 门课程的精选网络，规模与深度均大幅优于多数竞品；(3) 配套的真人职业辅导服务，补齐了纯软件工具缺乏的温度与黏性；(4) Guild Talent Advantage 提供的 AI
              驱动人才分析，切中了 CHRO 追求劳动力转型洞见而不止于福利发放的核心痛点，构成了新兴差异化。


              Guild 的短板在于：(1) 缺少一套能帮雇主统管内部所有培训的一体化 LMS/LXP——Degreed 和 Cornerstone 具备这种全景覆盖能力，而 Guild 仍偏向学位和认证通道；(2) 相对于
              Cornerstone OnDemand 的全品类目录，Guild 在企业内训与合规内容层相对单薄；(3) 缺乏媲美 EdAssist 在财富 100 强深耕多年的庞大存量客户盘；(4) Walmart Live
              Better U 合约状态尚无定论，削弱了其最重要的标杆客户背书。


              收购 Nomadic Learning 弥补了其中一块短板——补齐了社群制企业内训能力（Guild Academy 目前在能力学院赛道展开竞争，拿下 Microsoft 和 Accenture 等客户）；但
              Guild 尚未证明升级后的 Guild Talent Advantage 平台能否有效留住那些倾向于把预算整合到 Workday Learning、SAP SuccessFactors 或
              Cornerstone 等全栈人才管理套件中的雇主客户。
            claimRefs:
              - CP010
