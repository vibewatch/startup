      - number: '1.2'
        title: 创始人与管理团队
        blocks:
          - type: paragraph
            body: >
              Guild 由 Rachel Romer（曾用名 Rachel Romer Carlson）与 Brittany Stich 于 2015 年 6 月联合创立。Rachel Romer 是科罗拉多州前州长 Roy
              Romer 的孙女，曾供职于 Lumina Foundation 及相关非营利机构，拥有深厚的教育政策背景。她自创立起担任 CEO，是公司高增长时期的核心代言人，先后从 Bessemer Venture
              Partners、Oprah Winfrey 及 Wellington Management 等投资方手中完成多轮融资。在她的带领下，Guild 从一家丹佛初创企业蜕变，并在 2022 年 6 月跻身估值
              $4.4B 的独角兽阵营。


              2023 年 8 月，Rachel Romer 突发严重中风，被迫长期病休；她最终辞去 CEO 一职，仅保留董事会席位。据 Masters of Scale 及多家媒体报道，Bijal Shah
              在此期间稳住了公司局势。Shah 于 2018 年加入 Guild 出任首席体验官（Chief Experience Officer），此前曾任职于 Teach For America
              等其他教育机构管理层；在过渡期代理 CEO 后，她于 2024 年 4 月 2 日正式接任 CEO。


              Shah 在公司内部面临不小争议。2024 年 10 月抓取的 Glassdoor 数据显示，她的员工支持率仅约 37%，明显低于行业正常水平。据 Higher Education Inquirer 与
              Colorado Sun 报道，员工在 2023 与 2024 年接连两轮裁员期间，对职场文化、激进重组、歧视指控及沟通不力等问题怨言颇多。不过，在 2024 年 10 月 Guild Talent
              Advantage 分析师日之后，The Josh Bersin Company 与 Brandon Hall Group 对 Shah 的战略方向给出了偏积极的评价。Guild 董事会成员涵盖
              Wellington Management 和 Bessemer Venture Partners 等主要资方代表，还包括 Series F 轮投资人 Oprah Winfrey。
