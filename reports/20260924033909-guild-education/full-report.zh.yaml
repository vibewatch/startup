  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范畴
        blocks:
          - type: paragraph
            body: >
              Guild 身处两大体量庞大却截然不同的市场交汇处：雇主资助的教育支持市场（主要立足美国，依托 IRS Section 127
              构建）与更广泛的全球在线及企业学习与培训（L&D）市场。在尽调视角下，两者买方结构、出资机制与竞争格局各异，必须区分审视。


              雇主出资学费资助市场，指美国企业福利支出中专项用于教育的分支——主要涵盖学费报销、免学费学位项目及职业技能福利。约 61%
              的美国企业提供某种形式的教育资金支持，但绝大多数项目采用传统的事后报销模式（员工先自费垫付，结业后再申请报销），而非 Guild 所跑通的雇主前端直付模式。IRS Section 127
              免税条款允许将雇主每年向每名员工提供的最高 $5,250 教育资助排除在员工应税收入之外，借助联邦税法形成了结构性的财税激励。


              全球在线教育市场则囊括学位项目、专业证书、自学式在线课程、企业学习体验平台（LXP）以及培训交付软件。这一市场体量大得多，但也更加分散；Guild
              卡住的特定生态位是雇主居中通道——由雇主（而非个人）扮演买单方与采购方。这种居间角色构成了 Guild 的核心差异化价值，将其与 Coursera、Udemy 等纯 C 端 EdTech
              平台彻底区隔开来。Guild 明确将传统企业内训、合规培训 e-learning 及纯自主进度的微证书市场排除在核心主张之外，转而聚焦学位通道、证书项目，以及如今通过 Guild Academy
              推出的社群制能力学院（capability academies）。
