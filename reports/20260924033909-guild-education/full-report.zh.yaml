      - EV/Revenue 倍数
      - 隐含 EV
      - 概率权重
    rows:
      - - 乐观
        - $375M
        - Navigator 增销与纯新增企业客户驱动同比实现 15-20% 增长
        - 11-12x（平台 / SaaS 重估）
        - $4.0-4.5B
        - 20%
      - - 基准
        - $325M
        - Navigator 带来增量增销，雇主客群保持稳定，同比实现 8-12% 增长
        - 7-9x（非上市成长期软件）
        - $2.3-2.9B
        - 55%
      - - 悲观
        - $265M
        - 0 增长至负增长；Walmart 流失；宏观福利削减加速
        - 4-5x（困境 / 零增长）
        - $1.1-1.3B
        - 25%
      - - 概率加权
        - $312M
        - 加权预期营收
        - 7-8x 加权均值
        - $2.1-2.4B
        - 100%
    notes: >
      所有情景均假设不引入外部新增股权融资；基准情景假设当前资金消耗趋势下自给自足可支撑至 2026 年。乐观情景要求 Navigator 到 2026 年贡献至少 $40-50M 增量 ARR。悲观情景假设 Walmart 贡献约
      10-15% 营收且在 H2 2025 前流失退出。
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Guild 自 2015 年成立至 2024–2025 年重组期的里程碑轨迹：展现独角兽时期的超高速增长，随后经历治理动荡、多轮裁员，并向 Guild Talent Advantage 战略转型。
    data:
      items:
        - date: '2015-06-01'
          label: 成立
          details: Rachel Romer 与 Brittany Stich 在科罗拉多州丹佛创立公共利益公司 Guild Education
          tone: positive
        - date: '2016-01-01'
          label: A 轮融资
          details: Bessemer Venture Partners 领投首轮机构融资；验证教育科技投资逻辑
          tone: positive
        - date: '2019-01-01'
          label: Walmart Live Better U
          details: 与 Walmart 确立核心标杆合作，奠定行业领导地位；全美最大雇主接入平台
          tone: positive
        - date: '2021-06-01'
          label: 估值 $3.75B 的 E 轮融资
          details: General Atlantic 领投 $150M E 轮融资；估值在教育科技繁荣顶峰达到 $3.75B
          tone: positive
        - date: '2022-06-01'
          label: 估值 $4.4B 的 F 轮融资（峰值）
          details: Wellington Management 领投 $175M F 轮融资；投后估值达 $4.4B；Oprah Winfrey 参投
          tone: positive
        - date: '2023-05-01'
          label: 首次裁员（12%）
          details: 裁减约 172 名员工；首次重大人员精简释放增长放缓信号
          tone: warning
        - date: '2023-08-01'
          label: Rachel Romer 突发中风
          details: 联合创始人兼 CEO Rachel Romer 突发严重中风；关键人物风险显现
          tone: negative
        - date: '2024-04-02'
          label: Bijal Shah 出任 CEO
          details: 在担任代理 CEO 约 8 个月后，Bijal Shah 正式出任 CEO
          tone: neutral
        - date: '2024-05-01'
          label: 大规模裁员（25%）
          details: 裁减约 300 名员工（约占员工总数的 25%）；创公司史上最大裁员规模
          tone: negative
        - date: '2024-10-01'
          label: Guild Talent Advantage
          details: 收购 Nomadic Learning；推出 Guild Talent Advantage AI 平台；Josh Bersin 与 Brandon Hall 均给予积极评价
          tone: positive
        - date: '2025-01-01'
          label: Macy's 终止合作
          details: Macy's 停办学费资助项目；首个公开确认流失的大型雇主客户
          tone: negative
        - date: '2025-04-01'
          label: Spectrum 确立合作
          details: Spectrum 宣布与 Guild 达成全新企业级合作；客户名单部分恢复
          tone: positive
    approximationNotes: 根据公开资料，Walmart Live Better U 上线年份为估算值（约 2019 年）；一手来源尚未证实确切日期。因具体月份未公开披露，A 轮融资日期设为 2016-01-01。
    claimRefs:
