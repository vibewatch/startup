      - number: '8.4'
        title: 投资建议、尽调清单与退出就绪度
        blocks:
          - type: paragraph
            body: >
              综合各项尽调证据，本报告给出“有条件投资”（CONDITIONAL INVEST）的评级建议，对应 EV 入场价格不超过 $2.0B，且必须在虚拟数据室（Data Room）中实质核验三项核心验证条件：(1)
              经审计的财务报表证明 2024 年营业亏损实质性收窄；(2) 雇主 NPS 高于 40 且合同续约率高于 85%，以证实裁员后服务交付质量未发生滑坡；(3) 获得 Walmart 多年期续约确认，且不包含倒向
              Workforce Edge 的排他性豁免条款。鉴于存在大量未决证据缺口，对给出正面建议的置信度评定为中（MEDIUM，约
              35%）。受执行风险、客户集中度以及缺乏公开财务披露的影响，整体风险评级为高（HIGH）。按当前发展轨迹评估 Guild 的退出就绪度：短期内通过 IPO
              退出的可能性为低（LOW，宏观市场环境、增长失速及估值倍数承压，使公开发行承销难度极大）；被企业学习平台（如旨在拓宽雇主福利整合能力的 SAP SuccessFactors、Oracle HCM、Workday
              Learning 或 LinkedIn Learning）战略并购的可能性为中（MEDIUM）；通过结构化二级老股流动性方案协助 2022
              年高位入场投资者以低于峰值价格退出的可行性为中高（MEDIUM-HIGH）。对普通股股东而言最能创造增量价值的路径，是在 Navigator 平台加速渗透与雇主合同扩围的共振下，以连续两个季度实现 12%+
              的收入增长作为基本面兑现的证明。任何低于 $1.5B 隐含 EV 的新融资，都将构成投资逻辑破损事件，须对其展开全面重新审视。
            claimRefs: []
