      - number: '5.3'
        title: 院校合作生态
        blocks:
          - type: paragraph
            body: >
              合作院校生态是 Guild 的核心竞争壁垒：公司精心筛选了 70+ 所认证高校与培训机构，课程横跨在线学位、职业证书、专业资质及高管研修。核心教育伙伴包括 Southern New Hampshire
              University、Purdue University Global、University of Phoenix、eCornell（Cornell University）、LSU
              Online、Wilmington University 及 Penn Foster 等。与宾夕法尼亚大学 Wharton Online 的结盟引入了包含 AI for Business 和 Digital
              Leadership 在内的高管培训项目，将 Guild 的受众群从一线员工一路向上穿透至 JPMorganChase 等合作企业的核心管理层。

              Guild 借由一套质检准入机制管控课程质量，综合考核机构认证资质、结业率、与雇主业务的契合度及学员就读体验。包含 2,000+ 门课程的目录横跨 138 个学科领域；2024 年，80%
              的学位与证书学员选修了紧扣企业业务诉求的课程。医疗类课程同比增长 45%，达到 400 门以上，反映了公司针对医疗行业用工荒所做的垂直赛道定向扩张。院校端变现采取学费分成机制：Guild
              在学员选课入读时抽取一定比例的学费，使自身商业诉求与真实就读深度挂钩，而非流于福利的表面开通率。

              收购 Nomadic Learning 则吸收了一套聚焦领导力培养、AI 素养及组织能力建设的企业级内容库与能力学院平台。Nomadic 的社群制培训模式（曾服务于 Josh Bersin Academy
              等大客户）现已全面接入 Guild Academy，并成功签下 Microsoft 与 Accenture 等标杆客户，标志着 Guild 跨越传统学费代管、正式杀入更广阔的企业级 L&D
              蓝海。自上线以来，已有超过 300,000 名学员参与了 Guild Academy 的学习项目。
