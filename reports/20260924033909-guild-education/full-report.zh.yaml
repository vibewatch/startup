      - number: '6.2'
        title: 标杆客户案例与采纳走势
        blocks:
          - type: paragraph
            body: >
              Guild 最显眼的客户背书来自一批公开发布教育福利计划的 Fortune 100 头部品牌。Walmart 的“Live Better U”（LBU）项目最具代表性：2018 年起与 Guild
              联手上线，2022 年 6 月进一步扩围，全额报销所有攻读大学学位的时薪员工学杂费，覆盖超过 1.4 million 名符合条件的 Walmart 美国门店及供应链员工。Chipotle 的“Cultivate
              Education”项目于 2019 年 4 月启动；据 Chipotle 披露，截至 2021 年 6 月，项目启动前两年已有 500 名员工修完学位。Target 的“Dream Big, Dream
              Machine”项目为其门店与供应链一线工人接入 Guild 合作大学的 175+ 门课程。Hilton 则于 2019 年宣布与 Guild 合作，提供免除学贷压力的学士与副学士学位。


              Taco Bell、Lowe's、Sherwin-Williams、PNC Bank 与 Charter Communications（Spectrum）也是公开披露的合作雇主。Spectrum 于 2025 年
              4 月作为最新伙伴入驻。然而与之形成对冲的是，Disney 于 2024 年 9 月关停由 Guild 支撑的“Aspire”项目，Macy's 亦在多年合作后于 2025 年 1 月终止与 Guild
              的合作。在企业愈发看重性价比、频频权衡低成本替代方案与竞品平台之际，这类合作叫停释放了客户群稳定性受损的实质信号。纵观整体采纳走势，平台在 2018 年至 2022 年间飞速扩张，随后出现急剧降速。Sacra
              估计其收入从 2022 年的 ~$200M 增至 2023 年的 ~$261M，并在 2024 年达到 ~$275M，同比增速由 ~25% 骤降至 ~6%——这与大企业目标客群逐步见顶的走势完全吻合。
