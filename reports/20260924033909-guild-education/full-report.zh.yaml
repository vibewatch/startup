      - number: '4.2'
        title: 单体经济模型与利润率结构
        blocks:
          - type: paragraph
            body: >
              Guild
              的单体经济特征表现为：具备典型大企业销售的高获客成本（CAC）、平台订阅业务相对可观的毛利率，以及教育机构学费分成业务偏低的毛利率（因为付给机构的学费属于通道成本）。真人职业辅导是一笔沉重的营业成本（COGS）：Guild
              聘用了数百名职业导师，每次辅导互动都会产生随员工活跃度水涨船高的边际成本。目前尚无公开可查的经审计毛利率数据；分析师对平台型 EdTech 企业的测算表明，软件与订阅业务毛利率大致在 50–70%
              区间，而撮合分成业务毛利率约为 20–40%。


              Sacra 预估的单雇主年平均收入约 $550K 说明，只要留存率过硬，单个客户的生命周期价值（LTV）就相当可观；然而，Macy's 和 Disney 在 2024–2025 年的离去，以及据报道在
              Walmart 遭遇的替换，反映出即使是头部客户也存在流失风险。Guild 官方声称 2024 年平台沉淀了 1.4M+
              员工学习轨迹，这是核心的活跃度指标；但参与率（活跃学员占覆盖总员工的比例）与结业率（拿满学位或证书的员工比例）均未公开披露。课程结业是触发向高校支付学费的扣减节点，这形成了与学员学业成果深度挂钩的可变成本结构——虽然社会效益显著，但若结业率攀升速度超过平台订阅费增长，就会直接挤压毛利。


              前后两轮裁员（2022 年预估裁减约 300 人，2024 年 5 月裁减约 300 人）反映出 Guild 已采取结构性控费动作来优化单体经济效益并延长跑道。这些举措将员工人数从 2022 年约 1,100
              人的峰值预估规模，压缩至 2025 年预估的约 500–600 人；固定成本基建大幅减轻，在营收降速的背景下，很大可能拉平并改善了公司的 EBITDA 走势。
            claimRefs:
              - CI005
              - CI006
              - CI007
