      - number: '1.3'
        title: 融资历程与估值演变
        blocks:
          - type: paragraph
            body: >
              自 2015 年成立以来，Guild 累计斩获约 $584M 风险投资。公司的融资轨迹呈现出典型的超高速增长曲线：早期由 Bessemer Venture Partners 注入机构资金，在 2020–2021
              年零利率与疫情催生的教育科技热潮下迅速跑完 Series D 和 Series E，并在 2022 年 6 月完成投后估值 $4.4B 的 Series F
              轮融资——这创下了丹佛初创公司的估值顶峰之一，也是企业出资在职学习市场的最高纪录。


              标志性轮次包括：由 General Atlantic 领投、Bessemer 与 Salesforce Ventures 等跟投的 Series E 轮（2021 年 6 月融资 $150M，估值约
              $3.75B）；以及由 Wellington Management 领投、Oprah Winfrey、Bon Secours Mercy Health、Citi Impact Fund 及 Bessemer
              Venture Partners 跟投的 Series F 轮（2022 年 6 月融资 $175M，投后估值 $4.4B）。据 Inside Higher Ed 与 CNBC
              广泛报道，各轮融资均创下估值里程碑。


              自 2022 年 6 月以来，公司未再引入新的一级市场股权投资——截至本报告成文已时隔约四年。截至 2024 年，二级市场测算其隐含估值约为 $1.5–2B，较 $4.4B 的估值顶峰缩水
              55–65%。Sacra 预估 Guild 在 2023 年营收约 $261M，2024 年营收约 $275M，同比增速仅为个位数百分比——远不足以支撑其估值倍数重返顶峰。Guild
              依然是非上市公司，未公开披露盈利状况、EBITDA 或现金储备跑道等任何信息。一级市场新资金的长期缺位，引发了第 4 章所探讨的资本充足度隐忧。
