companyProfile:
  summary: >
    Guild Education（法定名称为 Guild PBC，特拉华州公共利益公司）是一家总部位于丹佛的劳动力教育与人才发展公司，由 Rachel Romer（曾用名 Rachel Romer Carlson）与 Brittany
    Stich 于 2015 年 6 月创立。Guild
    运营三边市场，借助雇主出资的学费福利管理，连通大型企业雇主、教育与技能培训机构，以及一线与按小时计酬员工。雇主支付平台订阅费；教育机构按在读学员缴纳收入分成；员工则零自费攻读学位与证书课程。平台服务 500+ 家企业雇主，包括
    Walmart（Live Better U）、Chipotle、Lowe's 和 Hilton 等，拥有 150+ 所教育合作伙伴，包括 Arizona State University 与 Southern New
    Hampshire University。Guild 于 2024 年推出 Navigator（一款整合职业晋升路径、技能差距分析与人才梯队管理的 AI 劳动力智能平台），并收购 Nomadic
    Learning（专业培训业务），以此跨出纯学费福利管理的范畴。2024 年 4 月，因 Rachel Romer 健康原因离任，Bijal Shah 接任 CEO。Guild 随后接连两轮裁员（2023 年 5 月裁减约
    12%；2024 年 5 月裁减约 25%），员工规模缩减至约 900 人。公司最近一次一级市场股权融资发生于 2022 年 6 月（Series F 轮，按 $4.4B 估值融资 $175M）；融资总额约 $584M。FY2024
    预估营收为 $275M，较 FY2023 的 $261M 增长约 6%。二级市场推算当前 EV 约为 $1.5-2B，相比 Series F 估值顶峰缩水 55-65%。
