      - number: '1.4'
        title: 平台规模与关键里程碑
        blocks:
          - type: paragraph
            body: >
              自 2015 年成立以来，Guild 平台规模大幅扩张。根据 2025 年 1 月通过 BusinessWire 发布的 2024 年度影响力报告，Guild 披露其平台覆盖员工达 1.4 million
              名；2024 年新增 465,000 名员工获得平台使用权限；达成 60,000 次课程结业与毕业；为学员累计节省学费超 $1 billion。公司网络覆盖 70+ 所教育机构和跨越 100+ 个领域的
              2,000+ 门学习课程，合作院校包括 Purdue Global、SNHU、ASU Online、eCornell、University of Florida Online、Spelman College 与
              NC A&T 等。


              关键里程碑包括：2015 年 6 月成立、2016 年获 Bessemer 早期注资、2019 年前后敲定标志性的 Walmart Live Better U 合作、2022 年 6 月达成 Series F 轮
              $4.4B 估值顶峰、2023 年 8 月 Rachel Romer 中风病休、2023 年 5 月首轮大规模裁员（约 172 名员工，占比约 12%）、2024 年 4 月由 Bijal Shah 接任
              CEO、2024 年 5 月第二轮更大规模裁员（约 300 名员工，占比约 25%）、2024 年 10 月收购 Nomadic Learning 并上线 Guild Talent Advantage、2025
              年 1 月终止 Macy's 合作，以及 2025 年 4 月拿下 Spectrum 合作项目。


              2024 年，Guild 平台上的 AI 专项课程注册量同比暴涨 1,200%，印证了大型雇主对 AI 技能转型的旺盛需求。约 80% 攻读学位与证书的学员报名了紧扣企业业务诉求的课程，支撑了 Guild
              对雇主宣传的投资回报（ROI）逻辑。Guild 还借助 Guild Grow Global 拓展海外版图，在加拿大、墨西哥、印度和英国提供项目，不过其国际业务的营收贡献未公开披露。
