      - number: '2.2'
        title: 市场空间测算——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              测算 Guild 的潜在市场空间，需要从自上而下雇主教育支出、自下而上雇主数量与客单价、以及同业公司营收基准三个互补视角交叉验证。


              自上而下视角：据 Lumina Foundation 和 SHRM 测算，美国雇主每年在学费资助和雇主资助教育上的总支出预估达 $26–28 billion。其中，雇主前端直付且由技术平台居中撮合的细分赛道（即
              Guild 模式）仅占一小部分，多数雇主仍沿用传统报销流程。假使随着时间推移，Guild 类平台能吃下这一 $28B 市场的 20–30%，意味着美国技术驱动型雇主资助学习平台的长期 TAM 约为
              $5.6–8.4B。


              自下而上视角：Guild 锁定员工规模 10,000 人以上的大型雇主。据美国劳工统计局（BLS）数据，全美员工数超 10,000 人的雇主约有 900 家。若成熟客户平均年合同额（ACV）按 $1–2M
              计，该客群可触达的年平台收入 SAM 粗略在 $900M–$1.8B 之间。以 Guild 官方披露的 500 家活跃客户、并假设单家雇主平均收入约 $550K（按 Sacra 预估的约 $275M 营收除以
              500 家客户推算），当前营收表明 Guild 大致吃下了整个 $28B 支出市场的 0.03–0.06%。


              SOM 视角：Guild 当前在 FY2024 的预估营收约 $275M，代表其已变现的 SOM。中短期 SOM 扩张主要取决于存量客户挖潜（坐席扩容）及引入新企业客户。若客户群拓展至 700–800
              家雇主、单客年均价值达到 $600–800K，近期 SOM 有望触及 $420–640M。规模超 $300B 的全球 L&D 市场大体超出了 Guild 当前的业务范畴，但借助 Guild Talent
              Advantage 与 Guild Academy 的企业培训扩张，构成了长期期权。
