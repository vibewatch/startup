      - number: '7.2'
        title: 监管与立法风险
        blocks:
          - type: paragraph
            body: >
              对 IRS Section 127 条款的结构性依赖，是 Guild 最核心的政策监管风险。该条款允许雇主每年向员工发放最高 $5,250 的免税教育福利，自 2001 年以来一直为 Guild
              所处的整个市场提供稳固的立法支撑。尽管该免税上限从未被削减或废止，但国会一旦提出任何重构方案或引入收入资质审查，都将实质性压缩 Guild 全体雇主客群的需求。Mercer 与 AON
              的分析证实，该条款撬动了每年约 $26B 的雇主教育总支出，其中仅有一小部分流经 Guild 这类受托代管平台。除 Section 127 外，Guild 针对部分结构化福利计划安排还须满足 DOL 的
              ERISA 合规要求，处理与合作院校数据流通时面临的 FERPA 隐私合规义务，以及以 CCPA 及其州级同类法案为代表、各州碎片化演进的数据隐私法规。依据课程类型与交付形式，个别州级办学许可要求亦可能适用，不过
              Guild 大体仰赖合作大学维系各州的审批合规。截至研究基准日，在 SEC Form D 检索和公开媒体报道中，未见针对 Guild
              重大诉讼或监管执法行动的公开记录，但未见披露并不等同于法律层面的绝对安全，仍需依靠正式的数据室尽调查实是否隐匿实质性风险。依现有公开记录，2023 与 2024
              年裁员引发的劳动法风险，截至研究基准日同样未见任何已立案的集体诉讼。
            claimRefs: []
