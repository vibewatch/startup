      - number: '5.4'
        title: 产品路线图与全球扩张
        blocks:
          - type: paragraph
            body: >
              Guild 的产品路线图显示，公司正有意识地从单一学费报销方案，拓展为全面的劳动力发展平台。2024 年 10 月收购 Nomadic Learning 是最关键的一步战略动作：借此加速切入规模超 $28B
              的企业 L&D 市场，补齐了群组化学习能力、企业级内容库，并吸纳了一批将 L&D 与教育福利分开采购的新企业客户。收购整合后推出的 Guild Academy，专门瞄准 Guild 此前难以触达的 Fortune
              500 企业 L&D 预算。

              Guild Grow Global 代表其全球扩张战略，将平台延伸至加拿大、墨西哥、印度和英国，并支持多币种结算。这契合了跨国雇主的需求，也让 Guild
              得以服务美国既有企业客户的全球员工。目前其学费报销产品已覆盖全球几乎所有国家，方便跨国公司推行统一的教育福利方案。

              Guild Navigator 处于早期试用阶段，合作方包括 OSF Healthcare、Children's Nebraska 和 Good Jobs
              Birmingham，专门解决持证岗位供给梯队问题——为在职员工开辟通往 CNA、MA 及 CDL 等持证岗位的结构化晋升路径。该产品计划于 2026 年初正式全面推向市场。Walgreens 的
              PharmStart 项目资助 300 名员工全额免费修读药剂学院先修网课，堪称 Navigator 产品策略的代表。但战略风险在于产品线铺得过宽：一家 900
              人的公司要同时掌管五条成熟度各异的产品线，在业务优先级取舍和专业销售配置上难免吃紧。Macy's 终止合作（2025 年 1 月）以及 Walmart 转向 Workforce
              Edge，都是明确的反向信号：在新产品不断推进的同时，核心产品 Learning Marketplace 必须拿出扎实的 ROI，才能稳住超大客户。
            claimRefs: []
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群体与分层
        blocks:
          - type: paragraph
            body: >
              Guild 的客户群体主要由 Fortune 500 强及准 Fortune 500
              大型雇主构成，员工人数底线通常在数万人以上。这些企业多集中于人员流动率高、同时受监管或竞争驱动而有强烈留存和技能提升诉求的行业。其服务的五大核心垂直赛道包括：零售与电商、餐饮与快餐厅、医疗保健与医院、酒店住宿与旅游，以及金融服务/银行业。这些领域具备共同的结构性顺风：BLS
              数据显示，接受过一定程度高等教育的劳动者，其薪资比仅有高中学历者高出 17–25%，且失业率明显更低，为雇主资助教育提供了令人信服的 ROI 依据。


              Guild 的采购决策者是大企业福利副总裁/总监或首席人力资源官（Chief People Officer）；使用者是报名参加项目的时薪制或职业中期员工；实际买单方则是雇主（通常为自保雇主），他们依靠 Guild
              的直连结算基础设施划拨学费。其业务地域目前几乎全部集中在美国本土，不过 Guild Grow Global 已开始将福利管理拓展到加拿大、墨西哥、印度与英国。Guild
              未公开披露各垂直行业的收入细分或系统性客户名单，本章客户分层均根据官方新闻稿、分析师报告（Sacra、Contrary Research）以及个别合作的新闻报道重构整理。公司自行披露的“500+
              家雇主客户”和“1.4 million 名参与员工”构成了主要规模基准；所有客群细分拆解均为预估。
