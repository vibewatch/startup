      expectations; Forbes pre-close figure of $2B may not reflect final terms.
    diligencePath: >-
      Request term sheet or post-close investor communications; consult Balerion Space Ventures or IQT directly for
      confirmed valuation.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: >-
      Full board of directors composition including investor-appointed seats, independent directors, and governance
      rights attached to each seat
    whyItMatters: >-
      Board composition determines effective control, voting rights, and fiduciary oversight; IQT board observer rights
      and QIA board representation status are undisclosed.
    diligencePath: >-
      Review Delaware incorporation documents and any public filings; request board observer agreement terms from
      company; confirm IQT and Balerion seat terms.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: investor-terms
    missingEvidence: >-
      Cap table, ownership percentages, liquidation preferences, anti-dilution provisions, and full investor list for
      all funding rounds including pre-Series A McCaleb contributions
    whyItMatters: >-
      Without cap table detail, effective economic and voting control cannot be assessed; foreign investor QIA and
      national-security investor IQT may carry special provisions.
    diligencePath: >-
      Request post-close capitalization table from company; review any CFIUS filings related to QIA and IQT involvement;
      obtain investor rights agreement.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-arr
    missingEvidence: >-
      Vast Space revenue, ARR, backlog, contracted customer commitments, and financial projections for Haven-1
      operations
    whyItMatters: >-
      The company is pre-revenue and has not disclosed any commercial contracts generating income; the entire investment
      thesis depends on unproven future revenue from station operations and the NASA CLD Phase 2 contract, neither of
      which is confirmed.
    diligencePath: >-
      Request audited financials or management accounts; obtain Haven-1 customer Letter of Intent or contracts; review
      NASA CLD Phase 2 procurement status and likelihood of award.
    relatedQuestionRefs:
      - QO018
  - type: missing-source
    severity: minor
    topic: competitor-comparison
    missingEvidence: >-
      Direct independent comparative analysis of Vast vs. Axiom Space, Starlab Space, and Blue Origin Orbital Reef on
      capital raised, technical maturity, NASA relationships, and customer traction
    whyItMatters: >-
      Relative competitive positioning determines whether Vast's CLD Phase 2 bid is leading or trailing; Forbes, Payload
      Space, and Aerospace America note Axiom Space and Starlab are also competing with different timelines.
    diligencePath: >-
      Source investor analysis reports on commercial space station sector; review Axiom Space, Starlab, and Blue Origin
      Orbital Reef recent funding and milestone announcements.
    relatedQuestionRefs:
      - QO016
  - type: missing-source
    severity: material
    topic: business-model-revenue
    missingEvidence: >-
      Specific pricing for Haven-1 research berths, crew mission slots, and manufacturing time; detailed customer
      contracts or LOIs beyond research proposal solicitations
    whyItMatters: >-
      Revenue model viability depends on achieving commercial pricing that covers station operations plus debt service;
      research mission pricing from Axiom Space PAMs provides a market reference but Vast-specific pricing is unknown.
    diligencePath: >-
      Review Vast RFP responses to NASA PAM, science RFP eligibility requirements for Haven-1, and any public statements
      on mission pricing structure.
    relatedQuestionRefs:
      - QO017
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      Internal development milestones, failed test campaigns, non-public commercial negotiations, and pre-announcement
      decisions that shaped the current development trajectory
    whyItMatters: >-
      The milestone table captures publicly announced events; key decisions such as the timing and rationale for the
      Haven-1 launch date slip and any scope reductions in the Haven Demo mission are not fully documented.
    diligencePath: >-
      Interview company engineering leadership; review NASA Space Act Agreement milestone reports; request Vast's CLD
      Phase 2 proposal documentation under FOIA.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: commercial-crewed-station-tam
    missingEvidence: >-
      An independent bottom-up TAM study specifically quantifying the crewed LEO station services market—distinct from
      the broader LEO satellite communications and Earth observation market—with disclosed methodology, demand survey,
      and realistic pricing assumptions.
    whyItMatters: >-
      All published analyst estimates conflate the LEO satellite constellation market ($8–$16B in 2026) with crewed
      station services; investors and operators cannot underwrite capital allocation without a credible,
      segment-specific market model. NASA's own skepticism about non-government demand (March 2026) makes the absence of
      this evidence more consequential.
    diligencePath: >-
      Commission or identify a sector-specific market study focused on sovereign astronaut mission revenue, microgravity
      R&D payload spending (interviews with pharma/biotech R&D VP-level buyers), and in-space manufacturing economic
      modeling; cross-reference with ISSNL utilization data and Axiom mission pricing benchmarks.
    relatedQuestionRefs:
      - QM007
  - type: stale
    severity: material
    topic: first-commercial-station-operational-validation
    missingEvidence: >-
      Demonstrated operational metrics from any commercial LEO station: crew stay duration, payload throughput, on-orbit
      failure modes, actual mission revenue, and customer satisfaction data from real crewed missions.
    whyItMatters: >-
      No commercial crewed space station has yet been operational; every assumption about demand realization,
      utilization rates, operational costs, and crew safety economics is based on ISS analog data or company
      projections. Until Haven-1 or Axiom's first module operates commercially, the entire market model is theoretical.
    diligencePath: >-
      Track Haven-1's Q1 2027 launch and first mission results; monitor Axiom Hab One's ISS integration and early
      commercial mission metrics; review ISSNL payload booking rates as a demand proxy.
    relatedQuestionRefs:
      - QM014
  - type: conflicting-data
    severity: material
    topic: nasa-cld-phase2-acquisition-outcome
    missingEvidence: >-
      Definitive NASA Phase 2 AFP release terms, award decisions, recipient count, and per-recipient funding levels;
      clarity on whether NASA has abandoned the standalone-station model in favor of a docking-module approach.
    whyItMatters: >-
      The Phase 2 procurement outcome is the single most important near-term value catalyst for all CLD competitors
      including Vast; whether NASA awards 2 vs. 3+ providers and at what funding levels directly determines Vast's
      revenue trajectory and required private capital for Haven-1 and Haven-2.
    diligencePath: >-
      Monitor NASA SOMD announcements and procurement portals for AFP release through Q3 2026; track Congressional
      appropriations actions on the CLD line item; review any revisions to the NASA CLD directive following the March
      2026 pivot.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: non-nasa-commercial-demand-binding-contracts
    missingEvidence: >-
      Binding commercial contracts or letters of intent from non-government customers for LEO station services; actual
      payload revenue figures from Axiom's private astronaut missions; Vast's payload booking rate and pricing for
      Haven-1 Lab slots.
    whyItMatters: >-
      NASA market skepticism in March 2026 is grounded in the absence of demonstrated non-government demand; the entire
      investment thesis for commercial station operators rests on this market eventually materializing at scale beyond
      the government anchor. Without binding commercial commitments, market realization remains speculative.
    diligencePath: >-
      Request Vast's Haven-1 Lab payload booking data (contracted vs. LOI vs. in discussion); obtain Axiom mission
      revenue disclosures or triangulate from reported mission pricing ($50–$55M per seat benchmark); interview R&D
      procurement leads at pharma and biotech firms regarding actual budget lines for in-space experimentation.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: orbital-reef-cdr-status
    missingEvidence: >-
      A public statement or NASA milestone completion announcement confirming whether Orbital Reef has completed or is
      progressing through a critical design review as of May 2026.
    whyItMatters: >-
      CDR completion is the key differentiating milestone between design-phase and manufacturing-phase readiness; absent
      CDR confirmation, Orbital Reef's competitive standing relative to Axiom (CDR done) and Starlab (CDR ahead) cannot
      be precisely placed.
    diligencePath: >-
      Monitor Blue Origin and Sierra Space press releases and NASA CLD milestone notices; check NASA's upcoming AFP for
      CLD Phase 2 which will likely require CDR status disclosure from applicants.
    relatedQuestionRefs:
      - QP019
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Any public disclosure of commercial crew mission pricing, payload hosting rates, or partner agreement financial
      terms for any CLD competitor.
    whyItMatters: >-
      Without pricing benchmarks, assessing Vast's revenue model viability and its ability to compete
      commercially—independent of NASA anchor spend—is not possible. Market sizing cannot be validated without unit
      economics proxies.
    diligencePath: >-
      Request commercial terms as part of investor diligence; seek comparable pricing data from ISS National Lab payload
