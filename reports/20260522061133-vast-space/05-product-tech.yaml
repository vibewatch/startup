company:
  name: "Vast Space"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Vast's product portfolio centers on Haven-1, a 45 m³ habitable-volume commercial space station
    under active integration in Long Beach and targeting a Q1 2027 launch on SpaceX Falcon 9.
    The preceding Haven Demo satellite (Nov 2025–Feb 2026) completed 49 test objectives validating
    avionics, power, GNC, propulsion, and communications before a controlled deorbit, providing
    flight heritage directly applicable to Haven-1. Vertically integrated primary structure
    manufacturing has delivered two aluminum hulls in under fifteen months each, and a NASA Space
    Act Agreement enables environmental testing at NASA's Neil Armstrong Test Facility. Key
    unresolved risks include dependence on SpaceX for launch, crew transport, and connectivity;
    open-loop ECLSS suited only to short-duration missions; and a launch schedule that has already
    slipped once from mid-2026 to Q1 2027.

sections:
  - id: "haven-1-architecture"
    title: "Haven-1 System Architecture and Subsystems"
    body: >
      Haven-1 is a single-module commercial space station designed for four-person crews on
      two-week missions. The pressurized structure is an aluminum cylinder 4.4 m in diameter
      and 10.1 m tall, enclosing 45 m³ of habitable volume within 80 m³ of total pressurized
      volume, at a launch mass of 14,600 kg. It targets a 51.6° inclination orbit at 425 km
      altitude, broadly compatible with the ISS orbital plane to simplify rendezvous planning.

      Power comes from twelve deployable solar array wings supplied by Spanish manufacturer
      DHV Technology, each producing 1.1 kW for a peak total of 13.2 kW, supplemented by
      in-house battery modules assembled through cell screening, pack assembly, and testing.
      The triple-junction photovoltaic cells are optimized to capture a broad spectral range.
      Solar array electroluminescence testing was performed at Vast HQ to verify cell viability.

      Attitude control relies on six in-house-designed control moment gyroscopes (CMGs), each
      consisting of a fast-spinning flywheel on an articulated gimbal. Propulsion is provided
      by Impulse Space's Saiph thruster system — a storable N₂O/ethane propellant combination
      driving RCS thrusters for CMG augmentation and dedicated deorbit thrusters for end-of-life
      disposal. The Saiph thruster was already qualified before Haven-1 selection and carried
      additional flight heritage from Haven Demo's in-orbit test burns in January 2026.

      Docking uses a passive International Docking Adapter (IDA) that completed a fit-check with
      SpaceX Dragon hardware in October 2025. Communications rely on a SpaceX Starlink laser
      terminal providing gigabit-speed, low-latency Internet for crew devices, payload racks,
      and external cameras, plus a redundant GEO/ground-station RF pathway tested on Haven Demo.
      A 1.1 m domed observation window occupies the aft face of the Common Area and doubles as
      a structural element with micrometeoroid and orbital debris (MMOD) shielding.

      Haven-1 Lab occupies the forward bay with ten Middeck Locker Equivalent (MLE) payload
      slots capable of remote commanding and monitoring via Starlink. Payload partners including
      Redwire, Yuri, JAMSS, Interstellar Lab, and Exobiosphere have reserved capacity described
      as nearing full as of April 2025. Thermal control uses additively manufactured cold plates
      that conduct heat from avionics into a fluid loop, with thermal radiators installed during
      Phase 3 integration.
