  - id: "haven-demo-validation"
    title: "Haven Demo: In-Orbit Technology De-risking"
    body: >
      Haven Demo was a demonstration satellite launched November 2, 2025 on SpaceX's Bandwagon-4
      rideshare from Cape Canaveral. It separated from the rocket, deployed its solar panels within
      four minutes, achieved power-positive status at T+15 minutes, and established two-way
      communications 23 minutes after separation. Over a three-month mission it completed 49 test
      objectives covering every critical space station technology domain, remaining power-positive
      throughout including during historically elevated solar weather activity.

      The core avionics suite, power distribution, Impulse Space Saiph propulsion, GNC hardware
      and algorithms, RF communications, cameras, and flight software were all tested against
      pre-flight models. Radiation effects on orbit matched ground predictions. GPS navigation
      revealed unexpected interference in conflict regions and was subsequently patched via
      software update, confirming the ability to uplink flight software updates. Propellant
      performance data from the Saiph system was collected to calibrate propellant management
      plans for Haven-1. RF communication over the same GEO and ground assets destined for
      Haven-1 was validated with real orbital data.

      Vast operated a multi-tier ground test infrastructure throughout: a Ground Test Simulator
      (GTsim) running thousands of mission simulations with varying parameters; a Software-in-the-
      Loop (SITL) asset for flight software testing on a virtual spacecraft; and a Hardware-in-the-
      Loop (HITL) asset for simultaneous flight hardware and software testing. Real flight data
      from Haven Demo was used to refine the HITL models, producing a higher-fidelity test asset
      for Haven-1.

      In January 2026, mission operations conducted test burns of the Saiph thrusters, validating
      propellant conditioning and anchoring thrust performance to ground vacuum test data. On
      February 4, 2026, the controlled deorbit sequence was executed, lowering perigee by 170 km
      before the terminal deorbit burn targeted a splashdown area in the South Pacific Ocean.
      NASA, aviation, and maritime safety authorities were coordinated. Vast describes itself
      post-deorbit as "the first operational commercial space station company to design, manufacture,
      fly, operate, and deorbit a spacecraft" and states it is approximately 40% of the way to a
      continuously crewed station. The mission directly de-risked Haven-1's avionics, power, GNC,
      and communications subsystems, though it did not test life support or crew habitation systems.
