summary:
  headline: >-
    Vast Space 已经拿出真实硬件进展，团队可信，也抢在后 ISS 时代 LEO 空间站赛道前排，并完成 $500M 机构轮；但它对 SpaceX、NASA CLD 奖项和未收入状态的二元依赖太重，>$2B
    隐含估值下更适合继续研究 / 观察，不是买入。
