  - id: adverse-analysis-and-overvaluation-risks
    title: "Adverse Analysis: Overvaluation Risks, Dilution, and Downside Triggers"
    body: >-
      The $2.3 billion implied equity valuation is stretched relative to Vast's current
      fundamental profile: zero disclosed revenue, zero ARR, no confirmed customers beyond
      the pre-PAM NASA contract and a single undisclosed satellite bus order, and a $200 million
      debt obligation with undisclosed terms. The case for this valuation rests almost entirely
      on option value—the potential to become a NASA-anchored commercial station operator—and
      on strategic scarcity value in a sector where pre-construction competitors are raising
      capital at comparable or higher prices.


      NASA's own position—that a viable independent commercial LEO business case does not yet
      exist—poses a structural adverse signal. The commercial LEO economy beyond government
      anchor customers is effectively zero today, and CEO Max Haot's public statement that the
      company models "close to zero dollars for the LEO economy in the next five years" from
      non-NASA sources confirms the programme's dependence on government.


      Multiple compression risk is material. Private space infrastructure valuations in 2023–2024
      experienced significant contraction. A 30–50% sector-wide compression would bring the
      $2.3 billion mark to $1.2–1.6 billion without any company-specific deterioration.


      Dilution risk is compounded by capital intensity: Vast will require at least one more major
      equity raise before Haven-2 becomes operational (estimated $1–2 billion in additional
      capital), which will dilute Series A investors significantly if executed below the current
      implied mark.


      Governance concentration risk is present. Jed McCaleb retains founder control; the terms
      of protective provisions, anti-dilution rights, and board representation for Series A
      investors are not publicly disclosed. IQT and QIA participation reduces pure financial
      pressure but introduces strategic considerations that may not align with maximising
      financial return for financial investors.
