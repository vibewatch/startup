  - id: valuation-framework-and-methodology
    title: "Valuation Framework: Applicable Methods for a Pre-Revenue Deep-Tech Startup"
    body: >-
      Vast is pre-revenue in its core space-station business as of the run date. Traditional
      discounted-cash-flow analysis is not appropriate at this stage: revenue is contingent on
      events that have not yet occurred (CLD Phase 2 award, Haven-1 launch), cost structures
      are partially estimated, and discount rates for a company with this risk profile would
      produce near-zero present values under any reasonable assumption set. Four more applicable
      methods are used in this chapter.


      First, implied pricing from the most recent financing: the December 2025 Forbes reporting
      plus the March 2026 confirmed deal structure imply a post-money equity valuation of
      approximately $2.3 billion. This is the anchor mark, with acknowledged uncertainty around
      whether the pre-money estimate accurately reflects the final deal.


      Second, replacement-cost analysis: Vast has deployed more than $1 billion in capital to
      produce Haven Demo (flew and deorbited successfully in November 2025), Haven-1 (in
      integration phase), a 189,000 sq ft Long Beach campus, Mojave test stand, a team of
      1,000-plus people, and Vast Satellite's first commercial satellite bus order. The
      going-concern replacement cost of these assets—including flight heritage, IP, certifications,
      manufacturing relationships, and the NASA partnership—is plausibly above $1 billion
      invested, consistent with the $2.3 billion implied valuation carrying a modest control
      premium and strategic option value.


      Third, milestone-adjusted probability analysis: the most important value event in the
      near term is the NASA CLD Phase 2 funded Space Act Agreement award, expected mid-2026.
      Winning Phase 2 converts Vast from a single-programme development company into a
      government-anchored commercial operator with multi-year contracted revenue and a path to
      Haven-2 operations. This single award could re-rate equity value by $1–2 billion.


      Fourth, strategic comparables: comparable private rounds (Sierra Space at $8 billion,
      Axiom Space at multi-hundred-million) and public-market peers (Rocket Lab at approximately
      13× EV/2025-revenue) provide a relative-value frame. Collectively, these methods support
      a valuation range of $0.5–5 billion across scenarios, with the base case of $2.0–3.0
      billion anchored on Phase 2 and PAM execution.
