  - id: recommendation-and-diligence-asks
    title: Investment Recommendation and Final Diligence Asks
    body: >-
      The recommended investment posture for Vast Space as of May 2026 is "research-more."
      The company has significant strategic strengths—first-flight hardware heritage, a
      diversified institutional investor syndicate, a confirmed NASA PAM award, and a credible
      CLD Phase 2 competitive position—but the investment case cannot be assessed with adequate
      confidence until the Phase 2 outcome is known (mid-2026), the implied equity valuation
      mark is confirmed, and the debt terms are disclosed.


      A "buy" recommendation is not supportable at this stage because the $2.3 billion implied
      entry price carries meaningful downside risk in the bear case and provides only moderate
      upside in the base case. The risk-adjusted return profile is binary, not asymmetric in
      the investor's favour: the bull upside (approximately 2× from current mark) does not
      adequately compensate for the bear downside (60–80% value loss). A "track" posture is
      appropriate for investors who have already established positions, with the CLD Phase 2
      award announcement serving as the primary re-evaluation trigger.


      The five highest-priority diligence asks are: confirmation of the post-money equity
      valuation and cap-table terms from a direct investor conversation; review of the $200
      million debt term sheet, specifically covenants and maturity schedule; a CLD Phase 2
      competitive assessment; the first confirmed Haven-1 launch date and any launch insurance;
      and the Vast Satellite bus commercial terms, pricing, and customer identity.
    claimRefs:
      - CV039
      - CV042
    tableRefs:
      - TV002
      - TV006

