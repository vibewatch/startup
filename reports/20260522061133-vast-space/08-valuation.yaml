chapter:
  number: 8
  title: Valuation
  summary: >-
    Vast Space closed a confirmed $500 million financing package in March 2026 ($300 million
    Series A equity led by Balerion Space Ventures plus $200 million debt), implying a
    post-money equity valuation of approximately $2.3 billion if the December 2025 Forbes
    report of a $2 billion pre-money discussion held—though no official valuation figure has
    been publicly confirmed. The recommended stance is "research-more": the company is
    pre-revenue, the CLD Phase 2 award outcome (expected mid-2026) is a binary catalyst
    that can swing implied equity value by $1–2 billion, the $200 million debt introduces
    fixed obligations whose terms are undisclosed, and the $2.3 billion implied valuation is
    stretched relative to comparable pre-revenue space infrastructure companies. Strategic
    comps (Sierra Space at $8 billion with $2 billion deployed, Axiom Space at $350 million+
    raised) and public space market data (Rocket Lab at approximately 13× EV/revenue) frame
    a bull/base/bear valuation range of $0.5–5 billion, with the base case contingent on
    winning NASA CLD Phase 2 and executing the sixth private astronaut mission.

sections:
  - id: financing-history-and-implied-valuation
    title: Financing History and Implied Valuation Context
    body: >-
      Vast Space's capital history falls into two phases. From founding in 2021 through early
      2026, the company was financed entirely by founder Jed McCaleb, who publicly committed
      up to $1 billion of personal capital. McCaleb's stated commitment and the evidence of
      continuous hardware development through Haven Demo's November 2025 orbital mission
      support an estimate of $700–800 million in founder capital deployed before the March 2026
      institutional round.


      The March 2026 financing round—$300 million Series A equity and $200 million in debt—marks
      Vast's first institutional external capital event. The equity was led by Balerion Space
      Ventures, a defense- and dual-use-focused space venture firm, with co-investors including
      IQT (the CIA-affiliated venture arm), the Qatar Investment Authority (QIA), Mitsui and Co.,
      MUFG, Nikon Corporation through its NFocus Fund, Stellar Ventures, Space Capital, and
      Earthrise Ventures. Total capital deployed exceeds $1 billion by the company's own
      disclosure.


      The implied equity valuation rests on a single third-party source: a December 2025 Forbes
      article reporting that Vast was "in talks" to raise money at a $2 billion pre-money
      valuation. If that pre-money figure held in the final deal, the $300 million equity
      injection implies a post-money equity valuation of approximately $2.3 billion. Neither
      Vast, Balerion, nor any co-investor has officially confirmed a post-money valuation. Some
      secondary market commentary has cited approximately $2.5 billion, though corroboration for
      that higher figure is thin. All valuation estimates in this chapter are estimates, not
      confirmed facts.


      The $200 million debt tranche introduces a fixed obligation—interest payments, potential
      covenants, and a maturity schedule—whose terms are undisclosed. This creates an additional
      layer of uncertainty in any equity-value analysis: debt terms affect free cash flow,
      covenant restrictions can limit operational flexibility, and in a distress scenario, debt
      holders rank ahead of equity.
