  - id: bull-base-bear-scenarios
    title: Bull/Base/Bear Scenario Analysis
    body: >-
      The valuation at any point in the next three years is almost entirely determined by two
      binary events: the CLD Phase 2 award (expected mid-2026) and Haven-1's successful launch
      and operation (Q1 2027). The scenario analysis reflects this event-driven structure.


      Bull case (probability signal: 20–30%): Vast wins CLD Phase 2 funding, Haven-1 launches
      successfully in Q1 2027 and operates, the sixth PAM mission executes in summer 2027
      generating $150–220 million in gross mission revenue, and Vast Satellite secures additional
      satellite bus orders. In this scenario, by 2028 Vast would have demonstrable multi-stream
      revenue, a $300–700 million government anchor contract, and defensible leadership in the
      commercial LEO station market. An implied equity value of $3.5–5.0 billion is plausible
      under 5–7× forward revenue assumptions.


      Base case (probability signal: 40–50%): Vast wins CLD Phase 2 or receives Phase 1
      extension funding, Haven-1 launches with some delay but reaches orbit, and the PAM mission
      generates partial revenue. The implied equity value would likely settle in the $2.0–3.5
      billion range in 2027–2028, consistent with the current $2.3 billion mark and representing
      a moderate risk-adjusted return for Series A investors.


      Bear case (probability signal: 25–35%): Vast loses CLD Phase 2 to Axiom Space or Starlab,
      Haven-1 launch is delayed or partially successful, and the company must seek bridge
      financing against a $200 million debt burden with limited demonstrated revenue. In this
      scenario, the equity value declines sharply—potentially to $0.5–1.5 billion, implying a
      capital loss for Series A investors unless Vast can pivot to a smaller-footprint commercial
      model funded by satellite bus revenue and PAM fees.
