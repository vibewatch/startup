  - id: comparable-company-analysis
    title: Comparable Company and Precedent Transaction Analysis
    body: >-
      The absence of a directly comparable public company or recent IPO in the commercial-station
      segment requires a mosaic of private-round transactions and public-market proxies.


      Sierra Space's March 2026 funding round is the most proximate private comparable: the
      company reported an $8 billion valuation on $2 billion of cumulative capital invested
      since 2021, implying a 4× price-to-invested-capital multiple. Applied to Vast's estimated
      $1 billion-plus deployed, a similar 4× multiple would suggest a $4 billion-plus
      valuation—but Sierra Space's Orbital Reef partnership with Blue Origin, its Dream Chaser
      cargo capability, and its defense focus are strategic differentiators that do not
      translate directly to Vast's narrower Haven-focused model.


      Axiom Space, the only company currently flying private astronaut missions to ISS, has
      accumulated over $350 million in funding. Its business model—attaching private modules to
      ISS and transitioning to independent operations—is closer in mission to Vast's, but Axiom
      has demonstrated operational revenue (four PAM missions) that Vast has not yet achieved,
      making Axiom's pricing a ceiling for Vast's current mark.


      Among public companies, Rocket Lab USA provides the most relevant read on how markets
      price commercial space infrastructure companies. Rocket Lab reported FY2025 revenue of
      $602 million with 38% year-on-year growth and a $1.85 billion backlog, implying an
      EV/revenue multiple of approximately 13×. Applying even a discounted multiple to any
      plausible near-term Vast revenue stream requires revenue to exist, which it does not yet.
      The public-comp analysis therefore functions primarily as a ceiling on long-term value.


      Smaller public space infrastructure companies—Redwire, Planet Labs, Spire Global—trade at
      sub-$1 billion market capitalizations with limited revenue traction, serving as a reminder
      that the space infrastructure market can be ruthless to companies without clear paths to
      revenue scale.
