    title: "Near-Term Diligence Priorities: Dragon Schedule, Impulse Delivery, and Mission 3-4 Customers"
    body: "Investors should request (1) the contractual SpaceX verification milestone schedule and Dragon booking confirmation for Vast-1; (2) Impulse Space's propulsion delivery milestone and acceptance test status; and (3) progress on binding commitments for Haven-1 crew missions 3 and 4, given the six- to twelve-month training lead time and Q1 2027 launch target."
