  - id: regulatory-strategic-risk
    title: "Regulatory, Demand, and Strategic Risk"
    body: |
      NASA's Commercial Low Earth Orbit Destinations Contract (CLDC) acquisition is formally on hold as of January 28, 2026. The agency stated it will continue to support industry design and demonstration through funded Space Act Agreements rather than awarding firm fixed-price certification and service contracts as originally planned. An updated procurement milestone schedule has not been published. The original Phase 2 CLD strategy was classified internally as "high-risk" because it required a $4 billion budget overguide relative to projected appropriations; shifting to funded SAAs addresses the near-term budget problem but delays the contractual anchor that competing station developers—and Vast—have been anticipating.

      NASA's July 2025 CLD directive further reduced the mandatory minimum crew requirement from continuous 6-month habitation (the original "Full Operational Capability" bar) to one-month crew stays, and explicitly declared the agency's "continuous heartbeat" LEO presence strategy non-binding. In March 2026, NASA leadership publicly stated that there is "no independently verifiable market research indicating the economic viability of a commercial station only partially funded by NASA," and acknowledged that "in the current budget, we cannot fund a path of two stations." These statements underscore the degree to which NASA itself regards the commercial LEO transition as high-risk.

      Vast's strategic exposure to this environment is partially mitigated by Haven-1's Independence from the NASA contract. Unlike Axiom, Blue Origin, and Starlab—which hold funded Phase 1 SAAs—Vast has only an unfunded Space Act Agreement for Haven-1, meaning it receives NASA technical assistance but no direct funding. That structure prevents a direct NASA budget cut from grounding Haven-1, but also means Vast enters the Phase 2 competition without a funded track record, potentially at a disadvantage relative to companies with demonstrated NASA milestones. The FAA's commercial launch licensing regime, governing Haven-1's Falcon 9 launch, is mature (the FAA licensed its 1,000th commercial space operation in August 2025), but commercial space station crew certification requirements are still evolving, adding regulatory execution risk to an already demanding timeline.
