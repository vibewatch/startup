  - id: financial-capital-risk
    title: "Financial and Capital-Intensity Risk"
    body: |
      Vast closed a $500 million funding round in March 2026, comprising $300 million in Series A equity led by Balerion Space Ventures with participation from Nikon, Qatar Investment Authority, Mitsui, and MUFG, plus $200 million in debt financing. This brings total capital invested in the Haven program above $1 billion. Haven-1 is fully privately funded and reportedly paid for, mitigating near-term liquidity risk for that program. However, the company has no disclosed commercial revenue stream; all operational funding is equity-and-debt dependent, with no NASA contract generating cash to Vast.

      The capital intensity of Haven-2's nine-module architecture is the dominant long-run financial risk. No public figure for the full Haven-2 build cost has been disclosed, but analogous programs suggest multi-billion dollar expenditures before the station reaches operational capability. Vast's current capitalization provides an estimated runway of two to three years at current burn rates, though neither burn rate nor Haven-2 capital gap have been publicly disclosed.

      Jed McCaleb, co-founder of Ripple, serves as Vast's primary financial backer. While the March 2026 round introduced a broader institutional syndicate, McCaleb's role as cornerstone investor remains dominant, and no secondary investor at comparable scale has been confirmed. This single-funder concentration is widely noted by industry analysts as a key risk: if McCaleb's interest or capacity changes before Haven-2 reaches a critical design review, the company would require rapid alternative financing in a capital-intensive, pre-revenue development phase. NASA's CLD Phase 2 program, which could provide a multi-year funded Space Act Agreement to help defray Haven-2 development costs, remains on hold as of early 2026 with no updated procurement schedule.
