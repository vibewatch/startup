callouts:
  - calloutType: risk
    title: "Haven-1 Life Support Dependency Is a Hard Single-Point-of-Failure"
    body: "Haven-1 cannot sustain crew without Crew Dragon docked. Any SpaceX operational disruption—manifest reprioritization, Dragon anomaly investigation, or safety hold—directly grounds crewed Haven-1 operations with no backup path. This architectural dependency should be the primary diligence focus for investors assessing near-term operational risk."
    claimRefs:
      - CR008
      - CR039
      - CR028

  - calloutType: risk
    title: "NASA CLDC On Hold Removes the Institutional Revenue Anchor for Haven-2"
    body: "As of January 28, 2026, NASA's CLDC acquisition is formally on hold. Without a funded Space Act Agreement or eventual CLD service contract, Haven-2's multi-billion dollar capital requirement falls entirely on private markets. The $4 billion CLD budget gap means NASA may fund one station at most, forcing Vast into direct competition with Axiom, Blue Origin, and Starlab for a single institutional seat."
    claimRefs:
      - CR018
      - CR012
      - CR041
