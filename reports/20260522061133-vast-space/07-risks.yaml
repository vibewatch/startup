  - id: technical-mission-risk
    title: "Technical and Mission-Capability Risk"
    body: |
      Haven-1's most structurally distinctive technical risk is its deliberate dependency on SpaceX's Crew Dragon spacecraft for life support during crewed periods. With 45 m³ of pressurized volume—sufficient for short-duration visits but not autonomous continuous habitation—Haven-1 relies on Dragon docked at its aft port for atmospheric revitalization, CO₂ scrubbing, humidity control, and emergency abort capability. Without Dragon docked, the station cannot sustain a human crew independently. This is an intentional engineering trade-off that reduces Haven-1's development cost and schedule risk by leveraging a flight-proven system, but it creates a hard dependency: any Dragon unavailability (due to SpaceX manifest pressure, a vehicle anomaly, or regulatory hold) directly grounds Haven-1 crew operations.

      The station's designed maximum mission duration of 30 days per crew expedition—with a nominal plan of approximately two-week stays—limits the revenue potential per seat booking and means there is no path to continuous crew presence on Haven-1 itself. NASA's original "Full Operational Capability" specification for commercial station competitors required four crew members supported continuously with six-month increments; Haven-1's architecture is fundamentally incompatible with that bar.

      On the positive side, Haven-1's ECLSS trace contaminant control subsystem passed testing at NASA's Marshall Space Flight Center, confirming it can maintain a safe atmosphere across all planned mission phases. Impulse Space is under contract to deliver the propulsion system, using a storable N₂O/ethane propellant combination with Saiph thrusters as the reaction control system. No public milestone update on propulsion delivery has been issued as of the report date, leaving completion timing an open evidence gap. The Haven Demo satellite mission, completed successfully in 2025, validated key avionics, navigation, and control heritage that informs Haven-1's design.
