  topStrengths:
    - >-
      First-mover in commercial space stations with real hardware: Haven Demo flew November 2025 and Haven-1 is in
      integration targeting Q1 2027, placing Vast ahead of most CLD competitors on hardware maturity.
    - >-
      March 2026 $500M institutional Series A (led by Balerion Space Ventures, QIA participation) diversifies the cap
      table beyond founder capital and validates external investor confidence.
    - >-
      NASA CLD Phase 2 award and a signed SpaceX Dragon PAM mission agreement provide a credible path to both government
      contract revenue and anchor crew operations.
    - >-
      Founder Jed McCaleb's stated $1B personal commitment and CEO Max Haot's operational track record (Launcher, Mevo,
      Livestream exits) combine strategic and execution credibility.
    - >-
      Vast Satellite product line (15 kW-class bus, four units sold, 200-unit option) offers a near-term revenue
      diversification channel before station operations begin.
  topRisks:
    - >-
      Schedule slip risk is proven: Haven-1 has already slipped 3–4 quarters from mid-2026 to Q1 2027; any further delay
      stretches the cash runway against a fixed $200M debt obligation.
    - >-
      SpaceX single-point dependence: Falcon 9 is the only contracted launch vehicle and Dragon is the only crew
      transport; any SpaceX prioritisation conflict or pricing renegotiation would be existential.
    - >-
      NASA CLD Phase 2 outcome is binary and uncertain; NASA's own budget documentation and Congressional commentary
      signal scepticism about near-term ISS successor funding at scale.
    - >-
      Pre-revenue capital intensity: $1B+ deployed with zero recognised revenue and $200M in debt ahead of first
      commercial operations creates severe downside if Haven-1 misses Q1 2027.
    - >-
      Implied ~$2.3B valuation is unconfirmed and appears stretched relative to pre-revenue status, peer comparisons,
      and the absence of contracted recurring revenue at close.
    - >-
      Key-person concentration on Jed McCaleb (capital), Max Haot (operations), and SpaceX alumni leadership team;
      concurrent departures would represent a severe execution risk.
  unresolvedGaps:
    - >-
      Final confirmed post-money equity valuation for the March 2026 round remains undisclosed; the ~$2.3B figure is an
      estimate from pre-close Forbes reporting.
    - >-
      NASA CLD Phase 2 decision timeline, selection criteria weighting, and per-awardee funding amounts are not yet
      public.
    - Revenue model unit economics (per-seat pricing, payload rack pricing, mission pricing) are not publicly disclosed.
    - >-
      Debt terms, covenants, and repayment schedule for the $200M tranche are undisclosed, limiting assessment of
      financial risk triggers.
    - >-
      Haven-1 launch manifest and confirmed paying customer contracts beyond forward partnerships and MOUs have not been
      disclosed.
    - >-
      ISS extension debate outcome (Senate Commerce draft bill) could materially shift the CLD funding timeline and
      competitive landscape.
