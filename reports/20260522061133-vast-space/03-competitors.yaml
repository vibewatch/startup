chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Vast Space competes against three better-funded direct peers—Axiom Space, Starlab Space,
    and Orbital Reef (Blue Origin + Sierra Space)—all vying for NASA's CLD Phase 2 contracts
    and overlapping commercial customer pools in post-ISS low Earth orbit. Axiom holds the
    strongest competitive position today: the only firm-fixed-price NASA contract, four
    completed private astronaut missions, and 166 revenue payloads flown. Starlab leads on
    commercial demand signals with payload capacity fully booked by March 2026. Orbital Reef
    has completed human-in-the-loop mockup testing but published fewer hardware milestones.
    Vast's singular advantage is schedule: Haven-1 (Q1 2027) would be the first commercial
    station in orbit by 18–24 months, built on its only company to fly-operate-deorbit a
    station testbed (Haven Demo, Nov 2025–Feb 2026). However, Vast holds only an unfunded
    NASA SAA—a materially weaker governmental relationship than Axiom's contract or Starlab's
    $218M funded SAA—and an adverse read of the landscape finds Vast is one of several
    underfunded entrants in a market where NASA itself has publicly stated the commercial
    business case does not yet exist.

sections:
  - id: "competitive-landscape-overview"
    title: "Competitive Landscape: Categories, Entrants, and Market Structure"
    body: |
      The post-ISS commercial LEO station market has four categories of competitive alternative that Vast must navigate: (1) direct free-flyer commercial peers funded by NASA's CLD program, (2) Axiom Station's hybrid ISS-attached-then-free-flying model which anchors the near-term transition, (3) the ISS itself and any legislative extension as a status-quo substitute, and (4) China's Tiangong as a geopolitical pressure on pace rather than a direct commercial rival.

      The three primary direct competitors are Axiom Space (Houston), Starlab Space (a joint venture led by Voyager Technologies), and Orbital Reef (Blue Origin and Sierra Space). All four commercial entrants—Axiom, Starlab, Orbital Reef, and Vast—have been engaged under NASA's CLD framework, though at markedly different levels of governmental financial support. Axiom holds a firm-fixed-price, indefinite-delivery, indefinite-quantity contract with NASA, making it the only player with a formal procurement relationship rather than a Space Act Agreement. Starlab and Orbital Reef hold Phase 1 funded SAAs ($218M and $130M respectively). Vast holds only an unfunded SAA awarded through the CCSC-2 initiative in 2023.

      NASA's revised Phase 2 strategy (August 2025 directive) calls for awarding funded SAAs to a minimum of two—preferably three or more—providers. This multi-provider model means the market is not a winner-takes-all competition for CLD Phase 2 in the near term, but the Phase 2 budget of $272.3M for FY2026 and $2.1B over five years is finite, making priority order among providers materially important. Critically, as a Phase 1 CCSC-2 entrant rather than a Phase 1 funded SAA recipient, Vast enters Phase 2 competition with no prior NASA milestone disbursements—a structural capital disadvantage at a stage when hardware manufacturing is the gating constraint.

      The status-quo substitute—an extended ISS—represents a meaningful risk. In March 2026, a Senate NASA authorization bill extending ISS operations two years to 2032 cleared the Senate Commerce Committee; if enacted, it reduces the urgency for commercial stations and extends the window in which Axiom's hybrid model (modules attached to ISS) remains viable, potentially slowing the transition timeline that Haven-1 is designed to capture. Tiangong, China's government-funded station continuously crewed since 2022, provides geopolitical context but is not a commercial substitute for Western commercial space users.
