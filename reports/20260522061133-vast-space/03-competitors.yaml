  - id: "strategic-comparison"
    title: "Comparative Assessment: Schedule, Architecture, NASA Positioning, and Capital"
    body: |
      Across four dimensions—schedule maturity, technical architecture, NASA relationship depth, and capital adequacy—the competitive standings differ significantly.

      **Schedule maturity:** Vast leads on schedule. Haven Demo was flown, operated, and deorbited (Nov 2025–Feb 2026), providing the only in-flight station testbed validation in the peer group. Haven-1 entered the integration phase in January 2026 and is targeting a Q1 2027 launch on SpaceX Falcon 9—18–24 months ahead of the next competitor milestone (Axiom operational in 2028). Axiom holds second position with Hab One manufacturing underway and CDR completed. Starlab follows with PDR complete and CDR ahead; 2029 target. Orbital Reef's public timeline is least defined; no CDR completion announced.

      **Technical architecture:** Each competitor has a materially different deployment strategy. Axiom uses a phased ISS-attachment model, which reduces single-launch mass/volume risk but creates operational complexity at ISS retirement. Starlab chose a single-launch architecture on Starship—the highest-capacity but least flight-proven heavy-lift option—which minimizes orbital assembly but concentrates launch risk. Orbital Reef's modular design (LIFE® habitat plus Core module) distributes technical risk across multiple launches but adds rendezvous/docking complexity. Vast's Haven-1 is the simplest: a single module on a proven Falcon 9, launching without NASA certification and without ISS attachment, maximizing time-to-orbit but limiting initial capacity (four crew, 45 m³ habitable volume). Haven-2 would require multiple launches for full ISS-scale capability.

      **NASA relationship depth:** This is Vast's most material structural disadvantage. Axiom's firm-fixed-price IDIQ contract is the deepest governmental relationship, providing contractual revenue certainty that SAA-based competitors lack. Starlab's $218M funded SAA ($183M disbursed) represents the next tier. Orbital Reef's funded SAA ($130M) comes third. Vast's unfunded SAA means Vast received no NASA disbursements in Phase 1 and must win Phase 2 funding in open competition—the same pool as incumbents who already have Phase 2 design maturity. This gap is not merely symbolic: funded SAA recipients had access to NASA technical expertise, facilities, and milestone-gate structures that accelerated design review progress; Vast did not.

      **Capital adequacy:** Sierra Space leads on disclosed valuation ($8B, March 2026) but is now dual-mission (defense + CLD). Axiom's private valuation is not publicly disclosed; prior reporting placed it at $2–3B range before recent funding. Vast raised $500M (Series A, March 2026) bringing total funding to $1B+; its valuation at this round implied approximately $2B. Voyager Technologies (VOYG) trades at approximately $2.37B market cap (May 2026)—a publicly-observable proxy for Starlab's parent but not a direct station valuation. All four private competitors share the characteristic that station construction burns capital faster than revenue can offset at pre-operational stages, creating continuous financing risk for a decade-long capital program.
