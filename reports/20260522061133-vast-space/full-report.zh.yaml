  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: >-
      Haven-1 Lab 载荷客户从研究发现到在轨科学运营，要走完五个阶段。SpaceX/Vast 联合免费 RFP 降低了学术研究人员在申请阶段的门槛； 商业合作伙伴通常通过直接触达进入。5
      家已确认合作伙伴目前都处于集成与测试阶段，等待 Haven-1 在 2027 年 Q1 发射。
    data:
      items:
        - id: stage-discover
          label: 发现
          actor: 首席研究员或载荷 BD 团队
          description: 研究人员或 BD 团队通过 Vast/SpaceX 新闻报道、CASIS 网络或行业会议，将 Haven-1 Lab 识别为微重力准入载体。 免费 RFP 公告把认知扩大到有商业预算的团队之外。
          channels:
            - 行业媒体（Payload Space、SpaceflightNow、Space.com）
            - CASIS ISS National Lab 合作伙伴网络
            - SpaceX 商业载荷生态
        - id: stage-apply
          label: 申请 / 提交 RFP
          actor: 载荷合作伙伴或研究员
          description: 机构通过 Haven-1 Lab 载荷合作伙伴计划，或 SpaceX/Vast 联合免费研究提案流程，向 Vast 提交载荷概念。 资格标准包括微重力实验价值、是否适配 MLE 规格、功率预算和安全标准。
          channels:
            - vastspace.com/science-rfp-eligibility 直接申请
            - SpaceX/Vast 联合 RFP 评选小组
        - id: stage-select
          label: 筛选与签约
          actor: Vast 载荷集成团队与合作伙伴
          description: Vast 通过未披露的评估流程筛选载荷合作伙伴，并公开宣布（例如 2025 年 4 月宣布 JAMSS、Interstellar Lab、Exobiosphere）。 财务条款和槽位费用私下谈判；没有公开基准。
          channels:
            - Vast 载荷合作伙伴计划
            - 私下合同谈判
        - id: stage-integrate
          label: 集成与测试
          actor: 载荷合作伙伴工程团队与 Vast 集成团队
          description: >-
            合作伙伴交付符合 MLE 尺寸要求的载荷硬件（100 W，可由 Starlink 下达指令）。Vast 在 Long Beach 设施做集成测试。 现有 5 家合作伙伴都处于这一阶段，等待 Haven-1 2027
            年 Q1 发射。
          channels:
            - Vast Long Beach 集成设施
            - MLE 硬件接口测试
            - 通过 Starlink 验证远程指令
        - id: stage-science-ops
          label: 科学运营
          actor: 首席研究员（远程）和船员（按需在轨）
          description: 发射后，研究人员通过 Starlink 连接远程指挥载荷；船员可介入处理时间敏感操作。数据和样本随 Dragon 溅落返回。 截至 runDate，还没有合作伙伴进入这一阶段。
          channels:
            - Starlink 远程指令
            - SpaceX Dragon 样本返回
            - CASIS 地面运营支持
    sourceRefs:
      - SU001
      - SU004
      - SU007
      - SU013
      - SU016
