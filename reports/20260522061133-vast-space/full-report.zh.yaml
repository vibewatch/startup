  - id: FR001
    title: 风险热力图：可能性 vs. 影响
    type: matrix
    layout: standard
    summary: 截至 2026 年 5 月，Vast Space 关键风险按可能性（Y 轴）和影响（X 轴）分布的严重程度。单元格内为风险简称。
    data:
      columns:
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 低可能性
          values:
            - null
            - SpaceX Dragon 异常 / 安全暂停
            - Dragon ECLSS 生命保障依赖；出资方集中（McCaleb）
        - label: 中等可能性
          values:
            - Impulse Space 推进延迟；商业需求不足
            - Haven-1 进度滑出 2027 年 Q1
            - null
        - label: 高可能性
          values:
            - null
            - NASA CLDC 暂停 / 无资金合同
            - null
    approximationNotes: 可能性和影响评级是基于公开证据的定性评估，不是定量概率估计。空单元格表示该象限未识别出风险。
    claimRefs:
      - CR001
      - CR008
      - CR018
      - CR017
      - CR011
      - CR032
      - CR028
  - id: FR002
    title: Haven-1 / Haven-2 进度时间线与关键延误
    type: timeline
    layout: wide
    summary: Haven-1 和 Haven-2 的关键里程碑，展示 2026 年进度延误和截至 2026 年 5 月的前瞻计划。
    data:
      items:
        - label: Haven Demo 发射（轨道技术验证）
          date: '2025'
          note: 成功；验证航电、导航、电力技术传承
        - label: Haven-1 主结构焊接完成
          date: 2025-10
          note: 2025 年 10 月完成
        - label: Haven-1 原始发射目标
          date: 2026-05
          note: 推迟至 2027 年 Q1（2026 年 1 月宣布）
        - label: Haven-1 集成 Phase 1–3 完成
          date: 2026-H2
          note: 热控、航电、居住；目标 2026 年底
        - label: Armstrong Test Facility 环境测试
          date: 2026-H2
          note: 发射前认证测试活动
        - label: Haven-1 发射（修订后）
          date: 2027-Q1
          note: 不早于（NET）；载人运营取决于 Dragon 验证（2 周–3 年）
        - label: Vast-1 首次载人任务
          date: '2027'
          note: 时间线取决于 SpaceX 验证里程碑
        - label: Haven-2 首个舱段目标
          date: '2028'
          note: 公司计划；取决于 Haven-1 运营成功和资本
    approximationNotes: 所有前瞻日期均来自 CEO 表述和新闻稿；没有正式发布的时间表。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR043
  - id: FR003
    title: Haven-1 运营依赖图
    type: dag
    layout: standard
    summary: SpaceX 的三重依赖角色（发射、船员运输 / 生命保障、通信）构成 Haven-1 运营的结构性集中风险。
    data:
      nodes:
        - id: haven1
          label: Haven-1 空间站
        - id: f9
          label: Falcon 9（SpaceX）
        - id: dragon
          label: Crew Dragon（SpaceX）
        - id: starlink
          label: Starlink（SpaceX）
        - id: impulse
          label: Impulse Space（推进）
        - id: crew
          label: 船员运营
        - id: ground
          label: 地面控制
      edges:
        - from: f9
          to: haven1
          label: 发射载具
        - from: dragon
          to: haven1
          label: 船员运输 + 生命保障
        - from: dragon
          to: crew
          label: 船员中止 / 返回
        - from: starlink
          to: ground
          label: 主要通信
        - from: impulse
          to: haven1
          label: 推进 / 轨道保持
        - from: haven1
          to: crew
          label: 居住舱
    approximationNotes: 图展示主要运营依赖；为清晰起见，省略二级 RF 链路（AnySignal、TRL11、Addvalue）。
    claimRefs:
      - CR026
      - CR030
      - CR031
      - CR008
  - id: FV001
    title: 推荐逻辑链
    type: flow
    layout: standard
    summary: 从证据支柱到风险因素，再到截至 2026 年 5 月对 Vast Space 的继续研究建议的决策链。
    data:
      nodes:
        - id: hardware_proof
          label: 硬件证据（高）
          detail: Haven Demo 49/49 目标完成；截至 2026 年 5 月，Haven-1 处于集成中
        - id: capital_raised
          label: 已筹资本（高）
          detail: 2026 年 3 月确认 $500M；成立以来累计投入超过 $1B
        - id: nasa_relationship
          label: NASA 关系（中高）
          detail: 2026 年 2 月获得 PAM 奖项；Armstrong 测试设施；CLD Phase 2 竞争者
        - id: revenue_gap
          label: 收入缺口（高风险）
          detail: ARR 为零；尚未产生收入；CEO 模型假设未来 5 年 LEO 商业经济接近零
        - id: valuation_uncertainty
          label: 估值不确定性（重大）
          detail: 隐含约 ~$2.3B；投后估值未确认；二手来源说法不一
        - id: cld_binary
          label: CLD Phase 2 二元结果（决定性）
          detail: 2026 年中结果：若赢得奖项，价值 +$1–2B；若失利，悲观情景为 $0.5–1.5B
        - id: recommendation
          label: 建议：继续研究
          detail: 在 CLD Phase 2 明朗前保持观察；奖项公布时重新评估；不要按当前隐含价格买入
      edges:
        - from: hardware_proof
          to: recommendation
          label: 支持观察姿态
        - from: capital_raised
          to: recommendation
          label: 降低近期流动性风险
        - from: nasa_relationship
          to: recommendation
          label: 提高 Phase 2 基准概率
        - from: revenue_gap
          to: recommendation
          label: 限制买入信心
        - from: valuation_uncertainty
          to: recommendation
          label: 难以确信定价
        - from: cld_binary
          to: recommendation
          label: 主导性未决催化剂
    claimRefs:
      - CV001
      - CV007
      - CV024
      - CV042
  - id: FV002
    title: 关键驱动因素的估值敏感性
    type: bar
    layout: standard
    summary: 展示截至 2026 年 5 月，分析师估计下 Vast 隐含股权价值如何随五个关键敏感性维度变化。
    data:
      items:
        - label: 隐含投后估值（Forbes $2B 投前锚）
          value: 2300
          note: 基准锚，单位 USD M；Forbes 2025 年 12 月报道；Vast 未正式确认
        - label: 重置成本底线（已投入资本）
          value: 1000
          note: 累计超过 $1B，单位 USD M；底线假设无持续经营溢价
        - label: CLD Phase 2 获胜溢价加至隐含估值
          value: 3800
          note: 分析师估计（USD M）：$2.3B + Phase 2 获奖带来的 $1.5B 重估
        - label: 倍数压缩情景下调 40%
          value: 1380
          note: 若行业倍数压缩 40%，单位 USD M；未假设公司特定恶化
        - label: CLD 失利并通过稀释性过桥融资的悲观情景
          value: 800
          note: USD M：Series A 被稀释；无 Phase 2 锚；仅有 Haven-1 商业运营
    approximationNotes: 所有数值均为分析师估计，单位 USD million，置信度低到中。Vast 未披露财务预测，也未确认投后估值。
    claimRefs:
      - CV007
      - CV015
      - CV024
      - CV033
      - CV028
  - id: FV003
    title: 估值与回报区间：乐观、基准、悲观
    type: range
    layout: standard
    summary: Vast 在三种情景下的股权估值低高区间，展示当前隐含价格的不确定性有多宽。
    data:
      items:
        - label: 悲观情景隐含股权价值
          low: 500
          high: 1500
          unit: USD M
          note: CLD Phase 2 未中标；仅有 Haven-1 商业项目；过桥融资稀释 A 轮投资者
        - label: 基准情形隐含股权价值
          low: 2000
          high: 3500
          unit: USD M
          note: 以折价赢得 CLD Phase 2；PAM 任务执行；卫星业务取得有限牵引力
        - label: 乐观情形隐含股权价值
          low: 3500
          high: 5000
          unit: USD M
          note: CLD Phase 2 全额授予；Haven-1 投入运行；PAM 执行完成；卫星平台订单放量
        - label: 当前隐含入场估值区间
          low: 2000
          high: 2500
          unit: USD M
          note: 基于 Forbes 2025 年 12 月报道的 $2B 投前估值；二级来源称最高可能到 $2.5B；尚未确认
    approximationNotes: 所有区间均为分析师估算，基于可比交易、里程碑概率分析和重置成本背景推导。尚未跑 DCF 模型。考虑到公司当前收入接近零且未披露预测，这些区间反映的是定性情景判断。
    claimRefs:
      - CV007
      - CV026
      - CV027
      - CV028
  - id: FV004
    title: 投资就绪度 KPI
    type: kpi
    layout: standard
    summary: 基于截至 2026 年 5 月可得证据，给 Vast Space 八个维度打出可提交 IC 的评分。
    data:
      items:
        - label: 市场机会
          value: 7 / 10
          status: verified
          note: NASA $2.1B CLD 预算已确认；独立商业市场尚未验证；上行空间大，但投机性强
          claimRefs:
            - CV018
        - label: 硬件与技术验证
          value: 8 / 10
          status: verified
          note: Haven Demo 49/49 个目标已完成；截至 2026 年 5 月，Haven-1 集成里程碑仍按计划推进
          claimRefs:
            - CV015
        - label: 竞争护城河
          value: 6 / 10
          status: in-progress
          note: 在轨飞行履历带来优势；但 Axiom 已验证 PAM 收入，Starlab 有 Boeing 工程能力
          claimRefs:
            - CV025
        - label: 单位经济与收入可见度
          value: 3 / 10
          status: gap
          note: ARR 为零；CEO 模型显示未来 5 年商业 LEO 收入接近零；卫星平台定价未披露
          claimRefs:
            - CV019
            - CV041
        - label: 融资与资本充足性
          value: 7 / 10
          status: verified
          note: $500M 已确认；投资团多元；估计现金跑道 24–36 个月；债务条款未知
          claimRefs:
            - CV001
            - CV008
        - label: 风险画像
          value: 4 / 10
          status: in-progress
          note: 高风险：CLD Phase 2 二元结果、依赖 SpaceX、债务负担未披露、仍处收入前阶段
          claimRefs:
            - CV034
            - CV040
        - label: 估值纪律
          value: 4 / 10
          status: gap
          note: 收入前公司隐含估值 ~$2.3B；官方估值标记未确认；相对基本面偏高
          claimRefs:
            - CV007
            - CV030
        - label: 证据质量
          value: 5 / 10
          status: in-progress
          note: 融资已确认；估值未确认；未披露财务数据；CEO 表述有参考价值，但信息有限
          claimRefs:
            - CV006
            - CV041
    approximationNotes: 评分由分析师按 1–10 分制给出，未获 Vast 背书。分数反映尽调信心，不代表公司绝对质量。
    claimRefs:
      - CV001
      - CV007
      - CV018
      - CV030
      - CV034
      - CV041
      - CV042
