      - number: '6.3'
        title: 机构与政府需求通道
        blocks:
          - type: paragraph
            body: >
              2026 年 2 月 12 日签署的 NASA PAM-6 奖项，是 Vast 组合中最具体的政府客户承诺。根据协议，Vast 将用 SpaceX Dragon 将最多四名宇航员送往 ISS，执行最长 14
              天任务，时间不早于 2027 年夏季。该奖项确认 NASA 愿意与 Vast 签约开展载人运营——这是对任务安全和组织就绪度的重要验证——但 PAM-6 目的地是 ISS，不是
              Haven-1；在空间站投入运营前，对直接收入的传导意义有限。

              2025 年 4 月 10 日签署的 CASIS 战略协议，让 Vast 接入 ISS National Lab 的客户管线和运营经验，使 Vast 能在空间站就绪后，把 CASIS 关联研究者迁移到
              Haven-1 Lab。2024 年 6 月 6 日签署的 ESA MOU 明确为非约束性、探索性文件，但释放出 European Space Agency 对未来商业空间站合作的兴趣；Vast 新任
              President Europe Giorgio Saccoccia 曾任 ESA Director General，直接把 ESA 机构关系连接到 Vast 的业务开发管线。Czech Republic MOU
              于 2024 年 11 月宣布；Vast Japan GK 于 2025 年 12 月 11 日成立，由前 JAXA 宇航员 Naoko Yamazaki 担任 General
              Manager。这些区域动作在欧洲和亚太建立了政府触达通道，但截至 runDate，除 PAM-6 外都尚未形成有约束力的商业承诺。
