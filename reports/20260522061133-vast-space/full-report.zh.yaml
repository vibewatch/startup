      - number: '2.5'
        title: 图表证据
        blocks:
          - type: callout
            title: LEO 断档风险：ISS 退役时间线与 CLD 准备度
            body: >-
              ISS 计划在 2030 年前离轨，但尚无商业空间站证明具备运营准备度。俄罗斯的承诺只延续到 2028 年。中国的 Tiangong 自 2022 年以来持续有人值守。美国载人 LEO
              存在若出现断档，将削弱国际伙伴关系，中断需要人工照看的持续研究管线，并让出战略领导力。Beyond Earth Institute 将重叠载人运营确定为关键缓释措施；但这要求至少一座 CLD 空间站在 ISS
              退役前完全投入运营，而当前没有任何竞争者的时间线已被确认能满足这一点。
            calloutType: risk
            claimRefs:
              - CM030
              - CM031
              - CM001
          - type: callout
            title: NASA 作为锚定客户：造市角色及其边界
            body: >-
              NASA 重新定义为“锚定客户和任务集成商”，而非所有者和运营者，结构上类似其催化商业载人（Dragon、Starliner）和商业货运市场的方式。关键差异在于：商业载人只有一个清晰需求（ISS 乘员轮换），而
              CLD 必须证明政府锚定之外的需求足以支撑所需资本。NASA 2026 年 3 月的市场怀疑信号表明，机构自身也未完全相信需求逻辑；因此，Phase 2 奖项条款和共同投资要求将成为投资者判断价值的关键信号。
