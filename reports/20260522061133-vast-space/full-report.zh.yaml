  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: ISS 退役后商业 LEO 市场：边界、阶段与 NASA 锚定角色
        blocks:
          - type: paragraph
            body: >
              国际空间站（ISS）计划在 2030 年前退役并离轨，结束政府运营的人类在低地球轨道连续驻留二十多年历史。NASA 的 Commercial Low Earth Orbit
              Destinations（CLD）计划，是从直接运营空间站转向客户模式的主要机制：NASA 的明确目标，是成为众多客户之一，向私营拥有并运营的商业空间站购买服务，而不再自行拥有和运营轨道基础设施。


              NASA 的三阶段 CLD 框架组织了这一转型。Phase 1 通过有资助和无资助的 Space Act Agreement（SAA）支持早期设计和开发；Axiom Space 持有固定总价合同，Blue
              Origin/Sierra Space 和 Starlab Space 获得 Phase 1 有资助 SAA，Vast 则通过 CCSC-2 计划持有无资助 SAA。经 2025 年 8 月 NASA
              指令修订后，Phase 2 转向有资助 SAA，重点放在关键设计评审准备和一次在轨载人演示，奖项预计在 2026 年初公布。Phase 3 将使用基于 FAR
              的合同，处理正式认证和商业服务采购；完整采购策略仍在制定中。


              FY2026 Presidential Budget Request 为 CLD 开发单列 $272.3 million，并预计未来五年投入 $2.1 billion。不过，NASA 于 2026 年 3
              月出现重大转向：受预算约束，并因认为足够的非 NASA 需求尚未出现，NASA 宣布 Phase 2 不会资助完整独立空间站，而是提出对接舱模式——允许商业舱段接入 ISS
              基础设施。Vast、Axiom、Starlab 等空间站建设方在 2026 年 Space Symposium 上公开反驳，提交超过 390 页独立分析，主张市场具备可行性。截至 2026 年 5 月，Phase
              2 奖项结果以及 NASA 会资助 2 家还是 3+ 家供应商，仍是塑造所有 CLD 竞争者近端市场的核心变量。
