      - number: '1.4'
        title: 里程碑、牵引力与反向事件
        blocks:
          - type: paragraph
            body: >-
              Vast 五年的发展弧线，从隐身创业公司走到拥有可信 ISS 后继竞标资格的硬件测试组织。公司 2021 年创立，2022 年 9 月在 World Satellite Business Week
              公开亮相，最初强调人工重力愿景。2023 年初，公司将总部迁至 Long Beach，并收购 Launcher，补入航天器技术和约 120 名员工，其中包括时任 Launcher CEO 的 Max
              Haot，他随后出任 President。2023 年 5 月，Vast 与 SpaceX 建立合作，由 Falcon 9 发射 Haven-1，并执行随后两次 Dragon 载人任务。

              2024 年，公司签署 ESA MOU（6 月）、宣布 Haven-1 集成 Starlink（4 月）、在 Milan 第 75 届 IAC 发布 Haven-2（10 月），并在 12 月与 SpaceX
              正式达成两次 Dragon PAM 赴 ISS 任务协议。Haven Demo 于 2025 年 11 月任务成功，在轨三个月完成 49 项目标，是验证分阶段策略的标志性硬件里程碑。Haven-1 于 2026
              年 1 月 20 日开始集成；Vast 同时将发射目标更新为 2027 年 Q1，较此前 2026 年目标延后 3–4 个季度。NASA 于 2026 年 2 月授予 Vast 第 6 次 Private
              Astronaut Mission（PAM-6），确认其具备可信的载人航天运营商地位。

              反向信号很明确：在 2026 年 4 月 Space Symposium 上，NASA 官员称可行的商业 LEO 市场尚未出现，且 NASA 没有预算资助多个完整空间站概念，暗示 CLD Phase 2
              可能缩小范围。Beyond Earth Institute 2026 年 3 月报告另行指出，监管不确定性、缺乏在轨赔偿政策，以及潜在 LEO 空间站断档，都是 CLD 计划的结构性风险。这些逆风对 Vast
              商业模式影响重大，因为 Haven-2 依赖 NASA 作为锚定客户。
