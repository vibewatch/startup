      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: Series A 投资方阵容释放了超越财务回报的战略背书信号
            body: >-
              Vast 2026 年 3 月 Series A 的构成——IQT（CIA 风险投资机构）、QIA（主权财富）、Mitsui 和
              MUFG（日本产业资本）、Nikon（精密制造）——说明这是一组带有战略、地缘政治和工业动机的资本联盟，目标不止于纯财务回报。这类投资人组合通常会降低短期清算压力，也说明 Vast
              的项目经过了技术能力较强的尽职调查流程。用于估值时，它支持这样一个判断：隐含标记估值反映的是知情资本，而不是投机动量。
            calloutType: strength
            claimRefs:
              - CV002
              - CV003
              - CV038
              - CV039
          - type: callout
            title: CLD Phase 2 是二元催化剂：乐观与悲观情景相差超过 $3 billion
            body: >-
              对任何评估 Vast 的投资人来说，最关键的事实是：乐观情景和悲观情景的隐含股权价值相差超过 $3 billion，而决定性事件只是一次预计 2026 年中的政府采购决定。乐观情景（Phase 2
              胜出）下，两年内股权价值可能达到 $3.5–5 billion。悲观情景（Phase 2 落选）下，股权价值可能跌至 $0.5–1.5 billion。在当前隐含 $2.3 billion
              标记估值买入，意味着授奖结果揭晓前就接受一种期望值并不明确为正的回报结构，除非投资人对 Phase 2 胜出的主观概率超过约 60–65%。
            calloutType: risk
            claimRefs:
              - CV024
              - CV026
              - CV028
              - CV031
          - type: callout
            title: 继续研究：在 CLD Phase 2 授奖公告时重新评估
            body: >-
              建议姿态是继续研究，并设定一个明确的重新评估触发点：预计 2026 年中的 NASA CLD Phase 2 资助性 SAA
              公告。到那时，二元风险会解除，收入确定性会提高，投资案例也能用明显更好的输入重新评估。已有持仓的投资人应继续观察；新资金不应以当前隐含价格投入，除非已确认股权结构表条款，并通过与 Vast 管理层直接沟通拿到
              CLD Phase 2 概率估计。
            calloutType: recommendation
            claimRefs:
