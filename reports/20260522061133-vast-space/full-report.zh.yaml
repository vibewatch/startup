  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 进度与执行风险
        blocks:
          - type: paragraph
            body: >
              Haven-1 发射目标从 2026 年中推迟到不早于 2027 年 Q1；Vast CEO Max Haot 于 2026 年 1 月宣布了这一延迟，多家独立来源也予以确认。Haot 将 2027 年 Q1
              描述为公司可以「有信心」兑现的日期，把更早的 2026 年目标定位为愿景式目标。这次延迟源于 Haven-1 三阶段集成活动的复杂度：Phase 1 安装热控、生命保障和推进系统；Phase 2
              加入航电、制导、导航和控制；Phase 3 完成内部居住装修，并安装外部防护、散热器和太阳能板。三阶段结束后，Haven-1 还必须在 Ohio Sandusky 的 NASA Neil Armstrong
              Test Facility 完成完整环境测试活动，之后才能进入发射处理。


              即便发射成功，载人运营还面临另一套可能较长的放行流程。Haot 公开表示，Haven-1 入轨后会经历无人检验期；在此期间，Vast 必须通过合同里程碑和有记录的验证事件，让 SpaceX
              相信空间站足够安全，可以与载人 Dragon 航天器对接。这一窗口最早可能在发射后两周打开，也可能延长至三年，因此首个产生收入的乘组任务（Vast-1）存在与发射日期本身相互独立的宽幅不确定性。该空间站质量约
              14,000 kg，是 Falcon 9 迄今尝试过的最重载荷，也给发射准备增加了技术执行维度。


              Haven-2 路线图要激进得多：首个舱段目标 2028 年，2030 年形成三舱构型，2032 年建成九舱综合体。每个舱段都需要单独一次 Falcon 9 发射，意味着项目从 2028
              年起要维持约每六个月一次的发射节奏。Haven-1 的任何滑期都会压缩在 Haven-2 集成前验证架构经验的时间。尽管 Haven-1 已延期，Vast 仍称自己领先 Axiom Station Module
              1（目标 2028 年）和 Starlab（目标 2029 年）一到两年，因此在竞争对手入轨前仍有缓冲。
