      - number: '8.5'
        title: 反向分析：估值过高风险、稀释与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              $2.3 billion 隐含股权估值相对 Vast 当前基本面偏高：披露收入为零，ARR 为零，除 PAM 前的 NASA 合同和一笔未披露客户的卫星平台订单外没有确认客户，还背负条款未披露的 $200
              million 债务。这一估值几乎完全建立在期权价值上——即未来成为以 NASA 为锚定客户的商业空间站运营商——也建立在战略稀缺性上，因为同一赛道里尚未开建的竞争对手也在以相近或更高价格融资。


              NASA 自己的立场——可行的独立商业 LEO 商业案例尚不存在——就是结构性反向信号。除政府锚定客户外，今天的商业 LEO 经济实质上为零；CEO Max Haot 公开表示，公司模型中未来五年非 NASA
              来源的 LEO 经济收入「接近零美元」，这也确认了该项目对政府的依赖。


              估值倍数压缩风险很实质。2023–2024 年，私营太空基础设施估值明显收缩。如果行业整体压缩 30–50%，即便公司自身没有恶化，$2.3 billion 标记估值也会降到 $1.2–1.6 billion。


              资本强度进一步放大稀释风险：Haven-2 投入运营前，Vast 至少还需要一次大型股权融资（估计额外资本 $1–2 billion）。如果融资价格低于当前隐含标记估值，Series A 投资人会被显著稀释。


              治理集中风险也存在。Jed McCaleb 仍保留创始人控制权；Series A 投资人的保护性条款、反稀释权和董事会席位安排均未公开披露。IQT 与 QIA
              的参与降低了纯财务压力，但也带来战略考量，未必与财务投资人的财务回报最大化一致。
