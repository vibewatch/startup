    title: 采用 / 部署漏斗
    type: funnel
    summary: >-
      Haven-1 Lab 商业漏斗从全球微重力研究社群一路收窄到 5 家已确认、硬件承诺登上 Haven-1 的载荷合作伙伴。 联合免费 RFP 扩大了申请阶段，但 8 个槽位的硬上限限制了转化量。商业定价仍未披露，8
      槽位上限以下的漏斗经济性也未验证。
