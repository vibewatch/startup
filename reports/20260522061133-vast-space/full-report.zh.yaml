        - Vast Phase 2 提案摘要或关于竞争定位的公开声明；NASA 评分方法和授标时间线
        - Phase 2 是近端最重要价值催化；拿不到竞争评估框架，概率估计就不精确
        - 跟踪 NASA 采购门户；复核任何国会证词；与管理层直接讨论竞争信心
      - - Haven-1 发射日程和保险
        - 已确认的 SpaceX Falcon 9 发射窗口；发射保险保额；Dragon 载人合同付款里程碑条款
        - 发射时间直接决定 PAM 任务时点和首次收入事件；保险保护核心资产免受损失
        - 复核发射清单披露；索取发射保险条款书；向 Vast 确认 PAM 合同付款里程碑
      - - Vast Satellite 卫星平台商业条款
        - 客户身份；每台卫星平台定价；交付时间表；200 台选择权是否已行使或定价
        - 若定价可观、订单加速，卫星平台收入可部分降低悲观情景风险；目前未披露
        - 索取客户推荐或代理财务条款；复核 Morningstar 和 BusinessWire 公告细节中是否有数据
      - - 烧钱速度和交割后现金头寸
        - 经确认的 Q1 2026 月度运营烧钱速度；3 月交割后资产负债表上的现金及等价物
        - 现金跑道估计由分析师推导；实际烧钱速度决定资本充足性逻辑能否支撑到 CLD Phase 2 授标日
        - 数据室访问；直接访谈 Vast CFO；从员工数走势和设施扩张公告寻找代理证据
    notes: 尽调追问反映会显著影响估值信心的信息缺口。条目大致按潜在财务投资人的决策重要性排序。
