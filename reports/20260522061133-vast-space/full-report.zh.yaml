      - number: '1.3'
        title: 融资历史、估值与投资者版图
        blocks:
          - type: paragraph
            body: >-
              从 2021 年创立到 2024 年底，Vast 几乎完全依靠 Jed McCaleb 个人资金支持。首笔公开确认的外部机构投资发生在 2024 年 10 月：IQT（In-Q-Tel，CIA
              旗下风险投资机构）投入未披露金额，并取得董事会观察员席位，释放出国家安全方向的协同信号。公司首个重要正式外部融资轮于 2026 年 3 月 5 日完成，总额 $500 million，由 $300 million
              Series A 股权和 $200 million 债务构成。股权轮由 Balerion Space Ventures 领投，IQT、Qatar Investment Authority（QIA）、Mitsui
              & Co.、MUFG、Nikon Corporation（通过与 Geodesic Capital 合作的 NFocus Fund）、Stellar Ventures、Space Capital 和
              Earthrise Ventures 参投；Jed McCaleb 也以创始人和首位投资者身份再次参与。Balerion 的 A.C. Charania 是前 NASA Chief
              Technologist，也随交易加入 Vast 董事会。

              截至 2026 年 3 月，Vast 在空间站技术和设施上的总投入超过 $1 billion。Forbes 于 2025 年 12 月报道称，Vast 正在洽谈一轮估值 $2 billion 的融资；Vast
              未公开确认最终估值。收入、ARR 和客户数均未公开披露；由于尚无空间站商业运营，公司仍处于收入前阶段。$200 million 债务部分在收入产生前形成固定成本义务；若 Haven-1
              发射或获客延迟，财务风险会被放大。
