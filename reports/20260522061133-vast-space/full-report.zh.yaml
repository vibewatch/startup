      - number: '2.4'
        title: 市场规模：证据基础、确认支出与分析缺口
        blocks:
          - type: paragraph
            body: >
              商业 LEO 空间站领域的市场规模很难界定，因为可服务市场没有清晰边界。分析师关于“LEO 卫星市场”的报告（2026 年 $8.9B 至 $15.7B，2035 年预计
              $30B–$62B）把卫星通信星座——Starlink、OneWeb、Project Kuiper——与规模小得多的载人空间站服务市场混在一起。这些宽口径估算不能直接作为 Vast 或任何其他 CLD 竞争者的
              TAM。


              最稳健的近期规模锚点，是已经确认的政府采购：NASA 五年 $2.1 billion CLD 预算，将在 2–3+ 个 Phase 2 SAA 获得者之间分配，是唯一已签约的锚定支出。Voyager
              Technologies 披露其 Starlab 通过 NASA SAA 获得 $217 million，为 Phase 2 奖项规模提供了基准。此前 Phase 1 三个团队合计获得 $416
              million（Nanoracks/Voyager $160M、Blue Origin $130M、Northrop Grumman $125.6M）。Axiom 的四次 ISS
              任务验证了已确认的主权宇航员市场；商业载人任务的定价和利润率未公开披露。


              研究基础中没有发现针对载人空间站服务市场、且与更宽泛 LEO 经济区分开的独立自下而上 TAM
              估算。分析师覆盖主要由宽口径市场聚合机构主导，方法披露有限，发布方声誉层级较低。商业空间站服务可投资市场，在确认的政府锚定采购之外仍高度投机。这构成尽调中的重大证据缺口。
