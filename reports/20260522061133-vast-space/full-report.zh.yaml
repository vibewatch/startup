      - number: '8.2'
        title: 估值框架：适用于收入前深科技创业公司的方法
        blocks:
          - type: paragraph
            body: >-
              截至运行日期，Vast 核心空间站业务仍处于收入前阶段。传统折现现金流分析不适合这个阶段：收入取决于尚未发生的事件（CLD Phase 2 授标、Haven-1
              发射），成本结构有一部分只是估算；对这种风险画像的公司设定任何合理折现率，都会把现值压到接近零。本章采用四种更适用的方法。


              第一，最近融资隐含定价：Forbes 2025 年 12 月报道叠加 2026 年 3 月已确认交易结构，暗示 post-money 股权估值约为 $2.3 billion。这是锚定价格，但需要承认
              pre-money 估算是否准确反映最终交易仍有不确定性。


              第二，重置成本分析：Vast 已投入超过 $1 billion 资本，产出 Haven Demo（2025 年 11 月成功飞行并离轨）、Haven-1（处于集成阶段）、189,000 sq ft Long
              Beach 园区、Mojave 测试台、1,000-plus 人团队，以及 Vast Satellite 的首个商用卫星平台订单。这些资产作为持续经营体的重置成本——包括飞行履历、IP、认证、制造关系和 NASA
              伙伴关系——很可能高于 $1 billion 已投入资本，与 $2.3 billion 隐含估值中包含温和控制权溢价和战略期权价值相一致。


              第三，里程碑调整概率分析：近期最重要的价值事件是 NASA CLD Phase 2 资助型 Space Act Agreement 授标，预计 2026 年中发生。赢得 Phase 2 会把 Vast
              从单项目开发公司，转变为有政府锚定的商业运营商，拥有多年期合同收入和 Haven-2 运营路径。这个单一奖项可能让股权价值重估 $1–2 billion。


              第四，战略可比：可比私募轮（Sierra Space 估值 $8 billion、Axiom Space 数亿美元级融资）和公开市场同业（Rocket Lab 约 13×
              EV/2025-revenue）提供相对价值框架。综合这些方法，情景估值区间为 $0.5–5 billion；基准情景为 $2.0–3.0 billion，锚定 Phase 2 和 PAM 执行。
