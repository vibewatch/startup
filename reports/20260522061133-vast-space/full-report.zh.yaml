  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 已融资本与轮次结构
        blocks:
          - type: paragraph
            body: >-
              Vast 于 2026 年 3 月 5 日宣布完成 $500 million 融资包：$300 million Series A 优先股，以及 $200 million 债务。股权部分由 Balerion
              Space Ventures 领投，共同投资方包括 IQT（CIA 关联风险投资机构）、Qatar Investment Authority（QIA）、Mitsui & Co.、MUFG、Nikon
              Corporation（通过其 NFocus Fund）、Stellar Ventures、Space Capital 和 Earthrise Ventures。Vast 创始人、此前唯一资金支持者 Jed
              McCaleb 也参与本轮。交易的一部分是，Balerion 顾问、前 NASA Chief Technologist A.C. Charania 加入 Vast 董事会。


              在本轮之前，公司完全由 McCaleb 资助；他曾公开表示愿意动用最多 $1 billion 个人财富。因此，2026 年 3 月这轮融资标志着 Vast
              首次获得重要机构外部资本。按公司自己的新闻表述，累计披露投资现已超过 $1 billion。


              Forbes 于 2025 年 12 月报道称，Balerion 将领投一轮 $300 million 融资，投前估值 $2 billion；最终公告确认 $300 million 股权融资，同时新增 $200
              million 债务。如果投前数字成立，则隐含投后股权估值约 $2.3 billion。Vast 或任何投资者均未正式确认最终投后估值，因此该数字是基于 2025 年 12
              月报道的估计。债务条款——到期日、票息、契约——均未披露。


              共同投资方组合了战略资本（Nikon 带来制造技术交叉协同，Mitsui/MUFG 提供日本机构锚点，QIA 提供主权资本延续）、情报界风险资本（IQT），以及专注航天的基金（Balerion、Space
              Capital、Earthrise Ventures、Stellar Ventures）。QIA 也共同投资了数周前完成的 Axiom Space $350 million 融资，显示其看好整个赛道，而非只押注
              Vast。
