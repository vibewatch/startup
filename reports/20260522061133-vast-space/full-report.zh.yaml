      - number: '7.5'
        title: 供应商与需求集中风险
        blocks:
          - type: paragraph
            body: >
              Vast 的供应商集中体现在 SpaceX 的三个独立维度：（1）SpaceX Falcon 9 是唯一发射载具；（2）Crew Dragon 是独家乘组运输和生命保障提供方；（3）Starlink 是
              Haven-1 唯一通信基础设施。这种三重依赖意味着，SpaceX 的单一运营决策——无论是发射清单重新排序、飞行器异常处置，还是商业条款变化——都可能同时影响发射、乘组准入和连接能力。2026
              年初，SpaceX 为优先推进原发射台的 Starship 基础设施工作，将所有 Dragon 任务从 LC-39A 转至 SLC-40，这给 Vast-1 所需 Dragon 发射带来发射清单拥挤风险。2024
              年 10 月，NASA Aerospace Safety Advisory Panel 在一系列 Falcon 9 异常和一次降落伞表现观察后警告 SpaceX 必须「继续聚焦」Dragon
              安全，也为这种依赖增加了安全监管维度。


              Impulse Space 是唯一来源的推进供应商。公司没有公开识别备用推进供应商，Impulse 的交付日程也未披露。AnySignal、TRL11 和 Addvalue 与 Starlink
              一起提供射频连接服务。需求侧，Vast 有一个完全签约的乘组任务（Vast-1）和一个已付定金预留的任务，另有两个任务为「设想中」但未签约。CEO Haot 确认，公司正与私人个人和国家就第 2–4
              次任务深度谈判，但无法公布姓名。修订后的 2027 年 Q1 发射时间线让这些客户承诺更急迫：乘组训练需要六个月到一年，意味着第 3–4 次任务的客户选择必须在未来数月完成，才可能维持进度。
