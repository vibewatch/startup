      - number: '5.5'
        title: 技术风险与未解决缺口
        blocks:
          - type: paragraph
            body: >
              Vast 技术栈仍有一组集中且尚未解决、或只解决了一部分的风险。Haven-1 发射前、以及 2026 年中 NASA CLD Phase II 授标前，重要投资者需要重点评估这些风险。

              最显著的架构风险是对 SpaceX 的深度依赖。Haven-1 需要 SpaceX Falcon 9 发射、每次载人任务都需要 SpaceX Dragon，并依赖 SpaceX Starlink
              作为主连接。如果任何 SpaceX 系统出现长期延误、重设计要求或价格变化，Haven-1 的运营进度和成本结构都会被直接影响。Vast 没有签下替代发射或乘组飞行器；其未来 Haven 平台的 Starlink
              协议也把 Haven-2 绑在同一供应商上。

              Haven-1 的 ECLSS 方案是依靠补给的开环系统，不是闭环再生系统。痕量污染物控制和 CO₂ / O₂ 管理已在 NASA MSFC 完成子系统级测试，但全系统集成 ECLSS
              在等效高度环境下完成测试，尚未得到公开确认。Vast 称 Haven-2 会逐舱引入「更先进、更高效的生命保障技术」，这承认了升级路径，却没有说明闭环目标日期。长期任务（超过每次两周乘组轮换）需要再生式
              ECLSS，而当前 Haven-1 设计尚未证明具备这种能力。

              进度风险不是理论，而是已经发生。最初 2025 年 8 月发射目标因主结构合格认证中的制造学习而移至 2026 年 5 月，此后又随着集成推进更新为 2027 年
              Q1。每个集成阶段（加压系统、航电、居住）都需要功能和环境验收测试；任一阶段的计划外返工都可能传导。计划于 2026 年进行的 Neil Armstrong Test Facility
              测试活动，也是发射就绪前的另一道闸门。

              Haven Demo 虽然是有意义的系统级测试，但它是一颗小型无人卫星，不是加压载人舱。它验证了航电、电源、GNC 和通信，却没有在轨测试
              ECLSS、乘组界面、对接和完整热负荷运行。空间站的人本设计新功能（专利申请中的睡眠系统、内饰收尾、载荷机架）完全没有飞行履历。Haven Demo 还搭乘拼车发射，没有进入专门针对 ISS 兼容性优化的轨道，而
              Haven-1 必须完成交会和对接。

              睡眠系统和内饰设计元素的 IP 保护被标为专利申请中，但硬件设计的竞争护城河有限：一旦公开，竞争对手可以相对快速复制人体工学特征。Vast 真正的差异化在于制造流程、团队和进度执行——这些都不受 IP 保护。
