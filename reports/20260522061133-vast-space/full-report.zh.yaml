  - id: TV005
    title: 投资逻辑破裂与止损标准
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资逻辑的传导
      - 投资人行动含义
    rows:
      - - CLD Phase 2 落选
        - NASA 公布 Phase 2 有资助 SAA，Vast 不在名单内；预计 2026 年中
        - 拿掉 Haven-2 的主要收入锚点；抬高过桥融资需求；股权价值跌入悲观情景区间（$0.5–1.5B）
        - 评估过桥条款；判断 Vast 是否转向 Haven-1 商业模式或战略出售；考虑减值
      - - Haven-1 发射失败或重大异常
        - 发射载具异常，或在运营状态前发生在轨失败；Q1 2027
        - 摧毁 Haven-1 资产；PAM 任务归零；需要保险赔付并重启项目；股权可能减记
        - 确认发射保险条款；评估 Haven-2 项目是否仍可行；近端投资逻辑大概率被阻断
      - - McCaleb 退出或不可抗力
        - 创始人撤回进一步出资承诺，或意外退出治理角色
        - 拿掉最后资本兜底；加快股权融资压力；共同投资人可能恐慌
        - 跟踪治理公告；评估共同投资人能否接替出资；复核投资人协议保护
      - - SpaceX Dragon 安全停飞或可用性中断
        - NASA 或 SpaceX 暂停 Dragon 载人运营，持续时间超过 12 个月
        - PAM 任务推迟或取消；Haven-1 载人运营顺延；收入时间线后推 1–2 年；估值压缩
        - 复核 SpaceX Dragon 发射清单和 NASA 安全小组状态；评估 Vast 合同灵活性
      - - 债务契约违约或到期违约
        - $200M 债务条款显示限制性强；因 CLD 落选或现金消耗触发契约；到期日加速
        - 股权从属于债务回收；A 轮价值受损；可能被迫出售或进行稀释性救助融资
        - 尽调要求完整披露债务条款；按悲观情景假设测算契约余量
    notes: 止损标准是触发后必须立即重估投资逻辑的事件。阈值定义为可观察事件。所有标准都需要持续跟踪，而不是一次性观察。
