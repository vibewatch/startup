  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 因素
      - 方向
      - 时间
      - 机制
      - 对 Vast 的影响
      - 尽调问题
    rows:
      - - ISS 退役要求（2030）
        - 驱动
        - 2027–2030
        - NASA 必须在硬期限前采购替代 LEO 平台；加速 CLD Phase 2/3
        - 最大单一需求催化剂；缺口显现前拿下 Phase 2 SAA 至关重要
        - 跟踪 ISS 延期讨论；任何延期都会削弱 CLD 紧迫性
      - - NASA 预算约束 / 转向
        - 约束
        - 即刻（2026）
        - March 2026 转向对接模块模式，压低近期空间站资金；制造 Phase 2 授奖不确定性
        - NASA 收入确定性下降；Vast 资金需求上升
        - 跟踪 Phase 2 AFP 发布及截至 Q3 2026 的授奖决定
      - - 赔偿 / 保险缺口
        - 约束
        - 发射前
        - 轨道上赔偿框架缺位；CLD 开发商无法取得足额保险；股权和债权投资人被劝退
        - 国会行动前融资风险持续；可能需要 NASA 担保或 PL85-804 授权
        - 跟踪国会对 Commercial Space Launch Act 现代化的行动
      - - 任务授权真空
        - 约束
        - 发射前
        - 尚无机构获授权为空间站发放运营许可证；FCC NPRM 只是局部修补
        - 监管合规的运营边界模糊；国际伙伴合作更复杂
        - 跟踪商务部许可框架制定
      - - 发射频次上升、发射成本下降
        - 驱动
        - 持续（2025–2030）
        - SpaceX 每年约 170 次发射提供物流主干；可重复使用中型运载（Neutron、Stokes）进一步降低补给成本
        - 降低 Haven-1/2 持续运营成本；支撑有竞争力的乘组轮换经济性
        - 量化当前 SpaceX 价格下的补给成本模型，并与 ISS 历史成本对比
      - - 中国 Tiangong 竞争压力
        - 驱动（地缘政治）
        - 持续
        - Tiangong 自 2022 年以来持续驻人；国际伙伴认为美国通道不确定；地缘政治紧迫性加大 CLD 资金压力
        - 地缘政治驱动因素强化国会对 CLD 资金的支持
        - 跟踪国际机构关于 2028 年后 ISS 和 Tiangong 使用的决定
    notes: >-
      方向和时间来自公开来源下的分析师判断。“约束”因素不一定阻断市场形成，但会卡住形成速度和融资节奏。 NASA 预算数字来自 FY2026 Presidential Budget Request，以及 NASAWatch 关于
      CLD 指令的报道。
