      - number: '5.6'
        title: 要点摘录
        blocks:
          - type: callout
            title: Haven Demo 带来飞行验证的子系统
            body: >
              Haven Demo 成功完成 49 项在轨测试目标并受控离轨，为 Vast 验证了 GNC 算法、Impulse Space Saiph 推进器性能数据、航电可靠性，并沉淀出更精细的 HITL
              测试资产——这些能力是从零建造空间站的竞争者完全不具备的。
            calloutType: strength
            claimRefs:
              - CE013
              - CE014
              - CE017
          - type: callout
            title: SpaceX 依赖是一项集中风险
            body: >
              三个关键系统——发射（Falcon 9）、乘组运输（Dragon）和主宽带连接（Starlink）——都由 SpaceX 承包。SpaceX 的价格变化、飞行器停飞或商业纠纷，都可能影响 Haven-1
              的运营可行性。三项功能都没有公开签约的备用供应商。
            calloutType: risk
            claimRefs:
              - CE036
              - CE041
          - type: callout
            title: 开环 ECLSS 限制任务时长
            body: >
              Haven-1 的环境控制与生命保障系统是开环设计：氧气依靠消耗品补充，CO₂ 由需要更换的吸附材料去除。这一设计可在补给支持下支撑两周乘组轮换，但若没有闭环再生升级，不适合长期运营——该升级计划用于
              Haven-2，但尚未演示，也未披露详细设计。
