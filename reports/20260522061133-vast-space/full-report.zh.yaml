          - type: callout
            title: 关键假设：ISS 退役后主权宇航员需求继续放大
            body: >-
              近期商业空间站收入逻辑很大一部分押在主权宇航员任务上：ESA、JAXA、UAE 和其他机构在 ISS 退役后仍继续把人员送入轨道。现有 MOU 和 Axiom
              过往记录验证了这一假设，但商业空间站上尚无绑定合同支持。若机构转向 Tiangong 访问，或暂停载人航天计划，非 NASA
              需求基础会急剧收缩。该假设应作为关键尽调假设处理，需要通过机构预算科目和正式任务承诺验证。
