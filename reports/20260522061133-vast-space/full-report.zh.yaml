      - number: '3.4'
        title: 护城河耐久度、反向证据与先发现实检查
        blocks:
          - type: paragraph
            body: >
              Vast 声称的先发优势需要拆开看。公司很可能发射第一座自由飞行商业空间站，但在多年、重资本基础设施竞赛中，“先发”并不会天然带来软件或平台业务中常见的切换成本或网络效应护城河。空间站客户——主要是 NASA
              和主权机构——采购周期以年计，不是以月计；它们在 CLD 供应商之间切换的成本相对低。主权客户可以在 2028 年承诺使用 Axiom Station，而不放弃 2027 年
              Haven-1，反之亦然。多平台并用在 CLD 供应商之间既可行，也很可能发生。


              Vast 竞争位置的反向情景由四根支柱支撑。第一，NASA 关系差距是结构性的。Axiom 的合同和 Starlab 的有资助 SAA 代表了 Vast 尚未取得的政府协同。在 CLD Phase 2
              竞争中，Axiom 和 Starlab 带着 NASA 监督下已验证的里程碑执行记录入场；Vast 必须从零证明这种能力。第二，SpaceX 集中度：Vast 依赖 SpaceX Falcon 9 发射
              Haven-1，并依赖 SpaceX Dragon 为首个私人宇航员任务运送乘员。这一依赖同时是运营优势（SpaceX 是飞行验证最充分的重型运载选项）和战略风险（定价和访问完全由 SpaceX
              这个激励独立的商业主体控制）。第三，Axiom 的 ISS 运营经验——12 名付费乘员、166 个载荷——构成 Vast 没有对应物的客户关系和任务运营知识库。Axiom 客户是复购客户，已经理解赴 ISS
              商业任务的定价、物流和监管框架。第四，商业需求问题仍未解决：NASA 自己在 2026 年 3 月称商业案例尚不存在，直接挑战了多个商业空间站能在没有政府锚定合同情况下同时自我维持的前提。


              面对这些逆风，Vast 的耐久优势包括：（a）最快到达运营状态的路径，在 Axiom、Starlab 或 Orbital Reef 投入运营前提供唯一收入窗口；（b）更干净的资本结构——没有 JV
              治理复杂性，也没有 Boeing 或 Airbus 拖累；（c）来自直接 Dragon 运营经验团队的 SpaceX 技术血统（COO Kris Young 曾在 SpaceX 指挥全部 19 次 Dragon
              载人航天任务）；以及（d）垂直整合制造，支撑公司所称主结构成本降低 10×。这些优势真实存在，但取决于执行：Haven-1 必须在 2027 年 Q1 目标附近发射，进度领先才有战略意义，而不是停留在愿景里。


              5–10 年维度上，商品化风险不可忽视。若 NASA Phase 2 资助三家或更多 CLD 供应商走到 CDR 准备和在轨演示，且 ISS 延寿至 2032
              年，市场可能出现供需失衡：多个部分运营空间站争夺一笔与 ISS 时代支出相比实际下降的 NASA 采购预算，而私人需求仍未被验证。在这种情景下，资产负债表最强、NASA
              合同关系最深的竞争者——Axiom——保留耐久结构优势；Haven-1 的进度领先会变成沉没成本，无法保证 Haven-2 获得 Phase 2 奖项。
            claimRefs:
              - CP034
              - CP035
              - CP036
              - CP037
              - CP038
              - CP039
              - CP040
