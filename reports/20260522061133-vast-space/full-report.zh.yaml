      - number: '8.6'
        title: 投资建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，对 Vast Space 的建议投资姿态是「继续研究」。公司确实有显著战略优势——首飞硬件履历、多元化机构投资人联盟、已确认的 NASA PAM 授奖、以及可信的 CLD Phase
              2 竞争位置——但在 Phase 2 结果明确（2026 年中）、隐含股权标记估值获确认、债务条款披露之前，投资案例还无法以足够信心评估。


              当前不支持「买入」建议，因为 $2.3 billion 的隐含入场价在悲观情景下有明显下行风险，而基准情景的上行空间只是中等。风险调整后的回报结构是二元的，并没有向投资人不对称倾斜：乐观上行（相对当前标记估值约
              2×）不足以补偿悲观下行（价值损失 60–80%）。已经持仓的投资人适合采取「观察」姿态，CLD Phase 2 授奖公告是首要重新评估触发点。


              最高优先级的五项尽调问题是：通过与直接投资人沟通，确认投后股权估值和股权结构表条款；审阅 $200 million 债务条款清单，尤其是契约限制和到期安排；评估 CLD Phase 2 竞争格局；确认首个
              Haven-1 发射日期及是否有发射保险；确认 Vast Satellite 卫星平台商业条款、定价和客户身份。
            claimRefs:
