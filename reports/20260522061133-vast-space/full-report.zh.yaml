  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与需求通道
        blocks:
          - type: paragraph
            body: >
              Vast 的客户基础横跨三条结构性需求通道，它们都指向微重力准入。第一条是商业载荷研究，生命科学公司、制药企业和先进材料研究者租用 Haven-1 Lab 的 MLE
              载荷位，开展地面无法完成或成本过高的失重实验。第二条是机构与政府需求，包括 NASA 私人宇航员任务、国家航天机构 MOU，以及把公共资助研究者送入轨道的 ISS National Lab
              路径。第三条是在轨工业服务，技术验证方和制造企业在空间环境中测试产品或工艺。

              在商业载荷研究里，五家公开确认的 Haven-1 Lab 伙伴都在生命科学领域——细胞生物学（Yuri、Exobiosphere）、制药与生物工艺（Redwire
              ADSEP4）和天体生物学（Interstellar Lab）——这使发射前组合呈现行业集中。政府和机构需求则通过 NASA PAM-6、CASIS 战略协议和 ESA MOU 固化。SpaceX / Vast
              联合 RFP 为入选研究者免费提供研究准入，把客户漏斗上沿扩展到学术团队和预算较小的商业研究团队。Vast 向日本（Vast Japan GK，2025 年 12 月）和欧洲（Giorgio
              Saccoccia，President Europe）扩张，显示其意图在三条需求通道上做地域多元化。Haven-1 Lab
              载荷伙伴来自四个国家——美国、德国、日本和法国——说明早期需求已跨区域，尽管都集中在相邻垂直领域。
