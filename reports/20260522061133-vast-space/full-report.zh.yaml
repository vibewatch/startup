      - number: '7.4'
        title: 监管、需求与战略风险
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 1 月 28 日，NASA Commercial Low Earth Orbit Destinations Contract（CLDC）采购已正式暂停。NASA 表示，将继续通过资助型
              Space Act Agreements 支持行业设计和演示，而不是像最初计划那样授予固定总价认证和服务合同。更新后的采购里程碑日程尚未发布。原 Phase 2 CLD
              策略在内部被归类为「高风险」，因为相对预计拨款需要 $4 billion 预算超额需求；转向资助型 SAA 解决了近期预算问题，却推迟了竞争空间站开发商——包括 Vast——一直期待的合同锚点。


              NASA 2025 年 7 月 CLD 指令进一步降低了强制最低乘组要求，从连续 6 个月居住（原「Full Operational Capability」门槛）降为一月乘组停留，并明确表示 NASA
              的「持续心跳」LEO 存在策略不具约束力。2026 年 3 月，NASA 领导层公开称「没有可独立验证的市场研究能证明一座只由 NASA
              部分资助的商业空间站具备经济可行性」，并承认「在当前预算下，我们无法资助两座空间站的路径」。这些表述凸显 NASA 自身也认为商业 LEO 过渡具有高风险。


              Vast 对这一环境的战略暴露，被 Haven-1 不依赖 NASA 合同这一点部分缓释。不同于 Axiom、Blue Origin 和 Starlab——它们持有资助型 Phase 1 SAA——Vast 只有
              Haven-1 的无资金 Space Act Agreement，即获得 NASA 技术协助但没有直接资金。这个结构避免了 NASA 预算削减直接让 Haven-1 停摆，但也意味着 Vast 进入 Phase
              2 竞争时缺少已获资助的执行记录，相比拥有 NASA 里程碑证明的公司可能处于劣势。FAA 商业发射许可制度负责监管 Haven-1 的 Falcon 9 发射，已经相当成熟（FAA 于 2025 年 8
              月许可第 1,000 项商业空间运营），但商业空间站乘组认证要求仍在演进，为本就困难的时间线增加了监管执行风险。
