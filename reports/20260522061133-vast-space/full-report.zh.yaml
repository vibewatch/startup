chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与产品组合
        blocks:
          - type: paragraph
            body: >-
              Vast Space（法律实体：Vast, Inc.）由 Jed McCaleb 于 2021 年在加州创立，最初瞄准用于长期人类居住的人工重力空间站。到 2025–2026
              年，战略转为硬件密集的分阶段路径：Haven Demo 这个在轨技术试验平台于 2025 年 11 月 2 日发射，完成 49 项测试目标，并于 2026 年 2 月 4 日离轨，使 Vast
              成为唯一飞行、运营并离轨一个专门商业空间站试验平台的商业实体。Haven-1 是单舱、四人商业空间站，宜居体积 45 m³、加压体积 80 m³、功率 13,200 W，并搭载 SpaceX Starlink
              Gigabit/s 激光终端；该舱段于 2026 年 1 月 20 日在 Vast Long Beach 总部进入集成阶段，目标是在 2027 年 Q1 由 SpaceX Falcon 9 从 Cape
              Canaveral 发射。Haven-2 是 Vast 提出的多舱 ISS 后继方案，正在竞争 NASA Commercial LEO Destinations（CLD）Phase 2 合同，第一舱目标 2028
              年入轨，2032 年形成完整构型。

              公司总部位于加州 Long Beach Airport 附近一处 189,000 平方英尺园区，并在 Texas 州 Houston、NASA Johnson Space Center
              附近设有第二办公室。Vast 员工超过 1,000 人，采用垂直整合制造模式，约 90% 组件自制；公司称该模式已将主结构制造成本较传统空间站项目降低 10×。2026 年 5 月 19 日，Vast 宣布推出
              Vast Satellite，一条 15 kW 级卫星平台产品线，沿用 Haven Demo 技术积累；首单确认销售四台，并有 200 台追加选择权。这是公司向空间站服务之外拓展收入的第一步。
