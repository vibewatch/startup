  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Haven-1 系统架构与子系统
        blocks:
          - type: paragraph
            body: >
              Haven-1 是一座单舱商业空间站，为四人乘组、两周任务设计。加压结构为铝制圆筒，直径 4.4 m、高 10.1 m，在 80 m³ 总加压容积中提供 45 m³ 可居住空间，发射质量 14,600
              kg。目标轨道为 425 km 高度、51.6° 倾角，大体兼容 ISS 轨道面，便于规划交会对接。

              供电来自西班牙制造商 DHV Technology 提供的十二片可展开太阳翼，每片输出 1.1 kW，峰值合计 13.2 kW，并由内部电池模组补充；电池模组经电芯筛选、pack
              组装和测试完成。三结光伏电池针对更宽光谱捕获做了优化。Vast 在总部完成了太阳翼电致发光测试，以验证电池片可用性。

              姿态控制依靠六个自研控制力矩陀螺（CMG），每个 CMG 都由铰接万向架上的高速飞轮构成。推进由 Impulse Space 的 Saiph 推进器系统提供——可储存的 N₂O/乙烷推进剂组合驱动 RCS
              推进器，用于增强 CMG 控制，并驱动专用离轨推进器完成寿命末期处置。Saiph 推进器在 Haven-1 选型前已完成合格认证，并通过 Haven Demo 2026 年 1 月在轨点火测试积累了额外飞行履历。

              对接采用被动式 International Docking Adapter（IDA），并于 2025 年 10 月完成与 SpaceX Dragon 硬件的 fit-check。通信依靠 SpaceX
              Starlink 激光终端，为乘组设备、载荷机架和外部相机提供 gigabit 级、低延迟互联网；同时配有一条冗余的 GEO / 地面站 RF 通道，已在 Haven Demo 上测试。Common Area
              后端布置 1.1 m 穹顶观察窗，同时承担结构功能，并带有微流星体与轨道碎片（MMOD）防护。

              Haven-1 Lab 位于前部舱段，提供十个 Middeck Locker Equivalent（MLE）载荷位，可通过 Starlink
              远程指令和监控。Redwire、Yuri、JAMSS、Interstellar Lab、Exobiosphere 等载荷伙伴已预留容量；截至 2025 年 4 月，Vast
              称容量接近满载。热控使用增材制造冷板，将航电热量导入流体回路；散热器会在 Phase 3 集成时安装。
