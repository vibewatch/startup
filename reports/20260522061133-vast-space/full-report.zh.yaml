      - number: '5.2'
        title: Haven Demo：在轨技术降险
        blocks:
          - type: paragraph
            body: >
              Haven Demo 是一颗验证卫星，于 2025 年 11 月 2 日搭乘 SpaceX Bandwagon-4 拼车任务从 Cape Canaveral 发射。卫星与火箭分离后四分钟内部署太阳能板，T+15
              分钟达到电力净正状态，分离 23 分钟后建立双向通信。三个月任务期间，它完成 49 项测试目标，覆盖空间站关键技术域；即便在历史高位太阳活动期间，也全程保持电力净正。

              核心航电套件、配电、Impulse Space Saiph 推进、GNC 硬件与算法、RF 通信、相机和飞行软件都按飞前模型进行了测试。在轨辐射效应与地面预测一致。GPS
              导航在冲突地区发现意外干扰，随后通过软件更新修补，证明飞行软件可上行更新。Saiph 系统推进剂性能数据被收集，用于校准 Haven-1 的推进剂管理计划。面向 Haven-1 的同一 GEO
              与地面资产也通过真实轨道数据验证了 RF 通信。

              Vast 全程运行多层地面测试基础设施：Ground Test
              Simulator（GTsim）用不同参数跑了数千次任务仿真；Software-in-the-Loop（SITL）资产在虚拟航天器上测试飞行软件；Hardware-in-the-Loop（HITL）资产同时测试飞行硬件和软件。Haven
              Demo 的真实飞行数据被用于细化 HITL 模型，为 Haven-1 产出更高保真的测试资产。

              2026 年 1 月，任务运营团队进行了 Saiph 推进器试点火，验证推进剂调理，并把推力表现锚定到地面真空测试数据。2026 年 2 月 4 日，受控离轨序列执行，先将近地点降低 170
              km，随后通过末次离轨点火瞄准南太平洋溅落区域。NASA、航空和海事安全机构参与协调。离轨后，Vast
              称自己是「第一家完成航天器设计、制造、飞行、运营和离轨的运营型商业空间站公司」，并表示距离持续载人空间站约完成了 40%。该任务直接降低了 Haven-1 航电、电源、GNC
              和通信子系统风险，但没有测试生命保障或乘组居住系统。
