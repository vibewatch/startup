      - number: '5.4'
        title: 产品路线图与技术邻接
        blocks:
          - type: paragraph
            body: >
              Vast 路线图采用硬件密集的阶梯模型：Haven Demo → Haven-1（载人商业 LEO 空间站）→ Haven-2（多舱 ISS 后继者）→
              人工重力栖息地。每一步都直接复用前一步的设计、团队、供应链和飞行履历，为后续舱段压缩进度和成本。

              Haven-2 被设计为 Haven-1 的演进版、NASA 认证版。如果 NASA 在 Commercial LEO Destination Phase II（预计 2026 年中决策）选择 Vast，首个
              Haven-2 舱段将比 Haven-1 长约 5 m，在使用同一套已验证系统的同时，提供近乎两倍的可居住空间。从 2028 年起，另外三个舱段将按每六个月一个的节奏跟进；到 2030
              年底，四舱空间站可支持持续乘组运营。2030 至 2032 年间，还会加入一个直径 7 m 的更大核心舱和四个 Haven-2 舱段，包括 3.8 m 穹顶舱、机械臂、外部载荷气闸和 EVA 气闸。

              Haven-1 Lab 已签约五家载荷伙伴（Redwire、Yuri、JAMSS、Interstellar Lab、Exobiosphere），并与 Cedars-Sinai
              建立战略研究合作，聚焦类器官研究和生物制造。Vast 与 SpaceX 联合向全球科学界发布研究提案征集，为入选项目免费提供 Haven-1 Lab、Dragon 和 ISS PAM 任务资源。Vast 还与
              CASIS 签署战略协议，支持 ISS National Lab 研究准入，为其 NASA 私人宇航员任务做准备。2026 年 2 月，Vast 入选 NASA 第六次 ISS 私人宇航员任务，目标时间为
              2027 年夏季。

              Vast Satellite 产品线于 2026 年 5 月 19 日发布，复用 Haven-1 开发并经 Haven Demo 验证的航电、电源、推进、通信和飞行软件子系统。首款 15 kW 级卫星平台（700
              kg 干重、350+ kg 载荷能力、5 年设计寿命）瞄准通信、对地观测、国家安全和轨道数据中心客户。公司已宣布向一名保密客户完成首单销售（四颗卫星，另有 200 颗期权），可在 Haven-1
              运营启动前提供近期收入潜力。

              人工重力栖息地仍是 Vast 长期宣称的愿景——大型旋转结构通过离心加速度，对抗长期微重力带来的肌肉萎缩、骨质流失和颅内压升高等生理影响。当前任何一代产品（Haven
              Demo、Haven-1、Haven-2）都不包含旋转结构；人工重力是十年外的愿景，且明确不在 Haven-2 日程内。
