      - number: '8.3'
        title: 可比公司与先例交易分析
        blocks:
          - type: paragraph
            body: >-
              商业空间站赛道没有直接可比的上市公司，也没有近期 IPO 可用，估值只能拼接私募轮交易和公开市场代理样本。


              Sierra Space 2026 年 3 月融资轮是最接近的私募可比样本：公司披露估值 $8 billion，自 2021 年以来累计投入资本 $2 billion，隐含 4× 的价格 /
              投入资本倍数。把同样的 4× 倍数套到 Vast 估计已投入的超过 $1 billion，估值会指向超过 $4 billion——但 Sierra Space 与 Blue Origin 的 Orbital
              Reef 合作、Dream Chaser 货运能力以及国防重心，都是战略差异点，不能直接映射到 Vast 更窄的 Haven 模型。


              Axiom Space 是目前唯一正向 ISS 执行私人宇航员任务的公司，累计融资已超过 $350 million。它的模式——先把私有舱段接到 ISS，再过渡到独立运营——与 Vast 的任务更接近；但
              Axiom 已验证运营收入（4 次 PAM 任务），Vast 还没有做到，因此 Axiom 的定价更像 Vast 当前标记估值的上限。


              公共市场里，Rocket Lab USA 最能提示市场如何给商业太空基础设施公司定价。Rocket Lab 披露 FY2025 收入 $602 million，同比增长 38%，积压订单 $1.85
              billion，隐含 EV/收入倍数约 13×。即便给 Vast 任何可想象的近期收入流套折价倍数，也先要有收入——而 Vast 还没有。因此，公开市场可比分析主要只给长期价值画上限。


              Redwire、Planet Labs、Spire Global 等规模较小的上市太空基础设施公司，市值都低于 $1
              billion，收入牵引有限。这提醒投资人：太空基础设施市场对收入规模路径不清晰的公司非常冷酷。
