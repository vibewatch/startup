      - number: '7.3'
        title: 财务与资本强度风险
        blocks:
          - type: paragraph
            body: >
              Vast 于 2026 年 3 月完成 $500 million 融资，包括由 Balerion Space Ventures 领投的 $300 million Series A 股权融资，Nikon、Qatar
              Investment Authority、Mitsui 和 MUFG 参投，另有 $200 million 债务融资。Haven 项目累计投入资本因此超过 $1 billion。Haven-1
              完全由私人资金支持，且据报道已付款完成，缓解了该项目的近期流动性风险。但公司没有披露任何商业收入流；所有运营资金都依赖股权和债务，没有 NASA 合同为 Vast 贡献现金。


              Haven-2 九舱架构的资本强度，是长期最主要的财务风险。完整 Haven-2 建造成本没有公开数字，但可比项目暗示，在空间站达到运营能力前需要数十亿美元支出。按当前 burn rate 估计，Vast
              现有资本可支撑两到三年 runway，但 burn rate 和 Haven-2 资本缺口都未披露。


              Ripple 联合创始人 Jed McCaleb 是 Vast 的主要财务支持者。虽然 2026 年 3 月融资引入了更广泛的机构财团，McCaleb
              作为基石投资者的角色仍占主导，且没有确认任何规模相当的第二投资者。行业分析师普遍将这种单一出资人集中视为关键风险：如果 McCaleb 在 Haven-2
              达到关键设计审查前兴趣或出资能力变化，公司必须在资本密集、收入前开发阶段迅速寻找替代融资。NASA CLD Phase 2 项目可能通过多年期资助型 Space Act Agreement 帮助分担
              Haven-2 开发成本，但截至 2026 年初仍处于暂停状态，且没有更新采购日程。
