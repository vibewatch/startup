            title: Haven-1 生命保障依赖是硬性单点故障
            body: >-
              没有 Crew Dragon 对接，Haven-1 无法维持乘组。任何 SpaceX 运营中断——发射清单重排、Dragon 异常调查或安全暂停——都会直接让 Haven-1
              载人运营停摆，且没有备用路径。投资者评估近期运营风险时，应把这一架构依赖放在尽调首位。
