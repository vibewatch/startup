        - label: 通过载荷计划或 RFP 申请
          value: 20
          description: 提交载荷提案或 RFP 申请的机构；Vast 未发布公开数字；按已公布 RFP 和已确认合作伙伴数量估计
        - label: 入选载荷合作伙伴（MLE 槽位可用）
          value: 8
          description: Haven-1 Lab 可用 MLE 槽位；已公开点名 5 家确认合作伙伴，按“接近满载”表述推算，约 3 个槽位仍未承诺或被预留
        - label: 已签约并集成硬件
          value: 5
          description: 5 家公开点名的合作伙伴（Redwire、Yuri、JAMSS、Interstellar Lab、Exobiosphere）正积极准备载荷硬件，以便在 2027 年 Q1 发射前完成集成
    sourceRefs:
      - SU001
      - SU012
      - SU013
      - SU016
      - SU020
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    summary: >-
      Yuri 的证据画像最强：此前有 151 次空间实验室飞行，61 个客户覆盖 4 大洲；Redwire 受益于深厚的 ISS 生物反应器经验。 JAMSS 机构关系强，但商业履历较薄；Interstellar Lab 和
      Exobiosphere 最早期，不过 Exobiosphere 通过 Cedars-Sinai 合作增加可信度。
    data:
      columns:
        - 商业履历
        - 独立佐证
        - 机构绑定
        - 任务阶段就绪度
      rows:
        - label: Redwire Space
          values:
            - label: 高 — 多个 ISS 生物反应器和药物结晶载荷已飞行
            - label: 高 — Payload Space、SpaceflightNow、NASA 新闻报道确认 ISS 经验
            - label: 高 — 此前有 NASA 合同；ADSEP4 直接延伸已验证 ISS 工作
            - label: 中 — 发射前；公告称硬件设计进行中
        - label: Yuri GmbH
          values:
            - label: 高 — 公司网站显示 61 个客户、151 个空间实验室、覆盖 4 大洲
            - label: 高 — 公司网站和 ScienceTaxi 平台页自行记录了丰富历史
            - label: 中 — 与 ESA 周边关系；ScienceTaxi 多用户模式已建立
            - label: 中 — 发射前；ScienceTaxi 设计经过此前 ISS 飞行成熟化
        - label: JAMSS
          values:
            - label: 中 — 日本主要 ISS 载荷集成商；政府项目履历
            - label: 中 — JAMSS 新闻稿和 Payload Space 报道确认合作
            - label: 高 — JAXA 关系；Haven-1 Lab 首个亚洲来源合作伙伴
            - label: 中 — 发射前；载荷规格尚未完全公开披露
        - label: Interstellar Lab
          values:
            - label: 低 — 早期法国农业航天创业公司；公开收入证据有限
            - label: 低 — 除 Payload Space 简讯外，独立媒体报道有限
            - label: 中 — ESA BIC 校友背景；农业航天细分方向受 EU 关注
            - label: 低 — 发射前；Eden 1.0 设计成熟度未公开记录
        - label: Exobiosphere
          values:
            - label: 低 — 早期；Haven-1 前公开商业履历有限
            - label: 中 — Cedars-Sinai 2026 年 4 月新闻稿提供独立佐证
            - label: 高 — Cedars-Sinai Medical Center 合作增加顶级机构背书
            - label: 低 — 发射前；OHTS 设计成熟度未公开记录
    sourceRefs:
      - SU002
      - SU003
      - SU008
      - SU010
      - SU011
      - SU020
      - SU024
      - SU026
  - id: FU004
    title: 留存 / 重复队列
    type: cohort
    summary: >-
      5 家 Haven-1 Lab 合作伙伴都在 2025 年公告阶段加入，目前正推进发射前集成。科学运营（产生收入的阶段）对所有合作伙伴仍为空， 等待 Haven-1 在 2027 年 Q1 发射。Exobiosphere
      发射前就绪度最高，因为 2026 年 4 月 Cedars-Sinai 合作增加了明确研究议程。
    data:
