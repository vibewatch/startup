      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              未来三年任一时点的估值，几乎完全由两个二元事件决定：CLD Phase 2 授奖（预计 2026 年中）以及 Haven-1 成功发射并运营（Q1 2027）。情景分析反映的就是这种事件驱动结构。


              乐观情景（概率信号：20–30%）：Vast 赢得 CLD Phase 2 资金，Haven-1 在 Q1 2027 成功发射并运营，第六次 PAM 任务在 2027 年夏季执行并产生 $150–220
              million 总任务收入，Vast Satellite 还拿到更多卫星平台订单。在这种情景下，到 2028 年，Vast 将拥有可验证的多来源收入、$300–700 million 政府锚定合同，并在商业
              LEO 空间站市场建立可防守的领先地位。在 5–7× 远期收入倍数假设下，隐含股权价值达到 $3.5–5.0 billion 是合理的。


              基准情景（概率信号：40–50%）：Vast 赢得 CLD Phase 2，或获得 Phase 1 延长期资金；Haven-1 略有延迟但进入轨道；PAM 任务产生部分收入。2027–2028
              年，隐含股权价值大概率落在 $2.0–3.5 billion 区间，与当前 $2.3 billion 标记估值一致，也代表 Series A 投资人获得中等风险调整回报。


              悲观情景（概率信号：25–35%）：Vast 在 CLD Phase 2 中输给 Axiom Space 或 Starlab，Haven-1 发射延迟或只取得部分成功，公司还要在已背负 $200 million
              债务、可验证收入有限的情况下寻求桥接融资。在这种情景下，股权价值会大幅下滑——可能降至 $0.5–1.5 billion；除非 Vast 能转向更小足迹的商业模式，靠卫星平台收入和 PAM 费用供血，否则
              Series A 投资人将面临资本亏损。
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV031
              - CV032
