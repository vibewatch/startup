      - number: '3.3'
        title: 横向评估：进度、架构、NASA 定位与资本
        blocks:
          - type: paragraph
            body: >
              从四个维度看——进度成熟度、技术架构、NASA 关系深度和资本充足性——竞争站位差异显著。


              **进度成熟度：** Vast 在进度上领先。Haven Demo 已完成飞行、运营和离轨（2025 年 11 月至 2026 年 2 月），提供了同行中唯一在飞空间站试验平台验证。Haven-1 于 2026
              年 1 月进入集成阶段，目标 2027 年 Q1 由 SpaceX Falcon 9 发射，比下一个竞争者里程碑（Axiom 2028 年运营）早 18–24 个月。Axiom 排第二，Hab One
              制造进行中且 CDR 已完成。Starlab 随后，PDR 已完成、CDR 在前方；目标 2029 年。Orbital Reef 公开时间线最不清晰；未宣布 CDR 完成。


              **技术架构：** 各竞争者部署策略差异很大。Axiom 采用分阶段 ISS 接入模式，降低单次发射质量 / 体积风险，但在 ISS 退役时增加运营复杂性。Starlab 选择 Starship
              单次发射架构——运力最高但重型运载飞行验证最少——可减少在轨组装，却集中发射风险。Orbital Reef 模块化设计（LIFE® 栖息舱加 Core
              module）把技术风险分散到多次发射，但增加交会对接复杂性。Vast 的 Haven-1 最简单：用成熟 Falcon 9 发射单舱，不依赖 NASA 认证，也不接入
              ISS，最大化入轨速度，但初始容量有限（四名乘员、45 m³ 宜居体积）。Haven-2 若要实现 ISS 级完整能力，需要多次发射。


              **NASA 关系深度：** 这是 Vast 最重要的结构性劣势。Axiom 的固定总价 IDIQ 合同是最深的政府关系，提供基于 SAA 的竞争者没有的合同收入确定性。Starlab 的 $218M 有资助
              SAA（$183M 已拨付）处于下一层。Orbital Reef 的有资助 SAA（$130M）排第三。Vast 的无资助 SAA 意味着 Vast 在 Phase 1 没有收到 NASA
              拨款，必须在公开竞争中赢得 Phase 2 资金；同一资金池里的既有对手已具备 Phase 2 设计成熟度。这个差距不只是象征意义：有资助 SAA 获得者拿到了 NASA
              技术专长、设施和里程碑门槛结构，加快设计评审进展；Vast 没有。


              **资本充足性：** Sierra Space 以披露估值领先（2026 年 3 月 $8B），但现在是双任务方向（防务 + CLD）。Axiom 私有估值未公开披露；此前报道显示近期融资前在 $2–3B
              区间。Vast 于 2026 年 3 月完成 $500M（Series A），总融资达到 $1B+；该轮隐含估值约 $2B。Voyager Technologies（VOYG）市值约 $2.37B（2026 年
              5 月），是 Starlab 母公司的公开可观察代理，但不是直接空间站估值。四家私营竞争者共同特点是，在运营前阶段，空间站建设烧钱速度快于收入可抵消速度，十年资本计划持续存在融资风险。
