      - number: '7.2'
        title: 技术与任务能力风险
        blocks:
          - type: paragraph
            body: >
              Haven-1 最具结构性特征的技术风险，是它有意依赖 SpaceX Crew Dragon 在载人期间提供生命保障。Haven-1 加压容积为 45
              m³，足以支持短期访问，但无法自主持续居住；因此它依靠停靠在后端端口的 Dragon 提供大气再生、CO₂ 去除、湿度控制和紧急中止能力。没有 Dragon
              对接时，空间站无法独立维持人类乘组。这是刻意的工程取舍：借用飞行验证系统来降低 Haven-1 开发成本和进度风险，但也制造了硬依赖。若 Dragon 因 SpaceX
              发射清单压力、飞行器异常或监管暂停而不可用，Haven-1 载人运营会直接停摆。


              空间站设计的每次乘组远征最长期限为 30 天，名义计划约两周停留。这限制了每个座位预订的收入潜力，也意味着 Haven-1 本身没有持续乘组驻留路径。NASA 最初针对商业空间站竞争者的「Full
              Operational Capability」规格，要求连续支持四名乘组、每次六个月增量；Haven-1 架构从根本上无法满足这一门槛。


              积极的一面是，Haven-1 的 ECLSS 痕量污染物控制子系统已通过 NASA Marshall Space Flight Center 测试，确认它能在所有计划任务阶段维持安全大气。Impulse
              Space 已签约交付推进系统，采用可储存 N₂O / 乙烷推进剂组合，并以 Saiph 推进器作为反作用控制系统。截至报告日期，推进交付尚无公开里程碑更新，完成时间仍是证据缺口。2025 年成功完成的
              Haven Demo 卫星任务验证了关键航电、导航和控制履历，并反哺 Haven-1 设计。
