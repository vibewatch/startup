      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Vast 管理层把连续创业者基因和深厚的 SpaceX 运营经验拼在一起。Jed McCaleb（创始人、董事会主席兼技术专家）因联合创办 Ripple 和 Stellar 闻名，也是公司的主要资金支持者。Max
              Haot 自 2023 年 8 月起担任 CEO，通过 Launcher 收购加入；他此前创办并退出 Launcher（被 Vast 收购）、Mevo（被 Logitech 收购）和 Livestream（被
              IAC/Vimeo 收购）。Alex Hudson 于 2023 年 8 月加入并担任首任 CTO，此前最近在 SpaceX 任航空电子副总裁，带领 Dragon 航电系统完成 Demo-2。Kris Young
              于 2025 年 9 月加入担任 COO，在 SpaceX 工作 14+ 年，曾以任务总监和 Space Operations 总监身份负责全部 19 次 Dragon 载人航天任务。Caryn
              Schenewerk 担任 Chief Policy Officer，曾任 Relativity Space 监管和政府事务 VP，并在 SpaceX 工作十年。

              宇航员顾问团由前 NASA 宇航员负责人 Drew Feustel 领衔，成员包括 Megan McArthur、Garrett Reisman 和 JAXA 宇航员 Naoko
              Yamazaki，为载人运营提供视角。前 NASA Chief Technologist A.C. Charania 通过 Balerion Space Ventures 在 2026 年 3
              月融资中加入董事会。除这些公开姓名外，董事会构成未披露。

              关键人物依赖体现在两条轴线上，且影响重大。第一，Jed McCaleb 自 2021 年以来一直是主导资金来源；Forbes 报道称，他曾表示愿意投入最多 $1 billion
              个人财富。在外部收入落地前，McCaleb 支持姿态的任何变化都将造成高度扰动。第二，运营 C-suite 高度集中于 SpaceX 校友；Haven-1
              执行能否跑通，取决于这些人能否留任并保持一致。Haot、Hudson 或 Young 若同时离职，将构成严重执行风险。
