      - number: '6.4'
        title: 集中风险、收入前状态与留存韧性
        blocks:
          - type: paragraph
            body: >
              Vast 客户组合有几项结构性风险，尽调需要把它们与表面动能一起衡量。第一，五家已确认的 Haven-1 Lab
              伙伴都在生命科学和生物技术领域，形成行业集中风险：如果监管、资金或科学进展削弱微重力药物或生物医学研究，整个商业载荷管线会同时暴露。第二，Vast
              仍处于收入前阶段；这里描述的每一项合作都是前瞻承诺，载荷位费用、PAM 乘组价格或政府合同金额均未公开。「接近满载」说法无法独立验证，因为载荷位库存和伙伴财务承诺水平都不公开。第三，ESA MOU
              不具约束力；Czech Republic 和 Japan MOU 尚未带来有约束力的收入承诺；ISS National Lab 路径还取决于 ISS 能否持续运行到 Haven-1
              完全投入运营。第四，SpaceX / Vast 联合 RFP 为入选研究者免费提供研究准入，能积累善意、拓宽漏斗，但如果市场形成补贴准入预期，未来定价权可能被削弱。第五，竞争格局包括 Axiom
              Space（已签约 ISS 商业舱段，进度更靠前）、Starlab 和 Orbital Reef，它们都瞄准重叠的生命科学和政府客户群；NASA 也对商业 LEO 需求基础是否充足提出过担忧。
