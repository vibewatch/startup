      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              Vast 成本结构由工程劳动力、设施和空间站硬件资本开支主导，这些都是深科技航天项目的典型特征。到 2026 年 3 月，公司员工超过 1,000 人（高于 2025 年 5 月约 800 人、2025 年 7
              月约 950 人），招聘速度约每月 50 人。若按每名员工每年 $150,000–$200,000 的全成本估算（符合南加州航天工程常见水平），仅年度工资负担就约 $150 million–$200
              million。


              设施包括 189,000 sq ft Long Beach 园区（三座仓库）、Mojave 用于大型结构压力测试的测试台，以及任务运营中心。Vast 还使用 NASA 位于 Ohio 州的 Neil
              Armstrong Test Facility 进行系统级环境测试，减少部分资本支出，但会产生项目费用。公司自行加工飞行面板、焊接压力壳，并内部开发生命支持系统；公司称该模式已将主结构制造成本较传统航天项目降低
              10×。约 90% 的 Haven-1 组件由内部制造。


              发射承诺增加离散资本强度：Haven-1 的 Falcon 9 发射和 PAM Dragon 舱运输均与 SpaceX 签有成本承诺。具体金额未披露，但行业标准下，前往 ISS 高度 LEO 的专用 Falcon
              9 拼车发射通常成本为 $60 million–$80 million；Dragon 载人任务合同按 SpaceX Commercial Crew 定价结构，历史上每次任务在 $250 million–$350
              million 区间，不过 Vast 谈判条款未知。


              $200 million 债务部分是唯一公开规模的项目融资元素。其用途表述为扩建设施、扩充团队和推进 Haven-2，并非专门支持 Haven-1
              运营。债务契约、利率和到期日均未公开披露，但该义务带来前一阶段自筹资金时不存在的固定现金服务负担。运营烧钱速度、月度现金流出，以及任何已签活动的毛利率均完全未披露。
