      items:
        - label: 全球微重力研究社群
          value: 100
          description: 全球学术界、生物技术、制药和工业研究人员，均可能受益于微重力准入；包括大学、医院、国家实验室和私营企业
        - label: 知晓 Haven-1 Lab 商业机会
