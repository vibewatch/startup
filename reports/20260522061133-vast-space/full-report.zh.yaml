companyProfile:
  summary: >
    Vast Space（法律实体：Vast, Inc.）是一家总部位于加州 Long Beach 的商业空间站公司，由 Jed McCaleb 于 2021 年创立。公司短期计划围绕 Haven-1
    展开：这是一个单舱、四人商业空间站，宜居体积 45 m³，计划在此前 2026 年中目标延后 3–4 个季度后，于 2027 年 Q1 由 SpaceX Falcon 9 发射。Haven Demo 是在轨技术试验平台，已于
    2025 年 11 月飞行并于 2026 年 2 月离轨，验证了分阶段铺路的策略。Vast 已投入超过 $1 billion 总资本，并在 2026 年 3 月完成 $500 million Series A 轮（$300M 股权
    + $200M 债务）。公司员工超过 1,000 人，是 NASA Commercial Low Earth Orbit Destinations（CLD）Phase 2 竞争的入围方之一，其他入围方包括
    Starlab/Voyager 和 Blue Origin 的 Orbital Reef。Vast 仍处于收入前阶段；尚无空间站投入商业运营。Max Haot 自 2023 年 8 月起担任 CEO。
