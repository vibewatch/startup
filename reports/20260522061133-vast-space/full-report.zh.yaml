      - number: '4.2'
        title: 收入模式与近期商业策略
        blocks:
          - type: paragraph
            body: >-
              截至运行日，Vast 的核心空间站业务最适合描述为收入前开发阶段公司。其收入模式分为三个相互重叠的时间层。


              近期（2027–2028）：主要商业事件是 Vast 首次赴 ISS 私人宇航员任务（PAM），NASA 于 2026 年 2 月 12 日授予，目标不早于 2027 年夏季执行。Haven-1
              上的乘员运营将通过座位销售和研究载荷托管收取任务型费用。公司与 CASIS（ISS National Lab 管理方）有战略协议，可把研究吞吐导入 PAM 任务。PAM 座位定价未披露；可参考 Axiom
              Space 早期 ISS PAM 每座 $55M，意味着 4 座任务可能产生 $150–$220 million 区间的总收入。但 Vast 与负责 Dragon 运输的 SpaceX
              之间实际商业分成未知，NASA 对 PAM 奖项的合同结构也可能封顶或分享该收入。


              中期（2028–2030）：Haven-1 实验室运营、微重力研究服务和后续 PAM 轮次，是主要收入驱动。Haven-2 第一舱目标 2028 年发射。公司能否在这一窗口产生有意义收入，取决于能否赢得 NASA
              CLD Phase 2 有资助 Space Act Agreement（SAA）。NASA 2025 年 8 月 CLD 指令为 FY2026 分配 $272.3 million，并计划五年投入 $2.1
              billion 用于 CLD 开发奖项，预计至少两家、最好三家或更多供应商获得有资助 SAA。NASA 角色转为“锚定服务客户”，而非所有者和运营者。


              长期可选性：CEO Max Haot 在 ASCENDxTexas 会议（2026 年 2 月）表示，内部预测对未来五年 LEO 经济计入的金额“接近零美元”，说明制造、制药和其他 LEO
              商业垂直并未嵌入近期财务计划。2026 年 5 月推出的 Vast Satellite，代表高功率卫星平台这一新公布收入流；首单向一名保密客户出售四台卫星平台，并附有 200
              台追加选择权，但单价和交付时间未披露。该卫星线复用 Haven Demo 衍生子系统和垂直整合制造基础设施。
