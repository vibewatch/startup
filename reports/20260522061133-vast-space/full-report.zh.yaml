              截至 2026 年 1 月 28 日，NASA CLDC 采购已正式暂停。若没有资助型 Space Act Agreement 或最终 CLD 服务合同，Haven-2
              数十亿美元资本需求将完全落在私人市场身上。$4 billion 的 CLD 预算缺口意味着 NASA 最多可能资助一座空间站，迫使 Vast 与 Axiom、Blue Origin 和 Starlab
              直接争夺一个机构席位。
