  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与隐含估值背景
        blocks:
          - type: paragraph
            body: >-
              Vast Space 的资本历史分为两个阶段。2021 年创立至 2026 年初，公司完全由创始人 Jed McCaleb 出资；McCaleb 曾公开承诺最多投入 $1 billion 个人资本。McCaleb
              的承诺，以及 Haven Demo 2025 年 11 月轨道任务之前连续硬件开发的证据，支持一个估算：在 2026 年 3 月机构轮融资前，创始人资本已投入 $700–800 million。


              2026 年 3 月融资——$300 million Series A 股权加 $200 million 债务——是 Vast 第一次机构外部资本事件。股权融资由专注防务和军民两用太空的风险投资机构
              Balerion Space Ventures 领投，跟投方包括 IQT（CIA 关联风险投资机构）、Qatar Investment Authority（QIA）、Mitsui and
              Co.、MUFG、Nikon Corporation 旗下 NFocus Fund、Stellar Ventures、Space Capital 和 Earthrise
              Ventures。按公司自身披露，累计投入资本超过 $1 billion。


              隐含股权估值只锚定一个第三方来源：Forbes 2025 年 12 月文章称 Vast 正在「洽谈」以 $2 billion pre-money 估值融资。如果该 pre-money
              数字在最终交易中保持不变，$300 million 股权注资意味着 post-money 股权估值约为 $2.3 billion。Vast、Balerion 或任何共同投资者都没有正式确认 post-money
              估值。一些二级市场评论提到约 $2.5 billion，但支撑更高数字的佐证很薄。本章所有估值估算都是估算，不是已确认事实。


              $200 million
              债务部分带来固定义务——利息支付、潜在约束条款和到期日程——但条款未披露。这给任何股权价值分析增加了一层不确定性：债务条款会影响自由现金流，约束条款可能压缩运营灵活性；一旦出现困境，债权人清偿顺位高于股权。
