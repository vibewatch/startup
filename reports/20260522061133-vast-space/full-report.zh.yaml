  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：类别、入局者与市场结构
        blocks:
          - type: paragraph
            body: >
              ISS 退役后的商业 LEO 空间站市场，有四类竞争替代方案需要 Vast 应对：（1）由 NASA CLD 计划资助的直接自由飞行商业同行；（2）Axiom Station 先接入
              ISS、再自由飞行的混合模式，它锚定近端过渡；（3）ISS 本身以及任何立法延寿，作为现状替代；（4）中国的 Tiangong，它主要在地缘政治层面对节奏施压，而非直接商业对手。


              三个主要直接竞争对手是 Axiom Space（Houston）、Starlab Space（Voyager Technologies 牵头的合资公司）和 Orbital Reef（Blue Origin 与
              Sierra Space）。四个商业入局者——Axiom、Starlab、Orbital Reef 和 Vast——均参与 NASA CLD 框架，但获得政府资金支持的层级差异显著。Axiom 持有 NASA
              的固定总价、IDIQ 合同，是唯一拥有正式采购关系而非 Space Act Agreement 的玩家。Starlab 和 Orbital Reef 持有 Phase 1 有资助 SAA（分别为 $218M 和
              $130M）。Vast 只有 2023 年通过 CCSC-2 计划获得的无资助 SAA。


              NASA 修订后的 Phase 2 策略（2025 年 8 月指令）要求向至少两家、最好三家或更多供应商授予有资助 SAA。多供应商模式意味着，近期市场并不是围绕 CLD Phase 2 的赢家通吃竞争；但
              FY2026 的 $272.3M 和五年 $2.1B Phase 2 预算有限，供应商优先级排序会产生实质影响。关键在于，Vast 是 Phase 1 CCSC-2 入局者，而非 Phase 1 有资助 SAA
              获得者，因此进入 Phase 2 竞争时没有此前 NASA 里程碑付款；在硬件制造成为门槛的阶段，这是结构性资本劣势。


              现状替代——延长 ISS 寿命——构成有意义的风险。2026 年 3 月，一项将 ISS 运营延长两年至 2032 年的参议院 NASA 授权法案通过参议院商务委员会；若最终生效，商业空间站的紧迫性会下降，并延长
              Axiom 混合模式（舱段接入 ISS）的可行窗口，可能拖慢 Haven-1 所瞄准的过渡时间线。中国政府资助的 Tiangong 自 2022
              年以来持续有人值守，提供地缘政治背景，但不是西方商业航天用户的商业替代。
