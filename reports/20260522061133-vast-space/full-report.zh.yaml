      - number: '6.2'
        title: Haven-1 Lab 载荷伙伴与商业管线
        blocks:
          - type: paragraph
            body: >
              Haven-1 Lab 是 Haven-1 前部舱段中的商业微重力研究、制造和开发平台。截至 runDate，Vast 已公开点名五家载荷伙伴，它们已预留实验室 MLE 载荷位容量。每个载荷位最多提供 100 W
              电力，并可通过机载 SpaceX Starlink 激光终端远程指令控制，研究人员因此可在日常科学运行中监控和操作实验，无需乘组成员介入。

              Redwire Space 带来 ADSEP4，这是一套自动化药物悬浮系统，延续了 Redwire 此前在 ISS 上的生物反应器和药物结晶载荷工作。德国微重力服务公司 Yuri 已为 4 大洲 61
              名客户飞行过 151 个太空实验室，这次提供 ScienceTaxi——一种模块化卡匣系统，可在单个 MLE 占位内承载多名研究者。JAMSS（Japan Manned Space Systems
              Corporation）是 Haven-1「亚洲首家载荷伙伴」，提供一套面向日本制药和材料公司的多用途载荷。Interstellar Lab 提供 Eden
              1.0，这是一套受控环境植物生长舱，瞄准天体生物学和食品科技应用。Exobiosphere 提供 Orbital High-Throughput Screening（OHTS）平台，并于 2026 年 4 月获得
              Cedars-Sinai 研究合作。

              Vast 在 2025 年 4 月表示 Haven-1 Lab「接近满载」，意味着 8 个 MLE 载荷位中的大部分已被承诺。SpaceX / Vast 联合 RFP
              通过竞争筛选，为入选研究者免费提供研究准入，把可触达漏斗扩展到商业研究预算之外的伙伴。
