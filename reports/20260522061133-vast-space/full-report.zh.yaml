        - 竞争对手率先入轨；Haven Demo 结果被证明不足以支持认证
      - - 正方：资本充足
        - 2026 年 3 月 $500M 融资按估算烧钱速度可支撑 24–36 个月，覆盖 Haven-1 发射和 PAM 任务
        - 估算烧钱速度 $15–25M/月；交割后可用现金 $400–600M
        - 烧钱加速、债务契约触发，或 CLD 第 2 阶段落选迫使公司在现金续航期耗尽前启动过桥融资
      - - 正方：NASA 关系深度
        - NASA STMD 协议、Armstrong Test Facility 使用权和 PAM 合同，显示 NASA 深度背书 Vast 计划
        - 已确认的 NASA 协议和 PAM 合同（2026 年 2 月）
        - NASA 优先支持竞争对手，或 ISS 延寿彻底消除 PAM 需求
      - - 正方：战略投资人财团
        - IQT、QIA、Mitsui、MUFG、Nikon 等投资人具备战略耐心，且与国家利益对齐，可降低近期清算压力
        - 2026 年 3 月融资轮投资人公告见 BusinessWire
        - 战略投资人退出，或以不利条款阻断后续融资
      - - 反方：收入前估值偏高
        - 零收入公司隐含 EV 约 $2.3B，既要 CLD 第 2 阶段胜出，也要商业化跑通；但 CEO 自己的模型显示未来五年商业收入接近零
        - Forbes 2025 年 12 月投前估值报道；CEO 2026 年 2 月 ASCENDxTexas 发言
        - 赢得 CLD 第 2 阶段；PAM 任务证明收入；公布商业预订
      - - 反方：CLD 第 2 阶段二元风险
        - 单个政府授标决定 Haven-2 计划能否获得规模化资金；没有规模相当的清晰后备收入流
        - NASA CLD 指令（2025 年 8 月）；竞争者包括 Axiom 和 Starlab
        - Vast 获得第 2 阶段授标，或赢得战略价值相当的第 1 阶段临时延展
      - - 反方：债务负担与稀释
        - $200M 未披露债务义务叠加 Haven-2 还需 $1–2B 资本，给现有投资者带来持续稀释和契约风险
        - 2026 年 3 月 BusinessWire 公告；资本强度估算
        - 披露出的债务条款有利；Haven-2 通过政府 SAA 获资，且不再稀释股权
      - - 反方：SpaceX 依赖
