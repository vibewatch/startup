      - number: '2.3'
        title: 供给约束与市场塑造瓶颈
        blocks:
          - type: paragraph
            body: >
              商业 LEO 空间站市场面临一组结构性供给侧约束，卡住资本形成，也卡住首笔收入的时间线。


              赔偿和保险是最迫近的融资瓶颈。现有 Commercial Space Launch Act 风险分担框架只覆盖发射和再入；该框架从未延伸到在轨运营，NASA 也从未为其承包商实际启用。CLD 开发商已直接向
              NASA Space Operations Mission Directorate
              报告，称拟议空间站难以获得足额保险。没有政府赔偿兜底，一次灾难性空间站故障可能让运营商承担超过商业保险市场容量的责任；这会同时劝退股权投资者和贷款方。需要国会行动，或行政部门动用 Public Law
              85-804 授权，但截至 2026 年 5 月尚无法案通过。


              任务授权同样未解决。美国没有单一机构有权监管商业空间站运营：FAA 管发射，FCC 管频谱，NOAA 管遥感，但在轨居住落在监管空白中，也与美国在 Outer Space Treaty 下的义务不一致。FCC
              2025 年 10 月 NPRM（Part 100 框架）处理了许可生态的狭窄部分，却没有建立完整任务授权。2025 年 White House 行政令把临时权限分配给 Department of
              Commerce，但 Commerce、NASA、FCC 和 FAA 之间的跨机构协调尚未产出运营指引。


              时间线风险会放大上述两项约束。ISS 计划 2030 年退役，而商业空间站尚无一座投入运营，“LEO gap”——美国在轨没有载人存在的一段间隔——风险已经实质化。俄罗斯只承诺参与 ISS 至 2028
              年。中国的 Tiangong 自 2022 年以来一直有人值守。若出现断档，美国会同时让出战略领导力和持续研究管线。相比之下，发射节奏是赋能因素而非约束因素：SpaceX 每年约 170
              次发射，为按当前价格点服务空间站提供足够物流骨架；但对 SpaceX 的单一来源依赖仍是集中风险。
