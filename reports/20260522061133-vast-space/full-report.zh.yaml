        - 集成阶段问题若导致进度滑坡，会压缩甚至抹掉先发窗口；Axiom Hab One 将于 2026 发射到 ISS，“首个商业空间站”头衔存在争议
        - 高
        - 跟踪集成阶段里程碑节奏；确认 Haven-1 CDR 完成日期；监测 Axiom Hab One 模块发射状态
      - - 唯一已飞行、运营并离轨空间站试验平台（Haven Demo）的公司
        - 亚尺度试验平台的运营经验不等同于 ISS 运营经验；客户可能要求 ISS 乘组运营传承，而目前只有 Axiom 证明过
        - 中
        - 核实 NASA CLD Phase 2 评估标准是否重视 ISS 运营传承；评估 Haven Demo 数据能否满足 Phase 2 关键技术里程碑
      - - SpaceX 战略协同（Falcon 9、Dragon、Starlink）
        - SpaceX 控制定价、发射排期优先级和乘组通道；SpaceX 同时是潜在竞品（基于 Starship 的空间站能力），也是 Haven-1 唯一发射提供方
        - 高
        - 要求发射定价和排期承诺的合同保护；评估 SpaceX 商业空间站野心
      - - 垂直整合制造（90% 内部完成，声称成本降低 10x）
        - 成本优势由公司声称，尚未独立验证；传统航天基准未发布，无法对比
        - 中
        - 要求提供每公斤成本或 $/m³ 可居住体积与 ISS 类比项的对比；核实内部完成 vs. 分包比例
      - - NASA 未获资助 SAA：迈向 CLD Phase 2 的第一步
        - 未获资助 SAA 不保证资金，也不保证 Phase 2 优先级；Axiom 和 Starlab 带着 NASA 监督下已证明的里程碑执行记录进入 Phase 2 竞争， 拥有 Vast 缺少的评估信誉
        - 高
        - 跟踪 Phase 2 AFP 发布和资格标准；确认 CCSC-2 SAA 是否提供任何评估偏好
      - - 多客户主权需求（ESA MOU、潜在机构任务）
        - 与 ESA 的 MoU 无约束力；尚无确认的 ESA 任务采购订单；Starlab 与 Airbus 的合作比 Vast 的 MOU 提供更强欧洲工业入口
        - 中
        - 跟踪 ESA 对 CLD 任务的预算分配；核实 ESA MOU 是否推进到任务协议
      - - 单一来源 Jed McCaleb 资本依赖
        - 如果 CLD Phase 2 资金到位前 McCaleb 调整资金支持姿态，Vast 这个资本密集项目会出现资金缺口
        - 高
        - 评估 Series A 后董事会治理和投资人团深度；通过 Board Chair 角色和投资人沟通确认 McCaleb 持续承诺
    notes: 严重性评级是基于已收集证据的定性判断。高 = 可能在 12-24 个月内实质削弱 Vast 竞争地位。中 = 重要但可管理。 护城河主张来自 Vast 公开定位；威胁来自竞品证据和反向来源。
