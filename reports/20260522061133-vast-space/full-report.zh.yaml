      - number: '3.2'
        title: 竞争者画像：Axiom Space、Starlab 与 Orbital Reef
        blocks:
          - type: paragraph
            body: >
              **Axiom Space** 截至 2026 年 5 月在 CLD 版图中处于最强竞争位置。其 NASA 固定总价 IDIQ 合同是采购工具而非 SAA，相比任何竞争者，都带来更持久的政府收入，也让 NASA
              资金和设计接受节奏更可见。Axiom 已向 ISS 执行四次私人宇航员任务（AX-1 至 AX-4），搭载 12 名付费客户和 166 个收入载荷，建立了其他 CLD
              入局者无法匹配的端到端商业载人航天记录。Axiom 调整了组装顺序，以加速自由飞行能力：Payload, Power and Thermal Module（PPTM）将率先发射，使 Axiom Station
              最早可在 2028 年脱离 ISS 并作为自由飞行目的地运营，之后再加入 Hab 1、气闸舱、Hab 2 和 Research and Manufacturing Facility。Thales Alenia
              Space 正在制造舱段；截至 2026 年 5 月访问的 axiomsspace.com 更新，主结构正在焊接和机加工，关键设计评审已于 2024 年完成。Axiom 的主要限制是时间线风险：运营能力计划在
              2028 年，落后 Haven-1 2027 年 Q1 目标 12–18 个月；其分阶段 ISS 接入策略还带有离轨过渡复杂性。


              **Starlab Space** 是一家美国主导的合资公司，截至 2025 年底的所有权结构包括 Voyager Technologies（61.9%）、Airbus、Mitsubishi
              Corporation（2024 年 4 月加入）、MDA Space（2024 年 5 月加入）以及企业软件合作伙伴 Palantir（2024 年 6 月加入）。Starlab 从 NASA 获得 $218M
              Phase 1 有资助 SAA（其中 $183M 截至 2026 年 3 月已拨付），目标在 2029 年由 SpaceX Starship 单次发射部署。其初步设计评审和安全评审已经完成；详细设计和 CDR
              是下一道门槛。一个全尺寸、高保真空间站模型正在 NASA Johnson Space Center Space Vehicle Mockup Facility 建造。商业需求信号在同行中最强：截至 2026 年
              3 月，Starlab 的商业载荷容量已全部订满，包括 Yuri 锁定第一整年商业运营，形成 $6M 订单积压。Northrop Grumman 提供 Cygnus 货运物流，Hilton
              负责设计乘员舱。Voyager 10-K 披露的 $90M Starship 发射合同定价具有竞争力，但代表对 SpaceX 的单一来源集中，这一点与 Vast 共享。Voyager Technologies
              是上市公司（VOYG），2026 年 5 月市值约 $2.37B，为该合资公司的母体提供了部分资本市场参照，但不能直接视为空间站估值。


              **Orbital Reef**（Blue Origin 作为项目牵头方，Sierra Space 作为主要商业伙伴）已完成 Phase 1 有资助 SAA
              里程碑，包括人在环测试；参与者在乘员舱、餐区、实验室和停泊区的全尺寸模型中评估日常运营。ESA 于 2025 年 6 月与 Blue Origin 和 Thales Alenia Space 签署
              MOU，围绕潜在欧洲载荷托管和载人任务合作，这与 Vast 持有的 ESA MOU 相呼应。Sierra Space 另于 2026 年 3 月完成 $550M Series C，估值 $8B，使 2021
              年以来总资本达到 $2B，并明显转向防务（Sierra Space Defense 部门、SDA Tranche 2 卫星结构合同）。自 2024 年底以来，Orbital Reef 的公开里程碑节奏低于
              Axiom 或 Starlab；截至 2026 年 5 月未公开宣布 CDR 完成。Boeing 仍是合作伙伴，但没有公开披露任何重要 Boeing 空间站硬件里程碑。
