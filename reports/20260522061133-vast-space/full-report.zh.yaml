      - number: '2.2'
        title: 需求拆分：政府、研究、制造与邻近收入
        blocks:
          - type: paragraph
            body: >
              商业 LEO 空间站市场的需求来自四大板块，各自预算归属、采购周期和价格敏感度都不同。


              主权国家和机构任务，是近期收入中最被验证的一类。国际航天机构和国家计划——包括已与 Vast 签署 MOU 的 ESA、通过 JAMSS 参与的 JAXA，以及其他伙伴国家——持续展现出为载人 LEO
              设施访问付费的意愿。Axiom Space 已执行四次赴 ISS 私人宇航员任务，搭载 12 名付费客户和 166
              个收入载荷，在已展示价格点上验证了这一需求类别。主权宇航员板块带来可预订、近端收入，不依赖未经验证的商业终端市场。


              微重力 R&D 和制药制造构成第二个需求支柱。Haven-1 Lab 提供 10 个 Middeck Locker Equivalent 载荷槽位，每个槽位配备 100W 连续功率、Gigabit/s
              Starlink 连接和样本返回能力。首批合作方 Redwire（药物结晶、生物制造）和 Yuri（生命科学孵化器）都是既有 ISS
              生态参与者，正在延伸到商业平台。邻近兴趣覆盖半导体材料、先进涂层和生物科技领域。限制速度的因素是载荷开发成本，以及真正具备太空独特性的制造市场规模仍然很小。


              防务和国家安全是一类增长中的需求来源，但大多未披露。DoD 对 LEO
              基础设施的军民两用兴趣——涵盖侦察、高超音速测试和通信——可能大幅扩大可服务市场，但合同工具和保密限制压低了公开证据。邻近的卫星平台收入（Vast 于 2026 年 5
              月宣布转向高功率卫星平台）提供潜在的非载人收入缓冲，部分降低空间站商业模式风险。The Exploration Company 已签约为 Haven-2 提供货运服务，说明供应链需求正在早期形成。
