      - number: '4.4'
        title: 流动性、现金跑道与融资风险
        blocks:
          - type: paragraph
            body: >-
              Vast 尚未披露账上现金、月度 burn rate、runway 或任何近期收入数字。结合融资证据和成本估算，2026 年 3 月融资后，公司很可能还有 $400–$600 million
              的现金与授信余量（总投入资本 >$1 billion，扣除估算累计支出后得到的残余估计），但这只是粗略测算，不确定性很大。


              核心融资风险是双边且结构性的：Vast 的整个开发项目都押在能否拿下 NASA CLD Phase 2 资助型 SAA 上。若拿不到该奖项，Haven-2 运营缺少清晰的长期收入路径；公司也公开预计未来五年商业
              LEO 经济贡献「接近零」，NASA 因而几乎成为唯一的机构收入来源。2025 年 8 月的 NASA 指令确认 FY2026 预算为 $272.3 million，五年承诺为 $2.1
              billion——相对竞争格局所暗示的多站开发成本明显偏小——且付款按里程碑拨付，至少 25% 取决于一次成功的在轨载人演示。


              次级风险在于 $200 million 债务部分带来约束条款和到期义务，但具体条款未披露。若 CLD 奖项延迟或落空，目前看不到可比规模的过桥融资机制或兜底收入流。Beyond Earth Institute
              2026 年 3 月报告提示，赔偿安排不确定、任务授权制度尚未明确，可能「威胁投资者信心」并影响项目连续性——这直接关系到 Vast 的融资风险画像。


              第三项风险是 ISS 延寿争议。2026 年 3 月参议院商务委员会的授权法案草案提议将 ISS 寿命延至 2032 年，这会推迟商业空间站服务采购时间线，并相应延后 Vast 来自 Haven-1 和
              Haven-2 运营的首笔锚定客户收入。任何进一步延迟都会在 runway 有限的情况下继续放大现金消耗。


              上行对冲来自 Vast Satellite 产品线（2026 年 5 月推出）以及未来 DoD / 国家安全任务，代表早期的收入多元化。首个卫星销售订单和 200
              颗期权具备商业潜力，但仍处于收入落地前阶段；制造爬坡和交付节奏尚未建立。
