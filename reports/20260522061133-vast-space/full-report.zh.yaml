      - number: '5.3'
        title: 垂直整合、制造与测试
        blocks:
          - type: paragraph
            body: >
              Vast 的制造策略围绕其 California Long Beach 总部的垂直整合展开；大型环境测试放在 California Mojave 场地，系统级环境测试计划在 Ohio Sandusky 的
              NASA Neil Armstrong Test Facility（NTF）进行。这一做法消除了许多供应商接口，让 Vast 直接控制进度；管理层称，相比传统空间站项目，主结构制造成本已降低 10×。

              Haven-1 主结构采用铝材。团队最初基线是不锈钢，但 2023 年 11 月至 2024 年 3 月的并行制造和权衡研究显示，不锈钢带来制造挑战，于是改用铝材。第一件铝制件是 Pathfinder，制造期从
              2023 年 11 月到 2024 年 6 月，建立了工装、团队和关键接口。随后是完整合格件：2024 年 7 月开始铣削，2024 年 12 月完成焊接，2025 年 1 月 31 日在 Vast Mojave
              设施接受 NASA-STD-5001 证明压力测试。结构加压到 1.8 barD（26 psig）并保持五小时；所有应变计均在规格内，泄漏率相对 1.2 scc/min
              要求不可辨识，测试一次通过。从零铝制工作到完成证明压力测试，耗时 15 个月。

              可飞行主结构随后于 2025 年 1 月启动，2025 年 7 月完成，并在 2025 年底于 Mojave 完成飞行验收压力测试。被动对接适配器于 2025 年 10 月安装，并与 Dragon
              硬件完成适配检查。Phase 1 集成于 2026 年 1 月在 Long Beach 洁净室启动：安装加压流体系统，包括热控回路、生命保障管路、推进管、组件托盘和储罐，并开展压力、泄漏和功能测试。Phase 2
              将安装航电、GNC 系统和空气再生硬件。Phase 3 完成空间站，包括乘组居住、内饰收尾、外部 MMOD 防护、散热器和太阳翼集成。

              2025 年 4 月 3 日签署的 Neil Armstrong Test Facility 协议，使 Vast 可使用 Space Environments
              Complex，对完整的可飞行空间站开展声学、振动、电磁干扰和热真空测试，计划时间为 2026 年。痕量污染物控制系统测试已另行在 NASA Marshall Space Flight Center
              完成，依据可报销 Space Act Agreement，使用的环境舱正是此前 ISS ECLSS 测试用过的同一设备。Haven-1 当前目标发射就绪时间为 2027 年 Q1，相比早前 2026 年 Q1
              的目标有所后移，反映集成工作成熟后的进度重排。
