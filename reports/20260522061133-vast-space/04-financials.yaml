      - TI005
    figureRefs: []

callouts:
  - calloutType: risk
    title: Pre-Revenue with Deep Capital Dependency
    body: >-
      Vast remains fully pre-revenue in its space-station business. The entire near-term financial
      plan depends on winning NASA CLD Phase 2 and executing Haven-1/Haven-2 on schedule. CEO Max
      Haot's public statement that internal projections show "close to zero" LEO commercial revenue
      for five years underlines the depth of NASA dependency and the risk of any programme delay
      or funding shortfall.
    claimRefs:
      - CI014
      - CI027
      - CI028

  - calloutType: strength
    title: Diversified Institutional Investor Syndicate
    body: >-
      The March 2026 round assembled a notably diversified cap table: sovereign wealth (QIA),
      Japanese industrial strategics (Mitsui, MUFG), intelligence-community venture (IQT),
      technology strategics (Nikon), and specialist space funds (Balerion, Space Capital,
      Earthrise). This breadth reduces single-investor dependency and signals wide institutional
      validation of the space-station business case.
    claimRefs:
      - CI003
      - CI004
      - CI005

  - calloutType: assumption
    title: Valuation Estimate Caveats
    body: >-
      The ~$2 billion pre-money valuation is based on December 2025 Forbes reporting ahead of
      the round's close; no party has officially confirmed the final post-money figure. The
      $200 million debt component is excluded from equity valuation arithmetic. All financial
      estimates for burn rate, launch costs, and revenue projections are analyst approximations
      from publicly available benchmarks—none are Vast-disclosed figures.
    claimRefs:
      - CI006
      - CI007
      - CI034

