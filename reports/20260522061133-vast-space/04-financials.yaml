  - id: TI005
    title: Public Financial Gaps
    columns:
      - Missing Metric
      - Why It Matters
      - Impact on Analysis
      - Diligence Path
    rows:
      - - Revenue (any)
        - No revenue reported in space-station or satellite business
        - Cannot assess revenue quality, growth trajectory, or burn coverage
        - Request management accounts; confirm first revenue event and date
      - - Monthly burn rate
        - Core input to runway and financing-risk analysis
        - Runway estimate is a rough analyst derivation with ±50% uncertainty
        - Request CFO burn-rate memo or audited P&L
      - - Gross margin
        - Differentiates station-operations from development economics
        - No basis to project path to profitability
        - Request any contracted deliverable cost sheet
      - - Debt terms and covenants
        - $200M debt obligation with unknown maturity and covenant package
        - Covenant breach risk and maturity wall are unquantifiable
        - Request loan agreement summary or credit rating disclosure
      - - Cap table / preference stack
        - Series A preferences determine return waterfall
        - Cannot model investor returns or dilution scenarios
