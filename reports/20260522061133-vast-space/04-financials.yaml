      - - Customer prepayments / deposits
        - PAM seat deposits or satellite pre-payments would signal demand quality
        - Revenue-recognition and working-capital profile unknown
        - Confirm payment schedule for Vast Satellite 4-unit order and PAM seats
      - - Launch contract values
        - Falcon 9 and Dragon contracts are discrete capex commitments
        - Launch cost unknown; affects runway calculation materially
        - Request SpaceX launch contract principal amounts
      - - Cash on hand (post-raise)
        - $500M raise minus deployment; residual unknown
        - Runway estimate depends entirely on this figure
        - Request bank statement or auditor confirmation of cash position
      - - Haven-2 total development cost estimate
        - Multi-module ISS successor; total capex commitment is unknown
        - Determines capital gap to full operational capability
        - Request Haven-2 programme budget from investor data room
