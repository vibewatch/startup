  - id: cost-structure-capital-intensity
    title: Cost Structure and Capital Intensity
    body: >-
      Vast's cost structure is dominated by engineering labour, facilities, and capital
      expenditure for space-station hardware—all characteristic of a deep-technology aerospace
      programme. With more than 1,000 employees by March 2026 (up from ~800 in May 2025 and ~950
      in July 2025), the company has been hiring at roughly 50 people per month. Assuming an
      average fully loaded cost of $150,000–$200,000 per employee-year (typical for aerospace
      engineering in Southern California), the annual wage burden alone is approximately
      $150 million–$200 million.


      Facilities include the 189,000 sq ft Long Beach campus (three warehouses), a testing stand
      in Mojave for large-structure pressure testing, and a mission operations centre. Vast also
      uses NASA's Neil Armstrong Test Facility in Ohio for system-level environmental testing,
      reducing some capital outlay but incurring programme fees. The company machines its own
      flight panels, welds pressure hulls, and develops life support systems in-house, a model
      it reports has achieved 10× reduction in primary structure manufacturing costs versus
      traditional space programmes. About 90% of Haven-1 components are manufactured in-house.


      Launch commitments add discrete capital intensity: Haven-1's Falcon 9 launch and the
      PAM Dragon capsule ride carry contracted costs with SpaceX. These are undisclosed but
      industry-standard Falcon 9 rideshare to ISS-altitude LEO typically costs
      $60 million–$80 million for a dedicated launch; the Dragon crew mission contract, structured
      under SpaceX's Commercial Crew pricing, has historically been in the $250 million–$350 million
      range per mission, though Vast's negotiated terms are unknown.


      The $200 million debt tranche is the only project-finance element with a public size.
      Its purpose is stated as expanding facilities, growing the team, and advancing Haven-2,
      not Haven-1 operations specifically. Debt covenants, interest rates, and maturity are not
      publicly disclosed, but the obligation introduces a fixed cash-service burden absent in the
      prior self-funded phase. Operational burn rate, monthly cash outflow, and gross margin on
      any contracted activities are entirely undisclosed.
