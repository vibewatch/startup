  - id: liquidity-runway-financing-risks
    title: Liquidity, Runway, and Financing Risks
    body: >-
      Vast has not disclosed cash on hand, monthly burn rate, runway, or any near-term
      revenue figure. Based on the funding evidence and cost estimates, the company likely has
      $400–$600 million in cash and credit headroom following the March 2026 round (total
      capital deployed >$1 billion against estimated cumulative spend, leaving a residual
      estimate), though this is an approximation with wide uncertainty.


      The key financing risk is bilateral and structural: Vast's entire development programme
      is contingent on winning NASA's CLD Phase 2 funded SAA. Without that award, there is no
      clear path to long-term revenue from Haven-2 operations, and the company's stated near-zero
      contribution from the commercial LEO economy in the next five years leaves NASA as the
      effectively sole institutional revenue source. The August 2025 NASA directive confirmed
      an FY2026 budget of $272.3 million and a five-year commitment of $2.1 billion—meaningfully
      smaller than the multi-station development costs implied by the competitive landscape—and
      payments are milestone-gated with at least 25% contingent on a successful in-space crewed
      demonstration.


      Secondary risk: the $200 million debt component introduces covenants and maturity obligations
      whose terms are undisclosed. If the CLD award is delayed or lost, there is no identified
      bridge-financing mechanism or fallback revenue stream of comparable scale. The Beyond Earth
      Institute's March 2026 report flagged indemnification uncertainty and the absence of a
      defined mission-authorization regime as risks that could "threaten investor confidence" and
      programme continuity—directly relevant to Vast's financing risk profile.


      Third risk: the ISS extension debate. The March 2026 Senate Commerce Committee draft
      authorization bill proposed extending ISS life to 2032, which would push out the
      commercial-station service procurement timeline and correspondingly delay Vast's first
      anchor-customer revenue from Haven-1 and Haven-2 operations. Any further delays compound
      cash burn against a finite runway.


      Upside hedge: the Vast Satellite line (launched May 2026) and future DoD/national-security
      missions represent nascent revenue diversification. The first satellite sale and the 200-unit
      option are commercially promising but pre-revenue; manufacturing scale-up and delivery
      timelines are not yet established.
    claimRefs:
      - CI027
      - CI028
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
