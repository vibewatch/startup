  - id: funding-investors
    title: "Funding History, Valuation, and Investor Map"
    body: >-
      Vast was funded almost entirely by Jed McCaleb's personal capital from its 2021 founding
      through late 2024. The first publicly confirmed external institutional investment came in
      October 2024 when IQT (In-Q-Tel, the CIA's venture capital arm) invested an undisclosed
      amount and took a board observer seat, signaling national-security alignment. The company's
      first major formal external round closed on March 5, 2026: $500 million in total, structured
      as $300 million in Series A equity and $200 million in debt. The equity round was led by
      Balerion Space Ventures and included IQT, Qatar Investment Authority (QIA), Mitsui & Co.,
      MUFG, Nikon Corporation (via the NFocus Fund with Geodesic Capital), Stellar Ventures, Space
      Capital, and Earthrise Ventures, plus Jed McCaleb participating again as founder and first
      investor. A.C. Charania of Balerion, a former NASA Chief Technologist, joined Vast's board
      as part of the transaction.

      Total capital invested in Vast's space station technologies and facilities exceeds $1 billion
      as of March 2026. Forbes reported in December 2025 that Vast was in talks for a $2 billion
      valuation as the round was being structured; Vast did not publicly confirm the final valuation.
      Revenue, ARR, and customer count are not publicly disclosed; the company is pre-revenue since
      no station has yet been operated commercially. The $200 million debt component creates a
      fixed-cost obligation ahead of any revenue generation, increasing financial risk if Haven-1's
      launch or customer acquisition is delayed.
