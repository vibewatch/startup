company:
  name: "Vast Space"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Vast Space is a Long Beach, California-based commercial space station company founded in 2021
    by cryptocurrency entrepreneur Jed McCaleb that has raised over $1 billion in total capital—including
    a $500 million Series A in March 2026 led by Balerion Space Ventures—and is actively integrating
    Haven-1, targeting a Q1 2027 SpaceX Falcon 9 launch as the world's first commercial space station,
    while competing for NASA's CLD Phase 2 contract to build Haven-2 as the ISS successor; the company
    remains pre-revenue and faces credible headwinds from NASA's own stated skepticism about near-term
    commercial LEO market demand.

sections:
  - id: identity-mission-product
    title: "Identity, Mission, and Product Portfolio"
    body: >-
      Vast Space (legal entity: Vast, Inc.) was founded in 2021 by Jed McCaleb in California, originally
      targeting artificial-gravity space stations for long-term human habitation. By 2025–2026 the strategy
      evolved into a hardware-rich stepping-stone model: Haven Demo—an in-orbit technology testbed—launched
      November 2, 2025, completed 49 test objectives, and was deorbited February 4, 2026, making Vast the
      only commercial entity to have flown, operated, and deorbited a purpose-built space station testbed.
      Haven-1 is a single-module, four-crew commercial space station with 45 m³ habitable volume, 80 m³
      pressurized volume, 13,200 W of power, and a SpaceX Starlink Gigabit/s laser terminal; it entered
      integration at Vast's Long Beach headquarters on January 20, 2026, with a target launch date of
      Q1 2027 on a SpaceX Falcon 9 from Cape Canaveral. Haven-2 is Vast's proposed multi-module ISS
      successor competing for NASA's Commercial LEO Destinations (CLD) Phase 2 contract, with first
      module targeted for orbit by 2028 and full configuration by 2032.

      The company is headquartered on a 189,000 square-foot campus near Long Beach Airport in California,
      with a secondary office in Houston, Texas, near NASA's Johnson Space Center. Vast employs more than
      1,000 people and operates a vertically integrated manufacturing model with approximately 90% of
      components built in-house—a model the company claims has delivered a 10× reduction in primary
      structure manufacturing costs versus traditional space station programs. On May 19, 2026, Vast
      announced Vast Satellite, a 15 kW-class satellite bus product line leveraging Haven Demo heritage,
      with an initial confirmed sale of four units and an option for 200 more, marking the first step
      toward revenue diversification beyond station services.
