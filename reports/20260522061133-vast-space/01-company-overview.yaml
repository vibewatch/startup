callouts:
  - calloutType: "strength"
    title: "Only Commercial Entity to Fly and Operate Its Own Space Station Testbed"
    body: >-
      Haven Demo's November 2025 mission success—completing all 49 test objectives over three months
      in orbit—established Vast as the only company to have designed, manufactured, flown, operated,
      and deorbited a purpose-built commercial space station testbed. This hardware flight heritage
      directly de-risks Haven-1 and differentiates Vast from competitors whose stations exist only
      on paper.
    claimRefs:
      - CO008
      - CO009

  - calloutType: "risk"
    title: "NASA Market Skepticism Threatens CLD Phase 2 Scope and Timeline"
    body: >-
      At the April 2026 Space Symposium, NASA officials publicly stated the commercial LEO market
      has not yet emerged and that NASA lacks budget to fund multiple full station concepts under CLD.
      The Beyond Earth Institute separately flagged regulatory uncertainty and a potential ISS-to-CLD
      transition gap. Vast's entire Haven-2 business model depends on NASA serving as anchor customer,
      and a reduced or delayed CLD Phase 2 award could strand the $200M debt obligation incurred in
      March 2026 well before any station generates revenue.
    claimRefs:
      - CO041
      - CO042
      - CO027

  - calloutType: "risk"
    title: "Pre-Revenue Status with Jed McCaleb Key-Person Financial Dependency"
    body: >-
      Vast remains pre-revenue with no station operational and no disclosed commercial contracts
      generating income. The primary funding source through 2025 was Jed McCaleb's personal
      wealth—estimated at up to $1 billion commitment. While the March 2026 Series A diversifies
      the capital base, McCaleb's ongoing participation and continued financial support are material
      to bridge financing until Haven-1 begins generating revenue, expected no earlier than late 2027.
    claimRefs:
      - CO019
      - CO026
      - CO027
      - CO020

