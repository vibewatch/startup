  - id: milestones-traction
    title: "Milestones, Traction, and Adverse Events"
    body: >-
      Vast's five-year development arc has progressed from a stealth startup to a hardware-testing
      organization with a credible ISS-succession bid. Founded in 2021, Vast went public in September
      2022 at World Satellite Business Week, initially emphasizing artificial-gravity ambitions. In
      early 2023 the company relocated its HQ to Long Beach and acquired Launcher, adding spacecraft
      technology and approximately 120 employees including Max Haot (then Launcher's CEO) as President.
      In May 2023, Vast secured a partnership with SpaceX for Falcon 9 launch of Haven-1 and two
      subsequent Dragon crewed missions.

      In 2024 the company signed an ESA MOU (June), announced Starlink integration for Haven-1
      (April), unveiled Haven-2 at the 75th IAC in Milan (October), and in December formalized a
      deal with SpaceX for two Dragon PAM missions to the ISS. Haven Demo's November 2025 mission
      success—completing 49 objectives in orbit over three months—was the landmark hardware milestone
      validating the stepping-stone strategy. Haven-1 integration began January 20, 2026; Vast
      simultaneously updated the launch target to Q1 2027, a 3–4 quarter slip from its prior 2026
      goal. NASA awarded Vast the 6th Private Astronaut Mission (PAM-6) in February 2026, confirming
      it as a credible human spaceflight operator.

      The adverse marker is clear: at the April 2026 Space Symposium, NASA officials stated that a
      viable commercial LEO market had not yet emerged, and that NASA lacks budget to fund multiple
      full station concepts, signaling potential CLD Phase 2 scope reduction. The Beyond Earth
      Institute's March 2026 report separately identified regulatory uncertainty, absence of on-orbit
      indemnification policy, and a potential LEO station gap as structural risks to the CLD program.
      These headwinds are material to Vast's business model, which depends on NASA serving as anchor
      customer for Haven-2.
