  - id: "market-sizing-and-evidence-gaps"
    title: "Market Sizing: Evidence Base, Confirmed Spend, and Analytical Gaps"
    body: |
      Market sizing in the commercial LEO station sector is complicated by the absence of a clean addressable-market boundary. Analyst reports on the "LEO satellite market" (ranging from $8.9B to $15.7B in 2026 and projected at $30B–$62B by 2035) conflate satellite communications constellations—Starlink, OneWeb, Project Kuiper—with the far smaller crewed station services market. These broad estimates are not directly actionable as a TAM for Vast or any other CLD competitor.

      The most defensible near-term sizing anchor is confirmed government procurement: NASA's $2.1 billion five-year CLD budget, split across 2–3+ Phase 2 SAA recipients, represents the only contracted anchor spend. Voyager Technologies disclosed receiving $217 million through its NASA SAA for Starlab, providing a benchmark for Phase 2 award scale. Prior Phase 1 awards totaled $416 million across three teams ($160M Nanoracks/Voyager, $130M Blue Origin, $125.6M Northrop Grumman). The confirmed sovereign-astronaut market is validated by Axiom's four ISS missions; pricing and margins on commercial crew missions are not publicly disclosed.

      No independent bottom-up TAM estimate for the crewed station services market—distinct from the broader LEO economy—was identified in the research base. Analyst coverage is dominated by broad market aggregators with limited methodology disclosure and low reputationTier publishers. The investable market for commercial station services remains speculative at scales beyond confirmed government anchor procurement. This represents a material evidence gap for diligence.
