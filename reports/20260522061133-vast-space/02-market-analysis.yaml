  - id: "supply-constraints-and-bottlenecks"
    title: "Supply Constraints and Market-Shaping Bottlenecks"
    body: |
      The commercial LEO station market faces a set of structural supply-side constraints that gate both capital formation and the timeline to first revenue.

      Indemnification and insurance represent the most immediate financing bottleneck. The existing Commercial Space Launch Act risk-sharing framework covers only launch and reentry; it has never been extended to on-orbit operations and has never been exercised by NASA for its contractors. CLD developers have directly reported to NASA's Space Operations Mission Directorate that they face difficulty obtaining adequate insurance for proposed stations. Without a government indemnification backstop, a catastrophic station failure could expose operators to liabilities exceeding commercial insurance market capacity—a risk that deters both equity investors and lenders. Congressional action or executive use of Public Law 85-804 authority is required, but no legislation has passed as of May 2026.

      Mission authorization is equally unresolved. No single U.S. agency has authority to oversee commercial space station operations—the FAA covers launches, the FCC manages spectrum, and NOAA handles remote sensing, but on-orbit habitation falls in a regulatory gap inconsistent with U.S. obligations under the Outer Space Treaty. The FCC's October 2025 NPRM (Part 100 framework) addresses narrow portions of the licensing ecosystem but does not create comprehensive mission authorization. A 2025 White House executive order assigned interim authority to the Department of Commerce, but interagency coordination between Commerce, NASA, FCC, and FAA has yet to produce operational guidance.

      Timeline risk compounds both constraints. With ISS planned to retire in 2030 and no commercial station yet operational, the risk of a "LEO gap"—an interval with no U.S. crewed presence in orbit—is material. Russia has committed ISS participation only through 2028. China's Tiangong station has been continuously crewed since 2022. A gap would cede both strategic leadership and ongoing research pipeline continuity. Launch cadence, by contrast, is an enabling rather than constraining factor: SpaceX's approximately 170 annual launches provide adequate logistics backbone for station servicing at current price points, though single-source dependency on SpaceX remains a concentration risk.
