    - type: "conflicting-data"
      severity: "material"
      topic: "nasa-cld-phase2-acquisition-outcome"
      missingEvidence: "Definitive NASA Phase 2 AFP release terms, award decisions, recipient count, and per-recipient funding levels; clarity on whether NASA has abandoned the standalone-station model in favor of a docking-module approach."
      whyItMatters: "The Phase 2 procurement outcome is the single most important near-term value catalyst for all CLD competitors including Vast; whether NASA awards 2 vs. 3+ providers and at what funding levels directly determines Vast's revenue trajectory and required private capital for Haven-1 and Haven-2."
      diligencePath: "Monitor NASA SOMD announcements and procurement portals for AFP release through Q3 2026; track Congressional appropriations actions on the CLD line item; review any revisions to the NASA CLD directive following the March 2026 pivot."
