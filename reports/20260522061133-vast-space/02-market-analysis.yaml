  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "commercial-crewed-station-tam"
      missingEvidence: "An independent bottom-up TAM study specifically quantifying the crewed LEO station services market—distinct from the broader LEO satellite communications and Earth observation market—with disclosed methodology, demand survey, and realistic pricing assumptions."
      whyItMatters: "All published analyst estimates conflate the LEO satellite constellation market ($8–$16B in 2026) with crewed station services; investors and operators cannot underwrite capital allocation without a credible, segment-specific market model. NASA's own skepticism about non-government demand (March 2026) makes the absence of this evidence more consequential."
      diligencePath: "Commission or identify a sector-specific market study focused on sovereign astronaut mission revenue, microgravity R&D payload spending (interviews with pharma/biotech R&D VP-level buyers), and in-space manufacturing economic modeling; cross-reference with ISSNL utilization data and Axiom mission pricing benchmarks."
      relatedQuestionRefs:
        - QM007

    - type: "stale"
      severity: "material"
      topic: "first-commercial-station-operational-validation"
      missingEvidence: "Demonstrated operational metrics from any commercial LEO station: crew stay duration, payload throughput, on-orbit failure modes, actual mission revenue, and customer satisfaction data from real crewed missions."
      whyItMatters: "No commercial crewed space station has yet been operational; every assumption about demand realization, utilization rates, operational costs, and crew safety economics is based on ISS analog data or company projections. Until Haven-1 or Axiom's first module operates commercially, the entire market model is theoretical."
      diligencePath: "Track Haven-1's Q1 2027 launch and first mission results; monitor Axiom Hab One's ISS integration and early commercial mission metrics; review ISSNL payload booking rates as a demand proxy."
      relatedQuestionRefs:
