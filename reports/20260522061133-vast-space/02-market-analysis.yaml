callouts:
  - calloutType: "risk"
    title: "LEO Gap Risk: ISS Retirement Timeline vs. CLD Readiness"
    body: "The ISS is planned to deorbit by 2030, but no commercial station has yet demonstrated operational readiness. Russia's commitment extends only through 2028. China's Tiangong has been continuously crewed since 2022. A gap in U.S. crewed LEO presence would erode international partnerships, disrupt ongoing research pipelines requiring human tending, and cede strategic leadership. The Beyond Earth Institute identifies overlapping crewed operations as the critical mitigant—but this requires at least one CLD station to be fully operational before ISS retirement, a timeline that is not currently confirmed for any competitor."
    claimRefs:
      - CM030
      - CM031
      - CM001

  - calloutType: "insight"
    title: "NASA as Anchor Customer: Market-Making Role and Its Limits"
    body: "NASA's redefined role as 'anchor customer and mission integrator' rather than owner-operator is structurally analogous to how it catalyzed commercial crew (Dragon, Starliner) and commercial cargo markets. The key difference: commercial crew had a single, well-defined requirement (ISS crew rotation), while CLD must demonstrate demand beyond the government anchor to justify the capital required. The March 2026 NASA market skepticism signals that the agency itself is not fully confident in the demand thesis—making Phase 2 award terms and co-investment requirements critical value signals for investors."
    claimRefs:
      - CM006
      - CM009
      - CM039

  - calloutType: "assumption"
    title: "Key Assumption: Sovereign Astronaut Demand Scales Without ISS"
    body: "Much of the near-term commercial station revenue thesis rests on sovereign astronaut missions—ESA, JAXA, UAE, and other agencies continuing to send personnel to orbit even after ISS retires. This assumption is validated by existing MOUs and Axiom's track record but is not underwritten by binding contracts on commercial stations. If agencies opt for Tiangong access or pause human spaceflight programs, the non-NASA demand base contracts sharply. This should be treated as a key diligence assumption requiring validation through agency budget line items and formal mission commitments."
    claimRefs:
      - CM012
      - CM013
      - CM017
      - CM020

