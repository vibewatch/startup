    - type: "private-evidence-only"
      severity: "material"
      topic: "non-nasa-commercial-demand-binding-contracts"
      missingEvidence: "Binding commercial contracts or letters of intent from non-government customers for LEO station services; actual payload revenue figures from Axiom's private astronaut missions; Vast's payload booking rate and pricing for Haven-1 Lab slots."
      whyItMatters: "NASA market skepticism in March 2026 is grounded in the absence of demonstrated non-government demand; the entire investment thesis for commercial station operators rests on this market eventually materializing at scale beyond the government anchor. Without binding commercial commitments, market realization remains speculative."
      diligencePath: "Request Vast's Haven-1 Lab payload booking data (contracted vs. LOI vs. in discussion); obtain Axiom mission revenue disclosures or triangulate from reported mission pricing ($50–$55M per seat benchmark); interview R&D procurement leads at pharma and biotech firms regarding actual budget lines for in-space experimentation."
