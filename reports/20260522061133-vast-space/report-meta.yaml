summary:
  headline: "Vast Space has achieved real hardware progress with a credible team, first-mover positioning in post-ISS LEO stations, and a $500M institutional round—but the binary dependencies on SpaceX, NASA CLD award, and pre-revenue status at >$2B implied valuation make this a research-more / track situation, not a buy."
