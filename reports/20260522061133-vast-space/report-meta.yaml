companyProfile:
  summary: >
    Vast Space (legal entity: Vast, Inc.) is a Long Beach, California-based commercial space
    station company founded in 2021 by Jed McCaleb. The company's near-term programme centres
    on Haven-1, a single-module four-crew commercial space station with 45 m³ habitable volume,
    targeting a Q1 2027 SpaceX Falcon 9 launch after a 3–4 quarter schedule slip from its prior
    mid-2026 target. Haven Demo, an in-orbit technology testbed, flew in November 2025 and
    deorbited in February 2026, validating the stepping-stone strategy. Vast has deployed over
    $1 billion in total capital and closed a $500 million Series A round in March 2026
    ($300M equity + $200M debt). The company employs more than 1,000 people and is a finalist
    in NASA's Commercial Low Earth Orbit Destinations (CLD) Phase 2 competition alongside
    Starlab/Voyager and Blue Origin's Orbital Reef. Vast is pre-revenue; no station has yet
    been operated commercially. CEO Max Haot has led the company since August 2023.
  foundedDate: "2021-01-01"
  founders:
    - name: "Jed McCaleb"
      role: "Founder, Board Chair & Tech Fellow"
      background: "Co-founder of Ripple and Stellar; software engineer and philanthropist; primary financial backer of Vast, having stated willingness to invest up to $1B of personal wealth."
