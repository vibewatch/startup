figures:
  - id: FU001
    title: "Customer Journey Map"
    type: journey-map
    summary: >-
      Haven-1 Lab payload customers progress through a five-stage journey from research discovery
      to in-orbit science operations. The no-cost joint SpaceX/Vast RFP lowers the barrier at the
      Apply stage for academic researchers, while commercial partners typically enter through direct
      outreach. All five confirmed partners are currently in the Integrate & Test stage, awaiting
      Haven-1's Q1 2027 launch.
    data:
      items:
        - id: stage-discover
          label: Discover
          actor: Principal investigator or payload BD team
          description: >-
            Researcher or BD team identifies Haven-1 Lab as a microgravity access vehicle through
            Vast/SpaceX press coverage, CASIS network, or industry conferences. No-cost RFP announcement
            broadens awareness beyond commercial-budget teams.
          channels:
            - Trade press (Payload Space, SpaceflightNow, Space.com)
            - CASIS ISS National Lab partner network
            - SpaceX commercial payload ecosystem
        - id: stage-apply
          label: Apply / Submit RFP
          actor: Payload partner or research investigator
          description: >-
            Organization submits payload concept to Vast via the Haven-1 Lab payload partner program
            or the joint SpaceX/Vast no-cost research proposal process. Eligibility criteria include
            experimental value in microgravity, MLE form-factor fit, power budget, and safety standards.
          channels:
            - vastspace.com/science-rfp-eligibility direct application
            - SpaceX/Vast joint RFP selection panel
        - id: stage-select
          label: Select & Contract
          actor: Vast payload integration team and partner
          description: >-
            Vast selects payload partners through an undisclosed evaluation process and announces
            publicly (e.g., April 2025 announcement of JAMSS, Interstellar Lab, Exobiosphere).
            Financial terms and slot fees are negotiated privately; no public benchmarks exist.
          channels:
            - Vast payload partnership program
            - Private contract negotiation
        - id: stage-integrate
          label: Integrate & Test
          actor: Payload partner engineering team and Vast integration team
          description: >-
            Partner delivers payload hardware meeting MLE form-factor requirements (100 W,
            Starlink-commandable). Vast performs integration testing at its Long Beach facility.
            All five current partners are at this stage pending the Q1 2027 Haven-1 launch.
          channels:
            - Vast Long Beach integration facility
            - MLE hardware interface testing
            - Remote commanding verification via Starlink
        - id: stage-science-ops
          label: Science Operations
          actor: Principal investigator (remote) and crew (on-orbit as needed)
          description: >-
            After launch, investigators command payloads remotely via Starlink connectivity; crew
            can intervene for time-sensitive operations. Data and samples return via Dragon splashdown.
            No partner has reached this stage as of runDate.
          channels:
            - Starlink remote commanding
            - SpaceX Dragon sample return
            - CASIS ground operations support
    sourceRefs:
      - SU001
      - SU004
      - SU007
      - SU013
      - SU016

