company:
  name: "Vast Space"
chapter:
  number: 6
  title: "Customers"
  summary: >
    Vast Space is pre-revenue and pre-launch; every commercial relationship described in this chapter
    constitutes a forward commitment rather than earned revenue. Haven-1 Lab, the station's 8-slot MLE
    payload bay, has five publicly confirmed partners—Redwire (ADSEP4), Yuri (ScienceTaxi), JAMSS
    (multi-purpose payload), Interstellar Lab (Eden 1.0), and Exobiosphere (OHTS)—all concentrated in
    life sciences and biotech, with Cedars-Sinai joining as a research collaborator through Exobiosphere
    in April 2026. NASA selected Vast for its sixth Private Astronaut Mission (PAM-6) in February 2026,
    scheduling a crew of up to four for up to 14 days aboard ISS in summer 2027. A CASIS strategic
    agreement (April 2025), a non-binding ESA MOU (June 2024), and regional offices in Japan and
    Europe extend Vast's institutional pipeline. Key risks include sector concentration in a single
    industry vertical, absence of any publicly disclosed financial commitments from partners, an
    unverified "nearing full capacity" claim, and no disclosed pricing model. The competitive landscape
    includes Axiom Space, Starlab, and Orbital Reef, all targeting overlapping customer segments.

sections:
  - id: "customer-segments"
    title: "Customer Segmentation and Demand Channels"
    body: >
      Vast's customer base spans three structural demand channels converging on microgravity access.
      The first is commercial payload research, where life-sciences firms, pharmaceutical companies,
      and advanced-materials researchers lease MLE slots on Haven-1 Lab to conduct experiments in
      weightlessness that are impossible or prohibitively expensive on the ground. The second is
      institutional and government, encompassing NASA private astronaut missions, national space agency
      MOUs, and ISS National Lab pathways that bring publicly funded researchers to orbit. The third
      is industrial in-space services, where technology demonstrators and manufacturing firms test
      products or processes in the space environment.

      Within commercial payload research, all five publicly confirmed Haven-1 Lab partners operate in
      life sciences—cell biology (Yuri, Exobiosphere), pharmaceuticals and bioprocessing (Redwire
      ADSEP4), and astrobiology (Interstellar Lab)—creating a sector-concentrated pre-launch portfolio.
      Government and institutional demand is formalized through PAM-6 with NASA, the CASIS strategic
      agreement, and the ESA MOU. The SpaceX/Vast joint RFP, which offers research access at no cost
      to selected investigators, widens the top of the customer funnel toward academic and smaller
      commercial research teams. Vast's regional expansion into Japan (Vast Japan GK, December 2025)
      and Europe (Giorgio Saccoccia, President Europe) signals intent to diversify geographically across
      all three demand channels. Haven-1 Lab payload partners span four countries—USA, Germany, Japan,
      and France—indicating multi-regional early demand even though all operate in adjacent verticals.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU042
    tableRefs:
      - TU001

  - id: "payload-partner-demand"
    title: "Haven-1 Lab Payload Partners and Commercial Pipeline"
    body: >
      Haven-1 Lab is the commercial microgravity research, manufacturing, and development platform
      occupying the forward bay of Haven-1. As of runDate, Vast has publicly named five payload
      partners that have reserved capacity across the lab's MLE slots. Each slot provides up to
      100 W of electrical power and is remotely commandable via the onboard SpaceX Starlink laser
      terminal, enabling investigators to monitor and operate experiments without requiring a crew
      member in the loop for routine science operations.

      Redwire Space brings ADSEP4, an automated drug-suspension system extending Redwire's prior ISS
      work on bioreactor and pharmaceutical crystallization payloads. Yuri, a German-based microgravity
      services company that has already flown 151 space labs for 61 customers on 4 continents,
      contributes ScienceTaxi—a modular cassette system that hosts multiple investigators within a
      single MLE footprint. JAMSS, Japan Manned Space Systems Corporation and "Asia's first payload
      partner" for Haven-1, contributes a multi-purpose payload aimed at Japanese pharmaceutical and
      materials companies. Interstellar Lab contributes Eden 1.0, a controlled-environment
      plant-growth chamber targeting astrobiology and food-tech applications. Exobiosphere contributes
      its Orbital High-Throughput Screening (OHTS) platform, which gained a Cedars-Sinai research
      collaboration in April 2026.

      Vast stated in April 2025 that Haven-1 Lab was "nearing full capacity," implying the majority of
      its 8 MLE slots were committed. The SpaceX/Vast joint RFP offers research access at no cost to
      selected investigators through a competitive selection process, expanding the addressable funnel
      beyond partners with commercial research budgets.
