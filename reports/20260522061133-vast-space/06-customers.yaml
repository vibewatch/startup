  evidenceGaps:
    - type: no-public-evidence
      severity: major
      topic: "Haven-1 Lab slot capacity vs ISS National Lab research throughput"
      missingEvidence: >-
        ISS National Lab does not publish total MLE slot availability or annual research-hours
        equivalent in a form that enables a direct like-for-like capacity comparison with Haven-1
        Lab's 8 MLE slots. No public benchmark for this comparison is available.
      whyItMatters: >-
        Without a comparison benchmark it is difficult to assess whether Haven-1 Lab represents a
        meaningful fraction of current ISS research capacity or a step change for the market.
      diligencePath: >-
        Request ISS National Lab annual utilization statistics from CASIS; review published NASA
        ISS utilization reports and compare active MLE slot counts.
      relatedQuestionRefs:
        - QU024
      relatedTableRefs:
        - TU002

    - type: private-evidence-only
      severity: major
      topic: "Payload partner financial commitments and contract values"
      missingEvidence: >-
        No payload partner has disclosed contractual pricing, minimum revenue commitments, or
        option structures. It is unknown whether partners have made binding financial commitments
        or only letters of intent.
      whyItMatters: >-
        The entire commercial thesis for Haven-1 Lab rests on payload revenue; without financial
        terms, capacity utilization and revenue forecasts cannot be independently verified.
      diligencePath: >-
        Request Haven-1 Lab pricing model and executed partner agreement summaries under NDA;
        ask whether any partner has made binding milestone payments.
      relatedQuestionRefs:
        - QU014
      relatedTableRefs:
        - TU003
        - TU005

    - type: private-evidence-only
      severity: moderate
      topic: "PAM-6 contract value and pricing benchmarks"
      missingEvidence: >-
        The financial terms of the PAM-6 contract, including total mission price, milestone
        payment structure, and comparison to prior PAM contracts, are not publicly disclosed.
      whyItMatters: >-
        Without pricing, the revenue contribution of NASA government missions to Vast's overall
        business model cannot be assessed; also limits comparison to prior PAM operators.
      diligencePath: >-
        Cross-reference with Axiom Space PAM contract disclosures; request mission financial
        summary from Vast under NDA.
      relatedTableRefs:
        - TU004
