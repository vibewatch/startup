  - id: "concentration-risk-durability"
    title: "Concentration Risk, Pre-Revenue Status, and Retention Durability"
    body: >
      Vast's customer portfolio carries several structural risks that diligence must weigh against
      the apparent momentum. First, all five confirmed Haven-1 Lab partners are in life sciences
      and biotech, creating sector concentration risk: if regulatory, funding, or scientific
      developments impair microgravity drug or biomedical research, the entire commercial payload
      pipeline is exposed simultaneously. Second, Vast is pre-revenue; every partnership described
      here is a forward commitment and no payload slot fees, PAM crew rates, or government contract
      values have been publicly disclosed. The "nearing full capacity" claim cannot be independently
      verified because no slot inventory or partner financial commitment levels are public. Third,
      the ESA MOU is non-binding; the Czech Republic and Japan MOUs have not yielded binding revenue
      commitments; and the ISS National Lab pathway depends on ISS continuing to operate until
      Haven-1 is fully operational. Fourth, the joint SpaceX/Vast RFP offering research access at
      no cost to selected investigators builds goodwill and funnel breadth but could impair future
      pricing power if the market expects subsidized access. Fifth, the competitive landscape
      includes Axiom Space (further ahead with ISS commercial modules under contract), Starlab, and
      Orbital Reef, all targeting overlapping life-sciences and government customer segments, and
      NASA has raised concerns about the adequacy of the commercial LEO demand base.
