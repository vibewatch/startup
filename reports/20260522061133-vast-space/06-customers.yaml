      to five confirmed payload partners with hardware committed to Haven-1. The no-cost joint RFP
      widens the application stage, but the 8-slot hard capacity ceiling constrains conversion volume.
      Commercial pricing remains undisclosed and funnel economics below the 8-slot ceiling are unproven.
