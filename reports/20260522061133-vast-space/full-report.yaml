  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Schedule and Execution Risk
        blocks:
          - type: paragraph
            body: >
              Haven-1's launch target slipped from mid-2026 to no earlier than Q1 2027, a delay announced by Vast CEO
              Max Haot in January 2026 and confirmed across multiple independent sources. Haot described Q1 2027 as the
              date the company can "confidently" meet, framing earlier 2026 targets as aspirational. The slip is
              attributable to the complexity of Haven-1's three-phase integration campaign: Phase 1 installs thermal
              control, life support, and propulsion systems; Phase 2 adds avionics, guidance, navigation, and control;
              and Phase 3 completes interior habitation fit-out and mounts external shielding, radiators, and solar
              panels. Following all three phases, Haven-1 must undergo a full environmental test campaign at NASA's Neil
              Armstrong Test Facility in Sandusky, Ohio before launch processing can begin.


              Even after a successful launch, crewed operations face a separate and potentially lengthy clearance
              process. Haot stated publicly that Haven-1 will undergo an uncrewed checkout period after reaching orbit,
              during which Vast must convince SpaceX—through contractual milestones and documented verification
              events—that the station is safe to dock with a crewed Dragon spacecraft. That window could open as early
              as two weeks post-launch or extend as long as three years, meaning the first revenue-generating crew
              mission (Vast-1) carries a wide uncertainty range independent of the launch date itself. The station is
              the heaviest payload ever attempted on a Falcon 9, at approximately 14,000 kg, adding a further technical
              execution dimension to the launch preparation.


              Haven-2's roadmap is far more ambitious: first module targeted for 2028, a three-module configuration by
              2030, and a nine-module complex by 2032. Each module requires a separate Falcon 9 launch, meaning the
              program depends on maintaining launch cadence at roughly one launch every six months starting in 2028. Any
              slip in Haven-1 compresses the time available to validate architecture lessons before Haven-2 integration
              begins. Despite the Haven-1 delay, Vast claims to remain one to two years ahead of Axiom Station Module 1
              (targeting 2028) and Starlab (targeting 2029), giving the company margin before competitors reach orbit.
            claimRefs:
