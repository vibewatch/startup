      - number: '5.4'
        title: Product Roadmap and Technology Adjacencies
        blocks:
          - type: paragraph
            body: >
              Vast's roadmap follows a hardware-rich stepping-stone model: Haven Demo → Haven-1 (crewed, commercial LEO
              station) → Haven-2 (multi-module, ISS-successor) → artificial gravity habitats. Each step is designed to
              directly use the design, team, supply chain, and flight heritage of the prior step, compressing schedule
              and cost for subsequent modules.

              Haven-2 is designed as an evolved, NASA-certified version of Haven-1. The first Haven-2 module, if NASA
              selects Vast under the Commercial LEO Destination Phase II award (decision expected mid-2026), would be
              approximately 5 m longer than Haven-1, offering nearly twice the habitable volume while using the same
              proven systems. Three additional modules would follow every six months beginning in 2028, with a
              four-module station capable of supporting a continuous crew operational by end of 2030. Between 2030 and
              2032, a larger 7 m-diameter core module and four more Haven-2 modules would be added, including a 3.8 m
              cupola, robotic arm, external payload airlock, and EVA airlock.

              Haven-1 Lab has already signed five payload partners (Redwire, Yuri, JAMSS, Interstellar Lab,
              Exobiosphere), plus a strategic research collaboration with Cedars-Sinai focusing on organoid research and
              biomanufacturing. Vast and SpaceX issued a joint request for research proposals from the global scientific
              community offering access to Haven-1 Lab, Dragon, and ISS PAM missions at no cost. Vast signed a strategic
              agreement with CASIS to support ISS National Lab research access in preparation for its NASA private
              astronaut mission. In February 2026, Vast was selected by NASA for the sixth private astronaut mission to
              the ISS, targeted for summer 2027.

              The Vast Satellite product line, announced May 19, 2026, leverages the same avionics, power, propulsion,
              communications, and flight software subsystems developed for Haven-1 and validated through Haven Demo. The
              inaugural 15 kW-class bus (700 kg dry mass, 350+ kg payload capacity, 5-year design life) targets
              communications, Earth observation, national security, and orbital data center customers. The first sale
              (four satellites, option for 200) to a confidential customer has been announced, providing near-term
              revenue potential before Haven-1 operations begin.

              Artificial gravity habitats remain Vast's long-term stated vision — large spinning structures generating
              centrifugal acceleration to counteract the physiological effects of prolonged microgravity including
              muscle atrophy, bone loss, and elevated intracranial pressure. None of the current product generation
              (Haven Demo, Haven-1, Haven-2) incorporates spinning structures; artificial gravity is an out-decade
              aspiration explicitly not on the Haven-2 schedule.
