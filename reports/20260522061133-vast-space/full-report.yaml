  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing History and Implied Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Vast Space's capital history falls into two phases. From founding in 2021 through early 2026, the company
              was financed entirely by founder Jed McCaleb, who publicly committed up to $1 billion of personal capital.
              McCaleb's stated commitment and the evidence of continuous hardware development through Haven Demo's
              November 2025 orbital mission support an estimate of $700–800 million in founder capital deployed before
              the March 2026 institutional round.


              The March 2026 financing round—$300 million Series A equity and $200 million in debt—marks Vast's first
              institutional external capital event. The equity was led by Balerion Space Ventures, a defense- and
              dual-use-focused space venture firm, with co-investors including IQT (the CIA-affiliated venture arm), the
              Qatar Investment Authority (QIA), Mitsui and Co., MUFG, Nikon Corporation through its NFocus Fund, Stellar
              Ventures, Space Capital, and Earthrise Ventures. Total capital deployed exceeds $1 billion by the
              company's own disclosure.


              The implied equity valuation rests on a single third-party source: a December 2025 Forbes article
              reporting that Vast was "in talks" to raise money at a $2 billion pre-money valuation. If that pre-money
              figure held in the final deal, the $300 million equity injection implies a post-money equity valuation of
              approximately $2.3 billion. Neither Vast, Balerion, nor any co-investor has officially confirmed a
              post-money valuation. Some secondary market commentary has cited approximately $2.5 billion, though
              corroboration for that higher figure is thin. All valuation estimates in this chapter are estimates, not
              confirmed facts.


              The $200 million debt tranche introduces a fixed obligation—interest payments, potential covenants, and a
              maturity schedule—whose terms are undisclosed. This creates an additional layer of uncertainty in any
              equity-value analysis: debt terms affect free cash flow, covenant restrictions can limit operational
              flexibility, and in a distress scenario, debt holders rank ahead of equity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
