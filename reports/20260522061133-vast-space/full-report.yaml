      - number: '8.4'
        title: Bull/Base/Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              The valuation at any point in the next three years is almost entirely determined by two binary events: the
              CLD Phase 2 award (expected mid-2026) and Haven-1's successful launch and operation (Q1 2027). The
              scenario analysis reflects this event-driven structure.


              Bull case (probability signal: 20–30%): Vast wins CLD Phase 2 funding, Haven-1 launches successfully in Q1
              2027 and operates, the sixth PAM mission executes in summer 2027 generating $150–220 million in gross
              mission revenue, and Vast Satellite secures additional satellite bus orders. In this scenario, by 2028
              Vast would have demonstrable multi-stream revenue, a $300–700 million government anchor contract, and
              defensible leadership in the commercial LEO station market. An implied equity value of $3.5–5.0 billion is
              plausible under 5–7× forward revenue assumptions.


              Base case (probability signal: 40–50%): Vast wins CLD Phase 2 or receives Phase 1 extension funding,
              Haven-1 launches with some delay but reaches orbit, and the PAM mission generates partial revenue. The
              implied equity value would likely settle in the $2.0–3.5 billion range in 2027–2028, consistent with the
              current $2.3 billion mark and representing a moderate risk-adjusted return for Series A investors.


              Bear case (probability signal: 25–35%): Vast loses CLD Phase 2 to Axiom Space or Starlab, Haven-1 launch
              is delayed or partially successful, and the company must seek bridge financing against a $200 million debt
              burden with limited demonstrated revenue. In this scenario, the equity value declines sharply—potentially
              to $0.5–1.5 billion, implying a capital loss for Series A investors unless Vast can pivot to a
              smaller-footprint commercial model funded by satellite bus revenue and PAM fees.
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV031
              - CV032
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV024
              - CV042
      - number: '8.5'
        title: 'Adverse Analysis: Overvaluation Risks, Dilution, and Downside Triggers'
        blocks:
          - type: paragraph
            body: >-
              The $2.3 billion implied equity valuation is stretched relative to Vast's current fundamental profile:
              zero disclosed revenue, zero ARR, no confirmed customers beyond the pre-PAM NASA contract and a single
              undisclosed satellite bus order, and a $200 million debt obligation with undisclosed terms. The case for
              this valuation rests almost entirely on option value—the potential to become a NASA-anchored commercial
              station operator—and on strategic scarcity value in a sector where pre-construction competitors are
              raising capital at comparable or higher prices.


              NASA's own position—that a viable independent commercial LEO business case does not yet exist—poses a
              structural adverse signal. The commercial LEO economy beyond government anchor customers is effectively
              zero today, and CEO Max Haot's public statement that the company models "close to zero dollars for the LEO
              economy in the next five years" from non-NASA sources confirms the programme's dependence on government.


              Multiple compression risk is material. Private space infrastructure valuations in 2023–2024 experienced
              significant contraction. A 30–50% sector-wide compression would bring the $2.3 billion mark to $1.2–1.6
              billion without any company-specific deterioration.


              Dilution risk is compounded by capital intensity: Vast will require at least one more major equity raise
              before Haven-2 becomes operational (estimated $1–2 billion in additional capital), which will dilute
              Series A investors significantly if executed below the current implied mark.


              Governance concentration risk is present. Jed McCaleb retains founder control; the terms of protective
              provisions, anti-dilution rights, and board representation for Series A investors are not publicly
              disclosed. IQT and QIA participation reduces pure financial pressure but introduces strategic
              considerations that may not align with maximising financial return for financial investors.
            claimRefs:
              - CV030
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV028
              - CV031
              - CV034
              - CV040
      - number: '8.6'
        title: Investment Recommendation and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The recommended investment posture for Vast Space as of May 2026 is "research-more." The company has
              significant strategic strengths—first-flight hardware heritage, a diversified institutional investor
              syndicate, a confirmed NASA PAM award, and a credible CLD Phase 2 competitive position—but the investment
              case cannot be assessed with adequate confidence until the Phase 2 outcome is known (mid-2026), the
              implied equity valuation mark is confirmed, and the debt terms are disclosed.


              A "buy" recommendation is not supportable at this stage because the $2.3 billion implied entry price
              carries meaningful downside risk in the bear case and provides only moderate upside in the base case. The
              risk-adjusted return profile is binary, not asymmetric in the investor's favour: the bull upside
              (approximately 2× from current mark) does not adequately compensate for the bear downside (60–80% value
              loss). A "track" posture is appropriate for investors who have already established positions, with the CLD
              Phase 2 award announcement serving as the primary re-evaluation trigger.


              The five highest-priority diligence asks are: confirmation of the post-money equity valuation and
              cap-table terms from a direct investor conversation; review of the $200 million debt term sheet,
              specifically covenants and maturity schedule; a CLD Phase 2 competitive assessment; the first confirmed
              Haven-1 launch date and any launch insurance; and the Vast Satellite bus commercial terms, pricing, and
              customer identity.
            claimRefs:
              - CV039
              - CV042
          - type: table
            tableRef: TV002
