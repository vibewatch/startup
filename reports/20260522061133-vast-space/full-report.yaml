      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Haven-1 Life Support Dependency Is a Hard Single-Point-of-Failure
            body: >-
              Haven-1 cannot sustain crew without Crew Dragon docked. Any SpaceX operational disruption—manifest
              reprioritization, Dragon anomaly investigation, or safety hold—directly grounds crewed Haven-1 operations
              with no backup path. This architectural dependency should be the primary diligence focus for investors
              assessing near-term operational risk.
            calloutType: risk
