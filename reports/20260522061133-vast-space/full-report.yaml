      - number: '5.5'
        title: Technical Risks and Unresolved Gaps
        blocks:
          - type: paragraph
            body: >
              Vast's technology stack carries a concentration of unresolved or partially addressed risks that material
              investors should evaluate before the Haven-1 launch and NASA CLD Phase II award in mid-2026.

              The most significant architectural risk is the depth of SpaceX dependency. Haven-1 requires a SpaceX
              Falcon 9 for launch, SpaceX Dragon for every crewed mission, and SpaceX Starlink for primary connectivity.
              If any SpaceX system experiences extended delays, redesign requirements, or pricing changes, Haven-1's
              operational schedule and cost structure are directly affected. Vast has no alternative launch or crew
              vehicle contracted, and its Starlink agreement for future Haven platforms also ties Haven-2 to the same
              supplier.

              The ECLSS posture for Haven-1 is open-loop with resupply, not closed-loop regenerative. Trace contaminant
              control and CO₂/O₂ management have been tested at the subsystem level at NASA MSFC, but full-system
              integrated ECLSS testing at altitude-equivalent environments has not yet been publicly confirmed as
              complete. Haven-2 is stated to introduce "more advanced and efficient life support technologies" module by
              module, acknowledging the upgrade path without specifying the closed-loop target date. Long-duration
              missions (beyond two weeks per crew rotation) require regenerative ECLSS, and the current Haven-1 design
              has not demonstrated this capability.

              Schedule risk is demonstrated rather than theoretical. The original launch target of August 2025 was moved
              to May 2026 following manufacturing learnings during primary structure qualification, and has since been
              updated to Q1 2027 with integration underway. Each integration phase (pressurized systems, avionics,
              habitation) requires functional and environmental acceptance testing; unplanned rework at any phase can
              propagate. The Neil Armstrong Test Facility campaign, scheduled for 2026, represents another gating item
              before launch readiness.

              Haven Demo, while a meaningful system-level test, was a small unmanned satellite, not a pressurized crewed
              module. It validated avionics, power, GNC, and communications but left ECLSS, crew interface, docking, and
              full thermal-load operations untested in orbit. The station's novel human-centric features (patent-pending
              sleep system, interior closeout, payload racks) have no flight heritage at all. Haven Demo also launched
              on a rideshare with no specific orbit optimized for ISS compatibility, while Haven-1 must rendezvous and
              dock.

              IP protection for the sleep system and interior design elements has been flagged as patent- pending, but
              the competitive moat in hardware design is limited: competitors can replicate ergonomic features
              relatively quickly once published. Vast's true differentiation lies in its manufacturing process, team,
              and schedule execution — none of which are IP-protected.
