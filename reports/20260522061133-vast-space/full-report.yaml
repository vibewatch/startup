  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital Raised and Round Structure
        blocks:
          - type: paragraph
            body: >-
              Vast announced the close of a $500 million financing package on 5 March 2026: $300 million of Series A
              preferred equity and $200 million in debt. The equity portion was led by Balerion Space Ventures, with
              co-investors including IQT (the CIA-affiliated venture arm), the Qatar Investment Authority (QIA), Mitsui
              & Co., MUFG, Nikon Corporation (through its NFocus Fund), Stellar Ventures, Space Capital, and Earthrise
              Ventures. Jed McCaleb, Vast's founder and sole prior financial backer, also participated. As part of the
              transaction, Balerion advisor and former NASA Chief Technologist A.C. Charania joined Vast's board.


              Prior to this round, the company had been funded entirely by McCaleb, who had publicly stated willingness
              to deploy up to $1 billion of his personal fortune. The March 2026 round therefore marks Vast's first
              significant institutional external capital event. Cumulative disclosed investment now exceeds $1 billion,
              per the company's own press statements.


              In December 2025 Forbes reported that Balerion was set to lead a $300 million round at a $2 billion
              pre-money valuation; the final announcement confirmed a $300 million equity close but added $200 million
              in debt, implying a post-money equity valuation of approximately $2.3 billion if the pre-money figure
              held. Neither Vast nor any investor has officially confirmed the final post-money valuation, making this
              figure an estimate based on the December 2025 reporting. Debt terms—maturity, coupon, covenants—have not
              been disclosed.


              The co-investors represent a blend of strategic capital (Nikon for manufacturing tech cross-pollination,
              Mitsui/MUFG for Japanese institutional anchor, QIA for sovereign continuity), intelligence-community
              venture (IQT), and dedicated space-focused funds (Balerion, Space Capital, Earthrise Ventures, Stellar
              Ventures). QIA also co-invested in the Axiom Space $350 million round completed weeks earlier, signalling
              sector-wide conviction rather than exclusive loyalty to Vast.
