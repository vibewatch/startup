  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Post-ISS Commercial LEO Market: Boundary, Phases, and NASA Anchor Role'
        blocks:
          - type: paragraph
            body: >
              The International Space Station is planned to retire and deorbit by 2030, ending more than two decades of
              continuous government-operated human presence in low Earth orbit. NASA's Commercial Low Earth Orbit
              Destinations (CLD) program represents the primary mechanism for transitioning from direct station
              operation to a customer model—the agency's explicit goal is to become one of many customers purchasing
              services from privately owned and operated commercial stations rather than owning and operating orbital
              infrastructure itself.


              NASA's three-phase CLD framework structures this transition. Phase 1 provided funded and unfunded Space
              Act Agreements (SAAs) for early design and development; Axiom Space holds a firm-fixed-price contract,
              Blue Origin/Sierra Space and Starlab Space received Phase 1 funded SAAs, and Vast holds an unfunded SAA
              through the CCSC-2 initiative. Phase 2, revised by an August 2025 NASA directive, shifts to funded SAAs
              focused on critical design review readiness and an in-space crewed demonstration, with awards expected in
              early 2026. Phase 3 will use FAR-based contracts for formal certification and commercial service
              procurement—the full acquisition strategy remains under development.


              The FY2026 Presidential Budget Request allocated $272.3 million specifically for CLD development, with
              $2.1 billion projected over the following five years. In a significant pivot in March 2026, however, NASA
              announced it would not fund entire standalone stations under Phase 2 and instead proposed a docking module
              approach—allowing commercial modules to attach to ISS infrastructure—due to budget constraints and stated
              concerns that sufficient non-NASA demand has not yet emerged. Station builders including Vast, Axiom, and
              Starlab publicly pushed back at the 2026 Space Symposium, submitting over 390 pages of independent
              analysis asserting market viability. The outcome of Phase 2 awards and whether NASA will fund 2 or 3+
              providers remains the central near-term market-shaping variable for all CLD competitors as of May 2026.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
