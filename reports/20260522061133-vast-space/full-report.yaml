            body: >-
              Haven Demo's November 2025 mission success—completing all 49 test objectives over three months in
              orbit—established Vast as the only company to have designed, manufactured, flown, operated, and deorbited
              a purpose-built commercial space station testbed. This hardware flight heritage directly de-risks Haven-1
