companyProfile:
  summary: >
    Vast Space (legal entity: Vast, Inc.) is a Long Beach, California-based commercial space station company founded in
    2021 by Jed McCaleb. The company's near-term programme centres on Haven-1, a single-module four-crew commercial
    space station with 45 m³ habitable volume, targeting a Q1 2027 SpaceX Falcon 9 launch after a 3–4 quarter schedule
    slip from its prior mid-2026 target. Haven Demo, an in-orbit technology testbed, flew in November 2025 and deorbited
