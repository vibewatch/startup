          - type: callout
            title: NASA CLDC On Hold Removes the Institutional Revenue Anchor for Haven-2
            body: >-
              As of January 28, 2026, NASA's CLDC acquisition is formally on hold. Without a funded Space Act Agreement
              or eventual CLD service contract, Haven-2's multi-billion dollar capital requirement falls entirely on
              private markets. The $4 billion CLD budget gap means NASA may fund one station at most, forcing Vast into
              direct competition with Axiom, Blue Origin, and Starlab for a single institutional seat.
            calloutType: risk
            claimRefs:
