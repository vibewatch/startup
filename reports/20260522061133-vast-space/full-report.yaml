      - number: '2.2'
        title: 'Demand Segmentation: Government, Research, Manufacturing, and Adjacent Revenue'
        blocks:
          - type: paragraph
            body: >
              The commercial LEO station market draws demand from four broad segments, each with distinct budget
              ownership, procurement timelines, and price sensitivity.


              Sovereign and agency missions represent the most validated near-term revenue stream. International space
              agencies and national programs—including ESA (which signed an MOU with Vast), JAXA through JAMSS, and
              other partner nations—have consistently demonstrated willingness to pay for access to crewed LEO
              facilities. Axiom Space has flown 12 paying customers across four private astronaut missions to the ISS,
              carrying 166 revenue payloads, validating this demand category at demonstrated price points. This
              sovereign-astronaut segment represents bookable, near-term revenue that does not depend on unproven
              commercial end markets.


              Microgravity R&D and pharmaceutical manufacturing form the second pillar of demand. Haven-1 Lab offers 10
              Middeck Locker Equivalent payload slots, each with 100W continuous power, Gigabit/s Starlink connectivity,
              and sample return capability. Inaugural partners Redwire (pharmaceutical crystallization,
              biomanufacturing) and Yuri (life science incubators) represent established ISS ecosystem players extending
              to commercial platforms. Adjacent interest spans semiconductor materials, advanced coatings, and biotech
              sectors. The rate-limiting factor is payload development cost and the small size of the addressable market
              for true space-unique manufacturing.


              Defense and national security represent a growing but largely undisclosed demand source. The DoD's
              dual-use interest in LEO infrastructure—encompassing reconnaissance, hypersonics testing, and
              communications—could expand the addressable market substantially, but contracting vehicles and
              classification constraints limit public evidence. Adjacent satellite bus revenue (Vast's high-power
              satellite bus pivot, announced May 2026) provides a potential non-crew revenue buffer that partially
              de-risks the station business model. The Exploration Company signed for cargo services to Haven-2,
              indicating early supply-chain demand formation.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM017
              - CM018
              - CM019
              - CM020
              - CM034
