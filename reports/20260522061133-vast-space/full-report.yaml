      - number: '5.3'
        title: Vertical Integration, Manufacturing, and Testing
        blocks:
          - type: paragraph
            body: >
              Vast's manufacturing strategy is built around vertical integration at its Long Beach, California
              headquarters, with large-scale environmental testing at its Mojave, California site and a planned
              system-level environmental test campaign at NASA's Neil Armstrong Test Facility (NTF) in Sandusky, Ohio.
              This approach eliminates many supplier interfaces, gives Vast direct control over schedule, and according
              to management has delivered a 10× reduction in primary structure manufacturing costs relative to
              traditional space station programs.

              Haven-1's primary structure uses aluminum, chosen over an initial stainless-steel baseline after a
              parallel manufacturing effort and trade study in November 2023 – March 2024 revealed stainless steel posed
              manufacturing challenges. The first aluminum article was a Pathfinder, manufactured November 2023 through
              June 2024, establishing tooling, team, and critical interfaces. A full qualification article followed:
              milling began July 2024, welding completed December 2024, and on January 31, 2025, the article underwent
              the NASA-STD-5001 proof pressure test at Vast's Mojave facility. The structure was pressurized to 1.8 barD
              (26 psig) for five hours; all strain gauges remained within specification, the leak rate was indiscernible
              against the 1.2 scc/min requirement, and the test passed on the first attempt. From zero aluminum work to
              proof-tested structure took 15 months.

              The flight-ready primary structure then began in January 2025, completed by July 2025, and underwent
              flight acceptance pressure testing at Mojave in late 2025. The passive docking adapter was installed and
              fit-checked against Dragon hardware in October 2025. Phase 1 integration started in the Long Beach
              cleanroom in January 2026: installation of pressurized fluid systems including thermal control loops, life
              support plumbing, propulsion tubes, component trays, and tanks, with pressure, leak, and functional
              testing. Phase 2 will install avionics, GNC systems, and air revitalization hardware. Phase 3 completes
              the station with crew habitation, interior closeout, external MMOD shielding, thermal radiators, and solar
              array integration.

              The Neil Armstrong Test Facility agreement, signed April 3, 2025, provides access to the Space
              Environments Complex for acoustics, vibration, electromagnetic interference, and thermal vacuum testing of
              the complete flight-ready station, scheduled for 2026. Trace contaminant control system testing was
              completed separately at NASA Marshall Space Flight Center under a reimbursable Space Act Agreement, using
              the same environmental chamber previously used for ISS ECLSS testing. Haven-1's current target launch
              readiness is Q1 2027, representing a slip from the earlier Q1 2026 ambition as integration matured.
