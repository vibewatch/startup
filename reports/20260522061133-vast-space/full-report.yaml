      - number: '6.3'
        title: Institutional and Government Demand Channel
        blocks:
          - type: paragraph
            body: >
              The NASA PAM-6 award, signed February 12, 2026, is the most concrete government customer commitment in
              Vast's portfolio. Under the agreement, Vast will fly a crew of up to four astronauts aboard a SpaceX
              Dragon to ISS for a mission of up to 14 days not earlier than summer 2027. The award confirms NASA's
              willingness to contract with Vast for crewed operations—a meaningful validation of mission safety and
              organizational readiness—but the PAM-6 mission destination is ISS, not Haven-1, limiting direct revenue
              read-through until the station is operational.

              The CASIS strategic agreement, signed April 10, 2025, gives Vast access to the ISS National Lab's customer
              pipeline and operations expertise, positioning Vast to transition CASIS-connected researchers to Haven-1
              Lab when the station is ready. The ESA MOU, signed June 6, 2024, is explicitly non-binding and exploratory
              but signals European Space Agency interest in future commercial station partnerships; Giorgio Saccoccia,
              Vast's new President Europe, was formerly ESA Director General, directly linking ESA institutional
              relationships to Vast's business development pipeline. A Czech Republic MOU was announced November 2024,
              and Vast Japan GK was established December 11, 2025 with former JAXA astronaut Naoko Yamazaki as General
              Manager. These regional moves create government outreach channels across Europe and the Asia-Pacific,
              though none beyond PAM-6 has produced a binding commercial commitment as of runDate.
