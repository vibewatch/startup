      - number: '3.2'
        title: 'Competitor Profiles: Axiom Space, Starlab, and Orbital Reef'
        blocks:
          - type: paragraph
            body: >
              **Axiom Space** occupies the strongest competitive position in the CLD landscape as of May 2026. Its NASA
              firm-fixed-price IDIQ contract—a procurement vehicle rather than an SAA—provides more durable governmental
              revenue and greater visibility into NASA's funding and design acceptance cadence than any competitor.
              Axiom has conducted four private astronaut missions to the ISS (AX-1 through AX-4), flown 12 paying
              customers and 166 revenue payloads, and established an end-to-end commercial human spaceflight track
              record that no other CLD entrant matches. Axiom's assembly sequence was revised to accelerate free-flying
              capability: the Payload, Power and Thermal Module (PPTM) will now launch first, enabling Axiom Station to
              depart ISS as early as 2028 and operate as a free-flying destination before adding Hab 1, an airlock, Hab
              2, and a Research and Manufacturing Facility. Module manufacturing by Thales Alenia Space is
              underway—primary structures being welded and machined as of the axiomsspace.com update accessed May
              2026—and the critical design review was completed in 2024. Axiom's principal limitation is timeline risk:
              operational capability is planned for 2028, trailing Haven-1's Q1 2027 target by 12–18 months, and its
              phased ISS-attachment strategy carries deorbit-transition complexity.


              **Starlab Space** is a US-led joint venture whose ownership structure as of end-2025 includes Voyager
              Technologies (61.9%), Airbus, Mitsubishi Corporation (joined April 2024), MDA Space (joined May 2024), and
              Palantir as an enterprise software partner (joined June 2024). Starlab received $218M in Phase 1 funded
              SAA from NASA (of which $183M was disbursed by March 2026) and targets a 2029 single-launch deployment on
              SpaceX Starship. Its preliminary design review and safety review are complete; detailed design and CDR are
              the next gate milestones. A full-scale, high-fidelity station mockup is under construction at NASA's
              Johnson Space Center Space Vehicle Mockup Facility. Commercial demand signals are the strongest in the
              peer group: as of March 2026, Starlab had fully booked its commercial payload capacity, including Yuri
              securing the entire first year of commercial operations, generating $6M in booking backlog. Northrop
              Grumman provides Cygnus cargo logistics, and Hilton is designing crew quarters. The $90M Starship launch
              contract (disclosed in Voyager's 10-K) is competitively priced but represents single-source concentration
              in SpaceX, a dependency shared with Vast. Voyager Technologies is publicly traded (VOYG) with a May 2026
              market cap of approximately $2.37B, providing a partial capital-market reference for the JV.


              **Orbital Reef** (Blue Origin as program lead, Sierra Space as principal commercial partner) completed its
              Phase 1 funded SAA milestones including human-in-the-loop testing, during which participants evaluated
              day-in-the-life operations in full-scale mockups of crew quarters, dining, laboratory, and berthing areas.
              ESA signed an MOU with Blue Origin and Thales Alenia Space in June 2025 for potential European payload
              hosting and crew missions—mirroring the ESA MOU Vast holds. Sierra Space separately raised $550M in a
              Series C (March 2026) at an $8B valuation, bringing total capital to $2B since 2021, and has pivoted
              meaningfully toward defense (Sierra Space Defense division, SDA Tranche 2 satellite structures contract).
              Orbital Reef's public milestone cadence has been lower than Axiom's or Starlab's since late 2024, and no
              CDR completion has been publicly announced as of May 2026. Boeing remains a partner, but no major Boeing
              station hardware milestones have been publicly disclosed.
