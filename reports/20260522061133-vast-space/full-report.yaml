    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Categories, Entrants, and Market Structure'
        blocks:
          - type: paragraph
            body: >
              The post-ISS commercial LEO station market has four categories of competitive alternative that Vast must
              navigate: (1) direct free-flyer commercial peers funded by NASA's CLD program, (2) Axiom Station's hybrid
              ISS-attached-then-free-flying model which anchors the near-term transition, (3) the ISS itself and any
              legislative extension as a status-quo substitute, and (4) China's Tiangong as a geopolitical pressure on
              pace rather than a direct commercial rival.


              The three primary direct competitors are Axiom Space (Houston), Starlab Space (a joint venture led by
              Voyager Technologies), and Orbital Reef (Blue Origin and Sierra Space). All four commercial
              entrants—Axiom, Starlab, Orbital Reef, and Vast—have been engaged under NASA's CLD framework, though at
              markedly different levels of governmental financial support. Axiom holds a firm-fixed-price,
              indefinite-delivery, indefinite-quantity contract with NASA, making it the only player with a formal
              procurement relationship rather than a Space Act Agreement. Starlab and Orbital Reef hold Phase 1 funded
              SAAs ($218M and $130M respectively). Vast holds only an unfunded SAA awarded through the CCSC-2 initiative
              in 2023.


              NASA's revised Phase 2 strategy (August 2025 directive) calls for awarding funded SAAs to a minimum of
              two—preferably three or more—providers. This multi-provider model means the market is not a
              winner-takes-all competition for CLD Phase 2 in the near term, but the Phase 2 budget of $272.3M for
              FY2026 and $2.1B over five years is finite, making priority order among providers materially important.
              Critically, as a Phase 1 CCSC-2 entrant rather than a Phase 1 funded SAA recipient, Vast enters Phase 2
              competition with no prior NASA milestone disbursements—a structural capital disadvantage at a stage when
              hardware manufacturing is the gating constraint.


              The status-quo substitute—an extended ISS—represents a meaningful risk. In March 2026, a Senate NASA
              authorization bill extending ISS operations two years to 2032 cleared the Senate Commerce Committee; if
              enacted, it reduces the urgency for commercial stations and extends the window in which Axiom's hybrid
              model (modules attached to ISS) remains viable, potentially slowing the transition timeline that Haven-1
              is designed to capture. Tiangong, China's government-funded station continuously crewed since 2022,
              provides geopolitical context but is not a commercial substitute for Western commercial space users.
