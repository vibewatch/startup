      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependencies
        blocks:
          - type: paragraph
            body: >-
              Vast's leadership team combines serial-entrepreneur DNA with deep SpaceX operational heritage. Jed McCaleb
              (Founder, Board Chair & Tech Fellow) is renowned for co-founding Ripple and Stellar and serves as the
              company's primary financial backer. Max Haot has served as CEO since August 2023, having joined via the
              Launcher acquisition; he previously founded and exited Launcher (acquired by Vast), Mevo (acquired by
              Logitech), and Livestream (acquired by IAC/Vimeo). Alex Hudson joined as the first CTO in August 2023,
              having most recently served as Vice President of Avionics at SpaceX where he led Dragon avionics through
              Demo-2. Kris Young joined as COO in September 2025 with 14+ years at SpaceX, where he led all 19 Dragon
              human spaceflight missions as Mission Director and Director of Space Operations. Caryn Schenewerk serves
              as Chief Policy Officer, bringing experience from Relativity Space (VP Regulatory and Government Affairs)
              and a decade at SpaceX.

              An astronaut advisory corps—led by former NASA astronaut chief Drew Feustel, with Megan McArthur, Garrett
              Reisman, and JAXA astronaut Naoko Yamazaki—provides crew operations perspective. A.C. Charania, former
              NASA Chief Technologist, joined the board via Balerion Space Ventures as part of the March 2026 financing.
              Board composition beyond these publicly named individuals is not disclosed.

              Key-person dependencies are material on two axes. First, Jed McCaleb has been the dominant source of
              capital since 2021, with Forbes reporting he stated willingness to spend up to $1 billion of personal
              wealth; any change in McCaleb's support posture before external revenue materializes would be highly
              disruptive. Second, the operational C-suite is concentrated in SpaceX alumni whose retention and alignment
              is critical to Haven-1 execution; departure of Haot, Hudson, or Young concurrently would represent a
              severe execution risk.
