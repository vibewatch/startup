      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Flight-Proven Subsystems Via Haven Demo
            body: >
              Haven Demo's successful completion of 49 on-orbit test objectives and controlled deorbit provides Vast
              with validated GNC algorithms, Impulse Space Saiph thruster performance data, avionics reliability
              confirmation, and a refined HITL test asset — capabilities that competitors building stations from scratch
              lack entirely.
            calloutType: strength
            claimRefs:
              - CE013
              - CE014
              - CE017
          - type: callout
            title: SpaceX Dependency Is a Concentration Risk
            body: >
              Three separate critical systems — launch (Falcon 9), crew transport (Dragon), and primary broadband
              (Starlink) — are all contracted with SpaceX. A pricing change, vehicle suspension, or commercial dispute
              at SpaceX could affect Haven-1's operational viability. No backup supplier is publicly contracted for any
              of these three functions.
            calloutType: risk
            claimRefs:
              - CE036
              - CE041
          - type: callout
            title: Open-Loop ECLSS Limits Mission Duration
            body: >
              Haven-1's environmental control and life support system is open-loop: oxygen is replenished from
              consumables, and CO₂ is scrubbed by sorbent materials that require replacement. This design supports
              two-week crew rotations with resupply, but is not suitable for long-duration operations without a
              closed-loop regenerative upgrade — which is planned for Haven-2 but not yet demonstrated or designed in
              detail.
            calloutType: risk
            claimRefs:
