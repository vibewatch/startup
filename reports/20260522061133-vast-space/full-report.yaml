  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Demand Channels
        blocks:
          - type: paragraph
            body: >
              Vast's customer base spans three structural demand channels converging on microgravity access. The first
              is commercial payload research, where life-sciences firms, pharmaceutical companies, and
              advanced-materials researchers lease MLE slots on Haven-1 Lab to conduct experiments in weightlessness
              that are impossible or prohibitively expensive on the ground. The second is institutional and government,
              encompassing NASA private astronaut missions, national space agency MOUs, and ISS National Lab pathways
              that bring publicly funded researchers to orbit. The third is industrial in-space services, where
              technology demonstrators and manufacturing firms test products or processes in the space environment.

              Within commercial payload research, all five publicly confirmed Haven-1 Lab partners operate in life
              sciences—cell biology (Yuri, Exobiosphere), pharmaceuticals and bioprocessing (Redwire ADSEP4), and
              astrobiology (Interstellar Lab)—creating a sector-concentrated pre-launch portfolio. Government and
              institutional demand is formalized through PAM-6 with NASA, the CASIS strategic agreement, and the ESA
              MOU. The SpaceX/Vast joint RFP, which offers research access at no cost to selected investigators, widens
              the top of the customer funnel toward academic and smaller commercial research teams. Vast's regional
              expansion into Japan (Vast Japan GK, December 2025) and Europe (Giorgio Saccoccia, President Europe)
              signals intent to diversify geographically across all three demand channels. Haven-1 Lab payload partners
              span four countries—USA, Germany, Japan, and France—indicating multi-regional early demand even though all
              operate in adjacent verticals.
