      - number: '6.2'
        title: Haven-1 Lab Payload Partners and Commercial Pipeline
        blocks:
          - type: paragraph
            body: >
              Haven-1 Lab is the commercial microgravity research, manufacturing, and development platform occupying the
              forward bay of Haven-1. As of runDate, Vast has publicly named five payload partners that have reserved
              capacity across the lab's MLE slots. Each slot provides up to 100 W of electrical power and is remotely
              commandable via the onboard SpaceX Starlink laser terminal, enabling investigators to monitor and operate
              experiments without requiring a crew member in the loop for routine science operations.

              Redwire Space brings ADSEP4, an automated drug-suspension system extending Redwire's prior ISS work on
              bioreactor and pharmaceutical crystallization payloads. Yuri, a German-based microgravity services company
              that has already flown 151 space labs for 61 customers on 4 continents, contributes ScienceTaxi—a modular
              cassette system that hosts multiple investigators within a single MLE footprint. JAMSS, Japan Manned Space
              Systems Corporation and "Asia's first payload partner" for Haven-1, contributes a multi-purpose payload
              aimed at Japanese pharmaceutical and materials companies. Interstellar Lab contributes Eden 1.0, a
              controlled-environment plant-growth chamber targeting astrobiology and food-tech applications.
              Exobiosphere contributes its Orbital High-Throughput Screening (OHTS) platform, which gained a
              Cedars-Sinai research collaboration in April 2026.

              Vast stated in April 2025 that Haven-1 Lab was "nearing full capacity," implying the majority of its 8 MLE
              slots were committed. The SpaceX/Vast joint RFP offers research access at no cost to selected
              investigators through a competitive selection process, expanding the addressable funnel beyond partners
              with commercial research budgets.
