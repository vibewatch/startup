      - number: '4.2'
        title: Revenue Model and Near-Term Commercial Strategy
        blocks:
          - type: paragraph
            body: >-
              Vast is best characterized as a pre-revenue development-stage company in its core space-station business
              as of the run date. Its revenue model is structured around three overlapping horizons.


              Near-term (2027–2028): The primary commercial event is Vast's first private astronaut mission (PAM) to the
              ISS, awarded by NASA on 12 February 2026 and targeted for no earlier than summer 2027. Crew operations
              aboard Haven-1 will generate mission-based fees from seat sales and research payload hosting. The company
              has a strategic agreement with CASIS (manager of the ISS National Lab) to channel research throughput to
              PAM missions. Pricing for PAM seats is undisclosed; proxy is Axiom Space's $55M per seat on earlier ISS
              PAMs, suggesting a 4-seat mission could generate gross revenue in the $150–$220 million range, but the
              actual commercial split between Vast and SpaceX (who operates the Dragon transport) is unknown, and NASA's
              contract structure for the PAM award may cap or share that revenue.


              Medium-term (2028–2030): Haven-1 lab operations, microgravity research services, and subsequent PAM rounds
              are the primary revenue drivers. Haven-2's first module is targeted for 2028 launch. The company's ability
              to generate meaningful revenue in this window depends on winning the NASA CLD Phase 2 funded Space Act
              Agreement (SAA). The August 2025 NASA CLD directive allocated $272.3 million for FY2026 and $2.1 billion
              over five years for CLD development awards, with at least two—preferably three or more—providers expected
              to receive funded SAAs. NASA's role shifts to "anchor services customer" rather than owner-operator.


              Longer-term optionality: CEO Max Haot stated at the ASCENDxTexas conference (February 2026) that internal
              projections carry "close to zero dollars for the LEO economy in the next five years," indicating that
              manufacturing, pharmaceuticals, and other LEO commercial verticals are not embedded in near-term financial
              plans. Vast Satellite, launched May 2026, represents a newly announced revenue stream in high-power
              satellite buses; the first sale covers four satellite buses to a confidential customer with an option for
              200 additional units, but unit pricing and timing of deliveries are undisclosed. The satellite line
              leverages shared Haven-Demo-derived subsystems and vertically integrated manufacturing infrastructure.
