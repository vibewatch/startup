  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Haven-1 System Architecture and Subsystems
        blocks:
          - type: paragraph
            body: >
              Haven-1 is a single-module commercial space station designed for four-person crews on two-week missions.
              The pressurized structure is an aluminum cylinder 4.4 m in diameter and 10.1 m tall, enclosing 45 m³ of
              habitable volume within 80 m³ of total pressurized volume, at a launch mass of 14,600 kg. It targets a
              51.6° inclination orbit at 425 km altitude, broadly compatible with the ISS orbital plane to simplify
              rendezvous planning.

              Power comes from twelve deployable solar array wings supplied by Spanish manufacturer DHV Technology, each
              producing 1.1 kW for a peak total of 13.2 kW, supplemented by in-house battery modules assembled through
              cell screening, pack assembly, and testing. The triple-junction photovoltaic cells are optimized to
              capture a broad spectral range. Solar array electroluminescence testing was performed at Vast HQ to verify
              cell viability.

              Attitude control relies on six in-house-designed control moment gyroscopes (CMGs), each consisting of a
              fast-spinning flywheel on an articulated gimbal. Propulsion is provided by Impulse Space's Saiph thruster
              system — a storable N₂O/ethane propellant combination driving RCS thrusters for CMG augmentation and
              dedicated deorbit thrusters for end-of-life disposal. The Saiph thruster was already qualified before
              Haven-1 selection and carried additional flight heritage from Haven Demo's in-orbit test burns in January
              2026.

              Docking uses a passive International Docking Adapter (IDA) that completed a fit-check with SpaceX Dragon
              hardware in October 2025. Communications rely on a SpaceX Starlink laser terminal providing gigabit-speed,
              low-latency Internet for crew devices, payload racks, and external cameras, plus a redundant
              GEO/ground-station RF pathway tested on Haven Demo. A 1.1 m domed observation window occupies the aft face
              of the Common Area and doubles as a structural element with micrometeoroid and orbital debris (MMOD)
              shielding.

              Haven-1 Lab occupies the forward bay with ten Middeck Locker Equivalent (MLE) payload slots capable of
              remote commanding and monitoring via Starlink. Payload partners including Redwire, Yuri, JAMSS,
              Interstellar Lab, and Exobiosphere have reserved capacity described as nearing full as of April 2025.
              Thermal control uses additively manufactured cold plates that conduct heat from avionics into a fluid
              loop, with thermal radiators installed during Phase 3 integration.
