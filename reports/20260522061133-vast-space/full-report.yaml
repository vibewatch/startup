      - number: '7.5'
        title: Supplier and Demand Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Vast's supplier concentration is concentrated in SpaceX across three independent dimensions: (1) SpaceX's
              Falcon 9 is the sole launch vehicle; (2) Crew Dragon is the exclusive crew transportation and life support
              provider; and (3) Starlink is Haven-1's sole communications infrastructure. This triple dependency means a
              single operational decision by SpaceX—whether a manifest reprioritization, a vehicle anomaly response, or
              a change in commercial terms—could simultaneously affect launch, crew access, and connectivity. SpaceX's
              early 2026 shift of all Dragon missions from LC-39A to SLC-40 to prioritize Starship infrastructure work
              at the former pad introduces a manifest crowding dynamic that adds scheduling risk to the Dragon launch
              needed for Vast-1. An October 2024 NASA Aerospace Safety Advisory Panel warning that SpaceX must "maintain
              focus" on Dragon safety after a series of Falcon 9 anomalies and a parachute performance observation adds
              a safety-regulatory dimension to this dependency.


              Impulse Space is the sole-source propulsion vendor. No backup propulsion vendor has been identified
              publicly, and Impulse's delivery schedule has not been disclosed. AnySignal, TRL11, and Addvalue provide
              radio-frequency connectivity services alongside Starlink. On the demand side, Vast has one fully
              contracted crew mission (Vast-1) and one reserved via deposit, with two additional missions "envisioned"
              but not contracted. CEO Haot confirmed the company is in deep negotiations with private individuals and
              nation-states for missions 2-4 but cannot announce names. The revised Q1 2027 launch timeline makes
              finalizing those customer commitments increasingly urgent: crew training requires six months to one year,
              meaning customer selection for missions 3-4 must occur in the next several months to maintain schedule.
            claimRefs:
