      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Series A Investor Syndicate Signals Strategic Validation Beyond Financial Return
            body: >-
              The composition of Vast's March 2026 Series A—IQT (CIA venture arm), QIA (sovereign wealth), Mitsui and
              MUFG (Japanese industrials), Nikon (precision manufacturing)—suggests a capital syndicate with strategic,
              geopolitical, and industrial motivations that extend beyond pure financial return. This investor mix
              typically reduces near-term liquidation pressure and signals confidence that Vast's programme has been
              reviewed by technically sophisticated due-diligence processes. For valuation purposes, it supports the
              view that the implied mark reflects informed capital, not speculative momentum.
            calloutType: strength
            claimRefs:
              - CV002
              - CV003
              - CV038
              - CV039
          - type: callout
            title: 'CLD Phase 2 Is a Binary Catalyst: Bull and Bear Cases Diverge by More Than $3 Billion'
            body: >-
              The most important fact for any investor evaluating Vast is that the bull case and bear case diverge by
              more than $3 billion in implied equity value, and the determining event is a single government procurement
              decision expected in mid-2026. In the bull case (Phase 2 win), equity could be worth $3.5–5 billion within
              two years. In the bear case (Phase 2 loss), equity could fall to $0.5–1.5 billion. At the current implied
              $2.3 billion mark, buying before award resolution means accepting a return profile that is not clearly
              positive in expected-value terms unless the investor's subjective probability of a Phase 2 win exceeds
              approximately 60–65%.
            calloutType: risk
            claimRefs:
              - CV024
              - CV026
              - CV028
              - CV031
          - type: callout
            title: 'research-more: Revisit at CLD Phase 2 Award Announcement'
            body: >-
              The recommended posture is research-more with a specific re-evaluation trigger: the NASA CLD Phase 2
              funded SAA announcement, expected mid-2026. At that point, the binary risk resolves, revenue certainty
              improves, and the investment case can be assessed with materially better inputs. Investors with existing
              positions should track; new capital should not be committed at the current implied price without confirmed
              cap-table terms and CLD Phase 2 probability estimates from a direct Vast management conversation.
            calloutType: recommendation
            claimRefs:
              - CV042
              - CV031
