        - >-
          Removes primary revenue anchor for Haven-2; raises bridge-financing need; equity value drops to bear case
          range ($0.5–1.5B)
        - >-
          Evaluate bridge terms; assess whether Vast pivots to Haven-1 commercial model or strategic sale; consider
          impairment
      - - Haven-1 launch failure or major anomaly
        - Launch vehicle anomaly or on-orbit failure before operational status; Q1 2027
        - >-
          Destroys Haven-1 asset; eliminates PAM mission; requires insurance payout and programme restart; equity
          write-down likely
        - >-
          Confirm launch insurance terms; assess whether Haven-2 programme remains viable; likely blocking event for
          near-term thesis
      - - McCaleb disengagement or force majeure
        - Founder withdraws further capital commitment or exits governance role unexpectedly
        - Removes last-resort capital backstop; accelerates equity raise pressure; potential panic among co-investors
        - >-
          Monitor governance announcements; assess whether co-investors can substitute capital; review investor
          agreement protections
      - - SpaceX Dragon safety hold or availability disruption
        - NASA or SpaceX suspends Dragon crew operations for extended period exceeding 12 months
        - >-
          PAM mission delayed or cancelled; Haven-1 crew operations deferred; revenue timeline pushed by 1–2 years;
          valuation compression
        - Review SpaceX Dragon manifest and NASA safety panel status; assess Vast contractual flexibility
      - - Debt covenant breach or maturity default
        - $200M debt terms revealed as restrictive; covenant triggered by CLD loss or cash draw; maturity accelerated
        - >-
          Equity subordinated to debt recovery; Series A value impaired; potential forced sale or dilutive rescue
          financing
        - Require full debt term disclosure in due diligence; model covenant headroom under bear case assumptions
    notes: >-
      Kill criteria are triggers requiring immediate re-evaluation of the investment thesis. Thresholds defined as
      observable events. All require ongoing monitoring rather than discrete single observation.
    claimRefs:
      - CV028
      - CV031
      - CV034
      - CV040
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Post-money equity valuation
        - Confirmed cap table showing post-money equity valuation per-share and investor terms sheet
        - >-
          The $2.3B implied figure rests on secondary reporting; the actual mark drives all relative-value analysis and
          LP reporting
        - >-
          Direct investor conversation with Balerion, QIA, or IQT; direct ask to Vast IR; review any investor FAQ
          materials
      - - Debt term sheet
        - >-
          $200M debt maturity schedule, coupon or PIK structure, covenant package, security interest, and trigger
          conditions
        - >-
          Debt terms determine equity cushion in bear case; undisclosed covenants could limit operational flexibility or
          accelerate maturity
        - >-
          Request from Vast directly or through a credentialed intermediary; bond counsel review if the instrument was
          registered
      - - CLD Phase 2 competitive submission
        - >-
          Vast's Phase 2 proposal summary or public statement on competitive positioning; NASA scoring methodology and
          award timeline
        - >-
          Phase 2 is the dominant near-term value catalyst; probability estimation without access to the competitive
          evaluation framework is imprecise
        - >-
          Monitor NASA acquisitions portal; review any Congressional testimony; direct management conversation on
          competitive confidence
      - - Haven-1 launch schedule and insurance
        - >-
          Confirmed SpaceX Falcon 9 launch window; launch insurance coverage amount; Dragon crew contract payment
          milestone terms
        - >-
          Launch schedule directly determines PAM mission timing and first revenue event; insurance protects the primary
          asset against loss
        - >-
          Review manifest disclosures; request launch insurance term sheet; confirm PAM contract payment milestones with
          Vast
      - - Vast Satellite bus commercial terms
        - >-
          Customer identity; pricing per bus unit; delivery schedule; whether 200-unit option has been exercised or
          priced
        - >-
          Satellite bus revenue could partially de-risk the bear case if pricing is material and orders accelerate;
          currently undisclosed
        - >-
          Request customer reference or proxy financial terms; review Morningstar and BusinessWire announcement details
          for any data
      - - Burn rate and cash position post-close
        - Confirmed monthly operational burn rate as of Q1 2026; cash and equivalents on balance sheet post-March-close
        - >-
          Runway estimate is analyst-derived; actual burn determines whether capital adequacy thesis holds to CLD Phase
          2 award date
        - >-
          Data room access; direct Vast CFO conversation; proxy evidence from headcount trajectory and facility
          expansion announcements
    notes: >-
      Diligence asks reflect information gaps that materially affect valuation confidence. Items ranked approximately by
      decision-criticality for a prospective financial investor.
    claimRefs:
      - CV006
      - CV010
      - CV012
      - CV041
