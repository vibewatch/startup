- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value or status
  - Quality
  - Diligence ask
  rows:
  - - Biopharma / manufacturer partnerships
    - Commercial programs tied to launch support, enrollment workflows, and medication-access services
    - Program / contract
    - Disclosed indirectly; five of top 10 global biopharma companies already work with Forus
    - 'Medium-high: most supportable public revenue stream but pricing is private'
    - Request current manufacturer roster, contract duration, ACV, and share of revenue
  - - Manufacturer support programs
    - Hub enrollment, bridge programs, PAP enrollment, and custom journeys inside the platform
    - Per program / workflow
    - Operational support is disclosed; commercial terms are not
    - 'Medium: workflow evidence is strong, realized pricing unknown'
    - Request fee structure by program type and gross margin by workflow
  - - Life-sciences analytics / launch insights
    - Network insight on where providers get stuck, where patients drop off, and how medicines perform across populations
    - Analytics / launch services
    - Supportable inference from official language; not disclosed as a separate line item
    - 'Medium: plausible monetization extension, still inferred'
    - Request whether analytics revenue exists and whether it is subscription, services, or bundled
  - - Provider workflow automation
    - Prior auth, appeals, affordability support, and routing embedded into physician workflow
    - Per practice / per provider
    - Publicly disclosed as free to providers
    - 'Low direct revenue quality: strong adoption driver but not a billed stream'
    - Confirm whether any enterprise providers, employers, or health systems pay platform fees
  - - Patient support and affordability assistance
    - Texts, savings support, financial assistance, and pharmacy routing
    - Per prescription / case
    - Publicly disclosed as free to patients
    - Low direct revenue quality for Forus; supports adoption and partner value
    - Request any patient-support reimbursement, success fees, or referral economics
  - - Employer contracts
    - Unknown
    - Unknown
    - No reviewed public evidence of employer-paid contracts or employer-specific pricing
    - Unknown
    - Ask management explicitly whether any employer or self-insured employer revenue exists
  notes: Rows separate disclosed streams from inferred ones; employer monetization remains an evidence gap, not a negative proof.
