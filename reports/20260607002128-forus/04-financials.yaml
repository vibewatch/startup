- id: traction-unit-economics
  title: Growth signals and unit-economics proxies
  body: 'Forus discloses unusually strong adoption signals for a private company, but they are still proxies rather than a full operating model. Official sources say provider adoption grew 10x year over year for each of the last two years, the platform is used by thousands of practices and health systems in all 50 states, and it supports patients in nearly 80% of U.S. zip codes and millions of patients annually. Forbes adds the key financial anchor: annualized revenue surpassed $10 million by year-end and is now tracking above $50 million. Pair that with management''s statement that the company has about 100 engineers and operators in New York, and the implied annualized revenue per employee is already above $500,000. That is a useful efficiency signal, but it is not equivalent to ARR, gross margin, or free cash flow. Customer case studies sharpen the picture: Family Allergy cites median approval time of 1.1 days and 70% lower administrative workload; Nimbus says Forus saved hundreds of
    staff hours and removed the need to hire dedicated staff for a new Zepbound program; GI, dermatology, and GPO users report materially higher throughput and lower overhead. These outcomes support sales efficiency and retention logic, but public CAC, payback, NRR, and gross margin remain undisclosed.'
