  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway
    missingEvidence: Current cash balance, monthly burn, and management runway case.
    whyItMatters: Without these inputs the company cannot be underwritten for financing dependency or downside resilience.
    diligencePath: Request bank balance, monthly cash-flow statement, and board runway deck for the last six quarters.
    relatedQuestionRefs:
    - QI019
    - QI020
    - QI027
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Revenue by stream, top customer concentration, and realized pricing for manufacturer programs or any other paying counterparties.
    whyItMatters: The business appears free on the provider and patient side, so concentration and pricing on the paying side are central to revenue quality.
    diligencePath: Request revenue mix by stream and top-10 customer concentration with contract terms.
    relatedQuestionRefs:
    - QI003
    - QI004
    - QI023
    - QI025
    - QI027
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, NRR, and cohort performance by specialty or customer type.
    whyItMatters: These are the key variables for judging whether current growth is efficient, durable, and worth the reported valuation.
    diligencePath: Request full cohort model, sales-efficiency dashboard, and gross-margin bridge used internally by finance.
    relatedQuestionRefs:
    - QI021
    - QI022
    - QI027
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: employer-monetization
    missingEvidence: Any contract, case study, or pricing evidence showing employer or self-insured-plan monetization.
    whyItMatters: The user requested employer-contract coverage, but the reviewed public record does not substantiate that stream.
    diligencePath: Ask management directly whether employers, payers, PBMs, or plans pay Forus and collect exemplars if they do.
    relatedQuestionRefs:
    - QI004
    - QI027
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-and-liabilities
    missingEvidence: Debt schedule, any warehouse or project-finance obligations, and off-balance-sheet commitments.
    whyItMatters: Undisclosed liabilities could compress runway or change the economics of a future financing.
    diligencePath: Request debt schedule, covenant package, lease abstracts, and any financing agreements.
    relatedQuestionRefs:
    - QI019
    - QI027
    relatedTableRefs:
    - TI004
    - TI005
  - type: access-blocked
    severity: minor
    topic: registry-output
    missingEvidence: Company-specific entity extract or filed-document copies from official registry portals.
    whyItMatters: The official SEC and Delaware search tools are accessible, but entity-level extraction was not completed in this pass, so filing-backed governance checks remain incomplete.
    diligencePath: Run manual entity lookup with the exact legal name and preserve the resulting registry output in the data room.
