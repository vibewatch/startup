- id: disclosure-limits
  title: Disclosure limits, adverse signals, and underwriting verdict
  body: 'The remaining diligence blockers are not small polish items; they are the core inputs needed for financial underwriting. No reviewed public source discloses cash balance, burn, runway, gross margin, CAC, payback, NRR, customer concentration, or realized pricing by manufacturer program. Employer contracts are also not publicly supported, so any claim that Forus already monetizes employers would be speculative. The adverse evidence in this chapter comes from Forus'' own privacy disclosures: the public website policy says the company may sell anonymized data and aggregated insights to customers and other third parties, and the provider portal policy says provider information can be disclosed to patients, manufacturers, and other users in the course of service delivery while marketing communications may be handled by third parties. Those disclosures can be read two ways at once: they reinforce the monetization thesis around manufacturer-facing data and workflow services, but they also
    create privacy, governance, and commercialization diligence risk. Financial verdict: disclosed evidence points to strong adoption, a biopharma-led monetization path, and lower near-term financing pressure after the 2026 raise; however, revenue quality, margin path, and runway still require management materials before the business can be fully underwritten.'
