chapter:
  number: 4
  title: Financials
  summary: Forus' public financial picture is strong enough to support a biopharma-led monetization thesis and lower near-term financing risk after a 2026 $160M+ raise, but revenue mix, margins, burn, runway, and employer-side monetization remain private and materially block a full underwrite.
sections:
- id: revenue-model
  title: Revenue model and monetization architecture
  body: 'Disclosed public evidence supports one clear pricing fact: Forus does not charge providers or patients. Official company materials, the patient page, and the field-rep guide all say the product is free on the provider and patient side, while the same field-rep guide says industry partners support those workflows and that Forus works with manufacturers on custom enrollment journeys, hub enrollments, bridge programs, and PAPs. Combined with company claims that five of the top 10 global biopharma companies already work with Forus and that its network helps life-sciences companies design research and launch medicines more efficiently, the most supportable revenue hypothesis is biopharma-funded access enablement, launch support, and related insight services. That last step is inferred rather than directly disclosed. No reviewed public source published employer-contract revenue, provider subscription pricing, or a list-price card for manufacturer analytics, so revenue mechanism is directionally
    visible but stream mix and realized pricing remain private.'
