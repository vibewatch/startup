  columns:
  - Input
  - Value or status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Cash on hand
    - null
    - Low
    - Without cash balance, investors cannot size runway or downside protection
    - Request current cash balance and bank statements
  - - Monthly burn
    - null
    - Low
    - Burn determines how quickly the 2026 raise is consumed
    - Request monthly operating burn and quarterly cash-flow statements
  - - Runway months
    - null
    - Low
    - Runway is the key next-round timing input and is not public
    - Request management runway case under base / downside / hiring plan
  - - Total capital raised
    - '> $160M'
    - High
    - Fresh capital materially reduces short-term financing pressure
    - Confirm round-by-round proceeds, close dates, and secondary vs primary mix
  - - Latest valuation
    - $1B reported in 2026 coverage
    - Medium
    - Useful valuation anchor for relative financing posture, but not audited fair value
    - Request post-money, liquidation preferences, and any valuation step-ups after January 2026
  - - Office fixed-cost proxy
    - ~$3.0M annual asking-rent equivalent
    - Low-medium
    - Lease commitments help frame non-payroll fixed costs as the company scales
    - Confirm actual rent, concessions, TI package, and occupancy timing
  - - Planned use of funds
    - Grow network, deepen platform, build team
    - High
    - Signals where new capital will likely be deployed
    - Request budget allocation across R&D, GTM, operations, and facilities
  - - Debt / project finance obligations
    - No public disclosure identified
    - Low
    - Hidden debt could shorten runway or constrain future financing
    - Request debt schedule, covenants, and any off-balance-sheet obligations
