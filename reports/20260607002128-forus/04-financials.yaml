- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Evidence gap type
  - Exact diligence path
  rows:
  - - Cash balance and monthly burn
    - Cannot size runway, downside protection, or next-round timing
    - private-evidence-only
    - Request monthly cash-flow statement, bank balance, and board reporting pack for the last six quarters
  - - Revenue mix by manufacturer / provider / any employer stream
    - Cannot assess concentration, durability, or whether the free-side model depends on a small set of biopharma contracts
    - private-evidence-only
    - Request revenue by stream, top-10 customer concentration, and contract renewal schedule
  - - Realized biopharma pricing and gross margin by program
    - Cannot underwrite unit economics or margin path for the most likely paying stream
    - private-evidence-only
    - Request contract samples, price card exceptions, and contribution margin by workflow
  - - Gross margin, CAC, payback, and NRR
    - Blocks any durable software / services multiple analysis
    - private-evidence-only
    - Request cohort dashboard and finance model used internally for board and fundraising
  - - Employer or payer contract evidence
    - Public materials do not support employer monetization, so TAM and diversification claims are incomplete
    - missing-source
    - Ask management whether employer, payer, PBM, or health-plan contracts exist and provide exemplars
  - - Audited filings, debt schedule, and entity-level registry output
    - No public statements or filing-derived debt view were reviewed, limiting diligence on liabilities and governance
    - access-blocked
    - Provide audited statements, debt schedule, cap table, and corporate registry extracts directly in the data room
  notes: These gaps are structural blockers to underwriting, not cosmetic omissions; the chapter distinguishes what is disclosed, inferred, and still private.
