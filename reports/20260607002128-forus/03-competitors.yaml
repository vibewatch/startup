- id: TP004
  title: Distribution, neutrality, and switching-cost assessment
  columns:
  - Vendor / class
  - Main distribution asset
  - Neutrality posture
  - Primary lock-in vector
  - Forus implication
  rows:
  - - Forus
    - Embedded prescriber workflow plus payer/pharmacy/biopharma connectivity
    - High
    - Workflow data, provider habit, and cross-party network insight
    - Best positioned where providers want one front end across stakeholders
  - - CoverMyMeds
    - McKesson ownership plus large provider/pharmacy/EHR network
    - Moderate
    - Existing provider workflows and payer/pharmacy integrations
    - Hardest direct incumbent to displace in ePA-led accounts
  - - Availity
    - 170+ plans, 3.4M providers, payer trust, FHIR APIs
    - Moderate to high
    - Payer contracts, APIs, and provider portal dependence
    - Very strong where health plans shape workflow design
  - - Surescripts
    - Network Alliance across nearly all EHRs, PBMs, pharmacies, clinicians
    - Moderate
    - Embedded prescribing and benefit-intelligence rails
    - Can remain in the stack even when another vendor owns orchestration
  - - Myndshft
    - Rules library, covered-lives reach, and system integrations
    - Moderate
    - Payer rules engine and embedded automation into source systems
    - Competitive where buyers prioritize automated route selection over broad network brand
  - - TailorMed
    - Large provider/pharmacy/manufacturer affordability network
    - Moderate
    - Assistance network data and operational workflows
    - Can complement Forus or take the affordability layer away from it
  - - Epic-native
    - Installed EHR footprint and internal pharmacy queues
    - Low
    - Workflow habit, configuration effort, and staff training
    - Good enough substitute when organizations prefer local build over extra vendors
  - - Manual / in-house teams
    - Existing staff, payer portals, fax fallback, and local knowledge
    - High in theory, low in efficiency
    - Human workarounds and organizational inertia
    - Creates slow but persistent non-software competition
  notes: Neutrality scores are qualitative judgments derived from which stakeholder each vendor centers in public materials and where the commercial relationships appear strongest.
  enumerationScope:
    coverage: exhaustive
    basis: 'The assessment covers the main distribution models buyers can choose from: broad networks, payer-first infrastructure, specialty services, EHR-native workflow, or internal staff.'
