- id: differentiation-and-risk
  title: Forus differentiates on workflow depth and neutrality, but distribution remains the core risk
  body: |-
    Forus’s clearest differentiation is workflow depth plus stakeholder neutrality. Its official materials describe one flow spanning authorization, affordability, and routing, whereas most rivals start from a narrower constituency—payers in Availity, benefit intelligence in Surescripts, hub and services in AssistRx, affordability in TailorMed, or specialty enrollment in RxLightning. Forus also advertises free usage to providers and patients; in the retained public pack, only CoverMyMeds and RxLightning make similarly explicit no-cost provider claims. That combination makes Forus especially attractive to provider organizations that want one front-end workflow rather than a payer tool plus a pharmacy tool plus a staff-heavy workaround.

    The adverse case is that network incumbents may matter more than workflow purity. CoverMyMeds brings McKesson scale and a giant provider-pharmacy footprint. Availity and Surescripts already control payer and prescribing rails. Epic can absorb more day-to-day work with native queues. Contract pricing, win rates, and true conversion benchmarks remain mostly private. The investment question is therefore not whether Forus solves a real pain point—it clearly does—but whether superior orchestration can turn into durable distribution before incumbents close the gap.
