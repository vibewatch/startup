  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Exact contract pricing, transaction economics, and revenue-share terms for Forus, TailorMed, AssistRx, Foundation Health, and Myndshft.
    whyItMatters: Public pricing opacity makes it hard to know whether Forus’s free-provider message converts into a real procurement advantage against enterprise incumbents.
    diligencePath: Request current pricing sheets, sample MSAs, and partner economics by customer type during diligence; compare provider-facing and counterparty-facing monetization side by side.
    relatedQuestionRefs:
    - QP024
    - QP029
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: win-loss-benchmarks
    missingEvidence: Vendor-neutral win rates, conversion metrics, and implementation outcomes versus CoverMyMeds, Surescripts, Availity, Epic-native teams, and other point solutions.
    whyItMatters: The public pack proves workflow claims and network size, but it does not prove that Forus is winning competitive evaluations or expanding share against incumbents.
    diligencePath: Request CRM win-loss data, renewal cohorts, named reference calls, and post-implementation cycle-time metrics segmented by incumbent displaced.
    relatedQuestionRefs:
    - QP022
    - QP028
    relatedTableRefs:
    - TP005
  - type: missing-source
    severity: minor
    topic: ehr-native-convergence
    missingEvidence: Independent adoption and performance benchmarks showing how far Epic-native prior authorization and specialty-routing workflows have progressed across health systems after CMS-0057-F.
    whyItMatters: This determines whether EHR-native workflows are a durable substitute or simply an interim layer that still leaves room for independent orchestration vendors like Forus.
    diligencePath: Interview pharmacy operations leaders at Epic sites, compare MSOT or central-PA usage rates, and test whether external orchestration still reduces manual work materially.
    relatedQuestionRefs:
    - QP027
    - QP029
    relatedTableRefs:
    - TP004
