- id: adjacent-and-substitute
  title: Adjacent challengers and substitutes win by owning narrower but painful segments
  body: |-
    Adjacent vendors compete by taking ownership of narrower but painful segments of the therapy-start workflow. AssistRx combines software, services, and selective-pharmacy-network operations for manufacturer-sponsored support. RxLightning digitizes specialty, PAP, and hub enrollments and makes a strong free-to-prescriber pitch. TailorMed brings enormous affordability and adherence reach across hospitals, clinics, and pharmacies, making it more complementary than fully substitutive in some accounts but highly relevant whenever affordability is the gating bottleneck. Foundation Health is closer to a specialty-pharmacy operating system, spanning benefits investigation, test claims, prior authorization, appeals, and patient communication.

    Epic-based substitutes are improving and deserve respect. Iowa documents prospective and retrospective medication prior authorization inside Epic, while UTMB reports that MSOT plus Compass Rose reduced manual handoffs and improved continuity from prescribing through dispensing. Even so, these substitutes still depend on local configuration, pharmacy teams, and external data sources. That is why vendors such as Cohere still argue that portals and orchestration layers remain necessary while EHR-native adoption catches up.
  claimRefs:
