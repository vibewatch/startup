- id: TP003
  title: Pricing and packaging comparison
  columns:
  - Vendor
  - Public pricing signal
  - Primary economic buyer in source pack
  - Packaging cue
  - Evidence from retained sources
  - Implication
  rows:
  - - Forus
    - Free to providers and patients
    - Biopharma and network participants implied
    - Single orchestration workflow inside prescriber flow
    - Homepage markets free provider and patient access
    - Aggressive adoption lever for practices, but monetization depends on counterparties
  - - CoverMyMeds
    - No cost to providers and staff
    - Network-side participants / enterprise stakeholders implied
    - ePA plus medication-access solutions
    - Prior-authorization page explicitly says no cost to providers
    - Strong incumbent response to free-provider positioning
  - - Availity
    - Essentials free; Essentials Plus nominal charge; enterprise automation not listed
    - Providers and health plans
    - Portal, APIs, and intelligent UM modules
    - Eligibility page shows free vs nominal tiers; AuthAI is sold as enterprise workflow
    - Pricing is more tiered and enterprise-oriented than Forus’s simple free-to-provider message
  - - RxLightning
    - No cost to prescribers and staff
    - Specialty pharmacies, biotech, and manufacturers
    - Standalone portal plus API / branded integrations
    - FAQ says provider access is free and partner funded
    - Directly competes on free front-end onboarding for specialty medication workflows
  - - TailorMed
    - Not disclosed in retained public sources
    - Providers, pharmacies, life sciences
    - Core platform plus service and manufacturer modules
    - Home and company pages emphasize modules and network, not list pricing
    - Likely enterprise sales motion and longer procurement cycle
  - - AssistRx
    - Not disclosed in retained public sources
    - Life sciences and provider programs
    - Tech + talent + pharmacy-network bundle
    - Solutions pages emphasize combined service model rather than rates
    - More services-heavy packaging can win where staffing is part of the need
  - - Foundation Health
    - Not disclosed in retained public sources
    - Health systems, pharmacies, plans, pharma
    - Modular AI operating system for pharmacy
    - Homepage is demo-led and modular, with no list pricing
    - Enterprise workflow sale rather than lightweight prescriber self-serve product
  notes: “Not disclosed” refers to the retained public source pack only; it is not a claim that no pricing exists in private contracts or sales collateral.
  enumerationScope:
    coverage: partial
    basis: Pricing remains opaque for most enterprise vendors, so the table compares public pricing signals and packaging cues instead of inventing contract values.
