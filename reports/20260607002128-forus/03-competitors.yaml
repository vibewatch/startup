- id: TP005
  title: Moat durability and competitive risk register
  columns:
  - Risk or moat question
  - Who benefits if this risk materializes
  - Evidence
  - Severity
  - Implication / diligence ask
  rows:
  - - Incumbent distribution outruns workflow depth
    - CoverMyMeds, Surescripts, Availity
    - Large disclosed networks and payer/EHR embed remain far bigger than Forus’s public scale disclosures
    - High
    - Request win-rate data by incumbent type and quantify where broad orchestration beats embedded rails
  - - Payer-side AI narrows differentiation
    - Availity and Myndshft
    - Both vendors market AI-driven authorization logic, transparency, and rules automation
    - Medium-High
    - Test whether Forus has superior automation on mixed medical/pharmacy benefits rather than only similar AI language
  - - Specialty workflow vendors absorb adjacent steps
    - AssistRx, TailorMed, Foundation, RxLightning
    - Each owns a narrower but painful segment such as affordability, enrollment, or specialty operations
    - Medium
    - Map which accounts want one vendor versus best-of-breed layers across affordability, services, and routing
  - - Epic-native progress reduces greenfield need
    - Epic plus internal teams
    - Iowa and UTMB show Epic can centralize PA and specialty routing more than before
    - Medium
    - Assess where Forus wins as an add-on versus where Epic-native configuration is now “good enough”
  - - Public pricing and ROI proof stay opaque
    - All enterprise vendors
    - Most retained sources avoid hard contract pricing or customer savings comparables
    - Medium
    - Request pricing sheets, implementation scopes, and realized throughput gains in diligence
  - - Manual substitute remains stubborn even after regulation
    - Internal teams and intake portals
    - CMS, AHA/AMA, and Cohere all show provider friction remains structurally high
    - Medium
    - Do not assume CMS policy automatically converts manual accounts into software-winner accounts
  notes: Severity reflects downside to Forus’s differentiation case, not downside to the healthcare system overall.
  enumerationScope:
    coverage: exhaustive
    basis: 'Rows capture the principal ways Forus’s moat could erode: stronger incumbent distribution, closing AI gaps, adjacent specialists, EHR-native improvement, private pricing opacity, and slow manual substitution.'
