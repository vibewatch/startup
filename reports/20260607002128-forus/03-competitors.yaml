tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Vendor / class
  - Category
  - Scale / ownership / funding signal
  - Primary buyer
  - Workflow emphasis
  - Key strength
  - Key limitation vs. Forus
  rows:
  - - Forus
    - End-to-end medication-access orchestrator
    - $160M raised; thousands of practices; ~100 engineers
    - Practices, health systems, biopharma
    - Authorization, affordability, and routing inside prescriber workflow
    - Broadest stated workflow depth; free to providers/patients; cross-party network
    - Smaller publicly disclosed installed network than incumbent rails
  - - CoverMyMeds / McKesson
    - Medication-access incumbent
    - McKesson-owned; 350+ EHRs; 50k+ pharmacies; 1M+ providers
    - Providers, pharmacies, health plans, PBMs
    - ePA, medication access, and integrated specialty onboarding
    - Huge provider/pharmacy footprint and strong existing workflow embed
    - Less obviously neutral than Forus and historically strongest in PA rather than all post-prescription steps
  - - Availity
    - Payer/provider network incumbent
    - Largest dual-sided network; 170+ plans; 3.4M providers
    - Health plans, providers, HITs
    - Eligibility, authorizations, utilization management
    - Payer-side distribution, neutrality messaging, FHIR-native connectivity
    - Less focused on fulfillment routing and affordability orchestration
  - - Myndshft
    - AI automation challenger
    - 94% covered lives; 600+ payer rules; private company
    - Providers, pharmacies, payers, PBMs, manufacturers
    - Benefits, patient responsibility, insurance discovery, medical and pharmacy PA
    - Broad automation scope plus strong payer-rules story
    - Public evidence is more workflow-claim heavy than distribution-proof heavy
  - - Surescripts
    - Network and intelligence incumbent
    - 2M+ professionals and organizations; 1B RTPB responses in 2025
    - EHRs, PBMs, health systems, plans
    - RTPB, ePA, and specialty connectivity
    - Deepest embedded benefit-intelligence rail in prescribing workflow
    - Owns key rails but not every affordability and routing step
  - - AssistRx
    - Services-heavy specialty access vendor
    - 40+ life-sciences companies; millions of patients; hundreds of thousands of providers
    - Life sciences, hubs, providers
    - ePrescribing, eEnrollment, selective pharmacy network, adherence
    - Tech-plus-services model can solve operational gaps that software alone misses
    - Less neutral and more manufacturer-program oriented than Forus
  - - TailorMed
    - Affordability and medication-success platform
    - 75M+ patients; 3,100+ pharmacies; 950+ hospitals; 4,700+ clinics
    - Providers, pharmacies, life sciences
    - Affordability, access, adherence, manufacturer program activation
    - Largest disclosed affordability network in this source pack
    - Centered on affordability and assistance rather than pure prescriber routing
  - - Epic-native + internal PA teams
    - EHR-native substitute
    - Large installed EHR base; local build and staffing determine depth
    - Health systems and integrated delivery networks
    - Native ePA, RTPB, in-baskets, MSOT, patient management
    - Keeps work inside the system clinicians already use
    - Requires local configuration, staff coverage, and external data/network connections
  - - Foundation Health
    - Specialty pharmacy operating-system challenger
    - Private company; enterprise health-system focus
    - Health systems, pharmacies, plans, pharma
    - Benefits investigation, test claims, PA, appeals, patient communication
    - Very deep specialty-pharmacy workflow automation
    - Less evidence of broad multi-stakeholder network neutrality than Forus
  notes: Scale or funding cells use only retained public source signals; blanks are avoided by using ownership or network disclosures when exact funding is not public.
