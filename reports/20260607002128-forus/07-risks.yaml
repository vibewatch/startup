- id: payer-market-structure
  title: Payer Dynamics, Reimbursement Friction, and Market-Structure Risk
  body: |-
    Forus is trying to automate a process whose counterparties are getting harder, not easier, to navigate. OIG found that some Medicare Advantage prior-authorization and payment denials should have been approved under Medicare rules, while ProPublica and STAT documented how insurers and outsourced utilization-management vendors use algorithms, threshold tuning, and black-box review processes that can expand denials or shorten payment windows. Those findings matter because Forus’s product promise depends on shortening the same approval journey, not eliminating the payer’s authority to deny. If payer criteria keep changing, if outsourced reviewers tune for savings, or if denials shift to lower-cost services that are now economical to review with AI, Forus’s automation burden rises even when its own adoption looks healthy.

    The commercial side is also worsening. IQVIA reports that initial denials for new branded medicines reached 70% in 2025, with 24% of new-to-brand claims still unapproved a year later, while KFF polling shows prior authorization is now the single biggest non-cost burden for many insured adults. Those numbers create demand for Forus, but they also cap how much any workflow vendor can promise without absorbing service, reputational, or contractual risk. In practice, Forus remains dependent on payer mandates, brand-specific network rules, and appeals behavior it does not control, which means reimbursement friction is both the company’s core market opportunity and one of its largest residual risk drivers.
