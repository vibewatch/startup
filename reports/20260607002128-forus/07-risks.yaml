- id: dependency-concentration-execution
  title: Dependency, Concentration, and Execution Risk
  body: |-
    The core business-model risk is that provider adoption and monetization are not the same thing. Public materials say Forus is free to providers and patients, while external coverage says revenue comes from pharmaceutical relationships and launch support. That structure can look attractive while adoption is climbing, but it creates concentration risk if a handful of manufacturer budgets, launches, or compliance-sensitive partnerships drive most revenue. Public evidence also suggests reference density is heaviest in specialty medication workflows such as dermatology, allergy, GI, and rheumatology, which may reflect a strong initial wedge but also raises the chance that growth, retention, and unit economics are more segment-specific than headline practice counts imply.

    Execution risk compounds that dependence. Forus said in May 2026 that it had about 100 engineers and operators in New York, major EHR integrations, and only electronic-prescription support today. That means scale still depends on EHR compatibility, operational support, pharmacy-routing logic, and enough clinical-intelligence staffing to keep up with payer changes. The valuation amplifies every miss: Forbes reported a $1 billion valuation, $160 million raised, and run-rate revenue above $50 million, which implies a roughly 20x revenue multiple before concentration and governance discounts. If manufacturer revenue is lumpier than provider growth, the downside path is a business that looks operationally important to clinicians but still experiences abrupt monetization volatility.
