- id: TR005
  title: Mitigation and thesis-break trigger table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  - Immediate diligence ask
  rows:
  - - Privacy or security failure
    - Reportable incident, OCR inquiry, or FTC health-data event
    - Any PHI or consumer-health incident that triggers external notification
    - Pause underwriting until root cause, scope, and remediation are independently reviewed
    - Demand incident report, customer notification log, and pen-test / tabletop outputs
  - - Biopharma concentration shock
    - Lost launch, non-renewal, or spend freeze from a top manufacturer partner
    - Loss or suspension of a top-five partner or any large 2026 launch program
    - Re-cut revenue concentration and downside case before using headline provider adoption as support
    - Request partner-level run-rate revenue, renewals, and launch milestone exposure
  - - Payer-friction deterioration
    - Approval-cycle slippage, denial-overturn drop, or appeal backlog
    - Meaningful worsening in payer turnaround or approval outcomes at major programs
    - Assume workflow automation is absorbing more manual cost than public narratives imply
    - Request payer-level KPI dashboard and sampled exception handling
  - - Provider trust erosion
    - Segment-specific complaints that workflows are biased or too opaque
    - Multiple specialty references cite routing, PAP, or data-use concerns
    - Treat as moat erosion because trust is central to adoption in specialty practices
    - Request complaint log, churn notes, and provider NPS / escalation data
  - - Valuation / monetization mismatch
    - Provider adoption continues while monetization lags or concentration rises
    - Free-user growth with flat or volatile manufacturer revenue
    - Discount headline usage metrics and re-underwrite on concentrated revenue base
    - Request cohort monetization by provider segment and manufacturer partner
  - - Regulatory hardening
    - New state or federal rule directly reaches workflow, notice, or bias controls
    - Any rule or enforcement action requiring material product redesign or expanded human review
    - Increase compliance cost and extend deployment timelines in the base case
    - Request compliance roadmap by state and product workflow
  notes: Triggers are analytical thresholds derived from the sourced risk pathways, not management-guided targets.
