companyProfile:
  summary: >-
    Forus is a private New York healthcare AI company building workflow infrastructure between prescription and therapy
    start. The platform automates prior authorizations, appeals, affordability support, and pharmacy routing inside
    provider workflows, then monetizes primarily through biopharma and related commercialization relationships rather
    than provider subscription fees. Public evidence supports real specialty-provider adoption and a fast-growing
    national footprint, but not the audited financial depth, governance transparency, or concentration data needed for a
    high-conviction late-stage underwrite.
  foundedDate: '2023-01-01'
  founders:
    - name: Sahir Jaggi
      role: Founder, CEO
      background: >-
        Former Oscar Health product leader with Columbia biomedical engineering training and direct exposure to
        insurance and medication-access workflow complexity.
      claimRefs:
