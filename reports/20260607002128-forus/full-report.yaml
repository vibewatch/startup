      - number: '1.3'
        title: Funding history, investor stack, and disclosed economics
        blocks:
          - type: paragraph
            body: >-
              Funding is one of the strongest public parts of the Forus story, but it is still not a clean conventional
              round-by-round ledger. The company and its media coverage say Forus raised over $160M in May 2026, while
              Forbes adds the critical nuance that Thrive Capital, General Catalyst, and Accel had each led previously
              unannounced financings that were only surfaced when the company went public with the new Forus brand.
              Forbes also reported a $1B valuation and annualized revenue that had already surpassed $10M by year-end
              and was tracking above $50M in 2026. Those are meaningful signals for stage and momentum, but they are not
              a substitute for audited or filed financial disclosure. The investor list is now clear at the name level:
              Thrive, General Catalyst, Accel, Bain Capital Ventures, Redpoint, BoxGroup, and Pear VC all appear
              repeatedly in fetched sources. What remains opaque is equally important: public sources still do not
              disclose board seats, ownership percentages, debt facilities, liquidation preferences, or any secondary
              component in the financing package.
