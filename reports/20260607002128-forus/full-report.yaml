          label: Field reps / PAP hubs
          detail: Distribution and enrollment support ecosystem
          tone: warning
        - id: payers
          label: Payers / PBMs
          detail: Rules, denials, and formulary controls
          tone: negative
        - id: ehr
          label: EHR / eRx stack
          detail: Prescription initiation and chart extraction
          tone: warning
        - id: pharmacies
          label: Pharmacies / brand networks
          detail: Downstream dispensing destination
          tone: warning
        - id: providers
          label: Specialty practices and health systems
          detail: Adoption base and workflow owners
          tone: positive
        - id: external_ai
          label: External AI partners
          detail: OpenEvidence-style clinical decision support links
          tone: warning
      edges:
        - from: biopharma
          to: forus
          label: funding / launch demand
        - from: field_reps
          to: forus
          label: channel influence and enrollment workflows
        - from: payers
          to: forus
          label: criteria and denial logic
        - from: ehr
          to: forus
          label: eRx and record input dependency
        - from: forus
          to: pharmacies
          label: routing decisions
        - from: providers
          to: forus
          label: prescriptions and adoption
        - from: external_ai
          to: forus
          label: clinical-to-access handoff
        - from: payers
          to: pharmacies
          label: network mandates
