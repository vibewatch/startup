    type: journey-map
    layout: standard
    summary: >-
      Forus’s visible journey starts in a specialty practice and branches outward to patients, pharmacies, payers, and
      biopharma rather than beginning with a named enterprise payer sale.
    data:
      items:
        - label: Prescription written
          detail: A clinician or coordinator triggers Forus from inside the prescribing workflow.
          touchpoints:
            - EHR workflow
            - Practice staff
            - Specialty medication
        - label: Coverage and affordability work
          detail: Forus handles prior authorization, appeals, affordability checks, and required paperwork.
          touchpoints:
            - Payer rules
            - Appeals
            - Financial assistance
        - label: Pharmacy routing and patient updates
          detail: >-
            The network sends the script to the patient’s preferred or required pharmacy and keeps the patient updated
            by text.
          touchpoints:
            - Preferred pharmacy
            - Text updates
            - Status visibility
        - label: Provider-side ROI
          detail: Practice teams measure the value in faster approvals, less phone time, and fewer dropped tasks.
          touchpoints:
            - Time saved
            - Fewer delays
            - Less admin burden
        - label: Network monetization and feedback
          detail: >-
            Biopharma and other enterprise partners benefit if the network improves launch execution and access
            intelligence.
          touchpoints:
            - Biopharma insights
            - Launch support
            - Population-level access
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU029
      - CU031
      - CU032
      - CU033
