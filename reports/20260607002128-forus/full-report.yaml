      - number: '1.4'
        title: Traction signals, milestone chronology, and adverse overhangs
        blocks:
          - type: paragraph
            body: >-
              Public traction evidence is unusually rich for a young private company because Forus publishes detailed
              customer stories across multiple specialties. Those cases show adoption in dermatology, GI, allergy,
              rheumatology, pulmonology, sleep, and multispecialty practice settings, with claimed improvements
              including same-day initiation, shorter approval times, less administrative work, and broader prescription
              throughput. Company-wide scale claims are also aggressive: the announcement says adoption grew 10x year
              over year for the last two years, the platform is used by thousands of practices and health systems in all
              50 states, patient reach already extends to nearly 80% of U.S. zip codes, and five of the top 10 global
              biopharma companies work with Forus. The main adverse overlay is not a disclosed lawsuit, sanction, or
              breach specific to Forus; none surfaced in the fetched run. Instead, the clearest documented headwind is
              external. CMS is proposing drug prior-authorization interoperability rules, while KFF and the National
              Health Law Program describe growing scrutiny of AI-driven authorization workflows around bias, privacy,
              human review, and appeal rights. That means the business is scaling into a policy environment that could
              both validate and constrain its automation moat.
