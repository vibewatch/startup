  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation remains research-more because the public mark still runs ahead of public proof
        blocks:
          - type: paragraph
            body: >-
              Observed public evidence shows that Forus has built a real and strategically interesting
              prescription-access workflow. The company and Business Wire line up on an over-$160 million financing,
              national practice coverage, and rapid reported adoption. Forbes then adds the critical pricing datapoints:
              a reported $1 billion valuation and an annualized revenue run-rate already above $50 million by May 2026.
              The problem is not whether Forus matters; the problem is whether the current entry price already assumes a
              lot of success. Inferred from the public valuation anchor and the reported run-rate, investors are
              underwriting a sub-20x annualized revenue multiple before public evidence on gross margin, net retention,
              concentration, or financing terms exists. That is rich even in a healthier 2026 AI-funding tape. The
              chapter therefore lands on research-more, medium confidence, high risk, and a stretched valuation stance
              until diligence proves materially stronger economics than the public record currently shows.
            claimRefs:
              - CV001
              - CV005
              - CV011
              - CV012
