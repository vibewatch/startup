      - number: '2.5'
        title: Why this market could create durable advantage — or not
        blocks:
          - type: paragraph
            body: >-
              Forus's bull case is not simply that prior authorization is painful; many vendors can automate painful
              tasks. The stronger argument is that a platform sitting in the middle of providers, payers, pharmacies,
              and biopharma can accumulate repeated observations about where prescriptions stall, which payers demand
              which evidence, when appeals work, how routing affects fill rates, and where patients drop off. If that
              learning loop keeps compounding, medication-access automation can become a data and operations network
              rather than a form-filling utility. Forus's public messaging leans heavily into exactly that thesis,
              especially its claim that it already works with top biopharma companies and uses embedded clinical
              intelligence to encode payer and specialty nuance.


              The bear case is equally plausible if standards and incumbents catch up before the network effects are
              proven. Public evidence on pricing, retention, approval-rate benchmarks by payer, and integration depth is
              still thin; most operating proof is company-authored case studies. CMS-led APIs should expand the market
              by reducing integration friction, but they can also flatten the transport layer and give EHRs, payers,
              specialty pharmacies, or lower-priced point tools more room to compete. The durable advantage therefore
              depends on whether vendors like Forus own the intelligence layer, the operator workflow, and the
              cross-party dataset — not just the submission pipe.
            claimRefs:
              - CM041
              - CM042
              - CM043
              - CM044
