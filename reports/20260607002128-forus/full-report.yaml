          remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The core customer diligence issue is not whether Forus has real users; it is how durable and transferable
              that usage is. No retained public source discloses renewal cohorts, NRR, GRR, churn, contract lengths, or
              paid-conversion data. Nor does the public surface show which payer, health-system, or biopharma accounts
              drive the business. That matters more in 2026 because the surrounding market is becoming less forgiving.
              MGMA says prior authorization remains one of the most damaging administrative burdens on practices,
              Everest says large insurers are moving toward stricter electronic and real-time authorization
              expectations, and PHTI explicitly warns that AI can increase system activity without reducing total cost
              when applied to broken workflows. Those cross-currents cut both ways for Forus: they expand demand for
