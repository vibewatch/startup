  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Forus is best analyzed inside the U.S. medication-access automation market: software and workflow
              orchestration that moves a prescribed therapy through benefit investigation, prior authorization, appeals,
              affordability support, pharmacy routing, and patient status updates. Its public materials frame the
              product as automating every step from prescription to affordable access and as coordinating doctors,
              pharmacies, payers, and biopharma rather than acting as a point tool for a single transaction.


              Included spend therefore covers provider-facing workflow software, embedded EHR actions, coordinator
              dashboards, payer and pharmacy communication, bridge or patient-assistance enrollment support, and
              analytics tied to whether a patient actually starts therapy. Excluded spend includes drug discovery,
              manufacturing, wholesaler economics, pharmacy dispensing margin, and generic revenue-cycle tools that do
              not solve medication-access bottlenecks. The closest substitutes are manual phone, fax, and spreadsheet
              workflows; payer portals; specialty pharmacies or hubs that solve only one slice of the process; and
              EHR-native features that transport forms without coordinating the full journey. That boundary matters
              because broad prescription-drug spend is enormous, but only a smaller workflow-software layer is directly
              monetizable.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
