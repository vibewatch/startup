  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape overview: a stack of rivals, not one competitor'
        blocks:
          - type: paragraph
            body: >-
              Forus is competing against a stack, not a single rival. The closest overlap comes from medication-access
              incumbents such as CoverMyMeds and Surescripts, payer/provider infrastructure vendors such as Availity and
              Myndshft, specialty access specialists such as AssistRx, TailorMed, RxLightning, and Foundation Health,
              and substitutes that sit inside Epic or inside local pharmacy prior-authorization teams. Forus’s own pitch
              is unusually broad: the company says it automates authorization, financial assistance, and fulfillment
              routing across every drug, payer, and pharmacy, from inside physician workflow, and does so free to
              providers and patients.


              That breadth matters because the job-to-be-done is still fragmented. CMS says paper and fax prior
              authorization costs providers about 13 hours a week and nearly $34,000 a year, while the 2026 AMA survey
              still shows widespread care delays and adverse events tied to prior authorization. Buyers therefore
              tolerate stitched solutions if those solutions are already embedded in the systems they use. The strategic
              implication is that Forus does not just need superior automation; it needs to beat incumbent distribution
              and prove that one orchestrated workflow is better than combining networks, portals, EHR queues, and
              staff.
