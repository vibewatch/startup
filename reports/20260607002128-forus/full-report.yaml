      - number: '7.2'
        title: Privacy, Data Governance, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Privacy and security are first-order risks because Forus sits between prescribers, patients, pharmacies,
              manufacturers, and payers, with workflow data flowing through provider portals, patient communications,
              and external systems. The public mitigants are meaningful: Forus claims HIPAA compliance, SOC 2 Type II
              certification, and BAA protection for PHI, and HHS guidance gives a clear blueprint for risk management
              and breach response. But the company’s own privacy language also creates diligence tension. The website
              says anonymized data and aggregated insights may be sold to customers and third parties, while the
              provider-portal privacy policy says provider information may be disclosed to patients, manufacturers, and
              other users, and that analytics vendors and replay-session tools are used on the portal.


              That combination does not prove misuse, but it does widen the downside path from a technical incident into
              a trust and governance issue. FTC guidance treats consumer-health information as a security-sensitive
              category even outside the traditional HIPAA frame, and FTC breach rules can require notifications to
              consumers, regulators, and media. Public documents therefore leave unresolved questions about what
              information is de-identified, how re-identification risk is managed, what manufacturers can see, and how
              subprocessor use is controlled. If those answers are weak, the company could face not only breach
              liability but also provider pushback that the data exhaust from clinical access workflows is being
              commercialized too aggressively.
            claimRefs:
              - CR014
