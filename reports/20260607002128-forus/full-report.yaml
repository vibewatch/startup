      - number: '1.2'
        title: Founder, leadership bench, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The company is visibly founder-led. Sahir Jaggi is the dominant public executive across official releases
              and independent press coverage, and his background at Oscar Health plus Columbia biomedical training gives
              the business a credible founder-market-fit narrative in medication access and insurance workflow
              complexity. That same concentration creates key-person dependence because Jaggi remains the main face for
              mission, product logic, and financing. The fetched public set identifies at least one additional medical
              leader, Adam Harris, MD, as Head of Clinical Intelligence, and the careers page shows active hiring across
              finance, engineering, data, provider growth, and operations from New York. Even so, the broader leadership
              bench is not disclosed in a clean public org chart, and the public record does not surface a board roster,
              voting structure, or detailed sponsor governance rights. The trust-center record is more complete than the
              governance record: it shows clean SOC 2 Type II audits under both the Tandem and Forus names, which
              supports operational continuity through the rebrand even while corporate-control transparency remains
              limited.
