  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Forus only grows comfortably into a $1B price if both revenue scale and premium multiple support show up together.
    data:
      items:
        - label: 50M at 6x
          value: 0.3
        - label: 70M at 8x
          value: 0.56
        - label: 90M at 10x
          value: 0.9
        - label: 100M at 10x
          value: 1
        - label: 120M at 12x
          value: 1.44
    approximationNotes: >-
      Values are illustrative equity-value outcomes in USD billions based on public run-rate anchors and premium
      multiple assumptions, not management guidance.
    claimRefs:
      - CV012
      - CV038
      - CV042
      - CV043
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The public-evidence base case sits materially below the current valuation anchor, while the current mark already
      lives near the low end of the bull case.
    data:
      items:
        - label: Bear
          low: 0.12
          mid: 0.2
          high: 0.28
          unit: USD B
          detail: Multiple compression and compliance drag.
        - label: Base
          low: 0.35
          mid: 0.46
          high: 0.56
          unit: USD B
          detail: Premium public-comp band on current public scale.
        - label: Bull
          low: 0.9
          mid: 1.1
          high: 1.4
          unit: USD B
          detail: Run-rate scales rapidly and strategic premium holds.
    approximationNotes: >-
      Ranges are judgment bands in USD billions derived from public evidence and comparable-multiple logic rather than a
      full DCF or negotiated term sheet.
    claimRefs:
      - CV042
      - CV043
      - CV044
