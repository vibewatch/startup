  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How regulatory, privacy, payer, and concentration shocks flow into trust, revenue, and valuation downside.
    data:
      nodes:
        - id: privacy_incident
          label: Reportable privacy / security incident
          detail: PHI or consumer-health data event triggers notification duties
          tone: negative
        - id: trust_loss
          label: Provider trust loss
          detail: Providers question workflow neutrality or data handling
          tone: negative
        - id: payer_drift
          label: Payer-rule drift
          detail: Automation falls behind changing denial, routing, and appeal rules
          tone: warning
        - id: approval_slippage
          label: Approval-cycle slippage
          detail: Turnaround or overturn outcomes worsen at major programs
          tone: negative
        - id: partner_loss
          label: Major biopharma budget loss
          detail: Top manufacturer partner delays or cancels launch support
          tone: negative
        - id: revenue_shock
          label: Revenue concentration shock
          detail: Monetization weakens faster than provider adoption
          tone: negative
        - id: valuation_reset
          label: Valuation reset
          detail: Investors re-rate the company on lower quality of revenue
          tone: negative
        - id: thesis_break
          label: Thesis break
          detail: Combined trust, compliance, and revenue issues break underwriting case
          tone: negative
      edges:
        - from: privacy_incident
          to: trust_loss
          label: incident erodes provider confidence
        - from: payer_drift
          to: approval_slippage
          label: rules outpace workflow tuning
        - from: approval_slippage
          to: trust_loss
          label: providers feel delay and opacity
        - from: partner_loss
          to: revenue_shock
          label: launch-budget loss hits monetization
        - from: trust_loss
          to: revenue_shock
          label: adoption and retention weaken
        - from: revenue_shock
          to: valuation_reset
          label: quality of revenue deteriorates
        - from: valuation_reset
          to: thesis_break
          label: financing and confidence re-rate
        - from: privacy_incident
          to: thesis_break
          label: severe incident can break thesis directly
    claimRefs:
      - CR015
      - CR024
      - CR050
      - CR052
      - CR077
      - CR081
      - CR082
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Forus depends on manufacturer budgets, payer rules, EHR/eRx systems, pharmacies, and external AI partners to
      convert prescriptions into filled therapy.
    data:
      nodes:
        - id: forus
          label: Forus
          detail: Prescription access automation platform
          tone: neutral
        - id: biopharma
          label: Biopharma partners
          detail: Primary public monetization path and launch sponsors
          tone: warning
