            title: Owning transport is not enough to earn a durable moat
            body: >-
              If a vendor only moves forms faster, standards and incumbents can catch up. The defensible layer is the
              intelligence around routing, appeals, affordability, specialty nuance, and cross-party feedback — and
              public evidence proving that layer is still limited.
            calloutType: risk
            claimRefs:
              - CM047
              - CM048
              - CM049
