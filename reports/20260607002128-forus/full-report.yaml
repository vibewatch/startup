  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Biopharma Conflict Risk
        blocks:
          - type: paragraph
            body: >-
              Forus sits in a legally sensitive part of healthcare operations because it automates prior authorization,
              appeals, affordability support, and pharmacy routing inside the prescribing workflow while publicly saying
              the service is free to providers and patients. That matters because the company’s economics are tied to
              manufacturer relationships rather than a straightforward provider subscription. CMS has already made clear
              that AI can assist prior authorization but cannot be the sole basis for medical-necessity determinations,
              and the same policy wave is broadening through Colorado, California, Illinois, and ONC’s
              algorithm-transparency framework. Even where a rule does not directly name Forus, enterprise buyers will
              increasingly expect documented human review, fairness evidence, and explainability for any workflow that
              influences patient access.


              The sharper conduct risk comes from manufacturer-funded patient-support workflows. Forus explicitly
              markets support for bridge programs, hub enrollment, and PAPs, while also telling biopharma that its
              network yields insight into where providers get stuck and where patients drop off. CRS, Yale, and the
              Fourth Circuit / OIG line of analysis all point toward the same risk: assistance that looks helpful to
              patients can still be characterized as remuneration or steering when it preferentially supports one
              manufacturer’s product, shifts formulary behavior, or raises federal program costs. Residual exposure
              remains high until diligence confirms governance boundaries between neutral access support,
              manufacturer-sponsored enrollment, and any commercialization of aggregated workflow intelligence.
            claimRefs:
