      - number: '8.3'
        title: Public comparables and scenario math argue for discipline rather than momentum chasing
        blocks:
          - type: paragraph
            body: >-
              Public comparables are imperfect, but they still force pricing discipline. Waystar and Phreesia bracket
              healthcare workflow and reimbursement software. Doximity captures physician-workflow distribution. Veeva
              shows what an elite life-sciences software platform can command. Omnicell is the pharmacy-automation
              anchor, while Tempus is the clearest AI-health premium reference. Observed market-cap and revenue
              snapshots place those public names around roughly 1.3x to 8.8x market-cap-to-revenue, and Bessemer's
              Health Tech 2.0 framework puts the newer AI-health public cohort around 7.2x EV-to-revenue on average,
              with Tempus near 9.3x. Against that backdrop, Forus at a reported $1 billion valuation on a reported
              run-rate above $50 million still looks rich. The bull case requires very fast growth into the mark plus
              strategic-premium status. The base case says the company is good but the price still gets ahead of public
              proof. The bear case says any combination of compliance drag, slower scaling, or market rerating could
              compress value sharply before the business grows into its financing headline.
