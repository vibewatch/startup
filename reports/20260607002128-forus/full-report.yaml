  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Revenue bridge disappoints
        - Audited 2026 revenue lands near or below the current public >$50M run-rate rather than materially above it.
        - The current $1B mark loses its growth-premium logic versus public comps.
        - Do not lead the round at current terms; re-underwrite to the base or bear case.
      - - Financing stack is more senior than expected
        - Preferences, warrants, debt, or ratchets materially reduce common-equity upside.
        - Headline valuation stops describing actual investor economics.
        - Require repricing, stronger downside protection, or both.
      - - Compliance burden rises
        - Regulatory or customer scrutiny forces more manual controls, slower rollouts, or higher operating cost.
        - Strategic-scarcity thesis converts into services-heavy complexity rather than software leverage.
        - Cut valuation band and revisit category-risk assumptions immediately.
      - - Customer or pharma concentration is high
        - A small number of launches, specialties, or partners drive a large share of value.
        - Growth durability and bargaining power are weaker than the premium case assumes.
        - Demand concentration-adjusted pricing or walk away.
      - - Public comp band compresses
        - Health-tech workflow and AI comps rerate lower before Forus grows into its current mark.
        - Even steady execution can leave no margin of safety at entry.
        - Pause or insist on lower entry valuation.
      - - Data-governance or privacy controls look weak
        - Security, bias, or audit evidence does not meet diligence expectations.
        - Regulatory risk rises while strategic-buyer and IPO readiness fall.
        - Escalate to bear-case underwriting or exit the process.
    notes: >-
      Each trigger is meant to be monitorable during diligence or immediately after investment rather than a vague
      strategic worry.
