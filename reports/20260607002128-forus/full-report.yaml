    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product workflow, and current company shape
        blocks:
          - type: paragraph
            body: >-
              Forus is best understood as a private New York healthcare AI company focused on the messy backend that
              sits between a doctor writing a prescription and a patient actually starting therapy. Official materials
              consistently describe the product as software embedded in physician workflows that automates prior
              authorizations, appeals, affordability support, and pharmacy routing, while the patient-facing page
              emphasizes that doctors and patients do not pay for the service directly. The naming history matters
              because older public references use Tandem or withtandem branding, while the May 2026 announcement made
              the Forus name canonical and several older pages now carry notes that Tandem has been replaced with Forus
              throughout the text. Public chronology from Forbes and citybiz ties the current company to a 2023 start,
              and current company materials still anchor operations in New York. The public record is therefore strong
              on identity, workflow, and category fit, but weaker on classic cover facts such as exact customer count,
              audited revenue quality, and a fully enumerated office footprint.
