      - number: '4.3'
        title: Capital adequacy, cost structure, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy looks materially better after the May 2026 financing, but not fully underwritable.
              Official announcements say Forus has now raised more than $160 million, while January 2026 reporting said
              Tandem was seeking $100 million at a $1 billion valuation and had raised $137 million to date. The latest
              round therefore appears to have closed between the January press cycle and the May rebrand/announcement. A
              fresh nine-figure raise alongside a revenue run-rate above $50 million reduces immediate solvency risk and
              suggests the company is funding expansion rather than rescue operations. Management's own use-of-funds
              language points to three operating buckets: expanding the provider network, deepening the AI platform, and
              building the team. Public cost signals line up with that story. Forus says it has about 100 employees in
              New York, its careers page listed 22 open roles across finance, data, engineering, and GTM when reviewed,
              and Commercial Observer reported a new 25,200-square-foot SoHo lease at an asking rent of $118 per square
              foot for 5.5 years, implying a rough annual rent proxy near $3.0 million before concessions and occupancy
              costs. The business therefore looks labor- and workflow-intensive rather than inventory- or
