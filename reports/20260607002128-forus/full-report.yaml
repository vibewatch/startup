          - type: callout
            title: Specialty and multisite operators are the clearest early beachhead
            body: >-
              The most compelling public proof points come from specialty-heavy, coordinator-heavy environments where
              every saved call or fax compounds across many providers and sites. That suggests workflow concentration,
              not broad primary-care ubiquity, is the best near-term adoption pattern.
            calloutType: insight
