        title: Trust controls, regulatory context, and maturity limits
        blocks:
          - type: paragraph
            body: >-
              The trust posture is better than marketing-only boilerplate but still incomplete for a full enterprise
              security signoff. Forus publicly claims HIPAA compliance, SOC 2 Type II certification, and BAA coverage,
              and its privacy policies at least show awareness of provider, patient, and manufacturer role separation
              plus the possibility of de-identified or aggregated data products. Those are positive signals. HHS
              guidance also makes clear the minimum bar any PHI-handling business associate has to meet: administrative,
              physical, and technical safeguards tied to risk analysis and access control. The larger diligence issue is
              not whether Forus knows the language of compliance; it is how much detail remains private. The reviewed
              public materials do not disclose incident history, retention defaults, tenant isolation, or clear public
              SLAs. Separately, CMS’s newer interoperability rules improve non-drug prior-authorization APIs, but they
              still exclude several drug prior-authorization flows, which means Forus will continue operating in a
              fragmented payer and pharmacy ecosystem where manual exceptions are part of the product reality.
