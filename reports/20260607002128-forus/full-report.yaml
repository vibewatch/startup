      - number: '8.2'
        title: >-
          The thesis is workflow scarcity at the point of prescription; the anti-thesis is evidence quality and
          regulated-stack fragility
        blocks:
          - type: paragraph
            body: >-
              The observed bullish case is easy to articulate. Official sources say Forus sits directly in the
              administrative gap between a doctor prescribing a therapy and a patient actually starting it, automating
              authorization, affordability, and fulfillment steps across a national network. Official and third-party
              coverage also say the company already works with thousands of practices, reaches patients in nearly 80% of
              ZIP codes, and has relationships with large biopharma companies. From those observed facts, it is
              reasonable to infer strategic scarcity: the platform can see where providers get stuck, where patients
              drop off, and where launches succeed or fail. The anti-thesis is that much of this story is still
              company-led rather than independently audited. External legal and healthcare-AI sources also warn that
              pharmacy-adjacent automation faces rising compliance scrutiny, privacy risk, algorithmic-bias risk, and
              implementation friction. What is observed today is meaningful product pull; what remains inferred is
              whether that pull converts into durable, software-like economics that justify a venture-scale premium
              valuation.
