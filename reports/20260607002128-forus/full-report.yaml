            title: The wedge is real because pain, policy, and economics line up
            body: >-
              This market is not a speculative “AI someday” category. Physicians already report widespread delays and
              abandonment, CMS is forcing medical-benefit workflows toward digital APIs, and both CAQH and CMS quantify
              meaningful savings from less-fragmented prior-authorization operations.
