              can pull records automatically when integrated to major EHRs, while still accepting uploads or faxed notes
              when a practice lacks direct integration. The field guide also explains how the provider portal becomes
              the command center for follow-ups, signatures, missing-information tasks, and training, which is a useful
              sign that the product has a real operational interface rather than only a sales narrative. The
              architecture implied by the materials is layered: eRx and chart ingestion, payer- and drug-specific form
              logic, human-in-the-loop review for clinical decisions, then communications with plans, pharmacies,
              manufacturers, and patients. That architecture is plausible and reinforced by customer stories, but it is
              still only partially inspectable. Public materials do not enumerate named integrations, payer APIs, or
