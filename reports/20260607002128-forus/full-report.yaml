      - number: '2.3'
        title: Buyer, user, and payer dynamics
        blocks:
          - type: paragraph
            body: >-
              The day-to-day user is usually the person who feels the access friction most acutely: a physician, medical
              assistant, biologics coordinator, nurse, or pharmacy-support staffer operating inside the prescribing
              workflow. The direct buyer, however, is more likely to be a provider organization, specialty platform,
              MSO, GPO, or health-system service line that can justify workflow software as an operations lever and
              spread it across many prescribers and coordinators. Forus's own public case studies skew toward exactly
              these settings.


              Payers are rarely the initial buyer in Forus's public product narrative, but they still shape the market
              because their documentation rules, response times, benefit-design choices, and pharmacy-routing
              constraints determine how valuable automation becomes. Medicare Advantage uses prior authorization almost
              universally, while Medicaid programs and their PBMs rely on prior authorization, preferred drug lists, and
              rebate-driven utilization controls. This means the market is structurally multi-sided: provider budgets
              decide software purchases, but payer behavior creates the pain and the potential ROI. The best early
              customer segments are therefore organizations with high specialty-drug mix, many coordinators, and enough
              scale to convert time saved into greater patient throughput or fewer hires.
            claimRefs:
