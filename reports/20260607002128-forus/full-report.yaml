      - number: '2.2'
        title: Sizing the market with constrained lenses
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a large pain pool but not one clean canonical TAM. The broadest macro lens is
              administrative simplification: KFF describes a trillion-dollar friction-filled system inside U.S.
              healthcare, and CAQH says another $21 billion of savings opportunity still remains from closing automation
              gaps. CMS separately estimates that its prior-authorization interoperability rule alone will save about
              $15 billion over ten years, which is best viewed as a regulatory floor on the value of digitizing
              medical-benefit prior authorization rather than a full market-size number.


              Volume data help constrain the opportunity further. Medicare Advantage insurers processed nearly 53
              million prior-authorization requests in 2024, while Medicaid continues to face rapid prescription-drug
              cost growth and extensive use of utilization controls. IQVIA also expects innovative therapeutics to
              remain the largest driver of medicine-spending growth through 2029, which implies more expensive therapies
              will continue to carry complicated access workflows. Putting those lenses together, a provider-facing SAM
              in roughly the $0.8 billion to $2.5 billion range is defensible, while a broader $2.5 billion to $6.0
              billion TAM becomes plausible only if a platform also monetizes biopharma launch and data products.
              Precision remains limited because public pricing, contract, and retention disclosures are scarce.
