  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Audited 2026 revenue bridge
        - Monthly revenue, annualized run-rate, and a bridge from the public May 2026 anchor to current results.
        - Without it, the current valuation cannot be defended with confidence.
        - CFO package, board deck, and audit-ready financials.
      - - Gross margin and retention
        - Gross margin by workflow segment, cohort retention, and any net revenue retention metric.
        - Premium software-like multiples require proof that revenue quality is strong, not just growth.
        - Finance and revops diligence review.
      - - Fill-rate and launch outcomes
        - Evidence that faster access improves prescription fill-through and launch performance at scale.
        - This is the clearest proof that Forus captures value beyond admin labor substitution.
        - Customer analytics pack plus biopharma case studies.
      - - Concentration and segment mix
        - Revenue by specialty, top customers, top pharma partners, and therapy launches.
        - Hidden concentration can make the growth story much more fragile than the headline suggests.
        - Sales analytics, customer list, and pipeline review.
      - - Preference stack and downside protection
        - Liquidation preferences, warrants, debt covenants, board rights, and any ratchet terms.
        - Entry economics can diverge sharply from the headline valuation.
        - Latest financing documents and counsel review.
      - - Security, privacy, and compliance controls
        - HIPAA governance, model-risk oversight, security controls, audit trails, and response playbooks.
        - Workflow scale in a regulated stack only deserves a premium if controls are institutional-grade.
        - Security, legal, and compliance diligence session.
    notes: These asks are the minimum package required to turn a directional strategic view into an underwritten price view.
