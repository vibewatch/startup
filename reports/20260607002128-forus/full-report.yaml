      - number: '3.2'
        title: Direct incumbents own critical rails in prior authorization and benefit intelligence
        blocks:
          - type: paragraph
            body: >-
              CoverMyMeds, Availity, Myndshft, and Surescripts represent the highest-probability head-to-head threats
              because each already sits inside a critical decision point. CoverMyMeds is the deepest medication-access
              incumbent in the public source pack: it offers no-cost provider ePA for all plans and medications,
              maintains one of the largest publicly described provider-pharmacy networks in the category, and in 2026
              expanded into an integrated specialty workflow spanning benefits investigation, medical and pharmacy prior
              authorization, and patient enrollment. That makes it the most direct incumbent analogue to the Forus
              end-to-end story.


              Availity is different but dangerous. It is strongest where payers want standardized, auditable
              utilization-management automation across their provider network. Myndshft pushes a broad AI and
              rules-engine story across benefits verification, patient responsibility, and prior authorization, while
              Surescripts is the hardest network to route around inside prescription benefit intelligence because its
              RTPB and automation already live in the e-prescribing path. Balanced treatment matters here: these
              incumbents have real distribution strengths that can outweigh feature gaps in procurement decisions.
            claimRefs:
