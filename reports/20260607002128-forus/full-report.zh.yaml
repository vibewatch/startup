      - number: '3.2'
        title: 直接既有厂商掌握事先授权和福利智能中的关键轨道
        blocks:
          - type: paragraph
            body: >-
              CoverMyMeds、Availity、Myndshft 和 Surescripts 是最可能正面对打的威胁，因为每家公司都已经坐在关键决策点上。CoverMyMeds
              是公开来源包中最深的用药可及性既有厂商：它为所有计划和药品提供免费的医疗服务方 ePA，维护着该品类公开描述中最大的医疗服务方—药房网络之一，并在 2026
              年扩展到覆盖保险权益核查、医疗和药房事先授权、患者登记的一体化专科工作流。这让它成为最直接对应 Forus 端到端叙事的既有厂商。


              Availity 不同，但同样危险。支付方希望在自己的医疗服务方网络中推行标准化、可审计的利用管理自动化时，Availity 最强。Myndshft 把 AI
              和规则引擎故事铺到福利核验、患者责任和事先授权；Surescripts 则是处方福利智能中最难绕开的网络，因为它的 RTPB
              和自动化已经活在电子处方路径里。这里需要平衡看待：这些既有厂商具有真实分发优势，采购决策中这种优势可能压过功能缺口。
