      - number: '3.4'
        title: Forus 以工作流深度和中立性区分自己，但分发仍是核心风险
        blocks:
          - type: paragraph
            body: >-
              Forus 最清晰的差异化是工作流深度加利益相关方中立性。其官方材料描述了一条横跨授权、支付能力和分流的流程，而多数对手都从更窄的群体出发——Availity 面向支付方，Surescripts
              面向福利智能，AssistRx 面向支持中心和服务，TailorMed 面向支付能力，RxLightning 面向专科登记。Forus 还宣传医疗服务方和患者免费使用；在本次保留公开资料中，只有
              CoverMyMeds 和 RxLightning 也提出同样明确的医疗服务方免费主张。这个组合让 Forus 对想要一个前端工作流，而不是支付方工具加药房工具再加人力补丁的医疗服务方组织尤其有吸引力。


              反向情景是，网络既有厂商可能比工作流纯度更重要。CoverMyMeds 带来 McKesson 规模和巨大的医疗服务方—药房足迹。Availity 和 Surescripts 已控制支付方和开方轨道。Epic
              可以用原生队列吸收更多日常工作。合同定价、赢单率和真实转化基准大多仍是私有信息。因此，投资问题不是 Forus 是否解决了真实痛点——它显然做到了——而是更好的编排能否在既有厂商补上差距前转化为持久分发。
