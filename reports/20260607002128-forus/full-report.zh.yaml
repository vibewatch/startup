  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局概览：面对的是一整套竞争栈，而不是单一竞争对手
        blocks:
          - type: paragraph
            body: >-
              Forus 竞争的不是一个单一对手，而是一整套竞争栈。最接近的重叠来自 CoverMyMeds 和 Surescripts 等用药可及性既有厂商，Availity 和 Myndshft 等支付方 /
              医疗服务方基础设施厂商，AssistRx、TailorMed、RxLightning 和 Foundation Health 等专科准入专家，以及嵌在 Epic 或本地药房事先授权团队里的替代方案。Forus
              自己的卖点异常宽：公司称它从医生工作流内部，跨每一种药、每一个支付方和每一家药房，自动化授权、财务援助和履约分流，并对医疗服务方和患者免费。


              这种广度很重要，因为待完成任务仍然碎片化。CMS 称纸质和传真事先授权每周让医疗服务方耗费约 13 小时、每年近 $34,000；2026 年 AMA
              调查仍显示，事先授权造成广泛的护理延误和不良事件。因此，只要拼接方案已经嵌入买方使用的系统，买方就会容忍它们。战略含义是，Forus
              不只需要更强的自动化；它还要打败既有厂商的分发能力，并证明一个编排后的工作流优于把网络、门户、EHR 队列和大量员工拼在一起。
