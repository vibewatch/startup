      - number: '2.5'
        title: 这个市场为何可能形成持久优势，也可能无法形成
        blocks:
          - type: paragraph
            body: >-
              Forus
              的乐观逻辑不只是事先授权很痛；很多厂商都能自动化痛苦任务。更强的论点是，一个站在医疗服务方、支付方、药房和生物制药中间的平台，能反复观察处方卡在哪里、哪些支付方要求哪些证据、什么时候申诉有效、分流如何影响取药率，以及患者在哪里流失。如果这个学习循环持续复利，用药可及性自动化就能变成数据和运营网络，而不是填表工具。Forus
              的公开信息正大力押注这个论点，尤其是它声称已与头部生物制药公司合作，并用嵌入式临床智能编码支付方和专科差异。


              如果标准和既有厂商在网络效应被证明前追上来，悲观逻辑同样成立。关于定价、留存、按支付方划分的审批率基准和集成深度，公开证据仍很薄；大多数运营证明来自公司撰写的案例。CMS 主导的 API
              应会降低集成摩擦、扩大市场，但也可能压平传输层，让 EHR、支付方、专科药房或低价点状工具有更多竞争空间。因此，持久优势取决于 Forus 这类厂商是否拥有智能层、操作员工作流和跨方数据集，而不只是提交通道。
