      - number: '5.2'
        title: 集成、架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              技术故事中最可信的部分，是 Forus 如何描述围绕 EHR 集成、门户任务和多方工作流协调的运营模式。公开文档称，平台在接入主要 EHR
              后可自动拉取记录；当医疗机构没有直接集成时，仍接受上传或传真病历。现场指南还解释了医疗服务方门户如何成为跟进、签名、缺失信息任务和培训的指挥中心，这有助于证明产品有真实运营界面，而不只是销售叙事。材料暗示的架构是分层的：eRx
              和病历摄取，支付方和药品特定的表单逻辑，临床决策保留人工复核，然后与保险计划、药房、制造商和患者沟通。这个架构合理，也得到客户故事强化，但仍只能部分检查。公开材料没有列出具名集成、支付方 API
              或明确可用性承诺，因此买方能理解工作流设计，却还不能承保连接器深度或可靠性。
