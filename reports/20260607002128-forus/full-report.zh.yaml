      - number: '4.3'
        title: 资本充足性、成本结构与融资依赖
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月融资后，资本充足性看起来明显改善，但仍无法完全承保。官方公告称 Forus 现已融资超过 $160 million；而 2026 年 1 月报道称 Tandem 正寻求以 $1 billion
              估值融资 $100 million，且此前已累计融资 $137 million。因此，最新一轮融资似乎在 1 月媒体周期和 5 月更名 / 公告之间完成。新近九位数融资叠加 $50 million
              以上收入运行率，降低了近期偿付风险，也说明公司是在为扩张融资，而不是救火。管理层自己的资金用途表述指向三类运营方向：扩张医疗服务方网络、深化 AI 平台、建设团队。公开成本信号也与这个故事一致。Forus
              称其在纽约约有 100 名员工；审阅时，招聘页面列出 22 个覆盖财务、数据、工程和 GTM 的开放岗位；Commercial Observer 报道公司在 SoHo 新租下 25,200
              平方英尺办公室，要价租金为每平方英尺 $118、租期 5.5 年，粗略意味着优惠和入住成本前的年租金代理值接近 $3.0
              million。因此，业务看起来更偏劳动力和工作流密集，而不是库存或资本开支密集；但手头现金、月度烧钱、现金跑道月数和任何债务工具仍未披露。
