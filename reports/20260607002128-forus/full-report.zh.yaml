      - number: '4.2'
        title: 增长信号与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              对一家私营公司来说，Forus 披露了异常强的采用信号，但这些仍是代理指标，而不是完整运营模型。官方来源称，过去两年每年医疗服务方采用量同比增长 10x，平台被全美 50
              个州数千家医疗机构和医疗体系使用，并覆盖近 80% 的美国邮编区和每年数百万患者。Forbes 补充了关键财务锚点：年化收入到年底已超过 $10 million，如今正跑在 $50 million
              以上。再叠加管理层称公司在纽约约有 100 名工程师和运营人员，隐含年化人均收入已超过 $500,000。这是有用的效率信号，但不等同于 ARR、毛利率或自由现金流。客户案例研究让图景更清晰：Family
              Allergy 称审批时间中位数为 1.1 天、行政工作量下降 70%；Nimbus 称 Forus 节省了数百小时员工时间，并免去了为新 Zepbound 项目招聘专职人员的需求；GI、皮肤科和 GPO
              用户报告吞吐显著提高、开销降低。这些结果支持销售效率和留存逻辑，但公开 CAC、回本周期、NRR 和毛利率仍未披露。
