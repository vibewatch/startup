              的变现方式，而不是医疗服务方收费。这在商业上很重要，因为它暗示客户组合可能更偏制造商，而不是外显的医疗服务方 SaaS
              经济性。但公开记录仍没有具名任何单一支付方、医疗体系或生物制药客户，也没有披露医疗服务方定价、支付方费用或转化机制。因此，图景有用但不完整：Forus
