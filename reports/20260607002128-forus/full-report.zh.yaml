    公司，在处方开出到治疗启动之间搭建工作流基础设施。平台嵌入医疗服务方工作流，自动处理事先授权、申诉、支付能力支持和药房分流，主要靠生物制药及相关商业化关系变现，而不是向医疗服务方收订阅费。公开证据支持其真实的专科医疗服务方采用和快速扩张的全国足迹，但还不足以支撑高确定性后期投资判断所需的审计财务深度、治理透明度或集中度数据。
