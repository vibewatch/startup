  - id: TV005
    title: 投资逻辑破裂与叫停触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入桥接不及预期
        - 经审计 2026 收入落在当前公开 >$50M 收入运行率附近或以下，而不是显著高于它。
        - 当前 $1B 估值标记相对公开可比公司失去增长溢价逻辑。
        - 不要按当前条款领投；按基准或悲观情景重新承销。
      - - 融资结构比预期更优先
        - 优先权、认股权证、债务或反稀释棘轮显著压低普通股上行。
        - 名义估值不再描述投资人的真实经济性。
        - 要求重新定价、加强下行保护，或两者都要。
      - - 合规负担上升
        - 监管或客户审查迫使公司增加人工控制、放慢上线，或抬高运营成本。
        - 战略稀缺性逻辑转成服务很重的复杂度，而不是软件杠杆。
        - 立即下调估值区间，并重看品类风险假设。
      - - 客户或药企集中度高
        - 少数上市项目、专科或合作伙伴贡献大部分价值。
        - 增长耐久性和议价能力弱于溢价情景的假设。
        - 要求按集中度调整定价，或退出。
      - - 公开可比公司区间压缩
        - 在 Forus 长入当前估值标记之前，医疗科技工作流和 AI 可比公司估值下修。
        - 即便执行稳健，入场价也可能没有安全边际。
        - 暂停，或坚持更低入场估值。
      - - 数据治理或隐私控制显弱
        - 安全、偏见或审计证据达不到尽调预期。
        - 监管风险上升，战略买家和 IPO 准备度下降。
        - 升级到悲观情景承销，或退出流程。
    notes: 每个触发因素都应在尽调期间或投资后不久可监测，而不是笼统的战略担忧。
    claimRefs:
      - CV035
      - CV036
      - CV040
      - CV044
      - CV047
      - CV048
  - id: TV006
    title: 最终尽调索取资料表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 经审计 2026 收入桥接
        - 月度收入、年化收入运行率，以及从公开 May 2026 锚点到当前业绩的桥接。
        - 少了这组材料，当前估值就很难有信心地成立。
        - CFO 材料包、董事会材料和可审计财务。
      - - 毛利率和留存
        - 按工作流分部拆分的毛利率、队列留存，以及任何净收入留存指标。
        - 类似软件的溢价倍数需要证明收入质量强，而不只是增长快。
        - 财务和收入运营尽调审阅。
      - - 配药完成率和上市结果
        - 证明更快可及性在规模化后提高处方兑现和上市表现的证据。
        - 这是 Forus 捕获超出行政人力替代价值的最清晰证明。
        - 客户分析包，加生物医药案例研究。
      - - 集中度和分部组合
        - 按专科、头部客户、头部药企合作伙伴和疗法上市拆分的收入。
        - 隐藏集中度会让增长故事比表面脆弱得多。
        - 销售分析、客户名单和管线审阅。
      - - 优先股堆叠和下行保护
        - 清算优先权、认股权证、债务契约、董事会权利和任何反稀释棘轮条款。
        - 入场经济性可能与名义估值明显背离。
        - 最新融资文件和律师审阅。
      - - 安全、隐私和合规控制
        - HIPAA 治理、模型风险监督、安全控制、审计追踪和响应预案。
        - 受监管技术栈中的工作流规模，只有在控制达到机构级时才配得上溢价。
        - 安全、法律和合规尽调会议。
    notes: 这些索取资料是把方向性的战略判断转成可承销价格判断所需的最低材料包。
    claimRefs:
      - CV040
      - CV041
      - CV045
      - CV047
      - CV048
