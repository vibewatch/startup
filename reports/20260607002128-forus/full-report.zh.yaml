        - 抬高一体化路由、可负担性支持和专科药房协调的价值
        - 索取按专科和疗法类别拆分的细分组合
      - - CMS FHIR 事先授权规则
        - 驱动
        - 2026-2027
        - 给医疗福利 PA 带来硬性合规压力，也让数字管线更清晰
        - 梳理哪些工作流因药品被排除而仍不在范围内
      - - 支付方对 AI 处理 PA 的兴趣
        - 驱动
        - 3-5 年周期
        - AI 进入工作流运营后，规则制定方也可能拉动市场需求
        - 测试支付方更愿与供应商合作，还是自建
      - - 提供方信任和预算约束
        - 约束
        - 当前
        - 即使 ROI 可信，也会拖慢一线采用
        - 索取实施成本、见效时间，以及信任机制或人工覆盖控制
      - - 药房福利标准化缺口
        - 约束
        - 当前
        - 让大量药品工作流继续异质化、运营上杂乱
        - 按渠道评估 PBM、支付方和专科药房对该工作流的覆盖
      - - EHR、支付方或药房既有厂商反应
        - 约束
        - 当前至中期
        - 如果供应商只是搬运表单、而不沉淀智能，差异化可能被压缩
        - 比较传输之外的价值：路由、申诉、可负担性、分析
      - - 定价和留存的公开证据有限
        - 约束
        - 当前
        - 让护城河和可持续毛利率难以做高置信度判断
        - 索取定价、净留存、集成深度和队列表现证据
    notes: 本表把已观察到的市场驱动与尽调阶段约束放在一起，因为采用节奏同时取决于运营痛点，以及标准化或既有厂商响应的形态。
