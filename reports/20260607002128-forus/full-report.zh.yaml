  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议仍为继续研究，因为公开估值仍跑在公开证据前面
        blocks:
          - type: paragraph
            body: >-
              公开可见证据显示，Forus 已经搭出一条真实且具战略意味的处方准入工作流。公司自身信息与 Business Wire 在超过 $160M 融资、全国诊所覆盖和快速采用报道上相互对齐；Forbes
              又补上了关键定价锚：据报道估值 $1B，且到 2026 年 5 月年化收入运行率已超过 $50M。问题不是 Forus
              是否重要，而是当前入场价是否已经预支了大量成功。按公开估值锚和报道收入运行率推算，投资人在毛利率、净留存、集中度或融资条款的公开证据出现之前，就在承销一个低于 20x 的年化收入倍数。即便 2026 年 AI
              融资环境更健康，这也偏贵。因此，在尽调证明经济性显著强于当前公开记录之前，本章结论仍为继续研究、中等置信度、高风险和估值偏高。
