  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与生物制药冲突风险
        blocks:
          - type: paragraph
            body: >-
              Forus
              处在医疗运营中法律最敏感的一段：它在开方工作流里自动化事前授权、申诉、可负担性支持和药房路由，同时公开称服务对医疗服务方和患者免费。关键在于，公司经济模型绑定制药商关系，而不是简单向医疗服务方收订阅费。CMS
              已经明确，AI 可以辅助事前授权，但不能成为医疗必要性认定的唯一依据；同一波政策也正通过 Colorado、California、Illinois 以及 ONC 的算法透明度框架扩散。即便规则没有直接点名
              Forus，企业买方也会越来越要求任何影响患者准入的工作流提供有记录的人审、公平性证据和可解释性。


              更尖锐的行为风险来自制药商出资的患者支持工作流。Forus
              明确营销其对过渡供药项目、患者支持服务入组和患者援助计划（PAP）的支持，同时也告诉生物制药客户，其网络能看见医疗服务方在哪里卡住、患者在哪里流失。CRS、Yale 以及 Fourth Circuit / OIG
              的分析线索都指向同一风险：看起来是在帮患者的援助，只要偏向支持某一家制药商的产品、改变处方集行为，或推高联邦项目成本，仍可能被定性为报酬或导流。在尽调确认中立准入支持、制药商赞助入组以及汇总工作流情报商业化之间的治理边界之前，剩余敞口仍然很高。
