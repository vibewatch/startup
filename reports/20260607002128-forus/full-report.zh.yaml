        title: 具名医疗服务方证明：Forus 展示了跨多种诊疗场景的真实专科机构采用和运营 ROI
        blocks:
          - type: paragraph
            body: >-
              Forus 证据最强的地方，是具名专科医疗机构故事。公司发布了一组密集的 2025-2026 年案例研究，覆盖皮肤科、过敏科、风湿科、胃肠科，以及 GPO
              支持的独立医疗机构。这些故事足够具体，能越过通常的“logo 墙”门槛：DOCS Dermatology 描述了一个试点，后来扩展到 10 个州 140 多个地点的 300 多名医疗服务方；Family
              Allergy 称审批时间中位数降至 1.1 天，护理工作量下降 70%；Goodman 描述了曾在别处被拒的患者在两到三天内获批；Optima 称 500
              多个任务的积压降至零；一家休斯敦过敏—风湿科机构称所有专科处方现在都经由 Forus；一名 GI 协调员称每日 PA 吞吐升至 15-30
              个授权。这些是公司撰写的故事，因此不等同于审计过的客户引用，但仍显著好于泛泛推荐语。它们显示产品已进入生产工作流，专科机构看到了可衡量的员工时间和治疗启动时间收益，也显示 Forus
              似乎靠日常运营实用性赢得扩张，而不只是靠模糊的 AI 叙事。
