      - number: '7.3'
        title: 支付方动态、报销摩擦与市场结构风险
        blocks:
          - type: paragraph
            body: >-
              Forus 要自动化的流程，交易对手正变得更难应对，而不是更容易。OIG 发现，一些 Medicare Advantage 的事前授权和付款拒绝本应按 Medicare 规则获批；ProPublica 和
              STAT 则记录了保险公司及外包利用管理供应商如何用算法、阈值调校和黑箱审核流程扩大拒付或缩短付款窗口。这些发现很重要，因为 Forus
              的产品承诺是缩短同一条审批路径，而不是取消支付方的拒付权。只要支付方标准持续变化、外包审核方按节省成本调参，或拒付转向借助 AI 审核后也划算的低成本服务，即便 Forus
              自身采用率看起来健康，它的自动化负担也会上升。


              商业侧也在恶化。IQVIA 报告称，新品牌药的初始拒付率在 2025 年达到 70%，24% 的新品牌理赔一年后仍未获批；KFF 民调显示，事前授权如今是许多参保成年人最大的非费用负担。这些数字为 Forus
              创造需求，也限制了任何工作流供应商在不吸收服务、声誉或合同风险的情况下能承诺多少。实践中，Forus
              仍依赖它无法控制的支付方指令、按品牌划分的网络规则和申诉行为；报销摩擦既是公司的核心市场机会，也是最大的剩余风险驱动因素之一。
