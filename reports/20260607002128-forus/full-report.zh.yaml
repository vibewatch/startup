      - number: '2.2'
        title: 用受约束视角测算市场规模
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个巨大的痛点池，但还没有一个干净、权威的 TAM。最宽的宏观视角是行政简化：KFF 描述美国医疗体系中存在一个摩擦密集的万亿美元级系统，CAQH 则称补齐自动化缺口仍有另外 $21 billion
              的节省机会。CMS 另行估计，仅事先授权互操作性规则一项就会在十年内节省约 $15 billion；这个数字更适合作为医疗福利事先授权数字化价值的监管底线，而不是完整市场规模数字。


              量级数据进一步约束了机会。Medicare Advantage 保险公司在 2024 年处理了近 53 million 个事先授权请求；Medicaid 仍面对处方药成本快速上升和利用控制广泛使用。IQVIA
              也预计，到 2029 年，创新疗法仍将是药品支出增长的最大驱动，这意味着更多高价疗法会继续伴随复杂的准入工作流。把这些视角合在一起，一个面向医疗服务方的 SAM 大致落在 $0.8 billion 到 $2.5
              billion 区间是可辩护的；更宽的 $2.5 billion 到 $6.0 billion TAM 只有在平台还能变现生物制药上市和数据产品时才合理。由于公开定价、合同和留存披露稀缺，精度仍有限。
