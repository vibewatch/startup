      - number: '7.4'
        title: 依赖、集中度与执行风险
        blocks:
          - type: paragraph
            body: >-
              核心商业模式风险在于，医疗服务方采用和变现不是一回事。公开材料称 Forus
              对医疗服务方和患者免费，外部报道则称收入来自制药关系和上市支持。采用率上升时，这种结构看起来很吸引人；但如果少数制药商预算、上市项目或合规敏感合作贡献了大部分收入，集中度风险就会显现。公开证据还显示，案例密度最重的领域是皮肤科、过敏、GI
              和风湿等专科用药工作流。这可能说明初始切入点很强，也提高了另一种可能：增长、留存和单位经济性比表面的诊所数量更依赖具体细分领域。


              执行风险会放大这种依赖。Forus 在 2026 年 5 月称，公司在纽约约有 100 名工程师和运营人员，已经接入主要 EHR，目前只支持电子处方。这意味着规模化仍取决于 EHR
              兼容性、运营支持、药房路由逻辑，以及足够的临床智能人员来跟上支付方变化。估值会放大每一次失误：Forbes 报道其估值 $1B、累计融资 $160M、收入运行率超过
              $50M；在尚未计入集中度和治理折价前，这意味着大约 20x 收入倍数。如果制药商收入比医疗服务方增长更不平滑，下行情境就是：业务对临床医生看起来很重要，但变现仍会突然波动。
