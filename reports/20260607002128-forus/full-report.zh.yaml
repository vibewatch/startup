      - number: '7.2'
        title: 隐私、数据治理与安全风险
        blocks:
          - type: paragraph
            body: >-
              隐私和安全是首要风险，因为 Forus 卡在开方医生、患者、药房、制药商和支付方之间，工作流数据会穿过医疗服务方门户、患者沟通和外部系统。公开缓释项有意义：Forus 称其符合 HIPAA、取得 SOC 2
              Type II 认证，并用 BAA 保护 PHI；HHS
              指引也给出了风险管理和泄露响应的清晰蓝图。但公司自己的隐私表述也制造了尽调张力。网站称匿名化数据和汇总洞察可出售给客户和第三方；医疗服务方门户隐私政策则称，医疗服务方信息可披露给患者、制药商和其他用户，门户还使用分析供应商和会话回放工具。


              这组信息不能证明滥用，但会把下行情境从技术事故扩展成信任和治理问题。FTC 指引即便在传统 HIPAA 框架之外，也把消费者健康信息视为安全敏感类别；FTC
              泄露规则还可能要求通知消费者、监管方和媒体。因此，公开文件仍留下几个未解问题：哪些信息被去标识化、再识别风险如何管理、制药商能看到什么、分包处理方如何受控。若答案薄弱，公司面临的可能不只是泄露责任，还包括医疗服务方反弹——临床准入工作流的数据副产物被商业化得过猛。
