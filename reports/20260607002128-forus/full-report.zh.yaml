            body: >-
              信任姿态好于纯营销套话，但仍不足以完成完整企业安全签核。Forus 公开声称符合 HIPAA、拥有 SOC 2 Type II 认证和 BAA
              覆盖；其隐私政策至少显示，公司意识到医疗服务方、患者和制造商角色需要分隔，也意识到去标识化或汇总数据产品的可能性。这些都是正面信号。HHS 指南也明确了任何处理 PHI
              的业务伙伴必须满足的最低门槛：与风险分析和访问控制绑定的行政、物理和技术保障。更大的尽调问题不是 Forus
              是否懂合规话术，而是仍有多少细节属于私有。已审阅公开材料没有披露事故历史、留存默认值、租户隔离或清晰的公开 SLA。另外，CMS 较新的互操作性规则改善了非药品事先授权
