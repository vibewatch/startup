      - number: '4.4'
        title: 披露限制、反向信号与承保结论
        blocks:
          - type: paragraph
            body: >-
              剩余尽调卡点不是小的修饰项，而是财务承保所需的核心输入。没有任何已审阅公开来源披露现金余额、烧钱速度、现金跑道、毛利率、CAC、回本周期、NRR、客户集中度，或按制造商项目划分的实际定价。雇主合同也缺乏公开支持，因此任何声称
              Forus 已经向雇主变现的说法都属推测。本章的反向证据来自 Forus
              自己的隐私披露：公开网站政策称，公司可能向客户和其他第三方出售匿名化数据和汇总洞察；医疗服务方门户政策称，在服务交付过程中，医疗服务方信息可披露给患者、制造商和其他用户，而营销沟通可能由第三方处理。这些披露可同时从两个方向解读：它们强化了面向制造商的数据和工作流服务变现逻辑，但也制造了隐私、治理和商业化尽调风险。财务结论：已披露证据指向强采用、生物制药主导的变现路径，以及
              2026 年融资后较低的近期融资压力；但收入质量、利润率路径和现金跑道仍需要管理层材料，才能完整承保这家公司。
