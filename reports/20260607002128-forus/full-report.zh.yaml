  - id: TP003
    title: 定价和包装对比
    columns:
      - 供应商
      - 公开定价信号
      - 来源包中的主要经济买方
      - 包装线索
      - 保留来源证据
      - 含义
    rows:
      - - Forus
        - 对提供方和患者免费
        - 暗示由生物制药和网络参与方付费
        - 处方医生流程内的单一编排工作流
        - 首页主打提供方和患者免费准入
        - 对诊所是强采用杠杆，但变现取决于交易对手方
      - - CoverMyMeds
        - 提供方和员工无需付费
        - 暗示网络侧参与方 / 企业参与方付费
        - ePA 加用药准入解决方案
        - 事先授权页面明确称提供方无需付费
        - 对“提供方免费”定位形成强势既有厂商回应
      - - Availity
        - Essentials 免费；Essentials Plus 收取象征性费用；企业自动化未列价
        - 提供方和健康计划
        - 门户、API 和智能 UM 模块
        - 资格页面显示免费与象征性收费层级；AuthAI 按企业工作流销售
        - 定价比 Forus 简单的“提供方免费”信息更分层、更偏企业
      - - RxLightning
        - 处方医生和员工无需付费
        - 专科药房、生物技术公司和制造商
        - 独立门户加 API / 品牌化集成
        - FAQ 称提供方访问免费，由合作伙伴出资
        - 在专科用药工作流的免费前端上线环节直接竞争
      - - TailorMed
        - 保留公开来源未披露
        - 提供方、药房、生命科学
        - 核心平台加服务和制造商模块
        - 首页和公司页强调模块与网络，不列价
        - 可能是企业销售动作，采购周期更长
      - - AssistRx
        - 保留公开来源未披露
        - 生命科学和提供方项目
        - 技术 + 人才 + 药房网络打包
        - 解决方案页面强调组合服务模式，而不是费率
        - 当需求包含人员配置时，服务占比更高的包装更容易赢
      - - Foundation Health
        - 保留公开来源未披露
        - 医疗系统、药房、计划、制药
        - 面向药房的模块化 AI 操作系统
        - 首页以演示为主、模块化呈现，不列价
        - 销售企业工作流，而不是轻量的处方医生自助产品
    notes: “未披露”仅指保留的公开来源包；并不表示私人合同或销售材料中不存在定价。
