            title: 痛点、政策和经济性对齐，所以切入点真实存在
            body: 这个市场不是投机性的“未来某天 AI”品类。医生已经普遍报告延误和治疗放弃，CMS 正把医疗福利工作流推向数字 API，CAQH 和 CMS 也都量化了降低事先授权碎片化运营后的可观节省。
