  - id: TP004
    title: 分发、中立性与切换成本评估
    columns:
      - 供应商 / 类型
      - 主要分发资产
      - 中立定位
      - 主要锁定抓手
      - 对 Forus 的含义
    rows:
      - - Forus
        - 嵌入式处方医生工作流，加上支付方 / 药房 / 生物制药连接
        - 高
        - 工作流数据、提供方习惯和跨方网络洞察
        - 当提供方需要一个前端连接各类参与方时，Forus 定位最好
      - - CoverMyMeds
        - McKesson 持股，加上庞大的服务方 / 药房 / EHR 网络
        - 中
        - 既有服务方工作流，以及支付方 / 药房集成
        - ePA 主导账户中最难替换的直接既有玩家
      - - Availity
        - 170+ 个健康计划、3.4M 个服务方、支付方信任、FHIR API
        - 中高
        - 支付方合同、API，以及对服务方门户的依赖
        - 健康计划主导工作流设计时，竞争力很强
      - - Surescripts
        - 覆盖几乎所有 EHR、PBM、药房和临床医生的 Network Alliance
        - 中
        - 内嵌处方与权益情报轨道
        - 即便编排由另一家供应商掌握，仍可留在技术栈里
      - - Myndshft
        - 规则库、覆盖人群触达和系统集成
        - 中
        - 支付方规则引擎，以及嵌入源系统的自动化
        - 买方更看重自动路径选择、而不是大网络品牌时，Myndshft 有竞争力
      - - TailorMed
        - 庞大的服务方 / 药房 / 制药商费用支持网络
        - 中
        - 援助网络数据和运营工作流
        - 可补足 Forus，也可能把费用支持层从 Forus 手中拿走
      - - Epic 原生
        - 已部署 EHR 覆盖面和内部药房队列
        - 低
        - 工作流习惯、配置投入和员工培训
        - 机构偏好本地自建、少引入供应商时，就是够用替代品
      - - 手工 / 内部团队
        - 既有员工、支付方门户、传真兜底和本地知识
        - 理论上高，效率低
        - 人工绕行方案和组织惯性
        - 形成缓慢但持续的非软件竞争
    notes: 中立性评分来自定性判断：看各供应商在公开材料中围绕哪一方展开，以及商业关系看起来在哪一方最强。
    enumerationScope:
