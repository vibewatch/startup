      - number: '1.2'
        title: 创始人、领导层梯队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              公司明显由创始人主导。Sahir Jaggi 是官方发布和独立媒体报道中最突出的公开高管；他在 Oscar Health 的经历加上 Columbia
              生物医学训练，为公司在用药可及性和保险工作流复杂性上提供了可信的创始人市场契合叙事。同样的集中度也带来关键人物依赖，因为 Jaggi
              仍是使命、产品逻辑和融资的主要对外面孔。本轮抓取的公开资料至少识别出另一位医疗负责人 Adam Harris, MD，职位为 Head of Clinical
              Intelligence；招聘页面也显示公司在纽约积极招聘财务、工程、数据、医疗服务方增长和运营岗位。即便如此，更广泛的领导层梯队没有以清晰公开组织图披露，公开记录也没有浮现董事会名单、投票结构或详细的投资方治理权。信任中心记录比治理记录更完整：它显示
              Tandem 和 Forus 两个名称下都有干净的 SOC 2 Type II 审计，支持公司在更名过程中维持运营连续性，尽管公司控制权透明度仍有限。
