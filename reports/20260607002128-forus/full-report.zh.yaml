            body: >-
              融资是 Forus 故事中公开证据最强的部分之一，但它仍不是一份干净的传统逐轮融资台账。公司及媒体报道称 Forus 在 2026 年 5 月融资超过 $160M；Forbes 补充了关键细节：Thrive
              Capital、General Catalyst 和 Accel 都曾领投此前未公告的融资，这些融资只是在公司以 Forus 新品牌公开亮相时才浮出水面。Forbes 还报道了 $1B
              估值，以及年化收入到年底已超过 $10M、2026 年正跑在 $50M 以上。这些都是阶段和动能的有意义信号，但不能替代经审计或已提交的财务披露。投资方名单现在在名称层面清楚：Thrive、General
              Catalyst、Accel、Bain Capital Ventures、Redpoint、BoxGroup 和 Pear VC
              都在抓取来源中反复出现。同样重要的是仍然不透明的部分：公开来源仍未披露董事席位、持股比例、债务工具、清算优先权，或融资包中的任何老股交易成分。
