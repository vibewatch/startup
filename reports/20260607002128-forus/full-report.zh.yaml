  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: Forus 的公开材料描述了一条闭环运营流程：从 eRx 到获批、可负担、路由正确的用药。
    approximationNotes: 流程基于公开工作流说明和客户故事，而不是 Forus 工程团队发布的流程图。
    data:
      nodes:
        - id: prescribe
          label: 开出处方
          detail: 临床医生从 EHR 或电子处方工具开出电子处方。
        - id: assemble
          label: 汇总病历与表单
          detail: Forus 在已集成场景提取笔记，拉取正确表单，并标记缺失信息。
        - id: submit
          label: 提交 PA 与注册
          detail: 平台提交预授权或药企注册工作流，并开始跟进。
        - id: resolve
          label: 解决拒批、申诉与可负担性
          detail: 如有需要，Forus 起草申诉，支持过渡用药或 PAP 路径，让员工聚焦决策点。
        - id: route
          label: 处方路由到正确药房
          detail: 处方根据付款方和网络规则，发送到患者偏好或要求的药房。
        - id: notify
          label: 持续通知患者直至可取药
          detail: 患者通过短信收到主动状态更新，也可用电话或邮件作为兜底支持。
      edges:
        - from: prescribe
          to: assemble
          label: 触发准入工作流
        - from: assemble
          to: submit
          label: 准备干净提交材料
        - from: submit
          to: resolve
          label: 处理拒批或援助需求
        - from: resolve
          to: route
          label: 选择取药路径
        - from: route
          to: notify
          label: 确认下一步
