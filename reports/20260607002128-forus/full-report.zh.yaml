    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品工作流与当前公司形态
        blocks:
          - type: paragraph
            body: >-
              Forus 最适合被理解为一家纽约私营医疗 AI
              公司，专注处理医生开出处方到患者真正开始治疗之间那段混乱后台。官方材料反复把产品描述为嵌入医生工作流的软件，自动处理事先授权、申诉、支付能力支持和药房分流；面向患者的页面则强调，医生和患者不直接为服务付费。命名沿革很重要：更早的公开资料使用
              Tandem 或 withtandem 品牌，而 2026 年 5 月公告把 Forus 确认为正式名称，几处旧页面现在也标注 Tandem 已在全文替换为 Forus。Forbes 和 citybiz
              的公开时间线把当前公司追溯到 2023 年成立，现有公司材料仍把运营锚定在纽约。因此，公开记录在身份、工作流和品类契合度上很强，但在精确客户数、审计收入质量和完整办公室布局等传统封面指标上较弱。
