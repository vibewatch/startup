      - number: '8.4'
        title: 战略可选性真实存在，但承销应等待硬尽调包
        blocks:
          - type: paragraph
            body: >-
              可见的 2025-2026 年市场报告同时说明两件事：AI 原生医疗工作流公司能融到更大的轮次、吸引 M&A 兴趣，但公开市场投资人仍奖励披露质量、惩罚信任缺口。这解释了为什么 Forus
              即便公开经济性有限，也能拿到大额融资。如果公司确实拥有开方者、支付方、药房和药品上市之间对决策至关重要的准入层，它对工作流、商业化、药房自动化、收入周期或支付方邻近平台都可能有战略价值。但战略可选性比 IPO
              准备度更容易相信。公开市场仍会要求经审计收入、持久的利润率结构、留存和治理证据，而这里都披露不足。因此，实务建议不是否定这个资产，而是强制要求一套严格尽调包：经审计的 2026
              年收入、毛利率和队列留存、按专科和客户划分的集中度、配药成功率结果，以及优先股堆叠。在这些材料出现之前，价格敏感性比欣赏资产更重要。
