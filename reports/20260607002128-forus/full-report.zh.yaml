    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              对一家年轻的私营医疗软件公司来说，Forus 对外披露的信息异常具体。核心承诺不是泛泛的行政 AI，而是在临床医生作出处方决定后，自动化用药可及性链条。官网、患者页面和现场代表指南反复呈现同一顺序：从 EHR
              开出电子处方后，Forus
              收集病历上下文，生成正确的事先授权和登记表，跟进支付方和专科药房，把处方分流到正确的调剂渠道，支持支付能力路径，并持续更新患者。重要的是，申诉和续期跟踪被包装为内置步骤，而不是定制专业服务例外。这让 Forus
              比狭窄的 ePA 助手或专科药房支持中心拥有更完整的工作流主张。主要限制在边界定义：Forus 显然在电子处方已经流动后最强，因此应被评估为一层数字准入自动化，而不是通用受理或调剂系统。
