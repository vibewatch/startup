  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状
        blocks:
          - type: paragraph
            body: >-
              Forus
              最适合放在美国用药可及性自动化市场中分析：软件和工作流编排把已开出的治疗方案推进到保险权益核查、事先授权、申诉、支付能力支持、药房分流和患者状态更新。其公开材料把产品定位为自动化从处方到可负担用药的每一步，并协调医生、药房、支付方和生物制药公司，而不是为单一交易提供点状工具。


              因此，纳入支出的范围包括面向医疗服务方的工作流软件、嵌入式 EHR
              操作、协调员仪表盘、支付方和药房沟通、过渡用药或患者援助登记支持，以及与患者是否真正开始治疗相关的分析。排除支出包括药物发现、制造、批发商经济性、药房调剂利润，以及不解决用药可及性瓶颈的通用收入周期工具。最接近的替代方案是电话、传真和电子表格等人工工作流；支付方门户；只解决流程某一片段的专科药房或支持中心；以及只传输表格、但不协调完整旅程的
              EHR 原生功能。这个边界很重要，因为广义处方药支出极其庞大，但能被直接变现的只是更小的一层工作流软件。
