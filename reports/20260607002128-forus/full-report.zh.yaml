      - number: '6.4'
        title: 持久性和扩张风险：真实采用信号存在，但留存、集中度和企业证明披露仍不足
        blocks:
          - type: paragraph
            body: >-
              客户尽调的核心问题不是 Forus
              是否有真实用户，而是这种使用有多持久、能否迁移。没有任何保留公开来源披露续约队列、NRR、GRR、流失、合同期限或付费转化数据。公开信息也没有显示哪些支付方、医疗体系或生物制药账户驱动业务。2026
              年，这一点更重要，因为周边市场正变得不那么宽容。MGMA 称事先授权仍是对医疗机构最具破坏性的行政负担之一；Everest 称大型保险公司正在转向更严格的电子化和实时授权预期；PHTI 明确警告，把 AI
              用在破损工作流上，可能增加系统活动量，却不降低总成本。这些交叉水流对 Forus 有双向影响：它们扩大了对工作流自动化的需求，也抬高了证明门槛。因此，最诚实的结论应保持平衡。Forus
