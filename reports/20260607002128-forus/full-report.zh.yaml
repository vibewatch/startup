              网络的患者侧和生物制药侧都可见，但可见方式不同。患者看到的是运营层：免费服务、短信更新、支付能力帮助、药房协调，以及更少的状态电话循环。案例研究强化了这些功能并非装饰——医疗服务方反复描述更快启动、更少掉线流程和更好沟通。生物制药可见度更偏战略，而不是具名：Forus
