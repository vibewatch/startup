  - id: TP001
    title: 竞争对手画像表
    columns:
      - 供应商 / 类型
      - 类别
      - 规模 / 所有权 / 融资信号
      - 主要买方
      - 工作流重点
      - 核心优势
      - 相比 Forus 的主要短板
    rows:
      - - Forus
        - 端到端用药准入编排平台
        - 已融资 $160M；数千家诊所；约 100 名工程师
        - 诊所、医疗系统、生物制药
        - 处方医生工作流内的授权、可负担性和路由
        - 公开表述中工作流覆盖最深；对提供方 / 患者免费；跨方网络
        - 公开披露的已部署网络小于既有通道
      - - CoverMyMeds / McKesson
        - 用药准入既有厂商
        - McKesson 旗下；350+ 个 EHR；50k+ 家药房；1M+ 个提供方
        - 提供方、药房、健康计划、PBM
        - ePA、用药准入和一体化专科上线
        - 提供方 / 药房覆盖极大，现有工作流嵌入很深
        - 中立性不如 Forus 明显，历史强项是 PA，而不是处方后的所有步骤
      - - Availity
        - 支付方 / 提供方网络既有厂商
        - 最大双边网络；170+ 个健康计划；3.4M 个提供方
        - 健康计划、提供方、HIT
        - 资格核验、授权、利用管理
        - 支付方侧分发、中立定位、FHIR 原生连接
        - 对履约路由和可负担性编排的聚焦较少
      - - Myndshft
        - AI 自动化挑战者
        - 覆盖 94% 参保人群；600+ 条支付方规则；私营公司
        - 提供方、药房、支付方、PBM、制造商
        - 福利、患者自付责任、保险发现、医疗与药房 PA
        - 自动化范围广，支付方规则叙事强
        - 公开证据更偏工作流主张，分发证明较弱
      - - Surescripts
        - 网络和智能既有厂商
        - 2M+ 专业人员和组织；2025 年 1B 次 RTPB 响应
        - EHR、PBM、医疗系统、计划
        - RTPB、ePA 和专科连接
        - 处方工作流中嵌入最深的福利智能通道
        - 掌握关键通道，但不覆盖每个可负担性和路由步骤
      - - AssistRx
        - 服务占比高的专科准入供应商
        - 40+ 家生命科学公司；数百万患者；数十万提供方
        - 生命科学、hub、提供方
        - ePrescribing、eEnrollment、精选药房网络、依从性
        - 技术加服务模式能补上纯软件覆盖不到的运营缺口
        - 中立性弱于 Forus，更偏制造商项目
      - - TailorMed
        - 可负担性和用药成功平台
        - 75M+ 患者；3,100+ 家药房；950+ 家医院；4,700+ 家诊所
        - 提供方、药房、生命科学
        - 可负担性、准入、依从性、制造商项目激活
        - 本来源包披露的最大可负担性网络
        - 重心在可负担性和援助，而非纯处方医生路由
      - - Epic 原生 + 内部 PA 团队
        - EHR 原生替代方案
        - EHR 装机基础大；本地搭建和人员配置决定深度
        - 医疗系统和一体化交付网络
        - 原生 ePA、RTPB、收件箱、MSOT、患者管理
        - 把工作留在临床医生已经使用的系统内
        - 需要本地配置、人员覆盖和外部数据 / 网络连接
      - - Foundation Health
        - 专科药房操作系统挑战者
        - 私营公司；聚焦企业级医疗系统
        - 医疗系统、药房、计划、制药
        - 福利核查、测试理赔、PA、申诉、患者沟通
        - 专科药房工作流自动化很深
        - 广泛多方网络中立性的证据少于 Forus
    notes: 规模或融资单元格只使用保留的公开来源信号；若确切融资未公开，则用所有权或网络披露来避免空白。
