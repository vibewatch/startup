  - id: TP005
    title: 护城河耐久性与竞争风险清单
    columns:
      - 风险或护城河问题
      - 风险兑现时受益方
      - 证据
      - 严重性
      - 影响 / 尽调问题
    rows:
      - - 既有玩家分销能力跑赢工作流深度
        - CoverMyMeds、Surescripts、Availity
        - 已披露的大型网络和支付方 / EHR 内嵌能力，规模仍远大于 Forus 公开披露的体量
        - 高
        - 按既有玩家类型索取胜率数据，并量化广泛编排在哪些场景胜过内嵌轨道
      - - 支付方侧 AI 缩小差异化
        - Availity 与 Myndshft
        - 两家公司都主打 AI 驱动的授权逻辑、透明度和规则自动化
        - 中高
        - 验证 Forus 在医疗 / 药房权益混合场景里，自动化是否更强，而不只是 AI 话术相似
      - - 专科工作流供应商吸收相邻环节
        - AssistRx、TailorMed、Foundation、RxLightning
        - 各自占住更窄但痛点明确的环节，如费用支持、注册或专科药运营
        - 中
        - 梳理哪些账户想要单一供应商，哪些账户更愿意在费用支持、服务和路径分流上叠加最佳单点层
      - - Epic 原生进展压缩从零部署需求
        - Epic 加内部团队
        - Iowa 与 UTMB 说明，Epic 如今比过去更能集中 PA 和专科药路径分流
        - 中
        - 评估 Forus 在哪些场景能作为附加层胜出，哪些场景里 Epic 原生配置已「足够好」
      - - 公开定价和 ROI 证明仍不透明
        - 所有企业级供应商
        - 大多数纳入来源都未给出明确合同价格或客户节省额对比
        - 中
        - 尽调中索取价目表、实施范围和已兑现的吞吐量提升
      - - 即便监管推进，手工替代仍顽固
        - 内部团队和接单门户
        - CMS、AHA/AMA 和 Cohere 都显示，服务方摩擦仍处在结构性高位
        - 中
        - 不要假设 CMS 政策会自动把手工账户转成软件供应商能拿下的账户
    notes: 严重性衡量的是 Forus 差异化论点的下行风险，不是整个医疗体系的下行风险。
    enumerationScope:
