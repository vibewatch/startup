      - number: '2.3'
        title: 买方、用户与付款方动态
        blocks:
          - type: paragraph
            body: >-
              日常用户通常是最直接感受到准入摩擦的人：医生、医助、生物制剂协调员、护士，或处方工作流里的药房支持人员。但直接买方更可能是医疗服务方组织、专科平台、MSO、GPO
              或医疗系统业务线，它们可以把工作流软件解释为运营杠杆，并铺到许多处方医生和协调员身上。Forus 自己的公开案例研究正偏向这些场景。


              支付方很少是 Forus 公开产品叙事中的初始买方，但它们仍塑造市场，因为其文件规则、响应时间、福利设计选择和药房分流约束决定了自动化有多大价值。Medicare Advantage
              几乎普遍使用事先授权，Medicaid 项目及其 PBM 也依赖事先授权、首选药品目录和返利驱动的利用控制。这意味着市场在结构上是多边的：医疗服务方预算决定软件采购，但支付方行为制造痛点和潜在
              ROI。因此，最佳早期客户细分是专科药占比高、协调员多、规模足以把节省时间转化为更高患者吞吐或更少招聘的组织。
