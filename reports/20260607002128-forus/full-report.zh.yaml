          low: 0.12
          mid: 0.2
          high: 0.28
          unit: USD B
          detail: 倍数压缩叠加合规拖累。
        - label: 基准
          low: 0.35
          mid: 0.46
          high: 0.56
          unit: USD B
          detail: 按当前公开规模套用高溢价上市可比区间。
        - label: 乐观
          low: 0.9
          mid: 1.1
          high: 1.4
          unit: USD B
          detail: 运行率快速放大，战略溢价守住。
    approximationNotes: 区间是根据公开证据和可比公司倍数逻辑得出的判断带，单位为十亿美元；不是完整 DCF 或谈判条款清单。
