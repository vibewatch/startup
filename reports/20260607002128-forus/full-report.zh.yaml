      - number: '1.4'
        title: 牵引信号、里程碑时间线与负面悬念
        blocks:
          - type: paragraph
            body: >-
              对一家年轻私营公司来说，Forus
              的公开牵引证据异常丰富，因为它发布了跨多个专科的详细客户故事。这些案例显示，产品已在皮肤科、胃肠科、过敏科、风湿科、肺科、睡眠和多专科医疗机构场景中被采用，声称带来的改善包括同日启动、更短审批时间、更少行政工作和更高处方吞吐。公司层面的规模主张也很激进：公告称过去两年采用量同比各增长
              10x，平台被全美 50 个州数千家医疗机构和医疗体系使用，患者触达已覆盖近 80% 的美国邮编区，全球前 10 大生物制药公司中有 5 家与 Forus 合作。主要负面覆盖并不是已披露的 Forus
              专属诉讼、制裁或泄露；本次抓取没有浮现这类信息。最清晰的已记录逆风来自外部。CMS 正在提出药品事先授权互操作性规则，KFF 和 National Health Law Program 则描述了围绕 AI
              驱动授权工作流的偏见、隐私、人工复核和申诉权的审查升温。这意味着公司正在一个既可能认可、也可能约束其自动化护城河的政策环境中扩张。
