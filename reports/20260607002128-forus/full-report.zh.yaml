      - number: '5.3'
        title: 网络、AI 与客户证明
        blocks:
          - type: paragraph
            body: >-
              Forus 的差异化故事建立在两个相互连接的主张上：第一，它正在医生、支付方、药房、患者和生物制药之间搭建一个全国准入网络；第二，随着更多处方流经网络，AI 会变得更有价值。公开证据在方向上支持这一点。公司材料和
              Forbes 都把 Forus 描述为连接这些参与方的工作流层；公司页面加上 Clinical Intelligence 材料显示，AI 工作不止于文案生成。Forus 明确投资 RAG
              驱动的申诉、临床医生在回路的产品设计、应用 AI、数据科学，以及来自数百万患者结果的反馈。客户故事也显示产品已在皮肤科、过敏科、GI、肺科和睡眠、GPO
              驱动运营以及多站点专科集团中运行。这个广度很重要，因为它说明核心自动化可以跨专科迁移。尽管如此，大多数绩效证据仍由公司撰写。客户故事比空洞推荐语丰富得多，但并不等同于第三方基准，尤其是对更新的 AI
