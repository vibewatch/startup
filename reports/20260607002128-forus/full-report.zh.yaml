      - number: '3.3'
        title: 相邻挑战者和替代方案靠拿下更窄但更痛的片段取胜
        blocks:
          - type: paragraph
            body: >-
              相邻厂商通过占住治疗启动工作流中更窄但痛感更强的片段来竞争。AssistRx 结合软件、服务和选择性药房网络运营，为药企赞助支持服务。RxLightning 将专科、PAP
              和支持中心登记数字化，并给出处方医生免费使用的强卖点。TailorMed
              在医院、诊所和药房之间拥有巨大的支付能力和依从性触达；在一些账户中，它更像补充而不是完全替代，但当支付能力是卡点时，它高度相关。Foundation Health
              更接近专科药房操作系统，覆盖保险权益核查、测试理赔、事先授权、申诉和患者沟通。


              基于 Epic 的替代方案正在改善，也值得重视。Iowa 记录了 Epic 内的前瞻性和回顾性用药事先授权；UTMB 报告称，MSOT 加 Compass Rose
              减少了人工交接，并改善了从开方到调剂的连续性。即便如此，这些替代方案仍依赖本地配置、药房团队和外部数据源。这也是 Cohere 等厂商仍主张，在 EHR 原生采用追上来之前，门户和编排层依然必要的原因。
