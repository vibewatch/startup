            body: >-
              公开可比公司并不完美，但仍会逼出定价纪律。Waystar 和 Phreesia 框住医疗工作流与报销软件；Doximity 代表医生工作流分发；Veeva 展示顶级生命科学软件平台能拿到的估值；Omnicell
              是药房自动化锚点，Tempus 则是最清晰的 AI 医疗溢价参照。可见的市值和收入快照显示，这些公开公司大致处在 1.3x 到 8.8x 市值 / 收入区间；Bessemer 的 Health Tech 2.0
              框架则把较新的 AI 医疗公开公司组平均放在约 7.2x EV / 收入，Tempus 接近 9.3x。在这个背景下，Forus 据报道估值 $1B、收入运行率超过
              $50M，仍然偏贵。乐观情景要求公司以极快增长跑进估值，并拿到战略溢价地位。基准情景认为公司不错，但价格仍跑在公开证据前面。悲观情景则是，合规拖累、扩张放缓或市场重估任意组合，都可能在业务体量追上融资标题之前大幅压缩价值。
