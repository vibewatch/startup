      - number: '8.2'
        title: 投资逻辑是开方点位的工作流稀缺性；反向逻辑是证据质量和受监管技术栈的脆弱性
        blocks:
          - type: paragraph
            body: >-
              可见的乐观情景不难讲清楚。官方来源称，Forus 直接卡在医生开方和患者真正开始治疗之间的行政缺口里，在全国网络上自动化授权、可负担性和履约步骤。官方与第三方报道也称，公司已服务数千家诊所，触达接近 80%
              邮编地区的患者，并与大型生物制药公司建立关系。基于这些可见事实，可以合理推断出战略稀缺性：平台能看见医疗服务方在哪里卡住、患者在哪里流失、药品上市在哪里成功或失败。反向逻辑在于，这个故事很大一部分仍由公司主导，而非独立审计。外部法律和医疗
              AI 来源也警告，药房邻近自动化正面临更强合规审查、隐私风险、算法偏见风险和落地摩擦。今天能看见的是有意义的产品拉力；仍需推断的是，这种拉力能否转化成持久的类软件经济性，并支撑风投级溢价估值。
