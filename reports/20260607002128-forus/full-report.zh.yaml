  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 2026 年尽调显示收入或类 ARR 运行率已接近 $90M-$120M，软件式利润率开始出现，药企上市工作流深化，战略买家重视网络沉淀数据。
        - $0.9B-$1.4B，按更高收入运行率约 10x-12x 计算；除非增长显著高于公开证据，否则只比当前估值标记略高。
        - 需要异常快地把增长转成收入，还要证明工作流层更像顶级软件，而不是人力很重的行政服务。
        - 有可能，但公开记录只能部分支撑。
      - - 基准
        - 公开证据大致指向 $50M-$70M 收入运行率，增长仍强，但经济性尚未证实；投资人采用高溢价公开可比公司的区间，而不是蓝天式 AI 倍数。
        - $0.35B-$0.56B，按公开证据规模约 6x-8x 计算。
        - 即便这个区间，也假设业务真实，且合规或集中度没有明显恶化。
        - 最符合当前公开记录所能支撑的结论。
      - - 悲观
        - 增长放缓、实施复杂度延续，或合规和隐私顾虑抬高摩擦，同时公开市场倍数压缩。
        - $0.12B-$0.28B，按 $40M-$55M 收入约 3x-5x 计算。
        - 隐藏优先权、集中度或低于预期的配药完成率经济性，都可能放大下行。
        - 如果尽调填不上当前披露缺口，这就是可信的下行情景。
    notes: 这些区间是以十亿美元计的判断带，来自公开收入锚点和可比倍数纪律，不是管理层预测或 DCF。
