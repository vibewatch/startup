      - number: '2.4'
        title: 工作流痛点、监管驱动与 AI 采用摩擦
        blocks:
          - type: paragraph
            body: >-
              工作流痛点真实且有充分记录。AMA 的 2026 年医生调查称，95% 的医生认为事先授权造成护理延误，79% 称它可能导致患者放弃治疗；26%
              称它曾给自己照护的患者造成严重不良事件。独立研究补充了运营视角：医疗服务方员工每年花在事先授权上的劳动力，相当于超过 100,000 名全职注册护士；更广义的用药可及性横跨七个工作流节点和 18
              个反复出现的障碍。专科药研究说明了这件事的经济意义：高自付额会把放弃率推到 75% 以上，整合式专科药房模式则能实质改善准入和启动。


              监管正在迫使这个市场的一部分数字化。CMS 要求主要从 2026 年开始加快医疗福利决策，并主要到 2027 年采用基于 FHIR 的事先授权 API；但药房福利工作流仍较不标准化，因为多项新 API
              义务把药品排除在外。这既是驱动因素，也是摩擦点：支付方对事先授权 AI 兴趣很强，但医疗服务方受预算和信任约束，仍谨慎得多。因此，市场被硬 ROI
              和政策压力向前拉，同时又被集成工作、组织保守性，以及医疗和药房福利标准覆盖不均拖慢。
