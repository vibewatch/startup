  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              已披露公开证据支持一个明确的定价事实：Forus 不向医疗服务方或患者收费。官方公司材料、患者页面和现场代表指南都说产品在医疗服务方和患者侧免费；同一份现场代表指南还说行业伙伴支持这些工作流，Forus
              与制造商合作定制登记旅程、支持中心登记、过渡项目和 PAP。再结合公司声称全球前 10 大生物制药公司中已有 5 家与 Forus
              合作，以及其网络帮助生命科学公司更高效地设计研究和上市药品，最能被支持的收入假设是由生物制药资助的准入赋能、上市支持和相关洞察服务。最后一步是推断，而不是直接披露。没有任何已审阅公开来源发布雇主合同收入、医疗服务方订阅定价，或制造商分析的标价卡，因此收入机制在方向上可见，但收入流组合和实际定价仍为私有。
