  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: market sizing
    missingEvidence: Actual pricing, average contract value, revenue mix by provider versus biopharma, and implementation economics for Forus-class platforms.
    whyItMatters: Without contract economics, the public SAM and TAM estimates remain wide ranges rather than diligence-grade underwriting numbers.
    diligencePath: Request customer contract samples, ACV by segment, revenue mix, and cohort ramp assumptions; then rebuild the TAM/SAM/SOM lens from realized monetization rather than workflow volume proxies.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: moat proof
    missingEvidence: Independent benchmarks for approval-rate lift, time-to-therapy reduction, retention, and the depth of EHR, PBM, and payer integrations.
    whyItMatters: The bull case depends on a defensible data or network advantage, but most public operating evidence is still company-authored case-study material.
    diligencePath: Request payer-by-payer performance dashboards, integration inventories, logo retention by cohort, and customer reference calls in multisite specialty practices and health systems.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: standardization risk
    missingEvidence: Independent evidence on whether FHIR prior-authorization APIs and incumbent payer or EHR tooling will expand third-party orchestration value or commoditize it.
    whyItMatters: 'This is the key adverse market-shape question: if standards flatten the transport layer faster than vendors accumulate intelligence, margins and switching costs could compress.'
    diligencePath: Interview payers, EHR vendors, specialty pharmacies, and providers on what remains painful after API rollout, then compare vendor differentiation on routing, appeals, affordability, and analytics rather than API connectivity alone.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM004
