callouts:
- calloutType: strength
  title: The wedge is real because pain, policy, and economics line up
  body: This market is not a speculative “AI someday” category. Physicians already report widespread delays and abandonment, CMS is forcing medical-benefit workflows toward digital APIs, and both CAQH and CMS quantify meaningful savings from less-fragmented prior-authorization operations.
  claimRefs:
  - CM009
  - CM010
  - CM023
  - CM024
  - CM036
  - CM037
- calloutType: risk
  title: Owning transport is not enough to earn a durable moat
  body: If a vendor only moves forms faster, standards and incumbents can catch up. The defensible layer is the intelligence around routing, appeals, affordability, specialty nuance, and cross-party feedback — and public evidence proving that layer is still limited.
  claimRefs:
  - CM047
  - CM048
  - CM049
  - CM050
- calloutType: insight
  title: Specialty and multisite operators are the clearest early beachhead
  body: The most compelling public proof points come from specialty-heavy, coordinator-heavy environments where every saved call or fax compounds across many providers and sites. That suggests workflow concentration, not broad primary-care ubiquity, is the best near-term adoption pattern.
  claimRefs:
  - CM021
  - CM044
  - CM045
  - CM046
