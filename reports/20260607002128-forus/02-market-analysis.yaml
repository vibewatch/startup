- id: workflow-drivers-and-frictions
  title: Workflow pain, regulatory drivers, and AI adoption friction
  body: |-
    The workflow pain is real and well documented. AMA's 2026 physician survey says 95% of physicians see care delays from prior authorization and 79% say it can lead to treatment abandonment; 26% say it has caused a serious adverse event for a patient in their care. Independent research adds the operational view: provider employees spend labor equivalent to more than 100,000 full-time registered nurses per year on prior authorization, and medication access more broadly spans seven workflow nodes and 18 recurring barriers. Specialty-drug studies show why this matters economically: high copays can push abandonment above 75%, and integrated specialty-pharmacy models can materially improve access and initiation.

    Regulation is now forcing parts of this market to digitize. CMS requires faster medical-benefit decisions starting mainly in 2026 and FHIR-based prior-authorization APIs mainly by 2027, but pharmacy-benefit workflows remain less standardized because drugs are carved out of several of the new API obligations. That creates both a driver and a friction point: payers have strong interest in AI for prior authorization, yet providers remain far more cautious because of budget and trust constraints. The market is therefore pulled forward by hard ROI and policy pressure, but slowed by integration work, organizational conservatism, and uneven standards coverage across medical and pharmacy benefits.
