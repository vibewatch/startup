chapter:
  number: 2
  title: Market Analysis
  summary: Forus sits in a real but hard-to-size U.S. medication-access automation market created by pervasive prior authorization, specialty-drug complexity, and rising payer cost pressure. External evidence supports a large economic pain pool, including a $21 billion CAQH automation opportunity, nearly 53 million Medicare Advantage prior-authorization requests in 2024, and CMS's $15 billion ten-year savings estimate from digitizing medical-benefit prior authorization. A provider-side software SAM in the high-hundreds-of-millions to low-billions is plausible, but the true upside depends on whether Forus can turn workflow exhaust into cross-party data and launch intelligence before standards and incumbents commoditize the transport layer.
sections:
- id: market-boundary
  title: Market boundary and status quo
  body: |-
    Forus is best analyzed inside the U.S. medication-access automation market: software and workflow orchestration that moves a prescribed therapy through benefit investigation, prior authorization, appeals, affordability support, pharmacy routing, and patient status updates. Its public materials frame the product as automating every step from prescription to affordable access and as coordinating doctors, pharmacies, payers, and biopharma rather than acting as a point tool for a single transaction.

    Included spend therefore covers provider-facing workflow software, embedded EHR actions, coordinator dashboards, payer and pharmacy communication, bridge or patient-assistance enrollment support, and analytics tied to whether a patient actually starts therapy. Excluded spend includes drug discovery, manufacturing, wholesaler economics, pharmacy dispensing margin, and generic revenue-cycle tools that do not solve medication-access bottlenecks. The closest substitutes are manual phone, fax, and spreadsheet workflows; payer portals; specialty pharmacies or hubs that solve only one slice of the process; and EHR-native features that transport forms without coordinating the full journey. That boundary matters because broad prescription-drug spend is enormous, but only a smaller workflow-software layer is directly monetizable.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Sizing the market with constrained lenses
  body: |-
    Public evidence supports a large pain pool but not one clean canonical TAM. The broadest macro lens is administrative simplification: KFF describes a trillion-dollar friction-filled system inside U.S. healthcare, and CAQH says another $21 billion of savings opportunity still remains from closing automation gaps. CMS separately estimates that its prior-authorization interoperability rule alone will save about $15 billion over ten years, which is best viewed as a regulatory floor on the value of digitizing medical-benefit prior authorization rather than a full market-size number.

    Volume data help constrain the opportunity further. Medicare Advantage insurers processed nearly 53 million prior-authorization requests in 2024, while Medicaid continues to face rapid prescription-drug cost growth and extensive use of utilization controls. IQVIA also expects innovative therapeutics to remain the largest driver of medicine-spending growth through 2029, which implies more expensive therapies will continue to carry complicated access workflows. Putting those lenses together, a provider-facing SAM in roughly the $0.8 billion to $2.5 billion range is defensible, while a broader $2.5 billion to $6.0 billion TAM becomes plausible only if a platform also monetizes biopharma launch and data products. Precision remains limited because public pricing, contract, and retention disclosures are scarce.
