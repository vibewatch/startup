- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - evidence
  - what would change the view
  rows:
  - - Thesis
    - Forus appears to own a high-friction workflow layer between prescription, payer approval, affordability support, pharmacy routing, and pharma launch analytics, and public sources show real national adoption momentum.
    - Upgrade the view if diligence proves the workflow position translates into software-like gross margins, durable retention, and concentration that is lower than feared.
  - - Anti-thesis
    - The company-led story sits inside a regulated pharmacy and patient-data stack, while the public valuation anchor is richer than public comps and the economics disclosure is still thin.
    - Downgrade quickly if reported growth does not reconcile to audited revenue, if preference terms are aggressive, or if compliance friction slows scale.
  notes: The anti-thesis focuses on valuation durability and disclosure quality, not on denying that Forus addresses a real operational problem.
