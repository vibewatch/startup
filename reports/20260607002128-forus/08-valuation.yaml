- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Waystar
    - Healthcare claims / prior-auth / RCM workflow + June 2026 snapshot
    - ~3.3x market cap / revenue; public
    - Closest public provider-admin automation comp with prior-authorization and denial-management adjacency.
    - Revenue-cycle exposure and public-company maturity make the model less pharma-commercialization-heavy than Forus.
  - - Phreesia
    - Patient-activation / digital-front-door workflow + June 2026 snapshot
    - ~1.3x market cap / revenue; public
    - Useful lower-end workflow benchmark for provider-facing automation and integration-heavy deployments.
    - Patient intake and payment activation are less strategic than specialty-drug access and launch workflows.
  - - Doximity
    - Physician-workflow network + June 2026 snapshot
    - ~6.0x market cap / revenue; public
    - Helpful benchmark for clinician distribution, workflow embedment, and network effects.
    - Communications-network economics differ from pharmacy and payer orchestration.
  - - Veeva
    - Life-sciences software / commercial stack + June 2026 snapshot
    - ~8.8x market cap / revenue; public
    - Best evidence for what best-in-class life-sciences workflow software can command.
    - Much larger, more mature, and already proven on profitability and disclosure.
  - - Omnicell
    - Pharmacy automation / medication management + June 2026 snapshot
    - ~1.7x market cap / revenue; public
    - Relevant for pharmacy-workflow and compliance-sensitive automation.
    - Hardware and services mix make economics less software-like than Forus aspires to be.
  - - Tempus AI
    - AI-health premium reference + June 2026 snapshot
    - ~6.6x market cap / revenue; public; Bessemer cites ~9.3x EV / revenue
    - Useful upper-band AI-health comparator for growth and strategic premium framing.
    - Clinical-data and precision-medicine exposure differ from prescription-access infrastructure.
  - - Forus implied
    - Private health-AI prescription-access platform
    - <$20x annualized revenue on a reported $1B valuation and run-rate above $50M; private
    - Shows how much strategic scarcity and growth investors are already being asked to underwrite.
    - Relies on a reported annualized revenue anchor, not audited GAAP revenue or disclosed net cash / debt.
  notes: Public multiples are rough June 2026 snapshots used for valuation discipline rather than a fully normalized EV / revenue model.
