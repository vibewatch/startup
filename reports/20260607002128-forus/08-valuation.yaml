- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - 2026 diligence shows revenue or ARR-like run-rate already near $90M-$120M, software-like margins emerge, pharma-launch workflows deepen, and strategic buyers value the network exhaust.
    - $0.9B-$1.4B using roughly 10x-12x on higher run-rate; this only modestly exceeds the current mark unless growth is far above public evidence.
    - Requires unusually fast growth conversion plus evidence that the workflow layer behaves more like elite software than admin-heavy services.
    - Possible, but only partially supported by the public record.
  - - Base
    - Public evidence is directionally right at roughly $50M-$70M run-rate, growth remains strong but economics are still unproven, and investors use a premium public-comp band rather than a blue-sky AI multiple.
    - $0.35B-$0.56B using roughly 6x-8x on public-evidence scale.
    - Even this range assumes the business is real and that compliance or concentration do not materially worsen.
    - Most consistent with what the public record currently supports.
  - - Bear
    - Growth slows, implementation complexity persists, or compliance and privacy concerns raise friction while public multiples compress.
    - $0.12B-$0.28B using roughly 3x-5x on $40M-$55M of revenue.
    - Downside can be amplified by hidden preferences, concentration, or lower-than-expected fill-rate economics.
    - A credible downside if diligence fails to close the current disclosure gaps.
  notes: Ranges are judgment bands in USD billions derived from public revenue anchors and comparable-multiple discipline, not management forecasts or a DCF.
