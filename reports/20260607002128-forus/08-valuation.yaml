  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: Current cap table, liquidation preferences, warrants, debt covenants, and any structured downside protections tied to the latest round.
    whyItMatters: Headline valuation can materially overstate actual investor economics when preferences or debt absorb value ahead of common-equity upside.
    diligencePath: Review the latest financing documents with counsel and reconcile them to the cap table model.
    relatedQuestionRefs:
    - QV024
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited revenue, gross margin, cohort retention, and any net revenue retention or contribution-margin disclosures for 2026.
    whyItMatters: The current mark only becomes defensible if the business behaves like premium software rather than labor-heavy workflow services.
    diligencePath: Obtain audit-ready financials and cohort dashboards from finance and revops.
    relatedQuestionRefs:
    - QV025
    - QV028
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue mix by specialty, top customers, top pharma partners, and launch-program concentration.
    whyItMatters: A premium valuation is much harder to justify if a small number of launches, partners, or specialties drive most of the value.
    diligencePath: Request customer-level and program-level concentration schedules plus churn and renewal data.
    relatedQuestionRefs:
    - QV026
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-normalization for TV004
    missingEvidence: Net-cash or debt adjustments, wider comp coverage, and more apples-to-apples EV or gross-margin normalization for each public comparable in TV004.
    whyItMatters: The comparable table is decision-useful today, but fuller normalization would tighten the valuation range and reduce the risk of overstating or understating the premium.
    diligencePath: Expand the comp sheet with EV, net cash or debt, and margin overlays once a broader market-data pack is available.
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: outcome-proof
    missingEvidence: Independent evidence that faster access improves fill-through, persistence, or launch outcomes at economically attractive scale.
    whyItMatters: The strongest path to supporting a strategic premium is proof that Forus improves commercial and patient outcomes, not just admin speed.
    diligencePath: Review biopharma launch case studies, customer ROI analyses, and longitudinal prescription-conversion data.
    relatedQuestionRefs:
    - QV028
