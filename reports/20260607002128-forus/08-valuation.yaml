- id: strategic-optionality-and-diligence
  title: Strategic optionality is real, but underwriting should wait for a hard diligence pack
  body: 'Observed 2025-2026 market reports show two things at once: AI-native healthcare workflow companies can raise larger rounds and attract M&A interest, but public investors still reward disclosure quality and punish trust gaps. That helps explain why Forus could command a large financing despite limited public economics. If the company truly owns a decision-critical access layer between prescribers, payers, pharmacies, and pharma launches, it could be strategically valuable to workflow, commercialization, pharmacy automation, revenue-cycle, or payer-adjacent platforms. But strategic optionality is easier to believe than IPO readiness. Public markets still ask for audited revenue, durable margin structure, retention, and governance evidence, and none of that is sufficiently disclosed here. The practical recommendation is therefore not to dismiss the asset but to force a rigorous diligence package: audited 2026 revenue, gross margin and cohort retention, concentration by specialty and
    customer, fill-rate outcomes, and the preference stack. Until those materials exist, price sensitivity matters more than admiration.'
