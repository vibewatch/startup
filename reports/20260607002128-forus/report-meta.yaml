companyProfile:
  summary: Forus is a private New York healthcare AI company building workflow infrastructure between prescription and therapy start. The platform automates prior authorizations, appeals, affordability support, and pharmacy routing inside provider workflows, then monetizes primarily through biopharma and related commercialization relationships rather than provider subscription fees. Public evidence supports real specialty-provider adoption and a fast-growing national footprint, but not the audited financial depth, governance transparency, or concentration data needed for a high-conviction late-stage underwrite.
  foundedDate: '2023-01-01'
  founders:
    - name: Sahir Jaggi
      role: Founder, CEO
      background: Former Oscar Health product leader with Columbia biomedical engineering training and direct exposure to insurance and medication-access workflow complexity.
      claimRefs:
        - CO008
        - CO009
        - CO010
  foundingLocation: New York, USA
  headquarters: New York, USA
  productSummary: Forus sells an AI-enabled workflow platform embedded in physician operations that automates prior authorization, appeals, affordability support, pharmacy routing, and patient-access coordination after a prescription is written.
  customerFocus: Specialty and multispecialty medical practices, health systems, patients navigating complex therapies, and biopharma launch teams.
  businessModel: Free to providers and patients; monetization is primarily inferred from biopharma, manufacturer, and launch-support relationships rather than provider-side subscription pricing.
  stage: Series C private / unicorn
  fundingStatus: Over $160M disclosed in May 2026 at a Forbes-reported $1B valuation, with earlier financings only partially surfaced publicly.
