company:
  name: Forus
chapter:
  number: 5
  title: Product & Technology
  summary: Forus presents a credible end-to-end medication-access workflow that spans eRx-triggered prior authorization, appeals, affordability, pharmacy routing, and patient communication, with solid public proof from its own workflow guide and multiple customer stories. The technical positives are workflow breadth, EHR-adjacent integration design, visible human-in-the-loop operations, and early network extensions into biopharma and clinical-decision partnerships. The main diligence risks are opacity around connector depth, independent AI benchmarking, uptime and incident history, and the messy external dependency stack that still governs prescription access in the U.S.
sections:
- id: product-definition-and-workflow
  title: Product definition and workflow coverage
  body: 'Forus’s public surface is unusually specific for a young private healthcare software company. The core promise is not generic AI for admin work; it is automation of the medication-access chain after a clinician makes a prescribing decision. The homepage, patient page, and field-rep guide consistently show the same sequence: an e-prescription is written from the EHR, Forus gathers chart context, generates the right prior-authorization and enrollment forms, follows payers and specialty pharmacies, routes the prescription to the right dispensing channel, supports affordability paths, and keeps the patient updated. Importantly, appeals and renewal tracking are marketed as built-in steps, not custom professional-services exceptions. This gives Forus a more complete workflow claim than a narrow ePA helper or specialty-pharmacy hub. The main caveat is boundary definition: Forus is clearly strongest once there is an electronic prescription in motion, so it should be evaluated as a digital
    access automation layer rather than as a universal intake or dispensing system.'
  claimRefs:
  - CE001
  - CE003
  - CE004
  - CE007
  - CE008
  - CE009
  - CE012
  - CE013
  - CE057
  - CE059
