- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: Forus’s public materials describe a closed operational flow from eRx to approved, affordable, correctly routed therapy.
  approximationNotes: The flow is based on public workflow descriptions and customer stories, not on a process map released by Forus engineering.
  data:
    nodes:
    - id: prescribe
      label: Prescription written
      detail: A clinician writes an electronic prescription from the EHR or e-prescribe tool.
    - id: assemble
      label: Records and forms assembled
      detail: Forus extracts notes where integrated, pulls the right forms, and flags missing information.
    - id: submit
      label: PA and enrollment submitted
      detail: The platform submits prior authorization or manufacturer-enrollment workflows and begins follow-up.
    - id: resolve
      label: Denials, appeals, and affordability resolved
      detail: If needed, Forus drafts appeals, supports bridge or PAP paths, and keeps staff focused on decision points.
    - id: route
      label: Prescription routed to the right pharmacy
      detail: The prescription is sent to the preferred or required pharmacy based on payer and network rules.
    - id: notify
      label: Patient updated until ready to fill
      detail: Patients receive proactive status updates by text, with phone or email available as fallback support.
    edges:
    - from: prescribe
      to: assemble
      label: trigger access workflow
    - from: assemble
      to: submit
      label: prepare clean submission
    - from: submit
      to: resolve
      label: handle denials or assistance needs
    - from: resolve
      to: route
      label: choose fill path
    - from: route
      to: notify
      label: confirm next steps
