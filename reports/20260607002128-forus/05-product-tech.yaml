tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current public maturity
  - Differentiation signal
  - Diligence gap
  rows:
  - - Core medication-access automation
    - Prescribers, MAs, biologics coordinators
    - Core and heavily evidenced
    - Automates PA, appeals, enrollment, routing, renewals, and patient updates in one workflow
    - Need audited completion rates and workflow exception rates by drug and payer
  - - Provider portal / task dashboard
    - Practice teams and leaders
    - Core and repeatedly evidenced
    - Turns fragmented payer or pharmacy follow-up into a tracked task queue with glass-box visibility
    - Need screenshots or KPI exports from large enterprise deployments
  - - Patient communication layer
    - Patients and office staff
    - Core and repeatedly evidenced
    - Text-first status updates, signatures, and support reduce phone tag while keeping offices informed
    - Need opt-out, deliverability, and localization detail
  - - Appeals and renewals engine
    - Practice teams and clinical reviewers
    - Current and strategically important
    - Appeals are marketed as a native workflow with AI-generated letters and renewal tracking
    - Need independent proof of overturn lift and false-positive risk
  - - Affordability and enrollment workflows
    - Patients, offices, manufacturers
    - Current with case-study and guide proof
    - Supports PAP, bridge, hub, coupons, and affordability routing rather than stopping at coverage determination
    - Need exact manufacturer-program coverage and edge-case handling
  - - Biopharma / field-rep surface
    - Manufacturer field teams and patient-support partners
    - Current but less fully evidenced
    - Creates a second product surface around launch support and access insight, not only provider operations
    - Need customer references and module packaging clarity
  - - Clinical Intelligence + AI layer
    - Product, ops, and clinical teams
    - Current but public proof mixed
    - Combines clinicians, RAG appeal generation, data science, and applied AI hiring around one workflow
    - Need independent model benchmarking and governance detail
  - - Integration / connectivity layer
    - IT, EHR admins, provider ops
    - Current but connector list opaque
    - Supports integrated and fallback upload paths across EHR-led eRx workflows
    - Need named integration directory and live connector depth
  notes: Rows summarize the public module map inferred from product pages, workflow guides, customer stories, and policies; they are not a disclosed SKU list.
