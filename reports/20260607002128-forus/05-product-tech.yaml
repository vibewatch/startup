- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Forus coverage
  - Public benefit signal
  - Current limitation
  rows:
  - - Initiate access workflow
    - Write an eRx from the EHR or e-prescribe tool
    - Forus starts after the prescription is written
    - Keeps physician workflow lightweight instead of forcing new prescribing UX
    - No support for non-eRx initiation is publicly described
  - - Assemble PA submission
    - Pull records, find payer form, populate fields, flag gaps
    - Auto-generates PA forms and extracts notes when integrated
    - Case studies describe same-day submission and fewer incomplete packets
    - Exact connector logic and payer coverage are not published
  - - Monitor follow-up and status
    - Track plan outreach, missing info, signatures, deadlines
    - Provider portal surfaces tasks, real-time status, and reminders
    - Customers describe glass-box visibility and fewer things slipping through cracks
    - No public SLA or queue-latency disclosures
  - - Handle denials and renewals
    - Review denial letter, choose next step, draft appeal, track renewal
    - Appeal letters and renewal tracking are built into the public workflow
    - Family Allergy and ARSH describe better appeal handling than manual workflows
    - Independent appeal-success benchmarking is absent
  - - Route to fill and support affordability
    - Choose in-network pharmacy, compare options, enroll in PAP/bridge/copay support
    - Forus routes to preferred or required pharmacy and supports affordability programs
    - Nimbus and Family Allergy cite correct-pharmacy routing and support programs
    - Actual network contracts and coverage rules are opaque
  - - Keep patient and office aligned
    - Send texts, collect signatures, answer questions, escalate when needed
    - Patients get proactive status updates via text with phone/email fallback
    - Optima and Goodman highlight lower uncertainty and fewer complaints
    - No public metrics on messaging response or abandonment are disclosed
  notes: Workflow steps reflect the public operating sequence from eRx to fill; exact decisioning logic and exception handling remain management-diligence items.
