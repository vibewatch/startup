  evidenceGaps:
  - type: missing-source
    severity: material
    topic: independent-ai-benchmarks
    missingEvidence: Independent benchmarking or customer-authored documentation that quantifies appeal quality, denial-prediction accuracy, or model error rates.
    whyItMatters: Current AI-performance proof comes mostly from company-authored materials, which is enough to establish plausibility but not enough to underwrite technical superiority.
    diligencePath: Request customer references, A/B summaries, model eval dashboards, and any audited studies of appeal overturn lift or automation accuracy.
    relatedQuestionRefs:
    - QE020
  - type: missing-source
    severity: material
    topic: integration-directory
    missingEvidence: A public or private integration register naming live EHR, payer, pharmacy, and manufacturer connections plus what each connection actually supports.
    whyItMatters: The company claims broad interoperability, but buyers still cannot audit implementation depth or concentration risk from the public surface.
    diligencePath: Ask for a current integration matrix, signed partner list, implementation counts by connector, and fallback rates where teams still rely on upload, fax, or manual work.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: security-scope-and-retention
    missingEvidence: Detailed security architecture, retention defaults, incident history, tenant-isolation design, and the precise scope of SOC 2 and HIPAA control coverage.
    whyItMatters: Forus handles PHI and multi-party workflow data, so diligence needs more than a badge-level trust claim and privacy-policy summary.
    diligencePath: Request SOC 2 report scope, security questionnaire responses, retention policies, architecture diagrams, subprocessor list, penetration-test summaries, and any incident postmortems.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: reliability-and-sla
    missingEvidence: Public or customer-verifiable uptime, queueing, outage, latency, and recovery metrics for both portal operations and message orchestration.
    whyItMatters: Medication access workflows are time-sensitive; a no-SLA black box is harder to underwrite for enterprise or regulated rollout.
    diligencePath: Request status history, SLO dashboards, escalation runbooks, and references from large customers that can speak to outage handling and business continuity.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: biopharma-module-packaging
    missingEvidence: Detailed packaging, workflow boundaries, and adoption evidence for the biopharma, field-rep, and manufacturer-support surfaces beyond announcement or guide-level materials.
    whyItMatters: Those surfaces may be strategically important to the moat thesis, but the reviewed public materials do not yet show a granular module map or customer references for each sub-workflow.
    diligencePath: Ask management to demo manufacturer and field workflows end to end, show launch KPIs, and provide named partner references.
    relatedQuestionRefs:
    - QE023
    - QE024
    relatedTableRefs:
    - TE001
    - TE005
