callouts:
- calloutType: strength
  title: Workflow breadth is the clearest product strength
  body: Forus does not just claim faster PA submission. The visible product surface covers appeals, renewals, affordability, pharmacy routing, and patient communications, which is why the product reads more like an access operating system than a single-use ePA plug-in.
  claimRefs:
  - CE001
  - CE004
  - CE008
  - CE013
  - CE057
- calloutType: risk
  title: Public proof is still thinner than the ambition of the AI and network narrative
  body: The company’s AI and biopharma story is directionally credible, but it still leans heavily on company-authored materials. Buyers should ask for independent benchmark data, connector depth, and security architecture before underwriting the moat at face value.
  claimRefs:
  - CE017
  - CE020
  - CE024
  - CE052
  - CE053
  - CE054
- calloutType: recommendation
  title: Management diligence should concentrate on reliability and control evidence
  body: The next diligence step is not discovering what the workflow does; that is mostly visible already. It is verifying what happens under load, during incidents, and across edge-case payers, manufacturers, and specialty pharmacies where public evidence remains incomplete.
  claimRefs:
  - CE050
  - CE051
  - CE053
  - CE056
