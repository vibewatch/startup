- id: network-ai-and-customer-proof
  title: Network, AI, and customer proof
  body: 'Forus’s differentiation story rests on two linked claims: first, that it is building a national access network across doctors, payers, pharmacies, patients, and biopharma; second, that AI becomes more valuable as more prescriptions move through that network. The public evidence is directionally supportive. Company materials and Forbes all describe Forus as a workflow layer connecting those participants, and the company page plus Clinical Intelligence materials show that AI work is not limited to copy generation. Forus is explicitly investing in RAG-based appeals, clinician-in-the-loop product design, applied AI, data science, and feedback from millions of patient outcomes. Customer stories also show the product working across dermatology, allergy, GI, pulmonology and sleep, GPO-driven operations, and multisite specialty groups. That breadth matters because it suggests the core automation is portable across specialties. Still, most performance evidence remains company-authored. The
    customer stories are richer than empty testimonials, but they are not the same thing as third-party benchmarking, especially for the newer AI and biopharma surfaces.'
