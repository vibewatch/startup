figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: The reviewed public surface implies a stack running from eRx ingestion through rules, tasking, multi-party coordination, and trust controls.
  approximationNotes: This stack is synthesized from public product pages, workflow guides, and policies rather than copied from a vendor-published system diagram.
  data:
    layers:
    - id: ingress
      label: Prescription and chart ingress
      detail: EHR integration or upload/fax fallback provides the eRx trigger, clinical notes, and records needed to start access work.
    - id: rules
      label: Coverage and form logic
      detail: Forus identifies the right PA, enrollment, and affordability forms, flags missing information, and drafts workflow outputs such as appeals.
    - id: workbench
      label: Provider portal and tasking
      detail: Practice teams track every prescription, review next steps, complete signatures, and handle exceptions from one workbench.
    - id: network
      label: Network coordination layer
      detail: Plans, pharmacies, manufacturers, field teams, and patients are coordinated through routing, follow-up, and communication workflows.
    - id: trust
      label: Clinical intelligence and trust controls
      detail: Clinical QA, human-in-the-loop review, privacy policies, HIPAA posture, and internal analytics sit above the workflow engine.
