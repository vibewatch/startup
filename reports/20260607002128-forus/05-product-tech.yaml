- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role in workflow
  - Key dependency
  - Main risk
  rows:
  - - EHR / eRx ingress
    - Starts the workflow and supplies chart context
    - Major EHR integrations or upload/fax fallback
    - If eRx or integration is missing, workflow becomes less automatic
  - - Clinical note extraction and form logic
    - Maps patient data into payer- and drug-specific submissions
    - Accurate document retrieval and rules updates
    - Wrong or stale logic can increase denials or manual rework
  - - Provider portal and tasks
    - Coordinates missing information, signatures, next steps, and training
    - Reliable portal uptime and actionable notifications
    - No public uptime or queue-performance disclosure
  - - Appeals and renewal engine
    - Transforms denials into next steps and draft letters
    - Clinical-history access plus human review
    - Public proof of model quality is still thin
  - - Network endpoints
    - Connects plans, pharmacies, manufacturers, and patients
    - Fragmented payer and pharmacy communications ecosystem
    - Drug workflows still sit in a heterogeneous API/portal/fax environment
  - - Clinical Intelligence and ops layer
    - Keeps workflow aligned to specialty nuance, guidelines, and payer changes
    - Embedded clinicians, QA, and feedback loops
    - Scaling this layer nationally can become people-intensive
  - - Analytics and leadership visibility
    - Exposes approval rates, turnaround times, and status patterns
    - Consistent event capture across the workflow
    - Public KPI schema and auditability are not disclosed
  notes: This operating architecture is inferred from workflow guides, case studies, and policy materials rather than from a vendor-published systems diagram.
