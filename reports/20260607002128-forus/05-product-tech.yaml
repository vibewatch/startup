- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Current public status
  - Scope signal
  - Gap or caveat
  rows:
  - - HIPAA / BAA posture
    - Explicitly claimed
    - Homepage and provider policy both reference HIPAA handling and BAAs
    - Public materials do not show BAA terms or scope boundaries
  - - SOC 2 Type II certification
    - Explicitly claimed
    - Mentioned in homepage FAQ and field guide
    - Certification report, audit period, and covered services are not public
  - - Provider / patient / manufacturer role separation
    - Partially documented
    - Provider policy distinguishes provider portal from patient and manufacturer portals
    - Public architecture for role isolation is not detailed
  - - Aggregated / de-identified data policy
    - Explicitly documented
    - Website policy says anonymized or aggregated insights may be sold
    - Customers will want governance, retention, and opt-out detail
  - - Security baseline under HIPAA
    - Externally defined
    - HHS describes administrative, physical, and technical safeguards plus risk analysis
    - Forus does not publicly map its controls to that baseline in detail
  - - Reliability and incident transparency
    - Not publicly documented
    - No status page, uptime history, or incident ledger in the reviewed surface
    - Enterprise buyers still need private diligence on continuity and breach handling
  notes: This table distinguishes badge-level company claims from the external regulatory baseline and from the proof that remains private.
