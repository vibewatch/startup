company:
  name: Forus
chapter:
  number: 1
  title: Company Overview
  summary: Forus is a New York prescription-access automation startup that rebranded
    from Tandem in May 2026 and paired the rename with a $160M financing disclosure
    and a Forbes-reported $1B valuation. Fetched evidence supports broad provider
    adoption across multiple specialties, a free-to-provider workflow product, and
    an emerging biopharma data-and-launch business model, but governance visibility,
    exact customer counts, and audited financial quality remain under-disclosed. The
    clearest documented adverse angle is policy and AI-governance risk around prior
    authorization rather than a public company-specific scandal.
sections:
- id: identity-and-business-model
  title: Identity, product workflow, and current company shape
  body: Forus is best understood as a private New York healthcare AI company focused
    on the messy backend that sits between a doctor writing a prescription and a patient
    actually starting therapy. Official materials consistently describe the product
    as software embedded in physician workflows that automates prior authorizations,
    appeals, affordability support, and pharmacy routing, while the patient-facing
    page emphasizes that doctors and patients do not pay for the service directly.
    The naming history matters because older public references use Tandem or withtandem
    branding, while the May 2026 announcement made the Forus name canonical and several
    older pages now carry notes that Tandem has been replaced with Forus throughout
    the text. Public chronology from Forbes and citybiz ties the current company to
    a 2023 start, and current company materials still anchor operations in New York.
    The public record is therefore strong on identity, workflow, and category fit,
    but weaker on classic cover facts such as exact customer count, audited revenue
    quality, and a fully enumerated office footprint.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO023
  tableRefs:
  - TO001
  figureRefs:
  - FO002
  - FO003
- id: founder-leadership-and-governance
  title: Founder, leadership bench, and governance visibility
  body: 'The company is visibly founder-led. Sahir Jaggi is the dominant public executive
    across official releases and independent press coverage, and his background at
    Oscar Health plus Columbia biomedical training gives the business a credible founder-market-fit
    narrative in medication access and insurance workflow complexity. That same concentration
    creates key-person dependence because Jaggi remains the main face for mission,
    product logic, and financing. The fetched public set identifies at least one additional
    medical leader, Adam Harris, MD, as Head of Clinical Intelligence, and the careers
    page shows active hiring across finance, engineering, data, provider growth, and
    operations from New York. Even so, the broader leadership bench is not disclosed
    in a clean public org chart, and the public record does not surface a board roster,
    voting structure, or detailed sponsor governance rights. The trust-center record
    is more complete than the governance record: it shows clean SOC 2 Type II audits
    under both the Tandem and Forus names, which supports operational continuity through
    the rebrand even while corporate-control transparency remains limited.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  tableRefs:
  - TO002
  figureRefs: []
- id: funding-investors-and-economics
  title: Funding history, investor stack, and disclosed economics
  body: 'Funding is one of the strongest public parts of the Forus story, but it is
    still not a clean conventional round-by-round ledger. The company and its media
    coverage say Forus raised over $160M in May 2026, while Forbes adds the critical
    nuance that Thrive Capital, General Catalyst, and Accel had each led previously
    unannounced financings that were only surfaced when the company went public with
    the new Forus brand. Forbes also reported a $1B valuation and annualized revenue
    that had already surpassed $10M by year-end and was tracking above $50M in 2026.
    Those are meaningful signals for stage and momentum, but they are not a substitute
    for audited or filed financial disclosure. The investor list is now clear at the
    name level: Thrive, General Catalyst, Accel, Bain Capital Ventures, Redpoint,
    BoxGroup, and Pear VC all appear repeatedly in fetched sources. What remains opaque
    is equally important: public sources still do not disclose board seats, ownership
    percentages, debt facilities, liquidation preferences, or any secondary component
    in the financing package.'
  claimRefs:
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO027
  - CO028
  - CO040
  tableRefs:
  - TO003
  figureRefs: []
- id: traction-milestones-and-risk-overhangs
  title: Traction signals, milestone chronology, and adverse overhangs
  body: 'Public traction evidence is unusually rich for a young private company because
    Forus publishes detailed customer stories across multiple specialties. Those cases
    show adoption in dermatology, GI, allergy, rheumatology, pulmonology, sleep, and
    multispecialty practice settings, with claimed improvements including same-day
    initiation, shorter approval times, less administrative work, and broader prescription
    throughput. Company-wide scale claims are also aggressive: the announcement says
    adoption grew 10x year over year for the last two years, the platform is used
    by thousands of practices and health systems in all 50 states, patient reach already
    extends to nearly 80% of U.S. zip codes, and five of the top 10 global biopharma
    companies work with Forus. The main adverse overlay is not a disclosed lawsuit,
    sanction, or breach specific to Forus; none surfaced in the fetched run. Instead,
    the clearest documented headwind is external. CMS is proposing drug prior-authorization
    interoperability rules, while KFF and the National Health Law Program describe
    growing scrutiny of AI-driven authorization workflows around bias, privacy, human
    review, and appeal rights. That means the business is scaling into a policy environment
    that could both validate and constrain its automation moat.'
