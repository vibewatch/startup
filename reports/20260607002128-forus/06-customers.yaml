  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-enterprise-accounts
    missingEvidence: Named payer, health-system, and employer reference accounts with deployment status, go-live dates, and contactable references.
    whyItMatters: The current proof set is heavy on specialty-practice case studies but light on the enterprise customer names that would validate broader adoption and reduce concentration uncertainty.
    diligencePath: Request a reference packet with at least two payer or health-system customers and one employer or benefits-channel reference, each tied to a current deployment.
    relatedQuestionRefs:
    - QU002
    - QU003
    - QU021
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: GRR, NRR, logo churn, renewal rates, and contract terms by customer segment and cohort.
    whyItMatters: Without hard renewal data, current customer proof shows operational usefulness but not durable recurring revenue or expansion quality.
    diligencePath: Request cohort tables by customer start quarter plus copies of renewal or termination memos for the last 12 months.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: pricing-and-paid-conversion
    missingEvidence: Pricing architecture, revenue mix by providers versus biopharma, and any paid-conversion mechanics for free provider users.
    whyItMatters: The public story makes the product free to doctors and patients, so monetization quality and customer willingness to pay remain under-explained.
    diligencePath: Request current pricing sheets, segment revenue mix, gross margin by segment, and any provider-paid contract examples.
    relatedQuestionRefs:
    - QU016
    - QU017
    relatedTableRefs:
    - TU004
    - TU005
  - type: missing-source
    severity: material
    topic: named-biopharma-partners
    missingEvidence: Named biopharma customers, launch examples, and scope of work for research or commercialization support.
    whyItMatters: Biopharma could be the most economically important customer segment, but the public record does not show which manufacturers are active or how sticky those relationships are.
    diligencePath: Request a list of current top biopharma accounts, active launch programs, renewal dates, and outcome dashboards.
    relatedQuestionRefs:
    - QU008
    - QU022
    relatedTableRefs:
    - TU001
    - TU005
  - type: stale
    severity: minor
    topic: independent-outcome-verification
    missingEvidence: Independent audits, customer conference talks, or procurement records validating the specific case-study metrics published by Forus.
    whyItMatters: Current named customer proof is helpful but mostly company-authored, so an independent validation layer would materially strengthen confidence in reported ROI.
    diligencePath: Ask for customer reference calls, external presentations, or shared KPI scorecards that match the case-study claims.
    relatedQuestionRefs:
    - QU006
    - QU010
    - QU026
    relatedTableRefs:
    - TU003
