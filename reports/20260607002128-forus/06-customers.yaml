- id: sec603
  title: Patients, biopharma, and specialty breadth are visible; named payer and employer economics are not
  body: 'The patient and biopharma sides of the network are visible, but in different ways. Patients see the operational layer: free service, text updates, affordability help, pharmacy coordination, and fewer status-call loops. Case studies reinforce that those features are not cosmetic—providers repeatedly describe faster starts, fewer dropped threads, and better communication. Biopharma visibility is more strategic than named: Forus and several independent articles repeat the claim that five of the top 10 global biopharma companies already work with the company, and Forbes goes further by saying pharmaceutical launch partnerships are how Forus monetizes rather than through provider fees. That is commercially important because it suggests a customer mix that may lean more toward manufacturers than outward-facing provider SaaS economics. Yet the public record still stops short of naming a single payer, health system, or biopharma customer, and it does not disclose provider pricing, payer
    fees, or conversion mechanics. That leaves a useful but incomplete picture: Forus has real specialty breadth and credible patient-access functionality, but the exact account mix, the magnitude of enterprise spending, and the relative weight of biopharma versus provider revenue remain private.'
