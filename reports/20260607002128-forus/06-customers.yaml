  title: Named payer, health-system, and renewal proof are still missing
  body: The biggest underwriting gap is not whether Forus has users, but whether its current specialty-practice traction converts into durable enterprise economics that survive renewal, procurement, and concentration tests.
  claimRefs:
  - CU009
  - CU036
  - CU037
  - CU038
  - CU047
