- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or friction risk
  - Impact
  - Diligence path
  rows:
  - - Named specialty-practice success stories
    - Payer and health-system accounts are still unnamed
    - Strong practice ROI may not translate automatically into enterprise payer contracts
    - Request named payer and health-system references with go-live dates and scope
  - - Biopharma launch support
    - Top-five relationships are unnamed and economic contribution is undisclosed
    - Revenue could be concentrated in a small number of launch partners
    - Request top-customer revenue share, contract term, and renewal calendar
  - - Free product for doctors and patients
    - Public sources do not show who pays what or when
    - Customer economics and gross-margin durability stay opaque
    - Request pricing architecture, contribution margin by segment, and conversion logic
  - - Specialty-group and GPO land-and-expand motion
    - Public proof is concentrated in a few specialties and channel-heavy stories
    - Expansion into broader multispecialty or health-system settings is not yet proven publicly
    - Request specialty mix, segment mix, and expansion rates by cohort
  - - Stricter 2026 prior-authorization expectations
    - AI vendors face a higher proof bar around transparency, interoperability, and cost reduction
    - Buyers may require more evidence before expansion or renewal
    - Request outcome scorecards, audit packs, and customer renewal memos
  - - Low visible adverse evidence
    - No public churn or failed deployment event is documented in retained sources
    - Absence of bad press can mask concentration or implementation issues
    - Request lost-deal logs, churn analysis, and open support-issue summaries
  notes: This table turns visible proof gaps into concrete diligence asks rather than assuming weakness where public disclosure may simply be limited.
