chapter:
  number: 6
  title: Customers
  summary: Forus has stronger public customer proof than many stealth-era health AI startups, but the proof is concentrated in specialty-practice case studies rather than named payer or health-system deployments. Official and independent sources agree that provider adoption is broad, that biopharma relationships are meaningful, and that patient-access workflows are real; they do not disclose retention cohorts, paid-conversion economics, or named enterprise accounts, so the honest underwriting stance is specialty-provider traction with still-opaque durability.
sections:
- id: sec601
  title: 'Customer segments: providers are the clearest buyer-user center, while payer, patient, pharmacy, and biopharma roles sit around that core'
  body: 'Forus’s public surface describes a multi-sided medication-access network, but the evidence is not evenly distributed across those sides. Official pages and financing coverage consistently show doctors and their staff as the operational center of gravity: the product sits inside physician workflows, handles prior authorization, affordability support, and pharmacy routing, and is presented as free to clinicians and patients. Patients are visible end users through text updates, affordability checks, and pharmacy choice support. Pharmacies and payers are clearly inside the workflow, yet public customer proof for those groups remains abstract because no payer is named and pharmacy references are routing examples rather than account references. Biopharma is the one non-provider constituency with repeated quantitative proof, as Forus says five of the top 10 global biopharma companies already work with it. Employers, by contrast, remain absent from the retained proof surface. The resulting
    segmentation is therefore asymmetric: providers and their operating teams are the best-evidenced customer class, patients are the most visible beneficiary class, biopharma is a plausibly important revenue class, and payer or employer economics remain mostly inferred rather than disclosed.'
