- id: sec602
  title: 'Named provider proof: Forus shows real specialty-practice adoption and operational ROI across multiple care settings'
  body: 'Where Forus’s evidence is strongest is in named specialty-practice stories. The company has published a dense cluster of 2025-2026 case studies across dermatology, allergy, rheumatology, gastroenterology, and GPO-supported independent practices. Those stories are specific enough to clear the usual “logo wall” threshold: DOCS Dermatology describes a pilot that scaled to 300+ providers across 140+ locations in 10 states; Family Allergy says median approval time fell to 1.1 days and nursing workload fell 70%; Goodman describes patients who had been denied elsewhere getting approvals in two to three days; Optima says a 500-plus task backlog dropped to zero; a Houston allergy-rheumatology practice says all specialty prescriptions now route through Forus; and a GI coordinator says daily PA throughput rose to 15-30 authorizations. These are company-authored stories, so they are not the same as audited customer references, but they are still materially better than generic testimonials.
    They show that the product is in production workflows, that specialty practices see measurable staff-time and time-to-therapy benefits, and that Forus appears to win expansion through day-to-day operational usefulness rather than through a vague AI narrative alone.'
