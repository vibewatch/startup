- id: sec604
  title: 'Durability and expansion risk: real adoption signal exists, but retention, concentration, and enterprise proof remain under-disclosed'
  body: 'The core customer diligence issue is not whether Forus has real users; it is how durable and transferable that usage is. No retained public source discloses renewal cohorts, NRR, GRR, churn, contract lengths, or paid-conversion data. Nor does the public surface show which payer, health-system, or biopharma accounts drive the business. That matters more in 2026 because the surrounding market is becoming less forgiving. MGMA says prior authorization remains one of the most damaging administrative burdens on practices, Everest says large insurers are moving toward stricter electronic and real-time authorization expectations, and PHTI explicitly warns that AI can increase system activity without reducing total cost when applied to broken workflows. Those cross-currents cut both ways for Forus: they expand demand for workflow automation, but they also raise the proof bar. The most honest conclusion is therefore balanced. Forus appears to have meaningful specialty-practice traction, useful
    patient-access economics, and some biopharma pull. But until the company discloses named enterprise accounts, renewal behavior, pricing model clarity, and customer concentration, investors should treat current traction as promising operating proof rather than fully underwritten durable revenue.'
