tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer role
  - Public evidence
  - Economic or strategic value
  - Main gap
  rows:
  - - Specialty practices and clinic operating teams
    - Primary operational buyer-user in public proof; prescribers, MAs, nurses, coordinators, and admins use the workflow daily
    - Named case studies across dermatology, allergy, rheumatology, GI, and GPO-supported independent practices
    - Operational ROI is fastest to verify because staff time, start times, and appeal throughput are repeatedly cited
    - No public provider pricing, contract structure, or paid-conversion rate
  - - Patients
    - End beneficiaries and visible workflow participants via texts, affordability support, and pharmacy coordination
    - Patient page, homepage, and case studies show proactive updates, affordability help, and faster starts
    - Patient experience is part of the provider ROI story and likely helps practice adoption
    - No public repeat-use, satisfaction cohort, or patient-level retention metrics
  - - Payers
    - Workflow counterparty and possible enterprise customer, but not publicly named
    - Forus repeatedly says it works across every payer; no payer account name is disclosed
    - If payer contracts exist, they could materially affect scale and data access
    - No named payers, covered lives, PMPM economics, or renewal data
  - - Biopharma
    - Likely strategic revenue class and launch/research customer type
    - Official and independent sources repeat that five of the top 10 global biopharma companies already work with Forus
    - Could fund growth and make provider-facing distribution free
    - No named manufacturers, contract scope, or launch economics
  - - Pharmacies
    - Workflow counterparty rather than clearly disclosed paying customer
    - Forus routes prescriptions to preferred or required pharmacies and shows pharmacy-status examples
    - Pharmacy routing makes the network more useful to providers and patients
    - No named pharmacy chains or enterprise-pharmacy contracts disclosed
  - - Employers
    - Category-adjacent rather than directly evidenced today
    - No employer page, case study, or named employer account appears in retained sources
    - Could become relevant through payer or specialty-benefit channels
    - Current employer relevance is inferential, not evidenced
  notes: This table distinguishes explicit public proof from plausible but still-private customer economics; employer and payer rows are gap-aware, not positive proof.
