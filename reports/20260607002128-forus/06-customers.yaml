- calloutType: strength
  title: The provider case-study surface is real and unusually specific for a newly emerged health AI company
  body: Forus’s specialty-practice stories include concrete workflow outcomes—approval times, backlog clearance, throughput, and phone-time reduction—so the company’s customer proof is meaningfully better than a simple logo wall.
  claimRefs:
