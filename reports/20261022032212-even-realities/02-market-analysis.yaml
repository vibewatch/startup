company:
  name: Even Realities
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Even Realities is positioned in a camera-free display-glasses segment rather than the
    whole smart-glasses category. Public evidence supports a growing, bifurcating market and
    a premium professional/privacy-oriented wedge, but it does not isolate a defensible SAM or
    SOM for Even.
sections:
  - id: market-boundary
    title: Market boundary and category split
    body: >-
      The relevant market is everyday smart glasses that place information in the wearer’s
      field of view, including optical display, translation, navigation, prompts, and a
      companion control surface. It excludes immersive headsets and should be separated from
      camera-first glasses whose core value includes capture and visual AI. The evidence
      describes the category as splitting into camera-and-AI products and camera-free display
      products rather than treating them as a single homogeneous product. Even’s G2 therefore
      competes for buyers who value discreet information access, ordinary-eyewear form factor,
      and lower social friction. Camera removal is a product boundary, not proof that the
      company owns the broader market: it also removes visual-AI use cases such as looking at
      landmarks or capturing images. The explicit status-quo substitute is using a smartphone
      for notifications, translation, and navigation, or simply not adopting an ambient-
      computing device; the retained sources do not quantify spend displaced from that behavior.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and adoption signals
    body: >-
      Available market numbers are directional rather than a clean TAM/SAM/SOM. Tech Funding
      News reports a Grand View Research expectation that the global smart-glasses market will
      exceed $3 billion in 2026 and grow at 24% annually through 2033; that is a category-level
      estimate, not an Even-specific serviceable market. The same report cites IDC’s 167% year-
      over-year increase in shipments of display-free smart glasses in early 2026, which is an
      adoption signal but does not disclose the base, geography, or Even’s share. Company and
      trade reporting supplies a second lens: Even says it passed 10,000 pairs and prices the
      G2 from $599, with prescription lenses and the R1 ring taking average orders near $1,000.
      These figures show a premium monetization hypothesis, not revenue or market share. A
      defensible SAM would require the publisher methodologies, addressable geographies,
      channel economics, repeat/accessory behavior, and verified Even unit volumes.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, drivers, and adoption constraints
    body: >-
      The observed buyer wedge is professionals who want glanceable information without
      pulling out a phone or wearing a camera. Trade reporting describes most customers as male
      professionals aged 30–50 and says an internal survey found about one-third were company
      executives; those are company-reported segmentation signals, not independently sampled
      market shares. Use cases include translation, navigation, teleprompting, conversation
      summaries, and monitoring coding agents. The budget owner is therefore usually an
      individual consumer or professional, with a possible employer-sponsored path that is not
      yet an enterprise deployment program. Adoption drivers are privacy/social comfort, low-
      profile eyewear, optical quality, and useful repeated workflows. Constraints are premium
      price, accessory dependence, uncertain retention after novelty, limited camera-based
      functionality, privacy questions around microphones and transcription, and competition
      from Meta and Snap distribution. The pending patent dispute is also a market-friction
      signal: a narrow visual-design lane can create litigation and crowdfunding disruption
      before a court decides the merits.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]
callouts:
  - calloutType: insight
    title: The investable market is a wedge, not the headline category
    body: >-
      The strongest evidence supports a premium camera-free display-glasses niche with real
      demand signals, while the broad smart-glasses market estimate should not be presented as
      Even’s attainable market.
    claimRefs: [CM002, CM005, CM008, CM009]
  - calloutType: risk
    title: SAM and retention remain unverified
    body: >-
      Public reporting does not provide an independently verified customer cohort, retention
      curve, serviceable geography, or unit economics sufficient to convert category growth
      into an Even-specific forecast.
    claimRefs: [CM009, CM014, CM015]
