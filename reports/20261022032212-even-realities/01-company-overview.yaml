company:
  name: Even Realities
chapter:
  number: 1
  title: Company Overview
  summary: Even Realities is a Shenzhen-headquartered smart-glasses company founded by former Apple and luxury-eyewear engineers. Its camera-free, display-first G2 and R1 ring have attracted a reported $150 million pre-Series B at a $1 billion valuation, but private-company financial disclosure, governance detail, and the durability of reported operating metrics remain limited.
sections:
  - id: identity-product-and-leadership
    title: Identity, product, and leadership
    body: >-
      Even Realities is described by multiple independent technology publications as a Shenzhen-based
      startup founded in 2023 by former Apple engineers, with CEO Will Wang associated with Apple Watch
      and iPhone work and other founders coming from technology and luxury eyewear backgrounds. The
      company's product architecture is unusually focused: Even G2 uses a heads-up display and omits an
      outward-facing camera, while the Even R1 ring supplies tap-and-swipe control. At a reported $599
      starting price before tax, the commercial model is premium hardware rather than an evidenced
      recurring-revenue model. This gives the company a coherent identity around discreet, display-first
      assistance rather than camera-led capture. The leadership evidence is founder-centric; public
      materials identify Wang and broad founder backgrounds but do not provide a complete executive
      roster, board composition, or succession plan. Key-person dependence and governance depth
      therefore remain diligence questions rather than settled facts.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO010]
    tableRefs: [TO002]
  - id: funding-scale-and-commercial-footprint
    title: Funding, scale, and commercial footprint
    body: >-
      TechCrunch and The Next Web report that Even Realities raised $150 million in a pre-Series B round
      led by Meituan and Tencent at a $1 billion valuation in July 2026. The same reporting attributes
      more than 10,000 pairs sold to the company and describes growth from roughly 30–40 staff in 2024
      to 300–400 at the time of reporting; those are company-reported figures rather than audited
      disclosures. TechCrunch reports that more than half of users are in the United States, which it
      calls the fastest-growing market, while manufacturing remains in China and sales focus on the
      United States, Japan, South Korea, the Middle East, and Europe. Reported pricing is $599 for the
      frames before tax, with prescription lenses or the ring adding $200–$300 and average order value
      described as roughly $1,000. The company has said it is profitable, but the available sources do
      not provide revenue, gross margin, cash balance, burn, runway, customer retention, or cap-table
      terms. Funding raised and valuation consequently should not be treated as cash available or as
      evidence of operating returns.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO001, TO003]
  - id: milestones-and-open-diligence
    title: Milestones, adverse signals, and unresolved diligence
    body: >-
      The public record supports a fast product and financing sequence: founding in 2023, G1 launch in
      2024, G2 availability by late 2025 according to July 2026 reporting, a $150 million financing in
      July 2026, and a design-patent lawsuit filed by the corporate parent in August 2026. The lawsuit
      is an adverse signal but not an adjudicated finding: Metaverse Watcher reports that Shenzhen Yiwen
      Tech Limited sued XGIMI-linked defendants and Kickstarter in the Eastern District of New York over
      MemoMind One's design, that Kickstarter suspended the campaign, and that Kickstarter was later
      voluntarily dismissed while the design dispute against the other defendants remained open. CES
      product-review material supplies a separate source type for the G2's camera-free design and
      starting price, but it is not a controlled reliability or sales study. The most important gaps are
      a complete leadership and board map, audited financial statements, unit and cohort data beyond the
      reported 10,000-plus pairs, and the legal entity, patent, and case record underlying the dispute.
    claimRefs: [CO004, CO010, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
