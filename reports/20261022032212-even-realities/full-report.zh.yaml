      - number: '3.2'
        title: 能力、价格与分销对比
        blocks:
          - type: paragraph
            body: >-
              最强的差异化来自组合，而不是某个孤立功能：低调眼镜形态、无摄像头的社交姿态、以文字为中心的光学显示，以及基于戒指的控制。独立实测证据支持实用的实时翻译和提词，但也记录了一次短演示中 Conversate
              失效，以及测试日期时导航与 Google Maps 不兼容。G2 的公开起售价为 $599，而 Meta 据报道为 $299；这都是起售价，不是实际订单金额或利润率，且两款产品并非功能逐项等价。Meta 和
              Snap 还拥有 Even 无法直接匹敌的分销和生态优势。结果是一个聚焦的高端主张，信任吸引力明显，但容易受到既有厂商压价、功能追赶和消费者更易获得的冲击。
            claimRefs:
