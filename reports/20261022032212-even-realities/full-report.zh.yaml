chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与领导层
        blocks:
          - type: paragraph
            body: >-
              多家独立科技出版物称，Even Realities 是一家总部位于深圳、由前 Apple 工程师于 2023 年创立的初创公司；CEO Will Wang 据报道曾参与 Apple Watch 和 iPhone
              工作，其他创始人则拥有科技和奢侈眼镜行业背景。公司的产品架构相当聚焦：Even G2 使用抬头显示器且没有面向外部的摄像头，Even R1 戒指则提供点击和滑动控制。税前起售价据报道为
              $599，因此其商业模式是高端硬件，而不是已有证据支持的经常性收入模式。公司因此围绕低调、显示优先的辅助体验形成清晰定位，而非依赖摄像头采集。领导层证据以创始人为中心；公开材料确认了 Wang
              及创始人背景的大致类别，但没有完整的高管名单、董事会构成或继任计划。因此，关键人物依赖和治理深度仍是尽调问题，不能视为已确定事实。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
      - number: '1.2'
        title: 融资、规模与商业足迹
        blocks:
          - type: paragraph
            body: >-
              TechCrunch 和 The Next Web 报道，Even Realities 于 2026 年 7 月完成 $150 million B 轮前融资，由 Meituan 和 Tencent 领投，估值
              $1 billion。同一报道将超过 10,000 副眼镜的销量归因于公司，并称员工数从 2024 年的约 30–40 人增长到报道时的 300–400
              人；这些是公司披露的数据，并非经审计披露。TechCrunch 报道称，超过一半用户在美国，并称美国是增长最快的市场；公司仍在中国制造，销售重点覆盖美国、日本、韩国、中东和欧洲。报道称镜架税前售价为
              $599，处方镜片或戒指另加 $200–$300，平均订单金额约为
              $1,000。公司曾表示自己已实现盈利，但现有来源没有披露收入、毛利率、现金余额、烧钱速度、现金跑道、客户留存或股权结构条款。因此，融资额和估值不应被视为可用现金，也不应被视为经营回报的证据。
