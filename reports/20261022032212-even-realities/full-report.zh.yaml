      - number: '1.3'
        title: 里程碑、反向信号与未决尽调
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一条快速推进的产品与融资路径：2023 年成立、2024 年推出 G1、据 2026 年 7 月报道 G2 在 2025 年底前后上市、2026 年 7 月完成 1.5 亿美元融资，以及公司母公司于
              2026 年 8 月提起设计专利诉讼。诉讼属于反向信号，但不是司法裁决：Metaverse Watcher 报道称，Shenzhen Yiwen Tech Limited 就 MemoMind One
              的设计，在纽约东区起诉与 XGIMI 相关的被告和 Kickstarter；Kickstarter 暂停了该活动，后来又自愿退出诉讼，而针对其他被告的设计争议仍未解决。CES 产品评测材料为 G2
              的无摄像头设计和起售价提供了另一类来源，但不是受控的可靠性或销售研究。最重要的缺口包括完整的领导层和董事会图谱、经审计财务报表、超出已报道 10,000
              多副眼镜的单量和队列数据，以及该争议背后的法律实体、专利和案件记录。
