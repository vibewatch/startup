  - id: FE001
    title: G2 产品架构图
    type: stack
    summary: G2 体验覆盖显示硬件、交互、手机连接和 AI 工作流；手机和软件层是主要依赖环节。
    data:
      layers:
        - label: AI 与工作流服务
          detail: 与手机连接的软件层向用户提供辅助功能。
          items:
            - name: Translation
              detail: 实时翻译显示在镜片上；来源称 G2 支持 31 种语言。
            - name: Conversate
              detail: 上手报道介绍了实时转写、准备笔记和情境说明。
            - name: Navigation and teleprompt
              detail: 逐步导航和演示提示会显示给佩戴者。
        - label: 手机与应用
          detail: 移动应用提供设置、路线规划和功能入口。
          items:
            - name: Even app
              detail: 手机负责设置、功能入口、输入路线信息和调节亮度。
            - name: Bluetooth link
              detail: 眼镜严重依赖手机连接；据报道，断连和通知可靠性存在风险。
        - label: 可穿戴交互
          detail: 眼镜和可选戒指提供触控和语音输入。
          items:
            - name: Stem controls
              detail: 点击或长按眼镜可打开仪表盘和功能菜单。
            - name: Even R1
              detail: 可选戒指控制器支持隐蔽触控输入；独立评测质疑其 $249 价格对应的增量价值。
        - label: 显示硬件
          detail: 眼镜通过双目 Micro-LED 波导光学呈现信息。
          items:
            - name: Binocular Micro-LED waveguide
              detail: 据报道，G2 规格为每眼 640 × 350 像素、1,200 nits、60 Hz，视场角 27.5°。
            - name: Lightweight frame
              detail: 不同来源称重量为 35–36 克；材料据称为镁合金和钛合金。
            - name: Microphones and battery
              detail: 据报道，G2 配有四个麦克风，续航最长达两天或 48 小时；评测者未独立测试后一个说法。
        - label: 音频与感知
          detail: 语音激活和环境交互取决于麦克风及周围的声学条件。
          items:
            - name: Four microphones
              detail: TechCrunch 报道 G2 有四个麦克风，G1 则为两个。
        - label: 电源与充电
          detail: 电池和充电盒性能决定这款可穿戴设备能否支撑全天使用。
          items:
            - name: Wireless charging case
              detail: 产品报道介绍了无线充电和最长 48 小时续航；评测者未独立测试两天续航的说法。
    claimRefs:
