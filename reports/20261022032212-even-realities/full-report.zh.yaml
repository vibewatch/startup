      - number: '3.3'
        title: 切换成本、护城河持久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              护城河依据是集成光学、工业设计、隐私定位和不断成熟的软件控制体验，而不是已披露的网络效应。处方支持、R1
              戒指以及反复使用翻译或提词功能可以形成工作流熟悉度，但指定证据没有证明留存、专有分销、开发者规模、经常性软件经济性或企业设备锁定。竞争压力是真实的：低价既有厂商可以重置买家预期，纯显示同业可以挑战效用主张，而针对与
              XGIMI 相关的 MemoMind 被告提起的设计专利诉讼，显示一个稀疏的无摄像头概念多快就会吸引相近替代品。该诉讼尚未裁决，因此它是竞争和 IP
              执法活动的证据，不是侵权证明。持久性仍取决于未公开的客户队列、渠道和经济性证据。
