      - number: '5.3'
        title: 差异化、运营风险与尽调结论
        blocks:
          - type: paragraph
            body: >-
              无摄像头设计是最清晰的差异化。它减少了向外录制带来的社交顾虑，支持隐私导向定位，但也移除了竞争对手用于采集和上下文理解的摄像头多模态能力。独立上手证据对成熟度的评价不一：应用更新后连接有所改善，但早期断连严重；导航能显示方向，却据报道经常误识别地址；Even
              AI 有时无法启动，或在室外误听语音；通知也并不总是可靠。一份声誉较低的产品分析称 G1 已被替代，并将无螺丝铰链的长期耐用性和未来软件支持列为未决问题，因此这些是尽调提示，不是已确定的故障。Even
              母公司还就装饰性镜架设计提起了 2026 年设计专利诉讼；由于案件尚未裁决，且专利涉及外观而非光学或
              AI，这份诉讼显示的是执法活动，而不是技术护城河。产品值得继续围绕高端细分市场尽调，但公开证据尚未证明软件可靠性、驱动留存的生态深度、长期硬件耐用性或可防守的开发者平台。
            claimRefs:
              - CE009
              - CE010
