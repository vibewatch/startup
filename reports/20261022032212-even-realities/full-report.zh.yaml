            body: 据报道的设计专利诉讼和活动中断足以要求开展主案卷尽调，但指定证据没有证明专利有效性、侵权、损害赔偿或最终商业结果。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: 以可靠性和私人经济性作为规模投资门槛
            body: 要求受控的失败率数据和经审计的单位经济性，并区分出货设备、已激活用户、留存使用、退货、配件附加、毛利率、库存、烧钱速度和现金跑道。
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              可投资逻辑是押注无摄像头、显示优先智能眼镜的聚焦硬件定位。独立报道描述了 $599 的 G2、配套戒指，以及可能重视低调和隐私而不是摄像头采集的专业用户群。据报道的 2026 年 7 月融资来自 Meituan
              和 Tencent 的战略资本，为公司扩张产品和运营提供空间。反向逻辑同样重要：公开来源没有将 10 亿美元估值与经审计收入或利润率挂钩，Meta 和 Snap
              拥有明显更强的分销，而高端配件驱动的订单金额可能受到低价竞争对手挤压。公司母公司针对与 XGIMI
              相关被告的专利执法行动也表明，狭窄的设计空间可能带来法律成本和结果不确定性；保留报告称案件仍在审理中且尚未裁决。因此，证据支持差异化产品逻辑，而不是对价格不敏感的买入决策。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Pulse2 等报道称，公司以 $1 billion 估值完成 $150 million B 轮前融资；Business Model Analyst 报道基础价格为 $599，处方镜片或戒指另加 $200 至
              $300，可将订单推向 $1,000。这些数字不能互换：融资估值是投资者定价，平均订单金额既不是收入，也不是
              ARR。公开材料没有确认该轮清算优先权、期权池处理、股权稀释、债务、现金余额、烧钱速度或现金跑道。因此，入场纪律应建立在经核实的未来收入和毛利率上，而不是标题估值倍数。在这些输入出现前，精确目标价格没有依据。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              乐观情景是一个持久的高端品类：无摄像头隐私和显示效用支持可重复需求、开发者采用和约 $1,000
              的稳定客单价。基准情景是一个可信的细分产品，拥有战略投资者，但公开披露不足以证明当前估值由规模支撑。悲观情景则包括价格压缩、更强的平台竞争、软件留存薄弱、制造或跨境摩擦，以及母公司专利执法行动带来的法律成本或结果不确定性。由于公司是私人公司，公开记录缺乏经审计的经营
              KPI，因此退出准备度尚未得到证明。只有在审阅经审计或达到董事会级别的财务数据、队列留存、股权结构条款、供应和保修数据，以及专利案件状态后，决策才应转向买入。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV011
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 继续研究：Even Realities 值得继续尽调，但在没有私人财务和条款核验的情况下，公开证据不足以支持按报道的 10 亿美元估值买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV011
          - type: callout
            title: 对价格敏感的风险
            body: 尚未解决的关键问题不是公司是否拥有差异化硬件，而是将平台竞争和诉讼暴露计入后，未披露的收入质量、毛利率、留存和融资条款能否支撑当前估值。
            calloutType: risk
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV009
              - CV012
