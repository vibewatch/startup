        title: 牵引力可见，但销售效率不可见
        blocks:
          - type: paragraph
            body: >-
              现有证据显示的是早期商业牵引力，而非完整经营记分卡。The Next Web 称 Even 报告自己是该品类中首家售出超过 10,000 副的公司；The Next Web 和 Business Model
              Analyst 都描述员工从约 40
              人增长到数百人。这些是公司披露的数据，不是经审计的客户或收入披露。据报道，超过一半用户在美国，约三分之一是高管，说明用户可能以早期采用者为主，但不能证明留存、渠道效率或可重复的销售漏斗。指定来源没有提供
              CAC、回本周期、销售周期、渠道抽成、队列留存、活跃用户分母或按地区拆分的收入。因此，尽调应将单量和客户构成视为方向性证据，而不是队列经济性的替代品。
            claimRefs:
