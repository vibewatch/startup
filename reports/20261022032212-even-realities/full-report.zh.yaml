      - number: '4.4'
        title: 财务结论：价格架构有吸引力，但证明不完整
        blocks:
          - type: paragraph
            body: >-
              这套财务逻辑自洽，却仍未经证明：公司卖高端显示眼镜，并附加配件和处方镜片；早期销量据报道已有起色，大额融资也能为产品和市场扩张供血。仅凭公开记录，还无法评估收入质量或毛利率能否持续。一笔约 $1,000
              的订单，若被光学件、处方镜片履约、退货、保修、物流或渠道成本吞噬，仍可能只有很低的毛利率；反过来，公司据报道已实现盈利，若经审计报表和库存数据证实，则颇具吸引力。主要反向信号来自估值敏感性：收入基数未披露，估值却达到
              $1 billion，而品类里程碑据报道仅为 10,000-plus-unit，说明估值已计入大量未来执行成果。下一步尽调应索取月度管理报表，勾稽订单、确认收入、贡献毛利、现金消耗、库存周转、退款和队列留存。
