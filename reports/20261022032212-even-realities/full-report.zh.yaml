        title: 硬件架构与成熟度
        blocks:
          - type: paragraph
            body: >-
              G2 架构结合双目 Micro-LED 波导光学、轻量镜架、麦克风、蓝牙连接、配套移动应用和可选戒指控制。一份当前产品报告列出每只眼 640 × 350 像素、1,200 nits、60 Hz、27.5°
              视场角、36 克、IP65 防护、Bluetooth 5.4、兼容 iOS 和 Android，以及据称 48 小时续航。TechCrunch 报道称，相比 G1，显示面积扩大 75%，刷新率从 20 Hz
              提升至 60 Hz；评测者认为 G2 佩戴舒适，但仍高度依赖手机。因此，这是一个分布式系统：光学和输入位于可穿戴设备上，而连接、应用逻辑和 AI 功能仍与手机及云服务绑定。这种依赖既是实现要求，也是可靠性暴露面。
