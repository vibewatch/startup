    type: journey-map
    summary: 公开证据支持这些使用阶段，但转化率、留存率和扩展率仍未披露。
    data:
      nodes:
        - id: discover
          label: 发现
          title: Discover
          detail: 高端专业人士接触到无摄像头生产力方案。
          touchpoints:
            - Independent coverage
            - Professional use-case reviews
        - id: configure
          label: 配置
          title: Configure
          detail: 买家选择镜架、处方镜片，并可选购 R1 戒指。
          touchpoints:
            - $599 entry frame
            - Prescription fitting
        - id: onboard
          label: 上手
          title: Onboard
          detail: 移动应用将眼镜和戒指配对，并介绍核心控制方式。
          touchpoints:
            - Even mobile app
            - Guided tutorial
        - id: use
          label: 日常使用
          title: Use daily
          detail: 提词器、翻译、提醒和导航为工作流提供价值。
          touchpoints:
            - G2 display
            - R1 ring
        - id: adapt
          label: 适配与佩戴
          title: Adapt and fit
          detail: 处方质量、可读性、延迟和充电体验影响持续使用。
          touchpoints:
            - Lens configuration
            - Charging case
        - id: expand
          label: 扩展
          title: Expand
          detail: Prep Notes 和 Even Hub 可以增加工作流，但没有可量化的扩展数据。
          touchpoints:
            - Prep Notes
            - Even Hub
    approximationNotes: 这只是按顺序排列的定性旅程；未披露转化率、队列规模或阶段时长，节点顺序也不能解读为实测漏斗。
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 核心功能可靠性和隐私保障的剩余风险最高，因为二者都决定使用体验，且缺乏受控的公开证据。
    data:
      columns:
        - 高影响
        - 中影响
        - 较低影响
      rows:
        - label: 观察到的可能性较高
          values:
            - displayValue: Noisy-setting transcription failure
              detail: 两份独立评测都发现，在嘈杂或声学条件复杂的环境中，采集效果会下降。
            - displayValue: Connected-service dependence
              detail: 据报道，当前功能需要手机和互联网连接。
            - displayValue: Control friction
              detail: 评测证据指出控制方式不顺手，且可选戒指需另行付费。
        - label: 观察到的可能性中等
          values:
            - displayValue: Privacy and consent exposure
              detail: 即使没有摄像头，麦克风和连接云端的 AI 仍然会带来隐私和同意风险。
            - displayValue: AI inconsistency
              detail: 评测者称 Conversate 和 AI 的表现会失败或前后不一致。
            - displayValue: Premium-price resistance
              detail: 起售价约为 $599，不含处方镜片和配件。
        - label: 结果未知
          values:
            - displayValue: Adverse legal remedy
              detail: 据报道，外观设计专利案件仍未结案，尚未裁判。
            - displayValue: Cross-border disruption
              detail: 中国制造和海外销售带来风险敞口，但未披露缓冲措施。
            - displayValue: Accessory support burden
              detail: 配件搭售、配对、充电和支持指标不可得。
        - label: 证据不可得
          values:
            - displayValue: Security or incident-control failure
              detail: 现有资料池没有架构、子处理商、事故和恢复证据。
            - displayValue: Cash-runway compression
              detail: 融资金额并未说明可用现金、现金消耗、库存或营运资金需求。
            - displayValue: Certification gap
              detail: 资料池中没有特定市场认证和产品安全记录。
        - label: 监测触发条件
          values:
            - displayValue: Persistent core-feature failure
              detail: 在普通使用场景中反复失败，会动摇重复使用假设。
            - displayValue: Docket escalation
              detail: 禁令、反诉、和解或重新设计，都可能改变法律风险敞口。
            - displayValue: Support and return increase
              detail: 支持和退货负担上升，将检验产品质量和高端经济模型。
        - label: 缓释证据
          values:
            - displayValue: Independent control validation
              detail: 安全、隐私、可靠性和财务尽调可以降低不确定性。
            - displayValue: Offline and provider redundancy
              detail: 备用架构可以降低对联网服务的风险敞口。
            - displayValue: Cohort reporting
              detail: 活跃使用、留存、退货和利润率可以检验采用质量。
    approximationNotes: 这只是分析师的定性定位；现有证据没有概率、事故率或基准分母。
    claimRefs:
      - CR002
      - CR006
      - CR008
      - CR009
      - CR010
      - CR012
      - CR013
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 差异化产品和战略融资支持继续尽调，但私有经济数据缺失，加上竞争和法律风险，结论仍是“继续研究”。
    data:
      nodes:
        - id: scale
          label: 产品验证
          detail: 无摄像头 G2、显示价值和据报道的高端定价
        - id: capital
          label: 战略融资
          detail: 据报道 $150M 的 B 轮前融资，估值 $1B
        - id: risks
          label: 尚未化解的投资风险
          detail: 没有公开经审计的经济数据；存在平台竞争，且专利执行行动尚未解决
        - id: terms
          label: 仍需取得的条款
          detail: 股权结构表、优先权、稀释、现金、消耗和留存
        - id: exit
          label: 退出准备度
          detail: 经审计的规模和持久留存仍未披露，因此尚未得到证明
        - id: decision
          label: 继续研究
          detail: 入场前需完成私有 KPI、股权结构表、优先权和诉讼尽调
      edges:
        - - scale
          - capital
        - - capital
          - risks
        - - risks
          - terms
        - - terms
          - exit
        - - exit
          - decision
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV009
      - CV011
