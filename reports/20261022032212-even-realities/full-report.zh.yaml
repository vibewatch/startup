  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发条件
    rows:
      - - 乐观
        - 高端无摄像头细分市场扩大，开发者生态和复购需求改善，订单金额维持在据报道约 ~$1,000 的水平。
        - 经验证的收入和利润率画像，可能支持高于据报道 $1 billion 的估值。
        - 低至中等；需要核实私有 KPI。
        - 订单金额下降、留存疲弱，或平台型竞争对手抹平差异化。
      - - 基准
        - 产品仍是可信的细分品类，且获得战略资本，但公开财务披露仍不完整。
        - 维持“继续研究”；没有站得住脚的公开倍数或目标回报。
        - 按当前证据，概率最高。
        - 管理层无法提供经审计或达到董事会材料标准的收入、利润率、消耗、现金跑道和股权结构表条款。
      - - 悲观
        - 价格承压、供应或跨境摩擦、软件使用不足，以及知识产权执行或商业化受挫相互叠加。
        - 下行空间较大，因为当前估值包含了尚未得到公开证明的未来规模。
        - 实质性；有已披露的竞争和法律不确定性支撑。
        - 更低价替代品重置品类定价，或专利行动消耗大量资源却未能强化护城河。
    notes: 这些情景用于决策，不是按概率加权的预测；由于收入、利润率、留存、持股和优先权输入均未披露，因此不虚构数值估值区间。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
