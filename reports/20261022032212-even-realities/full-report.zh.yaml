  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类拆分
        blocks:
          - type: paragraph
            body: >-
              相关市场是日常智能眼镜：把信息放入佩戴者视野，包括光学显示、翻译、导航、提示和配套控制界面。市场不包括沉浸式头显，也应与摄像头优先、核心价值包含采集和视觉 AI 的眼镜分开。证据显示，该品类分为摄像头加 AI
              产品和无摄像头显示产品，而不是一个同质化整体。因此，Even 的 G2
              争夺的是重视低调获取信息、普通眼镜形态和较低社交摩擦的买家。去掉摄像头是产品边界，不代表公司拥有更广泛市场：这也会失去查看地标或拍摄图像等视觉 AI
              场景。明确的现状替代方案是用手机处理通知、翻译和导航，或者根本不采用环境计算设备；现有来源没有量化这种行为被替代的支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角与采用信号
        blocks:
          - type: paragraph
            body: >-
              现有市场数字具有方向性，不能直接构成干净的 TAM/SAM/SOM。Tech Funding News 报道称，Grand View Research 预计全球智能眼镜市场将在 2026 年超过 $3
              billion，并在 2033 年前以 24% 的年速度增长；这是品类层面的估计，不是 Even 特定的可服务市场。同一报道援引 IDC 数据称，2026 年初无显示智能眼镜的出货量同比增长
              167%，这是采用信号，但没有披露基数、地理范围或 Even 的份额。公司和行业报道提供了第二个视角：Even 称已售出超过 10,000 副，G2 起价为 $599，处方镜片和 R1 戒指使平均订单接近
              $1,000。这些数字体现的是高端变现假设，不是收入或市场份额。要得出可靠的 SAM，还需要出版方方法论、可服务地区、渠道经济性、复购和配件行为，以及经核实的 Even 单量。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
