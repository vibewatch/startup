    rows:
      - - 以隐私为核心的差异化
        - 无摄像头显示眼镜和戒指，瞄准不打扰日常使用。
        - 若证据显示用户留存疲弱，或大型平台迅速实现无摄像头功能同质化。
      - - 高端定价可以支撑经济模型
        - 据报道 G2 售价为 $599，部分报道显示平均订单金额约为 $1,000。
        - 经审计的毛利率、退货、保修成本和复购数据低于投资判断门槛。
      - - 战略融资印证品类热度
        - 据报道，Meituan 和 Tencent 领投 $150 million 的 B 轮前融资，估值 $1 billion。
        - 若轮次条款、稀释幅度或后续融资显示该估值并不持久。
      - - 狭窄品类带来法律成本和竞争风险
        - Even Realities 的母公司正在针对与 XGIMI 相关的被告主张外观设计专利，据报道案件仍未解决。
        - 只有完成主要案卷审查、厘清裁判结果并验证专利强度，才能判断这项行动是在保护护城河，还是在消耗资源。
    notes: 这些论点区分了据报道的融资和产品事实与投资者解读；诉讼来源描述的是指控和程序事实，并未认定侵权。
