  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 变现模式是高端硬件加配件收入
        blocks:
          - type: paragraph
            body: >-
              Even Realities 看起来通过硬件直销变现，而不是依靠已披露的经常性软件订阅。SiliconANGLE 报道 Even G2 基础价格为 $599，并介绍可选 Even R1 戒指；The Next
              Web 报道称，处方镜片和戒指可将典型订单推至接近
              $1,000。这些是标价或报道的订单金额，不是已确认收入、毛利润或客户终身价值。因此，该模式取决于高价转化、配件和处方镜片附加，以及足够的光学和服务质量来支撑退货和复购。公开来源没有披露实际价格、折扣、退款率、保修成本、软件收入或带配件订单的比例，因此表格将可观察价格与未知的变现质量分开。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
