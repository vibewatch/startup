              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: 买家、驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              目前观察到的买家切口是：希望不掏手机、不佩戴摄像头，却能一瞥获取信息的专业人士。行业报道称，大多数客户是 30–50
              岁男性专业人士，并称一项内部调查发现约三分之一是公司高管；这些是公司披露的细分信号，不是独立抽样的市场份额。使用场景包括翻译、导航、提词、对话摘要和监控编码代理。因此，预算负责人通常是个人消费者或专业人士，也可能走雇主资助路径，但目前尚未形成企业部署计划。采用驱动因素包括隐私和社交舒适度、低调的眼镜形态、光学质量和有用的重复工作流。约束包括高价、对配件的依赖、新鲜感消退后的留存不确定、摄像头功能有限、麦克风和转录带来的隐私问题，以及
              Meta 和 Snap 的渠道竞争。未决专利争议也是市场摩擦信号：在法院裁决实体问题前，狭窄的外观设计赛道就可能引发诉讼和众筹中断。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 可投资市场是一个切口，不是标题品类
            body: 最有力的证据支持一个有真实需求信号的高端无摄像头显示眼镜细分市场，但不应把广义智能眼镜市场估计说成 Even 可获得的市场。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM009
          - type: callout
            title: SAM 与留存仍未验证
            body: 公开报道没有提供独立验证的客户队列、留存曲线、可服务地区或单位经济性，无法将品类增长转换为 Even 特定的预测。
            calloutType: risk
            claimRefs:
              - CM009
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与品类边界
        blocks:
          - type: paragraph
            body: >-
              Even Realities 最适合被理解为一家显示优先的智能眼镜公司。G2 没有摄像头和扬声器，采用镜片内显示，并与 R1 戒指配合；报道和实测将导航、翻译、通知和提词描述为核心任务。Meta 和 Snap
              代表摄像头驱动的既有路径，XREAL 和 Viture 被视为纯显示同业，而与 XGIMI 相关的 MemoMind
              则是直接的无摄像头设计挑战者。手机、智能手表、翻译应用和传统提词器仍是单项任务的现状替代品，虽然它们无法复现同样的免手持眼镜体验。行业报道提到 Google
              是可能的进入者，但指定证据没有证明买家会寻求可信的内部自建替代方案。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP012
              - CP015
              - CP016
