      - number: '4.3'
        title: 融资提升能力，但不证明现金跑道
        blocks:
          - type: paragraph
            body: >-
              SiliconANGLE 和 The Next Web 独立报道了一笔 1.5 亿美元、估值 10 亿美元的融资，由 Meituan 领投、Tencent
              参与；这是融资额，不是扣除费用、先前支出或限制条件后当前可用的现金。Business Model Analyst
              报道公司称自己盈利，但该说法在指定证据中未经审计，也没有披露贡献毛利、经营费用、营运资金、库存承诺或现金转换。硬件模式承担光学、制造、质量、物流、保修和支持成本，而公司据 The Next Web
              报道在中国制造并进行国际销售。公开证据没有确认债务、信贷额度、项目融资、供应商融资、现金余额、烧钱速度、现金跑道或下一轮融资触发条件。因此，不能从融资消息或盈利说法推断资本充足性。
