        blocks:
          - type: paragraph
            body: >-
              Even Realities 销售的是显示优先的可穿戴设备，而不是摄像头优先的采集设备。G2 通过抬头显示器呈现单色信息，而连接的手机承担了大部分应用和 AI
              体验。据报道的工作流包括通知、翻译、导航、提词、对话辅助、笔记和会议上下文。TechCrunch
              将目标受众描述为开会、做演示或跨语言旅行的人；其上手评测还发现，翻译功能足以帮助用户跟进中文、法语和西班牙语对话。这指向专业人士和旅行者的聚焦场景，而不是通用娱乐头显。因此，当用户需要一瞥获取文字和低调体验时，产品主张最强；当用户期待自主、广泛的日常计算时则较弱。
