company:
  name: Even Realities
chapter:
  number: 4
  title: Financials
  summary: Public reporting supports a premium hardware monetization model around $599 base frames and an approximately $1,000 typical order, alongside a reported $150 million financing at a $1 billion valuation. The underwriting case remains constrained by the absence of audited revenue, gross margin, burn, runway, customer concentration, and realized unit-economics data.
sections:
  - id: monetization-model
    title: Monetization is premium hardware plus attach
    body: >-
      Even Realities appears to monetize through direct hardware sales rather than a disclosed
      recurring software subscription. SiliconANGLE reports a $599 Even G2 base price and describes
      the optional Even R1 ring, while The Next Web reports that prescription lenses and the ring
      can push a typical order near $1,000. These are list or reported order values, not recognized
      revenue, gross profit, or lifetime value. The model therefore depends on conversion at a
      premium price, accessory and prescription attachment, and sufficient optical and service
      quality to support returns and repeat demand. Public sources do not disclose realized pricing,
      discounting, refund rates, warranty costs, software revenue, or the share of orders carrying
      accessories, so the table separates observable pricing from unknown monetization quality.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: traction-and-sales-efficiency
    title: Traction is visible, but sales efficiency is not
    body: >-
      The available evidence indicates early commercial traction rather than a complete operating
      scorecard. The Next Web says Even reported being first in its category to sell more than
      10,000 pairs, and both The Next Web and Business Model Analyst describe growth from roughly
      40 staff to several hundred; those are reported company figures, not audited customer or
      revenue disclosures. More than half of users are reported to be in the United States and
      roughly one-third to be executives, which suggests an early-adopter mix but does not establish
      retention, channel efficiency, or a repeatable sales funnel. No source in the assigned pool
      provides CAC, payback, sales-cycle duration, channel take rate, cohort retention, active-user
      denominator, or revenue by geography. Underwriting should consequently treat unit count and
      customer mix as directional evidence, not as a substitute for cohort-level economics.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-and-cost-structure
    title: Financing improves capacity without proving runway
    body: >-
      SiliconANGLE and The Next Web independently report a $150 million financing at a $1 billion
      valuation, led by Meituan with Tencent participating; this is financing raised, not cash
      currently available after fees, prior spending, or restrictions. Business Model Analyst
      reports that the company says it is profitable, but that assertion is unaudited in the
      assigned evidence and does not disclose contribution margin, operating expenses, working
      capital, inventory commitments, or cash conversion. The hardware model carries optical,
      manufacturing, quality, logistics, warranty, and support costs, while the company sells
      internationally and manufactures in China according to The Next Web. Public evidence does
      not identify debt, credit facilities, project finance, supplier financing, cash balance,
      burn rate, runway, or the next-round trigger. Capital adequacy therefore cannot be inferred
      from the financing headline or the reported profitability claim.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: underwriting-verdict
    title: "Financial verdict: promising price architecture, incomplete proof"
    body: >-
      The financial case has a coherent but unproven shape: a premium display-glasses product,
      accessory and prescription attach, reported early unit traction, and a large financing event
      that can fund product and market expansion. It is not yet possible to underwrite revenue
      quality or margin durability from the public record. A roughly $1,000 order can coexist with
      weak gross margin if optics, prescription fulfillment, returns, warranty, logistics, or
      channel costs consume the ticket; conversely, a reported profitable operation could be
      attractive if confirmed with audited statements and inventory data. The main adverse signal
      is valuation sensitivity: a $1 billion valuation against an undisclosed revenue base and only
      a reported 10,000-plus-unit category milestone leaves substantial future execution priced in.
      The next diligence step is a monthly management pack tying orders to recognized revenue,
      contribution margin, cash burn, inventory turns, refunds, and cohort retention.
    claimRefs: [CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams table
    columns: [Stream, Mechanism, Unit, Current value/status, Quality, Diligence ask]
    rows:
      - [Even G2 frames, Direct hardware sale, "per pair", "$599 reported starting price", "Public list price; not realized revenue", "Order-level ASP, discounts, refunds, and recognized revenue"]
      - [Prescription lenses, Accessory/optical attach, "per order", "$200-$300 reported incremental range with lenses or ring", "Reported range; mix and realized price unknown", "Attach rate, fulfillment cost, return rate, and margin"]
      - [Even R1 ring, Companion hardware attach, "per unit/order", "$200-$300 reported incremental range with lenses or ring", "Reported range; ring share not disclosed", "Attach rate, BOM, warranty, and replacement rate"]
      - [Software or AI services, No public recurring price identified, "subscription or usage", null, "No public recurring revenue evidence in assigned pool", "Confirm whether software revenue exists and reconcile to hardware cohorts"]
    notes: Pricing figures are reported or published list-price evidence; they are not recognized revenue, ARR, or gross margin.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization table
    columns: [Offer, Price basis, List vs realized, Discount or unknown, Implication]
    rows:
      - [Even G2 base frames, "$599 before tax", "List/reported", "Discounting and taxes unknown", "Premium entry point requires willingness to pay"]
      - [Prescription lens or R1 add-on, "$200-$300 incremental range", "Reported order uplift", "Product mix and realized uplift unknown", "Attach can lift ticket but adds fulfillment and warranty exposure"]
      - [Typical order, "Approximately $1,000", "Reported average order", "Denominator and period not disclosed", "Potentially attractive ticket; cannot infer revenue run rate"]
      - [Recurring software, "Not disclosed", "Unavailable", "Subscription, usage, or bundled economics unknown", "No basis for SaaS-style ARR or retention assumptions"]
    notes: Public reporting does not provide a price waterfall from list price to net revenue or a contract-level cohort view.
    claimRefs: [CI001, CI002, CI003, CI013]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Value/null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Reported category unit milestone, "More than 10,000 pairs", "Medium; company-reported through independent coverage", "Shows initial demand but not revenue scale or repeat use", "Shipments, paid orders, returns, active use, and cohort retention"]
      - [Average order value, "Approximately $1,000", "Medium; reported", "Determines revenue capacity before costs", "Order-level distribution, attach mix, discounts, taxes, and refunds"]
      - [Gross margin, null, "Unavailable", "Optics, prescription, manufacturing, warranty, and logistics may determine viability", "Audited gross margin by SKU and contribution bridge"]
      - [CAC/payback and sales cycle, null, "Unavailable", "Tests whether premium demand is efficiently acquired", "Channel-level CAC, conversion, sales cycle, payback, and repeat purchase"]
    notes: Nulls are evidence gaps, not zero values; no public source in this pool supplies audited unit economics.
    claimRefs: [CI005, CI013, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Reported premium hardware pricing can lead to an attached-order ticket, but public evidence does not establish recognized revenue or gross profit.
    data:
      nodes:
        - id: customer-demand
          label: Customer demand
          value: "Public traction reported; denominator incomplete"
          note: "More than 10,000 pairs is a reported category milestone, not a current-period revenue measure."
        - id: base-frame-order
          label: Even G2 base frame
          value: "$599 reported starting price"
          unit: USD per pair
        - id: attach-choice
          label: Prescription or R1 attach
          value: "$200-$300 reported incremental range"
          unit: USD per order
        - id: typical-order
          label: Reported typical order
          value: "Approximately $1,000"
          unit: USD per order
        - id: recognized-revenue
          label: Recognized revenue
          value: null
          note: "Not disclosed in assigned public evidence."
        - id: gross-profit
          label: Gross profit
          value: null
          note: "Not disclosed; cannot be derived from list price."
      edges:
        - from: customer-demand
          to: base-frame-order
        - from: base-frame-order
          to: attach-choice
        - from: attach-choice
          to: typical-order
        - from: typical-order
          to: recognized-revenue
        - from: recognized-revenue
          to: gross-profit
    approximationNotes: The bridge is a conceptual revenue path using reported price points; it does not calculate conversion, revenue, margin, or cash flow.
    claimRefs: [CI001, CI002, CI003, CI005, CI013, CI014]
callouts:
  - calloutType: strength
    title: Premium ticket is a plausible wedge
    body: A reported $599 base price and approximately $1,000 typical order indicate a premium hardware strategy with accessory and prescription attach, although realized economics remain unverified.
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: Financing is not runway
    body: The reported $150 million raise and $1 billion valuation do not reveal cash on hand, burn, debt, inventory commitments, or the time to the next financing trigger.
    claimRefs: [CI009, CI010, CI012]
  - calloutType: recommendation
    title: Require a contribution-margin bridge
    body: Before underwriting valuation, request audited revenue recognition, SKU-level gross margin, inventory and warranty liabilities, CAC/payback, cohort retention, and a 24-month cash forecast.
    claimRefs: [CI013, CI014, CI015, CI016]
