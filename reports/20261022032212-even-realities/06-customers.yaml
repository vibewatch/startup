schemaVersion: "report-v2"
artifact: customers
slug: even-realities
runDate: 2026-10-22
company:
  name: Even Realities
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence points to a premium professional-consumer base, with company-survey
    reporting skewed toward men aged 30-50 and more than half of users in the United
    States. Product reviews show credible everyday utility, but no retained source names
    a paying enterprise account or discloses retention, renewal, concentration, or
    channel economics.
sections:
  - id: buyer-and-user-segmentation
    title: Buyer and user segmentation
    body: >-
      The clearest public segmentation comes from reporting on a company survey rather
      than audited customer records. Business Model Analyst says most buyers are male
      professionals aged 30-50 and about one-third are company executives, while The
      Next Web says more than half of users are in the United States, followed by Japan,
      South Korea, the Middle East, and Europe. The same reporting places the entry frame
      price at $599 and a typical configured order near $1,000 once prescription lenses
      or the R1 ring are added. This supports a premium individual-professional wedge,
      not a demonstrated enterprise sales motion. None of the retained sources identifies
      a paying organization, procurement owner, contract size, or channel contribution,
      so enterprise and partner-led segments remain unverified rather than assumed.
    claimRefs: [CU001, CU002, CU003, CU005, CU013]
    tableRefs: [TU001]
  - id: adoption-and-workflow-proof
    title: Adoption and workflow proof
    body: >-
      The strongest scale indicator is third-party reporting of Even's claim that it was
      the first company in its category to sell more than 10,000 pairs. That is a
      cumulative shipment or sales claim, not an active-user, repeat-purchase, or G2
      installed-base measure. Hands-on evidence is more concrete at the workflow level:
      VR Expert reports a short setup, reliable teleprompter use, usable translation
      across six tested languages with a brief delay, and a full working day of battery
      life. i-SCOOP separately reports support for 22 languages. Even Hub and Prep Notes
      broaden the adoption surface for existing G2 owners, but the platform's installed
      base, app count, and named developer roster were still undisclosed in the retained
      April 2026 source. The journey therefore maps demonstrated interactions, not a
      measured conversion funnel.
    claimRefs: [CU004, CU006, CU007, CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      Public customer proof is not sufficient to underwrite durability. The named
      organizations in the retained evidence are reviewers or publishers, not verified
      paying customers, and the positive CES snippets on NBKomputer are aggregated
      awareness evidence rather than longitudinal usage. VR Expert also encountered a
      practical deployment constraint: its non-prescription test unit was harder to
      read, implying that fit and lens configuration can add onboarding friction. No
      source discloses NRR, GRR, churn, renewals, returns, cohort behavior, satisfaction,
      top-customer exposure, reseller mix, or enterprise conversion. A separate legal
      report describes Even's parent pursuing a design-patent case that disrupted a
      rival's crowdfunding campaign; that event may shape the competitive channel but
      does not prove demand for Even products. Private cohort, order, return, and channel
      data are therefore required before treating the initial premium wedge as durable.
    claimRefs: [CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale
      - Revenue or strategic value
      - Evidence gap
    rows:
      - - US professional consumers
        - Individual professionals; purchaser and wearer appear to be the same person
        - Meetings, prompts, translation, navigation, and discreet information access
        - More than half of users, according to third-party reporting of company data
        - Premium $599 entry price; configured order reported near $1,000
        - No active-user, repeat-purchase, or cohort data
      - - Executives within the professional cohort
        - Individual executives; employer reimbursement is not disclosed
        - Conversation support, teleprompting, and meeting preparation
        - About one-third of buyers in a company survey
        - High willingness-to-pay signal, but no enterprise contract proof
        - Survey sample, denominator, and methodology are undisclosed
      - - Other international consumers
        - Individual users in Japan, South Korea, the Middle East, and Europe
        - Translation, navigation, notifications, and productivity
        - Ranked behind the United States; no country-level counts
        - Geographic diversification is possible but not quantified
        - No regional revenue, return-rate, or retention data
      - - Enterprise experimenters and developer ecosystem
        - Organizations, practitioners, and third-party developers
        - Professional pilots, workflow apps, and G2 extensions through Even Hub
        - No named paying enterprise or developer roster in retained evidence
        - Strategic expansion path rather than proven revenue segment
        - Contract values, pilots, conversion, and channel ownership are undisclosed
    notes: >-
      Segments synthesize third-party reports and hands-on reviews; company-survey
      demographics and geography lack disclosed sample sizes, and null commercial
      metrics remain evidence gaps rather than zero values.
    claimRefs: [CU001, CU002, CU003, CU005, CU010, CU011, CU012, CU013]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Reported value
      - Date / period
      - Source basis
      - Confidence
      - Implication and missing denominator
    rows:
      - - Cumulative product sales
        - More than 10,000 pairs
        - Reported July 2026; underlying cutoff undisclosed
        - Third parties repeating an Even company claim
        - Medium
        - Validates initial paid demand, but not active users, G2 mix, or repeat purchase
      - - US user concentration
        - More than half of users
        - Reported July 2026
        - The Next Web reporting
        - Medium
        - Shows geographic focus; total user denominator and revenue share are absent
      - - Entry price
        - $599 before tax
        - Reported July 2026
        - The Next Web and Business Model Analyst
        - Medium
        - Supports premium positioning; realized net price and discounts are unknown
      - - Typical configured order
        - Roughly $1,000 with prescription lenses or R1 ring
        - Reported July 2026
        - The Next Web and Business Model Analyst
        - Medium
        - Indicates accessory attach potential; order distribution and margin are absent
      - - Tested glasses endurance
        - Full working day
        - Publication date undisclosed
        - VR Expert hands-on review
        - Medium
        - Supports daily workflow viability; sample size and long-term degradation are absent
      - - Even Hub and Prep Notes availability
        - Live for G2 owners; developer submissions open
        - Week of 2026-03-30
        - Virtual Reality News reporting
        - Medium
        - Creates an expansion surface; app count, developer count, and usage are absent
    notes: >-
      Values preserve the reported metric and period. Cumulative pairs are not active
      users, geography lacks a disclosed denominator, and review endurance is not a
      fleet-level benchmark.
    claimRefs: [CU003, CU004, CU005, CU009, CU010, CU011, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Named public reference
      - Segment
      - Deployment or use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - VR Expert
        - XR solution evaluator
        - Teleprompter, translation, reminders, navigation, and full-day workflow testing
        - Hands-on evaluation; not a verified paying deployment
        - Reliable teleprompter, usable translation, and full-workday glasses battery
        - Non-prescription unit impaired readability; no longitudinal or commercial data
      - - i-SCOOP
        - Technology publisher / reviewer
        - Review of professional and everyday G2 workflows
        - Editorial review; purchase and active-use status undisclosed
        - Reports translation support across 22 languages
        - No measured customer outcome, retention period, or procurement evidence
      - - NBKomputer / republished Mashable snippets
        - Technology media audience
        - CES hands-on awareness and presentation, translation, and navigation scenarios
        - Short hands-on coverage; not a customer deployment
        - Positive initial impressions are quoted
        - Aggregated page is low-quality evidence and supplies no buyer or usage denominator
    notes: >-
      This is a partial enumeration of named public evaluators in the assigned evidence
      pool, not a list of verified customers; no retained source names a paying enterprise
      account or supplies production contract evidence.
    enumerationScope:
      coverage: partial
      basis: >-
        Named organizations with customer-adjacent hands-on evidence in the eight retained
        sources reviewed through 2026-10-22.
    claimRefs: [CU006, CU007, CU008, CU009, CU013, CU014, CU015]
figures:
  - id: FU001
    title: Customer journey from premium purchase to ecosystem expansion
    type: journey-map
    summary: >-
      Public evidence supports the interaction stages, while conversion, retention, and
      expansion rates remain undisclosed.
    data:
      nodes:
        - id: discover
          label: Discover
          title: Discover
          detail: Premium professionals encounter a camera-free productivity proposition.
          touchpoints:
            - Independent coverage
            - Professional use-case reviews
        - id: configure
          label: Configure
          title: Configure
          detail: Buyers select frames, prescription lenses, and optionally the R1 ring.
          touchpoints:
            - $599 entry frame
            - Prescription fitting
        - id: onboard
          label: Onboard
          title: Onboard
          detail: The mobile app pairs glasses and ring and introduces core controls.
          touchpoints:
            - Even mobile app
            - Guided tutorial
        - id: use
          label: Use daily
          title: Use daily
          detail: Teleprompter, translation, reminders, and navigation provide workflow utility.
          touchpoints:
            - G2 display
            - R1 ring
        - id: adapt
          label: Adapt and fit
          title: Adapt and fit
          detail: Prescription quality, readability, latency, and charging shape continued use.
          touchpoints:
            - Lens configuration
            - Charging case
        - id: expand
          label: Expand
          title: Expand
          detail: Prep Notes and Even Hub can add workflows, but measured expansion is unavailable.
          touchpoints:
            - Prep Notes
            - Even Hub
    approximationNotes: >-
      Ordered qualitative journey only; no conversion rate, cohort size, or stage duration
      is disclosed, and node order must not be interpreted as a measured funnel.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU012, CU014]
callouts:
  - calloutType: risk
    title: Customer durability is a private-data diligence item
    body: >-
      More than 10,000 reported pair sales and favorable hands-on reviews establish initial
      demand and utility, but they do not establish active use, renewal, returns, enterprise
      conversion, or concentration.
    claimRefs: [CU004, CU006, CU007, CU008, CU009, CU013]
