      whyItMatters: >-
        Reviewer trials and cumulative pair sales do not distinguish individual purchases
        from production enterprise adoption or validate repeatable account economics.
      diligencePath: >-
        Request an anonymized customer ledger, three reference calls across consumer and
        enterprise segments, and invoices or contracts matched to deployment records.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
