company:
  name: Even Realities
chapter:
  number: 5
  title: Product & Technology
  summary: Even Realities has a differentiated camera-free, display-first smart-glasses proposition, with G2 hardware that appears materially improved over G1 and a phone-dependent software layer. Hands-on evidence supports useful translation and teleprompting workflows, but also identifies connectivity, navigation accuracy, voice recognition, software depth, and ecosystem risks that remain central to product maturity.
sections:
  - id: product-and-user-workflow
    title: Product definition and customer workflow
    body: >-
      Even Realities sells a display-first wearable rather than a camera-first capture device. The G2 presents monochrome information through a heads-up display, while a connected phone supplies much of the application and AI experience. Reported workflows include notifications, translation, navigation, teleprompting, conversation support, notes, and meeting context. TechCrunch describes the target audience as people in meetings, giving presentations, or traveling across languages; its hands-on review also found translation useful enough to follow conversations in Chinese, French, and Spanish. This points to a focused professional and traveler use case rather than a general entertainment headset. The product proposition is therefore strongest when glanceable text and discretion matter, and weaker when users expect autonomous, broad-based daily computing.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: hardware-and-architecture
    title: Hardware architecture and maturity
    body: >-
      The G2 architecture combines binocular Micro-LED waveguide optics, a lightweight frame, microphones, Bluetooth connectivity, a companion mobile application, and optional ring control. A current product report lists 640 × 350 pixels per eye, 1,200 nits, 60 Hz, a 27.5° field of view, 36 grams, IP65 protection, Bluetooth 5.4, iOS and Android compatibility, and a claimed 48-hour battery life. TechCrunch reports a 75% larger display area and 60 Hz refresh rate versus 20 Hz on G1, while the reviewer describes the G2 as comfortable but still heavily dependent on the phone. The architecture is consequently a distributed system: optics and input live on the wearable, while connectivity, application logic, and AI functions remain coupled to the phone and cloud-enabled services. That dependency is both an implementation requirement and a reliability surface.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-risk
    title: Differentiation, operating risks, and diligence verdict
    body: >-
      Camera-free design is the clearest differentiation. It reduces the social concern of outward recording and supports a privacy-oriented positioning, but it also removes camera-based multimodal capabilities that competitors use for capture and context. Independent hands-on evidence is mixed on maturity: connectivity improved after app updates, but early disconnections were severe; navigation showed directions but reportedly misidentified addresses; Even AI sometimes failed to activate or misheard speech outdoors; and notifications were not always reliable. A lower-reputation product analysis characterizes G1 as being superseded and flags long-term screwless-hinge durability and future software support as unresolved, so those points are diligence prompts rather than established failures. Even's parent also filed a 2026 design-patent complaint over ornamental frame designs; because the matter remains unadjudicated and the patents concern appearance rather than optics or AI, the filing shows enforcement activity but does not validate a technical moat. The product merits continued diligence for a premium niche, but public evidence does not yet establish software reliability, retention-driving ecosystem depth, long-term hardware durability, or a defensible developer platform.
    claimRefs: [CE009, CE010, CE011, CE012, CE015, CE016]
