figures:
  - id: FE001
    title: G2 product architecture map
    type: stack
    summary: The G2 experience spans display hardware, interaction, phone connectivity, and AI workflows, with the phone and software layers creating the main dependency surface.
    data:
      layers:
        - label: AI and workflow services
          detail: "User-facing assistance is delivered through the phone-connected software layer."
          items:
            - name: Translation
              detail: Real-time translation is displayed in the lens; source-reported language coverage is 31 languages for G2.
            - name: Conversate
              detail: Live transcript, prep notes, and contextual explainers are described in hands-on reporting.
            - name: Navigation and teleprompt
              detail: Turn-by-turn directions and presentation prompts are displayed to the wearer.
        - label: Phone and application
          detail: "The mobile application supplies setup, routing, and feature access."
          items:
            - name: Even app
              detail: The phone provides setup, feature access, route entry, and brightness adjustment.
            - name: Bluetooth link
              detail: The glasses rely heavily on phone connectivity; disconnections and notification reliability are reported risks.
        - label: Wearable interaction
          detail: "The glasses and optional ring provide touch and voice inputs."
          items:
            - name: Stem controls
              detail: Tapping and long-pressing the glasses opens dashboards and feature menus.
            - name: Even R1
              detail: Optional ring controller adds discreet touch input; independent review questioned its incremental value at $249.
        - label: Display hardware
          detail: "The glasses render information through binocular Micro-LED waveguide optics."
          items:
            - name: Binocular Micro-LED waveguide
              detail: Reported G2 specification is 640 × 350 pixels per eye, 1,200 nits, 60 Hz, and 27.5° field of view.
            - name: Lightweight frame
              detail: Reported weight is 35–36 grams depending on source; materials are described as magnesium and titanium alloys.
            - name: Microphones and battery
              detail: G2 is reported with four microphones and up to two days or 48 hours of battery life, with the latter not independently tested by the reviewer.
        - label: Audio and sensing
          detail: "Voice activation and environmental interaction depend on microphones and surrounding acoustic conditions."
          items:
            - name: Four microphones
              detail: TechCrunch reports four microphones on G2, compared with two on G1.
        - label: Power and charging
          detail: "Battery and charging-case performance determine whether the wearable can support all-day use."
          items:
            - name: Wireless charging case
              detail: A product report describes wireless charging and up to 48 hours of battery life; the reviewer did not independently test the two-day claim.
    claimRefs: [CE005, CE006, CE007, CE010, CE011, CE012]
callouts:
  - calloutType: strength
    title: Camera-free wedge
    body: The display-first, camera-free design is a concrete privacy and social-comfort differentiator for meetings, travel, and public use.
    claimRefs: [CE001, CE009]
  - calloutType: risk
    title: Phone and software dependency
    body: Connectivity failures, navigation inaccuracies, voice-recognition misses, and limited third-party software evidence make the software layer the key execution risk.
    claimRefs: [CE007, CE010, CE011, CE012]
  - calloutType: recommendation
    title: Diligence priority
    body: Validate field reliability, support burden, app retention, developer adoption, privacy controls, and long-term optical and hinge durability before underwriting scale.
    claimRefs: [CE010, CE011, CE012, CE015]
  - calloutType: insight
    title: Product verdict
    body: G2 has a coherent premium niche around discreet, camera-free, glanceable assistance, but its investment case depends on proving that phone-dependent software becomes reliable and habitual rather than merely demonstrable.
    claimRefs: [CE001, CE007, CE010, CE012]
