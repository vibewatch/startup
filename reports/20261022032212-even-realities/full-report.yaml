  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Even Realities sells a display-first wearable rather than a camera-first capture device. The G2 presents
              monochrome information through a heads-up display, while a connected phone supplies much of the
              application and AI experience. Reported workflows include notifications, translation, navigation,
              teleprompting, conversation support, notes, and meeting context. TechCrunch describes the target audience
              as people in meetings, giving presentations, or traveling across languages; its hands-on review also found
              translation useful enough to follow conversations in Chinese, French, and Spanish. This points to a
              focused professional and traveler use case rather than a general entertainment headset. The product
              proposition is therefore strongest when glanceable text and discretion matter, and weaker when users
              expect autonomous, broad-based daily computing.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE009
              - CE012
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE010
              - CE011
      - number: '5.2'
        title: Hardware architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The G2 architecture combines binocular Micro-LED waveguide optics, a lightweight frame, microphones,
              Bluetooth connectivity, a companion mobile application, and optional ring control. A current product
              report lists 640 × 350 pixels per eye, 1,200 nits, 60 Hz, a 27.5° field of view, 36 grams, IP65
              protection, Bluetooth 5.4, iOS and Android compatibility, and a claimed 48-hour battery life. TechCrunch
              reports a 75% larger display area and 60 Hz refresh rate versus 20 Hz on G1, while the reviewer describes
              the G2 as comfortable but still heavily dependent on the phone. The architecture is consequently a
              distributed system: optics and input live on the wearable, while connectivity, application logic, and AI
              functions remain coupled to the phone and cloud-enabled services. That dependency is both an
              implementation requirement and a reliability surface.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE007
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE011
              - CE012
      - number: '5.3'
        title: Differentiation, operating risks, and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Camera-free design is the clearest differentiation. It reduces the social concern of outward recording and
              supports a privacy-oriented positioning, but it also removes camera-based multimodal capabilities that
              competitors use for capture and context. Independent hands-on evidence is mixed on maturity: connectivity
              improved after app updates, but early disconnections were severe; navigation showed directions but
              reportedly misidentified addresses; Even AI sometimes failed to activate or misheard speech outdoors; and
              notifications were not always reliable. A lower-reputation product analysis characterizes G1 as being
              superseded and flags long-term screwless-hinge durability and future software support as unresolved, so
              those points are diligence prompts rather than established failures. Even's parent also filed a 2026
              design-patent complaint over ornamental frame designs; because the matter remains unadjudicated and the
              patents concern appearance rather than optics or AI, the filing shows enforcement activity but does not
              validate a technical moat. The product merits continued diligence for a premium niche, but public evidence
              does not yet establish software reliability, retention-driving ecosystem depth, long-term hardware
              durability, or a defensible developer platform.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Camera-free wedge
            body: >-
              The display-first, camera-free design is a concrete privacy and social-comfort differentiator for
              meetings, travel, and public use.
            calloutType: strength
            claimRefs:
              - CE001
              - CE009
          - type: callout
            title: Phone and software dependency
            body: >-
              Connectivity failures, navigation inaccuracies, voice-recognition misses, and limited third-party software
              evidence make the software layer the key execution risk.
            calloutType: risk
            claimRefs:
              - CE007
              - CE010
              - CE011
              - CE012
          - type: callout
            title: Diligence priority
            body: >-
              Validate field reliability, support burden, app retention, developer adoption, privacy controls, and
              long-term optical and hinge durability before underwriting scale.
            calloutType: recommendation
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE015
          - type: callout
            title: Product verdict
            body: >-
              G2 has a coherent premium niche around discreet, camera-free, glanceable assistance, but its investment
              case depends on proving that phone-dependent software becomes reliable and habitual rather than merely
              demonstrable.
            calloutType: insight
            claimRefs:
              - CE001
              - CE007
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segmentation
        blocks:
          - type: paragraph
            body: >-
              The clearest public segmentation comes from reporting on a company survey rather than audited customer
              records. Business Model Analyst says most buyers are male professionals aged 30-50 and about one-third are
              company executives, while The Next Web says more than half of users are in the United States, followed by
              Japan, South Korea, the Middle East, and Europe. The same reporting places the entry frame price at $599
              and a typical configured order near $1,000 once prescription lenses or the R1 ring are added. This
              supports a premium individual-professional wedge, not a demonstrated enterprise sales motion. None of the
              retained sources identifies a paying organization, procurement owner, contract size, or channel
              contribution, so enterprise and partner-led segments remain unverified rather than assumed.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.2'
        title: Adoption and workflow proof
        blocks:
          - type: paragraph
            body: >-
              The strongest scale indicator is third-party reporting of Even's claim that it was the first company in
              its category to sell more than 10,000 pairs. That is a cumulative shipment or sales claim, not an
              active-user, repeat-purchase, or G2 installed-base measure. Hands-on evidence is more concrete at the
              workflow level: VR Expert reports a short setup, reliable teleprompter use, usable translation across six
              tested languages with a brief delay, and a full working day of battery life. i-SCOOP separately reports
              support for 22 languages. Even Hub and Prep Notes broaden the adoption surface for existing G2 owners, but
              the platform's installed base, app count, and named developer roster were still undisclosed in the
              retained April 2026 source. The journey therefore maps demonstrated interactions, not a measured
              conversion funnel.
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public customer proof is not sufficient to underwrite durability. The named organizations in the retained
              evidence are reviewers or publishers, not verified paying customers, and the positive CES snippets on
              NBKomputer are aggregated awareness evidence rather than longitudinal usage. VR Expert also encountered a
              practical deployment constraint: its non-prescription test unit was harder to read, implying that fit and
              lens configuration can add onboarding friction. No source discloses NRR, GRR, churn, renewals, returns,
              cohort behavior, satisfaction, top-customer exposure, reseller mix, or enterprise conversion. A separate
              legal report describes Even's parent pursuing a design-patent case that disrupted a rival's crowdfunding
              campaign; that event may shape the competitive channel but does not prove demand for Even products.
              Private cohort, order, return, and channel data are therefore required before treating the initial premium
              wedge as durable.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer durability is a private-data diligence item
            body: >-
              More than 10,000 reported pair sales and favorable hands-on reviews establish initial demand and utility,
              but they do not establish active use, renewal, returns, enterprise conversion, or concentration.
            calloutType: risk
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU008
              - CU009
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and decision frame
        blocks:
          - type: paragraph
            body: >-
              Even Realities has chosen a focused product architecture: a display-first wearable without cameras or
              integrated speakers. That choice can reduce camera-related social friction, but it also makes dependable
              text, transcription, translation, connectivity, and input controls central to the value proposition.
              Independent reviews identify weaknesses in noisy speech capture, AI consistency, controls, and network
              dependence, while the assigned evidence does not quantify return rates, active use, support burden, or
              reliability by environment. The financing context raises the diligence bar rather than resolving those
              risks. Two reports describe a $150 million pre-Series B round at a $1 billion valuation, yet the pool
              contains no audited revenue, gross margin, burn, runway, or retention evidence. Product reliability and
              private operating economics therefore remain the highest-priority underwriting risks.
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR010
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR016
      - number: '7.2'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The clearest current legal event is a design-patent complaint that Metaverse Watcher says Shenzhen Yiwen
              Tech Limited, described as Even Realities' corporate parent, filed against XGIMI-linked defendants in the
              Eastern District of New York on August 24, 2026. The account says two U.S. design patents had issued on
              August 11 and that the matter remained open and unadjudicated on the merits; it also reports suspension of
              the MemoMind One Kickstarter campaign before Kickstarter was dismissed from the case. Those facts show
              that design disputes can interrupt a launch channel, but they do not establish patent validity,
              infringement, damages, or Even Realities' net exposure. Privacy is the more pervasive unresolved risk:
              removing cameras does not remove consent, retention, transfer, and workplace-policy questions created by
              microphones, transcription, translation, and cloud-connected AI.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              The product evidence is favorable on form factor but mixed on the software and capture layer. Dymesty
              reports that current smart functions require both Bluetooth and internet connectivity and that translation
              became less reliable with quiet, distant, or background-noise-heavy speech. Popular Mechanics likewise
              reports transcription difficulty in noisier environments, inconsistent AI, and awkward controls. Mashable
              observed that Conversate did not work properly during a short CES demo, while appropriately noting that
              showroom Wi-Fi could have contributed. These observations are not a measured fleet-wide defect rate, but
              they identify failure modes that directly affect professional meetings and live translation. Security
              cannot be inferred from the absence of a camera or from the lack of a recorded incident in this pool;
              data-flow, subprocessor, retention, incident-response, and firmware controls require direct diligence.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: Partner, supply, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Even Realities depends on a connected ecosystem that extends beyond the glasses. Phone, Bluetooth,
              internet, cloud or model services, and input through the frame or optional R1 ring can each affect task
              completion. Two reviews place the G2 starting price near $599 and the ring at about $249-$250, so the
              product must justify a premium purchase before prescription and accessory costs. Business Model Analyst
              further reports manufacturing in China while selling primarily in the United States and other overseas
              markets, creating exposure to logistics, tariffs, export controls, and geopolitical disruption; the source
              does not quantify supplier concentration or buffers. The same article repeats a company profitability
              claim, but no audited accounts are available in the assigned evidence. Funding raised must not be treated
              as cash available after inventory, working capital, legal costs, and expansion.
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR013
              - CR015
      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity is only partly visible. Camera-free hardware addresses one class of recording concern,
              and the CEO says user data is encrypted and infrastructure is designed for European privacy standards, but
              those company claims need architecture and control evidence. Legal monitoring should cover the primary
              docket, injunction activity, claim construction, settlement, counterclaims, and any redesign. Product
              monitoring should segment failed transcription and translation sessions by noise, distance, language,
              network condition, and firmware version, then reconcile those results to support contacts and returns.
              Commercial monitoring should separate shipments from activated and retained users and track gross margin,
              inventory turns, accessory attach, refunds, and cash runway. Persistent core-feature failure in ordinary
              professional settings is a thesis-break signal; an adverse legal remedy or inability to substantiate
              privacy and economics would also require immediate re-underwriting.
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
              - CR015
              - CR016
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: A live case is not an adverse merits finding
            body: >-
              The reported design-patent filing and campaign interruption justify primary-docket diligence, but the
              assigned evidence does not establish validity, infringement, damages, or a final commercial outcome.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: Gate scale underwriting on reliability and private economics
            body: >-
              Require controlled failure-rate data and audited unit economics that distinguish shipped units, activated
              users, retained use, returns, accessory attach, gross margin, inventory, burn, and runway.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is a focused hardware position in camera-free, display-first smart glasses.
              Independent coverage describes a $599 G2, a companion ring, and a professional user segment that may value
              discretion and privacy over camera-based capture. The reported July 2026 financing supplies strategic
              capital from Meituan and Tencent and gives the company room to expand product and operations. The
              anti-thesis is equally material: the $1 billion mark is not tied in public sources to audited revenue or
              margin, Meta and Snap have materially greater distribution, and a premium accessory-led order value can be
              pressured by lower-priced rivals. The corporate parent's patent-enforcement action against XGIMI-linked
              defendants also shows that a narrow design space can create legal cost and outcome uncertainty; the
              retained report says the case was still open and unadjudicated. The evidence therefore supports a
              differentiated product thesis, not a price-insensitive buy decision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Pulse2 and other coverage report a $150 million pre-Series B at a $1 billion valuation, while Business
              Model Analyst reports a $599 base price and $200 to $300 of prescription-lens or ring additions that can
              push an order toward $1,000. These figures are not interchangeable: the round valuation is an investor
              mark, and average order value is neither revenue nor ARR. Public material does not establish the round's
              liquidation preferences, option-pool treatment, ownership dilution, debt, cash balance, burn, or runway.
              Entry discipline should therefore be based on verified forward revenue and gross margin rather than a
              headline valuation multiple. Until those inputs are supplied, a precise target price is unsupported.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case is a durable premium category in which camera-free privacy and display utility support
              repeatable demand, developer adoption, and a sustained roughly $1,000 basket. The base case is a credible
              niche product with strategic investors but insufficient public disclosure to prove that the current mark
              is supported by scale. The bear case combines price compression, stronger platform competition, weak
              software retention, manufacturing or cross-border friction, and legal cost or outcome uncertainty from the
              parent's patent-enforcement action. Because the company is private and the public record lacks audited
              operating KPIs, exit readiness is not demonstrated. The decision should move toward buy only after audited
              or board-grade financials, cohort retention, cap-table terms, supply and warranty data, and the patent
              case status are reviewed.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV011
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Research-more: Even Realities merits continued diligence, but public evidence does not justify paying
              through the reported $1 billion valuation without private financial and term verification.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV011
          - type: callout
            title: Price-sensitive risk
            body: >-
              The key unresolved question is not whether the company has differentiated hardware; it is whether
              undisclosed revenue quality, gross margin, retention, and financing terms can support the mark after
              platform competition and litigation exposure are priced in.
            calloutType: risk
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV009
              - CV012
