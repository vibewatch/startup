      - number: '4.3'
        title: Financing improves capacity without proving runway
        blocks:
          - type: paragraph
            body: >-
              SiliconANGLE and The Next Web independently report a $150 million financing at a $1 billion valuation, led
              by Meituan with Tencent participating; this is financing raised, not cash currently available after fees,
              prior spending, or restrictions. Business Model Analyst reports that the company says it is profitable,
              but that assertion is unaudited in the assigned evidence and does not disclose contribution margin,
              operating expenses, working capital, inventory commitments, or cash conversion. The hardware model carries
              optical, manufacturing, quality, logistics, warranty, and support costs, while the company sells
              internationally and manufactures in China according to The Next Web. Public evidence does not identify
              debt, credit facilities, project finance, supplier financing, cash balance, burn rate, runway, or the
              next-round trigger. Capital adequacy therefore cannot be inferred from the financing headline or the
              reported profitability claim.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: 'Financial verdict: promising price architecture, incomplete proof'
        blocks:
          - type: paragraph
            body: >-
              The financial case has a coherent but unproven shape: a premium display-glasses product, accessory and
              prescription attach, reported early unit traction, and a large financing event that can fund product and
              market expansion. It is not yet possible to underwrite revenue quality or margin durability from the
              public record. A roughly $1,000 order can coexist with weak gross margin if optics, prescription
              fulfillment, returns, warranty, logistics, or channel costs consume the ticket; conversely, a reported
              profitable operation could be attractive if confirmed with audited statements and inventory data. The main
              adverse signal is valuation sensitivity: a $1 billion valuation against an undisclosed revenue base and
              only a reported 10,000-plus-unit category milestone leaves substantial future execution priced in. The
              next diligence step is a monthly management pack tying orders to recognized revenue, contribution margin,
              cash burn, inventory turns, refunds, and cohort retention.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
