  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category split
        blocks:
          - type: paragraph
            body: >-
              The relevant market is everyday smart glasses that place information in the wearer’s field of view,
              including optical display, translation, navigation, prompts, and a companion control surface. It excludes
              immersive headsets and should be separated from camera-first glasses whose core value includes capture and
              visual AI. The evidence describes the category as splitting into camera-and-AI products and camera-free
              display products rather than treating them as a single homogeneous product. Even’s G2 therefore competes
              for buyers who value discreet information access, ordinary-eyewear form factor, and lower social friction.
              Camera removal is a product boundary, not proof that the company owns the broader market: it also removes
              visual-AI use cases such as looking at landmarks or capturing images. The explicit status-quo substitute
              is using a smartphone for notifications, translation, and navigation, or simply not adopting an ambient-
              computing device; the retained sources do not quantify spend displaced from that behavior.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and adoption signals
        blocks:
          - type: paragraph
            body: >-
              Available market numbers are directional rather than a clean TAM/SAM/SOM. Tech Funding News reports a
              Grand View Research expectation that the global smart-glasses market will exceed $3 billion in 2026 and
              grow at 24% annually through 2033; that is a category-level estimate, not an Even-specific serviceable
              market. The same report cites IDC’s 167% year- over-year increase in shipments of display-free smart
              glasses in early 2026, which is an adoption signal but does not disclose the base, geography, or Even’s
              share. Company and trade reporting supplies a second lens: Even says it passed 10,000 pairs and prices the
              G2 from $599, with prescription lenses and the R1 ring taking average orders near $1,000. These figures
              show a premium monetization hypothesis, not revenue or market share. A defensible SAM would require the
              publisher methodologies, addressable geographies, channel economics, repeat/accessory behavior, and
              verified Even unit volumes.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
