  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Core-feature reliability and privacy assurance have the highest residual exposure because both are central to use
      and lack controlled public evidence.
    data:
      columns:
        - High impact
        - Medium impact
        - Lower impact
      rows:
        - label: Higher observed likelihood
          values:
            - displayValue: Noisy-setting transcription failure
              detail: Two independent reviews identify capture degradation in noisy or difficult acoustic settings.
            - displayValue: Connected-service dependence
              detail: Current functions are reported to require phone and internet connectivity.
            - displayValue: Control friction
              detail: Review evidence identifies awkward controls and an optional paid ring.
        - label: Medium observed likelihood
          values:
            - displayValue: Privacy and consent exposure
              detail: Microphones and cloud-connected AI remain relevant even without a camera.
            - displayValue: AI inconsistency
              detail: Reviewers report failed or inconsistent Conversate and AI behavior.
            - displayValue: Premium-price resistance
              detail: The starting price is about $599 before prescription and accessory additions.
        - label: Outcome unknown
          values:
            - displayValue: Adverse legal remedy
              detail: The design-patent case is reported as open and unadjudicated.
            - displayValue: Cross-border disruption
              detail: China manufacturing and overseas sales create exposure without disclosed buffers.
            - displayValue: Accessory support burden
              detail: Attach, pairing, charging, and support metrics are unavailable.
        - label: Evidence unavailable
          values:
            - displayValue: Security or incident-control failure
              detail: Architecture, subprocessors, incidents, and recovery evidence are not in the pool.
            - displayValue: Cash-runway compression
              detail: The financing amount does not disclose cash, burn, inventory, or working-capital needs.
            - displayValue: Certification gap
              detail: Market-specific certifications and product-safety records were not available in the pool.
        - label: Monitoring trigger
          values:
            - displayValue: Persistent core-feature failure
              detail: Repeated ordinary-setting failures would undermine repeat-use assumptions.
            - displayValue: Docket escalation
              detail: An injunction, counterclaim, settlement, or redesign could change legal exposure.
            - displayValue: Support and return increase
              detail: A rising burden would test product quality and premium economics.
        - label: Mitigation evidence
          values:
            - displayValue: Independent control validation
              detail: Security, privacy, reliability, and financial diligence can reduce uncertainty.
            - displayValue: Offline and provider redundancy
              detail: Fallback architecture could reduce connected-service exposure.
            - displayValue: Cohort reporting
              detail: Activated use, retention, returns, and margin can test adoption quality.
    approximationNotes: >-
      Qualitative analyst placement only; no probability, incident-rate, or benchmark denominator is available in the
      assigned evidence.
    claimRefs:
      - CR002
      - CR006
      - CR008
      - CR009
      - CR010
      - CR012
      - CR013
      - CR016
