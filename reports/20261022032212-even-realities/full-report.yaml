  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and category boundaries
        blocks:
          - type: paragraph
            body: >-
              Even Realities is best understood as a display-first smart-glasses company. G2 omits a camera and
              speakers, uses an in-lens display, and pairs with the R1 ring; reporting and hands-on testing describe
              navigation, translation, notifications and teleprompting as core jobs. Meta and Snap represent the
              camera-led incumbent path, while XREAL and Viture are identified as display-only peers and XGIMI-linked
              MemoMind is a direct camera-free design challenger. Phones, smartwatches, translation apps and
              conventional teleprompters remain status-quo substitutes for individual jobs, although they do not
              reproduce the same hands-free eyewear experience. Google is a plausible entrant named in industry
              coverage, while the assigned evidence does not establish that buyers pursue a credible internal-build
              alternative.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP012
