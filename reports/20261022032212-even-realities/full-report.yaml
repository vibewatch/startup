  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization is premium hardware plus attach
        blocks:
          - type: paragraph
            body: >-
              Even Realities appears to monetize through direct hardware sales rather than a disclosed recurring
              software subscription. SiliconANGLE reports a $599 Even G2 base price and describes the optional Even R1
              ring, while The Next Web reports that prescription lenses and the ring can push a typical order near
              $1,000. These are list or reported order values, not recognized revenue, gross profit, or lifetime value.
              The model therefore depends on conversion at a premium price, accessory and prescription attachment, and
              sufficient optical and service quality to support returns and repeat demand. Public sources do not
              disclose realized pricing, discounting, refund rates, warranty costs, software revenue, or the share of
              orders carrying accessories, so the table separates observable pricing from unknown monetization quality.
            claimRefs:
