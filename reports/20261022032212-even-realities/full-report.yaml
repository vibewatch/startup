      - number: '4.2'
        title: Traction is visible, but sales efficiency is not
        blocks:
          - type: paragraph
            body: >-
              The available evidence indicates early commercial traction rather than a complete operating scorecard. The
              Next Web says Even reported being first in its category to sell more than 10,000 pairs, and both The Next
              Web and Business Model Analyst describe growth from roughly 40 staff to several hundred; those are
              reported company figures, not audited customer or revenue disclosures. More than half of users are
              reported to be in the United States and roughly one-third to be executives, which suggests an
              early-adopter mix but does not establish retention, channel efficiency, or a repeatable sales funnel. No
              source in the assigned pool provides CAC, payback, sales-cycle duration, channel take rate, cohort
              retention, active-user denominator, or revenue by geography. Underwriting should consequently treat unit
              count and customer mix as directional evidence, not as a substitute for cohort-level economics.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
