            claimRefs:
              - CP003
              - CP007
              - CP009
              - CP013
              - CP014
      - number: '3.3'
        title: Switching costs, moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The moat case rests on integrated optics, industrial design, privacy positioning and a growing
              software-control experience rather than on a disclosed network effect. Prescription support, the R1 ring
              and repeated use of translation or teleprompting can create workflow familiarity, but the assigned
              evidence does not establish retention, proprietary distribution, developer scale, recurring software
              economics or enterprise fleet lock-in. Competitive pressure is tangible: lower-priced incumbents can reset
              buyer expectations, display-only peers can contest the utility proposition, and a design-patent complaint
              against XGIMI-linked MemoMind defendants shows how quickly a sparse camera-free concept can attract close
              alternatives. The complaint remains unadjudicated, so it is evidence of competition and IP enforcement
              activity rather than proof of infringement. Durability therefore depends on private cohort, channel and
              economics evidence that is not public.
            claimRefs:
              - CP005
              - CP008
              - CP010
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: A differentiated wedge exists
            body: >-
              Even's camera-free, display-first design addresses trust and discretion concerns that camera-led products
              make harder to solve, while independent hands-on evidence supports useful translation and teleprompting.
            calloutType: strength
            claimRefs:
              - CP001
              - CP006
              - CP011
          - type: callout
            title: The wedge is not yet a durable moat
            body: >-
              Assigned evidence does not establish retention, lock-in, developer scale, recurring software economics or
              a sustained price premium, and it records both feature reliability limits and direct design competition.
            calloutType: risk
            claimRefs:
