    title: Recommendation logic
    type: flow
    summary: >-
      Differentiated product and strategic financing support continued diligence, while missing private economics and
      competitive/legal risks keep the call at research-more.
    data:
      nodes:
        - id: scale
          label: Product proof
          detail: Camera-free G2, display utility, and reported premium pricing
        - id: capital
          label: Strategic financing
          detail: $150M reported pre-Series B at $1B valuation
        - id: risks
          label: Unresolved underwriting risks
          detail: No public audited economics, platform competition, and unresolved patent-enforcement action
        - id: terms
          label: Terms still needed
          detail: Cap table, preferences, dilution, cash, burn, and retention
        - id: exit
          label: Exit readiness
          detail: Not demonstrated while audited scale and durable retention remain undisclosed
        - id: decision
          label: Research-more
          detail: Require private KPI, cap-table, preference, and litigation diligence before entry
      edges:
        - - scale
          - capital
        - - capital
          - risks
        - - risks
          - terms
        - - terms
          - exit
        - - exit
          - decision
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV009
      - CV011
