              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Buyers, drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The observed buyer wedge is professionals who want glanceable information without pulling out a phone or
              wearing a camera. Trade reporting describes most customers as male professionals aged 30–50 and says an
              internal survey found about one-third were company executives; those are company-reported segmentation
              signals, not independently sampled market shares. Use cases include translation, navigation,
              teleprompting, conversation summaries, and monitoring coding agents. The budget owner is therefore usually
              an individual consumer or professional, with a possible employer-sponsored path that is not yet an
              enterprise deployment program. Adoption drivers are privacy/social comfort, low- profile eyewear, optical
              quality, and useful repeated workflows. Constraints are premium price, accessory dependence, uncertain
              retention after novelty, limited camera-based functionality, privacy questions around microphones and
              transcription, and competition from Meta and Snap distribution. The pending patent dispute is also a
              market-friction signal: a narrow visual-design lane can create litigation and crowdfunding disruption
              before a court decides the merits.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is a wedge, not the headline category
            body: >-
              The strongest evidence supports a premium camera-free display-glasses niche with real demand signals,
              while the broad smart-glasses market estimate should not be presented as Even’s attainable market.
            calloutType: insight
            claimRefs:
