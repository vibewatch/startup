      - number: '3.2'
        title: Capability, price and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiation is a bundle rather than one isolated feature: discreet eyewear, a
              camera-free social posture, a text-centric optical display and ring-based control. Independent hands-on
              evidence supports useful live translation and teleprompting, but also records that Conversate failed
              during one short demo and that navigation was not compatible with Google Maps at the test date. G2's
              documented starting price was $599, versus a reported $299 Meta price point; those are starting prices
              rather than realized order values or margins, and the products are not feature-for- feature equivalents.
              Meta and Snap also bring distribution and ecosystem advantages that Even cannot match directly. The result
              is a focused premium proposition with meaningful trust appeal but material exposure to incumbent price
              compression, feature catch-up and easier consumer access.
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP013
