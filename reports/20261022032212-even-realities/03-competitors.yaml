  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: competitor-profile
      missingEvidence: Comparable competitor shipment, retention, developer, gross-margin and distribution data across Meta, Snap, XREAL and Viture.
      whyItMatters: Without comparable scale and economics, Even's relative position and moat durability cannot be underwritten quantitatively.
      diligencePath: Obtain vendor disclosures, channel checks, app-usage signals and independent market data using a common period and metric definition.
      relatedQuestionRefs: [QP006, QP009]
      relatedTableRefs: [TP001]
    - type: missing-source
      severity: material
      topic: switching-costs
      missingEvidence: Cohort retention, feature adoption, prescription repeat rates and evidence of workflow lock-in.
      whyItMatters: A camera-free wedge can attract trial without creating durable switching costs or recurring value.
      diligencePath: Request cohort data by use case, return rates, repeat purchase data and enterprise or power-user references.
      relatedQuestionRefs: [QP007, QP009]
    - type: missing-source
      severity: minor
      topic: internal-build
      missingEvidence: Buyer-specific evidence on whether internal hardware or custom workflow software is a practical substitute for G2.
      whyItMatters: The competitive set is incomplete if enterprise buyers can solve the same job internally at lower switching cost.
      diligencePath: Interview enterprise prospects and integrators about build-versus-buy decisions, required optics hardware and deployment cost.
      relatedQuestionRefs: [QP010]
    - type: conflicting-data
      severity: minor
      topic: legal-competition
