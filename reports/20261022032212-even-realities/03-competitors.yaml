    claimRefs: [CP001, CP004, CP005, CP012, CP013]
callouts:
  - calloutType: strength
    title: A differentiated wedge exists
    body: Even's camera-free, display-first design addresses trust and discretion concerns that camera-led products make harder to solve, while independent hands-on evidence supports useful translation and teleprompting.
    claimRefs: [CP001, CP006, CP011]
  - calloutType: risk
    title: The wedge is not yet a durable moat
    body: Assigned evidence does not establish retention, lock-in, developer scale, recurring software economics or a sustained price premium, and it records both feature reliability limits and direct design competition.
    claimRefs: [CP008, CP010, CP012, CP014]
