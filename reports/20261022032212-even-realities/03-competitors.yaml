chapter:
  number: 3
  title: Competitors
  summary: Even Realities occupies a premium, camera-free display-glasses niche rather than competing head-on for camera-led capture and social distribution. The wedge is credible for privacy-sensitive professional use, but available evidence does not establish durable scale, lock-in, or price power against better-distributed incumbents and fast-following display-glasses peers.
sections:
  - id: landscape
    title: Competitive landscape and category boundaries
    body: >-
      Even Realities is best understood as a display-first smart-glasses company.
      G2 omits a camera and speakers, uses an in-lens display, and pairs with the
      R1 ring; reporting and hands-on testing describe navigation, translation,
      notifications and teleprompting as core jobs. Meta and Snap represent the
      camera-led incumbent path, while XREAL and Viture are identified as
      display-only peers and XGIMI-linked MemoMind is a direct camera-free design
      challenger. Phones, smartwatches, translation apps and conventional
      teleprompters remain status-quo substitutes for individual jobs, although
      they do not reproduce the same hands-free eyewear experience. Google is a
      plausible entrant named in industry coverage, while the assigned evidence
      does not establish that buyers pursue a credible internal-build alternative.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP012, CP015, CP016]
    tableRefs: [TP001]
  - id: differentiation
    title: Capability, price and distribution comparison
    body: >-
      The strongest differentiation is a bundle rather than one isolated feature:
      discreet eyewear, a camera-free social posture, a text-centric optical
      display and ring-based control. Independent hands-on evidence supports
      useful live translation and teleprompting, but also records that Conversate
      failed during one short demo and that navigation was not compatible with
      Google Maps at the test date. G2's documented starting price was $599,
      versus a reported $299 Meta price point; those are starting prices rather
      than realized order values or margins, and the products are not feature-for-
      feature equivalents. Meta and Snap also bring distribution and ecosystem
      advantages that Even cannot match directly. The result is a focused premium
      proposition with meaningful trust appeal but material exposure to incumbent
      price compression, feature catch-up and easier consumer access.
    claimRefs: [CP002, CP003, CP006, CP007, CP008, CP009, CP011, CP013, CP014]
    tableRefs: [TP002, TP003]
  - id: durability
    title: Switching costs, moat durability and adverse evidence
    body: >-
      The moat case rests on integrated optics, industrial design, privacy
      positioning and a growing software-control experience rather than on a
      disclosed network effect. Prescription support, the R1 ring and repeated use
      of translation or teleprompting can create workflow familiarity, but the
      assigned evidence does not establish retention, proprietary distribution,
      developer scale, recurring software economics or enterprise fleet lock-in.
      Competitive pressure is tangible: lower-priced incumbents can reset buyer
      expectations, display-only peers can contest the utility proposition, and a
      design-patent complaint against XGIMI-linked MemoMind defendants shows how
      quickly a sparse camera-free concept can attract close alternatives. The
      complaint remains unadjudicated, so it is evidence of competition and IP
      enforcement activity rather than proof of infringement. Durability therefore
      depends on private cohort, channel and economics evidence that is not public.
    claimRefs: [CP005, CP008, CP010, CP012, CP013, CP014]
    figureRefs: [FP001]
