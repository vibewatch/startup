company:
  name: Even Realities
chapter:
  number: 8
  title: Valuation
  summary: "Even Realities has credible product differentiation and a reported $1 billion valuation after a $150 million pre-Series B, but public evidence does not disclose the revenue, margin, retention, cap-table, or preference data needed to underwrite that price. The appropriate stance is research-more: preserve exposure to a privacy-led display-glasses thesis while requiring private financial and term verification before entry."
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The investable thesis is a focused hardware position in camera-free, display-first
      smart glasses. Independent coverage describes a $599 G2, a companion ring, and a
      professional user segment that may value discretion and privacy over camera-based
      capture. The reported July 2026 financing supplies strategic capital from Meituan
      and Tencent and gives the company room to expand product and operations. The
      anti-thesis is equally material: the $1 billion mark is not tied in public sources
      to audited revenue or margin, Meta and Snap have materially greater distribution,
      and a premium accessory-led order value can be pressured by lower-priced rivals.
      The corporate parent's patent-enforcement action against XGIMI-linked defendants
      also shows that a narrow design space can create legal cost and outcome uncertainty;
      the retained report says the case was still open and unadjudicated. The evidence
      therefore supports a differentiated product thesis, not a price-insensitive buy
      decision.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001, TV002]
  - id: price-and-financing
    title: Financing context and entry discipline
    body: >-
      Pulse2 and other coverage report a $150 million pre-Series B at a $1 billion
      valuation, while Business Model Analyst reports a $599 base price and $200 to $300
      of prescription-lens or ring additions that can push an order toward $1,000. These
      figures are not interchangeable: the round valuation is an investor mark, and
      average order value is neither revenue nor ARR. Public material does not establish
      the round's liquidation preferences, option-pool treatment, ownership dilution,
      debt, cash balance, burn, or runway. Entry discipline should therefore be based on
      verified forward revenue and gross margin rather than a headline valuation
      multiple. Until those inputs are supplied, a precise target price is unsupported.
    claimRefs: [CV001, CV007, CV008, CV009, CV010]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence asks
    body: >-
      The bull case is a durable premium category in which camera-free privacy and
      display utility support repeatable demand, developer adoption, and a sustained
      roughly $1,000 basket. The base case is a credible niche product with strategic
      investors but insufficient public disclosure to prove that the current mark is
      supported by scale. The bear case combines price compression, stronger platform
      competition, weak software retention, manufacturing or cross-border friction, and
      legal cost or outcome uncertainty from the parent's patent-enforcement action.
      Because the company is private and the public record lacks audited operating KPIs,
      exit readiness is not demonstrated. The decision should move toward buy only after
      audited or board-grade financials, cohort retention, cap-table terms, supply and
      warranty data, and the patent case status are reviewed.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
