    rows:
      - [Recommendation, "Research-more", "Keep on active diligence list; do not underwrite entry from the headline round alone."]
      - [Confidence, "Medium", "Product and financing facts are reported, but private economics and terms are not public."]
      - [Risk rating, "High", "Premium hardware, platform competition, cross-border exposure, and unaudited economics remain material."]
      - [Valuation stance, "Stretched", "A $1 billion mark is reported, but public evidence does not support a revenue or margin multiple."]
    notes: "Public reporting and company-facing material are mixed with unavailable private-company economics; null or undisclosed financial inputs are not treated as zero."
    claimRefs: [CV001, CV003, CV009, CV011]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Privacy-led differentiation", "Camera-free display glasses and a ring target discreet everyday use.", "Evidence of weak user retention or rapid camera-free feature parity from larger platforms."]
      - ["Premium pricing can support economics", "Reported G2 price is $599 and some coverage reports an approximately $1,000 average order.", "Audited gross margin, returns, warranty costs, and repeat purchase data below underwriting thresholds."]
      - ["Strategic financing validates category interest", "Reported $150 million pre-Series B led by Meituan and Tencent at $1 billion.", "Round terms, dilution, or subsequent financing showing the mark was not durable."]
      - ["Narrow category creates legal cost and competitive risk", "Even Realities' parent is enforcing design patents against XGIMI-linked defendants, and the reported case remains unresolved.", "Primary docket review, resolution clarity, and verified patent strength establish whether the action protects a moat or consumes resources."]
    notes: "Arguments distinguish reported financing and product facts from investor interpretation; the litigation source describes allegations and procedural facts, not an infringement finding."
    claimRefs: [CV001, CV004, CV005, CV006, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Premium camera-free segment scales; developer ecosystem and repeat demand improve; order value remains near reported ~$1,000.", "A verified revenue and margin profile could justify a higher mark than the reported $1 billion.", "Low-to-medium; requires private KPI verification.", "Order value falls, retention is weak, or platform rivals erase differentiation."]
      - [Base, "Product remains a credible niche with strategic capital, but public financial disclosure stays incomplete.", "Hold research-more; no defensible public multiple or target return.", "Highest on current evidence.", "Management cannot provide audited/board-grade revenue, margin, burn, runway, and cap-table terms."]
      - [Bear, "Price compression, supply or cross-border friction, software underuse, and IP-enforcement or commercialization setbacks compound.", "Downside is substantial because the current mark embeds future scale that is not publicly demonstrated.", "Material; supported by disclosed competitive and legal uncertainties.", "Lower-priced alternatives reset category pricing or the patent action consumes material resources without strengthening the moat."]
    notes: "Scenarios are decision cases, not probability-weighted forecasts; no numeric valuation range is fabricated because revenue, margin, retention, ownership, and preference inputs are undisclosed."
    claimRefs: [CV003, CV005, CV006, CV011, CV012, CV013, CV014, CV015]
