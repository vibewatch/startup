callouts:
  - calloutType: recommendation
    title: Recommendation
    body: "Research-more: Even Realities merits continued diligence, but public evidence does not justify paying through the reported $1 billion valuation without private financial and term verification."
    claimRefs: [CV001, CV009, CV011]
  - calloutType: risk
    title: Price-sensitive risk
    body: "The key unresolved question is not whether the company has differentiated hardware; it is whether undisclosed revenue quality, gross margin, retention, and financing terms can support the mark after platform competition and litigation exposure are priced in."
