companyProfile:
  summary: >-
    Even Realities is a Shenzhen-headquartered smart-glasses company founded in 2023 by former Apple and luxury-eyewear
    engineers. Its camera-free, display-first Even G2 pairs with an Even R1 ring for discreet interaction and has
    attracted reported strategic financing, while the public record does not yet establish audited operating economics
    or complete governance details.
