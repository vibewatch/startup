evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or board-grade revenue, gross margin, cash balance, burn, runway, unit economics, and retention data.
    whyItMatters: >-
      The reported valuation and profitability claim cannot be assessed against cash generation, durability, or return
      potential without operating statements.
    diligencePath: >-
      Request audited statements, monthly management accounts, cohort data, bank or debt schedules, and a bridge from
      units sold to recognized revenue.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete legal-entity leadership, board, and governance roster with responsibilities and succession coverage.
    whyItMatters: Founder-centric reporting leaves key-person dependence and decision rights unresolved.
    diligencePath: >-
      Obtain the cap table, board minutes or composition, executive organization chart, employment terms, and succession
      plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: Reconciled unit, customer, headcount, and geography definitions for the reported commercial scale.
    whyItMatters: Pairs sold, users, customers, and staff are different denominators; conflating them could overstate traction.
    diligencePath: >-
      Request monthly shipment, activated-device, paid-account, repeat-purchase, and employee records with period
      definitions.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: access-blocked
    severity: minor
    topic: legal
    missingEvidence: Primary complaint, docket, patent documents, and current case status for the EDNY design dispute.
    whyItMatters: >-
      The available legal reporting describes allegations and procedural events but does not substitute for primary
      filings or an adjudication.
    diligencePath: >-
      Retrieve the court docket and patent documents, confirm parties and claims, and monitor injunction, settlement, or
      merits developments.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-lens-table
    missingEvidence: >-
      Primary market-study methodology, geography, category definitions, and a reproducible allocation from global
      smart-glasses demand to camera-free display glasses.
    whyItMatters: >-
      The available $3 billion and 24% figures are category-level forecasts and cannot establish Even's serviceable
      market or share.
    diligencePath: >-
      Obtain the underlying Grand View Research and IDC reports, reconcile their denominators, and build a bottom-up
      geography and segment model.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-signal
    missingEvidence: >-
      Audited or independently verified unit volume, active-user cohorts, retention, repeat purchase, and contribution
      margin by product and geography.
    whyItMatters: A reported 10,000-pair milestone and premium order value do not show durable adoption or economics.
    diligencePath: Request cohort, channel, returns, accessory attach, and unit-economics data under diligence confidentiality.
    relatedQuestionRefs:
      - QM004
      - QM008
  - type: missing-source
    severity: minor
    topic: enterprise-adoption
    missingEvidence: >-
      Public evidence of enterprise fleet management, administrator controls, procurement contracts, or employer
      reimbursement.
    whyItMatters: Enterprise budgets could expand the buyer pool, but assuming that channel would overstate the current market.
    diligencePath: Interview enterprise customers and request product, security, and deployment documentation.
    relatedQuestionRefs:
      - QM007
  - type: enumeration-incomplete
    severity: material
    topic: competitor-profile
    missingEvidence: >-
      Comparable competitor shipment, retention, developer, gross-margin and distribution data across Meta, Snap, XREAL
      and Viture.
    whyItMatters: >-
      Without comparable scale and economics, Even's relative position and moat durability cannot be underwritten
      quantitatively.
    diligencePath: >-
      Obtain vendor disclosures, channel checks, app-usage signals and independent market data using a common period and
      metric definition.
    relatedQuestionRefs:
      - QP006
      - QP009
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: Cohort retention, feature adoption, prescription repeat rates and evidence of workflow lock-in.
    whyItMatters: A camera-free wedge can attract trial without creating durable switching costs or recurring value.
    diligencePath: Request cohort data by use case, return rates, repeat purchase data and enterprise or power-user references.
    relatedQuestionRefs:
      - QP007
      - QP009
  - type: missing-source
    severity: minor
    topic: internal-build
    missingEvidence: Buyer-specific evidence on whether internal hardware or custom workflow software is a practical substitute for G2.
    whyItMatters: The competitive set is incomplete if enterprise buyers can solve the same job internally at lower switching cost.
    diligencePath: >-
      Interview enterprise prospects and integrators about build-versus-buy decisions, required optics hardware and
      deployment cost.
    relatedQuestionRefs:
      - QP010
  - type: conflicting-data
    severity: minor
    topic: legal-competition
    missingEvidence: Court filings or a judgment resolving the MemoMind design-patent allegations.
    whyItMatters: >-
      The complaint and campaign suspension show competitive pressure but do not establish infringement or patent
      validity.
    diligencePath: >-
      Track the EDNY docket and review any claim-construction, settlement or merits decision before treating the dispute
      as resolved.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Audited or board-grade revenue by SKU, geography, channel, and period, reconciled to shipments, refunds, and
      revenue recognition policy.
    whyItMatters: >-
      List prices and reported unit milestones cannot establish revenue scale, growth, or the quality of reported
      demand.
    diligencePath: Request the latest audited statements and a monthly order-to-cash bridge with gross-to-net adjustments.
    relatedQuestionRefs:
      - QI003
      - QI004
  - type: private-evidence-only
    severity: blocking
    topic: margin
    missingEvidence: >-
      SKU-level gross margin and contribution margin including optics, prescription fulfillment, manufacturing,
      warranty, logistics, returns, and support.
    whyItMatters: Premium order value can coexist with unattractive economics when hardware and service-delivery costs are unknown.
    diligencePath: Request a unit-cost waterfall for G2, R1, and prescription configurations plus warranty and return cohorts.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, inventory commitments, debt or supplier financing, runway, and next-round trigger.
    whyItMatters: >-
      Funding raised is not cash available, and a hardware expansion plan can consume capital before reported demand
      becomes cash generation.
    diligencePath: Request a 24-month cash forecast, debt schedule, inventory aging, purchase commitments, and downside runway case.
    relatedQuestionRefs:
      - QI007
      - QI009
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, conversion, sales cycle, channel economics, active-user denominator, retention, and repeat-purchase cohorts.
    whyItMatters: Reported early-adopter concentration does not show whether demand can scale beyond a premium niche.
    diligencePath: Request cohort tables by market and acquisition channel with CAC/payback and retention definitions.
    relatedQuestionRefs:
      - QI004
      - QI005
  - type: missing-source
    severity: material
    topic: legal
    missingEvidence: >-
      Current reserve, insurance, expected legal spend, and commercial exposure associated with the open design-patent
      dispute.
    whyItMatters: >-
      An unresolved dispute can create litigation expense, product-design changes, campaign constraints, or supply
      disruption.
    diligencePath: Obtain counsel's case assessment, budget, insurance coverage, and contingency plan for disputed designs.
    relatedQuestionRefs:
      - QI008
  - type: access-blocked
    severity: minor
    topic: funding
    missingEvidence: The assigned aVenture URL returned only publisher boilerplate rather than the article text.
    whyItMatters: The URL cannot support a financial claim despite its relevant title and successful HTTP retrieval.
    diligencePath: Obtain the original article body or rely on the separately retained substantive funding coverage.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: minor
    topic: recurring-revenue
    missingEvidence: Contract and billing evidence for any software, AI, subscription, API, or usage-based revenue.
    whyItMatters: >-
      Recurring revenue would change the valuation and retention framework, but it cannot be assumed from AI
      functionality.
    diligencePath: Request revenue segmentation and customer billing cohorts separating hardware from software or services.
    relatedQuestionRefs:
      - QI001
  - type: missing-source
    severity: material
