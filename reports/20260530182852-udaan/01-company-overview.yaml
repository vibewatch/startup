- id: capital-base-and-operating-reset
  title: Capital Base, Financial Profile, and the Operating Reset
  body: |-
    The clearest recent inflection was the June 2025 Series G close: $114 million of fresh equity led by M&G and Lightspeed at about a flat $1.8 billion valuation. Management and reporting agree on the intended use of funds—deepen FMCG and HoReCa, expand private-label staples, strengthen the balance sheet, and keep moving toward public markets. That round followed roughly ₹300 crore of debt raised in October 2024 from Lighthouse Canton, Stride Ventures, InnoVen, and Trifecta, earmarked for micro-market expansion, GTM capability, fulfilment, and buyer adoption. Together, the equity and debt actions say Udaan was not yet self-funding the turnaround, but it had reopened access to capital on more disciplined terms than in its hypergrowth years.

    The financial profile shows the trade-off clearly. FY24 top line was reported at ₹5,706.6 crore, with source wording alternating between revenue and GMV, while net loss narrowed to ₹1,674.1 crore and expenses fell 4.4%. Management separately claimed CY24 operating improvement—60% growth, better contribution and gross margin, over 90% monthly repeat, and higher wallet share—but those are operational commentary metrics and should not be confused with FY24 reported top-line growth. By FY25, public reporting suggests the company had become much smaller but leaner: roughly ₹4,561 crore revenue, roughly ₹1,055 crore loss, operations reset from nearly 80 cities to 16, and a currently described network of more than 25 warehouses serving more than 200,000 outlets. The key caveat is scale ambiguity: older marketing-style figures still cite 3 million-plus retailers, 25,000 suppliers, and 900-plus cities, but those are clearly not the same scope as the post-reset network and should not be used interchangeably.
