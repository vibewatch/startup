- id: leadership-and-governance
  title: Leadership, Founder Transitions, and Governance Dependence
  body: |-
    Leadership has become more concentrated around Vaibhav Gupta as Udaan has moved from expansion mode into repair-and-IPO mode. Gupta remains the day-to-day operating founder and public face of the turnaround. Sujeet Kumar and Amod Malviya are still part of the founding story but are no longer involved in daily operations; Kumar is reported to remain on the board, while Malviya has moved on to Pre6. That leaves Udaan with meaningful founder dependence on one executive at a time when legal restructuring and public-market preparation both increase governance sensitivity.

    The 2023 organisational reshuffle underlines that this is not a static leadership team. VCCircle and follow-on restructuring coverage describe CTO Gaurav Bhalotia stepping down, Vivek Gupta moving into an advisory role, Uday Bhaskar taking charge of the merged operating unit, and Siddharth Reddy plus Abhilash Pillai stepping into more visible engineering and product roles. The company’s own About page adds a broader bench across product, engineering, investor relations, policy, horeca360, and IT, but it does not publish a full board roster or committee structure. The diligence takeaway is that Udaan has a credible operating bench, but governance disclosure remains thin relative to the strategic importance of the reverse flip and prospective IPO process.
