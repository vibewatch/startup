  evidenceGaps:
  - type: missing-source
    severity: material
    topic: market-share-verification
    missingEvidence: An independent market-share study or disclosed cohort count that validates Udaan’s claimed ~70% share and “millions” of active small-business users.
    whyItMatters: The official leadership claim is central to the competitive narrative, but valuation and market-positioning work should not rely on an unverified company assertion.
    diligencePath: Request a third-party industry study, internal monthly active buyer metrics, and cohort definitions used in management reporting.
    relatedQuestionRefs:
    - QO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-table-coverage
    missingEvidence: A current board roster, committee structure, and fuller public biographies for the leadership team beyond the operating managers listed on the website.
    whyItMatters: Governance quality and key-person dependence are difficult to judge without knowing the actual board composition and formal oversight structure.
    diligencePath: Obtain the latest cap-table and board materials, statutory filings for Hiveloop, and investor-rights documents.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map-coverage
    missingEvidence: Exact ownership percentages, board rights, liquidation preferences, and the complete investor/lender stack across equity, convertible, and debt instruments.
    whyItMatters: The public source set identifies names but not economics or control rights, limiting any real assessment of dilution, governance leverage, and refinancing risk.
    diligencePath: Request the current cap table, debt schedule, shareholder agreement, and principal financing documents.
    relatedQuestionRefs:
    - QO024
    - QO026
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: A complete dated funding and restructuring chronology covering the February 2025 Series G tranche, exact reverse-merger milestones, and any formal IPO preparation filings.
    whyItMatters: The chronology of capital raises and legal restructuring affects how close Udaan actually is to a listing event versus a continuing private reset.
    diligencePath: Collect board-approved restructuring milestones, NCLT order documents, and any draft banker or legal workplans tied to IPO readiness.
    relatedQuestionRefs:
    - QO020
    - QO024
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: ipo-timeline-confidence
    missingEvidence: A confirmed board-approved IPO timetable, reverse-flip completion schedule, and filing readiness plan rather than interview-level guidance.
    whyItMatters: Public sources only provide indicative windows; transaction timing and liquidity planning need internal evidence rather than media estimates.
    diligencePath: Request banker mandate letters, legal workstreams, and board materials governing the listing process.
    relatedQuestionRefs:
    - QO020
