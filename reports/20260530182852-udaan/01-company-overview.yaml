- id: restructuring-ipo-path-and-adverse-milestones
  title: Restructuring, IPO Path, and Adverse Milestones
  body: |-
    Udaan’s listing path is really a restructuring story first and an IPO story second. January 2025 reporting said NCLT cleared consolidation of the technology, logistics, and wholesale businesses into Hiveloop Ecommerce Pvt Ltd, with the goal of creating a cleaner flagship entity. March 2026 reporting then described the next step: reverse-merging the Singapore holding structure into India so Hiveloop can become the parent. Management has explicitly said two workstreams matter—complete the reverse flip and get the business to break-even. The public market window is therefore indicative rather than fixed: sources suggest anything from end-2025 or 2026 to roughly 9-18 months from the March 2026 interview.

    The adverse history matters because it explains why the current footprint is so much smaller and why diligence should treat profitability claims carefully. Udaan cut 160-180 roles in June 2022 and, according to later reporting, more than 500 jobs across two 2022 rounds. The late-2023 round then removed roughly 120-150 more employees after restructuring, with reporting consistently tying those cuts to decentralised cluster operations and the profitability push. In other words, the current IPO narrative sits on top of a multi-year retrenchment programme rather than uninterrupted momentum. The constructive read is that the company has become more disciplined; the skeptical read is that it still needs legal simplification, governance disclosure, and profit proof before the IPO case is really de-risked.
