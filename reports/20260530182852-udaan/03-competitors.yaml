tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Scale / funding signal
  - Target buyer
  - Product scope
  - Main edge vs. Udaan
  - Main limitation
  rows:
  - - Udaan
    - FY25 revenue ~₹4,561 crore; 16 cities; 25+ warehouses; 200,000+ outlets
    - Kiranas, small retailers, chemists, HoReCa
    - Inventory-led procurement, fulfilment, and financing
    - Curated replenishment plus credit in a focused network
    - Limited public disclosure on retention, pricing, and credit performance
  - - Jumbotail
    - 250,000+ kiranas across 50+ cities; post-Solv reach 500,000+ retailers across 400+ cities/towns; $120M Series D
    - Kiranas, supermarkets, brands, MSME sellers
    - Marketplace, owned logistics, fintech, J24 retail OS, brand GTM
    - Closest stack match; stronger post-Solv merchant and supplier surface
    - FY23 losses still meaningful; disclosure remains startup-level
  - - ElasticRun
    - 1,000+ fulfilment stations; 600+ cities/towns; 80,000 villages in 26 states; marked down to ~US$800M implied value
    - Brands, marketplaces, D2C, rural FMCG trade, q-commerce
    - Fulfilment network, logistics software, retail distribution, dark stores
    - Rural distribution density and pan-channel infrastructure
    - Model now spans too many lanes to look like one clean eB2B thesis
  - - IndiaMART
    - 93M+ buyers; 60% share of online B2B classified space; public-company disclosure cadence
    - SMEs, large enterprises, individual buyers and suppliers
    - Buyer-supplier discovery, lead generation, classified marketplace
    - Asset-light reach, public trust, lower-friction onboarding
    - Weak fulfilment and credit control relative to inventory-led models
  - - Amazon Business
    - Launched 2017; 19 crore+ products from 16 lakh+ sellers; 100% serviceable pin-code reach
    - MSMEs, large enterprises, institutional buyers
    - Horizontal B2B marketplace with GST, compliance, and account controls
    - Assortment breadth, procurement governance, and trust tooling
    - Less category-specific field execution and weaker kirana workflow lock-in
  - - Reliance / METRO Wholesale
    - Large-format wholesale footprint serving kiranas, HoReCa, offices, and SMEs
    - Retailers, HoReCa, corporates, SMEs, offices
    - Cash-and-carry style assortment through store-led wholesale
    - Offline sourcing adjacency and broad category basket
    - Store-led workflow is less software-native and less credit-integrated
  - - Quick-commerce adjacents (JioMart / Flipkart / Amazon Now)
    - JioMart ~2M daily hyperlocal orders; Flipkart 800+ dark stores; Amazon Now targeting 100 cities
    - Convenience-driven merchants and urban or semi-urban demand pockets
    - Urgent fulfilment, hyperlocal or dark-store delivery
    - Speed, capital, and consumer-behavior spillover into merchant expectations
    - Not a full procurement system and weaker for scheduled bulk replenishment
  notes: Udaan is included as the anchor row because the point of the chapter is relative positioning, not a standalone competitor directory. Scale metrics are the latest public signals available, but they are not fully apples-to-apples across private and public companies.
