- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Evidence-backed support
  - Threat vector
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Owned replenishment density
    - Udaan and Jumbotail both look stickier than discovery platforms when recurring baskets and delivery reliability matter
    - Amazon, Reliance, and quick commerce can still reprice convenience or steal urgent orders
    - High
    - Request city-level repeat-order and share-of-wallet cohorts to prove density is durable rather than promotional
  - - Embedded finance as lock-in
    - Credit and payment loops clearly differentiate inventory-led startups from IndiaMART and many wholesale alternatives
    - Credit can destroy economics if delinquency, funding costs, or fraud are mispriced
    - High
    - Obtain vintage-level delinquency, recovery, and approval-rate data by buyer cohort
  - - Supplier and brand access
    - Jumbotail’s GTM push and Solv acquisition show supplier-budget capture can deepen the moat
    - ElasticRun, Amazon, and large incumbents also have broad supplier reach
    - High
    - Map exclusive brands, private labels, and preferred trade terms by category
  - - Trust and compliance posture
    - Amazon Business, IndiaMART, and METRO publish stronger public procurement or disclosure signals than private startups
    - Institutional buyers may favor those channels even when they are operationally shallower
    - Medium-High
    - Test whether trust gaps actually show up in win-loss or enterprise expansion data
  - - Offline adjacency
    - Reliance/METRO and JioMart can lean on stores and existing local infrastructure
    - Standalone startups must fund density directly and defend against faster local fulfilment
    - High
    - Compare acquisition cost and fulfilment cost by city versus store-backed substitutes
  - - Model clarity
    - ElasticRun’s breadth proves infrastructure can be powerful
    - The same breadth may dilute category focus and obscure profit pools
    - Medium-High
    - Separate rural distribution, enterprise logistics, and quick-commerce economics before using it as a like-for-like benchmark
  notes: The register converts public evidence into underwriting risks rather than certainty. Severity reflects likely impact on retention, margin durability, or capital intensity, not a modeled financial loss.
