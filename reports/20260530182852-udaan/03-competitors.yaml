  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Standardized realized take rates, discount ladders, financing spreads, and effective contribution margins by comparable merchant cohort across Udaan, Jumbotail, ElasticRun, Amazon Business, and wholesale substitutes.
    whyItMatters: Without realized economics, the pricing table can only compare packaging logic and transparency, not true buyer cost or platform profitability.
    diligencePath: Request merchant-level cohort P&Ls, realized trade terms, financing yields, and promotion-adjusted contribution margins by category and city.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: cohort-gap
    missingEvidence: Comparable repeat-order, retention, cohort payback, delinquency, and loss-rate data for Udaan, Jumbotail, and ElasticRun.
    whyItMatters: Moat durability depends on whether merchants truly stay, deepen wallet share, and repay credit through the same loop rather than simply multi-home opportunistically.
    diligencePath: Request monthly cohort retention by category and city, credit-vintage performance, repeat-order frequency, and merchant-level share-of-wallet data from management.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: jiomart-comparability
    missingEvidence: A directly reviewed primary JioMart or Reliance presentation that breaks hyperlocal merchant metrics out in a way comparable to Udaan’s outlet, warehouse, and category disclosures.
    whyItMatters: Current substitute-pressure evidence is strong enough to show direction, but not strong enough to map JioMart’s hyperlocal scale cleanly onto Udaan’s operating network and unit economics.
    diligencePath: Fetch the underlying Reliance investor deck or segment disclosure cited by press coverage and normalize definitions against Udaan’s outlet and city metrics.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP001
  - type: enumeration-incomplete
    severity: minor
    topic: trust-and-compliance
    missingEvidence: Public startup sources do not provide a standardized disclosure set for GST disputes, return fraud, KYC quality, or merchant-credit controls across Udaan, Jumbotail, and ElasticRun.
    whyItMatters: Trust and compliance posture is a real buying criterion, but today the public evidence is much stronger for Amazon Business and IndiaMART than for private eB2B startups.
    diligencePath: Request policy docs, audit findings, fraud metrics, lending-partner controls, and enterprise customer references from each private competitor.
    relatedQuestionRefs:
    - QP022
    - QP026
    relatedTableRefs:
    - TP002
    - TP004
