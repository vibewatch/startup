- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company / class
  - Commercial model
  - Visible pricing signal
  - Included capabilities
  - Contract / invoice posture
  - Implication
  rows:
  - - Udaan
    - Margin on inventory-led orders plus financing take
    - Not publicly standardized
    - Assortment, fulfilment, and credit in one operating loop
    - Formal invoices, but realized economics are private
    - Powerful when basket frequency is high, but hard for outsiders to benchmark
  - - Jumbotail
    - Inventory margin, GTM services, and fintech-adjacent monetization
    - Not publicly standardized
    - Marketplace, logistics, payments, lending access, J24 OS
    - Formal trade workflow but public price visibility remains low
    - Commercial opacity is similar to Udaan, so competition is fought on execution more than list price
  - - ElasticRun
    - Distribution, logistics, and network-service monetization across channels
    - Not publicly standardized
    - Warehousing, dark stores, routing, B2B and q-commerce fulfilment
    - Enterprise and brand contracts likely matter more than merchant list price
    - Hard to compare directly because the company spans infrastructure and commerce
  - - IndiaMART
    - Discovery, lead-generation, and subscription-style classifieds model
    - Higher public transparency than private peers, but no one merchant P&L view
    - Buyer-supplier matching and marketplace visibility
    - Discovery-led rather than inventory-invoice-led
    - Lower operating lock-in but easier procurement approval
  - - Amazon Business
    - Marketplace pricing with bulk discounts and optional credit
    - Most visible and transparent in the set
    - GST invoices, compliance tools, account controls, broad catalogue
    - Strong invoice and policy controls built into checkout
    - Creates pricing pressure and a strong “secondary rail” option for buyers
  - - Reliance / METRO Wholesale
    - Wholesale basket margin through physical stores and broad assortment
    - Wholesale-price positioning is visible in-store, not standardized online
    - Cash-and-carry style sourcing across many categories
    - Formal B2B invoice posture for wholesale procurement
    - Competes on trust and local stock access more than software packaging
  - - Quick-commerce adjacents
    - Delivery-fee and basket economics subsidized by dense local networks
    - Promotions and convenience are visible, long-run economics are not
    - Urgent fulfilment and hyperlocal assortment
    - Fast consumer-style checkout rather than deep merchant workflow control
    - Strong for emergency spend, weak as a full merchant operating system
  notes: This table is intentionally directional. Public sources expose product features and some discounts, but they do not disclose standardized realized take rates, trade terms, or credit spreads across the competitor set.
