  evidenceGaps:
  - type: missing-source
    severity: material
    topic: runway-and-covenants
    missingEvidence: Unrestricted cash balance, runway months, debt-service schedule, covenant headroom, and any borrowing-base or security-package disclosures.
    whyItMatters: Funding dependence is the top residual risk, but investors still cannot size liquidity cushion or refinancing pressure from public sources.
    diligencePath: Request a monthly liquidity bridge, debt schedule, covenant package, and post-ShopKirana working-capital plan.
    relatedQuestionRefs:
    - QR005
    - QR020
  - type: private-evidence-only
    severity: material
    topic: credit-performance
    missingEvidence: Credit-loss rates, delinquency buckets, lender mix, default guarantees, and realised collection performance for udaanCapital-related flows.
    whyItMatters: Embedded credit can amplify gross-margin and working-capital stress, but public data does not quantify default or risk-sharing.
    diligencePath: Request lender-by-lender loan-book metrics, NPA buckets, write-offs, and any first-loss or DLG structures.
    relatedQuestionRefs:
    - QR012
    - QR013
    - QR019
  - type: missing-source
    severity: material
    topic: food-and-pharma-compliance-proof
    missingEvidence: Actual Udaan or seller-facing food licences, audit logs, recall procedures, pharma authorisation workflows, and category-specific SOPs.
    whyItMatters: The regulatory perimeter is real, but the public record is too thin to distinguish disciplined compliance from simple absence of visible enforcement.
    diligencePath: Request FSSAI and CDSCO process maps, responsible-entity matrix, sample licence evidence, and any category incident log.
    relatedQuestionRefs:
    - QR014
    - QR015
    - QR016
    relatedTableRefs:
    - TR001
  - type: stale
    severity: material
    topic: reverse-flip-completion
    missingEvidence: Documented completion status for the Singapore-to-India reverse merger and any remaining approvals, filings, or restructuring conditions.
    whyItMatters: IPO readiness, governance simplification, and entity-level clarity depend on the legal restructuring actually closing rather than merely being announced.
    diligencePath: Request the latest restructuring timetable, filed scheme status, and counsel note on remaining steps.
    relatedQuestionRefs:
    - QR017
    - QR018
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: shopkirana-integration-proof
    missingEvidence: Post-close integration scorecard covering sourcing overlap, credit attachment, service levels, gross margin, and city-level retention.
    whyItMatters: ShopKirana is presented as a mitigation lever, but it could also distract teams or add integration drag if promised synergies slip.
    diligencePath: Request a 100-day integration dashboard and monthly synergy bridge versus plan.
    relatedQuestionRefs:
    - QR021
    - QR031
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: concentration-and-retention-metrics
    missingEvidence: Top-customer share, top-supplier share, NRR, churn, city concentration, and category concentration for gross margin and contribution profit.
    whyItMatters: Without concentration and retention disclosure, investors cannot test whether the apparent turnaround is broad-based or carried by a narrow merchant or supplier set.
    diligencePath: Request concentration schedules by customer, supplier, category, and city for the last eight quarters.
    relatedQuestionRefs:
    - QR026
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
