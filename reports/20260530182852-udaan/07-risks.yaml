- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Funding dependence
    - Liquidity disclosure or new fundraise pattern
    - No clear cash bridge, runway disclosure, or fresh funding on investor-friendly terms by the next major capital event.
    - Escalate financing risk and require covenant, runway, and debt-service evidence before underwriting growth.
  - - Reverse flip / legal simplification
    - Corporate restructuring progress
    - Reverse merger or demerger milestones slip materially beyond management guidance.
    - Downgrade IPO-readiness and governance-simplification assumptions.
  - - Service quality / onboarding
    - Merchant friction signals
    - Broken policy pages persist, complaint themes remain acute, or order-resolution SLAs are not disclosed.
    - Treat customer-trust and repeat-rate assumptions as fragile until service evidence improves.
  - - Embedded finance / compliance
    - Credit and regulatory control evidence
    - Management cannot provide lender matrix, loss metrics, grievance controls, and RBI-compliant workflow documentation.
    - Assume credit optionality is lower-quality and haircut valuation for compliance and default risk.
  - - ShopKirana integration
    - Synergy realization
    - No city-level sourcing, credit, or contribution-margin benefit becomes visible within the first integration cycle.
    - Reclassify the acquisition from mitigation to distraction risk.
  - - Cluster economics breadth
    - Concentration and retention metrics
    - Top-city or top-customer dependence proves far higher than implied, or repeat-rate quality does not translate into broad retention.
    - Reduce confidence in the turnaround and test downside under a narrow-base scenario.
  notes: 'These kill criteria are intentionally monitorable: each one points to a concrete disclosure, milestone, or operating metric rather than a vague strategic concern.'
