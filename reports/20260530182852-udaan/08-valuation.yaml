- id: kill-triggers-and-final-diligence
  title: Kill triggers and final diligence asks
  body: 'The kill triggers are more important than the upside narrative because the current mark is not obviously distressed. The thesis breaks quickly if Udaan has to raise fresh capital below the last round, if FY26 audited revenue and margin progression fail to match the claimed run-rate trajectory, if working-capital or credit-loss data turns out materially worse than investors expect, or if reverse-flip and legal simplification timelines keep slipping. Those events would directly compress valuation because they would move the story back from ''maturing turnaround'' to ''still capital dependent''. Service or integration deterioration after ShopKirana would matter too, especially if density gains fail to show up in repeat rates and fulfilment economics.


    The final diligence burden is therefore concrete rather than open-ended. Investors need audited FY26 P&L and cash-flow detail; cluster or city-level contribution metrics; debt, covenant, and runway visibility; credit-loss and receivable aging disclosure; and cap-table terms that clarify preferences, employee-liquidity mechanics, and any dilution overhang. Without those items, public evidence is strong enough to support a watchlist position and a valuation range, but not a precision price or a full-conviction buy call.'
