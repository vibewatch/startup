  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table-scope-tv004
    missingEvidence: TV004 is intentionally a sample of the most decision-useful comps; a fuller like-for-like private peer set would require more current audited data and disclosed round terms from Udaan, Jumbotail, and other direct Indian eB2B peers.
    whyItMatters: The valuation range is robust enough for a track decision, but comp selection could still tighten if more transparent private-peer financials or transaction terms surface.
    diligencePath: Extend the comp work with audited FY26 peer financials, transaction terms, and any new listed or M&A comparables before underwriting a tighter point estimate.
    relatedQuestionRefs:
    - QV012
    - QV015
    - QV016
    - QV017
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: fy26-audited-financials
    missingEvidence: FY26 audited revenue, gross margin, EBITDA, operating cash flow, and bridge versus FY25 have not been published publicly as of 2026-05-30.
    whyItMatters: Without audited FY26 numbers, investors cannot tell whether run-rate growth and margin commentary are translating into durable reported economics.
    diligencePath: Request audited FY26 financial statements, board deck bridge, and monthly management accounts through finance diligence.
    relatedQuestionRefs:
    - QV033
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: runway-and-credit-losses
    missingEvidence: Public sources do not disclose current cash runway, debt covenant headroom, receivable quality, or credit-loss performance.
    whyItMatters: Those variables can dominate common-equity risk in a low-margin, working-capital-heavy commerce model even when top-line growth looks healthy.
    diligencePath: Obtain treasury, lender, and portfolio-quality reporting including aging, write-offs, and any RE-LSP or NBFC exposure detail.
    relatedQuestionRefs:
    - QV034
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Public reporting does not provide a clean view of liquidation preferences, anti-dilution protections, or employee-liquidity mechanics around recent rounds.
    whyItMatters: Headline valuation can overstate common-equity value if preference stacks or secondary structures are unfavorable to new money.
    diligencePath: Request the current cap table, financing documents, employee-liquidity terms, and any side letters before underwriting returns.
    relatedQuestionRefs:
    - QV034
    relatedTableRefs:
    - TV006
