- id: scenario-logic-and-entry-discipline
  title: Scenario logic, recommendation, and entry discipline
  body: 'The scenario logic is straightforward. In the bear case, Udaan fails to convert CY24 run-rate improvement into cleaner FY26 audited financials, funding markets demand harder terms, or working-capital and credit friction keep the model from compounding. In that world the relevant anchor becomes lower-quality distribution comparables and marked-down private peers, which points to roughly $0.9-1.3 billion. In the base case, the company continues narrowing losses, keeps cluster economics stable, integrates ShopKirana without disruption, and completes corporate simplification on a reasonable IPO timetable; that supports something like a $1.4-1.9 billion envelope. In the bull case, management proves that the 65% run-rate growth and contribution-margin gains translate into reported revenue acceleration, cleaner EBITDA, and stronger public-market readiness, which can justify roughly $2.2-2.8 billion.


    That range makes the current mark defensible but not generous. The right recommendation is therefore track, not buy. The company has improved enough that the downside case is no longer the only case, but it has not yet disclosed enough to justify fresh capital on momentum alone. A disciplined entry needs one of two things: a better price, ideally closer to $1.5-1.6 billion or below, or a stronger evidence package that closes on FY26 audited revenue quality, gross margin / contribution-margin durability, cash runway, credit losses, and dilution terms. Until one of those happens, Udaan is a plausible IPO candidate and a credible turnaround, but still an evidence-sensitive one.'
