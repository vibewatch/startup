- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Udaan current mark
    - Private valuation vs trailing sales
    - ~$1.8B; ~3.3x FY25 sales or ~2.7x FY24 sales depending revenue base and FX assumption.
    - Current decision point.
    - Private mark; range is sensitive to which revenue period is used.
  - - IndiaMART
    - Public EV / revenue and EV / EBITDA
    - ~5.6x EV/revenue and ~13x-16.5x EV/EBITDA with FY26 profitability.
    - Best Indian listed digital B2B anchor and clear upper-quality ceiling.
    - Subscription / classifieds economics are materially cleaner than Udaan’s.
  - - Jumbotail
    - Private round and financials
    - '>$1B post-money after $120M round; FY23 revenue ₹819cr and loss ₹264cr.'
    - Closest private operating comp in Indian eB2B grocery / merchant distribution.
    - Still private and only partially transparent.
  - - ElasticRun
    - Private valuation path
    - $1.5B in 2022, later HSBC-implied around $0.8B.
    - Useful reminder that logistics-heavy late-stage marks can compress hard.
    - Model skews more toward logistics and rural distribution than Udaan.
  - - Metro AG
    - Public market-cap / revenue sanity check
    - ~$2.17B market cap on ~$33.9B revenue, or roughly 0.06x market-cap-to-revenue.
    - Downside anchor for low-margin wholesale economics.
    - Mature European wholesaler with very different geography and ownership structure.
  - - India digital retail benchmark
    - Sector margin and capital-intensity context
    - FY25 sector margins improved, but fulfillment and balance-sheet intensity stayed high.
    - Shows why investors reward profitability progress but still discount capital-heavy models.
    - Sector basket, not a pure eB2B comp.
  notes: 'Comparable set is intentionally mixed: IndiaMART provides the quality ceiling, Jumbotail and ElasticRun the private-peer context, and Metro the wholesale downside check.'
