- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - FY26 audited revenue reaccelerates, burn keeps falling, ShopKirana integrates cleanly, and IPO readiness improves on schedule.
    - $2.2B-$2.8B range; the current mark can work and still leave upside.
    - Execution slip, integration drag, or softer market multiples.
    - Possible, but needs better audited proof than the public record currently provides.
  - - Base
    - Revenue stabilizes to moderate growth, losses keep narrowing, and corporate simplification continues without major surprises.
    - $1.4B-$1.9B range; the current $1.8B mark sits inside but near the upper half.
    - Working-capital strain, soft FY26 growth translation, or delayed listing readiness.
    - Most plausible on available evidence.
  - - Bear
    - Growth stalls, financing terms harden, or hidden credit / cash intensity proves worse than expected.
    - $0.9B-$1.3B range; current investors face material mark-down risk.
    - Fresh capital need, down round, or public-market comp compression.
    - Meaningful tail risk because disclosure is still incomplete.
  notes: Scenario ranges are IC discussion tools anchored on public evidence, private-peer context, and comp dispersion rather than a single DCF.
