      - number: '3.3'
        title: Horizontal platforms, wholesale substitutes, and entrant pressure
        blocks:
          - type: paragraph
            body: >-
              The most important adjacent competitors win through lower-friction procurement rather than deep merchant
              lock-in. IndiaMART is the clearest example: it is a public, disclosure-heavy, asset-light marketplace
              built around buyer-supplier discovery rather than owned inventory. That usually means lower switching cost
              and easier multi-homing than Udaan, but also weaker control over fill rate, delivery cadence, and credit.
              Amazon Business pushes a different version of the same trade-off. Its strengths are breadth and
              governance: GST invoicing, compliance tools, team controls, bulk discounts, credit options, 100%
              serviceable-pin-code reach, and a catalogue far larger than any vertical eB2B startup can match. For many
              SMEs and institutions, that makes Amazon Business a safer secondary procurement rail even when it is not
              the operational system of record.


              Wholesale and hyperlocal substitutes matter because they attack the same spend with different economics.
              Reliance’s METRO wholesale format serves kiranas, HoReCa, offices, and SMEs with broad category assortment
              and store-led distribution. JioMart, Amazon Now, and Flipkart Minutes intensify a different threat: they
              train merchants and consumers to expect immediate fulfilment and aggressive pricing, often backed by
              networks that a venture-funded eB2B startup cannot easily mirror. For Udaan, these are not exact product
              twins; they are attention, margin, and convenience substitutes that can still weaken basket share.
