      - number: '4.3'
        title: Capital adequacy, financing dependency, and post-reset expansion levers
        blocks:
          - type: paragraph
            body: >-
              The capital story is encouraging but still dependency-heavy. Udaan added roughly ₹300 crore of debt in
              October 2024 from Lighthouse Canton, Stride Ventures, InnoVen Capital, and Trifecta, then raised $114
              million of fresh Series G equity in June 2025 from M&G and Lightspeed. Publicly stated uses of funds are
              consistent across outlets: strengthen the balance sheet, deepen FMCG and HoReCa, support private-label
              staples, expand fulfilment and go-to-market capability, and keep pushing toward public-market readiness.
              Indian Startup News framed the equity check as more than ₹970 crore, so recent disclosed external capital
              since October 2024 is roughly ₹1,270 crore before any repayments, working-capital swings, or acquisition
              effects. That is meaningful, but it is still only a gross proxy because Udaan does not publish
              unrestricted cash, monthly burn, covenant headroom, or debt service schedules.


              Operationally, the company is now talking about a much narrower but more tangible network: more than 25
              warehouses, 16 cities, and more than 200,000 retail outlets. The July 2025 ShopKirana acquisition adds
              another clue about where management thinks the margin path lies. The deal was presented as an all-stock
              combination that brings Info Edge onto the cap table while deepening FMCG sourcing, private-label
              development, credit, and supply-chain synergies. In other words, Udaan is still using external capital and
              corporate actions to improve merchandising density and working-capital efficiency, not just to finance
              top-line growth. That is a reasonable strategy, but it also means the business has not yet crossed into a
              self-funding state where runway can be inferred from operating disclosure alone.
