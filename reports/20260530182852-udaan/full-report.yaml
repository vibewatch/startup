  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - FY26 audited financial miss
        - Reported FY26 revenue growth, gross margin, or EBITDA falls materially short of the turnaround narrative.
        - Moves the story from improving turnaround back to unproven reset.
        - Cut fair-value range and pause new capital.
      - - Fresh capital below the last mark or with harsh preferences
        - New round prices meaningfully below $1.8B or introduces investor-protective terms.
        - Signals that private markets do not support the current common-equity headline value.
        - Re-anchor the base case lower and revisit dilution-adjusted returns.
      - - Credit-loss or working-capital surprise
        - Receivables quality, NPA proxies, or cash conversion are materially weaker than expected.
        - Low-margin distribution models rerate quickly when financing quality weakens.
        - Treat as a major downside event until fully disclosed.
      - - Reverse-flip / simplification delay
        - IPO-readiness workstreams slip materially beyond current messaging.
        - Extends liquidity timeline and weakens public-market optionality.
        - Hold off on any underwriting that depends on near-term listing.
      - - ShopKirana or service-execution deterioration
        - Integration causes churn, weaker fill rates, or cost leakage in core clusters.
        - Undermines the one major synergy leg in the bull case.
        - Remove upside credit and revisit scenario probabilities.
    notes: >-
      These triggers are designed to be monitorable and tied directly to valuation transmission rather than generic
      operating noise.
    claimRefs:
      - CV003
      - CV005
      - CV034
      - CV037
      - CV040
      - CV043
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - FY26 audited financials
        - Revenue, gross margin, EBITDA, operating cash flow, and audited bridge versus FY25.
        - Core requirement for deciding whether the current valuation deserves to hold or expand.
        - Finance DD; auditor package and board reporting.
      - - Cash runway and financing stack
        - Cash balance, debt maturities, covenant headroom, and receivable financing structure.
        - Determines whether the current mark is bridge financing or durable equity value.
        - Treasury / lender DD.
      - - Credit losses and receivable quality
        - NPA / write-off proxies, recovery rates, and segment-level credit exposure.
        - Embedded finance can silently dominate equity risk in low-margin commerce models.
        - Risk / lending DD with portfolio tape.
      - - Cap table and preference terms
        - Liquidation preferences, employee-liquidity mechanics, and any anti-dilution or ratchet clauses.
        - Common-equity returns can diverge sharply from the headline valuation without this detail.
        - Legal DD; financing documents.
      - - Cluster economics and ShopKirana integration
        - City-level contribution margins, repeat behavior, supplier density, and integration scorecard.
        - This is the main evidence required to decide whether the bull case deserves any probability lift.
        - Operating DD; cluster dashboards and post-merger review.
    notes: >-
      These are the minimum diligence requests needed before upgrading from track to buy or before underwriting the
      current mark as durable.
    claimRefs:
      - CV005
      - CV034
      - CV043
      - CV045
