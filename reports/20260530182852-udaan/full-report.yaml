      - number: '7.4'
        title: 'Mitigants, monitoring, and kill criteria: improved trajectory, still meaningful residual exposure'
        blocks:
          - type: paragraph
            body: >-
              Udaan does have real mitigants, and they should be acknowledged explicitly. Losses have fallen materially,
              the cluster model appears to be yielding denser economics, recent debt and equity rounds show that
              institutional capital has not abandoned the story, and public third-party material points to stronger
              localization, delivery speed, and customer-service discipline than the company had during its sprawl
              phase. The ShopKirana acquisition could also improve FMCG sourcing density and private-label scale if
              integration goes to plan. Those are not superficial positives; they are the main reasons this chapter does
              not conclude that Udaan is simply trapped in unmanaged decline.


              But the mitigation case remains incomplete because too many of the hardest questions still require
              management evidence rather than public proof. The company has not publicly disclosed runway,
              concentration, credit-loss performance, or a post-close integration scorecard for ShopKirana. Reverse-flip
              completion is still an execution item rather than a closed fact. Broken public returns-policy surfaces and
              visible onboarding complaints also mean the quality bar is not yet investor-grade by default. For
              diligence, that implies a simple rule set: the thesis improves if Udaan can show self-funding progress,
              legal simplification completion, stable lender support, cleaner merchant-service documentation, and
              concentration metrics that prove the turnaround is broad-based. The thesis weakens sharply if fresh
              capital becomes necessary without transparency, if regulatory or legal execution stalls, if service issues
              persist in dense clusters, or if integration benefits fail to show up in margin and retention data. In
              other words, the residual risk is manageable only if the next twelve months convert management narrative
              into auditable operating proof.
