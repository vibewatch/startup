      - number: '2.3'
        title: Growth drivers, digital rails, and category-specific tailwinds
        blocks:
          - type: paragraph
            body: >-
              Several structural drivers make digital procurement more plausible now than in Udaan’s early years. At the
              macro layer, Bain, BCG, and McKinsey all describe a still-expanding digital-consumption base beyond top
              metros, while KPMG and Deloitte link retail growth to urbanization, income expansion, GST formalization,
              and broader digital adoption. At the transaction layer, PwC shows that digital payments are now
              mainstream: retail digital-payment volumes are growing quickly, UPI already dominates the category, and
              merchant-acquiring infrastructure is spreading beyond tier-1 cities. ONDC extends that direction by trying
              to reduce dependence on closed ecosystems and by creating shared policy, tax, and readiness resources for
              sellers and network participants.


              Category-specific tailwinds also matter. FMCG remains the biggest replenishment pool, with both KPMG and
              IBEF describing strong long-run scale and fast quick-commerce-driven channel shifts. Pharma remains
              relevant because domestic demand, rural reach, and supply-chain digitization still depend heavily on
              fragmented outlet networks rather than only organized chains. These forces help explain why Udaan can
              still have meaningful category relevance despite its narrower post-reset footprint. But they should not be
              romanticized: ONDC and UPI lower transaction friction; they do not solve last-mile density,
              working-capital financing, or assortment reliability by themselves. Udaan still wins or loses on operating
              execution inside the digital tailwind, not because the tailwind substitutes for execution.
            claimRefs:
