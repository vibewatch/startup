      - number: '6.2'
        title: Adoption, density, and repeat proxies
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is strongest in metrics tied to buyer frequency rather than to disclosed revenue
              retention. Financial Express says Udaan’s 2024 revenue run rate rose 65% year over year, driven by a 70%
              rise in daily buyers, while debt-round coverage from Business Standard and ETRetail says daily transacting
              buyers grew more than 50% and buyer wallet share rose 20%. The same set of company-backed reports says
              repeat purchase doubled year over year to an all-time high and that the monthly repeat ratio exceeded 90%.
              Those are not SaaS-style cohorts, but they are meaningful signals for a replenishment business where
              repeat purchasing is the core customer behavior.


              Cluster-level proof is even more concrete. JPMorganChase and two Redseer-derived media stories all say
              Udaan serves about 80% of kirana stores in Bengaluru and handles roughly 15,000 daily store transactions
              there. Those sources also describe a micro-market strategy that lifted buyer penetration and wallet share
              by roughly 1.2 to 1.4 times in Bengaluru and Hyderabad. Redseer’s separate customer-service note adds a
              qualitative layer: localized market-manager feedback appears to improve delivery speed, credit
              accessibility, pricing, and assortment. Taken together, that suggests Udaan’s adoption is not evenly
              national. It is densest where cluster economics, service quality, and repeat behavior reinforce each
              other.
