      - number: '5.3'
        title: Trust, reliability, and support surface
        blocks:
          - type: paragraph
            body: >-
              Udaan’s public trust surface is real but shallow. There is a live privacy policy updated in May 2025,
              clear KYC language around GSTIN or shop-license verification, secure-payment claims, and an org structure
              that explicitly names IT and security plus policy leadership. The privacy policy is also concrete enough
              to matter: it lists registration data fields such as PAN and GSTIN, describes sharing with logistics,
              delivery, payment-extension, and authentication providers, and frames OTP plus usage data as part of
              security controls. Those are meaningful process signals for a B2B platform that handles identity, order,
              and credit workflows.


              The weak point is service transparency. Udaan’s contact page gives a basic escalation path for
              recent-order issues, but the public help endpoint returns Not Found, and the site’s Returns Policy and RTO
              links also resolve to Not Found even though the navigation advertises them. Independent app feedback
              deepens that caution: recent reviews praise packing and offers, but complaints point to onboarding delays,
              address-validation errors, and a return process that can become burdensome when disputed goods are heavy
              or degraded. So the company clearly has operating processes, yet the public web surface still
              under-documents how support, returns, and reliability are actually governed in edge cases.
