chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Model, and Claimed Market Position
        blocks:
          - type: paragraph
            body: >-
              Udaan was founded in 2016 in Bengaluru by Vaibhav Gupta, Sujeet Kumar, and Amod Malviya, and the official
              company narrative still frames the business as a technology-led trade platform built to serve Bharat’s
              small retailers. The core marketplace currently spans FMCG, staples, fruits and vegetables, and pharma,
              while the company also offers working-capital-oriented products through udaanCapital. Official pages say
              the company is headquartered in Bengaluru, has offices in metros and major cities across India, and is
              trusted by millions of small businesses.


              The most important caveat at the identity layer is that Udaan’s leadership language is stronger than its
              independently verified evidence base. The company says it is India’s largest eB2B platform with about 70%
              market share, but the source set here does not contain an external market study that verifies that share
              figure. Likewise, management’s current mass-market positioning around kiranas and small retailers is
              clear, yet the public evidence is much stronger on narrative and product scope than it is on independently
              audited customer counts. For later chapters, the clean reuse point is: Udaan is a Bengaluru-based B2B
              commerce and trade-credit platform serving India’s retail supply chain, while the exact scale of its share
              and active buyer base still needs diligence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
