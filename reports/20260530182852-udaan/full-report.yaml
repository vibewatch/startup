companyProfile:
  summary: >-
    Udaan is a Bengaluru-founded 2016 B2B commerce and trade-credit platform serving India's small retailers and
    business buyers across FMCG, staples, fruits and vegetables, pharma, and HoReCa. After a multiyear reset, the
    company now operates a narrower 16-city, 25-plus-warehouse network serving more than 200,000 outlets, raised $114
    million in Series G funding at about a $1.8 billion valuation in June 2025, and is pursuing IPO readiness through
    Hiveloop consolidation and a reverse flip.
