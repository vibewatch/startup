    rows:
      - - Cluster reset plus 16-city density has made the operating model more coherent than the old 1,000-city sprawl.
        - Improves the odds that reported revenue can convert into better contribution economics.
        - City-level gross-margin, fulfillment-cost, and repeat-rate data would strengthen this leg materially.
      - - >-
          CY24 run-rate growth, 300+ bps contribution-margin improvement, and lower burn show the turnaround has
          substance.
        - Supports a base-case valuation that can still clear near the current mark.
        - FY26 audited revenue growth and EBITDA / operating cash flow must validate the management narrative.
      - - ShopKirana can deepen FMCG sourcing, Bharat reach, and private-label leverage.
        - Creates one of the few realistic paths to upside above the current valuation.
        - Integration scorecards and supplier / buyer retention data are needed before granting synergy credit.
      - - 'Anti-thesis: Udaan is still inventory-led, low-margin, and working-capital intensive relative to IndiaMART.'
        - That structural difference should cap the multiple well below asset-light public marketplace leaders.
        - Proof of durable gross-margin expansion and lower cash intensity would narrow the discount.
      - - 'Anti-thesis: the company is still loss-making and key valuation inputs remain undisclosed.'
        - Missing runway, credit-loss, and cap-table data make common-equity returns harder to underwrite.
        - Audited FY26 cash-flow disclosure and preference terms would materially improve the call.
