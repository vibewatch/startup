  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The constructive case for Udaan is that the company has already done the painful part of the reset. Public
              reporting now shows a much smaller but more coherent business: the footprint has been cut to 16 cities and
              25-plus warehouses, FY25 losses narrowed materially, and management-linked reporting points to better
              contribution margins, lower EBITDA burn, and faster CY24 run-rate growth. The company also still has real
              strategic assets: a large retailer network, useful FMCG and pharma depth, embedded finance through
              udaanCapital, and now ShopKirana as a sourcing and distribution adjacency. If those pieces keep
              compounding, the June 2025 flat $1.8 billion mark can be defended as a bridge valuation rather than a
              distressed one.


              The anti-thesis is that Udaan remains an inventory-led, working-capital-heavy distributor that has not yet
              produced public-company-grade evidence on the exact variables that matter most for valuation. Public
              filings do not yet close on FY26 audited revenue, cash runway, credit losses, dilution terms, or clean
              cluster-level profitability. The reset from roughly $3.1-3.2 billion to $1.8 billion, the repeated
              layoffs, and the 'survival strategy, not expansion' framing all matter because they show this is still a
              turnaround, not a solved compounding story. The chapter conclusion is therefore deliberately
              price-sensitive: Udaan looks more investable than in 2023-24, but public evidence still supports
              discipline over enthusiasm.
