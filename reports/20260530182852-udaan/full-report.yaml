      - number: '4.4'
        title: Filing-derived visibility gaps and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Filing-derived public evidence is the weakest part of the chapter. Entrackr explicitly ties its FY24 recap
              to consolidated financial statements filed through Trustroot Internet in Singapore, but
              registry-compilation products do not line up neatly around the same perimeter. Inc42 attaches FY24 revenue
              to Hiveloop Technology, while Tracxn shows a much smaller FY25 revenue figure and 105 employees for Udaan
              India Private Limited, and Edge Insights exposes mostly placeholders for Trustroot rather than a usable
              public statement set. Those sources are still useful because they prove the group has multiple legal
              entities and that public registry summaries are not interchangeable with consolidated operating accounts.
              They are not strong enough to replace raw filed statements.


              That leaves the final verdict straightforward. Udaan’s financial direction is improving: losses are down,
              burn is down, fixed costs are down, and the company has re-opened access to both debt and equity capital.
              But revenue quality still looks predominantly inventory-led, the current balance-sheet position cannot be
              measured precisely from public data, and key diligence blockers remain unresolved around cash runway,
              credit loss performance, inventory turns, and entity-level reconciliation. For an investor, this is no
              longer a pure distress narrative; it is a restructuring-without-full-disclosure narrative. That is good
              enough for a cautiously constructive view on margin trajectory, but not good enough to underwrite
              self-sustaining economics without management data-room evidence.
