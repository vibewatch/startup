      - number: '8.2'
        title: Current valuation context and comparable frame
        blocks:
          - type: paragraph
            body: >-
              At face value, Udaan is not priced like a broken asset. Using the June 2025 mark of about $1.8 billion and
              FY25 consolidated revenue of ₹4,561.4 crore, the company screens at roughly 3.3x trailing sales using an
              explicit ₹84.5 per US dollar FX assumption. Using FY24 revenue of ₹5,706.6 crore instead lowers the
              multiple to about 2.7x, which is the right caveat to keep in mind whenever management cites run-rate
              growth but the latest audited revenue still reflects the post-reset base. That is why the correct output
              here is a range, not a precision target.


              The public comp set argues for an upper ceiling rather than a direct peer multiple. IndiaMART is the
              cleanest Indian listed analogue for digital B2B discovery, but it is also a much higher-quality earnings
              stream: market-data sources and filing-linked materials show a profitable, asset-light subscription
              platform at about 5.6x EV/revenue and low-to-mid teens EV/EBITDA. Udaan should not clear that level while
              it still carries inventory, logistics, working-capital, and credit intensity. Jumbotail is a closer
              private operating comp but is still smaller and only partially transparent. ElasticRun is useful mainly as
              a warning that late-stage private marks can compress sharply when logistics-heavy stories lose favor.
              Metro AG then serves as the hard downside sanity check: public wholesale businesses with thin margins can
              trade at very low revenue multiples.
