  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, top-line quality, and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              Udaan’s public revenue story is usable but not clean. FY24 top line was repeatedly reported at ₹5,706.6
              crore, yet the underlying wording is inconsistent: some publishers called that number revenue while others
              called it GMV. That caveat matters because Udaan is not a pure software marketplace. Entrackr’s
              filing-linked recap says the company monetizes through sale of traded goods, platform fees, logistics
              services, credit services, advertising, scrap sales, collection services, and loan-processing fees, but it
              also says sale of traded goods alone accounted for 98.5% of FY24 GMV. In practice, the public evidence
              points to an inventory-led commerce model with fee add-ons, not a take-rate-light marketplace whose
              economics can be inferred from app usage alone.


              The official company narrative is directionally consistent with that reading. Udaan still presents FMCG,
              staples, fruits and vegetables, pharma, and udaanCapital as core pillars, which fits a business built
              around assortment control, fulfilment density, and working-capital attachment rather than pure discovery.
              What is missing is pricing transparency: there are no public category-level price books, fee tables,
              take-rate disclosures, or realized gross-margin bridges. That leaves diligence with only a structural
              conclusion: revenue quality is improving if the company is shrinking toward stronger clusters and better
              contribution margins, but the public record still does not separate merchandise throughput from genuinely
              recurring service monetization cleanly enough to model steady-state economics.
            claimRefs:
