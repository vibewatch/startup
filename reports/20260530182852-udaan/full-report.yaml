      - number: '3.4'
        title: Switching costs, moat durability, and adverse competitor evidence
        blocks:
          - type: paragraph
            body: >-
              Competitive durability in this market is mostly about density, supply access, and who controls the
              merchant’s most frequent order loops. That is why Udaan and Jumbotail can still matter despite the
              presence of IndiaMART or Amazon Business: when a retailer needs recurring replenishment, dependable
              delivery, and working-capital support, inventory-led orchestration creates more day-to-day stickiness than
              discovery-led browsing. But that stickiness should not be mistaken for hard lock-in. Merchants can still
              split routine staples across Udaan or Jumbotail, source tail SKUs on Amazon Business, discover new
              suppliers on IndiaMART, and plug urgent gaps through nearby wholesale or quick commerce. Multi-homing
              looks normal rather than exceptional.


              That makes adverse evidence important. Jumbotail’s expansion is impressive, but its disclosed burn remains
              meaningful. ElasticRun’s valuation reset and runway rhetoric suggest that scale alone has not produced a
              universally convincing profit formula in Indian B2B commerce. Quick-commerce entrants show how
              better-capitalized networks can reprice convenience and compress merchant economics without reproducing
              Udaan’s full workflow. Public evidence also remains too thin on realized take rates, repeat-order cohorts,
              and credit losses to prove that any player has built a deeply durable moat. The right underwriting stance
              is therefore relative, not absolute: Udaan has a defendable seat in the market, but its moat still looks
              operational and local rather than structurally unassailable.
