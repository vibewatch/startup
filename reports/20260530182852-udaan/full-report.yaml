  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Severity-ranked risk picture: financing and execution still dominate'
        blocks:
          - type: paragraph
            body: >-
              Udaan’s risk stack is no longer a pure distress story, but it is still a capital-dependent reset story.
              The strongest adverse evidence is structural rather than episodic: public reporting ties revenue to a fall
              from roughly ₹10,000 crore in FY22 to ₹4,561.4 crore in FY25, while the company simultaneously shrank from
              an 80-city base to 16 cities and accepted a valuation reset from the $3.1-3.2 billion range to about $1.8
              billion. That is a meaningful de-risking on focus and burn, but it also proves that the original scale
              thesis did not hold on its first design. In risk terms, Udaan is now underwriting a much narrower
              geography, a denser warehouse network, and a more disciplined category mix rather than broad national
              ubiquity.


              The central investment question is therefore whether the cleaner operating shape is strong enough to
              outrun funding dependence. Recent evidence is encouraging but incomplete: losses narrowed by about 37% in
              FY25, M&G and Lightspeed added $114 million of new equity, lenders added roughly ₹300 crore of debt, and
              current reporting still shows a tangible network of 25-plus warehouses, 16 cities, and 200,000 outlets.
              Yet none of the public sources reviewed here discloses unrestricted cash, runway, covenant headroom, or
              the true loss experience of the embedded-credit surface. Founder concentration has also increased around
              Vaibhav Gupta after the other cofounders stepped back from daily operations, and the company has already
              gone through repeated layoff waves in 2022 and 2023. That combination makes financing/model risk and
              people/execution risk the two highest-severity categories: the turnaround is real, but it is still not
              self-proving.
