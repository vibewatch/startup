      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The usable market is the retailer-procurement layer, not the trillion-dollar headline retail number
            body: >-
              India’s retail market is unquestionably enormous, but Udaan only captures value where fragmented merchants
              choose digital replenishment and sometimes merchant credit. The most decision-useful public lens is
              therefore retailer-led eB2B, not total retail demand or all connected commerce.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM048
          - type: callout
            title: Digital rails are real enablers, but they do not replace logistics density or working-capital discipline
            body: >-
              UPI, ONDC, and broader Bharat digitization meaningfully lower discovery and transaction friction. They do
              not solve fulfillment reliability, route density, or credit losses; those remain operating and
              balance-sheet questions that still separate winners from laggards.
            calloutType: insight
            claimRefs:
              - CM022
              - CM024
              - CM025
              - CM043
              - CM044
              - CM045
          - type: callout
            title: >-
              Quick commerce is the clearest adverse force because it can deepen digital behavior while weakening
              merchant economics
            body: >-
              Redseer and IBEF show extraordinary channel growth, but PolicyCircle and Redseer also show margin
              pressure, deep discounting concerns, and city-level unit-economics dispersion. That means Udaan’s best
              digital-demand evidence is also tied to one of its biggest structural threats.
            calloutType: risk
