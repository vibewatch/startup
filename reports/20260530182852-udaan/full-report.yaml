        title: Customer scope and segmentation
        blocks:
          - type: paragraph
            body: >-
              Udaan’s customer base is large but publicly described through multiple incompatible scopes, so this
              chapter separates claimed network breadth from current operating density. Official surfaces say the
              platform is trusted by millions of small businesses and explicitly name kiranas, chemists, hotels,
              restaurants, caterers, offices, manufacturers, and retailers. Third-party profile and funding stories
              stretch that network claim further to roughly 3 million retailers, 25,000 suppliers, and 30,000 sellers.
              Those numbers are useful for understanding the breadth of the ecosystem, but they should not be read as
              current active buyers or current daily transactors.


              The more defensible current-demand lens comes from recent Economic Times reporting, which says Udaan
              serves more than 200,000 retail outlets from more than 25 warehouses across 16 cities. That is a much
              smaller number than the official “millions” framing, but it is also much closer to an operating footprint.
              Put differently, Udaan appears to have a wide registered or addressable network and a narrower active
              service layer concentrated in city clusters. That distinction matters because the customer book seems
              strongest where replenishment is frequent and logistics density is high: FMCG and staples-led kiranas,
              chemists, HoReCa buyers, and small offices that value credit, next-day delivery, and reliable assortment
              more than marketplace novelty.
