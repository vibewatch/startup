      - number: '3.2'
        title: Direct peers and consolidating rivals
        blocks:
          - type: paragraph
            body: >-
              Jumbotail deserves to be treated as the closest one-to-one competitor. Its official stack is structurally
              similar to Udaan’s: marketplace demand aggregation, owned supply chain and next-day delivery, fintech-led
              payments and SME lending, and a retail operating system for J24 stores. The June 2025 Series D plus Solv
              acquisition materially sharpened that profile by adding a larger merchant and seller surface, more cities
              and towns, and a stronger credit-and-verified-supplier narrative. That does not prove superior
              economics—FY23 revenue was only ₹819 crore and losses widened to ₹264 crore—but it does show why Jumbotail
              is strategically dangerous: it is no longer just another grocery app, but a fuller merchant-infrastructure
              platform with brand GTM ambitions.


              ElasticRun is a meaningful overlap player but not the same shape. Its official materials emphasize
              fulfilment infrastructure, multi-speed delivery, dark stores, warehouses, and pan-channel distribution
              rather than a simple eB2B app. Moneycontrol still frames the company around rural FMCG distribution across
              400 brands, 80,000 villages, and 26 states, while Inc42 shows the newer quick-commerce turn with 800 dark
              stores. That gives ElasticRun real distribution power, yet it also muddies the thesis: the business is
              defending runway, has been marked down by HSBC to about $800 million implied valuation, and appears to be
              balancing logistics-network monetization against a more direct retail-combat posture.
