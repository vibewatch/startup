      - number: '2.2'
        title: Buyer map, budget owner, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The dominant buyer archetype is still the owner-managed kirana or neighborhood retailer. For this
              customer, the buyer, user, and payer are often the same person or a very small team, and the adoption
              trigger is practical rather than strategic: better fill rate, a wider basket from one app, faster
              restocking, formal invoices, and sometimes access to working capital. Chemists sit in a related but
              distinct workflow because therapeutic assortment, expiry discipline, and compliance matter more than pure
              basket breadth. HoReCa outlets are different again: order cadence can be lumpy, basket values are larger,
              and service reliability matters more than broad consumer-style assortment. These distinctions matter
              because Udaan’s addressable demand is not one homogeneous SMB blob.


              Digital readiness is improving, but incompletely. India’s kirana base still numbers in the tens of
              millions, and KPMG explicitly says only 63 percent of retailers are interested in digital payments. That
              is enough to support long-run digitization, but it also means onboarding and retention remain operational
              problems, not just software distribution problems. Public-company comparator evidence from IndiaMART helps
              anchor this point: Indian SMEs clearly do buy and sell through online B2B platforms, and public investors
              recognize the model, but the disclosure-heavy classified marketplace model is not identical to Udaan’s
              inventory-and-logistics-intensive commerce layer. For Udaan, the buyer map should therefore be segmented
              by workflow and budget owner first, not by a generic SME label.
            claimRefs:
              - CM007
              - CM008
              - CM015
