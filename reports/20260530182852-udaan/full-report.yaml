      Udaan’s main risks transmit through funding, service reliability, and customer repeat economics into valuation and
      strategic flexibility.
    data:
      nodes:
        - id: funding
          label: Debt / equity support
          detail: External capital and lender support still stabilize the model.
        - id: inventory
          label: Inventory + credit intensity
          detail: Working capital is tied to stock, receivables, and vendor payments.
        - id: ops
          label: Warehousing and service execution
          detail: 25+ warehouses, micro-fulfilment, and local delivery quality are critical.
        - id: friction
          label: Onboarding / returns friction
          detail: Review evidence and broken policy pages point to trust leakage.
        - id: retention
          label: Merchant repeat and wallet share
          detail: Repeat economics are the operating core of the cluster model.
        - id: margin
          label: Contribution margin and burn
          detail: Service quality and density directly affect cash conversion.
        - id: valuation
          label: Valuation / IPO optionality
          detail: Public-market readiness depends on durable economics and cleaner governance.
        - id: competition
          label: Quick-commerce and substitutes
          detail: Margin pressure remains live even if target segments differ.
        - id: legal
          label: Reverse flip and compliance execution
          detail: Entity simplification and regulatory hygiene shape strategic flexibility.
      edges:
        - from: funding
          to: inventory
          label: Supports stock and receivable needs
        - from: inventory
          to: ops
          label: Drives warehouse and fulfilment requirements
        - from: ops
          to: friction
          label: Execution failures appear as merchant pain
        - from: friction
          to: retention
          label: Poor resolution reduces repeat trust
        - from: retention
          to: margin
          label: Repeat behavior determines density economics
        - from: margin
          to: valuation
          label: Cash generation influences market credibility
        - from: competition
          to: retention
          label: Alternatives pressure wallet share
        - from: competition
          to: margin
          label: Price competition compresses unit economics
        - from: legal
          to: valuation
          label: IPO and governance timeline depend on execution
        - from: funding
          to: valuation
          label: Repeated raises shape investor leverage
