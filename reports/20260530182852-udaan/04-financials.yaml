  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized category-level gross margins, fee schedules, discount ladders, take-rate history, and service-fee attach rates.
    whyItMatters: Public sources identify monetization lines but do not show whether Udaan’s improving contribution margins come from better price realization, lower discounts, better mix, or temporary cost relief.
    diligencePath: Request category P&Ls, price books, commission tables, and monthly contribution-margin bridges by core category and service line.
    relatedQuestionRefs:
    - QI004
    - QI019
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway-gap
    missingEvidence: Current unrestricted cash, restricted cash, monthly burn, debt schedule, covenant package, and a management runway model.
    whyItMatters: Capital adequacy cannot be judged from gross capital raised alone, especially for an inventory-led business that still reports large losses and negative operating cash flow.
    diligencePath: Request the latest monthly MIS, treasury report, debt agreements, covenant tracker, and a downside runway case that includes slower margin improvement.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: working-capital-gap
    missingEvidence: Credit-loss cohorts, delinquency buckets, write-offs, recovery curves, inventory aging, payable days, receivable days, and inventory turns.
    whyItMatters: Embedded credit and merchandising intensity can destroy economics even when reported EBITDA burn is falling, so these metrics are necessary to test whether the turnaround is durable.
    diligencePath: Request lending vintage data, portfolio performance by cohort, inventory aging reports, and a working-capital bridge by category and cluster.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI003
    - TI004
  - type: conflicting-data
    severity: material
    topic: filing-reconciliation-gap
    missingEvidence: Raw consolidated statements and a legal-entity bridge connecting Trustroot, Hiveloop, Udaan India, and any financing entities used in public reporting.
    whyItMatters: Registry compilers point to different legal entities and non-comparable revenue figures, so public filing-derived products are not a safe substitute for audited consolidated accounts.
    diligencePath: Obtain audited consolidated financial statements, statutory filings for each major entity, and management’s own reporting-perimeter memo.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: disclosure-surface
    missingEvidence: A public or diligence-room investor-relations archive with annual reports, board-approved financial packs, lender materials, and management presentations.
    whyItMatters: The chapter can document direction of travel, but it cannot convert that direction into an investable underwriting model while relying mainly on media summaries and registry compilers.
    diligencePath: Request a full data room covering annual reports, monthly management packs, financing documents, and investor updates tied to the IPO preparation process.
    relatedQuestionRefs:
    - QI015
    - QI017
    - QI019
    relatedTableRefs:
    - TI005
