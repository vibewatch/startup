- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why public data is insufficient
  - Impact on judgment
  - Exact diligence path
  rows:
  - - Cash on hand and runway months
    - Financing announcements disclose gross capital raised, not current liquidity.
    - Capital adequacy cannot be underwritten precisely.
    - Request latest monthly cash report, unrestricted cash, and runway model.
  - - Debt schedule and covenants
    - Debt amount is public, but tenor, pricing, security, and covenants are not.
    - Hard to judge refinancing or default sensitivity.
    - Request lender agreements and covenant tracker.
  - - Realized take rate and fee stack
    - Revenue streams are named, but fee levels and discounting are undisclosed.
    - Revenue quality cannot be separated from merchandise pass-through cleanly.
    - Request category-level take-rate, fee, and discount history.
  - - Category gross margins
    - Traded goods dominate economics, but category margins are not public.
    - Gross-profit durability remains unknown.
    - Request by-category P&Ls and markdown bridge.
  - - Credit losses and repayment cohorts
    - udaanCapital is public, but loss curves and recoveries are not.
    - Embedded finance could be value-creating or value-destructive.
    - Request vintage curves, PAR buckets, and write-off policy.
  - - Inventory turns and working-capital cycle
    - Public reporting does not disclose inventory aging, payable days, or receivable days.
    - Merchandising intensity cannot be stress-tested.
    - Request inventory aging, DOH, DPO, and DSO by category.
  - - Entity-level reconciliation
    - Registry compilers point to different legal entities and non-comparable revenue figures.
    - Consolidated reporting perimeter is not clean from public data alone.
    - Request audited consolidated statements and legal-entity bridge.
  - - Public investor-relations archive
    - Official web surfaces emphasize marketing and newsroom content rather than downloadable statements.
    - External diligence depends too heavily on media summaries.
    - Request board packs, annual reports, and management presentations.
  notes: These are the highest-value public gaps left after exhausting the available source set. They are the minimum data-room asks needed to turn the chapter from directional to underwritable.
