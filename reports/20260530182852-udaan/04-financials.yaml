    - Cash burn remained large even after expense cuts.
    - Request monthly CFO and free-cash-flow bridge.
  - - Spend to earn ratio
    - ₹1.3 spent per ₹1 of operating revenue in FY24
    - medium
    - Simple public proxy for unit-economics strain.
    - Request contribution margin by cohort and order density.
  - - Cost of materials share
    - 75.3% of FY24 expenses
    - medium
    - Confirms merchandise economics dominate cost structure.
    - Request category mix and landed-margin analysis.
  - - Employee cost reset
    - Employee costs fell to ₹643 crore; employee benefits down 35.4%
    - medium
    - Shows how much of the repair came from resizing the org.
    - Request headcount bridge and productivity per cluster.
  - - Logistics efficiency
    - Logistics and packaging costs down 16.8%
    - medium
    - Fulfilment density is central to whether clusters truly improve economics.
    - Request drop-density, delivery-cost, and fill-rate trends.
  - - Contribution margin trend
    - +300 bps in CY24 and +100+ bps in 2025 YTD (company claim)
    - high
    - Best public forward indicator that the smaller footprint may be structurally better.
    - Request audited definition and monthly history.
  - - EBITDA burn trend
    - -40% in CY24; company says ~40% annual reduction for three years
    - high
    - Core test of whether the turnaround is durable or only a one-off reset.
    - Request monthly burn by entity and cluster.
  - - Profitability target
    - Group EBITDA profitability targeted within about 18 months
    - high
    - Sets the timeline management is implicitly asking investors to underwrite.
    - Request assumptions behind the target and downside sensitivities.
  - - Credit losses / inventory turns
    - Not publicly disclosed
    - low
    - Without these metrics, public unit-economics analysis remains incomplete.
    - Request vintage loss curves, inventory aging, and working-capital turns.
  notes: Nulls here are genuine public-data absences, not omitted research. The available unit-economics signals are mostly management commentary plus a handful of filing-linked FY24 ratios.
