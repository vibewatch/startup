- id: cost-structure-and-unit-economics
  title: Cost structure, burn reduction, and unit-economics proxies
  body: |-
    The strongest public evidence is on cost repair rather than on revenue quality. FY24 net loss was ₹1,674.1 crore on ₹7,407.6 crore of total expenses, with operating cash flow still negative at ₹920.5 crore and EBITDA margin still deeply negative at -37.13%. The core operating problem is visible in the mix: cost of materials alone represented 75.3% of expenses and rose to ₹5,576.8 crore, so Udaan could not cut its way to health purely through overhead trimming. What it did accomplish was a broad reset across controllable lines. Employee costs reportedly fell to ₹643 crore, employee benefits fell 35.4%, and logistics and packaging fell 16.8%, showing that the company’s path to lower burn came from resizing the operating footprint around fewer, denser clusters.

    FY25 reporting suggests that the reset continued. Snackfax and later Economic Times reporting put FY25 revenue at ₹4,561.4 crore and loss at ₹1,055.4 crore, meaning the business became materially smaller while removing about ₹619 crore of annual loss. Management’s own commentary is more optimistic than the statutory line items, but directionally useful: contribution margin up 300 basis points in CY24 and another 100-plus basis points in 2025 year to date, fixed costs down 20% in 2024 and another 20% in 2025 year to date, and EBITDA burn down 40% in 2024. Those signals support a smaller-but-leaner thesis. They do not yet prove durable profitability, especially because Entrackr still calculates that Udaan spent about ₹1.3 to earn ₹1 of operating revenue in FY24 and because public sources do not disclose credit losses or inventory turns.
