- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - FY24 EBITDA margin
    - -37.13%
    - medium
    - Shows the core business was still far from breakeven before the latest reset fully flowed through.
    - Request monthly bridge from FY24 exit rate to current margin.
  - - FY24 operating cash flow
    - -₹920.5 crore
