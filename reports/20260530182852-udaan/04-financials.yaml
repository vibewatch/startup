tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / base
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Sale of traded goods
    - Udaan buys or controls merchandise flow and books traded-goods sales through the commerce stack.
    - FY24 GMV / top-line base
    - Entrackr says traded goods formed 98.5% of FY24 GMV.
    - High importance, but confirms the model is inventory-led rather than fee-light.
    - Request category-level gross margin, markdown, and returns data.
  - - Platform fees
    - Charges on digital ordering or platform usage.
    - Fee line
    - Mentioned in filing-linked reporting, but not broken out publicly.
    - Low visibility.
    - Request product-wise fee schedules and percentage of revenue.
  - - Logistics services
    - Fulfilment and delivery-related service income.
    - Per order / per shipment
    - Disclosed as a revenue stream, but no rate card or mix detail is public.
    - Low visibility.
    - Request delivery fee architecture and pass-through policy.
  - - Credit services
    - Interest or service income tied to financing and collections.
    - Loan book / fee line
    - Publicly referenced, especially through udaanCapital, but not quantified.
    - Medium strategic relevance, low transparency.
    - Request NIM, take rate, and credit-loss cohort data.
  - - Advertising / promotion
    - Brand or seller placements on platform.
    - Campaign / placement
    - Mentioned in filing-linked recap only.
    - Likely small and non-core.
    - Request annual run rate and top advertisers.
  - - Scrap / returned goods disposal
    - Sale of returned goods as scrap.
    - Recovery value
    - Disclosed as a minor revenue line in Entrackr’s recap.
    - Low quality and likely episodic.
    - Request annual recoveries and returns rate.
  - - Collection services
    - Fees related to collecting credit-linked transactions.
    - Collection event
    - Mentioned publicly, but economics not disclosed.
    - Medium relevance for cash conversion.
    - Request fee logic and delinquency-adjusted yield.
  - - Loan-processing fees via udaanCapital
    - Processing income on disbursals originated through the financing arm.
    - Loan disbursal
    - Publicly acknowledged without scale disclosure.
    - Useful optionality, but immateriality cannot be ruled out.
    - Request disbursal volume, fee rate, and partner-lender mix.
  notes: Public evidence is good enough to map the monetization architecture, but only the traded-goods line has a meaningful disclosed scale indicator; the rest require management disclosure.
