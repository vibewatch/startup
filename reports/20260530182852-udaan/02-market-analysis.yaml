  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: Public sources do not break out Udaan’s active outlets, category GMV mix, city density,
      or share inside retailer-led eB2B by FMCG, pharma, and HoReCa.
    whyItMatters: Without that operating map, large retail or eB2B market numbers cannot be translated
      into a defendable company-specific SAM or SOM.
    diligencePath: Request internal cohort data by city, category, active buyer count, wallet share, and
      merchant retention so the market map can be narrowed from retailer-led eB2B into Udaan’s actual
      served footprint.
    relatedQuestionRefs:
    - QM007
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: foodservice-market
    missingEvidence: Mordor, IMARC, and Fortune publish materially different foodservice base-year and
      forecast values, and the public extracts do not fully harmonize sector definitions, outlet coverage,
      or inclusion criteria.
    whyItMatters: HoReCa is strategically relevant to Udaan, but using a single publisher estimate without
      method normalization could overstate or understate the segment by tens of billions of dollars.
    diligencePath: Obtain the full methodologies or standardized definitions behind each foodservice report
      before selecting any one lens for valuation or target setting.
    relatedQuestionRefs:
    - QM018
    - QM019
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: credit-gap
    missingEvidence: Public materials do not disclose delinquency, loss rates, cohort repayment curves,
      lender economics, or balance-sheet exposure for Udaan-linked merchant credit.
    whyItMatters: Credit can improve adoption and wallet share, but it can also destroy unit economics
      if defaults, funding costs, or regulatory capital needs are mispriced.
    diligencePath: Request partner-lender agreements, delinquency buckets, recovery curves, underwriting
      criteria, and net revenue contribution for financing products tied to merchant orders.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM004
