tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Kirana FMCG replenishment
    - Staples, packaged foods, personal care, household essentials, and other recurring store-restock
      baskets
    - End-consumer baskets, quick-commerce consumer GMV, modern-trade self-sourcing
    - Owner-managed kirana or small retailer paying from store working capital
    - Core demand pool; general trade still dominates Indian retail and grocery
  - - Independent chemist procurement
    - Prescription and OTC inventory ordered for independent pharmacies and small chains
    - Hospital tenders, large-chain centralized procurement, manufacturer institutional deals
    - Chemist owner or pharmacy purchaser paying from store cash cycle or trade credit
    - Relevant because fragmented chemist channels still matter and digitization is rising
  - - HoReCa / foodservice restocking
    - Restaurants, hotels, cafés, caterers, and cloud-kitchen supply baskets
    - Consumer delivery GMV, dine-in consumer spending itself, large-hotel direct contracts
    - Outlet owner, chef, or procurement manager
    - Relevant adjacency for horeca360, but public market estimates vary sharply by methodology
  - - Merchant-linked working capital
    - Trade-credit or embedded-finance products tied directly to replenishment orders
    - Standalone unsecured SME lending unrelated to inventory turns
    - Merchant borrower; lender or partner bank funds balance sheet
    - Important monetization and retention lever, but regulated and credit-sensitive
  - - Regional wholesaler or reseller procurement
    - Selective bulk buying by small wholesalers, sub-stockists, or reseller clusters
    - Large national wholesale contracts and pure cash-and-carry without platform intermediation
    - Wholesale proprietor or purchasing lead
    - Adjacent rather than central; Redseer says retailer-led platforms dominate the current eB2B mix
  - - Excluded demand outside direct scope
    - None—this row marks boundary exclusions only
    - Total consumer retail, all connected commerce, generic marketplace advertising, and unrelated fintech
      volumes
    - No direct Udaan buyer/payer
    - Necessary to avoid turning every large India retail number into a Udaan TAM proxy
  notes: This table defines Udaan’s relevant market around merchant procurement and adjacent financing
    rather than end-consumer demand. Included categories are ordered flows where assortment, fill rate,
    invoice quality, and working-capital timing matter.
