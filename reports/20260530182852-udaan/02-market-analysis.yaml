- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - user
  - payer
  - workflow
  - budget owner
  - adoption trigger
  rows:
  - - Independent kirana
    - Store owner or family operator
    - Same person or one store clerk
    - Store cash cycle or trade credit
    - Daily or near-daily FMCG replenishment
    - Owner-managed working-capital budget
    - Better fill rate, one-stop basket, formal invoices, and sometimes credit
  - - Neighborhood mini-market / small chain
    - Store manager or cluster buyer
    - Store staff across a few outlets
    - Local operating manager or owner
    - High-frequency replenishment with modest process discipline
    - Local P&L owner
    - SKU breadth, logistics reliability, and fewer supplier touchpoints
  - - Independent chemist
    - Pharmacy owner or purchaser
    - Pharmacist and store team
    - Store working capital with compliance sensitivity
    - Therapy-specific ordering with expiry and compliance discipline
    - Owner or designated purchaser
    - Assortment reliability, branded-generic availability, and predictable delivery
  - - Restaurant / café / hotel outlet
    - Outlet manager, chef, or procurement lead
    - Kitchen and service operations
    - Outlet P&L or proprietor
    - Lumpy but larger baskets; service-quality-sensitive
    - Outlet owner or procurement lead
    - Vendor consolidation, freshness, and predictable fulfillment windows
  - - Small wholesaler / reseller cluster
    - Wholesale proprietor
    - Sales team or local resellers
    - Wholesale float and receivables cycle
    - Bulk buying for onward sale
    - Owner-managed inventory budget
    - Price arbitrage, assortment breadth, and credit access
  notes: Udaan’s buyer map is operationally heterogeneous. Kiranas dominate count, but chemists and HoReCa
    have different compliance, basket, and service-level needs; this is why a single SME persona is too
    coarse for underwriting.
