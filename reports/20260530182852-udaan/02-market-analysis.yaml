- id: section-constraints-contradictions-and-diligence-gaps
  title: Constraints, contradictory estimates, and the remaining diligence burden
  body: |-
    The main adverse force is not lack of digital demand; it is whether that demand accrues to merchant-procurement platforms on attractive economics. Quick commerce is the clearest example. KPMG, IBEF, and Redseer all show a channel growing at extraordinary speed, but Redseer also shows that city-level unit economics vary materially and that some non-metro stores remain below breakeven utilization. PolicyCircle adds the merchant perspective: distributor groups and policymakers now frame deep discounting as a survival threat for kiranas, not just a competitive nuisance. For Udaan, this means digital behavior can deepen while merchant economics weaken, which is a bad combination for platform monetization and credit quality.

    The second constraint is methodological rather than competitive. Foodservice estimates differ so widely across Mordor, IMARC, and Fortune that they are useful only as scenario bounds. The same problem exists in eB2B, where Redseer’s $90-100 billion lens and IBEF’s $200 billion lens clearly use different boundaries. Finally, the company-specific underwriting gap remains large: public sources still do not break out Udaan’s category mix, city density, active-outlet cohorts, or financing losses well enough to convert large market narratives into a clean SAM or SOM. The chapter therefore supports a positive demand backdrop, but not a precision-sized market-share story.
