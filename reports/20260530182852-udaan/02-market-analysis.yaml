chapter:
  number: 2
  title: Market Analysis
  summary: 'Udaan’s relevant market is India’s fragmented merchant-procurement layer rather than the full
    trillion-dollar retail economy. The right sizing map starts with a $1.06 trillion retail sector and
    narrows through general trade into a retailer-led eB2B opportunity of roughly $63-80 billion by 2030,
    but adjacent category lenses remain intentionally inconsistent: FMCG is a $289 billion market in 2025,
    pharma is a $55 billion market growing toward $120-130 billion, and foodservice spans $56-114 billion
    for the same 2025 base depending on publisher methodology. The buyer map is operationally diverse—kiranas,
    chemists, and HoReCa outlets have different budget owners and adoption triggers—while the key constraints
    are incomplete small-retailer digitization, quick-commerce margin pressure, and the still-unanswered
    question of Udaan’s exact city-density and credit quality.'
sections:
- id: section-market-boundary-and-sizing-lenses
  title: Market boundary, sizing lenses, and what not to count
  body: |-
    Udaan should be framed inside India’s fragmented retailer-procurement system, not as a claim on the entirety of Indian retail or all e-commerce. The included spend is recurring replenishment for small merchants—especially kirana FMCG baskets, independent chemist inventory, and HoReCa procurement where assortment, fill rate, invoice quality, and working-capital timing matter. Excluded spend includes end-consumer retail demand, marketplace take rates unrelated to inventory replenishment, modern-trade chains that self-source at scale, and quick-commerce GMV that reflects consumer delivery rather than merchant restock demand. The core substitute set is still traditional wholesale, distributor sales reps, cash-and-carry, and informal credit, with digital procurement only gradually displacing those flows.

    The right sizing approach is therefore multi-lens and explicitly non-harmonized. Top-down retail lenses range from about $950 billion today to $1.06 trillion in 2024 and roughly $1.93 trillion by 2030, but those are demand envelopes rather than direct Udaan TAM. Inside that, Redseer’s eB2B lens reaches $90-100 billion by 2030, while IBEF’s broader B2B marketplace lens reaches $200 billion; they should not be treated as the same market. Category-specific lenses matter too: FMCG alone is hundreds of billions of dollars, pharma is a $55 billion market growing toward $120-130 billion, and foodservice estimates span $56 billion to $114 billion for 2025 depending on methodology. The underwriting conclusion is that Udaan has exposure to very large end markets, but no single public number cleanly measures its own accessible revenue pool.
