  summary: Udaan sits inside a very large retail base, but the relevant lens narrows from India retail
    to general trade to eB2B procurement and then to retailer-led eB2B where its core merchants sit.
  data:
    nodes:
    - label: 'India retail demand: ~US$1.06T (2024) to ~US$1.93T (2030)'
      detail: Deloitte-FICCI top-down retail-sector lens; useful as outer boundary only.
      tone: positive
    - label: 'General-trade-heavy channel base: ~83% of retail overall; >90% of grocery'
      detail: Redseer/Business Standard channel-mix lens showing why Udaan’s buyers still sit in fragmented
        offline retail.
      tone: neutral
    - label: 'India eB2B procurement: ~US$90-100B by 2030 from ~US$5-6B in 2022'
      detail: Redseer eB2B outlook; shows why merchant-procurement platforms matter as a distinct sub-market.
      tone: positive
    - label: 'Retailer-led eB2B subset: ~US$63-80B by 2030'
