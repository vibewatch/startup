- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - GST formalization and invoice discipline
    - Positive but frictional
    - Current
    - Supports organized procurement and digital records, but raises accounting and compliance workload
      for small merchants
    - Request category-level evidence on how much invoice quality actually changes merchant retention
  - - UPI and merchant digital-payments expansion
    - Positive
    - Current to medium term
    - Lowers transaction friction and habituates merchants to digital reconciliation
    - Quantify what share of Udaan orders and repayments already settle through digital rails
  - - ONDC and open-network readiness
    - Positive
    - Medium term
    - May reduce dependence on closed ecosystems and improve merchant discoverability
    - Test whether ONDC meaningfully changes acquisition cost or only expands optionality
  - - Quick-commerce growth
    - Mixed
    - Current
    - Accelerates digital ordering and category awareness, but can compress merchant margins and pull
      demand away from store-led replenishment
    - Measure overlap between Udaan’s highest-value merchants and quick-commerce-heavy neighborhoods
  - - Non-metro subscale economics
    - Negative
    - Current
    - Below-breakeven dark-store utilization in some cities implies digital demand does not automatically
      equal good unit economics
    - Map order density, average basket, and route economics city by city
  - - Merchant working-capital and credit regulation
    - Negative
    - Current
    - Credit can deepen wallet share but remains balance-sheet, lender, and regulatory sensitive
    - Request NPA, delinquency, lender-partner, and take-rate disclosure for Udaan credit products
  - - Category-specific compliance in pharma and foodservice
    - Mixed
    - Current
    - Quality, expiry, and service requirements can support stickiness but also raise execution burden
    - Ask for service-level metrics and category margin by pharma and HoReCa cohorts
  notes: The highest-conviction driver is digital formalization; the highest-conviction constraint is
    that digitization does not eliminate working-capital and fulfillment complexity. This is why market
    growth should not be read as automatic operating leverage.
