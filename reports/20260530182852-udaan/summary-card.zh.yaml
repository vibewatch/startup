summary:
  headline: 观察：Udaan 的扭转已足够可信，能支撑情景法下 $1.4-1.9B 的基准估值，但当前 $1.8B 标记并不是安全边际很宽的入场点；收入质量仍由自营库存驱动，关键现金跑道、信用和稀释输入仍未披露。
