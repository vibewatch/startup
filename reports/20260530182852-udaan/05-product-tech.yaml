  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-support-docs
    missingEvidence: Working public help-center, returns-policy, and RTO-policy pages with escalation steps and SLA language.
    whyItMatters: Support and reverse-logistics quality can materially affect retailer trust, yet the public site leaves those processes under-documented.
    diligencePath: Request live help-center URLs, return and RTO SOPs, support-channel matrix, and complaint-resolution SLA or backlog metrics.
    relatedQuestionRefs:
    - QE014
    - QE015
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: architecture-stack
    missingEvidence: Actual application stack, observability tooling, uptime history, disaster-recovery posture, and incident-management workflow.
    whyItMatters: The chapter can map operating layers, but not validate technical robustness or operating resilience without engineering evidence.
    diligencePath: Request system architecture diagrams, vendor inventory, monitoring stack, status-page history, and recent Sev1 or Sev2 postmortems.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: certification-surface
    missingEvidence: Public security, payment, quality, or regulatory certifications with scope, dates, and owners.
    whyItMatters: Without audit-grade evidence, trust assessment rests mostly on policy copy, org ownership, and platform distribution rather than hard certification proof.
    diligencePath: Request ISO, SOC, PCI, quality, or sector-license documents and map each to platform scope and renewal status.
    relatedQuestionRefs:
    - QE011
    - QE026
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: shopkirana-integration-roadmap
    missingEvidence: Technical integration timeline for catalogs, seller tooling, credit products, fulfilment, and private-label sourcing after the ShopKirana deal.
    whyItMatters: The strategic rationale is public, but execution risk cannot be sized without milestones or system-cutover evidence.
    diligencePath: Request post-merger integration plan, system owners, milestone dates, and a synergy scorecard covering sourcing, credit, and fulfilment.
    relatedQuestionRefs:
    - QE019
    - QE020
    relatedTableRefs:
    - TE001
    - TE005
