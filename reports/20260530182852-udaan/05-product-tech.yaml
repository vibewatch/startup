- id: module-stack-and-operating-architecture
  title: Module stack and operating architecture
  body: |-
    Public evidence suggests that Udaan’s real architecture is an operating architecture spanning apps, category control, credit, and fulfilment rather than a disclosed software-stack diagram. The Google Play listing and 2025 company-backed funding coverage both emphasize the micro-market or cluster model, while independent reporting describes Udaan as buying in bulk and supplying kiranas and small retailers through a warehouse network. Together, those signals imply a layered stack: buyer interfaces on mobile, identity and KYC controls, catalog and pricing workflows, embedded credit or payments, warehouse and delivery orchestration, and market-density controls that decide where inventory and service levels can work economically.

    The org chart reinforces that interpretation. Udaan publicly names ownership across product management, engineering, IT and security, policy, udaanCapital, and horeca360. That is enough to map responsibilities, dependencies, and likely control points, but not enough to identify languages, cloud architecture patterns, databases, or observability tooling. The chapter therefore treats architecture conservatively: we can credibly describe an app-led commerce and fulfilment system with finance and vertical extensions, plus a ShopKirana integration path, but we cannot truthfully infer named vendors or a microservice topology. In other words, the workflow is public, the control surfaces are public, and the exact stack is not.
