chapter:
  number: 5
  title: Product & Technology
  summary: 'Udaan’s public product surface is a retailer workflow, not a pure software tool: sign up with business details, clear GSTIN/shop-license KYC, browse FMCG or pharma inventory, order with credit, track delivery, receive goods, and repeat. The architecture that can be defended publicly is an operating stack spanning mobile apps, category control, micro-market fulfilment, udaanCapital, private labels, horeca360, and now ShopKirana integration. The main caveat is transparency: trust signals are mostly policy and process based, while public help/returns pages are broken and recent app reviews still surface onboarding, address-validation, and returns-friction complaints.'
sections:
- id: buyer-workflow-and-product-surface
  title: Buyer workflow and product surface
  body: |-
    Udaan’s public product story is clearest when read as a retailer workflow rather than as a standalone software product. The official journey begins with a quick sign-up using mobile number, business name, and pin code, followed by GSTIN or shop-license verification, and then moves directly into ordering with competitive pricing, credit, and fast delivery. Across the homepage and the iOS listing, the same loop repeats: browse across Food & FMCG and Healthcare or Pharma categories, place an order, track the shipment, receive goods at the shop, manage payments or business credit, and then use repeat-order tooling to keep replenishment friction low. This is not a generic marketplace narrative; it is a replenishment workflow tuned for kiranas, chemists, hotels, and similar small-business buyers.

    The merchandising promise is also operational rather than abstract. Udaan advertises 1600+ SKUs, private-label brands, more than 1000 premium brands in the app-store copy, mobile-only deals, and eligible-item returns. That mix matters because it shows how the buyer experience is meant to compound: assortment breadth brings the first order, mobile-only promotions and repeat orders encourage frequency, and credit plus delivery make the service sticky in categories where cash flow and fill rate matter more than discovery glamour. Public copy does not expose SKU-level pricing logic or recommendation systems, but it does consistently expose a retailer-facing loop of onboard, browse, buy, receive, and reorder.
