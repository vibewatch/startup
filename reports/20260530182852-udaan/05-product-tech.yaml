- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or signal
  - What is public
  - Scope
  - Strength today
  - Gap / caveat
  rows:
  - - KYC gate
    - GSTIN or shop-license verification is part of onboarding.
    - Retail-buyer activation.
    - Meaningful process control.
    - No fraud-loss or rejection-rate disclosure.
  - - Secure-payment claim
    - Official copy promises bank-grade security and seamless payments.
    - Checkout and settlement.
    - Useful baseline trust signal.
    - No disclosed PCI scope or audit detail.
  - - Privacy policy
    - Live policy updated 2025-05-05 covers web and mobile app, plus data sharing and collection categories.
    - Identity, transaction, and usage data.
    - Concrete and current.
    - No public retention schedule summary or third-party audit.
  - - IT / security leadership
    - Named CIO owns infrastructure, cloud, networking, and data-center operations.
    - Platform backbone and governance.
    - Shows explicit ownership.
    - Ownership is not the same as certification or control evidence.
  - - Policy / regulatory ownership
    - Named policy and corporate-affairs leader.
    - External policy, regulatory interface, and corporate governance.
    - Positive signal for a regulated operating environment.
    - No public compliance dashboard or regulator correspondence.
  - - Support surface
    - Contact page gives a recent-order escalation path.
    - Order-related complaints.
    - Minimal but real public path.
    - No working public help center, live chat, or SLA disclosure.
  - - Returns / RTO documentation
    - Returns and RTO links are advertised in navigation but their public pages return Not Found.
    - Reverse logistics and dispute handling.
    - Weak public transparency.
    - Edge-case resolution burden is pushed back to app/process evidence.
  - - Independent quality signal
    - AppBrain reviews praise packing and offers but also flag onboarding, address validation, and return-friction problems.
    - Actual buyer experience.
    - Useful external pressure test.
    - Review sampling is anecdotal and not an audited quality metric.
  notes: The public trust stack is mostly process-oriented; no standalone status page, uptime dashboard, or public security certification pack was located.
