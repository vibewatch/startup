- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role in system
  - Public evidence
  - Key dependency
  - Risk / gap
  rows:
  - - Buyer interfaces
    - Primary ordering, tracking, and repeat-order surface.
    - Official home plus iOS/Android listings.
    - App-store distribution and mobile UX.
    - No public web product walkthrough or release-note archive.
  - - Identity / KYC controls
    - Establish business legitimacy before transactions.
    - GSTIN or shop-license verification and privacy-policy registration fields.
    - Document capture, verification processes, and policy compliance.
    - False rejects or slow verification can block growth, as reviews suggest.
  - - Catalog / pricing / promotions
    - Expose assortment, pricing, and deal mechanics to buyers.
    - 1600+ SKU promise, 1000+ premium brands, mobile-only deals, private-label mention.
    - Category teams and seller/manufacturer supply.
    - No public disclosure of pricing engine, stock accuracy, or promotion logic.
  - - Order orchestration and fulfilment
    - Translate order demand into warehouse and delivery execution.
    - Micro-market strategy plus 25+ warehouses in 16 cities.
    - Warehouse network, market-density planning, and logistics partners.
    - No public on-time, fill-rate, or cancel-rate metrics.
  - - Credit / payment layer
    - Support working-capital usage and transaction completion.
    - Business-credit messaging, secure-payment claims, and udaanCapital leadership.
    - Financing partners, payment providers, and risk controls.
    - No public credit-loss, APR, or fraud-control disclosure.
  - - Support / returns loop
    - Resolve order issues and reverse logistics.
    - Contact page guidance and marketed eligible-item returns.
    - Support operations, proof gathering, and reverse-logistics procedures.
    - Public help, returns, and RTO documentation is incomplete.
  - - Governance and policy layer
    - Own IT/security, engineering, product, and regulatory process control.
    - Named product, engineering, CIO, and policy leaders.
    - Internal governance and compliance execution.
    - Ownership is visible, but tooling and certifications are not.
  - - Post-acquisition integration layer
    - Absorb ShopKirana network and capabilities into Udaan.
    - Public claims around sourcing, credit, and supply-chain integration.
    - Catalog, seller, credit, and operations harmonization.
    - No public integration plan or systems roadmap.
  notes: 'Architecture here means operating architecture: control points and dependencies visible from public evidence, not an asserted software-stack diagram.'
