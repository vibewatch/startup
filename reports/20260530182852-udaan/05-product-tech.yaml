tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - What is public
  - Status / maturity
  - Differentiation lens
  - Diligence gap
  rows:
  - - Marketplace buying app
    - Retailers and small businesses
    - Browse categories, order, track deliveries, manage repeat orders, payments, and credit.
    - Live and broadly distributed on iOS and Android.
    - App-first replenishment loop for Bharat retail buyers.
    - No public web demo, API, or workflow analytics.
  - - Category and assortment engine
    - Retail buyers and category teams
    - Food & FMCG, staples, fruits & vegetables, healthcare & pharma, plus premium-brand and private-label merchandising.
    - Live; category scope consistently repeated across official surfaces.
    - Combines broad assortment with price, private label, and mobile-deal hooks.
    - No public SKU-level catalog export, pricing logic, or search-quality metrics.
  - - Fulfilment and micro-market operations
    - Retailers, warehouses, field ops
    - 25+ warehouses, 16 cities, 200k+ outlets, cluster-led micro-market model.
    - Operational and scaled, but publicly described through business coverage rather than technical docs.
    - Density and service quality depend on local market clustering, not national blanket coverage.
    - No published SLA, fill-rate, or on-time-delivery metrics.
  - - Business credit / udaanCapital
    - Retailers, brands, manufacturers
    - Flexible financing in buyer copy; tech-led supply-chain financing platform in about-page leadership copy.
    - Live module with dedicated leadership.
    - Credit is embedded inside the replenishment workflow instead of being a separate fintech destination.
    - No public APRs, delinquency metrics, or lender-partner breakdown.
  - - Private-label program
    - Retail buyers and category P&L owners
    - Homepage and 2025 funding stories highlight private-label staples and owned everyday products.
    - Active and expanding, but limited public detail.
    - Supports margin and assortment control in high-frequency categories.
    - No public brand list, quality scorecard, or private-label revenue mix.
  - - horeca360 by udaan
    - Hotels, restaurants, caterers
    - Separate business-line leadership plus repeated HoReCa expansion messaging in 2025 capital stories.
    - Strategic vertical with live market focus.
    - Suggests vertical workflows rather than one-size-fits-all retail procurement.
    - No public feature sheet, customer references, or order-volume disclosure.
  - - ShopKirana integration
    - Combined sourcing, sales, and operations teams
    - All-stock acquisition framed around FMCG sourcing, credit, supply chain, and retailer-network integration.
    - Announced; execution underway, not publicly decomposed.
    - Adds depth in high-frequency FMCG and kirana distribution where Udaan already claims strength.
    - No public PMI timeline, system cutover plan, or synergy scorecard.
  notes: Rows combine official product copy, leadership disclosures, and 2025 coverage to map modules; maturity is public-evidence maturity, not internal build status.
