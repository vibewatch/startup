- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk / constraint
  - Impact
  - Diligence path
  rows:
  - - Micro-market density and wallet share
    - Model depends on city-level density rather than even nationwide penetration
    - Can create strong repeat economics in winning clusters but weaker economics elsewhere
    - Request cluster-level GMV, active buyers, repeat rate, and contribution margin by city
  - - FMCG and staples depth
    - Customer evidence is heavily concentrated in FMCG, staples, and general trade after non-core exits
    - Raises category concentration risk if grocery demand weakens or competition intensifies
    - Request revenue and gross-margin mix by category before and after portfolio rationalization
  - - ShopKirana Tier 2 / 3 reach
    - Acquisition adds merchant reach but does not yet prove combined-entity retention
    - Could deepen land-and-expand in smaller cities if integration works; could also distract ops
    - Request merchant overlap, retention after migration, and city-level synergy realization
  - - Credit, low minimum orders, and fast delivery
    - Embedded finance and low MOQs can lift share of wallet, but attach rates and credit losses are undisclosed
    - Potentially strong expansion loop; risk if credit quality deteriorates
    - Ask for credit attach rate, delinquency, repayment behavior, and repeat by credit cohort
  - - Supply-side breadth and VOC process
    - Large seller or vendor network is claimed, but top-seller concentration and vendor churn are not public
    - Assortment resilience could be overstated if a few suppliers dominate fill rate
    - Request top-20 seller GMV share, active seller count, and annual seller retention
  - - Support and reverse-logistics policies
    - Returns and undelivered-shipment rules place material evidence and timing burden on buyers
    - Friction can suppress satisfaction even when assortment and pricing are strong
    - Request return approval rates, refund turnaround, false-reject rate, and complaint reopen rate
  - - Top-customer opacity
    - No public top-account, NRR, or contract-duration disclosure
    - Impossible to underwrite concentration or durability with institutional confidence
    - Request top-20 customer revenue share, tenure, category mix, and renewal history
  notes: Expansion mechanics are visible, but concentration remains under-disclosed at both the demand side and the supply side.
