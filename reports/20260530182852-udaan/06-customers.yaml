      label: Claimed network reach
      detail: Millions of small businesses and a 3M+ retailer narrative set the top of funnel.
    - id: serviceable
      label: Serviceable outlet base
      detail: Recent reporting points to 200k+ current retail outlets served across 16 cities.
    - id: daily
      label: Daily transacting buyers
      detail: 2024-2025 company-backed coverage says daily buyers and daily transacting buyers rose sharply.
    - id: dense-city
      label: Dense micro-market city
      detail: Bengaluru is the clearest case with ~80% kirana penetration and about 15,000 daily transacting stores.
    - id: repeat
      label: Repeat and wallet share
      detail: Repeat purchase doubled YoY, monthly repeat ratio exceeded 90%, and wallet share rose 20%.
    - id: expand
      label: Category / geography expansion
      detail: Private labels, HoReCa, and ShopKirana add room for further merchant expansion.
