  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: customer-count-scope
    missingEvidence: A management-defined metric bridge from registered businesses and retailers to active outlets, daily transacting buyers, and paying sellers.
    whyItMatters: Without a scope bridge, investors can over-read millions-scale network claims as active customer counts.
    diligencePath: Request one reconciled customer KPI stack with definitions for registered buyers, monthly transacting buyers, daily transacting buyers, active sellers, and serviced outlets.
    relatedQuestionRefs:
    - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table coverage
    missingEvidence: A full public customer-story index or a management-provided reference list with customer names, tenures, and outcomes.
    whyItMatters: The public named-proof set is thin relative to claimed network scale and may overstate representativeness.
    diligencePath: Request a complete reference list of public and private customer references, then identify the top five by revenue and the top five by strategic importance.
    relatedQuestionRefs:
    - QU011
    - QU012
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: portfolio retention disclosure
    missingEvidence: NRR, GRR, logo churn, contract length, and repeat-rate cohorts by category and city.
    whyItMatters: Repeat proxies are strong, but they do not replace institutional durability metrics or reveal customer attrition beneath aggregate growth.
    diligencePath: Request quarterly retention cohorts and renewal data for the top categories, plus a bridge from repeat-order rates to revenue retention.
    relatedQuestionRefs:
    - QU017
    - QU028
  - type: missing-source
    severity: material
    topic: top-customer concentration
    missingEvidence: Top-20 customer revenue share, tenure, gross margin, and city or category concentration.
    whyItMatters: Without concentration data, the customer book cannot be underwritten for downside risk or account dependence.
    diligencePath: Request a concentration schedule by customer, category, city, and payment behavior for the last eight quarters.
    relatedQuestionRefs:
    - QU025
  - type: missing-source
    severity: material
    topic: seller concentration and retention
    missingEvidence: Top-seller GMV share, active-seller counts, seller retention, and supply-side churn or fill-rate dependence.
    whyItMatters: A marketplace with a wide claimed supplier base can still be operationally fragile if a small number of sellers drive assortment or service levels.
    diligencePath: Request seller concentration and retention data by category, including share of GMV from the top 10 and top 20 sellers.
    relatedQuestionRefs:
    - QU026
