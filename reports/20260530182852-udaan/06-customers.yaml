- id: durability-expansion-and-friction
  title: Durability, expansion, and friction
  body: 'Durability looks plausible, but the evidence sits in operating proxies instead of portfolio disclosure. On the positive side, public sources say repeat behavior is very high, wallet share is rising, minimum order sizes can be as low as INR 3,000, and more than 90% of items can reach buyers next day in some flows. ShopKirana should deepen that land-and-expand motion by adding Tier 2 and Tier 3 FMCG merchants and more retailer access for brands. The strategy is coherent: concentrate on high-frequency FMCG and HoReCa demand, increase cluster density, attach credit, and improve service economics. It is much less clear how concentrated the resulting customer book becomes by category, city, or account.


    The main negative signal is not obvious churn but under-disclosure and service friction. Udaan still does not publish NRR, GRR, logo churn, top-customer exposure, or seller concentration. The return and undelivered-shipment policies also show a fairly operationally heavy support model: one delivery attempt in many cases, extensive photo or video proof for disputed goods, 48-hour inspections after reverse pickup, and exception handling through support channels. App feedback reinforces that this matters in practice. AppBrain comments praise stronger offers and packing quality, but also cite long onboarding waits, address-validation failures, and cumbersome return documentation for damaged or near-expired goods. The customer story is therefore solid for repeat-led procurement, but still incomplete for institutional durability scoring.'
