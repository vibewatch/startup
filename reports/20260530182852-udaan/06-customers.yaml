- id: named-customer-proof-and-feedback-loops
  title: Named customer proof and feedback loops
  body: 'Named customer proof is thinner than the aggregate growth story, but it is not absent. Udaan’s homepage carousel surfaces several merchant success vignettes: Agra Potato Traders scaling digital wholesale, a Chandni Chowk rice miller expanding its customer base, a single pan-shop owner growing to multiple locations, and an ex-Army officer building an agri-business using Udaan’s network. These references are useful because they show the company intentionally marketing general-trade and agri-linked demand use cases, but they remain soft proof: the stories are title cards with outcome claims, not fully disclosed legal entities with operating metrics or contract terms.


    The best independent customer-proof source is JPMorganChase’s August 2025 story. It not only reports a 90% repeat rate across India and dense Bengaluru usage, but also mentions a family-run southern India retailer in staples and consumer goods that tripled growth using Udaan since 2019. That still is not a fully named enterprise reference, yet it is stronger than a generic logo or anecdote because it ties customer outcomes to repeat behavior, order economics, and delivery promises. On the supply side, SquadStack’s case study is also informative: Udaan ran seven campaigns and reached more than 29,000 vendors through feedback surveys, showing a serious voice-of-customer process even if it does not prove retention by itself. Overall, Udaan has real customer proof, but the public set is curated and thin relative to the platform’s claimed scale.'
