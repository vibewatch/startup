  - Strategic value / gap
  rows:
  - - Kirana / general-trade retailers
    - 'Buyer: shop owner or purchaser; User: store operator; Payer: retailer'
    - High-frequency FMCG, staples, fresh, and daily replenishment
    - Official copy, Bengaluru density stories, 200k+ outlet reporting
    - Core segment with strongest repeat and density proof; exact active-account denominator remains undisclosed
  - - Chemists / pharma outlets
    - 'Buyer: pharmacy owner; User: counter or procurement staff; Payer: pharmacy'
    - Healthcare and pharma procurement with fast delivery
    - Official homepage and app-store category copy
    - Clear segment presence, but no named pharmacy customer reference was found
  - - Hotels / restaurants / caterers (HoReCa)
    - 'Buyer: proprietor or procurement lead; User: kitchen or operations team; Payer: business'
    - Food-service sourcing plus category expansion target
    - Official copy plus Series G / ShopKirana expansion coverage
    - Important expansion vertical, but published retention or site-count data is absent
  - - Small offices / SMEs
    - 'Buyer: office administrator or owner; User: office staff; Payer: business'
    - Business purchasing for office needs and supplies
    - Official home and App Store copy
    - Shows Udaan reaches beyond retail, but no active-usage metrics were disclosed
  - - Manufacturers / suppliers / sellers
    - 'Buyer: brand or manufacturer team; User: seller / vendor operations; Payer: seller or partner side unclear'
    - Reach retailers nationwide, participate in assortment and survey loops
    - About page, Google Play, VARINDIA, Indian Retailer, SquadStack
    - Supply-side participation is large, but seller monetization and concentration are opaque
  - - Tier 2 / 3 FMCG merchants via ShopKirana
    - 'Buyer: kirana owner; User: merchant + field ops; Payer: retailer'
    - Digital procurement and last-mile fulfilment in smaller cities
    - Moneycontrol and Business of Food acquisition coverage
    - Adds expansion room in deep FMCG clusters, but post-merger retention proof is not yet public
  notes: Segmentation separates demand-side buyers from supply-side sellers and distinguishes broad network claims from denser, cluster-level operating proof.
