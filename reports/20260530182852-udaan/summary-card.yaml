  topStrengths:
    - >-
      The turnaround has real substance: FY25 loss narrowed to about ₹1,055 crore, contribution margin and burn
      improved, and the business is materially leaner than in the sprawl phase.
    - >-
      Udaan still has a tangible operating network — 16 cities, 25-plus warehouses, and more than 200,000 outlets — with
      unusually strong cluster proof in Bengaluru and high repeat proxies.
    - >-
      Category focus remains relevant to everyday merchant demand, with FMCG, staples, pharma, and HoReCa supported by
      embedded finance through udaanCapital.
    - >-
      Institutional capital has not abandoned the story: June 2025 Series G equity and October 2024 debt financing
      reopened access to funding while the company pursued a more disciplined model.
    - >-
      ShopKirana creates a plausible upside lever in FMCG sourcing, private-label depth, and Tier 2/3 merchant reach if
      integration is executed cleanly.
  topRisks:
    - >-
      The current $1.8B mark sits inside the base case but not with a wide margin of safety, so the company is easier to
      track than to underwrite aggressively at today's price.
    - >-
      Revenue quality is still dominated by inventory-led traded goods, leaving Udaan exposed to working-capital,
      logistics, and credit intensity rather than asset-light marketplace economics.
    - >-
      Reported FY25 revenue is about 20% below the FY24 base even as losses improved, so management's faster CY24
      run-rate narrative is not the same thing as audited growth reacceleration.
    - >-
      Public evidence still does not close on cash runway, covenant headroom, credit-loss performance, or cap-table
      dilution terms, which keeps both financing risk and common-equity underwriting risk high.
    - >-
      Reverse-flip completion, IPO timing, service-quality friction, and ShopKirana integration all remain
      execution-sensitive variables that could quickly move valuation lower if they disappoint.
  unresolvedGaps:
    - FY26 audited revenue, gross-margin, EBITDA, and cash-flow bridge versus FY25
    - Current cash runway, debt maturities, covenant headroom, and receivable-financing structure
    - Credit-loss, receivables-aging, and collection-performance disclosure for embedded finance
    - Cap-table preferences, anti-dilution terms, and employee-liquidity mechanics
    - City- or cluster-level contribution margins plus a post-close ShopKirana integration scorecard
