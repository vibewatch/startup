summary:
  headline: >-
    Track: Udaan's turnaround is credible enough to defend a scenario-based $1.4-1.9B base case, but the current $1.8B
    mark is not a wide-margin-of-safety entry while revenue quality remains inventory-led and key runway, credit, and
    dilution inputs are still undisclosed.
