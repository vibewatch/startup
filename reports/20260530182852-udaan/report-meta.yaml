companyProfile:
  summary: >-
    Udaan is a Bengaluru-founded 2016 B2B commerce and trade-credit platform serving India's small
    retailers and business buyers across FMCG, staples, fruits and vegetables, pharma, and HoReCa.
    After a multiyear reset, the company now operates a narrower 16-city, 25-plus-warehouse network
    serving more than 200,000 outlets, raised $114 million in Series G funding at about a $1.8
    billion valuation in June 2025, and is pursuing IPO readiness through Hiveloop consolidation
    and a reverse flip.
  foundedDate: '2016-01-01'
  founders:
    - name: Vaibhav Gupta
      role: Co-founder and CEO
      background: Operating founder leading the turnaround, reverse flip, and IPO preparation.
      claimRefs:
        - CO001
        - CO006
    - name: Sujeet Kumar
      role: Co-founder; reported board member
      background: Cofounder no longer in day-to-day operations but still part of board continuity.
      claimRefs:
        - CO001
        - CO007
    - name: Amod Malviya
      role: Co-founder
      background: Cofounder who has stepped back from day-to-day operations.
      claimRefs:
        - CO001
        - CO007
  foundingLocation: Bengaluru, India
  headquarters: Bengaluru, India
  productSummary: >-
    Mobile-led B2B procurement and supply-chain platform offering traded goods in FMCG, staples,
    fresh, and pharma, alongside logistics and working-capital-linked services through udaanCapital.
  customerFocus: >-
    Bharat kiranas, chemists, HoReCa buyers, offices, and other small business purchasers that value
    reliable replenishment, delivery density, and attached working-capital support.
  businessModel: >-
    Predominantly inventory-led B2B commerce. Traded goods dominate top-line economics, while
    platform, logistics, collection, advertising, and loan-processing fees plus embedded finance add
    secondary monetization layers.
  stage: Series G / pre-IPO
  fundingStatus: >-
    Latest disclosed equity round was the $114 million June 2025 Series G at about a $1.8 billion
    valuation, following roughly ₹300 crore of debt in October 2024. Public reporting still treats
    reverse-flip completion and cleaner audited proof as prerequisites for a credible IPO path.
