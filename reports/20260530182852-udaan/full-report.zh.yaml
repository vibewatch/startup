  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Udaan 的主要风险通过融资、服务可靠性和客户复购经济性，传导到估值和战略灵活性。
    data:
      nodes:
        - id: funding
          label: 债务 / 股权支持
          detail: 外部资本和贷方支持仍在稳定这一模式。
        - id: inventory
          label: 库存 + 信贷强度
          detail: 营运资本绑在库存、应收款和供应商付款上。
        - id: ops
          label: 仓储与服务执行
          detail: 25+ 个仓库、微履约和本地配送质量至关重要。
        - id: friction
          label: 入驻 / 退货摩擦
          detail: 评论证据和失效的政策页面指向信任流失。
        - id: retention
          label: 商户复购与钱包份额
          detail: 复购经济性是集群模型的运营核心。
        - id: margin
          label: 贡献利润率与烧钱速度
          detail: 服务质量和密度直接影响现金转化。
        - id: valuation
          label: 估值 / IPO 可选性
          detail: 进入公开市场的准备度取决于可持续经济性和更干净的治理。
        - id: competition
          label: 即时零售与替代品
          detail: 即便目标客群不同，利润率压力仍在。
        - id: legal
          label: 反向迁册与合规执行
          detail: 实体简化和监管合规清理塑造战略灵活性。
      edges:
        - from: funding
