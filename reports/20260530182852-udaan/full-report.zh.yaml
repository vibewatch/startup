      - number: '7.3'
        title: 监管、法律和依赖栈：潜在敞口多于公开失败，但边界真实存在
        blocks:
          - type: paragraph
            body: >-
              本章最重要的监管区别，是当前失败证据和潜在敞口之间的区别。就当前证据看，本轮审阅的公开记录没有显示 Udaan 遭遇大型已披露 FSSAI 或 CDSCO
              执法行动。这一点重要，因为公司仍经营食品相关和医药相关品类，管理层也继续把这些品类作为核心。但不能把没有浮出水面的执法事件过度解读为安全，因为官方边界很清楚：FoSCoS 是 FSSAI
              食品企业注册和许可的官方门户，CDSCO 自称为 Drugs and Cosmetics Act 下的中央药品监管机构，RBI 2025 Digital Lending Directions 明确监管
              RE-LSP 安排、客户保护、数据使用、申诉处理和应用报告。Udaan 同时结合品类合规、KYC 式入驻、通过 udaanCapital 做嵌入式金融以及第三方数据共享，因此它落在比简单目录应用更宽的合规面上。


              法律和依赖图景同样混合。Business Standard 和 Economic Times 称，NCLT 已批准 Hiveloop 整合，且 Singapore-to-India 反向合并是 IPO
              准备中尚未完成的关键步骤，因此公司简化故事在推进，但还没收尾。与此同时，Udaan 的融资栈仍依赖外部对手方：股权支持依靠 M&G 和 Lightspeed，资产负债表灵活性依靠债务提供方，司库和营运资金支持依靠
              JPMorgan，如今还依靠 ShopKirana
              带来的整合式采购和信贷协同。这构成经典的依赖权衡。这些伙伴是缓释论据的一部分，但如果融资市场收紧、贷款方趋于保守、整合延误或法律执行拉长，它们也会成为单点压力通道。因此，正确的投资人姿态不是假设存在隐藏监管失败，而是把公司视为处在多个真实监管和合作伙伴边界之内；这些边界的公开证据更多是流程型，而不是证书密集型。
