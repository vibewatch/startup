      - number: '5.3'
        title: 信任、可靠性与支持界面
        blocks:
          - type: paragraph
            body: >-
              Udaan 的公开信任界面真实存在，但很浅。它有一份 2025 年 5 月更新的实时隐私政策，围绕 GSTIN 或店铺执照验证有清楚的 KYC 语言，有安全支付说法，也有明确点名 IT
              与安全以及政策负责人的组织结构。隐私政策也具体到有意义：它列出 PAN 和 GSTIN 等注册数据字段，描述与物流、配送、支付延期和认证服务商共享数据，并把 OTP
              和使用数据纳入安全控制。这些流程信号对一个处理身份、订单和信贷工作流的 B2B 平台很重要。


              弱点在服务透明度。Udaan 联系页面为近期订单问题提供了基础升级路径，但公开帮助端点返回 Not Found，网站的退货政策和 RTO 链接也返回 Not
              Found，尽管导航里展示了它们。独立应用反馈加深了这种谨慎：近期评论表扬包装和优惠，但投诉指向入驻延迟、地址验证错误，以及在争议商品较重或受损时可能变得繁琐的退货流程。因此，公司显然有运营流程，但公开网页仍没有充分说明在边缘场景中，支持、退货和可靠性到底如何治理。
