  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、测算口径与不应纳入的部分
        blocks:
          - type: paragraph
            body: >-
              Udaan 应放在印度碎片化零售商采购体系中理解，而不是把它视为对整个印度零售或全部电商的索取权。应纳入的支出，是小商户的经常性补货——尤其是 kirana 小店的 FMCG 篮子、独立药店库存，以及
              HoReCa 采购中涉及品类、满足率、发票质量和营运资金时点的部分。不应纳入的支出包括终端消费者零售需求、与库存补货无关的平台抽佣、能大规模自采的现代零售连锁，以及反映消费者配送而非商户补货需求的即时零售
              GMV。核心替代方案仍是传统批发、经销商销售代表、现购自运批发和非正式信贷，数字采购只是在逐步替代这些流量。


              因此，正确的市场测算必须多口径，并且明确不能强行调和。自上而下的零售口径从当前约 $950 billion、2024 年 $1.06 trillion，到 2030 年约 $1.93 trillion
              不等，但这些是需求外壳，不是 Udaan 的直接 TAM。在其中，Redseer 的 eB2B 口径到 2030 年达到 $90-100 billion，IBEF 更宽的 B2B 平台口径达到 $200
              billion；两者不应当作同一个市场。品类口径同样重要：单是 FMCG 就有数千亿美元规模，医药是 $55 billion 市场并正增长到 $120-130 billion，餐饮服务的 2025
              年估算随方法不同落在 $56 billion 到 $114 billion。承销结论是，Udaan 暴露在很大的终端市场中，但没有任何单一公开数字能干净衡量它自己的可触达收入池。
