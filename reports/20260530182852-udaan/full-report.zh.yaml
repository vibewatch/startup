  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 买家任务
      - 当前公开工作流
      - Udaan 方案
      - 宣称收益
      - 观察到的限制
    rows:
      - - 开始使用
        - 输入手机号、企业名称和 PIN 码。
        - 官方渠道展示了快速注册流程。
        - 10 分钟内开始使用，App 优先完成引导。
        - 除营销文案外，没有公开筛查细节。
      - - 通过验证
        - 上传 GSTIN 或店铺执照信息。
        - 即时 KYC 验证步骤。
        - 让合法企业更快激活。
        - 没有公开拒绝率或周转时间指标。
      - - 浏览并比较
        - 打开 App，浏览品类，并查看基础食品、FMCG、医药等品线的优惠。
        - 大选品，加上自有品牌和仅移动端优惠。
        - 一站式采购和优惠发现。
        - 没有公开证据说明搜索相关性或缺货频率。
      - - 下单并融资
        - 以有竞争力的价格下单，并在需要时接入商业信贷。
        - 信贷和付款流程嵌在同一个买家 App 里。
        - 降低零售商的营运资金摩擦。
        - 没有公开披露融资条款或信贷挂钩率。
      - - 跟踪并收货
        - 实时跟踪配送，并让商品直接送到门店。
        - App 内跟踪，加上重点城市配送承诺。
        - 减少跟单摩擦，支撑复购。
        - 没有公开 SLA、路线可视性或签收证明指标。
      - - 处理问题
        - 近期订单问题按联系方式指引处理，符合条件的商品依靠退货流程。
        - 通过邮箱 / 联系方式提示升级支持，并承诺退货。
        - 基础投诉路径存在。
        - 公开帮助、退货和 RTO 页面损坏或缺失。
      - - 复购并优化
        - 复用复购工具、限时闪购和品类熟悉度。
        - 复购闭环，加上仅移动端优惠和自有品牌补货。
        - 提升频次和钱包份额。
        - 没有披露队列留存或复购率。
    notes: 本表停留在工作流层面；它讨论买家可从公开证据中合理完成什么，不涉及隐藏的内部工具。
