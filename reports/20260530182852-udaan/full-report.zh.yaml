      - number: '2.4'
        title: 约束、互相矛盾的估算与剩余尽调负担
        blocks:
          - type: paragraph
            body: >-
              主要不利力量不是缺少数字需求，而是这些需求能否以有吸引力的经济性流向商户采购平台。即时零售是最清楚的例子。KPMG、IBEF 和 Redseer 都显示这个渠道在高速增长，但 Redseer
              也显示城市层面的单位经济差异很大，一些非大都市门店仍低于盈亏平衡利用率。PolicyCircle 加入了商户视角：经销商群体和政策制定者现在把深度折扣定义为 kirana 的生存威胁，而不只是竞争噪音。对
              Udaan 来说，这意味着数字行为可以加深，同时商户经济性变弱；对平台变现和信贷质量而言，这是糟糕组合。


              第二个约束不是竞争，而是方法论。Mordor、IMARC 和 Fortune 对餐饮服务的估算差距太大，只能当作情景边界使用。eB2B 也有同样问题，Redseer 的 $90-100 billion 口径和
              IBEF 的 $200 billion 口径明显采用不同边界。最后，公司层面的承销缺口仍然很大：公开来源仍没有充分拆出 Udaan 的品类组合、城市密度、活跃门店队列或融资损失，无法把宏大的市场叙事转成干净的
              SAM 或 SOM。因此，本章支持一个正向需求背景，但不支持一个精确测算的市场份额故事。
