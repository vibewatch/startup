      - number: '4.2'
        title: 成本结构、烧钱收缩与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开证据在成本修复上，而不是收入质量上。FY24 净亏损为 ₹1,674.1 crore，总费用 ₹7,407.6 crore，经营现金流仍为负 ₹920.5 crore，EBITDA 利润率仍深度为负，为
              -37.13%。核心运营问题在费用结构中很明显：仅材料成本就占费用 75.3%，并升至 ₹5,576.8 crore，因此 Udaan
              不可能只靠削减管理费用走向健康。它确实完成的是对可控线条的广泛重置。员工成本据称降至 ₹643 crore，员工福利下降 35.4%，物流和包装下降
              16.8%，说明公司降低烧钱的路径，是围绕更少、更密的集群重塑运营版图。


              FY25 报道显示重置仍在继续。Snackfax 及后续 Economic Times 报道把 FY25 收入列为 ₹4,561.4 crore、亏损列为 ₹1,055.4
              crore，意味着业务明显缩小，同时减少了约 ₹619 crore 年亏损。管理层自己的评论比法定科目更乐观，但方向上有用：CY24 贡献利润率提升 300 个基点，2025 年至今又提升超过 100
              个基点；固定成本 2024 年下降 20%，2025 年至今又下降 20%；EBITDA 烧钱在 2024 年下降 40%。这些信号支撑“更小但更精瘦”的判断。它们还没有证明盈利可持续，尤其是 Entrackr
              仍计算 Udaan 在 FY24 每赚 ₹1 经营收入约花费 ₹1.3，且公开来源没有披露信贷损失或库存周转。
