    rows:
      - - Kirana FMCG 补货
        - 主食、包装食品、个人护理、家居必需品及其他重复门店补货篮
        - 终端消费者购物篮、即时零售消费者 GMV、现代渠道自采
        - 店主经营的 kirana 或小零售商，以门店营运资金付款
        - 核心需求池；传统渠道仍主导印度零售和杂货
      - - 独立药房采购
        - 独立药房和小连锁订购的处方药和 OTC 库存
        - 医院招标、大连锁集中采购、制造商机构交易
        - 药房业主或采购员，以门店现金周转或贸易信贷付款
        - 相关，因为碎片化药房渠道仍重要，数字化也在提升
      - - HoReCa / 餐饮服务补货
        - 餐厅、酒店、咖啡馆、宴会承办方和云厨房供给篮
        - 消费者配送 GMV、堂食消费者支出本身、大型酒店直接合同
        - 网点业主、厨师或采购经理
        - horeca360 的相关邻接市场，但公开市场估算因方法不同而差异很大
      - - 商户关联营运资金
        - 与补货订单直接绑定的贸易信贷或嵌入式金融产品
        - 与库存周转无关的独立无抵押 SME 贷款
        - 商户借款人；贷款方或合作银行提供资产负债表资金
        - 重要变现和留存杠杆，但受监管且对信用敏感
      - - 区域批发商或转售商采购
        - 小批发商、二级经销商或转售商集群的选择性批量采购
        - 大型全国批发合同，以及没有平台中介的纯现金自提
        - 批发业主或采购负责人
