          detail: 仓储、路线密度和 GTM 执行塑造经济账。
        - id: buyers
          label: 零售商和门店
          detail: Kirana、药店、HoReCa 和其他 SMB 需求节点。
        - id: contribution
          label: 贡献利润和毛利
          detail: 受商品组合、服务挂载和物流密度影响。
      edges:
