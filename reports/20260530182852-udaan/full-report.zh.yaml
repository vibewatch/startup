  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - GST 正规化和发票纪律
        - 正向但有摩擦
        - 当前
        - 支撑有组织采购和数字记录，但会增加小商户的会计与合规工作量
        - 要求按品类提供证据，说明发票质量究竟多大程度改变商户留存
      - - UPI 和商户数字支付扩张
        - 正向
        - 当前至中期
        - 降低交易摩擦，让商户习惯数字对账
        - 量化 Udaan 订单和还款已有多少比例通过数字支付通道结算
      - - ONDC 和开放网络准备度
        - 正向
        - 中期
        - 可能降低对封闭生态的依赖，提高商户可发现性
        - 验证 ONDC 是否实质改变获客成本，还是只扩大可选项
      - - 即时零售增长
        - 正负并存
        - 当前
        - 加速数字化下单和品类认知，但可能压缩商户利润，并把需求从门店主导补货拉走
        - 测算 Udaan 高价值商户与即时零售高密度社区的重叠度
      - - 非大都会市场规模不足下的经济性
        - 负向
        - 当前
        - 部分城市前置仓利用率低于盈亏平衡，说明数字需求不自动等于良好的单位经济性
        - 逐城梳理订单密度、平均货篮和线路经济性
      - - 商户营运资金和信贷监管
        - 负向
        - 当前
        - 信贷能提高钱包份额，但仍受资产负债表、放贷方和监管约束
        - 要求披露 Udaan 信贷产品的 NPA、逾期、放贷合作方和抽佣率
      - - 医药和餐饮服务的品类合规
        - 正负并存
        - 当前
        - 质量、有效期和服务要求能支撑粘性，也会抬高执行负担
        - 要求按医药和 HoReCa 队列提供服务水平指标与品类利润率
    notes: 确定性最高的驱动是数字化正规化；确定性最高的约束是，数字化不会消掉营运资金和履约复杂度。因此，不能把市场增长直接读成自动经营杠杆。
