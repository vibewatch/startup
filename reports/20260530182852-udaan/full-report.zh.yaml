      - number: '1.2'
        title: 领导层、创始人变动与治理依赖
        blocks:
          - type: paragraph
            body: >-
              Udaan 从扩张模式转入修复与 IPO 模式后，领导权更集中到 Vaibhav Gupta 身上。Gupta 仍是负责日常经营的创始人，也是转型的公开面孔。Sujeet Kumar 和 Amod Malviya
              仍在创始故事中，但已不参与日常运营；据报道 Kumar 仍留在董事会，Malviya 则转向 Pre6。也就是说，在法律重组和公开市场准备都推高治理敏感度的阶段，Udaan 对一名高管有明显创始人依赖。


              2023 年组织重排说明，这不是一支静态领导团队。VCCircle 及后续重组报道写到，CTO Gaurav Bhalotia 卸任，Vivek Gupta 转为顾问角色，Uday Bhaskar
              接管合并后的运营单元，Siddharth Reddy 和 Abhilash Pillai 在工程与产品上承担更显眼角色。公司 About 页面还列出产品、工程、投资者关系、政策、horeca360 和 IT
              等更广的管理梯队，但没有公布完整董事会名单或委员会结构。尽调结论是：Udaan 有可信的运营班底，但相对于反向迁回和潜在 IPO 进程的战略重要性，治理披露仍偏薄。
