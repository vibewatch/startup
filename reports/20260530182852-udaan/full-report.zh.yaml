      - 可见定价信号
      - 包含能力
      - 合同 / 发票口径
      - 含义
    rows:
      - - Udaan
        - 库存主导订单毛利加融资抽成
        - 未公开标准化
        - 品类、履约和信贷放在同一个运营闭环
        - 有正式发票，但实际经济性未公开
        - 货篮频次高时很强，但外部很难对标
      - - Jumbotail
        - 库存毛利、GTM 服务和金融科技相邻变现
        - 未公开标准化
        - 市场平台、物流、支付、信贷入口、J24 OS
        - 正式贸易工作流，但公开价格可见度仍低
        - 商业透明度与 Udaan 相近，因此竞争更多拼执行，而不是公开标价
      - - ElasticRun
        - 跨渠道分销、物流和网络服务变现
        - 未公开标准化
        - 仓储、前置仓、路由、B2B 和即时零售履约
        - 企业和品牌合同可能比商户标价更关键
        - 公司横跨基础设施和商业，难以直接对标
      - - IndiaMART
        - 发现、销售线索生成和订阅式分类信息模式
        - 公开透明度高于私营同行，但看不到单个商户 P&L
        - 买卖双方匹配和市场曝光
        - 以发现为主，而非库存和发票驱动
        - 运营锁定效应更低，但采购审批更容易
      - - Amazon Business
        - 市场定价，叠加批量折扣和可选赊账
        - 该组里最可见、最透明
        - GST 发票、合规工具、账户控制、宽目录
        - 结账流程内置较强发票和政策控制
        - 给价格带来压力，也为买家提供强劲的「第二轨道」选择
      - - Reliance / METRO Wholesale
        - 靠实体门店和宽品类赚批发篮子毛利
        - 批发价定位在店内可见，线上未标准化
        - 多品类现购自运式采购
        - 面向批发采购的正式 B2B 发票能力
        - 竞争更多靠信任和本地现货，而不是软件打包
      - - 即时零售相邻业态
        - 配送费和篮子经济性由高密度本地网络补贴
        - 促销和便利性看得见，长期经济性看不清
