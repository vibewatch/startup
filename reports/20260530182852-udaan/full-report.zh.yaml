      - number: '7.2'
        title: 运营、质量和渠道风险：密度有帮助，但摩擦仍会漏出
        blocks:
          - type: paragraph
            body: >-
              从运营看，用密度来审视 Udaan，比用摩擦来审视会更好看。正面论据可信：公司的集群策略明确指向更低供应链成本、本地化货盘和更高渗透率；合作伙伴和媒体来源也给出密集经营的证据，比如 25+ 仓库、约
              200,000 个当前网点，以及在 Bengaluru 异常强的渗透。Redseer 的公开摘要还把客户服务改善归因于市场经理收集一线买家反馈，JPMorgan
              则描述了营运资金支持、多数商品次日达和低起订额经济性。换句话说，公司不是单纯靠裁小规模活下来，而是围绕一个更容易读懂的微市场模型重新集中。


              但这没有消除运营脆弱性。公开材料仍显示，仓储、补货和配送强度仍是模型核心，意味着买家密度和服务执行一旦错配，成本和客户信任都会受打击。评论证据方向偏负面：近期 Android
              快照仍抱怨入驻等待长、地址验证失败，以及产品质量差后退货处理繁琐。公开网页也强化了这一点，因为独立退货和 RTO 政策 URL 已失效，而可见的支持路径主要是邮件流程，要求商户提交订单 ID
              和注册手机号。这些都不能证明系统性失败，但足以把服务质量、退货处理和入驻可靠性列为有意义的残余敞口。薄利、低 AOV、复购驱动的业务里，这些不是表面瑕疵；它们直接影响钱包份额、复购行为和贡献毛利。
