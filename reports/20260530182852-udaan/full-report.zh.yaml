      - number: '3.4'
        title: 切换成本、护城河韧性与不利竞争证据
        blocks:
          - type: paragraph
            body: >-
              这个市场的竞争韧性，主要取决于密度、供应触达，以及谁控制商户最频繁的下单循环。因此，即便 IndiaMART 或 Amazon Business 存在，Udaan 和 Jumbotail
              仍能有位置：当零售商需要经常补货、可靠配送和营运资金支持时，库存驱动的编排比发现驱动的浏览更有日常黏性。但这种黏性不应被误认为硬锁定。商户仍可以把日常主食分给 Udaan 或 Jumbotail，在 Amazon
              Business 上采购长尾 SKU，在 IndiaMART 上发现新供应商，并用附近批发或即时零售补急单。多平台并用看起来是常态，而不是例外。


              因此，不利证据很重要。Jumbotail 的扩张令人印象深刻，但披露的烧钱仍然有分量。ElasticRun 的估值重置和现金跑道话术说明，仅靠规模还没有在印度 B2B
              商贸中产生普遍令人信服的盈利公式。即时零售新进入者展示了资本更充足的网络如何重新定价便利性、压缩商户经济性，而无需复刻 Udaan
              的完整工作流。公开证据在已实现抽佣率、复购队列和信贷损失上也仍过薄，无法证明任何玩家已经建出深而持久的护城河。因此，正确的承销立场是相对的，不是绝对的：Udaan
              在市场中有一个可防守的位置，但它的护城河仍更像运营型、局部型，而不是结构上不可攻破。
