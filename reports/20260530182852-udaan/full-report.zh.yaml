  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Udaan 的建设性论点在于，公司已经完成了重置中最痛的一段。公开报道现在呈现出一家小得多但更连贯的企业：覆盖范围已缩至 16 个城市和 25+ 仓库，FY25
              亏损明显缩窄，管理层相关报道指向更好的贡献毛利、更低 EBITDA 烧钱和更快的 CY24 运行率增长。公司也仍有真实战略资产：庞大的零售商网络、有用的 FMCG 和医药深度、通过 udaanCapital
              提供的嵌入式金融，以及如今作为采购和分销邻接面的 ShopKirana。如果这些资产继续复合，June 2025 持平的 $1.8 billion 标记可以被解释为桥接估值，而不是困境估值。


              反向逻辑是，Udaan 仍是库存驱动、营运资金吃重的分销商，而估值最关键的变量还没有拿出上市公司级别的公开证据。公开文件尚未闭合 FY26 经审计收入、现金跑道、信贷损失、稀释条款或干净的集群级盈利能力。从约
              $3.1-3.2 billion 重置到 $1.8
              billion、反复裁员，以及「生存策略，不是扩张」的表述都重要，因为它们说明这仍是转型故事，不是已经解开的复合增长故事。因此，本章结论刻意保持价格敏感：Udaan 比 2023-24
              更可投，但公开证据仍支持纪律优先，而不是热情优先。
