      - number: '8.3'
        title: 情景逻辑、建议和入场纪律
        blocks:
          - type: paragraph
            body: >-
              情景逻辑很直接。悲观情景下，Udaan 未能把 CY24 运行率改善转化为更干净的 FY26
              经审计财务，融资市场要求更苛刻条款，或营运资金和信贷摩擦让模型无法复合增长。在这种世界里，锚点会变成质量更低的分销可比公司和被下调估值的私营同业，指向约 $0.9-1.3
              billion。基准情景下，公司继续缩窄亏损、维持稳定集群经济性、无扰动整合 ShopKirana，并按合理 IPO 时间表完成公司简化；这支撑约 $1.4-1.9 billion 的区间。乐观情景下，管理层证明
              65% 运行率增长和贡献毛利改善会转化为已报告收入加速、更干净 EBITDA 和更强公开市场就绪度，可支撑约 $2.2-2.8 billion。


              这个区间让当前估值标记站得住，但谈不上慷慨。因此，正确建议是观察，而不是买入。公司改善幅度足够大，下行情景不再是唯一情景，但披露还不足以支持只凭动量投入新资金。有纪律的入场需要两者之一：更好的价格，理想情况下接近
              $1.5-1.6 billion 或更低；或更强的证据包，补齐 FY26 经审计收入质量、毛利率 / 贡献毛利耐久性、现金跑道、信贷损失和稀释条款。在其中一个条件出现前，Udaan 是一个合理的 IPO
              候选和可信的转型案例，但仍高度依赖证据。
