      - CV033
  - id: TV005
    title: 论点破裂与止损触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - FY26 审计财务不达标
        - 已披露的 FY26 收入增长、毛利率或 EBITDA 明显低于转型叙事。
        - 故事从改善中的转型退回到未经验证的重置。
        - 下调公允价值区间，并暂停新资金。
      - - 新资本低于上一轮估值，或带有严苛优先权
        - 新一轮定价显著低于 $1.8B，或引入保护投资人的条款。
        - 表明私募市场并不支持当前普通股标题估值。
        - 重新下调基准情景，并重估稀释后的回报。
      - - 信贷损失或营运资本意外
        - 应收账款质量、NPA 代理指标或现金转换明显弱于预期。
        - 低利润率分销模型一旦融资质量走弱，重估会很快。
        - 在充分披露前，将其视为重大下行事件。
      - - 反向迁册 / 简化延迟
        - IPO 就绪工作流明显晚于当前对外说法。
        - 拉长流动性时间线，并削弱公开市场可选性。
        - 暂缓任何依赖近期上市的投资判断。
      - - ShopKirana 或服务执行恶化
        - 整合导致客户流失、供货率下降，或核心集群成本外漏。
        - 削弱乐观情景中唯一重要的协同支点。
        - 移除上行加分，并重估情景概率。
    notes: 这些触发器设计成可监控，并直接绑定估值传导，而不是泛泛的经营噪音。
    claimRefs:
      - CV003
      - CV005
      - CV034
      - CV037
      - CV040
      - CV043
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - FY26 审计财务
        - 收入、毛利率、EBITDA、经营现金流，以及相对 FY25 的审计桥。
        - 判断当前估值是否值得守住或扩张的核心要求。
        - 财务 DD；审计师包和董事会报告。
      - - 现金续航和融资栈
        - 现金余额、债务到期、契约余量，以及应收账款融资结构。
        - 决定当前估值是桥接融资，还是可持续股权价值。
        - 司库 / 放款方 DD。
      - - 信贷损失和应收账款质量
        - NPA / 核销代理指标、回收率，以及分部层面的信贷敞口。
        - 在低利润率商业模型里，嵌入式金融可能悄悄主导股权风险。
        - 风险 / 放贷 DD，结合组合明细。
      - - 股权结构表和优先权条款
        - 清算优先权、员工流动性机制，以及任何反稀释或棘轮条款。
        - 缺少这些细节时，普通股回报可能与标题估值大幅偏离。
        - 法务 DD；融资文件。
      - - 集群经济性和 ShopKirana 整合
        - 城市层面的贡献利润率、复购行为、供应商密度和整合记分卡。
        - 这是判断乐观情景是否值得提高概率的主要证据。
        - 运营 DD；集群仪表盘和并购后复盘。
    notes: 从跟踪上调为买入，或把当前估值作为可持续估值来下注前，至少需要拿到这些尽调材料。
    claimRefs:
      - CV005
      - CV034
      - CV043
      - CV045
