      - number: '1.4'
        title: 重组、IPO 路径与不利节点
        blocks:
          - type: paragraph
            body: >-
              Udaan 的上市路径首先是重组故事，其次才是 IPO 故事。2025 年 1 月报道称，NCLT 批准将技术、物流和批发业务并入 Hiveloop Ecommerce Pvt
              Ltd，目标是打造更干净的旗舰实体。2026 年 3 月报道随后描述下一步：把 Singapore 控股结构反向并入印度，让 Hiveloop
              成为母公司。管理层明确说两条工作线最重要——完成反向迁回，并让业务达到盈亏平衡。因此公开市场窗口只是指示性而非固定：来源给出的时间从 2025 年底或 2026 年，到 2026 年 3 月采访后的大约 9-18
              个月不等。


              不利历史很重要，因为它解释了当前版图为何缩小这么多，也解释了尽调为何要谨慎看待盈利说法。Udaan 在 2022 年 6 月裁撤 160-180 个岗位；后续报道又称，2022 年两轮合计裁撤超过 500
              个岗位。2023 年末一轮在重组后又裁掉大约 120-150 名员工，报道持续把这些裁员同去中心化集群运营和盈利推进联系起来。换句话说，当前 IPO
              叙事是建立在多年收缩之上，而不是建立在不间断动能之上。建设性解读是，公司变得更守纪律；怀疑性解读是，IPO 案例真正降险之前，公司仍需要法律简化、治理披露和利润证明。
