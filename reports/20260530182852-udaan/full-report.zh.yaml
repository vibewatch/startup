  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、顶线质量与变现可见度
        blocks:
          - type: paragraph
            body: >-
              Udaan 的公开收入故事可用，但不干净。FY24 顶线多次被报道为 ₹5,706.6 crore，但底层措辞不一致：一些媒体称之为收入，另一些称之为 GMV。这个限定很重要，因为 Udaan
              不是纯软件平台。Entrackr 基于申报文件的回顾称，公司通过贸易商品销售、平台费、物流服务、信贷服务、广告、废料销售、收款服务和贷款处理费变现，但也称单是贸易商品销售就占 FY24 GMV 的
              98.5%。实际看，公开证据指向的是库存驱动的商贸模式，叠加费用收入，而不是一个轻抽佣平台，不能只靠应用使用量推断经济性。


              公司官方叙事与这一解读方向一致。Udaan 仍把 FMCG、主食、果蔬、医药和 udaanCapital
              展示为核心支柱，这符合一个围绕货品组合控制、履约密度和营运资金绑定搭建的业务，而不是纯发现模式。缺口在定价透明度：公开资料没有品类级价格表、费用表、抽佣披露或已实现毛利率桥。尽调因此只能得出一个结构性结论：如果公司向更强集群和更好贡献利润收缩，收入质量就在改善；但公开记录仍没有把商品吞吐量与真正经常性服务变现拆得足够清楚，无法建模稳态经济性。
