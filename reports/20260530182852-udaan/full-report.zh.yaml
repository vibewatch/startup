chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、模式与自称市场位置
        blocks:
          - type: paragraph
            body: >-
              Udaan 由 Vaibhav Gupta、Sujeet Kumar 和 Amod Malviya 于 2016 年在 Bengaluru 创立。官方叙事仍把公司定位为技术驱动的贸易平台，服务 Bharat
              的小型零售商。核心市场目前覆盖 FMCG、主食、果蔬和医药；公司也通过 udaanCapital 提供偏营运资金的产品。官方页面称，公司总部位于
              Bengaluru，在印度多个大都市和主要城市设有办公室，并获得数百万小企业信任。


              身份层最重要的限定是：Udaan 的领导层表述强于独立验证证据。公司称自己是印度最大的 eB2B 平台，市场份额约 70%，但本报告的来源集合没有外部市场研究来验证这一份额。同样，管理层围绕 kirana
              小店和小型零售商的大众市场定位很清晰，但公开证据在叙事和产品范围上强，在独立审计客户数上弱。后续章节可以复用的干净结论是：Udaan 是一家总部位于 Bengaluru 的 B2B
              商贸与贸易信贷平台，服务印度零售供应链；其份额和活跃买家基数的精确规模仍需尽调。
