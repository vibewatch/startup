      - number: '2.2'
        title: 买方图谱、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              主导买方画像仍是店主自营的 kirana
              或社区零售商。对这类客户来说，买方、用户和付款方往往是同一个人或一个很小的团队，采用触发点也偏实用而非战略：更高满足率、一个应用里更宽的货篮、更快补货、正式发票，有时还包括营运资金。药店工作流相近但不同，因为治疗品类、效期纪律和合规比单纯篮子宽度更重要。HoReCa
              门店又不同：下单节奏可能更不均匀，客单价更高，服务可靠性比面向消费者式的大而全品类更重要。这些差异很关键，因为 Udaan 的可触达需求不是一个同质化的 SMB 大盘。


              数字化准备度在提高，但仍不完整。印度 kirana 基数仍有数千万家，KPMG 明确说只有 63%
              的零售商有兴趣使用数字支付。这足以支撑长期数字化，但也意味着获客入驻和留存仍是运营问题，不只是软件分发问题。印度上市公司 IndiaMART 的可比证据有助于锚定这一点：印度 SMEs 确实会通过在线 B2B
              平台买卖，公开市场投资者也认可该模式，但重披露的分类信息平台模式，并不等同于 Udaan 这种库存和物流很重的商贸层。对 Udaan 而言，买方图谱应先按工作流和预算所有者分层，而不是套一个泛化 SME 标签。
