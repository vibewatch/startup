      - number: '4.3'
        title: 资本充足性、融资依赖与重置后的扩张抓手
        blocks:
          - type: paragraph
            body: >-
              资本故事令人鼓舞，但仍高度依赖融资。Udaan 在 2024 年 10 月从 Lighthouse Canton、Stride Ventures、InnoVen Capital 和 Trifecta 获得约
              ₹300 crore 债务，随后在 2025 年 6 月从 M&G 和 Lightspeed 获得 $114 million 新 Series G 股权。公开列出的资金用途在各媒体中一致：强化资产负债表、深化
              FMCG 和 HoReCa、支持自有品牌主食、扩展履约和 GTM 能力，并继续推进公开市场准备。Indian Startup News 将这笔股权支票写作超过 ₹970 crore，因此自 2024 年 10
              月以来，近期披露的外部资本约为 ₹1,270 crore，未计任何偿还、营运资金波动或收购影响。这有意义，但仍只是一个总额代理，因为 Udaan 没有公布不受限现金、月度烧钱、契约空间或债务服务时间表。


              运营上，公司现在谈的是一个窄得多、但更可触摸的网络：25 个以上仓库、16 个城市、200,000 个以上零售门店。2025 年 7 月 ShopKirana
              收购又提供了一个线索，说明管理层认为利润率路径在哪里。该交易被呈现为全股票合并，把 Info Edge 带入股权结构，同时深化 FMCG 采购、自有品牌开发、信贷和供应链协同。换句话说，Udaan
              仍在用外部资本和公司动作来提升采购密度和营运资金效率，而不只是融资拉动顶线增长。这是合理策略，但也意味着业务还没有跨入可自我供血的状态，无法只凭运营披露推断现金跑道。
