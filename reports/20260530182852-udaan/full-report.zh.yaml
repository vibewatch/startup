  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险图景：融资和执行仍是主导
        blocks:
          - type: paragraph
            body: >-
              Udaan 的风险结构已不再是纯粹的困境故事，但仍是依赖资本的重置故事。最强的反向证据是结构性而非偶发性：公开报道显示，收入从 FY22 约 ₹10,000 crore 降至 FY25 的 ₹4,561.4
              crore；与此同时，公司从 80 个城市收缩到 16 个城市，并接受估值从 $3.1-3.2 billion 区间重置到约 $1.8
              billion。这一轮聚焦和降烧钱确实降低了风险，但也证明最初的规模化假设在第一版设计上没有跑通。从风险承销看，Udaan 现在押注的是更窄的地理范围、更密的仓网和更克制的品类组合，而不是全国铺开的广覆盖。


              核心投资问题因此是：更干净的运营形态，能不能快过融资依赖。近期证据鼓舞但不完整：FY25 亏损缩窄约 37%，M&G 和 Lightspeed 新增 $114 million 股权，贷款方新增约 ₹300
              crore 债务，当前报道仍显示 25+ 仓库、16 个城市和 200,000
              个网点的有形网络。可是，本章审阅的公开来源都没有披露非受限现金、现金跑道、债务契约余量，或嵌入式信贷业务的真实亏损经验。其他联合创始人退出日常运营后，创始人集中度也进一步围绕 Vaibhav Gupta
              提高；公司已经在 2022 和 2023 历经多轮裁员。组合起来，融资 / 模型风险和人员 / 执行风险就是严重性最高的两类：转型是真实的，但还没有自证。
