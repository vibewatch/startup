      - number: '3.3'
        title: 横向平台、批发替代与新进入者压力
        blocks:
          - type: paragraph
            body: >-
              最重要的相邻竞争者靠低摩擦采购取胜，而不是靠深度商户锁定。IndiaMART 是最清楚的例子：它是一家上市、披露充分、资产轻的平台，围绕买卖双方发现，而不是自有库存。这通常意味着比 Udaan
              更低的切换成本和更容易多平台并用，但也意味着对满足率、配送节奏和信贷的控制更弱。Amazon Business 推出的是同一取舍的另一个版本。它的强项是广度和治理：GST
              发票、合规工具、团队控制、批量折扣、信贷选项、100% 可服务 PIN code 覆盖，以及远大于任何垂直 eB2B 创业公司的目录。对许多 SMEs 和机构来说，即便 Amazon Business
              不是运营主记录系统，它也更像一条安全的第二采购轨道。


              批发和超本地替代品重要，是因为它们用不同经济性攻击同一笔支出。Reliance 的 METRO 批发形态服务 kirana、HoReCa、办公室和
              SMEs，提供宽品类组合和门店驱动分销。JioMart、Amazon Now 和 Flipkart Minutes 加剧的是另一种威胁：它们训练商户和消费者期待即时履约和激进定价，而背后往往有一家风险融资
              eB2B 创业公司难以轻易复制的网络。对 Udaan 来说，这些不是完全相同的产品孪生体；它们是注意力、利润率和便利性的替代品，仍会削弱篮子份额。
