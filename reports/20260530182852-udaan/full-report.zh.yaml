        - 没有公开 SKU 级目录导出、定价逻辑或搜索质量指标。
      - - 履约与微市场运营
        - 零售商、仓库、外勤运营
        - 25+ 个仓库、16 个城市、200k+ 个网点，采用集群驱动的微市场模型。
        - 已投入运营并具规模，但公开描述来自商业报道，而非技术文档。
        - 密度和服务质量取决于本地市场集群，而不是全国铺开的均匀覆盖。
