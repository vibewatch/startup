        - 用 App 优先的方式跑通 Bharat 零售买家的补货闭环。
        - 没有公开 Web 演示、API 或工作流分析。
      - - 品类与选品引擎
        - 零售买家和品类团队
        - 食品与 FMCG、基础食品、果蔬、医疗保健与医药，并覆盖高端品牌和自有品牌运营。
        - 已上线；官方渠道反复强调品类覆盖。
