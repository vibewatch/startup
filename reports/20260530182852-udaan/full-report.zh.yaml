      - number: '8.4'
        title: 否决触发项和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              否决触发项比上行叙事更重要，因为当前估值标记并不显著困境。如果 Udaan 必须以低于上一轮的价格筹集新资本，如果 FY26
              经审计收入和利润率进展无法匹配声称的运行率轨迹，如果营运资金或信贷损失数据明显差于投资人预期，或反向迁册和法律简化时间表继续滑延，投资逻辑会迅速破裂。这些事件会直接压缩估值，因为它们会把故事从「成熟中的转型」重新拉回「仍依赖资本」。ShopKirana
              后的服务或整合恶化也重要，尤其是密度收益未能进入复购率和履约经济性时。


              最终尽调负担因此是具体的，而不是开放式的。投资人需要 FY26 经审计 P&L
              和现金流明细；集群或城市级贡献指标；债务、契约和现金跑道可见度；信贷损失和应收账款账龄披露；以及能说清优先权、员工流动性机制和任何稀释悬念的股权结构条款。没有这些项目，公开证据足以支持观察名单位置和估值区间，但不足以支持精确价格或高确信买入判断。
