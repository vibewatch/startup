      - number: '5.2'
        title: 模块栈与运营架构
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Udaan 真正的架构是跨应用、品类控制、信贷和履约的运营架构，而不是一张已披露的软件栈图。Google Play 商店介绍和 2025 年公司背书的融资报道都强调微市场或集群模式，独立报道则描述
              Udaan 通过仓库网络大批采购并供给 kirana 和小型零售商。合在一起，这些信号意味着一套分层栈：移动端买方界面、身份和 KYC
              控制、目录和定价工作流、嵌入式信贷或支付、仓库与配送编排，以及决定库存和服务水平能否经济运行的市场密度控制。


              组织图也强化了这一解读。Udaan 公开点名产品管理、工程、IT 与安全、政策、udaanCapital 和 horeca360
              等职责归属。这足以映射责任、依赖和可能的控制点，但不足以识别编程语言、云架构模式、数据库或可观测性工具。因此，本章保守看待架构：我们可以可信地描述一个以应用为入口、带有金融和垂直延伸的商贸与履约系统，并叠加
              ShopKirana 整合路径；但不能真实推断具名供应商或微服务拓扑。换句话说，工作流是公开的，控制界面是公开的，精确技术栈不是。
