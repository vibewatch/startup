      - number: '2.3'
        title: 增长驱动、数字基础设施与品类顺风
        blocks:
          - type: paragraph
            body: >-
              与 Udaan 早年相比，几股结构性力量让数字采购现在更可行。宏观层面，Bain、BCG 和 McKinsey 都描述了一线大城市之外仍在扩张的数字消费基础；KPMG 和 Deloitte
              则把零售增长同城市化、收入扩张、GST 正规化和更广泛的数字采用联系起来。交易层面，PwC 显示数字支付已经进入主流：零售数字支付量快速增长，UPI 已经主导该品类，商户收单基础设施也在向 tier-1
              城市之外扩散。ONDC 进一步延伸这一方向，试图降低对封闭生态的依赖，并为卖家和网络参与者提供共享的政策、税务和准备度资源。


              品类层面的顺风同样重要。FMCG 仍是最大的补货池，KPMG 和 IBEF
              都描述了它强劲的长期规模，以及即时零售驱动的渠道快速转移。医药仍有相关性，因为国内需求、农村触达和供应链数字化依然高度依赖碎片化门店网络，而不只依赖组织化连锁。这些力量有助于解释，为什么 Udaan
              在重置后版图缩窄的情况下，仍能保持有意义的品类相关性。但不能把顺风浪漫化：ONDC 和 UPI 降低了交易摩擦；它们本身解决不了最后一公里密度、营运资金融资或品类稳定性。Udaan
              仍是在数字顺风里的运营执行上赢或输，而不是因为顺风可以替代执行。
