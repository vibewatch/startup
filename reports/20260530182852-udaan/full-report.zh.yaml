  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户范围与分层
        blocks:
          - type: paragraph
            body: >-
              Udaan 客户基数很大，但公开描述来自多个互不兼容的口径，所以本章把自称网络广度和当前运营密度分开。官方页面称平台受到数百万小企业信任，并明确点名
              kirana、药店、酒店、餐厅、餐饮承办方、办公室、制造商和零售商。第三方画像和融资报道把网络说法进一步拉到约 3 million 家零售商、25,000 家供应商和 30,000
              家卖家。这些数字有助于理解生态广度，但不应被解读为当前活跃买家或当前日交易方。


              更可防守的当前需求口径来自近期 Economic Times 报道：Udaan 从 16 个城市的 25 个以上仓库服务超过 200,000
              个零售门店。这个数字远小于官方“数百万”表述，但也更接近运营版图。换句话说，Udaan
              似乎拥有一个广泛的注册或可触达网络，以及一个更窄、集中在城市集群中的活跃服务层。这个区别重要，因为客户账本似乎在补货频繁、物流密度高的地方最强：以 FMCG 和主食为核心的 kirana、药店、HoReCa
              买家，以及更看重信贷、次日达和稳定品类，而不是平台新鲜感的小办公室。
