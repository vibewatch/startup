companyProfile:
  summary: >-
    Udaan 于 2016 年在 Bengaluru 创立，是一家 B2B 商贸与贸易信贷平台，服务印度小型零售商和企业买家，覆盖 FMCG、主食、果蔬、医药和 HoReCa。经历多年重置后，公司现在运营更收窄的网络：16
    个城市、25 个以上仓库，服务超过 200,000 个门店；2025 年 6 月以约 $1.8 billion 估值完成 $114 million Series G 融资，并通过 Hiveloop 整合和反向迁回推进 IPO 准备。
