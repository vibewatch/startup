      - number: '1.3'
        title: 资本基础、财务画像与运营重置
        blocks:
          - type: paragraph
            body: >-
              最近最清晰的拐点是 2025 年 6 月 Series G 完成：M&G 与 Lightspeed 领投 $114 million 新股权融资，估值约持平在 $1.8
              billion。管理层和报道对资金用途的说法一致——深化 FMCG 和 HoReCa，扩大自有品牌主食，强化资产负债表，并继续推进公开市场路径。该轮之前，公司在 2024 年 10 月从 Lighthouse
              Canton、Stride Ventures、InnoVen 和 Trifecta 获得约 ₹300 crore 债务，用于微市场扩张、GTM 能力、履约和买家采用。股债动作合在一起说明，Udaan
              的转型当时还不能自我供血，但它已经以比高速扩张时期更克制的条款重新打开资本通道。


              财务画像把取舍说得很清楚。FY24 顶线被报道为 ₹5,706.6 crore，但不同来源有的称收入、有的称 GMV；净亏损收窄至 ₹1,674.1 crore，费用下降 4.4%。管理层另称 CY24
              经营改善——增长 60%、贡献利润和毛利率改善、月度复购超过 90%、钱包份额提高——但这些是运营评论指标，不应与 FY24 报告顶线增长混用。到 FY25，公开报道显示公司规模明显缩小但更精瘦：收入约
              ₹4,561 crore，亏损约 ₹1,055 crore，运营从近 80 个城市重置到 16 个城市，目前网络被描述为 25 个以上仓库、服务超过 200,000
              个门店。关键限定是规模口径模糊：较早的营销式数字仍提到超过 3 million 家零售商、25,000 家供应商和超过 900 个城市，但这些显然不是重置后网络的同一口径，不能互换使用。
