      - number: '6.4'
        title: 持久性、扩张与摩擦
        blocks:
          - type: paragraph
            body: >-
              耐久性看起来站得住，但证据更多落在运营替代指标，而不是客户组合披露上。正面看，公开来源称复购行为很强，钱包份额在上升，最低起订额可低至 INR 3,000，部分流程中超过 90%
              的商品可在次日送达买家。ShopKirana 应当靠新增二线、三线 FMCG 商户，并为品牌提供更多零售商触达，继续加深“落地—扩张”动作。策略本身连贯：聚焦高频 FMCG 和 HoReCa
              需求，提升集群密度，叠加信贷，改善服务经济性。但结果端的客户账本会在品类、城市或账户层面多集中，公开证据远没有说清。


              主要负面信号不是明显流失，而是披露不足和服务摩擦。Udaan 仍未披露 NRR、GRR、logo
              流失、头部客户敞口或卖家集中度。退货和未妥投政策也显示出相当重运营的支持模型：很多情况下只尝试一次配送，争议商品需要大量照片或视频证明，逆向取件后 48
              小时检查，并通过支持渠道处理例外。应用反馈说明这在实践中确实重要。AppBrain
              评论肯定更强的优惠和包装质量，但也提到入驻等待时间长、地址验证失败，以及损坏或临期商品的退货材料繁琐。因此，客户故事在复购驱动采购上是扎实的，但若要给机构级耐久性打分，证据仍不完整。
