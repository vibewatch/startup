  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动因素
      - 集中度风险 / 约束
      - 影响
      - 尽调路径
    rows:
      - - 微市场密度和钱包份额
        - 模型依赖城市层面的密度，而不是全国均匀渗透
        - 胜出的集群可以跑出很强的复购经济性，其他地区经济性可能较弱
        - 索取按城市拆分的集群层面 GMV、活跃买家、复购率和贡献利润率
      - - 快消品和基础品深度
        - 退出非核心业务后，客户证据高度集中在快消品、基础品和传统贸易渠道
        - 如果杂货需求走弱或竞争加剧，品类集中风险会上升
        - 索取组合精简前后按品类拆分的收入和毛利率结构
      - - ShopKirana 二三线城市触达
        - 收购扩大商户触达，但尚未证明合并后实体的留存
        - 整合顺利时，可在小城市加深落地扩张；也可能分散运营注意力
        - 索取商户重叠、迁移后留存和城市层面协同兑现情况
      - - 信贷、低起订量和快速交付
        - 嵌入式金融和低 MOQ 可以提升钱包份额，但附着率和信用损失未披露
        - 扩张循环可能很强；若信用质量恶化则有风险
        - 索取信贷附着率、逾期、还款行为，以及按信贷队列拆分的复购
      - - 供给侧广度和 VOC 流程
        - 公司声称有大型卖家或供应商网络，但头部卖家集中度和供应商流失未公开
        - 如果少数供应商主导履约率，品类韧性可能被高估
        - 索取前 20 大卖家 GMV 占比、活跃卖家数和年度卖家留存
      - - 客服和逆向物流政策
        - 退货和未送达货件规则把实质证据和时限负担放在买家身上
        - 即使品类和价格很强，摩擦也会压低满意度
        - 索取退货批准率、退款周转时间、误拒率和投诉重开率
      - - 头部客户不透明
        - 未公开头部账户、NRR 或合同期限
        - 无法以机构级信心承销集中度或耐久性
        - 索取前 20 大客户收入占比、合作年限、品类结构和续约历史
    notes: 扩张机制可见，但需求侧和供给侧的集中度披露都不足。
