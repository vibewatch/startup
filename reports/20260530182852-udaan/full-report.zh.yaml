  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 买方工作流与产品表面
        blocks:
          - type: paragraph
            body: >-
              Udaan 的公开产品故事，作为零售商工作流来读最清楚，而不是作为一个独立软件产品来读。官方旅程从用手机号、企业名称和 PIN code 快速注册开始，接着是 GSTIN
              或店铺执照验证，然后直接进入带有竞争性价格、信贷和快速配送的下单流程。首页和 iOS 商店介绍反复出现同一个循环：浏览 Food & FMCG、Healthcare 或 Pharma
              品类，下单，跟踪货件，在店内收货，管理付款或商业信贷，再用复购工具降低补货摩擦。这不是泛化平台叙事；这是为 kirana、药店、酒店和类似小企业买家调校的补货工作流。


              采购体验承诺也是运营型的，而不是抽象型的。Udaan 宣传 1600+ SKUs、自有品牌、应用商店文案中的 1000
              个以上优质品牌、移动端专享优惠和符合条件商品退货。这组要素重要，因为它说明买方体验如何叠加：品类宽度带来第一单，移动端专享促销和复购推动频次，信贷加配送则在现金流和满足率比发现光环更重要的品类里形成黏性。公开文案没有暴露
              SKU 级定价逻辑或推荐系统，但持续暴露的是一个面向零售商的循环：入驻、浏览、购买、收货、再下单。
