      - number: '6.2'
        title: 采用、密度与复购代理指标
        blocks:
          - type: paragraph
            body: >-
              公开采用证据最强的地方，是与买方频次绑定的指标，而不是已披露收入留存。Financial Express 称，Udaan 2024 年收入运行率同比提升 65%，由日买家增加 70% 推动；Business
              Standard 和 ETRetail 的债务轮报道称，日交易买家增长超过 50%，买家钱包份额提升 20%。同一组公司背书报道称，复购同比翻倍至历史高点，月度复购率超过 90%。这些不是 SaaS
              式队列，但对一个补货业务来说是有意义的信号，因为复购才是核心客户行为。


              集群层面的证明更具体。JPMorganChase 和两篇源自 Redseer 的媒体故事都称，Udaan 服务 Bengaluru 约 80% 的 kirana 门店，并在那里处理约 15,000
              笔日门店交易。这些来源还描述了一个微市场策略，使 Bengaluru 和 Hyderabad 的买方渗透率及钱包份额提升约 1.2 到 1.4 倍。Redseer
              另一篇客户服务笔记又增加了定性层：本地化市场经理反馈似乎改善了配送速度、信贷可得性、定价和品类。合在一起，这说明 Udaan 的采用并不均匀地铺在全国。它在集群经济、服务质量和复购行为相互强化的地方最密。
