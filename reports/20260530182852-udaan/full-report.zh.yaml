      - number: '6.3'
        title: 具名客户证据与反馈回路
        blocks:
          - type: paragraph
            body: >-
              具名客户证据比总体增长故事更薄，但并非不存在。Udaan 首页轮播展示了几段商户成功小故事：Agra Potato Traders 扩大数字批发，Chandni Chowk 一家米厂商扩展客户群，一个单店
              paan 小店店主增长到多处网点，一名前陆军军官借助 Udaan
              网络建立农业务。这些引用有用，因为它们显示公司有意营销传统渠道和农业相关需求用例，但证据仍偏软：这些故事是带有结果主张的标题卡，而不是披露完整的法律实体、运营指标或合同条款。


              最好的独立客户证明来源，是 JPMorganChase 2025 年 8 月的故事。它不仅报道了印度全境 90% 的复购率和 Bengaluru 的高密度使用，还提到一家经营主食和消费品的南印度家族零售商，自
              2019 年使用 Udaan 后增长了三倍。这仍不是一个完全具名的企业客户引用，但比泛化 logo 或轶事更强，因为它把客户结果与复购行为、订单经济性和配送承诺连在一起。供给侧，SquadStack
              的案例研究也有信息量：Udaan 开展了 7 个活动，并通过反馈调研触达超过 29,000 家供应商，说明公司有认真做客户之声流程，即便这本身不能证明留存。总体看，Udaan
              有真实客户证据，但公开集合经过筛选，相对于平台自称规模仍偏薄。
