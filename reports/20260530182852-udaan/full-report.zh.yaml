  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - FY26 审计收入重新加速，烧钱继续下降，ShopKirana 顺利整合，IPO 就绪度按计划改善。
        - $2.2B-$2.8B 区间；当前估值可成立，并仍留有上行。
        - 执行滑坡、整合拖累，或市场倍数走弱。
        - 有可能，但需要比当前公开记录更强的审计证据。
      - - 基准
        - 收入稳定在中等增长，亏损继续收窄，公司结构简化推进且没有重大意外。
        - $1.4B-$1.9B 区间；当前 $1.8B 估值在区间内，但靠近上半段。
        - 营运资本压力、FY26 增长兑现偏弱，或上市就绪度推迟。
        - 以现有证据看最可能。
      - - 悲观
        - 增长停滞、融资条款变硬，或隐藏的信贷 / 现金占用强度比预期更差。
        - $0.9B-$1.3B 区间；现有投资人面临实质性估值下调风险。
        - 需要新资本、下轮降价，或公开市场可比公司倍数压缩。
        - 披露仍不完整，因此尾部风险有分量。
    notes: 情景区间是 IC 讨论工具，锚定公开证据、私有可比公司背景和可比公司倍数分散度，而不是单一 DCF。
    claimRefs:
      - CV014
      - CV015
      - CV018
      - CV021
      - CV022
      - CV031
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Udaan 当前估值
        - 私有估值与滚动销售额对比
        - ~$1.8B；取决于收入基数和 FX 假设，约为 FY25 销售额 3.3x 或 FY24 销售额 2.7x。
        - 当前决策点。
        - 私有估值；区间对采用哪个收入期间很敏感。
      - - IndiaMART
        - 公开市场 EV / 收入和 EV / EBITDA
        - ~5.6x EV/收入，FY26 实现盈利时约 ~13x-16.5x EV/EBITDA。
        - 印度上市数字 B2B 中最好的锚点，也是清晰的高质量上限。
        - 订阅 / 分类广告经济性明显比 Udaan 干净。
      - - Jumbotail
        - 私有轮次和财务数据
        - 完成 $120M 轮后投后估值 >$1B；FY23 收入 ₹819cr，亏损 ₹264cr。
        - 印度 eB2B 杂货 / 商户分销里最接近的私有经营可比公司。
        - 仍是私有公司，透明度只有部分。
      - - ElasticRun
        - 私有估值路径
        - 2022 年 $1.5B，后来 HSBC 暗示约 $0.8B。
        - 提醒投资人：物流较重的后期估值可能大幅压缩。
        - 模型比 Udaan 更偏物流和农村分销。
      - - Metro AG
        - 公开市值 / 收入校验
        - 约 $2.17B 市值，对应约 $33.9B 收入，市值 / 收入约 0.06x。
        - 低利润率批发经济性的下行锚。
        - 成熟欧洲批发商，地域和所有权结构都很不一样。
      - - 印度数字零售基准
        - 行业利润率和资本强度背景
        - FY25 行业利润率改善，但履约和资产负债表强度仍然高。
        - 说明投资人为何奖励盈利进展，却仍折价资本较重的模型。
        - 行业篮子，不是纯 eB2B 可比公司。
    notes: 可比公司组合故意混合：IndiaMART 给出质量上限，Jumbotail 和 ElasticRun 提供私有同行背景，Metro 用来校验批发下行。
    enumerationScope:
      coverage: sample
      basis: >-
        The table covers the most decision-useful public and private valuation anchors retained for this chapter rather
        than an exhaustive global B2B-commerce universe.
