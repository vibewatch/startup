        - 轻资产触达、公开市场信任、低摩擦入驻
        - 相比库存主导模式，履约和信贷控制较弱
      - - Amazon Business
        - 2017 年推出；来自 16 lakh+ 卖家的 19 crore+ 商品；100% 可服务邮编覆盖
        - MSME、大企业、机构买家
        - 横向 B2B 市场平台，带 GST、合规和账户控制
        - 品类宽度、采购治理和信任工具
        - 品类专项地面执行较弱，kirana 工作流锁定也较弱
      - - Reliance / METRO Wholesale
        - 服务 kirana 小店、HoReCa、办公室和中小企业的大型批发网络
