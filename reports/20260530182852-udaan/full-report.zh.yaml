  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与 Udaan 相对位置
        blocks:
          - type: paragraph
            body: >-
              Udaan 的竞争者图谱比替代品图谱更窄。最直接的重叠仍来自 Jumbotail，以及程度较低的
              ElasticRun，因为这些公司也试图用货品组合、履约，以及融资或品牌分销支持的某种组合，解决商户补货问题。Jumbotail 收购 Solv 的商户和卖家基础后，把自身的杂货平台、物流、金融科技和 J24
              操作系统栈叠在一起，成为最尖锐的同类竞争者。ElasticRun 仍然重要，但它的公开定位更宽，也更不稳定：它现在销售一个覆盖 B2B、D2C、即时零售和零售分销的全印度履约网络，同时守住农村 FMCG
              核心，并试验前置仓。


              外圈几乎同样重要。IndiaMART 和 Amazon Business 并不是 Udaan
              库存驱动模式的完美复制品，但它们是可信的替代采购轨道，入驻更低摩擦、运营承诺更轻，也有更强的公共信任或合规信号。Reliance/METRO 批发、JioMart 超本地、Flipkart Minutes 和
              Amazon Now 的重要性，不在于它们端到端复刻 Udaan，而在于它们压缩商户注意力、配送时效预期和定价权。Udaan
              的相对优势，是在聚焦网络里做精选补货加信贷；相对弱点是，这些层的每一层都面对资本更强的替代者、锁定更弱的平台，或正在更快整合供应触达的直接同行。
