      - number: '7.4'
        title: 缓释因素、监控和否决标准：轨迹改善，但残余敞口仍不小
        blocks:
          - type: paragraph
            body: >-
              Udaan
              确有真实缓释因素，应该明确承认。亏损已大幅下降，集群模型看起来正在跑出更密的经济性，近期债务和股权轮说明机构资本没有放弃这个故事，公开第三方材料也指向比扩张失控阶段更强的本地化、配送速度和客户服务纪律。如果整合按计划推进，ShopKirana
              收购也可能改善 FMCG 采购密度和自有品牌规模。这些不是表层利好；本章没有得出 Udaan 只是陷在失控下滑中的结论，主要原因就在这里。


              但缓释论据仍不完整，因为最难的问题太多仍需要管理层证据，而不是公开证明。公司没有公开披露现金跑道、集中度、信贷损失表现，或 ShopKirana
              交割后的整合计分卡。反向迁册完成仍是执行事项，不是已关闭事实。公开退货政策页面失效、入驻投诉可见，也意味着质量门槛并不会默认达到投资级。尽调上，这导出一套简单规则：如果 Udaan
              能证明自我融资进展、法律简化完成、贷款方支持稳定、商户服务文档更干净，并拿出集中度指标证明转型基础广泛，投资逻辑会改善。如果新增资本仍在缺乏透明度的情况下成为必要，如果监管或法律执行停滞，如果密集集群里的服务问题持续，或整合收益未进入毛利和留存数据，投资逻辑会快速走弱。换句话说，只有未来十二个月把管理层叙事转成可审计的运营证明，残余风险才可管理。
