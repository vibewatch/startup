            - label: 店主经营
              tone: neutral
              detail: 通常由店主或家庭成员控制采购篮子和现金周期。
            - label: 供货率 + 价格
              tone: positive
              detail: 更好的供货、单一应用下单和发票质量最重要。
            - label: 很高
              tone: positive
              detail: 补货可以是每天或接近每天。
            - label: 中高
              tone: warning
              detail: 营运资本很重要，尤其是快消必需品。
            - label: 不一
              tone: warning
              detail: 数字化在提升，但 KPMG 仍看到支付采用不完整。
        - label: 社区小型超市
          values:
            - label: 本地经理
              tone: neutral
              detail: 比 kirana 略正式，但预算仍由本地控制。
            - label: 供应商整合
              tone: positive
              detail: 运营简单性和 SKU 广度驱动兴趣。
            - label: 高
              tone: positive
              detail: 高频 FMCG 补货仍是核心。
            - label: 中
              tone: neutral
              detail: 可能选择性用信贷，而不是持续使用。
            - label: 中
              tone: neutral
              detail: 更习惯应用，但仍对执行敏感。
        - label: 独立药店
          values:
            - label: 店主 / 采购员
              tone: neutral
              detail: 单个买家通常按治疗领域控制采购。
            - label: 品类 + 可靠性
              tone: positive
              detail: 可得性、效期管理和可靠配送最重要。
            - label: 中高
              tone: neutral
              detail: 采购频繁，但比 kirana 更受治疗领域和监管影响。
            - label: 中
              tone: neutral
              detail: 信贷有帮助，但合规和库存风险同样重要。
            - label: 中
              tone: neutral
              detail: 数字化正随更广泛的药品渠道变化一起提升。
        - label: 餐饮 / HoReCa 门店
          values:
            - label: 门店 P&L 负责人
              tone: neutral
              detail: 厨师、经理或店主往往掌握采购。
            - label: 服务可靠性
              tone: positive
              detail: 新鲜度、配送准点和更少供应商触点推动采用。
            - label: 波动大
              tone: warning
              detail: 订单节奏比 FMCG 零售补货更难预测。
            - label: 中高
              tone: warning
              detail: 订单可能更大且有季节性，现金流很关键。
            - label: 中
              tone: neutral
              detail: 数字下单可以跑通，但运营复杂度仍高。
        - label: 小型批发商 / 经销商
          values:
            - label: 业主管理
              tone: neutral
              detail: 采购权集中，但决策由利润驱动。
            - label: 价差套利
              tone: neutral
