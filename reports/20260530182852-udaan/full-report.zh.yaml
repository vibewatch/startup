      - - 商业信贷 / udaanCapital
        - 零售商、品牌方、制造商
        - 买家文案强调灵活融资；关于页领导层文案称其为技术驱动的供应链融资平台。
        - 模块已上线，并有专门负责人。
        - 信贷嵌在补货流程里，而不是另开一个金融科技入口。
        - 没有公开 APR、逾期指标或贷款合作方拆分。
      - - 自有品牌计划
        - 零售买家和品类 P&L 负责人
        - 官网首页和 2025 年融资报道突出自有品牌基础食品和自有日用品。
        - 项目活跃且在扩张，但公开细节有限。
        - 支撑高频品类的利润率和选品控制。
        - 没有公开品牌清单、质量记分卡或自有品牌收入占比。
      - - horeca360 by udaan 业务线
