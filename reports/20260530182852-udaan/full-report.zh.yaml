  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 证据支撑
      - 威胁路径
      - 严重性
      - 缓释措施 / 尽调要求
    rows:
      - - 自有补货密度
        - 复购篮子和配送可靠性重要时，Udaan 和 Jumbotail 都比发现平台更有粘性
        - Amazon、Reliance 和即时零售仍可重定价便利性，或抢走紧急订单
        - 高
        - 索取城市级复购和钱包份额队列，证明密度是可持续的，而不是促销推出来的
      - - 嵌入式金融锁定效应
        - 信贷和支付闭环把库存驱动型创业公司与 IndiaMART 及许多批发替代方案明显区分开
        - 若逾期、资金成本或欺诈定价错误，信贷会摧毁经济性
        - 高
        - 按买家队列获取 vintage 级逾期、回收和批准率数据
      - - 供应商和品牌触达
        - Jumbotail 的 GTM 推进和 Solv 收购表明，捕获供应商预算可以加深护城河
        - ElasticRun、Amazon 和大型在位者同样有广泛供应商触达
        - 高
        - 按品类梳理独家品牌、自有品牌和优先贸易条款
      - - 信任与合规姿态
        - Amazon Business、IndiaMART 和 METRO 公开的采购或披露信号强于私营创业公司
        - 即便运营深度较浅，机构买家也可能偏好这些渠道
        - 中-高
        - 测试信任缺口是否真实体现在输赢单或企业扩张数据中
      - - 线下相邻性
        - Reliance/METRO 和 JioMart 可借力门店和现有本地基础设施
        - 独立创业公司必须直接投入密度，并防守更快的本地履约
        - 高
        - 按城市比较获客成本、履约成本与门店支撑型替代方案
      - - 模型清晰度
        - ElasticRun 的业务宽度证明基础设施可以很有力量
        - 同样的宽度也可能稀释品类聚焦，并遮住利润池
        - 中-高
        - 先拆分农村分销、企业物流和即时零售经济性，再把它作为同类基准
    notes: 风险登记表把公开证据转成承销风险，而不是确定性结论。严重性反映对留存、利润率耐久性或资本强度的可能影响，不代表建模后的财务损失。
