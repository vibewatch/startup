  - id: FM004
    title: 采用漏斗 / 价值链地图
    type: flow
    layout: wide
    summary: 商户采购数字化要依次跑过寻源、下单、支付、履约、货架周转和复购；每一环都能靠数字通道增强，但没有运营密度和信贷纪律，仍会掉链子。
    data:
      nodes:
        - id: n1
          label: 供应商 / 品牌目录上线可浏览
          detail: 平台接入、品类标准化和价格可见，才让线上浏览可行。
          tone: neutral
        - id: n2
          label: 商户比较采购篮、满足率和发票质量
          detail: 采购者判断平台是否优于分销代表或批发市场跑货。
          tone: neutral
        - id: n3
          label: 通过 App 或辅助交易下单
          detail: UPI 使用习惯、正规发票和更简单流程都会提升数字下单。
          tone: positive
        - id: n4
          label: 选择授信或支付方式
          detail: 有些商户立即付款，另一些需要营运资金支持；这时监管和贷款方经济账很关键。
          tone: warning
        - id: n5
          label: 完成履约与配送
          detail: 这里执行风险最高：服务水平、新鲜度和路线密度决定信任。
          tone: warning
        - id: n6
          label: 商品经门店售出
          detail: 货架周转和库存周转决定商户是否沿用同一渠道复购。
          tone: positive
        - id: n7
          label: 还款、复购和钱包份额扩张
          detail: 只有服务跑顺、经济账健康，平台才能加深钱包份额或挂上融资服务。
          tone: positive
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
    approximationNotes: null
