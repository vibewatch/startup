    data:
      columns:
        - 营运资金负荷
        - 履约 / 物流负荷
        - 信用 / 回款负荷
        - 外部资本依赖
        - 公开可见度
      rows:
        - label: 库存主导的货品交易基础
          values:
            - tone: warning
              label: 高
              detail: 货品交易主导顶线规模，并消耗库存资金。
            - tone: warning
              label: 中高
              detail: 需要高密度履约才能守住利润率。
            - tone: neutral
              label: 中
              detail: 一旦挂上信用，回款就变关键。
            - tone: warning
