      - number: '8.2'
        title: 当前估值语境和可比框架
        blocks:
          - type: paragraph
            body: >-
              按表面看，Udaan 的定价并不像一项坏资产。用 June 2025 约 $1.8 billion 标记和 FY25 合并收入 ₹4,561.4 crore 计算，并明确采用每美元 ₹84.5
              的汇率假设，公司约为 3.3x 滚动销售额。若改用 FY24 收入 ₹5,706.6 crore，倍数降至约
              2.7x；每当管理层引用运行率增长、而最新经审计收入仍反映重置后基数时，这就是需要记住的限定。因此，这里的正确输出是区间，而不是精确目标。


              公开可比公司组给出的更像上限，而不是直接可套用的同业倍数。IndiaMART 是印度上市公司中最干净的数字 B2B
              发现平台类比，但它也是质量高得多的盈利流：市场数据来源和与申报相关的材料显示，它是盈利、轻资产的订阅平台，EV/revenue 约 5.6x，EV/EBITDA 为十几倍低到中段。Udaan
              仍背负库存、物流、营运资金和信贷强度时，不应突破这个水平。Jumbotail 是更接近的私营运营可比对象，但规模仍更小，透明度也只是一部分。ElasticRun
              的主要价值是警示：当物流重型故事失宠，后期私募估值标记会急剧压缩。Metro AG 则提供硬下行情景的校准：利润率很薄的公开批发业务可以按很低的收入倍数交易。
