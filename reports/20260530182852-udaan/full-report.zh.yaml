      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 可用市场是零售商采购层，不是万亿美元级零售标题数字
            body: 印度零售市场毫无疑问很大，但 Udaan 只有在碎片化商户选择数字补货、有时还选择商户信贷的地方才能捕获价值。因此，对决策最有用的公开口径是零售商主导的 eB2B，而不是总零售需求或全部互联商业。
