      - - 集群重置叠加 16 城密度，让经营模型比过去 1,000 城铺开的模式更清晰。
        - 提高已披露收入转化为更好贡献经济性的概率。
        - 城市层面的毛利率、履约成本和复购率数据会显著增强这一支撑。
      - - CY24 按年化口径增长、贡献利润率改善 300+ bps、烧钱下降，说明转型不是空话。
        - 支撑基准估值仍有可能守住当前估值附近。
        - FY26 审计收入增长以及 EBITDA / 经营现金流必须验证管理层叙事。
      - - ShopKirana 能加深 FMCG 采购、Bharat 触达和自有品牌杠杆。
        - 这是少数能把估值推高到当前水平之上的现实路径。
        - 在给予协同加分前，需要整合记分卡以及供应商 / 买家留存数据。
      - - 反方论点：相较 IndiaMART，Udaan 仍偏库存驱动、低利润率，并且占用营运资本。
        - 这种结构差异应把估值倍数压在轻资产上市平台龙头之下。
        - 若毛利率能持续扩张、现金占用降低，折价会收窄。
      - - 反方论点：公司仍在亏损，关键估值输入仍未披露。
        - 资金续航、信贷损失和股权结构表缺失，使普通股回报更难判断。
        - FY26 审计现金流披露和优先权条款会显著改善判断质量。
      - - 反方论点：多轮重置说明当前轮次仍是桥接估值，还不是充分验证的复利估值。
        - 即便 Series G 已完成，下轮降价或 IPO 延后风险仍然重要。
        - 再有 12 个月更干净的审计执行记录，会降低这一担忧。
    notes: 正向论点可信，但仍有条件；每个积极支点都有明确证据门槛，达到后才应上调判断。
