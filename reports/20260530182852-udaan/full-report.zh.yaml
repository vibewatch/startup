      - number: '4.4'
        title: 申报口径可见度缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              基于申报文件的公开证据，是本章最弱的部分。Entrackr 明确把 FY24 回顾与通过 Singapore 的 Trustroot Internet
              提交的合并财务报表相连，但注册信息汇编产品在同一边界上对不齐。Inc42 把 FY24 收入挂到 Hiveloop Technology，Tracxn 则显示 Udaan India Private
              Limited 的 FY25 收入数字小得多、员工数为 105；Edge Insights 对 Trustroot
              暴露的多数是占位信息，而不是可用的公开报表集。这些来源仍有用，因为它们证明集团有多个法律实体，也证明公开注册摘要不能与合并运营账户互换。它们不足以替代原始申报报表。


              最终判断因此很直接。Udaan
              的财务方向在改善：亏损下降、烧钱下降、固定成本下降，公司也重新打开了债务和股权资本通道。但收入质量仍主要由库存驱动，当前资产负债表位置无法用公开数据精确测量，围绕现金跑道、信贷损失表现、库存周转和实体层面对账的关键尽调障碍仍未解决。对投资者而言，这不再是纯困境叙事；而是一个“正在重组但披露不足”的叙事。这足以支撑对利润率轨迹的谨慎建设性看法，但不足以在没有管理层数据室证据的情况下承销自我维持的经济性。
