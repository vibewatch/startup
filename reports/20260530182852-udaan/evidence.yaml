evidenceGaps:
  - type: missing-source
    severity: material
    topic: market-share-verification
    missingEvidence: >-
      An independent market-share study or disclosed cohort count that validates Udaan’s claimed ~70% share and
      “millions” of active small-business users.
    whyItMatters: >-
