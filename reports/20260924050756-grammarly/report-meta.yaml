  topStrengths:
    - Massive consumer distribution and recognizable brand
    - Clear monetization paths across freemium, enterprise, and suite expansion
    - Demonstrated customer proof in enterprise and workflow use cases
  topRisks:
    - Public financial and retention disclosure remains thin
