- id: TV003
  title: Bull / base / bear cases
  columns:
  - Aspect
  - Fact
  - Why it matters
  rows:
  - - Bull
    - Suite adoption and enterprise growth re-rate the business
    - Upside requires strong retention and lower legal drag.
  - - Base
    - Good growth but still opaque metrics
    - This is the current evidence-weighted case.
  - - Bear
    - Lawsuit / platform issues slow growth and compress valuation
    - Downside comes from trust and distribution failure.
  - - Bull trigger
    - Public NRR / margin disclosure
    - Would materially improve underwriting.
  - - Bear trigger
    - Prolonged adverse legal outcome
    - Would weaken the brand and business model.
  notes: Scenarios are qualitative because key financial metrics are undisclosed.
