runDate: '2026-09-24'
company:
  name: Grammarly
chapter:
  number: 8
  title: Valuation
  summary: Grammarly looks like a strong product and distribution asset, but the public evidence still supports a cautious
    track/research-more posture rather than a clear buy. Valuation remains expensive relative to disclosed growth and the
    unresolved legal, covenant, and retention questions.
sections:
- id: s1
  title: How to think about the stock
  body: "Thesis \u2014 Grammarly has real scale and product pull.. That supports a constructive baseline. Anti-thesis \u2014\
    \ Key metrics and legal risk remain opaque.. That limits conviction. Recommendation \u2014 Track rather than buy today..\
    \ The current evidence is not enough for an aggressive entry. Taken together, this how to think about the stock section\
    \ uses public evidence to triangulate the most defensible view, while keeping the remaining uncertainty explicit instead\
    \ of smoothing it over. The intent is to preserve decision-useful detail, show where the public record is strong, and\
    \ isolate the missing evidence that still controls the judgment. That framing should be read as a working diligence note\
    \ rather than a final verdict, which helps keep the chapter usable when new evidence lands."
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
- id: s2
  title: What the market is pricing
  body: "Capital \u2014 The 2025 CVF deal did not reset equity value.. The old valuation still anchors expectations. Comp\
    \ set \u2014 Private-market and productivity comps imply premium expectations.. The market is still paying for the thesis.\
    \ Risk \u2014 The current setup still looks expensive.. Entry discipline matters. Taken together, this what the market\
    \ is pricing section uses public evidence to triangulate the most defensible view, while keeping the remaining uncertainty\
    \ explicit instead of smoothing it over. The intent is to preserve decision-useful detail, show where the public record\
    \ is strong, and isolate the missing evidence that still controls the judgment. That framing should be read as a working\
    \ diligence note rather than a final verdict, which helps keep the chapter usable when new evidence lands."
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  tableRefs:
  - TV003
- id: s3
  title: What could change the call
  body: "Bull case \u2014 Disclosure of retention and margin could improve the story.. That would increase confidence. Bear\
    \ case \u2014 Legal or platform issues could impair value.. That would reduce the multiple. Diligence asks \u2014 NRR,\
    \ margin, CVF terms, and legal status are the key asks.. These are the missing pieces. Taken together, this what could\
    \ change the call section uses public evidence to triangulate the most defensible view, while keeping the remaining uncertainty\
    \ explicit instead of smoothing it over. The intent is to preserve decision-useful detail, show where the public record\
    \ is strong, and isolate the missing evidence that still controls the judgment. That framing should be read as a working\
    \ diligence note rather than a final verdict, which helps keep the chapter usable when new evidence lands."
  claimRefs: []
  tableRefs: []
