schemaVersion: report-v2
artifact: risks
slug: grammarly
runDate: '2026-09-24'
company:
  name: Grammarly
chapter:
  number: 7
  title: Risks
  summary: The most material risks are legal and reputational, followed by product trust, platform dependence, and opaque
    financial controls. The recent lawsuit coverage is a reminder that the AI-writing category carries asymmetric downside
    if consent and identity boundaries are mishandled.
sections:
- id: s1
  title: Legal and regulatory risk
  body: "Consent \u2014 The lawsuit and expert-review controversy are the biggest near-term risks.. This can damage brand\
    \ trust. Disclosure \u2014 AI disclosure and attribution remain sensitive.. This is both a legal and reputational issue.\
    \ Privacy \u2014 Enterprise buyers care about data handling.. This can affect the sales cycle. Taken together, this legal\
    \ and regulatory risk section uses public evidence to triangulate the most defensible view, while keeping the remaining\
    \ uncertainty explicit instead of smoothing it over. The intent is to preserve decision-useful detail, show where the\
    \ public record is strong, and isolate the missing evidence that still controls the judgment. That framing should be read\
    \ as a working diligence note rather than a final verdict, which helps keep the chapter usable when new evidence lands."
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  tableRefs:
  - TR001
  - TR002
  figureRefs:
  - FR001
- id: s2
  title: Operational and dependency risk
  body: "Platform \u2014 Browser and platform dependencies are structural.. This is a non-trivial risk. People \u2014 Leadership\
    \ concentration and rebrand execution matter.. Execution can be slowed by complexity. Support \u2014 A broad product surface\
    \ increases support burden.. Quality issues matter more at scale. Taken together, this operational and dependency risk\
    \ section uses public evidence to triangulate the most defensible view, while keeping the remaining uncertainty explicit\
    \ instead of smoothing it over. The intent is to preserve decision-useful detail, show where the public record is strong,\
    \ and isolate the missing evidence that still controls the judgment. That framing should be read as a working diligence\
    \ note rather than a final verdict, which helps keep the chapter usable when new evidence lands."
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  tableRefs:
  - TR003
- id: s3
  title: What would break the thesis
  body: "Kill criteria \u2014 Prolonged legal failure or no enterprise retention evidence would be thesis-breakers.. These\
    \ are the key downside triggers. Mitigations \u2014 Privacy, DLP, and suite integration are the main mitigants.. The business\
    \ must keep trust high. Watch list \u2014 Legal updates, customer proofs, and product trust metrics should be watched\
    \ closely.. Those are the fastest-moving signals. Taken together, this what would break the thesis section uses public\
    \ evidence to triangulate the most defensible view, while keeping the remaining uncertainty explicit instead of smoothing\
    \ it over. The intent is to preserve decision-useful detail, show where the public record is strong, and isolate the missing\
    \ evidence that still controls the judgment. That framing should be read as a working diligence note rather than a final\
    \ verdict, which helps keep the chapter usable when new evidence lands."
  claimRefs: []
  tableRefs: []
