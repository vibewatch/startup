- id: TP003
  title: Pricing and packaging
  columns:
  - Aspect
  - Fact
  - Why it matters
  rows:
  - - Free
    - $0 entry point
    - This keeps Grammarly at the top of the funnel.
  - - Pro
    - $12/member/month annually or $30 monthly
    - This is the core self-serve monetization tier.
  - - Enterprise
    - Custom pricing with admin and governance controls
    - This supports larger ACV and procurement.
  - - Competitive pricing
    - Many substitutes are bundled or cheaper
    - Pricing pressure stays intense.
  - - Switching
    - Multi-homing is common
    - Low switching costs weaken lock-in.
  notes: Pricing table emphasizes how bundled and low-cost substitutes constrain the market.
