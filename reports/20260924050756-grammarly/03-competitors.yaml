- id: TP002
  title: Feature comparison
  columns:
  - Aspect
  - Fact
  - Why it matters
  rows:
  - - Real-time edits
    - Grammarly still wins on inline, cross-app suggestions
    - This is the company's core product claim.
  - - Brand voice
    - Tone and style controls remain a differentiator
    - Brand consistency is key for teams.
  - - Agents
    - Competitors are adding agentic editing experiences
    - The feature gap is narrowing fast.
  - - Plagiarism / originality
    - Some rivals bundle checkers; others do not
    - Trust and academic use cases depend on this.
  - - Distribution
    - Browser, desktop, mobile, and docs coverage matter
    - Surface area is a moat and a battleground.
  notes: Comparison table focuses on product scope and delivery surfaces.
