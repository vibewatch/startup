company:
  name: Grammarly
chapter:
  number: 4
  title: Financials
  summary: Grammarly remains a cash-generative, high-reach software business with a simple freemium monetization engine, but
    the public financial picture is still incomplete. The 2025 General Catalyst CVF deal and the latest company revenue claims
    are supportive, yet margin, NRR, and capital-structure details remain opaque.
sections:
- id: s1
  title: How Grammarly makes money
  body: "Revenue \u2014 The business monetizes freemium users, teams, and enterprise buyers.. This underpins the business\
    \ model. Pricing \u2014 Public pricing is simple but conversion is what matters.. The economics come from conversion and\
    \ expansion. Growth \u2014 Growth uses lifecycle marketing and enterprise upsell.. Channel economics are central to the\
    \ model. Taken together, this how grammarly makes money section uses public evidence to triangulate the most defensible\
    \ view, while keeping the remaining uncertainty explicit instead of smoothing it over. The intent is to preserve decision-useful\
    \ detail, show where the public record is strong, and isolate the missing evidence that still controls the judgment. That\
    \ framing should be read as a working diligence note rather than a final verdict, which helps keep the chapter usable\
    \ when new evidence lands."
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: s2
  title: What is and is not disclosed
  body: "Proxies \u2014 The best public proxies are users, organizations, and email volumes.. The company is scale-rich but\
    \ metric-light. Capital \u2014 The 2025 CVF deal adds capital without resetting valuation.. That changes the financial\
    \ risk profile. Gaps \u2014 NRR, margin, and runway remain undisclosed.. These are the main diligence blockers. Taken\
    \ together, this what is and is not disclosed section uses public evidence to triangulate the most defensible view, while\
    \ keeping the remaining uncertainty explicit instead of smoothing it over. The intent is to preserve decision-useful detail,\
    \ show where the public record is strong, and isolate the missing evidence that still controls the judgment. That framing\
    \ should be read as a working diligence note rather than a final verdict, which helps keep the chapter usable when new\
    \ evidence lands."
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  tableRefs:
  - TI003
- id: s3
  title: What the financing implies
  body: "Monetization \u2014 The model appears healthy enough to support growth capital.. That is a positive signal. Risk\
    \ \u2014 Opaque covenants and missing margin data cap conviction.. Downside modeling stays difficult. Verdict \u2014 The\
    \ financial picture is good but incomplete.. The chapter supports a cautious track posture. Taken together, this what\
    \ the financing implies section uses public evidence to triangulate the most defensible view, while keeping the remaining\
    \ uncertainty explicit instead of smoothing it over. The intent is to preserve decision-useful detail, show where the\
    \ public record is strong, and isolate the missing evidence that still controls the judgment. That framing should be read\
    \ as a working diligence note rather than a final verdict, which helps keep the chapter usable when new evidence lands."
  claimRefs: []
  tableRefs: []
