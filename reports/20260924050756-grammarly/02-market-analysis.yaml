- id: TM002
  title: Buyer and payer split
  columns:
  - Aspect
  - Fact
  - Why it matters
  rows:
  - - Consumers
    - Individual writers, students, and job seekers
    - They drive freemium acquisition and top-of-funnel scale.
  - - Teams
    - Marketing, support, and operations teams
    - Teams buy for consistency and time savings.
  - - Enterprise
    - Large organizations with governance needs
    - Enterprise budgets support higher ACV and admin features.
  - - Education
    - Students and instructors
    - Education broadens the funnel and helps habit formation.
  - - Payer complexity
    - User and payer are often different people
    - That complicates conversion and messaging.
  notes: Segmentation combines company claims with partner/customer case-study evidence.
