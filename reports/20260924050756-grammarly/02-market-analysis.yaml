slug: grammarly
runDate: '2026-09-24'
company:
  name: Grammarly
chapter:
  number: 2
  title: Market Analysis
  summary: Grammarly sits inside a broad AI-writing and communication workflow market that spans consumer writing, team collaboration,
    education, and enterprise productivity. The category is huge but fragmented, with strong platform substitutes and trust/privacy
    constraints that make precise sizing difficult.
sections:
- id: s1
  title: Where the market begins and ends
  body: "Boundary \u2014 The market is writing assistance plus adjacent productivity surfaces.. A tight boundary prevents\
    \ an inflated TAM. Substitutes \u2014 Built-in editors, chatbots, and human editing are all real alternatives.. Substitutes\
    \ keep pricing power in check. Fragmentation \u2014 The category is broad but not winner-take-all yet.. Fragmentation\
    \ explains why sizing is uncertain. Taken together, this where the market begins and ends section uses public evidence\
    \ to triangulate the most defensible view, while keeping the remaining uncertainty explicit instead of smoothing it over.\
    \ The intent is to preserve decision-useful detail, show where the public record is strong, and isolate the missing evidence\
    \ that still controls the judgment. That framing should be read as a working diligence note rather than a final verdict,\
    \ which helps keep the chapter usable when new evidence lands."
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: s2
  title: Who pays and why
  body: "Buyers \u2014 Consumers, teams, enterprises, and education each buy for different reasons.. The same product must\
    \ serve multiple segments. Drivers \u2014 Speed, quality, scale, and trust are the core adoption drivers.. Those drivers\
    \ make the ROI argument understandable. Channels \u2014 Freemium and lifecycle marketing still do most of the work.. That\
    \ channel mix shapes the market thesis. Taken together, this who pays and why section uses public evidence to triangulate\
    \ the most defensible view, while keeping the remaining uncertainty explicit instead of smoothing it over. The intent\
    \ is to preserve decision-useful detail, show where the public record is strong, and isolate the missing evidence that\
    \ still controls the judgment. That framing should be read as a working diligence note rather than a final verdict, which\
    \ helps keep the chapter usable when new evidence lands."
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  tableRefs:
  - TM002
  - TM003
- id: s3
  title: Why sizing stays fuzzy
  body: "Constraints \u2014 Trust, policy, and budget friction slow adoption.. These frictions make top-down sizing too optimistic.\
    \ Lenses \u2014 Usage, organization, education, and workflow all provide different size lenses.. Using several lenses\
    \ is more defensible than one broad number. Gaps \u2014 Public TAM and retention data remain incomplete.. The market thesis\
    \ should remain evidence-constrained. Taken together, this why sizing stays fuzzy section uses public evidence to triangulate\
    \ the most defensible view, while keeping the remaining uncertainty explicit instead of smoothing it over. The intent\
    \ is to preserve decision-useful detail, show where the public record is strong, and isolate the missing evidence that\
    \ still controls the judgment. That framing should be read as a working diligence note rather than a final verdict, which\
    \ helps keep the chapter usable when new evidence lands."
  claimRefs: []
  tableRefs: []
tables:
- id: TM001
  title: Market boundary
  columns:
  - Aspect
  - Fact
  - Why it matters
  rows:
  - - Included
    - AI writing help, editing, tone, and workflow agents
    - This is the core addressable category.
  - - Excluded
    - General-purpose chatbots without writing workflow
    - Those tools are adjacent, not identical.
  - - Adjacencies
    - Email productivity, docs collaboration, and review automation
    - The category bleeds into broader productivity software.
  - - Status quo
    - Built-in spellcheck and manual editing
    - These remain the main substitutes.
  - - Substitute risk
    - Users can multi-home across several writing tools
    - Low switching costs make the market more competitive.
  notes: Boundary table uses a narrow-but-practical market definition rather than a single broad TAM number.
