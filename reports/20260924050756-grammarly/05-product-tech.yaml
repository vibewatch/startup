schemaVersion: report-v2
artifact: product-tech
slug: grammarly
runDate: '2026-09-24'
company:
  name: Grammarly
chapter:
  number: 5
  title: Product & Technology
  summary: Grammarly is now best understood as a cross-surface writing workflow and agent platform rather than a single grammar
    checker. The architecture spans browser, desktop, mobile, docs, and agents, with trust and platform access central to
    the technical moat.
sections:
- id: s1
  title: What the product is
  body: "Surface \u2014 Grammarly now spans many writing surfaces.. It is more than a grammar checker. Agentic \u2014 Specialized\
    \ agents are the core roadmap.. The platform is becoming agentic. Docs \u2014 A dedicated writing surface anchors the\
    \ suite.. This adds control and retention. Taken together, this what the product is section uses public evidence to triangulate\
    \ the most defensible view, while keeping the remaining uncertainty explicit instead of smoothing it over. The intent\
    \ is to preserve decision-useful detail, show where the public record is strong, and isolate the missing evidence that\
    \ still controls the judgment. That framing should be read as a working diligence note rather than a final verdict, which\
    \ helps keep the chapter usable when new evidence lands."
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: s2
  title: How it works
  body: "Architecture \u2014 The product is a cross-app layer atop writing workflows.. Distribution is the operating model.\
    \ Controls \u2014 Security and privacy are key to enterprise use.. Trust is a product feature. Quality \u2014 Latency\
    \ and reliability remain central.. A lot rides on execution quality. Taken together, this how it works section uses public\
    \ evidence to triangulate the most defensible view, while keeping the remaining uncertainty explicit instead of smoothing\
    \ it over. The intent is to preserve decision-useful detail, show where the public record is strong, and isolate the missing\
    \ evidence that still controls the judgment. That framing should be read as a working diligence note rather than a final\
    \ verdict, which helps keep the chapter usable when new evidence lands."
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  tableRefs:
  - TE003
- id: s3
  title: What could break
  body: "Roadmap \u2014 The moat depends on moving up the workflow stack.. Feature parity is a risk. Gaps \u2014 Model-level\
    \ details are not public.. The technical moat is hard to underwrite without them. Taken together, this what could break\
    \ section uses public evidence to triangulate the most defensible view, while keeping the remaining uncertainty explicit\
    \ instead of smoothing it over. The intent is to preserve decision-useful detail, show where the public record is strong,\
    \ and isolate the missing evidence that still controls the judgment. That framing should be read as a working diligence\
    \ note rather than a final verdict, which helps keep the chapter usable when new evidence lands."
  claimRefs: []
  tableRefs: []
