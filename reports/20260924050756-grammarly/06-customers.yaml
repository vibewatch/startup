company:
  name: Grammarly
chapter:
  number: 6
  title: Customers
  summary: Grammarly serves a wide customer base that spans consumers, students, teams, and large enterprises. The strongest
    public evidence comes from case studies and usage claims, but retention and concentration disclosure remain incomplete.
sections:
- id: s1
  title: Who buys and uses it
  body: "Segments \u2014 Consumers, teams, enterprise, and education all use the product.. Customer variety drives scale.\
    \ Payers \u2014 The payer and user are often the same, but not always.. That affects conversion. Channels \u2014 Partners\
    \ and embedded surfaces support reach.. Distribution matters. Taken together, this who buys and uses it section uses public\
    \ evidence to triangulate the most defensible view, while keeping the remaining uncertainty explicit instead of smoothing\
    \ it over. The intent is to preserve decision-useful detail, show where the public record is strong, and isolate the missing\
    \ evidence that still controls the judgment. That framing should be read as a working diligence note rather than a final\
    \ verdict, which helps keep the chapter usable when new evidence lands."
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: s2
  title: What adoption looks like
  body: "Scale \u2014 Users and organizations are both large.. Scale and enterprise proof coexist. Proof \u2014 Customer case\
    \ studies show real ROI.. The product has visible business impact. Durability \u2014 Retention metrics are not public..\
    \ This is the biggest gap. Taken together, this what adoption looks like section uses public evidence to triangulate the\
    \ most defensible view, while keeping the remaining uncertainty explicit instead of smoothing it over. The intent is to\
    \ preserve decision-useful detail, show where the public record is strong, and isolate the missing evidence that still\
    \ controls the judgment. That framing should be read as a working diligence note rather than a final verdict, which helps\
    \ keep the chapter usable when new evidence lands."
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  tableRefs:
  - TU002
  - TU003
- id: s3
  title: Where risk concentrates
  body: "Expansion \u2014 Land-and-expand is plausible but not fully measurable.. Up-sell is a key thesis driver. Concentration\
    \ \u2014 Top-customer concentration is not disclosed.. This leaves a material risk gap. Verdict \u2014 Customer adoption\
    \ is strong, but the cohort math is not public.. Track the business, but keep gaps open. Taken together, this where risk\
    \ concentrates section uses public evidence to triangulate the most defensible view, while keeping the remaining uncertainty\
    \ explicit instead of smoothing it over. The intent is to preserve decision-useful detail, show where the public record\
    \ is strong, and isolate the missing evidence that still controls the judgment. That framing should be read as a working\
    \ diligence note rather than a final verdict, which helps keep the chapter usable when new evidence lands."
