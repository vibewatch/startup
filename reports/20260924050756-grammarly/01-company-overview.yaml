chapter:
  number: 1
  title: Company Overview
  summary: Grammarly is a late-stage private AI writing platform that combines consumer distribution, enterprise monetization,
    and a new Superhuman-branded product stack. The public record supports a 2009 origin, a 2025 $1B General Catalyst CVF
    deal, and 40M+ daily users, but current retention, margin, and headcount disclosure remain incomplete.
sections:
- id: s1
  title: What Grammarly is
  body: "Company \u2014 Grammarly is an AI writing and productivity platform.. This anchors the company identity and business\
    \ model. Founding \u2014 The company dates to 2009 and a Kyiv origin story.. That origin frames the rest of the historical\
    \ analysis. Stage \u2014 The business remains late-stage private and pre-IPO.. Stage matters for how we underwrite the\
    \ risk/reward profile. Taken together, this what grammarly is section uses public evidence to triangulate the most defensible\
    \ view, while keeping the remaining uncertainty explicit instead of smoothing it over. The intent is to preserve decision-useful\
    \ detail, show where the public record is strong, and isolate the missing evidence that still controls the judgment. That\
    \ framing should be read as a working diligence note rather than a final verdict, which helps keep the chapter usable\
    \ when new evidence lands."
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
