- id: s2
  title: Who runs it
  body: "CEO \u2014 Shishir Mehrotra leads the post-Coda integration.. Leadership continuity affects execution risk. Offices\
    \ \u2014 The workforce is distributed across four key offices.. Geographic distribution is a resilience and coordination\
    \ issue. Governance \u2014 Founders still matter to the story and the board.. Key-person and governance concentration\
    \ remain relevant. Taken together, this who runs it section uses public evidence to triangulate the most defensible view,\
    \ while keeping the remaining uncertainty explicit instead of smoothing it over. The intent is to preserve decision-useful\
    \ detail, show where the public record is strong, and isolate the missing evidence that still controls the judgment. That\
    \ framing should be read as a working diligence note rather than a final verdict, which helps keep the chapter usable\
    \ when new evidence lands."
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  tableRefs:
  - TO002
- id: s3
  title: Why the current financing matters
  body: "Users \u2014 40M+ daily users support the platform thesis.. Scale is what makes the CVF financing possible. Funding\
    \ \u2014 $1B CVF capital and $13B historical equity frame the stack.. Capital structure and valuation are central to the\
    \ refresh. Gaps \u2014 Retention, margin, and headcount remain undisclosed.. The missing metrics are the main diligence\
    \ blockers. Taken together, this why the current financing matters section uses public evidence to triangulate the most\
    \ defensible view, while keeping the remaining uncertainty explicit instead of smoothing it over. The intent is to preserve\
    \ decision-useful detail, show where the public record is strong, and isolate the missing evidence that still controls\
    \ the judgment. That framing should be read as a working diligence note rather than a final verdict, which helps keep\
    \ the chapter usable when new evidence lands."
