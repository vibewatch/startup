companyProfile:
  summary: >-
    Isomorphic Labs is an Alphabet-backed AI drug discovery company that applies AlphaFold 3-derived foundation models
    and the IsoDDE platform to partner-led and wholly owned therapeutic programs. Founded in 2021 and headquartered in
    London, it pairs bespoke pharma collaborations with an expanding internal pipeline, but public sources still leave
    valuation, revenue, governance rights, and human clinical validation unresolved.
