    claimRefs: ["CP001", "CP008", "CP009", "CP015"]
callouts:
  - calloutType: "strength"
    title: "Capital and scientific positioning are the clearest current advantages"
    body: "The reported financing scale and AlphaFold-derived engine give Isomorphic unusual capacity to fund compute, interdisciplinary teams, partner programs, and internal candidates, although funding raised should not be read as revenue or remaining cash."
    claimRefs: ["CP003", "CP005"]
  - calloutType: "risk"
    title: "Clinical translation is the decisive competitive test"
    body: "No retained source establishes a human Phase II readout, a normalized cross-platform benchmark, or public unit economics; the moat remains conditional on named candidates, repeat milestones, and buyer-verified productivity."
    claimRefs: ["CP012", "CP013", "CP014", "CP016"]
