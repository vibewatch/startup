    title: "Capability and diligence matrix"
    columns: ["Buying criterion", "Isomorphic Labs evidence", "Peer / substitute evidence", "Underwriting interpretation"]
    rows:
      - ["Molecular-design depth", "Company claims a unified engine for historically difficult targets", "Adjacent assistants address broader research workflows; direct-peer depth is not comparable in retained evidence", "Potential differentiator, but vendor claims need buyer-specific validation"]
      - ["Structure and generative design", "RFP.wiki scores 5.0/5 for Structure-Based Modeling and 4.9/5 for Generative Molecular Design", "No common independent leaderboard retained", "Use the scores as review signals, not independent benchmark results"]
      - ["Predictive ADMET", "RFP.wiki scores 3.4/5 and says public endpoint and calibration detail is limited", "Unknown for named direct peers in retained evidence", "Require endpoint-level validation and uncertainty reporting"]
      - ["Workflow integration", "No public ELN, LIMS, or data-lake integrations listed by RFP.wiki", "Internal builds may fit proprietary workflows, but evidence is buyer-specific", "Integration burden and switching cost remain open"]
      - ["Data governance and IP", "RFP.wiki says public lineage, audit, and training-boundary detail is limited", "Unknown on a consistent basis", "Contract and security review are gating diligence, not checklist items"]
      - ["Clinical translation", "No human Phase II readout identified in the retained adverse analysis", "No normalized clinical comparator set retained", "Technical differentiation remains upstream of patient-level proof"]
    notes: "RFP.wiki ratings are publisher-authored comparison scores, not independent benchmarks; all peer cells without retained support are marked unknown."
    claimRefs: ["CP005", "CP006", "CP007", "CP010", "CP011", "CP014", "CP016"]
  - id: "TP003"
    title: "Pricing and packaging comparison"
    columns: ["Alternative", "Published price / unit", "Access model", "Included capability", "Unknown or implication"]
    rows:
      - ["Isomorphic Labs / IsoDDE", "No public list price", "Negotiated pharma partnership", "Molecular-design collaboration and internal engine", "Total cost, discounting, IP allocation, and realized economics require contract evidence"]
      - ["Claude Science", "$17-$200 per month across cited subscription tiers", "Self-service or organizational subscription", "General scientific research workbench", "Not a like-for-like molecular-design partner"]
      - ["GPT-Rosalind", "Undisclosed during cited research preview", "Trusted-access enterprise review", "Specialized life-sciences reasoning model", "Availability and normalized total cost are unresolved"]
      - ["Direct AI-native peers", "Unknown in retained evidence", "Primarily partnerships in the examples retained", "Drug-discovery or design programs", "No normalized price, unit, or scope comparison is supportable"]
      - ["Internal pharma build / conventional workflow", "Unknown; buyer-specific personnel, compute, data, and laboratory cost", "Internal ownership", "Control of proprietary workflows and data", "Requires a historical-campaign baseline to compare cycle time and decision quality"]
    notes: "Published prices and access descriptions come from the July 2026 IntuitionLabs comparison; no realized Isomorphic contract economics or normalized total-cost denominator was available."
    claimRefs: ["CP008", "CP009", "CP010", "CP011", "CP015"]
