      - ["Internal pharma build", "Substitute / status quo", "No public cross-company cost basis retained", "Pharma R&D organizations", "Uses proprietary data and existing workflows", "True internal cost, model quality, and time-to-value require buyer-specific baselines"]
    notes: "Partial landscape assembled only from the retained 2026 source pool; reported valuations and funding are different metrics, and blank comparative evidence is stated as unknown rather than inferred."
    enumerationScope:
      coverage: "sample"
      basis: "Representative direct peers and buyer substitutes explicitly named or described in the retained source pool."
    claimRefs: ["CP002", "CP003", "CP004", "CP012", "CP013", "CP014"]
