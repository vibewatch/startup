callouts:
  - calloutType: "insight"
    title: "The Headline Milestone Fallacy in AI Drug Discovery Deals"
    body: "Market commentary frequently cites multi-billion-dollar partnership announcements—such as Isomorphic Labs' combined $3.0 billion-plus potential milestones with Eli Lilly and Novartis—as evidence of massive addressable revenue. In reality, biopharma collaboration contracts are heavily back-weighted, with guaranteed upfront cash typically representing less than 3 to 5 percent of total potential deal value ($82.5 million upfront across Lilly and Novartis). Over 95 percent of nominal deal value is contingent on multi-stage preclinical, clinical trial, regulatory, and commercial sales achievements that carry historical attrition rates exceeding 90 percent."
    claimRefs:
      - "CM004"
      - "CM010"
      - "CM011"
  - calloutType: "risk"
    title: "Downstream Clinical Bottlenecks Defy Algorithmic Acceleration"
    body: "While advanced AI models such as AlphaFold 3 and IsoDDE substantially compress the in silico phase of lead discovery from five years to two years, they do not alleviate clinical trial timelines or regulatory evaluation constraints. Clinical trials remain governed by human biological response rates, patient recruitment kinetics, and multi-year safety monitoring. With annual FDA novel drug approvals remaining flat at approximately 50 drugs per year, market expansion will ultimately be gated by clinical success rates rather than computational screening capacity."
    claimRefs:
      - "CM004"
      - "CM013"
      - "CM015"
      - "CM016"
