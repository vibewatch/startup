chapter:
  number: 1
  title: "Company Overview"
  summary: "Isomorphic Labs is a London-headquartered, AI-first drug design company founded in 2021 and led by founder-CEO Sir Demis Hassabis and President Max Jaderberg. Its May 2026 Series B supplied $2.1 billion for platform, pipeline, and hiring expansion, but public sources still leave valuation, revenue, customer count, governance rights, and human clinical validation unresolved."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: >-
      Isomorphic Labs describes itself as an AI-first drug design and development
      company founded in 2021. Its May 2026 funding release places headquarters in
      London and offices in Cambridge, Massachusetts, and Lausanne, Switzerland.
      The company presents a unified drug design engine spanning therapeutic areas
      and drug modalities, while its homepage frames the mission as building on and
      beyond AlphaFold. Those statements establish the intended technical scope,
      not clinical effectiveness. Third-party descriptions point to a hybrid
      business model: B2B pharmaceutical collaboration economics alongside
      partnered and wholly owned therapeutic programs. Public evidence does not
      support treating the three named pharmaceutical collaborations as a customer
      count, and it does not disclose recurring revenue, ARR, profitability, or a
      current valuation. The snapshot therefore distinguishes sourced operating
      facts from unavailable cover metrics rather than filling them with estimates.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO009"
      - "CO011"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "leadership-capital-and-control"
    title: "Leadership, capital, and control"
    body: >-
      The current public leadership record is narrow but clear: the company's May
      2026 release identifies Sir Demis Hassabis as founder and CEO and Max
      Jaderberg as president. The available sources do not provide a complete
      statutory board, executive succession plan, or allocation of control rights,
      so founder dependence remains a diligence issue rather than a quantified
      governance conclusion. Capital formation is better documented. The company
      announced a $2.1 billion Series B led by Thrive Capital, with Alphabet and GV
      participating alongside MGX, Temasek, CapitalG, and the UK Sovereign AI Fund.
      Independent sources broadly corroborate the round and syndicate. They do not,
      however, agree perfectly on cumulative funding: three sources report about
      $2.7 billion, while Galen Growth reports approximately $2.6 billion. The
      difference should be reconciled against the cap table instead of being
      dismissed as immaterial rounding.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO012"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "scale-milestones-and-proof"
    title: "Scale, milestones, and the proof gap"
    body: >-
      Public milestones show rapid capitalization and organizational expansion:
      Multiples records a seed round in April 2022, a $600 million Series A in March
      2025, and the $2.1 billion Series B in May 2026. The same evidence set records
      partnerships with Novartis, Lilly, and Johnson & Johnson, while a third-party
      company profile reports 422 employees in Q1 2026. That headcount is an
      aggregator estimate, not a company-confirmed current count, and the company's
      careers page supplies only a qualitative hiring signal. Most importantly,
      capital and partnership announcements are not evidence of clinical success.
      A September 2026 independent review found no publicly disclosed clinical
      candidates, and Galen Growth explicitly notes that the financing buys time
      and infrastructure rather than proof. The next decision-grade milestones are
      named candidates, trial registration, first-patient dosing, and human safety
      or efficacy results; none is established by the assigned evidence.
    claimRefs:
      - "CO006"
      - "CO009"
      - "CO010"
      - "CO012"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
