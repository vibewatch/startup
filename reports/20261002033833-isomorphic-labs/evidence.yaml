evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current post-money valuation, audited revenue, ARR, profitability, customer count, and company-confirmed
      headcount.
    whyItMatters: >-
      These metrics are needed to distinguish financing capacity from commercial traction and to anchor valuation
      analysis.
    diligencePath: >-
      Request the post-Series-B cap table, audited accounts, revenue recognition schedule, customer contract list, and
      current HR roster.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: A company-confirmed cumulative funding total using one consistent definition of external and parent capital.
    whyItMatters: >-
      Assigned sources report approximately $2.6B and $2.7B, so the total should not be presented as exact without
      reconciliation.
    diligencePath: Reconcile round proceeds and any parent funding against the fully diluted cap table and cash receipt records.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete statutory board, executive succession coverage, and role allocation below the founder and president.
    whyItMatters: The public leadership sample is insufficient to quantify governance independence or continuity risk.
    diligencePath: Obtain Companies House filings, board minutes, organizational charts, and executive succession documentation.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: ownership
    missingEvidence: >-
      Full diluted shareholder list, ownership percentages, liquidation preferences, board rights, and related-party
      terms.
    whyItMatters: >-
      Round participation alone does not establish economic control, investor protections, or Alphabet-related
      dependencies.
    diligencePath: Review the Series B share purchase agreement, articles, investor rights agreement, and post-money cap table.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: clinical-validation
    missingEvidence: >-
      Publicly named internal candidates, trial registrations, first-patient dosing, and human safety or efficacy
      results.
    whyItMatters: >-
      Without clinical evidence, financing and platform benchmarks do not demonstrate that the approach improves drug
      outcomes.
    diligencePath: >-
      Monitor company announcements and recognized trial registries, then request IND or CTA evidence and clinical data
      from management.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: partnership-financial-terms
    missingEvidence: >-
      Upfront cash consideration, research funding commitments, and milestone schedules for the 2026 Johnson & Johnson
      collaboration.
    whyItMatters: >-
      Without disclosed financial terms for the J&J partnership, the near-term revenue run-rate and total unearned
      milestone backlog cannot be precisely calculated.
    diligencePath: >-
      Review subsequent Johnson & Johnson SEC Form 10-K or 10-Q collaborative arrangement disclosures and Isomorphic
      Labs corporate announcements.
    relatedQuestionRefs:
      - QM008
  - type: enumeration-incomplete
    severity: material
    topic: competitive-landscape
    missingEvidence: >-
      A normalized census of direct AI-native drug designers, internal pharma platforms, conventional CRO substitutes,
      and their active program counts.
    whyItMatters: The retained pool supports a representative landscape but not an exhaustive market-share or win-rate assessment.
    diligencePath: >-
      Build a buyer-validated longlist from pharma procurement records, partnership disclosures, trial registries, and
      direct competitor materials.
    relatedQuestionRefs:
      - QP001
      - QP007
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-and-access
    missingEvidence: >-
      Executed Isomorphic contracts showing upfront fees, research funding, milestone definitions, IP ownership,
      termination rights, and realized total cost.
    whyItMatters: Headline partnership values cannot establish buyer economics, switching cost, or comparable pricing.
    diligencePath: >-
      Request redacted contracts, customer references, and a normalized cost model for one representative discovery
      program.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmark-comparability
    missingEvidence: >-
      Independent, peer-reviewed head-to-head testing on common molecular-design tasks with disclosed datasets,
      denominators, and uncertainty.
    whyItMatters: Vendor and comparison-publisher scores cannot establish a durable performance lead across non-equivalent products.
