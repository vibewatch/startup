      - number: '6.4'
        title: Customer Concentration, Procurement Friction, and Durability Risks
        blocks:
          - type: paragraph
            body: >-
              Isomorphic Labs faces severe customer concentration risks, with 100% of its commercial external revenue
              pipeline tied to three pharmaceutical enterprises: Eli Lilly, Novartis, and Johnson & Johnson. Traditional
              SaaS durability metrics such as net revenue retention (NRR), gross revenue retention (GRR), customer
              acquisition cost (CAC), and annual recurring revenue (ARR) do not apply to this commercial structure. Cash
              realization is heavily back-weighted into preclinical nomination, investigational new drug (IND)
              approvals, clinical phase progression, and commercialization milestones that require 10 to 15 years to
              materialize. Independent platform comparisons highlight substantial procurement friction: engaging
              Isomorphic Labs demands multi-million-dollar upfront commitments, custom intellectual property
              negotiations, and joint governance, rendering the platform inaccessible to mid-tier biotech firms and
              academic laboratories. Furthermore, because Isomorphic Labs is advancing an internal, wholly owned
              therapeutic pipeline in oncology and immunology with capital from its $2.1 billion Series B round,
              potential channel conflict may arise if internal discovery programs intersect with target classes
              prioritized by commercial pharmaceutical partners.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU011
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Customer Concentration and Deferred Cash Realization
            body: >-
              Isomorphic Labs' commercial viability is subject to extreme revenue concentration: exactly three
              pharmaceutical companies account for 100% of external customer commitments. Furthermore, over 95% of total
              contracted deal value ($3.0B+ biobucks) is tied to long-dated clinical milestones that require 10 to 15
              years to materialize, creating extended cash-flow deferral and vulnerability to partner portfolio
              reprioritization.
            calloutType: risk
            claimRefs:
