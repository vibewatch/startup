      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Divergence Between Bio-Dollar Deal Caps and Realized Commercial Revenue
            body: >-
              Institutional investors must distinguish between headline bio-dollar partnership values and liquid
              operational cash flows. While Isomorphic Labs boasts over $3 billion in combined nominal deal caps across
              Eli Lilly, Novartis, and Johnson & Johnson, realized upfront payments amount to $82.5 million plus
              undisclosed terms from J&J. The remaining billions represent contingent, multi-year milestones that depend
              entirely on preclinical hit discovery, candidate nomination, IND filings, and multi-phase clinical trial
              clearance over 5 to 10 years. In biopharma partnerships, industry-wide historical conversion of early
              discovery milestones into commercial royalties typically runs below 10%, meaning headline deal sizes serve
              as options on future clinical success rather than predictable software-style cash flows.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI006
          - type: callout
            title: Capital Intensity of Transitioning to Clinical-Stage Biopharma Operations
            body: >-
              The deployment of $2.1 billion in Series B capital marks Isomorphic's strategic transition from an
              asset-light computational research laboratory into a vertically integrated, clinical-stage
              biopharmaceutical sponsor. As the company advances wholly owned therapeutic candidates in oncology and
              immunology toward human clinical trials in Cambridge and London, operating cash burn will escalate
              dramatically. Clinical trial design, toxicology, Phase I/II protocol management, and regulatory compliance
              demand specialized wet-lab teams and substantial trial site funding. If early clinical trials experience
              safety delays or efficacy failures, Isomorphic will face the severe capital depreciation typical of
              early-stage biotechnology platforms despite its software pedigree.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: IsoDDE Platform Architecture and Computational Capabilities
        blocks:
          - type: paragraph
            body: >-
              Isomorphic Labs operates the Isomorphic Labs Drug Design Engine (IsoDDE), a unified computational
              drug-design system built to bridge the gap between static biomolecular structure prediction and practical
              in silico therapeutic design. While AlphaFold 3 transformed structural biology by predicting complex
              structures across proteins, small molecules, peptides, and nucleic acids, understanding biomolecular
              structures alone was insufficient to unlock end-to-end drug discovery programs. IsoDDE expands upon
              AlphaFold 3 by introducing multi-property predictive models that operate across chemical and biological
              space without requiring initial experimental crystal structures. The platform incorporates automated blind
              pocket identification, out-of-distribution protein-ligand structure prediction, high-precision binding
              affinity estimation, and early toxicity screening, enabling computational chemists to evaluate target
              tractability and optimize lead candidates rapidly on computers before wet-lab synthesis.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
