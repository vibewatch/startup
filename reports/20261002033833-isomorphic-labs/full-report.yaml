      - number: '5.2'
        title: Empirical Performance and Differentiation Across Modalities
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiation of IsoDDE rests on its generalization performance across unexplored
              chemical spaces and difficult biomolecular targets. On the Škrinjar et al. 2025 'Runs N' Poses' benchmark,
              IsoDDE more than doubles the accuracy of AlphaFold 3 on the hardest protein-ligand generalization category
              ((0-20]), demonstrating robust capacity to model induced fits and cryptic pocket openings far from its
              training distribution. In complex biologics, IsoDDE outperforms AlphaFold 3 by 2.3x and Boltz-2 by 19.8x
              in the high-fidelity regime (DockQ > 0.8) on a low-homology antibody-antigen test set (n=334), with marked
              accuracy improvements on the hypervariable CDR-H3 loop. Furthermore, IsoDDE surpasses all deep-learning
              methods and matches or exceeds physics-based free energy perturbation (FEP) methods on FEP+ 4, OpenFE, and
              CASP16 blind affinity benchmarks, computing relative binding affinities in seconds rather than days
              without experimental crystal grounding.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE001
