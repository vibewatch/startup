      - number: '6.3'
        title: Named Customer Deployments and Clinical Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              Public validation of Isomorphic Labs' IsoDDE platform is anchored exclusively in three named multinational
              pharmaceutical deployments. Eli Lilly engaged Isomorphic Labs for small-molecule therapeutics across
              multiple undisclosed disease targets, committing $45 million upfront and up to $1.7 billion in milestone
              payments. Novartis executed a parallel small-molecule agreement for $37.5 million upfront and up to $1.2
              billion in milestones, followed by a February 2025 contract expansion. Johnson & Johnson entered a
              multi-target, cross-modality collaboration in January 2026 covering both small molecules and
              macromolecular biologics. However, a material diligence gap persists across all three relationships: none
              of the pharmaceutical sponsors has publicly disclosed specific biological target identities, disease
              indications, hit rates, screening cycle times, or formal candidate nomination milestones. Independent
              software evaluation platforms like RFP.wiki confirm that Isomorphic Labs provides no self-service lab
              orchestration product or public benchmark data for ADMET and DMTA workflows, maintaining a closed,
              service-led delivery paradigm that conceals operational performance metrics from external auditors.
            claimRefs:
              - CU002
              - CU003
