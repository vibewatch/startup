              - CE008
      - number: '5.3'
        title: Operating Model, Commercial Deployments, and Clinical Translation Risks
        blocks:
          - type: paragraph
            body: >-
              Isomorphic Labs implements a dual operating model combining external commercial collaborations with
              internal pipeline incubation. The platform is deployed under multi-target research partnerships with Eli
              Lilly, Novartis, and Johnson & Johnson, which leverage IsoDDE's data models to navigate novel biological
              targets and optimize proprietary chemical series. Concurrently, Isomorphic is developing wholly owned
              therapeutic programs focused on zero-to-one targets in oncology, immunology, and inflammation. Supported
              by a $2.1 billion Series B financing in May 2026 led by Thrive Capital alongside Alphabet, GV, Temasek,
              and the UK Sovereign AI Fund, the company is transitioning from computational model validation to
              large-scale deployment. However, clinical translation remains unproven: timeline targets for initial
              clinical trial entry have slipped toward late 2026, and no partner has publicly disclosed quantitative hit
              rates or clinical candidate selection milestones derived from IsoDDE.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE007
              - CE008
              - CE010
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Beyond AlphaFold 3: Overcoming the Static Structure Bottleneck'
            body: >-
              While AlphaFold 3 established a historic milestone in predicting macromolecular structures, commercial
              drug discovery requires predicting functional properties: binding affinity, pocket accessibility,
              induced-fit dynamics, and toxicity. IsoDDE represents an intentional expansion into multi-property in
              silico optimization, surpassing physics-based methods on blind affinity benchmarks and identifying cryptic
              pockets without experimental crystal structures.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
          - type: callout
            title: Clinical Validation Lag Behind Massive Capital Influx
            body: >-
              Despite raising $2.1 billion in Series B capital in May 2026 at an undisclosed private valuation,
              Isomorphic Labs has yet to advance a computationally designed candidate into human clinical trials. Public
              disclosures indicate that initial clinical entry timelines have slipped to late 2026, and partner programs
              have not disclosed candidate selection events, leaving the engine's real-world clinical translation
              efficiency unvalidated.
            calloutType: risk
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Commercial Architecture
        blocks:
          - type: paragraph
            body: >-
              Isomorphic Labs deliberately eschews self-service software-as-a-service (SaaS) and seat-based licensing
              models, structuring its entire commercial model around bilateral institutional research partnerships with
              top-tier global pharmaceutical companies. The primary economic buyers and sponsors are pharmaceutical
              executive leadership, corporate business development teams, and therapy area heads who contract for
              multi-target drug design programs across specific indications. Scientific users inside these customer
              organizations—computational chemists, structural biologists, and medicinal chemists—interact with
              Isomorphic Labs through joint research committees and structured data handoffs rather than through a
              public software interface or API. Commercial arrangements consist of upfront payments, research funding,
              downstream preclinical and clinical development milestones, and tiered commercial sales royalties upon
              regulatory approval. Beyond commercial biopharma sponsors, the company's customer ecosystem includes
              sovereign research co-investors, such as the UK Sovereign AI Fund, which provide non-dilutive alignment
              and compute-linked backing, and internal therapeutic teams developing wholly owned assets in oncology and
              immunology.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
