      - number: '8.2'
        title: Scenario Analysis and Industry Benchmarking
        blocks:
          - type: paragraph
            body: >-
              Evaluating Isomorphic Labs requires balancing unprecedented structural computational capabilities against
              the long, capital-intensive timelines of clinical drug development. Across private and public
              biotechnology comparables, valuation multiples display stark bifurcations. Established computational
              platforms such as Schrödinger and clinical AI developers like Recursion trade at modest enterprise value
              multiples relative to historical peaks, reflecting market skepticism toward computational discovery
              platforms that lack clinical-stage validation. In contrast, mega-round private peers such as Xaira
              Therapeutics ($1B committed launch) and Astromech ($3.8B private mark) command massive scarcity premiums
              driven by foundational AI excitement. In our scenario framework, the bull case assumes IsoDDE accelerates
              hit-to-lead and lead optimization cycles by 50%, enabling multiple candidate selections across the Eli
              Lilly and Novartis alliances that trigger near-term development milestones from their combined $3 billion
              potential milestone pool. The base case projects steady execution where the first wholly owned candidate
              enters Phase I trials by late 2026, validating initial clinical safety but deferring significant
              commercial monetization until Phase II proof-of-concept data emerge in 2028 or beyond. The bear case
              models biological attrition or off-target toxicity in lead programs, failure to confirm clinical
              translation of AlphaFold 3 predictions, and partner program churn, which would force deep valuation
              compression on subsequent funding rounds or secondary liquidity.
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
