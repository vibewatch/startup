    rows:
      - - IsoDDE Structure Prediction
        - De novo multi-chain protein-ligand and complex structure modeling
        - Doubles AlphaFold 3 accuracy on 'Runs N Poses' benchmark hardest bracket
        - Generalizes to novel pockets and models induced fit without homologous templates
        - Independent replication across diverse industrial target classes not yet published
      - - Biologics & Antibody Engine
        - De novo antibody design and antibody-antigen interface prediction
        - Outperforms AlphaFold 3 by 2.3x and Boltz-2 by 19.8x on DockQ > 0.8 test set
        - High-accuracy conformation prediction on hypervariable CDR-H3 loops
        - Wet-lab binding confirmation and developability assays undisclosed
      - - Binding Affinity Estimator
        - Absolute and relative binding affinity ranking across chemical series
        - Surpasses deep learning and exceeds physics-based FEP on CASP16 and OpenFE
        - Evaluates affinities in seconds without requiring experimental crystal structures
        - Correlation with cellular potency across complex allosteric targets remains private
      - - Cryptic Pocket Detector
        - Blind identification of druggable and allosteric pockets from sequence
        - Recapitulated novel cryptic, allosteric cereblon pocket (Dippon et al. 2026)
        - Identifies ligandable sites without known chemical probes or experimental soaking
        - False-positive rate across unannotated target classes not quantified
    notes: >-
      Data reflects technical benchmarks published in Isomorphic Labs' February 2026 technical report across public
      validation suites including Škrinjar et al. (2025), CASP16, and Dippon et al. (2026).
