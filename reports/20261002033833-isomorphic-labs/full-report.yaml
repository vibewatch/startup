          - type: callout
            title: 'Strategic Divergence: Service-Led Pharma Collaborations vs Wholly Owned Assets'
            body: >-
              Isomorphic Labs is navigating a dual commercial identity: monetizing its computational engine as a
              service-led discovery partner for Big Pharma while aggressively building an internal pipeline in oncology
              and immunology backed by $2.7 billion in capital. While this hybrid posture hedges partner dependence, it
              introduces clinical execution risks and operational friction if internal assets target identical
              biological pathways.
            calloutType: insight
            claimRefs:
              - CU001
