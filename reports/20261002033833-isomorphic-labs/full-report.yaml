  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Translational Bottlenecks and Clinical Execution Exposure
        blocks:
          - type: paragraph
            body: >-
              Evaluating Isomorphic Labs requires distinguishing in silico predictive benchmark accuracy from in vivo
              clinical safety and therapeutic efficacy. While foundational breakthroughs such as AlphaFold 3
              demonstrated significant improvements in predicting biomolecular complexes, empirical validation through
              human clinical trials remains the defining barrier. CEO Demis Hassabis acknowledged at the World Economic
              Forum in January 2026 that the company's first human clinical trials had slipped to the end of 2026,
              marking an operational schedule adjustment from earlier projections. Furthermore, external academic
              benchmarks such as CASP16 revealed that foundation models do not automatically outperform specialized
              physics-based methods across all blind pharmaceutical targets without extensive manual tuning.
              Transitioning proprietary candidates from computational discovery engines into IND-cleared oncology and
              immunology clinical trials demands sustained capital, specialized translational staffing, and lengthy
              patient monitoring where historical industry failure rates exceed ninety percent.
            claimRefs:
              - CR001
