      - number: '6.2'
        title: Adoption Trajectory and Contract Expansion Dynamics
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption for Isomorphic Labs is measured in multi-year target allocations, partner expansions,
              and headcount scaling rather than seat counts or recurring monthly active users. In January 2024, the
              company announced its initial commercial partnerships with Eli Lilly and Novartis, securing $45 million
              and $37.5 million in upfront payments respectively, with potential milestone commitments of up to $1.7
              billion from Lilly and $1.2 billion from Novartis for small-molecule discovery programs. In February 2025,
              Novartis formally expanded the scope of its collaboration, signaling technical satisfaction with initial
              program execution. In January 2026, Isomorphic Labs signed a third major enterprise partnership with
              Johnson & Johnson, extending its customer footprint into large molecules and biologics design across
              multiple disease targets. To support these expanding sponsor commitments alongside its internal pipeline,
              the company increased its specialized headcount from 94 employees in Q2 2023 to 422 employees by Q1 2026,
              expanding operations across London, Cambridge (Massachusetts), and Lausanne.
            claimRefs:
              - CU003
