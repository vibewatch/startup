  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Isomorphic Labs represents Alphabet's premier commercial vehicle for translating Nobel Prize-winning
              protein structure prediction into therapeutically viable drug candidates. Founded in 2021 as a Google
              DeepMind spin-out by CEO Demis Hassabis, the company operates its unified drug design engine (IsoDDE),
              combining predictive structural biology with generative chemistry. In May 2026, Isomorphic secured $2.1
              billion in Series B financing led by Thrive Capital, with continued participation from Alphabet and GV,
              alongside sovereign and growth investors including MGX, Temasek, CapitalG, and the UK Sovereign AI Fund.
              This round followed a $600 million Series A closed in March 2025 and an initial $2 million seed round in
              April 2022, bringing cumulative external capital raised to $2.7 billion. Although external secondary
              platforms and historical commentary have cited post-money valuation marks ranging from an outdated $1
              billion entry mark to unconfirmed $16 billion estimates, the Series B terms did not officially disclose a
              post-money valuation. The core investment thesis rests on IsoDDE achieving zero-to-one breakthroughs in
              small molecule and macromolecular design, allowing the firm to capture high-margin software milestones
              alongside downstream equity-like royalty streams from partnered and wholly owned programs. Conversely, the
              anti-thesis centers on the reality that computational affinity does not eliminate in vivo biological
              failure: clinical timelines have slipped by twelve months, internal candidates remain pre-clinical, and no
              commercial partner has yet confirmed a successful candidate selection or milestone payment.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
