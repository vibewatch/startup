      - number: '1.2'
        title: Leadership, capital, and control
        blocks:
          - type: paragraph
            body: >-
              The current public leadership record is narrow but clear: the company's May 2026 release identifies Sir
              Demis Hassabis as founder and CEO and Max Jaderberg as president. The available sources do not provide a
              complete statutory board, executive succession plan, or allocation of control rights, so founder
              dependence remains a diligence issue rather than a quantified governance conclusion. Capital formation is
              better documented. The company announced a $2.1 billion Series B led by Thrive Capital, with Alphabet and
              GV participating alongside MGX, Temasek, CapitalG, and the UK Sovereign AI Fund. Independent sources
              broadly corroborate the round and syndicate. They do not, however, agree perfectly on cumulative funding:
              three sources report about $2.7 billion, while Galen Growth reports approximately $2.6 billion. The
              difference should be reconciled against the cap table instead of being dismissed as immaterial rounding.
