      - number: '7.2'
        title: Regulatory Oversight, Model Governance, and Intellectual Property Boundaries
        blocks:
          - type: paragraph
            body: >-
              The regulatory classification and governance of frontier artificial intelligence within biopharma
              introduces profound legal uncertainty. Model deployment mechanisms within vertical biotechs operate under
              divergent operational frameworks compared to public frontier release cadences, with internal model weights
              isolated behind private enterprise infrastructure. As drug discovery lead Chris Butler articulated,
              Isomorphic Labs maintains proprietary models strictly in-house, ensuring that internal drug design
              pipelines proceed independently of external frontier model release-cadence agreements or pacing
              declarations. However, this deployment posture exposes the company to emerging regulatory
              audit-and-certification standards, potential export control boundaries, and stringent GLP/GCP evidentiary
              thresholds from the FDA and EMA for machine-generated molecular structures. Additionally, while the
              company leverages foundational insights originating from DeepMind research, its commercial platform IsoDDE
              relies on trade secrets and complex intercompany intellectual property arrangements with Alphabet.
            claimRefs:
              - CR005
