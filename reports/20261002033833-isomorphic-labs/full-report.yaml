        title: Exhibits
        blocks:
          - type: callout
            title: Clinical Translation as the Definitive Value Chokepoint
            body: >-
              Despite world-leading computational performance and AlphaFold 3 capabilities, Isomorphic Labs cannot
              circumvent biological complexity. The delay of first-in-human clinical trials to late 2026 highlights the
              friction of translating computational design into clinical oncology and immunology therapeutics.
            calloutType: risk
            claimRefs:
