  - id: FU001
    title: Enterprise Biopharma Customer Engagement and Milestone Journey
    type: journey-map
    summary: >-
      Visualizes the six sequential lifecycle phases of a pharmaceutical sponsor engagement with Isomorphic Labs,
      highlighting operational friction points and milestone realization.
    data:
      items:
        - label: 1. Target Selection & Scope Alignment
          touchpoints:
            - Executive biopharma BD engagement and scientific mutual diligence
            - Selection of historically challenging disease targets across therapy areas
            - Preliminary druggability evaluation and structural data readiness review
        - label: 2. Commercial Contracting & Governance
          touchpoints:
            - Negotiation of multi-target scope, exclusivity, and IP ownership boundaries
            - Execution of $35M-$45M upfront cash commitment and governance framework
            - Establishment of joint scientific steering committee and milestone schedules
        - label: 3. Computational Discovery (IsoDDE)
          touchpoints:
            - Deployment of IsoDDE for de novo molecular generation and pocket identification
            - Multi-parameter optimization (binding affinity, selectivity, ADMET scoring)
            - In silico delivery of prioritized candidate series to partner research committees
        - label: 4. Wet-Lab Synthesis & Assay Triage
          touchpoints:
            - Partner-led synthesis and high-throughput in vitro binding assays
            - Closed-loop design-make-test-analyze (DMTA) feedback iteration
            - High operational dependency on external CRO and partner laboratory queues
        - label: 5. Preclinical Nomination & IND Gate
          touchpoints:
            - In vivo pharmacokinetics, safety toxicology, and formulation validation
            - Preclinical candidate nomination triggering initial downstream milestone payments
            - Preparation of IND filing; first transition from in silico design to clinical asset
        - label: 6. Clinical Execution & Commercial Royalty
          touchpoints:
            - Phase I first-in-human clinical trials funded and operated by pharma partner
            - Phase II/III efficacy milestones representing bulk of $1.2B-$1.7B biobucks
            - Commercial product launch yielding tiered mid-single to low-double digit royalties
    approximationNotes: >-
      Phase touchpoints and commercial handoffs derived from published partnership structures and RFP.wiki workflow
      analyses.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU008
      - CU010
      - CU012
