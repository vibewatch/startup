chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Isomorphic Labs describes itself as an AI-first drug design and development company founded in 2021. Its
              May 2026 funding release places headquarters in London and offices in Cambridge, Massachusetts, and
              Lausanne, Switzerland. The company presents a unified drug design engine spanning therapeutic areas and
              drug modalities, while its homepage frames the mission as building on and beyond AlphaFold. Those
              statements establish the intended technical scope, not clinical effectiveness. Third-party descriptions
              point to a hybrid business model: B2B pharmaceutical collaboration economics alongside partnered and
              wholly owned therapeutic programs. Public evidence does not support treating the three named
              pharmaceutical collaborations as a customer count, and it does not disclose recurring revenue, ARR,
              profitability, or a current valuation. The snapshot therefore distinguishes sourced operating facts from
              unavailable cover metrics rather than filling them with estimates.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO011
