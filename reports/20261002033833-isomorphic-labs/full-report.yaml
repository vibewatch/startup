      - number: '3.2'
        title: Buyer tradeoffs and commercial access
        blocks:
          - type: paragraph
            body: >-
              The buying decision is primarily about engagement model. The retained comparison evidence describes
              Isomorphic as accessible through negotiated pharmaceutical partnerships rather than seats, a public price
              list, or self-service signup. That model can embed scientific support and align economics to programs, but
              it also makes total cost, implementation burden, IP boundaries, and switching cost hard to compare.
              Adjacent scientific assistants may be easier to access, yet they address broader research workflows rather
              than the same end-to-end molecular-design job. RFP.wiki further notes that public ELN/LIMS integration
              details, data-lineage controls, support terms, and reproducible program benchmarks are limited. Buyers
              therefore need reference calls, contract-level IP review, and a historical-campaign replay against their
              own baseline before treating platform fit as established.
            claimRefs:
              - CP008
