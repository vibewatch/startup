      - number: '1.3'
        title: Scale, milestones, and the proof gap
        blocks:
          - type: paragraph
            body: >-
              Public milestones show rapid capitalization and organizational expansion: Multiples records a seed round
              in April 2022, a $600 million Series A in March 2025, and the $2.1 billion Series B in May 2026. The same
              evidence set records partnerships with Novartis, Lilly, and Johnson & Johnson, while a third-party company
