  - id: TV002
    title: Investment thesis and anti-thesis evaluation
    columns:
      - Perspective
      - Core Thesis Argument
      - Underlying Evidence Base
      - Falsification / Pivot Trigger
    rows:
      - - Core Bull Thesis
        - IsoDDE and AlphaFold 3 radically compress drug discovery cycles and unlock historically undruggable targets
        - >-
          Nobel Prize-winning foundation models; $3B multi-target pharma collaborations signed with Eli Lilly and
          Novartis
        - Failure of partnered programs to reach candidate nomination within contracted multi-year windows
      - - Balance Sheet Strength
        - Massive $2.1B Series B capitalization insulates the firm from macro biotech financing volatility
        - Financing led by Thrive Capital with participation from Alphabet, GV, Temasek, and MGX
        - Excessive burn rate acceleration exceeding $500M annually without commensurate clinical progression
      - - Clinical Anti-Thesis
        - >-
          In silico affinity optimization does not eliminate biological attrition, off-target toxicity, or clinical
          trial failure
        - >-
          Company leadership acknowledged clinical trial entry delayed by a full year to late 2026; pipeline programs
          undisclosed
        - Publication of successful Phase I safety and pharmacokinetics data with clear therapeutic windows
      - - Commercial Anti-Thesis
        - Unconfirmed $16B private valuation embeds high-probability downstream royalties before Phase I initiation
        - No partner has publicly confirmed milestone payouts or disclosed target indications
        - Direct disclosure of verified upfront milestone receipts and partner candidate advancing to clinic
    notes: >-
      Comparative thesis matrix contrasting computational drug design platform advantages against empirical clinical
      development risks.
