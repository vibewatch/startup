company:
  name: "Isomorphic Labs"
chapter:
  number: 6
  title: "Customers"
  summary: "Isomorphic Labs operates an institutional B2B partnership model with three major global pharmaceutical sponsors—Eli Lilly, Novartis, and Johnson & Johnson—spanning potential biobucks deal values exceeding $3.0 billion. The commercial structure depends on modest upfront commitments ($45 million from Lilly, $37.5 million from Novartis) and long-dated preclinical and clinical milestones, leaving commercial durability exposed to extreme customer concentration, zero commercial SaaS adoption, and unverified clinical milestone conversions."
sections:
  - id: "customer-segmentation-and-commercial-model"
    title: "Customer Segmentation and Commercial Architecture"
    body: "Isomorphic Labs deliberately eschews self-service software-as-a-service (SaaS) and seat-based licensing models, structuring its entire commercial model around bilateral institutional research partnerships with top-tier global pharmaceutical companies. The primary economic buyers and sponsors are pharmaceutical executive leadership, corporate business development teams, and therapy area heads who contract for multi-target drug design programs across specific indications. Scientific users inside these customer organizations—computational chemists, structural biologists, and medicinal chemists—interact with Isomorphic Labs through joint research committees and structured data handoffs rather than through a public software interface or API. Commercial arrangements consist of upfront payments, research funding, downstream preclinical and clinical development milestones, and tiered commercial sales royalties upon regulatory approval. Beyond commercial biopharma sponsors, the company's customer ecosystem includes sovereign research co-investors, such as the UK Sovereign AI Fund, which provide non-dilutive alignment and compute-linked backing, and internal therapeutic teams developing wholly owned assets in oncology and immunology."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
  - id: "customer-adoption-and-commercial-trajectory"
    title: "Adoption Trajectory and Contract Expansion Dynamics"
    body: "Commercial adoption for Isomorphic Labs is measured in multi-year target allocations, partner expansions, and headcount scaling rather than seat counts or recurring monthly active users. In January 2024, the company announced its initial commercial partnerships with Eli Lilly and Novartis, securing $45 million and $37.5 million in upfront payments respectively, with potential milestone commitments of up to $1.7 billion from Lilly and $1.2 billion from Novartis for small-molecule discovery programs. In February 2025, Novartis formally expanded the scope of its collaboration, signaling technical satisfaction with initial program execution. In January 2026, Isomorphic Labs signed a third major enterprise partnership with Johnson & Johnson, extending its customer footprint into large molecules and biologics design across multiple disease targets. To support these expanding sponsor commitments alongside its internal pipeline, the company increased its specialized headcount from 94 employees in Q2 2023 to 422 employees by Q1 2026, expanding operations across London, Cambridge (Massachusetts), and Lausanne."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU007"
      - "CU011"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-partner-proof"
    title: "Named Customer Deployments and Clinical Evidence Gaps"
    body: "Public validation of Isomorphic Labs' IsoDDE platform is anchored exclusively in three named multinational pharmaceutical deployments. Eli Lilly engaged Isomorphic Labs for small-molecule therapeutics across multiple undisclosed disease targets, committing $45 million upfront and up to $1.7 billion in milestone payments. Novartis executed a parallel small-molecule agreement for $37.5 million upfront and up to $1.2 billion in milestones, followed by a February 2025 contract expansion. Johnson & Johnson entered a multi-target, cross-modality collaboration in January 2026 covering both small molecules and macromolecular biologics. However, a material diligence gap persists across all three relationships: none of the pharmaceutical sponsors has publicly disclosed specific biological target identities, disease indications, hit rates, screening cycle times, or formal candidate nomination milestones. Independent software evaluation platforms like RFP.wiki confirm that Isomorphic Labs provides no self-service lab orchestration product or public benchmark data for ADMET and DMTA workflows, maintaining a closed, service-led delivery paradigm that conceals operational performance metrics from external auditors."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "durability-expansion-and-concentration-risks"
    title: "Customer Concentration, Procurement Friction, and Durability Risks"
    body: "Isomorphic Labs faces severe customer concentration risks, with 100% of its commercial external revenue pipeline tied to three pharmaceutical enterprises: Eli Lilly, Novartis, and Johnson & Johnson. Traditional SaaS durability metrics such as net revenue retention (NRR), gross revenue retention (GRR), customer acquisition cost (CAC), and annual recurring revenue (ARR) do not apply to this commercial structure. Cash realization is heavily back-weighted into preclinical nomination, investigational new drug (IND) approvals, clinical phase progression, and commercialization milestones that require 10 to 15 years to materialize. Independent platform comparisons highlight substantial procurement friction: engaging Isomorphic Labs demands multi-million-dollar upfront commitments, custom intellectual property negotiations, and joint governance, rendering the platform inaccessible to mid-tier biotech firms and academic laboratories. Furthermore, because Isomorphic Labs is advancing an internal, wholly owned therapeutic pipeline in oncology and immunology with capital from its $2.1 billion Series B round, potential channel conflict may arise if internal discovery programs intersect with target classes prioritized by commercial pharmaceutical partners."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU011"
      - "CU012"
