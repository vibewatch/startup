callouts:
  - calloutType: "risk"
    title: "Structural Customer Concentration and Deferred Cash Realization"
    body: "Isomorphic Labs' commercial viability is subject to extreme revenue concentration: exactly three pharmaceutical companies account for 100% of external customer commitments. Furthermore, over 95% of total contracted deal value ($3.0B+ biobucks) is tied to long-dated clinical milestones that require 10 to 15 years to materialize, creating extended cash-flow deferral and vulnerability to partner portfolio reprioritization."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU012"
  - calloutType: "insight"
    title: "Strategic Divergence: Service-Led Pharma Collaborations vs Wholly Owned Assets"
    body: "Isomorphic Labs is navigating a dual commercial identity: monetizing its computational engine as a service-led discovery partner for Big Pharma while aggressively building an internal pipeline in oncology and immunology backed by $2.7 billion in capital. While this hybrid posture hedges partner dependence, it introduces clinical execution risks and operational friction if internal assets target identical biological pathways."
    claimRefs:
      - "CU001"
      - "CU006"
      - "CU007"
      - "CU011"
