  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类界定与覆盖开支
        blocks:
          - type: paragraph
            body: >-
              AI 药物发现的商业边界，明确将干实验计算设计与分子模拟同下游湿实验临床开发、人体试验及商业化规模生产割裂开来。传统生物制药研发中，单条管线从立项到最终获批历来需要 10 至 15 年，耗资在 $1
              billion 到 $2 billion 之间，临床试验失败率超过 90%。Isomorphic Labs 依托自研的 Isomorphic Labs Drug Design
              Engine（IsoDDE），重点卡位上游靶点发现、蛋白质-配体结构建模及先导化合物优化。该边界内可触达的预算包括药企伙伴的技术准入费、计算化学与结构生物学研发预算，以及交付临床前先导分子挂钩的里程碑款项。Isomorphic
              Labs 当期市场明确排除后期 Phase II/III 试验推进、大规模患者招募、合同研究组织（CRO）毒理试验与药物商业化生产。存量替代品则包括成熟的物理分子建模平台（如
              Schrödinger）、Recursion Pharmaceuticals 主导的高通量自动化生物筛选机器人体系，以及大型药企内部自建的计算化学团队。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场测算视角、增长预期与可触达保底空间
        blocks:
          - type: paragraph
            body: >-
              测算 Isomorphic Labs 的市场空间需要分层拆解，而非依赖宽泛的单一行业预测。按总可用市场（TAM）口径，全球制药行业年研发开支超过 $200 billion 至 $250
              billion，代表生物医药创新投入的理论上限。在此天花板下，分析师报告评估 2023 年全球 AI 制药细分市场规模为 $1.5 billion，预计按 29.7% 的复合年增长率（CAGR）扩张，到 2030
              年达到约 $9.1 billion。然而，计算药物设计合作、软件授权与 AI 研发联盟的可服务市场（SAM）当前被限制在 $3.0 billion 到 $4.5 billion
              之间，毕竟药企巨头仅将整体研发预算的一小部分拨给外部计算平台。若 AI 平台公司涉足多靶点企业合作，其可获取市场（SOM）在现实中受限于每年累计 $300 million 到 $700 million
              的前期研发费与近期临床前里程碑款。从整个行业看，全球已有超过 173 个由 AI 发现的药物管线进入临床开发，预计 2026 年将有 15 到 20 个管线进入关键 Phase III
              试验，反映出该品类正从早期算法探索向实证临床验证过渡。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
