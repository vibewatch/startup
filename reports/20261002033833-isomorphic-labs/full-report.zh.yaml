  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 临床转化瓶颈与执行推进风险
        blocks:
          - type: paragraph
            body: >-
              评估 Isomorphic Labs 必须严格区分干实验计算基准精度与体内临床安全性及实际药效。AlphaFold 3
              等底层突破极大提升了生物分子复合物的预测精度，但通过人体临床试验拿到实证数据依然是根本屏障。CEO Demis Hassabis 于 2026 年 1
              月在达沃斯世界经济论坛上坦承，公司首批人体临床试验排期已顺延至 2026 年底，较此前预期做出了调整。此外，CASP16
              等外部学术评测表明，若不经过繁重的人工精细调优，基础模型在所有未知药物靶点上并不能天然压制专门的物理方法。将自研候选分子从计算筛选引擎推向获批 IND
              的肿瘤与免疫临床试验，需要源源不断的资金投入、专门的转化医学人才以及长周期的患者随访观察，而医药行业在这一阶段的历史淘汰率在九成以上。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
