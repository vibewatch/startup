            body: >-
              Isomorphic Labs 自述为 2021 年成立的 AI 原生药物设计与开发公司。2026 年 5
              月发布的融资通告显示，公司总部设在伦敦，并在马萨诸塞州剑桥与瑞士洛桑设有办公室。公司主推一套跨越治疗领域与药物形态的统一药物设计引擎，官网主页则将使命界定为在 AlphaFold
              基础上更进一步。这些口径仅确立了预期技术范围，而非临床有效性。第三方评估指向混合商业模式：一边获取 B2B
              药企合作收益，一边推进合作研发与自研治疗管线。公开证据不支持将三家具名药企合作视作客户数，也未披露经常性收入、ARR、盈利情况或当前估值。因此，本次尽调着重厘清有据可查的运营事实，对暂缺的核心指标不做主观填补。
