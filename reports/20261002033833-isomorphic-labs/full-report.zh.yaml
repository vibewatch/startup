  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与估值背景
        blocks:
          - type: paragraph
            body: >-
              Isomorphic Labs 是 Alphabet 旗下将诺贝尔奖级蛋白质结构预测技术转化为具备治疗价值候选新药的旗舰商业化平台。公司于 2021 年由 CEO Demis Hassabis 推动自
              Google DeepMind 孵化成立，运营其统一药物设计引擎（IsoDDE），将预测性结构生物学与生成化学深度融合。2026 年 5 月，Isomorphic 完成由 Thrive Capital 领投的
              $2.1 billion B 轮融资，Alphabet 与 GV 持续注资，MGX、Temasek、CapitalG 以及 UK Sovereign AI Fund 等主权及成长期投资机构参与。此前公司于
              2022 年 4 月完成 $2 million 种子轮，并于 2025 年 3 月敲定 $600 million A 轮，累计吸收外部资本达 $2.7
              billion。尽管外部老股交易平台及此前市场评论曾给出从早期的 $1 billion 到未经证实的 $16 billion 不等的投后估值估算，但 B
              轮融资条款并未正式公开披露投后估值。其核心投资逻辑在于：IsoDDE 能否在小分子与大分子设计上实现从 0 到 1
              的突破，使公司兼获高毛利的软件里程碑收益，并从药企合作及自研项目中捕获类股权性质的下游销售分成。反向逻辑则指出，计算结合亲和力无法消除体内生物学失败的本质风险：临床试验排期已顺延 12
              个月，内部管线均停留在临床前阶段，且尚无任何商业合作伙伴公开确认过候选药物确立或达成里程碑款项拨付。
            claimRefs:
