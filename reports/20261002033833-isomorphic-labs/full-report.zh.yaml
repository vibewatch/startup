        title: 核心展品
        blocks:
          - type: callout
            title: 资本规模与科学定位构成当前最明朗的竞争壁垒
            body: >-
              据报道的融资体量与传承自 AlphaFold 的算法引擎，赋予 Isomorphic
              极强的资源调配能力，足以重金投入算力集群、跨学科团队搭建、药企合作项目以及自研在研管线；但融资总额绝不能直接等同于营业收入或账面可用现金。
            calloutType: strength
            claimRefs:
