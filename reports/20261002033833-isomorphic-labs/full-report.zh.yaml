      - number: '2.3'
        title: 企业买家画像、预算归属与采购决策路径
        blocks:
          - type: paragraph
            body: >-
              AI 药物设计平台的大型买方群体高度集中在顶尖跨国制药企业与大型生物科技公司。经济买家通常为集团主管研发的执行副总裁或全球药物发现负责人，其掌控的企业年度研发预算通常在 $5 billion 到 $6
              billion 之间。平台的实际操作者涵盖企业内部计算化学家、结构生物学家以及转化肿瘤学或免疫学研究团队。实际出资方则是负责业务拓展与战略许可的 BD
              部门，以首付现金、承诺研发资金与或有里程碑款项的组合注资。采购落地遵循严格的技术评估流程：初步接洽后，针对历来极具挑战或隐蔽的靶点实施计算概念验证，随后签订为期数年、涵盖多个靶点的合作协议。Isomorphic
              Labs 已验证该采购路径：2024 年与 Eli Lilly 和 Novartis 拿下标杆合作，首付现金合计超 $82 million，潜在里程碑款项超 $3.0 billion；2026 年又宣布与
              Johnson & Johnson 建立拓展跨模态设计合作。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
