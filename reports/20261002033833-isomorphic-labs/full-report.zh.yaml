      - number: '8.2'
        title: 情景分析与行业对标
        blocks:
          - type: paragraph
            body: >-
              评估 Isomorphic Labs，核心在于权衡其前所未有的结构计算能力，与临床药物研发漫长且重资本的时间周期。纵观一二级市场生物科技可比标的，估值倍数分化极其剧烈。Schrödinger 等成熟计算平台与
              Recursion 等临床 AI 研发商，当前企业价值倍数相比历史高点均处于低位，反映出市场对缺乏临床阶段验证的计算发现平台抱有疑虑。相比之下，完成巨额融资的一级市场同类公司，如 Xaira
              Therapeutics（承诺启动资金 $1B）和 Astromech（私募估值 $3.8B），受基础 AI 热潮推升，享有极高稀缺性溢价。在情景分析框架中：乐观情景假设 IsoDDE
              将苗头化合物至先导化合物及先导化合物优化周期缩短 50%，推动 Eli Lilly 和 Novartis 合作管线中多个候选分子入选，从而在合计 $3B
              的潜在里程碑资金池中触发近期开发里程碑；基准情景预计推进平稳，首个完全自研候选分子于 2026 年底进入 I 期临床，验证初步临床安全性，但重大商业化变现需推迟至 2028 年或更晚公布 II
              期概念验证数据；悲观情景则推演先导管线遭遇生物学损耗或脱靶毒性、AlphaFold 3 预测未能在临床转化中得到证实、合作项目发生流失，进而迫使后续融资或老股流动性交易承受深度估值压缩。
