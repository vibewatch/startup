      - number: '5.2'
        title: 实证性能与跨模态差异化表现
        blocks:
          - type: paragraph
            body: >-
              IsoDDE 最核心的技术壁垒，在于其针对未知化学空间及高难度生物靶点的泛化预测表现。在 Škrinjar 等人 2025 年公布的“Runs N'
              Poses”基准评测中，针对难度最高的蛋白质-配体泛化区间（(0-20]），IsoDDE 的精度达到 AlphaFold 3
              的两倍以上，展现出即使大幅偏离训练分布，依然能稳健模拟诱导契合与隐蔽口袋开放的实力。在复杂大分子生物药领域，面对低同源性抗体-抗原测试集（n=334），IsoDDE 在高保真区间（DockQ >
              0.8）的准确率分别超出 AlphaFold 3 达 2.3 倍、超出 Boltz-2 达 19.8 倍，其中高变区 CDR-H3 环的建模精度改善尤为显著。此外，在 FEP+ 4、OpenFE 及 CASP16
              盲测亲和力基准上，IsoDDE 击败所有深度学习方法，并追平或超越基于物理学的自由能微扰（FEP）方案，无需实验晶体结构辅助即可在数秒而非数天内算出相对结合亲和力。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
