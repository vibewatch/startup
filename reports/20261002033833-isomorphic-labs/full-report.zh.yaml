              尽管 Isomorphic Labs 拥有顶尖计算技术积淀和高达 $2.1B 的资产负债表缓冲，机构投资人仍应避免把未获确认的 $16B 老股估值计入投资判断。在尚未展现临床安全性、药代动力学耐受性，且未实现
              Eli Lilly 或 Novartis 里程碑转化前，公司依然承受着传统药物研发的损耗风险。保持观察（TRACK）立场，既兼顾了该平台的变革潜力，又恪守了审慎的入场纪律。
