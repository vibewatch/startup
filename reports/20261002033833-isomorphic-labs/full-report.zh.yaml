      - number: '3.3'
        title: 差异化优势与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              Isomorphic 最核心的差异化在于公司宣称的统一药物设计引擎广度及其 AlphaFold 正统血统。公司自称能够攻克历来极难成药的复杂靶点，但其管理层也审慎提示，单凭 AlphaFold
              远远不够，前路仍需数项同等量级的重大科学突破。这种拉锯在分析上颇具价值：算法模型能力与充裕资本虽然能借助私有实验、合作方反馈以及稀缺的跨学科团队加速沉淀，但两者皆不能直接佐证临床转化成效。某第三方采购评估给予其基于结构的计算及生成式设计极高评分，同时明确警示其缺乏公开的
              ADMET 基准数据与系统集成证明。由于该评分出自商业测评机构的主观判断而非独立严谨的基准评测，只可用于确定尽调切入重点，不可视为技术实力的绝对排名。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP016
      - number: '3.4'
        title: 反向考量与投资判断
        blocks:
          - type: paragraph
            body: >-
              反向研判的核心在于：              Isomorphic 的商业化验证仍局限在药企签约层，其估值与叙事空间已大幅透支临床验证进度。Signal & Flow
              指出该公司本质上是一处商业付费研发平台，临床效果与产品真实收入均在等待验证。Forbes 报道称，核心在研管线与进度排期至今未公开披露；On Healthcare 亦强调，截至刊发未见任何 Isomorphic
              候选药物交出人体 Phase II
              临床数据。这些迹象并不等同于项目失败，却划定了下一阶段的竞争分水岭：包括明确命名的候选分子、试验实质启动、合作里程碑款项兑现，以及面对传统成熟流程展现出经得起外部检验的性能提升。在各项突破落地之前，客观结论是：公司在资本运作与科研声誉上居于前列，而在工业化可复现性、实际经济效益以及患者端疗效验证上，证据仍悬而未决。
            claimRefs:
              - CP012
              - CP013
              - CP014
