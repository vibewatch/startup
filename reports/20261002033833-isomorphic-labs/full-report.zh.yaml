      - CE010
  - id: FU001
    title: 大型药企客户合作与里程碑全流程图
    type: journey-map
    summary: 可视化展示药企赞助方与 Isomorphic Labs 合作的六个连续生命周期阶段，突出运营卡点与里程碑兑现路径。
    data:
      items:
        - label: 1. 靶点选择与合作范围对齐
          touchpoints:
            - 药企高管 BD 对接与双方科学尽调
            - 跨治疗领域挑选历史上公认具有挑战性的疾病靶点
            - 初步成药性评估与结构数据完备度审查
        - label: 2. 商业签约与治理机制
          touchpoints:
            - 就多靶点范围、排他性及 IP 归属界限展开谈判
            - 落实 $35M-$45M 首付款现金承诺与治理框架协议
            - 组建联合科学指导委员会并制定里程碑时间表
        - label: 3. 计算药物发现（IsoDDE）
          touchpoints:
            - 部署 IsoDDE 开展全新分子生成与结合口袋识别
            - 多参数优化（结合亲和力、选择性、ADMET 评分）
            - 向合作伙伴研发委员会交付经过优先级排序的计算机设计候选分子系列
        - label: 4. 湿实验合成与活性筛选
          touchpoints:
            - 由合作伙伴主导化合物合成与高通量体外结合实验
            - “设计-合成-测试-分析”（DMTA）闭环反馈迭代
            - 高度依赖外部 CRO 及合作伙伴实验室排期队列
        - label: 5. 临床前候选物提名与 IND 申报关口
          touchpoints:
            - 体内药代动力学、安全毒理学与制剂验证
            - 临床前候选药物提名触发首批下游里程碑付款
            - 筹备 IND 申报；实现从计算设计到临床资产的首次跨越
        - label: 6. 临床推进与商业化销售分成
          touchpoints:
            - 由药企合作伙伴出资并主导人体 I 期临床试验
            - II/III 期疗效里程碑占 $1.2B-$1.7B 总标的的大部分
            - 商业化产品上市带来中个位数至低双位数百分比的分梯队销售分成
    approximationNotes: 各阶段触点与商业交接流程根据已公开合作架构及 RFP.wiki 工作流分析整理得出。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU008
      - CU010
      - CU012
  - id: FR001
    title: 风险严重程度与发生概率矩阵
    type: matrix
    summary: 横跨发生概率与组织影响维度，综合评估关键运营、监管及依赖风险。
    data:
      columns:
        - 微弱影响
        - 低影响
        - 中度影响
        - 严重影响
        - 重大影响
        - 颠覆性影响
      rows:
        - label: 高频发生
          values:
            - 计算节点轻微限流
            - 候选分子例行二次筛选
            - 新员工入职磨合进度拖延
            - 小试阶段实验波动
            - I 期临床试验进度延期
            - 临床管线研发损耗
        - label: 较易发生
          values:
            - 文档积压
            - 合作伙伴实验方案不完全匹配
            - 计算结合亲和力存在偏差
            - 监管申报审评期限延长
            - 单一靶点里程碑推迟
            - 治疗靶点验证失败
        - label: 存在可能
          values:
            - 非核心供应商更换
            - 初级工程人员流失
            - 模型在全新折叠结构上的泛化差距
            - 药企合作伙伴调低管线优先级
            - 试验方案遭遇临床暂停
            - 多项目研发管线终止
        - label: 小概率发生
          values:
            - 内部网络偶发故障
            - 专利申报文书勘误
            - 学术基准测试争议
            - 两用 AI 合规审计严查
            - 领投机构银团重组
            - 系统性生物安全责任事件
        - label: 极少发生
          values:
            - 本地备份服务器宕机
            - 办公室搬迁租约轻微延误
            - 供应商试剂运输延误
            - 跨境数据传输争议
            - 核心云基础设施中断
            - 知识产权全面无效
        - label: 极低概率
          values:
            - 外部网站 DNS 超时
            - 辅助软件工具弃用
            - 会议日程冲突
            - 行业会议不利评价
            - 生物医药市场全面资本冻结
            - 公司解散触发事件
    approximationNotes: 矩阵分类基于公司已披露的时间线调整及生物医药运营要素定性梳理得出。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR010
  - id: FV001
    title: 尽调评估链路：从平台能力到投资立场
    type: flow
    summary: 贯通科学根基、资本支持、临床阻力与估值现实，导向 TRACK 建议的逻辑演进链路。
    data:
      nodes:
        - id: n1
          label: AlphaFold 3 与 IsoDDE 平台
          description: 获诺贝尔奖的结构生物学引擎，支持预测性与生成式分子设计
          tone: positive
        - id: n2
          label: 资本禀赋（已融资 $2.7B）
          description: Thrive Capital 领投 $2.1B B 轮融资；获 Alphabet、GV、Temasek 及 MGX 支持
          tone: positive
        - id: n3
          label: 药企验证（潜在合作金额 $3B）
          description: 与 Eli Lilly 及 Novartis 签署的多靶点合作研发协议
          tone: positive
        - id: n4
          label: 临床试验推进延期
          description: 首个临床试验时间线推迟 12 个月至 2026 年底；自研管线项目尚未公开披露
          tone: risk
        - id: n5
          label: 估值定价高企
          description: 据报道，其 $16B 一级市场估值未经临床验证，便提前透支多年期里程碑兑现
          tone: risk
        - id: n6
          label: 建议：TRACK
          description: 维持跟踪监测立场，静待推进至 I 期临床阶段以及首个经核实的合作里程碑兑现
          tone: neutral
      edges:
        - from: n1
          to: n2
          label: 吸引大规模成长期资本
        - from: n2
          to: n3
          label: 支撑多年期合作规模化
        - from: n3
          to: n4
          label: 推动平台从实验室走向临床
        - from: n4
          to: n5
          label: 与激进估值定价产生错配
        - from: n5
          to: n6
          label: 决定保持审慎跟踪立场
    approximationNotes: 流程图展示分析权重分配，而非实证财务预测。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV007
      - CV008
      - CV014
