        blocks:
          - type: paragraph
            body: >-
              Isomorphic Labs 依托双轨商业模式实现计算药物设计能力变现：一边推进与药企联合的早期研发项目，一边稳步孵化完全自研的内部管线。在生物医药合作赛道上，公司携手以 Eli Lilly、Novartis
              及 Johnson & Johnson
              为代表的跨国制药巨头，针对伙伴指定的靶点发现并优化候选药物。这类商务合同在经济条款上结合了非稀释性的技术准入首付款、跨年度研发资助、临床前与临床开发里程碑款项、监管获批与商业销售里程碑款，以及新药获批上市后按净销售额提取的阶梯特许权分成。公开披露显示，Isomorphic
              于 2024 年 1 月从 Eli Lilly 处获得 $45 million 首付款，潜在里程碑款项最高达 $1.7 billion；同期与 Novartis 达成的合作斩获 $37.5 million
              首付款，该协议已于 2025 年 2 月进一步扩充。2026 年 1 月，公司又与 Johnson & Johnson
              签订多靶点跨模态合作协议，将产品版图延伸至大分子与生物药设计。整体来看，这三项旗舰合作的名义生物资产交易上限（bio-dollar deal caps）合计超过 $3
              billion。然而，标称里程碑上限代表的是跨越数年的远期或有支付，绝非当期可确认的经营收入；且由药企主导的研发合作通常会将绝大部分下游商业回报留给药企伙伴，公司当期实际确认的年收入极其有限。
