              - CP005
          - type: callout
            title: 临床转化成效才是决定胜负的关键试金石
            body: >-
              留存的公开材料均未能证实任何人体 Phase II
              临床数据、标准化的跨平台基准评测，或公开的单客经济学指标；其竞争护城河能否立住，仍取决于明确命名的在研分子、持续兑现的里程碑款项，以及经买方实测检验的研发效能提升。
