  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: IsoDDE 平台架构与计算能力
        blocks:
          - type: paragraph
            body: >-
              Isomorphic Labs 搭建了统一计算药物设计系统 Isomorphic Labs Drug Design
              Engine（IsoDDE），旨在弥合静态生物大分子结构预测与实际计算机新药设计之间的鸿沟。AlphaFold 3
              虽然成功预测蛋白质、小分子、多肽与核酸复合结构，重塑了结构生物学，但仅仅看清生物分子静态结构，并不足以走通端到端新药研发。IsoDDE 在 AlphaFold 3
              基础上大幅延伸，引入横跨化学与生物空间的多属性预测模型，脱离了对实验晶体结构的先验依赖。该平台集成了自动化盲袋识别、分布外蛋白质-配体结构预测、高精度结合亲和力预估及早期毒性筛查，支持计算化学家在湿实验合成之前，直接在电脑端高效评估靶点成药性并完成先导化合物优化。
            claimRefs:
              - CE001
