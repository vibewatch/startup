              Isomorphic Labs 存在显著的战略级交易对手依赖，外部合作高度集中在以 Eli Lilly、Novartis 与 Johnson & Johnson
              为代表的少数几家跨国药企身上。虽然多靶点合作的标称交易金额合计逼近三十亿美元，但实际商业收入完全受制于尚未兑现的临床前与临床里程碑，且各项里程碑的具体支付节点均未公开披露。与此同时，公司大力推进肿瘤与免疫领域完全自研的管线，在湿实验验证、转化药理学人才引进及临床试验中心运营上面临庞大且持续的资本开支。尽管公司在
              2026 年 5 月完成由 Thrive Capital 领投的 2.1 billion 美元巨额 B 轮融资，将总资本金推升至 2.7 billion
              美元，但生物医药固有的漫长研发周期决定了，一旦里程碑款项变现受阻，公司将面临严重的估值回调压力。
