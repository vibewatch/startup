      - number: '6.4'
        title: 客户集中度、采购摩擦与业务持续性风险
        blocks:
          - type: paragraph
            body: >-
              Isomorphic Labs 面临极高的客户集中度风险，其外部商业收入管线 100% 依赖于三家药企巨头：Eli Lilly、Novartis 以及 Johnson &
              Johnson。净留存率（NRR）、总留存率（GRR）、获客成本（CAC）与年经常性收入（ARR）等传统 SaaS
              可持续性指标，均不适用于这种商业架构。现金变现极度后置于临床前立项、新药临床研究审批（IND）、临床试验各期推进以及商业化销售等节点，通常需要耗时 10 到 15
              年才见分晓。第三方平台横向评估揭示了显著的采购摩擦：引入 Isomorphic Labs
              服务必须支付数百万美元的前期费用，经历漫长的定制化知识产权谈判与联合治理机制搭建，这使得中小型生物科技公司与学术研究机构根本无力承担。此外，由于 Isomorphic 动用 $2.1 billion B
              轮融资资金在肿瘤和免疫领域大力推进完全自研的管线，一旦内部研发项目与商业伙伴重点攻坚的靶点类别出现重合，势必面临潜在的利益渠道冲突。
