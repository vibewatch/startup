      - number: '8.3'
        title: 尽调重点与投资逻辑破损触发条件
        blocks:
          - type: paragraph
            body: >-
              技术声誉与临床验证差距悬殊，投资人必须恪守入场纪律，切忌将未经证实的估值水平直接计入投资判断。尽调应聚焦三大核心验证主线：其一，直接核实 Lilly 与 Novartis
              合作协议中的商业条款与里程碑触发条件；其二，在 2026 年底前确认自研肿瘤及免疫资产启动 I 期临床并取得监管申报文件；其三，获取 IsoDDE
              在湿实验环境下相较传统高通量筛选展现更高结合亲和力与更低脱靶毒性的实证依据。若出现以下明确触发项，须下调至回避（AVOID）立场：临床启动进一步延期至 2027
              年；核心计算生物学架构师离职；合作项目未取得里程碑进展即告终止；或有公开证据显示 AlphaFold 3 结构预测无法转化为具备药理可行性的吸收、分布、代谢与排泄（ADME）特性。
