            body: >-
              Isomorphic Labs 旗下 IsoDDE 平台的公开落地成效，完全维系在三家明确具名的跨国制药巨头身上。Eli Lilly 委托 Isomorphic Labs
              针对多个未公开的疾病靶点开发小分子药物，开出 $45 million 首付款及高达 $1.7 billion 的潜在里程碑款项。Novartis 签署了同等规模的小分子研发协议，支付 $37.5 million
              首付款及最高 $1.2 billion 里程碑款，并于 2025 年 2 月进一步扩充合同。Johnson & Johnson 则于 2026 年 1
              月达成多靶点、跨模态合作，同时覆盖小分子与大分子生物药。然而，三项合作背后存在实质性的尽调断层：没有任何一家药企公开披露具体的生物靶点名称、适应症、命中率、筛选周期耗时或正式立项的候选药物里程碑。RFP.wiki
              等独立软件测评机构证实，Isomorphic Labs 既不提供自助式实验室编排工具，也没有公布关于 ADMET 和 DMTA
              工作流的公开基准数据，始终保持封闭、以咨询服务为主导的交付模式，使得外部审计人员无法窥探其实际运行效率。
