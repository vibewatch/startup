            body: >-
              2026 年 5 月 12 日，Isomorphic Labs 完成由 Thrive Capital 领投、Alphabet、GV、Temasek、MGX、CapitalG 与 UK Sovereign AI
              Fund 跟投的 $2.1 billion B 轮融资，资本充裕度处于罕见高位。加上 2025 年 3 月首轮 $600 million 外部融资，公司累计已吸纳 $2.7 billion
              外部风险与主权基金资本。这笔庞大流动性储备构筑了跨越数年的现金跑道，足以承受推进自主肿瘤与免疫管线进入人体临床试验的重金支出。尽管如此，从投资核验视角审视，Isomorphic Labs
              存在显著的信息缺口。实际确认的收入运行率、年度会计亏损、毛利率以及净现金烧钱速度，在非公开备案与官方公告中均未公开披露。EquityZen
              等未上市股权交易平台的报价仅体现老股二级交易活跃度，无法提供经审计的机构资产负债表。此外，鉴于尚无任何在研管线获批 IND 或在人体试验中跑通 Phase II
