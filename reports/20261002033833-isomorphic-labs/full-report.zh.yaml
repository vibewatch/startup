      - number: '2.4'
        title: 行业催化剂、结构性瓶颈与推广阻力
        blocks:
          - type: paragraph
            body: >-
              计算药物设计的推广主要受传统制药面临的严峻经济压力驱动，即常被提及的“埃隆定律”（Eroom's Law）——技术虽有迭代，实证研发效率却大约每九年缩减一半。AlphaFold 3 与 IsoDDE
              等前沿机器学习模型能够加快苗头化合物发现，有望把早期探索周期从行业平均的五年压缩至两年，并以更低算力成本预测蛋白质-配体结合亲和力。然而，结构性阻碍仍在拖慢行业变革节奏。AI
              工具本质上具备概率属性，根本绕不开监管硬性要求的体外实验、体内动物实验以及人体临床试验，而这些环节占据了新药研发绝大部分成本与周期。此外，过去十年间 FDA 每年批准的新分子实体数量基本稳定在约 50
              种；前段算法靶点生成加速，并不能自动拓宽下游临床试验通量或监管机构的审评承载力。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 核心展品
        blocks:
          - type: callout
            title: AI 药物研发交易中的标称里程碑误区
            body: >-
              市场评论常将数十亿美元的合作公告（例如 Isomorphic Labs 与 Eli Lilly 及 Novartis 达成的逾 $3.0 billion
              潜在里程碑款项）作为巨额可变现收入的证据。实际上，生物医药合作协议高度向后期倾斜，确定的首付现金通常仅占潜在交易总额的不到 3 到 5%（Lilly 与 Novartis 的首付款合计为 $82.5
              million）。超过 95% 的名义交易总值取决于临床前、临床试验、监管获批及商业化销售等多个阶段的成就，而这些阶段的历史淘汰率超过 90%。
            calloutType: insight
            claimRefs:
              - CM004
              - CM010
              - CM011
          - type: callout
            title: 下游临床瓶颈无法仅靠算法加速突破
            body: >-
              尽管 AlphaFold 3 与 IsoDDE 等先进 AI
              模型显著将计算机先导化合物发现周期从五年压缩至两年，但无法缩短临床试验周期或绕开监管评审约束。临床试验依然受制于人体生物反应速度、患者招募进度以及跨越数年的安全性随访。由于 FDA 每年批准的新药数量基本稳定在约
              50 种，市场规模的最终扩张取决于临床成功率，而非算力筛选吞吐量。
            calloutType: risk
            claimRefs:
              - CM004
              - CM013
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争全景与对标阵营
        blocks:
          - type: paragraph
            body: >-
              真实的竞争格局远比一份 AI 生物科技初创企业名单复杂。Isomorphic Labs 直接与 AI
              原生药物研发企业争夺人才、药企合作项目、数据与资本；与跨国药企内部研发团队博弈管线究竟是自研还是外包合作；并与传统实验流程争夺预算和科研信任度。Claude Science 和 GPT-Rosalind
              等周边工具在科研效率上存在交叉，但并不属于同等维度的分子设计服务。独立第三方亦将 Chai Discovery、Manifold Bio、Insitro、Enveda 与 Recursion
              列为重要的同行对标，不过留存材料颗粒度不一，无法对技术实力精确排位。据报道，Isomorphic 在前序 $600 million 外部融资之上又斩获 $2.1 billion B
              轮注资，确实构筑了资金壁垒，但该数字仅代表募集到的资本，既非经营收入，亦不能证实账面资金仍持续充裕。
            claimRefs:
