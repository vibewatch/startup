      - number: '3.2'
        title: 买方权衡与商业准入门槛
        blocks:
          - type: paragraph
            body: >-
              买方的采购决策核心在于商业合作模式。现有对比材料表明，获取 Isomorphic
              服务的唯一路径是针对性谈判的药企定制合作，而非购买软件坐席、查看公开价目表或线上自主开通。这种模式能够深度绑定科研支持并将商业收益同在研项目挂钩，但同时导致整体支出、部署落地门槛、知识产权边界和切换成本极难横向评估。周边科研助手虽然易于接入，解决的却是更宽泛的通用科研流程，而非同等深度的端到端分子设计任务。RFP.wiki
              进一步指出，公开材料中关于 ELN/LIMS
              生产集成细节、数据血缘管控、售后支持条款以及可复现的项目基准数据十分有限。因此，买方在认定平台完全适配之前，必须完成客户访谈背调、合同级知识产权审查，并拿自身历史基准数据跑一遍复盘。
