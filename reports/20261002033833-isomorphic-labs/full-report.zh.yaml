    rows:
      - - IsoDDE 结构预测
        - 从头多链蛋白质-配体及复合物结构建模
        - 在 'Runs N Poses' 基准测试最难区间将 AlphaFold 3 准确率提高一倍
        - 可泛化至全新口袋，无需同源模板即可对诱导契合效应建模
        - 跨多种工业靶点类别的独立复现结果尚未发表
      - - 生物药与抗体引擎
        - 从头抗体设计与抗体-抗原结合界面预测
        - 在 DockQ > 0.8 测试集上分别超越 AlphaFold 3 2.3 倍与 Boltz-2 19.8 倍
        - 对高变 CDR-H3 环区实现高精度构象预测
        - 湿实验结合确认与成药性评估数据未公开披露
      - - 结合亲和力估算器
        - 对不同化学分子系列进行绝对与相对结合亲和力排序
        - 在 CASP16 与 OpenFE 上超越深度学习，并优于基于物理学的 FEP
        - 数秒内即可评估亲和力，无需依赖实验测定的晶体结构
        - 针对复杂变构靶点的细胞活性相关性数据仍未公开
      - - 隐性口袋检测器
        - 仅凭序列盲测识别成药口袋与变构口袋
        - 成功复现新型隐性变构 cereblon 口袋（Dippon et al. 2026）
        - 无需已知化学探针或实验浸泡，即可识别可结合配体的位点
        - 在未注释靶点类别中的假阳性率尚未量化
    notes: 数据反映 Isomorphic Labs 2026 年 2 月技术报告中公布的基准测试结果，涵盖 Škrinjar et al. (2025)、CASP16 及 Dippon et al. (2026) 等公开验证测试集。
