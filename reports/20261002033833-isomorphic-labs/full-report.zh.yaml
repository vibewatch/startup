      - number: '7.2'
        title: 监管合规、模型治理与知识产权边界
        blocks:
          - type: paragraph
            body: >-
              前沿人工智能在生物医药领域的监管分类与合规治理蕴含重大法律不确定性。垂直生物科技公司的模型部署机制与公开前沿模型的迭代节奏截然不同，私有模型权重严格物理隔离在企业私有云内部。正如药物研发负责人 Chris
              Butler 所述，Isomorphic Labs
              坚持核心自研模型绝对闭源，确保内部药物设计流程独立推进，不受外部前沿大模型发布节奏公约或进度倡议的牵制。然而，这一闭源部署策略也让公司直面不断涌现的监管审计与认证规范、潜在的出口管制限制，以及 FDA 和 EMA
              针对算法生成分子结构设定的苛刻 GLP/GCP 证据审查门槛。此外，尽管公司承袭了来自 DeepMind 的底层技术洞察，但其商业平台 IsoDDE 核心资产主要依靠商业秘密维系，并依托与母公司 Alphabet
              之间复杂的内部关联 IP 许可安排。
            claimRefs:
              - CR005
