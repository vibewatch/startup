              的潜在里程碑款项，Novartis 承诺的上限则为 $1.2 billion。2025 年 2 月，Novartis 正式扩大合作范围，释放出对初期项目执行在技术上高度认可的积极信号。2026 年 1
              月，Isomorphic Labs 与 Johnson & Johnson 签订第三项大型企业合作，将客户触角延伸至涵盖多个疾病靶点的大分子与生物药设计领域。为支撑持续扩容的药企承诺与自研管线，公司专业团队规模从
              Q2 2023 的 94 人快速扩张至 Q1 2026 的 422 人，业务据点遍及伦敦、马萨诸塞州剑桥与瑞士洛桑。
