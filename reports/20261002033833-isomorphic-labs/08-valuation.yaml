callouts:
  - calloutType: "recommendation"
    title: "Disciplined Underwriting Demands Clinical Proof Points"
    body: "While Isomorphic Labs possesses an unparalleled computational pedigree and an extraordinary $2.1 billion balance sheet buffer, institutional investors should avoid underwriting unconfirmed $16 billion secondary valuation marks. Without demonstrated clinical safety, pharmacokinetic tolerability, and milestone conversion from Eli Lilly or Novartis, the company remains exposed to classic drug discovery attrition. A TRACK stance balances respect for the platform's transformative potential against prudent entry discipline."
    claimRefs:
      - "CV001"
      - "CV006"
      - "CV007"
      - "CV014"
      - "CV016"
  - calloutType: "risk"
    title: "Clinical Timeline Slipped by One Year"
    body: "Public remarks by CEO Demis Hassabis at the World Economic Forum in January revealed that the target timeline for bringing internal drug candidates into clinical trials was extended to the end of 2026, representing a full one-year delay from previous projections. Furthermore, the company remains highly secretive regarding its lead candidates, indication targets, and mechanisms of action, limiting external independent validation."
    claimRefs:
      - "CV006"
      - "CV008"
      - "CV012"
