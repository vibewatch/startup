chapter:
  number: 5
  title: "Product & Technology"
  summary: "Isomorphic Labs operates the Isomorphic Labs Drug Design Engine (IsoDDE), a unified AI platform expanding beyond AlphaFold 3 to predict protein-ligand structures, small-molecule binding affinities, and cryptic allosteric pockets directly from sequence. Spun out from Google DeepMind and backed by $2.7 billion in lifetime financing, the company deploys IsoDDE across commercial pharma collaborations with Eli Lilly, Novartis, and Johnson & Johnson while advancing an internal pipeline toward planned 2026 clinical entry."
sections:
  - id: "platform-architecture-isodde"
    title: "IsoDDE Platform Architecture and Computational Capabilities"
    body: "Isomorphic Labs operates the Isomorphic Labs Drug Design Engine (IsoDDE), a unified computational drug-design system built to bridge the gap between static biomolecular structure prediction and practical in silico therapeutic design. While AlphaFold 3 transformed structural biology by predicting complex structures across proteins, small molecules, peptides, and nucleic acids, understanding biomolecular structures alone was insufficient to unlock end-to-end drug discovery programs. IsoDDE expands upon AlphaFold 3 by introducing multi-property predictive models that operate across chemical and biological space without requiring initial experimental crystal structures. The platform incorporates automated blind pocket identification, out-of-distribution protein-ligand structure prediction, high-precision binding affinity estimation, and early toxicity screening, enabling computational chemists to evaluate target tractability and optimize lead candidates rapidly on computers before wet-lab synthesis."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "predictive-benchmarks-differentiation"
    title: "Empirical Performance and Differentiation Across Modalities"
    body: "The core technical differentiation of IsoDDE rests on its generalization performance across unexplored chemical spaces and difficult biomolecular targets. On the Škrinjar et al. 2025 'Runs N' Poses' benchmark, IsoDDE more than doubles the accuracy of AlphaFold 3 on the hardest protein-ligand generalization category ((0-20]), demonstrating robust capacity to model induced fits and cryptic pocket openings far from its training distribution. In complex biologics, IsoDDE outperforms AlphaFold 3 by 2.3x and Boltz-2 by 19.8x in the high-fidelity regime (DockQ > 0.8) on a low-homology antibody-antigen test set (n=334), with marked accuracy improvements on the hypervariable CDR-H3 loop. Furthermore, IsoDDE surpasses all deep-learning methods and matches or exceeds physics-based free energy perturbation (FEP) methods on FEP+ 4, OpenFE, and CASP16 blind affinity benchmarks, computing relative binding affinities in seconds rather than days without experimental crystal grounding."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE001"
  - id: "operating-model-clinical-pipeline"
    title: "Operating Model, Commercial Deployments, and Clinical Translation Risks"
    body: "Isomorphic Labs implements a dual operating model combining external commercial collaborations with internal pipeline incubation. The platform is deployed under multi-target research partnerships with Eli Lilly, Novartis, and Johnson & Johnson, which leverage IsoDDE's data models to navigate novel biological targets and optimize proprietary chemical series. Concurrently, Isomorphic is developing wholly owned therapeutic programs focused on zero-to-one targets in oncology, immunology, and inflammation. Supported by a $2.1 billion Series B financing in May 2026 led by Thrive Capital alongside Alphabet, GV, Temasek, and the UK Sovereign AI Fund, the company is transitioning from computational model validation to large-scale deployment. However, clinical translation remains unproven: timeline targets for initial clinical trial entry have slipped toward late 2026, and no partner has publicly disclosed quantitative hit rates or clinical candidate selection milestones derived from IsoDDE."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE002"
