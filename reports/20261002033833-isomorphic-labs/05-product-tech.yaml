callouts:
  - calloutType: "insight"
    title: "Beyond AlphaFold 3: Overcoming the Static Structure Bottleneck"
    body: "While AlphaFold 3 established a historic milestone in predicting macromolecular structures, commercial drug discovery requires predicting functional properties: binding affinity, pocket accessibility, induced-fit dynamics, and toxicity. IsoDDE represents an intentional expansion into multi-property in silico optimization, surpassing physics-based methods on blind affinity benchmarks and identifying cryptic pockets without experimental crystal structures."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE007"
      - "CE008"
  - calloutType: "risk"
    title: "Clinical Validation Lag Behind Massive Capital Influx"
    body: "Despite raising $2.1 billion in Series B capital in May 2026 at an undisclosed private valuation, Isomorphic Labs has yet to advance a computationally designed candidate into human clinical trials. Public disclosures indicate that initial clinical entry timelines have slipped to late 2026, and partner programs have not disclosed candidate selection events, leaving the engine's real-world clinical translation efficiency unvalidated."
    claimRefs:
      - "CE009"
      - "CE011"
      - "CE012"
      - "CE013"
