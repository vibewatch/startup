company:
  name: Simile
chapter:
  number: 2
  title: Market Analysis
  summary: Simile sits at the intersection of market research, research software, synthetic data, and decision-support simulation rather than a single cleanly bounded category. The available evidence supports a large and growing research-and-simulation spend, but the reported market lenses are not additive and do not establish a defensible standalone SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      The relevant market is best bounded as enterprise research and decision support that
      helps an organization test products, messages, policies, workflows, or market-entry
      decisions before committing real-world budget. The included spend spans outsourced
      primary and secondary research, research software, synthetic-user or synthetic-data
      workflows, and simulation-enabled analytics. It excludes general-purpose content
      generation, broad data infrastructure, and unrelated digital-twin applications unless
      they directly inform a human or organizational decision. ESOMAR separates the broader
      insights industry from its market-research, research-software, and reporting components,
      while QuestionPro likewise distinguishes an all-in insights figure from narrower services
      and core research lenses. This boundary matters because Simile's stated use cases
      include concept testing, product research, market entry, and earnings-call preparation,
      which can substitute for parts of surveys, interviews, focus groups, consulting, or
      internal analysis without replacing every component of those workflows. The incumbent
      services pool is broad, with The Business Research Company listing major providers such
      as Nielsen, IQVIA, Gartner, Kantar, Ipsos, GfK, and Forrester among many others.
    claimRefs: [CM001, CM002, CM003, CM004, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and what they do not prove
    body: >-
      The evidence supports multiple sizing lenses, not one additive TAM. ESOMAR reports a
      global insights industry above $140 billion in 2023, comprising a $54 billion market
      research sector, a $56 billion research-software sector, and a $33 billion reporting
      sector. Its method also says the market-research sector grew 4.6% in 2023 while research
      software grew 12.4%, indicating that software-enabled spend is growing faster than the
      mature services base. A separate analyst page estimates synthetic-data generation at
      $0.78 billion in 2025 and $4.26 billion by 2032, while QuestionPro presents a $96.77
      billion 2026 market-research-services lens. These figures use different definitions,
      populations, and methods; they should be read as bounding lenses rather than summed.
      No retained source isolates Simile's obtainable share, enterprise contract value, or a
      company-specific SAM/SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption drivers, and constraints
    body: >-
      The buyer is the organization accountable for a consequential decision, while the user
      is typically a product, insights, strategy, policy, marketing, or research team and the
      payer is the business unit holding the research or decision-support budget. The adoption
      path is therefore likely to begin with a bounded concept, messaging, patient, customer,
      or policy question, then expand if simulated results reduce research cycle time or
      improve prioritization. Evidence from Simile's own hiring surfaces describes Fortune 100
      decision-makers who need population, uncertainty, and confidence outputs to be legible,
      while independent coverage describes traditional market research as the status quo and
      a market-research platform emphasizes validation against real respondents. The main drivers are speed, cost
      discipline, privacy, and the ability to test more variants before a live pilot. The
      constraints are model validity, representativeness, consent and governance, compute
      economics, and buyer reluctance to replace live evidence in high-stakes settings.
      Accordingly, near-term adoption is more plausibly augmentation of research than wholesale
      replacement, and valuation relevance depends on repeatable paid workflows rather than
      the headline size of all human decision-making.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
callouts:
  - calloutType: insight
    title: The market is broad but not additive
    body: The strongest sizing case is a set of adjacent spend pools—research services, research software, reporting, and synthetic-data or simulation tools—not a single validated TAM. Simile's market opportunity is credible as a workflow wedge, but its obtainable share remains unproven.
    claimRefs: [CM005, CM006, CM007, CM009]
  - calloutType: risk
    title: Validation is the adoption gate
    body: Synthetic or simulated respondents can reduce the cost of exploring decisions, but market-research vendor guidance still stresses that synthetic data must be validated against real respondent behavior. This limits substitution claims and may keep live research in the workflow.
    claimRefs: [CM012, CM013, CM014]
