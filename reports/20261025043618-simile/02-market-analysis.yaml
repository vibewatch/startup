    rows:
      - [Market-research services, "Primary and secondary research, fieldwork, surveys, interviews, focus groups", "General data infrastructure and unrelated consulting", "Insights, marketing, product, or strategy budget", "Direct status-quo and substitution pool"]
      - [Research software, "Research platforms, panel tooling, repositories, analytics workflows", "General-purpose productivity software", "Research operations or analytics budget", "Workflow and distribution adjacency"]
      - [Reporting and analytics, "Synthesis, reporting, decision dashboards, interpretation", "Generic BI unrelated to human decisions", "Strategy, finance, or operating function", "Potential downstream decision surface"]
      - [Synthetic-user simulation, "Simulated populations, concept tests, behavioral scenarios", "Unvalidated general-purpose generation", "Product, research, marketing, or policy owner", "Closest product category but still emerging"]
      - [Synthetic-data generation, "Artificial datasets for training, testing, privacy, and simulation", "Synthetic data with no human-decision application", "Data science, risk, or engineering budget", "Technical adjacency and enabling layer"]
      - [Live research and pilots, "Real respondents, customer trials, focus groups, and field validation", "Purely internal ideation", "Business unit or research budget", "Substitute in some cases and required validation in others"]
    notes: Market boundary is an analytical classification using ESOMAR, QuestionPro, and Simile-use-case descriptions; categories overlap operationally and are not additive.
    claimRefs: [CM001, CM002, CM003, CM004, CM012, CM015]
