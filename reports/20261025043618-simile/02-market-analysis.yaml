    columns: [Publisher, Year or period, Geography, Lens and value, Growth or method, Confidence, Limitation]
    rows:
      - [ESOMAR, "2023", Global, "Insights industry: >$140B", "Coverage represented 80% of global industry; remaining 20% estimated independently", High, "Broad bundle including research, software, and reporting"]
      - [ESOMAR, "2023", Global, "Market-research sector: $54B", "Sector composition reported within the broader insights industry", High, "Excludes research software and reporting components"]
      - [ESOMAR, "2023", Global, "Research-software sector: $56B", "12.4% relative growth in 2023", High, "Not the same population as market-research services"]
      - [ESOMAR, "2023", Global, "Reporting sector: $33B", "6.5% relative growth in 2023", High, "Separate reporting lens; not Simile-specific"]
      - [QuestionPro, "2026", Global, "Market-research services: $96.77B", "Vendor article describes purchased research-services revenue as a narrower analyst definition", Medium, "Vendor-authored synthesis; definition differs from ESOMAR sector boundary"]
      - [Maximize Market Research, "2025 base / 2032 forecast", Global, "Synthetic-data generation: $0.78B to $4.26B", "27.4% CAGR stated for 2026–2032", Medium, "Synthetic data is broader than behavioral simulation"]
      - [QuestionPro, "2024 data / 2025 publication", Global, "Insights industry: $153B", "Combines market research, software, and reporting/analytics", Medium, "Secondary editorial synthesis and different vintage"]
      - [QuestionPro, "2023 baseline", Global, "Core market-research sector: $54B", "Presented as traditional primary and secondary research services", Medium, "Definition is not a company-specific market share"]
    notes: Values are reported by their publishers and intentionally not summed; differing definitions, vintages, denominators, and methods prevent a single TAM calculation.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Buyer, workflow, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Adoption trigger]
    rows:
      - [Consumer brands, "Chief marketing, product, or insights leader", "Researchers and product teams", "Marketing or product budget", "Concept, message, and positioning tests", "More variants tested before campaign spend"]
      - [Healthcare and life sciences, "Research, patient experience, or innovation leader", "Patient and customer insight teams", "Research or business-unit budget", "Patient satisfaction and adherence hypotheses", "Lower-cost pre-screening before live studies"]
      - [Financial services, "Product, strategy, or risk leader", "Product managers and analysts", "Product or strategy budget", "Scenario and customer-response analysis", "Faster iteration under compliance constraints"]
      - [Professional services, "Partner or practice leader", "Consultants and analysts", "Client-delivery budget", "Client-specific research and scenario modeling", "Reusable evidence across engagements"]
      - [Public policy and polling, "Policy or research director", "Pollsters and policy analysts", "Institutional research budget", "Policy-change and public-response analysis", "Broader scenario coverage with explicit validation"]
      - [Enterprise communications, "CFO, investor-relations, or communications leader", "Executives and communications teams", "Corporate communications budget", "Earnings-call rehearsal and question preparation", "Reduce surprise around high-stakes interactions"]
    notes: Buyer roles and workflows are evidence-constrained abstractions from disclosed use cases and market-research buyer descriptions; budget ownership is not publicly disclosed for Simile.
    claimRefs: [CM003, CM010, CM011, CM012]
