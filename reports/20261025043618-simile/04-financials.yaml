artifact: financials
slug: simile
runDate: 2026-10-25
company:
  name: Simile
chapter:
  number: 4
  title: Financials
  summary: Simile has disclosed rapid capital formation and company-reported revenue growth, but public evidence does not disclose realized revenue, gross margin, burn, cash balance, or customer-level economics. The underwriting case therefore rests on validating whether a high-value research workflow can become repeatable enterprise revenue without disproportionate data-collection and simulation-compute costs.
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: >-
      Simile appears to monetize an enterprise decision-support platform rather than a
      self-serve software seat. Public descriptions identify customer work such as
      concept testing, market entry, product testing, earnings-call rehearsal, and
      retail placement analysis. The operating mechanism is a paid study or recurring
      enterprise relationship in which a customer defines a population and stimulus,
      then receives simulated responses. The available evidence supports demand and
      workflow fit, but not realized revenue recognition, contract duration, renewal,
      usage-based pricing, or contribution margin. A company job posting says Simile
      “grown revenue 5x” in five months, while a separate company-hosted listing says
      it has run “tens of millions of simulations for F100 enterprises”; these are
      company claims and should not be treated as audited revenue or independently
      verified usage. The most important commercial diligence is to reconcile bookings,
      recognized revenue, contracted backlog, usage volume, and gross profit by customer
      and use case.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: pricing-costs-and-unit-economics
    title: Pricing, delivery costs, and unit economics
    body: >-
      No retained source provides a public Simile price list, minimum contract value,
      realized discount, implementation fee, or customer-specific gross margin. The
      product descriptions imply a hybrid economic model: population construction and
      validation require data acquisition and research labor, while repeated simulations
      consume model inference and compute. A company job listing advertises $200,000–
      $300,000 salary ranges for specialist roles, which signals expensive talent
      requirements but is not a proxy for total operating cost or delivery cost. Public
      descriptions also say customers can run inputs including text, images, video,
      Figma mocks, and live websites, so cost-to-serve likely varies materially by
      modality, population size, validation depth, and simulation repetition. Until
      Simile supplies realized price and cost cohorts, unit economics remain an
      underwriting gap rather than a modeled precision estimate.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Simile has substantial disclosed financing relative to its early operating age:
      reported Series A and Series B announcements imply $300 million raised, with the
      later round reported at a $2 billion post-money valuation. That capital can fund
      model training, panel or behavioral-data acquisition, compute, and enterprise
      engineering, but no retained source discloses cash on hand, monthly burn, runway,
      debt, liquidation preferences, secondary proceeds, or the amount reserved for
      working capital. Hiring material describes a global team of 50+ and continuing
      recruitment, while another profile lists employees as 11–50; this discrepancy
      makes headcount and burn direction uncertain. The $2 billion valuation is therefore
      a financing reference, not a conclusion about fair value. Financially, Simile is
      investable only with a data-room bridge from bookings to recognized revenue and
      from cash balance to forward runway, plus evidence that validation and compute
      costs fall faster than enterprise pricing.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: diligence-implications
    title: Financial diligence priorities
    body: >-
      The central financial question is whether Simile is selling a repeatable software
      product or a high-touch research service wrapped around proprietary models. The
      public record supports a credible enterprise use case and a well-capitalized
      balance-sheet starting point, but it does not establish revenue quality, gross
      margin, retention, payback, or capital sufficiency. Underwriting should request
      monthly recurring or contracted revenue by customer, cohort retention, realized
      price per study and simulation, inference and panel costs, implementation hours,
      accounts receivable aging, debt and preferred terms, and a 24-month cash plan.
      Those requests are more decision-useful than extrapolating revenue from funding,
      valuation, employee counts, or marketing claims.
    claimRefs: [CI003, CI005, CI008, CI012, CI014]

tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [stream, mechanism, unit, current value/status, quality, diligence ask]
    rows:
      - [Enterprise simulation studies, "Population and stimulus are queried for product or market decisions", "Study / project", "Named use cases; realized revenue undisclosed", "Company and third-party reported; not audited", "Bookings, recognized revenue, contract term, renewal"]
      - [Concept and product testing, "Text, images, video, Figma mocks, or websites tested with synthetic populations", "Test / simulation run", "Capability described; price undisclosed", "Company-described workflow", "Price per test, usage caps, gross profit"]
      - [Earnings-call rehearsal, "Simulated questions and reactions before an earnings call", "Engagement / rehearsal", "One reported example predicted 8 of 10 questions", "Company claim reported by news", "Repeat rate, fees, analyst/customer validation"]
      - [Retail and healthcare decision support, "Simulated customer behavior for stocking, displays, or adherence decisions", "Population / deployment", "CVS use reported; commercial terms undisclosed", "Third-party reported", "Contract value, deployment scope, outcomes"]
      - [Data or model access, "Potential API/MCP or model-enabled enterprise access", "API call / license", "Direction described; pricing not public", "Company-related reporting", "License terms, usage economics, support burden"]
    notes: "Public sources describe mechanisms and use cases, but none of the retained evidence supplies audited revenue, contract values, or recognized revenue by stream."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [metric, value_or_null, confidence, why_it_matters, diligence_ask]
    rows:
      - [List price, null, low, "No public price card or standard package was retained", "Obtain current price book and discount authority"]
      - [Realized enterprise price, null, low, "Named customers do not disclose contract economics", "Review signed orders and invoice samples"]
      - [Simulation usage, "Tens of millions claimed", medium, "Indicates potential scale but not paid volume or gross profit", "Reconcile paid runs, free pilots, and compute cost"]
      - [Revenue growth, "5x in five months claimed", medium, "Signals acceleration but lacks starting base and recognition basis", "Reconcile monthly revenue ledger and cohort bridge"]
      - [Gross margin, null, low, "Panel, interview, validation, inference, and support costs are unknown", "Provide gross-margin waterfall by use case"]
      - [CAC / payback, null, low, "Enterprise sales and implementation effort are not disclosed", "Provide fully loaded acquisition cost and payback cohorts"]
    notes: "Null values are evidence gaps, not zeroes; company-reported growth and usage are not independently audited."
    claimRefs: [CI002, CI003, CI005, CI006, CI007]
  - id: TI003
    title: Capital adequacy and underwriting gaps
    columns: [input, public evidence, underwriting interpretation, diligence ask]
    rows:
      - [Capital raised, "$100M Series A and $200M Series B reported", "Substantial gross financing; not cash available today", "Bank statements, cap table, preferred terms, secondary proceeds"]
      - [Valuation, "$2B post-money reported for Series B", "Financing reference; does not establish fair value", "Round price, liquidation preferences, option-pool effects"]
      - [Cash balance, null, "Runway cannot be calculated", "Latest cash and restricted-cash schedule"]
      - [Burn, null, "Capital intensity is unresolved", "Monthly cash flow and spend by data, compute, R&D, and GTM"]
      - [Runway, null, "Next-round trigger cannot be assessed", "24-month base, upside, and downside cash plan"]
      - [Debt / project finance, null, "Leverage and senior claims unknown", "Debt schedule, covenants, leases, and guarantees"]
      - [Headcount, "50+ in company hiring material; 11–50 in a profile", "Directionally growing, but inconsistent public count", "Employee census, contractor count, hiring plan"]
      - [Customer concentration, null, "Enterprise dependency cannot be quantified", "Revenue by customer, renewal and concentration thresholds"]
    notes: "Funding totals and valuation are reported financing facts; missing cash, burn, debt, and concentration inputs prevent a precise capital-adequacy conclusion."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]

figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Simile's described workflow links enterprise decision inputs to simulated outputs, but public evidence does not quantify conversion or profit at any stage.
    data:
      nodes:
        - id: population
          label: Target population
          detail: "Customer-defined demographics, geography, behavior, or panel population"
        - id: stimulus
          label: Decision stimulus
          detail: "Question, product concept, message, image, video, Figma mock, or website"
        - id: simulation
          label: Simulation runs
          detail: "Synthetic people or populations process the stimulus"
        - id: validation
          label: Ground-truth validation
          detail: "Known studies or participant responses are used to assess accuracy"
        - id: insight
          label: Decision insight
          detail: "Feedback for launches, markets, product tests, or earnings-call rehearsal"
        - id: revenue
          label: Enterprise monetization
          detail: "Commercial pricing and realized gross profit are not publicly disclosed"
      edges:
        - [population, stimulus]
        - [stimulus, simulation]
        - [simulation, validation]
        - [validation, insight]
        - [insight, revenue]
    claimRefs: [CI001, CI004, CI007]

callouts:
  - calloutType: strength
    title: Capital buys validation time
    body: The reported $300 million of financing gives Simile room to fund data acquisition, compute, and enterprise delivery while it proves repeatable economics.
    claimRefs: [CI009, CI010]
  - calloutType: risk
    title: Revenue quality is not public
    body: Neither recognized revenue nor gross margin, retention, cash, burn, runway, debt, or customer concentration is disclosed in the retained evidence.
    claimRefs: [CI003, CI005, CI011, CI012, CI014]
  - calloutType: recommendation
    title: Require a customer-level unit-economics bridge
    body: Underwriting should condition any valuation conclusion on bookings-to-revenue reconciliation, contribution margin by use case, and a 24-month cash plan.
    claimRefs: [CI005, CI008, CI012, CI014]

