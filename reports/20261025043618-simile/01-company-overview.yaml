  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: private-financials
      missingEvidence: Current ARR or revenue, gross margin, net retention, cash balance, burn, and runway supported by company financial statements or investor diligence.
      whyItMatters: The financing narrative establishes capital raised but does not establish sustainable commercial economics or available operating liquidity.
      diligencePath: Request the latest management accounts, cohort revenue bridge, gross-margin walk, cash reconciliation, and board-approved runway plan.
      relatedQuestionRefs: [QO004]
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Board composition, voting control, liquidation preferences, secondary mix, option-pool effects, debt, and complete capitalization after the Series B.
      whyItMatters: A headline post-money valuation and funding total do not describe investor economics or common-shareholder outcomes.
      diligencePath: Obtain the executed Series A and Series B term sheets, cap table, charter, investor-rights agreements, and debt schedule under NDA.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002, TO003]
    - type: missing-source
      severity: material
      topic: validation
      missingEvidence: Independent validation across customer, policy, healthcare, retail, and other consequential use cases beyond the cited survey and interview benchmarks.
      whyItMatters: Reproducing held-out survey responses is not equivalent to predicting product adoption, treatment adherence, or other high-stakes behavior across domains.
      diligencePath: Request blinded out-of-sample studies, calibration curves, subgroup error analysis, incident logs, and customer outcome evidence.
      relatedQuestionRefs: [QO006]
