chapter:
  number: 1
  title: Company Overview
  summary: Simile is a 2025-founded behavioral-simulation startup generally identified with Palo Alto and developing foundation models and synthetic populations for enterprise decisions. Public evidence supports a Stanford research lineage, $300 million of disclosed 2026 financing, named enterprise use, and a 50-plus-person team, but operating economics, governance terms, and even a primary-source headquarters confirmation remain gaps.
sections:
  - id: identity-and-product
    title: Identity, product, and operating footprint
    body: "Simile describes itself as “The Simulation Company” and presents a behavioral foundation model and synthetic people that enterprises can use to test products, campaigns, policies, earnings calls, and other consequential decisions before acting in the real world. Public profiles identify the company as founded in 2025 and usually place it in Palo Alto, while one allocated profile is internally inconsistent by also describing San Francisco headquarters. Company-authored recruiting copy and independent summaries indicate a team of at least 50 and tens of millions of simulations. Named customers recur across several sources, but the public record does not establish absolute revenue, recurring-revenue composition, gross margin, retention, or unit economics."
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO012, CO016]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Founders, leadership, and financing
    body: "The founding group combines Stanford research leadership with a commercial effort built around behavioral simulation. Sources identify Joon Sung Park as co-founder and CEO, with Michael Bernstein, Percy Liang, and Lainie Yallen as co-founders. Park’s earlier Social Simulacra and Generative Agents work provides visible technical lineage, but public materials offer little detail on board composition, succession, or control rights. Bloomberg reported a $100 million February 2026 financing led by Index Ventures without a disclosed valuation; July coverage then reported a $200 million Series B led by Greenoaks at a $2 billion post-money valuation. These two rounds total $300 million raised, not cash currently available, and their preferences, secondary mix, debt, and cap-table effects remain undisclosed."
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002, TO003]
  - id: milestones-and-gaps
    title: Milestones, evidence quality, and unresolved diligence
    body: "Simile’s public trajectory runs from Stanford generative-agent research to a rapidly financed enterprise platform. The strongest dated evidence supports research milestones in 2022, 2023, and 2024; a 2025 company founding; and two large 2026 financings. A refreshed arXiv record reports a 1,052-person study in which combined interview-and-survey agents reached 86% of participants’ own test-retest consistency, a defined benchmark rather than universal predictive accuracy. Independent reporting describes CVS Health work, while PYMNTS highlights inference, linkage, and bias risks inherent in synthetic data. The main diligence boundary remains audited operating and governance detail: current ARR, concentration, cash, deployment cost, board rights, and validation in consequential business contexts are not publicly established."
    claimRefs: [CO003, CO004, CO007, CO008, CO009, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
