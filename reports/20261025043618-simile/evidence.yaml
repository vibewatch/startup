evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: private-financials
    missingEvidence: >-
      Current ARR or revenue, gross margin, net retention, cash balance, burn, and runway supported by company financial
      statements or investor diligence.
    whyItMatters: >-
      The financing narrative establishes capital raised but does not establish sustainable commercial economics or
      available operating liquidity.
    diligencePath: >-
      Request the latest management accounts, cohort revenue bridge, gross-margin walk, cash reconciliation, and
      board-approved runway plan.
    relatedQuestionRefs:
      - QO004
