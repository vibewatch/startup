    title: Recommendation logic
    type: flow
    summary: Financing and adoption signals justify continued diligence, but missing economics and validation constraints prevent a price-supported buy.
    data:
      nodes:
        - id: observed-price
          label: "Observed price"
          detail: "$200M Series B at a reported $2B valuation"
        - id: momentum
          label: "Momentum"
          detail: "Rapid repricing, company-reported 5x revenue growth, and major customers"
        - id: validation
          label: "Validation"
          detail: "Promising benchmark, but transfer to each consequential use is unproven"
        - id: category-risk
          label: "Category risk"
          detail: "Researcher skepticism, accuracy, overtrust, and bias concerns"
        - id: underwriting-gap
          label: "Underwriting gap"
          detail: "ARR, margin, retention, concentration, dilution, and preferences unavailable"
        - id: decision
          label: "Decision"
          detail: "Track; require verified metrics and terms before pricing an investment"
    approximationNotes: "This is a qualitative evidence chain, not a value-proportional diagram."
    claimRefs: [CV001, CV004, CV005, CV009, CV010, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Track, without endorsing the $2 billion price
    body: >-
      The public evidence supports continued diligence but not a buy. Convert the call
      only after verified revenue quality, gross margin, retention, customer
      concentration, calibration, and preferred-equity terms support an explicit
      return model.
    claimRefs: [CV001, CV013, CV016]
  - calloutType: risk
    title: Financing velocity is not valuation support
    body: >-
      A fast sequence of large rounds shows investor demand, not the cash-flow,
      common-equity, or downside economics of the investment. Funding raised must not
      be treated as revenue, runway, or an independently verified valuation floor.
    claimRefs: [CV001, CV002, CV003, CV013]
