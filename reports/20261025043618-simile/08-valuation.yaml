schemaVersion: "report-v2"
artifact: valuation
slug: simile
runDate: 2026-10-25
company:
  name: Simile
chapter:
  number: 8
  title: Valuation
  summary: >-
    Simile's reported $200 million Series B at a $2 billion valuation is supported
    by multiple current sources, but the public record does not disclose the revenue,
    retention, margin, financing-term, or cap-table inputs needed to underwrite that
    price. The evidence supports a track recommendation with high risk and no
    price endorsement pending private diligence.
sections:
  - id: recommendation-and-price
    title: Recommendation and price discipline
    body: >-
      Simile's July 2026 Series B establishes the observable entry context: multiple
      sources report a $200 million round at a $2 billion valuation, about five months
      after a $100 million Series A, while profile and interview sources put total
      disclosed funding near $300 million. That pace signals exceptional investor
      demand, but funding raised is not revenue or cash available, and a post-money
      price does not reveal the economics of common equity. None of the retained
      Simile financing and profile sources discloses absolute revenue, ARR, gross
      margin, net retention, customer concentration, liquidation preferences, or
      secondary participation. The recommendation is therefore track, confidence is
      medium-low, risk is high, and the valuation stance is unsupported at the
      disclosed price. A buy requires verified operating metrics and full financing
      terms; no target return or precise valuation range is supportable from the
      public record.
    claimRefs: [CV001, CV002, CV003, CV013, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Thesis, anti-thesis, and evidence quality
    body: >-
      The thesis rests on unusually fast reported commercialization of a research-led
      product. Company-issued job reposts say revenue grew fivefold after launch and
      that the platform ran tens of millions of simulations for Fortune 100
      enterprises; independent profiles and financing coverage identify customers
      including CVS Health, Gallup, Wealthfront, Deloitte, Telstra, Suntory, and Banco
      Itau. The CEO also said some large customers closed within three months. The
      anti-thesis is that these signals do not yet establish durable software
      economics or broad predictive validity. Simile's 85% result is framed against
      how consistently people reproduce their own responses, while a separate 2026
      researcher study found widespread skepticism, quality concerns, overtrust risk,
      and bias concerns. That study also characterized synthetic users as a complement
      to human research rather than a replacement. The investable question is thus
      not whether the technology is interesting, but whether calibrated outcomes,
      repeat usage, and value capture survive independent customer-level testing.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
    figureRefs: []
  - id: scenarios-and-comparable
    title: Scenarios and comparable context
    body: >-
      The bull case requires repeatable enterprise expansion, reliable calibration
      across new populations, and improving value capture; the CEO acknowledged that
      pricing is still converging and separately described a future in which a single
      simulation might cost $10 million to $20 million to run and sell for $100
      million. That aspiration is not a forecast and cannot anchor a present valuation.
      The base case assumes selective, high-value deployments while synthetic research
      remains complementary to human work. The bear case combines weak transferability,
      governance friction, compute-heavy delivery, and financing multiple compression.
      Harvey AI offers only directional private-market context: TechCrunch reported a
      $5 billion valuation alongside $75 million of annualized run-rate revenue, whereas
      Simile's absolute revenue is undisclosed and its product, stage, and unit
      economics differ. This single comparator illustrates the premium AI market but
      is not an independent benchmark for Simile; no robust public comparable set,
      transaction multiple, or M&A reference is available in the assigned evidence.
    claimRefs: [CV008, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: []
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      Exit readiness is unproven because financing momentum and named customers do not
      establish predictable revenue, durable margins, or a clean ownership structure.
      The next diligence step is a cohort-level operating package covering contracted
      ARR, recognized revenue, gross margin after inference and data-collection costs,
      net and gross retention, customer concentration, sales-cycle duration, burn, and
      runway. The investment team should also obtain the signed Series B documents,
      pre- and post-money capitalization tables, liquidation preferences, participation
      rights, option-pool changes, secondary sales, and governance rights. Product
      diligence should reproduce calibration and confidence results on prospective,
      customer-specific holdouts, including underrepresented subgroups and failed
      simulations. Thesis-break triggers are a material down round, loss of a marquee
      customer, failure to reproduce claimed accuracy outside benchmark tasks, evidence
      of unsafe substitution for required human research, or economics that remain
      services-like after compute and data costs.
    claimRefs: [CV005, CV006, CV009, CV010, CV011, CV012, CV013, CV016]
    tableRefs: []
    figureRefs: []
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, Track, "Strong financing and enterprise signals, but no public operating model.", "Continue diligence; do not underwrite a buy from the headline valuation."]
      - [Confidence, Medium-low, "The price and financing sequence are corroborated; revenue quality and terms are not.", "Treat the conclusion as price-sensitive and reversible."]
      - [Risk rating, High, "Category trust, calibration transfer, value capture, and financing terms remain open.", "Require technical, customer, financial, and legal workstreams."]
      - [Valuation stance, Unsupported, "$2B post-money is observable, but no defensible Simile revenue multiple can be calculated.", "Do not infer price support from funding demand alone."]
      - [Return and exit, Not supportable publicly, "No public ARR, margin, preference stack, dilution, or exit timing.", "Model returns only after data-room evidence is available."]
    notes: "Judgments use current financing reports, company-issued operating signals, and independent category evidence; unavailable metrics are not estimated."
    claimRefs: [CV001, CV002, CV003, CV013, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, Investment reading, What would change the view]
    rows:
      - ["Rapid commercialization", "Company-issued material reports 5x revenue growth after launch.", "Promising velocity, but the denominator and period revenue are undisclosed.", "Verify monthly revenue, booked ARR, and cohort retention."]
      - ["Enterprise proof", "Sources name major customers and report tens of millions of Fortune 100 simulations.", "Use cases appear consequential, but contract size and repeat usage are private.", "Confirm paid deployments, expansion, concentration, and referenceable outcomes."]
      - ["Validation edge", "A third-party technical profile describes an 85% self-replication benchmark.", "The benchmark supports technical credibility, not universal decision accuracy.", "Reproduce performance on prospective customer and subgroup holdouts."]
      - ["Category resistance", "Researchers reported skepticism, quality, overtrust, and bias concerns.", "Trust and governance can slow adoption or constrain high-stakes use.", "Show controls that keep synthetic evidence complementary to human research."]
      - ["Value capture", "The CEO said pricing is still converging despite claimed high customer value.", "Product value may not yet translate into predictable software economics.", "Demonstrate gross-margin expansion and repeatable pricing."]
    notes: "Company-issued claims are labeled as such; the adverse category evidence comes from a human-research provider with a competitive relationship to synthetic research."
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Repeat enterprise expansion; reliable cross-domain calibration; pricing captures decision value; margins improve with scale.", "A premium could be defensible, but no public dollar range or return target is supportable.", "Reported 5x revenue growth, fast customer closes, and rapid financing are upside signals, not probabilities.", "Calibration or gross margin fails to improve with deployment scale."]
      - [Base, "Selective high-value workflows grow while synthetic research remains complementary to human evidence.", "Track at $2B; require verified operating proof or better entry economics before investment.", "Named customers coexist with independent researcher skepticism and governance concerns.", "Expansion stalls or deployments remain project-like."]
      - [Bear, "Transferability, bias, privacy, or governance issues constrain use; delivery costs remain high; private AI multiples compress.", "Downside has no observable public floor because revenue and preference terms are undisclosed.", "Missing economics and category trust concerns increase downside uncertainty.", "Down round, major customer loss, adverse finding, or unsafe decision use."]
      - [Comparable context, "Harvey is used only as a directional private-AI financing reference.", "Harvey's $5B valuation had a disclosed $75M annualized revenue run rate; Simile lacks a comparable public denominator.", "The comparison shows market willingness to fund vertical AI, not business-model equivalence.", "Using Harvey's multiple without matched growth, margin, stage, and terms."]
    notes: "Scenarios are qualitative because the assigned evidence does not support precise Simile valuation ranges, probability percentages, dilution, or exit-return math."
    claimRefs: [CV004, CV007, CV008, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
figures:
