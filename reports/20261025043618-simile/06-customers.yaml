    columns: [Customer or partner, Segment, Deployment or use case, Production versus pilot, Outcome or scale signal, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Publicly named customer and partner references available in the assigned sources as of the 2026-10-25 run date; this is not a complete customer list."
    rows:
      - [CVS Health, Healthcare, "Medication routines, patient messaging, and customer research", "Use is reported; exact contract status is not disclosed", "2.9 million responses from more than 400,000 consenting participants; coverage reports testing of medication behavior", "No renewal, revenue, or causal business outcome disclosed"]
      - [Gallup, Research and policy, "Policy research, trend analysis, and well-being tracking", "Partnership/customer relationship described; production scope unclear", "More than 1,000 AI twins described as available to joint customers", "No usage, renewal, or customer-level economics disclosed"]
      - [Wealthfront, Financial services, "Multimodal product and UX testing", "Named early customer; production breadth unclear", "Reported qualitative research expansion of up to 15x", "Company-reported outcome lacks baseline and contract context"]
      - [Deloitte, Professional services, "Business-critical decision and scenario work", "Named customer; use case and status not fully disclosed", "Included in Simile's enterprise customer references", "No deployment detail or outcome disclosed"]
    notes: "This is a partial public enumeration, not an exhaustive customer roster. Named logos are not treated as proof of retention or production deployment without a source-specific status."
    claimRefs: [CU005, CU008, CU009, CU010]
figures:
  - id: FU001
    title: Customer journey from population definition to expansion
    type: journey-map
    summary: "The public workflow moves from defining a target population through simulation and live decision use, with validation and renewal evidence still incomplete."
    data:
      nodes:
        - id: population
          label: Define population
          title: Define population
          detail: "Enterprise teams specify the population or segment they need to understand."
        - id: ground
          label: Ground with data
          title: Ground with data
          detail: "Simile describes interviews, behavioral data, and customer-owned data as inputs, with consent and governance requirements."
        - id: simulate
          label: Run scenarios
          title: Run scenarios
          detail: "Teams test concepts, messaging, products, policies, or other stimuli against synthetic people."
        - id: decide
          label: Inform decision
          title: Inform decision
          detail: "The stated value is faster, broader decision rehearsal before exposing a live customer population."
        - id: validate
          label: Validate with humans
          title: Validate with humans
          detail: "Public evidence supports validation as an important requirement, but customer-specific calibration and live outcomes are not fully disclosed."
        - id: expand
          label: Renew or expand
          title: Renew or expand
          detail: "Renewal, NRR, GRR, contract duration, and account expansion remain open diligence questions."
    claimRefs: [CU002, CU005, CU010, CU013]
callouts:
  - calloutType: recommendation
    title: Underwrite customer quality, not customer count
    body: "Before treating the reference list as durable enterprise traction, request a customer schedule with paid status, production scope, renewal dates, expansion revenue, concentration, and live-human validation by use case."
    claimRefs: [CU011, CU013]
