company:
  name: Simile
chapter:
  number: 6
  title: Customers
  summary: Simile has public evidence of enterprise use across healthcare, financial services, research, and consumer-facing workflows, but the evidence is weighted toward company claims and customer references rather than disclosed retention or revenue data. The strongest proof is named use tied to specific jobs; durability, conversion from pilot to production, and concentration remain material diligence gaps.
sections:
  - id: buyer-and-user-segments
    title: Buyer and user segments
    body: >-
      Simile sells an enterprise simulation platform to organizations making high-cost decisions about people. Public descriptions identify healthcare, financial services, consumer products, telecommunications, professional services, and research organizations as target segments, while the workflow is used by strategy, product, marketing, research, and policy teams. The buyer is therefore an enterprise decision owner, but the end user is often a researcher or product team that defines a population, supplies a stimulus, and interprets simulated responses. This distinction matters because a named logo does not establish who signed the contract, which department owns the budget, or whether usage is a recurring production workflow. Simile's own job materials describe collaboration with external customers to translate complex human-behavior simulations into usable enterprise products, which supports a high-touch implementation model rather than a purely self-serve motion.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: adoption-and-trajectory
    title: Adoption and usage trajectory
    body: >-
      The public record shows rapid early usage signals but not a durable cohort history. Simile says it launched in 2026, grew revenue fivefold after launch, and ran tens of millions of simulations for Fortune 100 enterprises; these are company-stated scale indicators, not independently audited ARR, active-account, or utilization metrics. A separate account of the CVS deployment describes 2.9 million responses from more than 400,000 consenting participants and planned expansion to more than 100,000 agents, while PYMNTS reports that CVS used a bank of synthetic responses to examine medication routines and messaging. The evidence supports a substantial research workflow at CVS, but it does not establish contract value, renewal, production deployment breadth, or whether the same population is reused across paid studies. The adoption trajectory should therefore be read as promising usage proof with a missing denominator and missing retention layer.
    claimRefs: [CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named customer proof, durability, and concentration
    body: >-
      Named references span CVS Health, Gallup, Wealthfront, Deloitte, Telstra, Suntory, Banco Itaú, and Garnett Station Partners, with described jobs including medication adherence, product and concept testing, policy research, earnings-call rehearsal, and qualitative research expansion. The quality of this proof varies: company and job-posting material confirms the claimed customer set and platform workflow, while PYMNTS provides third-party reporting on CVS's use and User Interviews provides an independent market-level view that researchers see synthetic users as directional complements rather than replacements. MeasuringU's review is adverse to broad substitution claims, documenting inconsistent replication and reduced variance across published studies. No public source in this pool discloses NRR, GRR, churn, renewal rates, contract lengths, customer-level revenue, or the share of activity attributable to the largest accounts. Concentration and durability are consequently unresolved even though the reference list is credible enough to support continued diligence.
    claimRefs: [CU008, CU009, CU010, CU011]
    tableRefs: [TU003]
  - id: diligence-implications
    title: Commercial implications and open diligence
    body: >-
      Simile's customer wedge is strongest where a decision can be rehearsed before live exposure: healthcare messaging and adherence, product or UX testing, market research, and policy or strategic analysis. The adoption case is differentiated by access to consented behavioral data and by the ability to query synthetic populations repeatedly, but this also creates procurement friction around data provenance, consent, security, and methodological validation. User Interviews reports that 47% of surveyed researchers were skeptical and wanted more evidence, while 79% cited concern about stakeholders overtrusting AI-generated findings and 79% cited bias amplification across underrepresented groups. These concerns are not evidence of Simile-specific failure, but they are relevant category-level barriers to expansion and renewal. The next diligence step is to obtain customer-level evidence showing paid production status, renewal or expansion, decision impact, calibration by segment, and live-human validation for each material workflow.
    claimRefs: [CU010, CU012, CU013]
    callouts:
      - calloutType: insight
        title: Best proof is workflow-specific, not logo-based
        body: Public evidence is strongest when a named customer is tied to a concrete job and population; customer counts without contract status, outcomes, or repeat usage should not be treated as retention evidence.
        claimRefs: [CU005, CU008, CU009]
      - calloutType: risk
        title: Durability and concentration are unpriced gaps
        body: No retained source discloses customer-level revenue, renewal, NRR, GRR, churn, or account concentration, so expansion claims cannot yet be converted into a durable revenue-quality conclusion.
        claimRefs: [CU011, CU013]
