      - number: '4.4'
        title: Financial diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The central financial question is whether Simile is selling a repeatable software product or a high-touch
              research service wrapped around proprietary models. The public record supports a credible enterprise use
              case and a well-capitalized balance-sheet starting point, but it does not establish revenue quality, gross
              margin, retention, payback, or capital sufficiency. Underwriting should request monthly recurring or
              contracted revenue by customer, cohort retention, realized price per study and simulation, inference and
              panel costs, implementation hours, accounts receivable aging, debt and preferred terms, and a 24-month
              cash plan. Those requests are more decision-useful than extrapolating revenue from funding, valuation,
              employee counts, or marketing claims.
