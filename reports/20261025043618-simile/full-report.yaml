        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Simile describes itself as “The Simulation Company” and presents a behavioral foundation model and
              synthetic people that enterprises can use to test products, campaigns, policies, earnings calls, and other
              consequential decisions before acting in the real world. Public profiles identify the company as founded
