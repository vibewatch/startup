  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Simile's delivered product is a decision-simulation service rather than a generic chatbot. Its stated
              workflow starts with an individual synthetic user grounded in structured interviews, past choices, and
              behavioral signals, then assembles those agents into populations that can be exposed to a product,
              message, customer journey, or strategic decision. The investor description says users can inspect a range
              of likely responses, the reasoning behind them, and confidence in the result. This is operationally useful
              because a team can compare scenarios before a launch, but the public record does not specify an API
              contract, tenancy model, latency SLO, or reproducible audit trail for each simulation.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
