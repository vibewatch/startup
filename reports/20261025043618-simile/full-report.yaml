      - number: '3.2'
        title: Differentiation and buying criteria
        blocks:
          - type: paragraph
            body: >-
              The most defensible apparent difference is Simile's grounded methodology: the available descriptions
              emphasize long-form interviews with real people, behavioral records, and controlled experiments rather
              than only demographic prompts. Its reported 85% replication result is a useful validation signal, but it
              is primarily company-linked research and should not be treated as an independent benchmark. Academic
              pedigree and named enterprise use cases can lower initial trust and support access to regulated buyers,
              while CVS Health Ventures' participation links a reference customer to the capital base. These advantages
              remain conditional on reproducibility, data rights, calibration by segment, and enterprise security.
              Pricing is described as scaling with the number of simulated agents, whereas several competing platforms
              disclose no public list price. The buyer therefore compares total study cost, speed, evidence quality,
              privacy controls, and whether synthetic results are accepted as a complement to human research.
            claimRefs:
              - CP005
