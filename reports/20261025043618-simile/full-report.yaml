  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is best bounded as enterprise research and decision support that helps an organization
              test products, messages, policies, workflows, or market-entry decisions before committing real-world
              budget. The included spend spans outsourced primary and secondary research, research software,
              synthetic-user or synthetic-data workflows, and simulation-enabled analytics. It excludes general-purpose
              content generation, broad data infrastructure, and unrelated digital-twin applications unless they
              directly inform a human or organizational decision. ESOMAR separates the broader insights industry from
              its market-research, research-software, and reporting components, while QuestionPro likewise distinguishes
              an all-in insights figure from narrower services and core research lenses. This boundary matters because
              Simile's stated use cases include concept testing, product research, market entry, and earnings-call
              preparation, which can substitute for parts of surveys, interviews, focus groups, consulting, or internal
              analysis without replacing every component of those workflows. The incumbent services pool is broad, with
              The Business Research Company listing major providers such as Nielsen, IQVIA, Gartner, Kantar, Ipsos, GfK,
              and Forrester among many others.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM012
              - CM015
      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              The evidence supports multiple sizing lenses, not one additive TAM. ESOMAR reports a global insights
              industry above $140 billion in 2023, comprising a $54 billion market research sector, a $56 billion
              research-software sector, and a $33 billion reporting sector. Its method also says the market-research
              sector grew 4.6% in 2023 while research software grew 12.4%, indicating that software-enabled spend is
              growing faster than the mature services base. A separate analyst page estimates synthetic-data generation
              at $0.78 billion in 2025 and $4.26 billion by 2032, while QuestionPro presents a $96.77 billion 2026
              market-research-services lens. These figures use different definitions, populations, and methods; they
              should be read as bounding lenses rather than summed. No retained source isolates Simile's obtainable
              share, enterprise contract value, or a company-specific SAM/SOM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
