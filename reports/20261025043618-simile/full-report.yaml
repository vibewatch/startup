          - type: paragraph
            body: >-
              Simile’s public trajectory runs from Stanford generative-agent research to a rapidly financed enterprise
              platform. The strongest dated evidence supports research milestones in 2022, 2023, and 2024; a 2025
              company founding; and two large 2026 financings. A refreshed arXiv record reports a 1,052-person study in
