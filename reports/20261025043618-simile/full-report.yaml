      - number: '3.3'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Simile's moat is not established by the research lineage alone. The underlying generative-agent research
              is public, and well-funded teams can study the same blueprint. The durable assets would instead be
              consented and representative data, longitudinal outcome labels, customer workflow integration, evaluation
              protocols, and trust in high-stakes deployments. Independent researchers report that 47% of surveyed
              researchers were skeptical and wanted more evidence, while 88% cited quality and accuracy concerns and 79%
              cited both over-trust and bias amplification. Nielsen Norman Group concludes that synthetic users should
              supplement rather than substitute for real research, documenting shallow, overly favorable, and
              context-poor responses. That evidence limits near-term displacement of human research and raises the risk
              that incumbents add AI features while retaining the customer relationship. Simile can still win a
              screening and scenario-testing layer, but diligence should focus on external validation, privacy and
              security evidence, segment-level calibration, retention, realized pricing, and repeat decision impact.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Grounded wedge
            body: >-
              Simile's strongest apparent distinction is the combination of real-person interview grounding, behavioral
              validation, and enterprise references.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP007
          - type: callout
            title: Substitution ceiling
            body: >-
              Independent research supports synthetic users as a complement for directional work, not a replacement for
              lived human evidence in final decisions.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
          - type: callout
            title: Diligence priority
            body: >-
              Underwrite the data-rights, segment-calibration, independent-holdout, security, renewal, and
              realized-pricing evidence before treating the research moat as durable.
            calloutType: recommendation
            claimRefs:
              - CP006
              - CP011
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              Simile appears to monetize an enterprise decision-support platform rather than a self-serve software seat.
              Public descriptions identify customer work such as concept testing, market entry, product testing,
              earnings-call rehearsal, and retail placement analysis. The operating mechanism is a paid study or
              recurring enterprise relationship in which a customer defines a population and stimulus, then receives
              simulated responses. The available evidence supports demand and workflow fit, but not realized revenue
              recognition, contract duration, renewal, usage-based pricing, or contribution margin. A company job
              posting says Simile “grown revenue 5x” in five months, while a separate company-hosted listing says it has
              run “tens of millions of simulations for F100 enterprises”; these are company claims and should not be
              treated as audited revenue or independently verified usage. The most important commercial diligence is to
              reconcile bookings, recognized revenue, contracted backlog, usage volume, and gross profit by customer and
              use case.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
