      - number: '4.2'
        title: Pricing, delivery costs, and unit economics
        blocks:
          - type: paragraph
            body: >-
              No retained source provides a public Simile price list, minimum contract value, realized discount,
              implementation fee, or customer-specific gross margin. The product descriptions imply a hybrid economic
              model: population construction and validation require data acquisition and research labor, while repeated
              simulations consume model inference and compute. A company job listing advertises $200,000– $300,000
              salary ranges for specialist roles, which signals expensive talent requirements but is not a proxy for
              total operating cost or delivery cost. Public descriptions also say customers can run inputs including
              text, images, video, Figma mocks, and live websites, so cost-to-serve likely varies materially by
              modality, population size, validation depth, and simulation repetition. Until Simile supplies realized
              price and cost cohorts, unit economics remain an underwriting gap rather than a modeled precision
              estimate.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
