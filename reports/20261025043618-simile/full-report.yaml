          improve with scale.
        - A premium could be defensible, but no public dollar range or return target is supportable.
        - Reported 5x revenue growth, fast customer closes, and rapid financing are upside signals, not probabilities.
        - Calibration or gross margin fails to improve with deployment scale.
      - - Base
        - Selective high-value workflows grow while synthetic research remains complementary to human evidence.
        - Track at $2B; require verified operating proof or better entry economics before investment.
        - Named customers coexist with independent researcher skepticism and governance concerns.
        - Expansion stalls or deployments remain project-like.
      - - Bear
        - >-
          Transferability, bias, privacy, or governance issues constrain use; delivery costs remain high; private AI
          multiples compress.
        - Downside has no observable public floor because revenue and preference terms are undisclosed.
        - Missing economics and category trust concerns increase downside uncertainty.
        - Down round, major customer loss, adverse finding, or unsafe decision use.
      - - Comparable context
        - Harvey is used only as a directional private-AI financing reference.
        - >-
          Harvey's $5B valuation had a disclosed $75M annualized revenue run rate; Simile lacks a comparable public
          denominator.
        - The comparison shows market willingness to fund vertical AI, not business-model equivalence.
        - Using Harvey's multiple without matched growth, margin, stage, and terms.
    notes: >-
      Scenarios are qualitative because the assigned evidence does not support precise Simile valuation ranges,
      probability percentages, dilution, or exit-return math.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
