      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer is the organization accountable for a consequential decision, while the user is typically a
              product, insights, strategy, policy, marketing, or research team and the payer is the business unit
              holding the research or decision-support budget. The adoption path is therefore likely to begin with a
              bounded concept, messaging, patient, customer, or policy question, then expand if simulated results reduce
              research cycle time or improve prioritization. Evidence from Simile's own hiring surfaces describes
              Fortune 100 decision-makers who need population, uncertainty, and confidence outputs to be legible, while
              independent coverage describes traditional market research as the status quo and a market-research
              platform emphasizes validation against real respondents. The main drivers are speed, cost discipline,
              privacy, and the ability to test more variants before a live pilot. The constraints are model validity,
              representativeness, consent and governance, compute economics, and buyer reluctance to replace live
              evidence in high-stakes settings. Accordingly, near-term adoption is more plausibly augmentation of
              research than wholesale replacement, and valuation relevance depends on repeatable paid workflows rather
              than the headline size of all human decision-making.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is broad but not additive
            body: >-
              The strongest sizing case is a set of adjacent spend pools—research services, research software,
              reporting, and synthetic-data or simulation tools—not a single validated TAM. Simile's market opportunity
              is credible as a workflow wedge, but its obtainable share remains unproven.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
          - type: callout
            title: Validation is the adoption gate
            body: >-
              Synthetic or simulated respondents can reduce the cost of exploring decisions, but market-research vendor
              guidance still stresses that synthetic data must be validated against real respondent behavior. This
              limits substitution claims and may keep live research in the workflow.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              Simile competes across several layers rather than against one product. Its direct peers are
              behavioral-simulation vendors such as Aaru and Artificial Societies; adjacent tools include synthetic-user
              platforms such as Viewpoints.ai, Brox.ai, and Semilattice; and the practical substitutes are traditional
              market-research firms, human panels, surveys, focus groups, consulting studies, and internal data-science
              teams. The category is still fluid: independent market-research commentary describes synthetic users as
              most useful for hypothesis generation and early-stage testing, while researchers continue to value lived
              experience and new data from real participants. Simile's own category definition is broader than a
              conventional UX tool: it builds digital-twin agents from interviews and behavioral data, then runs
              populations against products, messages, pricing, and policies. This creates a potentially large wedge, but
              it also means the company must prove that its outputs improve decisions rather than merely produce
              plausible text.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
