      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Simile has substantial disclosed financing relative to its early operating age: reported Series A and
              Series B announcements imply $300 million raised, with the later round reported at a $2 billion post-money
              valuation. That capital can fund model training, panel or behavioral-data acquisition, compute, and
              enterprise engineering, but no retained source discloses cash on hand, monthly burn, runway, debt,
              liquidation preferences, secondary proceeds, or the amount reserved for working capital. Hiring material
              describes a global team of 50+ and continuing recruitment, while another profile lists employees as 11–50;
