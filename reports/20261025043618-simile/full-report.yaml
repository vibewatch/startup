      - number: '5.2'
        title: Model, data, and evaluation
        blocks:
          - type: paragraph
            body: >-
              The technical thesis is that realistic behavioral simulation requires data about what people do, not only
              text about what people say. Public interview material describes three complementary inputs: long-form
              interviews, observational or transactional behavior, and randomized controlled trials that expose causal
              responses. The same material distinguishes population-level from individual-level models and says
              post-training is used when the model must learn the underlying “social physics.” The 2023 open-source
              Generative Agents repository demonstrates the antecedent architecture with memory, planning, reflection,
              and a shared environment, but it is research evidence rather than proof of the current production stack.
              Public validation claims are promising, while subgroup calibration curves, failure cases, and independent
              replication are not disclosed.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.3'
        title: Maturity, deployment, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The product appears beyond a laboratory prototype: the company and investor materials describe tens of
              millions of simulations for Fortune 100 enterprises, a confidence model, and a program using 2.9 million
              consented responses from more than 400,000 participants. Job postings also show product-design work
              centered on populations, uncertainty, and confidence for high-stakes enterprise users. These signals
              indicate a maturing workflow and a need for careful explanation layers, not merely model output. They do
              not establish production uptime, integration breadth, data-retention rules, incident history, or support
              commitments. The service remains dependent on consented participant data, enterprise data access, compute
              economics, and the continued availability of specialized research and evaluation talent.
            claimRefs:
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Simulation quality is a product risk as much as a model metric. In convergent questions, small errors may
              wash out, while divergent questions require repeated runs and confidence around the distribution of
              outcomes. That distinction is material for enterprise decisions: a single headline accuracy number cannot
              substitute for calibration by population, task, geography, and intervention. NIST's AI Risk Management
              Framework provides a relevant external control baseline for trustworthy design, development, use, and
              evaluation, but there is no public evidence that Simile conforms to it or to a comparable assurance
              program. The immediate diligence priority is therefore evidence of consent and deletion controls, subgroup
              performance, security testing, provenance, human review, and operational incident response before use in
              regulated or high-consequence workflows. External governance sources also highlight a distinct
              output-handling risk: synthetic material can be mistaken for real evidence, while disclosure and
              authentication controls can create their own privacy and security tradeoffs.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-to-product lineage is unusually coherent
            body: >-
              The open research lineage and current product descriptions connect memory-based agents, behavioral data,
              and enterprise scenario testing without requiring an unsupported architecture claim.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE010
          - type: callout
            title: Production assurance is the main technical gap
            body: >-
              Public materials describe ambitious scale and validation concepts, but do not disclose the security,
              reliability, subgroup calibration, or reproducibility evidence needed for high-stakes deployment.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >-
              Simile sells an enterprise simulation platform to organizations making high-cost decisions about people.
              Public descriptions identify healthcare, financial services, consumer products, telecommunications,
              professional services, and research organizations as target segments, while the workflow is used by
              strategy, product, marketing, research, and policy teams. The buyer is therefore an enterprise decision
              owner, but the end user is often a researcher or product team that defines a population, supplies a
              stimulus, and interprets simulated responses. This distinction matters because a named logo does not
              establish who signed the contract, which department owns the budget, or whether usage is a recurring
              production workflow. Simile's own job materials describe collaboration with external customers to
              translate complex human-behavior simulations into usable enterprise products, which supports a high-touch
              implementation model rather than a purely self-serve motion.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU008
      - number: '6.2'
        title: Adoption and usage trajectory
        blocks:
          - type: paragraph
            body: >-
              The public record shows rapid early usage signals but not a durable cohort history. Simile says it
              launched in 2026, grew revenue fivefold after launch, and ran tens of millions of simulations for Fortune
              100 enterprises; these are company-stated scale indicators, not independently audited ARR, active-account,
              or utilization metrics. A separate account of the CVS deployment describes 2.9 million responses from more
              than 400,000 consenting participants and planned expansion to more than 100,000 agents, while PYMNTS
              reports that CVS used a bank of synthetic responses to examine medication routines and messaging. The
              evidence supports a substantial research workflow at CVS, but it does not establish contract value,
              renewal, production deployment breadth, or whether the same population is reused across paid studies. The
              adoption trajectory should therefore be read as promising usage proof with a missing denominator and
              missing retention layer.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU005
              - CU010
              - CU013
      - number: '6.3'
        title: Named customer proof, durability, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named references span CVS Health, Gallup, Wealthfront, Deloitte, Telstra, Suntory, Banco Itaú, and Garnett
              Station Partners, with described jobs including medication adherence, product and concept testing, policy
              research, earnings-call rehearsal, and qualitative research expansion. The quality of this proof varies:
              company and job-posting material confirms the claimed customer set and platform workflow, while PYMNTS
              provides third-party reporting on CVS's use and User Interviews provides an independent market-level view
              that researchers see synthetic users as directional complements rather than replacements. MeasuringU's
              review is adverse to broad substitution claims, documenting inconsistent replication and reduced variance
              across published studies. No public source in this pool discloses NRR, GRR, churn, renewal rates, contract
              lengths, customer-level revenue, or the share of activity attributable to the largest accounts.
              Concentration and durability are consequently unresolved even though the reference list is credible enough
              to support continued diligence.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: Commercial implications and open diligence
        blocks:
          - type: paragraph
            body: >-
              Simile's customer wedge is strongest where a decision can be rehearsed before live exposure: healthcare
              messaging and adherence, product or UX testing, market research, and policy or strategic analysis. The
              adoption case is differentiated by access to consented behavioral data and by the ability to query
              synthetic populations repeatedly, but this also creates procurement friction around data provenance,
              consent, security, and methodological validation. User Interviews reports that 47% of surveyed researchers
              were skeptical and wanted more evidence, while 79% cited concern about stakeholders overtrusting
              AI-generated findings and 79% cited bias amplification across underrepresented groups. These concerns are
              not evidence of Simile-specific failure, but they are relevant category-level barriers to expansion and
              renewal. The next diligence step is to obtain customer-level evidence showing paid production status,
              renewal or expansion, decision impact, calibration by segment, and live-human validation for each material
              workflow.
            claimRefs:
              - CU010
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite customer quality, not customer count
            body: >-
              Before treating the reference list as durable enterprise traction, request a customer schedule with paid
              status, production scope, renewal dates, expansion revenue, concentration, and live-human validation by
              use case.
            calloutType: recommendation
            claimRefs:
              - CU011
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and data-rights exposure
        blocks:
          - type: paragraph
            body: >
              Simile's product is built from interviews, survey responses, behavioral observations, and randomized
              experiments involving real people. That creates a data-governance surface that is more demanding than a
              generic marketing model: California privacy rules give consumers rights to know, delete, correct, opt out
              of sale or sharing, and limit sensitive-data use, while the European AI Act adds obligations when an AI
              system enters a high-risk use case. The public record does not establish Simile's exact
              controller/processor role, geographic coverage, retention policy, consent language, deletion workflow, or
              audit evidence. The risk is therefore not a recorded violation but an unresolved compliance dependency
              that could delay enterprise deployments or constrain use in health, employment, public-sector, or
              political contexts. The company has publicly described caution around political applications, but no
              independently verified control framework was found.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
      - number: '7.2'
        title: Model validity, bias, and operational reliability
        blocks:
          - type: paragraph
            body: >-
              Simile's strongest public validation is narrower than its broadest ambition. The reported 85% figure
              compares digital-twin behavior with the degree to which people reproduce their own responses after a
              two-week interval; it is not evidence that arbitrary purchases, votes, policy outcomes, or market events
              are predicted with 85% accuracy. Independent technical commentary describes the individual study design
              and identifies population specificity, data acquisition, validation, and the risk of compounding model
              errors as ongoing challenges. Simile's own hiring materials emphasize that users will act on simulation
              outputs and that interfaces must make uncertainty and confidence legible. Until calibration by subgroup,
              out-of-distribution performance, incident history, and reproducibility across customers are disclosed, the
              residual risk is that a persuasive simulation is treated as a causal forecast. Monitoring should therefore
              include holdout accuracy, calibration drift, subgroup error, human override rates, and post-decision
              outcomes.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs: []
      - number: '7.3'
        title: Partner, scaling, and financial-model dependencies
        blocks:
          - type: paragraph
            body: >
              Simile's public narrative depends on access to participant data, enterprise counterparties, panel supply,
              specialized research talent, and substantial compute. Public profiles describe enterprise use and a
              workforce of roughly 50 or fewer than 60 people, while other coverage describes tens of millions of
              simulations and a long-term goal of representing billions of people. Those descriptions indicate execution
              leverage but do not disclose customer concentration, contract duration, gross margin, inference cost per
              study, panel pricing, cloud concentration, service-level commitments, or cash runway. The technical
              commentary explicitly describes population-scale simulation as computationally expensive and multi-agent
              interaction as combinatorially complex. The investment risk is consequently an unverified scaling
              equation: revenue may grow while contribution margin, infrastructure capacity, or quality assurance lags.
              A diligence process should test whether each new customer improves data and fixed-cost absorption without
              increasing privacy, reliability, or concentration exposure faster than controls mature.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs: []
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction risk
            body: >-
              The key diligence risk is not a recorded breach or enforcement action; it is the gap between a high-impact
              behavioral-data product and the limited public evidence about consent, security, subgroup calibration, and
              production incident management.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR008
          - type: callout
            title: Kill criteria
            body: >-
              Treat a material privacy incident, repeated subgroup validation failure, inability to reproduce customer
              results, or infrastructure costs that outgrow contracted gross profit as thesis-break events until
              management supplies verified remediation and economics.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR008
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Simile's July 2026 Series B establishes the observable entry context: multiple sources report a $200
              million round at a $2 billion valuation, about five months after a $100 million Series A, while profile
              and interview sources put total disclosed funding near $300 million. That pace signals exceptional
              investor demand, but funding raised is not revenue or cash available, and a post-money price does not
              reveal the economics of common equity. None of the retained Simile financing and profile sources discloses
              absolute revenue, ARR, gross margin, net retention, customer concentration, liquidation preferences, or
              secondary participation. The recommendation is therefore track, confidence is medium-low, risk is high,
              and the valuation stance is unsupported at the disclosed price. A buy requires verified operating metrics
              and full financing terms; no target return or precise valuation range is supportable from the public
              record.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV009
              - CV010
              - CV013
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and evidence quality
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on unusually fast reported commercialization of a research-led product. Company-issued
              job reposts say revenue grew fivefold after launch and that the platform ran tens of millions of
              simulations for Fortune 100 enterprises; independent profiles and financing coverage identify customers
              including CVS Health, Gallup, Wealthfront, Deloitte, Telstra, Suntory, and Banco Itau. The CEO also said
              some large customers closed within three months. The anti-thesis is that these signals do not yet
              establish durable software economics or broad predictive validity. Simile's 85% result is framed against
              how consistently people reproduce their own responses, while a separate 2026 researcher study found
              widespread skepticism, quality concerns, overtrust risk, and bias concerns. That study also characterized
              synthetic users as a complement to human research rather than a replacement. The investable question is
              thus not whether the technology is interesting, but whether calibrated outcomes, repeat usage, and value
              capture survive independent customer-level testing.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              The bull case requires repeatable enterprise expansion, reliable calibration across new populations, and
              improving value capture; the CEO acknowledged that pricing is still converging and separately described a
              future in which a single simulation might cost $10 million to $20 million to run and sell for $100
              million. That aspiration is not a forecast and cannot anchor a present valuation. The base case assumes
              selective, high-value deployments while synthetic research remains complementary to human work. The bear
              case combines weak transferability, governance friction, compute-heavy delivery, and financing multiple
              compression. Harvey AI offers only directional private-market context: TechCrunch reported a $5 billion
              valuation alongside $75 million of annualized run-rate revenue, whereas Simile's absolute revenue is
              undisclosed and its product, stage, and unit economics differ. This single comparator illustrates the
              premium AI market but is not an independent benchmark for Simile; no robust public comparable set,
              transaction multiple, or M&A reference is available in the assigned evidence.
            claimRefs:
              - CV008
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is unproven because financing momentum and named customers do not establish predictable
              revenue, durable margins, or a clean ownership structure. The next diligence step is a cohort-level
              operating package covering contracted ARR, recognized revenue, gross margin after inference and
              data-collection costs, net and gross retention, customer concentration, sales-cycle duration, burn, and
              runway. The investment team should also obtain the signed Series B documents, pre- and post-money
              capitalization tables, liquidation preferences, participation rights, option-pool changes, secondary
              sales, and governance rights. Product diligence should reproduce calibration and confidence results on
              prospective, customer-specific holdouts, including underrepresented subgroups and failed simulations.
              Thesis-break triggers are a material down round, loss of a marquee customer, failure to reproduce claimed
              accuracy outside benchmark tasks, evidence of unsafe substitution for required human research, or
              economics that remain services-like after compute and data costs.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, without endorsing the $2 billion price
            body: >-
              The public evidence supports continued diligence but not a buy. Convert the call only after verified
              revenue quality, gross margin, retention, customer concentration, calibration, and preferred-equity terms
              support an explicit return model.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV013
              - CV016
          - type: callout
            title: Financing velocity is not valuation support
            body: >-
              A fast sequence of large rounds shows investor demand, not the cash-flow, common-equity, or downside
              economics of the investment. Funding raised must not be treated as revenue, runway, or an independently
              verified valuation floor.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
