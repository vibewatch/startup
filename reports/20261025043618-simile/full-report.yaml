  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Simile's public product story runs from consented human data through behavioral models to scenario outputs and
      enterprise decision use.
    data:
      layers:
        - label: Data foundation
          detail: Public descriptions identify three principal evidence inputs.
          items:
            - label: Structured interviews
              detail: Long-form personal histories and qualitative context.
            - label: Observational and transaction data
              detail: Signals of what participants actually do.
            - label: Randomized controlled trials
              detail: Intervention and causal-response evidence.
        - label: Modeling
          detail: Individual and population representations are used for behavioral simulation.
          items:
            - label: Individual synthetic users
              detail: One-to-one behavioral representations.
            - label: Synthetic populations
              detail: Aggregated agents for segment-level questions.
            - label: Post-trained behavioral models
              detail: Models intended to capture domain-specific social physics.
        - label: Simulation and evaluation
          detail: Scenarios are run repeatedly and evaluated for confidence and outcome distributions.
          items:
            - label: Scenario runner
              detail: Applies products, messages, journeys, or decisions.
            - label: Repeated-run analysis
              detail: Examines convergence, divergence, and outcome distributions.
            - label: Confidence model
              detail: Company-described prediction of simulation accuracy.
        - label: Enterprise decision surface
          detail: Enterprise users inspect outputs for product, journey, and strategic decisions.
          items:
            - label: Concept and product testing
              detail: Compare reactions before deployment.
            - label: Customer-journey analysis
              detail: Explore response ranges and reasoning.
            - label: Strategic decision support
              detail: Use simulations as an input to high-stakes decisions.
        - label: Governance and assurance
          detail: Trust, privacy, security, and human-review controls are required for deployment.
          items:
            - label: Consent and retention
              detail: Controls for participant data and derived synthetic users.
            - label: Safety and quality review
              detail: Human review and documented failure handling for high-stakes use.
        - label: Delivery operations
          detail: Production service depends on reliable serving, support, and integration boundaries.
          items:
            - label: Model serving and compute
              detail: Infrastructure for repeated enterprise simulations.
            - label: Enterprise access and support
              detail: Authentication, integrations, monitoring, and customer operations.
    approximationNotes: >-
      The layers are an analytical representation of public descriptions, not a disclosed software diagram;
      implementation details and control boundaries remain gaps.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE008
      - CE010
      - CE013
      - CE016
  - id: FU001
    title: Customer journey from population definition to expansion
    type: journey-map
    summary: >-
      The public workflow moves from defining a target population through simulation and live decision use, with
      validation and renewal evidence still incomplete.
    data:
      nodes:
        - id: population
          label: Define population
          title: Define population
          detail: Enterprise teams specify the population or segment they need to understand.
        - id: ground
          label: Ground with data
          title: Ground with data
          detail: >-
            Simile describes interviews, behavioral data, and customer-owned data as inputs, with consent and governance
            requirements.
        - id: simulate
          label: Run scenarios
          title: Run scenarios
          detail: Teams test concepts, messaging, products, policies, or other stimuli against synthetic people.
        - id: decide
          label: Inform decision
          title: Inform decision
          detail: The stated value is faster, broader decision rehearsal before exposing a live customer population.
        - id: validate
          label: Validate with humans
          title: Validate with humans
          detail: >-
            Public evidence supports validation as an important requirement, but customer-specific calibration and live
            outcomes are not fully disclosed.
        - id: expand
          label: Renew or expand
          title: Renew or expand
          detail: Renewal, NRR, GRR, contract duration, and account expansion remain open diligence questions.
    claimRefs:
      - CU002
      - CU005
      - CU010
      - CU013
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual exposures combine sensitive behavioral data with uncertain controls, model generalization,
      and compute economics.
    data:
      columns:
        - Privacy and data rights
        - Model validity
        - Scaling economics
        - Dependency concentration
      rows:
        - label: Regulatory use-case expansion
          values:
            - high
            - high
            - medium
            - medium
          note: EU high-risk obligations and California privacy duties require product-specific diligence.
        - label: High-stakes customer decision
          values:
            - high
            - high
            - high
            - medium
          note: Confidence and accuracy claims do not establish arbitrary outcome prediction.
        - label: Population-scale simulation
          values:
            - high
            - high
            - high
            - high
          note: More data and compute may increase both capability and exposure.
        - label: Enterprise delivery continuity
          values:
            - medium
            - high
            - high
            - high
          note: Customer, panel, talent, and infrastructure dependencies are not publicly quantified.
        - label: Public-policy simulation
          values:
            - high
            - high
            - medium
            - medium
          note: Potential misuse and democratic-process sensitivity require explicit use-case restrictions.
        - label: Security assurance
          values:
            - high
            - high
            - high
            - medium
          note: No retained source establishes a current security certification or incident-control record.
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Financing and adoption signals justify continued diligence, but missing economics and validation constraints
      prevent a price-supported buy.
    data:
      nodes:
        - id: observed-price
          label: Observed price
          detail: $200M Series B at a reported $2B valuation
        - id: momentum
          label: Momentum
          detail: Rapid repricing, company-reported 5x revenue growth, and major customers
        - id: validation
          label: Validation
          detail: Promising benchmark, but transfer to each consequential use is unproven
        - id: category-risk
          label: Category risk
          detail: Researcher skepticism, accuracy, overtrust, and bias concerns
        - id: underwriting-gap
          label: Underwriting gap
          detail: ARR, margin, retention, concentration, dilution, and preferences unavailable
        - id: decision
          label: Decision
          detail: Track; require verified metrics and terms before pricing an investment
    approximationNotes: This is a qualitative evidence chain, not a value-proportional diagram.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV009
      - CV010
      - CV013
      - CV016
