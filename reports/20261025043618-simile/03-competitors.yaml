    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "Simile appears differentiated by grounding and enterprise decision scope, while competitors and substitutes span lower-cost synthetic testing and higher-authenticity human research."
    data:
      points:
        - {label: Simile, x: 0.82, y: 0.78, note: "Grounded-data and enterprise-scope assessment; ordinal, not a measured benchmark."}
        - {label: Aaru, x: 0.60, y: 0.72, note: "Direct peer named in assigned coverage; public comparative evidence limited."}
        - {label: Artificial Societies, x: 0.58, y: 0.68, note: "Social-simulation orientation; customer and validation data incomplete."}
        - {label: Viewpoints.ai, x: 0.46, y: 0.56, note: "Synthetic-panel orientation from assigned comparative review."}
        - {label: Traditional research, x: 0.90, y: 0.36, note: "High direct-observation authenticity, lower repeatability and speed."}
        - {label: Internal build, x: 0.70, y: 0.48, note: "First-party context with organization-specific execution burden."}
      xAxis:
        label: Grounding and evidence depth
        min: 0
        max: 1
      yAxis:
        label: Enterprise scenario scope
        min: 0
        max: 1
    approximationNotes: "Coordinates are ordinal analyst assessments from the assigned evidence, not vendor-reported scores or a market benchmark."
    claimRefs: [CP001, CP005, CP010]
callouts:
  - calloutType: strength
    title: Grounded wedge
    body: "Simile's strongest apparent distinction is the combination of real-person interview grounding, behavioral validation, and enterprise references."
    claimRefs: [CP005, CP006, CP007]
  - calloutType: risk
    title: Substitution ceiling
    body: "Independent research supports synthetic users as a complement for directional work, not a replacement for lived human evidence in final decisions."
    claimRefs: [CP010, CP011, CP012]
  - calloutType: recommendation
    title: Diligence priority
    body: "Underwrite the data-rights, segment-calibration, independent-holdout, security, renewal, and realized-pricing evidence before treating the research moat as durable."
    claimRefs: [CP006, CP011, CP014, CP015]
