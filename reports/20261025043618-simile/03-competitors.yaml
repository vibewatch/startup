    columns: [Alternative, Category, Target job, Apparent strength, Limitation or unknown]
    rows:
      - [Simile, direct behavioral simulation, "Test reactions of modeled populations before decisions", "Grounded agents, academic lineage, named enterprise references", "Independent validation, realized pricing, security, and current scale are not public"]
      - [Aaru, direct behavioral simulation, "Simulate business systems and social outcomes", "Frequently named peer; reported enterprise and forecasting use cases", "Pricing, validation protocol, and data provenance are not public"]
      - [Artificial Societies, direct social simulation, "Model interacting communities", "Large social-simulation orientation", "Customer scale, pricing, and comparative accuracy are not established"]
      - [CulturePulse, direct social simulation, "Generate synthetic social insight", "Category adjacency and named competitor in available coverage", "Product scope, pricing, and validation are not established"]
      - [Viewpoints.ai, adjacent synthetic-user platform, "Test surveys, concepts, and advertising", "Synthetic panels and rapid repeated testing", "Not a direct like-for-like behavioral-foundation-model benchmark"]
      - [Brox.ai, adjacent UX simulation, "Test interfaces and user journeys", "Usability and accessibility-oriented simulations", "Primarily interface testing rather than population policy or market simulation"]
      - [Semilattice, adjacent explainable simulation, "Support explainable AI decisions", "Published entry pricing in comparative review", "Scope and enterprise proof relative to Simile are unclear"]
      - [Traditional research firms, incumbent substitute, "Recruit and study real participants", "Lived experience, new data, and established buyer trust", "Slower, more expensive, and constrained by recruitment and panel fatigue"]
      - [Internal build, status quo substitute, "Use proprietary analytics and experiments", "First-party context and control of data", "Requires scarce modeling, research, and governance talent"]
      - [Focus groups and surveys, status quo substitute, "Answer a defined research question", "Direct participant feedback and familiar methodology", "Limited scale and repeated-query economics"]
    notes: "Coverage is a representative landscape from assigned public sources, not an exhaustive market census; unknown means the assigned sources did not establish the field."
    enumerationScope:
      coverage: sample
      basis: "Representative named peers, adjacent tools, and status-quo substitutes identified in assigned public sources through 2026-10-25."
    claimRefs: [CP001, CP002, CP003, CP004, CP010]
  - id: TP002
    title: Feature and capability comparison
    columns: [Buying criterion, Simile, Direct or adjacent peers, Incumbent or status quo, Diligence implication]
    rows:
      - [Grounding data, "Two-hour interviews and behavioral data are described", "Varies; pure-synthetic versus grounded approaches", "Real participants or first-party records", "Verify consent, representativeness, and data rights"]
      - [Population simulation, "Population and individual models are described", "Artificial Societies emphasizes interacting communities", "Panels or statistical models", "Benchmark repeatability by segment"]
      - [Scenario iteration, "Repeated product, pricing, policy, and message testing", "Synthetic-user tools emphasize rapid iteration", "New fieldwork or experiment per question", "Measure time saved without overstating accuracy"]
      - [Validation, "85% GSS replication claim reported", "Peer-specific methods are not comparable in assigned sources", "Research methods have established designs", "Require independent holdout and calibration results"]
      - [Enterprise references, "CVS, Wealthfront, Gallup, Telstra and others are reported", "Aaru and adjacent tools have reported client references", "Incumbents have broad customer bases", "Check paid pilots, renewals, and decision outcomes"]
      - [Trust and governance, "Security and subgroup disclosures remain incomplete", "Researchers report broad governance gaps", "Established research and privacy processes", "Require audit, access, retention, and human-review controls"]
      - [Distribution, "Enterprise sales and strategic investor relationships", "Peers compete for the same research and strategy buyers", "Incumbents own many existing workflows", "Test channel leverage and switching costs"]
      - [Pricing transparency, "Agent-count pricing is described; list price unavailable", "Several tools disclose no public list price", "Project or panel pricing is familiar", "Compare realized cost per decision, not list price alone"]
    notes: "Cells preserve the evidence boundary; peer cells are not independent benchmark scores and unavailable details remain explicit."
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP011]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider or substitute, Price or contract model, Included capability, Discount or unknown, Competitive implication]
    rows:
      - [Simile, "Priced by number of simulated agents", "Population simulations and scenario testing", "Realized price, minimum commitment, and contract terms unknown", "Potentially scales with usage and panel size"]
      - [Viewpoints.ai, "Custom pricing", "Synthetic consumer panels and concept or survey testing", "No public list price in assigned review", "Competes on research replacement workflow"]
      - [Brox.ai, "Not shared publicly", "Synthetic UX and accessibility testing", "Packaging and enterprise terms unknown", "Competes for early product-testing budget"]
      - [Artificial Societies, "Custom pricing", "Interacting social simulations", "Pricing and commercial scope unknown", "Potentially overlaps on complex social scenarios"]
      - [Aaru, "Not shared publicly in assigned sources", "Business-system and simulation use cases", "Terms and validation unknown", "Direct price comparison unavailable"]
      - [Semilattice, "Play: $1/month; Launch: $399/month", "Explainable AI decision support", "Plan limits and enterprise pricing require verification", "Low-end price anchor may pressure experimentation budgets"]
      - [Traditional panel study, "Project-based research or panel fees", "Recruitment, interviews, surveys, and analysis", "Quote varies by sample and method", "Higher human-input cost but stronger direct-observation evidence"]
      - [Internal research team, "Salary, tooling, and experiment budget", "First-party studies and analysis", "Fully loaded cost is company-specific", "Can retain context and ownership but is capacity constrained"]
    notes: "The assigned sources provide only partial public pricing; no row should be read as realized revenue, margin, or a like-for-like quote."
    claimRefs: [CP005, CP008, CP012]
figures:
