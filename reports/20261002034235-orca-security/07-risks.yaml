callouts:
  - calloutType: "risk"
    title: "Architectural Boundary: Out-of-Band Visibility vs In-Line Defense"
    body: |
      Orca's patented SideScanning delivers unparalleled deployment speed by decoupling scanning from production workloads. However, this architectural choice inherently limits real-time preventative blocking and east-west microservice traffic inspection. Security leaders must recognize that agentless posture management cannot replace in-line runtime application defense or dedicated API security controls.
    claimRefs:
      - "CR004"
      - "CR005"
  - calloutType: "insight"
    title: "Private Disclosure Opacity and Competitive Pressure"
    body: |
      In an aggressive market dominated by Wiz's rapid ARR growth and well-funded expansion, Orca's private status and unverified financial metrics represent a material diligence hurdle. Investors and buyers must probe whether Orca can sustain necessary R&D velocity without dilutive capital infusions.
    claimRefs:
      - "CR011"
      - "CR012"
