schemaVersion: "report-v2"
artifact: financials
slug: orca-security
runDate: 2026-10-02
company:
  name: Orca Security
chapter:
  number: 4
  title: Financials
  summary: >-
    Orca has a credible enterprise subscription model tied primarily to protected cloud workload,
    with newer seat-based products and partner-assisted expansion. Underwriting remains blocked by
    conflicting revenue labels and the absence of current gross margin, retention, burn, cash, and
    runway disclosures; cumulative funding and a historical valuation do not resolve those gaps.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing
    body: >-
      Orca's clearest monetization evidence comes from CEO Gil Geron's 2026 interview: the core
      license scales with the size of a customer's cloud workload, while a smaller set of newer
      products uses seat licenses. That structure supports two expansion vectors—growth in the
      protected cloud estate and adoption of additional modules—rather than pure user-seat growth.
      Sacra independently describes a subscription SaaS model priced by protected workload and
      reports a $50,000 annual starting point plus $7,000-$30,000 monthly AWS ranges, but those
      figures are third-party reporting rather than an official price card or realized-price
      schedule. The available evidence therefore supports the mechanism, not the mix, discounting,
      contract duration, deferred-revenue profile, or revenue-recognition policy.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Traction and revenue quality
    body: >-
      Management says Orca serves more than 1,000 customers and cited one expansion from a
      $300,000 contract to $2.6 million, evidence that large-enterprise expansion can be material.
      It is not a cohort metric and cannot establish average contract value, net retention, or
      concentration. GetLatka labels $64.2 million as estimated 2024 annual revenue, then elsewhere
      calls the same figure ARR and states that the CEO did not confirm it. The CEO also declined
      to confirm the host's inference of a run rate above $100 million. Consequently, the public
      record shows commercial traction but does not provide a consistent current revenue or ARR
      baseline from which to calculate growth, revenue quality, or valuation multiples.
    claimRefs: [CI005, CI006, CI007, CI011, CI012, CI013]
  - id: unit-economics-and-cost-base
    title: Unit economics and cost base
    body: >-
      The source set contains no disclosed gross margin, churn, net revenue retention, customer
      acquisition cost, lifetime value, or CAC payback. The workload-based model should create
      recurring expansion when customer cloud estates grow, but this is a mechanism hypothesis,
      not evidence of realized retention economics. Orca's homepage markets a representative
      customer's 198% return on investment and $1.5 million of annual operating savings; those are
      buyer-value claims, not Orca revenue, gross profit, or independently verified unit economics.
      A direct-sales enterprise motion, partner incentives, cloud-data processing, support, and
      product development may all affect margins, but the available pool does not quantify any of
      those costs. Diligence must therefore begin with cohort and cost schedules, not modeled
      precision.
    claimRefs: [CI008, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Public financing evidence is historical rather than a current liquidity statement. Tracxn
      reports $640 million of cumulative funding and a $1.8 billion valuation, while Orca's own
      earlier financing release and Tracxn corroborate a $210 million Series C at a $1.2 billion
      valuation. UpMarket now says it cannot confirm Orca's valuation from two independent
      reputable sources. None of these figures establishes cash on hand: cumulative capital raised
      is not cash available after years of operating expenditure, acquisitions, or employee
      liquidity. With no current cash balance, debt schedule, operating loss, burn, or runway,
      capital adequacy and the next financing trigger are not underwriteable. The financial verdict
      is therefore positive on monetization mechanics and enterprise expansion potential, but low
      confidence on revenue scale, margin path, efficiency, and financing dependency.
    claimRefs: [CI001, CI002, CI003, CI004, CI013, CI014]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The reported $640 million cumulative raise cannot be treated as current liquidity. Obtain a
      month-end cash bridge, debt and preference schedules, and a board-approved operating plan
      before drawing any conclusion about runway or financing needs.
    claimRefs: [CI001, CI014]
tables:
  - id: TI001
    title: Revenue streams and expansion mechanisms
    columns:
      - Stream
      - Mechanism
      - Billing unit
      - Public status
      - Evidence quality
      - Diligence ask
    rows:
      - ["Core cloud-security subscription", "Annual SaaS access linked to protected cloud scale", "Workload / cloud size", "CEO-confirmed mechanism; revenue mix undisclosed", "Medium", "Contract schedule by workload band, term, and cohort"]
      - ["Newer product licenses", "Additional products can use seat-based licenses", "Seat", "CEO confirms a few seat-based licenses; product mix undisclosed", "Medium", "SKU-level bookings, seats, attach rate, and renewal terms"]
      - ["Workload expansion", "Customer cloud growth can increase the licensed workload base", "Incremental protected workload", "Mechanism confirmed; no cohort expansion rate", "Medium", "Workload growth, price realization, and NRR by cohort"]
      - ["Product expansion", "Cross-sell modules not included in the initial offering", "Module / product license", "One $300,000-to-$2.6 million example; not representative", "Low", "Distribution of expansion sizes and concentration by account"]
      - ["Partner-assisted sales", "Partners supported across new business, expansion, and retention", "Undisclosed", "Current program exists; partner-sourced mix is unavailable", "Low", "Partner bookings, discounts, commissions, and renewal ownership"]
    notes: >-
      Mechanisms are based on management interview and company-issued program materials; revenue
      mix, realized prices, discounts, recognition terms, and partner economics are not public.
    claimRefs: [CI008, CI009, CI012, CI016]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Price or unit
      - Public evidence
      - List versus realized
      - Confidence
      - Underwriting implication
    rows:
      - ["Protected workload / cloud size", "CEO says the core offering is sold based on workload", "Mechanism only; no price curve", "Medium", "Expansion can follow cloud growth, but price realization is unknown"]
      - ["Seats for selected newer products", "CEO says a few newer-product licenses are seat-based", "Mechanism only", "Medium", "Adds a second expansion vector without proving revenue mix"]
      - ["$50,000 annual starting price", "Reported by Sacra for basic workload scanning", "Third-party list-price report", "Low", "Do not treat as booked ACV without contracts or an official price card"]
      - ["$7,000-$30,000 monthly for AWS deployments", "Reported by Sacra across starter-to-large deployments", "Third-party range; packaging and vintage unclear", "Low", "Requires current SKU, workload denominator, and discount schedule"]
      - ["Above six figures", "GetLatka reports ACV above six figures from its CEO interview", "Directional; no distribution", "Medium", "Supports enterprise positioning, not average or median ACV"]
      - ["$300,000 to $2.6 million expansion", "CEO-provided single-account example", "Realized example; not a cohort statistic", "Medium", "Shows upside tail but may overstate typical expansion"]
    notes: >-
      No official price card or contract sample was available; Sacra figures are third-party
      reports, and the single expansion example must not be generalized across the customer base.
    claimRefs: [CI008, CI010, CI011, CI012]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["2024 annual revenue / ARR", "$64.2M estimate with conflicting revenue-versus-ARR labels", "Low", "Cannot anchor growth or valuation while the metric is inconsistently defined", "Audited revenue and ARR bridge by period"]
      - ["Customers", "More than 1,000, company-claimed", "Medium", "Provides scale context but no concentration or cohort quality", "Customer count definition, top-10 share, and cohort schedule"]
      - ["Gross margin", null, "Unavailable", "Determines SaaS quality and service-delivery burden", "GAAP gross margin and hosting/support cost bridge"]
      - ["NRR / GRR / churn", null, "Unavailable", "Tests workload and product expansion against losses", "Dollar and logo retention by annual cohort"]
      - ["CAC / sales efficiency / payback", null, "Unavailable", "Enterprise ACV alone does not establish efficient growth", "Fully loaded CAC, magic number, and payback by channel"]
      - ["Operating loss / cash burn", null, "Unavailable", "Funding raised does not reveal ongoing financing dependency", "Monthly operating cash flow and burn bridge for 24 months"]
      - ["Cash / debt / runway", null, "Unavailable", "Required to assess capital adequacy and next-round timing", "Month-end cash, debt terms, restricted cash, and downside runway"]
    notes: >-
      Null means the assigned public evidence did not disclose the metric. The $64.2 million figure
      is an external estimate whose source alternates between annual revenue and ARR and says it is
      not CEO-confirmed.
    claimRefs: [CI005, CI006, CI007, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the path from customer cloud activity to subscription expansion,
      while realized recurring revenue and gross profit remain undisclosed.
    data:
      nodes:
        - id: customer-cloud-estate
          label: Customer cloud estate
          detail: Enterprise and mid-enterprise customers operate public-cloud workloads.
        - id: workload-subscription
          label: Workload subscription
          detail: Core pricing scales with the size of the protected cloud environment.
        - id: seat-add-ons
          label: Seat-based add-ons
          detail: Selected newer products add a seat-based license vector.
        - id: partner-expansion
          label: Partner-led expansion
          detail: The 2026 partner program targets new business, expansion, and net retention.
        - id: recurring-revenue
          label: Recurring revenue
          detail: Current revenue and ARR are not consistently disclosed or confirmed.
        - id: gross-profit
          label: Gross profit
          detail: Gross margin and service-delivery costs are unavailable.
      edges:
        - from: customer-cloud-estate
          to: workload-subscription
        - from: customer-cloud-estate
          to: seat-add-ons
        - from: workload-subscription
          to: recurring-revenue
        - from: seat-add-ons
          to: recurring-revenue
        - from: partner-expansion
          to: recurring-revenue
        - from: recurring-revenue
          to: gross-profit
    approximationNotes: >-
      The flow is qualitative; it does not imply disclosed conversion rates, revenue mix, or gross
      margin.
    claimRefs: [CI008, CI012, CI014, CI016]
