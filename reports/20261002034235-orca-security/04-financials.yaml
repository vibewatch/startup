  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash, restricted cash, debt, monthly burn, operating plan, and downside runway.
      whyItMatters: Cumulative funding raised cannot establish cash available or the timing and terms of a next financing.
      diligencePath: Obtain the latest board package, bank statements, debt agreements, and a 24-month monthly cash forecast.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: revenue
      missingEvidence: Audited revenue and ARR schedules using consistent definitions for 2023 through 2026.
      whyItMatters: The public $64.2 million estimate is alternately labeled revenue and ARR and was not confirmed by management.
      diligencePath: Reconcile GAAP revenue, ending ARR, bookings, deferred revenue, and remaining performance obligations by quarter.
      relatedQuestionRefs: [QI005, QI007]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, hosting and support costs, CAC, payback, LTV, NRR, GRR, and logo churn by cohort.
      whyItMatters: Enterprise contract scale and one large expansion do not establish repeatable or profitable growth.
      diligencePath: Review audited financials and cohort-level unit-economics schedules with finance and revenue operations.
      relatedQuestionRefs: [QI003, QI004, QI007]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Current SKU catalog, workload denominators, realized discounts, contract terms, and revenue mix by billing unit.
      whyItMatters: Third-party price points cannot establish realized pricing, revenue recognition, or expansion durability.
      diligencePath: Sample executed contracts and reconcile list price to bookings and recognized revenue by SKU.
      relatedQuestionRefs: [QI001, QI002]
      relatedTableRefs: [TI001, TI002]
    - type: missing-source
      severity: material
      topic: valuation
      missingEvidence: Current cap table, preference stack, secondary transaction evidence, and a recent independently supported valuation.
      whyItMatters: The historical $1.8 billion mark may not reflect current liquidation economics or dilution.
      diligencePath: Obtain the fully diluted cap table, financing documents, 409A reports, and recent secondary trade data.
      relatedQuestionRefs: [QI006, QI008]
