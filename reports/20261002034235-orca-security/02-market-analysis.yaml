company:
  name: "Orca Security"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Orca participates in a consolidating CNAPP market, but the assigned evidence supports only
    broad cloud-security forecasts, not a defensible company-specific SAM or SOM. Adoption is
    helped by agentless deployment and new channel programs, while pricing opacity, alert tuning,
    category bundling, and unverified budget ownership constrain confidence in market capture.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The relevant core market is CNAPP software that brings cloud posture, workload, identity,
      data, compliance, application, and increasingly AI-security signals into one operating view.
      Orca describes that broad bundle on its own site, while a low-reputation comparison publisher
      observes that major vendors no longer sell posture management as an isolated category. This
      boundary should exclude dedicated endpoint security, stand-alone vulnerability scanners,
      web-application firewalls, external third-party risk scoring, and general AI infrastructure
      spend unless those capabilities are purchased as part of the cloud-security platform.
      Status-quo substitutes include native cloud-provider controls, point tools, manual review,
      and accepting fragmented coverage. The practical market is therefore narrower than every
      dollar labelled cloud security: it is the spend a buyer can consolidate into a CNAPP without
      retaining those adjacent tools or preferring native controls.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM005"
      - "CM014"
      - "CM015"
    tableRefs:
      - "TM001"
  - id: "sizing-evidence"
    title: "Sizing evidence and denominator risk"
    body: >-
      Public sizing evidence is internally divergent. Orca cites a forecast of $46.16 billion for
      global cloud security in 2026 and $133.39 billion in 2035, but the fetched page does not name
      the underlying publisher or disclose the model. Sacra separately estimates $77 billion in
      2026 and identifies API security as a greater-than-$10-billion adjacency by 2032 at a 28%
      CAGR. The two 2026 estimates differ by $30.84 billion, or roughly two-thirds of the lower
      figure, and cannot be reconciled from the visible methodologies. Neither source isolates
      CNAPP software, Orca's target geographies, qualifying workloads, or obtainable share. These
      numbers are useful as scenario boundaries, not as a valuation-ready TAM/SAM/SOM chain.
      Underwriting should keep company-specific SAM and SOM unquantified until consistent market
      definitions, customer counts, workload volumes, pricing, and win rates are available.
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyer workflow, adoption path, and distribution"
    body: >-
      The evidence identifies users and commercial routes more clearly than it identifies the
      economic buyer. G2 reviews describe enterprise practitioners using Orca to prioritize cloud,
      data, identity, and AI-agent risks, while the company positions the platform for security,
      developer, and operational workflows across code, cloud, runtime, and AI. Public sources do
      not establish which executive budget owns each deployment, so the table marks payer and
      budget ownership as diligence items rather than presenting conventional CISO ownership as
      fact. Adoption can start with a read-only connection and a company-claimed scan in hours,
      followed by tuning and integration into existing workflows. Commercially, Orca announced a
      North American distribution-led model with TD SYNNEX and a global partner program intended
      to support procurement, enablement, expansion, and retention through channel partners.
    claimRefs:
      - "CM008"
      - "CM009"
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM015"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-valuation"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Demand is supported by expanding cloud estates, the bundling of multiple security jobs into
      CNAPP, and new AI-related assets that must be discovered and governed. Orca's agentless
      architecture and company-claimed hours-to-visibility reduce initial deployment friction, and
      G2's page displays a one-month implementation average and eight-month return-on-investment
      average based on user reviews. Those are directional platform signals, not audited economic
      outcomes. Constraints remain material: reviewers report that initial alert volume can require
      tuning, no compared vendor publishes a rate card, Sacra's visible pricing estimate is undated,
      and category consolidation gives buyers credible alternatives. The valuation implication is
      to avoid applying a broad-market multiple to the $46.16-billion or $77-billion figures.
      Market capture should instead be tested against cohort retention, verified contract values,
      workload expansion, channel-sourced pipeline, competitive win rates, and independently
      measured implementation economics.
    claimRefs:
      - "CM002"
      - "CM006"
      - "CM007"
      - "CM009"
      - "CM010"
      - "CM011"
      - "CM013"
      - "CM016"
