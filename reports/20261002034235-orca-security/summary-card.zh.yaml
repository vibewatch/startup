  topStrengths:
    - SideScanning 无代理技术降低了部署门槛，拓宽了云环境可见性。
    - 以工作负载为主的计价模式配合少量按席位计费的增值模块，提供了持续增购路径。
    - 公司客户数已达 1,000+ 家，并持续借助合作伙伴拓展业务。
  topRisks:
    - 收入、毛利率、烧钱速度与现金跑道均未披露，或公开数据前后矛盾。
    - 面对 Wiz 的竞争压力与云厂商原生安全方案的打包捆绑，产品定价或面临挤压。
    - 在缺乏更明确财务证据支撑的情况下，历史 $1.8B 估值难以为继。
  unresolvedGaps:
    - 经审计的合并财务数据（ARR、收入增速、毛利率、营业亏损、现金跑道）均未公开。
    - 在公开记录之外的法庭文件披露前，与 Wiz 的商业秘密诉讼结果及潜在赔偿总额仍无法量化。
    - Series C 轮后的股权结构表、优先股堆叠与清算分配顺序均未披露，投资人保护条款未知。
    - 客户留存指标（NRR、GRR、流失率）与增购收入动能均未公开披露。
    - 2022 年融资高峰后的管理层稳定性，以及裁员、冻结招聘等任何降本举措，均缺乏充分的公开记录。
