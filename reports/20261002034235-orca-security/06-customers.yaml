  title: "Customers"
  summary: "Orca Security protects multicloud workloads across more than 1,000 enterprise accounts, driving land-and-expand monetization that scales six-figure commitments into multi-million-dollar annual contracts. While verified production customers including Databricks, BeyondTrust, and Druva validate zero-friction agentless adoption, customer retention and concentration metrics remain guarded private disclosures subject to competitive displacement pressure."
sections:
  - id: "customer-segmentation-and-buyer-personas"
    title: "Customer Base Segmentation and Enterprise Buying Personas"
    body: "Orca Security segments its commercial customer base across mid-market and global enterprise organizations operating complex multi-cloud workloads across Amazon Web Services, Microsoft Azure, Google Cloud Platform, and Oracle Cloud Infrastructure. Enterprise buyer personas divide primarily between Chief Information Security Officers (CISOs), who prioritize unified attack-path context and compliance governance, and Vice Presidents of Cloud Engineering or DevOps leads, who demand zero deployment friction and zero host agent performance penalties. Strategic account profiles are categorized into high-velocity cloud-native technology companies, regulated financial technology organizations requiring strict compliance audits, and federal government entities operating under stringent FedRAMP authorization boundaries. Orca's technical pre-sales and sales engineering teams utilize deal intelligence automation platforms like Opine to track opportunity pipelines and streamline post-sales onboarding handoffs. While commercial packaging establishes entry commitments at approximately $50,000 annually, target enterprise buyers regularly commit to multi-year contracts with six-figure annual contract values."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-land-expand-dynamics"
    title: "Customer Adoption Trajectory, Scale, and Contract Expansion"
    body: "Orca's customer adoption trajectory exhibits rapid multi-stage expansion from its initial founding in 2019 through hypergrowth sparked by widespread cloud vulnerability events. Following early seed validation, Orca broke one million dollars in revenue in early 2020 and achieved greater than 1,000 percent year-over-year revenue expansion between 2020 and 2021, fueled by urgent enterprise demand for complete workload visibility during the industry-wide Log4j security crisis. By late 2026, Orca reported active customer scale exceeding 1,000 organizations, supported by an expanding enterprise land-and-expand dynamic where protected cloud workload expansion and newly introduced platform modules drive dramatic contract value growth. In an illustrative top-tier account expansion cited by CEO Gil Geron in 2026, a single enterprise account expanded from an initial $300,000 annualized commitment into a $2.6 million annual contract. However, because comprehensive customer counts and net retention rates are guarded private metrics, the company's true cohort-level expansion velocity cannot be audited externally."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU002"
  - id: "named-deployments-and-retention-risks"
    title: "Named Customer Proof, Production Deployments, and Retention Vulnerabilities"
    body: "Named customer production proof spans prominent enterprise technology and software companies that publicly confirm Orca's agentless deployment benefits over legacy host agent architectures. Vice President of Information Security at Databricks, Caleb Sima, publicly validated that Orca delivers capabilities comparable to on-box agents without engineering friction, while BeyondTrust Chief Technology and Security Officer Morey Haber verified rapid full-estate rollout within two months protecting more than 4,000 cloud customers. Similarly, Drew Daniels, CIO and CISO at Druva, confirmed Orca achieved 100 percent multicloud coverage across thousands of hourly scaling cycles without burdening DevOps teams. In regulated federal sectors, Orca maintains dedicated GovCloud infrastructure across AWS and Azure meeting NIST SP 800-53 standards. Despite these marquee endorsements, Orca faces critical customer retention vulnerabilities: net revenue retention (NRR), gross retention rates (GRR), and customer churn percentages remain unconfirmed, leaving enterprise diligence exposed to potential account churn driven by aggressive competitive displacement from Wiz and bundled hyperscaler security suites."
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
callouts:
  - calloutType: "strength"
    title: "Agentless Architecture Drives Rapid Enterprise Adoption"
    body: "Orca's primary commercial asset in winning customer accounts is the operational elimination of host agents. Enterprise security and DevOps leaders at organizations like BeyondTrust and Databricks confirm achieving complete cloud estate visibility within weeks, bypassing traditional DevOps ticketing and runtime performance degradation."
    claimRefs:
      - "CU001"
      - "CU013"
      - "CU014"
  - calloutType: "risk"
    title: "Private Disclosures Mask Retention and Churn Exposure"
    body: "While Orca reports scaling past 1,000 accounts and expanding individual contracts up to $2.6 million, the company does not publicly disclose audited net revenue retention (NRR), gross retention (GRR), or customer churn metrics, creating critical underwriting uncertainty regarding contract durability against aggressive competitor discounting."
    claimRefs:
      - "CU010"
      - "CU012"
      - "CU016"
