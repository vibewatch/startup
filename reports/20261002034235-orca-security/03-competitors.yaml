      - "CP004"
      - "CP008"
  - calloutType: "insight"
    title: "SideScanning Defense in the Agentless Commoditization Era"
    body: "As basic agentless API configuration checks become commoditized across CSPM vendors and native cloud providers, Orca's patented SideScanning technology provides a differentiated layer of defensibility by extracting OS-level vulnerability, malware, and secret findings directly from block storage snapshots without agents, bridging the gap between shallow API posture checks and burdensome agent deployments."
    claimRefs:
      - "CP001"
      - "CP007"
      - "CP016"
