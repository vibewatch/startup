    title: "Wiz Market Momentum and Google Cloud Synergies"
    body: "Wiz continues to represent Orca's most formidable commercial headwind. With market-leading brand recognition and visual attack-path graph capabilities, Wiz has captured significant enterprise mindshare. Furthermore, Wiz's backing by Google Cloud introduces hyperscaler balance-sheet strength and potential GCP bundling advantages, raising the barrier for independent alternatives like Orca to defend large multi-cloud RFPs."
    claimRefs:
