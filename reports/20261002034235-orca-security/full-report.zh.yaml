      - number: '3.2'
        title: 能力与技术架构差异化
        blocks:
          - type: paragraph
            body: >-
              各家架构路线的差异，决定了部署摩擦与检测深度之间的取舍。Orca 的 SideScanning 依靠读取工作负载存储快照，无需运行 agent 或消耗 CPU 资源，即可在 24 小时内完成 AWS、Azure
              与 Google Cloud 的接入。Wiz 同样秉持无代理、态势优先理念，其攻击路径可视化图谱极大降低了非专业人员理解风险的沟通成本。相比之下，Palo Alto Networks Prisma Cloud 和
              CrowdStrike Falcon 等平台采用混合模式，将无代理扫描与基于主机的高性能 agent 结合以实现深度运行时防御，但也带来了部署运维负担。新兴聚焦型工具如 Plerion 运用数学精度建模 AWS
              IAM 实际权限，能精准解析权限边界与服务控制策略（SCP），规避了传统 CSPM 常见的误报问题。但在覆盖 DSPM、CDR 与容器安全的多产品套件整合度上，Orca 相比单点工具具备更强的整合杠杆。
            claimRefs:
