  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: SideScanning 架构与带外工作负载检查
        blocks:
          - type: paragraph
            body: >-
              Orca Security 运营着一套无代理云原生应用保护平台，旨在解决传统主机 agent 架构固有的运维覆盖阻力与告警疲劳。该平台完全借助只读云厂商 API 接入公有云环境——涵盖 Amazon Web
              Services、Google Cloud Platform 与 Microsoft Azure，无需在客户生产环境的虚拟机或容器内运行监控进程、内核驱动或 sidecar。工作负载发现与深度核查通过 Orca
              的专利 SideScanning 机制带外执行。在该模式下，采集器调用云 API
              对工作负载的运行时块存储卷创建只读快照，在旁路分析操作系统配置、已装软件包、漏洞画像、泄露密钥、活跃恶意软件与敏感数据暴露情况，不耗费宿主机的
              CPU、内存或网络带宽。该架构消除了运行时稳定性隐患，避免了临时自动伸缩组部署过程中的 DevOps 摩擦，使企业得以在 24 小时内获得多云资产的全域可见性。
            claimRefs:
