  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场分类与竞争全景
        blocks:
          - type: paragraph
            body: >-
              云安全态势管理（CSPM）及更广泛的 CNAPP 竞争版图分为四大阵营：云原生无代理创新厂商、传统安全平台巨头、行为运行时专家以及垂直领域新兴挑战者。Orca 开创了无代理 SideScanning
              架构，通过云厂商只读 API 带外读取云端配置与工作负载块存储。Wiz 则成为 Orca 的头号正面对手，凭借极快的大型企业销售打法、直观的攻击路径可视化图谱，以及被 Google Cloud
              收购后获得的超大规模云厂商后盾迅速崛起。Palo Alto Networks（Prisma Cloud）和 CrowdStrike（Falcon Cloud
              Security）等老牌巨头，则依靠跨端点、网络与云环境的企业级一体化整合打法予以反击。垂直新秀如 Plerion 专攻 AWS IAM 细粒度策略分析等细分技术场景；行为分析厂商如 Lacework（已被
              Fortinet 收购）则提供基于机器学习的运行时异常检测。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
