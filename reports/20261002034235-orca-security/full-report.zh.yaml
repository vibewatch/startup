      - number: '1.2'
        title: 创始人、管理层交接与治理架构
        blocks:
          - type: paragraph
            body: >-
              Orca Security 由 8 位 Check Point Software Technologies 前员工联合创立，团队在网络安全、威胁研究和企业级基础设施领域具备突出的创始团队与市场契合度。联合创始人
              Avi Shua 曾任 Check Point 首席技术专家，是以色列国防军 8200 部队退伍老兵，2019 至 2023 年间担任创始
              CEO，带领公司走过从种子轮到独角兽的高速成长期，随后转任首席创新官。联合创始人 Gil Geron 自创立之初即以 CPO 身份统领产品与工程，2023 年接替 Shua 出任
              CEO，主抓全球大型企业扩张与产品落地。随后，公司陆续引入多位企业安全高管充实管理层，包括首席营收官 Raf Chiodo（曾任职 Lacework 与 EMC）、首席产品官 Gera Dorfman（Check
              Point 20 年工程老将）、首席财务官 Oded Edri（曾任 Payoneer 首席会计官并主导其上市），以及首席营销官 Rachel Nislick（曾任职 Darktrace、Mimecast 与
              Veracode）。尽管 Shua 与 Geron 的交接平稳落地，但在高度内卷的市场环境下，Orca 的核心治理仍高度依赖早期 Check Point 班底，存在关键人集中风险。
