            body: >-
              Orca 稳步拓宽平台覆盖边界，从基础的云安全态势管理（CSPM）与云工作负载保护（CWPP），向云基础设施授权管理（CIEM）、Kubernetes 态势管理、数据安全态势管理（DSPM）以及 AI
              安全延伸。顺应企业普遍拥抱生成式开发环境的趋势，Orca 推出了 AI AppGen Security，用于排查影子 AI 工具、外部 SaaS 依赖项以及内部大语言模型 agent 框架。在 Google
              Cloud 生态中，Orca 与 Chronicle、Security Command Center、Gemini Enterprise Agent Platform 以及逾百项云服务实现深度集成；在 AWS
              生态中，则为 Amazon Elastic Kubernetes Service 工作负载与 IAM 策略提供深度上下文关联。在交付环节，Orca 携手 CloudZone 等合作伙伴设计了自动化 SaaS
              接入架构，将手工开通租户的工作量压降九成，并依托定制化 AI 赋能工作流支持大型企业合作伙伴生态。
