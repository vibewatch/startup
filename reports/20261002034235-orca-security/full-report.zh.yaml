  - id: FE001
    title: 产品架构图
    type: stack
    summary: Orca Cloud Security Platform 架构分层，涵盖云集成、SideScanning 检测、图分析关联与风险呈现。
    data:
      layers:
        - label: 展现与管理层报告层
          detail: Orca 统一仪表盘、合规报告与高管可见性评分。
          modules:
            - 高管可见性仪表盘
            - 持续合规引擎
        - label: 修复与生态工作流层
          detail: 自动化修复工单分发、Slack/Jira 集成与 AI AppGen Security 安全管理。
          modules:
            - AI AppGen 安全管理器
            - 工作流告警与工单分发
        - label: 图分析与攻击路径引擎
          detail: 基于 Amazon Neptune 图建模，评估高危风险组合、资产暴露面与横向移动路径。
          modules:
            - Amazon Neptune 图引擎
            - 双向路径遍历求解器
        - label: 数据库性能与多租户层
          detail: Gremlin 批量写入批处理、LRU 内存缓存以及租户分区策略。
          modules:
            - Gremlin 分区策略管理器
            - 内存 LRU 节点缓存
        - label: 带外 SideScanning 检测引擎
          detail: 专利 SideScanning 块存储分析技术，无需主机代理即可检测操作系统与文件系统。
          modules:
            - 运行时快照控制器
            - 深度工作负载漏洞与密钥扫描器
        - label: 云控制面与 API 接入层
          detail: 接入 AWS、GCP 和 Azure 的只读云控制面 API，支持自动化接入。
          modules:
            - 多云只读 API 接入
            - CloudZone 自动化租户配置流程
    notes: 分层模型展示了工作负载检测与客体操作系统的解耦设计，并由 Neptune 图分析提供支撑。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE007
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 梳理企业客户全生命周期：从最初的无代理接入，到增购扩张飞轮，再到潜在的竞品流失风险。
    data:
      nodes:
        - label: 阶段 1：无代理发现与评估
          detail: 接入只读云 API；无需主机代理即可在 24 小时内完成 100% 资产盘点。
          touchpoints:
            - Read-only AWS/Azure/GCP API role configuration
            - Automated cloud snapshot inventory scan
            - Initial attack-path graph generation
        - label: 阶段 2：态势整合与生产环境上线
          detail: 修复关键高危风险组合，淘汰传统碎片化单一工具。
          touchpoints:
            - Triaging prioritized attack paths to crown jewels
            - Replacing standalone CSPM and vulnerability point scanners
            - Slack and Jira alerting integration with DevOps workflows
        - label: 阶段 3：工作负载与多模块增购
          detail: 扩大受保护工作负载规模，交叉销售 DSPM、CIEM、Kubernetes 与 AI AppGen。
          touchpoints:
            - Expanding coverage across newly provisioned cloud accounts
            - Adding AI AppGen Security to discover shadow AI models
            - Annual contract expansion from six figures to multi-million tiers
        - label: 阶段 4：合同续约与防流失壁垒
          detail: 抵御来自 Wiz 及云厂商原生安全套件的竞品替换。
          touchpoints:
            - Evaluating annual workload licensing costs
            - Benchmarking runtime threat detection against hybrid agents
            - Partner POD Program net retention support
        - label: 阶段 5：联邦与受监管行业合规治理
          detail: 部署符合 NIST SP 800-53 安全控制要求的 GovCloud 专属边界实例。
          touchpoints:
            - Isolated AWS GovCloud and Azure Government tenant configuration
            - Continuous compliance evidence generation for FedRAMP assessments
            - High-assurance federal personnel screening and access boundary audit
        - label: 阶段 6：渠道生态与合作伙伴联合销售
          detail: 借助 Partner POD 计划与 AI 驱动的 Partner Success Platform 实现联合交付。
          touchpoints:
            - Automated deal pipeline qualification via partner demand center
            - Shared post-sales customer success enablement templates
            - Channel reseller margin alignment for multi-year customer renewals
    notes: 展现企业客户各采纳阶段，突出低门槛接入路径及后续多模块合同增购动态。
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU009
      - CU010
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 从发生可能性与严重程度两个维度评估 Orca Security 核心已识别风险的矩阵。
    data:
      columns:
        - 轻微
        - 中等
        - 严重
      rows:
        - label: 发生可能性：极高
          values:
            - label: 市场炒作周期转向
              score: 2
              note: 安全采购方关注点转向一体化整合平台套件
            - label: 竞争对手激进价格战
              score: 6
              note: 来自 Wiz 及主流 CNAPP 厂商的降价折让压力
            - label: 无代理技术同质化
              score: 9
              note: 云厂商快照能力被竞品广泛复制
        - label: 发生可能性：高
          values:
            - label: 告警数量噪点过高
              score: 3
              note: 初次扫描告警噪点需要客户人工调优策略
            - label: API 运行时盲区
              score: 8
              note: 缺少内联插桩机制，难以捕获动态运行时攻击
            - label: 底层虚拟化管理程序 API 依赖
              score: 9
              note: 完全依赖 AWS、Azure 和 GCP 的底层快照基础设施
        - label: 发生可能性：中
          values:
            - label: 初始上手阻力
              score: 2
              note: 产品复杂度较高，轻量团队上手开销大
            - label: 云市场抽成挤压利润空间
              score: 5
              note: 深度依赖 AWS Marketplace 采购与服务通道费
            - label: 监管合规罚款
              score: 7
              note: 客户在 GDPR 与 PCI-DSS 合规审计中面临风险敞口
        - label: 发生可能性：低
          values:
            - label: 部分 UI 体验细节欠缺
              score: 1
              note: 仪表盘过滤与自定义报表等功能诉求
            - label: 渠道合作伙伴流失
              score: 4
              note: 依托 Partner POD 计划应对分销渠道变动
            - label: SaaS 多租户数据泄露
              score: 8
              note: 集中式 SaaS 处理环境一旦失陷将引发灾难性后果
        - label: 发生可能性：极低
          values:
            - label: 主要云厂商核心服务宕机
              score: 1
              note: 全球主要云厂商同时发生大范围瘫痪
            - label: 开源安全工具颠覆
              score: 4
              note: 免费社区级态势管理工具分流企业级付费需求
            - label: 核心专利遭灾难性无效
              score: 9
              note: USPTO 专利复审程序导致 SideScanning 核心专利全部无效
        - label: 发生可能性：理论层面
          values:
            - label: 云迁移趋势彻底逆转
              score: 1
              note: 大批企业将工作负载从云端大举迁回本地数据中心
            - label: 全球遥测数据禁令
              score: 5
              note: 极端的数据主权法律全面禁止带外快照分析
            - label: 虚拟化平台直接封禁
              score: 9
              note: 主流云厂商禁止第三方安全厂商调用只读 API
    approximationNotes: 可能性与影响评分综合了独立评估、客户反馈以及厂商架构分析。
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR008
