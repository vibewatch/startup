        title: 买方工作流、采纳路径与分销模式
        blocks:
          - type: paragraph
            body: >-
              现有证据对使用者画像与商业路径的阐述，比对实际买单人更为明晰。G2 评价显示企业一线人员使用 Orca 对云、数据、身份与 AI agent 风险进行优先级排序；公司则将平台定位于覆盖代码、云端、运行时与 AI
              的安全、开发及运维全流程。公开资料无法确认每一单采购究竟出自哪位高管的预算，因此本报告将付款方与预算归属列为待核实尽调事项，而非直接套用常规的 CISO
              买单假设。采纳流程通常始于接入只读连接，并在数小时内完成公司自述的扫描检测，随后进行告警调优并打通既有工作流。商业化方面，Orca 宣布在北美携手 TD SYNNEX
              推行总代分销模式，并推出全球合作伙伴计划，旨在依靠渠道商承接采购、赋能、增购与留存。
