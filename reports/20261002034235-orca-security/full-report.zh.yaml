  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              该标的核心目标市场是 CNAPP 软件，即将云态势、工作负载、身份、数据、合规、应用以及日趋重要的 AI 安全信号聚合至统一运营视图。Orca
              在官网上强调这套全功能套件，而某评测机构亦指出主流厂商已不再将态势管理单独打包出售。测算边界应当剔除独立终端安全、单点漏洞扫描、Web 应用防火墙、外部第三方风险评分以及通用 AI
              基础设施支出，除非客户直接作为云安全平台的一部分采购相关功能。现状替代方案包括云厂商原生控制台、单点工具、人工排查或被动容忍零散覆盖。实际可争夺的市场远比冠以“云安全”标签的所有支出更窄：它仅涵盖买方在无需保留周边工具或原生控制台的前提下，愿意整合进
              CNAPP 的预算。
