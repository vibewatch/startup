      - number: '7.3'
        title: 合作伙伴集中度与财务可持续性
        blocks:
          - type: paragraph
            body: >
              技术架构与商业拓展两端，Orca 均对主流云底座及分销渠道表现出极高的依赖度。技术上，Orca 的 SideScanning 机制完全受制于 AWS、Microsoft Azure 和 Google Cloud
              Platform 的只读 API 与快照功能；云厂商对底层 API 的破坏性改动、限流策略或快照权限调整，都会直接削弱扫描吞吐能力。商业上，Orca 的大客户交易极度仰赖 AWS Marketplace
              等云市场，并依赖 TD SYNNEX 等分销总代开拓全球渠道触达。财务上，Orca 仍为非上市私有企业，自以 $1.2 billion 估值完成 $210 million C
              轮融资以来，未披露公开审计文件以说明年经常性收入（ARR）、毛利率、烧钱速度或现金跑道，在网络安全行业并购整合的大背景下，后期股权持有者暴露于估值乘数压缩与潜在下调估值重组的风险之中。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
