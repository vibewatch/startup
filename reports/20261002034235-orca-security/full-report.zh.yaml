        - 专利 SideScanning 技术无需代理即可在 AWS、Azure 和 GCP 间实现无摩擦的带外可见性
        - 无代理检测正面临来自超大规模云厂商原生安全工具与竞对 CNAPP 的功能同质化挤压
        - 云厂商合作采用指标以及无代理环境下的独立客户留存数据
      - - GTM 与业务扩张
        - 借助合作伙伴渠道与直销标杆客户，已覆盖 4,000+ 受保护账户
        - 高企的获客成本以及 Partner POD 计划的分成模式侵蚀了毛利率
        - 经核实的净留存率（NRR）报告以及经审计的软件毛利率数据
      - - 资本与估值
        - 截至 Series C 轮累计近 $300M 的大额早期融资，为技术研发提供了资金跑道并树立了企业信誉
        - 2021 年底 $1.8B 的历史高点估值在老股市场面临折价，Forge 平台上甚至缺乏有效报价
        - 机构老股拍卖交易的撮合成交价，或经核实的新一轮融资投资意向书（term sheet）
      - - AI 安全演进
        - AI AppGen Security 与 Partner Success Platform 抓住了企业自建 AI 带来的新兴安全风险敞口
        - 相比核心 CNAPP，早期 AI 安全功能尚缺乏成熟的商业化变现验证
        - 来自 AI AppGen 的独立 ACV 贡献以及可验证的扩张增购率
    notes: 投资逻辑对比了自研技术架构优势与竞争动态，并揭示了未经证实的商业利润率风险。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: 估值情景分析
    columns:
      - 情景
      - 运营与市场假设
      - 隐含估值 / 回报逻辑
      - 核心风险与下行触发条件
      - 主观概率
    rows:
      - - 乐观情景
        - AI AppGen 采用加速，企业客户快速扩张，迎来并购溢价或技术整合机会
        - 参考优质云安全交易基准，估值回升至 $1.8B-$2.5B 区间
        - 企业 AI 落地不及预期，或超大规模云厂商进行平台化捆绑销售
        - 20%
      - - 基准情景
        - 企业客户稳步扩张，团队规模趋稳，实现中个位数至低双位数的温和增长
        - 隐含私募公允估值在 $800M 至 $1.1B 之间，反映当前 SaaS 估值倍数回归常态
        - 销售周期拉长，且 Partner POD 平台分成稀释利润空间
        - 50%
      - - 悲观情景
        - 面临来自 Wiz 与云厂商的价格战压力，中端市场客户流失，出现估值倒挂融资（down-round）或结构化资本重组
        - 估值下调至 $500M-$700M，沉重的优先权负担挤压普通股和期权持有方权益
        - 大客户流失、老股市场持续缺乏流动性，或触发优先清算权
        - 30%
    notes: 估值情景基于常态化企业软件估值倍数，并结合未经证实的非公开利润率及老股折价进行调整。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
      - CV014
figures:
  - id: FO001
    title: Orca Security 企业发展与融资里程碑时间线
    type: timeline
    summary: Orca Security 从 2019 年创立到 2026 年企业级扩张的历程回顾。
    data:
      items:
        - label: 2019 年创立与种子轮
          date: 2019-06
          detail: Avi Shua、Gil Geron 与 6 位 Check Point 前员工创立 Orca Security；获得 YL Ventures 领投的 $6.5M 种子轮融资。
          tone: positive
        - label: 2020 年收入里程碑
          date: 2020-03
          detail: 突破 $1M ARR 门槛；通过早期企业客户验证了无代理 SideScanning 技术。
          tone: positive
        - label: 2021 年 3 月 Series C 轮与独角兽地位
          date: 2021-03
          detail: 完成 CapitalG 与 Redpoint Ventures 领投的 $210M Series C 轮融资，跻身 $1.2B 估值。
          tone: positive
        - label: 2021 年 10 月 Series C 追加轮
          date: 2021-10
          detail: Series C 轮追加扩至 $550M，由 Temasek 领投，估值达 $1.8B；SAIC 和 Splunk Ventures 跟投。
          tone: positive
        - label: 2021 年 12 月 Log4j 需求暴增
          date: 2021-12
          detail: Log4j 零日漏洞催化安全需求；无代理扫描带动收入实现 12 倍增长。
          tone: positive
        - label: 2023 年管理层交接
          date: 2023-04
          detail: 联合创始人 Gil Geron 出任 CEO；创始 CEO Avi Shua 转任首席创新官。
          tone: neutral
        - label: 2025 年 Wiz 并购竞争冲击
          date: 2025-07
          detail: 竞对 Wiz 被 Google 以 $32B 收购；凸显出悬殊的估值落差与并购定价差距。
          tone: adverse
        - label: 2026 年 9 月 Partner POD 与 AI AppGen
          date: 2026-09
          detail: Orca 客户数突破 1,000 家，推出 AI AppGen Security 并启动 Partner POD 计划。
          tone: positive
    approximationNotes: 日期基于公开披露的融资轮次、产品发布以及高管任命公告。
    claimRefs:
      - CO001
      - CO005
      - CO008
      - CO009
      - CO011
      - CO014
      - CO015
      - CO016
  - id: FM001
    title: 受证据约束的市场规模分层
    type: pyramid
    summary: 从宽泛且相互冲突的云安全预测出发，公开证据逐步收敛，但具体到 Orca 的可服务市场与可获取市场仍未量化。
    data:
      nodes:
        - label: 宽泛云安全估算 A
          value: 46.16
          unit: USD billions
          detail: Orca 引用的 2026 年全球预测；原始发布方与测算方法未公开
        - label: 宽泛云安全估算 B
          value: 77
          unit: USD billions
          detail: Sacra 的 2026 年全球预测；获取的正文未显示测算方法
        - label: 长期预测终点
          value: 133.39
          unit: USD billions
          detail: Orca 引用的 2035 年全球预测；非当年市场规模
        - label: API 安全相邻市场
          value: 10
          unit: USD billions, greater than
          detail: Sacra 预测 2032 年复合年增长率（CAGR）为 28%；在缺乏重叠分析的情况下未纳入核心市场测算
        - label: Orca 可服务市场
          value: Not publicly quantified
          unit: null
          detail: 需要统一的统计口径、地域范围、工作负载量级及经核实的定价
        - label: Orca 可获取市场
          value: Not publicly quantified
          unit: null
          detail: 取决于赢单率、留存率、竞品替代以及渠道转化能力
    approximationNotes: 未做算术推算或隐式嵌套。数值节点沿用原始数据口径与年份；$10B API 规模为下限，缺失的 SAM/SOM 层仍为证据缺口。
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM006
      - CM013
      - CM016
  - id: FP001
    title: CNAPP 竞争定位矩阵
    type: quadrant
    summary: 从部署敏捷度与平台套件广度两个维度评估主流 CSPM 和 CNAPP 厂商。
    data:
      xAxis: 部署敏捷度与见效周期（从重代理到纯无代理）
      yAxis: 平台套件广度（从单一 CSPM 到完整 CNAPP/DSPM）
      points:
        - label: Orca Security
          x: 8.5
          'y': 8.2
          note: 无代理 SideScanning 技术的先行者，整合了 CSPM、CWPP、DSPM 与 AI AppGen 安全能力
        - label: Wiz
          x: 8.8
          'y': 8.8
          note: 赛道领跑者，具备极快的无代理部署速度与全面的安全图谱能力
        - label: Palo Alto Prisma Cloud
          x: 4.5
          'y': 9.2
          note: 整体安全套件最全面，但因混合代理架构导致交付上线较慢
        - label: CrowdStrike Falcon Cloud
          x: 5.2
          'y': 7.5
          note: 具备极强的运行时与终端协同能力，云安全态势管理深度正在扩展
        - label: Lacework (Fortinet)
          x: 5.8
          'y': 7
          note: 采用行为 Polygraph 模型，需要前期机器学习建立行为基线
        - label: Plerion
          x: 8
          'y': 5.2
          note: 快速无代理部署，重点聚焦 CSPM、CIEM 与攻击路径分析
    approximationNotes: 评分基于已审阅来源中对技术架构、部署摩擦及经核实套件能力的序数定位评估。
