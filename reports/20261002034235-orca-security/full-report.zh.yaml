      - number: '8.2'
        title: 情景分析、可比标的与逻辑破裂触发条件
        blocks:
          - type: paragraph
            body: >-
              推演 Orca Security 的远期情景，需要权衡其大客户业务势头与持续存在的成本结构风险。在基准情景下，Orca 依托全球合作伙伴网络与 AI 能力维持在先锋云上企业中的拓展，受到
              Databricks、Lemonade 及 BeyondTrust
              等早期标杆大客户采纳的支撑，同时持续扩充人员与技术运营团队。在悲观情景下，一级半市场流动性持续冻结，收购方与平台型巨头的替代挤压迫使其压降价格，公司不得不引入结构化融资，或以较 $1.8B 峰值折价 40% 至
              60% 的代价完成重组融资。相反，在乐观情景下，大型企业对多云安全与 AI
              治理的独立需求加速了传统巨头获取无代理能力的并购意向。核心逻辑破裂的触发条件包括：核心云客户发生重大流失、老股市场流动性进一步恶化，或高级清算优先权导致普通股遭受严重稀释。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
