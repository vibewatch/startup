      - number: '2.2'
        title: 市场测算证据与分母风险
        blocks:
          - type: paragraph
            body: >-
              公开市场测算证据存在内部矛盾。Orca 援引预测数据，称 2026 年全球云安全市场规模为 $46.16 billion、2035 年达 $133.39
              billion，但对应页面并未披露原始发布方或测算模型。Sacra 则单独给出 2026 年 $77 billion 的预测，并指出 API 安全到 2032 年将成为超过 $10-billion
              的相邻市场，复合年均增长率达 28%。两家对 2026 年的测算相差 $30.84 billion，差距约占较低口径的三分之二，从现有方法论中无法调和。两家来源均未单列 CNAPP 软件细分、Orca
              目标地域、有效工作负载规模或实际可获取份额。这些数据仅能作为情景上下限参考，无法构建严谨的 TAM/SAM/SOM
              估值推导链。在缺乏统一市场界定、客户数量、工作负载量级、客单价及赢单率之前，投资评估应审慎保留，暂不对 Orca 专属的 SAM 和 SOM 做定量推导。
