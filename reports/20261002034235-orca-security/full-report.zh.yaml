      - number: '3.3'
        title: 商业打包、切换成本与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              定价与采购机制对 Orca 而言既是机遇也是隐患。Orca 订阅费用按计算、数据与运行时环境中受保护的云工作负载资产规模计费，年费起步通常为 $50,000，大型企业客户年度合同价值（ACV）可达六位数美元。虽然
              Orca 常被定位为抗衡 Wiz 高价一客一价策略的性价比之选，但两者皆面临云厂商原生套件捆绑销售与老牌巨头整合打法的替代压力。在纯 CSPM 场景下，基于无代理 API
              接入的客户切换成本偏低；但当深度嵌入工单系统、定制化合规看板与多云攻击路径图谱模型后，壁垒会显著提升。Orca 的护城河核心在于其 SideScanning 专利组合、统一数据模型以及对 AI
              工作负载安全的快速覆盖；然而基础 API 态势扫描的日趋同质化，正迫使公司必须向运行时和身份治理持续投入研发。
