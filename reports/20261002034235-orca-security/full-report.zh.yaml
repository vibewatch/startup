      - number: '5.2'
        title: 基于图谱的上下文引擎与 Neptune 优化
        blocks:
          - type: paragraph
            body: >-
              Orca 平台的核心分析引擎依托统一数据模型，底层基于 Amazon Neptune 图数据库，将零散告警转化为富含上下文的攻击路径分析。Orca 的采集器并非孤立评估单个漏洞风险，而是从云厂商 API
              汇聚配置、安全组、路由表及身份权限数据，构建关联图谱以描绘资产连通性、公网暴露面与提权路径。针对复杂的客户拓扑结构与算力规模挑战，Orca 工程团队在 Neptune 内部实施了关键数据库优化，包括
              Gremlin 批量操作、建图阶段采用内存最近最少使用（LRU）节点缓存，以及面向 API 最短路径查询的双向并发图遍历。多租户隔离通过 Gremlin 的 PartitionStrategy
              实现，将分区键前置于分页标识符以确保严格的跨租户数据隔离。此外，针对负载均衡器的数据建模将后端目标组解耦为独立节点，大幅遏制了关系边膨胀，保障在复杂企业网络环境下达成亚秒级的暴露路径查询性能。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
