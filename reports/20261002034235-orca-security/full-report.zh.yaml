      - number: '8.3'
        title: 资本结构、一级半市场交易动态与尽调要求
        blocks:
          - type: paragraph
            body: >-
              一级半交易市场的冷清，折射出机构对后期网络安全公司股权结构表的顾虑与结构性不透明。Nasdaq Private Market
              等另类交易系统（ATS）运营商在严格的合格投资者准入门槛下撮合机构交易，老股交易受限且高度碎片化。与此同时，在各 pre-IPO
              融资平台上推广的员工期权转让方案，反映出早期员工对老股变现窗口的诉求日益迫切，但针对该公司的专属估值定价指数依然缺失。由于外部披露的融资里程碑未列明清算优先权倍数、清偿层级（seniority
              tiers）或参与分配上限（participation
              caps），在估值跌破前期峰值的并购退出情景下，机构投资者根本无法准确推算普通股的受偿金额。在敲定出资承诺前，核心尽调清单必须包含：经审计的股权结构表（cap
              table）、过去数期的总留存与净留存率，以及单客经济模型中的详细获客成本构成。
            claimRefs:
              - CV015
              - CV016
      - number: '8.4'
        title: 补充图表
        blocks:
          - type: callout
            title: 估值承压驱动的回避立场
            body: >-
              投资者应避免按其历史上 $1.8B 的 C 轮估值或接近该水平买入 Orca Security 股权。尽管 Orca 凭借 SideScanning 具备货真价实的产品创新力并拥有可观的客户群，但 Forge
              Global 上的二级交易指标显示市场缺乏有效报价且流动性枯竭，面临极高的下调估值融资（down-round）风险。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV013
          - type: callout
            title: 清算优先权与估值乘数挤压风险
            body: >-
              C 轮及后续追加轮累计吸纳了近 $300M 资金，Orca 的资本结构中大概率设有高额的清算优先权保护条款。若未来重组融资或老股流动性事件的定价跌破
              $1.2B-$1.8B，普通股股东与员工股权激励池将遭受不成比例的严重稀释。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV014
