            body: >
              Orca 身处严苛的监管合规环境中，全球跨国企业必须严格遵循 GDPR 与 PCI-DSS 等数据保护指令。虽然 Orca 的 SideScanning
              架构能对云资产开展深度合规审计，但若客户未能及时整改发现的错误配置，将面临极高的处罚风险——例如 GDPR 罚金最高可达 €20 million 或全球营业额的
              4%——这反过来加剧了买方对安全态势核验工具的追责与免责审视。此外，公司与 Wiz
              等竞对围绕无代理扫描技术存在持续的商业秘密诉讼与知识产权纠纷，带来了持续的诉讼抗辩开支、潜在的专利无效风险或商业禁令敞口，云采购方在选型阶段对此保持高度警惕。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 运维与技术架构失效模式
        blocks:
          - type: paragraph
            body: >
              相较于串联运行时 agent 与专用 API 网关，Orca 最核心的架构差异点——对云端块存储进行带外 SideScanning——带来了明显的工程边界。由于 Orca 依靠带外分析工作负载快照并在中心化
              SaaS 环境中处理遥测数据，它无法实时检查东西向网络流量、无法执行毫秒级自动化阻断，亦无法提供生产前左移行为测试。独立评测指出，Orca 的 API 洞察主要停留在表层，在微服务与合作伙伴 API
              场景存在明显盲区，除非搭配专用 API 防护工具，否则业务团队仍暴露在运行时漏洞利用风险中。运维层面，大型企业在初始快照阶段往往会涌现海量告警，导致研判疲劳，通常需要投入大量精力调优告警规则。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
