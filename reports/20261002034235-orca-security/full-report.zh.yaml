      - number: '1.3'
        title: 融资历程、投资方背景与业务体量指标
        blocks:
          - type: paragraph
            body: >-
              2019 年获得 YL Ventures 的 $6.5 million 种子轮投资后，Orca 展现出惊人的融资节奏。2021 年 3 月，公司完成由 Alphabet 旗下独立成长期基金 CapitalG 与
              Redpoint Ventures 领投的 $210 million C 轮融资，投后估值达 $1.2 billion，成立仅两年便跻身独角兽行列。2021 年 10 月，Orca
              拓展该轮融资，由总部位于新加坡的投资机构 Temasek 领投 $550 million 追加轮，SAIC 与 Splunk Ventures 战略跟投，ICONIQ Capital、GGV
              Capital、Stripes、Adams Street Partners 和 Lone Pine Capital 等顶尖风投亦参与其中，将账面估值推升至 $1.8 billion，累计融资额攀升至约 $630
              million。业务层面，Orca 客户数突破 1,000 家，全职员工约 400 人，个别多年期大单年均金额高达 $2.6 million。然而，公司的资本形态停留在了 2021 年的高估值周期：经审计的
              ARR、毛利率、烧钱速度与清算优先权条款均未公开；主要竞争对手 Wiz 在确立绝对 ARR 优势后于 2025 年以 $32 billion 被 Google 收购，衬托出 Orca $1.8 billion
              估值面临严峻的下调压力。
