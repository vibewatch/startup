chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与无代理平台架构
        blocks:
          - type: paragraph
            body: >-
              Orca Security 于 2019 年由 Check Point Software Technologies 前高管 Avi Shua、Gil Geron 及另外 6 位联合创始人创立，旨在消除传统主机
              agent 架构固有的运维摩擦、覆盖盲区与运行时性能损耗。公司开创了云安全领域首个无代理平台，凭借专利 SideScanning 技术，仅需调用云厂商只读 API 即可接入客户云环境，对 Amazon Web
              Services、Microsoft Azure 与 Google Cloud 资产开展带外块存储分析。该架构在生产环境中无需注入任何代码或
              sidecar，即可提供完整的云原生应用保护平台（CNAPP）能力——将云安全态势管理（CSPM）、漏洞管理、恶意软件检测、错误配置排查、横向移动风险分析、敏感数据发现，以及最新推出的 AI AppGen
              Security 统一整合。Orca 总部位于美国俄勒冈州波特兰，核心研发团队设在以色列特拉维夫，采用 SaaS 订阅模式，主要按受保护的工作负载规模分层收费，大客户年费从五位数美元的入门档延伸至数百万美元级别。
