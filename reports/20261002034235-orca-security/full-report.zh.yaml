      - number: '2.4'
        title: 驱动因素、制约条件与估值关联
        blocks:
          - type: paragraph
            body: >-
              行业需求受三大因素驱动：云资产持续扩张、多项安全职能并入 CNAPP，以及新涌现的 AI 资产亟需发现与治理。Orca 的无代理架构与数小时见效的官方口径降低了初期部署门槛，G2 页面基于用户评分给出了平均 1
              个月上线与平均 8 个月收回投资（ROI）的数据。但上述数据仅属平台方向性信号，并非经审计的财务指标。现实制约同样突出：用户反馈初始告警量庞大需要手动调优、各竞对均未公开标准价目表、Sacra
              给出的参考定价未标明日期，且赛道整合让买方拥有成熟的备选方案。在估值上，不应简单将大盘估值乘数直接套用在 $46.16-billion 或 $77-billion
              的宏观数字上。市场份额的实际捕获力，应通过客户分群留存率、真实合同额、工作负载扩容度、渠道获客漏斗、竞标胜率以及第三方验证的实施经济效益来交叉检验。
