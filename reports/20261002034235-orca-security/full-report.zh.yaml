      - number: '7.4'
        title: 补充图表
        blocks:
          - type: callout
            title: 架构边界：带外可见性 vs 串联防御
            body: >
              Orca 专利 SideScanning
              将扫描与生产环境工作负载解耦，换来了无与伦比的部署速度。但这一架构选择天生制约了其实时阻断与东西向微服务流量检查能力。安全决策者必须清醒认识到：无代理态势管理无法取代串联运行时应用防御或专用 API
              安全控制措施。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
          - type: callout
            title: 私有披露不透明与竞争压力
            body: >
              在 Wiz 凭借高速 ARR 增长与充沛资金主导的残酷市场格局下，Orca 维持私有化且未公布财务数据的现状构成了实质性的尽调阻碍。投资者与采购方必须深入探究：在不进行稀释性外部股权融资的情况下，Orca
              是否有能力维持必要的研发推进速度。
            calloutType: insight
            claimRefs:
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、估值立场与历史背景
        blocks:
          - type: paragraph
            body: >-
              Orca Security 凭借专利 SideScanning 架构首创无代理云安全路线，无需安装任何 agent 即可跨 AWS、Azure 与 Google Cloud
              提供全域漏洞管理、态势治理与工作负载防护。早期的客户拓展势头推动其估值快速跃升：从 $6.5 million 种子轮到 $20 million A 轮，继而在 $1.2 billion 估值下完成 $210
              million C 轮融资，并在 2021 年 10 月通过追加轮锁定了其已知的最新 $1.8B 估值。然而，包括 Forge Global 在内的一级半市场流动性平台显示，其老股交易活跃度极低且缺乏公开挂牌的
              Forge Price 指导价，反映出一级市场极高的估值不透明度以及撮合成交的匮乏。对照云安全标的处于估值顶峰期的历史估值倍数，Orca 历史上的 $1.8B
              估值面临巨大重估压力，故本报告维持“回避”的投资评级，估值立场定为“偏高”。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
