companyProfile:
  summary: >-
    Orca Security 是一家处于后期阶段的私有 CNAPP 厂商，基于专利 SideScanning 技术，借助只读云厂商 API 对云工作负载做带外检查。该平台将安全态势、工作负载、身份、数据、合规与 AI
    安全信号整合为统一运营模型，面向大型与中型企业云安全团队。Orca 主打按工作负载规模计费的订阅模式，部分新产品采用按席位授权，并正逐步拓宽合作伙伴驱动的渠道分销。公开证据支撑其拥有 1,000+ 家客户与约 400
    名员工的体量，但当期收入、毛利率、烧钱速度与现金跑道仍不透明。
