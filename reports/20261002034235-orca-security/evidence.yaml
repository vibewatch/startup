evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements confirming consolidated ARR, year-over-year revenue growth, gross margin percentage,
      operating cash burn, and cash runway.
    whyItMatters: >-
      Without audited financial disclosures, valuation multiples and sustainability relative to the $1.8 billion Series
      C post-money valuation cannot be independently validated.
    diligencePath: >-
      Request confidential audited GAAP financial statements and current cap table / 409A valuation report under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - id: gap-stakeholder-cap-table
    type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Detailed capitalization table showing exact equity ownership percentages, liquidation preferences, seniority
      stack, and secondary sale proceeds.
    whyItMatters: >-
      Understanding senior liquidation preference hurdles and secondary liquidity events is essential to evaluate common
      shareholder downside risk under potential markdown exits.
    diligencePath: >-
      Review formal cap table, investor rights agreements, and Certificate of Incorporation amendments filed in
      Delaware.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - id: gap-leadership-enumeration
    type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: >-
      Complete list of founding engineers and entire senior management hierarchy beyond the publicly featured executive
      committee.
    whyItMatters: >-
      Six of the original eight Check Point co-founders do not currently hold featured C-level positions, creating
      uncertainty around ongoing founder retention and technical continuity.
    diligencePath: Request an organization chart and key-person retention schedule as part of management diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      A common cloud-security market definition and the original methodologies behind the $46.16B and $77B 2026
      estimates.
    whyItMatters: >-
      Without common included-spend and geography definitions, the estimates cannot anchor a defensible market multiple
      or growth case.
    diligencePath: >-
      Obtain the original forecast reports and reconcile category scope, geography, currency, and publication vintage
      line by line.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      Customer counts by segment, protected workload volumes, realized pricing, win rates, retention, and channel
      conversion.
    whyItMatters: These inputs are required to translate broad category spend into Orca-specific serviceable and obtainable markets.
    diligencePath: >-
      Request a customer-level revenue bridge, workload cohorts, pipeline conversion by channel, and competitive
      win-loss analysis from management.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Independent procurement evidence identifying the economic buyer, payer, budget line, approval path, and contract
      duration by segment.
    whyItMatters: User enthusiasm and channel announcements do not establish who controls spend or how resilient that spend is.
    diligencePath: >-
      Review anonymized order forms and interview recent customers across enterprise, mid-market, regulated, and
      partner-led cohorts.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: implementation-economics
    missingEvidence: Independently audited implementation time, realized ROI, alert-volume reduction, and customer effort by cohort.
    whyItMatters: G2 averages and company claims are directional but cannot establish repeatable implementation economics.
    diligencePath: Validate the metrics against customer deployment records and a representative reference-call sample.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, restricted cash, debt, monthly burn, operating plan, and downside runway.
    whyItMatters: Cumulative funding raised cannot establish cash available or the timing and terms of a next financing.
    diligencePath: Obtain the latest board package, bank statements, debt agreements, and a 24-month monthly cash forecast.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: Audited revenue and ARR schedules using consistent definitions for 2023 through 2026.
    whyItMatters: The public $64.2 million estimate is alternately labeled revenue and ARR and was not confirmed by management.
    diligencePath: Reconcile GAAP revenue, ending ARR, bookings, deferred revenue, and remaining performance obligations by quarter.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, hosting and support costs, CAC, payback, LTV, NRR, GRR, and logo churn by cohort.
    whyItMatters: Enterprise contract scale and one large expansion do not establish repeatable or profitable growth.
    diligencePath: Review audited financials and cohort-level unit-economics schedules with finance and revenue operations.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Current SKU catalog, workload denominators, realized discounts, contract terms, and revenue mix by billing unit.
    whyItMatters: Third-party price points cannot establish realized pricing, revenue recognition, or expansion durability.
    diligencePath: Sample executed contracts and reconcile list price to bookings and recognized revenue by SKU.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      Current cap table, preference stack, secondary transaction evidence, and a recent independently supported
      valuation.
    whyItMatters: The historical $1.8 billion mark may not reflect current liquidation economics or dilution.
    diligencePath: Obtain the fully diluted cap table, financing documents, 409A reports, and recent secondary trade data.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: private-evidence-only
    severity: material
    topic: real-time-runtime-detection
    missingEvidence: >-
      Empirical benchmark data detailing detection latency of ephemeral container exploits comparing SideScanning
      snapshot cycles against kernel-level eBPF monitoring agents.
    whyItMatters: >-
      Determines whether enterprise security buyers must deploy complementary runtime agents alongside Orca's
      out-of-band architecture for zero-day runtime containment.
    diligencePath: >-
      Request customer deployment architecture reviews comparing pure SideScanning installations against hybrid
      deployments incorporating third-party endpoint or container runtime security tools.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - id: gap-neptune-scale
    type: missing-source
    severity: minor
    topic: graph-scaling-limits
    missingEvidence: >-
      Quantitative benchmarks disclosing Neptune query latency percentiles and memory usage under extreme node count
      conditions exceeding tens of millions of vertices.
    whyItMatters: >-
      Validates whether the exposure calculation engine sustains sub-second response times across ultra-large enterprise
      cloud infrastructures without custom sharding.
    diligencePath: >-
      Review technical architecture documentation and Neptune performance monitoring dashboards during technical due
      diligence.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-metrics
    missingEvidence: >-
      Audited historical cohort net revenue retention (NRR), gross revenue retention (GRR), and customer logo churn
      rates across enterprise tiers.
    whyItMatters: >-
      Validates whether Orca's multi-million-dollar account expansions offset potential logo churn from competitive
      displacement by Wiz and native hyperscaler offerings.
    diligencePath: Request confidential historical cohort retention tables and churn logs during formal investment due diligence.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-production-scale
    missingEvidence: >-
      Complete customer census detailing active cloud workload volumes and annual contract value bands across all 1,000+
      customer accounts.
    whyItMatters: >-
      Permits comprehensive customer concentration analysis and verifies whether total ARR is concentrated among a
      handful of multi-million-dollar accounts.
    diligencePath: >-
      Inspect anonymized customer revenue distribution schedule broken down by ACV deciles during commercial
      underwriting.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: financial-burn-and-runway
    missingEvidence: >-
      Audited financial statements showing Orca's current ARR, net burn rate, gross margin structure, and remaining cash
      runway.
    whyItMatters: >-
      Without audited financial disclosures, investors cannot quantify cash runway or the probability of a dilutive
      down-round recapitalization.
    diligencePath: >-
      Review management confidential information memorandum (CIM), audited GAAP financials, and latest 409A valuation
      reports during formal diligence.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: patent-litigation-exposure
    missingEvidence: >-
      Unredacted court filings, settlement terms, and damages estimates regarding ongoing patent and trade-secret
      litigation between Orca and Wiz.
    whyItMatters: >-
      Material IP litigation poses injunction risks or royalty licensing liabilities that directly impact product
      defensibility and enterprise sales velocity.
    diligencePath: >-
      Engage external IP counsel to review PACER docket entries, claims construction filings, and validity opinions
      regarding Orca's SideScanning patents.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
