chapter:
  number: 5
  title: "Product & Technology"
  summary: "Orca Security delivers an agentless Cloud-Native Application Protection Platform (CNAPP) built on patented SideScanning technology that inspects cloud workload block storage and configuration out-of-band via read-only cloud APIs. The platform models multicloud assets and relationships in an Amazon Neptune graph database using Gremlin and custom partitioning, enabling contextual risk prioritization across VMs, containers, serverless functions, and AI applications without running in-workload host agents."
sections:
  - id: "platform-architecture-sidescanning"
    title: "SideScanning Architecture and Out-of-Band Workload Inspection"
    body: "Orca Security operates an agentless cloud-native application protection platform designed to solve operational coverage friction and alert fatigue inherent in legacy host agent architectures. Rather than executing monitoring software, kernel drivers, or sidecars inside client production virtual machines or containers, the platform connects to public cloud environments—including Amazon Web Services, Google Cloud Platform, and Microsoft Azure—strictly via read-only cloud provider APIs. Workload discovery and deep inspection are executed out-of-band through Orca's patented SideScanning methodology. Under this operational model, collectors query cloud APIs to take read-only snapshots of workload runtime block storage volumes, analyzing operating system configuration, installed packages, vulnerability profiles, leaked secrets, active malware, and sensitive data exposure from the side without consuming guest CPU, memory, or network throughput. This architecture eliminates runtime stability hazards, avoids DevOps onboarding delays across ephemeral autoscaling groups, and enables organizations to achieve full visibility across multicloud estates in under twenty-four hours."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "graph-engine-attack-paths"
    title: "Graph-Based Context Engine and Neptune Optimization"
    body: "The core analytical engine of the Orca platform relies on a Unified Data Model backed by Amazon Neptune graph databases to transform fragmented alerts into contextualized attack path analysis. Rather than scoring vulnerabilities in isolation, Orca's collectors ingest configuration, security groups, routing tables, and identity entitlements from cloud provider APIs to construct an interconnected graph mapping asset connectivity, internet exposure, and privilege escalation pathways. To manage the computational complexity and scale of customer topologies, Orca's engineering team implemented critical database optimizations within Neptune, including bulk Gremlin batching, an in-memory least-recently-used (LRU) node cache during graph construction, and bidirectional concurrent graph traversal for API shortest-path queries. Multi-tenancy is enforced through Gremlin's PartitionStrategy, where partition keys are prepended to pagination identifiers to maintain strict cross-tenant data isolation. Furthermore, load balancer data modeling separates backend target groups into independent nodes, dramatically suppressing edge explosion and maintaining sub-second exposure path queries across complex enterprise networks."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE002"
  - id: "module-breadth-ai-security"
    title: "CNAPP Module Breadth, Multicloud Integrations, and AI AppGen Security"
    body: "Orca has systematically broadened its platform coverage from foundational Cloud Security Posture Management (CSPM) and Cloud Workload Protection (CWPP) into Cloud Infrastructure Entitlement Management (CIEM), Kubernetes posture, data security posture management (DSPM), and AI security. In response to the rapid enterprise adoption of generative development environments, Orca introduced AI AppGen Security to discover shadow AI tools, external software-as-a-service dependencies, and internal large language model agent frameworks. On Google Cloud, Orca integrates with over one hundred cloud services, Chronicle, Security Command Center, and Gemini Enterprise Agent Platform, while on AWS it provides deep context for Amazon Elastic Kubernetes Service workloads and IAM policies. Deployments are operationalized through an automated SaaS onboarding architecture designed with partners like CloudZone, cutting manual tenant provisioning effort by ninety percent while supporting enterprise partner ecosystems via custom AI enablement workflows."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE001"
callouts:
  - calloutType: "strength"
    title: "Operational Friction Elimination via Out-of-Band Inspection"
    body: "Orca's primary architectural differentiator remains its touchless SideScanning technology. By decoupling workload security assessments from host-level agents, engineering teams bypass host-level maintenance, kernel compatibility testing, and agent performance overhead, achieving instantaneous full-estate coverage across multicloud deployments."
    claimRefs:
      - "CE001"
      - "CE002"
  - calloutType: "risk"
    title: "Dependency on Cloud Provider Snapshot APIs and Graph Scale Latency"
    body: "Because out-of-band SideScanning depends entirely on cloud provider volume snapshot APIs and graph query traversals in Amazon Neptune, Orca faces inherent architectural bounds: near-real-time detection of in-memory ephemeral exploits cannot match dedicated host intrusion prevention systems, and complex customer topologies require continuous graph partitioning optimizations."
    claimRefs:
      - "CE004"
      - "CE007"
