callouts:
  - calloutType: "recommendation"
    title: "Avoid Stance Driven by Valuation Overhang"
    body: "Investors should avoid purchasing Orca Security equity at or near its historical $1.8B Series C valuation mark. Although Orca retains genuine product innovation through SideScanning and demonstrates significant customer accounts, secondary market indicators on Forge Global show unpriced markets and lack of liquidity, posing acute down-round risk."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV013"
  - calloutType: "risk"
    title: "Liquidation Preference and Multiple Compression Risk"
    body: "With nearly $300M raised through its Series C round and subsequent extension capital, Orca's capital structure likely contains substantial liquidation preference protections. Any recapitalization or secondary liquidity event below $1.2B-$1.8B would disproportionately dilute common stockholders and employee equity incentives."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV014"
