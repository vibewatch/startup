  topStrengths:
    - Agentless SideScanning reduces deployment friction and broadens cloud visibility.
    - Workload-based pricing and limited seat-based add-ons create expansion vectors.
    - The company has reached 1,000+ customers and continues to expand through partners.
  topRisks:
    - Revenue, gross margin, burn, and runway remain undisclosed or inconsistently reported.
    - Competitive pressure from Wiz and native cloud security bundling may compress pricing.
    - The $1.8B historical valuation is vulnerable without clearer financial proof.
  unresolvedGaps:
