companyProfile:
  summary: >-
    Orca Security is a late-stage private CNAPP vendor built around patented SideScanning technology that inspects cloud
    workloads out of band through read-only cloud-provider APIs. The platform combines posture, workload, identity,
    data, compliance, and AI-security signals into a single operating model for enterprise and mid-enterprise cloud
    teams. Orca sells primarily on a workload-based subscription model, with limited seat-based licenses for newer
    products and an expanding partner-led distribution motion. Public evidence supports scale above 1,000 customers and
    roughly 400 employees, but current revenue, gross margin, burn, and runway remain opaque.
