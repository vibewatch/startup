company:
  name: "Orca Security"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Orca Security pioneered agentless cloud-native application protection (CNAPP) via patented SideScanning technology that inspects cloud workloads out-of-band via read-only APIs and runtime block storage. Founded in 2019 by former Check Point executives, Orca scaled rapidly to unicorn status, raising $550 million in an extended Series C at a $1.8 billion valuation in October 2021, and now serves over 1,000 customers while confronting intense competitive pressure from Wiz and unaudited private financial metrics."
sections:
  - id: "identity-and-operating-model"
    title: "Corporate Identity and Agentless Platform Architecture"
    body: "Orca Security was founded in 2019 by former Check Point Software Technologies executives Avi Shua, Gil Geron, and six co-founders to eliminate the operational friction, coverage blind spots, and runtime performance penalties inherent in traditional agent-based cloud security architectures. The company pioneered the cloud security industry's first agentless platform utilizing its patented SideScanning technology, which connects to customer cloud estates via read-only cloud-provider APIs and analyzes runtime block storage out-of-band across Amazon Web Services, Microsoft Azure, and Google Cloud estates. This architecture delivers comprehensive Cloud-Native Application Protection Platform (CNAPP) capabilities—unifying cloud security posture management (CSPM), vulnerability management, malware detection, misconfigurations, lateral movement risk, sensitive data discovery, and recently introduced AI AppGen Security—without deploying code or sidecars inside production environments. Headquartered in Portland, Oregon with extensive research and development operations in Tel Aviv, Israel, Orca operates a subscription SaaS business model tiered primarily on protected workload volume, supplemented by enterprise contracts that scale from five-figure entry tiers to multimillion-dollar annual customer commitments."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO014"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Founders, Executive Succession, and Governance Structure"
    body: "Orca Security was conceived by eight Check Point Software Technologies alumni, establishing exceptional founder-market fit across network security, threat research, and enterprise infrastructure. Co-founder Avi Shua, formerly chief technologist at Check Point and a veteran of the Israel Defense Forces Unit 8200, served as founding Chief Executive Officer from 2019 until 2023, steering the company through its seed-to-unicorn hypergrowth phase before transitioning into the role of Chief Innovation Officer. Co-founder Gil Geron, who initially led product and engineering from inception as Chief Product Officer, succeeded Shua as CEO in 2023 to drive global enterprise scaling and product execution. The executive bench was subsequently strengthened with enterprise security leaders including Chief Revenue Officer Raf Chiodo (formerly of Lacework and EMC), Chief Product Officer Gera Dorfman (twenty-year Check Point engineering veteran), Chief Financial Officer Oded Edri (former Chief Accounting Officer at Payoneer through its public listing), and Chief Marketing Officer Rachel Nislick (formerly of Darktrace, Mimecast, and Veracode). While the founding leadership transition between Shua and Geron was executed smoothly, Orca remains exposed to key-person concentration among its original Check Point cohort as it navigates hypercompetitive market dynamics."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization History, Investor Base, and Scale Indicators"
    body: "Orca demonstrated extraordinary fundraising velocity following its $6.5 million seed financing from YL Ventures in 2019. In March 2021, Orca closed a $210 million Series C financing led by Alphabet's independent growth fund CapitalG and Redpoint Ventures at a $1.2 billion valuation, achieving unicorn status within two years of founding. By October 2021, Orca extended its Series C with a $550 million round led by Singapore-headquartered investment firm Temasek, alongside strategic participation from SAIC and Splunk Ventures and top-tier venture backers including ICONIQ Capital, GGV Capital, Stripes, Adams Street Partners, and Lone Pine Capital, lifting headline valuation to $1.8 billion and cumulative funding to approximately $630 million. Operationally, Orca reached over 1,000 customers and approximately 400 full-time employees, with individual multi-year contracts reaching up to $2.6 million annually. However, Orca's capitalization profile reflects a late-stage private structure frozen at peak 2021 multiples: audited ARR, gross margins, cash burn, and liquidation preference terms remain private, while primary competitor Wiz was acquired by Google for $32 billion in 2025 after achieving a massive ARR lead, highlighting acute valuation markdown risks for Orca's $1.8 billion mark."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO016"
    tableRefs:
