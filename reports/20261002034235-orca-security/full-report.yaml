      - number: '1.3'
        title: Capitalization History, Investor Base, and Scale Indicators
        blocks:
          - type: paragraph
            body: >-
              Orca demonstrated extraordinary fundraising velocity following its $6.5 million seed financing from YL
              Ventures in 2019. In March 2021, Orca closed a $210 million Series C financing led by Alphabet's
              independent growth fund CapitalG and Redpoint Ventures at a $1.2 billion valuation, achieving unicorn
              status within two years of founding. By October 2021, Orca extended its Series C with a $550 million round
              led by Singapore-headquartered investment firm Temasek, alongside strategic participation from SAIC and
              Splunk Ventures and top-tier venture backers including ICONIQ Capital, GGV Capital, Stripes, Adams Street
              Partners, and Lone Pine Capital, lifting headline valuation to $1.8 billion and cumulative funding to
              approximately $630 million. Operationally, Orca reached over 1,000 customers and approximately 400
              full-time employees, with individual multi-year contracts reaching up to $2.6 million annually. However,
              Orca's capitalization profile reflects a late-stage private structure frozen at peak 2021 multiples:
              audited ARR, gross margins, cash burn, and liquidation preference terms remain private, while primary
              competitor Wiz was acquired by Google for $32 billion in 2025 after achieving a massive ARR lead,
              highlighting acute valuation markdown risks for Orca's $1.8 billion mark.
