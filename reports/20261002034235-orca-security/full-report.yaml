              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Architectural Boundary: Out-of-Band Visibility vs In-Line Defense'
            body: >
              Orca's patented SideScanning delivers unparalleled deployment speed by decoupling scanning from production
              workloads. However, this architectural choice inherently limits real-time preventative blocking and
              east-west microservice traffic inspection. Security leaders must recognize that agentless posture
              management cannot replace in-line runtime application defense or dedicated API security controls.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
          - type: callout
            title: Private Disclosure Opacity and Competitive Pressure
            body: >
              In an aggressive market dominated by Wiz's rapid ARR growth and well-funded expansion, Orca's private
              status and unverified financial metrics represent a material diligence hurdle. Investors and buyers must
              probe whether Orca can sustain necessary R&D velocity without dilutive capital infusions.
            calloutType: insight
            claimRefs:
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Valuation Stance, and Historical Context
        blocks:
          - type: paragraph
            body: >-
              Orca Security pioneered agentless cloud security using its patented SideScanning architecture, delivering
              cloud-wide vulnerability management, posture governance, and workload protection across AWS, Azure, and
              Google Cloud without installed agents. Early customer momentum drove rapid expansion from its $6.5 million
              seed round to a $20 million Series A, followed by a $210 million Series C at a $1.2 billion valuation and
              an extension that established its last known valuation of $1.8B in October 2021. However, private market
              liquidity platforms including Forge Global report limited secondary trading activity with unlisted Forge
              Price marks, reflecting substantial private valuation opacity and lack of public market clearing
              transactions. In comparison to historical multiples where cloud security platforms traded at peak private
              marks, Orca's historical $1.8B valuation stands under severe valuation pressure, leading to an investment
              recommendation of avoid and a valuation stance characterized as stretched.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV014
      - number: '8.2'
        title: Scenario Analysis, Comparative Peers, and Thesis Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Orca Security across forward scenarios requires analyzing enterprise customer traction against
              ongoing cost structure risks. In the base case, Orca leverages its global partner footprint and AI
              capabilities to sustain expansion across forward-thinking cloud enterprises, supported by early large
              account adoption including organizations like Databricks, Lemonade, and BeyondTrust, while continuing to
              scale headcount and technical operations. In the bear case, private market liquidity remains frozen,
              competitive displacement by acquirers and platform incumbents compresses pricing, and the company is
              forced to raise structured capital or execute a recapitalization at a discount of 40% to 60% below its
              $1.8B peak. Conversely, the bull case assumes independent enterprise demand for multi-cloud security and
              AI governance accelerates M&A interest from legacy vendors seeking agentless capabilities. Key
              thesis-break triggers include severe customer churn in core cloud accounts, further secondary illiquidity,
              or major dilution from senior liquidation preferences.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV014
      - number: '8.3'
        title: Capital Structure, Private Trading Dynamics, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Secondary liquidity venues reflect institutional friction and structural opacity surrounding late-stage
              cybersecurity capitalization tables. With alternative trading system operators such as Nasdaq Private
              Market facilitating institutional transactions under strict accredited investor thresholds, secondary
              trading remains constrained and fragmented. Simultaneously, employee liquidity options marketed across
              pre-IPO funding portals demonstrate the growing demand among early staff for secondary liquidation
              windows, even while company-specific pricing indices remain largely unavailable. Because headline funding
              milestones do not disclose liquidation preference multiples, seniority tiers, or participation caps,
              institutional investors cannot accurately model common equity recovery in a sale scenario below prior peak
              valuation marks. Essential diligence requirements prior to capital commitment include obtaining audited
              cap tables, trailing gross and net retention figures, and unit economic customer acquisition cost
              breakdowns.
            claimRefs:
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Avoid Stance Driven by Valuation Overhang
            body: >-
              Investors should avoid purchasing Orca Security equity at or near its historical $1.8B Series C valuation
              mark. Although Orca retains genuine product innovation through SideScanning and demonstrates significant
              customer accounts, secondary market indicators on Forge Global show unpriced markets and lack of
              liquidity, posing acute down-round risk.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV013
          - type: callout
            title: Liquidation Preference and Multiple Compression Risk
            body: >-
              With nearly $300M raised through its Series C round and subsequent extension capital, Orca's capital
              structure likely contains substantial liquidation preference protections. Any recapitalization or
              secondary liquidity event below $1.2B-$1.8B would disproportionately dilute common stockholders and
              employee equity incentives.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV014
