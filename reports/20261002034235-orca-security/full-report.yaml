  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market Taxonomy and Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              The cloud security posture management (CSPM) and broader CNAPP landscape comprises multiple distinct
              categories: cloud-native agentless innovators, legacy security platform incumbents, behavioral runtime
              specialists, and emerging focused challengers. Orca pioneered the agentless SideScanning architecture,
              reading cloud configuration and workload block storage out-of-band via read-only cloud provider APIs. Wiz
              emerged as Orca's primary direct rival, leveraging rapid enterprise sales execution, strong visual
              attack-path graphs, and hyperscaler backing following its acquisition by Google Cloud. Incumbent security
              giants like Palo Alto Networks (Prisma Cloud) and CrowdStrike (Falcon Cloud Security) counter with
              comprehensive enterprise consolidation plays across endpoint, network, and cloud domains. Meanwhile,
              specialized challengers like Plerion attack specific technical niches such as granular AWS IAM policy
              analysis, and behavioral specialists like Lacework (acquired by Fortinet) offer machine-learning-based
              runtime anomaly detection.
