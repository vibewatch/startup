      - number: '5.2'
        title: Graph-Based Context Engine and Neptune Optimization
        blocks:
          - type: paragraph
            body: >-
              The core analytical engine of the Orca platform relies on a Unified Data Model backed by Amazon Neptune
              graph databases to transform fragmented alerts into contextualized attack path analysis. Rather than
              scoring vulnerabilities in isolation, Orca's collectors ingest configuration, security groups, routing
              tables, and identity entitlements from cloud provider APIs to construct an interconnected graph mapping
              asset connectivity, internet exposure, and privilege escalation pathways. To manage the computational
              complexity and scale of customer topologies, Orca's engineering team implemented critical database
              optimizations within Neptune, including bulk Gremlin batching, an in-memory least-recently-used (LRU) node
              cache during graph construction, and bidirectional concurrent graph traversal for API shortest-path
              queries. Multi-tenancy is enforced through Gremlin's PartitionStrategy, where partition keys are prepended
              to pagination identifiers to maintain strict cross-tenant data isolation. Furthermore, load balancer data
              modeling separates backend target groups into independent nodes, dramatically suppressing edge explosion
              and maintaining sub-second exposure path queries across complex enterprise networks.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE012
      - number: '5.3'
        title: CNAPP Module Breadth, Multicloud Integrations, and AI AppGen Security
        blocks:
          - type: paragraph
            body: >-
              Orca has systematically broadened its platform coverage from foundational Cloud Security Posture
              Management (CSPM) and Cloud Workload Protection (CWPP) into Cloud Infrastructure Entitlement Management
              (CIEM), Kubernetes posture, data security posture management (DSPM), and AI security. In response to the
              rapid enterprise adoption of generative development environments, Orca introduced AI AppGen Security to
              discover shadow AI tools, external software-as-a-service dependencies, and internal large language model
              agent frameworks. On Google Cloud, Orca integrates with over one hundred cloud services, Chronicle,
              Security Command Center, and Gemini Enterprise Agent Platform, while on AWS it provides deep context for
              Amazon Elastic Kubernetes Service workloads and IAM policies. Deployments are operationalized through an
              automated SaaS onboarding architecture designed with partners like CloudZone, cutting manual tenant
              provisioning effort by ninety percent while supporting enterprise partner ecosystems via custom AI
              enablement workflows.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
