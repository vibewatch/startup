      - number: '3.2'
        title: Capability and Architectural Differentiation
        blocks:
          - type: paragraph
            body: >-
              Architectural approaches across the competitive set dictate operational trade-offs between deployment
              friction and detection depth. Orca's SideScanning reads workload storage snapshots without running agents
              or impacting CPU performance, enabling onboarding in under 24 hours across AWS, Azure, and Google Cloud.
              Wiz mirrors this agentless posture-first philosophy with industry-leading attack-path visualization graphs
              that simplify risk communication for non-specialists. In contrast, platforms like Palo Alto Networks
              Prisma Cloud and CrowdStrike Falcon rely on hybrid models combining agentless discovery with host-based
              agents for deep runtime prevention, introducing deployment overhead. Emerging focused tools like Plerion
              model effective AWS IAM permissions with high mathematical precision, accounting for permission boundaries
              and SCPs where standard CSPMs trigger false positives. However, Orca's broader suite spanning DSPM, CDR,
              and container security offers higher consolidation leverage than point tools.
