chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Agentless Platform Architecture
        blocks:
          - type: paragraph
            body: >-
              Orca Security was founded in 2019 by former Check Point Software Technologies executives Avi Shua, Gil
              Geron, and six co-founders to eliminate the operational friction, coverage blind spots, and runtime
              performance penalties inherent in traditional agent-based cloud security architectures. The company
              pioneered the cloud security industry's first agentless platform utilizing its patented SideScanning
              technology, which connects to customer cloud estates via read-only cloud-provider APIs and analyzes
              runtime block storage out-of-band across Amazon Web Services, Microsoft Azure, and Google Cloud estates.
              This architecture delivers comprehensive Cloud-Native Application Protection Platform (CNAPP)
              capabilities—unifying cloud security posture management (CSPM), vulnerability management, malware
              detection, misconfigurations, lateral movement risk, sensitive data discovery, and recently introduced AI
              AppGen Security—without deploying code or sidecars inside production environments. Headquartered in
              Portland, Oregon with extensive research and development operations in Tel Aviv, Israel, Orca operates a
              subscription SaaS business model tiered primarily on protected workload volume, supplemented by enterprise
              contracts that scale from five-figure entry tiers to multimillion-dollar annual customer commitments.
