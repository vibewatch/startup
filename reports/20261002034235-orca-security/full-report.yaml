              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Operational Friction Elimination via Out-of-Band Inspection
            body: >-
              Orca's primary architectural differentiator remains its touchless SideScanning technology. By decoupling
              workload security assessments from host-level agents, engineering teams bypass host-level maintenance,
              kernel compatibility testing, and agent performance overhead, achieving instantaneous full-estate coverage
              across multicloud deployments.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Dependency on Cloud Provider Snapshot APIs and Graph Scale Latency
            body: >-
              Because out-of-band SideScanning depends entirely on cloud provider volume snapshot APIs and graph query
              traversals in Amazon Neptune, Orca faces inherent architectural bounds: near-real-time detection of
              in-memory ephemeral exploits cannot match dedicated host intrusion prevention systems, and complex
              customer topologies require continuous graph partitioning optimizations.
            calloutType: risk
            claimRefs:
              - CE004
              - CE007
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Enterprise Buying Personas
        blocks:
          - type: paragraph
            body: >-
              Orca Security segments its commercial customer base across mid-market and global enterprise organizations
              operating complex multi-cloud workloads across Amazon Web Services, Microsoft Azure, Google Cloud
              Platform, and Oracle Cloud Infrastructure. Enterprise buyer personas divide primarily between Chief
              Information Security Officers (CISOs), who prioritize unified attack-path context and compliance
              governance, and Vice Presidents of Cloud Engineering or DevOps leads, who demand zero deployment friction
              and zero host agent performance penalties. Strategic account profiles are categorized into high-velocity
              cloud-native technology companies, regulated financial technology organizations requiring strict
              compliance audits, and federal government entities operating under stringent FedRAMP authorization
              boundaries. Orca's technical pre-sales and sales engineering teams utilize deal intelligence automation
              platforms like Opine to track opportunity pipelines and streamline post-sales onboarding handoffs. While
              commercial packaging establishes entry commitments at approximately $50,000 annually, target enterprise
              buyers regularly commit to multi-year contracts with six-figure annual contract values.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
