  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Visualizes the enterprise customer lifecycle from initial agentless onboarding through expansion loops and
      potential competitive churn risks.
    data:
      nodes:
        - label: 'Phase 1: Agentless Discovery & Assessment'
          detail: Connect read-only cloud APIs; 100% asset inventory in 24 hours without host agents.
          touchpoints:
            - Read-only AWS/Azure/GCP API role configuration
            - Automated cloud snapshot inventory scan
            - Initial attack-path graph generation
        - label: 'Phase 2: Posture Consolidation & Production Rollout'
          detail: Remediate critical toxic combinations and eliminate legacy fragmented point tools.
          touchpoints:
            - Triaging prioritized attack paths to crown jewels
            - Replacing standalone CSPM and vulnerability point scanners
            - Slack and Jira alerting integration with DevOps workflows
        - label: 'Phase 3: Workload & Multi-Module Expansion'
          detail: Scale protected workloads and cross-sell DSPM, CIEM, Kubernetes, and AI AppGen.
          touchpoints:
            - Expanding coverage across newly provisioned cloud accounts
            - Adding AI AppGen Security to discover shadow AI models
            - Annual contract expansion from six figures to multi-million tiers
        - label: 'Phase 4: Contract Renewal & Churn Barrier'
          detail: Defend against competitor displacement from Wiz and native hyperscaler suites.
          touchpoints:
            - Evaluating annual workload licensing costs
            - Benchmarking runtime threat detection against hybrid agents
            - Partner POD Program net retention support
        - label: 'Phase 5: Federal & Regulated Governance'
          detail: Deploy dedicated GovCloud boundary instances meeting NIST SP 800-53 controls.
          touchpoints:
            - Isolated AWS GovCloud and Azure Government tenant configuration
            - Continuous compliance evidence generation for FedRAMP assessments
            - High-assurance federal personnel screening and access boundary audit
        - label: 'Phase 6: Channel Ecosystem & Partner Co-Selling'
          detail: Leverage Partner POD Program and AI-driven Partner Success Platform for co-delivery.
          touchpoints:
            - Automated deal pipeline qualification via partner demand center
            - Shared post-sales customer success enablement templates
            - Channel reseller margin alignment for multi-year customer renewals
    notes: >-
      Maps enterprise customer adoption stages, highlighting the frictionless entry motion and subsequent multi-module
      contract expansion dynamics.
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU009
      - CU010
      - CU016
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Matrix evaluating Orca Security's core identified risks across likelihood and severity dimensions.
    data:
      columns:
        - Negligible
        - Moderate
        - Critical
      rows:
        - label: Critical Likelihood
          values:
            - label: Market Hype Cycle Shift
              score: 2
              note: Security buyer focus shifting toward consolidated platform suites
            - label: Competitor Price Aggression
              score: 6
              note: Discounting pressure from Wiz and incumbent CNAPP providers
            - label: Agentless Technology Commoditization
              score: 9
              note: CSP snapshot capabilities replicated across competitors
        - label: High Likelihood
          values:
            - label: Alert Volume Noise
              score: 3
              note: Initial scanning alert noise requires customer policy tuning
            - label: API Runtime Blind Spots
              score: 8
              note: Lack of in-line instrumentation misses dynamic runtime attacks
            - label: Hypervisor API Dependency
              score: 9
              note: Total reliance on AWS, Azure, and GCP snapshotting infrastructure
        - label: Medium Likelihood
          values:
            - label: Onboarding Friction
              score: 2
              note: Product complexity can feel heavyweight for smaller teams
            - label: Marketplace Margin Squeeze
              score: 5
              note: Heavy dependence on AWS Marketplace procurement and fees
            - label: Regulatory Compliance Fines
              score: 7
              note: Customer exposure under GDPR and PCI-DSS compliance audits
        - label: Low Likelihood
          values:
            - label: Minor UI Gaps
              score: 1
              note: Dashboard filtering and custom reporting requests
            - label: Channel Partner Attrition
              score: 4
              note: Reseller distribution changes managed via Partner POD program
            - label: SaaS Multi-Tenant Breach
              score: 8
              note: Severe catastrophic risk if centralized SaaS processing is compromised
        - label: Remote Likelihood
          values:
            - label: Cloud Provider Core Outage
              score: 1
              note: Global failure across all major cloud providers simultaneously
            - label: Open Source Tooling Disruption
              score: 4
              note: Free community posture management tools displacing enterprise tier
            - label: Catastrophic Core IP Invalidation
              score: 9
              note: Total invalidation of SideScanning patents via USPTO re-examination
        - label: Theoretical Likelihood
          values:
            - label: Complete Cloud Migration Reversal
              score: 1
              note: Broad enterprise repatriation of workloads back to on-premise data centers
            - label: Global Telemetry Ban
              score: 5
              note: Extremist sovereign data laws prohibiting out-of-band snapshot analysis
            - label: Direct Hypervisor Platform Lockout
              score: 9
              note: Major hyperscalers barring third-party security vendors from read-only APIs
    approximationNotes: >-
      Likelihood and impact scores synthesized from independent reviews, customer feedback, and vendor architecture
      analysis.
    claimRefs:
