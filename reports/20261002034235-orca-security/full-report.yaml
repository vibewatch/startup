  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: SideScanning Architecture and Out-of-Band Workload Inspection
        blocks:
          - type: paragraph
            body: >-
              Orca Security operates an agentless cloud-native application protection platform designed to solve
              operational coverage friction and alert fatigue inherent in legacy host agent architectures. Rather than
              executing monitoring software, kernel drivers, or sidecars inside client production virtual machines or
              containers, the platform connects to public cloud environments—including Amazon Web Services, Google Cloud
              Platform, and Microsoft Azure—strictly via read-only cloud provider APIs. Workload discovery and deep
              inspection are executed out-of-band through Orca's patented SideScanning methodology. Under this
              operational model, collectors query cloud APIs to take read-only snapshots of workload runtime block
              storage volumes, analyzing operating system configuration, installed packages, vulnerability profiles,
              leaked secrets, active malware, and sensitive data exposure from the side without consuming guest CPU,
              memory, or network throughput. This architecture eliminates runtime stability hazards, avoids DevOps
              onboarding delays across ephemeral autoscaling groups, and enables organizations to achieve full
              visibility across multicloud estates in under twenty-four hours.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE003
            claimRefs:
