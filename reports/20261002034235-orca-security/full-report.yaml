  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant core market is CNAPP software that brings cloud posture, workload, identity, data,
              compliance, application, and increasingly AI-security signals into one operating view. Orca describes that
              broad bundle on its own site, while a low-reputation comparison publisher observes that major vendors no
              longer sell posture management as an isolated category. This boundary should exclude dedicated endpoint
              security, stand-alone vulnerability scanners, web-application firewalls, external third-party risk
              scoring, and general AI infrastructure spend unless those capabilities are purchased as part of the
              cloud-security platform. Status-quo substitutes include native cloud-provider controls, point tools,
              manual review, and accepting fragmented coverage. The practical market is therefore narrower than every
              dollar labelled cloud security: it is the spend a buyer can consolidate into a CNAPP without retaining
              those adjacent tools or preferring native controls.
