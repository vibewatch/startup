              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Agentless Architecture Drives Rapid Enterprise Adoption
            body: >-
              Orca's primary commercial asset in winning customer accounts is the operational elimination of host
              agents. Enterprise security and DevOps leaders at organizations like BeyondTrust and Databricks confirm
              achieving complete cloud estate visibility within weeks, bypassing traditional DevOps ticketing and
              runtime performance degradation.
            calloutType: strength
            claimRefs:
              - CU001
              - CU013
              - CU014
          - type: callout
            title: Private Disclosures Mask Retention and Churn Exposure
            body: >-
              While Orca reports scaling past 1,000 accounts and expanding individual contracts up to $2.6 million, the
              company does not publicly disclose audited net revenue retention (NRR), gross retention (GRR), or customer
              churn metrics, creating critical underwriting uncertainty regarding contract durability against aggressive
              competitor discounting.
            calloutType: risk
            claimRefs:
              - CU010
              - CU012
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Environment
        blocks:
          - type: paragraph
            body: >
              Orca operates within a demanding regulatory landscape where global enterprises must adhere to stringent
              data protection mandates, including GDPR and PCI-DSS. While Orca's SideScanning architecture provides deep
              compliance auditing across cloud estates, failure of customers to remediate identified misconfigurations
              exposes them to catastrophic penalties—such as GDPR fines reaching up to €20 million or 4% of global
              turnover—creating customer pressure and liability scrutiny for security posture verification tools.
              Furthermore, persistent trade-secret litigation and IP friction with competitors like Wiz over agentless
              scanning technology present ongoing defense costs, potential patent invalidation risks, or commercial
              injunction exposure that cloud buyers monitor closely during vendor selection.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: Operational and Architectural Failure Modes
        blocks:
          - type: paragraph
            body: >
              Orca's primary architectural differentiator—out-of-band SideScanning of cloud block storage—imposes
              distinct technical boundaries compared to in-line runtime agents and specialized API gateways. Because
              Orca analyzes workload snapshots out-of-band and processes telemetry in a centralized SaaS environment, it
              cannot inspect live east-west network traffic, execute real-time automated blocking, or provide
              pre-production shift-left behavioral testing. Independent comparative evaluations highlight that Orca
              provides surface-level API insights with critical blind spots across microservices and partner APIs,
              leaving teams vulnerable to runtime exploits unless paired with dedicated API protection. Operationally,
              enterprise deployments frequently generate overwhelming alert volumes during initial snapshots, creating
              triage fatigue and necessitating extensive alert-tuning services.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
      - number: '7.3'
        title: Partner Concentration and Financial Sustainability
        blocks:
          - type: paragraph
            body: >
              Orca exhibits significant technical and commercial concentration around major cloud hypervisors and
              distributor channels. Technically, Orca's SideScanning mechanism depends entirely on cloud provider
              read-only APIs and snapshot capabilities across AWS, Microsoft Azure, and Google Cloud Platform; any
              breaking provider API modifications, throttling policies, or snapshot permission adjustments directly
              impair scanning throughput. Commercially, Orca relies heavily on cloud marketplaces such as AWS
              Marketplace for enterprise transactions, as well as major distributors like TD SYNNEX to scale global
              channel reach. Financially, Orca remains an unlisted private company with no public audited disclosures
              regarding annual recurring revenue, gross margins, cash burn rate, or runway following its $210 million
              Series C valuation at $1.2 billion, exposing late-stage equity holders to multiple compression and
              potential down-round recapitalization risks in a consolidated cybersecurity market.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
