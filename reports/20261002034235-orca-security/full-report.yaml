      - number: '1.2'
        title: Founders, Executive Succession, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Orca Security was conceived by eight Check Point Software Technologies alumni, establishing exceptional
              founder-market fit across network security, threat research, and enterprise infrastructure. Co-founder Avi
              Shua, formerly chief technologist at Check Point and a veteran of the Israel Defense Forces Unit 8200,
              served as founding Chief Executive Officer from 2019 until 2023, steering the company through its
              seed-to-unicorn hypergrowth phase before transitioning into the role of Chief Innovation Officer.
              Co-founder Gil Geron, who initially led product and engineering from inception as Chief Product Officer,
              succeeded Shua as CEO in 2023 to drive global enterprise scaling and product execution. The executive
              bench was subsequently strengthened with enterprise security leaders including Chief Revenue Officer Raf
              Chiodo (formerly of Lacework and EMC), Chief Product Officer Gera Dorfman (twenty-year Check Point
              engineering veteran), Chief Financial Officer Oded Edri (former Chief Accounting Officer at Payoneer
              through its public listing), and Chief Marketing Officer Rachel Nislick (formerly of Darktrace, Mimecast,
              and Veracode). While the founding leadership transition between Shua and Geron was executed smoothly, Orca
              remains exposed to key-person concentration among its original Check Point cohort as it navigates
              hypercompetitive market dynamics.
            claimRefs:
