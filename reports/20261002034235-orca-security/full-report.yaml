      - number: '6.2'
        title: Customer Adoption Trajectory, Scale, and Contract Expansion
        blocks:
          - type: paragraph
            body: >-
              Orca's customer adoption trajectory exhibits rapid multi-stage expansion from its initial founding in 2019
              through hypergrowth sparked by widespread cloud vulnerability events. Following early seed validation,
              Orca broke one million dollars in revenue in early 2020 and achieved greater than 1,000 percent
              year-over-year revenue expansion between 2020 and 2021, fueled by urgent enterprise demand for complete
              workload visibility during the industry-wide Log4j security crisis. By late 2026, Orca reported active
              customer scale exceeding 1,000 organizations, supported by an expanding enterprise land-and-expand dynamic
              where protected cloud workload expansion and newly introduced platform modules drive dramatic contract
              value growth. In an illustrative top-tier account expansion cited by CEO Gil Geron in 2026, a single
              enterprise account expanded from an initial $300,000 annualized commitment into a $2.6 million annual
              contract. However, because comprehensive customer counts and net retention rates are guarded private
              metrics, the company's true cohort-level expansion velocity cannot be audited externally.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Named Customer Proof, Production Deployments, and Retention Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Named customer production proof spans prominent enterprise technology and software companies that publicly
              confirm Orca's agentless deployment benefits over legacy host agent architectures. Vice President of
              Information Security at Databricks, Caleb Sima, publicly validated that Orca delivers capabilities
              comparable to on-box agents without engineering friction, while BeyondTrust Chief Technology and Security
              Officer Morey Haber verified rapid full-estate rollout within two months protecting more than 4,000 cloud
              customers. Similarly, Drew Daniels, CIO and CISO at Druva, confirmed Orca achieved 100 percent multicloud
              coverage across thousands of hourly scaling cycles without burdening DevOps teams. In regulated federal
              sectors, Orca maintains dedicated GovCloud infrastructure across AWS and Azure meeting NIST SP 800-53
              standards. Despite these marquee endorsements, Orca faces critical customer retention vulnerabilities: net
              revenue retention (NRR), gross retention rates (GRR), and customer churn percentages remain unconfirmed,
              leaving enterprise diligence exposed to potential account churn driven by aggressive competitive
              displacement from Wiz and bundled hyperscaler security suites.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
