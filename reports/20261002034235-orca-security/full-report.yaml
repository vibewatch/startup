        title: Commercial Packaging, Switching Costs, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Pricing and procurement dynamics represent both an opportunity and a vulnerability for Orca. Orca prices
              subscriptions based on protected cloud workload assets across compute, data, and runtime environments,
              typically starting at $50,000 annually and scaling into six-figure ACVs for large enterprise environments.
              While Orca is frequently positioned as a cost-competitive alternative to Wiz's premium quote-only pricing,
