      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM Across Lenses'
        blocks:
          - type: paragraph
            body: >
              No independent analyst has published a TAM specifically for rack-scale fully integrated on-premises cloud
              computers. Sizing must be constructed from proxies and adjacent market data, all of which carry material
              uncertainty. The broadest possible TAM frame — global on-premises server, storage, and networking hardware
              — reflects $80B–$130B in annual spend, derived from data-center hardware vendor revenues and IDC-adjacent
              industry estimates. This is an over-inclusive frame: it includes traditional rackmount servers that Oxide
              does not compete for and colocation power-only contracts.

              A tighter SAM uses the modern private cloud platform layer (API-first, software-defined, HCI or integrated
              systems) as its boundary. Nutanix, the most comparable public company, reported approximately $2.1B in
              annual recurring revenue as of its fiscal year 2025, giving a software-revenue floor for the HCI segment.
              The broader HCI market (including Dell VxRail, HPE SimpliVity, and Lenovo) implies a hardware+software
              market of $8B–$22B annually, though analyst estimates diverge and the segment definitions are inconsistent
              across reports. Oxide's SOM — the wedge of vertically integrated rack systems targeting VMware-exit,
              sovereign cloud, AI/HPC, and regulated workloads in federal and financial markets — is estimated at
              $1B–$5B, a construction that carries low confidence and should be treated as an order-of-magnitude frame,
              not a forecast.

              A second sizing lens comes from the cloud repatriation signal. The CIO.com 2025 analysis cited global
              public cloud end-user spending at approximately $723B in 2025. A 2024 Barclays CIO survey (reported by EE
              Times via ReadyWorks) found 83 percent of enterprise CIOs planned to repatriate at least some workloads
              from public cloud in 2024 — up from 43 percent in 2020. Even a 2 percent repatriation of public cloud
              spend converts to roughly $14B in on-premises re-investment annually. Contradictory signals are preserved:
              the IDC 2024 analysis (CIO.com) indicates most enterprises expect selective repatriation rather than
              wholesale cloud exit, and the total $723B public cloud figure confirms that cloud remains the default
              destination for most new workloads.
