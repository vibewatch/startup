      - number: '6.2'
        title: Adoption Trajectory and Named Customer Proof
        blocks:
          - type: paragraph
            body: >-
              Oxide's public adoption evidence is strongest when read as a timeline rather than as a single
              customer-count metric. At general availability in October 2023, Oxide named Idaho National Laboratory and
              an unnamed global financial-services firm as early customers, establishing that the product had crossed
              from concept to paid deployment. By July 2024, Blocks & Files reported fewer than 20 racks shipped and
              said most were single-unit deployments. That figure is small, but it is still important: it confirms real
              hardware in the field rather than a purely pilot-stage story. Subsequent proof tightened around a few
              credible accounts. LLNL announced an Oxide installation to modernize operational workloads alongside HPC,
              while Switch deployed Oxide hardware inside its own data centers for an internally used private-cloud
              platform.

              Freshness improves in 2025-2026, but precision does not. Oxide's Series B post says customers were landing
              faster after first shipments and that field updates plus customer-requested features were already
              occurring. Intel Capital and Oxide's Series C materials then describe product-market fit and accelerating
              adoption. Those statements matter directionally, especially for a hardware startup whose sales cycles are
              naturally long, but they still stop short of disclosing current customer count, live rack count, or booked
              follow-on orders. The chapter therefore treats adoption as real and improving, while keeping confidence
              moderate because the most important denominators remain private.
