      - number: '1.2'
        title: Founders, leadership, and organizational depth
        blocks:
          - type: paragraph
            body: >
              Oxide's leadership structure is tightly centered on its two co-founders. Steve Tuck serves as CEO and is
              the primary external voice on commercial strategy, customer engagement, and company positioning,
              frequently cited in press releases and investor announcements. Bryan Cantrill, as CTO, leads technical
              strategy and is the most publicly visible technologist, known in systems-software circles for his work on
              DTrace at Sun Microsystems and his outspoken advocacy for open-source firmware and hardware transparency.
              Both co-founders are identified in the Series A, Series B, and Series C announcement materials, confirming
              their continued operating roles through at least February 2026. The company maintains a weekly live
              podcast ("Oxide and Friends") and a technical podcast ("On the Metal"), giving the founders unusually high
              visibility for a company of Oxide's size. Beyond the co-founders, Oxide has not published a full
              leadership roster with individual names and roles on its public website as of the run date — the bio page
              links social channels and contact information but does not enumerate an executive team. This opacity is
              not unusual for an early-commercial hardware company, but it means that succession risk, board
              composition, and governance structure remain unverified from public sources. The founding team's combined
              experience with large-scale systems infrastructure (Sun, Joyent, Nexenta backgrounds across the team)
              provides strong technical credibility, and the fact that both co-founders remain in their original roles
              through the Series C suggests governance stability, but the absence of a published board roster and
              investor observer rights structure is a gap that later-stage investors should address in diligence.
