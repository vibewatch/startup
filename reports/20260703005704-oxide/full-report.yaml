      - number: '3.2'
        title: Competitor Profiles and Capability Comparison
        blocks:
          - type: paragraph
            body: >-
              The most defensible direct comparison is between Oxide and Nutanix, because both promise a modern
              private-cloud operating model on-premises. Nutanix, however, remains primarily a software platform with
              broad ecosystem compatibility, while Oxide sells a physically integrated rack whose networking, storage,
              firmware, and control plane are all first party. AWS Outposts and Azure Local attack the same workload set
              from the opposite direction: rather than removing cloud dependency, they extend the hyperscaler control
              plane into the customer data center. HPE and Dell position around operational simplification, financing
              flexibility, and support breadth, often preserving multi-vendor or VMware familiarity rather than
              replacing it with a fully new operating model.  Public evidence shows Oxide is unusually strong on
              first-party API automation, built-in networking, block storage, and verifiable firmware relative to legacy
              on-prem stacks. The public docs, Terraform provider, and Red Hat catalog listing make the product surface
              concrete, not conceptual. At the same time, feature breadth remains narrower than the incumbents' broad
              catalogs, and public sources do not prove parity on surrounding enterprise services such as DR, database
              lifecycle tooling, multi-cluster fleet management, or expansive managed-service overlays. For buyers, the
              key question is therefore not whether Oxide is modern enough, but whether its integrated approach solves
              enough of the surrounding operational envelope to justify leaving incumbent ecosystems.
