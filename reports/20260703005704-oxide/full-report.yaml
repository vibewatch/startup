      - number: '2.4'
        title: Growth Drivers and Demand Catalysts
        blocks:
          - type: paragraph
            body: >
              The most immediate demand catalyst is Broadcom's 2023 acquisition of VMware and subsequent licensing
              restructuring that increased costs significantly for VMware-installed-base customers. This created an
              urgent VMware-exit evaluation across enterprise and public-sector IT, with many organizations evaluating
              Nutanix, OpenStack, and purpose-built alternatives such as Oxide. ReadyWorks described the simultaneous
              VMware-exit and cloud-repatriation trend as a structural "infrastructure convergence moment."

              AI and HPC workloads are a second near-term driver. The Broadcom Private Cloud Outlook 2025 survey (1,800
              IT leaders, May 2025) found 55 percent prefer private cloud for AI model training, tuning, and inference —
              a signal that GPU-dense on-prem infrastructure demand is durable. Oxide's 2nd Gen Sleds (AMD EPYC 9005 /
              Zen 5, AVX-512) are positioned explicitly for AI inference and vector-heavy compute. Oxide's blog cites
              Goldman Sachs research projecting data center power consumption to rise from 1–2 percent of global
              electricity to 3–4 percent by 2030, with rack-scale design cited as critical to efficiency; Oxide claims
              to cut per-workload power consumption by 50 percent versus traditional racks.

              Data sovereignty regulation is the third structural driver. The VMware Sovereign Cloud Initiative (2021)
              documented the growing enterprise and government need for cloud infrastructure where data residency can be
              enforced at the hardware level. Federal regulations, EU data-residency mandates, and financial-services
              regulatory requirements (such as requirements that data not leave specific jurisdictions) all favor
              Oxide's on-prem ownership model over hyperscale public cloud. The BVP Nasdaq Emerging Cloud Index context
              confirms that public cloud valuations remain elevated but the relative cost of cloud at scale has
              attracted repatriation capital. DHH's 2022 Basecamp post — "Renting computers is (mostly) a bad deal for
              medium-sized companies" — anchors the economics argument that drove a16z to publish "The Cost of Cloud, a
              Trillion Dollar Paradox" (2021).
