      - number: '6.3'
        title: Durability, Repeat Usage, and Expansion Versus Concentration
        blocks:
          - type: paragraph
            body: >-
              The public record on durability is much weaker than the public record on technical fit. Oxide does not
              disclose NRR, GRR, churn, contract length, or renewal data in any source reviewed for this chapter. That
              means the strongest repeat-usage signals are proxies rather than classic SaaS retention metrics: software
              updates delivered to systems already in the field, customer-requested features added after shipment,
              LLNL's statement that additional Cloud Computers are of interest, and Switch's desire for a platform it
              could replicate across data centers. These are encouraging signals because they imply active use after
              initial purchase, but they do not reveal how many customers expand, how quickly they add racks, or whether
              early accounts renew support and keep Oxide as a strategic vendor.

              Expansion logic is easy to describe: sovereign-cloud buyers can add more workloads inside the same secure
              environment; VMware-exit and hybrid-cloud buyers can move additional internal applications on-prem; AI and
              HPC users can add adjacent data and orchestration services; and service-provider operators can replicate a
              working design across sites. The problem is proof breadth. Public named references are concentrated in a
              small set of technically sophisticated accounts, and Oxide's own direct-sales, no-OEM posture narrows
              channel breadth further. Incumbents such as AWS Outposts, HPE GreenLake, Dell APEX, and Nutanix also
              market more flexible or managed commercial models, which can reduce procurement friction for the same
              buyer personas. Gartner also maintains dedicated alternatives pages for AWS Outposts, Azure Local, Nutanix
              Cloud Platform, and Dell VxRail, reinforcing that mainstream buyers enter this category with a mature
              incumbent comparison set. Gartner also maintains alternatives pages for VMware vSAN, Proxmox Virtual
              Environment, Red Hat OpenShift Virtualization, and Platform9 Managed OpenStack, showing that buyers can
              compare Oxide against a broad substitute set that extends beyond the largest incumbents. Expansion
              potential is therefore credible, but concentration and commercial friction remain material until
              management provides cohort-style installed-base evidence.
