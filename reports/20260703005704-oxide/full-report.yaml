  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Fresh capital, demand signals, and product differentiation are real, but missing price and missing economics block
      a buy recommendation.
    data:
      nodes:
        - id: capital
          label: Fresh capital
          detail: Series B and reported Series C financing give Oxide real manufacturing and roadmap runway.
          tone: positive
        - id: demand
          label: Demand wedge
          detail: Federal, financial-services, VMware-exit, and AI infrastructure needs support real market pull.
          tone: positive
        - id: product
          label: Rack-scale differentiation
          detail: >-
            Hardware-software co-design, second-generation compute, and ownership economics support strategic
            differentiation.
          tone: positive
        - id: opaque-price
          label: No disclosed round valuation
          detail: Public sources reviewed disclose dollars raised but not the price of either major recent round.
          tone: warning
        - id: opaque-economics
          label: No public revenue or margin
          detail: Revenue, gross margin, backlog, and preference-stack visibility are absent.
          tone: warning
        - id: comp-band
          label: Public comp band is 1.7x-6.2x sales
          detail: Dell and HPE anchor the low end; Nutanix and Pure anchor the upper end.
          tone: neutral
        - id: recommendation
          label: Research-more / track
          detail: Do not buy blindly; wait for price and economics disclosure that fits the scenario framework.
          tone: neutral
      edges:
        - from: capital
          to: recommendation
          label: keeps company investable
        - from: demand
          to: recommendation
          label: supports continued diligence
        - from: product
          to: comp-band
          label: could justify upper band
        - from: opaque-price
          to: recommendation
          label: blocks underwriting
        - from: opaque-economics
          to: recommendation
          label: blocks multiple selection
        - from: comp-band
          to: recommendation
          label: sets entry discipline
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV020
      - CV021
      - CV039
      - CV041
      - CV046
      - CV047
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Enterprise value support changes sharply depending on which revenue level and which public-comp multiple band you
      apply.
    data:
      items:
        - label: $100M revenue at 2x
          value: 0.2
          detail: Hardware-like downside case; EV in USD billions.
          tone: negative
        - label: $250M revenue at 2x
          value: 0.5
          detail: Even respectable hardware revenue does not support a venture-style premium on low multiples.
          tone: negative
        - label: $250M revenue at 4x
          value: 1
          detail: Upper base-case ceiling for a blended infrastructure business; EV in USD billions.
          tone: warning
        - label: $400M revenue at 5x
          value: 2
          detail: Entry into a software-like valuation zone requires much stronger disclosed scale.
          tone: neutral
        - label: $600M revenue at 5x
          value: 3
          detail: Premium case with meaningful disclosed scale; EV in USD billions.
          tone: positive
        - label: $600M revenue at 6x
          value: 3.6
          detail: Upper public-comp case, more in line with Pure Storage-type valuation support.
          tone: positive
    approximationNotes: >-
      Simple EV/sales illustrations using the public comp bands observed on 2026-06-09; not DCF outputs or management
      guidance.
    claimRefs:
      - CV039
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      With only a secondary-market ~$1.62B mark and no disclosed revenue, the honest range remains a bear/base/bull
      enterprise-value framework around that visible price anchor.
    data:
      items:
        - label: Bear case
          low: 0.05
          mid: 0.125
          high: 0.2
          detail: $50M-$100M revenue at 1x-2x sales; hardware-like economics dominate.
          tone: negative
        - label: Base case
          low: 0.45
          mid: 0.725
          high: 1
          detail: $150M-$250M revenue at 3x-4x sales; blended infrastructure profile.
          tone: warning
        - label: Bull case
          low: 2
          mid: 2.8
          high: 3.6
          detail: $400M-$600M revenue at 5x-6x sales; software-like margins and repeat expansion proven.
          tone: positive
    approximationNotes: Values are enterprise-value ranges in USD billions tied to explicit revenue and multiple assumptions.
    claimRefs:
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Oxide scores best on market wedge, product differentiation, and capital runway, and worst on financial
      transparency relative to its visible Series C valuation.
    data:
      items:
        - label: Market pull
          score: 8
          detail: VMware-exit, federal sovereignty, and private-cloud demand create real market urgency.
          tone: positive
        - label: Customer proof
          score: 6
          detail: Named customers and channel evidence exist, but installed-base scale is still early.
          tone: neutral
        - label: Product moat
          score: 7
          detail: Rack-scale co-design, second-gen compute, and ownership economics are differentiated.
          tone: positive
        - label: Financial transparency
          score: 2
          detail: No public revenue, margin, backlog, or cap-table disclosure.
          tone: negative
        - label: Valuation support
          score: 4
          detail: >-
            Forge points to a ~$1.62B Series C mark, but public revenue, margin, and preference disclosures are still
            too thin to fully support it.
          tone: negative
        - label: Financing runway
          score: 8
          detail: Recent financing provides real operating runway for manufacturing and roadmap execution.
          tone: positive
        - label: Exit readiness
          score: 4
          detail: Product and customer proof exist, but public-company reporting readiness does not.
          tone: warning
    approximationNotes: Scores are 0-10 IC judgments synthesized from public evidence, not a mechanical model.
    claimRefs:
      - CV002
      - CV009
      - CV017
      - CV020
      - CV041
      - CV047
      - CV048
      - CV049
      - CV050
      - CV059
