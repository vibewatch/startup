            body: >-
              The financial-model risk is less about immediate solvency and more about whether public evidence is
              sufficient to underwrite a hardware business that is clearly preparing for larger scale. Oxide has raised
              substantial capital in quick succession and says it did not need the money for survival, which lowers
              near-term financing risk. But the same sources tie the capital to manufacturing expansion, customer
              support, and long-term independence — all signals that working capital, inventory turns, and customer-ramp
