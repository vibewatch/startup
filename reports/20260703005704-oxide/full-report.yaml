      - number: '6.4'
        title: Adverse Signals and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              The main adverse signal is not customer dissatisfaction; it is customer opacity. The best independent
              negative datapoint remains Blocks & Files' mid-2024 report that Oxide had shipped fewer than 20 racks,
              mostly as single-unit deployments. For a hardware company selling a durable infrastructure layer, that is
              enough to prove real adoption but far too little to prove scale or diversification. Likewise, federal
              procurement help through Carahsoft reduces one source of friction but does not remove long approval
              cycles, facility constraints, or the risk that a small number of large contracts dominate the early
              pipeline. Even the strongest public references — LLNL and Switch — are still described in ways that
              emphasize technical utility rather than clear commercial scale.

              That makes the remaining diligence asks straightforward. Investors need cohort data on shipped racks and
              live accounts by segment, evidence of second and third orders from early customers, support-attachment and
              renewal behavior, and current top-customer concentration. They also need channel mix: how much of demand
              is partner-assisted versus direct, and whether Oxide's support organization can keep up if more customers
              move from single-rack installs to multi-site rollouts. Until those answers are available, the customer
              chapter supports a constructive but guarded view: Oxide has crossed the threshold from concept to real
              buyer demand, yet its public evidence base still looks like an early-commercial hardware company rather
              than a broadly proven infrastructure platform.
