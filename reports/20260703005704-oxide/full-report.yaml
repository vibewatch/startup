      - number: '8.4'
        title: Recommendation, Kill Triggers, and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              The current recommendation is research-more. Not because Oxide lacks promise, but because the known price
              is now easier to critique than to underwrite. Medium confidence reflects that the upside case is grounded
              in actual evidence: sovereign and VMware-exit demand, procurement channels, fresh capital, differentiated
              product design, and a widening private-cloud discussion. High risk reflects the opposite side of the
              ledger: early shipment scale, capital intensity, channel limits from direct sales, selective rather than
              wholesale repatriation, and missing financial transparency. In practical terms, this means no blind buy at
              a unicorn premium. The publicly visible ~$1.62B Series C mark already demands materially better evidence
              than is currently available; it is above the report's base-case value band and only starts to look
              attractive if Oxide can eventually show much larger revenue, stronger margins, and repeat multi-rack
              expansion than the public record currently documents.


              What would change the call? First, audited or management-certified revenue and gross margin. Second,
              backlog quality and expansion data showing that Oxide is graduating from single-rack proofs to fleet
              rollouts. Third, customer concentration and warranty-reserve disclosure. Fourth, the actual preference
              stack for the outstanding rounds. If those items arrive and the price is disciplined relative to the
              scenario framework, Oxide could move from research-more to buy. Until then, the diligence burden remains
              squarely on disclosure, not storytelling.
