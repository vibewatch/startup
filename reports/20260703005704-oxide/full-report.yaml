      - number: '3.3'
        title: Pricing, Switching Costs, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Oxide's commercial message is unusually crisp: one-time infrastructure purchase, no recurring software
              license, no egress fees, and unlimited workload usage within installed capacity. That pitch is attractive
              to buyers fleeing VMware subscription resets or public-cloud metering, but it also means Oxide asks
              customers to commit capital and physical-space planning up front. HPE GreenLake and Dell APEX openly
              counter that weakness with pay-per-use, subscription, or financed monthly-installment options; Azure Local
              remains Azure-linked; Nutanix emphasizes software-style licensing; and AWS Outposts keeps buyers inside
              the AWS operating and billing model. In other words, Oxide's packaging is more transparent on total
              control and less flexible on near-term budget shape.  Distribution power compounds the pricing gap. Dell,
              HPE, Microsoft, Amazon, and Nutanix all arrive with large field organizations, established partners, and
              support histories. Oxide's public distribution surface is materially narrower: Carahsoft opens an
              important federal route, and the CoreSite partnership creates a colocation and proximity option, but those
              are not the same as a global channel machine. Switching costs therefore cut both ways. VMware and DIY
              incumbency create pain that can open the door for Oxide, yet a full-rack purchase also means losing a
              bake-off can push Oxide out of a customer for an entire refresh cycle.
