      - number: '1.5'
        title: Customer segments, early traction, and adverse signals
        blocks:
          - type: paragraph
            body: >
              Oxide targets three primary verticals identified directly by CEO Steve Tuck at Cloud Field Day 20: federal
              agencies, financial services firms, and cloud SaaS operators. Named reference accounts as of the run date
              include Idaho National Laboratory (INL, announced at GA in October 2023), Lawrence Livermore National
              Laboratory (LLNL, announced in a blog post dated November 2024), Switch (the data center and colocation
              company, deploying Oxide for its internal cloud platform, announced via Data Center Dynamics in 2024),
              Jump Trading (a quantitative trading firm, shown on Oxide's homepage), and Stoke Space (a launch vehicle
              company, also shown on the homepage). A global financial services firm was named at GA without being
              identified, and Oxide's CoreSite partnership announced in April 2024 placed a rack at the CoreSite Silicon
              Valley SV2 data center, consistent with enabling co-located financial customers. The federal channel is
              supported by NDAA, BAA, and TAA compliance and availability via Carahsoft, GSA, SEWP, and OTA procurement
              pathways. Blocks & Files, visiting Oxide's headquarters in mid-2024, reported that the company had shipped
              "under 20 racks" at that point, with most deployed as single-unit installations at customer sites — an
              early but real commercial footprint. The adverse-signal layer is limited but material: Oxide is a
              capital-intensive hardware business operating at a very early commercial scale; the company has not
              disclosed ARR, revenue, gross margin, or headcount; the total rack count as of the Series C close in
              February 2026 is not publicly stated; and the supply chain challenges inherent in building custom server
              hardware from scratch during COVID — documented in Oxide's own supply chain blog — represent an ongoing
              operational risk for a company still growing its manufacturing capacity. The LLNL deployment also
              highlights that sovereign and federal customers have long project timelines, meaning contract conversion
              and revenue recognition will lag customer announcements by months to years.
