      - number: '1.3'
        title: Funding history, capital structure, and investor narrative
        blocks:
          - type: paragraph
            body: >-
              Oxide's financing story is one of deliberate, milestone-driven capital raises against a backdrop of
              genuine technical risk. The company raised seed financing from Eclipse Ventures before the product
              existed, with Intel Capital, Riot Ventures, Counterpart Ventures, and Rally Ventures joining the $44
              million Series A in October 2023 — the same event that announced general availability of the first
              commercial cloud computer. The total raised at that point was $78 million, confirming approximately $34
              million in pre-Series-A funding. The Series B of $100 million was announced on July 30, 2025, led by new
              strategic partner USIT (Thomas Tull's US Innovative Technology Fund) with all existing investors
              participating; the company's own blog noted that the $100 million Series B more than doubled total capital
              raised to that date, which it placed at $89 million. The discrepancy between $78 million (HPCWire) and $89
              million (company blog) most likely reflects interim financing activity between October 2023 and July 2025
              not separately announced. The Series C of $200 million closed in February 2026, again led by USIT with
              Eclipse, Riot Ventures, Jane Street, and other existing investors. The Series C blog is explicit that the
              round was not driven by business need — Oxide claimed to have achieved real product-market fit and
              positive unit economics — but by an investor desire to de-risk long-term capital access and support
              manufacturing scale-up. With $89 million pre-Series-B plus $100 million Series B plus $200 million Series
              C, total raised through February 2026 stands at approximately $389 million. Official company and investor
              round announcements still did not publish share price or dilution terms, but Forge Global later listed the
              February 2026 Series C at roughly $1.62 billion post-money based on private-market records. That estimate
              is directionally useful for confirming Oxide's unicorn status, but it is not a substitute for the actual
              cap table or financing documents.
