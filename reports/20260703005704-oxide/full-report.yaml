  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Direction
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - thesis
        - Federal and sovereign infrastructure is a real early wedge.
        - >-
          Carahsoft, Oxide public-sector materials, and Tech Field Day all point to federal, financial, and cloud SaaS
          buyers with procurement or compliance urgency.
        - >-
          Pipeline evidence shows the federal channel is mostly exploratory and not converting to multi-rack repeat
          deployments.
      - - thesis
        - VMware-exit and private-cloud demand create timely market pull.
        - >-
          Broadcom survey data, ReadyWorks, and Oxide migration messaging all point to active workload repatriation and
          private-cloud prioritization.
        - >-
          Broadcom- and VMware-driven migration budgets prove temporary, while CIO evidence of selective optimization
          dominates actual purchase behavior.
      - - thesis
        - Rack-scale hardware-software co-design can justify premium economics if proven.
        - >-
          Oxide highlights second-generation compute, integrated control plane, no egress, no hypervisor tax, and
          power-efficiency gains versus legacy racks.
        - >-
          Audited gross margin and renewal / expansion behavior fail to show software-like economics or durable
          control-plane monetization.
      - - anti-thesis
        - Commercial scale is still early.
        - >-
          Blocks & Files reported under 20 racks shipped by mid-2024 and said most deployments were still single-rack
          installations.
        - Public evidence shows clear acceleration to fleet-sized repeat orders and materially larger installed base.
      - - anti-thesis
        - Public valuation support is missing at exactly the point where investment discipline begins.
        - >-
          No reviewed public source discloses Oxide revenue, gross margin, backlog quality, cap-table preferences, or
          Series B/C post-money valuation.
        - Management discloses audited revenue, gross margin, backlog, and the actual round price.
      - - anti-thesis
        - The market is competitive and repatriation is not wholesale.
        - >-
          CIO.com characterizes repatriation as selective optimization, and AWS / Azure already offer on-prem cloud
          extensions that cap Oxide’s uniqueness.
        - >-
          Customer proof shows Oxide winning consistently against hyperscaler on-prem offerings and converting those
          wins into multi-rack expansion.
    notes: >-
      The anti-thesis is intentionally evidence-based and reflects real commercialization and pricing risks, not generic
      venture skepticism.
