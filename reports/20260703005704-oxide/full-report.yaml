      - number: '5.2'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >
              The strongest public evidence in this chapter is architectural. Oxide's own docs describe a rack loosely
              based on OCP ORV3 with hot-pluggable cubbies, front-serviceable cabling trenches, low-voltage DC bus-bar
              power distribution, dual switches, and per-board hardware roots of trust plus embedded service processors.
              Networking is not described as a simple top-of-rack bridge: the docs explicitly identify project-scoped
              VPCs, Geneve-based encapsulation, Delay Driven Multipath routing, OPTE for firewalling/routing/NAT, and
              Tofino 2 boundary services.

              The public repo surface fills in the software layers. Omicron is the rack control plane; Helios is the
              illumos distribution that powers the rack; Propolis is the bhyve-based VMM operated through REST APIs;
              Crucible is the replicated block-storage service; Hubris is the embedded operating environment used for
              reliability-oriented low-level control. That combination makes Oxide's architecture unusually inspectable
              for a hardware company. What remains opaque is not the broad stack layout, but internal design documents,
              external security audits, and mature production-operability metrics.
