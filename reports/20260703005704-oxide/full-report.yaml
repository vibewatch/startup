  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              Oxide is not merely selling against another startup. The company is asking buyers to replace several
              entrenched ways of solving the same job: VMware-centered virtualization stacks, Nutanix-style HCI,
              hyperscaler on-prem extensions such as AWS Outposts and Azure Local, consumption-led hybrid-cloud
              platforms such as HPE GreenLake and Dell APEX/VxRail, and the status-quo internal-build approach of
              stitching together servers, storage, networking, and operations tooling. Oxide's own VMware-alternative
              and hybrid-cloud pages explicitly place the offer against VMware, Nutanix, OpenStack, and public cloud
              rather than against a single hardware OEM. That broad competitive set matters because procurement paths
              differ by buyer.  Federal and regulated buyers may value sovereignty, attestation, and domestic
              procurement pathways enough to consider Oxide against public-cloud alternatives. Financial-services and
              cloud-operator buyers care more about low-latency control, predictable economics, and the ability to run
              modern APIs on infrastructure they own. Enterprises already standardized on VMware or Nutanix will compare
              Oxide against migration friction, existing staff knowledge, and incumbent support relationships, not only
              against technical merit. The strategic conclusion is that Oxide's battlefield is refresh-cycle and
              migration-cycle driven: it wins when the buyer is already paying a switching-cost event and can reconsider
              the full stack.
