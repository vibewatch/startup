      - number: '4.3'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >
              Oxide's financing posture improved materially between mid-2025 and early-2026, but the public record still
              does not support a clean liquidity underwrite. Management said in the Series B post that the company had
              raised $89 million before that round, then added $100 million in July 2025 and another $200 million in
              February 2026. The stated use of capital in Series B was not simply to fund operating losses; Oxide tied
              the round to manufacturing scale, system scale, operations scale, and roadmap scope. The Series C post
              went further, arguing that the company did not need capital to support the business and that
              product-market fit in a physical business requires getting manufacturing, inventory, cash-conversion, and
              supply-chain dynamics right. Management framed the larger round as de-risking capital access and assuring
              independence.

              Those statements are directionally positive for capital adequacy, but they are still not a balance sheet.
              Oxide discloses no cash on hand, no gross or net burn, no working-capital swing, no debt schedule, and no
              runway target. That matters more for Oxide than for a software-only startup because a rack business can
              absorb cash through component procurement, inventory, and field deployment well before revenue collection
              is visible externally. Public incumbents such as Dell provide filing-grade disclosures through Form 10-Ks;
              Oxide does not. The practical conclusion is that financing dependency is probably lower than it was before
              the two large rounds, but the timing of any next financing need still cannot be tested from public
              sources.
