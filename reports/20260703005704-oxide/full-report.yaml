      - number: '8.2'
        title: Thesis, Anti-Thesis, and Comparable Anchors
        blocks:
          - type: paragraph
            body: >-
              The pro-valuation case starts with a real market wedge. Oxide is not selling generic servers; it is
              positioning around sovereign and regulated workloads, VMware displacement, financial-services latency
              requirements, and AI data infrastructure that customers want to own outright. Carahsoft shows real federal
              procurement paths, Tech Field Day captures a concrete buyer segmentation around federal, financial
              services, and cloud SaaS, and Oxide's own product pages make a consistent argument around one-time
              purchase economics, no egress fees, hardware-software co-design, and second-generation compute. Broadcom's
              2025 private cloud survey and ReadyWorks' repatriation summary reinforce that the demand backdrop is
              favorable, especially for buyers reconsidering VMware or public-cloud cost structures.


              The anti-thesis is equally important. CIO.com explicitly argues that repatriation is selective
              optimization rather than wholesale retreat from cloud, which is a direct warning against heroic TAM
              assumptions. Blocks & Files reported fewer than 20 racks shipped as of mid-2024 and said most deployments
              were still single-rack installations; that is meaningful commercial proof, but it is not late-stage scale.
              Oxide also operates in a market where serious incumbents already exist: Nutanix and Pure Storage trade at
              software-like revenue multiples, while Dell and HPE trade on much lower hardware-oriented multiples. Those
              public comps create a realistic valuation corridor of roughly 1.7x to 6.2x revenue. Oxide only deserves
              the top end of that corridor if future disclosures show software-like margins, repeat expansion, and
              durable control-plane value rather than a mostly hardware revenue mix.
