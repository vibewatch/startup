  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and GTM Motion
        blocks:
          - type: paragraph
            body: >
              Oxide's public commercial model is unusually clear in form but opaque in amount. The company markets the
              Oxide Cloud Computer as an owned rack-scale system rather than a rented service: its homepage,
              VMware-alternative page, HPC page, and public-sector procurement materials all emphasize one-time
              infrastructure purchase, no licensing fees, no consumption billing, and customer ownership of the rack.
              That positioning strongly suggests a revenue model dominated by upfront hardware-system sales, with the
              control plane, updates, and much of the software value bundled into the contract rather than sold as a
              separately metered subscription. Public list pricing is absent, however, so realized ASP, discounting,
              payment terms, and any carveout for support or professional services remain unknown.

              Public GTM evidence points to a direct enterprise motion, not a broad reseller channel or self-serve
              model. Blocks & Files reported that Oxide has no OEM story and chooses who it ships to, while the Series B
              post said enterprise sales cycles are “infamously long” even as early customers moved from first
              conversation to delivered system faster than expected. Oxide also credits podcasts, documentation, RFDs,
              and source code for helping create demand, implying unusually technical inbound lead generation. Recent
              FAQ Friday posts add more detail: Oxide publishes SDKs, a Go-based integration path for Terraform and
              Packer-style tooling, CI/CD runner guidance, Windows-instance support, and Kubernetes integrations, which
              lowers technical evaluation friction for platform teams. Carahsoft and CoreSite matter, but as procurement
              and deployment enablers layered onto direct selling rather than replacements for it. That combination is
              consistent with high-touch, high-ACV infrastructure sales rather than software-led land-and-expand at
              internet scale. Oxide's own FAQ on why companies move workloads on-prem also mirrors the broader
              CIO/Broadcom narrative: steady workloads, egress cost, regulation, sovereignty, and latency remain the
              primary economic and technical triggers.
