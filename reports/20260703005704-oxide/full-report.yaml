  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Oxide's funding trajectory clearly accelerated in 2025 and 2026. The company disclosed a $100M Series B
              and said it had raised $89M over the prior six years before that round; third-party coverage then reported
              a $200M Series C less than a year later, led by the U.S. Innovative Technology Fund. That is real
              financing momentum and it matters: the new capital was explicitly framed around manufacturing scale,
              customer support, and roadmap expansion rather than survival capital. The public record is no longer
              completely blank on valuation either. Forge Global now lists Oxide's February 2026 Series C at roughly
              $1.62B post-money, which is directionally important because it confirms unicorn status and gives investors
              a current price anchor. But the official company and investor announcements reviewed still do not disclose
              the Series C share price, dilution, liquidation preferences, or the exact share count behind that mark.
              Third-party capital tallies also continue to conflict: DCD says Oxide has raised $378M across four rounds,
              Owler says $356.0M, and the official Series B post implies $389M after the later $200M financing. The
              direction is clear — Oxide is well-capitalized — but the exact capital history and financing terms are
              still not fully reconciled from public evidence.


              That incompleteness makes entry discipline more important, not less. Public evidence can support a
              scenario framework and a rough current mark, but it still cannot justify a price-insensitive buy. The key
              question is not whether Oxide is interesting; it is whether a ~$1.62B post-money mark can be defended from
              public-company multiples and verified operating data. Until management discloses revenue, gross margin,
              backlog quality, and the actual preference stack, the prudent stance is to keep the company in
              research-more / track territory and refuse to underwrite narrative alone.
            claimRefs:
