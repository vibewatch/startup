  - id: FE001
    title: Oxide Product Architecture Map
    type: stack
    layout: wide
    summary: >
      Six-layer view of the Oxide stack from operator interfaces down to rack mechanics and secure management, combining
      official docs with public repo evidence for the major software components.
    data:
      layers:
        - label: Operator and automation surface
          detail: API, CLI, web console, Terraform, Packer, and workflow integrations such as GitHub Actions and GitLab CI.
          items:
            - REST API
            - CLI / console
            - Terraform provider
            - Packer
        - label: Control-plane layer
          detail: >-
            Omicron components coordinate setup, orchestration, DNS, gateway services, telemetry, and technician-port
            recovery.
          items:
            - Nexus
            - Sled Agent
            - DNS / Gateway
            - Oximeter / Wicket
        - label: Workload services layer
          detail: Rack-native VM, disk, VPC, and metrics abstractions expose the cloud-like interaction model.
          items:
            - Propolis VMM
            - Crucible block storage
            - VPC / OPTE / Geneve
            - Metrics API
        - label: Host and sled layer
          detail: Helios powers the host environment while compute sleds provide CPU, memory, and NVMe resources.
          items:
            - Helios
            - 1st / 2nd Gen sleds
            - AMD EPYC 9005
            - NVMe bays
        - label: Secure management layer
          detail: >-
            Board-level hardware root of trust and embedded service processors replace the traditional BMC-centric
            design.
          items:
            - Hardware root of trust
            - Embedded service processor
            - Signed / measured boot chain
        - label: Rack and facility layer
          detail: Rack-scale mechanics, DC power distribution, and dual-switch networking anchor the physical operating model.
          items:
            - ORV3-inspired rack + cubbies
            - DC bus bar / power shelves
            - Dual Tofino 2 switches
            - Facility power + uplinks
