      - number: '2.5'
        title: Constraints, Adverse Signals, and Sizing Gaps
        blocks:
          - type: paragraph
            body: >
              Oxide's near-term market penetration faces structural constraints. Most acutely, Oxide had shipped fewer
              than 20 racks as of mid-2024 — the most recent independently confirmed figure. Even assuming aggressive
              ramping after the $100M Series B (July 2025) and $200M Series C (February 2026), the company's
              manufacturing capacity and commercial scale remain a fraction of Nutanix (~3,000+ enterprise customers),
              Dell (VxRail widely deployed), or HPE GreenLake. Winning a single federal agency may consume months of
              sales and integration work and yield one rack at a single site.

              The repatriation trend is real but selective. CIO.com's 2025 analysis — drawn from IDC 2024 data —
              characterizes cloud repatriation as "selective optimization within a wider workload placement discipline,
              not a retreat from the cloud." Most enterprises expect some repatriation, not wholesale exit, which limits
              the addressable repatriation-driven TAM. This directly contradicts Oxide's most optimistic TAM framing and
              is preserved as a material disconfirming signal.

              Capital intensity is a buyer-side constraint. An Oxide rack requires a hardware purchase commitment —
              there is no monthly subscription model as of the run date. For budget- constrained buyers accustomed to
              cloud's operational-expense model, the capital commitment is a barrier, even when TCO favors Oxide over
              three to five years. Hardware sales cycles are longer than software subscription sales, and evaluation
              periods (POC deployments) require physical infrastructure commitment. Incumbents — Nutanix, Dell VxRail,
              HPE GreenLake, AWS Outposts, and Azure Local — all offer more flexible commercial terms and wider support
              ecosystems. No independent market sizing exists for Oxide's exact product category, making it impossible
              to validate any specific SOM estimate without additional proprietary data.
