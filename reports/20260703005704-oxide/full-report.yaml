  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current round valuation and price per share
        - No public source reviewed discloses Series B or Series C post-money valuation, share price, or dilution.
        - A valuation chapter cannot be price-sensitive without the actual price.
        - Management / lead investor diligence packet; board materials; cap-table extract.
      - - Audited revenue and gross margin
        - No public revenue, ARR, backlog, or gross-margin disclosure was found for Oxide.
        - These metrics determine whether Oxide belongs near hardware multiples or software multiples.
        - Audited financial statements; CFO diligence session; customer expansion cohort data.
      - - Backlog quality and expansion profile
        - Public evidence does not separate pilots from repeat or fleet-scale orders.
        - >-
          The biggest valuation question is whether Oxide is graduating from single-rack installs to scaled multi-rack
          rollouts.
        - Bookings waterfall; installed-base cohort analysis; renewal / expansion schedule.
      - - Customer concentration
        - Named customers exist, but public evidence does not quantify revenue or backlog concentration.
        - A small number of anchor accounts can create sharp downside if one program slips.
        - Top-10 customer schedule; segment concentration memo; reference calls.
      - - Manufacturing yield and warranty reserve
        - Public sources discuss manufacturing scale but provide no yield, returns, or warranty-reserve data.
        - Hardware businesses can destroy value at scale if manufacturing quality is weak.
        - Operations diligence; supply-chain review; warranty accrual and field-failure data.
      - - Preference stack and anti-dilution terms
        - Liquidation preferences, participating preferred terms, and anti-dilution rights are not public.
        - Enterprise value and common-equity return can diverge sharply if the preference stack is heavy.
        - Legal diligence on charter, stock purchase agreements, and cap table.
    notes: >-
      These asks are ordered around valuation relevance: price, revenue quality, scale conversion, concentration,
      manufacturing, then preference overhang.
    claimRefs:
      - CV005
      - CV041
      - CV046
      - CV049
      - CV051
