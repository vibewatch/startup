      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertically integrated hardware + software — genuine differentiation
            body: >
              Oxide is the only company in the market offering a fully co-designed rack-scale cloud computer with
              open-source firmware, OS, and control plane as a single purchasable product. The integration removes
              multi-vendor complexity and delivers the developer experience (APIs, multi-tenancy, self-service) that
              on-prem buyers previously could not get without building it themselves. This is hard to replicate quickly
              because it requires simultaneous expertise in hardware design, firmware, OS, networking, storage, and
              cloud-management software.
            calloutType: strength
            claimRefs:
              - CO023
              - CO030
              - CO033
          - type: callout
            title: Capital-intensive hardware business at very early commercial scale
            body: >
              With fewer than 20 racks shipped as of mid-2024 and no disclosed ARR or headcount, Oxide carries
              meaningful execution risk: manufacturing ramp-up, supply chain resilience, long federal/enterprise sales
              cycles, and the inherent challenge of growing a physical-product business to the scale needed to justify
              $389 M in cumulative capital raises. The Series C blog itself acknowledges that the biggest challenge for
              Oxide is time.
