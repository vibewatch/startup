              capital is accelerating a healthy ramp or simply buffering a still-fragile operating model. For investors,
              the answer is to convert the residual uncertainty into monitorable criteria. The chapter's trigger table
              focuses on events that would break the current thesis rather than merely slow it: loss of federal
              procurement eligibility, persistent severe incidents on the installed base, component or field-service
