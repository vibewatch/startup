companyProfile:
  summary: >-
    Oxide is an Emeryville, California infrastructure startup building an integrated rack-scale private cloud computer
    that combines compute, networking, storage, firmware, and a cloud-like control plane into a single on-premises
    system. Founded in 2019 by Steve Tuck and Bryan Cantrill, Oxide targets enterprises and regulated buyers that want
    public-cloud-style automation on owned hardware. The company raised a $200M Series C in February 2026 and
    secondary-market data later pointed to an estimated ~$1.62B post-money valuation, but revenue, margin, backlog, and
    detailed financing terms remain private.
