  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >
              Oxide's total addressable market sits at the intersection of on-premises data center infrastructure and
              cloud-platform software. The included spend spans rack-scale integrated compute-storage-networking
              systems, hyperconverged infrastructure (HCI) platforms, private cloud software stacks, VMware-replacement
              platforms, and sovereign or air-gapped cloud appliances. Excluded from the boundary are hyperscale public
              IaaS spending (AWS, Azure, GCP) which Oxide explicitly competes against as a status-quo substitute, pure
              colocation (customers only buy space and power), traditional rackmount servers sold without an integrated
              software control plane, and edge-computing appliances not designed for full private cloud workloads.

              Adjacent spend categories that form future expansion opportunities include federal IT modernization
              budgets, HPC cluster procurement, AI-inference on-prem deployments, and disaster-recovery or
              backup-appliance budgets where data sovereignty requirements drive a preference for owned infrastructure.
              The status-quo substitutes Oxide must displace vary by buyer: large enterprises currently build DIY stacks
              from Cisco UCS or Dell PowerEdge servers, VMware vSphere, and separate storage arrays; financially
              sophisticated buyers use Nutanix HCI; public-sector buyers rely on FedRAMP-authorized SaaS or aging
              on-prem systems; and some workloads have already migrated to hyperscale public cloud (AWS, Azure, GCP),
              which is a repatriation target rather than a direct product substitute. Hyperscalers also extend to
              on-prem with AWS Outposts and Azure Local (formerly Azure Stack HCI), making them both cloud substitutes
              and competing on-prem offerings.
            claimRefs:
