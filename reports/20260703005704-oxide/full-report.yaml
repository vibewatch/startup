      - number: '7.3'
        title: Operational, Security, and People Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Oxide is attempting a difficult combination: high-density hardware, custom software, and an
              enterprise support promise at a stage where the company is still openly hiring across field delivery,
              support engineering, and program management. The supply-chain blog and the Series C explanation both
              underscore that the company is exposed to long component lead times, inventory planning, and manufacturing
              scale-up. The rack itself is not lightweight infrastructure; the published power, thermal, and weight
              envelope means site readiness, replacement parts, and onsite remediation are all material parts of the
              customer experience. Security and reliability risk are also concentrated by design. Oxide's architecture
              puts control plane, firmware, host OS, VMM, and storage under one roof. That eliminates some multi-vendor
              blame-shifting, but it also means a defect or vulnerability can span more of the stack before a customer
              can route around it. Public repositories for Omicron, Hubris, Crucible, Propolis, and Helios show
              admirable transparency, but they also make clear that Oxide is carrying a broad software surface that must
              be staffed, patched, and coordinated. Support claims and current job postings mitigate this risk, yet they
