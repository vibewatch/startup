      - number: '8.3'
        title: Scenario Ranges and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Because Oxide still has not disclosed revenue or full round terms, the honest valuation method remains a
              scenario framework tied to public-comp multiples rather than a false-precision point estimate. The bear
              case uses hardware-like economics: if audited revenue is only $50M-$100M and margins look more like
              integrated hardware than software, the relevant comp band is roughly 1x-2x sales, implying only about
              $50M-$200M of enterprise value. The base case assumes Oxide proves a blended infrastructure model with
              $150M-$250M of revenue and better but still mixed economics; that maps to roughly 3x-4x sales, or about
              $450M-$1.0B. The bull case assumes Oxide eventually discloses $400M-$600M of revenue with clearly
              software-like margins, strong multi-rack expansion, and sticky control-plane economics; only then does the
              5x-6x band from Nutanix and Pure Storage become relevant, implying roughly $2.0B-$3.6B. Against that
              framework, the publicly visible ~$1.62B Series C mark already sits above the base-case range and into
              territory that requires unusually strong future execution.


              That same framework explains why exit readiness is mixed. Product maturity, customer proof, and financing
              runway are credible. But IPO readiness is not just product readiness; it requires public-company reporting
              quality. Oxide still lacks publicly disclosed revenue, margin, backlog, customer concentration, and
              cap-table terms. The most plausible near-term exit milestone is therefore another private round or a
              strategic financing event that comes with fuller disclosure, not an immediate IPO. Public evidence
              supports the view that Oxide is progressing toward a larger outcome; it does not yet support the view that
              the ~$1.62B mark is cheap on disclosed fundamentals.
