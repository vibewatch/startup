  topStrengths:
    - >-
      Vertically integrated, open-source-firmware rack architecture is a real technical moat with few close commercial
      equivalents.
    - Federal procurement compliance and channel access through Carahsoft create a credible funded-buyer wedge.
    - >-
      A $200M Series C and secondary-market unicorn valuation signal strong investor support for long-term manufacturing
      and product expansion.
  topRisks:
    - >-
      The roughly $1.6B Series C mark is supported mainly by secondary-market data while revenue, gross margin, backlog,
      and customer concentration remain undisclosed.
    - >-
      Under-20 racks shipped by mid-2024 exposes severe execution risk; complex hardware/software integration at
      manufacturing scale remains unproven at volume.
    - >-
      Hyperscaler and private-cloud incumbents benefit from procurement leverage and engineering resources that
      materially exceed Oxide's.
  unresolvedGaps:
    - Audited revenue, gross margin, backlog, and ARR to test whether the ~$1.6B mark is justified.
    - Total racks shipped as of 2026, customer count, customer concentration, and NDA-lifted reference customers.
    - >-
      Official Series C share price, dilution, and preference stack; public valuation references remain secondary-market
      estimates.
