  rows:
  - - Federal secure virtualization
    - Agencies often inherit multi-vendor on-prem stacks plus VMware licensing/compliance overlays
    - One rack with APIs, integrated networking, multitenancy, and customer-owned infrastructure in a secure facility
    - Official and partner pages say the system is fully integrated, owned outright, and can be operational within hours
