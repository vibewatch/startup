  rows:
  - - ORV3-inspired rack + cubbies
    - Mechanical housing and service model for sleds
    - Depends on rack-scale enclosure, hot-plug cubbies, and front-serviceable cable trenches
    - Docs explicitly describe hot-pluggability and front serviceability
    - No public field-service MTTR data
  - - Power shelf + DC bus bar
    - Rack-level power conversion and distribution
    - Requires facility three-phase power and Oxide power shelf controller
    - Oxide says centralized DC conversion removes many legacy AC supplies and balances load across phases
    - Efficiency claims are company-generated, not independently audited
  - - Dual switches + Tofino 2 fabric
    - Internal and boundary networking
    - Depends on backplane plus external uplinks
    - Docs say each sled connects to both switches for high availability
    - No public switch rollback / lifecycle policy
  - - Service processor + hardware root of trust
    - Secure low-level management and boot validation
    - Depends on embedded firmware and board-level security primitives
    - Docs replace the traditional BMC with an embedded service processor
    - No external attestation audit fetched
  - - Helios host OS
    - Runs the rack host environment
    - Depends on illumos distribution plus Oxide-specific additions
    - Helios documents a committed image-archive interface for Omicron usage
    - Some firmware-related consolidations remain non-public
  - - Propolis VMM
    - Runs VMs on the host OS
    - Operated by Omicron over REST APIs and illumos bhyve interfaces
    - Public repo documents live migration primarily on AMD hosts
    - Repo says interfaces are not committed as public external APIs
  - - Crucible storage service
    - High-availability network-replicated block storage
    - Depends on upstairs/downstairs replica topology and rack network
    - Repo describes distributed replicated storage for VMs; storage page adds snapshots and validation
    - Public performance and recovery evidence is limited
  - - Omicron control plane
    - API, orchestration, telemetry, setup, and service coordination
