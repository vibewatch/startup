- calloutType: insight
  title: Developer transparency is unusually strong
  body: 'Oxide publishes product docs, a broad GitHub surface, OpenAPI artifacts, and operator tooling in a way that is uncommon for infrastructure vendors, and management explicitly says that transparency helped shorten enterprise sales cycles.

    '
  claimRefs:
  - CE018
  - CE019
  - CE024
  - CE042
  - CE043
- calloutType: risk
  title: Operational proof still lags design depth
  body: 'Public architecture evidence is strong, but public proof on uptime, SLA-backed support, warranty/spares, large-scale manufacturing execution, and formal security certifications is still materially thinner than the product narrative.

    '
  claimRefs:
  - CE031
  - CE038
  - CE044
  - CE045
  - CE046
