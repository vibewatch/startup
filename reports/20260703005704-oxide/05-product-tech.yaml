    - OpenAPI artifacts and live-tests are published in the repo
    - Some control-plane RFDs are not public
  - - Terraform provider + CLI
    - Automation surface for projects, instances, disks, and networks
    - Depends on Oxide host/token/profile auth and public API endpoints
    - Provider docs prefer env-var auth and example-based adoption
    - Public module ecosystem and policy guardrails are still sparse
