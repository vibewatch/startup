- id: deployment-integration-reliability-and-roadmap
  title: Deployment, Integration, Reliability, and Roadmap
  body: 'Deployment speed is central to Oxide''s pitch, but the supportable claim is a range rather than a contractual promise. Official pages say the system can be operational within two hours, while independent coverage describes install-to-developer availability in a matter of hours and quotes four hours in one launch article. The common thread is that Oxide ships a fully assembled rack with software included, not that it publishes a firm deployment SLA. Integration evidence is broader and stronger: fetched pages show REST API, CLI, console, Terraform provider, Packer, GitHub Actions, GitLab CI, OpenShift, Rancher, Kubernetes-adjacent workflows, Flux, Slurm, Jupyter, Prometheus, and Grafana.

    Reliability evidence is mixed. On the positive side, storage pages document three-way mirroring, snapshots, checksumming, and continuous validation; docs show dual-switch attachment and a hardware-rooted management model; and the Series B post says Oxide has already delivered software updates and customer-requested features in the field. On the weak side, no fetched source publishes uptime history, public incident reporting, sparing policy, or support-response commitments. Roadmap evidence is therefore strongest on scale — manufacturing, operations, customer support, and broader roadmap scope — and weakest on a detailed public release calendar.

    '
