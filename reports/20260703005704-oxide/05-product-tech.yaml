callouts:
- calloutType: strength
  title: Vertical integration is the core moat
  body: 'The most credible Oxide differentiation is not a single benchmark but the fact that public materials consistently show ownership of the board, service processor, host OS, hypervisor, switch/runtime, storage service, and control plane as one rack-scale product.

    '
  claimRefs:
