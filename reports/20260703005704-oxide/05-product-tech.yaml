chapter:
  number: 5
  title: Product & Technology
  summary: 'Oxide Computer Company delivers a fully integrated on-premises "Cloud Computer": one rack that bundles compute, storage, networking, firmware, host OS, hypervisor, and control plane behind VM- and API-driven workflows. Public technical evidence is unusually deep for an infrastructure startup — product specs, Oxide docs, GitHub repos, and a Red Hat validation page all expose material architecture details — but public proof remains thin on formal security certifications, uptime history, warranty/SLA specifics, and large-scale manufacturing support execution.

    '
sections:
- id: product-definition-and-module-map
  title: Product Definition and Module Map
  body: 'Oxide''s product is not a server SKU family in the ordinary OEM sense; it is sold as a complete rack-scale cloud system that brings together compute, storage, networking, and the operating software required to provision and run workloads. The workflow is explicit in the fetched material: the rack arrives assembled, the operator provides power and network links, boots the system through technician ports, and then moves into web console, CLI, API, Terraform, or other automation-driven provisioning. That makes the buyer job closer to "own a private cloud" than "assemble a rack."

    Public pages also show that Oxide is trying to solve several adjacent jobs with the same platform rather than with separate products: VMware replacement, federal sovereign infrastructure, AI/data engineering, HPC operational services, and hybrid-cloud repatriation. The module map is therefore best described as one core rack with layered compute, storage, networking, control-plane, and workload overlays. What is supportable from public evidence is the product boundary and the currently exposed modules, not a full internal SKU catalog or quoting matrix.

    '
