  - - VMware exit / legacy hypervisor replacement
    - Per-core licensing, ELA renewals, broker software, and brittle operational sprawl
    - Integrated hypervisor + control plane with REST API, Terraform, Packer, and no separate system-software subscription
    - Oxide positions existing VM workloads as day-one compatible and removes subscription licensing for the stack itself
    - Public migration tooling depth and support commitments are not disclosed
  - - HPC operational services
    - HPC centers need secure VMs, databases, Jupyter, and orchestration beside batch jobs
    - Same rack supports self-service APIs, multitenancy, and Flux/Slurm/Jupyter-friendly workflows
    - LLNL frames Oxide as a proving ground for secure multi-tenancy and cloud-like services alongside HPC
    - No public benchmark pack or DR runbook was fetched
