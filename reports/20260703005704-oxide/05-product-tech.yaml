  evidenceGaps:
  - type: missing-source
    severity: material
    topic: formal-certifications
    missingEvidence: Independent evidence of FedRAMP, SOC 2, ISO 27001, or FIPS validation for the product or its operating environment.
    whyItMatters: Federal, defense, and other regulated buyers usually need more than marketing language around trust and provenance before underwriting deployment risk.
    diligencePath: Request the latest compliance matrix, any audit letters, pending authorization packages, and product-level crypto / platform validation mappings.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: reliability-history
    missingEvidence: Uptime history, incident summaries, failure-rate data, and any public or private status-page record for deployed systems.
    whyItMatters: The design-level reliability story is credible, but investors still need operating-history evidence to assess field resilience and support burden.
    diligencePath: Ask Oxide for install-base uptime, major incident log, storage/network failure metrics, and customer-reference discussions focused on production operations.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: support-sla
    missingEvidence: Support handbook, hardware warranty terms, response-time commitments, sparing policy, and replacement / RMA process documentation.
    whyItMatters: Hours-scale deployment and a direct-sales model matter less if the company cannot support production racks with clear field-service commitments.
    diligencePath: Obtain the standard support contract, warranty language, field-service playbook, and any metrics on install-base support responsiveness.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: roadmap-granularity
    missingEvidence: A dated product roadmap or release calendar beyond capital-allocation statements and already-shipped update anecdotes.
    whyItMatters: Public evidence shows that Oxide is scaling product and support functions, but not which features or platform capabilities ship next and when.
    diligencePath: Request a 12- to 18-month roadmap, historical shipped-vs-planned release record, and customer-facing lifecycle / deprecation policy.
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: manufacturing-scale
    missingEvidence: Lead times, supplier concentration, yield / defect rates, spare-part inventory policy, and installation-capacity metrics.
    whyItMatters: Oxide's roadmap credibility depends on physical execution, not only software progress, and the fetched set does not show those operating KPIs.
    diligencePath: Request an operations KPI pack, supplier risk review, backlog / lead-time data, and references from multi-rack or repeat-deployment customers.
    relatedTableRefs:
    - TE005
