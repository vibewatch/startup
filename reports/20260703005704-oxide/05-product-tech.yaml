- id: differentiation-and-trust-controls
  title: Differentiation and Trust Controls
  body: 'Oxide''s most supportable differentiation is not a single feature claim but the depth of full-stack ownership. The Series B post explicitly says the company built its own board designs, microcontroller operating system, platform-enablement software, hypervisor, switch and switch runtime, integrated storage service, and control plane. The public docs and repos corroborate much of that stack, while the power-efficiency blog and supply-chain post show that Oxide also treats rack mechanics, power distribution, and supplier management as proprietary operating know-how rather than commodity integrations.

    Trust and compliance evidence is meaningful but incomplete. Official and partner pages claim secure boot, a hardware root of trust, component attestation, signed firmware, encryption at rest and in transit, multitenant isolation, and NDAA/BAA/TAA compliance. Red Hat adds a concrete third-party validation for RHEL 9.4-9.x on x86_64. At the same time, no fetched public artifact shows FedRAMP, SOC 2, ISO 27001, FIPS validation, or a public status page. Helios also states that some firmware-related consolidations remain non-public, which weakens any blanket claim that the low-level stack is already fully open.

    '
