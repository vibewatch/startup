    - Public pages do not disclose GPU SKUs, throughput benchmarks, or scheduler detail
  - - Hybrid/private-cloud operations
    - Traditional racks require many vendors and shift blame across support boundaries
    - One integrated compute/storage/networking/software platform with API, CLI, and console access
    - Homepage promises transparent systems with rich telemetry and easier supportability
    - No public SLA, sparing policy, or warranty document was fetched
