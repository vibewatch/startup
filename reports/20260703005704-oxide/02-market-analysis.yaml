  rows:
  - - VMware-exit pressure from Broadcom licensing restructuring
    - Tailwind
    - Immediate (2023–2026)
    - Opens VMware-installed base to evaluation; Oxide's VMware-exit solution page directly addresses this cohort
    - Quantify how many enterprise VMware seats are actively evaluating replacements in 2026
  - - Cloud repatriation driven by cost and sovereignty concerns
    - Tailwind
    - Near-term (2024–2027)
    - Supports Oxide's 'cloud you own' positioning; 83% of CIOs planned some repatriation in 2024
