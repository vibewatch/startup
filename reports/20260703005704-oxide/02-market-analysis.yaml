figures:
- id: FM001
  title: Market Sizing Pyramid — On-Prem Private Cloud TAM / SAM / SOM
  type: pyramid
  layout: standard
  summary: 'Three-layer sizing showing how the broad on-premises hardware market narrows to the modern private cloud platform layer and further to Oxide''s directly addressable wedge of vertically integrated rack-scale cloud computers. All values are estimates with low confidence; no independent analyst publishes this sub-segment.

    '
  data:
    items:
    - label: Global On-Prem Infrastructure Hardware (Broad TAM)
      value: 105
      unit: $B/yr (2024 est.)
      color: '#1a3a5c'
      tooltip: 'Midpoint of $80B–$130B estimated annual on-premises server, storage, and networking hardware spend globally. Over-inclusive: includes commodity servers Oxide does not compete for.'
    - label: Private Cloud Platform / HCI Layer (SAM)
      value: 15
      unit: $B/yr (2024 est.)
      color: '#2563a8'
      tooltip: Midpoint of $8B–$22B estimated annual spend on software-defined HCI, private cloud management platforms, and converged infrastructure. Anchored to Nutanix ARR proxy + market-share inference.
    - label: Rack-Scale Integrated Cloud Systems (Oxide SOM)
      value: 2.5
      unit: $B/yr (est. 2024–2026)
      color: '#3b82f6'
      tooltip: Midpoint of $1B–$5B estimated annual spend on vertically integrated, API-first rack systems targeting VMware-exit, sovereign cloud, AI/HPC, and federal workloads. No independent analyst publishes this figure.
  approximationNotes: 'TAM uses midpoint of range derived from public hardware vendor revenues and industry estimates. SAM uses Nutanix ~$2.1B ARR ÷ assumed 10–25% market share, giving a $8.4B–$21B range (midpoint ~$15B). SOM is analyst inference; confidence is low. Numbers are order-of-magnitude estimates, not forecasts.

    '
