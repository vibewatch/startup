  - - Hyperscaler On-Prem Extensions
    - AWS Outposts, Azure Local (Azure Stack HCI), Google Distributed Cloud; public cloud extended to on-prem racks
    - Software-only remote management; edge appliances; IoT gateways
    - CIO / Cloud Architect; payer is cloud services budget (usually OpEx)
    - Competing category; locks customers into hyperscaler APIs and billing; less sovereign than Oxide
  - - Sovereign Cloud / Federal IT
    - Government-controlled cloud infrastructure, air-gapped deployments, FIPS-compliant hardware, hardware root-of-trust systems
    - Commercial SaaS running on shared hyperscaler infrastructure; public-cloud-hosted FedRAMP workloads
    - Agency IT Program Manager, DoD CIO, IC infrastructure teams; payer is agency capital and O&M budgets
    - High-priority Oxide vertical; accessible via GSA, SEWP, OTA; Carahsoft distribution channel
