- id: buyer-segmentation-and-personas
  title: Buyer Segmentation and Personas
  body: 'Oxide CEO Steve Tuck identified three primary buyer segments at Cloud Field Day 20: federal agencies, financial services firms, and cloud SaaS operators. These are supplemented by HPC and research computing programs, evidenced by Oxide''s dedicated HPC solution page and named anchor customer Idaho National Laboratory.

    Federal agencies — including DoD, civilian agencies, the intelligence community, and SLED (state/local/education) — are the highest-priority vertical for Oxide''s current commercial strategy. Drivers are unique: compliance requirements (NDAA, BAA, TAA), data sovereignty by statute, and procurement pathways via Carahsoft (GSA, SEWP, OTA) that reduce acquisition friction. Budget ownership sits with agency IT program directors and CIOs; capital budgets fund the hardware purchase. A federal customer noted to Oxide that their skilled security engineers were spending 60 percent of their time managing VMware licenses and BIOS updates rather than security projects — a direct adoption trigger.

    Financial services firms (quantitative hedge funds, banks, trading firms) drive demand from latency sensitivity, data sovereignty requirements, and regulatory audit trails. Jump Trading is named on Oxide''s homepage as a reference. Budget ownership is typically CTO- or CIO-led with IT capital and hardware depreciation in the infrastructure budget. Cloud SaaS operators — companies running their own multi-tenant cloud platforms — represent a third segment: Switch, the data center operator, was confirmed deploying Oxide for its internal cloud platform. HPC and research computing programs are characterized by batch-workload GPU density and self-service provisioning requirements.

    '
