    - GPU-dense racks, batch compute clusters, HPC schedulers (SLURM), research computing platforms
    - Cloud HPC-as-a-service (AWS HPC, Azure HPC); edge inference at IoT scale
    - Research Computing Director, CTO of quantitative finance firm, AI engineering leadership; payer is capex or research grants
    - Growth wedge; Oxide 2nd Gen Sleds (EPYC 9005 / Zen 5, AVX-512) explicitly target AI inference and HPC
  notes: Market boundary definitions are contested. Analysts include or exclude software, services, and colocation differently, making any single TAM number suspect. Oxide competes across all five rows but current commercial traction is strongest in the sovereign cloud / federal and financial services rows.
