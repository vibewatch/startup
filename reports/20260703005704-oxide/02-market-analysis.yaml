chapter:
  number: 2
  title: Market Analysis
  summary: 'Oxide Computer Company addresses the on-premises private cloud infrastructure market — enterprises and public-sector buyers that require cloud-grade APIs, self-service provisioning, and modern economics without sending workloads to a hyperscale public cloud. No analyst publishes a TAM specifically for rack-scale fully integrated cloud computers; estimates must be constructed from proxies. The broadest defensible frame — global on-premises server, storage, and networking hardware — sits at $80B–$130B annually, while the software-defined HCI and private cloud platform layer is estimated at $8B–$22B. Oxide''s serviceable subset (API-first, vertically integrated rack systems targeting VMware-exit, sovereign cloud, AI/HPC, and federal workloads) is narrower still, estimated at $1B–$5B. Three converging forces drive near-term demand: Broadcom''s VMware acquisition disrupted installed-base licensing, a 2025 Broadcom survey of 1,800 IT leaders found 53 percent prioritizing private cloud
    as their top deployment target, and 83 percent of enterprise CIOs planned on-prem repatriation in 2024 (Barclays). Key constraints are Oxide''s early commercial scale (under 20 racks shipped as of mid-2024), long hardware sales cycles, and deep-pocketed incumbents (Nutanix, Dell VxRail, HPE GreenLake, AWS Outposts, Azure Local). These conflicting signals — real demand pull alongside nascent supply — are preserved rather than resolved.

    '
sections:
- id: market-definition-and-boundary
  title: Market Definition and Boundary
  body: 'Oxide''s total addressable market sits at the intersection of on-premises data center infrastructure and cloud-platform software. The included spend spans rack-scale integrated compute-storage-networking systems, hyperconverged infrastructure (HCI) platforms, private cloud software stacks, VMware-replacement platforms, and sovereign or air-gapped cloud appliances. Excluded from the boundary are hyperscale public IaaS spending (AWS, Azure, GCP) which Oxide explicitly competes against as a status-quo substitute, pure colocation (customers only buy space and power), traditional rackmount servers sold without an integrated software control plane, and edge-computing appliances not designed for full private cloud workloads.

    Adjacent spend categories that form future expansion opportunities include federal IT modernization budgets, HPC cluster procurement, AI-inference on-prem deployments, and disaster-recovery or backup-appliance budgets where data sovereignty requirements drive a preference for owned infrastructure. The status-quo substitutes Oxide must displace vary by buyer: large enterprises currently build DIY stacks from Cisco UCS or Dell PowerEdge servers, VMware vSphere, and separate storage arrays; financially sophisticated buyers use Nutanix HCI; public-sector buyers rely on FedRAMP-authorized SaaS or aging on-prem systems; and some workloads have already migrated to hyperscale public cloud (AWS, Azure, GCP), which is a repatriation target rather than a direct product substitute. Hyperscalers also extend to on-prem with AWS Outposts and Azure Local (formerly Azure Stack HCI), making them both cloud substitutes and competing on-prem offerings.

    '
