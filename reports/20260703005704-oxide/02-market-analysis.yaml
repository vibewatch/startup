    - Verify GPU-dense sled availability timeline and pricing versus purpose-built HPC alternatives
  - - Data sovereignty and regulatory mandates (federal, EU, APAC)
    - Tailwind
    - Near-term (2025–2028)
    - Federal NDAA/BAA/TAA compliance and air-gap capability are design properties, not add-ons; high barrier to entry for competitors without US manufacturing
    - Confirm Oxide's air-gap / classified enclave certification timeline for IC customers
