    - CIO / CTO / IT Program Director; payer is enterprise or agency capital budget
    - Oxide's direct product; no incumbent sells a fully integrated rack-scale cloud computer at GA besides Oxide
  - - HCI / Private Cloud Software (adjacent incumbent)
    - Hyper-converged infrastructure platforms (Nutanix, VMware vSAN, Dell VxRail); software-defined storage and compute
    - Hardware-only resale without cloud-grade software; public IaaS; SaaS management tools only
    - CIO / IT Director; payer is IT capex budget
