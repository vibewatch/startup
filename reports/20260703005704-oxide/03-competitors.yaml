callouts:
- calloutType: insight
  title: Oxide wins the control-versus-convenience trade when sovereignty matters more than ecosystem breadth
  body: The core competitive pattern is asymmetric. Oxide is not broader than the incumbents; it is more opinionated. Buyers who primarily want financing flexibility, huge partner ecosystems, or minimal retraining will often prefer Dell, HPE, Nutanix, AWS, or Azure. Buyers who care most about owning the control plane, eliminating metered economics, and verifying the stack have a sharper reason to choose Oxide.
  claimRefs:
  - CP024
  - CP032
  - CP033
  - CP034
- calloutType: risk
  title: Distribution asymmetry is the main competitive risk, not lack of product differentiation
  body: Public evidence supports a differentiated product, but not yet a moat in go-to-market scale. Incumbents can answer Oxide with better financing, more familiar migration paths, and larger support organizations. The diligence priority is therefore win/loss and pipeline-conversion data, especially for VMware-exit and regulated-workload deals where Oxide should be strongest.
  claimRefs:
  - CP030
  - CP032
  - CP037
  - CP041
  - CP042
