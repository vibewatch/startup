- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Verifiable, open-source-heavy trust posture
    - Incumbents can mimic sovereign messaging while retaining broader support ecosystems
    - High
    - Validate whether buyer evaluations explicitly weight firmware transparency and root-of-trust evidence above catalog breadth
  - - One-time purchase with no metered usage or egress
    - Dell, HPE, Azure, and AWS counter with easier budget packaging and lower initial commitment
    - High
    - Request Oxide win/loss analysis for capex-sensitive deals and financing roadmap
  - - Integrated rack hardware + software simplicity
    - Nutanix and VMware-centric incumbents retain staff familiarity and migration inertia
    - High
    - Test whether Oxide migration tooling materially shortens VMware-exit projects versus incumbent alternatives
  - - Federal / sovereign positioning plus Carahsoft route
    - Large incumbents also pursue sovereign and regulated workloads with bigger field organizations
    - Medium
    - Measure federal pipeline conversion, procurement-cycle length, and how often Carahsoft creates unique access versus table stakes
  - - Custom hardware and supply-chain know-how
    - Manufacturing scale-up and component sourcing are harder than software-only expansion
    - Critical
    - Review supplier concentration, buffer inventory, contract manufacturers, and lead-time resilience under NDA
  - - Physical rack creates post-install stickiness
    - The same physicality lengthens sales cycles and makes losing one cycle costly
    - Medium
    - Obtain deployment-to-expansion cadence, renewal mechanics, and site-by-site expansion history from current customers
  notes: Severity ranks competitive durability risk, not enterprise risk in the abstract. Register focuses on factors that could erode Oxide differentiation even if product quality remains strong.
