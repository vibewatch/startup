  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unsupported-matrix-cells
    missingEvidence: Detailed public proof of parity or non-parity on DR, database services, lifecycle management, and broader enterprise platform functions across every competitor.
    whyItMatters: Without deeper product documentation or customer references, some capability cells must remain unknown rather than guessed.
    diligencePath: Request product deep dives, reference architectures, and customer deployment walkthroughs from Oxide and top alternatives; expand matrix only where direct evidence exists.
    relatedQuestionRefs:
    - QP018
  - type: private-evidence-only
    severity: material
    topic: public-pricing-opacity
    missingEvidence: Actual list prices, support terms, reserve-capacity minimums, and realized discounts for Oxide, Nutanix, AWS Outposts, Azure Local, HPE GreenLake, and Dell VxRail/APEX.
    whyItMatters: Packaging can be compared publicly, but underwriting relative TCO and budget friction requires quote-level pricing evidence.
    diligencePath: Collect live quotes or redacted customer contracts from each vendor and normalize them by rack, node, or workload over a 3- to 5-year horizon.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: post-2024-commercial-scale
    missingEvidence: A newer independently verified count of Oxide racks shipped, paying customers, win rates, or expansion motions after mid-2024.
    whyItMatters: Competitive durability depends heavily on whether Oxide has moved from niche proof to repeatable commercial scale.
    diligencePath: Request customer-count, shipment-count, and expansion data directly from management or corroborate with procurement records and partner references.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
