- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Offer
  - Contract model
  - Public price visibility
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - Oxide
    - One-time infrastructure purchase; usage inside installed capacity is not metered
    - No public list price in fetched pages
    - Integrated compute, storage, networking, APIs, and software stack; no recurring software license claimed
    - Realized discounts, maintenance terms, and support pricing undisclosed
    - Best for buyers optimizing multi-year TCO and sovereignty, but requires upfront capex and facility readiness
  - - Nutanix
    - Software-style platform licensing; capacity-based language appears on official platform pages
    - No public list price in fetched pages
    - HCI, virtualization, automation, storage, database and security adjacencies
    - List-vs-realized pricing and hardware bundle terms undisclosed
    - Flexible for software buyers, but licensing complexity can preserve platform lock-in
  - - AWS Outposts
    - AWS-linked service / capacity model rather than fixed one-time rack purchase
    - No public price on cited product page
    - Local AWS services, AWS APIs, integrated rack install
    - Quote structure and regional dependencies undisclosed in public page
    - Preserves AWS familiarity but keeps buyer inside AWS economics and operating model
  - - Azure Local
    - Azure-linked subscription model per cited alternatives literature
    - No public list price in fetched source set
    - Hybrid management for local apps and Azure integration
    - Exact list pricing and support bundles not public in cited pages
    - Appeals to Azure-native shops but reduces the clean break from cloud-linked licensing
  - - HPE GreenLake
    - Pay-per-use, subscription, or traditional purchase
    - No public list price in fetched pages
    - Hybrid-cloud management, private cloud, data, AI, and services overlays
    - Minimums, reserve capacity, and realized commercial terms not public
    - Most flexible budget shape among the compared incumbents; competes directly with Oxide on financing convenience
  - - Dell VxRail / APEX
    - Subscription-based or equal monthly installments over agreed term
    - No public enterprise list price in fetched pages
    - Turnkey private-cloud / HCI stack plus Dell financing and support motions
    - Realized enterprise discounting and VMware bundle terms not public
    - Strong for procurement comfort and budget smoothing, especially where VMware continuity matters
  notes: 'The competitive pricing signal is contract shape, not public list price: most enterprise offers remain quote-based. Unknowns are retained rather than back-filled from vendor-authored comparison pages.'
