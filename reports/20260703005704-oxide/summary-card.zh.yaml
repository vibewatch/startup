  topStrengths:
    - 垂直整合、开源固件的机架架构是真技术护城河，商业市场里相近对手很少。
    - 通过 Carahsoft 获得联邦采购合规与渠道准入，切入有预算买方的路径可信。
    - $200M Series C 和二级市场独角兽估值显示，投资人愿意支持长期制造和产品扩张。
  topRisks:
    - 约 $1.6B Series C 标记主要由二级市场数据支撑，收入、毛利率、积压订单和客户集中度仍未披露。
    - 到 2024 年中出货不到 20 个机架，暴露严重执行风险；复杂软硬件一体化能否规模制造仍未在大批量上证明。
    - 超大规模云厂商和私有云既有厂商在采购杠杆和工程资源上明显强过 Oxide。
  unresolvedGaps:
    - 经审计收入、毛利率、积压订单和 ARR，用来检验约 $1.6B 标记是否成立。
    - 截至 2026 年的总机架出货量、客户数、客户集中度和可解除 NDA 的参考客户。
    - 官方 Series C 股价、稀释和优先股堆叠；公开估值引用仍是二级市场估计。
