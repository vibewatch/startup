  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-disclosure
    missingEvidence: Exact cash on hand, restricted cash, debt availability, and latest balance sheet.
    whyItMatters: Without a balance sheet, capital adequacy and downside survival cannot be tested.
    diligencePath: Request the latest monthly balance sheet, debt schedule, and post-Series C cash bridge.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway
    missingEvidence: Gross burn, net burn, working-capital swing, and board runway target.
    whyItMatters: Hardware businesses can consume cash through inventory and deployment before revenue is visible, so burn timing matters materially.
    diligencePath: Request the 12- to 24-month operating plan with monthly burn and runway under base and downside scenarios.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASP by rack type, discount waterfall, payment terms, and channel take rates.
    whyItMatters: Public contract-shape evidence is not enough to model payback, gross profit, or revenue quality.
    diligencePath: Request recent signed quotes, bookings detail, and a pricing waterfall from list to realized contract value.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: COGS by hardware, logistics, warranty, support, and any software allocation, plus shipment-cohort gross margin.
    whyItMatters: The chapter can describe margin drivers qualitatively but cannot underwrite margin path without actual cost data.
    diligencePath: Request COGS detail, warranty reserve policy, and gross-margin trend by product generation and shipment cohort.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
