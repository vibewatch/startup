  - - Bundled control plane, updates, and software
    - Software and updates appear embedded in the infrastructure purchase rather than sold as a separate subscription
    - Included entitlement
    - Confirmed bundled; standalone price not disclosed
    - Low as a separately observable stream because no public carveout exists
    - Request standalone selling price allocation and support / maintenance policy
  - - Support and field service
    - Enterprise support and ongoing updates exist, but public monetization terms are undisclosed
    - Support contract / entitlement
    - Service exists; pricing unknown
    - Low until attach, renewal, and gross margin are known
    - Request support attach rate, renewal behavior, and support P&L
