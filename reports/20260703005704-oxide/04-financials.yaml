    - Carahsoft federal procurement vehicles and CoreSite deployment relationship can help convert orders
    - Contract / deployment
    - Channels confirmed; economics undisclosed
    - Low because reseller discounting or revenue share is not public
    - Request channel discount schedules, rev-share terms, and partner-sourced pipeline mix
