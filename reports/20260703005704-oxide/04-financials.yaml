- id: TI004
  title: Capital adequacy table
  columns:
  - Metric / factor
  - Public value / status
  - Evidence / timing
  - Underwriting implication
  - Diligence ask
  rows:
  - - Total disclosed equity capital
    - ~$389M cumulative ($89M pre-Series B + $100M Series B + $200M Series C)
    - Management statements through Feb 2026
    - Materially improves resilience versus an early-stage hardware startup
    - Reconcile exact cap table, any secondaries, and post-close cash
  - - Series B use of funds
    - Manufacturing scale, system scale, operations scale, and roadmap scope
    - Series B blog, Jul 2025
    - Suggests capital need was tied to execution scale, not only cash burn
    - Provide board-approved allocation of Series B proceeds and milestone budget
  - - Series C rationale
    - Management said the business did not need capital support, but the round de-risked long-term capital access and independence
    - Series C blog, Feb 2026
    - Reduces near-term solvency concern, but does not reveal liquidity or burn
    - Provide pre-/post-round cash bridge and minimum-cash policy
  - - Cash on hand
    - Not publicly disclosed
    - No public balance sheet or shareholder letter
    - Cannot test liquidity, covenant headroom, or downside durability
    - Provide month-end cash, restricted cash, and revolver availability
  - - Burn / runway
    - Not publicly disclosed
    - Management commentary only
    - Cannot determine financing dependency timing or downside runway
    - Provide gross burn, net burn, and runway under base / downside cases
  - - Debt / project finance / equipment obligations
    - No public facility or project-finance structure found in reviewed sources
    - Observed absence across reviewed public corpus
    - Could indicate a clean balance sheet or simply undisclosed obligations
    - Provide debt schedule, supplier financing, leases, and customer prepayment terms
  - - Next-round trigger
    - Unknown publicly; likely tied to growth outrunning manufacturing working capital or strategic inventory builds
    - Inference from hardware model plus management comments on scale
    - Dilution timing and financing contingency cannot be underwritten
    - Provide board trigger for next financing and required cash buffer by growth scenario
  notes: Nulls here are real disclosure gaps, not missing research effort. Management commentary supports improved capital adequacy, but public sources do not reveal cash, burn, runway, or obligations in a form suitable for underwriting.
