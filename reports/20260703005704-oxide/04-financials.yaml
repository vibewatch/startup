- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Public status
  - Exact diligence path
  rows:
  - - Revenue / ARR / bookings
    - Needed to size current scale, growth rate, and revenue quality
    - No public disclosure found
    - Request monthly and quarterly revenue bridge, bookings, ARR if applicable, and revenue-recognition memo
  - - Gross margin / COGS
    - Needed to test whether integrated-hardware economics improve with scale
    - No public disclosure found
    - Request COGS by hardware, support, warranty, and logistics plus cohort gross margin
  - - Cash balance / burn / runway
    - Needed to assess financing dependency and downside resilience
    - No public disclosure found
    - Request latest balance sheet, cash-bridge, and 12–24 month runway model
  - - Realized ASP, discounting, and channel take rate
    - Needed to convert contract structure into actual unit economics
    - No public disclosure found
    - Request price waterfall from list to realized ASP, discount policy, and partner margin schedule
  - - Installed-base expansion and support attach
    - Needed to test land-and-expand logic and service monetization
    - No public disclosure found
    - Request racks per customer over time, expansion bookings, support attach, and support renewal data
  - - Customer concentration, backlog, and warranty reserves
    - Needed to assess downside if a few lighthouse accounts slip or hardware costs overrun
    - No public disclosure found
    - Request top-customer revenue mix, signed backlog, cancellation terms, and warranty-reserve policy
  - - Headcount and functional mix
    - Needed to estimate fixed operating cost and manufacturing / support leverage
    - No public disclosure found
    - Request headcount by engineering, manufacturing, GTM, and support plus hiring plan
  notes: This table captures the minimum private-data package required to move from a qualitative public verdict to an underwriteable financial model. Each row names the exact diligence artifact needed; none can be closed with additional public searching alone.
