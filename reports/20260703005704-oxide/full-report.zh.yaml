  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 展示 Oxide 最匹配的买家如何从痛点识别走到首台机架部署；若满意，再进入后续工作负载或站点扩张。
    data:
      items:
        - label: 痛点识别
          description: 买家遇到触发因素，例如 VMware 许可压力、公有云成本波动、主权要求，或高密度计算工作负载的遥测不足。
        - label: 技术评估
          description: 团队由工程师主导，评估 Oxide 时看 Cloud Field Day 内容、文档、公开 RFD 和开源代码，不只看营销材料。
