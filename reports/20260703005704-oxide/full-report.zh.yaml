      - number: '1.5'
        title: 客户细分、早期牵引与负面信号
        blocks:
          - type: paragraph
            body: >
              Oxide 直接由 CEO Steve Tuck 在 Cloud Field Day 20 上识别三类主要垂直客户：联邦机构、金融服务公司和云 SaaS 运营商。截至运行日，具名参考客户包括 Idaho
              National Laboratory（INL，2023 年 10 月 GA 时宣布）、Lawrence Livermore National Laboratory（LLNL，2024 年 11
              月博客宣布）、Switch（数据中心和托管公司，使用 Oxide 部署内部云平台，2024 年通过 Data Center Dynamics 宣布）、Jump Trading（量化交易公司，出现在 Oxide
              官网）和 Stoke Space（运载火箭公司，也出现在官网）。GA 时还提到一家全球金融服务公司，但未披露名称；Oxide 于 2024 年 4 月宣布与 CoreSite 合作，将一台机架放在
              CoreSite Silicon Valley SV2 数据中心，这与服务托管式金融客户相符。联邦渠道则由 NDAA、BAA、TAA 合规，以及通过 Carahsoft、GSA、SEWP、OTA
              的采购路径支撑。Blocks & Files 在 2024 年中访问 Oxide 总部后报道称，公司当时已交付「不到 20
              个机架」，多数是在客户现场的单机架部署——商业足迹早期但真实。负面信号层有限但重要：Oxide 是资本密集型硬件业务，商业规模还非常早；公司未披露 ARR、收入、毛利率或员工数；截至 2026 年 2 月
              Series C 交割时的总机架数量没有公开；从零打造定制服务器硬件在 COVID 期间面临的供应链挑战——Oxide 自己的供应链博客已有记录——对一家仍在提升制造能力的公司构成持续运营风险。LLNL
              部署也提示，主权和联邦客户项目周期很长，合同转化和收入确认会比客户公告滞后数月至数年。
