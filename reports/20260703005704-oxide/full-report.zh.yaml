  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - Oxide 的切入意义
    rows:
      - - 本地机柜级云（Oxide 主战场）
        - 垂直整合的机柜系统，硬件 + 软件统一，API 优先控制平面、多租户 VM、存储、网络
        - 传统多厂商 DIY 机柜，没有一体化云软件；仅托管空间 / 电力
        - CIO / CTO / IT 项目负责人；由企业或机构资本预算付款
        - Oxide 的直接产品；GA 阶段除 Oxide 外，没有既有厂商销售完全一体化的机柜级 Cloud Computer
      - - HCI / 私有云软件（邻近既有厂商市场）
        - 超融合基础设施平台（Nutanix、VMware vSAN、Dell VxRail）；软件定义存储和计算
        - 只有硬件转售、没有云级软件；公有 IaaS；仅 SaaS 管理工具
        - CIO / IT 主管；由 IT 资本开支预算付款
        - 主要既有厂商市场；Nutanix 约 $2.1B ARR 是最接近的可比对象；在高主权场景中，Oxide 替代或补充 HCI
      - - 超大规模云厂商本地扩展
        - AWS Outposts、Azure Local（Azure Stack HCI）、Google Distributed Cloud；把公有云延伸到本地机柜
        - 仅软件远程管理；边缘设备；IoT 网关
        - CIO / 云架构师；由云服务预算付款（通常为 OpEx）
        - 竞争类别；把客户锁进超大规模云厂商 API 和计费体系；主权性低于 Oxide
      - - 主权云 / 联邦 IT
        - 政府控制的云基础设施、物理隔离部署、FIPS 合规硬件、硬件信任根系统
        - 运行在共享超大规模云厂商基础设施上的商业 SaaS；公有云托管的 FedRAMP 工作负载
        - 机构 IT 项目经理、DoD CIO、IC 基础设施团队；由机构资本和 O&M 预算付款
        - Oxide 高优先级垂直；可通过 GSA、SEWP、OTA 和 Carahsoft 分销渠道触达
      - - AI / HPC 本地计算
        - GPU 高密度机柜、批处理计算集群、HPC 调度器（SLURM）、科研计算平台
        - 云端 HPC 即服务（AWS HPC、Azure HPC）；IoT 规模边缘推理
        - 科研计算主管、量化金融公司 CTO、AI 工程负责人；付款来自资本开支或研究经费
        - 增长切入点；Oxide 第 2 代 Sleds（EPYC 9005 / Zen 5、AVX-512）明确面向 AI 推理和 HPC
    notes: 市场边界定义存在争议。分析师对软件、服务和托管的纳入或排除各不相同，使任何单一 TAM 数字都可疑。Oxide 横跨这五行竞争，但当前商业牵引在主权云 / 联邦和金融服务行最强。
