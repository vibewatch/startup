  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方、使用者、付款方与渠道触达
        blocks:
          - type: paragraph
            body: >-
              Oxide 的公开客户叙事比泛泛的“企业 IT”卖点具体得多。Steve Tuck 在 Cloud Field Day 的演示描述了三个已经使用或评估该系统的核心客群：联邦机构、金融服务公司和云 SaaS
              公司。Oxide 自己的解决方案页面又把范围扩展到主权云买家、VMware 迁移和混合云项目，以及需要本地基础设施但想要公有云式 API 的 HPC 与 AI
              运营方。在这些客群里，经济买方通常是能批准机柜采购的基础设施或项目负责人；日常使用者则是技术团队——安全工程师、平台 / SRE 团队、网络团队或 HPC 运营方——他们通过 Oxide 控制平面消费 VM
              和服务。

              付款方画像很关键，因为 Oxide
              卖的是一次性购买的机柜，而不是按用量计费的服务。这会把采用偏向两类组织：本来就习惯资本开支，或合规要求复杂到公有云、多厂商私有云都不够有吸引力。渠道触达仍窄，但已经存在：Oxide 直销，Carahsoft 通过
              GSA、SEWP 和 OTA 采购工具提供联邦采购路径，CoreSite 合作则为企业部署提供互联托管入口。结果是，客户群看起来与产品技术强项相当匹配，但还没宽到足以证明普通企业 IT
              买家会形成可重复的横向需求。
