      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              Oxide 的公开采用证据最适合按时间线读，而不是当成一个单点客户数指标。2023 年 10 月正式商用时，Oxide 点名 Idaho National Laboratory
              和一家未具名的全球金融服务公司为早期客户，说明产品已从概念走到付费部署。到 2024 年 7 月，Blocks & Files 报道称已出货不到 20
              个机柜，并称多数是单机柜部署。这个数字很小，但仍然重要：它确认了现场已经有真实硬件，而不是纯试点故事。之后的证据集中在少数可信账户上。LLNL 宣布安装 Oxide，用于在 HPC
              旁边现代化运营工作负载；Switch 则把 Oxide 硬件部署进自有数据中心，支撑内部使用的私有云平台。

              2025-2026 年，证据更新鲜了，但精度没有同步提高。Oxide 的 Series B 博文称，首次出货后客户落地变快，现场更新和客户要求的功能也已经发生。Intel Capital 和 Oxide 的
              Series C
              材料随后描述了产品市场契合和采用加速。这些表述在方向上重要，尤其对一家天然销售周期很长的硬件创业公司而言；但它们仍未披露当前客户数、在线机柜数或已预订的追加订单。因此，本章把采用判断为真实且在改善，同时把置信度维持在中等，因为最关键的分母仍未公开。
