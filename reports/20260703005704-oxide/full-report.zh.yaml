        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >
              部署速度是 Oxide 卖点的核心，但可支撑的说法是一个范围，而不是合同承诺。官方页面称系统可在两小时内投入运行，独立报道则描述从安装到开发者可用只需数小时，并在一篇发布文章中引用了四小时。共同点是，Oxide
              交付的是包含软件的完整组装机架，而不是发布了明确部署 SLA。集成证据更广也更强：抓取页面显示 REST API、CLI、控制台、Terraform provider、Packer、GitHub
              Actions、GitLab CI、OpenShift、Rancher、Kubernetes 相邻工作流、Flux、Slurm、Jupyter、Prometheus 和 Grafana。

              可靠性证据是混合的。正面看，存储页面记录了三副本镜像、快照、校验和持续验证；文档显示双交换机连接和硬件根植的管理模型；Series B 文章称 Oxide
              已经在现场交付软件更新和客户请求功能。薄弱面在于，没有抓取到任何来源发布正常运行时间历史、公开事故报告、备件政策或支持响应承诺。因此，路线图证据在规模上最强——制造、运营、客户支持和更宽路线图范围；在详细公开发布日程上最弱。
