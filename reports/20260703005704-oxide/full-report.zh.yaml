  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发信号
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 联邦合规漂移
        - 客户或伙伴要求新的合规证据
        - 任何活跃联邦项目中，原产地、Section 889 或采购资格声明失败
        - 在法律范围和补救措施经独立厘清前，将其视为联邦切入点的论点破裂
      - - 供应链 / 组件冲击
        - 关键供应商发出交期、配额或重设计预警
        - 任何关键组件交期回到 >52 周，或迫使机架重构
        - 重切交付假设，推迟增长承销，并要求库存缓冲分析
      - - 严重可用性或安全事故
        - 公开复盘、客户背书流失或紧急补丁周期
        - 一起反复出现、影响生产客户的一级严重事故，或一个缺乏及时补救证据的重大安全缺陷
        - 在复盘质量、补丁节奏和客户流失影响明确前，暂停确信度
      - - 现场服务能力未达标
        - 支持升级积压或安装延期
        - 两个或以上具名部署因现场交付或更换能力不足而延期
        - 从增长承销转向运营尽调，并要求人员配置证明
      - - 营运资本压力
        - 新融资或投资人更新与库存或支持现金需求绑定
        - 一轮融资若围绕库存救急、现金转换或客户回款延迟，而非计划扩张
        - 除非披露积压订单质量和利润率桥，否则视为论点破裂
      - - 生态 / 认证滑坡
        - 客户要求当前验证之外的兼容性证明
        - 失去 Red Hat 验证、出现重大兼容性缺口，或目标细分市场渠道伙伴后撤
        - 下调企业信心，并提高所需折价 / 尽调负担
      - - 关键人物扰动
        - 销售或架构层领导离职，或出现明显重组
        - Steve Tuck 或 Bryan Cantrill 离职，且没有指定副手和过渡计划
        - 在连续性和客户关系交接得到证明前，暂停新承销
      - - 披露恶化
        - 管理层继续增加资本和客户，但没有运营透明度
        - 又一次重大融资或客户营销推进，却没有披露出货、积压订单或利润率
        - 假设不透明是结构性的，并按更高风险硬件扩张给公司定价
    notes: 这些阈值是投资监控触发器，不是契约式承诺。每一项都把定性担忧转成具体事件，从而决定暂停尽调还是打破当前论点。
    claimRefs:
