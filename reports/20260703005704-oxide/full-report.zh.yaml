      - number: '2.4'
        title: 增长驱动因素与需求催化剂
        blocks:
          - type: paragraph
            body: >
              最直接的需求催化剂，是 Broadcom 2023 年收购 VMware 后重构授权，显著抬高了 VMware 存量客户的成本。这在企业和公共部门 IT 中触发了紧迫的 VMware 退出评估，许多组织开始评估
              Nutanix、OpenStack 和 Oxide 这类专门替代方案。ReadyWorks 将 VMware 退出与云回迁同时发生的趋势称为结构性「基础设施汇合时刻」。

              AI 和 HPC 工作负载是第二个近期驱动。Broadcom Private Cloud Outlook 2025 调查（1,800 名 IT 领导者，2025 年 5 月）发现，55%
              的受访者更偏好用私有云进行 AI 模型训练、微调和推理——这说明 GPU 密集型本地基础设施需求具有持续性。Oxide 的 2nd Gen Sleds（AMD EPYC 9005 / Zen
              5、AVX-512）明确面向 AI 推理和向量密集计算。Oxide 博客引用 Goldman Sachs 研究，预计数据中心用电量将从全球电力的 1–2% 上升到 2030 年的
              3–4%，并称机架级设计对效率至关重要；Oxide 声称相较传统机架可将每工作负载功耗降低 50%。

              数据主权监管是第三个结构性驱动。VMware Sovereign Cloud
              Initiative（2021）记录了企业和政府日益增长的需求：云基础设施必须能在硬件层面执行数据驻留。联邦法规、欧盟数据驻留要求，以及金融服务监管要求（例如数据不得离开特定司法辖区）都让 Oxide
              的本地所有权模式优于超大规模公有云。BVP Nasdaq Emerging Cloud Index 的背景确认，公有云估值仍高，但规模化云成本已吸引回迁资本。DHH 2022 年 Basecamp
              文章「Renting computers is (mostly) a bad deal for medium-sized companies」支撑了经济性论点，也推动 a16z 发布「The Cost of
              Cloud, a Trillion Dollar Paradox」（2021）。
