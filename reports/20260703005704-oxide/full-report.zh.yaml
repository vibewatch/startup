  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Oxide 的总可服务市场位于本地数据中心基础设施与云平台软件的交叉点。纳入的支出包括机架级一体化计算-存储-网络系统、超融合基础设施（HCI）平台、私有云软件栈、VMware
              替代平台，以及主权或气隙云设备。边界外包括超大规模公有 IaaS 支出（AWS、Azure、GCP）——Oxide
              明确把它们作为现状替代品竞争；纯托管（客户只购买空间和电力）；没有一体化软件控制平面的传统机架式服务器；以及不是为完整私有云工作负载设计的边缘计算设备。

              构成未来扩张机会的相邻支出类别包括联邦 IT 现代化预算、HPC 集群采购、AI 推理本地部署，以及因数据主权要求偏好自有基础设施的灾备或备份设备预算。Oxide 必须替代的现状方案因买家而异：大型企业现在用
              Cisco UCS 或 Dell PowerEdge 服务器、VMware vSphere 和独立存储阵列自建 DIY 栈；财务上更成熟的买家使用 Nutanix HCI；公共部门买家依赖 FedRAMP 授权
              SaaS 或老旧本地系统；部分工作负载已经迁往超大规模公有云（AWS、Azure、GCP），这类场景是回迁目标，而不是直接产品替代品。超大规模云厂商也通过 AWS Outposts 和 Azure Local（原
              Azure Stack HCI）延伸到本地，使它们既是云替代品，也是竞争性的本地部署产品。
