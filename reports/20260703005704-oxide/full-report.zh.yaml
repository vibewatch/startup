  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Oxide
        - 直接一体化私有云厂商
        - 私营，2026 年新获融资；截至 2024 年中，最新独立规模证据仍为出货 <20 个机架
        - 联邦、金融服务、云运营商、AI/HPC、VMware 退出买方
        - 机架级软硬一体、可验证栈、一次性采购经济性
        - 渠道覆盖更窄，公开证据很少能证明广泛部署规模
      - - Nutanix
        - 直接 HCI / 私有云既有厂商
        - 上市公司，拥有专门投资者关系入口和广泛企业足迹
        - 企业数据中心、混合多云、VMware 替换项目
        - 成熟的软件定义 HCI、AHV 虚拟机管理程序、自助式云界面、合作伙伴生态
        - 主权 / 可检查固件差异化较弱；授权仍由软件牵引
      - - AWS Outposts
        - 超大规模云替代 / 既有厂商
        - 背靠 AWS 母体规模和服务目录
        - 需要本地驻留或低时延扩展的 AWS 标准化企业
        - 本地保持 AWS API 和服务一致性，提供托管式 AWS 体验
        - 保留 AWS 依赖以及服务 / 计费锁定
      - - Azure Local
        - 超大规模云替代 / 既有厂商
        - 背靠 Microsoft 分发和 Azure 控制平面
        - 以 Windows 和 Azure 为中心的企业、分支与混合云部署
        - 面向现代和传统应用的统一 Azure 联动管理
        - 云联动授权和控制平面依赖仍在
      - - HPE GreenLake
        - 混合云既有厂商 / 邻近玩家
        - 全球 OEM 平台，提供多种消费模式和庞大支持体系
        - 想要托管式混合云、数据、AI 和私有云服务的企业
        - 基于平台的多厂商运营，加按量付费 / 订阅灵活性
        - 全栈一体化主张不如 Oxide 强；价值常取决于服务销售动作
      - - Dell VxRail / APEX
        - HCI 既有厂商 / 打包既有厂商
        - 全球 OEM，拥有融资部门和成熟企业渠道
        - VMware 占比高的企业，以及优先考虑交钥匙采购和支持的买方
        - 交钥匙 VMware 对齐私有云，加订阅或分期打包
        - VMware 依赖和既有复杂性仍在
      - - DIY 栈 / OpenStack / 传统本地部署
        - 维持现状 / 内部自建
        - 沿用现有人员、合同和沉没成本基础设施，不重新选择厂商
        - 追求熟悉度或尽量减少近期平台变动的组织
        - 架构选择空间最大，并可复用既有工具
        - 集成负担高，支持模式容易互相推诿，类云运营更慢
