  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 方向
      - 论点
      - 证据
      - 改变看法的条件
    rows:
      - - 正向论点
        - 联邦和主权基础设施是真正的早期切入点。
        - Carahsoft、Oxide 公共部门材料和 Tech Field Day 都指向有采购或合规紧迫感的联邦、金融和云 SaaS 买家。
        - 管线证据显示联邦渠道大多停留在探索阶段，且没有转化为多机架重复部署。
      - - 正向论点
        - VMware 退出和私有云需求带来及时的市场拉力。
        - Broadcom 调研数据、ReadyWorks 和 Oxide 迁移话术都指向活跃的工作负载回迁和私有云优先级。
        - Broadcom 和 VMware 驱动的迁移预算被证明只是暂时的，而 CIO 证据显示选择性优化主导实际采购行为。
      - - 正向论点
        - 如果跑通，机架级软硬件协同设计可以支撑溢价经济性。
        - Oxide 强调第二代计算、集成控制平面、无出站流量费、无 hypervisor 额外开销，以及相对传统机架的能效提升。
        - 经审计毛利率和续约 / 扩张行为显示不出软件式经济性或持久的控制平面变现。
      - - 反向论点
        - 商业规模仍处早期。
        - Blocks & Files 报道称，截至 2024 年中出货不到 20 个机架，并称多数部署仍是单机架安装。
        - 公开证据显示，订单明确加速到机队规模的重复采购，装机基数也显著扩大。
      - - 反向论点
        - 投资纪律开始发挥作用的节点，公开估值支撑恰好缺失。
        - 已审阅公开来源均未披露 Oxide 收入、毛利率、积压订单质量、股权结构优先权或 Series B/C 投后估值。
        - 管理层披露经审计收入、毛利率、积压订单和实际轮次价格。
      - - 反向论点
        - 市场竞争激烈，回迁也不是全面性的。
        - CIO.com 将回迁定义为选择性优化，而 AWS / Azure 已提供本地云扩展，压住了 Oxide 的独特性。
        - 客户证据显示，Oxide 能持续击败超大规模云厂商的本地方案，并把这些胜利转化为多机架扩张。
    notes: 反向论点刻意基于证据，反映的是真实商业化和定价风险，而不是泛泛的创投怀疑论。
    claimRefs:
