      - number: '1.4'
        title: 产品范围、技术架构与开源姿态
        blocks:
          - type: paragraph
            body: >
              Oxide Cloud Computer 是一套实体机架系统，交付时计算、网络、存储和软件已经全部集成。每个机架最多容纳 32 个第一代计算 sled，或最多 24 个第二代 sled（2nd Gen 引入
              AMD EPYC 9005 Series / Zen 5 处理器和 DDR5 内存）。满配时，单个机架最高可提供 7,875 个 guest vCPU、30.6 TiB guest 内存、1.7 PiB NVMe
              块存储和 12.8 Tbit/s 网络交换容量。交换结构采用 Intel Tofino 2 ASIC，提供 6.4 Tbit/s，并配有 32 个下行和 32 个上行 100 Gbps 端口。电源架（每机架 2
              个，冗余）在冗余模式下最高可提供 21.6 kW。软件栈几乎完全开源：Hubris（基于 Rust 的微控制器 OS，用于服务处理器和 sled 管理）、Helios（源自 illumos 的计算 sled 主机
              OS）、Omicron（用 Rust 编写、管理虚拟机、网络和存储的控制平面）、Crucible（分布式 NVMe 块存储服务）和 Propolis（基于 illumos bhyve 的用户态 VMM）都是
              oxidecomputer 组织下的公开 GitHub 仓库。开发者集成入口包括 Terraform provider（v0.19.0）、Rust SDK 和 CLI、覆盖所有操作的 REST APIs，以及对
              Kubernetes、Red Hat OpenShift、SUSE Rancher、Prometheus/Grafana
              监控的官方支持。公司称从交付到可供给资源的设置时间不到两小时——与可能需要数周的多供应商本地部署形成鲜明对比。这套架构给了 Oxide
              差异化的支持叙事：所有组件都来自一家供应商，固件和软件又是开源的，客户既能验证安全属性，也能避开多供应商环境中常见的互相推诿。
