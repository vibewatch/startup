      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >
              本章最强的公开证据来自架构。Oxide 自有文档描述了一套大致基于 OCP ORV3 的机架，配有可热插拔仓位、前侧可维护线缆槽、低压 DC
              母排供电、双交换机，以及每块板级硬件信任根和嵌入式服务处理器。网络并不是简单机架顶端网桥：文档明确列出项目级 VPCs、基于 Geneve 的封装、Delay Driven Multipath
              routing、用于防火墙 / 路由 / NAT 的 OPTE，以及 Tofino 2 边界服务。

              公开代码仓库表面补齐了软件层。Omicron 是机架控制平面；Helios 是驱动机架的 illumos 发行版；Propolis 是通过 REST APIs 操作、基于 bhyve 的 VMM；Crucible
              是复制型块存储服务；Hubris 是面向可靠性的底层控制所用嵌入式操作环境。这个组合让 Oxide
              的架构对一家硬件公司而言异常可检查。仍不透明的不是大体栈布局，而是内部设计文档、外部安全审计和成熟生产可运维性指标。
