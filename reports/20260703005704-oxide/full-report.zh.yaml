      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              2025 年中到 2026 年初，Oxide 的融资姿态明显改善，但公开记录仍不足以支持清晰的流动性承销。管理层在 Series B 文章中称，公司在该轮前已融资 $89 million，随后在 2025 年 7
              月新增 $100 million，并在 2026 年 2 月再增 $200 million。Series B 的资金用途不只是弥补经营亏损；Oxide
              把该轮融资与制造规模、系统规模、运营规模和路线图范围绑定。Series C
              文章更进一步，称公司并不需要资本来支撑业务，并指出实体业务的产品市场契合要求把制造、库存、现金转换和供应链动态跑通。管理层把更大轮次包装为降低资本可得性风险并确保独立性。

              这些表述对资本充足性方向上有利，但仍不是资产负债表。Oxide 未披露在手现金、总现金消耗或净现金消耗、营运资本波动、债务期限表和现金续航目标。这对 Oxide
              比对纯软件创业公司更重要，因为机架业务会在收入对外可见之前，先通过零部件采购、库存和现场部署吸收现金。Dell 这类上市既有厂商通过 Form 10-K 提供申报级披露；Oxide
              没有。实际结论是，相比两轮大额融资之前，融资依赖可能已经降低，但下一次融资需求的时间仍无法用公开来源测试。
