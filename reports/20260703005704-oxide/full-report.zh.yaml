      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >
              公开证据能支撑的结论，在商业模式形态上强于商业模式表现。Oxide 似乎拥有连贯的变现设计：销售完整集成机架，避开按核和按 CPU
              插槽授权，在自有基础设施中捕获软件价值，并用更低的公有云和传统机架成本向买家推销。如果扩张批次强，这种模式可以产生高质量收入；但增长天然资本密集，因为它需要硬件、制造能力、库存、物流和支持。公开证据显示，公司理解这些约束，并用
              Series B 和 Series C 来降低约束。

              承销阻碍不是战略模糊，而是财务披露缺失。没有公开证据显示实际
              ASP、订单额、ARR、毛利率、支持附加率、客户集中度、现金或现金续航。独立牵引证据也仍指向早期商业基础，而不是规模化部署。因此，本章底线是混合的：收入质量和买方痛点看起来真实，利润率路径合理但未证实，资本充足性比以前更好但无法验证。资料室可以很快改善判断；仅靠公开证据不能。
            claimRefs:
              - CI040
