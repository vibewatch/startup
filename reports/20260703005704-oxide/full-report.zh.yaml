  - id: FI001
    title: 收入模型桥
    type: flow
    layout: standard
    summary: |
      从战略性客户需求，到前期机柜收入和毛利润的定性桥接。图表反映 Oxide 披露的自有基础设施模式，而不是按用量计费的 SaaS 流。
    approximationNotes: |
      公开来源描述合同结构，但未披露实际 ASP、付款里程碑或收入确认时点。因此，这条流转图展示价值大致如何穿过模型，而不是分配美元金额。
    data:
      nodes:
        - id: trigger
          label: 战略负载触发
          detail: VMware 退出、主权、AI/HPC、延迟或云成本压力，都会催生自有基础设施需求
        - id: sale
          label: 直销或伙伴辅助的企业销售
          detail: Oxide 主要直销，同时用 Carahsoft 服务联邦采购，用 CoreSite 做托管部署
        - id: upfront
          label: 前期机柜购买收入
          detail: 一次性基础设施采购；客户拥有机柜；没有按核心收费或用量计费
        - id: bundled
          label: 捆绑软件、更新和支持价值
          detail: 控制平面、API 以及至少部分更新 / 支持价值似乎嵌入合同，而不是单独计量收费
        - id: gross_profit
          label: 扣除硬件和服务交付后的毛利润
          detail: 利润取决于 BOM、制造、库存、物流、安装和支持效率，而不是经常性软件毛利
      edges:
        - from: trigger
          to: sale
        - from: sale
          to: upfront
        - from: upfront
          to: bundled
        - from: bundled
          to: gross_profit
    claimRefs:
      - CI002
      - CI006
      - CI009
      - CI018
      - CI040
  - id: FI002
    title: 单位经济桥
    type: flow
    layout: standard
    summary: |
      公开证据可支撑的销售效率链条：从技术线索生成，到首个机柜销售，再到可能扩展。CAC、转化率和回本周期未公开，因此数值是定性的。
    approximationNotes: |
      Oxide 未披露 CAC、试点转化、回本周期或扩展率。因此，节点写成流程步骤和代理指标，而不是量化单位经济。
    data:
      nodes:
        - id: lead
          label: 技术线索生成
          detail: 播客、文档、RFD 和源代码吸引有认知的入站兴趣
        - id: qualify
          label: 受云教育的买方筛选
          detail: Oxide 筛选看重战略价值的客户，也欢迎平台工程人员参与销售电话
        - id: eval
          label: 长周期技术与商业评估
          detail: 企业基础设施销售仍是高接触、长周期，即便部分早期交易快于预期
        - id: first_order
          label: 首个机柜订单
          detail: 独立报道显示，许多早期部署最初都是单机柜安装
        - id: deploy
