  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买家替代方案
        blocks:
          - type: paragraph
            body: >-
              Oxide 不是只在和另一家创业公司竞争。公司要求买家替换几套根深蒂固、解决同一任务的方式：以 VMware 为中心的虚拟化栈、Nutanix 式 HCI、AWS Outposts 和 Azure Local
              这类超大规模云厂商的本地延伸、HPE GreenLake 和 Dell APEX/VxRail 这类消费驱动的混合云平台，以及把服务器、存储、网络和运维工具拼在一起的现状内建方案。Oxide 自己的 VMware
              替代和混合云页面，明确把产品放在 VMware、Nutanix、OpenStack 和公有云对面，而不是只针对单一硬件
              OEM。这个广义竞争集合很重要，因为不同买家的采购路径不同。联邦和受监管买家可能足够重视主权、证明和国内采购路径，愿意把 Oxide
              与公有云替代方案比较。金融服务和云运营商买家更在意低延迟控制、可预测经济性，以及在自有基础设施上运行现代 APIs 的能力。已经标准化在 VMware 或 Nutanix 上的企业，会把 Oxide
              与迁移摩擦、现有员工知识和既有支持关系比较，而不只是比较技术优劣。战略结论是，Oxide 的战场由更新周期和迁移周期驱动：当买家已经在承受切换成本事件、能够重新审视全栈时，Oxide 才更容易赢。
