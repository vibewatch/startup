      - number: '1.3'
        title: 融资历史、资本结构与投资人叙事
        blocks:
          - type: paragraph
            body: >-
              Oxide 的融资故事，是在真实技术风险背景下按里程碑有意推进的融资。产品尚未存在时，公司从 Eclipse Ventures 获得种子融资；2023 年 10 月，Intel Capital、Riot
              Ventures、Counterpart Ventures 和 Rally Ventures 参与 $44 million Series A，同一事件也宣布第一台商用云计算机正式可用。当时累计融资为 $78
              million，确认 Series A 前融资约 $34 million。2025 年 7 月 30 日，公司宣布 $100 million Series B，由新战略伙伴 USIT（Thomas Tull 的
              US Innovative Technology Fund）领投，所有现有投资方参投；公司自有博客称，这笔 $100 million Series B 让截至当时的累计融资额翻倍以上，并将此前融资额列为 $89
              million。$78 million（HPCWire）与 $89 million（公司博客）之间的差异，很可能来自 2023 年 10 月至 2025 年 7 月之间未单独公布的过桥或中间融资。2026 年 2
              月，Oxide 完成 $200 million Series C，仍由 USIT 领投，Eclipse、Riot Ventures、Jane Street 和其他现有投资方参投。Series C
              博客明确表示，该轮融资并非由业务需要驱动——Oxide 称自己已实现真实产品市场契合和正向单位经济——而是因为投资人希望降低长期资本可得性风险，并支持制造规模化。按 Series B 前 $89
              million、Series B $100 million、Series C $200 million 计算，截至 2026 年 2 月累计融资约 $389
              million。公司和投资方的官方轮次公告仍未披露股价或稀释条款；但 Forge Global 后续基于私募市场记录，将 2026 年 2 月 Series C 的投后估值列为约 $1.62
              billion。该估计有助于方向性确认 Oxide 的独角兽状态，但不能替代真实股权结构表或融资文件。
