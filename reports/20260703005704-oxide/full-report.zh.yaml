      - number: '3.4'
        title: 护城河耐久性、反向证据与替代风险
        blocks:
          - type: paragraph
            body: >-
              当买家重视一体化控制、可验证基础设施，以及不被超大规模云厂商锁定的公有云式自动化时，Oxide
              的护城河最强。硬件信任根、开源栈组件、内建网络和存储，以及明确的主权与公共部门定位组合起来，不是商品化话术。在联邦、国家安全和某些金融工作负载中，这些属性可能比 AWS、Azure、HPE、Dell 或
              Nutanix 提供的更宽产品目录更重要。公司还受益于产品是实体机架：一旦安装，电力、冷却和运营手册会形成有意义的粘性。但耐久性不等于必然胜出。最强的负面证据是，更大的市场叙事仍有争议。CIO.com
              把回迁界定为选择性工作负载优化，而不是大规模退出云；主流 HCI 替代文章仍围绕既有厂商短名单展开，很少把 Oxide 当成默认比较对象。Oxide
              还必须穿过软件主导竞争对手基本避开的供应链和制造复杂度来扩张。定制硬件既是差异化，也是约束。正确的投资解读是：Oxide
              有真实的利基护城河，但还没有分销护城河；风险不是产品没有差异化，而是资本更充足的既有厂商可能在 Oxide 扩大装机基础之前，用更熟悉的包装吸收足够多买家需求。
