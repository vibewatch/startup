      - number: '8.4'
        title: 建议、终止触发因素与最终尽调
        blocks:
          - type: paragraph
            body: >-
              当前建议是继续研究。不是因为 Oxide 缺少潜力，而是已知价格现在更容易被质疑，难以被承保。中等置信度反映了上行逻辑确实有证据支撑：主权和脱离 VMware
              的需求、采购渠道、新资本、差异化产品设计，以及正在扩大的私有云讨论。高风险反映账本另一边：早期出货规模、资本强度、直销导致的渠道限制、选择性而非全面的回迁，以及缺失的财务透明度。实际含义是，不要在独角兽溢价上盲买。公开可见的约
              $1.62B Series C 标记已经要求比当前可得信息强得多的证据；它高于本报告基准情景价值区间，只有当 Oxide 最终证明收入大得多、利润率更强、多机柜重复扩张也强于当前公开记录时，才开始显得有吸引力。


              什么会改变判断？第一，经审计或管理层认证的收入和毛利率。第二，积压订单质量和扩张数据，显示 Oxide
              正在从单机柜证明走向机群级铺开。第三，客户集中度和保修准备金披露。第四，已发行轮次的实际优先权结构。如果这些项目出现，且价格相对情景框架有纪律，Oxide
              可能从继续研究转为买入。在那之前，尽调负担仍完全落在披露上，而不是故事上。
