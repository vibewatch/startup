      - number: '7.3'
        title: 运营、安全与人员执行风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Oxide 正在尝试一个高难度组合：高密度硬件、定制软件，以及企业级支持承诺；而公司在这个阶段仍公开招聘现场交付、支持工程和项目管理岗位。供应链博客和 Series C
              解释都强调，公司暴露在长元器件交期、库存规划和制造爬坡之下。机柜本身不是轻量基础设施；公开的功耗、散热和重量范围意味着，场地准备、备件和现场修复都是客户体验的重要组成。安全和可靠性风险也因设计而集中。Oxide
              把控制平面、固件、宿主 OS、VMM 和存储都放在一家之下。这消除了一部分多厂商甩锅，但也意味着缺陷或漏洞可能穿透更多层栈，客户更难绕开。Omicron、Hubris、Crucible、Propolis 和
              Helios 的公开仓库展现了值得肯定的透明度，但也清楚说明，Oxide
              扛着很宽的软件面，需要配备人员、持续打补丁并协调推进。支持主张和当前招聘能缓释这项风险；同时也暴露出，公司仍在搭建未来客户将依赖的运营肌肉。
