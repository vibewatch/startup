      - number: '6.3'
        title: 持久性、重复使用、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              公开记录里，持久性证据远弱于技术契合证据。Oxide 在本章审阅的任何来源中都没有披露 NRR、GRR、流失率、合同期限或续约数据。因此，最强的重复使用信号只是代理指标，而不是典型 SaaS
              留存指标：软件更新已经交付给现场系统，出货后增加了客户要求的功能，LLNL 表示有兴趣增加 Cloud Computer，Switch
              希望拿到一个能跨数据中心复制的平台。这些信号积极，因为它们暗示初始购买后仍在活跃使用；但它们没有说明多少客户会扩张、加机柜速度多快，或早期账户是否续购支持并继续把 Oxide 当作战略供应商。

              扩张逻辑不难描述：主权云买家可以在同一个安全环境里增加更多工作负载；脱离 VMware 和混合云买家可以把更多内部应用迁回本地；AI 和 HPC
              用户可以增加相邻的数据与编排服务；服务提供商运营方可以把跑通的设计复制到多个站点。问题在于证据宽度。公开具名引用集中在少数技术能力很强的账户，Oxide 自己直销、不走 OEM 的姿态又进一步收窄渠道宽度。AWS
              Outposts、HPE GreenLake、Dell APEX 和 Nutanix 等既有厂商也在推广更灵活或托管式的商业模式，能降低同一类买家的采购摩擦。Gartner 还为 AWS
              Outposts、Azure Local、Nutanix Cloud Platform 和 Dell VxRail 维护专门的替代方案页面，说明主流买家进入这一类别时，已经有成熟的既有厂商比较集。Gartner
              同样为 VMware vSAN、Proxmox Virtual Environment、Red Hat OpenShift Virtualization 和 Platform9 Managed OpenStack
              维护替代方案页面，显示买家可以把 Oxide 放进一个更宽的替代集合里比较，而不只看最大几家既有厂商。因此，扩张潜力可信，但在管理层提供按批次展示的装机基础证据之前，集中度和商业摩擦仍然重要。
