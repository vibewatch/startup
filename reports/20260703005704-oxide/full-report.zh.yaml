  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: 标出最直接影响 Oxide 销售、部署和支持系统能力的外部依赖。
    data:
      nodes:
        - id: d1
          label: Carahsoft
          type: risk-source
          detail: 联邦采购工具和打包渠道
        - id: d2
          label: Red Hat
          type: risk-source
          detail: 企业 OS 验证信号
        - id: d3
          label: AMD / 组件供应商
          type: risk-source
