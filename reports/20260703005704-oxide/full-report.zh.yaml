      - number: '1.6'
        title: 要点展示
        blocks:
          - type: callout
            title: 垂直整合硬件 + 软件——真正的差异化
            body: >
              Oxide 是市场上唯一一家把完整共同设计的机架级云计算机、开源固件、OS
              和控制平面打包成单一可购买产品的公司。这种集成去掉了多供应商复杂度，也交付了本地买家过去除非自建才拿得到的开发者体验（APIs、多租户、自助服务）。这件事很难快速复制，因为它要求硬件设计、固件、OS、网络、存储和云管理软件同时具备深度能力。
