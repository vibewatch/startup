  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Oxide 的融资节奏在 2025 和 2026 年明显加速。公司披露了 $100M Series B，并称在此之前六年合计融资 $89M；第三方报道随后称不到一年后又完成 $200M Series C，由
              U.S. Innovative Technology Fund 领投。这是真实的融资动能，也很重要：新资本被明确放在制造规模、客户支持和路线图扩张上，而不是生存资金。公开记录对估值也不再完全空白。Forge
              Global 现在列示 Oxide 2026 年 2 月 Series C 投后约 $1.62B，这在方向上重要，因为它确认了独角兽状态，也给投资者一个当前价格锚点。但已审阅的公司和投资者官方公告仍未披露
              Series C 股价、稀释、清算优先权，或支撑这一标记的确切股数。第三方融资总额统计也继续冲突：DCD 称 Oxide 四轮融资 $378M，Owler 称 $356.0M，官方 Series B
              博文则暗示后续 $200M 融资完成后为 $389M。方向很清楚——Oxide 资本充足——但确切资本历史和融资条款仍无法从公开证据完全核对。


              信息不完整，使入场纪律更重要，而不是更不重要。公开证据可以支撑情景框架和一个粗略当前标记，但还不能证明不看价格也该买。关键问题不是 Oxide 是否有意思，而是约 $1.62B
              的投后标记能否用上市公司倍数和已验证运营数据撑住。在管理层披露收入、毛利率、积压订单质量和实际优先权结构之前，审慎立场是把公司留在继续研究 / 跟踪区间，拒绝只按叙事承保。
