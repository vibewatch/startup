      - number: '1.2'
        title: 创始人、领导层与组织厚度
        blocks:
          - type: paragraph
            body: >
              Oxide 的领导结构高度围绕两位联合创始人展开。Steve Tuck 担任 CEO，是商业战略、客户互动和公司定位上的主要外部声音，常出现在新闻稿和投资方公告中。Bryan Cantrill 作为 CTO
              负责技术战略，也是最公开可见的技术负责人；他在系统软件圈以 Sun Microsystems 的 DTrace 工作、以及对开源固件和硬件透明度的鲜明倡导而知名。Series A、Series B 和
              Series C 公告材料均列出两位联合创始人，确认他们至少到 2026 年 2 月仍继续担任运营角色。公司每周维护直播播客「Oxide and Friends」和技术播客「On the
              Metal」，让创始人在同体量公司中拥有少见的高可见度。创始人之外，截至运行日，Oxide
              尚未在官网公布包含个人姓名和职责的完整领导层名单——个人简介页只链接社交渠道和联系方式，并未列举高管团队。对一家早期商业化硬件公司而言，这种不透明并不罕见，但也意味着继任风险、董事会构成和治理结构仍无法从公开来源核实。创始团队在大规模系统基础设施上的合并经验（团队横跨
              Sun、Joyent、Nexenta 背景）提供了强技术可信度；两位联合创始人到 Series C 仍留在原角色，也暗示治理稳定。但董事会名单和投资人观察权结构未公开，是后期投资人应在尽调中补齐的缺口。
