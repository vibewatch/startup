  - id: FE001
    title: Oxide 产品架构图
    type: stack
    layout: wide
    summary: |
      六层视图展示 Oxide 栈：从操作员接口一路到机柜机械结构和安全管理，并把官方文档与主要软件组件的公开仓库证据合并在一起。
    data:
      layers:
        - label: 操作员与自动化界面
          detail: API、CLI、Web 控制台、Terraform、Packer，以及 GitHub Actions、GitLab CI 等工作流集成。
          items:
            - REST API
            - CLI / 控制台
            - Terraform 提供程序
            - Packer
        - label: 控制平面层
          detail: Omicron 组件协调设置、编排、DNS、网关服务、遥测和技术员端口恢复。
          items:
            - Nexus
            - Sled Agent
            - DNS / 网关
            - Oximeter / Wicket
        - label: 工作负载服务层
          detail: 机柜原生 VM、磁盘、VPC 和指标抽象，暴露云式交互模型。
          items:
            - Propolis VMM
            - Crucible 块存储
            - VPC / OPTE / Geneve
            - 指标 API
        - label: 主机与托盘层
          detail: Helios 驱动主机环境，计算托盘提供 CPU、内存和 NVMe 资源。
          items:
            - Helios
            - 第 1 / 第 2 代托盘
            - AMD EPYC 9005
            - NVMe 盘位
        - label: 安全管理层
          detail: 板级硬件信任根和嵌入式服务处理器，取代传统以 BMC 为中心的设计。
          items:
            - 硬件信任根
            - 嵌入式服务处理器
            - 签名 / 度量启动链
        - label: 机架与设施层
          detail: 机架级机械结构、DC 配电和双交换机网络，撑起物理运行模型。
          items:
            - ORV3 风格机架 + 隔舱
            - DC 母排 / 电源搁架
            - 双 Tofino 2 交换机
            - 机房供电 + 上联链路
    approximationNotes: |
      该栈由公开文档、产品页面和代码仓库描述拼出；Oxide 没有发布一张覆盖所有层级的权威架构图。
    claimRefs:
      - CE002
      - CE013
      - CE014
      - CE018
      - CE021
      - CE032
  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: wide
    summary: |
      从机架交付到 Day-2 VM 运维的端到端操作员流程，覆盖产品规格、官网以及发布 / 部署报道所暗示的可支持工作流。
    data:
      nodes:
        - id: order
          label: 订购 Cloud Computer
          detail: 客户购买的是一整套机架，而不是分别组装计算、存储、网络和软件。
        - id: deliver
          label: 接收已组装机架
          detail: Oxide 和第三方报道都称，机架随必需软件完整发货，无需组装。
        - id: facility
          label: 放置、通电并联网
          detail: 客户把机架放进机房，满足电力 / 气流要求，并接入最低限度的网络链路。
        - id: bootstrap
          label: 技术员端口引导
          detail: 初始设置从 1GbE RJ45 技术员端口启动。
        - id: setup
          label: 控制台 / CLI 设置
          detail: 输入关键基础信息后，设置通过 Web 控制台或 CLI 继续。
        - id: tenant
          label: 创建项目、VPC、镜像和磁盘
          detail: 操作员先定义项目和隔离虚拟网络，再准备镜像以及持久或本地存储。
        - id: workloads
          label: 配置 VM 并接入工具
          detail: 团队配置 VM，并用 API、Terraform、Packer 和工作负载工具链衔接自动化。
        - id: operate
          label: Day-2 运维
          detail: 遥测、更新和面向工作负载的集成，支撑持续的 AI、HPC、退出 VMware 和私有云用例。
      edges:
        - from: order
          to: deliver
          label: 购买完整系统
        - from: deliver
          to: facility
          label: 送入机房
        - from: facility
          to: bootstrap
          label: 接入电力 + 链路
        - from: bootstrap
          to: setup
          label: 初始化机架
        - from: setup
          to: tenant
          label: 定义云基础对象
        - from: tenant
          to: workloads
          label: 部署工作负载
        - from: workloads
          to: operate
          label: 监控并更新
    approximationNotes: |
      流程只反映公开的设置和使用说明；客户特定实施步骤、迁移工具和运营手册并未完整公开。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE025
      - CE026
