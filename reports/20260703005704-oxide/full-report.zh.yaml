      - number: '4.2'
        title: 成本结构、单位经济代理指标与牵引缺口
        blocks:
          - type: paragraph
            body: >
              Oxide 的公开材料描绘的是一门经济性更多受实体系统执行约束，而不是经典 SaaS 利润率数学约束的业务。产品页面和技术文档显示，完整集成机架包含定制网络、存储、控制平面软件和低压 DC 母排；能效文章和
              CoreSite 发布还补充，效率提升来自去掉数十个 AC 电源、使用更大的风扇，并把机架作为统一系统运行。这些细节解释了可能的毛利驱动因素：硬件
              BOM、制造良率、物流、安装、保修、现场支持和库存持有成本都很重要。这也意味着，即便 Oxide 的客户体验借用了云的表达方式，也不应像纯软件私有云厂商那样建模。

              公开单位经济代理指标仍稀少，但方向上有用。Series B 文章指向漫长企业周期，Blocks & Files 则报道截至 2024 年 7 月交付机架少于 20
              个，且多数是单机架部署。这个组合意味着装机基础杠杆有限，高量扩张经济性也几乎没有公开证据。同时，官方页面反复声称相较公有云可节省 40% 至 71% 的计算成本、相较传统机架电力经济性提高 35% 至
              50%；如果 Oxide 能把工程效率转化为毛利润，价值主张确实存在。与此同时，既有厂商商业模式仍更灵活：AWS Outposts 定价提供三年期，可选择预付或月付；Azure Local
              则公布月度服务费。缺失的是从主张到财务结果的真实桥梁：在已审阅的公开语料中，收入、ARR、毛利率、支持附加率、积压订单或保修数据均未披露。
