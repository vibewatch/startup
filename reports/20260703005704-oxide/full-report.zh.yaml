  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险图谱
        blocks:
          - type: paragraph
            body: >-
              Oxide 最大的剩余风险，不是产品命题不连贯；证据反而显示，产品可信，切入点狭窄但真实，扩张路径受少数集中的失败模式约束。第一项是联邦采购资格漂移。Oxide
              刻意切入公共部门和主权云工作负载，公司自己的表述加上 Carahsoft 的包装，使国产来源、贸易协定和 Section 889
              审查成为商业承诺的一部分，而不是事后补项。如果供应链替换或未记录组件削弱这个承诺，公司可能失去最契合其安全与主权叙事的细分市场。第二组风险是运营：制造、库存和支持执行。Oxide
              仍是一家硬件创业公司，卖的是沉重、高功耗密度的机柜，必须运输、安装、现场服务并持续支持。当前出货量的公开证据仍薄，但最好的独立信号仍指向很小的装机基础，也就是说，即便一次扩张延误、一次关键故障或一次现场服务失误，都可能实质性动摇客户信心。第三组是财务模型不透明。新资本和合作伙伴验证有帮助，但公开来源仍未披露积压订单、毛利率或当前机柜数。对投资者来说，这意味着缓释因素看得见，剩余暴露却仍只能部分验证。
