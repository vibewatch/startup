  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - Nutanix
        - 市值约 $14.02B；过去 12 个月收入约 $2.75B
        - 约 5.1x 过去 12 个月收入；最新 10-K 于 2025-09-24 提交
        - 最接近的上市私有云软件可比公司，与混合云和 VMware 替代逻辑相通。
        - 软件主导业务，披露和装机成熟度都远高于 Oxide。
      - - Pure Storage
        - 市值约 $24.52B；过去 12 个月收入约 $3.94B
        - 约 6.2x 过去 12 个月收入；最新 10-K 于 2026-03-25 提交
        - 现代基础设施的上沿可比标的，软件和经常性服务组合更强。
        - 业务更偏存储，加上公开市场披露质量更高，因此比 Oxide 更清晰、更成熟。
      - - Dell
        - 市值约 $260.33B；过去 12 个月收入约 $134.00B
        - 约 1.9x 过去 12 个月收入；最新 10-K 于 2026-03-16 提交
        - 大规模一体化硬件和基础设施系统的下沿可比标的。
        - 集团规模和多元业务使 Dell 远不如 Oxide 纯粹。
      - - HPE
        - 市值约 $66.04B；过去 12 个月收入约 $38.79B
        - 约 1.7x 过去 12 个月收入；最新 10-K 于 2025-12-18 提交
        - 混合云 / 基础设施下沿可比标的，尤其可对照 GreenLake 式消费模式替代方案。
        - 上市公司，全球服务覆盖更广，产品集中风险远低于 Oxide。
    notes: 市值和过去 12 个月收入是 Stockanalysis 截至 2026-06-09 的公开市场快照；提交日期来自 SEC 浏览页面。
