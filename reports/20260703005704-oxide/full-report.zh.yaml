      - number: '7.2'
        title: 监管、法律与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Oxide 的监管和法律风险，集中在能否适配最契合客户的采购与安全环境。公司公开承诺符合 NDAA、BAA 和 TAA，并通过 Carahsoft 的联邦采购工具销售，因此 FAR 国产内容规则、贸易协定覆盖和
              Section 889
              审查都会变成实际商业落地门槛。垂直整合又放大了这项风险：同一套架构能堵住多厂商安全缝隙，也意味着物料清单、固件链和支持流程中更大一部分必须为联邦审查员保持干净证据链。出口和数据处理问题次要但真实。BIS
              指引意味着，任何跨境发货或外国主权部署都需要出口分类和许可管理，而公开材料看不到这套纪律。Oxide
              的隐私政策还确认，虽然工作负载数据由客户在本地控制，公司仍处理网站、招聘和部分企业服务个人数据。缓释面有意义：主权云表述强调开放固件、来源可追溯、硬件信任根和运营方可控连接，Red Hat 与 Carahsoft
              则提供外部验证，说明 Oxide 能进入企业和联邦采购流程。尽管如此，法律风险台账仍不完整，因为没有任何公开来源集合给出律师级的 IP、合同或诉讼暴露全景。
