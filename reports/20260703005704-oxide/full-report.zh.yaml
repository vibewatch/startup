      - number: '8.2'
        title: 正向论点、反向论点与可比锚点
        blocks:
          - type: paragraph
            body: >-
              支撑估值的逻辑始于一个真实市场切入点。Oxide 卖的不是通用服务器；它把定位放在主权和受监管工作负载、VMware 替换、金融服务低延迟要求，以及客户希望直接拥有的 AI 数据基础设施上。Carahsoft
              显示真实的联邦采购路径，Tech Field Day 捕捉到围绕联邦、金融服务和云 SaaS 的具体买方分层，Oxide
              自己的产品页面也持续围绕一次性购买经济性、无出站流量费、软硬件协同设计和第二代计算讲同一个故事。Broadcom 2025 年私有云调查和 ReadyWorks
              的回迁摘要进一步说明需求背景有利，尤其适合正在重新评估 VMware 或公有云成本结构的买家。


              反向论点同样重要。CIO.com 明确认为，回迁是选择性优化，而不是全面撤离云；这直接警告投资者不要采用过于激进的 TAM 假设。Blocks & Files 报道称，截至 2024 年中出货不到 20
              个机柜，并称多数部署仍是单机柜；这是有意义的商业证明，但不是后期规模。Oxide 所在市场也已经有强大既有厂商：Nutanix 和 Pure Storage 以类似软件公司的收入倍数交易，而 Dell 和 HPE
              则按低得多的硬件导向倍数交易。这些公开可比公司给出一个现实估值走廊，约为收入的 1.7x 到 6.2x。只有未来披露显示出软件式利润率、重复扩张和持久控制平面价值，而不是以硬件收入组合为主，Oxide
              才配得上这个区间上沿。
