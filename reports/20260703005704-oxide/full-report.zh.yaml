  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与 GTM 动作
        blocks:
          - type: paragraph
            body: >
              Oxide 的公开商业模式在形式上异常清楚，但金额不透明。公司把 Oxide Cloud Computer 营销为自有机架级系统，而不是租赁服务：官网、VMware 替代页面、HPC
              页面和公共部门采购材料都强调一次性基础设施采购、没有授权费、没有按量计费、客户拥有机架。这一定位强烈暗示收入模式以前置硬件系统销售为主，控制平面、更新和很大一部分软件价值被打包进合同，而不是作为单独计量订阅出售。不过公开标价缺失，因此实际
              ASP、折扣、付款条款，以及对支持或专业服务的任何拆分仍未知。

              公开 GTM 证据指向直接企业销售，而不是广泛经销渠道或自助式模式。Blocks & Files 报道称，Oxide 没有 OEM 路径，并且会选择交付对象；Series B
              文章则称企业销售周期「出了名地长」，即便早期客户从首次对话到系统交付的速度快于预期。Oxide 还把需求生成归功于播客、文档、RFDs 和源代码，说明其入站线索生成技术属性很强。近期 FAQ Friday
              文章补充了更多细节：Oxide 发布 SDKs、基于 Go 的 Terraform 和 Packer 式工具集成路径、CI/CD runner 指南、Windows 实例支持和 Kubernetes
              集成，这些都降低了平台团队的技术评估摩擦。Carahsoft 和 CoreSite 很重要，但它们是叠加在直接销售上的采购与部署赋能者，并非替代。这个组合更符合高接触、高 ACV
              基础设施销售，而不是互联网规模的软件主导先落地再扩张。Oxide 自己关于公司为何把工作负载迁回本地的 FAQ，也呼应更广泛的 CIO/Broadcom
              叙事：稳定工作负载、出站成本、监管、主权和延迟仍是主要经济与技术触发点。
