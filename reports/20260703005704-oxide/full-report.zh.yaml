      - number: '8.3'
        title: 情景区间与退出准备度
        blocks:
          - type: paragraph
            body: >-
              由于 Oxide 仍未披露收入或完整轮次条款，诚实的估值方法仍是绑定上市可比倍数的情景框架，而不是伪精确的点估值。悲观情景采用硬件式经济性：如果审计收入只有
              $50M-$100M，利润率更像一体化硬件而不是软件，相关可比区间约为销售额的 1x-2x，只意味着约 $50M-$200M 的企业价值。基准情景假设 Oxide 证明了混合基础设施模型，收入
              $150M-$250M，经济性更好但仍然混合；对应约 3x-4x 销售额，也就是约 $450M-$1.0B。乐观情景假设 Oxide 最终披露 $400M-$600M
              收入，利润率明确接近软件，多机柜扩张强劲，控制平面经济性粘性高；只有到那时，来自 Nutanix 和 Pure Storage 的 5x-6x 区间才有意义，对应约
              $2.0B-$3.6B。放在这个框架下，公开可见的约 $1.62B Series C 标记已经高于基准情景区间，进入需要异常强未来执行来证明的区域。


              同一个框架也解释了为什么退出准备度是混合的。产品成熟度、客户证明和融资续航可信。但 IPO 准备度不只是产品准备度；它要求上市公司级报告质量。Oxide
              仍缺少公开披露的收入、利润率、积压订单、客户集中度和股权结构条款。因此，最可能的近期退出里程碑不是立即 IPO，而是另一轮私募融资或伴随更充分披露的战略融资事件。公开证据支持 Oxide
              正在走向更大结果；但还不支持约 $1.62B 标记基于已披露基本面很便宜的判断。
