        - label: 启用
          description: Oxide 强调从机架安装到开发者可用只要数小时，用户通过 API、CLI 和现有自动化工具使用 VM 和服务。
        - label: 扩张循环
          description: 首台机架部署成功后，可以扩到更多工作负载、更安全的租户或更多站点，但这个循环的公开证据仍稀薄。
