  - id: TV001
    title: 推荐结论摘要表
    columns:
      - 决策项
      - 当前看法
      - 决策含义
    rows:
      - - 推荐
        - 继续研究
        - 继续对 Oxide 做主动尽调 / 跟踪；在价格和经济性披露前，不承销新一轮。
      - - 置信度
        - 中
        - 现在已有二级市场估值锚，但收入、利润率和股权结构支撑仍不完整。
      - - 风险评级
        - 高
        - 如果下一轮定价激进，资本强度、早期出货规模和透明度缺失会带来实质下行。
      - - 估值立场
        - 约 1.6B 的二级市场标记偏高
        - 可见的 Series C 标记高于本报告基准情形价值区间；只有披露更好的经济性，才会显得有吸引力。
      - - 退出姿态
        - 跟踪后续私募轮或战略融资
        - 近期价值拐点更可能来自披露充分的融资，而不是立即 IPO。
      - - 升级触发器
        - 披露收入 + 毛利率 + 实际轮次条款
        - 只有经审计运营数据和入场价格落在可比上市公司区间内，才从继续研究升至买入。
    notes: 公开证据现在通过 Forge 提供了粗略当前估值锚，但官方轮次条款和经审计运营指标仍然缺失。
