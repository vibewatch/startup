  - id: TV006
    title: 最终尽调问题表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前轮估值和每股价格
        - 已审阅公开来源未披露 Series B 或 Series C 投后估值、股价或稀释。
        - 没有实际价格，估值章节就无法对价格敏感。
        - 管理层 / 领投方尽调包；董事会材料；股权结构表摘录。
      - - 经审计收入和毛利率
        - 未发现 Oxide 公开披露收入、ARR、订单积压或毛利率。
        - 这些指标决定 Oxide 应接近硬件倍数还是软件倍数。
        - 经审计财务报表；CFO 尽调访谈；客户扩展分组数据。
      - - 订单积压质量和扩展画像
        - 公开证据没有区分试点、复购和成规模机群订单。
        - 最大估值问题在于，Oxide 是否正从单机柜安装走向成规模多机柜铺开。
        - 预订瀑布表；装机基础分组分析；续约 / 扩展计划表。
      - - 客户集中度
        - 已有具名客户，但公开证据没有量化收入或订单积压集中度。
        - 少数锚定客户一旦项目延误，下行风险会很尖锐。
        - Top-10 客户清单；细分集中度备忘录；客户访谈。
      - - 制造良率和保修准备金
        - 公开来源谈到了制造规模，但没有给出良率、退货或保修准备金数据。
        - 制造质量弱，硬件公司规模越大越可能毁掉价值。
        - 运营尽调；供应链审查；保修计提和现场故障数据。
      - - 优先权堆栈和反稀释条款
        - 清算优先权、参与优先股条款和反稀释权不公开。
        - 如果优先权堆栈很重，企业价值和普通股回报可能大幅背离。
        - 对公司章程、股票购买协议和股权结构表做法律尽调。
    notes: 这些问题按对估值的影响排序：价格、收入质量、规模转化、集中度、制造，最后是优先权负担。
    claimRefs:
      - CV005
      - CV041
      - CV046
      - CV049
      - CV051
