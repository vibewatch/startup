          type: risk-source
          detail: 合作站点里的部署可信度
        - id: d5
          label: 联邦管线
          type: intermediate
          detail: 公共部门订单和合规审查
        - id: d6
          label: 客户部署信心
          type: intermediate
          detail: 系统能够干净安装并获得支持的证据
        - id: d7
          label: 发货节奏
          type: intermediate
          detail: 按时交付已配置机架的能力
        - id: d8
          label: 客户背书扩张
          type: outcome
