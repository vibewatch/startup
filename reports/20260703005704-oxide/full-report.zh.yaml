      - number: '6.4'
        title: 反向信号与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              主要反向信号不是客户不满，而是客户不透明。最好的独立负面数据点仍是 Blocks & Files 在 2024 年中报道称，Oxide 出货不到 20
              个机柜，且多数是单机柜部署。对一家销售耐用基础设施层的硬件公司来说，这足以证明真实采用，却远不足以证明规模或多元化。同样，Carahsoft
              带来的联邦采购帮助减少了一类摩擦，但没有消除漫长审批周期、设施约束，或少数大合同主导早期管线的风险。即便最强的公开引用——LLNL 和 Switch——也仍是突出技术效用，而不是清晰的商业规模。

              因此，剩下的尽调问题很直接。投资者需要按客群划分的出货机柜和在线账户批次数据，早期客户第二单、第三单的证据，支持服务绑定与续约行为，以及当前头部客户集中度。还需要渠道组合：需求里有多少来自合作伙伴协助，多少来自直销；如果更多客户从单机柜安装走向多站点铺开，Oxide
              的支持组织能否跟上。在这些答案出现之前，客户章节支持一个建设性但谨慎的判断：Oxide 已经跨过从概念到真实买方需求的门槛，但公开证据基础仍像一家商业化早期的硬件公司，而不是一套被广泛验证的基础设施平台。
