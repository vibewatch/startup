      - number: '3.3'
        title: 定价、切换成本与分销力量
        blocks:
          - type: paragraph
            body: >-
              Oxide 的商业信息异常清晰：一次性基础设施采购、没有经常性软件授权、没有出站费用，并且在已安装容量内不限工作负载用量。这个卖点对逃离 VMware 订阅重置或公有云计量的买家有吸引力，但也意味着 Oxide
              要求客户提前承诺资本和实体空间规划。HPE GreenLake 与 Dell APEX 公开用按量付费、订阅或融资月供选项反击这一弱点；Azure Local 仍与 Azure 绑定；Nutanix
              强调软件式授权；AWS Outposts 则让买家留在 AWS 的运营和计费模式中。换句话说，Oxide
              的包装在总控制权上更透明，在近期预算形态上更不灵活。分销力量会放大定价差距。Dell、HPE、Microsoft、Amazon 和 Nutanix 都带着大型一线组织、成熟伙伴和支持历史进入客户。Oxide
              的公开分销面明显更窄：Carahsoft 打开了重要联邦路径，CoreSite 合作提供托管和近端部署选项，但这不同于全球渠道机器。切换成本因此两面作用。VMware 和 DIY 既有系统制造的痛点可以为
              Oxide 打开机会，但完整机架采购也意味着，一旦评测竞争输掉，Oxide 可能在客户整个更新周期内被排除在外。
