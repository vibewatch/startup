  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 概率信号
    rows:
      - - 乐观
        - Oxide 最终披露 $400M-$600M 收入、软件式毛利率、有意义的多机架扩张，以及持久的控制平面黏性。
        - 采用约 5x-6x 销售额倍数，与 Nutanix 和 Pure Storage 的可比上市公司上沿一致；隐含 EV 约 $2.0B-$3.6B。
        - 低；需要披露今天尚未公开的经济性和规模。
      - - 基准
        - Oxide 证明混合基础设施模式：收入 $150M-$250M，利润率稳健但不像软件，企业 / 公共部门能够重复扩张。
        - 对硬件 + 平台混合画像采用约 3x-4x 销售额倍数；隐含 EV 约 $450M-$1.0B。
        - 中；在公开运营数据改善前，这是最站得住脚的默认情形。
      - - 悲观
        - Oxide 仍主要是硬件厂商，收入 $50M-$100M，渠道宽度有限，单机架试点之外扩张温和。
        - 采用约 1x-2x 销售额倍数，与硬件占比较高的一体化基础设施可比公司一致；隐含 EV 约 $50M-$200M。
        - 中；若披露继续稀疏、规模转化滞后，该结果概率会上升。
    notes: 这些情景 EV 区间锚定可比上市公司的收入倍数，而非当前市场标记或 DCF 输出；观察到的约 $1.62B Series C 标记位于基准和乐观情形之间。
    claimRefs:
