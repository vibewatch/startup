    rows:
      - - 全球本地服务器 + 存储 + 网络硬件（IDC/Gartner 框架，行业推断）
        - 2024 估计
        - 全球
        - 所有本地数据中心硬件（服务器、存储、网络）
        - 估算：$80B–$130B/yr
        - 基于公开厂商收入（Dell、HPE、Lenovo、Pure、NetApp）加分析师估算，自下而上推算
        - 低
        - 口径严重过宽；Oxide 不参与大宗服务器转售竞争
      - - HCI / 私有云软件平台（Nutanix ARR 代理指标 + 市占率推断）
        - FY2025 估计
        - 全球
        - 软件定义 HCI + 私有云管理平台
        - 估算：$8B–$22B/yr
        - Nutanix FY2025 ARR 约 $2.1B × 假设 10–25% 市占率；高度不确定
        - 低
        - Nutanix ARR 只是收入代理指标，不是市场规模；HCI 定义横跨彼此不兼容的产品
      - - VMware 存量客户授权（Broadcom 收购背景）
        - 2024 年估计
        - 全球
        - 按当前 Broadcom 定价计算的 VMware 年度授权 TCV
        - 估算：$4B–$9B/yr
        - 以收购前 VMware 收入约 $4–5B/yr 为代理指标；Broadcom 涨价会把区间推高
        - 中
        - Broadcom 未披露收购后 VMware 专属收入；估算基于收购前数据和分析师评论
      - - 云回流可寻址支出（Barclays CIO 调研 / ReadyWorks 2024）
        - '2024'
        - 全球
        - 云到本地回流带来的年度本地 capex
        - 估算：$5B–$25B/yr
        - 83% 的 CIO 计划部分回流 × $723B 公有云支出的 2%，作为保守回流底线
        - 低
        - 回流是选择性的，不是整体迁回；83% 的意向不等于已承诺支出；估算高度依赖推断
      - - 机架级一体化云 SAM（Oxide 可直接服务的切入口）
        - 2024–2026 年估计
        - 全球，偏向北美 / 欧洲
        - 面向主权、VMware 退出、HPC 和联邦买方的垂直一体化机架级云计算机
        - 估算：$1B–$5B/yr
        - 基于 Nutanix 市场代理、回流信号和 Oxide 具名细分市场规模的分析师推断；不存在独立分析师估算
        - 低
        - 尚无分析师发布该品类估算；所有数字都是自下而上推断，不确定区间很宽
    notes: 主要图表数字（FM001、FM002）来自这些估算。TAM/SAM/SOM 框架反映数量级，不是预测。章节契约要求有意保留彼此冲突的分析师估算。
