  - id: FM001
    title: 市场规模金字塔——本地私有云 TAM / SAM / SOM
    type: pyramid
    layout: standard
    summary: |
      三层规模测算展示，广义本地硬件市场如何收窄到现代私有云平台层，再进一步收窄到 Oxide 可直接服务的垂直集成机柜级云计算机楔子。所有数值都是低置信度估算；没有独立分析师发布这个子赛道数据。
    data:
      items:
        - label: 全球本地基础设施硬件（广义 TAM）
          value: 105
          unit: $B/yr (2024 est.)
          color: '#1a3a5c'
          tooltip: >-
            Midpoint of $80B–$130B estimated annual on-premises server, storage, and networking hardware spend globally.
            Over-inclusive: includes commodity servers Oxide does not compete for.
        - label: 私有云平台 / HCI 层（SAM）
          value: 15
          unit: $B/yr (2024 est.)
          color: '#2563a8'
          tooltip: >-
            Midpoint of $8B–$22B estimated annual spend on software-defined HCI, private cloud management platforms, and
            converged infrastructure. Anchored to Nutanix ARR proxy + market-share inference.
        - label: 机柜级集成云系统（Oxide SOM）
          value: 2.5
          unit: $B/yr (est. 2024–2026)
          color: '#3b82f6'
          tooltip: >-
            Midpoint of $1B–$5B estimated annual spend on vertically integrated, API-first rack systems targeting
            VMware-exit, sovereign cloud, AI/HPC, and federal workloads. No independent analyst publishes this figure.
    approximationNotes: >
      TAM 采用公开硬件厂商收入和行业估算推导区间的中点。SAM 用 Nutanix 约 $2.1B ARR ÷ 假设 10–25% 市占率，得到 $8.4B–$21B 区间（中点约 $15B）。SOM
      是分析师推断；置信度低。这些数字是数量级估算，不是预测。
    claimRefs:
      - CM015
      - CM016
      - CM013
