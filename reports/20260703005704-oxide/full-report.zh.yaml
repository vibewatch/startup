  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 新资金、需求信号和产品差异化都真实存在，但缺少价格和经济性披露，挡住了买入建议。
    data:
      nodes:
        - id: capital
          label: 新资金
          detail: Series B 和据报道的 Series C 融资，给 Oxide 留出实打实的制造和路线图资金跑道。
          tone: positive
        - id: demand
          label: 需求切口
          detail: 联邦、金融服务、退出 VMware 和 AI 基础设施需求，支撑真实市场拉力。
          tone: positive
        - id: product
          label: 机架级差异化
          detail: 软硬件协同设计、第二代计算和拥有成本经济性，支撑战略差异化。
          tone: positive
        - id: opaque-price
          label: 未披露轮次估值
          detail: 已审阅的公开来源披露了融资金额，但没有披露最近两轮主要融资的价格。
          tone: warning
        - id: opaque-economics
          label: 无公开收入或利润率
          detail: 收入、毛利率、积压订单和优先权结构都缺少可见度。
          tone: warning
        - id: comp-band
          label: 上市可比公司区间为 1.7x-6.2x 销售额
          detail: Dell 和 HPE 锚定下沿；Nutanix 和 Pure 锚定上沿。
          tone: neutral
        - id: recommendation
          label: 继续研究 / 跟踪
          detail: 不要盲目买入；等价格和经济性披露，且能落进情景框架。
          tone: neutral
      edges:
        - from: capital
          to: recommendation
          label: 保持可投资性
        - from: demand
          to: recommendation
          label: 支撑继续尽调
        - from: product
          to: comp-band
          label: 可能撑起上沿区间
        - from: opaque-price
          to: recommendation
          label: 阻断投资测算
        - from: opaque-economics
          to: recommendation
          label: 无法选择倍数
        - from: comp-band
          to: recommendation
          label: 设定入场纪律
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV020
      - CV021
      - CV039
      - CV041
      - CV046
      - CV047
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 套用不同收入水平和上市可比公司倍数区间，企业价值支撑会剧烈变化。
    data:
      items:
        - label: $100M 收入，2x
          value: 0.2
          detail: 硬件式下行情景；EV 以十亿美元计。
          tone: negative
        - label: $250M 收入，2x
          value: 0.5
          detail: 即便硬件收入不差，低倍数也撑不起风投式溢价。
          tone: negative
        - label: $250M 收入，4x
          value: 1
          detail: 混合型基础设施业务的基准情景上限；EV 以十亿美元计。
          tone: warning
        - label: $400M 收入，5x
          value: 2
          detail: 要进入软件式估值区，披露规模必须强得多。
          tone: neutral
        - label: $600M 收入，5x
          value: 3
          detail: 有实质披露规模的溢价情景；EV 以十亿美元计。
          tone: positive
        - label: $600M 收入，6x
          value: 3.6
          detail: 上市可比上沿情景，更接近 Pure Storage 式估值支撑。
          tone: positive
    approximationNotes: 按 2026-06-09 观察到的上市可比区间做简单 EV / 销售额示意；不是 DCF 结果，也不是管理层指引。
    claimRefs:
      - CV039
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 只有二级市场约 $1.62B 估值标记、没有披露收入时，诚实的区间仍应围绕这个可见价格锚，做悲观 / 基准 / 乐观的企业价值框架。
    data:
      items:
        - label: 悲观情景
          low: 0.05
          mid: 0.125
          high: 0.2
          detail: $50M-$100M 收入，1x-2x 销售额；硬件式经济性占主导。
          tone: negative
        - label: 基准情景
          low: 0.45
          mid: 0.725
          high: 1
          detail: $150M-$250M 收入，3x-4x 销售额；混合基础设施画像。
          tone: warning
        - label: 乐观情景
          low: 2
          mid: 2.8
          high: 3.6
          detail: $400M-$600M 收入，5x-6x 销售额；软件式利润率和重复扩张得到证明。
          tone: positive
    approximationNotes: 数值是以十亿美元计的企业价值区间，绑定明确的收入和倍数假设。
    claimRefs:
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Oxide 在市场切口、产品差异化和资金跑道上得分最高；相对其可见的 Series C 轮估值，财务透明度得分最低。
    data:
      items:
        - label: 市场拉力
          score: 8
          detail: VMware 迁移、联邦数据主权和私有云需求共同推高了真实的市场紧迫感。
          tone: positive
        - label: 客户验证
          score: 6
          detail: 已有具名客户和渠道证据，但装机规模仍在早期。
          tone: neutral
        - label: 产品护城河
          score: 7
          detail: 机架级协同设计、第二代计算和所有权经济性形成差异化。
          tone: positive
        - label: 财务透明度
          score: 2
          detail: 公司未公开收入、利润率、积压订单或股权结构。
          tone: negative
        - label: 估值支撑
          score: 4
          detail: Forge 指向约 $1.62B 的 Series C 轮估值，但公开收入、利润率和优先权披露仍太薄，尚不足以完整支撑这一估值。
          tone: negative
        - label: 融资跑道
          score: 8
          detail: 近期融资为制造和路线图执行提供了真实运营跑道。
          tone: positive
        - label: 退出准备度
          score: 4
          detail: 产品和客户验证已经具备，但上市公司级报告准备度还没有。
          tone: warning
    approximationNotes: 评分为 0-10 分，是基于公开证据综合得出的投委会判断，不是机械模型。
    claimRefs:
      - CV002
      - CV009
      - CV017
      - CV020
      - CV041
      - CV047
      - CV048
      - CV049
      - CV050
      - CV059
