  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >
              Oxide 的产品不是普通 OEM 意义上的服务器 SKU
              家族；它作为完整机架级云系统销售，把计算、存储、网络和供给及运行工作负载所需的操作软件放在一起。抓取材料中的流程很明确：机架组装后到场，运营方提供电力和网络链路，通过技术员端口启动系统，然后进入网页控制台、CLI、API、Terraform
              或其他自动化驱动的供给流程。这让买家的任务更接近「拥有一朵私有云」，而不是「组装一个机架」。

              公开页面还显示，Oxide 试图用同一平台解决几项相邻任务，而不是用多个独立产品分别应对：VMware 替代、联邦主权基础设施、AI / 数据工程、HPC
              运营服务和混合云回迁。因此，模块地图最好理解为一个核心机架，上面叠加计算、存储、网络、控制平面和工作负载覆盖层。公开证据能支撑的是产品边界和当前暴露的模块，而不是完整内部 SKU 目录或报价矩阵。
