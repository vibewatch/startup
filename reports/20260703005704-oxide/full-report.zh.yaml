  - id: TV005
    title: 论点破裂与否决触发器表
    columns:
      - 触发器
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 未披露价格高于纪律区间
        - 下一轮在未披露经审计收入和毛利率的情况下定价高于约 $1B。
        - 公司尚未拿出支撑溢价的证据，这轮融资就会先跑过可比上市公司基准情形。
        - 不参与；等待更完整披露或明显更低的入场点。
      - - 收入披露低于预期
        - 经审计或管理层认证收入低于 $100M，或显示试点之外扩张乏力。
        - 悲观情形收入成为有效锚，软件溢价倍数假设失效。
        - 将估值重置到硬件式区间，并重新评估是否适合创投承销。
      - - 毛利率被证明像硬件
        - 毛利率仍低于约 20%-25%，或控制平面软件贡献不显著。
        - Oxide 失去 Nutanix / Pure 式倍数支撑逻辑，估值应更接近 Dell / HPE 区间。
        - 下调溢价倍数假设，并要求更严的价格纪律。
      - - 客户集中度极高
        - 单一客户或单一细分占订单积压或收入的 >40%。
        - 集中度抬高重新谈判风险，也削弱可复制平台的论点。
        - 要求客户分组明细，并在下行情景中计入集中度风险。
      - - 制造规模未能转化
        - 到下一轮融资周期，装机基础仍以单机柜部署为主，多机柜扩展有限。
        - 市场逻辑仍有看点，规模化故事没有跑通。
        - 把 Oxide 当作早期专业硬件公司，而不是突破型平台公司。
    notes: 这些阈值是基于公开证据和可比公司逻辑推导出的 IC 护栏，不是管理层指引。
