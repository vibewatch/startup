            body: >
              Oxide 最站得住脚的差异化，不是某个单点功能主张，而是全栈掌控的深度。Series B
              博文明说，公司自己做了板卡设计、微控制器操作系统、平台使能软件、虚拟化管理程序、交换机和交换机运行时、集成存储服务以及控制平面。公开文档和代码仓库印证了这套栈的大部分；能效博客和供应链文章也说明，Oxide
