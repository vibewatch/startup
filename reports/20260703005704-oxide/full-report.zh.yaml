      - number: '2.2'
        title: 市场规模：多视角下的 TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              还没有独立分析机构专门为机架级全一体化本地云计算机发布 TAM。规模测算只能用代理指标和相邻市场数据搭建，而这些数据都带有实质不确定性。最宽的 TAM 框架——全球本地服务器、存储和网络硬件——对应每年
              $80B–$130B 支出，来自数据中心硬件厂商收入和 IDC 相邻行业估计。这个框架过宽：它包含 Oxide 并不争夺的传统机架式服务器，也包含只买电力的托管合同。

              更紧的 SAM 以现代私有云平台层（API 优先、软件定义、HCI 或一体化系统）为边界。最可比的上市公司 Nutanix 在 2025 财年报告的年度经常性收入约为 $2.1B，为 HCI
              细分市场提供了软件收入下限。更广义的 HCI 市场（包括 Dell VxRail、HPE SimpliVity 和 Lenovo）意味着每年 $8B–$22B 的硬件 +
              软件市场，不过分析师估计分歧较大，各报告对细分定义也不一致。Oxide 的 SOM——面向联邦和金融市场中 VMware 退出、主权云、AI/HPC 和受监管工作负载的一体化机架系统切入口——估计为
              $1B–$5B。这个构造可信度低，应当视为数量级框架，而不是预测。

              第二个测算视角来自云回迁信号。CIO.com 2025 年分析引用的全球公有云终端用户支出，在 2025 年约为 $723B。2024 年 Barclays CIO 调查（EE Times 经
              ReadyWorks 报道）发现，83% 的企业 CIO 计划在 2024 年从公有云回迁至少部分工作负载，高于 2020 年的 43%。即使只有 2% 的公有云支出回迁，也会转化为每年约 $14B
              的本地再投资。相互矛盾的信号也保留：IDC 2024 年分析（CIO.com）显示，大多数企业预期的是选择性回迁，而不是全面退出云；$723B 的公有云总额也确认，云仍是多数新工作负载的默认目的地。
