    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与产品命题
        blocks:
          - type: paragraph
            body: >
              Oxide Computer Company 于 2019 年在加州 Emeryville 成立。Emeryville 是 San Francisco Bay 东岸、靠近 Oakland 的小城。创始人
              Steve Tuck（CEO）和 Bryan Cantrill（CTO）都来自 Sun Microsystems 和 Joyent，在系统软件与硬件架构上积累很深。公司在 2019
              年融资演示材料中提出的创立命题，到 2026
              年仍保持一致，分三层：云计算会成为所有计算的未来；出于安全、监管、延迟和经济性原因，大量企业仍需要自有本地部署；要在本地交付真正的云体验，硬件和软件必须从机架尺度开始一起设计。第三点是最有差异化的主张——Oxide
              不是把软件叠到多家供应商的通用服务器上，而是把计算 sled、网络交换机、电源架、固件、主机 OS、存储服务、hypervisor 和控制平面整合为一个可购买、以实体机架交付的产品。公司官网把 Oxide
              放在企业今天面对的两类失败模式对面：传统本地部署牵涉八家以上供应商、集成复杂、支持互相推诿；公有云租赁模式则带来不可预测账单、出站费用和主权缺口。Oxide 以「the cloud you own」定位，同时瞄准
              AI、HPC、关键任务和通用工作负载。截至运行日，产品已进入第二代硬件（采用 AMD EPYC 9005 / Zen 5 的 2nd Gen Sleds），公司在第三轮融资后正推进制造和客户扩张。
