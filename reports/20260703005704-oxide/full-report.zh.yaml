      - number: '3.2'
        title: 竞争对手画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              最站得住的直接比较，是 Oxide 与 Nutanix。两者都承诺在本地交付现代私有云运营模式。但 Nutanix 仍主要是拥有广泛生态兼容性的软件平台，Oxide
              则销售物理一体化机架，网络、存储、固件和控制平面全部是一方自研。AWS Outposts 和 Azure Local
              从相反方向切入同一工作负载集合：它们不是去掉云依赖，而是把超大规模云厂商的控制平面延伸进客户数据中心。HPE 和 Dell 围绕运维简化、融资灵活性和支持广度定位，通常保留多供应商或 VMware
              熟悉度，而不是用全新的运营模式替换它。公开证据显示，相较传统本地栈，Oxide 在一方 API 自动化、内建网络、块存储和可验证固件上异常强。公开文档、Terraform provider 和 Red Hat
              catalog listing 让产品表面具体可见，而不是概念化。同时，功能广度仍窄于既有厂商的宽目录；公开来源也无法证明它在周边企业服务上达到同等水平，例如
              DR、数据库生命周期工具、多集群队列管理或大型托管服务覆盖层。因此，对买家而言，关键问题不是 Oxide 是否足够现代，而是它的一体化路径能否覆盖足够多的周边运维边界，从而值得离开既有生态。
