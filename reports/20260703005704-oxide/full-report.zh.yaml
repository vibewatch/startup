      - number: '2.5'
        title: 约束、负面信号与规模测算缺口
        blocks:
          - type: paragraph
            body: >
              Oxide 近期市场渗透面临结构性约束。最突出的是，截至 2024 年中，Oxide 交付机架少于 20 个——这是最近一次由独立来源确认的数据。即便假设 $100M Series B（2025 年 7 月）和
              $200M Series C（2026 年 2 月）之后积极爬坡，公司的制造能力和商业规模仍只是 Nutanix（约 3,000+ 企业客户）、Dell（VxRail 广泛部署）或 HPE GreenLake
              的一小部分。赢下一家联邦机构，可能就要消耗数月销售和集成工作，最终只在单一地点落下一台机架。

              回迁趋势真实存在，但具有选择性。CIO.com 2025 年分析——基于 IDC 2024
              年数据——把云回迁描述为「更大范围工作负载放置纪律下的选择性优化，而不是撤离云」。大多数企业预期会有部分回迁，而不是全面退出，这限制了由回迁驱动的可服务 TAM。该信号直接反驳 Oxide 最乐观的 TAM
              叙事，因此保留为重要证伪信号。

              资本强度也是买方约束。Oxide 机架需要硬件采购承诺——截至运行日并不存在月度订阅模式。对习惯云运营支出模式、预算受限的买家而言，即便三到五年 TCO 对 Oxide
              有利，资本承诺仍是门槛。硬件销售周期比软件订阅销售更长，评估期（POC 部署）也需要投入实体基础设施。Nutanix、Dell VxRail、HPE GreenLake、AWS Outposts 和 Azure
              Local 等既有厂商都提供更灵活的商业条款和更广的支持生态。Oxide 的精确产品类别没有独立市场规模测算；没有额外专有数据，就无法验证任何具体 SOM 估计。
