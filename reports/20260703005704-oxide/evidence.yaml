evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Official Series C share price, dilution, liquidation preferences, and any company-confirmed post-money valuation.
    whyItMatters: >-
      The public ~$1.62B valuation anchor is only a secondary-market estimate, so investors still cannot fully assess
      dilution, control rights, or downside protection from public evidence alone.
    diligencePath: >-
      Request capitalization table, charter amendments, and the Series C financing summary from management or a
      participating investor; reconcile them against the public secondary-market estimate.
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: No official headcount figure found in any reviewed source; company does not publish team size.
    whyItMatters: >-
      Employee count is a key scaling signal and necessary for benchmarking revenue-per-head and burn rate against
      similar hardware companies.
    diligencePath: Request current org chart and headcount figure from Oxide management; LinkedIn data can provide a floor estimate.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: No ARR, revenue, gross margin, or unit-economics data found in any reviewed source.
    whyItMatters: >-
      Hardware companies have cost structures and gross margins that differ materially from SaaS; without revenue
      visibility, assessing burn and runway against the $389 M raised is impossible.
    diligencePath: >-
      Request audited financials or management accounts from Oxide; revenue per rack and total racks shipped as of June
      2026 would anchor the model.
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: deployment-scale
    missingEvidence: >-
      Total rack shipments as of February 2026 Series C close are not publicly stated; the last known data point (fewer
      than 20 racks) is from mid-2024.
    whyItMatters: >-
      The Series C was justified in part by product-market fit and scaling demand; the actual deployment footprint as of
      the close is relevant to validating that claim.
    diligencePath: >-
      Ask management for rack-shipped-and-in-production count as of Q1 2026; cross-reference with customer reference
      calls.
    relatedQuestionRefs:
      - QO016
      - QO004
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: governance
    missingEvidence: >
      Oxide's full board composition, investor governance rights, observer-seat holders, and executive team beyond the
      two co-founders are not publicly disclosed on the company website or in any reviewed filing.
    whyItMatters: >
      Without board and governance transparency, investors cannot assess who controls strategic decisions, exit timing,
      major capital expenditure approvals, or founder override rights after the Series C.
    diligencePath: >
      Request capitalization table and governance term sheets from Oxide management; confirm board seat holders for
      Eclipse, USIT, and any other lead-round investors; verify preferred-stock control provisions.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
