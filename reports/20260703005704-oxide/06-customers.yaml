- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction
  - Likely impact
  - Diligence path
  rows:
  - - Federal procurement routes and sovereign-cloud positioning
    - Long buying cycles and a small number of large program wins could dominate early revenue
    - Revenue may be lumpy even if technical demand is real
    - Request pipeline by agency, stage length, and booked-versus-live deployments
  - - VMware exit and hybrid-cloud migration
    - Buyers can choose incumbents with subscription or managed models instead of a capex-first rack purchase
    - Oxide may win technical bake-offs but lose on procurement or financing flexibility
    - Request close/loss reasons versus Nutanix, GreenLake, Dell APEX, and Outposts
  - - Service-provider replication via Switch
    - Only one clearly named operator proof is public
    - Multi-site expansion is plausible but not yet generalized across operators
    - Request number of operators in production and sites per operator
  - - HPC / AI adjacency
    - AI and research buyers often start with targeted evaluations before broad fleet rollouts
    - Expansion may occur workload by workload rather than as an immediate whole-data-center replacement
    - Request attach rates from initial data or orchestration workloads into broader platform usage
  - - Direct-sales / no-OEM posture
    - Channel and support concentration remain with Oxide even as customer demand expands
    - Scaling sales, deployment, and support may become a bottleneck before demand does
    - Request bookings mix by direct versus partner-assisted motion and support staffing per installed rack
  notes: Expansion logic is credible, but public proof remains concentrated in a few technically elite accounts. This table distinguishes demand vectors from the commercial and operational frictions that could limit realized expansion.
