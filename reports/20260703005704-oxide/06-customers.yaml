callouts:
- calloutType: strength
  title: Best fit is clearest in engineer-led, regulated accounts
  body: Oxide's strongest public references all come from buyers that both need cloud-like automation and cannot tolerate public-cloud governance, licensing, or telemetry constraints. That is a better signal than generic logo collecting because it shows the product solving hard, high-consequence infrastructure problems for demanding users.
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU014
  - CU015
- calloutType: risk
  title: Customer proof is real, but still too narrow to dismiss concentration risk
  body: Public customer proof has crossed the minimum threshold for credibility, yet it remains concentrated in a handful of technically elite references and lacks any current customer count, top-account mix, or renewal metrics. That is the classic profile of an early-commercial infrastructure company whose technical validation is ahead of its public commercial disclosure.
  claimRefs:
  - CU013
  - CU023
  - CU029
  - CU030
  - CU034
  - CU040
- calloutType: recommendation
  title: The next diligence step is cohort evidence, not more marketing references
  body: Management should be asked for shipped-rack cohorts, live accounts by segment, second-order history from early deployments, top-customer concentration, and renewal or support attachment. Those data would do far more to upgrade confidence than another logo page or generic AI workload claim.
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU034
  - CU040
