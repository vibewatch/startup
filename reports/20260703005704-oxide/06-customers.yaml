  rows:
  - - Direct Oxide sale
    - Financial services, cloud SaaS, HPC, and technically sophisticated enterprise buyers
    - Blocks & Files says Oxide has no OEM story and chooses who it ships to
    - Tight fit between product complexity and customer readiness; fewer integration mismatches
    - Channel breadth and support scaling depend heavily on Oxide's own sales and field teams
  - - Carahsoft / GSA / SEWP / OTA
    - Federal civilian, DoD, intelligence, and SLED buyers
    - Carahsoft markets Oxide solutions through standard federal vehicles
    - Reduces contracting friction and makes sovereign-cloud positioning concrete
    - Does not solve long program approvals, facility readiness, or classified deployment timelines
  - - CoreSite colocation surface
    - Connected enterprise and hybrid-cloud buyers needing a network-rich facility
    - CoreSite partnership places Oxide in SV2 and positions it for connected deployments
    - Faster setup in a known colocation environment with broad interconnection options
    - Partner dependency; no disclosed volume of customer wins sourced through CoreSite
  - - Ecosystem compatibility pull-through
    - Infra-savvy enterprises already using standard Linux, VM, and automation tooling
    - Documentation, Red Hat validation, and VMware-migration page all stress standard VMs and open APIs
    - Lowers migration friction because existing tools can move with the workload
    - Compatibility is not a reseller channel and does not itself prove bookings or renewals
