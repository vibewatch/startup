  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-coverage
    missingEvidence: A current customer roster or reference set showing which named accounts are live, which are pilot or proving-ground deployments, and which have expanded beyond a first rack.
    whyItMatters: Without broader named-customer coverage, the chapter cannot distinguish a narrow but real reference set from a diversified installed base.
    diligencePath: Request live customers by segment, top ten references management is willing to name, and the deployment stage plus rack count for each named account.
    relatedQuestionRefs:
    - QU022
    - QU026
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal rates, support attachment, contract length, and any cohort-style retention or expansion view.
    whyItMatters: Customer durability is the key missing variable in this chapter; without it, the investment case relies too heavily on technical fit and anecdotal proof.
    diligencePath: Ask for renewal cohorts, contract terms by segment, support attach rates, and expansion MRR or follow-on bookings from the first wave of shipped systems.
    relatedQuestionRefs:
    - QU017
    - QU026
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: repeat-deployment
    missingEvidence: Named examples of second and third orders, multi-site replication, or current racks per customer after the initial deployment.
    whyItMatters: Expansion logic is a major part of the Oxide thesis, but the public record does not yet show how often first-rack customers become multi-rack customers.
    diligencePath: Request account-level expansion history, installed-rack cohorts, and number of customers operating multiple Oxide racks today.
    relatedQuestionRefs:
    - QU009
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: channel-mix
    missingEvidence: Direct versus partner-assisted bookings mix, Carahsoft-sourced revenue, CoreSite-sourced opportunities, and support load by channel.
    whyItMatters: Channel concentration and support scaling can limit realized expansion even when demand is healthy.
    diligencePath: Ask management for bookings by channel, average sales cycle by motion, and support staffing or ticket load per installed rack.
    relatedQuestionRefs:
    - QU024
    - QU026
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: top-customer-concentration
    missingEvidence: Current shipped-rack total, active-customer count, and top-five customer revenue share.
    whyItMatters: Concentration cannot be quantified from public data, which leaves a major downside scenario unmeasured.
    diligencePath: Request FY2025-FY2026 bookings by top accounts, live account count by segment, and current shipped-rack total with a split between single-rack and multi-rack customers.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU002
    - TU005
