  rows:
  - - Federal / public sector
    - Agency CIO, program office, or procurement lead / security, networking, and platform teams / agency capital budget
    - Sovereign cloud, VMware replacement, air-gapped or classified workloads, mission systems
    - Tech Field Day segmenting federal buyers; Carahsoft and Oxide public-sector pages detail GSA, SEWP, OTA, NDAA/BAA/TAA positioning
    - U.S.-centric motion through Carahsoft plus direct sales
    - Long buying cycles and no disclosed current federal customer count
  - - Financial services
    - CTO or infrastructure leadership / trading, risk, and AI/ML operators / infrastructure capex owner
    - Low-latency trading, risk engines, governed AI/ML, predictable economics versus public cloud
    - Finance page plus launch references to an unnamed global financial-services customer
    - Direct enterprise sales; likely North America first
    - Strong use-case pitch but only thin named-customer disclosure
  - - Cloud SaaS / service-provider operators
    - CTO or platform VP / SRE and platform teams / internal infrastructure budget
    - Internal private cloud, hybrid-cloud repatriation, multi-site operations, data-locality performance
    - Tech Field Day and Switch deployment
    - Direct sales, colocation and hybrid-cloud surface via CoreSite
    - Public proof is concentrated in one named operator case
  - - HPC / AI / research computing
    - Research computing director or lab infrastructure owner / HPC operators, notebook and orchestration users / lab or research budget
    - Secure VMs and services alongside HPC, data pipelines, CPU-based AI inference, orchestration tools
    - LLNL announcement, HPC solutions page, AI page
    - National labs and advanced enterprises; U.S. strongest in public evidence
    - Good technical fit, but public revenue and expansion detail are absent
  notes: Segmentation is derived from named customer references, official solution pages, and the customer-use-case presentation. Oxide's broad market messaging spans more workloads than the public reference base currently proves; this table therefore distinguishes buyer fit from demonstrated breadth.
