figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Shows how Oxide's best-fit buyers move from pain recognition to first-rack deployment and, if satisfied, into follow-on workload or site expansion.
  data:
    items:
    - label: Pain recognition
      description: Buyers encounter a trigger such as VMware licensing pain, public-cloud cost volatility, sovereignty requirements, or insufficient telemetry for dense compute workloads.
    - label: Technical evaluation
      description: Engineer-led teams validate Oxide through Cloud Field Day content, documentation, public RFDs, and open-source code rather than only through marketing collateral.
    - label: Procurement path
      description: The first rack is bought either directly or, for public sector, through Carahsoft-linked federal vehicles such as GSA or SEWP.
    - label: Activation
      description: Oxide emphasizes rack install to developer availability in hours, with users consuming VMs and services through APIs, CLI, and existing automation tools.
    - label: Expansion loop
      description: Successful first-rack deployments can expand into more workloads, more secure tenants, or more sites, but public proof of this loop is still sparse.
  approximationNotes: The sequence is synthesized from public customer stories, solution pages, and Series B commentary. Oxide has not published a quantified funnel with conversion rates.
