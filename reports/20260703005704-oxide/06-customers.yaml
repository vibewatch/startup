company:
  name: Oxide
chapter:
  number: 6
  title: Customers
  summary: 'Oxide has credible but still narrow customer proof concentrated in technically sophisticated, regulated buyers: federal and public-sector agencies, national labs, financial-services infrastructure teams, and cloud or service-provider operators. Public evidence shows real deployment activity — Idaho National Laboratory at launch, LLNL''s HPC/cloud convergence installation, Switch''s internal private-cloud deployment, and under-20 racks shipped by mid-2024 — but durability metrics remain largely undisclosed. Expansion is plausible through VMware exit, sovereign cloud, and AI/HPC use cases, yet direct-sales execution, long federal cycles, and thin public reference breadth keep concentration risk high.'
sections:
- id: buyer-user-payer-and-channel-surface
  title: Buyer, User, Payer, and Channel Surface
  body: 'Oxide''s public customer narrative is much more specific than a generic "enterprise IT" pitch. Steve Tuck''s Cloud Field Day presentation describes three core segments already using or evaluating the system: federal agencies, financial-services firms, and cloud SaaS companies. Oxide''s own solution pages widen that picture to include sovereign-cloud buyers, VMware-migration and hybrid-cloud programs, plus HPC and AI operators that need on-prem infrastructure with public-cloud-style APIs. Across those segments, the economic buyer is typically an infrastructure or program owner who can approve a rack purchase, while the daily user is a technical team — security engineers, platform/SRE teams, networking teams, or HPC operators — that consumes VMs and services through Oxide''s control plane.

    The payer profile matters because Oxide is selling a one-time-purchase rack rather than a usage-metered service. That biases adoption toward organizations already comfortable with capex or with complex compliance requirements that make public cloud or multi-vendor private cloud unattractive. Channel surface is still narrow but real: Oxide sells direct, Carahsoft provides a federal procurement route through GSA, SEWP, and OTA vehicles, and the CoreSite partnership offers a connected colocation surface for enterprise deployments. The result is a customer base that appears well matched to the product''s technical strengths, but not yet broad enough to prove repeatable horizontal demand across ordinary enterprise IT buyers.'
