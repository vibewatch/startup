evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited financial statements confirming absolute ARR, gross margins, cash burn rate, and net revenue retention.
    whyItMatters: >-
      Without verified absolute revenue and cash margins, a $1 billion valuation cannot be confirmed as fair or
      sustainable.
    diligencePath: >-
      Request GAAP audited financial statements, billing cohort disclosures, and customer concentration reports under
      non-disclosure agreement.
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete listing of board directors, independent board observers, and equity ownership splits among founding
      executives.
    whyItMatters: Board composition and voting rights dictate executive control, governance risk, and founder retention incentives.
    diligencePath: Examine Delaware corporate filings, voting agreements, and board consent registers in the diligence data room.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: Cap table breakdown detailing pro-rata rights, liquidation preferences, and secondary transaction share transfers.
    whyItMatters: >-
      Liquidation waterfall structures and protective provisions significantly influence common shareholder downside
      risk.
    diligencePath: Review full capitalization table and Series A/B/B-2 investor rights agreements in the data room.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent market sizing data isolating the niche hardware test data intelligence segment from broad IoT and
      industrial analytics categories.
    whyItMatters: >-
      Broad IoT analytics ($53.1B in 2026) bundles smart city, retail, and general sensor analytics, obscuring Nominal's
      true addressable serviceable market (SAM).
    diligencePath: >-
      Request management's bottom-up TAM model based on engineering headcount and test bench density across aerospace
      and defense programs.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Public data disclosing average annual contract value (ACV) and software budget line-item allocation between
      program R&D funds and enterprise IT budgets.
    whyItMatters: >-
      Knowing whether purchases are funded through discretionary program testing budgets or centralized enterprise
      software licenses determines sales cycle velocity.
    diligencePath: >-
      Review customer procurement documentation and evaluate contract vehicle split between government IDIQ task orders
      and commercial prime subcontracts.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates-and-pricing
    missingEvidence: >-
      Empirical enterprise win rates, contract displacement metrics against NI/MathWorks, and standardized software
      subscription pricing schedules.
    whyItMatters: >-
      Without public win rates and realized enterprise pricing, commercial switching speed and pricing power relative to
      entrenched incumbents cannot be verified.
    diligencePath: >-
      Request customer displacement case studies, average contract values, win/loss logs against legacy vendors, and
      software license pricing tier sheets.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: >-
      Audited gross margin percentage breakdown between cloud data ingestion infrastructure and on-premise edge
      appliance deployments.
    whyItMatters: >-
      Without gross margin transparency, software unit economics cannot be verified against typical enterprise SaaS
      benchmarks of 75–85%.
    diligencePath: Request historical income statement and hosting cost schedule under NDA during management diligence.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: absolute-arr-and-nrr
    missingEvidence: Audited annual recurring revenue (ARR), net revenue retention (NRR), and customer concentration disclosures.
    whyItMatters: >-
      A 7x growth rate from an unstated base does not provide sufficient visibility to confirm whether current revenue
      supports the $1 billion valuation.
    diligencePath: Review unaudited cohort retention and revenue schedules in the confidential data room.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: telemetry-throughput
    missingEvidence: >-
      Empirical throughput and latency benchmarks for Nominal Connect edge streaming under multi-gigabit/sec sensor
      loads in defense hardware-in-the-loop environments.
    whyItMatters: >-
      Determines whether Nominal Connect can replace high-frequency specialized DAQ systems without dropping packets or
      buffering at the edge.
    diligencePath: >-
      Request customer HITL test harness logs and edge gateway resource utilization benchmarks during defense contractor
      diligence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-and-expansion-rates
    missingEvidence: Audited net revenue retention (NRR), gross revenue retention (GRR), and multi-year customer cohort churn rates.
    whyItMatters: >-
      Without retention and expansion data, customer durability and recurring SaaS expansion cannot be independently
      modeled.
    diligencePath: >-
      Request confidential customer cohort schedules, logo retention metrics, and gross/net dollar retention disclosures
      in management diligence.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof coverage
    missingEvidence: Comprehensive roster of all 60+ enterprise customer accounts and active defense program designations.
    whyItMatters: >-
      Public sources only name a subset of customer accounts (AeroVironment, Forterra, Pratt Miller) due to defense
      classification and commercial NDAs.
    diligencePath: >-
      Obtain an anonymized customer master list segmented by ACV bands and program classification in management
      sessions.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-compliance
    missingEvidence: >-
      Comprehensive audit of all active export control licenses, ITAR authorizations, and cybersecurity facility
      clearances held by Nominal for its defense customer deployments.
    whyItMatters: >-
      Failure to maintain appropriate export compliance or facility security clearances could suspend deployment across
      major defense prime contractor programs.
    diligencePath: >-
      Request DDTC registration records, ITAR compliance manual, and customer authorization letters during confirmatory
      diligence.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Detailed revenue breakdown by customer, contract renewal history, gross margins, and customer cohort churn rates.
    whyItMatters: >-
      High reliance on defense primes creates vulnerability to contract rebids, while undisclosed gross margins make
      long-term SaaS profitability unverifiable.
    diligencePath: >-
      Review customer-level ARR schedule, contribution margin by deployment type, and renewal cohorts under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QR009
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements confirming absolute annual recurring revenue, subscription gross margins, and net
      revenue retention rate across commercial and defense customers.
    whyItMatters: >-
      Without verified ARR and margin figures, an investor cannot confirm whether the $1 billion post-money valuation
      represents a supportable 10x-15x multiple or an aggressive 30x+ multiple on early revenue.
    diligencePath: >-
      Request confidential financial disclosures, GAAP income statements, customer-level ARR breakdowns, and historical
      retention cohort data during Phase 2 diligence.
    relatedQuestionRefs:
      - QV009
