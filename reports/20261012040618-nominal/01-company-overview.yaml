company:
  name: Nominal
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Nominal has established a dominant niche in hardware test data intelligence, reaching a $1.0 billion valuation
    backed by Founders Fund and Sequoia Capital, though private operating margins and absolute ARR remain essential
    diligence items.
sections:
  - id: corporate-identity-and-mission
    title: Corporate Identity and Mission
    body: >-
      Nominal has established itself as an essential data intelligence and test operations platform purpose-built for
      advanced engineering organizations. The company tackles the profound engineering bottleneck of capturing,
      synchronizing, and interpreting massive telemetry streams generated by modern aerospace and defense systems. Its
      product architecture cleanly bifurcates into Nominal Core, a cloud and on-premises collaborative workspace for
      data visualization and post-test review, and Nominal Connect, an edge computing execution framework that directly
      sequences instruments via Python. Headquartered in Los Angeles with engineering and operational hubs in Austin,
      New York, Washington D.C., and London, the business operates a high-touch enterprise software delivery model
      addressing aerospace, national security, and critical industrial sectors.
    claimRefs:
      - CO001
      - CO002
      - CO008
      - CO009
    tableRefs:
      - TO001
  - id: executive-leadership-and-governance
    title: Executive Leadership and Technical Governance
    body: >-
      The leadership team at Nominal reflects direct founder-market fit derived from firsthand technical frustrations at
      leading defense technology and software enterprises. Chief Executive Officer Cameron McCord previously directed
      test software systems at Anduril following service as a Navy nuclear officer, while Chief Technology Officer Jason
      Hoch engineered data correlation systems at Palantir Technologies. Co-founder Bryce Strauss contributed aerospace
      systems engineering perspective from Lockheed Martin. Recent additions reinforce executive capability, including
      Fid Labs founder Adam Wolnikowski guiding AI agent initiatives and engineering leaders Shawn Scully and Igor
      Stanko overseeing platform architecture. Enterprise governance incorporates multi-factor authentication and
      rigorous identity federation protocols across all cloud and edge deployments.
    claimRefs:
      - CO003
      - CO011
      - CO013
    tableRefs:
      - TO002
  - id: capitalization-and-investor-syndicate
    title: Capitalization, Valuation, and Investor Syndicate
    body: >-
      Nominal's capitalization trajectory exhibits rapid expansion, progressing from a $75 million Series B financing
      led by Sequoia Capital to an $80 million round in March 2026 spearheaded by Founders Fund. This latest financing
      priced the enterprise at a $1.0 billion post-money valuation, bringing lifetime raised capital to approximately
      $185 million. Commercial momentum appears brisk, with the company disclosing sevenfold revenue expansion following
      the Series B milestone. However, diligent investors must recognize that the financial term 'nominal' denotes face
      value unadjusted for inflation, highlighting the critical distinction between private valuation marks and
      verifiable cash flow fundamentals, especially given unreleased ARR and margin disclosures.
    claimRefs:
      - CO004
      - CO005
      - CO007
      - CO014
    tableRefs:
      - TO003
  - id: operational-scale-and-strategic-milestones
    title: Operational Scale and Strategic Milestones
    body: >-
      Operational expansion at Nominal is evidenced by headcount growth to 135 professionals across five strategic
      metropolitan offices in the United States and the United Kingdom. Strategic development has accelerated through
      programmatic acquisitions and open-source contributions designed to establish platform ubiquity. In April 2026,
      the firm completed the acquisition of Fid Labs to embed automated AI reasoning directly into telemetry analysis,
      followed in July 2026 by open-sourcing the Instro Python library for hardware instrument control. Expansion into
      elite motorsports with Pratt Miller showcases cross-sector adaptability from aerospace to high-performance
      automotive testing, demonstrating broad commercial applicability beyond government defense programs.
    claimRefs:
      - CO006
      - CO007
      - CO010
      - CO012
    figureRefs:
      - FO001
