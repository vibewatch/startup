  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: Audited financial statements confirming absolute ARR, gross margins, cash burn rate, and net revenue retention.
      whyItMatters: >-
        Without verified absolute revenue and cash margins, a $1 billion valuation cannot be confirmed as fair or
        sustainable.
      diligencePath: >-
        Request GAAP audited financial statements, billing cohort disclosures, and customer concentration reports under
        non-disclosure agreement.
    - type: enumeration-incomplete
      severity: material
      topic: leadership-and-founder-table
      missingEvidence: >-
        Complete listing of board directors, independent board observers, and equity ownership splits among founding
        executives.
      whyItMatters: >-
        Board composition and voting rights dictate executive control, governance risk, and founder retention
        incentives.
      diligencePath: Examine Delaware corporate filings, voting agreements, and board consent registers in the diligence data room.
