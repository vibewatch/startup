          note: 将实时边缘控制与协作式云端分析结合的持续硬件测试栈
        - label: National Instruments (Emerson)
          x: 2.2
          'y': 4.2
          note: 根基稳固的实验室仪器老牌厂商，拥有广泛 DAQ 产品目录和桌面 LabVIEW 套件
        - label: MathWorks (MATLAB/Simulink)
          x: 2.4
          'y': 3.6
          note: 领先的仿真与数学建模套件，重点是在物理测试前进行系统设计
        - label: 内部自研脚本
          x: 1.4
          'y': 1.6
          note: 针对特定测试台定制的 Python 和 Excel 脚本现状，但缺少平台持久性
        - label: 点式仪器示波器（Keysight/Tektronix）
