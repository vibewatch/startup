      - number: '2.2'
        title: 市场规模视角与可触达机会
        blocks:
          - type: paragraph
            body: >-
              估算专业硬件测试数据软件的可触达市场，需要结合多个相互重叠的行业口径，因为市场研究机构很少把纯硬件测试软件单独拆出来。Grand View Research 估计，全球物联网（IoT）分析市场 2026 年为
              $53.1 billion，预计按 28.3% CAGR 增长，到 2033 年达到 $305.8 billion。该市场中，工业制造是最大的终端应用领域，需求来自自动化遥测监控和预测性验证；北美以 30.0%
              的区域收入份额领先。Nominal 近期可触达的收入机会，主要集中于美国国家安全项目和航空航天国防主承包商。公司获得 Air Force Test Center $53 million 的 sole-source
              IDIQ 合同，说明政府愿意投入预算统一飞行与推进测试基础设施；其覆盖全球五大国防承包商中的四家，以及 $80 million Series B-2 和 $1.0 billion
              估值，也反映出机构资本对这一新兴市场的支持。
