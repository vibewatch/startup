      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 国防集中度与预算重配暴露
            body: 覆盖美国五大国防承包商中的四家，提供了无与伦比的验证，但也让公司严重依赖联邦国防拨款周期和主承包商项目寿命。
            calloutType: risk
