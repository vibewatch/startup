            body: >-
              Nominal 已成为先进工程组织不可或缺的数据智能与测试运营平台。公司解决现代航空航天和国防系统产生的海量遥测流在采集、同步和解读上的工程瓶颈。产品架构清晰分为两层：Nominal Core
              是用于数据可视化和测试后复盘的云端及本地协作工作空间；Nominal Connect 是通过 Python 直接编排仪器的边缘计算执行框架。公司总部在洛杉矶，并在 Austin、New
              York、Washington D.C. 和 London 设有工程与运营中心，以高接触式企业软件交付模式服务航空航天、国家安全和关键工业领域。
