      - number: '2.4'
        title: 增长驱动、网络安全要求与尽调路径
        blocks:
          - type: paragraph
            body: >-
              硬件测试数据智能的宏观增长动力来自地缘竞争加剧，以及自主军事系统快速工业化；在这一领域，从实体原型到投入作战的周期决定竞争优势。但严格的联邦网络安全和监管要求也牢牢限制了采用速度。美国国防部于 2025 年末完成
              CMMC 规则制定，并从 2025 年 11 月起在涉及 Federal Contract Information 或 Controlled Unclassified Information
              的所有国防招标和合同中启动第一阶段实施。对 Nominal Core 这类云端和混合工程平台而言，CMMC 第二阶段和 DFARS 要求严格遵守 NIST SP 800-171 控制，并要求商业云服务商证明达到
              FedRAMP Moderate 基线等效性或取得 C3PAO 认证。尽调应重点确认 Nominal
              的云环境能否满足这些门槛，而不必依靠压缩软件毛利率的高成本本地部署；同时还要弄清客户合同中经常性企业软件订阅与可变政府服务交付的占比。
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM011
              - CM012
