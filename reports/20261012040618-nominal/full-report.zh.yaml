        title: 边缘到服务器的技术架构与渲染引擎
        blocks:
          - type: paragraph
            body: >-
              Nominal 的架构是一条分布式边缘到服务器数据管线，旨在无损采集和渲染多通道传感器流。在边缘，Nominal Connect 将易用的 Python 脚本界面与高性能编译型 Rust
              运行时结合。测试工程师可以用 Python 编排仪器命令、处理传入遥测，而底层内存管理和高吞吐数据流则交给 Rust 的零成本抽象与编译期安全保障。为支持前端数据可视化和实时测试监控，Nominal 引入开源
              Bevy 数据导向游戏引擎的架构模式，采用 Entity Component System 模型，以即时模式渲染图形并按千赫兹频率并行绘制传感器流，超过传统显示刷新率。测试人员只需单击一下，就能把数 GB
              原始遥测或视频流从边缘直接传入 Nominal Core 的统一时序数据库，供全企业协作和长期性能跟踪。
