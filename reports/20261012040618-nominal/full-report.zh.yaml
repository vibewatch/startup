  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作流与产品范围
        blocks:
          - type: paragraph
            body: >-
              Nominal
              将市场边界定义在硬件测试仪器、遥测采集和协作式工程数据智能的交汇处。在航空航天、国防、能源和机器人等复杂实体工程环境中，硬件测试长期碎片化且依赖人工。现代测试事件会从数百条不同传感器流和测试台产生海量遥测，但工程团队缺乏快速规范化和分析数据的软件基础设施，开发因此严重受阻。Nominal
              用两层产品解决这一瓶颈：Nominal Core 是统一的协作数据库和可视化环境，用于测试后分析和运营监控；Nominal Connect 是在实体测试台直接执行 Python
              测试编排并确定性连接仪器的边缘计算平台。该边界覆盖从早期研发到生产验收的端到端遥测采集；AeroVironment 在无人机和巡飞弹生产线采用该平台就是例证。同时，公司不涉及商品化传感器制造、通用关系型 IT
              数据库和实体装配机器人。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
          - type: table
