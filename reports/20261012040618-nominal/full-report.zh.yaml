      - number: '2.3'
        title: 买方分层、预算归属与 ROI 动力
        blocks:
          - type: paragraph
            body: >-
              Nominal 的采用者包括国防主承包商、自动驾驶技术初创公司、军方测试设施和先进商业硬件制造商中的不同经济买方与技术用户。以 AeroVironment
              这类国防主承包商和自动驾驶开发商为例，经济买方通常是负责赶上紧张飞行测试进度的工程副总裁或项目经理；系统工程师、飞行测试负责人和仪器技术员则是日常活跃用户。采购主要来自项目研发拨款或工具预算，而不是集中式企业
              IT 软件池，核心动因是明确的投资回报。Nominal 声称，客户工程团队可将测试节奏最多提升 5x，并通过取消自定义脚本维护和人工整理数据，让每名硬件工程师每周节省约 10
              小时。除国防航空航天外，平台以工作流为中心的架构也在 Pratt Miller Motorsports 的高性能汽车工程和核聚变测试等先进能源领域获得 traction，显示买方需求可跨越高风险工业硬件垂直领域。
