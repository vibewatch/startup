          - type: paragraph
            body: >-
              Nominal 向关键任务航空航天和国防基础设施扩张，使公司暴露于严格的联邦及国际监管体系。要在美国五大国防主承包商中的四家部署软件，必须严格遵守 International Traffic in Arms
              Regulations（ITAR）和 Defense Federal Acquisition Regulation Supplement（DFARS）。由于 Nominal Core
              处理先进飞机、火箭和核系统的连续传感器遥测，任何云端数据汇总都必须严格限制 US-person 访问边界并采用 GovCloud
              租户，以避免严重出口管制违规。此外，联邦债务上限或持续决议造成的国防预算不稳定，会反复干扰合同拨款周期。历史上的 sequestration
              和预算延迟表明，军事采购可能不可预测地放慢，进而推迟国防承包商测试设施的全平台软件部署。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 运营可靠性与边缘硬件控制
        blocks:
          - type: paragraph
            body: >-
              Nominal Core 是分析型可观测性层，而 Nominal Connect 具备直接边缘计算能力，实时读写测试仪器。用 Python 脚本自动编排硬件，将 Nominal
              的风险从被动遥测可视化提升为主动运营测试控制。在火箭推进、航空航天结构或机器人等高后果测试环境中，软件延迟尖峰、网络丢包或命令编排错误都可能损坏实体硬件或使测试结果失效。同时，收购 Fid Labs
              后，公司把自主 AI agent 纳入测试工作流，也引入算法执行风险。如果 agent 生成错误的异常分析，或无法正确解读非标准遥测，工程团队可能做出错误设计决策，削弱对核心软件平台的信任。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: 客户集中度与生态依赖
        blocks:
          - type: paragraph
            body: >-
              Nominal 的商业模式在国防工业基地内存在明显客户集中。虽然服务 60 多家组织和数千名工程师，但核心收入和大型扩张合同高度集中于 Lockheed Martin 等头部国防承包商以及 Anduril
              等现代国防主承包商。这种集中带来交易对手风险：合同取消、项目里程碑延迟或内部国防 IT 指令，都可能不成比例地冲击 ARR 增长。此外，公司必须持续克服根深蒂固的组织惯性。航空航天测试团队长期使用自研
              MATLAB、Python 和传统 LabVIEW 测试脚本，替换这些定制工具需要持续工程赋能，并要无缝接入传统数据采集硬件格式。Nominal
              能否保持高留存，取决于能否证明持续节省时间，同时不引发厂商锁定担忧。
            claimRefs:
              - CR001
              - CR004
              - CR010
              - CR012
              - CR013
