      - number: '7.4'
        title: 宏观经济暴露与剩余风险矩阵
        blocks:
          - type: paragraph
            body: >-
              Nominal 以 $1 billion 估值完成 $80 million Series B-2 后，更广泛的软件市场动态带来估值和倍数压缩风险。企业软件的宏观逆风，包括 2026
              年初软件抛售和企业对软件席位的审查加剧，提高了市场对 ARR 快速增长的预期。此外，编码基础模型快速进步，可能促使买方自行组装基础遥测仪表盘，而不是购买商业企业许可。国际业务仍处早期，主要依托新设的 London
              办公室。拓展欧洲和盟国国防市场，需要应对本地化主权国防采购规则及外国出口管制制度，随着业务规模扩大，这会持续构成运营障碍。
            claimRefs:
              - CR011
              - CR014
          - type: figure
