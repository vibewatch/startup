  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 类别
      - 投资论点
      - 投资反论点
      - 观点转变触发条件
    rows:
      - - 市场与产品
        - Nominal 是解决国防和航空航天硬件测试数据瓶颈的领先软件平台。
        - 在非国防环境中，现有点解决方案和内部 Python 脚本可能仍然根深蒂固。
        - 有证据表明商业硬件客户已在国防主承包商之外广泛采用。
      - - 客户牵引力
        - 已部署于 5 家顶级国防主承包商中的 4 家、美国空军、Anduril 和 Shield AI。
        - 客户数 60 仍主要集中在高风险国防项目中。
        - 公开案例研究证明其已在汽车或能源领域拓展非国防企业客户。
      - - 估值与定价
        - 如果 Nominal 实现 $60M-$90M ARR 且毛利率达到 70%+，$1.0B 估值便有支撑。
        - 如果实际 ARR 低于 $40M，$1.0B 估值意味着倍数风险过高。
        - 尽调披露经审计 ARR 超过 $75M，且净留存率超过 120%。
      - - 竞争壁垒
        - 在实时边缘遥测（Connect）与云端分析（Core）之间形成专有集成，带来较高切换成本。
        - 传统仪器厂商或 PLM 提供商可能构建原生遥测摄取层。
        - 独立基准测试显示其在竞争激烈的企业方案评选中实现了竞争对手替换。
    notes: 对比产品、客户、估值和竞争壁垒方面的核心投资驱动因素与下行风险。
