  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 替代方案与竞争者画像
        blocks:
          - type: paragraph
            body: >-
              Nominal 面临四类竞争：传统自动化测试设备厂商、仿真与数值计算巨头、企业内部定制脚本，以及相邻的点式测量仪器。几十年来，National Instruments 凭借 LabVIEW 图形开发环境和模块化
              PXI 硬件架构，稳居实体实验室仪器与自动化测试台领导者，服务数千个航空航天和国防测试设施。与此同时，MathWorks 通过 MATLAB 和
              Simulink，成为上游系统工程、算法开发和基于物理建模的普遍标准，在大学课程和国防主承包商研发设施中几乎无处不在。但两家公司的核心软件架构都源于桌面、单工作站模式，早于现代云数据系统和持续集成方法。因此，工程组织长期依赖用
              Python、shell 脚本和 Excel 拼出的内部脚本，连接彼此隔离的测试台并手工拼接测试后数据。Nominal 提供全生命周期持续测试栈，把实时边缘仪器控制与云端协作分析统一起来，直面这一碎片化现状。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
      - number: '3.2'
        title: 能力与架构对比
        blocks:
          - type: paragraph
            body: >-
              Nominal 与传统竞争者的核心架构差异在于数据集成速度、执行拓扑和开发者体验。National Instruments TestStand 和 LabVIEW
              针对实体机架上的顺序、确定性测试执行进行了优化，但需要专门的图形编程技能，通常输出难以跨团队快速探索的孤立专有数据文件。MathWorks
              提供强大的离线数学建模和仿真工具箱，却没有原生实时基础设施来接收、同步和监测现场热试车或飞行运行中的数百个异构实体传感器。Nominal 则将架构拆为 Nominal Connect 与 Nominal
              Core：Connect 是直接连接实验室硬件的边缘计算层，让工程师用标准 Python 编排可重复测试并实时采集仪器遥测；Instro
              开源后，公司消除了驱动层面的厂商锁定，团队可以只改少量代码就更换硬件仪器。上游的 Nominal Core 提供带索引的云端协作工作空间，几分钟内自动对齐、检索和可视化多传感器测试数据，取代耗时的手工报告制作。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP011
      - number: '3.3'
        title: 商业模式与切换动力
        blocks:
          - type: paragraph
            body: >-
              对硬件测试替代方案的商业评估，显示出总拥有成本、许可结构和切换摩擦的显著差异。National Instruments 和 MathWorks 等 incumbents
              采用传统企业许可模式：高额前置工作站席位许可、昂贵的模块化工具箱附加费和年度软件维护合同，通常还绑定专有硬件机箱采购。内部定制脚本常被项目管理层视为零成本，但隐藏代价很高：工程团队每名工程师每周往往要花十小时以上调试测试
              harness、同步数据流。Nominal 采用现代企业软件订阅模式，让工程团队分摊软件投入并显著提速。例如，国防承包商 Shield AI 部署 Nominal
              后，日飞行测试节奏提升三倍，测试数据复盘时间从六小时压缩到三十分钟。不过切换摩擦仍然很大：经过多年验证的 LabVIEW
              测试台、严格的国防认证基线和组织惯性都会推高切换成本，因此更适合先落地再扩张，而非突然替换全部系统。
            claimRefs:
              - CP001
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP010
      - number: '3.4'
        title: 壁垒持久性与定位分析
        blocks:
          - type: paragraph
            body: >-
              Nominal 的竞争持久性依靠数据网络效应、高度工作流整合和领域专用
              AI。公司在边缘直接采集测试遥测，并在统一云数据层中补充上下文，因而嵌入头部航空航天项目的核心验证节奏；客户已包括美国五大国防承包商中的四家。收购 Fid Labs 后，Nominal
              将直接在测试工作流中引入针对硬件工程异常训练的自主 AI agent，进一步拓宽技术护城河。但替代风险仍在。Emerson 旗下的 National Instruments 正投资 NI Nigel 等 AI
