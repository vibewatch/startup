  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业客户从边缘仪器集成，到协作式测试分析，再到持续验证的采用生命周期。
    approximationNotes: 工作流阶段综合自 Nominal Connect 边缘文档和 Core 平台用户旅程规格。
    claimRefs:
      - CU008
      - CU014
    data:
      items:
        - label: 1. 边缘仪器摄取
          description: Nominal Connect 部署在测试台，通过 Python 对接传感器和硬件仪器。
          touchpoints:
            - Connect 边缘运行时
            - Python 测试编排脚本
            - 直接传感器 DAQ 数据流
        - label: 2. 实时遥测流
          description: 捕获高频时序数据，并直接流入 Nominal 的统一工业数据库。
          touchpoints:
            - 实时遥测仪表板
            - 自动数据拼接
            - 边缘到云同步
        - label: 3. 自动化测试后分析
          description: Core 算法自动对齐运行条件、识别异常并执行数学公式。
          touchpoints:
            - 跨运行信号搜索
            - 异常检测筛选器
            - 交互式可视化图表
        - label: 4. 协作式工程审阅
          description: 跨职能团队在浏览器工作空间中审阅动态数据集，取代静态幻灯片和 CSV。
          touchpoints:
            - 共享工作空间链接
            - 多用户数据标注
            - 自动报告生成
        - label: 5. 生产质量验证
          description: 生产线末端的制造检查点在子组件发往现场前执行验证规则。
          touchpoints:
            - 制造测试关卡
            - 质量合规审计
            - 零部件可追溯日志
        - label: 6. 车队运营反馈闭环
          description: 已部署资产的运营遥测反馈至研发测试套件，避免失效模式重复出现。
          touchpoints:
            - 在轨遥测数据流
            - 现场性能对比
            - 持续回归测试库
