  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Nominal 的核心投资论点建立在其头部硬件测试数据智能平台地位之上：公司解决了国防、航空航天和先进制造共同面对的关键瓶颈。通过 Nominal Core 和 Nominal Connect
              整合遥测管理、边缘自动化与云原生分析，公司把传统缓慢、碎片化的测试验证变成灵活工作流。客户验证来自美国五大国防承包商中的四家、美国空军、Anduril Industries 和 Shield AI
              的一级采用，另有收入顶线增长十倍的公司口径。公司近期又与 Pratt Miller Motorsports 拓展汽车业务、与 Antares 拓展核能业务，初步显示出超越政府国防项目的跨行业适用性。


              反过来，投资反论点强调倍数压缩风险和商业摩擦。投后估值 $1.0 billion 意味着 Nominal 必须快速扩张，才能让私人市场估值经得起上市工业软件可比公司的检验。如果非国防商业化停滞，而测试仍由内部
              Python 脚本或传统点式工具主导，Nominal 可能被困在国防细分市场。一旦主承包商合同扩张放缓或企业预算收缩，估值倍数就可能向传统工业软件供应商常见的个位数收入倍数回落。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: 当前融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Nominal 在 2026 年 3 月凭借 Founders Fund 领投的 $80 million B 轮扩展融资跻身独角兽行列，使这家成立三年半的企业投后估值达到 $1.0 billion。
              这笔融资距公司 2025 年完成的首轮 $75 million B 轮仅十个月；该轮由 Sequoia Capital 领投，Lightspeed Venture Partners、Lux Capital 和
              General Catalyst 参与。 公司整个发展周期累计获得约 $155 million 股权融资，为产品研发、工程团队招聘以及向 AI 驱动测试能力扩张提供了充足流动性。


              估值的快速跃升，反映出风险资本正激烈争夺服务国家安全和先进实体制造的关键基础设施供应商。不过，这一私人市场估值要求后期投资者严格把控入场价格。 若要在三至五年的投资周期内实现机构投资者 2.5x 至 3.5x
              的回报，Nominal 需要成长到 $2.5 billion 至 $3.5 billion 的企业价值；按保守的软件市场倍数计算，经审计的经常性收入须达到 $60 million 至 $120 million。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
      - number: '8.3'
        title: 公开可比公司与情景分析
        blocks:
          - type: paragraph
            body: >-
              与公开市场企业软件和工业软件可比公司的估值对标，显示不同软件类别之间存在明显的倍数分化。PTC 等成熟工业软件老牌公司按 8.2x 企业价值 / 收入和 16.7x EV/EBITDA 交易，毛利率高达
              84%，但营收增长乏力，同比下降 1%。 更广义的工业 IoT 和测试类公司估值倍数介于 Snap-on 的 3.5x 与 Samsara 的 14.6x 之间。相比之下，Palantir
              等高增长国防和数据智能平台享有最高倍数：在过去十二个月 $5.22 billion 营收、年增 67.7% 的基础上，市销率接近 59.7。


              由于 Nominal 未公开披露绝对 ARR、毛利率或净收入留存率，情景分析必须以当前市场倍数为参照，对经营结果划定区间。基准情景下，Nominal 的 ARR 达到 $55 million 至 $75
              million，维持 12x 至 16x 的合理软件倍数，支撑 $1.0 billion 至 $1.5 billion 的企业估值。 乐观情景要求商业势头加速，在年增长 60% 的情况下 ARR 超过 $180
              million，潜在退出估值达到 $2.5 billion 至 $3.5 billion。相反，悲观情景假设国防预算延迟、商业采用停滞，使 ARR 低于 $40 million，并将收入倍数压缩至 6x 至
              10x（估值 $400 million 至 $600 million）。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 建议立场与尽调要求
        blocks:
          - type: paragraph
            body: >-
              我们的尽调综合结论是“继续跟踪”，置信度为中等，估值判断为合理。Nominal 已将平台嵌入美国五大国防主承包商中的四家，并获得 Sequoia 和 Founders Fund
              等顶级风险投资联合体支持，产品市场匹配得到充分验证；但其财务指标仍属私人信息，尚不足以给出直接买入建议。在 $1.0 billion
              投后估值下，投资者是在为预期的经营执行力支付完整合理价格，而不是以折价买入一项已经确认具备安全边际的资产。


              要把“继续跟踪”转化为可执行的投资决策，后期尽调必须补齐三项关键信息。第一，投资者须查阅经审计的损益表，确认当前 ARR 是否超过支撑当前估值所需的 $60 million
              门槛。第二，须评估客户留存群组，验证国防主承包商和非国防企业试点客户的净收入留存率是否超过 120%。第三，尽调团队须拆解毛利率构成，确认现场工程和定制硬件在环集成不会侵蚀软件的长期盈利能力。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV008
              - CV012
              - CV014
