              - CV014
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 投资建议：继续跟踪
            body: >-
              Nominal 已凭借美国五大国防承包商中的四家，在国防与航空航天硬件测试领域建立了强大防御力。但在绝对 ARR、毛利率和净收入留存率尚无经审计披露的情况下，按当前 $1.0 billion
              投后估值投资，会让资本暴露于显著的倍数压缩风险。保持纪律性的跟踪立场，直到财务核验确认收入规模超过 $60 million。
            calloutType: recommendation
            claimRefs:
              - CV001
