      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营假设
      - 估值 / 回报逻辑
      - 关键风险与下行触发条件
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 从 $70M 增长至 $180M+，同比增速达到 60%+；汽车和能源领域的商业拓展成功；毛利率达到 75%。
        - 以 15x–20x EV/ARR 倍数为基础，目标 EV 为 $2.5B–$3.5B；持有 3–4 年可实现 2.5x–3.5x 回报。
        - 商业客户流失或国防采购周期延迟。
        - 基于国防现代化支出快速增长及一级主承包商采用，概率为 25%。
      - - 基准情景
        - ARR 达到 $55M–$75M，同比增长 35%–45%；核心国防业务稳步扩张，商业客户采用速度较慢。
        - 以 12x–16x EV/ARR 倍数为基础，目标 EV 为 $1.0B–$1.5B；可实现 1.0x–1.5x 回报（守住本金并获得适度上行）。
        - 由于现场工程和定制集成成本较高，毛利率压低至 65% 以下。
        - 概率为 50%，反映强大的国防壁垒，但商业企业销售周期较长。
      - - 悲观情景
        - ARR 停滞在 $40M 以下；非国防拓展失败；国防预算转向或主承包商整合限制合同金额。
        - 估值按 6x–10x 倍数压缩至 $400M–$600M（可比传统工业软件公司）；以低价轮融资或平价退出。
        - 国防预算大幅重新分配，或传统 PLM 厂商复制竞争对手功能。
        - 概率为 25%，反映当前 ARR 未经验证及客户集中度带来的下行敞口。
    notes: 情景模型以历史软件倍数（8x–20x EV/ARR）为基准，对比乐观、基准和悲观运营结果下的目标企业价值。
    claimRefs:
      - CV008
      - CV010
      - CV012
      - CV013
      - CV014
