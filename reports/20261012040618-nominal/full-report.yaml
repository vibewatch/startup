      - number: '7.2'
        title: Operational Reliability and Edge Hardware Control
        blocks:
          - type: paragraph
            body: >-
              While Nominal Core operates as an analytical observability layer, Nominal Connect introduces direct edge
              computing capabilities that read from and write to test instruments in real time. Enabling automated
              hardware sequencing via Python scripts fundamentally shifts Nominal's risk profile from passive telemetry
              visualization to active operational test control. In high-consequence test environments involving rocket
              propulsion, aerospace structures, or robotics, any software latency spikes, dropped network packets, or
              command sequencing errors could trigger physical hardware damage or invalid test outcomes. Concurrently,
              Nominal's acquisition of Fid Labs introduces algorithmic execution risk as the company incorporates
              autonomous AI agents into test workflows. If autonomous agents generate flawed anomaly analyses or fail to
              interpret non-standard telemetry correctly, engineering teams could make erroneous design decisions,
              undermining trust in the core software platform.
            claimRefs:
