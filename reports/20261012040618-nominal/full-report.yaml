              manufacturing verification across its autonomous aircraft and loitering munition production lines.
              Similarly, defense autonomous mobility provider Forterra selected Nominal to establish foundational test
              data infrastructure for its military ground vehicle platforms. These commercial partnerships align closely
              with broader Department of Defense initiatives such as the Navy's Collaborative Combat Aircraft program,
