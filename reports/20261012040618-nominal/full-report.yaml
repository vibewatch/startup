  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Workflows, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Nominal defines its market boundary at the critical convergence of hardware test instrumentation,
              telemetry ingestion, and collaborative engineering data intelligence. In complex physical engineering
              environments spanning aerospace, defense, energy, and robotics, hardware testing has historically been
              treated as a fragmented, manual endeavor. Engineering teams face severe development bottlenecks because
              modern physical test events generate massive telemetry feeds across hundreds of disparate sensor streams
              and test stands, yet lack modern software infrastructure to normalize and analyze that data rapidly.
              Nominal attacks this bottleneck through two dedicated product layers: Nominal Core, which serves as a
              unified collaborative database and visualization environment for post-test analysis and operations
              monitoring, and Nominal Connect, an edge compute platform executing Python test sequencing and
              deterministic instrument interfacing directly at physical test stands. This boundary deliberately includes
              end-to-end telemetry capture from preliminary R&D through production acceptance, as demonstrated by
              AeroVironment's adoption of the platform across uncrewed aircraft and loitering munition manufacturing
              lines, while excluding commodity sensor fabrication, generic relational IT databases, and physical
              assembly robotics.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.2'
        title: Market Sizing Lenses and Addressable Opportunity
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for specialized hardware test data software requires evaluating multiple
              overlapping industry lenses, as pure-play hardware test software is rarely broken out as an isolated
              category by market research firms. In the broadest context, Grand View Research estimates the global
              Internet of Things (IoT) analytics market at $53.1 billion in 2026, forecasting rapid growth at a 28.3%
              compound annual growth rate to reach $305.8 billion by 2033. Within this universe, the industrial
              manufacturing sector constitutes the single largest end-use segment, driven by automated telemetry
              monitoring and predictive validation requirements, while North America commands a leading 30.0% regional
              revenue share. At the serviceable market level, Nominal's immediate revenue opportunity is heavily
              anchored in U.S. national security programs and aerospace defense primes. The company's $53 million
              sole-source IDIQ award with the Air Force Test Center demonstrates strong government budget commitment to
              standardizing flight and propulsion test infrastructure, while deployments across four of the five largest
              global defense contractors and an $80 million Series B-2 round at a $1.0 billion valuation reflect
              substantial institutional capital backing this emerging market category.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
