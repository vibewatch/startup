        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Recommendation: Track'
            body: >-
              Nominal has established commanding defensibility in defense and aerospace hardware testing with four of
              the five largest U.S. defense contractors. However, without audited disclosure of absolute ARR, gross
              margin percentage, and net revenue retention, an investment at the current $1.0 billion post-money
              valuation exposes capital to significant multiple compression risk. Maintain a disciplined track stance
              until financial verification can confirm revenue scale above $60 million.
