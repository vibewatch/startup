  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Target Operational Profiles
        blocks:
          - type: paragraph
            body: >-
              Nominal targets engineering teams developing complex, mission-critical physical hardware where testing
              failures carry catastrophic capital or mission costs. Its primary customer base spans defense autonomy,
              aerospace telemetry, commercial robotics, and industrial energy systems. In defense autonomy, customer
              programs require continuous hardware-in-the-loop validation and high-frequency sensor capture across
              multi-domain uncrewed aerial and ground platforms. In aerospace, customer engineering groups utilize
              Nominal Core to ingest high-rate telemetry and monitor orbiting satellites in real time. Beyond defense
              and space, the platform has demonstrated cross-vertical adoption across high-temperature nuclear fusion
              research and elite commercial endurance racing with Pratt Miller Motorsports, proving that data management
              bottlenecks are universal across sophisticated hardware disciplines.
