  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Product Architecture and Lifecycle Positioning
        blocks:
          - type: paragraph
            body: >-
              Nominal provides an integrated data operations platform engineered specifically for complex physical
              hardware systems across defense, aerospace, robotics, and industrial manufacturing. The architecture
              resolves a foundational bottleneck in hardware engineering: while software teams benefit from modern
              version control and automated continuous integration, hardware telemetry has historically been trapped in
              fragmented spreadsheets, siloed local disks, and brittle test bench scripts. Nominal addresses this
              lifecycle division through two tightly coupled product tiers: Nominal Connect and Nominal Core. Nominal
              Connect operates as an edge compute application framework that executes directly on laboratory test
              benches, airport tarmacs, and launch pads, interfacing with physical test equipment in real time. Nominal
              Core functions as the centralized collaboration workspace, ingesting high-volume time-series telemetry
              from disparate test benches into a unified data structure. In April 2026, Nominal expanded this platform
