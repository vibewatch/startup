  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Nominal's core investment thesis rests on its position as the premier hardware test data intelligence
              platform solving a critical bottleneck across defense, aerospace, and advanced manufacturing. By
              integrating telemetry management, edge automation, and cloud-native analysis through its Nominal Core and
              Nominal Connect offerings, the company has transformed traditionally slow, fragmented test verification
              into an agile workflow. Customer proof is anchored by tier-one adoption across four of the five largest
              U.S. defense contractors, the U.S. Air Force, Anduril Industries, and Shield AI, accompanied by a claimed
              tenfold increase in top-line revenue growth. Moreover, recent strategic expansions into automotive with
              Pratt Miller Motorsports and nuclear energy with Antares demonstrate initial cross-industry applicability
              beyond government defense programs.


              Conversely, the investment anti-thesis highlights substantial multiple compression risk and commercial
              friction. At a post-money valuation of $1.0 billion, Nominal must scale rapidly to support its private
              mark against public industrial software comparables. If non-defense commercialization stalls and testing
              remains dominated by internal Python scripts or incumbent point tools, Nominal risks confinement to a
              defense niche. Any deceleration in prime contract expansion or enterprise budget contraction would trigger
              multiple compression toward single-digit revenue multiples characteristic of legacy industrial software
              providers.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
