        title: Adoption Trajectory & Reported Customer Scale
        blocks:
          - type: paragraph
            body: >-
              Nominal reports rapid commercial traction, scaling its active customer roster to more than 60 enterprise
              accounts across aerospace, defense, and robotics. Public directory filings and investment disclosures
              indicate the company expanded headcount from 43 to 135 employees while growing top-line revenue sevenfold
              year-over-year. Nominal claims its Core analytics environment accelerates hardware test cadence by up to
              5x while eliminating approximately 10 hours per week of manual data stitching and report preparation for
              individual hardware engineers. Despite these impressive velocity metrics, Nominal does not disclose
              baseline annual recurring revenue, gross revenue retention, or net revenue retention percentages.
              Consequently, it remains impossible to verify from public records whether commercial momentum reflects
              broad-based expansion or high concentration among top-tier defense programs.
