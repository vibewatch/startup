    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Mission
        blocks:
          - type: paragraph
            body: >-
              Nominal has established itself as an essential data intelligence and test operations platform
              purpose-built for advanced engineering organizations. The company tackles the profound engineering
              bottleneck of capturing, synchronizing, and interpreting massive telemetry streams generated by modern
              aerospace and defense systems. Its product architecture cleanly bifurcates into Nominal Core, a cloud and
              on-premises collaborative workspace for data visualization and post-test review, and Nominal Connect, an
              edge computing execution framework that directly sequences instruments via Python. Headquartered in Los
              Angeles with engineering and operational hubs in Austin, New York, Washington D.C., and London, the
              business operates a high-touch enterprise software delivery model addressing aerospace, national security,
              and critical industrial sectors.
