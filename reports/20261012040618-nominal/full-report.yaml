      - number: '2.4'
        title: Growth Drivers, Cybersecurity Mandates, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              The macro growth drivers for hardware test data intelligence stem from intensifying geopolitical
              competition and the rapid industrialization of autonomous military systems, where cycle time between
              physical prototyping and fielded operational capability dictates competitive advantage. However, this
              adoption trajectory is tightly constrained by rigorous federal cybersecurity and regulatory mandates. The
              Department of Defense completed the Cybersecurity Maturity Model Certification (CMMC) rulemaking in late
              2025, initiating Phase 1 implementation in November 2025 across all defense solicitations and contracts
              involving Federal Contract Information or Controlled Unclassified Information. For cloud-hosted and hybrid
              engineering platforms like Nominal Core, CMMC Phase 2 and DFARS rules require strict compliance with NIST
              SP 800-171 controls and mandate that any commercial cloud service provider demonstrate FedRAMP Moderate
              baseline equivalency or C3PAO certification. Diligence must focus on whether Nominal's cloud environments
              meet these compliance thresholds without requiring costly custom on-premise deployments that compress
              software gross margins, as well as clarifying how customer contracts split between recurring enterprise
              software subscriptions and variable government service delivery.
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM011
              - CM012
