        - $1.0B valuation represents excessive multiple risk if actual ARR is under $40M.
        - Diligence disclosure of audited ARR exceeding $75M with >120% net retention.
      - - Competitive Moat
        - >-
          Proprietary integration across real-time edge telemetry (Connect) and cloud analysis (Core) creates high
          switching costs.
        - Legacy instrumentation vendors or PLM providers could build native telemetry ingestion layers.
        - Independent benchmark showing competitor displacement in contested enterprise bake-offs.
    notes: >-
      Contrasts core investment drivers against downside risk factors across product, customer, valuation, and
      competitive moat dimensions.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR grows from $70M to $180M+ at 60%+ YoY; commercial expansion succeeds in automotive and energy; gross
          margins reach 75%.
        - >-
          Target EV of $2.5B–$3.5B based on 15x–20x EV/ARR multiple; provides 2.5x–3.5x return over 3–4 year holding
          period.
        - Commercial churn or delayed defense procurement cycles.
        - 25% probability based on rapid defense modernization spending and tier-1 prime adoption.
      - - Base Case
        - >-
          ARR reaches $55M–$75M growing at 35%–45% YoY; core defense business expands steadily while commercial adoption
          develops slowly.
        - >-
          Target EV of $1.0B–$1.5B based on 12x–16x EV/ARR multiple; provides 1.0x–1.5x return (preserves capital with
          modest upside).
        - Gross margins compressed below 65% due to high field engineering and custom integration costs.
        - 50% probability reflecting strong defense moat but long commercial enterprise sales cycles.
      - - Bear Case
        - >-
          ARR stalls below $40M; non-defense expansion fails; defense budget shifts or prime customer consolidation
          restricts contract values.
        - >-
          Valuation compresses to $400M–$600M at 6x–10x multiple (comparable to legacy industrial software comps);
          down-round or flat exit.
        - Severe defense budget reallocations or competitor feature replication by incumbent PLM vendors.
        - 25% probability reflecting downside exposure to unverified current ARR and customer concentration.
    notes: >-
      Scenario modeling benchmarks target enterprise values against historical software multiples (8x–20x EV/ARR) across
      bull, base, and bear operational outcomes.
    claimRefs:
      - CV008
      - CV010
      - CV012
      - CV013
      - CV014
