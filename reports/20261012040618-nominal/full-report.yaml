      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and ROI Dynamics
        blocks:
          - type: paragraph
            body: >-
              Adoption of Nominal's platform is driven by distinct economic buyers and technical users across defense
              primes, autonomous technology startups, military test facilities, and advanced commercial hardware
              manufacturers. Within defense primes and autonomous vehicle developers like AeroVironment, the economic
              buyer is typically a Vice President of Engineering or Program Manager responsible for meeting aggressive
              flight-test schedules, while systems engineers, flight test leads, and instrumentation technicians
              represent the daily active user base. Purchasing decisions are primarily funded out of program R&D
              allocations or tooling budgets rather than centralized enterprise IT software pools, motivated by acute
              return-on-investment metrics. Nominal claims customer engineering teams achieve up to a 5x acceleration in
              test cadence and save approximately 10 hours per hardware engineer each week by eliminating custom script
              maintenance and manual data collation. Beyond defense aerospace, the platform's workflow-centric
              architecture is gaining traction in performance automotive engineering with Pratt Miller Motorsports and
              advanced energy sectors like nuclear fusion testing, demonstrating transferable buyer demand across
              high-stakes industrial hardware verticals.
