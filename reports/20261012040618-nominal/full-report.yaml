  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              Nominal's expansion into mission-critical aerospace and defense infrastructure exposes the company to
              stringent federal and international regulatory regimes. Deploying software across four of the five largest
              U.S. defense prime contractors requires rigorous compliance with International Traffic in Arms Regulations
              (ITAR) and Defense Federal Acquisition Regulation Supplement (DFARS) standards. Because Nominal Core
              handles continuous sensor telemetry from advanced aircraft, rockets, and nuclear systems, any cloud-hosted
              data aggregation must maintain strict US-person access boundaries and GovCloud tenancy to avoid severe
              export control violations. Furthermore, defense budget instability driven by federal debt ceilings or
              continuing resolutions poses recurring friction to contract funding cycles. Historical sequester and
              budget delay dynamics demonstrate that military procurement can slow unpredictably, potentially postponing
              planned platform-wide software rollouts across defense contractor test facilities.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
