  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Monetization Models
        blocks:
          - type: paragraph
            body: >-
              Nominal structures its commercial monetization through software platform licensing anchored by two core
              offerings: Nominal Core and Nominal Connect. Nominal Core serves as the collaborative cloud and enterprise
              workspace for ingesting, managing, and visualizing complex time-series telemetry data generated during
              hardware validation. Nominal Connect operates at the edge, interfacing directly with physical test
              instruments, sensor benches, and hardware-in-the-loop test bays. Monetization follows an enterprise annual
              recurring subscription model where contract sizing scales with engineering seat count, active test bay
              instrumentation, and telemetry data throughput. To expand top-of-funnel adoption, Nominal open-sourced its
              Instro Python library in mid-2026, establishing a practitioner entry point that channels technical teams
              toward enterprise subscriptions. In addition, the April 2026 acquisition of AI startup Fid Labs positions
              Nominal to introduce premium domain-expert AI reasoning modules into its platform tiers. However, Nominal
              does not disclose public list pricing or tiered rate cards; all procurement requires customized quoting
              and demonstration workflows.
