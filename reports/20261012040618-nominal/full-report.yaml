      - number: '8.2'
        title: Current Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Nominal reached unicorn status in March 2026 by securing an $80 million Series B extension round led by
              Founders Fund, pricing the three-and-a-half-year-old enterprise at a $1.0 billion post-money valuation.
              This financing closed just ten months after its initial $75 million Series B round in 2025, which was led
              by Sequoia Capital with participation from Lightspeed Venture Partners, Lux Capital, and General Catalyst.
              Total equity capital raised across the company's lifecycle stands at approximately $155 million, providing
              substantial liquidity to finance product research, engineering hiring, and platform expansion into
              AI-driven test capabilities.


              The rapid step-up in valuation reflects aggressive venture competition to back critical infrastructure
              vendors serving national security and advanced physical manufacturing. However, this private valuation
              requires rigorous entry discipline from late-stage investors. Achieving an institutional return profile of
              2.5x to 3.5x over a three-to-five-year investment horizon demands that Nominal scale into an enterprise
              value of $2.5 billion to $3.5 billion, which necessitates delivering between $60 million and $120 million
              in audited recurring revenue under conservative software market multiples.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
      - number: '8.3'
        title: Public Comparables and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Valuation benchmarking against public enterprise and industrial software comparables exposes clear
              multiple bifurcation across software categories. Mature industrial software incumbents such as PTC trade
              at an enterprise value to revenue multiple of 8.2x and an EV/EBITDA multiple of 16.7x, accompanied by high
              84 percent gross margins but modest top-line revenue growth of negative 1 percent. Broader industrial IoT
              and testing peers trade at multiples ranging between 3.5x for Snap-on and 14.6x for Samsara. In contrast,
              high-growth defense and data intelligence platforms like Palantir trade at peak multiples, commanding a
              price-to-sales ratio near 59.7 on trailing twelve-month revenue of $5.22 billion with 67.7 percent annual
              expansion.


              Given that Nominal does not publicly disclose absolute ARR, gross margin percentages, or net revenue
              retention, scenario analysis must bracket operational outcomes against prevailing market multiples. In the
              base case, Nominal achieves $55 million to $75 million in ARR, maintaining a balanced 12x to 16x software
              multiple to support a $1.0 billion to $1.5 billion enterprise valuation. The bull case requires
              accelerating commercial traction to surpass $180 million in ARR at 60 percent annual growth, generating
              potential exit valuations of $2.5 billion to $3.5 billion. Conversely, the bear scenario models defense
              budget delays and stalled commercial adoption holding ARR under $40 million, driving multiple contraction
              to 6x to 10x revenue ($400 million to $600 million valuation).
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Recommendation Stance and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Our diligence synthesis yields a formal recommendation of track, paired with a medium confidence score and
              a fair valuation stance. While Nominal has demonstrated exceptional product-market validation by embedding
              its platform into four of the five largest U.S. defense primes and securing premier venture syndicates
              including Sequoia and Founders Fund, the private nature of its financial metrics prevents an outright buy
              recommendation. At a $1.0 billion post-money mark, an investor is paying full fair value for projected
              operational execution rather than purchasing a discounted asset with a confirmed margin of safety.


              To convert this tracking posture into an actionable investment decision, late-stage diligence must resolve
              three critical information gaps. First, investors must inspect audited income statements to confirm
              whether current ARR exceeds the $60 million threshold necessary to support the headline price. Second,
              customer retention cohorts must be evaluated to verify that net revenue retention surpasses 120 percent
              among defense primes and non-defense enterprise pilots. Third, the diligence team must evaluate gross
              margin composition, confirming that field engineering and custom hardware-in-the-loop integration do not
              erode long-term software profitability.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV008
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
