      - number: '5.3'
        title: Edge-to-Server Technical Architecture and Rendering Engine
        blocks:
          - type: paragraph
            body: >-
              The Nominal platform architecture spans a distributed edge-to-server data pipeline designed to ingest and
              render multi-channel sensor streams without data loss. At the edge, Nominal Connect pairs a
              developer-friendly Python scripting surface with a high-performance compiled Rust runtime. This separation
              allows test engineers to sequence instrument commands and process incoming telemetry in Python, while
              delegating low-level memory management and high-throughput data streaming to Rust's zero-cost abstractions
              and compile-time safety guarantees. For front-end data visualization and live test monitoring, Nominal
              integrates architectural patterns from the open-source Bevy data-oriented game engine. This architecture
              employs an Entity Component System model that enables immediate-mode graphics rendering and concurrent
              sensor stream plotting at kilohertz rates, exceeding conventional display refresh frequencies. Test
              operators can stream gigabytes of raw telemetry or video feeds with a single click directly from the edge
              into Nominal Core's unified time-series database for enterprise-wide collaboration and longitudinal
              performance tracking.
            claimRefs:
              - CE001
              - CE004
              - CE009
              - CE012
              - CE013
