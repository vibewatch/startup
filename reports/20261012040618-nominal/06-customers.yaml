  title: "Customers"
  summary: "Nominal has expanded to more than 60 enterprise accounts across aerospace, defense autonomy, and advanced manufacturing, securing named production deployments with AeroVironment and Forterra alongside commercial expansion into elite motorsport. However, customer concentration and retention durability remain unverified as the company does not publicly disclose ARR, net revenue retention rates, or multi-year cohort churn, leaving long-term growth exposed to multi-year military procurement cycles."
sections:
  - id: "customer-segmentation-and-target-profiles"
    title: "Customer Segmentation & Target Operational Profiles"
    body: "Nominal targets engineering teams developing complex, mission-critical physical hardware where testing failures carry catastrophic capital or mission costs. Its primary customer base spans defense autonomy, aerospace telemetry, commercial robotics, and industrial energy systems. In defense autonomy, customer programs require continuous hardware-in-the-loop validation and high-frequency sensor capture across multi-domain uncrewed aerial and ground platforms. In aerospace, customer engineering groups utilize Nominal Core to ingest high-rate telemetry and monitor orbiting satellites in real time. Beyond defense and space, the platform has demonstrated cross-vertical adoption across high-temperature nuclear fusion research and elite commercial endurance racing with Pratt Miller Motorsports, proving that data management bottlenecks are universal across sophisticated hardware disciplines."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU005"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-scale"
    title: "Adoption Trajectory & Reported Customer Scale"
    body: "Nominal reports rapid commercial traction, scaling its active customer roster to more than 60 enterprise accounts across aerospace, defense, and robotics. Public directory filings and investment disclosures indicate the company expanded headcount from 43 to 135 employees while growing top-line revenue sevenfold year-over-year. Nominal claims its Core analytics environment accelerates hardware test cadence by up to 5x while eliminating approximately 10 hours per week of manual data stitching and report preparation for individual hardware engineers. Despite these impressive velocity metrics, Nominal does not disclose baseline annual recurring revenue, gross revenue retention, or net revenue retention percentages. Consequently, it remains impossible to verify from public records whether commercial momentum reflects broad-based expansion or high concentration among top-tier defense programs."
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU013"
    tableRefs:
      - "TU002"
  - id: "named-customer-evidence-and-defense-programs"
    title: "Named Customer Proof & Defense Program Deployments"
    body: "Verified production deployments validate that Nominal has transitioned beyond early exploratory pilots into core operational workflows at major industrial manufacturers. In September 2026, AeroVironment formally partnered with Nominal to standardize test data capture, cross-team data review, and end-of-line manufacturing verification across its autonomous aircraft and loitering munition production lines. Similarly, defense autonomous mobility provider Forterra selected Nominal to establish foundational test data infrastructure for its military ground vehicle platforms. These commercial partnerships align closely with broader Department of Defense initiatives such as the Navy's Collaborative Combat Aircraft program, where prime contractors including Boeing, General Atomics, Northrop Grumman, Anduril, and Lockheed Martin are integrating autonomous software architectures for carrier-based combat drones."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "customer-expansion-loops-and-procurement-risks"
    title: "Expansion Loops, Workflow Adoption & Procurement Friction"
    body: "Customer expansion typically follows a two-stage land-and-expand trajectory: engineering teams initially introduce Nominal Connect at the edge to automate instrument control and Python-based test sequencing, then expand into enterprise-wide deployments of Nominal Core for collaborative telemetry analysis, anomaly detection, and automated compliance reporting. However, customer durability faces external macro risks rooted in military procurement timelines. Public evaluations of autonomous naval aviation highlight severe schedule friction, including a four-year operational testing slip on the Boeing MQ-25 Stingray and tight catapult recovery margins that historically triggered flight aborts. Because defense primes represent Nominal's most lucrative customer segment, budget realignments and defense testing bottlenecks represent critical operational dependencies."
    claimRefs:
      - "CU006"
      - "CU008"
      - "CU011"
      - "CU014"
    figureRefs:
      - "FU001"
