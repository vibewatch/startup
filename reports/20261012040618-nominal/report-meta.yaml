companyProfile:
  summary: >-
    Nominal is a hardware test data intelligence platform for aerospace, defense, robotics, and advanced manufacturing,
    pairing the Nominal Connect edge test-execution layer with the Nominal Core collaborative telemetry workspace. The
    company is headquartered in Los Angeles and sells enterprise software and integration services to mission-critical
    engineering teams that need to capture, synchronize, and analyze high-volume test data across physical hardware
    programs.
