        - "Commercial churn or delayed defense procurement cycles."
        - "25% probability based on rapid defense modernization spending and tier-1 prime adoption."
      - - "Base Case"
        - "ARR reaches $55M–$75M growing at 35%–45% YoY; core defense business expands steadily while commercial adoption develops slowly."
        - "Target EV of $1.0B–$1.5B based on 12x–16x EV/ARR multiple; provides 1.0x–1.5x return (preserves capital with modest upside)."
        - "Gross margins compressed below 65% due to high field engineering and custom integration costs."
        - "50% probability reflecting strong defense moat but long commercial enterprise sales cycles."
      - - "Bear Case"
        - "ARR stalls below $40M; non-defense expansion fails; defense budget shifts or prime customer consolidation restricts contract values."
        - "Valuation compresses to $400M–$600M at 6x–10x multiple (comparable to legacy industrial software comps); down-round or flat exit."
        - "Severe defense budget reallocations or competitor feature replication by incumbent PLM vendors."
        - "25% probability reflecting downside exposure to unverified current ARR and customer concentration."
    notes: "Scenario modeling benchmarks target enterprise values against historical software multiples (8x–20x EV/ARR) across bull, base, and bear operational outcomes."
