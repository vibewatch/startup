  title: Risks
  summary: Comprehensive risk evaluation analyzes Nominal's critical dependencies across defense prime contractor budgets, operational edge-actuator failure modes, export control compliance, and AI agent integration following the Fid Labs acquisition.
sections:
  - id: regulatory-and-legal-compliance
    title: Regulatory and Legal Compliance Risks
    body: Nominal's expansion into mission-critical aerospace and defense infrastructure exposes the company to stringent federal and international regulatory regimes. Deploying software across four of the five largest U.S. defense prime contractors requires rigorous compliance with International Traffic in Arms Regulations (ITAR) and Defense Federal Acquisition Regulation Supplement (DFARS) standards. Because Nominal Core handles continuous sensor telemetry from advanced aircraft, rockets, and nuclear systems, any cloud-hosted data aggregation must maintain strict US-person access boundaries and GovCloud tenancy to avoid severe export control violations. Furthermore, defense budget instability driven by federal debt ceilings or continuing resolutions poses recurring friction to contract funding cycles. Historical sequester and budget delay dynamics demonstrate that military procurement can slow unpredictably, potentially postponing planned platform-wide software rollouts across defense contractor test facilities.
    claimRefs:
      - CR001
      - CR002
      - CR003
    tableRefs:
      - TR001
  - id: operational-reliability-and-edge-hardware-control
    title: Operational Reliability and Edge Hardware Control
    body: While Nominal Core operates as an analytical observability layer, Nominal Connect introduces direct edge computing capabilities that read from and write to test instruments in real time. Enabling automated hardware sequencing via Python scripts fundamentally shifts Nominal's risk profile from passive telemetry visualization to active operational test control. In high-consequence test environments involving rocket propulsion, aerospace structures, or robotics, any software latency spikes, dropped network packets, or command sequencing errors could trigger physical hardware damage or invalid test outcomes. Concurrently, Nominal's acquisition of Fid Labs introduces algorithmic execution risk as the company incorporates autonomous AI agents into test workflows. If autonomous agents generate flawed anomaly analyses or fail to interpret non-standard telemetry correctly, engineering teams could make erroneous design decisions, undermining trust in the core software platform.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
    tableRefs:
      - TR002
  - id: customer-concentration-and-ecosystem-dependencies
    title: Customer Concentration and Ecosystem Dependencies
    body: 'Nominal''s commercial model exhibits pronounced customer concentration within the defense industrial base. While serving over sixty organizations and thousands of engineers, anchor revenue and large expansion contracts are heavily concentrated among top-tier defense contractors like Lockheed Martin and modern defense primes like Anduril. This concentration creates counterparty risk: contract cancellations, delayed program milestones, or internal defense IT directives could disproportionately impact ARR growth. Additionally, Nominal must continuously overcome entrenched organizational inertia. Aerospace test teams have historically relied on decades of proprietary in-house MATLAB, Python, and legacy LabVIEW test scripts. Displacing these bespoke tools requires continuous engineering enablement and seamless ingestion across legacy data acquisition hardware formats. Nominal''s ability to maintain high retention depends on proving sustained time savings without introducing vendor lock-in concerns.'
    claimRefs:
      - CR001
      - CR004
      - CR010
      - CR012
      - CR013
    tableRefs:
      - TR003
  - id: macroeconomic-exposure-and-residual-risk-synthesis
    title: Macroeconomic Exposure and Residual Risk Matrix
    body: Broader software market dynamics introduce valuation and multiple compression risks following Nominal's $80 million Series B-2 round at a $1 billion valuation. Macro headwinds across enterprise software, including the early-2026 software selloff and increased enterprise scrutiny over software seats, elevate expectations for rapid ARR generation. Furthermore, the rapid advancement of coding foundation models creates potential pressure from buyers attempting to assemble basic internal telemetry dashboards rather than purchasing commercial enterprise licenses. Internationally, Nominal's operations remain in an early stage, centered around a newly established office in London. Expanding into European and allied defense markets will require navigating localized sovereign defense procurement guidelines and foreign export regimes, representing an ongoing operational hurdle as the business scales.
    claimRefs:
      - CR011
      - CR014
    figureRefs:
      - FR001
