chapter:
  number: 2
  title: Market Analysis
  summary: Ominimo is best understood as a digital personal-motor MGA playing inside a fast-growing but fragmented European delegated-underwriting channel, not as a generic insurtech against all insurance spend. The market setup is attractive because price-sensitive motor customers, legacy carrier inefficiency, and passporting-friendly partner models create room for challengers, but regulation, local execution, and capacity dependence remain the key brakes on cross-border scale.
sections:
- id: boundary-sizing
  title: Market boundary and sizing lenses
  body: 'Ominimo is easy to overstate if the market is framed as all European insurance or even all insurtech. The public product evidence points to a much narrower and more useful boundary: digital personal motor insurance distributed through an MGA or carrier-partner structure. Ominimo''s Dutch page advertises liability-only, limited casco, and all-risk cover. Signal Iduna''s Hungarian materials and InsurTech List point to the same motor-centric scope. That means life, health, SME commercial, and most specialty lines should be treated as adjacencies rather than part of the current addressable pool.


    The right sizing lens is therefore layered. Howden Re gives the broadest context, describing a European MGA ecosystem with 650+ players and about €18 billion of GWP in 2024, while identifying Benelux and the Nordics as relevant regional clusters for the exact places Ominimo has already entered or targeted. But those figures are channel-wide, not company-specific demand pools. A tighter practical lens is the subset of personal motor customers in markets where digital purchase behavior, partner-carrier underwriting, and comparison-led acquisition can all work together. Public sources do not reveal an exact TAM, SAM, or SOM for Ominimo, so the defensible approach is to keep the stack qualitative and note the missing denominators explicitly.'
