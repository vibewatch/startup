- id: growth-drivers-constraints
  title: Growth drivers, regulatory friction, and market constraints
  body: 'The bullish market case for Ominimo rests on several real tailwinds. Legacy motor insurers still suffer from blunt pricing models, old technology, and slow change-management. The product pitch to good drivers who pay too much is therefore intuitive, and both Pro Global and Howden describe a broader MGA shift toward data-rich, capital-light underwriting platforms. Europe also offers structural leverage through passporting and partner-carrier models that can be cheaper than building a full-stack carrier in each country.


    The constraints are just as real. The Insurance Distribution Directive still governs distributors, while EIOPA and the AI Act add more explicit control expectations for AI-based insurance use cases. DA Strategy and MarshBerry both argue that local execution remains critical even when passporting exists on paper. Capacity dependence, governance discipline, data quality, and claims visibility remain the hard constraints that distinguish scalable MGAs from fragile ones. For Ominimo specifically, this means the company''s strong early traction in Hungary and adjacent smaller markets is not yet enough to prove that the model will transfer cleanly into the biggest Western European markets or into the United States. Public evidence is strong enough to support market promise, but not strong enough to collapse the diligence into one easy TAM number.'
