  topStrengths:
    - 从上线到约 €307M GWP 运行率、近百万客户，只用了约两年，早期扩张异常快。
    - 借助承保伙伴的轻资本 MGA 模式，Ominimo 扩张速度快过全栈保险公司。
    - 公开证据显示，公司不只是做前端包装，而是可能在定价和核保上有真实差异化。
    - Zurich 参与 Series A、EBRD 领投 Series B，为一家年轻欧洲保险科技公司提供了罕见强的外部背书。
    - 面向客户的 app、门户和多国产品页显示公司确有运营底盘，不只是融资叙事。
  topRisks:
    - 留存收入、续保质量和利润率结构基本未披露，估值难以下笔。
    - 承保方和渠道依赖仍高，因为大多数销售看起来经由合作伙伴流入，而不是靠直接品牌拉动。
    - 理赔、客服和服务一致性，可能最快伤害这种低切换成本监管产品的信任。
    - 自有牌照计划可能改善经济性，但也会显著抬高资本、准备金和控制要求。
    - $1.6B 估值给核保、治理或执行失误留下的余地很小。
  unresolvedGaps:
    - GWP 里有多少转化为 Ominimo 自身留存收入和贡献利润。
    - Hungary、Poland、the Netherlands、Sweden 按国家和渠道拆分的续保、流失和留存数据。
    - 伙伴承保方经济条款、终止权，以及按渠道或市场衡量的集中度。
    - Series B 后的现任董事会构成、股权结构权利、稀释和投资人控制安排。
    - 牌照资本计划，以及该模式能否以同样纪律扩展到更大的欧洲市场和美国。
