evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board list, shareholder rights summary, and post-Series-B ownership breakdown.
    whyItMatters: >-
      The company already carries a unicorn valuation, but public governance visibility still trails the scale of
      capital at risk.
    diligencePath: Request the latest board deck, cap table summary, and side-letter schedule directly from management.
    relatedQuestionRefs:
      - QO007
      - QO012
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: founders
    missingEvidence: >-
      A canonical founder list that clarifies whether Kristina Kozina is part of the legal founding team or an early
      operator omitted by some outlets.
    whyItMatters: >-
      Founding-credit inconsistencies do not break the commercial thesis but signal that public company history is still
      loosely documented.
    diligencePath: Confirm the incorporation history and founder roster from internal formation documents or a management Q&A.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: entity-structure
    missingEvidence: A legal-entity map showing which subsidiaries hold licenses, employees, and carrier contracts by country.
    whyItMatters: >-
      Ominimo is described variously as Serbia-founded, Novi Sad-headquartered, and Hungary-headquartered, which
      complicates jurisdictional diligence.
    diligencePath: Request the current entity chart, intercompany agreements, and country-by-country operating licenses from counsel.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: A company-specific TAM/SAM/SOM model with country assumptions, segment boundaries, and denominator logic.
    whyItMatters: >-
      Without a grounded sizing model it is easy to underwrite the $1.6B valuation against an inflated abstract market
      instead of the actual reachable wedge.
    diligencePath: Request management's market-sizing deck and reconcile it against live-market policy counts and launch sequencing.
    relatedQuestionRefs:
      - QM018
      - QM019
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: retention-denominators
    missingEvidence: Retention, renewal, quote-to-bind, and channel mix by market.
    whyItMatters: >-
      The category looks attractive only if customer economics remain healthy after acquisition and claims experience
      are measured at the cohort level.
    diligencePath: Request cohort retention, renewal, and channel-economics tables for Hungary and the first expansion markets.
    relatedQuestionRefs:
      - QM022
      - QM023
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: competitive-proof
    missingEvidence: >-
      Like-for-like pricing, retention, and loss-ratio comparisons versus Lemonade, Root, Zego, and major European
      incumbents.
    whyItMatters: >-
      The moat discussion cannot move from plausible to proven without standardized competitive evidence rather than
      isolated marketing claims and valuations.
    diligencePath: Request competitor benchmarking decks, renewal cohorts, and market-level loss-ratio comparisons from management.
    relatedQuestionRefs:
      - QP022
      - QP023
      - QP025
    relatedTableRefs:
      - TP003
      - TP004
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: A retained-revenue bridge, cash / burn / runway, reserve burden, and market-level cohort economics.
