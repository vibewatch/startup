- id: customer-proof-and-satisfaction
  title: Named customer proof and satisfaction proxies
  body: 'Because Ominimo is a consumer insurer, the best named-customer proof comes from verified or semi-verified review platforms rather than from logo case studies. In the Netherlands, Trustpilot offers the richest body of public evidence: over one thousand reviews, a 4.3 score, and a large cluster of comments praising price, easy switching, and helpful service. That is meaningful because it goes beyond a corporate testimonial page. At the same time, the same Dutch review page also contains harsh criticism about claims handling, poor follow-through, and inconsistent customer support. The net result is a real but mixed customer-proof set rather than a uniformly glowing one.


    Sweden is earlier. The Swedish Trustpilot page shows only five reviews and a 3.8 score, which is too small to call representative, but still useful as directional evidence. Those reviews include praise for easy online purchase, competitive pricing, and even smooth claims experience after a deer collision. The company also responds publicly to reviews, including negative ones, though Trustpilot says it often does so after more than a month. Taken together, public customer proof suggests Ominimo is genuinely solving a price-and-convenience problem, but that support and claims consistency will determine whether that early goodwill turns into durable renewal behavior.'
