- id: retention-and-concentration-risks
  title: Retention, concentration, and expansion risk
  body: 'The biggest customer diligence gap is durability. There is no public disclosure of churn, renewal, contract length, GRR, or NRR by country. That makes it impossible to know whether the customer base is simply price-responsive at acquisition or truly sticky over time. In motor insurance, where customers can shop at renewal and comparison sites lower switching friction, claims execution and service quality usually matter more than brand storytelling. Public reviews already hint at that: positive feedback often celebrates a cheap premium or quick support interaction, while negative feedback usually attacks claims resolution, unreachable support, or inconsistent answers.


    Concentration is the second major gap. If only around one in five policies are direct, then a large share of customers likely arrive through a relatively small set of brokers, affiliates, or comparison partners. Public materials do not disclose how concentrated that channel mix is, nor do they show how much of the near-one-million-customer total is truly active, current, and renewable. The customer verdict is therefore nuanced. Ominimo clearly has live demand and real production users, but the public evidence is still far stronger on adoption than on retention quality or concentration resilience.'
