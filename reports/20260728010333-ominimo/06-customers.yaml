chapter:
  number: 6
  title: Customers
  summary: 'Ominimo has real public customer proof: nearly one million customers claimed across four live markets, 300k+ launch-market policies in Hungary, a large Dutch Trustpilot corpus, and live self-service app workflows in Hungary and Poland. The unresolved question is not whether customers exist, but whether they are durable, renew smoothly, and are concentrated in a small set of channels or markets.'
sections:
- id: customer-base-and-adoption
  title: Customer base and adoption surfaces
  body: 'Public customer evidence is strongest at the top line. Beinsure says Ominimo serves nearly one million customers across four live markets, while TechCrunch says the Hungarian launch alone sold more than 300,000 policies in its first twelve months. Those two data points are enough to establish that Ominimo is well beyond proof-of-concept scale, but not enough to show how activity is distributed across countries, channels, or renewal cohorts. The correct segmentation is therefore geographic and channel-based rather than vertical or enterprise-style: Hungary as the original proving ground, then Poland, the Netherlands, and Sweden as expansion markets with different levels of public evidence.


    The app and portal footprint also helps explain adoption surfaces. Apple and Google both say the app is live for Hungary and Poland, with policy documents, payment status, profile changes, cancellation requests, and claim initiation built into the product. The Recursive adds that only around one in five policies are bought directly on Ominimo''s own site, which implies most customer acquisition still flows through partners and comparison paths. That does not weaken adoption, but it does mean the customer base is partly intermediated rather than purely brand-driven. It also means renewal quality and claims experience will matter more than vanity top-funnel traffic numbers over time consistently.'
