callouts:
- calloutType: strength
  title: Rapid scale with early underwriting discipline
  body: Public 2025-2026 coverage supports a rare combination of fast market expansion, near-term profitability claims, and a still-asset-light MGA structure rather than a balance-sheet-heavy carrier buildout.
  claimRefs:
  - CO013
  - CO014
  - CO021
  - CO023
- calloutType: risk
  title: Partner and governance dependence remain material
  body: Carrier partners, founder concentration, and sparse public governance disclosure mean the overview story is stronger on growth than on control, oversight, or downside transparency.
  claimRefs:
  - CO018
  - CO019
  - CO020
  - CO036
- calloutType: insight
  title: The license decision is the strategic fork in the road
  body: If Ominimo wins its own license, it could keep more economics and behave more like a full insurer; if it stays partner-led, it preserves speed and capital efficiency but remains structurally dependent on third parties.
  claimRefs:
  - CO018
  - CO019
  - CO033
