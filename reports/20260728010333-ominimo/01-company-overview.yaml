company:
  name: Ominimo
chapter:
  number: 1
  title: Company Overview
  summary: Ominimo is a 2024 Serbian-Hungarian motor-insurance MGA that scaled from a Hungary launch to roughly €307M of annualised GWP and nearly 1M customers across four live markets before raising a July 2026 Series B at about $1.6B valuation. Public evidence strongly supports the growth story and partner-carrier model, but governance detail, entity structure, and exact board composition remain thin relative to the valuation.
sections:
- id: identity-product-footprint
  title: Identity, product, and operating footprint
  body: 'Ominimo''s public record already shows a company that combines startup branding with a carrier-partner operating model more typical of a scaled MGA. Across its Dutch and Swedish product pages, Ominimo pitches itself as a cheaper and fairer digital motor insurer for good drivers, explicitly promising lower premiums, faster claims handling, and more flexible coverage choice than incumbent players typically offer. Those same pages make clear that the company is not yet a balance-sheet insurer in most markets: DA Direkt, part of Zurich Insurance Group, is repeatedly named as the carrier-backed partner behind the offer, while Hungarian materials connect the original launch to Signal Iduna.


    The market footprint is now wider than a single-country experiment. Public July 2026 coverage and Ominimo''s own local-market pages support a launch in Hungary in 2024 followed by expansion into Poland, the Netherlands, and Sweden. Product pages also show that the offer remains tightly focused on motor insurance: compulsory liability, limited or partial casco, and full casco variants with local packaging differences. The consumer workflow is also highly digital. The mobile app listings and customer-support pages say policyholders can access policy documents, payment status, vehicle details, cancellation requests, and claim initiation from the app or customer portal. That combination of focused product scope, heavy automation, and partner-carrier underwriting is the clearest description of Ominimo''s current operating identity.'
