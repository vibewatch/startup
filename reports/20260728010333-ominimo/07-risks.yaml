- id: dependency-financial-people
  title: Dependency, financial-model, and people risk
  body: 'Ominimo''s third risk cluster is structural dependency. Carrier partners matter for paper and trust, channels matter for volume, and a relatively small technical team appears to matter for the core underwriting edge. Public sources suggest only around one in five policies are direct, which means partner concentration is not a theoretical downside. If channel or carrier economics change, Ominimo may find that premium can grow faster than retained margin. At the same time, many of the core financial metrics that would help investors judge this risk — burn, runway, retained revenue, reserve burden, and partner take-rates — remain undisclosed.


    People risk compounds the model. The public founder narrative is still highly concentrated around Dusan Komar and a small technically elite team. That can be a strength in early execution, but it also means a lot of operating resilience remains unproven at scale. The overall risk view is therefore high, not because demand looks weak, but because control, concentration, and capital-transition questions remain only partially answered while the valuation already assumes a great deal of future success. Investors are effectively underwriting both execution and institution-building at the same time. That dual burden raises the chance that a small control lapse becomes strategically expensive.'
