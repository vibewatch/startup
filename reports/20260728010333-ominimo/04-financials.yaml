company:
  name: Ominimo
chapter:
  number: 4
  title: Financials
  summary: 'Ominimo has unusually strong publicly cited premium growth and credible early underwriting-discipline signals for a private MGA, but most of the investor-critical metrics still stop at gross written premium rather than retained revenue, margin, or runway. The financial case therefore looks promising but under-disclosed: the top line is visible, while the actual economics retained by Ominimo remain largely private.'
sections:
- id: revenue-traction
  title: Revenue model and public traction
  body: 'Public evidence describes Ominimo more like a fast-scaling premium engine than a transparently disclosed insurer P&L. The company and press coverage consistently emphasize annualised gross written premium, customer count, and launch-market policy volume rather than retained revenue, gross margin, or audited statutory financials. That is not surprising for a private MGA, but it changes what investors can responsibly conclude. GWP is a useful proof of demand and underwriting activity, yet it is not the same as revenue retained by Ominimo after partner-carrier economics and servicing obligations are accounted for.


    Even so, the trajectory is strong enough to matter. EU-Startups and Beinsure point to GWP run-rate moving from about €26.3 million in 2024 to €157.8 million in 2025 and roughly €307 million by mid-2026. Nearly one million customers across four live markets makes that growth feel operationally real rather than merely narrative. The problem is that public sources still do not connect this throughput to a normalized income statement. The right frame is therefore not that Ominimo has proven software-style economics, but that it has proven unusually strong top-line insurance activity for a company this young.'
