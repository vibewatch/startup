- id: unit-economics-cost-structure
  title: Unit economics, pricing, and cost structure clues
  body: 'The best public unit-economics evidence is indirect. The Recursive''s combined-ratio range of 92% to 100% and Life Insurance International''s claims-ratio-below-national-average note both suggest that growth is not obviously being bought through reckless underwriting. Official product pages reinforce the pricing narrative by stressing fair premiums for good drivers, while Dutch and Swedish pages also emphasize lower cost structure from avoiding expensive legacy technology, large office footprints, and heavy marketing overhead. Those signals fit the thesis of a lean underwriting-and-distribution engine, but they are still proxies rather than a disclosed unit-economics bridge.


    Channel mix is a critical part of that bridge. If only around one in five policies are direct, then partner-led distribution likely lowers brand-building cost while also taking a cut of the economics. That means the financial attractiveness of the model depends not just on claims performance, but also on how commissions, servicing costs, and renewals behave across countries. Public sources do not disclose those details. As a result, Ominimo looks more financially credible than a pure growth-at-all-costs insurtech, but still less transparent than a listed carrier or a mature private insurer.'
