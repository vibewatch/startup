- id: capital-adequacy-blockers
  title: Capital adequacy, licensing, and diligence blockers
  body: 'Ominimo''s capital-intensity story is attractive precisely because it is incomplete. The MGA structure lets carrier partners provide the balance sheet, while Ominimo focuses on pricing, distribution, and servicing. That reduces present-day capital needs relative to a full-stack insurer. But management also wants its own insurance license, and public sources explicitly frame part of the Series B use of funds around that objective. The financial upside is obvious: Ominimo could retain more underwriting economics. The downside is equally obvious: capital requirements, reserve demands, and regulatory overhead would all increase materially.


    This makes the company financially interesting but still diligence-heavy. There is no public disclosure of cash on hand, burn, runway, reserve burden, debt, or exact retained economics per policy. There is also no public cap-table detail sufficient to understand dilution or preference overhang after the Zurich stake and the EBRD-backed Series B. The financial verdict therefore has to stay disciplined. Ominimo has stronger growth and underwriting-discipline signals than many early insurtech stories, but too little public transparency to call revenue quality, capital adequacy, or margin durability fully underwritten.


    In practical terms, the next diligence dollar should go toward turning premium throughput into an auditable retained-economics model rather than toward debating headline valuation in isolation. That bridge is the missing step between an exciting growth story and a fully underwritable financial thesis for this business. Without it, premium scale can still mask weak margin conversion.'
