  topStrengths:
    - >-
      Exceptional early scaling from launch to roughly €307M GWP run-rate and nearly one million customers in about two
      years.
    - Capital-light MGA model with carrier partners lets Ominimo expand faster than a full-stack insurer would.
    - >-
      Public evidence suggests real pricing and underwriting differentiation rather than only cosmetic front-end
      innovation.
    - >-
      Series A with Zurich and Series B led by EBRD provide unusually strong external validation for a young European
      insurtech.
    - >-
      Customer-facing app, portal, and multi-country product pages show genuine operating substance, not just
      fundraising narrative.
  topRisks:
    - >-
      Retained revenue, renewal quality, and margin structure remain largely undisclosed, making valuation underwriting
      difficult.
    - >-
      Carrier and channel dependence remain high because most sales appear to flow through partners rather than direct
      brand pull.
    - >-
      Claims, support, and service consistency could become the fastest way to damage trust in a low-switching-cost
      regulated product.
    - The own-license plan could improve economics but also materially raise capital, reserve, and control requirements.
    - A $1.6B valuation leaves limited room for visible underwriting, governance, or execution disappointment.
  unresolvedGaps:
    - How much of gross written premium converts into retained revenue and contribution margin for Ominimo itself.
    - Country- and channel-level renewal, churn, and retention data across Hungary, Poland, the Netherlands, and Sweden.
    - Partner-carrier economics, termination rights, and concentration by channel or market.
    - Current board composition, cap-table rights, dilution, and investor-control structure after Series B.
    - >-
      Licensing capital plan and whether the model scales into larger European markets and the United States with the
      same discipline.
