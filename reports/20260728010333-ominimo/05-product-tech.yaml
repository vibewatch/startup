- id: trust-compliance-roadmap
  title: Trust, compliance, and roadmap
  body: 'Trust and compliance are visible in public materials, but mostly through disclosure rather than through deep technical evidence. The Swedish GDPR page is unusually detailed for a consumer insurer site: it lists the categories of personal data Ominimo processes, the role of profiling and automated decision-making, legal bases for processing, and a set of technical and organizational controls such as restricted access, encryption, logging, and employee training. The App Store listing adds an interesting contrast by saying the app itself does not collect data, which likely means Ominimo treats the app as a controlled interface into broader insurance systems rather than as an independent data-harvesting product.


    The roadmap is also fairly clear at a high level. July 2026 coverage says Ominimo plans to keep investing in AI and technology, expand into new markets, add new product lines, and secure its own license to keep more underwriting economics. What is not clear is how the company intends to govern model risk, bias testing, or security architecture as the product expands. The public product-tech verdict is therefore balanced: Ominimo shows enough evidence of a real digital insurance platform to take the technical story seriously, but not enough public engineering depth to underwrite the stack without management access. That missing engineering transparency is now the main product diligence blocker.'
