  columns:
  - assumptions
  - valuation/return logic
  - key risks
  - probability signal
  rows:
  - - 'Bull: combined ratio stays <=100%, retained economics prove strong, licensing optionality works'
    - Current mark can be defended and possibly compounded by better evidence quality
    - Larger-market expansion or licensing missteps
    - Possible but not yet evidenced
  - - 'Base: growth continues, but disclosure remains thin and valuation upside waits'
    - Returns depend more on execution proof than on multiple expansion
    - Partner dependence and retention uncertainty
    - Most consistent with current public record
  - - 'Bear: service, claims, or control failures emerge before economics are proven'
    - Valuation compresses sharply because little room for disappointment exists
    - Claims reputation, partner strain, regulatory slippage
    - Plausible if growth quality deteriorates
  notes: Scenario framing is intentionally qualitative because public evidence does not support formulaic valuation precision.
