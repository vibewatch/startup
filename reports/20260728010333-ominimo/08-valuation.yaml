- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Combined ratio deterioration
    - Sustained move above 100% without a temporary explanation
    - Undercuts underwriting-discipline thesis
    - Downgrade immediately
  - - Claims / review quality deterioration
    - More visible unresolved negative service or claims signals
    - Weakens customer-quality and retention assumptions
    - Add heavier valuation discount
  - - Partner / carrier strain
    - Evidence of weaker economics or reduced support
    - Hits capital-light moat and growth path
    - Re-underwrite model as riskier distributor
  - - Licensing slippage
    - Delays or capital burden outpace expectations
    - Turns upside option into financing risk
    - Reduce confidence materially
  - - Governance opacity persists
    - No improvement after diligence request
    - Leaves control risk unresolved at unicorn price
    - Maintain high risk rating / avoid upgrade
  notes: Kill triggers are intentionally practical and observable, not theoretical.
