- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Retained revenue bridge
    - How GWP converts into revenue and contribution margin
    - Needed to judge whether valuation is stretched or justified
    - Management finance diligence
  - - Renewal / churn cohorts
    - Country- and channel-level retention
    - Needed to convert customer count into franchise quality
    - Customer analytics / data room
  - - Partner economics
    - Carrier paper terms, commissions, and termination rights
    - Needed to assess margin durability and dependency risk
    - Legal + commercial diligence
  - - Governance and cap table
    - Board rights, preferences, dilution, control map
    - Needed to underwrite downside and investor protections
    - Corporate counsel / financing docs
  - - Licensing plan
    - Capital needs, timeline, regulator interactions
    - Needed to judge whether own-paper upside is real or risky
    - Regulatory diligence
  notes: These are the highest-value diligence asks because each one can move recommendation quality materially.
