companyProfile:
  summary: >-
    Ominimo is a private Serbian-Hungarian insurtech founded in 2024 that sells motor insurance through a capital-light
    MGA model backed by carrier partners such as Signal Iduna and Zurich/DA Direkt. The company combines granular
    pricing, digital servicing, and partner distribution to scale across Hungary, Poland, the Netherlands, and Sweden,
    and it reached a $1.6B valuation in July 2026 after an EBRD-led Series B. Public evidence supports unusually fast
    premium and customer growth plus credible underwriting-discipline signals, but its retained economics, cohort
    durability, and governance structure remain only partially disclosed.
