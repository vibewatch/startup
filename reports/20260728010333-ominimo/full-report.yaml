figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Ominimo moved from 2024 founding to a $1.6B valuation in roughly two years, with market launches and partnership
      milestones filling the gap between the two financings.
    data:
      items:
        - date: '2024'
          label: Founded
          detail: Founder team begins building an AI-first motor-insurance MGA targeting better risk segmentation.
          tone: positive
        - date: '2024'
          label: Hungary launch
          detail: First market goes live with Signal Iduna-linked underwriting support.
          tone: positive
        - date: 2025-04
          label: Series A with Zurich
          detail: Strategic capital and distribution partnership at roughly €200M valuation.
          tone: positive
        - date: 2025-Q2
          label: Poland launch
          detail: DA Direkt-backed retail motor launch begins cross-border rollout.
          tone: positive
        - date: 2025-Q3
          label: Sweden and Netherlands expansion
          detail: Model extends into two more carrier-partner markets.
          tone: positive
        - date: 2026-06
          label: Record sales day
          detail: The Recursive says Ominimo sold more than $1M of policies in 24 hours.
          tone: positive
        - date: '2026-07-27'
          label: Series B / unicorn
          detail: EBRD-backed round values Ominimo at about $1.6B and creates Serbia's first tech unicorn.
          tone: positive
        - date: 2027 target
          label: US launch plan
          detail: Management says the company is preparing for a United States launch after several additional EU markets.
          tone: neutral
    approximationNotes: Quarter markers are used where public sources describe launch sequence without an exact day.
    claimRefs:
      - CO009
      - CO015
      - CO017
      - CO021
      - CO033
      - CO034
