  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor set
        blocks:
          - type: paragraph
            body: >-
              Ominimo sits inside a crowded but not perfectly overlapping landscape. The closest reference group is
              digital motor insurers or MGAs serving retail drivers with algorithmic pricing and a strong online
              journey. That puts Lemonade, Root, and Zego closer to the everyday buying experience than claims-AI
              vendors like Tractable. It also makes wefox an important cautionary adjacent because it fused platform,
              MGA, and distribution ambitions before later restructuring.


              The category split matters. Lemonade competes with a broader multi-line consumer brand and public-market
              scale. Root competes on motor underwriting and public-company operating data. Zego shows how telematics
              and work-or-personal driving flexibility can also matter. Tractable attacks a different part of the value
              chain by automating claims workflows for carriers and repair networks. Ominimo is therefore neither a pure
              software vendor nor a classic carrier incumbent. It is a carrier-backed digital underwriting and
              distribution layer for motor insurance, which gives it capital-efficiency advantages but also limits some
              of the full-stack moats that broader insurers can build.
