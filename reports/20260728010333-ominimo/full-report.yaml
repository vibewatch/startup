      - number: '8.3'
        title: Scenario framing, kill triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case requires Ominimo to keep combined ratio disciplined, show that partner-backed growth
              converts into retained economics, and expand into larger markets without breaking customer trust or
              regulatory readiness. The base case assumes strong growth continues but valuation upside stays muted until
              investors get better evidence on revenue quality, renewals, and governance. The bear case is not that
              customers disappear, but that claims, licensing, partner, or control issues surface before the company
              proves that today's premium scale is truly high quality.


              That logic naturally pushes the decision process toward explicit kill triggers and diligence asks. Any
              visible deterioration in underwriting quality, claims reputation, partner durability, or licensing
              readiness should force a harsher stance quickly because the current valuation leaves little room for
              operational disappointment. Conversely, the recommendation could improve meaningfully if management
              provides a retained-revenue bridge, cohort retention, partner economics, and a governance picture that
              matches the scale of capital already invested. Until then, patience is part of the investment discipline,
              not a lack of conviction. Refusing to guess around missing inputs is the conservative move here, and it is
              what separates disciplined valuation work from momentum chasing.
