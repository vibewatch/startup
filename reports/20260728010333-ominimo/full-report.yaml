      - number: '1.3'
        title: Funding, traction, and milestone record
        blocks:
          - type: paragraph
            body: >-
              Ominimo's capital formation and operating metrics explain why the company crossed into unicorn territory
              so quickly. April 2025 sources describe a first external round from Zurich at roughly a €200 million
              valuation, while July 2026 coverage places the EBRD-led Series B at roughly €1.4 billion or $1.6 billion.
              That implies a roughly sevenfold valuation step-up in about fifteen months. Public reports also show that
              the Series B was framed less as survival capital and more as acceleration capital: the company says it is
              already profitable, wants to secure its own insurance licence, and plans to add both more markets and more
              products.


              The traction figures are unusually strong for such an early-stage insurer, but they should still be read
              as company-reported metrics rather than independently audited disclosures. EU-Startups and Beinsure cite
              annualised gross written premium run-rate moving from roughly €26.3 million in 2024 to €157.8 million in
              2025 and about €307 million by mid-2026. Beinsure adds nearly one million customers across four live
              markets. The Recursive adds richer underwriting context, saying combined ratio remains between 92% and
              100% and that only around one in five policies are sold directly through Ominimo's own site, with the rest
              distributed through partner channels. That mixture of fast growth, early profitability claims, and
              still-limited governance disclosure is the core diligence tension in Ominimo's overview: the operating
              story is impressive, but public evidence is still thin on board structure, full syndicate detail, and
              exact legal-entity architecture across the group.
