  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The public thesis for Ominimo is unusually compelling for a company this young. It has already shown a
              credible mix of premium scale, underwriting-discipline signals, and capital-light expansion through
              partner carriers. Few 2024-founded startups can claim nearly one million customers, a roughly €307M GWP
              run-rate, and a unicorn valuation within two years. If that growth really sits on a differentiated pricing
              engine and disciplined distribution model, there is a real chance Ominimo becomes one of Europe's standout
              personal-lines insurtech stories.


              The anti-thesis is just as clear. The valuation already assumes more proof than the public record
              provides. Investors can see gross written premium and customer count, but not retained revenue, renewal
              cohorts, margin structure, or cap-table detail. That means the most honest current recommendation is not a
              confident buy or avoid. It is research-more: the story is too strong to dismiss, but too opaque to
              underwrite at face value. Confidence in that call should remain medium, with a high risk rating and a
              stretched valuation stance until deeper diligence closes the biggest evidence gaps. In other words, the
              public case earns curiosity, not carte blanche, and certainly not valuation complacency. That is the
              discipline this chapter is trying to preserve under present uncertainty today.
