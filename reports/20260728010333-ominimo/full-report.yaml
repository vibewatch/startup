      - number: '7.2'
        title: Operational, claims, and service risk
        blocks:
          - type: paragraph
            body: >-
              Customer-facing operational risk is already visible in public sources. Dutch Trustpilot reviews include
              harsh claims that support can be slow or unhelpful and that claims outcomes can disappoint badly. Sweden
              looks better, but the sample is tiny and Trustpilot says Ominimo often responds to negative reviews only
              after more than a month. The product category matters here: motor insurance is legally required, low
              switching cost, and emotionally charged when a claim happens. A visibly weak claims or support experience
              can therefore damage trust faster than in many software businesses.


              There is also a quieter technology risk. Ominimo presents a strong digital workflow and a sharp
              underwriting narrative, yet exposes very little public detail on security architecture, fraud controls,
              uptime, or incident-response discipline beyond general GDPR language. That gap does not prove a control
              failure, but it does mean investors are effectively asked to trust the operating story without audit-grade
              technical evidence. In a company this young and this fast-growing, that is a real residual risk rather
              than a documentation nuisance. If a control failure ever becomes public, reputational damage would likely
              move faster than management explanations. The absence of quantified cyber or fraud evidence keeps this
              risk stubbornly open.
