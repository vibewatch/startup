      - number: '5.2'
        title: Operating architecture, workflow, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The strongest public technology signal is Ominimo's claim that better underwriting comes from more
              granular data and a more modern operating stack than incumbent insurers use. The Dutch page says Ominimo
              relies on many hundreds of data points, while TechCrunch and The Recursive make the same argument in
              stronger form, describing a pricing engine that uses non-obvious variables and XGBoost-style methods to
              produce individualized rates. The Recursive goes further by describing a cloud-native, internally built
              microservices environment that can expand across markets mainly by changing localized configurations
              instead of rebuilding the full stack from scratch. If accurate, that is a meaningful technical advantage
              in a category where legacy carriers still struggle with change speed.


              But the architecture is inseparable from partner dependence. Signal Iduna's pages say Ominimo concludes
              and manages policies while the carrier provides the actual coverage, and Zurich/DA Direkt fills a similar
              role in other markets. That means Ominimo's real product is a combination of proprietary pricing, digital
              workflow, and partner-backed risk capacity. The workflow is therefore modern, but not fully vertically
              integrated. It remains partly constrained by carrier relationships, local claims processes, and whatever
              system boundaries sit between Ominimo's code and partner infrastructure.
