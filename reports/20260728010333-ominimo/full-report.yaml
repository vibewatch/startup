  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Ominimo's publicly visible product is concrete rather than abstract: digital motor insurance sold as
              liability and casco bundles through local country websites, partner pages, and a self-service mobile app.
              The customer workflow is straightforward. A driver gets a quote, selects a coverage package, stores policy
              documents digitally, manages payment status, edits some personal or vehicle data, and can initiate claims
              or cancellation flows without needing a branch network. Product pages in the Netherlands and Hungary show
              that the offer is still tightly centered on personal motor insurance, not on a broad multi-line menu.


              Under the surface, the likely module set is broader than the front-end suggests. Public materials point to
              a pricing engine, digital quote and purchase layer, policy-administration interface, payment handling,
              claims intake, and partner-carrier coordination. The app stores show that Ominimo sees policy documents,
              payment tracking, and claims initiation as first-class product features, not merely support tools. That
              product packaging matters because it suggests Ominimo is building a lightweight insurance operating layer
              around carrier paper, rather than only a marketing brand. The visible module map is therefore enough to
              show real product depth, even though the engineering internals remain mostly private.
