            body: >-
              Leadership is still highly founder-centric. TechCrunch's April 2025 profile names Dusan Komar, Dennis
              Weinbender, and Laslo Horvath as the founding trio, with Komar acting as the dominant public spokesperson
              in both the Zurich-backed Series A and EBRD-backed Series B coverage. Beinsure later adds Kristina Kozina
              as a co-founder, which means the public founder list is not perfectly consistent across sources and should
              be treated carefully in diligence. That inconsistency matters less to the commercial thesis than the
              clearer pattern that the company's most visible leadership still sits close to pricing, software, and
              execution rather than to legacy insurance hierarchy.


              The most useful official leadership source is Ominimo's Poland profile page. It introduces Luka Bucan as
              Group COO and Poland CEO, then profiles insurance specialists, claims operators, business analysts, and
              senior data scientists with backgrounds spanning McKinsey, Allianz, private equity, and radar or
              machine-learning engineering. This is important because the company's talent pitch is not generic 'AI'
              marketing. Public sources repeatedly say two-thirds of employees work in data science or software
              development, the team includes eight Mathematics Olympiad medallists, and the company wants to keep
              recruiting top-tier technical staff. Those signals support the view that Ominimo is trying to build a real
              underwriting and automation engine, but they also reinforce key-person and talent-concentration risk
              because much of that capability still appears to rest on a relatively small bench.
