      - number: '8.2'
        title: Valuation context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The best public valuation context comes from looking both up and down the market-cap ladder. Lemonade, at
              about $4.76B market cap in late July 2026, has millions of customers, over $1.3B in-force premium, public
              earnings materials, and multi-line product breadth. Root, at roughly $944M market cap, discloses revenue,
              profit, cash, and multiple ratios as a listed motor insurer. Ominimo sits between them on headline value
              at $1.6B, but with far less disclosure than either public comp. That does not make the mark irrational,
              but it does mean the burden of proof is unusually high.


              Private comparables tell a second story. wefox shows how quickly a European insurance platform narrative
              can deteriorate when capital structure and operating reality diverge, while Akur8 shows that software-like
              insurance infrastructure can attract large funding rounds without taking underwriting risk itself. Ominimo
              is neither of those precisely. It is more operationally exposed than Akur8 and, so far, seemingly more
              disciplined than late-cycle wefox. That leaves the company in a narrow valuation lane: attractive enough
              operationally to justify attention, but still stretched enough that execution mistakes could reset the
              mark sharply. The valuation debate is therefore about quality of growth, not simple existence of growth.
              That distinction should keep investors humble about headline comparables.
