  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Ominimo's most strategic risk is that its current capital-light structure also defines its regulatory
              ceiling. Today the company can scale as an MGA-like, carrier-backed distributor and operator. That lowers
              capital needs and speeds up market entry, but it also means the company remains dependent on
              insurance-distribution rules, partner paper, and local claims or servicing arrangements. The announced
              desire to obtain its own license improves the upside, yet also introduces a second-order risk: once
              Ominimo takes on more underwriting economics itself, it will also need more capital, governance, and
              regulatory discipline.


              The legal framework is not abstract. The IDD governs how insurance is distributed, while EIOPA and the AI
              Act raise the bar for any insurer or MGA using automated decisions for pricing and risk. Ominimo's own
              Swedish GDPR page confirms that the company uses profiling and automated decision-making in quoting and
              risk assessment, which means model governance is not a theoretical issue. The company discloses privacy
              controls and legal bases, but the public record still lacks the kind of audit-ready evidence an investor
              would want before assuming that controls scale as quickly as premium volume. That gap becomes more
              important, not less, if the company pushes toward its own license.
