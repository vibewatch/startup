      - number: '2.2'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              In Ominimo's current product design the buyer, user, and payer are usually the same retail driver, which
              simplifies the customer workflow relative to B2B insurance software but does not eliminate intermediary
              influence. The company's own channels exist, yet The Recursive says only around one in five policies are
              sold directly on Ominimo's own site. That makes comparison engines, brokers, and other distribution
              partners central to discovery and conversion. Trust and claims handling matter heavily in such a
              commoditized category: the consumer is not buying an abstract algorithm, but a promise that a legally
              required product will be cheap, valid, and responsive when a claim occurs.


              This is why partner structure matters so much in the adoption path. Ominimo provides the pricing layer,
              the digital journey, and the underwriting selection logic, but carrier partners and local regulatory
              recognition still carry much of the trust burden. Ominimo's Dutch and Swedish pages explicitly use
              Zurich/DA Direkt as that trust anchor. The purchase path therefore looks less like a classic software
              land-and-expand motion and more like a regulated consumer funnel: discovery through price-sensitive search
              behavior, reassurance through carrier credibility and regulatory recognition, then retention only if
              claims and renewals work cleanly.
