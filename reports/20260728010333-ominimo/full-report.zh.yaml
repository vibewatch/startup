chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Ominimo 的公开记录已经显示出一种组合：外表是创业公司品牌，底层却是更像规模化 MGA 的承保伙伴运营模式。荷兰和瑞典产品页中，Ominimo
              把自己包装成面向好司机的更便宜、更公平的数字车险公司，明确承诺比传统玩家给出更低保费、更快理赔处理和更灵活的保障选择。同一批页面也说明，公司在多数市场还不是用自有资产负债表承保的保险公司：Zurich
              Insurance Group 旗下 DA Direkt 被反复点名，是产品背后的承保伙伴；匈牙利材料则把最初上线与 Signal Iduna 连接起来。


              市场足迹已经不再是单一国家试验。2026 年 7 月的公开报道和 Ominimo 自己的本地市场页面支持这样的路径：2024
              年先在匈牙利上线，随后进入波兰、荷兰和瑞典。产品页也显示，供给仍紧紧围绕车险：强制责任险、有限或部分 casco，以及全 casco 版本，不同本地市场包装有所差异。消费者流程也高度数字化。移动 App
              列表和客服页面称，投保人可通过 App 或客户门户访问保单文件、支付状态、车辆信息、退保请求和理赔发起。聚焦的产品范围、重自动化、由承保伙伴承担风险，这三者合在一起，就是目前对 Ominimo
              运营身份最清晰的描述。
