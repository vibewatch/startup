      - number: '6.2'
        title: 具名客户证明与满意度代理
        blocks:
          - type: paragraph
            body: >-
              Ominimo 是消费者保险公司，所以最好的具名客户证明不是 logo 案例，而是来自已验证或半验证评价平台。在荷兰，Trustpilot 提供最丰富的公开证据：超过一千条评价、4.3
              分，以及大量称赞价格、轻松切换和服务有帮助的评论。这有意义，因为它超出了企业 testimonial
              页面。同时，同一个荷兰评价页也有严厉批评，指向理赔处理、跟进不足和客服不一致。净结果是一组真实但混合的客户证明，而不是一边倒的好评。


              瑞典更早。瑞典 Trustpilot 页面只有五条评价和 3.8
              分，样本太小，不能说有代表性，但仍可作为方向性证据。这些评价包括对在线购买简单、有竞争力的价格，甚至鹿撞事故后理赔顺利的称赞。公司也公开回复评价，包括负面评价，不过 Trustpilot
              称它通常在一个多月后才回复。合在一起，公开客户证明显示 Ominimo 的确在解决价格和便利性问题；但支持和理赔一致性会决定早期好感能否转化为持久续保行为。
