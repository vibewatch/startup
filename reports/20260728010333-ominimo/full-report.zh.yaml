      - number: '7.2'
        title: 运营、理赔与服务风险
        blocks:
          - type: paragraph
            body: >-
              面向客户的运营风险已经在公开来源中可见。荷兰 Trustpilot 评价包括严厉指控：支持可能很慢或没有帮助，理赔结果可能令人非常失望。瑞典看起来更好，但样本很小，而且 Trustpilot 称 Ominimo
              往往一个多月后才回复负面评价。产品品类在这里很重要：车险是法律要求、切换成本低，且出险时情绪负荷很高。因此，明显薄弱的理赔或支持体验，会比许多软件业务更快伤害信任。


              还有一个更安静的技术风险。Ominimo 展示了强数字工作流和锋利的承保叙事，但除了通用 GDPR
              语言之外，几乎没有公开安全架构、欺诈控制、正常运行时间或事故响应纪律的细节。这个缺口不能证明控制失效，但意味着投资者实际被要求在没有审计级技术证据的情况下相信运营故事。对一家如此年轻、增长如此快的公司来说，这是实质性剩余风险，而不是文档瑕疵。若控制失败有一天公开，声誉损害很可能跑得比管理层解释更快。缺少量化网络安全或欺诈证据，使这个风险顽固地保持开放。
