  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Ominimo 公开可见的产品很具体，而不是抽象概念：通过各国本地网站、伙伴页面和自助移动 App 销售的数字车险，产品打包为责任险和 casco
              车损险。客户流程很直接。司机获取报价，选择保障包，数字化保存保单文件，管理支付状态，编辑部分个人或车辆数据，并可发起理赔或退保流程，不需要依赖线下网点。荷兰和匈牙利产品页显示，供给仍紧紧围绕个人车险，而不是宽泛的多险种菜单。


              表层之下，可能的模块集合比前端看起来更宽。公开材料指向定价引擎、数字报价和购买层、保单管理界面、支付处理、理赔受理，以及与承保伙伴的协同。应用商店显示，Ominimo
              把保单文件、支付跟踪和理赔发起视作一等产品功能，而不只是支持工具。这个产品包装很重要，因为它说明 Ominimo
              正在围绕承保资质搭建一层轻量保险运营层，而不仅是营销品牌。可见模块地图已经足以显示真实产品深度，尽管工程内部仍大多私有。
