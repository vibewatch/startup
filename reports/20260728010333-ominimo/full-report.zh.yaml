      - number: '4.2'
        title: 单位经济性、定价与成本结构线索
        blocks:
          - type: paragraph
            body: >-
              最好的公开单位经济性证据是间接的。The Recursive 给出的 92% 至 100% 综合成本率区间，以及 Life Insurance International
              提到的赔付率低于全国平均，都暗示增长并非明显靠鲁莽承保买来。官方产品页通过强调给好司机公平保费来强化定价叙事；荷兰和瑞典页面也强调避开昂贵旧技术、大办公室和重营销开支之后的低成本结构。这些信号符合一个精瘦承保和分销引擎的论点，但仍只是代理指标，不是披露过的单位经济性桥。


              渠道组合是这座桥的关键部分。如果只有约五分之一保单是直接销售，那么伙伴主导的分销很可能降低品牌建设成本，同时也会分走一部分经济性。这意味着模型的财务吸引力不仅取决于理赔表现，也取决于佣金、服务成本和续保在不同国家如何表现。公开来源没有披露这些细节。因此，Ominimo
              看起来比纯粹不计代价增长的 insurtech 财务上更可信，但仍不如上市保险公司或成熟私人保险公司透明。
