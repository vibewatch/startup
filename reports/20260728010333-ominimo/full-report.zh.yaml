      - number: '7.3'
        title: 依赖、财务模型与人员风险
        blocks:
          - type: paragraph
            body: >-
              Ominimo
              的第三组风险是结构性依赖。承保伙伴影响承保资质和信任，渠道影响保费量，一个相对小的技术团队看起来又影响核心承保优势。公开来源显示，只有约五分之一保单是直接销售，这意味着伙伴集中不是理论下行。如果渠道或承保方经济性变化，Ominimo
              可能发现保费增长快于留存利润。同时，许多能帮助投资者判断这一风险的核心财务指标——烧钱、runway、留存收入、准备金负担和伙伴抽成比例——仍未披露。


              人员风险会放大模型风险。公开创始人叙事仍高度集中在 Dusan Komar
              和一支小而技术精英化的团队上。这在早期执行中可以是优势，但也意味着大规模运营韧性仍有很多未被证明。总体风险视角因此是高，不是因为需求看起来弱，而是因为控制、集中度和资本转型问题只回答了一部分，而估值已经假设大量未来成功。投资者实际上同时承销执行和组织制度建设。这种双重负担提高了一个小控制疏漏变成战略性昂贵问题的概率。
