      - number: '1.2'
        title: 创始人、领导层与技术人才
        blocks:
          - type: paragraph
            body: >-
              领导层仍高度围绕创始人运转。TechCrunch 2025 年 4 月的报道将 Dusan Komar、Dennis Weinbender 和 Laslo Horvath 列为创始三人组；无论是 Zurich
              支持的 Series A，还是 EBRD 支持的 Series B，Komar 都是最主要的公开发言人。Beinsure 后来又把 Kristina Kozina
              加为联合创始人，这意味着公开创始人名单在不同来源之间并不完全一致，尽调时需要谨慎处理。这个不一致对商业论点的影响，小于另一个更清晰的模式：公司最可见的领导层仍更贴近定价、软件和执行，而不是传统保险层级。


              最有用的官方领导层来源，是 Ominimo 的波兰简介页。该页介绍 Luka Bucan 担任集团 COO 和波兰 CEO，并列出保险专家、理赔运营人员、商业分析师和资深数据科学家，他们的背景横跨
              McKinsey、Allianz、私募股权，以及雷达或机器学习工程。这个信号重要，因为公司的招聘叙事不是泛泛的「AI」营销。公开来源反复提到，三分之二员工从事数据科学或软件开发，团队里有八名数学奥林匹克奖牌获得者，公司还希望继续招聘顶级技术人才。这些信号支持一种判断：Ominimo
              正在试图搭出真正的承保和自动化引擎；但也强化了关键人和人才集中风险，因为大量能力看起来仍压在一个相对小的团队上。
