      - number: '1.3'
        title: 融资、牵引力与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              Ominimo 的融资路径和运营指标解释了它为何这么快进入独角兽区间。2025 年 4 月的来源称，公司获得 Zurich 参与的首轮外部融资，估值约 €200M；2026 年 7 月的报道则把 EBRD 领投的
              Series B 放在约 €1.4B 或 $1.6B 估值。这意味着大约十五个月内估值上调约七倍。公开报道还显示，Series B
              被包装成加速资本，而不是求生资本：公司称自己已经盈利，想拿到自有保险牌照，并计划增加更多市场和更多产品。


              对这样一家早期保险公司而言，牵引力数字异常强，但仍应视为公司口径指标，而不是独立审计披露。EU-Startups 和 Beinsure 引述的年化 GWP 运行率，从 2024 年约 €26.3M 增至 2025
              年 €157.8M，并在 2026 年年中达到约 €307M。Beinsure 还补充，四个已上线市场合计客户接近一百万。The Recursive 给出更丰富的承保背景，称综合成本率保持在 92% 至 100%
              之间，且只有约五分之一保单通过 Ominimo 自有网站直接售出，其余通过伙伴渠道分销。高速增长、早期盈利主张和仍有限的治理披露混在一起，就是 Ominimo
              概览中的核心尽调张力：运营故事很亮眼，但关于董事会结构、完整投资方细节和集团内确切法律实体架构，公开证据仍然偏薄。
