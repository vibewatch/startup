      - number: '5.3'
        title: 信任、合规与路线图
        blocks:
          - type: paragraph
            body: >-
              信任和合规在公开材料中可见，但主要通过披露体现，而不是深层技术证据。瑞典 GDPR 页面对一家消费者保险网站来说异常详细：它列出 Ominimo
              处理的个人数据类别、画像和自动化决策的作用、处理数据的法律依据，以及一组技术和组织控制，例如限制访问、加密、日志记录和员工培训。App Store 列表给出一个有意思的对照：它称 App
              本身不收集数据，这很可能意味着 Ominimo 把 App 当作通往更广泛保险系统的受控界面，而不是独立的数据采集产品。


              路线图在高层面也相当清晰。2026 年 7 月报道称，Ominimo 计划继续投资 AI
              和技术，进入新市场，增加新产品线，并拿到自有牌照以留下更多承保经济性。不清楚的是，随着产品扩张，公司打算如何治理模型风险、偏差测试或安全架构。因此，公开产品技术判断需要平衡：Ominimo
              已拿出足够证据证明它有真实的数字保险平台，技术故事值得认真对待；但公开工程深度还不足以在没有管理层访问的情况下把整个 stack 尽调到位。缺失的工程透明度，已经成为主要产品尽调阻断点。
