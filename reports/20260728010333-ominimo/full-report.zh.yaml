      - number: '8.2'
        title: 估值背景与可比集合
        blocks:
          - type: paragraph
            body: >-
              最好的公开估值背景，来自同时往市值阶梯的上下两端看。Lemonade 在 2026 年 7 月下旬市值约 $4.76B，拥有数百万客户、超过 $1.3B 有效保费、公开业绩材料和多险种产品宽度。Root 市值约
              $944M，是上市车险公司，披露收入、利润、现金和多重比率。Ominimo 头部估值为 $1.6B，位于两者之间，但披露远少于任何一个上市可比。这并不说明该估值不理性，但意味着证明负担异常高。


              私人可比讲的是第二个故事。wefox 显示，当资本结构和运营现实分叉时，欧洲保险平台叙事可以多快恶化；Akur8 则显示，不自担承保风险的类软件保险基础设施也能吸引大额融资。Ominimo 都不是完全同类。它比
              Akur8 承担更多运营暴露；到目前为止，似乎又比后周期 wefox
              更有纪律。这把公司放在一条很窄的估值通道里：运营上足够有吸引力，值得关注；但估值也足够拉伸，执行错误可能大幅重置标记。因此，估值争论关乎增长质量，而不是增长是否存在。这个区分应让投资者在看头部可比时保持谦逊。
