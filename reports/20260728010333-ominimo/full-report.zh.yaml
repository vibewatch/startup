      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              在 Ominimo 当前产品设计里，买方、用户和付款方通常都是同一个零售车主，这让客户流程比 B2B 保险软件更简单，但并没有消除中介影响。公司有自有渠道，但 The Recursive 称只有约五分之一保单在
              Ominimo
              自有网站直接售出。因此，比价引擎、经纪人和其他分销伙伴会主导发现和转化。在这样一个高度商品化的品类里，信任和理赔处理分量很重：消费者买的不是抽象算法，而是一个承诺——法律要求的产品要便宜、有效，出险时还要有响应。


              这也是伙伴结构在采用路径中如此关键的原因。Ominimo 提供定价层、数字旅程和承保筛选逻辑，但承保伙伴和本地监管认可仍承担大部分信任负担。Ominimo 的荷兰和瑞典页面明确把 Zurich/DA Direkt
              用作这个信任锚。因此购买路径不像经典软件的 land-and-expand，更像受监管的消费者漏斗：先通过价格敏感的搜索行为发现，再用承保方信誉和监管认可打消疑虑，最后只有在理赔和续保顺畅时才留存。
