companyProfile:
  summary: >-
    Ominimo 是一家成立于 2024 年的塞尔维亚-匈牙利私人 insurtech，通过轻资本 MGA 模式销售车险，背后有 Signal Iduna、Zurich/DA Direkt
    等承保伙伴。公司把颗粒度定价、数字化服务和伙伴分销拼在一起，向匈牙利、波兰、荷兰和瑞典扩张，并在 EBRD 领投的 Series B 后于 2026 年 7 月达到 $1.6B
    估值。公开证据支持它在保费和客户增长上异常快，也给出可信的承保纪律信号；但留存经济性、cohort 耐久性和治理结构仍只披露了一部分。
