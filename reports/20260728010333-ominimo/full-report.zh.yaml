      - number: '3.2'
        title: 能力、定价与分销对比
        blocks:
          - type: paragraph
            body: >-
              Ominimo 最好的竞争证据不是广泛品牌认知，而是这样一个主张：用比传统对手更多变量和更紧承保逻辑，为好司机给出更好的价格。TechCrunch 和 The Recursive
              都暗示，公司差异化更多来自风险引擎，而不仅是表层产品设计。这有意义，但不是唯一赢法。Lemonade 靠直达消费者品牌规模和多产品交叉销售竞争。Root 和 Zego
              说明，车联网和驾驶行为数据也能切出更细的车险分层。Tractable 证明，一部分价值可以下沉到理赔基础设施，而不是留在保单分销里。


              分销同样是双刃剑。The Recursive 称，Ominimo
              只有约五分之一保单来自直接销售，因此公司能借渠道杠杆放大，不必立刻砸出一个巨大的消费者品牌。但这也意味着渠道、承保方和理赔表现仍是护城河问题的一部分。在低切换成本产品里，更好的价格或更可信的理赔体验，都可能很快把量带到别处。
