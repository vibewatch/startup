  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与可比对象
        blocks:
          - type: paragraph
            body: >-
              Ominimo 位于一个拥挤但并非完全重叠的格局中。最接近的参照组，是面向零售车主、用算法定价并拥有强线上旅程的数字车险公司或 MGA。因此，Lemonade、Root 和 Zego 比 Tractable
              这类理赔 AI 供应商更接近日常购买体验。wefox 也是一个重要的相邻警示案例，因为它曾把平台、MGA 和分销野心融合在一起，后来又进行重组。


              品类拆分很关键。Lemonade 以更宽的多险种消费者品牌和公开市场规模竞争。Root 以车险承保和上市公司运营数据竞争。Zego 说明，车联网和工作 / 私用驾驶灵活性也可能重要。Tractable
              攻击价值链的另一个环节，为保险公司和维修网络自动化理赔流程。因此，Ominimo
              既不是纯软件供应商，也不是经典传统保险公司。它是由承保伙伴支持的车险数字承保与分销层，这带来资本效率优势，也限制了更广泛保险公司可以建立的某些全栈护城河。
