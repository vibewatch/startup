  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              对一家这么年轻的公司来说，Ominimo 的公开论点异常有吸引力。它已经展示了一个可信组合：保费规模、承保纪律信号，以及通过承保伙伴实现的轻资本扩张。很少有 2024
              年成立的创业公司，能在两年内拿出近一百万客户、约 €307M 的 GWP 运行率和独角兽估值。如果这种增长确实建立在差异化定价引擎和有纪律的分销模型之上，Ominimo 有真实机会成为欧洲个人险
              insurtech 中最突出的故事之一。


              反论点同样清楚。估值已经假设了比公开记录更多的证明。投资者能看到 GWP 和客户数，却看不到留存收入、续保 cohort、利润率结构或 cap table
              细节。因此，当前最诚实的建议既不是坚定买入，也不是回避，而是继续研究：故事强到不能忽视，但太不透明，不能按表面值承销。这个判断的信心应保持中等；在更深尽调补上最大证据缺口之前，风险评级应维持高，估值立场应维持偏紧。换句话说，公开案例值得好奇，不值得无条件放行，更不值得估值自满。这正是本章在当前不确定性下想保住的纪律。
