      - number: '8.3'
        title: 情景框架、否决触发器与尽调要求
        blocks:
          - type: paragraph
            body: >-
              牛市情景要求 Ominimo
              继续守住综合成本率纪律，证明伙伴支持的增长可以转化为留存经济性，并在进入更大市场时不破坏客户信任或监管准备度。基准情景假设强增长继续，但在投资者拿到更好的收入质量、续保和治理证据之前，估值上行保持受限。熊市情景不是客户消失，而是理赔、牌照、伙伴或控制问题先暴露，在公司证明今天的保费规模确实高质量之前就造成压力。


              这套逻辑自然把决策过程推向明确的否决触发器和尽调要求。承保质量、理赔口碑、伙伴耐久性或牌照准备度一旦出现可见恶化，就应迅速转向更严厉立场，因为当前估值几乎不给运营失误留下空间。反过来，如果管理层提供留存收入桥、cohort
              留存、伙伴经济性，以及与已投入资本规模相匹配的治理图景，建议可能显著改善。在此之前，耐心是投资纪律的一部分，不是缺乏信念。拒绝围绕缺失输入猜测，是这里的保守做法，也正是区分有纪律估值工作和追逐动量的地方。
