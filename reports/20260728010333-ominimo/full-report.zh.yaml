      - number: '6.3'
        title: 留存、集中度与扩张风险
        blocks:
          - type: paragraph
            body: >-
              最大的客户尽调缺口是耐久性。公开资料没有按国家披露流失、续保、合同期限、GRR 或
              NRR。因此无法知道客户基础只是获客时对价格有反应，还是长期真的有黏性。车险客户可在续保时重新比价，比价网站又降低切换摩擦，因此理赔执行和服务质量通常比品牌故事更重要。公开评价已经给出提示：正面反馈常常庆祝便宜保费或快速支持互动，负面反馈通常攻击理赔解决、客服联系不上或答复不一致。


              集中度是第二个大缺口。如果只有约五分之一保单是直接销售，那么很大一部分客户很可能来自相对少数的经纪人、affiliate
              或比价伙伴。公开材料没有披露这个渠道组合有多集中，也没有说明接近一百万客户中，有多少真正活跃、当前有效并可续保。因此，客户判断需要保留层次。Ominimo
              明显有真实需求和真实生产用户，但公开证据在采用上远强于留存质量或集中度韧性。
