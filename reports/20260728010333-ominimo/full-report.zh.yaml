  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Ominimo 最战略性的风险，是当前轻资本结构也定义了它的监管天花板。今天，公司可以作为类似 MGA
              的、由承保伙伴支持的分销商和运营商扩张。这降低资本需求、加快市场进入，但也意味着公司仍依赖保险分销规则、伙伴承保资质，以及本地理赔或服务安排。公司宣布想拿自有牌照，会提高上行；但也引入第二层风险：一旦
              Ominimo 自己承担更多承保经济性，也需要更多资本、治理和监管纪律。


              法律框架并不抽象。IDD 约束保险如何分销，EIOPA 和 AI Act 又抬高了任何使用自动化决策定价和评估风险的保险公司或 MGA 的门槛。Ominimo 自己的瑞典 GDPR
              页面确认，公司在报价和风险评估中使用画像和自动化决策，这意味着模型治理不是理论问题。公司披露了隐私控制和法律依据，但公开记录仍缺少投资者在假设控制能力能像保费规模一样快速扩张之前想要的审计级证据。如果公司推进自有牌照，这个缺口只会更重要，不会更轻。
