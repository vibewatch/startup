      - number: '4.3'
        title: 资本充足、牌照与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              Ominimo 的资本强度故事之所以有吸引力，恰恰因为它并不完整。MGA 结构让承保伙伴提供资产负债表，Ominimo
              则专注定价、分销和服务。与全栈保险公司相比，这降低了当下资本需求。但管理层也想拿到自有保险牌照，公开来源明确把 Series B 部分资金用途和这一目标联系起来。财务上行很明显：Ominimo
              可以留下更多承保经济性。下行同样明显：资本要求、准备金需求和监管负担都会明显上升。


              因此，公司在财务上有意思，但仍需要重尽调。公开资料没有披露账上现金、烧钱、 runway、准备金负担、债务，或每张保单的确切留存经济性。公开 cap table 细节也不够，无法理解 Zurich 持股和
              EBRD 支持的 Series B 之后的稀释或优先权包袱。因此，财务判断必须保持纪律。Ominimo 的增长和承保纪律信号强于许多早期 insurtech
              故事，但公开透明度太低，尚不足以把收入质量、资本充足性或利润率耐久性完全纳入投资判断。


              实操上，下一笔尽调投入应该用来把保费吞吐量转成可审计的留存经济性模型，而不是孤立争论头部估值。对这家公司而言，这座桥是从令人兴奋的增长故事走向可完整支撑财务投资判断的缺失一步。没有它，保费规模仍可能掩盖弱利润转化。
