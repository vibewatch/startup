      - number: '3.3'
        title: 护城河耐久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Ominimo 的护城河论点真实存在，但仍是暂定的。最强的正面论据，是定价 /
              数据科学能力、轻资本承保伙伴关系，以及不断增长的多国分销执行力混在一起。只要亏损表现守得住，这个组合就可能很有力量。最强的反面论据，是车险仍然价格敏感、依赖续保，客户锁定低于企业软件，而且通往同一个终端客户有许多替代路径。渠道主导的
              MGA 可以很快扩张；但如果承保方关系变弱，或比价引擎把分销商品化，它也可能被复制或挤压。


              wefox
              对比在这里有用，因为它提醒投资者，增长和融资并不保证承保经济性可持续。今天的公开证据根本不够丰富，无法解决所有竞争问题。没有可靠的同口径价格研究，没有共享的流失基准，也没有经过验证的跨同行赔付率表，能把
              Ominimo 与 Lemonade、Root、Zego 或任何欧洲大型传统保险公司清晰堆叠比较。当前更合适的结论是：Ominimo 具备可信的承保和资本效率护城河，但还没有证明自己拥有长周期 franchise
              护城河。


              护城河类型的区分会影响投资时点。可信的护城河可以支持继续研究和选择性乐观，但不能支撑一个假设：Ominimo
              已经拥有成熟保险公司或规模化上市数字保险公司那样持久的客户关系或续保经济性。公司证明承保优势能穿越更大、更激烈竞争的市场之前，竞争故事应被视为有前景，但仍高度依赖实证。


              实际含义很简单：只有当公开或尽调共享数据开始显示留存、续保定价和赔付率在扩张后仍然强劲时，竞争信心才应该上调。
