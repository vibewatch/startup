      - number: '5.2'
        title: 运营架构、工作流与依赖
        blocks:
          - type: paragraph
            body: >-
              最强的公开技术信号，是 Ominimo 声称更好的承保来自比传统保险公司更细颗粒度的数据和更现代的运营栈。荷兰页面称 Ominimo 依赖数百个数据点；TechCrunch 和 The Recursive
              也提出同样论点，并且说法更强，称其定价引擎使用非显而易见变量和类似 XGBoost 的方法来生成个性化费率。The Recursive
              更进一步，称其有云原生、自建的微服务环境，进入新市场主要靠修改本地化配置，而不是从头重建整套系统。如果属实，这在传统保险公司仍被变化速度困住的品类里，是有意义的技术优势。


              但架构与伙伴依赖不可分割。Signal Iduna 页面称 Ominimo 缔结并管理保单，而承保公司提供实际保障；Zurich/DA Direkt 在其他市场承担类似角色。这意味着 Ominimo
              的真实产品，是自有定价、数字工作流和伙伴支持风险容量的组合。工作流是现代的，但并未完全垂直整合。它仍部分受制于承保方关系、本地理赔流程，以及 Ominimo 代码和伙伴基础设施之间的系统边界。
