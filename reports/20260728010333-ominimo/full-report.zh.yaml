  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              如果把市场说成整个欧洲保险，甚至整个 insurtech，Ominimo 很容易被夸大。公开产品证据指向一个窄得多、也更有用的边界：通过 MGA 或承保伙伴结构分销的数字个人车险。Ominimo
              荷兰页面宣传责任险、有限 casco 和全险保障。Signal Iduna 的匈牙利材料和 InsurTech List
              也指向同样以车险为中心的范围。这意味着人寿、健康、中小企业商业险和多数特殊险种，应被视为相邻机会，而不是当前可服务池的一部分。


              因此，合适的规模测算口径应分层看。Howden Re 给出最宽的背景：欧洲 MGA 生态在 2024 年有 650 多个玩家，GWP 约 €18B，并把 Benelux 和北欧列为相关区域集群，正好对应
              Ominimo 已进入或瞄准的地方。但这些数字是渠道层面的，不是公司特定需求池。更紧的实盘口径，是在以下市场里的个人车险客户子集：数字化购买行为、伙伴承保模式和比价驱动获客能够同时成立。公开来源没有披露
              Ominimo 的精确 TAM、SAM 或 SOM，所以更可辩护的做法，是保持定性堆栈，并明确写出缺失的分母。
