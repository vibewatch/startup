    title: 公司快照逻辑
    type: flow
    layout: wide
    summary: 当前模式把塞尔维亚的数据与工程人才、保险公司支持的承保、全渠道分销，以及未来牌照可选性串在一起。
    data:
      nodes:
        - id: talent
          label: 数据科学与软件人才
          detail: 三分之二员工从事技术岗位；奥赛奖牌得主也是招聘故事的一部分。
          tone: positive
        - id: pricing
          label: 自研定价引擎
          detail: 公司用数百个数据点和 XGBoost 式建模，更精准地识别低风险驾驶者。
          tone: positive
        - id: carriers
          label: 保险公司伙伴
          detail: 当前市场由 Signal Iduna 和 DA Direkt/Zurich 承担承保风险。
