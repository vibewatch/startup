  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              公开证据把 Ominimo 描述得更像一台快速放大的保费引擎，而不是一家财务损益透明披露的保险公司。公司和媒体报道一贯强调年化 GWP、客户数和上线市场保单量，而不是留存收入、毛利率或经审计的法定财务。对私人
              MGA 来说，这并不意外，但会改变投资者能负责任得出的结论。GWP 是需求和承保活动的有用证明，却不等同于扣除承保伙伴经济性和服务义务后由 Ominimo 留下的收入。


              即便如此，轨迹强到足以影响判断。EU-Startups 和 Beinsure 指向的 GWP 运行率，从 2024 年约 €26.3M 增至 2025 年 €157.8M，并在 2026 年年中达到约
              €307M。四个已上线市场近一百万客户，让这种增长看起来是运营上真实存在，而不只是叙事。问题在于，公开来源仍没有把这条吞吐量曲线接到规范化损益表上。因此，正确框架不是 Ominimo
              已经证明软件式经济性，而是它在这么年轻的公司中，已经证明异常强的保险业务顶线活动。
