  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与采用触点
        blocks:
          - type: paragraph
            body: >-
              公开客户证据在顶线最强。Beinsure 称 Ominimo 在四个已上线市场服务近一百万客户；TechCrunch 称，仅匈牙利上线后的前十二个月就卖出超过 300,000 张保单。这两个数据点足以证明
              Ominimo 已远超概念验证规模，但还不足以说明活动如何分布在各国家、渠道或续保 cohort
              中。因此，正确分层应是地理和渠道，而不是行业垂直或企业软件式：匈牙利是最初验证场，波兰、荷兰和瑞典是扩张市场，公开证据强弱不同。


              App 和门户足迹也解释了采用触点。Apple 和 Google 都称，App 已在匈牙利和波兰上线，保单文件、支付状态、资料变更、退保请求和理赔发起都内置进产品。The Recursive
              补充说，只有约五分之一保单在 Ominimo
              自有网站直接购买，这意味着多数客户获取仍流经伙伴和比价路径。这并不削弱采用本身，但意味着客户基础部分由中介导入，而不是纯品牌驱动。它也意味着，长期看续保质量和理赔体验会比虚荣顶层漏斗流量数字更重要。
