      - number: '2.3'
        title: 增长驱动、监管摩擦与市场约束
        blocks:
          - type: paragraph
            body: >-
              Ominimo 的乐观市场论点建立在几个真实顺风上。传统车险公司仍被粗糙定价模型、老旧技术和缓慢变革管理拖住。好司机若一直付得太贵，这个产品主张就很直观；Pro Global 和 Howden 也都描述了更广泛的
              MGA 转向：用数据更丰富、资本更轻的平台来做承保。欧洲还通过牌照通行和承保伙伴模式提供结构性杠杆，成本可能低于在每个国家搭建全栈保险公司。


              约束同样真实。Insurance Distribution Directive 仍约束分销商，EIOPA 和 AI Act 又对基于 AI 的保险用例提出更明确的控制要求。DA Strategy 和
              MarshBerry 都认为，即使牌照通行在纸面上存在，本地执行仍然关键。容量依赖、治理纪律、数据质量和理赔可见度，是区分可规模化 MGA 和脆弱 MGA 的硬约束。落到
              Ominimo，这意味着公司在匈牙利和相邻较小市场的强劲早期牵引力，还不足以证明模型能顺滑迁移到西欧最大市场或美国。公开证据足以支持市场潜力，但还不足以把尽调压缩成一个简单 TAM 数字。
