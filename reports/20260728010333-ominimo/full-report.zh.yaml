figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Ominimo 用约两年从 2024 年创立走到 $1.6B 估值；两轮融资之间，市场上线和合作伙伴里程碑填补了关键空白。
    data:
      items:
        - date: '2024'
          label: 成立
          detail: 创始团队开始打造 AI 优先的车险 MGA，目标是更好地切分风险。
          tone: positive
        - date: '2024'
          label: 匈牙利上线
          detail: 第一个市场上线，背后有 Signal Iduna 关联的承保支持。
          tone: positive
        - date: 2025-04
          label: Zurich 参与的 Series A
          detail: 以约 €200M 估值引入战略资本和分销伙伴关系。
          tone: positive
        - date: 2025-Q2
          label: 波兰上线
          detail: DA Direkt 支持的零售车险上线，跨境扩张开始。
          tone: positive
        - date: 2025-Q3
          label: 瑞典和荷兰扩张
          detail: 模式延伸到另外两个保险公司伙伴市场。
          tone: positive
        - date: 2026-06
          label: 单日销售纪录
          detail: The Recursive 称 Ominimo 在 24 小时内卖出超过 $1M 的保单。
          tone: positive
        - date: '2026-07-27'
          label: Series B / 独角兽
          detail: EBRD 支持的融资轮给 Ominimo 约 $1.6B 估值，也造就塞尔维亚首个科技独角兽。
          tone: positive
        - date: 2027 target
          label: 美国上线计划
          detail: 管理层称，公司在若干新增欧盟市场之后，正准备进入美国。
          tone: neutral
    approximationNotes: 公开来源只披露上线顺序、没有精确日期时，时间线使用季度标记。
    claimRefs:
      - CO009
      - CO015
      - CO017
      - CO021
      - CO033
      - CO034
