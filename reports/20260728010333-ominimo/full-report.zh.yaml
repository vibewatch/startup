      - CU028
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 公开证据对漏斗顶部和中部的支撑强于续保阶段的耐久性。
    data:
      nodes:
        - id: discover
          label: 通过直销和合作伙伴渠道发现
          detail: 比价网站、联盟渠道、经纪人和直接搜索带来认知。
          tone: neutral
        - id: bind
          label: 已出单客户
          detail: 公开证据确认，公司已有大量有效出单保单和客户。
          tone: positive
        - id: service
          label: 数字化服务
          detail: 购买后，应用和门户流程支持文件、支付和理赔发起。
          tone: positive
        - id: renew
          label: 续保质量
          detail: 流失和续保仍未披露，所以续保质量是公开证据最弱的一点。
          tone: warning
      edges:
        - from: discover
          to: bind
        - from: bind
          to: service
        - from: service
          to: renew
    claimRefs:
      - CU001
      - CU005
      - CU020
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 公开客户证据在价格和便利性上最强，在理赔一致性上较弱，在留存可见度上最弱。
    data:
      columns:
        - 价格 / 价值证明
        - 服务证明
        - 理赔证明
        - 留存可见度
      rows:
        - label: 荷兰评论样本
          values:
            - 高
            - 中
            - 混合
            - 低
        - label: 瑞典评论样本
          values:
            - 中
            - 中
            - 中
            - 低
        - label: 应用 / 门户证据
          values:
            - 低
            - 高
            - 低
            - 低
    claimRefs:
      - CU009
      - CU011
      - CU013
      - CU014
      - CU023
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高的剩余风险集中在牌照、合作伙伴依赖，以及面向客户的理赔 / 服务失效。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 中影响
          values:
            - 诉讼可见度缺口
            - 理赔通胀压力
            - 渠道集中
        - label: 高影响
          values:
            - 安全控制不透明
            - 自有牌照转型
            - 承保方 / 出单载体依赖
        - label: 严重影响
          values:
            - none
            - 规模化后的理赔 / 服务失效
            - 增长中的控制失效
    claimRefs:
      - CR003
      - CR010
      - CR014
      - CR022
      - CR027
      - CR038
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 产品既受监管、切换成本又低，监管或服务失效会很快传导到信任、留存、增长和估值。
    data:
      nodes:
        - id: reg
          label: 监管 / 牌照延误
        - id: claims
          label: 理赔 / 支持失效
        - id: trust
          label: 客户信任下滑
        - id: retention
          label: 续保 / 留存受冲击
        - id: growth
          label: 增长质量恶化
        - id: valuation
          label: 估值压缩
      edges:
        - from: reg
          to: growth
        - from: claims
          to: trust
        - from: trust
          to: retention
        - from: retention
          to: growth
        - from: growth
          to: valuation
        - from: reg
          to: valuation
    claimRefs:
      - CR010
      - CR027
      - CR028
      - CR031
      - CR032
      - CR038
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 当前模式更依赖承保方、渠道、监管方和小型技术核心，而不是自有资产负债表基础设施。
    data:
      nodes:
        - id: carriers
          label: 承保合作伙伴
        - id: channels
          label: 经纪人 / 比价网站
        - id: customers
          label: 客户
        - id: team
          label: 定价与运营团队
        - id: regulators
          label: 监管方
        - id: economics
          label: 留存经济收益
      edges:
        - from: team
          to: carriers
        - from: carriers
          to: customers
        - from: channels
          to: customers
        - from: regulators
          to: carriers
        - from: carriers
          to: economics
        - from: channels
          to: economics
    claimRefs:
      - CR015
      - CR016
      - CR018
      - CR021
      - CR030
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议逻辑从强增长证据走向估值谨慎，因为披露质量仍不完整。
    data:
      nodes:
        - id: growth
          label: 强增长证明
          detail: 近 1M 客户、约 €307M GWP 运行率，以及快速多市场扩张。
          tone: positive
        - id: discipline
          label: 承保纪律信号
          detail: 综合成本率和首发市场理赔信号都不错。
          tone: positive
        - id: opacity
          label: 信息披露不透明
          detail: 留存收入、续约、治理和股权结构仍未公开。
          tone: warning
        - id: valuation
          label: 估值 $1.6B
          detail: 当前估值几乎不给明显的质量落差留空间。
          tone: warning
        - id: reco
          label: 继续研究
          detail: 故事强到不能忽视，但信息太不透明，不能照单下投资判断。
          tone: neutral
      edges:
        - from: growth
          to: discipline
        - from: discipline
          to: valuation
        - from: opacity
          to: valuation
        - from: valuation
          to: reco
    claimRefs:
      - CV001
      - CV003
      - CV015
      - CV022
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 少数未解变量比任何单一头条指标更能左右这场估值争论。
    data:
      items:
        - label: 留存收入质量
          value: 10
          detail: 撑住当前估值最关键、也最缺的一项输入。
          tone: warning
        - label: 续约 / 留存证据
          value: 9
          detail: 客户数能否沉淀成特许经营价值，关键靠这项证明。
          tone: warning
        - label: 合作伙伴经济性韧性
          value: 8
          detail: 决定 GWP 有多少能沉淀成利润空间。
          tone: warning
        - label: 牌照落地
          value: 7
          detail: 这是上行杠杆，也可能抬高资本风险。
          tone: neutral
        - label: 市场扩张证据
          value: 7
          detail: 要证明模式能跑出早期市场，就需要这项证据。
          tone: neutral
    claimRefs:
      - CV016
      - CV017
      - CV020
      - CV028
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据只能支撑较宽的估值信心区间，撑不起精确的公允价值估算。
    data:
      items:
        - label: 悲观信心区间
          low: 0.9
          mid: 1.1
          high: 1.3
          displayValue: ~$0.9B–$1.3B
          detail: 如果增长质量走弱或风险上升，Ominimo 的估值可能向更低的公开可比公司区间压缩。
          tone: negative
        - label: 基准信心区间
          low: 1.3
          mid: 1.6
          high: 1.8
          displayValue: ~$1.3B–$1.8B
          detail: 只有增长质量大致守住，当前估值才站得住。
          tone: neutral
        - label: 乐观信心区间
          low: 1.8
          mid: 2.2
          high: 2.8
          displayValue: ~$1.8B–$2.8B
          detail: 需要拿出更强证据，证明留存经济性、续约和扩张可持续性。
          tone: positive
    approximationNotes: 这些是分析用信心区间，不是市场可成交目标价；公开证据缺少支撑更精细估算的输入项。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV018
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 几个简洁指标说明，这个机会值得看，但还没到可以完整下投资判断的程度。
    data:
      items:
        - label: 当前估值
          value: $1.6B
          detail: 2026 年 7 月达到独角兽估值。
          tone: neutral
        - label: GWP 年化运行率
          value: ~€307M
          detail: 一家 2024 年成立的公司能跑出这样的吞吐规模，力度很强。
          tone: positive
        - label: 客户数量
          value: 1000000
          detail: 采用规模高，但可持续性仍不清楚。
          tone: positive
        - label: 直销占比
          value: ~20%
          detail: 伙伴 / 渠道依赖仍然不低。
          tone: warning
        - label: 估值判断
          value: Stretched
          detail: 增长是真实的，但披露还不完整。
          tone: warning
        - label: 建议
          value: Research-more
          detail: 先做私有数据尽调，再形成投资确信。
          tone: neutral
    claimRefs:
      - CV003
      - CV005
      - CV026
      - CV027
      - CV028
      - CV035
