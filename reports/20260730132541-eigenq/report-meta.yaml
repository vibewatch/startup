companyProfile:
  summary: EigenQ is a Texas-headquartered quantum-technology company whose near-term commercialization story is centered on hardware-rooted post-quantum security infrastructure rather than speculative compute-only demand. The company is using a pending SPAC merger with Silicon Valley Acquisition Corp. to fund commercialization, manufacturing scale-up, and global expansion at an announced roughly $3.0 billion pro forma enterprise value. Public evidence supports a credible policy tailwind and partner stack, but the company still looks private-undisclosed on revenue quality and customer density.
  foundedDate: null
