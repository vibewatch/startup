      role: Chairman / founder-level strategic leader
      background: Public materials present Thé as chairman and a founder-level leader tied to EigenQ's strategic direction, even though the full founding roster is not clearly disclosed in retained public sources.
      claimRefs: [CO017]
  foundingLocation: Austin, TX
  headquarters: Austin, TX
  productSummary: Hardware-rooted quantum-resilient trust infrastructure spanning QMA entropy modules, qTPM identity, qTEE trusted execution, PQC+ cryptography, and broader pillars in quantum security, communications, sensing, AI, and computing.
  customerFocus: Government, defense, critical infrastructure, and enterprise buyers that need long-lived data protection, trusted identity, and quantum-safe migration paths.
  businessModel: B2G and B2B commercialization through direct sales, OEM and server integration, and partner-led channel distribution with HPE, AMD, WNC, TD SYNNEX, and Intel-linked deployment motions.
  stage: SPAC (pre-close)
