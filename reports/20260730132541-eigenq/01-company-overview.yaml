company:
  name: EigenQ
chapter:
  number: 1
  title: Company Overview
  summary: EigenQ is a Texas-headquartered quantum technology company commercializing hardware-rooted post-quantum security infrastructure while using a pending SPAC merger with Silicon Valley Acquisition Corp. to finance scale-up. Public evidence supports a roughly $3 billion pro forma enterprise value and an increasingly visible OEM/channel ecosystem, but key operating metrics such as revenue, customer count, headcount, and historical financing remain undisclosed as of 2026-07-30.
sections:
- id: identity-stage-and-offer
  title: Identity, stage, and core offer
  body: EigenQ presents itself as an applied quantum technology company whose near-term commercialization is centered on post-quantum cybersecurity rather than speculative fault-tolerant computing. The company says its platform combines quantum-generated entropy, hardware-rooted identity and execution controls, and a post-quantum cryptographic software layer that can be integrated into existing infrastructure without a full redesign. The public-company story is now anchored by the June 17, 2026 announcement of a definitive business combination with Silicon Valley Acquisition Corp. That deal values EigenQ at approximately $3.0 billion enterprise value, references $215 million of cash in the SPAC trust before redemptions and expenses, and targets a Q4 2026 close subject to SEC effectiveness, shareholder approval, and exchange-listing conditions. In public positioning, EigenQ is not marketing a single box; it is marketing a trust infrastructure stack for government, defense, critical infrastructure,
    and enterprise environments that must adapt to NIST post-quantum standards and CNSA 2.0 migration pressure.
