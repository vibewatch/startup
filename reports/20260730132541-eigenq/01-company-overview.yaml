- id: capital-partners-and-disclosure-boundaries
  title: Capital, partner ecosystem, and disclosure boundaries
  body: 'The strongest public proof points around EigenQ are capital framing and ecosystem alignment, not operating metrics. On capital, the merger documents and related releases consistently cite approximately $3.0 billion of pro forma enterprise value and approximately $215 million in the SVAQ trust account before redemptions, while the business-combination agreement fixes a $2.93 billion equity consideration formula. On ecosystem alignment, EigenQ repeatedly ties commercialization to HPE, AMD, WNC, TD SYNNEX, and Intel-related deployment pathways, with WNC positioned around hardware manufacturing scale, HPE around server integration, TD SYNNEX around channel and public-sector distribution, and Intel/AMD around retrofit or deployment relevance for installed server estates. What is still missing is equally important: available sources do not disclose revenue, ARR, headcount, customer count, gross margin, retention, or a full pre-SPAC funding history. That keeps the company in a private-undisclosed
    disclosure profile despite the pending public transaction and means valuation judgments still rest much more on strategic narrative than on disclosed operating evidence.'
