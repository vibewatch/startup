- id: leadership-governance-and-functional-coverage
  title: Leadership, governance, and functional coverage
  body: Public leadership disclosure has improved as EigenQ has moved toward the merger, but it is still thinner than the disclosure package normally available from an already-public operating company. The company website identifies Dr. José R. Rosas-Bustos as CEO and Dr. Jesse Van Griensven Thé as chairman, while July 2026 merger-period communications added Mark Pecen as vice chairman and elevated Alexander Truskovsky into a newly created CISO role. The site also lists an interim/acting CFO, a chief growth officer, a chief product executive, and commercial leaders focused on revenue and partnerships, which collectively suggests a company investing in productization and go-to-market rather than remaining purely research-led. Even so, public materials do not yet provide a normal board-committee map, director independence analysis, audited governance controls, or a clearly reconciled cap table. For diligence, the leadership bench appears credible for commercialization, but governance maturity
    should be treated as work in progress until the registration statement and proxy materials fully detail oversight structures.
