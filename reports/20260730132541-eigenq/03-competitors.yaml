callouts:
  - calloutType: strength
    title: EigenQ is differentiated where hardware-rooted trust matters
    body: EigenQ’s strongest competitive position is in environments where buyers care about device identity, secure execution, entropy, and retrofit into trusted infrastructure rather than only inventorying cryptographic assets.
    claimRefs: [CP014, CP018, CP020, CP037]
  - calloutType: risk
    title: Migration-control vendors can capture budget before hardware decisions are made
    body: SandboxAQ, QuSecure, and ISARA can become the first control plane for PQC migration by owning discovery, posture, and remediation workflows before a buyer chooses hardware modules.
    claimRefs: [CP012, CP015, CP021, CP032]
  - calloutType: insight
    title: Incumbents amplify competitive pressure even when startup feature sets differ
    body: Because cloud, HSM, certificate, and systems-integration incumbents are already incorporating PQC, EigenQ is competing against bundled adoption paths as much as against startup peers.
    claimRefs: [CP004, CP029, CP030, CP038]
