company:
  name: EigenQ
chapter:
  number: 3
  title: Competitors
  summary: >-
    EigenQ competes in a fragmented post-quantum security landscape where pure-play vendors cluster into three main camps:
    cryptographic inventory and migration platforms, embedded PQC software and silicon providers, and hardware-rooted trust or HSM-style vendors.
    The largest near-term threat is not one identical startup but a combination of better-funded migration-platform vendors,
    semiconductor-oriented PQC IP suppliers, and incumbent infrastructure providers that can bundle quantum-safe capabilities into existing channels.
sections:
  - id: competitive-landscape-and-peer-classes
    title: Competitive landscape and peer classes
    body: >-
      EigenQ does not face a single clean peer set because the post-quantum market is still assembling around different buyer jobs.
      SandboxAQ and QuSecure compete primarily on cryptographic inventory, remediation, and migration orchestration for large enterprises and government.
      ISARA and evolutionQ are closer to crypto-agility and migration-enablement specialists, while PQShield, SEALSQ, and Crypto4A emphasize embedded,
      hardware, or silicon-rooted implementations. Industry summaries also show that large incumbents such as Thales, IBM, AWS, DigiCert, Entrust, and
      systems integrators are already embedding or advising on PQC, which means EigenQ competes both against focused startups and against bundled feature
      sets from much larger platforms. The practical buyer question is therefore not “which company does exactly the same thing?” but “who can get my infrastructure
      inventory, cryptographic controls, and trusted hardware migrated fastest with the least operational risk?” On that question, EigenQ’s closest rivalry is with
      vendors that combine hardware or infrastructure credibility with migration language, while the biggest strategic pressure comes from firms that already own security
      operations or procurement relationships.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP010, CP033, CP034]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-product-comparison
    title: Capability and product comparison
    body: >-
      The sharpest capability split is between migration-discovery vendors and hardware-rooted implementation vendors. SandboxAQ’s AQtive Guard, QuSecure’s QuProtect,
      and ISARA Advance center on discovery, inventory, posture analysis, and remediation across existing cryptographic estates. PQShield, SEALSQ, Crypto4A, and EigenQ
      instead compete more directly around software libraries, embedded implementations, hardware accelerators, secure elements, or device-rooted trust. That distinction
      matters because buyers may stage purchases: first inventory and roadmap the problem, then deploy hardware, firmware, certificate, or key-management upgrades later.
      EigenQ’s advantage is that it markets a full-stack hardware-rooted trust architecture tied to OEM integration and public-sector server modernization. Its disadvantage is
      that some rivals have simpler product stories: QuSecure sells a clear remediation platform, PQShield sells IP and accelerators for chip and firmware teams, and SEALSQ already
      operates as a public semiconductor-security company with a broader IoT identity stack. The capability battle is therefore less about who mentions NIST standards and more about
      which layer of the migration stack each vendor can credibly own.
    claimRefs: [CP011, CP012, CP013, CP014, CP015, CP016, CP017, CP018, CP019, CP020, CP035]
    tableRefs: [TP002]
    figureRefs: [FP002]
  - id: distribution-switching-costs-and-buyer-power
    title: Distribution, switching costs, and buyer power
    body: >-
      Distribution power is one of the biggest underappreciated competitive variables in this market. EigenQ is trying to reach buyers through HPE, WNC, TD SYNNEX,
      Intel, and AMD-linked ecosystem motions, which could be powerful if they convert into qualified platforms and repeat procurement channels. But competitors are also
      pursuing leveraged access: ISARA has federal distribution via Carahsoft, SandboxAQ highlights work with federal agencies and large enterprises, QuSecure emphasizes partner-led
      enterprise deployment, and PQShield targets semiconductor and government programmes where design-ins can scale across many devices. Switching costs are mixed. Discovery and
      inventory platforms can become sticky because they map certificates, keys, and cryptographic posture across large estates, while embedded or hardware-rooted solutions can become
      sticky once they are qualified into chips, boards, firmware, or public-sector server bundles. That means EigenQ’s opportunity is strongest when hardware-rooted trust becomes a design
      decision, not just a software feature request. Conversely, if customers stay in a software-first migration phase for longer than expected, platform vendors with lower-friction discovery
      and remediation workflows may capture the budget first.
    claimRefs: [CP021, CP022, CP023, CP024, CP025, CP026, CP027, CP028, CP036, CP037]
    tableRefs: [TP003]
    figureRefs: [FP003]
  - id: moat-durability-and-competitive-risk
    title: Moat durability, incumbents, and displacement risk
    body: >-
      EigenQ’s moat case rests on three ideas: hardware-rooted trust is more durable than software-only overlays, OEM and public-sector partnerships accelerate credibility,
      and regulatory migration pressure rewards vendors that can retrofit long-lived infrastructure. Those are real strengths, but none is unchallenged. PQShield, SEALSQ, Crypto4A,
      and QuintessenceLabs all argue some version of hardware or entropy-backed differentiation. SandboxAQ, QuSecure, ISARA, and system integrators may not need the same hardware story if
      they become the control plane for migration decisions and policy reporting. Meanwhile, major cloud, HSM, certificate, and network incumbents can absorb PQC into products customers already
      buy, reducing the urgency of selecting a standalone vendor. The deepest adverse evidence is therefore commoditization risk: as NIST standards mature, some layers of PQC may become expected
      table stakes, shifting value toward distribution, integration ease, and lifecycle management. EigenQ can still win if it proves that hardware-rooted trust materially improves procurement,
      assurance, and operational outcomes. But if those benefits are not demonstrated in customer deployments, better-capitalized or better-distributed rivals can compress differentiation quickly.
    claimRefs: [CP029, CP030, CP031, CP032, CP034, CP035, CP036, CP038]
    tableRefs: [TP004]
    figureRefs: []
