  claims:
    - {id: CP001, statement: 'The PQC competitive landscape in 2026 includes pure-play startups, incumbent infrastructure vendors, and large systems integrators rather than a single homogeneous peer group.', type: third-party-reported, topic: landscape, sourceRefs: [SP016, SP017, SP019], confidence: medium, freshness: current, answersQuestionRefs: [QP001, QP022]}
    - {id: CP002, statement: 'SandboxAQ, QuSecure, and ISARA are publicly positioned more around cryptographic inventory, posture, or remediation than around OEM hardware roots of trust.', type: third-party-reported, topic: peer-classes, sourceRefs: [SP002, SP008, SP011], confidence: medium, freshness: current, answersQuestionRefs: [QP002]}
    - {id: CP003, statement: 'PQShield, SEALSQ, and Crypto4A are cited as hardware-oriented or silicon-oriented PQC competitors in independent industry coverage.', type: third-party-reported, topic: peer-classes, sourceRefs: [SP016, SP017], confidence: medium, freshness: current, answersQuestionRefs: [QP003]}
    - {id: CP004, statement: 'Independent landscape coverage also identifies Thales, AWS, IBM, Entrust, Cisco, and systems integrators as material competitive alternatives in PQC adoption.', type: third-party-reported, topic: incumbents, sourceRefs: [SP016, SP019, SP021], confidence: high, freshness: current, answersQuestionRefs: [QP004, QP018]}
    - {id: CP005, statement: 'SandboxAQ positions AQtive Guard around universal cryptographic inventory, risk context, and migration planning tied to federal and enterprise compliance pressure.', type: company-claimed, topic: sandboxaq, sourceRefs: [SP002, SP003], confidence: high, freshness: current, answersQuestionRefs: [QP005]}
    - {id: CP006, statement: 'PQShield publicly markets both software libraries and hardware accelerators for embedded or chip-level post-quantum deployments.', type: company-claimed, topic: pqshield, sourceRefs: [SP004, SP005], confidence: high, freshness: current, answersQuestionRefs: [QP006]}
    - {id: CP007, statement: 'QuSecure positions QuProtect as a production-ready platform for discovery, remediation, and reporting across cryptographic estates.', type: company-claimed, topic: qusecure, sourceRefs: [SP007, SP008], confidence: high, freshness: current, answersQuestionRefs: [QP007]}
    - {id: CP008, statement: 'ISARA positions itself around cryptographic inventory, posture management, certificate discovery, and hybrid migration support.', type: company-claimed, topic: isara, sourceRefs: [SP010, SP011], confidence: high, freshness: current, answersQuestionRefs: [QP008]}
    - {id: CP009, statement: 'SEALSQ positions itself as a secure-semiconductor and PKI platform spanning secure elements, provisioning, root of trust, and post-quantum security.', type: company-claimed, topic: sealsq, sourceRefs: [SP012, SP014], confidence: high, freshness: current, answersQuestionRefs: [QP009]}
    - {id: CP010, statement: 'evolutionQ emphasizes cryptographic resilience, roadmap services, and hybrid migration rather than a narrowly defined hardware product story.', type: company-claimed, topic: evolutionq, sourceRefs: [SP015, SP016], confidence: medium, freshness: current, answersQuestionRefs: [QP010]}
    - {id: CP011, statement: 'Independent coverage describes SandboxAQ as funded at more than $1.4 billion, making it visibly better funded than EigenQ’s publicly disclosed standalone operating metrics.', type: third-party-reported, topic: scale, sourceRefs: [SP016, SP017], confidence: medium, freshness: recent, answersQuestionRefs: [QP011]}
    - {id: CP012, statement: 'SEALSQ’s public-company materials provide operational disclosure that private competitors, including EigenQ, generally do not provide on their websites.', type: third-party-reported, topic: scale, sourceRefs: [SP013, SP012], confidence: medium, freshness: current, answersQuestionRefs: [QP012]}
    - {id: CP013, statement: 'ISARA’s federal distribution via Carahsoft is cited in independent coverage as an advantage for public-sector procurement access.', type: third-party-reported, topic: distribution, sourceRefs: [SP016], confidence: medium, freshness: recent, answersQuestionRefs: [QP013]}
    - {id: CP014, statement: 'EigenQ’s clearest differentiation versus inventory-first vendors is its hardware-rooted trust positioning tied to entropy, identity, trusted execution, and OEM integration.', type: inferred, topic: differentiation, sourceRefs: [SP022, SP023, SP024], confidence: high, freshness: current, answersQuestionRefs: [QP014]}
    - {id: CP015, statement: 'EigenQ appears weaker than discovery-first platforms where the buyer prioritizes enterprise-wide cryptographic inventory and remediation before selecting trust hardware.', type: inferred, topic: weakness, sourceRefs: [SP002, SP008, SP011, SP022], confidence: medium, freshness: current, answersQuestionRefs: [QP015]}
    - {id: CP016, statement: 'Channel and partner leverage matter because multiple rivals emphasize distributors, federal resellers, or semiconductor design-ins rather than direct greenfield sales alone.', type: inferred, topic: distribution, sourceRefs: [SP003, SP009, SP016, SP025], confidence: medium, freshness: current, answersQuestionRefs: [QP016]}
    - {id: CP017, statement: 'Discovery and posture platforms can become sticky because they map and monitor certificates, keys, and cryptographic assets across large estates.', type: third-party-reported, topic: switching-costs, sourceRefs: [SP002, SP008, SP011], confidence: medium, freshness: current, answersQuestionRefs: [QP017]}
    - {id: CP018, statement: 'Embedded or hardware-rooted solutions can become sticky once they are qualified into chips, boards, firmware, or server-platform bundles.', type: inferred, topic: switching-costs, sourceRefs: [SP005, SP012, SP022, SP024], confidence: medium, freshness: current, answersQuestionRefs: [QP017]}
    - {id: CP019, statement: 'PQShield markets high-performance hardware accelerators and embedded libraries that reduce EigenQ’s uniqueness on “hardware plus PQC” alone.', type: company-claimed, topic: hardware-rivals, sourceRefs: [SP004, SP005], confidence: high, freshness: current, answersQuestionRefs: [QP019]}
    - {id: CP020, statement: 'SEALSQ’s secure microcontrollers, root-of-trust stack, and PKI services create another hardware-rooted alternative to EigenQ for device and infrastructure trust use cases.', type: company-claimed, topic: hardware-rivals, sourceRefs: [SP012, SP014], confidence: high, freshness: current, answersQuestionRefs: [QP019]}
    - {id: CP021, statement: 'QuSecure and SandboxAQ both present simpler software-first migration narratives than EigenQ’s broader hardware-rooted platform story.', type: inferred, topic: software-rivals, sourceRefs: [SP002, SP007, SP008, SP022], confidence: medium, freshness: current, answersQuestionRefs: [QP020]}
    - {id: CP022, statement: 'No reviewed competitor website provides clean list pricing for enterprise PQC platforms or hardware, leaving packaging more visible than realized pricing.', type: observed, topic: pricing, sourceRefs: [SP001, SP004, SP007, SP010, SP012], confidence: high, freshness: current, answersQuestionRefs: [QP021]}
    - {id: CP023, statement: 'QuSecure packages its offer as recon, remediation, and reporting modules rather than publicly posting simple per-seat or per-asset pricing.', type: observed, topic: pricing, sourceRefs: [SP007, SP008], confidence: high, freshness: current}
    - {id: CP024, statement: 'ISARA packages its offer as inventory, crypto-agility, posture management, SDKs, and services rather than publishing list prices.', type: observed, topic: pricing, sourceRefs: [SP010, SP011], confidence: high, freshness: current}
    - {id: CP025, statement: 'EigenQ’s publicly visible commercial packaging is still channel- and OEM-oriented rather than exposed as transparent public pricing.', type: observed, topic: pricing, sourceRefs: [SP022, SP023, SP024, SP025], confidence: high, freshness: current}
    - {id: CP026, statement: 'SEALSQ’s packaging spans chips, trust services, PKI, and provisioning, implying volume- and design-win-based economics rather than easily comparable software pricing.', type: inferred, topic: pricing, sourceRefs: [SP012, SP013], confidence: medium, freshness: current}
    - {id: CP027, statement: 'One moat risk for EigenQ is that hardware-rooted trust is claimed by multiple rivals, including PQShield, SEALSQ, and Crypto4A-style vendors.', type: third-party-reported, topic: moat-risk, sourceRefs: [SP016, SP017, SP012], confidence: medium, freshness: current, answersQuestionRefs: [QP025]}
    - {id: CP028, statement: 'Another moat risk is that migration-control vendors can become the system of record before infrastructure buyers choose a hardware module vendor.', type: inferred, topic: moat-risk, sourceRefs: [SP002, SP008, SP011, SP022], confidence: medium, freshness: current, answersQuestionRefs: [QP025]}
    - {id: CP029, statement: 'Independent coverage describes large cloud, certificate, HSM, and networking vendors as already embedding PQC into broader platforms, increasing bundled-competition risk.', type: third-party-reported, topic: incumbent-risk, sourceRefs: [SP016, SP021], confidence: high, freshness: current, answersQuestionRefs: [QP018]}
    - {id: CP030, statement: 'Systems integrators and consultancies are emerging as important PQC coordinators for complex multi-vendor migrations.', type: third-party-reported, topic: incumbent-risk, sourceRefs: [SP016, SP017], confidence: medium, freshness: current, answersQuestionRefs: [QP018]}
    - {id: CP031, statement: 'As NIST standards mature, some layers of PQC are likely to commoditize and shift value toward distribution, integration, and lifecycle control.', type: inferred, topic: commoditization, sourceRefs: [SP006, SP017, SP021], confidence: medium, freshness: current, answersQuestionRefs: [QP025]}
    - {id: CP032, statement: 'If customers remain in inventory and roadmap phases longer than expected, EigenQ could lose early budget capture to discovery-first vendors.', type: inferred, topic: budget-capture, sourceRefs: [SP008, SP011, SP021, SP022], confidence: medium, freshness: current}
    - {id: CP033, statement: 'The most relevant competitive axes for EigenQ are hardware intensity and migration-control influence, not simply whether a vendor claims to be “quantum-safe.”', type: inferred, topic: positioning-map, sourceRefs: [SP016, SP017, SP022], confidence: medium, freshness: current}
    - {id: CP034, statement: 'EigenQ’s public positioning clusters closer to hardware-heavy vendors than to pure inventory-control platforms.', type: inferred, topic: positioning-map, sourceRefs: [SP022, SP024, SP025, SP017], confidence: medium, freshness: current}
    - {id: CP035, statement: 'The competitor field divides structurally between control-plane vendors and embedded or physical trust vendors.', type: inferred, topic: capability-map, sourceRefs: [SP004, SP008, SP011, SP012, SP015], confidence: medium, freshness: current}
    - {id: CP036, statement: 'Distribution and workflow ownership are at least as important as raw algorithm support in competitive durability for PQC vendors.', type: inferred, topic: durability, sourceRefs: [SP003, SP016, SP021, SP025], confidence: medium, freshness: current}
    - {id: CP037, statement: 'EigenQ is best positioned when post-quantum migration is treated as a trusted-infrastructure design choice rather than a software-policy problem alone.', type: inferred, topic: eigenq-strength, sourceRefs: [SP022, SP024, SP025], confidence: high, freshness: current, answersQuestionRefs: [QP014]}
    - {id: CP038, statement: 'Bundled incumbents and integrators are the deepest long-term displacement risk because they can turn PQC into a feature within products customers already buy.', type: inferred, topic: displacement-risk, sourceRefs: [SP016, SP019, SP021], confidence: high, freshness: current}
  evidenceGaps:
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Public customer concentration, deployment counts, and revenue mix for private peers such as EigenQ, QuSecure, PQShield, and ISARA.
      whyItMatters: Without customer and revenue disclosure, it is hard to distinguish real commercial scale from narrative strength.
      diligencePath: Request customer-count, top-account concentration, and production deployment metrics during diligence.
      relatedQuestionRefs: [QP023]
    - type: missing-source
      severity: material
      topic: contract-durability
      missingEvidence: Public contract length, renewal, NRR, and lock-in evidence across the main competitors.
      whyItMatters: Competitive durability depends on whether platforms or hardware become truly sticky after initial adoption.
      diligencePath: Ask management and channel partners for average contract term, renewal, and replacement friction by product type.
      relatedQuestionRefs: [QP024]
    - type: missing-source
      severity: minor
      topic: pricing
      missingEvidence: Like-for-like pricing benchmarks across hardware-rooted modules, embedded IP, and migration platforms.
      whyItMatters: Pricing opacity makes it difficult to compare product strength with commercial efficiency.
      diligencePath: Collect reseller quotes, OEM pricing, and enterprise RFP benchmark data.
    - type: missing-source
      severity: minor
      topic: TP003
      missingEvidence: Realized pricing, discounting, and consumption model details for the vendors in the pricing table.
      whyItMatters: Public packaging labels do not show how much buyers actually pay or how margins differ by channel.
      diligencePath: Validate through channel checks, procurement records, or disclosed contract summaries.
      relatedTableRefs: [TP003]
