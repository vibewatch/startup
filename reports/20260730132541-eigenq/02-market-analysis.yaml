  claims:
    - {id: CM001, statement: 'The commercially relevant market around EigenQ is post-quantum cryptography migration for digital infrastructure rather than the entire quantum-technology economy.', type: inferred, topic: market-boundary, sourceRefs: [SM018, SM019, SM021], confidence: high, freshness: current, answersQuestionRefs: [QM001]}
    - {id: CM002, statement: 'Most reviewed market sources define the PQC market as some combination of software, hardware, and services that implement or support quantum-resistant cryptography.', type: third-party-reported, topic: market-boundary, sourceRefs: [SM008, SM009, SM011], confidence: medium, freshness: current, answersQuestionRefs: [QM002]}
    - {id: CM003, statement: 'CISA now organizes PQC-capable technologies into acquisition categories, indicating that federal buyers treat PQC as a procurement problem rather than only a research topic.', type: third-party-reported, topic: procurement, sourceRefs: [SM001, SM015], confidence: high, freshness: current, answersQuestionRefs: [QM004, QM021]}
    - {id: CM004, statement: 'NCCoE frames PQC adoption as an interoperability and migration exercise designed to ease replacement of quantum-vulnerable public-key infrastructure.', type: third-party-reported, topic: migration-path, sourceRefs: [SM004, SM007], confidence: high, freshness: current, answersQuestionRefs: [QM014, QM018]}
    - {id: CM005, statement: 'Axis Intelligence estimates the PQC market at roughly $2.2 billion to $2.8 billion in 2026 after placing 2025 around $1.3 billion to $1.6 billion.', type: third-party-reported, topic: market-size, sourceRefs: [SM008], confidence: medium, freshness: recent, answersQuestionRefs: [QM005]}
    - {id: CM006, statement: 'The Business Research Company places the PQC market at $0.78 billion in 2026 and $2.23 billion by 2030.', type: third-party-reported, topic: market-size, sourceRefs: [SM009], confidence: medium, freshness: recent, answersQuestionRefs: [QM006]}
    - {id: CM007, statement: '360ResearchReports places the PQC market at about $1.106 billion in 2026 and more than $18 billion by 2035.', type: third-party-reported, topic: market-size, sourceRefs: [SM010], confidence: low, freshness: recent, answersQuestionRefs: [QM007]}
    - {id: CM008, statement: 'Business Research Insights places the PQC market at about $0.68 billion in 2026 and $1.47 billion by 2035.', type: third-party-reported, topic: market-size, sourceRefs: [SM011], confidence: low, freshness: recent, answersQuestionRefs: [QM008]}
    - {id: CM009, statement: 'The wide spread across published 2026 market estimates shows that the PQC category still lacks a settled commercial denominator.', type: inferred, topic: market-size, sourceRefs: [SM008, SM009, SM010, SM011], confidence: medium, freshness: current, answersQuestionRefs: [QM009]}
    - {id: CM010, statement: 'Estimate divergence is partly explained by whether publishers include hardware modules, services, and broader quantum-secure networking adjacencies.', type: inferred, topic: market-size, sourceRefs: [SM008, SM009, SM011], confidence: medium, freshness: current}
    - {id: CM011, statement: 'For diligence purposes, a range-based sizing view is more defensible than choosing one headline TAM from the reviewed market reports.', type: inferred, topic: market-size, sourceRefs: [SM008, SM009, SM010, SM011], confidence: medium, freshness: current, answersQuestionRefs: [QM009]}
    - {id: CM012, statement: 'North America appears as the leading current region across multiple reviewed PQC market summaries.', type: third-party-reported, topic: regional-demand, sourceRefs: [SM008, SM009, SM011], confidence: medium, freshness: current, answersQuestionRefs: [QM010, QM020]}
    - {id: CM013, statement: 'Government and defense, BFSI, healthcare, and IT or telecom recur across reviewed sources as primary verticals for PQC adoption.', type: third-party-reported, topic: verticals, sourceRefs: [SM009, SM011], confidence: medium, freshness: current, answersQuestionRefs: [QM011]}
    - {id: CM014, statement: 'EigenQ’s own public positioning aligns most closely with government, defense, critical infrastructure, and enterprise compute buyers rather than consumer or SMB segments.', type: inferred, topic: eigenq-market-fit, sourceRefs: [SM018, SM019, SM020, SM021], confidence: high, freshness: current, answersQuestionRefs: [QM012]}
    - {id: CM015, statement: 'In many PQC programs the user, buyer, and payer are different parties, often splitting between security engineers, platform teams, and executive or program-office budget owners.', type: inferred, topic: buyers, sourceRefs: [SM001, SM006, SM007, SM009], confidence: high, freshness: current, answersQuestionRefs: [QM013]}
    - {id: CM016, statement: 'Adoption usually follows a staged path of crypto inventory, standards selection, hybrid pilot, procurement qualification, and production rollout rather than an immediate swap.', type: inferred, topic: adoption-path, sourceRefs: [SM004, SM007, SM012], confidence: high, freshness: current, answersQuestionRefs: [QM014]}
    - {id: CM017, statement: 'The strongest near-term market driver is standards and policy momentum from NIST finalization, White House action, and federal procurement guidance.', type: third-party-reported, topic: drivers, sourceRefs: [SM001, SM003, SM005, SM017], confidence: high, freshness: current, answersQuestionRefs: [QM016]}
    - {id: CM018, statement: 'Harvest-now-decrypt-later risk pulls forward demand because buyers with long-lived secrets cannot wait for large-scale quantum computers to arrive before migrating.', type: third-party-reported, topic: drivers, sourceRefs: [SM011, SM012], confidence: medium, freshness: current, answersQuestionRefs: [QM017]}
    - {id: CM019, statement: 'Installed-base retrofit potential is a relevant buying wedge because many regulated organizations need migration paths that preserve existing infrastructure.', type: inferred, topic: drivers, sourceRefs: [SM019, SM022, SM023, SM024], confidence: medium, freshness: current, answersQuestionRefs: [QM015]}
    - {id: CM020, statement: 'High implementation cost and infrastructure complexity are major restraints on PQC adoption.', type: third-party-reported, topic: constraints, sourceRefs: [SM007, SM011, SM012], confidence: high, freshness: current, answersQuestionRefs: [QM018]}
    - {id: CM021, statement: 'Skills shortages and crypto-agility gaps make services and partner ecosystems important to actual deployment.', type: third-party-reported, topic: constraints, sourceRefs: [SM008, SM011], confidence: medium, freshness: current, answersQuestionRefs: [QM019]}
    - {id: CM022, statement: 'Because the market denominator is unstable, headline TAM alone is a weak justification for EigenQ’s announced valuation.', type: inferred, topic: valuation-link, sourceRefs: [SM008, SM009, SM010, SM011], confidence: medium, freshness: current}
    - {id: CM023, statement: 'Standards evolution is still incomplete because NIST migration work continues and additional schemes beyond FIPS 203-205 remain in progress.', type: third-party-reported, topic: constraints, sourceRefs: [SM004, SM017], confidence: high, freshness: current, answersQuestionRefs: [QM019]}
    - {id: CM024, statement: 'Multiple sources imply that non-regulated enterprise adoption will lag federal or high-assurance demand because complexity, cost, and competing priorities slow migration.', type: inferred, topic: timing, sourceRefs: [SM006, SM008, SM012], confidence: medium, freshness: current, answersQuestionRefs: [QM025]}
    - {id: CM025, statement: 'Cloudflare describes the transition as effectively two migrations and warns that certificate adoption still trails key-agreement migration, illustrating real operational friction.', type: third-party-reported, topic: constraints, sourceRefs: [SM012], confidence: medium, freshness: current, answersQuestionRefs: [QM018]}
    - {id: CM026, statement: 'GSA’s 2026 PQC summit and CISA buyer guidance both indicate that U.S. federal procurement attention has moved beyond abstract standards awareness.', type: third-party-reported, topic: procurement, sourceRefs: [SM001, SM016], confidence: high, freshness: current, answersQuestionRefs: [QM021]}
    - {id: CM027, statement: 'The White House order and Federal News Network coverage suggest that federal migration planning is moving on a deadline-driven basis rather than as an optional long-term research agenda.', type: third-party-reported, topic: drivers, sourceRefs: [SM005, SM006], confidence: high, freshness: recent, answersQuestionRefs: [QM016]}
    - {id: CM028, statement: 'CISA guidance instructs agencies to plan acquisitions around PQC-capable product categories in areas where standards are mature enough to procure against.', type: third-party-reported, topic: procurement, sourceRefs: [SM001, SM015], confidence: high, freshness: current}
    - {id: CM029, statement: 'Post-Quantum’s 2026 policy guides highlight dual-track civilian and national-security timing, reinforcing the idea that regulated buyers will not move uniformly.', type: third-party-reported, topic: drivers, sourceRefs: [SM013, SM014], confidence: medium, freshness: recent}
    - {id: CM030, statement: 'EigenQ’s usable market should exclude broad quantum computing, sensing, and AI budgets unless they directly fund security migration infrastructure.', type: inferred, topic: market-boundary, sourceRefs: [SM018, SM019, SM021], confidence: high, freshness: current, answersQuestionRefs: [QM003]}
    - {id: CM031, statement: 'Public evidence is insufficient to isolate a supportable EigenQ-specific SOM because the company has not disclosed pricing, pipeline, conversion rates, or buyer concentration.', type: third-party-reported, topic: sizing-gap, sourceRefs: [SM020, SM021, SM022], confidence: medium, freshness: current}
    - {id: CM032, statement: 'The Business Research Company explicitly includes solutions and services as the two main PQC categories in its market framing.', type: third-party-reported, topic: market-boundary, sourceRefs: [SM009], confidence: medium, freshness: current, answersQuestionRefs: [QM002]}
    - {id: CM033, statement: 'The Business Research Company identifies network security and application security as core use cases within PQC spending.', type: third-party-reported, topic: verticals, sourceRefs: [SM009], confidence: medium, freshness: current}
    - {id: CM034, statement: 'Business Research Insights highlights government standardization and mandates as the biggest market-expanding factor in its narrative framing.', type: third-party-reported, topic: drivers, sourceRefs: [SM011], confidence: medium, freshness: current}
    - {id: CM035, statement: '360ResearchReports attributes 27% of application share to civilian government and 11% to military in its modeled segmentation.', type: third-party-reported, topic: verticals, sourceRefs: [SM010], confidence: low, freshness: recent}
    - {id: CM036, statement: 'Axis argues that broad-market forecasts projecting nearly 48% CAGR usually include managed migration services and hardware security modules, not only algorithms and libraries.', type: third-party-reported, topic: market-size, sourceRefs: [SM008], confidence: medium, freshness: recent}
  evidenceGaps:
    - type: missing-source
      severity: material
      topic: eigenq-sam
      missingEvidence: A company-specific breakdown of what share of PQC spending maps to EigenQ’s hardware-rooted server and trust-infrastructure niche.
      whyItMatters: Broad PQC TAM overstates the commercially reachable slice for any single vendor, especially one focused on OEM-integrated infrastructure.
      diligencePath: Request management segmentation by use case, buyer type, and attach rate to installed platforms.
      relatedQuestionRefs: [QM022]
    - type: missing-source
      severity: material
      topic: eigenq-som
      missingEvidence: Pipeline, pricing, conversion-rate, and channel throughput data needed to estimate serviceable obtainable market.
      whyItMatters: Without SOM evidence, it is impossible to connect market growth directly to near-term revenue potential.
      diligencePath: Review investor presentation, forecast model, and channel funnel metrics once disclosed.
      relatedQuestionRefs: [QM023]
    - type: missing-source
      severity: material
      topic: hardware-pricing
      missingEvidence: Public pricing benchmarks for the hardware-rooted PQC modules and accelerators most relevant to EigenQ’s design-in approach.
      whyItMatters: Pricing shapes whether adoption is software-like, HSM-like, or capex-heavy.
      diligencePath: Collect OEM price lists, reseller quotes, and deployment cost examples from partner channels.
      relatedQuestionRefs: [QM024]
    - type: missing-source
      severity: minor
      topic: enterprise-timing
      missingEvidence: Segment-level data showing how quickly non-regulated enterprises convert pilots into production relative to federal or defense buyers.
      whyItMatters: This determines how much of the market is near-term versus purely long-dated.
      diligencePath: Seek deployment case studies and survey data broken out by regulated versus non-regulated sectors.
      relatedQuestionRefs: [QM025]
