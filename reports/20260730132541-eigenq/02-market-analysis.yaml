callouts:
  - calloutType: insight
    title: The market is large enough to be strategic but too immature for a single defensible TAM
    body: Analyst estimates vary by more than 3x at the 2026 starting point because definitions differ on whether to count hardware, services, and broad quantum-safe adjacencies. That makes range-based sizing more honest than one headline number.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM011]
  - calloutType: strength
    title: Regulated infrastructure is the most aligned wedge for EigenQ
    body: Government, defense, critical infrastructure, and server-platform retrofits line up with EigenQ’s public positioning around hardware-rooted trust, OEM integration, and long-lived systems.
    claimRefs: [CM014, CM019, CM026, CM030]
  - calloutType: risk
    title: Migration urgency does not eliminate integration friction
    body: The same forces that create demand—deadlines, long-lived secrets, and cryptographic replacement—also make deployments complex, slow, and partner-dependent.
    claimRefs: [CM020, CM021, CM023, CM025, CM027]
