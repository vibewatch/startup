company:
  name: EigenQ
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    EigenQ sits in the fast-growing but still loosely bounded post-quantum cryptography migration market,
    with the most relevant demand concentrated in regulated infrastructure rather than the whole quantum-computing economy.
    Public estimates agree on strong growth but diverge sharply on market size because some include hardware modules
    and migration services while others focus narrowly on software libraries and algorithm tooling.
sections:
  - id: market-boundary-and-adjacencies
    title: Market boundary and what counts for EigenQ
    body: >-
      The right market frame for EigenQ is not “all quantum technology” and not even the entire cybersecurity stack.
      The closest commercial boundary is post-quantum cryptography migration for regulated digital infrastructure:
      software and hardware that replace or augment RSA/ECC-era trust functions, plus integration and migration services
      needed to deploy them. Public market reports consistently include software, hardware security modules or accelerators,
      and consulting or deployment services, but they differ on whether to count adjacent quantum-secure networking,
      migration programs, and broader cryptographic hardware. For EigenQ specifically, the commercially relevant segment is
      narrower still: OEM-integrated, hardware-rooted and infrastructure-oriented PQC adoption in government, defense,
      critical infrastructure, and enterprise server environments. That means the status quo is not another quantum startup alone;
      it is incumbent HSM vendors, cloud security stacks, internal build programs, and organizations delaying migration because
      the replacement cycle is expensive and complex.
    claimRefs: [CM001, CM002, CM003, CM004, CM013, CM014, CM018, CM030, CM032]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: sizing-lenses-and-estimate-divergence
    title: Sizing lenses and estimate divergence
    body: >-
      Every public market source reviewed points in the same direction—rapid multi-year expansion—but none provides a single
      authoritative denominator. Axis Intelligence synthesizes a broad 2025 band of roughly $1.3 billion to $1.6 billion and a
      2026 band of roughly $2.2 billion to $2.8 billion when hardware, services, and migration programs are included.
      The Business Research Company publishes a narrower 2026 market value of $0.78 billion and a 2030 outlook of $2.23 billion,
      while 360ResearchReports and Business Research Insights publish still different 2026 and 2035 curves. The disagreement is
      informative rather than incidental: the market is young, definitions are fluid, and analyst perimeter choices materially
      change the headline number. For diligence, that means the most decision-useful conclusion is not one TAM figure but a range.
      EigenQ can credibly point to strong structural growth, but not to a settled consensus market size that automatically validates
      a $3 billion enterprise value.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM011, CM012, CM022, CM036]
    tableRefs: [TM002]
    figureRefs: [FM002]
  - id: buyers-budget-owners-and-adoption-path
    title: Buyers, budget owners, and adoption path
    body: >-
      The market evidence is most coherent when broken into buyer systems rather than industries alone. In regulated environments
      the user may be a security or cryptography team, the budget owner may be a CISO, CIO, platform-security leader, or federal
      program office, and the deployment path often runs through OEM, channel, or integrator ecosystems rather than a direct SaaS
      purchase. Government and defense buyers care about assurance horizons, procurement categories, and certification pathways;
      critical-infrastructure operators care about long asset lives and retrofit feasibility; financial, healthcare, and telecom
      buyers care about protecting long-lived records without destabilizing production traffic. EigenQ’s public messaging aligns
      best with high-assurance compute, secure identity, encrypted communications, and hardware-rooted server environments, which
      are buyer needs closer to infrastructure modernization than to discretionary security tooling. In practice, procurement friction
      also means platform partners often shape timing as much as end-customer urgency does. Adoption therefore tends to
      follow a staged workflow—inventory, assessment, pilot, hybrid deployment, qualification, and then scaled rollout—rather than
      a one-quarter software swap.
    claimRefs: [CM003, CM012, CM013, CM014, CM015, CM016, CM019, CM026, CM027, CM033, CM035]
    tableRefs: [TM003]
    figureRefs: [FM003]
  - id: drivers-constraints-and-go-to-market-timing
    title: Growth drivers, adoption constraints, and timing
    body: >-
      The strongest demand drivers are real and visible: NIST finalized the first PQC standards in August 2024, CISA now publishes
      buyer guidance for PQC-capable product categories, the White House and federal ecosystem have elevated the migration agenda,
      and CNSA 2.0 keeps national-security timelines in view. Those forces create unusually strong top-down pull for vendors that can
      offer practical migration paths. But the constraints are just as important. Cloudflare describes the transition as effectively two
      migrations, warns against “crypto procrastination,” and shows that certificate migration still lags key-agreement adoption.
      NIST’s migration work emphasizes interoperability and implementation complexity, while multiple market summaries cite skills shortages,
      performance overhead, and integration cost as core restraints. The result is a market with genuine urgency but slow enterprise plumbing.
      That favors vendors like EigenQ only if they can reduce migration friction through OEM integration and channel access; otherwise the same
      complexity that creates demand can also delay bookings and stretch pilots into multi-year programs.
    claimRefs: [CM004, CM017, CM018, CM020, CM021, CM023, CM024, CM025, CM027, CM028, CM029, CM031, CM034]
    tableRefs: [TM004]
    figureRefs: [FM004]
