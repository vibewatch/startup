callouts:
  - calloutType: strength
    title: BlackVe gives EigenQ one real named mission-oriented customer proof point
    body: BlackVe’s public statement anchors EigenQ’s customer story in a specific secure-communications and national-security context rather than a generic logo list.
    claimRefs: [CU010, CU011]
  - calloutType: risk
    title: Public customer breadth is far thinner than target-segment breadth
    body: EigenQ clearly targets government, defense, infrastructure, and enterprise buyers, but the reviewed public record does not show a corresponding breadth of named paying deployments.
    claimRefs: [CU001, CU002, CU017, CU033]
  - calloutType: recommendation
    title: Convert partner pathways into a customer concentration schedule
    body: The key diligence step is to map which named accounts, pilots, and qualified bundles are actually revenue-generating, renewing, and expanding.
    claimRefs: [CU020, CU028, CU034, CU036]
