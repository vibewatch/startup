  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-count-and-segment-mix
      missingEvidence: Current customer count, segment mix, and revenue contribution by federal, defense, infrastructure, and enterprise accounts.
      whyItMatters: Without segment mix, customer diversification and repeatability cannot be underwritten.
      diligencePath: Request current customer roster, ARR or revenue by segment, and top-10 account breakdown.
    - type: private-evidence-only
      severity: material
      topic: retention-and-renewal
      missingEvidence: NRR, GRR, churn, renewal terms, contract length, and support attach-rate data.
      whyItMatters: Durability is currently inferred rather than measured.
      diligencePath: Request customer cohort data, renewal schedules, and support-contract history.
    - type: private-evidence-only
      severity: material
      topic: deployment-scale
      missingEvidence: Number of live deployments, pilot-to-production conversion, shipment volumes, and qualified bundle take-up.
      whyItMatters: Current public signals show pathways and one named proof point but not broad scale.
      diligencePath: Request deployment tracker, shipped-unit history, and pilot conversion dashboard.
    - type: missing-source
      severity: material
      topic: independent-satisfaction-proof
      missingEvidence: Independent customer review data, reference calls, or procurement performance records.
      whyItMatters: Customer satisfaction and repeat-use quality are not observable from partner press alone.
      diligencePath: Collect customer references, marketplace reviews, and government performance evaluations.
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration-and-channel-dependence
      missingEvidence: Top-customer revenue concentration and the share of business sourced through each partner channel.
      whyItMatters: One or two programs may dominate both revenue and signaling value.
      diligencePath: Request top-account concentration schedule and partner-sourced pipeline conversion data.
