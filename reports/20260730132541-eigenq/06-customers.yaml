        - {label: 'AMD EPYC channel pathway', values: [3, 1, 2, 2, 1]}
        - {label: 'Government and critical-infrastructure target segment', values: [3, 0, 1, 1, 0]}
    claimRefs: [CU017, CU019, CU032, CU033]
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    summary: Illustrative durability scenarios show how account continuity might differ by customer-proof type given the lack of disclosed retention data.
    approximationNotes: These percentages are analyst heuristics for diligence only, not company-reported retention figures.
    data:
      columns: [year-1, year-2, year-3, year-5]
      rows:
        - {label: 'Named mission-critical deployment (illustrative)', values: [100, 90, 80, 70]}
        - {label: 'Qualified OEM/channel deployment (illustrative)', values: [95, 80, 65, 50]}
