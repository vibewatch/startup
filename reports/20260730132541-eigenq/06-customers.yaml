company:
  name: EigenQ
chapter:
  number: 6
  title: Customers
  summary: >-
    EigenQ’s public customer story is concentrated in a small set of target segments and a very thin layer of named proof. The clearest public signal is
    BlackVe’s stated plan to use EigenQ’s Intel-compatible PQC stack for secure video and national-security space applications, backed by broader partner
    routes into federal, defense, critical infrastructure, and enterprise server environments. What remains missing are customer counts, deployment volumes,
    retention metrics, and clear proof that partner pathways have matured into diversified production revenue.
sections:
  - id: customer-segments-and-buying-centers
    title: Customer segments and buying centers
    body: >-
      EigenQ’s public customer base is better described by target segment than by disclosed account list. Across transaction, website, and partner
      materials, the company repeatedly emphasizes government, defense, critical infrastructure, and high-assurance enterprise environments as initial
      commercialization targets. The practical buyers appear to be infrastructure security teams, federal or defense procurement organizations, OEM platform
      partners, and channel-led enterprise accounts modernizing Intel Xeon or AMD EPYC estates for post-quantum readiness. Users are likely security,
      platform, and operations teams that need attestation, cryptographic agility, key management, and workload protection, while payers may sit with
      government programs, prime contractors, infrastructure operators, or enterprise platform owners. This segmentation matters because it implies a small
      number of high-value, high-friction accounts rather than a broad self-serve customer base. It also means channel access and compliance pull are part
      of the customer story, not just supporting GTM details.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: public-adoption-and-named-proof
    title: Public adoption and named proof
    body: >-
      The strongest named customer proof in the reviewed public record is BlackVe. EigenQ’s Intel-oriented announcement and multiple third-party mirrors say
      BlackVe plans to use EigenQ’s Intel-compatible post-quantum technologies as a foundational security layer for secure video systems in national-security
      and space contexts. That is strategically important because it is more concrete than a generic logo or unnamed pilot: it links a named partner-customer
      to a use case, operating environment, and mission profile. Beyond BlackVe, public evidence becomes thinner. The WNC release says pilot quantities were
      shipping to select integrators and that HPE-qualified server bundles were expected, but those are pathway signals rather than named end-customer
      deployments. The AMD and TD SYNNEX materials likewise show a channel route to public-sector and enterprise environments without naming who has already
      bought or expanded. The conclusion is that real adoption signals exist, but the named-production proof set is still extremely narrow.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]
  - id: retention-and-durability-visibility
    title: Retention and durability visibility
    body: >-
      Retention is almost entirely inferred today. No reviewed source disclosed customer count, NRR, GRR, churn, renewal rates, contract length, or
      cohort behavior. The best continuity proxies are indirect: repeated messaging around government and critical-infrastructure urgency, partner ecosystems
      built around Intel, AMD, HPE, WNC, and TD SYNNEX, and the logic that hardware-rooted integrations can become sticky once they are qualified into
      deployed systems. But stickiness should not be confused with measured retention. Public partner releases also include caveats: approved-and-applicable
      channel pathways, technical-appropriateness qualifiers for already-deployed systems, and forward-looking framing that stops short of proving repeat
      purchase or customer satisfaction. For now, the durability case rests more on infrastructure embedding logic than on disclosed account behavior. That
      makes retention a thesis, not yet a measured fact.
    claimRefs: [CU020, CU021, CU022, CU023, CU024, CU025, CU026, CU027]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: expansion-concentration-and-procurement-friction
    title: Expansion, concentration, and procurement friction
    body: >-
      EigenQ’s upside and risk are tightly linked because the same channels that can unlock expansion can also create concentration. If Intel-, AMD-, HPE-,
      or WNC-linked pathways convert, each account can be strategically valuable and may expand across fleets, workloads, or program lines. BlackVe shows
      how one credible mission partner can support adjacent secure-communications or space applications. But concentration risk remains high because the
      public record does not show a diversified roster of named paying customers. Channel concentration matters too: TD SYNNEX and OEM partners may control
      procurement access, while federal and defense buyers add compliance, qualification, and contracting friction that can slow expansion even when need is
      urgent. Public sources also do not reveal whether the strongest references are pilots, funded deployments, or broad production programs. Investors
      should therefore treat partner-led expansion as plausible but unproven at scale.
    claimRefs: [CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035]
    tableRefs: [TU005]
  - id: customer-verdict
    title: Customer verdict
    body: >-
      EigenQ has enough public customer evidence to show that the market target is real and that at least one named mission-oriented user, BlackVe, is
      willing to be public about intended deployment direction. That is stronger than a pure concept-stage startup with no external usage reference. Yet the
      company still lacks the breadth of proof required to underwrite customer durability with confidence. There is no public customer-count bridge, no
      disclosed expansion ratios, no independent satisfaction data, and no clear list of production deployments across agencies, enterprises, or critical
      infrastructure operators. The customer story is therefore credible but concentrated: strong alignment with where PQC urgency is highest, meaningful
      ecosystem routes, and very limited direct account-level transparency. Diligence needs to convert channel narrative into account, deployment, renewal,
      and concentration data before customer quality can be scored as truly mature.
    claimRefs: [CU010, CU020, CU028, CU033, CU034, CU035, CU036]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: EigenQ’s public customer journey runs from regulatory pressure and infrastructure assessment to retrofit deployment and potential expansion.
    approximationNotes: The journey map is reconstructed from public partner and transaction materials, not a company-published GTM diagram.
    data:
      items:
        - {label: 'A federal, defense, critical-infrastructure, or enterprise buyer identifies post-quantum migration pressure in an existing infrastructure estate.'}
        - {label: 'The buyer evaluates retrofit options that can preserve operational continuity across Intel, AMD, or HPE-linked environments.'}
        - {label: 'EigenQ enters through OEM, manufacturing, or channel pathways rather than through a broad direct self-serve model.'}
        - {label: 'Initial proof arrives as pilot shipments, partner qualification, or a named mission-oriented use case such as BlackVe.'}
        - {label: 'Expansion depends on procurement approval, technical fit, and repeat deployments across more systems or programs.'}
        - {label: 'Public retention and satisfaction remain largely unmeasured, so the last mile of the journey is still a diligence gap.'}
    claimRefs: [CU001, CU004, CU010, CU014, CU021, CU031]
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    summary: Publicly visible adoption moves from target segments and partner channels into a small set of named or implied deployment proofs.
    approximationNotes: This flow abstracts the current customer proof set; it is not a company-reported funnel.
    data:
      nodes:
        - {id: a1, label: 'Target segments', detail: 'Government, defense, critical infrastructure, and high-assurance enterprise buyers.', claimRefs: [CU001, CU002, CU003]}
        - {id: a2, label: 'Partner route', detail: 'Intel, AMD, HPE, WNC, and TD SYNNEX shape access and deployment pathways.', claimRefs: [CU004, CU005, CU006, CU028]}
        - {id: a3, label: 'Initial deployment proof', detail: 'Pilot shipments, qualified bundles, and named mission-aligned use cases.', claimRefs: [CU012, CU013, CU014, CU015]}
        - {id: a4, label: 'Named public proof', detail: 'BlackVe is the clearest named user in the reviewed public record.', claimRefs: [CU010, CU011]}
        - {id: a5, label: 'Expansion unknowns', detail: 'Renewal, account expansion, and satisfaction are not publicly quantified.', claimRefs: [CU020, CU022, CU033]}
      edges:
        - {from: a1, to: a2, label: 'access via'}
        - {from: a2, to: a3, label: 'enables'}
        - {from: a3, to: a4, label: 'best proof'}
        - {from: a4, to: a5, label: 'still needs'}
