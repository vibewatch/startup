      - number: '5.4'
        title: 差异化与依赖结构
        blocks:
          - type: paragraph
            body: >-
              EigenQ 最清晰的差异化主张是，纯软件迁移不足以覆盖长寿命或高保障系统；公司认为买家需要可信熵、硬件根身份，以及位于密码转型底层的量子安全执行脚手架。联邦采购指南强调硬件和软件产品类别都需要采用
              PQC，NIST 标准工作也把买家最终必须实施的算法正式化，这些都强化了上述定位。因此，差异化不只是“我们支持 ML-KEM 和
              ML-DSA”，而是“我们把这些标准封装成可部署的基础设施组件”。不过，依赖结构并不轻。EigenQ 依赖芯片和平台生态、制造伙伴、标准对齐和采购渠道。只要其中任一环节滞后——无论因为资质摩擦、标准变化还是
              OEM 重新排序——即便核心技术论点成立，公司的产品速度也会放慢。因此，伙伴杠杆既是强项，也是技术依赖。
