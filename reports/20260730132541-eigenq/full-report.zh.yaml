  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与同业类别
        blocks:
          - type: paragraph
            body: >-
              EigenQ 面对的不是一个干净的单一同业集合，因为后量子市场仍围绕不同买方任务组装。SandboxAQ 和 QuSecure 主要在大型企业和政府的密码资产盘点、修复和迁移编排上竞争。ISARA 和
              evolutionQ 更接近密码敏捷性和迁移赋能专家；PQShield、SEALSQ 和 Crypto4A
              则强调嵌入式、硬件或硅根实现。行业摘要还显示，Thales、IBM、AWS、DigiCert、Entrust 等大型既有厂商和系统集成商已经在嵌入或咨询 PQC，这意味着 EigenQ
              同时面对聚焦型创业公司，以及大得多的平台打包出来的功能集。买家的实际问题因此不是“哪家公司做得完全一样？”，而是“谁能以最低运营风险，最快迁移我的基础设施盘点、密码控制和可信硬件？”在这个问题上，EigenQ
              最接近的对手，是兼具硬件或基础设施可信度与迁移叙事的供应商；最大的战略压力，则来自已经掌握安全运营或采购关系的公司。
