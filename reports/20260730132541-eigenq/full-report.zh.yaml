  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的主要风险
        blocks:
          - type: paragraph
            body: >-
              最实质的风险集中在四个相互牵连的依赖项上。第一，交易与融资风险仍然很高，因为 EigenQ 的公开资本故事仍取决于 SPAC
              能否交割，以及信托现金能保留多少；赎回、交易费用和任何追加融资需求都可能削薄这笔现金。第二，产品交付风险不小，因为 EigenQ 的商业化叙事靠 WNC、HPE、Intel、AMD 和 TD SYNNEX
              推动制造、认证和渠道执行，而不是靠一个完全内生的产品引擎。第三，客户验证风险偏高，因为相对于估值规模和市场进入主张的宽度，公开记录里具名终端客户证据很薄。第四，监管与合规风险可控但不可忽视：公司公开绑定隐私法合规、出口管制、制裁和联邦采购预期，合并协议也显示这些领域是重要陈述与保证主题。单看任何一项都不足以否定故事，但加在一起，在交割、规模化和客户转化拿出更强证据之前，残余风险仍然很高。
