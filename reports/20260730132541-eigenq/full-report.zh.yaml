  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与核心供给
        blocks:
          - type: paragraph
            body: >-
              EigenQ
              将自己定位为应用型量子技术公司，近期商业化重点放在后量子网络安全，而不是投机性的容错计算。公司称，其平台把量子生成熵、以硬件为根的身份和执行控制，以及后量子密码软件层组合起来，可接入现有基础设施，无需整体重构。2026
              年 6 月 17 日，公司宣布与 Silicon Valley Acquisition Corp. 签署最终业务合并协议，公开公司叙事由此锚定。该交易给予 EigenQ 约 $3.0 billion
              的企业价值，提到 SPAC 信托在赎回和费用前持有 $215 million 现金，并计划在 2026 年 Q4 交割，前提是 SEC 生效、股东批准并满足交易所上市条件。在公开定位中，EigenQ
              卖的不是单一盒子，而是一套信任基础设施栈，服务必须适应 NIST 后量子标准和 CNSA 2.0 迁移压力的政府、国防、关键基础设施和企业环境。
