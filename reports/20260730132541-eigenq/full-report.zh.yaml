              成本结构比收入更容易推断，却难以验证。EigenQ 并不是一家轻量软件供应商：公开材料强调硬件根信任、量子熵硬件、OEM
              集成、制造扩产，以及部署到服务器和关键基础设施环境。这些事实意味着物料清单成本、资质确认工作、库存或生产计划纪律、伙伴利润和支持义务，而纯软件 PQC
              供应商可能避开这些成本。因此，拟议业务合并在财务上处于核心位置。公司和交易材料称，该交易给予 EigenQ 约 $3 billion 估值，并由 SVAQ 信托账户在赎回和交易费用前约 $215 million
              支撑，所得资金计划用于商业化、制造扩产、合作伙伴关系和扩张。但同一批文件也警告，实际结果取决于赎回、盈利假设、交易成本、定价压力、供应链问题，以及公司维持合作伙伴利益的能力。这意味着标题资本故事有意义，但带条件，并不是到手现金确定性。
