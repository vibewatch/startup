      - number: '1.2'
        title: 领导层、治理与职能覆盖
        blocks:
          - type: paragraph
            body: >-
              随着 EigenQ 推进合并，公开的领导层披露有所改善，但仍比一家已上市运营公司通常提供的披露包薄。公司网站列出 Dr. José R. Rosas-Bustos 为 CEO、Dr. Jesse Van
              Griensven Thé 为董事长；2026 年 7 月合并期沟通又加入 Mark Pecen 担任副董事长，并将 Alexander Truskovsky 提升到新设的 CISO 岗位。网站还列出临时/代理
              CFO、首席增长官、首席产品高管，以及聚焦收入和合作的商务负责人，合在一起显示公司在投入产品化和商业化，而不是停留在纯研究驱动。即便如此，公开材料还没有给出常规的董事会委员会图谱、董事独立性分析、经审计的治理控制，或清晰对齐的股权结构表。尽调时可以把这套领导班子视为具备商业化可信度，但在注册声明和代理材料完整披露监督结构前，治理成熟度仍应按进行中处理。
