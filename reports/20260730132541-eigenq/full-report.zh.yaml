      - number: '3.3'
        title: 分销、切换成本与买方权力
        blocks:
          - type: paragraph
            body: >-
              分销力是这个市场最被低估的竞争变量之一。EigenQ 正尝试借 HPE、WNC、TD SYNNEX、Intel 和 AMD
              相关生态动作触达买家；如果这些动作转成合格平台和可复用采购渠道，威力会很大。但竞争对手也在争取杠杆式触达：ISARA 通过 Carahsoft 拿到联邦分销，SandboxAQ
              强调与联邦机构和大型企业合作，QuSecure 强调伙伴牵引的企业部署，PQShield
              面向半导体和政府项目，设计导入可扩展到大量设备。切换成本呈混合状态。发现和盘点平台会因为映射大型资产中的证书、密钥和密码态势而变黏；嵌入式或硬件根方案一旦被认证进芯片、板卡、固件或公共部门服务器捆绑包，也会变黏。这意味着，当硬件根信任成为设计决策，而不只是软件功能需求时，EigenQ
              的机会最强。反过来，如果客户停留在软件优先迁移阶段的时间长于预期，拥有低摩擦发现和修复流程的平台供应商可能先拿走预算。
