    rows:
      - - PQC 软件和密码库
        - 算法库、证书或密钥管理软件、加密敏捷性工具
        - 没有 PQC 功能的一般安全软件
        - CISO、平台安全、应用负责人
        - 多数市场研究中的核心软件层，也是 EigenQ 栈的一部分
      - - 硬件根植 PQC 模块
        - 熵硬件、加速器、安全芯片、类似 HSM 或邻近 TPM 的模块
        - 没有 PQC 功能的通用服务器硬件
        - OEM 产品团队、基础设施架构师、采购
        - 最契合 EigenQ 差异化硬件根植叙事
      - - 迁移与集成服务
        - 评估、盘点、部署、互操作、托管迁移
        - 无关咨询支出
        - CIO 办公室、联邦项目经理、系统集成商
        - 服务通常放大 TAM，也可能卡住软硬件采用
      - - 受监管通信和身份基础设施
        - 安全通信、认证、密钥生命周期、证明、信任根
        - 与 PQC 无关的消费消息或广义 IT 支出
        - 政府、国防、关键基础设施、企业安全
        - 最适合作为 EigenQ 目标用例的代理
      - - 量子安全网络 / QKD 邻近产品
        - 以量子安全定位营销的网络或通信产品
        - 纯研究网络项目和无关电信资本开支
        - 国家安全、电信、主权网络项目
        - 相关邻近市场，但不是 EigenQ 最干净的商业分母
      - - 排除：全量子计算 / AI / 传感支出
        - None
        - 安全迁移之外的量子计算机、传感或主权 AI 预算
        - R&D、科研或计算买方
        - 重要，因为 EigenQ 的 SPAC 叙事横跨比即时收入市场更宽的量子领域
    notes: 市场报告差异最大之处在于是否计入硬件、迁移服务和量子安全网络邻近项。该表收窄 EigenQ 商业相关边界。
