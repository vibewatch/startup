      - number: '3.2'
        title: 能力与产品对比
        blocks:
          - type: paragraph
            body: >-
              最清晰的能力分野，在迁移发现供应商与硬件根实现供应商之间。SandboxAQ 的 AQtive Guard、QuSecure 的 QuProtect 和 ISARA Advance
              聚焦发现、盘点、态势分析和跨既有密码资产的修复。PQShield、SEALSQ、Crypto4A 和 EigenQ
              则更直接围绕软件库、嵌入式实现、硬件加速器、安全元件或设备根信任竞争。这个区别很重要，因为买家可能分阶段采购：先盘点并规划问题，再部署硬件、固件、证书或密钥管理升级。EigenQ
              的优势，是把一套全栈硬件根信任架构与 OEM 集成、公共部门服务器现代化绑定起来。劣势在于，一些对手的产品故事更简单：QuSecure 卖清晰的修复平台，PQShield 向芯片和固件团队卖 IP
              与加速器，SEALSQ 已经是一家上市半导体安全公司，拥有更宽的 IoT 身份栈。因此，能力之争不在于谁提到 NIST 标准，而在于每家供应商能可信占住迁移栈的哪一层。
