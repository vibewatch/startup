      - number: '3.4'
        title: 护城河耐久性、既有厂商与替代风险
        blocks:
          - type: paragraph
            body: >-
              EigenQ 的护城河叙事建立在三个想法上：硬件根信任比纯软件叠加层更耐久，OEM
              和公共部门合作加速可信度，监管迁移压力奖励能够改造长寿命基础设施的供应商。这些确实是优势，但没有一项不受挑战。PQShield、SEALSQ、Crypto4A 和 QuintessenceLabs
              都在讲某种硬件或熵支撑的差异化。SandboxAQ、QuSecure、ISARA 和系统集成商如果成为迁移决策和政策报告的控制平面，未必需要同样的硬件故事。同时，云、HSM、证书和网络领域的大型既有厂商可以把
              PQC 吸收到客户已经购买的产品中，削弱选择独立供应商的紧迫性。因此，最深的反向证据是商品化风险：随着 NIST 标准成熟，PQC 的某些层可能变成入场标配，价值转向分销、集成易用性和生命周期管理。只要
              EigenQ 能证明硬件根信任实质改善采购、保障和运营结果，仍然可以胜出。但如果这些收益没有在客户部署中被证明，资金更足或分销更强的对手可以很快压缩差异化。
