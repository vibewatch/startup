  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 EigenQ 应计入的范围
        blocks:
          - type: paragraph
            body: >-
              EigenQ 的正确市场框架不是“全部量子技术”，甚至不是整个网络安全栈。最接近的商业边界，是受监管数字基础设施的后量子密码迁移：替换或增强 RSA/ECC
              时代信任功能的软件和硬件，以及部署所需的集成和迁移服务。公开市场报告通常会纳入软件、硬件安全模块或加速器、咨询或部署服务，但是否把相邻的量子安全网络、迁移项目和更广的密码硬件算进去，各家口径不同。具体到
              EigenQ，商业上真正相关的细分更窄：政府、国防、关键基础设施和企业服务器环境中，OEM 集成、硬件根、基础设施导向的 PQC 采用。因此，现状竞争不只是另一家量子创业公司；还有既有 HSM
              供应商、云安全栈、内部自建项目，以及因为替换周期昂贵复杂而拖延迁移的组织。
