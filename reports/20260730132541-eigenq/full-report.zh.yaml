      - number: '7.4'
        title: 缓释成熟度与否决条件
        blocks:
          - type: paragraph
            body: >-
              风险缓释成熟度参差不齐。确实有缓释因素：联邦标准正在厘清市场，合并协议看起来覆盖较全，隐私义务至少已被公开承认，多家平台伙伴也为进入买方环境提供不止一条路径。但最深层风险只被部分缓释，因为很多必要证据仍在私域。公开材料没有把赎回敏感性、积压订单、出货转化、可靠性指标、认证范围或客户续约串起来。因此投资者需要把否决条件绑定到可衡量事件，而不是一般性乐观。交易未能按时交割、伙伴路径没有转化为真实部署、认证或制造出现明显延误、监管或隐私不合规，或任何迹象显示公开主张实质性跑在可部署产品证据前面，都应迅速改变投资判断。因此，尽调负担是主动监测，不是被动期待。
