        - 赎回托底、现金桥和客户多元化变得可见
        - 高赎回或交割延迟减少可用于扩张的资本
      - - 估值立场
        - 偏高
        - 现有公开证据不足以让人照单全收约 $3B 的标示估值
        - 运营指标证明其相对上市同业可享有溢价定位
        - 上市可比公司估值压缩，或 EigenQ 披露的商业化速度低于暗含预期
    notes: 本表总结投资决策，不估算交易价格。
    claimRefs:
      - CV001
      - CV003
      - CV023
      - CV033
      - CV034
      - CV035
  - id: TV002
    title: 投资主线 / 反向论点表
    columns:
      - 论点
      - 支撑证据
      - 重要性
      - 什么会改变判断
    rows:
      - - PQC 迁移顺风因素真实存在
        - NIST 已敲定核心标准，CISA 正推动各产品类别采用 PQC
        - 为迁移支出托起监管需求底
        - 如果采购指引放慢或企业推迟迁移预算，紧迫性会减弱
      - - 合作伙伴栈可以加速渠道触达
        - HPE、WNC、AMD 和 TD SYNNEX 提供集成、制造和渠道路径
        - 比单打独斗的创业公司打法更快触达企业和公共部门
        - 如果合作伙伴路径停留在营销说法、没有订单流，渠道价值就被高估
      - - 以安全定位的量子故事可能比只做计算的同业更早变现
        - Arqit 和 SEALSQ 表明，公开市场会在硬件可选性之外认可更近端的安全叙事
        - 让 EigenQ 比纯长期计算故事更贴近当前网络安全预算
        - 如果买家把 EigenQ 视为小众硬件层而非平台，估值溢价会收窄
      - - 反向论点：收入不透明过于严重
        - 约 $3B 估值没有公开收入、ARR、毛利率或留存指标相配
        - 无法把价格与运营产出做归一化比较
        - 经审计的 S-4 披露可能大幅缓解这一担忧
      - - 反向论点：上市同业已经显示商业化慢于叙事
        - 上市量子同业上市多年、技术也有进展，但仍未盈利
        - 意味着投资者应大幅折价看待前瞻性主张
        - 重复部署和合作伙伴转化证据会缓和这一风险
    notes: 核心争议不是赛道是否相关，而是当前证据密度是否配得上要价估值。
    claimRefs:
      - CV005
      - CV006
      - CV015
      - CV016
      - CV019
      - CV020
      - CV024
      - CV034
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 隐含估值逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - PQC 迁移预算加速；合作伙伴路径转化为具名部署；赎回保持可控；S-4 显示可信的早期收入
        - 公布的约 $3.0B EV 可以解释为在完全规模化前为品类龙头付费
        - 需要多项正面披露和交割后的执行证明
        - 即使政策顺风强，商业转化仍可能滞后
      - - 基准
        - 需求真实，但认证周期长；信托现金被赎回削减；收入披露偏温和，不是突破性质量
        - 在运营证据跟上前，投资测算区间应低于标示交易价值
        - 最符合当前公开证据
        - 规模可见前，投资者可能为时点支付过高价格
      - - 悲观
        - 上市撞上更弱情绪；客户采用仍窄；商业化慢于预期，随后需要融资或稀释
        - 估值通过交易价格或未来融资大幅下修至标示值以下
        - 如果披露仍薄、可比公司估值下修，该情景可能成立
        - 对前沿硬件 / 安全公司而言，叙事受损的影响可能比一次里程碑落空更久
      - - 未上市 / 延迟情形
        - SEC 流程、赎回或交割条件拖延并购
        - 流动性事件后移，价值仍停留在名义层面
        - 低到中等，但并非零；SPAC 交割依赖路径
        - 私有期资金跑道压力拉长，会削弱议价能力
    notes: 这些情景是投资测算框架，不是目标价格。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类别
      - 公开估值或收入信号
      - 与 EigenQ 的相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        The table focuses on five public reference points most relevant to EigenQ's quantum-security or
        quantum-infrastructure narrative; it is not an exhaustive universe of all quantum-related listings.
    rows:
      - - IonQ
        - 上市量子硬件龙头
        - 2025 年收入 $130M；一致预期指向 2026 年约 $270M
        - 说明只要收入清晰、技术推进明确，市场愿意给溢价估值
        - 收入披露比 EigenQ 更成熟，计算敞口也更广
      - - D-Wave
        - 上市量子硬件 / 系统公司
        - 2025 年收入 $25M；一致预期指向 2026 年约 $44M
        - 说明即便收入不高，只要系统和项目可见，上市量子叙事也能延续
        - 退火加门模型策略与 EigenQ 安全基础设施并非直接匹配
      - - Rigetti
        - 上市超导硬件公司
        - 2025 年收入 $7M；一致预期指向 2026 年约 $24M
        - 有助于判断政府牵引的商业化为何短期收入仍小
        - 计算优先的商业模式不同于 EigenQ
      - - Arqit
        - 上市抗量子加密软件公司
        - FY2025 初步收入约 $0.53M；截至 9 月 30 日现金 $36.9M
        - 在安全叙事和商业化挑战上更接近 EigenQ
        - 软件授权模式和更早的炒作周期会扭曲直接比较
      - - SEALSQ
        - 上市后量子硬件安全公司
        - 公开信息强调监管驱动的 PQC 硬件需求和商业协议
        - 以硬件为根的量子安全基础设施中最接近的上市参照
        - 公开来源提供的财务披露不如大型同业标准化
    notes: 可比信号说明主题需求存在，但本身不能验证 EigenQ 公布的价格。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV021
      - CV022
  - id: TV005
    title: 投资主线破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 为什么会打破投资主线
      - 行动含义
    rows:
      - - 收入不透明延续到生效阶段
        - S-4 / 委托书材料没有披露经审计收入或毛利率
        - 市场仍要在缺少运营锚的情况下给数十亿美元价值定价
        - 披露改善前保持观望
      - - 赎回压力大幅压缩现金
        - 信托或交割现金显著低于标示预期
        - 削弱资助硬件认证、渠道扩张和获客的能力
        - 重新测算下行和稀释风险
      - - 具名客户证据没有扩展
        - 除现有稀疏证明点外，没有新增具名部署
        - 说明合作伙伴公告没有转化为需求
        - 将故事视为比估值暗示更早期
      - - 合作伙伴路径停滞
        - HPE / AMD / WNC / TD SYNNEX 渠道仍是没有收入支撑的叙事
        - 渠道优势是乐观情景的核心支柱
        - 下调确信度，等待订单证据
      - - 上市可比公司估值重定价下行
        - 量子 / PQC 同业估值压缩，而 EigenQ 没有相应证据增量抵消
        - 降低对投机性溢价倍数的容忍度
        - 提高要求回报门槛，或避免进入
    notes: 每个触发项都能从文件、披露或后续合作伙伴 / 客户证据中观察到。
    claimRefs:
      - CV003
      - CV006
      - CV024
      - CV028
      - CV031
      - CV036
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计收入桥
        - TTM 收入、订单额、如适用 ARR，以及硬件 / 软件 / 服务收入组合
        - 必须用来把约 $3B 估值与实际产出对齐
        - 审阅最终 S-4 财务报表和管理层预测桥
      - - 现金和稀释
        - 资金来源与用途、PIPE 或旁侧融资、认股权证压力和赎回敏感性
        - 标示信托现金不等于可用增长资本
        - 从备案文件和投资者材料索取股权结构表和交易模型细节
      - - 合作伙伴经济性
        - 按路径拆分的毛利率、OEM / 分销商抽成、保修负担和认证成本
        - 如果经济性弱，合作伙伴牵引的规模化会毁掉价值
        - 通过 NDA 或董事会材料索取商业条款
      - - 客户转化
        - 具名销售管线、部署数量、合同规模、续约信号和集中度
        - 验证生态公告是否转化为可重复需求
        - 索取客户分群和漏斗报告
      - - 技术护城河持久性
        - 独立验证以硬件为根的差异化和实施摩擦
        - 用来判断 EigenQ 是否能相对纯软件 PQC 同业获得溢价
        - 委托技术尽调，对照替代架构评估
    notes: 若要从继续研究上调到跟踪或买入，至少前四行需要显著更强的证据。
    claimRefs:
      - CV006
      - CV018
      - CV023
      - CV032
      - CV037
      - CV038
      - CV039
      - CV040
