  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公告价格要求投资者相信什么
        blocks:
          - type: paragraph
            body: >-
              公开记录给了投资者一个异常清晰的头部估值，也留下一个异常不完整的运营模型。从 2026 年 6 月合并公告、6 月 23 日业务合并材料，到 7 月 28 日文件更新，EigenQ 一直被表述为约 $3.0B
              的备考企业价值，SVAQ 信托现金在赎回和费用前约
              $215M。这有助于锚定入场讨论，但回答不了核心估值问题，因为市场仍看不到收入、毛利率、客户数、留存、订单，或经审计的单位经济明细。支撑这个数字的最近依据是叙事，不是算术：联邦 PQC
              迁移压力真实存在，HPE/AMD/WNC/TD SYNNEX
              提供了可想象的规模化路径，公开量子可比公司也显示，只要政府需求和供应链可信度可见，投资者会为技术可选性买单。问题在于，拥有公开估值的同行至少在收入、现金或装机系统上部分可读，而 EigenQ 仍是一个尚未交割的
              SPAC 标的，有商业化主张，却几乎没有披露运营证据。这个组合意味着，公告估值更适合被当作谈判点和市场信号，而不是公开记录已经证明的公允价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: 公开可比公司支撑主题，但不支持无视价格入场
        blocks:
          - type: paragraph
            body: >-
              最相关的公开参照分成两组。第一组是 IonQ、D-Wave、Rigetti 等量子计算龙头。它们不是完美的商业模式匹配，但展示了市场会为技术动量、政府信用和早期收入支付什么价格。IonQ
              已成为该领域收入龙头；D-Wave 和 Rigetti 规模小得多，但仍受益于战略项目胜利和公开市场可选性。第二组是 Arqit、SEALSQ 等后量子或量子安全公司，更接近 EigenQ
              的安全叙事，但产品架构和资本市场历史不同。这些可比公司支持一个判断：量子和 PQC 基础设施在成熟盈利前，就能讲出十亿美元级股权故事。它们不能证明 EigenQ 立刻就应有 ~$3B
              标记。相反，它们说明市场奖励证据密度：披露收入、可见政府项目、技术里程碑，或可复制的商业楔子。EigenQ 政策顺风强、伙伴包装也强，但相对同行，证据缺口仍大于估值缺口。
