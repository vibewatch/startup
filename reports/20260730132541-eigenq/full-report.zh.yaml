      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 建议
            body: 继续研究。EigenQ 有真实的品类顺风和可信分销伙伴，但公开证据仍不足以把公告的 ~$3B 估值按公允价值承保。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV033
          - type: callout
            title: 核心下行
            body: 最大下行不是技术无关，而是在经审计收入、毛利率和客户转化证据可见前，就支付公开市场价格。
            calloutType: risk
            claimRefs:
              - CV006
