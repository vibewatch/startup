      - number: '2.2'
        title: 规模测算口径与估计分歧
        blocks:
          - type: paragraph
            body: >-
              所有已审阅的公开市场来源都指向同一方向——多年快速扩张——但没有一个给出唯一权威分母。Axis Intelligence 综合了较宽口径：纳入硬件、服务和迁移项目后，2025 年约 $1.3 billion 到
              $1.6 billion，2026 年约 $2.2 billion 到 $2.8 billion。The Business Research Company 给出更窄的 2026 年市场值 $0.78
              billion 和 2030 年展望 $2.23 billion；360ResearchReports 与 Business Research Insights 又发布了不同的 2026 和 2035
              曲线。分歧本身有信息量，而不是噪音：市场仍年轻，定义仍流动，分析师边界选择会实质改变标题数字。尽调上，最有助于决策的结论不是一个 TAM 数字，而是一个区间。EigenQ
              可以可信地指向强结构性增长，但不能指向一个已形成共识、足以自动验证 $3 billion 企业价值的市场规模。
