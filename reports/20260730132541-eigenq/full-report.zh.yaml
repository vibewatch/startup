      - number: '2.4'
        title: 增长驱动、采用约束与时点
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动真实且清晰：NIST 已在 2024 年 8 月敲定首批 PQC 标准，CISA 现在为具备 PQC 能力的产品类别发布买方指南，White House 和联邦生态抬高了迁移议程，CNSA 2.0
              也让国家安全时间线始终在场。这些力量给能够提供实用迁移路径的供应商带来少见的自上而下拉力。但约束同样关键。Cloudflare
              把转型描述为实质上的两次迁移，警告不要出现「加密拖延」，并显示证书迁移仍落后于密钥协商采用。NIST
              的迁移工作强调互操作性和实施复杂度，多份市场摘要也把技能短缺、性能开销和集成成本列为核心阻力。结果是，市场有真实紧迫感，却要慢慢改企业底层管线。只有当 EigenQ 能借 OEM
              集成和渠道触达降低迁移摩擦时，环境才会利好公司；否则，制造需求的同一套复杂性也会推迟订单，把试点拉成长达数年的项目。
