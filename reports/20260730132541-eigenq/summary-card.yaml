  topStrengths:
    - Real policy tailwinds from NIST PQC standards and national-security migration pressure support the category need.
    - >-
      HPE, AMD, WNC, and TD SYNNEX give EigenQ more commercialization scaffolding than many under-disclosed deep-tech
      peers.
    - >-
      The product story is closer to current cybersecurity budgets than a pure long-horizon fault-tolerant compute
      thesis.
    - >-
      Pending Nasdaq listing gives the company a plausible route to scale capital if disclosures improve and demand
      converts.
  topRisks:
    - >-
      Public sources still do not disclose revenue, gross margin, retention, or customer-count metrics needed to justify
      the announced valuation.
    - >-
      SPAC redemptions, dilution, and closing mechanics can materially reduce usable growth capital versus the headline
      trust figure.
    - Named customer proof remains sparse relative to the scale of the commercialization narrative.
    - >-
      Public quantum and PQC comparables are volatile and already show how long frontier commercialization can take even
      after listing.
    - >-
      The partner stack is strategically useful, but public evidence does not yet prove conversion from alliances into
      repeatable orders.
  unresolvedGaps:
    - Audited revenue, bookings, gross-margin, and concentration disclosures in the final S-4.
    - Sources-and-uses, PIPE or side-financing terms, warrant overhang, and redemption sensitivity.
    - Partner economics, including OEM/channel take rates, qualification costs, and warranty burden.
    - >-
      Evidence of additional named customers, contract values, deployment counts, and renewals beyond sparse current
      proof points.
