callouts:
  - calloutType: strength
    title: EigenQ’s technical story is strongest where migration must happen inside existing infrastructure
    body: The company consistently focuses on retrofitting Intel, AMD, HPE, and other infrastructure estates with hardware-rooted trust rather than requiring complete system replacement.
    claimRefs: [CE008, CE009, CE015, CE018, CE028]
  - calloutType: risk
    title: Public proof is deeper on partner narrative than on benchmarked product detail
    body: Public materials show many integration pathways, but buyers still need product-specific data on certifications, interoperability, performance, and reliability.
    claimRefs: [CE020, CE027, CE039, CE041, CE042]
  - calloutType: insight
    title: The stack is differentiated by packaging standards into infrastructure, not by claiming unique algorithms
    body: NIST and CISA define the standards and procurement direction; EigenQ’s claim to value is making those standards deployable in hardware-rooted server and edge environments.
    claimRefs: [CE030, CE031, CE035, CE036, CE038]
