  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: module-certification-ledger
      missingEvidence: Product-by-product certification status, validation reports, and scope statements for each EigenQ module.
      whyItMatters: Public standards alignment is not the same as proven certification depth.
      diligencePath: Request certification ledger, lab reports, and boundary statements by SKU.
    - type: private-evidence-only
      severity: material
      topic: throughput-and-interoperability
      missingEvidence: Benchmark data, interoperability test reports, latency impacts, and failure-mode behavior for server deployments.
      whyItMatters: Retrofit products can create performance or compatibility issues that are invisible in marketing copy.
      diligencePath: Request benchmark packs, integration test logs, and customer acceptance results.
    - type: private-evidence-only
      severity: material
      topic: update-and-reliability-controls
      missingEvidence: Security update practices, firmware lifecycle policy, warranty terms, and field reliability metrics.
      whyItMatters: Long-lived infrastructure buyers need lifecycle assurance, not just initial deployment claims.
      diligencePath: Request secure-update architecture, SBOM policy, and reliability dashboards.
    - type: missing-source
      severity: material
      topic: independent-deployment-proof
      missingEvidence: Independent named customer case studies proving production deployment scale.
      whyItMatters: Partner and press materials may overstate maturity without customer-side evidence.
      diligencePath: Gather third-party case studies, procurement records, or customer reference calls.
    - type: private-evidence-only
      severity: material
      topic: dependency-concentration
      missingEvidence: Partner dependency map covering Intel, AMD, HPE, WNC, and TD SYNNEX commercial and technical concentration.
      whyItMatters: The stack depends on external ecosystems for delivery and scale.
      diligencePath: Request partner contracts, roadmap commitments, and contingency plans.
