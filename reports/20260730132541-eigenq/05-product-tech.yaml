company:
  name: EigenQ
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    EigenQ’s product story is centered on hardware-rooted post-quantum trust infrastructure that can retrofit existing servers and other long-lived
    systems rather than forcing full platform replacement. Public materials describe a stack spanning qTPM identity, quantum entropy, PQC software
    libraries and cryptographic-agility tooling, plus OEM and channel integration through Intel, AMD, HPE, WNC, and TD SYNNEX. The core technical
    attraction is practical infrastructure migration; the core diligence challenge is that public sources still leave certification depth, performance
    benchmarks, field reliability, and roadmap maturity only partially evidenced.
sections:
  - id: product-modules-and-customer-jobs
    title: Product modules and customer jobs
    body: >-
      EigenQ defines the product less as one standalone appliance and more as a trust layer for infrastructure that must survive the post-quantum
      transition. Across its website and partner announcements, the recurring components are hardware-rooted identity, quantum entropy generation,
      post-quantum cryptographic software, cryptographic-agility tooling, and deployment models that fit into servers, gateways, edge systems, and
      long-lived devices. Public customer jobs are concrete: protect communications, establish device identity, support attestation, modernize key
      generation and lifecycle management, and retrofit existing Intel Xeon or AMD EPYC environments without wholesale replacement. The WNC release adds
      physical packaging clues by naming PCIe, M.2, and 1U secure-server modules, while the Intel and AMD releases frame the technology as an upgrade path
      for already-deployed infrastructure. That is important because it suggests EigenQ is selling integration into buyer workflows and installed hardware
      estates, not just abstract cryptographic primitives.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE011]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: architecture-and-operating-model
    title: Architecture and operating model
    body: >-
      The public architecture narrative has a consistent shape even if implementation detail is still incomplete. EigenQ repeatedly describes a hardware
      root of trust anchored by qTPM and quantum entropy, combined with PQC+ cryptographic libraries and integration layers that plug into server and
      high-assurance environments. The Intel announcement says the stack can help protect encrypted communications, workload protection, identity, key
      generation, and attestation on existing Xeon-based infrastructure; the AMD and TD SYNNEX materials say a similar platform can assess, align, and
      migrate EPYC-based environments. WNC adds the manufacturing and form-factor layer, indicating EigenQ’s technology is not purely conceptual but mapped
      into physical modules and contract-manufacturing pathways. The architectural advantage is that EigenQ is trying to solve deployment and assurance at
      the infrastructure layer. The architectural risk is that public sources do not yet provide enough low-level documentation to verify throughput,
      interoperability boundaries, failover behavior, update mechanics, or long-term maintainability in production.
    claimRefs: [CE012, CE013, CE014, CE015, CE016, CE017, CE018, CE019]
    tableRefs: [TE003]
    figureRefs: [FE002]
  - id: integration-maturity-and-roadmap
    title: Integration maturity and roadmap
    body: >-
      EigenQ’s maturity evidence is strongest where partner releases name practical deployment pathways and weakest where buyers would want product-grade
      benchmarking. Public materials show multiple routes toward integration: HPE-linked ProLiant enablement, WNC-backed manufacturing, Intel Xeon retrofit
      support, and AMD EPYC alignment through TD SYNNEX. The WNC release even names pilot shipments and planned volume production timing, while the Intel
      and AMD materials emphasize compatibility with already-installed infrastructure. Those are stronger signals than vague “future quantum” messaging.
      Leadership and investor communications also indicate a roadmap that extends beyond quantum security into AI, communications, sensing, and computing,
      which broadens ambition but may diffuse product focus. The practical conclusion is that EigenQ looks more mature as a retrofit and partner-integration
      platform than as a fully documented, benchmark-rich standalone product company. Investors should therefore distinguish between visible integration
      traction and still-unproven depth of field performance, certification scope, and software lifecycle tooling.
    claimRefs: [CE017, CE018, CE020, CE021, CE022, CE023, CE024, CE025, CE026, CE027]
    tableRefs: [TE005]
    figureRefs: [FE003]
  - id: differentiation-and-dependency-structure
    title: Differentiation and dependency structure
    body: >-
      EigenQ’s clearest differentiation claim is that software-only migration is not enough for long-lived or high-assurance systems; the company argues
      buyers need trusted entropy, hardware-rooted identity, and quantum-safe execution scaffolding underneath the cryptographic transition. That position
      is reinforced by federal procurement guidance that highlights hardware and software product categories needing PQC adoption and by NIST standards work
      that formalizes the algorithms buyers must ultimately implement. The differentiator is therefore not merely “we support ML-KEM and ML-DSA” but “we
      package those standards into deployable infrastructure components.” Still, the dependency structure is nontrivial. EigenQ relies on chip and platform
      ecosystems, manufacturing partners, standards alignment, and procurement channels. If any of those lag—whether through qualification friction,
      standards changes, or OEM reprioritization—the company’s product velocity can slow even if the core technology thesis is valid. That makes partner
      leverage a strength and a technical dependency at the same time.
    claimRefs: [CE028, CE029, CE030, CE031, CE032, CE033, CE034]
    tableRefs: []
    figureRefs: [FE004]
  - id: trust-quality-and-compliance-controls
    title: Trust, quality, and compliance controls
    body: >-
      The trust story is strategically strong but still unevenly evidenced. EigenQ repeatedly cites FIPS 203 and FIPS 204 alignment, CNSA 2.0 readiness,
      federal deployment relevance, and validated entropy or qTPM roots of trust. NIST, CISA, and NSA materials all support the broader technical context:
      ML-KEM, ML-DSA, and SLH-DSA are the relevant approved standards; migration is expected across hardware and software product categories; and buyers are
      being pushed toward PQC-capable infrastructure. What remains less clear is the exact scope of EigenQ’s own certifications, test evidence, or audit
      artifacts. Some company language says “FIPS-certified” or “NIST-certified” in product-adjacent ways, but the reviewed public record did not provide
      a clean certification ledger or performance test pack for each module. In other words, EigenQ is well aligned with the standards regime, but a buyer
      or investor still needs product-specific documentation on certifications, security update practices, reliability metrics, and compliance boundaries.
    claimRefs: [CE035, CE036, CE037, CE038, CE039, CE040, CE041, CE042]
    tableRefs: [TE004]
