  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: manufacturing-and-reliability-proof
      missingEvidence: Yield, failure rates, qualification status, field reliability, and interoperability evidence for deployed modules.
      whyItMatters: Operational quality is a core determinant of whether partner announcements translate into durable deployments.
      diligencePath: Request test reports, RMA history, qualification dashboards, and deployment acceptance records.
    - type: private-evidence-only
      severity: material
      topic: partner-commercial-terms
      missingEvidence: Commercial terms, exclusivity, SLAs, and contingency plans with WNC, HPE, Intel, AMD, TD SYNNEX, and other channel partners.
      whyItMatters: Ecosystem dependence is central to the business model and to downside protection.
      diligencePath: Review key partner agreements and governance cadences.
    - type: private-evidence-only
      severity: material
      topic: financing-and-redemption-sensitivity
      missingEvidence: Minimum-cash condition, redemption sensitivity, and downside financing plan.
      whyItMatters: Financing risk is still a first-order operating risk.
      diligencePath: Review S-4 cash-condition language and management liquidity scenarios.
    - type: private-evidence-only
      severity: material
      topic: privacy-and-security-controls
      missingEvidence: Audit evidence, control matrices, incident history, DPA terms, and international data-flow controls.
      whyItMatters: Public privacy commitments are broad and the target markets are sensitive.
      diligencePath: Request privacy impact assessments, security audit results, and incident-response documentation.
    - type: private-evidence-only
      severity: material
      topic: customer-proof-concentration
      missingEvidence: Named deployments, account concentration, conversion rates, and renewal or expansion data.
      whyItMatters: Narrow proof breadth amplifies multiple other risks.
      diligencePath: Request customer roster, top-account exposure, and pilot-to-production conversion metrics.
