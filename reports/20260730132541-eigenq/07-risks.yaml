    summary: The highest residual risks sit where financing dependency, partner concentration, and thin operating disclosure overlap.
    data:
      columns: [Likelihood, Impact, Mitigation maturity, Residual severity]
      rows:
        - {label: 'SPAC closing and financing', values: [5, 5, 3, 5]}
        - {label: 'Manufacturing and qualification', values: [4, 5, 3, 4]}
        - {label: 'Customer proof breadth', values: [4, 4, 2, 4]}
        - {label: 'Privacy and compliance', values: [3, 4, 3, 3]}
        - {label: 'Partner concentration', values: [4, 4, 3, 4]}
    claimRefs: [CR005, CR007, CR008, CR009]
  - id: FR002
    title: Risk transmission map
    type: dag
    summary: Several risks transmit through the same chain from partner execution and compliance into customer proof, financing, and valuation confidence.
    data:
      nodes:
        - {id: r1, label: 'Compliance or legal issue', detail: 'Privacy, export, sanctions, IP, or litigation event', claimRefs: [CR013, CR014, CR015, CR016]}
        - {id: r2, label: 'Operational slip', detail: 'Manufacturing, qualification, or reliability failure', claimRefs: [CR018, CR019, CR020]}
        - {id: r3, label: 'Customer proof erosion', detail: 'Delayed or missing deployments reduce trust in adoption claims', claimRefs: [CR007, CR026]}
        - {id: r4, label: 'Financing pressure', detail: 'Redemptions, extra capital need, or weaker closing confidence', claimRefs: [CR001, CR002, CR032]}
        - {id: r5, label: 'Valuation compression', detail: 'Residual-risk premium overwhelms strategic narrative', claimRefs: [CR009, CR010, CR040]}
      edges:
        - {from: r1, to: r3, label: 'reduces buyer trust'}
        - {from: r2, to: r3, label: 'weakens deployment proof'}
        - {from: r3, to: r4, label: 'raises capital skepticism'}
        - {from: r4, to: r5, label: 'compresses credibility'}
        - {from: r2, to: r4, label: 'slows conversion'}
    claimRefs: [CR006, CR010, CR032, CR040]
  - id: FR003
    title: Dependency map
    type: dag
    summary: EigenQ’s commercialization stack depends on a small number of partners that each control a different part of the route to market.
    data:
      nodes:
        - {id: d1, label: 'WNC', detail: 'Manufacturing and module scale-up', claimRefs: [CR023]}
        - {id: d2, label: 'HPE', detail: 'Server qualification and public-sector route', claimRefs: [CR024]}
        - {id: d3, label: 'Intel', detail: 'Installed-base retrofit credibility', claimRefs: [CR025]}
        - {id: d4, label: 'AMD and TD SYNNEX', detail: 'EPYC pathway and channel access', claimRefs: [CR026]}
        - {id: d5, label: 'SVAQ', detail: 'Capital-market bridge and listing route', claimRefs: [CR027]}
        - {id: d6, label: 'EigenQ commercial outcome', detail: 'Deployment proof and scalable revenue path', claimRefs: [CR035, CR039]}
      edges:
        - {from: d1, to: d6, label: 'supplies'}
        - {from: d2, to: d6, label: 'qualifies'}
        - {from: d3, to: d6, label: 'anchors installed base'}
        - {from: d4, to: d6, label: 'distributes'}
        - {from: d5, to: d6, label: 'funds bridge'}
    claimRefs: [CR024, CR025, CR026, CR027, CR035]
callouts:
  - calloutType: risk
    title: Financing risk is still a first-order operating risk
    body: Because the headline capital story depends on a still-pending SPAC and trust cash subject to redemptions, financing uncertainty can quickly become a product, customer, and valuation problem.
    claimRefs: [CR001, CR002, CR032]
  - calloutType: insight
    title: Standards clarity lowers one risk while raising the execution bar
    body: NIST, NSA, and CISA make the demand case stronger, but they also make it harder for EigenQ to rely on vague quantum-security positioning without concrete operational proof.
    claimRefs: [CR012, CR017, CR034]
  - calloutType: recommendation
    title: Underwrite the ecosystem as carefully as the company
    body: The company’s route to market is partner mediated, so diligence should focus on joint roadmaps, qualification milestones, commercial terms, and contingency plans across the ecosystem.
    claimRefs: [CR023, CR024, CR025, CR026, CR035]
