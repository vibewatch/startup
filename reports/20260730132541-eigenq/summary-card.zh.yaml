  topStrengths:
    - NIST PQC 标准和国家安全迁移压力带来真实政策顺风，支撑品类需求。
    - HPE、AMD、WNC 和 TD SYNNEX 给 EigenQ 搭起商业化脚手架，强于许多披露不足的深科技同业。
    - 产品叙事更贴近当下网络安全预算，而不是纯粹押注长期容错计算。
    - 待完成的 Nasdaq 上市给公司留下规模化融资路径，前提是披露改善、需求能转化。
  topRisks:
    - 公开来源仍未披露支撑宣布估值所需的收入、毛利率、留存或客户数指标。
    - SPAC 赎回、稀释和交割机制可能让可用增长资金显著低于名义信托金额。
    - 相对于商业化叙事的规模，具名客户证明仍偏少。
    - 公开量子和 PQC 可比公司波动很大，也已经显示即便上市，前沿技术商业化仍可能拉得很长。
    - 合作伙伴组合有战略价值，但公开证据尚未证明联盟能转成可重复订单。
  unresolvedGaps:
    - 最终 S-4 中的经审计收入、订单、毛利率和客户集中度披露。
    - 资金来源与用途、PIPE 或侧融资条款、认股权证压力和赎回敏感性。
    - 合作伙伴经济性，包括 OEM / 渠道抽成、资质验证成本和质保负担。
    - 需要更多具名客户、合同金额、部署数量和续约证据，超出目前稀疏的证明点。
