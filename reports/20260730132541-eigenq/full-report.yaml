      - number: '7.4'
        title: Mitigation maturity and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity is mixed. There are real mitigants: federal standards are clarifying the market, the
              merger agreement appears comprehensive, privacy obligations are at least publicly acknowledged, and
              multiple platform partners create more than one route into buyer environments. But the deepest risks are
              only partially mitigated because many of the required proofs are still private. There is no public
              reconciliation of redemption sensitivity, backlog, shipment conversion, reliability metrics, certification
              scope, or customer renewal. That means investors need kill criteria tied to measurable events rather than
              to general optimism. Failure to close the deal on time, evidence that partner pathways are not converting
              into real deployments, meaningful slippage in qualification or manufacturing, regulatory or privacy
              non-compliance, or any sign that public claims materially outran deployable product evidence should all
              change the investment view quickly. The diligence burden is therefore active monitoring, not passive hope.
