          - type: callout
            title: Best supporting argument
            body: >-
              EigenQ's security-led positioning is closer to present-day buyer budgets than a pure fault-tolerant
              computing story, which is why the company deserves monitoring even if the price is not yet investable.
            calloutType: insight
            claimRefs:
