            body: >-
              From an underwriting perspective, the deepest issue is not a lack of strategic narrative but a lack of
              reconciled financial disclosure. Across the reviewed SEC materials, company pages, partner releases, and
              filing indexes, no public source provided audited EigenQ revenue, ARR, gross margin, operating expenses,
              monthly burn, unrestricted cash, debt, backlog, customer concentration, deferred revenue, or contract
              liabilities. Filing-tracker sources confirm that SVAQ has maintained public reporting cadence, and July
              2026 filing indexes confirm more transaction materials were filed after the announcement, but the reviewed
              text still did not expose the target’s actual P&L or cash position. There is also no public disclosure of
              a PIPE amount or other incremental financing beyond trust cash and rolled equity. As a result, critical
              judgments such as runway, dilution risk, capital adequacy under heavy redemptions, and whether current
