      - number: '2.4'
        title: Growth drivers, adoption constraints, and timing
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are real and visible: NIST finalized the first PQC standards in August 2024,
              CISA now publishes buyer guidance for PQC-capable product categories, the White House and federal
              ecosystem have elevated the migration agenda, and CNSA 2.0 keeps national-security timelines in view.
              Those forces create unusually strong top-down pull for vendors that can offer practical migration paths.
              But the constraints are just as important. Cloudflare describes the transition as effectively two
              migrations, warns against “crypto procrastination,” and shows that certificate migration still lags
              key-agreement adoption. NIST’s migration work emphasizes interoperability and implementation complexity,
              while multiple market summaries cite skills shortages, performance overhead, and integration cost as core
              restraints. The result is a market with genuine urgency but slow enterprise plumbing. That favors vendors
              like EigenQ only if they can reduce migration friction through OEM integration and channel access;
              otherwise the same complexity that creates demand can also delay bookings and stretch pilots into
              multi-year programs.
