            title: Recommendation
            body: >-
              Research-more. EigenQ has real category tailwinds and credible distribution partners, but public evidence
              still does not justify underwriting the announced ~$3 billion valuation as fair value.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
