              available sources do not disclose revenue, ARR, headcount, customer count, gross margin, retention, or a
              full pre-SPAC funding history. That keeps the company in a private-undisclosed disclosure profile despite
              the pending public transaction and means valuation judgments still rest much more on strategic narrative
              than on disclosed operating evidence.
