      - number: '2.3'
        title: Buyers, budget owners, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The market evidence is most coherent when broken into buyer systems rather than industries alone. In
              regulated environments the user may be a security or cryptography team, the budget owner may be a CISO,
              CIO, platform-security leader, or federal program office, and the deployment path often runs through OEM,
              channel, or integrator ecosystems rather than a direct SaaS purchase. Government and defense buyers care
              about assurance horizons, procurement categories, and certification pathways; critical-infrastructure
              operators care about long asset lives and retrofit feasibility; financial, healthcare, and telecom buyers
              care about protecting long-lived records without destabilizing production traffic. EigenQ’s public
              messaging aligns best with high-assurance compute, secure identity, encrypted communications, and
              hardware-rooted server environments, which are buyer needs closer to infrastructure modernization than to
              discretionary security tooling. In practice, procurement friction also means platform partners often shape
              timing as much as end-customer urgency does. Adoption therefore tends to follow a staged
              workflow—inventory, assessment, pilot, hybrid deployment, qualification, and then scaled rollout—rather
              than a one-quarter software swap.
