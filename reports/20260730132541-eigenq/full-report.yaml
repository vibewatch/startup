              - CR005
              - CR007
              - CR008
              - CR009
      - number: '7.2'
        title: Legal, regulatory, and operational exposure
        blocks:
          - type: paragraph
            body: >-
              Legal and regulatory risk is not mainly about known litigation today; it is about whether the company can
              satisfy the obligations implied by its deal structure and target markets. The business combination
              agreement and 8-K summary reference litigation, privacy and security, material contracts, intellectual
              property, environmental compliance, export controls, sanctions, and government approvals as material
              subjects. The privacy policy adds a broad commitment to PIPEDA, GDPR, Israeli privacy law, and other
              international standards, while FTC guidance and federal procurement guidance raise the operating bar for
              any company selling into security-sensitive environments. Operationally, the same story repeats: public
              sources describe secure-server modules, pilot shipments, HPE-qualified bundles, and partner-led
              manufacturing or qualification, which is encouraging but also means reliability, supply, quality, and
              update-control failures would quickly propagate into customer trust and financing confidence. In short,
              EigenQ’s risk posture is less “unknown science risk” than “high-standards commercialization risk.”
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
