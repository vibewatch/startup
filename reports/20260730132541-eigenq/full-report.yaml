      - number: '3.2'
        title: Capability and product comparison
        blocks:
          - type: paragraph
            body: >-
              The sharpest capability split is between migration-discovery vendors and hardware-rooted implementation
              vendors. SandboxAQ’s AQtive Guard, QuSecure’s QuProtect, and ISARA Advance center on discovery, inventory,
              posture analysis, and remediation across existing cryptographic estates. PQShield, SEALSQ, Crypto4A, and
              EigenQ instead compete more directly around software libraries, embedded implementations, hardware
              accelerators, secure elements, or device-rooted trust. That distinction matters because buyers may stage
              purchases: first inventory and roadmap the problem, then deploy hardware, firmware, certificate, or
              key-management upgrades later. EigenQ’s advantage is that it markets a full-stack hardware-rooted trust
              architecture tied to OEM integration and public-sector server modernization. Its disadvantage is that some
              rivals have simpler product stories: QuSecure sells a clear remediation platform, PQShield sells IP and
              accelerators for chip and firmware teams, and SEALSQ already operates as a public semiconductor-security
              company with a broader IoT identity stack. The capability battle is therefore less about who mentions NIST
              standards and more about which layer of the migration stack each vendor can credibly own.
