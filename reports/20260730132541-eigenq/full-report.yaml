            body: >-
              The cost structure is easier to infer than to verify. EigenQ is not positioned as a lightweight software
              vendor: its public materials emphasize hardware-rooted trust, quantum entropy hardware, OEM integration,
              manufacturing scale-up, and deployment into server and critical-infrastructure environments. Those facts
              imply bill-of-materials costs, qualification work, inventory or build-planning discipline, partner
              margins, and support obligations that software-only PQC vendors may avoid. The proposed business
              combination is therefore financially central. Company and transaction materials say the deal values EigenQ
              at roughly $3 billion and is supported by approximately $215 million in SVAQ’s trust account before
              redemptions and transaction expenses, with proceeds intended to support commercialization, manufacturing
              scale-up, partnerships, and expansion. But the same filings warn that actual outcomes depend on
              redemptions, profitability assumptions, costs of the transaction, pricing pressure, supply-chain issues,
              and the company’s ability to maintain partner benefits. That means the headline capital story is
              meaningful but contingent, not cash-in-hand certainty.
