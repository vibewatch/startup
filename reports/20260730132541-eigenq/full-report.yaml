        title: Sizing lenses and estimate divergence
        blocks:
          - type: paragraph
            body: >-
              Every public market source reviewed points in the same direction—rapid multi-year expansion—but none
              provides a single authoritative denominator. Axis Intelligence synthesizes a broad 2025 band of roughly
              $1.3 billion to $1.6 billion and a 2026 band of roughly $2.2 billion to $2.8 billion when hardware,
              services, and migration programs are included. The Business Research Company publishes a narrower 2026
              market value of $0.78 billion and a 2030 outlook of $2.23 billion, while 360ResearchReports and Business
              Research Insights publish still different 2026 and 2035 curves. The disagreement is informative rather
              than incidental: the market is young, definitions are fluid, and analyst perimeter choices materially
              change the headline number. For diligence, that means the most decision-useful conclusion is not one TAM
              figure but a range. EigenQ can credibly point to strong structural growth, but not to a settled consensus
              market size that automatically validates a $3 billion enterprise value.
