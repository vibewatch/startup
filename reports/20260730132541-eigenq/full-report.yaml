  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and peer classes
        blocks:
          - type: paragraph
            body: >-
              EigenQ does not face a single clean peer set because the post-quantum market is still assembling around
              different buyer jobs. SandboxAQ and QuSecure compete primarily on cryptographic inventory, remediation,
              and migration orchestration for large enterprises and government. ISARA and evolutionQ are closer to
              crypto-agility and migration-enablement specialists, while PQShield, SEALSQ, and Crypto4A emphasize
              embedded, hardware, or silicon-rooted implementations. Industry summaries also show that large incumbents
              such as Thales, IBM, AWS, DigiCert, Entrust, and systems integrators are already embedding or advising on
              PQC, which means EigenQ competes both against focused startups and against bundled feature sets from much
              larger platforms. The practical buyer question is therefore not “which company does exactly the same
              thing?” but “who can get my infrastructure inventory, cryptographic controls, and trusted hardware
              migrated fastest with the least operational risk?” On that question, EigenQ’s closest rivalry is with
              vendors that combine hardware or infrastructure credibility with migration language, while the biggest
              strategic pressure comes from firms that already own security operations or procurement relationships.
            claimRefs:
