      - number: '3.4'
        title: Moat durability, incumbents, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              EigenQ’s moat case rests on three ideas: hardware-rooted trust is more durable than software-only
              overlays, OEM and public-sector partnerships accelerate credibility, and regulatory migration pressure
              rewards vendors that can retrofit long-lived infrastructure. Those are real strengths, but none is
              unchallenged. PQShield, SEALSQ, Crypto4A, and QuintessenceLabs all argue some version of hardware or
              entropy-backed differentiation. SandboxAQ, QuSecure, ISARA, and system integrators may not need the same
              hardware story if they become the control plane for migration decisions and policy reporting. Meanwhile,
              major cloud, HSM, certificate, and network incumbents can absorb PQC into products customers already buy,
              reducing the urgency of selecting a standalone vendor. The deepest adverse evidence is therefore
              commoditization risk: as NIST standards mature, some layers of PQC may become expected table stakes,
              shifting value toward distribution, integration ease, and lifecycle management. EigenQ can still win if it
              proves that hardware-rooted trust materially improves procurement, assurance, and operational outcomes.
              But if those benefits are not demonstrated in customer deployments, better-capitalized or
              better-distributed rivals can compress differentiation quickly.
