  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts for EigenQ
        blocks:
          - type: paragraph
            body: >-
              The right market frame for EigenQ is not “all quantum technology” and not even the entire cybersecurity
              stack. The closest commercial boundary is post-quantum cryptography migration for regulated digital
              infrastructure: software and hardware that replace or augment RSA/ECC-era trust functions, plus
              integration and migration services needed to deploy them. Public market reports consistently include
              software, hardware security modules or accelerators, and consulting or deployment services, but they
              differ on whether to count adjacent quantum-secure networking, migration programs, and broader
              cryptographic hardware. For EigenQ specifically, the commercially relevant segment is narrower still:
              OEM-integrated, hardware-rooted and infrastructure-oriented PQC adoption in government, defense, critical
              infrastructure, and enterprise server environments. That means the status quo is not another quantum
              startup alone; it is incumbent HSM vendors, cloud security stacks, internal build programs, and
              organizations delaying migration because the replacement cycle is expensive and complex.
