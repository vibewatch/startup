      - number: '3.3'
        title: Distribution, switching costs, and buyer power
        blocks:
          - type: paragraph
            body: >-
              Distribution power is one of the biggest underappreciated competitive variables in this market. EigenQ is
              trying to reach buyers through HPE, WNC, TD SYNNEX, Intel, and AMD-linked ecosystem motions, which could
              be powerful if they convert into qualified platforms and repeat procurement channels. But competitors are
              also pursuing leveraged access: ISARA has federal distribution via Carahsoft, SandboxAQ highlights work
              with federal agencies and large enterprises, QuSecure emphasizes partner-led enterprise deployment, and
              PQShield targets semiconductor and government programmes where design-ins can scale across many devices.
              Switching costs are mixed. Discovery and inventory platforms can become sticky because they map
              certificates, keys, and cryptographic posture across large estates, while embedded or hardware-rooted
              solutions can become sticky once they are qualified into chips, boards, firmware, or public-sector server
              bundles. That means EigenQ’s opportunity is strongest when hardware-rooted trust becomes a design
              decision, not just a software feature request. Conversely, if customers stay in a software-first migration
              phase for longer than expected, platform vendors with lower-friction discovery and remediation workflows
              may capture the budget first.
