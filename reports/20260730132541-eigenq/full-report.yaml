      - number: '7.3'
        title: Partner, people, and business-model risk
        blocks:
          - type: paragraph
            body: >-
              The company’s partner ecosystem is both the bull case and the dependency map. WNC provides manufacturing
              scale and physical module packaging, HPE is linked to public-sector server enablement, Intel and AMD
              anchor the installed-base retrofit narrative, and TD SYNNEX supports channel reach. This can accelerate
              adoption, but it also means timing, quality, and economics may depend on third parties with their own
              priorities. The customer chapter also showed that named public proof remains narrow, making channel
              concentration and signaling concentration more important than they would be in a broad, diversified
              account base. People risk matters too. The company has recently expanded leadership, which can help, but
              also indicates a business scaling into public-market readiness while still integrating commercialization,
              security leadership, and ecosystem management. Because the public record does not disclose bench depth,
              org design, or account ownership, execution risk remains high if any key leader, partner, or mission
              account slips.
