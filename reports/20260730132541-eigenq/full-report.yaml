        title: Milestones, dependencies, and near-term risks
        blocks:
          - type: paragraph
            body: >-
              EigenQ has assembled a visible sequence of milestones across partnerships, executive build-out, and the
              announced public-listing path, but the same sources also surface the company’s central diligence risks.
              The June 23 8-K explains that the merger is contingent on SEC effectiveness, shareholder approvals, and
              listing approval, with an outside date of February 14, 2027. The filing and press release both warn about
              redemptions, pricing pressure, supply-chain exposure, customer-adoption timing, OEM-integration timing,
              and general forward-looking uncertainty. Those are not boilerplate risks only: they map directly onto
              EigenQ’s business model, which depends on translating standards momentum into deployable hardware-rooted
              infrastructure through third-party platform ecosystems and channel partners. The result is a company that
              may have strong thematic timing and credible technical positioning, but whose near-term value realization
              still depends on closing the transaction, proving sell-through with public-sector and enterprise buyers,
              and turning partnership announcements into measurable revenue and customer proof after the listing process
              advances.
