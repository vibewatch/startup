  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked top risks
        blocks:
          - type: paragraph
            body: >-
              The most material risks cluster around four connected dependencies. First, transaction and financing risk
              remains high because EigenQ’s public capital story still depends on a SPAC closing with trust cash that
              can be reduced by redemptions, transaction expenses, and any need for additional financing. Second,
              product-delivery risk is meaningful because EigenQ’s commercialization narrative relies on manufacturing,
              qualification, and channel execution through WNC, HPE, Intel, AMD, and TD SYNNEX rather than through a
              fully self-contained product engine. Third, customer-proof risk is elevated because the public record
              shows only a thin set of named end-user evidence relative to the size of the valuation and the breadth of
              the go-to-market claims. Fourth, regulatory and compliance risk is manageable but nontrivial: the company
              is publicly tied to privacy-law compliance, export controls, sanctions, and federal procurement
              expectations, while the merger agreement shows those areas are important representation-and-warranty
              topics. None of these alone kills the story, but together they create a high residual-risk profile until
              closing, scale, and customer conversion are better evidenced.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
