              The strongest public proof points around EigenQ are capital framing and ecosystem alignment, not operating
              metrics. On capital, the merger documents and related releases consistently cite approximately $3.0
              billion of pro forma enterprise value and approximately $215 million in the SVAQ trust account before
              redemptions, while the business-combination agreement fixes a $2.93 billion equity consideration formula.
