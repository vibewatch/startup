      - number: '8.4'
        title: Recommendation, kill criteria, and the diligence needed to upgrade the view
        blocks:
          - type: paragraph
            body: >-
              The evidence set supports a research-more recommendation with medium confidence, high risk, and a
              stretched valuation stance. That is not a negative call on the need for quantum-safe infrastructure; it is
              a pricing call on how much verified commercial proof investors have before paying an announced
              public-market valuation comparable to better-disclosed peers. The positive case is real: EigenQ is
              positioned at the intersection of government cryptographic migration, hardware-rooted trust, sovereign
              infrastructure concerns, and a partner stack that could compress go-to-market time if real customer
              adoption follows. But the negative case is equally real: the company is asking investors to underwrite a
              multibillion-dollar value without public revenue evidence, while public quantum names already demonstrate
              how long and capital-intensive commercialization can be even after listing. The view would improve quickly
              if the S-4 discloses credible revenue, cash, margin, and conversion metrics or if named customer wins
              expand beyond isolated proof points. Until then, the right posture is disciplined optionality rather than
              conviction sizing.
            claimRefs:
