      - number: '8.3'
        title: Scenario work points to stretched base-case pricing and asymmetric diligence risk
        blocks:
          - type: paragraph
            body: >-
              Because EigenQ has not publicly disclosed revenue or margin data, scenario analysis must be explicit about
              its assumptions. In a bull case, investors assume that CNSA 2.0 and NIST-driven migration urgency convert
              partner announcements into measurable OEM and government deployments, redemptions stay manageable, and the
              company uses public capital to become the security-layer beneficiary of the broader quantum upgrade cycle.
              In that case, the announced transaction price can be defended as paying for a category platform before
              operating leverage is visible. The base case is more conservative: trust cash shrinks through redemptions,
              PQC demand materializes more slowly than promotional materials imply, and customers require long
              qualification cycles that delay conversion of ecosystem announcements into revenue. In the bear case,
              EigenQ lists into a market that has become more selective after seeing public quantum peers remain
              pre-profit for longer than expected, forcing a lower implied multiple, dilutive financing, or both. The
              common thread is that execution and disclosure quality matter more than the thematic opportunity. Without
              audited revenue, pipeline conversion data, or partner economics, the downside from false precision is
              larger than the upside from early narrative participation.
            claimRefs:
              - CV023
