  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What the announced price is asking investors to believe
        blocks:
          - type: paragraph
            body: >-
              The public record gives investors an unusually clear headline valuation and an unusually incomplete
              operating model. Across the June 2026 merger announcement, the June 23 business-combination materials, and
              the July 28 filing updates, EigenQ is consistently framed at roughly $3.0 billion of pro forma enterprise
              value with roughly $215 million in SVAQ trust cash before redemptions and expenses. That is useful for
              anchoring the entry debate, but it does not answer the central valuation question because the market still
              lacks disclosed revenue, gross margin, customer count, retention, bookings, or audited unit-economics
              detail. The closest support for the number is narrative rather than arithmetic: federal PQC migration
              pressure is real, HPE/AMD/WNC/TD SYNNEX create plausible routes to scale, and public quantum comparables
              show investors will fund technical optionality when government demand and supply-chain credibility are
              visible. The problem is that peers with public valuations are at least partially legible on revenue, cash,
              or installed systems, while EigenQ remains a pre-close SPAC target with commercialization claims but
              little disclosed operating evidence. That combination argues for treating the announced valuation as a
              negotiation point and market signal, not as fair value proven by the public record.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: Public comparables support the theme but not a price-insensitive entry
        blocks:
          - type: paragraph
            body: >-
              The most relevant public references split into two groups. The first group is quantum-computing leaders
              such as IonQ, D-Wave, and Rigetti, which are not perfect business-model matches but show what the market
              pays for technical momentum, government credibility, and early revenue. IonQ has become the sector's
              revenue leader, while D-Wave and Rigetti remain much smaller but still benefit from strategic program wins
              and public-market optionality. The second group is post-quantum or quantum-security names such as Arqit
              and SEALSQ, which are closer to EigenQ's security narrative but operate with different product
              architectures and capital-market histories. These comparables support the idea that quantum and PQC
              infrastructure can command billion-dollar equity narratives before mature profitability. They do not prove
              that EigenQ deserves an immediate ~$3 billion mark. Instead, they show that the market rewards proof
              density: disclosed revenue, visible government programs, technical milestones, or a repeatable commercial
              wedge. EigenQ has strong policy alignment and partner packaging, but relative to peers the evidence gap is
              still wider than the valuation gap.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
