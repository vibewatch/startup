  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and core offer
        blocks:
          - type: paragraph
            body: >-
              EigenQ presents itself as an applied quantum technology company whose near-term commercialization is
              centered on post-quantum cybersecurity rather than speculative fault-tolerant computing. The company says
              its platform combines quantum-generated entropy, hardware-rooted identity and execution controls, and a
              post-quantum cryptographic software layer that can be integrated into existing infrastructure without a
              full redesign. The public-company story is now anchored by the June 17, 2026 announcement of a definitive
              business combination with Silicon Valley Acquisition Corp. That deal values EigenQ at approximately $3.0
              billion enterprise value, references $215 million of cash in the SPAC trust before redemptions and
              expenses, and targets a Q4 2026 close subject to SEC effectiveness, shareholder approval, and
              exchange-listing conditions. In public positioning, EigenQ is not marketing a single box; it is marketing
              a trust infrastructure stack for government, defense, critical infrastructure, and enterprise environments
              that must adapt to NIST post-quantum standards and CNSA 2.0 migration pressure.
