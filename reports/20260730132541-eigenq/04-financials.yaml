callouts:
  - calloutType: insight
    title: Public evidence is strongest on capital destination, weakest on current operating metrics
    body: Reviewed sources consistently explain what new capital is intended to fund, but they do not provide the revenue, cash, or margin disclosures needed to test whether that plan is financially efficient.
    claimRefs: [CI003, CI013, CI018, CI036]
  - calloutType: risk
    title: Trust cash is meaningful but not equivalent to assured post-close liquidity
    body: The transaction highlights roughly $215 million in trust support, yet filings make clear that redemptions, expenses, and adjustments can reduce the capital actually available to EigenQ.
    claimRefs: [CI002, CI021, CI022, CI029]
  - calloutType: recommendation
    title: Ask for a real bridge from design wins to booked revenue
    body: Before underwriting the business, investors should request product-by-product revenue, margin, backlog, and partner-term schedules showing how channel announcements convert into recognized cash flow.
    claimRefs: [CI014, CI030, CI031, CI036]
