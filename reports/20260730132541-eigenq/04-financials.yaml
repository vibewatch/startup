  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-revenue-and-arr
      missingEvidence: Exact trailing-twelve-month revenue, ARR if any, and revenue mix by hardware, software, and services.
      whyItMatters: Revenue quality and valuation cannot be normalized without period revenue and mix.
      diligencePath: Request audited or management monthly revenue bridge with channel and product breakout.
      relatedQuestionRefs: [QI022]
    - type: private-evidence-only
      severity: material
      topic: current-cash-and-burn
      missingEvidence: Current unrestricted cash, monthly burn by function, and runway under base and downside cases.
      whyItMatters: Trust-account proceeds do not replace target-company cash and burn visibility.
      diligencePath: Request 24 months of cash balances, burn history, and board runway materials.
      relatedQuestionRefs: [QI021]
    - type: private-evidence-only
      severity: material
      topic: gross-margin-and-channel-economics
      missingEvidence: Product BOM, manufacturing terms, distributor margins, warranty burden, and blended gross margin.
      whyItMatters: Hardware-heavy commercialization can fail economically even when demand exists.
      diligencePath: Request product-level gross-margin bridge and major partner commercial terms.
    - type: missing-source
      severity: material
      topic: redemption-and-pipe-sensitivity
      missingEvidence: Publicly disclosed PIPE amount, minimum-cash covenant, and redemption sensitivity model.
      whyItMatters: Available post-close liquidity could diverge sharply from the headline trust amount.
      diligencePath: Review full S-4 cash-condition disclosures and financing side letters when available.
    - type: private-evidence-only
      severity: material
      topic: backlog-and-design-win-conversion
      missingEvidence: Signed backlog, shipment schedule, design-win counts, and conversion rates from partner pathways to booked revenue.
      whyItMatters: Public partner announcements alone do not prove near-term monetization.
      diligencePath: Request sales pipeline report, design-win tracker, and order-conversion history.
