  - id: TI003
    title: Unit economics table
    columns: [Metric, Public value or proxy, Confidence, Why it matters, Diligence ask]
    rows:
      - [Customer acquisition cost, 'Not disclosed; partner-led enterprise motion implies high-touch selling', Medium, 'Determines whether channel leverage offsets long sales cycles', 'Request CAC by direct and partner-sourced account']
      - [Payback period, 'Not disclosed', Low, 'Tests whether hardware and services margins recover acquisition and integration costs quickly enough', 'Request payback by product family and deployment type']
      - [Gross margin, 'Not disclosed; likely lower than pure software because of hardware and manufacturing content', Medium, 'Core driver of whether scale-up creates operating leverage', 'Request blended and product-level gross margin history']
      - [Support and deployment burden, 'Not disclosed; likely meaningful in regulated environments', Medium, 'High support intensity can dilute hardware and software economics', 'Request field-deployment labor, warranty, and support cost per account']
      - [Channel economics, 'Not disclosed; partner distribution likely shares value with OEMs and distributors', Medium, 'Needed to judge realized ASP and contribution margin', 'Request distributor discounts, MDF, and partner-margin schedules']
    notes: Every metric above is material because the public record provides commercialization evidence but not the numbers needed to normalize it.
    claimRefs: [CI014, CI015, CI016, CI030, CI031, CI032]
  - id: TI004
    title: Capital adequacy table
    columns: [Capital factor, Public evidence, Current status, Why it matters, Diligence ask]
    rows:
      - ['Headline enterprise value', 'Approximately $3B pro forma EV', 'Announced', 'Frames valuation expectations but does not equal operating cash', 'Request cap table, share-count math, and dilution bridge']
      - ['Trust cash support', 'Approximately $215M in SVAQ trust before redemptions and expenses', 'Announced but contingent', 'Primary publicly named cash source for scale-up', 'Request minimum-cash condition and redemption sensitivity']
      - ['Use of proceeds', 'Commercialization, manufacturing scale-up, strategic partnerships, and expansion', 'Narrative only', 'Determines whether proceeds fund revenue conversion or diffuse roadmap sprawl', 'Request board-approved use-of-funds plan by workstream']
      - ['Additional financing visibility', 'No reviewed public disclosure of PIPE amount or debt facility', 'Unclear', 'Trust erosion without backstop could compress available cash materially', 'Request PIPE commitments, debt terms, and standby financing']
      - ['Shareholder behavior', 'Existing EigenQ shareholders expected to roll substantially all equity; no material cash-out expected', 'Supportive but non-cash', 'Alignment helps, but does not replace operating liquidity', 'Request lock-up terms and post-close ownership schedule']
    notes: The transaction capital story is directionally supportive, but final cash availability remains highly sensitive to factors not yet publicly reconciled.
    claimRefs: [CI001, CI002, CI003, CI018, CI019, CI020, CI021, CI028, CI029]
  - id: TI005
    title: Public financial gaps table
    columns: [Missing metric, Why absence matters, Public proxy today, Exact diligence path]
    rows:
      - [Current revenue or ARR, 'Prevents revenue-quality underwriting and forward multiple comparison', 'Only commercialization language and partner pathways are public', 'Request last 8 quarters of revenue by product, channel, and geography']
      - [Current cash and monthly burn, 'Runway and dilution risk cannot be modeled', 'Trust account is disclosed, target cash is not', 'Request month-end cash balances and 24-month burn history']
      - ['Gross margin by hardware, software, and services', 'Impossible to judge unit economics or scale leverage', 'Hardware-heavy narrative implies margin complexity', 'Request gross-margin bridge by revenue stream']
      - ['Backlog, design wins, and order conversion', 'Pipeline credibility cannot be linked to near-term revenue timing', 'Public partner announcements describe pathways, not orders', 'Request signed backlog, forecast conversion, and cancellation history']
      - [Redemption and PIPE sensitivity, 'Headline trust support may overstate post-close liquidity', 'Filings mention redemptions and adjustments but not final cash floor here', 'Request minimum-cash covenant, PIPE docs, and downside liquidity model']
    notes: These gaps are specific blockers to underwriting, not generic requests for “more data.”
    claimRefs: [CI013, CI022, CI027, CI028, CI029, CI036]
