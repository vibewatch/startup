  claims:
    - {id: CV001, statement: 'The announced business combination values EigenQ at approximately $3.0 billion of pro forma enterprise value.', type: observed, topic: valuation, sourceRefs: [SV001, SV002, SV024], confidence: high, freshness: current, answersQuestionRefs: [QV001]}
    - {id: CV002, statement: 'The business-combination materials describe an equity consideration formula of about $2.93 billion underlying the transaction mechanics.', type: observed, topic: transaction-structure, sourceRefs: [SV002, SV004], confidence: high, freshness: current, answersQuestionRefs: [QV001]}
    - {id: CV003, statement: 'Public announcement materials cite approximately $215 million in SVAQ trust cash before shareholder redemptions and transaction expenses.', type: observed, topic: closing-cash, sourceRefs: [SV001, SV002, SV024], confidence: high, freshness: current, answersQuestionRefs: [QV002, QV020]}
    - {id: CV004, statement: 'The transaction had not yet closed as of 2026-07-30 and remained subject to SEC effectiveness, shareholder approvals, and other closing conditions.', type: observed, topic: closing-status, sourceRefs: [SV003, SV004, SV005, SV006], confidence: high, freshness: current, answersQuestionRefs: [QV003, QV025, QV026]}
    - {id: CV005, statement: 'EigenQ is positioned publicly as quantum-safe infrastructure built around hardware-rooted trust and post-quantum cryptography rather than only long-horizon fault-tolerant compute.', type: company-claimed, topic: positioning, sourceRefs: [SV007, SV008, SV001], confidence: high, freshness: current, answersQuestionRefs: [QV007, QV024]}
    - {id: CV006, statement: 'The public record reviewed for this chapter does not disclose EigenQ revenue, ARR, gross margin, or retention metrics sufficient for a conventional multiple analysis.', type: observed, topic: disclosure-gap, sourceRefs: [SV001, SV002, SV003], confidence: high, freshness: current, answersQuestionRefs: [QV005, QV023, QV028]}
    - {id: CV007, statement: 'NIST continues to maintain the federal post-quantum cryptography project as a live standards transition effort.', type: observed, topic: policy-tailwind, sourceRefs: [SV012], confidence: medium, freshness: current, answersQuestionRefs: [QV006]}
    - {id: CV008, statement: 'CISA has published 2026 guidance directing product categories and technologies toward use of PQC standards.', type: observed, topic: policy-tailwind, sourceRefs: [SV013], confidence: medium, freshness: current, answersQuestionRefs: [QV006]}
    - {id: CV009, statement: 'EigenQ has public partner pathways through WNC, HPE, AMD, and TD SYNNEX that could shorten manufacturing or distribution cycles if demand converts.', type: company-claimed, topic: distribution, sourceRefs: [SV009, SV010, SV011], confidence: medium, freshness: current, answersQuestionRefs: [QV007]}
    - {id: CV010, statement: 'Because the trust figure is pre-redemption, usable closing cash can be materially lower than the headline number.', type: inferred, topic: redemption-risk, sourceRefs: [SV002, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV020]}
    - {id: CV011, statement: 'S&P Global Market Intelligence reports that IonQ generated about $130 million of revenue in 2025.', type: third-party-reported, topic: comp-revenue, sourceRefs: [SV014, SV016], confidence: high, freshness: recent, answersQuestionRefs: [QV009]}
    - {id: CV012, statement: 'S&P Global Market Intelligence cites consensus expectations for IonQ revenue of about $270 million in 2026.', type: third-party-reported, topic: comp-revenue, sourceRefs: [SV014], confidence: medium, freshness: recent, answersQuestionRefs: [QV010]}
    - {id: CV013, statement: 'S&P Global Market Intelligence reports D-Wave revenue of about $25 million in 2025 and a 2026 forecast near $44 million.', type: third-party-reported, topic: comp-revenue, sourceRefs: [SV014], confidence: medium, freshness: recent, answersQuestionRefs: [QV011]}
    - {id: CV014, statement: 'S&P Global Market Intelligence reports Rigetti revenue of about $7 million in 2025 and a 2026 forecast near $24 million.', type: third-party-reported, topic: comp-revenue, sourceRefs: [SV014], confidence: medium, freshness: recent, answersQuestionRefs: [QV012]}
    - {id: CV015, statement: 'Public quantum comparables demonstrate that public markets will fund frontier quantum narratives even while near-term revenue remains relatively small.', type: inferred, topic: market-tolerance, sourceRefs: [SV014, SV015, SV016, SV018], confidence: medium, freshness: current, answersQuestionRefs: [QV008, QV013, QV029]}
    - {id: CV016, statement: 'IonQ, D-Wave, and Rigetti are relevant comparables for EigenQ because they show how government credibility and technical milestones interact with early public-market valuation.', type: inferred, topic: comparable-set, sourceRefs: [SV014, SV016, SV019, SV020, SV021], confidence: medium, freshness: current, answersQuestionRefs: [QV008]}
    - {id: CV017, statement: 'Arqit is a relevant security-side comparable because it sells quantum-safe encryption services rather than quantum-compute hardware.', type: observed, topic: comparable-set, sourceRefs: [SV018, SV023, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV014]}
    - {id: CV018, statement: 'SEALSQ is a meaningful hardware-rooted PQC analogue because its public messaging centers on post-quantum secure elements and regulation-driven demand.', type: observed, topic: comparable-set, sourceRefs: [SV018, SV022, SV030], confidence: medium, freshness: current, answersQuestionRefs: [QV015]}
    - {id: CV019, statement: 'The Quantum Insider describes post-quantum cryptography companies as nearer-term business opportunities than pure compute platforms because they address current cybersecurity budgets.', type: third-party-reported, topic: monetization-timing, sourceRefs: [SV018], confidence: medium, freshness: recent, answersQuestionRefs: [QV024]}
    - {id: CV020, statement: 'The same comparable set does not prove that EigenQ deserves a full ~$3 billion valuation today because better-known peers disclose more operating detail.', type: inferred, topic: valuation-support, sourceRefs: [SV014, SV016, SV018], confidence: medium, freshness: current, answersQuestionRefs: [QV016]}
    - {id: CV021, statement: 'The Quantum Insider cites IonQ at roughly $22 billion of market capitalization as of October 2025, illustrating how large valuation dispersion already exists inside public quantum names.', type: third-party-reported, topic: market-cap-dispersion, sourceRefs: [SV018], confidence: medium, freshness: historical, answersQuestionRefs: [QV029]}
    - {id: CV022, statement: 'The Quantum Insider also notes that most quantum public companies remain pre-profit even when valuations reach billions.', type: third-party-reported, topic: profitability-gap, sourceRefs: [SV018], confidence: medium, freshness: recent, answersQuestionRefs: [QV013]}
    - {id: CV023, statement: 'A bull-case defense of EigenQ at the announced valuation requires partner pathways to convert into named deployments and revenue faster than the current public proof set shows.', type: inferred, topic: bull-case, sourceRefs: [SV009, SV010, SV011, SV019], confidence: medium, freshness: current, answersQuestionRefs: [QV017]}
    - {id: CV024, statement: 'The base case is that valuation should be discounted below the headline transaction value until audited operating disclosures appear.', type: estimated, topic: base-case, sourceRefs: [SV006, SV014, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV018, QV028]}
    - {id: CV025, statement: 'A realistic base case also assumes partner announcements still need long qualification and procurement cycles before showing up in revenue.', type: inferred, topic: commercialization-timing, sourceRefs: [SV010, SV011, SV013], confidence: medium, freshness: current, answersQuestionRefs: [QV018, QV024]}
    - {id: CV026, statement: 'A bear case includes the possibility that quantum and PQC multiples compress while EigenQ is still early in commercialization.', type: inferred, topic: bear-case, sourceRefs: [SV017, SV018], confidence: medium, freshness: current, answersQuestionRefs: [QV019]}
    - {id: CV027, statement: 'If the company lists without meaningful new disclosures, future financing could occur at terms less attractive than the headline transaction framing implies.', type: inferred, topic: dilution-risk, sourceRefs: [SV002, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV019, QV020]}
    - {id: CV028, statement: 'The current public record does not support a precise target return because both entry price discovery and normalized operating metrics are missing.', type: observed, topic: target-return-discipline, sourceRefs: [SV001, SV002, SV006], confidence: high, freshness: current, answersQuestionRefs: [QV028]}
    - {id: CV029, statement: 'Quantum-computing SPAC history shows that public-market access can arrive before durable commercialization is proven.', type: third-party-reported, topic: spac-history, sourceRefs: [SV016, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV029]}
    - {id: CV030, statement: 'Entangled Future highlights PIPE size, closing cash, and long-term forecast assumptions as core diligence items for SPAC-era quantum listings.', type: third-party-reported, topic: diligence-framework, sourceRefs: [SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV022]}
    - {id: CV031, statement: 'Post-listing monitoring should focus immediately on closing cash, named customer additions, and whether partner pathways generate observable orders.', type: inferred, topic: monitoring, sourceRefs: [SV003, SV009, SV011, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV027]}
    - {id: CV032, statement: 'The most important diligence asks remain revenue bridge, cap-table and redemption sensitivity, partner economics, and customer conversion evidence.', type: inferred, topic: diligence-asks, sourceRefs: [SV002, SV017, SV018], confidence: medium, freshness: current, answersQuestionRefs: [QV022, QV030]}
    - {id: CV033, statement: 'The evidence in this chapter supports a research-more recommendation rather than buy or track.', type: estimated, topic: recommendation, sourceRefs: [SV006, SV017, SV018, SV024], confidence: medium, freshness: current, answersQuestionRefs: [QV021]}
    - {id: CV034, statement: 'Confidence should remain medium because transaction terms are concrete but commercial metrics are still largely undisclosed.', type: estimated, topic: confidence, sourceRefs: [SV001, SV002, SV006], confidence: medium, freshness: current, answersQuestionRefs: [QV021]}
    - {id: CV035, statement: 'Risk rating should remain high because underwriting still depends heavily on successful SPAC close, partner conversion, and future disclosure quality.', type: estimated, topic: risk-rating, sourceRefs: [SV002, SV004, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV021]}
    - {id: CV036, statement: 'Valuation stance should remain stretched because the announced headline value outruns the current public evidence base.', type: estimated, topic: valuation-stance, sourceRefs: [SV001, SV006, SV014, SV018], confidence: medium, freshness: current, answersQuestionRefs: [QV021]}
    - {id: CV037, statement: 'An upgrade toward track would require audited revenue disclosure plus more than one clearly named customer or deployment reference.', type: inferred, topic: upgrade-path, sourceRefs: [SV003, SV006, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV021, QV030]}
    - {id: CV038, statement: 'A true buy case would require evidence that EigenQ can monetize PQC migration faster than public quantum peers monetized compute demand.', type: inferred, topic: buy-threshold, sourceRefs: [SV014, SV018, SV019, SV020], confidence: medium, freshness: current, answersQuestionRefs: [QV021, QV024]}
    - {id: CV039, statement: 'Exit readiness is improving because July 2026 filing cadence shows active transaction progress, but public evidence is still insufficient for conviction sizing.', type: inferred, topic: exit-readiness, sourceRefs: [SV003, SV005, SV006], confidence: medium, freshness: current, answersQuestionRefs: [QV025, QV026]}
    - {id: CV040, statement: 'The main unresolved blocker to conviction is not absence of thematic demand but absence of auditable commercialization evidence.', type: inferred, topic: unresolved-gap, sourceRefs: [SV006, SV012, SV013, SV018], confidence: medium, freshness: current, answersQuestionRefs: [QV030]}
  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: audited-revenue-and-bookings
      missingEvidence: Audited TTM revenue, bookings, revenue mix, and customer concentration.
      whyItMatters: Without operating output, the announced valuation cannot be normalized against commercial traction.
      diligencePath: Review final S-4 financial statements and request monthly revenue bridge.
      relatedQuestionRefs: [QV005, QV022, QV030]
    - type: private-evidence-only
      severity: material
      topic: cash-sources-uses-and-dilution
      missingEvidence: Redemption sensitivity, PIPE or side financing, warrant dilution, and sources-and-uses table.
      whyItMatters: Headline trust cash can differ materially from usable growth capital after closing mechanics.
      diligencePath: Request transaction model and pro forma cap table.
      relatedQuestionRefs: [QV020, QV022, QV027]
    - type: private-evidence-only
      severity: material
      topic: partner-economics
      missingEvidence: OEM/distributor economics, gross margin by route, and qualification cost burden.
      whyItMatters: Partner-led growth can produce scale without attractive unit economics.
      diligencePath: Review commercial agreements and margin bridge under NDA.
      relatedQuestionRefs: [QV023, QV024]
    - type: missing-source
      severity: material
      topic: customer-expansion-proof
      missingEvidence: Additional named customer deployments with contract scope, timing, and renewal evidence.
      whyItMatters: The valuation narrative relies on conversion from partner announcements to real production demand.
      diligencePath: Seek customer references, deployment counts, and post-close case studies.
      relatedQuestionRefs: [QV024, QV027, QV030]
      relatedTableRefs: [TV004]
    - type: private-evidence-only
      severity: material
      topic: precise-return-framework
      missingEvidence: Management forecast, terminal margin assumptions, and credible share-count / dilution model.
      whyItMatters: Price target and target return precision would otherwise be false confidence.
      diligencePath: Build scenario model only after audited forecasts and dilution terms are available.
      relatedQuestionRefs: [QV028]
