callouts:
  - calloutType: recommendation
    title: Recommendation
    body: Research-more. EigenQ has real category tailwinds and credible distribution partners, but public evidence still does not justify underwriting the announced ~$3 billion valuation as fair value.
    claimRefs: [CV001, CV005, CV006, CV033]
  - calloutType: risk
    title: Core downside
    body: The biggest downside is not technology irrelevance; it is paying a public-market price before audited revenue, gross margin, and customer-conversion evidence are visible.
    claimRefs: [CV006, CV024, CV035]
  - calloutType: insight
    title: Best supporting argument
    body: EigenQ's security-led positioning is closer to present-day buyer budgets than a pure fault-tolerant computing story, which is why the company deserves monitoring even if the price is not yet investable.
    claimRefs: [CV005, CV019, CV033]
  - calloutType: assumption
    title: Key underwriting assumption
    body: Any defense of the announced transaction value requires believing that partner announcements convert into measurable deployment and revenue faster than the sparse public proof set currently shows.
    claimRefs: [CV023, CV025, CV032]
