evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding-history
    missingEvidence: A full pre-SPAC funding history, investor roster, and total capital raised before the merger announcement.
    whyItMatters: >-
      Without historical financing disclosure, it is hard to judge step-up valuation, insider markups, and dilution risk
      into the public transaction.
    diligencePath: >-
      Review the registration statement and any investor presentation for cap-table history, private placements, PIPE,
      and founder ownership details.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, ARR, gross margin, customer count, headcount, and backlog metrics.
    whyItMatters: >-
      These figures are necessary to underwrite whether the announced valuation is supported by commercial traction or
      remains primarily thematic.
    diligencePath: Pull S-4 operating and forecast disclosures, management discussion, and any investor deck tables once available.
    relatedQuestionRefs:
      - QO023
      - QO025
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board committee composition, director independence, and governance-control disclosures for the post-close company.
    whyItMatters: >-
      Governance maturity matters because EigenQ is transitioning from private-company communications to public-market
      accountability.
    diligencePath: >-
      Review the registration statement, proxy, and post-listing governance exhibits for committee charters and board
      biographies.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: operating-footprint
    missingEvidence: Verified list of offices, engineering sites, and manufacturing or integration locations.
    whyItMatters: Location footprint helps assess operating scale, security posture, and talent concentration.
    diligencePath: Request a management org chart, location list, and key facility descriptions during management sessions.
    relatedQuestionRefs:
      - QO025
  - type: stale
    severity: minor
    topic: partner-conversion
    missingEvidence: >-
      Proof that public partnership announcements have converted into shipped programs, customer deployments, or
      recurring revenue after announcement dates.
    whyItMatters: Announcements alone do not prove demand or monetization.
    diligencePath: >-
      Ask for named deployments, booking contribution by partner channel, and qualification or pilot-to-production
      conversion rates.
    relatedTableRefs:
