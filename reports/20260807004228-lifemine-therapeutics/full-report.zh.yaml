            body: >-
              LifeMine 还不是通常意义上拥有付费商业客户的公司。它目前真实世界外部采用证据来自三个地方：人体试验参与、GSK 这样的战略交易对手， 以及未来移植中心买方的可见集合；如果数据变得有说服力，这些买方会评估
              LIFE-001。买方、用户和支付方的拆分很重要。 患者是终端用户，但实际客户是移植中心、移植肾脏科医生和外科医生、医院药房，以及决定哪套抗排斥方案进入护理流程的方案委员会。
              支付方重要，但它们位于高度专业化机构工作流的下游。因此，LifeMine 的客户章节最好被读成一张集中未来买方系统地图， 再叠加一层很薄的当前验证。
