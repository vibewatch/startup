      - number: '2.3'
        title: 买方、用户与支付方地图
        blocks:
          - type: paragraph
            body: >-
              移植市场参与者很多，但并不分散。下一代钙调神经磷酸酶抑制剂的终端用户，是受者及其临床团队；真正买单和定方案的是移植中心、
              药事委员会、移植外科医生、肾脏科医生，以及制定方案选择的医院专科药师。支付方重要，但其角色要穿过中心方案和指南驱动的移植实践。 Drugs.com 专业专论强调，tacrolimus
              选择已经会随移植器官、中心特定方案、医生经验、保险与成本问题、患者耐受性而变化。 因此，采用路径不是面向大众的初级保健，而是拿证据驱动的重点账户销售，卖进有限数量的高度专业机构。这种集中度是一把双刃剑。
              好处是，如果临床数据足够有说服力，一支小型商业团队就能覆盖市场；坏处是，少数持怀疑态度的中心、保守的移植共识，或方案适配不佳， 都可能实质性拖慢采用。
