      - CR002
      - CR018
      - CR021
      - CR029
      - CR036
  - id: FR004
    title: 不利里程碑时间线
    type: timeline
    summary: 关键不利或脆弱里程碑显示，少数事件为何能不成比例地改变公司的风险画像。
    data:
      items:
        - date: 2022-03
          label: GSK 验证到来
          detail: 有利的战略信号，但不是永久保护。
          tone: positive
          claimRefs:
            - CR020
        - date: 2025-03
          label: 裁员与整合
          detail: 资本压力浮出水面。
          tone: negative
          claimRefs:
            - CR015
        - date: 2025-04
          label: 首位受试者给药
          detail: 科学风险从临床前转向人体转化。
          tone: warning
          claimRefs:
            - CR001
        - date: 2026-07/08
          label: Series E 轮资本重组
          detail: 近期生存风险下降，但压力转向执行。
          tone: positive
          claimRefs:
            - CR014
            - CR028
        - date: 2027-plan
          label: 移植研究
          detail: 延迟或数据疲软会同时打击价值和融资议价能力。
          tone: warning
          claimRefs:
            - CR002
            - CR035
    claimRefs:
      - CR001
      - CR002
      - CR014
      - CR015
      - CR020
      - CR028
      - CR035
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: LifeMine 有足够科学和融资信号留在名单上，但价格发现和临床证据还不足以支持买入。
    data:
      nodes:
        - id: n1
          label: 差异化真菌平台
        - id: n2
          label: 2026 年大额融资重启
        - id: n3
          label: 单一 1 期资产集中
        - id: n4
          label: 投后估值 / 条款不透明
        - id: n5
          label: 高风险 + 价格发现弱
        - id: n6
          label: 建议：观察 / 跟踪
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: null
    claimRefs:
      - CV007
      - CV008
      - CV036
      - CV037
      - CV038
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 只有多件事同时走对，估值才会进入类似独角兽的区间；基准情形不需要这种乐观假设。
    data:
      items:
        - label: 公开移植可比标的下限
          value: 0.26
        - label: 二级市场估值标记
          value: 0.47
        - label: 基准情形高端
          value: 0.7
        - label: 乐观情形低端
          value: 0.9
        - label: 乐观情形上限
          value: 1.3
    approximationNotes: 数值单位为十亿美元，代表留存公开证据加情景判断给出的锚点，不是管理层指引。
    claimRefs:
      - CV009
      - CV030
      - CV032
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基准情形集中在数亿美元中段；类似独角兽的结果是真实上行情形，而非默认假设。
    data:
      items:
        - label: 悲观
          low: 0.15
          mid: 0.22
          high: 0.3
          unit: USD B
          detail: 转化乏力且融资承压。
        - label: 基准
          low: 0.4
          mid: 0.55
          high: 0.7
          unit: USD B
          detail: 临床期权价值保住，但不应给过高溢价。
        - label: 乐观
          low: 0.9
          mid: 1.1
          high: 1.3
          unit: USD B
          detail: 数据干净、移植牵引可见，并获得更广平台信用。
    approximationNotes: 区间是根据留存融资证据、公开可比公司和阶段风险综合出的判断带，不是 DCF。
    claimRefs:
      - CV030
      - CV031
      - CV032
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 差异化和资本获取能力得分较高，但估值支撑、披露质量和商业证据仍弱。
    data:
      items:
        - label: 科学差异化
          value: 7
        - label: 资本获取能力
          value: 8
        - label: 当前临床证据
          value: 3
        - label: 商业可见度
          value: 3
        - label: 护城河清晰度
          value: 5
        - label: 估值支撑
          value: 3
        - label: 证据质量
          value: 4
    approximationNotes: 分数是基于留存证据综合出的 0-10 序数型尽调判断，不是管理层 KPI。
    claimRefs:
      - CV004
      - CV007
      - CV022
      - CV023
      - CV034
      - CV035
      - CV039
