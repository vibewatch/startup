      - 关键假设
      - 隐含估值
      - 决策信号
      - 主要失效风险
    rows:
      - - 乐观
        - Phase 1 安全性 / PK 足够干净；移植疗效路径开始看得见；平台拿出后续资产或合作经济性
        - $0.9B-$1.3B
        - 只有新证据扎实、条款不带惩罚性时，才考虑参与
        - 临床转化失败，或平台重启烧掉过多资本
      - - 基准
        - Phase 1 保住期权价值；移植项目继续推进；平台仍有一些溢价，但只是次要因素
        - $0.4B-$0.7B
        - 只有入场价格克制、条款更透明时，才值得看
        - 资本市场挑剔，证据出现前就被迫稀释
      - - 悲观
        - 数据不及预期、时间表滑坡，或融资条款暴露谈判筹码弱
        - $0.15B-$0.3B
        - 避免参与，或要求困境交易式保护
        - 单一资产集中度与宏观融资挑剔叠加
    notes: 这些区间来自公开可比标的、阶段风险和已留存融资证据，是分析判断带，不是管理层给出的模型。
