      - number: '8.5'
        title: 建议：在证据基础或入场价格改善前，保持观察/跟踪
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，正确建议是观察/跟踪，而不是买入，原因具体落在估值敏感性上。LifeMine 有足够科学差异化和融资渠道，值得继续关注；
              但公开定价发现和临床风险出清还不够，无法支撑在溢价估值上做新的高确信承诺。本判断的信心只有中等，因为缺失变量——D/E 轮条款、 当前现金跑道、完整 1 期安全性/PK
              细节、具名移植中心路线图，以及战略关系的确切经济安排——都可能显著改变价值。因此风险评级应维持高位。 若要明显上调，需要三项中的某种组合：披露的入场价格接近基准区间中部；人体数据干净且可由独立方复核；有证据表明
              LifeMine 能跳出单资产故事，同时不重演 2025 年重置前的聚焦问题。如果公司在没有新证据的情况下寻求或暗示高于乐观情形门槛的价格，
              或下一轮融资结果对新钱设置了很重结构，就应下调至避开。这家公司应留在看板上，而不是追进去。
