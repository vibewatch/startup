      - number: '7.2'
        title: 移植免疫抑制里的监管和安全风险格外苛刻
        blocks:
          - type: paragraph
            body: >-
              移植场景把安全性门槛拉得很高。DailyMed 的 Prograf 标签警示恶性肿瘤和严重感染风险；FDA 继续借助真实世界证据路径支持 tacrolimus
              标签演进；保留的综述也把肾毒性、神经毒性和长期恶性肿瘤暴露列为钙调神经磷酸酶抑制剂或更广义免疫抑制实践中的真实风险。这给 LifeMine 带来一个悖论：一方面，现有药物毒性给公司留下真实切口，只要
              LIFE-001 确实更安全；另一方面，同一段历史也意味着监管方、研究者和移植中心很可能要求持久证据，
              证明任何新药在不削弱移植物保护的前提下改善安全性。这个类别里的机制新药不会因为听起来更好就拿到更低门槛；相反，它多半继承了更高举证责任。
            claimRefs:
