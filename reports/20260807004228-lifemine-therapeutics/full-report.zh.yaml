      - number: '7.3'
        title: 客户群高度集中，商业风险也集中
        blocks:
          - type: paragraph
            body: >-
              LifeMine 的市场集中度既有战略吸引力，也有运营风险。管理层和公开移植体系来源都指向一个买方格局：相对少数移植中心掌握需求。数据够强时，
              这种格局支持聚焦覆盖；但只要少数中心持怀疑态度，采用节奏就可能明显放慢。当前客户叙事还叠加风险：没有具名生产客户，没有公开灯塔研究点， 也没有披露的商业化基础设施。竞争和工作流风险进一步放大问题。Eledon
              在移植专属创新上走得更远，CareDx 和 Natera 则说明移植中心已经嵌在成熟监测生态里。LifeMine 面对的不只是科学风险，还有临床方案转换风险。
