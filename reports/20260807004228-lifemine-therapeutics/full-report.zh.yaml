        title: 收入架构：靠资本支持，不靠产品支持
        blocks:
          - type: paragraph
            body: >-
              LifeMine 目前应被视为一家消耗资本的研发公司，而不是一家拥有收入质量的运营公司。保留来源没有披露产品销售、经常性合作收入或资助收入。 公开的是资本栈：venture 融资、2022 年 GSK
              的战略股权和合作支持，以及后来围绕 LIFE-001 在 2025-2026 年完成的融资重启。
              这意味着，公司近期经济性取决于它把融资转化为临床证据的效率，而不是它今天如何定价或销售产品。最现实的未来收入路径也取决于阶段，
              而不是当前收入：更多对外授权或合作、来自合作方的里程碑经济，或只有在移植数据足够强、足以支撑上市团队建设时才进行直接商业化。
