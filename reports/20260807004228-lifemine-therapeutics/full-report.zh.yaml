  - id: TV001
    title: 建议摘要表
    columns:
      - 类别
      - 评估
    rows:
      - - 建议
        - 观察 / 跟踪；仅凭公开证据，不应按无瑕疵买入机会立项
      - - 置信度
        - 中低
      - - 风险评级
        - 高
      - - 估值立场
        - 超过 ~0.7B 便偏高；只有真实进入条款接近 ~0.4B-0.7B，才算大致合理
      - - 决策含义
        - 投入新资金前，等待更清晰的价格发现、条款清单透明度或更强人体数据
      - - 最相关公开可比公司
        - Eledon，约 $0.26B，因为它同样是移植疗法逻辑
      - - 为何不直接用 CareDx / Natera
        - 它们反映商业化移植工作流和诊断规模，LifeMine 目前还不具备
      - - 上调触发点
        - 干净的 1 期数据包，加上可见的移植疗效路径，以及接近基础情景区间中点的进入价格
      - - 下调触发点
        - 定价激进、超过乐观情景逻辑；数据疲弱；或结构化条款让新资金劣后
    notes: 该建议明确对价格敏感。公司质量和投资吸引力在这个阶段不是一回事。
