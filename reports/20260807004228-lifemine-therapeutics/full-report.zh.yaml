        title: LIFE-001 是必须验证平台的技术楔子
        blocks:
          - type: paragraph
            body: >-
              管线页面把发现引擎落到一个具体产品主张上：LIFE-001 是一种结构和机制都新颖、保器官、不依赖免疫亲和素的钙调神经磷酸酶激活抑制剂，
              采用长效注射给药。公司发布来源称，该分子直接靶向钙调神经磷酸酶，而不是依赖免疫亲和素伴侣；设计目标是避开 cyclosporine、voclosporin 和 tacrolimus
              等传统钙调神经磷酸酶抑制剂带来的器官损伤。 从产品技术角度看，这很重要，因为 LifeMine 不是只提供一个新的筛选命中物；它宣称有一条新路径，可以保留钙调神经磷酸酶生物学，
              同时摆脱旧类别的机制包袱。开放来源中的技术问题，不是概念是否有意思——它显然有——而是这种直接结合、长效、保器官设计， 在人体药理和移植使用中是否仍成立。
