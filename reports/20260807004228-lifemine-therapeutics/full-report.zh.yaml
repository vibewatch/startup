  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 投后估值与优先权结构
        - D/E 轮确切估值、股数、优先权顺位、参与权和棘轮
        - 私募轮里，入场经济性可能压过公司质量
        - 索取条款清单、股权结构表和附函摘要
      - - 现金跑道与消耗
        - 当前现金、消耗和基于里程碑的跑道桥接
        - 决定 LifeMine 能否在不被迫稀释的情况下跑到价值拐点数据
        - 索取董事会批准的经营计划和月度消耗摘要
      - - 完整 Phase 1 数据包
        - 颗粒度安全性、PK/PD、停药和剂量逻辑
        - 需要用来检验 LIFE-001 是否真的相对 tacrolimus 赢得差异化风险折扣
        - 索取研究者材料、海报或论文手稿
      - - 移植中心路线图
        - 具名中心、PI，以及进入移植疗效场景的时间表
        - 把抽象热情和可执行开发计划区分开
        - 索取计划中心清单和研究者推荐名单
      - - 合作经济性 / 权利负担
        - GSK 当前状态、里程碑、权利，以及任何适应领域或 IP 负担
        - 不能只靠新闻标题给合作价值做投资测算
        - 索取合作摘要和 IP 所有权备忘录
    notes: 这五项请求是从叙事判断走向投资判断所需的最低材料包。
