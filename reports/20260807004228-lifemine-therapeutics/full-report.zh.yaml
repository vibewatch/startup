        blocks:
          - type: paragraph
            body: >-
              LifeMine 的基本盘仍然是一家围绕单一资产承担临床风险的公司。LIFE-001 还在 1 期，真正把资产带入商业场景的肾移植和胰岛细胞研究仍是计划，
              不是已完成结果。公司相关方披露的安全性和有效性信号值得鼓励，但仍由开发方描述，尚未经过独立同行评议。BIO 的成功率报告因此很关键： 从 1 期走向获批的总体概率偏低，2 期仍是最大关口，即便成功，1
              期资产走到获批也要多年。LifeMine 面临平台型生物技术公司的典型转化陷阱： 底层发现引擎可能很有吸引力，但公司成败仍取决于一个产品能否把临床前承诺在人身上复现出来。
