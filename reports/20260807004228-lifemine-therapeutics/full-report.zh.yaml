  - id: TV004
    title: 可比估值表
    enumeration: true
    enumerationScope:
      coverage: sample
      basis: >-
        Selected comparables cover the most relevant public transplant-therapy reference, scaled transplant-workflow
        owners, and nature-discovery private peers that bracket platform premium and commercial-proof gaps.
    columns:
      - 可比标的
      - 状态 / 阶段
      - 估值标记
      - 为何可比
      - 关键局限
    rows:
      - - Eledon
        - 上市移植治疗公司；公开资料称 tegoprubart 已完成肾移植 Phase 2，延长期 / Phase 1b 工作仍在推进
        - $0.26B-$0.267B 市值（Aug 2026）
        - 最接近的上市治疗类可比标的，用来校准移植免疫学风险
        - 在移植领域比 LifeMine 更超前，所以市值不是纯粹底线
      - - CareDx
        - 上市移植诊断 / 工作流公司，商业化落地已成规模
        - $2.31B-$2.32B 市值（Aug 2026）
        - 说明移植工作流控制权跑出规模后能值多少钱
        - 商业诊断经济模型与 LifeMine 当前状态相距很远
      - - Natera
        - 大型上市 cfDNA 诊断公司，也是 SEC 申报主体
        - $38.0B-$38.01B 市值（Aug 2026）
        - 代表移植邻近护理里，分子检测商业规模被验证后的外侧天花板
        - 不是药物发现可比标的；估值主要反映广泛商业规模
      - - Enveda
        - 私营自然产物 + AI 药物发现同业
        - 官方新闻显示，2025 年完成 $150M Series D，并出现独角兽状态报道
        - 支持给自然发现故事一些平台溢价
        - 管线宽度和公开证据集不同；此处未留存确切投后估值
      - - Hexagon Bio
        - 私营真菌 / 天然产物发现同业
        - 已留存新闻显示，其披露融资规模明显小于 LifeMine
        - 可用来约束为「真菌 + AI」叙事付过高价格
        - 融资报道较旧，管线取向也不同
    notes: 这组标的用于框定区间，不是说任何单一可比公司都应一比一套用；目的在于约束叙事漂移。
