      - number: '2.4'
        title: 市场为什么会动，以及为什么可能抗拒
        blocks:
          - type: paragraph
            body: >-
              LifeMine 的采用逻辑，起点是钙调神经磷酸酶抑制剂的痛点。公开来源一致显示，tacrolimus 和 cyclosporine 仍深嵌在移植维持治疗中， 但二者都带有取舍。Drugs.com
              总结共识指南称，在多种器官场景下，tacrolimus 预防急性排斥优于 cyclosporine； 同时也指出移植后糖尿病以及神经或胃肠不良反应发生率更高。FDA 的 Prograf
              页面补充了严重恶性肿瘤和机会性感染风险警告； 开放获取的肾毒性综述和 FAERS 分析则显示，肾损伤信号仍是长期担忧。如果 LIFE-001 能守住疗效，这就为更安全分子打开了真实窗口。
              但市场不会只因为毒性叙事而改变。移植临床医生已经非常熟悉 tacrolimus，真实世界证据围绕现有方案深深扎根；
              监管机构和中心在改写方案之前，很可能需要有说服力的长期移植物和安全性数据。竞争创新也存在：Eledon 的 tegoprubart 管线显示， 肾移植和胰岛移植替代方案已经进入人体开发，所以 LifeMine
              不是在进攻空白市场。
