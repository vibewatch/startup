companyProfile:
  summary: >-
    LifeMine Therapeutics 是一家位于马萨诸塞州 Watertown 的临床阶段生物技术公司，专注于从真菌生物多样性中发现并开发新型小分子。 公司称，已建立一个完全基因组化的集合，覆盖 100,000
    株深度测序的野生型真菌，横跨 25,000 多个物种， 并把基因组学、生物信息学、机器学习和合成生物学串成自上而下的发现栈。主导资产 LIFE-001 是一种不依赖免疫亲和素的钙调神经磷酸酶调节剂，
    定位于器官移植及其他免疫介导疾病，目前已在健康志愿者中开展 Phase 1 研究。2026 年，LifeMine 披露了合计 $263M 的 Series D / Series E 融资组合和 $558M 累计融资， 等于把一个在
    2025 年紧缩期被收窄的平台重新启动。
  foundingLocation: Cambridge, Massachusetts
  headquarters: Watertown, Massachusetts
  productSummary: LifeMine 正以真菌基因组学发现引擎为底座，搭出一家临床阶段移植免疫学公司。眼下真正可投资的产品故事是 LIFE-001： 一种长效注射型钙调神经磷酸酶通路疗法，首先瞄准器官移植排斥预防；更大的平台则提供未来管线的选择权。
  customerFocus: 尚未商业化。未来要面对的客户不是当前付费企业账户，而是移植中心、移植医生和战略药企合作方。
  businessModel: 尚未产生收入的 biotech 模式，主要靠风险股权融资。近期价值创造取决于 LIFE-001 的临床去风险，以及潜在合作或授权经济条款； 长期上行则取决于获批、里程碑、特许权使用费，或更多由平台衍生的资产。
  stage: clinical-stage private (Series E era)
  fundingStatus: >-
    私人融资。公司 2026 年披露显示，$75M Series D 与 $188M Series E 合计 $263M， 使已披露累计融资达到 $558M。战略方和 crossover 投资者支持包括历史上的 GSK，以及 2026
    年与 Bezos Expeditions、 Gates Frontier、RA Capital、GV、Milky Way Investments 和 ARCH 等参与。准确投后估值、优先权堆栈、消耗和资金续航，
    在保留的开放来源中仍未披露。
