              know-how。更广泛文献也说明这件事为什么难： 真菌天然产物发现需要激活沉默簇、表达系统、针对重复发现风险做优先级排序，并把基因组信号转化为可处理化合物。 同样重要的是未公开部分。保留来源没有详细 CMC
