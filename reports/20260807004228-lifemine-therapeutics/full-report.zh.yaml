      - number: '1.4'
        title: 运营足迹、平台规模与里程碑推进
        blocks:
          - type: paragraph
            body: >-
              理解 LifeMine 当前姿态，最好把它看成一家围绕一个临床切入口收窄的平台公司，同时保留未来重启更广泛发现的选择权。 官方科学材料称，公司建立了现存最大的完全基因组化真菌菌株集合：100,000
              株深度测序的野生型真菌，横跨 25,000 多个物种； 挖掘它们的技术栈结合了人类遗传学、基因组学、生物信息学、机器学习和合成生物学。2023 年和 2025 年围绕嵌入式靶基因和治疗性调节剂获授的专利，
              从法律层面证明公司在搭建可保护的发现基础设施，而不只是讲故事。2026 年 Fierce 复兴报道进一步压实当前里程碑： 管理层称平台包含约 1,200 个潜在药物靶点，计划用 AI agents
              逐一审视这组靶点，并具备足够宽度来支撑未来合作或对外授权。 运营上，公司也从 Cambridge 时代的多站点研发足迹，迁入更集中的 Watertown 住所；近期租赁把 LifeMine 与 66 Galen
              Street 约 56,000 平方英尺空间关联起来， 公开网站现在也把 Watertown 放在总部位置。
