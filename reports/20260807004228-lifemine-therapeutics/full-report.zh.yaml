      - number: '8.4'
        title: 情景区间：基准情形低于独角兽标记
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，最干净的决策方式是用情景区间，而不是一个目标数字。悲观情形假设早期人体数据无法支持更干净的 tacrolimus 替代品， 融资条件仍然挑剔，平台溢价大体蒸发；对应约
              $0.15B–$0.3B，接近受压或单项目上市可比公司的区间。 基准情形假设 1 期足够干净以保留可选性，移植有效性工作可信推进，平台在未被完全重估的情况下贡献一些额外价值；对应约 $0.4B–$0.7B。
              乐观情形假设安全性干净、移植有效性出现真实牵引、合作伙伴或管线扩张可见，且市场愿意重新为自然发现可选性付费；只有这样， $0.9B–$1.3B
              区间才站得住。这个框架很重要，因为它把入场纪律讲清楚：公司仍可能有吸引力，但股票或私人价格未必有吸引力。 价格明显高于 $0.7B
              时，太多上行已经由投资者预付。价格接近基准区间下半段时，这个想法更值得研究，但仍然带有投机性。
