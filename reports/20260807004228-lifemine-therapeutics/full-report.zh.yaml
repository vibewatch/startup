      - number: '1.2'
        title: 创立、领导层与治理图景
        blocks:
          - type: paragraph
            body: >-
              围绕 LifeMine 创立的公开记录方向一致，但并不完全干净。2022 年 Fierce 15 公司发布称，LifeMine “创立于 2017 年”， 创始人为 Gregory Verdine、Richard
              Klausner 和 WeiQing Zhou；Crunchbase 则记录成立年份为 2016， 并把 Hingge Hsu 也列入创始人。2022 年 MedCity 文章解释了部分张力：公司根源可追溯到
              2016 年， Klausner 则在 2017 年 Series A 启动前后加入。Gregory Verdine 是清晰的锚点人物：联合创始人、现任 CEO， 历史上也曾被标为首席科学官；他此前在
              Harvard 拥有学术地位，并长期创办 biotech 公司。治理披露比融资披露薄得多。 LifeMine 于 2022 年 10 月公开宣布 Jennifer Jarrett 加入董事会，2026
              年第三方报道提到 Yves Zinggeler 出任首席商务官， 但完整实时董事会名单、委员会结构和当前完整高管团队，开放来源并未完整列出。因此，关键人依赖重重压在 Verdine 身上：
              他是平台布道者、主要融资叙事者，也是近期多数报道里的商业策略声音。
