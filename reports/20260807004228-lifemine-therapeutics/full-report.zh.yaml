  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景和定价发现仍是核心问题
        blocks:
          - type: paragraph
            body: >-
              LifeMine 的公司故事比今天的价格更容易让人喜欢，也更难承销。官方和公司相关 2026 年披露清楚证明，公司完成了一组大规模再资本化：一笔 $75M 的 Series D 轮、一笔 $188M 的
              Series E 轮，以及累计披露资本 $558M。同一批来源也让战略叙事变得清楚： 管理层 2025 年缩减范围，把 LIFE-001
              推入临床，等新资本到位后又重启平台。它们没有给出权威投后估值、股权结构细节、 清算优先权层级或当前现金跑道。这个缺口很重要，因为 LifeMine
              仍是收入前、早期公司；决策变量是价格，不只是公司质量。保留下来的二级来源里， 唯一直接给出估值标记的是 Forge：它显示 2026 年 7 月 Series E 估值约 $469.78M，总融资约
              $522.71M； 但这些数字与公司相关的 $263M 融资包和 $558M 累计总额冲突。结果是入场价值的置信区间很宽。
              公开证据验证了融资渠道和投资者质量，但还没有验证一个干净的独角兽标记。因此，本章必须把估值框成带明确不确定性的区间，而不是一个精确点估计。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
              - CV024
              - CV025
      - number: '8.2'
        title: 方法论：上市可比公司能锚定区间，但主要工作必须交给 rNPV 逻辑
        blocks:
          - type: paragraph
            body: >-
              LifeMine 不适合放进常规收入倍数框架，因为没有公开收入基础可供资本化。更合适的方法是概率加权临床估值：从移植维持治疗机会出发，
              对早期失败风险大幅折现，然后只叠加有克制的平台溢价，而不是假设发现引擎已经能变现。这里最接近的公开疗法参照是 Eledon； 它的核心移植项目更靠后期，市值约
              $0.26B–$0.267B。这个参照不完美，但可作为有用的底部锚点， 因为它代表市场对一条真实移植免疫学故事的公开定价。CareDx 和 Natera 高得多，分别约 $2.3B 和 $38B，
              但这些数字主要反映已经跑通的商业工作流掌控力、诊断规模和成熟上市公司披露，而不是 LifeMine 已经拥有的东西。 私人同行也提示谨慎。Enveda 的官方新闻流显示，自然来源与 AI
              结合的生物技术公司仍能拿到独角兽式定价；Hexagon 披露的较小融资则说明同行估值跨度很大。
              正确做法不是挑一个可比标的，而是在低位公开疗法可比标的、高位私人平台可比标的，以及对临床和融资不确定性的高折扣之间三角定位。
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
