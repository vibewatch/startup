      - number: '1.5'
        title: 负面信号、重置动态与未解记录张力
        blocks:
          - type: paragraph
            body: >-
              LifeMine 最有辨识度的公司特征，不只是它的真菌基因组学命题，而是围绕这一命题可见的冻结再解冻模式。Fierce Biotech 在 2025 年 3 月报道， LifeMine 裁员、把资本重新平衡到
              LIFE-001，并在接近临床时整合运营；报道没有披露受影响员工人数，也没有说明 LIFE-001 是否已成为唯一活跃的内部优先项。 到 2026 年 8 月，同一媒体描述 Gates、Bezos 和 RA
              Capital 帮助为平台复兴注资，Verdine 明确表示新资金会让公司把平台带回来并重新雇用被休假的员工。 这一序列支撑了复兴叙事，但也证明在 LIFE-001
              人体数据出现之前，平台还没有赢得自我维持的资本位置。其他张力也没有解开： 当前来源不披露估值；公开记录不一致，无法确定公司应被视为 2016 年还是 2017 年创立；GSK 合作在 2026
              年被描述为因内部重新排序而停滞， 尽管 GSK 仍是投资者。净结果是，LifeMine 科学野心和投资者信号都异常强，但历史断裂也足够多，后续章节应承保执行，而不是承保修辞。
