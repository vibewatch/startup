              LifeMine 已经越过纯概念阶段，但证据阶梯仍早。ClinicalTrials.gov 确认了一项 Phase 1 研究；公司发布的公告称首名参与者已给药， 试验测量安全性、耐受性、药物暴露，以及血液中 T
              细胞抑制效果。官方来源还称，肾移植和胰岛细胞研究预计在 2027 年启动。 同一组开发者信号材料声称，超过 120 名成年参与者迄今未显示具有临床意义的肾脏、代谢或心血管安全性信号； 还称在溃疡性结肠炎和
