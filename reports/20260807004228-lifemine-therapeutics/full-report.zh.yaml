  - id: TV002
    title: 正方论点 / 反方论点表
    columns:
      - 维度
      - 正方论点
      - 反方论点
      - 改变判断的因素
    rows:
      - - 科学 / 平台
        - 真菌基因组来源加 AI 靶点推断，可能产生同行看不到的分子
        - 在公开证据里，平台广度仍更像叙事，而不是已变现资产基础
        - 独立数据证明第二个可信资产或伙伴支持项目
      - - 先导资产
        - LIFE-001 瞄准临床重要的移植问题：tacrolimus 毒性给创新留出空间
        - 公司仍集中在一个 1 期资产上，尚无移植疗效证明
        - 扎实的 1 期数据包和可信的移植疗效站点披露
      - - 资本质量
        - 2026 年投资团异常强，显示机构相信这次重启
        - 强投资人不能消除临床风险，也不能保护新资金免受结构化条款影响
        - 完整 D/E 轮条款和股权结构表层级
      - - 商业化路径
        - 移植市场足够集中，数据好时，聚焦商业化打法可能跑通
        - 没有具名标杆站点、没有商业化产品，工作流在位者已在塑造中心行为
        - 具名站点拥护者和方案级采纳计划
      - - 护城河
        - 可见专利和不寻常的生物来源材料有助于差异化
        - 公开记录没有厘清 FTO、负担或可执行性
        - 正式 FTO 和 IP 所有权备忘录
    notes: 反方论点不是 LifeMine 缺少希望，而是估值可能跑在当前公开证明前面。
