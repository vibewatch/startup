chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、当前阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              LifeMine 目前把自己定位为一家围绕 “Top-Down Drug Discovery” 搭建的临床阶段生物制药公司。
              这是一套真菌基因组学搜索引擎，目标是比传统先化学后筛选的流程更快识别结构和机制都新颖的小分子。公司当前网站显示， 总部位于马萨诸塞州 Watertown，并在马萨诸塞州 Gloucester 和瑞士 Basel
              设有其他运营点； 它把 LIFE-001 描述为主导 “pipeline-in-a-product”，公司当前围绕这项资产组织。商业模式眼下不是商业产品收入； LifeMine 是一家靠 venture
              资金支持的药物开发商，用专有发现资产孵化内部临床项目，并在合适时合作或对外授权部分机会。 公开来源还显示出一次重要身份演进：2022-2025 年较早材料把 LifeMine 描述为总部在
              Cambridge、更强调多疾病领域平台； 2026 年材料则写成一家临床阶段公司，近期验证点是移植免疫抑制。这一转向很关键，因为后续章节应把 Watertown 视为当前记录总部， 同时保留历史上的
              Cambridge 足迹和公司更深的平台根系。
