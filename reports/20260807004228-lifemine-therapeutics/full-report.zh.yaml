      - number: '2.5'
        title: 市场结论与关键缺失承保输入
        blocks:
          - type: paragraph
            body: >-
              因此，市场结论是有利但有边界。LifeMine 进入的是一个临床重要细分市场：买方集中、现有药物毒性明显；如果药物有效，自主商业化路径可能可信。 但公开记录本身不支持激进的市场规模主张。Verdine
              称仅器官移植就可能支撑 $25B 到 $30B 机会，这一点值得注意， 但它仍是管理层估计，没有公开的自下而上模型。保留来源没有给出干净的报销模型、中心级预算影响分析、年度移植药物支出，
              也没有公开证据说明一个新的 CNI 替代品能现实地替代移植药物栈中的多大部分。今天最好的承保姿态是： LifeMine 的初始市场具有战略吸引力，因为它集中且对安全性敏感；不是因为公开证据证明了一个巨大
              TAM。这个区别对后续估值工作至关重要。
