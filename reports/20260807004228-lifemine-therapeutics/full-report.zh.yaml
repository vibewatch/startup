      - number: '7.5'
        title: 法律、IP 和战略风险可见，但只被部分验证
        blocks:
          - type: paragraph
            body: >-
              LifeMine 并非没有法律保护——公开专利记录显示，公司围绕人体治疗靶点和调节剂路径拿到了授权专利——但公开记录没有完全回答投资者最关心的问题。
              看得见专利，不等于实施自由、可执行性、覆盖宽度或抗规避能力已经解决。这里保留的 WIPO 和生物技术 IP 商业化材料解释了原因：在生物技术领域， IP
              风险横跨专利、商业秘密、许可结构、监管时点和竞争情报。平台语料库本身还带来另一个战略问题，因为公开来源没有充分说明排他性、来源约束，
              或公司能在多大范围内把靶点库存转成多个资产。结果是，公司手里握有有价值的法律资产，但不透明度仍足够高，IP 应被视为缓释项，而不是已解决问题。
