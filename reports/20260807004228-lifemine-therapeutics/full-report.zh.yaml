      - number: '2.2'
        title: 受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              公开证据支持多种规模测算视角，但任何一个单独视角都不应被误当成最终 TAM。最宽的视角是全球：WHO 体系下的 Global Observatory 报告称， 2024 年全球完成 173,727
              例实体器官移植，是有记录以来的最高数字。美国视角明显更小，但更贴近 LifeMine 的第一条上市路径。 UNOS 和 HRSA 都报告称，2024 年美国器官移植超过 48,000 例；SRTR
              年报着陆页单独把 2024 年描述为美国移植超过 45,000 例的一年， 并强调等待名单压力持续存在。第三个视角是商业集中度，而不是手术量：Verdine 告诉 Fierce，大多数美国移植在约 70
              家中心完成， 暗示进入市场的足迹远比全国手术量本身更集中。第四个刻意收窄的视角，是 LifeMine 自身的初始开发范围： 一个 150 名患者肾移植 Phase 2 设想，以及一个 12 名患者胰岛细胞
              Phase 1b 设想。实际结论是，LifeMine 的近期 SAM 绝对患者数可能很小， 但按中心计算异常集中，且经济重要性高。
