  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构：先真菌基因组，后化学
        blocks:
          - type: paragraph
            body: >-
              LifeMine 的官方技术故事不是泛泛的 AI 药物发现。它是一套具体流程：从一个非常大的真菌菌株集合出发，读取真菌 DNA 内的生物合成基因簇， 用 Embedded Target Genes
              作为机制线索，在完整下游表征之前，推断一个隐藏小分子可能在生物学上做什么。科学页面称，公司拥有 100,000 株深度测序野生型真菌， 横跨 25,000
              多个物种；平台整合人类遗传学、基因组学、生物信息学、机器学习和合成生物学。放在文献背景下，这套架构有可信度： 多篇保留综述认为，真菌仍是庞大且开发不足的天然产物储库；沉默或隐匿的生物合成基因簇可以被激活；
              异源表达和合成生物学流程，对把基因组信号转成分子越来越重要。LifeMine 的主张是，它已把这套逻辑工业化成专有发现引擎， 而不是停留在学术方法。
