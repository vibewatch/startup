  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争对 LifeMine 意味着什么
        blocks:
          - type: paragraph
            body: >-
              LifeMine 不应只拿来和其他 AI 或天然产物发现公司对标。它的主导资产 LIFE-001 现在是一个移植免疫学产品故事，
              所以最重要的竞争问题是：今天谁控制移植中心的抗排斥方案。保留来源显示有三层。第一层是现有 tacrolimus 产品体系： 即释 Prograf、缓释 Envarsus XR，以及更广泛的 tacrolimus
              治疗方案生态。第二层是创新层；Eledon 是最清晰的直接移植挑战者， 在肾移植上有更靠后的临床项目，并借 CD40L 阻断采用不同机制。第三层是相邻平台层：Hexagon 和 Enveda
              验证了自然衍生药物发现仍能吸引严肃资本和科学人才， 即便它们目前并不直接进攻同一个移植决策。CareDx 和 Natera 增加了第四个实践层，因为移植中心越来越多使用诊断和监测工具，
              这些工具会影响新药能多快被信任。
