  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: LifeMine 真正进攻的市场
        blocks:
          - type: paragraph
            body: >-
              LifeMine 的正确市场边界，是移植维持免疫抑制流程，尤其先从肾移植切入，其次是胰岛细胞移植；不是整个自身免疫或炎症疾病治疗宇宙。 LifeMine 官方材料强调 LIFE-001
              用于预防器官移植排斥，并把未来自身免疫用途放在可选扩张位置，而不是当前商业楔子。 这一点重要，因为现状不是空白市场；它是一套成熟方案架构，以 tacrolimus 或 cyclosporine
              加其他免疫抑制剂为中心， 在专业移植中心交付，并由移植医生和药师严密管理。kidney.org 患者教育页强调，移植是肾衰竭仅有的两种替代选择之一，
              受者移植后每天都需要用药，进一步说明这是一个终身维持市场，而不是短期急性治疗市场。换句话说，LifeMine 追求的是狭窄但反复发生的专科市场； 在这里，持续性、安全性和监测比原始处方量更重要。
