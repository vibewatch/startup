      - number: '8.3'
        title: 正向逻辑成立，但反向逻辑让它还够不上买入
        blocks:
          - type: paragraph
            body: >-
              LifeMine 的正向案例很严肃。公司有差异化的生物输入集，有可识别的真菌基因组学与 AI 发现故事，核心分子围绕临床重要的钙调神经磷酸酶靶点构建，
              专科市场也足够集中，成功不需要庞大的基层医疗商业机器。2026 年财团——与 Gates、Bezos、RA Capital、GV 和 GSK
              相关的资金——同样重要，因为成熟资本在一段可见的收缩期后重新进场。但在任何激进价格上，反向逻辑都强于正向案例。公开证据仍显示， 公司围绕一个 1
              期资产展开；没有披露投后条款，没有公开现金消耗桥，没有具名移植研究点，也没有完全讲清 GSK 关系今天贡献什么。 可见专利组合有帮助，但没有解决实施自由或权利负担风险。换句话说，LifeMine 的科学故事可能比
              2025 年收缩所暗示的更好， 但不透明度仍太高，不足以支撑在数亿美元中段入场水平之上的高确信估值判断。争论点因此不是公司是否有意思，而是价格是否已经假设了超过公开记录的证明。
            claimRefs:
              - CV004
              - CV006
              - CV007
