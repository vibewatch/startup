  - id: TV005
    title: 论点失效与叫停触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - Phase 1 数据包不及预期
        - 出现实质性安全性、PK 或耐受性问题，或数据仍太薄，无法支撑移植信心
        - LIFE-001 目前就是全部故事，基准和乐观情形都会被压缩
        - 降级为回避，等待重新做投资测算
      - - 条款暴露沉重优先权包袱
        - D/E 轮包含强清算优先级、棘轮，或其他不利于新资金的结构
        - 入场经济性错了，科学再好也不吸引人
        - 价格或保护不重置，就不参与
      - - 平台重启侵蚀焦点
        - 经营计划扩张快于临床证据，再次带来 2025 式压力
        - 平台溢价消失，融资风险上升
        - 只保留观察；不要为广泛期权性付费
      - - 移植路线图仍不透明
        - 没有具名中心、没有清晰疗效路径，也没有外部拥护者出现
        - 商业化和开发时间风险太高，不足以支撑溢价定价
        - 等到中心层面牵引力可见再说
      - - 宏观融资窗口收紧
        - LifeMine 抵达去风险里程碑前，生物科技市场的挑剔程度进一步恶化
        - 早期单一资产故事的下轮风险急剧上升
        - 要求入场价明显更低
    notes: 每个触发因素都能在尽调流程或未来公司更新中监测；没有一个只依赖模糊情绪。
