        title: 融资历史、投资者与仍未披露的部分
        blocks:
          - type: paragraph
            body: >-
              LifeMine 的融资时间线比运营披露更扎实。2022 年，公司宣布由 Fidelity Management & Research 领投的 $175M Series C， 同时披露与 GSK
              的并行联盟，其中包括 $70M 前期现金和股权支持。此后，公开能见度下降，直到 2026 年 8 月融资公告披露两笔独立后期轮次： 2025 年第四季度完成的 $75M Series D，以及 2026 年 7
              月完成的 $188M Series E。Goodwin 和 Yahoo/Business Wire 联合稿称， 2026 年合并披露总额为 $263M，累计融资达到 $558M；BioPharma Dive
              则把私人融资总额四舍五入为约 $580M。 投资者财团的看点在广度和信号强度，而不是公开股权结构：Milky Way Investments 领投 Series E，新投资者包括 Bezos
              Expeditions、 Gates Frontier 和 RA Capital，GV、LoLa Capital Partners、GSK、Invus、ARCH Venture Partners
              等既有支持方继续参与。 缺失信息与公开信息同样重要：本报告保留审阅的来源没有披露投后估值、清算堆栈、持股比例，也没有任何债务或结构化融资叠加。
