          value: Kidney + islet studies in 2027
          claimRefs:
            - CR002
        - label: 当前现金公开披露
          value: None
          claimRefs:
            - CR029
        - label: 具名商业客户
          value: 0 disclosed
          claimRefs:
            - CR018
        - label: 可见已授权专利
          value: 'Yes'
          claimRefs:
            - CR021
        - label: 整体风险评级
          value: High
          claimRefs:
            - CR036
    claimRefs:
