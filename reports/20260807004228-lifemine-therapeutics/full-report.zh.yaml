        - 索取权利要求对照表、FTO 审查和许可负担。
      - - 平台发散
        - 1,200 个靶点叙事加上平台重启，可能稀释焦点
        - 中
        - 管理层可能把资源铺到太多机会上
        - 索取组合优先级框架和继续 / 停止规则。
    notes: 本表隔离非临床风险：即使生物学仍有希望，这些风险也可能损害价值。
