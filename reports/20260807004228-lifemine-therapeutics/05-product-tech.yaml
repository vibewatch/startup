  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: published-human-data
    missingEvidence: No retained peer-reviewed human results package for LIFE-001 is publicly available in the evidence set.
    whyItMatters: Independent human data are the fastest way to separate a strong platform narrative from a validated therapy story.
    diligencePath: Obtain conference posters, manuscripts, investigator slides, or a data-room safety package from the Phase 1 program.
    relatedQuestionRefs:
    - QE011
    - QE013
    - QE023
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: cmc-and-pk
    missingEvidence: Open sources do not disclose the detailed formulation, PK/PD, or manufacturing package needed to assess a long-acting injectable program.
    whyItMatters: Many technically promising molecules fail on exposure control, scale-up, or manufacturability rather than on biology alone.
    diligencePath: Request CMC summary, PK/PD curves, stability data, and CDMO or in-house manufacturing plan.
    relatedQuestionRefs:
    - QE018
    - QE024
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: minor
    topic: platform-productivity
    missingEvidence: Retained public evidence does not quantify hit-to-lead, lead-to-candidate, or candidate-to-clinic conversion across the broader platform.
    whyItMatters: A platform company ultimately needs repeatable productivity, not just one compelling flagship asset.
    diligencePath: Request internal portfolio funnel metrics and named second-wave programs.
    relatedQuestionRefs:
    - QE016
    - QE020
    - QE021
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: minor
    topic: corpus-exclusivity
    missingEvidence: Official materials describe the size of the fungal collection but do not publicly detail exclusivity, provenance restrictions, or refresh cadence.
    whyItMatters: Corpus uniqueness is a major part of the technical moat claim.
    diligencePath: Request provenance map, exclusivity terms, sequencing refresh process, and overlap analysis versus public and private strain libraries.
