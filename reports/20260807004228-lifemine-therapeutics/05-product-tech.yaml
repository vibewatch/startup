- id: TE005
  title: Technical blockers and diligence table
  columns:
  - Blocker
  - Why it matters
  - Current proxy
  - Why the proxy is insufficient
  - Exact diligence path
  rows:
  - - No peer-reviewed human data
    - Blocks external validation of claims
    - Company press releases and trial registration
    - These do not substitute for full data disclosure
    - Request poster, manuscript, or investigator presentation package.
  - - No public PK/PD package
    - Long-acting and organ-sparing claims depend on exposure control
    - Mechanism description only
    - Design intent is not PK proof
    - Request SAD/MAD PK, PD, and dose-selection readout.
  - - No public CMC description
    - Injectable programs often fail on manufacturability and formulation
    - Pipeline page positioning
    - No formulation or scale detail is public
    - Request CMC overview, stability, and CDMO strategy.
  - - Single-asset proof bottleneck
    - Platform valuation depends heavily on LIFE-001
    - Current pipeline page
    - One asset cannot prove broad engine productivity alone
    - Request second-wave asset list and discovery funnel metrics.
  - - Opaque cross-program conversion rate
    - A platform story needs hit-to-lead and lead-to-candidate evidence
    - Patents and science narrative
    - Narrative does not quantify productivity
    - Request portfolio conversion statistics and attrition analysis.
  notes: These blockers explain why the chapter can support scientific interest and platform differentiation but not full technical de-risking.
