- id: evidence-maturity
  title: 'Evidence maturity: strong company signals, limited independent clinical proof'
  body: LifeMine has moved beyond pure concept stage, but the evidence ladder is still early. ClinicalTrials.gov confirms a Phase 1 study, and company-linked announcements say the first participant has been dosed and that the trial measures safety, tolerability, drug exposure, and effectiveness of T-cell suppression in blood. Official sources also state that kidney-transplant and islet-cell studies are expected to begin in 2027. The same developer-signal materials claim more than 120 adult participants have shown no clinically meaningful renal, metabolic, or cardiovascular safety signals to date, plus favorable preclinical efficacy in ulcerative colitis and Crohn’s models. Those are important signals, but they remain company-described rather than independently published or peer-reviewed human proof. So the technical status today is best described as promising and testable, not validated.
