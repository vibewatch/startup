tables:
- id: TE001
  title: Discovery engine components table
  columns:
  - Component
  - What official sources say
  - Why it matters technically
  - External literature support
  - Open question
  rows:
  - - Fungal strain library
    - 100,000 deep-sequenced strains across >25,000 species
    - Large search space for novel chemistry
    - Fungal chemodiversity reviews support large hidden biosynthetic potential
    - How unique and exclusive is the corpus today?
  - - Avatar-Rx
    - Digital analysis of fungal DNA for biosynthetic gene clusters
    - Turns genomes into candidate chemistry hypotheses
    - Genome-mining literature supports BGC-based prioritization
    - How often does the engine convert signal into leads?
  - - ETaGs
    - Embedded target genes act as avatars for therapeutic targets
    - Potentially shortens mechanism inference
    - Self-resistance and target-linked BGC logic are supported directionally in the literature
    - How often do ETaG inferences validate experimentally?
  - - AI / bioinformatics layer
    - Platform integrates machine learning and synthetic biology
    - Could increase search speed and design quality
    - Reviews support AI as an accelerator for annotation and prioritization
    - What part of the pipeline is truly automated versus expert-driven?
  - - Synthetic biology / expression workflows
    - Not fully detailed publicly
    - Needed to express, validate, and scale cryptic clusters
    - Heterologous-expression and activation reviews support the need
    - What exact host and activation systems does LifeMine use most?
  notes: The table separates the parts of the discovery story that are publicly described from those that are only inferable from field literature.
