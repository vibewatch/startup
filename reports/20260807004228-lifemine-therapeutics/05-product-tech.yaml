- id: ip-and-scalability
  title: IP, scalability, and how much of the moat is actually visible
  body: 'Open sources do show evidence of real defensibility, but not complete visibility. The company’s patent footprint on Justia includes granted U.S. patents in 2023 and 2025 around human therapeutic targets and modulators, and official science pages plus the patents point back to a target-inference logic based on fungal biosynthetic context. That supports a thesis that LifeMine is building proprietary know-how at the intersection of biological corpus, predictive inference, and chemical output. The broader literature also makes clear why this is hard: fungal natural-product discovery requires activation of silent clusters, expression systems, prioritization against rediscovery risk, and translation from genomic signal into tractable compounds. What is not public is equally important. There is no retained detailed CMC package, no manufacturing description, no public PK/PD package, and no independent evidence on how reproducibly the platform converts targets into drug-quality leads across
    multiple programs.'
  claimRefs:
  - CE019
