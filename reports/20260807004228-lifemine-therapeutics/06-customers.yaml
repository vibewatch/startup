company:
  name: LifeMine Therapeutics
chapter:
  number: 6
  title: Customers and Market Adoption
  summary: 'LifeMine has no publicly disclosed paying commercial customers today. The real current adoption proof is narrower: a live Phase 1 study, the historical GSK relationship, and a clearly identifiable future buyer universe concentrated in major transplant centers. Public sources suggest that the eventual customer stack will be transplant programs, transplant physicians, pharmacy and therapeutics committees, and payers, with patients as end users rather than economic buyers. That buyer map is attractive because it is concentrated, but it also makes customer proof and concentration risk unusually binary. Net verdict: the future customer base is easy to describe, while current customer proof remains weak.'
sections:
- id: customer-definition
  title: Who the customers actually are at this stage
  body: 'LifeMine is not yet a company with paying commercial customers in the normal sense. Its current real-world external adoption evidence comes from three places: human trial participation, strategic counterparties such as GSK, and the visible set of future transplant-center buyers that would evaluate LIFE-001 if the data become compelling. The buyer-user-payer split is important. Patients are the end users, but the practical customers are transplant centers, transplant nephrologists and surgeons, hospital pharmacies, and protocol committees that decide which anti-rejection regimen gets embedded in care. Payers matter, but they sit downstream of a highly specialized institutional workflow. That means LifeMine’s customer chapter is best read as a map of a concentrated future buyer system plus a thin current proof layer.'
