- id: future-buyers
  title: Future buyers are concentrated transplant institutions
  body: 'The future customer set is more legible than the present one. NMDP’s U.S. transplant-center directory, OPTN’s national network framing, and major center pages from Johns Hopkins, Mass General, Cleveland Clinic, UCSF, UPMC, and NewYork-Presbyterian all reinforce the same point: solid-organ transplantation is concentrated inside a finite set of sophisticated academic and large health-system programs. LifeMine’s own 2026 management commentary that most U.S. transplants occur in roughly 70 centers fits that structure. This concentration has two consequences. First, a small commercial team could plausibly cover the initial market if the drug is approved. Second, a small number of skeptical centers could materially delay adoption. In customer terms, this is not a broad field-sales market; it is a lighthouse-account market.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU018
  - CU019
  - CU024
  - CU032
