- id: current-proof
  title: Current customer proof is real but weak
  body: Public evidence of actual LifeMine adoption is materially weaker than the future market narrative. ClinicalTrials.gov and company-linked announcements confirm that LIFE-001 is active in a Phase 1 study and that at least one participant has been dosed, which proves that investigators, study participants, and oversight bodies are willing to engage with the program. Historically, the GSK partnership is the strongest named external relationship in the record, because it paired capital with platform validation. But it is not a production customer in the sense of a commercial transplant buyer, and 2026 reporting says the collaboration later stalled. No retained source names a transplant center using LIFE-001 in production, no pilot deployment list is public, and no payer or formulary proof is disclosed. Today’s adoption proof is therefore institutionally meaningful but commercially thin.
