  - FU002
- id: retention-and-expansion
  title: Retention and expansion are conceptually clear but empirically absent
  body: Because LifeMine has no public commercial deployments, standard SaaS-style or product-company customer metrics simply do not exist in the open record. There is no NRR, GRR, churn, renewal rate, contract length, cohort retention, or satisfaction metric. The correct retention proxy today is not customer renewal; it is whether centers continue to believe the transplant protocol change is worth testing as the evidence matures. Expansion logic, however, is fairly visible. If LIFE-001 works in kidney transplantation, the company could expand organ-by-organ or center-by-center, beginning with high-volume transplant programs and potentially extending to islet and other solid-organ settings. Monitoring vendors such as CareDx and Natera also show that sophisticated transplant centers already buy supporting workflow tools, which means expansion will be tied to protocol fit and evidence depth rather than to commodity sales tactics.
  claimRefs:
  - CU016
  - CU020
  - CU021
  - CU025
  - CU026
  - CU027
