- id: operating-footprint-and-milestones
  title: Operating footprint, platform scale, and milestone progression
  body: 'The best way to understand LifeMine’s current posture is as a platform company that has narrowed itself around one clinical wedge while preserving optionality to revive broader discovery. Official science materials say the company has assembled the largest fully genomicized fungal strain collection in existence: 100,000 deep-sequenced wild-type fungi spanning more than 25,000 species, mined through a technology stack that combines human genetics, genomics, bioinformatics, machine learning, and synthetic biology. Patents granted in 2023 and 2025 around embedded target genes and therapeutic modulators provide legal evidence that the company is building protectable discovery infrastructure, not just a narrative. The 2026 Fierce revival article sharpens the present milestone story further: management says the platform contains about 1,200 potential drug targets, plans to use AI agents to interrogate that target set, and has enough breadth to support future partnerships or out-licensing.
    Operationally, the company has also moved from a multi-site Cambridge-era R&D footprint into a more consolidated Watertown home, with recent leases tying LifeMine to roughly 56,000 square feet at 66 Galen Street and the public website now making Watertown the headline headquarters.'
