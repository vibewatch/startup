company:
  name: LifeMine Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: 'LifeMine Therapeutics is a Watertown, Massachusetts-based clinical-stage biotech using a fungi-genomics discovery platform to produce novel small molecules, now centered on LIFE-001, a long-acting calcineurin activation inhibitor for transplant rejection. Public records show a genuine reset story: after a 2025 retrenchment that put the platform on ice and consolidated operations, the company resurfaced in August 2026 with a previously undisclosed $75 million Series D plus a $188 million Series E, while still leaving valuation, exact headcount, and full governance disclosures unresolved.'
sections:
- id: identity-and-stage
  title: Identity, current stage, and business model
  body: 'LifeMine currently presents itself as a clinical-stage biopharmaceutical company built around “Top-Down Drug Discovery,” a fungi-genomics search engine that aims to identify structurally and mechanistically novel small molecules faster than conventional chemistry-first workflows. The current website says the company is headquartered in Watertown, Massachusetts with additional operations in Gloucester, Massachusetts and Basel, Switzerland, and it frames LIFE-001 as the lead “pipeline-in-a-product” around which the company is now organized. The business model is not commercial product revenue today; instead, it is a venture-funded drug developer using proprietary discovery assets to create internal clinical programs and, when useful, partner or out-license selected opportunities. Public sources also show an important identity evolution: earlier 2022-2025 materials described LifeMine as Cambridge-based and more platform-forward across multiple disease areas, whereas 2026 materials
    describe a clinical-stage company whose near-term proof point is transplant immunosuppression. That shift matters because later chapters should treat Watertown as the current headquarters of record, while still preserving the historical Cambridge footprint and the company’s deeper platform roots.'
