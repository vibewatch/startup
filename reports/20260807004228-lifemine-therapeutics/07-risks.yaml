    - Harder to underwrite adoption speed
    - Concentrated buyer list is knowable
    - Request named transplant sites and KOL support.
  - - Center concentration
    - Management cites ~70 centers; NMDP and major centers show concentrated institutions
    - A few blockers can slow launch materially
    - A few believers can accelerate launch materially
    - Map top centers and current protocol norms.
  - - Competitive crowding
    - Eledon is further along in transplant innovation
    - May absorb clinician attention first
    - LifeMine could still win on mechanism or safety
