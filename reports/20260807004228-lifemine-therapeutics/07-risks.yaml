- id: customer-and-commercial
  title: Commercial risk is concentrated because the customer base is concentrated
  body: 'LifeMine’s market concentration is strategically attractive and operationally risky at the same time. Management and public transplant-system sources point toward a buyer universe concentrated in a relatively small number of transplant centers. That can support focused coverage if the data are strong, but it also means a handful of skeptical centers can materially slow adoption. The current customer story adds further risk: there are no named production customers, no public lighthouse study sites, and no disclosed commercial infrastructure. Competitive and workflow risk compounds this problem. Eledon is further along in transplant-specific innovation, while CareDx and Natera show that transplant centers already operate inside mature monitoring ecosystems. LifeMine therefore faces not just a science risk, but a protocol-conversion risk.'
  claimRefs:
  - CR017
