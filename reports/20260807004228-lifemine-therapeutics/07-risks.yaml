- id: TR002
  title: Safety and regulatory risk table
  columns:
  - Risk theme
  - Source-backed evidence
  - Why it matters for LifeMine
  - Current mitigant
  - Open hole
  rows:
  - - Serious infections / malignancies
    - DailyMed boxed warning for Prograf
    - Any next-gen immunosuppressant must prove it does not worsen an already serious risk category
    - LifeMine’s organ-sparing safety thesis
    - No independent long-duration human safety data retained.
  - - Nephro / neurotoxicity
    - Open-access calcineurin reviews
    - LifeMine’s pitch is partly a response to class toxicity
    - Mechanistic differentiation
    - No published human superiority data retained.
  - - Long-term skin malignancy burden
    - Systematic review after kidney transplant
    - Confirms chronic immunosuppression risks persist over time
    - Potentially lower-risk new mechanism
    - Long follow-up not yet available.
  - - Regulatory comparator strength
    - FDA label evolution for Prograf
    - Incumbents have mature data and regulatory familiarity
    - Novel design could create differentiation
    - Novelty alone does not lower evidence burden.
  - - Study-start and progression risk
    - ClinicalTrials + planned 2027 studies
    - Timeline slippage would directly damage credibility and financing leverage
    - Recent financing
    - No public guarantee of study timing.
  notes: The regulatory problem is not merely approval; it is approval plus enough safety confidence to rewrite center protocols.
