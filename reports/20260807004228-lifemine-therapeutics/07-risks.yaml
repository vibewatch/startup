  - - Commercial build risk
    - Self-commercialization thesis exists but no org is disclosed
    - Execution risk if approval comes before GTM preparation
    - Concentrated market lowers field-force size needs
    - Request commercialization plan and account coverage model.
  notes: Execution risk is magnified by the same concentration that makes the market attractive.
