evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: >-
      Post-money valuation, ownership percentages, liquidation preferences, and any debt or structured-finance terms for
      the 2025-2026 rounds remain undisclosed in retained public sources.
    whyItMatters: >-
      Without valuation and stack details, later-stage pricing discipline and investor-return analysis remain
      incomplete.
    diligencePath: >-
      Request the cap table, financing term sheets, and any investor-rights agreements; if unavailable, revisit after an
      IPO filing or major secondary process.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: full-governance-roster
    missingEvidence: >-
      Open sources do not fully enumerate LifeMine’s live board roster, committee structure, or complete current
      C-suite.
    whyItMatters: Governance quality and executive bench depth are central to evaluating key-person risk and launch readiness.
    diligencePath: Request a current board and executive roster plus committee membership from management or investor materials.
    relatedQuestionRefs:
      - QO012
      - QO013
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: founding-year-and-founder-list
    missingEvidence: >-
      Public sources conflict on whether LifeMine should be dated to 2016 roots or a 2017 formal founding and on whether
      Hingge Hsu belongs in the canonical founder list.
    whyItMatters: The discrepancy is not thesis-breaking, but it weakens confidence in biographical and milestone precision.
    diligencePath: Ask management for a canonical founding chronology and full founder/early-backers list.
    relatedQuestionRefs:
      - QO002
      - QO004
  - type: private-evidence-only
    severity: material
    topic: layoff-scale-and-platform-scope
    missingEvidence: >-
      The number of employees affected by the 2025 layoffs and the exact program scope left active during austerity were
      not publicly disclosed.
    whyItMatters: >-
      Those details would clarify burn discipline, remaining platform capacity, and whether the 2026 revival represents
      a restart or a continuation.
    diligencePath: Request historical headcount by site and function plus a program-priority memo covering 2024-2026 changes.
    relatedQuestionRefs:
      - QO020
  - type: stale
    severity: minor
    topic: gsk-collaboration-status
    missingEvidence: >-
      The latest open-source status of the GSK collaboration is management commentary that the collaboration stalled
      after GSK reprioritized internally.
    whyItMatters: A restarted or terminated collaboration would change external platform-validation and partnership optionality.
    diligencePath: >-
      Ask both parties for the current alliance status, remaining economics, and whether target work continues under any
      amended statement of work.
    relatedQuestionRefs:
      - QO015
      - QO024
  - type: private-evidence-only
    severity: material
    topic: pricing-and-budget-impact
    missingEvidence: >-
      No retained public source provides a center-level or payer-level budget-impact model for replacing tacrolimus with
      LIFE-001.
    whyItMatters: Without therapy-cost and reimbursement detail, market size cannot be converted into a credible revenue model.
    diligencePath: >-
      Build a bottom-up model with target transplant-center mix, regimen cost assumptions, reimbursement rules, and
      dose/frequency inputs.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
