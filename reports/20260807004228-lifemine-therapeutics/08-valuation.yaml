- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Science / platform
    - Fungal-genomics sourcing plus AI target inference may create molecules peers do not see
    - Platform breadth is still more narrative than monetized asset base in public evidence
    - Independent data showing a second credible asset or partner-backed program
  - - Lead asset
    - LIFE-001 attacks a clinically important transplant problem where tacrolimus toxicity creates room for innovation
    - The company is still concentrated on one Phase 1 asset with no transplant efficacy proof yet
    - Robust Phase 1 package and credible transplant efficacy-site disclosure
  - - Capital quality
    - The 2026 syndicate is unusually strong and signals institutional belief in the reset
    - Strong investors do not remove clinical risk or protect new money from structured terms
    - Full D/E round terms and cap-table stack
  - - Commercial path
    - Transplant is concentrated enough that a focused go-to-market could work if data are good
    - No named lighthouse sites, no commercial product, and workflow incumbents already shape center behavior
    - Named site champions and protocol-level adoption plan
  - - Moat
    - Visible patents and unusual biological source material help differentiation
    - Public records do not settle FTO, encumbrances, or enforceability
    - Formal FTO and IP-ownership memo
  notes: The anti-thesis is not that LifeMine lacks promise; it is that the valuation can outrun currently public proof.
