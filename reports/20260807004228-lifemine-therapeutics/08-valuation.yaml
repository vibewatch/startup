- id: scenario-ranges-and-entry-discipline
  title: 'Scenario ranges: the base case lives below a unicorn mark'
  body: 'On open evidence, the cleanest way to make a decision is with scenario bands rather than one target number. The bear case assumes early human data fail to support a cleaner tacrolimus alternative, financing conditions remain selective, and the platform premium largely evaporates; that points to roughly $0.15 to $0.3 billion, close to distressed or single-program public-comp territory. The base case assumes Phase 1 remains clean enough to preserve optionality, transplant efficacy work progresses credibly, and the platform contributes some additional value without being fully re-rated; that points to roughly $0.4 to $0.7 billion. The bull case assumes clean safety, real transplant efficacy traction, visible partner or pipeline expansion, and a market willing to pay again for nature-discovery optionality; only then does a $0.9 to $1.3 billion band become defensible. That framing is important because it makes entry discipline explicit: the company can still be attractive while the stock
    or private price is not. At prices meaningfully above $0.7 billion, too much of the upside is already being prepaid by the investor. At prices closer to the lower half of the base-case band, the idea becomes more interesting, though still speculative.'
