- id: TV004
  title: Comparable valuation table
  enumeration: true
  enumerationScope:
    coverage: sample
    basis: Selected comparables cover the most relevant public transplant-therapy reference, scaled transplant-workflow owners, and nature-discovery private peers that bracket platform premium and commercial-proof gaps.
  columns:
  - Comparable
  - Status / stage
  - Valuation marker
  - Why relevant
  - Key limitation
  rows:
  - - Eledon
    - Public transplant-therapy company; tegoprubart described as Phase 2-completed in kidney transplant plus ongoing extension / Phase 1b work
    - $0.26B-$0.267B market cap (Aug 2026)
    - Closest public therapy comparator for transplant-immunology risk
    - More advanced in transplant than LifeMine, so its market cap is not a pure floor
  - - CareDx
    - Public transplant diagnostics / workflow company with established commercial footprint
    - $2.31B-$2.32B market cap (Aug 2026)
    - Shows what transplant workflow ownership can be worth after scale is proven
    - Commercial diagnostics economics are far removed from LifeMine’s current state
  - - Natera
    - Large public cfDNA diagnostics company and SEC filer
    - $38.0B-$38.01B market cap (Aug 2026)
    - Represents the outer ceiling for validated molecular-testing scale in transplant-adjacent care
    - Not a drug-discovery comparable; valuation mostly reflects broad commercial scale
  - - Enveda
    - Private nature-plus-AI drug discovery peer
    - Official news flow shows $150M Series D and unicorn-status headlines in 2025
    - Supports assigning some platform premium to nature-discovery stories
    - Different pipeline breadth and public evidence set; exact post-money not retained here
  - - Hexagon Bio
    - Private fungal / natural-product discovery peer
    - Retained news flow shows materially smaller disclosed financings than LifeMine
    - Useful check against overpaying simply for fungi-and-AI narrative
    - Older funding headlines and different pipeline orientation
  notes: This is a bracketing set, not a claim that any single comp should be used one-for-one. The purpose is to constrain narrative drift.
