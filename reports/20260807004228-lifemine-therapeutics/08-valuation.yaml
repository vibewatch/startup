- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Phase 1 package underwhelms
    - Meaningful safety, PK, or tolerability concerns emerge, or data remain too thin for transplant confidence
    - Base and bull cases compress because LIFE-001 is the whole story today
    - Downgrade to avoid pending re-underwriting
  - - Terms reveal heavy preference overhang
    - D/E rounds include strong liquidation stack, ratchets, or other structure unfavorable to new money
    - Even good science becomes unattractive at the wrong entry economics
    - Do not participate without a reset in price or protections
  - - Platform restart erodes focus
    - Operating plan expands faster than clinical proof and reintroduces 2025-style strain
    - Platform premium disappears and financing risk increases
    - Stay on watch only; avoid paying for broad optionality
  - - Transplant roadmap stays opaque
    - No named sites, no clear efficacy path, and no external champions emerge
    - Commercial and development timing risk remain too high for premium pricing
    - Hold off until there is visible center-level traction
  - - Macro funding window tightens
    - Selective biotech markets worsen before LifeMine reaches de-risking milestones
    - Down-round risk rises sharply for an early-stage single-asset story
    - Require a materially lower entry price
  notes: Each trigger is monitorable from a diligence process or future company updates; none relies on vague sentiment alone.
