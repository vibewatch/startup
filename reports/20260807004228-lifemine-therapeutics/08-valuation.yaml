- id: valuation-methodology-and-comparables
  title: 'Methodology: public comps can anchor the band, but rNPV logic has to do most of the work'
  body: 'LifeMine does not belong in a normal revenue-multiple framework because there is no public revenue base to capitalize. The more appropriate method is a probability-weighted clinical valuation: start with the transplant-maintenance opportunity, discount heavily for early-stage failure risk, then layer in a measured platform premium rather than assuming the discovery engine is already monetizable. The closest public therapy reference retained here is Eledon, whose lead transplant program is more advanced and whose market cap sits around $0.26 to $0.267 billion. That is an imperfect but useful floor reference because it represents public pricing for a real transplant-immunology story. CareDx and Natera sit much higher at roughly $2.3 billion and $38 billion respectively, but those numbers mostly reflect proven commercial workflow ownership, diagnostics scale, and mature public-company disclosure rather than anything LifeMine already possesses. Private peers also argue for caution.
    Enveda’s official news flow shows that nature-meets-AI biotechs can still achieve unicorn-style pricing, while Hexagon’s smaller disclosed financings show the peer set spans a broad valuation range. The right answer is not to pick one comp; it is to triangulate across a low public-therapy comp, a high private platform comp, and a large discount for clinical and financing uncertainty.'
