  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-money-and-preferences
    missingEvidence: No retained public source provides authoritative D/E post-money valuation or full liquidation-preference mechanics.
    whyItMatters: Entry economics can dominate return outcomes in private biotech investing.
    diligencePath: Request executed term sheet, cap table, and any side-letter protections that affect new money.
    relatedQuestionRefs:
    - QV007
    - QV021
    - QV027
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Current cash, burn, and milestone-adjusted runway are not public in the retained evidence set.
    whyItMatters: Future dilution risk cannot be modeled responsibly without runway visibility.
    diligencePath: Request monthly burn, budget-to-actuals, and runway bridge to the next three planned milestones.
    relatedQuestionRefs:
    - QV016
    - QV024
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: full-human-data
    missingEvidence: Open evidence does not include a full independent Phase 1 data package for LIFE-001.
    whyItMatters: The clinical discount rate is the single most important input in the valuation model.
    diligencePath: Request full safety, PK/PD, dose-escalation, and discontinuation detail from investigators or the company.
    relatedQuestionRefs:
    - QV004
    - QV014
    - QV023
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: minor
    topic: partner-economics-and-encumbrances
    missingEvidence: Current GSK economics, rights scope, and any IP or field encumbrances are not clear from retained public materials.
    whyItMatters: Strategic-partner value should not be credited without knowing what value remains for new investors.
    diligencePath: Request collaboration summary, rights schedule, and IP-ownership / encumbrance memo.
    relatedQuestionRefs:
    - QV017
