    severity: minor
    topic: comparable-sample-bounds
    missingEvidence: TV004 is a bracketing sample rather than an exhaustive global comparable set, and some private peers lack fully transparent valuation terms.
    whyItMatters: Comparable analysis can drift if investors mistake sampled peers for a complete market map.
