- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Post-money and preference stack
    - Exact D/E valuation, share count, preference order, participation, and ratchets
    - Entry economics can overwhelm company quality in a private round
    - Request term sheet, cap table, and side-letter summary
  - - Runway and burn
    - Current cash, burn, and milestone-based runway bridge
    - Determines whether LifeMine can reach value-inflecting data without forced dilution
    - Request board-approved operating plan and monthly burn summary
  - - Full Phase 1 data package
    - Granular safety, PK/PD, discontinuations, and dose logic
    - Needed to test whether LIFE-001 really earns a differentiated risk discount vs tacrolimus
    - Request investigator deck, poster, or manuscript
  - - Transplant site roadmap
    - Named sites, PIs, and timeline into transplant efficacy settings
    - Separates abstract enthusiasm from executable development plan
    - Request planned-site list and investigator references
  - - Partner economics / encumbrances
    - Current GSK status, milestones, rights, and any field or IP encumbrances
    - Partner value cannot be underwritten from headlines alone
    - Request collaboration summary and IP-ownership memo
  notes: These five asks are the minimum packet needed to move from a narrative judgment to an investment judgment.
