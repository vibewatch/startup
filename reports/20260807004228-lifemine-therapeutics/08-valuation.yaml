company:
  name: LifeMine Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: 'LifeMine has regained financing momentum, but public evidence still supports a price-sensitive watch/track call rather than an underwriting-grade buy. Official 2026 disclosures confirm a combined $263 million D/E package and $558 million total capital raised, while secondary-market data from Forge suggest a much lower roughly $470 million Series E valuation marker than the unsupported $1.3 billion figure in the user prompt. The most relevant public therapy comp, Eledon, trades near $0.26 billion with a more advanced transplant program; the transplant-workflow leaders CareDx and Natera trade far higher only because they already proved commercialization at scale. On open evidence, a conservative fair-value band is roughly $0.4 to $0.7 billion, a bear case is $0.15 to $0.3 billion, and a bull case reaches $0.9 to $1.3 billion only if LifeMine converts Phase 1 safety into credible transplant efficacy and reactivates the broader platform without losing focus. Recommendation: watch/track;
    confidence: medium-low; risk: high; valuation stance: stretched above the mid-hundreds of millions until term-sheet transparency and stronger clinical proof arrive.'
sections:
- id: valuation-context-and-price-discovery
  title: Valuation context and price discovery remain the core problem
  body: 'LifeMine is easier to like as a company story than to underwrite as a price today. Official and company-linked 2026 disclosures clearly support the existence of a large recapitalization package: a $75 million Series D, a $188 million Series E, and $558 million in cumulative disclosed capital. Those same sources make the strategic narrative legible: management cut scope in 2025, pushed LIFE-001 into the clinic, then reopened the platform once new capital arrived. What they do not provide is an authoritative post-money valuation, cap-table detail, liquidation preference stack, or current cash runway. That omission matters because LifeMine is still pre-revenue and early-stage; price is the decision variable, not just company quality. The only retained secondary source that offers a direct valuation marker is Forge, which shows a July 2026 Series E valuation around $469.78 million and total funding around $522.71 million, but those figures conflict with the company-linked $263 million
    package and $558 million lifetime total. The result is a wide confidence interval around entry value. Public evidence validates financing access and investor quality, but it does not yet validate a clean unicorn mark. In this chapter, valuation therefore has to be framed as a range with explicit uncertainty, not as a precise point estimate.'
