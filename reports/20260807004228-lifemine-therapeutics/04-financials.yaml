- id: funding-history
  title: Funding history is clearer than valuation or economics
  body: 'LifeMine’s financing chronology is unusually well signaled for a private biotech even though the underlying economics remain opaque. The 2022 Series C and GSK alliance were both publicly announced. The August 2026 financing package then retroactively revealed a $75 million Series D closed in the fourth quarter of 2025 and a $188 million oversubscribed Series E completed in July 2026, for a combined $263 million disclosure. Goodwin and Yahoo/Business Wire say total capital raised now stands at $558 million, while BioPharma Dive rounded private financing to roughly $580 million. Secondary-market and company-database sources are directionally useful but not perfectly aligned: Crunchbase still looks stale at Series C, and Forge shows different round amounts and valuation figures from the official press-linked disclosures. That inconsistency means financing chronology is underwritable, but valuation history should be treated more cautiously.'
