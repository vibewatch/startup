company:
  name: LifeMine Therapeutics
chapter:
  number: 4
  title: Financials
  summary: 'LifeMine is still a pre-revenue private biotech financed by equity rounds and strategic-partner support rather than product sales. The public record is strong on financing chronology—$175 million Series C in 2022, a GSK collaboration with $70 million upfront economics, a previously undisclosed $75 million Series D in late 2025, and a $188 million Series E in 2026—but weak on the metrics that matter most for underwriting: current cash, burn, runway, debt, and detailed partnership economics. 2025 layoffs and Watertown consolidation prove that the earlier cost structure was not self-sustaining, while the 2026 recapitalization proves the company can still attract conviction capital. Net verdict: LifeMine is well-funded relative to many peers, but open-source financial visibility is too thin for a hard runway model.'
sections:
- id: revenue-architecture
  title: 'Revenue architecture: capital-funded, not product-funded'
  body: 'LifeMine should currently be treated as a capital-consuming R&D business rather than an operating company with revenue quality. No retained source discloses product sales, recurring collaboration revenue, or grant income. What is public is the capital stack: venture financing, strategic equity and collaboration support from GSK in 2022, and the later 2025-2026 financing restart around LIFE-001. That means the company’s near-term economics are driven by how efficiently it converts financing into clinical proof, not by how it prices or sells a product today. The most realistic future revenue paths are also stage-dependent rather than current: additional out-licensing or partnerships, milestone economics from collaborators, or direct commercialization only if transplant data are strong enough to justify a launch build.'
