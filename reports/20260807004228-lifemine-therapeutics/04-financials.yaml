- id: financial-verdict
  title: 'Financial verdict: funded, selective-market compatible, but still opaque'
  body: 'The financial verdict is constructive but limited by disclosure. LifeMine has clearly demonstrated financing access: public sources support large cumulative capital raised, strategic pharma validation, and a successful 2026 recapitalization after a painful 2025 reset. Those facts matter in a market that is rewarding later-stage proof and punishing unfocused platform stories. But the company still scores poorly on open-source underwriteability. There is no current cash balance, no burn disclosure, no clean view of partnership milestones beyond the GSK upfront, and no trustworthy public valuation consensus across official and secondary sources. Investors can confidently say LifeMine is not obviously starved for near-term capital; they cannot confidently say how long that capital lasts or what financing terms imply about the next round. The right posture is therefore to view financing strength as real, financial transparency as weak, and runway as unknown.'
