- id: cost-base-and-runway
  title: 'Cost base and runway: visible spend drivers, invisible cash balance'
  body: 'The best publicly visible cost signals are operational rather than accounting-based. LifeMine’s 2025 layoffs and consolidation into Watertown show that management had to reshape the cost base before the 2026 recapitalization. Lease disclosures tie the company to roughly 56,000 square feet at 66 Galen Street, and another development-data source points to a larger 117,645-square-foot buildout figure, although that higher number conflicts with clearer lease disclosures and should be treated cautiously. Clinical execution will also continue to consume cash: the company is running a Phase 1 study and publicly plans kidney-transplant and islet-cell studies for 2027. What remains missing is precisely what investors usually need most: current cash, monthly burn, annual opex split, capex commitments, vendor obligations, and any debt or royalty structures. Runway therefore cannot be modeled as fact from open sources; it can only be described as unknown.'
