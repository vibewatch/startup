- id: TI005
  title: Financial diligence blockers table
  columns:
  - Missing metric
  - Why it matters
  - Best current proxy
  - Why the proxy is insufficient
  - Diligence ask
  rows:
  - - Current cash balance
    - Determines solvency horizon
    - Large cumulative capital raised
    - Raised capital is not the same as remaining cash
    - Request latest balance sheet and unrestricted cash figure.
  - - Monthly / quarterly burn
    - Defines runway and capital efficiency
    - Layoff and facility signals
    - Operating cues do not reveal actual spend
    - Request trailing twelve-month opex and monthly cash burn.
  - - GSK milestone schedule
    - Could offset spend or cap upside sharing
    - $70M upfront package
    - Upfront economics reveal little about future payments
    - Request milestone and royalty terms.
  - - Preferred stack and valuation
    - Shapes dilution and investor returns
    - Conflicting database estimates
    - Secondary sources disagree materially
    - Request cap table and term summaries for D and E rounds.
  - - Facility obligations
    - Can create fixed-cost drag
    - Lease size disclosures
    - Square footage does not equal rent burden
    - Request lease payment schedule and TI commitments.
  notes: These blockers explain why the chapter can judge financing access but not cleanly model runway or return on capital.
