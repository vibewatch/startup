- id: drivers-and-constraints
  title: Why the market should move—and why it may resist
  body: 'The adoption case for LifeMine begins with calcineurin-inhibitor pain. Public sources consistently show that tacrolimus and cyclosporine remain deeply embedded in transplant maintenance, but that both come with tradeoffs. Drugs.com summarizes consensus guidance that tacrolimus is superior to cyclosporine for acute rejection prevention in multiple organ settings, yet also notes higher rates of post-transplant diabetes and neurological or gastrointestinal adverse effects. The FDA’s Prograf page adds serious malignancy and opportunistic-infection risk warnings, while open-access nephrotoxicity reviews and FAERS analysis show renal-injury signals remain a durable concern. That creates a real opening for a safer molecule if LIFE-001 can preserve efficacy. But the market will not move on toxicity narrative alone. Transplant clinicians already know tacrolimus well, real-world evidence is entrenched around incumbent regimens, and regulators and centers will likely want convincing long-duration
    graft and safety data before rewriting protocols. Competing innovation also exists: Eledon’s tegoprubart pipeline shows that kidney and islet transplant alternatives are already in human development, so LifeMine is not attacking a whitespace market.'
