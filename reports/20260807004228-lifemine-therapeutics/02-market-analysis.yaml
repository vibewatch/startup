company:
  name: LifeMine Therapeutics
chapter:
  number: 2
  title: Market Analysis
  summary: 'LifeMine’s practical market is not “all immunology”; it is the concentrated transplant-immunosuppression stack where surgeons, transplant nephrologists, pharmacy committees, and payers manage lifelong calcineurin-based regimens for organ recipients. Public data support a real but bounded opportunity: the global system performed a record 173,727 solid-organ transplants in 2024, the U.S. exceeded 48,000 annual transplants in 2024, and management argues most U.S. transplant activity is concentrated in roughly 70 centers. That combination creates a market with meaningful unmet need because tacrolimus and cyclosporine carry renal, metabolic, infectious, and monitoring burdens, but it also caps LifeMine’s near-term SAM to a high-friction, evidence-sensitive specialty market rather than a broad mass-prescribing category.'
sections:
- id: market-boundary
  title: What market LifeMine is actually attacking
  body: The correct market boundary for LifeMine is the transplant-maintenance immunosuppression workflow, especially kidney transplantation first and islet-cell transplantation second, rather than the entire universe of autoimmune or inflammatory disease treatment. Official LifeMine materials emphasize LIFE-001 for prevention of organ transplant rejection and frame future autoimmune use as optional later expansion, not as the present commercial wedge. That matters because the status quo is not a blank slate; it is a well-developed regimen architecture centered on tacrolimus or cyclosporine plus other immunosuppressants, delivered at specialized transplant centers and tightly managed by transplant physicians and pharmacists. The kidney.org patient education page underscores that transplantation is one of only two replacement options for kidney failure and that recipients need medications every day after transplant, reinforcing that this is a lifelong maintenance market rather than a short
    acute-treatment market. In other words, LifeMine is pursuing a narrow but recurrent specialty market where persistence, safety, and monitoring matter more than raw prescription volume.
  claimRefs:
  - CM001
  - CM004
  - CM005
  - CM006
  - CM015
  - CM016
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sizing-lenses
  title: Evidence-constrained sizing lenses
  body: 'Public evidence supports multiple sizing lenses, but none alone should be mistaken for final TAM. The broadest lens is global: the WHO-linked Global Observatory report says 173,727 solid-organ transplants were performed worldwide in 2024, the highest number ever reported. The U.S. lens is materially smaller but more commercially relevant for LifeMine’s first launch path. UNOS and HRSA both reported that U.S. organ transplants exceeded 48,000 in 2024, while SRTR’s annual-report landing page separately describes 2024 as a year with more than 45,000 U.S. transplants and emphasizes continuing waitlist pressure. A third lens is commercial concentration rather than procedure count: Verdine told Fierce that most U.S. transplants are performed at about 70 centers, implying a much more concentrated go-to-market footprint than the national procedure count alone suggests. A fourth, deliberately narrow lens is LifeMine’s own initial development scope: a 150-patient kidney-transplant Phase 2
    concept and a 12-patient islet-cell Phase 1b concept. The practical conclusion is that LifeMine’s near-term SAM is likely small in absolute patient count but unusually concentrated and economically important per center.'
