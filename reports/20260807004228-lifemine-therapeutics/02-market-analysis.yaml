  rows:
  - - Kidney-transplant maintenance immunosuppression
    - Lifelong anti-rejection therapy after kidney transplant
    - Dialysis before transplant
    - Transplant centers, hospital pharmacy, public/private payers
    - Primary launch wedge and highest-volume transplant use case.
  - - Islet-cell transplantation immunosuppression
    - Specialized anti-rejection regimens for islet recipients
    - General diabetes drug therapy
    - Top transplant centers, specialty teams, payers
    - Small but strategically visible proof-of-concept niche.
  - - Other solid-organ transplant maintenance
    - Heart, liver, lung, pancreas, intestine transplant immunosuppression
    - Autoimmune maintenance outside transplant
    - Specialized centers and payers
    - Longer-term adjacency if LIFE-001 data generalize beyond kidney/islet.
  - - Autoimmune calcineurin modulation
    - Potential later ulcerative colitis or other immune-mediated uses
    - Broad biologics/JAK inhibitor markets today
    - Specialists and payers in non-transplant settings
    - Management cites as future option, not current SAM.
  - - Platform out-licensing / partnerships
    - Discovery partnerships around additional calcineurin or fungal-derived assets
    - General biotech platform licensing unrelated to transplant
    - Large pharma partners
    - Strategic upside but not the core therapeutic market underwritten here.
  notes: Boundary centers on transplant-maintenance workflows and explicitly excludes broad immunology TAM inflation from the primary market definition.
