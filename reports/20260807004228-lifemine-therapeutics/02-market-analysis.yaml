- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow / budget owner
  - Adoption trigger
  rows:
  - - Kidney transplant centers
    - Transplant program leadership
    - Recipients, surgeons, nephrologists
    - Commercial insurers, Medicare, Medicaid
    - Center protocol and pharmacy budget; payer reimbursement overlays
    - Convincing graft-protection and safety data versus tacrolimus.
  - - Islet-cell transplant programs
    - Academic transplant centers
    - Highly selected recipients with specialist teams
    - Payers plus institutional support
    - Research-heavy protocol budget with specialty review
    - Visible proof of efficacy in niche, high-acuity population.
  - - Hospital pharmacy / P&T
    - Pharmacy committee
    - Center clinicians
    - Hospital plus external reimbursement
    - Formulary access and protocol governance
    - Clear differentiation on toxicity or monitoring burden.
  - - Transplant physicians
    - Protocol influencers
    - Daily prescribers and monitors
    - Indirect via payer contracts
    - Clinical confidence and center-specific experience
    - Published data and peer-center adoption.
  - - Patients / caregivers
    - Indirect
    - Medication adherents and symptom reporters
    - Cost-sharing and insurance benefit design
    - Out-of-pocket burden plus daily adherence reality
    - Better tolerability and simpler long-acting regimen.
  notes: Buyer and user are not the same in transplant; concentrated institutional protocols shape which drugs patients actually receive.
