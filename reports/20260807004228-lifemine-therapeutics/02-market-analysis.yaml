- id: buyers-users-and-payers
  title: Buyer, user, and payer map
  body: The transplant market is multi-actor but not diffuse. The end users of a next-generation calcineurin inhibitor are recipients and their clinical teams, yet the practical buyers are transplant centers, pharmacy and therapeutics committees, transplant surgeons, nephrologists, and hospital specialty pharmacists who set protocol choices. Payers matter, but their role is filtered through center protocols and guideline-driven transplant practice. Drugs.com’s professional monograph highlights that tacrolimus choices already vary by transplanted organ, center-specific protocols, provider expertise, insurance and cost issues, and patient tolerability. The resulting adoption path is not mass-market primary care; it is evidence-led account selling into a finite set of highly specialized institutions. That concentration is a double-edged sword. On the positive side, a small commercial team can cover the market if clinical data are compelling. On the negative side, a few skeptical centers, a
    conservative transplant consensus, or poor protocol fit can meaningfully slow adoption.
  claimRefs:
  - CM018
  - CM019
  - CM021
  - CM024
  - CM025
  - CM027
