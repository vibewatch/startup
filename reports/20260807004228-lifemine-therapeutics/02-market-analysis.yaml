  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-and-budget-impact
    missingEvidence: No retained public source provides a center-level or payer-level budget-impact model for replacing tacrolimus with LIFE-001.
    whyItMatters: Without therapy-cost and reimbursement detail, market size cannot be converted into a credible revenue model.
    diligencePath: Build a bottom-up model with target transplant-center mix, regimen cost assumptions, reimbursement rules, and dose/frequency inputs.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: material
    topic: current-kidney-only-2024-flow
    missingEvidence: A clean open-source 2024 U.S. kidney-transplant-only count was not retained even though broader U.S. transplant counts were available.
    whyItMatters: A current kidney-only figure would sharpen the narrowest practical SAM lens for LifeMine’s first commercial wedge.
    diligencePath: Pull the current kidney chapter data directly from the underlying SRTR annual-report tables or downloadable spreadsheet.
    relatedQuestionRefs:
    - QM006
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: center-concentration-verification
    missingEvidence: The ~70-center concentration claim comes from management commentary rather than an independently retained center census.
    whyItMatters: Commercial build-out assumptions rely heavily on how concentrated transplant procedure volume truly is.
    diligencePath: Use OPTN center data to map the actual cumulative share of U.S. transplant volume by top centers and organ type.
    relatedQuestionRefs:
    - QM003
    - QM013
  - type: private-evidence-only
    severity: minor
    topic: company-tam-claim-validation
    missingEvidence: The $25B-$30B market-opportunity claim has no public bottoms-up support in retained sources.
    whyItMatters: Later valuation work could overstate upside if it accepts management TAM framing without procedure, pricing, and persistence support.
    diligencePath: Translate procedure counts into revenue ranges using transparent duration, adoption, and pricing assumptions.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM002
