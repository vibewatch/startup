- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Tacrolimus and cyclosporine toxicity burden
    - Driver
    - Current
    - Creates demand for safer CNI-like efficacy if LIFE-001 works
    - Quantify how much renal/metabolic burden clinicians would trade for new molecule risk.
  - - Lifelong maintenance after transplant
    - Driver
    - Current
    - Supports recurring therapy economics and high clinical importance per patient
    - Model adherence and long-term persistence assumptions.
  - - Concentrated U.S. transplant-center base
    - Driver
    - Current
    - Makes focused self-commercialization plausible with small field force
    - Enumerate actual target-center mix and decision-makers.
  - - Entrenched tacrolimus protocols
    - Constraint
    - Current
    - Status quo has massive experience base and protocol inertia
    - Understand center willingness to switch away from tacrolimus.
  - - Long-duration safety and graft-survival evidence requirement
    - Constraint
    - Medium term
    - Centers will likely demand robust proof before protocol change
    - Map expected endpoints, follow-up duration, and acceptable surrogate markers.
  - - Competing innovation such as tegoprubart
    - Constraint
    - Current
    - LifeMine is not the only company trying to improve transplant immunosuppression
    - Track competitor data cadence and organ-specific differentiation.
  - - Potential long-acting injectable convenience and organ sparing
    - Driver
    - Medium term
    - Could improve adherence and tolerability versus oscillating oral exposure
    - Request comparative PK/PD and administration-burden evidence.
  - - Lack of public pricing and budget-impact data
    - Constraint
    - Current
    - Prevents hard underwriting of payer adoption and center economics
    - Build a bottom-up reimbursement and budget-impact model.
  notes: Timing reflects when each factor can realistically influence adoption rather than when the issue first appeared in the literature.
