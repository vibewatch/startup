      - number: '1.5'
        title: Adverse signals, reset dynamics, and unresolved record tension
        blocks:
          - type: paragraph
            body: >-
              LifeMine’s most distinctive corporate feature is not just the fungal-genomics thesis; it is the visible
              freeze-and-thaw pattern around that thesis. Fierce Biotech reported in March 2025 that LifeMine laid off
              staff, rebalanced capital toward LIFE-001, and consolidated operations as it approached the clinic,
              without disclosing the number of affected employees or clarifying whether LIFE-001 had become the only
              active internal priority. By August 2026 the same outlet described Gates, Bezos, and RA Capital helping
              fund a platform revival, with Verdine explicitly saying the new money would let the company bring the
              platform back and rehire furloughed employees. That sequence supports a comeback narrative, but it also
              proves that the platform had not yet earned a self-sustaining capital position before LIFE-001 human data
              emerged. There are other unresolved tensions: current sources do not disclose valuation, public records
              disagree on whether the company should be thought of as a 2016 or 2017 founding, and the GSK collaboration
              is described in 2026 as having stalled after internal reprioritization even though GSK remains an
              investor. The net result is a company with unusually strong scientific ambition and investor signaling,
              but still with enough historical discontinuity that later chapters should underwrite execution rather than
              rhetoric.
