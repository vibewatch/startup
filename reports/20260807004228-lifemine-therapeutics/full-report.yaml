  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: What market LifeMine is actually attacking
        blocks:
          - type: paragraph
            body: >-
              The correct market boundary for LifeMine is the transplant-maintenance immunosuppression workflow,
              especially kidney transplantation first and islet-cell transplantation second, rather than the entire
              universe of autoimmune or inflammatory disease treatment. Official LifeMine materials emphasize LIFE-001
              for prevention of organ transplant rejection and frame future autoimmune use as optional later expansion,
              not as the present commercial wedge. That matters because the status quo is not a blank slate; it is a
              well-developed regimen architecture centered on tacrolimus or cyclosporine plus other immunosuppressants,
              delivered at specialized transplant centers and tightly managed by transplant physicians and pharmacists.
              The kidney.org patient education page underscores that transplantation is one of only two replacement
              options for kidney failure and that recipients need medications every day after transplant, reinforcing
              that this is a lifelong maintenance market rather than a short acute-treatment market. In other words,
              LifeMine is pursuing a narrow but recurrent specialty market where persistence, safety, and monitoring
              matter more than raw prescription volume.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM015
