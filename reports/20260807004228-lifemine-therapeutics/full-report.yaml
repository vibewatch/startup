      - number: '7.2'
        title: Regulatory and safety risk is unusually demanding in transplant immunosuppression
        blocks:
          - type: paragraph
            body: >-
              The transplant setting raises the safety bar. DailyMed’s Prograf label warns about malignancies and
              serious infections, FDA has continued to support tacrolimus label evolution through real-world-evidence
              pathways, and retained reviews describe nephrotoxicity, neurotoxicity, and long-term malignancy exposure
              as real risks inside calcineurin-based or broader immunosuppression practice. This creates a paradox for
              LifeMine. On one hand, incumbent toxicity gives the company a real opening if LIFE-001 is truly safer. On
              the other hand, that same history means regulators, investigators, and transplant centers will likely
              demand durable evidence that any new agent improves safety without compromising graft protection. A
              mechanistically novel drug in this category does not get a lower bar because it sounds better; if
              anything, it inherits a higher burden of proof.
            claimRefs:
              - CR007
