  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Clinical and translational risk remains the dominant company-level risk
        blocks:
          - type: paragraph
            body: >-
              LifeMine is still fundamentally a single-asset clinical-risk story. LIFE-001 is in Phase 1, and the
              kidney-transplant and islet-cell studies that would move the asset into its real commercial setting are
              still planned rather than completed. Company-linked safety and efficacy signals are encouraging, but they
              are still developer-described rather than independently peer-reviewed. That matters because the BIO
              success-rates report shows the overall likelihood of approval from Phase I is low, Phase II remains the
              biggest hurdle, and it takes years for a Phase I asset to reach approval even when it succeeds. LifeMine
              therefore faces the classic translational trap of platform biotechs: the underlying discovery engine may
              be compelling, yet the company still lives or dies on one product’s ability to reproduce its preclinical
              promise in humans.
            claimRefs:
