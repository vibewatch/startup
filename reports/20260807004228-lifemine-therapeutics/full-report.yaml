      - number: '1.3'
        title: Funding history, investors, and what is still undisclosed
        blocks:
          - type: paragraph
            body: >-
              LifeMine’s financing chronology is stronger than its operating disclosure. In 2022 the company announced
              $175 million of Series C funding led by Fidelity Management & Research together with a parallel GSK
              alliance that included $70 million of upfront cash and equity support. After that, public visibility
              thinned until the August 2026 financing announcement disclosed two separate late-stage rounds: a $75
              million Series D closed in the fourth quarter of 2025 and a $188 million Series E completed in July 2026.
              Goodwin and the Yahoo/Business Wire syndication say the combined 2026 disclosure totals $263 million and
              puts lifetime capital raised at $558 million, while BioPharma Dive rounded the private-financing total to
              roughly $580 million. The investor syndicate is notable for breadth and signaling power rather than for a
              public cap-table view: Milky Way Investments led the Series E, new investors included Bezos Expeditions,
              Gates Frontier, and RA Capital, and existing backers such as GV, LoLa Capital Partners, GSK, Invus, and
              ARCH Venture Partners continued to participate. What remains missing is as important as what is public: no
              retained source reviewed here discloses the post-money valuation, liquidation stack, ownership
              percentages, or any debt or structured-financing overlays.
