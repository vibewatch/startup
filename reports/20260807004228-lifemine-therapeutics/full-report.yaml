      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports multiple sizing lenses, but none alone should be mistaken for final TAM. The
              broadest lens is global: the WHO-linked Global Observatory report says 173,727 solid-organ transplants
              were performed worldwide in 2024, the highest number ever reported. The U.S. lens is materially smaller
              but more commercially relevant for LifeMine’s first launch path. UNOS and HRSA both reported that U.S.
              organ transplants exceeded 48,000 in 2024, while SRTR’s annual-report landing page separately describes
              2024 as a year with more than 45,000 U.S. transplants and emphasizes continuing waitlist pressure. A third
              lens is commercial concentration rather than procedure count: Verdine told Fierce that most U.S.
              transplants are performed at about 70 centers, implying a much more concentrated go-to-market footprint
              than the national procedure count alone suggests. A fourth, deliberately narrow lens is LifeMine’s own
              initial development scope: a 150-patient kidney-transplant Phase 2 concept and a 12-patient islet-cell
              Phase 1b concept. The practical conclusion is that LifeMine’s near-term SAM is likely small in absolute
              patient count but unusually concentrated and economically important per center.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM017
              - CM020
              - CM029
              - CM037
