  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Platform architecture: fungal genomes first, chemistry second'
        blocks:
          - type: paragraph
            body: >-
              LifeMine’s official technical story is not generic AI drug discovery. It is a specific workflow that
              starts with a very large fungal strain collection, reads biosynthetic gene clusters inside fungal DNA, and
              uses Embedded Target Genes as mechanistic clues to infer what a hidden small molecule may be doing
              biologically before full downstream characterization. The science page says the company has 100,000
              deep-sequenced wild-type fungi spanning more than 25,000 species and that its platform integrates human
              genetics, genomics, bioinformatics, machine learning, and synthetic biology. This architecture is
              plausible in the context of the literature: multiple retained reviews argue that fungi remain a vast,
              underexploited natural-product reservoir, that silent or cryptic biosynthetic gene clusters can be
              activated, and that heterologous-expression and synthetic-biology workflows are increasingly important for
              turning genomic signal into molecules. LifeMine’s claim is that it has industrialized that logic into a
              proprietary discovery engine rather than leaving it as an academic method.
