  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: What competition means for LifeMine
        blocks:
          - type: paragraph
            body: >-
              LifeMine should not be benchmarked only against other AI or natural-product discovery companies. Its lead
              asset, LIFE-001, is now a transplant-immunology product story, so the most important competitive question
              is who controls the anti-rejection protocol at transplant centers today. Retained sources show three
              layers. First is the incumbent tacrolimus franchise—immediate-release Prograf, extended-release Envarsus
              XR, and the broader tacrolimus regimen ecosystem. Second is the innovation layer, where Eledon is the
              clearest direct transplant challenger with a more advanced clinical program in kidney transplantation and
              a different mechanism through CD40L blockade. Third is the adjacent platform layer: Hexagon and Enveda
              validate that nature-derived drug discovery still attracts serious capital and scientific talent, even if
              they do not currently attack the same transplant decision directly. CareDx and Natera add a fourth
              practical layer because transplant centers increasingly use diagnostics and monitoring tools that
              influence how quickly a new drug can be trusted.
            claimRefs:
              - CP001
