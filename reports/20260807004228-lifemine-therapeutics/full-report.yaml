      - number: '1.2'
        title: Founding, leadership, and governance picture
        blocks:
          - type: paragraph
            body: >-
              The public record around LifeMine’s founding is directionally consistent but not perfectly clean. A 2022
              Fierce 15 company release says LifeMine “was founded in 2017” by Gregory Verdine, Richard Klausner, and
              WeiQing Zhou, while Crunchbase records a 2016 founded date and includes Hingge Hsu among founders. A 2022
              MedCity article reconciles part of that tension by describing roots going back to 2016, with Klausner
              joining in 2017 around the company’s Series A launch. Gregory Verdine is the clear anchoring figure:
              co-founder, current CEO, and historically also identified as chief scientific officer, with prior academic
              standing at Harvard and a long record of founding biotech companies. Governance disclosure is materially
              thinner than financing disclosure. LifeMine publicly announced Jennifer Jarrett’s board appointment in
              October 2022 and third-party coverage in 2026 notes the hiring of Yves Zinggeler as chief commercial
              officer, but the full live board roster, committee structure, and current complete C-suite lineup are not
              fully enumerated in open sources. Key-person dependence therefore sits heavily on Verdine: he is the
              platform evangelist, the principal fundraising narrator, and the commercial strategy voice in most recent
              coverage.
