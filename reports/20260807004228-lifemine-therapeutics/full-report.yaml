            body: >-
              LifeMine is not yet a company with paying commercial customers in the normal sense. Its current real-world
              external adoption evidence comes from three places: human trial participation, strategic counterparties
              such as GSK, and the visible set of future transplant-center buyers that would evaluate LIFE-001 if the
              data become compelling. The buyer-user-payer split is important. Patients are the end users, but the
              practical customers are transplant centers, transplant nephrologists and surgeons, hospital pharmacies,
              and protocol committees that decide which anti-rejection regimen gets embedded in care. Payers matter, but
              they sit downstream of a highly specialized institutional workflow. That means LifeMine’s customer chapter
              is best read as a map of a concentrated future buyer system plus a thin current proof layer.
