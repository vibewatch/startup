        title: 'Revenue architecture: capital-funded, not product-funded'
        blocks:
          - type: paragraph
            body: >-
              LifeMine should currently be treated as a capital-consuming R&D business rather than an operating company
              with revenue quality. No retained source discloses product sales, recurring collaboration revenue, or
              grant income. What is public is the capital stack: venture financing, strategic equity and collaboration
              support from GSK in 2022, and the later 2025-2026 financing restart around LIFE-001. That means the
              company’s near-term economics are driven by how efficiently it converts financing into clinical proof, not
              by how it prices or sells a product today. The most realistic future revenue paths are also
              stage-dependent rather than current: additional out-licensing or partnerships, milestone economics from
