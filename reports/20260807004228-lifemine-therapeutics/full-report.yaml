        title: LIFE-001 is the technical wedge that must validate the platform
        blocks:
          - type: paragraph
            body: >-
              The pipeline page turns the discovery engine into one concrete product claim: LIFE-001 is a structurally
              and mechanistically novel, organ-sparing, immunophilin-independent calcineurin activation inhibitor
              delivered as a long-acting injectable. Company-linked sources say the molecule directly targets
              calcineurin rather than depending on immunophilin chaperones and is designed to avoid the organ damage
              associated with legacy calcineurin inhibitors such as cyclosporine, voclosporin, and tacrolimus. In
              product-technology terms, that matters because LifeMine is not merely offering a new screening hit; it is
              asserting a new way to preserve calcineurin biology while escaping the mechanistic baggage of the old
              class. The open-source technical question is not whether the concept is interesting—it clearly is—but
              whether that direct-binding, long-acting, organ-sparing design remains true under human pharmacology and
              transplant use.
