              universe is specialized, identifiable, and limited enough to support focused commercialization. But the
              company is still pre-proof on the metrics that matter most for adoption work: named production customers,
              pilot outcomes, repeat usage, center retention, and reference-quality clinical accounts. That forces later
              chapters to underwrite adoption primarily from market structure and buyer logic rather than from existing
              customer traction. The main customer risks are therefore concentration, protocol friction, and the
              possibility that no visible lighthouse center publicly champions LIFE-001 early. Until that changes,
              LifeMine’s customer story remains plausible but not de-risked.
            claimRefs:
              - CU019
              - CU023
              - CU028
              - CU029
              - CU031
              - CU032
              - CU034
              - CU035
              - CU036
              - CU037
      - number: '6.6'
        title: Exhibits
