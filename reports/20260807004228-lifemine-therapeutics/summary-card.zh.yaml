  topStrengths:
    - 差异化的真菌基因组发现引擎和 100,000 个深度测序菌株，让 LifeMine 的源头生物学故事比许多泛 AI 发现同行更有辨识度。
    - 2026 年融资重启规模大、投资人质量高，说明 LifeMine 经历明显收缩期后仍能吸引成熟资本。
    - 移植是集中度高的专科市场；如果拿出更好的钙调神经磷酸酶替代方案，不必铺开基层医疗渠道也能创造可观价值。
  topRisks:
    - LifeMine 事实上仍是一家单资产、Phase 1 生物科技公司，早期人体转化风险主导估值。
    - D / E 轮准确定价、清算优先权、当前现金跑道和合作伙伴经济条款都未公开，进入价格无法清晰承保。
    - 公开可比证据更支持数亿美元中段的基准情景，而不是独角兽估值；价格很容易跑在证据前面。
    - 在 LIFE-001 风险未降下来之前重新扩张更大的平台，可能重演 2025 年已经显现的聚焦和融资压力。
  unresolvedGaps:
    - 留存来源没有公开 Series D / Series E 准确投后估值、股数和清算优先权堆叠。
    - 目前没有完整独立的 Phase 1 数据包；公开证据中的安全性、PK/PD 和停药细节仍不完整。
    - 当前现金余额、烧钱速度、现金跑道和里程碑衔接未披露，限制任何严肃的稀释模型。
    - 具名移植研究中心、研究者和中心级支持者尚未得到公开确认。
    - 当前 GSK 经济条款、权利范围以及任何 IP 负担都不够透明，估值里很难放心计入。
