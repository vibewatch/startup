companyProfile:
  summary: >-
    LifeMine Therapeutics is a Watertown, Massachusetts-based clinical-stage biotechnology company focused on
    discovering and developing novel small molecules from fungal biodiversity. The company says it has assembled a
    fully genomicized collection of 100,000 deep-sequenced wild-type fungal strains spanning more than 25,000
    species and applies a top-down discovery stack across genomics, bioinformatics, machine learning, and synthetic
    biology. Its lead asset, LIFE-001, is an immunophilin-independent calcineurin modulator positioned for organ
    transplantation and other immune-mediated disorders, with an active Phase 1 study in healthy volunteers. In 2026
    LifeMine disclosed a combined $263M Series D / Series E financing package and $558M total capital raised,
    effectively restarting a platform that had been narrowed during a 2025 austerity period.
  foundingLocation: Cambridge, Massachusetts
  headquarters: Watertown, Massachusetts
  productSummary: >-
    LifeMine is building a clinical-stage transplant-immunology company on top of a fungal-genomics discovery engine.
    Today the investable product story is LIFE-001, a long-acting injectable calcineurin-pathway therapy aimed first
    at organ-transplant rejection prevention, with the broader platform serving as future pipeline optionality.
  customerFocus: >-
    Pre-commercial. The relevant future customers are transplant centers, transplant physicians, and strategic pharma
    partners rather than current paying enterprise accounts.
  businessModel: >-
    Pre-revenue biotech model funded primarily by venture equity. Near-term value creation depends on clinical
    de-risking of LIFE-001 and possible partnering or licensing economics; longer-term upside depends on approvals,
    milestones, royalties, or broader platform-derived assets.
  stage: clinical-stage private (Series E era)
  fundingStatus: >-
    Privately funded. Company-linked 2026 disclosures describe a $75M Series D and $188M Series E for $263M combined,
    bringing disclosed lifetime capital raised to $558M. Strategic and crossover support includes GSK historically and
    2026 participation linked to Bezos Expeditions, Gates Frontier, RA Capital, GV, Milky Way Investments, and ARCH.
    Exact post-money valuation, preference stack, burn, and runway remain undisclosed in retained open sources.
  disclosureProfile: private-undisclosed
  claimRefs: [CO004, CO005, CO007, CO010, CO012, CO013, CO026, CV001, CV002]
