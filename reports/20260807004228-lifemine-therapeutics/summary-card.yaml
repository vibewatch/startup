  topStrengths:
    - >-
      Differentiated fungal-genomics discovery engine with 100,000 deep-sequenced strains gives LifeMine a more
      distinctive source-biology story than many generic AI-discovery peers.
    - >-
      The 2026 financing reset was large and syndicate quality was strong, showing LifeMine can still attract
      sophisticated capital after a visible austerity period.
    - >-
      Transplant is a concentrated specialty market, so a superior calcineurin alternative could create meaningful value
      without requiring broad primary-care distribution.
  topRisks:
    - >-
      LifeMine is still effectively a one-asset, Phase 1 biotech, so early human translation risk dominates the
      valuation.
    - >-
      Exact D/E pricing, liquidation preferences, current cash runway, and partner economics are not public, making
      entry economics impossible to underwrite cleanly.
    - >-
      Public comparator evidence supports a mid-hundreds-of-millions base case more than a unicorn valuation, so price
      can outrun proof quickly.
    - >-
      Re-expanding the broader platform before LIFE-001 is de-risked could recreate the focus and financing strain
      visible in 2025.
  unresolvedGaps:
    - >-
      Exact Series D / Series E post-money valuation, share count, and liquidation-preference stack are not publicly
      disclosed in retained sources.
    - >-
      No full independent Phase 1 data package is available; safety, PK/PD, and discontinuation detail remain incomplete
      in open evidence.
    - Current cash balance, burn, runway, and milestone bridge are undisclosed, limiting any serious dilution model.
    - Named transplant study sites, investigators, and center-level champions are not publicly confirmed.
    - >-
      Current GSK economics, rights scope, and any IP encumbrances are not transparent enough to credit confidently in
      valuation.
