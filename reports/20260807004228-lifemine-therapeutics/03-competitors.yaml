- id: workflow-and-monitoring
  title: Workflow and monitoring competitors are complements that still matter
  body: CareDx and Natera do not replace immunosuppressants, but they matter because transplant adoption is not just a molecule decision. CareDx markets transplant products and services across the care journey, including AlloSure donor-derived cell-free DNA monitoring and AlloMap gene-expression surveillance. Natera markets organ-health tools built around Prospera dd-cfDNA rejection assessment and has public CMS-coverage evidence for broader solid-organ use. These companies therefore shape transplant workflow, standardize non-invasive surveillance expectations, and help centers formalize what evidence and monitoring infrastructure accompany regimen changes. For LifeMine, that means success is not only about beating tacrolimus on biology; it is also about fitting into a transplant-center operating model that increasingly expects biomarker-backed confidence.
