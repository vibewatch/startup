- id: platform-peers-and-moat
  title: Platform peers validate the thesis but not the transplant wedge
  body: 'Hexagon and Enveda matter most as proof that nature-based drug discovery is still investable and strategically legible. Hexagon’s current pipeline centers on oncology ADC payloads, while its science materials still point back to genome mining and novel mechanisms discovered through microbial biology. Enveda’s pitch is that nature’s chemistry remains mostly unread and that its platform makes that chemistry searchable at scale. Those stories overlap with LifeMine’s fungal-genomics ambition and compete for talent, partners, and investor attention. But retained sources do not show either company challenging LifeMine’s initial kidney- and islet-transplant wedge directly. LifeMine’s own moat claim therefore rests on a specific combination—100,000 deep-sequenced fungal strains, ETaG-style target inference, and an immunophilin-independent calcineurin program—rather than on generic use of AI in discovery. The open question is durability: discovery differentiation is meaningful, but it becomes
    a true moat only if the clinic confirms that LIFE-001 changes the transplant risk-reward equation.'
