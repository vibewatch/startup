- id: direct-therapy-competition
  title: 'Direct therapy competition: tacrolimus today, Eledon tomorrow'
  body: The direct therapy benchmark is harsher than LifeMine’s platform narrative. Prograf remains the reference tacrolimus brand for organ-rejection prevention across kidney, liver, heart, and lung transplantation, while Envarsus XR shows that incumbent transplant therapy can still innovate through formulation and convenience without changing the core mechanism. These products benefit from years of protocol familiarity, dosing know-how, and regulator-recognized real-world evidence. Eledon is the more relevant innovative rival because it is already running later-stage kidney transplant work with tegoprubart and argues publicly that there has been little innovation in transplant immunomodulatory therapy since tacrolimus. The important point is not that LifeMine and Eledon share the same mechanism—they do not—but that they compete for the same transplant-center willingness to adopt something safer or more durable than tacrolimus.
