- id: competitive-verdict
  title: Competitive verdict and what would change it
  body: 'The competitive verdict is mixed but understandable. LifeMine is differentiated in narrative form: no retained source shows another company pairing fungal genome mining, transplant biology, and a long-acting calcineurin activation inhibitor in exactly the same way. But differentiation is not dominance. In actual operating position, tacrolimus products still control the prescription slot, Eledon is further along in transplant-specific clinical validation, and diagnostic ecosystem vendors already sit inside the care pathway. That means the strongest near-term threat remains protocol inertia around tacrolimus, while the strongest medium-term innovation threat is Eledon. Hexagon and Enveda matter more for comparative platform credibility than for first-launch share. The chapter-level underwriting stance is therefore that LifeMine has a real opportunity to be meaningfully different, but it has not yet established a leading competitive position on public evidence.'
