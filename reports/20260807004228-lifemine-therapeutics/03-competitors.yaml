  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: head-to-head-center-feedback
    missingEvidence: No retained public source reports how transplant-center physicians compare LIFE-001 against tacrolimus or tegoprubart after reviewing actual data.
    whyItMatters: Competitive outcome in this market depends on a small number of high-influence centers rather than broad mass-market demand.
    diligencePath: Interview transplant nephrologists, surgeons, and pharmacy leaders at top-volume centers after sharing the emerging Phase 1 package.
    relatedQuestionRefs:
    - QP018
    - QP023
  - type: missing-source
    severity: material
    topic: eledon-comparative-efficacy-detail
    missingEvidence: Retained Eledon sources establish stage and strategic focus but do not provide a full retained dataset for efficacy versus tacrolimus protocols.
    whyItMatters: Without detailed comparator outcomes, it is hard to judge how high the innovative efficacy bar already is for LifeMine.
    diligencePath: Pull the underlying BESTOW and extension data package, investor deck, and conference materials for tegoprubart.
    relatedQuestionRefs:
    - QP008
    - QP009
    relatedTableRefs:
    - TP001
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: monitoring-fit
    missingEvidence: Public sources do not show how LIFE-001 would be integrated with existing CareDx or Natera surveillance protocols in practice.
    whyItMatters: Workflow compatibility can accelerate or slow transplant-center adoption even when the molecule itself is promising.
    diligencePath: Map protocol drafts showing how dosing, safety labs, and dd-cfDNA / GEP monitoring would be used alongside LIFE-001.
    relatedQuestionRefs:
    - QP013
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: minor
    topic: platform-peer-win-rates
    missingEvidence: Open sources do not provide a rigorous win-rate comparison for how often LifeMine, Enveda, Hexagon, or similar platforms convert scientific novelty into partnership or clinic-leading economics.
    whyItMatters: The narrative value of platform differentiation can be overstated if it does not convert into deal or development leadership.
    diligencePath: Benchmark partnerships, capital raised, stage progression, and attrition across a selected nature-derived discovery peer set.
    relatedQuestionRefs:
    - QP015
