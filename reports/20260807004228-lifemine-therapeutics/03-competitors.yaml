    - Workflow dependence on diagnostics vendors.
  - - Platform validation
    - Natural-product peers and past GSK-style partner screens
    - Investors and pharma compare discovery stories across platform startups
    - That fungal-genomics novelty converts into durable clinical value
    - Narrative competition for capital and partners.
  notes: Sticky layers show why even a differentiated molecule can lose if it does not fit the operating model already used by transplant centers.
