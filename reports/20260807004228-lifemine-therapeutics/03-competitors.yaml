    - Comparable or better rejection control with clearly better safety / convenience
    - Protocol inertia around tacrolimus.
  - - Formulation optimization
    - Extended-release tacrolimus options
    - Existing class comfort plus convenience improvements
    - Why a new molecule beats simply choosing a better tacrolimus format
    - Incumbent lifecycle management.
  - - Innovative transplant alternatives
    - Tegoprubart and similar programs
    - Visible transplant-focused development and center learning
    - That LIFE-001 is the superior innovation bet on efficacy, safety, or dosing
