    title: Recommendation summary table
    columns:
      - Dimension
      - Current read
      - Decision implication
    rows:
      - [Recommendation, research-more, "Continue diligence; do not underwrite a precise entry price yet."]
      - [Confidence, medium, "Scale and financing are real, but price-defining disclosures are incomplete."]
      - [Risk rating, high, "Debt layering and limited public valuation transparency widen downside uncertainty."]
      - [Valuation stance, unknown, "Public evidence does not supply a fresh, high-quality mark strong enough for a firm range."]
    notes: >-
      Summary reflects only the assigned prefetched evidence set; unknown means current price support
      is incomplete rather than automatically unattractive.
    claimRefs: [CV007, CV009, CV010, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence-supported view
      - What would change the view
    rows:
      - ["Investment thesis", "Scaled distribution, 283+ facilities, 17,256 retail touchpoints, and repeated access to outside capital suggest a platform with real operating density.", "Audited disclosures showing strong cash conversion and segment margins would strengthen conviction."]
      - ["Anti-thesis", "The assigned public evidence is stronger on financing headlines than on debt terms, margin quality, or a fresh disclosed equity mark.", "A primary priced financing document or IPO filing could convert valuation from unknown to underwritable."]
      - ["Decision pivot", "Secondary-market availability and debt extension show liquidity and funding access, but not whether today’s equity price already discounts the best case.", "A verified price, debt schedule, and customer/margin disclosure would move the chapter toward a buy or avoid call."]
    notes: >-
      The table separates business quality from price support; financing access is not treated as a
      substitute for valuation transparency.
    claimRefs: [CV001, CV004, CV006, CV007, CV011, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "IPO-style disclosures confirm strong cash conversion, manageable debt, and durable margins across the platform.", "Upside exists if the market rewards Infra.Market as a scaled, integrated building-materials platform; without a disclosed entry price, upside remains qualitative rather than underwritten.", "Execution misstep, weaker margins, or delayed listing would compress the case.", "Needs audited filings plus evidence that debt is bridging growth rather than masking weak cash generation."]
      - [Base, "Scale is real and capital access remains available, but valuation support stays incomplete.", "Most prudent stance is to watch and re-underwrite once a primary mark or public filing closes the information gap.", "Investors can overpay for scale when debt, concentration, and cash conversion stay partially opaque.", "Current evidence set fits this path because it proves operating breadth better than price."]
      - [Bear, "Debt dependence rises or IPO timing slips before primary disclosures resolve unit economics and balance-sheet quality.", "Without price visibility, downside can come from both multiple compression and balance-sheet stress.", "Debt overhang, poor cash conversion, or a richly priced pre-IPO round could impair returns.", "Independent debt-financing coverage and secondary liquidity are caution flags until fuller disclosure arrives."]
    notes: >-
      Scenario logic is qualitative because the assigned pool does not include a current audited
      valuation framework, cap-table stack, or comparable-multiple deck.
    claimRefs: [CV004, CV006, CV007, CV008, CV009, CV010, CV012]
