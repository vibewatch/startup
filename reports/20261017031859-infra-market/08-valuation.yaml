  evidenceGaps:
    - type: missing-source
      severity: material
      topic: valuation-support
      missingEvidence: A primary priced financing document, IPO filing, banker deck, or other disclosed valuation mark from 2025-2026.
      whyItMatters: Without a fresh price anchor, the chapter can rank evidence quality but cannot underwrite a precise entry range.
      diligencePath: Obtain audited IPO materials or a recent primary financing document with valuation, share class, and terms.
      relatedQuestionRefs: [QV003, QV007]
    - type: private-evidence-only
      severity: material
      topic: debt-financing
      missingEvidence: Debt schedule, covenant package, amortization profile, security package, and explicit use-of-proceeds for the Mars Growth Capital facility.
      whyItMatters: Debt can amplify downside if growth slows, listing timing slips, or cash conversion is weaker than headline scale suggests.
      diligencePath: Request lender presentation, board materials, and management commentary that break out debt terms and repayment assumptions.
      relatedQuestionRefs: [QV004, QV008]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Segment-level gross margin, cash conversion, customer concentration, and working-capital detail by channel.
      whyItMatters: These metrics determine whether scale deserves a premium multiple or only supports a cautious watch stance.
      diligencePath: Review audited financial schedules or IPO draft disclosures that reconcile revenue, margin, receivables, and operating cash flow.
      relatedQuestionRefs: [QV008]
