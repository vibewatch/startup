        - label: "Adjacencies"
          detail: "Independent profiles describe the platform as extending beyond core material trading into broader project support."
          outputs:
            - "Equipment marketplace"
            - "Project financing support"
            - "Construction consulting or related services"
        - label: "Control layer"
          detail: "Public disclosures mention in-house technology and quality assurance, but not the underlying software stack or control framework."
          outputs:
            - "Supply-chain and sales optimization"
            - "Quality and timely-delivery positioning"
            - "Undisclosed status, SLA, and security-control detail"
    approximationNotes: "This figure is an operating-model synthesis from public evidence, not an internal systems diagram."
    claimRefs: ["CE001", "CE004", "CE005", "CE006", "CE007", "CE014"]
callouts:
  - calloutType: "strength"
    title: "Operational integration is the main product moat"
    body: "The public record suggests Infra.Market's defensibility comes from combining category breadth, manufacturing control, brands, and channel reach, not from a standalone software product with a visible developer ecosystem."
    claimRefs: ["CE001", "CE004", "CE006", "CE007", "CE012", "CE013"]
  - calloutType: "risk"
    title: "Trust-and-control evidence is materially thinner than asset-and-channel evidence"
    body: "Public disclosures are strong on footprint and product breadth but weak on software architecture, security/privacy controls, support SLAs, and reliability metrics, which keeps technical diligence from closing on public materials alone."
    claimRefs: ["CE014", "CE015"]
