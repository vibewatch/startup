            - 标准化产品减少协调工作
        - label: 零售补货
          actor: 零售门店、经销商、分销商下属经销商、分销商
          phase: B2R 分销
          touchpoints:
            - 通过网络化触点补充品牌及第三方材料库存
            - 本地可得性使其触达范围超出企业直销客户
        - label: 信任与品牌扩张
          actor: 复购客户和渠道合作伙伴
          phase: 交叉销售
          touchpoints:
            - 多品牌组合定位
            - 通过更广的品类覆盖建立客户忠诚与信任
        - label: 钱包份额循环
          actor: 现有企业客户和渠道客户
          phase: 扩张
          touchpoints:
            - 增加邻近品类，而不是局限于一次性单一材料采购
            - 规模化故事取决于可靠性是否能转化为重复订单
    claimRefs:
      - CU002
      - CU003
      - CU009
      - CU010
