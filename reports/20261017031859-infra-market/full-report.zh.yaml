      - number: '6.3'
        title: 持久性、扩张质量与集中度仍是关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              证据基础对触达远强于对留存。独立评论认为，Infra.Market 靠掌握可靠性、标准化和物流取胜，而不只是撮合买卖双方，这支持先落地再扩张的逻辑。但保留的来源没有披露
              NRR、GRR、流失、续约节奏、合同期限或头部客户占比，因此尚无公开验证表明运营覆盖会转化为持久的账户经济性。2025
              年股权加债务的融资节奏表明扩张仍在积极融资，而客户层面的盈利和集中度依然不透明。实际尽调必须从渠道宽度推进到账户质量，才能真正评估客户持久性。
