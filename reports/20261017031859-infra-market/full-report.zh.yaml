        title: 缓释措施、监控指标与尽调闸门
        blocks:
          - type: paragraph
            body: >-
              可见的缓释措施真实存在，但并不完整。Infra.Market 已融资股权和债务，建成大型制造基础，并朝 IPO
              准备推进，说明公司能够大规模执行。证据池没有解决的问题，是公司是否有足够的契约余量、工厂层面的合规纪律和关联方流程，在市场窗口变化时控制下行风险。                           
              实际否决条件很清楚：借款增加而利润不恢复；IPO 材料无法核对估值历史或发起人关联参与；以及运营复杂度超过质量和治理控制能力。这些是投资者在按公开市场估值做判断前最该追问的事项。
