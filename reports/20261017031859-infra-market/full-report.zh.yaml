        title: 受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              指定证据池没有方法透明、达到分析师标准的 TAM/SAM/SOM 测算。唯一较宽泛的自上而下数字，是 2025 年 6 月融资报道引用的印度建材市场 $255
              billion；但它来自公司关联报道，而非独立市场模型。更稳妥的做法，是将这一宽泛代理值与公开运营密度信号配对：覆盖 22 个邦的 283+ 家制造设施、17,256 个零售触点，以及 2025 年 6
              月独立来源仍指向的 250+ 个单元和 10,000+ 个触点。              这些指标说明 Infra.Market
              已触达全国性的多品类需求面，但仍只是运营覆盖的代理值，不是需求曲线。因此，本章保留规模测算缺口，不把证据无法支持的公开 SAM 或 SOM 说成既定事实。
