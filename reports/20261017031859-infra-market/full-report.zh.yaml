  - id: TV002
    title: 正 / 反论点表
    columns:
      - 论点
      - 证据支持的判断
      - 什么会改变判断
    rows:
      - - 投资正论点
        - 分销规模、283+ 个设施、17,256 个零售触点，以及持续获得外部资本，显示这是一个拥有真实运营密度的平台。
        - 经审计披露若显示现金转化和分部利润率强劲，投资把握会提高。
      - - 反论点
        - 指定公开证据更能证明融资新闻，而非债务条款、利润质量或最新披露的股权估值标记。
        - 一份有明确价格的一级融资文件或 IPO 申报文件，可能把估值从未知变成可评估。
      - - 决策转折点
        - 二级市场可交易性和债务展期显示流动性及融资渠道，但不能说明今日股价是否已反映最乐观情景。
        - 经核实的价格、债务明细和客户 / 利润率披露，会把本章判断推向买入或回避。
    notes: 本表把业务质量与价格支撑分开；融资渠道不等于估值透明度。
