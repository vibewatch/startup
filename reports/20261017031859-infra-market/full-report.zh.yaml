  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争集合横跨既有采购方式、横向 B2B 同行与品类龙头
        blocks:
          - type: paragraph
            body: >-
              指定证据支持宽泛的竞争定义，而不是一份一对一数字竞争者名单。Ghar.tv 将传统现状描述为本地分销商、分散制造商、电话下单和难以规模化的关系网络；Inc42 较早的市场框架则将
              Moglix、IndustryBuying、OfBusiness 和 Power2SME 列为同一大领域的重要 B2B 电商同行。同时，Infra.Market
              自有材料和第三方资料将其定位为贯穿完整建筑生命周期的多品类建材平台，买方也会拿它与内部采购团队、经销商网络及单品类制造商比较，而不只是与软件驱动的市场平台比较。
