      - number: '4.4'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              最有证据支撑的财务判断是：Infra.Market
              拥有真实商业规模、多元化渠道覆盖，并持续获得贷款方和投资者支持，但公开证据仍未充分呈现投资者需要评估的资产负债表和利润率问题。收入质量应与混合型制造和分销同行比较，而不是与纯 SaaS 或纯
              marketplace 可比公司比较，因为独立数据库对公司的分类并不一致，而官方材料强调自有品牌和制造深度。             
              核心阻塞点没有变化：实际价格、分品类毛利率、营运资金节奏、债务条款和现金续航仍属非公开信息。
            claimRefs:
              - CI003
