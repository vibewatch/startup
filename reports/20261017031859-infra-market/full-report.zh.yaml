            body: >-
              看多逻辑很直接：Infra.Market
              已建立真实的分销密度、制造能力，并持续获得外部资本，这些都是后期工业平台的价值特征。反方逻辑同样清楚：本章公开证据对规模和融资新闻的支持强于对债务条款、现金转换质量、分部经济性或最新独立估值的支持。在这种情况下，情景分析比点估值更可靠。乐观情景需要审计披露确认运营密度能转化为持久利润率和可支持
