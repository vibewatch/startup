      - number: '2.3'
        title: 买方分层、采用路径与市场约束
        blocks:
          - type: paragraph
            body: >-
              公开证据指向两条不同的采用路径。B2B 方面，Infra.Market
              称自己直接向企业客户销售，并向商业及住宅地产、基础设施、工业等领域的项目现场交付；因此采购由集中式采购主导，供应可靠性和现场直送比消费者拉动更重要。B2R
              方面，公司触达数千家零售门店、经销商、次级经销商和分销商，因此本地可得性、品类宽度及营运资金周期，比单一企业采购委员会更关键。当前证据池中的增长驱动因素，是品类扩张、用品牌产品统一质量，以及持续进入基础设施和工业需求。核心约束则是证据质量：公开来源没有把预算负责人、转化周期或各客群的支出拆分到足以支撑分层
              ROI 或自下而上的 SOM。
