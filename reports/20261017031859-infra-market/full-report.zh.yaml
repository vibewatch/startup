      - number: '3.3'
        title: 商业优势依靠节省和服务来主张，但公开价格仍稀薄
        blocks:
          - type: paragraph
            body: >-
              指定证据池中的价格比较不完整，因此最稳妥的商业判断只能是方向性的，而非定论。Inc42 报道 Infra.Market 声称客户平均节省 5%-7%，并提供可负担的信贷、即时报价、交付追踪以及接近 90%
              的客户重复购买率；这些都指向以服务为核心的采购模式，而非公开自助式价目表。它可能帮助公司对抗分散的线下采购，但同一证据包没有提供所列横向同行的当前公开价格或合同条款，也没有提供材料品牌龙头
              的品类价格。因此，                            尽管公司对流程、服务和采购篮子宽度的主张总体有利，切换后的经济性仍未完全厘清。
            claimRefs:
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: 护城河能否持久取决于执行质量、资本获取和避免商品化
        blocks:
          - type: paragraph
            body: >-
              指定证据池中最强的反向证据，并不是某个直接竞争者已经取代 Infra.Market，而是该模式在运营和财务上都要求很高：一旦执行失误，持久优势就会收窄。Ghar.tv
              认为，扩张分布式制造和分销体系会提高对质量一致性、现金转换、应收账款质量、偿债和治理的要求。Times of India 与 Tech in Asia 均报道了 2025 年 6 月 Mars Growth
              Capital 的债务融资，这支持规模和广度能够形成壁垒的判断，但也确认该品类增长需要大量外部资本。             
              因此，护城河更可能因营运资金压力、质量不一致或品类龙头厂商更强的反应而被侵蚀，而不是仅仅因功能被复制。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与商业覆盖
        blocks:
          - type: paragraph
            body: >-
              指定证据始终将 Infra.Market 描述为实体商品平台，而非软件订阅业务。官方页面称公司覆盖建筑生命周期中的结构、装修、生活方式及相关品类，并通过两条路径变现：直接向项目现场进行 B2B
              销售，以及通过大型经销商和零售网络做 B2R
              分销。公司材料还称，产品组合越来越依靠自有品牌和制造；因此收入质量取决于品类组合、采购纪律和物流执行，而不是经常性软件抽成。本章因此可以建立有证据支撑的收入端桥接，但无法建立公开的毛利润桥接。
            claimRefs:
              - CI001
