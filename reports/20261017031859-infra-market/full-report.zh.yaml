            body: >-
              Infra.Market 官方页面将其描述为技术赋能的建材平台，覆盖结构产品、装修材料、生活方式产品及相关服务，服务项目全生命周期中的承包商、开发商和零售商。公司发布的同一组页面称，其网络目前包括覆盖印度 22
