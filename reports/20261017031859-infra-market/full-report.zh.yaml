  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与公司的实际服务对象
        blocks:
          - type: paragraph
            body: >-
              最清晰的当前定义来自 Infra.Market 自身：公司将自己定位为多品类建材平台，服务建筑全生命周期中的承包商、开发商和零售商，而不是单一品类市场。这一点很重要，因为较早的第三方资料仍把业务更狭义地归为
              B2B 采购市场，甚至电商市场；若不加判断地采用，可能扭曲可比公司集合和 TAM 框架。在指定证据池中，纳入的支出明显覆盖结构产品、装修材料、生活方式产品及相关分销，渠道同时包括 B2B 直供项目现场和 B2R
              零售。当前公开证据并没有为项目设计、融资、劳务或纯消费者家装支出划出清晰的相邻服务排除边界，因此这些部分不应纳入精确的市场规模主张。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
