      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本获取看得见，但资本充足性看不清。Tracxn 展示累计融资和 2025 年 Series G 估值点；独立的 2025 年 6 月报道称 Mars Growth Capital 延长了原有 $100
              million 授信额度，并新增 $50 million 债务。这支持 Infra.Market 仍能融资、且正在为更大规模融资或 IPO
              做准备的判断，但也意味着债务已成为当前投资判断的一部分。              由于公开资料没有现金余额、CFO 或
              burn、债务定价、契约、摊还和资金用途细节，现有证据更有力地支持“依赖融资”，而不是支持对资金续航的结论。
