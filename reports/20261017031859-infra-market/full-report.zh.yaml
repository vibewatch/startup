  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户组合覆盖项目直采和零售分销
        blocks:
          - type: paragraph
            body: >-
              已披露的客户模式比单一市场平台客群更宽。Infra.Market 主页将平台描述为服务承包商、开发商和零售商的多品类平台，并将这一覆盖面拆成企业直接 B2B 和 B2R 分销两条路径。B2B
              侧面向商业、住宅、基础设施和工业客户做现场直送；B2R 侧则通过零售门店、经销商、次级经销商和分销商扩张。2020 年启动 B2R 很重要，因为它说明公司有意增加第二个变现面，而不是始终停留在项目驱动的企业采购。
