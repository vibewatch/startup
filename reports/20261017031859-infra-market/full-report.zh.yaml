            body: >-
              当前公开记录显示公司仍由创始人主导。Foundlanes 将 2016 年 8 月的创立归于 Aaditya Sharda 和 Souvik Sengupta：Sharda 具备建筑贸易经验，Sengupta
              拥有特许会计师和金融背景。创始人以外的管理层信息更少：公司网站列出首席财务官 Manish Porwal 和两名品类总裁，但没有完整的董事会及委员会信息。本证据池显示资本形成规模不小，却不够精确。Inc42 列出
              Series G、2025 年 9 月的上一轮融资和 $740.44 million+ 的累计融资；Foundlanes 则引用 Tracxn 称 26 轮融资超过 $800
              million。最新得到清晰交叉验证的是 2025 年 6 月 Mars Growth Capital 债务融资包；它延长了上市前的资金缓冲期，但也提高了杠杆。
