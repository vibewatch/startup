            body: >-
              现有证据仍支持这样的判断：Infra.Market 是真实的规模化平台，而不是演示文稿里的故事。公司自有运营描述称，其已覆盖印度 22 个邦的 283+ 家制造设施和 17,256
              个零售触点；独立报道则确认，2025 年资本提供方仍愿意提供并扩大大型授信额度。             
              这对估值很重要，因为它说明公司拥有足够的运营覆盖、品类宽度和贷款方支持，值得继续尽调。但融资证据不等于价格证据：指定证据池更清楚地确认了债务和资本可得性，却无法同样清楚地确认当前股权定价、当前倍数或公开申报中的估值框架。
