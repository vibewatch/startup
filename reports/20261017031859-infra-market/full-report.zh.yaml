            body: >-
              基于这组证据，正确的判断不是否定 Infra.Market，也不是假装公开信息已足以支持紧凑的投资判断区间。             
              继续研究符合事实：公司规模和融资势头足以值得持续跟进，但已验证的价格细节太少，今天还不足以形成入场信心。需要打开判断的材料很实际：经审计的 IPO
              或一级融资文件、债务表和契约透明度、资金用途、客户集中度，以及分部利润率或现金转换披露。若这些披露证明基本面强，建议可以迅速上调；若它们暴露出现金转换疲弱、债务依赖，或当前价格已计入最佳情景，下行判断会更有说服力。
