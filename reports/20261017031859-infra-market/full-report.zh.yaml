      - number: '3.2'
        title: 差异化来自供应控制、渠道宽度和品牌分销
        blocks:
          - type: paragraph
            body: >-
              Infra.Market 最有证据支撑的差异化，是比典型纯市场平台控制供应链更多环节。官网称公司运营覆盖 22 个邦的 283+ 家制造设施，同时通过企业直销 B2B 和 B2R
              零售渠道销售，品类从结构材料延伸至生活方式产品。关于公司历史和 Ghar.tv 资料显示，公司还通过 RDC Concrete、Shalimar Paints、AAC blocks 及明确提出的
              品牌组合策略进一步加强整合。这些动作的竞争意义在于，它们嵌入了更多采购流程，扩大单次采购篮子的份额，也增加了把分销与自有或受控产品线捆绑的机会。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP010
