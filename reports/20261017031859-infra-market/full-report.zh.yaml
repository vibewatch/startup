            body: >-
              从运营看，Infra.Market 规模很大，也比狭窄的分销商更难控制。官方和第三方资料称，公司拥有超过 250 个制造单元、超过 10,000 个零售触点，覆盖广泛品类和品牌，并同时经营 B2B 与 B2R
              渠道。只有采购、质量、物流、定价和应收账款控制能同步扩张，这个运营覆盖才是护城河。公司还通过 RDC Concrete 和 Shalimar Paints
              把非有机扩张叠加到网络上，增加了整合和治理负担。外部分类仍在 marketplace 和制造模式之间分裂，说明分析师需要更清晰的分部和控制披露，才能把该模式视为简单或易于比较。
