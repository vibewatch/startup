  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - IPO 式披露证实平台现金转化强劲、债务可控，且各业务保持持久利润率。
        - 若市场将 Infra.Market 视为规模化、整合型建材平台，仍有上行空间；但在入场价未披露前，上行只能定性判断，不能作为投资判断依据。
        - 执行失误、利润率走弱或上市延期都会压缩该情景。
        - 需要经审计申报文件，以及证明债务是在承接增长而非掩盖现金生成疲弱的证据。
      - - 基准
        - 规模真实存在，融资渠道仍可用，但估值支撑仍不完整。
        - 最稳妥的做法是观望，待一级市场估值标记或公开申报文件补上信息缺口后再重新评估。
        - 债务、客户集中度和现金转化仍部分不透明时，投资者可能为规模支付过高价格。
        - 当前证据集更能证明运营广度，而不是价格合理性，因此符合这一情景。
      - - 悲观
        - 在一级披露解决单位经济和资产负债表质量问题之前，债务依赖上升或 IPO 时间表延后。
        - 在价格不可见的情况下，下行可能同时来自估值倍数收缩和资产负债表承压。
        - 债务负担、现金转化不佳或估值偏高的 IPO 前融资，都可能损害回报。
        - 独立债务融资报道和二级市场流动性在更完整披露到来前都是警示信号。
    notes: 由于指定证据池不含当前经审计估值框架、股权结构层级或可比倍数材料，情景逻辑保持定性。
    claimRefs:
      - CV004
      - CV006
