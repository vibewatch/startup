        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              首要风险不是需求不存在，而是 Infra.Market 能否在 pre-IPO 阶段承载更多债务和更复杂的披露要求，同时不损害盈利质量或估值可信度。公开来源显示，公司刚获得 $150 million
              债务融资包，并表示计划继续借款；FY25
              则出现收入仍强劲增长、净利润下降、财务费用上升的组合。同时，运营面足够大，小的质量控制、营运资金纪律或服务水平失误也会迅速扩散到制造单元、门店、品牌和渠道。因此，剩余风险排序首先是杠杆加 IPO
              执行，其次是运营控制，再次是治理和披露一致性。
