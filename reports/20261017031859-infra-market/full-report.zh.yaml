        - label: 融资渠道
          detail: Mars Growth Capital 于 2025 年提供的 $150M 融资延长了现有额度。
        - label: 二级流动性
          detail: EquityZen 表明，现有股东可以出售 IPO 前持有的股份。
        - label: 缺少新的价格锚点
          detail: 指定证据缺少当前的一手估值文件或同等效力的公开估值标记。
        - label: 资产负债表与退出风险
          detail: 债务展期，加上契约和现金转换披露不完整，扩大了下行不确定性。
        - label: 建议：继续研究
          detail: 继续尽调，但暂时不要据此确定精确的入场区间。
