    claimRefs: [CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Primary kill criteria
    body: >-
      Pause if FY26 profitability does not recover while borrowings rise, or if
      IPO materials fail to reconcile valuation history, promoter-linked
      participation, and planned refinancing.
    claimRefs: [CR004, CR006, CR007, CR009, CR014]
  - calloutType: recommendation
    title: Highest-priority diligence packet
    body: >-
      Request debt agreements and covenant headroom first, then plant-level
      permit and safety schedules, then board materials covering founder-linked
      financing and related-party governance.
    claimRefs: [CR003, CR007, CR008, CR015, CR016]
