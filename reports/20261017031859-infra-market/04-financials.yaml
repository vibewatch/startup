  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-realization
      missingEvidence: Public or management-provided realized pricing, discounting, rebate, and revenue-recognition detail by B2B versus B2R channel and by owned versus third-party brands.
      whyItMatters: Revenue quality and gross-margin durability cannot be assessed from channel labels alone.
      diligencePath: Request channel pricing waterfall, representative contracts or dealer terms, and accounting policy notes by product family.
      relatedQuestionRefs: [QI002]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin by category, logistics and service-delivery cost, inventory days, DSO, customer concentration, and CAC or payback proxies.
      whyItMatters: The business is operationally dense, so working-capital cadence and gross-margin dispersion likely drive valuation quality.
      diligencePath: Request audited segment economics, channel contribution margins, inventory and receivable aging, and top-customer concentration data.
      relatedQuestionRefs: [QI005]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: blocking
      topic: cash-runway
      missingEvidence: Cash on hand, CFO or burn trajectory, debt pricing and covenants, amortization schedule, undrawn facilities, and IPO or next-round use-of-proceeds plan.
      whyItMatters: Without these inputs, capital adequacy and financing dependency cannot be underwritten beyond a general statement that debt has expanded.
      diligencePath: Obtain treasury snapshot, debt agreements, covenant package, monthly cash-flow bridge, and board-approved financing plan.
      relatedQuestionRefs: [QI007, QI008]
      relatedTableRefs: [TI003]
