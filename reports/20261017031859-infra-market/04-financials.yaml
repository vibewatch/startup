      - ["Subsidiary / acquired category exposure", "Revenue breadth widened via RDC and Shalimar-linked categories", "Category contribution", "Portfolio breadth disclosed; category P&L not public", "Breadth is supportable but profitability by category is opaque", "Segment P&L and intercompany / recognition treatment"]
    notes: Public sources establish channels and portfolio breadth; null or generalized units mean the assigned evidence does not disclose a standardized external revenue unit or mix split.
    claimRefs: [CI001, CI002, CI003, CI008, CI013]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Route
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["B2B direct channel", "Project-specific quotation implied by direct-to-site corporate sales model", "No public list pricing in assigned sources", "Volume rebates, payment terms, and recognition policy not disclosed", "Infra.Market homepage; StartupTalky profile"]
      - ["B2R retail network", "Dealer / distributor pricing implied by touchpoint network", "No public list pricing in assigned sources", "Dealer margin, financing support, and returns economics not disclosed", "Infra.Market homepage"]
      - ["House-of-brands portfolio", "Brand-led product monetization across multiple categories", "Public category breadth is clear; SKU-level realized pricing is not", "Mix by owned brand versus third-party brand is not public", "Infra.Market homepage; Tracxn"]
      - ["Debt capital", "$100M facility extension + $50M additional line / investment in June 2025", "Capital pricing is observable as debt usage rather than customer pricing", "Interest rate, security, covenants, and amortization are not public", "Times of India; Tech in Asia"]
    notes: This table separates customer monetization from capital pricing; “No public list pricing” means the assigned successful fetches did not expose public SKU or contract-rate schedules.
    claimRefs: [CI002, CI006, CI007, CI009, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["FY24 operating scale and profit proxy", "INR 14,530 crore revenue; INR 378 crore profit", "Medium", "Shows that disclosed scale is large but profit disclosure is still thin relative to turnover", "Audited FY25 consolidated revenue EBITDA PAT and CFO bridge"]
      - ["FY25 current-year public revenue proxy", "₹6,202.7 Cr+ (Hella Infra Market Limited, Inc42 Datalabs)", "Medium", "Suggests ongoing scale but may not equal consolidated group revenue", "Consolidated FY25 revenue and segment split with entity mapping"]
      - ["Physical-network intensity", "283+ manufacturing facilities; 17,256 retail touchpoints", "Medium", "Indicates working-capital, logistics, and execution intensity likely matter to margins and cash conversion", "Owned versus third-party capacity split inventory days and logistics cost"]
      - ["Capital structure signal", "$150M June 2025 debt package plus continued equity access", "Medium", "Supports financing capacity but also raises leverage and covenant questions", "Debt schedule interest cost covenants security and use of proceeds"]
      - ["Cash / runway", null, "Low", "Runway cannot be underwritten from the assigned public evidence", "Cash on hand undrawn facilities monthly burn or CFO and next-round trigger"]
    notes: Numerical fields are copied from assigned public sources; null marks data that remains undisclosed in the prefetched evidence rather than zero.
    claimRefs: [CI004, CI005, CI007, CI008, CI009, CI010]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports a manufacturing-plus-distribution bridge into B2B and B2R sales, but not a public gross-profit or runway bridge.
    data:
      nodes:
        - label: 283+ manufacturing facilities
          note: 163 owned and 120 exclusive third-party manufacturing units across 22 Indian states on the current company page.
        - label: 11-brand / multi-category portfolio
          note: Structural, finishing, lifestyle, and other categories across the project construction lifecycle.
        - label: B2B direct-to-site channel
          note: Official materials say the B2B channel primarily focuses on direct corporate sales.
        - label: B2R retail channel
          value: 17256
          unit: touchpoints
          note: Retail outlets, dealers, sub-dealers, and distributors.
        - label: Product-sales revenue realization
          note: Public evidence supports materials revenue tied to project and retail workflows rather than software ARR.
        - label: Public margin / cash disclosure gap
          note: Gross margin, DSO, cash balance, and debt covenants are not disclosed in the assigned evidence set.
    approximationNotes: The bridge is directional and source-backed on channel structure, but public evidence does not disclose conversion rates, gross-profit steps, or cash-flow spans.
    claimRefs: [CI001, CI002, CI003, CI008, CI009, CI011]
