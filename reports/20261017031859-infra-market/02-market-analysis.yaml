    notes: Public sources in the assigned pool support one broad top-down market proxy plus several footprint proxies; they do not support a transparent public SAM or SOM.
    claimRefs: [CM005, CM006, CM007, CM011, CM015]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - B2B direct corporate sales
        - Developers, EPCs, contractors, and other corporate customers
        - Site and project teams
        - Corporate customer / project owner
        - Direct-to-site procurement for commercial, residential, infrastructure, and industrial jobs
        - Central procurement or project commercial team; public source detail is limited
        - Reliable quality and timely deliveries across large construction workflows
      - - B2R retail network
        - Retail outlets, dealers, sub-dealers, and distributors
        - Retail trade, local builders, and contractors
        - Channel partner or point-of-sale buyer
        - Stocking and replenishment through a large retail footprint
        - Dealer working capital or local purchase budget; public source detail is limited
        - Product availability and breadth across structural to lifestyle categories
      - - Branded materials strategy
        - Channel partner or developer choosing house brands
        - Installer, builder, or retail customer
        - Same B2B or B2R payer as above
        - Standardized branded-material selection inside the same channel workflows
        - Category manager or procurement lead; no public cohort split
        - Greater consistency and predictability than fragmented unorganized supply
      - - External classification lens
        - Investors, trackers, and market observers
        - Research audiences and comparables analysts
        - Not an operating budget line
        - Marketplace / e-commerce / IPO-tracker categorizations of the business model
        - Not disclosed
        - Helps explain why peer sets and TAM labels drift across sources
    notes: Public sources distinguish B2B and B2R channel motions, but they do not provide a defensible budget-owner map or segment-level ROI by cohort.
    claimRefs: [CM003, CM004, CM010, CM013, CM014, CM016]
