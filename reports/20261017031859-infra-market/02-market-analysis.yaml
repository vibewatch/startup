        - India
        - 283+ facilities across 22 states
        - null
        - Official operating-footprint lens covering 163 owned and 120 exclusive third-party units.
        - High
        - Supply-side capacity proxy, not demand or spend.
      - - Infra.Market
        - "2026 access"
        - India
        - 17,256 retail touchpoints
        - null
        - Official B2R reach across retail outlets, dealers, sub-dealers, and distributors.
        - High
        - Channel-density proxy, not a revenue or budget measure.
      - - Tech in Asia / Entrackr
        - "2025"
        - India
        - 250+ units; 10,000+ touchpoints; 15+ categories
