          note: IPO-platform coverage cited second-place capacity positions plus top-RMC standing.
          claimRefs: [CM011]
    approximationNotes: >-
      Layers mix one broad market estimate with operating-footprint proxies because the assigned
      pool does not disclose a segmented public TAM/SAM/SOM; the pyramid shows ordered lenses, not
      a cumulative share calculation.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM011, CM015]
