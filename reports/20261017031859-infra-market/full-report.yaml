            Buyers keep direct control of supplier relationships, but coverage remains organization-specific rather than
            platform-wide.
        - label: Single-category incumbents
          x: 3
          'y': 4
          tone: medium
          note: >-
            Category brands can have deeper control in one line, while Infra.Market's distinction is multi-category
            breadth.
        - label: Retail / dealer channel
          x: 2
          'y': 2
          tone: neutral
          note: >-
            Dealer networks remain relevant in building materials; Infra.Market's own B2R footprint shows the channel
            still matters.
