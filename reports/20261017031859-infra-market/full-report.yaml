      - number: '3.3'
        title: Commercial advantage is claimed through savings and service, but public pricing remains thin
        blocks:
          - type: paragraph
            body: >
              The pricing comparison in the assigned pool is incomplete, so the strongest supported commercial read is
              directional rather than definitive. Inc42 reports that Infra.Market claimed average customer savings of
              5%-7%, affordable credit options, instant quotes, delivery tracking, and close to 90% customer repetition,
              all of which point to a service-heavy procurement model instead of a public self-serve price list. That
              may help against fragmented offline buying, but the same evidence pack does not contain current public
              pricing or contract terms for the named horizontal peers, nor category-level pricing for incumbent
              material brands. As a result, switching economics remain partially open even though the workflow, service,
              and basket-breadth claims are directionally supportive.
            claimRefs:
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: Moat durability depends on execution quality, capital access, and avoiding commoditization
        blocks:
          - type: paragraph
            body: >
              The strongest adverse evidence in the assigned pool is not that a direct rival has already displaced
              Infra.Market, but that the model is operationally and financially demanding enough to narrow its durable
              edge if execution slips. Ghar.tv argues that scaling a distributed manufacturing and distribution system
              raises the test of consistent quality, cash conversion, receivable quality, debt servicing, and
              governance. Times of India and Tech in Asia both reported the June 2025 Mars Growth Capital debt
              financing, which supports the view that scale and breadth can create barriers, but also confirms that
              growth in this category requires meaningful external capital. That combination means the moat is more
              likely to erode through working-capital strain, quality inconsistency, or stronger incumbent category
              responses than through simple feature replication alone.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and commercial surface
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently describes Infra.Market as a physical-goods platform rather than a
              software subscription business. Official pages say the company covers the construction lifecycle across
              structural, finishing, lifestyle, and related categories, then monetizes through two routes: direct B2B
              sales into project sites and B2R distribution through a large dealer and retail network. Company materials
              also say the portfolio is increasingly oriented around in-house brands and manufacturing, which matters
              because it implies that revenue quality depends on mix, procurement discipline, and logistics execution
              rather than on a recurring software take rate. That gives the chapter a supportable top-line bridge, but
              not a public gross-profit bridge.
