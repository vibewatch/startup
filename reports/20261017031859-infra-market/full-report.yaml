  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and capital access keep Infra.Market investable, but missing price anchors and debt overhang keep the call
      at research-more.
    data:
      nodes:
        - label: Operating scale
          detail: 283+ facilities, 22 states, 17,256 retail touchpoints.
        - label: Capital access
          detail: $150M Mars Growth Capital financing in 2025 extended an existing facility.
        - label: Secondary liquidity
          detail: EquityZen indicates existing shareholders have a path to sell pre-IPO exposure.
        - label: Fresh price anchor missing
          detail: Assigned evidence lacks a current primary valuation document or equivalent public mark.
        - label: Balance-sheet and exit risk
          detail: Debt extension plus incomplete covenant and cash-conversion disclosure widen downside uncertainty.
        - label: 'Recommendation: research-more'
          detail: Continue diligence, but do not underwrite a precise entry range yet.
