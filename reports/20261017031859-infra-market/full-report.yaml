      - number: '1.2'
        title: Leadership, capital, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The current public record is still founder-led. Foundlanes attributes the August 2016 launch to Aaditya
              Sharda and Souvik Sengupta, pairing Sharda's construction-trade experience with Sengupta's
              chartered-accountant and finance background. Public bench visibility beyond the founders is thinner: the
              company site names CFO Manish Porwal and two category presidents, but it does not provide a full board and
              committee view. Capital formation looks deep but imprecise in this pool. Inc42 lists Series G status, a
              September 2025 last round, and $740.44 million-plus of total funding, while Foundlanes cites Tracxn for
              more than $800 million across 26 rounds. The latest clearly corroborated financing is the June 2025 Mars
              Growth Capital debt package, which matters because it increases leverage even as it extends runway ahead
              of a reported listing process.
