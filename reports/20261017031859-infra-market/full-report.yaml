  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what the company is actually selling into
        blocks:
          - type: paragraph
            body: >-
              The cleanest current definition comes from Infra.Market itself: the company describes a multi-product
              building-materials platform serving contractors, developers, and retailers across the full construction
              lifecycle rather than a single-category marketplace. That matters because older third-party profiles still
              classify the business more narrowly as a B2B procurement marketplace or even an e-commerce marketplace,
              which can distort peer sets and TAM framing if used uncritically. Within the assigned evidence pool, the
              included spend clearly covers structural products, finishing materials, lifestyle products, and related
              distribution across both B2B direct-to-site and B2R retail channels. What is not supported publicly here
              is a clean exclusion boundary for adjacent services such as project design, financing, labor, or pure
              consumer home-improvement spend, so those should remain outside any precise market-size claim.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM015
