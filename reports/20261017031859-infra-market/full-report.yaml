      - number: '1.3'
        title: Milestones, current stage, and refresh risks
        blocks:
          - type: paragraph
            body: >-
              The company-issued history shows a steady progression from incorporation in 2016 to seed and Series A
              funding in 2019, a B2R launch in 2020, major Series C and D rounds plus the RDC Concrete acquisition in
              2021, and later manufacturing and portfolio expansion through Shalimar Paints, AAC blocks, and 275+ units
              by March 2025. Refresh evidence then adds the June 2025 debt financing package and third-party reporting
              that SEBI cleared a roughly ₹5,000 crore IPO in January 2026, alongside a reported pre-IPO valuation near
              ₹25,000 crore. The most important caveat is not growth visibility but governance and data precision: a
              2022 tax-search episode is still material to diligence, and the assigned public sources do not yet
              reconcile FY25 revenue, total capital raised, debt terms, or the full board map with filing-grade
              certainty.
