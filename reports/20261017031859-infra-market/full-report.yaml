      - number: '2.3'
        title: Buyer segmentation, adoption path, and market constraints
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to two distinct adoption motions. In B2B, Infra.Market says it sells directly to
              corporate customers and delivers directly to project sites across commercial and residential real estate,
              infrastructure, industrial, and related sectors; that implies a centralized procurement-led motion where
              supply reliability and direct-site fulfillment matter more than consumer pull. In B2R, the company reaches
              thousands of retail outlets, dealers, sub-dealers, and distributors, which suggests local availability,
              assortment breadth, and working-capital cycles matter more than a single enterprise buying committee.
              Growth drivers in the current pool are therefore category breadth, quality standardization through branded
              products, and continuing expansion into infrastructure and industrial demand. The key constraint is
              evidence quality: public sources do not isolate budget owners, conversion timing, or spend by cohort well
              enough to defend segment-level ROI or a bottoms-up SOM.
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
