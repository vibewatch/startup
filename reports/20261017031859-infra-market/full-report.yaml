            - Retail outlets, dealers, sub-dealers, and distributors
        - label: Portfolio
          detail: The public catalog spans structural, finishing, lifestyle, and related construction products.
          modules:
            - 'Structural: concrete, aggregates, AAC blocks, steel'
            - 'Finishing: tiles, paints, bath fittings, sanitaryware'
            - 'Lifestyle/interiors: electricals, kitchens, wardrobes, hardware'
        - label: Brands and manufacturing
          detail: Infra.Market combines branded merchandising with owned and exclusive third-party production.
          modules:
            - 11-brand house of brands
            - 163 owned manufacturing facilities
            - 120 exclusive third-party units
        - label: Fulfillment network
          detail: Manufacturing feeds both project sites and retail shelves.
          outputs:
            - B2B direct-to-site delivery
            - 17,256 retail touchpoints
            - Integrated logistics and supply-chain coordination
        - label: Adjacencies
          detail: >-
