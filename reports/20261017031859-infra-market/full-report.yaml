      - number: '3.2'
        title: Differentiation comes from supply control, channel breadth, and branded distribution
        blocks:
          - type: paragraph
            body: >
              Infra.Market's clearest supported differentiator is control over more layers of the supply stack than a
              pure marketplace typically owns. The official website says the company operates 283-plus manufacturing
              facilities across 22 states, sells through both direct corporate B2B and B2R retail channels, and covers
              categories from structural materials to lifestyle products. The about-us history and Ghar.tv profile show
              that the company also pushed further into integration through RDC Concrete, Shalimar Paints, AAC blocks,
              and a stated house-of-brands strategy. Those moves matter competitively because they create more embedded
              procurement workflows, broader basket share, and more opportunities to bundle distribution with owned or
              controlled product lines.
