      - number: '6.3'
        title: Durability, expansion quality, and concentration are still the key diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence base is much stronger on reach than on staying power. Independent commentary argues that
              Infra.Market wins by owning reliability, standardization, and logistics rather than by merely matching
              buyers and suppliers, which supports the logic for land-and-expand. But none of the retained sources
              disclose NRR, GRR, churn, renewal cadence, contract length, or top-customer share, so there is no public
              cohort proof showing whether the footprint converts into durable account economics. The 2025 sequence of
              equity plus debt funding reinforces that expansion is still being financed aggressively, while
              customer-level profitability and concentration remain opaque. In practice, that means diligence still has
              to move from channel breadth to account quality before customer durability is truly underwritten.
            claimRefs:
              - CU010
              - CU011
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Two-channel reach is clearly established
            body: >-
              Infra.Market is not evidenced as a single-channel marketplace. The public record consistently shows a
              direct B2B motion for project accounts and a separate B2R distribution layer, which makes the customer
              base broader and potentially more resilient than a one-surface procurement app.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU009
          - type: callout
            title: Scale is better evidenced than retention
            body: >-
              The strongest public proof is about footprint and company-level revenue, not customer durability. Until
              management shares renewal, churn, or top-account concentration data, investors are underwriting adoption
              breadth more than repeat economics.
            calloutType: risk
            claimRefs:
              - CU008
              - CU011
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The first-order risk is not demand absence; it is whether Infra.Market can carry more debt and more
              disclosure complexity into a pre-IPO period without losing earnings quality or valuation credibility.
              Public sources show a fresh $150 million debt package, a stated plan for more borrowing, and a FY25
              pattern where revenue still grew strongly while net profit fell and finance costs rose. At the same time,
              the operating surface is large enough that even small failures in quality control, working-capital
              discipline, or service levels can scale quickly across manufacturing units, outlets, brands, and channels.
              The residual ranking therefore starts with leverage plus IPO execution, then operational control, then
              governance and disclosure consistency.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Financing, IPO, and governance risk
        blocks:
          - type: paragraph
            body: >-
              The financing picture is supportive but not yet clean enough to treat as low risk. Independent coverage
              says the June 2025 Mars package extended an existing $100 million facility and added another $50 million,
              while Multiples also reports a further Rs 1,250 crore debt plan for refinancing, capex, and M&A. That
              matters because the same source says FY25 profit fell 42% even as revenue rose 27%, with finance costs up
              45%. Governance optics also need tighter diligence: public round summaries say founder-linked Silverline
              Homes led part of the September 2025 pre-IPO round and helped lift promoter ownership ahead of listing.
              IPO approval is reported, but the retained pool does not include the disclosure pack needed to reconcile
              borrowings, related parties, and final use-of-proceeds.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR012
              - CR016
      - number: '7.3'
        title: Operating footprint and integration risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Infra.Market looks powerful and harder to control than a narrow distributor. Official and
              third-party descriptions place it above 250 manufacturing units, above 10,000 retail touchpoints, and
              across broad product categories, brands, and both B2B and B2R channels. That footprint is a moat only if
              procurement, quality, logistics, pricing, and receivables controls scale with it. The company also layered
              inorganic moves onto that network through RDC Concrete and Shalimar Paints, which increases integration
              and governance load. External classifiers still split between marketplace and manufacturing frames,
              reinforcing that analysts need sharper segment and control disclosures before treating the model as simple
              or easily comparable.
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR012
              - CR015
      - number: '7.4'
        title: Mitigations, monitors, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The visible mitigations are real but incomplete. Infra.Market has already raised equity and debt, built a
              large manufacturing base, and moved toward IPO readiness, which suggests the company can execute at scale.
              What the pool does not settle is whether that scale is being managed with enough covenant headroom,
              plant-level compliance discipline, and related-party process to keep downside contained if the market
              window moves. The practical kill criteria are clear: rising borrowings without profit recovery, IPO
              materials that fail to reconcile valuation history or promoter-linked participation, and any evidence that
              operating complexity is outrunning quality and governance controls. Those are the diligence asks that
              matter most before underwriting a public-market style valuation.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR009
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary kill criteria
            body: >-
              Pause if FY26 profitability does not recover while borrowings rise, or if IPO materials fail to reconcile
              valuation history, promoter-linked participation, and planned refinancing.
            calloutType: risk
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR009
              - CR014
          - type: callout
            title: Highest-priority diligence packet
            body: >-
              Request debt agreements and covenant headroom first, then plant-level permit and safety schedules, then
              board materials covering founder-linked financing and related-party governance.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context matters more than company quality at this stage
        blocks:
          - type: paragraph
            body: >-
              The available evidence still supports the view that Infra.Market is a real scaled platform, not a
              slide-deck story. The company’s own operating description says it now spans 283+ manufacturing facilities
              across 22 Indian states and 17,256 retail touchpoints, while independent coverage confirms that 2025
              capital providers were still willing to extend and enlarge a large credit facility. That combination is
              important for valuation because it says the business has enough footprint, category breadth, and lender
              access to justify continued diligence. The problem is that financing evidence is not the same thing as
              price evidence: the assigned pool confirms debt and capital availability more clearly than it confirms a
              current equity mark, a current multiple, or a disclosed public-filing valuation framework.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV010
              - CV012
      - number: '8.2'
        title: The thesis is intact, but the price is still under-documented
        blocks:
          - type: paragraph
            body: >-
              The constructive case is straightforward: Infra.Market has built real distribution density, real
              manufacturing capacity, and repeat access to outside capital, which are valuable traits for a late-stage
              industrial platform. The anti-thesis is equally clear: this chapter’s public evidence set is still
              stronger on scale and financing headlines than on debt terms, cash conversion quality, segment economics,
              or a fresh independently corroborated valuation mark. In that context, a scenario view is more defensible
              than a point estimate. The bull case needs audited disclosures to confirm that operating density
              translates into durable margins and IPO-ready cash generation; the bear case is that additional debt and
              secondary liquidity are being layered onto an exit path whose price is not yet transparent.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
      - number: '8.3'
        title: Recommendation should wait for price-defining disclosures
        blocks:
          - type: paragraph
            body: >-
              The right call from this evidence set is not to reject Infra.Market, but not to pretend that public
              information already supports a tight underwriting range either. A research-more stance fits the facts
              because the company has enough scale and financing momentum to merit continued work, yet too little
              verified pricing detail to justify conviction on entry today. The diligence unlocks are practical: audited
              IPO or primary financing documents, debt schedule and covenant visibility, use-of-proceeds clarity,
              customer concentration, and segment-level margin or cash-conversion disclosure. If those disclosures prove
              strong, the recommendation can move up quickly; if they expose weak cash conversion, debt dependence, or a
              price that already discounts a best-case outcome, the downside case becomes more persuasive.
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV012
