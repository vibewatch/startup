          IPO-style disclosures confirm strong cash conversion, manageable debt, and durable margins across the
          platform.
        - >-
          Upside exists if the market rewards Infra.Market as a scaled, integrated building-materials platform; without
          a disclosed entry price, upside remains qualitative rather than underwritten.
        - Execution misstep, weaker margins, or delayed listing would compress the case.
        - Needs audited filings plus evidence that debt is bridging growth rather than masking weak cash generation.
      - - Base
        - Scale is real and capital access remains available, but valuation support stays incomplete.
        - >-
          Most prudent stance is to watch and re-underwrite once a primary mark or public filing closes the information
          gap.
        - Investors can overpay for scale when debt, concentration, and cash conversion stay partially opaque.
        - Current evidence set fits this path because it proves operating breadth better than price.
