    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Infra.Market's official surfaces describe a technology-enabled building-materials platform spanning
              structural products, finishing materials, lifestyle products, and related services for contractors,
              developers, and retailers across the project lifecycle. The same company-issued pages say the network now
              includes 283+ manufacturing facilities across 22 Indian states and 17,256 retail touchpoints, with both
              direct corporate delivery and business-to-retail distribution. That creates a credible picture of scaled
              physical operations rather than a thin procurement marketplace, even though current-headquarters
              disclosure is still missing from the assigned evidence and several third-party scale metrics remain
              inconsistent enough to require IPO or statutory reconciliation before reuse elsewhere in the report.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
