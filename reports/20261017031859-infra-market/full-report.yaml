      - number: '5.3'
        title: Maturity, differentiation, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The differentiation story is operational rather than deeply technical in the public record. Infra.Market
              appears differentiated by category breadth, house-of-brands control, manufacturing density, and
              fulfillment reach, and external profiles still describe the business as a marketplace/platform even after
              its manufacturing expansion. That matters because it suggests the company is winning through orchestration
              and asset control, not through a public developer ecosystem or obviously proprietary software interface.
              The main diligence problem is that the assigned source set never gets beyond high-level operating claims:
              there is no detailed public software-stack description, no public status or trust portal, and no disclosed
              SLA, incident, or category-level service-performance data. Product maturity is therefore visible at the
              asset-and-channel layer, but trust, support, and systems maturity remain under-documented.
            claimRefs:
