  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of alternative classes based on supported breadth of construction-lifecycle coverage and degree of
      supply/distribution control.
    xAxis:
      label: Breadth of construction-lifecycle coverage (ordinal 1-5)
      min: 1
      max: 5
      lowLabel: Narrow / single workflow
      highLabel: Broad / end-to-end
      scale: Evidence-backed ordinal synthesis
    yAxis:
      label: Control of supply, brands, or distribution (ordinal 1-5)
      min: 1
      max: 5
      lowLabel: Low control
      highLabel: High control
      scale: Evidence-backed ordinal synthesis
    data:
      points:
        - label: Infra.Market
          x: 5
          'y': 5
          tone: positive
          note: >-
            Official sources describe full-project coverage, owned and exclusive manufacturing, and B2B plus B2R
            distribution.
        - label: Horizontal B2B peers
          x: 4
          'y': 2
          tone: neutral
          note: >-
            Inc42 names Moglix, IndustryBuying, OfBusiness, and Power2SME as peers, but the assigned pool does not show
            comparable supply control.
        - label: Local distributors
          x: 2
          'y': 1
          tone: adverse
          note: >-
            Ghar.tv describes fragmented local distributors and manufacturers with relationship-based ordering and
            limited scalability.
        - label: In-house procurement
          x: 2
          'y': 3
          tone: warning
