      - number: '6.2'
        title: Adoption proof is real at the footprint level, but named production references stay thin
        blocks:
          - type: paragraph
            body: >-
              The public record supports real commercial adoption, just at uneven levels of precision. Official sources
              point to 17,256 retail touchpoints and 283-plus manufacturing facilities, while third-party coverage still
              describes 2025 scale at more than 250 manufacturing units and about 10,000 retail points serving
              institutional and retail buyers. OrangeOwl goes further, claiming more than 2,000 clients across large
              developers, government contractors, and retail hardware stores, and Tech in Asia names Mumbai Metro and
              Navi Mumbai Airport as project surfaces. That is enough to conclude Infra.Market is operating at
              meaningful scale, but not enough to underwrite customer-level outcomes, contract sizes, or repeat-purchase
              behavior.
