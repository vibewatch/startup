        title: Public traction, pricing visibility, and unit-economics coverage
        blocks:
          - type: paragraph
            body: >-
              Public traction is real enough to establish scale, but not granular enough to clear underwriting
              questions. StartupTalky reports FY24 operating revenue of INR 14,530 crore and profit of INR 378 crore,
              while Inc42 Datalabs lists Hella Infra Market Limited at revenue of ₹6,202.7 Cr+ for FY25. Official pages
              separately point to 275+ manufacturing units and more than 17,000 retail touchpoints, reinforcing that
              this is an operationally dense commerce and manufacturing model. What the public pack does not provide is
              public list pricing, realized channel pricing, gross margin by category, CAC/payback, DSO, inventory
              turns, or customer concentration, so any margin or cash-conversion thesis still requires management
              disclosure.
