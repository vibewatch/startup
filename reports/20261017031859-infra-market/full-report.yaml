  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Infra.Market's journey appears to alternate between project-led B2B procurement and repeat B2R distribution, with
      reliability and breadth doing most of the expansion work.
    data:
      items:
        - label: Project discovery
          actor: Developers, contractors, infrastructure buyers
          phase: Need identification
          touchpoints:
            - Search for multi-category supply with predictable quality and timing
            - Compare organized platform procurement against fragmented local sourcing
        - label: Corporate ordering
          actor: Procurement and site teams
          phase: B2B direct sale
          touchpoints:
            - Direct corporate sales
            - Direct-to-site delivery for live projects
        - label: Fulfillment proof
          actor: Project execution teams
          phase: Delivery and service
          touchpoints:
            - Logistics, inventory, and fulfillment reliability
            - Standardized products and reduced coordination effort
        - label: Retail replenishment
          actor: Retail outlets, dealers, sub-dealers, distributors
          phase: B2R distribution
          touchpoints:
            - Networked touchpoints restocking branded and third-party materials
            - Local availability extends reach beyond direct enterprise accounts
        - label: Trust and brand expansion
          actor: Repeat buyers and channel partners
          phase: Cross-sell
          touchpoints:
            - House-of-brands positioning
            - Customer loyalty and trust through broader category coverage
        - label: Share-of-wallet loop
          actor: Existing enterprise and channel accounts
          phase: Expansion
          touchpoints:
            - Add adjacent categories instead of a single one-off material purchase
            - Scale story depends on reliability translating into repeat orders
