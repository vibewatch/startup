      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Capital access is visible, but capital adequacy is not. Tracxn shows cumulative funding and a 2025 Series
              G valuation point, while independent June 2025 coverage says Mars Growth Capital extended an existing $100
              million facility and added $50 million of new debt. That supports the view that Infra.Market can still
              raise capital and is preparing for a larger financing or IPO pathway, but it also means debt is now part
              of the live underwriting picture. Without public cash-on-hand, CFO or burn data, debt pricing, covenants,
              amortization, and use-of-proceeds detail, the evidence supports financing dependency more strongly than it
              supports a runway conclusion.
            claimRefs:
              - CI006
              - CI007
              - CI010
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The best-supported financial read is that Infra.Market has genuine commercial scale, diversified channel
              reach, and ongoing lender and investor access, but that public evidence still understates the
              balance-sheet and margin questions an investor would need to underwrite. Revenue quality should be
              benchmarked against hybrid manufacturing and distribution peers rather than against pure SaaS or pure
              marketplace comps, because even independent databases classify the company differently while official
              materials emphasize owned brands and manufacturing depth. The core blockers are unchanged: realized
              pricing, gross margin by category, working-capital cadence, debt terms, and cash runway remain private.
            claimRefs:
              - CI003
              - CI009
              - CI010
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform definition and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              Infra.Market presents itself as a technology-enabled building-materials platform rather than a narrow
              merchant. The official company overview and LinkedIn profile both frame the offer around procurement
              workflow improvement for contractors, developers, and retailers, while the published product scope
              stretches from structural materials into finishing and lifestyle categories. In practical terms, the buyer
              proposition is breadth plus convenience: one platform, private-label and partner brands, and logistics
              that reduce the friction of sourcing from fragmented offline vendors. Independent coverage reinforces that
              the workflow pitch is about transparent pricing, quality assurance, and integrated logistics more than a
              standalone software product sold on its own.
