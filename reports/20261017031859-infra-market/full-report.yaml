              - CM008
              - CM009
              - CM012
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not contain an analyst-grade TAM/SAM/SOM build with transparent methodology. The
              only broad top-down number is a $255 billion Indian building-materials market figure cited in June 2025
              financing coverage, and even that appears in company-linked reporting rather than an independent market
              model. A better-grounded approach is to pair that broad proxy with disclosed operating-density signals:
              283+ manufacturing facilities across 22 states, 17,256 retail touchpoints, and independent June 2025
              corroboration that still points to 250+ units and 10,000+ touchpoints. Those metrics show that
              Infra.Market already addresses a national, multi-category demand surface, but they are still footprint
              proxies, not demand curves. The chapter therefore preserves the sizing gap instead of over-claiming a
              public SAM or SOM that the retained evidence does not support.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
