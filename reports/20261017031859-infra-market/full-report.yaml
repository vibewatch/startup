              surface into a direct corporate B2B motion and a B2R distribution motion. The B2B side is positioned
              around direct-to-site delivery for commercial, residential, infrastructure, and industrial customers,
              while the B2R side scales through retail outlets, dealers, sub-dealers, and distributors. The 2020 launch
