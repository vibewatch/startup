        title: Operating architecture and asset base
        blocks:
          - type: paragraph
            body: >-
              The operating architecture described in public sources is a layered combination of branded merchandising,
              manufacturing access, and channel fulfillment. Infra.Market's own overview says the company runs 283+
              manufacturing facilities across 22 states, mixing owned plants with exclusive third-party units, and then
              routes output through both direct corporate sales and a large B2R network. Its timeline also shows
              deliberate deepening of asset control through the RDC Concrete acquisition, in-house AAC block
              manufacturing, and continued expansion in manufacturing-unit count. Third-party reporting from mid-2025
              broadly corroborates the scale direction even when it cites slightly coarser numbers, which is enough to
              validate the shape of the architecture but not every category-level productivity metric.
