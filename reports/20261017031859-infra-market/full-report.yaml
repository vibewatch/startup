  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans status quo procurement, horizontal B2B peers, and category incumbents
        blocks:
          - type: paragraph
            body: >
              The assigned evidence supports a broad competitive definition rather than a narrow list of one-for-one
              digital rivals. Ghar.tv describes the legacy status quo as local distributors, fragmented manufacturers,
              telephone-based ordering, and relationships that are hard to scale, while Inc42's earlier market framing
              named Moglix, IndustryBuying, OfBusiness, and Power2SME as notable B2B ecommerce peers in the same general
              space. At the same time, Infra.Market's own materials and third-party profiles position it as a
              multi-category building-materials platform reaching across the full construction lifecycle, which means
              buyers can also compare it against in-house procurement teams, dealer networks, and single-category
              manufacturers rather than only against software-led marketplaces.
