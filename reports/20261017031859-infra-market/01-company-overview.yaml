figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Publicly visible milestones show a progression from 2016 launch to manufacturing expansion, debt financing, and reported IPO readiness by early 2026.
    data:
      items:
        - label: Incorporation and initial categories
          date: "2016-08"
          detail: Foundlanes says the founders incorporated Hella Infra Market Private Limited in Thane and initially forayed into ready-mix concrete, aggregates, and construction chemicals.
          tone: positive
          claimRefs: [CO003]
        - label: Seed and Series A funding
          year: "2019"
          detail: The company history page says Infra.Market raised ₹251.34 million of seed funding and ₹1,422.89 million of Series A funding.
          tone: positive
          claimRefs: [CO007]
        - label: B2R launch and Series B
          year: "2020"
          detail: The company history page says the business-to-retail channel started in 2020 and that Series B added ₹1,407.06 million.
          tone: positive
          claimRefs: [CO008]
        - label: Series C / D and RDC acquisition
          year: "2021"
          detail: The company history page says 2021 brought Series C and D funding plus the RDC Concrete acquisition.
          tone: positive
          claimRefs: [CO009]
        - label: Shalimar investment and 100-unit threshold
          year: "2022"
          detail: The company history page says Infra.Market made a strategic investment in Shalimar Paints and crossed 100 manufacturing units.
          tone: positive
          claimRefs: [CO010]
        - label: In-house AAC blocks
          year: "2023"
          detail: The company history page says Infra.Market commenced in-house manufacturing of AAC walling products.
          tone: positive
          claimRefs: [CO011]
        - label: Shalimar becomes subsidiary; Series F
          year: "2024"
          detail: The company history page says Shalimar Paints became a subsidiary, the network crossed 200 units, and Series F added ₹10,490.30 million.
          tone: positive
          claimRefs: [CO012]
        - label: 275+ manufacturing units
          date: "2025-03-31"
          detail: The company history page says Infra.Market crossed 275 manufacturing units as of March 31, 2025.
          tone: positive
          claimRefs: [CO013]
        - label: Mars Growth debt package
          date: "2025-06-30"
          detail: Times of India and Tech in Asia both report a $150 million financing package made up of a five-year extension of an existing $100 million facility and a new $50 million line.
          tone: positive
          claimRefs: [CO014]
        - label: Reported IPO clearance
          date: "2026-01"
          detail: Foundlanes says SEBI cleared a roughly ₹5,000 crore IPO in January 2026, with a reported pre-IPO valuation near ₹25,000 crore.
          tone: warning
          claimRefs: [CO015]
    approximationNotes: Timeline items are limited to dated milestones that appear directly in the assigned official and third-party source pool; missing filing-grade dates are left out rather than inferred.
    claimRefs: [CO003, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015]
callouts:
  - calloutType: insight
    title: Scale is visible before precision is
    body: >-
      The assigned pool is strong enough to establish that Infra.Market is
      running a large multi-channel physical platform, but it is not strong
      enough to settle FY25 revenue, total capital raised, current
      headquarters, or valuation with filing-grade precision.
    claimRefs: [CO001, CO002, CO005, CO006, CO015]
  - calloutType: risk
    title: Governance and leverage still need primary-source closure
    body: >-
      The 2022 tax-search episode and the 2025 debt package mean IPO-readiness
      diligence should focus on board depth, compliance remediation, covenant
      flexibility, and whether cover metrics in public databases reconcile to
      statutory filings.
    claimRefs: [CO014, CO016]
