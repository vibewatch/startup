company:
  name: Infra.Market
chapter:
  number: 1
  title: Company Overview
  summary: Infra.Market presents itself as a technology-enabled B2B and B2R building-materials platform with 283+ manufacturing facilities, 17,256 retail touchpoints, and a multi-brand footprint across India. The operating footprint looks real, but several cover metrics still conflict across public databases and case-study reporting, so funding, revenue, and governance precision remain diligence items ahead of a reported IPO path.
sections:
  - id: identity-and-operating-model
    title: Identity, product, and operating footprint
    body: >-
      Infra.Market's official surfaces describe a technology-enabled
      building-materials platform spanning structural products, finishing
      materials, lifestyle products, and related services for contractors,
      developers, and retailers across the project lifecycle. The same
      company-issued pages say the network now includes 283+ manufacturing
      facilities across 22 Indian states and 17,256 retail touchpoints, with
      both direct corporate delivery and business-to-retail distribution. That
      creates a credible picture of scaled physical operations rather than a
      thin procurement marketplace, even though current-headquarters disclosure
      is still missing from the assigned evidence and several third-party scale
      metrics remain inconsistent enough to require IPO or statutory
      reconciliation before reuse elsewhere in the report.
    claimRefs: [CO001, CO002, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-capital-and-governance
    title: Leadership, capital, and governance signals
    body: >-
      The current public record is still founder-led. Foundlanes attributes the
      August 2016 launch to Aaditya Sharda and Souvik Sengupta, pairing
      Sharda's construction-trade experience with Sengupta's
      chartered-accountant and finance background. Public bench visibility
      beyond the founders is thinner: the company site names CFO Manish
      Porwal and two category presidents, but it does not provide a full board
      and committee view. Capital formation looks deep but imprecise in this pool. Inc42
      lists Series G status, a September 2025 last round, and $740.44
      million-plus of total funding, while Foundlanes cites Tracxn for more
      than $800 million across 26 rounds. The latest clearly corroborated
      financing is the June 2025 Mars Growth Capital debt package, which
      matters because it increases leverage even as it extends runway ahead of
      a reported listing process.
    claimRefs: [CO003, CO004, CO005, CO006, CO014]
    tableRefs: [TO002, TO003]
  - id: milestones-and-refresh-risks
    title: Milestones, current stage, and refresh risks
    body: >-
      The company-issued history shows a steady progression from incorporation
      in 2016 to seed and Series A funding in 2019, a B2R launch in 2020,
      major Series C and D rounds plus the RDC Concrete acquisition in 2021,
      and later manufacturing and portfolio expansion through Shalimar Paints,
      AAC blocks, and 275+ units by March 2025. Refresh evidence then adds the
      June 2025 debt financing package and third-party reporting that SEBI
      cleared a roughly ₹5,000 crore IPO in January 2026, alongside a reported
      pre-IPO valuation near ₹25,000 crore. The most important caveat is not
      growth visibility but governance and data precision: a 2022 tax-search
      episode is still material to diligence, and the assigned public sources
      do not yet reconcile FY25 revenue, total capital raised, debt terms, or
      the full board map with filing-grade certainty.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
