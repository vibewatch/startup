    - type: conflicting-data
      severity: material
      topic: cover-metrics
      missingEvidence: Audited FY25 revenue reconciliation and a definitive total-capital-raised ledger that explain why public sources disagree on scale and funding.
      whyItMatters: Revenue, total raised, and valuation are cover metrics that influence cross-chapter benchmarking and IPO-readiness judgment.
      diligencePath: Obtain the DRHP, statutory FY25 accounts, or a management-approved capital table before treating any single public figure as canonical.
      relatedQuestionRefs: [QO006]
    - type: enumeration-incomplete
      severity: material
      topic: public-leadership-and-stakeholder-coverage
      missingEvidence: A full board roster, committee map, promoter economics, current headquarters disclosure, and definitive ownership / lender-rights details behind the public leadership and stakeholder tables.
      whyItMatters: Pre-IPO diligence needs more than a founder narrative; board depth, control rights, and headquarters / entity structure affect governance and execution risk.
      diligencePath: Pull DRHP governance sections, MCA filings, and board materials, then refresh the leadership and stakeholder tables from filing-grade evidence.
