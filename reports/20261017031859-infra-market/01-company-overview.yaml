      topic: debt-covenants-and-ipo-use-of-proceeds
      missingEvidence: The full debt schedule, covenant package, security structure, and final IPO use-of-proceeds plan behind the June 2025 financing.
      whyItMatters: Debt flexibility and refinancing risk can materially change post-IPO cash generation and valuation framing.
