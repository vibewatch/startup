        - label: "Trust and brand expansion"
          actor: "Repeat buyers and channel partners"
          phase: "Cross-sell"
          touchpoints:
            - "House-of-brands positioning"
            - "Customer loyalty and trust through broader category coverage"
        - label: "Share-of-wallet loop"
          actor: "Existing enterprise and channel accounts"
          phase: "Expansion"
          touchpoints:
            - "Add adjacent categories instead of a single one-off material purchase"
            - "Scale story depends on reliability translating into repeat orders"
    claimRefs: [CU002, CU003, CU009, CU010]
callouts:
  - calloutType: insight
    title: "Two-channel reach is clearly established"
    body: "Infra.Market is not evidenced as a single-channel marketplace. The public record consistently shows a direct B2B motion for project accounts and a separate B2R distribution layer, which makes the customer base broader and potentially more resilient than a one-surface procurement app."
    claimRefs: [CU002, CU003, CU009]
  - calloutType: risk
    title: "Scale is better evidenced than retention"
    body: "The strongest public proof is about footprint and company-level revenue, not customer durability. Until management shares renewal, churn, or top-account concentration data, investors are underwriting adoption breadth more than repeat economics."
    claimRefs: [CU008, CU011, CU013]
