    title: "Named customer proof table"
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / scale signal
      - Limitation
    rows:
      - ["Mumbai Metro project ecosystem", "Public-infrastructure / institutional", "Tech in Asia says Infra.Market participates in significant developments like Mumbai Metro", "Production / live-project participation claimed", "Provides named project-level proof that the company reaches marquee infrastructure workflows", "The source does not identify the contracting entity, contract value, product scope, or repeat order history"]
      - ["Navi Mumbai Airport project ecosystem", "Public-infrastructure / institutional", "Tech in Asia says Infra.Market participates in significant developments like Navi Mumbai Airport", "Production / live-project participation claimed", "Adds a second named project surface beyond generic customer logos", "The source again names the project, not the legal customer counterparty, deployment outcome, or renewal status"]
      - ["Retail hardware stores (unnamed cohort)", "B2R retail channel", "OrangeOwl says Infra.Market serves retail hardware stores; the homepage cites 17,256 retail touchpoints", "Production / operating channel", "Shows a real retail distribution surface rather than a single enterprise-only motion", "Public evidence does not disclose named store accounts, sell-through, or repeat-purchase behavior"]
    notes: "Coverage is intentionally partial: retained public evidence offers two named project surfaces and one clearly described retail cohort, but not three named legal customer entities with contract evidence."
    enumerationScope:
      coverage: partial
      basis: "Public sources disclose a small number of named project surfaces plus one channel cohort, but not a comprehensive customer roster or contract-backed deployment list."
    claimRefs: [CU003, CU005, CU012]
