company:
  name: Infra.Market
chapter:
  number: 6
  title: Customers
  summary: "Infra.Market has real customer surface area: the company says it serves both direct B2B procurement and a 17,256-touchpoint B2R network, while third-party coverage still shows a 2025 footprint above 250 manufacturing units and roughly 10,000 retail points. The main underwriting gap is durability rather than adoption, because retained public sources show footprint, marquee-project participation, and revenue growth, but not retention, renewal, or concentration metrics."
sections:
  - id: channel-footprint
    title: "Customer mix spans direct project procurement and retail distribution"
    body: "The disclosed customer model is broader than a single marketplace cohort. Infra.Market's homepage describes a multi-product platform serving contractors, developers, and retailers, then splits that surface into a direct corporate B2B motion and a B2R distribution motion. The B2B side is positioned around direct-to-site delivery for commercial, residential, infrastructure, and industrial customers, while the B2R side scales through retail outlets, dealers, sub-dealers, and distributors. The 2020 launch of B2R matters because it suggests the company deliberately added a second monetization surface rather than staying only in project-led enterprise procurement."
    claimRefs: [CU001, CU002, CU003, CU004, CU009]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-proof
    title: "Adoption proof is real at the footprint level, but named production references stay thin"
    body: "The public record supports real commercial adoption, just at uneven levels of precision. Official sources point to 17,256 retail touchpoints and 283-plus manufacturing facilities, while third-party coverage still describes 2025 scale at more than 250 manufacturing units and about 10,000 retail points serving institutional and retail buyers. OrangeOwl goes further, claiming more than 2,000 clients across large developers, government contractors, and retail hardware stores, and Tech in Asia names Mumbai Metro and Navi Mumbai Airport as project surfaces. That is enough to conclude Infra.Market is operating at meaningful scale, but not enough to underwrite customer-level outcomes, contract sizes, or repeat-purchase behavior."
    claimRefs: [CU005, CU006, CU007, CU008, CU012]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: "Durability, expansion quality, and concentration are still the key diligence gaps"
    body: "The evidence base is much stronger on reach than on staying power. Independent commentary argues that Infra.Market wins by owning reliability, standardization, and logistics rather than by merely matching buyers and suppliers, which supports the logic for land-and-expand. But none of the retained sources disclose NRR, GRR, churn, renewal cadence, contract length, or top-customer share, so there is no public cohort proof showing whether the footprint converts into durable account economics. The 2025 sequence of equity plus debt funding reinforces that expansion is still being financed aggressively, while customer-level profitability and concentration remain opaque. In practice, that means diligence still has to move from channel breadth to account quality before customer durability is truly underwritten."
    claimRefs: [CU010, CU011, CU013]
