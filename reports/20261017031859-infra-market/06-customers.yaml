      - ["Retail B2R channel", "Buyers / users / payers: retail outlets, dealers, sub-dealers, distributors, and downstream retail customers", "Channel replenishment and resale of building materials across local markets", "Homepage cites 17,256 retail touchpoints and a diversified multi-channel network", "Broadens reach beyond project-led enterprise sales and supports brand visibility", "Touchpoints are not the same as active, revenue-contributing dealers or repeat buyers"]
      - ["Institutional and public-project accounts", "Buyers: large developers and government contractors; users: site and procurement teams; payers: project owners or EPC structures", "Large project sourcing for infrastructure and real estate builds", "OrangeOwl cites large developers and government contractors; Tech in Asia names Mumbai Metro and Navi Mumbai Airport project participation", "Provides proof that the platform reaches larger and more strategic procurement surfaces", "Public sources name projects more often than the legal customer counterparty or contract value"]
