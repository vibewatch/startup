      - ["Independent 2025 scale cross-check", "250+ manufacturing units and 10,000+ retail touchpoints", "2025-06-30 / 2025", "SU006; SU007", "High", "Third parties corroborate large-scale customer reach even if counts trail the current homepage", "Methodology and period alignment versus official counts are not disclosed"]
