evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited FY25 revenue reconciliation and a definitive total-capital-raised ledger that explain why public sources
      disagree on scale and funding.
    whyItMatters: >-
      Revenue, total raised, and valuation are cover metrics that influence cross-chapter benchmarking and IPO-readiness
      judgment.
    diligencePath: >-
      Obtain the DRHP, statutory FY25 accounts, or a management-approved capital table before treating any single public
      figure as canonical.
    relatedQuestionRefs:
      - QO006
  - type: enumeration-incomplete
    severity: material
    topic: public-leadership-and-stakeholder-coverage
    missingEvidence: >-
      A full board roster, committee map, promoter economics, current headquarters disclosure, and definitive ownership
      / lender-rights details behind the public leadership and stakeholder tables.
    whyItMatters: >-
      Pre-IPO diligence needs more than a founder narrative; board depth, control rights, and headquarters / entity
      structure affect governance and execution risk.
    diligencePath: >-
      Pull DRHP governance sections, MCA filings, and board materials, then refresh the leadership and stakeholder
      tables from filing-grade evidence.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: debt-covenants-and-ipo-use-of-proceeds
    missingEvidence: >-
      The full debt schedule, covenant package, security structure, and final IPO use-of-proceeds plan behind the June
      2025 financing.
    whyItMatters: Debt flexibility and refinancing risk can materially change post-IPO cash generation and valuation framing.
    diligencePath: >-
      Request lender documents or the financing footnotes in the IPO materials and reconcile them to management's latest
      cash and leverage plan.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A transparent segmented TAM, SAM, and SOM build by category, geography, and buyer cohort.
    whyItMatters: Without a defendable sizing model, valuation upside can be overstated by relying on one broad India market proxy.
    diligencePath: >-
      Obtain the IPO draft, management presentation, or analyst market work with explicit category and geography
      methodology.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-owner-map
    missingEvidence: Named budget owners, procurement workflow timing, and ROI evidence by B2B versus B2R segment.
    whyItMatters: Adoption speed and sales efficiency depend on who approves spend and how quickly each channel converts demand.
    diligencePath: >-
      Request customer interviews, procurement documents, or S-1 style segment commentary that ties buyers to budgets
      and conversion cycles.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-framing
    missingEvidence: >-
      A current external market map that reconciles marketplace, e-commerce, and house-of-brands descriptions of the
      business.
    whyItMatters: Peer selection and TAM framing drift when older third-party profiles use outdated business-model labels.
    diligencePath: Reconcile current IPO materials, investor communications, and external databases before fixing the comparable set.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Current public pricing pages, contract structures, or discount frameworks for Infra.Market and the named
      horizontal B2B peers.
    whyItMatters: >-
      Without public pricing or contracting evidence, the chapter can only make directional statements about commercial
      advantage and switching economics.
    diligencePath: >-
      Pull current official pricing, quote-request flows, or channel contract exemplars for Infra.Market and each named
      peer, then rebuild the pricing table from source-backed terms instead of service claims.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost-observability
    missingEvidence: Customer win-loss data, churn patterns, multi-homing behavior, and category-level gross margin by channel.
    whyItMatters: >-
      These metrics would show whether manufacturing scale and distribution breadth actually translate into durable
      lock-in instead of a harder-to-run but still substitutable procurement business.
    diligencePath: >-
      Request cohort-level customer retention, cross-category attach rates, and sales win-loss evidence segmented by B2B
      corporate accounts versus B2R retail channels.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Public or management-provided realized pricing, discounting, rebate, and revenue-recognition detail by B2B versus
      B2R channel and by owned versus third-party brands.
    whyItMatters: Revenue quality and gross-margin durability cannot be assessed from channel labels alone.
    diligencePath: >-
      Request channel pricing waterfall, representative contracts or dealer terms, and accounting policy notes by
      product family.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by category, logistics and service-delivery cost, inventory days, DSO, customer concentration, and
      CAC or payback proxies.
    whyItMatters: >-
      The business is operationally dense, so working-capital cadence and gross-margin dispersion likely drive valuation
      quality.
    diligencePath: >-
      Request audited segment economics, channel contribution margins, inventory and receivable aging, and top-customer
      concentration data.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: >-
      Cash on hand, CFO or burn trajectory, debt pricing and covenants, amortization schedule, undrawn facilities, and
      IPO or next-round use-of-proceeds plan.
    whyItMatters: >-
      Without these inputs, capital adequacy and financing dependency cannot be underwritten beyond a general statement
      that debt has expanded.
    diligencePath: >-
      Obtain treasury snapshot, debt agreements, covenant package, monthly cash-flow bridge, and board-approved
      financing plan.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: control-transparency
    missingEvidence: >-
      Named security, privacy, business-continuity, and status/incident-control documentation for the buyer and supplier
      systems that underpin procurement and fulfillment.
    whyItMatters: Enterprise diligence cannot assess trust posture or operational resilience from marketing-level statements alone.
    diligencePath: >-
      Request the product architecture diagram, security/privacy control summary, incident log, uptime/SLA history, and
      any customer-facing trust documentation.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
