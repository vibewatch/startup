callouts:
- calloutType: insight
  title: The financial upside is in treatment attachment, not just testing volume
  body: At list price, the move from a $396 diagnostic episode to a $1,494-$2,494 diagnosis-plus-therapy path is the biggest visible revenue expansion lever in public data. That means attachment economics likely matter more than top-of-funnel test count alone.
  claimRefs:
  - CI001
  - CI003
  - CI019
  - CI026
  - CI027
- calloutType: risk
  title: Happy’s public financial visibility is still too thin for hard underwriting
  body: The company discloses pricing and fundraising, but not revenue, cash, burn, gross margin, denial rates, or treatment conversion. Without those, even a compelling care model remains a research-more case from an investment standpoint.
  claimRefs:
  - CI011
  - CI020
  - CI021
  - CI033
  - CI038
  - CI039
  - CI040
  - CI043
- calloutType: risk
  title: App and reimbursement friction can become real cost-of-growth pressure
  body: Insurance-upload errors, support delays, and the need to route payment through both self-pay and insurance workflows suggest that operational friction may hit conversion, support labor, and cash collection long before it shows up in disclosed financials.
  claimRefs:
  - CI005
  - CI023
  - CI024
  - CI025
  - CI034
