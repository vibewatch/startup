- id: sales-motion-and-unit-economics-proxies
  title: Sales motion and unit-economics proxies
  body: 'The public GTM motion appears hybrid rather than single-channel. Business Insider says patients can either buy online or be referred by a doctor, while Happy’s pricing and app materials show insurance intake, reminders, ring sizing, physician connectivity, and ongoing treatment tracking inside one digital workflow. OpenLoop’s partnership adds a B2B2C path through virtual-care infrastructure partners, which likely lowers some acquisition friction for partner-sourced patients. Still, the unit-economics burden looks materially more complex than a wellness wearable. Happy has to fund or pre-position ring inventory, ship hardware, handle clinician review, verify insurance, support app onboarding, and manage post-diagnostic treatment logistics. App Store reviews describing insurance-upload failures and support friction matter financially because they suggest leakage in conversion, billing confidence, or support cost. Without CAC, completion rate, denial rate, return rate, hardware cost,
    clinician minutes, or attach-rate disclosure, the public record supports only structural judgment: the model has multiple monetization steps, but also multiple failure points before attractive margin is realized.'
  claimRefs:
