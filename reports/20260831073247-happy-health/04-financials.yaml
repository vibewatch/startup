- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Customer acquisition cost (CAC)
    - null
    - Low
    - Determines whether self-pay and insured channels can scale efficiently
    - Request paid, organic, physician-referral, and partner-channel CAC by cohort
  - - Payback period
    - null
    - Low
    - Needed to understand how quickly test revenue repays acquisition and support costs
    - Request payback by payer type and by channel
  - - Hardware cost per ring issued
    - null
    - Low
    - Core driver of gross margin because the ring is bundled into the workflow and often retained
    - Request BOM, landed logistics cost, and replacement rate
  - - Shipping and reverse-logistics cost per episode
    - null
    - Low
    - Hardware logistics can materially compress margins in hybrid device-care models
    - Request average outbound, replacement, and non-return loss cost
  - - Clinician minutes per completed diagnosis
    - null
    - Low
    - Labor intensity shapes scalability and gross margin
    - Request median review time and physician-compensation cost per completed episode
  - - Insurance verification / denial rate
    - null
    - Low
    - Revenue realization and working capital depend on clean reimbursement operations
    - Request approval, denial, and appeals statistics by major payer
  - - Treatment attach rate
    - null
    - Low
    - Downstream device conversion may determine whether the diagnostic episode is economically attractive
    - Request CPAP, oral appliance, and medication attach rates by channel
  - - Gross margin
    - null
    - Low
    - The single most important summary of pricing power versus delivery cost
    - 'Request gross margin by stream: test, visit, CPAP, oral appliance, monitoring'
  notes: Null values are deliberate. No credible public source in the retained evidence disclosed the metric directly, and each row includes the precise diligence request needed to close the gap.
