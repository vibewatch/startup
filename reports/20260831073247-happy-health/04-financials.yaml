- id: capital-adequacy-and-public-traction-gaps
  title: Capital adequacy and public traction gaps
  body: 'Capital adequacy is directionally positive but still not directly underwritable. Fierce, MedCity, Yahoo, and Med-Tech Insights all report a $75 million 2026 financing, and MedCity says the capital will be used to accelerate clinical validation and build infrastructure beyond sleep. OpenLoop’s 2026 recap reinforces that Happy is building through partnership channels rather than only consumer marketing. However, Business Insider introduces a major chronology caveat by saying the last funding tranche closed in 2025 and by withholding valuation and revenue. That matters because a large announced round does not automatically reveal current cash balance, monthly burn, runway, or whether the company has already consumed a substantial portion of earlier capital. Public traction proof also remains shallow: “tens of thousands” of users confirms usage but does not resolve revenue, repeat behavior, attach rates, or margin. The bottom line is that financing momentum is real, yet the variables
    required for forecasting liquidity and next-round risk remain largely private.'
  claimRefs:
