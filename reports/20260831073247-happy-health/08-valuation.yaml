- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Persistent disclosure gap
    - Another financing event with no revenue, cohort, or margin disclosure
    - Price remains narrative-led instead of proof-led
    - Stay TRACK or downgrade to PASS if pricing is aggressive.
  - - Reimbursement weakness
    - High denial rates, repayment risk, or poor treatment attach
    - Clinical workflow fails to convert into durable economics
    - Reduce fair-value band materially.
  - - Adoption stall
    - Completed tests or monitored users stop scaling meaningfully
    - Valuation premium loses operating support
    - Move toward PASS.
  - - Strong KPI disclosure
    - Audited/reconciled revenue, cohorts, and margins become available
    - Valuation can be underwritten rather than guessed
    - Upgrade toward conditional BUY if price is sensible.
  - - Repriced entry point
    - Secondary or next round is far below unsupported unicorn framing
    - Improves margin of safety even before every unknown is solved
    - Could justify deeper engagement.
  notes: These triggers are designed for investment committee monitoring rather than for marketing use.
