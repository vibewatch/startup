  - Probability signal
  rows:
  - - Bull
    - Happy proves $100M+ revenue, strong attach into monitoring/treatment, and clean reimbursement economics.
    - ~$700M to ~$1.05B at ~7x revenue; unicorn threshold becomes conceivable.
    - Requires much stronger scale and disclosure than retained sources show today.
    - Low-Medium
  - - Base
    - Happy reaches something like $40M-$60M revenue with a defensible but still evolving clinical workflow.
    - ~$200M to ~$300M at ~5x revenue.
    - Still assumes credible growth and no major reimbursement impairment.
    - Medium
  - - Bear
    - Revenue is closer to $15M-$25M or reimbursement friction weakens attach and retention.
    - ~$50M to ~$75M at ~2x-3x revenue.
    - Operational complexity overwhelms commercial proof.
    - Medium
  notes: Scenario values are illustrative underwriting frames derived from comparable multiple bands; they are not claims about Happy’s current actual revenue.
