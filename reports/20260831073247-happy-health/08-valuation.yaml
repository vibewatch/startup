  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-margin-bridge
    missingEvidence: Recognized revenue, gross margin, and revenue mix by device, test, monitoring, and treatment path.
    whyItMatters: Without revenue quality and margin structure, even the best comparable set cannot be translated into a defensible entry price.
    diligencePath: Request audited or management-reconciled revenue bridge plus segment gross margins.
    relatedQuestionRefs:
    - QV005
    - QV016
    - QV020
    - QV030
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cohort-retention-and-attach
    missingEvidence: Retention, repeat monitoring, treatment attach, and patient LTV by acquisition path and payer type.
    whyItMatters: Premium private multiples require confidence that the workflow compounds value after the first test rather than ending as an expensive one-time episode.
    diligencePath: Request retention and treatment-attach cohorts plus CAC/LTV framing by segment.
    relatedQuestionRefs:
    - QV017
    - QV018
    - QV022
    - QV030
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Liquidation preferences, anti-dilution, employee option pool, and any debt or structured capital overhang.
    whyItMatters: Entry value is not enough; terms determine realized return.
    diligencePath: Request cap table, charter docs, and current preference stack.
    relatedQuestionRefs:
    - QV026
    - QV030
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: reimbursement-economics
    missingEvidence: Approval rates, denial rates, collections, out-of-network conversion, and billing-audit history.
    whyItMatters: A healthcare workflow can win clinically and still fail economically if revenue-cycle performance is weak.
    diligencePath: Request payer dashboard and denial waterfall by channel.
    relatedQuestionRefs:
    - QV017
    - QV018
    - QV024
    - QV030
    relatedTableRefs:
