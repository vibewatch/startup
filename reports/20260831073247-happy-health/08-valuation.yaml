- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue bridge
    - Recognized revenue by device, testing, monitoring, and treatment path
    - Needed to convert story into valuation math.
    - Management / CFO data room request
  - - Gross margin
    - Hardware, clinical, reimbursement, and blended gross margins
    - Determines whether public comp multiples are even directionally relevant.
    - Finance diligence
  - - Cohort retention
    - Month 1/3/6/12 patient retention and therapy attach
    - Required to judge LTV and workflow durability.
    - Growth + ops diligence
  - - Payer economics
    - Approval, denial, collections, and out-of-network conversion rates
    - Core to revenue quality and downside risk.
    - Revenue-cycle diligence
  - - Cap table / preferences
    - Liquidation preferences, anti-dilution, and employee pool overhang
    - Entry valuation is not enough without structure.
    - Legal / finance diligence
  - - Exit readiness
    - Audit status, reporting quality, and public-company prep
    - Determines whether Oura/WHOOP-style financing or IPO paths are realistic.
    - Finance + legal diligence
  notes: These six requests are the minimum package needed to move from narrative valuation to underwritten valuation.
