company:
  name: Happy Health
chapter:
  number: 2
  title: Market Analysis
  summary: 'Happy Health operates inside a clinically urgent but definitionally messy market: obstructive sleep apnea diagnostics, at-home sleep testing, clinically validated wearables, and physician-guided remote care overlap without sharing one standard revenue boundary. Public health sources show a very large unmet need—nearly 30 million Americans with OSA and roughly 80% undiagnosed—while market-report vendors disagree sharply on 2026 HSAT market size, ranging from $734 million to $2.19 billion depending on category scope. The buyer map is multi-sided: patients are the users, licensed providers must order and interpret HSAT, and payment can come from insurers, employers, or self-pay. That creates real demand tailwinds, but also constrains Happy Health to a provider-mediated, reimbursement-sensitive adoption path.'
sections:
- id: market-boundary-and-unmet-need
  title: Market boundary and unmet-need baseline
  body: 'The core demand problem is not whether sleep apnea exists, but which spend bucket should be counted as Happy Health’s real market. The narrowest lens is home sleep apnea testing (HSAT): portable or wearable diagnostic devices and related review workflows used outside sleep labs for suspected sleep-disordered breathing. That category excludes downstream therapies such as CPAP machines, oral appliances, and most consumer wellness wearables that cannot diagnose OSA. A broader adjacency includes clinically oriented wearable medical devices and remote patient monitoring platforms, where home healthcare, biosensor miniaturization, and cloud analytics are pushing more care outside hospitals. Public-health burden supports the relevance of both lenses. AASM and Sleep Education put U.S. OSA prevalence near 30 million with roughly 80% of cases undiagnosed, while NIH, Mayo, Johns Hopkins, and the American Heart Association all emphasize downstream links to cardiovascular disease, stroke, diabetes,
    and daytime impairment. For Happy Health, that means the true market is not all wearables; it is the subset of regulated, provider-interpreted, home-based diagnostics that can reduce the diagnosis gap.'
