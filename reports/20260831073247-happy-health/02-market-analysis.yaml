  rows:
  - - Large undiagnosed OSA burden
    - positive
    - current
    - Creates substantial patient-need tailwind for easier diagnosis pathways
    - What share of Happy demand comes from first-time diagnosis versus treatment monitoring?
  - - High medical and economic burden of delayed diagnosis
    - positive
    - current
    - Supports payer and provider interest in earlier testing
    - Do payers view Happy as cost-saving enough to steer members into the workflow?
  - - Specialist scarcity and wait times
    - positive
    - current
    - Home-first pathways can bypass bottlenecks in sleep-lab access
    - How many physicians are available per state and what are actual wait times in Happy’s network?
  - - Telemedicine and home-health normalization
    - positive
    - current
    - Makes physician-mediated home testing more behaviorally acceptable
    - What referral mix comes from digital acquisition versus traditional physicians?
  - - Remote monitoring reimbursement tailwinds
    - positive
    - emerging
    - Could support ongoing monitoring economics beyond one-off testing
    - Which CPT or payer pathways does Happy actually bill today?
  - - HSAT physician-order and interpretation requirement
    - negative
    - current
    - Prevents purely self-serve scale and ties adoption to clinician capacity
