  rows:
  - - Home sleep apnea testing (HSAT)
    - Portable or wearable diagnostic devices plus provider review workflows used outside sleep labs for suspected sleep-disordered breathing
    - CPAP therapy, oral appliances, surgeries, general wellness tracking
    - Provider orders; insurer, employer, or self-pay patient funds the episode
    - Core direct market because Happy’s FDA-cleared workflow sits here
  - - Clinically validated wearable diagnostics
    - Medical-grade wearables and software that generate clinically actionable data under regulated or provider-linked use
    - Wellness-only consumer trackers with no diagnostic role
    - Health systems, payers, employers, or consumers depending on workflow
    - Important adjacency because Happy blends a ring form factor with provider review
  - - Remote patient monitoring / home healthcare
    - Data capture, review, and longitudinal monitoring in the home setting
    - In-clinic episodic diagnostics with no ongoing data loop
    - Payers, providers, employers, or patients
    - Relevant because Happy extends from diagnosis into ongoing monitoring
  - - In-lab polysomnography
    - Facility-based gold-standard sleep studies
    - At-home device-only screening
    - Hospitals, sleep centers, payers, patients
    - Status-quo substitute and clinical benchmark rather than Happy’s target category
  - - Consumer sleep wearables
    - Sleep, readiness, and wellness insights from rings or watches
    - Physician-directed diagnostic claims
    - Consumer out-of-pocket
    - Useful substitute for consumer attention, but not the same reimbursable clinical market
  notes: Rows intentionally separate regulated diagnostics from broader wearable-adjacency categories so TAM work does not inflate Happy Health’s true clinical market with wellness-only devices.
