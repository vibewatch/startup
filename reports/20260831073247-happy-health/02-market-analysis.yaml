- id: buyer-user-payer-and-adoption-path
  title: Buyer, user, payer, and adoption path
  body: 'Happy Health’s adoption path is structurally more complex than a direct-to-consumer wearable sale because the end user, clinical decision-maker, and budget owner are not always the same party. The patient is the physical user of the ring and app, but AASM guidance and Happy’s own FDA indication require a medical provider to order and interpret the test for suspected OSA. In covered cases, the insurer or employer-sponsored plan can become the economic buyer; in self-pay cases, the patient temporarily becomes both user and payer. This multi-sided setup creates friction relative to wellness wearables, but it also creates a moat: consumer-only trackers cannot bypass physician-order requirements or claim equivalence to regulated HSAT workflows. Substitute products show the same pattern. Sunrise is prescription-only and reviewed by a sleep specialist, WatchPAT aids diagnosis of both obstructive and central sleep apnea, NightOwl emphasizes up to 10 nights of cloud-linked data, and Belun
    markets multi-night analysis to reduce first-night effects. Happy’s 48-state footprint and insurer messaging reduce some access friction, but the model still depends on provider throughput, clinical trust, and conversion from diagnosis to therapy.'
