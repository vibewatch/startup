  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-estimate-conflict
    missingEvidence: A reconciled definition set showing exactly how FMI, TBRC, and broader wearable-market reports differ in scope and revenue inclusion.
    whyItMatters: Without clear boundary mapping, TAM work can overstate Happy Health’s real clinical market or understate adjacency opportunity.
    diligencePath: Request category mapping from management or build one from paid reports with explicit inclusion/exclusion definitions.
    relatedQuestionRefs:
    - QM011
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: 48-state-sam
    missingEvidence: A state-by-state coverage map paired with population eligibility, payer contracts, and live clinician availability.
    whyItMatters: The published 48-state footprint is not enough to convert national need into a true immediately serviceable market.
    diligencePath: Request a current state launch map, payor roster by state, and provider-capacity dashboard.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: blocking
    topic: happy-sam
    missingEvidence: Company-specific SAM calculation after age, symptom, referral, payer, and clinician-capacity filters.
    whyItMatters: This is the key underwriting input for forecasting conversion, reimbursement mix, and growth ceilings.
    diligencePath: Request management’s internal demand model and current funnel conversion data by channel.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
    - TM003
  - type: private-evidence-only
    severity: material
    topic: conversion-to-therapy
    missingEvidence: Current conversion rate from completed test to CPAP, oral appliance, medication, or ongoing monitoring revenue.
    whyItMatters: The economics of a home-diagnostics platform depend on downstream conversion, not just top-of-funnel testing volume.
    diligencePath: Request channel-level conversion and attachment rates from diagnosis into each therapy category.
    relatedQuestionRefs:
    - QM016
  - type: private-evidence-only
    severity: material
    topic: reimbursement-realization
    missingEvidence: Actual reimbursed versus self-pay revenue mix and CPT/payment pathways currently used by Happy Health.
    whyItMatters: RPM and payer-tailwind narratives only matter if the company is actually capturing those reimbursement flows.
    diligencePath: Request current billed-code mix, denial rates, and average realized reimbursement per episode.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
