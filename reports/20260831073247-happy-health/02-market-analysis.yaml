callouts:
- calloutType: insight
  title: Happy Health’s direct market is smaller than the wearable hype cycle but more economically relevant
  body: The right direct market is not “all smart rings” or even “all sleep tech.” It is the subset of provider-ordered, clinically trusted, home-based diagnostics that can close the underdiagnosis gap. That narrower boundary is harder to sell into, but much closer to reimbursable medical spend.
  claimRefs:
  - CM007
  - CM009
  - CM012
  - CM022
  - CM040
  - CM046
- calloutType: risk
  title: Published market estimates are not interchangeable
  body: A $734 million HSAT market, a $2.19 billion HSAT devices market, and a $55.7-$67.65 billion wearable-medical-device market can all be correct inside their own definitions. Using the broadest figure without boundary adjustment would overstate Happy Health’s truly capturable market.
  claimRefs:
  - CM013
  - CM015
  - CM018
  - CM019
  - CM021
  - CM040
- calloutType: strength
  title: Physician-order requirements create friction but also shield clinical entrants from pure wellness substitutes
  body: AASM guidance and Happy’s FDA indication prevent fully self-serve scaling, yet the same rules also make it harder for consumer wearables to move into the reimbursable diagnostic lane. That structure can benefit companies that combine low-friction hardware with real medical workflows.
  claimRefs:
