evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, board committee structure, and investor control-rights summary.
    whyItMatters: >-
      Without governance visibility, it is difficult to assess founder control, downside protections, or whether
      strategic investors can influence operating decisions.
    diligencePath: Request the latest board list, voting agreements, and side-letter summary from the company or lead investor.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: blocking
    topic: funding
    missingEvidence: >-
      A reconciled cap-table chronology confirming whether the publicized $75M is a fresh 2026 Series A or cumulative
      funding since 2019.
    whyItMatters: >-
      Round structure affects cash-runway analysis, dilution history, valuation interpretation, and comparable-set
      placement in the valuation chapter.
    diligencePath: >-
      Obtain the signed financing summary, prior round dates, and exact amount of the final 2025 tranche directly from
      management or counsel.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO003
      - TO004
  - type: missing-source
    severity: material
    topic: founding-date
    missingEvidence: Primary public incorporation date or founder-era filing showing when Happy Health was created.
    whyItMatters: Founding date anchors company age, development pace, and round-to-maturity comparisons against peers.
    diligencePath: >-
      Request Delaware/Texas incorporation documents or founder biography materials that state the original formation
      date.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: blocking
    topic: economics
    missingEvidence: Current revenue, gross margin, payer mix, and post-money valuation.
    whyItMatters: These are core underwriting inputs for valuation, capital adequacy, and unit-economic quality.
    diligencePath: >-
      Request management’s latest KPI dashboard, board deck, or financing memo with revenue, valuation, and payer mix
      details.
    relatedQuestionRefs:
      - QO014
  - type: missing-source
    severity: material
    topic: debt-and-secondaries
    missingEvidence: Any debt facilities, equipment finance, warehouse lines, or secondary transactions associated with the business.
    whyItMatters: Non-equity obligations can materially change liquidity, preference overhang, and downside protection.
    diligencePath: >-
      Ask for the debt schedule, lender list, and any secondary transaction history from the finance team or lead
      investors.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-estimate-conflict
    missingEvidence: >-
      A reconciled definition set showing exactly how FMI, TBRC, and broader wearable-market reports differ in scope and
      revenue inclusion.
    whyItMatters: >-
      Without clear boundary mapping, TAM work can overstate Happy Health’s real clinical market or understate adjacency
      opportunity.
    diligencePath: >-
      Request category mapping from management or build one from paid reports with explicit inclusion/exclusion
      definitions.
    relatedQuestionRefs:
      - QM011
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: 48-state-sam
    missingEvidence: >-
      A state-by-state coverage map paired with population eligibility, payer contracts, and live clinician
      availability.
    whyItMatters: >-
      The published 48-state footprint is not enough to convert national need into a true immediately serviceable
      market.
    diligencePath: Request a current state launch map, payor roster by state, and provider-capacity dashboard.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: blocking
    topic: happy-sam
    missingEvidence: Company-specific SAM calculation after age, symptom, referral, payer, and clinician-capacity filters.
    whyItMatters: This is the key underwriting input for forecasting conversion, reimbursement mix, and growth ceilings.
    diligencePath: Request management’s internal demand model and current funnel conversion data by channel.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: conversion-to-therapy
    missingEvidence: Current conversion rate from completed test to CPAP, oral appliance, medication, or ongoing monitoring revenue.
    whyItMatters: >-
      The economics of a home-diagnostics platform depend on downstream conversion, not just top-of-funnel testing
      volume.
    diligencePath: Request channel-level conversion and attachment rates from diagnosis into each therapy category.
    relatedQuestionRefs:
      - QM016
  - type: private-evidence-only
    severity: material
    topic: reimbursement-realization
    missingEvidence: Actual reimbursed versus self-pay revenue mix and CPT/payment pathways currently used by Happy Health.
    whyItMatters: RPM and payer-tailwind narratives only matter if the company is actually capturing those reimbursement flows.
    diligencePath: Request current billed-code mix, denial rates, and average realized reimbursement per episode.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized pricing, discounting, payer reimbursement, and average net revenue per episode for Happy and direct HSAT
      rivals.
    whyItMatters: List pricing alone cannot tell whether Happy wins on economics or only on public transparency.
    diligencePath: >-
      Request current reimbursement schedules, channel-specific net revenue, and competitor quote sheets from provider
      buyers.
    relatedQuestionRefs:
      - QP017
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: completion-and-conversion
    missingEvidence: >-
      Completion rates, failed-study rates, diagnostic yield, and treatment attach rates versus WatchPAT, Sunrise,
      Belun, and lab pathways.
    whyItMatters: Comfort and workflow claims matter only if they improve actual conversion and revenue attachment.
    diligencePath: Request cohort-level funnel metrics by channel and competitor displacement reason.
    relatedQuestionRefs:
      - QP016
      - QP020
    relatedTableRefs:
      - TP002
      - TP004
  - type: private-evidence-only
    severity: material
    topic: provider-channel-density
    missingEvidence: Provider-network density, referral concentration, and payer-contracted lives compared with incumbent HSAT vendors.
    whyItMatters: Direct diagnostic markets are often won through channel leverage more than product elegance.
    diligencePath: Request active clinicians by state, top referral sources, and payer/live counts.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: moderate
    topic: competitor-pricing-opacity
    missingEvidence: >-
      Current retained public pricing for Oura, WHOOP, Apple Watch, Samsung Galaxy Ring, RingConn, and Ultrahuman in one
      evidence pack.
    whyItMatters: Public price opacity limits precise packaging comparisons.
    diligencePath: Fetch current product purchase pages or channel listings for each major wellness competitor.
    relatedQuestionRefs:
      - QP017
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: moderate
    topic: future-incumbent-response
    missingEvidence: >-
      Roadmaps or regulatory filings showing whether major wellness platforms are actively pursuing sleep-diagnostic
      claims.
    whyItMatters: Moat durability depends heavily on whether diagnostic adjacency remains a future threat or an imminent one.
    diligencePath: Monitor future FDA databases, investor commentary, and product announcements from Apple, Samsung, Oura, and WHOOP.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-model-actuals
    missingEvidence: Trailing-12-month revenue by stream, payer mix, and recognized versus billed revenue.
    whyItMatters: List prices do not reveal the actual economic engine or revenue quality.
    diligencePath: Request monthly management accounts split across diagnostics, visits, devices, and ongoing monitoring.
    relatedQuestionRefs:
      - QI001
      - QI014
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-burn
    missingEvidence: Current unrestricted cash, monthly burn, and base/downside runway forecast.
    whyItMatters: A financing headline cannot substitute for real liquidity underwriting.
    diligencePath: Request latest cash balance, burn bridge, and 13-week plus 12-month runway model.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: reimbursement-realization
    missingEvidence: Payer-contracted rates, approval/denial trends, days sales outstanding, and collection timing.
    whyItMatters: Insurance complexity can overwhelm attractive list pricing if realization is weak.
    diligencePath: Request payer-level collections and denials dashboard.
    relatedQuestionRefs:
      - QI004
      - QI012
    relatedTableRefs:
      - TI002
      - TI003
