  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与隐私暴露
        blocks:
          - type: paragraph
            body: >-
              Happy Health 的风险栈从一个事实开始：它卖的不只是健康可穿戴设备。公司有真实监管证据——两项公开 FDA
              许可，分别关联基于戒指的监测和家庭睡眠测试工作流——但这些硬许可仍窄于融资报道中“持续居家医疗”或慢病扩展叙事。这就带来第一个重大剩余风险：如果增长或营销跑到已证明范围之前，Happy
              可能从定位良好的睡眠工作流，变成暴露度更高的数字健康宣称故事。FTC
              指南在这里尤其相关，因为它为健康产品证明设定高门槛，并明确说明客户证言、网红和热情患者轶事不能替代合格、可靠的科学证据。公司还通过多实体照护工作流处理敏感健康和支付信息。其隐私和 PHI
              通知显示，数据收集广泛，涉及治疗 / 支付 / 运营共享，并依赖商业伙伴。换言之，Happy
              的法律表面积在结构上大于戒指本身暗示的范围：监管边界、营销纪律、报销合规、隐私治理和争议处理姿态必须同时守住。因此，监管故事应被视为一项持续运营纪律，而不是公司身后已经安全越过的一次性许可里程碑。
