  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图
        blocks:
          - type: paragraph
            body: >-
              Happy Health 不是孤立销售单一设备；它交付的是戒指驱动的睡眠诊断和照护工作流。产品表面至少包含六个相连模块：Happy Ring 硬件、充电器 / 尺寸确认和发货流程、Happy Sleep
              移动应用、用戒指数据计算睡眠输出的家庭睡眠测试软件层、面向临床医生的复核 /
              报告工作流，以及可延伸到治疗追踪的照护管理层。公司应用页面和独立行业报道描述了同一条大致流程：线上下单、佩戴戒指、传输每晚数据、与持专科认证的睡眠医生复核结果，然后长期追踪治疗效果。模块化视角很重要，因为它说明护城河可能在哪里。戒指是传感器前端，但产品体验同样依赖软件、临床医生复核、物流和照护运营。
