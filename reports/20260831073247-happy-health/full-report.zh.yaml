companyProfile:
  summary: >-
    Happy Health 是总部位于 Austin 的数字健康创业公司，把 Happy Ring 与受监管、由医生指导的睡眠诊断和治疗工作流绑定在一起。最强公开证据是两个 FDA
    锚点、真实面向患者的应用，以及据报道达到数万级使用。相比普通智能戒指，这家公司更有战略意义：它连接家庭测试、临床医生复核、治疗路径和持续监测，而不是停在消费者健康追踪。与此同时，公开数据在投资测算最关键的数字上异常稀薄：当前估值、确认收入、毛利率、支付方结构、治疗附着率、留存、股权结构和报销经济性。
  foundedDate: null
  founders:
    - name: Dr. Dustin Freckleton
      role: 创始人兼 CEO
      background: 医生创业者；他 24 岁中风、后来被诊断出睡眠呼吸暂停的个人经历，支撑了公司使命和大多数公开叙事。
      claimRefs:
