      - number: '8.2'
        title: 可比框架与情景测算
        blocks:
          - type: paragraph
            body: >-
              Happy 不披露收入，基于公开证据估值时就不该追求伪精确，而应使用可比公司 + 情景框架。最相关的私有可穿戴龙头是 Oura 和 WHOOP。
              它们说明，预防健康可穿戴设备可以拿到很大估值；也说明要拿到这些估值标记需要承担怎样的证明负担：两家公司在估值、融资和商业规模上的披露都远多于
              Happy。上市可比公司提供第二个视角。按保留的市值和申报数据，2026 年 8 月 ResMed、DexCom 和 Garmin 的交易倍数大约是收入的 6x 到 8x；Teladoc 接近
              0.5x，Sleep Number 则说明硬件公司一旦陷入困境，重估会有多狠。Apple 整体收入倍数更高，
              但那是广义平台倍数，直接可比性弱。可比公司给出的教训是：溢价定价可以成立，但前提是规模已被证明。按这个逻辑，假设 Happy 估值 $1 billion，通常需要类似 $143 million 收入对应 7x，或
              $200 million 收入对应 5x——这些数字都无法确认，因为 Happy 完全没有披露收入。
