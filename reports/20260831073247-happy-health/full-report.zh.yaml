  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入架构与变现
        blocks:
          - type: paragraph
            body: >-
              Happy Health 公开呈现的收入设计比一次性智能戒指购买更宽。公司材料和 Business Insider
              显示，一个按单次照护流程展开的睡眠照护工作流，可以从初始诊断测试、医生复核、后续咨询、口腔矫治器销售、CPAP
              套装，以及未来可能的疗效监测中产生收入。公司还支持两条漏斗入口支付路径：保险覆盖单次流程和折扣自费。重要的是，$396 自费方案不只是硬件；Business Insider
              称其中包括戒指、一年睡眠追踪和医生咨询，退货政策还称适用时患者可保留戒指用于未来疗效预约。也就是说，公司实际上把硬件、软件和临床服务捆在一个获客价格里。财务上，这很有吸引力，因为首单可以打开更宽的照护关系；但也意味着收入确认和毛利率很可能跨越多个成本桶，而不像纯软件或纯设备销售。
