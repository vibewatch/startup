        title: 采用证据与真实使用信号
        blocks:
          - type: paragraph
            body: >-
              公开采用故事可信但浅。Business Insider 报道数万人使用过 Happy 平台，这是工作流已在生产环境运行的有意义证明。App 生态提供了更多真实使用证据：App Store
              评论提到保险录入、远程访问、尺寸确认和故障排查；iOS 和 Android
              的产品列表则描述诊断、治疗追踪和持续医生连接。正面评论强调方便、舒适，比过去睡眠测试流程更容易；负面评论强调保险上传失败、戒指尺寸问题和支持挫败。合在一起，这些信号很重要，因为它们比普通 logo
              墙有用得多：它们显示患者确实在与上线后的工作流互动。同时，证据密度仍然有限——3.1 星和 16 条 App Store
              评分证明现实存在，不证明满意度已规模化或留存耐久。换句话说，本章已有足够公开证据说明产品真实上线并服务真实患者，但还不足以说明客户引擎已能在全国规模重复。尽调上，这足以否定 Happy
              仍处于产品前阶段的说法，但不足以宣布客户引擎已经深度规模化、被高度喜爱或运营稳定。
