  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按竞争者类型划分的格局
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争分野不是戒指还是手表，而是临床诊断工作流还是消费者健康参与。Happy Health
              的公开材料把它定位为受监管、居家睡眠诊断和照护平台，而不是通用状态管理可穿戴设备。Oura、WHOOP、RingConn、Ultrahuman、Apple Watch 和 Samsung Galaxy
              Ring/Health 都在争夺睡眠注意力和持续使用，但已审阅材料大多强调追踪、教练或通知，而不是由医生解读的 OSA 诊断。另一侧，WatchPAT、Sunrise、Belun 以及更广泛的 ResMed
              体系家庭测试，更直接竞争同一个临床任务：让有症状患者完成居家测试、进入诊断和治疗。因此 Happy
              同时承受两侧替代压力：健康玩家可以占据漏斗顶部心智，既有诊断厂商可以占据医疗服务方渠道信誉。实际含义是，Happy
              必须在不同场景击败完全不同的替代方案：症状意识阶段要赢过健康品牌，临床开单阶段要赢过医疗服务方信任的诊断工具。
