      - number: '8.4'
        title: 什么会改变判断
        blocks:
          - type: paragraph
            body: >-
              即便当前估值不成立，升级路径也很清楚。如果管理层披露经审计或管理层口径调节后的收入、按路径拆分的毛利率、报销拒付数据、治疗附加行为和患者留存队列， 证明“戒指 +
              医疗服务”模式创造的是耐久经济性，而不只是漂亮流程，Happy 在溢价价格下会更可投。价格变化也可能改善案例：如果下一次进入点的定价更接近公开证据支撑的基准情景，
              而不是没有支撑的独角兽标题，那么即便指标还不完美，不对称性也会变得有吸引力。下调路径同样清楚。若采用率停滞、报销摩擦被证明严重、治疗附加弱，
              或管理层在没有解决基本披露缺口时再次寻求高价，投资判断应从“跟踪”转为“放弃”。因此最重要的尽调要求不是再来一份叙事材料， 而是一套经勾稽的运营包，把临床流程现实与收入质量、毛利耐久性和退出准备度连起来。
