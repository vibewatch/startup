  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与未满足需求基线
        blocks:
          - type: paragraph
            body: >-
              核心需求问题不是睡眠呼吸暂停是否存在，而是哪一个支出桶才算 Happy Health
              的真实市场。最窄视角是家庭睡眠呼吸暂停测试（HSAT）：便携或可穿戴诊断设备，以及在睡眠实验室之外用于疑似睡眠呼吸障碍的复核流程。这一类别排除下游疗法，如 CPAP 机器、口腔矫治器，以及多数不能诊断 OSA
              的消费者健康可穿戴设备。更宽的相邻市场包括偏临床的可穿戴医疗设备和远程患者监测平台；居家医疗、生物传感器小型化和云端分析正在把更多护理推出医院。公共卫生负担证明两个视角都成立。AASM 和 Sleep
              Education 估计美国 OSA 患病人数接近 30 million，约 80% 未被诊断；NIH、Mayo、Johns Hopkins 和 American Heart Association 都强调
              OSA 会牵连心血管疾病、中风、糖尿病和日间功能受损。Happy Health 的真实市场不是全部可穿戴设备，而是能缩小诊断缺口的那部分受监管、由医疗服务方解读、居家诊断。
