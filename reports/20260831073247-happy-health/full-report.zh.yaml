  - id: TR001
    title: 监管 / 法律风险清单
    columns:
      - 风险
      - 当前证据
      - 可能性
      - 严重性
      - 可见缓释措施
      - 剩余敞口
      - 尽调路径
    rows:
      - - 适应症扩张和证明依据漂移
        - FDA 证据只针对睡眠，而融资报道使用更宽的慢病表述；FTC 对证明依据的门槛仍高。
        - 中
        - 高
        - 两个真实 510(k) 锚点；法律政策已披露。
        - 未来营销或产品扩张可能超出已有证明依据覆盖范围。
        - 要求提供宣称证明矩阵，以及非睡眠适应症的计划监管路径。
      - - 受保护健康信息（PHI）隐私或泄露事件
        - Happy 收集广泛健康数据，并披露多方 PHI 共享；未受保护的 PHI 事件会触发 HHS 泄露规则。
        - 中
        - 高
        - 已发布隐私政策和隐私实践通知。
        - 安全成熟度和供应商监督公开证据仍不足。
        - 要求提供事件历史、业务伙伴协议（BAA）、安全审计和泄露桌面演练材料。
      - - RPM / CCM 计费合规失败
        - 用户协议和 CMS 规则显示，月度计费需要协调，存在共同保险敞口，并受每月一个服务方限制。
        - 中
        - 高
        - 已有患者通知；流程明确标注非急诊状态。
        - 文档、医疗必要性和拒付管理质量未披露。
        - 要求提供编码协议、拒付率、审计结果和合规权责归属。
      - - 消费者争议和营销责任事件
        - 条款采用仲裁 / 集体诉讼豁免，FTC 规则则监管背书和用户证言呈现。
        - 低-中
        - 中-高
        - 正式条款存在，退出流程已披露。
        - 客户投诉或误导性宣称争议仍可能造成声誉损害。
        - 要求提供投诉日志、法律准备金政策和宣称审核治理。
    notes: 各行按当前剩余严重性排序，而非法律新颖性；它们把 Happy 自身披露与监管数字医疗、隐私和报销行为的外部规则体系放在一起。
