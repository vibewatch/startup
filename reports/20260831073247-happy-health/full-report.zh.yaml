  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方地图
        blocks:
          - type: paragraph
            body: >-
              Happy Health
              的客户基础是多边的，尽管最显眼的终端用户是有症状的成年患者。佩戴戒指的是用户，但工作流还依赖开单或复核临床医生、可能覆盖该单次流程的支付方，以及能把患者导入系统的伙伴渠道。公开页面显示自费和保险覆盖两类入口，Business
              Insider 则称患者可以线上购买，也可以由医生转诊。OpenLoop 的 2026 年伙伴更新又加了一层：伙伴患者也可以通过虚拟照护基础设施进入，而不只是直接消费者获客。实践中，Happy
              的客户基础最好分为个人患者、转诊或复核临床医生、支付方和 B2B2C
              渠道伙伴，而不是一个简单的一买方一用户消费应用业务。实际投资测算含义是，客户质量不能只从消费者应用行为读取，因为支付方批准、医疗服务方接入和伙伴导流共同决定谁能真正成为成功的长期用户。这也意味着分层经济性可能差异很大：自费用户看重速度和清晰度，保险用户看重覆盖确定性，伙伴导流用户看重
              Happy 多顺畅地嵌入别人的照护旅程。
