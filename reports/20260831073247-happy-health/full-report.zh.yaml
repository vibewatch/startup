  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 隐含估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Happy 证明收入超过 $100M，监测 / 治疗转化强，报销经济性清晰。
        - 按约 7x 收入为 ~$700M 至 ~$1.05B；独角兽门槛开始可想象。
        - 需要比当前留存资料所示强得多的规模和披露。
        - 低至中
      - - 基准
        - Happy 收入达到约 $40M-$60M，临床工作流可防守但仍在演进。
        - 按约 5x 收入为 ~$200M 至 ~$300M。
        - 仍假设增长可信，且报销没有重大受损。
        - 中
      - - 悲观
        - 收入更接近 $15M-$25M，或报销摩擦削弱转化和留存。
        - 按约 2x-3x 收入为 ~$50M 至 ~$75M。
        - 运营复杂度压过商业验证。
        - 中
    notes: 情景估值只是基于可比公司倍数区间推导的示意性投资分析框架；并非对 Happy 当前实际收入的断言。
