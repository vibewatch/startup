      - 可比公司
      - 收入 / 预订额锚点
      - 估值 / 市值
      - 隐含倍数
      - 相关性
      - 局限
    rows:
      - - Oura
        - 预计 2025 年销售额约 ~$1.0B；2024 年收入约 ~$500M
        - 私有估值约 ~$11B
        - 按 2025 年销售额约 11x
        - 最接近的智能戒指成功案例，定位预防健康。
        - 成熟度和商业披露都远高于 Happy。
      - - WHOOP
        - 2025 年末预订额运行率约 ~$1.1B
        - 私有估值约 ~$10.1B
        - 按预订额约 9.2x
        - 强势可穿戴 + 平台私有可比公司。
        - 预订额不等于确认收入；WHOOP 规模大得多。
      - - ResMed
        - FY2026 收入约 ~$5.7B
        - 市值约 ~$34.66B
        - ~6.1x
        - 最好的公开睡眠健康平台锚点。
        - 公开在位公司的规模和盈利能力远超 Happy。
      - - DexCom
        - 2025 年收入约 ~$4.662B
        - 市值约 ~$34.27B
        - ~7.3x
        - 临床设备 + 数据平台可比公司，具备监管验证。
        - CGM 经济性和报销动态不同于睡眠诊断。
      - - Garmin
        - 2025 年收入约 ~$7.246B
        - 市值约 ~$55.0B
        - ~7.6x
        - 已盈利、规模化的可穿戴硬件基准。
        - 产品组合更宽，临床针对性更低。
      - - Teladoc
        - 2025 年收入约 ~$2.53B
        - 市值约 ~$1.18B
        - ~0.5x
        - 数字健康反向重估可比公司。
        - 远程医疗商业模式更宽，也受泡沫后扭曲影响。
    notes: 倍数是基于留存的 2026 年 8 月市值页面，以及最新留存年度收入 / 预订额资料， 估算得出的市值 / 收入或估值 / 预订额口径。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV017
      - CV018
    enumerationScope:
      coverage: sample
      basis: >-
        This sample spans the closest retained private wearables plus public regulated-device, wearable, and adverse
        digital-health comparables used for pricing context.
  - id: TV005
    title: 投资逻辑失效与止损触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 披露缺口持续
        - 再次融资仍不披露收入、队列或毛利率
        - 价格仍由叙事而非证据驱动
        - 维持观察；若定价激进，下调为放弃。
      - - 报销疲软
        - 拒付率高、退款风险高，或治疗转化差
        - 临床工作流未能转化为可持续经济性
        - 显著下调公允价值区间。
      - - 采用停滞
        - 完成测试量或监测用户数停止有意义扩张
        - 估值溢价失去经营支撑
        - 转向放弃。
      - - 强 KPI 披露
        - 可获得经审计 / 可勾稽的收入、队列和毛利率
        - 估值可以承销式推演，而不是猜测
        - 若价格合理，可上调至有条件买入。
      - - 重新定价的进入点
        - 老股或下一轮价格远低于缺乏支撑的独角兽框架
        - 即便未知项尚未全部解决，也会改善安全边际
        - 可支持更深入接触。
    notes: 这些触发项面向投委会监控，而不是营销使用。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入桥接
        - 按设备、测试、监测和治疗路径拆分的确认收入
        - 这是把故事转成估值数学的必要条件。
        - 管理层 / CFO 数据室请求
      - - 毛利率
        - 硬件、临床、报销及综合毛利率
        - 决定公开可比公司倍数是否还有方向性参考价值。
        - 财务尽调
      - - 队列留存
        - 第 1/3/6/12 个月患者留存和治疗转化
        - 判断 LTV 和工作流耐久性的必要数据。
        - 增长 + 运营尽调
      - - 支付方经济性
        - 审批、拒付、回款和网外转化率
        - 直接决定收入质量和下行风险。
        - 收入周期尽调
      - - 股权结构表 / 优先权
        - 清算优先权、反稀释条款和员工期权池悬顶
        - 没有结构条款，只看入场估值不够。
        - 法律 / 财务尽调
      - - 退出准备度
        - 审计状态、报告质量和上市公司准备
        - 决定 Oura/WHOOP 式融资或 IPO 路径是否现实。
        - 财务 + 法律尽调
    notes: 这六项请求是从叙事估值走向可承销估值的最低数据包。
    claimRefs:
      - CV007
      - CV020
      - CV037
      - CV038
      - CV039
      - CV040
