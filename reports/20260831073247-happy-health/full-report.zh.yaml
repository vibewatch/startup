  customerFocus: 寻求睡眠呼吸暂停和失眠评估的有症状成年人，以及影响或支付这次照护流程的临床医生、保险方和合作照护渠道。
  businessModel: 设备 + 临床工作流的混合模式，覆盖自费和保险支持的诊断单次流程，并可能扩展到监测、治疗附着和未来慢病护理路径。公开来源未披露收入结构或单位经济性。
