          tone: neutral
        - date: '2024-09-24'
          label: 首项 FDA 许可
          detail: K240236 使 Happy Ring Health Monitoring System 作为 II 类监测设备获 FDA 许可。
          tone: positive
        - date: '2025-02-25'
          label: CMO 公开介绍
          detail: Happy Health 在支持网站列出 Dr. Jagdeep Bijwadia，职务为首席医疗官。
          tone: positive
        - date: '2025-06-17'
