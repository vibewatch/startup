              年完成，并未披露估值和收入。这很重要，因为一笔大型公开融资并不自动揭示当前现金余额、月度烧钱速度、现金跑道，或公司是否已经消耗了早期资本的相当部分。公开使用证据也仍很浅：“数万人”用户能确认有人使用，但无法解释收入、重复行为、附着率或毛利。结论是，融资势头真实存在，但预测流动性和下一轮风险所需变量大多仍是私有信息。
