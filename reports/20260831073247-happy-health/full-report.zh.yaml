            body: >-
              最有吸引力的客户质量信号是，Happy 的工作流在第一轮诊断流程之后天然可扩展。公开来源称，产品可以把客户从测试带到后续访问、CPAP
              或口腔矫治器治疗、药物选择和持续治疗追踪；戒指也可能留在患者手中，用于未来疗效访问。即便没有披露队列数据，这也暗示了有意义的重复使用潜力。问题在于，投资人真正想看的几乎所有耐久性指标——NRR、GRR、流失、复购率、治疗附着率、支付方结构或伙伴集中度——都缺失。集中度风险同样披露不足：公司强调主要保险覆盖和伙伴路径，但没有透露收入或量是否集中在一个支付方、一个转诊来源或一个分销伙伴。当前客户结论因此是：真实生产采用、清晰扩展逻辑，但公开留存强度和集中度风险能见度弱。这个缺口在医疗保健中尤其重要，因为报销、渠道和支持复杂度常常决定一个看似粘性的工作流究竟真的耐久，还是只是运营成本高。可能的上行是长尾患者关系；风险则是隐藏摩擦或渠道依赖阻止足够多用户进入更高价值状态。
