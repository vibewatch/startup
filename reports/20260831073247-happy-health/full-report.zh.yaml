            title: 财务上行来自治疗附着，不只是测试量
            body: 按标价看，从 $396 诊断单次流程升级到 $1,494-$2,494 的诊断加治疗路径，是公开数据中最显眼的收入扩张杠杆。因此，附着经济性可能比漏斗顶部测试数量本身更重要。
            calloutType: insight
            claimRefs:
              - CI001
              - CI003
              - CI019
              - CI026
              - CI027
          - type: callout
            title: Happy 的公开财务能见度仍太薄，难以硬投资测算
            body: 公司披露定价和融资，但不披露收入、现金、烧钱、毛利率、拒付率或治疗转化。缺少这些变量，即便照护模式有吸引力，从投资角度仍只能继续研究。
            calloutType: risk
            claimRefs:
              - CI011
              - CI020
              - CI021
              - CI033
              - CI038
              - CI039
              - CI040
              - CI043
          - type: callout
            title: App 和报销摩擦可能变成真实增长成本压力
            body: 保险上传错误、支持延迟，以及需要让支付在自费和保险工作流之间流转，都表明运营摩擦可能先打击转化、支持人工和回款，然后才会出现在披露财务里。
