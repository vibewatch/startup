chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、产品与照护模式
        blocks:
          - type: paragraph
            body: >-
              Happy Health 把自己呈现为一家由医生指导的居家照护公司，而不是单纯的消费者可穿戴设备创业公司。面向客户的服务 Happy Sleep，把 Happy Ring、移动
              app、远程医疗访问、诊断复核和持续治疗支持打包进一个以睡眠障碍为第一场景的在家工作流。公司网站反复强调的价值主张，是用消费者优先的路径替代传统转诊到实验室：线上开始、戒指寄到家、结果交给持专科认证的睡眠医生。商业上，平台同时支持保险覆盖和自费。当前公开价格表列出家庭睡眠测试
              $396、复诊 $99、定制口腔矫治器 $1,999、CPAP 套装 $999-$1,799；网站还称服务已进入 Blue Cross、Medicare
              等主要计划网络。受监管硬件、临床复核和治疗变现的组合，就是后续章节应沿用的核心身份。
