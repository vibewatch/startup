      - number: '5.2'
        title: 架构、运营模式与关键依赖
        blocks:
          - type: paragraph
            body: >-
              最清晰的产品架构证据来自 FDA 文件。2024 年监测许可覆盖 Happy Ring Health Monitoring System，并提及台架、安全、无线、可用性、软件验证和网络安全测试。2025
              年家庭睡眠测试文件随后定义了一个医疗器械软件：它通过安全 API 获取戒指的加速度和光电容积描记数据，计算 Happy Health AHI
              和总睡眠时间，并通过网页查看器把结果提供给临床医生。公司技术页补充了更多产品层细节：4 颗 LED、4 个电极、3 轴加速度计、2 个温度传感器、Bluetooth Low Energy、云集成，以及可按需提供的
              SDK。合在一起，运营模式像一个硬件 - 软件 -
              临床医生闭环，关键依赖包括戒指硬件可靠性、移动连接、安全数据传输、算法表现、临床医生接入、报销运营和伙伴分销。因此依赖图比健康应用更宽，应用上线引导、物流或医生吞吐量任何一环失效，都可能在临床价值兑现前破坏体验。
