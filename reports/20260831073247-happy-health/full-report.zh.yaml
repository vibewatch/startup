        - 在 150+ 个国家的受支持 Apple Watch 设备上全球推出
        - 已有 Apple Watch 用户，且可能有未诊断睡眠问题
        - 庞大装机基数和低摩擦功能分发
        - 通知只检测迹象，并不等同于医生审核的诊断
      - - Samsung Galaxy Ring / Health
        - 平台既有玩家 / 邻近替代方案
        - Galaxy Ring 扩展到 53 个市场，并以睡眠为中心做健康定位
        - 寻求睡眠和健康追踪的 Samsung 生态用户
        - 分发、设备生态整合，以及以健康为切入点的睡眠功能扩张
        - 已审阅来源描述的是监测睡眠呼吸暂停等异常迹象，而非端到端诊断
      - - WatchPAT / ResMed 相关 HSAT 既有玩家
