      - number: '5.4'
        title: 信任、安全、安保与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任与合规在基础监管证据上较强，但公开可检验的安全深度较弱。FDA 文件给出最具体的质量控制证据：非临床测试、可用性工程、安全和 EMC 测试、无线共存工作、软件
              V&V、网络安全文档和临床医生复核输出，都出现在许可路径中。技术页和隐私政策进一步叠加更广泛的治理主张，包括符合 21 CFR Part 11、遵循 HIPAA/NIST/COPPA/GDPR/CCPA
              指引、SMART on FHIR 互操作、端到端无密码加密安全、删除权，以及对产品 / 移动应用数据定向广告使用的限制。这是可信的信任姿态叙事。不过，关键企业级尽调问题仍未回答：保留证据中未发现公开 SOC 2
              报告、ISO 27001 证书、渗透测试摘要、正常运行时间 / 状态页、制造质量伙伴或详细 SDK 文档。一个结合健康数据、受监管输出和照护交付的产品，缺少这些材料很重要。
