      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              采用顺风很直观：庞大未诊断人群、专科可及等待长、居家测试更舒适、远程医疗习惯扩张，以及临床端更广泛采用可穿戴数据。MedCity 引述称每 43,000 名美国人才有一名睡眠医生且等待数月，AASM 和 NIH
              来源强调延迟诊断的医疗成本。更广泛的可穿戴报告也把居家医疗、远程监测报销和互操作性列为需求驱动因素。约束同样重要。AASM 不允许把 HSAT
              用作无症状大规模筛查，诊断也不能只依赖自动评分数据；服务方复核仍是硬要求。Happy 的 FDA 适应症限于 22
              岁及以上疑似睡眠呼吸暂停成人，排除了儿科和确定性较低人群。隐私、网络安全和临床准确性担忧在整个品类仍然活跃，更广泛的可穿戴市场数字很容易夸大一个受监管睡眠诊断平台真正能捕获的支出。重大未解尽调缺口包括各州签约覆盖、临床医生容量上限、诊断到治疗转化，以及当前量中报销与自费的精确组合。
