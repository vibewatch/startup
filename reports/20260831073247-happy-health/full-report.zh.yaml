        title: 销售动作与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              公开销售打法看起来是混合模式，而非单一渠道。Business Insider 称患者可以线上购买，也可以由医生转诊；Happy
              的定价和应用材料显示，一个数字工作流内包含保险录入、提醒、戒指尺寸、医生连接和持续治疗追踪。OpenLoop 合作为虚拟照护基础设施伙伴带来 B2B2C
              路径，可能降低伙伴来源患者的部分获客摩擦。尽管如此，单位经济性负担看起来远比健康可穿戴设备复杂。Happy
              需要出资或提前备货戒指、发货硬件、处理临床医生复核、核验保险、支持应用上线引导，并管理诊断后的治疗物流。App Store
              评论提到保险上传失败和支持摩擦，在财务上很重要，因为它们暗示转化、账单确定性或支持成本会漏损。在没有
              CAC、完成率、拒付率、退货率、硬件成本、临床医生分钟数或附着率披露的情况下，公开记录只能支持结构性判断：模式有多个变现步骤，但在实现有吸引力毛利前也有多个失败点。
