      - number: '3.3'
        title: 分销力量、切换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              残酷的竞争现实是，Happy Health 看起来比几乎每一类主要对手都小。Business Insider 称已有数万人使用该平台；WHOOP 报告会员超过 2.5 million、收入运行率 $1.1
              billion；Oura 报告已售出 5.5 million 枚戒指，并有望实现年销售 $1 billion；Samsung 已将 Galaxy Ring 扩展到 50 多个市场；Apple 能把健康功能推向
              150 多个国家；ResMed 年收入 $5.7
              billion，并拥有全球睡眠渠道触达。规模差距很重要，因为分销可以迅速把基础检测功能商品化。切换成本也因类别而异：消费者健康设备靠习惯和订阅形成锁定，服务方渠道的 HSAT
              产品一旦被医生、睡眠机构或支付方标准化，就形成工作流锁定。因此，戒指硬件不太可能成为耐久护城河。更可防守的层面是监管许可、支付方 /
              服务方入口、患者舒适度和下游治疗变现的组合——但如果大型平台拿到可比许可，或更积极地切入睡眠照护合作，每一层都可能被挑战。同样重要的是，直接 HSAT
              既有厂商如果已经被诊所工作流、支付方合同和转诊习惯嵌入服务方决策路径，未必需要更强的消费者品牌。管理层在证明完成率、转化率或报销优势前，公开证据只支持部分差异化，而不是胜者已定。当前证据因此指向一个有多个可能赢家的争夺型市场，而非清晰的赢家通吃切口。
