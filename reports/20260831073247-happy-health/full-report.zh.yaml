  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 类型
      - 证据
      - 什么会改变判断
    rows:
      - - Happy 的差异化不止消费级戒指，还包括监管和工作流。
        - 投资逻辑
        - 两个 FDA 锚点、医生指导工作流、数万次使用宣称。
        - 若有支付方接入和诊断产出数据，判断会增强。
      - - 大量未治疗睡眠呼吸暂停人群可支撑有意义规模。
        - 投资逻辑
        - 睡眠呼吸暂停患病率和居家测试需求支撑品类相关性。
        - 若有渠道转化和州级量级数据，判断会增强。
      - - 成熟投资人通过 $75M 融资事件验证了机会。
        - 投资逻辑
        - 多家媒体相互印证这轮融资。
        - 若轮次时间线更清晰并披露估值，判断会增强。
      - - 收入、估值和盈利能力仍未公开披露。
        - 反向逻辑
        - BI 和 VCT 都指出披露缺口。
        - 若管理层发布可勾稽的运营 KPI，反向判断会削弱。
      - - 与 Oura、WHOOP 等高溢价私有可比公司相比，Happy 披露更少，也可能更早期。
        - 反向逻辑
        - 私有头部公司对收入、估值或预订额披露更多。
        - 若 Happy 证明规模可比，反向判断会削弱。
      - - 如果报销或留存不达预期，医疗工作流复杂度会摧毁倍数。
        - 反向逻辑
        - Teladoc 和陷入困境的硬件可比公司显示下行估值压缩。
        - 若有毛利率和拒付率证据，反向判断会削弱。
    notes: 反向逻辑不是 Happy 没有价值，而是当前公开数据太薄，不足以支撑激进定价。
