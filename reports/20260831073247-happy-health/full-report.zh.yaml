      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Happy Health 的采用路径在结构上比直接面向消费者的可穿戴设备销售更复杂，因为终端用户、临床决策者和预算所有者并不总是同一方。患者是戒指和应用的实际使用者，但 AASM 指南和 Happy 自身 FDA
              适应症要求医疗服务方为疑似 OSA
              患者开具并解读测试。保险覆盖时，保险公司或雇主赞助计划可能成为经济买方；自费时，患者临时同时承担用户和付款方角色。多边结构相较健康可穿戴设备会制造摩擦，但也创造护城河：纯消费级追踪器无法绕过医生开单要求，也不能宣称等同于受监管
              HSAT 流程。替代品也呈现同样模式。Sunrise 仅凭处方使用并由睡眠专科医生复核，WatchPAT 辅助诊断阻塞性和中枢性睡眠呼吸暂停，NightOwl 强调最多 10 晚云端连接数据，Belun
              主打多晚分析以降低首夜效应。Happy 的 48 州覆盖和保险信息减少部分可及性摩擦，但模式仍依赖服务方吞吐量、临床信任，以及从诊断转向治疗的转化。
