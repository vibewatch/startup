      - number: '2.2'
        title: 规模测算视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              公开市场规模估算分歧大，因为各自在数不同东西。Future Market Insights 对家庭睡眠呼吸暂停测试市场定义很窄，给出 2026 年 $734.4 million；其中可穿戴设备占
              66.1%，阻塞性睡眠呼吸暂停本身占适应症组合 95.7%。The Business Research Company 采用更宽的设备收入口径，估计 2026 年 HSAT 设备市场为 $2.19
              billion，到 2030 年增至 $3.24 billion。再往外，Precedence Research 和 Mordor 分别把 2026 年可穿戴医疗设备市场放在 $67.65 billion 和
              $55.7 billion，居家医疗已占应用份额一半以上。自下而上的患者钱包视角会得出比任一 HSAT 报告大得多的数字：用估计 23.5 million 美国未诊断病例乘以 Happy $396 自费价格，约为
              $9.3 billion 诊断钱包；若加入 $99 复诊，则约 $11.6
              billion。这些数字与供应商报告并不矛盾；它们用流行患者需求和标价，而不是已实现年度设备收入，回答了另一个问题。合理的投资测算口径是保留所有视角，而不是强行给出一个虚假的精确数。
