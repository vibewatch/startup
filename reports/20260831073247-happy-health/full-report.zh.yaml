      - number: '7.2'
        title: 运营与伙伴脆弱性
        blocks:
          - type: paragraph
            body: >-
              第二层风险是执行复杂度。Happy 留在公开材料里的承诺很重：当天虚拟问诊、保险覆盖或自费入口、把戒指寄到家、多晚检测、临床医生复核、治疗选择， 甚至后续持续监测。这套流程有吸引力，因为它能拉高 LTV
              潜力；但相比单纯卖设备，也多出许多故障点。App Store 证据已经出现保险材料上传失败、
              支持响应慢、戒指尺寸流程出错，这意味着转化漏斗可能在诊断准确性发挥作用之前就断掉。合作伙伴依赖把风险放大。OpenLoop 的合作伙伴更新和 Happy
              自己的用户协议显示，服务交付可能依赖关联专业公司和第三方诊所，而不只是一个垂直整合的单一雇主模式。支付方网络例外和网外路径又加一层依赖。
              硬件模式本身也带来运营后果：用户可能保留戒指，用于后续疗效复诊和持续追踪，因此物流与替换经济性会和留存行为绑在一起。总体结论是，Happy
              的产品在临床上可能有看点，但业务成败取决于客户运营、合作伙伴可靠性和报销执行。同样是多步骤设计，它让体验具备临床差异化；一旦放量， 也会让故障更难定位、补救成本更高。
