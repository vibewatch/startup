              资本充足度方向上积极，但仍不能直接投资测算。Fierce、MedCity、Yahoo 和 Med-Tech Insights 都报道 2026 年 $75 million 融资，MedCity
              称资金将用于加速临床验证，并建设睡眠之外的基础设施。OpenLoop 的 2026 年回顾强化了 Happy 借伙伴渠道建设，而不只靠消费者营销。但 Business Insider
