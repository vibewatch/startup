      - number: '3.2'
        title: 能力、定价与监管对比
        blocks:
          - type: paragraph
            body: >-
              相对主流智能戒指和手表，Happy Health 最强优势是监管和工作流深度。Oura 明确称自己不是医疗器械，不能诊断睡眠呼吸暂停，尽管它追踪睡眠信号并扩展到实验室和葡萄糖健康数据。WHOOP 拥有 ECG
              等受医疗监管功能，但更广泛的价值主张是面向恢复、训练负荷和健康寿命的会员服务，而不是睡眠呼吸暂停诊断工作流。Apple 的睡眠呼吸暂停功能是通知，用于检测未诊断成人中重度呼吸暂停迹象，不是完整诊断；Samsung
              同样在 Samsung Health 中描述对睡眠呼吸暂停等异常迹象的监测。RingConn 和 Ultrahuman
              正推向更丰富的健康智能，但已审阅证据仍指向风险洞察或更广泛的生物智能，而不是端到端、医生复核的睡眠诊断产品。面对 HSAT 既有厂商时，Happy 的优势收窄，因为 WatchPAT、Sunrise 和
              Belun 已在推广临床医生复核或 FDA 许可的居家测试；Happy 透明的单次流程定价本身也无法证明已实现经济性或报销实力更强。这种比较框架一分为二：买方可能在便利性和习惯上把 Happy 与 Oura 或
