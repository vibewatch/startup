      - number: '8.3'
        title: 建议：跟踪，不买入
        blocks:
          - type: paragraph
            body: >-
              建议是跟踪，置信度中，风险高。正面论点成立：Happy 具备纯消费智能戒指没有的临床差异化，多边工作流可捕获高于一次性硬件的价值，
              未治疗睡眠呼吸暂停市场也很大。这些事实足以支持继续关注，也解释了成熟投资者为什么愿意投钱。反面论点同样关键：投资者仍看不到收入、毛利率、
              股权结构表条款、优先权结构、治疗附加率、报销拒付率或队列留存。换句话说，业务也许应比同质化戒指享有溢价，但公开证据不足以支撑按私募溢价价格买入，
              更不足以假设软件式经济性或短期独角兽结果。因此“跟踪”优于“买入”和“放弃”。“买入”会过度相信一个没有公开证实的价格信号。
              “放弃”则会忽视真实产品和监管差异化。正确姿态是保持关注，但拒绝追逐跑在证据前面的估值。
