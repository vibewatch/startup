              II 设备；K242224 随后授权 Happy Health Home Sleep Test 软件用于 22 岁及以上、疑似睡眠呼吸暂停成人，输入来自戒指生成的 PPG
              和加速度计数据。第三方报道一致把第二项许可视为公司的临床解锁点，因为它支撑睡眠相关呼吸障碍的居家评估，也支撑公司称其可在短至三晚内诊断阻塞性睡眠呼吸暂停。与此同时，公开记录也暴露出有意义的风险信号。公司的隐私政策设想广泛收集健康、人口统计、位置和派生数据，并允许为了研究和营销共享去标识化数据。服务条款要求约束性仲裁和集体诉讼豁免。iPhone
              App Store 评论页显示 3.1/5 评分，并有保险上传失败和支持响应的投诉，说明上线引导可靠性可能落后于居家优先临床模式的雄心。
