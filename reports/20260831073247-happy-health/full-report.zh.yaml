  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与真正被证明的部分
        blocks:
          - type: paragraph
            body: >-
              Happy Health 的估值问题很特殊：公司看起来比许多创投叙事更真实，但披露程度又低于投资者承销高溢价私募估值通常需要的水平。 最强正面证据很清楚：Happy 拥有真正的 FDA
              批准资产、医生指导流程，Business Insider 还报道已有数万人使用平台。这意味着应把它当成真正的临床平台候选者分析， 而不是投机性的消费硬件。但价格锚很弱。2026 年 8 月多家媒体报道了 $75
              million 融资公告；Business Insider 又补充时间线限制：这笔钱是自 2019 年以来多轮募集，最后一笔在 2025 年完成。更重要的是，Business Insider
              称创始人拒绝披露收入和估值， Venture Capital Tracker 同样把最新已知估值标为未公开。由此，独角兽叙事在方向上有参考意义，但不是硬承销事实。因此第一结论很简单：
              公司可能很有价值，但当前价格信号远没有围绕产品的运营叙事那么扎实。
