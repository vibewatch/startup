        title: 领导层、临床深度与治理能见度
        blocks:
          - type: paragraph
            body: >-
              已审阅的公开记录在临床领导层上清晰得多，正式治理结构则模糊。多篇独立融资报道和 Home Sleep Test 的 FDA 申报均把 Dr. Dustin Freckleton 标为创始人兼
              CEO，并把公司使命锚定在他 24 岁中风、数年后才被诊断出睡眠呼吸暂停的个人经历上。Happy Health 也借 Dr. Jagdeep Bijwadia 展示临床深度；他 2025 年 2
              月的个人资料称其为首席医疗官，并描述其在睡眠医学、远程医疗和医疗科技顾问角色上的经历。Sleep Review 另称神经科医生 Jeff Durmer 是顾问。资本侧，ARCH 董事总经理 Paul Berns
              公开阐述过公司投资逻辑，OpenLoop 也曾公开称 Happy Sleep
              为合作伙伴。缺口在于完整董事会名单、逐董事治理图，以及投资人控制权或老股持有的任何披露。透明度不足不会推翻运营故事，但意味着治理还不能被视为尽调就绪。
