  - id: TR005
    title: 缓释措施与止损标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 监管证据支撑漂移
        - 宣称范围或产品定位超出睡眠测试证据
        - 监管问询、下架要求，或无法拿出新适应症证据图谱
        - 暂停投资 / 下调投资逻辑，直到公司拿出宣称治理证据。
      - - 隐私 / 安全失守
        - PHI 事件或安全审查未通过
        - 任何需报告的未受保护 PHI 泄露，或重大审计缺陷
        - 升级法律 / 合规尽调，并重新评估品牌信任。
      - - 计费合规失败
        - RPM/CCM 申报被拒付或遭质疑
        - 拒付显著上升、退款要求，或编码审计未通过
        - 假设利润率受压，并存在执法尾部风险。
      - - 运营漏斗脆弱
        - 转化或支持质量恶化
        - 完成测试率下降，或支持积压持续数周
        - 将收入计划视为受运营约束，而非受需求约束。
      - - 融资后披露缺口仍未补齐
        - 新一轮融资完成后仍未披露队列、支付方结构或毛利率
        - 再一次融资事件仍缺少投资分析所需 KPI
        - 视为估值跑在证据前面，避免追价。
    notes: 这些止损标准按董事会或尽调视角设计，确保可监测，而不是依赖抽象战略直觉。
