- id: adoption-proof-and-live-usage-signals
  title: Adoption proof and live-usage signals
  body: 'The public adoption story is credible but shallow. Business Insider reports that tens of thousands of people have used Happy’s platform, which is meaningful proof that the workflow exists in production. The app ecosystem provides additional evidence of live usage: App Store reviews reference insurance intake, virtual visits, sizing, and troubleshooting, while the product listings on both iOS and Android describe diagnosis, treatment tracking, and continuous doctor connectivity. Positive reviews emphasize convenience, comfort, and an easier process than prior sleep testing; negative reviews emphasize insurance-upload failures, ring-size issues, and support frustration. Together, those signals matter because they are much more useful than generic logos: they show actual patient interaction with the live workflow. At the same time, the evidence density is still modest—3.1 stars and 16 App Store ratings are proof of reality, not proof of scaled satisfaction or durable retention. In
    other words, the chapter has enough public proof to say the product is live with real patients, but not enough to say the customer engine is already repeatable at national scale. For diligence purposes, this is enough to reject the idea that Happy is pre-product, but not enough to declare the customer engine deeply scaled, highly loved, or operationally stable.'
