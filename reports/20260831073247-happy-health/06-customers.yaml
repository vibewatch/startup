tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Self-pay symptomatic adult
    - Buyer=user=patient; payer=patient
    - Fast at-home diagnostic access without insurance approval
    - Publicly visible but undisclosed count
    - Entry point for direct consumer revenue and downstream treatment conversion
    - No volume split by self-pay disclosed
  - - Insurance-covered symptomatic adult
    - User=patient; payer=insurer + patient cost share
    - At-home diagnosis routed through covered benefits
    - Publicly visible but undisclosed count
    - Likely key channel for lowering out-of-pocket friction and scaling access
    - No payer mix or approval-rate disclosure
  - - Physician-referred patient
    - Buyer influence=doctor; user=patient; payer varies
    - Referred into home sleep test and treatment workflow
    - Production use visible in BI and trade coverage
    - Supports medical legitimacy and referral-led demand
    - No referral-source concentration data
  - - Partner-routed patient (e.g. OpenLoop channel)
    - Buyer influence=partner + clinician; user=patient; payer varies
    - Virtual-care infrastructure routes patient into Happy diagnostics
    - At least one partner pathway publicly verified
    - Potential B2B2C expansion path beyond direct acquisition
    - No partner-level volume or economics disclosed
  - - Post-diagnosis treatment / monitoring patient
    - Existing user continuing into therapy and tracking
    - CPAP, oral appliance, medication, or efficacy monitoring
    - Workflow visible; count undisclosed
    - Higher lifetime value than one-time diagnostic-only user
    - No attach or retention rates disclosed
  notes: The segmentation lens focuses on who controls the buying decision and who captures long-term value, not only on who physically wears the ring.
