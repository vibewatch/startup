  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: retention-cohorts
    missingEvidence: Actual repeat-usage, therapy-attachment, renewal, and churn cohorts by customer segment and payer type.
    whyItMatters: Without cohort data, expansion logic cannot be translated into durable revenue-quality assumptions.
    diligencePath: Request month-1/3/6/12 retention, attach, and repeat-visit cohorts.
    relatedQuestionRefs:
    - QU013
    - QU014
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: channel-concentration
    missingEvidence: Top payer, top referral source, top partner, and top-state concentration by volume and revenue.
    whyItMatters: Growth may be more fragile than it appears if one insurer or partner accounts for an outsized share of demand.
    diligencePath: Request concentration analysis by payer, partner, clinician, and geography.
    relatedQuestionRefs:
    - QU016
    - QU017
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: named-enterprise-proof
    missingEvidence: Named enterprise, clinic, or health-system case studies showing production deployment and outcomes.
    whyItMatters: Current proof is heavily consumer-anecdotal and does not establish broader institutional adoption.
    diligencePath: Request case studies, customer references, or procurement records from provider and payer partners.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: active-user-denominators
    missingEvidence: Active users, completed tests, diagnosed patients, treatment-attached patients, and paying users.
    whyItMatters: Tens-of-thousands platform usage is directionally useful but not enough to model customer quality.
    diligencePath: Request funnel counts by channel from site visit to active monitored patient.
    relatedQuestionRefs:
    - QU005
    - QU007
    - QU025
    relatedTableRefs:
    - TU002
    - TU006
  - type: private-evidence-only
    severity: material
    topic: customer-support-health
    missingEvidence: Support ticket volume, resolution time, app crash rates, and post-resolution retention.
    whyItMatters: App friction and insurance confusion are already visible in reviews and may become a hidden churn driver.
    diligencePath: Request support and app-reliability dashboards segmented by payer and stage.
    relatedQuestionRefs:
    - QU010
    - QU022
    relatedTableRefs:
    - TU004
