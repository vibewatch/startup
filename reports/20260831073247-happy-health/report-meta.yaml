subtitle: Real FDA-cleared sleep workflow and meaningful financing interest, but valuation, revenue, and cohort economics remain too under-disclosed to underwrite an aggressive private-market entry.
coverageNotes: This report reflects publicly available information through 2026-08-31. Happy Health is a private company, and the current post-money valuation, revenue, gross margin, retention cohorts, payer mix, treatment-attach rates, cap-table terms, and preference stack are not publicly disclosed in the retained source set. Multiple August 2026 outlets corroborate a $75M financing headline, but Business Insider adds a chronology caveat that the $75M was raised across multiple rounds since 2019 and says founder/CEO Dustin Freckleton declined to disclose both valuation and revenue. Venture Capital Tracker likewise marks the latest known valuation as not publicly disclosed. Comparable analysis in the valuation chapter therefore uses a price-sensitive framework anchored in private wearables (Oura, WHOOP) and public health-device / digital-health comps (ResMed, DexCom, Garmin, Teladoc, Apple, Sleep Number) rather than pretending a precise current Happy valuation is publicly proven.
