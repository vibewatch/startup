  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: billing-controls
    missingEvidence: Coding protocols, audit results, denial rates, repayment history, and medical-necessity review process for CCM, RPM, and telehealth claims.
    whyItMatters: Compliance-heavy healthcare workflows can look healthy in headline growth while leaking gross margin or enforcement risk underneath.
    diligencePath: Request billing SOPs, recent claim audits, denial dashboards, and compliance ownership map.
    relatedQuestionRefs:
