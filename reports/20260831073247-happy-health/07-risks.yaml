tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Current evidence
  - Likelihood
  - Severity
  - Visible mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - Indication-expansion and substantiation drift
    - FDA proof is sleep-specific while fundraising coverage uses broader chronic-disease language; FTC substantiation bar remains high.
    - Medium
    - High
    - Two real 510(k) anchors; disclosed legal policies.
    - Future marketing or product expansion could outrun substantiated scope.
    - Request claim substantiation matrix and planned regulatory path for non-sleep indications.
  - - PHI privacy or breach event
    - Happy collects broad health data and discloses multi-party PHI sharing; HHS breach rules would apply to unsecured PHI incidents.
    - Medium
    - High
    - Published privacy policy and notice of privacy practices.
    - Security maturity and vendor oversight are still under-verified publicly.
    - Request incident history, BAAs, security audits, and breach tabletop materials.
  - - RPM / CCM billing-compliance failure
    - User Agreement and CMS rules show monthly billing coordination, coinsurance exposure, and one-provider-per-month limits.
    - Medium
    - High
    - Patient notices exist; workflow is explicit about non-emergency status.
    - Documentation, medical necessity, and denial-management quality are undisclosed.
    - Request coding protocols, denial rates, audit results, and compliance ownership.
  - - Consumer-dispute and marketing-liability event
    - Terms use arbitration/class waiver while FTC rules police endorsements and testimonial framing.
    - Low-Medium
    - Medium-High
    - Formal terms exist and opt-out process is disclosed.
    - A customer complaint or misleading-claims dispute could still create reputational damage.
    - Request complaint logs, legal reserve policy, and claims-review governance.
  notes: Rows are ordered by current residual severity rather than by legal novelty; they combine Happy-specific disclosures with the external rule sets that govern digital-health, privacy, and reimbursement conduct.
