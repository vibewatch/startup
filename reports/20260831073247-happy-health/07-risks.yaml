  - type: private-evidence-only
    severity: blocking
    topic: cohort-and-margin-visibility
    missingEvidence: Completed-test conversion, treatment attach, retention, gross margin, support cost, and payer-mix by patient path.
    whyItMatters: Without cohort and margin data, it is impossible to know whether the workflow is economically durable or operationally expensive.
