  topStrengths:
    - Real FDA-linked product proof and a physician-guided workflow distinguish Happy from wellness-only sleep rings.
    - Public sources indicate real patient usage rather than pre-product concept marketing.
    - >-
      The workflow design creates more lifetime-value potential than a one-time gadget sale if retention and treatment
      attach prove strong.
    - Sophisticated investors were willing to back the company with a large healthcare financing headline.
  topRisks:
    - Current valuation and revenue are not publicly disclosed, leaving price discovery unusually weak.
    - Reimbursement, billing, privacy, partner, and support complexity create a high residual-risk profile.
    - Public evidence does not disclose gross margin, retention, payer mix, or treatment-attach rates.
    - >-
      Any unicorn-style framing looks under-supported relative to the disclosure depth shown by stronger private and
      public comparables.
  unresolvedGaps:
    - Company-confirmed current post-money valuation.
    - Audited or management-reconciled revenue and gross margin by product path.
    - Cohort retention, treatment attach, and denial-rate dashboards.
    - Cap-table, liquidation preference, and option-pool detail.
    - Supplier concentration, security assurance, and reimbursement-audit evidence.
