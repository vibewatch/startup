  topStrengths:
    - 真实的 FDA 相关产品证据和医生引导工作流，让 Happy 区别于只做健康管理的睡眠戒指。
    - 公开来源显示产品已有真实患者使用，而不是停留在上市前概念营销。
    - 如果留存和治疗转化跑得出来，这套工作流设计带来的客户终身价值潜力会高过一次性硬件销售。
    - 成熟投资人愿意用一笔大额 healthcare 融资头条背书公司。
  topRisks:
    - 当前估值和收入没有公开披露，价格发现异常薄弱。
    - 报销、计费、隐私、合作伙伴和支持链条都很复杂，剩余风险仍高。
    - 公开证据没有披露毛利率、留存、付款方结构或治疗转化率。
    - 对比披露更充分的强势私营和上市可比公司，任何独角兽式叙事都缺少足够支撑。
  unresolvedGaps:
