- calloutType: risk
  title: Scale asymmetry is the chapter’s dominant competitive risk
  body: Happy is up against companies with million-scale memberships, multi-billion-dollar valuations, global device distribution, or multi-billion-dollar revenue bases. That makes customer acquisition, channel access, and future feature parity a serious moat-compression threat.
  claimRefs:
