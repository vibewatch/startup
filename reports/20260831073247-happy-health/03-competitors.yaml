  - CP040
- calloutType: strength
  title: Wellness rivals still stop short of full diagnosis in the reviewed evidence
  body: Oura disclaims medical-diagnosis use, Apple positions apnea detection as a notification, Samsung describes abnormal-sign monitoring, and WHOOP’s reviewed materials emphasize health guidance rather than sleep-apnea diagnosis. That leaves a meaningful gap for a provider-mediated entrant today.
