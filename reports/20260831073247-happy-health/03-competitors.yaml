  rows:
  - - Happy Health
    - Direct regulated entrant
    - Raised $75M in 2026; public usage in the tens of thousands
    - Symptomatic adults seeking sleep-apnea diagnosis and treatment navigation
    - FDA-cleared ring-based sleep-diagnostics workflow plus follow-up care options
    - Far smaller public scale than major wellness platforms and large sleep incumbents
  - - Oura
    - Wellness smart ring leader
    - $11B valuation, $900M+ new funding, 5.5M rings sold, $500M+ 2024 revenue
    - Consumers, employers, insurers, clinicians pursuing preventive health
    - Large installed base, strong brand, membership engagement, expanding health partnerships
    - Official materials say Oura is not a medical device and cannot diagnose sleep apnea
  - - WHOOP
    - Membership-based performance and health wearable
    - 2.5M+ members, $10.1B valuation, $1.1B bookings run rate, 56-country shipping
    - Performance, longevity, and health-conscious consumers plus growing medical-adjacent use cases
    - High-engagement membership model, deep data asset, regulated ECG, capital scale
    - Reviewed evidence does not show an OSA-diagnostic workflow equivalent to Happy’s public positioning
  - - Apple Watch sleep-apnea feature
    - Platform incumbent / adjacent substitute
    - Global feature rollout in 150+ countries on supported Apple Watch devices
    - Existing Apple Watch users with possible undiagnosed sleep issues
    - Massive installed base and frictionless feature distribution
    - Notification detects signs only and is not the same as a physician-reviewed diagnosis
  - - Samsung Galaxy Ring / Health
    - Platform incumbent / adjacent substitute
    - Galaxy Ring expanded to 53 markets with sleep-centric wellness positioning
    - Samsung ecosystem users seeking sleep and wellness tracking
    - Distribution, device ecosystem integration, wellness-led sleep feature expansion
    - Reviewed sources describe monitoring abnormal signs such as sleep apnea, not end-to-end diagnosis
  - - WatchPAT / ResMed-linked HSAT incumbents
    - Direct diagnostic incumbent class
    - ResMed generated $5.7B FY2026 revenue and serves 140 countries; WatchPAT aids OSA and CSA diagnosis
    - Providers, sleep clinics, and referred patients
    - Provider-channel credibility, established diagnostic workflow, large balance-sheet support
    - Form factor is less consumer-like than a ring and may feel less lifestyle-friendly
  - - Belun / Sunrise wearable HSAT challengers
    - Direct diagnostic challenger class
    - Belun markets FDA-cleared ring-based HSAT; Sunrise markets prescription-only multi-night testing
    - Providers and patients wanting lower-friction home testing
    - Wearable or low-profile home testing with multi-night or specialist-reviewed workflows
    - Much smaller known distribution than Apple, Samsung, Oura, or ResMed
  notes: Rows group some incumbent classes where the buyer job and strategic threat are more important than parsing minor brand differences.
