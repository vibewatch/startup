  rows:
  - - Happy Health
    - $396 test, $99 follow-up, $1,999 oral appliance, $999-$1,799 CPAP bundle
    - Diagnosis workflow plus treatment monetization options
    - Realized reimbursement and gross margin unknown
    - Transparent clinical episode pricing supports direct comparison and downstream upsell analysis
  - - Oura
    - Device plus membership model
    - Sleep and wellness insights, 50+ health metrics
    - Reviewed source does not disclose current device or membership price
    - Likely optimized for long-term engagement more than one-time diagnostics
  - - WHOOP
    - Membership model with free-trial entry and ongoing active membership requirements for some features
    - Recovery, strain, sleep, ECG, labs, other health guidance
    - Reviewed source does not disclose full plan pricing in retained evidence
    - Recurring-revenue model may support higher lifetime value and stickier habits
  - - Apple Watch sleep-apnea feature
    - Hardware-bundled platform feature
    - Sleep-apnea notifications and broader health metrics on supported watch models
    - No standalone sleep-apnea feature price disclosed in reviewed source
    - Apple can distribute health features without asking users to buy a dedicated sleep device
  - - Samsung Galaxy Ring / Health
    - Hardware-bundled ecosystem feature set
    - Sleep tracking, blood oxygen, skin temperature, abnormal-sign monitoring
    - List device price not retained in reviewed source; reimbursement eligibility note is not the same as price
    - Platform bundling lowers feature-discovery friction for existing Samsung users
  - - HSAT incumbents and challengers
    - Mostly provider- or episode-based models
    - Clinician-reviewed home testing, often with specialist workflow
    - Public realized pricing often opaque in reviewed sources
    - Economic comparison against Happy remains incomplete without payer and realized-price data
