- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - FDA-cleared diagnostic positioning
    - Apple, Samsung, WHOOP, or Oura could obtain stronger medical claims or partner into care pathways
    - High
    - Regulatory differentiation could compress if bigger platforms move closer to diagnosis
    - Track competitor submissions, partnerships, and care-navigation launches quarterly
  - - Ring comfort and low-friction wearability
    - Belun and other smart-ring makers already prove ring hardware itself is not unique
    - Medium-High
    - Comfort helps conversion but does not guarantee durable pricing power
    - Request comparative completion and adherence data versus finger, watch, and patch alternatives
  - - Integrated diagnosis-to-treatment model
    - Direct incumbents or payers may prefer separate best-of-breed diagnostic vendors and downstream therapy partners
    - High
    - Happy economics depend on attachment to treatment and monitoring
    - Request actual conversion and attach-rate data by treatment modality
  - - Transparent list pricing
    - Larger incumbents can discount, bundle, or hide realized pricing inside broader contracts
    - Medium
    - List-price transparency can lose in negotiated channels
    - Request payer-contracted rates and denial trends
  - - Provider and payer access
    - ResMed, WatchPAT, and large platform brands may have stronger channel leverage
    - High
    - Distribution power can overwhelm superior form factor
    - Request provider-network density, referral sources, and contracted payer lives
  - - Data / AI advantage
    - Wellness leaders and WHOOP report much larger installed bases and data assets
    - Medium-High
    - Scale can improve models, retention, and adjacent product velocity
    - Request validation evidence showing where Happy’s model materially outperforms substitutes
  notes: The central moat question is whether Happy owns a durable workflow wedge or only a temporary product packaging advantage.
