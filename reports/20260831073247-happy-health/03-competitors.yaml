callouts:
- calloutType: insight
  title: Happy’s real edge is clinical workflow, not smart-ring novelty
  body: The ring itself is not a durable moat when Oura, Samsung, RingConn, and Ultrahuman all prove the hardware format can commoditize. The differentiated layer is regulated diagnosis, provider interpretation, and downstream treatment capture.
  claimRefs:
