    - No public BOM, manufacturing partner, or failure-rate disclosure
  - - Sizing, charger, and fulfillment workflow
    - Patient / operations
    - Commercial
    - Bridges consumer-friendly hardware setup with clinical workflow
    - Public operational metrics for sizing completion and replacement rates are missing
  - - Happy Sleep mobile app
    - Patient
    - Commercial on iOS and Android
    - Handles onboarding, testing, reminders, and treatment tracking in one surface
    - Public reliability metrics and crash rates are not disclosed
  - - Happy Health Home Sleep Test SaMD
    - Clinician
    - FDA-cleared
    - Computes hAHI and total sleep time from ring data in a provider-directed workflow
    - No published technical documentation beyond FDA filing and marketing pages
  - - Clinician web viewer / reporting layer
    - Clinician
    - Commercial / operationally visible
    - Clinician review turns wearable data into usable diagnostic output
    - No public screenshots, user docs, or workflow timing benchmarks found
  - - Treatment management / efficacy monitoring
    - Patient + clinician
    - Commercially claimed
    - Extends from diagnosis into CPAP, oral appliance, medication, and ongoing tracking
    - No public attach-rate or longitudinal engagement metrics disclosed
  notes: The product is modeled as a multi-module care system because the user journey depends on each layer functioning together, not on ring hardware alone.
