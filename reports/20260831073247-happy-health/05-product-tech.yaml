- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Ring sensor suite
    - Captures physiologic signals from the finger
    - Hardware reliability and signal quality
    - Undisclosed field failure rate or wear-compliance performance
  - - BLE / device connectivity
    - Moves ring data into mobile workflow
    - Bluetooth Low Energy and user phone compatibility
    - Connectivity or pairing issues can interrupt data collection
  - - Mobile application
    - Orchestrates onboarding, sleep testing, reminders, and patient communications
    - iOS / Android app quality and identity flow
    - App bugs can stall onboarding and treatment management
  - - Secure API / cloud transfer
    - Transmits ring data for analysis and storage
    - Backend reliability and secure data handling
    - No public uptime, latency, or outage history found
  - - AHI / total sleep time algorithms
    - Convert sensor data into diagnostic outputs
    - Clinical validation quality and software change control
    - Public evidence is stronger for clearance than for real-world drift monitoring
  - - Clinician web viewer
    - Allows providers to review reports and use outputs in diagnosis
    - Provider access and workflow usability
    - No public workflow documentation or integration detail found
  - - Partner / insurer operations
    - Support billing, coverage, and routed referrals
    - Operational partnerships and revenue-cycle coordination
    - Insurance or partner friction can stop adoption despite technical readiness
  notes: Architecture rows mix hardware, software, and human process because the FDA-cleared diagnostic outcome depends on the whole operating loop.
