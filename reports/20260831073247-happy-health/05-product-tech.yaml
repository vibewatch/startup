- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Initiate sleep-apnea diagnosis
    - Order test, complete intake, wear ring overnight, review with doctor
    - Happy Sleep app plus ring plus virtual physician review
    - At-home workflow reduces need for sleep-lab visit
    - Still requires provider-directed interpretation and successful app onboarding
  - - Track treatment effectiveness
    - Use ring and app after diagnosis while doctor reviews progress
    - Continuous treatment tracking across CPAP, oral appliances, and medications
    - Potential for more tailored treatment adjustments over time
    - No public evidence quantifies adherence or outcome improvement
  - - Upload insurance and billing information
    - Submit payer information digitally during intake
    - App and support-center intake flow
    - Potentially faster access and less manual paperwork
    - User reviews show this step can fail and create support burden
  - - Support clinical follow-up
    - Receive results and individualized treatment plan through virtual care
    - Board-certified sleep physician workflow and care team
    - Same-day or remote review is claimed by trade coverage
    - Public physician-capacity and wait-time metrics are undisclosed
  - - Support research / RPM and home-based healthcare use cases
    - Use ring and data stack beyond one-off diagnosis
    - Tech page positions the platform for remote monitoring, clinical trials, and broader home-based care
    - Could expand utility beyond sleep testing
    - Public proof for non-sleep production deployments is limited
  notes: Benefits are framed as workflow outcomes, not guaranteed clinical outcomes, unless a cited source directly supports a measurable claim.
