- id: trust-safety-security-and-quality-controls
  title: Trust, safety, security, and quality controls
  body: 'Trust and compliance are strong on basic regulatory evidence but weaker on publicly inspectable security depth. The FDA filings provide the most concrete quality-control proof: non-clinical testing, usability engineering, safety and EMC testing, wireless coexistence work, software V&V, cybersecurity documentation, and clinician-reviewed outputs all appear in the clearance path. The tech page and privacy policy then layer on broader governance claims, including 21 CFR Part 11 alignment, HIPAA/NIST/COPPA/GDPR/CCPA guidance, SMART on FHIR interoperability, end-to-end passwordless cryptographic security, deletion rights, and limits on targeted advertising use of product/mobile-app data. That is a credible trust posture narrative. Still, key enterprise-style diligence questions remain open: no public SOC 2 report, ISO 27001 certificate, penetration-test summary, uptime/status page, manufacturing quality partner, or detailed SDK documentation was found in the retained evidence. For a
    product that combines health data, regulated outputs, and care delivery, those missing artifacts matter.'
