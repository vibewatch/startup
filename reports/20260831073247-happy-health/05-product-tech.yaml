callouts:
- calloutType: strength
  title: The product moat is the full workflow stack, not the ring alone
  body: 'The public evidence points to a real operating stack: regulated hardware, mobile intake, secure API transfer, clinician review, and downstream treatment tracking. That is harder to replicate than a smart ring in isolation.'
  claimRefs:
  - CE001
  - CE003
  - CE006
  - CE008
  - CE009
  - CE028
  - CE031
- calloutType: risk
  title: Support and onboarding quality are critical technical risks, not minor UX issues
  body: Because data capture, billing, clinician review, and treatment tracking are tightly coupled, app bugs or insurance-intake failures can destroy value before the diagnostic engine has a chance to prove itself.
  claimRefs:
  - CE020
  - CE021
  - CE029
  - CE037
  - CE040
  - CE041
- calloutType: risk
  title: Public security posture is narrative-rich but artifact-light
  body: Happy claims strong privacy, interoperability, and cryptographic design, but the retained evidence did not surface public audit reports, certifications, SDK docs, or status transparency comparable to more mature enterprise platforms.
