  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, board committee structure, and investor control-rights summary.
    whyItMatters: Without governance visibility, it is difficult to assess founder control, downside protections, or whether strategic investors can influence operating decisions.
    diligencePath: Request the latest board list, voting agreements, and side-letter summary from the company or lead investor.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: blocking
    topic: funding
    missingEvidence: A reconciled cap-table chronology confirming whether the publicized $75M is a fresh 2026 Series A or cumulative funding since 2019.
    whyItMatters: Round structure affects cash-runway analysis, dilution history, valuation interpretation, and comparable-set placement in the valuation chapter.
    diligencePath: Obtain the signed financing summary, prior round dates, and exact amount of the final 2025 tranche directly from management or counsel.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO003
    - TO004
  - type: missing-source
    severity: material
    topic: founding-date
    missingEvidence: Primary public incorporation date or founder-era filing showing when Happy Health was created.
    whyItMatters: Founding date anchors company age, development pace, and round-to-maturity comparisons against peers.
    diligencePath: Request Delaware/Texas incorporation documents or founder biography materials that state the original formation date.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: blocking
    topic: economics
    missingEvidence: Current revenue, gross margin, payer mix, and post-money valuation.
    whyItMatters: These are core underwriting inputs for valuation, capital adequacy, and unit-economic quality.
    diligencePath: Request management’s latest KPI dashboard, board deck, or financing memo with revenue, valuation, and payer mix details.
    relatedQuestionRefs:
    - QO014
  - type: missing-source
    severity: material
    topic: debt-and-secondaries
    missingEvidence: Any debt facilities, equipment finance, warehouse lines, or secondary transactions associated with the business.
    whyItMatters: Non-equity obligations can materially change liquidity, preference overhang, and downside protection.
    diligencePath: Ask for the debt schedule, lender list, and any secondary transaction history from the finance team or lead investors.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
