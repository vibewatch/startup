callouts:
- calloutType: strength
  title: Regulatory proof is ahead of disclosure proof
  body: Happy Health already has a stronger public regulatory record than many digital-health startups at a comparable visibility level. Two FDA-cleared components and a clearly described clinician-directed workflow make the product legible as a medical offering, not just a wellness gadget.
  claimRefs:
  - CO011
  - CO013
  - CO015
- calloutType: risk
  title: Capital-structure ambiguity is a real diligence issue, not a wording quirk
  body: The difference between “$75M Series A in 2026” and “$75M across rounds since 2019 with the last tranche in 2025” materially changes the underwriting story. Until management reconciles that discrepancy directly, investors should not treat the public financing label as settled fact.
  claimRefs:
  - CO026
  - CO027
  - CO028
  - CO031
- calloutType: insight
  title: Happy Health is closer to a care platform with regulated hardware than to a single-device company
  body: The monetization surface spans diagnosis, physician visits, oral appliances, CPAP bundles, and ongoing tracking. That broader care-loop design could create more durable economics than one-time hardware sales, but it also raises execution complexity in payer operations, clinical staffing, and software reliability.
  claimRefs:
  - CO002
  - CO004
  - CO007
  - CO042
  - CO043
