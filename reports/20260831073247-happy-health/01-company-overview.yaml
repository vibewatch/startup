- id: leadership-and-governance
  title: Leadership, clinical depth, and governance visibility
  body: The reviewed public record is much clearer on clinical leadership than on formal governance. Multiple independent funding articles and the FDA submission for the Home Sleep Test identify Dr. Dustin Freckleton as founder and CEO, and they anchor the company mission to his own stroke at age 24 and delayed sleep apnea diagnosis years later. Happy Health also highlights clinical depth through Dr. Jagdeep Bijwadia, whose February 2025 profile names him Chief Medical Officer and describes prior experience spanning sleep medicine, telehealth, and medtech advisory roles. Sleep Review separately names neurologist Jeff Durmer as an advisor. On the capital side, ARCH managing director Paul Berns is publicly associated with the company thesis, and OpenLoop publicly described Happy Sleep as a partner. What remains missing is a full board slate, director-by-director governance map, and any disclosed information on investor control rights or secondary ownership. That lack of transparency does not
    invalidate the operating story, but it means governance cannot yet be treated as fully diligence-ready.
  claimRefs:
