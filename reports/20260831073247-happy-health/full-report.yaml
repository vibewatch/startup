      - CR021
      - CR025
      - CR026
      - CR027
      - CR037
      - CR044
  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Regulatory substantiation drift
        - Claim scope or product positioning expands beyond sleep-testing evidence
        - Regulator inquiry, takedown demand, or inability to show evidence map for new indications
        - Pause investment / downgrade thesis until claim-governance proof is produced.
      - - Privacy / security breakdown
        - PHI incident or failed security review
        - Any reportable unsecured-PHI breach or material audit deficiency
        - Escalate to legal/compliance diligence and re-underwrite brand trust.
      - - Billing-compliance failure
        - Denied or questioned RPM/CCM claims
        - Meaningful denial spike, repayment demand, or failed coding audit
        - Assume margin compression and possible enforcement tail risk.
      - - Operational funnel fragility
        - Conversion or support quality deteriorates
        - Completed-test rate falls or support backlog persists for multiple weeks
        - Treat revenue plan as operationally constrained rather than demand constrained.
      - - Disclosure gap persists despite financing
        - New round closes with no cohort, payer-mix, or margin disclosure
        - Another financing event still lacks underwriting KPIs
        - View valuation as outrunning proof and avoid price chasing.
    notes: >-
      The kill criteria are designed to be monitorable from a board or diligence perspective rather than from abstract
      strategic intuition.
    claimRefs:
      - CR040
      - CR041
      - CR042
      - CR043
      - CR044
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Confidence
      - Why
      - Decision implication
    rows:
      - - Recommendation
        - TRACK
        - Medium
        - Company quality looks real, but valuation proof is incomplete.
        - Continue diligence; avoid price chasing.
      - - Risk rating
        - High
        - Medium
        - Healthcare workflow, reimbursement, and disclosure risks remain substantial.
        - Need downside protection or better data.
      - - Valuation stance
        - Stretched if unicorn-priced
        - Medium
        - Public evidence does not yet support a firm $1B+ underwriting case.
        - Require discount or new disclosure.
      - - Upside driver
        - Clinical workflow plus regulatory differentiation
        - Medium
        - FDA-cleared diagnostic positioning could support premium economics if proven.
        - Keep name active on watchlist.
      - - Blocking gap
        - Revenue and cohort opacity
        - High
        - No public revenue, retention, or margin disclosure.
        - No BUY without data package.
    notes: >-
      The recommendation is evidence-sensitive and price-sensitive; it is not a generic score for whether Happy is an
      interesting company.
