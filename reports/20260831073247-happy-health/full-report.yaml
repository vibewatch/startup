      - number: '8.2'
        title: Comparable framework and scenario math
        blocks:
          - type: paragraph
            body: >-
              Because Happy does not disclose revenue, the right way to value it from public evidence is not false
              precision; it is a comp-and-scenario framework. The most relevant private wearable leaders are Oura and
              WHOOP. They show that very large valuations are possible in preventive-health wearables, but they also
              show the proof burden required to earn those marks: both companies disclose much more about valuation,
              funding, and commercial scale than Happy currently does. Public comps add a second lens. ResMed, DexCom,
              and Garmin each trade around roughly 6x to 8x revenue in August 2026 using retained market-cap and filing
              data, while Teladoc trades closer to 0.5x and Sleep Number illustrates how harsh re-rating can become for
              struggling hardware. Apple’s overall revenue multiple is higher, but it is a broad platform multiple and
              therefore a weak direct comp. The comp lesson is that premium pricing is possible, but only with proven
              scale. On that logic, a hypothetical $1 billion Happy valuation would usually require something like $143
              million of revenue at 7x or $200 million at 5x—numbers that cannot be confirmed because Happy has not
              disclosed revenue at all.
            claimRefs:
