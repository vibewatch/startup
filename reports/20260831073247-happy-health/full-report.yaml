  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape by competitor class
        blocks:
          - type: paragraph
            body: >-
              The most important competitive distinction is not ring versus watch, but clinical diagnostic workflow
              versus consumer wellness engagement. Happy Health’s public materials position it as a regulated,
              home-based sleep-diagnostics and care platform rather than a general readiness wearable. Oura, WHOOP,
              RingConn, Ultrahuman, Apple Watch, and Samsung Galaxy Ring/Health all compete for sleep-related attention
              and ongoing engagement, but their reviewed materials mostly emphasize tracking, coaching, or notifications
              rather than physician-interpreted OSA diagnosis. On the other side, WatchPAT, Sunrise, Belun, and broader
              ResMed-linked home testing compete much more directly for the same clinical job: getting a symptomatic
              patient through home testing into diagnosis and therapy. That means Happy faces substitute pressure from
              both sides at once: wellness players can own top-of-funnel mindshare, while diagnostic incumbents can own
              provider-channel credibility. The practical implication is that Happy must beat very different
              alternatives in different moments: a wellness brand during symptom awareness, and a provider-trusted
              diagnostic tool during clinical ordering.
            claimRefs:
