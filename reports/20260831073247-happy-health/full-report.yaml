companyProfile:
  summary: >-
    Happy Health is an Austin-based digital health startup pairing the Happy Ring with a regulated, physician-guided
    sleep-diagnostics and treatment workflow. The strongest public proof is two FDA anchors, real patient-facing apps,
    and reported usage in the tens of thousands. The business is more strategically interesting than a commodity smart
    ring because it links home testing, clinician review, treatment pathways, and ongoing monitoring rather than
    stopping at consumer wellness tracking. At the same time, the public dataset remains unusually thin on the numbers
    that matter for underwriting: current valuation, recognized revenue, gross margin, payer mix, treatment attach,
    retention, cap-table structure, and reimbursement economics.
  foundedDate: null
  founders:
    - name: Dr. Dustin Freckleton
      role: Founder and CEO
      background: >-
        Physician-founder whose personal experience with stroke at age 24 and a later sleep-apnea diagnosis anchors the
        company mission and most of the public company narrative.
      claimRefs:
        - CO019
  foundingLocation: Austin, Texas, USA
  headquarters: Austin, Texas, USA
  productSummary: >-
    Happy’s core product is the Happy Ring plus software and clinical workflow used for at-home, multi-night sleep
    testing and follow-on care. Public evidence supports a model that can route a patient from onboarding and insurance
    handling into remote consultation, diagnosis, treatment selection, and later monitoring.
  customerFocus: >-
    Symptomatic adults seeking sleep-apnea and insomnia evaluation, along with the clinicians, insurers, and partner
    care channels that influence or pay for the episode of care.
  businessModel: >-
    Hybrid device plus clinical-workflow model spanning self-pay and insurance-supported diagnostic episodes, with
    potential expansion into monitoring, treatment attachment, and future chronic-care pathways. Public sources do not
    disclose revenue mix or unit economics.
  stage: Series A
  fundingStatus: >-
