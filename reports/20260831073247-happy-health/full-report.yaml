      - number: '2.4'
        title: Growth drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The adoption tailwinds are straightforward: a large undiagnosed population, long wait times for specialist
              access, the comfort advantage of home-based testing, expanding telemedicine habits, and broader clinical
              adoption of wearable data. MedCity quotes one sleep doctor for every 43,000 Americans and multi-month
              waits, while AASM and NIH sources underline the medical cost of delayed diagnosis. Broader wearables
              reports also point to home healthcare, remote monitoring reimbursement, and interoperability as demand
              drivers. The constraint set is just as important. AASM does not permit HSAT to be used as asymptomatic
              mass screening, and diagnosis cannot rest solely on auto-scored data; provider review remains mandatory.
              Happy’s FDA indication is limited to adults 22 and older suspected of sleep apnea, excluding pediatric and
              lower-certainty populations. Privacy, cybersecurity, and clinical accuracy concerns remain active across
              the category, and broader wearable-market figures can easily overstate the portion of spend that a
              regulated sleep-diagnostics platform can actually capture. The major unresolved diligence gaps are
              state-by-state contracted coverage, clinician-capacity ceilings, diagnostic-to-treatment conversion, and
              the exact reimbursed versus self-pay mix of current volume.
