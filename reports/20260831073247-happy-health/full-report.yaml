  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buyer map
        blocks:
          - type: paragraph
            body: >-
              Happy Health’s customer base is multi-sided even though the most visible end user is the symptomatic adult
              patient. The user is the person wearing the ring, but the workflow also depends on the ordering or
              reviewing clinician, the payer that may cover the episode, and partner channels that can route patients
              into the system. Public pages show both self-pay and insurance-covered entry points, while Business
              Insider says patients can buy online or be referred by a doctor. OpenLoop’s 2026 partner update adds
              another layer by showing that partner patients can also enter through virtual-care infrastructure rather
              than only through direct consumer acquisition. In practice, this means Happy’s customer base is best
              segmented as individual patients, referring or reviewing clinicians, payers, and B2B2C channel
              partners—not as a simple one-buyer one-user consumer app business. The practical underwriting implication
              is that customer quality cannot be read from consumer app behavior alone, because payer approval, provider
              access, and partner routing all shape who can actually become a successful long-term user. It also means
              segment economics probably differ sharply: self-pay users care about speed and clarity, insured users care
              about coverage certainty, and partner-routed users care about how smoothly Happy integrates into someone
              else’s care journey.
