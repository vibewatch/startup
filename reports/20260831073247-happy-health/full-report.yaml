  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and unmet-need baseline
        blocks:
          - type: paragraph
            body: >-
              The core demand problem is not whether sleep apnea exists, but which spend bucket should be counted as
              Happy Health’s real market. The narrowest lens is home sleep apnea testing (HSAT): portable or wearable
              diagnostic devices and related review workflows used outside sleep labs for suspected sleep-disordered
              breathing. That category excludes downstream therapies such as CPAP machines, oral appliances, and most
              consumer wellness wearables that cannot diagnose OSA. A broader adjacency includes clinically oriented
              wearable medical devices and remote patient monitoring platforms, where home healthcare, biosensor
              miniaturization, and cloud analytics are pushing more care outside hospitals. Public-health burden
              supports the relevance of both lenses. AASM and Sleep Education put U.S. OSA prevalence near 30 million
              with roughly 80% of cases undiagnosed, while NIH, Mayo, Johns Hopkins, and the American Heart Association
              all emphasize downstream links to cardiovascular disease, stroke, diabetes, and daytime impairment. For
              Happy Health, that means the true market is not all wearables; it is the subset of regulated,
              provider-interpreted, home-based diagnostics that can reduce the diagnosis gap.
            claimRefs:
