        - Current sleep workflow appears real and regulated.
        - Request phased roadmap with gates for each new indication or care model.
      - - Compliance and revenue-ops ownership
        - CCM/RPM and payer workflows require specialized controls, yet public owners are not disclosed.
        - Medium
        - High
        - Policies and patient notices are present.
        - Request compliance org, coding owner, denial-management owner, and internal audit process.
    notes: >-
      People risk is driven less by celebrity key-person issues than by whether the disclosed bench matches the
      complexity of a regulated care workflow.
    claimRefs:
