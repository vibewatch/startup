chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and care model
        blocks:
          - type: paragraph
            body: >-
              Happy Health presents itself as a physician-guided home-care company rather than a pure consumer wearable
              startup. Its customer-facing service, Happy Sleep, packages the Happy Ring, a mobile app, telehealth
              visits, diagnostic review, and ongoing treatment support into one at-home workflow focused first on sleep
              disorders. The company website repeatedly frames the value proposition as replacing the traditional
              referral-to-lab pathway with a consumer-first path that starts online, ships a ring to the home, and
              routes results to a board-certified sleep physician. Commercially, the platform supports both
              insurance-covered and self-pay use. The current public price sheet lists $396 for home sleep testing, $99
              for a follow-up visit, $1,999 for a custom oral appliance, and $999-$1,799 for a CPAP bundle, while the
              website also says the service is in-network with major plans including Blue Cross and Medicare. That
              combination of regulated hardware, clinical review, and treatment monetization is the core identity later
              chapters should reuse.
