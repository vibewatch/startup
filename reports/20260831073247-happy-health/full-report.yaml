      - number: '2.2'
        title: Sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              Public market-size estimates diverge because they are counting different things. Future Market Insights
              defines the home sleep apnea testing market narrowly and arrives at $734.4 million in 2026, with wearables
              holding 66.1% share and obstructive sleep apnea itself representing 95.7% of indication mix. The Business
              Research Company takes a broader device-revenue lens and estimates a $2.19 billion 2026 HSAT devices
              market growing to $3.24 billion by 2030. Broader still, Precedence Research and Mordor place wearable
              medical devices at $67.65 billion and $55.7 billion respectively in 2026, with home healthcare already
              accounting for more than half of application share. A bottom-up patient-wallet lens produces much larger
              numbers than either HSAT report: multiplying the 23.5 million estimated undiagnosed U.S. cases by Happy’s
              $396 self-pay price yields roughly $9.3 billion of diagnostic wallet, or about $11.6 billion if a $99
              follow-up is added. Those figures are not contradictory to the vendor reports; they answer a different
              question by using prevalent patient need and list pricing rather than realized annual device revenue. The
              right underwriting stance is to preserve all lenses rather than forcing one false precision number.
