      - number: '7.3'
        title: Financial model risk and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The final risk layer is that investors still cannot cleanly underwrite how this compliance-heavy workflow
              translates into durable economics. Public coverage confirms real usage and meaningful financing momentum,
              but it does not disclose payer mix, gross margin, therapy attach, denial rates, support cost, or cohort
              retention. That missing data is not a minor nuisance; it is the lens needed to decide whether Happy is
              building a defensible clinical platform or an expensive operational machine that looks elegant only in
              headline narratives. The chronic-disease expansion ambition raises the stakes further because scope
              expansion usually requires new evidence, more partners, more reimbursement nuance, and deeper bench depth.
              Publicly, the operating bench is still thinly disclosed relative to the complexity of the mission. The
              strongest visible mitigations are helpful—FDA clearances, live apps, documented legal frameworks, explicit
              billing caveats, and partner proof—but they do not neutralize the residual risks. The right interpretation
              is therefore not that Happy is broken, but that the company is in a zone where one regulatory, billing, or
              onboarding failure could travel quickly into revenue, customer trust, and valuation. Until management
              provides those dashboards, the prudent view is to treat the current residual-risk score as driven by
              missing operating proof as much as by any visible negative event.
