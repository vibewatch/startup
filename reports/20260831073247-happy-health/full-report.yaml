  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and privacy exposure
        blocks:
          - type: paragraph
            body: >-
              Happy Health’s risk stack starts with the fact that it is not merely selling a wellness wearable. The
              company has real regulatory proof—two public FDA clearances tied to ring-based monitoring and a home sleep
              test workflow—but those hard approvals are still narrower than the broader “continuous at-home healthcare”
              or chronic-disease-expansion narrative used in fundraising coverage. That creates the first major residual
              risk: if growth or marketing gets ahead of substantiated scope, Happy could move from being a
              well-positioned sleep workflow into a more exposed digital-health claims story. FTC guidance is
              particularly relevant here because it sets a high bar for health-product substantiation and makes clear
              that testimonials, influencers, and enthusiastic patient anecdotes do not replace competent and reliable
              scientific evidence. The company also processes sensitive health and payment information through a
              multi-entity care workflow. Its own privacy and PHI notices show extensive data collection,
              treatment/payment/operations sharing, and business-associate dependencies. In other words, Happy’s legal
              surface area is structurally larger than the ring alone would suggest: regulatory scope, marketing
              discipline, reimbursement compliance, privacy governance, and dispute posture all matter simultaneously.
              That is why the regulatory story should be treated as a living operational discipline, not a one-time
              clearance milestone already safely behind the company.
