      - number: '8.3'
        title: 'Recommendation: track, not buy'
        blocks:
          - type: paragraph
            body: >-
              The recommendation is TRACK with medium confidence and high risk. The pro-thesis is legitimate: Happy has
              clinical differentiation that consumer-only smart rings do not, a multi-sided workflow that can capture
              more value than one-time hardware, and a large untreated sleep-apnea market. Those facts justify continued
              interest and explain why sophisticated investors were willing to fund the company. The anti-thesis is
              equally important: investors still cannot see revenue, gross margin, cap-table terms, preference stack,
              treatment-attach rates, reimbursement denial rates, or cohort retention. In other words, the business may
              deserve a premium to commodity rings, but there is not enough public evidence to justify paying a premium
              private-market price that assumes software-like economics or a near-term unicorn outcome. This is why
              TRACK beats both BUY and PASS. BUY would over-trust a price signal that is not publicly substantiated.
              PASS would ignore genuine product reality and regulatory differentiation. The right posture is to keep the
              name warm, but refuse to chase a valuation that outruns proof.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV031
