      - number: '7.2'
        title: Operational and partner fragility
        blocks:
          - type: paragraph
            body: >-
              The second layer of risk is execution complexity. Happy’s retained public promise is ambitious: same-day
              virtual appointments, insurance-covered or self-pay entry, home ring delivery, multi-night testing,
              clinician review, treatment selection, and potentially ongoing monitoring. That workflow is attractive
              because it increases lifetime-value potential, but it also creates many more failure points than a simple
              device sale. App Store evidence already shows insurance-upload failures, support delays, and ring-size
              workflow glitches, which means the conversion funnel can break long before diagnostic accuracy matters.
              The risk is amplified by partner dependence. OpenLoop’s partner update and Happy’s own User Agreement show
              that care delivery can rely on affiliated professional corporations and third-party practices, not just a
              single vertically integrated employer model. Payer-network exceptions and out-of-network pathways add
              another dependency layer. Even the hardware model carries operational consequences because users may keep
              the ring for future efficacy visits and ongoing tracking, tying logistics and replacement economics to
              retention behavior. The overall takeaway is that Happy’s product may be clinically interesting, but the
              business will succeed or fail through customer operations, partner reliability, and reimbursement
              execution. The same multi-step design that makes the experience clinically differentiated also makes
              failures harder to localize and more expensive to remediate once volume scales.
