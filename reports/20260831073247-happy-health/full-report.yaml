  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and monetization
        blocks:
          - type: paragraph
            body: >-
              Happy Health’s public revenue design is broader than a one-time smart ring purchase. Company materials and
              Business Insider show an episode-based sleep-care workflow that can generate revenue from the initial
              diagnostic test, physician review, follow-up consultations, oral appliance sales, CPAP bundles, and
              potentially later efficacy monitoring. The company also supports two top-of-funnel payment paths:
              insurance-covered episodes and discounted self-pay. Importantly, the $396 self-pay offer is not just
              hardware; Business Insider says it includes the ring, one year of sleep tracking, and physician
              consultations, while the return policy says the patient keeps the ring for future efficacy appointments
              when applicable. That implies the company is effectively bundling hardware, software, and clinical
              services inside one acquisition price. Financially, this is attractive because the first purchase can open
              a wider care relationship, but it also means revenue recognition and gross margin likely span multiple
              cost buckets rather than behaving like pure software or pure device sales.
