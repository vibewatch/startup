      - number: '8.4'
        title: What would change the view
        blocks:
          - type: paragraph
            body: >-
              The path to an upgrade is straightforward even if the current valuation is not. Happy would become much
              more investable at a premium price if management disclosed audited or management-reconciled revenue, gross
              margin by path, reimbursement denial data, treatment-attach behavior, and patient-retention cohorts
              showing that the ring-plus-care model creates durable economics rather than just an elegant workflow. A
              price change could also improve the case: if the next entry point were priced much closer to a
              public-evidence base case than to an unsupported unicorn headline, the asymmetry could turn attractive
              even before every metric is perfect. The downgrade path is just as clear. If adoption stalls,
              reimbursement friction proves severe, treatment attach is weak, or management again seeks a high price
              without solving basic disclosure gaps, the thesis should move from TRACK to PASS. The most important
              diligence ask is therefore not another narrative deck—it is a reconciled operating package that connects
              clinical workflow reality to revenue quality, margin durability, and exit readiness.
            claimRefs:
