  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Happy’s architecture layers from ring sensors up through app, secure data transport, algorithmic analysis, and
      clinician-facing diagnostic review.
    data:
      layers:
        - label: Care delivery layer
          detail: >-
            Board-certified physician review, treatment planning, and ongoing efficacy monitoring translate device
            outputs into clinical action.
        - label: Clinical software layer
          detail: >-
            Web-based clinician viewer exposes hAHI and total sleep time outputs generated by the home-sleep-test
            software.
        - label: Data infrastructure layer
          detail: >-
            Secure API transfer, cloud integration, storage, export, and sharing infrastructure move ring data into
            analysis and reporting.
        - label: Application layer
          detail: >-
            iOS and Android apps handle intake, reminders, test initiation, patient communications, and treatment
            tracking.
        - label: Device layer
          detail: >-
            Finger-worn ring hardware captures signal inputs via PPG-related optics, electrodes, accelerometer,
            temperature sensors, and BLE connectivity.
