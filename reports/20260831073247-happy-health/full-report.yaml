  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Revenue / bookings anchor
      - Valuation / market cap
      - Implied multiple
      - Relevance
      - Limitation
    rows:
      - - Oura
        - ~$1.0B expected 2025 sales; ~$500M 2024 revenue
        - ~$11B private valuation
        - ~11x on 2025 sales
        - Closest smart-ring success story with preventive-health positioning.
        - Much more mature and more commercially disclosed than Happy.
      - - WHOOP
        - ~$1.1B bookings run rate exiting 2025
        - ~$10.1B private valuation
        - ~9.2x on bookings
        - Strong wearable-plus-platform private comp.
        - Bookings are not the same as recognized revenue; WHOOP is far more scaled.
      - - ResMed
        - ~$5.7B FY2026 revenue
        - ~$34.66B market cap
        - ~6.1x
        - Best public sleep-health platform anchor.
        - Public incumbent scale and profitability far exceed Happy’s.
      - - DexCom
        - ~$4.662B 2025 revenue
        - ~$34.27B market cap
        - ~7.3x
        - Clinical-device plus data-platform comp with regulated proof.
        - CGM economics and reimbursement dynamics differ from sleep diagnostics.
      - - Garmin
        - ~$7.246B 2025 revenue
        - ~$55.0B market cap
        - ~7.6x
        - Profitable scaled wearable-hardware benchmark.
        - Broader product mix and lower clinical specificity.
      - - Teladoc
        - ~$2.53B 2025 revenue
        - ~$1.18B market cap
        - ~0.5x
        - Adverse digital-health re-rating comp.
        - Telehealth business model is broader and post-bubble-distorted.
