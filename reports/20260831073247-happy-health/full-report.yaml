            body: >-
              The most attractive customer-quality signal is that Happy’s workflow is naturally expandable after the
              first diagnostic episode. Public sources say the product can move customers from a test into follow-up
              visits, CPAP or oral-appliance treatment, medication options, and ongoing treatment tracking; the ring may
              also stay with the patient for future efficacy visits. That suggests meaningful repeat-usage potential
              even though no cohort data is disclosed. The problem is that almost every durability metric investors
              would actually want—NRR, GRR, churn, repeat purchase rate, therapy attach rate, payer mix, or partner
              concentration—is missing from public sources. Concentration risk is similarly under-disclosed: the company
              highlights major insurance coverage and partner routes, but it does not reveal whether revenue or volume
              is concentrated in one payer, one referral source, or one distribution partner. The current customer
              verdict is therefore: real production adoption, clear expansion logic, but weak public visibility into
              retention strength and concentration risk. That gap matters especially in healthcare because
              reimbursement, channel, and support complexity often determine whether an apparently sticky workflow is
              truly durable or just operationally expensive. The likely upside is a long-tail patient relationship; the
              risk is that hidden friction or channel dependence prevents enough users from ever reaching that
              higher-value state.
