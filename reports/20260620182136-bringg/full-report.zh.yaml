chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与创立
        blocks:
          - type: paragraph
            body: >-
              Bringg Delivery Technologies Ltd.
              更应被理解为企业软件公司，而不是承运商或市场平台。公司官方页面把平台描述为面向大型品牌的配送编排和履约技术，第三方数据库也一致将其归入最后一公里物流软件。这个区分很重要：其商业模式靠协调自有车队、第三方承运商和客户体验工作流，而不是变现单一配送网络。公开档案显示，公司起源于
              2013 年，总部位于 Tel Aviv，并在 Chicago 和其他国际办公室拥有商业存在。公开数据库中的创始故事略显混乱：Lior Sion 一直被标注为联合创始人兼 CTO，而 Tracxn 和
              Startup Intros 还把 Raanan Cohen 列为联合创始人。用于尽调的稳妥结论是：Bringg 2013 年从 Israel
              物流科技土壤中长出，核心是企业编排而非包裹执行，之后扩展成拥有多办公室的全球软件组织。
