      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              领导层连续性是 Bringg 较具投资价值的特质之一，但治理图景仍达不到公开市场尽调所需透明度。Guy Bloch 自 2018 年起领导公司，公开资料反复把他描绘为带领 Bringg 穿越疫情电商激增期并完成
              2021 年独角兽融资的高管。外部履历强调他在 Splunk、HP Software 和 Mercury Interactive 的运营背景，这支持一个判断：Bringg
              当前领导层更偏商业和企业客户导向，而非纯技术导向。Lior Sion 在公开档案中仍是具名 CTO 和技术联合创始人；Raanan Cohen
              在部分数据提供商中以联合创始人或董事会层面人物出现，说明各来源对创始人归属并未完全统一。现有公开资料无法给出清晰、当前的董事会名单、所有权控制图或 Series E
              后治理权利摘要。因此，领导层质量可以支撑正面判断，但正式治理仍是尽调缺口，而非已关闭的问题。
