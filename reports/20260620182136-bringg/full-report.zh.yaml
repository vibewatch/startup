      - number: '8.5'
        title: 最终尽调要求与论点破裂点
        blocks:
          - type: paragraph
            body: >-
              只有私有证据解决一小组估值关键未知数后，Bringg 才能从跟踪（TRACK）转为可投资。第一项要求是当前 ARR，并提供月度或季度桥接，证明 2024
              年后增长是否真的延续。第二项是收入质量：毛利率、服务组合、NRR、客户标识流失，以及主要账户的扩张深度。第三项是融资姿态：账上现金、烧钱或自由现金流，以及没有新融资究竟代表强势，还是无法通过价格。第四项是客户与实施健康度：价值实现时间、部署成功率和头部客户集中度。这些不是内务项目。它们决定
              Bringg 应位于私有 SaaS 区间上沿附近，还是陈旧独角兽估值应被大幅下调。若增长滑入低个位数、利润率显示服务占比过重、大客户流失，或管理层暗示需要以显著低于上一轮的条款融资，论点即告破裂。
