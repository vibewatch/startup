      - number: '2.4'
        title: 增长驱动因素与逆风
        blocks:
          - type: paragraph
            body: >-
              需求侧驱动因素真实且多层。电商扩张、疫情时期习惯延续、当日达预期，以及企业协调混合车队的压力，都支撑最后一公里继续采用软件。Bringg
              的产品形态贴合这些驱动因素，因为它在一个系统中处理规划、调度、司机执行和配送体验。但同一市场也有强约束。最后一公里仍是物流链条中成本最高的环节之一，买方高度关注
              ROI；如果实施摩擦太高，平台采购可能被推迟。即使订单量增长，劳动力可得性、承运商费率上升和城市拥堵仍会挤压配送经济性。可持续性又是一股双向力量：它提高路线效率和网络编排价值，但也增加复杂度，因为更绿色的配送往往需要重设网络、承运商和运营选择，而不只是加一层软件。净结果是：市场拥有强长期需求，但变现速度不均。Bringg
              受益于这类需求背景，但仍必须逐个账户跨过企业集成、价值证明和预算优先级门槛。
            claimRefs:
