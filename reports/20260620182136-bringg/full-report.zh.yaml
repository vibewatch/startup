  - id: TV005
    title: 投资逻辑破裂与否决触发点表
    columns:
      - 触发点
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 增长放缓
        - 2026 年 ARR 增长跌至低个位数
        - 溢价倍数逻辑坍塌，业务开始呈现无增长特征
        - 转为放弃，或要求价格大幅降低
      - - 收入质量恶化
        - NRR 低于耐久型企业 SaaS 常态，或服务收入占比过高
        - 软件杠杆弱于假设，估值应压缩
        - 降低可接受倍数，并重新评估业务质量
      - - 锚定客户流失
        - 大型具名客户流失，且没有扩张抵消
        - 同时削弱集中度假设和品牌可信度
        - 暂停投资，直到流失原因和替换管线清晰
      - - 融资压力
        - 需要以低于前轮估值快速融资
        - 证实估值过时，并通过结构或稀释放大下行
        - 按折价证据处理，而不是中性流动性管理
      - - 安全或运营失败
        - 重大数据泄露或长时间服务中断
        - 损害信任，并拖慢企业销售 / 续约
        - 在补救证据出现前，按立即打破投资逻辑处理
    notes: 这些触发点定义了「跟踪」何时应转为更明确放弃，或转为重定价机会。
    claimRefs:
      - CV021
      - CV022
      - CV028
      - CV033
      - CV038
      - CV040
  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR 与增长桥
        - 公司未披露 2025 或 2026 年收入桥
        - 决定公司到底是否应享受任何溢价倍数
        - 向 CFO 或董事会材料索取月度 ARR 历史
      - - 净收入留存与流失
        - 未公开披露 NRR、总流失或客户标识流失
        - 决定收入韧性和扩张质量
        - 按细分市场和头部客户索取 cohort 表
      - - 毛利率与服务占比
        - 未公开拆分软件与服务经济性
        - 决定 ARR 应像纯 SaaS 估值，还是按服务偏重软件估值
        - 索取审计 P&L 和实施挂载率数据
      - - 现金、烧钱与融资意图
        - 未公开披露现金流或资金状况
        - 决定没有新融资究竟体现实力，还是融资摩擦
        - 索取现金头寸、烧钱 / FCF 趋势和融资计划
      - - 客户集中度与 ACV 分布
        - 存在具名 logo，但收入结构不公开
        - 决定大客户离开时的下行
        - 索取前十大客户表和细分市场级 ACV 分布
    notes: 要把方向性的公开市场式观点，转成真正的私有承销决策，至少需要上述材料。
