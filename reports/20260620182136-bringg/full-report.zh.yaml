  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 置信度
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 中
        - 保持接触，但没有新的私有指标前，不要锚定 2021 年价格
      - - 业务现实
        - 真正的企业级平台，且有明确规模信号
        - 中
        - 值得继续尽调，而不是仅按叙事公司排除
      - - 估值立场
        - 过时独角兽估值很可能高于基准情形公允价值
        - 中
        - 争取折价、结构保护，或要求强得多的最新指标
      - - 证据质量
        - 方向上有用，但不完整
        - 中
        - 承销前必须拿到当前 ARR、NRR、利润率、流失率和现金数据
      - - 风险评级
        - 定价和披露风险推高风险
        - 中
        - 只有入场价格足以补偿未解决下行时才建仓
    notes: 摘要把各章证据转成投资姿态；它是建议表，不是有审计财务支撑的最终估值备忘录。
