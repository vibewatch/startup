      - number: '1.5'
        title: 负面信号与开放问题
        blocks:
          - type: paragraph
            body: >-
              Bringg 的反面案例不是产品缺乏可信度，而是留存公开证据无法说明当前运营动能是否配得上 2021 年独角兽叙事。最显眼的警示是估值陈旧：Series E 之后留存资料未披露定价轮，但若 GetLatka 对
              2024 年 ARR 的 $40.8 million 估算成立，沿用 $1 billion 估值即意味着约 24.5x ARR。员工数也是谨慎信号。Dealroom 趋势线显示，团队从 2022 年初约 309
              人峰值降至 2026 年约 204 人，即便是效率提升而非困境，也是不小的收缩。Calcalist 和 Next47 还显示，2023 年 10 月 7 日之后，Israel
              运营暴露成为实时管理议题。最后，实施复杂度仍是真实商业风险：企业级广度是优势，但也可能拉长部署时间、提高买方摩擦，并让外界难以凭稀薄公开评价判断产品质量。
