        - 中等
        - 高
        - 严重
        - 关键
      rows:
        - label: 以色列 / 地缘政治集中度
          values:
            - null
            - ''
            - label: 可能
              tone: negative
            - label: 若升级
              tone: adverse
        - label: 实施与流失风险
          values:
            - ''
            - label: 反复出现
              tone: negative
            - label: 核心
              tone: adverse
            - null
        - label: 集成 / 承运商依赖
          values:
            - ''
            - label: 频繁本地事件
              tone: negative
            - label: 若系统性则平台级
              tone: adverse
            - null
        - label: 安全 / 信任事件
          values:
            - null
            - null
            - label: 低频
              tone: negative
            - label: 高后果
              tone: adverse
    approximationNotes: 单元格位置是基于留存来源的分析综合，而不是公司提供的风险登记册。
    claimRefs:
      - CR011
      - CR013
      - CR021
      - CR024
      - CR028
      - CR034
      - CR038
  - id: FR002
    title: 风险传导图
    type: flow
    layout: wide
    summary: 主要传导路径从地缘政治冲击、集成失败和实施拖累，传到客户结果、增长和融资姿态。
    data:
      nodes:
        - id: a1
          label: 以色列冲突冲击
          type: input
        - id: a2
          label: 人员 / 产能压力
          type: input
        - id: a3
          label: 集成或云事件
          type: input
        - id: a4
          label: 实施延迟
          type: process
        - id: a5
          label: 客户 SLA / 续约压力
          type: process
        - id: a6
          label: ARR 放缓且融资杠杆减弱
          type: output
      edges:
        - from: a1
          to: a2
          label: 员工受扰
        - from: a2
          to: a4
          label: 交付产能下降
        - from: a3
          to: a5
          label: 服务不稳定
        - from: a4
          to: a5
          label: 价值实现延迟
        - from: a5
          to: a6
          label: 流失 / 扩张放慢
    approximationNotes: 为保留用户要求的 schema 而渲染成流图，尽管分析内容更接近依赖 DAG。
    claimRefs:
      - CR011
      - CR018
      - CR023
      - CR024
      - CR028
      - CR032
      - CR034
      - CR040
  - id: FR003
    title: 依赖图
    type: flow
    layout: standard
    summary: Bringg 位于云基础设施、企业系统、承运商 API 和客户运营团队之间，故障可能很快跨边界传播。
    data:
      nodes:
        - id: d1
          label: Google Cloud
          type: external
        - id: d2
          label: Bringg 平台
          type: process
        - id: d3
          label: 承运商 API
          type: external
        - id: d4
          label: 企业系统
          type: external
        - id: d5
          label: 客户运营团队
          type: output
        - id: d6
          label: 终端客户交付体验
          type: output
      edges:
        - from: d1
          to: d2
          label: 托管 / 服务
        - from: d3
          to: d2
          label: 执行数据
        - from: d4
          to: d2
          label: 订单 / 工作流语境
        - from: d2
          to: d5
          label: 编排
        - from: d5
          to: d6
          label: 交付结果
    approximationNotes: 该图把许多交易对手简化为几类关键依赖，让主要故障面保持可见。
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR028
      - CR038
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: TRACK 建议来自几项因素的组合：真实运营证明、旧定价、私有指标缺口，以及压缩后的软件倍数。
    data:
      nodes:
        - id: r1
          label: 真实企业足迹
          type: input
        - id: r2
          label: 旧 $1B 标记
          type: input
        - id: r3
          label: 私有指标缺口
          type: input
        - id: r4
          label: 基于情景的估值纪律
          type: process
        - id: r5
          label: TRACK
          type: output
      edges:
        - from: r1
          to: r4
          label: 让公司仍可投资
        - from: r2
          to: r4
          label: 迫使价格谨慎
        - from: r3
          to: r4
          label: 限制确信度
        - from: r4
          to: r5
          label: 等更好证据或价格
    approximationNotes: 该图把多因素 IC 讨论压缩为当前建议中最主导的几个决策节点。
    claimRefs:
      - CV020
      - CV022
      - CV027
      - CV030
      - CV031
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值对投资人愿意为中等 ARR 支付的倍数最敏感，而不是只受 ARR 微小变化影响。
    data:
      items:
        - label: $47M 熊市 ARR 的 8x
          value: 376
          unit: USDm
        - label: $47M 熊市 ARR 的 10x
          value: 470
          unit: USDm
        - label: $54M 基准 ARR 的 15x
          value: 810
          unit: USDm
        - label: $64M 牛市 ARR 的 18x
          value: 1152
          unit: USDm
        - label: $40.8M 2024 ARR 的 24.5x
          value: 1000
          unit: USDm
    approximationNotes: 数值是使用估算 ARR 输入得出的四舍五入情景结果，不是管理层指引。
    claimRefs:
      - CV006
      - CV017
      - CV018
      - CV019
      - CV032
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前公开证据区间从大幅减记延伸到温和上行，基准情景仍低于 2021 年独角兽标记。
    data:
      items:
        - label: 熊市情景估值
          low: 376
          mid: 376
          high: 376
          unit: USDm
        - label: 基准情景估值
          low: 810
          mid: 810
          high: 810
          unit: USDm
        - label: 牛市情景估值
          low: 1152
          mid: 1152
          high: 1152
          unit: USDm
        - label: 旧最后一轮标记
          low: 1000
          mid: 1000
          high: 1000
          unit: USDm
    approximationNotes: 每个区间都压缩为一个点估算，因为来源包更直接支持情景点，而不是每个情景内真正的低 / 高分布。
    claimRefs:
      - CV001
      - CV017
      - CV018
      - CV019
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Bringg 的业务真实性得分较高，但估值支撑和证据完整性较弱。
    data:
      items:
        - label: 估算 2024 年 ARR
          value: 40.8
          unit: USDm
          trend: up
          claimRefs:
            - CV004
        - label: 估算 2020-2024 年 CAGR
          value: 20
          unit: '%'
          trend: up
          claimRefs:
            - CV008
        - label: 旧口径隐含 ARR 倍数
          value: 24.5
          unit: x
          trend: down
          claimRefs:
            - CV006
        - label: 较 2022 年峰值的员工数变化
          value: -34
          unit: '%'
          trend: down
          claimRefs:
            - CV010
        - label: 建议评分
          value: 5
          unit: /10
          trend: flat
          claimRefs:
            - CV030
            - CV040
        - label: 证据完整性评分
          value: 4
          unit: /10
          trend: flat
          claimRefs:
            - CV022
            - CV031
    approximationNotes: 最后两个评分只是用来概括估值信心的分析判断，并非公司披露指标。
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV010
      - CV022
      - CV030
      - CV031
      - CV040
