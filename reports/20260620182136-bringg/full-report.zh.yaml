companyProfile:
  summary: >-
    Bringg Delivery Technologies Ltd. 总部位于 Tel Aviv，成立于 2013
    年，是一家企业软件公司，运营最后一公里配送编排与履约云平台。平台覆盖路线规划、调度、司机执行和客户体验模块，并用无代码自动化层、分析能力，以及架设在 Google Cloud 基础设施上的 200
    多个承运商集成把它们串起来。已具名客户包括 Best Buy 和 METRO；第三方数据库还列出 Coca-Cola、Walmart 和 Boulanger。Bringg 于 2021 年 6 月跻身独角兽：Insight
    Partners 领投 $100 million Series E，估值 $1 billion，Salesforce Ventures、Next47 和 Cambridge Capital
    等参投。截至运行日，公司未披露后续定价轮；GetLatka 估算 2024 年 ARR 约 $40.8 million——若沿用旧估值，相当于 24.5x ARR，远高于 2026 年中速增长企业 SaaS 可支撑的水平。员工数从
    2022 年初约 309 人的峰值缩至 2026 年 5 月约 204 人，降幅约 34%；约 46% 员工位于 Israel。
  foundedDate: '2013-01-01'
  founders:
    - name: Lior Sion
      role: 联合创始人兼 CTO
      claimRefs:
        - CO008
    - name: Raanan Cohen
      role: 联合创始人
      claimRefs:
        - CO009
  foundingLocation: Tel Aviv, Israel
  headquarters: Tel Aviv, Israel
  productSummary: >-
    Bringg 销售多模式最后一公里配送编排平台，四个核心模块分别是 Plan（路线优化、承运商选择）、Dispatch（配送监控、异常管理、自动调度）、Drive（iOS/Android 司机应用、交付证明）和 Delivery
    Experience（白标追踪、ETA、客户通知）。平台级能力包括无代码 Automation Center、Intelligence 分析层，以及 Security & Connectivity 层。平台符合 SOC 2，构建在
    Google Cloud 上，并开放 REST API 和 webhook，可与 OMS、ERP、VMS 系统集成。200 多个承运商集成目录，是其服务同时运营自有车队与第三方承运商的企业托运人时的关键差异点。
  customerFocus: >-
    大型企业零售商、杂货商和消费品公司，在多种车队类型中高频管理全渠道最后一公里配送。已具名垂直行业包括零售（Best Buy）、食品与杂货（METRO）以及消费品（Coca-Cola、Walmart）；平台面向需要跨 70
    多个国家做多承运商编排的买方，而不是只需要单一承运商或小企业调度工具的客户。
  businessModel: >-
    以订阅驱动的企业 SaaS，平台和模块授权是主要收入线，并辅以实施、上线和集成专业服务。按 $40.8 million ARR 估算和 800 个客户下限计算，平均每客户 ARR 约
    $51,000，显示交易规模处于中端市场到低端企业级区间，并有跨模块扩张空间。
  stage: Series E private company
  fundingStatus: >-
