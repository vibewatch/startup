      - number: '2.2'
        title: 市场规模与增长估算
        blocks:
          - type: paragraph
            body: >-
              留存分析师资料能支持方向判断，但不能支撑虚假的精确度。Research and Markets、Research Nester、Datastring Consulting、Global Growth
              Insights 和 6W Research 都发布页面，把全球最后一公里配送市场描绘为规模很大且保持双位数增长，但多数留存入口只是销售引流页，而非透明模型。因此，合理输出不是一个胜利式的单点 TAM
              数字，而是有边界的规模区间。综合来看，2030 年全球最后一公里市场大致可落在：保守情景约 $80 billion、基准情景 $120 billion、高增长情景 $170
              billion。这些数字应被视为推断出的方向性括号，而不是任何单一发布方的直接引用。对 Bringg 更相关的问题是 SAM。由于 Bringg 销售编排、API
              和企业工作流控制，其软件相关细分远小于整体配送服务池，更适合放在 $5 billion 到 $10 billion 区间。即便如此，Bringg 当前估算 ARR 为 $40.8
              million，说明今天已经实现的 SOM 仍只是软件机会的一小部分。
