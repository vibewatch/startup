      - number: '8.2'
        title: 可比背景与倍数压缩
        blocks:
          - type: paragraph
            body: >-
              Bringg 很难找到干净可比公司，因为公开市场没有明显的纯最后一公里编排软件公司，同时具备零售商工作流、承运商连接和企业部署复杂度。因此，分析只能转向两组不完美样本：相邻的物流或供应链软件公司，以及更广泛的企业
              SaaS 倍数区间。两组样本指向一致。即便因为企业客户标识和运营深度，给 Bringg 相对平均软件公司一定溢价，在 2026
              年市场里，除非增长、利润率或战略稀缺性异常突出，否则大多数成长期软件公司都按低得多的区间交易，陈旧的 24.5x ARR 倍数很难辩护。project44 或 Locus
              等私有同行说明投资人仍关注物流软件，但不能证明每一个 2021 年独角兽估值都能在当前市场过关。实际含义是，Bringg 应靠区间纪律估值，而不是靠 2021 年融资周期的品牌光环。
