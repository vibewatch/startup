  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              本章最关键的分析动作，是把 Bringg 可触达的软件市场同分析师标题中常见、更庞大的物流服务宇宙切开。Bringg
              销售的是覆盖规划、调度、司机执行、配送体验、自动化、分析和连接能力的编排软件。这意味着公司参与的是最后一公里配送的控制层，而不是全部包裹收入、骑手工资、车队资本开支，或电商物流支出的每一美元。Research
              and Markets 与 Research Nester 都用服务模式、技术和垂直应用分层来框定更广义最后一公里市场，这有助于理解需求背景，但过宽，不能直接桥接到 Bringg
              收入。真正重要的承保边界，是大型零售商、杂货商、餐饮服务连锁和物流运营商内部的企业配送编排预算；它排除承运商自有干线经济、通用仓储管理支出，以及永远不会流入软件订阅或用量收入的自营配送劳动力。这个更窄边界也解释了为什么
              Bringg 可在 $100B+ 配送生态中具备相关性，却只变现其中数十亿美元级的软件子集。
            claimRefs:
