  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 状态
      - 相关性
      - 局限
    rows:
      - - Manhattan Associates
        - 公开供应链软件基准
        - 有公开申报支撑的成熟软件估值参照
        - 有助于约束企业工作流软件估值
        - 不是纯粹的私有末公里编排可比公司
      - - Samsara
        - 公开运营软件基准
        - 有公开申报支撑的较高增长软件参照
        - 有助于观察溢价与标准 SaaS 倍数边界
        - 产品组合不同，且模式偏重 IoT
      - - project44
        - 私有物流软件同行
        - 大型私有物流平台，融资历史重大
        - 可作为相邻私有品类基准
        - 私有估值不透明且规模不同，限制精度
      - - Locus
        - 私有末公里软件同行
        - 较小的私有末公里软件参照
        - 有助于判断品类方向和功能重叠
        - 规模披露和融资透明度较低
      - - 私有 SaaS 市场区间
        - 更广的 2026 年软件市场背景
        - 典型私有 SaaS 区间约为中高个位数至十几倍中段
        - 有助于把 Bringg 放回一般市场现实中锚定
        - 非公司专属，可能低估品类溢价
    notes: 可比组刻意混合设置，因为没有一家公开纯业务公司与 Bringg 足够接近，无法单独驱动估值。
