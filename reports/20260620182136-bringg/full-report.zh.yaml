              可用财务数据点是估算值，但仍有助于框定规模。GetLatka 估计 Bringg 2020 年 ARR 约 $16.4 million，2024 年约 $40.8 million，意味着四年总 ARR 增长约
              149%，年化增速接近 20%。对成熟企业软件供应商而言，这是可信增长；但放在 2026 年市场里，仅凭这一点显然不足以捍卫陈旧独角兽估值。同一来源列出 21
              名承担配额的销售代表。如果这个数字方向正确，每名销售代表 ARR 约 $1.94 million，纸面上不错；但由于 CAC、回本周期、配额完成率和流失率都未披露，无法据此推断销售效率。把 $40.8
              million ARR 简单平均到 800 多个客户，得到每客户 ARR 约
              $51,000，同样符合较小和较大企业账户混合的结构，而不是极少数超大合同。这些代理指标显示真实商业牵引力，但没有揭示利润率质量、留存或实施工作量是否足以高效复利。
