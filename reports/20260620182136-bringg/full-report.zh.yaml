      - number: '7.3'
        title: 人员、执行与融资风险
        blocks:
          - type: paragraph
            body: >-
              Bringg 的人员和融资画像，是公开证据仍有方向性价值、但信息缺口也最明显的地方。员工数似乎从 2022 年初约 309 人降至 2026 年 5 月约 204
              人，收缩约三分之一。这不能证明公司陷入困境，但规模足以影响工程产能、实施配备和客户成功覆盖。风险还被以色列这一主要人才基地放大；更广泛的以色列科技评论仍在讨论韧性、预备役服役干扰和人才迁移的可能性。融资风险同样模糊。公司历史融资基础扎实，2021
              年独角兽轮也知名，但保留语料没有披露烧钱速度、跑道、债务、客户集中度，也没有说明更小的团队是主动提效，还是被动控费。因此，投资人应把公司视为运营真实但对执行敏感：失去一个主要锚定客户、部署明显放缓，或无法证明盈利
              / 接近盈亏平衡运营，都会迅速改写风险回报。
