  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值框架与数据质量
        blocks:
          - type: paragraph
            body: >-
              估值问题首先不是算术，而是数据质量。Bringg 不是还没有产品的概念公司；保留记录支持它是一套真实企业平台，客户触达广、配送吞吐有意义，也有真实收入基础。但最常被保留的收入数字仍是 GetLatka 估算的
              2024 年 ARR 约 $40.8 million，而不是公司披露的审计指标。最后一笔清晰保留的融资事件，是 2021 年 6 月以 $1 billion 估值完成 $100 million Series
              E。这个间隔很关键，因为五年足以让价格、市场和公司内部经济性显著分化。2022
              年以来员工数收缩又增加了一个信号，但不能定论。更小的团队可能意味着效率和盈利能力，也可能意味着增长野心降温。由于毛利率、NRR、流失和现金流数据仍是私有信息，本章采用基于 ARR
              和市场倍数逻辑的情景估值，而不假装公开记录足以支撑精确的现值模型。
            claimRefs:
              - CV001
