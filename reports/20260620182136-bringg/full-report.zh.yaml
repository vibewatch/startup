      - number: '8.3'
        title: 情景分析
        blocks:
          - type: paragraph
            body: >-
              思考 Bringg 最有用的方法，是把经营进展和估值压缩拆开。公司自 2021 年以来很可能已经改善：估算 ARR 从 2020 年约 $16.4 million 升至 2024 年约 $40.8
              million，且多年没有新披露融资也存活下来。但这不会自动拯救 2021 年价格，因为投资人为中等规模软件愿意支付的倍数如今更低。牛市情景下，Bringg 到 2026 年复合增长至约 $64 million
              ARR，并获得 18x 倍数，仍可产生接近 $1.15 billion 的估值。基准情景下，ARR 达到约 $54 million，倍数更接近 15x，隐含约 $810 million。熊市情景下，ARR
              增长放缓，市场只给 8x，价值压缩至高 $300 million 区间。这个区间说明，投资问题的主导因素不是 Bringg 是否真实，而是公司能否继续拿到溢价倍数。
