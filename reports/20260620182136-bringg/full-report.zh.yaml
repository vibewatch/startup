  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 地缘政治与监管暴露
        blocks:
          - type: paragraph
            body: >-
              Bringg 后果最重的风险不是产品马上脆断，而是地缘集中。公司总部在 Tel Aviv，公开公司资料显示以色列员工占比不小，管理层也已谈到，10 月 7
              日袭击及随后战争如何把业务推入连续性运转模式。这段经历有两面性。一方面，组织已经演练过危机运营，也能把工作分散到 Chicago、London、Warsaw 和
              Kyiv；另一方面，它也证实，领导层、工程和运营人才仍有相当一部分位于安全环境持续动荡的地区。监管风险又把问题放大：Bringg 业务覆盖 70 多个国家，处理配送、司机和客户工作流数据，因此要面对 GDPR
              式隐私义务、跨境合同，以及地区冲突扩大后可能出现的制裁或贸易限制。保留语料中没有发现公开诉讼或执法档案，但没有公开不利程序，并不等于法律或监管风险可以忽略。
