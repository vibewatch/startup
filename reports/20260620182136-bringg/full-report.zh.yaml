      - number: '2.5'
        title: 反证与局限
        blocks:
          - type: paragraph
            body: >-
              如果投资人把品类增长误认为软件自动捕获，Bringg
              的乐观案例会被高估。留存研究包给出几个保持纪律的理由。第一，市场定义确实模糊：多数公开市场研究页面是销售引流页，留存材料无法审计其顶部规模值。第二，竞争和替代仍有意义。即便全套编排平台理论上更优，部分买方仍会继续使用内部工具、承运商门户或更窄的路线产品。第三，地缘政治和可持续性既会创造需求，也会制造摩擦。BCG
              的地缘政治分析并非 Bringg 专属，但它强化了一个事实：全球暴露的技术供应商面对更复杂的运营环境；对 Bringg 而言，Israel 总部又增加了特定敏感性。最后，估值纪律很重要。若公司事实上仍以 2021
              年独角兽估值作为参照，而 2024 年估算 ARR 只有 $40.8 million，那么单靠市场增长无法支撑松懈承保。本章因此支持一个大且耐久的机会，但不支持简单由 TAM 推动的承保案例。
