  - id: TV002
    title: 投资逻辑 / 反逻辑表
    columns:
      - 论点
      - 支撑证据
      - 反逻辑
      - 改变观点的条件
      - 净判断
    rows:
      - - 企业可信度
        - 800+ 客户、70+ 国家和 2 亿次配送说明商业足迹真实存在
        - 以独角兽估值衡量，规模看起来仍偏小
        - 展示当前 ARR、NRR 和大客户韧性
        - 业务信号正面，但不足以支撑定价
      - - 集成深度
        - 200+ 集成可以增强企业粘性
        - 重集成模式也会抬高服务和实施风险
        - 按集成类别提供挂载率、使用量和事故数据
        - 混合：护城河和脆弱性同时上升
      - - 融资耐久性
        - 距上一轮已五年，可能说明公司能自给自足
        - 也可能说明公司难以按旧价格融资
        - 披露现金、烧钱、跑道和融资意图
        - 在审阅私有融资证据前仍未解决
      - - 增长叙事
        - 2020 至 2024 年 ARR 看起来有明显增长
        - 增长扎实，但到 2026 年未必配得上溢价倍数
        - 展示 2025-2026 年增长和净留存加速
        - 估值观点偏中性至负面
      - - 战略品类
        - 末公里数字化仍具战略重要性
        - 品类重要不等于每家供应商都应享受溢价估值
        - 用更优经济性证明品类领导力
        - 是有利顺风，但本身不足以证明价格合理
    notes: 每行都把当前最强的多头论点，与它仍可能无法支撑上一轮私有估值的核心原因放在一起。
