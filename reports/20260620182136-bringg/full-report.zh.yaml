        - 出现紧急融资、契约压力或管线急剧恶化的证据
        - 从观察名单转为不投，除非条款大幅重定价
    notes: 否决标准把宽泛的定性风险转成可观察的尽调或监控触发点，一旦触发，投资姿态可以迅速改变。
