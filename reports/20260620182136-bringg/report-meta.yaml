companyProfile:
  summary: >-
    Bringg Delivery Technologies Ltd. is a Tel Aviv-based enterprise software company founded in
    2013 and operating a last-mile delivery orchestration and fulfillment cloud platform. The
    platform spans route planning, dispatch, driver execution, and customer-experience modules,
    connected by a no-code automation layer, analytics, and more than 200 carrier integrations
    on Google Cloud infrastructure. Named customers include Best Buy and METRO; third-party
    databases add Coca-Cola, Walmart, and Boulanger. Bringg reached unicorn status in June 2021
    with a $100 million Series E at a $1 billion valuation led by Insight Partners and including
    Salesforce Ventures, Next47, and Cambridge Capital. No subsequent priced financing round is
    disclosed as of the run date, and GetLatka estimates 2024 ARR at roughly $40.8 million —
    implying a 24.5x ARR multiple at the stale mark, well above what moderate-growth enterprise
    SaaS commands in 2026. Headcount contracted roughly 34 percent from about 309 employees at
    peak in early 2022 to about 204 by May 2026, with approximately 46 percent of staff based
    in Israel.
  foundedDate: "2013-01-01"
  founders:
    - name: "Lior Sion"
      role: "Co-founder & CTO"
      claimRefs: ["CO008"]
    - name: "Raanan Cohen"
      role: "Co-founder"
      claimRefs: ["CO009"]
  foundingLocation: "Tel Aviv, Israel"
  headquarters: "Tel Aviv, Israel"
  productSummary: >-
    Bringg sells a multi-modal last-mile delivery orchestration platform with four core modules —
    Plan (route optimization, carrier selection), Dispatch (delivery monitoring, exception
    management, automated dispatch), Drive (iOS/Android driver apps, proof of delivery), and
    Delivery Experience (white-label tracking, ETAs, customer notifications). Platform-wide layers
    include a no-code Automation Center, an Intelligence analytics layer, and a Security &
    Connectivity tier. The platform is SOC 2 compliant, built on Google Cloud, and exposes REST
    APIs and webhooks for integration with OMS, ERP, and VMS systems. The 200-plus carrier
    integration catalog is a key differentiation for enterprise shippers running hybrid
    owned-fleet and third-party-carrier workflows.
  customerFocus: >-
    Large enterprise retailers, grocers, and consumer-goods companies that manage omnichannel
    last-mile delivery at high volume across mixed fleet types. Named verticals include retail
    (Best Buy), food and grocery (METRO), and consumer goods (Coca-Cola, Walmart); the platform
    is positioned for buyers who need multi-carrier orchestration across 70-plus countries rather
    than single-carrier or small-business dispatch tooling.
  businessModel: >-
    Subscription-led enterprise SaaS with platform and module licensing as the primary revenue
    line, supplemented by professional services for implementation, onboarding, and integration.
    Average estimated ARR per customer is roughly $51,000 at the $40.8 million ARR estimate
    and 800-customer floor, suggesting mid-market to lower-enterprise deal sizes with potential
    for expansion across modules.
  stage: "Series E private company"
  fundingStatus: >-
    Last publicly disclosed financing was a $100 million Series E in June 2021 at a $1 billion
    valuation, led by Insight Partners with participation from Cambridge Capital, GLP, Harlap,
    Next47, Pereg Ventures, Salesforce Ventures, and Viola Growth. Total capital raised is
    roughly $184.5 million across seven rounds; no post-2021 priced round is disclosed. Whether
    the company is profitable, exploring a new raise, or under balance-sheet pressure cannot be
    determined from public evidence.
