evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, ownership-control summary, and investor-rights map after Series E.
    whyItMatters: >-
      Leadership quality is visible, but actual control and governance rights determine downside protection and decision
      authority.
    diligencePath: >-
      Request the latest board deck, cap table, investor-rights summary, and any governance side letters from management
      or lead investors.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management-certified revenue, gross margin, burn, retention, and customer concentration metrics.
    whyItMatters: >-
      Operational scale claims are not enough to underwrite valuation, efficiency, or durability without verified
      economics.
    diligencePath: Request board-approved KPI packs, audited financials, customer cohort data, and pipeline conversion reporting.
    relatedQuestionRefs:
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: investor-map
    missingEvidence: A complete post-Series E cap table with ownership percentages and any secondary transactions.
    whyItMatters: The public stakeholder map is directional but cannot reveal dilution, control, or liquidation stack complexity.
    diligencePath: Request a current capitalization table and round-by-round ownership history from finance or counsel.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Public or private pricing, ACV, or contract-value benchmarks for enterprise delivery-orchestration software
      deployments.
    whyItMatters: Without pricing visibility, SAM and SOM sizing remain top-down and cannot be grounded in account-level economics.
    diligencePath: >-
      Request current pricing architecture, typical ACV ranges, implementation fees, and average contract lengths from
      management.
    relatedQuestionRefs:
      - QM024
  - type: access-blocked
    severity: material
    topic: market-methodology
    missingEvidence: Full analyst reports or transparent methodologies behind headline market-size forecasts.
    whyItMatters: >-
      Headline TAM numbers can materially overstate or understate the software-relevant opportunity if their category
      definitions are opaque.
    diligencePath: >-
      Purchase or obtain analyst reports, then reconcile each publisher's scope, geography, and included spend
      categories before using one as a valuation anchor.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: replacement-dynamics
    missingEvidence: Win/loss data showing how often Bringg replaces internal build, carrier tools, or point-routing competitors.
    whyItMatters: Substitution risk determines real conversion from macro demand into vendor-specific market share.
    diligencePath: Request pipeline, displacement, and churn analysis segmented by buyer type and incumbent workflow.
    relatedQuestionRefs:
      - QM019
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Bringg does not publish realized pricing bands, ACV ranges, or implementation-fee norms in retained public
      sources.
    whyItMatters: >-
      Without realized pricing evidence, it is hard to judge whether Bringg truly commands a sustainable enterprise
      premium versus peers.
    diligencePath: Request current price book, ACV distribution, and three recent competitive deal summaries.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-gap
    missingEvidence: No retained public source discloses competitor win-loss rates by segment or region.
    whyItMatters: >-
      Competitive posture is strongest when backed by actual share movement, not only product marketing and comparison
      blogs.
    diligencePath: Ask management for last twelve months win-loss data against FarEye, DispatchTrack, Onfleet, and LogiNext.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: access-blocked
    severity: minor
    topic: review-depth
    missingEvidence: G2 and SaaS Adviser surfaces were rate-limited in the retained audit trail.
    whyItMatters: Blocked review detail limits confidence in how widespread implementation complaints really are.
    diligencePath: Revisit with authenticated access or substitute additional review aggregators and customer references.
    relatedQuestionRefs:
      - QP017
  - type: stale
    severity: material
    topic: valuation-staleness
    missingEvidence: The last clearly retained valuation reference is from June 2021.
    whyItMatters: A stale private-market mark can overstate strategic strength if growth and market multiples have reset since then.
    diligencePath: Confirm latest board mark, secondary activity, and any undisclosed extension or inside round since Series E.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: profitability
    missingEvidence: No retained public source provides audited profit-and-loss statements, EBITDA, or cash-flow disclosure.
    whyItMatters: Profitability and runway cannot be inferred confidently from ARR and headcount alone.
    diligencePath: Request audited financials, management accounts, and a twelve-month cash-flow bridge.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: No public source discloses NRR, gross retention, logo churn, or cohort expansion.
    whyItMatters: A mature enterprise SaaS business can look healthy on ARR while masking weak retention economics.
    diligencePath: Request cohort retention tables and customer renewal metrics by segment.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: No retained source discloses top-customer concentration, revenue by logo, or revenue by vertical.
    whyItMatters: Average ARR metrics may hide dependence on a small number of large enterprise accounts.
    diligencePath: Request top-10 customer exposure, ACV distribution, and segment mix.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI005
  - type: access-blocked
    severity: minor
    topic: pricing-detail
    missingEvidence: Software Advice and Crunchbase were rate-limited, limiting cross-checks on pricing and funding metadata.
    whyItMatters: Blocked surfaces reduce corroboration depth around commercial packaging and historical financing.
    diligencePath: Re-check with authenticated access or substitute other reputable software and financing databases.
    relatedQuestionRefs:
      - QI010
      - QI016
  - type: stale
    severity: material
    topic: valuation-multiple
    missingEvidence: The last clearly retained valuation datapoint is from the 2021 Series E.
    whyItMatters: A stale valuation mark can overstate present-day worth if sector multiples and company growth have changed.
    diligencePath: Request current board mark, any secondary transactions, and any undisclosed extension financing since 2021.
    relatedQuestionRefs:
      - QI019
      - QI020
    relatedTableRefs:
      - TI004
  - type: access-blocked
    severity: material
    topic: microsoft-distribution
    missingEvidence: >-
      A live Microsoft AppSource listing or Microsoft-authored partner page that confirms Bringg’s current listing
