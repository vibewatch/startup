- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Dimension
  - Observed signal
  - Implication
  - Why it matters
  - Diligence path
  rows:
  - - Module expansion potential
    - Bringg spans planning, dispatch, driver, CX, and delivery-promise workflows
    - Supports land-and-expand logic within large accounts
    - Cross-sell can improve ACV and durability
    - Request module attach rates by cohort
  - - Named-logo concentration
    - Marquee brands are visible but revenue share is undisclosed
    - A few flagship accounts could dominate economics
    - Logo breadth does not equal revenue diversification
    - Request top-10 customer concentration by ARR and GMV
  - - Retention disclosure
    - No public NRR, GRR, churn, or contract-length data
    - Durability cannot be underwritten from public sources alone
    - Customer satisfaction scores do not replace renewals data
    - Request renewal cohorts and contract terms
  - - Proof-quality skew
    - Several customer names come from directories or third-party databases
    - Deployment maturity may be overstated by logo lists
    - Pilot versus scaled production is often unclear
    - Request customer reference calls and production start dates
  - - Public sentiment triangulation
    - Capterra and Trustpilot access is blocked or unusable, while Best Buy and Coles corroboration is incomplete
    - Broader sentiment and reference depth remain uncertain
    - Thin external validation can mask concentration or rollout problems
    - Re-run review-platform checks and gather customer-authored references directly
  notes: The risk table is designed to convert logo-level traction into concrete diligence asks around retention, expansion, and concentration.
