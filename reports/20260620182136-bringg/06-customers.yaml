chapter:
  number: 6
  title: Customers
  summary: Bringg has credible enterprise customer breadth on paper, with official claims of 800-plus customers and named proof that includes Best Buy and METRO, plus third-party databases that add Coca-Cola, Walmart, and Boulanger. The customer picture is investable but incomplete because public retention, concentration, and ROI evidence is much thinner than the logo list, while review coverage remains surprisingly sparse for a company of this claimed scale.
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: 'Bringg’s public customer base appears broad in reach but uneven in disclosure quality. Official materials claim more than 800 customers operating in more than 70 countries, which places the company far beyond pilot-stage vendor status if taken at face value. The product and partner evidence also suggests multi-vertical relevance: big-box retail, grocery, food retail, and other complex omnichannel operators all fit the workflow Bringg describes. Third-party sources reinforce that impression by pointing to large enterprise names and by presenting Bringg as infrastructure for delivery orchestration rather than a single-industry application. At the same time, the public set does not disclose customer counts by segment, annual spend band, or geography. That means the topline breadth signal is positive, but the revenue mix behind it is still opaque. For diligence, the right framing is that Bringg likely has a diversified deployment footprint by logo and use case, but not yet a publicly
    auditable segmentation model by customer economics.'
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU005
  - CU010
  - CU026
  - CU027
  - CU029
  - CU032
  - CU039
