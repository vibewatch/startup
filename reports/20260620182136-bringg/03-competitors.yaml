  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: Bringg does not publish realized pricing bands, ACV ranges, or implementation-fee norms in retained public sources.
    whyItMatters: Without realized pricing evidence, it is hard to judge whether Bringg truly commands a sustainable enterprise premium versus peers.
    diligencePath: Request current price book, ACV distribution, and three recent competitive deal summaries.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-gap
    missingEvidence: No retained public source discloses competitor win-loss rates by segment or region.
    whyItMatters: Competitive posture is strongest when backed by actual share movement, not only product marketing and comparison blogs.
    diligencePath: Ask management for last twelve months win-loss data against FarEye, DispatchTrack, Onfleet, and LogiNext.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: access-blocked
    severity: minor
    topic: review-depth
    missingEvidence: G2 and SaaS Adviser surfaces were rate-limited in the retained audit trail.
    whyItMatters: Blocked review detail limits confidence in how widespread implementation complaints really are.
    diligencePath: Revisit with authenticated access or substitute additional review aggregators and customer references.
    relatedQuestionRefs:
    - QP017
  - type: stale
    severity: material
    topic: valuation-staleness
    missingEvidence: The last clearly retained valuation reference is from June 2021.
    whyItMatters: A stale private-market mark can overstate strategic strength if growth and market multiples have reset since then.
    diligencePath: Confirm latest board mark, secondary activity, and any undisclosed extension or inside round since Series E.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP004
acknowledgedWarnings:
- dimension: tableNotes
  reason: Several competitor and pricing tables rely on directional comparison coverage because peer vendors do not publish normalized list pricing or feature taxonomies.
- dimension: unverifiedSource
  reason: Several reused database and investor URLs are retained from earlier research context but were not re-fetched into this session trail before chapter drafting.
