- id: scenario-analysis
  title: Scenario analysis
  body: 'The most useful way to think about Bringg is to separate operating progress from valuation compression. The business may very well have improved since 2021: estimated ARR has risen from about $16.4 million in 2020 to about $40.8 million in 2024, and the company has survived for years without a newly disclosed round. But that does not automatically rescue the 2021 price, because the multiple investors are willing to pay for mid-scale software is lower today. In the bull case, Bringg compounds into roughly $64 million of ARR by 2026 and earns an 18x multiple, which can still produce a valuation near $1.15 billion. In the base case, ARR reaches around $54 million and clears closer to 15x, implying about $810 million. In the bear case, ARR growth slows, the market pays only 8x, and value compresses into the high-$300 million range. That spread shows that the investment question is dominated less by whether Bringg is real and more by whether the company can still earn a premium multiple.'
  claimRefs:
