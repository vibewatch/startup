- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Growth slowdown
    - 2026 ARR growth falls into low single digits
    - Premium-multiple case collapses and the business begins to look ex-growth
    - Move to pass or demand a materially lower price
  - - Revenue quality deterioration
    - NRR below durable enterprise SaaS norms or services mix too high
    - Valuation should compress because software leverage is weaker than assumed
    - Lower acceptable multiple and reassess business quality
  - - Anchor customer loss
    - Large named customer churn without offsetting expansion
    - Weakens both concentration assumptions and brand credibility
    - Pause investment until churn cause and replacement pipeline are clear
  - - Financing stress
    - Need to raise capital quickly below prior mark
    - Confirms stale valuation and increases downside through structure or dilution
    - Treat as markdown evidence rather than as neutral liquidity management
  - - Security or operational failure
    - Material breach or prolonged service disruption
    - Damages trust and slows enterprise sales / renewals
    - Treat as immediate thesis break pending remediation proof
  notes: These triggers define when TRACK should convert either into a sharper pass or into a repriced opportunity.
  claimRefs:
