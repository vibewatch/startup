- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Supporting evidence
  - Anti-thesis
  - What would change the view
  - Net judgment
  rows:
  - - Enterprise credibility
    - 800+ customers, 70+ countries, and 200M deliveries imply real commercial footprint
    - Scale still appears modest for a unicorn mark
    - Show current ARR, NRR, and large-account durability
    - Positive business signal, not sufficient pricing support
  - - Integration depth
    - 200+ integrations can support enterprise stickiness
    - Integration-heavy model also increases services and implementation risk
    - Provide attach, usage, and incident data by integration class
    - 'Mixed: moat and fragility rise together'
  - - Funding durability
    - Five years since the last round may indicate self-sufficiency
    - It may also indicate difficulty raising at the old price
    - Disclose cash, burn, runway, and fundraising intent
    - Unresolved until private financing evidence is reviewed
  - - Growth narrative
    - ARR appears to have grown materially from 2020 to 2024
    - Growth looks solid but not obviously premium-multiple worthy in 2026
    - Show 2025-2026 growth and net retention acceleration
    - Leaning neutral-to-negative on valuation
  - - Strategic category
    - Last-mile digitization remains strategically important
    - Category importance does not guarantee premium valuation for every vendor
    - Demonstrate category leadership with superior economics
    - Helpful tailwind, not a price justification by itself
  notes: Each row pairs the strongest current bull point with the main reason it may still fail to support the last private mark.
