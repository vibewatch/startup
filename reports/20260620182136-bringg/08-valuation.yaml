  - CV022
  - CV028
  - CV033
  - CV038
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current ARR and growth bridge
    - No company-disclosed 2025 or 2026 revenue bridge
    - Determines whether the company deserves any premium multiple at all
    - Request CFO or board deck monthly ARR history
  - - Net revenue retention and churn
    - No public NRR, gross churn, or logo churn disclosure
    - Determines revenue durability and expansion quality
    - Request cohort tables by segment and top accounts
  - - Gross margin and services mix
    - No public breakdown of software vs services economics
    - Determines whether ARR should be valued like clean SaaS or services-heavy software
    - Request audited P&L and implementation attach-rate data
  - - Cash, burn, and fundraising intent
    - No public cash-flow or treasury disclosure
    - Determines whether no new round reflects strength or financing friction
    - Request cash position, burn / FCF trend, and fundraising plans
  - - Customer concentration and ACV distribution
    - Named logos exist but revenue mix is private
    - Determines downside if a large customer leaves
    - Request top-10 customer table and segment-level ACV distribution
  notes: These are the minimum items needed to convert a directional public-market-style view into a true private underwriting decision.
