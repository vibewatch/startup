  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: Public or private pricing, ACV, or contract-value benchmarks for enterprise delivery-orchestration software deployments.
    whyItMatters: Without pricing visibility, SAM and SOM sizing remain top-down and cannot be grounded in account-level economics.
    diligencePath: Request current pricing architecture, typical ACV ranges, implementation fees, and average contract lengths from management.
    relatedQuestionRefs:
    - QM024
  - type: access-blocked
    severity: material
    topic: market-methodology
    missingEvidence: Full analyst reports or transparent methodologies behind headline market-size forecasts.
    whyItMatters: Headline TAM numbers can materially overstate or understate the software-relevant opportunity if their category definitions are opaque.
