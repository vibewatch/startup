chapter:
  number: 2
  title: Market Analysis
  summary: Bringg operates inside a very large global last-mile delivery market, but the relevant underwritten opportunity is the narrower enterprise delivery-orchestration software layer rather than all logistics spend. Public market reports support strong structural demand from e-commerce, same-day fulfillment, and automation, while cost pressure, sustainability complexity, geopolitical risk, and substitute solutions constrain how quickly that demand converts into durable software economics.
sections:
- id: market-boundary-and-definition
  title: Market Definition and Boundary
  body: The most important analytical move in this chapter is to separate Bringg’s addressable software market from the much larger logistics-services universe that analyst headlines often describe. Bringg sells orchestration software spanning planning, dispatch, driver execution, delivery experience, automation, analytics, and connectivity. That means the company participates in the control layer of last-mile delivery, not in all parcel revenue, courier wages, fleet capex, or every dollar of e-commerce logistics spend. Research and Markets and Research Nester both frame the broader last-mile market through service-mode, technology, and vertical-application segmentation, which is useful for demand context but too broad for a direct revenue bridge to Bringg. The underwriting boundary that matters therefore includes enterprise delivery orchestration budgets inside large retailers, grocers, food-service chains, and logistics operators; it excludes carrier-owned linehaul economics, generic warehouse-management
    spend, and in-house delivery labor that never flows through software subscription or usage revenue. This narrower boundary also explains why Bringg can be relevant in a $100B-plus delivery ecosystem while still monetizing only a multi-billion-dollar software subset of it.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM007
  - CM012
