- id: market-size-and-growth-estimates
  title: Market Size and Growth Estimates
  body: The retained analyst set supports confidence in direction, not false precision. Research and Markets, Research Nester, Datastring Consulting, Global Growth Insights, and 6W Research all publish pages that frame the global last-mile delivery market as very large and growing at double-digit rates, but most retained access points are teaser pages rather than transparent models. That is why the right output here is a bounded sizing range instead of a single triumphant TAM figure. A reasonable synthesis is a 2030 global last-mile market envelope of roughly $80 billion on a conservative case, $120 billion on a base case, and $170 billion on a higher-growth case. Those numbers should be treated as inferred directional brackets rather than direct quotes from any one publisher. The more relevant question for Bringg is SAM. Because Bringg sells orchestration, APIs, and enterprise workflow control, its software-relevant segment is much smaller than the total delivery-services pool and is better
    framed in the $5 billion to $10 billion range. Even then, Bringg’s current estimated ARR of $40.8 million implies that today’s realized SOM is still only a small fraction of the software opportunity.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM022
