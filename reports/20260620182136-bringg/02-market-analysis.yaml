  rows:
  - - Enterprise delivery orchestration software
    - Planning, dispatch, driver-app, delivery-experience, automation, analytics, and integration spend
    - Courier wages, parcel postage, vehicle capex, and generic WMS spend
    - Retail, grocery, food-service, logistics, and omnichannel operations leaders
    - Core revenue surface for Bringg
  - - Multi-carrier control layer
    - Software that allocates orders across owned fleets, 3PLs, and gig partners
    - Single-carrier contracts without orchestration software
    - Logistics and transportation leaders
    - Maps directly to Bringg's orchestration value proposition
  - - Store-fulfillment and same-day workflows
    - Routing, slot management, store picking coordination, and exception handling
    - Upstream merchandising or ERP modules without delivery execution control
    - Store operations and digital commerce teams
    - Critical in retail and grocery last-mile economics
  - - Enterprise customer-experience layer
    - Tracking, ETA messaging, branded delivery comms, and proof-of-delivery workflows
    - Generic CRM spend not linked to fulfillment execution
    - CX, omnichannel, and operations leaders
    - Supports differentiated service levels and repeat purchase behavior
  - - Broad last-mile services market
    - Total delivery-services pool referenced by analyst reports
    - Narrow software-only revenue pool
    - Carriers, shippers, and logistics networks broadly
    - Useful TAM backdrop but too broad to map 1:1 into Bringg revenue
  notes: The market boundary deliberately narrows from global delivery spend to the software control layer that Bringg actually monetizes.
