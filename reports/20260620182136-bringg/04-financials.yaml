- id: growth-and-unit-economics-proxies
  title: Growth and unit-economics proxies
  body: The available financial datapoints are estimated, but they are still useful for bounding scale. GetLatka pegs Bringg at about $16.4 million ARR in 2020 and about $40.8 million in 2024, which implies roughly 149% total ARR growth over four years and an annualized growth rate near 20%. That is credible growth for a mature enterprise software vendor, but not obviously enough by itself to defend a stale unicorn mark in the 2026 market. The same source lists 21 quota-carrying sales reps. If that number is directionally right, ARR per rep is about $1.94 million, which is respectable on paper but not enough to infer sales efficiency because CAC, payback, quota attainment, and churn are all undisclosed. A simple average of $40.8 million ARR across 800-plus customers suggests about $51,000 of ARR per customer, again consistent with a mix of smaller and larger enterprise accounts rather than a tiny number of very large contracts. These proxies suggest real commercial traction, but they do
    not reveal whether margin quality, retention, or implementation effort are strong enough to compound efficiently.
  claimRefs:
