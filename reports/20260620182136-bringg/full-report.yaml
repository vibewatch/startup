      - number: '6.4'
        title: Expansion, Concentration, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Bringg’s expansion thesis is intuitively credible because the product suite spans planning, dispatch,
              driver execution, customer communication, and delivery promises, giving the company several cross-sell
              surfaces inside a single account. The public evidence also shows applicability across retail and grocery
              workflows, which should help land-and-expand logic. But adverse diligence signals remain real. There is no
              retained public disclosure of net retention, gross retention, top-customer concentration, or revenue share
              by segment, so investors cannot tell whether the customer base is economically diversified or overly
              dependent on a few marquee accounts. Public proof is also harder to verify than it should be: Best Buy’s
              corporate archive did not offer easy corroboration, the Coles investor page was broken, and broader
              sentiment platforms such as Capterra and Trustpilot did not yield a clean, open review picture. That
              combination does not refute customer traction, but it does mean that customer quality still needs direct
              diligence-room evidence rather than inference from logos and scattered testimonials.
