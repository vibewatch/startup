  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >-
              The most important analytical move in this chapter is to separate Bringg’s addressable software market
              from the much larger logistics-services universe that analyst headlines often describe. Bringg sells
              orchestration software spanning planning, dispatch, driver execution, delivery experience, automation,
              analytics, and connectivity. That means the company participates in the control layer of last-mile
              delivery, not in all parcel revenue, courier wages, fleet capex, or every dollar of e-commerce logistics
              spend. Research and Markets and Research Nester both frame the broader last-mile market through
              service-mode, technology, and vertical-application segmentation, which is useful for demand context but
              too broad for a direct revenue bridge to Bringg. The underwriting boundary that matters therefore includes
              enterprise delivery orchestration budgets inside large retailers, grocers, food-service chains, and
              logistics operators; it excludes carrier-owned linehaul economics, generic warehouse-management spend, and
              in-house delivery labor that never flows through software subscription or usage revenue. This narrower
              boundary also explains why Bringg can be relevant in a $100B-plus delivery ecosystem while still
              monetizing only a multi-billion-dollar software subset of it.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM012
              - CM022
              - CM032
              - CM036
