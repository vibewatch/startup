      - number: '4.4'
        title: Valuation context and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The headline valuation is the clearest place where operating reality and private-market optics may have
              diverged. Using GetLatka's estimated $40.8 million ARR and the last publicly retained $1 billion valuation
              implies roughly 24.5x ARR on stale pricing. That is below the implied 2021 multiple if revenue then sat
              around $20 million to $25 million, but it is still elevated for a business with no public margin,
              retention, or cash-flow disclosure. Review marketplaces and profile sites also point to implementation
              complexity, which matters financially because services-heavy deployments can dilute software margins and
              lengthen payback even when top-line ARR is real. The most likely conclusion is not that Bringg is
              distressed. It is that open-source evidence leaves the company under-explained relative to its maturity.
              Financial diligence therefore needs to focus on audited revenue, services mix, gross margin, burn, runway,
              customer concentration, retention, and whether headcount reduction was proactive efficiency management or
              reactive cost control. Without those items, investors are effectively underwriting a stale private mark
              with limited proof of present-day value creation.
