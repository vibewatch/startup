      - number: '4.3'
        title: Capital adequacy and disclosure risks
        blocks:
          - type: paragraph
            body: >-
              The chapter's main risk conclusion comes from what the public record does not disclose. Bringg raised
              about $184.5 million overall and last announced a $100 million Series E in June 2021 at a $1 billion
              valuation, but the retained source set does not disclose cash on hand, monthly burn, runway, debt, gross
              margin, or audited profitability. That creates a real underwriting blind spot because the company is no
              longer an early startup; by 2026 it is a mature private software vendor with global operations and
              still-limited public financial transparency. Headcount trend data adds context without resolving the
              question. Tracxn and Dealroom indicate staffing fell from about 309 at the January 2022 peak to about 204
              by May 2026, a decline of roughly 34%. That could indicate healthy efficiency, slower growth, or silent
              pressure to preserve cash. The problem is that open-source evidence cannot distinguish among those
              scenarios. As a result, capital adequacy can only be assessed narratively: the company has survived almost
              five years since the last disclosed round, which is encouraging, but that fact alone does not prove
              profitability or runway sufficiency.
