  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Bringg does not publish audited revenue by product line, but the retained corpus still points to a
              coherent monetization structure. The company sells a modular last-mile platform with planning, dispatch,
              driver, customer-experience, automation, and connectivity components, which strongly suggests subscription
              software as the primary revenue layer. Review and profile sites reinforce that impression by treating
              Bringg as enterprise operations software rather than as a point solution. The same materials also imply a
              second revenue stream in professional services. Enterprise last-mile deployments usually require
              integration, workflow design, and onboarding; the partner and customer-proof surfaces around SAP and
              Google Cloud support that enterprise implementation motion. A third possible monetization layer is
              usage-based or location-based pricing tied to deliveries, stores, drivers, or modules, because the
              official product architecture is modular and scale-sensitive. None of these points reveal realized ASPs or
              contract structure, but they are sufficient to conclude that Bringg is likely a subscription-led SaaS
              business with meaningful services and deployment revenue wrapped around it rather than a purely
              transactional delivery marketplace.
