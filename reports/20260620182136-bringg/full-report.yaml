  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Geopolitical and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Bringg's highest-consequence risk is geopolitical concentration rather than immediate product fragility.
              The company is headquartered in Tel Aviv, public company profiles point to a meaningful share of employees
              in Israel, and management has already discussed how the October 7 attack and subsequent war forced the
              business into continuity mode. That history cuts both ways. On one hand, it is evidence that the
              organization has already practiced crisis operations and can redistribute work across Chicago, London,
              Warsaw, and Kyiv. On the other hand, it confirms that a material portion of leadership, engineering, and
              operating talent still sits inside a region whose security environment remains volatile. Regulatory risk
              compounds the issue because Bringg operates across 70-plus countries and processes delivery, driver, and
              customer workflow data. That creates exposure to GDPR-style privacy obligations, cross-border contracting,
              and possible sanctions or trade restrictions if regional conflict broadens. No public lawsuit or
              enforcement file was surfaced in the retained corpus, but the absence of public adverse process is not the
              same thing as proof that legal or regulatory exposure is immaterial.
            claimRefs:
              - CR001
              - CR002
