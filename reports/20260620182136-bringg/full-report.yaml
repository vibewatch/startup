      - number: '6.3'
        title: Satisfaction, Retention, and Review Signals
        blocks:
          - type: paragraph
            body: >-
              The public satisfaction picture is directionally positive but too thin to substitute for cohort or renewal
              data. G2 shows Bringg at roughly 4.5 out of 5 and includes a review describing the product as highly
              adaptable and customizable with strong integration options. TrustRadius adds a 9 out of 10 score, while
              PeerSpot surfaces operational strengths in tracking, dispatch, analytics, and customer communication.
              Those are all useful signals because they describe the platform the way practitioners would experience it.
              The problem is scale and depth. Review counts are low relative to the company’s claimed 800-plus-customer
              footprint, and the retained set does not disclose NRR, churn, contract length, or even a basic renewal
              cohort. Public review commentary also hints that customization and implementation effort can be a tradeoff
              rather than a pure strength. Investors can therefore lean on the satisfaction signal as a weak positive,
              but not as evidence that customer love is broad, sticky, or efficiently monetized across the installed
              base.
