  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market structure and peer set
        blocks:
          - type: paragraph
            body: >-
              Bringg sits in the enterprise orchestration layer of last-mile delivery software rather than in the
              low-end route-planning niche. The retained competitor corpus repeatedly clusters Bringg with FarEye,
              DispatchTrack, LogiNext, Onfleet, Routific, and eLogii, but those names do not compete in identical ways.
              FarEye and DispatchTrack are the closest workflow peers because they sell multi-step delivery operations
              to larger shippers and retailers. LogiNext also overlaps, though it stretches further into broader
              logistics and field-force software. Onfleet and Routific compete by simplifying deployment, narrowing
              feature scope, and lowering entry price for smaller fleets. eLogii sits in the middle with stronger
              optimization depth than basic SMB tools but less enterprise proof than Bringg. That structure matters
              because Bringg is not defending one monopoly position; it is defending a premium control-tower position
              against both enterprise peers above and lighter substitutes below. The relevant question for buyers is
              whether Bringg's added orchestration breadth materially reduces delivery complexity enough to justify
              higher cost, longer implementation, and lower off-the-shelf simplicity.
