  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation framework and data quality
        blocks:
          - type: paragraph
            body: >-
              The valuation problem starts with data quality rather than with arithmetic. Bringg is not a pre-product
              concept company; the retained record supports a real enterprise platform with broad customer reach,
              meaningful delivery throughput, and a real revenue base. Yet the most commonly retained revenue number is
              still GetLatka's estimated 2024 ARR of about $40.8 million, not a company-disclosed audited metric. The
              last clearly retained financing event is the June 2021 $100 million Series E at a $1 billion valuation.
              That gap matters because five years is long enough for the price, the market, and the company's internal
              economics to diverge materially. Headcount contraction since 2022 adds another signal but not a conclusive
              one. A smaller workforce could mean efficiency and profitability, or it could mean moderated growth
              ambition. Because gross margin, NRR, churn, and cash-flow data remain private, the chapter uses
              scenario-based valuation anchored to ARR and market multiple logic rather than pretending a precise
              present-value model is justified by the public record.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
