      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >-
              Leadership continuity is one of Bringg’s more investable qualities, but the governance picture is still
              less transparent than a public-market diligence standard would require. Guy Bloch has led the company
              since 2018 and is repeatedly profiled as the executive who scaled Bringg through the pandemic-era
              e-commerce surge and the 2021 unicorn round. External biographies emphasize his operating background at
              Splunk, HP Software, and Mercury Interactive, which supports a thesis that Bringg’s current leadership is
              commercial and enterprise-oriented rather than purely technical. Lior Sion remains the named CTO and
              technical co-founder in public profiles, while Raanan Cohen appears in some data providers as a co-founder
              or board-level figure, underscoring that founder attribution is not perfectly harmonized across sources.
              The available public set does not provide a clean, current board roster, ownership-control map, or
              governance-rights summary after Series E. That means leadership quality is supportable, but formal
              governance remains a diligence gap rather than a closed question.
            claimRefs:
