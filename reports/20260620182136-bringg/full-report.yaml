chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Founding
        blocks:
          - type: paragraph
            body: >-
              Bringg Delivery Technologies Ltd. is best understood as an enterprise software company rather than a
              carrier or marketplace. Official company pages describe the platform as delivery orchestration and
              fulfillment technology for large brands, while third-party databases consistently place it in last-mile
              logistics software. That distinction matters because the business model depends on coordinating owned
              fleets, third-party carriers, and customer experience workflows instead of monetizing a single delivery
              network. Public profiles place the company’s origin in 2013 and show it headquartered in Tel Aviv, with
              additional commercial presence in Chicago and other international offices. The founding story is somewhat
              messy in public databases: Lior Sion is consistently identified as co-founder and CTO, while Tracxn and
              Startup Intros also name Raanan Cohen as a co-founder. For diligence purposes, the safe conclusion is that
              Bringg emerged from Israeli logistics-tech roots in 2013, built around enterprise orchestration rather
              than parcel execution, and later expanded into a multi-office global software organization.
