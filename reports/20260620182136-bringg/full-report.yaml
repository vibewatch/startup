      - number: '1.3'
        title: Funding History and Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              Bringg’s capitalization history is well enough documented to anchor the company’s stage and investor
              expectations. Tracxn, Owler, and GetLatka all point to roughly $184.5 million raised across seven rounds,
              and the funding progression culminates in a $100 million Series E announced on June 16, 2021 at a $1
              billion valuation. Insight Partners led that round, with Cambridge Capital, GLP, Harlap, Next47, Pereg
              Ventures, Salesforce Ventures, and Viola Growth also named publicly. Earlier round disclosures and
              portfolio pages indicate support from Aleph, Ituran, O.G. Tech, Coca-Cola, and other strategic or
              logistics-oriented backers. That investor mix matters because it suggests Bringg was financed not only as
              generic SaaS, but also as infrastructure for retail and supply-chain transformation. The more difficult
              underwriting question is not whether Bringg once achieved unicorn status; it is whether the 2021 mark
              still reflects today’s private-market reality given the lack of a newer priced round, limited public
              financials, and estimated ARR that is far smaller than the valuation headline implies.
