              - CV006
              - CV008
              - CV010
              - CV022
              - CV030
              - CV031
              - CV040
      - number: '8.5'
        title: Final diligence asks and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              Bringg can move from TRACK to investable only if private evidence resolves a short list of
              valuation-critical unknowns. The first ask is current ARR with a monthly or quarterly bridge to show
              whether growth actually continued after 2024. The second is quality of revenue: gross margin, services
              mix, NRR, logo churn, and expansion depth by major account. The third is financing posture: cash on hand,
              burn or free cash flow, and whether the absence of a new round reflects strength or an inability to clear
              price. The fourth is customer and implementation health: time-to-value, deployment success, and
              concentration by top accounts. These are not housekeeping items. They determine whether Bringg belongs
              near the upper end of private SaaS ranges or whether the stale unicorn mark should be written down
              substantially. The thesis breaks if growth slips into low single digits, margins reveal a services-heavy
              model, a large customer rolls off, or management signals a financing need at terms meaningfully below the
              last round.
            claimRefs:
              - CV011
              - CV022
              - CV028
              - CV029
              - CV031
              - CV034
              - CV037
              - CV038
              - CV040
