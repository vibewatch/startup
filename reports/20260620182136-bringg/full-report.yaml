            claimRefs:
              - CV021
              - CV022
              - CV028
              - CV033
              - CV038
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV022
              - CV028
              - CV029
              - CV031
              - CV034
              - CV037
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Bringg may still be a good company at a bad legacy price
            body: >-
              The chapter's main conclusion is not that Bringg lacks substance; it is that the visible 2021 price likely
              reflects a past market regime more than a currently cleared valuation.
            calloutType: insight
            claimRefs:
              - CV001
              - CV004
              - CV013
              - CV027
          - type: callout
            title: TRACK until updated private metrics narrow the range
            body: >-
              A move above TRACK requires present-day ARR, retention, margin, concentration, and financing data robust
              enough to justify paying meaningfully more than a compressed private SaaS multiple.
            calloutType: recommendation
            claimRefs:
              - CV022
              - CV028
              - CV030
              - CV031
              - CV040
