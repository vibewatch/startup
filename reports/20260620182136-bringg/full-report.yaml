      - number: '1.4'
        title: Operating Scale and Global Footprint
        blocks:
          - type: paragraph
            body: >-
              Official product and company materials present Bringg as meaningfully scaled on a global enterprise basis.
              The company claims more than 800 customers, presence in more than 70 countries, 200 million annual
              deliveries, and more than 200 integrations across carriers and platforms. Dealroom and Tracxn provide a
              complementary external view: roughly 204 employees in 2026, a team footprint across 13 countries, web
              traffic around 1.1 million monthly visits, and a patent portfolio of four active families with modest
              estimated value. Those figures support the view that Bringg is far beyond seed-stage discovery and has
              built a real market footprint. At the same time, the scale picture is uneven. The company discloses
              operating breadth and workflow volume, but not audited revenue, margins, retention, or customer
              concentration. The result is a business that clearly has enterprise reach and product-market relevance,
              yet still requires investors to infer commercial efficiency from partial third-party metrics and selective
