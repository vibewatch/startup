- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Counterparty
  - Role
  - Concentration signal
  - Failure scenario
  - Severity
  - Mitigation
  - Residual exposure
  rows:
  - - Cloud infrastructure
    - Google Cloud
    - Core hosting and platform services
    - Named ecosystem dependency but no public redundancy detail
    - Major outage or architecture bottleneck hits uptime and customer SLAs
    - High
    - Use multi-region design and incident-response runbooks
    - Material until architecture redundancy is validated
  - - Carrier API network
    - 200+ external carriers and delivery partners
    - Execution data exchange and orchestration
    - Breadth is a strength but creates many moving interfaces
    - API changes or degraded partner data break routing, status, or customer notifications
    - High
    - Maintain version monitoring, sandbox testing, and partner escalation paths
    - Material because integration count is large
  - - Enterprise system ecosystem
    - SAP, Salesforce, and other enterprise systems
    - Workflow integration and customer embedding
    - Important for enterprise stickiness but not publicly quantified
    - Connector failure or slow certification hurts deployments
    - Medium
    - Keep certified connectors and implementation playbooks current
    - Moderate until live-usage share is disclosed
  - - Anchor customer logos
    - Large enterprise retailers and brands
    - Reference credibility and likely revenue concentration
    - Named logos matter strategically even if revenue mix is private
    - Loss of a marquee customer weakens growth narrative and pipeline confidence
    - High
    - Deepen multi-logo diversification and segment penetration
    - Material because concentration is undisclosed
  - - Implementation partners
    - Consulting, carrier, and systems integrator channels
    - Deployment leverage
    - Partner depth is implied rather than publicly enumerated
    - Weak partner execution delays value realization for customers
    - Medium
    - Document partner enablement and QA ownership
    - Moderate until channel mix is known
  notes: This dependency register focuses on external counterparties that can transmit outages, churn, or sales friction into Bringg's operating model.
