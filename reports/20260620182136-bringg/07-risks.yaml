tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Jurisdiction
  - Severity
  - Current exposure
  - Mitigation
  - Diligence ask
  rows:
  - - Israel conflict escalation
    - Israel / global operations
    - High
    - HQ and a large talent base remain tied to Israel while customers operate globally
    - Use multi-office continuity playbooks and transfer critical workflows across non-Israel teams
    - Request regional staffing, reserve-duty exposure, and tested continuity plans by function
  - - Cross-border privacy compliance
    - EU, UK, U.S., and multi-country operations
    - High
    - Bringg operates in 70+ countries and touches driver, delivery, and customer data flows
    - Maintain privacy program, DPA controls, and region-specific contracting
    - Review DPA, subprocessor list, incident log, and GDPR / CCPA control ownership
  - - Sanctions or trade restriction spillover
    - Israel-linked commercial footprint
    - Medium
    - Broader regional escalation could create customer or partner caution even absent direct sanctions on Bringg
    - Monitor trade-policy changes and customer procurement restrictions
    - Ask management how sanctions screening and export-control reviews are handled
  - - Contractual and data-processing liability
    - Customer contracts across enterprise accounts
    - Medium
    - Enterprise deployments create negotiated SLA, uptime, and indemnity obligations that are not visible publicly
    - Standardize legal terms and document security / privacy commitments
    - Request top contract redlines, indemnity caps, and unresolved customer legal issues
  notes: Rows rank the legal and regulatory issues that matter most to Bringg's present operating footprint; severity reflects chapter evidence, not a legal opinion.
  enumerationScope:
    coverage: exhaustive
    basis: Enumerates every legal or regulatory risk class directly evidenced in the retained Bringg, regulator, and policy source set for this chapter.
