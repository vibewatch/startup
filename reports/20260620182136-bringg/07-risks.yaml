- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Israel concentration
    - Regional continuity stress
    - Critical functions unable to operate from Israel for multiple weeks without smooth handoff
    - Pause or reprice until offshore redundancy and customer support continuity are proven
  - - Security and trust
    - Major incident
    - Material breach, long outage, or loss of security certification affecting enterprise renewals
    - Treat as thesis-break until root cause and customer retention impact are understood
  - - Customer concentration
    - Logo loss
    - Loss of a marquee customer without offsetting expansion elsewhere
    - Reassess growth durability and implied ACV concentration
  - - Implementation economics
    - Deployment drag
    - Median time-to-value or services intensity materially worse than management target
    - Discount growth quality and lower acceptable entry multiple
  - - Financing posture
    - Capital urgency
    - Evidence of emergency fundraising, covenant pressure, or sharp pipeline deterioration
    - Move from watchlist to no-go unless terms reprice substantially
  notes: Kill criteria convert broad qualitative risks into observable diligence or monitoring triggers that can change investment posture quickly.
