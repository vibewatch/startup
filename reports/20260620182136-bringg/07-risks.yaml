callouts:
- calloutType: risk
  title: Israel concentration is the single highest-consequence residual risk
  body: Bringg appears capable of operating through disruption, but the combination of HQ concentration, national-security volatility, and key talent located in Israel remains the hardest risk to diversify away with public evidence alone.
  claimRefs:
