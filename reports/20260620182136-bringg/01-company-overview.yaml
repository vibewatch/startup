chapter:
  number: 1
  title: Company Overview
  summary: Bringg is a 2013-founded Tel Aviv delivery-orchestration software company that scaled into a private Series E unicorn after raising about $184.5 million and positioning itself as a last-mile fulfillment cloud for large enterprises. Public evidence supports meaningful global operating reach and ecosystem depth, but current underwriting still has to discount stale valuation marks, shrinking headcount, and thin private-company disclosure.
sections:
- id: identity-mission-founding
  title: Identity, Mission, and Founding
  body: 'Bringg Delivery Technologies Ltd. is best understood as an enterprise software company rather than a carrier or marketplace. Official company pages describe the platform as delivery orchestration and fulfillment technology for large brands, while third-party databases consistently place it in last-mile logistics software. That distinction matters because the business model depends on coordinating owned fleets, third-party carriers, and customer experience workflows instead of monetizing a single delivery network. Public profiles place the company’s origin in 2013 and show it headquartered in Tel Aviv, with additional commercial presence in Chicago and other international offices. The founding story is somewhat messy in public databases: Lior Sion is consistently identified as co-founder and CTO, while Tracxn and Startup Intros also name Raanan Cohen as a co-founder. For diligence purposes, the safe conclusion is that Bringg emerged from Israeli logistics-tech roots in 2013, built
    around enterprise orchestration rather than parcel execution, and later expanded into a multi-office global software organization.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  figureRefs:
  - FO002
- id: leadership-founders-governance
  title: Leadership, Founders, and Governance
  body: Leadership continuity is one of Bringg’s more investable qualities, but the governance picture is still less transparent than a public-market diligence standard would require. Guy Bloch has led the company since 2018 and is repeatedly profiled as the executive who scaled Bringg through the pandemic-era e-commerce surge and the 2021 unicorn round. External biographies emphasize his operating background at Splunk, HP Software, and Mercury Interactive, which supports a thesis that Bringg’s current leadership is commercial and enterprise-oriented rather than purely technical. Lior Sion remains the named CTO and technical co-founder in public profiles, while Raanan Cohen appears in some data providers as a co-founder or board-level figure, underscoring that founder attribution is not perfectly harmonized across sources. The available public set does not provide a clean, current board roster, ownership-control map, or governance-rights summary after Series E. That means leadership quality
    is supportable, but formal governance remains a diligence gap rather than a closed question.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO011
  - CO012
  - CO013
  - CO040
  tableRefs:
  - TO002
- id: funding-history-and-stakeholders
  title: Funding History and Stakeholder Map
  body: Bringg’s capitalization history is well enough documented to anchor the company’s stage and investor expectations. Tracxn, Owler, and GetLatka all point to roughly $184.5 million raised across seven rounds, and the funding progression culminates in a $100 million Series E announced on June 16, 2021 at a $1 billion valuation. Insight Partners led that round, with Cambridge Capital, GLP, Harlap, Next47, Pereg Ventures, Salesforce Ventures, and Viola Growth also named publicly. Earlier round disclosures and portfolio pages indicate support from Aleph, Ituran, O.G. Tech, Coca-Cola, and other strategic or logistics-oriented backers. That investor mix matters because it suggests Bringg was financed not only as generic SaaS, but also as infrastructure for retail and supply-chain transformation. The more difficult underwriting question is not whether Bringg once achieved unicorn status; it is whether the 2021 mark still reflects today’s private-market reality given the lack of a newer priced
    round, limited public financials, and estimated ARR that is far smaller than the valuation headline implies.
  claimRefs:
  - CO010
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO037
  - CO039
