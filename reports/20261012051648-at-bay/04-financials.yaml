company:
  name: "At-Bay"
chapter:
  number: 4
  title: "Financials"
  summary: "At-Bay operates an InsurSec model combining commercial cyber and specialty insurance with active security software, generating $278 million in gross written premiums and $23 million in cyber fee service revenues in 2025. Facing reinsurance dependency, capital intensity, and a broad insurtech valuation reset, At-Bay agreed in August 2026 to be acquired by Munich Re for $575 million, representing a 57% contraction from its $1.35 billion valuation in 2021."
sections:
  - id: "revenue-streams-and-pricing"
    title: "Revenue Streams and Pricing Model"
    body: "At-Bay structures its commercial revenue across two distinct engines: primary and excess cyber insurance premiums and high-margin cybersecurity software service fees. In the 2025 financial year, At-Bay generated $278 million in gross written premiums across its commercial lines, alongside $23 million in cybersecurity fee service revenue. The core insurance offering spans Cyber, Technology Errors and Omissions (Tech E&O), and Miscellaneous Professional Liability (MPL), distributed exclusively through wholesale and retail insurance brokers via At-Bay's automated broker platform. Standalone cyber and Tech E&O policies are dynamically priced based on external vulnerability scans and automated risk models. The cybersecurity software engine is anchored by At-Bay Stance, which bundles continuous exposure management, security awareness, and managed detection and response (MDR). While base exposure management is embedded into primary surplus policies, standalone exposure platforms typically command market list prices exceeding $5,000 annually. Advanced security capabilities, notably At-Bay Stance MDR, are offered across Core, Advanced, and Complete tiers for additional subscription fees. Paid MDR customer adoption accelerated rapidly from fewer than 1,000 accounts in 2023 to 7,500 by year-end 2024, demonstrating that the InsurSec bundling strategy creates a genuine secondary recurring software revenue stream alongside underwriting volume."
    tableRefs:
      - "TI001"
      - "TI002"
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI006"
      - "CI009"
      - "CI010"
      - "CI011"
  - id: "broker-distribution-and-conversion"
    title: "Broker Distribution Mechanics and Value Conversion"
    body: "At-Bay's go-to-market motion relies on an indirect, broker-led distribution model rather than direct-to-consumer sales. By providing automated risk assessments, rapid quote turnarounds, and specimen coverage forms through its proprietary broker platform, At-Bay integrates into regional and national brokerage workflows. This distribution footprint enables At-Bay to safeguard up to $800 billion in collective business revenue across nearly 40,000 policyholders in more than 100 industries. When a broker submits an SMB or middle-market risk, At-Bay executes an external security scan that informs dynamic policy pricing and terms. Upon binding, policy premiums convert into gross written premiums, but At-Bay operates as a hybrid managing general underwriter (MGU) and full carrier via At-Bay Specialty Insurance Company. Instead of absorbing the entirety of catastrophe and aggregation risk onto its own balance sheet, At-Bay transfers approximately 85% of insurance risk to established reinsurance and capacity partners, principally Munich Re and Hartford Steam Boiler (HSB), retaining 15% net risk. This structure allows At-Bay to scale premium throughput rapidly with an efficient organizational footprint of approximately 280 employees, while monetizing policyholder relationships through both retained risk margin and high-margin security service add-ons."
    figureRefs:
      - "FI001"
    claimRefs:
      - "CI004"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI013"
  - id: "cost-structure-and-underwriting-economics"
    title: "Cost Structure, Risk Retention, and Unit Economics"
    body: "Evaluating At-Bay's unit economics requires distinguishing between managing general underwriter commissions, carrier risk retention, and software delivery costs. By retaining only 15% of underwritten risk, At-Bay moderates statutory capital reserve requirements and insulates its balance sheet from catastrophic systemic ransomware aggregation. Prior reporting indicated that At-Bay generated more than $110 million in net revenue and $301 million in gross insurance premiums during 2023, while maintaining underwriting loss ratios significantly below legacy peers due to pre-breach vulnerability remediation. However, consolidated GAAP profitability, operating burn rates, and gross margin splits between insurance administration and software engineering remain closely guarded private data. Critical sales efficiency proxies, including cohort-level customer acquisition costs (CAC), broker commission concessions, and net revenue retention (NRR) across SMB cohorts, have not been publicly disclosed. While active risk monitoring helps prevent loss frequency, service delivery costs for dedicated managed detection and response (MDR) teams represent an ongoing operational expenditure that differs fundamentally from pure software margin profiles."
    tableRefs:
      - "TI003"
    claimRefs:
      - "CI008"
      - "CI010"
      - "CI012"
  - id: "capital-adequacy-and-strategic-exit"
    title: "Capital Adequacy, Strategic M&A Exit, and Diligence Verdict"
    body: "At-Bay's financing trajectory highlights the structural capital hurdles confronting standalone cyber insurtechs. After raising approximately $292 million to $296 million in total venture capital and reaching a peak post-money valuation of $1.35 billion following its Series D extension in October 2021, the company faced a tightening private equity climate and rising reinsurance costs. In August 2026, Munich Re Group announced a definitive agreement to acquire At-Bay in an all-cash transaction for an enterprise value of $575 million. The transaction, slated to close in early 2027 pending regulatory approvals, values At-Bay at roughly 2.0x 2025 gross written premiums. This price represents an approximate 57% contraction from its 2021 valuation mark, crystallizing a down-round acquisition outcome for later-stage venture investors. While the deal provides Munich Re's specialty arm, Hartford Steam Boiler, with proprietary cyber telemetry from more than 100,000 policy years, it underscores that high capital intensity, balance-sheet exposure, and private market valuation resets ultimately constrained At-Bay's viability as an independent venture-backed underwriting platform."
    claimRefs:
      - "CI001"
      - "CI004"
      - "CI005"
      - "CI014"
