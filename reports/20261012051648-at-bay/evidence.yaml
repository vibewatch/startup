evidenceGaps:
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: >-
      Audited standalone GAAP income statement, net loss/profit figures, underwriting loss ratios, and cash burn metrics
      for fiscal 2025 and 2026.
    whyItMatters: >-
      While At-Bay reported $278M in 2025 gross written premiums and $23M in cyber fee revenue, GAAP underwriting
      profitability, combined ratio, and net operating margins remain confidential pending transaction close.
    diligencePath: Inspect Munich Re regulatory approval filings and post-acquisition segment reporting disclosures under HSB.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: minor
    topic: reinsurance-structure
    missingEvidence: >-
      Specific treaty attachment points, quota-share retention limits, and reinsurance pricing terms between At-Bay and
      its capital partners.
    whyItMatters: >-
      Understanding risk retention versus risk ceded to Munich Re / HSB dictates true underwriting exposure and margin
      capture on cyber risk.
    diligencePath: >-
      Request treaty schedule disclosures or examine state insurance commissioner filings for At-Bay Specialty Insurance
      Company.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: retention-and-reinsurance
    missingEvidence: >-
      Disclosed cohort retention, net revenue retention (NRR), broker commission splits, and reinsurance treaty
      attachment points for At-Bay's cyber insurance and Stance MDR books.
    whyItMatters: >-
      Without segmented cohort retention and reinsurance treaty economics, market sizing models cannot differentiate
      between high-margin software recurring revenue and capital-intensive balance-sheet insurance exposure.
    diligencePath: >-
      Request audited GAAP underwriting cohort exhibits, broker distribution concentration figures, and reinsurance
      treaty renewal terms in management diligence.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Published rate cards or empirical gross written premium benchmarks comparing At-Bay against Coalition and Cowbell
      across standardized SMB revenue tiers.
    whyItMatters: >-
      Because cyber MGAs do not publish flat pricing, buyers and investors cannot independently verify whether At-Bay's
      loss-prevention tools yield structurally lower premiums or merely bundle software costs into baseline rates.
    diligencePath: >-
      Request anonymized broker placement datasets and multi-quote comparison sheets across comparable SIC industry
      codes and risk grades.
    relatedQuestionRefs:
      - QP001
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: mdr-retention
    missingEvidence: >-
      Standalone churn rates, net revenue retention (NRR), and policyholder attach rates for the paid At-Bay Stance MDR
      product tier.
    whyItMatters: >-
      Determines whether At-Bay's security software is building independent high-margin ARR or remains a subsidized
      underwriting amenity tied directly to policy renewal.
    diligencePath: >-
      Review customer cohort retention schedules and separate software subscription Billings in Munich Re acquisition
      disclosure files.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP001
  - type: enumeration-incomplete
    severity: minor
    topic: broker-concentration
    missingEvidence: >-
      Detailed premium volume distribution across top wholesale and retail brokerage networks such as Amwins, CRC,
      Marsh, and Aon.
    whyItMatters: >-
      High broker channel concentration introduces displacement vulnerability if major aggregator networks negotiate
      exclusive distribution pacts with rival cyber underwriters.
    diligencePath: Review broker concentration exhibits and producer agreement terms in underwriting filings.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited cohort CAC, net revenue retention (NRR), and gross margin breakdown between insurance MGU operations and
      Stance MDR security subscriptions.
    whyItMatters: >-
      Without verified customer acquisition costs and retention curves, underwriters cannot assess standalone sales
      efficiency or lifetime value to customer acquisition cost (LTV/CAC) ratios across broker distribution channels.
    diligencePath: >-
      Request historical broker commission schedules, cohort retention tables by policy vintage, and gross margin
      segment accounting for At-Bay Security LLC.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Audited statutory financial statements, monthly net cash burn rate, cash and short-term investment reserves prior
      to the transaction.
    whyItMatters: >-
      Prevents independent determination of whether the $575 million transaction was an opportunistic exit or a
      defensive sale driven by dwindling cash runway and limited growth equity access.
    diligencePath: >-
      Review pre-acquisition management accounts, board presentations on financing alternatives, and statutory filings
      for At-Bay Specialty Insurance Company.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: developer-surface-gap
    missingEvidence: >-
      Public developer documentation, API endpoints, or open SDK repositories validating algorithmic underwriting and
      vulnerability scoring integrations.
    whyItMatters: >-
      Without public technical documentation or developer artifacts, external technical validation of the automated
      underwriting engine relies entirely on marketing claims.
    diligencePath: >-
      Request confidential architecture briefs, API schema specifications, and automated underwriting code documentation
      during technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: mdr-telemetry-performance
    missingEvidence: >-
      Audited SOC 2 Type II reports, mean-time-to-detect (MTTD), and mean-time-to-respond (MTTR) performance metrics for
      At-Bay Security LLC's 24/7 MDR operations.
    whyItMatters: >-
      Service-level delivery and incident response containment speeds directly determine policyholder breach losses and
      loss ratios.
    diligencePath: >-
      Review vendor SOC audit reports, third-party penetration testing results, and internal incident response SLAs
      during technical evaluation.
  - type: missing-source
    severity: material
    topic: retention-and-renewal-metrics
    missingEvidence: >-
      Public disclosure of Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and annual policy renewal rates
