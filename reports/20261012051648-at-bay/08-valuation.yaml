company:
  name: At-Bay
chapter:
  number: 8
  title: Valuation
  summary: At-Bay entered into a definitive agreement in August 2026 to be acquired by Munich Re Group for $575 million in cash, representing a 57% valuation compression from its peak $1.35 billion Series D valuation in 2021. The transaction values the business at approximately 2.0x 2025 gross written premiums of $278 million, reflecting the broader market reset in venture-backed insurtech valuations while providing full liquidity to investors and integrating At-Bay into Munich Re Specialty's Hartford Steam Boiler unit.
sections:
  - id: thesis-and-anti-thesis
    title: Investment Thesis and Anti-Thesis
    body: The core investment thesis for At-Bay has centered on its InsurSec model, combining cyber insurance policies with active vulnerability scanning and proprietary Managed Detection and Response through At-Bay Stance. This dual approach demonstrated tangible commercial traction, scaling premium volume to $278 million across approximately 40,000 active policyholders and expanding standalone cybersecurity fee revenues above $30 million. Furthermore, management maintained capital discipline relative to peers, raising under $300 million across seven institutional rounds, which enabled all investors and employee equity holders to achieve positive returns in the $575 million Munich Re acquisition. Conversely, the anti-thesis highlights the severe structural compression inherent in managing a venture-backed cyber MGA that cedes 85% of insurance risk to third-party balance sheets. Despite sixfold premium growth since 2021, enterprise value fell by 57% from its $1.35 billion peak, underscoring that public and strategic markets price MGA commission streams and hybrid cyber software at low single-digit premium multiples rather than high software valuations.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
      - CV011
    tableRefs:
      - TV002
  - id: valuation-and-financing-history
    title: Financing History and Multiple Reset
    body: At-Bay raised approximately $292 million to $296 million in equity financing between its 2016 founding and 2022, culminating in a $1.35 billion post-money valuation at its Series D round in October 2021. During that peak funding environment, private markets valued At-Bay at an 8.4x multiple on trailing run-rate revenues. By August 2026, Munich Re Group agreed to acquire At-Bay in an all-cash transaction at an enterprise value of $575 million, scheduled to close in the first quarter of 2027 subject to customary regulatory approvals. This transaction reprices At-Bay at approximately 2.0x 2025 gross written premiums of $278 million, representing a dramatic multiple reset. CEO Rotem Iram acknowledged this macro recalibration, noting that zero-interest-rate multiples have given way to fundamental cash-generation metrics, while emphasizing that $300 million in net new capital entered the company beyond cumulative funding, ensuring profitable outcomes across capital providers and retained employees.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
    tableRefs:
      - TV001
  - id: scenarios-and-decision-logic
    title: Scenario Analysis and Exit Mechanics
    body: With a signed definitive acquisition agreement, At-Bay's return distribution is dominated by transaction execution rather than long-term independent operating forecasts. In the base case (assigned an 85% probability), Munich Re successfully completes the transaction in the first quarter of 2027, absorbing At-Bay into its Hartford Steam Boiler specialty division. This delivers $575 million in cash consideration, establishing an orderly exit that insulates At-Bay from standalone capital market pressures. The bull case (10% probability) envisions transaction renegotiation or third-party overbidding, where standalone GWP scales past $400 million and cybersecurity ARR doubles to $60 million, commanding an enterprise valuation exceeding $1.0 billion. The bear case (5% probability) considers unexpected antitrust or regulatory intervention, or a systemic catastrophic cyber event prior to closing that triggers a material adverse change renegotiation below $350 million. In all cases, At-Bay's 15% risk retention structure cushions balance-sheet downside while tethering exit value to industrial partner willingness.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV011
    tableRefs:
      - TV003
    figureRefs:
      - FV001
  - id: diligence-asks-and-triggers
    title: Diligence Asks and Thesis-Break Triggers
    body: 'Because At-Bay is in the definitive window preceding transaction closing, secondary market investors and remaining stakeholders must prioritize transaction completion risk and capitalization waterfall verification over routine SaaS operating benchmarks. Primary diligence asks include auditing the definitive merger agreement for closing conditions, regulatory filings in the United States and Israel, and potential price-adjustment mechanisms tied to loss reserve development. Additionally, diligence must confirm the exact allocation of the $575 million purchase price across Series A through Series D liquidation preference stacks to verify common stock and management retention distributions. Critical thesis-break triggers include: first, any regulatory challenge or prolonged delay from state insurance commissioners or international regulators extending closing past mid-2027; second, senior executive departures ahead of the integration into Hartford Steam Boiler; and third, adverse loss ratio spikes across At-Bay''s non-admitted SMB portfolios that would jeopardize reinsurance partnership continuity.'
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV009
      - CV011
      - CV013
