callouts:
  - calloutType: risk
    title: Valuation Reset and Strategic Consolidation Reality
    body: At-Bay's agreed sale to Munich Re for $575 million represents a sharp 57% valuation haircut against its $1.35 billion 2021 peak, highlighting the structural limits of standalone cyber insurtech multiples. While the transaction delivers an orderly exit and validates At-Bay's InsurSec technology, it reflects an enterprise multiple compression from over 8x revenue down to 2.0x gross written premiums.
    claimRefs:
      - CV001
      - CV005
      - CV006
  - calloutType: insight
    title: Reinsurance Capacity and Industrial Alignment
    body: By retaining only 15% of its underwriting risk and passing 85% to carrier partners, At-Bay operated fundamentally as a technology-enabled distribution and MGA engine rather than a balance-sheet risk carrier. Integrating directly into Munich Re's HSB unit removes treaty renewal volatility and cements permanent balance sheet backing.
    claimRefs:
      - CV002
      - CV011
