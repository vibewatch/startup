        - Agreed M&A sale at $575M pending Q1 2027 regulatory closing
        - Do not purchase secondary shares above effective deal price; monitor regulatory approval milestones.
      - - Valuation Stance
        - Fair to Stretched (Historical)
        - 2.0x 2025 GWP multiple vs. 8.4x 2021 Series D revenue multiple
        - Valuation reflects severe private insurtech multiple compression from $1.35B peak to $575M acquisition.
      - - Risk Rating
        - High
        - 85% reinsurance risk ceding and regulatory review dependencies
        - Exposure to M&A closing conditions, Hart-Scott-Rodino review, and Israeli regulatory filings.
      - - Confidence
        - Medium
        - Public transaction terms verified by Munich Re, Calcalist, and Insurance Journal
        - Core acquisition terms confirmed; cap-table waterfall and detailed GAAP financials remain private.
