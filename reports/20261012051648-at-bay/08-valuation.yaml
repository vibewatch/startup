  - id: TV002
    title: Investment Thesis Versus Anti-Thesis Framework
    columns:
      - Thesis Angle
      - Bullish Investment Thesis
      - Bearish Anti-Thesis
      - Pivot Trigger
    notes: Evaluates structural drivers of company value across technology, distribution, reinsurance, and exit terms.
    rows:
      - - InsurSec Convergence
        - Proprietary Stance MDR platform generates >$30M fee revenue and reduces claims frequency across 40k SMB accounts.
        - Standalone security software margins and customer retention are diluted by low-margin insurance broker commissions.
        - MDR attach rate falling below 15% of active policyholders or rising customer churn.
      - - Capital & Valuation Discipline
        - Conservative funding path ($292M-$296M raised) allowed all investors and employees to profit in $575M sale.
        - 57% valuation collapse from $1.35B illustrates structural vulnerability of venture-backed insurtech balance sheets.
        - Litigation or shareholder dissent regarding preferred liquidation preference distribution.
      - - Capacity & Underwriting
        - Permanent industrial home inside Munich Re and HSB eliminates annual reinsurance treaty renewal friction.
        - 15% risk retention leaves At-Bay vulnerable to carrier fee squeeze and capacity withdrawal if loss ratios spike.
        - Adverse loss ratio development exceeding 70% across core SMB ransomware portfolios.
      - - Exit & Liquidity
        - All-cash transaction at $575M delivers definitive liquidity in a stalled insurtech IPO environment.
        - Acquisition locks in capital loss for late-stage investors participating at $1.35B valuation unless preferences prevail.
        - Failure to secure customary regulatory approvals prior to Q1 2027 closing target.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
      - CV011
  - id: TV003
    title: Bull, Base, and Bear Valuation Scenarios
    columns:
      - Scenario
      - Core Operating Assumptions
      - Valuation & Return Logic
      - Downside Triggers
      - Probability Signal
    notes: Scenario analysis benchmarks announced transaction certainty against standalone continuation and execution failure.
    rows:
      - - 'Base Case: Munich Re M&A Closing'
        - Transaction closes in Q1 2027 at $575M cash enterprise value; At-Bay transitions into HSB operating unit.
        - Delivers 2.0x multiple on $278M 2025 GWP; provides clean full liquidity to shareholders.
        - Regulatory delays or antitrust objections under international insurance merger scrutiny.
        - 85% (Definitive agreement signed by Munich Re and At-Bay boards)
      - - 'Bull Case: Re-underwritten Standalone Scale'
        - M&A fails or is topped; At-Bay scales GWP to $400M+ with Stance ARR reaching $60M+ at 20%+ net margins.
        - Re-rates to 3.5x-4.0x GWP or 6.0x software revenue, supporting $1.0B-$1.2B implied valuation.
        - Severe capital requirements to hold underwriting paper without Munich Re quota share backing.
        - 10% (Unlikely given signed definitive merger agreement and CEO commitment)
      - - 'Bear Case: Regulatory Block or Material Adverse Change'
        - Transaction blocked or renegotiated downward due to regulatory scrutiny or sudden catastrophic cyber loss event.
        - Valuation renegotiated below $350M (1.2x GWP); liquidity crunch forces emergency internal recapitalization.
        - Systemic zero-day ransomware wave impacting thousands of SMB policyholders simultaneously.
        - 5% (Munich Re partnership has operated stably since 2017 founding)
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
