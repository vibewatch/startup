      - number: '3.3'
        title: 定价不透明、产品打包架构与经纪人分销护城河
        blocks:
          - type: paragraph
            body: >-
              商业网络保险在主要供应商之间都存在显著的定价不透明。At-Bay、Coalition、Cowbell 和 Resilience
              均不公布标准价目表；保费会根据保单限额、行业风险类别、年收入和自动攻击面扫描结果动态确定。At-Bay 将保障打包为 Core、Advanced 和 Complete 三个层级，包含例行外部扫描和 vCISO
              咨询，同时把完整的 24/7 端点 MDR 放在付费升级之后。为激励降低风险，At-Bay 会向采用推荐安全控制的保单持有人提供保费抵扣和更优条款，使买方激励与承保盈利能力保持一致。

              分销是关键竞争战场，也是防御性护城河。不同于试图直销企业的消费级保险科技公司，At-Bay 几乎完全依赖覆盖全部 50
              个州的指定独立零售和批发保险经纪人。公司大力投入数字经纪人赋能，提供快速自动报价和承保决策，在经纪人合作伙伴中获得了极高的 93 Net Promoter
              Score（NPS）。这种经纪人忠诚度为纯软件厂商和新兴保险科技进入者设置了很高的门槛。然而，商业保险保单通常按一年期标准超额及盈余险种条款承保，客户留存仍会受到年度市场比价影响；如果竞争 MGA
              提供激进定价或更高经纪人佣金，At-Bay 就会暴露在风险之下。
