      - number: '4.3'
        title: 成本结构、风险留存与单位经济
        blocks:
          - type: paragraph
            body: >-
              评估 At-Bay 的单位经济，需要区分 managing general underwriter 佣金、承运商风险留存和软件交付成本。At-Bay 只保留 15%
              的承保风险，因此可以降低法定资本准备金要求，并隔离资产负债表免受系统性勒索软件聚合灾害的冲击。此前报告称，At-Bay 2023 年净收入超过 $110 million、毛保险保费为 $301
              million；由于在泄露前修复漏洞，其承保损失率显著低于传统同行。然而，合并 GAAP
              盈利能力、运营烧钱速度，以及保险管理与软件工程之间的毛利率拆分，仍是高度保密的私有数据。关键销售效率指标，包括客户群层面的客户获取成本（CAC）、经纪人佣金让利和 SMB
              客户群的净收入留存率（NRR），均未公开披露。主动风险监控有助于降低损失频率，但专职托管检测与响应（MDR）团队的服务交付成本是持续运营支出，与纯软件毛利模式有根本区别。
