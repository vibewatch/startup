  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别范围与相邻领域
        blocks:
          - type: paragraph
            body: >-
              网络保险市场已从可选的商业保障，转向必要的运营风险转移和安全合规工具。如今的市场范围包括基础网络责任险、错误与遗漏保险，以及主动攻击面监控和事件响应服务；这种融合被称为
              InsurSec。计入的支出包括第一方数据恢复、业务中断、勒索赎金补偿、第三方责任抗辩和一体化安全遥测对应的毛承保保费。相邻但排除的支出包括独立企业 SIEM
              架构、广泛的端点管理套件，以及没有明确网络险保障的普通商业财产保单。At-Bay 在这一边界内作为保险代理机构和超额及盈余险种经纪人覆盖全部 50
              个州，分销由非获准承运商资本支持的超额及盈余险种保单，同时部署专有暴露管理软件。
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM011
      - number: '2.2'
        title: TAM、SAM 与不同产业视角下的规模估算
        blocks:
          - type: paragraph
            body: >-
              衡量网络风险机会，需要把保守的保险公司保费数据与激进的 InsurSec 预测交叉验证；后者把安全软件预算和风险转移预算合并计算。按基础风险转移口径，Swiss Re 数据显示 2026
              年全球网络险毛承保保费基准为 $16.4 billion，Mordor Intelligence 给出的更宽分析区间则达到 $23.3 billion。2025 年市场增速趋稳：尽管理赔量（claims
              volume）上升，受市场定价走软影响，Munich Re 跟踪的全球保费从 2024 年的 $15.3 billion 小幅降至约 $15.0 billion。相反，At-Bay 将更宽的可服务
              InsurSec 市场定义为到 2028 年达到 $80.0 billion，并预计复合年增长率为
              22.0%，原因是保险与托管检测、漏洞管理和事件响应被打包销售。可服务市场主要是中小企业和中型市场企业；小企业年保费中位数接近 $1,740，中型市场客户则可达到六位数低端。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
