        title: 经纪人分销机制与价值转化
        blocks:
          - type: paragraph
            body: >-
              At-Bay 的市场进入依靠间接的经纪人主导分销，而不是直销消费者。公司通过专有经纪人平台提供自动化风险评估、快速报价和样本保障表，接入地区及全国经纪机构的工作流。这一分销覆盖使 At-Bay 能为近
              40,000 名保单持有人、横跨 100 多个行业的合计最高 $800 billion 商业收入提供保障。经纪人提交 SMB 或中型市场风险后，At-Bay
              会执行外部安全扫描，为动态保单定价和条款提供依据。保单绑定后，保费转化为毛承保保费；但 At-Bay 通过 At-Bay Specialty Insurance Company，以混合型 managing
              general underwriter（MGU）和完整承运商身份运营。公司不把全部灾害风险和聚合风险都压在自身资产负债表上，而是把约 85% 的保险风险转给成熟的再保险和承保能力合作伙伴，主要是 Munich
              Re 和 Hartford Steam Boiler（HSB），自身保留 15% 净风险。这种结构让 At-Bay 能以约 280
              人的精简组织快速扩大保费处理量，同时通过保留的风险利润和高毛利安全服务附加项实现保单持有人关系变现。
