              - CU009
      - number: '6.2'
        title: 采用轨迹与保单持有人规模
        blocks:
          - type: paragraph
            body: >-
              商业保单持有人数量在保险保障和增值软件安全产品两端都持续增长。公开证据显示，保单持有人从 2022 年末的 30,000 名，增至 At-Bay 官方营销页面所示的 35,000 名；Munich Re 2026
              年 8 月收购公告提到接近 40,000 家企业；Forbes 财务报道截至 2026 年 3 月则称有超过 53,000 家中小企业。随着保单持有人增长，Insurance Journal 于 2026 年 8
              月报道称，At-Bay 拥有 $278 million 毛承保保费，在美国和以色列约有 280 名员工。除基础保险险种外，At-Bay
              交叉销售安全软件也取得了可量化进展：付费托管检测与响应（MDR）附加服务的客户数从 2023 年不足 1,000 家增至 2024 年末的 7,500
              家，说明有相当一部分保单持有人愿意直接通过网络保险公司购买经常性安全服务。
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
      - number: '6.3'
        title: 客户部署、经纪人证据与理赔证明
        blocks:
          - type: paragraph
            body: >-
              由于商业网络保险保单持有人和 SMB 被保险人通常要求对数字风险状况和安全事件保密，经过验证的客户证明主要靠经纪人合作伙伴和已发布的理赔案例（claims
              testimonials）获得。商业分销由独立零售和批发保险经纪人完成，他们使用自动化 At-Bay Broker Platform
              进行报价、承保定制和绑定。公司渠道发布的经纪人反馈显示中间人满意度较高，其中包括自报的 93 Net Promoter
              Score（NPS），以及强调快速理赔周转和技术承保易用性的评价。商业案例研究展示了技术供应商、专业服务公司和中型市场企业的生产环境部署；这些客户利用 At-Bay
              的漏洞通知，在潜在勒索软件利用前修复关键安全暴露。
            claimRefs:
              - CU010
              - CU011
              - CU012
