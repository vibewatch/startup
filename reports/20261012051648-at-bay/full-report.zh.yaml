      - number: '3.4'
        title: 护城河耐久性、承保能力稳定性与战略收购动态
        blocks:
          - type: paragraph
            body: >-
              Munich Re Group 于 2026 年 8 月同意收购 At-Bay，已显著重塑其长期竞争护城河。作为独立 MGA，At-Bay
              历来存在结构性的承保能力暴露：公司一边管理承保和安全软件，一边依赖外部承运商的保险资质，保留约 15% 的净风险，其余转让给由 Munich Re 旗下 Hartford Steam
              Boiler（HSB）牵头的再保险合作伙伴。完全并入 Munich Re Specialty 后，At-Bay 的承保能力将得到永久稳定，保单由 A++（Superior）资产负债表支持，从而消除经常威胁独立
              MGA 的承运商撤离风险。

              但竞争压力仍来自多个方向。在中大型市场，Resilience 依靠吸引高管买家的量化财务建模，继续从 CFO 和企业风险经理手中赢得份额。Coalition 更宽的产品组合——包括管理责任险、Tech E&O
              和专业保障——则能在商业经纪机构中提供更强的多险种打包能力。此外，随着传统承运商逐步升级承保技术栈并与商业 MSSP 合作，保险科技 MGA 与传统巨头之间的技术差距会缩小。At-Bay
              能否保持防御性，取决于其合并后的 InsurSec 平台能否持续证明损失率表现优于同行，把安全软件从承保功能变成不可或缺的运营流程。
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP007
              - CP012
              - CP014
