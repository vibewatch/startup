      - number: '2.3'
        title: 买方细分、预算归属与购买流程
        blocks:
          - type: paragraph
            body: >-
              网络保险客户可分为三个层级，各自的采购流程、技术能力和预算负责人不同。员工少于 250 人的小企业占保单量大头，历史理赔数据显示，98% 的理赔（claims）来自年收入低于 $2 billion
              的组织。缺乏专职安全人员的小企业，通常由企业主或财务主管出于合同合规需要推动购买，再通过零售保险经纪人完成交易。年收入 $50 million 至 $500 million 的中型市场企业，则由企业风险经理和
              IT 总监共同决策，并根据勒索保障子限额和托管威胁遏制速度评估保单。年收入最高 $5 billion
              的中大型买家，需要带自动固定续期的专门欺诈和勒索软件套餐；财务部和风险高管控制商业保险预算，安全团队则验证端点遥测集成。
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM012
              - CM014
      - number: '2.4'
        title: 增长驱动、损失动态与承保摩擦
        blocks:
          - type: paragraph
            body: >-
              市场扩张由强烈的监管披露压力和系统性网络威胁升级推动，但受到严格承保要求制约。包括 SEC
              四天重大泄露披露要求在内的监管规则，促使组织购买保险，主要为了即时获得预先筛选的法律顾问和事件响应服务商名单。与此同时，损失动态持续恶化：2024 年，小企业和中型市场公司的勒索软件理赔频率（claims
              frequency）连续第三年上升 20%，平均事件成本接近 $470,000，金融欺诈损失平均为 $270,000。At-Bay 的理赔研究显示，远程访问服务是 87%
              勒索软件事件的入侵入口，平均理赔严重度达到
              $508,000。这些损失压力迫使承保人要求不可妥协的基础安全卫生措施，尤其是多因素认证、受监控的端点检测和不可变的物理隔离备份；安全防护不足的组织因此更难获得可负担的保障。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 保险与网络安全运营的融合
            body: InsurSec 的出现从根本上改变了软件分销经济学。保险公司把主动漏洞管理和托管检测直接嵌入保险承保合同，既绕开传统企业软件销售周期，又积累专有承保数据，从而降低理赔损失频率（claims）。
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
          - type: callout
            title: 勒索软件严重度上升挤压承保利润率
            body: >-
              2025 年全球保费规模走弱至约 $15.0 billion，而勒索软件理赔频率（claims frequency）和严重度继续上升，平均事件成本达到
              $470,000，网络保险业务因此持续承受利润率压缩。无法执行技术控制的承保人，面临不利的损失选择风险。
            calloutType: risk
            claimRefs:
              - CM002
              - CM006
              - CM008
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：InsurSec 同行、传统保险公司与安全替代方案
        blocks:
          - type: paragraph
            body: >-
              网络保险与风险管理市场在传统财产和意外险保险公司、以及技术驱动的新型 MGA 之间存在结构性分化。At-Bay 属于专门的 InsurSec
              类别，把商业网络保险承保与主动技术威胁防护直接结合。在这一领域，At-Bay 主要与 Coalition、Cowbell 和 Resilience 争夺客户。这些专门 MGA
              都不公开统一费率表，商业买家只能通过持牌保险经纪人，根据定制化数字风险画像协商保障范围。

              Coalition 是 At-Bay 在规模和技术范围上最接近的直接同行，推广 Active Insurance 模式，将自动扫描与 Wirespeed MDR 及更广泛的 Coalition Control
              平台结合。Coalition 在 2022 年完成 $250M Series F 后达到 $5B 估值，并拥有同行中最宽的产品线，覆盖网络险、高管风险和新兴 AI 威胁，背后有多承运商承保能力面板。Cowbell
              瞄准企业市场中较小的一端，强调由 Cowbell Factors 驱动的自适应持续承保，其 $60M Series C 由 Zurich 在 2024 年战略领投。Resilience
              从中大型市场和企业级切入，使用专有 Threatonomics Risk Graph，把技术安全遥测转化为以美元计量的资产负债表暴露。相比之下，Chubb 和 Travelers
              等传统多险种承运商拥有主导市场份额和强大资产负债表，但仍主要依赖年度静态承保问卷和第三方服务商面板，而不是嵌入式主动监控。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
              - CP013
