  - id: TV003
    title: 看多、基准与看空估值情景
    columns:
      - 情景
      - 核心运营假设
      - 估值与回报逻辑
      - 下行触发因素
      - 概率信号
    notes: 情景分析将已宣布交易的确定性与独立持续经营及执行失败进行对照。
    rows:
      - - 基准情景：Munich Re 并购交割
        - 交易于 2027 年第一季度以 $575M 现金企业价值完成；At-Bay 转为 HSB 运营部门。
        - 按 $278M 的 2025 年 GWP 计算，带来 2.0x 倍数；为股东提供清晰、完整的流动性。
        - 国际保险合并审查下出现监管延迟或反垄断异议。
        - 85%（Munich Re 与 At-Bay 董事会已签署终局协议）
      - - 乐观情景：重新承保后的独立扩张
        - 并购失败或被更高报价取代；At-Bay 将 GWP 扩大至 $400M 以上，Stance ARR 达到 $60M 以上，净利润率超过 20%。
        - GWP 重新定价至 3.5x–4.0x，或软件收入倍数达到 6.0x，支撑 $1.0B–$1.2B 的隐含估值。
        - 没有 Munich Re 份额保险支持时，持有承保载体需要大量资本。
        - 10%（鉴于已签署终局合并协议且 CEO 已承诺，可能性低）
      - - 悲观情景：监管阻断或重大不利变化
        - 由于监管审查或突发灾难性网络损失事件，交易被阻止或向下重新谈判。
        - 估值重新谈判至低于 $350M（1.2x GWP）；流动性紧张迫使公司紧急内部资本重组。
        - 系统性零日勒索软件浪潮同时影响数千名 SMB 保单持有人。
        - 5%（Munich Re 合作自 2017 年成立以来一直稳定运营）
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
