chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              At-Bay, Inc. 于 2016 年成立，是一家专注网络保险和风险管理技术的公司，旨在解决美国中小企业面临的结构性保障缺口。At-Bay 没有停留在传统 MGA
              每年评估一次静态风险问卷的模式，而是率先搭建一体化 InsurSec 架构，将基础网络责任险与持续主动威胁监控、自动漏洞检测结合。公司的商业模式以批发和零售保险经纪人为分销渠道，同时通过 At-Bay
              Stance 为保单持有人提供专有安全遥测和事件响应能力。公司总部位于旧金山，专业工程团队主要在特拉维夫运营；目前已将承保覆盖扩大到超过 40,000
              名活跃保单持有人，为多个商业行业合计数百亿美元的商业收入提供保障。
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: 创始人、高管领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公司由首席执行官 Rotem Iram、首席风险官 Roman Itskovich 与网络安全架构师 Etai Hochman、Tilly Kalisky 共同创立。Iram
              曾在顶尖技术情报机构和管理咨询领域工作，围绕缩小 SME 网络安全暴露缺口形成了战略视野。Itskovich 负责精算建模、定价算法和组合风险管理，这些构成 At-Bay
              损失率表现的量化基础。公司治理历来吸纳一线风险投资机构代表；与此同时，战略再保险领导关系通过与 Munich Re 及 Hartford Steam
              Boiler（HSB）的高管紧密协同维持。最终收购协议签署后，At-Bay 的高管团队和约 280 名核心员工将转入 HSB 旗下的自主业务部门，确保领导层延续，同时把机构风险监督转交给 Munich Re
              Specialty。
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO012
      - number: '1.3'
        title: 融资历程与 Munich Re 收购
        blocks:
          - type: paragraph
            body: >-
              从 2016 年成立到 2021 年末，At-Bay 在机构风险投资轮次中筹集约 $292 million 至 $296 million 股权资本，主要投资者包括 Lightspeed Venture
              Partners、Khosla Ventures、Microsoft 的 M12、Qumra Capital 和 Munich Re Ventures。2021 年 7 月，公司凭借 $185 million 的
              Series D 融资跻身独角兽，投后估值达到 $1.35 billion。2026 年 8 月 19 日，Munich Re 宣布以全现金交易收购 At-Bay，企业价值为 $575
              million。该交易为早期股东和员工带来成功的流动性退出，但相对融资高峰期估值的 57%
              折价，也反映出零利率时代后私募市场科技公司倍数的剧烈重估。收购前，公司还进行了有针对性的企业重组，包括裁减以色列研发团队，以在交易执行前优化运营成本结构。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO010
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO012
      - number: '1.4'
        title: 公司里程碑与战略轨迹
        blocks:
          - type: paragraph
            body: >-
              At-Bay 的运营轨迹展示了网络保险科技行业如何从早期依赖承保能力的分销模式，走向资产负债表与软件垂直整合。2023
              年初，公司收购一家获准经营的超额及盈余险种保险承运商，从而可以直接用自己的保险资质承保商业保单。2023 年 4 月，At-Bay Stance
              上线，通过把自动端点漏洞扫描、威胁咨询和托管检测与响应（MDR）打包成标准保单持有人福利，正式确立公司的 InsurSec 定位。到 2025 年末，At-Bay 产生 $278 million 毛承保保费和
              $23 million 的经常性网络安全服务费收入。预计 2027 年初完成监管交割的 Munich Re 收购，将十年的合作推向终点：At-Bay 由软件驱动的承保引擎将直接嵌入全球资产负债表再保险基础设施。
