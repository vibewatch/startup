  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              At-Bay 的核心投资论点是 InsurSec 模式：把网络保险保单、主动漏洞扫描，以及通过 At-Bay Stance 提供的自研托管检测与响应结合起来。 这套双重方案已经显现商业势头：保费规模达到 $278
              million，覆盖约 40,000 名活跃保单持有人；独立网络安全服务费收入也超过 $30 million。 管理层相较同业保持了资本纪律，七轮机构融资累计筹资不足 $300
              million，使所有投资者和员工股权持有人都能在 $575 million 的 Munich Re 收购中获得正回报。 反论点则指出，管理一家由风险投资支持、并将 85% 保险风险让渡给第三方资产负债表的网络险
              MGA，存在严重的结构性压缩。尽管保费自 2021 年增长六倍， 企业价值仍较 $1.35 billion 峰值下跌 57%，说明公开市场和战略买家只按个位数低位保费倍数给 MGA
              佣金流和混合型网络软件定价，而非按高软件估值定价。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
      - number: '8.2'
        title: 融资历史与倍数重置
        blocks:
          - type: paragraph
            body: >-
              At-Bay 在 2016 年成立至 2022 年间通过股权融资筹得约 $292 million 至 $296 million，并在 2021 年 10 月 D 轮融资时达到 $1.35 billion
              的投后估值。在那轮融资高峰期，私募市场按其滚动收入年化值的 8.4x 倍数为 At-Bay 估值。到 2026 年 8 月，Munich Re Group 同意以 $575 million 企业价值全现金收购
              At-Bay，计划在 2027 年第一季度完成，前提是取得惯常监管批准。按 2025 年 $278 million 的毛保费计算， 这笔交易给 At-Bay 的定价约为 2.0x，构成剧烈的倍数重置。CEO
              Rotem Iram 承认宏观环境已经重估：零利率时期的倍数让位于现金创造基本面指标； 他同时强调，累计融资之外还有 $300 million 净新增资本进入公司，确保各类资本提供方和留任员工都能取得盈利结果。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV011
      - number: '8.3'
        title: 情景分析与退出机制
        blocks:
          - type: paragraph
            body: >-
              在收购最终协议已经签署的情况下，At-Bay 的回报分布主要取决于交易执行，而不是长期独立经营预测。基准情景的概率为 85%：Munich Re 在 2027 年第一季度 顺利完成交易，将 At-Bay 纳入
              Hartford Steam Boiler 专业部门。公司将获得 $575 million 现金对价，实现有序退出，隔离 At-Bay 所承受的独立资本市场压力。 乐观情景的概率为
              10%，设想交易重新谈判或第三方出价更高；届时独立经营的 GWP 超过 $400 million，网络安全 ARR 翻倍至 $60 million，企业估值超过 $1.0 billion。悲观情景的概率为
              5%，考虑意外反垄断或监管干预，或交割前发生系统性灾难性网络事件，触发低于 $350 million 的重大不利变化重谈。 在所有情景下，At-Bay 仅保留 15%
              风险的结构都能缓冲资产负债表下行风险，但退出价值仍取决于产业合作伙伴是否愿意推进。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
