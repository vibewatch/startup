              - CV005
              - CV006
              - CV011
      - number: '8.4'
        title: 尽调问题与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              At-Bay 正处于交易交割前的最终窗口，二级市场投资者和剩余利益相关方应优先核实交易完成风险及资本化清算瀑布，而不是照搬常规 SaaS 运营指标。
              首要尽调问题包括：审计最终合并协议中的交割条件、美国和以色列的监管申报，以及与损失准备金发展挂钩的潜在价格调整机制。此外，还需确认 $575 million 收购价在 A 轮至 D
              轮清算优先权层级中的精确分配，以核实普通股和管理层留任分配。关键论点失效触发条件包括：第一，州保险专员或国际监管机构 发起监管挑战，或长期延迟使交割拖至 2027 年年中之后；第二，融入 Hartford
              Steam Boiler 前高级管理人员离职；第三，At-Bay 非认可 SMB 组合的损失率 大幅恶化，危及再保险合作的持续性。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV011
              - CV013
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 估值重置与战略整合现实
            body: >-
              At-Bay 以 $575 million 出售给 Munich Re，较其 2021 年 $1.35 billion 峰值估值折损 57%，凸显独立网络保险科技倍数的结构性上限。 交易带来有序退出，也验证了
              At-Bay 的 InsurSec 技术，但其企业倍数已从超过 8x 收入压缩至 2.0x 毛保费。
            calloutType: risk
            claimRefs:
              - CV001
              - CV005
              - CV006
          - type: callout
            title: 再保险承保能力与产业协同
            body: >-
              At-Bay 只保留 15% 的承保风险、将 85% 转给保险承运方，因此其本质是技术驱动的分销和 MGA 引擎，而非承担资产负债表风险的承运方。 直接并入 Munich Re 的 HSB
              部门后，条约续期波动将消失，资产负债表也得到永久支持。
            calloutType: insight
            claimRefs:
              - CV002
              - CV011
