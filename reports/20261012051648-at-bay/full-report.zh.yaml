          label: 规模基础
          description: 2025 年毛保费达到 $278M，覆盖约 40,000 名 SMB 保单持有人。
          tone: positive
        - id: security-expansion
          label: 安全软件引擎
          description: 截至 2024 年底，At-Bay Stance MDR 的费用收入超过 $30M，客户数达到 7,500 家。
          tone: positive
        - id: reinsurance-structure
          label: 再保险依赖
          description: 资产负债表仅保留 15% 的风险，将 85% 分出给 Munich Re 及承保合作伙伴。
          tone: neutral
        - id: valuation-reset
          label: 估值重置
          description: 估值从 2021 年 $1.35B 的峰值压缩 57%，至 2026 年企业价值 $575M。
          tone: negative
        - id: multiple-compression
          label: 倍数回归现实
          description: 倍数从收入的 8.4x 压缩至 GWP 的 2.0x，反映保险科技行业的基本面重置。
          tone: neutral
        - id: recommendation-outcome
          label: 最终立场：持有 / 继续研究
          description: 等待 Q1 2027 完成交割期间持有二级市场头寸；需要审计资本表中的优先权条款。
          tone: neutral
      edges:
        - from: scale-foundation
          to: security-expansion
          label: 支持交叉销售
        - from: security-expansion
          to: reinsurance-structure
          label: 缓释承保风险
        - from: reinsurance-structure
          to: valuation-reset
          label: 限制 MGA 倍数
        - from: valuation-reset
          to: multiple-compression
          label: 市场重新定价
        - from: multiple-compression
          to: recommendation-outcome
          label: 为决策提供依据
