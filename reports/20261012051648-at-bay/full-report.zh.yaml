      - number: '3.2'
        title: 能力与架构差异：捆绑式 InsurSec 与点解决方案
        blocks:
          - type: paragraph
            body: >-
              At-Bay 的主要产品差异在于专有 InsurSec 架构，核心是 At-Bay Stance。At-Bay Stance 于 2023 年 4 月上线，把自动漏洞扫描、暗网凭证监控、AI
              驱动的邮件欺诈预警、虚拟 CISO 咨询和事件响应整合进端到端风险管理流程。At-Bay 声称，这些嵌入式风险缓解能力每张保单每年价值最高可达
              $70,000，直接应对中小企业面临的网络安全人才和工具短缺。此外，At-Bay 还运营内部数字取证与事件响应（DFIR）团队；传统保险公司往往把泄露事件分诊外包给分散的第三方面板。

              但产品范围对比也显示出细微的运营取舍。基础漏洞扫描嵌入所有核心保单，而 At-Bay 面向端点和邮件的托管检测与响应（MDR）服务则是可选附加项，需要额外订阅费。Forbes 报道称，At-Bay 的 MDR
              客户数从 2023 年不足 1,000 家增至 2024 年末的 7,500 家，显示出强劲商业势头，但也确认 MDR 尚未覆盖约 40,000 名保单持有人的全部群体。相比之下，Coalition 通过
              Coalition Control 为所有保单持有人提供基础告警，同时以 Wirespeed MDR 提供更深度的遏制能力。与 CrowdStrike 或 SentinelOne
