            body: >-
              At-Bay 的商业收入由两台引擎驱动：基础及超额网络保险保费，以及高毛利网络安全软件服务费。2025 财年，公司商业险种产生 $278 million 毛承保保费，同时获得 $23 million
              网络安全服务费收入。核心保险产品包括 Cyber、Technology Errors and Omissions（Tech E&O）和 Miscellaneous Professional
              Liability（MPL），全部通过 At-Bay 自动化经纪人平台，经批发和零售保险经纪人分销。独立网络险和 Tech E&O 保单根据外部漏洞扫描和自动化风险模型动态定价。网络安全软件引擎以 At-Bay
              Stance 为核心，捆绑持续暴露管理、安全意识培训和托管检测与响应（MDR）。基础暴露管理嵌入基础超额及盈余险种保单，而独立暴露平台的市场标价通常超过每年 $5,000。更先进的安全能力，尤其是 At-Bay
              Stance MDR，则通过 Core、Advanced 和 Complete 三个层级提供，另收订阅费。付费 MDR 客户从 2023 年不足 1,000 家迅速增至 2024 年末的 7,500 家，说明
              InsurSec 打包策略在承保规模之外，确实创造了第二条经常性软件收入流。
