              - CR008
              - CR012
              - CR015
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 再保险承保能力与并购整合瓶颈
            body: >-
              At-Bay 的整个商业模式都依赖 Munich Re 旗下 HSB 的 A++ 评级再保险承保能力。已宣布的 $575 million 收购会永久稳定这项承保能力， 但也让公司在 2027
              年第一季度前暴露于交割条件风险，并将 At-Bay 锁定在 Munich Re 的治理体系和专业保险路线图中。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR013
          - type: callout
            title: 估值折损凸显保险科技的现实，而非独角兽倍数
            body: At-Bay 的估值从 2021 年 $1.35 billion 的峰值降至全现金 $575 million 交易，反映出行业整体倍数压缩：收购价值跟随现金创造和承保基本面， 而不再跟随投机性风险投资溢价。
            calloutType: insight
