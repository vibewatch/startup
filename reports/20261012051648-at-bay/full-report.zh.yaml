      - number: '4.4'
        title: 资本充足性、战略并购退出与尽调结论
        blocks:
          - type: paragraph
            body: >-
              At-Bay 的融资轨迹凸显了独立网络保险科技公司面临的结构性资本障碍。公司累计筹集约 $292 million 至 $296 million 风险投资，并在 2021 年 10 月 Series D
              追加融资后达到 $1.35 billion 的最高投后估值；随后面对收紧的私募股权环境和不断上升的再保险成本。2026 年 8 月，Munich Re Group 宣布以全现金交易收购 At-Bay，企业价值为
              $575 million。交易有待监管批准，预计 2027 年初完成；按 2025 年毛承保保费计算，At-Bay 估值约为 2.0x。这个价格较 2021 年估值水平收缩约
              57%，对后期风险投资者而言形成了下行轮式收购结果。虽然这笔交易让 Munich Re 专业业务旗下的 Hartford Steam Boiler 获得来自超过 100,000
              个保单年度的专有网络遥测，但也凸显出高资本密度、资产负债表暴露和私募市场估值重置最终限制了 At-Bay 作为独立风险投资支持承保平台的可行性。
            claimRefs:
              - CI001
