figures:
  - id: FU001
    title: 'Customer journey map: InsurSec adoption and security expansion'
    type: journey-map
    summary: Visual map of the six-stage customer lifecycle from broker quoting and automated vulnerability scanning to policy binding, proactive monitoring, claims response, and security cross-sell.
    approximationNotes: Lifecycle stages synthesize documented broker onboarding workflows, At-Bay Stance service tiers, and customer claims support protocols.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU014
    data:
      items:
        - label: 1. Broker Sourcing & Application
          touchpoints:
            - Broker submits business details via online At-Bay Broker Platform
            - Initial appetite check across Cyber, Tech E&O, and MPL lines
        - label: 2. Underwriting & Risk Scanning
          touchpoints:
            - Automated external attack-surface scan evaluates open ports and vulnerabilities
            - Underwriting screening identifies required security prerequisite fixes
        - label: 3. Policy Binding & Baseline Setup
          touchpoints:
            - Broker quotes and binds coverage backed by A++ rated Munich Re/HSB paper
            - 'Core security features activated: vulnerability monitoring and email-fraud alerts'
        - label: 4. Continuous Risk Monitoring
          touchpoints:
            - Ongoing dark-web tracking and automated security notifications sent to insured
            - vCISO security advisory available for proactive remediation guidance
        - label: 5. Incident Response & Claims Handling
          touchpoints:
            - Rapid digital forensics and incident response deployed upon covered cyber event
            - Claims team provides direct coordination and loss mitigation
        - label: 6. Security Expansion & Renewal
          touchpoints:
            - Annual policy renewal evaluated alongside historical security posture
            - Upsell to Advanced and Complete tiers with 24/7 endpoint MDR monitoring
callouts:
  - calloutType: insight
    title: The Broker-Mediated InsurSec Distribution Paradox
    body: 'While At-Bay''s InsurSec model differentiates it from conventional cyber insurers by packaging proactive security monitoring with coverage, its customer acquisition remains heavily mediated by traditional insurance brokers. This broker-centric channel insulates At-Bay from direct consumer marketing costs and yields high broker satisfaction (93 NPS), but it also introduces intermediation friction: brokers must actively communicate technical security requirements to buyers, and At-Bay lacks a direct enterprise sales motion for stand-alone security offerings.'
    claimRefs:
      - CU001
      - CU010
      - CU011
  - calloutType: risk
    title: Underwriting Control Hurdles and Applicant Attrition
    body: Independent analysis from Kinro highlights that At-Bay's specialized underwriting model requires prospective insureds to demonstrate specific cybersecurity baseline controls before binding. While this screening reduces loss frequency, it naturally limits market expansion by turning away higher-hazard SMBs or applicants lacking dedicated IT staff, creating an adverse selection tradeoff between underwriting discipline and total addressable customer growth.
    claimRefs:
      - CU007
      - CU013
      - CU014
