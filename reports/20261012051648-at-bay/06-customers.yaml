company:
  name: At-Bay
chapter:
  number: 6
  title: Customers
  summary: At-Bay serves small and medium-sized enterprises in the United States, expanding its commercial cyber insurance footprint from 30,000 policyholders in 2022 to over 40,000 in Munich Re disclosures and 53,000 in Forbes estimates. The company distributes almost entirely through independent insurance brokers via its proprietary digital portal, achieving a reported 93 NPS among brokers while leveraging active vulnerability scanning to manage risk. However, commercial adoption remains tempered by strict underwriting control prerequisites, lack of public cohort retention data, and high dependence on intermediary broker relationships.
sections:
  - id: customer-segmentation-and-profile
    title: Customer Segmentation and Core Target Profiles
    body: At-Bay concentrates its commercial insurance underwriting on small-to-medium enterprises (SMBs) and mid-market organizations across the United States. Its core offering combines surplus-lines cyber insurance with Technology Errors and Omissions (Tech E&O) and Miscellaneous Professional Liability (MPL). Company public disclosures report that At-Bay protects more than 35,000 policyholders spanning over 100 industry sectors, collectively safeguarding over $800 billion in annual commercial revenue. Target customers typically possess between $1 million and $250 million in annual gross revenue—a market segment where 98% of historical cyber insurance claims originate according to industry research, but where organizations frequently lack dedicated in-house cybersecurity staff or full-time security operations centers. To serve this demographic effectively, At-Bay packages insurance coverage with tiered proactive security services branded as At-Bay Stance, ranging from baseline vulnerability scanning to active managed detection and response.
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU009
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-scale
    title: Adoption Trajectory and Policyholder Scale
    body: 'Commercial policyholder growth demonstrates steady expansion across both insurance coverage lines and value-added software security products. Public evidence documents an increase from 30,000 policyholders in late 2022 to 35,000 on At-Bay''s official marketing surfaces, close to 40,000 businesses referenced in Munich Re''s August 2026 acquisition announcement, and more than 53,000 small and midsize businesses reported in Forbes financial profiles as of March 2026. Alongside policyholder growth, Insurance Journal reported in August 2026 that At-Bay commands $278 million in gross written premiums while employing approximately 280 staff across the United States and Israel. In parallel with primary insurance lines, At-Bay demonstrated measurable traction in cross-selling security software: its paid Managed Detection and Response (MDR) add-on scaled from fewer than 1,000 customers in 2023 to 7,500 customers by year-end 2024, demonstrating that a meaningful subset of policyholders will purchase recurring security services directly through their cyber insurer.'
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU008
    tableRefs:
      - TU002
  - id: named-customer-evidence-and-broker-feedback
    title: Customer Deployments, Broker Evidence, and Claims Proof
    body: Because commercial cyber insurance policyholders and SMB insureds generally require confidentiality regarding their digital risk posture and security incidents, verified customer proof is predominantly mediated through broker partners and published claims testimonials. Commercial distribution is executed through independent retail and wholesale insurance brokers who utilize the automated At-Bay Broker Platform for quoting, underwriting customization, and binding. Broker feedback published on company channels indicates high intermediary satisfaction, highlighted by a self-reported Net Promoter Score (NPS) of 93 and testimonials emphasizing rapid claims turnaround and technical underwriting accessibility. Commercial case studies illustrate production deployments across technology providers, professional service firms, and mid-market enterprises that utilize At-Bay's vulnerability notifications to remediate critical security exposures prior to potential ransomware exploitation.
    claimRefs:
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU003
  - id: customer-lifecycle-retention-and-expansion
    title: Customer Lifecycle, Retention Dynamics, and Channel Dependencies
    body: The customer adoption lifecycle integrates automated external risk assessment with broker placement and continuous policyholder engagement. Prior to binding, At-Bay conducts external attack-surface scans to identify security vulnerabilities, requiring applicants to address severe vulnerabilities or open ports before securing coverage. While this proactive discipline protects underwriting loss ratios, independent analysis from Kinro notes that it creates procurement friction and eliminates applicants that cannot satisfy technical requirements. Post-binding, At-Bay maintains contact through automated dark-web alerts and vulnerability notices, creating natural touchpoints for upselling Advanced and Complete Stance tiers featuring 24/7 endpoint MDR monitoring. Nonetheless, long-term customer durability remains clouded by the absence of publicly disclosed Net Revenue Retention (NRR) or cohort renewal rates, leaving At-Bay vulnerable to broker portfolio churn when competing specialty carriers offer looser underwriting terms.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU013
      - CU014
    figureRefs:
      - FU001
