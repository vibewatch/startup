      - number: '4.4'
        title: Capital Adequacy, Strategic M&A Exit, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              At-Bay's financing trajectory highlights the structural capital hurdles confronting standalone cyber
              insurtechs. After raising approximately $292 million to $296 million in total venture capital and reaching
              a peak post-money valuation of $1.35 billion following its Series D extension in October 2021, the company
              faced a tightening private equity climate and rising reinsurance costs. In August 2026, Munich Re Group
              announced a definitive agreement to acquire At-Bay in an all-cash transaction for an enterprise value of
              $575 million. The transaction, slated to close in early 2027 pending regulatory approvals, values At-Bay
              at roughly 2.0x 2025 gross written premiums. This price represents an approximate 57% contraction from its
              2021 valuation mark, crystallizing a down-round acquisition outcome for later-stage venture investors.
              While the deal provides Munich Re's specialty arm, Hartford Steam Boiler, with proprietary cyber telemetry
              from more than 100,000 policy years, it underscores that high capital intensity, balance-sheet exposure,
              and private market valuation resets ultimately constrained At-Bay's viability as an independent
              venture-backed underwriting platform.
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
