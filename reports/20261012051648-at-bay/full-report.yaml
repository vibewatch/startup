            title: The Broker-Mediated InsurSec Distribution Paradox
            body: >-
              While At-Bay's InsurSec model differentiates it from conventional cyber insurers by packaging proactive
              security monitoring with coverage, its customer acquisition remains heavily mediated by traditional
              insurance brokers. This broker-centric channel insulates At-Bay from direct consumer marketing costs and
              yields high broker satisfaction (93 NPS), but it also introduces intermediation friction: brokers must
              actively communicate technical security requirements to buyers, and At-Bay lacks a direct enterprise sales
              motion for stand-alone security offerings.
            calloutType: insight
            claimRefs:
