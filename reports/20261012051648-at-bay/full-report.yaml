      - number: '4.2'
        title: Broker Distribution Mechanics and Value Conversion
        blocks:
          - type: paragraph
            body: >-
              At-Bay's go-to-market motion relies on an indirect, broker-led distribution model rather than
              direct-to-consumer sales. By providing automated risk assessments, rapid quote turnarounds, and specimen
              coverage forms through its proprietary broker platform, At-Bay integrates into regional and national
              brokerage workflows. This distribution footprint enables At-Bay to safeguard up to $800 billion in
              collective business revenue across nearly 40,000 policyholders in more than 100 industries. When a broker
              submits an SMB or middle-market risk, At-Bay executes an external security scan that informs dynamic
              policy pricing and terms. Upon binding, policy premiums convert into gross written premiums, but At-Bay
              operates as a hybrid managing general underwriter (MGU) and full carrier via At-Bay Specialty Insurance
              Company. Instead of absorbing the entirety of catastrophe and aggregation risk onto its own balance sheet,
              At-Bay transfers approximately 85% of insurance risk to established reinsurance and capacity partners,
              principally Munich Re and Hartford Steam Boiler (HSB), retaining 15% net risk. This structure allows
              At-Bay to scale premium throughput rapidly with an efficient organizational footprint of approximately 280
              employees, while monetizing policyholder relationships through both retained risk margin and high-margin
              security service add-ons.
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI008
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Cost Structure, Risk Retention, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Evaluating At-Bay's unit economics requires distinguishing between managing general underwriter
              commissions, carrier risk retention, and software delivery costs. By retaining only 15% of underwritten
              risk, At-Bay moderates statutory capital reserve requirements and insulates its balance sheet from
              catastrophic systemic ransomware aggregation. Prior reporting indicated that At-Bay generated more than
              $110 million in net revenue and $301 million in gross insurance premiums during 2023, while maintaining
              underwriting loss ratios significantly below legacy peers due to pre-breach vulnerability remediation.
              However, consolidated GAAP profitability, operating burn rates, and gross margin splits between insurance
              administration and software engineering remain closely guarded private data. Critical sales efficiency
              proxies, including cohort-level customer acquisition costs (CAC), broker commission concessions, and net
              revenue retention (NRR) across SMB cohorts, have not been publicly disclosed. While active risk monitoring
              helps prevent loss frequency, service delivery costs for dedicated managed detection and response (MDR)
              teams represent an ongoing operational expenditure that differs fundamentally from pure software margin
              profiles.
            claimRefs:
