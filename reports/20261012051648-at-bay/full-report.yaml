      - number: '8.3'
        title: Scenario Analysis and Exit Mechanics
        blocks:
          - type: paragraph
            body: >-
              With a signed definitive acquisition agreement, At-Bay's return distribution is dominated by transaction
              execution rather than long-term independent operating forecasts. In the base case (assigned an 85%
              probability), Munich Re successfully completes the transaction in the first quarter of 2027, absorbing
              At-Bay into its Hartford Steam Boiler specialty division. This delivers $575 million in cash
              consideration, establishing an orderly exit that insulates At-Bay from standalone capital market
              pressures. The bull case (10% probability) envisions transaction renegotiation or third-party overbidding,
              where standalone GWP scales past $400 million and cybersecurity ARR doubles to $60 million, commanding an
              enterprise valuation exceeding $1.0 billion. The bear case (5% probability) considers unexpected antitrust
              or regulatory intervention, or a systemic catastrophic cyber event prior to closing that triggers a
              material adverse change renegotiation below $350 million. In all cases, At-Bay's 15% risk retention
              structure cushions balance-sheet downside while tethering exit value to industrial partner willingness.
            claimRefs:
