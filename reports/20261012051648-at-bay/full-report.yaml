        title: InsurSec Technical Architecture and Stance Platform
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiator of At-Bay's InsurSec architecture is the At-Bay Stance platform, which
              combines external threat intelligence with automated policyholder security workflows. Central to this
              architecture is the At-Bay Stance Exposure Manager, a purpose-built software system that continuously
              inventories client digital assets, executes non-intrusive external perimeter vulnerability scans, and
              prioritizes discovered Common Vulnerabilities and Exposures (CVEs) against real-world exploit activity. To
              combat business email compromise (BEC), which represents the primary driver of commercial fraud claims,
              At-Bay integrates Sublime Security's agentic detection engine into its managed email security stack.
              Sublime's distributed detection logic evaluates message linguistics and social engineering patterns across
              incoming communications. Telemetry generated across endpoint, email, identity, and cloud monitoring feeds
              into At-Bay's managed detection and response (MDR) pipeline, creating a bidirectional feedback mechanism
              between digital forensics incident response (DFIR) findings and automated underwriting risk models.
