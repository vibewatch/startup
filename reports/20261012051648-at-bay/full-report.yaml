  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Core Target Profiles
        blocks:
          - type: paragraph
            body: >-
              At-Bay concentrates its commercial insurance underwriting on small-to-medium enterprises (SMBs) and
              mid-market organizations across the United States. Its core offering combines surplus-lines cyber
              insurance with Technology Errors and Omissions (Tech E&O) and Miscellaneous Professional Liability (MPL).
              Company public disclosures report that At-Bay protects more than 35,000 policyholders spanning over 100
              industry sectors, collectively safeguarding over $800 billion in annual commercial revenue. Target
              customers typically possess between $1 million and $250 million in annual gross revenue—a market segment
              where 98% of historical cyber insurance claims originate according to industry research, but where
              organizations frequently lack dedicated in-house cybersecurity staff or full-time security operations
              centers. To serve this demographic effectively, At-Bay packages insurance coverage with tiered proactive
              security services branded as At-Bay Stance, ranging from baseline vulnerability scanning to active managed
              detection and response.
