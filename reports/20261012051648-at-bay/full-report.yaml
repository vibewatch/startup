      - number: '7.2'
        title: Operational Execution, Threat Evolution, and Security Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              The core thesis of InsurSec relies on active cybersecurity risk mitigation to suppress claims frequency
              and loss severity relative to traditional cyber insurance carriers. At-Bay deploys its proprietary At-Bay
              Stance platform to conduct continuous external vulnerability scanning, threat monitoring, and managed
              detection and response across policyholder environments. However, operational risks persist as threat
              actors shift toward sophisticated social engineering, business email compromise, and multi-extortion
              ransomware campaigns. Industry claims reports indicate that ransomware severity reached an average of
              $500,000 in 2024, while At-Bay leadership acknowledged an estimated 30% increase in successful email fraud
              scams across commercial accounts. In addition, At-Bay underwent workforce restructuring by laying off 25
              Israeli research and development employees to accelerate profitability prior to the sale. Sustaining rapid
              security tool innovation and 24/7 incident response readiness following head-count reductions represents a
              crucial operational test, particularly as competitors like Coalition and Cowbell advance predictive risk
              algorithms.
