            title: Valuation Reset and Strategic Absorption
            body: >-
              At-Bay's $575 million acquisition agreement with Munich Re represents a significant valuation contraction
              from its $1.35 billion Series D valuation in 2021, illustrating how capital intensity and reinsurance
              dependency in cyber insurtech can force a strategic sale even amid substantial premium volume.
            calloutType: insight
            claimRefs:
