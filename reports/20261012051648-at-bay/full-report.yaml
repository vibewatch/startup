              - CP004
              - CP005
              - CP006
              - CP013
      - number: '3.2'
        title: 'Capability and Architectural Differentiation: Bundled InsurSec vs. Point Solutions'
        blocks:
          - type: paragraph
            body: >-
              At-Bay's primary product differentiation centers on its proprietary InsurSec architecture, anchored by
              At-Bay Stance. Launched in April 2023, At-Bay Stance unifies automated vulnerability scanning, dark web
              credential monitoring, AI-driven email fraud alerts, virtual CISO advisory, and incident response into an
              end-to-end risk management workflow. At-Bay claims these embedded risk mitigation capabilities represent
              up to $70,000 in annual value per policy, directly addressing the acute cybersecurity talent and tooling
              shortage facing small and mid-sized enterprises. Furthermore, At-Bay operates an in-house Digital
              Forensics and Incident Response (DFIR) unit, contrasting with legacy insurers that outsource breach triage
              to fragmented third-party panels.


              However, product scope comparisons reveal nuanced operational tradeoffs. While basic vulnerability
              scanning is embedded into all core policies, At-Bay's managed detection and response (MDR) services for
              endpoints and email are structured as optional add-ons that carry incremental subscription costs. Forbes
              reported that At-Bay's MDR customer count expanded from under 1,000 clients in 2023 to 7,500 by year-end
              2024, demonstrating strong commercial momentum but confirming that MDR is not yet universal across its
              roughly 40,000 policyholders. By comparison, Coalition provides baseline alerting across all policyholders
              via Coalition Control while offering Wirespeed MDR for deeper containment. Relative to pure-play
              cybersecurity vendors like CrowdStrike or SentinelOne, At-Bay offers an integrated financial safety net
              that software vendors cannot match, but its detection telemetry depth remains tied to partner sensor
              integrations rather than a proprietary endpoint agent ecosystem.
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
      - number: '3.3'
        title: Pricing Opacity, Packaging Architecture, and Broker Distribution Moats
        blocks:
          - type: paragraph
            body: >-
              Commercial cyber insurance exhibits significant pricing opacity across all major providers. Neither
              At-Bay, Coalition, Cowbell, nor Resilience publishes standard pricing tables; premiums are dynamically
              determined by policy limits, industry hazard class, annual revenue, and automated attack surface scan
              results. At-Bay packages its coverage across three structured tiers—Core, Advanced, and Complete—bundling
              routine external scanning and vCISO consultations while gating full-scale 24/7 endpoint MDR behind paid
              upgrades. To incentivize risk reduction, At-Bay provides premium credits and enhanced terms for
              policyholders that adopt recommended security controls, aligning buyer incentives with underwriting
              profitability.


              Distribution represents a critical competitive battleground and defensibility moat. Unlike consumer
              insurtechs attempting direct-to-business models, At-Bay relies overwhelmingly on appointed independent
              retail and wholesale insurance brokers across all 50 states. The company has invested heavily in digital
              broker enablement, delivering rapid automated quotes and underwriting decisions that have garnered an
              exceptional 93 Net Promoter Score (NPS) among broker partners. This broker loyalty creates a formidable
              barrier to entry against pure software vendors and newer insurtech entrants. However, because commercial
              insurance policies are typically written on standard one-year surplus lines terms, account retention
              remains subject to annual market shopping, leaving At-Bay vulnerable if competing MGAs offer aggressive
              pricing or higher broker commission schedules.
            claimRefs:
              - CP001
              - CP010
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP005
              - CP010
              - CP011
              - CP014
      - number: '3.4'
        title: Moat Durability, Capacity Stability, and Strategic Acquisition Dynamics
        blocks:
          - type: paragraph
            body: >-
              The long-term durability of At-Bay's competitive moat has been substantially reshaped by Munich Re Group's
              August 2026 agreement to acquire the company. As an independent MGA, At-Bay historically faced structural
              capacity exposure: while managing underwriting and security software, it relied on external carrier paper,
              retaining roughly 15% of net risk while ceding the remainder to reinsurance partners led by Munich Re's
              Hartford Steam Boiler (HSB). Integrating fully into Munich Re Specialty permanently stabilizes At-Bay's
              underwriting capacity, backing its policies with an A++ (Superior) balance sheet that eliminates the
              carrier-flight risk that frequently threatens independent MGAs.


              Nevertheless, competitive pressures remain acute across multiple vectors. In the upper middle market,
              Resilience continues to gain ground among CFOs and enterprise risk managers through quantitative financial
              modeling that appeals to executive buyers. Meanwhile, Coalition's broader product portfolio—encompassing
              management liability, Tech E&O, and specialized coverage—provides greater multi-line bundling power across
              commercial brokerages. Furthermore, as legacy carriers gradually modernize their underwriting tech stacks
              and partner with commercial MSSPs, the technological gap between insurtech MGAs and incumbent giants will
              narrow. At-Bay's enduring defensibility will depend on whether its combined InsurSec platform can
              continuously prove superior loss-ratio outperformance, transforming security software from an underwriting
              feature into an indispensable operational workflow.
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP007
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The InsurSec Convergence: Transforming Cyber Underwriting Into Security Operations'
            body: >-
              Specialized cyber MGAs like At-Bay, Coalition, and Resilience demonstrate that passive risk transfer is
              economically unviable in high-frequency cyber environments. By building proprietary exposure scanning and
              in-house managed detection and response, these players replace periodic static questionnaires with
              continuous risk mitigation, seeking structurally lower loss ratios than legacy commercial carriers.
            calloutType: insight
            claimRefs:
              - CP005
              - CP009
              - CP013
          - type: callout
            title: Pricing Opacity and Broker-Mediated Switching Frictions
            body: >-
              Because neither At-Bay nor its primary peers publish flat pricing, buyers remain dependent on wholesale
              broker negotiations and opaque risk ratings. While annual policy renewals facilitate carrier shopping, the
              operational friction of unwinding installed MDR agents and re-configuring exposure telemetry creates
              meaningful switching barriers for active policyholders.
            calloutType: risk
            claimRefs:
              - CP001
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Model
        blocks:
          - type: paragraph
            body: >-
              At-Bay structures its commercial revenue across two distinct engines: primary and excess cyber insurance
              premiums and high-margin cybersecurity software service fees. In the 2025 financial year, At-Bay generated
              $278 million in gross written premiums across its commercial lines, alongside $23 million in cybersecurity
              fee service revenue. The core insurance offering spans Cyber, Technology Errors and Omissions (Tech E&O),
              and Miscellaneous Professional Liability (MPL), distributed exclusively through wholesale and retail
              insurance brokers via At-Bay's automated broker platform. Standalone cyber and Tech E&O policies are
              dynamically priced based on external vulnerability scans and automated risk models. The cybersecurity
              software engine is anchored by At-Bay Stance, which bundles continuous exposure management, security
              awareness, and managed detection and response (MDR). While base exposure management is embedded into
              primary surplus policies, standalone exposure platforms typically command market list prices exceeding
              $5,000 annually. Advanced security capabilities, notably At-Bay Stance MDR, are offered across Core,
              Advanced, and Complete tiers for additional subscription fees. Paid MDR customer adoption accelerated
              rapidly from fewer than 1,000 accounts in 2023 to 7,500 by year-end 2024, demonstrating that the InsurSec
              bundling strategy creates a genuine secondary recurring software revenue stream alongside underwriting
              volume.
            claimRefs:
              - CI002
              - CI003
              - CI006
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI002
