  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Approvals, Licensing Framework, and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              At-Bay operates within a highly regulated insurance framework, functioning as a managing general agent and
              surplus-lines broker licensed across all 50 U.S. states. The company fortified its regulatory posture in
              January 2023 by acquiring At-Bay Specialty Insurance Company from XL Insurance America, establishing
              own-paper underwriting capability for eligible cyber and Technology E&O lines alongside its primary
              partnership with Munich Re's Hartford Steam Boiler (HSB). The paramount near-term regulatory milestone is
              obtaining multi-state insurance department clearances and antitrust approvals for Munich Re Group's
              announced $575 million all-cash acquisition of At-Bay. With transaction closing targeted for the first
              quarter of 2027, any regulatory delay or restructuring of operating covenants represents an immediate
              transactional risk. Furthermore, ongoing compliance with state surplus lines tax filings, non-admitted
              carrier regulations, and expanding state privacy mandates requires active legal supervision to prevent
              operational friction or licensing sanctions.
            claimRefs:
