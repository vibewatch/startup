            title: Underwriting Control Hurdles and Applicant Attrition
            body: >-
              Independent analysis from Kinro highlights that At-Bay's specialized underwriting model requires
              prospective insureds to demonstrate specific cybersecurity baseline controls before binding. While this
              screening reduces loss frequency, it naturally limits market expansion by turning away higher-hazard SMBs
              or applicants lacking dedicated IT staff, creating an adverse selection tradeoff between underwriting
              discipline and total addressable customer growth.
            calloutType: risk
