  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Overview and Commercial Insurance Portfolio
        blocks:
          - type: paragraph
            body: >-
              At-Bay structures its commercial product portfolio around specialty property and casualty coverage
              tailored for small and mid-market enterprises navigating digital risks. Its core commercial insurance
              lines encompass primary and excess cyber insurance, standalone technology errors and omissions (Tech E&O),
              and miscellaneous professional liability (MPL). The company distributes these specialty coverages through
              licensed independent wholesale and retail insurance brokers utilizing the At-Bay Broker Platform. Rather
              than offering standalone unbundled risk transfer, At-Bay packages its insurance coverage with security
              capabilities categorized into Core, Advanced, and Complete tiers. Under this InsurSec framework, eligible
              policyholders obtain integrated vulnerability monitoring, employee awareness training, and virtual CISO
              advisory services alongside financial risk indemnification. The commercial product suite addresses both
              third-party liability from data breaches and direct losses stemming from system extortion, business
              interruption, and network failure.
