            body: >-
              At-Bay's acquisition at a $575 million enterprise value crystallizes a dramatic 57% valuation reset from
              the $1.35 billion peak valuation it attained during its 2021 Series D financing round. Although At-Bay
              scaled gross written premiums sixfold from $50 million in 2021 to approximately $280 million in 2025
              alongside over $30 million in cybersecurity fee revenue, the compression in venture multiples forced a
              transaction anchored on cash generation fundamentals rather than speculative tech valuations. Having
              raised approximately $300 million in lifetime venture equity, the sale provides a liquidity exit but
              highlights the financial limits of capital-intensive insurtech models that carry balance-sheet risk. The
              accompanying risk matrix synthesizes At-Bay's residual risk profile, illustrating that while M&A closing
              conditions and systemic ransomware aggregation carry material gross exposure, established mitigations
