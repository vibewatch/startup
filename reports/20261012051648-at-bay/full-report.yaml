      - number: '8.4'
        title: Diligence Asks and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Because At-Bay is in the definitive window preceding transaction closing, secondary market investors and
              remaining stakeholders must prioritize transaction completion risk and capitalization waterfall
              verification over routine SaaS operating benchmarks. Primary diligence asks include auditing the
              definitive merger agreement for closing conditions, regulatory filings in the United States and Israel,
              and potential price-adjustment mechanisms tied to loss reserve development. Additionally, diligence must
              confirm the exact allocation of the $575 million purchase price across Series A through Series D
              liquidation preference stacks to verify common stock and management retention distributions. Critical
              thesis-break triggers include: first, any regulatory challenge or prolonged delay from state insurance
              commissioners or international regulators extending closing past mid-2027; second, senior executive
              departures ahead of the integration into Hartford Steam Boiler; and third, adverse loss ratio spikes
              across At-Bay's non-admitted SMB portfolios that would jeopardize reinsurance partnership continuity.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV011
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Reset and Strategic Consolidation Reality
            body: >-
              At-Bay's agreed sale to Munich Re for $575 million represents a sharp 57% valuation haircut against its
              $1.35 billion 2021 peak, highlighting the structural limits of standalone cyber insurtech multiples. While
              the transaction delivers an orderly exit and validates At-Bay's InsurSec technology, it reflects an
              enterprise multiple compression from over 8x revenue down to 2.0x gross written premiums.
            calloutType: risk
            claimRefs:
