        title: Operating Infrastructure, Carrier Dependencies, and Risk Controls
        blocks:
          - type: paragraph
            body: >-
              At-Bay's hybrid operating model introduces critical dependencies across technical infrastructure, carrier
              paper, and specialized security partnerships. The company retains approximately 15% of underwritten
              insurance risk, ceding the remaining 85% to institutional reinsurance partners such as Munich Re's HSB
              Specialty Insurance Company. On the technical side, while foundational attack surface monitoring is
              bundled under an Embedded Security Fee endorsement, advanced 24/7 endpoint, email, identity, and cloud
              managed detection and response (MDR/MXDR) requires separate contractual fees through At-Bay Security LLC.
              Operationally, the MDR service depends on external security partnerships, including Sublime Security for
              email compromise analysis and third-party endpoint telemetry providers. A major diligence consideration is
              that At-Bay does not expose public software development kits, open-source repositories, or developer API
              documentation for its proprietary risk scoring engine, requiring private technical evaluation of
