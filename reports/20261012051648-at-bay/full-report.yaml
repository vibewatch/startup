      - number: '7.3'
        title: Underwriting Capacity, Reinsurance Concentration, and Channel Dependencies
        blocks:
          - type: paragraph
            body: >-
              At-Bay's business model exhibits substantial counterparty and capital dependency, historically relying on
              A++ rated capacity provided by Munich Re and HSB to write commercial cyber policies. Under its
              underwriting structure, At-Bay retains roughly 15% of the insurance risk on its balance sheet while ceding
              the remaining 85% to Munich Re and participating reinsurance syndicates. This high cession rate shields
              At-Bay from catastrophic loss clusters but creates acute dependence on reinsurance treaty renewal terms,
              quota-share commissions, and capacity availability. Munich Re's acquisition agreement directly mitigates
              long-term capacity flight risk by bringing At-Bay into HSB's Global Specialty Insurance division. On the
              commercial distribution front, At-Bay distributes exclusively through independent insurance brokers via
              its digital broker platform. While this channel enables rapid SMB market access, it concentrates
              distribution leverage among wholesale brokerages that also distribute competing policies from Coalition
              and Cowbell, exposing At-Bay to broker commission sensitivity and channel churn.
