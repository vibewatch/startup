        title: Adoption Trajectory and Policyholder Scale
        blocks:
          - type: paragraph
            body: >-
              Commercial policyholder growth demonstrates steady expansion across both insurance coverage lines and
              value-added software security products. Public evidence documents an increase from 30,000 policyholders in
              late 2022 to 35,000 on At-Bay's official marketing surfaces, close to 40,000 businesses referenced in
              Munich Re's August 2026 acquisition announcement, and more than 53,000 small and midsize businesses
              reported in Forbes financial profiles as of March 2026. Alongside policyholder growth, Insurance Journal
              reported in August 2026 that At-Bay commands $278 million in gross written premiums while employing
              approximately 280 staff across the United States and Israel. In parallel with primary insurance lines,
              At-Bay demonstrated measurable traction in cross-selling security software: its paid Managed Detection and
              Response (MDR) add-on scaled from fewer than 1,000 customers in 2023 to 7,500 customers by year-end 2024,
              demonstrating that a meaningful subset of policyholders will purchase recurring security services directly
