  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for At-Bay has centered on its InsurSec model, combining cyber insurance
              policies with active vulnerability scanning and proprietary Managed Detection and Response through At-Bay
              Stance. This dual approach demonstrated tangible commercial traction, scaling premium volume to $278
              million across approximately 40,000 active policyholders and expanding standalone cybersecurity fee
              revenues above $30 million. Furthermore, management maintained capital discipline relative to peers,
              raising under $300 million across seven institutional rounds, which enabled all investors and employee
              equity holders to achieve positive returns in the $575 million Munich Re acquisition. Conversely, the
              anti-thesis highlights the severe structural compression inherent in managing a venture-backed cyber MGA
              that cedes 85% of insurance risk to third-party balance sheets. Despite sixfold premium growth since 2021,
              enterprise value fell by 57% from its $1.35 billion peak, underscoring that public and strategic markets
              price MGA commission streams and hybrid cyber software at low single-digit premium multiples rather than
              high software valuations.
            claimRefs:
