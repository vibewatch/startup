      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Purchase Workflows
        blocks:
          - type: paragraph
            body: >-
              Customer segmentation in cyber insurance spans three distinct tiers with divergent procurement workflows,
              technical capacity, and budget owners. Small businesses with fewer than 250 employees represent the bulk
              of policy volume, with historical claims data demonstrating that 98% of claims arise from organizations
              with annual revenue under $2 billion. In small firms lacking dedicated security personnel, policy
              purchases are driven by business owners or financial controllers seeking contractual compliance,
              transacted through retail insurance brokers. Mid-market enterprises generating between $50 million and
              $500 million divide authority between corporate risk managers and IT directors, evaluating policies on
              extortion sublimits and managed threat containment speed. Upper mid-market buyers with revenue up to $5
              billion require specialized fraud and ransomware packages with automatic flat renewals, where treasury and
              risk executives control commercial insurance budget lines while security teams validate endpoint telemetry
              integrations.
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM012
              - CM014
      - number: '2.4'
        title: Growth Drivers, Loss Dynamics, and Underwriting Friction
        blocks:
          - type: paragraph
            body: >-
              Market expansion is propelled by acute regulatory disclosure pressures and systemic cyber threat
              escalation, balanced against stringent underwriting friction. Regulatory rules including the SEC four-day
              material breach disclosure mandate have compelled organizations to secure insurance policies primarily to
              access pre-vetted legal counsel and incident response panels on immediate retainer. Concurrently, loss
              dynamics continue to intensify: in 2024, ransomware claim frequency among small and mid-market companies
              surged by 20% for the third consecutive year, carrying average incident costs near $470,000, while
              financial fraud losses averaged $270,000. At-Bay's claims research reveals that remote access services
              served as the entry vector in 87% of ransomware incidents, with average claim severity reaching $508,000.
              These loss pressures force underwriters to mandate non-negotiable baseline security hygiene, specifically
              multi-factor authentication, monitored endpoint detection, and immutable air-gapped backups, creating
              friction that limits under-defended organizations from obtaining affordable coverage.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Convergence of Insurance and Cybersecurity Operations
            body: >-
              The emergence of InsurSec fundamentally alters software distribution economics. By embedding active
              vulnerability management and managed detection directly into the insurance underwriting contract, carriers
              effectively bypass traditional enterprise software sales cycles while creating proprietary underwriting
              data that lowers claim loss frequency.
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
          - type: callout
            title: Underwriting Margin Squeeze from Escalating Ransomware Severity
            body: >-
              The cyber insurance line faces persistent margin compression as global premium volume softened to
              approximately $15.0 billion in 2025 while ransomware claim frequency and severity continued to rise, with
              average incident costs reaching $470,000. Underwriters unable to enforce technical controls risk adverse
              loss selection.
            calloutType: risk
            claimRefs:
              - CM002
              - CM006
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: InsurSec Peers, Legacy Insurers, and Security Substitutes'
        blocks:
          - type: paragraph
            body: >-
              The cyber insurance and risk management market is characterized by a structural divide between traditional
              property and casualty insurers and modern technology-driven managing general agents (MGAs). At-Bay
              operates in the specialized InsurSec category, which directly merges commercial cyber insurance
              underwriting with active technical threat prevention. Within this domain, At-Bay primarily contests
              accounts against Coalition, Cowbell, and Resilience. None of these specialized MGAs publish flat rate
              cards, forcing commercial buyers to negotiate coverage through licensed insurance brokers based on bespoke
              digital risk profiles.


              Coalition represents At-Bay's closest direct peer in scale and technical scope, marketing an Active
              Insurance model that pairs automated scanning with Wirespeed MDR and the broader Coalition Control
              platform. Coalition achieved a $5B valuation following a $250M Series F in 2022 and maintains the widest
              product lineup in the peer group, spanning cyber, executive risks, and emerging AI threats across a
              multi-carrier capacity panel. Cowbell targets the smaller end of the enterprise spectrum, emphasizing
              adaptive continuous underwriting driven by Cowbell Factors and backed by a $60M Series C led strategically
              by Zurich in 2024. Resilience approaches the market from the upper-middle-market and enterprise tier,
              utilizing its proprietary Threatonomics Risk Graph to translate technical security telemetry into
              dollar-quantified balance sheet exposure. In contrast, incumbent multi-line carriers such as Chubb and
              Travelers command dominant market share and formidable balance sheets, yet continue to rely on annual
              static underwriting questionnaires and third-party vendor panels rather than embedded active monitoring.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
