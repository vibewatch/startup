            title: Valuation Reset and Market Fundamentals
            body: >-
              The $575 million acquisition by Munich Re illustrates the sharp valuation reset across late-stage
              insurtech. Despite multiplying gross written premiums from $50 million in 2021 to $278 million in 2025,
              At-Bay's enterprise valuation dropped by 57% from its $1.35 billion Series D benchmark, reflecting
              normalized public market multiples and the absence of disclosed GAAP underwriting profitability.
            calloutType: risk
