  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The cyber insurance market has undergone a structural transition from discretionary commercial coverage to
              an essential operational risk transfer and security compliance instrument. Modern market scope encompasses
              primary cyber liability and errors and omissions coverage combined with active attack surface monitoring
              and incident response services, a convergence termed InsurSec. Included spending covers gross written
              premiums for first-party data recovery, business interruption, extortion reimbursement, third-party
              liability defense, and integrated security telemetry. Excluded adjacent spending comprises standalone
              enterprise SIEM architectures, broad endpoint management suites, and general commercial property policies
              that lack explicit cyber affirmative coverage. At-Bay operates within this perimeter as an insurance
              agency and surplus lines broker across all fifty states, distributing surplus lines policies backed by
              non-admitted carrier capital while deploying proprietary exposure management software.
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM011
      - number: '2.2'
        title: TAM, SAM, and Sizing Estimates Across Industry Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the cyber risk opportunity requires triangulating conservative insurer premium figures against
              aggressive InsurSec projections that aggregate security software and risk transfer budgets. On a primary
              risk transfer basis, global gross written cyber premiums are benchmarked at $16.4 billion in 2026
              according to Swiss Re figures, with broader analyst bounds reaching $23.3 billion per Mordor Intelligence.
              Market growth experienced rate stabilization in 2025, where global premiums tracked by Munich Re slightly
              compressed from $15.3 billion in 2024 to approximately $15.0 billion due to softer market pricing despite
              rising claims volume. Conversely, At-Bay defines a wider addressable InsurSec market projected to reach
              $80.0 billion by 2028 with a 22.0% compound annual growth rate by bundling insurance with managed
              detection, vulnerability management, and incident response. The serviceable addressable market centers on
              small and mid-market businesses, where median annual premiums sit near $1,740 for small firms and scale
              into low-six figures for mid-market accounts.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
