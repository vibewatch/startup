      - number: '8.2'
        title: Financing History and Multiple Reset
        blocks:
          - type: paragraph
            body: >-
              At-Bay raised approximately $292 million to $296 million in equity financing between its 2016 founding and
              2022, culminating in a $1.35 billion post-money valuation at its Series D round in October 2021. During
              that peak funding environment, private markets valued At-Bay at an 8.4x multiple on trailing run-rate
              revenues. By August 2026, Munich Re Group agreed to acquire At-Bay in an all-cash transaction at an
              enterprise value of $575 million, scheduled to close in the first quarter of 2027 subject to customary
              regulatory approvals. This transaction reprices At-Bay at approximately 2.0x 2025 gross written premiums
              of $278 million, representing a dramatic multiple reset. CEO Rotem Iram acknowledged this macro
              recalibration, noting that zero-interest-rate multiples have given way to fundamental cash-generation
              metrics, while emphasizing that $300 million in net new capital entered the company beyond cumulative
              funding, ensuring profitable outcomes across capital providers and retained employees.
            claimRefs:
