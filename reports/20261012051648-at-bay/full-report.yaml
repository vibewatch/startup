              - CO012
      - number: '1.3'
        title: Financing History and Munich Re Acquisition
        blocks:
          - type: paragraph
            body: >-
              Between its founding in 2016 and late 2021, At-Bay raised approximately $292 million to $296 million in
              equity capital across institutional venture financing rounds led by prominent investors including
              Lightspeed Venture Partners, Khosla Ventures, Microsoft's M12, Qumra Capital, and Munich Re Ventures. The
              company attained unicorn status in July 2021 with a $185 million Series D financing that valued the
              business at $1.35 billion post-money. On August 19, 2026, Munich Re announced a definitive agreement to
              acquire At-Bay in an all-cash transaction valuing the enterprise at $575 million. While the transaction
              represents a successful liquidity event that returned capital to early shareholders and employees, the 57%
              markdown against peak venture pricing reflects the severe recalibration of private-market tech multiples
              following the zero-interest-rate era. The acquisition also followed targeted corporate restructurings,
              including Israeli R&D workforce layoffs, aimed at optimizing operating cost structures ahead of
              transaction execution.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO010
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO012
      - number: '1.4'
        title: Corporate Milestones and Strategic Trajectory
        blocks:
          - type: paragraph
            body: >-
              At-Bay's operational trajectory illustrates the maturation of the cyber insurtech sector from early
              capacity-dependent distribution to vertically integrated balance-sheet and software operations. A critical
              milestone occurred in early 2023 with the acquisition of an admitted excess and surplus lines insurance
              carrier, allowing At-Bay to write commercial policies directly on its own paper. In April 2023, the launch
              of At-Bay Stance formalized the company's InsurSec positioning by packaging automated endpoint
              vulnerability scanning, threat advisory, and Managed Detection and Response (MDR) as standard policyholder
              benefits. By year-end 2025, At-Bay generated $278 million in gross written premiums and $23 million in
              recurring cybersecurity fee service revenue. The pending acquisition by Munich Re, slated for regulatory
              closing in early 2027, culminates a decade of partnership by embedding At-Bay's software-driven
              underwriting engine directly into global balance-sheet reinsurance infrastructure.
            claimRefs:
