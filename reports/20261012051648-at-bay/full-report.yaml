chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              At-Bay, Inc. was established in 2016 as a specialized cyber insurance and risk management technology
              company designed to address the structural protection deficit facing small and medium-sized enterprises in
              the United States. Rather than operating purely as a conventional managing general agent (MGA) that
              assesses static risk questionnaires annually, At-Bay pioneered an integrated InsurSec architecture that
              couples primary cyber liability coverage with continuous active threat monitoring and automated
              vulnerability detection. The company's commercial model centers on distributing policies through wholesale
              and retail insurance brokers while equipping policyholders with proprietary security telemetry and
              incident response capabilities via At-Bay Stance. Headquartered in San Francisco with specialized
              engineering operations anchored in Tel Aviv, At-Bay has scaled its insured footprint to more than 40,000
              active policyholders safeguarding tens of billions in aggregate commercial revenue across diverse
              commercial sectors.
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The company was co-founded by Chief Executive Officer Rotem Iram and Chief Risk Officer Roman Itskovich,
              alongside cybersecurity architects Etai Hochman and Tilly Kalisky. Iram's operational background spans
              elite technological intelligence service and management consulting, providing strategic vision around
              closing the SME cybersecurity exposure gap. Itskovich drives actuarial modeling, pricing algorithms, and
              portfolio risk management, which form the quantitative bedrock of At-Bay's loss ratio performance.
              Corporate governance historically incorporated representatives from tier-one venture capital firms, while
              strategic reinsurance leadership was maintained through close executive alignment with Munich Re and
              Hartford Steam Boiler (HSB). Following the execution of the definitive acquisition agreement, At-Bay's
              executive leadership and core workforce of approximately 280 employees will transition into an autonomous
              business unit within HSB, ensuring leadership continuity while transferring institutional risk oversight
              to Munich Re Specialty.
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO012
