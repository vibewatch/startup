      - number: '6.4'
        title: Customer Lifecycle, Retention Dynamics, and Channel Dependencies
        blocks:
          - type: paragraph
            body: >-
              The customer adoption lifecycle integrates automated external risk assessment with broker placement and
              continuous policyholder engagement. Prior to binding, At-Bay conducts external attack-surface scans to
              identify security vulnerabilities, requiring applicants to address severe vulnerabilities or open ports
              before securing coverage. While this proactive discipline protects underwriting loss ratios, independent
              analysis from Kinro notes that it creates procurement friction and eliminates applicants that cannot
              satisfy technical requirements. Post-binding, At-Bay maintains contact through automated dark-web alerts
              and vulnerability notices, creating natural touchpoints for upselling Advanced and Complete Stance tiers
              featuring 24/7 endpoint MDR monitoring. Nonetheless, long-term customer durability remains clouded by the
              absence of publicly disclosed Net Revenue Retention (NRR) or cohort renewal rates, leaving At-Bay
              vulnerable to broker portfolio churn when competing specialty carriers offer looser underwriting terms.
