              fundamentally as a technology-enabled distribution and MGA engine rather than a balance-sheet risk
              carrier. Integrating directly into Munich Re's HSB unit removes treaty renewal volatility and cements
              permanent balance sheet backing.
            calloutType: insight
            claimRefs:
              - CV002
              - CV011
