chapter:
  number: 5
  title: "Product & Technology"
  summary: "At-Bay delivers an integrated InsurSec platform combining specialty cyber, technology E&O, and miscellaneous professional liability insurance with proprietary exposure management, broker automation, and managed detection and response (MDR). By embedding vulnerability scanning, threat intelligence, and third-party security engines into underwriting and policy lifecycle workflows, the company targets reduced claims frequency for small and mid-market enterprises while managing complex cloud, carrier, and partner dependencies."
sections:
  - id: "product-overview-and-portfolio"
    title: "Product Overview and Commercial Insurance Portfolio"
    body: "At-Bay structures its commercial product portfolio around specialty property and casualty coverage tailored for small and mid-market enterprises navigating digital risks. Its core commercial insurance lines encompass primary and excess cyber insurance, standalone technology errors and omissions (Tech E&O), and miscellaneous professional liability (MPL). The company distributes these specialty coverages through licensed independent wholesale and retail insurance brokers utilizing the At-Bay Broker Platform. Rather than offering standalone unbundled risk transfer, At-Bay packages its insurance coverage with security capabilities categorized into Core, Advanced, and Complete tiers. Under this InsurSec framework, eligible policyholders obtain integrated vulnerability monitoring, employee awareness training, and virtual CISO advisory services alongside financial risk indemnification. The commercial product suite addresses both third-party liability from data breaches and direct losses stemming from system extortion, business interruption, and network failure."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE005"
      - "CE009"
      - "CE011"
    tableRefs:
      - "TE001"
  - id: "insursec-architecture-and-technology"
    title: "InsurSec Technical Architecture and Stance Platform"
    body: "The core technical differentiator of At-Bay's InsurSec architecture is the At-Bay Stance platform, which combines external threat intelligence with automated policyholder security workflows. Central to this architecture is the At-Bay Stance Exposure Manager, a purpose-built software system that continuously inventories client digital assets, executes non-intrusive external perimeter vulnerability scans, and prioritizes discovered Common Vulnerabilities and Exposures (CVEs) against real-world exploit activity. To combat business email compromise (BEC), which represents the primary driver of commercial fraud claims, At-Bay integrates Sublime Security's agentic detection engine into its managed email security stack. Sublime's distributed detection logic evaluates message linguistics and social engineering patterns across incoming communications. Telemetry generated across endpoint, email, identity, and cloud monitoring feeds into At-Bay's managed detection and response (MDR) pipeline, creating a bidirectional feedback mechanism between digital forensics incident response (DFIR) findings and automated underwriting risk models."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE006"
      - "CE007"
      - "CE008"
    figureRefs:
      - "FE001"
  - id: "underwriting-and-broker-workflows"
    title: "Broker Workflow Automation and Loss Prevention Performance"
    body: "At-Bay operates as a licensed surplus lines broker and managing general agent across all fifty US states and the District of Columbia, relying on its proprietary digital broker portal to ingest and underwrite commercial submissions. Unlike traditional commercial underwriting workflows that depend on lengthy paper questionnaires, manual inspections, and multi-week turnaround times, At-Bay's broker platform uses programmatic domain scans to evaluate applicant security posture within seconds. The platform automatically assesses perimeter configurations, exposed ports, and email security hygiene, generating binding quotes accompanied by tailored vulnerability findings. In addition to initial placement, the system monitors policyholder digital environments throughout the policy term to detect newly emerged critical vulnerabilities. At-Bay claims that this active risk monitoring approach has reduced ransomware claim frequencies across its portfolio by up to 80% relative to broader insurance industry baselines, serving more than 35,000 policyholders across diverse commercial sectors."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE006"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"
  - id: "infrastructure-dependencies-and-risks"
    title: "Operating Infrastructure, Carrier Dependencies, and Risk Controls"
    body: "At-Bay's hybrid operating model introduces critical dependencies across technical infrastructure, carrier paper, and specialized security partnerships. The company retains approximately 15% of underwritten insurance risk, ceding the remaining 85% to institutional reinsurance partners such as Munich Re's HSB Specialty Insurance Company. On the technical side, while foundational attack surface monitoring is bundled under an Embedded Security Fee endorsement, advanced 24/7 endpoint, email, identity, and cloud managed detection and response (MDR/MXDR) requires separate contractual fees through At-Bay Security LLC. Operationally, the MDR service depends on external security partnerships, including Sublime Security for email compromise analysis and third-party endpoint telemetry providers. A major diligence consideration is that At-Bay does not expose public software development kits, open-source repositories, or developer API documentation for its proprietary risk scoring engine, requiring private technical evaluation of underwriting algorithms and internal incident response service-level agreements."
    claimRefs:
      - "CE005"
      - "CE007"
      - "CE008"
      - "CE012"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
