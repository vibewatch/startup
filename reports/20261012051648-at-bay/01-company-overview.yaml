company:
  name: At-Bay
chapter:
  number: 1
  title: Company Overview
  summary: At-Bay, Inc. is a cyber insurance and managed security (InsurSec) platform founded in 2016 that reached $278M in gross written premiums and $23M in cybersecurity fee revenue in 2025 across more than 40,000 policyholders. In August 2026, Munich Re agreed to acquire At-Bay at an enterprise value of $575M—a 57% markdown from its 2021 peak valuation of $1.35B—transitioning the company to an integrated business unit under Hartford Steam Boiler (HSB).
sections:
- id: corporate-identity-and-mission
  title: Corporate Identity, Mission, and Operating Model
  body: At-Bay, Inc. was established in 2016 as a specialized cyber insurance and risk management technology company designed to address the structural protection deficit facing small and medium-sized enterprises in the United States. Rather than operating purely as a conventional managing general agent (MGA) that assesses static risk questionnaires annually, At-Bay pioneered an integrated InsurSec architecture that couples primary cyber liability coverage with continuous active threat monitoring and automated vulnerability detection. The company's commercial model centers on distributing policies through wholesale and retail insurance brokers while equipping policyholders with proprietary security telemetry and incident response capabilities via At-Bay Stance. Headquartered in San Francisco with specialized engineering operations anchored in Tel Aviv, At-Bay has scaled its insured footprint to more than 40,000 active policyholders safeguarding tens of billions in aggregate commercial revenue
    across diverse commercial sectors.
  claimRefs:
  - CO001
  - CO002
  - CO009
  - CO011
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Founders, Executive Leadership, and Governance
  body: The company was co-founded by Chief Executive Officer Rotem Iram and Chief Risk Officer Roman Itskovich, alongside cybersecurity architects Etai Hochman and Tilly Kalisky. Iram's operational background spans elite technological intelligence service and management consulting, providing strategic vision around closing the SME cybersecurity exposure gap. Itskovich drives actuarial modeling, pricing algorithms, and portfolio risk management, which form the quantitative bedrock of At-Bay's loss ratio performance. Corporate governance historically incorporated representatives from tier-one venture capital firms, while strategic reinsurance leadership was maintained through close executive alignment with Munich Re and Hartford Steam Boiler (HSB). Following the execution of the definitive acquisition agreement, At-Bay's executive leadership and core workforce of approximately 280 employees will transition into an autonomous business unit within HSB, ensuring leadership continuity while transferring
    institutional risk oversight to Munich Re Specialty.
  claimRefs:
  - CO001
  - CO002
  - CO010
  - CO012
  tableRefs:
  - TO002
- id: capitalization-and-acquisition
  title: Financing History and Munich Re Acquisition
  body: Between its founding in 2016 and late 2021, At-Bay raised approximately $292 million to $296 million in equity capital across institutional venture financing rounds led by prominent investors including Lightspeed Venture Partners, Khosla Ventures, Microsoft's M12, Qumra Capital, and Munich Re Ventures. The company attained unicorn status in July 2021 with a $185 million Series D financing that valued the business at $1.35 billion post-money. On August 19, 2026, Munich Re announced a definitive agreement to acquire At-Bay in an all-cash transaction valuing the enterprise at $575 million. While the transaction represents a successful liquidity event that returned capital to early shareholders and employees, the 57% markdown against peak venture pricing reflects the severe recalibration of private-market tech multiples following the zero-interest-rate era. The acquisition also followed targeted corporate restructurings, including Israeli R&D workforce layoffs, aimed at optimizing operating
    cost structures ahead of transaction execution.
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO006
  - CO010
  - CO014
  tableRefs:
  - TO003
- id: milestones-and-strategic-trajectory
  title: Corporate Milestones and Strategic Trajectory
  body: At-Bay's operational trajectory illustrates the maturation of the cyber insurtech sector from early capacity-dependent distribution to vertically integrated balance-sheet and software operations. A critical milestone occurred in early 2023 with the acquisition of an admitted excess and surplus lines insurance carrier, allowing At-Bay to write commercial policies directly on its own paper. In April 2023, the launch of At-Bay Stance formalized the company's InsurSec positioning by packaging automated endpoint vulnerability scanning, threat advisory, and Managed Detection and Response (MDR) as standard policyholder benefits. By year-end 2025, At-Bay generated $278 million in gross written premiums and $23 million in recurring cybersecurity fee service revenue. The pending acquisition by Munich Re, slated for regulatory closing in early 2027, culminates a decade of partnership by embedding At-Bay's software-driven underwriting engine directly into global balance-sheet reinsurance infrastructure.
  claimRefs:
  - CO001
  - CO003
  - CO007
  - CO008
  - CO011
  - CO012
  - CO013
