callouts:
- calloutType: risk
  title: Valuation Reset and Market Fundamentals
  body: The $575 million acquisition by Munich Re illustrates the sharp valuation reset across late-stage insurtech. Despite multiplying gross written premiums from $50 million in 2021 to $278 million in 2025, At-Bay's enterprise valuation dropped by 57% from its $1.35 billion Series D benchmark, reflecting normalized public market multiples and the absence of disclosed GAAP underwriting profitability.
  claimRefs:
  - CO003
  - CO004
  - CO007
- calloutType: insight
  title: Strategic Absorption into Munich Re / HSB
  body: Operating under Hartford Steam Boiler (HSB) provides At-Bay with perpetual balance-sheet capacity and tier-one A++ reinsurance backing, solving the capital constraint that challenged standalone MGA models during the high-interest-rate environment while allowing Munich Re to embed active telemetry into cyber risk underwriting.
  claimRefs:
  - CO001
  - CO011
  - CO012
