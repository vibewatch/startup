callouts:
- calloutType: insight
  title: 'The InsurSec Convergence: Transforming Cyber Underwriting Into Security Operations'
  body: Specialized cyber MGAs like At-Bay, Coalition, and Resilience demonstrate that passive risk transfer is economically
    unviable in high-frequency cyber environments. By building proprietary exposure scanning and in-house managed detection
    and response, these players replace periodic static questionnaires with continuous risk mitigation, seeking structurally
    lower loss ratios than legacy commercial carriers.
  claimRefs:
  - CP005
  - CP009
  - CP013
- calloutType: risk
  title: Pricing Opacity and Broker-Mediated Switching Frictions
  body: Because neither At-Bay nor its primary peers publish flat pricing, buyers remain dependent on wholesale broker negotiations
    and opaque risk ratings. While annual policy renewals facilitate carrier shopping, the operational friction of unwinding
    installed MDR agents and re-configuring exposure telemetry creates meaningful switching barriers for active policyholders.
  claimRefs:
  - CP001
  - CP011
  - CP014
