  summary: At-Bay competes in the specialized cyber InsurSec market by pairing broker-distributed surplus lines coverage with
    bundled Stance exposure management and managed detection and response, positioning against active MGAs Coalition, Cowbell,
    and Resilience while navigating acquisition integration with Munich Re.
sections:
- id: competitive-landscape-overview
  title: 'Competitive Landscape: InsurSec Peers, Legacy Insurers, and Security Substitutes'
  body: 'The cyber insurance and risk management market is characterized by a structural divide between traditional property
    and casualty insurers and modern technology-driven managing general agents (MGAs). At-Bay operates in the specialized
    InsurSec category, which directly merges commercial cyber insurance underwriting with active technical threat prevention.
    Within this domain, At-Bay primarily contests accounts against Coalition, Cowbell, and Resilience. None of these specialized
    MGAs publish flat rate cards, forcing commercial buyers to negotiate coverage through licensed insurance brokers based
    on bespoke digital risk profiles.


    Coalition represents At-Bay''s closest direct peer in scale and technical scope, marketing an Active Insurance model that
    pairs automated scanning with Wirespeed MDR and the broader Coalition Control platform. Coalition achieved a $5B valuation
    following a $250M Series F in 2022 and maintains the widest product lineup in the peer group, spanning cyber, executive
    risks, and emerging AI threats across a multi-carrier capacity panel. Cowbell targets the smaller end of the enterprise
    spectrum, emphasizing adaptive continuous underwriting driven by Cowbell Factors and backed by a $60M Series C led strategically
    by Zurich in 2024. Resilience approaches the market from the upper-middle-market and enterprise tier, utilizing its proprietary
    Threatonomics Risk Graph to translate technical security telemetry into dollar-quantified balance sheet exposure. In contrast,
    incumbent multi-line carriers such as Chubb and Travelers command dominant market share and formidable balance sheets,
    yet continue to rely on annual static underwriting questionnaires and third-party vendor panels rather than embedded active
    monitoring.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP006
  - CP007
  - CP013
  tableRefs:
