  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Published rate cards or empirical gross written premium benchmarks comparing At-Bay against Coalition
      and Cowbell across standardized SMB revenue tiers.
    whyItMatters: Because cyber MGAs do not publish flat pricing, buyers and investors cannot independently verify whether
      At-Bay's loss-prevention tools yield structurally lower premiums or merely bundle software costs into baseline rates.
    diligencePath: Request anonymized broker placement datasets and multi-quote comparison sheets across comparable SIC industry
      codes and risk grades.
    relatedQuestionRefs:
    - QP001
    - QP005
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: mdr-retention
    missingEvidence: Standalone churn rates, net revenue retention (NRR), and policyholder attach rates for the paid At-Bay
      Stance MDR product tier.
    whyItMatters: Determines whether At-Bay's security software is building independent high-margin ARR or remains a subsidized
      underwriting amenity tied directly to policy renewal.
    diligencePath: Review customer cohort retention schedules and separate software subscription Billings in Munich Re acquisition
      disclosure files.
