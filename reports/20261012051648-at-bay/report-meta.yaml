  topStrengths:
    - Meaningful SMB distribution with more than 40,000 active policyholders.
    - Hybrid InsurSec model adds security-fee revenue alongside underwriting premiums.
    - Munich Re acquisition provides a clear liquidity path and industrial underwriting home.
  topRisks:
    - The $575 million sale price implies a major reset from At-Bay's $1.35 billion peak valuation.
    - Standalone underwriting economics, margin structure, and reserve dynamics remain opaque.
    - Cap-table preference and liquidation waterfall details are still private.
    - Transaction close and integration execution still depend on regulatory approvals.
  unresolvedGaps:
    - Consolidated GAAP financial statements, gross margin, and burn trajectory are not public.
    - Reinsurance treaty attachment points, pricing, and renewal conditions remain undisclosed.
    - Stance cohort retention, attach rate, gross margin, and customer payback are not public.
    - Broker concentration and renewal cohorts by segment are not public.
    - Cap-table preferences, anti-dilution terms, and secondary liquidity overhang are not public.
