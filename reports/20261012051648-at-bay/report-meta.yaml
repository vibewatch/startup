companyProfile:
  summary: >-
    At-Bay is a San Francisco-based cyber insurer and security platform founded in 2016 that pairs broker-distributed
    cyber policies with At-Bay Stance vulnerability scanning, risk advisory, and managed detection and response. The
    company reached meaningful SMB scale by 2025, with more than 40,000 active policyholders, $278 million in gross
    written premiums, and $23 million in cybersecurity fee revenue, and then agreed in August 2026 to be acquired by
    Munich Re for $575 million.
