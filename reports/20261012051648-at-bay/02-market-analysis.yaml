callouts:
  - calloutType: insight
    title: Convergence of Insurance and Cybersecurity Operations
    body: >-
      The emergence of InsurSec fundamentally alters software distribution economics. By embedding active vulnerability
      management and managed detection directly into the insurance underwriting contract, carriers effectively bypass
      traditional enterprise software sales cycles while creating proprietary underwriting data that lowers claim loss
      frequency.
    claimRefs:
      - CM003
      - CM005
  - calloutType: risk
    title: Underwriting Margin Squeeze from Escalating Ransomware Severity
    body: >-
      The cyber insurance line faces persistent margin compression as global premium volume softened to approximately
      $15.0 billion in 2025 while ransomware claim frequency and severity continued to rise, with average incident costs
      reaching $470,000. Underwriters unable to enforce technical controls risk adverse loss selection.
    claimRefs:
      - CM002
      - CM006
      - CM008
