  title: Market Analysis
  summary: >-
    Comprehensive market analysis examining the global cyber insurance and InsurSec landscape, buyer segmentation across
    SMB and mid-market organizations, pricing trends, and critical underwriting adoption constraints.
sections:
  - id: market-definition-and-boundaries
    title: Market Boundary, Category Scope, and Adjacencies
    body: >-
      The cyber insurance market has undergone a structural transition from discretionary commercial coverage to an
      essential operational risk transfer and security compliance instrument. Modern market scope encompasses primary
      cyber liability and errors and omissions coverage combined with active attack surface monitoring and incident
      response services, a convergence termed InsurSec. Included spending covers gross written premiums for first-party
      data recovery, business interruption, extortion reimbursement, third-party liability defense, and integrated
      security telemetry. Excluded adjacent spending comprises standalone enterprise SIEM architectures, broad endpoint
      management suites, and general commercial property policies that lack explicit cyber affirmative coverage. At-Bay
      operates within this perimeter as an insurance agency and surplus lines broker across all fifty states,
      distributing surplus lines policies backed by non-admitted carrier capital while deploying proprietary exposure
      management software.
    claimRefs:
      - CM001
      - CM003
      - CM005
      - CM011
    tableRefs:
      - TM001
  - id: tam-sam-som-market-sizing
    title: TAM, SAM, and Sizing Estimates Across Industry Lenses
    body: >-
      Sizing the cyber risk opportunity requires triangulating conservative insurer premium figures against aggressive
      InsurSec projections that aggregate security software and risk transfer budgets. On a primary risk transfer basis,
      global gross written cyber premiums are benchmarked at $16.4 billion in 2026 according to Swiss Re figures, with
      broader analyst bounds reaching $23.3 billion per Mordor Intelligence. Market growth experienced rate
      stabilization in 2025, where global premiums tracked by Munich Re slightly compressed from $15.3 billion in 2024
      to approximately $15.0 billion due to softer market pricing despite rising claims volume. Conversely, At-Bay
      defines a wider addressable InsurSec market projected to reach $80.0 billion by 2028 with a 22.0% compound annual
      growth rate by bundling insurance with managed detection, vulnerability management, and incident response. The
      serviceable addressable market centers on small and mid-market businesses, where median annual premiums sit near
      $1,740 for small firms and scale into low-six figures for mid-market accounts.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM010
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-persona-and-budget-dynamics
    title: Buyer Segmentation, Budget Ownership, and Purchase Workflows
    body: >-
      Customer segmentation in cyber insurance spans three distinct tiers with divergent procurement workflows,
      technical capacity, and budget owners. Small businesses with fewer than 250 employees represent the bulk of policy
      volume, with historical claims data demonstrating that 98% of claims arise from organizations with annual revenue
      under $2 billion. In small firms lacking dedicated security personnel, policy purchases are driven by business
      owners or financial controllers seeking contractual compliance, transacted through retail insurance brokers.
      Mid-market enterprises generating between $50 million and $500 million divide authority between corporate risk
      managers and IT directors, evaluating policies on extortion sublimits and managed threat containment speed. Upper
      mid-market buyers with revenue up to $5 billion require specialized fraud and ransomware packages with automatic
      flat renewals, where treasury and risk executives control commercial insurance budget lines while security teams
      validate endpoint telemetry integrations.
    claimRefs:
      - CM004
      - CM005
      - CM010
      - CM011
      - CM012
    tableRefs:
      - TM003
  - id: adoption-drivers-and-underwriting-constraints
    title: Growth Drivers, Loss Dynamics, and Underwriting Friction
    body: >-
      Market expansion is propelled by acute regulatory disclosure pressures and systemic cyber threat escalation,
      balanced against stringent underwriting friction. Regulatory rules including the SEC four-day material breach
      disclosure mandate have compelled organizations to secure insurance policies primarily to access pre-vetted legal
      counsel and incident response panels on immediate retainer. Concurrently, loss dynamics continue to intensify: in
      2024, ransomware claim frequency among small and mid-market companies surged by 20% for the third consecutive
      year, carrying average incident costs near $470,000, while financial fraud losses averaged $270,000. At-Bay's
      claims research reveals that remote access services served as the entry vector in 87% of ransomware incidents,
      with average claim severity reaching $508,000. These loss pressures force underwriters to mandate non-negotiable
      baseline security hygiene, specifically multi-factor authentication, monitored endpoint detection, and immutable
      air-gapped backups, creating friction that limits under-defended organizations from obtaining affordable coverage.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM013
      - CM014
