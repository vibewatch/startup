callouts:
  - calloutType: risk
    title: Reinsurance Capacity and M&A Integration Bottleneck
    body: At-Bay's entire business model depends on A++ rated reinsurance paper from Munich Re's HSB. While the announced $575 million acquisition permanently aligns capacity, it creates closing condition exposure through Q1 2027 and locks At-Bay into Munich Re's governance and specialty insurance roadmap.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR013
  - calloutType: insight
    title: Valuation Haircut Highlights Insurtech Realism Over Unicorn Multiples
    body: The drop from At-Bay's 2021 peak valuation of $1.35 billion to an all-cash $575 million transaction reflects an industry-wide multiple compression where acquisition value tracks cash generation and underwriting fundamentals rather than speculative venture premiums.
    claimRefs:
      - CR003
      - CR008
      - CR015
