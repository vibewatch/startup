companyProfile:
  summary: >-
    KoBold Metals is an AI-driven mineral exploration and mine-development company founded in 2018 that applies Bayesian
    machine learning, proprietary geophysical sensors, and integrated subsurface datasets to discover and advance
    critical mineral deposits. The business has moved beyond pure exploration into direct project development through
    Mingomba in Zambia, backed by a large institutional investor syndicate and a growing operating footprint in Africa.
