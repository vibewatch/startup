  topStrengths:
    - World-class Mingomba copper project with scale and grade potential.
    - Strong institutional backing from crossover investors and strategic mining partners.
    - Differentiated exploration platform with proprietary sensors and machine-learning workflows.
  topRisks:
    - Mingomba still lacks completed feasibility de-risking and carries major capital intensity.
    - Geopolitical and sovereign execution risk remains elevated in Central Africa.
    - The AI platform's claimed edge over conventional exploration has not been independently benchmarked.
  unresolvedGaps:
    - Mingomba Bankable Feasibility Study and full capital plan remain unpublished.
    - Independent benchmark of AI discovery hit rate versus industry baseline remains unavailable.
    - Project financing structure, liquidation preferences, and common-equity waterfall remain opaque.
    - The long-term economics of the direct mine-development transition are still unproven.
