callouts:
  - calloutType: "insight"
    title: "The Paradigm Shift: From Pure Explorer to Large-Scale Mine Operator"
    body: "KoBold's strategic evolution represents an ambitious leap from software-enabled mineral discovery to direct capital project execution. By initiating construction on the $2.3 billion Mingomba copper mine prior to full engineering study completion, management is testing whether Silicon Valley's iterative development velocity can compress the mining industry's traditional 15-year discovery-to-production lifecycle without incurring catastrophic capital overruns."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO014"
  - calloutType: "risk"
    title: "Technical and Capital Exposure at 1,700-Meter Depth"
    body: "Developing Mingomba involves formidable subsurface challenges, including an ultra-deep 1,700-meter orebody and notorious regional groundwater inflows. In the absence of a completed Bankable Feasibility Study (targeted for early 2027), project economics, dewatering costs, and ultimate development capex remain highly sensitive to geological and engineering uncertainties."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
