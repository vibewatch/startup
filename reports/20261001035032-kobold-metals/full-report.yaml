              - CR009
      - number: '7.3'
        title: Geopolitical Exposure and Strategic Counterparty Dependencies
        blocks:
          - type: paragraph
            body: >-
              KoBold's strategic positioning within central African mineral belts exposes operations to intense
              geopolitical competition and sovereign counterparty risks. In the Democratic Republic of Congo, mineral
              exploration unfolds against a backdrop of regional security instability, complex local politics, and
              intensifying rivalry between the United States and China for critical energy transition materials.
              Although backed by high-profile Western capital providers including Breakthrough Energy Ventures and
              Andreessen Horowitz, KoBold remains heavily dependent on continued equity syndication, having raised $491
              million of a targeted $527 million Series C round. Total funding disclosures across private databases
              diverge widely between $900 million and $1.3 billion, reflecting distinct equity classes and valuation
              marks ranging from $2.96 billion to over $4 billion. Moreover, pledging more than $50 million toward
              Congolese lithium exploration alongside commitments to Mingomba in Zambia concentrates capital within
              sovereign jurisdictions prone to fiscal regime adjustments, mineral royalty tax increases, and local
              beneficiation mandates.
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
