  - id: FU001
    title: Customer and Partner Engagement Journey
    type: journey-map
    summary: >-
      Lifecycle mapping commercial engagement from initial sovereign data digitization through drill targeting to
      integrated mine development and offtake.
    data:
      items:
        - label: 1. Basin Screening
          stage: Exploration Ingestion
          description: >-
            Aggregates historical government geological archives, satellite imagery, and regional geochemical datasets
            to identify prospective mineral belts.
          touchpoints:
            - Government Geological Survey Archives
            - Satellite and Public GIS Databases
        - label: 2. Sovereign Alignment
          stage: Government Partnership
          description: >-
            Executes data digitization agreements and national exploration frameworks with sovereign mining ministries
            in exchange for priority concession access.
          touchpoints:
            - Ministry of Mines Memoranda
            - State Mining Holding Partnerships (e.g. ZCCM-IH)
        - label: 3. Concession Acquisition
          stage: Land Staking & Earn-In
          description: >-
            Secures exploration permits or negotiates staged earn-in commitments with junior mining concession holders
            to earn majority asset equity.
          touchpoints:
            - Earn-In Option Agreements
            - Concession License Grants
        - label: 4. Sensor Deployment
          stage: Field Validation
          description: >-
            Deploys proprietary hardware including Hyperpod imaging, Korecam360 core scanning, and on-site MetaLab
            assays to reduce subsurface uncertainty.
          touchpoints:
            - Airborne and Ground Geophysical Sensors
            - On-Site Mobile Assay Laboratories
        - label: 5. JV Farm-In
          stage: Major Miner Partnership
          description: >-
            Partners with major mining companies like BHP and Rio Tinto to co-fund high-cost exploratory drilling
            campaigns on prospective anomalies.
          touchpoints:
            - Joint Exploration Operating Committees
            - Technical Exploration Review Dashboards
        - label: 6. Mine Development
          stage: Commercial Production
          description: >-
            Transitions tier-one discoveries into fully financed mine construction projects, shifting value capture to
            physical mineral offtake and asset equity.
          touchpoints:
            - Bankable Feasibility Study (BFS)
            - Shaft Sinking and Refinery EPC Contracts
