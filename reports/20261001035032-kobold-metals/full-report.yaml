              - CR007
              - CR008
              - CR010
              - CR012
      - number: '7.4'
        title: Integrated Risk Architecture, Kill Criteria, and Diligence Roadmap
        blocks:
          - type: paragraph
            body: >-
              Evaluating KoBold's overall risk architecture reveals a bimodal distribution between high-probability
              technological exploration hurdles and high-impact sovereign legal liabilities. To maintain underwriting
              discipline, investors must monitor clear thesis-break triggers and kill criteria across operating
              milestones. In the DRC, an adverse ICC arbitration ruling upholding AVZ Minerals' exclusive concession
              rights without an affordable settlement mechanism would effectively eliminate KoBold's Manono lithium
              optionality. At Mingomba, failure to release a bankable feasibility study or secure syndicated project
              debt financing within planned timelines would trigger severe dilution risk, given the $2.3 billion
              construction cost. Additionally, unauthenticated public validation of KoBold's proprietary AI hit rate
              remains restricted, as independent research coverage is constrained by proprietary access barriers and
              privacy terms. Rigorous ongoing diligence requires auditing ICC docket entries, verifying Zambian
              environmental impact approvals, and tracking sovereign mineral policy shifts.
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR013
