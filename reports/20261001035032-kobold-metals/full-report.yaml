    title: Thesis and Anti-Thesis Drivers
    columns:
      - Dimension
      - Investment Thesis
      - Anti-Thesis / Downside View
      - View-Changing Catalyst
    rows:
      - - Core Asset (Mingomba)
        - World-class deposit with potential for hundreds of thousands of tons/year
        - $2.3B estimated development capex required before first commercial copper
        - Publication of Mingomba Bankable Feasibility Study (BFS)
      - - Exploration Technology
        - AI platform aims to turn mineral exploration into a repeatable science
        - Exploration historically yields ~3 discoveries per 1,000 attempts with unverified hit-rate delta
        - Independent audit of AI-attributed discovery hit rate vs industry baselines
      - - Capital & Syndication
        - Backed by top-tier crossover investors including T. Rowe Price and Durable Capital
        - Over $1.2B raised creates liquidation preference overhang for early equity
        - Binding project-finance or sovereign off-take debt package announcement
      - - Geopolitical Exposure
        - Strong Zambian local leadership and strategic alignment on critical minerals
        - Jurisdictional concentration in Central Africa introduces sovereign regulatory risk
        - Execution of long-term bilateral investment protection agreements
