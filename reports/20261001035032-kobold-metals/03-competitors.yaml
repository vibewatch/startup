callouts:
  - calloutType: "insight"
    title: "The Equity-Ownership Model Creates Alignment but Escalates Balance Sheet Risk"
    body: "Unlike software-as-a-service providers that capture stable annual recurring revenue without subsurface risk, KoBold's insistence on holding substantial project equity (51%–75% earn-ins) aligns its incentives directly with asset discovery. However, transitioning from prospecting to active mine development at Mingomba forces KoBold to navigate the multi-billion-dollar capex requirements and environmental liabilities that traditional software companies avoid."
    claimRefs:
      - "CP002"
      - "CP008"
      - "CP014"
  - calloutType: "risk"
    title: "Low Computational Barriers Threaten Long-Term Software Defensibility"
    body: "While KoBold's first-mover status and dataset aggregation provide a head start, independent analysis highlights that basic machine learning frameworks can be replicated by well-capitalized tech entrants or in-house mining labs. Without long-term proprietary sensor defensibility or exclusive land concessions, algorithmic exploration tools face steady commoditization."
    claimRefs:
      - "CP011"
      - "CP013"
