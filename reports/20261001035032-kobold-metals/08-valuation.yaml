    title: "Patience Required: Defer Investment Pending Feasibility Study"
    body: "While KoBold Metals has secured a premier global copper asset, the company's valuation of $4.17B fully prices in early development success while leaving investors exposed to substantial pre-production execution risks. We advise tracking the asset until the Mingomba Bankable Feasibility Study defines capital expenditure and unit economics."
    claimRefs:
      - "CV009"
      - "CV011"
      - "CV012"
  - calloutType: "risk"
    title: "Capital Intensity Transition"
    body: "KoBold's evolution from an asset-light exploration software enterprise into a direct mine developer significantly alters its risk profile. Funding the estimated $2.3B mine construction will require heavy non-dilutive debt or substantial equity syndication, creating potential dilution and preference overhang."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV010"
