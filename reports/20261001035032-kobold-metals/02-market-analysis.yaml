callouts:
  - calloutType: insight
    title: "Asset Equity Ownership Model Diverges From Pure-Play Mining SaaS"
    body: "Unlike software-as-a-service firms that capture software licensing fees with minimal project risk, KoBold Metals captures value primarily through direct equity stakes in mineral deposits and joint venture earn-ins. This model trades near-term software recurring revenues for high-upside ownership in multi-billion-dollar producing assets."
    claimRefs:
      - CM002
      - CM003
  - calloutType: risk
    title: "Deep Underground Hydrological and Power Hurdles Could Inflate Development Capex"
    body: "Mingomba's target copper ore body sits 1,700 meters underground in an active hydrological basin. Similar historical operations in the Copperbelt consumed up to 900 MWh per day in dewatering power alone, suggesting that power and water management infrastructure could escalate capital expenditure well beyond initial budget projections."
    claimRefs:
      - CM013
      - CM014
