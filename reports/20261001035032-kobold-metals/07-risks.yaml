    title: "The AVZ Arbitration Represents an Existential Blocker for DRC Optionality"
    body: "While KoBold Metals secured seven new exploration permits in the Democratic Republic of Congo in August 2025, the underlying Manono lithium concessions remain encumbered by international arbitration initiated by Australia's AVZ Minerals. KoBold has explicitly treated dispute resolution as a prerequisite for development, meaning capital deployed in the DRC remains at risk of regulatory invalidation or costly litigation settlements."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
  - calloutType: "insight"
    title: "Transitioning from Software Prospector to Mine Developer Multiplies Balance Sheet Risk"
    body: "KoBold's strategic decision to develop the Mingomba copper project in Zambia directly transforms its risk profile from an asset-light exploration software enterprise into a capital-intensive junior mining operator. With projected development costs exceeding $2.3 billion, KoBold faces severe dilution and project execution risks that software licensing models never encounter."
    claimRefs:
      - "CR005"
      - "CR008"
      - "CR010"
