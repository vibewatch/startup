        - 中
        - 合作伙伴退出或合资项目战略优先级下调
        - 中
        - 布局逾60个全球活跃勘探靶区的多元化项目组合
        - 丧失行业背书型共同投资人及勘探成本分摊机制
      - - 早期机构资金方
        - 风险与成长期基金（Breakthrough Energy、a16z、Durable）
        - C轮与C-Prime轮股权融资银团（$491M–$537M融资轮次）
        - 高
        - 一级市场估值下调（down-round）或拒绝出资支持$2.3B矿山资本开支
        - 极高
        - 引入主权财富基金与多边开发性金融机构扩大银团
        - 若公开股票市场持续关闭，将面临严重股权稀释或资金缺口
    notes: 按风险严重程度排序。分析涉及主权国家、矿业巨头及金融银团的关键机构交易对手。
