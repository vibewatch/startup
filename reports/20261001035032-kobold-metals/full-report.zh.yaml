  - id: TV002
    title: 正反投资逻辑核心驱动因素
    columns:
      - 维度
      - 核心投资逻辑
      - 下行情景视角
      - 观点反转催化剂
    rows:
      - - 核心资产（Mingomba）
        - 世界级矿床，具备年产数十万吨铜的潜能
        - 首批商业化铜矿出产前预计需$2.3B建设资本开支
        - Mingomba银行级可行性研究（BFS）正式发布
      - - 勘探技术
        - AI平台致力于使矿产勘探转变为可重复的科学流程
        - 勘探历史上每1,000次尝试仅产生约3次发现，技术带来的命中率增益未经证实
        - 独立审计AI辅助找矿命中率对比行业基准
      - - 资本与银团
        - 获T. Rowe Price与Durable Capital等顶尖跨界投资人支持
        - 累计募资逾$1.2B，对早期股权形成清算优先权压制
        - 宣布具备约束力的项目融资或主权包销债务方案
      - - 地缘政治敞口
        - 赞比亚本土管理团队执行力强，关键矿产战略利益高度一致
        - 资产集中于中非单一区域，引入主权监管风险
        - 签署长期双边投资保护协定
    notes: 决定股权价值、技术壁垒及工程落地的关键结构性论点。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
  - id: TV003
    title: 乐观、基准与悲观估值情景
    columns:
      - 情景
      - 目标估值
      - 核心假设
      - 关键风险
      - 概率信号
    rows:
      - - 乐观情景
        - $8.0B+
        - Mingomba于2030年代初投产；铜价>$10k/t；AI平台达成多项合资合作
        - 工程实施延期、矿业通胀、大宗商品周期下行
        - 25%
      - - 基准情景
        - $4.0B - $4.5B
        - Mingomba采用60/40债权与股权结构融资；商业化开采按期推进；二级市场估值基准企稳
        - 适度成本超支、工期滞后1-2年、后续股权出资带来稀释
        - 50%
      - - 悲观情景
        - $1.5B - $2.0B
        - $2.3B资本开支遭遇融资瓶颈；铜价大幅下挫；下调估值重组（down-round）
        - 流动性危机、政治/监管僵局、勘探资金搁浅
        - 25%
    notes: 各情景估值区间反映资产端净现值（NPV）敏感度以及预期项目融资带来的股权稀释。
    claimRefs:
      - CV009
      - CV011
      - CV012
      - CV015
figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: 梳理自2018年成立至2026年$2.3B Mingomba矿山奠基的发展历程。
    data:
      items:
        - label: 公司成立
          date: 2018-12
          detail: Kurt House、Josh Goldman与Jeff Jurinak创立KoBold Metals，运用机器学习突破关键矿产勘探瓶颈。
          tone: positive
        - label: A轮融资
          date: 2019-10
          detail: 获得Breakthrough Energy Ventures及硅谷气候科技基金的初始风险投资支持。
          tone: positive
        - label: 启动全球初始勘探项目
          date: 2021-08
          detail: 在北美和非洲启动覆盖镍、铜、锂的多矿种勘探作业。
          tone: neutral
        - label: B轮成长期融资
          date: 2022-01
          detail: 募资约$198 million，用于扩大自研传感器部署并深化地下AI建模。
          tone: positive
        - label: 收购Mingomba项目
          date: 2022-12
          detail: 进驻赞比亚铜带省（Copperbelt），与ZCCM-IH合作斩获Mingomba勘探权。
          tone: positive
        - label: 跻身独角兽与C轮扩张
          date: 2023-03
          detail: 获Andreessen Horowitz、T. Rowe Price及战略伙伴支持，估值突破$1B+。
          tone: positive
        - label: 证实Mingomba高品位矿床
          date: 2024-02
          detail: 查明Mingomba大型高品位铜矿化体，确立其作为非洲顶级矿床之一的地位。
          tone: positive
        - label: Mingomba开工奠基与工程启动
          date: 2026-04
          detail: $2.3B Mingomba地下矿山破土动工，设计年产能300,000吨铜，在全流程可行性研究完成前先行推进井筒快速开掘。
          tone: warning
    approximationNotes: 里程碑日期源自公开新闻通稿与行业二手编年史；完整历史勘探作业涵盖未单独列出的次要矿权区。
