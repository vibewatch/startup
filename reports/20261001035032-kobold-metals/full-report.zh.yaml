  - id: FE001
    title: 产品技术架构图
    type: stack
    summary: 全栈技术分层，涵盖空地立体感知、数据接入流水线、地下预测性ML建模及矿山建设决策系统。
    data:
      layers:
        - label: 第一层：物理感知与地球物理硬件
          detail: 自研Hyperpod航空磁测传感器与自动化野外成像设备
        - label: 第二层：数据接入与归一化
          detail: 针对多源异构地质数据的结构化接入流水线（SIP）与DataKit数据包构建
        - label: 第三层：地壳数据库与非结构化数据挖掘
          detail: TerraShed集中式地壳知识库及面向历史地质文献的RAG检索增强系统
        - label: 第四层：机器学习与预测建模
          detail: 整合地球物理、地球化学与空间数据的Machine Prospector贝叶斯ML模型
        - label: 第五层：决策科学与靶区优选
          detail: 指导野外钻探作业的信息价值（VOI）算法与不确定性量化
        - label: 第六层：矿山开发与运营保障
          detail: 部署于Mingomba及全球现场的业主端工程管理系统与HSE监控
    claimRefs:
      - CE003
      - CE004
      - CE008
      - CE011
  - id: FU001
    title: 客户与合作伙伴合作全流程
    type: journey-map
    summary: 梳理从主权数据数字化、钻探靶区圈定直至一体化矿山建设与产品包销的商业合作生命周期。
    data:
      items:
        - label: 1. 盆地初筛
          stage: 勘探数据接入
          description: 汇集政府历史地质档案、卫星遥感影像及区域地球化学数据集，锁定成矿潜力区带。
          touchpoints:
            - 政府地质调查档案
            - 卫星遥感与公开GIS数据库
        - label: 2. 主权政府协同
          stage: 政府层面合作
          description: 与主权矿业部签署数据数字化协议与国家级勘探框架，换取优先矿权准入资格。
          touchpoints:
            - 矿业部合作备忘录
            - 国有矿业控股公司合作伙伴关系（如ZCCM-IH）
        - label: 3. 矿权获取
          stage: 跑马圈地与权益受让
          description: 申办勘探许可，或与初级矿业权属方协商分阶段权益受让承诺，获取资产控股权。
          touchpoints:
            - 权益受让期权协议
            - 特许矿权授予批文
        - label: 4. 传感器部署
          stage: 现场验证
          description: 进场部署Hyperpod航测、Korecam360岩心扫描及MetaLab野外现场化验等自研硬件，降低地下不确定性。
          touchpoints:
            - 航空及地面地球物理传感器
            - 现场移动化验实验室
        - label: 5. 合资出资入股（Farm-In）
          stage: 矿业巨头合作
          description: 联手BHP与Rio Tinto等矿业巨头，共同出资针对潜力异常区推进高成本勘探钻探。
          touchpoints:
            - 联合勘探运营委员会
            - 勘探技术评审看板
        - label: 6. 矿山建设
          stage: 商业化生产
          description: 将一级重大矿床发现转化为获全额融资支持的矿山工程项目，价值捕获重心转向实物矿产包销与资产股权。
          touchpoints:
            - 银行级可行性研究（BFS）
            - 竖井掘进与选冶厂EPC总承包合同
    approximationNotes: null
    claimRefs:
      - CU001
      - CU002
      - CU014
      - CU015
