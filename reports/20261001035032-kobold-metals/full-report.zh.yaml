  - id: TV001
    title: 投资建议摘要
    columns:
      - 评估维度
      - 评估结论
      - 证据基础
      - 决策含义
    rows:
      - - 投资建议
        - 保持跟踪
        - 处于未产生营收、未投产阶段，资本密集度极高
        - 维持密切监控；推迟出资安排，直至BFS落实降低风险
      - - 置信度
        - 中
        - 已核实$1.2B+融资金额及资源储量规模，但BFS资本开支尚未证实
        - 适于纳入成长期与资源类专项尽调资产池
      - - 风险评级
        - 高
        - $2.3B矿山建设资本开支与中非运营敞口
        - 需具备10-15年长期耐心及强大的银团组阁能力
      - - 估值立场
        - 合理
        - $4.17B投后估值在可行性研究明确前已提前计入工程成功预期
        - 入场时须坚持设置结构化清算优先权保护条款
    notes: 综合披露的融资里程碑，提炼投资立场与阶段性准入节点。
