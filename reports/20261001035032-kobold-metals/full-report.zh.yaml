              - CV011
      - number: '8.4'
        title: 展件
        blocks:
          - type: callout
            title: 保持耐心：待可行性研究出炉再行投资
            body: >-
              尽管 KoBold Metals 已锁定全球顶级铜矿资产，但公司 $4.17B 估值已充分计入早期勘探开发成果，同时使投资者暴露于投产前重大执行风险之中。建议对该资产保持跟踪，直至 Mingomba
              银行级可行性研究（BFS）明确资本开支与单位经济效益。
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV011
              - CV012
          - type: callout
            title: 资本密集度转型
            body: KoBold 从轻资产勘探软件企业向直接矿山开发商转型，从根本上改变了自身风险收益特征。为预计 $2.3B 的矿山建设筹措资金需要大量非稀释性债务或大规模股权银团融资，这可能带来股权稀释与优先清算权积压负担。
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV010
