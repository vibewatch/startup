              与其在西澳大利亚维持活跃的合资项目，主攻锂及基本金属，彰显出顶级资源开发商对其系统性信任。在赞比亚，KoBold 与国有投资控股实体 ZCCM-IH 组建核心合资平台，在 Mingomba 矿床中保留 80%
              的非国有权益，同时赋予赞比亚政府 20% 的附带权益（carried interest）。在格陵兰，KoBold 承诺投入 $15 million 勘探开支，获得 Bluejay Mining 旗下
              Disko-Nuussuaq 项目 51% 权益，验证了其权益转让勘探模式。在中非，公司在刚果民主共和国铺开大规模锂矿勘查，承诺在 2027 年初前投入超过 $50 million 评估七处特许权区块。
            claimRefs:
              - CU003
              - CU009
              - CU010
              - CU011
