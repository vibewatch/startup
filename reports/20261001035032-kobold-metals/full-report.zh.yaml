      - number: '7.5'
        title: 专题展示
        blocks:
          - type: callout
            title: AVZ 仲裁案构成刚果战略期权实质性阻碍
            body: >-
              尽管 KoBold Metals 于 2025 年 8 月在刚果民主共和国锁定了七份新勘探许可证，但标的 Manono 锂矿特许权仍受制于澳大利亚 AVZ Minerals 提起的国际仲裁。KoBold
              已明确将纠纷解决视为开展开发的前置条件，意味着投向刚果民主共和国的资本始终面临监管作废或昂贵诉讼和解的风险。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 从软件普查转向矿山开发加剧资产负债表风险
            body: >-
              KoBold 直接开发赞比亚 Mingomba 铜矿项目的战略决策，使其风险画像从轻资产勘探软件企业彻底转变为重资产初级矿业开发商。预计开发成本超过 $2.3 billion，KoBold
              面临着软件授权模式完全不曾遭遇的剧烈股权稀释与工程交付风险。
            calloutType: insight
            claimRefs:
              - CR005
              - CR008
              - CR010
  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资核心逻辑与反方观点
        blocks:
          - type: paragraph
            body: >-
              KoBold Metals 的核心投资逻辑立足于机器学习驱动的地下勘查与世界级关键矿产矿床所有权的相互融合。将自研传感器硬件、集中式地球物理数据系统及贝叶斯预测算法与人类地质经验有机结合，KoBold
              旨在将矿产勘查重塑为可重复的严密科学。这一技术平台的效能验证在赞比亚 Mingomba
              铜矿的发现与收购中达到顶峰，该矿床是全球规模最大的高品位未开发铜矿资源之一。全球能源转型的长期时代红利，为铜、钴、锂和镍创造了长达数十年的持久需求。相反，反方观点聚焦于巨额资本密集度、漫长的投产前筹建周期，以及
              AI 在全新绿地矿山采掘中未经证实的商业化规模推广能力。KoBold 已从轻资产技术平台转变为重资产矿山开发商，背负着赞比亚预计 $2.3 billion 的沉重开发支出，并叠加了中非地区的地缘政治与主权风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
      - number: '8.2'
        title: 估值背景与资本结构
        blocks:
          - type: paragraph
            body: >-
              KoBold Metals 历经多轮机构融资，累计股权融资规模超过 $1.2 billion。公司于 June 2023 完成由 T. Rowe Price 领投、Andreessen Horowitz 与
              Breakthrough Energy Ventures 参投的 $195 million Series C 轮融资，投后估值突破 $1.0
              billion，跻身独角兽行列。2024年末至2025年初，KoBold 完成由 Durable Capital Partners 与 T. Rowe Price 联合领投的 $537 million
              Series C 追加轮融资，投后估值达 $2.96 billion。随后在 late 2025 的第二轮追加融资中，公司在 $200 million 目标规模下完成至少 $163.4
              million，将投后二级市场估值基准推升至 $4.17 billion。投资财团涵盖顶尖跨界机构与工业矿业巨头，提供深厚资本渠道。然而，由此形成的股权结构表带来显著优先清算权负担（preference
              overhang），叠加商业化投产前所需数十亿美元资本开支，导致普通股持有人面临极高的获利门槛。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景分析、催化剂与尽调清单
        blocks:
          - type: paragraph
            body: >-
              KoBold 在乐观、基准与悲观运营情景下的估值结果跨度极大。乐观情景下，Mingomba 如期实现商业化投产，年产铜量超过数十万公吨，同时 AI 勘探引擎带来额外合资特许权分成，支撑起超过 $8.0
              billion 估值。基准情景下，Mingomba 顺利通过项目贷款与战略包销财团完成融资，但工期轻微滞后并伴随稀释性股权融资，私募估值稳定在当前约 $4.17 billion
              附近。悲观情景则假设铜价大幅下挫、遭遇东道国主权摩擦或许可审批严重拖延，导致资本搁浅并触发估值下调（down-round），估值跌向 $1.5 billion 底部支撑。鉴于关键可行性研究与商业化 AI
              命中率基准尚未公开披露，建议保持审慎跟踪（Track）立场，待 Mingomba 银行级可行性研究（BFS）公布具体的资本开支与运营成本测算后，再行配置资本。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV009
              - CV010
