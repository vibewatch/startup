chapter:
  number: 5
  title: Product & Technology
  summary: Saviynt's public evidence supports a broad enterprise identity-governance control plane with a large integration ecosystem and active use across lifecycle, certification, cloud, privileged-access, and non-human-identity workflows. The same evidence shows that implementation depends on architecture, customization, testing, and ongoing connector operations, while vendor-owned reliability, security-assurance, and performance data remain diligence gaps.
sections:
  - id: product-footprint-and-customer-workflow
    title: Product Footprint and Customer Workflow
    body: >-
      Saviynt describes its product as cloud-first identity governance and access management, while
      its current public pages and customer-side implementation signals show a broader control plane
      for identity lifecycle, access requests, certifications, entitlement governance, and cloud
      access. Saviynt says it secures more than 100 million identities, but that figure is a
      company claim without a disclosed customer, tenant, or active-identity denominator. The
      Exchange solutions collection displayed 479 entries when reviewed; this is a catalog listing
      count, not a count of production-certified connectors or customers. A company-hosted Hertz
      testimonial also describes real-time discovery and automated onboarding of AI agents, which
      demonstrates the intended workflow but does not independently validate performance at scale.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE015
    tableRefs:
      - TE001
  - id: integration-and-operating-architecture
    title: Integration and Operating Architecture
    body: >-
      The observable architecture is integration-led rather than a self-contained identity system.
      Public catalog entries describe REST-based visibility, provisioning, and governance, while
      customer and implementer job specifications add SCIM, JDBC, directories, HR systems, cloud
      IAM, SAP, ServiceNow, CyberArk, and custom applications. Those sources support a layered
      operating model: authoritative identity and entitlement sources feed connectors; Saviynt
      applies lifecycle, request, certification, role, and policy workflows; downstream systems
      receive provisioning or remediation actions; and implementation teams produce audit evidence
      and operational documentation. The sources do not expose Saviynt's internal multi-tenant data
      model or deployment topology, so the architecture map is a sourced operating abstraction, not
      a claim about proprietary internals.
    claimRefs:
      - CE005
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: deployment-maturity-and-differentiation
    title: Deployment Maturity and Differentiation
    body: >-
      The strongest external maturity signal is not a benchmark but the specificity of live
      enterprise implementation roles. Wells Fargo describes expansion of Enterprise Identity
      Cloud and migration from legacy governance platforms; Avantor seeks architecture spanning
      HRMS, Active Directory, Azure AD, SAP, cloud systems, and custom applications; and Arkhya
      describes GCP, Delinea, service-account, and non-human-identity governance. Together these
      sources indicate production-oriented demand for Saviynt skills, but they also show that value
      realization depends on requirements mapping, custom workflows, integration design, testing,
      production readiness, and documentation. Saviynt's differentiation is therefore ecosystem and
      governance breadth, offset by an implementation burden that remains material for complex or
      disconnected estates.
    claimRefs:
      - CE006
      - CE007
      - CE010
      - CE011
      - CE012
      - CE013
    tableRefs:
      - TE002
  - id: trust-controls-and-diligence-gaps
    title: Trust Controls and Diligence Gaps
    body: >-
      Customer and practitioner sources show that Saviynt deployments are expected to support
      segregation of duties, access reviews, least privilege, audit evidence, regulatory workflows,
      rollback planning, and operational runbooks. That is evidence of control requirements around
      the platform, not proof that Saviynt itself meets a particular uptime, throughput, privacy, or
      security-certification threshold. The retained source set contains no vendor-owned service
      level history, independent performance benchmark, public incident chronology, penetration-test
      result, or current certification artifact. Technical underwriting should therefore treat
      reliability and assurance as open evidence requests and should separately test the support and
      maintenance boundaries among Saviynt-authored, community-authored, and partner-authored
      Exchange assets.
    claimRefs:
      - CE013
      - CE014
      - CE015
tables:
  - id: TE001
    title: Product Module and Asset Matrix
    columns:
      - Module / asset
      - Buyer or user
      - Evidence-backed status
      - Differentiation
      - Diligence gap
    rows:
      - - Enterprise Identity Cloud governance workflows
        - IAM, security, risk, and compliance teams
        - Active enterprise implementation and expansion signal
        - Lifecycle, requests, certifications, entitlements, and policy workflows in one operating surface
        - Public evidence does not separate standard modules from licensed or customized capabilities
      - - Exchange connector and solution ecosystem
        - Application owners and integration engineers
        - Current catalog with Saviynt, community, and partner-authored entries
        - Broad coverage of enterprise applications, legacy systems, cloud services, and accelerators
        - Catalog presence does not establish production adoption, certification depth, or support ownership
      - - Cloud and non-human-identity governance
        - Cloud security and identity architecture teams
        - Current implementation scope in GCP and customer testimonial evidence
        - Human, service-account, workload, API, machine, and AI-agent identities can enter governance workflows
        - No independent benchmark validates discovery completeness or real-time enforcement
      - - Migration, onboarding, testing, and remediation accelerators
        - Implementation partners and platform operations teams
        - Partner solutions are listed in the current Exchange
        - Reusable tooling can reduce manual migration, testing, onboarding, and remediation work
        - Adoption, maintenance cadence, and realized time savings are not disclosed
    notes: "Status reflects public catalog and implementation evidence reviewed on 2026-10-06; catalog counts and supplier descriptions do not prove deployment, certification, or measured outcomes."
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
      - CE010
      - CE015
  - id: TE002
    title: Workflow and Use-Case Table
    columns:
      - User job
      - Prior or current workflow
      - Saviynt role
      - Publicly evidenced benefit
      - Limitation
    rows:
      - - Onboard applications and identities
        - Connect HR, directory, cloud, SaaS, and custom-system records
        - Apply connectors, lifecycle rules, requests, provisioning, and reconciliation
        - Automation and centralized governance are described; no cycle-time metric is public
        - Custom or disconnected applications can require bespoke connectors and data mapping
      - - Review and certify access
        - Aggregate entitlements, ownership, roles, and approval context
        - Run access reviews, certifications, policy checks, and remediation workflows
        - Customer-side evidence confirms these capabilities are in active implementation scope
        - Review quality, false-positive rates, and revocation completion rates are not disclosed
      - - Govern GCP and non-human identities
        - Inventory projects, groups, roles, service accounts, workloads, APIs, machines, and AI agents
        - Coordinate lifecycle, ownership, certification, time-bound access, and credential controls
        - The scope joins identity governance with cloud IAM and PAM workflows
        - Discovery coverage and runtime enforcement remain unbenchmarked
      - - Migrate and operate a legacy IGA estate
        - Translate existing access models, workflows, and application integrations
        - Configure Saviynt, test integrations, prepare deployment, and document operations
        - Partner accelerators and enterprise roles indicate a repeatable migration ecosystem
        - The sources also indicate substantial architecture, testing, and support effort
    notes: "Benefits are qualitative unless explicitly stated; no retained source provides comparable deployment-time, error-rate, uptime, or throughput measurements."
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE013
  - id: TE003
    title: Technology and Operating Architecture Table
    columns:
      - Layer or component
      - Role
      - Evidenced dependency
      - Principal risk
    rows:
      - - Authoritative sources and target systems
        - Supply identity, entitlement, ownership, role, and application data
        - HRMS, Active Directory, Azure AD, SAP, GCP, SaaS, and custom applications
        - Source-data quality and inconsistent ownership can weaken downstream governance
      - - Connector and integration layer
        - Aggregate, reconcile, provision, and exchange lifecycle events
        - REST, SCIM, JDBC, APIs, ticketing systems, PAM platforms, and custom connectors
        - Customization, authentication changes, and external API behavior create maintenance load
      - - Governance and workflow layer
        - Apply access requests, certifications, roles, policies, SoD, and remediation
        - Configured workflows, rules, analytics, dashboards, and access models
        - Configuration complexity can make control behavior difficult to test and explain
      - - Deployment and operations layer
        - Test, release, monitor, document, and support the implementation
        - Architecture reviews, production-readiness checks, rollback plans, runbooks, and audit evidence
        - Reliability and support outcomes depend on customer and partner operating discipline
    notes: "This is an evidence-backed operating model inferred from catalog descriptions and customer or implementer role specifications, not a representation of Saviynt's proprietary internal topology."
    claimRefs:
      - CE005
      - CE009
      - CE011
      - CE012
      - CE013
      - CE014
figures:
  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: Evidence-backed layers through which enterprise identity data becomes governed access decisions and operational evidence.
    data:
      layers:
        - label: Identity and ownership inputs
          detail: HRMS, directories, account owners, identity attributes, and lifecycle events
          items:
            - HRMS
            - Active Directory and Azure AD
            - Identity ownership records
        - label: Applications and infrastructure
          detail: Enterprise SaaS, SAP, custom applications, cloud resources, and privileged systems
          items:
            - SAP and enterprise applications
            - GCP and other cloud systems
            - Custom and disconnected applications
        - label: Connector and protocol adapters
          detail: Integration paths described in catalog and implementation sources
          items:
            - REST and SCIM
            - JDBC and APIs
            - Custom connectors
        - label: Aggregation and reconciliation
          detail: Identity, account, entitlement, role, and access-state collection
          items:
            - Entitlement inventory
            - Ownership and role models
            - Reconciliation
        - label: Governance workflows
          detail: Lifecycle, requests, certifications, policies, SoD, and remediation
          items:
            - Joiner, mover, and leaver workflows
            - Access reviews and certifications
            - Policy and remediation rules
        - label: Operations and evidence
          detail: Testing, deployment readiness, documentation, dashboards, and audit support
          items:
            - Test and release controls
            - Runbooks and operational procedures
            - Audit evidence and reporting
    approximationNotes: "Conceptual operating stack derived from retained public evidence; it does not disclose or assert Saviynt's proprietary internal deployment topology."
    claimRefs:
      - CE005
      - CE008
      - CE010
      - CE011
