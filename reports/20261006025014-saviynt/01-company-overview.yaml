      whyItMatters: >-
        The assigned adverse search returned no retained URLs, and absence of evidence does not
        establish absence of incidents or liabilities.
      diligencePath: >-
        Run jurisdiction-specific court and regulator checks, request the litigation schedule and
        incident register, and review cyber-insurance claims and customer notices.
      relatedQuestionRefs: [QO009]
    - type: private-evidence-only
      severity: material
      topic: private-market
