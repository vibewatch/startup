callouts:
  - calloutType: risk
    title: Founder-chair concentration
    body: >-
      Combining founder, CEO, and chair roles can accelerate decisions but raises succession and
      board-independence questions that public leadership pages cannot resolve.
    claimRefs: [CO004, CO005]
  - calloutType: insight
    title: Scale metrics are directional
    body: >-
      ARR, revenue, customers, identities, and employees use different denominators and vintages;
      they should not be combined into a growth rate without underlying financial and operating data.
    claimRefs: [CO011, CO012, CO013, CO014, CO015]
