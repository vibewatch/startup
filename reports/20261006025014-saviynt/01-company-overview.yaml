company:
  name: Saviynt
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Saviynt is a private, founder-led identity-security platform company founded in 2010 and
    headquartered in El Segundo. Its December 2025 financing established an approximately
    $3 billion valuation and supplied substantial growth capital, but current audited revenue,
    consolidated headcount, cap-table rights, and private-market liquidity remain undisclosed
    or dependent on non-audited third-party estimates.
sections:
  - id: identity-product-and-scale
    title: Identity, product, and reported scale
    body: >-
      Saviynt was founded in 2010 and is headquartered in El Segundo, California. It sells a
      cloud identity-security platform spanning identity governance, privileged access,
      application access governance, identity-security posture management, external identity,
      and human, non-human, and AI-agent access. The official marketplace also shows an
      integration-led extension model through Saviynt, partner, and community applications.
      Saviynt says it secures more than 100 million identities, while a company-sourced January
      2026 article reported more than 600 global enterprise customers and penetration of more
      than 20% of the Fortune 100. Those measures describe identities and accounts rather than
      revenue, and neither establishes active-customer retention or audited financial scale.
    claimRefs: [CO001, CO002, CO003, CO011, CO013]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance concentration
    body: >-
      The official leadership page places founder Sachin Nayyar in the combined roles of chief
      executive and board chair, with Paul Zolfaghari as president and Shankar Ganapathy as
      chief operating officer. The role combination gives Saviynt a clear strategic center but
      also concentrates operating and board leadership in one founder. The public material does
      not provide committee charters, voting rights, succession plans, or a complete ownership
      schedule, so governance independence cannot be inferred from the displayed board roster.
      The decision-relevant leadership table is therefore a selected map rather than a complete
      executive or director census, and investor diligence should test succession depth and the
      practical authority of investor-appointed directors.
    claimRefs: [CO004, CO005]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital history and stakeholder alignment
    body: >-
      Public databases describe a financing path from a $40 million 2018 round through $130
      million of 2021 financing and $205 million of 2023 venture debt, followed by the announced
      $700 million Series B growth-equity financing in December 2025 at approximately a $3
      billion valuation. KKR led the latest announced round, with Sixth Street Growth,
      TenEleven, and existing investor Carrick participating. This is funding raised, not cash
      available: debt repayment, primary-versus-secondary proceeds, fees, and deployed capital
      are not disclosed. Provider totals also diverge, so the capitalization table and round
      documents are necessary before treating any lifetime-funding figure as definitive.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: disclosure-and-diligence
    title: Disclosure limits and investability
    body: >-
      March 2025 reporting quoted Saviynt's COO saying annual recurring revenue exceeded $200
      million and customer count exceeded 500. A separate company-data provider lists 2026
      revenue of $183.4 million and 1,743 employees, but it does not provide audited statements,
      methodology, or a comparable ARR definition. Revenue is not ARR, and the figures should
      not be reconciled into a synthetic growth rate. Forge reports no available price and
      limited market activity, which is an adverse liquidity signal rather than proof of an IPO
      timetable or fair value. Current audited revenue, margins, cash balance, burn, runway,
      customer concentration, employee denominator, legal exposure, and outage history remain
      concrete diligence gaps.
    claimRefs: [CO012, CO014, CO015, CO016]
