callouts:
  - calloutType: "risk"
    title: "Converged Identity Platform Implementation Drag"
    body: "While converging IGA, PAM, and application governance into a single cloud control plane eliminates vendor sprawl, it introduces significant deployment friction. Multi-quarter onboarding cycles, heavy reliance on systems integrators, and complex policy engineering create severe operational delivery risks for enterprise identity teams."
    claimRefs:
      - "CR006"
      - "CR007"
  - calloutType: "insight"
    title: "Non-Human Identity (NHI) Governance as an Emerging Risk Frontier"
    body: "With machine identities outnumbering human accounts by 25x to 50x and only 20% of enterprises enforcing formal offboarding for API keys, unmonitored NHI sprawl represents a critical attack surface. Saviynt's long-term enterprise defensibility depends on governing machine and AI-agent credentials without compounding operational complexity."
    claimRefs:
      - "CR013"
      - "CR014"
