company:
  name: "Saviynt"
chapter:
  number: 8
  title: "Valuation"
  summary: "Saviynt's December 2025 financing established an approximately $3 billion valuation, but the public valuation bridge rests on a third-party $200 million metric whose own methodology allows revenue, run-rate revenue, or ARR. The appropriate stance is research-more: operating scale is credible enough to merit diligence, while audited economics, transaction terms, and a reliable capital history are still required to underwrite price or returns."
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and Price Discipline"
    body: >-
      The recommendation is research-more with medium confidence, high information risk, and a
      stretched-to-unsubstantiated valuation stance at the approximately $3 billion mark. The
      financing itself is well supported: Saviynt announced a $700 million Series B Growth Equity
      Financing led by KKR at that valuation, and independent databases repeat the mark. The
      underwriting bridge is much weaker. Multiples reports a $200 million figure and a 15.0x
      revenue multiple, while explicitly warning that round-linked figures may represent run-rate
      revenue, reported LTM revenue, or ARR. Without audited revenue, retention, cash-flow data, and
      transaction preferences, neither entry returns nor downside protection can be quantified
      responsibly.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV005"
      - "CV006"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-record-and-data-quality"
    title: "Financing Record and Data Quality"
    body: >-
      Public records do not reconcile into a dependable capitalization history. Tracxn reports
      $870 million raised across four rounds, including a $205 million venture-debt transaction in
      January 2023, whereas FundedIQ reports $149 million across two rounds and identifies a
      $19.3 million Series B in August 2026. The latter record conflicts with both Saviynt's own
      December 2025 announcement and other independent trackers. That conflict is not evidence of
      new cash, a down round, or an amended financing; it is evidence that aggregator data cannot
      substitute for signed closing documents. The primary-secondary split, outstanding debt,
      liquidation preferences, participation rights, and fully diluted ownership remain material
      diligence gaps.
    claimRefs:
      - "CV001"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
  - id: "thesis-and-scenario-logic"
    title: "Thesis, Anti-Thesis, and Scenario Logic"
    body: >-
      The investable thesis is scale plus platform breadth: Saviynt reported more than 600 global
      enterprise customers, over 20% of the Fortune 100, and more than 100 million identities
      secured; its Exchange also shows company, community, and implementation-partner solutions
      spanning migration, testing, governance, and application connectors. The anti-thesis is that
      these adoption signals do not establish recurring revenue quality, margin durability, or
      cash generation. Bull, base, and bear cases therefore remain conditional rather than
      numerical. A bull case requires verified durable growth and clean terms; the base case
      preserves optionality but does not underwrite the current mark; the bear case is triggered if
      the $200 million metric or customer economics fail verification.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV002"
      - "TV003"
  - id: "exit-readiness-and-diligence-gates"
    title: "Exit Readiness and Diligence Gates"
    body: >-
      The assigned evidence supports neither an IPO timetable nor a model-ready exit valuation.
      LinkedIn displays 1,743 associated employees and a company size band of 1,001-5,000, which
      suggests organizational scale but is not a verified payroll count. UpGuard describes
      continuous external monitoring through more than 330 checks, yet the fetched public page
      does not disclose Saviynt's actual rating; this cannot prove either the presence or absence
      of a security incident. Final diligence should require audited financials, cohort retention,
      customer concentration, the complete capitalization and debt schedule, preference terms,
      primary-secondary proceeds, security findings, and management's credible exit path. Failure
      to reconcile these items is a thesis-break condition.
    claimRefs:
      - "CV014"
      - "CV015"
      - "CV016"
