callouts:
  - calloutType: "recommendation"
    title: "Price Acceptance Requires Primary Evidence"
    body: "The approximately $3 billion mark is a transaction fact, not proof of fair value. Investment approval should remain gated on audited economics and the actual preference waterfall."
    claimRefs:
      - "CV001"
      - "CV016"
  - calloutType: "risk"
    title: "Do Not Resolve Conflicting Trackers by Assumption"
    body: "FundedIQ and Tracxn report materially different capital histories. The discrepancy should be carried as a diligence gap rather than interpreted as a new round, a down round, or cash available."
    claimRefs:
      - "CV007"
      - "CV009"
      - "CV010"
      - "CV011"
