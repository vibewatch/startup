  - id: "TV003"
    title: "Bull, Base, and Bear Scenario Framework"
    columns:
      - "Scenario"
      - "Required Assumptions"
      - "Valuation / Return Logic"
      - "Probability Signal"
      - "Downside Trigger"
    rows:
      - - "Bull"
        - "Audited recurring revenue supports durable growth; retention and margins are strong; terms are clean"
        - "The current mark becomes more defensible only if verified scale lowers the effective multiple and supports future cash generation"
        - "Positive only after audited economics and cohort evidence"
        - "Growth, retention, or margin evidence falls short of management representations"
      - - "Base"
        - "Operating scale is real, but economics and transaction structure remain private"
        - "No target valuation or return can be calculated; preserve optionality and defer price acceptance"
        - "Current public evidence most closely fits this case"
        - "Data-room access does not reconcile revenue, debt, and capitalization"
      - - "Bear"
        - "The $200M metric is not comparable revenue, customer economics weaken, or senior claims materially reduce common proceeds"
        - "Downside is not bounded by the public record, so false precision would understate risk"
        - "Conflicting tracker data and undisclosed terms are existing warning signals"
        - "Verified economics imply multiple compression or the preference waterfall impairs common returns"
    notes: "Scenarios are deliberately non-numeric because the assigned public evidence does not support forecast revenue, probability percentages, exit multiples, or valuation ranges."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV008"
      - "CV011"
      - "CV016"
