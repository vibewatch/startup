figures:
  - id: FU001
    title: Enterprise customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public evidence supports a sponsor-led path into recurring governance workflows, while renewal
      and expansion economics remain undisclosed.
    data:
      items:
        - label: "Modernization trigger"
          detail: "Legacy IGA, audit burden, fragmented access, or compliance pressure creates demand."
          touchpoints:
            - "Security strategy"
            - "Compliance program"
        - label: "Executive sponsorship"
          detail: "Information-security and IT directors lead the buying center."
          touchpoints:
            - "CISO / CIO"
            - "IT director"
        - label: "Practitioner adoption"
          detail: "IAM analysts configure lifecycle, access-review, role, and application workflows."
          touchpoints:
            - "IAM analyst"
            - "Application owner"
        - label: "Initial governance deployment"
          detail: "Provisioning, deprovisioning, certification, and attestations become recurring workflows."
          touchpoints:
            - "HR and directory integration"
            - "Access certification"
        - label: "Application and control expansion"
          detail: "Exchange connectors, risk rules, migration tools, and partner services extend the footprint."
          touchpoints:
            - "Saviynt Exchange"
            - "Implementation partners"
        - label: "Renewal evidence gap"
          detail: "NRR, GRR, churn, contract duration, expansion revenue, and concentration are not public."
          touchpoints:
            - "Renewal review"
            - "Data-room diligence"
    approximationNotes: >-
      The sequence is an evidence-based operating model, not a measured funnel; no conversion rates or
      stage populations are implied.
    claimRefs: [CU006, CU010, CU011, CU013, CU014, CU015, CU016]
callouts:
  - calloutType: strength
    title: Enterprise fit is visible across independent datasets
    body: >-
      Multiple technographic providers independently identify large, regulated, and globally distributed
      organizations as Saviynt users, and two providers overlap on McKesson and Shell.
    claimRefs: [CU003, CU004, CU005, CU009]
  - calloutType: risk
    title: Retention and concentration are not underwritten
    body: >-
      No reviewed public source provides cohort retention, renewal, contract-duration, expansion-revenue,
      or customer-concentration data; these metrics require company-provided evidence.
    claimRefs: [CU016]
