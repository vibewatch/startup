schemaVersion: "report-v2"
artifact: customers
slug: saviynt
runDate: 2026-10-06
company:
  name: Saviynt
chapter:
  number: 6
  title: Customers
  summary: >-
    Public technographic evidence consistently places Saviynt in large, complex enterprises, while
    named implementation records show identity-governance deployments across healthcare, energy,
    automotive, consumer goods, and professional services. The evidence is materially weaker on
    production outcomes, renewals, churn, contract duration, and customer concentration, so customer
    durability remains a diligence gap rather than a demonstrated strength.
sections:
  - id: customer-shape
    title: Enterprise customer shape and buying center
    body: >-
      The observable customer footprint is enterprise-weighted. Bloomberry's analyzed set of 400
      companies is concentrated in organizations above 1,000 employees, while Apps Run The World's
      disclosed 14-entry sample is entirely above that threshold and mostly above 10,000 employees.
      The two datasets are not population-equivalent and should not be blended, but both point toward
      complex organizations rather than a broad small-business motion. Job-posting analysis places
      IAM analysts in the daily-user role and information-security or IT directors in the buying
      center. Landbase identifies the United States as the largest geography and names business
      services, software/IT, manufacturing, software, and finance as common sectors; this is
      directional technographic evidence, not audited customer segmentation.
    claimRefs: [CU003, CU004, CU005, CU006, CU015]
    tableRefs: [TU001]
  - id: adoption-and-reference-proof
    title: Adoption scale and named reference proof
    body: >-
      Saviynt says its platform secures more than 100 million identities, but the statement provides
      neither a customer denominator nor a disclosed measurement date. Third-party estimates also
      differ: Landbase reports 607 verified companies on a page last updated in August 2025, whereas
      Bloomberry describes analysis of 400 detected companies. These values measure vendor-specific
      datasets rather than a reconciled active-customer population. Named evidence is more useful:
      McKesson and Shell appear in both Landbase and Apps Run The World, and the latter describes
      implementations at AutoNation, Cross Country Healthcare, and Diageo India. Those records support
      real deployment activity, but most lack customer-authored confirmation, current deployment
      status, or quantified business outcomes.
    claimRefs: [CU001, CU002, CU007, CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability, outcomes, and concentration remain unproven
    body: >-
      The reviewed public sources do not disclose net or gross revenue retention, renewal rates,
      cohort churn, average contract length, customer concentration, or revenue by segment. That
      absence prevents a defensible conclusion about whether the large-enterprise footprint converts
      into durable recurring economics. Even detailed implementation descriptions tend to emphasize
      configured workflows rather than measured results; the Diageo India record explicitly avoids a
      quantified business outcome. The official customer page presents a VF Corporation modernization
      story but the fetched page does not expose the case-study details needed to classify it as a
      production deployment or assess realized value. Data-room evidence should therefore control any
      retention or concentration underwriting.
    claimRefs: [CU008, CU012, CU016]
  - id: expansion-and-friction
    title: Expansion surfaces exist, but implementation effort is visible
    body: >-
      Saviynt's Exchange shows a plausible expansion path from an initial governance deployment into
      more applications, risk rules, privileged-access connectors, testing, migration, and managed
      implementation services. The same catalog also reveals friction: partners market accelerators
      for legacy migration, application onboarding, reconciliation, and testing because these are
      operationally demanding programs. A third-party case-study index says Saviynt built a one-stop
      customer portal and improved its own account-matching and pipeline operations, which indicates
      investment in enterprise customer operations but does not prove customer retention. The likely
      journey is sponsor-led modernization, practitioner adoption, application expansion, and
      recurring governance workflows; renewal evidence remains private.
    claimRefs: [CU006, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
