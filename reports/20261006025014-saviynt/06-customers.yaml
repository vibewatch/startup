  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: named-customer-outcomes
      missingEvidence: >-
        Customer-authored production confirmation, deployment dates, scoped user or application counts,
        and quantified security, compliance, efficiency, or cost outcomes for named references.
      whyItMatters: >-
        Vendor and technographic listings establish names but do not prove present production status,
        realized value, or reference quality.
      diligencePath: >-
        Request three reference calls and corresponding implementation summaries, renewal records, and
        before-and-after KPI evidence from Saviynt.
      relatedQuestionRefs: [QU005]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        NRR, GRR, logo churn, renewal rate, contract duration, cohort expansion, top-10 customer revenue
        share, and partner- or channel-attributed revenue.
      whyItMatters: >-
        Without these measures, the durability and concentration of enterprise customer economics cannot
        be distinguished from gross adoption signals.
      diligencePath: >-
        Obtain quarterly cohort schedules for the last three years, a customer-level ARR bridge, renewal
        and churn reasons, contract terms, and top-customer concentration from the data room.
      relatedQuestionRefs: [QU006]
    - type: conflicting-data
      severity: material
      topic: customer-count
      missingEvidence: >-
        A company-defined active-customer count reconciled to third-party estimates, including the
        definition of active, paid, production, pilot, subsidiary, and churned accounts.
      whyItMatters: >-
        Public datasets report different populations and vintages, so none can be used as a clean active
        customer denominator.
      diligencePath: >-
        Reconcile CRM account records to billing and production telemetry, then provide a dated customer
        count by status, geography, segment, and ARR band.
      relatedQuestionRefs: [QU009]
      relatedTableRefs: [TU002]
