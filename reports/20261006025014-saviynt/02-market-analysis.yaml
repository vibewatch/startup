company:
  name: "Saviynt"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Saviynt competes primarily for enterprise identity-governance budgets, with PAM, posture management, non-human identity, and AI-agent governance as adjacent expansion areas. One allocated secondary synthesis places the 2024 global IGA market at $7.29B-$8.85B with approximately 14%-15% CAGR, but the available evidence does not support a defensible Saviynt-specific SAM or SOM."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Substitutes"
    body: >-
      Saviynt's core market is cloud-delivered enterprise identity governance and
      administration: lifecycle provisioning, access certification, entitlement-risk
      review, policy enforcement, and governance across many applications and identities.
      Privileged access, posture management, application access governance, non-human
      identity, and AI-agent controls are adjacent expansion pools rather than a license
      to count all identity or cybersecurity spend as TAM. General SSO, MFA, network
      security, endpoint security, and generic CASB spend should therefore be excluded
      unless a buyer explicitly reallocates those budgets to a converged identity
      platform. Status-quo substitutes include manual certifications, scripts, fragmented
      point tools, and legacy IGA deployments; each can defer a platform purchase even
      when it does not provide equivalent control depth.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM015"
    tableRefs:
      - "TM001"
  - id: "sizing-and-evidence-quality"
    title: "Sizing Lenses and Evidence Quality"
    body: >-
      The only allocated source that aggregates global IGA forecasts reports a 2024
      range of $7.29B-$8.85B and an approximate 14%-15% CAGR through the end of the
      decade. That range is useful as a broad category reference, not as a precise
      investment-grade TAM: the fetched document is an autonomous secondary synthesis,
      and the underlying analyst reports and methodologies were not part of this
      chapter's evidence pool. Other scale indicators use incompatible denominators.
      Saviynt says it secures more than 100 million identities, while 6sense reports
      more than 1,303 companies under a CASB taxonomy and Tracxn counts 318 active
      competitors in a broader identity market. None is revenue, SAM, SOM, or verified
      customer count, so these measures cannot be converted into market share.
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM010"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption-path"
    title: "Buyers, Users, Payers, and Adoption Path"
    body: >-
      The best-supported buyer is a large enterprise with compliance-heavy processes,
      rapid cloud adoption, or fragmented legacy IAM. The economic sponsor is generally
      the CISO, CIO, or enterprise security and IT organization; IAM teams administer
      the platform, while application owners, managers, auditors, and risk teams
      participate in access reviews and exceptions. Adoption commonly starts with
      high-risk applications or lifecycle workflows, then expands through connectors,
      certifications, privileged workflows, and posture remediation. The Exchange
      illustrates a partner and community ecosystem around migration, testing, and
      application onboarding, but those listings remain company-issued evidence rather
      than independent proof of deployment outcomes. Current contract pricing, packaging,
      and the budget split between software and implementation remain undisclosed in the
      assigned evidence.
    claimRefs:
      - "CM011"
      - "CM014"
      - "CM015"
      - "CM016"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation-relevance"
    title: "Drivers, Constraints, and Valuation Relevance"
    body: >-
      Demand is supported by cloud and hybrid complexity, recurring certification and
      audit work, least-privilege programs, and the extension of governance from people
      to privileged, machine, and AI-agent identities. The same evidence also points to
      a long adoption curve. Saviynt's Zero Trust guidance says transition requires
      significant investment and describes a three-to-five-year journey, while an
      independent procurement guide flags planning overhead, integration sequencing,
      data quality, policy ownership, and sustained operational tuning. These constraints
      make implementation capacity and time-to-value as important as category growth.
      For valuation, the broad market CAGR supports demand durability, but no public
      Saviynt-specific SAM, pricing schedule, win rate, or spend capture was available;
      underwriting should therefore use verified contracts and cohort economics rather
      than apply the broad market range directly to company revenue.
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM016"
