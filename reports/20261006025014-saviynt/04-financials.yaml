          detail: "Official surfaces describe cloud-first identity governance and access management."
        - id: "usage"
          label: "Usage scale"
          detail: "Company claims more than 100M identities; third-party coverage reports more than 600 enterprise customers."
        - id: "pricing"
          label: "Pricing architecture"
          detail: "Quote-based identity, application, and module inputs are reported only by a low-reputation derivative source."
        - id: "recurring"
          label: "Recurring revenue signals"
          detail: "FY2024 ARR above $200M and 88% subscription mix are reported but unaudited in retained evidence."
        - id: "margin"
          label: "Margin and retention"
          detail: "Near-80% subscription gross margin and 111% NRR are reported but lack cohort and accounting support."
        - id: "cash"
          label: "Cash economics"
          detail: "Positive cash EBITDA is reported; cash balance, burn, capex, debt terms, and runway remain unavailable."
    approximationNotes: "Ordered evidence-strength bridge, not a quantitative conversion funnel; metrics use different denominators and no conversion rates are implied."
    claimRefs: ["CI005", "CI006", "CI009", "CI010", "CI012", "CI013", "CI014", "CI015"]
callouts:
  - calloutType: "risk"
    title: "Funding data requires reconciliation"
    body: "Tracxn's stated $870M aggregate conflicts with the $1.075B sum of the four amounts on its own round table. Financing type, primary-secondary mix, and cash availability must be reconciled before the number is used."
    claimRefs: ["CI001", "CI002", "CI003"]
  - calloutType: "recommendation"
    title: "Underwrite from source documents, not headline metrics"
    body: "Request audited financial statements, ARR and retention definitions, contract cohorts, revenue recognition policies, a cash-and-debt schedule, and the latest financing documents before assigning a margin path or runway."
    claimRefs: ["CI009", "CI010", "CI011", "CI012", "CI013", "CI014", "CI015"]
