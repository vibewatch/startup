company:
  name: "Saviynt"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports a scaled enterprise identity-security footprint and reports improving FY2024 subscription economics, but the strongest operating metrics are derivative or company-reported rather than audited. A December 2025 growth round provides financing capacity, yet inconsistent aggregate funding data and missing cash, burn, debt-term, pricing, and cohort disclosures prevent a reliable runway or unit-economics underwriting."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and pricing remain only partially observable"
    body: >-
      Saviynt appears to monetize a broad enterprise identity-security platform, with
      modules, integrations, and partner-delivered implementation around the core
      software. A derivative profile reports that subscriptions represented 88% of
      FY2024 revenue and describes quote-based pricing tied to identities, connected
      applications, and enabled modules, but the assigned evidence contains no
      Saviynt list-price schedule, realized contract data, discount curve, or revenue
      recognition policy. The Exchange shows that migration and application
      onboarding can require specialized partner services, making the split between
      software revenue, Saviynt services, and partner economics an important unknown.
      Consequently, the apparent recurring model is plausible but cannot yet be
      converted into dependable ACV, revenue-mix, or gross-profit assumptions.
    claimRefs: ["CI007", "CI009", "CI013", "CI015"]
    tableRefs: ["TI001", "TI002"]
  - id: "traction-and-unit-economics"
    title: "Usage scale is visible; audited unit economics are not"
    body: >-
      Saviynt says it secures more than 100 million identities, while a third-party
      funding article reports more than 600 enterprise customers globally. Those
      figures indicate material deployment scale but are not revenue, ARR, billings,
      or active paid-seat measures and cannot establish monetization per identity.
      A low-reputation derivative profile reports FY2024 ARR above $200 million,
      growth above 35%, retention above 100%, subscription gross margin near 80%,
      and positive cash EBITDA. RFP.wiki separately repeats the positive cash EBITDA
      signal but explicitly describes the detail as self-reported and unaudited.
      These metrics are useful diligence leads, not an audited basis for forecasting
      revenue quality, gross-margin durability, free cash flow, or CAC payback.
    claimRefs: ["CI005", "CI006", "CI008", "CI010", "CI011", "CI012", "CI013", "CI014"]
    tableRefs: ["TI003"]
  - id: "capital-adequacy"
    title: "Large financing capacity does not establish runway"
    body: >-
      Independent coverage reports a $700 million December 2025 growth-equity round
      at an approximately $3 billion valuation, with proceeds intended for product
      development, AI capabilities, integrations, and international commercial
      expansion. That financing likely increases strategic capacity, but funding
      raised is not cash available: the public evidence does not disclose primary
      versus secondary proceeds, closing cash, restricted cash, burn, debt balances,
      covenants, or planned annual deployment. The aggregate history is also internally
      inconsistent. Tracxn states $870 million raised across four rounds, while its
      own listed round amounts total $1.075 billion. Until management reconciles the
      scope and financing types, neither total capital raised nor runway should be
      used as a precise underwriting input.
    claimRefs: ["CI001", "CI002", "CI003", "CI004"]
  - id: "financial-verdict"
    title: "Financial verdict: promising signals, insufficient underwriting inputs"
    body: >-
      The available record is directionally consistent with an enterprise SaaS
      company that has meaningful usage, a partner-supported delivery model, and
      substantial recent financing. It does not support a defensible valuation model
      or capital-adequacy conclusion. Pricing architecture is uncorroborated, customer
      counts and identity counts lack contract-value denominators, and reported ARR,
      retention, margin, and cash EBITDA lack audited statements or cohort schedules.
      BreachHistory currently catalogs no public incident for Saviynt, but its
      disclosure-dependent catalog cannot prove the absence of an incident or quantify
      contingent exposure. Investment underwriting should therefore condition any
      revenue-quality or margin-path conclusion on audited financials, a revenue
      bridge, contract cohorts, cash and debt schedules, and a primary-secondary
      reconciliation for the latest round.
    claimRefs: ["CI005", "CI006", "CI009", "CI010", "CI011", "CI012", "CI013", "CI014", "CI015", "CI016"]
    figureRefs: ["FI001"]
