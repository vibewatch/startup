      - ["Implementation fees and discounts", "Not disclosed", null, "Low", "Partner-delivered work may obscure total customer acquisition and deployment cost", "Discount waterfall, services attach, partner economics, and implementation fee schedule"]
    notes: "No row is a verified list price; the quote basis and typical term come from a low-reputation derivative profile and require contract-level confirmation."
    claimRefs: ["CI007", "CI009", "CI015"]
  - id: "TI003"
    title: "Reported unit-economics and operating metrics"
    columns: ["Metric", "Reported value / status", "Period", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["ARR", "Exceeding $200M", "FY2024 year-end", "Low", "Potential recurring-revenue scale", "Audited ARR definition and monthly bridge to GAAP revenue"]
      - ["ARR growth", "More than 35% year over year", "FY2024", "Low", "Top-line momentum proxy", "Beginning/ending ARR bridge, FX, acquisitions, and churn"]
      - ["Subscription revenue mix", "88% of total revenue", "FY2024", "Low", "Recurring mix and operating leverage", "Audited revenue disaggregation and recognition policy"]
      - ["Contracted gross revenue retention", "Above 95%; 98% excluding downsell", "FY2024", "Low", "Base durability before expansion", "Cohort schedule, logo retention, and downsell definition"]
      - ["Net revenue retention", "111%", "FY2024", "Low", "Expansion versus churn balance", "Cohorts by customer size, geography, and product"]
      - ["Subscription gross margin", "Nearly 80%", "FY2024", "Low", "Cloud and support cost structure", "Audited COGS bridge, hosting, support, and services allocation"]
      - ["Cash EBITDA", "Reported positive", "FY2024", "Low", "Operating funding signal", "Reconciliation to net income, operating cash flow, capex, and free cash flow"]
    notes: "All numeric operating metrics are derivative reports of company-reported FY2024 results, not audited figures in the assigned pool; cash EBITDA is not cash burn or free cash flow."
    claimRefs: ["CI010", "CI011", "CI012", "CI013", "CI014"]
