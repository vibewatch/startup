  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Alternative
      - Public price or contract model
      - Included scope signal
      - Discount or unknown
      - Diligence implication
    rows:
      - - Saviynt
        - Custom enterprise quote; no official list price in reviewed evidence
        - Modular enterprise identity-security platform
        - Third-party estimates vary from $50 to $333 per user per year
        - Obtain module-level quote, services SOW, renewal caps, and realized peer invoices
      - - SailPoint
        - Custom quote; third-party benchmarks only
        - Tiered enterprise IGA with separately priced capabilities
        - Negotiated rates, identity basis, and services are deal-specific
        - Normalize identical modules, identities, connectors, and implementation scope
      - - Microsoft Entra ID Governance
        - "$7 per user per month add-on; requires Entra ID P1 or P2"
        - Governance add-on; Entra Suite reported at $12 per user per month
        - Existing Microsoft entitlements materially change incremental cost
        - Model prerequisite licenses and non-Microsoft connector work
      - - Okta Identity Governance
        - Competitor page estimates about $9 per user per month plus Workforce Identity
        - Governance layered on Okta Workforce Identity
        - Enterprise pricing, Workflows, and services remain custom
        - Validate an official quote; do not underwrite from competitor estimates
      - - Internal build or status quo
        - No platform list price
        - Scripts, manual reviews, and internal policy maintenance
        - Fully loaded labor, audit exposure, and key-person cost are unknown
        - Compare total operating cost and control quality, not license price alone
    notes: >-
      Prices preserve the source metric and prerequisite. Saviynt, SailPoint, and Okta
      figures are not comparable realized quotes; no annual contract value, discount,
      services scope, or renewal schedule was available.
    claimRefs:
      - CP006
      - CP007
      - CP009
      - CP010
      - CP014
figures:
  - id: FP001
    title: Distribution leverage versus heterogeneous-estate breadth
    type: quadrant
    summary: >-
      Analyst-authored ordinal map: higher x indicates greater installed-base distribution
      leverage, while higher y indicates broader governance across mixed cloud, SaaS, and
      legacy estates.
    data:
      points:
        - label: Saviynt
          x: 3.2
          y: 4.5
          detail: Broad cloud-first suite and partner ecosystem without Microsoft- or Okta-scale native distribution.
        - label: SailPoint
          x: 3.0
          y: 4.8
          detail: Deepest reviewed legacy coverage and mature enterprise channel, but no dominant IdP bundle.
        - label: Microsoft Entra ID Governance
          x: 5.0
          y: 3.0
          detail: Maximum Microsoft installed-base leverage with lower breadth outside that estate.
        - label: Okta Identity Governance
          x: 4.5
          y: 2.7
          detail: Strong Okta distribution with narrower reviewed governance depth.
        - label: Linx
          x: 1.8
          y: 3.5
          detail: Vendor-claimed unified modern coverage, but private scale and independent proof are gaps.
        - label: Lumos
          x: 1.7
          y: 3.2
          detail: Vendor-claimed rapid SaaS-heavy deployment with lower installed-base leverage.
    approximationNotes: >-
      Ordinal 1-5 synthesis, not vendor-reported measurements or an independent efficacy
      benchmark. Scores reflect relative positioning in the assigned sources; private
      scale and competitor-authored capability claims lower confidence.
    claimRefs:
      - CP004
      - CP005
      - CP011
      - CP015
      - CP016
callouts:
  - calloutType: risk
    title: Competitor criticism is not an independent benchmark
    body: >-
      Linx and Lumos provide useful adverse hypotheses on implementation time, services
      dependency, and module cost, but their commercial relationship makes those claims
      unsuitable as stand-alone underwriting evidence. Validate them with customer
      references, implementation SOWs, renewal invoices, and time-to-production data.
    claimRefs:
      - CP009
      - CP010
  - calloutType: recommendation
    title: Run a buyer-specific three-way proof
    body: >-
      Compare Saviynt with SailPoint and the incumbent identity stack on the same
      applications, identity populations, SoD policies, migration work, service hours,
      and three-year renewal assumptions. Add a focused challenger only where deployment
      speed or non-human identity governance is a decisive criterion.
    claimRefs:
      - CP004
      - CP006
      - CP015
      - CP016
