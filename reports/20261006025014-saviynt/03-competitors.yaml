    title: Buyer-criteria capability matrix
    columns:
      - Buying criterion
      - Saviynt
      - SailPoint
      - Microsoft Entra ID Governance
      - Okta Identity Governance
      - Internal or manual substitute
    rows:
      - - Enterprise IGA core
        - Broad; lifecycle, certification, SoD, and role governance described
        - Broad; closest direct peer
        - Core workflows within Entra
        - Core requests, certification, and lifecycle for Okta estates
        - Bespoke controls; completeness unknown
      - - Legacy and heterogeneous connectors
        - Broad catalog, but reviewed comparisons place it behind SailPoint on legacy depth
        - Strongest reviewed legacy and mainframe coverage
        - Strong Microsoft-native; thinner third-party coverage
        - Stronger in Okta-connected SaaS; broader depth unknown
        - Custom integration possible; effort and coverage unknown
      - - Privileged access
        - Cloud PAM is part of the broader product scope
        - Dedicated PAM is commonly paired separately
        - Privileged Identity Management within Microsoft scope
        - Assigned evidence does not establish full PAM depth
        - Custom vaulting and session controls are not established
      - - Non-human and AI-agent governance
        - Vendor-described modules and platform scope
        - Reviewed comparisons describe dedicated coverage
        - Limited mainly to Microsoft graph and workload identities
        - Reviewed comparisons describe early or limited coverage
        - Ownership and lifecycle controls are environment-specific and unknown
      - - Distribution advantage
        - Partner and exchange ecosystem
        - Mature integrator and enterprise procurement ecosystem
        - Native Microsoft installed base
        - Native Okta installed base
        - No vendor distribution; depends on internal staff
      - - Implementation burden
        - Competitors allege multi-month, specialist-led programs
        - Reviewed comparisons also describe multi-quarter programs
        - Lower lift inside Microsoft; third-party expansion adds work
        - Lower lift for existing Okta customers; net-new scope is unknown
        - Unbounded internal build and maintenance effort
    notes: >-
      Qualitative matrix, not a benchmark. Cells reflect the assigned sources' stated
      scope; competitor-authored assertions are labeled, and absent evidence is shown as
      unknown rather than scored as a feature gap.
