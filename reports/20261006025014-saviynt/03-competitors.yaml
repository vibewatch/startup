      - - SailPoint
        - Direct enterprise IGA peer
        - Public company after a reported $12.8B 2025 IPO valuation
        - Large, regulated, heterogeneous estates
        - Legacy, mainframe, and on-premises connector depth
        - Premium and services-intensive deployment profile in reviewed comparisons
      - - Microsoft Entra ID Governance
        - Identity-platform extension
        - Microsoft product line; standalone scale is not disclosed
        - Microsoft 365 and Azure-centric organizations
        - Installed-base distribution, native stack integration, and published pricing
        - Narrower governance outside the Microsoft estate
      - - Okta Identity Governance
        - Identity-platform extension
        - Standalone governance scale is not disclosed in the assigned evidence
        - Existing Okta Workforce Identity customers
        - Low-friction consolidation for Okta-managed applications
        - Governance depth and non-human identity coverage are described as narrower
      - - Linx and Lumos
