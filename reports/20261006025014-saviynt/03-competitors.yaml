        - Substitute operating model
        - No external funding or vendor scale applies
        - Teams retaining scripts, static roles, and spreadsheet reviews
        - Avoids a new platform contract and can fit bespoke workflows
        - Internal labor, stale policy, key-person, and audit risks are unbenchmarked
    notes: >-
      Partial market map based only on the assigned prefetched sources; private scale,
      realized pricing, and unsupported capabilities are explicitly marked as unknown.
      Competitor-authored comparisons are signals, not independent validation.
