      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据最充分的买方是大型企业：合规流程繁重、云化迅速，或仍有割裂的旧 IAM。经济决策人通常是 CISO、CIO 或企业安全与 IT 部门；IAM
              团队负责管理平台，应用负责人、经理、审计师和风险团队参与访问审查与例外处理。采用通常从高风险应用或生命周期流程开始，再通过连接器、认证、特权工作流和态势修复扩展。Exchange
              展示了围绕迁移、测试和应用接入的合作伙伴与社区生态，但这些列表是公司发布的证据，不是部署结果的独立证明。当前合同价格、产品打包方式，以及软件与实施之间的预算分配，在指定证据中仍未披露。
            claimRefs:
              - CM011
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
