              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              云与混合环境的复杂性、持续性的认证和审计工作、最小权限项目，以及治理对象从人扩展到特权、机器和 AI 代理身份，都在支撑需求。但同一批证据也显示采用周期很长。Saviynt
              的零信任指南称转型需要大量投入，周期为三到五年；一份独立采购指南则指出规划成本、集成顺序、数据质量、策略归属和持续运营调优都是难点。因此，实施能力和价值兑现速度与品类增长同样重要。估值上，广义市场 CAGR
              支持需求的持续性，但没有公开的 Saviynt 专属 SAM、价格表、赢单率或支出捕获数据；因此应采用经验证的合同和客户群经济性，而不是把宽泛市场区间直接套到公司收入上。
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
              - CM014
              - CM016
