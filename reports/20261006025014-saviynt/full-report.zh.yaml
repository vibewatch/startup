              的战略中心明确，但也把运营和董事会领导权集中在一位创始人手中。公开材料没有提供委员会章程、投票权、继任计划或完整持股表，因此不能仅凭展示的董事名单推断治理独立性。下表是与决策相关的领导层选录，不是完整的高管或董事名册；投资人尽调应检验继任梯队，以及投资人委派董事的实际权限。
