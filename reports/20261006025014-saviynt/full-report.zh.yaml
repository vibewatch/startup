  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、联邦认证与数据暴露态势
        blocks:
          - type: paragraph
            body: >-
              企业身份治理处在严格监管框架与安全合规要求的交汇处。Saviynt 将 Enterprise Identity Cloud（EIC）平台定位为合规加速器，并在租户基础设施中维持多项主要独立认证，包括 ISO
              27001:2022、云安全 ISO 27017、PCI-DSS v4.0 AOC，以及 SOC 1 Type II 和 SOC 2 Type II 报告
              [CR001]。其重要的竞争与运营差异化之一，是获得联邦机构受控非机密信息（CUI）的 FedRAMP Moderate 授权；公司过去一直把自己定位为云原生 IGA 和 PAM 供应商中的先行者
              [CR002]。此外，Saviynt 于 2024 年 5 月自愿加入 Cybersecurity and Infrastructure Security Agency（CISA）的 Secure by
              Design 承诺，与主要科技同行一道承诺加强产品安全实践 [CR003]。


              尽管具备这一合规基础，在高度受监管的客户环境中运营仍带来持续的法律和暴露责任。企业软件运营中，即使核心 SaaS 基础设施未被攻破，第三方生态事件也可能扩散风险。例如，Saviynt 承认受到 Klue
              第三方网络安全事件影响：未经授权的一方攻破了多个客户 Salesforce 实例；Saviynt 确认其生产软件、核心服务和客户数据未受影响，但其 Salesforce 实例中的内部销售数据暴露了
              [CR004]。独立学术分析指出，将企业环境迁移到 Saviynt 需要大规模迁移身份和访问权限，必须持续严格审计并治理角色，避免合规失误或无意中过度配置 [CR005]。随着监管机构依据
              SOX、HIPAA、GDPR 和 NIS2 加大对访问控制的处罚，租户隔离或策略执行的任何失效仍是重大法律风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
      - number: '7.2'
        title: 运营复杂性、实施拖累与云基础设施韧性
        blocks:
          - type: paragraph
            body: >-
              Saviynt 及其企业客户面临的核心运营挑战，是融合身份平台固有的实施摩擦和管理复杂性。独立评估与市场分析显示，2026 年对 Saviynt
              替代方案的判断越来越看重部署摩擦、治理深度和运营模式，而不只是功能清单的广度
              [CR006]。把身份生命周期管理、访问认证、特权访问管理（PAM）和应用访问治理捆绑进统一控制平面，虽能减少多供应商工具蔓延，却显著扩大初始实施范围、对系统集成商（SI）的依赖和持续运营负担
              [CR007]。当部署周期跨越多个季度，审计期限和客户工程约束就会把软件架构决策变成严重交付风险 [CR007]。


              从业者在数据建模、连接器配置和分析查询中经常遇到运营障碍。技术从业者反馈显示学习曲线陡峭、报表界面令人沮丧，尤其是在复杂数据环境中编写自定义 SQL 分析查询、而错误诊断又不够有用时
              [CR008]。Saviynt 的云原生架构可以减轻单租户硬件故障；2024 年 7 月，全球 Windows 宕机由有缺陷的 CrowdStrike 传感器更新引起，Saviynt 生产系统未受影响，零宕机运行
              [CR009]。但由于企业身份运营依赖混合目录、 本地旧系统和 SaaS 目标之间的持续同步，集成配置错误和身份数据卫生缺陷仍构成持续的运营风险 [CR010]。
            claimRefs:
              - CR006
              - CR007
              - CR008
