      - number: '7.4'
        title: 资本结构、成长估值支撑与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月完成由 KKR、Sixth Street Growth、TenEleven 和 Carrick Capital Partners 领投的 $700 million B
              轮成长股权融资后，Saviynt 的投后估值约为 $3.0 billion；视是否计入老股出售和债务，累计融资为 $870 million 至 $1.075 billion [CR015]。公司称 FY2024
              ARR 超过 $200 million（同比增长 >35%），且现金 EBITDA 为正；但要支撑 $3 billion 的私募估值，就必须在传统巨头和灵活挑战者的激烈竞争中维持高净收入留存率（据报为
              111%），并将毛利率扩展到接近 80% [CR015]。


              对投资人而言，关键论点失效触发因素包括：(1) 实施停滞多个季度，导致客户推荐恶化或合同留存下滑；(2) 非人身份（NHI）和 AI 代理治理模块无法在企业中获得牵引，使核心 IGA 暴露于 Microsoft
              Entra ID 的捆绑竞争；(3) 关键云服务宕机或租户数据直接泄露，损害企业信任；以及 (4) 客户获取和部署成本上升，压缩 EBITDA 利润率并迫使公司进行稀释性后续融资。尽调必须确认经审计的 GAAP
              收入、现金消耗动态和清算优先权结构 [CR016]。
            claimRefs:
              - CR015
              - CR016
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 融合身份平台的实施拖累
            body: 将 IGA、PAM 和应用治理融合到一个云控制平面，可以消除供应商工具蔓延，却也带来显著部署摩擦。接入周期跨越多个季度、严重依赖系统集成商，以及复杂的策略工程，都会给企业身份团队带来严重运营交付风险。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
          - type: callout
            title: 非人身份（NHI）治理是新兴风险前沿
            body: >-
              机器身份数量是人类账户的 25x 至 50x，而只有 20% 的企业对 API 密钥执行正式注销流程；未经监控的 NHI 蔓延构成关键攻击面。Saviynt 的长期企业防御力取决于能否治理机器和 AI
              代理凭证，同时不让运营复杂性进一步恶化。
            calloutType: insight
            claimRefs:
              - CR013
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，信心中等、信息风险高；在约 $3 billion 估值下，价格立场已偏高且缺乏充分依据。融资本身证据较充分：Saviynt 宣布由 KKR 领投、估值为该水平的 $700 million B
              轮成长股权融资，独立数据库也重复了这一估值。但投资判断的桥接明显更弱。Multiples 报告 $200 million 数字和 15.0x 收入倍数，同时明确警告，与轮次挂钩的数字可能代表运行率收入、已报告
              LTM 收入或 ARR。没有经审计收入、留存、现金流数据和交易优先权，就无法负责任地量化进入回报或下行保护。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV016
