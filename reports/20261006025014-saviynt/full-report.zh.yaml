      - - 反题：估值基础
        - 表面规模未必足以支撑当前估值
        - 15.0x 取决于一个含义不明的 $200M 融资相关指标
        - 经审计的经常性收入和现金流转化率可能强化或削弱这一判断
      - - 反题：资本透明度
        - 未对账的融资记录可能掩盖稀释和优先级更高的权利主张
        - 独立追踪机构披露的总额和轮次历史存在重大差异
