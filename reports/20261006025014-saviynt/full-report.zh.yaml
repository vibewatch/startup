      - CU010
      - CU011
      - CU013
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 企业风险评估热力图
    type: matrix
    summary: 按可能性、影响严重性、缓解成熟度和剩余严重性，评估运营、技术、合作伙伴及估值风险向量。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 剩余严重性
      rows:
        - label: 部署拖累
          values:
            - high
            - high
            - medium
            - high
        - label: NHI 治理扩张失控
          values:
            - high
            - critical
            - low-medium
            - critical
        - label: 平台可用性与 SQL 阻力
          values:
            - medium
            - medium
            - medium
            - medium
        - label: 云宕机与租户隔离
          values:
            - low
            - critical
            - high
            - low
        - label: 生态连接器依赖
          values:
            - medium
            - high
            - medium
            - medium
        - label: 估值支撑与资本结构
          values:
            - medium
            - high
            - low-medium
            - high
    approximationNotes: 矩阵分类综合了从业者定性证据、厂商选择指南和行业比较分析。
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR010
      - CR013
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链把可信的规模和融资证据，与接受表面估值所需但尚缺的输入分开。
    data:
      nodes:
        - id: operating-proof
          label: 运营证明
          detail: 公司称有 600+ 家企业客户，并保障超过 100M 个身份
        - id: financing-mark
          label: 融资估值
          detail: $700M B 轮成长股权融资，估值约 $3B
        - id: multiple-check
          label: 倍数核验
          detail: 15.0x 使用一个收入或 ARR 口径不明的 $200M 指标
        - id: record-conflict
          label: 记录冲突
          detail: 独立追踪机构对融资总额和最近一轮历史存在分歧
        - id: diligence-gate
          label: 尽调门槛
          detail: 审计经济数据、股权结构表、债务、优先权和所得款项
        - id: recommendation
          label: 需要更多研究
          detail: 不能仅凭公开证据接受精确入场价或回报判断
      edges:
        - from: operating-proof
          to: financing-mark
        - from: financing-mark
          to: multiple-check
        - from: multiple-check
          to: record-conflict
        - from: record-conflict
          to: diligence-gate
        - from: diligence-gate
          to: recommendation
    approximationNotes: 仅呈现定性决策顺序；不分配概率，不预测数值，也不推导隐含回报。
    claimRefs:
      - CV004
      - CV005
      - CV010
      - CV011
      - CV015
      - CV016
