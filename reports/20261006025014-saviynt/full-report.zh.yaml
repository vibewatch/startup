  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Saviynt 的核心市场是云交付的企业身份治理与管理，包括生命周期配置、访问认证、权限风险审查、策略执行，以及跨大量应用和身份的治理。特权访问、态势管理、应用访问治理、非人身份和 AI
              代理控制属于相邻扩展空间，不能据此把所有身份或网络安全支出都计入 TAM。除非买方明确把这些预算转向融合身份平台，否则通用 SSO、MFA、网络安全、端点安全和通用 CASB
              支出都应排除。现状替代方案包括人工认证、脚本、割裂的单点工具和旧 IGA 部署；即使控制深度不等价，它们仍可能推迟平台采购。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM015
