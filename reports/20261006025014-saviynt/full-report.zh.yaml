      - number: '8.2'
        title: 融资记录与数据质量
        blocks:
          - type: paragraph
            body: >-
              公开记录无法对账成可靠的资本历史。Tracxn 报告四轮融资共筹得 $870 million，其中包括 2023 年 1 月的 $205 million 风险债务交易；FundedIQ 则报告两轮共 $149
              million，并认定 2026 年 8 月有一笔 $19.3 million B 轮融资。后一个记录与 Saviynt 自己 2025 年 12
              月的公告及其他独立跟踪机构均冲突。这一冲突不是新现金、降价轮或修订融资的证据，而是说明聚合数据不能替代签署的交割文件。首发与老股出售拆分、未偿债务、清算优先权、参与权和完全摊薄持股仍是重大尽调缺口。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 正论、反论与情景逻辑
        blocks:
          - type: paragraph
            body: >-
              可投资的正论是规模加平台广度：Saviynt 报告全球企业客户超过 600 家，覆盖《财富》100 强超过 20%，保护的身份超过 1 亿个；其 Exchange
              还展示了覆盖迁移、测试、治理和应用连接器的公司、社区及实施伙伴方案。反论是，这些采用信号不能证明经常性收入质量、利润率持久性或现金创造能力。因此，乐观、基准和悲观情景仍是条件性的，而非数字化结论。乐观情景需要经验证的持久增长和干净条款；基准情景保留选择权，但不支撑当前估值；如果
              $200 million 指标或客户经济性无法验证，就会触发悲观情景。
            claimRefs:
              - CV003
