        title: 规模测算视角与证据质量
        blocks:
          - type: paragraph
            body: >-
              唯一一份汇总全球 IGA 预测的已分配来源给出 2024 年 $7.29B-$8.85B 的区间，并预计到本十年末 CAGR 约为 14%-15%。这个区间可作为宽泛的品类参照，不能当作精确、可用于投资的
              TAM：抓取的文件是自动生成的二手综合材料，本章证据池中没有底层分析师报告及其方法论。其他规模指标的分母也不兼容。Saviynt 称其保护超过 1 亿个身份，6sense 按 CASB 分类报告超过 1,303
              家公司，Tracxn 则统计更广义身份市场中有 318 家活跃竞争者。这些都不是收入、SAM、SOM 或经验证的客户数，不能换算成市场份额。
