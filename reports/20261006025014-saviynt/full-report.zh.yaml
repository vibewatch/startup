      - number: '7.3'
        title: 生态依赖、企业迁移摩擦与治理缺口
        blocks:
          - type: paragraph
            body: >-
              Saviynt 的运营模式高度依赖第三方应用生态、云托管商和系统集成合作伙伴。通过 Saviynt Exchange，公司提供超过 400 个预构建集成、连接器和合作伙伴开发的加速器，例如 Fortuna
              Identity 的 ezyMigrate 加速器和 Twine Security 的态势修复工具，用于促进应用接入和旧系统迁移 [CR011]。像 Wells Fargo
              这类一级金融机构的现代化大型企业部署，需要与 ServiceNow、CyberArk 及混合 Active Directory/Entra ID 环境等外部平台进行深度技术集成
              [CR012]。基础企业平台发生中断或弃用 API，都可能导致集成失效。


              此外，非人身份（NHI）——如服务账户、API 密钥和机器令牌——在现代企业中的数量是人类身份的 25x 至 50x，其爆炸式增长带来严重治理风险 [CR013]。行业研究显示，只有 20%
              的组织建立了正式流程来注销和撤销 API 密钥；如果不持续审计，就会形成大量影子访问路径和长期保有权限风险 [CR013]。尽管 Saviynt 已推出自动化迁移工具和 AI
              驱动的治理助手（SaviAI）以减轻审查疲劳，但如果集成治理失效，企业客户仍容易在复杂 ERP 系统中遭遇有害权限组合和配置漂移 [CR014]。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
