  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              买方选择比单纯的 Saviynt 对 SailPoint 更广。SailPoint 是最接近的同类企业 IGA 对手；Microsoft Entra ID Governance 和 Okta Identity
              Governance 则是现有技术栈的延伸，在以 Microsoft 或 Okta 为中心的环境中可以替代独立平台。Linx、Lumos、Omada、Veza、Zluri
              等专业厂商切入更窄的任务，如快速云治理、权限可见性或 SaaS 生命周期管理。聚合结果还把密码管理、认证、PAM 和身份验证与 IGA
              混在一起，因此表面竞争者数量高估了直接可替代性。现状仍是内部脚本、静态角色和电子表格驱动的审查；它避免引入新供应商，但保留了人工、控制和审计风险。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.2'
        title: 能力广度与分发能力
        blocks:
          - type: paragraph
            body: >-
              Saviynt 可守住的优势在于覆盖面：公司材料将其定位为云优先身份治理平台，Exchange
              则展示了应用连接器、迁移加速器、测试工具、接入服务和合作伙伴方案组成的生态。这能支撑复杂的企业项目，但不能单独证明部署更快或运营成本更低。根据已审阅的对比，SailPoint
              在旧系统和大型机连接器深度上仍有优势。Microsoft 和 Okta
              以现有身份技术栈的原生分发能力，换取部分跨环境治理深度。规模更小的挑战者把无代理部署、易用性以及统一的人类/非人身份覆盖作为切入点，但这些比较由竞争者发布，仍需买方验证。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP011
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP008
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP011
              - CP015
              - CP016
      - number: '3.3'
        title: 定价、实施与切换成本
        blocks:
          - type: paragraph
            body: >-
              商业透明度是竞争短板。已审阅的比较称 Saviynt 和 SailPoint 都需定制报价，而 Microsoft 公布的 Entra ID Governance 附加组件价格为每用户每月 $7，且要求
              Entra ID P1 或 P2；更广泛的 Entra Suite 据报为每用户每月 $12。第三方对 Saviynt
              的估价区间过大，无法用于投资判断；实际价格、模块、折扣、服务和续约条款仍属私密信息。竞争者页面反复声称实施需要数月并高度依赖专业服务，但这些不是独立基准。反过来，离开平台也很昂贵：认证历史、角色模型、职责分离策略、连接器重建，以及贯穿一个认证周期的并行运行，都可能让企业
              IGA 迁移持续多个季度。
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP014
      - number: '3.4'
        title: 壁垒持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              当买方更看重一套覆盖广泛的身份安全套件、合作伙伴生态和面向云的企业治理，而不是采购简单性时，Saviynt 的壁垒最强。据报 $700 million
              融资可用于产品、合作伙伴和国际扩张，但募集资金不等于可用现金，也不能证明产品执行力。壁垒在两端较弱：SailPoint 可凭旧系统深度赢得异构环境，Microsoft 或 Okta
              则可把治理捆绑进现有控制平面。新厂商也会挤压实施经济性。因此，投资判断不能只看功能是否具备，还要看 Saviynt 能否相对套件型巨头和专注型挑战者，证明更快部署、透明的全包成本和持续的治理质量。
            claimRefs:
              - CP002
              - CP004
              - CP011
              - CP012
              - CP015
              - CP016
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 竞争者批评不是独立基准
            body: Linx 和 Lumos 对实施时长、服务依赖和模块成本提出了有用的反向假设，但它们与 Saviynt 的商业关系使这些说法不适合作为单独的投资证据。应通过客户推荐、实施工作说明书、续约发票和上线时间数据验证。
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
          - type: callout
            title: 做一轮针对买方的三方验证
            body: 在相同应用、身份群体、SoD 策略、迁移工作、服务时长和三年续约假设下，将 Saviynt 与 SailPoint 及现有身份技术栈比较。只有在部署速度或非人身份治理是决定性标准时，才加入一家具象的挑战者。
            calloutType: recommendation
            claimRefs:
              - CP004
              - CP006
              - CP015
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价仍只能部分观察
        blocks:
          - type: paragraph
            body: >-
              Saviynt 似乎通过广泛的企业身份安全平台变现，核心软件之外还有模块、集成和合作伙伴交付的实施服务。一份衍生资料称，订阅收入占 FY2024 收入的
              88%，并描述了与身份数、已连接应用和启用模块挂钩的报价制定价；但指定证据没有 Saviynt 的标价表、实际合同数据、折扣曲线或收入确认政策。Exchange
              显示迁移和应用接入可能需要专业合作伙伴服务，因此软件收入、Saviynt 服务收入和合作伙伴经济性之间的分拆仍是重要未知数。由此，表面上的经常性收入模式虽合理，却还不能转化为可靠的 ACV、收入结构或毛利假设。
