  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 必要假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计的经常性收入支撑持久增长；留存和利润率强劲；条款干净
        - 只有经核实的规模能够降低有效倍数并支撑未来现金创造时，当前估值才更站得住
        - 经审计的经济数据和群组证据出来后，才可视为积极信号
        - 增长、留存或利润率证据不及管理层表述
      - - 基准
        - 运营规模真实存在，但经济数据和交易结构仍属非公开信息
        - 无法计算目标估值或回报；保留期权价值，暂不接受价格
        - 当前公开证据最接近这一情景
        - 数据室无法对收入、债务和资本结构作出一致解释
      - - 悲观
        - $200M 指标并非可比收入，客户经济性转弱，或优先级更高的权利主张显著减少普通股所得
        - 公开记录无法界定下行边界，给出虚假的精确度会低估风险
        - 相互冲突的追踪机构数据和未披露条款已经是警示信号
        - 核实后的经济数据意味着倍数压缩，或优先权瀑布表损害普通股回报
    notes: 这些情景刻意不设数字，因为现有指定公开证据不足以支持预测收入、概率百分比、退出倍数或估值区间。
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV011
      - CV016
