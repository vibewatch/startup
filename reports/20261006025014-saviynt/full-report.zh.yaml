          x: 3
          'y': 4.8
          detail: 评估对象中传统系统覆盖最深、成熟企业渠道最强，但没有占主导地位的 IdP 套装。
        - label: Microsoft Entra ID Governance
          x: 5
          'y': 3
          detail: 借助 Microsoft 存量客户基础获得最大分销杠杆，但在该资产范围之外的覆盖较窄。
        - label: Okta Identity Governance
          x: 4.5
          'y': 2.7
          detail: Okta 分销能力强，但评估到的治理深度较窄。
        - label: Linx
          x: 1.8
          'y': 3.5
          detail: 厂商自称实现统一的现代化覆盖，但私有规模和独立证明不足。
        - label: Lumos
          x: 1.7
          'y': 3.2
          detail: 厂商自称可快速部署、以 SaaS 为主，但存量客户基础带来的杠杆较低。
    approximationNotes: 这是 1-5 的序数综合，不是厂商报告的测量结果，也不是独立效能基准。分数反映指定来源中的相对位置；私有规模和竞争对手自行撰写的能力说法降低了信心。
    claimRefs:
      - CP004
      - CP005
      - CP011
      - CP015
      - CP016
  - id: FI001
    title: 从平台规模到现金经济性的公开证据桥
    type: flow
    summary: 证据从可见的平台使用情况逐步减弱到定价、已报告的经常性经济数据，最终落到不可获得的现金和现金跑道数据。
    data:
      nodes:
        - id: platform
          label: 平台广度
          detail: 官方页面描述了云优先的身份治理和访问管理。
        - id: usage
          label: 使用规模
          detail: 公司称身份数量超过 100M；第三方报道企业客户超过 600 家。
        - id: pricing
          label: 定价架构
          detail: 报道称身份、应用和模块按报价定价，但来源是一家声誉较低的衍生资料来源。
        - id: recurring
          label: 经常性收入信号
          detail: 报告称 FY2024 ARR 超过 $200M，订阅收入占比为 88%，但留存证据未经审计。
        - id: margin
          label: 利润率与留存
          detail: 报告称订阅毛利率接近 80%、NRR 为 111%，但缺少群组和会计支持。
        - id: cash
          label: 现金经济性
          detail: 据报告，公司现金 EBITDA 为正；现金余额、烧钱、资本开支、债务条款和现金跑道仍不可得。
    approximationNotes: 这是按证据强度排序的桥接图，不是定量转化漏斗；各指标分母不同，不代表存在转化率。
    claimRefs:
      - CI005
      - CI006
      - CI009
      - CI010
      - CI012
      - CI013
      - CI014
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 有证据支持的各层把企业身份数据转化为受治理的访问决策和运营证据。
    data:
      layers:
        - label: 身份与归属输入
          detail: HRMS、目录、账户所有者、身份属性和生命周期事件
          items:
            - HRMS
            - Active Directory 与 Azure AD
            - 身份归属记录
        - label: 应用与基础设施
          detail: 企业 SaaS、SAP、自定义应用、云资源和特权系统
          items:
            - SAP 与企业应用
            - GCP 与其他云系统
            - 自定义及断开的应用
        - label: 连接器与协议适配器
          detail: 目录和实施来源所描述的集成路径
          items:
            - REST 与 SCIM
            - JDBC 与 API
            - 自定义连接器
        - label: 聚合与对账
          detail: 身份、账户、权限、角色和访问状态的收集
          items:
            - 权限清单
            - 归属和角色模型
            - 对账
        - label: 治理工作流
          detail: 生命周期、请求、认证、政策、SoD 和修复
          items:
            - 入职、调岗和离职工作流
            - 访问审查和认证
            - 政策和修复规则
        - label: 运营与证据
          detail: 测试、部署准备、文档、仪表盘和审计支持
          items:
            - 测试和发布控制
            - 运行手册和运营流程
            - 审计证据和报告
    approximationNotes: 这是根据留存的公开证据抽象出的概念性运营栈；它没有披露或声称 Saviynt 专有的内部部署拓扑。
    claimRefs:
      - CE005
      - CE008
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 企业客户采用与扩张旅程
    type: journey-map
    summary: 公开证据支持一条由赞助人牵引、进入经常性治理工作流的路径，但续约和扩张经济性尚未披露。
    data:
      items:
        - label: 现代化触发因素
          detail: 传统 IGA、审计负担、访问碎片化或合规压力催生需求。
          touchpoints:
            - 安全战略
            - 合规计划
        - label: 高管赞助
          detail: 信息安全和 IT 总监牵头买方中心。
          touchpoints:
            - CISO / CIO
            - IT 总监
        - label: 从业者采用
          detail: IAM 分析师配置生命周期、访问审查、角色和应用工作流。
          touchpoints:
            - IAM 分析师
            - 应用所有者
        - label: 初始治理部署
          detail: 配置、撤销配置、认证和确认成为经常性工作流。
          touchpoints:
            - HR 和目录集成
            - 访问认证
        - label: 应用与控制扩展
          detail: Exchange 连接器、风险规则、迁移工具和合作伙伴服务扩大覆盖范围。
          touchpoints:
            - Saviynt Exchange
            - 实施合作伙伴
        - label: 续约证据缺口
          detail: NRR、GRR、流失率、合同期限、扩张收入和集中度没有公开数据。
          touchpoints:
            - 续约审查
            - 数据室尽调
    approximationNotes: 该顺序是基于证据的运营模型，不是已测量的漏斗；不代表存在转化率或各阶段客户数量。
    claimRefs:
