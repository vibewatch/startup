    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与已披露规模
        blocks:
          - type: paragraph
            body: >-
              Saviynt 成立于 2010 年，总部位于加州埃尔塞贡多。公司销售云身份安全平台，覆盖身份治理、特权访问、应用访问治理、身份安全态势管理、外部身份，以及人类、非人和 AI 代理访问。官方市场还显示，公司通过
              Saviynt、合作伙伴和社区应用，采用以集成为核心的扩展模式。Saviynt 称其保护的身份超过 1 亿个；公司来源的一篇 2026 年 1 月文章称，全球企业客户超过 600 家，已渗透《财富》100 强超过
              20%。这些指标描述的是身份和账户，而非收入；两者都不能证明活跃客户留存或经审计的财务规模。
