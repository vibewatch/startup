      - number: '8.4'
        title: 退出准备度与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              指定证据既不支持 IPO 时间表，也不支持可直接建模的退出估值。LinkedIn 显示 1,743 名关联员工和 1,001-5,000 人的公司规模区间，说明组织规模，但不是经验证的在册员工数。UpGuard
              称通过超过 330 项检查持续进行外部监测，但抓取的公开页面没有披露 Saviynt
              的实际评分；这既不能证明安全事件存在，也不能证明其不存在。最终尽调应要求经审计财务报表、客户群留存、客户集中度、完整资本与债务明细、优先权条款、首发与老股出售所得、安全发现，以及管理层可信的退出路径。无法调和这些事项，就是论点失效条件。
            claimRefs:
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 接受价格需要一手证据
            body: 约 $3 billion 的估值是交易事实，不是公允价值证明。投资审批仍应以经审计的经济性和实际优先权分配瀑布为门槛。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV016
          - type: callout
            title: 不要靠假设解决跟踪机构冲突
            body: FundedIQ 和 Tracxn 报告的资本历史存在重大差异。应将这一差异保留为尽调缺口，而不是解读为新一轮融资、降价轮或可用现金。
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV010
