evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Current audited revenue, ARR definition, margins, cash balance, burn, runway, active-customer denominator,
      customer concentration, and consolidated headcount.
    whyItMatters: >-
      Public figures use different metrics, vintages, and methodologies and cannot support a reliable growth,
      efficiency, or liquidity assessment.
    diligencePath: >-
      Obtain audited financial statements, the current board KPI pack, customer cohort schedules, payroll records, and
      bank and debt statements.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Complete executive and board biographies, succession plan, committee charters, cap table, investor ownership, debt
      balances, voting rights, and liquidation preferences.
    whyItMatters: >-
      The public roster and financing announcements do not establish governance independence, control rights, dilution,
      debt priority, or a complete stakeholder population.
    diligencePath: >-
      Review the charter, bylaws, board minutes, capitalization ledger, investor-rights agreements, stock-purchase
      documents, and current debt schedule.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Verified current records of material lawsuits, regulatory actions, sanctions, outages, breaches, customer
      complaints, or their absence.
    whyItMatters: >-
      The assigned adverse search returned no retained URLs, and absence of evidence does not establish absence of
      incidents or liabilities.
    diligencePath: >-
      Run jurisdiction-specific court and regulator checks, request the litigation schedule and incident register, and
      review cyber-insurance claims and customer notices.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: private-market
    missingEvidence: >-
      Current IPO filing status, recent arm's-length secondary trades, preferred-share terms, and an independently
      supported fully diluted capitalization.
    whyItMatters: >-
      Limited market activity and unavailable pricing prevent a reliable liquidity or fair-value conclusion from the
      assigned public evidence.
    diligencePath: >-
      Confirm filing status with counsel, inspect the latest certificate of incorporation and 409A materials, and obtain
      executed secondary transaction records.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      A current buyer-population model linked to Saviynt pricing, geographic eligibility, product scope, and realistic
      penetration assumptions.
    whyItMatters: >-
      Without a common denominator, broad IGA forecasts and adoption proxies cannot establish Saviynt-specific
      serviceable or obtainable market.
    diligencePath: >-
      Obtain management's segment-level market model and reconcile it to signed contracts, product packaging, buyer
      counts, and independent category definitions.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-sizing-gap
    missingEvidence: >-
      Current price books, representative contract values, software-services mix, sales-cycle data, win rates, and
      segment conversion rates.
    whyItMatters: >-
      These inputs determine how much of the broad identity-governance category Saviynt can monetize and how quickly
      adoption converts to revenue.
    diligencePath: >-
      Review anonymized contracts, CRM cohort exports, pricing approvals, implementation statements of work, and renewal
      or expansion data by segment.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: metric-comparability
    missingEvidence: >-
      A reconciled definition of customers, identities, deployed applications, and category membership across company
      and third-party datasets.
    whyItMatters: Unreconciled denominators can overstate adoption or produce invalid market-share calculations.
    diligencePath: >-
      Reconcile management's customer roster and identity counts to billing records, then compare definitions with
      6sense and independent IGA datasets.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable Saviynt, SailPoint, Microsoft, and Okta quotes with the same identity population, modules, connector
      scope, services, discounts, term, and renewal caps.
    whyItMatters: >-
      Public list and benchmark figures do not establish realized three-year total cost or permit a defensible
      like-for-like pricing conclusion.
    diligencePath: >-
      Obtain current vendor quotes, implementation SOWs, two customer invoices per finalist, and renewal schedules
      normalized to one reference environment.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: implementation-risk
    missingEvidence: >-
      Independent customer-level benchmarks for deployment duration, service hours, administrator staffing,
      certification quality, and time to production.
    whyItMatters: >-
      The strongest adverse implementation claims in the assigned pool are published by competitors and cannot
      independently establish Saviynt's operating burden.
    diligencePath: >-
      Review three recent Saviynt deployments, systems-integrator SOWs, go-live dates, support tickets, and customer
      references with comparable application complexity.
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape
    missingEvidence: >-
      Exhaustive current segmentation of all direct IGA peers, adjacent identity tools, internal-build patterns, and
      likely entrants by buyer segment and geography.
    whyItMatters: >-
      The assigned pool supports a representative shortlist but not a complete global competitor census or a verified
      ranking of every alternative.
    diligencePath: >-
      Expand primary vendor, procurement, customer-reference, and analyst coverage by competitor class before treating
      the profile table as exhaustive.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: financial statements
    missingEvidence: >-
      Audited consolidated revenue, COGS, operating expenses, net income, operating cash flow, capex, and free cash
      flow.
    whyItMatters: >-
      Without audited statements, derivative ARR, margin, and cash EBITDA reports cannot be reconciled to accounting
      revenue or cash generation.
    diligencePath: Obtain audited FY2024-FY2026 financial statements and management-to-GAAP reconciliations from the data room.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A financing schedule reconciling the $870 million stated total with the $1.075 billion sum of listed rounds.
    whyItMatters: >-
      The discrepancy may reflect debt classification, superseded figures, or transaction scope and prevents reliable
      total-capital analysis.
    diligencePath: >-
      Reconcile signed financing documents, proceeds received, debt outstanding, and primary versus secondary
      consideration.
    relatedQuestionRefs:
      - QI005
      - QI006
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, debt terms, covenants, committed spending, runway, and latest-round
      primary-secondary mix.
    whyItMatters: A headline funding amount cannot establish liquidity, financing dependency, or the timing of a next capital need.
    diligencePath: >-
      Review monthly cash statements, the debt and covenant schedule, board-approved operating plan, and Series B
      closing documents.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: commercial efficiency
    missingEvidence: >-
      CAC, CAC payback, sales cycle, win rate, quota attainment, channel economics, services attach, and customer
      concentration.
    whyItMatters: Public usage and review signals do not show whether growth is efficient or concentrated.
    diligencePath: >-
      Request quarterly funnel metrics, cohort contribution margins, top-customer exposure, and direct-versus-channel
      economics.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing and cohorts
    missingEvidence: >-
      Current rate card, realized discounts, contract terms, module attach, renewal uplift, churn, and cohort-level
      retention.
    whyItMatters: The reported subscription and retention metrics cannot be normalized without contract and cohort definitions.
    diligencePath: Sample signed customer contracts and reconcile billing cohorts to the ARR, GRR, and NRR calculations.
    relatedQuestionRefs:
      - QI001
      - QI007
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: trust-evidence-gap
    missingEvidence: >-
      Current Saviynt-owned uptime and incident history, independent performance benchmarks, privacy-control evidence,
      penetration-test results, and current security-certification artifacts.
    whyItMatters: >-
      Identity governance is a high-impact control plane, so availability, reconciliation integrity, tenant isolation,
      and security assurance materially affect underwriting.
    diligencePath: >-
      Request current SOC reports and bridge letters, penetration-test executive summaries, service-level history,
      incident records, tenant-isolation architecture, and workload-specific benchmark results.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: roadmap-and-support-boundaries
    missingEvidence: >-
      Module packaging, release roadmap, connector maintenance ownership, support service levels, and adoption data
      split by Saviynt-authored, community-authored, and partner-authored assets.
    whyItMatters: >-
      Catalog breadth can shift upgrade, testing, and incident-resolution work to customers or partners when ownership
      boundaries are unclear.
    diligencePath: >-
      Obtain the current SKU and module map, product roadmap, connector certification policy, deprecation policy,
      support responsibility matrix, and connector-level usage telemetry.
  - type: private-evidence-only
    severity: material
    topic: named-customer-outcomes
    missingEvidence: >-
      Customer-authored production confirmation, deployment dates, scoped user or application counts, and quantified
      security, compliance, efficiency, or cost outcomes for named references.
    whyItMatters: >-
      Vendor and technographic listings establish names but do not prove present production status, realized value, or
      reference quality.
    diligencePath: >-
      Request three reference calls and corresponding implementation summaries, renewal records, and before-and-after
      KPI evidence from Saviynt.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
