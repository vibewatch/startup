  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Footprint and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Saviynt describes its product as cloud-first identity governance and access management, while its current
              public pages and customer-side implementation signals show a broader control plane for identity lifecycle,
              access requests, certifications, entitlement governance, and cloud access. Saviynt says it secures more
              than 100 million identities, but that figure is a company claim without a disclosed customer, tenant, or
              active-identity denominator. The Exchange solutions collection displayed 479 entries when reviewed; this
              is a catalog listing count, not a count of production-certified connectors or customers. A company-hosted
              Hertz testimonial also describes real-time discovery and automated onboarding of AI agents, which
              demonstrates the intended workflow but does not independently validate performance at scale.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
              - CE010
              - CE015
      - number: '5.2'
        title: Integration and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              The observable architecture is integration-led rather than a self-contained identity system. Public
              catalog entries describe REST-based visibility, provisioning, and governance, while customer and
              implementer job specifications add SCIM, JDBC, directories, HR systems, cloud IAM, SAP, ServiceNow,
              CyberArk, and custom applications. Those sources support a layered operating model: authoritative identity
              and entitlement sources feed connectors; Saviynt applies lifecycle, request, certification, role, and
              policy workflows; downstream systems receive provisioning or remediation actions; and implementation teams
              produce audit evidence and operational documentation. The sources do not expose Saviynt's internal
              multi-tenant data model or deployment topology, so the architecture map is a sourced operating
              abstraction, not a claim about proprietary internals.
            claimRefs:
              - CE005
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE009
              - CE011
              - CE012
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE008
              - CE010
              - CE011
              - CE012
      - number: '5.3'
        title: Deployment Maturity and Differentiation
        blocks:
          - type: paragraph
            body: >-
              The strongest external maturity signal is not a benchmark but the specificity of live enterprise
              implementation roles. Wells Fargo describes expansion of Enterprise Identity Cloud and migration from
              legacy governance platforms; Avantor seeks architecture spanning HRMS, Active Directory, Azure AD, SAP,
              cloud systems, and custom applications; and Arkhya describes GCP, Delinea, service-account, and
              non-human-identity governance. Together these sources indicate production-oriented demand for Saviynt
              skills, but they also show that value realization depends on requirements mapping, custom workflows,
              integration design, testing, production readiness, and documentation. Saviynt's differentiation is
              therefore ecosystem and governance breadth, offset by an implementation burden that remains material for
              complex or disconnected estates.
            claimRefs:
              - CE006
              - CE007
              - CE010
