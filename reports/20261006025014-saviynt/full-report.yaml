  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Saviynt's core market is cloud-delivered enterprise identity governance and administration: lifecycle
              provisioning, access certification, entitlement-risk review, policy enforcement, and governance across
              many applications and identities. Privileged access, posture management, application access governance,
              non-human identity, and AI-agent controls are adjacent expansion pools rather than a license to count all
              identity or cybersecurity spend as TAM. General SSO, MFA, network security, endpoint security, and generic
              CASB spend should therefore be excluded unless a buyer explicitly reallocates those budgets to a converged
              identity platform. Status-quo substitutes include manual certifications, scripts, fragmented point tools,
              and legacy IGA deployments; each can defer a platform purchase even when it does not provide equivalent
              control depth.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM015
      - number: '2.2'
        title: Sizing Lenses and Evidence Quality
        blocks:
          - type: paragraph
            body: >-
              The only allocated source that aggregates global IGA forecasts reports a 2024 range of $7.29B-$8.85B and
              an approximate 14%-15% CAGR through the end of the decade. That range is useful as a broad category
              reference, not as a precise investment-grade TAM: the fetched document is an autonomous secondary
              synthesis, and the underlying analyst reports and methodologies were not part of this chapter's evidence
              pool. Other scale indicators use incompatible denominators. Saviynt says it secures more than 100 million
              identities, while 6sense reports more than 1,303 companies under a CASB taxonomy and Tracxn counts 318
              active competitors in a broader identity market. None is revenue, SAM, SOM, or verified customer count, so
              these measures cannot be converted into market share.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM016
      - number: '2.3'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The best-supported buyer is a large enterprise with compliance-heavy processes, rapid cloud adoption, or
              fragmented legacy IAM. The economic sponsor is generally the CISO, CIO, or enterprise security and IT
              organization; IAM teams administer the platform, while application owners, managers, auditors, and risk
              teams participate in access reviews and exceptions. Adoption commonly starts with high-risk applications
              or lifecycle workflows, then expands through connectors, certifications, privileged workflows, and posture
              remediation. The Exchange illustrates a partner and community ecosystem around migration, testing, and
              application onboarding, but those listings remain company-issued evidence rather than independent proof of
              deployment outcomes. Current contract pricing, packaging, and the budget split between software and
              implementation remain undisclosed in the assigned evidence.
            claimRefs:
              - CM011
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by cloud and hybrid complexity, recurring certification and audit work,
              least-privilege programs, and the extension of governance from people to privileged, machine, and AI-agent
              identities. The same evidence also points to a long adoption curve. Saviynt's Zero Trust guidance says
              transition requires significant investment and describes a three-to-five-year journey, while an
              independent procurement guide flags planning overhead, integration sequencing, data quality, policy
              ownership, and sustained operational tuning. These constraints make implementation capacity and
              time-to-value as important as category growth. For valuation, the broad market CAGR supports demand
              durability, but no public Saviynt-specific SAM, pricing schedule, win rate, or spend capture was
              available; underwriting should therefore use verified contracts and cohort economics rather than apply the
              broad market range directly to company revenue.
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do Not Treat Adoption Proxies as Market Share
            body: >-
              The company identity count, a CASB-tagged company count, and a broad competitor count use different
              populations and units; none supports a revenue-share calculation.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: callout
            title: Implementation Capacity Governs Adoption Timing
            body: >-
              Category growth can translate slowly when migration, application onboarding, policy quality, testing, and
              operational ownership are prerequisites to deployment.
            calloutType: insight
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The buyer set is broader than a single Saviynt-versus-SailPoint contest. SailPoint is the closest
              like-for-like enterprise IGA peer, while Microsoft Entra ID Governance and Okta Identity Governance are
              incumbent-stack extensions that can displace a separate platform in Microsoft- or Okta-centric estates.
              Linx, Lumos, Omada, Veza, Zluri, and other specialists attack narrower jobs such as fast cloud governance,
              permissions visibility, or SaaS lifecycle management. Aggregator results also mix password management,
              authentication, PAM, and identity verification with IGA, so apparent competitor counts overstate direct
              substitutability. The status quo remains internal scripts, static roles, and spreadsheet-led reviews; it
              avoids a new vendor but preserves labor, control, and audit risk.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.2'
        title: Capability breadth and distribution power
        blocks:
          - type: paragraph
            body: >-
              Saviynt's defensible position is breadth: its company materials present a cloud-first identity governance
              platform, while its exchange shows an ecosystem of application connectors, migration accelerators, testing
              tools, onboarding services, and partner-built solutions. That supports complex enterprise programs but
              does not by itself prove faster deployment or lower operating cost. SailPoint retains an edge in legacy
              and mainframe connector depth according to the reviewed comparisons. Microsoft and Okta trade some
              cross-estate governance depth for native distribution into their installed identity stacks. Smaller
              challengers frame agentless deployment, usability, and unified human/non-human identity coverage as their
              wedge, but those comparisons are competitor-issued and require buyer validation.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP011
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP008
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP011
              - CP015
              - CP016
      - number: '3.3'
        title: Pricing, implementation, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Commercial transparency is a competitive weakness. The reviewed comparison reports that Saviynt and
              SailPoint require custom quotes, while Microsoft publishes a $7-per-user-per-month Entra ID Governance
              add-on that requires Entra ID P1 or P2; the broader Entra Suite is reported at $12 per user per month.
              Third-party Saviynt estimates span too widely to underwrite, and realized pricing, modules, discounts,
              services, and renewal terms remain private. Competitor pages repeatedly allege multi-month implementations
              and substantial professional-services dependency, but they are not independent benchmarks. Conversely,
              switching away is also costly: certification history, role models, segregation-of-duties policies,
              connector rebuilds, and parallel operation through a certification cycle can make an enterprise IGA
              migration a multi-quarter program.
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Saviynt's moat appears strongest when a buyer values one broad identity-security suite, a partner
              ecosystem, and cloud-oriented enterprise governance more than procurement simplicity. The reported $700
              million financing can fund product, partner, and international expansion, but funding raised is not cash
              available and does not prove product execution. Durability is weaker at two edges: SailPoint can win
              heterogeneous estates through legacy depth, and Microsoft or Okta can bundle governance into an existing
              control plane. Newer vendors can also pressure implementation economics. The underwriting test is
              therefore not feature availability alone; it is whether Saviynt can demonstrate faster deployment,
              transparent all-in cost, and sustained governance quality against both suite incumbents and focused
              challengers.
            claimRefs:
              - CP002
              - CP004
              - CP011
              - CP012
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Competitor criticism is not an independent benchmark
            body: >-
              Linx and Lumos provide useful adverse hypotheses on implementation time, services dependency, and module
              cost, but their commercial relationship makes those claims unsuitable as stand-alone underwriting
              evidence. Validate them with customer references, implementation SOWs, renewal invoices, and
              time-to-production data.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
          - type: callout
            title: Run a buyer-specific three-way proof
            body: >-
              Compare Saviynt with SailPoint and the incumbent identity stack on the same applications, identity
              populations, SoD policies, migration work, service hours, and three-year renewal assumptions. Add a
              focused challenger only where deployment speed or non-human identity governance is a decisive criterion.
            calloutType: recommendation
            claimRefs:
              - CP004
              - CP006
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing remain only partially observable
        blocks:
          - type: paragraph
            body: >-
              Saviynt appears to monetize a broad enterprise identity-security platform, with modules, integrations, and
              partner-delivered implementation around the core software. A derivative profile reports that subscriptions
              represented 88% of FY2024 revenue and describes quote-based pricing tied to identities, connected
              applications, and enabled modules, but the assigned evidence contains no Saviynt list-price schedule,
              realized contract data, discount curve, or revenue recognition policy. The Exchange shows that migration
              and application onboarding can require specialized partner services, making the split between software
              revenue, Saviynt services, and partner economics an important unknown. Consequently, the apparent
              recurring model is plausible but cannot yet be converted into dependable ACV, revenue-mix, or gross-profit
              assumptions.
            claimRefs:
              - CI007
              - CI009
              - CI013
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
