      - number: '1.4'
        title: Disclosure limits and investability
        blocks:
          - type: paragraph
            body: >-
              March 2025 reporting quoted Saviynt's COO saying annual recurring revenue exceeded $200 million and
              customer count exceeded 500. A separate company-data provider lists 2026 revenue of $183.4 million and
              1,743 employees, but it does not provide audited statements, methodology, or a comparable ARR definition.
              Revenue is not ARR, and the figures should not be reconciled into a synthetic growth rate. Forge reports
