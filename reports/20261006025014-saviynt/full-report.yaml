        - Validate attach rates, implementation time, support burden, and partner-sourced pipeline
      - - 'Anti-thesis: valuation basis'
        - Headline scale may not justify the current mark
        - 15.0x depends on one ambiguous $200M round-linked metric
        - Audited recurring revenue and cash-flow conversion could strengthen or weaken the case
      - - 'Anti-thesis: capital opacity'
        - Unreconciled financing records can obscure dilution and senior claims
        - Independent trackers report materially different totals and round histories
        - Signed closing documents, cap table, debt schedule, and preference waterfall are required
    notes: >-
      Company-reported adoption is not treated as independently verified; financing conflicts are preserved rather than
      resolved by assumption.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Scenario
      - Required Assumptions
      - Valuation / Return Logic
      - Probability Signal
      - Downside Trigger
    rows:
      - - Bull
        - Audited recurring revenue supports durable growth; retention and margins are strong; terms are clean
        - >-
          The current mark becomes more defensible only if verified scale lowers the effective multiple and supports
          future cash generation
        - Positive only after audited economics and cohort evidence
        - Growth, retention, or margin evidence falls short of management representations
      - - Base
        - Operating scale is real, but economics and transaction structure remain private
        - No target valuation or return can be calculated; preserve optionality and defer price acceptance
        - Current public evidence most closely fits this case
        - Data-room access does not reconcile revenue, debt, and capitalization
      - - Bear
        - >-
          The $200M metric is not comparable revenue, customer economics weaken, or senior claims materially reduce
          common proceeds
        - Downside is not bounded by the public record, so false precision would understate risk
        - Conflicting tracker data and undisclosed terms are existing warning signals
        - Verified economics imply multiple compression or the preference waterfall impairs common returns
    notes: >-
      Scenarios are deliberately non-numeric because the assigned public evidence does not support forecast revenue,
      probability percentages, exit multiples, or valuation ranges.
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV011
      - CV016
