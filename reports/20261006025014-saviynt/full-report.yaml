      - number: '4.2'
        title: Usage scale is visible; audited unit economics are not
        blocks:
          - type: paragraph
            body: >-
              Saviynt says it secures more than 100 million identities, while a third-party funding article reports more
              than 600 enterprise customers globally. Those figures indicate material deployment scale but are not
              revenue, ARR, billings, or active paid-seat measures and cannot establish monetization per identity. A
              low-reputation derivative profile reports FY2024 ARR above $200 million, growth above 35%, retention above
              100%, subscription gross margin near 80%, and positive cash EBITDA. RFP.wiki separately repeats the
              positive cash EBITDA signal but explicitly describes the detail as self-reported and unaudited. These
              metrics are useful diligence leads, not an audited basis for forecasting revenue quality, gross-margin
              durability, free cash flow, or CAC payback.
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: Large financing capacity does not establish runway
        blocks:
          - type: paragraph
            body: >-
              Independent coverage reports a $700 million December 2025 growth-equity round at an approximately $3
              billion valuation, with proceeds intended for product development, AI capabilities, integrations, and
              international commercial expansion. That financing likely increases strategic capacity, but funding raised
              is not cash available: the public evidence does not disclose primary versus secondary proceeds, closing
              cash, restricted cash, burn, debt balances, covenants, or planned annual deployment. The aggregate history
              is also internally inconsistent. Tracxn states $870 million raised across four rounds, while its own
              listed round amounts total $1.075 billion. Until management reconciles the scope and financing types,
              neither total capital raised nor runway should be used as a precise underwriting input.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.4'
        title: 'Financial verdict: promising signals, insufficient underwriting inputs'
        blocks:
          - type: paragraph
            body: >-
              The available record is directionally consistent with an enterprise SaaS company that has meaningful
              usage, a partner-supported delivery model, and substantial recent financing. It does not support a
              defensible valuation model or capital-adequacy conclusion. Pricing architecture is uncorroborated,
              customer counts and identity counts lack contract-value denominators, and reported ARR, retention, margin,
              and cash EBITDA lack audited statements or cohort schedules. BreachHistory currently catalogs no public
              incident for Saviynt, but its disclosure-dependent catalog cannot prove the absence of an incident or
              quantify contingent exposure. Investment underwriting should therefore condition any revenue-quality or
              margin-path conclusion on audited financials, a revenue bridge, contract cohorts, cash and debt schedules,
              and a primary-secondary reconciliation for the latest round.
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI010
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding data requires reconciliation
            body: >-
              Tracxn's stated $870M aggregate conflicts with the $1.075B sum of the four amounts on its own round table.
              Financing type, primary-secondary mix, and cash availability must be reconciled before the number is used.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: callout
            title: Underwrite from source documents, not headline metrics
            body: >-
              Request audited financial statements, ARR and retention definitions, contract cohorts, revenue recognition
              policies, a cash-and-debt schedule, and the latest financing documents before assigning a margin path or
              runway.
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
