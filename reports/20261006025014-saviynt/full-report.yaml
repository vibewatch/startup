chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and reported scale
        blocks:
          - type: paragraph
            body: >-
              Saviynt was founded in 2010 and is headquartered in El Segundo, California. It sells a cloud
              identity-security platform spanning identity governance, privileged access, application access governance,
              identity-security posture management, external identity, and human, non-human, and AI-agent access. The
              official marketplace also shows an integration-led extension model through Saviynt, partner, and community
              applications. Saviynt says it secures more than 100 million identities, while a company-sourced January
              2026 article reported more than 600 global enterprise customers and penetration of more than 20% of the
              Fortune 100. Those measures describe identities and accounts rather than revenue, and neither establishes
              active-customer retention or audited financial scale.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO011
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.2'
        title: Leadership and governance concentration
        blocks:
          - type: paragraph
            body: >-
              The official leadership page places founder Sachin Nayyar in the combined roles of chief executive and
              board chair, with Paul Zolfaghari as president and Shankar Ganapathy as chief operating officer. The role
              combination gives Saviynt a clear strategic center but also concentrates operating and board leadership in
              one founder. The public material does not provide committee charters, voting rights, succession plans, or
              a complete ownership schedule, so governance independence cannot be inferred from the displayed board
              roster. The decision-relevant leadership table is therefore a selected map rather than a complete
              executive or director census, and investor diligence should test succession depth and the practical
              authority of investor-appointed directors.
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO012
      - number: '1.3'
        title: Capital history and stakeholder alignment
        blocks:
          - type: paragraph
            body: >-
              Public databases describe a financing path from a $40 million 2018 round through $130 million of 2021
              financing and $205 million of 2023 venture debt, followed by the announced $700 million Series B
              growth-equity financing in December 2025 at approximately a $3 billion valuation. KKR led the latest
              announced round, with Sixth Street Growth, TenEleven, and existing investor Carrick participating. This is
              funding raised, not cash available: debt repayment, primary-versus-secondary proceeds, fees, and deployed
              capital are not disclosed. Provider totals also diverge, so the capitalization table and round documents
              are necessary before treating any lifetime-funding figure as definitive.
