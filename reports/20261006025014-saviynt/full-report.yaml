              - CE008
              - CE010
              - CE013
      - number: '5.4'
        title: Trust Controls and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Customer and practitioner sources show that Saviynt deployments are expected to support segregation of
              duties, access reviews, least privilege, audit evidence, regulatory workflows, rollback planning, and
              operational runbooks. That is evidence of control requirements around the platform, not proof that Saviynt
              itself meets a particular uptime, throughput, privacy, or security-certification threshold. The retained
              source set contains no vendor-owned service level history, independent performance benchmark, public
              incident chronology, penetration-test result, or current certification artifact. Technical underwriting
              should therefore treat reliability and assurance as open evidence requests and should separately test the
              support and maintenance boundaries among Saviynt-authored, community-authored, and partner-authored
              Exchange assets.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is visible in both catalog and customer-side workflows
            body: >-
              Saviynt's public Exchange spans connectors and implementation accelerators, while customer and
              practitioner roles independently describe lifecycle, certification, cloud, PAM, and integration use cases.
            calloutType: strength
            claimRefs:
              - CE004
              - CE006
              - CE008
              - CE010
          - type: callout
            title: Integration breadth transfers work into implementation and operations
            body: >-
              The retained customer and implementer evidence repeatedly calls for architecture, custom workflows,
              integration design, testing, production readiness, documentation, and support; underwriting should not
              treat catalog breadth as plug-and-play deployment.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise customer shape and buying center
        blocks:
          - type: paragraph
            body: >-
              The observable customer footprint is enterprise-weighted. Bloomberry's analyzed set of 400 companies is
              concentrated in organizations above 1,000 employees, while Apps Run The World's disclosed 14-entry sample
              is entirely above that threshold and mostly above 10,000 employees. The two datasets are not
              population-equivalent and should not be blended, but both point toward complex organizations rather than a
              broad small-business motion. Job-posting analysis places IAM analysts in the daily-user role and
              information-security or IT directors in the buying center. Landbase identifies the United States as the
              largest geography and names business services, software/IT, manufacturing, software, and finance as common
              sectors; this is directional technographic evidence, not audited customer segmentation.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU015
      - number: '6.2'
        title: Adoption scale and named reference proof
        blocks:
          - type: paragraph
            body: >-
              Saviynt says its platform secures more than 100 million identities, but the statement provides neither a
              customer denominator nor a disclosed measurement date. Third-party estimates also differ: Landbase reports
              607 verified companies on a page last updated in August 2025, whereas Bloomberry describes analysis of 400
              detected companies. These values measure vendor-specific datasets rather than a reconciled active-customer
              population. Named evidence is more useful: McKesson and Shell appear in both Landbase and Apps Run The
              World, and the latter describes implementations at AutoNation, Cross Country Healthcare, and Diageo India.
              Those records support real deployment activity, but most lack customer-authored confirmation, current
              deployment status, or quantified business outcomes.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Durability, outcomes, and concentration remain unproven
        blocks:
          - type: paragraph
            body: >-
              The reviewed public sources do not disclose net or gross revenue retention, renewal rates, cohort churn,
              average contract length, customer concentration, or revenue by segment. That absence prevents a defensible
              conclusion about whether the large-enterprise footprint converts into durable recurring economics. Even
              detailed implementation descriptions tend to emphasize configured workflows rather than measured results;
              the Diageo India record explicitly avoids a quantified business outcome. The official customer page
              presents a VF Corporation modernization story but the fetched page does not expose the case-study details
              needed to classify it as a production deployment or assess realized value. Data-room evidence should
              therefore control any retention or concentration underwriting.
            claimRefs:
              - CU008
              - CU012
              - CU016
      - number: '6.4'
        title: Expansion surfaces exist, but implementation effort is visible
        blocks:
          - type: paragraph
            body: >-
              Saviynt's Exchange shows a plausible expansion path from an initial governance deployment into more
              applications, risk rules, privileged-access connectors, testing, migration, and managed implementation
              services. The same catalog also reveals friction: partners market accelerators for legacy migration,
              application onboarding, reconciliation, and testing because these are operationally demanding programs. A
              third-party case-study index says Saviynt built a one-stop customer portal and improved its own
              account-matching and pipeline operations, which indicates investment in enterprise customer operations but
              does not prove customer retention. The likely journey is sponsor-led modernization, practitioner adoption,
              application expansion, and recurring governance workflows; renewal evidence remains private.
            claimRefs:
              - CU006
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU010
              - CU011
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise fit is visible across independent datasets
            body: >-
              Multiple technographic providers independently identify large, regulated, and globally distributed
              organizations as Saviynt users, and two providers overlap on McKesson and Shell.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU009
          - type: callout
            title: Retention and concentration are not underwritten
            body: >-
              No reviewed public source provides cohort retention, renewal, contract-duration, expansion-revenue, or
              customer-concentration data; these metrics require company-provided evidence.
            calloutType: risk
            claimRefs:
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, Federal Certifications, and Data Exposure Posture
        blocks:
          - type: paragraph
            body: >-
              Enterprise identity governance operates at the nexus of strict regulatory frameworks and security
              compliance mandates. Saviynt positions its Enterprise Identity Cloud (EIC) platform as a compliance
              accelerator, maintaining major independent certifications including ISO 27001:2022, ISO 27017 for cloud
              security, PCI-DSS v4.0 AOC, and SOC 1 Type II and SOC 2 Type II reports across its tenant infrastructure
              [CR001]. A key competitive and operational differentiator has been its FedRAMP Moderate authorization for
              controlled unclassified information (CUI) in federal agencies, where it has historically positioned itself
              as a pioneer among cloud-native IGA and PAM providers [CR002]. Furthermore, Saviynt voluntarily joined the
              Cybersecurity and Infrastructure Security Agency (CISA) Secure by Design pledge in May 2024, committing to
              enhanced product security practices alongside major technology peers [CR003].


              Despite this compliance baseline, operating in highly regulated customer environments presents persistent
              legal and exposure liabilities. In enterprise software operations, third-party ecosystem incidents can
              propagate exposure even when core SaaS infrastructure remains uncompromised. For example, Saviynt
              acknowledged impact from the Klue third-party cybersecurity incident, wherein an unauthorized party
              compromised multiple customer Salesforce instances; while Saviynt confirmed no impact to its production
              software, core services, or customer data, internal sales data within its Salesforce instance was exposed
              [CR004]. Independent academic analyses highlight that transitioning enterprise environments to Saviynt
              requires extensive identity and access privilege migrations that demand rigorous continuous audit and role
              governance to avoid compliance missteps or inadvertent over-provisioning [CR005]. As regulatory bodies
              escalate penalties around access controls under SOX, HIPAA, GDPR, and NIS2, any failure in tenant
              isolation or policy enforcement remains a material legal risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
      - number: '7.2'
        title: Operational Complexity, Implementation Drag, and Cloud Infrastructure Resilience
        blocks:
          - type: paragraph
            body: >-
              The core operational challenge confronting Saviynt and its enterprise customers is implementation friction
              and administrative complexity inherent in converged identity platforms. Independent evaluations and market
              analyses indicate that Saviynt alternatives in 2026 are increasingly judged on deployment friction,
              governance depth, and operating model rather than purely checklist feature breadth [CR006]. While bundling
              identity lifecycle management, access certifications, privileged access management (PAM), and application
              access governance into a unified control plane reduces multi-vendor tool sprawl, it significantly expands
              initial implementation scope, systems integrator (SI) dependency, and ongoing operational overhead
              [CR007]. When deployment cycles extend across multiple quarters, audit deadlines and customer engineering
              constraints transform software architecture decisions into severe delivery risks [CR007].


              Practitioners frequently encounter operational hurdles during data modeling, connector configuration, and
              analytics querying. Technical practitioner feedback reflects steep learning curves and frustrating
              reporting interfaces, particularly when writing custom SQL analytics queries in complex data environments
              where error diagnostics are unhelpful [CR008]. On the resilience side, Saviynt's cloud-native architecture
              mitigates single-tenant hardware failures; during the July 2024 global Windows outage caused by a flawed
              CrowdStrike sensor update, Saviynt's production systems were unaffected and experienced zero downtime
              [CR009]. However, because enterprise identity operations depend on continuous synchronization across
              hybrid directories, on-premises legacy systems, and SaaS targets, integration misconfigurations and
              identity data hygiene deficiencies represent ongoing operational hazards [CR010].
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR013
              - CR015
      - number: '7.3'
        title: Ecosystem Dependencies, Enterprise Migration Friction, and Governance Gaps
        blocks:
          - type: paragraph
            body: >-
              Saviynt's operational model relies heavily on third-party application ecosystems, cloud hosting providers,
              and systems integration partners. Through the Saviynt Exchange, the company offers over 400 pre-built
              integrations, connectors, and partner-developed accelerators—such as the ezyMigrate accelerator by Fortuna
              Identity and posture remediation tools by Twine Security—to facilitate application onboarding and legacy
              migrations [CR011]. Large enterprise deployments, such as modernizations across Tier-1 financial
              institutions like Wells Fargo, require deep technical integrations with external platforms including
              ServiceNow, CyberArk, and hybrid Active Directory/Entra ID environments [CR012]. Any disruption or API
              deprecation by foundational enterprise platforms poses integration breakage risks.


              Furthermore, the explosive growth of non-human identities (NHIs)—such as service accounts, API keys, and
              machine tokens, which outnumber human identities by 25x to 50x in modern enterprises—presents an acute
              governance risk [CR013]. Industry research reveals that only 20% of organizations maintain formal
              processes for offboarding and revoking API keys, creating massive shadow access paths and persistent
              standing privilege risks if not continuously audited [CR013]. While Saviynt has introduced automated
              migration tooling and AI-driven governance assistants (SaviAI) to alleviate reviewer fatigue, enterprise
              customers remain vulnerable to toxic entitlement combinations and configuration drift across complex ERP
              systems if integration governance breaks down [CR014].
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Capital Structure, Growth Valuation Defense, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Following its December 2025 $700 million Series B growth equity financing led by KKR, Sixth Street Growth,
              TenEleven, and Carrick Capital Partners, Saviynt achieved a post-money valuation of approximately $3.0
              billion, bringing cumulative funding to $870 million to $1.075 billion depending on secondary and debt
              inclusion [CR015]. While the company reported fiscal year 2024 annual recurring revenue (ARR) exceeding
              $200 million (up >35% year-over-year) and achieved positive cash EBITDA, defending a $3 billion private
              mark requires sustaining high net revenue retention (reported at 111%) and expanding gross margins near
              80% amidst fierce competition from legacy incumbents and agile challengers [CR015].


              Key thesis-break triggers for investors include: (1) multi-quarter implementation stalls leading to
              customer reference deterioration or contracted retention decay; (2) failure of non-human identity (NHI)
              and AI-agent governance modules to establish enterprise traction, leaving core IGA vulnerable to bundled
              competition from Microsoft Entra ID; (3) critical cloud service outages or direct tenant data compromise
              violating enterprise trust; and (4) escalation of customer acquisition and deployment costs that compress
              EBITDA margins and force dilutive follow-on financing. Diligence must confirm audited GAAP revenue, cash
              burn dynamics, and liquidation preference structures [CR016].
            claimRefs:
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Converged Identity Platform Implementation Drag
            body: >-
              While converging IGA, PAM, and application governance into a single cloud control plane eliminates vendor
              sprawl, it introduces significant deployment friction. Multi-quarter onboarding cycles, heavy reliance on
              systems integrators, and complex policy engineering create severe operational delivery risks for
              enterprise identity teams.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
          - type: callout
            title: Non-Human Identity (NHI) Governance as an Emerging Risk Frontier
            body: >-
              With machine identities outnumbering human accounts by 25x to 50x and only 20% of enterprises enforcing
              formal offboarding for API keys, unmonitored NHI sprawl represents a critical attack surface. Saviynt's
              long-term enterprise defensibility depends on governing machine and AI-agent credentials without
              compounding operational complexity.
            calloutType: insight
            claimRefs:
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence, high information risk, and a
              stretched-to-unsubstantiated valuation stance at the approximately $3 billion mark. The financing itself
              is well supported: Saviynt announced a $700 million Series B Growth Equity Financing led by KKR at that
              valuation, and independent databases repeat the mark. The underwriting bridge is much weaker. Multiples
              reports a $200 million figure and a 15.0x revenue multiple, while explicitly warning that round-linked
              figures may represent run-rate revenue, reported LTM revenue, or ARR. Without audited revenue, retention,
              cash-flow data, and transaction preferences, neither entry returns nor downside protection can be
              quantified responsibly.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV011
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: Financing Record and Data Quality
        blocks:
          - type: paragraph
            body: >-
              Public records do not reconcile into a dependable capitalization history. Tracxn reports $870 million
              raised across four rounds, including a $205 million venture-debt transaction in January 2023, whereas
              FundedIQ reports $149 million across two rounds and identifies a $19.3 million Series B in August 2026.
              The latter record conflicts with both Saviynt's own December 2025 announcement and other independent
              trackers. That conflict is not evidence of new cash, a down round, or an amended financing; it is evidence
              that aggregator data cannot substitute for signed closing documents. The primary-secondary split,
              outstanding debt, liquidation preferences, participation rights, and fully diluted ownership remain
              material diligence gaps.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Thesis, Anti-Thesis, and Scenario Logic
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is scale plus platform breadth: Saviynt reported more than 600 global enterprise
              customers, over 20% of the Fortune 100, and more than 100 million identities secured; its Exchange also
              shows company, community, and implementation-partner solutions spanning migration, testing, governance,
              and application connectors. The anti-thesis is that these adoption signals do not establish recurring
              revenue quality, margin durability, or cash generation. Bull, base, and bear cases therefore remain
              conditional rather than numerical. A bull case requires verified durable growth and clean terms; the base
              case preserves optionality but does not underwrite the current mark; the bear case is triggered if the
              $200 million metric or customer economics fail verification.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV011
              - CV016
      - number: '8.4'
        title: Exit Readiness and Diligence Gates
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports neither an IPO timetable nor a model-ready exit valuation. LinkedIn
              displays 1,743 associated employees and a company size band of 1,001-5,000, which suggests organizational
              scale but is not a verified payroll count. UpGuard describes continuous external monitoring through more
              than 330 checks, yet the fetched public page does not disclose Saviynt's actual rating; this cannot prove
              either the presence or absence of a security incident. Final diligence should require audited financials,
              cohort retention, customer concentration, the complete capitalization and debt schedule, preference terms,
              primary-secondary proceeds, security findings, and management's credible exit path. Failure to reconcile
              these items is a thesis-break condition.
            claimRefs:
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price Acceptance Requires Primary Evidence
            body: >-
              The approximately $3 billion mark is a transaction fact, not proof of fair value. Investment approval
              should remain gated on audited economics and the actual preference waterfall.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV016
          - type: callout
            title: Do Not Resolve Conflicting Trackers by Assumption
            body: >-
              FundedIQ and Tracxn report materially different capital histories. The discrepancy should be carried as a
              diligence gap rather than interpreted as a new round, a down round, or cash available.
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV011
