schemaVersion: "report-v2"
artifact: valuation
slug: mirendil
runDate: 2026-10-20
company:
  name: Mirendil
chapter:
  number: 8
  title: Valuation
  summary: >-
    Mirendil's reported $200 million seed at roughly a $1 billion valuation is
    supported by multiple June 2026 reports, but the allocated public evidence
    does not support a fundamentals-based valuation range. The appropriate
    stance is research-more / track with high risk and strict milestone-based
    entry discipline until product, customer, economics, runway, and financing
    terms are independently substantiated.
sections:
  - id: decision-and-price-discipline
    title: Decision and price discipline
    body: >-
      The decision is research-more / track, with medium confidence in the
      financing facts but low confidence in the price-to-fundamentals bridge.
      Multiple publishers report a $200 million seed at roughly a $1 billion
      valuation, yet contemporaneous reporting also says Mirendil had no
      launched product or reported revenue before the round. The reviewed
      evidence does not disclose current paying customers, pricing, recurring
      revenue, burn, runway, or preference terms. Those omissions prevent a
      responsible intrinsic, revenue-multiple, or probability-weighted exit
      valuation. Entry should therefore be conditioned on independent product
      benchmarks, repeat customer evidence, recurring economics, and complete
      financing documents rather than on founder pedigree or the headline mark
      alone.
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV013
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that an experienced frontier-lab team can turn AI research
      automation into a valuable platform for scientific users who lack
      frontier-lab infrastructure. The retained sources consistently describe
      a system intended to automate experiment design, model iteration, and
      other parts of the AI R&D loop, and they report backing from a16z,
      Kleiner Perkins, and NVIDIA. The anti-thesis is equally material: the
      valuation preceded public product and revenue proof, the team remains
      small by reported headcount indicators, and frontier labs can build
      similar tools internally. The investment case therefore depends on
      converting technical talent into differentiated, externally adopted
      workflows before capital consumption or talent competition erodes the
      option value.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV011
      - CV012
      - CV013
      - CV015
    tableRefs:
      - TV002
  - id: financing-and-comparable-context
    title: Financing and comparable context
    body: >-
      FundedIQ records one disclosed round, a $200 million seed announced in
      June 2026, and says that round exceeds its $6 million median for tracked
      AI rounds over the prior two years. A March report had described talks
      for $175 million at the same $1 billion valuation before terms were
      finalized, so the closing amount changed while the reported headline
      mark held. Cryptopolitan characterizes the final mark as post-money and
      estimates roughly 20% ownership, but this is publisher analysis rather
      than cap-table evidence; security type, option-pool treatment, voting
      rights, liquidation preferences, and secondary components remain
      unavailable. A low-reputation comparison source places Mirendil among
      other credentialed-founder, pre-product AI labs, which is useful context
      but not an independent price benchmark.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: scenarios-exit-and-diligence
    title: Scenarios, exit readiness, and diligence
    body: >-
      Scenario analysis must remain qualitative because the evidence lacks
      operating forecasts, unit economics, ownership terms, and a verified
      current valuation. The bull case requires benchmarked product performance,
      repeat deployments, durable recurring economics, and retention of the
      reported research team; only then should an investor re-underwrite the
      June mark or a higher price. The base case is continued technical progress
      without commercial proof, which supports monitoring but not paying above
      the reported mark. The bear case is prolonged absence of product and
      customer validation while compute and talent spending consume the round,
      creating down-round or preference-overhang risk. Final diligence should
      obtain the cap table, financing documents, monthly burn, runway plan,
      benchmark methodology, customer references, pipeline, pricing, and an
      exit ownership model before any investment decision.
    claimRefs:
      - CV004
      - CV009
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV003
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Current view
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Research-more / track
        - Financing is reported, but public operating proof is insufficient
        - Do not underwrite an investable price until milestone evidence is available
      - - Confidence
        - Medium on round facts; low on valuation support
        - Multiple reports corroborate the round, while fundamentals remain undisclosed
        - Separate confidence in financing facts from confidence in fair value
      - - Risk rating
        - High
        - Pre-product and pre-revenue reporting plus undisclosed burn and terms
        - Require staged diligence and explicit thesis-break triggers
      - - Valuation stance
        - Expensive on available public evidence
        - Roughly $1 billion reported mark without disclosed operating metrics
        - Demand proof or a materially more protective entry structure
      - - Target return / hold / exit
        - Not publicly supportable
        - No verified forecasts, ownership terms, dilution schedule, or exit timing
        - Build the return model only after cap-table and operating data-room review
    notes: >-
      Judgment as of 2026-10-20 using only the allocated public sources; no
      numeric target return or fair-value range is shown because operating and
      financing inputs are unavailable.
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV013
      - CV014
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - Frontier-lab talent may compress AI research iteration cycles
        - Independent benchmarks showing faster or better research outcomes
      - - Thesis
        - External scientific organizations may value AI R&D automation without building full AI labs
        - Repeat deployments and paid renewals across more than one scientific vertical
      - - Anti-thesis
        - The reported valuation preceded public product and revenue proof
        - A launched product with reproducible performance and disclosed commercial traction
      - - Anti-thesis
        - Internal frontier-lab tools and mobile research talent may weaken differentiation
        - Durable retention, proprietary workflow advantages, and customer switching costs
    notes: >-
      Arguments synthesize the retained sources; proposed view-change tests are
      diligence thresholds, not reported company forecasts or commitments.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV011
      - CV012
      - CV013
      - CV015
  - id: TV003
    title: Bull / base / bear scenarios
    columns:
      - Case
      - Assumptions and evidence threshold
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Independent benchmarks, repeat customers, recurring economics, and team retention
        - Re-underwrite from the last reported mark only after proof supports durable category leadership
        - Not evidenced in the allocated public corpus
        - Benchmarks fail to reproduce or customers do not expand
      - - Base
        - Technical releases emerge, but commercial adoption and economics remain unclear
        - Track without paying above the reported mark; no defensible return target yet
        - Most consistent with the current evidence gaps
        - Capital use outruns measurable technical and customer milestones
      - - Bear
        - Product and customer proof remain absent while compute and talent costs consume capital
        - Expect mark compression, a structured financing, or a down round
        - Material because operating and security terms are undisclosed
        - Talent losses, weak benchmarks, or financing before commercial proof
    notes: >-
      Qualitative scenarios only; probabilities, valuation ranges, dilution,
      and returns are intentionally not quantified because public inputs are
      insufficient.
    claimRefs:
      - CV004
      - CV009
      - CV013
      - CV014
      - CV015
      - CV016
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The reported financing scale is outweighed by missing operating and
      security-term evidence, producing a milestone-gated research-more stance.
    data:
      nodes:
        - id: financing-mark
          label: Reported financing mark
          value: "$200M seed at roughly $1B"
          note: Multiple June 2026 reports corroborate the headline round
        - id: team-thesis
          label: Team and technical thesis
          value: "20 researchers reported"
          note: AI systems intended to automate the AI R&D loop
        - id: operating-proof
          label: Operating proof
          value: Not publicly established
          note: No launched product or reported revenue before the round
        - id: financing-terms
          label: Financing terms
          value: Undisclosed
          note: Cap table, preferences, voting rights, and secondaries are unavailable
        - id: entry-gate
          label: Entry gate
          value: Milestone evidence required
          note: Benchmarks, repeat customers, economics, burn, and runway
        - id: recommendation
          label: Recommendation
          value: Research-more / track
          note: No defensible public fair-value or return range
      edges:
        - from: financing-mark
          to: team-thesis
        - from: team-thesis
          to: operating-proof
        - from: operating-proof
          to: financing-terms
        - from: financing-terms
          to: entry-gate
        - from: entry-gate
          to: recommendation
    approximationNotes: >-
      The flow is qualitative and does not convert the reported financing mark
      into ownership, fair value, or expected return.
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV010
      - CV014
      - CV016
callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Track the company, but do not treat the June 2026 headline valuation as a
      current fair-value estimate without product, customer, economics, runway,
      and security-term evidence.
    claimRefs:
      - CV013
      - CV014
      - CV016
  - calloutType: risk
    title: Financing mark is not cap-table evidence
    body: >-
      A publisher's roughly 20% ownership estimate depends on its post-money
      characterization; actual dilution and preference overhang require the
      financing documents.
    claimRefs:
      - CV008
      - CV009
