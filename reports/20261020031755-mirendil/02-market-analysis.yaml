  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: A credible market estimate with geography, base year, included spend, methodology, growth rate, and source data.
      whyItMatters: Without a reproducible denominator, market scale cannot be translated into a revenue or valuation case.
      diligencePath: Obtain management's bottom-up target-account model and compare it with independent analyst or industry spending data.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-economics
      missingEvidence: Named design partners or customers, buyer titles, budget owners, procurement steps, pricing units, and contract values.
      whyItMatters: Intended users do not demonstrate willingness to pay or identify the budget that Mirendil can capture.
      diligencePath: Review customer pipeline records and interview at least three design partners about workflow, budget, alternatives, and purchase criteria.
      relatedQuestionRefs: [QM004, QM005, QM007]
      relatedTableRefs: [TM003]
    - type: private-evidence-only
      severity: material
      topic: adoption-proof
      missingEvidence: Product access, benchmark methodology, reproducible performance results, compute economics, and workflow-integration evidence.
      whyItMatters: Adoption depends on technical and economic superiority over internal teams and existing research workflows.
      diligencePath: Run a controlled design-partner evaluation against the current internal workflow with pre-agreed quality, time, cost, and reproducibility metrics.
      relatedQuestionRefs: [QM006, QM007]
