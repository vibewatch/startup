        - label: External domain-model enablement
          value: Not quantified
          detail: Organizations may use Mirendil to build specialized AI without maintaining large ML engineering teams.
        - label: Research institutions and universities
          value: Not quantified
          detail: Public descriptions identify these organizations as potential users, not verified customers.
        - label: Enterprise scientific R&D
          value: Not quantified
          detail: Pharmaceutical, hospital, robotics, and materials teams are named targets without procurement evidence.
        - label: Frontier-like research capability
          value: Not quantified
          detail: The proposed value is access to capabilities concentrated in a small number of large laboratories.
        - label: Core autonomous AI R&D loop
          value: Not quantified
