callouts:
  - calloutType: risk
    title: Market size remains an underwriting gap
    body: >-
      Funding and valuation cannot substitute for TAM, SAM, or SOM. Require a
      defined product unit, target-account universe, pricing, budget owner, and
      observed adoption before assigning a numeric market opportunity.
    claimRefs: [CM007, CM008, CM012, CM015]
