    - type: private-evidence-only
      severity: material
      topic: customer-proof
      missingEvidence: >-
        Named customer references with contract status, deployment stage,
        production date, workload, and customer-verified outcomes.
      whyItMatters: >-
        Without named proof, the evidence cannot separate paid production use
        from pilots, design partnerships, evaluations, or management aspiration.
      diligencePath: >-
        Request three reference calls and inspect signed contracts, invoices,
        implementation plans, deployment logs, and customer-approved outcome data.
      relatedQuestionRefs: [QU004, QU009, QU010]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: adoption-metrics
      missingEvidence: >-
        Active-user, paid-account, deployment, location, repeat-use, workload,
        utilization, and time-series adoption metrics with definitions.
      whyItMatters: >-
        The compute partnership cannot be translated into customer demand or
        product usage without a comparable adoption denominator.
      diligencePath: >-
        Obtain monthly operating dashboards for the period since product access
        began and reconcile account, user, workload, and paid-deployment counts.
      relatedQuestionRefs: [QU003]
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        NRR, GRR, logo churn, renewal rate, contract duration, cohort retention,
        satisfaction, and implementation-to-renewal history.
      whyItMatters: >-
        A repeatable customer relationship cannot be distinguished from
        short-lived evaluation activity without durability evidence.
      diligencePath: >-
        Review the customer contract register and cohort tables, then validate
        renewal and expansion behavior in reference calls and billing records.
      relatedQuestionRefs: [QU005, QU006]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: >-
        Customer count, pipeline stages, pricing, revenue by account, top-customer
        share, channel mix, procurement cycle, and partner-sourced demand.
      whyItMatters: >-
        Concentration and go-to-market scalability cannot be assessed while
        customers, commercial terms, and channel contribution are undisclosed.
      diligencePath: >-
        Inspect CRM and billing exports, pricing schedules, pipeline conversion,
        account-level revenue, procurement timing, and channel agreements.
      relatedQuestionRefs: [QU002, QU007, QU008]
