schemaVersion: "report-v2"
artifact: customers
slug: mirendil
runDate: 2026-10-20
company:
  name: Mirendil
chapter:
  number: 6
  title: Customers
  summary: >-
    Mirendil describes a broad eventual user base spanning scientists, engineers,
    universities, pharmaceutical companies, research institutes, and industrial
    laboratories, but the retained public evidence does not identify a named
    end-customer or production deployment. The August 2026 Google Cloud
    relationship is a large compute partnership, not proof of customer adoption;
    usage, retention, pricing, expansion, and concentration therefore remain
    material diligence gaps.
sections:
  - id: target-segments-and-buying-roles
    title: Target segments and buying roles
    body: >-
      Mirendil's public customer thesis is wider than its demonstrated customer
      base. Third-party reporting names universities, pharmaceutical companies,
      research institutes, industrial laboratories, roboticists, and materials
      scientists as organizations or practitioners that could use specialized
      AI-research systems. The company's own August 2026 announcement similarly
      frames medicine, biology, and materials-science teams as eventual users
      that should be able to build specialized systems without frontier-lab
      infrastructure. These are target segments, not disclosed accounts. The
      likely hands-on users are scientists and engineers running experiments,
      while the economic buyer and payer could be a research leader, laboratory,
      university, or enterprise; no retained source identifies procurement
      ownership, budget source, pricing, or contract form. The segmentation is
      therefore useful for mapping the proposed workflow, but it should not be
      read as evidence of market penetration or revenue mix.
    claimRefs: [CU001, CU002, CU010, CU016]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-reference-quality
    title: Adoption and reference quality
    body: >-
      The strongest current external evidence concerns supply-side capacity, not
      demand. In August 2026, TechCrunch reported a multiyear Google Cloud
      partnership worth upward of $100 million according to Mirendil's CEO, and
      Mirendil said the arrangement provides TPUs, NVIDIA infrastructure, and
      managed training clusters. Google is described as an infrastructure
      provider and strategic partner; none of the retained sources presents it
      as a paying customer. TechCrunch also quotes management referring
      generically to “customers using our systems,” but supplies no names,
      account count, deployment status, usage measure, commercial term, or
      customer-verified outcome. This is a signal that Mirendil is discussing a
      customer-facing system, not proof of production adoption. The evidence
      set therefore cannot distinguish pilots, design partners, unpaid research
      collaborations, contracted customers, or active paid deployments.
    claimRefs: [CU003, CU004, CU005, CU006, CU011, CU012]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      Public evidence remains too early to assess customer durability. Two June
      2026 reports said Mirendil had no released product or reported revenue at
      that time, while another report said a first model and product were planned
      for the coming months. The August compute announcement advances
      infrastructure readiness but does not close the commercialization gap.
      Across the eight retained sources, there is no disclosed NRR, GRR, churn,
      renewal rate, contract duration, cohort retention, satisfaction measure,
      pipeline, customer count, pricing, revenue concentration, or channel mix.
      The proposed land-and-expand mechanism is conceptually plausible:
      researchers could begin with one research workflow and broaden use across
      experiments, models, and scientific domains. However, no source shows that
      loop occurring in a customer account. A primary diligence request should
      reconcile the large compute commitment with signed demand, implementation
      milestones, and evidence that usage persists beyond an initial evaluation.
    claimRefs: [CU007, CU008, CU009, CU013, CU014, CU015]
callouts:
  - calloutType: risk
    title: Compute commitment is not customer validation
    body: >-
      The Google Cloud agreement strengthens Mirendil's capacity story, but it
      does not identify a paying end-customer. Underwrite commercialization only
      after reviewing named references, deployment status, contract value,
      retention, and concentration data.
    claimRefs: [CU004, CU006, CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation and role hypotheses
    columns:
      - Segment
      - Buyer / user / payer
      - Proposed use case
      - Public scale evidence
      - Strategic value
      - Diligence gap
    rows:
      - - Universities and research institutes
        - "User: scientists and engineers; buyer and payer undisclosed"
        - Build and refine specialized research models
        - No named institution or deployment disclosed
        - Could broaden frontier AI R&D access beyond major labs
        - Budget owner, procurement path, pricing, and usage are unknown
      - - Pharmaceutical and drug-discovery organizations
        - "User: research scientists; buyer and payer undisclosed"
        - Accelerate AI-supported scientific research
        - No named pharmaceutical customer disclosed
        - High-value domain if research outcomes can be validated
        - No production workflow, outcome, or regulated-use evidence
      - - Biology and medicine teams
        - "User: domain scientists; buyer and payer undisclosed"
        - Develop specialized AI systems without frontier-lab infrastructure
        - Described as a target segment only
        - Aligns with Mirendil's democratization thesis
        - No named account, pilot status, or measurable benefit
      - - Chemistry and materials-science teams
        - "User: scientists and engineers; buyer and payer undisclosed"
        - Explore hypotheses and improve domain-specific models
        - Described as a target segment only
        - Potentially repeatable across experimental programs
        - No customer proof, adoption metric, or contract evidence
      - - Robotics and industrial laboratories
        - "User: roboticists and engineers; buyer and payer undisclosed"
        - Apply advanced AI-research capability to engineering work
        - No named organization or production deployment disclosed
        - Could extend the platform beyond laboratory science
        - Integration, safety, procurement, and support requirements unknown
      - - Frontier AI and advanced engineering teams
        - "User: AI researchers and engineers; buyer and payer undisclosed"
        - Run larger, more autonomous AI research loops
        - Management refers only to unnamed customers using its systems
        - Closest fit to the current technical and compute focus
        - Customer identity, payment status, workload, and retention unknown
    notes: >-
      Segments are prospective categories described in retained company and
      third-party sources; none of the rows represents a verified named customer
      or revenue contribution, and buyer/payer roles are explicit gaps.
    claimRefs: [CU001, CU002, CU003, CU010, CU016]
  - id: TU002
    title: Public adoption and commercialization trajectory
    columns:
      - Metric or milestone
      - Reported value
      - Date
      - Source
      - Confidence
      - Customer implication
      - Missing denominator or qualification
    rows:
      - - Early financing-stage status
        - Funding talks for $175M at a $1B valuation
        - "2026-03-18"
        - TechStartups
        - Medium
        - Company was still being assessed through team and thesis rather than disclosed customer traction
        - Terms were not final and no customer metric was supplied
      - - Product and revenue status
        - No product shipped and no revenue reported before the round
        - "2026-06-27"
        - ai|expert
        - Medium
        - Public commercialization evidence was absent at the financing milestone
        - Does not establish whether private pilots or design partners existed
      - - Planned product milestone
        - First model and product planned in coming months
        - "2026-06-25"
        - Unite.AI
        - Medium
        - Customer feedback was presented as a future activity
        - No launch date, customer cohort, or success criterion was disclosed
      - - Compute partnership
        - Multiyear Google Cloud deal worth upward of $100M according to Mirendil's CEO
        - "2026-08-06"
        - TechCrunch and Mirendil
        - High
        - Provides capacity for future customer-facing systems
        - Google is identified as an infrastructure partner, not a paying end-customer
    notes: >-
      Values reproduce source terminology and dates; the financing talk was
      preliminary, the $100M-plus figure is management-reported, and none of
      these milestones supplies an active-user or paid-customer denominator.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Public reference
      - Segment
      - Deployment or use case
      - Classification
      - Outcome evidence
      - Limitation
    rows:
      - - Google Cloud
        - Cloud infrastructure provider
        - TPUs, NVIDIA infrastructure, and managed training clusters for Mirendil workloads
        - Strategic infrastructure partner; not disclosed as a customer
        - Infrastructure scale and flexibility described
        - No end-customer adoption, revenue, or outcome proof
      - - Unnamed “customers using our systems”
        - Unspecified
        - Management says workload-to-accelerator matching could lower customer costs
        - Customer reference without identity or deployment status
        - No customer-verified outcome
        - No name, count, contract, production status, baseline, or measured saving
      - - Scientists and engineers in target domains
        - Universities, pharma, research, medicine, biology, materials, and robotics
        - Proposed access to specialized AI-research capability
        - Prospective target users, not customer references
        - No observed outcome
        - No named account, pilot, production deployment, or retention evidence
    notes: >-
      This is a partial enumeration of references in the eight-source assigned
      pool, not an exhaustive customer list; it intentionally distinguishes
      infrastructure partnership, unnamed management references, and prospective
      segments from verified production customers.
    enumerationScope:
      coverage: partial
      basis: >-
        Retained public sources assigned to the customers chapter and reviewed
        through the 2026-10-20 run date.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU012]
figures:
  - id: FU001
    title: Proposed customer journey and unverified expansion loop
    type: journey-map
    summary: >-
      Mirendil's sources describe a target-state research journey, but public
      evidence does not verify movement through these stages by any named account.
    data:
      nodes:
        - label: Target organization
          detail: University, pharmaceutical company, research institute, industrial laboratory, or advanced engineering team
          touchpoints:
            - Public positioning
            - Research need definition
        - label: Scientist or engineer user
          detail: Domain practitioner seeking advanced AI-research capability
          touchpoints:
            - Workflow evaluation
            - Technical fit assessment
        - label: System access
          detail: Access model, pricing, procurement, and deployment process are not publicly disclosed
          touchpoints:
            - Commercial evaluation
            - Infrastructure planning
        - label: Research loop
          detail: Design experiments, evaluate results, and decide what to try next
          touchpoints:
            - Model training
            - Experiment iteration
        - label: Specialized capability
          detail: Build or refine models for a scientific or engineering domain
          touchpoints:
            - Domain adaptation
            - Outcome validation
        - label: Expansion
          detail: Potential broadening across experiments, models, teams, or domains remains unverified
          touchpoints:
            - Repeat usage
            - Additional workflows
    approximationNotes: >-
      This is a source-grounded target-state sequence, not an observed funnel;
      no conversion, cycle-time, adoption, retention, or expansion rate is
      available, and no edge implies a verified customer progression.
    claimRefs: [CU010, CU015, CU016]
