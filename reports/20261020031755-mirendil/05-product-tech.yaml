artifact: product-tech
slug: mirendil
runDate: 2026-10-20
company:
  name: Mirendil
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Mirendil is building a vertically integrated system for automating the AI
    research loop, spanning models, agent tooling, evaluations, training data,
    and large-scale compute. Public evidence now shows live TPU infrastructure
    and a designed TPU/GPU operating model, but not a released product,
    benchmarks, customer-access surface, reliability record, or trust controls.
sections:
  - id: product-and-workflow
    title: Product definition and user workflow
    body: >-
      Mirendil's intended product is not a general chatbot or a single model
      endpoint. The clearest description is a lab-grade research system that
      trains frontier models specialized in AI R&D and wraps them in an
      environment for proposing experiments, writing and running code,
      interpreting results, debugging failures, comparing checkpoints, and
      deciding what to try next. The initial users are expected to be engineers
      and AI researchers, with a longer-term ambition to let scientists and
      other domain experts run experiments without first building an internal
      frontier lab. This is a coherent workflow thesis, but the evidence remains
      mostly issuer, investor, and partner description rather than user-observed
      product behavior. A June report said no product had shipped before the
      financing; the later public record in the assigned evidence shows
      infrastructure progress, not a generally available product or measured
      workflow benefit.
    claimRefs: [CE002, CE003, CE004, CE006, CE012, CE013]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, deployment, and maturity
    body: >-
      The disclosed architecture combines a research-system layer with a
      heterogeneous training substrate. Andreessen Horowitz describes backend
      infrastructure, an agent harness, evaluations, post-training, pre-training,
      and full-loop training data as mutually dependent design problems. Google
      Cloud provides the more concrete deployment evidence: TPU and NVIDIA
      accelerators through AI Hypercomputer, coordinated compute, storage,
      networking, and control planes, plus managed clusters for provisioning TPU
      and GPU environments. As of Google's August 2026 announcement, Mirendil was
      live on TPU v5P while NVIDIA systems were still coming online. That is a
      meaningful maturity step for the training platform, but it should not be
      mistaken for product availability, model quality, reliability, or customer
      readiness. The mixed-accelerator design provides workload flexibility but
      also creates material hyperscaler, accelerator-supply, orchestration, and
      cost dependencies.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-gaps
    title: Differentiation, proof points, and control gaps
    body: >-
      The proposed differentiation is vertical integration across the research
      loop rather than a single foundation model: training data, model strategy,
      evaluation, agents, and infrastructure are intended to improve together.
      The ability to place workloads on TPUs or NVIDIA GPUs may reduce
      architecture lock-in at the accelerator level, although the current
      implementation remains dependent on Google Cloud. External evidence is
      still thin. A third-party site detected Kubernetes and Anthropic-related
      technology signals from the company site and job posts, but this is only a
      practitioner proxy, not an active repository, release history, package
      adoption metric, or public API. A March report emphasized biology and
      materials science, while later investor materials described a wider set of
      possible domains; the initial product boundary is therefore not settled.
      The reviewed public corpus provides no quantitative benchmark, evaluation
      methodology, service-level history, security architecture, privacy model,
      certification, or regulated-domain quality system. Until those artifacts
      appear, the technical case rests on team capability and infrastructure
      readiness rather than independently testable product performance.
    claimRefs: [CE001, CE010, CE011, CE014, CE015, CE016]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or asset
      - Primary user
      - Public maturity
      - Claimed differentiation
      - Diligence gap
    rows:
      - - AI R&D-specialized frontier models
        - AI researchers and engineers
        - In development; no public release identified
        - Models trained for the full AI research loop
        - Model card, benchmark suite, access method, and release status
      - - Lab-grade research platform
        - Engineering and research teams
        - Product described by investor; no public interface shown
        - Integrates model work with experiment execution
        - Demo, API or UI documentation, tenancy model, and onboarding evidence
      - - Autonomous research loop
        - Initially AI experts; later domain scientists
        - Thesis disclosed; outcome metrics unavailable
        - Iterates over research and engineering problems with less intervention
        - Human-oversight design, success criteria, failure modes, and measured autonomy
      - - Training infrastructure substrate
        - Mirendil research and ML infrastructure teams
        - TPU v5P live in August 2026; NVIDIA systems coming online
        - Workload choice across TPU and NVIDIA accelerators
        - Capacity commitments, utilization, cost, resilience, and failover evidence
    notes: >-
      Status reflects only the cited public record through 2026-10-20; null or
      missing proof is treated as a diligence gap, not evidence of nonexistence.
    claimRefs: [CE003, CE004, CE005, CE009, CE012, CE013]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Conventional workflow
      - Mirendil's proposed role
      - Publicly measurable benefit
      - Limitation
    rows:
      - - Propose and prioritize experiments
        - Researchers frame hypotheses and select trials
        - Generate candidate experiments and decide what to try next
        - No quantified benefit disclosed
        - No public evaluation of scientific validity or novelty
      - - Implement and debug experiments
        - Engineers write code, run jobs, and diagnose failures
        - Write and run code, debug failures, and improve kernels
        - No quantified benefit disclosed
        - No public task suite, latency, or success-rate evidence
      - - Train and compare models
        - Teams manage training, evaluation, and checkpoint selection
        - Coordinate pre-training, post-training, evaluation, and checkpoint comparison
        - Live TPU cluster confirms training capability, not model quality
        - No model results, reproducibility package, or cost-performance data
      - - Apply AI R&D in scientific domains
        - Domain teams rely on scarce ML specialists and infrastructure
        - Extend lab-grade model work to scientists and domain experts
        - No customer or deployment outcome disclosed
        - Initial domain scope, workflow integration, and regulated-use controls remain unclear
    notes: >-
      Proposed roles come from investor and partner descriptions; no row has a
      public customer-controlled outcome measure in the assigned evidence.
    claimRefs: [CE002, CE004, CE006, CE009, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Disclosed dependency
      - Principal risk
    rows:
      - - Accelerator layer
        - Run model pre-training, post-training, and reinforcement learning
        - Google TPU v5P and NVIDIA accelerated systems on Google Cloud
        - Capacity, pricing, supply, and provider concentration
      - - Cluster and control layer
        - Provision and manage TPU and GPU environments
        - Managed training clusters in Gemini Enterprise Agent Platform
        - Control-plane concentration and cross-accelerator operational complexity
      - - Training and evaluation layer
        - Coordinate pre-training, post-training, evaluations, and checkpoint comparison
        - Undisclosed internal software plus Google Cloud infrastructure
        - No public benchmark methodology, reproducibility, or quality thresholds
      - - Agent and research-loop layer
        - Propose experiments, execute code, interpret results, and select next actions
        - Agent harness, training data, and model strategy designed together
        - Error propagation, unsafe tool use, weak oversight, and unverified autonomy
    notes: >-
      Architecture is reconstructed from partner and investor descriptions and
      does not establish production reliability, security controls, or customer availability.
    claimRefs: [CE005, CE007, CE008, CE009, CE010, CE016]
figures:
  - id: FE001
    title: Disclosed product and technology stack
    type: stack
    summary: >-
      Public disclosures support four interdependent layers, but only the
      infrastructure layer has a concrete deployment milestone.
    data:
      layers:
        - label: User workflow
          detail: AI researchers and engineers first; domain scientists are a later ambition.
          items:
            - Research problem definition
            - Experiment review and oversight
        - label: Research orchestration
          detail: A lab-grade platform coordinates experiments and research state.
          items:
            - Experiment planning
            - Checkpoint comparison
        - label: Agent and product layer
          detail: A lab-grade system intended to automate parts of the research loop.
          items:
            - Agent harness
            - Experiment execution
        - label: Evaluation layer
          detail: Evals and result interpretation guide the next research action.
          items:
            - Model evaluations
            - Result interpretation
        - label: Model and training layer
          detail: Specialized frontier models, training data, evaluations, and post-training.
          items:
            - Pre-training and post-training
            - Reinforcement learning
        - label: Compute and control layer
          detail: Google Cloud AI Hypercomputer with managed heterogeneous training clusters.
          items:
            - TPU v5P
            - NVIDIA accelerated systems
    approximationNotes: >-
      The ordering is analytical, not a disclosed internal diagram; undisclosed
      interfaces, data stores, security boundaries, and serving components are omitted.
    claimRefs: [CE001, CE004, CE009, CE016]
callouts:
  - calloutType: risk
    title: Infrastructure readiness is not product validation
    body: >-
      Live TPU capacity and a heterogeneous cluster design reduce one execution
      uncertainty, but they do not demonstrate model quality, autonomous-research
      accuracy, customer access, reliability, or safe operation.
    claimRefs: [CE009, CE012, CE013, CE016]
