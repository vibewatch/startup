      - - 悲观
        - 产品和客户证明仍然缺失，同时算力和人才成本持续消耗资本
        - 预计估值压缩、结构化融资或下轮融资
        - 由于运营和安全条款未披露，重要性较高
        - 人才流失、基准表现疲弱，或在商业证明之前融资
