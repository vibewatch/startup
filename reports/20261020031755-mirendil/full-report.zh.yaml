  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合不止是已命名的科学 AI 厂商
        blocks:
          - type: paragraph
            body: >-
              Mirendil 试图把大型前沿实验室已经在内部使用的能力外部化：帮助研究人员提出实验、运行代码、解读结果、管理算力并决定下一步尝试什么的系统。因此，Anthropic、OpenAI、Google
              DeepMind 及类似实验室内部的专有研究平台，是最强的现有参照，即使它们没有作为独立产品销售。买方还可以在内部组合开放模型、通用 API、编排、评测和算力，或继续采用由人主导的科学与 AI
              研发工作流。指定证据没有列出可防御的直接垂直同业，因此竞争格局按解决方案类别组织，而不是凭空编造竞争者名单。
