  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 已报告的融资规模无法抵消运营和安全条款的证据缺失，因此形成由里程碑触发的“继续研究”立场。
    data:
      nodes:
        - id: financing-mark
          label: 已报告融资估值
          value: $200M seed at roughly $1B
          note: 多篇 2026 年 6 月报道相互印证了这轮融资的核心信息
        - id: team-thesis
          label: 团队与技术论点
          value: 20 researchers reported
          note: 计划自动化 AI 研发闭环的 AI 系统
        - id: operating-proof
          label: 运营证明
          value: Not publicly established
          note: 融资前没有已上线产品或已报告收入
        - id: financing-terms
          label: 融资条款
          value: Undisclosed
          note: 股权结构表、优先权、投票权和老股转让均不可得
        - id: entry-gate
          label: 进入门槛
          value: Milestone evidence required
          note: 基准、重复客户、经济效益、现金消耗和现金跑道
        - id: recommendation
          label: 推荐
          value: Research-more / track
          note: 没有可辩护的公开公允价值或回报区间
      edges:
        - from: financing-mark
          to: team-thesis
        - from: team-thesis
          to: operating-proof
        - from: operating-proof
          to: financing-terms
        - from: financing-terms
          to: entry-gate
        - from: entry-gate
          to: recommendation
    approximationNotes: 该流程是定性的，不会把已报告的融资估值转换为持股比例、公允价值或预期回报。
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV010
      - CV014
      - CV016
