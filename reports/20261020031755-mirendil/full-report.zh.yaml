        blocks:
          - type: paragraph
            body: >-
              资本和团队履历提供的是资源，不是持久产品优势的证明。Mirendil 据报道以约 10 亿美元估值完成 2 亿美元种子轮，团队约有 20 名研究人员；但独立报道称，公司在该轮融资前尚未交付产品，截至 2026 年
              6 月下旬也没有发布公开技术细节。评论还指出，早期合作、研究成果和模型性能，是其能否在 Google DeepMind
              等现有者面前脱颖而出的关键证明点。不利情形很直接：前沿实验室可以持续改进专有内部工具，开放模型可以降低自建成本，而 Mirendil 尚未公开证明其集成系统能带来更优结果。
