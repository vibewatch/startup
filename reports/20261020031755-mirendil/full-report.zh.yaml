  - id: TV002
    title: 多头论点与反方论点
    columns:
      - 立场
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 多头论点
        - 前沿实验室人才可能压缩 AI 研究迭代周期
        - 独立基准显示研究结果更快或更好
      - - 多头论点
        - 外部科学组织可能重视 AI 研发自动化，而不必自建完整 AI 实验室
        - 多个科学垂直领域出现重复部署和付费续约
      - - 反方论点
        - 据报道的估值早于公开的产品和收入证明
        - 产品已上线，性能可复现，并披露商业牵引力
      - - 反方论点
        - 内部前沿实验室工具和移动的研究人才可能削弱差异化
        - 留存持久、工作流优势具备专有性，且客户切换成本较高
    notes: 这些论点综合了留存的来源；拟议的判断变化测试是尽调门槛，不是公司报告的预测或承诺。
