        - 分配到的公开材料中没有证据
        - 基准无法复现，或客户没有扩大使用
      - - 基准
        - 技术发布逐步出现，但商业采用和经济效益仍不清晰
        - 在不高于报告估值的价格下跟踪；目前还没有可辩护的回报目标
