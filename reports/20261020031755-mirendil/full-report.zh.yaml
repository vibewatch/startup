  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与用户工作流
        blocks:
          - type: paragraph
            body: >-
              Mirendil 的预期产品不是通用聊天机器人，也不是单一模型端点。最清晰的描述是一套面向实验室的研究系统：训练专门用于 AI
              研发的前沿模型，并在环境中封装提出实验、编写和运行代码、解读结果、调试失败、比较检查点以及决定下一步尝试什么等能力。初期用户预计是工程师和 AI
              研究人员，长期目标是让科学家及其他领域专家无需先建立内部前沿实验室就能运行实验。这是一套连贯的工作流主张，但现有证据主要仍是发行方、投资人和合作伙伴的描述，而非用户实际观察到的产品行为。6
              月报道称融资前尚未交付产品；指定证据中的后续公开记录显示的是基础设施进展，而非普遍可用的产品或经测量的工作流收益。
