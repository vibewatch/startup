              - CV010
              - CV014
              - CV016
      - number: '8.2'
        title: 正方论点与反方论点
        blocks:
          - type: paragraph
            body: >-
              正方论点是：经验丰富的前沿实验室团队能够把 AI 研究自动化变成面向缺乏前沿实验室基础设施的科学用户的有价值平台。现有来源一致描述了一套旨在自动化实验设计、模型迭代和 AI 研发闭环其他环节的系统，并报道了
              a16z、Kleiner Perkins 和 NVIDIA
              的支持。反方论点同样重要：估值先于公开产品和收入证明，按已报道人数计算团队仍然很小，而前沿实验室可以在内部构建类似工具。因此，投资逻辑取决于能否在资本消耗或人才竞争侵蚀期权价值之前，把技术人才转化成差异化且被外部采用的工作流。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.3'
        title: 融资与可比背景
        blocks:
          - type: paragraph
            body: >-
              FundedIQ 记录一笔于 2026 年 6 月宣布的 $200 million 种子轮，并称该轮超过其过去两年跟踪的 AI 轮次 $6 million 中位数。3 月报道曾称公司以同一 $1 billion
              估值洽谈 $175 million 融资，之后条款才最终确定，因此交割金额发生变化，而报道中的估值 headline 保持不变。Cryptopolitan 将最终估值描述为投后估值，并估算约 20%
              的所有权，但这是出版方分析，不是股权结构表证据；证券类型、期权池处理、投票权、清算优先权和老股转让部分仍不可得。某低声誉比较来源将 Mirendil 与其他由高履历创始人打造的产品前 AI
              实验室放在一起，这可作为背景，但不是独立价格基准。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.4'
        title: 情景、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >-
              由于缺少经营预测、单位经济性、所有权条款和已验证的当前估值，情景分析必须保持定性。乐观情景要求产品性能有基准、部署可重复、经常性经济性持久且据报道的研究团队得以留住；只有届时，投资人才应重新对 6
              月估值或更高价格作投资判断。基准情景是技术持续进步但没有商业证明，这支持跟踪，却不支持高于报道估值入场。悲观情景是产品和客户验证长期缺失，同时算力和人才支出消耗融资，造成下轮融资或优先权悬垂风险。在作出任何投资决定前，最终尽调应取得股权结构表、融资文件、月度烧钱、跑道计划、基准方法、客户参考、销售管道、定价和退出所有权模型。
            claimRefs:
              - CV004
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 可以跟踪公司，但在没有产品、客户、经济性、跑道和证券条款证据前，不要把 2026 年 6 月的估值 headline 当作当前公允价值估计。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
              - CV016
          - type: callout
            title: 融资估值不是股权结构表证据
            body: 出版方约 20% 的所有权估计依赖其对投后估值的界定；实际稀释和优先权悬垂需要融资文件。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
