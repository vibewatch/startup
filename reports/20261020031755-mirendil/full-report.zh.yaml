              将大学和研究机构列为预期用户，但这类目标客户描述不能证明已有签约或付费客户。同一公开资料集也没有销售周期、获客成本、回本期、销售管道、转化率或渠道经济性数据。因此无法评估收入质量，甚至不宜做方向性的市场进入效率比较。正确的投资判断处理应是不可得，而不是零：不能把未披露信息转换成假定的
