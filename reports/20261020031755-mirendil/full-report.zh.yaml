      - number: '3.3'
        title: 分发可能成为切入口；定价与锁定仍未解决
        blocks:
          - type: paragraph
            body: >-
              Mirendil 的拟议切入口，是向缺乏前沿实验室基础设施的机构提供面向实验室级别的 AI
              研究能力。第三方资料将大学和研究机构列为潜在用户，投资人主张则从技术用户出发，最终触达科学领域专家。如果产品控制实验、检查点、评测历史和算力工作流，运营集成与研究上下文可能逐步形成转换成本。但这仍是推断，而非观察到的客户行为。现有来源没有披露目录价、产品包装、合同计量单位、折扣、渠道条款或已实现的客户经济性，因此价格比较尚未成为可能。
