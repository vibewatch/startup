      - number: '3.2'
        title: 差异化取决于整合完整研究闭环
        blocks:
          - type: paragraph
            body: >-
              目前最完整的差异化表述不是单一模型或科学数据优势，而是一套端到端系统主张：面向 AI
              研发的专用前沿模型，加上智能体框架、评测、训练、基础设施和对算力的直接控制。预期产品将更自主地围绕研究和工程问题循环，先服务工程师和 AI
              研究人员，再扩展到科学家及其他领域专家。这种架构可能降低内部自建的专业门槛，但现有证据主要来自投资人对预期系统的描述。保留来源没有提供公开技术细节或性能证据。
