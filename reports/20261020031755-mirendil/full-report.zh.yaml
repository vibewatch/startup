  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              首先应把 Mirendil 看作 AI 研发自动化平台，而不是所有未来可能使用 AI 的行业之和。据报道，系统范围涵盖假设与实验生成、超参数搜索、模型评测、调试、训练迭代和算力控制。因此，核心市场是开展高级 AI
              研究所需的工具、模型和工作流。第二层是未经证明的外部赋能机会：大学、研究所和企业可以借助 Mirendil
              构建专用模型，而无需维护前沿规模的机器学习团队。药物发现、化学、生物、机器人和材料科学属于下游邻接领域，因为来源只描述了预期应用，没有披露已交付的垂直产品或买方采用情况。主要替代方案包括内部机器学习工程团队、接入大型前沿实验室，以及由人监督的实验周期。在
              Mirendil 建立产品和采购流程之前，这一边界可以避免把广泛的科学或企业 AI 支出计入可服务需求。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有来源没有提供市场价值、增长率、按地域划分的分母或可支持数字化 TAM、SAM、SOM 的方法论。现有证据只能确立三个定性层次：AI
              研究自动化本身；希望获得类似前沿能力、但没有同等人员配置的外部机构；以及可能应用所得模型的下游科学领域。这些层次有助于安排尽调顺序，但不能相加或直接转化为收入机会。2 亿美元种子融资和据报道 10
              亿美元的估值，说明投资人愿意在商业化前为这套主张注资；它们既不是市场规模，也不是客户需求。某目录的 “Inquire”
              定价标签同样不是公司发布的定价证据。因此，正确的规模结论是未量化：在管理层提供产品边界、定价单位、目标账户全集、预期采用率和有证据支持的年度预算前，任何投资模型都应将市场收入保留为明确缺口。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM013
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM016
      - number: '2.3'
        title: 买方、用户、付款方与采用约束
        blocks:
          - type: paragraph
            body: >-
              公开描述将研究机构、大学、医院、制药公司以及机器人或材料科学团队列为预期用户，但没有指出签约买方、付款方、预算负责人、采购流程、实施顺序或续约机制。拟议的采用触发因素是组织稀缺性：领域专家希望使用高级定制
              AI，却缺少大型机器学习工程组织或前沿实验室基础设施。这一主张可能支撑需求，但也抬高了证明门槛。客户需要确信，自主实验闭环能带来可复现、可审计的改进，而且算力、数据和工作流集成的经济性优于内部团队或现有实验室。现有报道没有产品、收入、公开技术路线图、客户案例或已验证的采购事件，独立评论还称递归式自我改进挑战尚未在规模上得到验证。因此，近期采用和估值应以产品访问、基准化模型性能、设计合作伙伴转化、定价以及预算归属证据为前提。
            claimRefs:
