schemaVersion: "report-v2"
artifact: financials
slug: mirendil
runDate: 2026-10-20
company:
  name: Mirendil
chapter:
  number: 4
  title: Financials
  summary: >-
    Mirendil has disclosed a $200 million seed financing, but the retained public
    evidence does not disclose pricing, revenue, unit economics, burn, cash on hand,
    or runway. The financial case therefore rests on capitalized research capacity
    and an unproven path from technical progress to commercial revenue.
sections:
  - id: revenue-model
    title: Revenue model remains a hypothesis
    body: >-
      Public descriptions position Mirendil as an AI R&D platform for external
      organizations and discuss giving scientific teams greater control over their
      AI systems and infrastructure. Those descriptions establish a potential
      product direction, not a revenue stream: the retained evidence does not state
      whether customers would pay through subscriptions, usage, licenses, services,
      or another mechanism. It also gives no revenue mix or recognition policy.
      Reporting in June said no product or revenue had been disclosed before the
      seed round, while another source said a first model and product were planned
      for the following months. No retained October evidence verifies that the
      planned release occurred or converted into contracts.
    claimRefs: [CI003, CI004, CI009, CI010, CI015]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-gtm
    title: Pricing, contracts, and sales efficiency are undisclosed
    body: >-
      No retained source provides list pricing, realized pricing, a contract unit,
      discounting, billing cadence, channel terms, or revenue-recognition detail.
      MapCo identifies universities and research institutions as intended users, but
      that target-customer description is not evidence of a signed or paying
      customer. The same public set provides no sales-cycle, customer-acquisition
      cost, payback, pipeline, conversion, or channel-economics data. This prevents
      an assessment of revenue quality and makes even a directional go-to-market
      efficiency comparison premature. The correct underwriting treatment is
      unavailable rather than zero: absent disclosures cannot be converted into
      assumed SaaS metrics.
    claimRefs: [CI003, CI009, CI010, CI011]
    tableRefs: [TI002]
  - id: cost-and-capital
    title: Financing is visible; capital adequacy is not
    body: >-
      Multiple reports describe a $200 million seed round, and FundedIQ records one
      disclosed round of that amount in June 2026. That funding figure is neither a
      reported cash balance nor evidence of current liquidity. The retained sources
      provide no monthly burn, gross margin, serving cost, working-capital profile,
      capex, debt, or project-finance obligations, so runway cannot be calculated.
      Qualitatively, the cost base is likely exposed to expensive frontier compute
      and scarce research talent: ValueAdd VC explicitly characterizes both as
      costly, and a March report described hiring researchers and expanding compute
      as uses enabled if the financing closed. Those statements identify cost
      pressure, not quantified spend.
    claimRefs: [CI001, CI005, CI006, CI007, CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      The available evidence supports a well-financed research program, not an
      underwritable operating model. The seed round can fund experimentation, but it
      does not establish revenue quality, gross-margin potential, efficient
      acquisition, or sufficient runway. Mirendil's financial path depends on a
      sequence that remains publicly unverified: ship a product, demonstrate
      technical value, convert target institutions into paying customers, define
      durable pricing, and show that revenue can outrun compute and talent costs.
      Until management supplies bank balances, monthly burn, committed compute and
      compensation obligations, pipeline, contracts, revenue recognition, and
      cohort economics, capital adequacy and margin trajectory remain material
      diligence blockers rather than estimable outputs.
    claimRefs: [CI003, CI004, CI010, CI011, CI012, CI013, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams and commercialization status
    columns:
      - Product or stream
      - Publicly described mechanism
      - Revenue unit
      - Current public status
      - Evidence quality
      - Diligence request
    rows:
      - - AI R&D platform
        - Capabilities described as a platform for external organizations
        - Not disclosed
        - No reported product or revenue before the seed close
        - Third-party description; no contract evidence
        - Provide SKU, contract form, billing unit, and recognized revenue
      - - First model or product
        - Planned release was reported for the months after June 2026
        - Not disclosed
        - Release and monetization not verified in the retained evidence
        - Forward-looking third-party report
        - Provide launch date, availability, price, bookings, and revenue
      - - Customer-owned AI infrastructure
        - Scientific teams may own systems and infrastructure rather than depend on major labs
        - Not disclosed
        - Product positioning only; no disclosed commercial terms
        - Company positioning relayed by third-party media
        - Provide license, deployment, support, and compute-pass-through terms
      - - Scientific institution access
        - Universities and research institutions identified as target customers
        - Not disclosed
        - Target segment disclosed; paying customers not evidenced
        - Aggregator description; no customer corroboration
        - Provide customer list, signed contracts, ACV, and renewal structure
    notes: >-
      Public-source status as of 2026-10-20; rows describe reported product directions,
      not verified revenue streams, and null commercial terms mean unavailable rather than zero.
    claimRefs: [CI003, CI004, CI009, CI010, CI015]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Pricing dimension
      - Public value
      - What the evidence establishes
      - What cannot be inferred
      - Diligence request
    rows:
      - - List price
        - Not disclosed
        - No retained source publishes a price
        - Realized price or willingness to pay
        - Current price book and dated customer quotes
      - - Billing unit
        - Not disclosed
        - No public seat, usage, model, compute, or project unit
        - Revenue scalability or usage sensitivity
        - Contract-level billing metric and usage schedule
      - - Contract structure
        - Not disclosed
        - No public term, minimum, renewal, or cancellation terms
        - Backlog quality, duration, or retention
        - Executed customer contracts and standard order form
      - - Discounts and compute pass-through
        - Not disclosed
        - No public discount or infrastructure-cost treatment
        - Gross-to-net revenue or margin exposure
        - Discount waterfall and compute-cost allocation
      - - Revenue recognition and mix
        - Not disclosed
        - No revenue categories or accounting policy are public
        - Recurrence, concentration, or timing of recognition
        - Revenue ledger by stream and recognition memorandum
    notes: >-
      Absence is bounded to the retained public evidence and does not prove that
      Mirendil lacks internal pricing or contracts.
    claimRefs: [CI010, CI011]
  - id: TI003
    title: Unit economics and capital-adequacy gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence request
    rows:
      - - Disclosed funding
        - "$200M seed; one round on FundedIQ"
        - Medium
        - Establishes financing raised, not cash currently available
        - Bank balance, closing statement, fees, and restricted cash
      - - Revenue or ARR
        - Not disclosed
        - Medium
        - Prevents assessment of traction and capital efficiency
        - Monthly recognized revenue, ARR definition, and customer ledger
      - - Gross margin and serving cost
        - Not disclosed
        - Medium
        - Frontier compute may make revenue expensive to deliver
        - Compute, inference, data, support, and hosting cost by product
      - - CAC, sales cycle, and payback
        - Not disclosed
        - Medium
        - Prevents assessment of go-to-market efficiency
        - Funnel, sales capacity, acquisition spend, and cohort payback
      - - Monthly burn
        - Not disclosed
        - Medium
        - Required to translate financing into runway
        - Monthly cash flow and operating expense by function
      - - Cash runway
        - Not estimable
        - High confidence in the gap
        - Funding raised is not cash available and no burn is public
        - Current cash, committed outflows, hiring plan, and downside case
      - - Debt, capex, and working capital
        - Not disclosed
        - Medium
        - Could materially change liquidity and financing needs
        - Debt schedule, compute commitments, leases, capex plan, and payables
    notes: >-
      Values are public-source observations, not management accounts; undisclosed
      metrics are intentionally left unavailable and no burn or runway estimate is inferred.
    claimRefs: [CI001, CI007, CI010, CI011, CI012, CI013, CI014]
