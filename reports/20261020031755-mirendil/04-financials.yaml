        - id: customer-contracts
          label: Paying customer contracts
          value: Not disclosed
          detail: Target users are described, but signed contracts are not evidenced.
        - id: recognized-revenue
          label: Recognized revenue
          value: Not disclosed
          detail: Pricing, billing unit, revenue mix, and recognition are unavailable.
        - id: gross-profit
          label: Gross profit
          value: Not estimable
          detail: Revenue and serving-cost inputs are both missing.
    approximationNotes: >-
      The ordered flow is conceptual and does not imply conversion rates, timing,
      value-proportional widths, or a quantified bridge.
    claimRefs: [CI001, CI003, CI004, CI012, CI014, CI016]
callouts:
  - calloutType: risk
    title: Runway cannot be derived from the round size
    body: >-
      The $200 million financing is a historical funding amount. Without current cash,
      burn, committed compute, compensation, capex, and debt obligations, it cannot be
      treated as cash available or converted into months of runway.
    claimRefs: [CI001, CI012, CI013, CI014]
  - calloutType: insight
    title: Commercial proof trails capital formation
    body: >-
      Reporting placed the financing at roughly a $1 billion post-money valuation
      before disclosed product or revenue, making technical delivery and customer
      conversion the central financial proof points.
    claimRefs: [CI002, CI003, CI016]
