slug: "mirendil"
runDate: "2026-10-20"
company:
  name: "Mirendil"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Mirendil is a San Francisco frontier-AI lab building systems intended to automate
    AI research and development. Its June 2026 $200 million seed round at a reported
    roughly $1 billion post-money valuation provides substantial financing, but public
    evidence still does not establish a shipped product, revenue, customers, current
    exact headcount, board composition, or technical performance.
sections:
  - id: "identity-and-mission"
    title: "Identity, mission, and operating premise"
    body: >-
      Mirendil describes itself as a frontier lab that trains models for AI R&D and
      redesigns the research loop to make experimentation faster and more autonomous.
      The intended proposition is not a conventional point application: the system is
      meant to perform research and engineering work, control compute, and eventually
      make frontier capabilities usable by scientific teams that cannot build a large
      AI lab. Third-party profiles place the company in San Francisco and at seed stage.
      This establishes a clear thesis and target user context, but it is still a
      company-stated operating vision rather than evidence of a released product,
      measurable performance, or a validated commercial model.
    claimRefs: ["CO001", "CO004", "CO005", "CO016"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Founding team, leadership, and governance"
    body: >-
      Public reporting consistently names Behnam Neyshabur, Harsh Mehta, Shayan
      Salehian, and Tara Rezaei as co-founders. MapCo identifies Neyshabur as CEO and
      Mehta as CTO, while multiple reports describe a founding team of about twenty
      researchers and engineers with experience from Anthropic, OpenAI, Google
      DeepMind, and xAI. That concentration of frontier-lab experience is the principal
      founder-market-fit signal. It also creates key-person and team-integration risk:
      no retained source identifies an independent board, broader executive bench,
      voting arrangements, investor rights, or succession coverage.
    claimRefs: ["CO002", "CO003", "CO013", "CO014"]
    tableRefs: ["TO002"]
  - id: "capital-and-scale"
    title: "Capitalization, scale, and stakeholder exposure"
    body: >-
      Mirendil announced a $200 million seed financing in June 2026, co-led by
      Andreessen Horowitz and Kleiner Perkins with NVIDIA participating. Independent
      coverage reported a roughly $1 billion post-money valuation. These are financing
      terms, not evidence of revenue, cash currently available, or commercial traction.
      FundedIQ records one disclosed round and an 11-50 employee band; separate June
      reporting described a twenty-person founding team, which is directionally
      consistent but does not establish current exact headcount. Revenue, ARR,
      customers, burn, runway, debt, secondaries, ownership, and additional operating
      locations remain unavailable from the retained evidence.
    claimRefs: ["CO005", "CO006", "CO007", "CO011", "CO012", "CO014"]
    tableRefs: ["TO003"]
  - id: "milestones-and-diligence-implications"
    title: "Milestones and the current diligence posture"
    body: >-
      The public sequence moved rapidly from reported founder departures in December
      2025 and March 2026 financing talks to a formal June launch and much larger closed
      seed round. The strongest adverse evidence is not a recorded legal or regulatory
      incident; it is the mismatch between capital committed and public operating proof.
      June coverage stated that no product, revenue, or technical details had been
      disclosed, and the official homepage reviewed on the run date still presented a
      mission statement without a named product, benchmark, pricing, customer proof, or
      roadmap. The investment case therefore depends primarily on team pedigree,
      investor backing, and the unvalidated self-accelerating-R&D thesis.
    claimRefs: ["CO008", "CO009", "CO010", "CO015"]
    figureRefs: ["FO001"]
