  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Mirendil should be analyzed first as an AI R&D automation platform, not as the sum of every industry that
              may eventually use AI. The reported system scope covers hypothesis and experiment generation,
              hyperparameter search, model evaluation, debugging, training iteration, and control of compute. That makes
              the core market the tools, models, and workflows used to conduct advanced AI research. A second, still
              unproven layer is external enablement: universities, institutes, and companies using Mirendil to build
              specialized models without maintaining a frontier-scale ML team. Drug discovery, chemistry, biology,
              robotics, and materials science are downstream adjacencies because the sources describe intended
              applications but disclose no shipped vertical product or buyer adoption. The principal substitutes are
              internal ML engineering teams, access to a large frontier laboratory, and human-supervised experiment
              cycles. This boundary prevents broad scientific or enterprise-AI spending from being counted as
              addressable demand before Mirendil establishes a product and purchasing motion.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              None of the retained sources supplies a market value, growth rate, geography-specific denominator, or
              methodology that can support a numeric TAM, SAM, or SOM. The available evidence instead establishes three
              qualitative layers: autonomous AI research itself, external organizations seeking frontier-like capability
              without equivalent staffing, and downstream scientific domains that could apply the resulting models.
              Those layers are useful for diligence sequencing but cannot be added together or translated into revenue
              opportunity. The $200 million seed financing and reported $1 billion valuation show investor willingness
              to capitalize the thesis before commercialization; they are neither market size nor customer demand. A
              directory's "Inquire" pricing label is also not company-issued pricing evidence. The appropriate sizing
              conclusion is therefore unquantified: any investment model should hold market revenue at an explicit gap
              until management provides a product boundary, pricing unit, target account universe, expected adoption
              rate, and evidence-backed annual budget.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM013
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Public descriptions name research institutions, universities, hospitals, pharmaceutical companies, and
              robotics or materials-science teams as intended users. They do not identify a contracted buyer, payer,
              budget owner, procurement process, implementation sequence, or renewal mechanism. The proposed adoption
              trigger is organizational scarcity: domain experts want advanced custom AI but lack a large ML engineering
              organization or frontier-lab infrastructure. That thesis could support demand, yet it also creates a
              demanding proof threshold. Customers would need confidence that autonomous experiment loops produce
              reproducible, auditable improvements and that compute, data, and workflow integration deliver better
              economics than internal teams or existing labs. The retained coverage reports no product, revenue, public
              technical roadmap, customer case study, or verified procurement event, while independent commentary calls
              the recursive self-improvement challenge unproven at scale. Near-term adoption and valuation should
              therefore be gated on product access, benchmarked model performance, design-partner conversion, pricing,
              and evidence of who owns the budget.
            claimRefs:
              - CM003
              - CM006
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM009
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market size remains an underwriting gap
            body: >-
              Funding and valuation cannot substitute for TAM, SAM, or SOM. Require a defined product unit,
