chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating premise
        blocks:
          - type: paragraph
            body: >-
              Mirendil describes itself as a frontier lab that trains models for AI R&D and redesigns the research loop
              to make experimentation faster and more autonomous. The intended proposition is not a conventional point
              application: the system is meant to perform research and engineering work, control compute, and eventually
              make frontier capabilities usable by scientific teams that cannot build a large AI lab. Third-party
              profiles place the company in San Francisco and at seed stage. This establishes a clear thesis and target
              user context, but it is still a company-stated operating vision rather than evidence of a released
              product, measurable performance, or a validated commercial model.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO016
