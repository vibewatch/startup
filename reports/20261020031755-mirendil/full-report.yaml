  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and user workflow
        blocks:
          - type: paragraph
            body: >-
              Mirendil's intended product is not a general chatbot or a single model endpoint. The clearest description
              is a lab-grade research system that trains frontier models specialized in AI R&D and wraps them in an
              environment for proposing experiments, writing and running code, interpreting results, debugging failures,
              comparing checkpoints, and deciding what to try next. The initial users are expected to be engineers and
              AI researchers, with a longer-term ambition to let scientists and other domain experts run experiments
              without first building an internal frontier lab. This is a coherent workflow thesis, but the evidence
              remains mostly issuer, investor, and partner description rather than user-observed product behavior. A
              June report said no product had shipped before the financing; the later public record in the assigned
              evidence shows infrastructure progress, not a generally available product or measured workflow benefit.
            claimRefs:
