      - number: '3.4'
        title: The moat is a thesis until product and benchmark evidence arrives
        blocks:
          - type: paragraph
            body: >-
              Capital and team pedigree provide resources, not proof of durable product advantage. Mirendil raised a
              reported $200 million seed round at roughly a $1 billion valuation and assembled a team reported at about
              20 researchers, but independent coverage said it had not shipped a product before the round and had
              released no public technical details by late June 2026. Commentary also identifies early partnerships,
