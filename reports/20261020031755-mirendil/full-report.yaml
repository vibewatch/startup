              end-to-end systems thesis: specialized frontier models for AI R&D combined with an agent harness,
              evaluation, training, infrastructure, and direct control of compute. The intended product would loop more
              autonomously over research and engineering problems, initially serving engineers and AI researchers before
              expanding toward scientists and other domain experts. That architecture could reduce the expertise burden
