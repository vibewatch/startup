        title: Distribution could be the wedge; pricing and lock-in are unresolved
        blocks:
          - type: paragraph
            body: >-
              Mirendil's proposed wedge is external access to lab-grade AI research capability for organizations that
              lack a frontier lab's infrastructure. Third-party profiles identify universities and research institutions
