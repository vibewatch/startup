              - CU002
              - CU003
              - CU004
              - CU005
              - CU012
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public evidence remains too early to assess customer durability. Two June 2026 reports said Mirendil had
              no released product or reported revenue at that time, while another report said a first model and product
              were planned for the coming months. The August compute announcement advances infrastructure readiness but
              does not close the commercialization gap. Across the eight retained sources, there is no disclosed NRR,
              GRR, churn, renewal rate, contract duration, cohort retention, satisfaction measure, pipeline, customer
              count, pricing, revenue concentration, or channel mix. The proposed land-and-expand mechanism is
              conceptually plausible: researchers could begin with one research workflow and broaden use across
              experiments, models, and scientific domains. However, no source shows that loop occurring in a customer
              account. A primary diligence request should reconcile the large compute commitment with signed demand,
              implementation milestones, and evidence that usage persists beyond an initial evaluation.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Compute commitment is not customer validation
            body: >-
              The Google Cloud agreement strengthens Mirendil's capacity story, but it does not identify a paying
              end-customer. Underwrite commercialization only after reviewing named references, deployment status,
              contract value, retention, and concentration data.
            calloutType: risk
            claimRefs:
              - CU004
              - CU006
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile
        blocks:
          - type: paragraph
            body: >-
              The highest-ranked risks are execution proof, compute and capital concentration, and conditional
              regulatory readiness. Two June reports said Mirendil had not yet released a product, revenue evidence, or
              technical detail, while subsequent public evidence in the assigned pool establishes infrastructure scale
              rather than product performance or commercialization. The Google Cloud arrangement is operationally
              meaningful: Mirendil describes complex pre-training, post-training, reinforcement-learning, and parallel-
              experiment workloads, and TechCrunch reported a multiyear deal above $100 million. That amount is a
              reported contract value, not cash burn or a current liability, and the $200 million raised is not
              equivalent to cash available. The heatmap is therefore a qualitative evidence-based ranking, not a
              measured probability model. Product-proof delay and compute economics remain the central thesis risks
              until benchmarks, customer use, contract economics, and runway are verified.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR012
              - CR014
