      - number: '6.2'
        title: Adoption and reference quality
        blocks:
          - type: paragraph
            body: >-
              The strongest current external evidence concerns supply-side capacity, not demand. In August 2026,
              TechCrunch reported a multiyear Google Cloud partnership worth upward of $100 million according to
              Mirendil's CEO, and Mirendil said the arrangement provides TPUs, NVIDIA infrastructure, and managed
              training clusters. Google is described as an infrastructure provider and strategic partner; none of the
              retained sources presents it as a paying customer. TechCrunch also quotes management referring generically
              to “customers using our systems,” but supplies no names, account count, deployment status, usage measure,
              commercial term, or customer-verified outcome. This is a signal that Mirendil is discussing a
              customer-facing system, not proof of production adoption. The evidence set therefore cannot distinguish
              pilots, design partners, unpaid research collaborations, contracted customers, or active paid deployments.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU011
              - CU012
          - type: table
