              - CR015
      - number: '7.2'
        title: Regulatory, legal, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              Mirendil and its backers describe increasingly autonomous AI research systems and potential use in
              medicine, biology, materials science, and other scientific domains. Those ambitions create conditional
              data-rights, privacy, model-control, safety, and domain-regulation questions, but the assigned public
              sources do not establish that Mirendil currently operates a regulated medical product or has violated any
              rule. They also do not supply a safety evaluation, regulatory classification, privacy or data-retention
              framework, or intellectual-property provenance review. The correct conclusion is a diligence gap, not an
              allegation or proof of noncompliance. Residual severity is high because an adverse finding could constrain
              product scope or delay deployment; likelihood remains provisional until management provides product
              boundaries, jurisdiction maps, model-evaluation results, dataset rights, and legal opinions.
            claimRefs:
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR010
              - CR013
      - number: '7.3'
        title: Dependencies and mitigation maturity
        blocks:
          - type: paragraph
            body: >-
              Google Cloud is both a credible mitigation and a concentration point. Managed clusters, TPUs, NVIDIA
              infrastructure, and workload-to-accelerator matching can reduce operational complexity and some
              single-chip lock-in, but the public record does not disclose service levels, capacity guarantees,
              termination rights, pricing resets, portability costs, or minimum spend. NVIDIA also appears in two roles:
              investor and infrastructure provider; this is an ecosystem alignment, not evidence of misconduct, but it
              correlates financing and hardware exposure. The roughly 20-person reported team brings frontier-lab
              experience, yet a small specialist organization can still face key-person and recruiting risk. Mitigation
              maturity should be treated as partial until contracts, redundancy tests, retention plans, and governance
              rights are reviewed directly.
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR011
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR011
              - CR015
              - CR016
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The investment case should be monitored against evidence, not the absence of a reported incident. A thesis
              break would be triggered by failure to produce reproducible technical evaluations and named production use
              after the company's next disclosed product milestone; inability to demonstrate at least two viable compute
              paths or contractual capacity protection; a documented safety, data-rights, or regulatory deficiency that
              blocks the intended product scope; or liquidity evidence showing less than twelve months of runway without
              committed financing. These are diligence thresholds rather than current facts. Before investment, request
              the Google agreement and payment schedule, current cash and monthly burn, model and agent evaluations,
              incident-response controls, data lineage, IP assignments, customer or design-partner evidence, founder
              retention arrangements, board and investor rights, and a jurisdiction-by-jurisdiction regulatory
              memorandum tied to the actual launch plan.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not runway
            body: >-
              The reported $200 million seed financing and $100 million-plus cloud agreement cannot establish cash
              available, payment timing, monthly burn, or runway. Underwriting requires the cash balance, committed
              versus variable spend, hiring plan, and monthly forecast.
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The decision is research-more / track, with medium confidence in the financing facts but low confidence in
              the price-to-fundamentals bridge. Multiple publishers report a $200 million seed at roughly a $1 billion
              valuation, yet contemporaneous reporting also says Mirendil had no launched product or reported revenue
              before the round. The reviewed evidence does not disclose current paying customers, pricing, recurring
              revenue, burn, runway, or preference terms. Those omissions prevent a responsible intrinsic,
              revenue-multiple, or probability-weighted exit valuation. Entry should therefore be conditioned on
              independent product benchmarks, repeat customer evidence, recurring economics, and complete financing
              documents rather than on founder pedigree or the headline mark alone.
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
