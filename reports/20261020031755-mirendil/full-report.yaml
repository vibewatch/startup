              co-founders. MapCo identifies Neyshabur as CEO and Mehta as CTO, while multiple reports describe a
              founding team of about twenty researchers and engineers with experience from Anthropic, OpenAI, Google
              DeepMind, and xAI. That concentration of frontier-lab experience is the principal founder-market-fit
              signal. It also creates key-person and team-integration risk: no retained source identifies an independent
