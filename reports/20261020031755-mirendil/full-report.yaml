  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Six evidence-backed risks compared by provisional likelihood, impact, and residual exposure.
    data:
      columns:
        - label: Provisional likelihood
          detail: Qualitative assessment based on current dependencies and public-evidence gaps
        - label: Impact
          detail: Potential effect on product delivery, commercialization, or company value
        - label: Residual exposure
          detail: Exposure remaining before private diligence confirms mitigation effectiveness
      rows:
        - label: Product-validation delay
          note: No assigned source provides Mirendil benchmarks, evaluation methods, production use, or customer outcomes.
          values:
            - Medium to high
            - High
            - High
        - label: Compute and capital concentration
          note: >-
            The reported Google agreement is material, while capacity guarantees, payment timing, minimum commitments,
            and portability remain undisclosed.
          values:
            - Medium
            - High
            - High
        - label: Regulated-domain blocker
          note: >-
            Exposure is conditional on intended use, product scope, and launch jurisdiction; no current violation is
            alleged.
          values:
            - Lower or conditional
            - High
            - Conditional high
        - label: NVIDIA ecosystem mismatch
          note: >-
            Google TPUs provide an announced alternative path, but workload allocation and software portability are not
            disclosed.
          values:
            - Medium
            - Medium
            - Medium
        - label: Key-person attrition
          note: >-
            The specialist team is reported at roughly twenty people, while retention, succession, and founder-vesting
            protections are not public.
          values:
            - Medium
            - High
            - Medium to high
        - label: Reliability complexity
          note: >-
            No assigned source provides uptime, failure-rate, recovery, security, or cost-efficiency evidence for the
            announced frontier-scale workloads.
          values:
            - Medium
            - Medium to high
            - Medium
    approximationNotes: >-
      Positions are qualitative, not numerical probabilities; no absence of a reported incident is treated as proof of
      absence, and private contract or operating data could change placement.
