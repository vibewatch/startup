              - CV008
              - CV010
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that an experienced frontier-lab team can turn AI research automation into a valuable
              platform for scientific users who lack frontier-lab infrastructure. The retained sources consistently
              describe a system intended to automate experiment design, model iteration, and other parts of the AI R&D
              loop, and they report backing from a16z, Kleiner Perkins, and NVIDIA. The anti-thesis is equally material:
              the valuation preceded public product and revenue proof, the team remains small by reported headcount
              indicators, and frontier labs can build similar tools internally. The investment case therefore depends on
              converting technical talent into differentiated, externally adopted workflows before capital consumption
              or talent competition erodes the option value.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.3'
        title: Financing and comparable context
        blocks:
          - type: paragraph
            body: >-
              FundedIQ records one disclosed round, a $200 million seed announced in June 2026, and says that round
              exceeds its $6 million median for tracked AI rounds over the prior two years. A March report had described
              talks for $175 million at the same $1 billion valuation before terms were finalized, so the closing amount
              changed while the reported headline mark held. Cryptopolitan characterizes the final mark as post-money
              and estimates roughly 20% ownership, but this is publisher analysis rather than cap-table evidence;
              security type, option-pool treatment, voting rights, liquidation preferences, and secondary components
              remain unavailable. A low-reputation comparison source places Mirendil among other credentialed-founder,
              pre-product AI labs, which is useful context but not an independent price benchmark.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.4'
        title: Scenarios, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis must remain qualitative because the evidence lacks operating forecasts, unit economics,
              ownership terms, and a verified current valuation. The bull case requires benchmarked product performance,
              repeat deployments, durable recurring economics, and retention of the reported research team; only then
              should an investor re-underwrite the June mark or a higher price. The base case is continued technical
              progress without commercial proof, which supports monitoring but not paying above the reported mark. The
              bear case is prolonged absence of product and customer validation while compute and talent spending
              consume the round, creating down-round or preference-overhang risk. Final diligence should obtain the cap
              table, financing documents, monthly burn, runway plan, benchmark methodology, customer references,
              pipeline, pricing, and an exit ownership model before any investment decision.
            claimRefs:
              - CV004
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Track the company, but do not treat the June 2026 headline valuation as a current fair-value estimate
              without product, customer, economics, runway, and security-term evidence.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
              - CV016
          - type: callout
            title: Financing mark is not cap-table evidence
            body: >-
              A publisher's roughly 20% ownership estimate depends on its post-money characterization; actual dilution
              and preference overhang require the financing documents.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
