  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is broader than named AI-for-science vendors
        blocks:
          - type: paragraph
            body: >-
              Mirendil is attempting to externalize a capability that large frontier labs already use internally:
              systems that help researchers propose experiments, run code, interpret results, manage compute, and decide
              what to try next. That makes proprietary research platforms inside Anthropic, OpenAI, Google DeepMind, and
              similar labs the strongest incumbent reference point, even if they are not sold as standalone products.
              Buyers can also assemble open models, general APIs, orchestration, evaluation, and compute internally, or
              retain human-led scientific and AI R&D workflows. The assigned evidence does not identify a defensible
              list of named direct vertical peers, so the landscape is organized by solution class rather than an
              invented competitor roster.
