      - number: '5.2'
        title: Architecture, deployment, and maturity
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture combines a research-system layer with a heterogeneous training substrate.
              Andreessen Horowitz describes backend infrastructure, an agent harness, evaluations, post-training,
              pre-training, and full-loop training data as mutually dependent design problems. Google Cloud provides the
              more concrete deployment evidence: TPU and NVIDIA accelerators through AI Hypercomputer, coordinated
              compute, storage, networking, and control planes, plus managed clusters for provisioning TPU and GPU
              environments. As of Google's August 2026 announcement, Mirendil was live on TPU v5P while NVIDIA systems
              were still coming online. That is a meaningful maturity step for the training platform, but it should not
              be mistaken for product availability, model quality, reliability, or customer readiness. The
              mixed-accelerator design provides workload flexibility but also creates material hyperscaler,
              accelerator-supply, orchestration, and cost dependencies.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE009
              - CE010
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE009
              - CE016
      - number: '5.3'
        title: Differentiation, proof points, and control gaps
        blocks:
          - type: paragraph
            body: >-
              The proposed differentiation is vertical integration across the research loop rather than a single
              foundation model: training data, model strategy, evaluation, agents, and infrastructure are intended to
              improve together. The ability to place workloads on TPUs or NVIDIA GPUs may reduce architecture lock-in at
              the accelerator level, although the current implementation remains dependent on Google Cloud. External
              evidence is still thin. A third-party site detected Kubernetes and Anthropic-related technology signals
              from the company site and job posts, but this is only a practitioner proxy, not an active repository,
              release history, package adoption metric, or public API. A March report emphasized biology and materials
              science, while later investor materials described a wider set of possible domains; the initial product
              boundary is therefore not settled. The reviewed public corpus provides no quantitative benchmark,
              evaluation methodology, service-level history, security architecture, privacy model, certification, or
              regulated-domain quality system. Until those artifacts appear, the technical case rests on team capability
              and infrastructure readiness rather than independently testable product performance.
            claimRefs:
              - CE001
              - CE010
              - CE011
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
