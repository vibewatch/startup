  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target segments and buying roles
        blocks:
          - type: paragraph
            body: >-
              Mirendil's public customer thesis is wider than its demonstrated customer base. Third-party reporting
              names universities, pharmaceutical companies, research institutes, industrial laboratories, roboticists,
              and materials scientists as organizations or practitioners that could use specialized AI-research systems.
              The company's own August 2026 announcement similarly frames medicine, biology, and materials-science teams
              as eventual users that should be able to build specialized systems without frontier-lab infrastructure.
              These are target segments, not disclosed accounts. The likely hands-on users are scientists and engineers
              running experiments, while the economic buyer and payer could be a research leader, laboratory,
              university, or enterprise; no retained source identifies procurement ownership, budget source, pricing, or
              contract form. The segmentation is therefore useful for mapping the proposed workflow, but it should not
              be read as evidence of market penetration or revenue mix.
            claimRefs:
