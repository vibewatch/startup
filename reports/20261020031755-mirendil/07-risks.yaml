company:
  name: Mirendil
chapter:
  number: 7
  title: Risks
  summary: >-
    Mirendil's most concrete exposure is concentration around frontier-scale compute:
    TechCrunch reported a Google Cloud agreement worth more than $100 million, roughly
    half the $200 million seed financing, while the payment schedule, minimum commitments,
    burn, and liquidity remain undisclosed. Product validation, safety governance, regulated-
    domain readiness, and customer proof are material public-evidence gaps, so residual risk
    remains high despite a strong founding team and a technically credible compute partnership.
sections:
  - id: ranked-risk-profile
    title: Ranked risk profile
    body: >-
      The highest-ranked risks are execution proof, compute and capital concentration, and
      conditional regulatory readiness. Two June reports said Mirendil had not yet released
      a product, revenue evidence, or technical detail, while subsequent public evidence in
      the assigned pool establishes infrastructure scale rather than product performance or
      commercialization. The Google Cloud arrangement is operationally meaningful: Mirendil
      describes complex pre-training, post-training, reinforcement-learning, and parallel-
      experiment workloads, and TechCrunch reported a multiyear deal above $100 million.
      That amount is a reported contract value, not cash burn or a current liability, and the
      $200 million raised is not equivalent to cash available. The heatmap is therefore a
      qualitative evidence-based ranking, not a measured probability model. Product-proof
      delay and compute economics remain the central thesis risks until benchmarks, customer
      use, contract economics, and runway are verified.
    claimRefs: [CR001, CR002, CR003, CR004, CR006, CR007, CR012, CR014]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-and-legal-exposure
    title: Regulatory, legal, and safety exposure
    body: >-
      Mirendil and its backers describe increasingly autonomous AI research systems and
      potential use in medicine, biology, materials science, and other scientific domains.
      Those ambitions create conditional data-rights, privacy, model-control, safety, and
      domain-regulation questions, but the assigned public sources do not establish that
      Mirendil currently operates a regulated medical product or has violated any rule.
      They also do not supply a safety evaluation, regulatory classification, privacy or
      data-retention framework, or intellectual-property provenance review. The correct
      conclusion is a diligence gap, not an allegation or proof of noncompliance. Residual
      severity is high because an adverse finding could constrain product scope or delay
      deployment; likelihood remains provisional until management provides product boundaries,
      jurisdiction maps, model-evaluation results, dataset rights, and legal opinions.
    claimRefs: [CR008, CR009, CR013]
    tableRefs: [TR001]
  - id: dependencies-and-mitigation
    title: Dependencies and mitigation maturity
    body: >-
      Google Cloud is both a credible mitigation and a concentration point. Managed clusters,
      TPUs, NVIDIA infrastructure, and workload-to-accelerator matching can reduce operational
      complexity and some single-chip lock-in, but the public record does not disclose service
      levels, capacity guarantees, termination rights, pricing resets, portability costs, or
      minimum spend. NVIDIA also appears in two roles: investor and infrastructure provider;
      this is an ecosystem alignment, not evidence of misconduct, but it correlates financing
      and hardware exposure. The roughly 20-person reported team brings frontier-lab experience,
      yet a small specialist organization can still face key-person and recruiting risk.
      Mitigation maturity should be treated as partial until contracts, redundancy tests,
      retention plans, and governance rights are reviewed directly.
    claimRefs: [CR001, CR005, CR010, CR011, CR015, CR016]
    tableRefs: [TR003]
  - id: kill-criteria-and-diligence
    title: Monitoring indicators and thesis-break triggers
    body: >-
      The investment case should be monitored against evidence, not the absence of a reported
      incident. A thesis break would be triggered by failure to produce reproducible technical
      evaluations and named production use after the company's next disclosed product milestone;
      inability to demonstrate at least two viable compute paths or contractual capacity protection;
      a documented safety, data-rights, or regulatory deficiency that blocks the intended product
      scope; or liquidity evidence showing less than twelve months of runway without committed
      financing. These are diligence thresholds rather than current facts. Before investment,
      request the Google agreement and payment schedule, current cash and monthly burn, model and
      agent evaluations, incident-response controls, data lineage, IP assignments, customer or
      design-partner evidence, founder retention arrangements, board and investor rights, and a
      jurisdiction-by-jurisdiction regulatory memorandum tied to the actual launch plan.
    claimRefs: [CR002, CR006, CR007, CR012, CR013, CR014, CR016]
