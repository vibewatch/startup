companyProfile:
  summary: >-
    Mirendil is a San Francisco frontier-AI lab founded by researchers with backgrounds across Anthropic, Google
    DeepMind, OpenAI, and xAI. It is building an integrated system of specialized models, agent tooling, evaluations,
    training workflows, and compute infrastructure intended to automate the AI R&D loop for scientific and research
    organizations. A reported $200 million seed round provides substantial capacity, but public evidence still does not
    establish a generally available product, independently measured performance, attributable paying customers, or a
    validated commercial model.
