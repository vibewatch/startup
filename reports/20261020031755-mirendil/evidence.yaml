evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board roster, cap table, voting rights, investor preferences, founder vesting, succession coverage, debt,
      secondaries, and the complete investor list.
    whyItMatters: Control, dilution, governance quality, and key-person protections cannot be assessed from financing headlines.
    diligencePath: >-
      Request the charter, bylaws, board consents, fully diluted cap table, financing documents, side letters, debt
      schedule, and founder employment and vesting agreements.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: A dated employee roster, office list, hiring plan, attrition history, compensation budget, and contractor count.
    whyItMatters: >-
      Public reports give only a launch-team estimate and a broad profile band, so current capacity and burn cannot be
      modeled.
    diligencePath: Reconcile payroll, HRIS, contractor, recruiting, and office-lease records as of the run date.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: product-and-traction
    missingEvidence: >-
      Current product roadmap, benchmark methodology and results, release status, pricing, revenue, pipeline, design
      partners, attributable customers, and retention evidence.
    whyItMatters: >-
      The financing-led thesis cannot be tested against technical or commercial execution without primary operating
      evidence.
    diligencePath: >-
      Obtain a live technical demonstration, reproducible evaluation pack, roadmap, product-access records, contracts,
      invoices, pipeline export, and reference calls.
    relatedQuestionRefs:
      - QO006
      - QO010
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      Unnamed investors, holder-level investment amounts, ownership percentages, board seats, observer rights, and
      strategic agreements.
    whyItMatters: The public stakeholder map is partial and cannot establish economic concentration or decision rights.
    diligencePath: Reconcile the financing closing set and fully diluted cap table to the named public participants.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A credible market estimate with geography, base year, included spend, methodology, growth rate, and source data.
    whyItMatters: Without a reproducible denominator, market scale cannot be translated into a revenue or valuation case.
    diligencePath: >-
      Obtain management's bottom-up target-account model and compare it with independent analyst or industry spending
      data.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Named design partners or customers, buyer titles, budget owners, procurement steps, pricing units, and contract
      values.
    whyItMatters: Intended users do not demonstrate willingness to pay or identify the budget that Mirendil can capture.
    diligencePath: >-
      Review customer pipeline records and interview at least three design partners about workflow, budget,
      alternatives, and purchase criteria.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: adoption-proof
    missingEvidence: >-
      Product access, benchmark methodology, reproducible performance results, compute economics, and
      workflow-integration evidence.
    whyItMatters: Adoption depends on technical and economic superiority over internal teams and existing research workflows.
    diligencePath: >-
      Run a controlled design-partner evaluation against the current internal workflow with pre-agreed quality, time,
      cost, and reproducibility metrics.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: stale
    severity: material
    topic: product-maturity
    missingEvidence: A dated official product release, technical evaluation, or benchmark current through the 2026-10-20 run date.
    whyItMatters: >-
      June reporting cannot establish whether Mirendil launched or demonstrated a product during the following four
      months.
    diligencePath: >-
      Obtain the current product release log, benchmark methodology, evaluation results, and a live demonstration from
      Mirendil.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: named-peer-comparison
    missingEvidence: >-
      Current primary or independent evidence identifying named direct peers with comparable capabilities, customer
      wins, and pricing.
    whyItMatters: >-
      Category-level substitutes do not establish Mirendil's relative performance, commercial terms, or win-loss
      position against direct vendors.
    diligencePath: >-
      Request Mirendil's competitive win-loss log and customer references, then validate named peers through their
      product documentation, pricing, benchmarks, and procurement records.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-revenue
    missingEvidence: >-
      Product-level pricing, billing units, executed contracts, discounts, revenue mix, recognized revenue, and the
      revenue-recognition policy.
    whyItMatters: >-
      These inputs determine recurrence, revenue quality, contract duration, and whether product adoption can support an
