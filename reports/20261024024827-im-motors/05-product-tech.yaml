    title: Workflow and use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - [Operate and monitor vehicle, Driver registers vehicle in app and checks status, IM connectivity app with remote status functions, "Remote visibility is explicitly described", "No active-user, uptime, or task-completion denominator"]
      - [Interact while driving, Driver uses traditional touchscreens or controls, IM AIOS voice and AI-agent interaction, "Designed to reduce touchscreen complexity and driver distraction", "Safety outcome is an aim, not an independently measured result"]
      - [Order services during a trip, Driver separately uses a food-ordering app, AI Takeout connects voice ordering and delivery timing, "Ele.me integration is a concrete scenario", "Public source does not show adoption or error rate"]
      - [Drive long distances, Buyer selects a battery and charging configuration, L6 top trim uses 130 kWh semi-solid-state pack and quasi-900 V platform, "Claimed range over 1,000 km CLTC", "CLTC is a test-cycle claim; real-world performance is unverified"]
    notes: "Benefits are limited to what the assigned sources explicitly describe; no conversion, utilization, safety, or reliability rate is inferred."
    claimRefs: [CE003, CE005, CE006, CE011]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Vehicle and energy platform, "Sedan, SUV, BEV and EREV vehicle programs", "SAIC engineering, factories, and battery suppliers", "Platform complexity and model-specific validation"]
      - [Energy storage and charging, "90/100 kWh L6 packs plus 130 kWh semi-solid-state top trim", "QingTao/CATL-linked battery ecosystem and charging infrastructure", "Durability, thermal safety, supply continuity, and real-world range"]
      - [Intelligent chassis and ADAS, "Vehicle Motion Control, crabwalk, LiDAR, Orin X and driver assistance", "Sensors, compute, maps, software validation", "Functional safety, edge cases, regulatory approval, and update governance"]
      - [Cockpit and AI services, "Snapdragon cockpit, AIOS, speech model, AI agent, ecosystem services", "Banma, Alibaba ecosystem, Ele.me and connectivity", "Privacy, distraction, latency, model errors, and partner dependence"]
      - [Manufacturing and service, "Vehicle assembly and post-sale connected ownership", "SAIC facilities, market distributors, app support", "Cross-market service consistency and OTA/support execution"]
    notes: "Architecture is a disclosed operating model assembled from product descriptions and regulatory filing evidence; dependencies and risks are diligence interpretations, not claims that a failure has occurred."
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010, CE012]
