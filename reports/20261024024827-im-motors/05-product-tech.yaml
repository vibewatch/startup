callouts:
  - calloutType: strength
    title: Integrated vehicle-and-software proposition
    body: "IM Motors has publicly disclosed concrete links between vehicle hardware, digital chassis control, cockpit compute, AIOS services, and an ownership app rather than presenting only a generic connected-car promise."
    claimRefs: [CE005, CE006, CE007, CE003]
  - calloutType: risk
    title: Feature breadth exceeds public validation depth
    body: "The assigned evidence describes advanced components and planned or announced functions, but does not provide independent reliability, safety, cybersecurity, privacy, or fleet-utilization validation sufficient to underwrite technical maturity."
    claimRefs: [CE010, CE012, CE013, CE014]
