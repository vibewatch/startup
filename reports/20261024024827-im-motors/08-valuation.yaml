    title: Recommendation summary
    columns: [Dimension, Public evidence, Judgment, Decision implication]
    rows:
      - [Recommendation, "Strategic and institutional financing is reported, but current valuation terms are not disclosed.", track, "Do not pay a premium private mark without term-sheet and operating diligence."]
      - [Confidence, "Financing and market-risk evidence is available; cash flow, margins, and cap-table terms are not.", medium, "Treat the call as evidence-sensitive and revisit after data-room access."]
      - [Risk rating, "Price competition, missed sales target, and overseas tariff exposure are documented.", high, "Require downside cases and an explicit dilution buffer."]
      - [Valuation stance, "No current post-money valuation or comparable transaction for IM Motors is disclosed in the pool.", unsupported, "Do not infer a private mark from volatile public EV signals."]
    notes: "Sources are reported financing, operating, market, and trade-policy evidence; unavailable valuation and cash-flow fields are diligence gaps, not zero values."
    claimRefs: [CV001, CV003, CV008, CV009, CV010]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting signal, What would change the view, Current posture]
    rows:
      - [Strategic backing can extend runway, "8 billion yuan-plus Series B and 9.4 billion yuan Series B total are reported.", "Verified cash balance, burn, and no punitive preference overhang.", "Supports track"]
      - [Product differentiation can improve mix, "AIOS integrates on-device speech and AI-agent functions; financing targets smart-driving and chassis technology.", "Independent reliability, attach-rate, and realized-price evidence.", "Unproven upside"]
      - [Scale may be below premium-brand expectations, "2024 sales were reported below the 120,000-130,000 target and premium L7/LS7 sales were weak.", "Several quarters of profitable growth across the range.", "Material anti-thesis"]
      - [Overseas expansion may face economics pressure, "EU duties of 17%-35.3% plus a 10% normal tariff are described for Chinese BEVs.", "Localized production or pricing evidence that preserves contribution margin.", "Downside trigger"]
    notes: "This is a qualitative decision table; signals are not normalized valuation multiples and do not establish causal attribution."
    claimRefs: [CV001, CV006, CV007, CV009, CV010, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Operating assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Monthly deliveries remain above 10,000, new models broaden demand, and software/chassis features support realized pricing.", "Premium private mark becomes more defensible; upside depends on verified margins and terms.", "Execution, price competition, and overseas compliance.", "Low-to-medium until margins and cohorts are disclosed."]
      - [Base, "Strategic capital sustains development while sales grow unevenly and the company remains parent- and supplier-dependent.", "Track at a discounted private valuation; wait for data-room evidence.", "Dilution, cash burn, weak premium mix.", "Highest on current public evidence."]
      - [Bear, "Price war compresses margins, premium demand remains weak, tariffs impair exports, and another raise is needed.", "Downside can exceed headline financing support; avoid until recapitalization risk clears.", "Multiple compression, dilution, commercialization failure.", "Material and monitorable."]
      - [Exit readiness, "Overseas expansion is an objective, but repeatable international sell-through and IPO timing are not established.", "No exit premium should be underwritten today.", "Trade barriers, liquidity, and governance terms.", "Unresolved."]
    notes: "Scenarios are qualitative because the assigned evidence does not provide current revenue, margin, cash, preference, or probability data; no numeric valuation range is invented."
    claimRefs: [CV003, CV004, CV008, CV009, CV011, CV012, CV013, CV014]
