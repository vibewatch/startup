callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      Public evidence supports strategic resilience but not a current price. Require verified terms, cash economics, and profitable scale before underwriting a premium private valuation.
    claimRefs: [CV001, CV003, CV012, CV014]
  - calloutType: risk
    title: The key downside is financing quality, not headline funding
    body: >-
      A large financing amount does not establish cash runway, valuation, preferences, or protection against dilution in a price-war market.
    claimRefs: [CV002, CV008, CV009]
  - calloutType: assumption
    title: Scenario ranges remain qualitative
    body: >-
      The assigned pool lacks current revenue, margin, cash-flow, and post-money inputs, so numeric bull, base, and bear valuations would be false precision.
    claimRefs: [CV014, CV016]
