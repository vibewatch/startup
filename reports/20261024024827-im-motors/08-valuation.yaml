company:
  name: IM Motors
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a funded, strategically backed premium EV program, but it does not disclose a current post-money valuation, unit economics, or preference stack. The appropriate stance is track with valuation unsupported until delivery quality, margins, overseas economics, and financing terms are disclosed.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      IM Motors has secured meaningful strategic and institutional support, including a reported 8 billion yuan-plus Series B in March 2024 and a 9.4 billion yuan cumulative Series B figure reported for 2024. That financing supports continued product investment, but funding raised is not cash available today and neither source discloses a post-money valuation, liquidation preference, dilution, or governance terms. Independent reporting also shows that the company remained outside China’s top ten manufacturers and missed its 2024 sales target, while lower-priced L6 and LS6 models drove the bulk of reported volume. The recommendation is therefore track rather than buy: entry should require a verified cap table, current cash and burn, contribution margin by model, and evidence that newer products improve mix without requiring persistent price concessions. No current public mark is established by the assigned evidence, so the valuation stance remains unsupported rather than stretched or attractive.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV012]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis, anti-thesis, and comparable signals
    body: >-
      The investable thesis is that SAIC ownership, Alibaba-linked software capability, supplier participation, and fresh capital can fund a differentiated intelligent-EV portfolio through a difficult industry cycle. Gasgoo describes integrated AI cockpit functionality, while the financing coverage identifies digital chassis, steer-by-wire, and smart-driving investment as uses of capital. The anti-thesis is more important for price discipline: Reuters reported a Chinese EV price war and government concern about irrational competition, and Deloitte describes European countervailing duties of 17% to 35.3% on top of the normal 10% tariff. A public peer signal is also volatile: CompaniesMarketCap reported XPeng at 8.82 billion dollars in October 2026 after a 55.49% decline from its 2025 year-end market cap. These are not direct valuation comps for a private company, but they show why a private premium-EV mark needs a discount for execution, tariff, and multiple-compression risk.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence asks
    body: >-
      The bull case requires sustained deliveries above the roughly 10,000-unit monthly level, successful commercialization of new EV and extended-range models, and software and chassis features that support pricing rather than merely adding cost. The base case assumes strategic funding preserves the platform while sales grow unevenly and the company remains dependent on SAIC and affiliated suppliers; that supports a watchlist position, not a premium entry. The bear case combines price-war margin compression, weak premium-model demand, European trade barriers, and another financing need before positive free cash flow. Because the pool contains no public operating cash-flow, gross-margin, retention, or preference data, scenario values are deliberately qualitative rather than false-precision point estimates. Exit readiness is also unproven: overseas expansion is described as an objective, but public evidence does not establish repeatable international sell-through or an IPO timetable. Diligence should prioritize a current cap table and terms, monthly deliveries and realized prices by model, warranty and gross-margin data, cash runway, tariff exposure, and board-approved commercialization milestones.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: decision-thresholds
    title: Decision thresholds
    body: >-
      The exhibits separate financing facts, market signals, and scenario assumptions so that readers do not mistake a financing amount for valuation or a public peer market capitalization for an implied private-company price. Rows marked unavailable identify underwriting gaps rather than zero values. The recommendation logic is intentionally conditional: evidence of scale and product traction can move the call toward research-more or buy only if accompanied by credible margins and terms; evidence of further dilution, weak premium demand, or tariff-driven economics would move it toward avoid.
    claimRefs: [CV002, CV008, CV014, CV016]
tables:
