artifact: financials
slug: im-motors
runDate: 2026-10-24
company:
  name: IM Motors
chapter:
  number: 4
  title: Financials
  summary: IM Motors has a vehicle-sales-led model, visible list prices, and rising reported deliveries, but its standalone revenue, gross margin, cash, burn, and unit economics remain undisclosed. Large equity rounds reduce immediate financing risk without establishing current liquidity or a self-funded margin path.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing
    body: >-
      The retained evidence supports vehicle sales as IM Motors' only clearly
      evidenced revenue stream. Public pricing spans lower-priced battery-electric
      models and newer extended-range SUVs: CnEVPost lists a RMB 199,900
      promotional starting price for the L6, RMB 209,900 pre-sales pricing for the
      LS6, and RMB 249,800 for the LS8. Those figures are advertised prices, not
      realized average selling prices or recognized revenue. IM AIOS adds connected
      cockpit services, including an Ele.me ordering function, but the retained
      coverage discloses no separate subscription, transaction fee, attach rate, or
      service revenue. Overseas distribution can broaden vehicle revenue through
      selected dealer groups and existing MG locations, yet dealer margins,
      inventory ownership, and country-level economics are unavailable. The result
      is a credible product-to-sale mechanism but no public revenue bridge from
      orders to reported financial statements.
    claimRefs: [CI001, CI002, CI003, CI004, CI012, CI013]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-demand-quality
    title: Traction and demand quality
    body: >-
      Reported vehicle volume has increased: Wikipedia compiles sales of 5,000 in
      2022, 38,253 in 2023, 65,505 in 2024, and 81,017 in 2025. That series is a
      useful traction proxy, not revenue, because it lacks model mix, cancellations,
      discounts, returns, and channel inventory. The adverse evidence is material.
      Bamboo Works reported 57,000 units in the first eleven months of 2024 against
      management's 120,000-130,000 full-year target. It also reported that the
      older L7 and LS7, each originally priced above RMB 400,000, sold fewer than
      200 units combined in November while the sub-RMB 210,000 L6 and LS6 led the
      mix. Lower price points appear to improve demand, but the public record cannot
      show whether that shift improves factory utilization enough to offset price
      and margin pressure.
    claimRefs: [CI005, CI006, CI016]
    tableRefs: [TI002]
  - id: capital-needs-and-cost-visibility
    title: Capital needs and cost visibility
    body: >-
      IM Motors has demonstrated access to strategic equity. The Business Times and
      Asia Financial reported more than US$1.1 billion, or more than RMB 8 billion,
      in Series B financing announced in March 2024, with proceeds intended for new
      smart-car models, technology, and overseas expansion. Bamboo Works later
      reported a completed 2024 Series B of RMB 9.4 billion and cumulative funding
      of RMB 22.4 billion since launch. The figures can describe fundraising
      milestones without proving cash available on the run date: none of the
      retained sources provides a standalone balance sheet, income statement, cash
      flow statement, operating burn, debt schedule, committed capex, inventory
      position, warranty reserve, or runway. Product development and international
      expansion therefore remain visible uses of capital, while capital adequacy
      itself remains unquantifiable.
    claimRefs: [CI007, CI008, CI009, CI010, CI014]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial underwriting verdict
    body: >-
      The financial case is suitable for continued diligence, not clean
      underwriting. Rising reported deliveries and repeated strategic financing
      show that IM Motors is beyond concept stage and has sponsor access. However,
      list prices cannot be multiplied by compiled sales to manufacture revenue:
      realized price, model mix, channel stocking, incentives, revenue-recognition
      policy, and cancellations are missing. The same evidence gap is more severe
      below revenue, where bill-of-materials cost, battery economics, warranty
      accruals, dealer support, customer-acquisition cost, vehicle contribution
      margin, and working capital are private. The nearly RMB 30 billion valuation
      reported for the 2022 Round A is historical context rather than a current
      operating metric. Before financing, an investor needs audited standalone
      statements, monthly model-level margin bridges, cash and debt confirmation,
      inventory aging, committed tooling and launch spend, and a downside runway
      tied to the next-round trigger.
    claimRefs: [CI011, CI014, CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams and public evidence
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - ["Domestic BEV sales", "Customer purchases L6, LS6, and other battery-electric vehicles", "RMB per delivered vehicle", "Starting prices and reported sales are public", "Realized price and recognition policy unavailable", "Reconcile orders, deliveries, invoices, discounts, and cash receipts by model"]
      - ["Domestic EREV sales", "Customer purchases LS8 and other extended-range vehicles", "RMB per delivered vehicle", "LS8 starting price and launch orders are reported", "Orders are not deliveries or revenue", "Provide order conversion, cancellation, realized price, and gross margin"]
      - ["Overseas vehicle sales", "Selected dealers and some MG locations distribute vehicles", "Vehicle and dealer contract", "Channel plan is reported", "Dealer margin and inventory ownership unavailable", "Provide country volume, transfer price, channel margin, and working-capital terms"]
      - ["Connected cockpit services", "IM AIOS integrates digital services and ecosystem functions", "Subscription or transaction fee", "Product functionality is reported", "No separately priced revenue is disclosed", "Provide paid attach rate, ARPU, partner take rate, renewal, and service margin"]
    notes: Public evidence identifies mechanisms and advertised prices, not audited revenue; unavailable economics are shown as gaps rather than zero.
    claimRefs: [CI001, CI002, CI003, CI004, CI012, CI013]
  - id: TI002
    title: Pricing and demand signals
    columns: [Model or cohort, Public value, Period or basis, Evidence quality, Financial implication]
    rows:
      - ["L6", "RMB 199,900 starting promotional price", "Current CnEVPost model coverage", "Advertised price; realized ASP unavailable", "Lower entry point may support volume but does not establish contribution margin"]
      - ["LS6", "RMB 209,900 pre-sales starting price", "Current CnEVPost model coverage", "Pre-sales price; discounts and conversion unavailable", "Tests demand near the RMB 200,000 segment"]
      - ["LS8", "RMB 249,800 starting price; 8,000 firm orders in 60 minutes", "Launch coverage", "Reported orders; deliveries and cancellations unavailable", "EREV expansion may broaden demand without proving revenue quality"]
      - ["L7 and LS7", "Above RMB 400,000 originally; fewer than 200 combined November sales", "Bamboo Works analysis of November 2024", "Independent adverse report", "Weak premium-model demand raises mix and pricing-power risk"]
    notes: Values preserve each source's price or order basis; advertised prices and reported orders are not realized revenue.
    claimRefs: [CI002, CI003, CI004, CI016]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, What it establishes, Diligence ask]
    rows:
      - ["2025 vehicle sales", "81,017", medium, "Compiled volume growth, not revenue", "Reconcile registrations, dealer inventory, cancellations, and invoices"]
      - ["2024 target progress", "57,000 in first 11 months versus 120,000-130,000 target", medium, "Material target miss in adverse coverage", "Provide monthly target bridge and model/channel variance"]
      - ["March 2024 Series B announcement", "More than US$1.1bn / more than RMB 8bn", medium, "Historical equity raised", "Obtain executed closing documents and net cash proceeds"]
      - ["Completed 2024 Series B", "RMB 9.4bn reported by Bamboo Works", medium, "Later reported round total", "Reconcile tranches, currencies, investors, and dilution"]
      - ["Cumulative funding since launch", "RMB 22.4bn reported by Bamboo Works", medium, "Financing history, not cash available", "Reconcile cumulative gross proceeds to current unrestricted cash"]
      - ["Standalone revenue and gross margin", null, low, "No retained disclosure", "Provide audited statements and model-level contribution-margin bridge"]
      - ["Cash, burn, debt, and runway", null, low, "No retained disclosure", "Provide bank confirmations, debt schedule, committed spend, and downside runway"]
    notes: Null means unavailable in the retained public evidence, not zero; financing raised cannot substitute for cash, burn, or runway.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI014, CI015]

figures:
  - id: FI001
    title: Vehicle activity to cash-conversion bridge
    type: flow
    summary: Public evidence reaches advertised price and reported sales, while revenue recognition, cost absorption, and cash conversion remain private.
    data:
      nodes:
        - id: customer-order
          label: Customer order
          detail: "Selected models publish starting prices; options, incentives, and cancellations are unavailable."
        - id: transaction-price
          label: Realized transaction price
          detail: "Unavailable; list and promotional prices are not realized ASP."
        - id: delivery
          label: Vehicle delivery
          detail: "Annual sales totals are reported, but model and channel reconciliation is unavailable."
        - id: revenue
          label: Recognized revenue
          detail: "Standalone revenue and recognition policy are unavailable."
        - id: gross-profit
          label: Gross profit
          detail: "Bill-of-materials, warranty, dealer support, and contribution margin are unavailable."
        - id: cash-conversion
          label: Cash conversion
          detail: "Working capital, capex, debt service, burn, and runway are unavailable."
      edges:
        - from: customer-order
          to: transaction-price
        - from: transaction-price
          to: delivery
        - from: delivery
          to: revenue
        - from: revenue
          to: gross-profit
        - from: gross-profit
          to: cash-conversion
    approximationNotes: No value is estimated; the bridge separates evidenced public stages from unavailable private financial stages.
    claimRefs: [CI001, CI014, CI015]

callouts:
  - calloutType: strength
    title: Strategic capital access is demonstrated
    body: Independent reports describe a large 2024 Series B and participation by financial institutions, SAIC-linked interests, CATL, Momenta, and QingTao.
    claimRefs: [CI007, CI008, CI009]
  - calloutType: risk
    title: Funding raised is not runway
    body: The retained evidence does not disclose current cash, burn, debt, committed capex, or working capital, so historical proceeds cannot establish present capital adequacy.
    claimRefs: [CI010, CI014]
  - calloutType: recommendation
    title: Gate underwriting on private financial data
    body: Require audited standalone statements, realized pricing, model-level contribution margins, inventory aging, cash confirmation, and downside runway before assigning a financeable valuation.
    claimRefs: [CI014, CI015]

