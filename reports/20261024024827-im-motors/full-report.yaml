chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, structure, and business model
        blocks:
          - type: paragraph
            body: >-
              IM Motors, legally identified in one source as Zhiji Automotive Technology Co. Ltd., was founded in
              Shanghai in December 2020 as a premium electric-vehicle joint venture among SAIC Motor, Alibaba Group, and
              Zhangjiang Hi-Tech. The founding structure paired SAIC's automotive manufacturing base with Alibaba's
              digital capabilities and Zhangjiang's technology ecosystem. The operating model is a vehicle manufacturer
              rather than a software-only company: by December 2024 its disclosed range comprised the L6 and L7 sedans
              and LS6 and LS7 SUVs, all then battery-electric. The last substantiated stage marker in this evidence set
              is the December 2024 Series B close, so a newer financing stage or 2026 valuation should not be inferred.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO008
              - CO009
              - CO013
      - number: '1.2'
        title: Ownership, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The founding cap table was reported in 2022 as 54% SAIC, 18% Alibaba, 18% Zhangjiang Hi-Tech, with 10%
              reserved for employees and customers providing research data. A January 2025 analysis instead reported
              that SAIC owned or controlled about 46.5% and Alibaba about 13.1%, consistent with dilution but not a
              complete current cap table. Publicly named leadership is also narrow: Liu Tao was identified as co-CEO,
              while SAIC chief Jia Jianxu assumed the IM Motors chairmanship and another board position in December
              2024. That parent-level oversight provides industrial support but also creates key dependence on SAIC; the
              full board, management bench, voting rights, and investor protections remain private.
            claimRefs:
              - CO002
              - CO003
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO014
              - CO015
      - number: '1.3'
        title: Financing history and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              Reuters reported that IM Motors had raised more than RMB 8 billion, or about US$1.1 billion, in Series B
              equity financing by March 2024. CnEVPost and Bamboo Works later reported a RMB 9.4 billion final Series B
              close in December 2024; Bamboo Works placed cumulative funding since launch at RMB 22.4 billion,
              comprising RMB 10 billion of angel capital, RMB 3 billion of Series A capital, and the RMB 9.4 billion
              Series B. The company said proceeds would support smart models, core technologies, product launches, and
              overseas expansion. Named participants span state-backed financial institutions and strategic suppliers,
              including CATL, Momenta, and QingTao Energy, reinforcing the industrial network while leaving post-money
              valuation and governance terms undisclosed.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO011
      - number: '1.4'
        title: Scale, milestones, and execution signal
        blocks:
          - type: paragraph
            body: >-
              Operating momentum improved late in 2024: IM Motors reported 10,001 October deliveries and 10,007 in
              November, its first two consecutive months above 10,000, and announced that cumulative deliveries had
              passed 100,000 in December. The improvement did not erase the execution gap. Bamboo Works reported only
              57,000 units sold in the first eleven months against co-CEO Liu Tao's 120,000-130,000 annual goal, leaving
              the brand outside China's top ten new-energy-vehicle manufacturers. Product and technology activity
              continued with the March 2025 unveiling of the IM AIOS smart cockpit, but the assigned evidence does not
              provide a verified 2026 delivery total, revenue, headcount, location count, or customer cohort metric.
              Late-2024 traction is therefore evidence of survival and improving scale, not proof of durable economics.
            claimRefs:
              - CO006
              - CO012
              - CO013
              - CO014
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO012
              - CO013
              - CO014
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale improved, but the target miss remains material
            body: >-
              Two consecutive 10,000-unit months and the 100,000 cumulative-delivery milestone show traction, yet 57,000
              sales through November 2024 were still less than half the stated 120,000-130,000 annual goal.
            calloutType: risk
            claimRefs:
              - CO012
              - CO013
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is premium intelligent new-energy passenger vehicles, with IM Motors' own materials
              positioning the brand around high-end new-energy intelligent vehicles and intelligent driving. The broad
              reference market is China's passenger NEV market, including battery-electric vehicles and plug-in hybrids;
              hydrogen vehicles are technically included in the Chinese NEV definition but are nearly nonexistent in the
              cited 2025 data. The narrower opportunity includes vehicle purchase, financing or battery-payment
              arrangements, software-enabled cockpit and driver-assistance functionality, and after-sales support for
              premium sedans and SUVs. It excludes commercial vehicles, charging infrastructure revenue, general
              automotive software sold independently, and the entire ICE replacement market. The status quo is an ICE
              vehicle or an incumbent premium vehicle, while substitutes include other Chinese NEV brands, Tesla, and
              delaying a purchase. This boundary matters because headline NEV volumes include mass-market vehicles and
              cannot be treated as IM's addressable demand without a premium-price and body-style filter.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
      - number: '2.2'
        title: Sizing lenses and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              Multiple lenses establish scale without pretending to isolate IM Motors' share. CarNewsChina, citing CPCA
              and China EV DataTracker, reports 10.891 million passenger-vehicle sales in China in H1 2025, including
              5.458 million NEVs, with NEVs at 50.1% penetration; BEVs were 3.330 million and PHEVs 2.128 million.
              Global Times reports preliminary CPCA wholesale sales of 15.33 million new-energy passenger vehicles for
              full-year 2025, up 25% year over year, but that is a wholesale industry total rather than retail demand or
              IM's premium segment. The adoption case is strengthened by China's battery and supply-chain scale and by
              Chinese brands' rising domestic share. It is constrained by price competition, low residual values,
              delivery capacity, safety standards, tariffs, and the capital intensity of overseas production. IM's 2024
              Series B was described as funding new smart-car models, technology, and overseas expansion, but funding is
              not market share, revenue, or cash available for deployment.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM016
              - CM004
      - number: '2.3'
        title: Buyer, budget owner, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary user is a private consumer seeking a premium sedan or SUV; the payer is usually the household,
              with the vehicle purchase and financing budget controlled by the buyer or household decision maker. IM's
              product and partner evidence points to urban, digitally receptive users who value intelligent driving,
              integrated cockpit services, design, range, and convenience. A fleet or public-procurement segment is not
              established by the assigned sources and should not be assumed. Adoption can be triggered by a new model, a
              credible technology upgrade, a financing or battery-payment option, or export availability, but can be
              delayed by uncertain residual values, delivery bottlenecks, safety scrutiny, tariffs, and distrust after
              aggressive discounting elsewhere in the market. The budget owner therefore evaluates total cost of
              ownership and service confidence, not only the advertised vehicle specification. Public evidence does not
              show IM's conversion funnel, customer acquisition cost, repeat purchase, or margin by segment, leaving the
              commercial quality of demand unresolved.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Evidence limits
        blocks:
          - type: paragraph
            body: >-
              The market evidence is directionally strong on category growth but incomplete on IM-specific economics.
              Company and partner materials establish positioning and product intent; independent industry coverage
              supplies market totals and constraints. The assigned pool does not provide a public premium-NEV
              denominator, IM unit sales by model and geography, price realization, share, gross margin, retention, or a
              validated SAM/SOM. The resulting investment implication is that category growth can support product
              expansion, but valuation must remain sensitive to execution and share capture rather than to the full
              China NEV headline.
            claimRefs:
              - CM016
              - CM004
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Category growth is not yet IM capture
            body: >-
              China's NEV category has crossed a major adoption threshold, but the assigned evidence cannot convert
              5.458 million H1 2025 NEV units or 15.33 million 2025 wholesale units into IM-specific revenue, share, or
              valuation support.
            calloutType: insight
            claimRefs:
              - CM005
              - CM007
              - CM004
          - type: callout
            title: Price and trust are adoption constraints
            body: >-
              Third Bridge's expert synthesis describes price-war fallout, low EV residual values, delivery bottlenecks,
              safety regulation, and trade barriers; these can delay purchase decisions or compress returns even while
              category volumes grow.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and positioning
        blocks:
          - type: paragraph
            body: >-
              IM Motors operates in the premium Chinese intelligent-EV segment rather than as a pure low-cost volume
              brand. The assigned evidence describes a joint venture involving SAIC, Alibaba and Zhangjiang, with IM
              positioned against technology-forward brands including Tesla, Zeekr and Xiaomi. Its portfolio spans sedans
              and SUVs, while the LS6 and L6 provide the clearest evidence of a value proposition built around long
              range, 800V charging, digital chassis features, lidar-assisted driving and a newer extended-range option.
              That places IM in direct competition for the same buyer consideration set as premium smart-EV peers, but
              it also exposes the brand to rapid feature imitation and discounting. The landscape is therefore broader
              than named EV brands: SAIC's MG distribution, Nio's lower-priced alternatives, and the status quo of
              buying an established premium vehicle or delaying replacement are all relevant substitutes. Internal build
              is not a practical consumer alternative, although incumbent automakers can launch smart-EV lines using
              existing manufacturing and dealer infrastructure. The profile table is intentionally partial where the
              assigned sources do not disclose comparable competitor funding, pricing or reliability data.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP012
      - number: '3.2'
        title: Capability, trust and route to market
        blocks:
          - type: paragraph
            body: >-
              IM's defensibility is a bundle rather than a single feature. Alibaba and Banma support the IM AIOS
              cockpit, while SAIC supplies manufacturing experience and an export network; the Singapore representation
              by Eurokars is an example of using an established premium dealer rather than building every market channel
              from zero. Technical claims are substantial: the L6 evidence describes semi-solid-state battery
              technology, a quasi-900V architecture and a vehicle-motion-control chassis, while later L6 and LS6
              evidence describes 800V platforms, assisted-driving hardware and extended-range configurations. These
              capabilities can improve consideration and reduce charging or range anxiety, but the evidence does not
              establish independent reliability, warranty, residual-value or real-world autonomy superiority.
              Multi-homing is also easy at the buyer level because competing vehicles offer overlapping range, software
              and premium features. Supplier and investor ties to CATL, Momenta and QingTao strengthen access to
              components and know-how, yet they also leave execution dependent on partners and on SAIC's ability to
              convert technology into consistent service quality.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP013
              - CP014
      - number: '3.3'
        title: Pricing pressure and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The clearest competitive signal is the mismatch between premium aspiration and observed buyer response.
              Independent coverage reported that the higher-priced L7 and LS7 sold far fewer units than the lower-priced
              L6 and LS6, while updated L6 variants received price cuts and the LS6 was offered in multiple
              configurations around the RMB 200,000 to RMB 270,000 range. IM can therefore compete by delivering
              premium-tech features at aggressive prices, but that strategy risks compressing gross profit and making
              the brand's premium positioning less durable. The company also faces a scale and survival test: coverage
              reported 100,000 cumulative deliveries and improving monthly sales, but still below the chief executive's
              2024 target; the same account noted the collapse of several rival EV makers during industry shakeout. This
              is adverse evidence for any assumption that funding alone creates a durable moat. The nine-trim LS6 launch
              ladder also shows how densely IM packages BEV and EREV choices across a relatively narrow price span. The
              pricing comparison marks competitor prices as unknown where the assigned pool does not provide a directly
              comparable list or realized price, and treats the missing reliability and owner-cohort evidence as a
              material diligence gap rather than a positive inference.
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP015
      - number: '3.4'
        title: Evidence boundary and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The assigned pool is strong enough to establish the competitor set, IM's disclosed product and channel
              advantages, and the direction of pricing and industry pressure. It is not strong enough to quantify
              relative market share, customer acquisition cost, switching costs, warranty cost, residual values,
              real-world autonomy performance or competitor gross margins. Those omissions matter because an EV feature
              comparison can overstate moat durability when the buyer can multi-home across brands and when a parent
              group can redeploy technology or dealer capacity. The resulting view is that IM has credible access
              advantages and a differentiated product bundle, but not yet a proven economic moat. A buyer should request
              model-level contribution margins, warranty and recall data, owner retention, channel economics, delivery
              targets versus actuals, and third-party safety or assisted-driving benchmarks before underwriting durable
              pricing power.
            claimRefs:
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Partner-enabled product and channel bundle
            body: >-
              IM combines SAIC manufacturing and distribution access with Alibaba/Banma software integration and
              component relationships that can accelerate feature delivery and overseas entry.
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP013
          - type: callout
            title: Premium positioning is not yet economically durable
            body: >-
              Independent coverage links stronger demand to lower-priced L6 and LS6 models, while higher-priced L7 and
              LS7 volumes lagged; price cuts and crowded peers raise displacement risk.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP011
          - type: callout
            title: Underwrite moat proof, not feature breadth
            body: >-
              Before treating the product bundle as a durable moat, request independent reliability, warranty,
              retention, channel economics and real-world assisted-driving evidence.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports vehicle sales as IM Motors' only clearly evidenced revenue stream. Public
              pricing spans lower-priced battery-electric models and newer extended-range SUVs: CnEVPost lists a RMB
              199,900 promotional starting price for the L6, RMB 209,900 pre-sales pricing for the LS6, and RMB 249,800
              for the LS8. Those figures are advertised prices, not realized average selling prices or recognized
              revenue. IM AIOS adds connected cockpit services, including an Ele.me ordering function, but the retained
              coverage discloses no separate subscription, transaction fee, attach rate, or service revenue. Overseas
              distribution can broaden vehicle revenue through selected dealer groups and existing MG locations, yet
              dealer margins, inventory ownership, and country-level economics are unavailable. The result is a credible
              product-to-sale mechanism but no public revenue bridge from orders to reported financial statements.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI012
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI012
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI014
              - CI015
      - number: '4.2'
        title: Traction and demand quality
        blocks:
          - type: paragraph
            body: >-
              Reported vehicle volume has increased: Wikipedia compiles sales of 5,000 in 2022, 38,253 in 2023, 65,505
              in 2024, and 81,017 in 2025. That series is a useful traction proxy, not revenue, because it lacks model
              mix, cancellations, discounts, returns, and channel inventory. The adverse evidence is material. Bamboo
              Works reported 57,000 units in the first eleven months of 2024 against management's 120,000-130,000
              full-year target. It also reported that the older L7 and LS7, each originally priced above RMB 400,000,
              sold fewer than 200 units combined in November while the sub-RMB 210,000 L6 and LS6 led the mix. Lower
              price points appear to improve demand, but the public record cannot show whether that shift improves
              factory utilization enough to offset price and margin pressure.
            claimRefs:
              - CI005
              - CI006
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI016
      - number: '4.3'
        title: Capital needs and cost visibility
        blocks:
          - type: paragraph
            body: >-
              IM Motors has demonstrated access to strategic equity. The Business Times and Asia Financial reported more
              than US$1.1 billion, or more than RMB 8 billion, in Series B financing announced in March 2024, with
              proceeds intended for new smart-car models, technology, and overseas expansion. Bamboo Works later
              reported a completed 2024 Series B of RMB 9.4 billion and cumulative funding of RMB 22.4 billion since
              launch. The figures can describe fundraising milestones without proving cash available on the run date:
              none of the retained sources provides a standalone balance sheet, income statement, cash flow statement,
              operating burn, debt schedule, committed capex, inventory position, warranty reserve, or runway. Product
              development and international expansion therefore remain visible uses of capital, while capital adequacy
              itself remains unquantifiable.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
      - number: '4.4'
        title: Financial underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The financial case is suitable for continued diligence, not clean underwriting. Rising reported deliveries
              and repeated strategic financing show that IM Motors is beyond concept stage and has sponsor access.
              However, list prices cannot be multiplied by compiled sales to manufacture revenue: realized price, model
              mix, channel stocking, incentives, revenue-recognition policy, and cancellations are missing. The same
              evidence gap is more severe below revenue, where bill-of-materials cost, battery economics, warranty
              accruals, dealer support, customer-acquisition cost, vehicle contribution margin, and working capital are
              private. The nearly RMB 30 billion valuation reported for the 2022 Round A is historical context rather
              than a current operating metric. Before financing, an investor needs audited standalone statements,
              monthly model-level margin bridges, cash and debt confirmation, inventory aging, committed tooling and
              launch spend, and a downside runway tied to the next-round trigger.
            claimRefs:
              - CI011
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic capital access is demonstrated
            body: >-
              Independent reports describe a large 2024 Series B and participation by financial institutions,
              SAIC-linked interests, CATL, Momenta, and QingTao.
            calloutType: strength
            claimRefs:
              - CI007
              - CI008
              - CI009
          - type: callout
            title: Funding raised is not runway
            body: >-
              The retained evidence does not disclose current cash, burn, debt, committed capex, or working capital, so
              historical proceeds cannot establish present capital adequacy.
            calloutType: risk
            claimRefs:
              - CI010
              - CI014
          - type: callout
            title: Gate underwriting on private financial data
            body: >-
              Require audited standalone statements, realized pricing, model-level contribution margins, inventory
              aging, cash confirmation, and downside runway before assigning a financeable valuation.
            calloutType: recommendation
            claimRefs:
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              IM Motors is a premium intelligent-EV marque created by SAIC Motor, Alibaba Group, and Zhangjiang Hi-Tech,
              with overseas retail representation layered on top of the underlying vehicle business. The customer
              workflow is vehicle-centered: choose a sedan or SUV, configure battery and drivetrain options, purchase
              through a market-specific retail channel, and then operate the vehicle through in-car connectivity and a
              companion app. The Singapore representative describes Alibaba as contributing artificial intelligence, big
              data, cloud computing, and smart connectivity, while SAIC contributes manufacturing and engineering. The
              app listing says users must register an IM vehicle and can remotely check vehicle status, making software
              an ongoing ownership surface rather than only a sales feature. Public evidence does not establish
              active-user rates, feature utilization, or whether these services are standardized across every market and
              model.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE011
      - number: '5.2'
        title: Technology and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture is a stack spanning vehicle platforms and energy storage, intelligent chassis
              control, in-cabin computing and human-machine interaction, cloud-connected ownership services, and
              manufacturing and supply dependencies. Gasgoo describes IM AIOS as an on-device open speech large model
              and AI interactive agent connected to multiple ecosystems, with Ele.me ordering as one concrete use case.
              The L6 evidence adds Qualcomm Snapdragon 8295P cockpit computing, NVIDIA Orin X chips, roof-mounted LiDAR,
              and a vehicle-motion-control digital chassis. The LS9 filing shows a different operating path: an SAIC
              1.5-liter range extender, dual motors, CATL batteries, and production across four SAIC facilities. These
              are credible disclosed components, but the public record does not show software release cadence, failure
              rates, compute utilization, supplier exclusivity, or validation results for the complete vehicle system.
            claimRefs:
              - CE005
              - CE006
              - CE007
