    summary: Eight source-dated events trace IM Motors from formation through financing, scale, and its AI cockpit rollout.
    data:
      items:
        - date: 2020-12
          label: Joint venture founded
          detail: IM Motors was formed in Shanghai by SAIC, Alibaba, and Zhangjiang Hi-Tech.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2022-04-17'
          label: First production model launched
          detail: The IM L7 entered the market as the venture's first production vehicle.
          tone: positive
          claimRefs:
