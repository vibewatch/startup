      This is a qualitative decision table; signals are not normalized valuation multiples and do not establish causal
      attribution.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating assumptions
      - Valuation or return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Monthly deliveries remain above 10,000, new models broaden demand, and software/chassis features support
          realized pricing.
        - Premium private mark becomes more defensible; upside depends on verified margins and terms.
        - Execution, price competition, and overseas compliance.
        - Low-to-medium until margins and cohorts are disclosed.
      - - Base
        - >-
          Strategic capital sustains development while sales grow unevenly and the company remains parent- and
          supplier-dependent.
        - Track at a discounted private valuation; wait for data-room evidence.
        - Dilution, cash burn, weak premium mix.
        - Highest on current public evidence.
      - - Bear
        - >-
          Price war compresses margins, premium demand remains weak, tariffs impair exports, and another raise is
          needed.
        - Downside can exceed headline financing support; avoid until recapitalization risk clears.
        - Multiple compression, dilution, commercialization failure.
        - Material and monitorable.
      - - Exit readiness
        - >-
          Overseas expansion is an objective, but repeatable international sell-through and IPO timing are not
          established.
        - No exit premium should be underwritten today.
        - Trade barriers, liquidity, and governance terms.
        - Unresolved.
    notes: >-
      Scenarios are qualitative because the assigned evidence does not provide current revenue, margin, cash,
      preference, or probability data; no numeric valuation range is invented.
    claimRefs:
      - CV003
      - CV004
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
      - CV014
