      - number: '5.3'
        title: Maturity, trust, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              Product maturity is mixed. The L6 source reports concrete pre-order configurations, range claims, charging
              architecture, and an expected staged rollout for driver assistance, while the LS9 filing documents a
              formal public-comment step before sale approval. The App Store provides a live software distribution
              surface, but its 2.0 rating from seven ratings and disclosure that location, contacts, user content,
              search history, identifiers, usage data, and diagnostics may be linked to identity are observable trust
              signals rather than a complete privacy or safety audit. The same listing records a provider tied to SAIC
              and a recent feature and performance update, but does not establish support quality or fleet-wide
              reliability. Key diligence gaps therefore concern independent ADAS and battery validation, warranty and
              incident data, cybersecurity controls, OTA governance, and whether the extended-range architecture
              improves economics without adding service complexity.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated vehicle-and-software proposition
            body: >-
              IM Motors has publicly disclosed concrete links between vehicle hardware, digital chassis control, cockpit
              compute, AIOS services, and an ownership app rather than presenting only a generic connected-car promise.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE003
          - type: callout
            title: Feature breadth exceeds public validation depth
            body: >-
              The assigned evidence describes advanced components and planned or announced functions, but does not
              provide independent reliability, safety, cybersecurity, privacy, or fleet-utilization validation
              sufficient to underwrite technical maturity.
            calloutType: risk
            claimRefs:
              - CE010
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyers, users, and routes to market
        blocks:
          - type: paragraph
            body: >-
              The observable customer base is primarily individual vehicle buyers rather than enterprise accounts. IM
              Motors launched as a premium intelligent pure-electric brand with sedan and SUV products, but the buyer
              proposition has widened: Licarco reported that the LS7 could be purchased with the battery paid separately
              in installments, lowering its stated entry price to 239,800 yuan. The company also targets distinct use
              contexts rather than one undifferentiated premium cohort. Gasgoo described an L6 cockpit feature aimed at
              urban professionals, while Bitauto reported that Thailand was the first overseas market for the IM6 and
              that distribution would leverage SAIC's established sales network. Europe was separately identified as a
              planned export market. Public sources do not split customers, revenue, or margin by model, geography,
              channel, or buyer profile.
            claimRefs:
              - CU001
              - CU003
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU008
              - CU009
              - CU010
      - number: '6.2'
        title: Adoption trajectory is real but reported, not audited
        blocks:
          - type: paragraph
            body: >-
              Scale has advanced beyond an early-product launch, although the disclosed measures remain media reports of
              company data. Licarco put 2022 sales at roughly 5,000 vehicles. A later 36Kr article reported 65,505
              vehicles sold during 2024, up 71% year over year, and Gasgoo reported that cumulative deliveries had
              surpassed 100,000 by December 2024. Gasgoo also reported 10,007 November 2024 sales, up 14.98% year over
              year but only 0.06% month over month. Those measures show a growing delivered fleet, yet they do not share
              a verified active-owner denominator or establish utilization, repurchase, or paid digital-service
              adoption. The four-model lineup broadens addressable preferences, but model-level contribution and
              customer-cohort durability are not disclosed.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Product proof is stronger than named-customer proof
        blocks:
          - type: paragraph
            body: >-
              Evidence quality is uneven. Aggregate deliveries demonstrate production rather than a pilot, and Thailand
              represents a named market deployment, but no public source in the assigned evidence identifies individual
              paying owners or a fleet customer with measured outcomes. The strongest independent product-use evidence
              is SGCarMart's IM6 comparison: it favored the IM6 for cabin refinement and comfort, while recording
              material trade-offs in range, charging, performance, cargo capacity, and price versus Tesla's Model Y.
              Connected-service evidence is earlier-stage because Gasgoo described AI Takeout as a feature set for L6
              deployment, not measured utilization. IM Motors' own global page further warns that displayed values may
              be announced or engineering-simulation figures and can vary by market and test conditions. Product
              consideration evidence should therefore not be treated as retention or satisfaction evidence.
            claimRefs:
              - CU005
              - CU008
              - CU010
              - CU011
              - CU012
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU008
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU008
              - CU010
              - CU013
      - number: '6.4'
        title: Durability and concentration remain the underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Public data does not close the questions most important to customer durability: owner-cohort retention,
              repeat purchase, referral, warranty experience, connected-service engagement, or paid-service attachment.
              A 36Kr article describes an engagement mechanism under which 4.9% of equity and 300 million "original
              stones" were allocated to reward user data and co-creation, but it does not report participation,
              redemption, incremental retention, or economic cost. Concentration is similarly opaque. The record
              provides no sales mix by model, dealer, geography, or customer class, so neither dependence on a few
              volume models nor overseas channel diversification can be quantified. Diligence should obtain
              registrations, orders, deliveries, cancellations, repeat purchases, warranty claims, and service
              engagement by model and monthly owner cohort before assigning durable customer value.
            claimRefs:
              - CU013
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Six-figure delivered base
            body: >-
              The reported 100,000-delivery milestone is meaningful production adoption, although it is not a measure of
              active use, satisfaction, or retention.
            calloutType: strength
            claimRefs:
              - CU005
          - type: callout
            title: Post-purchase economics are unproven
            body: >-
              No retained source quantifies repeat purchase, owner retention, paid-service attachment, or customer
              concentration by model, geography, or channel.
            calloutType: risk
            claimRefs:
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Intelligent connected vehicles face a tightening Chinese admission, recall, and software-update regime. A
              February 2025 notice jointly issued by MIIT and SAMR is described as immediately effective and expressly
              targets safety management, admission, recall administration, and OTA changes. For IM Motors, this makes
              product-change controls and release-control evidence investment-relevant rather than merely compliance
              overhead. The available fetched notice is a secondary summary that links to the ministry page, so the
              exact company-specific compliance status remains unverified. The risk is elevated for vehicles marketed
              around intelligent driving and over-the-air functionality, because a missed filing, defective update, or
              inadequate investigation could cause corrective action, launch delays, or reputational damage.
              Cross-border expansion also adds data-transfer obligations: the PIPL framework reaches organizations
              outside China that provide products or services to people in China, and described transfer routes include
              security review, standard contractual clauses, or certification depending on the data and volume. No
              public IM Motors data map, transfer assessment, or audit result was found in the assigned evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operating, quality, and technology exposure
        blocks:
          - type: paragraph
            body: >-
              IM Motors presents a technology-heavy product proposition: its own site highlights a digital chassis,
              advanced electrification, an AI cabin, and a super-extended-range system, while third-party coverage
              describes an Alibaba Banma cockpit integrating an on-device speech model and AI agent. These capabilities
              widen the failure surface across batteries, software, sensors, cloud services, and human-machine
              interaction. The evidence does not establish an IM Motors recall, outage, or safety incident, and that
              absence is not proof that none occurred. The more defensible conclusion is that independent reliability,
              warranty, autonomy, and incident metrics remain a diligence gap. Electrification and intelligent-driving
              systems create a linked operational risk: a quality problem can become a regulatory event when an OTA
              update or driver-assistance function affects safety. The company also relies on specialized suppliers and
              partners, so validation, change control, and rollback capability should be treated as kill-criterion
              evidence rather than assumed from feature marketing.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
      - number: '7.3'
        title: Partner, dependency, and financial resilience
        blocks:
          - type: paragraph
            body: >-
              IM Motors is structurally dependent on a strategic ecosystem rather than an independent vertically
              integrated platform. Reporting identifies SAIC, Alibaba, and Zhangjiang as co-founders and names CATL,
              Momenta, and QingTao among contributors to the Series B financing; separate coverage describes the Alibaba
              Banma and Ele.me cockpit collaboration. This can accelerate product delivery, but it also creates
              counterparty, governance, supply, and roadmap dependencies. The reported Series B exceeded US$1.1 billion
              and was intended for smart-car models, technologies, and overseas expansion, but funding raised is not
              cash available and does not disclose burn, margin, covenants, or runway. Overseas expansion adds
              localization, after-sales, and compliance execution risk. The central financial kill criterion is
              therefore not a guessed cash balance: it is failure to obtain verified runway, working capital, gross
              margin, supplier terms, and delivery economics before further expansion.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Monitoring and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk posture should be monitored through observable controls rather than narrative confidence.
              Priority indicators are regulator notices or recalls, delayed or reversed OTA releases, verified warranty
              and incident rates, supplier disruptions, partner changes, overseas homologation outcomes, and audited
              cash and gross-margin disclosures. A thesis break would be a material safety or data-compliance event
              without timely remediation, a repeated production or delivery interruption, loss of a critical technology
              or battery partner without replacement, or evidence that expansion consumes capital faster than the
              financing plan supports. These triggers are deliberately measurable; the assigned pool contains no
              company-specific public thresholds for them, so investors should request the underlying records before
              treating any risk as mitigated.
            claimRefs:
              - CR015
              - CR016
              - CR017
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR008
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              Obtain model-level safety, recall, OTA-change, warranty, supplier-concentration, data-governance, cash,
              and gross-margin records before treating the financing and technology ecosystem as risk reduction.
            calloutType: risk
            claimRefs:
              - CR003
              - CR008
              - CR013
              - CR017
          - type: callout
            title: Absence is not clearance
            body: >-
              The assigned public sources do not document an IM Motors incident or recall; that observation is a
              coverage limitation, not evidence that no incident occurred.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              IM Motors has secured meaningful strategic and institutional support, including a reported 8 billion
              yuan-plus Series B in March 2024 and a 9.4 billion yuan cumulative Series B figure reported for 2024. That
              financing supports continued product investment, but funding raised is not cash available today and
              neither source discloses a post-money valuation, liquidation preference, dilution, or governance terms.
              Independent reporting also shows that the company remained outside China’s top ten manufacturers and
              missed its 2024 sales target, while lower-priced L6 and LS6 models drove the bulk of reported volume. The
              recommendation is therefore track rather than buy: entry should require a verified cap table, current cash
              and burn, contribution margin by model, and evidence that newer products improve mix without requiring
              persistent price concessions. No current public mark is established by the assigned evidence, so the
              valuation stance remains unsupported rather than stretched or attractive.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV014
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that SAIC ownership, Alibaba-linked software capability, supplier participation,
              and fresh capital can fund a differentiated intelligent-EV portfolio through a difficult industry cycle.
              Gasgoo describes integrated AI cockpit functionality, while the financing coverage identifies digital
              chassis, steer-by-wire, and smart-driving investment as uses of capital. The anti-thesis is more important
              for price discipline: Reuters reported a Chinese EV price war and government concern about irrational
              competition, and Deloitte describes European countervailing duties of 17% to 35.3% on top of the normal
              10% tariff. A public peer signal is also volatile: CompaniesMarketCap reported XPeng at 8.82 billion
              dollars in October 2026 after a 55.49% decline from its 2025 year-end market cap. These are not direct
              valuation comps for a private company, but they show why a private premium-EV mark needs a discount for
              execution, tariff, and multiple-compression risk.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case requires sustained deliveries above the roughly 10,000-unit monthly level, successful
              commercialization of new EV and extended-range models, and software and chassis features that support
              pricing rather than merely adding cost. The base case assumes strategic funding preserves the platform
              while sales grow unevenly and the company remains dependent on SAIC and affiliated suppliers; that
              supports a watchlist position, not a premium entry. The bear case combines price-war margin compression,
              weak premium-model demand, European trade barriers, and another financing need before positive free cash
              flow. Because the pool contains no public operating cash-flow, gross-margin, retention, or preference
              data, scenario values are deliberately qualitative rather than false-precision point estimates. Exit
              readiness is also unproven: overseas expansion is described as an objective, but public evidence does not
              establish repeatable international sell-through or an IPO timetable. Diligence should prioritize a current
              cap table and terms, monthly deliveries and realized prices by model, warranty and gross-margin data, cash
              runway, tariff exposure, and board-approved commercialization milestones.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Decision thresholds
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate financing facts, market signals, and scenario assumptions so that readers do not
              mistake a financing amount for valuation or a public peer market capitalization for an implied
              private-company price. Rows marked unavailable identify underwriting gaps rather than zero values. The
              recommendation logic is intentionally conditional: evidence of scale and product traction can move the
              call toward research-more or buy only if accompanied by credible margins and terms; evidence of further
              dilution, weak premium demand, or tariff-driven economics would move it toward avoid.
            claimRefs:
              - CV002
              - CV008
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              Public evidence supports strategic resilience but not a current price. Require verified terms, cash
              economics, and profitable scale before underwriting a premium private valuation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV014
          - type: callout
            title: The key downside is financing quality, not headline funding
            body: >-
              A large financing amount does not establish cash runway, valuation, preferences, or protection against
              dilution in a price-war market.
            calloutType: risk
            claimRefs:
              - CV002
              - CV008
              - CV009
          - type: callout
            title: Scenario ranges remain qualitative
            body: >-
              The assigned pool lacks current revenue, margin, cash-flow, and post-money inputs, so numeric bull, base,
              and bear valuations would be false precision.
            calloutType: assumption
            claimRefs:
              - CV014
              - CV016
