      - [IM L7 and LS7, "Coverage describes first models as above RMB 400,000", "Premium sedan/SUV positioning", "Higher price associated with weak observed monthly sales", "Premium positioning has not translated into comparable volume in assigned evidence"]
      - [Tesla Model 3 or Model Y, "Not disclosed in assigned pool", "Named as comparison set for L6/LS6", "Realized price and option packaging unknown", "Direct price comparison is an evidence gap"]
