callouts:
  - calloutType: strength
    title: Partner-enabled product and channel bundle
    body: IM combines SAIC manufacturing and distribution access with Alibaba/Banma software integration and component relationships that can accelerate feature delivery and overseas entry.
    claimRefs: [CP003, CP004, CP006, CP013]
  - calloutType: risk
    title: Premium positioning is not yet economically durable
    body: Independent coverage links stronger demand to lower-priced L6 and LS6 models, while higher-priced L7 and LS7 volumes lagged; price cuts and crowded peers raise displacement risk.
    claimRefs: [CP008, CP009, CP011]
  - calloutType: recommendation
    title: Underwrite moat proof, not feature breadth
    body: Before treating the product bundle as a durable moat, request independent reliability, warranty, retention, channel economics and real-world assisted-driving evidence.
    claimRefs: [CP010, CP014]
