evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current revenue, run-rate, gross margin, cash burn, cash balance, headcount, location count, and distinct-owner or
      customer metrics.
    whyItMatters: >-
      Without these quantities, operating scale, capital efficiency, and runway cannot be underwritten from public
      evidence.
    diligencePath: >-
