company:
  name: IM Motors
chapter:
  number: 6
  title: Customers
  summary: >-
    IM Motors has credible aggregate adoption evidence, including 65,505 reported
    2024 sales and a reported 100,000 cumulative deliveries, but public evidence
    still does not establish owner retention, repeat purchase, or concentration.
    Overseas launches and connected-cockpit use cases broaden the customer thesis
    while remaining earlier and less quantified than the China retail base.
sections:
  - id: customer-segments
    title: Buyers, users, and routes to market
    body: >-
      The observable customer base is primarily individual vehicle buyers rather
      than enterprise accounts. IM Motors launched as a premium intelligent
      pure-electric brand with sedan and SUV products, but the buyer proposition
      has widened: Licarco reported that the LS7 could be purchased with the
      battery paid separately in installments, lowering its stated entry price
      to 239,800 yuan. The company also targets distinct use contexts rather than
      one undifferentiated premium cohort. Gasgoo described an L6 cockpit feature
      aimed at urban professionals, while Bitauto reported that Thailand was the
      first overseas market for the IM6 and that distribution would leverage
      SAIC's established sales network. Europe was separately identified as a
      planned export market. Public sources do not split customers, revenue, or
      margin by model, geography, channel, or buyer profile.
    claimRefs: [CU001, CU003, CU008, CU009, CU010]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory is real but reported, not audited
    body: >-
      Scale has advanced beyond an early-product launch, although the disclosed
      measures remain media reports of company data. Licarco put 2022 sales at
      roughly 5,000 vehicles. A later 36Kr article reported 65,505 vehicles sold
      during 2024, up 71% year over year, and Gasgoo reported that cumulative
      deliveries had surpassed 100,000 by December 2024. Gasgoo also reported
      10,007 November 2024 sales, up 14.98% year over year but only 0.06% month
      over month. Those measures show a growing delivered fleet, yet they do not
      share a verified active-owner denominator or establish utilization,
      repurchase, or paid digital-service adoption. The four-model lineup broadens
      addressable preferences, but model-level contribution and customer-cohort
      durability are not disclosed.
    claimRefs: [CU002, CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
  - id: customer-proof
    title: Product proof is stronger than named-customer proof
    body: >-
      Evidence quality is uneven. Aggregate deliveries demonstrate production
      rather than a pilot, and Thailand represents a named market deployment,
      but no public source in the assigned evidence identifies individual paying
      owners or a fleet customer with measured outcomes. The strongest
      independent product-use evidence is SGCarMart's IM6 comparison: it favored
      the IM6 for cabin refinement and comfort, while recording material trade-offs
      in range, charging, performance, cargo capacity, and price versus Tesla's
      Model Y. Connected-service evidence is earlier-stage because Gasgoo
      described AI Takeout as a feature set for L6 deployment, not measured
      utilization. IM Motors' own global page further warns that displayed values
      may be announced or engineering-simulation figures and can vary by market
      and test conditions. Product consideration evidence should therefore not be
      treated as retention or satisfaction evidence.
    claimRefs: [CU005, CU008, CU010, CU011, CU012, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability and concentration remain the underwriting gaps
    body: >-
      Public data does not close the questions most important to customer
      durability: owner-cohort retention, repeat purchase, referral, warranty
      experience, connected-service engagement, or paid-service attachment.
      A 36Kr article describes an engagement mechanism under which 4.9% of equity
      and 300 million "original stones" were allocated to reward user data and
      co-creation, but it does not report participation, redemption, incremental
      retention, or economic cost. Concentration is similarly opaque. The record
      provides no sales mix by model, dealer, geography, or customer class, so
      neither dependence on a few volume models nor overseas channel diversification
      can be quantified. Diligence should obtain registrations, orders, deliveries,
      cancellations, repeat purchases, warranty claims, and service engagement by
      model and monthly owner cohort before assigning durable customer value.
    claimRefs: [CU013, CU015]
