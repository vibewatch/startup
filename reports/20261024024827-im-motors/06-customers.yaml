callouts:
  - calloutType: strength
    title: Six-figure delivered base
    body: >-
      The reported 100,000-delivery milestone is meaningful production adoption,
      although it is not a measure of active use, satisfaction, or retention.
    claimRefs: [CU005]
  - calloutType: risk
    title: Post-purchase economics are unproven
    body: >-
      No retained source quantifies repeat purchase, owner retention, paid-service
      attachment, or customer concentration by model, geography, or channel.
    claimRefs: [CU015]
