    columns: [Named proof surface, Segment, Deployment / use case, Status, Reported outcome, Limitation]
    rows:
      - [IM Motors delivered-owner base, "China-led retail owners", "Production vehicle ownership", production, "More than 100,000 cumulative deliveries reported", "Aggregate cohort; no individually named customer or retention outcome"]
      - [Thailand IM6 market launch, "Overseas premium new-energy buyers", "Sales and service through SAIC network", production-launch, "Thailand named as first overseas destination", "No orders, registrations, deliveries, or customer outcomes"]
      - [SGCarMart IM6 evaluation, "Singapore premium-EV shoppers", "Independent road-test comparison with Tesla Model Y", independent-review, "Reviewer favored IM6 refinement and comfort", "Single reviewer; not an owner cohort or paying-customer reference"]
      - [Ele.me-connected L6 use case, "Urban professionals", "Voice-activated food ordering through IM AIOS", announced-deployment, "Feature described for April deployment", "No independent rollout, utilization, conversion, or satisfaction data"]
