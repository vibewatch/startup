company:
  name: IM Motors
chapter:
  number: 1
  title: Company Overview
  summary: >-
    IM Motors is a Shanghai premium intelligent-EV joint venture founded by SAIC Motor,
    Alibaba, and Zhangjiang Hi-Tech in December 2020. Public evidence substantiates a
    RMB 9.4 billion Series B close and more than 100,000 cumulative deliveries by late
    2024, but the current valuation, full cap table, revenue, headcount, and 2026 scale
    remain unavailable.
sections:
  - id: identity-and-business
    title: Identity, structure, and business model
    body: >-
      IM Motors, legally identified in one source as Zhiji Automotive Technology Co.
      Ltd., was founded in Shanghai in December 2020 as a premium electric-vehicle joint
      venture among SAIC Motor, Alibaba Group, and Zhangjiang Hi-Tech. The founding
      structure paired SAIC's automotive manufacturing base with Alibaba's digital
      capabilities and Zhangjiang's technology ecosystem. The operating model is a
      vehicle manufacturer rather than a software-only company: by December 2024 its
      disclosed range comprised the L6 and L7 sedans and LS6 and LS7 SUVs, all then
      battery-electric. The last substantiated stage marker in this evidence set is the
      December 2024 Series B close, so a newer financing stage or 2026 valuation should
      not be inferred.
    claimRefs: [CO001, CO004, CO005, CO008]
    tableRefs: [TO001]
  - id: ownership-and-leadership
    title: Ownership, leadership, and governance
    body: >-
      The founding cap table was reported in 2022 as 54% SAIC, 18% Alibaba, 18%
      Zhangjiang Hi-Tech, with 10% reserved for employees and customers providing
      research data. A January 2025 analysis instead reported that SAIC owned or
      controlled about 46.5% and Alibaba about 13.1%, consistent with dilution but not
      a complete current cap table. Publicly named leadership is also narrow: Liu Tao
      was identified as co-CEO, while SAIC chief Jia Jianxu assumed the IM Motors
      chairmanship and another board position in December 2024. That parent-level
      oversight provides industrial support but also creates key dependence on SAIC;
      the full board, management bench, voting rights, and investor protections remain
      private.
    claimRefs: [CO002, CO003, CO015]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing history and strategic stakeholders
    body: >-
      Reuters reported that IM Motors had raised more than RMB 8 billion, or about
      US$1.1 billion, in Series B equity financing by March 2024. CnEVPost and Bamboo
      Works later reported a RMB 9.4 billion final Series B close in December 2024;
      Bamboo Works placed cumulative funding since launch at RMB 22.4 billion,
      comprising RMB 10 billion of angel capital, RMB 3 billion of Series A capital,
      and the RMB 9.4 billion Series B. The company said proceeds would support smart
      models, core technologies, product launches, and overseas expansion. Named
      participants span state-backed financial institutions and strategic suppliers,
      including CATL, Momenta, and QingTao Energy, reinforcing the industrial network
      while leaving post-money valuation and governance terms undisclosed.
    claimRefs: [CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: scale-and-milestones
    title: Scale, milestones, and execution signal
    body: >-
      Operating momentum improved late in 2024: IM Motors reported 10,001 October
      deliveries and 10,007 in November, its first two consecutive months above 10,000,
      and announced that cumulative deliveries had passed 100,000 in December. The
      improvement did not erase the execution gap. Bamboo Works reported only 57,000
      units sold in the first eleven months against co-CEO Liu Tao's 120,000-130,000
      annual goal, leaving the brand outside China's top ten new-energy-vehicle
      manufacturers. Product and technology activity continued with the March 2025
      unveiling of the IM AIOS smart cockpit, but the assigned evidence does not provide
      a verified 2026 delivery total, revenue, headcount, location count, or customer
      cohort metric. Late-2024 traction is therefore evidence of survival and improving
      scale, not proof of durable economics.
    claimRefs: [CO006, CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
