callouts:
  - calloutType: risk
    title: Scale improved, but the target miss remains material
    body: >-
      Two consecutive 10,000-unit months and the 100,000 cumulative-delivery milestone
      show traction, yet 57,000 sales through November 2024 were still less than half
      the stated 120,000-130,000 annual goal.
    claimRefs: [CO012, CO013, CO014]
