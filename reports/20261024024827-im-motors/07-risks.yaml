callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: Obtain model-level safety, recall, OTA-change, warranty, supplier-concentration, data-governance, cash, and gross-margin records before treating the financing and technology ecosystem as risk reduction.
    claimRefs: [CR003, CR008, CR013, CR017]
  - calloutType: assumption
    title: Absence is not clearance
    body: The assigned public sources do not document an IM Motors incident or recall; that observation is a coverage limitation, not evidence that no incident occurred.
    claimRefs: [CR008, CR015]
