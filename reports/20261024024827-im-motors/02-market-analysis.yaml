callouts:
  - calloutType: insight
    title: Category growth is not yet IM capture
    body: "China's NEV category has crossed a major adoption threshold, but the assigned evidence cannot convert 5.458 million H1 2025 NEV units or 15.33 million 2025 wholesale units into IM-specific revenue, share, or valuation support."
    claimRefs: [CM005, CM007, CM004]
  - calloutType: risk
    title: Price and trust are adoption constraints
    body: "Third Bridge's expert synthesis describes price-war fallout, low EV residual values, delivery bottlenecks, safety regulation, and trade barriers; these can delay purchase decisions or compress returns even while category volumes grow."
    claimRefs: [CM008, CM009, CM010, CM014]

