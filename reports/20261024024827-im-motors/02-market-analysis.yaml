company:
  name: IM Motors
chapter:
  number: 2
  title: Market Analysis
  summary: IM Motors participates in China's rapidly electrifying passenger-vehicle market, but its practical opportunity is a narrower premium intelligent-vehicle slice exposed to intense price, software, supply-chain, and export competition. Public evidence supports market scale and adoption drivers; it does not disclose an IM-specific SAM, SOM, contribution margin, or durable share.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      The relevant market is premium intelligent new-energy passenger vehicles, with IM
      Motors' own materials positioning the brand around high-end new-energy intelligent
      vehicles and intelligent driving. The broad reference market is China's passenger
      NEV market, including battery-electric vehicles and plug-in hybrids; hydrogen
      vehicles are technically included in the Chinese NEV definition but are nearly
      nonexistent in the cited 2025 data. The narrower opportunity includes vehicle
      purchase, financing or battery-payment arrangements, software-enabled cockpit and
      driver-assistance functionality, and after-sales support for premium sedans and
      SUVs. It excludes commercial vehicles, charging infrastructure revenue, general
      automotive software sold independently, and the entire ICE replacement market.
      The status quo is an ICE vehicle or an incumbent premium vehicle, while substitutes
      include other Chinese NEV brands, Tesla, and delaying a purchase. This boundary
      matters because headline NEV volumes include mass-market vehicles and cannot be
      treated as IM's addressable demand without a premium-price and body-style filter.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-and-adoption
    title: Sizing lenses and adoption trajectory
    body: >-
      Multiple lenses establish scale without pretending to isolate IM Motors' share.
      CarNewsChina, citing CPCA and China EV DataTracker, reports 10.891 million
      passenger-vehicle sales in China in H1 2025, including 5.458 million NEVs, with
      NEVs at 50.1% penetration; BEVs were 3.330 million and PHEVs 2.128 million.
      Global Times reports preliminary CPCA wholesale sales of 15.33 million new-energy
      passenger vehicles for full-year 2025, up 25% year over year, but that is a
      wholesale industry total rather than retail demand or IM's premium segment.
      The adoption case is strengthened by China's battery and supply-chain scale and by
      Chinese brands' rising domestic share. It is constrained by price competition,
      low residual values, delivery capacity, safety standards, tariffs, and the capital
      intensity of overseas production. IM's 2024 Series B was described as funding new
      smart-car models, technology, and overseas expansion, but funding is not market
      share, revenue, or cash available for deployment.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map-and-constraints
    title: Buyer, budget owner, and constraints
    body: >-
      The primary user is a private consumer seeking a premium sedan or SUV; the payer
      is usually the household, with the vehicle purchase and financing budget controlled
      by the buyer or household decision maker. IM's product and partner evidence points
      to urban, digitally receptive users who value intelligent driving, integrated
      cockpit services, design, range, and convenience. A fleet or public-procurement
      segment is not established by the assigned sources and should not be assumed.
      Adoption can be triggered by a new model, a credible technology upgrade, a
      financing or battery-payment option, or export availability, but can be delayed
      by uncertain residual values, delivery bottlenecks, safety scrutiny, tariffs,
      and distrust after aggressive discounting elsewhere in the market. The budget
      owner therefore evaluates total cost of ownership and service confidence, not
      only the advertised vehicle specification. Public evidence does not show IM's
      conversion funnel, customer acquisition cost, repeat purchase, or margin by
      segment, leaving the commercial quality of demand unresolved.
    claimRefs: [CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]
  - id: exhibits
    title: Evidence limits
    body: >-
      The market evidence is directionally strong on category growth but incomplete on
      IM-specific economics. Company and partner materials establish positioning and
      product intent; independent industry coverage supplies market totals and
      constraints. The assigned pool does not provide a public premium-NEV denominator,
      IM unit sales by model and geography, price realization, share, gross margin,
      retention, or a validated SAM/SOM. The resulting investment implication is that
      category growth can support product expansion, but valuation must remain sensitive
      to execution and share capture rather than to the full China NEV headline.
    claimRefs: [CM016, CM004]

