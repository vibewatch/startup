callouts:
  - calloutType: risk
    title: Credit Loss and Working Capital Underwriting Opacity
    body: While Faire absorbs default and liquidity risk by funding Net 60 payment terms and paying suppliers within 1–2 business days, the company does not disclose bad debt loss rates, reserve ratios, or delinquency aging, creating a material blind spot for financial underwriting.
    claimRefs:
      - CI002
      - CI014
  - calloutType: insight
    title: Monetization Diversification Beyond Core Take Rates
    body: Faire has systematically expanded beyond core marketplace commissions by scaling its wholesale advertising product past 5% of total revenue and enrolling over 100,000 retailers in its $19.99 monthly Insider membership, softening take-rate pressure from commission-free Faire Direct volume.
    claimRefs:
      - CI005
      - CI006
