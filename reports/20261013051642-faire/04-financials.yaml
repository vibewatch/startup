    title: Gross merchandise volume to net revenue conversion bridge
    type: flow
    summary: Sequential workflow showing how gross retailer order volume converts into net monetized revenue and platform gross profit.
    data:
      nodes:
        - id: n1
          label: Gross Retailer Order Placement
          detail: Retailer selects merchandise from 100,000+ brands and initiates checkout
        - id: n2
          label: Net 60 Underwriting & Credit Approval
          detail: Faire risk algorithm underwrites buyer credit and grants 60-day payment terms
        - id: n3
          label: Immediate Supplier Settlement
          detail: Faire pays brand within 1 to 2 business days less applicable processing fees
        - id: n4
          label: Marketplace Commission Capture
          detail: Faire retains 15% base take rate on marketplace orders or 0% on Faire Direct
        - id: n5
          label: Ancillary Monetization Layer
          detail: Additional margin captured from advertising bids, Insider fees, and shipping
        - id: n6
          label: Invoice Settlement & Return Window Close
          detail: Retailer pays invoice at 60 days or returns unsold opening inventory
    approximationNotes: Illustrates structural transaction lifecycle and fee capture mechanics; actual order-level settlement timings vary by brand payout preferences.
