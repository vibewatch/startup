  - id: TI002
    title: Pricing / monetization table
    columns:
      - Monetization Component
      - Contract Terms
      - List vs Realized Pricing
      - Discounts & Unknowns
      - Source Evidence
    rows:
      - - Standard Order Commission
        - 15% base fee on wholesale transactions
        - List rate applied to non-direct orders
        - Waived completely (0%) on Faire Direct orders
        - Sacra and Latterly commercial breakdown
      - - Payment Processing Fee
        - 1.9% to 3.5% + $0.30 per transaction
        - Varies based on brand payout speed (1 to 60 days)
        - Longer payout terms reduce processing fees
        - Sacra marketplace revenue analysis
      - - Opening Order Fee
        - $10 flat fee on first order from new retail account
        - Applied once per new brand-retailer relationship
        - No recurring charge on subsequent reorders
        - Sacra commission model documentation
      - - Insider Membership
        - $19.99/month subscription fee for retail buyers
        - Standard monthly billing per retailer
        - Subsidizes up to $175/month in carrier shipping
        - ReviewsAnalysis and Sacra platform reviews
    notes: Primary fee schedules derived from Faire merchant documentation and Sacra coverage; realized blended take rate reflects mix of Faire Direct and marketplace orders.
    claimRefs:
      - CI003
      - CI004
      - CI005
