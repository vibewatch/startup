callouts:
  - calloutType: "insight"
    title: "Credit Underwriting as the Core Growth Engine"
    body: "Faire's technical differentiation is fundamentally anchored in its balance-sheet financing and credit underwriting capabilities rather than pure marketplace search. By absorbing buyer default risk and providing automated Net 60 terms, Faire removes working-capital barriers for independent retailers, driving order conversion rates that unfinanced competitor marketplaces cannot match."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE012"
  - calloutType: "risk"
    title: "Catalog Dilution and Disintermediation Vulnerabilities"
    body: "As Faire scales beyond 100,000 brands, its discovery algorithms face user-experience friction from catalog bloat, making it difficult for shopkeepers to curate coordinated product lines. Furthermore, because Faire enforces strict communication boundaries to protect its take rate, brands and retailers face operational hurdles for customized orders, incentivizing off-platform disintermediation."
    claimRefs:
      - "CE008"
      - "CE014"
      - "CE015"

