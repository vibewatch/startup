    rows:
      - - Faire Marketplace
        - 25% on first order from Faire-acquired buyer
        - 15% ongoing on all subsequent reorders
        - Faire guarantees payout; optional 3% for next-day
        - High margin deduction for brands; high liquidity and reach
      - - Faire Direct Link
        - 0% commission on brand-invited accounts
        - 0% ongoing commission on reorders
        - Standard Net 60 payment infrastructure included
        - Free wholesale management software for existing brand accounts
      - - Historical Marketplace Peers (Tundra / Abound)
        - 0% (Tundra ad-model) / ~25% (Abound)
        - 0% (Tundra) / ~15% (Abound)
        - Varied; limited capital for underwriting terms
        - Tundra failed on unit economics; Abound lacked scale
      - - Direct Wholesale and Trade Shows
        - 0% commission; high upfront booth / rep fee
        - 0% commission; 10%–15% sales rep commission
        - Brand bears credit risk and collections
        - High upfront cash requirements; full retained margin on reorders
    notes: Commission rates reflect published 2026 fee schedules. Faire Direct accounts require brand self-sourcing and link generation to qualify for zero-commission status.
