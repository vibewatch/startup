callouts:
  - calloutType: strength
    title: Liquidity Moat Reinforced by Shopify Partnership
    body: Faire's position as the default wholesale marketplace is heavily reinforced by two-sided liquidity and ecosystem partnerships. Shopify's strategic decision to take an equity stake in Faire and integrate its merchant catalog rather than building competing marketplace Handshake establishes high distribution power that sub-scale peers have been unable to match.
    claimRefs:
      - CP002
      - CP010
  - calloutType: risk
    title: High Take-Rate Friction and Disintermediation Vulnerability
    body: A perpetual 15% reorder commission creates sustained tension with makers whose wholesale gross margins are compressed by production costs. While Faire Direct mitigates disintermediation for pre-existing relationships, mature brands with established distribution channels face ongoing economic incentives to multi-home or shift repeat order volumes off-platform.
    claimRefs:
      - CP004
      - CP005
      - CP012
  - calloutType: insight
    title: Underwriting Capability as the Primary Entry Barrier
    body: Competitors that attempted to undercut Faire's commission structure failed primarily due to credit risk and working capital deficits. Financing Net 60 terms while guaranteeing seller payouts requires sophisticated risk underwriting and substantial balance-sheet backing that advertising-supported or bootstrapped alternatives could not sustain.
    claimRefs:
      - CP003
      - CP007
      - CP013
