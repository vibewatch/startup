callouts:
  - calloutType: "recommendation"
    title: "Disciplined Stance: Maintain Track Posture"
    claimRefs:
      - CV001
      - CV002
      - CV004
    body: "While Faire's $500M+ revenue run rate and resilient 40%+ growth highlight dominant marketplace liquidity, the 59% haircut to $5.2B in the late-2025 tender offer demonstrates that private valuations remain sensitive to margin and credit opacity. Investors should track secondary pricing and seek entry below 6.0x EV/revenue."
  - calloutType: "risk"
    title: "The Net 60 Working Capital Paradox"
    claimRefs:
      - CV007
      - CV013
    body: "Faire's primary customer acquisition wedge—fronting inventory costs to brands while allowing independent retailers 60 days to pay with free returns—functions as an unrated lending facility. In an inflationary or retail downturn environment, default spikes could rapidly impair platform profitability."
