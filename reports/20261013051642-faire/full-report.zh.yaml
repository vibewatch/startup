  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心工作流与双边平台架构
        blocks:
          - type: paragraph
            body: >-
              Faire 运营一个线上双边批发市场，旨在消除实体贸易展会、人工销售代理网络和陌生拓客带来的传统运营及财务摩擦。
              传统批发中，独立零售商要穿梭于分散的供应商目录，针对高最低订货量（MOQs）投入大量营运资金，并承担未经验证商品的未对冲库存风险；与此同时，新兴品牌和手工艺制造商没有专门销售团队，还要面对区域市场高昂的展位费。
              Faire 充当集中的数字批发下单平台，在北美和欧洲匹配买方需求与供应商库存。

              平台交易闭环围绕风险逆转机制构建，彻底改变批发库存采购。零售商注册批发账户并接受信用评估后，可获得灵活的 Net 60 条款，在现金离开企业前最多 60 天收货并把商品摆上货架。 为进一步降低试单门槛，Faire
              保证新品牌首单免费退货。精品店下单后，Faire 在履约时直接向品牌预付款，同时吸收买方违约风险并负责催收。
              这套资本支持的工作流让独立店主可以在不压迫资产负债表的情况下测试新品类，也为新兴品牌带来即时流动性和自动化的多渠道订单处理。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
