  - id: FE001
    title: 产品技术与运营栈
    type: stack
    summary: 分层呈现 Faire 的软件架构、集成网关和金融承保基础设施。
    data:
      layers:
        - label: 体验与商业界面
          detail: 通过网页和移动应用提供精选市场浏览、品牌门户及多地点零售采购。
          modules:
            - 零售商发现与开票仪表板
            - 品牌商品管理与店面管理器
            - Faire Direct 自定义链接归因
        - label: 智能与个性化层
          detail: 机器学习算法驱动个性化目录推荐和本地化需求匹配。
          modules:
            - 门店规模与品类适配推荐引擎
            - 商品组合售罄优化
            - 季节性趋势选品算法
        - label: 集成与 API 网关
          detail: 双向 REST 接口编排目录、库存、订单和履约的程序化同步。
          modules:
            - Faire External API v2 端点
            - Shopify 与 POS 电商连接器
            - 发货与跟踪通知 Webhook
        - label: 订单与库存管理引擎
          detail: 集中处理订单生命周期、多渠道库存同步和退货授权流程。
          modules:
            - 自动库存水平同步引擎
            - 低库存补货提醒处理器
            - 首单退货管理流程
        - label: 金融服务与承保栈
          detail: 风险评分模型、自动信贷审批和支持 Net 60 付款条款的流动性管理。
          modules:
            - 实时零售商信用评分模型
            - 营运资金额度分配
            - 自动催收与准备金管理
        - label: 跨境结算与基础设施
          detail: 支持多币种兑换、国际税务合规和平台安全的云基础设施。
          modules:
            - 自动增值税与关税计算器
            - 多币种付款与结算网关
            - 机器人缓解与目录抓取防护
