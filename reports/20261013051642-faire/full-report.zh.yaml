      - number: '3.4'
        title: 转换成本、分销能力与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Faire 的竞争护城河能否持久，依靠的是双边网络流动性和一体化金融评估，而不是排他的技术壁垒。超过 100,000 个品牌和 700,000 个零售商在网络中交易，形成强大的跨边网络效应：零售商因 Faire
              提供最广的精选商品而默认使用，制造商则必须在 Faire 上架才能触达分散的独立门店。 Shopify 选择入股 Faire、把商户导向该市场，而不是继续让 Handshake 作为直接竞争者，这验证了
              Faire 的分销能力。但反垄断诉讼和品牌去中介化风险仍持续检验护城河。 Tundra 提起联邦反垄断诉讼，称 Faire 依靠排他协议维持估计 90% 的市场份额；品牌也经常不满持续 15%
              的复购佣金。品牌在技术上仍可多平台经营，但 Faire 能为 Net 60 发票融资并吸收违约风险，构成难以撼动的平台替代壁垒。
