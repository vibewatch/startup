      - number: '3.3'
        title: 定价、产品组合与抽成经济学
        blocks:
          - type: paragraph
            body: >-
              独立批发的变现模式明显分为交易佣金和预付固定准入费。Faire 仅收取佣金：对从市场发现的账户产生的首单收取 25%，后续复购持续收取 15%，并可选收取次日付款 3% 的费用。
              这种模式免除了预付供应商上架费，却压缩了实体商品制造商本就紧张的销货成本利润率。竞争者降低费率的尝试在商业上难以持续；Tundra 曾试图靠供应商广告运营 0% 佣金市场，但在 2023
              年因无法从交易量变现而关闭。 与此同时，传统贸易展会收取数千美元的不可退款展位和差旅费，小型制造商无论能否成交都必须承担。Faire Direct 让品牌在接入既有零售关系时把佣金降至零，显著重塑了这套经济关系。
