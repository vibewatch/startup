  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础架构与买方分层
        blocks:
          - type: paragraph
            body: >-
              Faire 是一个专门服务传统企业批发平台忽视的独立零售参与者的双边 B2B 批发市场。供给侧连接超过 100,000
              个活跃独立品牌和手工艺制造商，品类包括家居装饰、服装、特色食品饮料、美容健康、纸制品和珠宝等高毛利生活方式商品。
              需求侧的核心买家是独立实体精品店、礼品店店主和本地专业门店；它们没有集中采购部门、专门采购团队或充足的贸易展会差旅预算。 Faire
              拆解传统批发分销，让小型零售商以单件或低金额首单最低量发现差异化商品。但供应商经济学包含显著平台抽成：首次门店订单承担 15% 佣金、固定 $10 新客户费、1.9%–3.5% 支付处理费和每笔交易
              $0.30；复购订单持续承担 15% 佣金，除非通过免佣金 Faire Direct 推荐链接下单。
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU012
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU012
      - number: '6.2'
        title: 采用轨迹与算法信用评估飞轮
        blocks:
          - type: paragraph
            body: >-
              Faire 的历史扩张显示，在激进补贴营运资金的推动下，市场流动性迅速扩大。2021 年零售商超过 100,000 家、年化交易量超过 $1B 后，网络扩展到北美和欧洲数十万独立商户账户。
              关键在于，专有风险吸收机制加速了采用：Faire 向符合条件的零售商提供 Net 60，让店主可以先备货、测试客户需求并销售商品，再等发票到期；同时保证 60 天内首单免费退货。
              在早期规模化阶段，这一获客机制造成严重逾期激增和不可持续的退货量。Faire 部署机器学习信用评估模型，分析细粒度售罄历史、商户信用档案和跨平台还款模式，使退货率下降 75%、付款违约减少近
              90%，从而稳定单位经济学。 这一预测型信用评估引擎构成 Faire 获客和风险管理的主要运营护城河。
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU006
      - number: '6.3'
        title: 商户案例与定性生产反馈
        blocks:
          - type: paragraph
            body: >-
              活跃市场参与者的实地证据显示，分销收益与日益增加的平台摩擦并存。官方商户聚焦案例显示，布鲁克林家居和植物精品店 Tula House 等零售商已经采用 Faire，持续采购独特的独立商品。
              独立制造商调查确认，Dani Barbe Jewelry 和 Boss Dotty Paper 等手工艺供应商，能够触达过去无法通过陌生拓客或区域销售代表覆盖的地区中的数百家零售库存商。
              但生产满意度日益分化。StorcksDesigns 等制造商称，自 2023 年目录快速扩张后，自然搜索曝光和销量明显下降；每月 $150 的推广广告支出未能带来增量获客回报。 竞争摩擦还在 2023 年 5
              月达到高点：竞争市场 Tundra 提起反垄断诉讼，称 Faire 在数字批发中拥有 90% 的垄断份额并采用排他性供应商协议；最终 Tundra 关闭市场业务，Faire 则反诉未经授权的数据抓取。
            claimRefs:
              - CU004
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
