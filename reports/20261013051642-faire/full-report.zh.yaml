      - number: '5.2'
        title: 产品模块、开发者界面与生态集成
        blocks:
          - type: paragraph
            body: >-
              Faire 为品牌、零售买家和技术集成伙伴提供不同的软件界面。对品牌而言，平台提供集中的批发门户，把目录管理、多渠道订单编排、直销归因和库存同步结合起来。 品牌可以设置分层批发价、最低订单量，并使用内置 CRM
              和邮件营销工具重新触达账户。通过 Faire Direct，品牌可以向现有零售客户分享个性化、免佣金下单链接，在标准化结账和开票流程中保留客户关系。
              对零售商而言，买方界面是专业采购仪表盘，支持多品牌购物车合并结账、跨门店发票管理、集中订单跟踪和精选发现筛选。

              技术集成层把 Faire 锚定在现有零售企业软件中。通过 Faire External API v2，公司提供支持市场两端的程序化 REST
              接口：品牌端端点管理自动商品上架、实时库存调整、订单履约通知和物流跟踪；零售商端端点支持外部目录浏览和购买。 为减少人工录入，Faire 与 Shopify、WooCommerce 及 POS
              平台等核心商户系统直接集成。但 API Evangelist 的外部评估指出，Faire 虽提供可用的 REST 合同，公开开发者界面却缺少已发布的 OpenAPI
              机器可读规范、开发者沙盒和交互工具，因此仍需直接技术尽调 webhook 延迟和 API 限流阈值。
