companyProfile:
  summary: >-
    Faire 是一家处于后期阶段的非上市 B2B 批发市场，连接北美、欧洲和澳大利亚的独立品牌、独立零售门店及专业买家。 公司的核心产品把市场发现、内置 Net 60
    融资、首单免费退货和结算工具结合起来，帮助小型零售商采购库存，也让品牌更快回款、触达更广。 Faire 还把变现从核心佣金扩展到支付费、广告、物流和零售商会员收入，但公司对信用损失和单位经济学的公开披露仍然有限。
