              - CM010
              - CM014
      - number: '2.3'
        title: 买方分层、预算归属与采用经济学
        blocks:
          - type: paragraph
            body: >-
              Faire 的需求侧覆盖超过 700,000 个零售账户，可分为购买机制和单位经济学不同的运营类型。独立礼品店数量最多，平均订单金额为三百至八百美元，补货周期为 60–90 天。
              精品服装门店的平均订单金额明显更高，为八百至两千五百美元，主要由季节性服装组合和品牌故事策划驱动。特色食品、饮料和精品杂货店的客单价较小，但每月复购更频繁，形成稳定的基础补货量。
              在各个细分市场，店主或精品店创始人通常既是主要买家，也是预算负责人，不需要经过层层采购审批。Faire 的核心风险缓释机制加速采用：Net 60
              让门店可以先卖库存、后结算发票；首单免费退货则消除了销售未经验证商品的财务惩罚。
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: 增长驱动、渠道约束与去中介化风险
        blocks:
          - type: paragraph
            body: >-
              Faire 的市场采用受到自我强化网络效应推动：目录扩大到超过 100,000 个品牌后，零售买家的发现价值提高，吸引更多商户流量。对品牌而言，平台在 1–7 天内为发票提供资金，转移零售商信用违约风险。
              但可持续扩张受到明显结构性约束。B2B 批发市场天然存在去中介化动机：零售商与品牌通过 Faire 建立信任后，双方都有绕开持续百分之十五复购佣金、直接交易的经济动力。Faire Direct
              为自行获客账户提供较低费率层级，但平台流失仍是长期威胁。Net 60 融资还使 Faire
              在宏观低迷、挤压小企业现金流时暴露于系统性信用损失风险。最后，脆弱的手工艺供应商高流失率要求持续获客来抵消供给侧流失，竞争对手的激烈诉讼也加剧了围绕市场排他性和抽成可持续性的监管审查。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 信用评估与发现融合，加速市场流动性
            body: Faire 的关键突破是把目录推荐算法与内置信用评估结合起来。通过为 Net 60 提供融资并承担违约风险，Faire 让现金紧张、过去无法承担陌生制造商试单的精品店店主能够更快下单。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM009
          - type: callout
            title: B2B 去中介化与利润率压缩动机
            body: B2B 市场的根本脆弱点是交易转向平台外。买卖双方建立信任后，持续 15% 的复购抽成会制造经济摩擦，促使双方直接下单或采用白标门户，尤其是正在扩张的高销量品牌。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM014
          - type: callout
            title: 独立精品店的生存能力支撑长期 SAM 扩张
            body: Faire 的长期可服务市场增长，假设北美和欧洲独立实体门店持续保持经济活力和客流相关性，从而抵消大型零售整合和 DTC 电商的侵蚀。
            calloutType: assumption
            claimRefs:
              - CM001
              - CM007
              - CM010
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 批发市场与竞争者分层
        blocks:
          - type: paragraph
            body: >-
              服务独立零售商的批发商业格局包括五类竞争者：专门的数字 B2B 市场、企业采购平台、垂直批发软件网络、实体贸易展会运营商和品牌直销代表。
              过去，独立精品零售被传统分销网络忽视，店主只能依赖昂贵的年度展会旅行和预付现金。Faire 于 2017 年进入这一市场，把发现数字化并降低库存风险，在独立零售中建立了占主导地位的市场流动性。 Abound 和
              Bulletin 等专门数字竞争者尝试过类似模式，但规模始终偏小；Tundra 则尝试靠供应商广告融资的零佣金模式，最终失败。Amazon Business 等企业巨头拥有庞大
              GMV，却主要服务机构和企业采购，出售大宗商品，而不是精选的独立生活方式商品。因此，Faire 日常面对的主要竞争仍是供应商直连和传统贸易展会，而不是其他数字平台。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP009
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP009
              - CP010
              - CP014
      - number: '3.2'
        title: 能力差异化与功能矩阵
        blocks:
          - type: paragraph
            body: >-
              Faire 相对其他批发渠道的结构性优势，来自产品化的风险逆转机制。独立精品店店主营运资金有限，也很容易因库存减记受损。Faire 通过 Net 60
              付款、承担信用评估风险和为新品牌首单提供免费退货，解决这些运营障碍。 相比之下，传统批发通常把销售视为最终交易，要求发货前或收货时付款。Amazon Business 等企业采购引擎提供企业 Net
              账期，却没有适合精品店审美的精选发现，也不提供适合单店门店的最低订货量。 为防止制造商在客户发现后离开市场，Faire 推出 Faire Direct：定制下单链接以 0%
              佣金处理交易，同时保留买方信用条款。这一双重架构让平台成为现有账户的免费订单管理软件，同时继续从新发现账户中变现。
