      - number: '4.2'
        title: 成本结构、营运资金与单位经济学
        blocks:
          - type: paragraph
            body: >-
              Faire 的单位经济学有意在平台抽成与大量营运资金占用之间寻求平衡。零售买家最看重的是 Net 60 条款：店主可以先收货、备库存并等待消费者卖出，再支付发票。 Faire 在 1–2
              个工作日内向品牌预付款，同时承担底层信用和催收风险。此外，Faire 通过为新品牌 60 天内的首单免费退货提供融资，消除零售商的库存风险。 这些结构性条款带来巨大的营运资金需求，也让 Faire
              在宏观经济导致零售收缩时面临坏账损失。运营成本还包括 Ship with Faire 的平台物流、支付处理开销、争议解决客服，以及持续进行的机器学习工程，以匹配个性化库存。 Faire
              严格控制平台去中介化，限制制造商与零售商直接联系，把所有沟通导入平台，以保护抽成完整性；但信用违约率和退货处理减记缺乏公开披露，仍是信用评估的关键脆弱点。
