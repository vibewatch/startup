        title: 商业规模、GMV 速度与留存动态
        blocks:
          - type: paragraph
            body: >-
              Faire 商业扩张迅速，预计 2025 年在北美、欧洲和澳大利亚的 GMV 将接近 $3B。第三方市场分析显示，平台增长已连续 8 个季度加速；历史累计售出的批发库存超过 $8B，品牌与零售商连接超过 10M。
              现有零售商的净美元留存率持续超过 110%，反映出强劲的复购节奏，以及零售商把采购集中到平台后钱包份额提高。2025 年末年化收入运行率超过 $500M；Sacra 估计截至 2026 年 9 月已达到约
              $730M，同比收入增长约 43%。 商业势头越来越受高端化推动：年销售额超过 $1M 的零售账户目前贡献平台订单量的 20% 以上，背后是多门店管理工具，以及与 Square、Shopify、Clover 和
              Lightspeed 的 POS 集成。
