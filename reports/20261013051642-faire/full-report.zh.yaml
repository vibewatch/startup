      - number: '4.4'
        title: 资本充足性、估值重整与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Faire 从顶级机构投资者筹得约 $1.7B 累计股权融资，为履行营运资金和 Net 60 融资义务提供了充足资产负债表缓冲。 但私有市场估值预期已大幅重置。2025 年 11 月，WCM Investment
              Management 领投 $100M 员工要约收购，估值为 $5.2B，较 2022 年 5 月设定的 $12.6B 峰值估值折价 59%。 这一定价相当于约 10
              倍年化收入，反映了更广泛的后期市场估值倍数。竞争与监管压力也已出现：前竞争对手 Tundra 提起联邦反垄断诉讼，称 Faire 拥有 90% 的垄断市场份额，并利用排他性供应商协议。 Faire
              虽保持强劲市场领导力，但投资判断所需的关键财务数据——包括经审计毛利率、计入信用损失后的贡献利润率和坏账准备——仍是未披露的私有指标，必须在保密尽调中确认。
