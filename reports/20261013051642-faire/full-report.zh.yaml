chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、起源与管理层
        blocks:
          - type: paragraph
            body: >-
              Faire Wholesale, Inc. 于 2016 年末注册成立，并于 2017 年在加利福尼亚州旧金山开始运营，打造连接独立零售门店、新兴品牌和手工艺制造商的数字 B2B 批发市场。 联合创始人 Max
              Rhodes 在 Square 负责包括 Square Capital 和 Cash App 在内的产品项目时，通过一次试验性进口业务发现批发分销存在严重供应链摩擦，于是萌生了创业想法。 Rhodes 与
              Square 校友 Marcelo Cortes、Daniele Perito 和 Jeffrey Kolovson 合作，搭建现代化的数字发现与下单引擎，替代成本高昂的传统贸易展会。 Rhodes 任
              CEO，Cortes 负责工程基础设施并任 CTO，Kolovson 负责运营规模化并任 COO。创始团队此前在 Square 打造支付、信用评估和商户软件的经验，直接塑造了 Faire 的核心产品战略：消除本地
              Main Street 零售商的营运资金瓶颈。
            claimRefs:
              - CO001
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
      - number: '1.2'
        title: 市场机制、条款与产品模式
        blocks:
          - type: paragraph
            body: >-
              Faire 的双边批发平台把商业采购变成类似消费者电商的体验，解决独立零售商的结构性劣势。传统批发要求精品店店主预先投入大量营运资金，应对不可预测的经销商最低订货量，并独自承担全部库存滞销风险。 Faire
              向符合条件的零售商提供 Net 60 付款条款，并允许其在任何新品牌下首单免费退货，同时确保品牌在 1–2 个工作日内收到款项。 平台目录已覆盖超过 100,000
              个独立品牌，品类包括家居装饰、服装、生活方式和特色食品。Faire 采用按佣金计费的抽成模式：历史上对零售商与某品牌的首单最高收取 25%，复购订单收取 15%，另加支付处理费、物流解决方案费和市场推广广告费。
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
              - CO010
              - CO013
      - number: '1.3'
        title: 融资历程、估值演变与资本结构
        blocks:
          - type: paragraph
            body: >-
              自 2017 年成立以来，Faire 在 11 轮融资中累计完成超过 $1.1B 的公开披露风险投资和成长股权融资。Y Combinator、Forerunner Ventures、Lightspeed
              Venture Partners 和 Sequoia Capital 等早期机构投资者，奠定了市场的快速增长轨迹。 数字商业在疫情期间加速后，Faire 于 2020 年 10 月以 $2.5B 估值完成
              $170M E 轮融资；2021 年 6 月以 $7.0B 估值完成 $260M F 轮融资；2021 年 11 月由 Durable Capital Partners 领投、以 $12.4B 估值完成
              $400M G 轮融资。 2022 年 5 月的 G 轮扩展融资把公司私有市场估值推至峰值 $12.6B。随后宏观环境收紧，后期科技公司的估值倍数大幅压缩。 2025 年 11 月，WCM Investment
              Management 领投 $100M 员工流动性要约收购，将估值重新定为 $5.2B，较峰值价格回调 59%。与此同时，Shopify 于 2023 年 9 月收购 Faire
              的股权，并将其指定为推荐的批发市场，进一步强化了战略验证。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
      - number: '1.4'
        title: 治理、运营里程碑与法律风险
        blocks:
          - type: paragraph
            body: >-
              Faire 在数字批发领域的快速整合，伴随着商业规模扩大，也带来了治理、运营和竞争摩擦。疫情后市场恢复常态、科技市场环境变化后，Faire 在 2022 年末和 2023 年合计裁减约 20%
              的员工，将团队稳定在约 1,500 人，管理层把重点从无约束扩张转向运营效率。 2023 年 5 月，竞争紧张局势升级为 Faire 与已关闭的竞争市场 Tundra
              在美国加利福尼亚北区联邦地区法院互相提起诉讼。Tundra 声称 Faire 通过排他性品牌合同滥用估计 90% 的市场份额，违反联邦反垄断法；Faire 反诉称 Tundra 非法抓取数据并干扰商户协议。 尽管
              Tundra 随后关闭市场业务，这场诉讼凸显了 Faire 市场支配地位相关的监管与竞争敏感性。全面公司治理、委员会构成以及经审计的 GAAP 信用损失准备金仍是严格保密的私有数据，持续构成尽调重点。
            claimRefs:
              - CO008
              - CO009
              - CO011
              - CO012
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 信用评估护城河：内置借贷成为批发基础设施
            body: >-
              Faire 相对静态贸易展会目录和传统批发经销网络的结构性优势，在于吸收零售交易摩擦。通过提供 Net 60 条款并承担首单退货风险，Faire 把小型精品店探索库存转成类似消费者电商的线上购买流程，同时在
              1–2 个工作日内向供应商付款。
            calloutType: insight
            claimRefs:
              - CO001
              - CO002
          - type: callout
            title: 估值重置与私有市场透明度约束
            body: >-
              2025 年 11 月的要约收购将 Faire 估值重置为 $5.2B，较 2022 年 $12.6B 的峰值下跌 59%，使资本定价更接近现实的私有 SaaS 和市场估值倍数。 但由于经审计的 GAAP
              损益表和信用违约损失指标尚未披露，拟投资后期阶段的投资者在评估净单位经济学时面临重大尽调障碍。
            calloutType: risk
            claimRefs:
              - CO004
              - CO005
              - CO008
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可服务品类与传统替代方案
        blocks:
          - type: paragraph
            body: >-
              Faire 处在全球 B2B
              批发商业生态中，重点服务新兴独立品牌与本地实体零售商之间分散的库存采购渠道。公司的主要可服务边界是非必需的成品，覆盖家居装饰、服装、特色食品饮料、美容、珠宝和纸制品；明确不涉及高批量大宗商品分销、工业设备和企业
              EDI 供应链。 过去，独立精品店主要依靠一年两次的线下贸易展会、独立销售代表的陌生拓客和纸质目录发现商品。这些渠道摩擦很大：品牌承担高昂的展位和差旅预付成本，零售商则面对僵化的最低订货量和现金预付条款。
              Faire 把目录浏览、订单履约跟踪和支付处理集中到线上平台，降低试销库存和地域拓展的摩擦。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
      - number: '2.2'
        title: 多维市场测算：TAM、SAM 与 SOM 约束
        blocks:
          - type: paragraph
            body: >-
              评估 Faire 的可服务机会，需要把宏观批发统计与独立专业门店可触达的支出拆开。全球 B2B 商业总额虽超过十五万亿美元，但绝大部分来自与 Faire 模式无关的大宗供应、企业采购和封闭经销网络。
              严谨的自上而下测算显示，北美和欧洲独立零售商在礼品、生活方式、服装和特色食品上的库存支出约为五千亿美元。进一步限定到数字化交易的 B2B 批发市场，SAM 为
              五百亿至一千亿美元，反映出市场正加速从传统实体展厅迁移。在这一数字市场中，Faire 已取得早期领导地位：反垄断诉讼的法院记录称，在面向独立零售商的数字批发平台中，Faire 的市场份额最高达百分之九十。其
              SOM 目前覆盖十万多个活跃品牌，平台每年处理的 GMV 估计为二十亿至五十亿美元。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM006
              - CM010
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
