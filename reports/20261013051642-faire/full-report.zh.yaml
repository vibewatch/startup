  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              Faire 是双边批发市场，连接独立零售精品店与超过 100,000 个新兴及成熟品牌。核心经济引擎是促成批发订单后向品牌收取交易佣金。对于由 Faire 促成发现的标准市场交易，品牌支付 15% 的基础佣金。
              为鼓励供应商把既有零售账户迁移到平台并推动市场采用，Faire 提供 Faire Direct，对通过品牌定制推荐链接下单的订单收取 0% 佣金。 除基础佣金外，Faire 还收取 1.9%–3.5%
              的支付处理费，具体取决于品牌选择次日加急付款还是标准 60 天付款，并对新客户订单收取固定 $10 开户费。 近几年，Faire 建立了高毛利的配套收入流，降低对纯交易佣金的依赖。Promoted
              Listings 是 Faire 的批发广告工具，品牌付费即可提升搜索位置和发现曝光，上线两年内已超过平台总收入的 5%。 同时，Faire 通过 Insider 会员计划向零售商变现：每月收费
              $19.99，提供补贴物流和专属发现筛选器，参与零售商超过 100,000 家。
