      - number: '6.4'
        title: 留存持久性、渠道摩擦与扩张循环
        blocks:
          - type: paragraph
            body: >-
              Faire 的长期客户持久性建立在高频复购周期上，但受结构性渠道去中介化压力限制。首单在货架上验证产品市场匹配后，零售商会转入自动复购工作流，持续产生高毛利交易佣金。 为承接既有品牌与零售商的交易量，Faire
              运营 Faire Direct，让制造商以 0% 市场佣金接入既有批发账户，同时使用 Faire 的集中开票和 Net 60 融资基础设施。 但商户定性反馈显示关系摩擦明显：Faire
              系统性限制平台外消息和直接联系方式，保护抽成，却限制定制商品和品牌与买方直接协作。
              此外，成熟供应商要同时承担佣金、物流和促销折扣，费用叠加带来强烈财务动机；一旦建立信任，它们就会把高销量账户迁移到直接下单渠道，长期成熟供应商群体的净收入留存仍是未解决的尽调问题。
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU014
      - number: '6.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 内置融资与数据护城河推动初始零售商采用
            body: Faire 提供 Net 60 条款并吸收首单库存退货风险，消除了独立精品店面临的主要现金流约束。专有交易数据支持算法信用评估，使违约率下降 90%，形成没有同等数据规模的竞争者难以复制的采用引擎。
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: 自然发现能力受压与制造商不满
            body: Faire 把目录扩展到超过 100,000 个品牌后，独立制造商称自然搜索曝光下降，与量产商品的竞争加剧。费用叠加——包括 15% 佣金、$10 新账户费和支付处理费——挤压利润，促使成熟供应商探索直销渠道。
            calloutType: risk
            claimRefs:
              - CU001
              - CU007
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与反垄断风险
        blocks:
          - type: paragraph
            body: >-
              Faire 在在线批发商业中的主导地位，引发了竞争对手对其商业行为的法律和监管摩擦。在联邦法院，前竞争市场 Tundra 依据《谢尔曼法》提起反垄断诉讼，称 Faire 通过限制性、排他性协议取得 90%
              的市场份额，阻断了竞争市场模式。 Faire 随后提出激烈反诉，指控对方非法抓取数据、干扰计算机网络并篡改合同，之后申请驳回诉讼。除竞争对手诉讼外，Faire 还严格执行平台行为规则，全面禁止零售商在
              Amazon、eBay 等大众消费平台转售平台采购的商品。 这一禁令保护了精品差异化和品牌商誉，但也让 Faire 暴露于合规争议、商户不满，以及围绕纵向非价格限制和分销控制的潜在反垄断审查。
            claimRefs:
              - CR001
              - CR002
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR008
      - number: '7.2'
        title: 运营信用评估与 Net 60 信用损失风险
        blocks:
          - type: paragraph
            body: >-
              推动 Faire 买家采用平台的核心商业机制，是 Net 60 付款条款以及首笔品牌订单免费退货。Faire 为零售商采购提供两个月的融资，同时保证向品牌方付款，因此成了独立零售商的无对冲信用中介。2018
              年，大范围零售商违约和商品退货曾令这一模式陷入严重运营困境，管理层随后重做承保流程、收紧信用额度，并部署商户排名算法，使退货率下降 75%。但随着 Faire 扩大 Open with Faire
              等项目，向尚未验证的零售门店提供最高 $20,000 的库存融资，剩余承保敞口仍然偏高。Faire 未公开披露坏账费用、信用损失准备金或违约队列账龄，因此在宏观经济下行中的承保韧性仍是无法量化的资产负债表风险。
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
              - CR010
              - CR012
      - number: '7.3'
        title: 渠道去中介化与生态合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Faire 对平台交易收费变现：发现订单收取 15% 的佣金，另加首单零售商 $10 的费用；算上标准支付处理费后，有效抽成率接近
              19%。这套收费结构会让成熟品牌在建立客户关系后产生绕开平台的内在动机。为遏制客户迁移到平台外，Faire 不允许卖家获取买家的直接联系方式，也限制平台外沟通；对于品牌自行带来的买家，则通过 Faire
              Direct 提供 0% 佣金。与此同时，LINESHEET、Shopify 扩展后的原生 B2B 工具等竞争性批发软件，为品牌提供了低成本、自行托管的替代方案。Faire 深度接入
              Shopify——Shopify 持有其股权，并将 Faire 推荐为首选市场——带来了关键分发能力，却也引入了平台战略依赖和合作伙伴渠道锁定风险。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR010
              - CR011
      - number: '7.4'
        title: 模式可持续性、重组与尽调论题失效触发器
        blocks:
          - type: paragraph
            body: >-
              私募市场估值见顶后，Faire 经历了大幅估值重置并启动组织重组，通过裁员转向运营效率、广告变现和最终上市准备。虽然目录规模仍然可观，平台上列出的品牌超过 100,000
              个，但营收增长能否持续，取决于抽成变现与品牌留存之间的平衡。对投资人而言，明确的论题失效触发器包括：联邦法院认定其承担反垄断责任，或强制拆分排他性契约；消费者需求收缩时，Net 60
              违约率和退货率上升，超过平台信用准备金；以及品牌把重复批发订单转到自有 Shopify 或 linesheet 门户，导致复购率放缓并形成结构性去中介化。
            claimRefs:
              - CR012
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: Net 60 条款下的无对冲信用风险
            body: Faire 承诺无论零售商是否逾期，都按 Net 60 条款向品牌付款，因此在经济下行期会承担无对冲的交易对手信用风险；公开信用损失披露不足又进一步放大了这一风险。
            calloutType: risk
            claimRefs:
              - CR004
              - CR014
          - type: callout
            title: 抽成率上限与去中介化脆弱性
            body: 平台佣金为 15%，首单有效成本最高达到 19%；品牌反弹会推动其采用自有批发软件和 Shopify B2B 工具，从而封顶 Faire 的定价能力。
            calloutType: insight
            claimRefs:
              - CR005
              - CR006
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值轨迹与资本结构重置
        blocks:
          - type: paragraph
            body: >
              Faire 在整个风险融资周期中走过了一条剧烈的估值曲线。疫情期间数字批发繁荣时，公司于 2021 年 11 月完成 $400 million 的 Series G 融资，估值达到 $12.4
              billion；2022 年的 Series G 扩展轮又把账面估值推至 $12.6 billion。随着宏观流动性收紧、科技股估值重估，Faire 进行了大幅运营重组，包括在 2023 年末裁员约 250
              人，占员工总数的 20%。这次重组为私募市场重置铺路，最终在 2025 年 11 月完成 Series I 和 $100 million 员工要约收购，估值为 $5.2 billion。WCM
              Investment Management 主导了这笔二级交易，Baillie Gifford 和 True North Fund 参与其中，为早期员工提供流动性，同时将股价定在峰值私募估值下方近
              60%。按这次重置后的估值，Faire 相对于其披露的 $500 million 营收运行率，EV/营收约为 8.4x 至 10.4x；这提供了更扎实的基准，而已披露首轮融资的累计稀释约 23%，仍在可控范围内。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
      - number: '8.2'
        title: 投资论点与下行情景
        blocks:
          - type: paragraph
            body: >
              Faire 的核心投资论点，建立在其作为北美和欧洲独立实体零售数字骨干的品类领导地位之上。平台把超过 100,000 个新兴批发品牌与数十万家本地精品店连接起来，形成了较难复制的流动性网络。净美元留存率超过
              110%，连续八个季度加速增长的交易量说明现有零售商在扩大钱包份额；同时，欧洲业务增速是北美的两倍。变现引擎由多项业务组成：首单抽成率接近 25%，复购订单抽成 15%，以及占总营收超过
              5%、仍在增长的高毛利零售广告业务。反方论点则集中在 Faire 价值主张内生的结构性信用敞口：平台向符合条件的零售商提供 Net 60 付款条款和首单免费退货，却在一至两个工作日内向品牌付款，使 Faire
              实质上成为面向脆弱主街商户的无担保资产负债表贷款方。此外，竞争对手 Tundra 发起的反垄断诉讼凸显了对市场支配地位的审查；尽管 Tundra 已停业，法律和竞争摩擦依然存在。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV013
      - number: '8.3'
        title: 情景分析与公开市场估值基准
        blocks:
          - type: paragraph
            body: >
              将 Faire 与公开市场电商和市场平台同行比较，可以同时看到其增长溢价和倍数脆弱性。历史上，公开零售平台往往在很宽的估值倍数区间上市，例如扩张周期中的 Poshmark、eBay 和 Etsy，其市销率分别为
              10.0x、13.8x 和 22.6x。在 $12.6 billion 峰值估值时，Sacra 估计 Faire 相对于预计 2022 年 $355 million 营收，交易在不可持续的 35x
              营收倍数。$5.2 billion 的要约收购把 Faire 的追踪 EV/营收倍数压至约 10.4x（以 $500 million 运行率计算），若采用更高的预计营收基数则为 8.4x。乐观情景下，若到
              2027 年年化营收达到 $800 million，广告收入占比扩大到 10%，Faire 按 12.0x 退出倍数可获得 $9.6 billion 的企业价值。基准情景为稳定增长 20% 至 25%，估值维持在
              $4.5 billion 至 $5.2 billion 区间。悲观情景下，精品店关闭、Net 60 违约率飙升，倍数可能压缩至 4.0x，企业价值降至 $2.1 billion。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV009
      - number: '8.4'
        title: 推荐逻辑与战略尽调要求
        blocks:
          - type: paragraph
            body: >
              将 Faire 的运营势头与估值重置放在一起，结论是：继续跟踪，风险评级高，估值偏贵。Faire 在 2025 年末的营收增长超过 40%，已证明其市场领导力；但在 $5.2 billion
              估值进入私募市场，若看不清信用损失准备金、毛利率结构和单位贡献经济，安全边际有限。要把这一立场升级为买入，机构尽调必须解决三个优先事项。第一，审阅经审计财务报表，确认 GAAP 营收、净抽成构成和支付处理
              COGS。第二，取得按 vintage 划分的 Net 60
              贷款账龄表及坏账核销历史，评估宏观下行时精品店信用损失是否超过平台的佣金利差。第三，检查资本表中的清算优先权，确认早期普通股和员工股权没有排在高级优先权层级之后。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 审慎立场：维持跟踪
            body: >-
              Faire 的 $500M+ 营收运行率和韧性十足的 40%+ 增长，凸显其市场流动性主导地位；但 2025 年末要约收购把估值砍低 59% 至
              $5.2B，说明私募估值仍然容易受利润率和信用透明度影响。投资人应跟踪二级市场定价，并争取在低于 6.0x EV/营收时进入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
          - type: callout
            title: Net 60 营运资本悖论
            body: Faire 的主要获客切入点，是替品牌方先垫库存成本，同时允许独立零售商 60 天后付款并享受免费退货；这实际是一项未经评级的放贷设施。在通胀或零售下行环境中，违约激增可能迅速侵蚀平台利润。
            calloutType: risk
            claimRefs:
              - CV007
              - CV013
