        - 定义品类的 B2B 市场，具备强劲的双边网络效应、110%+ 净留存率（NRR），且欧洲业务保持国际化增长势头。
        - 超过 100,000 个品牌，GMV 连续 8 个季度加速增长，欧洲增速是北美的 2 倍。
        - 欧洲扩张放缓、零售商流失激增或抽成率压缩。
      - - 基准立场
        - 对主街精品店而言是留存率高且持久的实用工具，但高耗资的信贷条款和估值重置值得谨慎观察。
        - $5.2B 要约相较 $12.6B 峰值下调 59%；收入运行率 $500M+，2025 年第三季度增长 40%+。
        - 披露经审计财务报表，显示经营现金流为正且信贷违约率低于 2%。
      - - 悲观反向逻辑
        - Net 60 条款把 Faire 变成未对冲的小企业信贷放款方，暴露于精品店倒闭率和营运资金压力之下。
        - Faire 在 1-2 天内先向品牌垫付现金，同时等待精品店 60 天后还款；信贷损失未披露。
        - 将信贷浮存金证券化，或与第三方承保机构合作以移除资产负债表风险。
      - - 结构性风险
        - 来自 Amazon 等电商巨头的平台集中度和平台风险，以及 Shopify 等合作伙伴转向带来的风险。
        - Shopify 当前持有股权，但平台依赖和潜在费用摩擦仍是关键漏洞。
        - 与关键零售合作伙伴及品牌联盟签订长期排他性协议。
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    notes: 前瞻性情景预测基于估计的 $500M+ 收入基数、历史市场倍数和小型零售商违约敏感性建模。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV009
    columns:
      - 情景
      - 运营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 到 2027 年收入达到 $800M+（35%+ CAGR）；广告占收入 10% 以上；信贷损失率低于 1.5%；欧洲贡献 40% 的 GMV。
        - 目标 EV/收入倍数为 12.0x，对应 $9.6B 估值；较 $5.2B 基准上行 85%；成功 IPO 退出。
        - 独立精品店遭遇宏观下行、品牌流失上升或物流执行延误。
        - 25%（要求欧洲持续超高速增长，且 AI 商品化部署毫无差错）
      - - 基准情景
        - 收入以 20-25% CAGR 增长至 $650M；GMV 稳定在约 $4.0B；净抽成率维持在 15-16%；信贷损失率为 2-3%。
        - 目标 EV/收入倍数为 7.0x-8.0x，对应 $4.5B-$5.2B 估值；IRR 持平至小幅增长（年化 0-8%）。
        - 促销退货运费和更高支付处理费压缩毛利率。
        - 50%（符合后疫情时代电商正常化趋势和当前 40% 的同比增长轨迹）
      - - 悲观情景
        - 收入增速放缓至低于 10%（$520M）；Net 60 违约率飙升至 5% 以上；衰退期间精品店倒闭加速。
        - 倍数压缩至 4.0x EV/收入，对应 $2.1B 估值；相较当前要约估值损失 60% 的资本。
        - 严重营运资金紧张、低价轮资本重组或竞争对手大幅削减佣金。
        - 25%（小型独立门店易受消费者支出逆风冲击，风险因此上升）
