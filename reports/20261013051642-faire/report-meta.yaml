  topStrengths:
    - Large two-sided marketplace with 100,000+ brands and broad retailer adoption.
    - Revenue growth remains strong while monetization has diversified beyond core commissions.
    - Embedded Net 60 financing and free returns create a sticky buyer acquisition wedge.
    - Shopify endorsement and strategic ecosystem integrations reinforce distribution.
  topRisks:
    - Credit-loss, reserve, and delinquency data remain undisclosed despite heavy working-capital exposure.
    - Antitrust litigation and vertical restraint concerns could constrain platform practices.
    - Mature brands may disintermediate the platform as fee pressure rises.
    - Private valuation remains elevated versus public-market comparables despite the 2025 reset.
  unresolvedGaps:
    - Audited GAAP financials, exact revenue, gross margin, and contribution-margin data remain undisclosed.
    - Net 60 credit loss rates, reserve policy, delinquency aging, and recovery data are not public.
    - Full board composition, governance documents, and shareholder-rights details remain opaque.
    - >-
