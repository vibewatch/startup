  - id: TV001
    title: Recommendation summary table
    notes: >-
      Valuation stance and risk rating synthesized from November 2025 tender offer data, historical round terms, and
      published comparable multiples.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV009
    columns:
      - Dimension
      - Assessment
      - Supporting Evidence
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - Strong scale ($500M+ run rate, 40%+ YoY growth) offset by undisclosed margins and credit risk
        - >-
          Monitor operational milestones and wait for secondary discount or audited disclosures before capital
          commitment.
      - - Confidence
        - Medium
        - Public tender benchmarks ($5.2B) and Latka/Sacra estimates available, but GAAP financials remain private
        - Require confirmatory data-room diligence on unit economics and take-rate mix.
      - - Risk Rating
        - High
        - Net 60 credit float, post-COVID discretionary retail volatility, and previous 20% workforce reduction
        - Apply wide valuation discount buffer and stress-test recession scenarios.
      - - Valuation Stance
        - Stretched
        - At $5.2B (~8.4x-10.4x EV/revenue), valuation reflects significant private market premium over public comps
        - Seek secondary entry below 6.0x EV/revenue ($3.0B-$3.5B) to establish margin of safety.
  - id: TV002
    title: Thesis / anti-thesis table
    notes: >-
      Synthesis of investment arguments contrasting marketplace network strengths against credit-term liabilities and
      macroeconomic exposure.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV013
    columns:
      - Perspective
      - Core Argument
      - Evidence Anchor
      - What Would Change View
    rows:
      - - Bull Thesis
        - >-
          Category-defining B2B marketplace with powerful two-sided network effects, 110%+ NRR, and international
          momentum in Europe.
        - Over 100,000 brands, 8 consecutive quarters of GMV acceleration, Europe growing 2x faster than North America.
        - Deceleration in European expansion, retailer churn spikes, or take-rate compression.
      - - Base Stance
        - >-
          Durable utility for Main Street boutiques with high retention, but capital-intensive credit terms and
          valuation reset warrant cautious tracking.
        - $5.2B tender represents a 59% reset from $12.6B peak; $500M+ revenue run rate and 40%+ Q3 2025 growth.
        - Disclosure of audited financial statements showing positive operating cash flow and sub-2% credit defaults.
      - - Bear Anti-Thesis
        - >-
          Net 60 terms turn Faire into an unhedged small-business credit lender exposed to boutique failure rates and
          working capital strain.
        - >-
          Faire fronts cash to brands within 1-2 days while waiting 60 days for boutique repayment; credit losses
          undisclosed.
        - Securitization of credit float or third-party underwriting partnership removing balance-sheet risk.
      - - Structural Risk
        - Platform concentration and platform risk from e-commerce giants like Amazon or partner shifts like Shopify.
        - >-
          Shopify currently holds equity, but platform dependencies and potential fee friction remain key
          vulnerabilities.
        - Contractual long-term exclusivity agreements with key retail partners and brand syndicates.
  - id: TV003
    title: Bull / base / bear scenario table
    notes: >-
      Forward-looking scenario projections modeled from estimated $500M+ revenue base, historical market multiples, and
      small-retail default sensitivities.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV009
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Revenue reaches $800M+ by 2027 (35%+ CAGR); ads top 10% of revenue; credit loss rate under 1.5%; Europe drives
          40% of GMV.
        - Target 12.0x EV/revenue multiple yielding $9.6B valuation; 85% upside from $5.2B base; successful IPO exit.
        - Independent boutique macro downturn, rising brand churn, or logistics execution delays.
        - 25% (requires sustained European hypergrowth and flawless AI merchandising rollout)
      - - Base Case
        - >-
          Revenue grows at 20-25% CAGR to $650M; GMV stabilizes near $4.0B; net take rate holds at 15-16%; credit losses
          at 2-3%.
        - Target 7.0x-8.0x EV/revenue multiple yielding $4.5B-$5.2B valuation; flat to modest IRR (0-8% annualized).
        - Gross margin compression from promotional return shipping and higher payment processing fees.
        - 50% (consistent with post-pandemic e-commerce normalization and current 40% YoY trajectory)
      - - Bear Case
        - >-
          Revenue growth slows below 10% ($520M); Net 60 default rate spikes past 5%; boutique closures accelerate in
          recession.
        - >-
          Multiple compresses to 4.0x EV/revenue yielding $2.1B valuation; 60% loss of capital from current tender
          valuation.
        - Severe working-capital crunch, down-round recapitalization, or aggressive competitor commission cuts.
        - 25% (heightened by vulnerability of small independent shops to consumer spending headwinds)
