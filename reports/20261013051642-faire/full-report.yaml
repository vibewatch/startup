companyProfile:
  summary: >-
    Faire is a late-stage private B2B wholesale marketplace that connects independent brands with independent retail
    storefronts and specialty buyers across North America, Europe, and Australia. The company’s core product combines
    marketplace discovery, embedded Net 60 financing, free opening-order returns, and settlement tools that help small
    retailers source inventory while giving brands faster payout and broader reach. Faire has also expanded monetization
    beyond core commissions into payment fees, advertising, shipping, and retailer membership revenue, but the business
    still operates with limited public disclosure around credit losses and unit economics.
