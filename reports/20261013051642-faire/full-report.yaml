      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Underwriting Moat: Embedded Lending as Wholesale Infrastructure'
            body: >-
              Faire’s structural advantage over static trade show directories and traditional wholesale distributor
              networks lies in absorbing retail transaction friction. By extending net 60 terms and underwriting
              opening-order return risk, Faire converts small boutique inventory exploration into an online
              consumer-like purchase workflow while paying suppliers within one to two business days.
            calloutType: insight
            claimRefs:
              - CO001
              - CO002
          - type: callout
            title: Valuation Recalibration and Private Market Transparency Constraints
            body: >-
              The November 2025 tender offer resetting Faire’s valuation to $5.2 billion represents a 59% reduction from
              its 2022 peak of $12.6 billion, bringing capital pricing closer to realistic private SaaS and marketplace
              multiples. However, with audited GAAP income statements and credit default loss metrics remaining
              undisclosed, prospective late-stage investors face material diligence barriers regarding net unit
              economics.
            calloutType: risk
            claimRefs:
              - CO004
              - CO005
              - CO008
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Categories, and Legacy Substitutes
        blocks:
          - type: paragraph
            body: >-
              Faire operates within the global business-to-business (B2B) wholesale commerce ecosystem, specifically
              targeting the fragmented inventory acquisition channel between emerging independent brands and local
              brick-and-mortar retailers. The company defines its primary addressable perimeter around discretionary
              finished goods, spanning home decor, apparel, specialty food and beverage, beauty, jewelry, and paper
              goods. It explicitly bypasses high-volume commodity bulk distribution, industrial equipment, and
              enterprise electronic data interchange (EDI) supply chains. Historically, independent boutiques relied on
              bi-annual in-person trade shows, cold outreach from independent sales representatives, and analog paper
              catalogs to discover merchandise. These status-quo channels imposed severe frictions: brands incurred
              prohibitive upfront booth and travel expenses, while retailers faced rigid minimum order quantities and
              cash-in-advance payment terms. Faire digitizes this relationship by centralizing catalog browsing, order
              fulfillment tracking, and payment processing onto an online platform, lowering the friction of inventory
              trial and geographic reach.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
      - number: '2.2'
        title: 'Multi-Lens Sizing: TAM, SAM, and SOM Constraints'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Faire addressable opportunity requires disaggregating broad macro wholesale statistics from the
              accessible spend of independent specialty storefronts. While aggregate global B2B commerce exceeds fifteen
              trillion dollars, the vast majority represents commodity bulk supply, enterprise procurement, and closed
              distributor networks irrelevant to Faire model. A disciplined top-down lens scopes the North American and
              European independent retail inventory spend at approximately five hundred billion dollars across gift,
              lifestyle, apparel, and specialty food merchants. Constraining further to digitally transacted B2B
              wholesale marketplaces yields a serviceable addressable market (SAM) between fifty billion and one hundred
              billion dollars, reflecting accelerating digital migration away from legacy physical showrooms. Within
              this digital arena, Faire has established an early leadership footprint, with court records from antitrust
              litigation alleging the platform commands up to ninety percent market share among digital wholesale
              platforms for indie retailers. Its serviceable obtainable market (SOM) currently encompasses an estimated
              two to five billion dollars in annualized gross merchandise value transacted across more than one hundred
              thousand active brands.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM006
              - CM010
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
