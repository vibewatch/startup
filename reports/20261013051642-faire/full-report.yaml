      - number: '4.2'
        title: Cost Structure, Working Capital, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Faire’s unit economics reflect a deliberate balance between platform take rates and heavy working capital
              absorption. The fundamental competitive hook for retail buyers is Faire’s Net 60 payment terms, which
              allow store owners to receive merchandise, stock inventory, and generate consumer sell-through before
              paying their invoices. Faire advances payment to brands in one to two business days while assuming the
              underlying credit and collection risk. Additionally, Faire eliminates retailer inventory risk by financing
              free returns on opening orders from new brands within 60 days. These structural terms generate significant
              working capital demands and expose Faire to potential bad debt losses during macroeconomic retail
              contractions. Operational costs are further driven by platform logistics through Ship with Faire, payment
              processing overhead, customer support for dispute resolution, and continuous machine learning engineering
              for personalized inventory matchmaking. While Faire implements strict platform disintermediation
              controls—restricting direct maker-retailer contact and routing all communications through its platform to
              protect take-rate integrity—the absence of public disclosure on credit default rates and return processing
              write-downs remains a critical underwriting vulnerability.
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI007
              - CI008
