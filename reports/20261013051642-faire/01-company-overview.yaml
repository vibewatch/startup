callouts:
  - calloutType: insight
    title: "The Underwriting Moat: Embedded Lending as Wholesale Infrastructure"
    body: >-
      Faire’s structural advantage over static trade show directories and traditional wholesale distributor networks
      lies in absorbing retail transaction friction. By extending net 60 terms and underwriting opening-order return
      risk, Faire converts small boutique inventory exploration into an online consumer-like purchase workflow while
      paying suppliers within one to two business days.
    claimRefs:
      - CO001
      - CO002
  - calloutType: risk
    title: Valuation Recalibration and Private Market Transparency Constraints
    body: >-
      The November 2025 tender offer resetting Faire’s valuation to $5.2 billion represents a 59% reduction from its
      2022 peak of $12.6 billion, bringing capital pricing closer to realistic private SaaS and marketplace multiples.
      However, with audited GAAP income statements and credit default loss metrics remaining undisclosed, prospective
      late-stage investors face material diligence barriers regarding net unit economics.
    claimRefs:
      - CO004
      - CO005
      - CO008
