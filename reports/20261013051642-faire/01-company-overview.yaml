company:
  name: Faire
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Faire Wholesale, Inc. operates a scaled B2B digital wholesale marketplace connecting over 100,000 independent brands
    with retail storefronts across North America and Europe, differentiating through embedded net 60 financing and free
    opening returns. After scaling to a peak $12.6B private valuation in 2022, the company recalibrated to $5.2B in a
    late-2025 tender offer while sustaining roughly $3B in annual GMV volume and strategic backing from Shopify.
sections:
  - id: sec-identity-founding
    title: Company Identity, Origins, and Leadership
    body: >-
      Faire Wholesale, Inc. was incorporated in late 2016 and launched operations in 2017 in San Francisco, California,
      establishing a digital B2B wholesale marketplace designed to connect independent retail storefronts with emerging
      brands and artisan makers. The venture was conceived after co-founder Max Rhodes, while managing product
      initiatives at Square including Square Capital and Cash App, recognized severe supply chain friction in wholesale
      distribution during an experimental import venture. Rhodes partnered with fellow Square alumni Marcelo Cortes,
      Daniele Perito, and Jeffrey Kolovson to construct a modern digital discovery and ordering engine that could
      replace expensive legacy trade shows. Rhodes serves as Chief Executive Officer, Cortes oversees engineering
      infrastructure as Chief Technology Officer, and Kolovson directs operational scaling as Chief Operating Officer.
      The founding team’s prior experience building payment, underwriting, and merchant software at Square directly
      informed Faire’s core product strategy: eliminating working-capital bottlenecks for local Main Street retailers.
    claimRefs:
      - CO001
      - CO003
    tableRefs:
      - TO002
  - id: sec-business-model-platform
    title: Marketplace Mechanics, Terms, and Product Model
    body: >-
      Faire’s two-sided wholesale platform addresses the structural disadvantages of independent retailers by
      transforming commercial procurement into a consumer-like e-commerce experience. Traditional wholesale ordering
      forces independent boutique owners to commit significant working capital upfront, navigate unpredictable
      distributor minimum order quantities, and assume complete inventory dead-stock risk. Faire resolves these barriers
      by extending net 60 payment terms to qualified retailers and providing free returns on opening orders placed with
      any new brand, while ensuring brands receive guaranteed payment within one to two business days. The platform
      catalog has expanded to encompass over 100,000 independent brands across categories including home decor, apparel,
      lifestyle, and specialty food. Faire monetizes through a commission-based take rate model, historically collecting
      up to 25% on a retailer’s initial opening order with a brand and 15% on repeat reorders, augmented by payment
      processing fees, shipping solutions, and sponsored marketplace advertising.
    claimRefs:
      - CO001
      - CO002
      - CO010
      - CO014
    tableRefs:
      - TO001
  - id: sec-capitalization-valuation
    title: Funding History, Valuation Evolution, and Capital Structure
    body: >-
      Since its 2017 inception, Faire has raised over $1.1 billion in disclosed venture and growth equity capital across
      11 financing rounds. Early institutional backing from Y Combinator, Forerunner Ventures, Lightspeed Venture
      Partners, and Sequoia Capital established the marketplace’s rapid growth trajectory. During the pandemic-era
      acceleration of digital commerce, Faire raised a $170 million Series E at a $2.5 billion valuation in October
      2020, followed by a $260 million Series F at $7.0 billion in June 2021, and a $400 million Series G led by Durable
      Capital Partners in November 2021 at $12.4 billion. A subsequent Series G extension in May 2022 marked the
      company’s peak private valuation at $12.6 billion. However, as macroeconomic conditions tightened, late-stage tech
      multiples compressed substantially. In November 2025, WCM Investment Management led a $100 million employee
      liquidity tender offer that established a recalibrated valuation of $5.2 billion, reflecting a 59% correction from
      peak pricing. Concurrently, strategic validation was reinforced in September 2023 when global commerce platform
      Shopify acquired an equity stake in Faire and designated the platform as its recommended wholesale marketplace.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO007
    tableRefs:
      - TO003
  - id: sec-governance-adverse
    title: Governance, Operational Milestones, and Legal Exposure
    body: >-
      Faire’s rapid consolidation of the digital wholesale sector has generated notable governance, operational, and
      competitive friction alongside its commercial scale. Following post-pandemic normalization and shifting tech
      market dynamics, Faire implemented workforce reductions of roughly 20% across late 2022 and 2023, stabilizing
      staffing around 1,500 employees as management prioritized operational efficiency over unchecked expansion. In May
      2023, competitive tensions culminated in dueling federal lawsuits between Faire and shuttered rival marketplace
      Tundra in the U.S. District Court for the Northern District of California. Tundra alleged that Faire abused an
      estimated 90% market share through exclusionary brand contracts that violated federal antitrust statutes, while
      Faire countersued alleging illegal scraping and tortious interference with merchant agreements. While Tundra
      subsequently shuttered marketplace operations, the litigation underscored regulatory and competitive sensitivities
      surrounding Faire’s market dominance. Comprehensive corporate governance, committee composition, and audited GAAP
      credit loss reserves remain closely held private data, representing ongoing diligence priorities.
    claimRefs:
      - CO008
      - CO009
      - CO011
      - CO012
      - CO013
    figureRefs:
      - FO001
