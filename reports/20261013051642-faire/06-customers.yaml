callouts:
  - calloutType: "strength"
    title: "Embedded Financing and Data Moat Drive Initial Retailer Adoption"
    body: "By providing Net 60 payment terms and absorbing opening-order inventory return risk, Faire eliminates the primary cash flow constraint facing independent boutiques. Proprietary transaction data enables algorithmic underwriting that lowered defaults by 90%, creating an adoption engine competitors struggle to match without equivalent data scale."
    claimRefs:
      - "CU005"
      - "CU006"
  - calloutType: "risk"
    title: "Organic Discoverability Compression and Maker Dissatisfaction"
    body: "As Faire expanded its catalog to over 100,000 brands, independent makers report declining organic search visibility and intensified competition from mass-produced lines. Fee stacking—comprising 15% commissions, $10 new-account fees, and payment processing—creates margin pressure that incentivizes mature suppliers to explore direct channels."
    claimRefs:
      - "CU001"
      - "CU007"
      - "CU010"
