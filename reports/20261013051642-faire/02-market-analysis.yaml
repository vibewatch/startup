callouts:
  - calloutType: insight
    title: Underwriting and Discovery Convergence Accelerates Marketplace Liquidity
    body: >-
      Faire decisive breakthrough was coupling catalog recommendation algorithms with integrated credit underwriting. By
      financing Net 60 terms and absorbing default risk, Faire unlocked purchasing velocity from cash-constrained
      boutique owners who previously could not afford trial orders with unfamiliar makers.
    claimRefs:
      - CM001
      - CM003
      - CM009
  - calloutType: risk
    title: B2B Disintermediation and Margin Compression Incentives
    body: >-
      The fundamental vulnerability of B2B marketplaces is off-platform migration. Once buyer-supplier trust is
      established, the ongoing 15% reorder take rate creates economic friction that incentivizes direct ordering or
      white-label portal adoption, especially among scaling high-volume brands.
    claimRefs:
      - CM004
      - CM005
      - CM011
      - CM014
  - calloutType: assumption
    title: Independent Boutique Viability Underpins Long-Term SAM Expansion
    body: >-
      Faire long-term addressable market growth assumes the continued economic vitality and foot-traffic relevance of
      independent brick-and-mortar storefronts in North America and Europe, countering big-box consolidation and
      direct-to-consumer e-commerce encroachment.
    claimRefs:
      - CM001
      - CM007
      - CM010
