company:
  name: X Square Robot
chapter:
  number: 6
  title: Customers
  summary: >-
    X Square Robot has moved beyond isolated demonstrations into company-reported home-service,
    household-residency, and live logistics deployments, with secondary reporting also naming SF
    Express and an unnamed German luxury automaker supply line. The public record is still
    insufficient to establish retention, contract economics, paid conversion, or customer
    concentration, so the evidence supports early adoption rather than durable commercial traction.
sections:
  - id: customer-segments
    title: Customer segments and buying surfaces
    body: >-
      Public evidence points to a deliberately broad customer surface rather than a single proven
      beachhead. The clearest payer and channel relationship is the company-reported 58.com
      cleaning service in Shenzhen and Beijing, where robots work alongside professional cleaners
      in residential visits. Secondary reporting also says the company was already generating
      revenue from schools, hotels, and retirement homes, while a January company release described
      deployment across manufacturing, autonomous logistics, and senior healthcare. This mix spans
      consumer-service channels, institutional buyers, and industrial operators, but it does not
      reveal which segment contributes the most revenue or repeat demand. The broad
      general-purpose positioning therefore creates optionality while leaving the initial
      commercial wedge and payer economics unresolved.
    claimRefs: [CU001, CU009, CU010, CU011]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and operating evidence
    body: >-
      The strongest trajectory evidence is dated operational activity rather than account or
      revenue growth. X Square says its 58.com service began in March 2026 and its extended
      household-placement program began in May; an independent industry report later described
      nearly 1,000 households served, but did not define whether these were paid customers,
      completed visits, or program participants. Logistics evidence is more measurable:
      third-party summaries repeat a company-reported August 12 rate of 1,816 parcels per hour at
      more than 98% accuracy, and the company later reported 10,000 parcels sorted in 5 hours,
      14 minutes, and 1 second at WRC. These metrics demonstrate task endurance under public test
      conditions, not customer retention or unit economics.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named deployment proof
    body: >-
      Named proof is uneven. The 58.com relationship is corroborated by two company-issued sources
      and is described as an active robot-plus-human cleaning service, making it the strongest
      identifiable commercial channel in the retained evidence. Embodied Global separately reports
      parcel sorting with SF Express and automotive-parts supply-line work for an unnamed German
      luxury OEM, but no customer-issued announcement or procurement record was retained for either
      deployment. Household residency participants are real-world users but remain an unnamed
      cohort. The resulting evidence establishes field exposure across home and industrial
      settings, while leaving production scope, contract status, deployment duration, and customer
      acceptance largely dependent on company or secondary accounts.
    claimRefs: [CU001, CU002, CU008, CU014]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration
    body: >-
      The retained public corpus does not report NRR, GRR, churn, renewal rates, contract duration,
      paid conversion, contract values, or revenue concentration. That absence is a limitation of
      the reviewed evidence, not proof that the company lacks repeat usage. X Square argues that
      real-world deployments create a feedback loop in which operating data improves the model,
      which could support land-and-expand if better performance lowers deployment friction.
      However, a skeptical independent review still asks for third-party evidence on cross-robot
      transfer and long-horizon home tasks. Until customer references, cohort data, and contract
      schedules are available, the investment case should treat deployment breadth as validation
      activity and not as evidence of durable recurring demand.
    claimRefs: [CU012, CU013, CU015, CU016]
