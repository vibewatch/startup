figures:
  - id: FU001
    title: Deployment-to-expansion learning loop
    type: journey-map
    summary: >-
      Public evidence shows a path from channel access to field operation and model learning, but
      the commercial expansion step remains unquantified.
    data:
      nodes:
        - label: Channel entry
          detail: 58.com provides a route into paid residential cleaning visits.
          touchpoints:
            - Partnership launch
            - Shenzhen and Beijing service coverage
        - label: Assisted deployment
          detail: Robots work alongside professional cleaners in real homes.
          touchpoints:
            - Human-in-the-loop service
            - Household environment exposure
        - label: Extended household use
          detail: The X Family Member Program places robots with families for up to one month.
          touchpoints:
            - Everyday household tasks
            - Longer interaction window
        - label: Industrial operation
          detail: The company describes a live parcel-sorting line designed for continuous operation.
          touchpoints:
            - Variable parcels
            - Public endurance challenge
        - label: Operating-data feedback
          detail: X Square says deployment data feeds model improvement and faster iteration.
          touchpoints:
            - Data collection
            - Model iteration
        - label: Expansion decision
          detail: Broader rollout depends on verified reliability, repeat demand, and contract economics.
          touchpoints:
            - Customer renewal
            - Multi-site or multi-task expansion
            - Concentration monitoring
    approximationNotes: >-
      The sequence is an analytical synthesis of the company's stated feedback loop and observed
      deployment surfaces; it does not imply measured conversion rates or disclosed contract stages.
    claimRefs: [CU001, CU002, CU004, CU007, CU016]
callouts:
  - calloutType: strength
    title: Real-world exposure is broader than a lab-only program
    body: >-
      The retained evidence includes home visits, extended household placements, a live sorting
      line, and public logistics endurance tests across multiple 2026 dates.
    claimRefs: [CU001, CU002, CU004, CU005, CU006, CU007]
  - calloutType: risk
    title: Deployment breadth is not retention proof
    body: >-
      No retained source discloses renewal, churn, cohort retention, contract duration, customer
      concentration, or paid conversion, and most named proof is company-issued or secondary.
    claimRefs: [CU012, CU013, CU014, CU015]
