      - ["QUANTA hardware", "Not publicly stated in allocated sources", "Contact distributor / vendor", "Wheeled dual-arm robot platform", "No list price, discount, warranty or delivery terms"]
      - ["Deployment services", "Priced per engagement according to supplier listing", "Project or service engagement", "Integration and deployment support", "No realized price, duration, SLA or renewal evidence"]
      - ["Internal build / incumbent workflow", "Buyer-specific; unavailable", "Capex, labor, software and integration mix", "Alternative path to the same workflow", "No comparable total-cost benchmark in allocated sources"]
    notes: >-
      The only retained pricing description is a company-aligned supplier listing. It does not
      establish realized customer pricing, revenue, margins, discounts, or total cost of
      ownership.
    claimRefs: [CP009]
