    notes: >-
      "Documented" means present in a retained source, not independently benchmarked. Unknown
      cells were not supported by the assigned prefetched evidence and are not negative
      assessments.
    claimRefs: [CP003, CP004, CP005, CP006, CP007, CP013, CP015]
  - id: "TP003"
    title: "Pricing and packaging evidence"
