schemaVersion: "report-v2"
artifact: financials
slug: x-square-robot
runDate: "2026-10-21"
company:
  name: X Square Robot
chapter:
  number: 4
  title: Financials
  summary: >-
    X Square Robot has demonstrated access to strategic capital and disclosed one
    household-service price point, but the retained evidence does not disclose recognized
    revenue, ARR, gross margin, cash, burn, or runway. The financial case therefore rests
    on unverified commercialization and margin assumptions for a capital-intensive
    full-stack model, data, hardware, and deployment strategy.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization evidence
    body: >-
      Public evidence indicates several possible monetization paths but does not establish
      their revenue mix or accounting treatment. An independent report describes a
      58 Daojia "robot + human" household-cleaning service priced at RMB 149 for three
      hours and says nearly 1,000 households had participated in month-long robot
      residencies. The same report identifies deployments with a German luxury automotive
      OEM and SF Express, while company-issued material describes activity across
      manufacturing, logistics, and senior-care services. These disclosures support a
      service-and-deployment go-to-market motion, potentially supplemented by robot
      hardware, yet none provides contract value, realized price, recurring share,
      utilization, renewal, or revenue-recognition terms. The official research-page text
      offers a contact-sales route rather than a public price list, so enterprise and
      model-layer monetization remain private diligence items.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI012]
    tableRefs: [TI001, TI002]
  - id: cost-and-unit-economics
    title: Cost structure and unit-economics limits
    body: >-
      X Square's vertically integrated design broadens the likely cost base. Company-issued
      accounts describe foundation-model research, a proprietary model-driven data
      pipeline, robotics hardware, real-world deployment, and in-house robotic arms, joint
      modules, and controllers. Those activities imply concurrent spending on compute and
      model development, data capture, component engineering, inventory or manufacturing,
      field operations, support, and deployment labor. Public sources do not quantify any
      of those cost pools, nor do they disclose hardware bill of materials, service labor
      per job, utilization, warranty expense, gross margin, contribution margin, CAC,
      sales-cycle length, or payback. The RMB 149 household-service price is therefore a
      monetization signal, not proof of profitable unit economics; without service-delivery
      cost and robot utilization, it cannot be converted into revenue quality or margin.
    claimRefs: [CI003, CI005, CI006, CI008, CI011, CI012, CI013]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      Financing access is the clearest financial strength, but it should not be confused
      with liquidity. Company-issued and independent accounts report a roughly US$140
      million Series A++ and later financings that placed the company's valuation above
      RMB 20 billion, while the company said proceeds would fund core technologies and
      foundational research. The retained evidence does not disclose how much cash was
      received in the later rounds, current cash, monthly burn, debt, project-finance
      obligations, working-capital needs, or runway. The rapid financing cadence and
      strategic investor base can extend access to capital, but the full-stack operating
      model also creates continuing funding demands before commercialization is proven.
      Underwriting should therefore model the valuation as a pricing signal and funding
      raised as historical financing, not as cash presently available.
    claimRefs: [CI001, CI002, CI003, CI011, CI014]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The financial profile is promising on capital access but presently ununderwritable
      on operating performance. One independent commentary explicitly cautions that the
      hardware remains fragile, models can produce surprising errors, and large-scale
      deployment economics are unproven. That warning is consistent with the evidence
      gaps: no recognized revenue or ARR, no gross or contribution margin, no customer
      concentration, no renewal or cancellation data, no sales-efficiency measures, and no
      cash or runway disclosure. The investment case requires primary evidence showing
      whether paid deployments generate repeatable revenue and whether hardware, service,
      data, and compute costs decline with scale. Until management supplies audited
      financials, contract cohorts, unit-cost bridges, and a current liquidity schedule,
      revenue quality, margin path, and capital adequacy remain material blockers rather
      than quantities that can be responsibly estimated.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Revenue quality
      - Diligence ask
    rows:
      - - Household cleaning service
        - Robot plus human service through 58 Daojia
        - Three-hour service session
        - RMB 149 public service price; nearly 1,000 households reported served
        - Public activity signal; realized revenue and repeat rate unknown
        - Provide bookings, cancellations, repeat cohorts, robot utilization, labor cost, and revenue recognition
      - - Industrial deployment
        - Robot deployment into customer workflows
        - Robot, site, project, or service contract
        - German luxury OEM supply-line and SF Express parcel-sortation deployments reported
        - Named use cases but no contract economics
        - Provide signed contracts, paid units, deployment milestones, renewals, and customer concentration
      - - Robot hardware
        - Quanta systems and in-house components
        - Robot or component
        - Products and mass-production intent disclosed; transaction price and volume absent
        - Potentially lumpy and hardware-margin exposed
        - Provide list and realized ASP, bill of materials, warranty reserve, backlog, and delivery acceptance
      - - Model, data, and platform
        - Foundation-model or data-pipeline access
        - License, API, subscription, or bundled capability
        - Technical stack disclosed; no paid commercial model disclosed
        - Monetization status unverified
        - Provide pricing, paid customers, usage basis, hosting cost, contract term, and deferred-revenue policy
    notes: >-
      Partial public snapshot as of 2026-10-21; reported deployments and list/service
      pricing do not establish recognized revenue, recurring mix, or realized margins.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering
      - Price / unit / contract
      - List versus realized
      - Discounts and unknowns
      - Source interpretation
    rows:
      - - 58 Daojia household cleaning
        - RMB 149 per three hours
        - Public service price; realized company share undisclosed
        - Human-labor allocation, promotions, repeat rate, and channel take rate unknown
        - Evidence of a priced service, not evidence of company revenue or contribution margin
      - - Enterprise robot deployment
        - Not publicly disclosed
        - No list or realized price in retained evidence
        - Hardware, integration, support, pilot discounts, and acceptance terms unknown
        - Deployments are reported, but paid status and contract value are not established
      - - Model, software, or data access
        - Not publicly disclosed
        - Official retained text directs users to contact sales
        - Licensing basis, API usage, bundling, support, and hosting terms unknown
        - No public evidence of a standalone recurring software price
    notes: >-
      Only the RMB 149 household-service price is public in the retained evidence; all
      enterprise and model-layer economics require contract-level confirmation.
    claimRefs: [CI007, CI008, CI009, CI010, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Recognized revenue and ARR
        - Not disclosed
        - High confidence that retained sources do not provide it
        - Establishes commercial scale and recurring revenue quality
        - Obtain audited statements and monthly recognized-revenue and ARR bridges by stream
      - - Gross and contribution margin
        - Not disclosed
        - High confidence that retained sources do not provide it
        - Tests whether hardware and field-service delivery can support attractive economics
        - Obtain margins by robot, service job, deployment, software, and customer cohort
      - - CAC, sales cycle, and payback
        - Not disclosed
        - Medium
        - Measures enterprise GTM efficiency and financing needs
        - Obtain funnel conversion, sales-cycle distribution, fully loaded CAC, and payback by segment
      - - Capex, inventory, and working capital
        - Not disclosed
        - Medium
        - Full-stack hardware and deployment may consume cash before customer acceptance
        - Obtain inventory aging, capex schedule, supplier terms, deposits, and acceptance-linked collections
      - - Cash, burn, debt, and runway
        - Not disclosed
        - High confidence that retained sources do not provide it
        - Determines next-round timing and downside resilience
        - Obtain current cash, restricted cash, monthly net burn, debt schedule, commitments, and downside runway
    notes: >-
      Null values mean the metric is absent from the eight retained sources, not zero;
      confidence describes disclosure assessment rather than economic performance.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence traces financing into a full-stack cost base and deployments, but
      the final revenue and gross-profit conversion remains undisclosed.
    data:
      nodes:
        - id: financing
          label: Strategic financing
          value: Four recent rounds
          detail: Valuation exceeded RMB 20 billion; later-round cash proceeds were not disclosed.
        - id: research
          label: Model and data R&D
          value: Funding use disclosed
          detail: Company says capital supports core technology and foundational research.
        - id: hardware
          label: Hardware and components
          value: In-house stack
          detail: Arms, joint modules, controllers, and Quanta robots broaden the cost base.
        - id: deployment
          label: Field deployment
          value: Household and industrial
          detail: Public examples include 58 Daojia, an automotive line, and SF Express.
        - id: customer-activity
          label: Customer activity
          value: RMB 149 / 3 hours
          detail: The disclosed household-service price is not the company's realized revenue.
        - id: economics
          label: Revenue and gross profit
          value: Not disclosed
          detail: Revenue mix, recognition, gross margin, and contribution margin remain unavailable.
    approximationNotes: >-
      This is an evidence sequence, not a quantified waterfall; no conversion rates,
      revenue amounts, or cumulative cash balances are inferred.
    claimRefs: [CI002, CI003, CI005, CI006, CI008, CI009, CI011, CI013, CI014]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The disclosed valuation and financing events demonstrate investor access but do not
      reveal cash received, cash remaining, burn, debt, or the next financing trigger.
    claimRefs: [CI001, CI002, CI003, CI011, CI014]
  - calloutType: recommendation
    title: Gate underwriting on primary financial evidence
    body: >-
      Require audited statements, contract cohorts, unit-cost bridges, and a current
      liquidity schedule before assigning revenue, margin, or runway assumptions.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
