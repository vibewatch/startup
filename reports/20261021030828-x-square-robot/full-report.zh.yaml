  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场比“所有机器人”或“所有人工智能”都窄。X Square Robot 瞄准的是全栈具身
              AI：基础模型、操控硬件、数据采集系统和真实部署必须协同工作。因此，纳入范围包括可适配的机器人系统、配套软件与数据基础设施，以及固定自动化无法应对物理变化的工作流部署。排除范围包括不采用具身技术栈的传统单用途工业自动化、纯数字
              AI
              和广义消费电子。现状替代方案也不只是另一台机器人，还包括人工编程设备、人力以及人机混合服务。这一边界很重要：公司的通用化愿景横跨多个相邻市场，但可变现需求的证据仍集中于具体工作流和试点，而非经过测算的品类总额。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM010
              - CM014
      - number: '2.2'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              指定的 8 个来源都没有提供带公开方法论的出版方 TAM、SAM、SOM 或市场 CAGR。因此，最可靠的测算视角是自下而上、以运营为基础。物流方面，公司披露实时分拣导入演示达到每小时 1,816 件、准确率超过
              98%。数据采集方面，报道描述每小时近 100 次演示，效率超过传统遥操作的两倍。专业媒体还报道家庭服务价格为 3 小时 149 元人民币，服务过近 1,000
              户家庭，但没有披露复购、贡献利润率，或该家庭数对应的分母和期间。这些数字说明工作流可能具备价值并出现采用信号，但不能与市场收入、ARR 或可服务市场规模互换。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM013
