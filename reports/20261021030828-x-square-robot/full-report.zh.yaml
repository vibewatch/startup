    summary: 公开证据显示了从渠道接入到现场运营和模型学习的路径，但商业扩张环节仍未量化。
    data:
      nodes:
        - label: 渠道进入
          detail: 58.com 提供进入付费住宅清洁服务的路径。
          touchpoints:
            - Partnership launch
            - Shenzhen and Beijing service coverage
        - label: 辅助部署
          detail: 机器人在真实家庭中与专业清洁人员协同工作。
          touchpoints:
            - Human-in-the-loop service
            - Household environment exposure
        - label: 延长家庭使用
          detail: X Family Member Program 把机器人放进家庭，最长使用一个月。
          touchpoints:
            - Everyday household tasks
            - Longer interaction window
        - label: 工业运营
          detail: 公司描述了一条为持续运营而设计的实时包裹分拣产线。
          touchpoints:
            - Variable parcels
            - Public endurance challenge
        - label: 运营数据反馈
          detail: X Square 称部署数据会反馈给模型改进和更快迭代。
          touchpoints:
            - Data collection
            - Model iteration
        - label: 扩张决策
          detail: 更大范围铺开取决于已核实的可靠性、重复需求和合同经济性。
          touchpoints:
            - Customer renewal
            - Multi-site or multi-task expansion
            - Concentration monitoring
    approximationNotes: 这一序列综合分析了公司所述反馈闭环和已观察到的部署面；不代表实测转化率或已披露的合同阶段。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU007
      - CU016
  - id: FR001
    title: 风险热力图：剩余暴露与缓释成熟度
    type: matrix
    summary: 序数评估优先关注生产可靠性、安全保障和单位经济性，因为这些方面的公开缓释证据最弱。
    data:
      columns:
        - label: 可能性
          detail: 分析用序数判断，不是实测概率。
        - label: 影响
          detail: 对部署、经济性或投资结果的潜在影响。
        - label: 缓释成熟度
          detail: 指定来源集中有公开证据支持的控制成熟度。
      rows:
        - label: 生产可靠性
          note: 仍需要独立的长周期和跨机器人证据。
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 早期
              tone: warning
        - label: 物理安全与隐私保障
          note: 认证、事故历史和隐私控制均未建立。
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: negative
            - label: 未披露
              tone: negative
        - label: 单位经济性
          note: 公开定价证据仍远高于所述家庭目标。
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 未披露
              tone: negative
        - label: 融资与估值
          note: 多次融资不能证明资金可支撑期限或价格有支撑。
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: negative
            - label: 已募资；资金期限未知
              tone: warning
        - label: 渠道集中度
          note: 58.com 是可见的家庭渠道；集中度未知。
          values:
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
            - label: 一个具名渠道
              tone: warning
        - label: 配置与供应链
          note: 有报道称按季度迭代，但 BOM 冗余不公开。
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: negative
            - label: 可按要求提供数据表
              tone: warning
    approximationNotes: 定性标签综合了留存的公开证据和明确缺口；它们不是事故频率、概率或基准分数。
