              - CP009
      - number: '3.4'
        title: 护城河持续性与替代风险
        blocks:
          - type: paragraph
            body: >-
              垂直整合可能缩短迭代周期，因为 X Square 称其在内部开发模型、数据管线、机械臂、关节模组、控制器和机器人平台。开源分发也可能扩大生态覆盖，已披露的 2,000
              小时开放数据集则给开发者提供了可测试的具体材料。反面是商品化：开放模型会降低买方锁定，战略 incumbent
              可资助竞争技术栈，买方自控集成也能替代单一供应商套餐。更重要的是，指定的独立批评要求第三方开展跨机器人和长周期测试。在获得比较可靠性、安全性、部署规模和留存数据前，这一护城河只能视为可能存在的数据与执行飞轮，而非已证明的持久优势。
            claimRefs:
              - CP006
              - CP007
              - CP011
              - CP012
              - CP015
