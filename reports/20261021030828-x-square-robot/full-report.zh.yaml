      - number: '4.2'
        title: 成本结构与单位经济性边界
        blocks:
          - type: paragraph
            body: >-
              X Square
              的垂直整合设计扩大了可能的成本基数。公司材料描述基础模型研发、专有模型驱动数据管线、机器人硬件、真实部署，以及自研机械臂、关节模组和控制器。换句话说，计算和模型开发、数据采集、零部件工程、库存或制造、现场运营、支持和部署人工都要同时投入。公开来源没有量化任何成本池，也未披露硬件
              BOM、单次服务人工、利用率、保修费用、毛利率、贡献利润率、CAC、销售周期或回收期。因此，149 元家庭服务价格只是变现信号，不是盈利单位经济性的证明；没有交付成本和机器人利用率，就无法推导收入质量或利润率。
