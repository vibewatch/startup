      - number: '3.2'
        title: 能力、开放性与数据地位
        blocks:
          - type: paragraph
            body: >-
              最清晰的差异化论点，是开放模型层与专有数据、部署基础设施之间的联动。X Square 称 QUANXTA Zero 覆盖采集、同步、清洗、标注、训练、推理和评估；公司还披露每小时近 100
              次演示、效率为传统遥操作的 2.33 times、数据产出率最高 85%。MechaFeed 将开放技术栈称为可信的研究平台，但指出许多定量证据仍来自 X Square
              自有机器人和基准测试。这种组合可以吸引开发者，同时保留运营诀窍；但公开开放本身不能证明持久的跨机器人表现或专有数据优势。
            claimRefs:
