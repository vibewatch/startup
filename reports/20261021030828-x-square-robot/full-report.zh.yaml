      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公司公告称 2026 年 1 月完成约 US$140 million A++ 轮；独立报道后来称自 2026 年 4 月起完成 B 轮至 C 轮的 4 轮融资，投后估值超过 RMB 20
              billion。投资者名单具有战略意义，但投资者质量不能替代价格发现或单位经济性。现有融资来源均未披露出售的股权比例、清算优先权、受偿顺序、反稀释权、董事会权利、期权池处理或类债务权利。因此，入场纪律要求完整股权结构表和融资文件、从融资所得到账现金的桥接，以及与已确认商业表现挂钩的估值基准。没有这些资料，公开估值只是背景，不是新投资者能获得可接受回报的证据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 正论、反论与商业化证明
        blocks:
          - type: paragraph
            body: >-
              正论是：垂直整合的模型、数据和硬件栈可以在部署反馈中复利，开放仓库扩大外部试验，战略投资者则改善分销和工业伙伴获取。反论是：公开技术和部署声明仍由公司或宣传渠道主导。独立评论特别指出，大部分定量证据来自 X
              Square Robot
              自有机器人和基准测试，并要求第三方开展跨机器人、长周期测试。已披露的家庭和工业活动令人鼓舞，但没有披露合同金额、重复使用、留存、取消、集中度或利润率。如果性能能被独立复现、并有客户队列商业证据，判断会改善；如果所谓部署无法转化为可重复且盈利的需求，判断会恶化。
            claimRefs:
              - CV004
