      - number: '8.4'
        title: 情景、可比公司与退出准备度
        blocks:
          - type: paragraph
            body: >-
              情景应被视为承销条件，而不是数字价格目标。现有资料没有经审计财务数据、真正可比机器人公司的交易条款，也没有足以支持收入倍数的证据。乐观情景要求技术迁移经独立验证、商业订单重复、硬件经济性改善，且融资条款为普通股留下可观上行空间。基准情景假设技术继续进步，但规模化经济性证明延迟，使当前估值难以承销。悲观情景则是重复需求弱、部署昂贵或融资优先权叠加估值压缩。退出准备度尚未证明：IPO
              或战略出售需要治理、经审计结果、客户质量、监管准备和可信买方或公开可比框架，而现有证据都没有提供。
