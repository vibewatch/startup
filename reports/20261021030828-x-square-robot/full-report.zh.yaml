            title: 独立竞争证明仍然薄弱
            body: 最有力的怀疑性来源指出，定量证据仍集中在公司自有机器人和基准测试上；指定资料无法证明比较可靠性、安全性、定价、胜率或切换行为。
            calloutType: risk
            claimRefs:
              - CP007
