      - number: '3.3'
        title: 商业包装与分销
        blocks:
          - type: paragraph
            body: >-
              公开证据对演示广度的支撑强于对商业条款的支撑。供应商页面称 WALL-OSS
              对开发者免费，服务按项目定价，并要求硬件买方索取当前价格；指定来源没有披露实际硬件价格、合同期限、折扣、支持费或毛利率。公司发布的会议报道显示其在多个机器人平台上执行家庭任务，并演示 5 小时 14 分 1
              秒分拣 10,000 件包裹；Wikipedia 则概述了从深圳扩展到北京的 58.com 清洁服务。这些信号说明存在进入市场的路径，但不能证明重复需求、渠道经济性或竞争胜率。
            claimRefs:
              - CP009
              - CP013
              - CP014
              - CP016
          - type: table
            tableRef: TP003
