      - - 正面论点
        - 开放模型和数据集活动，为外部测试和开发者采用留下了入口。
        - 需要看到独立复现、持续的外部使用，以及开发者活动转化为商业价值的证据。
      - - 正面论点
        - 公司及第三方报告都描述了家庭、物流和工业场景活动。
        - 提供具名合同、预订批次、续约数据、部署成本和客户集中度。
      - - 反面论点
        - 大部分量化技术证据仍由公司自行生成。
        - 独立的跨机器人、长周期测试，并披露失败模式，才能缓解这一担忧。
      - - 反面论点
