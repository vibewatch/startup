  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与决策立场
        blocks:
          - type: paragraph
            body: >-
              证据支持“继续研究”，而不是投资或放弃的决定。战略支持、连续融资、活跃的模型发布和公司披露的部署广度，证明 X Square Robot 是严肃的具身 AI 平台，而非概念项目。但这些并不能证明 RMB 20
              billion
              以上估值对应有吸引力的风险调整后入场点。公开证据缺少已确认收入、经常性收入、毛利率、烧钱、现金、续航、持股、优先权和稀释数据。因此，判断既取决于价格，也取决于尽调：融资和技术活动可观察，信心为中等；但投资回报判断所需变量仍在私域，风险很高。在这些输入可得前，不应给出目标回报、持有期或退出价值。
