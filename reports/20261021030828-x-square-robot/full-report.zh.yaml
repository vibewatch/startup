chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              X Square Robot 是一家总部位于深圳、于 2023 年 12 月成立的机器人公司。它的核心并非单一用途机器：公司将 WALL
              定义为融合感知、决策和操控的具身基础模型家族，第三方资料则将其描述为覆盖模型、专有数据管线、轮式双臂硬件和部署的更大技术栈。这种纵向覆盖是商业论点的核心，因为现场活动可以为模型迭代提供数据，模型需求也能反过来塑造硬件设计。但它同样加重执行负担：架构自洽不等于具备量产经济性、可靠性或可重复的商业需求。因此，公开信息对公司身份、技术方向和融资阶段的支撑最强，对收入、客户和人员规模的支撑最弱。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: 创始人集中度与资本结构
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据集中在创始人兼 CEO Wang Qian 身上。现有资料无法确认更完整的高管名单、董事会构成、表决权或继任安排，关键人物和治理尽调因此仍未解决。资本形成情况则清晰得多。公司 2026 年 1
              月公告披露约 US$140 million 的 A++ 轮，随后在 4 月至 6 月间披露 B 轮、B+ 轮、B++ 轮和 C 轮融资。6 月一轮据报投后估值超过 RMB 20
              billion。资料提到多家重要战略和财务投资方，但投资者数量和品牌影响力都无法说明控制权、清算优先权、持股集中度、债务敞口或现有现金。融资记录证明公司能获得资本，不能替代股权结构表和资金数据。
