      - CR009
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证明缩小了不确定性，但尚未把报道估值与可据此评估的回报连接起来。
    data:
      nodes:
        - id: capital
          label: 战略资本
          value: Multiple reported rounds and broad backing
          detail: 融资证明投资人有兴趣，但不能证明入场经济性。
        - id: technical
          label: 技术活动
          value: Active models, datasets, and open releases
          detail: 开放产物提供了复现入口，但不能证明商业价值。
        - id: deployment
          label: 部署主张
