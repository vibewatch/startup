        blocks:
          - type: paragraph
            body: >-
              融资渠道是最明确的财务优势，但不能与流动性混为一谈。公司和独立资料披露约 US$140 million A++ 轮及后续融资，使公司估值超过 RMB 20
              billion；公司称资金将用于核心技术和基础研究。现有证据没有披露后续轮次实际到账金额、当前现金、月度烧钱、债务、项目融资义务、营运资金需求或续航。快速融资节奏和战略投资者基础可以延长资本获取能力，但在商业化获证前，全栈运营模式仍会持续消耗资金。因此，投资判断应把估值视作定价信号，把已募资金视作历史融资，而不是当前可用现金。
