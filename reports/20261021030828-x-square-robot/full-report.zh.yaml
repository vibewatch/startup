      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方随工作流变化。物流和制造部署可能由运营或自动化负责人推动，并从生产力或资本预算中支付，前线操作员则是用户。在家政服务中，已披露的 58 Daojia
              安排指向渠道主导的服务模式：家庭为结果付费，服务平台协调机器人和人工交付。养老场景中，运营方是买方，护理人员和居民是用户。各细分市场的采用路径应从技术演示走向付费试点、重复部署和车队扩张。指定证据只证明前两个阶段的案例，不能证明合同金额、续约、利用率、客户集中度，或维护和停机风险由谁承担。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM010
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              包裹导入、家庭清洁和照护机构任务等劳动密集且变化多的工作流支撑需求；在这些场景中，固定顺序自动化容易失灵。如果学习成果能实际迁移，共享的模型与数据栈还可把开发成本分摊到多个垂直领域。但约束同样重大：物理数据采集成本高，生产环境要求可靠性和集成能力，家庭场景还增加信任、安全、隐私和服务质量负担。Mechafeed
              特别指出，大部分定量证据仍来自 X Square Robot
              自有机器人和基准测试，并要求第三方进行跨机器人、长周期验证。全栈机器人公司获得集中资本，只能证明投资者兴趣，不能证明终端市场规模。因此，在给予平台型倍数前，估值论证应要求独立复现、付费重复部署、可量化客户 ROI
              和单位经济性。
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 市场规模证据尚不足以支持决策
            body: 现有来源没有提供有方法论支撑的 TAM、SAM、SOM 或 CAGR。融资估值、部署公告和基准吞吐量不能替代市场收入或客户需求。
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
          - type: callout
            title: 工作流经济性是闸门证据
            body: 近期最重要的尽调路径，是在已点名的物流、家政、制造和照护工作流中核实付费重复部署、正常运行时间、利用率、客户节省的人力成本和服务贡献利润率。
            calloutType: insight
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              X Square Robot 提供融合基础模型、机器人硬件、数据系统和商业部署的全栈方案，而独立摘要将 WALL、QUANTA、ArtiXon 和 QUANXTA
              列为不同产品家族。因此，竞争范围比轮式人形机器人同行更广：买方可以采购全栈方案、在其他硬件上采用开放模型、内部搭建集成层，或继续使用固定自动化和人工。一份供应商撰写的比较将 Galbot 定义为零售导向、UniX
              AI 定义为家庭硬件导向，但没有提供可审计的同行指标。这些定位只能作为方向参考，缺乏支持的单元格仍应保持未知，不能被改成排名。
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
