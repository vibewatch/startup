  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 独立技术迁移成功；重复预订和企业续约出现；硬件经济性改善。
        - 只有经核实的增长和利润率在当前私募估值之上留下空间，溢价才可能站得住。
        - 执行速度、资本密集度、安全和优先权负担。
        - 独立基准测试加经审计的商业客户批次。
      - - 基准
        - 技术发布继续，但可规模化的单位经济性和重复需求仍未证实。
        - 维持“继续研究”判断；不要以报道的 RMB 20 billion 估值为回报锚点。
        - 商业化延迟和进一步稀释。
        - 部署增加，但留存率或利润率未披露。
      - - 悲观
        - 重复需求令人失望，部署仍高度依赖人力或资本，或融资条款让新普通股处于次位。
        - 预计估值将明显压缩，或出现下轮融资；仅凭公开数据无法量化下行空间。
        - 流动性、优先股堆叠、集中度和技术表现不佳。
        - 客户批次疲弱、第三方复现失败或惩罚性融资条款。
    notes: 这是有条件的情景框架，不是预测；由于证据缺乏经审计的运营数据和可比交易条款，未赋予概率百分比或估值区间。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
