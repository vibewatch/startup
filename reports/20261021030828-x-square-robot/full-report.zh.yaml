      - number: '1.3'
        title: 里程碑、部署信号与证据风险
        blocks:
          - type: paragraph
            body: >-
              里程碑序列显示扩张速度异常快：2025 年发布开放模型，2026 年 1 月完成大额融资，4 月推出 WALL-B，6 月前完成四轮融资，5 月开始家庭驻留，并在 2026
              年年中前后掀起更广泛的开放技术栈发布。资料还描述了其在家庭、工厂、物流、清洁和养老场景的部署。这些信号说明公司并非只停留在演示文稿里的机器人项目，但证据质量参差不齐。一份独立技术评测明确指出，大部分定量支持仍来自
              X Square
              自有机器人和基准测试，并要求在第三方硬件上复现。现有资料没有提供经审计收入、ARR、利润率、烧钱、现金、续航、员工数或定义一致的客户数。尽调应把这些缺口视为影响决策的未知项，而不是零值或缺失证据。
