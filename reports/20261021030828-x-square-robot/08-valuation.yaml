      missingEvidence: Full capitalization table, security terms, liquidation waterfall, board rights, debt, side letters, and pro forma dilution.
      whyItMatters: These terms determine whether a new investor participates in upside and how much downside protection or subordination exists.
      diligencePath: Obtain executed financing documents and model proceeds under base, down-round, and exit outcomes with company counsel.
      relatedQuestionRefs: [QV002, QV009]
    - type: private-evidence-only
      severity: material
      topic: operating-economics
      missingEvidence: Audited revenue recognition, bookings, gross margin, burn, cash, runway, working capital, and deployment-level contribution margin.
      whyItMatters: A business-model-appropriate valuation and capital-needs assessment cannot be built without operating economics.
      diligencePath: Review audited statements, monthly management accounts, bank statements, budget-to-actuals, and a board-approved financing plan.
      relatedQuestionRefs: [QV003, QV006, QV007]
    - type: missing-source
      severity: material
      topic: commercialization
      missingEvidence: Customer contracts, booking cohorts, repeat use, cancellations, retention, concentration, deployment costs, and realized customer outcomes.
      whyItMatters: Deployment announcements do not establish durable demand, pricing power, or scalable margin.
      diligencePath: Sample contracts and invoices, reconcile bookings to recognized revenue, and conduct reference calls across household and enterprise cohorts.
      relatedQuestionRefs: [QV004, QV006]
    - type: missing-source
      severity: material
      topic: comparables
      missingEvidence: A genuinely comparable public, private-round, or M&A set with matched business model, maturity, geography, growth, margin, and transaction terms.
      whyItMatters: Applying unmatched robotics multiples would create false precision around entry and exit values.
      diligencePath: Build a banker-reviewed comparable set after audited metrics are available and normalize for hardware, software, services, and financing preferences.
      relatedQuestionRefs: [QV007, QV008]
    - type: missing-source
      severity: material
      topic: technical-validation
      missingEvidence: Independent cross-robot transfer, long-horizon task, reliability, safety, and failure-mode results.
      whyItMatters: Company benchmarks and open artifacts do not establish deployment reliability or support a premium valuation by themselves.
      diligencePath: Commission independent testing on non-company hardware and review raw logs, interventions, failures, incidents, and reproducibility.
      relatedQuestionRefs: [QV005, QV008, QV010]
