    title: "Workflow and use-case evidence"
    columns: ["User job", "Current workflow evidence", "X Square solution", "Measurable public signal", "Limitation"]
    rows:
      - ["Household assistance", "Robots work with cleaners and are placed with participating households", "WALL-B-controlled mobile dual-arm manipulation", "Program launch and extended placements are publicly described", "No public retention, intervention, incident, or satisfaction series"]
      - ["Parcel sorting", "Live-line and conference sorting of varied parcels", "Vision-guided grasp, orient, correction, and sorting loop", "10,000 parcels in 5:14:01; company-stated 1,911 parcels/hour average", "No independent uptime, error-rate, or labor-substitution audit"]
      - ["Autonomous delivery", "Indoor and outdoor food-delivery route", "Quanta X1 uses the foundation model to navigate and manipulate", "Company says the robot handled wind, deformation, occlusion, and stalls", "No route denominator, intervention log, or replicated trial"]
      - ["Developer adaptation", "Train, fine-tune, serve, and evaluate an open checkpoint", "Wall-X code, LeRobot integration, WebSocket serving, and evaluation helpers", "Public code and named release history", "GPU/CUDA build burden and no published support SLA"]
    notes: "Benefits and performance are preserved as company-stated or secondary-reported; missing denominators are not converted into inferred success rates."
    claimRefs: [CE001, CE004, CE005, CE006, CE013, CE016]
  - id: "TE003"
    title: "Technology and operating architecture"
    columns: ["Layer / component", "Role", "Key dependency", "Principal risk"]
    rows:
      - ["Capture and validation", "Collect physical-interaction trajectories and replay candidate data", "Wearable rigs, UMI, robot access, and inspection loop", "Company-reported cost and validity metrics lack an external audit"]
      - ["World model", "Represent action-grounded events and support longer-horizon reasoning", "WALL-WM data quality and event definitions", "Cross-task predictive accuracy is not independently established"]
      - ["Action model", "Convert multimodal context into robot action chunks", "Wall-OSS checkpoints, tokenizer, embodiment configuration, and fine-tuning", "Transfer quality across non-X Square arms remains unproven"]
      - ["Training and runtime", "Train, evaluate, and serve model outputs", "PyTorch, CUDAExtension, FlashAttention, DMuon, LeRobot, and GPU configuration", "Build complexity, accelerator dependence, and operational support burden"]
      - ["Robot hardware", "Execute mobile bimanual and dexterous tasks", "In-house arms, joints, controllers, sensors, and wheeled platforms", "No public MTBF, certification set, incident log, or current production datasheet"]
    notes: "Architecture is reconstructed from the public repository and company or secondary descriptions; undocumented interfaces and controls remain open diligence items."
    claimRefs: [CE001, CE007, CE008, CE009, CE013, CE014, CE015]
