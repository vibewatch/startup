callouts:
  - calloutType: "risk"
    title: "External reproducibility is the key technical diligence test"
    body: >-
      Open code and public demos improve inspectability, but the reviewed record does
      not show an independent operator reproducing the headline transfer or long-horizon
      performance on non-X Square hardware with disclosed failure modes.
    claimRefs: [CE010, CE011, CE015]
