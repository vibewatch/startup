      - ["Data-capture stack", "Model-training and data-operations teams", "Teleoperation, exoskeleton, UMI, and robot-free capture methods described publicly", "Physical playback and a closed model-data-hardware loop", "Audited data provenance, collection cost, validity, and coverage by task"]
