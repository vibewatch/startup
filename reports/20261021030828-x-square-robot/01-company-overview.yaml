company:
  name: X Square Robot
chapter:
  number: 1
  title: Company Overview
  summary: >-
    X Square Robot is a Shenzhen embodied-AI company founded in late 2023 around
    a vertically integrated model, data, and robot stack. Its rapid progression
    to a June 2026 Series C valuation above RMB 20 billion is well reported, but
    audited economics, a complete governance roster, and independently reproduced
    operating benchmarks remain unavailable in the retained public evidence.
sections:
  - id: identity-and-business
    title: Identity, product, and operating model
    body: >-
      X Square Robot is a Shenzhen-based robotics company founded in December
      2023. Its core proposition is not a single-purpose machine: the company
      presents WALL as an embodied foundation-model family that combines
      perception, decision-making, and manipulation, while third-party coverage
      describes a broader stack spanning models, proprietary data pipelines,
      wheeled dual-arm hardware, and deployments. That vertical scope is central
      to the business thesis because field activity can generate data for model
      iteration and model requirements can shape hardware design. It is also an
      execution burden: evidence of a coherent architecture does not establish
      production economics, reliability, or repeatable commercial demand. The
      public snapshot is therefore strongest on identity, technical direction,
      and financing stage, and weakest on revenue, customer, and workforce scale.
    claimRefs: [CO001, CO002, CO004, CO005, CO012, CO013]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Founder concentration and capital structure
    body: >-
      Public leadership evidence centers on founder and CEO Wang Qian. The
      retained sources do not establish a broader executive slate, board
      composition, voting rights, or succession arrangements, leaving material
      key-person and governance diligence unresolved. Capital formation is much
      more visible. A January 2026 company release reported a roughly US$140
      million Series A++ round, followed by B, B+, B++, and Series C financings
      reported from April through June. The June round was reported above RMB 20
      billion post-money. Coverage identifies major strategic and financial
      backers, but neither the number of investors nor their brand strength
      reveals control rights, liquidation preferences, ownership concentration,
      debt exposure, or cash still available. The financing record demonstrates
      access to capital; it does not substitute for cap-table and treasury data.
    claimRefs: [CO003, CO006, CO007, CO008, CO009, CO010, CO016]
    tableRefs: [TO002, TO003]
  - id: milestones-and-evidence-risk
    title: Milestones, deployment signals, and evidence risk
    body: >-
      The milestone sequence shows unusually fast expansion: an open model
      release in 2025, a large January 2026 financing, WALL-B in April, a
      four-round financing sequence through June, household placements beginning
      in May, and a broader open-stack publication wave by mid-2026. Coverage
      also describes deployments in homes, factories, logistics, cleaning, and
      eldercare. These signals make the company more substantive than a
      presentation-only robotics venture, yet their evidentiary quality is
      uneven. An independent technical review explicitly notes that much of the
      quantitative support still comes from X Square's own robots and benchmarks
      and calls for reproduction on third-party hardware. No retained source
      supplies audited revenue, ARR, margin, burn, cash, runway, headcount, or a
      consistently defined customer count. Diligence should treat those omissions
      as decision-relevant unknowns rather than zeros or evidence of absence.
    claimRefs: [CO006, CO007, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
