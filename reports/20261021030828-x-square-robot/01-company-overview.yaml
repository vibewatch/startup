    summary: >-
      X Square Robot moved from formation to open model releases, deployments,
      and a Series C valuation above RMB 20 billion in roughly two and a half years.
    data:
      items:
        - date: "December 2023"
          label: Company founded
          detail: X Square Robot was founded as a general-purpose embodied-AI company.
          tone: neutral
          claimRefs: [CO001]
        - date: "September 2025"
          label: WALL-OSS introduced
          detail: The company release dates the first open-source WALL family release to September 2025.
          tone: positive
          claimRefs: [CO012]
        - date: "January 2026"
          label: Series A++ financing
          detail: The company announced approximately US$140 million in Series A++ funding.
          tone: positive
          claimRefs: [CO006]
        - date: "April 2026"
          label: WALL-B unveiled
          detail: WALL-B was presented as a World Unified Model architecture for perception, reasoning, and action.
          tone: positive
          claimRefs: [CO011]
        - date: "April-June 2026"
          label: Four-round financing sequence
          detail: Reporting describes B, B+, B++, and Series C financings completed in rapid succession.
          tone: positive
          claimRefs: [CO007]
        - date: "May 2026"
          label: Household residency program
          detail: The X Family Member Plan began placing robots in homes for month-long residencies.
          tone: neutral
          claimRefs: [CO014]
        - date: "June 29, 2026"
          label: Series C valuation disclosed
          detail: The company announced a Series C valuation above RMB 20 billion.
          tone: positive
          claimRefs: [CO008]
        - date: "July-August 2026"
          label: Open-stack scrutiny broadens
          detail: Independent coverage reviewed the data, world-model, and action layers while calling for third-party reproduction.
          tone: warning
          claimRefs: [CO012, CO015]
    approximationNotes: >-
      Month or period labels are used where the retained sources do not provide
      a precise event day; the timeline does not imply that financing and product
      milestones are comparable in magnitude.
    claimRefs: [CO001, CO006, CO007, CO008, CO011, CO012, CO014, CO015]
callouts:
  - calloutType: strength
    title: Capital access validates strategic interest, not operating economics
    body: >-
      Consecutive rounds and participation from major technology investors
      establish strong financing access, while leaving revenue quality, burn,
      investor rights, and remaining liquidity unresolved.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
  - calloutType: risk
    title: Independent benchmark reproduction remains the evidence bottleneck
    body: >-
      Open releases improve inspectability, but the retained adverse review says
      quantitative support remains concentrated on company robots and benchmarks.
    claimRefs: [CO012, CO015]
