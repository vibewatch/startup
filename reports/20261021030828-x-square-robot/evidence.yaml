evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete executive roster, board membership, voting rights, and succession arrangements.
    whyItMatters: Founder concentration and board oversight cannot be assessed from one named executive.
    diligencePath: Request the organization chart, board minutes, shareholder agreement, and key-person succession plan.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: Audited revenue, ARR, gross margin, burn, cash, runway, customer count, and headcount.
    whyItMatters: Financing and deployment announcements cannot establish commercial scale or capital efficiency.
    diligencePath: Obtain audited financials, monthly management accounts, bank statements, customer ledger, and payroll roster.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: Full financing history, total capital raised, ownership, preferences, board rights, and debt or credit facilities.
    whyItMatters: Named investors and valuation do not reveal dilution, control, downside preferences, or usable liquidity.
    diligencePath: Request the fully diluted cap table, financing documents, debt schedule, and post-money cash reconciliation.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: benchmark-validation
    missingEvidence: Independent reproduction of WALL results on non-X Square hardware and long-horizon household tasks.
    whyItMatters: Company-controlled benchmarks cannot establish generalization, reliability, or field failure rates.
    diligencePath: Commission third-party evaluations with preregistered tasks, failure taxonomy, and raw run logs.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-size-gap
    missingEvidence: >-
      A current independent market series with explicit category boundary, geography, base year, forecast period, TAM or
      revenue value, and CAGR methodology.
    whyItMatters: >-
      Without a comparable market denominator, the chapter cannot defend TAM, SAM, SOM, penetration, or a market-growth
      valuation premium.
    diligencePath: >-
      Obtain the underlying tables and methodology from at least two independent robotics or industrial-automation
      market-data publishers and reconcile their category definitions.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Paid contract values, repeat-booking and renewal rates, utilization, cancellations, customer concentration,
      service gross margin, and deployment-level return on investment.
    whyItMatters: >-
      Demonstrations and household counts do not establish durable demand, budget conversion, or attractive unit
      economics.
    diligencePath: >-
      Review anonymized contracts, invoices, cohort data, deployment P&Ls, and customer references for the logistics,
      home-service, manufacturing, and care deployments.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: external-validation
    missingEvidence: >-
      Independent cross-robot replication, long-horizon task completion, uptime, failure-mode, and safety results in
      production-like environments.
    whyItMatters: Company benchmarks may not transfer across hardware or persist under real-world workload variability.
    diligencePath: >-
      Commission reference tests on non-X Square hardware and obtain third-party production benchmark logs with workload
      definitions and intervention rates.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: peer-scale
    missingEvidence: >-
      Independent, current, like-for-like data on Galbot, UniX AI, other direct peers, installed units, funding, target
      segments, and customer deployments.
    whyItMatters: >-
      Without comparable peer scale, the analysis cannot establish relative market position or whether X Square leads on
      commercial adoption.
    diligencePath: >-
      Obtain direct peer disclosures, customer procurement records, and independent market datasets with consistent
      definitions and periods.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized hardware prices, discounts, services fees, support terms, contract duration, renewal structure, and total
      deployment cost.
    whyItMatters: List or contact-only pricing cannot support buyer-economics, competitive-win, or margin comparisons.
    diligencePath: Request anonymized contracts, recent quotes, renewal cohorts, support schedules, and competitive bid records.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: Independent reproduction of WALL-OSS on non-X-Square hardware and long-horizon task failure-mode results.
    whyItMatters: >-
      Third-party transfer performance determines whether openness creates ecosystem leverage or merely distributes
      unverified claims.
    diligencePath: >-
      Commission blinded cross-robot benchmarks and review reproducible logs, intervention rates, and failure
      taxonomies.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: trust-and-safety
    missingEvidence: >-
      Comparable safety certifications, incident records, privacy controls, uptime, MTBF, and insurance requirements for
      X Square and direct peers.
    whyItMatters: Trust and regulatory readiness may dominate model capability in household and enterprise purchase decisions.
    diligencePath: >-
      Request certification files, incident logs, privacy assessments, reliability test reports, and customer security
      reviews.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP008
  - type: private-evidence-only
    severity: material
    topic: switching-and-retention
    missingEvidence: >-
      Customer retention, repeat bookings, integration effort, data portability, channel economics, and multi-homing
      behavior.
    whyItMatters: >-
      The durability of a full-stack moat depends on demonstrated switching costs and repeat usage rather than product
      breadth alone.
    diligencePath: >-
      Review customer cohorts, renewal and cancellation records, channel contracts, migration cases, and integration
      work logs.
    relatedQuestionRefs:
      - QP005
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited income statements, balance sheets, cash-flow statements, recognized revenue, ARR, and revenue-recognition
      policies.
    whyItMatters: >-
      These records are required to distinguish priced activity and financing announcements from recognized, repeatable
      revenue.
    diligencePath: Obtain audited financials and monthly revenue bridges by product, service, customer, and recognition method.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Enterprise contracts, realized pricing, discount schedules, renewal terms, channel economics, and customer
      concentration.
    whyItMatters: Public deployments and one service price do not reveal revenue quality, recurring mix, or sales efficiency.
    diligencePath: >-
      Review signed contracts and invoice cohorts for 58 Daojia, industrial deployments, hardware, and any model or
      software access.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Bill of materials, service labor, compute cost, utilization, gross margin, contribution margin, CAC, sales cycle,
      and payback.
    whyItMatters: >-
      The full-stack operating model may create attractive differentiation but also combines software, hardware, and
      field-service cost burdens.
    diligencePath: >-
      Obtain unit-cost waterfalls and cohort margins for each commercial motion, including downside utilization and
      warranty cases.
    relatedQuestionRefs:
      - QI004
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, restricted cash, monthly burn, debt, commitments, working-capital schedule, runway, and next-round
      triggers.
    whyItMatters: >-
      Valuation and funding announcements do not measure available liquidity or the amount of capital required to reach
      self-funding operations.
    diligencePath: >-
      Obtain a treasury schedule, financing closing statements, debt and commitment register, and monthly base and
      downside runway models.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Current safety certifications, cybersecurity architecture, privacy controls, incident history, recall records, and
      compliance attestations.
    whyItMatters: >-
      Robots operating around people and collecting in-home sensor data create physical-safety, security, and privacy
      exposure.
    diligencePath: >-
      Obtain certification reports, penetration-test summaries, data-flow and retention documentation, incident logs,
      and regulator correspondence.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Fleet MTBF, uptime, intervention rate, task-success distribution, maintenance burden, and support response
      performance by deployment.
    whyItMatters: >-
      A public demonstration or aggregate throughput result does not establish repeatable fleet reliability or service
      economics.
    diligencePath: >-
      Review versioned fleet telemetry, failure taxonomies, maintenance tickets, customer SLAs, and raw trial
      denominators.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: material
    topic: reproducibility
    missingEvidence: >-
      Independent reproduction of Wall-OSS or WALL model performance on non-X Square robot hardware with disclosed tasks
      and failure modes.
    whyItMatters: >-
      Cross-embodiment generalization is central to the platform thesis and cannot be underwritten from
      issuer-controlled benchmarks alone.
    diligencePath: >-
      Commission an independent benchmark using a third-party arm, frozen checkpoints, published protocols, and complete
      intervention logs.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: customer-durability
    missingEvidence: Cohort-level NRR, GRR, churn, renewals, cancellations, contract duration, and repeat-booking data.
    whyItMatters: Deployment breadth cannot establish recurring demand or customer satisfaction without retention evidence.
    diligencePath: >-
      Request anonymized customer cohorts by segment and month, contract renewal schedules, and cancellation reasons
      from management.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A complete customer list with customer-confirmed production status, deployment scope, start date, and outcomes.
    whyItMatters: The public list may omit customers and cannot distinguish pilots from durable production contracts.
    diligencePath: >-
      Obtain the customer ledger, sample contracts, invoices, deployment logs, and direct references from 58.com, SF
      Express, and industrial buyers.
    relatedQuestionRefs:
