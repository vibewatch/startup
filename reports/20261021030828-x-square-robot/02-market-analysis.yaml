  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-size-gap
      missingEvidence: A current independent market series with explicit category boundary, geography, base year, forecast period, TAM or revenue value, and CAGR methodology.
      whyItMatters: Without a comparable market denominator, the chapter cannot defend TAM, SAM, SOM, penetration, or a market-growth valuation premium.
      diligencePath: Obtain the underlying tables and methodology from at least two independent robotics or industrial-automation market-data publishers and reconcile their category definitions.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: customer-economics
      missingEvidence: Paid contract values, repeat-booking and renewal rates, utilization, cancellations, customer concentration, service gross margin, and deployment-level return on investment.
      whyItMatters: Demonstrations and household counts do not establish durable demand, budget conversion, or attractive unit economics.
      diligencePath: Review anonymized contracts, invoices, cohort data, deployment P&Ls, and customer references for the logistics, home-service, manufacturing, and care deployments.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM003]
    - type: missing-source
      severity: material
      topic: external-validation
      missingEvidence: Independent cross-robot replication, long-horizon task completion, uptime, failure-mode, and safety results in production-like environments.
      whyItMatters: Company benchmarks may not transfer across hardware or persist under real-world workload variability.
      diligencePath: Commission reference tests on non-X Square hardware and obtain third-party production benchmark logs with workload definitions and intervention rates.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
