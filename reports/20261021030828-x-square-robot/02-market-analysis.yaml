figures:
  - id: FM001
    title: Evidence-constrained addressability pyramid
    type: pyramid
    summary: >-
      The opportunity broadens from measured workflows to a general-purpose platform vision, while
      evidence quality declines and no defensible market-total estimate is available.
    data:
      items:
        - label: General-purpose embodied-AI vision
          value: Unquantified
          detail: "The full-stack platform thesis spans multiple physical-work categories, but the assigned evidence contains no method-defined TAM."
        - label: Multi-sector application envelope
          value: "Manufacturing, logistics, services, care, research, and home"
          detail: "This is a category map, not a revenue pool."
        - label: Named deployment verticals
          value: "Home services, logistics, manufacturing, and elder care"
          detail: "Named relationships indicate routes to market but do not establish scaled recurring demand."
        - label: Household channel signal
          value: "RMB149 / 3 hours; nearly 1,000 households reported"
          detail: "Repeat use, margin, and the measurement period were not disclosed."
        - label: Logistics workflow signal
          value: "1,816 parcels/hour; over 98% accuracy"
          detail: "Company livestream result without an independent production benchmark."
        - label: Independent replication
          value: Not established
          detail: "Third-party cross-robot transfer and long-horizon validation remain open."
    approximationNotes: "Layer order represents widening addressability and declining evidence maturity, not proportional market size; reported values are reproduced without converting them into TAM, SAM, or SOM."
    claimRefs: [CM001, CM002, CM005, CM009, CM010, CM012, CM013]
callouts:
  - calloutType: risk
    title: Market-size evidence is not yet decision-grade
    body: >-
      The retained sources do not provide a methodology-backed TAM, SAM, SOM, or CAGR. Financing
      valuation, deployment announcements, and benchmark throughput should not be substituted for
      market revenue or customer demand.
    claimRefs: [CM011, CM013]
  - calloutType: insight
    title: Workflow economics are the gating evidence
    body: >-
      The strongest near-term diligence path is to verify paid repeat deployments, uptime,
      utilization, customer labor savings, and service contribution margin in the named logistics,
      home-service, manufacturing, and care workflows.
    claimRefs: [CM014, CM015]
