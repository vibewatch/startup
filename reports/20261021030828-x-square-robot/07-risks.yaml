company:
  name: "X Square Robot"
chapter:
  number: 7
  title: "Risks"
  summary: "Production-grade reliability and safety are the largest residual risks because X Square Robot is entering homes and operational workflows before independent cross-robot validation, certifications, incident history, and control evidence are public. Unit economics, cash runway, partner concentration, and configuration control are also material gaps despite repeated financing and technically substantive demonstrations."
sections:
  - id: "ranked-risk-posture"
    title: "Ranked residual risk posture"
    body: >-
      The highest-priority risk is the gap between promising demonstrations and dependable production behavior. X Square Robot's own sponsored technical account concedes that its strongest results come from its robots and benchmarks, while independent commentary still seeks cross-robot and long-horizon testing. That gap matters because the company also describes deployments in homes and logistics, where recovery, safe-state behavior, and repeatability matter more than a one-time task success. Financial-model risk ranks next: an independently reported hardware price estimate remains far above the company's stated household threshold, while public sources disclose financing and valuation rather than audited revenue, margin, burn, cash, or runway. The heatmap uses ordinal diligence judgments, not measured probabilities.
    claimRefs: [CR001, CR002, CR009, CR015, CR016]
    figureRefs: [FR001]
  - id: "regulatory-legal-assurance"
    title: "Regulatory and legal assurance is not evidenced"
    body: >-
      The assigned public evidence identifies a Shenzhen-headquartered robotics company and describes real-home and workplace activity, but it does not establish the applicable safety approvals, privacy basis for household sensing, incident-reporting process, recall procedure, or liability insurance. This is a documented evidence gap, not evidence that a violation or incident occurred. Residual exposure is high wherever robots share space with residents, workers, patients, or valuable goods because the consequence of an unsafe action can be physical as well as digital. Diligence should therefore begin with a jurisdiction-by-jurisdiction control matrix and primary records from certifiers, regulators, insurers, and the company, rather than relying on product announcements or distributor copy.
    claimRefs: [CR006, CR008, CR014]
    tableRefs: [TR001]
  - id: "operational-quality-security"
    title: "Operational proof remains narrower than deployment claims"
    body: >-
      X Square Robot reports a thoughtful quality-control loop, including physical replay, an approximately 85% data-validity rate, and roughly 20-fold lower collection cost than all-robot data for comparable performance. Those figures are useful engineering signals but remain company measurements. The logistics release likewise reports 1,816 parcels per hour at more than 98% accuracy in a livestream demonstration, not audited fleet uptime, sustained error rates, maintenance burden, or service-level performance. The company's own discussion says dependable home robots need uncertainty handling, safe recovery, and help-seeking behavior. Until independent tests, MTBF, incident logs, cybersecurity controls, and production cohort data are available, strong demonstrations should not be treated as proof of reliable scaled operation.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR007, CR014, CR016]
    tableRefs: [TR002]
  - id: "dependencies-financial-kill-criteria"
    title: "Capital, channel, and configuration dependencies"
    body: >-
      Repeated financing provides access to capital but does not reveal cash available, burn, runway, or sustainable gross margin. Independent reporting described eight rounds in less than two years and an approximately $100 million A+ round; company releases separately announced a $140 million A++ and a valuation above $2.8 billion. These are financing and valuation facts, not revenue or liquidity measures. The visible household route depends on 58.com, while customer concentration and contractual durability remain undisclosed. A supplier listing also says models and hardware iterate quarterly and current datasheets require confirmation, raising configuration-control, support, and qualification risk. Thesis-break triggers are a material safety incident without transparent remediation, failure to reproduce performance independently, household economics remaining far above the stated target without improving utilization, or inability to evidence at least 18 months of funded runway.
    claimRefs: [CR006, CR009, CR010, CR011, CR012, CR013, CR015]
    tableRefs: [TR003]
