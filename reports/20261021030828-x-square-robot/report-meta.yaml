  topStrengths:
    - Vertically integrated model, data, hardware, and deployment strategy.
    - Repeated financing access from a broad roster of strategic and financial backers.
    - Public model releases and reported activity across household, logistics, manufacturing, and care workflows.
  topRisks:
    - Production reliability, safety certification, incident history, and privacy controls remain unverified.
    - Audited revenue, margins, burn, cash, runway, and deployment-level unit economics are undisclosed.
    - The reported valuation above RMB 20 billion is unsupported by disclosed operating fundamentals or financing terms.
    - Technical performance still lacks broad independent cross-robot and long-horizon reproduction.
    - Customer retention, contract economics, paid conversion, and concentration are not publicly established.
  unresolvedGaps:
    - Audited revenue, ARR, gross margin, burn, cash, runway, and revenue-recognition policies.
    - Full capitalization table, ownership, liquidation preferences, board rights, debt, and dilution.
    - Customer contracts, retention cohorts, repeat usage, pricing, concentration, and realized deployment outcomes.
    - Independent cross-robot and long-horizon testing with raw reliability and intervention data.
    - >-
      Safety certifications, incident and recall records, cybersecurity controls, privacy assessments, and liability
      coverage.
    - Complete leadership, board, governance, and succession information.
