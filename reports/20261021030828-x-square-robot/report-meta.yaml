companyProfile:
  summary: >-
    Founded in late 2023 and headquartered in Shenzhen, X Square Robot is pursuing a vertically integrated embodied-AI
    strategy across foundation models, data capture and training infrastructure, in-house hardware, and real-world
    deployments. The company has raised repeated strategic financing and reported activity in home services, logistics,
    manufacturing, and care settings, but public evidence does not establish audited economics or durable customer
    demand.
