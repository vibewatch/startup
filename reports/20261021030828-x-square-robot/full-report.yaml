      - number: '5.4'
        title: Trust, reliability, and control gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence set demonstrates self-correction claims, obstacle avoidance, public evaluation utilities, and
              prolonged parcel handling, but it does not establish formal safety certifications, mean time between
              failures, incident or recall history, cybersecurity controls, privacy governance for in-home sensing, or
              service-level support commitments. Those omissions are underwriting gaps, not evidence that controls are
              absent or ineffective. Deployment diligence should require versioned hardware datasheets, test protocols,
              failure distributions, intervention rates, security architecture, data-retention terms, compliance
              attestations, and customer support procedures. The current public record supports an advanced research and
              pilot platform; it is insufficient to underwrite unattended safety-critical operation or repeatable fleet
              economics.
            claimRefs:
              - CE005
              - CE006
              - CE010
              - CE013
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: External reproducibility is the key technical diligence test
            body: >-
              Open code and public demos improve inspectability, but the reviewed record does not show an independent
              operator reproducing the headline transfer or long-horizon performance on non-X Square hardware with
              disclosed failure modes.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a deliberately broad customer surface rather than a single proven beachhead. The
              clearest payer and channel relationship is the company-reported 58.com cleaning service in Shenzhen and
              Beijing, where robots work alongside professional cleaners in residential visits. Secondary reporting also
              says the company was already generating revenue from schools, hotels, and retirement homes, while a
              January company release described deployment across manufacturing, autonomous logistics, and senior
              healthcare. This mix spans consumer-service channels, institutional buyers, and industrial operators, but
              it does not reveal which segment contributes the most revenue or repeat demand. The broad general-purpose
              positioning therefore creates optionality while leaving the initial commercial wedge and payer economics
              unresolved.
            claimRefs:
              - CU001
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption trajectory and operating evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest trajectory evidence is dated operational activity rather than account or revenue growth. X
              Square says its 58.com service began in March 2026 and its extended household-placement program began in
              May; an independent industry report later described nearly 1,000 households served, but did not define
              whether these were paid customers, completed visits, or program participants. Logistics evidence is more
              measurable: third-party summaries repeat a company-reported August 12 rate of 1,816 parcels per hour at
              more than 98% accuracy, and the company later reported 10,000 parcels sorted in 5 hours, 14 minutes, and 1
              second at WRC. These metrics demonstrate task endurance under public test conditions, not customer
              retention or unit economics.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU007
              - CU016
      - number: '6.3'
        title: Named deployment proof
        blocks:
          - type: paragraph
            body: >-
              Named proof is uneven. The 58.com relationship is corroborated by two company-issued sources and is
              described as an active robot-plus-human cleaning service, making it the strongest identifiable commercial
              channel in the retained evidence. Embodied Global separately reports parcel sorting with SF Express and
              automotive-parts supply-line work for an unnamed German luxury OEM, but no customer-issued announcement or
              procurement record was retained for either deployment. Household residency participants are real-world
              users but remain an unnamed cohort. The resulting evidence establishes field exposure across home and
              industrial settings, while leaving production scope, contract status, deployment duration, and customer
              acceptance largely dependent on company or secondary accounts.
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU014
      - number: '6.4'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The retained public corpus does not report NRR, GRR, churn, renewal rates, contract duration, paid
              conversion, contract values, or revenue concentration. That absence is a limitation of the reviewed
              evidence, not proof that the company lacks repeat usage. X Square argues that real-world deployments
              create a feedback loop in which operating data improves the model, which could support land-and-expand if
              better performance lowers deployment friction. However, a skeptical independent review still asks for
              third-party evidence on cross-robot transfer and long-horizon home tasks. Until customer references,
              cohort data, and contract schedules are available, the investment case should treat deployment breadth as
              validation activity and not as evidence of durable recurring demand.
            claimRefs:
              - CU012
              - CU013
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Real-world exposure is broader than a lab-only program
            body: >-
              The retained evidence includes home visits, extended household placements, a live sorting line, and public
              logistics endurance tests across multiple 2026 dates.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Deployment breadth is not retention proof
            body: >-
              No retained source discloses renewal, churn, cohort retention, contract duration, customer concentration,
              or paid conversion, and most named proof is company-issued or secondary.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest-priority risk is the gap between promising demonstrations and dependable production behavior.
              X Square Robot's own sponsored technical account concedes that its strongest results come from its robots
              and benchmarks, while independent commentary still seeks cross-robot and long-horizon testing. That gap
              matters because the company also describes deployments in homes and logistics, where recovery, safe-state
              behavior, and repeatability matter more than a one-time task success. Financial-model risk ranks next: an
              independently reported hardware price estimate remains far above the company's stated household threshold,
              while public sources disclose financing and valuation rather than audited revenue, margin, burn, cash, or
              runway. The heatmap uses ordinal diligence judgments, not measured probabilities.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR009
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and legal assurance is not evidenced
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence identifies a Shenzhen-headquartered robotics company and describes real-home
              and workplace activity, but it does not establish the applicable safety approvals, privacy basis for
              household sensing, incident-reporting process, recall procedure, or liability insurance. This is a
              documented evidence gap, not evidence that a violation or incident occurred. Residual exposure is high
              wherever robots share space with residents, workers, patients, or valuable goods because the consequence
              of an unsafe action can be physical as well as digital. Diligence should therefore begin with a
              jurisdiction-by-jurisdiction control matrix and primary records from certifiers, regulators, insurers, and
              the company, rather than relying on product announcements or distributor copy.
            claimRefs:
              - CR006
              - CR008
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR008
              - CR014
      - number: '7.3'
        title: Operational proof remains narrower than deployment claims
        blocks:
          - type: paragraph
            body: >-
              X Square Robot reports a thoughtful quality-control loop, including physical replay, an approximately 85%
              data-validity rate, and roughly 20-fold lower collection cost than all-robot data for comparable
              performance. Those figures are useful engineering signals but remain company measurements. The logistics
              release likewise reports 1,816 parcels per hour at more than 98% accuracy in a livestream demonstration,
              not audited fleet uptime, sustained error rates, maintenance burden, or service-level performance. The
              company's own discussion says dependable home robots need uncertainty handling, safe recovery, and
              help-seeking behavior. Until independent tests, MTBF, incident logs, cybersecurity controls, and
              production cohort data are available, strong demonstrations should not be treated as proof of reliable
              scaled operation.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR014
              - CR016
      - number: '7.4'
        title: Capital, channel, and configuration dependencies
        blocks:
          - type: paragraph
            body: >-
              Repeated financing provides access to capital but does not reveal cash available, burn, runway, or
              sustainable gross margin. Independent reporting described eight rounds in less than two years and an
              approximately $100 million A+ round; company releases separately announced a $140 million A++ and a
              valuation above $2.8 billion. These are financing and valuation facts, not revenue or liquidity measures.
              The visible household route depends on 58.com, while customer concentration and contractual durability
              remain undisclosed. A supplier listing also says models and hardware iterate quarterly and current
              datasheets require confirmation, raising configuration-control, support, and qualification risk.
              Thesis-break triggers are a material safety incident without transparent remediation, failure to reproduce
              performance independently, household economics remaining far above the stated target without improving
              utilization, or inability to evidence at least 18 months of funded runway.
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              A material safety event without transparent remediation, or failure of independent testing to reproduce
              core behavior across non-X Square hardware and long-horizon tasks, would break the deployment thesis.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and decision posture
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a research-more recommendation rather than an invest or pass decision. Strategic
              backing, repeated financing, active model releases, and company-reported deployment breadth establish that
              X Square Robot is a serious embodied-AI platform, not merely a concept. They do not establish that a
              valuation above RMB 20 billion offers an attractive risk-adjusted entry. Public evidence lacks recognized
              revenue, recurring revenue, gross margin, burn, cash, runway, ownership, preference, and dilution data.
              This makes the call price-sensitive and diligence-sensitive: confidence is medium because the financing
              and technical activity are observable, while risk remains high because the variables required to
              underwrite return are private. No target return, holding period, or exit value should be stated before
              those inputs are available.
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              A company-issued release reported a roughly US$140 million Series A++ in January 2026, while independent
              reporting later described four settled rounds from B through Series C since April 2026 and a post-money
              valuation above RMB 20 billion. The investor roster is strategically notable, but investor quality is not
              a substitute for price discovery or unit economics. None of the retained financing sources discloses
              ownership sold, liquidation preferences, seniority, anti-dilution rights, board rights, option-pool
              treatment, or debt-like claims. Entry discipline therefore requires the full capitalization table and
              financing documents, a bridge from financing proceeds to cash available, and a valuation benchmark tied to
              recognized commercial performance. Without those items, the public valuation mark is context, not evidence
              that a new investor can earn an acceptable return.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Thesis, anti-thesis, and commercialization proof
        blocks:
          - type: paragraph
            body: >-
              The thesis is that a vertically integrated model, data, and hardware stack can compound through deployment
              feedback, with open repositories widening external experimentation and strategic investors improving
              access to distribution and industrial partners. The anti-thesis is that public technical and deployment
              claims are still dominated by the company or promotional channels. Independent commentary specifically
              notes that much quantitative evidence comes from X Square Robot's own robots and benchmarks and asks for
              third-party cross-robot and long-horizon testing. Reported household and industrial activity is
              encouraging but does not disclose contract value, repeat use, retention, cancellation, concentration, or
              margin. The view would improve with independently reproduced performance and cohort-level commercial
              evidence; it would deteriorate if claimed deployments do not convert into repeatable, profitable demand.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Scenarios, comparables, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Scenarios should be treated as underwriting conditions rather than numerical price targets. The retained
              pool does not contain audited financials, transaction terms for a genuinely comparable robotics business,
              or evidence that would justify applying a revenue multiple. A bull case requires independently validated
              technical transfer, repeat commercial bookings, improving hardware economics, and financing terms that
              leave meaningful common-equity upside. A base case assumes continued technical progress but delayed proof
              of scalable economics, making the current mark difficult to underwrite. A bear case combines weak repeat
              demand, expensive deployment, or financing preferences with valuation compression. Exit readiness is not
              demonstrated: an IPO or strategic-sale pathway needs governance, audited results, customer quality,
              regulatory readiness, and a credible buyer or public-comparable framework that the available evidence does
              not provide.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment committee posture
            body: >-
              Advance only to private diligence. A decision-ready package must reconcile the cap table and preference
              stack, audited operating economics, deployment cohorts, third-party technical tests, safety and regulatory
              readiness, and entry price to a realistic exit case.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
