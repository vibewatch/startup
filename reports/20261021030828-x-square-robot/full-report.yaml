            title: Independent competitive proof is still thin
            body: >-
              The strongest skeptical source says quantitative evidence remains concentrated on the company's own robots
              and benchmarks; the assigned pool does not establish comparative reliability, safety, pricing, win rates,
              or switching behavior.
            calloutType: risk
            claimRefs:
