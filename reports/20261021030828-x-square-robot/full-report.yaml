  - id: FR001
    title: 'Risk heatmap: residual exposure and mitigation maturity'
    type: matrix
    summary: >-
      Ordinal assessment prioritizes production reliability, safety assurance, and unit economics where public
      mitigation evidence is weakest.
    data:
      columns:
        - label: Likelihood
          detail: Analytical ordinal judgment, not a measured probability.
        - label: Impact
          detail: Potential effect on deployment, economics, or investment outcome.
        - label: Mitigation maturity
          detail: Publicly evidenced control maturity in the assigned source set.
      rows:
        - label: Production reliability
          note: Independent long-horizon and cross-robot evidence is still needed.
          values:
            - label: High
              tone: negative
            - label: High
              tone: negative
            - label: Early
              tone: warning
        - label: Physical safety and privacy assurance
          note: Certifications, incident history, and privacy controls are not established.
          values:
            - label: Medium-high
              tone: warning
            - label: High
              tone: negative
            - label: Undisclosed
              tone: negative
        - label: Unit economics
          note: Public pricing evidence remains far above the stated household target.
          values:
            - label: High
              tone: negative
            - label: High
              tone: negative
            - label: Undisclosed
              tone: negative
        - label: Financing and valuation
          note: Repeated funding does not establish runway or price support.
          values:
            - label: Medium-high
              tone: warning
            - label: High
              tone: negative
            - label: Capital raised; runway unknown
              tone: warning
        - label: Channel concentration
