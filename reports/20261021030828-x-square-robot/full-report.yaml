      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Financing access is the clearest financial strength, but it should not be confused with liquidity.
              Company-issued and independent accounts report a roughly US$140 million Series A++ and later financings
              that placed the company's valuation above RMB 20 billion, while the company said proceeds would fund core
              technologies and foundational research. The retained evidence does not disclose how much cash was received
              in the later rounds, current cash, monthly burn, debt, project-finance obligations, working-capital needs,
              or runway. The rapid financing cadence and strategic investor base can extend access to capital, but the
              full-stack operating model also creates continuing funding demands before commercialization is proven.
              Underwriting should therefore model the valuation as a pricing signal and funding raised as historical
              financing, not as cash presently available.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The financial profile is promising on capital access but presently ununderwritable on operating
              performance. One independent commentary explicitly cautions that the hardware remains fragile, models can
              produce surprising errors, and large-scale deployment economics are unproven. That warning is consistent
              with the evidence gaps: no recognized revenue or ARR, no gross or contribution margin, no customer
              concentration, no renewal or cancellation data, no sales-efficiency measures, and no cash or runway
              disclosure. The investment case requires primary evidence showing whether paid deployments generate
              repeatable revenue and whether hardware, service, data, and compute costs decline with scale. Until
              management supplies audited financials, contract cohorts, unit-cost bridges, and a current liquidity
              schedule, revenue quality, margin path, and capital adequacy remain material blockers rather than
              quantities that can be responsibly estimated.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The disclosed valuation and financing events demonstrate investor access but do not reveal cash received,
              cash remaining, burn, debt, or the next financing trigger.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI003
