            - Shenzhen and Beijing service coverage
        - label: Assisted deployment
          detail: Robots work alongside professional cleaners in real homes.
          touchpoints:
            - Human-in-the-loop service
            - Household environment exposure
        - label: Extended household use
          detail: The X Family Member Program places robots with families for up to one month.
          touchpoints:
            - Everyday household tasks
            - Longer interaction window
        - label: Industrial operation
          detail: The company describes a live parcel-sorting line designed for continuous operation.
          touchpoints:
            - Variable parcels
            - Public endurance challenge
        - label: Operating-data feedback
          detail: X Square says deployment data feeds model improvement and faster iteration.
          touchpoints:
            - Data collection
            - Model iteration
        - label: Expansion decision
          detail: Broader rollout depends on verified reliability, repeat demand, and contract economics.
          touchpoints:
