chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              X Square Robot is a Shenzhen-based robotics company founded in December 2023. Its core proposition is not
              a single-purpose machine: the company presents WALL as an embodied foundation-model family that combines
              perception, decision-making, and manipulation, while third-party coverage describes a broader stack
              spanning models, proprietary data pipelines, wheeled dual-arm hardware, and deployments. That vertical
              scope is central to the business thesis because field activity can generate data for model iteration and
              model requirements can shape hardware design. It is also an execution burden: evidence of a coherent
              architecture does not establish production economics, reliability, or repeatable commercial demand. The
              public snapshot is therefore strongest on identity, technical direction, and financing stage, and weakest
              on revenue, customer, and workforce scale.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: Founder concentration and capital structure
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence centers on founder and CEO Wang Qian. The retained sources do not establish a
              broader executive slate, board composition, voting rights, or succession arrangements, leaving material
              key-person and governance diligence unresolved. Capital formation is much more visible. A January 2026
              company release reported a roughly US$140 million Series A++ round, followed by B, B+, B++, and Series C
              financings reported from April through June. The June round was reported above RMB 20 billion post-money.
              Coverage identifies major strategic and financial backers, but neither the number of investors nor their
              brand strength reveals control rights, liquidation preferences, ownership concentration, debt exposure, or
              cash still available. The financing record demonstrates access to capital; it does not substitute for
              cap-table and treasury data.
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO016
