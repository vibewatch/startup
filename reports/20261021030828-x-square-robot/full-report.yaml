  - id: FP001
    title: Competitive positioning by openness and public deployment evidence
    type: quadrant
    summary: >-
      Ordinal positioning separates the open-model entry path from the proprietary full-stack offer and shows how thin
      the peer evidence remains.
    data:
      xAxis:
        label: Developer and model openness (ordinal)
        min: 1
        max: 5
        low: Closed or unavailable
        high: Open and reusable
        description: Analyst ordinal score from retained disclosures, not a benchmark.
        scale: ordinal
      yAxis:
        label: Public deployment evidence breadth (ordinal)
        min: 1
        max: 5
        low: Claim or unknown
        high: Multiple public task settings
        description: Analyst ordinal score for breadth of disclosed settings, not installed scale.
        scale: ordinal
      points:
        - label: X Square full stack
          x: 4
          'y': 4
          note: Open model layers plus company-issued household, logistics and manipulation demonstrations.
        - label: WALL-OSS-only path
          x: 5
          'y': 2
          note: Highest openness, but independent non-X-Square deployment evidence is missing.
        - label: Galbot
          x: 2
          'y': 3
          note: Retail-led position asserted by a supplier listing; comparable metrics are unavailable.
        - label: UniX AI
          x: 2
          'y': 2
          note: Household-hardware-first position asserted by a supplier listing; comparable metrics are unavailable.
        - label: Internal multi-vendor build
          x: 4
          'y': 1
          note: Analytical substitute with high configuration control; no pooled deployment comparison.
        - label: Fixed automation / status quo
          x: 1
          'y': 2
          note: Analytical substitute with low model openness; breadth score is intentionally conservative.
    approximationNotes: >-
      Scores are evidence-backed ordinal judgments on a 1-5 scale, not measured market performance. Peer and substitute
      scores are deliberately conservative where the assigned source pool lacks comparable data.
