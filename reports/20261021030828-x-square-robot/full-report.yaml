      - number: '5.3'
        title: Maturity, deployment evidence, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The strongest maturity signal is the combination of a public codebase, successive 2026 model releases,
              home placements, and an official logistics endurance result: 10,000 parcels were sorted in 5 hours, 14
              minutes, and 1 second, with company-stated average throughput of 1,911 parcels per hour. The apparent
              differentiation is the closed loop across models, data tools, in-house robot components, and multiple
              embodiments rather than any single specification. However, key performance claims remain issuer-reported
              or repeated by secondary outlets. MechaFeed explicitly notes that much of the quantitative evidence comes
              from X Square's own robots and benchmarks, so external reproduction on non-X Square hardware remains the
              critical test of generalization and defensibility.
            claimRefs:
