            claimRefs:
              - CO007
              - CO009
              - CO010
      - number: '1.3'
        title: Milestones, deployment signals, and evidence risk
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence shows unusually fast expansion: an open model release in 2025, a large January 2026
              financing, WALL-B in April, a four-round financing sequence through June, household placements beginning
              in May, and a broader open-stack publication wave by mid-2026. Coverage also describes deployments in
              homes, factories, logistics, cleaning, and eldercare. These signals make the company more substantive than
              a presentation-only robotics venture, yet their evidentiary quality is uneven. An independent technical
              review explicitly notes that much of the quantitative support still comes from X Square's own robots and
              benchmarks and calls for reproduction on third-party hardware. No retained source supplies audited
              revenue, ARR, margin, burn, cash, runway, headcount, or a consistently defined customer count. Diligence
              should treat those omissions as decision-relevant unknowns rather than zeros or evidence of absence.
