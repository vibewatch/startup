      - number: '4.2'
        title: Cost structure and unit-economics limits
        blocks:
          - type: paragraph
            body: >-
              X Square's vertically integrated design broadens the likely cost base. Company-issued accounts describe
              foundation-model research, a proprietary model-driven data pipeline, robotics hardware, real-world
              deployment, and in-house robotic arms, joint modules, and controllers. Those activities imply concurrent
              spending on compute and model development, data capture, component engineering, inventory or
              manufacturing, field operations, support, and deployment labor. Public sources do not quantify any of
              those cost pools, nor do they disclose hardware bill of materials, service labor per job, utilization,
              warranty expense, gross margin, contribution margin, CAC, sales-cycle length, or payback. The RMB 149
              household-service price is therefore a monetization signal, not proof of profitable unit economics;
              without service-delivery cost and robot utilization, it cannot be converted into revenue quality or
              margin.
