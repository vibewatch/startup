      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public proof narrows uncertainty but does not yet connect the reported valuation to an underwritable return.
    data:
      nodes:
        - id: capital
          label: Strategic capital
          value: Multiple reported rounds and broad backing
          detail: Financing validates investor interest, not entry economics.
        - id: technical
          label: Technical activity
          value: Active models, datasets, and open releases
          detail: Open artifacts create a reproduction surface but do not prove commercial value.
        - id: deployment
          label: Deployment claims
          value: Household, logistics, and industrial activity reported
          detail: Retention, contract value, concentration, and margin remain undisclosed.
        - id: economics
          label: Economic proof
          value: Not publicly established
          detail: Revenue, gross margin, burn, cash, and runway are missing.
        - id: price
          label: Price test
          value: Reported post-money value above RMB 20 billion
          detail: No defensible public comparable or operating multiple is available.
        - id: decision
          label: Decision
          value: Research more
          detail: Require private diligence and price protection before underwriting a return.
    approximationNotes: Ordered qualitative decision chain; node order is analytical logic, not a quantitative conversion funnel.
