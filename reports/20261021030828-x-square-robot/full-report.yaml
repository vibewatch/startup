  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product system and customer workflows
        blocks:
          - type: paragraph
            body: >-
              The delivered product is better understood as a model-data-hardware system than as a single robot. WALL-A
              and WALL-B are the proprietary embodied-control layer; WALL-WM and Wall-OSS extend the research and
              developer surface; Quanta X1 and X2 provide the wheeled dual-arm embodiments; and teleoperation,
              exoskeleton, and UMI tooling feed the data loop. Public demonstrations cover household manipulation,
              autonomous delivery, flower arrangement, dexterous unboxing, and parcel sorting. The evidence therefore
              supports breadth of intended workflows, but not uniform production maturity: conference demonstrations,
              extended home placements, and a live logistics line are materially different validation stages and should
              not be treated as interchangeable commercial deployments.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
