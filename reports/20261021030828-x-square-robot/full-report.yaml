        title: Exhibits
        blocks:
          - type: callout
            title: Broad stack with an open entry point
            body: >-
              X Square combines open model assets with proprietary data tooling, components, robot platforms, and public
              deployment demonstrations, creating more adoption paths than a hardware-only offer.
            calloutType: strength
            claimRefs:
              - CP001
              - CP006
              - CP012
