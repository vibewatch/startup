          values:
            - label: Medium
              tone: warning
            - label: Medium-high
              tone: warning
            - label: One named channel
              tone: warning
        - label: Configuration and supply chain
          note: Quarterly iteration is described, while BOM redundancy is not public.
          values:
            - label: Medium-high
              tone: warning
            - label: High
              tone: negative
            - label: Datasheets on request
              tone: warning
