figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      X Square Robot moved from formation to open model releases, deployments, and a Series C valuation above RMB 20
      billion in roughly two and a half years.
    data:
      items:
        - date: December 2023
          label: Company founded
          detail: X Square Robot was founded as a general-purpose embodied-AI company.
          tone: neutral
          claimRefs:
            - CO001
        - date: September 2025
          label: WALL-OSS introduced
          detail: The company release dates the first open-source WALL family release to September 2025.
          tone: positive
          claimRefs:
            - CO012
        - date: January 2026
          label: Series A++ financing
          detail: The company announced approximately US$140 million in Series A++ funding.
          tone: positive
          claimRefs:
            - CO006
        - date: April 2026
          label: WALL-B unveiled
          detail: WALL-B was presented as a World Unified Model architecture for perception, reasoning, and action.
          tone: positive
          claimRefs:
