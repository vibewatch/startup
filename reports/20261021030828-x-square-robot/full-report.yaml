  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than either all robotics or all artificial intelligence. X Square Robot
              is pursuing a full-stack embodied-AI category in which a foundation model, manipulation hardware,
              data-collection systems, and real-world deployment must work together. Included spend therefore comprises
              adaptable robot systems, enabling software and data infrastructure, and deployment into workflows where
              physical variability defeats fixed automation. Excluded spend includes conventional single-purpose
              industrial automation that does not use the embodied stack, pure digital AI, and broad consumer
              electronics. The status quo is not only another robot: it also includes manually programmed equipment,
              human labor, and hybrid human-plus-robot services. This boundary is important because the company's
              general-purpose vision spans several adjacencies, while the evidence of monetizable demand is still
              concentrated in named workflows and pilots rather than a measured category total.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM010
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              None of the eight assigned sources provides a publisher-defined TAM, SAM, SOM, or market CAGR with a
              disclosed methodology. The defensible sizing lens is therefore bottom-up and operational. In logistics,
              the company reported a live parcel-induction demonstration at 1,816 parcels per hour and above 98%
              accuracy. In data collection, reporting described nearly 100 demonstrations per hour and more than twice
              conventional teleoperation efficiency. A specialist publication also reported a home-service price of
              RMB149 for three hours and nearly 1,000 households served, but did not disclose repeat use, contribution
              margin, or the denominator and period behind that household count. These figures indicate possible
              workflow value and adoption signals; they are not interchangeable with market revenue, annual recurring
              revenue, or addressable-market size.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM009
              - CM010
              - CM012
              - CM013
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer changes by workflow. Logistics and manufacturing deployments are likely sponsored by operations
              or automation leaders and funded from productivity or capital budgets, while front-line operators are the
              users. In home services, the reported 58 Daojia arrangement points to a channel-led service model in which
              a household pays for an outcome and the service platform coordinates robot and human delivery. In elder
              care, the operator is the buyer and care staff and residents are the users. Across these segments,
              adoption should progress from technical demonstration to paid pilot, repeat deployment, and fleet
              expansion. The assigned evidence establishes examples at the first two stages, but does not establish
              contract size, renewal, utilization, customer concentration, or who bears maintenance and downtime risk.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM010
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by labor-intensive, variable workflows such as parcel induction, home cleaning, and
              care-facility tasks, where fixed-sequence automation can be brittle. A shared model-and-data stack could
              also spread development cost across multiple verticals if learning transfers in practice. The constraints
              are equally material: physical data is expensive to collect, production environments require reliability
              and integration, and household settings add trust, safety, privacy, and service-quality burdens. Mechafeed
              specifically noted that much of the quantitative evidence still came from X Square Robot's own robots and
              benchmarks and called for third-party cross-robot and long-horizon validation. Capital concentration
              around full-stack robotics companies validates investor interest, not end-market size. A valuation case
              should therefore require independent replication, paid repeat deployments, measurable customer ROI, and
              unit economics before assigning broad-platform multiples.
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market-size evidence is not yet decision-grade
            body: >-
              The retained sources do not provide a methodology-backed TAM, SAM, SOM, or CAGR. Financing valuation,
              deployment announcements, and benchmark throughput should not be substituted for market revenue or
              customer demand.
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
          - type: callout
            title: Workflow economics are the gating evidence
            body: >-
              The strongest near-term diligence path is to verify paid repeat deployments, uptime, utilization, customer
              labor savings, and service contribution margin in the named logistics, home-service, manufacturing, and
              care workflows.
            calloutType: insight
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              X Square Robot presents a full-stack offer that combines foundation models, robot hardware, data systems,
              and commercial deployment, while independent summaries list WALL, QUANTA, ArtiXon, and QUANXTA as distinct
              product families. The competitive set is therefore broader than wheeled humanoid peers: buyers can procure
              a full stack, adopt an open model on other hardware, build an internal integration layer, or retain fixed
              automation and human labor. A supplier-authored comparison names Galbot as retail-led and UniX AI as
              household-hardware-led, but it provides no auditable peer metrics. Those named profiles are directional
              only, and unsupported cells remain unknown rather than being converted into rankings.
