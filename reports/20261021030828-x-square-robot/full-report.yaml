            body: >-
              The clearest differentiation thesis is the linkage between an open model layer and proprietary data and
              deployment infrastructure. X Square says QUANXTA Zero joins collection, synchronization, cleaning,
              annotation, training, inference, and evaluation; it also reports nearly 100 demonstrations per hour, 2.33
              times conventional teleoperation, and data yield up to 85 percent. MechaFeed describes the open stack as a
              credible research platform but notes that much quantitative evidence still comes from X Square's own
              robots and benchmarks. This combination can attract developers while preserving operational know-how, yet
              public openness does not by itself prove durable cross-robot performance or proprietary data advantage.
