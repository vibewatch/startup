      - number: '3.3'
        title: Commercial packaging and distribution
        blocks:
          - type: paragraph
            body: >-
              Public evidence is stronger on demonstration breadth than on commercial terms. A supplier listing says
              WALL-OSS is free to developers, describes services as priced per engagement, and directs hardware buyers
              to request current pricing; no allocated source discloses realized hardware prices, contract duration,
              discounts, support fees, or gross margins. Company-issued conference coverage reports household tasks on
              multiple robotic platforms and a parcel-sorting demonstration of 10,000 parcels in 5 hours, 14 minutes,
              and 1 second, while Wikipedia summarizes a 58.com cleaning service extended from Shenzhen to Beijing.
              These signals show routes to market, not repeat demand, channel economics, or competitive win rates.
            claimRefs:
              - CP009
              - CP013
              - CP014
              - CP016
