  - id: FU001
    title: Deployment-to-expansion learning loop
    type: journey-map
    summary: >-
      Public evidence shows a path from channel access to field operation and model learning, but the commercial
      expansion step remains unquantified.
    data:
      nodes:
        - label: Channel entry
          detail: 58.com provides a route into paid residential cleaning visits.
          touchpoints:
