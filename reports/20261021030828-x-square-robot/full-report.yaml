            tableRef: TP003
            claimRefs:
              - CP009
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Vertical integration may shorten iteration loops because X Square says it develops models, data pipelines,
              arms, joint modules, controllers, and robot platforms in-house. Open-source distribution may also broaden
              ecosystem reach, while the reported 2,000-hour open dataset gives developers a concrete artifact to test.
              The counterweight is commoditization: open models can reduce buyer lock-in, strategic incumbents can fund
              competing stacks, and buyer-controlled integration can substitute for a single-vendor bundle. Most
              importantly, the allocated independent critique asks for third-party cross-robot and long-horizon testing.
              Until comparative reliability, safety, deployment-scale, and retention data are available, the moat should
              be treated as a plausible data-and-execution flywheel rather than a demonstrated durable advantage.
            claimRefs:
              - CP006
              - CP007
              - CP011
              - CP012
              - CP015
