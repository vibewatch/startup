        title: Architecture and data loop
        blocks:
          - type: paragraph
            body: >-
              The architecture joins data capture, world modeling, action prediction, training, serving, evaluation, and
              robot hardware. X Square's public repository exposes LeRobot data preparation, model configuration,
              flow-matching and FAST action branches, simulator and open-loop evaluation helpers, and a WebSocket
              serving path. MechaFeed describes a three-layer concept: robot-free interaction data, event-centered
              WALL-WM, and the Wall-OSS-0.5 action model. This is a coherent technical thesis, but the implementation
              has meaningful dependencies on PyTorch, CUDA extension compilation, FlashAttention, DMuon, LeRobot,
              checkpoints, and hardware-specific configuration. Open code improves inspectability; it does not by itself
              prove portability, deterministic deployment, or supportability.
