  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization evidence
        blocks:
          - type: paragraph
            body: >-
              Public evidence indicates several possible monetization paths but does not establish their revenue mix or
              accounting treatment. An independent report describes a 58 Daojia "robot + human" household-cleaning
              service priced at RMB 149 for three hours and says nearly 1,000 households had participated in month-long
              robot residencies. The same report identifies deployments with a German luxury automotive OEM and SF
              Express, while company-issued material describes activity across manufacturing, logistics, and senior-care
              services. These disclosures support a service-and-deployment go-to-market motion, potentially supplemented
              by robot hardware, yet none provides contract value, realized price, recurring share, utilization,
              renewal, or revenue-recognition terms. The official research-page text offers a contact-sales route rather
              than a public price list, so enterprise and model-layer monetization remain private diligence items.
            claimRefs:
