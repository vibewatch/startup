chapter:
  number: 6
  title: "Customers"
  summary: "Carro's customer base spans retail automotive consumers, enterprise fleet and SME operators, and wholesale used-car dealerships across 7 to 8 Asia-Pacific markets. While the platform has demonstrated transaction scale exceeding 100,000 to 120,000 units annually and ancillary financing attach rates of approximately 50%, verifiable customer cohort retention, Net Retention Rates (NRR), and market-by-market customer concentration remain undisclosed private metrics."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Architecture and Segment Economics"
    body: "Carro organizes its commercial operations across three primary customer segments: retail car buyers and sellers (B2C/C2B), small and medium enterprises (SMEs) requiring commercial mobility and fleet leasing, and independent automotive dealerships sourcing wholesale inventory (B2B). In the consumer retail segment, Carro targets middle-income vehicle owners and buyers across core Southeast Asian markets including Singapore, Malaysia, Indonesia, and Thailand, expanding into Hong Kong and Japan. Retail monetization is driven by vehicle margin markups, extended warranty packages, and captive automotive financing origination through its wholly owned subsidiary Genie Financial Services. In contrast, the wholesale dealership segment engages independent used-car lots seeking trade-in liquidations and auction sourcing via digital inspection clearinghouses such as Carro Auction in Thailand. Meanwhile, the SME and corporate fleet tier relies on long-term vehicle leasing and mobility management, supplemented by operational refurbishment services provided through Carro Care workshops. However, public disclosures do not report customer counts, cohort retention curves, or revenue concentration by segment, leaving underwriting visibility heavily dependent on aggregate vehicle run rates."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-transaction-scale"
    title: "Adoption Trajectory, Transaction Velocity, and Operating Footprint"
    body: "Adoption across Carro's digital marketplace has scaled from early regional traction into an annualized transaction volume surpassing 100,000 to 120,000 vehicle units across up to 8 regional markets. Historical milestones demonstrate rapid expansion: in FY2022, Carro recorded S$650 million in revenue and reached a run-rate exceeding S$1.3 billion, with Thailand alone contributing approximately 35,000 units annually and Indonesia delivering nearly S$40 million in annualized EBITDA. By FY2025, annual group revenue reached S$1.2 billion, supported by sustained regional demand for certified pre-owned vehicles and the introduction of brand-new vehicles in Singapore and Malaysia. In September 2025, strategic capital from Cool Japan Fund further targeted the promotion of Japanese vehicles and Plug-in Hybrid Electric Vehicles (PHEVs) across Southeast Asia, citing rising middle-class disposable income and regional EV subsidies. Despite these reported unit and revenue volumes, critical denominator metrics—including active transacting user counts, monthly active app users, and customer acquisition costs (CAC) per completed retail delivery—remain unverified outside management commentary."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-entity-differentiation"
    title: "Commercial Case Evidence, Deployment Boundaries, and Brand Disambiguation"
    body: "Evaluating named customer evidence requires careful separation between Singapore-headquartered automotive marketplace Carro (carro.co) and unrelated third-party software entities sharing the 'Carro' trademark. Specifically, US-based e-commerce platform GetCarro (getcarro.com) publishes dropship retail case studies featuring consumer brands such as Vanity Planet, Glow Recipe, and Pacsun, while UK-based dealer software provider Carro Systems (carro.systems) documents CRM deployments across British dealerships. In contrast, automotive marketplace Carro's direct commercial proof manifests through institutional and enterprise partnerships, such as automotive financing distribution alliances with Japanese consumer credit group Orient Corporation (Orico) across Japan, Thailand, and Indonesia, and consumer trade-in networks across its 4,500-employee regional footprint. External market synthesis models estimate ancillary service customer retention at roughly 60% with net promoter scores (NPS) between 45 and 55, but verifiable named enterprise case studies for Carro's automotive fleet leasing and wholesale auctions remain proprietary."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Customer Durability, Ecosystem Attachment, and Structural Vulnerabilities"
    body: "Customer durability in full-stack automotive retail is governed by the structural disparity between low-frequency vehicle transactions and high-margin recurring ancillary attach. While typical consumers replace vehicles only once every three to seven years, Carro seeks lifetime customer value expansion through ancillary attach: financing via Genie Financial Services, motor insurance brokerage, and ongoing repair and maintenance at Carro Care service centers. In FY2022, Genie's loan book exceeded S$400 million with non-performing loan (NPL) ratios below 0.1%, expanding past S$670 million by FY2025 as ancillaries generated over 55% of group gross profit. Nonetheless, customer concentration and retention present notable vulnerabilities. Independent wholesale dealers exhibit low platform loyalty, routinely multi-homing across competing platforms such as Carsome or local auction houses to secure optimal wholesale pricing. Furthermore, the absence of public cohort retention figures, customer churn data, or geographic revenue breakdowns prevents institutional investors from stress-testing customer lifetime value against rising consumer credit defaults in volatile emerging markets."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
callouts:
  - calloutType: "risk"
    title: "Transactional Dealership Multi-Homing and Sourcing Vulnerability"
    body: "Wholesale automotive dealerships and individual vehicle sellers across Southeast Asia maintain multi-homing relationships across competing platforms, leaving B2B marketplace transaction velocity exposed to competitor subsidies and dealer inventory switching."
    claimRefs:
      - "CU003"
      - "CU014"
  - calloutType: "insight"
    title: "Ancillary Attach Overcoming Low Vehicle Purchase Frequency"
    body: "Because retail car purchases occur infrequently, Carro's customer unit economics depend on cross-selling fintech financing, motor insurance, and Carro Care aftermarket maintenance to convert one-off vehicle buyers into multi-year ecosystem revenue streams."
    claimRefs:
      - "CU002"
      - "CU012"
      - "CU013"
