callouts:
  - calloutType: "strength"
    title: "Vertically Integrated Automotive Ecosystem Moat"
    body: "Carro's integration of algorithmic valuation, digital retail, proprietary financing through Genie Financial Services, and in-house physical refurbishment via Carro Care creates a self-reinforcing flywheel that captures margin across every stage of the vehicle ownership lifecycle, differentiating it from asset-light classifieds."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
  - calloutType: "risk"
    title: "Algorithmic Pricing and Credit Underwriting Blind Spots"
    body: "Because Carro holds vehicle inventory and underwrites automotive loans across diverse developing markets (including Thailand and Indonesia), any systemic inaccuracy in its proprietary pricing models or credit risk scoring could result in sudden inventory write-downs and loan provisioning shocks."
    claimRefs:
      - "CE004"
      - "CE006"
      - "CE014"
  - calloutType: "insight"
    title: "Strategic Financial Partner Integration"
    body: "The strategic investment and technical partnership with Japan's Orient Corporation (Orico) provides Carro with institutional credit underwriting expertise and co-financing capabilities, strengthening its international distribution across Japan, Thailand, and Indonesia while mitigating direct balance sheet exposure."
    claimRefs:
      - "CE007"
      - "CE009"

