chapter:
  number: 8
  title: "Valuation"
  summary: "Carro demonstrates substantial operational scale with over 120,000 transacted units and backing from top-tier sovereign and institutional investors, but opaque capital structure, divergence between independent benchmarks ($1B) and rumored targets ($3B), and compressed public peer multiples dictate a Track stance with high risk rating."
sections:
  - id: "recommendation-and-investment-stance"
    title: "Investment Recommendation and Valuation Stance"
    body: "Carro presents a compelling operational footprint across Southeast Asia, having transacted over 120,000 vehicles in FY2026 supported by more than 4,500 personnel. However, unverified private market chatter positioning the company at a US$3.0 billion valuation benchmark diverges sharply from independent tracking services that evaluate the asset at US$1.0 billion. In light of compressed global automotive platform trading multiples and the lack of audited public disclosures regarding EBITDA conversion, the risk-reward profile warrants a disciplined Track posture. Investors should avoid committing fresh capital at elevated private marks until formal audited registration statements validate sustainable operating profitability."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV014"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "capital-history-and-financing-structure"
    title: "Financing History and Capital Structure Opacity"
    body: "The company has demonstrated an established track record of securing equity capital from premier sovereign and institutional sponsors, amassing over US$600 million in total funding including a US$60 million round led by Cool Japan Fund in September 2025 and strategic backing from Orient Corporation. Complementing its equity capitalization, Carro carried S$500 million in balance sheet liquidity entering FY2023 along with extensive debt facilities for its Genie Financial Services loan book. Nonetheless, third-party databases reveal material record discrepancies, with platform aggregators citing US$546 million across fewer rounds, while speculative unicorn secondary portals redirect to unrelated domains without publishing verified cap table waterfalls or liquidation preference seniorities."
    claimRefs:
      - "CV003"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV011"
      - "CV013"
    tableRefs:
      - "TV002"
  - id: "scenario-analysis-and-valuation-framework"
    title: "Scenario Analysis and Valuation Framework"
    body: "Evaluating prospective investor outcomes across explicit scenarios illustrates substantial asymmetric downside under current macro automotive headwinds. In the base case, sustaining 120,000 to 130,000 annual unit transactions with stable financing spreads supports a normalized enterprise valuation range of US$1.8 billion to US$2.2 billion. Achieving the bull case valuation of US$3.0 billion to US$3.5 billion demands accelerated unit expansion above 150,000 alongside high-teens EBITDA margins and seamless dual-listing execution. Conversely, a bear case triggered by used car price deflation, Genie loan delinquency spikes above historical 0.1 percent levels, or multiple compression toward 225 active market rivals compresses equity value to US$1.0 billion."
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV012"
      - "CV014"
    tableRefs:
      - "TV003"
  - id: "comparables-and-exit-diligence-path"
    title: "Peer Comparables and Diligence Kill Triggers"
    body: "Publicly listed digital automotive retailers and classifieds peers such as Autohome, Uxin, and broader e-commerce marketplaces trade at heavily discounted enterprise value multiples between 0.5x and 1.5x revenue, exerting severe downward gravitational pressure on Carro's targeted exit pricing. To bridge the gap toward a successful public offering, diligence must focus on four definitive kill triggers: sudden contraction in warehouse credit facilities, deteriorating vintage loss curves in credit portfolios, executive departures from the board, and onerous liquidation preference terms that subordinate common equity. Without resolution of these structural uncertainties, entry at private marks remains fundamentally uncompensated."
    claimRefs:
      - "CV004"
      - "CV009"
      - "CV010"
      - "CV011"
