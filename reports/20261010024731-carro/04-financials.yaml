callouts:
  - calloutType: "strength"
    title: "High-margin ancillary flywheel transforms unit profitability"
    body: "Carro's strategic shift from a transactional used car marketplace to an integrated automotive ecosystem has fundamentally reshaped its margin profile. By deriving over 70% of gross profit from recurring financing, extended warranties, and digital insurance, the company generates durable post-sale cash flow that decouples overall profitability from cyclical swings in used car prices."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI007"
  - calloutType: "risk"
    title: "Working capital requirements and inventory valuation exposure"
    body: "Operating as an asset-heavy retailer requires substantial capital expenditure to procure and hold vehicle inventory across eight regional markets. If regional automotive demand softens or benchmark interest rates remain elevated, used vehicle depreciation and floorplan financing costs could compress blended gross margins and strain balance sheet liquidity."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI014"
