company:
  name: "Carro"
chapter:
  number: 4
  title: "Financials"
  summary: "Carro demonstrated notable financial progress in FY2025 with record revenues of S$1.2 billion, S$149 million in gross profit, and positive EBITDA of S$43 million. Profitability is heavily anchored by recurring ancillary services—including financing, warranties, and insurance—which account for more than 70% of gross profit. However, the capital intensity of holding retail vehicle inventory and the lack of public disclosure regarding loan book facility terms and unit-level customer acquisition costs remain primary underwriting diligence considerations."
sections:
  - id: "revenue-streams-and-pricing-model"
    title: "Revenue Streams, Commercial Monetization, and GTM Motion"
    body: "Carro operates an integrated multi-channel automotive marketplace that monetizes transactions across both retail consumers and wholesale dealership partners. In FY2025, the company achieved record group revenues of S$1.2 billion (US$898 million), representing a 15% year-on-year expansion while transacting more than 120,000 vehicle units across eight regional markets. Revenue streams are bifurcated between vehicle sales turnover and high-margin ancillary attach. Retail vehicle transactions generate gross revenue recognized on a principal basis, where Carro acquires used vehicles directly from consumers, subjects them to a proprietary 160-point inspection, and retails them through certified digital showrooms. In wholesale auctions, Carro charges transaction fees to independent dealers seeking curated inventory. Pricing is determined algorithmically through dynamic appraisal models that ingest regional historical sales and real-time demand, removing arbitrary showroom markups and sustaining gross profit per unit across mature territories."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI004"
      - "CI005"
      - "CI013"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "unit-economics-and-margin-dynamics"
    title: "Unit Economics, Gross Margin Flywheel, and Regional Disparities"
    body: "The defining characteristic of Carro's financial evolution is its shift from low-margin vehicle trading toward an ecosystem-led recurring profit flywheel. While base vehicle retail transactions generate gross profit margins of 10% to 15%, more than 70% of Carro's total gross profit is now generated by high-margin ancillary services. Specifically, in-house auto loan financing and underwriting via Genie Financial Services represents 32% of group gross profit, extended warranties and servicing subscriptions contribute 22%, and digital auto insurance brokerage and related add-ons deliver 18%. Unit economics diverge substantially by geography: in developed markets like Australia, Japan, and Singapore, higher vehicle ticket sizes and deep financing penetration enable gross profit per unit (GPU) margins between 15% and 20%+, whereas fragmented dealer competition in emerging markets such as Thailand and Indonesia keeps GPU below 15%. Ongoing deployment of artificial intelligence across vehicle inspection and customer support has enabled a 15% workforce optimization via natural attrition over two years."
    claimRefs:
      - "CI002"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-financing-structure"
    title: "Capital Adequacy, Balance Sheet Liquidity, and Financing Obligations"
    body: "Carro closed FY2025 with S$385 million (US$287 million) in total balance sheet liquidity and S$1.3 billion in total assets, underpinned by an audited EBITDA of S$43 million (US$32 million). Forward capital adequacy is supported by institutional and strategic funding, including a US$60 million investment led by the Japanese sovereign fund Cool Japan Fund in September 2025 and a US$55.5 million debt financing facility provided by HSBC in June 2024. However, Carro's asset-heavy retail inventory model requires substantial working capital to fund vehicle intake and reconditioning pipelines across eight APAC territories. The company's fintech subsidiary, Genie Financial Services, grew its consumer loan book by 35% in FY2025 to S$670 million while maintaining non-performing loans below 0.5%. Managing wholesale warehouse borrowing costs and matching facility maturities against consumer installment collections remain essential to avoiding balance sheet strain during interest rate fluctuations."
    claimRefs:
      - "CI003"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI012"
      - "CI014"
  - id: "financial-verdict-and-underwriting-blockers"
    title: "Financial Verdict, Underwriting Risks, and Diligence Blockers"
    body: "Carro demonstrates genuine commercial scale and positive operating leverage, distinguishing itself from venture-backed automotive peers that struggled with cash burn. The expansion of group gross profit to S$149 million (12.4% margin) validates the strategic thesis that embedded financial services and aftermarket maintenance can convert volatile vehicle trading into a predictable recurring earnings stream. Nevertheless, several private financial disclosures represent material diligence blockers for institutional underwriters. Neither customer acquisition costs (CAC) nor cohort lifetime value (LTV) curves are disclosed publicly, obscuring the underlying marketing efficiency of retail showroom expansion. Furthermore, the detailed terms, covenants, and collateral pledges of Carro's debt facilities and floorplan credit lines remain private. Investors underwriting Carro's prospective public listing must verify facility renewal conditions and confirm that loan default rates remain resilient across developing Southeast Asian markets."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI015"
