  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Spend Classification
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Carro spans far beyond traditional online vehicle classifieds, encompassing an
              integrated automotive commerce and mobility ecosystem across Southeast Asia and the wider Asia-Pacific
              region. Rather than operating purely as an advertising directory connecting buyers with unverified private
              sellers, Carro establishes a closed-loop platform that captures value across vehicle retail, wholesale
              dealer transactions, digital financing, insurance distribution, and aftersales maintenance. The core
              boundary comprises verified used-vehicle transactions, brand-new passenger car distribution in select
              territories, proprietary dealer inventory floorplanning, and consumer lending originations. Conversely,
              the market boundary explicitly excludes uncertified peer-to-peer private listings, uninspected informal
              auctions, and third-party independent repair workshops operating outside certified refurbishment
              standards. By formalizing and digitizing previously fragmented used-car transactions across Singapore,
              Malaysia, Indonesia, Thailand, Hong Kong, Taiwan, and Japan, the platform captures multi-layered revenue
              streams across the vehicle lifecycle.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
      - number: '2.2'
        title: TAM, SAM, and Multi-Lens Addressable Sizing
        blocks:
          - type: paragraph
            body: >-
              Evaluating Carro's market opportunity requires multiple analytical sizing lenses rather than a single
              speculative gross merchandise value figure. Across its seven operational markets, Carro transacts more
              than 100,000 vehicles annually, establishing substantial transaction density in high-value automotive
              hubs. In parallel, automotive fintech represents an independent addressable pool that significantly
              expands the company's serviceable market; Genie Financial Services has originated an active loan book
              exceeding SGD 500 million, unlocking recurring financial margin alongside transaction fees. Financial
              press disclosures surrounding potential U.S. public market listings indicate management and advisers have
              targeted an equity valuation exceeding US$3 billion anchored against a projected annual EBITDA run-rate of
              US$100 million. However, sizing precision remains constrained by the opacity of country-level gross
              merchandise volumes, varying subprime credit penetration rates, and mixed disclosure regarding retail
              versus wholesale margin realization across emerging and developed territories.
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM002
