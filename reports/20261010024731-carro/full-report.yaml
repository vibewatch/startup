              - CI005
              - CI010
      - number: '4.3'
        title: Capital Adequacy, Balance Sheet Liquidity, and Financing Obligations
        blocks:
          - type: paragraph
            body: >-
              Carro closed FY2025 with S$385 million (US$287 million) in total balance sheet liquidity and S$1.3 billion
              in total assets, underpinned by an audited EBITDA of S$43 million (US$32 million). Forward capital
              adequacy is supported by institutional and strategic funding, including a US$60 million investment led by
              the Japanese sovereign fund Cool Japan Fund in September 2025 and a US$55.5 million debt financing
              facility provided by HSBC in June 2024. However, Carro's asset-heavy retail inventory model requires
              substantial working capital to fund vehicle intake and reconditioning pipelines across eight APAC
              territories. The company's fintech subsidiary, Genie Financial Services, grew its consumer loan book by
              35% in FY2025 to S$670 million while maintaining non-performing loans below 0.5%. Managing wholesale
              warehouse borrowing costs and matching facility maturities against consumer installment collections remain
              essential to avoiding balance sheet strain during interest rate fluctuations.
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI009
              - CI012
              - CI014
      - number: '4.4'
        title: Financial Verdict, Underwriting Risks, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Carro demonstrates genuine commercial scale and positive operating leverage, distinguishing itself from
              venture-backed automotive peers that struggled with cash burn. The expansion of group gross profit to
              S$149 million (12.4% margin) validates the strategic thesis that embedded financial services and
              aftermarket maintenance can convert volatile vehicle trading into a predictable recurring earnings stream.
              Nevertheless, several private financial disclosures represent material diligence blockers for
              institutional underwriters. Neither customer acquisition costs (CAC) nor cohort lifetime value (LTV)
              curves are disclosed publicly, obscuring the underlying marketing efficiency of retail showroom expansion.
              Furthermore, the detailed terms, covenants, and collateral pledges of Carro's debt facilities and
              floorplan credit lines remain private. Investors underwriting Carro's prospective public listing must
              verify facility renewal conditions and confirm that loan default rates remain resilient across developing
              Southeast Asian markets.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
              - CI009
              - CI010
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High-margin ancillary flywheel transforms unit profitability
            body: >-
              Carro's strategic shift from a transactional used car marketplace to an integrated automotive ecosystem
              has fundamentally reshaped its margin profile. By deriving over 70% of gross profit from recurring
              financing, extended warranties, and digital insurance, the company generates durable post-sale cash flow
              that decouples overall profitability from cyclical swings in used car prices.
            calloutType: strength
            claimRefs:
              - CI004
              - CI005
              - CI007
          - type: callout
            title: Working capital requirements and inventory valuation exposure
            body: >-
              Operating as an asset-heavy retailer requires substantial capital expenditure to procure and hold vehicle
              inventory across eight regional markets. If regional automotive demand softens or benchmark interest rates
              remain elevated, used vehicle depreciation and floorplan financing costs could compress blended gross
              margins and strain balance sheet liquidity.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Ecosystem Scope and Commercial Product Portfolio
        blocks:
          - type: paragraph
            body: >-
              Carro delivers an end-to-end digital automotive ecosystem designed to address the deep fragmentation and
              information asymmetry of used-car markets across Southeast Asia and the broader Asia-Pacific region.
              Rather than operating purely as a lightweight advertising classifieds directory, the company integrates
              online direct-to-consumer vehicle retail, digital auction liquidation for wholesale dealers, captive
              automotive financing through Genie Financial Services, digital insurance brokerage, and physical
              refurbishment operations under Carro Care. In fiscal 2026, the company reported transacting over 120,000
              new and used vehicles across eight regional markets. To expand its addressable transaction volume beyond
              Certified Pre-Owned vehicles, Carro broadened its product line in 2025 to include brand-new vehicles in
              Singapore and Malaysia, leveraging its existing digital distribution infrastructure and dealer financing
              rails.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: Algorithmic Valuation, Inspection, and Retail Workflows
        blocks:
          - type: paragraph
            body: >-
              The core operational workflow begins with vehicle acquisition and automated appraisal, replacing
              subjective dealer negotiations with standardized digital diagnostics and dynamic pricing models. Vehicles
              admitted to Carro's retail inventory undergo a comprehensive 160-point mechanical inspection covering
              structural integrity, engine performance, electronics, and cosmetic condition. Inspection findings are
              ingested directly into Carro's proprietary pricing algorithms, which synthesize historical auction
              clearing prices, real-time regional demand elasticity, and refurbishment cost estimates to generate
              binding instant quotes for sellers. Certified vehicles are subsequently refurbished through in-house Carro
              Care workshops to standardize vehicle quality before listing. On the buyer side, the digital platform
              provides 360-degree digital inspection views, transparent pricing without hidden dealer markups, and
              end-to-end digital title transfer, while regional acquisitions such as Beyond Cars in Hong Kong and Kaidee
              in Thailand provide local marketplace liquidity.
            claimRefs:
              - CE004
              - CE006
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE006
              - CE010
      - number: '5.3'
        title: Technology Architecture, Engineering, and Partner Integration
        blocks:
          - type: paragraph
            body: >-
              Carro's underlying software architecture is structured across multi-tier interaction portals, valuation
              engines, fintech loan processing pipelines, and physical workshop telematics systems. Core engineering,
              product management, and platform development functions are centralized in regional development hubs in
              Malaysia, while local operations support aftersales, inspection estimators, and workshop foremen across
              Klang Valley and international locations. On the fintech layer, Genie Financial Services integrates
              proprietary machine-learning credit scorecards with institutional financing partners, exemplified by a
              multi-market partnership with Japan's Orient Corporation (Orico) to scale automotive credit in Japan,
              Thailand, and Indonesia. Beyond consumer transactions, platform distribution supports specialized B2B
              integration paradigms, mirroring modern enterprise catalog networks that rely on standardized document
              exchange and automated SFTP protocols to maintain synchronicity across disparate dealer dealer-management
              systems.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE008
              - CE009
      - number: '5.4'
        title: Technical Governance, Valuation Defensibility, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Carro's long-term technical defensibility requires distinguishing software-driven operational
              leverage from balance sheet inventory and financing risks. While secondary marketplace data platforms
              benchmark Carro against global online automotive retailers such as Kavak, CarDekho, and Moladin, private
              market investors must navigate public entity confusion with unrelated entities, such as US-based
              collaborative commerce platform Carro. More critically, Carro's financial performance depends directly on
              the predictive accuracy of its algorithmic pricing and credit underwriting engines. In a rising interest
              rate environment or regional macroeconomic downturn, unobserved model drift, adverse selection, or
              inaccurate residual value depreciation curves could trigger rapid inventory margin compression and
              elevated loan defaults across developing market portfolios, highlighting the need for deeper technical
              verification of internal risk scorecards.
            claimRefs:
              - CE011
              - CE012
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertically Integrated Automotive Ecosystem Moat
            body: >-
              Carro's integration of algorithmic valuation, digital retail, proprietary financing through Genie
              Financial Services, and in-house physical refurbishment via Carro Care creates a self-reinforcing flywheel
              that captures margin across every stage of the vehicle ownership lifecycle, differentiating it from
              asset-light classifieds.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE004
          - type: callout
            title: Algorithmic Pricing and Credit Underwriting Blind Spots
            body: >-
              Because Carro holds vehicle inventory and underwrites automotive loans across diverse developing markets
              (including Thailand and Indonesia), any systemic inaccuracy in its proprietary pricing models or credit
              risk scoring could result in sudden inventory write-downs and loan provisioning shocks.
            calloutType: risk
            claimRefs:
              - CE004
              - CE006
              - CE014
          - type: callout
            title: Strategic Financial Partner Integration
            body: >-
              The strategic investment and technical partnership with Japan's Orient Corporation (Orico) provides Carro
              with institutional credit underwriting expertise and co-financing capabilities, strengthening its
              international distribution across Japan, Thailand, and Indonesia while mitigating direct balance sheet
              exposure.
            calloutType: insight
            claimRefs:
              - CE007
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Architecture and Segment Economics
        blocks:
          - type: paragraph
            body: >-
              Carro organizes its commercial operations across three primary customer segments: retail car buyers and
              sellers (B2C/C2B), small and medium enterprises (SMEs) requiring commercial mobility and fleet leasing,
              and independent automotive dealerships sourcing wholesale inventory (B2B). In the consumer retail segment,
              Carro targets middle-income vehicle owners and buyers across core Southeast Asian markets including
              Singapore, Malaysia, Indonesia, and Thailand, expanding into Hong Kong and Japan. Retail monetization is
              driven by vehicle margin markups, extended warranty packages, and captive automotive financing origination
              through its wholly owned subsidiary Genie Financial Services. In contrast, the wholesale dealership
              segment engages independent used-car lots seeking trade-in liquidations and auction sourcing via digital
              inspection clearinghouses such as Carro Auction in Thailand. Meanwhile, the SME and corporate fleet tier
              relies on long-term vehicle leasing and mobility management, supplemented by operational refurbishment
              services provided through Carro Care workshops. However, public disclosures do not report customer counts,
              cohort retention curves, or revenue concentration by segment, leaving underwriting visibility heavily
              dependent on aggregate vehicle run rates.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU012
              - CU014
      - number: '6.2'
        title: Adoption Trajectory, Transaction Velocity, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Adoption across Carro's digital marketplace has scaled from early regional traction into an annualized
              transaction volume surpassing 100,000 to 120,000 vehicle units across up to 8 regional markets. Historical
              milestones demonstrate rapid expansion: in FY2022, Carro recorded S$650 million in revenue and reached a
              run-rate exceeding S$1.3 billion, with Thailand alone contributing approximately 35,000 units annually and
              Indonesia delivering nearly S$40 million in annualized EBITDA. By FY2025, annual group revenue reached
              S$1.2 billion, supported by sustained regional demand for certified pre-owned vehicles and the
              introduction of brand-new vehicles in Singapore and Malaysia. In September 2025, strategic capital from
              Cool Japan Fund further targeted the promotion of Japanese vehicles and Plug-in Hybrid Electric Vehicles
              (PHEVs) across Southeast Asia, citing rising middle-class disposable income and regional EV subsidies.
              Despite these reported unit and revenue volumes, critical denominator metrics—including active transacting
              user counts, monthly active app users, and customer acquisition costs (CAC) per completed retail
              delivery—remain unverified outside management commentary.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
              - CU013
      - number: '6.3'
        title: Commercial Case Evidence, Deployment Boundaries, and Brand Disambiguation
        blocks:
          - type: paragraph
            body: >-
              Evaluating named customer evidence requires careful separation between Singapore-headquartered automotive
              marketplace Carro (carro.co) and unrelated third-party software entities sharing the 'Carro' trademark.
              Specifically, US-based e-commerce platform GetCarro (getcarro.com) publishes dropship retail case studies
              featuring consumer brands such as Vanity Planet, Glow Recipe, and Pacsun, while UK-based dealer software
              provider Carro Systems (carro.systems) documents CRM deployments across British dealerships. In contrast,
              automotive marketplace Carro's direct commercial proof manifests through institutional and enterprise
              partnerships, such as automotive financing distribution alliances with Japanese consumer credit group
              Orient Corporation (Orico) across Japan, Thailand, and Indonesia, and consumer trade-in networks across
              its 4,500-employee regional footprint. External market synthesis models estimate ancillary service
              customer retention at roughly 60% with net promoter scores (NPS) between 45 and 55, but verifiable named
              enterprise case studies for Carro's automotive fleet leasing and wholesale auctions remain proprietary.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Customer Durability, Ecosystem Attachment, and Structural Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Customer durability in full-stack automotive retail is governed by the structural disparity between
              low-frequency vehicle transactions and high-margin recurring ancillary attach. While typical consumers
              replace vehicles only once every three to seven years, Carro seeks lifetime customer value expansion
              through ancillary attach: financing via Genie Financial Services, motor insurance brokerage, and ongoing
              repair and maintenance at Carro Care service centers. In FY2022, Genie's loan book exceeded S$400 million
              with non-performing loan (NPL) ratios below 0.1%, expanding past S$670 million by FY2025 as ancillaries
              generated over 55% of group gross profit. Nonetheless, customer concentration and retention present
              notable vulnerabilities. Independent wholesale dealers exhibit low platform loyalty, routinely
              multi-homing across competing platforms such as Carsome or local auction houses to secure optimal
              wholesale pricing. Furthermore, the absence of public cohort retention figures, customer churn data, or
              geographic revenue breakdowns prevents institutional investors from stress-testing customer lifetime value
              against rising consumer credit defaults in volatile emerging markets.
            claimRefs:
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Transactional Dealership Multi-Homing and Sourcing Vulnerability
            body: >-
              Wholesale automotive dealerships and individual vehicle sellers across Southeast Asia maintain
              multi-homing relationships across competing platforms, leaving B2B marketplace transaction velocity
              exposed to competitor subsidies and dealer inventory switching.
            calloutType: risk
            claimRefs:
              - CU003
              - CU014
          - type: callout
            title: Ancillary Attach Overcoming Low Vehicle Purchase Frequency
            body: >-
              Because retail car purchases occur infrequently, Carro's customer unit economics depend on cross-selling
              fintech financing, motor insurance, and Carro Care aftermarket maintenance to convert one-off vehicle
              buyers into multi-year ecosystem revenue streams.
            calloutType: insight
            claimRefs:
              - CU002
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Frameworks, Cross-Border Licensing, and Intellectual Property Scrutiny
        blocks:
          - type: paragraph
            body: >-
              Operating across eight Asia-Pacific jurisdictions—including Singapore, Malaysia, Indonesia, Thailand, Hong
              Kong, and Japan—exposes Carro to fragmented national regulatory regimes governing motor vehicle
              distribution, consumer credit, and data privacy. In each geography, operations require specialized dealer
              licenses, financial institution partnerships, and statutory registrations, anchored by parent entity
              TRUSTY CARS LTD. in Singapore. Beyond baseline compliance friction, intellectual property and commercial
              litigation represent an ongoing risk vector. Co-founder and CEO Aaron Tan disclosed that rival automotive
              operators have actively initiated legal challenges, specifically accusing Carro of alleged copyright
              infringement in calculated attempts to slow platform growth and obstruct critical operating applications.
              In cross-border automotive e-commerce, unresolved copyright claims and licensing disputes pose direct
              threats to software deployment timelines and institutional investor confidence during pre-IPO prospectus
              reviews.
            claimRefs:
              - CR001
              - CR002
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
      - number: '7.2'
        title: Operational Execution, Inspection Accuracy, and Reconditioning Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              Carro's value proposition relies on technological and operational capabilities to turn over pre-owned
              vehicle inventory in under 60 days. To support this turnover velocity, the group employs over 4,500
              personnel across engineering, retail sales, and specialized aftersales workshops (Carro Care), managing
              physical vehicle intake, reconditioning, and parts harvesting. Quality assurance depends heavily on
              proprietary inspection algorithms incorporating computer vision and acoustic sensor analysis to evaluate
              vehicle wear, detect defects, and price units dynamically. However, algorithmic screening introduces
              operational fragility: if automated diagnostic tools fail to identify structural chassis damage,
              transmission flaws, or odometer tampering, Carro absorbs direct warranty liabilities under its customer
              guarantees (three-to-seven-day moneyback return policies and 30-day warranties). Furthermore, unattended
              vehicle access programs such as Showroom Anywhere—which permit self-directed vehicle inspection via IoT QR
              code unlocking without on-site sales staff—introduce municipal parking friction and physical security
              exposures.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
      - number: '7.3'
        title: Financing Counterparty Exposure, Bank Credit Lines, and Floorplan Dependencies
        blocks:
          - type: paragraph
            body: >-
              Carro's profitability and capital velocity are deeply tied to financial counterparty relationships. Unlike
              asset-light classifieds portals, Carro's captive fintech business, Genie Financial Services, originates
              customer loans and wholesale floorplan lines requiring dedicated debt facilities. The platform has secured
              significant third-party capital, including a $55.5 million conventional debt line from HSBC in June 2024
              and strategic financing alliances with Japanese consumer credit giant Orient Corporation (Orico) across
              Japan, Thailand, and Indonesia. Additionally, sovereign capital from the Cool Japan Fund (US$60 million
              round) promotes Japanese automotive and plug-in hybrid vehicle flows. While Genie Financial reported
              strong credit performance with non-performing loan ratios under 0.1% in FY2022, sustaining sub-0.1%
              default levels across higher interest rate cycles represents a critical vulnerability. Any tightening of
              wholesale banking covenants or credit line withdrawals would constrain inventory acquisition and erode
              high-margin fintech earnings.
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Working Capital Fluctuations, Residual Price Shifts, and Pre-IPO Diligence Conflation
        blocks:
          - type: paragraph
            body: >-
              Carro carries balance-sheet vehicle principal risk, holding inventory while vehicles undergo
              reconditioning and marketing. Rapid fluctuations in used-car benchmark prices, regulatory shifts in
              vehicle ownership entitlements (such as Singapore's Certificate of Entitlement quota adjustments), or
              regional macroeconomic slowdowns can impair inventory values before retail disposal. In addition to
              vehicle market exposure, secondary trading and pre-IPO valuation discovery face external diligence
              confusion. Market intelligence platforms and private share exchanges, including EquityZen, frequently
              conflate Singapore-based automotive unicorn Carro with GetCarro, an unrelated US-based collaborative
              commerce and dropshipping software platform founded by David Perry. Unaccredited retail participants and
              secondary brokers conflating corporate registries and cap tables present due diligence friction as Carro
              approaches public market liquidity.
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR012
      - number: '7.5'
        title: Governance Oversight, Risk Monitoring Indicators, and Investment Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Evaluating Carro as a late-stage venture investment requires formalizing measurable kill criteria and risk
              monitoring dashboards. Historically, management has demonstrated crisis responsiveness; during the
              COVID-19 Circuit Breaker in Singapore, senior executives took voluntary salary cuts below S$5,000 monthly
              to preserve platform liquidity and protect employee compensation. Nevertheless, institutional underwriting
              ahead of potential dual listings in the United States and Singapore necessitates explicit thesis-break
              triggers. Core triggers include: (1) Genie Financial's NPL ratio rising above 1.5% across any regional
              vintage, indicating credit scoring failure; (2) inventory turnover stretching beyond 75 days, reflecting
              consumer demand contraction or pricing algorithm misalignment; and (3) formal legal injunctions or
              material intellectual property judgments arising from competitor copyright litigation that impede software
              deployments across core operating markets.
            claimRefs:
              - CR001
              - CR011
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR011
              - CR012
              - CR014
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Cross-Border Regulatory Fragmentation and Copyright Litigation Exposure
            body: >-
              Operating across 8 distinct Asia-Pacific jurisdictions exposes Carro to fragmented automotive dealer
              licensing and historical competitor copyright lawsuits that can slow expansion and pre-IPO regulatory
              approvals.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Credit Facility Sensitivity and Captive Fintech Loss Containment
            body: >-
              With debt facilities such as the $55.5M HSBC line and over S$400M in retail loans, sustaining Genie
              Financial's sub-0.1% NPL performance in elevated rate environments is critical to preserving platform
              solvency.
            calloutType: insight
            claimRefs:
              - CR007
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Recommendation and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              Carro presents a compelling operational footprint across Southeast Asia, having transacted over 120,000
              vehicles in FY2026 supported by more than 4,500 personnel. However, unverified private market chatter
              positioning the company at a US$3.0 billion valuation benchmark diverges sharply from independent tracking
              services that evaluate the asset at US$1.0 billion. In light of compressed global automotive platform
              trading multiples and the lack of audited public disclosures regarding EBITDA conversion, the risk-reward
              profile warrants a disciplined Track posture. Investors should avoid committing fresh capital at elevated
              private marks until formal audited registration statements validate sustainable operating profitability.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV013
              - CV014
      - number: '8.2'
        title: Financing History and Capital Structure Opacity
        blocks:
          - type: paragraph
            body: >-
              The company has demonstrated an established track record of securing equity capital from premier sovereign
              and institutional sponsors, amassing over US$600 million in total funding including a US$60 million round
              led by Cool Japan Fund in September 2025 and strategic backing from Orient Corporation. Complementing its
              equity capitalization, Carro carried S$500 million in balance sheet liquidity entering FY2023 along with
              extensive debt facilities for its Genie Financial Services loan book. Nonetheless, third-party databases
              reveal material record discrepancies, with platform aggregators citing US$546 million across fewer rounds,
              while speculative unicorn secondary portals redirect to unrelated domains without publishing verified cap
              table waterfalls or liquidation preference seniorities.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenario Analysis and Valuation Framework
        blocks:
          - type: paragraph
            body: >-
              Evaluating prospective investor outcomes across explicit scenarios illustrates substantial asymmetric
              downside under current macro automotive headwinds. In the base case, sustaining 120,000 to 130,000 annual
              unit transactions with stable financing spreads supports a normalized enterprise valuation range of US$1.8
              billion to US$2.2 billion. Achieving the bull case valuation of US$3.0 billion to US$3.5 billion demands
              accelerated unit expansion above 150,000 alongside high-teens EBITDA margins and seamless dual-listing
              execution. Conversely, a bear case triggered by used car price deflation, Genie loan delinquency spikes
              above historical 0.1 percent levels, or multiple compression toward 225 active market rivals compresses
              equity value to US$1.0 billion.
            claimRefs:
              - CV009
              - CV010
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Peer Comparables and Diligence Kill Triggers
        blocks:
          - type: paragraph
            body: >-
              Publicly listed digital automotive retailers and classifieds peers such as Autohome, Uxin, and broader
              e-commerce marketplaces trade at heavily discounted enterprise value multiples between 0.5x and 1.5x
              revenue, exerting severe downward gravitational pressure on Carro's targeted exit pricing. To bridge the
              gap toward a successful public offering, diligence must focus on four definitive kill triggers: sudden
              contraction in warehouse credit facilities, deteriorating vintage loss curves in credit portfolios,
              executive departures from the board, and onerous liquidation preference terms that subordinate common
              equity. Without resolution of these structural uncertainties, entry at private marks remains fundamentally
              uncompensated.
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Structure and Preference Overhang Uncertainty
            body: >-
              While Carro has raised over US$600 million across multiple rounds, the absence of public cap table
              disclosures obscures liquidation preferences and anti-dilution ratchets held by late-stage investors,
              creating potential downside risk for common equity in an IPO.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV013
          - type: callout
            title: Disciplined Entry Discipline on Headline Valuation Marks
            body: >-
              Investors should avoid anchoring to rumored US$3.0 billion private valuation marks given that independent
              benchmarks peg baseline valuation at US$1.0 billion and comparable public platforms trade at subdued
              revenue multiples.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV010
              - CV014
