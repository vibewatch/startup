              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI013
      - number: '4.2'
        title: Unit Economics, Gross Margin Flywheel, and Regional Disparities
        blocks:
          - type: paragraph
            body: >-
              The defining characteristic of Carro's financial evolution is its shift from low-margin vehicle trading
              toward an ecosystem-led recurring profit flywheel. While base vehicle retail transactions generate gross
              profit margins of 10% to 15%, more than 70% of Carro's total gross profit is now generated by high-margin
              ancillary services. Specifically, in-house auto loan financing and underwriting via Genie Financial
              Services represents 32% of group gross profit, extended warranties and servicing subscriptions contribute
              22%, and digital auto insurance brokerage and related add-ons deliver 18%. Unit economics diverge
              substantially by geography: in developed markets like Australia, Japan, and Singapore, higher vehicle
              ticket sizes and deep financing penetration enable gross profit per unit (GPU) margins between 15% and
              20%+, whereas fragmented dealer competition in emerging markets such as Thailand and Indonesia keeps GPU
              below 15%. Ongoing deployment of artificial intelligence across vehicle inspection and customer support
              has enabled a 15% workforce optimization via natural attrition over two years.
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI006
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
              - CI007
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
