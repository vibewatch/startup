    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Assumptions
      - Implied Valuation Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Annual unit volume expands beyond 150,000 units; EBITDA margins top 8%; successful dual US/SG IPO
        - US$3.0B - US$3.5B (2.0x - 2.3x EV/Sales on high retail & fintech attachment)
        - Market multiple compression in global automotive tech; regulatory delays in secondary listing
        - '20% probability: Requires flawless regional execution and favorable IPO market window'
      - - Base Case
        - Volume stabilizes at 120,000-130,000 units; modest single-digit EBITDA margin; delayed IPO or private round
        - US$1.8B - US$2.2B (1.2x - 1.5x EV/Sales benchmarked against profitable auto platforms)
        - Margin squeeze from higher cost of funds; persistent dealer competition in Indonesia and Thailand
        - '55% probability: Reflects current market multiples and regional automotive consumption patterns'
      - - Bear Case
        - >-
          Ecosystem revenue growth stalls; credit losses on Genie loan book rise; down-round or structured
          recapitalization
        - US$1.0B - US$1.2B (0.7x - 0.8x EV/Sales aligning with Tracxn conservative valuation mark)
        - Working capital exhaustion; liquidation preference overhang impairs junior equity holders
        - '25% probability: Triggered if debt facilities are curtailed or used car price deflation accelerates'
    notes: >-
      Scenario multiples benchmarked against international automotive e-commerce and fintech peers across prospective
      growth and margin trajectories.
