callouts:
  - calloutType: insight
    title: "Ecosystem Monetization Decouples Growth from Pure Vehicle Margins"
    body: "Carro's strategic pivot into in-house lending via Genie Financial Services and aftersales infrastructure addresses the structural bottleneck of thin retail vehicle margins in Southeast Asia. By capturing financing spreads, dealer inventory floorplanning, and aftersales maintenance, the platform expands its revenue capture per transacted vehicle well beyond traditional classified listings."
    claimRefs:
      - CM003
      - CM004
      - CM008
  - calloutType: risk
    title: "Cross-Border Credit Underwriting and Regulatory Complexity"
    body: "Automotive financing in Southeast Asia entails divergent regulatory frameworks across national jurisdictions. While Carro holds lending licenses in Singapore and Thailand, operating via multi-finance partnerships in Indonesia and scaling dealer credit across emerging markets exposes the loan book to local underwriting risks and potential default volatility during macroeconomic downcycles."
    claimRefs:
      - CM003
      - CM008
      - CM010
