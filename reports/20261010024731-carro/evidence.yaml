    diligencePath: >-
      Obtain formal litigation and regulatory disclosure schedules from legal counsel and underwriting banks during
      pre-IPO confirmatory diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: Detailed debt facility covenants and non-performing loan default thresholds
    missingEvidence: >-
      Full credit agreement documentation specifying debt covenant triggers, loan portfolio delinquency aging, and
