evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-capital-structure
    missingEvidence: >-
      Current cap table, voting rights, share class preferences, liquidation waterfalls, and preference overhang from
      SoftBank, Temasek, and Cool Japan Fund rounds.
    whyItMatters: >-
      Without cap table disclosure, common equity value cannot be established and potential downside liquidation
      preference seniority cannot be evaluated.
    diligencePath: Review pre-IPO capitalization table and investor shareholder agreements under formal non-disclosure agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: board-governance-and-key-person-retention
    missingEvidence: >-
      Formal board committee charters, independent director committee assignments, executive compensation structures,
      and key-person insurance covenants.
    whyItMatters: >-
      High executive dependence on CEO Aaron Tan and co-founders poses operational continuity risk if key-person
      succession plans and retention agreements are absent.
    diligencePath: >-
      Obtain corporate governance handbook, board minutes, and employment agreement schedules during underwriter due
      diligence.
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: operational-headcount-and-financial-reconciliation
    missingEvidence: >-
      Consolidated payroll and contractor schedules reconciling Carro's claimed 4,500+ staff against Tracxn's tracked
      1,274 entity headcount, alongside audited FY2025/FY2026 GAAP financial statements.
    whyItMatters: >-
      Investors must verify whether operating expenses reflect full subsidiary headcount and assess true operating
      leverage ahead of public market pricing.
    diligencePath: >-
      Request audited regional subsidiary payroll registers and audited consolidated financial statements from Carro's
      financial advisory team.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-som
    missingEvidence: >-
      Audited country-by-country transactional volume and market share figures across Southeast Asia to calculate exact
      SOM penetration against local dealer totals.
    whyItMatters: >-
      Prevents precise verification of Carro's market share relative to Carsome and traditional dealership networks
      across Indonesia, Thailand, and Malaysia.
    diligencePath: Request audited geographical transaction breakdown and GMV splits per territory during pre-IPO prospectus review.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: minor
    topic: valuation-benchmarks
    missingEvidence: >-
      Finalized pre-IPO underwriting range confirming whether the targeted US$3 billion valuation reflects current
      market multiples or historical Series C benchmarks.
    whyItMatters: >-
      Affects sizing translation into revenue multiples and public market pricing expectations for regional auto-tech
      listings.
    diligencePath: Review confidential F-1 draft filings or investment banking syndicate syndication decks upon submission.
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: >-
      Comprehensive disclosure of Genie Financial Services credit facility sizes, lender syndicate details, interest
      margins, maturity schedules, and debt covenants.
    whyItMatters: >-
      Genie's S$670 million loan book represents a significant balance sheet commitment, and undisclosed wholesale
      funding costs or restrictive debt covenants could constrain lending capacity in a higher-rate environment.
    diligencePath: >-
      Request the full schedule of warehouse and credit facilities, borrowing base certificates, lender agreements, and
      loan book delinquency vintage curves in diligence.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited breakdown of unit-level customer acquisition cost (CAC), marketing payback period, organic vs paid lead
      share, and multi-year customer lifetime value (LTV).
    whyItMatters: >-
      While management reports strong gross margins and recurring ancillary contributions, underwriting sustainable unit
      profitability requires verifying organic retention and true ancillary attachment velocity by cohort.
    diligencePath: >-
      Review cohort retention curves, repeat transaction rates, and dealer vs retail customer acquisition accounting in
      the virtual data room.
    relatedQuestionRefs:
      - QI010
  - type: private-evidence-only
    severity: material
    topic: algorithmic-pricing-benchmarks
    missingEvidence: >-
      Quantitative backtesting records, valuation error distribution (MAE/RMSE), and algorithmic pricing variance
      relative to physical dealer auction clearing prices across regional markets.
    whyItMatters: >-
      Without independent accuracy benchmarks, underwriting teams cannot verify whether Carro's machine learning
      valuation achieves genuine margin defensibility or systematically overpays during market downturns.
    diligencePath: >-
      Request historical appraisal versus realized resale price logs, model calibration frequency reports, and outlier
      rejection rules from Carro's data science leadership.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: credit-underwriting-scorecard
    missingEvidence: >-
      Detailed technical documentation of Genie Financial Services' algorithmic credit scoring model, alternative data
      variables, bureau fallback logic, and regulatory underwriting compliance filings.
    whyItMatters: >-
      High reported portfolio health depends on algorithmic credit screening, but lack of transparency leaves lenders
      exposed to hidden adverse selection and regulatory scrutiny in Indonesia and Thailand.
    diligencePath: >-
      Review Genie's proprietary credit scoring risk architecture, default provisioning models, and external audit
      validation reports in technical due diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: platform-integration-sla
    missingEvidence: >-
      Public developer documentation, partner API integration specifications, and uptime SLA commitments for Carro's
      wholesale dealer bidding and inventory syndication platforms.
    whyItMatters: >-
      Platform liquidity relies on thousands of independent used-car dealers connecting seamlessly without inventory
      drift or bidding latency disruptions.
    diligencePath: >-
      Obtain dealer portal API specifications, system architecture diagrams, and service-level agreements from Carro's
      engineering leadership.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-cohort-retention-and-nrr
    missingEvidence: >-
      Audited customer cohort retention curves, repeat transaction percentages, and Net Retention Rates (NRR) for retail
      automotive buyers and leasing accounts.
    whyItMatters: >-
      Automotive transactions have long replacement cycles; absent cohort disclosures, customer lifetime value (LTV) and
      organic repeat rates cannot be validated against acquisition spend.
    diligencePath: >-
      Request confidential cohort retention tables split by vintage (FY2022-FY2026), buyer segment, and ancillary
      service re-contracting rates in an institutional data room.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-enterprise-and-dealer-proof
    missingEvidence: >-
      Verified client list, fleet scale, and contract tenure for corporate fleet leasing customers and top wholesale
      dealer accounts across Southeast Asia.
    whyItMatters: >-
      Public case study materials under the Carro brand primarily represent unrelated US/UK entities, obscuring Carro's
      genuine commercial customer concentration.
    diligencePath: >-
      Obtain an anonymized customer concentration schedule detailing the top 20 enterprise leasing accounts and top 50
      B2B wholesale dealership buyers by volume and revenue.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: active-account-denominators
    missingEvidence: Active transacting buyer and seller account counts, monthly transacting users, and unique credit borrower figures.
    whyItMatters: >-
      Unit transaction volume figures (>120,000 units) do not differentiate between multi-car dealer transactions and
      individual unique consumer households.
    diligencePath: >-
      Request management reporting on unique transacting customer identifiers, repeat transactor shares, and dealer
      account penetration across Singapore, Malaysia, Indonesia, and Thailand.
    relatedQuestionRefs:
      - QU002
  - type: private-evidence-only
    severity: material
    topic: Comprehensive regional litigation registry and regulatory compliance records
    missingEvidence: >-
      Complete schedule of active lawsuits, regulatory inquiries, consumer dispute filings, and vehicle financing
      licensing documentation across all 8 operating jurisdictions.
    whyItMatters: >-
      Unresolved copyright or commercial litigation and regulatory sanctions can impede cross-border expansion, banking
