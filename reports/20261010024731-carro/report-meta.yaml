companyProfile:
  summary: >-
    Carro is a Singapore-headquartered automotive ecosystem platform operating across Southeast Asia and East Asia,
    spanning certified used-car retail, wholesale dealer transactions, captive financing through Genie Financial
    Services, digital insurance, and aftersales servicing. The company has built scale through founder-led regional
    expansion, strategic sovereign and institutional backing, and a vertically integrated operating model that captures
    economics across the vehicle lifecycle. Publicly disclosed profitability improved materially in FY2025, but
    investors still lack full visibility into the cap table, financing covenants, customer concentration, and the exact
    path from current earnings to the rumored IPO valuation range.
