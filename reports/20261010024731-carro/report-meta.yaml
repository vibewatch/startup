  topStrengths:
    - Scaled regional footprint with over 120,000 annual vehicle transactions and a diversified APAC operating base.
    - >-
      Recurring ancillary revenue from financing, warranties, insurance, and aftersales improves earnings quality beyond
      vehicle trading.
    - Positive EBITDA and strong gross profit growth support an eventual public-market path.
  topRisks:
    - >-
      Capital structure, liquidation preference, and financing covenant opacity make downside protection hard to
      underwrite.
    - Customer concentration, retention, and unit-economics detail remain insufficiently disclosed.
    - Rumored valuation expectations appear stretched relative to public comparables and independent benchmarks.
  unresolvedGaps:
    - Current cap table, share classes, liquidation preferences, and any preference overhang remain undisclosed.
    - Loan facility sizes, covenants, maturities, and cure mechanics for Genie and floorplan lines are not public.
    - Customer, dealer, and account counts plus retention and renewal metrics are still not disclosed.
    - Board composition, governance committee detail, and prospectus-level disclosure remain incomplete.
    - The bridge from current profitability to the rumored IPO valuation range still lacks audited public support.
