  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance-and-capital-structure
      missingEvidence: Current cap table, voting rights, share class preferences, liquidation waterfalls, and preference overhang from SoftBank, Temasek, and Cool Japan Fund rounds.
      whyItMatters: Without cap table disclosure, common equity value cannot be established and potential downside liquidation preference seniority cannot be evaluated.
      diligencePath: Review pre-IPO capitalization table and investor shareholder agreements under formal non-disclosure agreement.
      relatedQuestionRefs:
        - QO008
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: material
      topic: board-governance-and-key-person-retention
      missingEvidence: Formal board committee charters, independent director committee assignments, executive compensation structures, and key-person insurance covenants.
      whyItMatters: High executive dependence on CEO Aaron Tan and co-founders poses operational continuity risk if key-person succession plans and retention agreements are absent.
      diligencePath: Obtain corporate governance handbook, board minutes, and employment agreement schedules during underwriter due diligence.
      relatedTableRefs:
        - TO002
    - type: conflicting-data
      severity: minor
      topic: operational-headcount-and-financial-reconciliation
      missingEvidence: Consolidated payroll and contractor schedules reconciling Carro's claimed 4,500+ staff against Tracxn's tracked 1,274 entity headcount, alongside audited FY2025/FY2026 GAAP financial statements.
      whyItMatters: Investors must verify whether operating expenses reflect full subsidiary headcount and assess true operating leverage ahead of public market pricing.
      diligencePath: Request audited regional subsidiary payroll registers and audited consolidated financial statements from Carro's financial advisory team.
      relatedTableRefs:
        - TO001
