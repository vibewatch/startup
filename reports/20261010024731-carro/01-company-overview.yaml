callouts:
  - calloutType: strength
    title: Multi-Sovereign Capitalization and Strategic Partnerships
    body: Carro has established deep institutional relationships with major regional sovereigns and state-backed funds, including Singapore's Temasek and EDBI, alongside Japan's government-backed Cool Japan Fund and Orient Corporation. This strategic investor base provides substantial regional legitimacy and cross-border commercial tailwinds for automotive distribution and financing.
    claimRefs:
      - CO007
      - CO008
      - CO009
  - calloutType: risk
    title: Valuation Benchmark Divergence Ahead of Public Listing
    body: A significant gap exists between private database valuations ($1.0 billion post-money on Tracxn) and public IPO aspirations ($3.0 billion target reported in 2026 press). Bridging this valuation differential will require transparent audited disclosures of unit economics, net income, and regional segment profitability.
    claimRefs:
      - CO010
      - CO011
  - calloutType: insight
    title: Workforce and Entity Perimeter Diligence Requirement
    body: Disclosed workforce scale varies widely across sources, ranging from 1,274 employees tracked by Tracxn to over 4,500 staff claimed in corporate releases across Asia-Pacific. Institutional investors must verify whether this delta reflects regional subsidiaries (such as myTukar, MPM Rent, and Kaidee) or contract retail personnel.
    claimRefs:
      - CO012
      - CO013
