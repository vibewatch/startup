      - number: '3.3'
        title: 变现架构、定价权与转换壁垒
        blocks:
          - type: paragraph
            body: >-
              汽车平台的变现分为直接库存销售的车辆毛利，以及高毛利配套业务。FY2025，Carro 营收 S$1.2 billion、毛利润 S$149 million，毛利率 12.4%；其中以 Genie
              Financial Services 金融科技放贷和保修服务为主的配套业务贡献了超过 55%
              的毛利润。配套模式的防御壁垒高于单纯车辆加价，因为消费贷款组合能够锁定多年利息和服务现金流。然而，零售消费者和独立经销商的转换成本仍然很低。卖车消费者和采购批发库存的经销商都会在竞争门户和线下拍卖间多平台经营，以最大化价格发现。经销商忠诚度取决于即时流动性、置换预付款比例和车辆周转速度，而不是独家软件集成。
            claimRefs:
              - CP009
              - CP010
              - CP011
