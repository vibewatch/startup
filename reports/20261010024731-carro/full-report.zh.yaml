      - CR010
      - CR011
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 支持背景
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 平台已达到规模化运营（覆盖 8 个市场、超过 120,000 辆），但缺乏公开价格发现
        - 保持观望；在投入资本前等待正式审计申报文件
      - - 信心
        - 中
        - 资本历史及债务额度已核实，但当前股权结构表及单位经济模型仍不透明
        - 在股权结构核实前，对乐观的表面估值打折
      - - 风险评级
        - 高
        - 营运资金占用高、竞争对手有 225 家，且债务契约尚未解决
        - 入场时要求明确的结构性保护及优先级保障
      - - 估值立场
        - 偏高
        - 传闻 US$3.0B 估值相较上市可比公司隐含激进的销售倍数
        - 在 EBITDA 拐点得到核实前，不按传闻 US$3.0B 表面价格参与
    notes: 估值立场及建议框架以截至 2026 年 10 月已报道的融资历史和区域市场动态为基准。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - id: TV002
    title: 正论 / 反论表
    columns:
      - 角度
      - 正论
      - 反论脆弱点
      - 什么会改变判断
    rows:
      - - 市场主导地位
        - 区域覆盖领先，已在 8 个亚太市场交易超过 120,000 辆
        - 面临 225 家活跃可比公司及分散本地经销商的激烈竞争
        - 独立市场份额数据证明其交易量领先优势仍在扩大
      - - 生态变现
        - 融合融资（Genie）、保险及售后服务的增值业务栈
        - 融资及信贷额度使资产负债表暴露于信贷损失及利率周期
        - 经审计的贷款组合表现显示 NPL 在宏观变化中持续低于 0.1%
      - - 资产负债表及资本
        - 已融资超过 US$600M，获得 SoftBank、Cool Japan Fund 及 Orico 的战略支持
        - 持续需要外部股权及债务额度来支撑车辆库存和贷款
        - 有证据表明无需依赖债务即可产生自我维持的有机经营现金流
      - - 估值及退出
        - 顶级机构出资方关注美国 / 新加坡双重上市，独角兽地位由此获得支撑
        - $1B 至 $3B 的私募估值若按公开市场倍数重估，下行空间显著
        - 已披露股权结构表显示普通股可清晰转换，不存在优先权悬置
    notes: 将核心投资正论驱动因素与运营、竞争及股权结构下行脆弱点进行对照。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 隐含估值逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 年度交易量扩大至超过 150,000 辆；EBITDA 利润率超过 8%；美国 / 新加坡双重 IPO 成功
        - US$3.0B - US$3.5B（高零售及金融科技附加率下 EV/Sales 为 2.0x - 2.3x）
        - 全球汽车科技市场倍数压缩；二次上市监管延误
        - 20% 概率：要求区域执行无瑕，并且 IPO 市场窗口有利
      - - 基准情景
        - 交易量稳定在 120,000-130,000 辆；EBITDA 利润率温和地处于个位数；IPO 延后或进行私募轮
        - US$1.8B - US$2.2B（参照盈利汽车平台，EV/Sales 为 1.2x - 1.5x）
        - 资金成本上升挤压利润率；印度尼西亚和泰国的经销商竞争持续
        - 55% 概率：反映当前市场倍数及区域汽车消费模式
      - - 悲观情景
        - 生态收入增长停滞；Genie 贷款组合的信贷损失上升；降价轮融资或结构化资本重组
        - US$1.0B - US$1.2B（与 Tracxn 保守估值标记一致，EV/Sales 为 0.7x - 0.8x）
        - 营运资金耗尽；清算优先权悬置损害次级股权持有人
        - 25% 概率：若债务额度被削减或二手车价格通缩加速，则会触发
    notes: 情景倍数以国际汽车电商及金融科技可比公司为基准，覆盖预期增长和利润率轨迹。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
