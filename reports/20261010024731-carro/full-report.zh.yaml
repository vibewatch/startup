              点检测，再通过认证数字展厅零售。批发拍卖中，公司向寻找精选库存的独立经销商收取交易费。定价由算法动态评估模型决定，吸收区域历史销量和实时需求，减少任意展厅加价，并在成熟市场维持每辆车的毛利润。
