      - number: '6.2'
        title: 采用轨迹、交易速度与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Carro 数字市场的采用规模已从早期区域势头扩大到每年在最多 8 个区域市场交易 100,000 至 120,000 辆车。历史里程碑显示扩张迅速：FY2022，公司营收 S$650
              million，运行速率超过 S$1.3 billion；仅泰国每年约贡献 35,000 辆，印度尼西亚年化 EBITDA 接近 S$40 million。到 FY2025，集团年度营收达到 S$1.2
              billion，得益于认证二手车的持续区域需求，以及新加坡和马来西亚新车业务的推出。2025 年 9 月，Cool Japan Fund
              的战略资本进一步推动日本汽车和插电式混合动力汽车（PHEV）在东南亚的推广，理由是中产阶级可支配收入上升及区域电动车补贴。尽管这些车辆和收入规模已被报告，活跃交易用户数、月活跃应用用户及每次完成零售交付的客户获客成本（CAC）等关键分母指标，除管理层评论外仍未得到核验。
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
