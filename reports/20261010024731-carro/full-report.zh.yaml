  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础架构与分部经济
        blocks:
          - type: paragraph
            body: >-
              Carro 的商业运营覆盖三类主要客户：零售汽车买家和卖家（B2C/C2B）、需要商用出行和车队租赁的中小企业（SME），以及采购批发库存的独立汽车经销商（B2B）。在消费者零售端，Carro
              面向新加坡、马来西亚、印度尼西亚和泰国等核心东南亚市场的中等收入车主和买家，并扩展到中国香港和日本。零售变现来自车辆加价、延长保修套餐，以及全资子公司 Genie Financial Services
              发放的自营汽车融资。批发经销商端则服务寻求置换清算和拍卖采购的独立车商，并通过泰国 Carro Auction 等数字检测清算平台完成交易。SME 和企业车队客户依靠长期车辆租赁和出行管理，并由 Carro
              Care 车间提供运营整备服务。然而，公开披露没有给出客户数、客户群留存曲线或分部收入集中度，投资判断只能高度依赖总体车辆交易速度。
            claimRefs:
              - CU001
              - CU002
              - CU003
