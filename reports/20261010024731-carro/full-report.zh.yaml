        - 基于 160 项检测数据的动态算法定价
        - 在线透明展示标价；针对老库存动态降价
        - 促销折扣有限；不定期提供置换奖励
        - 消除展厅随意打折，在发达市场保持 15%+ 的 GPU
      - - 批发拍卖平台
        - 向买方经销商收取分层交易费及买方溢价
        - 通过经销商竞价超过保留价门槛实现成交
        - 为高周转经销商合作方提供按交易量计算的费用返还
        - B2B 费用稳定性缓冲零售周期波动，并加快库存清理
      - - Genie 汽车贷款
        - 以区域央行利率为基准的风险调整后利率
        - 根据车辆价值和自有信用评分计算标准消费贷款 APR
        - 对部分认证库存提供补贴式初始利率
        - 自有信用引擎将 NPL 控制在 <0.5%，显著优于区域银行同业
      - - 延长保修与服务合同
        - 固定多年合同费或月度维护订阅费
