      - number: '4.2'
        title: 单位经济模型、毛利率飞轮与区域差异
        blocks:
          - type: paragraph
            body: >-
              Carro 财务演进的核心，是从低毛利车辆交易转向生态驱动的经常性利润飞轮。基础车辆零售交易的毛利率为 10% 至 15%，而如今 Carro 超过 70% 的总毛利润来自高毛利配套服务。具体而言，Genie
              Financial Services 的内部汽车贷款融资和信用评估贡献集团毛利润的 32%，延长保修和维修订阅贡献 22%，数字汽车保险经纪及相关增值服务贡献
              18%。不同地区的单位经济模型差异显著：澳大利亚、日本和新加坡等成熟市场车辆客单价更高、融资渗透更深，使每辆车毛利润率达到 15% 至 20%+；泰国和印度尼西亚等新兴市场经销商竞争分散，GPU 则低于
              15%。过去两年，人工智能持续用于车辆检测和客户支持，借助自然减员实现了 15% 的人员优化。
