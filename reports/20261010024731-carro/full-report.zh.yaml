            title: 多平台经销商网络的低转换壁垒
            body: 东南亚独立汽车经销商和个人卖家通常同时在多个平台挂牌库存并交叉报价置换车辆，竞争补贴和经销商库存切换严重限制了 Carro 在核心市场的定价权。
            calloutType: risk
