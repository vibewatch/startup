companyProfile:
  summary: >-
    Carro 是一家总部位于新加坡、覆盖东南亚和东亚的汽车生态平台，业务包括认证二手车零售、经销商批发交易、通过 Genie Financial Services
    提供的自营融资、数字保险和售后服务。公司依靠创始人主导的区域扩张、主权及机构资本支持，以及覆盖车辆全生命周期的垂直一体化模式做大规模。公开披露显示，公司 FY2025
    盈利能力显著改善，但投资者仍无法完整看清股权结构表、融资契约、客户集中度，以及当前盈利如何走向市场传闻中的 IPO 估值区间。
