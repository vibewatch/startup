        - id: n1
          label: 运营规模与覆盖范围
          detail: 在 8 个亚太市场交易超过 120,000 台，旗下拥有零售和金融科技业务
        - id: n2
          label: 融资与债务支持
          detail: S$500M 流动性和 S$200M 信贷额度支撑贷款账簿扩张
        - id: n3
          label: 资本流入验证
          detail: Cool Japan Fund 注资 US$60M 的 C 轮融资，并与 Orico 达成战略合作
        - id: n4
          label: 结构与估值摩擦
          detail: 股权结构表不透明、优先权未披露，估值标记在 $1B 与 $3B 之间存在分歧
        - id: n5
          label: 竞争与执行阻力
          detail: 市场上有 225 家竞争者，公开汽车可比公司以更低的销售倍数交易
        - id: n6
          label: 估值判断：偏高
          detail: 隐含的 $3.0B 预期缺乏公开倍数支持，除非经审计 EBITDA 出现拐点
        - id: n7
          label: 最终结论：跟踪
          detail: 在经审计的 IPO 文件和清晰的股权结构表出现前，继续保持审慎观望
      edges:
        - from: n1
