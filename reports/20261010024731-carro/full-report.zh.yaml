      - number: '6.3'
        title: 商业案例证据、部署边界与品牌区分
        blocks:
          - type: paragraph
            body: >-
              评估具名客户证据时，必须严格区分总部位于新加坡的汽车市场 Carro（carro.co），与使用“Carro”商标的无关第三方软件实体。美国电商平台 GetCarro（getcarro.com）发布了以
              Vanity Planet、Glow Recipe 和 Pacsun 等消费品牌为主角的代发零售案例；英国经销商软件供应商 Carro Systems（carro.systems）则记录了英国经销商的 CRM
              部署。相比之下，汽车市场 Carro 的直接商业证明来自机构及企业合作，例如与日本消费信贷集团 Orient Corporation（Orico）在日本、泰国和印度尼西亚开展汽车融资分销合作，以及覆盖其
              4,500 名区域员工网络的消费者置换渠道。外部市场综合模型估算配套服务客户留存率约为 60%，净推荐值（NPS）为 45 至 55；但 Carro 汽车车队租赁和批发拍卖的可核验具名企业案例仍属专有信息。
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: 客户持久性、生态黏性与结构性脆弱点
        blocks:
          - type: paragraph
            body: >-
              全栈汽车零售的客户持久性，取决于低频车辆交易与高毛利经常性配套业务之间的结构差异。普通消费者通常每 3 至 7 年才换车一次，Carro 则通过配套业务扩大客户终身价值：Genie Financial
              Services 融资、汽车保险经纪，以及 Carro Care 服务中心的持续维修保养。FY2022，Genie 贷款账簿超过 S$400 million，不良贷款（NPL）率低于 0.1%；到
              FY2025，贷款账簿超过 S$670 million，配套业务贡献集团毛利润超过 55%。但客户集中度和留存仍存在明显脆弱点。独立批发经销商对平台忠诚度低，经常在 Carsome
              或本地拍卖行等竞争平台多平台经营，以获得最佳批发价格。公开客户群留存、流失数据和地域收入拆分的缺失，也让机构投资者无法在波动的新兴市场中对照不断上升的消费信贷违约压力检验客户终身价值。
            claimRefs:
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 经销商多平台经营与采购脆弱性
            body: 东南亚批发汽车经销商和个人卖家在竞争平台之间保持多平台关系，使 B2B 市场交易速度暴露于竞争补贴和经销商库存切换。
            calloutType: risk
            claimRefs:
              - CU003
              - CU014
          - type: callout
            title: 配套业务克服低频购车
            body: 零售购车并不频繁，因此 Carro 的客户单位经济模型依赖交叉销售金融科技融资、汽车保险和 Carro Care 售后维护，把一次性买家转化为持续多年的生态收入。
            calloutType: insight
            claimRefs:
              - CU002
              - CU012
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管框架、跨境牌照与知识产权审查
        blocks:
          - type: paragraph
            body: >-
              Carro 在 8
              个亚太司法辖区运营，包括新加坡、马来西亚、印度尼西亚、泰国、中国香港和日本，因此暴露于管理机动车分销、消费信贷和数据隐私的碎片化国家监管制度。每个地区都需要专门的经销商牌照、金融机构合作和法定注册，并以新加坡母公司
              TRUSTY CARS LTD. 为基础。除基本合规摩擦外，知识产权和商业诉讼也是持续风险。据联合创始人兼 CEO Aaron Tan 披露，竞争汽车运营商据称已主动发起法律挑战，具体指控 Carro
              涉嫌版权侵权，意图拖慢平台增长并阻碍关键运营应用。在跨境汽车电商中，未解决的版权索赔和许可争议会直接威胁软件部署时间表，并削弱 IPO 前招股书审阅期间的机构投资者信心。
            claimRefs:
              - CR001
              - CR002
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
      - number: '7.2'
        title: 运营执行、检测准确性与整备瓶颈
        blocks:
          - type: paragraph
            body: >-
              Carro 的价值主张依靠技术和运营能力，把二手车库存周转控制在 60 天以内。为支持这一速度，集团在工程、零售销售和专业售后车间（Carro Care）雇用超过 4,500
              人，负责实体车辆接收、整备和零部件拆取。质量保证高度依赖结合计算机视觉和声学传感器分析的自有检测算法，用于评估车况、发现缺陷并动态定价。但算法筛查也带来运营脆弱性：如果自动诊断工具未能识别车身结构损坏、变速箱缺陷或里程表篡改，Carro
              就要承担客户保障项下的直接保修责任（三至七天无理由退款政策和 30 天保修）。此外，Showroom Anywhere 等无人值守车辆访问项目允许客户通过 IoT
              二维码解锁、自助检测车辆，但也引入市政停车摩擦和实体安全暴露。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
      - number: '7.3'
        title: 融资对手方敞口、银行授信与库存融资依赖
        blocks:
          - type: paragraph
            body: >-
              Carro 的盈利和资本周转与金融对手方关系深度绑定。不同于轻资产分类门户，Carro 的自营金融科技业务 Genie Financial Services
              发放客户贷款和批发库存融资额度，需要专门的债务工具。平台已获得大量第三方资本，包括 2024 年 6 月 HSBC 提供的 $55.5 million 常规债务额度，以及与日本消费信贷巨头 Orient
              Corporation（Orico）在日本、泰国和印度尼西亚建立的战略融资联盟。此外，Cool Japan Fund 的主权资本（US$60 million 轮融资）推动日本汽车和插电式混合动力汽车流通。虽然
              Genie Financial 报告 FY2022 不良贷款率低于 0.1%、信用表现强劲，但在更高利率周期中维持低于 0.1%
              的违约水平仍是关键脆弱点。批发银行契约收紧或授信额度撤回，都会限制库存收购并侵蚀高毛利金融科技盈利。
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: 营运资金波动、残值价格变化与 IPO 前尽调混淆
        blocks:
          - type: paragraph
            body: >-
              Carro
              承担资产负债表上的车辆本金风险：车辆翻新和营销期间，库存都由公司持有。二手车基准价格快速波动、车辆所有权相关权益的监管变化（例如新加坡拥车证配额调整），或区域宏观经济放缓，都可能在车辆零售处置前侵蚀库存价值。除车辆市场敞口外，二级交易和上市前估值发现也面临外部尽调混淆。包括
              EquityZen 在内的市场情报平台和私募股权交易所经常把总部位于新加坡的汽车独角兽 Carro，与 David Perry 创立、无关联的美国协作商务和代发货软件平台 GetCarro 混为一谈。随着
              Carro 接近公开市场流动性，未获认证的零售参与者和混淆公司注册信息与股权结构表的二级经纪商，都会增加尽调摩擦。
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR012
      - number: '7.5'
        title: 治理监督、风险监测指标与投资终止标准
        blocks:
          - type: paragraph
            body: >-
              把 Carro 作为后期风险投资标的评估，需要把可量化的终止标准和风险监测看板正式化。管理层过去展现出危机响应能力；新加坡 COVID-19“熔断”期间，高管自愿将月薪降至 S$5,000
              以下，以保住平台流动性并保障员工薪酬。不过，在美国和新加坡潜在双重上市之前，机构投资判断必须设定明确的论点失效触发器。核心触发器包括：（1）Genie Financial 在任何区域 vintage 中的 NPL
              比率升至 1.5% 以上，说明信用评分失灵；（2）库存周转拉长至 75 天以上，反映消费者需求收缩或定价算法错配；（3）竞争对手版权诉讼引发正式法律禁令或重大知识产权判决，阻碍公司在核心运营市场部署软件。
            claimRefs:
              - CR001
              - CR011
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR011
              - CR012
              - CR014
      - number: '7.6'
        title: 展品
        blocks:
          - type: callout
            title: 跨境监管碎片化与版权诉讼敞口
            body: 在亚太 8 个不同司法辖区运营，使 Carro 暴露于碎片化的汽车经销商许可要求及历史竞争对手版权诉讼，这些因素可能拖慢扩张和上市前监管审批。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 信贷额度敏感性与自营金融亏损控制
            body: 在利率走高环境下，面对 $55.5M HSBC 信贷额度和超过 S$400M 的零售贷款，维持 Genie Financial 低于 0.1% 的 NPL 表现，对守住平台偿付能力至关重要。
            calloutType: insight
            claimRefs:
              - CR007
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              Carro 在东南亚拥有颇具吸引力的运营版图，FY2026 交易车辆超过 120,000 辆，人员超过 4,500 人。不过，把公司估值定位在 US$3.0 billion
              的未经验证的私募市场传闻，与独立跟踪服务给出的 US$1.0 billion 估值大相径庭。在全球汽车平台交易倍数收缩、且 EBITDA 转化缺少经审计公开披露的背景下，风险收益比只支持纪律严明的 Track
              立场。在正式经审计的注册文件验证可持续经营盈利能力前，投资者应避免按偏高的私募估值投入新资本。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV013
              - CV014
      - number: '8.2'
        title: 融资历史与资本结构不透明
        blocks:
          - type: paragraph
            body: >-
              公司已建立从顶级主权和机构赞助方获取股权资本的记录，累计融资超过 US$600 million，其中包括 Cool Japan Fund 于 September 2025 牵头的 US$60 million
              轮融资，以及 Orient Corporation 的战略支持。除股权资本外，Carro 进入 FY2023 时资产负债表流动性为 S$500 million，并拥有支持 Genie Financial
              Services 贷款账簿的大量债务额度。然而，第三方数据库显示记录存在重大差异：平台聚合商在更少轮次中统计出 US$546
              million，而投机性的独角兽二级门户会跳转至无关域名，也不发布经核实的股权结构表或清算优先权顺位。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 情景分析与估值框架
        blocks:
          - type: paragraph
            body: >-
              在当前汽车宏观逆风下，按明确情景评估投资者潜在结果，显示下行风险高度不对称。基准情景中，年交易量维持在 120,000 至 130,000 辆、融资利差稳定，可支撑 US$1.8 billion 至 US$2.2
              billion 的正常化企业价值。要达到 US$3.0 billion 至 US$3.5 billion 的乐观情景估值，需要在顺畅完成双重上市的同时，把年交易量加速推至 150,000 辆以上，并实现高位十几的
              EBITDA 利润率。相反，若二手车价格通缩、Genie 贷款逾期率升至历史 0.1 percent 以上，或倍数向 225 家活跃市场竞争者的水平压缩，悲观情景会把股权价值压低至 US$1.0 billion。
            claimRefs:
              - CV009
              - CV010
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 可比公司与尽调终止触发器
        blocks:
          - type: paragraph
            body: >-
              Autohome、Uxin 等上市数字汽车零售商和分类信息同业，以及更广泛的电商平台，按收入 0.5x 至 1.5x 的大幅折价企业价值倍数交易，给 Carro
              的目标退出定价施加沉重下行压力。要弥合差距并成功公开发行，尽调必须盯住四个明确的终止触发器：仓储信贷额度突然收缩、信贷组合的 vintage
              损失曲线恶化、董事会高管离任，以及使普通股权益处于次位的不利清算优先权条款。若这些结构性不确定性无法解决，按私募估值入场在根本上得不到补偿。
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 资本结构与优先权悬置的不确定性
            body: Carro 虽已通过多轮融资筹得超过 US$600 million，但缺少公开股权结构表披露，导致晚期投资者持有的清算优先权和反稀释棘轮条款不透明，并可能给 IPO 中的普通股带来下行风险。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV013
          - type: callout
            title: 对市场关注估值的纪律性入场
            body: 鉴于独立基准将基础估值定在 US$1.0 billion、可比上市平台按低迷收入倍数交易，投资者不应锚定于传闻中的 US$3.0 billion 私募估值。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV010
              - CV014
