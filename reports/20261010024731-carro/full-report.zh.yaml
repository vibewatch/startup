      - number: '4.3'
        title: 资本充足性、资产负债表流动性与融资义务
        blocks:
          - type: paragraph
            body: >-
              Carro 以 S$385 million（US$287 million）总资产负债表流动性和 S$1.3 billion 总资产结束 FY2025，背后是经审计的 EBITDA S$43
              million（US$32 million）。未来资本充足性由机构及战略融资支持，包括 2025 年 9 月 Cool Japan Fund 领投的 US$60 million 投资，以及 2024 年 6 月
              HSBC 提供的 US$55.5 million 债务工具。然而，Carro 的重资产零售库存模式，需要大量营运资金支持 8 个亚太地区的车辆收购和整备流程。其金融科技子公司 Genie Financial
              Services 在 FY2025 将消费贷款账簿扩大 35% 至 S$670 million，同时把不良贷款控制在 0.5%
              以下。管理批发仓储借款成本，并让融资工具期限与消费者分期回款匹配，是避免利率波动造成资产负债表压力的关键。
