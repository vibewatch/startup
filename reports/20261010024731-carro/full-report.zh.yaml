        - 市场承压时削减信贷额度或收紧契约
        - 严重
        - 分散至 9+ 家全球及区域金融机构
        - 利率飙升或违反信贷契约时的再融资风险
      - - 战略汽车金融合作伙伴
        - Orient Corporation (Orico)
        - 日本、泰国、印度尼西亚的联合融资伙伴
        - 中等
        - 交易对手政策变化导致联合发放规模下降
        - 高
        - 长期战略股权及运营整合协议
        - 在日本核心基地以外扩大联合融资时执行延误
      - - 主权 / 战略股权出资方
        - Cool Japan Fund（METI 支持）
        - 领投方（US$60M 轮），推动日本 PHEV 车辆
        - 中等
        - 若消费者需求转向非日本 OEM 的 EV，可能出现战略摩擦
        - 中等
        - 包括 SoftBank 及主权基金在内的广泛国际投资者基础
        - 产品采购要求带来的治理协调约束
      - - 核心整备及车队实体
        - Carro Care & MPM Rent（印度尼西亚）
        - 自有车间网络及印度尼西亚租赁 / 出租业务
        - 高
        - Klang Valley 或雅加达等主要运营枢纽出现运营中断
        - 高
        - 拥有 4,500+ 名员工及本地化运营管理团队的网络
        - 易受当地劳资纠纷及设施租约续签影响
    notes: 按严重程度排序。评估对债务资本提供方、机构股权出资方、零售银行合作伙伴及检测技术的依赖。
