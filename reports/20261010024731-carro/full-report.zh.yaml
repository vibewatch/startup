      - number: '4.4'
        title: 财务结论、投资判断风险与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Carro 已形成真实商业规模和正向经营杠杆，与曾陷入现金消耗的风险投资汽车同业不同。集团毛利润扩大至 S$149 million（12.4%
              毛利率），验证了嵌入式金融服务和售后维护能够把波动的车辆交易转化为可预测的经常性盈利这一战略判断。然而，多项私人财务披露仍是机构投资者尽调的实质障碍。公司没有公开披露客户获客成本（CAC）或客户群生命周期价值（LTV）曲线，零售展厅扩张的底层营销效率因此不透明。此外，Carro
              债务工具和库存融资额度的详细条款、契约及抵押安排仍属私人信息。评估 Carro 潜在上市的投资者必须核实融资续期条件，并确认贷款违约率在东南亚发展中市场仍具韧性。
