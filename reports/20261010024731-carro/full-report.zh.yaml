      - number: '3.4'
        title: 护城河持久性、渠道力量与结构性竞争风险
        blocks:
          - type: paragraph
            body: >-
              Carro
              的长期竞争持久性面临经销商侧商品化、宏观利率变化和区域市场碎片化等结构性阻力。虽然公司已在新加坡、马来西亚、印度尼西亚、泰国、中国香港和日本形成显著地域规模，但亚太消费者汽车购买仍高度本地化，受各国车辆牌照、进口关税和银行监管约束。此外，外部市场情报平台经常把这家新加坡汽车独角兽与使用“Carro”品牌的无关实体混淆，例如美国电商跨店协作平台
              GetCarro。在核心汽车领域，传统金融机构、授权 OEM 经销商集团和新兴电动车直销模式都可能绕过中间市场平台。战略债务合作和证券化计划提供了必要流动性，但要在激烈区域定价竞争下维持 12%
              毛利率，就必须持续扩大自营融资和售后服务。
            claimRefs:
              - CP012
              - CP013
              - CP014
