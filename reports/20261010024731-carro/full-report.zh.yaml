chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与全栈汽车模式
        blocks:
          - type: paragraph
            body: >-
              Carro 于 2015 年由 Aaron Tan、Kelvin Chng 和 Aditya Lesmana
              创立，公司总部位于新加坡，已成为东南亚最大的汽车市场平台。公司运营覆盖车辆全生命周期的全栈数字生态，包括线上认证二手车零售、经销商批发交易、自有车辆检测与整备、通过 Genie Financial
              Services 提供的内部汽车融资、按使用计费的保险经纪和购车后的售后维护。Carro 覆盖新加坡、马来西亚、印度尼西亚和泰国等核心市场，并在日本、台湾、中国香港和澳大利亚设有扩张节点；它利用自有 AI
              估值算法、数字信用评分和标准化检测流程改造传统汽车交易。值得注意的是，自动化数据筛查工具经常把这家新加坡汽车独角兽与位于美国加州尔湾、名为
              Carro（getcarro.com）的无关电商软件供应商混为一谈，凸显机构尽调中严格区分公司实体的重要性。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO010
              - CO011
              - CO012
              - CO013
              - CO016
      - number: '1.2'
        title: 创始人、管理层与治理架构
        blocks:
          - type: paragraph
            body: >-
              Carro 的高管架构把创始人主导的运营创业能力，与专业企业金融和数据科学能力结合起来。集团 CEO Aaron Tan 负责公司战略、区域资本配置、战略合作和上市准备；联合创始人 Aditya Lesmana
              负责印度尼西亚市场扩张，Kelvin Chng 负责核心技术架构。CFO Ernest Chew 负责资产负债表管理、债务联合融资和 IPO 前审计控制；首席数据科学家 Dr. Bryan Tan
              的团队维护算法车辆定价引擎和支持 Genie Financial Services 的自动化信用评估系统。机构数据库的治理披露显示，SoftBank Vision Fund 通过 Chris Lee
              获得董事会席位，独立董事包括 Plern Suraphongchai 和 Wilfrid
              Foo。然而，详细委员会章程、独立董事多数地位、审计委员会监督参数及正式的关键人员留任契约仍未在公开渠道披露，这应成为潜在公开市场承销方的重点尽调事项。
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: 资本结构、机构支持者与估值动态
        blocks:
          - type: paragraph
            body: >-
              Carro 已调动超过 S$700 million 的股权资本，并获得由 SoftBank Vision Fund 2、新加坡主权实体 Temasek 和 EDBI、GIC、B Capital Group 及
              Mitsubishi Corporation 组成的优质机构投资者联盟提供的债务工具。2025 年 9 月，公司完成由日本政府支持的 Cool Japan Fund 领投的 US$60 million
              融资，以加速日本混合动力和电动车的跨境分销与融资。2026 年，日本消费金融机构 Orient Corporation（Orico）又投资
              Carro，目标是在日本、泰国和印度尼西亚开展联合汽车贷款。资本指标差异明显：独立市场数据供应商 Tracxn 给出的 Carro Series C 投后估值为 $1.0 billion，累计融资 $686
              million；而 2026 年中期的国际财经报道显示，管理层正筹备美国 IPO 与新加坡二次上市，目标募资 $500 million、估值 $3.0
              billion。由于近年完整合并财务报表严格保密，要用经审计的 GAAP 净利润率验证这一 $3.0 billion 目标仍然困难。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.4'
        title: 运营规模、区域里程碑与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Carro 的运营轨迹显示其地域和服务扩张很快：公司从 2015 年的新加坡数字分类信息市场，发展为 FY2026 在 8 个区域市场交易超过 120,000 辆新车和二手车的综合平台。关键节点包括 2017
              年推出 Genie Financial Services、收购马来西亚生态领军者 myTukar 并于 2024 年 3
              月完成全面品牌重塑，以及进入北亚市场。然而，运营规模指标存在需要投资者严格核实的重大披露差异。公司公告称，包括 Genie、Carro Care、MPM Rent 和 Kaidee 在内的子公司区域员工数超过
              4,500 人；Tracxn 则显示，截至 2026 年 3 月，注册公司实体层面只有 1,274
              名在职员工。这一差异可能来自总部员工与区域运营子公司的零售、检测、整备和物流人员之间的结构性区别，因此需要直接核验工资单范围。
            claimRefs:
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO008
              - CO009
              - CO010
              - CO014
              - CO016
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 多主权资本结构与战略合作
            body: >-
              Carro 已与新加坡 Temasek 和 EDBI、日本政府支持的 Cool Japan Fund 及 Orient Corporation
              等主要区域主权机构和国资基金建立深度机构关系。这一战略投资者基础为汽车分销和融资提供了显著的区域信誉及跨境商业助力。
            calloutType: strength
            claimRefs:
              - CO007
              - CO008
              - CO009
          - type: callout
            title: 上市前的估值基准分歧
            body: >-
              私人数据库估值（Tracxn 的投后 $1.0 billion）与公开 IPO 目标（2026 年媒体报道的 $3.0
              billion）之间存在明显差距。要弥合差异，需要透明、经审计的单位经济模型、净利润和区域分部盈利披露。
            calloutType: risk
            claimRefs:
              - CO010
              - CO011
          - type: callout
            title: 员工规模与实体边界尽调要求
            body: >-
              不同来源披露的员工规模差距很大：Tracxn 追踪到 1,274 名员工，而公司公告声称亚太地区员工超过 4,500 人。机构投资者必须核实这一差额究竟来自区域子公司（如 myTukar、MPM Rent 和
              Kaidee），还是合同制零售人员。
            calloutType: insight
            claimRefs:
              - CO012
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与支出分类
        blocks:
          - type: paragraph
            body: >-
              Carro 的可服务市场远超传统线上汽车分类信息，覆盖东南亚及更广泛亚太地区的一体化汽车交易与出行生态。Carro
              不只是把买家与未经核验的私人卖家连接起来的广告目录，而是搭建闭环平台，在汽车零售、经销商批发交易、数字融资、保险分销和售后维护各环节获取价值。核心边界包括经核验的二手车交易、部分地区的新乘用车分销、自有经销商库存融资和消费贷款发放；明确排除未经认证的点对点私人挂牌、未经检测的非正式拍卖，以及不符合认证整备标准的第三方独立维修厂。平台将新加坡、马来西亚、印度尼西亚、泰国、中国香港、台湾和日本此前碎片化的二手车交易正规化并数字化，在车辆全生命周期内获取多层收入流。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
      - number: '2.2'
        title: TAM、SAM 与多视角可服务规模
        blocks:
          - type: paragraph
            body: >-
              评估 Carro 的市场机会需要多种分析口径，而不是一个投机性的 GMV 数字。Carro 在 7 个运营市场每年交易超过 100,000
              辆车，在高价值汽车枢纽形成了较大的交易密度。与此同时，汽车金融科技构成独立的可服务市场，显著扩展了公司的服务范围；Genie Financial Services 已形成超过 SGD 500 million
              的活跃贷款账簿，在交易费之外打开了经常性金融利润。围绕潜在美国上市的财经披露显示，管理层及顾问以预计年化 EBITDA run-rate US$100 million 为锚，目标股权估值超过 US$3
              billion。不过，各国 GMV 的不透明、次级信贷渗透率差异，以及新兴和成熟市场零售与批发利润实现情况的披露混杂，仍限制了规模估算的精确度。
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM013
              - CM014
      - number: '2.3'
        title: 买家分层、工作流与预算归属
        blocks:
          - type: paragraph
            body: >-
              Carro
              汽车生态的采用由三类主要买家驱动，它们的采购流程和预算权限各不相同。零售消费者是主要需求引擎，寻找经过认证的机械可靠性、标准化车辆检测和即时融资审批，以替代非正式私人购买。对个人买家而言，购买决策直接取决于融资可得性；一体化月供计算器和数字贷款预批降低了前期现金门槛。独立二手车经销商是第二类核心客户，这些企业面临严重营运资金约束，依靠
              Carro
              的数字批发渠道和库存融资来高效补充库存。最后，企业车队和出行运营商构成机构客户层，需要结构化车辆租赁、车队管理软件集成和集中式售后支持。满足这些客户画像的不同需求，需要由本地展厅和检测中心的分布式运营人员支撑定制化数字流程。
            claimRefs:
              - CM003
              - CM006
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM009
              - CM012
      - number: '2.4'
        title: 增长催化剂、采用约束与监管现实
        blocks:
          - type: paragraph
            body: >-
              Carro 的市场轨迹受到长期增长驱动，但也受严格运营和监管约束。区域汽车需求受中等收入人群扩大、东南亚都市圈快速城市化，以及印度尼西亚和泰国等国推动电动车与插电式混合动力车的政策支持。Cool Japan
              Fund、SY Holdings 和 Orient Corporation
              等主权及机构资本合作，加快了先进车辆技术部署和跨境供应链融资。但多司法辖区监管碎片化严重限制采用：新加坡、马来西亚和印度尼西亚的汽车信用评估规则、数据驻留要求和金融牌照制度存在根本差异，无法形成统一的区域信用架构。此外，汽车交易天然重资产，需要充足资产负债表流动性、机构债务工具和实体整备网络，才能抵御竞争压力并守住运营质量。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM010
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 生态变现让增长不再只靠汽车利润
            body: >-
              Carro 通过 Genie Financial Services
              开展内部放贷，并建设售后基础设施，解决东南亚零售汽车利润薄的结构性瓶颈。平台捕获取融资利差、经销商库存融资和售后维护收入，使每辆交易车辆的收入捕获远高于传统分类信息平台。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM008
          - type: callout
            title: 跨境信用评估与监管复杂度
            body: >-
              东南亚汽车融资面对各国不同的监管框架。Carro
              在新加坡和泰国持有放贷牌照，在印度尼西亚通过多金融机构合作运营，并在新兴市场扩大经销商信贷；这些做法让贷款账簿暴露于本地信用评估风险，以及宏观经济下行期潜在的违约波动。
            calloutType: risk
            claimRefs:
              - CM003
              - CM008
              - CM010
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与同业分类
        blocks:
          - type: paragraph
            body: >-
              Carro 面对的竞争格局横跨东南亚和东亚四类运营商：直接的全栈认证二手车数字平台、传统全国性汽车分类门户、B2B 批发拍卖行，以及维持现状的非正式独立经销商网络。Tracxn 的区域基准数据显示，亚洲有超过
              225 家活跃汽车零售和市场平台竞争者，包括印度获得 $344 million 融资的 Droom、中国融资 $500 million 的 Uxin，以及新加坡 sgCarMart、印度尼西亚获得 $181
              million 风险投资支持的 Moladin
              等本土平台。单一市场分类网站靠广告展示或经销商订阅变现，而全栈运营商承担库存本金风险、管理实体整备并发放零售客户融资。因此，竞争边界不仅取决于数字获客效率，也取决于资本结构灵活性、批发车辆采购关系，以及库存融资和零售债务工具的成本。
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
      - number: '3.2'
        title: 运营范围、能力矩阵与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              将 Carro 与区域同业比较，可以看到资本密集度、定价透明度和客户转化基础设施之间的取舍。sgCarMart 或泰国分类网络 Kaidee
              等传统平台无需承担资产负债表库存风险，却能触达广泛消费者；但它们缺乏端到端交易确定性、质量保修和标准化数字检测。相较之下，Carro 和 Moladin
              等全栈平台把批发经销商置换门户与面向消费者的认证展厅结合起来。FY2026，Carro 在 8 个亚太市场交易超过 120,000
              辆新车和二手车，业务从东南亚核心区域扩展至日本和中国香港。为加快库存周转并承接批发置换流量，Carro 部署了集成车载诊断、声学、视觉和振动分析的自有 AI 车辆检测应用，报告平均客户服务响应时间低于 3
              分钟。此外，Cool Japan Fund 领投的 US$60 million 轮融资，以及与 Orient
              Corporation（Orico）的消费信贷联盟，为日本、泰国和印度尼西亚提供本地化批发及零售汽车融资渠道。
