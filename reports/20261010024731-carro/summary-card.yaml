    - Customer, dealer, and account counts plus retention and renewal metrics are still not disclosed.
    - Board composition, governance committee detail, and prospectus-level disclosure remain incomplete.
    - The bridge from current profitability to the rumored IPO valuation range still lacks audited public support.
