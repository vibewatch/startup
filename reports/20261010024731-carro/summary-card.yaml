  topStrengths:
    - Scaled regional footprint with over 120,000 annual vehicle transactions and a diversified APAC operating base.
    - >-
      Recurring ancillary revenue from financing, warranties, insurance, and aftersales improves earnings quality beyond
      vehicle trading.
    - Positive EBITDA and strong gross profit growth support an eventual public-market path.
  topRisks:
