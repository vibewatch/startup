  topStrengths:
    - Real product depth across MEMS, FOG, subsea, and lunar-navigation workflows reduces pure technology-risk concerns.
    - >-
      Public customer proof spans Hanwha, Rheinmetall, BHP, Intuitive Machines, and other named accounts rather than
      only vague pilots.
    - >-
      The business has meaningful scale signals, including more than 100,000 deployed systems and over 80% of revenue
      from the US and Europe.
    - >-
      Sovereign Australian manufacturing and ITAR-flexible positioning differentiate the company against slower legacy
      supply chains.
    - >-
      The March 2026 Series C provides credible external capital support for further manufacturing and regional
      expansion.
  topRisks:
    - >-
      The exact 2026 valuation and effective common-equity terms remain undisclosed even though public coverage
      references unicorn status.
    - >-
      Preferred equity in the round could make the common-equity outcome materially less attractive than the headline
      mark implies.
    - >-
      Public evidence still does not disclose gross margin, backlog, cash runway, or recurring support mix well enough
      for clean underwriting.
    - >-
      Customer concentration, program timing, and defense-procurement friction could make revenue more volatile than the
      public surface suggests.
    - >-
      Specialized manufacturing and export-control exposure create operational risk even if the company's ITAR-free
      story is real.
  unresolvedGaps:
    - Exact post-money valuation, liquidation preferences, anti-dilution terms, and other Series C cap-table mechanics.
    - Audited 2026 revenue conversion, gross margin, backlog, and cash-burn data at the consolidated level.
    - Customer concentration, repeat-order cadence, and program-duration visibility behind named logos.
    - Realized manufacturing lead times, yield, and field-reliability data at current scale.
    - Mix and durability of hardware, service, software, and support revenue streams.
