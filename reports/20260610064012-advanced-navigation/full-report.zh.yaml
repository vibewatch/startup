      - number: '3.3'
        title: 战略项目中的切换成本真实存在，但自主和采矿技术栈要软得多
        blocks:
          - type: paragraph
            body: >-
              最强竞争不对称不是原始传感器物理，而是分销力量。买家处在认证航空项目、长寿命防务平台或正式主承包商架构中时，Honeywell 和 Safran
              很难被替换。在这些场景里，信任来自既往资质、渠道准入、支持基础设施和监管接受度；即使不考虑技术重新验证和项目时间表，切换成本也很高。相反，采矿、机器人、自主系统和许多工业部署中的切换成本更低，因为集成商本就会混合
              GNSS、惯性、相机、lidar 和定制软件。公开来源反复把混合架构描述为常态，而不是纯惯性替代，因此多供应商并用和内部自研更可行。Advanced Navigation
              的采矿故事正是利用这种低锁定环境，强调平台无关集成、全车队部署，以及 GNSS
              掉线时减少停机。供应获取同样重要。市场页面把专用光纤、石英、出口管制和长校准周期列为门槛，这有利于拥有垂直整合或本土制造控制力的供应商。这也解释了为什么 Advanced
              Navigation、EMCORE、Honeywell 和 Safran 都以不同方式突出供应链可信度。
