        blocks:
          - type: paragraph
            body: >-
              公开记录指向一家技术差异化不寻常、运营复杂度也同样不寻常的公司。Boreas D70 和 D90 不是商品化模块：它们是 12-watt、2.8-kilogram 的 FOG INS 产品，围绕寻北性能、GNSS
              拒止、加固和军用标准营销。公司还在 Botany
              运营机器人制造设施，并在扩大制造能力，同时规划更多海外能力。这支持护城河和交付可信度，但也提醒投资者：毛利率取决于良率、校准吞吐、保修暴露、现场支持和营运资本，而这些都没有公开披露。Bain 2025
              年定价研究在这里相关：在 B2B 市场中，利润率能否守住，取决于公司能否顶住客户阻力和竞争来维护价格。竞争来源清楚说明了这种风险为什么存在。低端替代品更轻、更便宜、分销更广；SBG 和 VectorNav
              说明，战略级之外存在 ITAR-light 且成本有效的替代方案。公司在高难度任务中可能配得上溢价，但公开数据无法证明它实际多频繁地拿到这部分溢价。
