          - type: paragraph
            body: >-
              公司的商业动作更接近项目销售，而不是自助式软件。防务、采矿、航天和水下页面都在销售 GPS
              受拒止环境中的任务表现，官方材料则强调快速产品交付、技术现场能力和本地工程支持。这说明应用工程和集成工作是商业包的一部分，即便公开记录没有量化服务收入。公开牵引力有意义：公司称已部署超过 100,000
              套系统，超过 80% 收入来自美国和欧洲，并在进入 Series C 前实现三位数增长。Forbes 进一步报道，2026 年收入超过 US$100
              million，且自第九个月以来保持盈利。但经典承销指标——获客成本（CAC）、回本周期、胜率、平均销售周期、订单积压转化、留存和服务附着——均缺失。因此，本章可以展示销售效率和单位经济的代理指标，但不能用私有指标把代理指标转化为高置信度结论。
