      - number: '5.2'
        title: 可支撑架构是惯性优先、多传感器且重视集成
        blocks:
          - type: paragraph
            body: >-
              公司最强的技术故事不是它消除了所有外部依赖，而是从惯性核心出发，并为每个工作流叠加合适的辅助传感器。在 FOG 侧，Boreas 产品页描述了利用地球自转实现的寻北陀螺罗经能力，从而在航向初始化时去掉对 GNSS
              或磁力计的依赖；官方和第三方 2025 年发布内容则将 Boreas 50 描述为更小封装，但仍保留战略级定位逻辑。在 MEMS 侧，Certus 结合经校准的加速度计、陀螺仪、磁力计、压力传感、双天线 GNSS
              和基于 AI 的融合算法，为仍需要厘米级 RTK、时间同步和广泛协议支持的买家提供低 SWaP 层级。水下栈呈现同样模式。Hydrus 结合
              INS、DVL、USBL、声学和光学调制解调链路以及避障；手册则把部署分成独立航位推算模式，以及需要更好绝对定位时由 Subsonus
              辅助的任务。公开支持页面也显示出真实的集成商意图：多接口、基于浏览器的配置、内部日志、固件工具，以及 C/C++、Java 和 .Net SDK。需要谨慎的是，许多头部结果仍依赖辅助。最佳定位表现通常使用 RTK
              GNSS、双天线、DVL、USBL 或一次性水面校准，因此正确的承销框架是以惯性为中心的韧性架构，而不是神奇的纯惯性完美方案。
