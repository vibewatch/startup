  foundingLocation: Perth, Australia
  headquarters: Sydney, Australia
  productSummary: 产品组合覆盖 MEMS 与 FOG 惯性系统、GNSS/INS 产品、声学导航、Hydrus 微型 AUV，以及面向 GPS 受拒止或 GNSS 受拒止任务的 LUNA、Boreas X90 等月球或空间导航产品。
  customerFocus: 防务主承包商和机构、采矿与工业自主运营商、航天项目，以及在受争夺或基础设施薄弱环境中需要韧性导航的水下或海事用户。
  businessModel: 以硬件为主、报价驱动的任务型销售，叠加应用工程、支持和垂直项目，而不是标准化软件订阅模式。
