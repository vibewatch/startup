        - id: quote-led-solutioning
          label: 报价驱动解决方案
          detail: 官方产品页把买方引向定制报价，而不是公开结账价格。
        - id: product-family
          label: 配置化产品族
          detail: 收入可来自 MEMS 传感器、FOG INS、声学系统，或 Hydrus 这类载具。
        - id: manufacturing-and-test
          label: 制造 / 校准 / 测试
