        title: 客户集中度和采购不透明仍是核心尽调缺口
        blocks:
          - type: paragraph
            body: >-
              客户章节最难解决的问题是集中度。公开证据足以证明真实采用，但不足以量化业务对少数防务主承包商、项目或采矿运营商的依赖程度。80%
              收入来自美国和欧洲的披露有用，但它是区域层面，不是账户层面。公开具名客户名单也集中在采购负担重的行业，销售周期长、预算项目化，披露权往往在主承包商或政府买家手里，而不在组件供应商手里。Advanced
              Navigation
              明确用传统多年交付周期和供应商复杂性做对比营销，这意味着目标市场采购摩擦真实存在。材料包中的独立反向来源提供了背景：公共采购体系需要透明度、投诉机制和强监督，因为不透明授标和串通是反复出现的结构性风险。这并不会制造针对
              Advanced Navigation
              的公司特定指控，但确实强化了为什么缺少合同条款、续约数据和头部客户占比披露很重要。底线是，公开证据支持一个真实客户基础和若干生产项目，但投资者仍需要管理层数据，才能高置信度承销集中度、续约和从挑战赛到生产部署的转化风险。
