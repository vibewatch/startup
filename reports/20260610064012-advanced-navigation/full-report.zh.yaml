      - number: '3.4'
        title: 护城河更像中等强度而非坚硬壁垒，因为既有厂商信任和技术商品化都削弱排他性
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation 的乐观情景是连贯的，但比品类主导叙事窄。公开证据显示，公司在三方面确有差异化：它把可信 PNT 硬件与防务、采矿和航天的强垂直叙事绑定；强调 ITAR-free
              澳大利亚制造和相对传统供应商更快的交付周期；并覆盖惯性、光子、量子和水下技术，而不是只卖一只盒装传感器。反向证据同样重要。战略级份额仍集中在大型既有厂商手中。战术和工业品类面临 MEMS
              规模化、软件定义融合栈和更新光子主张带来的价格压力。公开标价仍不透明，难以证明溢价能力。Honeywell 收购 Civitanavi
              也说明，既有巨头在需要时可以收购补齐能力。净结果是：护城河看起来真实但有条件。出口灵活性、主权采购和部署速度重要时，Advanced Navigation
              可能胜出；但若没有关于胜率、资质周期、留存和差异化硬件背后成本结构的私有证据，公开证据并不支持强锁定投资逻辑。
