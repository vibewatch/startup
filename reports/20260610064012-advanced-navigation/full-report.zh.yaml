      - number: '6.2'
        title: 具名客户证据中 Hanwha 和 Rheinmetall 最强，BHP 与 Intuitive Machines 居中，Anduril、Boeing 和 Airbus 较薄
        blocks:
          - type: paragraph
            body: >-
              留存公开材料不支持把每个具名 logo 等量看待。Hanwha 和 Rheinmetall 是最干净的生产型证据，因为底层来源披露了单位数量、后续订单历史和现役防务项目。Hanwha 的 Redback
              订单明确为 138 套 Boreas D70；Rheinmetall 2024 年合作则被描述为 2021 年供应超过 200 套后的后续订单。这些证据明显强于简单点名。BHP
              是真实技术采用证据，但最好仍描述为挑战阶段验证：矿山试验在 BHP 的 Deep Mining Open Call 下开展，BHP 自己页面将 Advanced Navigation
              描述为获得支持的入围者之一，披露结果是性能基准，而不是生产车队采购。Intuitive Machines 也真实，但强度中等：有明确客户合作和客户引语，却没有公开经常性出货量。留存材料中最弱的是
              Anduril、Boeing 和 Airbus。Anduril 只出现在 2026 年客户名单中，没有项目细节。Boeing 出现在历史客户披露和后续信任声明中。Airbus
              只出现在较早披露中。这些名字值得记录，但不应升级为已确认的当前生产部署。
