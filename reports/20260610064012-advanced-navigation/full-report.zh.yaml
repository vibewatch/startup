      - number: '5.3'
        title: 信任和可靠性控制在产品层和悉尼制造层最强
        blocks:
          - type: paragraph
            body: >-
              公开证据对信任和质量有意义，但分布不均。产品层面，Boreas 页面引用 MIL-STD 461 和 810H 环境及电磁测试、IP67 防护、抗冲击和振动能力，以及长时内部日志。Certus、Orientus
              和 Spatial FOG Dual 都描述了健康监测、失稳预防或安全导向实时软件设计；文档门户展示了一个持续更新的支持页面，包含多款产品的当前手册、固件、3D 模型和
              SDK。第三方发布报道还增加了一个面向客户的信任信号：Advanced Navigation 称 Boreas 50
              可在数周而非数年内交付，并提供三年保修。制造故事同样是投资逻辑的异常核心部分。官方和独立来源将生产与研发能力放在 Sydney 和 Botany，把 UTS Tech Lab 设施与 DFOG
              扩产和研究商业化联系起来，并反复把公司描述为垂直整合。2025 年 9
              月扩张公告把这一逻辑延伸到英国、美国和欧洲卓越中心，目标是扩大制造、工程、支持、服务、质量保证和互操作性。缺口在于，公开信任证据在加固和支持工具上清楚得多，在公司级认证上弱得多。留存公开材料中没有 ISO
              9001、ISO 27001、AS9100、独立网络安全测试或 MTBF 披露，因此尽调视角应区分产品层加固能力和充分证明的企业质量体系。
