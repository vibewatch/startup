  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Advanced Navigation 放进完整的位置分析或地理空间软件市场来分析。相关市场更窄：当 GNSS 单独使用不足以保障安全、任务确定性或生产率时，买家会采用可信 PNT
              与惯性导航栈。公开市场页面和技术来源指向同一底层功能：用自包含的运动、姿态和位置追踪，在飞机、导弹、海上载具、地面平台、机器人和工业机械中桥接或替代退化的外部信号。因此，纳入支出池混合了 INS 硬件、集成
              GNSS/INS 系统、抗干扰组件、传感器融合，以及周边集成或校准工作。大部分商品手机 GPS、普通地图应用或通用云地理空间工具不在其中，除非它们作为相邻替代方案出现。不过替代方案仍重要。面对 GPS
              脆弱性，买家可以采用传统无线电导航辅助、DME、多星座接收器、LEO 增强、视觉或 LiDAR
              里程计，或者人工测绘和运营绕行。实际市场边界因此落在一个点上：运营方专门为韧性导航连续性付费，而不是为通用位置感知付费。
