  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 真实缓释措施旁边仍摆着转化、集中度或信任数据黑箱时，残余严重性最高。
    approximationNotes: 单元格是综合公开证据后给出的分析评级，考量可能性、影响和缓释成熟度，而不是公司发布的风险评分。
    claimRefs:
      - CR001
      - CR008
      - CR014
      - CR021
      - CR033
      - CR042
      - CR044
      - CR046
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余暴露
      rows:
        - label: 出口管制 / 合规摩擦
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 国防采购周期拖累
          values:
            - 高
            - 高
            - 低到中
            - 高
        - label: 客户集中 / 证明不透明
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 供应链交期 / 产地不透明
          values:
