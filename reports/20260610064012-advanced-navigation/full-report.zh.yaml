  - id: FP003
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: standard
    summary: 用紧凑的公开代理指标概括品类集中度、价格压力、公司规模和护城河耐久性。
    approximationNotes: 各项是公开的方向性代理指标，不是经审计的市场份额或毛利率披露。它们有用，是因为准确合同定价、队列留存和赢单率仍属私有信息。
    claimRefs:
      - CP004
      - CP006
      - CP014
      - CP022
      - CP024
      - CP032
      - CP039
      - CP040
    data:
      items:
        - label: Advanced Navigation 规模代理
          value: US$110M Series C; 100,000+ systems
          note: 公开融资与部署信号显示其挑战者规模已有分量，但装机基础信任度还不到既有厂商水平
        - label: Honeywell 商业信任代理
          value: IRS on thousands of aircraft
          note: 装机基础深度支撑航空领域强认证与改装护城河
        - label: 战略层集中度
          value: ~55% of strategic-grade revenue with top 5 vendors
          note: 即使战术销量更可争夺，战略份额仍保持集中
        - label: 战术价格压力
          value: Under-$5K pressure point
          note: 战术挑战者和持续改进的 MEMS 让商品化风险仍然存在
        - label: 高端战术基准
          value: '>$120K'
          note: 更高性能的战术系统仍面临有分量的采购摩擦
        - label: 战略系统基准
          value: '>$500K'
          note: 既有厂商仍守住一个经济层级，信任和资质足以证明更高支出的合理性
        - label: 竞争耐久性结论
          value: Moderate, not hard lock-in
          note: Advanced Navigation 确有垂直整合和出口驱动的差异化，但既有厂商、替代方案和新进入者仍都是可信威胁
