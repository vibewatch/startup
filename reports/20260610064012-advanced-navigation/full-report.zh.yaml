        - 守住价格纪律，并要求更多非公开证据。
      - - 风险评级
        - 高
        - 周期风险、客户不透明和优先股结构都可能损害普通股回报。
        - 先承销下行，再承销上行。
      - - 估值立场
        - 偏高
        - 公开可比公司和板块锚点低于独角兽水平隐含的 >10x 收入倍数。
        - 要么要求更低的有效入场价，要么要求更强的转化数据。
      - - 决策规则
        - 只有尽调补齐股权结构表和收入质量缺口，才继续推进
        - 如果结构干净、执行优于公开证据底线，建议可以上调。
        - 任何投资备忘录都必须以明确尽调输出作为关口。
