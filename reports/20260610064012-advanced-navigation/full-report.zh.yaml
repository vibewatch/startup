              优先股。管理层也明确说明资金用途：收购、本地工程和制造、美国和欧洲卓越中心，以及销售和营销增长。这一点重要，因为下一阶段不只是多卖货；它还包括制造扩张、区域支持搭建和公司整合。最有信息量的硬财务证据来自英国小公司文件。当地实体
              2025
              年账目称，营业额按成本加成基础确认，并向同集团实体重收费；该子公司还需要母公司支持函来维持持续经营处理。这些事实不意味着合并层面陷入困境，但确实确认了集团内财务依赖和有限的独立可见度。因此结论是混合的：收入质量看起来真实且有需求支撑，但资本强度偏高，公开披露仍不足以让投资者高置信度判断现金跑道、现金转化或利润率韧性。
