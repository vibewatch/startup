      - number: '2.4'
        title: 增长驱动、约束与节奏
        blocks:
          - type: paragraph
            body: >-
              最强市场顺风在政府和行业来源中都很清楚。FAA、ICAO、Stanford、Honeywell、NBAA 和 Breaking Defense
              都描述了一个干扰和欺骗不再只是边缘事件的世界。同时，市场页面反复将自动驾驶车辆、无人机、机器人、海事系统和防务现代化列为 INS 与混合导航架构的需求驱动。澳大利亚来源还增加了本地政策顺风：2026
              Integrated Investment Program 和 ASPI 预算简报强调主权工业韧性、空间能力、电子战和先进技术；DIDG
              资金与算法主权分析也说明，为什么本土买家越来越在意在岸集成和可信供应。但市场并非没有摩擦。来源也强调高系统成本、传感器漂移、集成复杂性、认证要求、劳动力短缺、供应商锁定和供应链瓶颈。这组因素意味着采用会稳定推进，但会有选择性。市场有吸引力，因为需求真实且在扩张；但采用节奏取决于预算、任务关键性，以及买家能否用韧性导航去合理化比替代方案更高的成本。
