      - number: '8.3'
        title: 乐观 / 基准 / 悲观测算显示，独角兽状态对应乐观情景，不是基准情景
        blocks:
          - type: paragraph
            body: >-
              最干净的公开收入锚点仍与创始人相关，而非审计数据：Forbes Australia 报道管理层预期 2026 年收入将超过 US$100
              million，并可能在下一年再次翻倍。这足以做情景测算，但不足以跳过情景测算。如果公司只是越过公开底线，并按成熟公开国防逻辑交易，基准情景估值会明显低于泛化 US$1 billion
              标题。如果增长转化不足，或集中度比公开表象更重，悲观情景会很快压缩到低数亿美元。相反，乐观情景可以达到或超过独角兽区间，但必须同时满足三件事：收入远高于公开底线，自主系统和 resilient-PNT
              稀缺性守住倍数溢价，股权结构表也比后期私募市场常见情况更干净。换句话说，公开证据能支撑可信的上行情节，但不支持把上行情节当作默认承保情景。本章的核心估值结论是：独角兽标题是可能的，但它更像一个激进执行押注，而不是保守基准标记。
