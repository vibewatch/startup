      - number: '8.4'
        title: 建议：在条款和运营证据补上缺口前，维持继续研究
        blocks:
          - type: paragraph
            body: >-
              因此，正确建议不是“公司弱，所以回避”，也不是“公司有战略吸引力，所以买入”。应是继续研究，置信度中等、风险高、估值偏高。正面逻辑真实存在：已部署系统、全球客户验证、盟友市场中的海外收入集中，以及产品继续扩展到月球和
              resilient-PNT 任务，都说明 Advanced Navigation 做出了重要东西。负面逻辑也同样真实：后期风险投资条款报道仍显示 down
              rounds、估值压缩和有意义的优先权结构，而公司自己的公开证据仍未解决毛利率、
              backlog、集中度和普通股有效经济堆叠。两者叠加，意味着尽调必须聚焦什么会快速证伪乐观情景。如果审计收入低于公开底线，如果优先股堆叠比普通 1x non-participating
              更苛刻，如果头部客户占比结构性偏高，或国防项目转化慢于当前叙事暗示，那么该轮看起来就是在乐观证据出现前支付了乐观价格。反过来，如果股权结构表干净，运营数据确认转化叙事，立场可以向合理移动。在此之前，公开记录支持兴趣，不支持自满。
