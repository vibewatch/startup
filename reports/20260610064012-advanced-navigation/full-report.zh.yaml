        - 分析机构名单中定位为垂直中小企业；紧凑产品线覆盖
        - UAV、机器人、自主系统、嵌入式系统
        - 针对 SWaP-C 优化的 IMU、GNSS/INS 和双 GNSS/INS 模块
        - 公开来源未显示可与既有厂商相比的战略级信任或认证广度
      - - Inertial Labs
        - 直接 / 相邻挑战者
        - 分析机构名单中的新兴专业厂商；公司自称有 20+ 年经验
        - 陆地、海事、空中、工业平台
        - MEMS 和战术级 FOG 系统，覆盖成本与精度取舍
        - 官方材料更偏产品营销，装机基础透明度不足
      - - ANELLO Photonics
        - 潜在进入者 / 光子学颠覆者
        - 早期光子挑战者；保留来源未披露融资
