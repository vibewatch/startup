  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流可见，但实际定价仍不透明
        blocks:
          - type: paragraph
            body: >-
              公开来源支持一个宽泛但硬件占比很高的变现模型。Advanced Navigation 销售多个惯性导航产品族，而不是一个订阅产品：MEMS IMU/AHRS、MEMS GNSS/INS、FOG
              IMU/AHRS、FOG GNSS/INS、声学导航系统和 Hydrus 微型 AUV 都出现在官方解决方案页面和新闻资料包中。这种宽度重要，因为它意味着同一家公司内部存在实质不同的
              ASP、集成负担和成本结构。最强公开价格数据点，是管理层对 Forbes 表示系统单价大约在 US$500 到 US$50,000。高端 Boreas
              系统的官方产品页不发布价格，而是报价驱动并依赖配置。分销商和市场页面也显示，公开目录价格零散，且往往只是指示性价格。实际结论是，不能只靠标价判断收入质量：公司明确变现真实产品，但公开证据没有显示实际
              ASP、折扣纪律，或标准模块与更高利润战略系统之间的拆分。
