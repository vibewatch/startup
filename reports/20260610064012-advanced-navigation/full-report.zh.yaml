  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 公开客户基础按垂直行业看很宽，但偏向任务关键买家
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation 的客户证据指向一家服务少数高价值、技术要求高的细分市场的公司，而不是面向大众市场的宽基客户。最强垂直集群是防务、采矿、航天、水下和工业自主。2026 年 3
              月融资材料和独立报道用一组具名客户锚定漏斗顶部，包括 Anduril、BHP、Hanwha、Rheinmetall、NOAA 和 Intuitive Machines；案例研究档案又把长尾扩展到
              BESC、Nextcore、Tamboritha 和 Tassal 等集成商和运营商。这种宽度重要，因为它显示 Advanced Navigation 能把同一个可信 PNT
              核心放到多类买家面前：防务主承包商、采矿运营商、OEM 集成商和专门自主项目。同时，公开信号分布并不均匀。公司更多披露任务类型和技术结果，而不是客户数量、合同规模或账户经济性。区域层面，唯一硬披露是超过 80%
              收入来自美国和欧洲，说明可见客户基础并不只是澳大利亚，尽管许多公开案例来自澳大利亚。因此，证据支持真实多垂直采用，但它来自一组集中的任务关键客户，而不是一个透明多元化的业务账本。
