  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 2026 轮融资证明战略需求，但不能证明价格支撑干净
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation 有足够真实的融资和商业证据，值得认真做估值工作，而不是一概否定。2026 年 3 月融资不是传闻级别：公司公开宣布 US$110 million Series
              C，澳大利亚独立报道称该轮为 A$158 million、由 Airtree 领投，多家媒体重复了相同的客户和增长叙事。这很重要，因为它确认成熟资本确实为 GPS-denied
              导航投资逻辑买单。但公开记录没有证明普通股值多少钱。支持该轮融资的同一批报道也称，尽管管理层把公司描述为 unicorn status，确切估值并未披露。SmartCompany 进一步报道，NRFC 的
              A$50 million 支票是优先股，这意味着经济堆叠可能比一个干净的普通股 post-money
              标题复杂得多。放到实际承保里，这轮融资证明了投资人胃口、战略相关性和资产负债表能力；但在考虑清算优先权、反稀释机制和客户转化风险后，它本身不能证明新投资人可获得的进入价格有吸引力。
