  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 当前证据
      - 什么会改变判断
    rows:
      - - 乐观逻辑
        - GPS-denied PNT 能力稀缺，已部署系统超过 100,000 套，离岸需求集中在盟友市场，并具备可信的太空 / 自主系统期权价值。
        - 如果经审计的转化数据显示公开增长故事正在变成可持续的生产收入和干净利润率，则上调判断。
      - - 反向逻辑
        - 估值可能是在用很薄的公开披露，资本化一层对普通股持有人经济性未知的优先股结构。
        - 如果优先权带参与或棘轮条款，或经审计转化低于公开叙事，则下调判断。
      - - 为什么价格重要
        - 一家优秀硬科技公司仍可能是糟糕投资，如果入场倍数在尽调补齐缺口前就把乐观情景计入价格。
        - 只有入场价回到基准情景区间，或证据显著增强，判断才改善。
      - - 不会改变的部分
        - 产品和客户表面证据足够真实，因此这不是因质量而回避的案例。
        - 本案更像估值和结构判断，而不是产品是否存在的判断。
    notes: 各行把公司质量判断和入场价格判断拆开，确保建议对价格保持敏感。
