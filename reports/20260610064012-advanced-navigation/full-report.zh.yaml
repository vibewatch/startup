      - number: '7.4'
        title: 缓释成熟度真实存在，但尽调应把它转成明确的终止条件
        blocks:
          - type: paragraph
            body: >-
              这不是毫无缓释的局面。Advanced Navigation 面对头部风险有几道真实防线：ITAR-free
              定位可能带来出口和渠道优势，垂直整合可能带来交期和质控优势，军标测试可能构成信任信号，新资金加主权政策支持也可能提供缓冲。问题在于，公开证据主要证明这些缓释存在，而没有证明它们在规模化后的实际表现。因此，投资人不应笼统套用“硬科技风险”框架，而应把投资逻辑转成可监控阈值。如果交期滑回传统行业区间，如果大型国防或矿业项目未能转化为披露的重复性生产，如果头部客户占比被证明结构性偏高，如果可靠性数据缺失或偏弱，或关键技术
              / go-to-market 负责人在扩张期离开，那么缓释叙事就在关键处失效。本章的核心结论是：只有尽调能把当前公开缓释叙事转成可审计的运营证据，Advanced Navigation
              才具备可投性。在那之前，合适姿态不是否认缓释，而是把它们按未完成定价，并绑定清晰尽调问题和硬性终止条件。
