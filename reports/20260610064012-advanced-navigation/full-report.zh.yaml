          from: lead
        - to: quote
          label: 商业路径已选择
          from: scope
        - to: integrate
          label: PO 或工程合作
          from: quote
        - to: validate
          label: 现场结果成为参考
          from: integrate
        - to: deploy
          label: 项目或车队承诺
          from: validate
        - to: expand
          label: 重复采购或邻近场景铺开
          from: deploy
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 证明矩阵按成熟度、新鲜度和可审计性为点名账户证据打分，而不是简单复述点名客户表。
    approximationNotes: 单元格数值只是基于公开证明的证据加权判断，不代表私下收入贡献。
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU042
      - CU044
      - CU045
      - CU046
    data:
      columns:
        - 部署成熟度
        - 成果具体度
        - 复购信号
        - 新鲜度
        - 公开可审计性
      rows:
        - label: Hanwha
          values:
            - 强
            - 中等
            - 中等
            - 新鲜
            - 强
        - label: Rheinmetall
          values:
            - 强
