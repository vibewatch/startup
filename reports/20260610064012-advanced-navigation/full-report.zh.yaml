      layers:
        - label: 工作流表层
          detail: 覆盖国防、采矿、海底测量、OEM 集成和航天的任务作业
          modules:
            - label: 国防保障型 PNT
            - label: 采矿正常运行 / 对准
            - label: 海底测量 / 定位
          outputs:
            - label: Customer-facing workflow outcomes
          tone: positive
        - label: 惯性核心
          detail: MEMS 与 FOG 产品提供姿态、航向、位置和授时基础能力
          modules:
            - label: Certus 与 MEMS 产品族
            - label: Boreas FOG 产品族
          outputs:
            - label: Orientation, north-seeking, RTK, timing
          tone: neutral
        - label: 辅助与任务扩展
          detail: LVS、GNSS、DVL、USBL、LiDAV 和声学链路收紧或扩展核心
          modules:
            - label: LVS 与 GNSS 辅助
            - label: Subsonus 与 Hydrus 堆栈
            - label: LUNA / LiDAV
          outputs:
            - label: Reduced drift or new domain-specific sensing
          tone: positive
        - label: 集成表层
          detail: 协议、浏览器 UI、日志、固件工具、SDK 和 AN Packet Protocol
          modules:
            - label: Web 界面与日志
            - label: SDK 与管理工具
          outputs:
            - label: Lower adoption friction for integrators
          tone: neutral
        - label: 交付与支持层
          detail: Sydney 或 Botany 制造，加上面向制造、支持和服务的区域 COE
          modules:
            - label: UTS Tech Lab / Botany 生产
            - label: 英国、美国、欧洲 COE
          outputs:
