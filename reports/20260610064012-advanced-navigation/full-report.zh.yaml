chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、核心问题与产品平台
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation 将自己定位为一家导航与自主系统公司，面向 GNSS 或 GPS
              不能作为单一真相来源的环境。从官网首页、关于页面、新闻资料包到行业页面，公司始终围绕陆、空、海、太空、防务和采矿场景中的韧性定位叙事，而不是围绕单一设备
              SKU。这个定位重要，因为它把公司绑定到一个大型系统问题：在干扰、欺骗、掉线、地下作业、水下任务和地外环境中维持可信导航，而不是落入狭窄传感器供应商类别。公司还强调垂直整合的澳大利亚制造、软件增强硬件，以及已扩展到惯性、光子、量子和水下系统的技术栈。实际看，商业模式更像高价值硬件加嵌入式软件，卖进任务关键平台；产品族和应用模块服务防务、采矿、航天和自主系统客户，他们需要的是可信
              PNT，而不是商品化 GPS 接收器。
