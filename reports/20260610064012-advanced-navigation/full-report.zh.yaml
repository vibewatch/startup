      - number: '5.4'
        title: 路线图显示活跃刷新和真实相邻机会，但技术栈成熟度不均
        blocks:
          - type: paragraph
            body: >-
              最可信的路线图信号是产品组合刷新，而不是投机式未来主义。Boreas 50 已在 2025 年末进入全面可用，双天线 X20P 里程碑被标注在 2026 年 7 月，当前文档显示 Certus Mini 和
              Motus 在 2026 年仍有活跃固件和 SDK 支持，遗留产品也按明确时间表退役，而不是含糊搁置。这表明公司具备真实产品管理纪律。外场证据也支持超越幻灯片的差异化。独立和官方采矿材料显示，Boreas D90
              加 LVS 混合系统可在没有固定基础设施的深部地下导航；Hydrus 和 Subsonus 则把惯性核心延伸到水下自主和声学定位。空间是最有前景、但成熟度也最低的相邻领域。Boreas X90 和 LUNA
              显然是真实项目，合作伙伴可信；LUNA 的 2025 年地面验证和最终空间资质表述，也强于单纯概念预告，但公开证据仍未达到经常性商业化规模部署。总体看，差异化可在四条轴线上支撑：ITAR-free
              且垂直整合的供应姿态、惯性优先的多传感器架构、异常可见的集成工具，以及覆盖陆地、水下和空间的业务宽度。尚未同样可支撑的是，公司每一项质量、可靠性和未来商业化主张背后的全公司级证据。
