      - number: '1.2'
        title: 创始人、领导层交接与治理
        blocks:
          - type: paragraph
            body: >-
              公开来源支持一个由 Xavier Orr 与 Chris Shaw 共同起步的双创始人故事，两人都与 University of Western Australia 以及公司 2012
              年创立相关。领导层叙事重要，是因为公开记录显示公司确实经历了转变：2022 年 Series B 公告和 2023 年制造侧报道仍将 Xavier Orr 标注为 CEO，而 2026 年新闻资料包、Series
              C 公告和公司关于页面已将 Chris Shaw 标注为 CEO 兼联合创始人。这说明公司从 Orr 主导对外叙事的创始阶段，进入 Shaw
              领导的扩张阶段，同时没有否认原始创始叙事。治理如今也比纯创始人公司更机构化。关于页面列出 Malcolm Turnbull 担任董事长，并列出董事和投资方相关董事会成员，包括 Kell Reilly、Louis
              Casey、Martin Duursma 和 Vance Serchuk。高管层面，公司现在披露 CFO、CRO、首席产品官、首席供应链官和首席人事官，运营结构明显比旧报道中的创始人主导组织更成熟。
