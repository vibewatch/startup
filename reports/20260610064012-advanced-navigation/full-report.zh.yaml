        title: 融资形成、规模信号与国际覆盖
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation 的公开融资历史已经足以确立后期公司地位，即便部分经济条款仍是私有信息。公司 2022 年官方公告称，KKR 领投 USD 68 million / AUD 108
              million Series B，并将当时累计融资推高至超过 USD 85 million。随后，官方和独立 2026 年 3 月来源共同指向一轮由 Airtree 领投、Quadrant 和 NRFC 参投的
              US$110 million / A$158 million Series C；外部报道还称公司已进入独角兽区间，并预计 2026 年收入超过 US$100
              million。最强规模信号不是纯财务，而是运营层面：2026 年 Series C 公告称公司已在全球部署超过 100,000 套系统，超过 80% 收入来自美国和欧洲；留存来源中公开点名的客户包括
              Anduril、NOAA、Hanwha、BHP、Rheinmetall 和 Intuitive Machines。公司显然不再只是澳大利亚本土公司，但 2026
              年全球客户确切数量、完整国家数量和经审计收入仍不如增长叙事透明。
