        - 迁移中或日落中
        - 仍有文档，但公开信息显示处于生命周期终止计划
        - 客户迁移期间，支持和固件仍可见
        - 需要装机基础规模和迁移完成计划
    notes: 本表区分活跃旗舰、活跃更新、先进邻近业务和日落状态，而不是把每条产品线都视为同等成熟。公开证据有歧义处，成熟度按保守口径表述。
