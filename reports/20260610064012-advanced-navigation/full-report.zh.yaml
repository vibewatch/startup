      - number: '8.2'
        title: 公开可比公司把基准情景锚在泛化独角兽标题之下
        blocks:
          - type: paragraph
            body: >-
              测试价格支撑最稳妥的方式，是在公开类比公司和行业中位数之间三角校验，而不是假装存在一个完美可比对象。选取的公开组合覆盖了 Parsons 这种服务占比较高的底部情景、Trimble
              的导航邻近平台敞口、Teledyne 的传感和仪器、Curtiss-Wright 的国防电子敞口，以及 Kratos 和 AeroVironment
              这类更高增长的自主系统参照。这些公司并不完美，但合在一起仍能框定：公开资本今天愿意为披露更多、收入基数更大、治理更成熟的企业支付什么价格。按 2026 年 6 月访问的数据，它们的 EV/Sales 约从
              1.2x 到 7.7x；Damodaran 2026 年 1 月 Aerospace/Defense 行业 EV/Sales 中位数约为 3.6x。这不意味着 Advanced Navigation
              只应拿行业中位数倍数；它的增长、稀缺性和战略定位可以支撑溢价。但这意味着，按独角兽标题价进入，隐含的是跑赢公开市场，应该被当作业绩门槛，而不是起始假设。更强的结论是：基准情景支撑集中在泛化独角兽标记之下；只有投资人明确为乐观路径付费，当前轮次才说得通。
