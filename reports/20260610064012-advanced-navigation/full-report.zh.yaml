    rows:
      - - Boreas D70 / D90
        - 面向高难度 GNSS 受限任务的战略级 GNSS/INS
        - 活跃旗舰 FOG 线
        - 寻北数字 FOG、EP 变体、高精度和加固化
        - Ethernet、CAN、RS232、RS422、GPIO、web UI、长时间日志
        - 需要独立 MTBF、实际交付周期和产量
      - - Boreas A50 / D50（50 系列）
        - 面向国防、采矿和海事改装的紧凑型 FOG AHRS / INS 更新
        - 活跃；2025 年底起全面上市
        - 910 g 形态、寻北陀螺罗盘、可选 ECCM 或 EP、从旧硬件直接迁移的路径
        - 设计上可接入新旧平台；双天线变体里程碑指向 2026 年 7 月
        - 需要 ECCM 效果的独立证明，以及实际出货率与营销时间线对照
      - - Certus
        - 面向 OEM 和加固部署的低 SWaP 双天线 MEMS GNSS/INS
        - 活跃且持续维护
        - 基于 AI 的传感器融合、1 cm RTK、授时输出、OEM 或加固封装
        - 多协议接口、兼容 Kinematica、声称 RTK 免许可
        - 需要外部基准测试漂移、鲁棒性和大规模现场表现
      - - Hydrus
        - 紧凑型自主水下测量载具
        - 活跃且有文档
        - 集成 DVL、USBL、INS、调制解调器、4K 成像和开放软件载荷模型
        - 可独立执行或由 Subsonus 辅助执行任务；单用户部署
        - 需要独立验证量产船队中的成本节省和任务续航
      - - Subsonus
        - 紧凑型水下 USBL / INS 与声学调制解调器
        - 活跃且有文档
        - 八通道水听器阵列、钛合金外壳、内部处理、声学航向传递
        - 单一 Ethernet 连接和浏览器式 UI 简化集成
        - 需要更广泛的第三方证据，证明长时现场可靠性和规模化定位误差
      - - Boreas X90 与 LUNA
        - 空间与月球导航载荷
