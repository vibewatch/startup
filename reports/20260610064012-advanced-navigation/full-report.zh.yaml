  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: wide
    summary: 跨行业看，运营流从易受 GNSS 影响的任务开始，经过传感器和平台选择，再加入交付可信导航所需的最低辅助。
    approximationNotes: 该流程有意把多个行业抽象成一个可重复模式。它反映公开工作流描述，而不是内部销售流程图。
    claimRefs:
      - CE024
      - CE033
      - CE034
      - CE036
      - CE045
      - CE046
      - CE049
    data:
      nodes:
        - id: mission-problem
          label: 任务问题
          detail: 买方从 GNSS 拒止、干扰、地下漂移或水下定位限制出发。
        - id: platform-fit
          label: 平台匹配
          detail: 根据 SWaP、环境和精度需求选择 MEMS、FOG、海底载具或声学堆栈。
        - id: integration
          label: 集成
          detail: 用标准接口、Web 工具、固件管理器和 SDK，把导航核心接到平台上。
        - id: aiding
          label: 辅助选择
          detail: 只有工作流需要更低漂移或绝对位置时，才加入 GNSS、双天线、LVS、DVL 或 USBL。
        - id: operations
          label: 运营
          detail: 产品带着日志、监控和支持，跑在国防、采矿、海底或航天工作流中。
        - id: outcome
          label: 结果
          detail: 目标是实现有韧性的航向或定位，减少停机、更快改装，或降低人员负担。
      edges:
        - from: mission-problem
          to: platform-fit
          label: 环境设定精度和 SWaP 目标
        - from: platform-fit
          to: integration
          label: 选定 SKU 进入 OEM 或改装工作流
        - from: integration
          to: aiding
          label: 集成商选择所需辅助传感器
        - from: aiding
          to: operations
          label: 配置好的堆栈在任务环境中上线
        - from: operations
          to: outcome
          label: 运营可靠性和效率显现
        - from: platform-fit
          to: outcome
          label: 匹配错误或过度配置仍会决定经济性
