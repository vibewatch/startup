companyProfile:
  summary: >-
    Advanced Navigation 是一家总部位于悉尼的澳大利亚可信 PNT 和自主系统公司，由 Xavier Orr 与 Chris Shaw 于 2012 年创立。公司销售惯性、GNSS/INS、水下和空间导航产品，服务
    GPS 或 GNSS 信号退化、受拒止或不可用的环境；公开证据显示，其在防务、采矿、航天和工业自主领域已有真实牵引力。2026 年 3
    月融资和客户披露支撑其作为有规模的后期私营公司，并具备有意义的主权制造深度；但公开披露仍不足以让投资者高置信度判断估值条款、利润率结构和客户集中度。
  foundedDate: '2012-01-01'
  founders:
    - name: Chris Shaw
      role: CEO 兼联合创始人
      background: 公司扩张阶段，在 2026 年材料中公开担任 CEO。
      claimRefs:
        - CO001
        - CO002
    - name: Xavier Orr
      role: 联合创始人；前 CEO
      background: 在 Chris Shaw 后续接任 CEO 之前，是公司早期公开代表人物。
      claimRefs:
        - CO001
