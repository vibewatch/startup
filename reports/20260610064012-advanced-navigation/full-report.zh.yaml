  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 出口管制、国防采购周期和客户证据不透明处在风险堆栈顶部
        blocks:
          - type: paragraph
            body: >-
              最高烈度的风险，是那些即便底层产品跑得通，也会拖慢或压缩收入的因素。出口管制和合规摩擦仍然真实存在：Advanced Navigation 自己就把出口规则描述为会拉长进度、推高预算、限制市场进入的痛点；BIS
              和 GAO
              描述的也仍是活跃的合规体系，而不是国防技术可以无摩擦流动的世界。公司卖进采购很重的国防和主权项目，这一点尤其关键：投标异议、正式合同流程、多方审批，都可能让收入确认远落后于技术入围。公开客户面又放大了这个问题。Advanced
              Navigation 能证明一些醒目的客户标识和部分接近量产的部署，但公开证据仍未量化头部客户占比、 backlog
              集中度、合同期限，或从设计定点转为已拨款项目的转化率。放到实际承保里，最大剩余风险不是没有需求，而是需求可能更不连续、转化更慢，也比公开表象更集中。因此，正确排序应是出口与合规第一，采购周期拖累第二，客户集中或证据不透明第三；这三类风险都能直接传导为订单延后、营运资本波动和估值信心下降。
