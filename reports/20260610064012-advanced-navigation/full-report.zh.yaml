        - 战略既有厂商
        - 员工 19,000+；欧洲惯性导航系统第一
        - 航空航天、国防、空间、主权平台
        - 高信任度惯性 / PNT 系统，加上广泛认证和支持网络
        - 大型主承包商结构在速度和出口姿态上可能不如垂直挑战者灵活
      - - Northrop Grumman
        - 战略既有厂商
        - 分析机构资料反复将其列为头部 INS 厂商
        - 军用飞机、导弹、航天器、战略系统
        - 主承包商定位和军用精密导航深度
        - 保留的公开来源包给出的当前产品页细节少于 Honeywell 或 Safran
