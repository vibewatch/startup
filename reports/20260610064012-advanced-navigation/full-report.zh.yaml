        - GNSS 或 RTK 掉线会让运矿卡车和精密作业停摆
        - 平台无关 INS 加混合辅助，支撑地下或地表连续性
        - Boreas 50、Boreas D90 加 LVS 混合架构
        - 已发布矿山测试显示停机时间更少，行驶距离误差低于 0.1%
        - 最好的地下结果仍靠混合技术栈支撑，而不是只靠惯性导航
      - - 无需大规模船员的海底测绘
        - 传统潜水和 ROV 任务成本高、运营负担重
        - 集成成像、导航和调制解调器的紧凑型自主 AUV
        - Hydrus
        - 单人部署、地理配准影像、可重复自主任务
        - 成本和自主性主张目前仍主要来自公司披露
      - - 水下定位与通信
        - 没有声学基础设施和航向传递时，水下绝对定位很难
        - 集成 INS 和声学航向传递的小型 USBL 或声学调制解调器
        - Subsonus
        - 紧凑型水下定位和调制解调器功能，支持浏览器配置
        - 公开证据更多证明架构，而不是大客户引用
      - - 航天器轨道与月球下降导航
        - 轨道和月球着陆没有 GNSS，视觉条件也可能变差
        - 航天级惯性载荷和基于 LiDAV 的着陆辅助
        - Boreas X90, LUNA
        - 为轨道或着陆机动提供精确姿态、速度和高度数据
        - 公开成熟度仍处于规模化前阶段，并依赖合作伙伴项目
      - - OEM 平台集成与支持
        - 多种接口、固件和维护工具若不成熟，会拖慢采用
        - 覆盖各产品线的最新文档、SDK、Web 界面和支持工具
        - 文档门户、产品 Web UI、SDK
        - 可见集成界面和持续维护优于许多硬件创业公司
        - 工具公开存在，不等于支持负担低或认证周期短
    notes: 各行用客户语言描述工作流结果，并明确区分有公开支撑的收益和仍需尽调的残余风险。
