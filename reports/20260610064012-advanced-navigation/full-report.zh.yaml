      - - 速度或位置辅助传感器
        - 约束漂移，或在单靠惯性会退化的场景加入绝对位置
        - Callio 文章将 LVS 与 Boreas D90 配对；Hydrus 手册使用 Subsonus 辅助模式；Spatial FOG Dual 支持 DVL 和 USBL 外设
        - 正确的传感器配对和安装纪律
