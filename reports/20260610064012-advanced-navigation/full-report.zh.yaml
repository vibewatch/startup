  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、既有巨头、相邻玩家、替代方案和新进入者都在解决重叠的可信 PNT 任务
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation 面对的不是一个整齐的同业集合。真实格局至少分成五类。第一类是 VectorNav、Inertial Labs 和 EMCORE
              等直接挑战者，它们在自主、工业、海事和防务用例中销售紧凑型或战术级惯性系统。第二类是战略既有巨头——市场领导者名单中最显眼的是 Honeywell、Safran 和
              Northrop——它们受益于既有航空航天和防务关系、认证深度以及长期采购历史。第三类是相邻专家和可能的新进入者，例如
              ANELLO，其硅光子叙事把竞争重新框定在欺骗检测与韧性导航上，而不只是传统陀螺类别。第四类是替代与互补方案：混合 GNSS/INS、CRPA、DME 和传统导航辅助、视觉或 lidar
              里程计，以及内部多传感器融合栈。最后，内部自研仍然真实，因为许多买家可以围绕组件和软件组装自己的导航架构。这意味着 Advanced Navigation
              只有在其垂直解决方案、出口姿态和部署速度比既有厂商信任度或自助集成灵活性更重要时，才能赢单。
