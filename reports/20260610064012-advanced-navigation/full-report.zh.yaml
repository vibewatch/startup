      - number: '7.2'
        title: 供应链、制造与信任风险已有部分缓释，但仍然重要
        blocks:
          - type: paragraph
            body: >-
              运营层面，公司确实有一套缓释叙事，但证据也解释了为什么运营风险仍应在风险清单中排在高位。最有力的公开事实偏正面：Advanced Navigation 已经搭建垂直整合制造叙事，投入替代供应商和组件通用性，并在
              Botany 扩大了 FOG 相关专项制造产能。在外部资料仍描述 6-to-24-month
              交期、艰难认证门槛和供应商来源能见度不足的类别里，这些缓释并不轻。但同一组事实也带来下行面。当一家公司说自己的优势来自稀缺的内部 FOG
              能力、专用工装和严格生产控制，它也在告诉投资人：良率、流程纪律、工厂稼动和技术员工质量会异常关键。信任风险也类似。CISA、NIST、FAA、MARAD 和 Stanford 都强调，欺骗、干扰、阻塞和操纵是
              PNT 依赖系统长期面对的现实。Advanced Navigation 不必是这些威胁的来源，商业风险也依然成立；供应商必须证明韧性、测试、集成质量和支持响应。公开证据通过军标测试和 PNT
              韧性叙事显示了有意义的缓释成熟度，但公开的现场故障、RMA 或认证数据还不足以把信任风险视为关闭。
