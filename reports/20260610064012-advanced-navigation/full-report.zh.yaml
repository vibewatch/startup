      - number: '2.3'
        title: 买家、用户与预算逻辑
        blocks:
          - type: paragraph
            body: >-
              买家图谱异常异质，这也是 Advanced Navigation
              能用同一核心技术服务多个垂直行业的原因之一。在防务中，国防部和采购机构付费，主承包商与集成商指定方案，空、陆、海平台上的操作员使用产品。在航空和海事中，OEM、航空公司、运营商和船东是经济买家，因为干扰风险影响安全、连续性和合规。在采矿和工业自主中，直接付款方通常是矿山运营商、自动化团队或车队所有者，因为价值主张是减少停机、提高正常运行时间，并让自主或半自主作业更安全。在机器人和无人机领域，买家可能是
              OEM 或集成商，最终用户则是部署车队的企业或政府运营方。公开市场页面还显示，大多数买家会先采用混合架构：集成 GNSS/INS、传感器融合和惯性保持，比从技术栈中完全消除卫星导航更常见。
