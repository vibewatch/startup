  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合围绕任务工作流组织，而不是围绕单一导航盒子
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation 当前产品表面更像一个面向可信定位、导航和授时的工作流栈，而不是狭窄的惯性传感器目录。官方解决方案页面把业务分为 MEMS IMU/AHRS、FOG
              IMU/AHRS、MEMS GNSS/INS、FOG GNSS/INS、声学导航以及微型 AUV
              产品；空间和行业页面又把这一逻辑延伸到轨道和月球导航工作流。实际含义是，公司用一个惯性优先核心解决几类相邻任务：面向 OEM 集成的低 SWaP 导航和授时、面向 GNSS 受拒止或受争夺环境的高端寻北 FOG
              系统、水下测绘和声学定位工作流，以及新兴空间导航载荷。可支撑的产品地图也比纯概念故事成熟。Boreas D70 和 D90 仍是旗舰加固 FOG INS 线，Boreas 50
              是用于更快外场部署的紧凑刷新版，Certus 承载 AI 融合 MEMS 双天线层级，Hydrus 把水下自主封装进对操作员友好的载具，Subsonus 则补充紧凑 USBL 定位。同时，文档页面显示公司通过
              Orientus 和 Spatial FOG Dual 退役计划修剪遗留产品，这符合一家向更新 SKU 收敛的公司，而不是无止境堆叠重叠硬件。
