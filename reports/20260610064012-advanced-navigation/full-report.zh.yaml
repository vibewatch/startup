            - 高
        - label: 制造 / 质量扩张
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 欺骗攻击 / 信任负担
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 现有巨头竞争
          values:
            - 高
            - 中到高
            - 低
            - 中到高
        - label: 资本强度 / 执行
          values:
            - 中
            - 高
            - 中
            - 中到高
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 关键下行链条从外部摩擦和运营执行传导到订单、利润率、现金转化和估值信心。
    approximationNotes: 这张图强调承销时真正重要的传导通道，而不是列出所有可能的二阶影响。
    claimRefs:
      - CR002
      - CR010
      - CR012
      - CR016
      - CR021
      - CR033
      - CR042
      - CR044
      - CR047
      - CR048
    data:
      nodes:
        - id: export
          label: 出口 / 合规摩擦
          detail: 许可、分类和国家资格问题可能推迟授标或发货。
          tone: warning
        - id: procurement
          label: 采购周期拖累
          detail: 投标异议、正式合同和项目审批会拖慢订单确认。
          tone: warning
        - id: concentration
          label: 客户集中
          detail: 头部客户组合不透明；一旦某个项目滑坡，收入波动会被放大。
          tone: warning
        - id: operations
          label: 交期 / 质量执行
          detail: 制造、供应商或可靠性失手，会削弱速度叙事。
          tone: warning
        - id: trust
          label: PNT 信任负担
          detail: 欺骗攻击和韧性要求可能拖慢验收，或推高支持成本。
          tone: warning
        - id: competition
          label: 现有巨头竞争
          detail: 大型现有厂商会压低中标率和定价。
          tone: warning
        - id: bookings
          label: 订单转化
          detail: 设计定点必须转化为有资金、可交付的项目。
          tone: neutral
        - id: margin
          label: 毛利率 / 服务负担
          detail: 延误和质量补救可能挤压硬件经济性。
          tone: negative
        - id: cash
          label: 营运资金 / 现金跑道
          detail: 转化变慢、库存或支持需求上升，都会吃掉现金。
          tone: negative
        - id: valuation
          label: 估值信心
          detail: 指标不透明或滑坡会削弱价格支撑。
          tone: negative
      edges:
        - from: export
          to: bookings
          label: 发货或授标延迟
        - from: procurement
          to: bookings
          label: 授标时间滑坡
        - from: concentration
          to: bookings
          label: 少数项目权重更高
        - from: operations
          to: margin
          label: 返工和加急成本
        - from: operations
          to: cash
          label: 库存和质保压力
        - from: trust
          to: bookings
          label: 验收摩擦
        - from: competition
          to: bookings
          label: 中标率下降
        - from: bookings
          to: cash
          label: 转化变慢
        - from: margin
          to: cash
          label: 自我造血能力下降
        - from: cash
          to: valuation
          label: 融资风险
        - from: bookings
          to: valuation
          label: 对规模叙事的信心
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 公司的缓释叙事仍依赖一条窄链条：供应商、设施、政策制度和专业人才必须一起运转。
    approximationNotes: 节点抓取最直接影响风险登记和尽调问题的依赖项。
    claimRefs:
      - CR004
      - CR014
      - CR017
      - CR023
      - CR025
      - CR031
      - CR043
      - CR051
    data:
      nodes:
        - id: export-regime
          label: EAR / ITAR / AUKUS 制度
          detail: 跨境国防销售仍依赖正确分类和资格认定。
          tone: warning
        - id: primes-buyers
          label: 国防主承包商和主权买方
          detail: 项目准入和规模化部署卡在集中的买方群体后面。
          tone: warning
        - id: specialized-components
          label: 专用部件和材料
          detail: FOG 相关输入和国防电子输入，仍很难快速切到多来源。
          tone: warning
        - id: facilities
          label: Sydney / Botany 制造版图
          detail: 设计、质量测试和自动化制造集中在这里。
          tone: neutral
        - id: talent
          label: 专业技术团队
          detail: 工艺工程、QA 和应用支持共同撑起交付承诺。
          tone: warning
        - id: capital
          label: 增长资本和政策支持
          detail: 制造和商业化扩张仍会消耗新资本。
          tone: neutral
        - id: delivery
          label: 交付和可靠性结果
          detail: 客户最终体验到的是交期、质量和支持。
          tone: opportunity
        - id: valuation
          label: 投资信心
          detail: 可靠执行把缓释措施转化为可投资的投资逻辑。
          tone: opportunity
      edges:
        - from: export-regime
          to: primes-buyers
          label: 资格和合同
        - from: specialized-components
          to: facilities
          label: 输入可得性
        - from: facilities
          to: delivery
          label: 良率、QA 和产能
        - from: talent
          to: facilities
          label: 工艺控制
        - from: capital
          to: facilities
          label: 扩张资金
        - from: capital
          to: talent
          label: 招聘和留任
        - from: primes-buyers
          to: delivery
          label: 验收和项目节奏
        - from: delivery
          to: valuation
          label: 持续执行证明
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐来自真实产品和需求证明，也受估值纪律以及未解决的投资条款不透明拖累。
    data:
      nodes:
        - id: n1
          label: 真实产品 / 客户证明
        - id: n2
          label: 公开声称收入底线 >$100m
        - id: n3
          label: 公开可比公司区间多在 1x-8x 销售额
        - id: n4
          label: 独角兽标题意味着基于公开底线 >10x
        - id: n5
          label: 优先股和利润率不透明
        - id: n6
          label: 乐观情景可以支撑溢价
        - id: n7
          label: 当前判断 = 继续研究 / 偏高
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n7
        - from: n5
          to: n7
        - from: n2
          to: n6
        - from: n6
          to: n7
    approximationNotes: 节点标签把更长的主张压缩成投委会决策链。
    claimRefs:
      - CV005
      - CV011
      - CV029
      - CV032
      - CV043
      - CV048
      - CV052
  - id: FV002
    title: 估值对公开收入倍数的敏感性
    type: bar
    layout: wide
    summary: 类独角兽的隐含倍数高于 Damodaran 行业中位数，也高于所选公开可比公司区间中的很大一部分。
    data:
      items:
        - label: Parsons PSN
          value: 1.22
        - label: Damodaran A&D 行业
          value: 3.57
        - label: Trimble TRMB
          value: 3.67
        - label: Teledyne TDY
          value: 4.92
        - label: AeroVironment AVAV
          value: 5.67
        - label: Kratos KTOS
          value: 6.54
        - label: Curtiss-Wright CW
          value: 7.74
        - label: 基于 >$100m 的隐含独角兽
          value: 10
    approximationNotes: 隐含独角兽柱使用 US$1 billion 的最低标题门槛和公开披露的 2026 年 >US$100 million 收入底线，因此实际隐含倍数大于等于 10x，而不是正好 10x。
    claimRefs:
      - CV029
      - CV030
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 只看公开信息，基准情景的估值支撑集中在独角兽标题之下；只有乐观情景执行到位，才会触及或超过它。
    data:
      items:
        - label: 悲观
          low: 315
          high: 450
        - label: 基准
          low: 450
          high: 750
        - label: 乐观
          low: 975
          high: 1800
    approximationNotes: 区间是以百万美元计的情景参考，来自公开收入锚点和明确倍数区间，并非谈判价格目标。
    claimRefs:
      - CV045
      - CV046
      - CV047
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 公司在战略相关性和需求证明上得分较高，但股权结构表清晰度和运营披露质量较弱。
    data:
      items:
        - label: 战略相关性
          value: 8
          max: 10
        - label: 需求 / 客户证明
          value: 7
          max: 10
        - label: 收入可见性
          value: 5
          max: 10
        - label: 利润率可见性
          value: 2
          max: 10
        - label: 股权结构表清晰度
          value: 2
          max: 10
        - label: 公开估值支撑
          value: 4
          max: 10
        - label: 证据质量
          value: 4
          max: 10
    approximationNotes: 分数是用于 IC 讨论的分析判断，不是外部来源评级。
    claimRefs:
      - CV005
      - CV011
      - CV043
      - CV044
      - CV048
      - CV053
