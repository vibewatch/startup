        title: TAM、SAM、SOM 与测算视角
        blocks:
          - type: paragraph
            body: >-
              公开测算来源明确支持一个有意义的市场，但没有给出统一数字，因为各方对类别定义不同。The Business Research Company 预计惯性导航系统市场在 2025 年为 $12.43
              billion，2026 年达到 $13.18 billion。MarketsandMarkets 估计更窄的 2026 年 INS 市场为 $9.42 billion，并在 2030 年升至 $11.92
              billion。Verified Market Research 将 2026 年初市场框定在大约 $11.5 billion 至 $12.0 billion；Global Growth Insights
              则发布更宽的 2026 年 $16.7 billion 数字，并将近一半需求归因于防务和航空航天。与其选一个数字假装精确，更好的结论是：可投资市场已经是数十亿美元级并且在扩张，但精确 TAM
              取决于视角是只捕捉核心惯性硬件，还是纳入更宽的集成导航架构或相邻自主能力栈。单独的抗干扰样本还把更广义的韧性导航机会推高：仅 GPS 抗干扰在 2025 年就被估值约 $4.5 billion。
