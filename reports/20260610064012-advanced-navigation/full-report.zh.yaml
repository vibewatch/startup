      - number: '7.3'
        title: 既有巨头竞争、资本强度和执行构成下一层下行风险
        blocks:
          - type: paragraph
            body: >-
              下一层重要风险在于，Advanced Navigation 正试图把一家专业硬件公司规模化，而对手已经更大、嵌入更深，也往往离主承包商或主权采购渠道更近。Honeywell、Northrop、Safran 和
              VectorNav 勾勒了竞争背景：庞大的装机基础、长期 PNT 项目、可观员工规模，以及覆盖惯性品类的成熟产品宽度。Advanced Navigation
              不需要在所有场景击败所有对手才能赢，但公开记录意味着，它的差异化必须继续来自更窄的角度，例如 ITAR-free 定位、更快交付、集成友好度和澳大利亚主权制造。增长计划同时很吃资本，这让门槛更高。Series C
              和 NRFC
              共同投资是正面信号，但也同时确认制造扩张、区域支持和商业化都在消耗现金。再叠加招聘页面释放的快速全球扩张信号，以及为速度优化的文化，执行风险就更清楚：公司可能必须快速扩张人员、流程和服务基础设施，同时守住其投资逻辑核心的质量和交付优势。因此，竞争压力、资本强度和管理层带宽应被视为相互联动的风险，而不是三个独立勾选框。
