        title: 能力宽度很大，但决定性差异在信任、SWaP、出口姿态和定价不透明度
        blocks:
          - type: paragraph
            body: >-
              能力竞争足够宽，没有单一功能能决定类别归属。Honeywell 和 Safran 在买家重视认证、装机基础信任、混合导航路线图和正式支持体系时最强。EMCORE 以战术到战略级 FOG、RLG 和 QMEMS
              宽度叠加美国垂直整合，把自己放在既有巨头和挑战者之间。VectorNav 与 Inertial Labs 更多围绕紧凑模块、集成便利性，以及 MEMS 可负担性与 FOG 精度之间的取舍竞争。ANELLO
              代表更新的光子叙事：更小封装中的战术级性能，并配合欺骗检测和传感器融合信息。Advanced Navigation 最强的主张又不同——ITAR-free 供应、快速交付、开放架构，以及在防务、采矿和航天中的具体
              GTM 故事。定价异常不透明。留存公开来源很少发布既有厂商或挑战者硬件的实际合同价，因此最佳证据只能停留在品类层面：部分细分中，战术挑战者可把价格下限压到约 $5,000 以下；先进战术系统可超过
              $120,000，战略级系统可升至 $500,000 以上。这种不透明让 GTM 质量、资质验证成功率和实际利润率，比标价比较更重要。
