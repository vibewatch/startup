  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 出口管制 / 合规摩擦
        - 目标项目遭遇出口审查或法律阻碍
        - 任何重大项目因 SKU 分类、技术数据或国家资格无法按期获批而延迟或丢失
        - 暂停承销判断，直到出口矩阵和客户国家敞口得到核验。
      - - 采购周期拖累
        - 设计定点未能转化为有资金支持的订单
        - 两个或更多旗舰防务或主权项目超过内部授标日期，且没有清晰恢复路径
        - 从确信转为观察名单，并下调由管线支撑的预测。
      - - 客户集中度
        - 收入或积压订单集中度
        - 最大客户或最大项目集中度明显高于管理层表述，或缺少续约对冲
        - 重估下行情景，并要求集中度保护条款或分阶段投入资本。
      - - 供应链交期
        - 核心 SKU 或组件交期再次拉长
        - 交期回到过去多季度甚至一年以上的区间
        - 假设利润率和营运资本恶化；不再依赖交付速度差异化。
      - - 可靠性 / 质量
        - 保修、RMA 或现场故障趋势
        - 故障、退货或客户逃逸事件明显增加，且根因未被控制
        - 视为信任逻辑破裂，重新审视商业化节奏。
      - - 网络安全 / 欺骗信任
        - 重要客户或监管方指出韧性缺口
        - 验收测试失败、欺骗问题未解决，或无法证明 resilient-PNT 控制有效
        - 等到第三方保证材料可用后再推进投资。
      - - 资本强度 / 现金转化
        - 规模化需要的资本高于计划
        - 营运资本占用、利润率短缺或收购支出迫使公司早于预期融资
        - 避免估值拉伸，并要求融资下行情景。
      - - 执行 / 关键人风险
        - 关键技术或运营负责人离职
        - 负责 FOG 制造、质量或重大项目交付的负责人离职，且没有现成梯队
        - 暂停或重新谈判，直到继任和运营连续性得到证明。
    notes: 触发项是从证据基础推导出的投资阈值，不是公司发布的 KPI 或董事会批准的契约。
