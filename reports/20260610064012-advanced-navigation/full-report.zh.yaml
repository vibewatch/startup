        - 预测来自创始人媒体报道，而不是经审计或文件级集团披露。
        - 作为底线和野心标记使用，而非精确指引。
      - - 战略稀缺性
        - GPS-denied PNT、韧性导航和登月期权可能支撑一定稀缺性溢价。
        - 稀缺性本身不能证明当前轮在普通股经济性上成立。
        - 只对乐观情景有帮助。
      - - 资本结构
        - 大额融资和主权资金支持增强资产负债表能力。
        - NRFC 优先股和未披露优先权机制，让普通股价值更难推断。
        - 重大不确定性。
      - - 退出环境
        - 防务科技和传感资产仍能吸引战略兴趣。
        - 公开市场倍数和后期风险投资条款数据仍足够克制，会挑战泛化的独角兽溢价。
        - 好坏参半。
    notes: 本展品旨在把公司质量和估值支撑拆开；两者相关，但并不相同。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV011
      - CV032
      - CV033
      - CV035
      - CV043
      - CV056
  - id: TV006
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值或证据
      - 为什么会破坏投资逻辑
      - 行动
    rows:
      - - 收入不达标
        - 2026 年收入没有越过公开 >US$100m 底线，或明显滑到更晚期间。
        - 如果其他地方没有清晰超预期，类独角兽倍数很难守住。
        - 重置估值预期或停止。
      - - 优先权堆叠过激进
        - 参与型优先股、严苛反稀释、赎回压力或大型新期权池。
        - 普通股价值可能远低于轮次 headline 估值。
        - 暂停，或按有效普通股价值重新定价。
      - - 集中度冲击
        - 最大客户占比或项目依赖明显高于公开证据暗示。
        - 订单集中的硬件供应商应享受更低倍数。
        - 转向悲观情景承销。
      - - 转化拖累
        - 防务、矿业或太空设计定点没有按预期速度转化为有资金支持的量产。
        - 乐观情景增长从已实现收入退化为叙事。
        - 只使用基准 / 悲观区间。
      - - 经济性缺口
        - 毛利率、保修负担或营运资本强度明显差于预期。
        - 如果经济性不健康，高增长撑不住高溢价倍数。
        - 不为独角兽入场价拉伸。
    notes: 每个触发项都写成可监测的承销条件，确保估值纪律不止停留在初始备忘录。
    claimRefs:
      - CV011
      - CV043
      - CV044
      - CV045
      - CV046
      - CV048
      - CV054
  - id: TV007
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 轮后股权结构表
        - 分证券类型资本结构、清算顺位、反稀释、赎回和期权池扩张。
        - 这是普通股价值最大未决变量。
        - 法务 + 财务尽调。
      - - 收入桥
        - 经审计 FY2025 收入，以及按产品家族、地域和客户类型拆分的 FY2026 年初至今收入。
        - 需要把公开 >US$100m 说法映射到真实已签约和已交付收入。
        - 财务尽调 / 审计资料室。
      - - 客户集中度
        - 前 10 大客户占比、合同期限、积压订单和设计定点到授标转化。
        - 需要判断公开 logo 强度是分散还是块状。
        - 销售运营 + 法务尽调。
      - - 利润率质量
        - 按家族拆分毛利率、保修索赔、服务成本和退货 / RMA 历史。
        - 高溢价倍数需要好经济性，不只是好故事。
        - 运营 + 财务尽调。
      - - 营运资本画像
        - 库存周转、交期缓冲和规模化下现金转化。
        - 如果营运资本膨胀，硬件增长会破坏回报质量。
        - FP&A + 运营尽调。
      - - 退出现实性
        - IPO/M&A 路径董事会材料、投行反馈和二级市场需求。
        - 需要判断独角兽私募估值能否在公开市场或战略退出中兑现。
        - 董事会 / 融资尽调。
    notes: 这些问题把公开投资逻辑转成真正能改变建议的尽调清单。
    claimRefs:
      - CV043
      - CV044
      - CV051
      - CV052
      - CV055
