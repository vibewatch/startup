        - id: deployment-support
          label: 部署与现场支持
          detail: 技术现场专长和本地工程存在，可能支撑转化与留存。
        - id: recognized-revenue
          label: 确认收入
          detail: 收入看起来主要由硬件拉动，支持或经常性组合的公开可见度有限。
