      - number: '6.3'
        title: 重复订单代理指标存在，但真实留存数据仍是私有信息，市场进入路径偏顾问式
        blocks:
          - type: paragraph
            body: >-
              最好的公开耐久性信号不是 SaaS 式留存指标，而是重复订单和升级代理指标。Rheinmetall 出现了两次，先是 2021 年超过 200 套的订单，之后是 2024 年后续交易。Hanwha
              呈现另一种耐久性模式：一笔披露的 138 套订单，加上一份可能扩展进入 Hanwha 全球供应链的更广泛 MoU，不过 Breaking Defense 谨慎指出，更广泛协议并不是即时合同。在防务之外，BESC
              提到从采购订单到交付的快速节奏，并称系统已在铝土矿矿山使用，下一步推广到铁矿石；Nextcore 则从此前 Spatial Dual 配置升级到 Certus
              Evo，以使用更高性能的一代产品。这些都是可信的重复或扩张信号，但仍然只是代理指标。留存公开来源没有披露续约率、合同期限、净留存率（NRR）或流失率。市场进入证据也指向顾问式动作。买家被引导去联系专家、请求报价、转介合作伙伴或完整经销商，而不是透明在线定价；这与定制硬件采购一致。它大概率适合产品本身，但也意味着无法从公开表面干净读出客户转化速度和售后粘性。
