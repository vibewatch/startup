        - 精密制造、校准、光学组件和持续现场认证
        - 高端性能主张可能跑在长期可靠性和单位成本的独立证据前面
      - - MEMS 加 AI 融合核心
        - 在允许 GNSS 辅助时，以更低 SWaP 提供位置、姿态和授时
