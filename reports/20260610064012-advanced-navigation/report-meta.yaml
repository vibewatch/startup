  productSummary: >-
    Portfolio spans MEMS and FOG inertial systems, GNSS/INS products, acoustic navigation, the Hydrus
    micro-AUV, and lunar or space-navigation products such as LUNA and Boreas X90 for GPS-denied or
    GNSS-denied missions.
  customerFocus: >-
    Defense primes and agencies, mining and industrial-autonomy operators, space programs, and subsea
    or maritime users needing resilient navigation in contested or infrastructure-poor environments.
  businessModel: >-
    Hardware-led, quote-led mission sales with application engineering, support, and vertical programs
    rather than a standardized software-subscription motion.
  stage: Late private / Series C
  fundingStatus: >-
