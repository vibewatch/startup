  deployed-system scale, and March 2026 Series C, but the company remains materially opaque on exact
  valuation, cap-table terms, gross margin, backlog, customer concentration, and consolidated cash or
  burn. The retained record is strongest on product and demand validation and materially thinner on the
  operating data needed to treat a unicorn-style mark as a base-case entry price.
