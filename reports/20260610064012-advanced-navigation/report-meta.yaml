companyProfile:
  summary: >-
    Advanced Navigation is a Sydney-headquartered Australian assured-PNT and autonomous-systems company
    founded in 2012 by Xavier Orr and Chris Shaw. The business sells inertial, GNSS/INS, subsea, and
    space-navigation products for environments where GPS or GNSS is degraded, denied, or unavailable,
    and public evidence shows real traction across defense, mining, space, and industrial autonomy.
    March 2026 financing and customer disclosures support a scaled late-private company with meaningful
    sovereign-manufacturing depth, but public disclosure still falls short of what investors need on
    valuation terms, margin structure, and concentration to underwrite the round with high conviction.
  foundedDate: '2012-01-01'
