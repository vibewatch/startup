callouts:
- calloutType: insight
  title: The most honest market answer is a range, not a point estimate
  body: Public analyst pages clearly support a multi-billion-dollar 2026 market, but they disagree by billions of dollars because some measure core INS while others include broader integrated navigation and autonomy-enabling layers.
  claimRefs:
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
- calloutType: strength
  title: Demand is no longer hypothetical because interference is visible in operational guidance
  body: FAA, ICAO, NBAA, Stanford, and Honeywell all describe jamming and spoofing as persistent operational realities. That gives resilient navigation spend a real forcing function rather than a purely speculative future narrative.
  claimRefs:
  - CM015
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
- calloutType: risk
  title: The market is attractive, but budget conversion is slowed by cost and integration friction
  body: Even when buyers accept the problem, advanced inertial systems remain expensive, complex to integrate, certification-heavy, and dependent on scarce technical talent. Adoption timing therefore matters as much as TAM.
