tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Core inertial navigation systems
    - INS units, IMUs, gyros, processors, integration-grade navigation hardware
    - Commodity consumer GPS devices and phone navigation
    - Defense primes, aerospace OEMs, marine operators, robot integrators
    - Primary market core
  - - Integrated GNSS/INS and hybrid navigation
    - Tightly coupled GNSS/INS, fused navigation stacks, inertial holdover
    - Generic GNSS receivers without resilience layer
    - Aircraft OEMs, autonomy developers, vehicle OEMs, fleet operators
    - Closest mainstream deployment model
  - - GPS anti-jamming and resilience tools
    - CRPAs, spoof detection, anti-jam antennas, alternative PNT modules
    - General cybersecurity or satellite services without navigation role
    - Defense agencies, aviation operators, critical-infrastructure operators
    - Adjacent but strategically important slice
  - - Mining autonomy navigation
    - Underground vehicle navigation, haulage guidance, drill alignment, uptime-focused navigation upgrades
    - Broader mine capex unrelated to positioning
    - Mine owners, automation managers, contractors
    - Important vertical wedge for Advanced Navigation
  - - Aviation and maritime continuity
    - IRS upgrades, hybrid navigation, compliance and safety mitigation
    - Ticket revenue, fuel, aircraft or vessel purchases
    - Airlines, OEMs, vessel owners, nav-system integrators
    - High-value reliability market
  - - Broader geospatial / location analytics
    - Mapping software, APIs, analytics layers, routing engines
    - Non-location SaaS
    - Enterprises and developers
    - Useful adjacent ceiling but too broad for SAM
  notes: Market boundary centers on assured navigation continuity rather than on all location software. Rows distinguish the core inertial stack from adjacent but broader geospatial or autonomy spending.
