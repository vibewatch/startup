- id: growth-drivers-and-adoption-headwinds
  title: Growth Drivers, Constraints, and Timing
  body: 'The strongest market tailwinds are visible in both government and industry sources. FAA, ICAO, Stanford, Honeywell, NBAA, and Breaking Defense all describe a world where jamming and spoofing are no longer edge cases. At the same time, market pages repeatedly cite autonomous vehicles, drones, robotics, marine systems, and defense modernization as demand drivers for INS and hybrid navigation architectures. Australia-specific sources add a local policy tailwind: the 2026 Integrated Investment Program and ASPI’s budget brief emphasize sovereign industrial resilience, space capability, electronic warfare, and advanced technology, while DIDG funding and algorithmic-sovereignty analysis show why domestic buyers increasingly care about onshore integration and trusted supply. But the market is not frictionless. Sources also highlight high system cost, sensor drift, integration complexity, certification requirements, workforce shortages, vendor lock-in, and supply-chain choke points. That
    combination implies steady but selective adoption. The market is attractive because the need is real and expanding, but adoption timing depends on budgets, mission criticality, and whether buyers can justify resilient navigation against cheaper but less robust substitutes.'
