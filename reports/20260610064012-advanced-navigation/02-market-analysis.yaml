- id: sizing-lenses-and-contradictions
  title: TAM, SAM, SOM, and Sizing Lenses
  body: Public sizing sources clearly support a meaningful market, but they do not agree on a single number because they define the category differently. The Business Research Company places inertial navigation systems at $13.18 billion in 2026 after $12.43 billion in 2025. MarketsandMarkets estimates a narrower 2026 INS market of $9.42 billion rising to $11.92 billion by 2030. Verified Market Research frames the market around roughly $11.5 billion to $12.0 billion in early 2026, while Global Growth Insights publishes a much broader $16.7 billion 2026 figure and attributes nearly half of demand to defense and aerospace. Rather than choosing one number and pretending precision, the better conclusion is that the investable market is already multi-billion-dollar and expanding, while the precise TAM depends on whether the lens captures only core inertial hardware, broader integrated navigation architectures, or adjacent autonomy-enabling stacks. A separate anti-jamming sample pushes the broader
    resilient-navigation opportunity higher by valuing GPS anti-jamming alone at roughly $4.5 billion in 2025.
