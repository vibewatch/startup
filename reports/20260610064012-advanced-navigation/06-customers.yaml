- id: repeat-proxies-retention-and-channel
  title: Repeat-order proxies exist, but real retention data stays private and the route to market looks consultative
  body: 'The best public durability signals are not SaaS-style retention metrics but repeat-order and upgrade proxies. Rheinmetall appears twice, first with a 2021 order exceeding 200 units and then with a follow-on 2024 deal. Hanwha shows a different durability pattern: one disclosed 138-unit order plus a broader MoU that could expand into Hanwha’s global supply chain, though Breaking Defense is careful that the broader agreement was not an immediate contract. Outside defense, BESC cites fast purchase-order-to-delivery timing and states the system is already in bauxite mines with iron-ore rollout next, while Nextcore moved from a prior Spatial Dual configuration to Certus Evo for a higher-performance product generation. These are credible repeat or expansion signals, but still proxies. No retained public source discloses renewal rate, contract length, NRR, or churn. Route-to-market evidence also points to a consultative motion. Buyers are pushed toward expert contact, quote requests, referral
    partners, or full resellers rather than transparent online pricing, which is consistent with customized hardware procurement. That probably fits the product, but it also means customer conversion speed and post-sale stickiness cannot be read cleanly from the public surface.'
