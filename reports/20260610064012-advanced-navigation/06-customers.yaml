- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: Rows cover the named accounts with the strongest retained public evidence or the thinnest high-profile proofs the brief explicitly asked us to test; it is not a complete customer list.
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome or proof quality
  - Limitation
  rows:
  - - BHP
    - Mining operator / innovation sponsor
    - Hybrid navigation demo at Callio Mine under Deep Mining Open Call
    - Pilot / challenge validation
    - Fresh technical proof with quantified underground error metrics
    - No disclosed production fleet or purchase order
  - - Hanwha Defence Australia
    - Defense prime
    - Redback IFV program for LAND 400 Phase 3
    - Production procurement
    - 138-unit order and partner selection rationale are public
    - Broader global expansion still partly prospective
  - - Rheinmetall Defence Australia
    - Defense prime
    - Boxer combat reconnaissance vehicles
    - Production procurement with repeat history
    - 2024 follow-on after 200+ units in 2021
    - No contract value or full platform mix disclosed
  - - Intuitive Machines
    - Commercial space operator
    - LiDAV for lunar landing and Micro-Nova mobility concepts
    - Design-in / pre-scale
    - Customer quote and payload-economics case study
    - No recurring shipment volume disclosed
  - - BESC
    - Mining systems integrator
    - Certus-based vehicle and trailer angle monitoring
    - Production field deployment
    - Three-week delivery and bauxite deployment with iron-ore expansion
    - Integrator proof, not direct mine-owner contract economics
  - - Nextcore
    - UAV LiDAR OEM
    - Certus Evo in RN100 survey system
    - Production product integration
    - Upgrade from prior AN system implies repeat OEM relationship
    - No AN unit volume disclosed
  - - Anduril
    - Defense autonomy company
    - Named in 2026 customer list only
    - Evidence too thin for stage call
    - Useful as roster proof only
    - No platform, unit, or contract details retained
  - - Boeing / Airbus
    - Aerospace OEMs
    - Historic customer disclosure only
    - Not supportable as current deployment proof
    - Shows historic logo-level credibility
    - No retained current case study, unit count, or program detail
  notes: The table intentionally distinguishes production procurement, pilot-grade validation, OEM design-ins, and logo-level mentions. Rows for Anduril, Boeing, and Airbus are cautionary because the retained public proof does not justify a stronger label.
