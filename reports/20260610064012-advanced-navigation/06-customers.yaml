artifact: customers
slug: advanced-navigation
runDate: '2026-06-10'
company:
  name: Advanced Navigation
chapter:
  number: 6
  title: Customers
  summary: Public evidence supports a real customer base across defense, mining, space, subsea, and industrial autonomy, but the proof quality is uneven. Hanwha and Rheinmetall provide the clearest production-style signals through disclosed units and repeat orders, BHP and Intuitive Machines show credible but earlier-stage proof, and Anduril/Boeing/Airbus remain mostly logo-level or thinly evidenced in the retained pack. The key underwriting gap is not whether customers exist, but how concentrated, durable, and repeatable those relationships are behind the company’s opaque public disclosure surface.
sections:
- id: customer-base-and-segment-shape
  title: The public customer base is broad by vertical but skewed toward mission-critical buyers
  body: 'Advanced Navigation’s customer evidence points to a company selling into a relatively small number of high-value, technically demanding segments rather than into a broad mass-market base. The strongest vertical clusters are defense, mining, space, subsea, and industrial autonomy. The March 2026 fundraise materials and independent coverage anchor the top of the funnel with a named roster that includes Anduril, BHP, Hanwha, Rheinmetall, NOAA, and Intuitive Machines, while the case-study archive expands the long tail with integrators and operators such as BESC, Nextcore, Tamboritha, and Tassal. That breadth matters because it shows Advanced Navigation can position the same assured-PNT core across multiple buyer types: defense primes, mining operators, OEM integrators, and specialized autonomy programs. At the same time, the public signal is not evenly distributed. The company discloses more about mission type and technical outcome than about customer count, contract size, or account
    economics. Regionally, the one hard disclosure is that more than 80% of revenue comes from the U.S. and Europe, which suggests the visible customer base is not just Australian despite many public examples originating there. The evidence therefore supports real multi-vertical adoption, but through a concentrated mission-critical customer set rather than a transparently diversified book of business.'
