- id: named-customer-proof-by-account
  title: Named customer proof is strongest for Hanwha and Rheinmetall, mixed for BHP and Intuitive Machines, and thin for Anduril, Boeing, and Airbus
  body: 'The retained public pack does not support treating every named logo equally. Hanwha and Rheinmetall are the cleanest production-style proofs because the underlying sources disclose unit counts, follow-on history, and live defense programs. Hanwha’s Redback award is explicit at 138 Boreas D70 units, while Rheinmetall’s 2024 work is framed as a follow-on to more than 200 units supplied in 2021. Those are materially stronger than simple name-drops. BHP is real proof of technical adoption, but it is still best described as a challenge-stage validation: the mine trial was run under BHP’s Deep Mining Open Call, BHP’s own page frames Advanced Navigation as one finalist receiving support, and the disclosed outcomes are performance benchmarks rather than production fleet purchases. Intuitive Machines is also real but mid-strength proof: there is an explicit customer partnership and a customer quote, yet no public recurring shipment volume. The weakest proof in the retained pack is for Anduril,
    Boeing, and Airbus. Anduril appears only in a 2026 customer list without program detail. Boeing appears in a historic customer disclosure and a later trust statement. Airbus appears only in the older disclosure. Those names are worth noting, but not upgrading into confirmed current production deployments.'
  claimRefs:
