  data:
    nodes:
    - label: Mission Pain
      detail: Buyer starts with GPS denial, underground drift, or a payload constraint.
    - label: Technical Scoping
      detail: Direct experts or resellers scope the right INS, AUV, or sensor package.
    - label: Validation Event
      detail: Public proof often first appears as a demo, case study, or engineering integration.
    - label: Program Award
      detail: The strongest evidence comes when unit counts or named platforms are disclosed.
    - label: Field Rollout
      detail: Bauxite-to-iron-ore or Boxer follow-on style signals indicate broader deployment.
    - label: Repeat / Expansion
      detail: Repeat orders, OEM upgrades, or supply-chain integration are the best public durability proxies.
