- id: TU005
  title: Channel / reseller / procurement path table
  columns:
  - Route
  - Who it serves
  - Public evidence
  - Customer advantage
  - Watchout
  rows:
  - - Direct expert contact
    - Complex buyers needing technical scoping
    - Contact page with regional offices and facilities
    - Fast access to technical team and tailored quoting
    - No public pricing or standard commercial terms
  - - Referral partner
    - Network-led lead generation
    - Channel partner page
    - Lower cost market entry in new geographies
    - Control of customer experience still sits with AN
  - - Full-scale reseller
    - Integrators and regional solution providers
    - Channel partner page
    - Local selling, marketing, and integration support
    - Margin sharing and channel conflict potential
  - - Quote-led industrial marketplace
    - Industrial buyers starting from catalog search
    - DirectIndustry listing
    - Discovery path for buyers who do not know AN directly
    - Still routes to quote flow instead of transparent checkout
  - - Defense-prime supply chain
    - Large platform programs
    - Hanwha and Rheinmetall partner pages / news
    - Access to large programs and repeat production
    - Long cycles, disclosure limits, and prime dependence
  notes: The public route-to-market surface is explicitly consultative. That is reasonable for complex hardware, but it makes conversion speed and price transparency hard to evaluate from public sources alone.
  claimRefs:
  - CU009
  - CU010
  - CU025
  - CU027
  - CU029
  - CU037
- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction risk
  - Impact
  - Diligence path
  rows:
  - - Defense production programs
    - Revenue can cluster around a few primes or government budgets
    - Large step-ups or step-downs in bookings may hinge on program timing
    - Request top-10 customers and top-5 programs as % of revenue
  - - Regional growth in U.S. and Europe
    - 80%+ revenue mix suggests regional dependence
    - Macro or procurement shocks in those regions would matter disproportionately
    - Break out revenue, pipeline, and installed base by geography
  - - Challenge-to-production conversion in mining
    - BHP proof is still a finalist demo, not disclosed fleet procurement
    - Technical success may not convert to a long-term contract
    - Ask for post-pilot conversion rate and signed mining accounts
  - - Consultative quote-led sales motion
    - Long sales cycles and limited price transparency can slow deal velocity
    - Harder to forecast close timing and channel efficiency
    - Request median sales cycle by segment and win rates
  - - Prime and public-procurement opacity
    - Program awards may disclose little supplier-level detail
    - Outside investors cannot easily verify concentration or renewals
    - Request contract duration, pricing model, and renewal mechanics
  - - Marketing-curated reference surface
    - Case studies overstate technical wins relative to commercial economics
    - Risk of mistaking proof of capability for proof of durable revenue
    - Reconcile case-study logos to active ARR / bookings data
  notes: Rows mix true expansion levers with the frictions that could blunt them. Public evidence is sufficient to identify the risks, but not to quantify them.
  claimRefs:
