- id: concentration-risk-procurement-friction-and-gaps
  title: Customer concentration and procurement opacity remain the central diligence gap
  body: 'The customer chapter’s hardest unresolved question is concentration. Public proof is good enough to establish real adoption, but not good enough to quantify how dependent the business is on a handful of defense primes, programs, or mining operators. The 80%-of-revenue-in-U.S.-and-Europe disclosure is useful, but it is regional rather than account-level. The named public roster is also clustered in procurement-heavy sectors where sales cycles are long, budgets are programmatic, and disclosure often sits with primes or government buyers rather than with component suppliers. Advanced Navigation openly markets against legacy multi-year lead times and vendor complexity, which implies procurement friction is real in the target markets. The independent adverse source in the pack adds context: public procurement systems need transparency, complaints mechanisms, and strong oversight because opaque awards and collusion are recurring structural risks. That does not create a company-specific
    allegation against Advanced Navigation, but it does reinforce why the absence of disclosed contract terms, renewal data, and top-customer share matters. The bottom line is that public evidence supports a real customer base and some production programs, yet investors still need management data to underwrite concentration, renewal, and challenge-to-production conversion risk with confidence.'
