- id: TP004
  title: Moat durability / competitive risk register
  enumerationScope:
    coverage: partial
    basis: Rows isolate the most material public moat claims and adverse risks for underwriting Advanced Navigation against incumbents, tactical challengers, substitutes, and likely entrants in 2026.
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - ITAR-free and sovereign-Australian supply improves win odds
    - Incumbents can still win on certification and existing program access
    - High
    - Honeywell and Safran show deeper trust and support infrastructure while Advanced Navigation pitches lead-time and export flexibility
    - Request actual win-rate data by program type and geography
  - - Vertical GTM in defense, mining, and space increases relevance
    - Buyers can still solve the job with hybrid stacks or internal build
    - High
    - Public sources describe GNSS/INS, DME, CRPA, vision, lidar, and multi-sensor fusion as common complements or substitutes
    - Quantify attach rates where customers buy a full stack versus just a component
  - - Vertically integrated manufacturing reduces supply risk
    - Optical fiber, quartz, calibration, and export-control chokepoints still constrain delivery
    - Medium
    - Mordor and VMR flag specialty-component and export barriers across the market
    - Review supplier concentration, calibration throughput, and backlog data
  - - Space and photonics breadth creates a technology lead narrative
    - Photonic entrants and incumbent M&A can narrow the differentiation gap quickly
    - Medium
    - ANELLO and Honeywell/Civitanavi show competitive response paths beyond legacy gyro formats
    - Validate proprietary performance and time-to-volume, not just roadmap breadth
  - - Tactical challengers lack incumbent trust
    - Tactical challengers can still commoditize enough of the stack to compress margins
    - High
    - Market pages cite under-$5,000 tactical pressure and expanding MEMS performance
    - Separate strategic-grade moat from tactical-module moat in underwriting
  - - Installed-base incumbents are too slow to respond
    - Honeywell and Safran are already investing in hybrid navigation, spoof detection, and alternative-PNT paths
    - Medium
    - Incumbent roadmap evidence undermines any thesis that they are frozen in legacy inertial-only architectures
    - Test whether customer demand is shifting faster than incumbent upgrade cycles
  notes: Severity labels are analytical judgments based on retained public evidence rather than company-disclosed risk scores.
