- id: TP003
  title: Pricing / packaging comparison
  enumerationScope:
    coverage: partial
    basis: Rows summarize the public pricing evidence actually visible in retained 2026 sources for major competitor classes; most enterprise hardware contracts do not disclose realized list prices publicly.
  columns:
  - Vendor / class
  - Public pricing evidence
  - Contract / packaging model
  - Included capability signal
  - Implication
  rows:
  - - Advanced Navigation
    - Not publicly listed in retained sources
    - Quote-led hardware and program sales by vertical
    - Assured-PNT plus open-architecture, ITAR-free, mission-specific GTM
    - Public pricing opacity means margin and discount discipline require diligence
  - - Honeywell / Safran strategic incumbents
    - Not publicly listed in retained sources
    - Retrofit, OEM, and long-cycle program contracts
    - Certification, support infrastructure, hybrid-navigation roadmap, installed-base trust
    - Buyers likely pay for trust and qualification, but public evidence cannot quantify premium
  - - VectorNav class
    - No public list price retained on reviewed pages
    - Compact module sales around IMU and GNSS/INS SKUs
    - SWaP-C modules and easy integration
    - Tactical challengers compete more on module economics than on strategic installed-base trust
  - - Inertial Labs class
    - No public list price retained on reviewed pages
    - Product-family sales spanning MEMS and FOG systems
    - Choice between lower-cost MEMS and higher-accuracy FOG
    - Flexible packaging can help win cost-sensitive industrial or autonomy deployments
  - - Tactical-grade market benchmarks
    - Under $5,000 pressure point in some tactical challenger categories
    - High-volume or tactical modules
    - Good-enough performance for autonomy, UAV, and embedded uses
    - MEMS and software-led competition pressure price floors
  - - Tactical high-performance systems
    - Over $120,000 in VMR public benchmark language
    - Higher-performance tactical systems with complex integration
    - Better drift and endurance than low-cost modules
    - Price step-up narrows the buyer pool and lengthens ROI scrutiny
  - - Strategic-grade systems
    - Above $500,000 in Mordor public benchmark language
    - Long-cycle defense, aerospace, and strategic programs
    - Deep trust, qualification, and long-duration GNSS-denied performance
    - Incumbents can defend this tier, but it is difficult for challengers to penetrate quickly
  notes: Public category benchmarks are much more visible than realized vendor list prices. Table therefore compares packaging transparency and economic position, not audited net selling prices.
