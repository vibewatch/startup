- id: sales-motion-and-unit-economics-proxies
  title: The go-to-market motion looks programmatic and engineering-assisted, so unit economics must be proxied
  body: 'The companys commercial motion looks much closer to program sales than to self-serve software. Defense, mining, space, and subsea pages all sell mission performance in GPS-denied environments, while official materials emphasize rapid product delivery, technical field expertise, and local engineering support. That suggests application engineering and integration work are part of the commercial package even if the public record does not quantify services revenue. Public traction is meaningful: the company says it deployed more than 100,000 systems, generated more than 80% of revenue in the United States and Europe, and grew triple digits into the Series C. Forbes further reports 2026 revenue above US$100 million and profitability since the ninth month. But the classic underwriting metrics—CAC, payback, win rate, average sales cycle, backlog conversion, retention, and service attachment—are absent. The result is a chapter that can show proxies for sales efficiency and unit economics,
    but not the private metrics needed to turn proxies into conviction.'
