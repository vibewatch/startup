callouts:
- calloutType: strength
  title: Public traction is real even though audited transparency is weak
  body: The chapter is not dealing with a pre-revenue idea. Public evidence supports more than 100,000 deployed systems, more than 80% of revenue from the US and Europe, a 2026 revenue target above US$100 million, and a large fresh funding round.
  claimRefs:
  - CI007
  - CI008
  - CI010
  - CI011
- calloutType: insight
  title: The most revealing financial evidence is hidden in a subsidiary filing, not in fundraising PR
  body: 'The UK accounts add two facts missing from company marketing: turnover is recognized on a cost-plus intercompany basis, and the subsidiary relies on a parent support letter for going concern. Those facts reveal group complexity without proving consolidated weakness.'
  claimRefs:
  - CI022
  - CI023
  - CI024
  - CI025
- calloutType: risk
  title: Margin and runway remain the core underwriting blockers
  body: Pricing is mostly quote-led, the product mix ranges from low-price sensors to strategic-grade FOG systems, and public sources still omit consolidated cash, burn, gross margin, backlog, and concentration data. That keeps capital-adequacy and revenue-quality judgment cautious rather than bullish.
  claimRefs:
