company:
  name: Advanced Navigation
chapter:
  number: 4
  title: Financials
  summary: Advanced Navigation shows real commercial traction and access to capital, but the public record is still far better at proving demand than at proving margin durability. Revenue appears hardware-led across multiple inertial, GNSS/INS, and subsea product families; prices are mostly quote-led, while the best public ASP range comes from management via Forbes at roughly US$500 to US$50,000 per system. The strongest positive signals are more than 100,000 systems deployed, more than 80% of revenue generated in the United States and Europe, reported 2026 revenue above US$100 million, and a large 2026 Series C earmarked for manufacturing, acquisitions, and regional Centers of Excellence. The hardest underwriting blockers remain consolidated cash, burn, backlog, gross margin, recurring support mix, and customer concentration.
sections:
- id: monetization-and-pricing-opacity
  title: Revenue streams are visible, but realized pricing remains opaque
  body: 'Public sources support a broad but hardware-heavy monetization model. Advanced Navigation sells multiple inertial-navigation families rather than one subscription product: MEMS IMU/AHRS, MEMS GNSS/INS, FOG IMU/AHRS, FOG GNSS/INS, acoustic-navigation systems, and the Hydrus micro-AUV all appear on official solution surfaces and in the press kit. That breadth matters because it implies materially different ASPs, integration burdens, and cost structures inside one company. The strongest public price datapoint is managements statement to Forbes that systems sell for roughly US$500 to US$50,000 each. Official product pages for high-end Boreas systems do not publish price; they are quote-led and configuration dependent. Distributor and marketplace pages reinforce that public catalog pricing is patchy and often only indicative. The practical conclusion is that revenue quality cannot be judged from list pricing alone: the company clearly monetizes real products, but public evidence does
    not show realized ASP, discounting discipline, or the split between standard modules and higher-margin strategic systems.'
  claimRefs:
