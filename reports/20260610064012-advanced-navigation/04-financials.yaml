- id: TI005
  title: Public financial gaps table
  enumerationScope:
    coverage: sample
    basis: Rows isolate the highest-value private metrics still needed to move from public traction analysis to investable financial underwriting.
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Consolidated cash and burn
    - Without cash and monthly burn, runway cannot be estimated despite the large Series C
    - Request latest monthly cash bridge, 13-week cash forecast, and downside case
  - - Gross margin by product family
    - Hardware quality cannot be underwritten without BOM, yield, calibration, and field-support cost visibility
    - Request margin bridge by MEMS, FOG, subsea, and vehicle lines
  - - Bookings, backlog, and book-to-bill
    - Revenue durability and timing remain opaque
    - Request backlog aging, conversion assumptions, and cancellations history
  - - Customer concentration and contract structure
    - Large defense or industrial accounts could create volatility and negotiation pressure
    - Request top-10 customer share, contract length, and renewal exposure
  - - Realized ASP and discounting
    - Quote-led products can conceal margin leakage even when demand is strong
    - Request quote-to-order analysis, discount bands, and regional price realization
  - - Recurring services / software mix
    - One-off shipment revenue is lower quality than recurring support and maintenance
    - Request support attachment rate, annual maintenance revenue, and software contribution
  - - Working capital and inventory turns
    - Manufacturing scale-up can consume cash before revenue converts
    - Request inventory aging, supplier terms, and cash-conversion cycle
  - - Entity-level transfer pricing and intercompany flows
    - UK cost-plus recharge suggests group complexity that public sources cannot map
    - Request transfer-pricing memo and intercompany revenue/cost matrix
  notes: The public record is strong enough to establish a serious business, but not strong enough to clear these underwriting blockers.
