  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Current consolidated cash balance, monthly burn, and runway scenarios after the 2026 Series C.
    whyItMatters: A large financing round does not reveal whether the company has 12 months or 30 months of expansion runway.
    diligencePath: Request the latest board pack, 13-week cash forecast, and downside runway model.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-by-family
    missingEvidence: Gross margin, BOM, calibration yield, warranty cost, and field-service burden by product family.
    whyItMatters: Revenue quality in hardware businesses depends on unit economics, not just shipments and funding headlines.
    diligencePath: Request product-family contribution margin, yield, and returns data for MEMS, FOG, subsea, and vehicle lines.
    relatedQuestionRefs:
    - QI013
    - QI021
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: bookings-and-concentration
    missingEvidence: Bookings, backlog, top-customer concentration, and contract duration by vertical.
    whyItMatters: Without these data, the company could be either diversified and repeatable or lumpy and program dependent.
    diligencePath: Request top-10 customer share, backlog aging, book-to-bill history, and renewal profile.
    relatedQuestionRefs:
    - QI020
    - QI022
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounting
    missingEvidence: Realized ASP, discount ladders, regional pricing differences, and services attachment rates.
    whyItMatters: Quote-led selling can hide both strong pricing power and aggressive discount leakage.
    diligencePath: Request quote-to-order conversion data, realized ASP by SKU, and support / software attach rates.
    relatedQuestionRefs:
    - QI002
    - QI018
    - QI023
    - QI024
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: working-capital-and-debt
    missingEvidence: Inventory turns, supplier terms, equipment finance, and any debt or project-finance obligations.
    whyItMatters: Manufacturing expansion can consume cash rapidly even when demand is healthy.
    diligencePath: Request debt schedule, covenant package, supplier-payment terms, and inventory aging.
