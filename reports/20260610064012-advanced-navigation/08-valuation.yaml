- id: TV005
  title: Price support versus uncertainty table
  columns:
  - Topic
  - What publicly supports price
  - What publicly weakens price support
  - Current underwriting read
  rows:
  - - Scale proof
    - US$110m/A$158m round, >100,000 systems, triple-digit growth narrative, offshore demand concentration.
    - Public sources still do not show audited group revenue, margin, or backlog.
    - Positive but incomplete.
  - - Revenue outlook
    - Forbes reports >US$100m revenue in 2026 and management hopes to double again after that.
    - Forecast comes through founder media, not through audited or filing-grade group disclosure.
    - Use as a floor and ambition marker, not as precision guidance.
  - - Strategic scarcity
    - GPS-denied PNT, resilient navigation, and lunar optionality plausibly justify some scarcity premium.
    - Scarcity alone does not prove that the current round clears on common-equity economics.
    - Helpful for bull case only.
  - - Capital structure
    - Large round size and sovereign backing support balance-sheet capacity.
    - NRFC preferred equity and undisclosed preference mechanics make the common-equity value harder to infer.
    - Major uncertainty.
  - - Exit context
    - Defense-tech and sensing assets still attract strategic interest.
    - Public multiples and late-stage venture term data remain disciplined enough to challenge a generic unicorn premium.
    - Mixed.
  notes: This exhibit is meant to separate company quality from valuation support; the two are related but not identical.
