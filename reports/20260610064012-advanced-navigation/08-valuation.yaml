callouts:
- calloutType: recommendation
  title: Recommendation remains research-more
  body: The company may be strategically important and commercially real, but public evidence does not yet prove that common equity is being offered at a base-case-clearing price. Treat any unicorn headline as a starting point for diligence, not as valuation proof.
  claimRefs:
