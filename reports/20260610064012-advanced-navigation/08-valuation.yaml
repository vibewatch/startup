- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Post-round cap table
    - Security-by-security capitalization, liquidation stack, anti-dilution, redemption, and pool expansion.
    - This is the largest unresolved determinant of common-equity value.
    - Counsel + finance diligence.
  - - Revenue bridge
    - Audited FY2025 revenue and FY2026 year-to-date revenue by product family, geography, and customer type.
    - Needed to map the public >US$100m claim onto real booked and shipped revenue.
    - Finance diligence / audit room.
  - - Customer concentration
    - Top-10 customer share, contract duration, backlog, and design-win-to-award conversion.
    - Needed to decide whether public logo strength is diversified or lumpy.
    - Sales ops + legal diligence.
  - - Margin quality
    - Gross margin by family, warranty claims, service cost, and returns/RMA history.
    - Premium multiples require good economics, not just good stories.
    - Operations + finance diligence.
  - - Working-capital profile
    - Inventory turns, lead-time buffers, and cash conversion under scale.
    - Hardware growth can destroy return quality if working capital balloons.
    - FP&A + operations diligence.
  - - Exit realism
    - Board materials on IPO/M&A path, banker feedback, and secondary appetite.
    - Needed to judge whether a unicorn private mark can clear in a public or strategic exit.
    - Board / financing diligence.
  notes: These asks convert the public thesis into a diligence checklist that can actually move the recommendation.
