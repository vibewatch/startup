  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: Full post-Series C cap table, security terms, liquidation waterfall, anti-dilution, redemption, and option-pool treatment.
    whyItMatters: Without the stack, headline valuation cannot be translated into common-equity economics.
    diligencePath: Request signed term sheet, cap-table export, and counsel summary of economic rights.
    relatedQuestionRefs:
    - QV027
    - QV030
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited consolidated FY2025 revenue plus FY2026 year-to-date revenue by product family and direct versus intercompany mix.
    whyItMatters: The public revenue floor is useful, but not enough to price the company or compare it cleanly with public comps.
    diligencePath: Obtain audited statements and monthly management accounts reconciled to bookings and shipments.
    relatedQuestionRefs:
    - QV004
    - QV028
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer share, contract duration, backlog, and design-win conversion by major program.
    whyItMatters: A concentrated hardware supplier deserves a lower multiple than a diversified recurring platform.
    diligencePath: Request cohort data, backlog schedules, and customer concentration analysis from finance and sales ops.
    relatedQuestionRefs:
    - QV025
    - QV028
  - type: private-evidence-only
    severity: material
    topic: margin-quality
    missingEvidence: Gross margin by family, warranty cost, RMA/return history, and service burden.
    whyItMatters: A premium revenue multiple is fragile if unit economics and working-capital intensity are weak.
    diligencePath: Review product-family P&Ls, warranty reserve schedules, and operations dashboards.
    relatedQuestionRefs:
    - QV028
  - type: enumeration-incomplete
    severity: minor
    topic: transaction-comps
    missingEvidence: A directly comparable recent navigation/PNT transaction set with accessible multiples for smaller private targets.
    whyItMatters: Model-appropriate strategic references help triangulate whether scarcity premiums are credible.
    diligencePath: Ask bankers and management for private M&A precedent books and board financing materials.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Board materials on exit routes, banker feedback, secondary demand, and investor rights around future financings.
    whyItMatters: Late-stage value depends on how and when a liquidity event can clear, not just on internal growth.
    diligencePath: Review board decks, financing memos, and recent investor rights documentation.
    relatedQuestionRefs:
    - QV021
    - QV026
