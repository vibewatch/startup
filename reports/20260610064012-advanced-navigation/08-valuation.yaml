- id: scenario-underwriting
  title: Bull/base/bear math shows that unicorn status maps to the bull case, not the base case
  body: 'The cleanest public revenue anchor is still founder-linked rather than audited: Forbes Australia reported management’s expectation that 2026 revenue would exceed US$100 million and might double again in the following year. That is enough to run scenario math, but not enough to skip scenario math. If the company simply clears the public floor and trades on mature public-defense logic, a base-case valuation lands materially below a generic US$1 billion headline. If growth under-converts or concentration turns out to be heavier than the public surface suggests, the bear case compresses quickly toward the low hundreds of millions. By contrast, the bull case can reach or exceed unicorn territory, but only if three things happen together: revenue expands well above the public floor, autonomy and resilient-PNT scarcity keep the multiple premium intact, and the cap table proves cleaner than late-stage private markets often are. In other words, the public evidence can support a credible
    upside story, yet it does not support underwriting that upside as the default case. That is the central valuation conclusion for this chapter: a unicorn headline is possible, but it reads more like an aggressive execution bet than like a conservative base-case mark.'
  claimRefs:
