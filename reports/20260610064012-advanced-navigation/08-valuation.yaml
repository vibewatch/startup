  rows:
  - - Recommendation
    - Research-more
    - Company quality looks real, but price support is still mostly headline-level rather than term-sheet-level.
    - Do not underwrite a unicorn mark as self-validating evidence.
  - - Confidence
    - Medium
    - There is enough public evidence to frame scenarios, but not enough to precision-price common equity.
    - Keep price discipline and demand more private evidence.
  - - Risk rating
    - High
    - Cycle risk, customer opacity, and preferred-equity structure can all impair common returns.
    - Underwrite downside before underwriting upside.
  - - Valuation stance
    - Stretched
    - Public comp and sector anchors sit below a >10x implied revenue multiple at unicorn level.
    - Require either a lower effective entry price or stronger conversion data.
  - - Decision rule
    - Only progress if diligence closes the cap-table and revenue-quality gaps
    - The recommendation can improve if the structure is clean and execution proves better than the public floor.
    - Gate any investment memo on explicit diligence outputs.
