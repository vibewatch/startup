- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Current evidence
  - What would change the view
  rows:
  - - Bull thesis
    - Scarce GPS-denied PNT capability, >100,000 deployed systems, offshore demand concentration in allied markets, and credible space/autonomy option value.
    - Upgrade if audited conversion shows the public growth story is translating into durable production revenue and clean margins.
  - - Anti-thesis
    - The valuation may capitalize a thin public disclosure set through a preferred-equity stack whose economics are unknown to common holders.
    - Downgrade if preferences are participating/ratcheted or if audited conversion falls short of the public narrative.
  - - Why price matters
    - A great hard-tech company can still be a weak investment if the entry multiple bakes in the bull case before diligence closes the gaps.
    - Improve only if entry resets toward the base-case range or proof improves materially.
  - - What does not change
    - The product and customer surface are real enough that this is not an avoid-for-quality call.
    - This remains a valuation-and-structure call more than a product-existence call.
  notes: Rows separate company-quality judgment from entry-price judgment so the recommendation stays price-sensitive.
