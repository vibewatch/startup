company:
  name: Advanced Navigation
chapter:
  number: 8
  title: Valuation
  summary: Advanced Navigation looks investable as a company but not yet cleanly underwritable as a unicorn-priced common-equity opportunity. Public evidence supports a real March 2026 growth round and a plausible >US$100 million 2026 revenue floor, yet the undisclosed valuation terms, reported preferred-equity structure, and missing margin/backlog/concentration data mean a headline unicorn mark maps more naturally to the bull case than to the base case.
sections:
- id: financing-context
  title: The 2026 round proves strategic demand, but not clean price support
  body: 'Advanced Navigation has enough real financing and commercial evidence to deserve serious valuation work rather than a blanket dismissal. The March 2026 round is not rumor-level: the company publicly announced a US$110 million Series C, independent Australian coverage described it as A$158 million led by Airtree, and multiple outlets repeated the same customer and growth framing. That matters because it confirms that sophisticated capital did show up for a GPS-denied navigation thesis. But the public record stops short of proving what common equity is worth. The same reporting that supports the round also says the exact valuation was not disclosed even while management described the company as being in unicorn status. SmartCompany further reported that the NRFC’s A$50 million check was preferred equity, which means the economic stack may be meaningfully more complex than a clean common-only post-money headline. In practical underwriting terms, this round proves investor appetite,
    strategic relevance, and balance-sheet capacity; it does not by itself prove that the entry price available to a new investor is attractive once liquidation preferences, anti-dilution mechanics, and customer-conversion risk are considered.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV009
  - CV011
  - CV013
  - CV043
  tableRefs:
  - TV005
  figureRefs: []
- id: public-market-anchors
  title: Public comparables anchor the base case below a generic unicorn headline
  body: The most defensible way to test price support is to triangulate across public analogues and sector medians rather than to pretend that one perfect comparable exists. The selected public set spans a services-heavy floor case in Parsons, navigation-adjacent platform exposure in Trimble, sensing and instrumentation in Teledyne, defense-electronics exposure in Curtiss-Wright, and higher-growth autonomy references in Kratos and AeroVironment. Those names are imperfect, but together they still frame what public capital is paying today for businesses with more disclosure, larger revenue bases, and more seasoned governance than Advanced Navigation. On the accessed June 2026 data, their EV/Sales ratios run from roughly 1.2x to 7.7x, while Damodaran’s January 2026 Aerospace/Defense sector median sits near 3.6x EV/Sales. That does not mean Advanced Navigation deserves only a sector median multiple; its growth, scarcity, and strategic positioning can justify a premium. It does mean that a headline
    unicorn entry price implies public-market outperformance that should be treated as an achievement hurdle, not as a starting assumption. The stronger conclusion is that base-case support clusters below a generic unicorn mark, while the current round can be defended only if investors are explicitly paying for a bull-case path.
  claimRefs:
