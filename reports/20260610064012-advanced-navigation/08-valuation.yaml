- id: recommendation-and-asks
  title: 'Recommendation: keep the stance at research-more until terms and operating evidence close the gap'
  body: 'The correct recommendation is therefore not “avoid because the company is weak” and not “buy because the company is strategically exciting.” It is research-more with medium confidence, high risk, and a stretched valuation stance. The positive case is real: deployed systems, global customer proof, offshore revenue concentration in allied markets, and continued product expansion into lunar and resilient-PNT missions all argue that Advanced Navigation has built something that matters. The negative case is also real: late-stage venture term reports still show down rounds, valuation compression, and meaningful preference structures, while the company’s own public evidence leaves gross margin, backlog, concentration, and the effective common-equity stack unresolved. That combination means diligence must focus on what would falsify the bull case quickly. If audited revenue misses the public floor, if the preference stack is harsher than plain-vanilla 1x non-participating, if top-customer
    share is structurally high, or if defense program conversion proves slower than the current narrative implies, the round starts to look like a bull-case price paid before bull-case proof. Conversely, if the cap table is clean and the operating data confirm the conversion story, the stance can move toward fair. Until then, the public record justifies interest, not complacency.'
