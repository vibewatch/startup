- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or evidence
  - Why it breaks the thesis
  - Action
  rows:
  - - Revenue miss
    - 2026 revenue does not clear the public >US$100m floor or slips materially into later periods.
    - A unicorn-like multiple becomes hard to defend without clear overperformance elsewhere.
    - Reset valuation expectations or stop.
  - - Preference stack too aggressive
    - Participating preferred, harsh anti-dilution, redemption pressure, or a large new option pool.
    - Common-equity value can be far below the headline round mark.
    - Pause or reprice to effective common value.
  - - Concentration shock
    - Top-customer share or program dependence is materially higher than public evidence implies.
    - A hardware supplier with concentrated bookings deserves a lower multiple.
    - Move toward bear-case underwriting.
  - - Conversion drag
    - Defense, mining, or space design wins are not translating into funded production at expected speed.
    - Bull-case growth becomes narrative rather than realized revenue.
    - Use base/bear ranges only.
  - - Economics gap
    - Gross margin, warranty burden, or working-capital intensity is materially worse than expected.
    - High growth without healthy economics will not hold a premium multiple.
    - Do not stretch to a unicorn entry.
  notes: Each trigger is phrased as a monitorable underwriting condition so valuation discipline survives beyond the initial memo.
  claimRefs:
