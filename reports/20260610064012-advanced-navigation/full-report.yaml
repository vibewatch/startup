      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Export-control / compliance friction
        - Export review or legal blockage on target programs
        - >-
          Any material program delayed or lost because SKU classification, technical data, or country eligibility cannot
          be cleared on schedule
        - Pause underwriting until export matrix and customer-country exposure are verified.
      - - Procurement-cycle drag
        - Design wins fail to convert into funded awards
        - >-
          Two or more flagship defense or sovereign programs slip beyond internal award dates without clear recovery
          path
        - Move from conviction to watchlist and haircut pipeline-backed forecasts.
      - - Customer concentration
        - Revenue or backlog concentration
        - Top customer or top program concentration materially exceeds management framing or lacks offsetting renewals
        - Reprice downside and require concentration covenants or staged deployment capital.
      - - Supply-chain lead times
        - Core SKU or component lead times re-extend
        - Lead times move back toward legacy multi-quarter or year-plus ranges
        - Assume margin and working-capital deterioration; stop relying on delivery-speed differentiation.
      - - Reliability / quality
        - Warranty, RMA, or field-failure trend
        - Meaningful increase in failures, returns, or customer escape events without contained root cause
        - Treat as thesis break on trust and revisit commercialization pace.
      - - Cyber / spoofing trust
        - Major customer or regulator flags resilience gap
        - Failed acceptance tests, unresolved spoofing findings, or inability to evidence resilient-PNT controls
        - Delay investment until third-party assurance package is available.
      - - Capital intensity / cash conversion
        - Scale requires more capital than planned
        - Working-capital build, margin shortfall, or acquisition spend forces an earlier-than-expected fundraise
        - Avoid valuation stretch and require financing downside case.
      - - Execution / key-person risk
        - Loss of critical technical or operating leaders
        - >-
          Departure of leaders responsible for FOG manufacturing, quality, or major-program delivery without ready bench
          strength
        - Pause or renegotiate until succession and operating continuity are proven.
    notes: >-
      Triggers are investment-oriented thresholds derived from the evidence base, not company-issued KPIs or
      board-approved covenants.
