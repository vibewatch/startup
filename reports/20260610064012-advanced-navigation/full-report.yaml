      - number: '2.3'
        title: Buyer, User, and Budget Logic
        blocks:
          - type: paragraph
            body: >-
              The buyer map is unusually heterogeneous, which is part of why Advanced Navigation can serve multiple
              verticals with the same core technology. In defense, ministries and procurement agencies pay, primes and
              integrators specify, and operators on air, land, and sea platforms are the users. In aviation and
              maritime, OEMs, airlines, operators, and vessel owners are the economic buyers because interference risk
              affects safety, continuity, and compliance. In mining and industrial autonomy, the direct payer is usually
              the mine operator, automation team, or fleet owner because the value proposition is fewer stoppages, more
              uptime, and safer autonomous or semi-autonomous operations. Across robotics and drones, the buyer can be
              the OEM or integrator, while the end user is the enterprise or government operator deploying the fleet.
              Public market pages reinforce that most buyers adopt hybrid architectures first: integrated GNSS/INS,
              sensor fusion, and inertial holdover are more common budget decisions than fully eliminating
              satellite-based navigation from the stack.
