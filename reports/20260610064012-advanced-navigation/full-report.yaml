  - id: TV006
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or evidence
      - Why it breaks the thesis
      - Action
    rows:
      - - Revenue miss
        - 2026 revenue does not clear the public >US$100m floor or slips materially into later periods.
        - A unicorn-like multiple becomes hard to defend without clear overperformance elsewhere.
        - Reset valuation expectations or stop.
      - - Preference stack too aggressive
        - Participating preferred, harsh anti-dilution, redemption pressure, or a large new option pool.
        - Common-equity value can be far below the headline round mark.
        - Pause or reprice to effective common value.
      - - Concentration shock
        - Top-customer share or program dependence is materially higher than public evidence implies.
        - A hardware supplier with concentrated bookings deserves a lower multiple.
        - Move toward bear-case underwriting.
      - - Conversion drag
        - Defense, mining, or space design wins are not translating into funded production at expected speed.
        - Bull-case growth becomes narrative rather than realized revenue.
        - Use base/bear ranges only.
      - - Economics gap
        - Gross margin, warranty burden, or working-capital intensity is materially worse than expected.
        - High growth without healthy economics will not hold a premium multiple.
        - Do not stretch to a unicorn entry.
    notes: >-
      Each trigger is phrased as a monitorable underwriting condition so valuation discipline survives beyond the
      initial memo.
    claimRefs:
      - CV011
      - CV043
      - CV044
      - CV045
      - CV046
      - CV048
      - CV054
  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Post-round cap table
        - Security-by-security capitalization, liquidation stack, anti-dilution, redemption, and pool expansion.
        - This is the largest unresolved determinant of common-equity value.
        - Counsel + finance diligence.
      - - Revenue bridge
        - Audited FY2025 revenue and FY2026 year-to-date revenue by product family, geography, and customer type.
        - Needed to map the public >US$100m claim onto real booked and shipped revenue.
        - Finance diligence / audit room.
      - - Customer concentration
        - Top-10 customer share, contract duration, backlog, and design-win-to-award conversion.
        - Needed to decide whether public logo strength is diversified or lumpy.
        - Sales ops + legal diligence.
      - - Margin quality
        - Gross margin by family, warranty claims, service cost, and returns/RMA history.
        - Premium multiples require good economics, not just good stories.
        - Operations + finance diligence.
      - - Working-capital profile
        - Inventory turns, lead-time buffers, and cash conversion under scale.
        - Hardware growth can destroy return quality if working capital balloons.
        - FP&A + operations diligence.
      - - Exit realism
        - Board materials on IPO/M&A path, banker feedback, and secondary appetite.
        - Needed to judge whether a unicorn private mark can clear in a public or strategic exit.
        - Board / financing diligence.
    notes: These asks convert the public thesis into a diligence checklist that can actually move the recommendation.
    claimRefs:
      - CV043
      - CV044
      - CV051
      - CV052
      - CV055
