  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation should not be analyzed against the full location-analytics or geospatial-software
              market. The relevant market is the narrower assured-PNT and inertial-navigation stack used when GNSS alone
              is insufficient for safety, mission assurance, or productivity. Public market pages and technical sources
              converge on the same underlying function: self-contained motion, orientation, and position tracking that
              can bridge or replace degraded external signals in aircraft, missiles, marine vehicles, ground platforms,
              robots, and industrial machinery. That makes the included spend pool a mix of INS hardware, integrated
              GNSS/INS systems, anti-jamming components, sensor fusion, and surrounding integration or calibration work.
              It excludes most commodity handset GPS, ordinary mapping apps, or generic cloud geospatial tooling except
              as adjacent substitutes. Substitutes still matter, however. Buyers can respond to GPS fragility with
              conventional radio aids, DME, multi-constellation receivers, LEO augmentation, visual or LiDAR odometry,
              or manual survey and operational workarounds. The practical market boundary therefore sits at the point
              where operators pay specifically for resilient navigation continuity rather than for generic location
              awareness.
