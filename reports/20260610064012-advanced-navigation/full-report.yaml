      - number: '3.3'
        title: Switching costs are real in strategic programs but much softer in autonomy and mining stacks
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive asymmetry is distribution power, not raw sensor physics. Honeywell and Safran
              are hard to displace where the buyer sits inside certified aviation programs, long-lived defense
              platforms, or formal prime-contractor architectures. In those settings, trust is built through prior
              qualification, channel access, support infrastructure, and regulatory acceptance, so switching cost is
              high even before technical revalidation and program timing are considered. By contrast, switching cost is
              lower in mining, robotics, autonomy, and many industrial deployments because integrators already mix GNSS,
              inertial, cameras, lidar, and custom software. Public sources repeatedly describe hybrid architectures as
              the norm rather than inertial-only replacement, which makes multi-homing and internal build more
              plausible. Advanced Navigation’s mining story directly exploits that lower-lock-in environment by
              emphasizing platform-agnostic integration, fleet-wide deployment, and fewer stoppages during GNSS
              dropouts. Supply access also matters. Market pages flag specialty optical fiber, quartz, export controls,
              and long calibration cycles as barriers, which favors vendors with vertical integration or domestic
              manufacturing control. That helps explain why Advanced Navigation, EMCORE, Honeywell, and Safran all
              foreground supply-chain credibility in different ways.
            claimRefs:
              - CP006
              - CP008
              - CP021
              - CP023
              - CP024
