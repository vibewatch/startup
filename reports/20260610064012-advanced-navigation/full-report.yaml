        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation’s public financing history is now clear enough to establish late-stage status, even if
              some economics remain private. The company’s official 2022 announcement says KKR led a USD 68 million /
              AUD 108 million Series B and lifted lifetime capital raised above USD 85 million at the time. Official and
              independent March 2026 sources then converge on a US$110 million / A$158 million Series C led by Airtree
              with Quadrant and the NRFC, while external reporting says the company is now in unicorn territory and
              expects revenue above US$100 million in 2026. The strongest scale signals are operational rather than
              purely financial: the 2026 Series C announcement says the company has deployed more than 100,000 systems
              worldwide and generates more than 80% of revenue in the U.S. and Europe, while customers publicly named
              across retained sources include Anduril, NOAA, Hanwha, BHP, Rheinmetall, and Intuitive Machines. The
              company is clearly not Australia-only anymore, but exact 2026 global client count, full country count, and
              audited revenue remain less transparent than the topline growth narrative.
