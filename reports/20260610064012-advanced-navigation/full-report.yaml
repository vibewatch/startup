      nodes:
        - id: export
          label: Export / compliance friction
          detail: Licensing, classification, and country-eligibility issues can delay awards or shipment.
          tone: warning
        - id: procurement
          label: Procurement-cycle drag
          detail: Bid protests, formal contracting, and program approvals delay bookings.
          tone: warning
        - id: concentration
          label: Customer concentration
          detail: Opaque top-account mix raises revenue volatility if one program slips.
          tone: warning
        - id: operations
          label: Lead-time / quality execution
          detail: Manufacturing, supplier, or reliability misses undermine the speed thesis.
          tone: warning
        - id: trust
          label: PNT trust burden
          detail: Spoofing and resilience requirements can slow acceptance or increase support cost.
          tone: warning
        - id: competition
          label: Incumbent competition
          detail: Large incumbents pressure win rates and pricing.
          tone: warning
        - id: bookings
          label: Bookings conversion
          detail: Design wins must convert into funded, deliverable programs.
          tone: neutral
        - id: margin
          label: Gross margin / service burden
          detail: Delays and quality workarounds can compress hardware economics.
          tone: negative
        - id: cash
          label: Working capital / runway
          detail: Slower conversion and higher inventory or support needs consume cash.
          tone: negative
        - id: valuation
          label: Valuation confidence
          detail: Opaque or slipping metrics reduce price support.
          tone: negative
      edges:
        - from: export
          to: bookings
          label: shipment or award delay
