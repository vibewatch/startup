  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Export controls, defense buying cycles, and customer-proof opacity sit at the top of the risk stack
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risks are the ones that can delay or compress revenue even if the underlying product
              works. Export-control and compliance friction remains real because Advanced Navigation itself frames
              export rules as a source of schedule, budget, and market-access pain, while BIS and GAO still describe
              active compliance regimes rather than a world where defense technology moves frictionlessly. That matters
              because the company sells into procurement-heavy defense and sovereign programs, where bid protests,
              formal contracting processes, and multi-party approvals can push revenue recognition well behind technical
              qualification. The public customer surface compounds the issue. Advanced Navigation can prove notable
              logos and some production-style deployments, but public evidence still does not quantify top-customer
              share, backlog concentration, contract duration, or conversion rates from design win to funded program. In
              practical underwriting terms, this means the biggest residual risk is not that no demand exists; it is
              that demand may be lumpy, slower to convert, and more concentrated than the public surface suggests. The
              proper ranking is therefore export and compliance first, procurement-cycle drag second, and customer
              concentration or proof opacity third, because those three risks can all transmit directly into delayed
              bookings, volatile working capital, and lower valuation confidence.
