      - number: '8.2'
        title: Public comparables anchor the base case below a generic unicorn headline
        blocks:
          - type: paragraph
            body: >-
              The most defensible way to test price support is to triangulate across public analogues and sector medians
              rather than to pretend that one perfect comparable exists. The selected public set spans a services-heavy
              floor case in Parsons, navigation-adjacent platform exposure in Trimble, sensing and instrumentation in
              Teledyne, defense-electronics exposure in Curtiss-Wright, and higher-growth autonomy references in Kratos
              and AeroVironment. Those names are imperfect, but together they still frame what public capital is paying
              today for businesses with more disclosure, larger revenue bases, and more seasoned governance than
              Advanced Navigation. On the accessed June 2026 data, their EV/Sales ratios run from roughly 1.2x to 7.7x,
              while Damodaran’s January 2026 Aerospace/Defense sector median sits near 3.6x EV/Sales. That does not mean
              Advanced Navigation deserves only a sector median multiple; its growth, scarcity, and strategic
              positioning can justify a premium. It does mean that a headline unicorn entry price implies public-market
              outperformance that should be treated as an achievement hurdle, not as a starting assumption. The stronger
              conclusion is that base-case support clusters below a generic unicorn mark, while the current round can be
              defended only if investors are explicitly paying for a bull-case path.
            claimRefs:
              - CV018
              - CV020
              - CV022
              - CV024
