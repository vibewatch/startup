          detail: Vertically integrated production and research underpin flagship FOG and navigation hardware.
          tone: positive
        - id: core-sensors
          label: Core MEMS / FOG Sensors
          detail: Inertial products deliver heading, position, timing, and attitude foundations.
          tone: positive
        - id: aiding
          label: Aiding Sensors and External Inputs
          detail: GNSS, LVS, DVL, USBL, or other sensors constrain drift or add absolute position.
          tone: warning
        - id: tooling
          label: Tooling and SDK Surface
          detail: Browser UIs, logging, SDKs, and firmware managers lower integration friction.
          tone: neutral
        - id: regional-support
          label: Regional COEs and Field Support
          detail: Future UK, US, and Europe sites aim to scale support, servicing, and interoperability.
          tone: neutral
        - id: customer-platform
          label: Customer Platform Outcome
          detail: Vehicles, vessels, landers, or survey systems receive the final navigation stack.
          tone: opportunity
      edges:
        - from: manufacturing
          to: core-sensors
          label: Production and calibration
        - from: core-sensors
          to: aiding
          label: Core often benefits from workflow-specific aiding
        - from: core-sensors
          to: tooling
          label: Configuration and telemetry exposure
        - from: aiding
          to: customer-platform
