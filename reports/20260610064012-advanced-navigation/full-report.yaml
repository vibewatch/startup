        title: >-
          Capital access is strong, but capital adequacy is still an open question because the expansion plan is cash
          hungry
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation does not look starved for capital in the near term. Official and independent sources
              align on a major 2026 raise: the company calls it a US$110 million Series C, while Australian coverage and
              the NRFC frame the same round at about A$158 million, including A$50 million of NRFC preferred equity.
              Management also describes explicit uses of funds: acquisitions, local engineering and manufacturing,
              centers of excellence in the United States and Europe, and sales-and-marketing growth. That matters
              because the next phase is not just more selling; it is manufacturing scale-up, regional support buildout,
              and corporate integration. The most revealing hard financial evidence comes from UK small-company filings.
              The local entitys 2025 accounts say turnover is recognized on a cost-plus basis and recharged to a fellow
              group undertaking, and that the subsidiary required a parent support letter to maintain going-concern
              treatment. Those facts do not imply distress at the consolidated level, but they do confirm intra-group
              financial dependency and limited standalone visibility. The verdict is therefore mixed: revenue quality
              looks real and demand-backed, but capital intensity is elevated and public disclosures are still
              insufficient to underwrite runway, cash conversion, or margin durability with confidence.
