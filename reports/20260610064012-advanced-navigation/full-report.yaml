  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The portfolio is organized around mission workflows, not around a single navigation box
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation’s current product surface reads like a workflow stack for assured positioning,
              navigation, and timing rather than a narrow inertial-sensor catalog. The official solutions surface groups
              the business into MEMS IMU/AHRS, FOG IMU/AHRS, MEMS GNSS/INS, FOG GNSS/INS, and acoustic navigation plus
              micro-AUV products, while the space and sector pages extend that logic into orbital and lunar navigation
              workflows. In practice, that means the company is solving several adjacent jobs with one inertial-first
              core: lower-SWaP navigation and timing for OEM integration, higher-end north-seeking FOG systems for
              GNSS-denied or contested environments, underwater survey and acoustic-positioning workflows, and emerging
              space-navigation payloads. The supportable product map is also more mature than a pure concept story.
              Boreas D70 and D90 remain the flagship rugged FOG INS line, Boreas 50 is the compact refresh for faster
              fielding, Certus carries the AI-fused MEMS dual-antenna tier, Hydrus packages underwater autonomy into an
              operator-friendly vehicle, and Subsonus adds compact USBL positioning. At the same time, the documentation
              surface shows legacy pruning through Orientus and Spatial FOG Dual end-of-life programs, which is
              consistent with a company consolidating toward newer SKUs rather than endlessly accumulating overlapping
              hardware.
