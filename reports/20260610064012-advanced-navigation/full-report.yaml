      - number: '4.3'
        title: Cost structure looks manufacturing-intensive, and margin risk is real even if the technology is differentiated
        blocks:
          - type: paragraph
            body: >-
              The public record points to a company with unusual technical differentiation and equally unusual operating
              complexity. Boreas D70 and D90 are not commodity modules: they are 12-watt, 2.8-kilogram FOG INS products
              marketed around north-seeking performance, GNSS denial, ruggedization, and military standards. The company
              also operates a robotics manufacturing facility in Botany and is expanding manufacturing capacity while
              planning more overseas capability. That is supportive of moat and delivery credibility, but it is also a
              reminder that gross margin depends on yield, calibration throughput, warranty exposure, field support, and
              working capital, none of which are publicly disclosed. Bains 2025 pricing work is relevant here: in B2B
              markets, margin preservation depends on whether firms can defend price against customer resistance and
              competition. Competitive sources show exactly why that risk exists. Lower-tier alternatives are lighter,
              cheaper, and widely distributed; SBG and VectorNav illustrate that ITAR-light and cost-effective
              substitutes exist outside the strategic-grade tier. The company may deserve premium pricing in hard
              missions, but public data cannot prove how often it actually captures that premium.
