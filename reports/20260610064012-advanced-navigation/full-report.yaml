chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Core Problem, and Product Platform
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation presents itself as a navigation and autonomous-systems company built for environments
              where GNSS or GPS cannot be relied on as a single source of truth. Across its homepage, about page, press
              kit, and sector pages, the company consistently frames the business around resilient positioning for land,
              air, sea, space, defence, and mining use cases rather than around a single device SKU. That positioning
              matters because it ties the company to a large systems problem—maintaining trusted navigation under
              jamming, spoofing, dropouts, underground operations, subsea missions, and off-Earth environments—rather
              than to a narrow sensor vendor category. The company also emphasizes vertically integrated Australian
              manufacturing, software-enhanced hardware, and an expanding stack that now spans inertial, photonic,
              quantum, and underwater systems. In practice, the business model looks like high-value hardware plus
              embedded software sold into mission-critical platforms, with product families and application modules
              tuned for defense, mining, space, and autonomous systems customers that need assured PNT rather than
              commodity GPS receivers.
