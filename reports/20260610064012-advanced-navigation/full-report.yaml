      - number: '7.4'
        title: Mitigation maturity is real, but diligence should convert it into explicit kill criteria
        blocks:
          - type: paragraph
            body: >-
              This is not a zero-mitigation situation. Advanced Navigation has several real defenses against the top
              risks: ITAR-free positioning is a plausible export and channel advantage, vertical integration is a
              plausible lead-time and quality-control advantage, military-standard testing is a plausible trust signal,
              and fresh capital plus sovereign-policy support are plausible buffers. The problem is that public evidence
              mostly proves the existence of those mitigations, not their realized performance under scale. Investors
              should therefore resist a generic “hard tech risk” framing and instead convert the thesis into monitorable
              thresholds. If lead times drift back toward legacy industry ranges, if major defense or mining programs
              fail to convert into disclosed recurring production, if top-customer share turns out to be structurally
              high, if reliability data is unavailable or weak, or if key technical or go-to-market leaders leave during
              expansion, the mitigation story has failed where it matters. The chapter’s main conclusion is that
              Advanced Navigation is investable only if diligence can turn the current public mitigation narrative into
              auditable operating evidence. Until that happens, the appropriate posture is not to deny the mitigations
              but to price them as incomplete and to tie them to clear diligence asks and hard stop conditions.
            claimRefs:
