      - number: '1.2'
        title: Founders, Leadership Transition, and Governance
        blocks:
          - type: paragraph
            body: >-
              Public sources support a two-founder origin story anchored in Xavier Orr and Chris Shaw, both tied to the
              University of Western Australia and the company’s 2012 founding. The leadership story is important because
              the public record shows a real transition over time: the 2022 Series B announcement and 2023
              manufacturing-profile coverage still identify Xavier Orr as CEO, while the 2026 press kit, Series C
              announcement, and company about page identify Chris Shaw as CEO and co-founder. That suggests the company
              has shifted from an Orr-fronted founding period into a Shaw-led scaling phase without disavowing the
              original founding narrative. Governance also appears more institutional than founder-only today. The about
              page lists Malcolm Turnbull as chairman alongside directors and investor-linked board participants
              including Kell Reilly, Louis Casey, Martin Duursma, and Vance Serchuk. At the executive level the company
              now discloses a CFO, CRO, chief product officer, chief supply chain officer, and chief people officer,
              indicating a more mature operating structure than the founder-led organization described in older
              articles.
