  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The 2026 round proves strategic demand, but not clean price support
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation has enough real financing and commercial evidence to deserve serious valuation work
              rather than a blanket dismissal. The March 2026 round is not rumor-level: the company publicly announced a
              US$110 million Series C, independent Australian coverage described it as A$158 million led by Airtree, and
              multiple outlets repeated the same customer and growth framing. That matters because it confirms that
              sophisticated capital did show up for a GPS-denied navigation thesis. But the public record stops short of
              proving what common equity is worth. The same reporting that supports the round also says the exact
              valuation was not disclosed even while management described the company as being in unicorn status.
              SmartCompany further reported that the NRFC’s A$50 million check was preferred equity, which means the
              economic stack may be meaningfully more complex than a clean common-only post-money headline. In practical
              underwriting terms, this round proves investor appetite, strategic relevance, and balance-sheet capacity;
              it does not by itself prove that the entry price available to a new investor is attractive once
              liquidation preferences, anti-dilution mechanics, and customer-conversion risk are considered.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV011
              - CV013
              - CV043
