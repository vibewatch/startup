  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams are visible, but realized pricing remains opaque
        blocks:
          - type: paragraph
            body: >-
              Public sources support a broad but hardware-heavy monetization model. Advanced Navigation sells multiple
              inertial-navigation families rather than one subscription product: MEMS IMU/AHRS, MEMS GNSS/INS, FOG
              IMU/AHRS, FOG GNSS/INS, acoustic-navigation systems, and the Hydrus micro-AUV all appear on official
              solution surfaces and in the press kit. That breadth matters because it implies materially different ASPs,
              integration burdens, and cost structures inside one company. The strongest public price datapoint is
              managements statement to Forbes that systems sell for roughly US$500 to US$50,000 each. Official product
              pages for high-end Boreas systems do not publish price; they are quote-led and configuration dependent.
              Distributor and marketplace pages reinforce that public catalog pricing is patchy and often only
              indicative. The practical conclusion is that revenue quality cannot be judged from list pricing alone: the
              company clearly monetizes real products, but public evidence does not show realized ASP, discounting
              discipline, or the split between standard modules and higher-margin strategic systems.
