      - number: '7.2'
        title: Supply-chain, manufacturing, and trust risks are partly mitigated but still material
        blocks:
          - type: paragraph
            body: >-
              Operationally, the company has a real mitigation story, but the evidence also explains why operations
              still deserve a high rank in the risk register. The best public facts are favorable: Advanced Navigation
              has built a vertically integrated manufacturing narrative, invests in alternative suppliers and component
              commonality, and has expanded specialized FOG-related manufacturing capacity in Botany. Those are
              non-trivial mitigations in a category where external sources still describe 6-to-24-month lead times,
              difficult qualification hurdles, and poor visibility into supplier origin. But the same facts create their
              own downside. When a company argues that its advantage comes from rare in-house FOG capability,
              specialized tooling, and tight production control, it is also telling investors that yield, process
              discipline, facility uptime, and technical workforce quality matter disproportionately. Trust risk is
              similar. CISA, NIST, FAA, MARAD, and Stanford all reinforce that spoofing, jamming, interference, and
              manipulation are persistent realities for PNT-dependent systems. Advanced Navigation does not need to be
              the source of those threats for the commercial risk to be real; the burden falls on the vendor to prove
              resilience, testing, integration quality, and support responsiveness. Public evidence supports meaningful
              mitigation maturity through military-standard testing and PNT-resilience framing, but not enough public
              field-failure, RMA, or certification data to treat trust risk as closed.
