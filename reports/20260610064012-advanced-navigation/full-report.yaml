    type: dag
    layout: wide
    summary: >-
      The key downside chain runs from external friction and operating execution into bookings, margin, cash conversion,
      and valuation confidence.
    approximationNotes: >-
      The diagram emphasizes transmission channels that matter to underwriting rather than every possible second-order
      effect.
