          - type: callout
            title: Preferred equity is the hidden swing factor
            body: >-
              The round structure matters almost as much as the headline valuation. If the NRFC and late-stage investors
              received plain-vanilla 1x non-participating preferred with limited anti-dilution, downside to common is
              manageable; if not, the same headline mark can overstate common-equity value materially.
            calloutType: risk
