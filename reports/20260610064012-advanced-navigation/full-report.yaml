  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      Across sectors, the operating flow starts with a GNSS-vulnerable mission, moves through sensor and platform
      selection, and then adds the minimum aiding needed to deliver trustworthy navigation.
    approximationNotes: >-
      The flow intentionally abstracts several sectors into one repeatable pattern. It reflects public workflow
      descriptions rather than an internal sales-process diagram.
    claimRefs:
      - CE024
      - CE033
      - CE034
      - CE036
      - CE045
      - CE046
      - CE049
    data:
      nodes:
        - id: mission-problem
          label: Mission Problem
          detail: Buyer starts with GNSS denial, interference, underground drift, or underwater positioning limits.
        - id: platform-fit
          label: Platform Fit
          detail: Choose MEMS, FOG, subsea vehicle, or acoustic stack based on SWaP, environment, and accuracy needs.
        - id: integration
          label: Integration
          detail: >-
            Use standard interfaces, web tools, firmware managers, and SDKs to attach the navigation core to the
            platform.
        - id: aiding
          label: Aiding Choice
          detail: Add GNSS, dual antennas, LVS, DVL, or USBL only where the workflow needs lower drift or absolute position.
        - id: operations
          label: Operations
          detail: Product runs in defense, mining, subsea, or space workflow with logs, monitoring, and support.
        - id: outcome
          label: Outcome
          detail: Goal is resilient heading or positioning with less stoppage, faster retrofit, or lower crew burden.
      edges:
        - from: mission-problem
          to: platform-fit
          label: Environment sets accuracy and SWaP target
        - from: platform-fit
          to: integration
          label: Selected SKU enters OEM or retrofit workflow
        - from: integration
          to: aiding
          label: Integrator chooses required aiding sensors
        - from: aiding
          to: operations
          label: Configured stack goes live in mission environment
        - from: operations
          to: outcome
          label: Operational reliability and efficiency appear
        - from: platform-fit
          to: outcome
          label: Wrong fit or overkill still determines economics
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      The product thesis depends on a chain that runs from sensor design and manufacturing through aiding sensors,
      integration tooling, and regional support rather than on one component alone.
    approximationNotes: >-
      This figure highlights operating dependencies that matter to diligence: manufacturing scope, aiding-sensor
      dependence, and service-layer execution.
    claimRefs:
