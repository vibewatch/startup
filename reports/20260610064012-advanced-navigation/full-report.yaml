      - number: '3.4'
        title: >-
          The moat looks moderate rather than hard because incumbent trust and technical commoditization both cut
          against exclusivity
        blocks:
          - type: paragraph
            body: >-
              The bullish case for Advanced Navigation is coherent but narrower than a category-dominance story. The
              company does appear differentiated in three public ways: it pairs assured-PNT hardware with strong
              vertical narratives in defense, mining, and space; it stresses ITAR-free Australian manufacturing and
              faster lead times relative to legacy suppliers; and it spans inertial, photonic, quantum, and underwater
              technologies rather than selling a single boxed sensor. The adverse evidence is just as important.
              Strategic-grade share is still concentrated among large incumbents. Tactical and industrial categories
              face price pressure from MEMS scaling, software-defined fusion stacks, and newer photonic claims. Public
              list pricing remains opaque, making it hard to prove premium pricing power. Honeywell’s Civitanavi
              acquisition also shows that incumbents can buy missing capability when needed. The net result is a moat
              that looks real but conditional. Advanced Navigation may win where export flexibility, sovereign sourcing,
              and deployment speed matter, but public evidence does not support a hard-lock-in thesis without private
              proof on win rates, qualification cycles, retention, and the cost structure behind its differentiated
              hardware.
