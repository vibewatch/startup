  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, incumbents, adjacents, substitutes, and entrants all solve overlapping assured-PNT jobs
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation is not competing against one tidy peer set. The real landscape splits into at least
              five classes. First are direct challengers such as VectorNav, Inertial Labs, and EMCORE that sell compact
              or tactical inertial systems across autonomy, industrial, marine, and defense use cases. Second are
              strategic incumbents—most visibly Honeywell, Safran, and Northrop on market-leader lists—that benefit from
              installed aerospace and defense relationships, certification depth, and long procurement histories. Third
              are adjacent specialists and likely entrants such as ANELLO, whose silicon-photonics pitch reframes
              competition around spoof detection and resilient navigation rather than only legacy gyro categories.
              Fourth are substitutes and complements: hybrid GNSS/INS, CRPAs, DME and conventional aids, visual or lidar
              odometry, and internal multi-sensor fusion stacks. Finally, internal build remains real because many
              buyers can assemble their own navigation architecture around components and software. That means Advanced
              Navigation wins only when its vertical package, export posture, and deployment speed matter more than
              incumbent trust or do-it-yourself integration flexibility.
