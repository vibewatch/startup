      - number: '3.2'
        title: >-
          Capability breadth is wide, but the decisive differentiators are trust, SWaP, export posture, and pricing
          opacity
        blocks:
          - type: paragraph
            body: >-
              Capability competition is broad enough that no single feature settles the category. Honeywell and Safran
              look strongest where buyers prioritize certification, installed-base trust, hybrid-navigation roadmaps,
              and formal support structures. EMCORE positions itself between incumbent and challenger tiers with
              tactical-to-strategic FOG, RLG, and QMEMS breadth plus U.S. vertical integration. VectorNav and Inertial
              Labs compete more on compact modules, integration ease, and the tradeoff between MEMS affordability and
              FOG accuracy. ANELLO represents the newer photonics narrative: tactical-grade performance in a smaller
              package with spoof-detection and sensor-fusion messaging. Advanced Navigation’s strongest claims are
              different again—ITAR-free supply, rapid delivery, open architectures, and specific GTM stories in defense,
              mining, and space. Pricing is unusually opaque. Retained public sources rarely publish actual contract
              prices for incumbent or challenger hardware, so the best evidence is category-level: tactical challengers
              can pressure price floors below roughly $5,000 in some segments, while advanced tactical systems can
              exceed $120,000 and strategic-grade systems can rise above $500,000. That opacity makes GTM quality,
              qualification success, and realized margins more important than list-price comparisons.
