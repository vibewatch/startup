        title: The roadmap shows active refresh and real adjacencies, but maturity is uneven across the stack
        blocks:
          - type: paragraph
            body: >-
              The most credible roadmap signal is portfolio refresh, not speculative futurism. Boreas 50 entered general
              availability in late 2025, a dual-antenna X20P milestone is called out for July 2026, current
              documentation shows active 2026 firmware and SDK support for Certus Mini and Motus, and legacy products
              are being retired on named schedules rather than left ambiguous. That indicates a company with real
              product-management discipline. The field evidence also supports differentiation that goes beyond
              slideware. Independent and official mining materials show a Boreas D90 plus LVS hybrid system navigating
              deep underground without fixed infrastructure, while Hydrus and Subsonus extend the inertial core into
              subsea autonomy and acoustic positioning. Space is the most promising but also the least mature adjacency.
              Boreas X90 and LUNA are clearly real programs with credible partners, and LUNA’s 2025 terrestrial
              validation plus final-space-qualification language is stronger than a mere concept teaser, but public
              evidence still stops short of recurring commercial deployment at scale. Overall differentiation is
              supportable on four axes: ITAR-free and vertically integrated supply posture, inertial-first multi-sensor
              architecture, unusually visible integration tooling, and a breadth that spans land, subsea, and space.
              What is not yet equally supportable is the company-wide proof behind every quality, reliability, and
              future-commercialization claim.
