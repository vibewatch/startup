- id: manufacturing-milestones-and-diligence-gaps
  title: Manufacturing Footprint, Milestones, and Remaining Diligence Gaps
  body: 'The company’s Australian industrial footprint is a major part of the thesis. Official contact and NRFC materials place headquarters in Sydney and identify manufacturing or research sites in Botany, Barton, Newcastle, and Balcatta, while 2023 trade coverage documents the opening of a Botany robotics facility at UTS Tech Lab and describes Advanced Navigation as one of only four companies able to manufacture strategic-grade fibre-optic gyroscopes. That manufacturing credibility supports the sovereign-capability narrative and helps explain why the NRFC highlighted domestic jobs, IP commercialization, and onshore capability retention. The milestone pattern also reinforces breadth: older reporting tied the company to early profitability, 2019 Series A capital, 2022 Series B, the 2023 Botany facility, lunar-navigation work with Intuitive Machines, and the 2026 Series C. Still, several questions remain open. Public sources do not fully disclose current global headcount, current exact client
    and country counts, detailed Series C valuation terms, or ownership concentration. Independent employee-review surfaces were also access-blocked from this environment, so culture and retention risks cannot be ruled in or out with confidence from public evidence alone.'
