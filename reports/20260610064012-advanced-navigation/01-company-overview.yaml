- id: founders-leadership-governance
  title: Founders, Leadership Transition, and Governance
  body: 'Public sources support a two-founder origin story anchored in Xavier Orr and Chris Shaw, both tied to the University of Western Australia and the company’s 2012 founding. The leadership story is important because the public record shows a real transition over time: the 2022 Series B announcement and 2023 manufacturing-profile coverage still identify Xavier Orr as CEO, while the 2026 press kit, Series C announcement, and company about page identify Chris Shaw as CEO and co-founder. That suggests the company has shifted from an Orr-fronted founding period into a Shaw-led scaling phase without disavowing the original founding narrative. Governance also appears more institutional than founder-only today. The about page lists Malcolm Turnbull as chairman alongside directors and investor-linked board participants including Kell Reilly, Louis Casey, Martin Duursma, and Vance Serchuk. At the executive level the company now discloses a CFO, CRO, chief product officer, chief supply chain
    officer, and chief people officer, indicating a more mature operating structure than the founder-led organization described in older articles.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO018
  - CO019
  - CO042
  tableRefs:
  - TO002
- id: capital-scale-and-global-footprint
  title: Capital Formation, Scale Signals, and International Reach
  body: 'Advanced Navigation’s public financing history is now clear enough to establish late-stage status, even if some economics remain private. The company’s official 2022 announcement says KKR led a USD 68 million / AUD 108 million Series B and lifted lifetime capital raised above USD 85 million at the time. Official and independent March 2026 sources then converge on a US$110 million / A$158 million Series C led by Airtree with Quadrant and the NRFC, while external reporting says the company is now in unicorn territory and expects revenue above US$100 million in 2026. The strongest scale signals are operational rather than purely financial: the 2026 Series C announcement says the company has deployed more than 100,000 systems worldwide and generates more than 80% of revenue in the U.S. and Europe, while customers publicly named across retained sources include Anduril, NOAA, Hanwha, BHP, Rheinmetall, and Intuitive Machines. The company is clearly not Australia-only anymore, but exact
    2026 global client count, full country count, and audited revenue remain less transparent than the topline growth narrative.'
