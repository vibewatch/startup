company:
  name: Advanced Navigation
chapter:
  number: 1
  title: Company Overview
  summary: 'Advanced Navigation is a Sydney-headquartered Australian navigation and autonomy company founded in 2012 by Xavier Orr and Chris Shaw, now led by Shaw as CEO and positioned around GPS-independent positioning, navigation and timing systems. Official and independent March 2026 coverage confirms a US$110 million Series C led by Airtree with NRFC participation, more than 100,000 deployed systems, and revenue concentration in the U.S. and Europe, while older reporting shows an earlier Xavier-Orr-led phase, early profitability, and deep Australian manufacturing roots. The main diligence caveat is not product-market fit but disclosure quality: exact 2026 valuation, global headcount, cap-table terms, and independent employee-sentiment evidence remain only partially visible in public sources.'
sections:
- id: identity-product-platform
  title: Identity, Core Problem, and Product Platform
  body: Advanced Navigation presents itself as a navigation and autonomous-systems company built for environments where GNSS or GPS cannot be relied on as a single source of truth. Across its homepage, about page, press kit, and sector pages, the company consistently frames the business around resilient positioning for land, air, sea, space, defence, and mining use cases rather than around a single device SKU. That positioning matters because it ties the company to a large systems problem—maintaining trusted navigation under jamming, spoofing, dropouts, underground operations, subsea missions, and off-Earth environments—rather than to a narrow sensor vendor category. The company also emphasizes vertically integrated Australian manufacturing, software-enhanced hardware, and an expanding stack that now spans inertial, photonic, quantum, and underwater systems. In practice, the business model looks like high-value hardware plus embedded software sold into mission-critical platforms, with product
    families and application modules tuned for defense, mining, space, and autonomous systems customers that need assured PNT rather than commodity GPS receivers.
  claimRefs:
