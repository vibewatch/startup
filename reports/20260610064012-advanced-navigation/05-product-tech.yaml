- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: Across sectors, the operating flow starts with a GNSS-vulnerable mission, moves through sensor and platform selection, and then adds the minimum aiding needed to deliver trustworthy navigation.
  approximationNotes: The flow intentionally abstracts several sectors into one repeatable pattern. It reflects public workflow descriptions rather than an internal sales-process diagram.
