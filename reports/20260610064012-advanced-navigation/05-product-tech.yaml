- id: TE002
  title: Workflow / use-case table
  enumerationScope:
    coverage: partial
    basis: Rows focus on customer workflows explicitly described on official sector pages or corroborated by deployment reports, not every end market named in marketing copy.
  columns:
  - User job
  - Current workflow pain
  - Company solution
  - Primary product(s)
  - Supportable benefit
  - Limitation / watchout
  rows:
  - - Defense assured PNT on retrofits and uncrewed platforms
    - GNSS jamming or spoofing, slow legacy lead times, integration friction
    - Open-architecture inertial core with north-seeking heading and optional EP or ECCM
    - Boreas 50, Boreas D series
    - Faster retrofit path and resilient heading or positioning in contested environments
    - Public proof is strongest on product intent and specs, weaker on independent combat-program deployment depth
  - - Mining fleet uptime and drill alignment
    - GNSS or RTK dropouts stop haul trucks and precision work
    - Platform-agnostic INS plus hybrid aiding for underground or surface continuity
    - Boreas 50, Boreas D90 plus LVS hybrid architecture
    - Less downtime and sub-0.1% distance-traveled error in published mine tests
    - Best underground results still rely on a hybrid stack, not inertial alone
  - - Subsea survey without large crews
    - Conventional dives and ROV missions are expensive and operationally heavy
    - Compact autonomous AUV with integrated imaging, navigation, and modems
    - Hydrus
    - Single-person deployment, georeferenced imagery, repeatable autonomous missions
    - Cost and autonomy claims are still mainly company-reported
  - - Underwater positioning and communications
    - Absolute underwater position is hard without acoustic infrastructure and heading transfer
    - Miniature USBL or acoustic modem with integrated INS and acoustic heading transfer
    - Subsonus
    - Compact underwater positioning and modem functionality with browser-based setup
    - Public proof is stronger on architecture than on large customer references
  - - Spacecraft orbit and lunar descent navigation
    - No GNSS in orbit or at lunar landing, visual conditions can degrade
    - Space-grade inertial payloads and LiDAV-based landing aid
    - Boreas X90, LUNA
    - Precise orientation, velocity, and altitude data for orbital or landing maneuvers
    - Public maturity remains pre-scale and partner-program dependent
  - - OEM platform integration and support
    - Multiple interfaces, firmware, and maintenance tools can slow adoption if immature
    - Current docs, SDKs, web interfaces, and support tooling across product families
    - Documentation portal, product web UIs, SDKs
    - Visible integration surface and active maintenance are better than many hardware startups
    - Public tooling existence does not prove low support burden or short qualification cycles
  notes: Rows describe workflow outcomes in customer terms and explicitly separate supportable public benefits from residual diligence risk.
