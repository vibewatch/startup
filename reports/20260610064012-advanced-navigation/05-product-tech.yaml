  evidenceGaps:
  - type: missing-source
    severity: material
    topic: formal-certifications
    missingEvidence: Public enterprise-level quality, cyber, or secure-development credentials such as ISO 9001, ISO 27001, AS9100, penetration-test summaries, or equivalent certification scope statements.
    whyItMatters: Mission-critical hardware credibility depends on more than ruggedized product pages; company-wide quality and cyber-assurance evidence affects trust in manufacturing discipline and secure deployment.
    diligencePath: Request current certificates, scope statements, customer DDQ responses, and the latest independent security or quality audit summaries.
    relatedQuestionRefs:
    - QE023
    - QE026
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: field-reliability-metrics
    missingEvidence: MTBF, field failure rates, warranty returns, RMA patterns, and reliability breakdowns by product family.
    whyItMatters: Public specs and launch coverage do not reveal whether flagship systems deliver dependable performance across harsh environments after shipment.
    diligencePath: Request reliability dashboards, warranty reserve data, return reasons, and product-family service statistics for the last 12 to 24 months.
    relatedQuestionRefs:
    - QE015
    - QE019
    - QE026
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: manufacturing-boundary
    missingEvidence: The exact make-buy boundary for FOG coils, MEMS assemblies, calibration, electronics, and what portion of production or support will shift into regional COEs.
    whyItMatters: Vertical integration is a core differentiator claim, but investors need to know which operations are genuinely in-house versus supplier-dependent to judge cost, resilience, and geopolitical risk.
    diligencePath: Request a manufacturing walkthrough, product-family process map, and supplier concentration view showing which steps are performed in Sydney, Botany, or overseas.
    relatedQuestionRefs:
    - QE017
    - QE018
    - QE026
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: roadmap-commitments
    missingEvidence: Firm customer commitments, qualification artifacts, and production dates for LUNA, LiDAV-derived products, and other advanced pipeline items.
    whyItMatters: The public pack shows serious progress, but without program and commercialization evidence it is hard to separate near-term revenue products from technically impressive but still pre-scale adjacencies.
    diligencePath: Request customer contracts, TRL or qualification documents, production-readiness gates, and first-unit delivery schedules for each advanced program.
    relatedQuestionRefs:
    - QE013
    - QE022
    - QE026
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: sku-level-installed-base
    missingEvidence: Installed base, deployment mix, support burden, and economics by SKU or product family rather than company-wide deployment claims.
    whyItMatters: Product maturity and differentiation vary materially across Boreas, Certus, Hydrus, Subsonus, and space programs, so chapter judgment improves if adoption is broken out line by line.
    diligencePath: Request deployments by SKU, active support contracts, top field issues, and revenue or margin mix by product family.
    relatedQuestionRefs:
    - QE001
    - QE019
    - QE025
    - QE026
    relatedTableRefs:
    - TE001
    - TE005
