- id: reliability-quality-and-manufacturing-controls
  title: Trust and reliability controls are strongest at the product level and the Sydney manufacturing level
  body: 'Public proof for trust and quality is meaningful, but it is unevenly distributed. At the product level, Boreas pages cite MIL-STD 461 and 810H environmental and electromagnetic testing, IP67 protection, shock and vibration resilience, and long-duration internal logging. Certus, Orientus, and Spatial FOG Dual all describe health monitoring, instability prevention, or safety-oriented real-time software design, while the documentation portal shows a living support surface with current manuals, firmware, 3D models, and SDKs for multiple products. Third-party launch coverage adds one more customer-facing trust signal: Advanced Navigation says Boreas 50 is ready in weeks rather than years and carries a three-year warranty. The manufacturing story is also unusually central to the thesis. Official and independent sources place production and research capability in Sydney and Botany, tie the UTS Tech Lab facility to DFOG scale-up and research commercialization, and repeatedly frame the company
    as vertically integrated. The September 2025 expansion announcement extends that logic into UK, US, and Europe Centers of Excellence that are meant to scale manufacturing, engineering, support, servicing, quality assurance, and interoperability. The gap is that public trust proof remains much clearer on ruggedization and support tooling than on company-wide certification. We did not retain public ISO 9001, ISO 27001, AS9100, independent cyber-test, or MTBF disclosures, so the diligence view should distinguish product-level ruggedness from fully evidenced enterprise quality systems.'
