tables:
- id: TE001
  title: Product module / asset matrix
  enumerationScope:
    coverage: partial
    basis: Rows cover the mission-critical product lines and adjacent assets repeatedly visible on current official pages, technical docs, and third-party deployment material as of the run date.
  columns:
  - Product line / asset
  - Primary workflow job
  - Public maturity / status
  - Key differentiator
  - Deployment / integration note
  - Diligence gap
  rows:
  - - Boreas D70 / D90
    - Strategic-grade GNSS/INS for hard GNSS-denied missions
    - Active flagship FOG line
    - North-seeking digital FOG, EP variants, high accuracy and ruggedization
    - Ethernet, CAN, RS232, RS422, GPIO, web UI, long logging
    - Need independent MTBF, realized lead times, and production volumes
  - - Boreas A50 / D50 (50 Series)
    - Compact FOG AHRS / INS refresh for defense, mining, and maritime retrofits
    - Active; general availability from late 2025
    - 910 g form factor, north-seeking gyrocompass, optional ECCM or EP, drop-in migration path from older hardware
    - Designed to integrate into new and legacy platforms; dual-antenna variant milestone called out for July 2026
    - Need independent proof of ECCM efficacy and actual ship-rate versus marketing timelines
  - - Certus
    - Lower-SWaP dual-antenna MEMS GNSS/INS for OEM and rugged deployments
    - Active and maintained
    - AI-based sensor fusion, 1 cm RTK, timing outputs, OEM or rugged packaging
    - Multi-protocol interfaces, Kinematica compatibility, license-free RTK claim
    - Need external benchmarking of drift, robustness, and volume field performance
  - - Hydrus
    - Compact autonomous underwater survey vehicle
    - Active and documented
    - Integrated DVL, USBL, INS, modem, 4K imaging, open software payload model
    - Standalone or Subsonus-assisted mission modes; single-user deployment
    - Need independent validation of cost savings and mission endurance in production fleets
  - - Subsonus
    - Compact underwater USBL / INS and acoustic modem
    - Active and documented
    - Eight-channel hydrophone array, titanium enclosure, internal processing, acoustic heading transfer
    - Single Ethernet connection and browser-based UI simplify integration
    - Need broader third-party proof on long-duration field reliability and positioning error at scale
  - - Boreas X90 and LUNA
    - Space and lunar navigation payloads
    - Advanced but not broadly commercialized in public evidence
    - Space-grade DFOG inertial navigation plus LiDAV-based lunar descent sensing
    - Partner-led space integration rather than off-the-shelf high-volume delivery
    - Need customer contracts, qualification artifacts, and recurring production evidence
  - - Orientus / Spatial FOG Dual
    - Legacy IMU / GNSS-INS lines supporting installed base
    - Transitioning or sunset
    - Still documented, but publicly on end-of-life programs
    - Support and firmware remain visible while customers migrate
    - Need installed-base size and migration completion plan
  notes: The table distinguishes active flagship, active refresh, advanced adjacency, and sunset status rather than treating every line as equally mature. Where public evidence is ambiguous, maturity is stated conservatively.
