- id: TE003
  title: Technology / operating architecture table
  enumerationScope:
    coverage: partial
    basis: 'Rows isolate the architectural layers that are most important to the assured-PNT thesis: inertial core, aiding stack, interface layer, underwater extension, and manufacturing or support layer.'
  columns:
  - Layer / component
  - Role in workflow
  - Supportable evidence
  - Key dependency
  - Primary risk
  rows:
  - - Digital FOG core
    - Provides high-end inertial sensing and gyrocompass north-seeking for GNSS-denied missions
    - Boreas pages describe closed-loop optical coil design, Earth-rotation heading, ruggedized packaging, and strategic-grade positioning
    - Precision manufacturing, calibration, optical components, and continued field qualification
    - Premium performance claims can outrun independent proof on long-run reliability and unit cost
  - - MEMS plus AI fusion core
    - Provides lower-SWaP position, orientation, and timing with GNSS aiding where allowed
    - Certus page shows calibrated MEMS, dual-antenna GNSS, health monitoring, and AI-based fusion
    - GNSS availability, calibration quality, and software tuning
    - Best outcomes still depend on aided conditions rather than pure inertial endurance
  - - Velocity or position aiding sensors
    - Constrains drift or adds absolute position where inertial alone would degrade
    - Callio article pairs LVS with Boreas D90; Hydrus manual uses Subsonus-assisted mode; Spatial FOG Dual supports DVL and USBL peripherals
    - Correct sensor pairing and installation discipline
    - Marketing can overstate autonomy if the aiding stack is not disclosed clearly
  - - Underwater acoustic stack
    - Extends the portfolio into subsea positioning, modem, and heading transfer workflows
    - Subsonus product and docs describe eight-channel hydrophones, dynamic encoding, acoustic heading transfer, and integrated processing
    - Water conditions, speed-of-sound behavior, and vehicle integration
    - Broader third-party proof is thinner than official architecture detail
  - - Operator and integrator surface
    - Reduces adoption friction through browser tools, SDKs, firmware managers, and logging
    - Documentation portal lists SDKs, managers, firmware, and manuals across product families
    - Documentation freshness, support response, and stable protocols
    - Visible tools do not by themselves prove low support burden or easy qualification
  - - Manufacturing and service network
    - Turns designs into deliverable products and supports fielded fleets
    - Sydney/Botany facility plus planned COEs for manufacturing, engineering, support, and servicing
    - Make-buy boundaries, supplier resilience, and regional ramp execution
    - Vertical integration claims are strong, but exact component-level boundaries are not public
  - - Space and photonics adjacencies
    - Pushes the inertial core into LiDAV and lunar or orbital navigation
    - LUNA and LiDAV materials show space-specific sensing and laser-based ranging or velocity logic
    - Qualification success, customer programs, and production economics
    - Public evidence proves technical progress more than scaled commercialization
  notes: This table keeps AI, MEMS, FOG, laser, and acoustic claims inside the narrower boundaries actually supported by current official or technical sources.
