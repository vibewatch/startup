chapter:
  number: 5
  title: Product & Technology
  summary: 'Advanced Navigation now presents a layered assured-PNT product stack rather than a single INS line: Certus and other MEMS systems for lower-SWaP deployments, Boreas FOG systems for GNSS-denied and contested missions, Hydrus and Subsonus for subsea workflows, and LUNA or Boreas X90 for space. Public evidence supports real technical depth through north-seeking FOG, bounded AI-assisted sensor fusion, current SDK and documentation tooling, independent underground-mining validation, and Sydney/Botany manufacturing, but broad trust and quality positioning still outruns public proof on formal certifications, field reliability metrics, and exact make-buy boundaries. The best reading is a mature, actively refreshed hardware-plus-software platform with visible legacy pruning and real deployment proof, alongside diligence items that still require management data rather than website trust.'
sections:
- id: workflow-defined-product-stack
  title: The portfolio is organized around mission workflows, not around a single navigation box
  body: 'Advanced Navigation’s current product surface reads like a workflow stack for assured positioning, navigation, and timing rather than a narrow inertial-sensor catalog. The official solutions surface groups the business into MEMS IMU/AHRS, FOG IMU/AHRS, MEMS GNSS/INS, FOG GNSS/INS, and acoustic navigation plus micro-AUV products, while the space and sector pages extend that logic into orbital and lunar navigation workflows. In practice, that means the company is solving several adjacent jobs with one inertial-first core: lower-SWaP navigation and timing for OEM integration, higher-end north-seeking FOG systems for GNSS-denied or contested environments, underwater survey and acoustic-positioning workflows, and emerging space-navigation payloads. The supportable product map is also more mature than a pure concept story. Boreas D70 and D90 remain the flagship rugged FOG INS line, Boreas 50 is the compact refresh for faster fielding, Certus carries the AI-fused MEMS dual-antenna tier,
    Hydrus packages underwater autonomy into an operator-friendly vehicle, and Subsonus adds compact USBL positioning. At the same time, the documentation surface shows legacy pruning through Orientus and Spatial FOG Dual end-of-life programs, which is consistent with a company consolidating toward newer SKUs rather than endlessly accumulating overlapping hardware.'
