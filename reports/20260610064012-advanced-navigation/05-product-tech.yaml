- id: inertial-first-architecture-and-integration
  title: The supportable architecture is inertial-first, multi-sensor, and integration-conscious
  body: 'The company’s strongest technical story is not that it has eliminated every external dependency, but that it starts from an inertial core and layers in the right aiding sensors for each workflow. On the FOG side, Boreas product pages describe north-seeking gyrocompassing from Earth rotation, removing dependence on GNSS or magnetometers for heading initialization, while official and third-party 2025 releases frame Boreas 50 as a smaller package that still preserves strategic-grade positioning logic. On the MEMS side, Certus combines calibrated accelerometers, gyroscopes, magnetometers, pressure sensing, dual-antenna GNSS, and an AI-based fusion algorithm, giving the company a lower-SWaP tier for buyers that still want centimeter RTK, time synchronization, and broad protocol support. The underwater stack shows the same pattern. Hydrus combines INS, DVL, USBL, acoustic and optical modem links, and obstacle avoidance, while its manual splits deployment into standalone dead-reckoning
    mode and Subsonus-assisted missions when better absolute positioning is needed. Public support surfaces also show real integrator intent: multiple interfaces, browser-based configuration, internal logging, firmware tooling, and SDKs in C/C++, Java, and .Net. The caution is that many of the headline outcomes still depend on aiding. Best-case positioning often uses RTK GNSS, dual antennas, DVL, USBL, or one-time surface calibration, so the right underwriting frame is resilient inertial-centered architecture, not magical pure-inertial perfection.'
