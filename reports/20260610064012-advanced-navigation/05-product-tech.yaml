- id: TE004
  title: Trust / quality / compliance table
  enumerationScope:
    coverage: partial
    basis: Rows list public trust, reliability, quality, and compliance signals that are explicit in retained sources; absence of a row does not mean the control is absent in reality.
  columns:
  - Control / indicator
  - Public status
  - Scope
  - Evidence
  - Gap / caveat
  rows:
  - - MIL-STD 461 / 810H ruggedization
    - Explicitly claimed
    - Boreas D series and Boreas 50 product surfaces
    - Official product pages cite environmental and electromagnetic testing to military standards
    - Public pages do not provide third-party test reports or failure-rate data
  - - IP67 enclosure protection
    - Explicitly claimed
    - Boreas D series and Boreas 50
    - Official pages describe waterproof and dustproof IP67 housing
    - No public certification file or ingress-test artifact was retained
  - - Safety-oriented real-time software / fault tolerance
    - Explicitly claimed
    - Orientus and Spatial FOG Dual reliability messaging
    - Official pages say software is designed and tested to safety standards with fault tolerance in mind
    - This is product-page language, not an externally audited safety case
  - - Health monitoring / instability prevention
    - Explicitly claimed
    - Certus and related AI-fusion stack
    - Certus page says the algorithm includes health monitoring and instability prevention
    - No public benchmark or false-positive / false-negative data
  - - Current docs, firmware, and SDK surface
    - Explicitly visible
    - Multiple current and legacy products
    - Documentation portal lists 2026 manuals, firmware, SDKs, and manager tools
    - Tooling visibility does not prove enterprise support SLAs or low ticket volume
  - - Three-year warranty and fast delivery
    - Third-party repeated company claim
    - Boreas 50 family
    - InsideGNSS and Sea Power repeat company statements on weeks-not-years lead times and three-year warranty
    - No public warranty terms, return-rate data, or delivered lead-time distribution
  - - ITAR-free and onshore supply posture
    - Explicitly claimed
    - Defense and broader manufacturing narrative
    - Defense page and expansion release frame the stack as ITAR-free with vertically integrated manufacturing
    - Exact make-buy boundary and export-control handling details are not public
  - - Company-wide formal certifications
    - Unknown from retained public pack
    - Enterprise quality or cyber-compliance surface
    - No retained source clearly lists ISO 9001, ISO 27001, AS9100, or equivalent certificates for the company
    - Needs direct diligence rather than assumption
  notes: The strongest public trust evidence is product-level ruggedization, documentation, and support tooling. Company-wide certification and measured field reliability remain evidence gaps, not silent passes.
