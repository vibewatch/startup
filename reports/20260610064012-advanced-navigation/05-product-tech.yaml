callouts:
- calloutType: strength
  title: This is a layered platform story, not a single-SKU startup story
  body: The company has visible products across MEMS, FOG, subsea autonomy, acoustic positioning, and space adjacencies. That breadth makes the platform real, even if each line sits at a different maturity point.
  claimRefs:
  - CE001
  - CE009
  - CE011
  - CE012
  - CE045
- calloutType: insight
  title: Portfolio management looks deliberate because active maintenance coexists with explicit sunsets
  body: Current 2026 firmware and SDK updates for live products sit alongside named end-of-life schedules for Orientus and Spatial FOG Dual. That is a stronger maturity signal than vague roadmap language.
  claimRefs:
  - CE014
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
- calloutType: risk
  title: Public trust proof is materially thinner than public performance messaging
  body: Product pages and launch articles support ruggedization, documentation, and some warranty claims, but public evidence still does not clearly show company-wide quality certifications, cyber-assurance artifacts, or field failure metrics. That keeps product-tech diligence cautious on enterprise reliability.
  claimRefs:
  - CE021
  - CE035
  - CE047
  - CE048
