  - CE049
  data:
    nodes:
    - id: mission-problem
      label: Mission Problem
      detail: Buyer starts with GNSS denial, interference, underground drift, or underwater positioning limits.
    - id: platform-fit
      label: Platform Fit
      detail: Choose MEMS, FOG, subsea vehicle, or acoustic stack based on SWaP, environment, and accuracy needs.
    - id: integration
      label: Integration
      detail: Use standard interfaces, web tools, firmware managers, and SDKs to attach the navigation core to the platform.
    - id: aiding
      label: Aiding Choice
      detail: Add GNSS, dual antennas, LVS, DVL, or USBL only where the workflow needs lower drift or absolute position.
    - id: operations
      label: Operations
      detail: Product runs in defense, mining, subsea, or space workflow with logs, monitoring, and support.
    - id: outcome
      label: Outcome
      detail: Goal is resilient heading or positioning with less stoppage, faster retrofit, or lower crew burden.
