  foundingLocation: San Francisco, California
  headquarters: San Francisco, California
  productSummary: >-
    Distyl sells Distillery, an AI-native enterprise workflow platform built around context capture,
    agent orchestration, evaluation, governance, and workflow-specific routines. The company pairs
    the platform with forward-deployed engineers to implement enterprise agents and decision systems
    inside customer operations.
  customerFocus: >-
    Fortune 500 and Fortune 100 enterprises in telecom, healthcare, insurance, manufacturing,
    financial services, retail, and other complex operational environments.
  businessModel: >-
    Outcome-based enterprise engagements plus ongoing platform licensing and maintenance for
    production AI systems; public evidence suggests a services-heavy go-to-market motion with a goal
    of platform leverage over time.
  stage: Private / Series B
  fundingStatus: >-
    Distyl has raised about $202 million across a $7 million seed (2023), $20 million Series A
    (2024), and $175 million Series B (2025), with the latest round valuing the company at $1.8
    billion.
