  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: soc2-gap
    missingEvidence: External security audit package, SOC 2 report, penetration-test summary, and cyber-insurance schedule.
    whyItMatters: Without external assurance artifacts, investors cannot independently evaluate production-agent control maturity
      or residual breach risk.
    diligencePath: Request the latest security diligence packet and any customer-facing assurance reports.
    relatedQuestionRefs:
    - QR018
    - QR020
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: hipaa-gap
    missingEvidence: Healthcare workflow inventory, BAA template, HIPAA risk assessment, and breach escalation policy.
    whyItMatters: Healthcare case studies create potential PHI exposure, but public materials do not show the contractual
      or technical controls required to assess that exposure.
    diligencePath: Ask management to identify every healthcare deployment involving PHI or regulated decision support and
      share the related control package.
