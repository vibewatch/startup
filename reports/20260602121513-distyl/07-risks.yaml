  - CR023
  tableRefs:
  - TR001
- id: technology-dependency-risk
  title: Technology and Dependency Risk
  body: 'Distyl''s go-to-market story is strengthened by marquee partnerships, but those same partnerships define the company''s
    core technology dependency profile. Distyl publicly positions itself alongside Google Cloud Gemini Enterprise, NVIDIA
    AI Enterprise, and the broader OpenAI, Azure, and Anthropic ecosystem described by Channel Dive. That is strategically
    sensible for a fast-moving enterprise agent vendor, yet it means critical layers of model quality, inference cost, infrastructure
    availability, and policy permissibility are controlled by third parties. The risk is not merely that a partner terminates
    a relationship. More realistically, pricing, roadmap shifts, region-specific restrictions, or safety-policy changes can
    raise cost, slow deployments, or constrain regulated use cases exactly where Distyl claims the strongest traction. Partnership
    announcements also create execution expectations with customers: if Distyl is marketed as a priority Google Cloud partner
    and an NVIDIA-enabled platform, enterprise buyers may underwrite that ecosystem durability into procurement decisions.
    That raises residual exposure if those programs change or if Distyl cannot keep pace with partner certification and product-cycle
    requirements.'
  claimRefs:
  - CR008
  - CR009
  - CR024
  - CR027
  - CR028
  - CR040
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: operational-risk
  title: Operational, Quality, and Security Risk
  body: 'Operational risk is unusually important for Distyl because the company does not sell lightweight experimentation;
    it advertises production AI systems, measurable customer outcomes, and deep insertion into enterprise processes. That
    positioning increases the downside of model failure modes identified in the OWASP guidance, especially prompt injection,
    insecure tool use, data leakage, and brittle long-running agent behavior. Distyl''s public materials do not disclose a
    SOC 2 report, security audit summary, cyber insurance, or a public incident history, so investors cannot independently
    score the maturity of logging, red-team coverage, tenant isolation, or breach response. Privacy disclosures confirm that
    personal data is collected, and healthcare case studies raise the possibility of PHI-adjacent workflows, which means the
    impact of an outage or policy violation would extend beyond normal uptime concerns into contractual, regulatory, and reputational
    channels. The company''s claimed production record and end-user scale therefore cut both ways: they support relevance,
    but they also magnify the consequences of a control failure before external assurance evidence is available.'
  claimRefs:
  - CR007
  - CR010
  - CR018
  - CR019
  - CR020
  - CR024
  - CR025
  tableRefs:
  - TR002
  figureRefs:
  - FR001
- id: legal-ip-risk
  title: Legal, IP, and Contract Structure Risk
  body: 'The legal and IP picture around Distyl is better described as incomplete than clean. The pending DISTYL trademark
    application is useful evidence that the brand is being formalized, but it is still an unexamined application rather than
    a mature, registered portfolio. The company''s public legal documents are protective of Distyl rather than comfort-inducing
    for investors or enterprise counterparties: mandatory arbitration, class-action waiver language, and tight liability caps
    reduce the company''s open-ended exposure, but they also signal that meaningful losses would likely be pushed back onto
    customers or litigated privately. The absence of public litigation in the reviewed record is directionally helpful, yet
    arbitration clauses reduce the likelihood that disputes would become visible in court dockets. Likewise, no public Form
    D evidence does not imply no financing complexity; it only means public securities filing visibility is thin. From an
    investment perspective, the practical implication is that contract libraries, insurance schedules, IP assignments, open-source
    policy, and trademark strategy should all be mandatory data-room items rather than assumed controls.'
  claimRefs:
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR033
  - CR041
- id: market-competitive-risk
  title: Market and Competitive Risk
  body: 'Distyl operates in a market where buyer enthusiasm is high but durability is still unproven. The company has strong
    positioning with blue-chip enterprises and can point to a large user-reach claim, yet it competes against scaled incumbents
    such as ServiceNow, Palantir, UiPath, Pegasystems, and C3.ai that already publish revenue, market-cap, or ARR figures
    far beyond Distyl''s public disclosure level. That scale gap matters in two ways. First, larger vendors can bundle AI
    into existing workflow or data-platform contracts, making Distyl''s standalone economics harder to defend. Second, adverse
    market commentary is increasingly warning that AI-native revenue may prove less durable than classic SaaS if much of the
    spend is transformation-project or pilot-like rather than subscription-retentive. Distyl''s case studies help on proof
    of value, but they do not resolve renewal, expansion, or concentration. Because no public revenue, margin, or retention
    data is available, valuation and competitive risk collapse into the same question: can Distyl turn visible customer outcomes
    into recurring, defendable software economics before incumbents close the functionality gap?'
  claimRefs:
  - CR026
  - CR029
  - CR030
  - CR031
  - CR032
  - CR034
  - CR035
  - CR036
  - CR037
  - CR038
  - CR039
  figureRefs:
  - FR002
- id: mitigation-kill-criteria
  title: Mitigation Framework and Kill Criteria
  body: 'The mitigating case for Distyl is real but conditional. Capital is not the constraint in the near term: the Series
    B gives management resources to harden controls, deepen partnerships, and professionalize legal and compliance operations.
    The company also benefits from strong production-oriented messaging, marquee partners, and enterprise outcome case studies.
    Those positives, however, only matter if investors convert them into monitorable requirements. The cleanest mitigation
    plan is therefore not broad optimism; it is a short list of non-negotiable diligence asks and thesis-break triggers. Before
    underwriting the company, investors should require evidence of security assurance, healthcare-compliance posture where
    relevant, partner-contract durability, customer-retention visibility, leadership-bench depth, and basic insurance coverage.
    Stop conditions should be triggered by any material failure in those domains: no external control evidence, a major partner-policy
    change, leadership concentration that cannot be mitigated, evidence that customer work is non-recurring or highly concentrated,
    or any regulatory finding tied to privacy or healthcare handling. Distyl is investable only if the data room turns today''s
    public evidence gaps into verifiable controls rather than persistent unknowns.'
  claimRefs:
  - CR018
  - CR019
  - CR020
  - CR028
  - CR029
  - CR040
  - CR041
