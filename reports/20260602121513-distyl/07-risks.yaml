- id: TR005
  title: Mitigation and thesis-break criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Security assurance gap
    - External controls package missing
    - No SOC 2 or equivalent security audit, no pentest summary, and no insurance evidence before close
    - Pause investment until controls package is delivered and independently reviewed
  - - Healthcare compliance gap
    - Healthcare workflows cannot be mapped to a BAA and HIPAA control set
    - Any PHI-adjacent deployment without documented contractual and technical safeguards
    - Treat as thesis break for healthcare-weighted revenue assumptions
  - - Partner dependency shock
    - Model or cloud partner changes terms
    - Material pricing change, region restriction, or loss of priority-partner eligibility
    - Rebuild downside case and require updated gross-margin and roadmap model
  - - Retention opacity persists
    - Management cannot disclose GRR, NRR, or renewal evidence
    - No cohort or renewal data by diligence close
    - Move recommendation to avoid because durability remains unknowable
  - - Customer concentration hidden
    - Top-customer share remains undisclosed despite diligence requests
    - No top-10 account concentration view before term sheet
    - Assume concentration risk and haircut valuation materially
  - - Legal / IP immaturity
    - Trademark and contract diligence reveal weak coverage
    - Pending mark only, no enterprise MSA carve-outs, or unresolved IP assignment issues
    - Require remediation plan or stop underwriting process
  notes: Break criteria are intentionally monitorable. The point is not to predict failure frequency, but to define evidence
    thresholds that convert today's public unknowns into investable or non-investable states.
