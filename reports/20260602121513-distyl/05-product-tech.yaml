chapter:
  number: 5
  title: Product & Technology
  summary: Distyl AI sells Distillery, an enterprise AI workflow-intelligence layer that combines Context Mesh grounding, embedded delivery teams, and partner-model infrastructure from vendors such as NVIDIA, OpenAI, and Google Cloud. Public evidence supports technical depth and real deployments, but product maturity remains partly opaque because customer references are anonymized and no public trust center, status page, or certification set is visible.
sections:
- id: product-definition-and-modules
  title: Product Definition and Module Surface
  body: 'Distyl defines its product in workflow terms rather than as a standalone chatbot. The public surface describes Distillery as the company''s enterprise AI workflow-intelligence platform, with Context Mesh assembling enterprise knowledge, policies, and prior decisions into grounded agent context before model calls are made. The visible module surface is narrow but coherent: a core platform layer, a context-assembly layer, partner-model integrations, evaluation and research tooling, and customer-specific workflow packages shown through anonymized case studies. Those case studies anchor the product in operational jobs such as telecom customer support, healthcare case handling, manufacturing root-cause analysis, auto-finance detection, and CPG exception management. The result is a product story centered on measurable enterprise workflow outcomes rather than generic conversational AI, but the absence of named customer references and detailed module documentation means the exact SKU map
    and module-level maturity still require direct diligence.'
  claimRefs:
  - CE001
  - CE002
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE036
  - CE038
