  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: SOC 2, ISO 27001, HIPAA, pen-test summaries, or a trust-center export for Distyl's current production environment.
    whyItMatters: Large-enterprise procurement and regulated-workflow underwriting depend on auditable control evidence, not just privacy and terms pages.
    diligencePath: Request the latest security packet, certification letters, and a customer-facing trust-center walkthrough under NDA.
    relatedQuestionRefs:
    - QE008
    - QE009
    - QE024
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof
    missingEvidence: Named customer references, deployment scope documents, and implementation timelines for the anonymized case studies.
    whyItMatters: Anonymized outcome claims make it hard to validate whether the product works repeatedly across accounts or only in selected showcase deployments.
    diligencePath: Obtain at least three named reference calls and deployment architecture summaries tied to the outcome metrics in TE002.
    relatedQuestionRefs:
    - QE023
  - type: access-blocked
    severity: minor
    topic: case-study-detail-pages
    missingEvidence: Working detail pages or archived copies for the telecom, healthcare, hardware, F50 payor, and CPG case studies.
    whyItMatters: The index confirms the existence of these deployments, but the 404 pages prevent deeper product-scope and methodology review.
    diligencePath: Ask Distyl for PDFs or updated URLs for each referenced case study and map the product modules used in each deployment.
    relatedQuestionRefs:
    - QE010
    - QE011
    - QE012
    - QE013
    - QE014
    - QE023
  - type: missing-source
    severity: minor
    topic: release-cadence
    missingEvidence: A public changelog, release notes archive, uptime history, or versioned product roadmap.
    whyItMatters: Enterprise buyers need evidence that product maturity and support practices extend beyond major partnership announcements.
    diligencePath: Request internal release notes, support SLAs, and incident-review examples for the prior twelve months.
    relatedQuestionRefs:
    - QE021
  - type: stale
    severity: minor
    topic: benchmark-position
    missingEvidence: Updated benchmark data for Distyl's current production stack after the 2024 BIRD result and any GPT-4o lifecycle changes.
    whyItMatters: A historical benchmark win helps technical credibility, but investors need to know whether the current stack remains competitive.
    diligencePath: Ask Distyl for 2026 benchmark results, internal evals, and model-migration plans tied to current customer deployments.
    relatedQuestionRefs:
    - QE016
    - QE026
