  rows:
  - - Resolve telecom service issues through self-service and escalation routing
    - High-volume support interactions handled by human agents and fragmented knowledge tools
    - Distillery workflow intelligence plus Context Mesh-backed enterprise agents
    - Company claims $200M+ OpEx savings and 75%+ AI containment
    - Detail page is 404 and customer identity is withheld
  - - Triage healthcare payer cases at scale
    - Human review across rules, history, and policy data
    - Distyl workflow system for case handling and routing
    - Company claims $200M+ estimated savings and 200k+ cases per month
    - No named payer, audited savings basis, or module breakdown
  - - Diagnose hardware-manufacturer disruptions
    - Engineers manually investigate large volumes of operational alerts
    - Distyl workflows for root-cause analysis and exception prioritization
    - Company claims 80% faster root-cause analysis across 1,500+ disruptions per day
    - Architecture and measurement method are not public
  - - Detect issues in auto-finance / F50 healthcare-payor-2 workflow
    - Long implementation cycles before detection and remediation
    - Rapid Distyl deployment combining context assembly and workflow automation
    - Company claims 93% cost reduction and one-week kickoff-to-detection
    - Exact use case, customer identity, and pre/post baseline are undisclosed
  - - Improve CPG exception handling for non-technical users
    - Manual exception resolution handled by specialists or analysts
    - Distyl workflow tooling made available to 100+ non-technical users
    - Company claims 47% improvement in the target process
    - Case-study detail page is 404 and methodology is not public
