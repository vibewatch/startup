- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / Component
  - Role
  - Dependency
  - Risk
  rows:
  - - Enterprise knowledge sources and workflow data
    - Provide policies, history, and operational state used to ground workflows
    - Customer connectors, data hygiene, permissions, and SME participation
    - Incomplete or poor-quality enterprise data weakens grounding and output quality
  - - Context Mesh assembly layer
    - Builds dynamic context from enterprise knowledge for each workflow step
    - Indexing, retrieval, permissions, and enterprise system access
    - No public benchmark proves recall quality, latency, or permission isolation
  - - Distillery orchestration and memory layer
    - Coordinates agents, long-running tasks, evaluation, and workflow state
    - Distyl software plus customer process design and human-review loops
    - Reliability depends on workflow design discipline and scarce deployment talent
  - - Partner inference layer
    - Runs model calls through external providers such as GPT-4o, Nemotron, and Vertex AI
    - OpenAI, NVIDIA, Google Cloud, and related infrastructure economics
    - Model lifecycle, pricing, or availability changes can disrupt product performance
  - - Full-deployment-engineering operating layer
    - Embeds Distyl teams to reach production in customer environments
    - Access to customer staff, integrations, and Distyl staffing capacity
    - Services-heavy deployment model may limit scalability and key-person redundancy
  notes: Architecture is reconstructed from official pages, partner announcements, and reporting; Distyl has not published a public technical white paper.
