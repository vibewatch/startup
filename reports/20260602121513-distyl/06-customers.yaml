- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer/User/Payer
  - Use Case
  - Scale
  - Revenue/Strategic Value
  - Gap
  rows:
  - - Fortune 500 telecom / customer-care operators
    - 'Buyer: CX or operations leader; User: support agents and end customers; Payer: enterprise operations or transformation budget'
    - AI-assisted self-service, containment, and service resolution
    - Enterprise-scale; customer unnamed; consumer endpoint proven through T-Life
    - High strategic value because telecom volumes are large and company-claimed outcomes exceed $200M+
    - No named operator, geography split, or contract scope disclosed
  - - Healthcare payors / F50 payer ops
    - 'Buyer: payer ops or care-management leader; User: case reviewers and members; Payer: medical-operations or admin budget'
    - Case handling, automation, and detection workflows
    - 200k+ cases/month in one example; F50 scale in another
    - Large administrative savings and regulated-workflow relevance
    - Named payer, production breadth, and contract terms are undisclosed
  - - Industrial / hardware manufacturer operations
    - 'Buyer: manufacturing or operations leader; User: engineers and analysts; Payer: industrial operations budget'
    - Root-cause analysis and disruption triage
    - 1,500+ disruptions/day in company claim
    - Demonstrates daily operational embed and industrial credibility
    - No named customer or audited baseline is public
  - - CPG workflow teams
    - 'Buyer: supply-chain or commercial-ops leader; User: 100+ non-technical users; Payer: functional operations budget'
    - Exception handling and workflow improvement
    - 100+ users in company claim
    - Shows adoption beyond specialist engineering teams
    - Case-study detail page is 404 and customer remains unnamed
  - - Downstream consumer app deployment (T-Mobile T-Life)
    - 'Buyer: telecom digital-product team; User: wireless subscribers; Payer: telecom product or innovation budget'
    - Consumer AI assistant inside the carrier app
    - 75M+ app downloads
    - Named proof that Distyl-linked work can reach mass-market scale
    - Distyl role is indirect and public product-quality complaints exist
  - - Partner-influenced enterprise channel
    - 'Buyer: CIO or AI-program owner via cloud/model ecosystem; User: enterprise operators; Payer: enterprise transformation budget'
    - AI agents and workflow deployments through Google Cloud, NVIDIA, and OpenAI-adjacent ecosystems
    - Not quantified publicly
    - Could accelerate access to large enterprises and strategic accounts
    - Channel dependence, economics, and partner-sourced revenue are undisclosed
  notes: Rows reflect only the public customer surface; Distyl does not disclose a full customer roster, geography split, or revenue segmentation.
