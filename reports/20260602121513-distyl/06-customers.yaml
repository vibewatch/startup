  - FU002
- id: named-customer-proof
  title: Named customer proof and reference quality
  body: 'Customer proof is real but reference quality is mixed. The strongest public proof is T-Mobile T-Life: a named consumer app with 75M+ downloads, a 2026 Webby win, and independent coverage that links the AI assistant to Distyl''s work while also surfacing user complaints. Beyond that, Distyl publishes five anonymized case studies with very large claimed outcomes in telecom support, healthcare automation, manufacturing root-cause analysis, F50 detection, and CPG workflow improvement. Those outcomes are big enough to matter and are corroborated at least at the level of company statements plus fundraising or independent coverage. The problem is freshness and referenceability. Several detail pages now return 404, customers remain unnamed, and no buyer-side testimonial library or formal reference program is visible. Public evidence is therefore sufficient to underwrite serious production-oriented enterprise work, but not sufficient to underwrite a diversified, easy-to-call set of named reference accounts.'
