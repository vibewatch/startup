company:
  name: Distyl
chapter:
  number: 6
  title: Customers
  summary: Distyl AI's public customer story is strongest on claimed enterprise outcomes and downstream end-user reach, including one named deployment through T-Mobile T-Life and multiple anonymized Fortune 500 case studies. The public record is much weaker on retention, named references, and concentration, so customer quality looks promising but still requires direct diligence on renewals, expansion, and account mix.
acknowledgedWarnings:
- dimension: figureType
  reason: FU004 uses type matrix instead of the planned cohort figure because no public retention percentage data is available for Distyl AI enterprise customers; the matrix summarizes available qualitative retention and durability signals.
- dimension: paywallRisk
  reason: Several Distyl case-study detail pages and one Webby page are restricted or broken, but they remain necessary to document the state of the public customer proof set and still stay below the 30% chapter ceiling.
sections:
- id: customer-map-and-segmentation
  title: Customer map and segmentation
  body: Distyl's public customer map is skewed to very large enterprises rather than broad software teams. The homepage says the company is trusted by Fortune 500s and powers experiences that reach 150M+ end users, while the case-study index spans telecom, healthcare payor operations, hardware manufacturing, a second F50 detection workflow, and CPG exception management. That means the visible segmentation is by vertical and use case more than by geography or revenue band. The likely buyers are operations, CX, payer-ops, manufacturing, or transformation leaders; the users are frontline agents, analysts, care teams, and engineers; and the payers are enterprise operating or innovation budgets. T-Mobile's T-Life is the only clearly named downstream deployment, which proves Distyl can influence consumer-scale surfaces, but everything else remains anonymized. No public pricing page, self-serve signup, or community adoption loop is visible, so the customer base should be read as bespoke enterprise programs concentrated in large accounts.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU030
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-deployment
  title: Adoption trajectory and deployment model
  body: Adoption evidence is directional rather than cohort-based. Distyl's seed, Series A, and Series B announcements repeatedly tie the company to enterprise outcomes, and the later financing announcement says deployments are live across multiple Fortune 500 companies. Channel Dive adds the most operational detail by describing dedicated engineering teams embedded with customers for roughly eight to twelve weeks and an outcome-based pricing model. That implies an adoption trajectory built around targeted enterprise selling, scoped workflow discovery, embedded build, production launch, and then expansion into adjacent workflows instead of viral seat growth. T-Mobile's 75M+ downloads show at least one deployment touches mass-market end users, while the homepage's 150M+ end-user claim implies broader downstream reach across unnamed accounts. Still, Distyl discloses no customer count, active-account total, or deployment denominator, so the funnel has to be represented qualitatively rather than as a real account-conversion chart.
  claimRefs:
  - CU004
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU026
  tableRefs:
  - TU002
