- id: retention-and-durability
  title: Retention and durability evidence
  body: Durability is the weakest part of the public record. No reviewed source discloses NRR, GRR, churn, renewal cadence, contract length, or expansion revenue, so outside observers cannot tell whether early customer wins convert into compounding software-like economics. There are only qualitative hints. Multiple Fortune 500 deployments imply some repeatability, and the embedded-team model suggests Distyl gets deep enough into workflows that successful accounts could expand. T-Life also shows that at least one downstream deployment is still live and publicly visible. But these are not substitutes for cohort data. The same T-Life evidence includes complaints about buggy or irrelevant AI behavior, so the public signal on satisfaction is mixed rather than uniformly positive. As a result, the retention view has to be summarized as a qualitative matrix instead of a numeric cohort, and management should be pressed for renewal cohorts, contract terms, reference calls, and customer-success metrics.
  claimRefs:
  - CU025
  - CU027
  - CU028
  - CU029
  - CU042
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-and-channel-risk
  title: Expansion, concentration, and channel risk
  body: 'Expansion potential looks meaningful, but concentration risk is real. Distyl''s public evidence points to a land-and-expand motion in large accounts: embedded teams, outcome-based pricing, and workflow-specific deployments are all consistent with high ACV and multi-use-case expansion after a successful first project. The risk is that the same model can scale more slowly, depend on scarce deployment talent, and leave the company exposed to a small number of strategic customers and partners. Public proof is concentrated in one named deployment plus anonymized case studies, so there is no clean public view into top-customer mix or partner-sourced pipeline. Google Cloud and NVIDIA announcements show that hyperscaler relationships are part of the customer surface, while OpenAI ecosystem dependence remains visible in the broader stack. Market trackers and ambiguous SEC search results reinforce that commercial significance is being inferred from fundraising momentum and partner visibility more than from disclosed retention or concentration metrics.'
