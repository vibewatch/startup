  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: retention-nrr
    missingEvidence: NRR, GRR, churn rate, renewal cohorts, contract length, and expansion revenue are unavailable from public sources.
    whyItMatters: Without retention metrics, the durability and software-like quality of Distyl customer revenue cannot be assessed.
    diligencePath: Request renewal data, cohort tables, and customer-success scorecards directly from management.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU025
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: A current list of named production customers or at least dated reference accounts beyond T-Mobile.
    whyItMatters: Without named references, the public proof set may overstate breadth and understate concentration.
    diligencePath: Ask management for 3-5 named references and dated case-study PDFs.
    relatedQuestionRefs:
    - QU007
    - QU018
    relatedTableRefs:
    - TU003
  - type: access-blocked
    severity: material
    topic: case-study-detail-pages
    missingEvidence: Live versions or archived PDFs of the telecom, healthcare, hardware, F50, and CPG case-study detail pages.
    whyItMatters: 404 detail pages prevent validation of freshness, methodology, and exact deployment stage.
    diligencePath: Request the original case-study documents or archived copies from the company.
    relatedQuestionRefs:
    - QU007
    - QU010
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-5 account mix, and partner-sourced pipeline split.
    whyItMatters: Public evidence suggests a small number of strategic accounts and partners could dominate revenue and delivery capacity.
    diligencePath: Request a customer concentration schedule and partner attribution from finance and GTM leadership.
    relatedQuestionRefs:
    - QU017
