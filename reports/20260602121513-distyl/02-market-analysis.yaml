chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Distyl AI competes in the enterprise agentic AI workflow automation market, a segment
    distinct from generic AI software spend and growing faster than broader AI categories.
    Multiple analyst estimates place the addressable market at $7–57 billion by 2031 at
    CAGR of 42–47%, with Fortune 500 operations teams in telecom, healthcare, financial
    services, manufacturing, and insurance as the primary buyer. Enterprise AI is crossing
    from pilot to production in 2026, driven by an engineering-talent shortage and
    outcome-accountability pressure that favors Distyl's forward-deployed model, though
    data fragmentation, incumbent relationships, and model-commoditization risk constrain
    near-term scale.

sections:
  - id: market-boundary
    title: Market Boundary and Status-Quo Substitutes
    body: >-
      Distyl AI operates at the intersection of enterprise AI systems delivery and workflow
      automation—a narrower layer than the aggregate "enterprise AI" category cited by
      generic market reports. The relevant spend boundary covers three components: (1) AI
      system design and deployment engagements at Fortune 500 operations teams, (2) the
      Distillery AI platform licensing fees for ongoing AI workflow management, and (3) the
      research and evaluation services Distyl bundles into its vertically integrated model.
      Excluded from the addressable market are: raw foundation model API costs (paid to
      OpenAI, Anthropic, or cloud providers), horizontal cloud infrastructure (Microsoft
      Azure), generic RPA licenses without an AI orchestration layer, and standalone
      analytics or BI tooling. The key substitutes a Fortune 500 buyer can choose instead
      of Distyl include: large consulting firms (Accenture, Deloitte, BCG) that staff
      AI transformation programs using time-and-materials contracting; incumbent
      automation platforms (UiPath, ServiceNow, Pega) that offer pre-built AI agents
      within their existing enterprise footprint; and an internal "build-it-yourself"
      option using foundation model APIs and engineering headcount. Each substitute
      addresses a different slice of the buyer's job-to-be-done: consulting firms provide
      strategy and delivery bandwidth but not a persistent AI platform; automation
      incumbents provide a managed software layer but not deep bespoke workflow
      engineering; the internal option maximizes control but requires scarce AI
      engineering talent the buyer typically lacks. Distyl's positioning targets the
      gap where all three substitutes fall short: production-ready, custom AI systems
      that embed within the client's operations and are accountable to business outcomes.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
    tableRefs:
      - TM001

  - id: market-sizing
    title: TAM, SAM, and Sizing Lenses
    body: >-
      Sizing the market Distyl addresses requires separating agentic AI workflow
      automation from broader enterprise AI software spend. Grand View Research estimates
      the global RPA market—the nearest established proxy for process automation—at
      $4.68 billion in 2025, growing to $35.84 billion by 2033 at a 29% CAGR, with the
      cloud segment and knowledge-based (AI-augmented) operations growing fastest. Mordor
      Intelligence estimates the agentic AI market—the more precise category—at $6.96
      billion in 2025, reaching $57.42 billion by 2031 at a 42.14% CAGR, with North
      America representing 40% of 2025 revenue. MarketsAndMarkets sizes the enterprise
      agentic AI segment at $6.76 billion in 2025 growing to $46.04 billion by 2030 at a
      47% CAGR. All three methodologies produce divergent absolute values because the
      boundary between "AI platform," "AI agents," "RPA," and "AI services" is blurring
      as incumbents reposition their products. For Distyl, the serviceable addressable
      market (SAM) is tighter still: the subset of Fortune 500 programs requiring
      forward-deployed engineering teams plus a persistent AI platform, concentrated in
      healthcare, telecom, financial services, and manufacturing verticals. UiPath's
      $1.901 billion ARR growing at 12% year-over-year provides a public-company
      benchmark for mature workflow automation scale; the far-higher growth rates forecast
      for agentic AI suggest the category is still early. Contradictory estimates and
      scope ambiguity are preserved in the sizing gap section and the diligence paths call
      out what a more precise SOM calculation would require.
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
