  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Distyl SOM and revenue per engagement
      missingEvidence: >-
        Distyl's revenue per engagement, ASP by vertical, mix between services and platform
        licensing revenue, and total contract value pipeline.
      whyItMatters: >-
        Without a revenue-per-engagement figure and vertical win-rate data, the SOM
        calculation rests on market-wide proxies that may significantly overstate or
        understate Distyl's actual addressable market.
      diligencePath: >-
        Request data room: revenue by vertical, average engagement size (services vs.
        platform), win/loss records against named competitors, and pipeline by stage.
      relatedQuestionRefs:
        - QM015
        - QM007

    - type: missing-source
      severity: material
      topic: Enterprise AI pilot failure rate baseline
      missingEvidence: >-
        No authoritative public study quantifies the exact percentage of enterprise AI
        pilots that fail to reach production, the average timeline, or root cause distribution.
      whyItMatters: >-
        The core market demand driver for Distyl's FDE model rests on pilot-to-production
        failure being pervasive. If failure rates are lower than anecdotally suggested,
        the TAM for specialized deployment services is smaller.
      diligencePath: >-
        Search for published IT organization surveys (Gartner, Forrester, IDC) specifically
        measuring AI pilot-to-production conversion rates, then triangulate with Distyl's
        own disclosed track record.
      relatedQuestionRefs:
        - QM022
        - QM016

    - type: stale
      severity: minor
      topic: 2026 real-time enterprise AI spend trajectory
      missingEvidence: >-
        Most analyst forecasts were published in 2025 with 2026 estimates; Q1 2026
        actual enterprise AI budget data is not yet broadly available.
      whyItMatters: >-
        Macro headwinds or spending discipline in 2026 could slow the pilot-to-production
        transition that drives Distyl's near-term growth.
      diligencePath: >-
        Monitor quarterly disclosures from UiPath, ServiceNow, Palantir, and C3.ai for
        2026 bookings growth; review CIO surveys published Q1-Q2 2026.
      relatedQuestionRefs:
        - QM016

    - type: missing-source
      severity: minor
      topic: Distyl's specific market definition per internal strategy
      missingEvidence: >-
        Distyl has not published a market sizing document or TAM definition that would
        clarify how it maps its addressable market internally.
      whyItMatters: >-
        The market boundary used for investor valuation discussions may differ materially
        from the analyst-defined RPA or agentic AI categories.
      diligencePath: >-
        Request board presentation, pitch deck, or investor materials that show Distyl's
        internal TAM/SAM/SOM model and the methodology behind it.
      relatedQuestionRefs:
        - QM027

