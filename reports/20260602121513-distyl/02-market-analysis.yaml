  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >-
      The primary demand driver for Distyl's market is the enterprise AI pilot-to-
      production conversion crisis. Most large enterprises have run AI proofs-of-concept
      but very few have scaled deployments across their operations. PwC's 2026 AI
      predictions confirm that many 2025 agentic AI deployments "didn't deliver much
      value" and that success requires a centralized deployment platform with measurable
      outcomes—exactly the mandate Distyl's vertically integrated model addresses.
      Secondary drivers include: (1) a shortage of enterprise AI engineering talent that
      makes self-build uneconomical for most buyers; (2) an accelerating shift to
      outcome-based contracting, which aligns vendor incentives with customer results and
      gives Distyl a structural pricing advantage over time-and-materials consultancies;
      and (3) regulatory compliance requirements in financial services and healthcare that
      demand documented, auditable AI decisions. Constraints include: the fragmented data
      foundations at most large enterprises, which lengthen Distyl's deployment timelines;
      strong incumbent relationships that large consulting firms and platform vendors have
      with C-suite buyers; the risk that frontier model providers (OpenAI, Anthropic) may
      commoditize the AI capabilities Distyl embeds; and capital intensity of the
      forward-deployed engineering model, which limits revenue growth without
      proportional headcount. Accenture's $3 billion, three-year AI investment signals
      that incumbent consulting pressure will intensify. The North American RPA market
      held more than 39% share in 2025, confirming that Distyl's home geography is the
      largest concentration of its buyer population.
    claimRefs:
      - CM021
      - CM022
