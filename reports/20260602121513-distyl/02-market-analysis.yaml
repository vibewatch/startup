  - id: sizing-gaps
    title: Sizing Gaps, Contradictory Estimates, and Diligence Asks
    body: >-
      Several structural limitations prevent a precise SOM calculation for Distyl from
      public sources. First, no analyst report distinguishes "custom enterprise AI
      deployment services with embedded engineering" from "enterprise AI platform
      licenses"—the two revenue streams Distyl operates. Second, the agentic AI market
      size figures from Grand View Research ($35.84 billion RPA by 2033), Mordor
      Intelligence ($57.42 billion agentic AI by 2031), and MarketsAndMarkets ($46.04
      billion enterprise agentic AI by 2030) use different scope definitions and cannot
      be directly compared. The RPA category undercounts the agentic opportunity because
      it excludes custom AI system design; the "agentic AI" category may overcount by
      including single-purpose chatbots and copilot tools not in Distyl's competitive
      space. Third, Distyl's disclosed revenue model—outcome-linked fees plus platform
      licensing—has no public analog that enables a revenue-per-engagement benchmark.
      A Fortune 500 AI program in telecom may represent $10–50 million in total
      engagement value; the split between services and software is unknown. Fourth, the
      effective enterprise AI adoption rate remains contested: UiPath data suggests
      90% of IT executives intend to use agentic AI, but PwC data indicates only a
      fraction of 2025 agentic deployments generated meaningful value. This gap between
      intent and realized adoption is both a market-sizing problem and a strategic
      opportunity for vendors with a track record of delivering production outcomes.
    claimRefs:
      - CM029
      - CM030
      - CM031
      - CM032

