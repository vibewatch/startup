callouts:
  - calloutType: strength
    title: Pilot-to-Production Gap Creates Structural Demand for Distyl
    body: >-
      PwC and UiPath data both confirm that enterprises have large gaps between AI pilot
      completion and production deployment. Distyl's forward-deployed engineering plus
      outcome-based fee model directly addresses this gap in a way that neither consulting
      firms (who often exit after the pilot) nor software platforms (who hand off to
      internal teams) do. This structural demand driver is not contingent on technology
      innovation—it exists because of how enterprises buy and implement complex AI systems.
    claimRefs:
      - CM019
      - CM020
      - CM021

  - calloutType: risk
    title: Market Sizing Estimates Are Inconsistent and Scope-Dependent
    body: >-
      The four analyst estimates reviewed for this chapter—Grand View Research, Mordor
      Intelligence (two tiers), and MarketsAndMarkets—produce forecast values ranging from
      $35.84 billion to $93.20 billion by 2031–2033 for overlapping but distinct categories.
      The divergence is material for valuation purposes: an investor using the largest
      estimate would size Distyl's addressable market more than twice as large as one using
      the RPA-only proxy. Diligence should demand that any valuation argument specify the
      market boundary and explain why Distyl's offering maps to that boundary.
    claimRefs:
      - CM029
      - CM030
      - CM031

  - calloutType: risk
    title: Incumbent AI Investment Intensifying — Accenture Commits $3 Billion
    body: >-
      Accenture's public commitment of $3 billion over three years specifically for AI
      data and practice expansion signals that the largest consulting competitors are
      aggressively building the very capabilities Distyl differentiates on. With 738,000
      employees and more than 1,450 AI-related patents, Accenture can staff forward-
      deployed programs at a scale Distyl cannot match. The risk is not immediate
      displacement—Distyl's AI-native model and outcome-based pricing are structurally
      different—but Accenture's investment will increase the quality of enterprise buyer
      alternatives over the 2026–2028 window.
    claimRefs:
      - CM025
      - CM026
      - CM027

  - calloutType: insight
    title: Enterprise AI Is in a Decisive Transition From Pilot to Production in 2026
    body: >-
      Multiple independent sources—PwC's 2026 AI predictions, Mordor's 61% CEO adoption
      figure, and UiPath's 90% IT-executive intent data—converge on the view that 2026 is
      the inflection year when large enterprises must move AI from pilot to production or
      lose competitive ground. Vendors who can reliably close the pilot-to-production gap
      at Fortune 500 scale are disproportionately advantaged in this environment, which
      explains Distyl's premium valuation and the urgency of its outcome-based commercial
      model.
