  - id: TM004
    title: Growth Drivers and Adoption Constraints — Enterprise Agentic AI
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for Distyl
      - Diligence Ask
    rows:
      - - AI pilot-to-production conversion gap
        - Driver (demand)
        - Now–2026
        - Creates urgent demand for deployment-specialist vendors with a production track record
        - Verify Distyl's pilot-to-production conversion rate, time-to-production KPIs
      - - Enterprise AI engineering talent shortage
        - Driver (demand)
        - 2025–2028
        - Elevates willingness-to-pay for Distyl's forward-deployed engineering model
        - Review headcount plan, compensation bands, and FDE team attrition data
      - - Outcome-based contracting trend
        - Driver (pricing power)
        - 2025–2027
        - Distyl's outcome-linked fee model aligns with buyer risk preference
        - "Confirm contract structure: what pct of fee is outcome-linked vs. fixed; dispute history"
      - - Regulatory AI governance requirements (BFSI, healthcare)
        - Driver (compliance)
        - 2026+
        - Enterprises in regulated industries need auditable, governed AI; increases switching cost
        - Assess Distyl's audit trail, RBAC, model-risk documentation for regulated clients
      - - Accelerating AI investment by incumbents (Accenture $3B, Deloitte, etc.)
        - Constraint (competition)
        - Ongoing
        - Large consulting firms deepening AI practices at Fortune 500 relationships
        - Request win/loss data vs. Accenture, Deloitte in competitive procurement
      - - Fragmented and low-quality enterprise data foundations
        - Constraint (deployment)
        - Ongoing
        - Data preparation extends timelines and raises program cost; limits POC velocity
        - Review per-engagement data engineering hours and their impact on delivery timeline
      - - LLM model commoditization by foundation providers
        - Constraint (IP moat)
        - 2026–2028
        - If model capabilities commoditize, Distyl's workflow engineering IP faces margin pressure
        - Evaluate proprietary datasets, evaluation infrastructure, and trade-secret moat
      - - Switching cost from legacy workflow platforms (UiPath, ServiceNow)
        - Constraint (for Distyl) / Driver (for incumbents)
        - Medium-term
        - Enterprises with deep UiPath or ServiceNow deployments face high switching cost
        - Map Distyl win rates in accounts with existing automation platform footprint
      - - Trust and explainability concerns
        - Constraint (adoption speed)
        - Ongoing
        - Regulated buyers require explainable AI decisions; can delay production sign-off
        - Request Distyl's explainability features, SHAP/audit reports, and customer references
      - - Capital intensity of FDE model
        - Constraint (scaling)
        - Ongoing
        - Revenue growth constrained by engineering headcount without platform-led scale
        - Obtain gross margin by revenue type (services vs. platform) to assess leverage
    notes: >-
      Direction and timing assessments are qualitative judgments based on public analyst
      commentary (GVR, Mordor, PwC) and Distyl's publicly described business model.
      "Implication" rows represent inferred impact on Distyl, not confirmed by Distyl.
