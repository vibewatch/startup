  website: https://distyl.ai
  sector: Enterprise AI / Agentic Automation
  stage: Series B
  headquarters: San Francisco, CA
  shortDescription: >-
    Forward-deployed enterprise AI company delivering production AI agents and
    data infrastructure to Fortune 500 companies via an outcome-based FDE model.

chapter:
  number: 3
  letter: P
  title: Competitors
  summary: >-
    Distyl AI competes across four categories: direct AI deployment peers (Palantir AIP,
    C3.ai), incumbent enterprise automation platforms (UiPath, ServiceNow, Pega), adjacent
    substitutes (Glean, Workato, n8n, Retool, Relevance AI), and consulting firm substitutes
    (Accenture, Deloitte). Palantir is the closest analog but commands a premium price that
    leaves room for Distyl; ServiceNow's Yokohama agentic release and Accenture's FDE
    replication are the highest-severity displacement risks. Distyl's regulatory compliance
    posture (no public FedRAMP or HIPAA disclosure) is an undisclosed diligence gap in its
    own target verticals.
  mission: >-
    Identify direct, incumbent, adjacent, substitute, and status-quo alternatives to
    Distyl AI and assess differentiation durability, switching cost, and commoditization risk.

sections:
  - id: landscape-overview
    title: "Competitive Landscape: Taxonomy and Strategic Context"
    body: >-
      Distyl AI competes across four distinct competitor categories that differ in how
      enterprise buyers can address the same job-to-be-done: deploying production-grade
      AI agents that measurably improve Fortune 500 business outcomes. The first category
      is direct AI deployment peers, primarily Palantir AIP and C3.ai, which offer
      comparable forward-deployed or AI-native enterprise capabilities and compete for
      the same greenfield AI transformation budget. The second category is incumbent
      enterprise automation platforms — UiPath, ServiceNow, and Pega — that are
      expanding into agentic AI from entrenched workflow automation and BPM positions.
      These incumbents hold existing licenses, integrations, and executive relationships
      within the same Fortune 500 buyer pool. The third category is adjacent platforms
      and substitutes including Glean (enterprise AI search and agents), Workato (iPaaS
      and process automation), Retool (internal tools with AI), n8n (open-source workflow
      automation), and Relevance AI (multi-agent orchestration). The fourth category is
      large professional services firms including Accenture and Deloitte, which offer AI
      transformation programs using their own consulting bench and partner ecosystems,
      competing directly on the managed-delivery dimension of Distyl's FDE model. The
      status quo — not deploying AI agents, or continuing with manual processes and
      point-tool integrations — remains the most common alternative in under-resourced
      enterprise divisions. Distyl's primary positioning is to win where buyers require
      production delivery speed, outcome accountability, and embedded engineering depth
      that off-the-shelf platforms cannot provide without custom integration and that large
      consulting firms cannot deliver at Distyl's claimed speed and cost efficiency.
    claimRefs:
      - CP020
      - CP021
    tableRefs:
      - TP001
    figureRefs:
      - FP001

  - id: direct-peers
    title: "Direct AI Deployment Peers: Palantir AIP and C3.ai"
    body: >-
      Palantir AIP is Distyl's most directly comparable competitor. Palantir's forward-
      deployed engineering culture, long-running DOD and intelligence community customer
      relationships, and AIP platform for LLM orchestration over structured enterprise
      data mirror Distyl's own FDE model at far greater scale. Palantir reported Q4 FY2025
      revenue of $828 million representing 36% year-over-year growth, with US commercial
      revenue up 54% and US commercial customer count reaching 382 enterprises as of
      December 31, 2025. Palantir's AIP Boot Camps — intensive multi-day deployment
      sprints with forward-deployed engineers — are functionally analogous to Distyl's
      FDE motion. Palantir's primary limitation from a competitive standpoint is pricing:
      its contracts frequently run $1M or more per year per enterprise, making it
      inaccessible to mid-market buyers and creating a high-price segment Distyl can
      undercut. C3.ai represents a different risk profile: a publicly traded enterprise AI
      platform that has built vertical-specific AI applications for energy, manufacturing,
      financial services, and defense. C3.ai reported Q3 FY2026 revenue of $103.6 million
      representing 26% year-over-year growth with 560 or more enterprise deployments and
      pivoted from subscription to consumption-based pricing in 2023 to reduce enterprise
      procurement friction. C3.ai applications target specific workflows (predictive
      maintenance, demand forecasting, fraud detection) rather than Distyl's generalist
      enterprise AI agent approach. C3.ai is a direct peer for regulated-vertical deals
      (energy, defense) but weaker in telecom and healthcare where Distyl has disclosed
      production deployments.
