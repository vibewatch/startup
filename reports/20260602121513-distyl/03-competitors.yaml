  - id: incumbent-platforms
    title: "Incumbent Enterprise Automation Platforms: UiPath, ServiceNow, and Pega"
    body: >-
      UiPath, ServiceNow, and Pega represent the incumbent displacement risk: large,
      well-capitalized automation and workflow platforms that are aggressively adding
      agentic AI capabilities atop existing customer relationships. UiPath holds the
      largest installed base in enterprise RPA with ARR of $1.901 billion as of April
      2026, net retention of 109%, and 2,624 customers spending over $100K annually.
      UiPath launched its Autopilot agentic AI product in FY2025 and positions AI agents
      as an extension of its existing automation workflows. The risk to Distyl is that
      UiPath cross-sells AI agent capabilities to its existing RPA customers, foreclosing
      greenfield AI opportunities in verticals where UiPath already has production
      integrations. ServiceNow reported FY2025 total revenue of $12.15 billion and
      embedded agentic AI agents natively into its Now Platform through the Yokohama
      release in early 2026. Because ServiceNow is already the system of record for IT
      service management in most Fortune 500 companies, its AI agents can be deployed
      without a new vendor procurement cycle, creating a bypass threat for Distyl in IT
      operations and employee service workflows. Pega Systems holds a Gartner Magic
      Quadrant Leader position in the Business Process Orchestration and Automation
      Technologies category and has embedded AI agents through its Blueprint feature in
      the Pega Infinity platform. Pega reported Q1 2026 revenue of approximately $401M
      growing at 12% year-over-year. Pega competes with Distyl most directly in regulated-
      vertical AI deployments (BFSI, healthcare, insurance) where its existing case
      management integration is a structural advantage.
    claimRefs:
      - CP002
      - CP004
      - CP023
      - CP027
      - CP037
    tableRefs:
      - TP003

  - id: adjacent-substitutes
    title: "Adjacent Platforms and Substitutes: Glean, Workato, n8n, Retool, and Consulting Firms"
    body: >-
      The adjacent and substitute category covers platforms that partially address the
      AI deployment job-to-be-done from the search, integration, or developer tools angle.
      Glean raised a $260M Series F at a $4.6B valuation in February 2025, positioning
      itself as the enterprise AI platform for search, knowledge management, and AI
      assistant workflows. Glean competes with Distyl in the enterprise knowledge-worker
      AI segment but not in the operational and process-execution AI agent segment where
      Distyl focuses. Glean's Gartner Peer Insights rating of 4.5/5 and G2 rating of 4.8
      reflect strong user satisfaction among knowledge-worker deployments. Workato is the
      dominant iPaaS and process automation platform, holding the Gartner Magic Quadrant
      Leader position eight consecutive years and positioned furthest in vision three
      times. Workato competes with Distyl when enterprise buyers frame their AI requirement
      as an integration and automation problem rather than an AI deployment problem. n8n
      offers a zero-cost self-hosted community edition that positions it as a status-quo
      substitute for mid-market engineering teams that can self-serve workflow automation
      without a vendor contract. Retool publishes a starter price of $10 per builder per
      month and pro at $50 per builder per month, competing in the internal-tools segment.
      Relevance AI provides a multi-agent orchestration platform with an L1 through L4
      autonomy framework and enterprise custom pricing. Accenture's $3B AI investment and
      738,000-person delivery capacity directly compete with Distyl's FDE model for
      Fortune 500 AI transformation engagements. PwC's 2026 AI Predictions report confirms
      that large consulting firms are positioning forward-deployed centralized AI deployment
      as a critical success factor, indicating the consulting category is actively building
      the same capability Distyl pioneered.
