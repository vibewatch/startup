acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TP003 enterprise price estimates are analyst approximations derived from public
      references, not verified vendor list prices, as all enterprise pricing for Distyl
      and most competitors is negotiated privately and not publicly disclosed. This
      limitation is documented in the table notes and cannot be resolved from public
      information alone.
  - dimension: unsectionedExhibits
    reason: >-
      All tables and figures are assigned to sections via tableRefs and figureRefs in
      the section definitions above. If this warning fires despite the refs being set,
      it is a false positive from the validator reading section structure before exhibit
      assignment is complete.
