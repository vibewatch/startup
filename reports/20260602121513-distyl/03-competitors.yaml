  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: win-loss competitive data
      missingEvidence: >-
        Distyl win/loss data against Palantir AIP, C3.ai, ServiceNow, and Accenture in
        competitive RFP situations; win rate by competitor category; deal size in won
        vs. lost opportunities.
      whyItMatters: >-
        The competitive positioning map and capability matrix rely on product-level
        evidence, not transactional win/loss data. Competitive advantage claims cannot
        be validated without Distyl's own win/loss reporting.
      diligencePath: >-
        Request Distyl's competitive win/loss report by vendor category, average deal
        size in won vs. lost deals, and top three reasons cited by buyers for choosing
        or not choosing Distyl.
      relatedQuestionRefs:
        - QP009
        - QP018
        - QP023

    - type: missing-source
      severity: material
      topic: compliance posture
      missingEvidence: >-
        Distyl's FedRAMP authorization status, HIPAA BAA offering, SOC 2 Type II report,
        and ISO 27001 certification status as of June 2026.
      whyItMatters: >-
        Compliance posture in regulated verticals (BFSI, healthcare, insurance, government)
        cannot be assessed without published certifications; this is a material gap given
        Distyl's disclosed customer verticals include regulated industries.
      diligencePath: >-
        Obtain Distyl's current compliance certifications, in-progress certifications,
        planned certification timeline, and past customer compliance waivers or exceptions.
      relatedQuestionRefs:
        - QP020
        - QP021

    - type: private-evidence-only
      severity: material
      topic: switching cost
      missingEvidence: >-
        Distyl customer contract terms covering data ownership post-contract, vendor
        exclusivity provisions, customer renewal rate, and post-contract data portability
        terms for the Distillery platform.
      whyItMatters: >-
        The moat durability assessment on switching cost is based on theoretical analysis
        of data infrastructure dependency, not confirmed contractual evidence.
      diligencePath: >-
        Review a sample of Distyl customer contracts for data ownership terms, vendor
        exclusivity provisions, renewal rate, and Distillery platform portability terms.
      relatedQuestionRefs:
        - QP019
        - QP027

