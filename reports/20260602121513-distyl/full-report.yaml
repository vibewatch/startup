            title: Palantir Is the Primary Benchmark and the Primary Peer Threat
            body: >-
              Palantir AIP is not merely a competitor; it is the closest public-market comparable for Distyl's
              forward-deployed enterprise AI model. Palantir's Q4 FY2025 US commercial revenue growth of 54%
              year-over-year and 382 US enterprise customers demonstrate that demand for the FDE model at scale is real
              and growing rapidly. Palantir's market cap multiple also establishes an upper-bound valuation reference
              for the enterprise AI deployment category. Distyl's $1.8B Series B valuation implies a significant growth
              premium relative to Palantir's revenue base — one that requires sustained production wins in verticals
              Palantir does not dominate (telecom, healthcare) and at price points below Palantir's typical $1M+ annual
              contract threshold.
            calloutType: insight
            claimRefs:
              - CP001
              - CP026
          - type: callout
            title: ServiceNow Yokohama Is an Underappreciated Displacement Risk
            body: >-
              ServiceNow's Yokohama platform release in early 2026 embedded agentic AI agents natively into its ITSM
              workflow engine. Because ServiceNow is already the system of record for enterprise IT approvals, change
              management, and service fulfillment in most Fortune 500 companies, its AI agents can be deployed without a
              new vendor procurement cycle. This creates a bypass threat: IT and operations buyers may extend
              ServiceNow's footprint into AI deployment rather than initiating a new Distyl engagement. The severity is
              highest in IT operations and employee service workflows — precisely the workflows where Distyl competes
              for initial enterprise land.
            calloutType: risk
            claimRefs:
              - CP004
              - CP027
          - type: callout
            title: Regulatory Compliance Posture Is an Undisclosed Diligence Gap
            body: >-
              Palantir AIP, C3.ai, UiPath, ServiceNow, and Pega all publish FedRAMP or HIPAA BAA compliance status.
              Distyl has not publicly disclosed equivalent certifications as of June 2026. In regulated verticals (BFSI,
              healthcare, insurance, government) that represent a significant portion of Distyl's disclosed customer
              base, absent compliance certification is a material procurement barrier. The diligence team should confirm
              Distyl's current compliance status, planned certification timeline, and how the company has navigated
              regulated-vertical deals without published FedRAMP or HIPAA authorization.
            calloutType: risk
            claimRefs:
              - CP028
              - CP029
          - type: callout
            title: Consulting Firm Replication of FDE Is Confirmed and Ongoing
            body: >-
              The risk that large consulting firms replicate Distyl's FDE model is not speculative. Accenture's $3B AI
              investment and 738,000-person delivery bench, combined with PwC's 2026 positioning of centralized AI
              deployment as a critical success factor, indicate the consulting category is actively building the
              forward-deployment capability that Distyl pioneered. Distyl's defensibility rests on speed, talent
              density, and outcome accountability — not on a unique method that cannot be learned. Diligence teams
              should request head-to-head win/loss data in deals where Accenture or Deloitte was a competing
              alternative.
