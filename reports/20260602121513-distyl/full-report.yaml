      - number: '5.2'
        title: Architecture and Critical Dependencies
        blocks:
          - type: paragraph
            body: >-
              The public architecture implied by Distyl's materials is a layered system that sits above foundation
              models instead of replacing them. Enterprise knowledge bases, workflow logs, and policy documents feed
              Context Mesh, which Distyl presents as a dynamic context-assembly approach akin to a
              retrieval-and-grounding layer. Distillery then orchestrates long-running workflows, memory, evaluation,
