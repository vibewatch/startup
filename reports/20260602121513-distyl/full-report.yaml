      - number: '7.5'
        title: Market and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Distyl operates in a market where buyer enthusiasm is high but durability is still unproven. The company
              has strong positioning with blue-chip enterprises and can point to a large user-reach claim, yet it
              competes against scaled incumbents such as ServiceNow, Palantir, UiPath, Pegasystems, and C3.ai that
              already publish revenue, market-cap, or ARR figures far beyond Distyl's public disclosure level. That
              scale gap matters in two ways. First, larger vendors can bundle AI into existing workflow or data-platform
              contracts, making Distyl's standalone economics harder to defend. Second, adverse market commentary is
              increasingly warning that AI-native revenue may prove less durable than classic SaaS if much of the spend
              is transformation-project or pilot-like rather than subscription-retentive. Distyl's case studies help on
              proof of value, but they do not resolve renewal, expansion, or concentration. Because no public revenue,
              margin, or retention data is available, valuation and competitive risk collapse into the same question:
              can Distyl turn visible customer outcomes into recurring, defendable software economics before incumbents
              close the functionality gap?
