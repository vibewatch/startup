      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The primary demand driver for Distyl's market is the enterprise AI pilot-to- production conversion crisis.
              Most large enterprises have run AI proofs-of-concept but very few have scaled deployments across their
              operations. PwC's 2026 AI predictions confirm that many 2025 agentic AI deployments "didn't deliver much
              value" and that success requires a centralized deployment platform with measurable outcomes—exactly the
              mandate Distyl's vertically integrated model addresses. Secondary drivers include: (1) a shortage of
              enterprise AI engineering talent that makes self-build uneconomical for most buyers; (2) an accelerating
              shift to outcome-based contracting, which aligns vendor incentives with customer results and gives Distyl
              a structural pricing advantage over time-and-materials consultancies; and (3) regulatory compliance
              requirements in financial services and healthcare that demand documented, auditable AI decisions.
              Constraints include: the fragmented data foundations at most large enterprises, which lengthen Distyl's
              deployment timelines; strong incumbent relationships that large consulting firms and platform vendors have
              with C-suite buyers; the risk that frontier model providers (OpenAI, Anthropic) may commoditize the AI
              capabilities Distyl embeds; and capital intensity of the forward-deployed engineering model, which limits
              revenue growth without proportional headcount. Accenture's $3 billion, three-year AI investment signals
              that incumbent consulting pressure will intensify. The North American RPA market held more than 39% share
              in 2025, confirming that Distyl's home geography is the largest concentration of its buyer population.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
          - type: table
            tableRef: TM004
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
      - number: '2.5'
        title: Sizing Gaps, Contradictory Estimates, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Several structural limitations prevent a precise SOM calculation for Distyl from public sources. First, no
              analyst report distinguishes "custom enterprise AI deployment services with embedded engineering" from
              "enterprise AI platform licenses"—the two revenue streams Distyl operates. Second, the agentic AI market
              size figures from Grand View Research ($35.84 billion RPA by 2033), Mordor Intelligence ($57.42 billion
              agentic AI by 2031), and MarketsAndMarkets ($46.04 billion enterprise agentic AI by 2030) use different
              scope definitions and cannot be directly compared. The RPA category undercounts the agentic opportunity
              because it excludes custom AI system design; the "agentic AI" category may overcount by including
              single-purpose chatbots and copilot tools not in Distyl's competitive space. Third, Distyl's disclosed
              revenue model—outcome-linked fees plus platform licensing—has no public analog that enables a
              revenue-per-engagement benchmark. A Fortune 500 AI program in telecom may represent $10–50 million in
              total engagement value; the split between services and software is unknown. Fourth, the effective
              enterprise AI adoption rate remains contested: UiPath data suggests 90% of IT executives intend to use
              agentic AI, but PwC data indicates only a fraction of 2025 agentic deployments generated meaningful value.
              This gap between intent and realized adoption is both a market-sizing problem and a strategic opportunity
              for vendors with a track record of delivering production outcomes.
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM032
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Pilot-to-Production Gap Creates Structural Demand for Distyl
            body: >-
              PwC and UiPath data both confirm that enterprises have large gaps between AI pilot completion and
              production deployment. Distyl's forward-deployed engineering plus outcome-based fee model directly
              addresses this gap in a way that neither consulting firms (who often exit after the pilot) nor software
              platforms (who hand off to internal teams) do. This structural demand driver is not contingent on
              technology innovation—it exists because of how enterprises buy and implement complex AI systems.
            calloutType: strength
            claimRefs:
              - CM019
              - CM020
              - CM021
          - type: callout
            title: Market Sizing Estimates Are Inconsistent and Scope-Dependent
            body: >-
              The four analyst estimates reviewed for this chapter—Grand View Research, Mordor Intelligence (two tiers),
              and MarketsAndMarkets—produce forecast values ranging from $35.84 billion to $93.20 billion by 2031–2033
              for overlapping but distinct categories. The divergence is material for valuation purposes: an investor
              using the largest estimate would size Distyl's addressable market more than twice as large as one using
              the RPA-only proxy. Diligence should demand that any valuation argument specify the market boundary and
              explain why Distyl's offering maps to that boundary.
            calloutType: risk
            claimRefs:
              - CM029
              - CM030
              - CM031
          - type: callout
            title: Incumbent AI Investment Intensifying — Accenture Commits $3 Billion
            body: >-
              Accenture's public commitment of $3 billion over three years specifically for AI data and practice
              expansion signals that the largest consulting competitors are aggressively building the very capabilities
              Distyl differentiates on. With 738,000 employees and more than 1,450 AI-related patents, Accenture can
              staff forward- deployed programs at a scale Distyl cannot match. The risk is not immediate
              displacement—Distyl's AI-native model and outcome-based pricing are structurally different—but Accenture's
              investment will increase the quality of enterprise buyer alternatives over the 2026–2028 window.
            calloutType: risk
            claimRefs:
              - CM025
              - CM026
              - CM027
          - type: callout
            title: Enterprise AI Is in a Decisive Transition From Pilot to Production in 2026
            body: >-
              Multiple independent sources—PwC's 2026 AI predictions, Mordor's 61% CEO adoption figure, and UiPath's 90%
              IT-executive intent data—converge on the view that 2026 is the inflection year when large enterprises must
              move AI from pilot to production or lose competitive ground. Vendors who can reliably close the
              pilot-to-production gap at Fortune 500 scale are disproportionately advantaged in this environment, which
              explains Distyl's premium valuation and the urgency of its outcome-based commercial model.
            calloutType: insight
            claimRefs:
              - CM019
              - CM020
              - CM022
              - CM028
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Taxonomy and Strategic Context'
        blocks:
          - type: paragraph
            body: >-
              Distyl AI competes across four distinct competitor categories that differ in how enterprise buyers can
              address the same job-to-be-done: deploying production-grade AI agents that measurably improve Fortune 500
              business outcomes. The first category is direct AI deployment peers, primarily Palantir AIP and C3.ai,
              which offer comparable forward-deployed or AI-native enterprise capabilities and compete for the same
              greenfield AI transformation budget. The second category is incumbent enterprise automation platforms —
              UiPath, ServiceNow, and Pega — that are expanding into agentic AI from entrenched workflow automation and
              BPM positions. These incumbents hold existing licenses, integrations, and executive relationships within
              the same Fortune 500 buyer pool. The third category is adjacent platforms and substitutes including Glean
              (enterprise AI search and agents), Workato (iPaaS and process automation), Retool (internal tools with
              AI), n8n (open-source workflow automation), and Relevance AI (multi-agent orchestration). The fourth
              category is large professional services firms including Accenture and Deloitte, which offer AI
              transformation programs using their own consulting bench and partner ecosystems, competing directly on the
              managed-delivery dimension of Distyl's FDE model. The status quo — not deploying AI agents, or continuing
              with manual processes and point-tool integrations — remains the most common alternative in under-resourced
              enterprise divisions. Distyl's primary positioning is to win where buyers require production delivery
              speed, outcome accountability, and embedded engineering depth that off-the-shelf platforms cannot provide
              without custom integration and that large consulting firms cannot deliver at Distyl's claimed speed and
              cost efficiency.
