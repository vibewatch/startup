      - number: '7.6'
        title: Mitigation Framework and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The mitigating case for Distyl is real but conditional. Capital is not the constraint in the near term:
              the Series B gives management resources to harden controls, deepen partnerships, and professionalize legal
              and compliance operations. The company also benefits from strong production-oriented messaging, marquee
              partners, and enterprise outcome case studies. Those positives, however, only matter if investors convert
              them into monitorable requirements. The cleanest mitigation plan is therefore not broad optimism; it is a
              short list of non-negotiable diligence asks and thesis-break triggers. Before underwriting the company,
              investors should require evidence of security assurance, healthcare-compliance posture where relevant,
              partner-contract durability, customer-retention visibility, leadership-bench depth, and basic insurance
              coverage. Stop conditions should be triggered by any material failure in those domains: no external
              control evidence, a major partner-policy change, leadership concentration that cannot be mitigated,
              evidence that customer work is non-recurring or highly concentrated, or any regulatory finding tied to
              privacy or healthcare handling. Distyl is investable only if the data room turns today's public evidence
              gaps into verifiable controls rather than persistent unknowns.
