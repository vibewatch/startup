              deployed without a new vendor procurement cycle, creating a bypass threat for Distyl in IT operations and
              employee service workflows. Pega Systems holds a Gartner Magic Quadrant Leader position in the Business
              Process Orchestration and Automation Technologies category and has embedded AI agents through its
              Blueprint feature in the Pega Infinity platform. Pega reported Q1 2026 revenue of approximately $401M
              growing at 12% year-over-year. Pega competes with Distyl most directly in regulated- vertical AI
              deployments (BFSI, healthcare, insurance) where its existing case management integration is a structural
