              it buggy," with T-Mobile facing criticism for mandating app use for tasks previously handled in stores.
              The app has been downloaded over 75 million times but user-experience friction is documented. This
              represents a reputational risk to Distyl's production-record and zero-failure claims. No lawsuits,
              regulatory actions, CFPB/FOS complaints, or material leadership changes were found in a CourtListener
