chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Distyl AI, Inc. (legal name confirmed in website Terms of Use and Privacy Policy) was incorporated in 2022
              and is headquartered in San Francisco, California, with additional offices in New York and London. The
              company operates at the intersection of enterprise AI software and professional services, deploying
              AI-native systems for large, operationally complex organizations. Its core product is the Distillery
              platform, which combines a proprietary Context Mesh architecture—a structured, traversable graph of an
              organization's institutional knowledge—with AI agent orchestration, evaluation, and governance controls.
              Distillery enables persistent, long-running agents that accumulate memory and context across enterprise
              workflows rather than resetting on each interaction.

              Distyl's business model is vertically integrated, combining engineering services, platform licensing, and
              applied AI research into a single client engagement. The company uses a forward-deployed engineering (FDE)
              model inspired by Palantir's approach, in which Distyl engineers are embedded on-site with clients and
              co-own outcomes. Revenue comes from two mechanisms: outcome-based project fees (a portion of which is
              contingent on achieving client objectives) and platform licensing fees for ongoing AI system operation and
              maintenance. This contrasts with traditional time-and-materials consulting and with pure-SaaS software
              models. The CEO has characterized the company as "backed by profitability" in its Series B announcement,
              though no audited financials have been disclosed. Sector focus includes telecommunications, healthcare,
              insurance, manufacturing, financial services, and consumer packaged goods.
