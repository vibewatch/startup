companyProfile:
  summary: >-
    Distyl is a 2022-founded private enterprise AI company headquartered in San Francisco. It combines a proprietary
    workflow platform, Distillery, with a forward-deployed engineer model to embed inside complex enterprise operations
    and ship AI-native systems in weeks or months rather than prolonged pilot cycles. Public references show deployments
    across telecom, healthcare, insurance, manufacturing, and financial services, supported by OpenAI, Google Cloud, and
    NVIDIA relationships and by a strong investor syndicate including Lightspeed, Khosla, DST, Coatue, and Dell
    Technologies Capital. The business has clear customer-proof and partner credibility, but it remains disclosure-light
    on revenue, gross margin, retention, concentration, and cap-table terms.
