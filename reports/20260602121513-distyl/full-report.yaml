      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Distyl AI has raised approximately $202 million across three equity rounds as of June 2026. The seed round
              of $7 million was announced in April 2023 alongside a strategic services alliance with OpenAI, with
              participation from Coatue and Dell Technologies Capital. The Series A round of $20 million was announced
              November 19, 2024, led by Lightspeed Venture Partners with Khosla Ventures joining; existing investors
              Coatue and Dell Technologies Capital and angel Nat Friedman also participated. Nasdaq Private Market data
              indicates the Series A closed on or around January 7, 2025.

              The Series B round of $175 million was announced September 23, 2025, at a post-money valuation of $1.8
              billion, making Distyl a private unicorn. Participating investors include Lightspeed Venture Partners,
              Khosla Ventures, DST Global, Coatue Management, and Dell Technologies Capital. CB Insights includes Distyl
              on its unicorn tracker. Nasdaq Private Market and Forge Global list Distyl stock for secondary trading but
              do not publicly disclose price per share or detailed cap table. The company has filed no Form D or other
              securities disclosure with the SEC that is publicly discoverable via EDGAR search. No public information
              exists on liquidation preferences, participation rights, anti-dilution provisions, or fully diluted share
              count—all material for valuation underwriting.
