      - number: '7.2'
        title: Technology and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Distyl's go-to-market story is strengthened by marquee partnerships, but those same partnerships define
              the company's core technology dependency profile. Distyl publicly positions itself alongside Google Cloud
              Gemini Enterprise, NVIDIA AI Enterprise, and the broader OpenAI, Azure, and Anthropic ecosystem described
              by Channel Dive. That is strategically sensible for a fast-moving enterprise agent vendor, yet it means
              critical layers of model quality, inference cost, infrastructure availability, and policy permissibility
              are controlled by third parties. The risk is not merely that a partner terminates a relationship. More
              realistically, pricing, roadmap shifts, region-specific restrictions, or safety-policy changes can raise
              cost, slow deployments, or constrain regulated use cases exactly where Distyl claims the strongest
              traction. Partnership announcements also create execution expectations with customers: if Distyl is
              marketed as a priority Google Cloud partner and an NVIDIA-enabled platform, enterprise buyers may
              underwrite that ecosystem durability into procurement decisions. That raises residual exposure if those
              programs change or if Distyl cannot keep pace with partner certification and product-cycle requirements.
