      - number: '8.5'
        title: Comparable Set
        blocks:
          - type: paragraph
            body: >-
              The selected comparable set is intentionally practical rather than perfect. ServiceNow, UiPath, and
              Pegasystems anchor the workflow and enterprise-automation end of the market. C3 AI anchors a public
              pure-play enterprise AI software benchmark. Palantir captures the upper bound of what a public AI
              narrative can command when scale, data moats, and investor enthusiasm are all working together. None is
              identical to Distyl, but together they bound the public multiple range that matters for price discipline.
              ServiceNow sits near 10x revenue, UiPath around 4.2x, C3 AI around 5.7x, and Pegasystems around 3.5x.
              Palantir is the exceptional outlier at roughly 70.6x. That outlier is useful precisely because it
              demonstrates the challenge for Distyl: even the strongest public AI premium attaches to a company with
              billions of dollars of disclosed revenue, not to a business with undisclosed economics. Distyl may
              ultimately deserve a premium, but the public packet cannot prove which premium is rational.
            claimRefs:
              - CV011
