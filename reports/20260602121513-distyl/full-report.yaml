      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Distyl AI was co-founded by Arjun Prakash (CEO) and Derek Ho (COO), both of whom previously held business
              development roles at Palantir Technologies, a publicly traded enterprise data analytics company. Their
              Palantir experience shaped Distyl's forward-deployed engineering model and its focus on deploying AI
              systems in complex, regulated enterprise environments where reliability is paramount. Vijay Candade serves
              as Head of Business Strategy, and was publicly credited in the April 2026 Google Cloud partnership
              announcement.

              The company has not disclosed its board composition, investor board seats, or formal governance structure
              in public filings or website disclosures. Given Lightspeed's position as lead investor on both the Series
              A and Series B, a board seat for Lightspeed (Raviraj Jain led the deal per Series A announcement) is
              plausible but unconfirmed. Key-person concentration on the two co-founders represents a diligence risk: no
              public information exists on succession planning, vesting status, or equity ownership distribution. The
              company's legal entity uses mandatory binding arbitration and class-action waiver clauses in its public
              Terms of Use, which limits some forms of public litigation disclosure that might surface leadership
              disputes. No LinkedIn headcount data was available at the time of writing from direct sources;
              prior-research signals indicated a 51-200 company size designation, and the Ashby job board shows active
              hiring across engineering, GTM, solutions, and research functions in San Francisco, New York, and London.
