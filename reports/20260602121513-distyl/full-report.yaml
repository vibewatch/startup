      - number: '2.2'
        title: TAM, SAM, and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the market Distyl addresses requires separating agentic AI workflow automation from broader
              enterprise AI software spend. Grand View Research estimates the global RPA market—the nearest established
              proxy for process automation—at $4.68 billion in 2025, growing to $35.84 billion by 2033 at a 29% CAGR,
              with the cloud segment and knowledge-based (AI-augmented) operations growing fastest. Mordor Intelligence
              estimates the agentic AI market—the more precise category—at $6.96 billion in 2025, reaching $57.42
              billion by 2031 at a 42.14% CAGR, with North America representing 40% of 2025 revenue. MarketsAndMarkets
              sizes the enterprise agentic AI segment at $6.76 billion in 2025 growing to $46.04 billion by 2030 at a
              47% CAGR. All three methodologies produce divergent absolute values because the boundary between "AI
              platform," "AI agents," "RPA," and "AI services" is blurring as incumbents reposition their products. For
              Distyl, the serviceable addressable market (SAM) is tighter still: the subset of Fortune 500 programs
              requiring forward-deployed engineering teams plus a persistent AI platform, concentrated in healthcare,
              telecom, financial services, and manufacturing verticals. UiPath's $1.901 billion ARR growing at 12%
              year-over-year provides a public-company benchmark for mature workflow automation scale; the far-higher
              growth rates forecast for agentic AI suggest the category is still early. Contradictory estimates and
              scope ambiguity are preserved in the sizing gap section and the diligence paths call out what a more
              precise SOM calculation would require.
            claimRefs:
              - CM007
