      - number: '7.3'
        title: Operational, Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is unusually important for Distyl because the company does not sell lightweight
              experimentation; it advertises production AI systems, measurable customer outcomes, and deep insertion
              into enterprise processes. That positioning increases the downside of model failure modes identified in
              the OWASP guidance, especially prompt injection, insecure tool use, data leakage, and brittle long-running
              agent behavior. Distyl's public materials do not disclose a SOC 2 report, security audit summary, cyber
              insurance, or a public incident history, so investors cannot independently score the maturity of logging,
              red-team coverage, tenant isolation, or breach response. Privacy disclosures confirm that personal data is
              collected, and healthcare case studies raise the possibility of PHI-adjacent workflows, which means the
              impact of an outage or policy violation would extend beyond normal uptime concerns into contractual,
              regulatory, and reputational channels. The company's claimed production record and end-user scale
              therefore cut both ways: they support relevance, but they also magnify the consequences of a control
              failure before external assurance evidence is available.
