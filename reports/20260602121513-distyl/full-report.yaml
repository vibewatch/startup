      - number: '3.4'
        title: 'Adjacent Platforms and Substitutes: Glean, Workato, n8n, Retool, and Consulting Firms'
        blocks:
          - type: paragraph
            body: >-
              The adjacent and substitute category covers platforms that partially address the AI deployment
              job-to-be-done from the search, integration, or developer tools angle. Glean raised a $260M Series F at a
              $4.6B valuation in February 2025, positioning itself as the enterprise AI platform for search, knowledge
              management, and AI assistant workflows. Glean competes with Distyl in the enterprise knowledge-worker AI
              segment but not in the operational and process-execution AI agent segment where Distyl focuses. Glean's
              Gartner Peer Insights rating of 4.5/5 and G2 rating of 4.8 reflect strong user satisfaction among
              knowledge-worker deployments. Workato is the dominant iPaaS and process automation platform, holding the
              Gartner Magic Quadrant Leader position eight consecutive years and positioned furthest in vision three
              times. Workato competes with Distyl when enterprise buyers frame their AI requirement as an integration
              and automation problem rather than an AI deployment problem. n8n offers a zero-cost self-hosted community
              edition that positions it as a status-quo substitute for mid-market engineering teams that can self-serve
              workflow automation without a vendor contract. Retool publishes a starter price of $10 per builder per
              month and pro at $50 per builder per month, competing in the internal-tools segment. Relevance AI provides
              a multi-agent orchestration platform with an L1 through L4 autonomy framework and enterprise custom
              pricing. Accenture's $3B AI investment and 738,000-person delivery capacity directly compete with Distyl's
              FDE model for Fortune 500 AI transformation engagements. PwC's 2026 AI Predictions report confirms that
