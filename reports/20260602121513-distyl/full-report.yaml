        title: 'Incumbent Enterprise Automation Platforms: UiPath, ServiceNow, and Pega'
        blocks:
          - type: paragraph
            body: >-
              UiPath, ServiceNow, and Pega represent the incumbent displacement risk: large, well-capitalized automation
              and workflow platforms that are aggressively adding agentic AI capabilities atop existing customer
              relationships. UiPath holds the largest installed base in enterprise RPA with ARR of $1.901 billion as of
              April 2026, net retention of 109%, and 2,624 customers spending over $100K annually. UiPath launched its
              Autopilot agentic AI product in FY2025 and positions AI agents as an extension of its existing automation
              workflows. The risk to Distyl is that UiPath cross-sells AI agent capabilities to its existing RPA
              customers, foreclosing greenfield AI opportunities in verticals where UiPath already has production
              integrations. ServiceNow reported FY2025 total revenue of $12.15 billion and embedded agentic AI agents
              natively into its Now Platform through the Yokohama release in early 2026. Because ServiceNow is already
