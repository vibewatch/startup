  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Distyl's public footprint points to meaningful regulatory and legal exposure before investors have seen
              the usual control artifacts. The company markets deployments across healthcare, insurance, manufacturing,
              retail, and telecom, and its privacy policy explicitly covers personal information collection,
              third-party-source data, and GDPR-style rights. That combination matters because the AI Act, GDPR
              guidance, HIPAA business-associate rules, and general AI-governance expectations all become relevant when
              enterprise agents are deployed into sensitive workflows. Distyl's legal posture is also asymmetric in a
              way that is common for software vendors but important for diligence: the terms mandate individual
              arbitration, waive class actions, and sharply cap liability, while no public insurance disclosure offsets
              those contractual limits. The public trademark record shows only an early-stage pending DISTYL word mark,
              and the public litigation and Form D record is clean only in the narrow sense that no reviewed
              CourtListener or SEC search result returned an obvious Distyl match. That is not proof of low legal risk;
              it is proof that the company has not published enough evidence to close those questions without management
              materials.
