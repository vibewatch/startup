    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The positive investment case for Distyl is easy to articulate from public evidence: the company has
              attracted a credible venture syndicate, publicized a sizable Series B, claims 150 million plus end users,
              markets Fortune 500 deployments across multiple industries, and has attached itself to Google Cloud and
              NVIDIA in ways that strengthen enterprise credibility. Those are not trivial signals. They suggest the
              company has real customer access, real delivery capability, and the possibility of becoming a scaled
              enterprise AI platform rather than a transient consultancy. The anti-thesis is equally clear: virtually
              none of the financial data needed to underwrite the current price is public. There is no disclosed
              revenue, no public margin profile, no retention data, no concentration view, and no cap-table waterfall.
              Channel Dive's description of outcome-linked services amplifies the risk that reported traction may be
              valuable but less durable or less software-like than a pure SaaS multiple assumes. The right thesis is
              therefore conditional, not exuberant.
