  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Distyl appears to layer workflow context assembly and orchestration above external model infrastructure and
      customer data sources.
    data:
      layers:
        - label: Customer workflow outcomes
          detail: >-
            Support, claims, manufacturing, finance, and exception-handling jobs where Distyl promises measurable
            operating improvement.
        - label: Enterprise knowledge and system inputs
          detail: Policies, cases, SOPs, workflow history, and operational data from customer knowledge bases and systems.
        - label: Context Mesh grounding layer
          detail: Dynamic context assembly that prepares permissioned enterprise context for each workflow or agent action.
        - label: Distillery orchestration layer
          detail: >-
            Workflow state, long-running agents, memory, evaluation, and deployment logic that turn model calls into
            production processes.
        - label: External model and infrastructure layer
          detail: >-
            Inference and serving from partners such as OpenAI, NVIDIA Nemotron, and Google Cloud Vertex AI / TPU
            infrastructure.
