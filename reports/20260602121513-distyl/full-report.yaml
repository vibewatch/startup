      - number: '3.5'
        title: Moat Durability, Switching Cost, and Commoditization Risk
        blocks:
          - type: paragraph
            body: >-
              Distyl's competitive moat rests on four claimed pillars: forward-deployed engineering culture,
              outcome-based contracting, proprietary data infrastructure tooling (Distillery/Distiller), and
              vertical-specific production evidence at scale. The durability of each pillar is contested. The FDE model
              is not patentable and is being replicated by both large consulting firms (Accenture, Deloitte) and direct
              peers (Palantir's Boot Camp model). Distyl's outcome-based contracting model is a pricing innovation that
              aligns buyer and vendor interests but is not technically defensible — any competitor willing to accept
              outcome risk can adopt the same pricing structure, and C3.ai has already pivoted to consumption-based
              contracting. Distyl's proprietary Distillery data platform creates switching costs once embedded in a
              customer's production data stack, but the depth of that switching cost depends on whether Distyl's
              infrastructure becomes load-bearing for ongoing AI inference or is merely a deployment scaffold. Distyl
              has not publicly disclosed whether customers own or can independently operate the Distillery layer
              post-contract. Production evidence — 150M or more end users served — is a genuine moat in enterprise
              procurement: buyers pay a trust premium for proven scale. However, this advantage erodes as Palantir,
              C3.ai, and ServiceNow accumulate comparable reference accounts. The most material commoditization risk is
              foundation model commoditization: if off-the-shelf LLM APIs and open-source agent frameworks reduce the
              complexity of production AI deployment, the engineering depth that justifies Distyl's premium will
              compress. Regulatory compliance posture — with no public FedRAMP or HIPAA BAA disclosure — is an
              undisclosed gap in Distyl's moat in regulated verticals including BFSI, healthcare, and government, which
              are Distyl's primary disclosed customer segments.
            claimRefs:
              - CP010
              - CP017
              - CP018
              - CP019
              - CP022
              - CP024
              - CP025
              - CP028
              - CP029
