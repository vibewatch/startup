      - number: '8.6'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Distyl is not ready for a high-conviction public-markets style underwriting process on current disclosure.
              The company may be operationally strong, but the evidence set is still private-market thin: no public
              revenue, no public retention metrics, no margin structure, no concentration view, and no public cap-table
              terms. That limits both valuation precision and exit-readiness confidence. The most realistic near-term
              paths are another private round, a strategic acquisition if a buyer wants the team and customer base, or a
              much later IPO once financial disclosure matures. For investors today, the answer is not to reject the
              company outright but to narrow the diligence agenda aggressively. Revenue quality, gross margin, services
              mix, customer concentration, partner contracts, security and privacy posture, and preference-stack details
              are the gating questions. If management can answer those convincingly, the public-only recommendation can
              improve. If not, the current price should be treated as a watch item rather than an executable edge.
            claimRefs:
              - CV005
