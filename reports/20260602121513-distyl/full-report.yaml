        title: Legal, IP, and Contract Structure Risk
        blocks:
          - type: paragraph
            body: >-
              The legal and IP picture around Distyl is better described as incomplete than clean. The pending DISTYL
              trademark application is useful evidence that the brand is being formalized, but it is still an unexamined
              application rather than a mature, registered portfolio. The company's public legal documents are
              protective of Distyl rather than comfort-inducing for investors or enterprise counterparties: mandatory
              arbitration, class-action waiver language, and tight liability caps reduce the company's open-ended
              exposure, but they also signal that meaningful losses would likely be pushed back onto customers or
              litigated privately. The absence of public litigation in the reviewed record is directionally helpful, yet
              arbitration clauses reduce the likelihood that disputes would become visible in court dockets. Likewise,
              no public Form D evidence does not imply no financing complexity; it only means public securities filing
              visibility is thin. From an investment perspective, the practical implication is that contract libraries,
              insurance schedules, IP assignments, open-source policy, and trademark strategy should all be mandatory
