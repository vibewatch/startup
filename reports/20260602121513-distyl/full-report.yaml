  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Distyl AI operates at the intersection of enterprise AI systems delivery and workflow automation—a
              narrower layer than the aggregate "enterprise AI" category cited by generic market reports. The relevant
              spend boundary covers three components: (1) AI system design and deployment engagements at Fortune 500
              operations teams, (2) the Distillery AI platform licensing fees for ongoing AI workflow management, and
              (3) the research and evaluation services Distyl bundles into its vertically integrated model. Excluded
              from the addressable market are: raw foundation model API costs (paid to OpenAI, Anthropic, or cloud
              providers), horizontal cloud infrastructure (Microsoft Azure), generic RPA licenses without an AI
              orchestration layer, and standalone analytics or BI tooling. The key substitutes a Fortune 500 buyer can
              choose instead of Distyl include: large consulting firms (Accenture, Deloitte, BCG) that staff AI
              transformation programs using time-and-materials contracting; incumbent automation platforms (UiPath,
              ServiceNow, Pega) that offer pre-built AI agents within their existing enterprise footprint; and an
              internal "build-it-yourself" option using foundation model APIs and engineering headcount. Each substitute
              addresses a different slice of the buyer's job-to-be-done: consulting firms provide strategy and delivery
              bandwidth but not a persistent AI platform; automation incumbents provide a managed software layer but not
              deep bespoke workflow engineering; the internal option maximizes control but requires scarce AI
              engineering talent the buyer typically lacks. Distyl's positioning targets the gap where all three
              substitutes fall short: production-ready, custom AI systems that embed within the client's operations and
              are accountable to business outcomes.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
