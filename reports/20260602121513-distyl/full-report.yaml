      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Enterprise AI workflow automation buyers are primarily large organizations with complex, high-volume
              operational processes where even small efficiency improvements deliver material financial impact. Distyl's
              disclosed client base concentrates in five verticals: telecommunications, healthcare, insurance,
              manufacturing, and financial services—all sectors characterized by high transaction volumes, regulatory
              compliance requirements, and chronic labor constraints. The budget owner in most engagements is the Chief
              Information Officer or Chief Operating Officer, with program sponsors often at the VP Operations or SVP
              Digital level. End users—the people whose workflows are being automated—are typically domain experts
              (clinical staff, claims adjusters, network engineers) whose participation is essential to move an AI pilot
              into production. Distyl's CEO has explicitly noted that "without the subject matter experts, there's no
              chance we're able to go into production." The adoption path follows a canonical enterprise software
              journey: executive AI strategy → proof-of-concept selection → limited pilot with embedded engineering team
              → production rollout → ongoing platform licensing. Distyl's forward-deployed model compresses the middle
              three stages by keeping engineers on-site through production. UiPath data indicates that 90% of US IT
              executives say their business processes would be improved by agentic AI, and 52% say agentic AI will
              enable automation of complex workflows—signaling broad buyer intent, though intent-to- purchase conversion
              rates for complex programs remain unclear. The T-Mobile T-Life AI Assistant deployment demonstrates that
              telecom is an active production vertical, not merely aspirational.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
