  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and GTM Motion
        blocks:
          - type: paragraph
            body: >-
              Distyl AI generates revenue through two primary mechanisms, as described in a September 2025 Channel Dive
              interview with CEO Arjun Prakash: outcome-based project fees (partially contingent on achieving client
              objectives) and platform licensing fees for ongoing AI system operation and maintenance. This structure
              contrasts with a pure time-and-materials consulting model and with SaaS subscription software; it aligns
              more closely with Palantir's forward-deployed engineer model, where engineering labor is embedded on-site
              and outcomes are co-owned. The CEO characterized Distyl as "backed by profitability" in its September 2025
              Series B press release, implying the company generates gross profit sufficient to support its operating
              model; however, no audited financial statement, management-account disclosure, or independent
              corroboration of this claim exists in public sources.

              Distyl AI's go-to-market motion is anchored in a forward-deployed engineering (FDE) model. The company
              places its own engineers on-site at client organizations, co-owns project outcomes, and bills a portion of
              fees contingent on delivering measurable impact. This reduces initial sales friction—clients see
              measurable results within a claimed three-month window—but implies material labor costs associated with
              on-site staffing. The GTM channel is primarily direct/enterprise sales; no reseller channel, marketplace
              listing, or partner-led GTM structure has been publicly described. The April 2026 Google Cloud partnership
              as a "priority partner" for the Gemini Enterprise transformation program represents a potential channel
              addition, though no revenue attribution has been disclosed. The March 2026 NVIDIA integration similarly
              provides co-sell credibility with enterprise infrastructure teams. The OpenAI services alliance (April
              2023) supports Distyl's access to OpenAI's top enterprise accounts, providing a warm-introduction GTM
              channel that has been active since the company's earliest months. No customer acquisition cost, sales
              cycle length, average contract value, net revenue retention, or logo churn data is publicly available; all
              such metrics must be obtained via data room.
