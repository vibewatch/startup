              - CV043
              - CV044
      - number: '8.2'
        title: Recommendation and Rating
        blocks:
          - type: paragraph
            body: >-
              On public evidence alone, Distyl merits a research-more recommendation with medium confidence, a high risk
              rating, and a stretched valuation stance. That is not a comment on company quality in the abstract; it is
              a statement about price discipline relative to available facts. The current $1.8 billion valuation may
              prove attractive if Distyl is already operating near the upper end of late-stage private AI revenue ranges
              and can defend software-like retention and margin. But none of those variables is public. What is public
              is the asymmetry between narrative strength and financial disclosure. Distyl has strong customer and
              partner proof, but there is no public evidence that lets an outside investor translate that proof into
              underwriting-grade economics. A public-only buyer therefore lacks the information needed to say whether
              the company is cheap, fair, or expensive in absolute terms. The prudent recommendation is to keep the name
              active, not to close conviction prematurely.
            claimRefs:
              - CV005
              - CV006
              - CV027
              - CV028
              - CV029
              - CV034
              - CV035
              - CV036
              - CV044
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV006
              - CV034
              - CV035
              - CV036
              - CV042
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV034
              - CV035
              - CV036
      - number: '8.3'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Distyl's financing path is fast enough to command attention. The company publicly announced a $20 million
              Series A in late 2024 and a $175 million Series B at a $1.8 billion valuation in September 2025. Nasdaq
              Private Market also reflects those rounds in its secondary-market company page, providing a partial
              external checkpoint on the financing timeline. Even so, the financing context is still incomplete. The
              reviewed public SEC search does not show a Form D, and the public packet does not disclose the cap table,
              liquidation stack, preference structure, or any direct revenue figure that would explain how investors
              bridged from Series A to a $1.8 billion valuation in under a year. In practical terms, that means the
              round price should be treated as a market-clearing private value signal rather than as an evidenced public
              fundamental. Investors can respect that signal without letting it substitute for diligence. The more
              aggressively a company is financed before disclosure matures, the more important entry discipline becomes.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV032
              - CV036
              - CV037
      - number: '8.4'
        title: Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is the only defensible way to discuss Distyl's price when revenue is undisclosed. In
              the bull case, Distyl converts its customer proof and partner leverage into something like $250 million to
              $300 million of revenue, then sustains a 10x to 12x multiple because public markets continue rewarding
              enterprise AI growth. That yields roughly $2.5 billion to $3.6 billion of value, or meaningful upside from
              the Series B price. In the base case, Distyl reaches $150 million to $200 million of revenue and receives
              a still-respectable 7x to 9x multiple, which implies around $1.05 billion to $1.8 billion of value—flat to
              negative versus the current entry. In the bear case, revenue lands materially lower or the market treats
              Distyl more like project-heavy software services, producing $0.3 billion to $0.75 billion of value. The
              crucial point is not the precision of any single range; it is that the middle of the public comp envelope
              does not automatically clear the current price.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV037
              - CV038
              - CV039
              - CV040
