      - number: '3.2'
        title: 'Direct AI Deployment Peers: Palantir AIP and C3.ai'
        blocks:
          - type: paragraph
            body: >-
              Palantir AIP is Distyl's most directly comparable competitor. Palantir's forward- deployed engineering
              culture, long-running DOD and intelligence community customer relationships, and AIP platform for LLM
              orchestration over structured enterprise data mirror Distyl's own FDE model at far greater scale. Palantir
              reported Q4 FY2025 revenue of $828 million representing 36% year-over-year growth, with US commercial
              revenue up 54% and US commercial customer count reaching 382 enterprises as of December 31, 2025.
              Palantir's AIP Boot Camps — intensive multi-day deployment sprints with forward-deployed engineers — are
              functionally analogous to Distyl's FDE motion. Palantir's primary limitation from a competitive standpoint
              is pricing: its contracts frequently run $1M or more per year per enterprise, making it inaccessible to
              mid-market buyers and creating a high-price segment Distyl can undercut. C3.ai represents a different risk
              profile: a publicly traded enterprise AI platform that has built vertical-specific AI applications for
              energy, manufacturing, financial services, and defense. C3.ai reported Q3 FY2026 revenue of $103.6 million
              representing 26% year-over-year growth with 560 or more enterprise deployments and pivoted from
              subscription to consumption-based pricing in 2023 to reduce enterprise procurement friction. C3.ai
              applications target specific workflows (predictive maintenance, demand forecasting, fraud detection)
              rather than Distyl's generalist enterprise AI agent approach. C3.ai is a direct peer for
              regulated-vertical deals (energy, defense) but weaker in telecom and healthcare where Distyl has disclosed
              production deployments.
