- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: exhaustive
    basis: 'Comparable set intentionally covers the five public benchmarks most relevant to Distyl''s enterprise AI and workflow
      narrative as of June 2026: ServiceNow, UiPath, Pegasystems, Palantir, and C3 AI; together they span workflow incumbents,
      automation software, and AI-first public narrative extremes.'
  columns:
  - Comparable
  - Revenue / ARR anchor
  - Valuation anchor
  - Implied multiple / status
  - Relevance to Distyl
  - Key limitation
  rows:
  - - ServiceNow
    - $13.96B revenue
    - $140.11B market cap
    - ~10.0x revenue
    - Scaled enterprise workflow platform; useful upper bound for high-quality workflow software
    - Massively larger, more diversified, and much more mature
  - - UiPath
    - $1.61B revenue; $1.901B ARR
    - $6.81B market cap
    - ~4.2x revenue
    - Automation and agentic workflow benchmark with public ARR disclosure
    - Public market treats it as slower-growth automation rather than pure AI narrative
  - - Pegasystems
    - $1.70B revenue
    - $5.96B market cap
    - ~3.5x revenue
    - Workflow and decisioning incumbent relevant to enterprise transformation buyers
    - Legacy mix and slower growth reduce comparability to a private AI-native startup
  - - Palantir
    - $5.22B revenue
    - $368.73B market cap
    - ~70.6x revenue
    - Public example of extreme AI narrative premium at large scale
    - Outlier driven by unique data, government, and investor-narrative dynamics
  - - C3 AI
    - $0.30B revenue
    - $1.70B market cap
    - ~5.7x revenue
    - Public AI-software pure play with volatility that brackets downside risk
    - Scale is smaller and public-market history includes material hype-cycle compression
  notes: Multiples are derived from public June 2026 market-cap and revenue figures in the retained packet. Palantir is intentionally
    included as an outlier, not as the default anchor.
