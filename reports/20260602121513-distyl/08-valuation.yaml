- id: recommendation-rating
  title: Recommendation and Rating
  body: On public evidence alone, Distyl merits a research-more recommendation with medium confidence, a high risk rating,
    and a stretched valuation stance. That is not a comment on company quality in the abstract; it is a statement about price
    discipline relative to available facts. The current $1.8 billion valuation may prove attractive if Distyl is already operating
    near the upper end of late-stage private AI revenue ranges and can defend software-like retention and margin. But none
    of those variables is public. What is public is the asymmetry between narrative strength and financial disclosure. Distyl
    has strong customer and partner proof, but there is no public evidence that lets an outside investor translate that proof
    into underwriting-grade economics. A public-only buyer therefore lacks the information needed to say whether the company
    is cheap, fair, or expensive in absolute terms. The prudent recommendation is to keep the name active, not to close conviction
    prematurely.
  claimRefs:
  - CV005
  - CV006
  - CV027
  - CV028
  - CV029
  - CV034
