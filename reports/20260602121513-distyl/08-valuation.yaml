tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Basis
  rows:
  - - Recommendation
    - Research-more
    - Strong customer and partner proof, but no public revenue, margin, retention, or concentration data
  - - Confidence
    - Medium
    - Sufficient evidence to reject false precision, insufficient evidence to underwrite the price
  - - Risk rating
    - High
    - Valuation is explicit; economics are not. Downside emerges quickly if revenue quality disappoints
  - - Valuation stance
    - Stretched
    - Public comparable multiples do not clearly support $1.8B without materially higher revenue than the public packet discloses
  - - Decision implication
    - Track actively, require data room
    - Price cannot be judged confidently until revenue quality and cap-table terms are visible
  - - What would upgrade the call
    - Revenue-quality proof
    - Underwriting-grade revenue, GRR/NRR, gross margin, and concentration disclosures could shift the recommendation upward
  notes: This table translates public evidence into an investment posture. It is explicitly price-sensitive and can move materially
    once the data room closes the missing financial gaps.
