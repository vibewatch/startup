- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - '[THESIS] Blue-chip proof exists'
    - 150M+ end-user claim, Fortune 500 sectors, production-oriented case studies
    - Validated customer economics showing recurring rather than project-like revenue
  - - '[THESIS] Partnerships increase upside credibility'
    - Google Cloud priority-partner narrative and NVIDIA integration support enterprise readiness
    - Evidence that these partnerships materially accelerate pipeline or lower delivery cost
  - - '[THESIS] Financing signal is strong'
    - Series B at $1.8B suggests sophisticated investors saw enough to price the round aggressively
    - Independent economic proof that explains the valuation rather than merely repeats it
  - - '[ANTI-THESIS] Revenue is undisclosed'
    - No public revenue means the current multiple cannot be triangulated to fundamentals
    - Management discloses audited or diligence-grade revenue bridge
  - - '[ANTI-THESIS] Revenue quality is undisclosed'
    - No GRR, NRR, concentration, or gross-margin view means durability is unknown
    - Cohort retention and services-mix data confirm software-like economics
  - - '[ANTI-THESIS] Public comps do not naturally clear the price'
    - UiPath, C3 AI, Pega, and ServiceNow imply much lower multiples than Distyl can be proven to deserve from public data
    - Distyl demonstrates revenue scale and quality strong enough to justify a premium comp set
  notes: 'Arguments are intentionally symmetrical: each thesis item is paired with the evidence missing that would make the
    point underwritable rather than narrative.'
