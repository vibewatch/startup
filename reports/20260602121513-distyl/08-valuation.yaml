  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-opacity
    missingEvidence: Current revenue, booked ARR if any, and a bridge from services to recurring software revenue.
    whyItMatters: Without a revenue denominator, the $1.8B valuation cannot be mapped to any comparable multiple with underwriting
      confidence.
    diligencePath: Request CFO-level revenue bridge and audited or board-reviewed KPI pack.
    relatedQuestionRefs:
    - QV005
    - QV022
    - QV023
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: financial-opacity
    missingEvidence: Gross margin, GRR, NRR, professional-services mix, and concentration by top customer.
    whyItMatters: Revenue quality determines whether Distyl should be compared to software, services, or a hybrid model; it
      also determines downside risk at the current entry price.
    diligencePath: Request full customer-cohort and P&L extracts plus concentration schedule.
    relatedQuestionRefs:
    - QV006
    - QV024
    - QV028
    relatedTableRefs:
    - TV001
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Liquidation preferences, side letters, anti-dilution terms, and current dilution stack.
    whyItMatters: Headline post-money can diverge materially from actual investor return potential when the preference stack
      is unknown.
    diligencePath: Request certified capitalization table and waterfall model at multiple exit values.
