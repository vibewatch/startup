- id: TV005
  title: Thesis-break and monitoring triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue disclosure disappoints
    - First diligence-grade revenue number is materially below the 150M–180M level implied by generous public comp support
    - Current price loses even optimistic public-multiple support
    - Re-cut valuation model immediately and assume downside case becomes more likely
  - - Retention or concentration disappoints
    - GRR/NRR weak or one/few customers dominate ARR
    - Public narrative of platform durability breaks
    - Move stance from research-more to avoid unless price resets
  - - Services mix overwhelms software economics
    - Delivery gross margin or professional-services intensity is materially worse than expected
    - Comparable set should shift toward lower-multiple services or implementation peers
    - Treat the current valuation as narrative-driven rather than durable
  - - Partner leverage weakens
    - Google Cloud or NVIDIA narrative does not translate into pipeline, margin, or deployment speed
    - Bull-case execution assumptions lose credibility
    - Lower upside assumptions and widen discount to public software comps
  - - Governance / cap-table complexity surprises
    - Preference stack, ratchets, or side terms materially impair common-equity outcomes
    - Headline valuation overstates actual investor return economics
    - Re-underwrite on waterfall economics, not post-money headline
  notes: The trigger table converts missing public evidence into monitorable diligence checkpoints rather than treating uncertainty
    as a vague qualitative concern.
  claimRefs:
  - CV005
  - CV006
  - CV009
  - CV010
  - CV027
  - CV028
  - CV029
  - CV031
  - CV042
  - CV043
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue and revenue bridge
    - Current revenue, last twelve months trend, and booked-versus-recurring split
    - Valuation cannot be triangulated without a revenue denominator
    - Finance data room and CFO walk-through
  - - GRR / NRR / renewal proof
    - Cohort retention, renewal rates, and expansion by top cohorts
    - The key downside question is whether Distyl renews like SaaS or like one-off projects
    - Customer analytics export and board KPI pack
  - - Gross margin and services mix
    - Gross margin by product and services, plus implementation intensity
    - Outcome-linked delivery can hide services-heavy economics under software branding
    - Detailed P&L and delivery-operations review
  - - Customer concentration
    - Top customers, contract size, and renewal calendar
    - A few large accounts could dominate value even if logo count looks impressive
    - ARR concentration schedule and contract review
  - - Partner contracts
    - Material terms with Google, model vendors, infrastructure providers, and NVIDIA-linked stack dependencies
    - Bull-case assumptions rely on durable partner leverage and manageable pricing
    - Legal review of partner agreements and pricing clauses
  - - Cap table and preference stack
    - Liquidation preferences, ratchets, side letters, and employee dilution
    - Headline post-money may not map cleanly to investor returns
    - Counsel-supported capitalization model and waterfall analysis
  notes: These asks are ranked by how quickly they can change the recommendation or the apparent attractiveness of the current
    entry price.
