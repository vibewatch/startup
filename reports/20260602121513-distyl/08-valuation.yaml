schemaVersion: report-v2
artifact: valuation
slug: distyl
runDate: '2026-06-02'
company:
  name: Distyl
chapter:
  number: 8
  title: Valuation
  summary: Distyl's public case is strong on customer proof, partner credibility, and financing momentum, but weak on the
    economic disclosure needed to underwrite a $1.8 billion valuation. Public comparable analysis implies the current price
    may work in a strong bull case, yet the public-only recommendation remains research-more with high risk and a stretched
    valuation stance until revenue quality, margins, retention, and cap-table terms are disclosed.
sections:
- id: investment-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'The positive investment case for Distyl is easy to articulate from public evidence: the company has attracted a credible
    venture syndicate, publicized a sizable Series B, claims 150 million plus end users, markets Fortune 500 deployments across
    multiple industries, and has attached itself to Google Cloud and NVIDIA in ways that strengthen enterprise credibility.
    Those are not trivial signals. They suggest the company has real customer access, real delivery capability, and the possibility
    of becoming a scaled enterprise AI platform rather than a transient consultancy. The anti-thesis is equally clear: virtually
    none of the financial data needed to underwrite the current price is public. There is no disclosed revenue, no public
    margin profile, no retention data, no concentration view, and no cap-table waterfall. Channel Dive''s description of outcome-linked
    services amplifies the risk that reported traction may be valuable but less durable or less software-like than a pure
    SaaS multiple assumes. The right thesis is therefore conditional, not exuberant.'
  claimRefs:
  - CV003
  - CV004
  - CV005
  - CV006
  - CV008
  - CV009
  - CV010
  - CV031
  - CV032
  - CV033
