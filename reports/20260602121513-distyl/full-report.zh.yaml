  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点和反论点
        blocks:
          - type: paragraph
            body: >-
              仅从公开证据看，Distyl 的正面投资逻辑很容易讲清：公司吸引了可信的风投 syndicate，公开了可观的 Series B，声称触达 1.5 亿以上终端用户，在多个行业营销 Fortune 500
              部署，并以强化企业可信度的方式绑定 Google Cloud 和 NVIDIA。这些都不是轻微信号。它们说明公司有真实客户入口、真实交付能力，并有可能成为成规模企业 AI
              平台，而不是短暂的咨询公司。反论点同样清楚：承销当前价格所需的财务数据几乎都不公开。没有披露收入，没有公开利润率画像，没有留存数据，没有集中度视角，也没有 cap-table waterfall。Channel
              Dive 对结果挂钩服务的描述进一步放大了风险：报告的牵引力可能有价值，但未必像纯 SaaS 倍数假设的那样持久或软件化。因此，正确论点应是有条件的，而不是亢奋的。
            claimRefs:
