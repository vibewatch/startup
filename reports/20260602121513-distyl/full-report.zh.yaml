  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              在投资人看到常规控制工件之前，Distyl 的公开足迹已经指向不小的监管和法律敞口。公司营销覆盖医疗、保险、制造、零售和电信部署；隐私政策明确涵盖个人信息收集、第三方来源数据和 GDPR 风格权利。企业
              agents 一旦部署到敏感工作流里，AI Act、GDPR 指引、HIPAA business-associate 规则和一般 AI 治理预期都会变得相关。Distyl
              的法律姿态也有软件供应商常见、但尽调必须重视的不对称性：条款要求个人仲裁、放弃集体诉讼，并大幅限制责任，而公开层面没有保险披露来抵消这些合同限制。公开商标记录只显示早期待审的 DISTYL 文字商标；公开诉讼和
              Form D 记录干净，也只是在狭义上说明经审阅的 CourtListener 或 SEC 搜索结果没有返回明显 Distyl
              匹配。这不是低法律风险的证明，而是说明公司没有发布足够证据，无法在没有管理层材料的情况下关闭这些问题。
