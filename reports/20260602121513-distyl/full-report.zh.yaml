      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Distyl AI 已通过三轮股权融资约 $202 million。$7 million 种子轮于 2023 年 4 月宣布，同时发布与 OpenAI 的战略服务联盟，Coatue 和
              Dell Technologies Capital 参投。$20 million Series A 于 2024 年 11 月 19 日宣布，由 Lightspeed Venture Partners
              领投，Khosla Ventures 加入；既有投资人 Coatue、Dell Technologies Capital 和天使投资人 Nat Friedman 也参与。Nasdaq Private Market
              数据显示，Series A 于 2025 年 1 月 7 日前后关闭。

              $175 million Series B 于 2025 年 9 月 23 日宣布，投后估值 $1.8 billion，使 Distyl 成为私营独角兽。参投方包括 Lightspeed Venture
              Partners、Khosla Ventures、DST Global、Coatue Management 和 Dell Technologies Capital。CB Insights 将 Distyl
              纳入独角兽追踪器。Nasdaq Private Market 和 Forge Global 列出 Distyl 股票用于老股交易，但未公开披露每股价格或详细股权结构表。公司未向 SEC 提交可通过 EDGAR
              搜索公开发现的 Form D 或其他证券披露。清算优先权、参与权、反稀释条款或完全稀释股数均无公开信息；这些都是估值承销的关键材料。
