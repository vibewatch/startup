      - number: '3.5'
        title: 护城河耐久性、切换成本与商品化风险
        blocks:
          - type: paragraph
            body: >-
              Distyl 的竞争护城河建立在四个声称支柱上：前线部署工程文化、结果导向合同、自研数据基础设施工具（Distillery/Distiller），以及垂直特定生产证据和规模。每个支柱的耐久性都有争议。FDE
              模式无法申请专利，且正被大型咨询公司（Accenture、Deloitte）和直接同业（Palantir 的 Boot Camp 模式）复制。Distyl
              的结果导向合同模式是一种定价创新，能对齐买方与供应商利益，但没有技术防御性——任何愿意承担结果风险的竞争对手都能采用同样定价结构，C3.ai 已经转向按用量计费。Distyl 自研 Distillery
              数据平台一旦嵌入客户生产数据栈，就会形成切换成本，但切换成本深度取决于 Distyl 基础设施是否成为持续 AI 推理的承重层，还是只是部署脚手架。Distyl 未公开披露客户在合同结束后是否拥有或能独立运行
              Distillery 层。生产证据——服务 150M 或更多终端用户——在企业采购中是真实护城河：买家愿意为已验证规模支付信任溢价。不过，随着 Palantir、C3.ai 和 ServiceNow
              积累可比参考账户，这一优势会被侵蚀。最实质的商品化风险是基础模型商品化：如果现成 LLM API 和开源智能体框架降低生产 AI 部署复杂度，支撑 Distyl 溢价的工程深度会被压缩。监管合规姿态——没有公开
              FedRAMP 或 HIPAA BAA 披露——是 Distyl 在 BFSI、医疗和政府等受监管垂直的未披露护城河缺口，而这些正是 Distyl 主要披露客户细分。
