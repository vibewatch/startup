  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              Distyl AI 的收入来自两条主要机制，CEO Arjun Prakash 在 2025 年 9 月 Channel Dive 采访中这样描述：结果导向项目费（部分取决于是否达成客户目标）和持续 AI
              系统运行维护的平台授权费。这一结构不同于纯按工时材料计费的咨询模式，也不同于 SaaS 订阅软件；它更接近 Palantir 的前线部署工程师模式，即工程劳动力嵌入现场并共同承担结果。CEO 在 2025 年 9
              月 Series B 新闻稿中称 Distyl「backed by profitability」，意味着公司产生了足以支撑其运营模式的毛利润；不过，公开来源中没有经审计财务报表、管理口径披露或独立佐证。

              Distyl AI
              的进入市场动作锚定前线部署工程（FDE）模式。公司把自有工程师派驻客户组织现场，共同承担项目结果，并把一部分收费与可衡量影响交付挂钩。这降低了初始销售摩擦——客户能在声称的三个月窗口内看到可衡量结果——但也意味着现场人员配置带来实质人工成本。GTM
              渠道主要是直销 / 企业销售；公开资料没有描述经销商渠道、市场列表或伙伴主导的 GTM 结构。2026 年 4 月 Google Cloud 合作以 Gemini Enterprise
              转型计划「优先合作伙伴」身份出现，可能增加渠道，但未披露收入归因。2026 年 3 月 NVIDIA 集成同样为企业基础设施团队提供联合销售可信度。OpenAI 服务联盟（2023 年 4 月）支持 Distyl
              进入 OpenAI 顶级企业账户，提供从公司早期就已活跃的暖引荐 GTM 渠道。获客成本、销售周期长度、平均合同价值、净收入留存或 logo 流失数据均无公开披露；这些指标都必须通过 data room 获取。
