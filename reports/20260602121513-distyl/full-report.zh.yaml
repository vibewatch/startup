            body: >-
              Distyl AI 公开可得的牵引力指标只有公司自报、未经审计的数据：官网在 2026 年 6 月称触达 1.5 亿以上终端用户，2025 年 9 月 Series B 新闻稿则称 1.2
              亿以上。公开来源没有披露客户数量、收入、ARR、GMV、净收入留存或毛利率。公司的案例组合描述了六个行业的 Fortune 500 项目，影响口径从年化节省 $200M
              以上（电信、医疗）到运营指标提升若干百分点（CPG、硬件、金融服务）不等。所有客户身份都被匿名处理；公开资料中没有第三方审计，也没有客户具名背书。Distyl 的招聘页面显示，截至 2026 年 6
              月，工程、GTM、解决方案、研究和运营岗位有 22 个以上在招，可作为招聘动能的代理指标，但不能证明员工规模或收入规模。

              可比上市公司给出了参照区间：Palantir（FY2025 收入 $4.47B）和 C3.ai（2026 TTM 收入 $300M，且在下滑）代表企业 AI
              公司从风投支持走向上市后的公开市场范围。Glean（一家面向企业协作的知识 AI 公司）和 Scale AI（标注数据与 AI 基础设施）在私募市场常被拿来与 Distyl
              对比，但都不披露财务数据。BIRD-SQL 基准结果（2024 年 8 月由 OpenAI 发布，以 71.83% 执行准确率排名第一）是公开领域唯一经过独立验证的量化性能指标。PhoneArena 对
