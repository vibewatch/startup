      - number: '4.2'
        title: 成本结构、毛利率与单位经济性
        blocks:
          - type: paragraph
            body: >-
              考虑到 FDE 模式要求高级工程师实际嵌入客户现场，Distyl AI 的成本结构预计由人工主导。具备可比 FDE 模式的企业 AI 部署公司，其毛利率高度取决于收入来自平台授权（通常 60-80%
              毛利率）还是工程服务（通常 10-40% 毛利率）的比例。商业模式最接近的 Palantir——一家上市企业 AI 软件 / 服务混合公司——报告 FY2025 收入约 $4.47
              billion，并随着收入结构从纯服务转向软件而实现强劲正调整后经营利润率。另一家瞄准类似行业的企业 AI 软件公司 C3.ai 报告 TTM 2026 收入约 $300 million，轨迹下滑（FY2025
              为 -16%），反映缺少交付模式的纯企业 AI 软件销售挑战。

              Distyl
              的结果导向收费结构带来收入确认复杂性：或有收费部分可能要等结果里程碑达成后才能确认，造成收入与已发生工程成本之间的时点错配。授权费提供更可预测的经常性收入，但规模化取决于部署后能否留住客户。公司案例研究展示了大型离散影响主张（电信客户
              $200M+ OpEx 节省、医疗支付方 $200M+ 成本节省），但没有提供毛利润拆分、收费金额或利润率数据。这些影响到收费的经济性是投资逻辑核心，却未公开披露。云基础设施成本（NVIDIA GPU
              推理、Azure/Google Cloud 托管）是收入成本中的可变部分，会随为客户管理的 AI 推理工作负载扩张。2026 年 3 月宣布的 NVIDIA AI Enterprise
              集成可能提升推理成本效率；任何节省幅度均未量化。
