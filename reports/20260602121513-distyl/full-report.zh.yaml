      - number: '1.4'
        title: 产品、规模与战略合作
        blocks:
          - type: paragraph
            body: >-
              Distyl 的自研平台 Distillery 围绕公司所称的 Context Mesh 构建——一个企业制度知识（政策、工作流、领域逻辑、历史决策）的结构化图谱，AI
              智能体可在其中遍历以生成并执行业务流程。Distillery 支持评估流水线、版本管理、监控、多智能体协同、RBAC、多租户和审计日志。截至 2026 年 3 月，Distyl 宣布把 NVIDIA AI
              Enterprise 软件（包括 NVIDIA Nemotron 3 Super 和 NeMo Agent Toolkit）集成进 Distillery，以支持企业规模的生产级智能体 AI。

              截至 2026 年 4 月，Distyl 宣布与 Google Cloud 建立战略合作，成为 Google Cloud Gemini Enterprise 转型计划的早期优先合作伙伴。这延续了最初的
              OpenAI 服务联盟（2023 年 4 月），以及与 Anthropic 模型和 Microsoft Azure 基础设施的持续协作。公司截至 2026 年 6 月公开声称，其 AI 系统已覆盖 150
              million-plus 终端用户，生产记录为 100%，并为客户带来数亿美元累计运营影响。这些数字由公司自报；公开来源无法独立验证终端用户数、生产记录定义或影响量化方法。distyl.ai
              网站案例研究引用了电信（$200M+ 预计 OpEx 节省）、医疗（$200M+ 估计成本节省）、硬件制造（根因分析快 80%）、金融服务（贷款发放成本降低 93%）和 CPG（订单未完成解决率提升 47%）中的
              Fortune 50/100 部署，客户身份均匿名。
