      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Distyl AI 已通过三轮融资约 $202 million：$7 million 种子轮（2023 年 4 月）、$20 million Series A（2024 年 11 月宣布，按 Nasdaq
              Private Market 数据 2025 年 1 月关闭）和 $175 million Series B（2025 年 9 月 23 日）。Series B 由 Lightspeed Venture
              Partners 领投，Khosla Ventures、DST Global、Coatue Management 和 Dell Technologies Capital 参投。公司没有在任何公开沟通中披露
              Series B 的具体资金用途、现金余额、月度烧钱速度或现金跑道估计。51-200 人的成长阶段企业 AI 公司通常在 FDE 人员配置、云基础设施和销售上每月消耗 $3-8 million，意味着从 $175
              million Series B 关闭起有 22-58 个月现金跑道；这是基于行业基准的自下而上估计，并非 Distyl 特定披露。

              截至 2026 年 6 月，EDGAR 全文或公司搜索无法发现 Distyl AI 的 SEC Form D 或其他证券披露。这可能意味着公司依赖不要求 Form D 申报的豁免（例如 Regulation D
              Rule 506 申报通常要求提交；缺失可能反映仅州层面申报或时间延迟），也可能只是 EDGAR 对近期融资索引不完整。公司为 DISTYL 提交的 USPTO 商标申请（序列号 99611159，2026 年
              1 月 23 日提交）是识别到的 Distyl AI, Inc. 唯一公开政府申报。Distyl 没有披露债务、项目融资或信贷额度。通过 Nasdaq Private Market 和 Forge Global
              的老股交易显示投资人兴趣，但没有披露每股流动性价格。Dell Technologies Capital 从种子轮到 Series B
              多轮参与，意味着除了纯财务回报外可能存在战略价值，并可能形成企业销售渠道或收购可选性，影响 Distyl 的资本战略。
