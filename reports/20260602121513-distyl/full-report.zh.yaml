      - number: '8.6'
        title: 退出准备度和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              以当前披露看，Distyl 还没有准备好接受高信念、公开市场式承销流程。公司运营上可能很强，但证据集仍然是私募市场式稀薄：没有公开收入，没有公开留存指标，没有利润率结构，没有集中度视角，也没有公开
              cap-table 条款。这限制了估值精度，也限制了退出准备度置信度。近期最现实的路径是再融资一轮私募、如果买家想要团队和客户基础则被战略收购，或等财务披露成熟后更晚
              IPO。对今天的投资人来说，答案不是直接否掉公司，而是大幅收窄尽调议程。收入质量、毛利率、服务
              mix、客户集中度、合作伙伴合同、安全和隐私姿态，以及优先权栈细节，都是闸门问题。如果管理层能有说服力地回答，公开资料下的建议可以上调；如果不能，当前价格应被视为观察项，而不是可执行 edge。
