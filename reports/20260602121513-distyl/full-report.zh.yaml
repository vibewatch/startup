              $35.84 billion 到 $93.20 billion 不等的预测值。分歧对估值很重要：使用最大估计的投资人，会把 Distyl 可服务市场估成仅使用 RPA
              代理指标者的两倍以上。尽调应要求任何估值论证明确市场边界，并解释 Distyl 产品如何映射到该边界。
