      - number: '3.2'
        title: 直接 AI 部署同业：Palantir AIP 与 C3.ai
        blocks:
          - type: paragraph
            body: >-
              Palantir AIP 是 Distyl 最直接可比的竞争对手。Palantir 的前线部署工程文化、长期 DOD 和情报界客户关系，以及面向结构化企业数据的 LLM 编排 AIP
              平台，都以远大得多的规模映射了 Distyl 自身 FDE 模式。Palantir 报告 Q4 FY2025 收入 $828 million，同比增长 36%，美国商业收入增长 54%，截至 2025 年 12
              月 31 日美国商业客户数达到 382 家企业。Palantir 的 AIP Boot Camps——由前线部署工程师参与的密集多日部署冲刺——在功能上类似 Distyl 的 FDE
              动作。从竞争角度看，Palantir 的主要限制是定价：其合同经常达到每企业每年 $1M 或更高，使中端市场买家难以承担，也创造了 Distyl 可用更低价格切入的高价细分。C3.ai
              代表另一种风险画像：一家上市企业 AI 平台公司，已为能源、制造、金融服务和国防打造垂直特定 AI 应用。C3.ai 报告 Q3 FY2026 收入 $103.6 million，同比增长 26%，拥有 560
              个或更多企业部署，并在 2023 年从订阅转向按用量计费，以降低企业采购摩擦。C3.ai 应用瞄准特定工作流（预测性维护、需求预测、欺诈检测），而不是 Distyl 的通用型企业 AI 智能体路径。C3.ai
              是受监管垂直交易（能源、国防）的直接同业，但在电信和医疗较弱，而 Distyl 已披露这些领域的生产部署。
