      - number: '3.3'
        title: 存量企业自动化平台：UiPath、ServiceNow 和 Pega
        blocks:
          - type: paragraph
            body: >-
              UiPath、ServiceNow 和 Pega 代表存量替代风险：资本充足的大型自动化和工作流平台，正依托既有客户关系激进加入智能体 AI 能力。UiPath 拥有企业 RPA 最大安装基础，截至 2026 年
              4 月 ARR 为 $1.901 billion，净留存率 109%，年支出超过 $100K 的客户 2,624 家。UiPath 在 FY2025 推出 Autopilot 智能体 AI 产品，并把 AI
              智能体定位为既有自动化工作流的延伸。Distyl 面临的风险是，UiPath 向既有 RPA 客户交叉销售 AI 智能体能力，封锁 UiPath 已有生产集成垂直中的绿地 AI 机会。ServiceNow 报告
              FY2025 总收入 $12.15 billion，并在 2026 年初 Yokohama 版本中把智能体 AI agents 原生嵌入 Now Platform。由于 ServiceNow 已是多数
              Fortune 500 公司 IT 服务管理的记录系统，其 AI 智能体无需新的供应商采购周期即可部署，这在 IT 运营和员工服务工作流中为 Distyl 创造绕行威胁。Pega Systems 在
              Business Process Orchestration and Automation Technologies 类别中位列 Gartner Magic Quadrant Leader，并通过 Pega
              Infinity 平台的 Blueprint 功能嵌入 AI 智能体。Pega 报告 Q1 2026 收入约 $401M，同比增长 12%。在受监管垂直 AI 部署（BFSI、医疗、保险）中，Pega 与
              Distyl 最直接竞争；其既有案例管理集成构成结构性优势。
