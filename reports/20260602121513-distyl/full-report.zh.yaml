      - number: '8.5'
        title: 可比公司组
        blocks:
          - type: paragraph
            body: >-
              选取的可比公司组刻意务实，而不是追求完美。ServiceNow、UiPath 和 Pegasystems 锚定工作流和企业自动化市场一端。C3 AI 锚定公开纯企业 AI 软件基准。Palantir
              捕捉了在规模、数据护城河和投资人热情共同发挥作用时，公开 AI 叙事能获得的上限。没有哪家公司与 Distyl 完全相同，但它们共同界定了价格纪律真正需要关注的公开倍数区间。ServiceNow 接近 10x
              收入，UiPath 约 4.2x，C3 AI 约 5.7x，Pegasystems 约 3.5x。Palantir 是异常离群点，约 70.6x。这个离群点恰恰有用，因为它说明 Distyl
              面临的挑战：即使最强的公开 AI 溢价，也附着在一家披露数十亿美元收入的公司上，而不是一家经济性未披露的企业。Distyl 最终也许应享受溢价，但公开资料包无法证明哪种溢价是理性的。
