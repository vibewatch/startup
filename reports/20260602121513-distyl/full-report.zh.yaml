chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Distyl AI, Inc.（法律名称由网站使用条款和隐私政策确认）成立于 2022 年，总部位于 California 州 San Francisco，并在 New York 和 London
              设有办公室。公司处在企业 AI 软件与专业服务交叉处，为大型且运营复杂的组织部署 AI 原生系统。核心产品是 Distillery 平台，结合自研 Context Mesh
              架构——一个由组织制度知识构成、可结构化遍历的图谱——以及 AI 智能体编排、评估和治理控制。Distillery 支持持久、长时运行的智能体，让它们在企业工作流中累积记忆和上下文，而不是每次交互后重置。

              Distyl 的商业模式是纵向一体化，把工程服务、平台授权和应用 AI 研究打包进单个客户项目。公司采用受 Palantir 启发的前线部署工程（FDE）模式，Distyl
              工程师进驻客户现场并共同承担结果。收入来自两条机制：结果导向项目费（其中一部分取决于是否达成客户目标）和持续 AI 系统运行维护的平台授权费。这不同于传统按工时材料计费的咨询，也不同于纯 SaaS
              软件模式。CEO 在 Series B 公告中称公司「backed by profitability」，但没有披露经审计财务。行业聚焦包括电信、医疗、保险、制造、金融服务和消费品。
