            title: ServiceNow Yokohama 是被低估的替代风险
            body: >-
              ServiceNow 的 Yokohama 平台版本在 2026 年初把智能体 AI agents 原生嵌入其 ITSM 工作流引擎。由于 ServiceNow 已是多数 Fortune 500 公司企业 IT
              审批、变更管理和服务履约的记录系统，其 AI 智能体无需新的供应商采购周期即可部署。这形成绕行威胁：IT 和运营买方可能把 ServiceNow 足迹延伸到 AI 部署，而不是发起新的 Distyl 项目。风险在
              IT 运营和员工服务工作流中最高——这正是 Distyl 争取企业初始落地的工作流。
            calloutType: risk
            claimRefs:
              - CP004
              - CP027
          - type: callout
            title: 监管合规姿态是未披露尽调缺口
            body: >-
              Palantir AIP、C3.ai、UiPath、ServiceNow 和 Pega 均公布 FedRAMP 或 HIPAA BAA 合规状态。截至 2026 年 6 月，Distyl 尚未公开披露同等认证。在
              Distyl 已披露客户群中占相当比例的受监管垂直（BFSI、医疗、保险、政府）里，缺少合规认证是实质采购障碍。尽调团队应确认 Distyl 当前合规状态、计划认证时间表，以及公司在未发布 FedRAMP 或
              HIPAA 授权的情况下如何推进受监管垂直交易。
            calloutType: risk
            claimRefs:
              - CP028
              - CP029
          - type: callout
            title: 咨询公司复制 FDE 已被确认且仍在推进
            body: >-
              大型咨询公司复制 Distyl FDE 模式的风险并非猜测。Accenture 的 $3B AI 投资和 738,000 人交付团队，加上 PwC 在 2026 年把集中 AI
              部署定位为关键成功因素，说明咨询类别正在主动建设 Distyl 率先探索的前线部署能力。Distyl 的防御性来自速度、人才密度和结果责任，而不是一种无法被学会的独特方法。尽调团队应要求提供与 Accenture
              或 Deloitte 作为竞争替代方案的交易中的正面竞争胜负数据。
