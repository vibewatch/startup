  - id: TV005
    title: 投资逻辑破裂与监控触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入披露不及预期
        - 首个达到尽调质量的收入数字明显低于慷慨公开可比支持隐含的 150M–180M 水平
        - 当前价格即便在乐观公开倍数下也失去支撑
        - 立即重切估值模型，并假设下行情景更可能发生
      - - 留存或集中度不及预期
        - GRR/NRR 偏弱，或一个 / 少数客户主导 ARR
        - 平台耐久性的公开叙事破裂
        - 除非价格重置，否则将立场从继续研究转为回避
      - - 服务组合压过软件经济性
        - 交付毛利率或专业服务强度明显差于预期
        - 可比公司集合应转向倍数更低的服务或实施类同行
        - 将当前估值视为叙事驱动，而非可持续
      - - 合作伙伴杠杆减弱
        - Google Cloud 或 NVIDIA 叙事没有转化为管线、利润率或部署速度
        - 乐观情景的执行假设失去可信度
        - 下调上行假设，并扩大相对公开软件可比公司的折价
      - - 治理 / 股权结构复杂性超预期
        - 优先股堆叠、棘轮条款或附带条款严重损害普通股结果
        - 账面估值夸大了实际投资者回报经济性
        - 按退出分配瀑布重新承销，而不是按投后估值标题
    notes: 触发器表把缺失的公开证据转成可监控的尽调检查点，而不是把不确定性泛化成模糊的定性担忧。
    claimRefs:
      - CV005
      - CV006
      - CV009
      - CV010
      - CV027
      - CV028
      - CV029
      - CV031
      - CV042
      - CV043
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入与收入桥接
        - 当前收入、过去十二个月趋势，以及已签约收入与经常性收入拆分
        - 没有收入分母，估值无法三角定位
        - 财务数据室和 CFO 讲解
      - - GRR / NRR / 续约证明
        - 队列留存、续约率，以及头部队列的扩张
        - 关键下行问题在于 Distyl 的续约像 SaaS，还是像一次性项目
        - 客户分析导出和董事会 KPI 包
      - - 毛利率与服务组合
        - 按产品和服务拆分的毛利率，以及实施强度
        - 与结果挂钩的交付可能把服务偏重的经济性藏在软件品牌之下
        - 详细 P&L 和交付运营审查
      - - 客户集中度
        - 头部客户、合同规模和续约日历
        - 即便 logo 数看起来亮眼，少数大客户也可能主导价值
        - ARR 集中度明细和合同审查
      - - 合作伙伴合同
        - 与 Google、模型供应商、基础设施提供商及 NVIDIA 相关技术栈依赖的重大条款
        - 乐观情景假设依赖可持续的合作伙伴杠杆和可控定价
        - 合作伙伴协议和定价条款的法律审查
      - - 股权结构表和优先股堆叠
        - 清算优先权、棘轮条款、附带协议和员工稀释
        - 投后估值标题未必能清晰映射到投资者回报
        - 律师支持的资本结构模型和瀑布分析
    notes: 这些要求按它们改变投资建议或当前入场价表观吸引力的速度排序。
    claimRefs:
      - CV005
      - CV006
      - CV027
      - CV028
      - CV029
      - CV035
      - CV042
      - CV043
