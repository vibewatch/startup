      - number: '3.4'
        title: 相邻平台与替代方案：Glean、Workato、n8n、Retool 和咨询公司
        blocks:
          - type: paragraph
            body: >-
              相邻和替代类别覆盖那些从搜索、集成或开发者工具角度部分解决 AI 部署待完成任务的平台。Glean 于 2025 年 2 月以 $4.6B 估值完成 $260M Series F，把自身定位为面向搜索、知识管理和
              AI 助手工作流的企业 AI 平台。Glean 在企业知识工作者 AI 细分与 Distyl 竞争，但不在 Distyl 聚焦的运营和流程执行 AI 智能体细分竞争。Glean 的 Gartner Peer
              Insights 评分 4.5/5、G2 评分 4.8，反映知识工作者部署中的强用户满意度。Workato 是主导性 iPaaS 和流程自动化平台，连续八年位居 Gartner Magic Quadrant
              Leader，并三次在愿景维度位置最靠前。当企业买方把 AI 需求定义为集成和自动化问题而非 AI 部署问题时，Workato 与 Distyl 竞争。n8n
              提供零成本自托管社区版，使其成为中端市场工程团队的现状替代，后者可在没有供应商合同的情况下自助完成工作流自动化。Retool 公布的起步价为每 builder 每月 $10，pro 为每 builder 每月
              $50，在内部工具细分竞争。Relevance AI 提供多智能体编排平台，带 L1 到 L4 自主性框架和企业定制定价。Accenture 的 $3B AI 投资和 738,000 人交付能力，直接与
              Distyl 的 FDE 模式争夺 Fortune 500 AI 转型项目。PwC 的 2026 AI Predictions 报告确认，大型咨询公司正在把前线部署式集中 AI
              部署定位为关键成功因素，说明咨询类别正在主动建设 Distyl 率先探索的同类能力。
