            body: >-
              Distyl 周围的法律和 IP 图景更适合描述为不完整，而不是干净。待审 DISTYL 商标申请能证明品牌正在正式化，但它仍是未经审查的申请，不是成熟、已注册的组合。公司的公开法律文件保护的是
              Distyl，而不是让投资人或企业交易对手安心：强制仲裁、集体诉讼放弃条款和严格责任上限减少了公司的开放式敞口，但也意味着重大损失很可能被推回客户侧或在私下仲裁。经审阅记录没有公开诉讼，方向上有帮助；但仲裁条款降低了争议出现在法院
              docket 中的可能性。同样，没有公开 Form D 证据并不意味着没有融资复杂性，只说明公开证券申报可见度很薄。从投资角度看，实际含义是合同库、保险清单、IP
              转让、开源政策和商标策略都应是强制数据室项目，而不能被假设为已经受控。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR033
              - CR041
      - number: '7.5'
        title: 市场和竞争风险
        blocks:
          - type: paragraph
            body: >-
              Distyl 所在市场买家热情高，但持久性仍未证明。公司在蓝筹企业中定位强，也能拿出大规模用户触达说法；但竞争对手包括 ServiceNow、Palantir、UiPath、Pegasystems 和 C3.ai
              等成规模 incumbents，它们已经披露的收入、市值或 ARR 远超 Distyl 公开披露水平。规模差距有两层含义。第一，大厂可以把 AI 打包进既有工作流或数据平台合同，让 Distyl
              的独立经济性更难防守。第二，负面市场评论越来越多地警告，如果大量支出更像转型项目或试点，而不是订阅留存，AI-native 收入可能不如经典 SaaS 持久。Distyl
              的案例有助于证明价值，但无法解决续约、扩张或集中度问题。由于没有公开收入、利润率或留存数据，估值和竞争风险最终收敛到同一个问题：在 incumbents 补齐功能差距之前，Distyl
              能否把可见客户结果转化为经常性、可防守的软件经济性？
            claimRefs:
