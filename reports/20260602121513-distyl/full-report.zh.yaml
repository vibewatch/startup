      - number: '1.5'
        title: 里程碑与负面事件
        blocks:
          - type: paragraph
            body: >-
              Distyl AI 的里程碑时间线从 2022 年创立延伸至 2026 年 4 月。关键拐点包括 2023 年 4 月种子轮与 OpenAI 服务联盟同步发布、2024 年 8 月在 BIRD-SQL
              text-to-SQL 基准中排名第一（由 OpenAI 与 GPT-4o 微调一起发布）、2024 年 11 月 Lightspeed 领投 Series A，以及 2025 年 9 月 Series B
              独角兽轮。认可事件包括入选 Redpoint AI64 榜单、World Economic Forum Technology Pioneers 社群，以及 NYSE Intelligent
              Applications Top 40。2026 年 1 月，Distyl 就 DISTYL 文字商标提交 USPTO 商标申请（序列号 99611159）；截至 runDate，状态为「New
              Application — Record Initialized Not Assigned to Examiner」（状态代码 630）。

              最实质的公开负面证据涉及 T-Mobile T-Life AI 助手。T-Mobile 的 T-Life 应用内含具备自助服务能力的 AI 助手，公开资料将其与 Distyl 参与联系起来（根据 Distyl 的
              LinkedIn 帖文和行业报道）。PhoneArena 在 2025 年末发布的评测称 T-Life「less simple and intuitive than customers
              expect」，并指出「many find it buggy」；T-Mobile 因强制用户用应用完成此前可在门店办理的任务而遭批评。该应用下载量超过 75 million 次，但用户体验摩擦已有记录。这对
              Distyl 的生产记录和零失败主张构成声誉风险。截至 runDate，CourtListener 全文搜索和 SEC EDGAR 审查未发现诉讼、监管行动、CFPB/FOS 投诉或重大领导层变动。
