      - number: '8.3'
        title: 融资和估值背景
        blocks:
          - type: paragraph
            body: >-
              Distyl 的融资路径快到值得关注。公司公开宣布 2024 年末完成 $20M Series A，并在 2025 年 9 月以 $1.8B 估值完成 $175M Series B。Nasdaq Private
              Market 的二级市场公司页面也反映这些轮次，为融资时间线提供了部分外部检查点。即便如此，融资背景仍不完整。经审阅的公开 SEC 搜索没有显示 Form D，公开资料包也没有披露 cap
              table、清算栈、优先权结构或任何能解释投资人如何在不到一年内从 Series A 推到 $1.8B
              估值的直接收入数字。实际含义是，应把轮次价格视为市场出清的私募价值信号，而不是有公开基本面支撑的价格。投资人可以尊重这个信号，但不能让它替代尽调。公司在披露成熟前融资越激进，入场纪律就越重要。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV032
              - CV036
              - CV037
      - number: '8.4'
        title: 情景分析
        blocks:
          - type: paragraph
            body: >-
              收入未披露时，情景框架是讨论 Distyl 价格的唯一可防守方式。牛市情景下，Distyl 把客户证明和合作伙伴杠杆转化为约 $250M–$300M 收入，并因公开市场继续奖励企业 AI 增长而维持
              10x–12x 倍数，对应约 $2.5B–$3.6B 价值，相比 Series B 价格有明显上行。基准情景下，Distyl 达到 $150M–$200M 收入，并获得仍然不错的 7x–9x 倍数，对应约
              $1.05B–$1.8B 价值，相比当前入场价持平到负面。熊市情景下，收入显著更低，或市场把 Distyl 更像项目密集型软件服务来定价，产生 $0.3B–$0.75B
              价值。关键不是任何单一区间的精确性，而是公开可比区间的中位数并不会自动覆盖当前价格。
