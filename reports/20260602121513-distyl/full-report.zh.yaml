  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争图谱：分类与战略背景
        blocks:
          - type: paragraph
            body: >-
              Distyl AI 面对四类差异明显的竞争对手，它们对应企业买方解决同一待完成任务的不同方式：部署生产级 AI 智能体，且可衡量地改善 Fortune 500 业务结果。第一类是直接 AI 部署同业，主要是
              Palantir AIP 和 C3.ai，它们提供相近的前线部署或 AI 原生企业能力，并争夺同一类绿地 AI 转型预算。第二类是存量企业自动化平台——UiPath、ServiceNow 和
              Pega——它们从既有工作流自动化和 BPM 位置向智能体 AI 扩张。这些存量厂商在同一 Fortune 500 买方池中已有授权、集成和高管关系。第三类是相邻平台和替代方案，包括 Glean（企业 AI
              搜索和智能体）、Workato（iPaaS 和流程自动化）、Retool（带 AI 的内部工具）、n8n（开源工作流自动化）和 Relevance AI（多智能体编排）。第四类是大型专业服务公司，包括
              Accenture 和 Deloitte，它们用自有咨询团队和合作伙伴生态提供 AI 转型项目，在 Distyl FDE 模式的托管交付维度上直接竞争。现状方案——不部署 AI
              智能体，或继续使用人工流程和点状工具集成——仍是资源不足的企业部门中最常见替代。Distyl
              的核心定位，是在买方需要生产交付速度、结果责任和嵌入式工程深度时胜出；现成平台没有定制集成无法提供这些能力，大型咨询公司也无法以 Distyl 声称的速度和成本效率交付。
            claimRefs:
