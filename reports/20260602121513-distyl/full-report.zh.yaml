      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Distyl AI 由 Arjun Prakash（CEO）和 Derek Ho（COO）共同创立，两人此前都在上市企业数据分析公司 Palantir Technologies 担任业务拓展岗位。Palantir
              经历塑造了 Distyl 的前线部署工程模式，也让公司聚焦在复杂、受监管、可靠性要求极高的企业环境中部署 AI 系统。Vijay Candade 担任业务战略负责人，并在 2026 年 4 月 Google
              Cloud 合作公告中获得公开署名。

              公司没有在公开文件或网站披露董事会组成、投资人董事席位或正式治理结构。考虑到 Lightspeed 同时领投 Series A 和 Series B，Lightspeed 可能拥有董事席位（Series A
              公告称 Raviraj Jain
              牵头交易），但尚未确认。两位联合创始人的关键人集中度构成尽调风险：公开信息没有说明继任规划、归属状态或股权分布。公司法律实体在公开使用条款中采用强制约束仲裁和集体诉讼豁免条款，这限制了一些可能暴露领导层争议的公开诉讼披露形式。撰写时无法从直接来源获得
              LinkedIn 员工数数据；既往研究信号显示公司规模标注为 51-200 人，Ashby 招聘页显示其在 San Francisco、New York 和 London
              面向工程、GTM、解决方案和研究职能持续招聘。
