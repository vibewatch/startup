            body: >-
              Distyl 的成熟度信号来自客户结果、合作里程碑和技术研究的组合，而不是透明的公开发布节奏。案例索引和融资公告暗示平台已经在大型企业内部进入生产；Channel Dive 描述 Distyl
              的运营模式为派驻团队到客户现场工作约 8–12 周，以完成部署。Distyl AI Research 的 GenEdit、IFScale 等论文，以及 “Distillery + GPT-4o” 曾拿下 BIRD
