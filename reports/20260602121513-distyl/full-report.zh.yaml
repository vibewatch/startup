      - number: '2.3'
        title: 买方分层与采纳路径
        blocks:
          - type: paragraph
            body: >-
              企业 AI 工作流自动化买方主要是大型组织，它们拥有复杂、高吞吐量的运营流程，即便小幅效率提升也能带来实质财务影响。Distyl
              披露的客户群集中在五个垂直：电信、医疗、保险、制造和金融服务——这些行业共同特点是交易量高、监管合规要求强、劳动力长期紧张。多数项目的预算负责人是 Chief Information Officer 或
              Chief Operating Officer，项目发起人通常在 VP Operations 或 SVP Digital
              层级。终端用户——工作流被自动化的人——通常是领域专家（临床人员、理赔员、网络工程师），他们参与是 AI 试点进入生产的必要条件。Distyl CEO 明确提到，「without the subject
              matter experts, there's no chance we're able to go into production」。采纳路径遵循典型企业软件旅程：高管 AI 战略 → 概念验证选择 →
              嵌入工程团队的有限试点 → 生产上线 → 持续平台授权。Distyl 的前线部署模式把工程师留在现场直到生产，从而压缩中间三个阶段。UiPath 数据显示，90% 的美国 IT 高管称其业务流程会因智能体 AI
              改善，52% 称智能体 AI 将支持复杂工作流自动化——说明买方意向广泛，尽管复杂项目从意向到采购的转化率仍不清楚。T-Mobile T-Life AI Assistant
              部署证明电信是活跃的生产垂直，而不只是愿景。
