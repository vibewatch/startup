      - number: '7.6'
        title: 缓释框架和退出标准
        blocks:
          - type: paragraph
            body: >-
              Distyl 的缓释叙事真实存在，但有条件。短期内资本不是约束：Series B
              给了管理层资源，用于强化控制、加深合作伙伴关系，并专业化法律和合规运营。公司也受益于强烈的生产导向叙事、头部合作伙伴和企业结果案例。不过，只有投资人把这些优点转化为可监控要求，它们才有意义。因此，最干净的缓释计划不是泛泛乐观，而是一小组不可谈判的尽调要求和
              thesis-break 触发器。在承销公司之前，投资人应要求拿到安全保证、相关场景下的医疗合规姿态、合作伙伴合同持久性、客户留存可见度、领导层 bench
              深度和基本保险覆盖的证据。任何关键领域出现实质失败，都应触发停止条件：没有外部控制证据、重大合作伙伴政策变化、无法缓释的领导层集中、客户工作非经常性或高度集中证据，或任何与隐私或医疗处理相关的监管认定。只有数据室能把今天的公开证据缺口变成可验证控制，而不是持续未知，Distyl
              才具备可投资性。
