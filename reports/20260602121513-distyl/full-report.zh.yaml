      - number: '2.2'
        title: TAM、SAM 与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              测算 Distyl 所处市场，必须把智能体 AI 工作流自动化与更宽泛的企业 AI 软件支出拆开。Grand View Research 估计，全球 RPA 市场——流程自动化最接近的成熟代理指标——2025
              年为 $4.68 billion，到 2033 年增至 $35.84 billion，CAGR 为 29%，其中云细分和知识型（AI 增强）运营增长最快。Mordor Intelligence 估计，智能体 AI
              市场——更精确的类别——2025 年为 $6.96 billion，到 2031 年达到 $57.42 billion，CAGR 为 42.14%，North America 占 2025 年收入的
              40%。MarketsAndMarkets 估算企业智能体 AI 细分市场 2025 年为 $6.76 billion，到 2030 年增至 $46.04 billion，CAGR 为
              47%。三种方法给出的绝对值差异很大，因为「AI platform」「AI agents」「RPA」和「AI services」之间的边界正随着存量厂商重新定位产品而变得模糊。对 Distyl
              而言，可服务市场（SAM）还要更窄：需要前线部署工程团队加持久 AI 平台的 Fortune 500 项目子集，集中在医疗、电信、金融服务和制造垂直。UiPath 的 $1.901 billion
              ARR、同比增长 12%，为成熟工作流自动化规模提供了上市公司基准；智能体 AI 预测增速远高得多，说明品类仍处早期。规模缺口章节保留了互相矛盾的估计和范围模糊性，尽调路径也说明更精确 SOM 计算需要哪些输入。
