      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Distyl AI 呈现出高增长、高不透明度的财务画像。公司以 $1.8B 独角兽估值从一线投资人（Lightspeed、Khosla、DST Global、Coatue、Dell）募得
              $202M，机构信念很强。但整个投资论证都压在单一头部估值和 CEO 关于盈利的说法上；没有审计财务、没有公开
              ARR、没有客户数量，也没有可供承销的毛利率数据。收入质量风险偏高：结果付费模式带来收入确认复杂性，如果关键客户停止合作，还可能出现悬崖式风险。资本强度风险中等：FDE 配置模式偏人力密集，在 51–200
              人规模、可用资金 $175M 的情况下，公司看起来足以支撑 2–4 年，但具体花钱速度未知。

              财务尽调清单很长。任何投资人或收购方都必须拿到：（1）FY2022–FY2025 经审计或管理层复核的财务报表；（2）按收入流拆分的 ARR 或收入（结果费用 vs. 授权费）；（3）按分部划分的毛利率；（4）按
              cohort 划分的净收入留存；（5）完全摊薄股本表及清算优先权栈；（6）最近月末现金余额和月度 burn；（7）投资人权利协议和任何 side-letter 条款；（8）包含
              ACV、初始期限、续约历史和高风险流失数据的客户合同。没有这些材料，任何估值承销都站不住脚。如果 $1.8B 估值由 $20–50M ARR 支撑（按这一阶段和投资人层级，36–100x ARR
              倍数的典型区间），就意味着强劲的成长期倍数，符合企业 AI 市场溢价；但没有实际 ARR，这一判断仍属推测。
