      - number: '2.5'
        title: 规模测算缺口、矛盾估计与尽调要求
        blocks:
          - type: paragraph
            body: >-
              公开来源无法为 Distyl 精确计算 SOM，原因有几个结构性限制。第一，没有分析师报告把「带嵌入工程的定制企业 AI 部署服务」与「企业 AI 平台授权」区分开来，而这正是 Distyl
              的两条收入流。第二，Grand View Research（2033 年 RPA $35.84 billion）、Mordor Intelligence（2031 年智能体 AI $57.42 billion）和
              MarketsAndMarkets（2030 年企业智能体 AI $46.04 billion）的市场规模数字采用不同范围定义，不能直接比较。RPA 类别低估智能体机会，因为它排除了定制 AI
              系统设计；「agentic AI」类别可能高估，因为其中包含不在 Distyl 竞争空间内的单用途聊天机器人和 copilot 工具。第三，Distyl
              披露的收入模型——结果挂钩费用加平台授权——没有公开类比公司可用于建立每项目收入基准。一个 Fortune 500 电信 AI 项目总合同价值可能为 $10–50
              million；服务与软件的拆分未知。第四，有效企业 AI 采纳率仍有争议：UiPath 数据显示 90% IT 高管有意使用智能体 AI，但 PwC 数据显示 2025
              年智能体部署中只有一部分创造了有意义价值。意向与实际采纳之间的缺口既是市场规模测算问题，也是拥有生产结果交付记录供应商的战略机会。
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM032
      - number: '2.6'
        title: 展示要点
        blocks:
          - type: callout
            title: 试点到生产缺口为 Distyl 创造结构性需求
            body: >-
              PwC 和 UiPath 数据都确认，企业在 AI 试点完成与生产部署之间存在巨大缺口。Distyl
              的前线部署工程加结果导向收费模式，直接解决这一缺口；咨询公司往往在试点后退出，软件平台则把工作交给内部团队，二者都难以做到这一点。这个结构性需求驱动不取决于技术创新——它源于企业购买和实施复杂 AI 系统的方式。
