      - number: '8.2'
        title: 建议和评级
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，Distyl 应给出继续研究建议、中等置信度、高风险评级和偏高估值立场。这不是抽象评价公司质量，而是相对于可得事实强调价格纪律。如果 Distyl 已经接近晚期私营 AI
              收入区间的上沿，并能守住类软件留存和利润率，当前 $1.8B 估值可能会被证明有吸引力。但这些变量没有一个公开。公开可见的是叙事强度与财务披露之间的不对称。Distyl
              有强客户和合作伙伴证明，但没有公开证据让外部投资人把这些证明转化为可承销经济性。因此，仅看公开资料的买方缺乏信息，无法判断公司按绝对口径是便宜、公允还是昂贵。审慎建议是保持跟踪，而不是过早形成强信念。
