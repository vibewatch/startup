    summary: 定性风险矩阵，对比 Distyl 主要风险桶的可能性、影响、缓解成熟度和剩余严重性。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 剩余严重性
      rows:
        - label: 监管 / 法律
          values:
            - 中-高
            - 高
            - 低-中
            - 高
        - label: 技术 / 伙伴依赖
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 运营 / 安全
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 法律 / IP
          values:
            - 中
            - 中-高
            - 低-中
            - 中-高
        - label: 市场 / 竞争
          values:
            - 高
            - 中-高
            - 低-中
            - 高
    approximationNotes: 热力图得分只是基于公开证据的分析师判断；Distyl 未发布内部风险登记册。
    claimRefs:
      - CR018
      - CR021
      - CR024
      - CR028
      - CR029
      - CR034
  - id: FR002
    title: Distyl 风险传导图
    type: dag
    layout: wide
    summary: 有向图展示控制证据缺口、伙伴依赖和薄弱留存证据，如何流入收入、合规和估值风险。
    data:
      nodes:
        - id: n1
          label: 控制证据缺失
          type: risk-source
        - id: n2
          label: 伙伴政策 / 定价冲击
          type: risk-source
        - id: n3
          label: 留存弱 / 项目化收入
          type: risk-source
        - id: n4
          label: 安全或隐私事件
          type: intermediate
        - id: n5
          label: 部署放缓
          type: intermediate
        - id: n6
          label: 客户流失 / 扩张走弱
          type: intermediate
        - id: n7
          label: 利润率压缩
          type: intermediate
        - id: n8
          label: 估值折价 / 尽调失败
          type: outcome
      edges:
        - from: n1
          to: n4
          label: 控制缺口提高事件发生可能性
        - from: n1
          to: n5
          label: 缺少保证材料会拖慢采购
        - from: n2
          to: n5
          label: 路线图或定价变化延迟部署
        - from: n2
          to: n7
          label: 推理或平台成本上升
        - from: n3
          to: n6
          label: 项目工作不像 SaaS 那样续约
        - from: n4
          to: n6
          label: 事件损害信任和续约
        - from: n5
          to: n6
          label: 上线变慢削弱扩张
        - from: n6
          to: n8
          label: 增长耐久性恶化
        - from: n7
          to: n8
          label: 软件倍数压缩
    approximationNotes: 边方向反映承保逻辑，而非量化概率。
    claimRefs:
      - CR024
      - CR025
      - CR028
      - CR029
      - CR030
      - CR031
      - CR041
  - id: FR003
    title: Distyl 依赖图
    type: dag
    layout: wide
    summary: Distyl 可见伙伴和能力栈的依赖图，从模型提供商和基础设施，一直到企业交付和收入兑现。
    data:
      nodes:
        - id: d1
          label: 基础模型
          type: supplier
        - id: d2
          label: Google Cloud / Gemini Enterprise（云渠道）
          type: partner
        - id: d3
          label: NVIDIA AI Enterprise（企业 AI 栈）
          type: partner
        - id: d4
          label: Distyl 平台 + 交付团队
          type: core
        - id: d5
          label: Fortune 500 客户部署
          type: customer
        - id: d6
          label: 基于成果的收入兑现
          type: outcome
      edges:
        - from: d1
          to: d4
          label: 推理能力和 APIs
        - from: d2
          to: d4
          label: 云与企业项目撬动
        - from: d3
          to: d4
          label: 企业智能体基础设施
        - from: d4
          to: d5
          label: 部署并运营客户系统
        - from: d5
          to: d6
          label: 成果转化为收入
    approximationNotes: 公开证据能看出依赖类别，但看不到确切合同条款，也看不到各供应商的集中度。
    claimRefs:
      - CR008
      - CR009
      - CR026
      - CR027
      - CR028
  - id: FV001
    title: Distyl 推荐逻辑
    type: dag
    layout: wide
    summary: 逻辑图把可见优势和缺失的财务证据串起来，指向继续研究的建议。
    data:
      nodes:
        - id: n1
          label: 客户验证
          type: support
        - id: n2
          label: Google / NVIDIA 背书
          type: support
        - id: n3
          label: Series B 融资信号
          type: support
        - id: n4
          label: 未披露收入
          type: constraint
        - id: n5
          label: 未披露留存 / 利润率
          type: constraint
        - id: n6
          label: 公开可比公司要求价格纪律
          type: constraint
        - id: n7
          label: 继续研究 / 高风险 / 估值偏高
          type: decision
      edges:
        - from: n1
          to: n7
          label: 支持
        - from: n2
          to: n7
          label: 支持
        - from: n3
          to: n7
          label: 支持
        - from: n4
          to: n7
          label: 约束
        - from: n5
          to: n7
          label: 约束
        - from: n6
          to: n7
          label: 约束
    approximationNotes: 这张图表达方向关系，不是概率模型；它概括了为什么只靠公开证据，还不能上调投资建议。
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV010
      - CV034
      - CV035
      - CV036
  - id: FV002
    title: Distyl 估值敏感性
    type: range
    layout: wide
    summary: 隐含企业价值对收入结果和公开市场倍数假设的敏感度。
    data:
      items:
        - label: 100M 收入 @ 4x–8x
          low: 0.4
          mid: 0.6
          high: 0.8
        - label: 150M 收入 @ 7x–10x
          low: 1.05
          mid: 1.28
          high: 1.5
        - label: 180M 收入 @ 10x
          low: 1.8
          mid: 1.8
          high: 1.8
        - label: 250M 收入 @ 10x–12x
          low: 2.5
          mid: 2.75
          high: 3
    approximationNotes: 数值单位为十亿美元，属于示例情景输出，不是公司指引。
    claimRefs:
      - CV013
      - CV016
      - CV019
      - CV022
      - CV027
      - CV028
      - CV029
  - id: FV003
    title: Distyl 估值回报区间
    type: range
    layout: wide
    summary: 在悲观、基准、乐观情景下，示例价值结果与当前 $1.8B 入场估值的对比。
    data:
      items:
        - label: 悲观情景
          low: 0.3
          mid: 0.5
          high: 0.75
        - label: 基准情景
          low: 1.05
          mid: 1.4
          high: 1.8
        - label: 乐观情景
          low: 2.5
          mid: 3
          high: 3.6
        - label: 当前入场估值
          low: 1.8
          mid: 1.8
          high: 1.8
    approximationNotes: 数值单位为十亿美元。基准情景只有高端才触及当前入场估值，说明在披露不够强的情况下，安全边际很薄。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: Distyl 投资 KPI
    type: kpi
    layout: standard
    summary: 基于公开证据的 Distyl 评分卡，覆盖投委会初筛最关心的维度。
    data:
      items:
        - label: 客户验证
          value: 4 / 5
          detail: 具名行业和成果说法较强，但续约细节有限
          claimRefs:
            - CV003
            - CV004
            - CV044
        - label: 合作伙伴杠杆
          value: 4 / 5
          detail: Google Cloud 和 NVIDIA 增强可信度，也补上分销叙事
          claimRefs:
            - CV009
            - CV010
            - CV033
        - label: 财务透明度
          value: 1 / 5
          detail: 未公开收入、毛利率、留存或客户集中度数据
          claimRefs:
            - CV005
            - CV006
        - label: 估值纪律
          value: 2 / 5
          detail: 若没有更强收入证据，公开可比公司无法清楚支撑当前价格
          claimRefs:
            - CV026
            - CV027
            - CV028
            - CV029
        - label: 退出准备度
          value: 2 / 5
          detail: 融资动能存在，但披露还没达到 IPO 水平
          claimRefs:
            - CV001
            - CV043
        - label: 仅凭公开信息的整体可投资性
          value: 2 / 5
          detail: 在经济性和优先股堆叠披露前，维持继续研究
          claimRefs:
            - CV034
            - CV035
            - CV036
            - CV042
    approximationNotes: 评分只是基于公开证据的判断；若能进入数据室，多个维度可能很快变化。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV009
      - CV010
      - CV026
      - CV027
      - CV028
      - CV029
      - CV034
      - CV035
      - CV036
      - CV042
      - CV043
      - CV044
