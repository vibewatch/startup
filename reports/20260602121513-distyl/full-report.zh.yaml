  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Distyl AI 位于企业 AI 系统交付与工作流自动化的交叉处，比通用市场报告所称的整体「enterprise AI」类别更窄。相关支出边界覆盖三部分：（1）Fortune 500 运营团队的 AI
              系统设计与部署项目，（2）Distillery AI 平台用于持续 AI 工作流管理的授权费，以及（3）Distyl 打包进纵向一体化模式的研究和评估服务。可服务市场不包括：原始基础模型 API 成本（支付给
              OpenAI、Anthropic 或云厂商）、横向云基础设施（Microsoft Azure）、没有 AI 编排层的通用 RPA 授权，以及独立分析或 BI 工具。Fortune 500 买家若不选择
              Distyl，主要替代方案包括：大型咨询公司（Accenture、Deloitte、BCG），用按工时材料计费的方式配置 AI
              转型项目人员；既有自动化平台（UiPath、ServiceNow、Pega），在现有企业足迹内提供预构建 AI 智能体；以及用基础模型 API
              和工程人力内部「自建」。每类替代方案对应买方待完成任务的不同切片：咨询公司提供战略和交付带宽，但不提供持久 AI
              平台；自动化存量厂商提供托管软件层，但不提供深度定制工作流工程；内部方案控制力最大，但需要买家通常缺乏的稀缺 AI 工程人才。Distyl 的定位正是三者都不足的空档：可投产、定制化 AI
              系统，嵌入客户运营，并对业务结果负责。
